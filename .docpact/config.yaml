version: 1
layout: repo
lastReviewedAt: "2026-09-16"
lastReviewedCommit: 5f8cf532dca2812762cb45f560b166a63ac7db61
lastReviewedNote: "Reviewed for PCR #26: page and catalog metadata summaries are a bounded projection of each page's own source scope - a record uses its own opening, a chapter only its own nodes, a domain or subdomain its actual category title and live record count - so no two pages of one language publish the same description. The shared content report drops from 446 duplicate-description leads in 162 groups to 0, with 0 duplicate titles and 0 missing inbound links over 1775 grouped pages. 112 of 1782 summaries are title-only because their own scope carries only headings and rule tables; that residual is counted in .generated/report.json and printed by the generation stage, never padded. Canonical bytes, rendered block order, download hashes, required languages, optional locales, lifecycle and index policy are unchanged: 1786 pages and 12758 export files are unchanged in count, all 2981 downloads remain byte-identical to their canonical source, the relocated full corpus build and the shared checker pass, and 57 package tests pass. Description quality remains a presentation projection, not evidence about methodology coverage; hosted CI, provider environment and production samples remain pending."

catalog:
  repos:
    - id: pcr
      path: .
      canonicalRepo: tiangong-lca/pcr
      entryDoc: AGENTS.md
      workflowDocs:
        - README.md
        - docs/architecture.md
        - docs/authoring-guide.md
        - docs/classification-policy.md
        - docs/pcr-library-release-policy.md
        - docs/pcr-documentation-site-contract.md
      workspaceIntegrationRequired: true

ownership:
  domains:
    - id: repo-governance-and-docs
      paths:
        include:
          - AGENTS.md
          - README.md
          - .docpact/config.yaml
          - .gitignore
          - .gitattributes
          - edgeone.json
          - .github/workflows/**
          - docs/**
      ownerRepo: pcr
    - id: builder-cli-and-schemas
      paths:
        include:
          - package.json
          - builder/**
      ownerRepo: pcr
    - id: classification-sources-and-mappings
      paths:
        include:
          - classifications/**
      ownerRepo: pcr
    - id: reusable-method-modules
      paths:
        include:
          - library/modules/**
          - library/indexes/**
          - library/catalog.yaml
      ownerRepo: pcr
    - id: pcr-consumption-tools
      paths:
        include:
          - packages/**
          - scripts/vendor/workspace-seo/**
          - skills/**
          - .github/ISSUE_TEMPLATE/**
      ownerRepo: pcr

coverage:
  include:
    - .gitattributes
    - scripts/vendor/workspace-seo/**
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - .gitignore
    - docs/**
    - package.json
    - edgeone.json
    - builder/**
    - classifications/**
    - packages/**
    - skills/**
    - .github/workflows/**
    - .github/ISSUE_TEMPLATE/**
    - library/catalog.yaml
    - library/indexes/**
    - library/modules/**
  exclude:
    - .git/**
    - .docpact/runs/**
    - node_modules/**
    - dist/**
    - packages/pcr-docs/node_modules/**
    - packages/pcr-docs/.generated/**
    - packages/pcr-docs/.generated-stage-*/**
    - packages/pcr-docs/.next/**
    - packages/pcr-docs/out/**
    - packages/pcr-docs/public/generated/**
    - coverage/**
    - library/pcrs/**
    - "*.log"

freshness:
  warn_after_commits: 40
  warn_after_days: 60
  critical_after_days: 120

routing:
  intents:
    repo-docs:
      paths:
        - AGENTS.md
        - README.md
        - .docpact/config.yaml
        - .gitignore
        - docs/**
    builder:
      paths:
        - package.json
        - builder/**
    classification:
      paths:
        - classifications/**
        - docs/classification-policy.md
    modules:
      paths:
        - library/modules/**
        - library/indexes/**
        - library/catalog.yaml
        - docs/authoring-guide.md
    proof:
      paths:
        - package.json
        - builder/cli/**
        - builder/scripts/**
        - .github/workflows/**
    consumption:
      paths:
        - packages/**
        - skills/**
        - .github/ISSUE_TEMPLATE/**
        - README.md
        - docs/architecture.md

docInventory:
  include:
    - AGENTS.md
    - README.md
    - .docpact/config.yaml
    - docs/architecture.md
    - docs/authoring-guide.md
    - docs/classification-policy.md
    - docs/pcr-library-release-policy.md
    - docs/pcr-documentation-site-contract.md

repo:
  id: pcr
  owner: pcr

rules:
  - id: pcr-bootstrap-contract
    scope: repo
    repo: pcr
    triggers:
      - path: AGENTS.md
        kind: repo-contract
      - path: README.md
        kind: repo-landing
      - path: .docpact/config.yaml
        kind: docpact-config
      - path: .gitignore
        kind: repo-ignore-policy
      - path: .gitattributes
        kind: generated-snapshot-encoding
      - path: .github/workflows/**
        kind: repo-validation-workflow
      - path: docs/**
        kind: repo-doc
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
    reason: Repository entry docs, architecture, and authoring guidance must stay aligned with PCR identity and builder contracts.
  - id: pcr-builder-contract
    scope: repo
    repo: pcr
    triggers:
      - path: package.json
        kind: package-script
      - path: builder/**
        kind: builder-surface
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
    reason: Builder CLI, templates, and schemas define how PCR records are generated and validated.
  - id: pcr-release-policy-contract
    scope: repo
    repo: pcr
    triggers:
      - path: builder/cli/index.mjs
        kind: release-command-entry
      - path: builder/lib/builder-operations.mjs
        kind: release-operations
      - path: builder/lib/published-revision-state.mjs
        kind: release-state
      - path: builder/lib/pcr-directory-transaction.mjs
        kind: release-transaction
      - path: docs/pcr-library-release-policy.md
        kind: release-policy
    requiredDocs:
      - path: docs/pcr-library-release-policy.md
        mode: review_or_update
      - path: AGENTS.md
        mode: review_or_update
    reason: Publication, revision and recovery changes must retain the immutable release-chain policy and its agent-facing boundary.
  - id: pcr-classification-contract
    scope: repo
    repo: pcr
    triggers:
      - path: classifications/**
        kind: classification-source-or-mapping
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: docs/classification-policy.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Classification source and mapping changes must preserve the boundary between external classification systems and canonical PCR identity.
  - id: pcr-module-contract
    scope: repo
    repo: pcr
    triggers:
      - path: library/modules/**
        kind: method-module
      - path: library/indexes/**
        kind: pcr-index
      - path: library/catalog.yaml
        kind: pcr-catalog
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
    reason: Reusable method modules and indexes are shared PCR authoring surfaces.
  - id: pcr-consumption-contract
    scope: repo
    repo: pcr
    triggers:
      - path: packages/**
        kind: public-consumption-tooling
      - path: skills/**
        kind: agent-skill
      - path: .github/ISSUE_TEMPLATE/**
        kind: feedback-intake-surface
    requiredDocs:
      - path: AGENTS.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: docs/authoring-guide.md
        mode: review_or_update
      - path: .docpact/config.yaml
        mode: review_or_update
    reason: Public PCR consumption tools and feedback intake surfaces must stay aligned with repository boundaries and authoring workflows.

  - id: pcr-documentation-site
    scope: repo
    repo: pcr
    triggers:
      - path: packages/pcr-docs/**
        kind: generated-public-documentation
      - path: scripts/vendor/workspace-seo/**
        kind: generated-build-and-proof
      - path: packages/pcr-core/src/languages.mjs
        kind: source-language-contract
      - path: packages/pcr-core/src/index.mjs
        kind: canonical-document-reader
      - path: builder/lib/pcr-document-history.mjs
        kind: historical-document-reader
      - path: edgeone.json
        kind: static-production-hosting
    requiredDocs:
      - path: docs/pcr-documentation-site-contract.md
        mode: review_or_update
      - path: docs/architecture.md
        mode: review_or_update
      - path: README.md
        mode: review_or_update
    reason: Public documents must retain complete canonical text, exact artifacts, language and lifecycle identities, and the static production contract.
