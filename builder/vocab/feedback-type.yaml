schema_version: 1
vocab: feedback_type
values:
  missing_pcr:
    description: No suitable canonical PCR record exists.
  classification_mapping_gap:
    description: A classification code lacks a correct deterministic PCR mapping.
  unclear_reference_flow:
    description: Reference-flow identity or qualifiers are unclear.
  wrong_or_missing_uuid:
    description: A Tiangong UUID reference is missing or incorrect.
  process_boundary_issue:
    description: The foreground process boundary is incomplete or incorrect.
  inventory_flow_gap:
    description: A required process inventory flow is missing or unclear.
  range_evidence_update:
    description: Quantitative range evidence should be added or updated.
  unit_or_flow_property_issue:
    description: A unit or flow-property requirement is incorrect or unclear.
  validation_rule_issue:
    description: A validation rule is missing, incorrect, or not executable as expected.
  translation_mismatch:
    description: Localized PCR content diverges from the canonical methodology.
  source_update:
    description: A source reference or its use should be updated.
