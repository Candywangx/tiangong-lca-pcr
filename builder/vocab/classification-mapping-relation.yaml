schema_version: 1
vocab: classification_mapping_relation
values:
  exact:
    description: The classification code and PCR category have the same intended scope.
  broader:
    description: The mapped PCR is broader than the classification code.
  narrower:
    description: The mapped PCR is narrower than the classification code.
  proxy:
    description: The PCR is an explicit proxy rather than a scope-equivalent match.
  manual_review:
    description: A maintainer must review the mapping before methodology selection.
