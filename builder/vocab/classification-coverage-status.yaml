schema_version: 1
vocab: classification_coverage_status
values:
  mapped:
    description: The normalized classification leaf has an accepted mapping to a material PCR.
  unmapped:
    description: The leaf is known but has no accepted material PCR mapping.
  candidate_suggestion:
    description: Candidate scope evidence exists but must not be selected as a canonical PCR mapping.
  manual_review:
    description: Conflicting or uncertain mapping evidence requires explicit maintainer review.
  unknown:
    description: Source, mapping, or migration inconsistency prevents a stable coverage determination.
