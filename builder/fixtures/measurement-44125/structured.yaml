allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "shared manufacturing operations"
    rule: "Avoid allocation by subdividing meters, material issues, and waste records to the manufacturing order whenever feasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_causal_basis
    applies_to: "residual shared operations"
    rule: "When subdivision is not feasible, allocate a shared record using a documented causal physical driver consistent across the reporting period; disclose the driver and calculation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_scrap_route
    applies_to: "steel scrap"
    rule: "Record segregated steel scrap to its declared receiving treatment route; do not credit recovery unless downstream modelling and receiving route are disclosed."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_issue
      process_id: "component_fabrication"
      flow_role: "steel plate and structural sections"
      record_type: "material issue and return records"
      raw_fields: "order id; material grade; specification; mass issued; mass returned; supplier route"
      collection_method: "calibrated scale and traceable inventory record"
      unit: "kg"
      frequency: "each order"
      temporal_coverage: "reported production period"
      site_scope: "reporting facility"
      aggregation_rule: "net issued mass / accepted balers of the declared configuration"
      quality_evidence: "reconciled issue, return, and stock records"
    - protocol_id: cp_component_installation
      process_id: "component_fabrication_and_final_assembly_acceptance"
      flow_role: "declared purchased components and factory-fill lubricant"
      record_type: "controlled BOM, receipt, installation, and fill records"
      raw_fields: "manufacturer; model; serial range; configuration option; order id; component number; supplier; quantity or mass installed; rejected or returned quantity"
      collection_method: "configuration-controlled BOM reconciled to traceable assembly and issue records"
      unit: "item or kg"
      frequency: "each order"
      temporal_coverage: "reported production period"
      site_scope: "reporting facility"
      aggregation_rule: "installed quantity or net fill / accepted balers of the exact configuration"
      quality_evidence: "signed BOM revision, part traceability, issue/return record, and acceptance record"
    - protocol_id: cp_energy_records
      process_id: "component_fabrication"
      flow_role: "electricity and natural gas"
      record_type: "meter record and allocation worksheet"
      raw_fields: "meter id; reading; energy unit; gas conditions; operating time; order allocation driver"
      collection_method: "calibrated meter and allocation worksheet"
      unit: "MJ or m3"
      frequency: "each interval"
      temporal_coverage: "reported production period"
      site_scope: "reporting facility"
      aggregation_rule: "attributable meter total / accepted balers"
      quality_evidence: "meter calibration and utility reconciliation"
    - protocol_id: cp_welding_records
      process_id: "component_fabrication"
      flow_role: "welding wire and shielding gas"
      record_type: "consumable issue record"
      raw_fields: "welding route; wire specification; gas composition; issued; returned; order id"
