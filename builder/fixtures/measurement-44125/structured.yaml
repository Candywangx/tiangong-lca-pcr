      collection_method: "batch record, scale, and meter"
      unit: "kg"
      frequency: "each coating batch"
      temporal_coverage: "reported production period"
      site_scope: "reporting facility"
      aggregation_rule: "net input / coated accepted balers"
      quality_evidence: "batch reconciliation and coating-process record"
    - protocol_id: cp_coating_outputs
      process_id: "surface_finish"
      flow_role: "pretreatment wastewater and waste powder overspray"
      record_type: "flow-meter, scale, mass-balance, and dispatch records"
      raw_fields: "coating route; water input; recirculated water; discharged or dispatched wastewater; powder issued; powder recovered to use; waste powder; receiving route; order allocation"
      collection_method: "calibrated meter and scale reconciled to batch and dispatch records"
      unit: "kg"
      frequency: "each batch or dispatch"
      temporal_coverage: "reported production period"
      site_scope: "reporting facility"
      aggregation_rule: "measured output / coated accepted balers with documented allocation"
      quality_evidence: "batch balance, internal-recirculation record, and receiving record"
    - protocol_id: cp_combustion_emissions
      process_id: "surface_finish"
      flow_role: "fossil carbon dioxide from curing-gas combustion"
      record_type: "stack measurement or metered-gas carbon calculation"
      raw_fields: "gas meter reading and reference conditions; supplier composition or measured fossil-carbon content; oxidation basis; control boundary; accepted coated units"
      collection_method: "documented stack measurement or carbon mass balance"
      unit: "kg"
      frequency: "each campaign or reporting interval"
      temporal_coverage: "reported production period"
      site_scope: "reporting facility"
      aggregation_rule: "direct fossil CO2 / coated accepted balers with matching gas-use allocation"
