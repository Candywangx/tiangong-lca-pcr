      site_scope: "reporting facility"
      aggregation_rule: "recorded quantity / accepted balers with documented allocation"
      quality_evidence: "receiving record, control log, and test report"
  calculation_rules:
    - id: calc_net_material_issue
      applies_to: "steel, welding wire, and powder coating"
      rule: "Net issue = issued mass − documented returned or recovered mass; divide by accepted balers of the declared configuration."
      inputs:
        - issue
        - return
        - recovery
        - "acceptance records"
      output: "normalized material input"
      source_ids: []
    - id: calc_metered_energy
      applies_to: "electricity and natural gas"
      rule: "Attribute metered consumption with a documented causal driver when no dedicated meter exists; divide by accepted balers."
      inputs:
        - "meter readings"
        - "gas conditions"
        - "operating time"
        - "allocation driver"
        - "acceptance records"
      output: "normalized energy or gas input"
      source_ids:
        - iso-14044-2006
    - id: calc_direct_release
      applies_to: "direct particulate and NMVOC"
      rule: "Normalize measured or mass-balanced release after the declared control boundary to accepted balers for the matching period and route."
      inputs:
        - "emission measurement or mass balance"
        - "control boundary"
        - "acceptance records"
      output: "normalized elementary emission"
      source_ids:
        - epa-ap42-electric-arc-welding-1995
        - epa-metal-parts-surface-coating-tsd-2001
    - id: calc_controlled_bom
      applies_to: "purchased components and factory-fill lubricant"
      rule: "Select exactly one model, serial-number range, and route configuration; include each applicable atomic BOM line once, replace on-site-fabricated component rows with their material exchanges, subtract documented returns, and divide by accepted units of the same configuration."
      inputs:
        - "signed BOM revision"
        - "part receipts"
        - "installation or fill records"
        - returns
        - "accepted units"
      output: "normalized configured component or consumable input"
      source_ids:
        - john-deere-tm3300-2010
    - id: calc_coating_residuals
      applies_to: "wastewater and powder overspray"
      rule: "For each declared coating batch, report measured wastewater leaving the foreground boundary net of internal recirculation and measured powder waste dispatched net of powder returned to the same process; do not infer either output as an unverified difference."
      inputs:
        - "water and powder batch inputs"
        - "recirculation/recovery records"
        - "output measurements"
        - "dispatch records"
        - "accepted coated units"
      output: "normalized wastewater and powder-waste outputs"
      source_ids:
        - epa-metal-parts-surface-coating-tsd-2001
    - id: calc_natural_gas_co2
      applies_to: "direct fossil CO2 from curing"
      rule: "Use a direct measurement or calculate fossil CO2 = metered gas volume at stated conditions × documented fossil-carbon mass per gas volume × documented oxidation fraction × 44/12; normalize to coated accepted units sharing the gas allocation. No undocumented default composition or oxidation factor is permitted."
      inputs:
        - "gas volume and conditions"
        - "supplier composition or measured fossil-carbon content"
        - "oxidation evidence"
        - "accepted coated units"
      output: "normalized direct fossil CO2 emission"
      source_ids: []
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "reference product and components"
      requirement: "Retain configuration, baler type, pickup fitment, net mass, and component specifications; do not combine different configurations without disclosure."
      evidence: "acceptance record and controlled bill of materials"
    - id: dq_bom_instantiation
      applies_to: "complete-baler component inputs"
      requirement: "Reconcile the accepted unit to one signed BOM revision and one serial/configuration record. Explain each difference from the representative 568/578 architecture and demonstrate that pickup, bale chamber, transmission, hydraulic, bearings, wheels/brakes, tying, controls, and factory-fill consumables are included, manufactured on site through other rows, or explicitly not applicable."
      evidence: "BOM reconciliation and configuration deviation log"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one declared reporting period and retain dates for records and emission measurements."
      evidence: "dated primary records"
    - id: dq_boundary
      applies_to: "conditional welding and coating"
      requirement: "State whether welding, pretreatment, coating, flash-off, curing, and controls occur at the reporting facility."
      evidence: "process map, work instructions, and control log"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Disclose missing flows, UUID gaps, omitted routes, allocation drivers, and upstream datasets."
      evidence: "data-package completeness statement"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference product"
    rule: "Confirm that the output is one complete accepted baler, not an agricultural straw flow or unfinished baler subassembly."
    source_ids:
      - un-cpc-3-0-structure-2025
  - rule_id: validation_mass_and_configuration
    applies_to: "reference flow"
    rule: "Check net accepted mass, baler type, pickup status, facility, and production period before normalization."
    source_ids: []
  - rule_id: validation_route_conditions
    applies_to: "conditional rows"
    rule: "Include coating and welding rows only when their route applies; verify associated meter, material, waste, and emission records."
    source_ids:
      - epa-ap42-electric-arc-welding-1995
      - epa-metal-parts-surface-coating-tsd-2001
  - rule_id: validation_bom_closure
    applies_to: "final assembly inputs"
    rule: "Verify one controlled model/serial/configuration and reconcile every installed purchased component and factory-fill consumable to the accepted unit; fail if an alternative configuration is mixed into the same inventory."
    source_ids:
      - john-deere-tm3300-2010
  - rule_id: validation_coating_output_closure
    applies_to: "surface preparation and coating"
    rule: "When aqueous pretreatment, powder coating, or natural-gas curing applies, require the corresponding measured wastewater, measured waste-powder, and direct fossil-CO2 row or a documented zero/not-applicable determination supported by the actual route."
    source_ids:
      - epa-metal-parts-surface-coating-tsd-2001
  - rule_id: validation_uuid_resolution
    applies_to: "unresolved flow rows"
    rule: "Do not use proxies for unresolved UUIDs; resolve only after exact flow identity, product state, property, and unit are confirmed."
    source_ids: []
  - rule_id: validation_balance
    applies_to: "material and waste records"
    rule: "Reconcile material issues, returns, finished output, and scrap dispatch; investigate unexplained differences."
    source_ids: []
