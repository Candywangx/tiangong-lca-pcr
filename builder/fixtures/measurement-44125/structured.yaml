      flow_role: "steel scrap, welding PM10, and coating NMVOC"
      record_type: "dispatch record or emission measurement"
      raw_fields: "stream identity; mass; control device; sampling method; receiving route; allocation"
      collection_method: "scale, dispatch record, or documented emission test"
      unit: "kg"
      frequency: "dispatch or campaign"
