name: Publish PCR product release

on:
  push:
    tags: ['v*', 'pcr-v*', 'library-v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag; run this workflow at the same tag ref.
        required: true
        type: string
      bootstrap:
        description: First publication of an unregistered npm name using the temporary environment secret.
        type: boolean
        default: false
      retry_web:
        description: Retry a same-source Webhook only after confirming the prior provider deployment is terminal.
        type: boolean
        default: false
      retry_npm:
        description: Retry one package only after confirming its prior upload was rejected or never accepted.
        type: choice
        default: none
        options: [none, tool, library]

permissions:
  contents: read

concurrency:
  group: pcr-product-release
  cancel-in-progress: false

jobs:
  release-context:
    if: (vars.PCR_PRODUCT_RELEASE_ENABLED == 'true' || vars.PCR_NPM_RELEASE_ENABLED == 'true') && github.repository == 'tiangong-lca/pcr' && github.repository_id == '1277836444' && github.repository_owner_id == '327771381'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      dist_tag: ${{ steps.context.outputs.dist_tag }}
      product: ${{ steps.context.outputs.product }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Refresh main and tags
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git fetch --force origin '+refs/tags/*:refs/tags/*'
      - name: Bind release to canonical repository, main, tag and version
        id: context
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
          PRODUCT_ENABLED: ${{ vars.PCR_PRODUCT_RELEASE_ENABLED }}
          LEGACY_ENABLED: ${{ vars.PCR_NPM_RELEASE_ENABLED }}
          LEGACY_BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          if [[ "$RELEASE_TAG" == v* ]]; then
            test "$PRODUCT_ENABLED" = true
            test "$LEGACY_BOOTSTRAP" != true
            node builder/scripts/product-release.mjs context "$RELEASE_TAG"
            echo 'product=true' >> "$GITHUB_OUTPUT"
          else
            test "$LEGACY_ENABLED" = true
            test ! -f product-release.json
            node builder/scripts/npm-release.mjs context "$RELEASE_TAG"
            echo 'product=false' >> "$GITHUB_OUTPUT"
          fi

  quality-gate:
    needs: release-context
    uses: ./.github/workflows/validate.yml
    with:
      product_tag: ${{ needs.release-context.outputs.product == 'true' && needs.release-context.outputs.tag || '' }}

  product-publish:
    if: needs.release-context.outputs.product == 'true'
    needs: [release-context, quality-gate]
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Select the pinned OIDC publishing toolchain
        run: npm install --global npm@12.2.0 --ignore-scripts --no-audit --no-fund
      - name: Verify the pinned product toolchain
        run: npm run runtime:release
      - name: Revalidate exact product tag after qualification and environment admission
        env:
          PRODUCT_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git fetch --force origin '+refs/tags/*:refs/tags/*'
          node builder/scripts/product-release.mjs context "$PRODUCT_TAG"
      - name: Download only the qualified product bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.quality-gate.outputs.product_artifact_id }}
          path: dist/product-release
          merge-multiple: true
          digest-mismatch: error
      - name: Verify, resume and publish the coordinated release
        env:
          GH_TOKEN: ${{ github.token }}
          PCR_PRODUCT_BUILD_ARTIFACT_ID: ${{ needs.quality-gate.outputs.product_artifact_id }}
          PCR_NPM_DIST_TAG_OIDC_ENABLED: ${{ vars.PCR_NPM_DIST_TAG_OIDC_ENABLED }}
          PCR_EDGEONE_PROJECT_ID: makers-5hadzwjpsblu
          PCR_EDGEONE_DEPLOY_HOOK_URL: ${{ secrets.PCR_EDGEONE_DEPLOY_HOOK_URL }}
          PCR_RETRY_WEB: ${{ inputs.retry_web }}
          PCR_RETRY_NPM: ${{ inputs.retry_npm || 'none' }}
        run: node builder/scripts/product-publish.mjs dist/product-release
      - name: Preserve the attempt journal even when a target remains pending
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pcr-product-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/product-release/attempt*.json
          if-no-files-found: warn
          retention-days: 30

  npm-publish:
    if: needs.release-context.outputs.product != 'true'
    needs: [release-context, quality-gate]
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
      DIST_TAG: ${{ needs.release-context.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: Recheck tag after validation and environment approval
        run: |
          git fetch origin +refs/heads/main:refs/remotes/origin/main
          git fetch --force origin '+refs/tags/*:refs/tags/*'
          node builder/scripts/npm-release.mjs context "$RELEASE_TAG"
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact publishable tarball and offline assets
        run: npm run release:build -- "$RELEASE_TAG" dist/npm-release
      - name: Verify transport checksums and detect safe retry
        id: registry
        run: |
          (cd dist/npm-release && sha256sum --check SHA256SUMS)
          node builder/scripts/npm-release.mjs registry dist/npm-release/release.json
      - name: Publish through npm trusted publisher
        if: steps.registry.outputs.registry_state == 'missing' && inputs.bootstrap != true
        run: |
          node builder/scripts/npm-release.mjs channel "$RELEASE_TAG"
          npm publish dist/npm-release/*.tgz --access public --provenance --ignore-scripts --tag "$DIST_TAG"
      - name: Bootstrap an unregistered package with an explicitly supplied temporary token
        if: steps.registry.outputs.registry_state == 'missing' && inputs.bootstrap == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PCR_NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'Missing npm-release environment secret PCR_NPM_BOOTSTRAP_TOKEN' >&2; exit 1; }
          node builder/scripts/npm-release.mjs bootstrap "$RELEASE_TAG"
          npm publish dist/npm-release/*.tgz --access public --provenance --ignore-scripts --tag "$DIST_TAG"
      - name: Attach offline assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            flags=()
            if [ "$DIST_TAG" = next ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes "Offline PCR distribution. See release.json for the exact source commit and SHA256SUMS for transport verification. Package release does not approve PCR methodology." "${flags[@]}"
          fi
          assets=(dist/npm-release/*.tgz dist/npm-release/release.json dist/npm-release/SHA256SUMS)
          if [ -f dist/npm-release/library.sqlite ]; then assets+=(dist/npm-release/library.sqlite dist/npm-release/library.sqlite.json); fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${assets[@]}" --clobber
      - name: Preserve build evidence, including on publication failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/npm-release/*.tgz
            dist/npm-release/release.json
            dist/npm-release/SHA256SUMS
            dist/npm-release/library.sqlite*
          if-no-files-found: warn
          retention-days: 30
