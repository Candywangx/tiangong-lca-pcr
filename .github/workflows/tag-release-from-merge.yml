name: Tag PCR product releases from main

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Explicit first product tag or exact existing tag to resume, matching current main's product version.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pcr-product-tag
  cancel-in-progress: false

jobs:
  release-context:
    if: github.repository == 'tiangong-lca/pcr' && github.repository_id == '1277836444' && github.repository_owner_id == '327771381'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Detect one authoritative product version change
        id: detect
        env:
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'any_changed=true' >> "$GITHUB_OUTPUT"
          else
            node builder/scripts/product-release.ts detect
          fi

  tag-release:
    needs: release-context
    if: needs.release-context.outputs.changed == 'true' && vars.PCR_PRODUCT_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Refresh main ancestry
        run: git fetch origin +refs/heads/main:refs/remotes/origin/main
      - name: Create an immutable product tag and dispatch full qualification and publication
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.before }}
          HEAD_REF: ${{ github.sha }}
          PRODUCT_TAG: ${{ inputs.tag_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node builder/scripts/product-release.ts tag "$PRODUCT_TAG"
          else
            node builder/scripts/product-release.ts tag
          fi
