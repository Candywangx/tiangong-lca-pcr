name: Validate PCR library

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PDF text extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v

      - name: Validate library contracts
        run: npm run validate

  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out complete source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up production documentation runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/pcr-docs/package-lock.json
      - name: Install locked dependencies
        run: npm ci && npm --prefix packages/pcr-docs ci
      - name: Verify document transformations
        run: npm --prefix packages/pcr-docs test
      - name: Build and verify the full static library
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          PCR_BUILD_RELOCATE: '1'
          PCR_EDGEONE_PREBUILT_ASSETS: '1'
        run: npm --prefix packages/pcr-docs run build
