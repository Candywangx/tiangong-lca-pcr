review_metadata:
  scientific_review: pending
  boundary_review: Shared audiovisual replacement candidate for broadcast and
    non-broadcast original assets. Coordinator alone decides binding/replacement
    of unintegrated 84612; no duplicate broadcast ledger or whole-96123
    coverage. Radio-only original remains under the existing 84611 candidate.
    Scientific/semantic review pending.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: grid_other
      selected_flow: Alternating-current electricity at another documented user supply
        interface
      reason: Other supply geography, voltage and mix are not yet specified. The
        verified CN <1kV identity is only grid_cn; each actual other interface
        must have a matching public identity/property. No generic electricity
        substitution.
    - row_id: camera_rental
      selected_flow: Rental of one configured digital motion-picture camera for one day
      reason: Verified camera product identities represent manufactured equipment, not
        a bounded rental camera-day with supplier energy/capital coverage. The
        capital camera row cannot be reused as this rental service.
    - row_id: bus_travel
      selected_flow: Diesel coach passenger transport
      reason: Public bus travel candidate is a Belgium worker-distance interface using
        Length/metres with unspecified fuel, schedule and occupancy. It does not
        establish the declared diesel-coach passenger-distance service; actual
        route/provider and compatible native-property conversion remain
        required.
    - row_id: hotel_night
      selected_flow: One occupied hotel room-night
      reason: Bounded accommodation query returned freight/transport and unrelated
        interfaces, not a confirmed occupied room-night with actual hotel
        coverage. No claim of database absence.
    - row_id: film_stock
      selected_flow: Unexposed colour-negative motion-picture camera film
      reason: Public exposed/developed motion-picture film and exposed-but-undeveloped
        photographic material identities have different states from unexposed
        camera colour-negative stock. Plastic, medical and laminating films are
        not substitutes. Exact actual stock and its length-compatible public
        identity remain unresolved.
    - row_id: set_plywood
      selected_flow: Finished plywood panel for audiovisual set construction
      reason: Public plywood identities distinguish tropical/non-tropical veneer
        composition, while broad wood-panel identities also include
        particleboard/MDF. Actual panel species, adhesive and state are not
        specified; volume-to-mass alone is not an exclusion, but requires
        measured density and compatible product scope.
    - row_id: discarded_negative
      selected_flow: Discarded exposed colour-negative motion-picture film
      reason: Exposed/developed motion-picture product identity is not a verified
        discarded colour-negative waste stream. Actual support/emulsion,
        contamination and disposal boundary must be resolved independently.
    - row_id: discarded_plywood
      selected_flow: Discarded glued plywood set panel
      reason: Manufactured plywood and broad mixed-waste candidates do not establish
        this discarded glued panel contamination/treatment interface. Actual
        waste specification and recipient must be verified.
    - row_id: render_job
      selected_flow: Completed audiovisual animation rendering job
      reason: Search candidates include textile printing, drawings, prepress and IT
        infrastructure; none was established as the completed specified
        audiovisual animation-rendering job with its native job quantity and
        supplier energy/cooling coverage.
    - row_id: storage_contract
      selected_flow: One defined production digital storage service contract
      reason: IT infrastructure and physical storage equipment do not establish this
        bounded project storage contract with retention, replication and
        supplier resource scope. Native public units must be preserved if later
        resolved; bytes are not energy.
    - row_id: film_lab
      selected_flow: Completed laboratory processing job for exposed colour-negative
        motion-picture film
      reason: Developer/fixer materials, medical films and plastic-film extrusion
        services do not represent the completed specified motion-picture
        laboratory processing job. Real job coverage and native quantity must be
        verified; manufacturer route evidence does not create a database
        identity.
    - row_id: sound_mix
      selected_flow: Completed audiovisual sound mixing session
      reason: Bounded mixing search returned water-disinfectant and magnet interfaces,
        not an accepted specified audiovisual sound-mixing session. No claim of
        database absence.
    - row_id: mastering_job
      selected_flow: Completed mastering job for one declared audiovisual edition
      reason: Bounded cinema-mastering and Chinese master searches did not establish a
        completed specified mastering supplier job. DCP/IMF technical
        requirements are evidence of deliverable completeness, not an
        interchangeable flow identity.
    - row_id: accepted_original
      selected_flow: Accepted complete audiovisual original
      reason: Bounded English/Chinese original searches did not establish the complete
        audiovisual original asset with specified rights, version, dependencies
        and item basis. Exposed film is a physical material, not an intellectual
        original; do not force a mass identity or rewrite its public property.
  evidence_limitations:
    - No energy, temperature, chemical recipe, material loss, lifetime, original
      length or energy/byte factor imposed; actual route and foreground records
      required.
    - EBU 2014 is TV production-scope history only; Sony v2.1 (printed
      09-06-2018) is historical version-lineage evidence, not current recipient
      acceptance. DCI specifies cinema interfaces, not the source master or
      every original.
    - In-house photochemical processing requires actual
      chemical/water/energy/waste/release inventory; purchased processing
      requires supplier primary coverage. Missing data prevents completeness
      claims.
    - Equipment manufacture and missing upstream inventories remain disclosed;
      no automatic cradle-to-gate claim. Scientific and translation
      approval/publication not established.
version: 0.1.0
