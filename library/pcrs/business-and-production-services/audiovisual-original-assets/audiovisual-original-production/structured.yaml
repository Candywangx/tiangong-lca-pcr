allocation_rules:
  - rule_id: allocation_trace
    applies_to: "all inventory rows"
    rule: "Use direct original/stage metering and supplier task records first. Where a shared studio, edit suite, render cluster or storage system is unavoidable, retain a measured resource total, a causal job/use driver and the allocation schedule, reconciling all shares to that total. Validate idle/base load and cooling coverage explicitly. Price, copyright value and audience cannot stand in for a causal energy relationship."
    source_ids: []
  - rule_id: allocation_original
    applies_to: "accepted_original"
    rule: "One original-production ledger serves the accepted edition and its technical copies. Attribute separately measured additional versions and reuse work once; record reusable asset ownership and actual reuse history. Do not divide original production by future downloads or broadcasts without a separately justified downstream model."
    source_ids: []
  - rule_id: allocation_failures
    applies_to: "dataset"
    rule: "Retakes and rejected intermediate work are attributable production burdens, not saleable co-products. If genuinely separate saleable originals are jointly produced, disclose their distinct outputs and a measured subdivision or causal allocation; unresolved allocation requires review. No speculative avoided-burden credit for reusable sets or digital copies."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "camera_capital; set_plywood"
    rule: "Allocate equipment and reusable-set manufacturing using a unique asset ID, manufacturing inventory and an evidenced actual cumulative service life/activity or justified expected lifetime denominator. Measured project use is only the numerator. Cumulative manufacturing shares across every project and period must not exceed one or reset. Expected denominators require sensitivity and later reconciliation. A period allocation distributes only the manufacturing share already attributable to that period, never automatically the full asset inventory each period. Unknown life/activity denominator requires review; invent no default. Separate consumed material from reused capital and prevent duplicate supplier-rental manufacturing shares."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_original
      process_id: "acceptance"
      flow_role: "accepted_original"
      record_type: "acceptance_record"
      raw_fields: "original ID; accepted version; source-master/carrier; intended outlet; dependent picture/audio/text assets; delivery-master/package/CPL lineage; duration seconds; content inventory; rights; recipient specification and live/file QC; route tasks; revisions; sites/dates"
      collection_method: "Retain actual commissioning/content brief, creative task ledger, rights record and accepted file checksum or live edition verification record. Count each complete original once."
      unit: "item"
      frequency: "Each accepted original"
      temporal_coverage: "Entire development-to-acceptance cycle"
      site_scope: "All actual sites and suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Acceptance and rights records; version lineage"
    - protocol_id: cp_energy
      process_id: "production_resources"
      flow_role: "electricity"
      record_type: "meter_record"
      raw_fields: "meter ID; site; voltage; mix; stage; original ID; start/end readings; unit; shared-job driver; cooling/idle; outsourced overlap"
      collection_method: "Calibrated submeter or reconciled facility meter with actual causal allocation records; convert recorded kWh using the verified unit-group factor. Measure production-period rendering/storage, not assumed GB-to-energy factors."
      unit: "MJ"
      frequency: "Per task/day and acceptance"
      temporal_coverage: "Complete included cycle including idle and rework"
      site_scope: "Actual offices, studios, locations and digital sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration, invoices, meter reconciliation and allocation schedule"
    - protocol_id: cp_fuel
      process_id: "production_resources"
      flow_role: "generator_diesel"
      record_type: "consumption_record"
      raw_fields: "fuel lot; grade; blend; mass; opening/closing stock; generator; original; dates; density/temperature if volume"
      collection_method: "Reconcile issue/return and tank measurements to consumed diesel; retain real supplier composition. Volume conversion uses measured or supplier-certified applicable density, never an invented constant."
      unit: "kg"
      frequency: "Each actual generator run"
      temporal_coverage: "All attributable runs"
      site_scope: "Actual production-controlled generators"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Fuel receipts, stock ledger and composition evidence"
    - protocol_id: cp_materials
      process_id: "capture"
      flow_role: "material_water_waste"
      record_type: "material_record"
      raw_fields: "row ID; product state; grade; moisture; mass; volume/density; source/recipient; reuse history; treatment; original ID"
      collection_method: "Weigh issued/returned/discarded plywood and discarded exposed film separately; reconcile actual water and wastewater records separately. Retain composition, waste contamination and treatment. Measure actual reused share with documented use history; no assumed lifespan."
      unit: "kg"
      frequency: "Each issue and boundary transfer"
      temporal_coverage: "Full included production and dismantling"
      site_scope: "Actual capture locations and waste handlers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Weighing, supplier specifications, water meters and transfer notes"
    - protocol_id: cp_services
      process_id: "production_resources"
      flow_role: "purchased_service"
      record_type: "supplier_record"
      raw_fields: "row ID; contract/job/session; supplier; count; duration; bytes/frames where relevant; native unit; transport occupancy/distance; included assets/energy; original allocation; room-night occupancy/menu; financial meal inclusion; environmental meal coverage; separately covered food and overlap evidence"
      collection_method: "Obtain actual accepted service deliverable and supplier primary activity/boundary records. Disaggregate transport modes and hotel nights; define each rental day, render job, storage contract and mix session. Track supplier and own energy overlap. Acceptance transfer requires its own actual service row if purchased.; verify accommodation inventory boundaries independently of billing; reconcile food burdens once under hotel_night, retaining unresolved coverage as a gap"
      unit: "Native row unit"
      frequency: "Each service and invoice"
      temporal_coverage: "Full attributable production interval"
      site_scope: "All actual suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Contract, acceptance, job logs and supplier boundary evidence"
    - protocol_id: cp_emissions
      process_id: "production_resources"
      flow_role: "direct_species_release"
      record_type: "measurement_record"
      raw_fields: "chemical species; fossil fraction; fuel; equipment; released kg; time; medium/submedium; measurement uncertainty; calculation inputs"
      collection_method: "Use actual species measurement or independently documented applicable fuel-carbon and combustion calculation. Retain the complete formula, carbon oxidation evidence and fossil share. NOx as equivalent needs species resolution; verify immediate air subcompartment. Electricity/background emission factors cannot be entered as direct releases."
      unit: "kg"
      frequency: "Each evidenced release/campaign"
      temporal_coverage: "Only actual included combustion events"
      site_scope: "Controlled production sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Species report, calculation evidence and compartment record"
    - protocol_id: cp_film
      process_id: "capture"
      flow_role: "film_stock"
      record_type: "stock_record"
      raw_fields: "original/take ID; gauge; support/emulsion; lot; issued/returned/exposed/discarded length; carrier ID; processing order"
      collection_method: "Reconcile traceable roll labels, length metering and issue/return records to actual consumed length including tests, failures and rework. Retain separately weighed kg waste-film records; length is not waste mass. Reconcile laboratory order coverage."
      unit: "m"
      frequency: "Each roll and issue/return"
      temporal_coverage: "Full included capture and processing"
      site_scope: "Actual capture locations and laboratories"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Roll labels, meter records, processing and returns evidence"
    - protocol_id: cp_assets
      process_id: "production_resources"
      flow_role: "camera_capital; set_plywood"
      record_type: "asset_register"
      raw_fields: "unique asset ID; configuration; actual manufacturing inventory and count/mass; measured net camera mass and weighing method; cumulative projects/periods; measured use activity; evidenced cumulative service denominator; period-attributed share; expected life evidence; cumulative shares and residual"
      collection_method: "Retain manufacturing and all-project asset-use register; reconcile cumulative manufacturing shares at no more than one, with no project/period reset. Expected denominator requires sensitivity and later actual reconciliation. Unknown denominator stops completeness claims and requires review."
      unit: "Native row unit"
      frequency: "Each use, period close and lifetime update"
      temporal_coverage: "Across every project/period until asset retirement"
      site_scope: "All shared assets and rental suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Manufacturing inventory, service/life evidence, conservation ledger and uncertainty"
    - protocol_id: cp_wastewater
      process_id: "capture"
      flow_role: "sanitary_wastewater"
      record_type: "transfer_record"
      raw_fields: "original/site; sanitary influent composition; discharge and recipient volume-meter readings; period; sewer/transport scope; infiltration/losses; treatment-plant inlet; allocation schedule"
      collection_method: "Reconcile actual received untreated-influent volume and project attribution. Distinguish sanitary from laboratory/industrial wastewater. Do not infer wastewater volume from purchased water or equate site pipe discharge automatically to plant influent."
      unit: "m3"
      frequency: "Each transfer and receiving interval"
      temporal_coverage: "All included actual sanitary transfers"
      site_scope: "Production locations, transfer route and recipient treatment plant"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Meters, composition, transfer and receiving records"
  calculation_rules:
    - id: same_original_basis
      applies_to: "all inventory rows"
      rule: "Retain actual attributable numerator quantity per declared reference flow. For a shared production pool, record the actual accepted-original register and causal allocation schedule before deriving each original inventory; never average incompatible editions without stratification."
      inputs:
        - cp_original
        - cp_energy
        - cp_fuel
        - cp_materials
        - cp_services
        - cp_emissions
        - cp_film
        - cp_assets
        - cp_wastewater
      output: "Exchange quantity per declared reference flow in the original row unit"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "accepted_original"
      requirement: "Preserve accepted edition, duration, configuration, rights and reproduction conditions; a file checksum proves byte identity, not content completeness or lawful rights."
      evidence: "cp_original"
    - id: quality_complete
      applies_to: "dataset"
      requirement: "Reconcile every actual stage and supplier; expand specific consumable, travel, waste and direct-release rows where present. Reconcile actual food burdens under the hotel_night supplier-coverage rule: retain verified service-inclusive meals once, add separate food rows for meals outside that environmental inventory, and disclose unresolved coverage. Describe capital-asset coverage, storage interval, failed work and all exclusions. Record omissions and uncertainty without declaring full life-cycle coverage."
      evidence: "cp_original; cp_services"
    - id: quality_energy
      applies_to: "grid_cn, grid_other"
      requirement: "Verified voltage/geography/mix, calibration and measured allocation; no arbitrary monetary, GB, CPU-time or runtime conversion to energy. Supplier job records must show the actual resource relationship and site boundary."
      evidence: "cp_energy; cp_services"
    - id: quality_comparability
      applies_to: "dataset"
      requirement: "Original counts are only comparable for declared equivalent duration, genre, production route, picture/sound/accessibility and rights/delivery conditions; no automatic intensity ranking across programmes. Report temporal, geographic and technology representativeness."
      evidence: "cp_original"
    - id: quality_master
      applies_to: "accepted_original"
      requirement: "Bind source-master and delivery-master/package editions and asset dependencies. Check cinema/IMF completeness only for the actual selected interface; current recipient specifications supersede historical examples. New encodings, CPLs or rights transfers are not new originals; a substantive new cut declares its burden relationship to the base original."
      evidence: "cp_original; dci-master-lineage; sony-imf-lineage"
validation_rules:
  - rule_id: validation_original
    applies_to: "accepted_original"
    rule: "Require 1 item complete accepted original, same reference-product and output names, cp_original and actual edition qualifiers. Candidate blank product UUID must be precisely registered against accepted_original. Do not replace it with a physical carrier or generic service UUID."
    source_ids: []
  - rule_id: validation_ledger
    applies_to: "all inventory rows"
    rule: "Verify atomic exchange, native property/unit, same-original denominator and real collection protocol; audit CN low-voltage conditional use and disjoint other electricity. Reject double-counted service energy, fake density, unsupported emissions or storage-to-energy coefficients."
    source_ids: []
  - rule_id: validation_boundary
    applies_to: "dataset"
    rule: "Require a declared broadcast/non-broadcast audiovisual original asset and route-specific acceptance evidence. Check commissioned-service/outright-sale interfaces and multi-use originals for duplication. No broadcast/distribution/user-device/long-term archive activity silently belongs to original production."
    source_ids:
      - cpc-tv-original
      - cpc-sale-original
  - rule_id: validation_species
    applies_to: "direct_co2, direct_no2"
    rule: "Actual release evidence, fossil/biogenic distinction, species and immediate medium/submedium are mandatory. NO2-equivalent totals and purchased power emissions cannot be inserted as direct NO2 or direct CO2. Unresolved identity or causal allocation remains a disclosed review need."
    source_ids: []
  - rule_id: validation_assets
    applies_to: "camera_capital; set_plywood"
    rule: "Check unique asset ID, actual same-configuration net mass/manufacturing quantity, evidenced cumulative life/service denominator, project/period share register and residual. Cumulative manufacturing shares cannot exceed one or reset. Expected denominator needs sensitivity and later reconciliation; period attribution must not input a full asset inventory each period. Missing denominator remains review without complete capital-coverage claims."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_production"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Identified audiovisual-original production input to separately scoped distribution/broadcast/exhibition models; comparisons only for equivalent editions"
  excluded_use: "Emission per viewer/download/broadcast; complete broadcast-service footprint; arbitrary mass of intellectual property; automatic equipment-inclusive cradle-to-gate"
  required_metadata: "Original and edition IDs; duration; content and rights; route; sites/dates; configuration; accepted deliverables; energy interfaces; supplier/capital/transport/storage coverage; source and collection protocols"
  required_quality_disclosure: "Identity gaps; meter/allocation uncertainty; failed work; supplier overlap; omissions; historical-source limits; content and acceptance representativeness; review status"
  update_trigger: "New accepted edition or substantive route/site/supplier/format/rights/boundary change; revised measurements or resolved identity/causal allocation"
data_sources:
  - id: "cpc-tv-original"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 subclass 84612 explanatory note; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/84612"
    used_for: "Broadcast-intended original scope; no numerical factors"
  - id: "cpc-sale-original"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 subclass 96123 explanatory note; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/96123"
    used_for: "Non-commissioned outright-sale audiovisual intersection; not whole-leaf coverage"
  - id: "ebu-production-scope"
    type: "official_guidance"
    reference: "EBU Tech3367, Sustainable Production—Overview, November 2014, printed p.5; https://tech.ebu.ch/docs/tech/tech3367.pdf"
    used_for: "Historical TV production/distribution separation and stage example only; no film energy or emission extrapolation"
  - id: "dci-master-lineage"
    type: "standard"
    reference: "DCI Digital Cinema System Specification, definitive HTML, snapshot 2026-10-06, §§2.1.1.1–2.1.1.4, 3.1.1, 3.1.3, 5.2.3 and 5.5.1; https://dcss.dcimovies.com/latest/dcss.html"
    used_for: "Source/derived master relationships, CPL and distribution-package completeness; selected cinema interfaces only"
  - id: "sony-imf-lineage"
    type: "standard"
    reference: "Sony Pictures IMF Deliverable Specification v2.1, printed publication date 09-06-2018, pp.4–5; https://partnerzone.sonypictures.com/assets/downloads/Sony_Pictures_IMF_Specification_v2.1.pdf"
    used_for: "Historical supplier base/supplemental asset and edition example; not universal current format, lifetime or quality threshold"
  - id: "kodak-film-route"
    type: "handbook"
    reference: "Kodak VISION3 500T Color Negative Film 5219/7219, Technical Data, March 2026, H-1-5219, p.2, Processing/Identification/Post-Production; https://www.kodak.com/content/products-brochures/motion-picture/KODAK-VISION3-5219-7219-technical-information.pdf"
    used_for: "Real colour-negative film, processing-service and postproduction-scan route example; ECN-2 applies only to specified manufacturer film, not all film, recipes, temperature or energy"
