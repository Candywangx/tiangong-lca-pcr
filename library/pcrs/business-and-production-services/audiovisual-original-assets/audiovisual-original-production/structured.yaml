measurement_rules:
  - id: original_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Exactly one accepted original; use cp_original. Reference count is not the number of encodings, viewers or transmissions. Record actual duration in seconds as a qualifier, not a substitute denominator."
  - id: energy_preserve
    applies_to: "grid_cn, grid_other"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the confirmed electricity reference property; the energy unit group is 93a60a57-a3c8-11da-a746-0800200c9a66. Its kWh conversion is 3.6 MJ/kWh. Use cp_energy actual readings; neither runtime nor network bytes proves electricity. For unresolved grid_other verify its own property before adopting identity."
  - id: atomic_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual exchange property"
      uuid: ""
    required_unit: "Declared row unit"
    rule: "Retain native supplier count, energy, mass or passenger-distance property. Conversion from volume to mass requires actual density/temperature. Do not rewrite a public property to match a preferred unit. cp_services defines a job/session/contract/item before counting it."
