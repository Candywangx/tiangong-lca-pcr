  scientific_review: pending
  translation_review: pending_independent_review
  semantic_boundary:
    decision: One shared software-download delivery category covering explicitly
      qualified system/application local file bundles. Both use the same
      master/preparation/storage/transfer/local-acceptance method; different
      functions, platforms and full/bootstrap/component/update profiles remain
      separate dataset applicability descriptors.
    reuse: Software-original creation is an upstream input, physical packaged
      software has a different carrier/reference boundary, hosted operation and
      installation remain downstream. Classification references do not establish
      positive mappings or functional equivalence.
  unresolved_flow_identities:
    - row_id: master_input
      selected_flow: Released software master
      reason: No verified public software-original/master identity matching the
        declared system/application released-master share and item basis.
        Packaged/Mass intermediates and distribution toxic-impact proxies cannot
        replace it; preserve component/version and original-share ledger.
    - row_id: download_output
      selected_flow: Accepted software download package
      reason: No verified public flow matching a locally accepted declared
        system/application downloadable profile on the item basis. Packaged
        products, untested binaries and CTUe proxies are not equivalent; no
        physical conversion is established. Reference product name exactly
        matches this output row.
    - row_id: cooling_blowdown
      selected_flow: Untreated cooling-tower blowdown
      reason: Refined Waste flow search inspected 26 bounded candidates; seven
        route/state-relevant direct reads represent manganese-slag washing,
        silicon production, coal mining/washing, untreated direct-to-water
        discharge or treated wastewater. None verified as untreated
        cooling-tower blowdown sent to treatment. Specific row retained without
        UUID; this is not a database-absence claim.
  evidence_limits:
    - Original share schedules, completed-delivery populations, network/provider
      telemetry, hardware life and cooling quantities require primary foreground
      evidence. No numeric inventory defaults or universal energy per byte.
    - Only China user-side voltage-matching electricity identities adopted as
      conditional row branches; other geography/supply requires explicit
      compatible atomic replacement rows, never use these UUIDs globally.
    - No direct elementary exchange assumed; actual generator, refrigerant,
      abstraction or direct discharge evidence requires specific extension
      before complete dataset claim.
    - Shared system/application methodology does not establish functional
      equivalence. Full/bootstrap/component/update profiles, prerequisite
      versions and dependency delivery require primary manifests and explicit
      acceptance/installation separation. Unknown separability and
      original-beneficiary attribution remain dataset completeness gaps.
