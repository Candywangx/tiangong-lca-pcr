allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The original-beneficiary ledger below is a foreground accounting requirement implemented through cp_master; SCI supplies resource-attribution concepts, not a software-copy count or original-burden allocation factor. Device mass scales a compatible upstream manufacturing inventory only; it is never software mass, and hardware disposal scope must be disclosed separately."
    source_ids: []
  - rule_id: allocation_resource
    applies_to: "electricity and infrastructure"
    rule: "Use direct stage/site/job meters first. Shared storage energy follows measured reserved capacity and duration with calibrated resource attribution; transmission follows reconciled equipment energy and job/traffic telemetry, not a universal kWh/GB factor. Include provisioned idle and cooling once. Reconcile allocated totals with device/provider totals and disclose missing segments."
    source_ids:
      - un-system-download
      - un-application-download
      - gsf-sci
      - debian-verify
      - libreoffice-install
      - mozilla-installers
  - rule_id: allocation_copy
    applies_to: "master and publication overhead"
    rule: "Maintain one master/component burden ledger across every benefiting system/application release, bootstrap/full/update profile, physical-copy channel and hosted-service reuse where applicable. Identify original creation versus version-specific development, packaging/signing and delivery verification; charge each activity once. Record a bounded observation cutoff, actual compatible accepted deliveries, assigned shares, remaining unallocated burden and any projected beneficiaries separately. Reconcile allocated and residual shares to each original total; cumulative assignment cannot exceed that total. For one homogeneous release/profile cohort, normalize its justified assigned share using the observed accepted count. Shares between unlike beneficiaries need a documented primary causal/resource contribution basis and sensitivity, not a universal copy factor, price, users or file bytes. Unknown original attribution blocks an upstream-complete result; never charge one whole original per download or assume zero."
    source_ids:
      - gsf-sci
  - rule_id: allocation_hardware
    applies_to: "hardware shares"
    rule: "Adapt SCI time/resource attribution to the delivery architecture: use measured net hardware mass times reserved-time/evidenced installed-life share times reserved-resource/total-resource share. Keep all time units consistent; no default device life or utilization. Provider-contained embodied inventories exclude a second hardware share."
    source_ids:
      - un-system-download
      - un-application-download
      - gsf-sci
      - debian-verify
      - libreoffice-install
      - mozilla-installers
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "receipt"
      flow_role: "download_output"
      record_type: "acceptance_record"
      raw_fields: "release/channel; architecture/platform; system/application function; profile; component/language/help manifest; dependency and prerequisite version; file list; hash/signature; bytes; licence/reuse conditions; local receipt id; accepted delivery count; failures/retries; bootstrap payload fetches; installation activity split"
      collection_method: "Reconcile publisher release/component manifest with received files, supported integrity verification and unique completed-transfer records. Log bootstrap/full/update status, dependency fetches and exact local acceptance. Count one declared complete profile, not HTTP requests, file chunks, licences, users or installed machines; record failed retries in the same observation boundary."
      unit: "item"
      frequency: "each accepted delivery"
      temporal_coverage: "complete declared observation period"
      site_scope: "publisher, mirrors, actual local recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "acceptance; manifest/hash; transfer ledger"
    - protocol_id: cp_energy
      process_id: "preparation_storage_transfer_receipt"
      flow_role: "stage electricity"
      record_type: "meter_record"
      raw_fields: "stage; site; meter; region; voltage; time interval; kWh; jobs; bytes transferred/stored; reserved resources; idle; cooling; allocation ledger"
      collection_method: "Collect calibrated submeter or primary provider telemetry; reconcile stage/job electricity, storage retention/cache fills, network path and receiving write/check jobs. Bytes/time are attribution evidence only with measured/calibrated resource-energy relationships; no generic conversion."
      unit: "kWh"
      frequency: "each meter/job interval"
      temporal_coverage: "including unsuccessful attempts and idle reservation"
      site_scope: "all contributing sites/providers/recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; provider boundary; reconciliation"
    - protocol_id: cp_master
      process_id: "preparation"
      flow_role: "master_input"
      record_type: "asset_record"
      raw_fields: "master/component id/version; system/application function; original inventory and creation boundary; release acceptance; preparation jobs; beneficiaries across releases/channels; cohort/cutoff; assigned/residual original shares; actual/projected delivery population; rights; cumulative shares"
      collection_method: "Read primary version/component provenance, original inventory and reuse records. Reconcile each original total with all assigned and residual beneficiary shares across system/application channels; link cohort shares and actual accepted counts. Document packaging/signing jobs outside original development and avoid duplication. Preserve unresolved future-population and cross-profile attribution uncertainty separately from measured delivery-stage inventory."
      unit: "item"
      frequency: "each release/cohort"
      temporal_coverage: "original scope and declared delivery window"
      site_scope: "actual publisher/upstream original author"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "upstream inventory; rights; cumulative schedule"
    - protocol_id: cp_hardware
      process_id: "infrastructure"
      flow_role: "portable_computer_share; router_share; server_share"
      record_type: "device_record"
      raw_fields: "device id; CPU/memory/storage/chassis; net mass; scale/supplier record; reserved time; installed life evidence; reserved/total resources; provider coverage"
      collection_method: "Use calibrated net-device weighing or traceable same-configuration supplier mass; record installed service-life evidence and reservation logs with consistent time/capacity definitions. No software mass or default lifespan."
      unit: "kg"
      frequency: "device configuration/reservation change"
      temporal_coverage: "distribution window and hardware-life evidence"
      site_scope: "actual owned or transparently decomposed provider devices"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighing/configuration; life basis; no duplication"
    - protocol_id: cp_water
      process_id: "infrastructure"
      flow_role: "cooling_water; cooling_blowdown"
      record_type: "utility_record"
      raw_fields: "input water mass; outgoing blowdown mass; supplier quality; additives; density/state; evaporation; stocks; treatment destination; cooling allocation"
      collection_method: "Read actual cooling supply/discharge meters and primary water-quality records. Reconcile input, evaporation, stocks and blowdown with attributable workload; volume requires measured density/state conversion, not arbitrary mass equality."
      unit: "kg"
      frequency: "each utility interval"
      temporal_coverage: "full applicable distribution window"
      site_scope: "actual cooling sites and treatment providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meters; quality/density; receiving treatment; balance"
  calculation_rules:
    - id: electricity_conversion
      applies_to: "all electricity rows"
      rule: "MJ = measured attributable kWh × 3.6; resource attribution must first be established from primary measurement, not a byte-to-energy assumption."
      inputs:
        - cp_energy
      output: "MJ per declared reference flow"
      source_ids:
        - gsf-sci
    - id: delivery_basis
      applies_to: "all inventory rows"
      rule: "Record all exchanges directly per declared reference flow. For cohorts of compatible accepted deliveries of identical version/platform/completeness, reconcile primary attribution and failed attempts before dividing by observed accepted count; never combine unlike profiles."
      inputs:
        - cp_delivery
        - cp_energy
        - cp_master
        - cp_hardware
        - cp_water
      output: "per declared reference flow"
      source_ids:
        - un-system-download
        - un-application-download
        - gsf-sci
        - debian-verify
        - libreoffice-install
        - mozilla-installers
    - id: hardware_share
      applies_to: "portable_computer_share; router_share; server_share"
      rule: "Attributed hardware kg = measured device net kg × (reserved time / evidenced installed life) × (reserved resources / total resources). Use consistent time units, positive life/capacity and shares at most one; reconcile sums across jobs."
      inputs:
        - cp_hardware
      output: "kg per declared reference flow"
      source_ids:
        - gsf-sci
  data_quality_requirements:
    - id: quality_identity
      applies_to: "download_output"
      requirement: "Fix system/application function, release/channel, OS/platform/architecture, installer/patch completeness, dependencies, optional components, rights and local acceptance. Publisher evidence establishes included functionality and compatibility, not universal code quality; observed bytes cannot substitute for acceptance."
      evidence: "cp_delivery; publisher manifest"
    - id: quality_coverage
      applies_to: "all stages"
      requirement: "Cover actual retention, replicas/cache, network segments, receipt and retries; disclose supplier gaps and measured/modelled split; missing data is not zero."
      evidence: "primary job/meter ledger; provider boundaries"
    - id: quality_representative
      applies_to: "dataset reuse"
      requirement: "Declare distribution architecture, region/grid/voltage, file size/completeness, storage window, receiving device and network conditions; one release is not an industry average."
      evidence: "dataset profile; uncertainty and original-share sensitivity"
validation_rules:
  - rule_id: validate_identity
    applies_to: "download_output"
    rule: "Require one complete locally stored accepted bundle with exact release/platform, file manifest, checksum/signature verification as supported by the publisher, software functions and dependency/prerequisite scope. Full image, bootstrap installer and incremental patch are different profiles; a bootstrap package alone is not a fully installed system. No generic security or compliance approval follows from checksum verification."
    source_ids:
      - un-system-download
      - un-application-download
      - gsf-sci
      - debian-verify
      - libreoffice-install
      - mozilla-installers
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Check the common completed-delivery denominator, stage/job scope, retry attribution, observed delivery count, master schedule and energy conversion. Traffic bytes, stored bytes, users, revenue, licence entitlements and hardware mass cannot replace the reference item or directly become electricity. Match electricity region/voltage and every hardware/water identity to actual primary records."
    source_ids:
      - un-system-download
      - un-application-download
      - gsf-sci
      - debian-verify
      - libreoffice-install
      - mozilla-installers
  - rule_id: validate_profiles
    applies_to: "download_output and linked original/component inputs"
    rule: "Require source-supported system/application functions and actual publisher release/platform/component records. Do not equate offline full installers, bootstrap profiles, incremental updates or optional language/help bundles. A patch requires its compatible prerequisite; a full profile requires every declared downloaded dependency. Reconcile master/component ledger assignment and residuals across all benefiting profiles; reject repeated whole-original charges, unnoticed reused components and unobserved future-copy denominators."
    source_ids:
      - un-system-download
      - un-application-download
      - libreoffice-install
      - mozilla-installers
  - rule_id: validate_completeness
    applies_to: "dataset release"
    rule: "Missing network or receiving records, unresolved applicable flow identities, unverified original shares and unsupported provider attribution remain explicit gaps. Report measured/modelled coverage and uncertainty; do not call a delivery-only dataset whole-life, complete cradle-to-gate or an approved methodology. Compare only equivalent software function, release completeness and delivery boundaries."
    source_ids:
      - un-system-download
      - un-application-download
      - gsf-sci
      - debian-verify
      - libreoffice-install
      - mozilla-installers
published_dataset_profile:
  dataset_role: "Software download-delivery foreground; upstream-inclusive result only with verified linked inputs"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible software delivery module; separately linked installation/use study with equivalent functions and completeness"
  excluded_use: "Whole-life software operation; complete cradle-to-gate with unlinked originals/providers; rights valuation; security/methodology approval; universal GB impact factor"
  required_metadata: "All reference qualifiers, cohort/period, original share schedule, actual transfer/storage/receiver boundaries, supplier inventories and conditional exchanges"
  required_quality_disclosure: "Measured/modelled split, missing segments/identities, allocation uncertainty, cache/retry treatment, hardware-life assumptions, upstream exclusions"
  update_trigger: "Changed release/software function/completeness, delivery architecture, grid, retention policy, measured supplier data or original reuse population"
data_sources:
  - id: "un-system-download"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, subclass 84341 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/84341"
    used_for: "System-software locally stored file identity; no inventory quantities or methodology approval"
  - id: "un-application-download"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, subclass 84342 explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/84342"
    used_for: "Application-software locally stored file identity; same delivery-state definition, no classification-driven method duplication"
  - id: "gsf-sci"
    type: "standard"
    reference: "Green Software Foundation, Software Carbon Intensity Specification 1.1.0, Energy; Embodied emissions; Software boundary; Quantification method. https://sci.greensoftware.foundation/"
    used_for: "Reserved-resource energy and time/resource hardware attribution concepts adapted to delivery. No SCI score, default life, byte-energy or original-copy factor adopted"
  - id: "debian-verify"
    type: "official_guidance"
    reference: "Debian Project, Verifying authenticity of Debian images, signed checksum and matching hash/signature instructions. https://www.debian.org/CD/verify"
    used_for: "System-image integrity example; publisher-supported verification does not prove installed functionality/security and does not require Debian tools for every product"
  - id: "libreoffice-install"
    type: "official_guidance"
    reference: "The Document Foundation, LibreOffice Installation Instructions, macOS/Linux/Windows and additional language/help components. https://www.libreoffice.org/installation-instructions/"
    used_for: "Application platform and component completeness; download versus installation. Example only, not a mandatory packaging format or universal dependency list"
  - id: "mozilla-installers"
    type: "official_guidance"
    reference: "Mozilla, Firefox Source Docs, Stub Installer and Full Installer. https://firefox-source-docs.mozilla.org/browser/installer/windows/installer/StubInstaller.html ; https://firefox-source-docs.mozilla.org/browser/installer/windows/installer/FullInstaller.html"
    used_for: "Stub downloads a full installer which then installs the browser; separates downloaded profile/payload from installation. Example only, no download-size or default energy value adopted"
  - id: "debian-netinst"
    type: "official_guidance"
    reference: "Debian Project, Network install from a minimal USB, CD, explanatory paragraphs on base image and remaining Internet packages. https://www.debian.org/CD/netinst/"
    used_for: "System-image versus later payload completeness and installation boundary; downloaded image only, no physical USB/CD manufacturing requirement or universal package list"
