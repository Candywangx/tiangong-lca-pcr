leteness` | dataset release | Missing network or receiving records, unresolved applicable flow identities, unverified original shares and unsupported provider attribution remain explicit gaps. Report measured/modelled coverage and uncertainty; do not call a delivery-only dataset whole-life, complete cradle-to-gate or an approved methodology. Compare only equivalent software function, release completeness and delivery boundaries. | `un-system-download`; `un-application-download`; `gsf-sci`; `debian-verify`; `libreoffice-install`; `mozilla-installers` |\n\n"
