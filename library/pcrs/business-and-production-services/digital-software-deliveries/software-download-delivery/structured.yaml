product_category_identity:
  canonical_pcr_id: "pcr.business-and-production-services.digital-software-deliveries.software-download-delivery"
  classification_refs: "CPC 3.0: 84341 System software downloads; 84342 Application software downloads; contextual references, not accepted positive mappings"
  covered_products: "Declared system/application software file bundles accepted in local storage, including separately identified full, bootstrap, component and update delivery profiles"
  excluded_products: "Original assets; physical packaged carriers; licensing alone; contracted development alone; hosted execution/SaaS; continuing software operation; telecommunications activity alone"
  representative_product: "One locally accepted version/platform-specific software bundle with publisher-defined functional and completeness profile; no assumed average software or installer route"
  production_route: "Accepted released master → distribution preparation → origin/cache/repository storage → actual transmission → local write and integrity acceptance"
  market_state: "Complete declared downloadable file profile locally accepted, before installation/execution; a complete bootstrap profile is not a complete installed software system"
functional_unit:
  what: "Deliver the declared software release/profile to local storage for later installation/execution, with specified system or application function"
  how_much: "One completed accepted declared bundle, 1 item; file count and bytes are descriptors, not the reference quantity"
  how_well: "Actual publisher manifest, integrity acceptance, function/platform/version and component/prerequisite completeness; no generic performance, security or regulatory approval"
  how_long_or_cycle: "One accepted delivery during a declared release-distribution observation period; not an assumed installed service lifetime"
  reference_flow_link: "download_output"
system_boundary:
  rules:
    - rule_id: boundary_delivery
      applies_to: "all stages"
      rule: "Collect from the released reusable software master through accepted local storage. Cover distribution preparation, retained origin/cache copies, actual transmission path, failures/retries and reception checks. List incomplete network/provider segments explicitly; this foreground alone is not complete cradle-to-gate."
      source_ids:
        - un-system-download
        - un-application-download
        - gsf-sci
        - debian-verify
        - libreoffice-install
        - mozilla-installers
    - rule_id: boundary_original
      applies_to: "master_input"
      rule: "Link original creation as an upstream share with declared reuse population and attribution schedule. Do not recreate source coding/testing inside each download. Release-specific repackaging or delivery verification remains foreground when it actually occurs."
      source_ids:
        - un-system-download
        - un-application-download
        - gsf-sci
        - debian-verify
        - libreoffice-install
        - mozilla-installers
    - rule_id: boundary_use
      applies_to: "reference output"
      rule: "Exclude installation, boot, ongoing execution, user services, support after delivery and eventual hardware disposal from the delivery unit; separately model those stages when requested. Input device manufacture shares do not imply that installation/operation is covered."
      source_ids:
        - un-system-download
        - un-application-download
        - gsf-sci
        - debian-verify
        - libreoffice-install
        - mozilla-installers
    - rule_id: boundary_conditions
      applies_to: "conditional exchanges"
      rule: "Actual backup-generator fuels, refrigerant losses, water abstractions, direct discharges, cooling additives and device disposal require distinct atomic rows and primary evidence if within the declared boundary. No combustion emission is assumed from purchased electricity. Where supplier services replace decomposed stages, add one specifically bounded delivery input with primary activity units and upstream inventory, and remove duplicate constituents."
      source_ids:
        - un-system-download
        - un-application-download
        - gsf-sci
        - debian-verify
        - libreoffice-install
        - mozilla-installers
    - rule_id: boundary_profiles
      applies_to: "download_output and dependency delivery"
      rule: "Define the exact file profile and acceptance point before measurement. Offline installer/image delivery ends after declared files are locally accepted. A bootstrap-only profile ends at accepted bootstrap files and discloses missing payload/dependencies. If a bootstrap fetches the actual payload or repository dependencies, a full-delivery profile must include those download stages once, even when interleaved with installation. Separately meter/attribute network fetch, local writes and integrity work versus unpacking, configuration, installation and first-run activity. If inseparable, retain an explicit measured/modelled split and uncertainty; do not call the delivery inventory complete."
      source_ids:
        - libreoffice-install
        - mozilla-installers
        - debian-verify
