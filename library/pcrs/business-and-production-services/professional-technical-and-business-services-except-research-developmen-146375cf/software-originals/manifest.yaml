    - row_id: cooling_blowdown
      reason: No verified scope-compatible untreated cooling-tower blowdown waste identity after refined
        bounded public searches. d2d44ce1 has a specific electrolytic-manganese-slag-material
        washing route despite its broad generic comment; secondary/tertiary-treated wastewater,
        purchased cooling water and optical-assembly polluted groundwater are not substitutes.
        Actual composition, untreated state, reference property and treatment destination require
        confirmation.
