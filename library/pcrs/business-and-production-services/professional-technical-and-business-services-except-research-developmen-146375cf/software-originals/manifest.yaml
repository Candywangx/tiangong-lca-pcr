    decision: "The existing PCR ID is retained and its existing methodology upgraded in place. The
      scoped CPC mapping is accepted; scientific approval, translation review and publication retain
      their separately recorded states. Classification rationale: The protected completed software
      original matches; contract production for others, copies, licensing-only transactions and SaaS
      remain excluded. Historical author assessment:
      docs/reviews/pcr149-original-ids-20261127/83143.json."
    classification_scope: 83143 excludes software produced under contract for others; downloads
      84341/84342, SaaS, licensing, databases and R&D originals are separate outputs.
  unresolved_flow_identities:
    - row_id: prior_original_input
      selected_flow: Previously completed software original used as a reusable component
      reason: No directly verified exact original-component identity with this item basis and upstream
        reuse conditions.
    - row_id: external_test_report
      selected_flow: External executable-software test report delivery
      reason: Search returned hosting/infrastructure proxies with Mass or CTUe references rather than a
        bounded accepted executable-software test-report delivery.
    - row_id: software_original_output
      selected_flow: Completed software original
      reason: Public direct-read software candidates represent packaged copies or developer-tooling
        intermediates with Mass or CTUe quantitative references; no evidenced conversion to this
        completed-original item. Retain blank UUID; do not assert database-wide absence.
    - row_id: server_computer_share
      selected_flow: Rack-mounted development server computer
      reason: Bounded computer candidates are generic systems/subassemblies; no directly verified identity
        confirms the complete configured rack-mounted development server boundary.
    - row_id: requirements_electricity_site
      selected_flow: Alternating current
      reason: Actual creation sites, user voltage and supply mixes must be collected; CN <1 kV and 1–35 kV
        identities do not cover other supplies. Preserve actual site-specific electricity without
        inventing a default global UUID.
    - row_id: implementation_electricity_site
