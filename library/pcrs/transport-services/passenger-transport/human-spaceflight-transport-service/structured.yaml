system_boundary:
  rules:
    - rule_id: function_and_role
      applies_to: "transport_delivery"
      rule: "Include actual completed transport function and its agreed endpoints,quality,duration and safety/recovery inclusions. NASA astronauts labelled crew can be the delivered recipients even when monitoring/piloting or conducting research. Evidence actual recipient,operation-only and dual roles; salary/crew label alone cannot remove all astronauts from N or create two outputs for one person. Carrier-only pilots are not automatically transported space recipients."
      source_ids:
        - nasa-crew-kit
        - virgin-performed
    - rule_id: segment_and_package
      applies_to: "transport_delivery;life_support;ground_support"
      rule: "Fix actual segment or one integrated transport itinerary and compatible endpoint/quality before aggregation. Ascent,coast,dock,return and recovery may be constituent duties,not extra completions. Transport-required standby/docking,ECLSS,training,medical and actual included amenities remain complete. A whole station stay,research/exploration or tourist/hospitality package is a distinct function; separate a transport component only with real subdivision/coverage,not by erasing inclusions."
      source_ids:
        - nasa-crew-kit
        - virgin-brochure
    - rule_id: native_stage_coverage
      applies_to: "all_processes"
      rule: "Close recipient-to-mission-to-stage/vehicle/site/provider/phase coverage. Use actual completed compatible external transport/launch/support result plus only uncaptured cells OR owned physical inputs and uncovered external stages. Provider-included propellant,use release,asset manufacture or recovery replaces that exact foreground cell,never coexists. Internal stage separation,mated carrier release and energy transfers are not extra purchased functions."
      source_ids: []
    - rule_id: actual_route_branches
      applies_to: "stage_operation;carrier_operation;recovery"
      rule: "For capsule branches own actual booster/upperstage/capsule/trunk,abort,docking,standby,parachute/splashdown or land recovery. For winged air launch own mated climb/release,carrier return,hybrid motor,feather/glide/runway/taxi and ground duties. Actual other same-function configurations need complete route-specific physical/native/owner evidence,not copied capsule factors or a product exclusion caused by missing data."
      source_ids:
        - nasa-crew-kit
        - virgin-facts
        - virgin-brochure
        - blue-engines
    - rule_id: whole_lifecycle
      applies_to: "vehicle_lifecycle;ground_support;recovery"
      rule: "This PCR requires native manufacture plus actual delivery,qualification/refit,maintenance,consumables/replacements,recovery and retirement for all attributable stages/capsule/carrier/spaceplane/suits,ECLSS,pad/runway/hangar/missioncontrol and recovery assets. Manufacture-only UUID cannot become a full-life service. Verify whole-object/original component coverage; actual expended stage/trunk/fuel-cartridge and replaced heatshield are owned once."
      source_ids: []
    - rule_id: conditioning_and_provisions
      applies_to: "stage_operation;life_support;ground_support"
      rule: "Include actual fuel/oxidizer/pressurant/purge/cryogenic conditioning,ground deluge/cleaning,air/cabin/suit/food/water/hygiene and thermal/CO2-control resources and all fates. Personal off-duty ordinary subsistence outside this delivered system is an explicit disclosed PCR convention with sensitivity; this does not delete training,onboard/included hospitality or operational provisions,or treat food as labour fuel by default."
      source_ids:
        - nasa-eclss-2017
        - nasa-reactive
        - virgin-brochure
    - rule_id: receiving_environments
      applies_to: "release_fates;recovery"
      rule: "Keep actual chemical species/particle form,phase,trajectory/time and receiving troposphere,stratosphere,other atmospheric layers,outer space,water or soil. No blanket ground-air-unspecified binding,no kg alloy-as-emitted compound or collected waste-as-atmospheric-release. Actual plume/vent/ablation/debris mass and chemical conversion/fates require evidence; uncharacterized physical flows stay inventoried with explicit LCIA limitations."
      source_ids:
        - noaa-reentry-2023
