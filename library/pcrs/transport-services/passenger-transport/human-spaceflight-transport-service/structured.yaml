allocation_rules:
  - rule_id: subdivide_functions
    applies_to: "all_processes"
    rule: "Subdivide actual recipient transport,operation-only support,cargo/research payload,station services and separately sold tour/amenity uses before shared allocation. Support causal resource/engineering or compatible duty shares and alternatives/sensitivity. Passenger Count,payload kg,tonne-km,seat capacity and research output cannot be added; fare is not a physical share."
    source_ids: []
  - rule_id: recipient_completion
    applies_to: "transport_delivery"
    rule: "Count each actual fulfilled compatible person transport obligation once across internal vehicles/stages. True recipient/dual roles do not vanish due crew label; operation-only duties are not extra recipients. Split incompatible endpoints/quality or justify an observed mix; no assumed occupancy,one passenger per seat or universal reference-distance conversion."
    source_ids: []
  - rule_id: failed_and_shared_duty
    applies_to: "all_processes"
    rule: "Preserve attributable scrubbed countdown,abort,failed/uncrewed test,qualification,training,standby,reposition and recovery duties in the evidenced causal programme/cohort. An abort may deliver a separately defined rescue/return function without fulfilling planned destination transport; record real outcome,function and attribution,not automatic planned success. No arbitrary success probability. N=0 gives no finite transport intensity,not zero burden."
    source_ids: []
  - rule_id: native_asset_life
    applies_to: "vehicle_lifecycle;ground_support;carrier_operation;recovery"
    rule: "Actual delivered native asset quantity times same-asset/cohort attributable compatible mission/duty divided by supported total all-user useful duty,then /N. Include tests,cargo/other uses,carrier-only duties and actual expended units. Actual/prospective life and reuse evidence with uncertainty required; advertised maximum reuse or generic flight count is not measured lifetime. Period operating flows are not divided by lifetime again."
    source_ids: []
  - rule_id: whole_components_and_recovery
    applies_to: "all_processes"
    rule: "Whole delivered fuel blend/grain-cartridge/motor/vehicle result OR replacing component/process supplies with exact native mass/provider coverage closure,never both. Original parts and replacement/refurbishment stages distinct. Actual recovered material/energy allocation uses native gate,status and receiver; internal recycled air/water,battery discharge,solar/storage transfer and regeneration are not added purchases or automatic avoided credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_transport
      process_id: "transport_delivery"
      flow_role: "actual fulfilled transport and roles"
      record_type: "actual_record"
      raw_fields: "contract;person;role;dual_role;mission;endpoint_state;trajectory_orbit;quality;duration;segment_itinerary_rule;attempt;completion;provider_cells;other_outputs"
      collection_method: "Read actual service agreement,recipient/role and phase/handover records. Distinguish actual to/from/in-space function,compatible segment/roundtrip grouping and endpoint quality before counting; real transported NASAcrew may count. Trace all mission/stage/provider/attempt duties and included support,not just sales or launch success. Aggregation algorithm: N_G=sum actual recipient transport obligations completed in compatible function/endpoint/quality groupG. Internal stages/vehicles count no extra final units. Unknown role/endpoint/completion makes use incomplete; N_G>0 required."
      unit: "Item(s)"
      frequency: "actual event and mission-period closure"
      temporal_coverage: "same declared mission period and supported assetlife"
      site_scope: "actual transport_delivery responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,roles,native gate,all-user/provider coverage and uncertainty"
    - protocol_id: cp_stage
      process_id: "stage_operation"
      flow_role: "actual stage fuel/oxidizer/native operation"
      record_type: "actual_record"
      raw_fields: "stage;mission;provider;fuel_oxidizer_grade_phase_composition;loaded;delivered;opening_closing_stock;burned;vented;boiloff;spill;recovered;conditioning;abort_test;coverage"
      collection_method: "Measure each actual stage and chemical supply/gate separately; close purchase/loading/storage/conditioning/use/fates. Include actual powered landing,abort,test,standby,solid/hybrid grain leftovers,cryogenic losses,pressurant and purges. Whole formulation/cartridge OR replacing components exclusive; missing real formulation or path is not zero. Aggregation algorithm: Attribute each native required supply by supported actual all-function stage duty/resource shares and /N once. Burned activity comes from mass balance,not purchases; species/phase model handled in cp_release."
      unit: "kg;Item(s);kWh"
      frequency: "actual event and mission-period closure"
      temporal_coverage: "same declared mission period and supported assetlife"
      site_scope: "actual stage_operation responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,roles,native gate,all-user/provider coverage and uncertainty"
    - protocol_id: cp_carrier
      process_id: "carrier_operation"
      flow_role: "actual mated-climb/release/carrier-return duties"
      record_type: "actual_record"
      raw_fields: "carrier;spaceplane;mission;recipient_role;pilot;aircraft_configuration;fuel_grade;flight_phase_altitude;taxi;climb;release;return;holding;training;ground_use;stock_burn;all_users;provider_cells"
      collection_method: "Observe actual carrier whole sortie,taxi/mated climb/release/return and training/failure duties; spaceplane release is internal,not extra final transport. Reconcile native jet fuel,altitude-phase emissions/resources and all-use shares; aircraft/engine/gear life via cp_life,ground responsibilities via cp_ground. Actual completed external carriage replaces exact owned cells only. Aggregation algorithm: Native period resources * supported actual cohort/all-user resource or duty share /N. Do not turn carrier pilots into space recipients or charge the full mated sortie separately for every person."
      unit: "kg;kWh;hour;Item(s)"
      frequency: "actual event and mission-period closure"
      temporal_coverage: "same declared mission period and supported assetlife"
      site_scope: "actual carrier_operation responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,roles,native gate,all-user/provider coverage and uncertainty"
    - protocol_id: cp_eclss
      process_id: "life_support"
      flow_role: "actual cabin/suit provisions and fates"
      record_type: "actual_record"
      raw_fields: "vehicle;person_roles;phase_duration;air_quality;oxygen_nitrogen_water_food;loading;recycle;consumption;humidity;CO2_removal;thermal;energy;sorbent;hygiene;waste_vent_receiver;stocks;included_support"
      collection_method: "Collect actual cabin/suit operating configuration and supplies through actual transport/standby/abort/return boundary. Reconcile oxygen,nitrogen,water,food,CO2-control medium,thermal energy and all actual waste/recycle/vent fates separately. Ventilation/recycle is not an external supply; CO2 removal is not automatically storage or avoided emission. No standard metabolic/meal/water rate adopted. Aggregation algorithm: Actual native supply needed after stock/recycle/fate balance * supported function/cohort share /N. Same real recipient counted once; actual operation support and co-functions remain attributed."
      unit: "kg;kWh;Item(s);hour"
      frequency: "actual event and mission-period closure"
      temporal_coverage: "same declared mission period and supported assetlife"
      site_scope: "actual life_support responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,roles,native gate,all-user/provider coverage and uncertainty"
    - protocol_id: cp_ground
      process_id: "ground_support"
      flow_role: "actual site/control/training/support resources and assets"
      record_type: "actual_record"
      raw_fields: "site;pad_runway_hangar;missioncontrol;training_medical;hospitality_inclusions;meters;voltage;water_deluge;fuel_handling;loss;assets;life;native_gate;all_functions;provider_coverage;waste_receiver"
      collection_method: "Collect actual site/pad/runway/GSE,missioncontrol,qualification/training/medical,loading/cleaning/deluge and organiser resources,assets/maintenance/retirement and fates. Actual included hospitality/keepsakes travel must be owned or transparently subdivided from a real distinct package; do not erase because outside spacecraft. Verify external AC/DC supply gates/internal transfers and provider-included cells. Aggregation algorithm: Actual native period flows * supported all-function resource/duty share /N; same-asset manufacture uses useful-life share via cp_life,not repeated life division of current inputs."
      unit: "kg;m3;kWh;Item(s);hour"
      frequency: "actual event and mission-period closure"
      temporal_coverage: "same declared mission period and supported assetlife"
      site_scope: "actual ground_support responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,roles,native gate,all-user/provider coverage and uncertainty"
    - protocol_id: cp_life
      process_id: "vehicle_lifecycle"
      flow_role: "actual delivered assets and all-user useful-life coverage"
      record_type: "actual_record"
      raw_fields: "asset_serial_cohort;native_quantity;manufacture_gate;original_parts;delivery;qualification_test;reuse;all_users_flights_duty;remaining_life;refurbish;replacement;expended;jettison;retirement;provider_included_phases;uncertainty"
      collection_method: "Verify actual complete manufactured object and native quantity/coverage. Collect same-asset/cohort compatible all-user useful duty including cargo/tests/other functions,actual expended units and reuse/refit history. Inventory each missing stage,heatshield,cartridge/casing,battery,solar/thermal/suit/pad/runway/recovery asset separately once. Full provider use cells replace matching operation cells; no manufactured asset relabelled full-life service. Aggregation algorithm: q_j=Qnative_j*(Dcohort_j/Dtotal_allusers_j)/N; compatible positive supported life denominator. Expended actual use and other stages recorded separately,no blanket published reuse count."
      unit: "Item(s);kg;hour;flight"
      frequency: "actual event and mission-period closure"
      temporal_coverage: "same declared mission period and supported assetlife"
      site_scope: "actual vehicle_lifecycle responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,roles,native gate,all-user/provider coverage and uncertainty"
    - protocol_id: cp_recovery
      process_id: "recovery"
      flow_role: "actual landing/recovery and collected-material handover"
      record_type: "actual_record"
      raw_fields: "mission;landing_mode;capsule_spaceplane;recipient;ship_crane_helicopter_land_team;provider_scope;actual_native_operations;assets;resources;heatshield;remaining_reused;ablation;fragments;waste_collection;receiver;coverage"
      collection_method: "Collect actual splashdown,parachute/airbag/winged runway,ship/crane/medical/optional helicopter or land recovery and return handover. External complete recovery operation only at real provider handover; otherwise own physical assets/resources/releases,including marine/air/land routes and support. Close shield/debris remaining,reuse,atmospheric ablation,direct loss and collected waste without collapsing fates. Aggregation algorithm: Actual native completed provider operations OR uncovered owned native resources * supported programme/function shares /N. Collected material kg is separate from emitted chemical mass; no double one recovery per person."
      unit: "Item(s);kg;kWh;m3;hour"
      frequency: "actual event and mission-period closure"
      temporal_coverage: "same declared mission period and supported assetlife"
      site_scope: "actual recovery responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,roles,native gate,all-user/provider coverage and uncertainty"
    - protocol_id: cp_release
      process_id: "release_fates"
      flow_role: "actual chemical/particle release by phase and receiver"
      record_type: "actual_record"
      raw_fields: "mission_stage;phase_time;altitude_layer_or_space;actual_fuel_composition;burned_vented;engine_load;species_molecule_particle;mass_basis;ablation_alloy_vs_compound;receiver;monitoring_model;LCIA_coverage;uncertainty"
      collection_method: "Measure or independently support each actual phase-specific species/particle and receiver. Loaded N2Ooxidizer is not unburned emission; alloyAl is not automaticallyAl2O3 or airborneAlmetal. Retain actual plume/vent/ablation/debris chemistry/native mass and trajectory,including all real C/H/N species,soot/metal/other particles. Known high altitude/space not ground-air-unspecified. Missing species/quantity/fate is incomplete; missing characterization is disclosed separately without deleting physical flow. Aggregation algorithm: For each phase/species q=sum actual measured mass or supported actual burned/vented/ablated activity * applicable source-backed chemical/engine/trajectory model,then native-basis conversion,causal share and /N once. No generic rocket factor or stoichiometric perfect-combustion assumption."
      unit: "kg species;native particle mass;phase;trajectory"
      frequency: "actual event and mission-period closure"
      temporal_coverage: "same declared mission period and supported assetlife"
      site_scope: "actual release_fates responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,roles,native gate,all-user/provider coverage and uncertainty"
  calculation_rules:
    - id: completion
      applies_to: "completed_person_transport"
      rule: "N_G=sum actual fulfilled transported-person obligations in predeclared compatible groupG; internal stages/vehicle changes do not add N. For a whole contracted transport itinerary count once; separately fulfilled segments require their own real function/quality. N_G>0; unknown counts incomplete,failed planned destination is not automatically fulfilled."
      inputs:
        - "actual role/contract/endpoint/quality and mission-stage ledger"
      output: "N_G Item(s)"
      source_ids: []
    - id: native_supply
      applies_to: "stage_operation;carrier_operation;life_support;ground_support"
      rule: "Reconcile actual delivered+opening stock+external additions=closing stock+used/converted+vented/spilled+returned/exported,with internal transfers cancelling across the same boundary. Actual required supply and burned activity differ; normalize attributed native supply/N once,whole formulation OR replacing components exclusive."
      inputs:
        - "actual supply/loaded/stock/use/return/loss records"
      output: "native required quantity/N"
      source_ids: []
    - id: species_phase
      applies_to: "release_fates"
      rule: "Compute each actual chemical/particle mass on its own molecule/native basis from monitoring or supported phase-specific engine/composition/trajectory model. Keep N2Oproduct versus unburnedN2O,N2O4 versusN2O,kgN/kgC versus compound,water liquid/vapour and altitude/space receiver separate. Unsupported conversion/LCIA factor remains gap,not zero or a ground proxy."
      inputs:
        - "actual species/phase/model/receiver and applicable raw activity"
      output: "phase-specific native species quantity/N"
      source_ids: []
    - id: asset_life
      applies_to: "vehicle_lifecycle;ground_support;recovery"
      rule: "q_j=Qnative_j*(Dcohort_j/Dtotal_allusers_j)/N for the same actual delivered asset/cohort with compatible positive supported useful duty and all users/functions. Preserve actual expendable units,refit/replacement/qualification/retirement and uncertainty separately. Do not redivide period operating inputs or turn asset manufacture into full-life service."
      inputs:
        - Qnative_j
        - Dcohort_j
        - Dtotal_allusers_j
        - N
        - "provider coverage"
      output: "native asset share plus missing stages"
      source_ids: []
    - id: shared_provider
      applies_to: "all_processes"
      rule: "Actual completed supplier native demand * supported actual cohort/function share /N replaces only exact included cells. Session/launch/recovery serving multiple people is not procured once per person. Owned internal stage/carrier/employee duty is not another purchased result. Check mass/native/provider closure before removing replaced cells; missing cells remain mandatory."
      inputs:
        - "native provider result quantity"
        - "true coverage"
        - "actual resource/duty shares"
        - N
      output: "exclusive native supplier and foreground inventory"
      source_ids: []
    - id: material_fate
      applies_to: "life_support;recovery;release_fates;ground_support"
      rule: "Close every actual water/chemical/asset-part fate on compatible measured basis; distinguish recovered material,disposed waste,direct liquid/air/space species and remaining stock. Whole heatshield mass cannot simultaneously be intact collected waste and all ablated release. Elemental alloy budget is evidence for separately identified chemical species,not automatic emission identity or unsupported compound mass."
      inputs:
        - "actual stock"
        - reused
        - recovered
        - converted
        - vented
        - ablated
        - collected
        - "direct-loss receiver"
      output: "closed native material/species/fate ledger"
      source_ids: []
  data_quality_requirements:
    - id: dq_expansion
      applies_to: "all_processes"
      requirement: "MANDATORY add one atomic row for each actual unrepresented input,output,asset,provider result,waste or direct species: unique row_id;one existing process_id;direction and product/waste/elementary type;single actual chemical/material/function and state/formulation;UUID or explicit unresolved identity;native property/unit;actual quantity and measured/calculated basis;valid same-parent collection_protocol_id;raw evidence/source;provider gate/stage coverage;receiver/phase/altitude/known subcompartment;uncertainty and applicable normalization. No plural category collector. Unknown occurrence,identity,amount,scope or fate is incomplete,not zero; actual included obligations cannot be omitted."
      evidence: "all actual collection protocols and source/provider/fate evidence"
    - id: dq_recipient
      applies_to: "transport_delivery"
      requirement: "MANDATORY actual fulfilled person-space transport,role/dualrole,endpoint/state/trajectory,duration,quality and segment/itinerary grouping. Distinguish carrier-only pilots and operation support from transported astronauts even when called crew; no crew-label-only removal or duplicate same person. Tickets,seatcapacity,launchcount,stationdays or altitude alone do not establishN. Unknown role/completion blocks finisheduse."
      evidence: "cp_transport;actual contract,role,endpoint and completion evidence"
    - id: dq_routes
      applies_to: "stage_operation;carrier_operation;vehicle_lifecycle;recovery"
      requirement: "MANDATORY complete actual capsule,liquid/solid/hybrid stage,carrier and winged branches. Add actual solid boosters/formulated propellant,cryogenic storage/conditioning/purge,MMH/NTO/MONorother actual formulation,stage motors/interstage/fairings,feather/flight-control/gear and separate actual land/sea recovery as required using every dq_expansion field. No generic launcher/carrier factor or automatic copied propellant grade. Missing data blocks application,not product membership."
      evidence: "cp_stage;cp_carrier;cp_life;cp_recovery;actual configured physical route"
    - id: dq_eclss_inclusions
      applies_to: "life_support;ground_support"
      requirement: "MANDATORY each actual cabin/suit air,food/water,hygiene,CO2-removal,sorbent,thermal/power,packaging,waste/recycle/vent and transport-required training/medical/standby supply/native asset/fate with dq_expansion fields. Actual included lodging/hospitality/keepsakes/user devices cannot disappear as offvehicle or personal food; demonstrate real separate package subdivision or retain completeness gap. No universal person-day ration,oxygen/water rate or assumed one device/meal."
      evidence: "cp_eclss;cp_ground;actual operating and inclusion records"
    - id: dq_lifecycle
      applies_to: "vehicle_lifecycle;ground_support;recovery"
      requirement: "MANDATORY all attributable launcher/stage/capsule/trunk/carrier/spaceplane,groundpad/runway/control/training,ECLSS/suit and recoveryship/crane/helicopter/landassets manufacture native quantities,actual original coverage,same-asset all-user life,qualification/refit/maintenance/replacements and retirement. Each actual missing asset/stage gets dq_expansion fields; a completed external result replaces only true coverage. No lifetime-as-service identity or advertisedreuse lifetime default."
      evidence: "cp_life;cp_ground;cp_recovery;actual asset/provider records"
    - id: dq_releases_lcia
      applies_to: "release_fates;recovery"
      requirement: "MANDATORY actual phase/altitude/outerspace chemical and particle identity,molecule/element basis,quantity and receiving compartment for all exhaust/vent/ablation/debris/direct liquid fates. Add every actual C/H/Ncompound,soot/metal/other particle separately using dq_expansion fields. Measured alloyelement budget cannot assign chemical form; neither all loadedN2O emitted nor all heatshield ablated. Physical identity/quantity/fate gaps and missing LCIA characterization are separately disclosed; no groundair-unspecified proxy or deletion of uncharacterized flow."
      evidence: "cp_release;cp_recovery;actual monitoring/material-fate/trajectory evidence"
    - id: dq_failed_cofunctions
      applies_to: "all_processes"
      requirement: "MANDATORY retain all causal abort/failure/test/training/standby/reposition/recovery and cargo/research/other-user burdens; evidence shares and uncertainty. Real abort/rescue/return function may differ from planned destination completion. No fabricated success probability,lifetime,occupancy,allocation range or zero missing activity. Unknown causal attribution remains gap before completeduse."
      evidence: "all protocols;actual programme and all-function duty ledger"
    - id: dq_evidence
      applies_to: "all_processes"
      requirement: "MANDATORY verify direct actual native type,state,grade/gate,property/unit and official names beforeUUID binding; known altitude/space receiver cannot be collapsed to airunspecified. Source cases support only described configurations; NASA2017ECLSS is qualitative,VG2021/undated2023factsheet is historical,BlueOrigin publicweb self-report not full original,NOAA2023 gives no perflight mass or characterization. OwnPCRCount/allocation/lifecycle formulas are not source mandates; actual required quantities remain mandatory even without generic ranges."
      evidence: "actual native records and source-specific scope"
validation_rules:
  - rule_id: validate_reference
    applies_to: "completed_person_transport"
    rule: "Require1Item(s),actual compatible fulfilled person-space transport,all endpoint/quality/role qualifiers andpositiveN; reject sales/capacity/launch/altitude-only,crew-label exclusion and repeatedinternalphase count."
    source_ids: []
  - rule_id: validate_native_coverage
    applies_to: "all_processes"
    rule: "Require actual single-owner stage/provider and native supply/asset/lifecycle coverage; no whole/components,cartridge/grain,completed provider/physical stage or external/internalenergy duplication. Missing required real cells blocks finisheduse."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "all_processes"
    rule: "Require actual supplied/loaded/stock/burned/vented/recovered/materialfate closure,molecule/element and liquid/gas bases. N2Ooxidizer product is not N2Oemission; NTO/MON/hydrazines distinct; ablated/collected/reused shield/debris not doublecounted."
    source_ids: []
  - rule_id: validate_environment
    applies_to: "release_fates;recovery"
    rule: "Require actual phase/altitude/space/chemical-form receiver and uncharacterizedphysicalflow disclosure. Do not bind known highaltitude/space to groundair-unspecified or infer all emitted chemical mass from manufactured alloy. MissingLCIA factor does not imply0inventory or complete impactcoverage."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "all_processes"
    rule: "Require every actual omitted material/function/asset/species/fate atomic dq_expansion row and valid same-parent protocol,source/nativequantity and uncertainty; no unknown=zero. True included provisions retained; N0no finite intensity; candidate/checkpass is not completedpackage/publicationreadiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after all required role,identity,quantity,coverage,life,fate and physical inventory obligations are completed/reviewed"
  allowed_use: "Actual declared to/from/in-space transport endpoints,quality,roles,route,period and evidenced full lifecycle;uncharacterized flows require impact-coverage disclosure"
  excluded_use: "Crew-label blanket exclusion,tickets/capacity/launch/altitude as completion,omitted inclusions,groundair as highaltitude/space,operatingCO2 as whole lifecycle"
  required_metadata: "All reference qualifiers;actual recipient-role/endpoint/mission-stage/provider/ECLSS/recovery;native supplies/asset life;species/phase/altitude/medium and LCIAcoverage"
  required_quality_disclosure: "Role/completion/chemical/nativequantity/provider/fate/lifeprojection/allocation and characterization gaps;personal-subsistence boundary sensitivity"
  update_trigger: "Changes in actual function/endpoint/quality/role/route/vehicle/propellant/ECLSS/inclusions/provider/life/fate or characterization applicability"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC3.0 Explanatory Notes,30June2025,PDFp364. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "64250 actual passenger transport to/from/in outerspace by anymeans; classification only,no universal altitude,functional unit or crew exclusion."
  - id: "nasa-crew-kit"
    type: "official_guidance"
    reference: "NASA Commercial Crew Program Press Kit,actual HTML snapshot21October2026,SpaceX/Boeing Operations. https://www.nasa.gov/commercial-crew-program-press-kit/"
    used_for: "Actual astronaut-recipient,stage/capsule/trunk/propulsion/docking/return/recovery interfaces. No currentmission schedule,capacity,thrust,mass,success/life or numericfactor default; not allspacecraft rule."
  - id: "nasa-eclss-2017"
    type: "official_guidance"
    reference: "NASA,ECLSS Put to the Test for Commercial Crew Missions,8March2017. https://www.nasa.gov/humans-in-space/eclss-put-to-the-test-for-commercial-crew-missions/"
    used_for: "Qualitative actual cabin/suit air/O2/N2/pressure,CO2control,temperature/humidity and abort support through countdown-to-splashdown; no generic consumption,metabolism,life or fullflight inventory."
  - id: "blue-engines"
    type: "literature"
    reference: "Blue Origin Engines,BE3PM official public webpage accessed21October2026. https://www.blueorigin.com/engines"
    used_for: "Case-specific liquidoxygen/liquidhydrogen human-flight propulsion and powered recovery/reignition interface only. No currentflightcount,thrust,life,zero lifecycle or fuel factor adopted."
  - id: "virgin-facts"
    type: "literature"
    reference: "Virgin Galactic Company Overview,undated fact sheet with2023upcoming context,PDFpp4–6. https://bynder.virgingalactic.com/m/6b6bc9547042ed2c/original/Virgin-Galactic-Company-Fact-Sheet.pdf"
    used_for: "Historical actual carrier/winged feather-glide architecture and HTPB/N2O hybrid fuel/oxidizer identity; no currentfleet,thrust,geometry,life,actual formulation/quantity or genericemission default."
  - id: "virgin-brochure"
    type: "literature"
    reference: "Virgin Galactic Brochure,official public page accessed21October2026. https://www.virgingalactic.com/virgin-galactic-brochure"
    used_for: "Actual advertised mated climb/release/hybrid boost/feather/glide/runway and training/hospitality/keepsake interfaces; offers not measured inventory or actual currentflight readiness. No altitude/time/speed/default inclusions for everyoperator."
  - id: "virgin-performed"
    type: "literature"
    reference: "Virgin Galactic Successfully Completes First Fully Crewed Spaceflight,11July2021,official report. https://investors.virgingalactic.com/news/news-details/2021/Virgin-Galactic-Successfully-Completes-First-Fully-Crewed-Spaceflight/default.aspx"
    used_for: "Historical actual mothership release and winged runway return with distinct pilot/mission-specialist roles; no numerictrajectory,crewcount,current certification or genericfactor adopted."
  - id: "noaa-reentry-2023"
    type: "official_guidance"
    reference: "NOAA CSL,NOAA scientists link exotic metal particles in the upper atmosphere to rockets,satellites,16October2023. https://www.csl.noaa.gov/news/2023/388_1016.html"
    used_for: "Actual distinct-metal reentry/stratospheric aerosol pathway; no perflightmass,universal species/form,fraction,allalloy oxidized or LCIA characterization factor."
  - id: "nasa-reactive"
    type: "official_guidance"
    reference: "NASA White Sands Reactive Fluids,15June2016. https://www.nasa.gov/centers-and-facilities/white-sands/reactive-fluids/"
    used_for: "Actual spacecraft material-compatibility chemical families including MMH,NTO/MON,O2 and N2O; not proof a mission uses a particular grade,composition,quantity or emissionfactor."
