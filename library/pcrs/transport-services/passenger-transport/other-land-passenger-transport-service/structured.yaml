allocation_rules:
  - rule_id: subdivide_first
    applies_to: "other_land_service"
    rule: "Subdivide dedicated duties/providers before any residual allocation. For each unavoidable shared burden record actual physical cause, complete compatible all-user denominator and sensitivity; no seat/capacity/fare share is a default."
    source_ids:
      - ghg-product-2011
  - rule_id: coupled_drive_users
    applies_to: "other_land_service"
    rule: "Allocate the measured common drive/support to actual directional/service cohorts using evidenced engineering/activity drivers and all actual users. Nonlinear load, counterweight and empty return behavior must be retained; passenger-km, vertical mgh or rated throughput alone is not proof of electricity consumed. N=0 has no finite per-passenger result; retain actual zero-output duties in their causal pool."
    source_ids:
      - ghg-product-2011
  - rule_id: capital_life
    applies_to: "other_land_service"
    rule: "For each same supplied asset/component, allocate actual manufacture quantity by cohort duty/positive compatible total life duty across all users, periods, seasons and relocation uses, then normalize once. Initial installation and renewals are different events; no brochure years or accounting depreciation substitutes for physical life."
    source_ids:
      - ghg-product-2011
  - rule_id: other_outputs
    applies_to: "other_land_service"
    rule: "Keep genuinely separate cargo, supplied meals/guide packages or other products in their actual native functions; subdivide first and justify residual causal shares. Do not add passengers, cargo kg, guides, food or ticket money as dimensionally equivalent outputs; incidental included items do not create fictitious co-products."
    source_ids:
      - ghg-product-2011
  - rule_id: recovery
    applies_to: "other_land_service"
    rule: "Record actual recovery/waste destinations and scope, without assumed avoided-bus/grid/virgin-material credits. Internal reused electricity/fuel/material is not another virgin input or export. Apply one disclosed recycling/allocation treatment with required physical exchanges retained."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_rides
      process_id: "other_land_service"
      flow_role: "completed_ride"
      record_type: "ride_completion_record"
      raw_fields: "installation_id; actual_mode; cohort_id; origin_destination; horizontal_vertical_distance; direction; ride_id; boarding_engagement; alighting_disengagement; actual_persons; crew_role; completion; ticket_pass_reconciliation; season_period; sampling_uncertainty;actual_urban_suburban_extent;residual_function_neighbor_decision;scheduled_or_nonscheduled_withdriver;actual_driver_operator_roles;declared_extent_quality_time;internal_leg_return_output_scope"
      collection_method: "Reconcile actual boarding/engagement and completion evidence with carrier/dispatch/turnstile records and supported sampling. Count actual completed persons once; passes, offered places, cabin/chair/tow cycles or a resort visit do not prove N. Preserve partial/failed/rescue rides and their burdens; a return needs independent completion. Document actual adjacent functional exclusions before residual eligibility. Record actual urban/suburban extent/responsibility only, with no borrowed city-adjacency threshold. Define one coherent passenger conveyance before counting; internal nodes/vehicle changes/returns already included cannot create extra final outputs. Distinguish real passenger completion from driver/operator role and availability-only functions."
      unit: "Item(s); actual m/km; time"
      frequency: "each duty and period/lifetime interface"
      temporal_coverage: "same complete cohort/period and necessary full life"
      site_scope: "actual eligible installation/vehicle/source/incidentals and all relevant users; cable and non-cable/nonscheduled actual responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/balance/coverage/uncertainty"
    - protocol_id: cp_energy
      process_id: "other_land_service"
      flow_role: "drive_ac; diesel_supply; export_ac"
      record_type: "coupled_drive_meter_stock_record"
      raw_fields: "installation_id; architecture; gross_AC_import; export_AC; voltage_gate; converter_losses; storage_change; internal_regeneration; brake_dissipation; counterweight; loads_both_directions; empty_carriers; startup; standby; weather_shutdown; test_retrieval; fuel_blend; supply_stock_withdrawal_burn_spill_recovery_transfer; shared_owner;actual_cable_or_other_mechanism;vehicle_id;source_gate;mobile_or_stationary;charging_discharge_loss;HVAC_auxiliary;alluser_coupled_pool;actual_model_evidence"
      collection_method: "Measure the complete coupled drive and actual terminal interface by operating mode; retain loaded and empty returns, starts, standby, weather closures, tests and emergency recovery. Record both directions/all cohorts before allocation; descending load or gravity assistance does not establish an independently free/negative service. Keep gross import/export/internal recovery/losses distinct. Fuel net withdrawal = opening + receipts - closing - returns on a compatible boundary; separate actual burned, spilled, recovered and transferred fates. Use one compatible whole-blend supply plus composition/origin ledger OR component supplies replacing its coverage, never both. Only evidenced actual combustion drives direct emissions, never supply by assumption. Divide attributed native quantities by the same N once. For actual non-cable self-propelled or central-drive operation measure/independently model actual source/charge/storage/auxiliary losses, running/empty/idling/traffic/standby/test/rescue by source and all users before allocation. Preserve actual motor/guidance/control/cooling and fuel-cell or other conditioning supplies; internal source electricity/recovery cannot be purchased again. No mgh/nominal-power/load factor substitutes for actual supported operating evidence."
      unit: "MJ; kWh; kg; actual fuel volume with supported state; time; actual load"
      frequency: "each duty and period/lifetime interface"
      temporal_coverage: "same complete cohort/period and necessary full life"
      site_scope: "actual eligible installation/vehicle/source/incidentals and all relevant users; cable and non-cable/nonscheduled actual responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/balance/coverage/uncertainty"
    - protocol_id: cp_support
      process_id: "other_land_service"
      flow_role: "terminal_ac; tap_water"
      record_type: "support_site_boundary_record"
      raw_fields: "site_id; complete_provider_cells; actual_meter_and_water; drive_gate_overlap; conditioning; control; terminal_handling; land_occupation_transformation; path_geometry; construction_transport; shared_users; actual_driver;vehicle_guideway_road_site;free_accompanying_loads;actual_driver_dedicated_support;provider_q_u;native_demand_A_u;cohort_alluser_share"
      collection_method: "Meter actual supporting quantities and map each site/provider gate. Identify civil foundations, towers, terminals, tracks/tow corridor, temporary installation and maintenance/rescue support. Subdivide dedicated service, then allocate a measured shared residual by evidenced compatible all-user drivers. Snowmaking/grooming/gear/land effects activate only on actual relevant branches and require separate identities/quantities; neither all resort activity nor an assumed zero belongs to the ropeway. Normalize attributed native quantity/N. Record actual non-cable road/guideway/contact/station/depot and driver/accessibility/climate support responsibilities as well as cable paths. Actual included guides/food/accompanying loads remain in scope. For every native provider q_u, multiply real compatible A_u and justified cohort/all-user share, then/N once; only a one-whole-reference-equivalent result needs no additional normalization. Match exact covered cells before replacing foreground."
      unit: "MJ; kg; actual area/time; native provider units"
      frequency: "each duty and period/lifetime interface"
      temporal_coverage: "same complete cohort/period and necessary full life"
      site_scope: "actual eligible installation/vehicle/source/incidentals and all relevant users; cable and non-cable/nonscheduled actual responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/balance/coverage/uncertainty"
    - protocol_id: cp_maintenance
      process_id: "other_land_service"
      flow_role: "mineral_lube_oil"
      record_type: "maintenance_component_balance"
      raw_fields: "installation_component; task; actual_formulation; oil_stock_issues_recovery_losses; replaced_parts; rope_coating_lubrication; brake_rail_wheel_wear; coolant_refrigerant; provider_scope; actual_fate;actual_all_mechanisms;tyre_rail_wheel_rack_coil_reaction_guide_contactwear;source_storage_cooling_stock;initial_inventory_vs_period_topup"
      collection_method: "Use actual work orders, formulation certificates and component/fluid balances. Separately record new supplies, reuse, recovery, wastes and direct species; oil issue does not prove oil leakage or waste. Identify actual greases, chemicals, batteries, refrigerants, braking/grip/roller/track components and renewal cycles, each as its actual atomic record. Inclusive maintenance results replace their covered supplies/emissions once. Attribute actual task quantity/N. For actual non-cable drives/tyres/wheels/rail/rack/coil/reaction plate/levitation/contact/control/storage/cooling, read actual maintenance/stock and measured source/receiver wear records, not zero-wear inference from propulsion label. Independently separate supplies, replacement, recovery, contaminants/deposition/runoff/air/water/soil and waste. Initial long-term cryogen/battery/equipment inventory not included in whole supply is allocated at native delivered/lifetime gate with retained recovery; actual period topup/use/fate remains distinct, circulation/recondensation/retention not new supply."
      unit: "kg; actual component quantities"
      frequency: "each duty and period/lifetime interface"
      temporal_coverage: "same complete cohort/period and necessary full life"
      site_scope: "actual eligible installation/vehicle/source/incidentals and all relevant users; cable and non-cable/nonscheduled actual responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/balance/coverage/uncertainty"
    - protocol_id: cp_assets
      process_id: "other_land_service"
      flow_role: "steel_wire_rope; electric_motor; aerial_cabin; funicular_car; chair_carrier; platter_tow_device"
      record_type: "complete_installation_life_register"
      raw_fields: "asset_id; actual_mode; native_delivered_quantity; manufacturing_gate; initial_component_inclusion; construction_installation; replacements; all_life_duty; cohort_duty; all_users_periods; relocation_reuse; retirement; uncertainty;whole_vehicle_or_installation;guideway_contact_drive_control_auxiliary;manufacture_only_gate;source_storage_cooling_initial_inventory;native_cohort_wholelife_duty"
      collection_method: "Build the complete installation and required branch-equipment register, not only these example cards. For each same physical asset, use actual supplied manufacture quantity times cohort duty/compatible positive all-user complete-life duty, then/N. Choose complete installation supply OR its initial component bill without overlap; separately add uncovered replacements, operation, maintenance, installation/relocation and retirement/treatment. A manufacturing UUID conveys only its actual supply scope, never whole-life transport. Financial depreciation, rated capacity and a brochure life are not physical useful duty. For every actual non-cable vehicle/guide/contact/drive/control/source/storage/auxiliary/site asset register actual native manufacture and separately covered installation/renewal/maintenance/retirement stages; same physical cohort complete-all-user useful duty and independent native quantity are mandatory. Example cable assemblies do not limit required asset register."
      unit: "kg; Item(s); actual duty units"
      frequency: "each duty and period/lifetime interface"
      temporal_coverage: "same complete cohort/period and necessary full life"
      site_scope: "actual eligible installation/vehicle/source/incidentals and all relevant users; cable and non-cable/nonscheduled actual responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/balance/coverage/uncertainty"
    - protocol_id: cp_fates
      process_id: "other_land_service"
      flow_role: "spent_mineral_oil; wash_wastewater; retired_steel_rope"
      record_type: "individual_stream_receiver_record"
      raw_fields: "stream_id; actual_mixture_state; native_weight; water_contaminants; stock_change; waste_product_status; source_medium; receiver_gate; collection_transport; treatment_scope"
      collection_method: "Independently weigh/characterize each actual stream and retain receiver and treatment evidence. Reconcile supplies/stocks/recovery, physical residues and direct releases without creating residual mixtures. Product recovery, waste handover, collection transport and treatment are distinct responsibilities; avoid whole-asset/component waste duplication. No plant-mix UUID or clean scrap identity substitutes for an unmatched generation-gate contaminated rope. Attribute independent native fate quantity/N."
      unit: "kg; actual receiver units"
      frequency: "each duty and period/lifetime interface"
      temporal_coverage: "same complete cohort/period and necessary full life"
      site_scope: "actual installation and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/balance/coverage/uncertainty"
    - protocol_id: cp_emissions
      process_id: "other_land_service"
      flow_role: "fossil_co2_air; fossil_ch4_air; n2o_air; pm25_air"
      record_type: "source_species_medium_record"
      raw_fields: "source_id; stationary_or_mobile; actual_technology; duty; actual_burned_fuel; measured_species_mass; model_source_version_unit; carbon_nitrogen_basis; size_class; medium_subcompartment; overlap; uncertainty;actual_mobile_or_stationary_technology;charge_cooling_fuelcell_or_other_source;actual_compound_size_origin_medium;uncaptured_wear_deposition_runoff"
      collection_method: "Use compatible measurements or fully supported source/technology/activity-specific models; record actual chemical basis and receiving compartment. Stationary-source methods are not automatically road/mobile factors or vice versa. Preserve other actual fuel origins, combustion and mechanical wear, refrigerants, water/soil/runoff species and uncharacterized releases. Do not derive a species from CO2-equivalent or input-stock deficit. Sum non-overlapping attributed native species/N. Actual mobile, stationary, fuel-cell, cooling/storage/contact and other sources need separately applicable species models/monitors, actual activity/chemical/origin/basis and receivers. National road fuel-sold or full-oxidation conventions are not actual site burning or complete species speciation; no transferred cable/stationary/mobile default factors. Known receiving subcompartment is retained."
      unit: "kg of each species; size/medium-specific native units"
      frequency: "each duty and period/lifetime interface"
      temporal_coverage: "same complete cohort/period and necessary full life"
      site_scope: "actual eligible installation/vehicle/source/incidentals and all relevant users; cable and non-cable/nonscheduled actual responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/balance/coverage/uncertainty"
    - protocol_id: cp_incidentals
      process_id: "other_land_service"
      flow_role: "completed_ride"
      record_type: "actual_transport_bundle_record"
      raw_fields: "actual_service_contract; included_guides_food_drink; actual_item_provider_formulation_quantity; guide_support; separately_charged_outputs; coverage_cells; completion_link;actual_free_luggage_animals_items;actual_native_provider_intensity;actual_compatible_demand;provider_coverage_matrix"
      collection_method: "Determine the actual delivered transport bundle. Where accompanying items/animals, guides, food or drink are included without separate charge, retain the actual service and independently identify every necessary food/material/provider/support record with native quantity and scope. No default meal, guide-hour or food recipe is prescribed. A complete supplied incidental result replaces only its covered constituents; separately charged products need actual subdivision/allocation. Unknown included content blocks complete-bundle use. Actual free accompanying luggage/animals/items influence compatible measured transport/support demand, not an additional fare/passenger output; animal passenger load is not presumed animal traction. For actual native incidental provider q_u use actual compatible A_u*cohortshare/N and replace exact included recipe/material/support/fate cells only. Unknown actual contents or native demand blocks completion."
      unit: "actual item/material/provider native units"
      frequency: "each duty and period/lifetime interface"
      temporal_coverage: "same complete cohort/period and necessary full life"
      site_scope: "actual eligible installation/vehicle/source/incidentals and all relevant users; cable and non-cable/nonscheduled actual responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/balance/coverage/uncertainty"
  calculation_rules:
    - id: normalize_actual
      applies_to: "other_land_service"
      rule: "For actual physical quantity attribute the compatible cohort/all-user share then/positive N once. For native provider intensity q_u first multiply actual compatible demand A_u and justified share, then/N; hour/vehicle-trip/animal-day/passenger-distance are not person-service Count. Only a provider already exactly equivalent to one whole declared reference bypasses further normalization; exact included cells replace foreground once."
      inputs:
        - cp_rides
        - cp_energy
        - cp_support
        - cp_maintenance
        - cp_fates
        - cp_emissions
        - cp_incidentals
      output: "attributed native quantity per reference flow"
      source_ids:
        - ghg-product-2011
    - id: asset_duty
      applies_to: "other_land_service"
      rule: "Delivered manufacture quantity times same-asset cohort duty/positive compatible complete-life all-user duty, then/N; lifetime allocates only actual supplied coverage. Retain independent uncovered install/operation/maintenance/retirement and component replacement ownership."
      inputs:
        - cp_assets
      output: "attributed native quantity per reference flow"
      source_ids:
        - ghg-product-2011
    - id: coupled_energy
      applies_to: "other_land_service"
      rule: "Use metered whole common drive quantities and actual operating/engineering evidence before causal cohort partition. Internal recovery changes measured demand, not a duplicate product. External exports use their actual separate gross gate; no assumed counterweight/occupancy/speed proportionality."
      inputs:
        - cp_energy
      output: "attributed native quantity per reference flow"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: actual_mode_and_completion
      applies_to: "other_land_service"
      requirement: "Actual urban/suburban extent/responsibility, neighboring-function eligibility, family-specific scheduled or real non-scheduled with-driver status, architecture, OD/stops/return, extent/quality/time, actual passenger completions and period must be evidenced. Do not restrict fullscope to cable or assume technology alone proves n.e.c. Internal nodes cannot duplicate final completion; unknown actual eligibility/completion blocks data completion."
      evidence: "cp_rides"
    - id: full_component_register
      applies_to: "other_land_service"
      requirement: "Complete all actual ropes/connections/drives/brakes/carriers/towers/stations/track/control/communication/rescue/civil assets and construction/install/relocation/renewal/retirement. Examples do not cover the installation; expand each uncovered actual component/native supply or compatible complete provider without overlap."
      evidence: "cp_assets"
    - id: branch_path_gear_land
      applies_to: "other_land_service"
      requirement: "Resolve actual branch-specific path/track/land occupation/transformation, tow corridor preparation, required gear, snowmaking/grooming and other site/support obligations with physical quantities, provider ownership and justified boundaries. Each real water/material/land/service exchange is independent; unknown is not zero."
      evidence: "cp_support; cp_assets"
    - id: other_energy
      applies_to: "other_land_service"
      requirement: "Every actual other fuel/heat/DC delivery/storage/renewable generation/standby/retrieval source requires its own exact identity/native quantity and coverage. Record evidenced non-use where absent. Whole blend versus replacing components is exclusive; supply, stock withdrawal, actual burning and other fates remain distinct."
      evidence: "cp_energy"
    - id: other_materials_and_maintenance
      applies_to: "other_land_service"
      requirement: "Expand each actual grease/oil/coating/chemical/coolant/refrigerant/battery/worn part and maintenance/cleaning task separately with formulation, native units, quantities and provider scope; do not bind another substance or use an umbrella materials flow."
      evidence: "cp_maintenance"
    - id: other_fates_and_species
      applies_to: "other_land_service"
      requirement: "Identify every actual physical residue, recovered product, wastewater outlet, exhaust/non-exhaust substance/size/medium and uncharacterized release. Expand source-specific native quantities independently; no generic NOx/VOC/dust UUID, no evaporation-as-waste or stock-deficit-as-emission."
      evidence: "cp_fates; cp_emissions"
    - id: incidentals_and_providers
      applies_to: "other_land_service"
      requirement: "Resolve actual included guides/food/drink/accompanying services and all subcontracted operation/maintenance/construction/treatment results. Each actual specific product/provider needs native output quantity, compatibility and coverage cells; fees and ticket category do not prove coverage. Missing actual contents or provider scope blocks complete use."
      evidence: "cp_incidentals; cp_support"
    - id: identity_and_scope
      applies_to: "other_land_service"
      requirement: "Every applicable exchange needs verified compatible identity/property/unit and actual quantity/evidence. Unresolved cards and absent generic ranges are honest candidate gaps, not final completion, zero exchanges or invented defaults. Disclose uncertainty and LCIA characterization gaps separately from physical inventory."
      evidence: "cp_rides; cp_emissions"
    - id: noncable_native_obligations
      applies_to: "other_land_service"
      requirement: "Complete actual non-cable scheduled and non-scheduled-withdriver drives/vehicles/guideway/contact/source/storage/control/cooling/site/support using the actual native methods, not only a branch label. Include charged/imported/internal/recovered energy, idling/empty/standby/rescue/driver support, whole-asset/component original and replacement gates, source-specific emissions/wear/deposition/runoff and independent fates. Initial delivered long-term inventories versus period topups/circulation remain distinct; missing example card or quantity is incomplete data, not absent product."
      evidence: "cp_rides; cp_energy; cp_support; cp_maintenance; cp_assets; cp_fates; cp_emissions"
    - id: atomic_actual_expansion
      applies_to: "other_land_service"
      requirement: "Every actual unrepresented energy/material/component/asset/provider/ingredient/accompanying support/waste/compound/particle/fate requires a unique atomic row_id, this existing parent process, direction/type, one specific actual identity/state/gate, verified UUID or explicit unresolved status, native property/unit/quantity/raw source, same-parent CP, evidenced calculation, exact provider coverage, receiver/subcompartment and uncertainty. Link triggering DQ id. No collector or selector flow, invented factor/range, missing-as-zero or erased known receiver; all actual included functions remain until evidence closes."
      evidence: "cp_rides; cp_energy; cp_support; cp_maintenance; cp_assets; cp_fates; cp_emissions; cp_incidentals"
validation_rules:
  - rule_id: reference_gate
    applies_to: "other_land_service"
    rule: "Verify one actual completed-person reference, 1 Item(s), same positive N/cohort/period/mode/endpoints and actual incidentals in both languages. Crew, cabin/chair/tow counts, resort passes and uncompleted services cannot substitute."
    source_ids:
      - ghg-product-2011
  - rule_id: energy_and_fuel_gate
    applies_to: "other_land_service"
    rule: "Reconcile metered coupled energy, both directions/empty returns/standby/test/retrieval, storage/losses, internal versus external recovery and all-user allocation. Whole fuel blend/components exclusive; fuel withdrawal/burn/spill/recovery stocks close without unexplained residual or automatic supply=combustion."
    source_ids:
      - ghg-product-2011
  - rule_id: coverage_and_fate_gate
    applies_to: "other_land_service"
    rule: "Check manufacturing-only versus whole provider scope, complete installation/component initial supply/renewals, necessary branch path/gear/support, actual substance/media and separate physical waste/treatment responsibilities. No double provider, stock, recovery, capital or normalized quantity."
    source_ids:
      - ghg-product-2011
  - rule_id: comparability
    applies_to: "other_land_service"
    rule: "Compare only equivalent actual eligible other-land transport function/mode, endpoints/distance/vertical geometry, direction, passenger/service quality, period/season, duty/allocation and full lifecycle/incidentals. Equal counts or nominal capacities do not establish equivalent service; no universal intensity or advantage is authorized."
    source_ids:
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset/background_dataset only after complete actual foreground evidence and identity review"
  allowed_use: "Actual residual-eligible urban/suburban completed passenger conveyance with matched scheduled cable/other scheduled mechanized/non-scheduled with-driver function, native mode/extent/quality/time/duty/incidentals/lifecycle"
  excluded_use: "Universal pkm/intensity across unequal modes or extents; automatic technology-based residual classification; neighboring functional products, primary resort access/sightseeing/availability, bare no-driver rental; zero lifecycle/non-exhaust claim from drive label"
  required_metadata: "Actual function and adjacent eligibility decision; urban/suburban extent/responsibility; scheduled/non-scheduled driver; operator/passenger roles; architecture/source/storage/auxiliary; OD/stops/return/time/quality; completionN; free accompanying loads/incidentals; full duty/site/gear/driver/provider/native demand and asset-life cells; receiver/fates/uncertainty"
  required_quality_disclosure: "All actual/unresolved identities/quantities, operating/branch/provider/asset/fate coverage, sampling/model/life allocation uncertainty and LCIA gaps"
  update_trigger: "Changed mode, route/geometry/duty, users/incidentals, carrier/drive/asset/provider/recovery configuration, evidence or service completion definition"
data_sources:
  - id: "unsd-cpc3-64119"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 ExplanatoryNotes,30June2025,p360,64119. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification cable/funicular/teleferic/ski and other n.e.c. branches; accompanying items and actual included free guides/food. Not a quantity factor or proof all leaf routes share this method."
  - id: "cableway-subsystems-2016"
    type: "official_guidance"
    reference: "EU 2016/424 as adopted 9 March 2016, Article 3, Annex I/II, official reproduction. https://www.legislation.gov.uk/eur/2016/424/body/adopted?view=plain and https://www.legislation.gov.uk/eur/2016/424/annexes/adopted?view=plain"
    used_for: "Dated technical whole-installation, suspended/guided/towed person mechanisms and component/interface questions. No current legal/safety-compliance advice, universal installed configuration or LCA factor adopted."
  - id: "cableway-lifecycle-2025"
    type: "handbook"
    reference: "Doppelmayr, Our commitment to a better future: A contribution to greater sustainability, publisher 2025 URL, printed pp.16,20. https://www.doppelmayr.com/wp-content/uploads/2025/04/Brochure_Our_commitment_to_a_better_future_A_contribution_to_greater_stustainability_2025_eng.pdf"
    used_for: "Manufacturer qualitative installation material/production/transport/operation/maintenance/retirement and measured-data questions only. No comparative carbon result, assumed life, utilization or universal rate; its PCF recycling boundary is not imposed on this PCR."
  - id: "ipcc-stationary-2006"
    type: "official_guidance"
    reference: "IPCC 2006 Guidelines, Vol.2 Ch.2, sections 2.1–2.3, pp.2.6–2.11. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_2_Ch2_Stationary_Combustion.pdf"
    used_for: "Actual stationary-source fuel/technology/activity basis only; no default oxidation/emission values adopted. Mobile duties need separately applicable evidence; national GHG reporting scope is not this complete multi-impact lifecycle."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard 2011, chapters 7–9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary/data transparency and subdivision/physical allocation. Expanded complete capital/branch/incidentals scope and actual collection equations are explicit PCR choices, not generic factors or a capital mandate attributed to this standard."
  - id: "ipcc-mobile-2006"
    type: "official_guidance"
    reference: "IPCC2006 Guidelines,Volume2,Chapter3,actual sections3.1–3.2 pp3.8–3.12. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Actual mobile source/fuel/technology/activity compatibility questions only. No default factor, full-oxidation, national fuel-sold=site-burned or biogenic-physical-zero convention adopted; actual source species and noncombustive/exhaust/other fates independently required."
  - id: "land-native-mechanisms"
    type: "official_guidance"
    reference: "Hitachi Review54(4),2005,actual Chongqing monorail bogie/tyre paragraph,p4. https://www.hitachi.com/ICSFiles/afieldfile/2005/12/26/r2005_04_107.pdf ; Japan Subway Association,actual wheel-supported linear-motor explanation. https://www.jametro.or.jp/tips/linear/how-linear-motor-works/"
    used_for: "Conditional actual physical wheel/tyre/inflation/control and primary-coil/reaction-plate interfaces. No claim actual cases are64119; no generic tyre/energy/life value or technology-based residual classification. Other actual native configurations require independent applicable records."
