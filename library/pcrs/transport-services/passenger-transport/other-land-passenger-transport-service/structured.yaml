system_boundary:
  rules:
    - rule_id: complete_service
      applies_to: "other_land_service"
      rule: "Include every actual eligible cable, other scheduled mechanized or non-scheduled with-driver duty and causally necessary upstream supplies, site/road/guideway, actual loads/incidentals, operator support, maintenance, capital and retirement once. Crew/driver/rescue personnel support the service rather than automatically being passenger outputs. An incomplete scope is not a complete lifecycle."
      source_ids:
        - unsd-cpc3-64119
        - cableway-lifecycle-2025
    - rule_id: aerial_branch
      applies_to: "other_land_service"
      rule: "For actual aerial cabin/chair modes collect suspension/support/haul/tension ropes, grips, carrier/empty return patterns, towers, station conveyors, controls and braking states. A cabin and a chair are different supplied assemblies."
      source_ids:
        - cableway-subsystems-2016
    - rule_id: funicular_branch
      applies_to: "other_land_service"
      rule: "For actual funicular/guided rope-hauled modes retain track/guideway/wheels/support structures, rope attachments, fixed-track braking and their actual wear/fates. Coupled cars and counterweights belong to the actual common drive boundary; no independent zero/negative downhill burden is presumed."
      source_ids:
        - cableway-subsystems-2016
    - rule_id: surface_tow_branch
      applies_to: "other_land_service"
      rule: "For actual surface ski tow, evidence the prepared path, tow device and appropriately equipped person engagement/completion. Collect attributable grooming/snowmaking/water/additives/land/support where actually needed; do not include all resort skiing or assume these duties absent. Required skis/boards/attachments need actual service-supplied versus personal responsibility and a justified materially necessary equipment lifecycle boundary; ownership alone is not a zero-burden rule. Any actual supplementary human/animal task or mechanism requires its real physical/source/care responsibility assessment; primary man/animal conveyance is checked against its neighboring actual function."
      source_ids:
        - cableway-subsystems-2016
    - rule_id: energy_recovery
      applies_to: "other_land_service"
      rule: "Use actual metered whole coupled-drive energy and mode records. Separate gross import/export, storage, losses, brake dissipation and internal recovery. A gravitational or counterweight contribution is not an unmeasured electricity product; external export is represented once with compatible native quality, without a duplicate netting/credit."
      source_ids:
        - ghg-product-2011
    - rule_id: provider_and_asset_gate
      applies_to: "other_land_service"
      rule: "Assign each manufacture/supply/install/use/maintenance/renewal/retirement cell to one compatible provider or foreground owner. A native provider intensity q_u first multiplies actual compatible demand A_u and justified cohort/all-user share, then /positive N once. Provider hours/vehicle-km/passenger-km/trips are not completed person-services; only an exactly equivalent one-whole-reference provider result needs no further normalization. Exact covered cells replace the matching foreground cells. Whole installation/vehicle and original/replacement component supply cannot overlap. Actual delivered manufacture quantity uses the same physical asset/cohort compatible positive complete-all-user useful-duty share, then/N; manufacture identity does not become a full-life transport result. Uncovered phases are completed separately."
      source_ids:
        - ghg-product-2011
    - rule_id: incidental_inclusions
      applies_to: "other_land_service"
      rule: "Actual transport-supplied accompanying luggage/animals/items and incidental guides/food not separately charged remain in the delivered service. Resort access, entertainment/sightseeing experience and availability are different fulfilment objects, not silently converted to completed rides."
      source_ids:
        - unsd-cpc3-64119
    - rule_id: other_mechanized_branch
      applies_to: "other_land_service"
      rule: "For each actual eligible non-cable scheduled mechanized service record installed/vehicle configuration, route/control, guideway/road/support/contact, main and auxiliary drive and actual operating states. Distinguish self-propelled vehicles from central/coupled drive; record whole-system gross imports, internal transfers/storage, empty returns, standby/start/test/rescue, exported quality and all users once. Wheel/tyre/rail/rack/contact, linear primary coil/reaction plate, levitation/guidance/control and any other actual mechanism retain their own native assets, source energy, maintenance/wear and receiving fates. A linear motor does not imply levitation or zero contact wear. Technical cases supply physical interface questions, not evidence a real service belongs here. Missing actual quantities/identity block completed data, not the mechanism from scope."
      source_ids:
        - land-native-mechanisms
    - rule_id: nonscheduled_driver_branch
      applies_to: "other_land_service"
      rule: "For actual non-scheduled vehicle-with-driver n.e.c. passenger delivery, collect accepted OD/extent/time/quality and passenger completion, actual dispatch/vehicle/driver, loaded/empty positioning, waiting/idling/traffic, interruptions/returns/recovery and dedicated driver support. Retain all causal resource use and all users including no-output duties; paid time, vehicle hire, dispatch counts and nominal seats do not prove passenger completions. Identify actual rolling/guide/contact/drive/auxiliary equipment and energy/fuel, charging/refuelling, climate/accessibility, maintenance and disposal at native gates; do not apply cable energy or road stationary-source factors by default. Driver ordinary subsistence/metabolism is a disclosed boundary convention with sensitivity, not physical zero or a fictitious labour-fuel exchange; actual work-specific food/safety/business support remains assessed."
      source_ids:
        - unsd-cpc3-64119
        - ipcc-mobile-2006
    - rule_id: actual_source_storage_cooling
      applies_to: "other_land_service"
      rule: "For each actual combustion, electric/battery, fuel-cell, magnetic, mechanical or other source, preserve source delivery state and technology, converter/charge/discharge/storage losses and auxiliary/conditioning responsibility. Do not count internal traction electricity or recovered energy again as purchased input. Actual fuel/oxidizer/cell/refrigerant/cryogen supplies, compounds and source-specific air/water/soil/wear events require their own native rows and evidence; fuel-cell water vapour is not automatically collected waste. If separately modelled initial battery/equipment or cryogenic firstfill is not included in whole manufacture, treat it at its actual delivered long-term asset/inventory gate and compatible complete-all-user life attribution, retaining stock/recovery/fates. Period topups/replacements use actual period stocks/use/fate and causal share, not whole initial fill as maintenance; internal circulation/recondensation/transfers/retention are not new consumption. No theoretical mgh/nominalpower/load-ratio factor replaces actual source measurement or independently supported actual-operation model with uncertainty."
      source_ids:
        - ghg-product-2011
