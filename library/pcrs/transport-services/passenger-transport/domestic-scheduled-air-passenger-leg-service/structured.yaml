allocation_rules:
  - rule_id: passenger_cargo_class
    applies_to: "air_passenger_leg_service"
    rule: "Subdivision first: actual passenger cohorts by OD/class/quality versus cargo/mail/other products. Accompanying included baggage/animals/items are not automatically separate coproducts. Allocate inseparable shared stage/ground/capital duty with documented causal physical relation and sensitivity; no universal cabin seating-area multiplier, cargo ratio or adding passengers to tonnes/km. Economic allocation only with reason and actual compatible prices/period if physical relation unsupported."
    source_ids:
      - ghg-product-2011
  - rule_id: stage_to_leg
    applies_to: "air_passenger_leg_service"
    rule: "For each physical stage/event allocate actual compatible quantity across all real passengers whose declared legs use it and other actual products; sum the quantities for each full passenger leg/cohort, including its technical stops and required handling, then divide positive actual completed N once. Through stages do not each create another leg output. No single overall passenger count can replace stage/class/OD membership."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_supply
    applies_to: "air_passenger_leg_service"
    rule: "For each same asset use actual delivered native quantity times compatible cohort duty/positive complete-life all-user duty then/N, allocating verified manufacturing/supply only. Actual engine/rotor/pressurization/corrosion/battery/landing/calendar limits and other users require causal evidence, no depreciation/mass/life assumption. Independently complete uncaptured maintenance/replacements/retirement and no duplicate initial components."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_scaling
    applies_to: "air_passenger_leg_service"
    rule: "Provider per-aircraft-leg/hour/km/pkm/meal/handling result times actual compatible attributed activity before cohort/N. Passenger-km requires actual passenger-specific distance and cohort mapping, not seats or assumed occupancy; distance-based model cannot represent a zero-distance failed duty without independent actual duty evidence. Already per-equivalent-passenger-leg result is scaled by actual legs without repeat division. Exact provider fuel/assets/ground/emissions/fate cells replace only those same foreground cells; no flight/freight/asset UUID substituted for Count output."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_completion
      process_id: "air_passenger_leg_service"
      flow_role: "completed_domestic_scheduled_air_leg"
      record_type: "operational_record"
      raw_fields: "passenger_id; actual_board_alight_OD; intended_actual_completion; service_class_quality; flight_stage_membership; technical_stop_through_transfer; substitution_diversion; domestic_international; scheduled_actual; crew_nonrevenue_infant_roles; period; N;actual_domestic_service_geography_evidence;predetermined_route_schedule;original_promised_OD_quality;chronological_accepted_amendments;actual_board_final_alight_and_completion;leg_person_role_ID;temporary_reboarding_codeshare;failed_diverted_rescue_outcome"
      collection_method: "Reconcile actual participant service fulfilment to declared boarding/final-alighting OD and actual constituent stages, technical stops and independently joined connections. Infants/nonpay actual passengers count; on-duty crew are support, repositioning crew as transported travellers require actual role evidence, not double count. Fix equivalent cohort; unsuccessful/empty duties remain causal numerator, then /positive N once; N=0 has no finite intensity. Verify actual domestic scheduled service geography and pre-determined route/schedule separately from registration,nationality,marketing and operational delays. Link original endpoints/quality and chronological accepted changes to actual completed recipient legs;no after-failure endpoint shrink or generic statistical fallback establishes success. Aggregate N=sum actual compatible completed domestic scheduled person legs once;actual independent connecting legs separately evidenced,all causal failed/empty/support duties still allocated."
      unit: "Item(s)"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
    - protocol_id: cp_flight
      process_id: "air_passenger_leg_service"
      flow_role: "jet_a1;avgas_100ll"
      record_type: "operational_record"
      raw_fields: "actual_aircraft_engine_APU; taxi_flight_hover_hold_phase; trajectory_altitude; fuel_grade_composition; opening_receipts_closing_returns; burn_spill_recovery_transfer; all_stage_passenger_cargo_members; provider_cells;actual_external_electric_hybrid_H2_other_drives;native_fuel_purity_phase_pressure_temperature;conditioning_storage_loss;burn_fuelcell_conversion;hydrogen_vent_leak_recovery;formulation_bio_carbon_origins"
      collection_method: "Record actual engine/APU/flight-stage duty and fuel grades/stocks/withdrawal/burn independently, with losses and fates. Whole delivered blend plus composition/carbon-origin ledger OR physical component supplies replacing matching coverage, never both. Allocate actual compatible stage duty among actual users/products, sum cohort amount then/N; no generic jet/rotor factor or GCD substituted for actual activity. Collect every actual non-example propulsion/APU supply/drive,including actual electric/hybrid and hydrogen routes only where evidenced. Preserve each grade,phase/purity/native supply/conditioning/storage/charge/use/loss/vent/recovery conversion and actual chemical/water fate;wholeblend versus replacement components closes mass/provider stages and carbon origin. No universal fuel recipe or implicit zero missing path."
      unit: "kg; actual native phase activity"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
    - protocol_id: cp_ground
      process_id: "air_passenger_leg_service"
      flow_role: "ground_gasoline;ground_diesel"
      record_type: "operational_record"
      raw_fields: "groundvehicle; tow_pushback; baggage_handling; included_transfer; other_launch_recovery; fuelstock_burn; provider_cells; actual_users; failed_empty_duty"
      collection_method: "Collect actual ground/tow/pushback/handling/transfer/launch-return duty and each fuel/provider physical gate, including failed/empty/support movements. Grade/composition and wholeblend-v-component/stock-burn guards apply. Inclusive ground/tow result replaces same included energy/assets; allocate all actual users and cohort/N."
      unit: "kg; actual native ground activity"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
    - protocol_id: cp_airport
      process_id: "air_passenger_leg_service"
      flow_role: "site_ac"
      record_type: "operational_record"
      raw_fields: "airport_heliport_site; meter_gate; groundpower_APU_charger; gross_import_export_internal; losses; terminal_runway_deice_cleaning; actual_all_users; provider_cells;external_AC_DC_pointofhandover;native_battery_energy_SOC;conditioning_loss;all_airport_heliport_other_users;actual_site_asset_native_life"
      collection_method: "Meter actual compatible external AC at each aircraft/ground/charging/airport gate, losses included where inside gate. Do not double onboard APU generation/grid supply, battery charge/discharge or internal regeneration. Independently collect every actual other utility, deicer/cleaner material, captured liquid and runoff state; allocate actual all-user events/services then/N, not entire airport automatically. Verify actual external AC/DC gate and compatible native energy balance;internal APU/discharge/regeneration is no new external purchase. Every actual utility,charger/conditioning/storage/buffer asset,airport/heliport/landing-site manufacture/refit/use/retirement and actual all-user causal share needs its own independent native row and coverage."
      unit: "MJ; actual native airport quantities"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
    - protocol_id: cp_cabin
      process_id: "air_passenger_leg_service"
      flow_role: "potable_cabin_water"
      record_type: "service_record"
      raw_fields: "actual_included_baggage_animals_items; class_quality; meals_ingredients_packaging; water_uplift_stock; cabin_toilet_support; actual_users; provider_cells"
      collection_method: "Collect actual included service/catering/water/luggage/assistance duties by real passenger leg/class and actual other users, with each specific ingredient/material/service and fate independent. No universal meal/water per passenger or zero infant assumption. Purchased result times actual compatible native activity then/N, no duplicate ingredient/energy/waste/provider coverage."
      unit: "kg; actual native cabin activity"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
    - protocol_id: cp_maintenance
      process_id: "air_passenger_leg_service"
      flow_role: "spent_oil;wash_wastewater;cabin_sewage"
      record_type: "maintenance_record"
      raw_fields: "actual_engine_rotor_battery_component; input_formulation; stock_consumed_retained_collected; cleaning_deice_lavatory; receiver_transport_treatment; renewal_retirement; all_users"
      collection_method: "Record actual inspections/refit/repair/cleaning/deicing/lavatory servicing, replacement/endoflife materials and each actual native fate/source/receiver. Fresh fluid inputs, collected waste and direct releases distinct; actual treatment/transport completed independently unless already included, no automatic credit. Allocate actual shared event duty and/N, no readding initial included components."
      unit: "kg; Item(s); actual native quantities"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
    - protocol_id: cp_assets
      process_id: "air_passenger_leg_service"
      flow_role: "turboprop_aircraft;turbine_helicopter"
      record_type: "asset_record"
      raw_fields: "asset_id; actual_delivered_native_count_mass; manufacturing_gate; initial_components; install_refit; complete_life_hours_cycles_calendar; all_users; cohort_duty; replacements_retirement; provider_cells;same_aircraft_site_asset_ID;domestic_international_scheduled_nonscheduled_cargo_private_other_users;compatible_hours_cycles_calendar_limits;original_replacement_battery_stack_tank_engine_rotor_parts"
      collection_method: "Each same actual asset delivered manufacturing native quantity times compatible cohort duty/positive complete-life all-user duty then/N. Document technology/configuration/life limits and uncovered stages. Life is allocation basis only, not operation/EoL coverage. A mass-only flow needs actual measured count-mass conversion; complete assembly and same initial parts exclusive; inclusive provider cells replace exact foreground. Retain all real uses of this same asset,including other geography/schedule/cargo/private functions,in the compatible positive all-user useful-duty denominator. Actual native manufacture supply is not full-life service;independently quantify uncovered installation,maintenance/refit/replacements/delivery/retirement and keep wholeassembly/original components exclusive. Aircraft/site types and actual supplier gate determine native unit,not a copied Count assumption."
      unit: "Item(s); actual measured compatible quantities"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
    - protocol_id: cp_emissions
      process_id: "air_passenger_leg_service"
      flow_role: "fossil_co2_air;fossil_ch4_air;n2o_air;so2_air;water_vapour_air"
      record_type: "monitoring_record"
      raw_fields: "actual_engine_APU_ground_deice_source; phase_trajectory_altitude; burned_released_activity; chemical_species_CAS_C_N_S; carbon_origin; abatement; compatible_measurement_factor; medium; uncertainty; all_users;actual_altitude_receiver_known_subcompartment;particle_size_chemical_overlap_coverage;NO2_NO_separate;contrail_weather_trajectory_time_physical_observations;noise_physical_metric;LCIA_coverage_gaps"
      collection_method: "For each actual source/phase/species/altitude use actual monitoring or documented compatible method and actual native activity; no generic 3.16, arbitrary CO2/nonCO2 multiplier or modernengine CH4/N2O zero. Preserve known air/water/soil and altitude states, captured versus released fates; physical quantities and characterization limits separate. Allocate actual all-user releases and/N. Keep actual chemical species and known phase/altitude/receiver;unspecified-air identities only when the documented actual state justifies unspecified. Reconcile particle size and chemistry overlaps using compatible actual observations/bases;do not count nested PM totals plus contained fractions/blackcarbon as additive separate mass. Preserve non-CO2/contrail/noise physical records and characterization limits independently,not CO2e species,universal multiplier or missing-CF zero."
      unit: "kg specific substance; actual native physical activity"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
    - protocol_id: cp_provider
      process_id: "air_passenger_leg_service"
      flow_role: "purchased_domestic_scheduled_air_leg"
      record_type: "provider_native_coverage_record"
      raw_fields: "provider;actual_domestic_route_schedule_OD_quality_inclusions_period;native_u;q_u;actual_A_u;already_attributed_activity;actual_unallocated_alluser_share;native_conversion;exact_aircraft_phase_ground_airport_cabin_lifecycle_release_treatment_cells;uncovered_owner;already_normalized;uncertainty"
      collection_method: "Read completed supplier result and exact native unit,function/quality/OD/geography/schedule/period scope and real compatible demand. Apply q_u*A_u*only not-yet-attributed share/N once;cohort-attributed demand has no second allocation,completed-person service no repeat occupancy division. Read actual physical/stage cells:replace exact covered cells only and independently complete all missing aircraft/ground/airport/cabin/manufacturing/maintenance/retirement/chemical-fate obligations. Other native supplier functions require their own concrete identity/row and evidenced dimensional demand."
      unit: "Item(s);actual verified supplier-native unit"
      frequency: "each actual event/duty and complete period/life"
      temporal_coverage: "complete leg cohort and necessary all-user life"
      site_scope: "all actual flight/ground/airport/cabin/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/contracts/calibration/coverage/nativebalances and uncertainty"
  calculation_rules:
    - id: stage_leg_normalization
      applies_to: "air_passenger_leg_service"
      rule: "For actual stage/event j, attribute q_j by justified actual all-user physical shares a_j to the equivalent completed leg cohort; sum all compatible stages/technical/ground/cabin/failed/empty duties and divide positive actual N once. Through passenger only one completed fullleg; compatible provider per-leg/hour/pkm scales actual activity first, already equivalent per-passengerleg not divided twice."
      inputs:
        - cp_completion
        - cp_flight
        - cp_ground
        - cp_airport
        - cp_cabin
      output: "Attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: fuel_stock_fates
      applies_to: "air_passenger_leg_service"
      rule: "On each compatible gate reconcile opening+receipts-closing-returns to separately evidenced actual burn/retained/transfer/spill/recovery/vent; no residual invented species. Whole delivered blend with composition/origin ledger OR physical component supplies replacing matching coverage, never both. Actual burned/source activity and source-specific release method separate."
      inputs:
        - cp_flight
        - cp_ground
        - cp_emissions
      output: "Attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: same_asset_manufacture
      applies_to: "air_passenger_leg_service"
      rule: "Actual delivered native quantity times compatible cohort duty/positive same-asset complete-life all-user duty then/N, manufacturing/supply coverage only; uncovered install/refit/use/replacement/maintenance/endoflife independently completed with no duplicate initial components/provider cells."
      inputs:
        - cp_assets
        - cp_maintenance
      output: "Attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: specific_release
      applies_to: "air_passenger_leg_service"
      rule: "Actual source/species/height-specific measured quantity or compatible documented factor times real burned/released native activity, retaining carbon/chemical basis and medium; no generic ICEC factor, invented zero or CO2/nonCO2 multiplier. Capture/waste/treatment fates and missing physical/LCIA support separate."
      inputs:
        - cp_emissions
      output: "Attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: provider_native_intensity
      applies_to: "purchased_domestic_scheduled_air_leg"
      rule: "Contribution=q_u*actual compatible native A_u*only not-yet-attributed evidenced all-user/cohort share/N once. Already attributed A_u is not allocated again;completed-equivalent-person provider service uses real matched completed legs without occupancy redivision. Exact covered stage/flow cells replace only corresponding cells;other native output functions need independent row/demand/unit-conversion proof."
      inputs:
        - cp_provider
        - cp_completion
        - "actual native demand and exact coverage cells"
      output: "Attributed native supplier inventory per reference"
      source_ids: []
    - id: particle_and_characterization_closure
      applies_to: "air_passenger_leg_service"
      rule: "Represent actual measured particles/species using nonoverlapping compatible size/composition intervals or explicitly documented inventory overlap conventions;any difference of nested totals requires same source/time/basis and actual uncertainty support,no invented residual. Mass totals and contained carbon fractions are not additive emissions. Actual non-CO2/contrail/noise physical observations remain independent from optional characterization. Missing height-specific identity/CF leaves a physical/LCIA gap,not zero or a generic CO2 multiplier."
      inputs:
        - cp_emissions
        - "actual size species source phase receiver and uncertainty"
      output: "Independent actual inventory and disclosed characterization coverage"
      source_ids: []
  data_quality_requirements:
    - id: leg_and_cohort
      applies_to: "air_passenger_leg_service"
      requirement: "Require actual boarding/alighting OD, service completion/class/quality/duration, stage memberships, technical stop/through/transfer and diversion/substitution outcomes. Technical refuelling is not another through-passenger leg; genuine connections are separately fulfilled legs. Flight-number changes, airport arrivals/departures, tickets/capacity or statistical unknown-OD fallback cannot establish outputs."
      evidence: "cp_completion"
    - id: all_duty_users
      applies_to: "air_passenger_leg_service"
      requirement: "Reconcile complete period and actual stage/cabin/ground all-user memberships including cargo/mail, nonrevenue/infant passengers, on-duty versus transported crew, failed/empty/holding/diversion/ground/APU duties. N>0 of equivalent completed actual legs; N=0 no finite intensity. No presumed all occupied seats, generic cabin/load/cargo factor or double staff output."
      evidence: "cp_completion; cp_flight; cp_ground; cp_cabin"
    - id: actual_fuel_and_power
      applies_to: "air_passenger_leg_service"
      requirement: "Independently expand every actual specific aviation/ground/APU fuel/grade/formulation and replacing blend components, oil/hydraulic fluid/refrigerant/agent, battery/charger/converter and other utility. Actual fuels not assumed JetA1/100LL/roadgasoline. Retain stock/withdrawal/burn/leak/spill/recovery/carbon-origin closure and actual compatibility; no tailpipezero=lifecyclezero."
      evidence: "cp_flight; cp_airport; cp_ground"
    - id: actual_airport_cabin_materials
      applies_to: "air_passenger_leg_service"
      requirement: "Independently expand every actual deicing/antiicing formulation/component if replacing finishedfluid, cleaning chemical, lavatory agent, catered ingredient, drinking-water type, wrapper/packaging/cabin consumable and their real fates. Actual airport/heliport handling/terminal/runway/site and assistance included according to accountable product, all users/provider cells explicit; no fixed recipes or wholeairport assignment."
      evidence: "cp_airport; cp_cabin; cp_maintenance"
    - id: other_mechanism_interfaces
      applies_to: "air_passenger_leg_service"
      requirement: "For each other actual conveyance mechanism independently specify native lift/launch/propulsive/ground interfaces and technical evidence: glider tow/return/winch/auto/selflaunch/retrieve; balloon burner/fan/each lifting gas/storage/topup/vent/recovery/ballast/receiver; airship propulsion/ballonets/mast/mooring/truck/ground. Each actual input/release/waste gets process/direction/type/concrete identity/native quantity/CP/source/gate, no silent omission or arbitrary unsupported fuel."
      evidence: "cp_flight; cp_ground; cp_assets; cp_emissions"
    - id: assets_replacements_fates
      applies_to: "air_passenger_leg_service"
      requirement: "Expand each actual aircraft/engine/rotor/battery/cabin/groundvehicle/airport/terminal/runway/heliport/hangar/site/land assembly or uncovered component and same-asset all-user manufacture/install/refit/maintenance/retirement responsibility. Keep life/initial-v-replacement evidence and no wholeassembly/component duplicate. Every actual collected residue/filter/sewage/deice/wash/food/packaging/retired material gets real stream composition/receiver/transport/treatment, not a plural waste collector."
      evidence: "cp_assets; cp_maintenance"
    - id: species_medium_height
      applies_to: "air_passenger_leg_service"
      requirement: "Expand actual CO, each specific nitrogen oxide/hydrocarbon/aldehyde, nonoverlapping particle size/chemistry, actual leadedfuel lead compounds, sulfur species, carbon origins, refrigerant/gas leaks, deicer runoff and water/soil releases with actual source/height/state. Never erase known high-altitude/urban/nonurban/ground states to fit unspecified-air UUID. Noise/contrail/nonCO2 physical activity and LCIA uncertainty separate, no invented mass or multiplier; unknown notzero."
      evidence: "cp_emissions; cp_maintenance"
    - id: provider_evidence_closure
      applies_to: "air_passenger_leg_service"
      requirement: "Every actual exchange needs row-addressable identity/native amount/method and source applicability/calibration/provider exactstage gates. Purchased aircraft-leg/hour/pkm/handling/meal result must scale actual compatible activity before N, already equivalent passengerleg not divided twice. Uncovered physical stages mandatory; missing quantities, technical or native relationships block complete use rather than guessed values/ranges."
      evidence: "cp_completion; cp_flight; cp_ground; cp_airport; cp_cabin; cp_maintenance; cp_assets; cp_emissions"
    - id: domestic_scheduled_scope_completion
      applies_to: "completed_domestic_scheduled_air_leg"
      requirement: "MANDATORY actual domestic service geography and pre-determined route/schedule with original promised OD/quality,inclusions,chronological accepted changes,actual boarding/final alighting/duration/period and recipient/stage membership. Delays,registration/nationality/marketing/codeshares/airport events are not replacement criteria or duplicate outputs. Preserve partial/failed/diverted/rescue duties without posthoc completion shrink. Baggage/items MAY free,not universal;actual assistance/care/inclusions retained."
      evidence: "cp_completion;cp_cabin;actual original service promise and fulfilment records"
    - id: all_actual_power_architectures
      applies_to: "air_passenger_leg_service"
      requirement: "MANDATORY actual drive/source evidence for every real qualifying aircraft/APU/ground mechanism,not only JetA1/100LL or two manufacture examples. Each actual externalAC/DC/native battery/charger/converter/storage/fuelcell/stack/tank/H2 phase/purity/conditioning/combustion or electrochemical pathway,actual otherfuel grade/SAF/bio-origin blend and material/retirement fate needs independent actual rows/native gate/quantity/owner. Hydrogen lifting gas,fuel supply,vent/leak and water release/collection are distinct. No technical example alone proves domestic scheduled operation;no missing-route zero or product exclusion."
      evidence: "cp_flight;cp_ground;cp_airport;cp_assets;cp_emissions;actual mechanism and supplier records"
    - id: atomic_row_addressable_completion
      applies_to: "air_passenger_leg_service"
      requirement: "MANDATORY expand every actual unrepresented supply/material/asset/component/service/provider/waste/species/fate into unique row_id,one existing process,direction and product/waste/elementary type,one specific actual identity/grade/state/gate/receiver/altitude,UUID or explicit unresolved,native property/unit/actual quantity/raw record,same-parent CP,calculation/evidence/provider covered and missing cells,actual uncertainty. Existing cards are conditional concrete examples,not inventory selectors. Every actual aircraft/airport/cabin/crew/ground support and other-user phase must be owned;unknown applicability or quantity remains incomplete,not zero/deletion."
      evidence: "cp_provider;cp_completion;cp_flight;cp_ground;cp_airport;cp_cabin;cp_maintenance;cp_assets;cp_emissions"
    - id: height_particles_nonco2
      applies_to: "air_passenger_leg_service"
      requirement: "MANDATORY actual source/species/chemical and particle size/overlap inventory,known altitude/medium/subcompartment,carbon origins and actual gas/particle/deicer runoff/waste fates. Use compatible actual observations to avoid nesting PM2.5/PM10/totalPM/blackcarbon chemical fractions as additive emissions;no unsupported subtraction/residual or source-independent factors. Preserve physical water/contrail/trajectory/weather/time and actual noise/nonCO2 records with their true metric and uncertainty,independent from LCIA availability;no generic forcing multiplier/CO2e-substance or ground-unspecified substitute for known high-altitude releases."
      evidence: "cp_emissions;cp_maintenance;actual physical observations,method and characterization coverage"
validation_rules:
  - rule_id: completion_and_quantity
    applies_to: "air_passenger_leg_service"
    rule: "Reject mismatched OD/class/completion/stage mapping, duplicate through-passenger or airport-event outputs, unsupported N, omitted empty/failed duty, finite N=0 intensity or repeated normalization."
    source_ids:
      - ghg-product-2011
  - rule_id: identity_native_scope
    applies_to: "air_passenger_leg_service"
    rule: "Reject umbrella/selector exchange, Mass/Count proxy without measured conversion, generic incompatible fuel/chemistry/altitude UUID, fabricated range/factor or missing-as-zero; each actual branch and fate must be independently quantified."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_asset_closure
    applies_to: "air_passenger_leg_service"
    rule: "Reject omitted ground/APU/airport/deicing/cabin/assets/retirement, unsupported all-user allocation, provider overlap or manufacture flow treated whole-life passenger service. Each CP must name exactly one existing process and linked rows belong to it; EN/ZH methods/sourceIDs align."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_domestic_schedule_projection
    applies_to: "air_passenger_leg_service"
    rule: "Reject incorrect domestic/schedule function,registration/nationality/clock-delay proxy,duplicate through/technical/codeshare outputs or retrospective failed-leg completion. Reject missing actual power/ground/airport/cabin/capital/provider/stage/native/height/fate expansions,overlapping particle mass doublecount or missingCF=zero. Every authored boundary/allocation/calculation/DQ/CP/validation rule ID/substantive cell must actually survive structured projection."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after all mandatory identity,quantity,coverage and fate evidence completed and reviewed"
  allowed_use: "Actual equivalent completed domestic scheduled passenger air leg with verified service geography,predeterminedroute/schedule,OD/class/quality/inclusions/period and full actual aircraft/provider/airport/lifecycle/native species/height evidence"
  excluded_use: "International/nonscheduled/sightseeing/availability/broker relabelled domestic scheduled;universal aircraft/airline factor;ticket/seat/movement/stage/hour/pkm without actual complete leg mapping;unknown quantities/receiver/LCIA treated zero"
  required_metadata: "actual_domestic_service_geography_not_registration_or_nationality;predetermined_domestic_route_and_schedule_evidence;original_promised_OD_quality_and_chronological_accepted_amendments;actual_boarding_final_alighting_accepted_completion;technical_stops_stages_through_transfer_reboarding_and_codeshare_membership;actual_duration_class_quality_accessibility_inclusions_and_period;actual_infant_nonrevenue_operating_transported_or_dual_crew_roles;actual_baggage_otheritems_possible_free_not_required_free;all_actual_aircraft_lift_launch_engine_APU_drive_mechanisms;actual_source_phase_trajectory_known_altitude_receiver;actual_native_fuel_grade_formulation_phase_stock_burn_fates;external_AC_DC_hydrogen_other_actual_conversion_and_storage;all_empty_failed_diversion_rescue_ground_airport_cabin_support_duties;provider_native_activity_exact_included_uncovered_cells;same_asset_complete_alluser_useful_duty_lifecycle;chemical_origin_particle_overlap_nonCO2_contrail_noise_LCIA_gaps"
  required_quality_disclosure: "Actual geography/schedule/original/accepted endpoint/completion/user/stage memberships,all provider/native gate/alluser life/quantity/source/fate gaps,particle overlap/knownheight and physical versus LCIA uncertainties"
  update_trigger: "OD/function/class/quality/content, aircraft/engine/APU/fuel/lift/launch, schedule/geography/stages, provider/airport/assets/life/fates or LCIA method changed"
data_sources:
  - id: "unsd-cpc3-air-passenger"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 Explanatory Notes30June2025,printed363 subclasses64241–64244; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Actual64241domestic pre-determined routes AND schedules,aircraft of any type including helicopters,accompanying passenger baggage/otheritems MAY at no extra cost. Classification only,not universal free condition,domestic registration proxy,LCAunit/count/distance/occupancy/chemistry or lifecycle factor."
  - id: "eurostat-air-2024"
    type: "handbook"
    reference: "Eurostat Reference Manual on Air Transport Statistics v17 July 2024 §§1.2.1,1.3.1–2,1.4.1–2,1.5.3–4; https://ec.europa.eu/eurostat/documents/29567/3217334/Aviation_%20Manual_V17_07_2024.pdf/bd2843bd-8aaf-55f7-003d-2974ba992e68?t=1727786817686"
    used_for: "Dated statistical distinctions: passenger/crew/infant, flightstage versus onflightOD, transit/transfer. Statistical fallbacks/exclusions/seat or cargo conventions not adopted as LCA quantities/allocation."
  - id: "ipcc-aviation-2006"
    type: "official_guidance"
    reference: "IPCC2006 Guidelines Vol2Ch3 §3.6 pp3.56–3.59; https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Actual source/fuel/engine/phase/altitude questions only, not full lifecycle or universal aviation/rotor factor. No default factors/shares adopted."
  - id: "icao-icec-2024"
    type: "official_guidance"
    reference: "ICAO ICEC Methodology actual v13.1 August 2024 §§1–3; https://icec.icao.int/Documents/Methodology%20ICAO%20Carbon%20Emissions%20Calculator_v13_Final.pdf"
    used_for: "Operational passengerflightCO2 calculator scope and limitations; no generic 3.16/load/cabin/cargo/GCD factor imported, no lifecycle/nonCO2 completeness claim."
  - id: "faa-glider-2024"
    type: "handbook"
    reference: "FAA Glider Flying Handbook13B actual2024 ch7 pp7-17–18,7-30–31; https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/glider_handbook"
    used_for: "Conditional actual tow-return/winch/auto/selflaunch physical questions only; actual service function and equipment evidence required."
  - id: "faa-balloon-2024"
    type: "handbook"
    reference: "FAA Balloon Flying Handbook11B actual2024 ch2/6/8/11; https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/Balloon_Flying_Handbook"
    used_for: "Conditional actual burner/fan/gas/ballast/recovery questions, not all routes or universal quantities/legal mandates."
  - id: "zeppelin-interface-2026"
    type: "handbook"
    reference: "Deutsche Zeppelin-Reederei operator FAQ technical case, public snapshot2026-10-21; https://zeppelinflug.de/en/faqs"
    used_for: "Conditional actual airship propulsion/helium/ballonet/mooring interfaces only; sightseeing product example not ordinary passenger product proof or independent scientific factor."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "GHG Product Life Cycle Accounting and Reporting Standard2011 chapters7–9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary/data/subdivision/allocation principles; full airport/asset/endoflife boundary and Count-leg algorithms explicit authoredPCR choices, not sourced universal factors."
