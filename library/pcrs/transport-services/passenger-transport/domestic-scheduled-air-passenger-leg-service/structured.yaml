          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| passenger_cargo_class | air_passenger_leg_service | Subdivision first: actual passenger cohorts by OD/class/quality versus cargo/mail/other products. Accompanying included baggage/animals/items are not automatically separate coproducts. Allocate inseparable shared stage/ground/capital duty with documented causal physical relation and sensitivity; no universal cabin seating-area multiplier, cargo ratio or adding passengers to tonnes/km. Economic allocation only with reason and actual compatible prices/period if physical relation unsupported. | ghg-product-2011 |\n| stage_to_leg | air_passenger_leg_service | For each physical stage/event allocate actual compatible quantity across all real passengers whose declared legs use it and other actual products; sum the quantities for each full passenger leg/cohort, including its technical stops and required handling, then divide positive actual completed N once. Through stages do not each create another leg output. No single overall passenger count can replace stage/class/OD membership. | ghg-product-2011 |\n| asset_supply | air_passenger_leg_service | For each same asset use actual delivered native quantity times compatible cohort duty/positive complete-life all-user duty then/N, allocating verified manufacturing/supply only. Actual engine/rotor/pressurization/corrosion/battery/landing/calendar limits and other users require causal evidence, no depreciation/mass/life assumption. Independently complete uncaptured maintenance/replacements/retirement and no duplicate initial components. | ghg-product-2011 |\n| provider_scaling | air_passenger_leg_service | Provider per-aircraft-leg/hour/km/pkm/meal/handling result times actual compatible attributed activity before cohort/N. Passenger-km requires actual passenger-specific distance and cohort mapping, not seats or assumed occupancy; distance-based model cannot represent a zero-distance failed duty without independent actual duty evidence. Already per-equivalent-passenger-leg result is scaled by actual legs without repeat division. Exact provider fuel/assets/ground/emissions/fate cells replace only those same foreground cells; no flight/freight/asset UUID substituted for Count output. | ghg-product-2011 |\n\n"
