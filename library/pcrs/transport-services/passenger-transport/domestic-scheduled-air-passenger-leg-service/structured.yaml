          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual passenger transport service/OD/cohort, aircraft/stages/airport/cabin/ground and provider/asset duties |\n| starting_condition_role | Actual interfaces, not zero-burden preexisting aircraft/airports or excluded international fuel |\n| product_classification_scope | 64241only,actual domestic pre-determined routes/schedules,any aircraft including helicopters;actual service geography not registration/nationality/distance |\n| recursive_input_rule | Purchased flight/leg/ground result only compatible cells with actual native scaling; no self-recursive final passengerleg or duplicated marketed codeshare |\n| upstream_dataset_requirement | Actual identity/native unit/grade/gate/technology/geography/period and exact provider lifecycle cells; uncovered responsibility independently completed |\n| disclosure | Actual intended/fulfilled endpoint/class/content, stage/user mapping, empty/failed duty, airport/provider/asset/fate and physical versus LCIA gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| all_flight_ground_duty | air_passenger_leg_service | Include actual start/taxi/APU/warmup/takeoff/hover/climb/cruise/holding/descent/landing, diversion/return/rescue, empty/repositioning/failed/cancelled/standby and necessary ground handling/transfer duty causally attributable to the offered passenger service. Statistical omissions of unsuccessful approaches, zero-traffic or noncommercial movements do not delete real lifecycle burdens. | ipcc-aviation-2006;eurostat-air-2024 |\n| airport_and_cabin | air_passenger_leg_service | Include actual allocated airport/heliport/landing area, runway/taxiway/apron/terminal, baggage/security/handling, groundpower/conditioning, deicing/antiicing, cleaning/catering/water/toilet servicing, included assistance/cabin items and their materials/wastes/releases. Shared airport/community/commercial users remain separate; transport to the airport is included only when the actual declared passenger product supplies it. | ghg-product-2011 |\n| assets_provider | air_passenger_leg_service | Retain actual aircraft/engine/rotor/battery/cabin/groundvehicle/launch/site manufacture, installation/refit, maintenance, replacements and retirement with compatible all-user life/duty. Delivered manufacturing flows do not carry whole use-phase or retirement. Whole assembly and its already-included initial components are exclusive; inclusive providers replace exact covered stage/flow cells once. | ghg-product-2011 |\n| other_actual_air_mechanisms | air_passenger_leg_service | Where actually used for ordinary conveyance, glider towplane full launch/return, winch/auto/selflaunch and recovery; balloon burner/fan/lifting-gas stocks/fill/topup/vent/leak/recovery/ballast; airship propulsion/ballonet/mooring/ground support require independent actual identities/native quantities/provider gates. No onboard engine does not mean zero burden; do not import incompatible aviation/road fuel or assume gases burned/released. | faa-glider-2024;faa-balloon-2024;zeppelin-interface-2026 |\n| release_closure | air_passenger_leg_service | Every actual source/species/carbon origin/chemical basis/phase/altitude/receiving state remains explicit; captured waste is not simultaneously emitted. Noise and contrail/non-CO2 physical activity and LCIA interpretation remain separate; no arbitrary CO2e-to-substance conversion, multiplier or missing-CF=physical-zero assumption. | ipcc-aviation-2006;icao-icec-2024 |\n| domestic_schedule_completion | air_passenger_leg_service | Determine actual domestic transport function/geography and pre-determined route/schedule,not nationality,registration,marketing or km. Preserve original promise and chronological accepted changes;actual delay/technical stop/codeshare/aircraft change does not alone create another product or duplicate leg. Original failed/partial/diverted/rescue promise cannot be retrospectively narrowed into success;causal unsuccessful duties remain. |  |\n| native_provider_supply_gate | air_passenger_leg_service | For verified provider q_u per native u,contribution=q_u*actual compatible A_u*unallocated evidenced cohort/all-user share/N once. Already cohort-attributed A_u is not allocated again;already equivalent completed-person-leg service uses matched real demand,no occupancy redivision. Exact covered cells replace only matching fuel/aircraft/airport/cabin/release/treatment stages. Actual at-plant identities retain that gate:verify actual grade/formulation/native quantities and add missing delivery,conditioning,storage/loss phases;do not relabel factory supply as delivered use or treatment-inlet waste as generation. |  |\n| actual_power_conversion_and_fates | air_passenger_leg_service | For actual electric/hybrid paths,record external AC or DC handover,charger/converter/storage/native battery state and losses,APU/internal generation versus external supply,original/replacement pack coverage. For actual hydrogen paths,identify grade/purity/phase/pressure/temperature,production/conditioning/transport/storage/load/use,combustor versus fuel-cell conversion,vent/leak/recovery and independent water/species fates. Hydrogen lifting gas is not automatically fuel;fuel-cell water is not collected waste by default. Actual biofuel/SAF mixtures require precise formulation/origin and whole-blend OR replacing physical components,mass/provider closure never duplicate contained components. No claim hypothetical routes are operated or emission-free. |  |\n| actual_carried_objects_and_support | air_passenger_leg_service | Accompanying baggage/otheritems may be free,not universally;actual inclusion/function/owner evidence governs. Carried object/animal own manufacture/rearing lifetime is not automatically an aircraft-production input,but actual transport-time handling,care/provision,sanitation,assistance/support and fates remain. Fee or separate ticket does not prove a distinct co-product;use actual independent delivered function/native output evidence. Support crew and transported persons follow actual role,not salary/seat/capacity labels. |  |\n\n"
