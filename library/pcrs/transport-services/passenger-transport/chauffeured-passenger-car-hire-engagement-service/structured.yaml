  classification_refs: "CPC3.0 64116 Rental services of passenger cars with operator; dedicated full actual function, exact"
  covered_products: "Actual chauffeur-driven passenger-car hire wherever delivered except taxis, including truly fulfilled contracted availability/standby or whole multi-stop hire and other qualifying hire contracts"
  excluded_products: "Taxi; bare-car rental without operator; standalone driver labour or broker booking; distinct non-car transport or actually independent tour/medical package"
  representative_product: "One actual car plus chauffeur service fulfilling one complete defined hire agreement with declared duration, scope and accepted quality"
  production_route: "Accountable car/driver hire agreement; actual availability and/or driven duties and accepted fulfilment; all causal support/provider and vehicle/site lifecycle"
  market_state: "Actually fulfilled single-car chauffeured hire engagement with contract/actual delivery evidence"
functional_unit:
  what: "Fulfilled single-car chauffeured passenger-car hire engagement"
  how_much: "1 actual fulfilled single-car whole hire engagement"
  how_well: "Actual vehicle class/configuration, chauffeur responsibilities, availability/transport extent, interruptions/substitution, quality and accepted fulfilment declared"
  how_long_or_cycle: "Actual agreed and delivered engagement interval/duration, amendments and temporal coverage, including genuine standby and causal supporting lifecycle"
  reference_flow_link: "fulfilled_car_hire"
system_boundary:
  rules:
    - rule_id: service_coverage
      applies_to: "hire_service"
      rule: "Use one declared service cohort and account for preparation, actual loaded and empty running, layover, failed or zero-passenger operated duties and associated support once; unexplained residuals or unknown applicability cannot be excluded as zero."
      source_ids:
        - nyc-tlc-utilization-2025
        - ghg-product-standard
    - rule_id: upstream_and_assets
      applies_to: "hire_service"
      rule: "Include compatible energy-supply and complete-life vehicle, battery, road and depot/charging infrastructure burdens with actual duty/lifetime allocation. Document provider coverage before adding separate operation, manufacturing, maintenance or treatment so no life stage is counted twice."
      source_ids:
        - eea-electric-vehicles
        - ghg-product-standard
    - rule_id: conditional_technology
      applies_to: "hire_service"
      rule: "Inventory only actual propulsion and control configurations, but retain compulsory identification/expansion of every other actual energy carrier, hydrogen supply, hybrid subsystem, reagent, refrigerant or material. Grid-electric operation does not prove zero upstream or non-exhaust emissions."
      source_ids:
        - eea-electric-vehicles
        - ipcc-mobile-combustion
    - rule_id: fate_interfaces
      applies_to: "hire_service"
      rule: "Reconcile distinct collected liquids/solids, recovered products and direct substance/medium emissions; collected wastewater is not an air emission, evaporated water is not a waste-treatment input, and waste delivery is not treatment already performed."
      source_ids:
        - ghg-product-standard
    - rule_id: duty_and_personal_ownership
      applies_to: "hire_service"
      rule: "Require a complete vehicle-duty ledger distinguishing actual customer segments, dispatch/pickup, empty cruising, waiting, failed hires and actual personal/driver travel. Retain causally attributable service duty even without a passenger. Assign cross-purpose/shared movements once with evidence; a platform fee or driver wage is not a physical burden."
      source_ids:
        - nyc-tlc-utilization-2025
        - ghg-product-standard
    - rule_id: fuel_blend_ownership
      applies_to: "gasoline_supply; diesel_supply"
      rule: "Declare whether actual supplied fuel is represented as one verified compatible whole-blend supply or as physical component supplies. A whole-blend composition/carbon-origin ledger is not an additional component input. Component exchanges replace the matching whole-blend quantity and covered upstream burdens, with mass, native units and provider-scope closure. Never add the full supplied blend plus its contained bio/fossil component supply; neither route may omit an actual constituent or its upstream burden."
      source_ids:
        - ipcc-mobile-combustion
        - ghg-product-standard
    - rule_id: hire_fulfilment_and_standby
      applies_to: "hire_service"
      rule: "Require actual agreed car/driver function, wherever delivered except taxi, and accepted whole fulfilment for each counted output. Actual delivered availability/standby is a service even without passengers; merely booked, charged or cancelled availability is not. Retain chronological changes and real quality/interruptions/substitutions. A failed promised extent cannot become a completed short engagement by post hoc renaming; actual independently accepted amended/partial functions need distinct evidence and disclosed comparability."
      source_ids:
        - cpc3-structure
        - blacklane-hourly
        - uber-hourly
    - rule_id: native_provider_and_life_coverage
      applies_to: "purchased_car_hire"
      rule: "Maintain one actual car/duty/interval/provider/lifecycle-stage coverage ledger. Owned physical quantities OR compatible completed provider result owns each cell once, plus uncaptured responsibilities. For q_u per verified native unit u, contribution=q_u*actual compatible demand A_u*evidenced cohort/all-user share/N once. Whole engagement, vehicle-hour/day, passenger-distance, car manufacture and driver labour are not interchangeable. No allocation of hire output by passenger count or duplicate supply of internal driven legs."
      source_ids: []
    - rule_id: whole_asset_and_fuel_interfaces
      applies_to: "all inventory rows"
      rule: "Each actual asset supply retains native delivered quantity, manufacturing gate, initial component scope and same-asset compatible attributed duty/positive total all-user useful duty/N. It remains manufacturing/supply, not full-life service; complete missing delivery/use/maintenance/refit/replacements/retirement. Whole assemblies and initial components are exclusive; whole fuel blend plus composition/origin ledger OR exact replacing components with mass/provider closure. Supply/stock/burn/leak/vent/spill/recovery/internal conversion remain distinct."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual defined single-car chauffeured hire cohort with agreement, delivered interval/quality, car/driver and supplier-gate facts; all earlier supply and later lifecycle responsibilities remain."
  starting_condition_role: "Measured service-cohort and supplier-gate facts defining foreground collection, not an upstream cut-off credit."
  product_classification_scope: "Actual chauffeur-driven passenger-car hire wherever delivered except taxi; general billing, limited party and frequent multiple destinations are not universal gates"
  recursive_input_rule: "Own driven legs, chauffeur shifts and delivered standby are internal duties of the one hire, not another purchased hire or final passenger output. A real completed external hire provider result replaces only exact compatible covered cells at actual native demand; complete uncaptured responsibilities once."
  upstream_dataset_requirement: "Compatible complete supply, vehicle/battery/infrastructure and treatment datasets with actual native units, technology, geography, lifetime and coverage."
  disclosure: "Agreement and actual fulfilment quality/duration, complete vehicle/driver/duty/all-user ledger including zero-passenger availability, provider native scope, asset lifetime, stock/fate closure, uncertainty and heterogeneity"
