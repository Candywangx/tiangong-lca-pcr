      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| causal_partition | hire_service | Subdivide by vehicle/route/duty and direct meters first. For a shared burden Q, use actual attributable drivers d_c and complete all-user denominator sum(d_j); document the physical relationship, exclusions and sensitivity. Capacity, revenue share and equal splitting are not automatic allocation factors. | ghg-product-standard |\n| empty_and_lifetime | hire_service | Allocate necessary deadhead, empty service and idle support to the complete relevant service cohort through the demonstrated causal route/period relationship, never by an assumed load factor. Asset allocation covers complete useful duty and actual replacements; an annual purchase, hire fee or depreciation amount is not a manufactured-asset quantity. | nyc-tlc-utilization-2025;ghg-product-standard |\n| no_automatic_credit | hire_service | Recovered materials, regenerative energy and recycled end-of-life material need actual destination, quality and coverage. Internal regeneration already reducing net imported electricity receives no second avoided-electricity credit; no default displacement ratio or negative waste credit is prescribed. | ghg-product-standard |\n| engagement_and_other_users | hire_service | Directly assign measured car/duty/interval quantities to the actual hire first, including real contracted stationary availability and all internal passenger movements/stops. Do not divide a whole-car hire by passengers or passenger legs. Subdivide private/other hire/taxi/platform duties and separately sold distinct outputs before allocating shared residuals by an evidenced compatible physical driver and complete all-user denominator. Passenger luggage and real included incidentals remain inside the declared hire function; persons, cargo mass, fees and car-hours are not additive equivalent outputs. |  |\n| failed_pool_and_zero_passengers | hire_service | Retain full causal preparation, dispatch, waiting, repositioning, empty return, failed/cancelled/unfinished duty and required driver/support/site burdens. Distinguish unfulfilled output from actually delivered zero-passenger availability. Allocate supported residual failed/support pools to the complete relevant comparable fulfilled-hire cohort; if N=0 disclose the pool without a finite per-engagement intensity. Do not erase failed burdens or use a fee, utilization percentage, seat capacity or passenger occupancy as a physical allocation rule. |  |\n\n"
