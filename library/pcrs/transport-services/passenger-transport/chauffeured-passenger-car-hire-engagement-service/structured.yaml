      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual defined single-car chauffeured hire cohort with agreement, delivered interval/quality, car/driver and supplier-gate facts; all earlier supply and later lifecycle responsibilities remain. |\n| starting_condition_role | Measured service-cohort and supplier-gate facts defining foreground collection, not an upstream cut-off credit. |\n| product_classification_scope | Actual chauffeur-driven passenger-car hire wherever delivered except taxi; general billing, limited party and frequent multiple destinations are not universal gates |\n| recursive_input_rule | Own driven legs, chauffeur shifts and delivered standby are internal duties of the one hire, not another purchased hire or final passenger output. A real completed external hire provider result replaces only exact compatible covered cells at actual native demand; complete uncaptured responsibilities once. |\n| upstream_dataset_requirement | Compatible complete supply, vehicle/battery/infrastructure and treatment datasets with actual native units, technology, geography, lifetime and coverage. |\n| disclosure | Agreement and actual fulfilment quality/duration, complete vehicle/driver/duty/all-user ledger including zero-passenger availability, provider native scope, asset lifetime, stock/fate closure, uncertainty and heterogeneity |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| service_coverage | hire_service | Use one declared service cohort and account for preparation, actual loaded and empty running, layover, failed or zero-passenger operated duties and associated support once; unexplained residuals or unknown applicability cannot be excluded as zero. | nyc-tlc-utilization-2025;ghg-product-standard |\n| upstream_and_assets | hire_service | Include compatible energy-supply and complete-life vehicle, battery, road and depot/charging infrastructure burdens with actual duty/lifetime allocation. Document provider coverage before adding separate operation, manufacturing, maintenance or treatment so no life stage is counted twice. | eea-electric-vehicles;ghg-product-standard |\n| conditional_technology | hire_service | Inventory only actual propulsion and control configurations, but retain compulsory identification/expansion of every other actual energy carrier, hydrogen supply, hybrid subsystem, reagent, refrigerant or material. Grid-electric operation does not prove zero upstream or non-exhaust emissions. | eea-electric-vehicles;ipcc-mobile-combustion |\n| fate_interfaces | hire_service | Reconcile distinct collected liquids/solids, recovered products and direct substance/medium emissions; collected wastewater is not an air emission, evaporated water is not a waste-treatment input, and waste delivery is not treatment already performed. | ghg-product-standard |\n| duty_and_personal_ownership | hire_service | Require a complete vehicle-duty ledger distinguishing actual customer segments, dispatch/pickup, empty cruising, waiting, failed hires and actual personal/driver travel. Retain causally attributable service duty even without a passenger. Assign cross-purpose/shared movements once with evidence; a platform fee or driver wage is not a physical burden. | nyc-tlc-utilization-2025;ghg-product-standard |\n| fuel_blend_ownership | gasoline_supply; diesel_supply | Declare whether actual supplied fuel is represented as one verified compatible whole-blend supply or as physical component supplies. A whole-blend composition/carbon-origin ledger is not an additional component input. Component exchanges replace the matching whole-blend quantity and covered upstream burdens, with mass, native units and provider-scope closure. Never add the full supplied blend plus its contained bio/fossil component supply; neither route may omit an actual constituent or its upstream burden. | ipcc-mobile-combustion;ghg-product-standard |\n| hire_fulfilment_and_standby | hire_service | Require actual agreed car/driver function, wherever delivered except taxi, and accepted whole fulfilment for each counted output. Actual delivered availability/standby is a service even without passengers; merely booked, charged or cancelled availability is not. Retain chronological changes and real quality/interruptions/substitutions. A failed promised extent cannot become a completed short engagement by post hoc renaming; actual independently accepted amended/partial functions need distinct evidence and disclosed comparability. | cpc3-structure;blacklane-hourly;uber-hourly |\n| native_provider_and_life_coverage | purchased_car_hire | Maintain one actual car/duty/interval/provider/lifecycle-stage coverage ledger. Owned physical quantities OR compatible completed provider result owns each cell once, plus uncaptured responsibilities. For q_u per verified native unit u, contribution=q_u*actual compatible demand A_u*evidenced cohort/all-user share/N once. Whole engagement, vehicle-hour/day, passenger-distance, car manufacture and driver labour are not interchangeable. No allocation of hire output by passenger count or duplicate supply of internal driven legs. |  |\n| whole_asset_and_fuel_interfaces | all inventory rows | Each actual asset supply retains native delivered quantity, manufacturing gate, initial component scope and same-asset compatible attributed duty/positive total all-user useful duty/N. It remains manufacturing/supply, not full-life service; complete missing delivery/use/maintenance/refit/replacements/retirement. Whole assemblies and initial components are exclusive; whole fuel blend plus composition/origin ledger OR exact replacing components with mass/provider closure. Supply/stock/burn/leak/vent/spill/recovery/internal conversion remain distinct. |  |\n\n"
