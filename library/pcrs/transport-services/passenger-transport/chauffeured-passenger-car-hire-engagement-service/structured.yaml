allocation_rules:
  - rule_id: causal_partition
    applies_to: "hire_service"
    rule: "Subdivide by vehicle/route/duty and direct meters first. For a shared burden Q, use actual attributable drivers d_c and complete all-user denominator sum(d_j); document the physical relationship, exclusions and sensitivity. Capacity, revenue share and equal splitting are not automatic allocation factors."
    source_ids:
      - ghg-product-standard
  - rule_id: empty_and_lifetime
    applies_to: "hire_service"
    rule: "Allocate necessary deadhead, empty service and idle support to the complete relevant service cohort through the demonstrated causal route/period relationship, never by an assumed load factor. Asset allocation covers complete useful duty and actual replacements; an annual purchase, hire fee or depreciation amount is not a manufactured-asset quantity."
    source_ids:
      - nyc-tlc-utilization-2025
      - ghg-product-standard
  - rule_id: no_automatic_credit
    applies_to: "hire_service"
    rule: "Recovered materials, regenerative energy and recycled end-of-life material need actual destination, quality and coverage. Internal regeneration already reducing net imported electricity receives no second avoided-electricity credit; no default displacement ratio or negative waste credit is prescribed."
    source_ids:
      - ghg-product-standard
  - rule_id: engagement_and_other_users
    applies_to: "hire_service"
    rule: "Directly assign measured car/duty/interval quantities to the actual hire first, including real contracted stationary availability and all internal passenger movements/stops. Do not divide a whole-car hire by passengers or passenger legs. Subdivide private/other hire/taxi/platform duties and separately sold distinct outputs before allocating shared residuals by an evidenced compatible physical driver and complete all-user denominator. Passenger luggage and real included incidentals remain inside the declared hire function; persons, cargo mass, fees and car-hours are not additive equivalent outputs."
    source_ids: []
  - rule_id: failed_pool_and_zero_passengers
    applies_to: "hire_service"
    rule: "Retain full causal preparation, dispatch, waiting, repositioning, empty return, failed/cancelled/unfinished duty and required driver/support/site burdens. Distinguish unfulfilled output from actually delivered zero-passenger availability. Allocate supported residual failed/support pools to the complete relevant comparable fulfilled-hire cohort; if N=0 disclose the pool without a finite per-engagement intensity. Do not erase failed burdens or use a fee, utilization percentage, seat capacity or passenger occupancy as a physical allocation rule."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "hire_service"
      flow_role: "fulfilled_car_hire"
      record_type: "hire_agreement_delivery_record"
      raw_fields: "agreement_ID; single_car_engagement_ID; actual_car_ID; car_class_configuration; accountable_operator; chauffeur_responsibility; actual_geography; promised_interval_duration_extent; actual_availability_response_quality; delivered_interval_duty; actual_standby; passenger_legs_secondary; actual_OD_distance_or_stationary; fulfilment_acceptance_rule; acceptance_evidence; timestamped_amendments_extensions_release; driver_vehicle_substitution; interruptions; partial_failed_cancelled_no_show; platform_other_private_users; cross_period_carry; uncertainty"
      collection_method: "Reconcile the actual single-car agreement and chronological amendments with real car/driver availability, response/transport duties, interval/class/quality logs and accepted fulfilment. Identify one fulfilled whole engagement per actual car responsibility, not each driver shift/stop/internal leg or booking/fleet. Evidence genuine delivered stationary standby independently of passenger counts; payment/minimum fee/cancellation charge is not delivery. Retain original promised extent and actual early release/termination/partial failures; never retroactively count failed full scope as successful by shrinking it. Stratify actual unlike duration/class/quality cohorts. N=sum actual compatible fulfilled single-car whole engagement records; normalize once."
      unit: "Item(s); actual h; actual day; km; secondary persons/legs"
      frequency: "per operation; declared representative period"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Actual agreed and delivered car/driver engagement wherever delivered and complete relevant operator/platform/all-user duty pool"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_energy
      process_id: "hire_service"
      flow_role: "gasoline_supply; diesel_supply; charging_ac"
      record_type: "meter_stock_record"
      raw_fields: "vehicle_id; fuel_identity; fossil_biogenic_fraction; actually_burned; spilled; evaporated; recovered; transferred; native_unit; opening_stock; deliveries; closing_stock; returns; charge_gate; charger_losses; actual_loaded_km; deadhead_km; idle_hours; zero_passenger_duty; on_duty_waiting; empty_cruising; dispatch_pickup; failed_jobs; platform_sessions; personal_driver_travel; complete_odometer_ledger; engagement_ID; actual_contracted_standby; actual_stationary_HVAC; driver_change_and_empty_return; other_hire_taxi_platform_duty; full_duty_interval"
      collection_method: "Separately reconcile fuel supplied/withdrawn and actual combustion, spill, evaporation, recovery and transfers; direct combustion activity is not automatically total withdrawal. Use aligned fuel stock/meter and AC import records for the same actual duties; separate purchasing from consumption, other users and transfers; reconcile charger and car battery boundaries. Partition full GPS/odometer duty, including empty service and actual multi-platform overlaps, before attributing fuel or electricity. Logins or metered paid distance alone do not cover full vehicle duty. Calculation and aggregation: Attributed fuel net withdrawals and actual AC delivered energy / N; separate their combustion/fate activities, stock-adjusted and converted only with compatible evidence The denominator N is fulfilled whole single-car hires, not passengers; include real required stationary availability, driver change/support, empty and failed duties with actual ownership. Reconcile all other taxi/platform/hire/private users and provider-included cells."
      unit: "kg; MJ; native volume; km; h"
      frequency: "each vehicle/charge/fill; full cohort"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_depot
      process_id: "hire_service"
      flow_role: "support_ac; wash_water; cleaning_detergent"
      record_type: "site_record"
      raw_fields: "site_id; meter_id; covered_users; charge_meter_overlap; native_quantity; material_SKU; actual_formulation; delivered_gate; physical_driver_all_users"
      collection_method: "Collect site meters, cleaning issue records and provider scope; segregate charging, maintenance, other fleets and terminal users before allocating a measured shared residual. Calculation and aggregation: Sum attributable actual quantities / N; exact shared ownership retained The denominator N is fulfilled whole single-car hires, not passengers; include real required stationary availability, driver change/support, empty and failed duties with actual ownership. Reconcile all other taxi/platform/hire/private users and provider-included cells."
      unit: "MJ; kg; native material units"
      frequency: "each issue/meter period; same cohort"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_maintenance
      process_id: "hire_service"
      flow_role: "refrigerant_r134a_supply; r134a_air"
      record_type: "maintenance_record"
      raw_fields: "vehicle_id; actual_refrigerant; opening_charge; additions; removals; recovered_charge; closing_charge; urea_solution_mass; concentration; reagent_carbon_origin; replaced_component; actual_fate"
      collection_method: "Use job orders, substance/formulation certificates and balances; independently identify additions, atmospheric loss, recovered product and waste. Unknown leakage or chemistry is not zero. Collect urea/SCR-specific fields only for an actual applicable system; any real reagent needs its separate concrete exchange and coverage, while evidenced non-use is recorded explicitly. Calculation and aggregation: Attributed actual supply/emission quantities / N, using reconciled independent balances The denominator N is fulfilled whole single-car hires, not passengers; include real required stationary availability, driver change/support, empty and failed duties with actual ownership. Reconcile all other taxi/platform/hire/private users and provider-included cells."
      unit: "kg; actual component units"
      frequency: "each maintenance event; cohort and lifetime interfaces"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_assets
      process_id: "hire_service"
      flow_role: "gasoline_car_supply; bev_car_supply"
      record_type: "asset_lifetime_record"
      raw_fields: "asset_ID; vehicle_configuration; initial_battery_coverage; actual_replacements; useful_life_duty; total_life_driver; attributed_driver; all_users; manufacturing_maintenance_retirement_scope; road_and_depot_service_inventory; uncertainty; native_delivered_asset_quantity; same_asset_all_hire_taxi_private_users; actual_positive_all_user_useful_duty; independent_components_and_retirement; driver_support_site_assets"
      collection_method: "Record each delivered car/pack manufacturing-provider gate, initial-battery scope and actual quantity separately from its full-life duty denominator. Map every manufacturing, use, maintenance and retirement stage to exactly one owner. Add independent uncovered operation, component supply, whole-vehicle or component disposal/treatment records; an inclusive provider replaces its exact covered stages. Justify lifetime and all-user duties; money is not item count. Calculation and aggregation: For each asset a: delivered manufacture/supply quantity times attributable duty / total compatible useful duty / N; this allocates only verified provider coverage, not uncovered use or retirement. Keep every positive lifetime denominator explicit All actual service, household/personal and other users enter compatible physical lifetime denominators; a loan term or residual money value is not a physical useful life. The denominator N is fulfilled whole single-car hires, not passengers; include real required stationary availability, driver change/support, empty and failed duties with actual ownership. Reconcile all other taxi/platform/hire/private users and provider-included cells. Record each actual car class/chassis/drive, battery/replacement and real driver-support/safety/accessibility asset independently; car ownership or leasing finance does not determine physical manufacture or useful life. Same-asset compatible all-user useful duty includes actual stationary service where that is the supported physical driver; no invented km equivalent for standby."
      unit: "Item(s); km; h; actual infrastructure service units"
      frequency: "asset life; update on replacement or retirement"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_fates
      process_id: "hire_service"
      flow_role: "wash_wastewater; spent_engine_oil; spent_car_tyres"
      record_type: "fate_record"
      raw_fields: "stream_ID; material_state; native_quantity; composition; receiver_gate; waste_status; reuse_retread; transport; treatment_provider; treatment_coverage; direct_outlet; stock_change"
      collection_method: "Use independent weigh/transfer notes and receiver evidence for each actual stream. Reconcile input inventories, stocks, evaporation, abrasion and physical collected quantities; no synthetic residual waste mixture. Calculation and aggregation: Attributed independent fate quantities / N; treatment exactly once The denominator N is fulfilled whole single-car hires, not passengers; include real required stationary availability, driver change/support, empty and failed duties with actual ownership. Reconcile all other taxi/platform/hire/private users and provider-included cells."
      unit: "kg; actual receiver-native units"
      frequency: "each transfer/discharge; cohort"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_emissions
      process_id: "hire_service"
      flow_role: "fossil_co2_air; fossil_ch4_air; n2o_air; pm25_air"
      record_type: "species_medium_record"
      raw_fields: "source_ID; vehicle; fuel; duty; species; fossil_biogenic_origin; particle_size; receiving_medium; factor_native_basis; unit; measured_or_modelled; factor_source; scope; overlaps; uncertainty"
      collection_method: "Measure or use separately justified technology/fuel/duty-specific non-default models. Reconcile factor basis with actual activity and source/medium. Retain every applicable non-exhaust, combustion, reagent and leakage record. Calculation and aggregation: Sum non-overlapping actual source-specific species quantities / N; never CO2-equivalent as species mass The denominator N is fulfilled whole single-car hires, not passengers; include real required stationary availability, driver change/support, empty and failed duties with actual ownership. Reconcile all other taxi/platform/hire/private users and provider-included cells."
      unit: "kg species; particle-size-specific kg"
      frequency: "actual duty or justified representative measurement"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_provider
      process_id: "hire_service"
      flow_role: "purchased_car_hire"
      record_type: "provider_native_coverage_record"
      raw_fields: "provider_ID; agreement_car_interval_link; matched_duration_class_quality_scope; native_unit_u; q_per_u; actual_demand_A_u; measured_compatible_conversion; provider_gate; covered_cells; remaining_owner; cohort_all_user_share; already_normalized; uncertainty"
      collection_method: "Read actual completed provider service, native functional unit and covered stages/cells, matching real car/driver/duration/class/scope/quality. q_u times actual compatible A_u times evidenced cohort/all-user share /N once. Count card only where supplier native result is one matching fulfilled whole engagement; hours/days/vehicle quantities require a distinct verified row and actual demand, not a per-person occupancy conversion. Replace exact covered cells only and preserve uncaptured integrator/car/site/support/lifecycle burdens."
      unit: "Item(s); actual verified provider-native units"
      frequency: "per operation; declared representative period"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Actual agreed and delivered car/driver engagement wherever delivered and complete relevant operator/platform/all-user duty pool"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
  calculation_rules:
    - id: normalize_actual
      applies_to: "all inventory rows"
      rule: "For each actual exchange divide the attributed quantity by the same N; do not divide an already normalized provider result by N a second time."
      inputs:
        - "actual attributed native quantity"
        - N
        - cp_service
      output: "quantity per reference flow"
      source_ids:
        - ghg-product-standard
    - id: shared_allocation
      applies_to: "all inventory rows"
      rule: "Attributed common quantity = measured common total times actual cohort driver / sum of compatible all-user drivers. Require a positive denominator and record the physical basis and uncertainty for each application."
      inputs:
        - "measured shared total"
        - "cohort driver"
        - "complete all-user denominator"
      output: "attributed native quantity"
      source_ids:
        - ghg-product-standard
    - id: asset_equivalence
      applies_to: "gasoline_car_supply; bev_car_supply"
      rule: "Use delivered manufacture/supply quantities and actual complete-life duty shares recorded by cp_assets; lifetime is the allocation basis only. Separate uncovered use, maintenance and retirement; initial/replacement, vehicle/pack and inclusive-provider coverage must not overlap."
      inputs:
        - cp_assets
        - "actual complete-life quantities"
        - "positive compatible duty denominator"
      output: "attributed delivered supply equivalents"
      source_ids:
        - ghg-product-standard
    - id: fuel_fate_partition
      applies_to: "gasoline_supply; diesel_supply"
      rule: "Net withdrawal = opening + receipts - closing - returns; reconcile independently documented burned + spill + evaporation + recovery/other fate quantities on a compatible stock boundary. Any unexplained difference blocks closure. Use actual burned mass, not withdrawal or invoice mass, in direct combustion models."
      inputs:
        - cp_energy
        - cp_emissions
        - cp_fates
      output: "attributed fuel supply and separate compatible combustion/fate activities"
      source_ids:
        - ghg-product-standard
  data_quality_requirements:
    - id: completion_and_comparability
      applies_to: "hire_service"
      requirement: "Missing actual agreement, single-car responsibility, duration/extent/quality and accepted fulfilment evidence blocks completion. N counts fulfilled compatible engagements, not completed passenger legs; true zero-passenger stationary availability is retained when actually delivered. Actual duty distance may be evidenced zero, not assumed missing. Preserve unsuccessful/partial and amended promised-versus-delivered extent and heterogeneous cohorts."
      evidence: "cp_service;cpc3-structure;blacklane-hourly;uber-hourly"
    - id: other_actual_energy
      applies_to: "hire_service"
      requirement: "Identify every actual fuel, hydrogen supply, steam/heat, hybrid pathway or auxiliary carrier omitted from the concrete examples. Record exact delivered identity, native unit, upstream scope and actual quantity; unknown applicability blocks completion. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_energy"
    - id: other_actual_materials
      applies_to: "hire_service"
      requirement: "Identify each actual lubricant, chemical, disinfectant, cleaner, reagent formulation, spare part, tyre or battery chemistry/configuration. Expand each independently supplied or maintained item into a verified atomic exchange; no generic material collection may stand in for them. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_maintenance"
    - id: roads_depots_and_charge_assets
      applies_to: "hire_service"
      requirement: "Obtain actual attributable road, terminal, depot, charger and other supporting infrastructure lifecycle inventories with compatible complete-life all-user denominators. Distinguish upstream infrastructure already included in provider data from genuinely missing burdens; missing coverage blocks complete-lifecycle use. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_assets"
    - id: providers_and_subcontracting
      applies_to: "hire_service"
      requirement: "Identify each actual subcontracted operating/repair/treatment result and its native functional unit, boundary and physical driver. An inclusive provider result replaces its covered foreground exchanges; do not add them again or substitute an arbitrary freight or vehicle-manufacturing UUID. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_depot"
    - id: other_fate_streams
      applies_to: "hire_service"
      requirement: "Expand each actual sludge, filter, packaging, battery, retired whole vehicle or dismantled component, wastewater outlet, reused product and disposal/treatment result separately. Whole-vehicle and retained-component views are mutually exclusive for the same material. Establish material, mixture state, receiver gate and native quantity; evaporation or unaccounted loss cannot be invented as collected waste. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_fates"
    - id: other_species_media
      applies_to: "hire_service"
      requirement: "Identify actual CO, nitrogen oxides with reported chemical basis, ammonia/SCR slip, each other refrigerant, biogenic combustion products, non-exhaust size classes, road/soil deposits and runoff species/outlets. Expand every independently quantified substance/size/source/medium; no generic NOx/VOC/dust residual UUID and no missing-as-zero. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_emissions"
    - id: duty_purpose_and_platforms
      applies_to: "hire_service"
      requirement: "Identify every actual hire/standby/driver-support, private, taxi and other-platform duty and temporal overlap. Complete actual required dispatch/digital/site/driver transfer/rest support with definite physical supplies or provider services; money/wages do not prove native output. Routine human subsistence is not automatically an operating fuel; actual included service provisions and their boundary require explicit occurrence, attribution and independent atomic quantities. Unknown is incomplete."
      evidence: "cp_service; cp_energy; cp_depot"
    - id: atomic_actual_expansion
      applies_to: "hire_service"
      requirement: "MANDATORY for every actual unrepresented material, car/component/site asset, provider result, incidental product, waste, species/particle/medium or treatment: unique row_id; one existing process and actual direction/type; one definite identity/state/formulation; verified UUID or explicit unresolved registration; native property/unit/quantity/basis/raw source; valid same-parent CP; physical calculation and provider gate/covered cells; receiver/known subcompartment; uncertainty. Resolve real occurrence or evidenced non-applicability; unknown is not zero or scope exclusion. No generic collection row stands for actual exchanges."
      evidence: "all actual records;valid process/protocol foreign keys"
    - id: full_actual_car_technology_and_provisions
      applies_to: "hire_service"
      requirement: "MANDATORY: identify each actual passenger-car class/chassis/drive, initial/replacement batteries/tanks/components, CNG/LPG/hydrogen/other fuel formulation or hybrid pathway, external AC/DC/swap, actual climate/control/reagent/refrigerant and safety/accessibility configuration. The two delivered car cards are only actual matching assemblies, not all car technologies. Native manufacture/supply, all-user useful duty, maintenance/retirement and each actual species/waste/fate require separate completion. All actually included driver/support/communications/refreshment/other provisions retain concrete upstream and fate responsibilities; no default provision or factor."
      evidence: "cp_assets;cp_energy;cp_depot;cp_maintenance;cp_fates;cp_emissions"
    - id: fulfilment_history_and_multicar
      applies_to: "hire_service"
      requirement: "MANDATORY: retain original agreement and timestamped actual amendments, single physical car/driver responsibility and vehicle/driver substitutions, actual promised-versus-delivered duration/availability/response/quality and acceptance evidence. Split actual multi-car engagements independently, not fleet order or chauffeur shifts. Separate genuinely fulfilled zero-passenger availability from undelivered/cancelled/partial work; no retrospective shrinking to manufacture success or fee as completion. Independently accepted partial/amended functions need their true output/extent and comparability before aggregation."
      evidence: "cp_service;cp_provider;actual agreement and delivery history"
validation_rules:
  - rule_id: service_basis
    applies_to: "hire_service"
    rule: "Verify actual single-car whole hire function except taxi, agreed and delivered duration/class/scope/quality and accepted fulfilment for each count. N>0 means fulfilled engagements, not passengers. Genuine stationary zero-passenger availability may count; booking/fleet/driver shift/internal leg/payment/cancellation alone may not. No blanket time, limited-party, multiple-destination or geography threshold is imposed by the general CPC note."
    source_ids:
      - cpc3-structure
      - blacklane-hourly
      - uber-hourly
  - rule_id: period_closure
    applies_to: "hire_service"
    rule: "Reconcile car/driver/interval/provider duty and stock closure, all actual other users, failed/partial/cancelled work and cross-period carry. Distinguish real delivered standby from unfulfilled availability; N=0 fulfilled engagements has no finite per-hire intensity but zero passengers alone is not N=0. Actual supporting/failed burdens remain in their evidenced causal pool."
    source_ids:
      - ghg-product-standard
  - rule_id: identity_and_expansion
    applies_to: "hire_service"
    rule: "Each inventory row names one actual material/service result/waste stream/substance-medium; confirm exact UUID/property/unit compatibility before final use. Every completion requirement must be resolved by actual independent rows or evidenced non-applicability; unknown is not zero."
    source_ids:
      - ghg-product-standard
  - rule_id: closure_and_overlap
    applies_to: "hire_service"
    rule: "Check charging/vehicle/depot energy ownership, initial/replacement batteries, direct versus upstream emissions, overlapping PM size classes, recovered refrigerant, waste treatment and asset lifetime allocations. No automatic density, occupancy, lifetime, emission factor or recycling credit is permitted."
    source_ids:
      - ipcc-mobile-combustion
      - eea-electric-vehicles
      - ghg-product-standard
  - rule_id: native_provider_and_cp_gate
    applies_to: "hire_service"
    rule: "All CP process_id values identify one existing inventory process; each card links a valid same-parent CP. Verify provider native-unit actual demand, whole-hire versus hour/day/person/distance distinction and exact covered-cell replacement. Verify same-asset native manufacture quantity and positive complete all-user useful duty, original/replacement/whole-component and fuel mixture/component exclusivity, known receiving media and actual fate completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after actual agreement fulfilment/native identity/quantity/coverage/lifetime/fate completion and review"
  allowed_use: "Actual fulfilled single-car chauffeured passenger-car hire except taxi, with harmonized declared duration/class/scope/quality, actual geography and complete lifecycle, including genuinely delivered zero-passenger availability"
  excluded_use: "Passenger-leg/taxi/fleet-booking/driver-shift output substitution; bare-car rental or driver labour alone; fee as fulfilment; failed scope renamed full; universal per-hour/pkm/occupancy factor or incomplete data as full lifecycle"
  required_metadata: "Original/amended agreement chronology; single car/driver/class/geography/duration/scope/quality/accepted delivery and stationary/failed duties; all-user platform/private ledger; native provider/asset stages; actual quantities/fates/uncertainty"
  required_quality_disclosure: "All unverified identities, missing actual quantities, sampling/model uncertainties, unresolved infrastructure/asset/waste coverage, and cause of non-comparability"
  update_trigger: "Material route/propulsion/vehicle/battery/provider changes; revised activity, life or source evidence; changed classification or service completion definition"
data_sources:
  - id: "cpc3-structure"
    type: "official_guidance"
    reference: "UNSD CPC3.0 Explanatory Notes,30June2025,actual PDFp359,64116. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Chauffeur-driven passenger-car hire wherever delivered except taxi; general time/limited-passenger and frequent multi-destination note, not universal gates or a person-leg unit."
  - id: "nyc-tlc-utilization-2025"
    type: "official_guidance"
    reference: "NYC TLC Notice of Promulgation,adopted25June2025,PDFpp2,6–8. https://a856-cityrecord.nyc.gov/Search/GetFile?documentId=42301&requestId=20250625045&requestStatus=Archived&sectionId=4"
    used_for: "Qualitative distinction between passenger, dispatch waiting and pickup travel in actual duty. No monetary rate, utilization percentage, financed lifetime or LCA factor adopted."
  - id: "dft-private-hire-2023"
    type: "official_guidance"
    reference: "DfT Private hire vehicle licensing guidance note,updated17November2023,section2Question2 and3.2. https://www.gov.uk/government/publications/taxi-and-private-hire-vehicle-licensing-best-practice-guidance/private-hire-vehicle-licensing-guidance-note"
    used_for: "England-only typical A-to-B chauffeur/private-hire licensing context and service responsibility, not global law, full hire completion rule or proof every engagement is a passenger leg."
  - id: "ipcc-mobile-combustion"
    type: "official_guidance"
    reference: "IPCC2006Guidelines,Vol2Ch3,section3.2,pp3.10–3.16. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Qualitative fuel/activity, origin and technology-specific species accounting; no default factor adopted and national GHG inventory is not full service lifecycle."
  - id: "eea-electric-vehicles"
    type: "official_guidance"
    reference: "EEA Electric vehicles,Overview. https://www.eea.europa.eu/en/topics/in-depth/electric-vehicles"
    used_for: "Vehicle/battery manufacture and road/tyre/brake burdens remain; no average benefit, battery life or universal numerical intensity transferred."
  - id: "ghg-product-standard"
    type: "standard"
    reference: "WRI/WBCSD ProductLifeCycleAccountingAndReportingStandard2011,chapters7–9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary/data quality and subdivision/physical allocation; complete vehicle/infrastructure lifecycle is an explicit PCR scope choice, not a capital mandate attributed to this GHG standard."
  - id: "blacklane-hourly"
    type: "official_guidance"
    reference: "Blacklane by-the-hour chauffeur and full-day driver hire,official public page accessed22October2026. https://www.blacklane.com/en/hourly-car-service/"
    used_for: "Actual duration/class, flexible itinerary, chauffeur standby and extension/early-shortening example. No universal minimum/maximum duration, included distance, city restriction, price, offset benefit, availability or actual fulfilment assumed."
  - id: "blacklane-quote"
    type: "official_guidance"
    reference: "Blacklane quote FAQ,official public page accessed22October2026. https://help.blacklane.com/en/articles/8559919-how-do-i-get-a-quote"
    used_for: "Actual per-vehicle versus passenger pricing, separate multi-car arrangements and possible chauffeur changes as interface questions; no universal party size, work-hour/legal rule or physical factor."
  - id: "uber-hourly"
    type: "official_guidance"
    reference: "Uber Hourly FAQ,official public page accessed22October2026. https://help.uber.com/riders/article/hourly-faq?nodeId=b4eec5b3-8362-44c7-8d15-b76585ad4bdf"
    used_for: "Actual time/stops, driver acceptance and itinerary changes versus early-ending/minimum/cancellation charges; charges do not prove delivery. No fare, minimum time, stop/mileage limit, airport/geography restriction or occupancy adopted."
