measurement_rules:
  - id: hire_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "N counts compatible actual fulfilled single-car whole engagements with recorded actual contract extent/duration/quality/acceptance. Zero passenger legs or zero distance can coexist with a fulfilled availability engagement. A booking, car fleet, driver shift, passenger leg or charged cancellation is not counted as fulfilled output. N>0 is required for finite per-engagement normalization; no occupancy denominator."
  - id: duration_extent_comparability
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual service extent and native activity"
      uuid: ""
    required_unit: "Item(s); h; day; km"
    rule: "Declare each agreement actual promised/delivered interval, duration, car class, duty scope and quality. Stratify materially different engagements or disclose supported weighting/heterogeneity; Count alone does not make unlike durations comparable. Hour/day/native supplier activity is measured separately and converted only on a verified matching functional boundary; fees/minimum billable hours are not delivered hours."
  - id: native_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Native compatible property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Preserve measured units. Metered electricity kWh may use 3.6 MJ/kWh; this is an energy-unit conversion, not a fuel heating-value factor. Fuel/water volume-to-mass requires actual compatible density/state; N2O-N, NOx-as-NO2 and refrigerant CO2-equivalent require explicit substance conversion."
  - id: fuel_stock_and_fate
    applies_to: "gasoline_supply; diesel_supply"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Net fuel withdrawn = opening stock + actual receipts - closing stock - returns. Independently reconcile fuel actually burned, spilled, evaporated, recovered or otherwise transferred; do not infer those fates from an unexplained residual. Fuel-supply burden follows attributed net withdrawal, while direct combustion calculations use only the compatible actually burned quantity and supported carbon/oxidation basis."
