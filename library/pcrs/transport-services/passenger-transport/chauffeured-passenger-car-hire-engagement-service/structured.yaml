          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| service_basis | hire_service | Verify actual single-car whole hire function except taxi, agreed and delivered duration/class/scope/quality and accepted fulfilment for each count. N>0 means fulfilled engagements, not passengers. Genuine stationary zero-passenger availability may count; booking/fleet/driver shift/internal leg/payment/cancellation alone may not. No blanket time, limited-party, multiple-destination or geography threshold is imposed by the general CPC note. | cpc3-structure;blacklane-hourly;uber-hourly |\n| period_closure | hire_service | Reconcile car/driver/interval/provider duty and stock closure, all actual other users, failed/partial/cancelled work and cross-period carry. Distinguish real delivered standby from unfulfilled availability; N=0 fulfilled engagements has no finite per-hire intensity but zero passengers alone is not N=0. Actual supporting/failed burdens remain in their evidenced causal pool. | ghg-product-standard |\n| identity_and_expansion | hire_service | Each inventory row names one actual material/service result/waste stream/substance-medium; confirm exact UUID/property/unit compatibility before final use. Every completion requirement must be resolved by actual independent rows or evidenced non-applicability; unknown is not zero. | ghg-product-standard |\n| closure_and_overlap | hire_service | Check charging/vehicle/depot energy ownership, initial/replacement batteries, direct versus upstream emissions, overlapping PM size classes, recovered refrigerant, waste treatment and asset lifetime allocations. No automatic density, occupancy, lifetime, emission factor or recycling credit is permitted. | ipcc-mobile-combustion;eea-electric-vehicles;ghg-product-standard |\n| native_provider_and_cp_gate | hire_service | All CP process_id values identify one existing inventory process; each card links a valid same-parent CP. Verify provider native-unit actual demand, whole-hire versus hour/day/person/distance distinction and exact covered-cell replacement. Verify same-asset native manufacture quantity and positive complete all-user useful duty, original/replacement/whole-component and fuel mixture/component exclusivity, known receiving media and actual fate completion. |  |\n\n"
