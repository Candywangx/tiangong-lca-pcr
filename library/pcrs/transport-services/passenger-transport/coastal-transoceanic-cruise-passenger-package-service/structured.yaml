allocation_rules:
  - rule_id: direct_package
    applies_to: "sea_cruise_package"
    rule: "Subdivide dedicated passenger/package/class/provider resources first. One completed person package is final output; ship legs,cabin-nights,meals and performances actually included are constituents,not additional final co-products. Independent actual cargo,optional dining,rooms,shore services or energy outputs need separate function/gates."
    source_ids: []
  - rule_id: shared_pools
    applies_to: "sea_cruise_package"
    rule: "Allocate residual common resources by demonstrated actual causal drivers across all products/users and period. Submeter hotel/galley/propulsion where possible. Cabin area-time,actual occupied exposure or measured resource use may apply only with physical support. Berths,maximum capacity,assumed double occupancy,ticket prices and equal voyage fractions are not defaults; passenger-distance and tonne-distance cannot be added."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: crew_and_empty
    applies_to: "sea_cruise_package"
    rule: "Operating crew and performers are roles with actual attributable support,not extra passenger-package outputs. Retain standby,port hotel load,empty/repositioning,tests,partial/failed voyages and unfulfilled demand in evidenced pools. N=0 has no finite package intensity and does not delete the numerator."
    source_ids: []
  - rule_id: asset_lifetime
    applies_to: "sea_cruise_package"
    rule: "For each actual ship/component,attributed manufacture=actual delivered native quantity times studied compatible duty/positive documented same-asset all-user complete-life duty; then divide once by completed passenger-package N. Match numerator/lifetime to the same physical asset and compatible use; include all cruise and other actual users. Manufacture only; forecasts/uncertainty disclosed,not annual purchases,depreciation or berth occupancy as life."
    source_ids: []
  - rule_id: recovery
    applies_to: "sea_cruise_package"
    rule: "Track actual reused products,collected wastes,treatment and external energy output separately with one declared method and receiver. Do not claim both whole/component retirement or provider/foreground treatment. No automatic avoided virgin material,grid,fertilizer or travel credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_packages
      process_id: "sea_cruise_package"
      flow_role: "Actual completed passenger-package cohort"
      record_type: "package_manifest_and_acceptance"
      raw_fields: "package/passengerID;operator;waterbody;itinerary;ports;embarkation;acceptance;actualduration/nights;cabinclass/quality;actualoccupancy;food/entertainment/inclusions;connections;crewroles;partial/cancelled;period;actualmarinewaterbody/coastal/transoceanic/ports;packagefunctionversus64133;acceptancegate;internallegs/returnboundary;actualclass/stay/food/inclusionsstrata;payload/crew/operatorroles;originalpromiseditinerary/quality/time;actualdeliveredcontent;changes/substitutions/cancellation;documentedacceptance;sea_recreation_entertainment;marineports/routeconditions"
      collection_method: "Reconcile actual offer,manifest,dispatch and fulfilment/acceptance. N=sum completed functionally compatible actual one-person packages; stratify different itinerary/duration/class/function. Count actual people without crew/seat/adult equivalence; cabin-nights,meals or voyage legs remain independent quantities. Do not count unknown/partial completion as full; retain numerator and redefine truly changed fulfilled products transparently. Retain original promised function/content/quality/time, actual delivered deviations/substitutions and evidenced change/acceptance; no retrospective removal of missing promises to count full completion. Actual independently agreed changed fulfilled products use their own declared scope/strata, with original deviation and causal failed/support pools retained. Sea package requires actual supplied recreation/entertainment as well as transport/accommodation/food, with its actual required included functions."
      unit: "Item(s);persons;h;nights;km"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable coastal/transoceanic package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_energy
      process_id: "sea_cruise_package"
      flow_role: "Actual fuel,power and hotel energy chain"
      record_type: "fuel_meter_stock_source_ledger"
      raw_fields: "ship/source/duty;marinegrade/chemistry;blend/components/origin;supplied/stock/withdrawal/burn/spill/recovery;converter/control;propulsion/hotel/galley/port/empty/test;grossshoreAC/DC;internalgeneration/heat;storage/regeneration/export;allusers;providercoverage;actualsources/converters/shaft/thruster;shipshore/metergate;charge/discharge/loss;manoeuvre/current/load/empty/standby;initialstock/periodtopup;sourcechemical/fates;allusers;actualseaoperatingconditions/wind/waves/current;engine/source/loadstates;manoeuvring/porthotelload;fuelgrade/chemistry/control;sourceactualmethanesliporotherrelease;shipshoreports"
      collection_method: "Use actual reconciled bunker receipts,stocks and source/submeters/duty logs. Wholeblend+originledger OR replacing physical component supplies,never both. Keep supplied/withdrawn/burned/spill/recovery distinct. Separate internal generation/heat and actual imported interfaces without another external energy input. Assign compatible native quantities with justified actual all-user drivers;divide by positive completed-package N once. Missing carrier/converter evidence blocks data use,not canonical product scope. Close actual gross source/shore imports and exports, conversion/charge/discharge/storage/auxiliary and port-hotel demand across complete actual duty/all-user pools; onboard generation/steam/heat/internal recovery not new purchased energy. Separately owned initial long-term charge/store absent from whole manufacture uses actual delivered stock/compatible life and retained recovery; period topup and actual use/fates are independent, circulation/recondensation is not new supply. Use actual marine route/weather/wave/current/duty/source and control records, not arbitrary ocean-distance/fuel/carbon/methane-slip factors. Keep ship propulsion and sea/port hotel/galley/recreation demand, gross shore interfaces/storage/generation, empty/test/standby and all users native and non-overlapping. Actual source-species/grade/control methods apply separately; a fuel-chain CO2-equivalent does not determine all ship chemical releases."
      unit: "kg;kWh;nativevolume;h;km"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable coastal/transoceanic package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_hotel
      process_id: "sea_cruise_package"
      flow_role: "Actual accommodation and linen supply"
      record_type: "actual_hotel_linen_scope_ledger"
      raw_fields: "cabin/service/provider;class/quality;occupiedpersons;actualhours/nights;cabinarea;nativeproviderunit/count;linen drymass/moisture;housekeeping/hotwater/HVAC/energy/chemical/water/capital/waste coverage;allusers;actualcabinprovider_q_u;nativeoccupiedA_u;hoursnights/servicedarea;linennew/used/laundereddrymass;laundrycycle/source;housekeeping/time;toiletries/formulation/packaging;sharedspaces/crew;exactcoveredcells"
      collection_method: "Read actual occupied-cabin/night/hour,linen/weighing,housekeeping and provider coverage records. Purchased cabin-night and dry-linen laundering results retain their native output,not passenger-package equivalence. Complete provider coverage replaces matching local hotel/linen/energy/water/chemicals/capital/waste. Owned rooms/laundry expand actual constituents without internal-purchase duplication. Subdivide class/dedicated resources then justify residual actual all-user drivers;divide native quantities by N once. For each actual accommodation/cleaning/laundry provider retain its native function and intensity q_u; multiply actual compatible occupied cabin-nights/hours, dry kg laundered or other evidenced A_u and causal cohort share, then/N once. Never assume one person=one cabin-night or wet laundry=new linen mass. Owned hotel/laundry uses actual cold/hotwater, thermal/electrical energy, detergents/toiletries, linen manufacture/replacements, machine/site life, waste and each receiving fate independently, omitting only exactly provider-covered cells."
      unit: "Item(s)actualcabin-night;h;kgdrylinen;nativeunits"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable sea package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_food
      process_id: "sea_cruise_package"
      flow_role: "Actual catering and food residues"
      record_type: "food_recipe_provider_stock_ledger"
      raw_fields: "actualmeal/drink/recipe/diet/servingsize;nativeunit;provider/ingredientmatrix;rawpreparationservedfood;edible/inedible/wetdry;stock/purchases/spoilage;galley/coldchain/water/packaging/energy;residue/cookingoil;receiver;crewvs passengermenus;actualprovider_q_u;nativeactualservingsA_u;ingredientSKU/state/formulation;recipebatch_yield/edibleinedible;rawcookedservedstocks;moisture;actualpackaging;pre/postconsumerwaste;nativefate/receiver;portprovisioning/voyagestockcarryover;unused/spoiled/servedfood;actualcrew/passengermenus"
      collection_method: "Reconcile actual food/serving/provider and stock/recipe/mass records,not a default meal-per-day rate. Externally prepared meal results replace their included recipe/energy/packaging/waste; owned galley uses actual ingredient/native inputs instead of another internal meal purchase. Record each actual ingredient/state,drink,stock loss,independent food residue/cooking oil/packaging and actual fate with native amounts. Separate passenger and attributable crew support,assign shared resources by physical evidence,then /N once. For each externally prepared actual meal/service q_u multiply actual compatible serving/content A_u and evidenced cohort share before/N; no ingredient-mass-to-meal or meal-to-package shortcut. Owned galley closes actual ingredient/formulation/raw/cooked/edible/inedible/moisture stocks, yields, independently measured losses/food residues/cooking oil and actual packaging/receivers. Every real ingredient, drink, chemical, package and residue is one atomic exchange; no plural food collector or residual waste/emission by guess. Reconcile real port provisioning and voyage opening/closing/carryover stocks by actual ingredient/recipe/formulation/wetdry/edible and served/unserved/spoiled/packaging/cooking-oil fates, with native quantities and all-user ownership. Leftover/returned/reused stock is not automatically waste, emission, new virgin purchase or avoided-food credit."
      unit: "Item(s)actualmeals;kg;L;nativeunits"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable coastal/transoceanic package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_water
      process_id: "sea_cruise_package"
      flow_role: "Actual water,sewage,bilge and receivers"
      record_type: "water_outlet_receiver_balance"
      raw_fields: "source/quality/state;supplied/abstracted/desalinated;nativevolume/mass;stock/reuse/evaporation;blackwater/greywater/bilge/ballast/scrubber;actualcomposition/wetbasis;separation/sludge/recoveredoil;holding/pumpout/directoutlet;freshwater/marine receiver;treatmentcoverage;actualmarine_outlet/location;freshwater/sewer/soil/othermedium;actualcomposition;independentwaterstockandwastefates;knownmarine/freshwater/sewer/soil/outletlocation;actualporthandover;receivercompatiblechemistry/particlefates"
      collection_method: "Measure actual each water/outlet and composition with stocks,meters and reception/operation logs. Supply is not wastewater. Keep distinct physical streams and real treatment/intermediate/recovered/waste versus direct release boundaries; a mixed stream requires actual measured mixing/composition,not arbitrary collection of unrelated fates. Independently complete each discharged species and receiver and each treatment service without duplicating provider-owned releases. Attribute native quantities and /N once; unknown destination is not zero. Record actual sea-cruise outlet with its known marine/freshwater/sewer/soil/other receiving state; neither route label nor legal text substitutes for evidence. Vessel sewage/bilge and galley/hotel/crew outlets retain their own measured composition/native mass, stocks and covered treatment events, not generic water-use equivalents. Actual sea itinerary alone does not assign a marine receiver to every outlet: evidence known marine/freshwater/sewer/soil/outlet and retained stream/stock/port receiver. Keep actual chemical/wet/particle native fates and treatment coverage; permission/prohibition text is not physical quantity or inferred absence."
      unit: "m3;kgwet;specieskg;nativeunits"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable coastal/transoceanic package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_support
      process_id: "sea_cruise_package"
      flow_role: "Actual port,recreation,connections and support"
      record_type: "port_entertainment_connection_ledger"
      raw_fields: "actualinclusion/function;port/terminal/berth;excursion/air/ground/shuttle;entertainmenttype/venue/duration/audience;provider/nativeunit;crew/safety/accessibility;supplies/energy/assets/waste scope;allusers;actualnativeprovider_q_u;realcompatibleA_u;causalcohortshare;payloadhandling/stowage/safety/cleaning;actualprovidedanimalcare;crew/performerpassengerroles;actualrecreation/entertainmentfunction;programme/venue/equipment;duration/quality;actualaudience/personroles;nativewholeeventorhourorparticipantprovider;performertransport/support;venuecapital/lighting/AV;actualfate/receiver"
      collection_method: "Inspect actual offer and original work/provider records for each included function and actual native quantity. Included transport/shore/entertainment cannot be deleted. A complete external provider replaces its exact personnel/transport/equipment/energy/capital/waste cells; owned internal performance or transfer is not extra purchased output. Fees do not define physical quantities. Assign dedicated resources first,then supported shared all-user pools,then /N once. Native provider q_u times real compatible activity A_u times justified cohort/all-user share precedes/N once; only one-whole-reference-equivalent provider skips further normalization. Record actual included transport/excursion/guide/recreation demand in its own native units, not a new final package output. Distinguish passengers/payload from production assets; retain actual stowage/safety/cleaning and provided passenger/animal food/water/care. For actual intrinsic sea recreation/entertainment read programme, venue, quality, duration, real audience/performer roles and actual native provider units. Whole event, venue-hour and per-participant activity differ; measure actual compatible A_u and causal cohort/all-user share before/N. Provider-covered performer travel/dedicated support, AV/equipment/lighting/space energy and venue/asset life/material/waste cells replace exactly; owned internal activities are actual atomic inputs, not another purchased performance or new final package output."
      unit: "nativefunctions;Item(s)actualperformance;h;kWh;kg"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable coastal/transoceanic package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_maintenance
      process_id: "sea_cruise_package"
      flow_role: "Actual maintenance and refrigerant balance"
      record_type: "maintenance_charge_fate_ledger"
      raw_fields: "ship/equipment;actualsubstance/formulation/purity;originalfinalcharge;add/remove/recover;work/source;usedoil;antifoul;wetdry/contents;receiver/providerphase;actualrelease/method;initiallongtermchargeversusperiodadditions;docking/cleaning/coating/repairwastes;actualreleaseversusrecovery"
      collection_method: "Use actual maintenance/stock/receiver and monitored charge records. Independently quantify supplies,recovered products,wastes and actual releases. Recharge is not leakage and unexplained deficit is not automatically emission. Preserve actual formulation and original/replacement equipment coverage; complete uncovered drydock/antifouling operations/materials/fates. Attribute nonoverlapping native quantities,then /N once. Initial long-term charge not included in equipment supply is not all current maintenance consumption: use actual stock/retained recovery and compatible asset/life attribution; actual period additions/use/fates stay causal. Read drydock hull/antifoul/cleaning/repair source and independent wastes/receivers; source regulatory description is not a zero or emission factor."
      unit: "kg;nativeunits"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable sea package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_assets
      process_id: "sea_cruise_package"
      flow_role: "Actual ship,infrastructure and lifetime demand"
      record_type: "same_asset_complete_life_register"
      raw_fields: "asset/cohort/configuration;deliverednativeamount/gate;originalcomponents/hotelfitout;studiedcompatible duty;positiveall-userlife duty;otheractualusers;forecast/uncertainty;replacement/drydock/retirement;providerstage;payloadversusoperatorasset;nativeinitialchargecoverage;samephysicalasset/allusercohort;drydock/shipshore/hotelfitoutmissingphases;recreation/venue/AV/sports/pool/nativeassets;actualshiproute/duty/allusers;refit/renewal/retirementcoveredcells"
      collection_method: "Read actual supply/engineering/lifetime/duty/retirement records for the same asset/cohort. Manufacturing demand=actual delivered native quantity times studied compatible duty/positive total same-asset all-user complete-life duty;then /N once. The allocation covers manufacture/supply only,not whole-life cruise. Independently complete uncovered hotel/port/terminal/shorepower/equipment,maintenance/replacements and retirement; provider-covered fuel/emissions/phases replace matching local data. Transported passenger/private luggage/vehicle/animal bodies are not automatically acquired manufacture/rearing assets; actual operator-provided equipment and real working-production functions remain assessed. Complete native ship/port/hotel/galley/laundry/sanitary/coldchain/shorepower/refit/renewal/retirement ownership and same-asset all-user compatible life without double whole/initial/component supply. Complete real sea ship, hotel/galley/laundry/sanitary and recreation/venue/AV/sports/pool/shore assets and support only when actually required. Native supply gates, exact whole-versus-original/replacement coverage and same physical asset full-all-user compatible useful duty apply before/N; absent examples never waive actual life/receiver evidence."
      unit: "Item(s);asset-nativeunits;h;km"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable coastal/transoceanic package/provider/source cells;all users and included responsibilities reconciled"
