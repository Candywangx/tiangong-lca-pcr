    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard,2011,Ch6–9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
