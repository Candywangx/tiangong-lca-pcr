    applies_to: "sea_cruise_package"
    rule: "Retain actual empty/repositioned/standby/porthotel/test/partial/failed resource pools with matched period and all-user drivers;N=0 has no finite package intensity. Adult/child/crew,cabin occupancy and class records remain actual,not assumed."
