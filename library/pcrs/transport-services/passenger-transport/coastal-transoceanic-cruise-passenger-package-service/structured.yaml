  classification_refs: "CPC3.0 64232; exact dedicated coastal/transoceanic all-inclusive cruise scope"
  covered_products: "Actual coastal or transoceanic sea-cruise whole passenger packages with intrinsic transport/accommodation/food/recreation/entertainment and all actually included other functions/connections"
  excluded_products: "Inland cruise product; standalone sightseeing/excursion; pure conveyance with optional bed/meal; booking-only; independent room/meal or unrelated holiday function"
  representative_product: "Completed all-inclusive coastal or transoceanic cruise package for one passenger"
  production_route: "Actual sea-package fulfilment: ship/shore operation and sources, hotel/galley/laundry/sanitation, actual recreation/entertainment/ports/connections/providers and full lifecycle"
  market_state: "Actual compatible completed sea passenger package with original promise, delivered itinerary/duration/class/food/stay/recreation/inclusions/quality and evidenced acceptance"
