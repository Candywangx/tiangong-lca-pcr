    type: "official_guidance"
    reference: "IMO MEPC.391(81),2024Guidelines on life cycle GHG intensity of marine fuels,PDFp4/annexp3§1–2. https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.391(81).pdf"
    used_for: "Marine fuel-chain/propulsion/onboardpower/shore-electricity and CO2CH4N2O scope only. Refrigerants/other pollutants and complete ship/package lifecycle are outside this source;no numerical factor/GWP imported."
