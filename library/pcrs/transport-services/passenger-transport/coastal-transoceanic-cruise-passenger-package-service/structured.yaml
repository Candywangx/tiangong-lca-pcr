  what: "Actual complete coastal/transoceanic cruise passenger package including transport, accommodation, food, recreation and other entertainment services"
  how_much: "One actual passenger completes one independently declared sea-cruise whole package"
  how_well: "Actual marine route/itinerary/ports, cabin/class/quality/occupancy, food/diet/service, stay, recreation/entertainment/inclusions and original promise/change/acceptance evidenced"
