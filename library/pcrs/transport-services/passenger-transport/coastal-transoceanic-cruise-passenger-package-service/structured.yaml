    applies_to: "sea_cruise_package"
    rule: "Every CP process_id equals one existing processInventory.id and each card CP exists at its own parent. Bilingual rule/native/source fields and projection fingerprints match. Unresolved identities/quantity/source/coverage/fates block complete downstream use;checker pass is not external identity verification or publication approval."
    source_ids: []
