  calculation_rules:
    - id: normalize_packages
      applies_to: "all inventory rows"
      rule: "Actual physical quantities use direct/causal compatible cohort share then /positive actual N once. For native provider intensity q_u first multiply actual compatible demand A_u and justified cohort/all-user share, then/N. Cabin-night/meal/dry-linen/performance/vessel-hour/distance is not package Count; only an exactly equivalent one-whole-declared-reference provider requires no further normalization. Exact included cells replace foreground once. Do not also divide by passengers/cabin occupancy/meals/nights/voyages."
      inputs:
        - cp_packages
        - cp_energy
        - cp_hotel
        - cp_food
        - cp_water
        - cp_support
        - cp_maintenance
        - cp_assets
        - cp_emissions
      output: "native quantity per1Item(s) completed coastal/transoceanic passenger package"
      source_ids: []
    - id: asset_equivalence
      applies_to: "cruise_ship_supply"
      rule: "For each actual ship/component,attributed manufacture=actual delivered native quantity times studied compatible duty/positive documented same-asset all-user complete-life duty; then divide once by completed passenger-package N. Match numerator/lifetime to the same physical asset and compatible use; include all cruise and other actual users. Manufacture only; forecasts/uncertainty disclosed,not annual purchases,depreciation or berth occupancy as life."
      inputs:
        - cp_assets
        - cp_packages
      output: "actual native manufacture equivalents per reference"
      source_ids: []
    - id: supplemental_exposure
      applies_to: "sea_cruise_package"
      rule: "Record actual passenger-distance,cabin occupancy,hours/nights,meal counts and performance/support exposure separately from actual native provider input units and final package N. Supplemental totals do not convert the reference into pkm,roomnight or meal."
      inputs:
        - cp_packages
        - cp_hotel
        - cp_food
        - cp_support
      output: "supplemental actual exposure,not replacement reference"
      source_ids: []
    - id: native_recreation_demand
      applies_to: "sea_cruise_package"
      rule: "For actual native recreation/entertainment intensity q_u, demand=real compatible supplied whole events/venue-hours/participant-activities or other native A_u times justified package-cohort/all-user share. Multiply q_u by that demand then divide by compatible N once. Do not substitute event attendance/fees or divide an already exact one-reference equivalent twice. Match provider-covered venue/personnel/energy/equipment/life/fate cells before local additions."
      inputs:
        - cp_packages
        - cp_support
        - cp_energy
        - cp_assets
        - cp_hotel
      output: "actual native recreation quantity per completed sea package"
      source_ids: []
  data_quality_requirements:
    - id: actual_package
      applies_to: "completed_cruise_package"
      requirement: "Require original actual integrated coastal/transoceanic transport/accommodation/food/recreation/entertainment offer and inclusion matrix, passenger manifest, independent whole-package boundary, delivered variation and documented fulfilment/acceptance, itinerary/duration/hours/nights/class/quality/actual occupancy and all actual included connections. Marketing/overnight/snack/optionalbedmeal alone do not prove a cruise. Preserve original promise/deviations/partialfailed pools; no invented minnight/portion/occupancy or retroactive full-count from omitted functions."
      evidence: "cp_packages"
    - id: actual_energy
      applies_to: "marine_distillate;shore_ac;port_support_ac"
      requirement: "Expand each actual fuel/grade/blend/converter,DC/AC/heat interface and external export separately with real native identity/quantity/provider scope. Other fuels/propulsion are in canonical scope and require actual applicable evidence,not a road-diesel substitution. Wholeblend/components exclusive; supply/withdrawal/burn/spill/recovery distinct; internal generation/heat not new external supply."
      evidence: "cp_energy"
    - id: actual_food
      applies_to: "purchased_evening_meal;galley_food_residue"
      requirement: "Every actual included meal,drink,recipe/diet/size,ingredient/state,packaging,coldchain/galley service and food/cooking-oil/stock loss requires native quantities/identities and source/receiver. Complete meal/provider OR matching ingredient/foreground coverage,never both. No assumed meal rate or food composition. Unknown actual menu or burden scope blocks completion."
      evidence: "cp_food"
    - id: actual_hotel
      applies_to: "purchased_cabin_night;purchased_laundered_linen;tap_water;detergent"
      requirement: "Complete actual accommodation/class/occupancy/hours/nights,linen manufacture/replacement/laundry,housekeeping,HVAChotwater,refrigeration,toiletries,pools and support at real native gates. Purchased full accommodation/laundry replaces exactly covered local material/energy/waste/capital; owned internal service is not purchased again. Missing actual quantities or coverage blocks use."
      evidence: "cp_hotel;cp_water;cp_support"
    - id: actual_included_services
      applies_to: "purchased_musical_performance;port_support_ac"
      requirement: "Identify every actual included recreation/entertainment,shore excursion,guide,air/ground connection,port/terminal/berth,safety/accessibility and attributable crew support as independently specified native service/inputs. Never delete included items or equate fees with activities. Each provider/local coverage cell has one owner; unknown inclusion/quantity/scope blocks completion."
      evidence: "cp_support;cp_packages"
    - id: actual_water_fates
      applies_to: "tap_water;held_blackwater;collected_bilgewater"
      requirement: "Expand every actual water quality/withdrawal/desalination/receiver,greywater,blackwater,bilge,ballast,scrubber water,sludge,recovered oil,treatment product and each direct released species separately at measured composition/state/native quantity. Actual mixing needs real physical proof. Held reception waste is not automatically direct water emission or completed treatment; unknown receiver/stock/fate blocks completion."
      evidence: "cp_water;cp_emissions"
    - id: actual_material_assets
      applies_to: "cruise_ship_supply;r134a_supply;detergent"
      requirement: "Every actual ship/component,marine/hotel/port/shorepower asset,original/replacement battery or equipment,chemical/refrigerant/lubricant/antifoul/spare needs concrete native identity/amount/gate and exclusive provider phase. Complete same-asset positive all-user lifetime evidence and missing operation,maintenance/drydock and retirement; no double original/components or manufacture/full-life service."
      evidence: "cp_assets;cp_maintenance"
    - id: actual_waste_species
      applies_to: "spent_oil;galley_food_residue;co2_fossil;ch4_fossil;n2o;pm25;r134a_air"
      requirement: "Each actual solid/liquid waste,food,cooking oil,packaging/plastic,filter,ash,retired asset/component and actual species/source/medium/subcompartment requires a distinct concrete exchange,wet/native chemical amount and receiver/fate. No unrelated wastes merged,PM-size/provider/wholecomponent overlap,automatic recycling/discharge credit or missing-as-zero. Retain known air specificity rather than unspecified default."
      evidence: "cp_food;cp_water;cp_maintenance;cp_emissions;cp_assets"
    - id: atomic_completion
      applies_to: "all inventory rows"
      requirement: "Each actual expansion must carry unique row_id,one actual process parent,direction/type,concrete verified UUID or registered unresolved identity,native property/unit and real amount,source/provider/recipient gate and valid same-parent CP linked to its triggering requirement_id. Actual nonuse or provider inclusion needs affirmative proof. No unresolved actual required identity/quantity/coverage/fate may be used as a complete downstream result."
      evidence: "all declared collection protocols"
    - id: native_package_provider_and_payload
      applies_to: "sea_cruise_package"
      requirement: "For each actual native provider require q_u, real compatible A_u and causal share before one/N; full-reference equivalence only when actual full function/quality/time/boundary matches. Keep covered hotel/galley/laundry/shipcare/assets/fates exclusive and missing phases complete. Transported passengers/luggage/private vehicles/animals are not automatically manufactured/reared assets; actual supplied provisions/handling/care remain. Each actual alternative source/ship/ingredient/formulation/package/hotel/recreation/sanitary/waste/species needs native amount/source/receiver and unique atomic expansion,not a plural food or waste card."
      evidence: "cp_packages;cp_energy;cp_hotel;cp_food;cp_water;cp_support;cp_maintenance;cp_assets;cp_emissions"
    - id: actual_marine_recreation_and_acceptance
      applies_to: "sea_cruise_package"
      requirement: "Actual marine route/waterbody/ports and known receiving air/water/soil/port-treatment media remain specific; no inland default or automatic all-outlets-sea assumption. Complete intrinsic recreation/entertainment functions/programme/venue/quality/time/audience/personnel/equipment/energy/assets/wastes and native provider A_u/coverage. Keep original promised and actual delivered/changed/accepted package distinct, internal legs/events not final outputs, and actual deviations/failed resources visible. Every actual unrepresented programme/material/provider/species/fate uses its own atomic row/native quantity and same-parent protocol, not plural recreation/food/waste collectors."
      evidence: "cp_packages;cp_support;cp_energy;cp_hotel;cp_food;cp_water;cp_maintenance;cp_assets;cp_emissions"
validation_rules:
  - rule_id: package_reference
    applies_to: "sea_cruise_package"
    rule: "Reference is1Item(s) actual completed one-person integrated package. Match actual itinerary,cabin/accommodation duration/nights,dining and entertainment/other inclusions,acceptance and positive compatible N; reject automatic ticket,shipleg,roomnight,meal,berth or capacity equivalents."
