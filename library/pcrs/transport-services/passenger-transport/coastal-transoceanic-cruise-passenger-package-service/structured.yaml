      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_package | sea_cruise_package | Subdivide dedicated passenger/package/class/provider resources first. One completed person package is final output; ship legs,cabin-nights,meals and performances actually included are constituents,not additional final co-products. Independent actual cargo,optional dining,rooms,shore services or energy outputs need separate function/gates. |  |\n| shared_pools | sea_cruise_package | Allocate residual common resources by demonstrated actual causal drivers across all products/users and period. Submeter hotel/galley/propulsion where possible. Cabin area-time,actual occupied exposure or measured resource use may apply only with physical support. Berths,maximum capacity,assumed double occupancy,ticket prices and equal voyage fractions are not defaults; passenger-distance and tonne-distance cannot be added. | ghg-product-standard-2011 |\n| crew_and_empty | sea_cruise_package | Operating crew and performers are roles with actual attributable support,not extra passenger-package outputs. Retain standby,port hotel load,empty/repositioning,tests,partial/failed voyages and unfulfilled demand in evidenced pools. N=0 has no finite package intensity and does not delete the numerator. |  |\n| asset_lifetime | sea_cruise_package | For each actual ship/component,attributed manufacture=actual delivered native quantity times studied compatible duty/positive documented same-asset all-user complete-life duty; then divide once by completed passenger-package N. Match numerator/lifetime to the same physical asset and compatible use; include all cruise and other actual users. Manufacture only; forecasts/uncertainty disclosed,not annual purchases,depreciation or berth occupancy as life. |  |\n| recovery | sea_cruise_package | Track actual reused products,collected wastes,treatment and external energy output separately with one declared method and receiver. Do not claim both whole/component retirement or provider/foreground treatment. No automatic avoided virgin material,grid,fertilizer or travel credit. |  |\n\n"
