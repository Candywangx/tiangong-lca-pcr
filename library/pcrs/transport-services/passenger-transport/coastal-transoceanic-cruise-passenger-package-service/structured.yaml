      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual complete supplied cruise package and native provider/owned activity gates |\n| starting_condition_role | Collection/coverage interface,not zero upstream or historical asset burden |\n| product_classification_scope | Full actual64232 coastal/transoceanic all-inclusive sea cruise transport/accommodation/food/recreation/entertainment, with actual marine route/itinerary/acceptance; not inland or standalone sightseeing/conveyance function |\n| recursive_input_rule | Same-function purchased complete package replaces exact included constituents;expand missing cells only,no extra final output |\n| upstream_dataset_requirement | Actual native function/quantity,technology,quality,geography,period,lifecycle and provider coverage compatible;missing phases mandatory |\n| disclosure | actual provider and fulfilled cruise-package function; actual coastal/transoceanic marine route/waterbody and ports; actual itinerary and embarkation/completion gate; accommodation hours and nights; cabin/class/quality and actual occupancy; actual passenger and crew roles; actual transport/food/recreation/entertainment and other inclusions; connections/excursions; actual ship/propulsion/carriers/native gates; completed package cohort/period; provider coverage; empty/partial/failed duties; all-user asset lifetime and causal drivers; species/composition/receivers and fates |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| package_function | sea_cruise_package | Start from actual complete supplied sea-cruise transport/accommodation/food/recreation/entertainment with original promise, actual itinerary/marine route/ports/embarkation/acceptance and all real included functions/connections. Separate a sea-cruise product from a larger holiday only at evidenced gates; do not delete supplied air/ground/shore/hotel/recreation contents. Internal sailing legs/rooms/meals/events are constituents, not extra final co-products. | unsd-cruise-2025 |\n| provider_ownership | sea_cruise_package | Assign each activity, phase, ship, space, native provider and period one owner. Native provider intensity q_u first multiplies actual compatible demand A_u and evidenced cohort/all-user share, then /positive N once. A cabin-night, meal serving, dry-linen kg, performance, vessel-hour or transport distance is not a passenger-package equivalent. Only a result already exactly equivalent to one whole declared passenger package needs no further normalization. Purchased complete package/hotel/catering/laundry/excursion/repair/treatment results replace exact included fuel/energy/material/asset/waste/emission cells; missing phases expand once. Owned galley/hotel/internal transfer is not another external purchase. | ghg-product-standard-2011 |\n| energy_chain | sea_cruise_package | Collect each actual marine fuel/grade,shore interface and propulsion/hotel/galley/auxiliary source. Whole supplied blend plus composition/origin ledger OR actual components replacing matching blend coverage are exclusive. Supply,net withdrawal,burn,spill,recovery and stock/transfer differ. Onboard generated electricity/heat,storage/regeneration and recovered heat inside the same boundary are not extra external supply. Exports need actual identity/native quantity/ownership and no second avoided-energy credit. | imo-marine-fuel-lca-2024 |\n| hotel_food_support | sea_cruise_package | Complete all actual accommodation/housekeeping/linen,toiletries,food/drinks and recipe/stock losses,galley cold-chain,HVAChotwater,pools/recreation/performances,crew work support,safety and accessibility at actual service quality. Provider/ingredient and original/replacement equipment coverage are exclusive. No generic nutritional,labor-food,meal,hotel-night or room-occupancy factor is inferred. |  |\n| water_fates | sea_cruise_package | Separate each actual supplied water quality, abstraction/desalination/treatment, storage/reuse, evaporation, held sewage, greywater, oily bilge, ballast/scrubber water and direct substance/receiver. Sea cruising does not make every outlet seawater: preserve known marine, freshwater, port sewer/treatment, soil or other medium/subcompartment. Water use is not wastewater; held reception waste is not direct discharge or proof of completed treatment. Real mixing/treatment/collection/downstream ownership require native records. Dated IMO descriptions are not actual jurisdictional discharge permission, quantities or prohibition-as-zero; known receiving state is not collapsed to generic sea. | imo-ship-sewage; imo-ship-pollution |\n| assets_and_fates | sea_cruise_package | Ship/component delivery cards cover verified manufacturing/supply only. Compatible same-asset whole-life duty allocates actual native manufacture quantity; it never creates a full-life cruise service. Complete uncovered operation,hotel fit-out,original/replacement battery/equipment,port/terminal/shorepower,repair/drydock/antifouling and retirement. Whole asset/components and recovered-product/waste/treatment stages must not overlap. |  |\n| transported_payload | sea_cruise_package | Passenger/crew bodies and transported luggage, private vehicles or accompanying animals are not automatically newly manufactured, bred/reared or lifetime-allocated production inputs just because carried. Preserve their actual transport demand and included handling/stowage/safety/cleaning/food/water/care provisions with native quantities and correct role/coverage. Operator-supplied transport/hotel/recreation equipment has its own actual asset responsibility; actual production/propulsion animals, if any, have their actual separate working/care function and are not confused with accompanying payload. |  |\n| native_ship_and_hotel_sources | sea_cruise_package | Record each actual propulsion/shaft/thruster/source/converter and shipshore interface, operating mode, steering/manoeuvring/current/route/load, port hotel and auxiliary demand, crew, empty/standby/test/repositioning/recovery and complete all-user pool. Electric/battery/fuel-cell/combustion/steam/renewable or other actual sources retain native fuel/oxidizer/reagent, charge/discharge/storage/conversion losses, cooling and direct chemical/wear/water fates. Internal generation/steam/heat/recovery is not an additional purchased product. Whole initial equipment/charge already included in manufacture and independent supply cannot overlap. Separately modelled initial long-term charge/store not included in whole supply uses its actual delivered stock and compatible same-asset life/retained-recovery attribution; period topup/use/loss/fate is distinct and internal circulation/recondensation is not new consumption. Source-specific evidence replaces neither full package scope nor actual ship data; no generic road diesel, assumed marine carbon/nonCO2 or nominal capacity factor. | imo-marine-fuel-lca-2024 |\n| promised_delivered_acceptance | sea_cruise_package | Keep original contract/offer and actual delivered itinerary, accommodation, dining, recreation/entertainment and included transfer/shore quality/time. Record deviations/substitutions/cancellation, acceptance criteria and documented actual variation responsibility. Do not rewrite away unfulfilled promised functions after failure to create full completion. A genuine independently agreed different/shortened fulfilled product has its own explicit scope/strata; preserve original deviation and all causally attributable support/failed resources. No default safety/weather/port-change fraction or legal waiver is inferred. |  |\n| recreation_entertainment_native | sea_cruise_package | Identify actual supplied recreation and entertainment functions, programme/venue/duration/quality/audience/provider and each required performer/activity/equipment/material/energy/capital/fate responsibility. These are intrinsic package contents, not optional by default or extra passenger-package outputs. Actual theatre/music/cinema/sports/pool/other examples do not imply every cruise supplies each. A native whole-performance, venue-hour, participant activity or equipment provider must use real compatible A_u and evidenced cohort/all-user share before/N, not a fee or guessed attendee/event/package equivalent. Complete external coverage replaces exact included performer travel/support, equipment/lighting/AV/venue energy/material/life/waste cells; owned activities expand actual inputs without internal purchase duplication. | po-cruise-inclusions |\n\n"
