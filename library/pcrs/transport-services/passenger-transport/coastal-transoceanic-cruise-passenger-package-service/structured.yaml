      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| package_reference | sea_cruise_package | Reference is1Item(s) actual completed one-person integrated package. Match actual itinerary,cabin/accommodation duration/nights,dining and entertainment/other inclusions,acceptance and positive compatible N; reject automatic ticket,shipleg,roomnight,meal,berth or capacity equivalents. |  |\n| included_scope | sea_cruise_package | All actual supplied sea-package transport/accommodation/food/recreation/entertainment and other included connections/excursions remain owned once. Internal legs/rooms/meals/events are constituents, not package co-products. Original promise/delivered change/acceptance and partial/failed duty remain evidenced; independent optional products require real separate gates. No fuel/ship/identity/data gap shrinks full coastal/transoceanic scope; exact dedicated classification does not imply foreground completeness. |  |\n| physical_closure | sea_cruise_package | Reconcile supply/stock/burn/spill/recovery,wholeblend/component exclusivity,internal generation/heat/shore/import/export,actual food/linen/water/refrigerant native balances,wastes/species and known receivers. No guessed density,meal rate,occupancy,life or generic factor. |  |\n| provider_and_assets | sea_cruise_package | Each provider/owned stage appears once. Preserve prepared-meal,cabin-night,performance and dry-linen native functions,manufacture-only asset gate and positive same-asset all-user life. Missing phases complete independently; avoid original/replacement/wholecomponent duplication. |  |\n| zero_and_failure | sea_cruise_package | Retain actual empty/repositioned/standby/porthotel/test/partial/failed resource pools with matched period and all-user drivers;N=0 has no finite package intensity. Adult/child/crew,cabin occupancy and class records remain actual,not assumed. |  |\n| atomic_projection | sea_cruise_package | Every CP process_id equals one existing processInventory.id and each card CP exists at its own parent. Bilingual rule/native/source fields and projection fingerprints match. Unresolved identities/quantity/source/coverage/fates block complete downstream use;checker pass is not external identity verification or publication approval. |  |\n\n"
