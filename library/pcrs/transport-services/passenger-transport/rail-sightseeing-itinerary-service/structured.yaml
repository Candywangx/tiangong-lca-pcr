  data_quality_requirements:
    - id: actual_completion
      applies_to: "rail_sightseeing_service"
      requirement: "Require actual sightseeing purpose, whole itinerary/quality/class/duration, participant roles and completion evidence with N>0. Tickets/day passes, nominal capacity or a supplied regional-rail leg are not completion."
      evidence: "cp_completion"
    - id: bundle_contents
      applies_to: "rail_sightseeing_service"
      requirement: "Resolve each actual included interpretation/guide/observation/stop/food/drink/accompanying service. Expand every real ingredient/formulation, packaging, energy, cleaning and fate independently with native quantity/process/direction/type/identity/protocol/source/gate. Unknown included content blocks use; never add a generic meal or guide default."
      evidence: "cp_bundle"
    - id: actual_traction
      applies_to: "rail_sightseeing_service"
      requirement: "Identify every actual qualifying railway support/propulsion/work/care configuration and each source/grade. Non-coal steam fuel, ignition/auxiliary fuels, actual DC/charging/batteries/hybrids/H2 or other technologies require separately supported native identities/quantities/coverage before use. Do not force all technologies everywhere or adopt a universal electric/steam/diesel factor."
      evidence: "cp_energy; cp_boiler"
    - id: steam_closure
      applies_to: "rail_sightseeing_service"
      requirement: "For real steam duty require stock-adjusted fuel and actual burned activity, received moisture/ash/carbon/sulfur bases, water/steam/condensate/blowdown, captured residues/unburned carbon and actual release controls. Every real additional water-treatment chemical, fuel, recovered stream and source/medium is row-addressably expanded; unexplained deficits and missing data are not emissions or zero."
      evidence: "cp_boiler; cp_emissions"
    - id: full_assets
      applies_to: "rail_sightseeing_service"
      requirement: "Complete all actual rolling stock/boilers/tenders/observation fittings, track/sleepers/ballast/structures/signals/stations/depot/land and relevant restoration/refit/build/renewal/retirement coverage. Examples are not the complete register. Each actual specific assembly/material/provider needs compatible native quantities and same-asset all-user life evidence."
      evidence: "cp_assets"
    - id: other_materials_fates
      applies_to: "rail_sightseeing_service"
      requirement: "Expand every actual lubricant/grease/chemical/refrigerant/battery/part, sanitary/food/cleaning waste, treatment, direct substance/particle size and air/water/soil/noise/land-related exchange with independently supported native identity and receiver. Uncharacterized releases and LCIA gaps are disclosed; no umbrella waste/emission or default zero."
      evidence: "cp_maintenance; cp_emissions; cp_support"
    - id: provider_coverage
      applies_to: "rail_sightseeing_service"
      requirement: "Each actual purchased operation/rail-leg/guide/food/site/maintenance/manufacture/treatment result must have specific native output quantity, compatibility, stage boundaries and covered cells. Match leg-to-tour participants explicitly and replace only identical covered foreground exchanges. Unknown provider scope blocks complete use."
      evidence: "cp_bundle; cp_assets"
