      requirement: "For an actual rail-guided cable/rack or coupled mechanism establish its supplied sightseeing function separately from ordinary cable transport. Record the whole coupled route,directions,carriages/counterweights/loads,rope/winding/drive/brake/control,station/standby/rescue/test/empty operation and actual gross source energy across all users. A shared drive is not charged independently once per carriage,direction or participant. No nominal power,mgh,load proportion or assumed regenerative credit supplies energy. Rope/guide/support/contact/rack/gear lubrication/wear,construction and original/replacement phases have real native identities and cycles;whole installed systems and contained components are exclusive. Actual external export has one gate/owner without another avoided-energy credit. Separate actual wheel/rack/tyre contact,linear primary-coil/reaction-plate and electromagnetic/superconducting support/propulsion/guidance,low-speed/emergency contact,power electronics and cooling. Meter complete actual duty including stationary levitation and auxiliaries where applicable;no stopped/coasting or noncontact=zero-energy/wear assumption. Inductive guidance does not invent a second external power supply;persistent magnet current does not erase refrigeration/control. Cryostat original firstfill not included in whole manufacture is long-term delivered inventory allocated by compatible same-asset cohort duty/positive complete-life all-user duty then/N,with retention/recovery/fate closure. Actual period top-up is attributed from stock/use/fates;circulation,recondensation,pure transfer and retained stock are not fresh consumption. Other actual coolants/cryogen-free designs require real evidence,not universalhelium. Technical cases/test projects do not establish actual eligible sightseeing output."
