      applies_to: "rail_sightseeing_service"
      requirement: "Verify every actual exchange identity/property/unit/gate and actual quantity evidence. Unresolved concrete cards and missing generic ranges are explicit candidate gaps, not substitutes for complete actual inventory, zeros or invented values. Disclose sampling, duty-allocation, future life, provider and characterization uncertainty."
      evidence: "cp_completion; cp_assets; cp_emissions"
    - id: native_human_completion
      applies_to: "rail_sightseeing_service"
