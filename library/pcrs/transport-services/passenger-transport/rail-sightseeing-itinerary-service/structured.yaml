allocation_rules:
  - rule_id: subdivide_and_share
    applies_to: "rail_sightseeing_service"
    rule: "Subdivide dedicated tour/class/provider and separately sold outputs first. For unavoidable shared train/support duty use evidenced compatible physical/activity drivers with all actual users; seats, fares or booked persons are not default shares. Do not add people, cargo mass, meal counts and money as dimensionally equivalent outputs."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_life
    applies_to: "rail_sightseeing_service"
    rule: "Same-asset delivered manufacturing quantity times actual cohort duty/positive compatible complete-life all-user duty, then/N. Complete initial assets and included components cannot duplicate; restoration/refit, renewals and retirement retain actual separate coverage. Age and financial depreciation are not physical duty."
    source_ids:
      - ghg-product-2011
  - rule_id: completed_cohort
    applies_to: "rail_sightseeing_service"
    rule: "All constituent movements of a single sightseeing itinerary serve the same participant output. Actual independently fulfilled changed/partial tours, ordinary transport, freight, museum or food outputs need real distinct product boundaries and causal coverage shares. No output is fabricated for idle/empty operation."
    source_ids:
      - ghg-product-2011
  - rule_id: recovery
    applies_to: "rail_sightseeing_service"
    rule: "Record actual physical recovered products/wastes and destinations. Internal recovered energy/water/material is not a second virgin purchase or external product. Apply one disclosed recycling/allocation method without assumed avoided commute/grid/virgin material credits."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_completion
      process_id: "rail_sightseeing_service"
      flow_role: "completed_sightseeing"
      record_type: "participant_itinerary_fulfilment"
      raw_fields: "itinerary_id; actual_participant_id; whole_rail_sequence; observation_interpretation_quality; class; boarding_alighting; included_stops; agreed_start_end; actual_duration; completion_acceptance; pass_ticket_reconciliation; no_show; altered_partial; cohort_N; period"
      collection_method: "Define the actual sightseeing service before counting: agreed itinerary, observation/interpretation quality, required rail segments/stops and included content. Reconcile actual attendance and whole-service fulfilment, counting one real participant once per independently fulfilled itinerary, including actual non-paying participants where served. Reboarding/return legs inside one tour do not create additional tours. Pass validity/price or booked capacity is not completion. Disclose materially changed or partial products separately; preserve their actual duties and causal allocation."
      unit: "Item(s); actual route/time"
      frequency: "each actual duty and period/life interface"
      temporal_coverage: "complete cohort/period and necessary all-life records"
      site_scope: "all actual train/tour/site/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual contracts/logs/calibration/balances/coverage and uncertainty"
    - protocol_id: cp_energy
      process_id: "rail_sightseeing_service"
      flow_role: "traction_ac; diesel_supply; export_ac"
      record_type: "actual_train_duty_energy_stock"
      raw_fields: "train_id; consist; actual_technology; actual_segment_distance; persons_by_segment_and_role; all_user_duty; gross_AC; export_AC; internal_recovery_storage_loss; diesel_supply_stock_withdrawal_burn_spill_recovery_transfer; blend_origin; positioning_shunting_start_idling_heat; failed_cancelled; provider_gate"
      collection_method: "Measure actual train and supporting duties over the complete attribution period: empty positioning/shunting, starts, layover/heating, auxiliary loads, failed/cancelled duty and actual standby. Separate train-distance, person-distance and whole-tour N. Allocate complete shared train duties before/N with evidenced all-user drivers; never infer occupancy from seats. Net fuel withdrawal=opening+receipts-closing-returns; reconcile burn/spill/recovery/transfer independently. Use whole compatible blend+origin ledger OR replacing components, never both. Internal generated/recovered power is not another purchase; gross external import/export owns losses once."
      unit: "MJ; actual kWh; kg; actual distance/time"
      frequency: "each actual duty and period/life interface"
      temporal_coverage: "complete cohort/period and necessary all-life records"
      site_scope: "all actual train/tour/site/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual contracts/logs/calibration/balances/coverage and uncertainty"
    - protocol_id: cp_boiler
      process_id: "rail_sightseeing_service"
      flow_role: "bituminous_coal; boiler_tap_water; coal_bottom_ash; coal_fly_ash; boiler_blowdown; steam_water_air"
      record_type: "actual_steam_boiler_fuel_water_residue_balance"
      raw_fields: "locomotive_boiler_id; firing_state; startup_warm_standby; actual_fuel_rank_blend; received_moisture_ash_C_S_heating_basis; actual_burned; ignition_fuel; supplied_water_treatment; tank_boiler_stock; condensate; steam_release; leakage; blowdown_composition; bottom_fly_ash_unburned_carbon; controls; native_mass; receiver; actual_alluser_duty"
      collection_method: "For actual steam routes retain cold/warm starts, firing, hot standby, auxiliary or ignition fuels, and boiler/steam cycle evidence. Independently meter/weigh fuel, make-up water, ash collections and blowdown; reconcile actual moisture, carbon/ash/sulfur, boiler/tank stocks, steam/condensate and recovered/liquid fates without forcing unexplained residuals to emissions. Water supply is not automatically steam emission; coal issue is not coal burned or fully oxidized. Captured fly ash and bottom residue stay separate from airborne species. Chemical treatment/other water/fuel types require exact separate expansion. Attribute each actual native quantity then/N."
      unit: "kg of each actual fuel/water/stream/species; supported native units"
      frequency: "each actual duty and period/life interface"
      temporal_coverage: "complete cohort/period and necessary all-life records"
      site_scope: "all actual train/tour/site/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual contracts/logs/calibration/balances/coverage and uncertainty"
    - protocol_id: cp_support
      process_id: "rail_sightseeing_service"
      flow_role: "site_ac"
      record_type: "actual_tour_site_task_provider"
      raw_fields: "station_depot_visitor_site; observation_guide_audio_equipment; task_native_meter_quantity; heating_cooling_cleaning; access_stops; allusers; coverage_cells; actual_shares"
      collection_method: "Collect actual station/depot, observation, interpretation, visitor and stop-support duties and physical supplies. Subdivide dedicated tasks, then allocate measured shared residual by justified compatible all-user drivers; crew/guides/servers are support roles, not participant outputs. Do not omit supplied interpretation merely because transport provider covers traction, or charge an entire independent museum/holiday to this itinerary. Attribute actual native quantities/N."
      unit: "actual task/native material/energy/provider units"
      frequency: "each actual duty and period/life interface"
      temporal_coverage: "complete cohort/period and necessary all-life records"
      site_scope: "all actual train/tour/site/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual contracts/logs/calibration/balances/coverage and uncertainty"
    - protocol_id: cp_maintenance
      process_id: "rail_sightseeing_service"
      flow_role: "spent_mineral_oil; wash_wastewater"
      record_type: "actual_rail_component_formulation_fate"
      raw_fields: "asset_task_id; new_oil_grease_chemical_refrigerant; actual_formulation_native_quantity; stock_reuse_recovery; rail_wheel_brake_wear; collected_water_residues; actual_species_medium; receiver; outsourcing_coverage"
      collection_method: "Retain actual maintenance/restoration/cleaning records and independent component/fluid balances. Identify each real new oil/grease/chemical/coolant/refrigerant/part and physical residue/release by exact state, native quantity and receiver. Oil issue is neither emitted oil nor generated spent oil. Wastes, captured wear, direct emissions and treatment results remain different. An inclusive outsourced maintenance result replaces only its verified covered supplies/tasks/fates once. Divide attributed quantities by N."
      unit: "kg; actual part/task native units"
      frequency: "each actual duty and period/life interface"
      temporal_coverage: "complete cohort/period and necessary all-life records"
      site_scope: "all actual train/tour/site/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual contracts/logs/calibration/balances/coverage and uncertainty"
    - protocol_id: cp_assets
      process_id: "rail_sightseeing_service"
      flow_role: "steel_passenger_coach; coal_steam_locomotive; finished_steel_rail"
      record_type: "same_asset_complete_life_supply"
      raw_fields: "asset_id; actual_technology_assembly; native_delivered_quantity; initial_component_inclusion; manufacture_restoration_refit_renewal; installation; all_life_duty_users_periods; cohort_duty; museum_otheruse; reuse_relocation; retirement_provider; uncertainty; actualanimal_species_priorrearing_currentcare; work_rest_alluserlife; nativecoupledrope_drive_contact_cooling; original_vsreplacement_phase"
      collection_method: "Build the complete real rolling-stock/boiler/tender/track/station/depot/observation-support register, not only example cards. Allocate each supplied manufacture quantity by cohort duty/positive compatible same-asset complete-life all-user duty, then/N. Include actual prior/future uses, museum/other functions and restoration/refit/renewal events with disclosed projected-duty uncertainty. A delivered manufacturing UUID covers only its actual supply gate; lifetime is an allocation basis, not whole-life tour coverage. Complete initial assemblies and their included components are exclusive. Independently add uncovered installation, operation, maintenance, restoration, replacements and retirement/treatment once. For animals,delivered/reared native head quantity covers only proved pre-service stages;same-body complete-life alluser compatible duty allocates that phase while actual work/rest/currentfeed/care/retirement remain separately owned. Do not convert a biological body into manufactured machinery or double inclusive rearing/care."
      unit: "Item(s); kg; compatible actual useful-duty units"
      frequency: "each actual duty and period/life interface"
      temporal_coverage: "complete cohort/period and necessary all-life records"
      site_scope: "all actual train/tour/site/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual contracts/logs/calibration/balances/coverage and uncertainty"
    - protocol_id: cp_emissions
      process_id: "rail_sightseeing_service"
      flow_role: "fossil_co2_air; fossil_ch4_air; n2o_air; pm25_air; so2_air"
      record_type: "source_specific_substance_medium_record"
      raw_fields: "source_id; actual_rail_boiler_engine_support; activity_burn; technology_controls; measured_species; model_source_version_unit; carbon_sulfur_nitrogen_basis; size_fraction_overlap; compartment; uncertainty"
      collection_method: "Use actual monitoring or fully supported source/technology/activity-specific emission methods; retain exact substance mass/origin, particle size and receiving subcompartment. Steam boiler, diesel engine, auxiliary and upstream/provider sources differ. Do not transplant diesel factors to coal steam, kgN to kgN2O, kgS to kgSO2, CO2e to species or all fuel carbon to oxidized CO2. Captured ash/wear and other media are separate; missing emissions or LCIA characterization are not zero. Attribute non-overlapping native species/N."
      unit: "kg of each actual substance/size/medium"
      frequency: "each actual duty and period/life interface"
      temporal_coverage: "complete cohort/period and necessary all-life records"
      site_scope: "all actual train/tour/site/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual contracts/logs/calibration/balances/coverage and uncertainty"
    - protocol_id: cp_bundle
      process_id: "rail_sightseeing_service"
      flow_role: "completed_sightseeing"
      record_type: "actual_sightseeing_bundle_and_rail_provider"
      raw_fields: "actual_contract_and_fulfilment; observation_interpretation_quality; guides_audio_stops; included_food_drink_actual_recipe; actual_ingredient_packaging_energy_waste; provider_native_result_and_coverage; separatelysold_products; actual_leg_to_participant_mapping; duplicate_cells"
      collection_method: "Resolve the actually delivered sightseeing bundle. Included guides, audio/observation support, stop activities, accompanying services and food/drink require their real atomic supplies/provider results, native quantities and fates; no universal meal/guide-hour recipe is prescribed. Unknown included content blocks complete use. Independently sold meals/other outputs require subdivision and justified residual shares, not omission of their shared train/support burden. For purchased results per rail leg/passenger-distance, multiply by actual compatible supplied legs/distance before cohort attribution/N; only an already equivalent per-tour result avoids another division. Purchased rail-leg/provider results may replace their exact covered duty only with actual segment/count/native-unit mapping to participants; they are not the completed sightseeing output and must not duplicate foreground train energy/assets/emissions or other included providers."
      unit: "actual ingredient/material/provider native units"
      frequency: "each actual duty and period/life interface"
      temporal_coverage: "complete cohort/period and necessary all-life records"
      site_scope: "all actual train/tour/site/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual contracts/logs/calibration/balances/coverage and uncertainty"
    - protocol_id: cp_human
      process_id: "rail_sightseeing_service"
      flow_role: "actualhumandriveandroles"
      record_type: "actual_native_record"
      raw_fields: "function_supplier_participant_operator; actualrailvehicle_assistance; actualroles_work_rest; task_quantity; dedicatedfood_drink_PPE_safety; subsistence_respiration_boundary; actualapplicablephysiology_ifincluded; providercoverage; allusers_share; N"
      collection_method: "For actual human propulsion distinguish who supplies the vehicle,human driving/guidance and assistance,who is a passenger/participant,and the real work/rest/task and provider boundary. A pedal vehicle or self-powered activity does not itself prove passenger-sightseeing function. Record actual dedicated work food/drink,PPE,safety,accessibility and support,and actual electrical assistance/storage if present. Disclose ordinary human subsistence/respiration boundary and sensitivity;do not assert human work/metabolism is zero or invent employee-labour fuel,wage/calorie-to-fossil-fuel factors. If attributable metabolic inputs/releases are included,require independently applicable actual intake/exertion/respiratory mass,origin and receiver evidence without duplicating provider/participant food. Attribute native quantities once to the actual coherent participant cohort then/N;not a generic work/animal/mechanism factor."
      unit: "Actualnativeunits"
      frequency: "eachactualduty/cohort andlifeinterface"
      temporal_coverage: "completealignedperiod/life"
      site_scope: "allactualusers/providers/receivers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Originalactualrecords,nativemethod/phase/receiverclosure anduncertainty"
    - protocol_id: cp_animal
      process_id: "rail_sightseeing_service"
      flow_role: "actualanimalspeciescareandfates"
      record_type: "actual_native_record"
      raw_fields: "species_body_cohort_age; priorrearing_gate; feed_grazing_state_moisture_C_N; water_supply_intake; body_stock_change; work_rest_care_housing_bedding; actualrespiration_enteric_manure_faeces_urine_species_receiver; alluserlife_cohortduty; providerphase; uncertainty; N"
      collection_method: "For every actual animal species and physical cohort collect age/body history,prior rearing/acquisition gate,current feed/grazing/water/care/health/housing/bedding,work/rest/retired support periods and all real users. Examplehorse/hay cards do not cover all species/rations. Prior rearing/delivered-animal and current care/manure phases are exclusive;inclusive providers replace matching phases. Use independently applicable species physiology and actual as-received/wet/dry ration,C/N/moisture,body-stock change and water balance to reconcile respiration,enteric/manure substances,faeces/urine and actual receiver/treatment. Do not apply cattle/equid factors to another species,erase physical respiration through a national netCO2 convention,or create emissions from residuals. Separately collected faeces/urine are not a fictitious mixture;actual co-collected bedding/manure requires its real native composition/row and replaces those same constituents once. Attribute native quantities once to the actual coherent participant cohort then/N;not a generic work/animal/mechanism factor."
      unit: "Actualnativeunits"
      frequency: "eachactualduty/cohort andlifeinterface"
      temporal_coverage: "completealignedperiod/life"
      site_scope: "allactualusers/providers/receivers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Originalactualrecords,nativemethod/phase/receiverclosure anduncertainty"
    - protocol_id: cp_native
      process_id: "rail_sightseeing_service"
      flow_role: "actualcoupledandspecialrailmechanism"
      record_type: "actual_native_record"
      raw_fields: "actualfunction_mechanism; support_propulsion_contact_state; wholecoupledroute_directions_loads_allusers; grosssource_drive_auxiliary_standby_test_rescue; rope_gear_controls_guideway; cooling_cryogen_stock; originalfirstfill_phase; sameasset_lifetime_duty; periodtopup_recovery_vent_retention; providercoverage; receiver; N"
      collection_method: "For an actual rail-guided cable/rack or coupled mechanism establish its supplied sightseeing function separately from ordinary cable transport. Record the whole coupled route,directions,carriages/counterweights/loads,rope/winding/drive/brake/control,station/standby/rescue/test/empty operation and actual gross source energy across all users. A shared drive is not charged independently once per carriage,direction or participant. No nominal power,mgh,load proportion or assumed regenerative credit supplies energy. Rope/guide/support/contact/rack/gear lubrication/wear,construction and original/replacement phases have real native identities and cycles;whole installed systems and contained components are exclusive. Actual external export has one gate/owner without another avoided-energy credit. Separate actual wheel/rack/tyre contact,linear primary-coil/reaction-plate and electromagnetic/superconducting support/propulsion/guidance,low-speed/emergency contact,power electronics and cooling. Meter complete actual duty including stationary levitation and auxiliaries where applicable;no stopped/coasting or noncontact=zero-energy/wear assumption. Inductive guidance does not invent a second external power supply;persistent magnet current does not erase refrigeration/control. Cryostat original firstfill not included in whole manufacture is long-term delivered inventory allocated by compatible same-asset cohort duty/positive complete-life all-user duty then/N,with retention/recovery/fate closure. Actual period top-up is attributed from stock/use/fates;circulation,recondensation,pure transfer and retained stock are not fresh consumption. Other actual coolants/cryogen-free designs require real evidence,not universalhelium. Technical cases/test projects do not establish actual eligible sightseeing output. Attribute native quantities once to the actual coherent participant cohort then/N;not a generic work/animal/mechanism factor."
      unit: "Actualnativeunits"
      frequency: "eachactualduty/cohort andlifeinterface"
      temporal_coverage: "completealignedperiod/life"
      site_scope: "allactualusers/providers/receivers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Originalactualrecords,nativemethod/phase/receiverclosure anduncertainty"
  calculation_rules:
    - id: actual_normalization
      applies_to: "rail_sightseeing_service"
      rule: "Actual attributable native quantity to the cohort with complete justified all-user shares, then divide by positive N once. For a per-leg or per-passenger-distance provider result, first multiply by the actual compatible supplied legs/distance to obtain its cohort quantity, then apply the same N once. A result already per one equivalent completed sightseeing itinerary retains that exact basis without another division. Tickets, fares and offered capacity do not substitute for actual supplied legs/distance."
      inputs:
        - cp_completion
        - cp_energy
        - cp_boiler
        - cp_support
        - cp_maintenance
        - cp_emissions
        - cp_bundle
        - cp_human
        - cp_animal
        - cp_native
      output: "attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: asset_supply
      applies_to: "rail_sightseeing_service"
      rule: "Same-asset actual delivered manufacture quantity times cohort duty/positive compatible complete-life all-user duty, then/N. Lifetime allocates verified manufacture coverage only; uncovered restoration/refit/install/use/replacements/retirement remain independent."
      inputs:
        - cp_assets
      output: "attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: fuel_water_fates
      applies_to: "rail_sightseeing_service"
      rule: "On compatible boundaries reconcile opening+receipts-closing-returns into actual separately evidenced burn/spill/recovery/transfer fates; independently reconcile boiler water/steam/condensate/blowdown and native ash/carbon/sulfur controls. Do not create species from unexplained residuals, stock deficits or default oxidation."
      inputs:
        - cp_boiler
        - cp_energy
        - cp_emissions
      output: "attributed native quantity per reference"
