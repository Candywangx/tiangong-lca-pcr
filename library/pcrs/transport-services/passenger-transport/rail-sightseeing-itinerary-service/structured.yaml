validation_rules:
  - rule_id: function_and_n
    applies_to: "rail_sightseeing_service"
    rule: "Check actual whole participant sightseeing fulfilment, single pure 1 Item(s) reference, positive same-cohort N and aligned itinerary/class/quality/content. No duplicated constituent/return tour counts, staff-as-participant counts or ticket-as-completion assumption."
    source_ids:
      - ghg-product-2011
  - rule_id: native_and_steam
    applies_to: "rail_sightseeing_service"
    rule: "Reconcile actual native energy/fuel/moisture/carbon/sulfur/water/ash stocks, burning and physical fates, full train auxiliary/empty/failed duty, regeneration/storage/loss and all-user shares. Whole fuel versus components exclusive; no automatic withdrawal=burn or feedwater=steam release."
    source_ids:
      - ghg-product-2011
  - rule_id: coverage
    applies_to: "rail_sightseeing_service"
    rule: "Verify complete tour bundle, actual branch/native identities, provider replacement cells, manufacturing-only versus full life scope, capital/restoration/renewal/retirement and independent physical wastes/species/media. Actual mandatory gaps preclude complete-service use."
    source_ids:
      - ghg-product-2011
  - rule_id: comparison
    applies_to: "rail_sightseeing_service"
    rule: "Compare only equivalent actual sightseeing itinerary/duration/observation and interpretation quality, class/content, traction/duty/geography/period and lifecycle boundaries. Equal counts, distances or seats alone cannot establish comparable experiences or universal intensity/advantage."
    source_ids:
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset/background_dataset only after actual identities, coverage and quantitative evidence complete"
  allowed_use: "Actualeligible participantwhole rail sightseeing itinerary/programme,declaredquality/content/completion andallactualnativebranches/provider/lifecycle"
  excluded_use: "Generictransport/technologyfactor;barehire/admission/primaryactiveadventure orwholeunrelatedholiday relabelled;unmodelled actualhuman/animal/cable/otherroute/provider/fates"
  required_metadata: "actual_supplier_participant_operator_responsibility; actual_native_support_propulsion_and_work_care; sightseeing_function; actual_whole_itinerary_and_stops; rail_technology_and_consist; route_distances; duration_period; observation_interpretation_quality; class; actual_included_content; completion_and_N; actual_participant_staff_roles; empty_failed_standby_duty; fuel_and_water_state; boiler_ash_steam_fates; provider_coverage; same_asset_all_user_life; actual_species_medium; geography_and_uncertainty"
  required_quality_disclosure: "All actual/unresolved identities/quantities; full tour and steam/rail/provider/capital/fate coverage; period/alluser life/duty, sampling/model and LCIA gaps"
  update_trigger: "Changed itinerary/experience/class/content/completion, traction/boiler/energy/consist, providers/assets/duty/life or source/medium/fate"
data_sources:
  - id: "unsd-cpc3-sightseeing"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 Explanatory Notes,30June2025,p360–361,64131. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Rail sightseeing classification only; no completed-tour unit, traction coverage, duration or quantity factor prescribed."
  - id: "nps-rail-excursions-2026"
    type: "official_guidance"
    reference: "NPS Steamtown Train Rides, actual public snapshot21October2026, page updated10October2026. https://www.nps.gov/stea/planyourvisit/trainrides.htm"
    used_for: "Actual excursion versus day-valid short-ride ticket and operating-condition distinctions, qualitative case only. No current price/schedule/duration/occupancy or universal service factor adopted."
  - id: "ipcc-rail-2006"
    type: "official_guidance"
    reference: "IPCC 2006 Guidelines, Vol.2 Ch.3, §3.4 introduction, pp.3.39–3.40. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Actual electric/diesel/steam rail source/activity distinction and tourist-steam boiler approach. No numerical emission/deterioration/power factor or claim all historical source prevalence remains current."
  - id: "ipcc-boiler-2006"
    type: "official_guidance"
    reference: "IPCC 2006 Guidelines, Vol.2 Ch.2, §2.1–2.3, pp.2.6–2.11. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_2_Ch2_Stationary_Combustion.pdf"
    used_for: "Source/technology-specific stationary-boiler gas approach and actually burned fuel basis only. No default full oxidation/factors or complete multi-impact steam-tour inventory supplied by this GHG guidance."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard 2011, chapters 7–9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Transparency, actual data and subdivision/physical allocation hierarchy. Complete capital/heritage-restoration/tour-bundle scope and collection formulas are explicit authored PCR choices, not default factors or a capital mandate attributed to the standard."
  - id: "working-equid-context-2021"
    type: "official_guidance"
    reference: "WOAH TerrestrialCode7.12,actual19July2021edition,scope7.12.2 andfeeding/care7.12.6–13. https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/current/chapitre_aw_working_equids.pdf"
    used_for: "Limited working-equid care/feed/water/rest context only. The chapter excludes leisure-only equids;not automatic normative welfare certification or all-species/tour applicability.No ration/life/emissionfactor adopted;actual site/species care evidence mandatory."
