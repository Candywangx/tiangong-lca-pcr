        - ghg-product-2011
    - id: native_work_care_drive
      applies_to: "rail_sightseeing_service"
      rule: "For actual human propulsion distinguish who supplies the vehicle,human driving/guidance and assistance,who is a passenger/participant,and the real work/rest/task and provider boundary. A pedal vehicle or self-powered activity does not itself prove passenger-sightseeing function. Record actual dedicated work food/drink,PPE,safety,accessibility and support,and actual electrical assistance/storage if present. Disclose ordinary human subsistence/respiration boundary and sensitivity;do not assert human work/metabolism is zero or invent employee-labour fuel,wage/calorie-to-fossil-fuel factors. If attributable metabolic inputs/releases are included,require independently applicable actual intake/exertion/respiratory mass,origin and receiver evidence without duplicating provider/participant food. For every actual animal species and physical cohort collect age/body history,prior rearing/acquisition gate,current feed/grazing/water/care/health/housing/bedding,work/rest/retired support periods and all real users. Examplehorse/hay cards do not cover all species/rations. Prior rearing/delivered-animal and current care/manure phases are exclusive;inclusive providers replace matching phases. Use independently applicable species physiology and actual as-received/wet/dry ration,C/N/moisture,body-stock change and water balance to reconcile respiration,enteric/manure substances,faeces/urine and actual receiver/treatment. Do not apply cattle/equid factors to another species,erase physical respiration through a national netCO2 convention,or create emissions from residuals. Separately collected faeces/urine are not a fictitious mixture;actual co-collected bedding/manure requires its real native composition/row and replaces those same constituents once. For an actual rail-guided cable/rack or coupled mechanism establish its supplied sightseeing function separately from ordinary cable transport. Record the whole coupled route,directions,carriages/counterweights/loads,rope/winding/drive/brake/control,station/standby/rescue/test/empty operation and actual gross source energy across all users. A shared drive is not charged independently once per carriage,direction or participant. No nominal power,mgh,load proportion or assumed regenerative credit supplies energy. Rope/guide/support/contact/rack/gear lubrication/wear,construction and original/replacement phases have real native identities and cycles;whole installed systems and contained components are exclusive. Actual external export has one gate/owner without another avoided-energy credit. Separate actual wheel/rack/tyre contact,linear primary-coil/reaction-plate and electromagnetic/superconducting support/propulsion/guidance,low-speed/emergency contact,power electronics and cooling. Meter complete actual duty including stationary levitation and auxiliaries where applicable;no stopped/coasting or noncontact=zero-energy/wear assumption. Inductive guidance does not invent a second external power supply;persistent magnet current does not erase refrigeration/control. Cryostat original firstfill not included in whole manufacture is long-term delivered inventory allocated by compatible same-asset cohort duty/positive complete-life all-user duty then/N,with retention/recovery/fate closure. Actual period top-up is attributed from stock/use/fates;circulation,recondensation,pure transfer and retained stock are not fresh consumption. Other actual coolants/cryogen-free designs require real evidence,not universalhelium. Technical cases/test projects do not establish actual eligible sightseeing output."
