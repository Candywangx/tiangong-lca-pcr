allocation_rules:
  - rule_id: subdivide_then_allocate
    applies_to: "all_processes"
    rule: "Separate dedicated passenger, separately sold vehicle/deck/cargo and other services wherever actual measurements permit. Allocate remaining shared propulsion/hotel/port/capital using supported physical relationships and compatible all-user duty; justify alternatives and sensitivity if no physical relationship is established. Fare/ticket revenue is not a physical allocation driver."
    source_ids:
      - ghg-product-2011
  - rule_id: accompanying_bundle
    applies_to: "programme_delivery"
    rule: "Disclose whether vehicles, luggage, animals, cabin or other inclusions are part of the actual declared sightseeing programme bundle or separately sold outputs. Do not count accompanying objects or their occupants twice; measure actual persons including vehicle occupants once. No universal car-to-person, weight, deck-area or fare equivalence is prescribed. Separate freight cannot disappear as free accompaniment. Every independently sold cargo,vehicle-deck or other product requires its own actual atomic output row with native quantity and all section8 expansion fields; do not force it into the participant-programme Count reference."
    source_ids: []
  - rule_id: segment_person_closure
    applies_to: "programme_delivery;vessel_operation"
    rule: "Use actual programme completion together with onboard segment populations,distances and resource use. Stops,legs,reboarding and transfers do not create repeated completion of the same programme. Attribute jointly used physical segments across actual programme cohorts and other services; do not divide an already per-person provider result again by occupancy."
    source_ids: []
  - rule_id: native_supply_life
    applies_to: "vessel_lifecycle;port_support"
    rule: "For each actual delivered asset/cohort, use native manufacture quantity times attributable same-asset compatible duty / supported total all-user useful duty, then /N. Duty may be justified hours, voyages or other compatible physical use; it is allocation, not a new flow identity. Support all-user denominator, second-hand/refit histories and prospective uncertainty. Period fuel/use emissions are not divided by lifetime duty again."
    source_ids: []
  - rule_id: no_mixed_denominator
    applies_to: "all_processes"
    rule: "Passenger Count, person-distance, vehicle count, occupied area-time and cargo tonne-distance are distinct measures and cannot be summed. Supported engineering/resource models may relate outputs only with explicit dimensions, observations and sensitivity. N=0 yields no finite reference intensity; retain and resolve the causal duty pool, not zero its numerator."
    source_ids: []
  - rule_id: recovery_and_export
    applies_to: "all_processes"
    rule: "Use evidenced waste/product status, receiver and allocation for recovered material/energy. Internal battery discharge, regenerative energy, recirculated water and other transfers are not extra purchased inputs or avoided-product credits. Genuine external export requires a separate native gate, actual quantity and disclosed allocation without netting incompatible imports."
    source_ids: []
  - rule_id: programme_not_leg
    applies_to: "programme_delivery;all_processes"
    rule: "Normalize attributed whole-programme burden by actual completed compatible participant-programmes N once,not each boarding,leg,pass sale,landmark or sighting. Separate incompatible itinerary/quality classes or provide a supported transparent mix; no universal completion/usage distribution. Guide/vessel sessions shared among persons are allocated with actual all-user resource/duty evidence,not purchased once for every participant."
    source_ids: []
  - rule_id: performance_retry_pool
    applies_to: "programme_delivery;all_processes"
    rule: "Declare whether completion supplies an agreed viewing opportunity or fulfilled guaranteed condition. Allocate actual interrupted/unsuccessful/retry/compensatory programme duties to the causally related cohort without erasing them. When attempts jointly satisfy one service obligation,count that completed obligation once; when a genuinely separate completed programme is delivered,record its own compatible function and attribution. Free/replacement tickets do not determine physical zero or an extra fulfilled unit. N=0 remains no finite reference intensity."
    source_ids: []
  - rule_id: all_function_lifecycle
    applies_to: "all_processes"
    rule: "Subdivide actual ordinary transport,sightseeing,events/charters,food/admission/cargo and private/other vessel uses; justify remaining shared hull/propulsion,viewing/guide/shore/equipment and lifecycle shares. Sightseeing slow travel and viewing time are actual duties,not assumed average transport speed. Historical/refitted vessels still require manufacture/restoration/refit/maintenance/retirement ownership and supported all-user life; no zero from age or tourism label."
    source_ids:
      - circleline-fleet
dataset_production:
  collection_protocols:
    - protocol_id: cp_programme
      process_id: "programme_delivery"
      flow_role: "actual completed fixed/flexible participant programmes and closed boat/provider ledger"
      record_type: "actual_record"
      raw_fields: "programme_id;contract_function;fixed_or_flexible;selected_itinerary_rule;quality_class;viewing_opportunity_or_guarantee;actual_performance;participant_id;booking_pass_id;actual_boats_legs_calls_transfers;actual_boardings_reboardings;actual_duration_distance;included_guide_audio_amenities;completion;attempt_retry_obligation;separate_outputs;period;provider_cells"
      collection_method: "Collect actual contracts/programmes and participant fulfilment records,not just sales/boardings. Declare reproducible fixed/flexible grouping and actual itinerary/performance quality; link every boat/leg/guide/amenity and its owner. Preserve unsuccessful/interrupted/retry and separate completed obligations; observe pass use without assumed trips or wildlife success. Count participant-programme completion once across internal legs/transfers. Aggregation algorithm: N=sum actual completed compatible participant-programme obligations in the declared cohort. Multiple attempts fulfilling one obligation contribute all duties but one completion; distinct delivered programmes retain their own compatible attribution. Require N>0; no ticket/pass/boarding/leg/sighting substitution."
      unit: "Item(s);kg;tonne-km;km;hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "actual agreed water sightseeing programme and all associated physical/provider/attempt duties"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_operation
      process_id: "vessel_operation"
      flow_role: "actual energy,water and consumable supplies and all duties"
      record_type: "actual_record"
      raw_fields: "vessel;architecture;engine_motor;lift_thrust_foil_control;mode_periods;tow_rope_shore_drive_owners;fuel_grade;blend;carbon_origins;opening_stock;receipts;closing_stock;burned;leaked;recovered;shore_gate_ac_dc;gross_import;conversion_losses;battery_soc;water_stocks;other_supply;provider_cells;all_user_share;programme_leg_links;viewing_loiter_photo_wildlife_approach;failed_retry_duty;other_fleet_functions"
      collection_method: "Obtain bunker/meter/tank/duty records and actual measured configuration. Reconcile voyage,hotel,empty,failed,charging and architecture-specific lift/transition/shore approach duties. Identify each actual fuel,water,chemical and supplied energy gate; distinguish supply,combustion,loss,recovery and stock. A whole blend with composition ledger OR replacement component supplies requires mass and provider closure, never both. Reconcile AC/DC charge boundaries and storage/charger losses; internal battery/discharge/regen is no new external supply. Record actual sightseeing detours/slow/loiter/approach and programme leg/attempt links; ordinary transport averages are not default sightseeing activity. Actual different propulsion/boiler/shore or nonmotorised configurations require their real input/duty interfaces and evidence; do not force marine distillate or assume all absent fuel rows mean zero lifecycle. Aggregation algorithm: For each actual native period quantity Q, attribute compatible duty/all-user share a to the cohort and compute sum(Q*a)/N once. Fuel activity is reconciled burned mass, not unreconciled purchase; external energy gate chosen exclusively."
      unit: "kg;kWh;m3;hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "owned/uncovered onboard supply and actual all-user duties"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_air
      process_id: "vessel_operation"
      flow_role: "actual separately identified airborne species"
      record_type: "actual_record"
      raw_fields: "vessel;fuel;carbon_origin;engine;load;aftertreatment;duty;burned_activity;monitoring_or_model;factor_basis;source_context;species_mass;air_subcompartment;refrigerant_charge;topup;recovery;stocks;provider_cells;uncertainty"
      collection_method: "Collect actual species monitoring or independently supported fuel/engine/load/mode-compatible models, including actual lift/propulsion/hotel generators. Separate chemical/carbon/nitrogen bases and receiving compartment. Fuel-LCA GHG-only scope cannot remove other actual species. Determine each refrigerant actual charge/recovery balance; separately expand actual NO/NO2,SO2,CO,NMVOC components,particle sizes,biogenic CH4 and other releases as required,not one NOx/SOx collector identity. Aggregation algorithm: Assign actual molecule/species mass to the cohort using the matching duty share; /N once. Model q=sum compatible burned_activity*evidenced_species_factor, preserving actual factor units/conversion and uncertainty; no generic factor supplied."
      unit: "kg"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "owned/uncovered actual airborne release at actual subcompartment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_residues
      process_id: "onboard_residues"
      flow_role: "actual separately identified wastes and water/material fates"
      record_type: "actual_record"
      raw_fields: "vessel;stream_id;origin;composition;moisture;phase;mass_volume;density_basis;generated;stocks;onboard_treatment;recovery;handover;receiver;transport_treatment_coverage;direct_species_release;receiving_waterbody_subcompartment;ballast;coating;skirt_or_foil_residues;uncertainty"
      collection_method: "Use actual tank,maintenance,water,chemical and reception records. Keep bilge,blackwater,graywater,combined sewage,scrubber washwater/sludge,ballast intake/discharge/sediment,food/other garbage,coating/leachate and skirt/foil residues separate by actual composition/gate. Close input/generated-stock-treatment-recovery-handover-release fates. Expand direct water/soil/air species with actual recipient,not waste mass as elementary substance. Actual ballast environmental water intake/discharge is separate from tap-water product; do not invent universal use. Aggregation algorithm: For each actual separate wet/dry/native stream Q and supported service share a, compute sum(Q*a)/N; preserve moisture/density conversion proof. Treatment results replace exactly their included treatment/emission cells,not waste generation or unrelated streams."
      unit: "kg;m3"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "actual onboard residue generation,holding,treatment and external recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_port
      process_id: "port_support"
      flow_role: "actual terminal/shore/organizer supplies,assets and fates"
      record_type: "actual_record"
      raw_fields: "port;terminal;boarding;shore_approach;charger_buffer;meter;provider;voltage;upstream_downstream_gate;supplies;wastes;releases;assets;life;all_users;attributable_duty;coverage_cells;remote_organizer"
      collection_method: "Measure or support actual attributable terminal/boarding/control/booking/mooring/charging/shoreapproach services,including shore energy losses not already captured. Inventory each actual input,waste,release and quay/ramp/terminal/charger/storage asset and its maintenance/end-of-life; no omission because owned by a port rather than ferry operator. Use a complete provider result OR its uncovered physical cells with compatible native gate. Aggregation algorithm: Attribute actual native period flows by measured or justified all-user resource/duty shares,then /N; asset manufacture uses same-asset lifetime share before /N. Vessel_shore_ac/DC chain and port purchases must close without double allocation."
      unit: "kg;kWh;m3;Item(s);hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "actual uncovered port/shore/organization responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_vessel_life
      process_id: "vessel_lifecycle"
      flow_role: "actual native vessel/part manufacture and complete lifecycle duties"
      record_type: "actual_record"
      raw_fields: "vessel_cohort;architecture;delivery_gate;native_quantity;materials;original_parts;battery;foil_fan_skirt;covered_stages;upgrades;replacements;drydock;useful_life;all_user_lifetime_duty;attributable_compatible_duty;retirement;recycling;uncertainty;actual_excursion_configuration;viewing_equipment;historical_conversion_restoration;all_tour_transport_event_functions"
      collection_method: "Read actual whole-craft manufacture provider boundary and native unit. Reconcile hull/engine/motor/original battery/foil/control/fan/skirt inclusion with each actual replacement or repair. Collect missing upstream manufacture,delivery,maintenance,drydock and retirement/recycling via individually defined physical inputs or compatible completed provider results. Support actual useful-life/all-function duty histories and projections; a supplier manufacture result is not full-life service. Verify actual viewing-deck/window/climate/guide equipment and original coverage; restoration/refit/history are not free. Identify each other actual craft/configuration rather than relabelling a ferry/service UUID. Keep actual ordinary transport/tour/event/charter/all-user asset duty denominators. Aggregation algorithm: For each supply unit j, q_j=Qnative_j*(Dcohort_j/Dtotal_allusers_j)/N with supported positive compatible Dtotal; separate each missing stage/part and any provider-included use-phase replacement. No repeated lifetime division of period operational quantities."
      unit: "Item(s);kg;hour;voyage"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "same actual craft/part/cohort all-user life and uncovered stages"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_support
      process_id: "programme_support"
      flow_role: "actual guide/audio/content,printed material,owned support energy/equipment and fates"
      record_type: "actual_record"
      raw_fields: "programme;actual_live_or_recorded;guide_owner;employee_activity;external_completed_sessions;language_quality_duration;provider_coverage;PA_device_content;required_user_device_network;native_materials_map;stock_reuse_distribution;meter_owner;asset_supply_lifetime;actual_food_amenities;other_functions;waste_receiver_fates;uncertainty"
      collection_method: "Record actual included/performed guide/audio/amenity duties and supply gates. External completed session/result is an atomic purchased function only where real handover exists; owned employee work is internal activity with actual support/travel/training/resources,not purchased wage or food-as-fuel by default. Verify content/PA/device/network scopes and lifetime shares where actually required; ordinary personal subsistence exclusion is a disclosed service-boundary choice with comparability sensitivity. Printed completed supply OR replacing paper/ink/printing coverage is exclusive. Separate vessel/port/support meters and supplier-included cells; close stocks/reuse,taken-away maps and all waste/direct fates. Aggregation algorithm: Assign each actual native period supply/completed provider session/resource using supported all-function/cohort shares; sum attributed quantities and /N once. Share guide sessions/assets across actual supported users; native manufacture quantities use same-asset useful-life duty share before /N. No assumed one map/phone/guide-session/meal per participant."
      unit: "Item(s);kg;kWh;hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "actual uncaptured programme/guide/material/device/amenity support and fates"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
  calculation_rules:
    - id: completed_count
      applies_to: "completed_sightseeing_programme"
      rule: "Define compatible programme class G and fixed/flexible completion rule before aggregation. N_G=sum actual participant obligations completed under that rule. For one obligation satisfied by multiple attempts,include all causal duties once and count final completion once; separately delivered compatible programmes remain distinct. Own legs,transfers/reboarding,pass validity and sightings do not create N. Missing programme grouping/quality/actual completion is incomplete; N_G>0 required. Secondary distance/time/leg counts remain separately measured activity,not relabelled programme output."
      inputs:
        - "actual programme definition"
        - quality
        - participants
        - "attempts and leg/provider ledger"
      output: "N_G Item(s);separate measured distance/time/legs"
      source_ids: []
    - id: native_flow_normalization
      applies_to: "all_processes"
      rule: "q_r=sum actual compatible native Q_r*a_r /N once,where a is justified same-scope all-user attribution. Q already expressed per completed person is scaled only to actual demanded person count,not divided by occupancy again. Keep own stage/provider cells exclusive. Missing a,Q or identity is incomplete,not zero."
      inputs:
        - "native Q"
        - "actual allocation a"
        - N
      output: "q_r per declared reference flow"
      source_ids: []
    - id: fuel_blend_ownership
      applies_to: "marine_distillate"
      rule: "Per actual fuel: opening_stock+receipts+transfers_in=closing_stock+burned+noncombustion_use+leakage+recoverable_outflow+transfers_out,with measured compatible states. Count internal transfers once. Supply quantity follows the defined upstream demand/stock boundary,not automatic purchased=burned. Represent one whole blend plus component/carbon ledger OR actual component supplies replacing corresponding whole-blend mass and upstream cells with native/provider closure; never duplicate contained biofuel. Reconcile fossil/biogenic carbon in supply,combustion,stocks and fates with actual composition; energy conversion uses actual supported density/heating basis."
      inputs:
        - "bunker receipts"
        - stocks
        - composition
        - burned
        - fates
        - "provider cells"
      output: "separate actual supply,burned,fates and carbon"
      source_ids: []
    - id: external_energy_gate
      applies_to: "vessel_shore_ac;vessel_shore_dc;port_ac"
      rule: "Choose actual external AC or DC supply gate per chain and reconcile gross imports,conversion/storage/cable losses,stored energy changes,owned loads and genuine external exports. Upstream AC+owned charger makes downstream DC an internal transfer; completed external DC supply replaces matching upstream AC coverage. Do not duplicate imports,net incompatible export,add motor output/battery discharge/regen as purchased supply,or infer external DC from an internal DC bus."
      inputs:
        - "external meter"
        - "AC_DC gates"
        - losses
        - storage
        - export
        - coverage
      output: "exclusive native energy demand and uncovered losses"
      source_ids: []
    - id: asset_share
      applies_to: "sightseeing_vessel_manufacture;port_support;programme_support"
      rule: "q_j=Qnative_j*(Dcohort_j/Dtotal_allusers_j)/N,matching actual delivered asset/cohort and compatible positive supported lifetime duty. Include other users/functions and all attributable empty/support duties. Complete maintenance,foil/control/fan/skirt/battery replacement,drydock,delivery and retirement missing from manufacture separately once; whole-craft original components are not purchased again. Provider included operating cells replace corresponding foreground cells."
      inputs:
        - Qnative_j
        - Dcohort_j
        - Dtotal_allusers_j
        - N
        - "covered stages"
      output: "native manufacture share plus separate missing stages"
      source_ids: []
    - id: species_and_fate_closure
      applies_to: "vessel_operation;onboard_residues"
      rule: "Keep each actual substance,mixture,state,carbon/nitrogen basis,medium and known subcompartment. Reconcile material/water generation and stocks with use,onboard treatment,recovery,waste handover and environmental release. kg N-N2O differs from kg N2O; kg C differs from CO2/CH4. Apply only evidenced molecule/element conversions. Fuel/sanitary water purchases are not emissions; no raw waste-mixture mass as a pure elementary species. Recovery and treatment outputs include their actual new identities and provider boundaries."
      inputs:
        - "actual species"
        - "chemical basis"
        - "water/material stocks"
        - recovery
        - receiver
        - provider
      output: "separate actual substance/stream/fate quantities"
      source_ids: []
  data_quality_requirements:
    - id: dq_programme_completion
      applies_to: "completed_sightseeing_programme"
      requirement: "MANDATORY declare actual sightseeing fulfilment versus ordinary scenic travel,cruise,availability/admission or booking-only product. Fix actual itinerary/quality/completion grouping for fixed/flexible programmes before normalization; observe actual persons and pass use,no inferred trip count/occupancy or guaranteed wildlife. Trace every programme to all actual legs/boats/guide/amenity and repeated attempt duties. Actual included food/drink/maps/guide are complete; separately sold outputs require their own atomic product-output rows,native quantities and all dq_expand_operation fields with a valid same-parent protocol. Incompatible programme qualities require subdivision or a supported disclosed mix; unknown completion/grouping blocks finished use."
      evidence: "cp_programme;actual programme/contract,usage/participant,quality and attempt ledger"
    - id: dq_provider
      applies_to: "all_processes"
      requirement: "Every actual required stage must have one owner and covered/uncovered status with evidence. A completed supplier result needs its exact product/native quantity,boundary,quality,allocation and upstream/direct/capital/waste coverage; enter one specific service row only after identification. Otherwise mandatory physical expansion remains. Neither a generic all-legs/all-port-services card nor absent external supplier data closes the boundary."
      evidence: "row-linked provider x actual vessel/voyage/port/stage/period matrix"
    - id: dq_expand_operation
      applies_to: "vessel_operation"
      requirement: "MANDATORY for every actual unrepresented fuel/grade/blend component replacing whole blend,heat,cooling,lubricant,refrigerant make-up,water source,food/catering/crew operational provision,chemical/material and direct substance release: add one actual atomic row per identity/state/gate. Include actual NO/NO2,SO2,CO,NMVOC components,particle sizes,biogenic CH4 and other relevant species; no default factor or zero for an absent card. Each added row must carry unique row_id,existing process_id,direction,flow_type,specific physical/substance identity,verified UUID or honest unresolved status,native property/unit,actual quantity/basis,valid same-parent CP,source/provider scope,actual receiver/medium/known subcompartment and uncertainty. Unknown occurrence requires investigation; absence requires evidence."
      evidence: "cp_operation;cp_air;actual meter,chemical and duty records"
    - id: dq_expand_fates
      applies_to: "onboard_residues"
      requirement: "MANDATORY actual row-addressable expansion using all fields of dq_expand_operation for bilge/black/gray/combined sewage,scrubber washwater/sludge,ballast intake/discharge/sediment,food/other garbage,cleaning/coating/antifoulant substances and leaching,skirt/foil wear/cleaning residues and every other occurring stream. Actual salt/freshwater/soil/air and subcompartment cannot be selected from convenience UUID. Treatment/transport,inputs,sludges and direct species releases remain separate with one coverage owner; no assumption every vessel has ballast/scrubber or that no listed handover means no discharge. Legal discharge limits are not concentrations or permission inferred for this inventory."
      evidence: "cp_residues;reception,tank,treatment and release records"
    - id: dq_architecture
      applies_to: "vessel_operation;vessel_lifecycle;port_support"
      requirement: "MANDATORY for each actual architecture: displacement hull/drive; hydrofoil transition/foilborne energy,foil controls/actuators/materials/repairs; hovercraft lift-fan/thrust,skirt inflation/idle,shore/beach phases and actual fan/skirt replacements/wear fates. Add each actual missing input/part/release with dq_expand_operation fields and corresponding same-parent CP; no conventional-vessel factor copied to a different architecture. Actual towed/cable service must add each towing provider or owned physical duty,rope/cable/guide and wear/replacement,shore mechanism/native external energy and covered/uncovered owner using the same atomic fields; no assumed onboard propulsion or simultaneous completed-tow/owned-physical double count. Other chemical fuel or geometry requires actual completed route evidence and review before use; lack of such data blocks that application rather than excluding the sightseeing product or redefining the reference."
      evidence: "configuration,energy mode and component maintenance records"
    - id: dq_expand_capital_port
      applies_to: "vessel_lifecycle;port_support"
      requirement: "MANDATORY actual expansion with dq_expand_operation fields for each missing ship/shore asset,part manufacture,battery,foil/control,fan/skirt,charger/buffer,quay/terminal/ramp,delivery,maintenance,drydock and end-of-life. One actual gate/native quantity per row,not a collection of asset services. Support same-asset all-user duty,original versus replacement coverage and projections; missing useful life or provider stage blocks completion,not omission. Actual port/organization input/waste/release expansion is equally mandatory."
      evidence: "cp_vessel_life;cp_port;delivery,life,maintenance,retirement evidence"
    - id: dq_allocation
      applies_to: "all_processes"
      requirement: "Reconcile actual passengers,accompanying bundle,separately sold vehicles/cargo,other ship/port users and service supports. Use measured subdivision first; justify any compatible physical or alternative relationship and all-user closure. Never sum Count and tonne-km or prescribe car/person equivalence; fare and capacity are not observed resource consumption. Carry uncertainty and boundary comparability,including ordinary off-duty crew subsistence exclusion."
      evidence: "physical resource/engineering/area-time/duty evidence and sensitivity"
    - id: dq_native_source
      applies_to: "all_processes"
      requirement: "Confirm each bound identity native state/gate/type/property/unit/official name and actual applicability. Generic air-unspecified bindings require a documented unspecified-air scope; known subcompartment requires verified replacement. Mass/volume conversion requires actual compatible density or attached native relation. ISO public abstract supplies no grade values; IMO fuel GHG-only method supplies no full vessel/capital/refrigerant/other-emission completeness. Manufacturer cases supply no universal efficiency,capacity or life; BTS U.S. census scope is not a global service definition. Missing UUID or generic range is disclosed,not fabricated; actual required quantity remains mandatory."
      evidence: "direct flow/property/unitgroup proof and actual source applicability"
    - id: dq_programme_support
      applies_to: "programme_support;programme_delivery;vessel_operation;port_support;vessel_lifecycle"
      requirement: "MANDATORY actual row-addressable expansion using every dq_expand_operation field for unrepresented live/recorded guide/content/PA,required device/network,printing/paper/ink,food/drink/amenities,shore visits,travel/training,actual sightseeing craft/restoration/refit/equipment,all wastes and direct releases. Each real completed external service needs one specific function/native quantity/provider gate and exact coverage; internal physical legs/employee work are not extra purchased functions. Completed supplier result OR replacing owned physical cells,never both. Actual user-stage/kept maps/device/equipment life and fates cannot be erased because outside operator premises. Acoustic/physical disturbances or wildlife interventions,where actual and relevant,retain their physical evidence/native unit/assessment limits; no fabricated pollutant mass,wildlife-sighting output or unsupported LCIA factor. Unknown occurrence/scope/quantity remains incomplete,not zero."
      evidence: "cp_programme;cp_support;cp_operation;cp_port;cp_vessel_life;actual owner and native supply/fate records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "completed_sightseeing_programme"
    rule: "Require actual compatible completed participant-programme,reference1Item(s),fixed/flexible grouping,quality and all qualifiers with positiveN. Reject ticket/pass/party/boarding/leg/voyage/sighting/pkm substitution; preserve failed and compensatory duty pools."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "all_processes"
    rule: "Require one stage owner and full provider/foreground coverage,including actual port,hotel,architecture,ship/shore lifecycle and treatment. Included supplier cells replace exact owned cells; missing actual supply,fate,life or identity blocks completed downstream use."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "all_processes"
    rule: "Reject duplicate whole-blend/component supply,AC/DC/internal-energy double counts,unreconciled stock/burned mass,kgN/kgC relabelling,mixed wastewater identities or waste-mixture mass as elementary emission. Require actual receiving medium/subcompartment and material/water/fate closure."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "all_processes"
    rule: "Reject unsupported ratios,capacity-as-occupancy,crew-as-passenger,accompanying-object double count and Count+tonne-km denominators. Verify actual all-user/subdivision evidence and compatible same-asset lifetime shares,without repeated period-quantity lifetime division."
    source_ids: []
  - rule_id: validate_expansion
    applies_to: "all_processes"
    rule: "Each actual unrepresented physical input,waste,emission,component,service or stage must be expanded under section8 with unique native identity/quantity/CP/source/receiver. Unknown is not zero. Every protocol process_id is one real process and every row references a same-parent protocol."
    source_ids: []
  - rule_id: validate_evidence_languages
    applies_to: "all_processes"
    rule: "Require EN/ZH/projection substantive equivalence,identity support and source-limited claims. Candidate checker pass does not resolve unknown UUIDs/quantities or establish a published complete inventory. No invented marine factor,occupancy,range,life,discharge or zero-emission claim."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after all mandatory identity,quantity,coverage and fate obligations are completed and reviewed"
  allowed_use: "Use for actual declared sightseeing programme/grouping/quality,participants,itinerary/waterbody/boats,inclusions,period and evidenced complete lifecycle"
  excluded_use: "Ordinary scenic travel or passes/boardings as programmes,default wildlife guarantee or generic pkm,omitted included amenities,operating GHG-only as full lifecycle"
  required_metadata: "All programme qualifiers;actual completion/grouping/quality/attempts;internal leg/boat/provider/guide/amenities;native gates;lifecycle;species/subcompartment and actual allocation"
  required_quality_disclosure: "Identity/quantity/quality/completion grouping gaps,attempt/pass use,inclusions/provider gaps,model applicability/life projections,actual subcompartment and human boundary/allocation sensitivity"
  update_trigger: "Changes in programme function/quality/fixed-flexible grouping,inclusions,itinerary/boat/energy,guide/devices,provider coverage,lifecycle/fates or allocation"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC3.0 Explanatory Notes,30June2025,PDF pp360–361,64133 and cruise/other-water exclusions. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Sightseeing passenger water transport function and separation from ordinary other-water/cruise categories; no universal guide,loop,duration,quantity or LCA formula."
  - id: "imo-fuel-lca-2024"
    type: "official_guidance"
    reference: "IMO Resolution MEPC.391(81),22March2024,2024 marine-fuel LCA Guidelines,annex p3 sections1–2. https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.391(81).pdf"
    used_for: "Fuel-chain and onboard propulsion/power interfaces,including shore electricity; CO2/CH4/N2O only. Explicitly excludes refrigerants and other listed species; not full ship inventory. No default factor adopted."
  - id: "imo-pollution"
    type: "official_guidance"
    reference: "IMO Pollution Prevention,public page accessed21October2026,opening paragraphs. https://www.imo.org/en/ourwork/environment/pages/pollution-prevention.aspx"
    used_for: "Qualitative separate oil,sewage,garbage,air,ballast,antifouling and reception pathways; not factors,actual concentrations,universal occurrence or legal discharge permission."
  - id: "iso8217-abstract"
    type: "standard"
    reference: "ISO8217:2024,edition7 May2024,public abstract only. https://www.iso.org/standard/80579.html"
    used_for: "Marine fuel specification families and before-onboard-handling gate; full normative text not read. No numeric grade,composition,density,sulphur or compliance conclusion."
  - id: "damen-ferry-cases"
    type: "literature"
    reference: "Damen Road Ferries and Ferry2306 Electric,primary product pages accessed21October2026. https://www.damen.com/vessels/ferries/roro-ferries ; https://www.damen.com/vessels/ferries/city-ferries/ferry-2306-electric"
    used_for: "Actual case interfaces: passenger/vehicle ferries,shorecharging/buffer,diesel backup and internalDC. Product cases only; marketing emission savings,capacities and charging performance not generic parameters."
  - id: "hydrofoil-case"
    type: "literature"
    reference: "Candela P-12 Shuttle,primary technical product page accessed21October2026. https://candela.com/pro-series/p-12-shuttle/"
    used_for: "Actual electric hydrofoil controls,foil structure/transition and external DC charging architecture; no advertised savings,range,capacity or life adopted as a generic factor."
  - id: "hovercraft-architecture"
    type: "literature"
    reference: "Griffon Hoverwork/Griffon Marine,How Hovercraft Work,public primary technical explanation accessed21October2026. https://www.griffonhoverwork.com/products/hovercraft/how-hovercraft-work/"
    used_for: "Actual lift-fan,flexible-skirt and thrust-propeller functions over water/shore surfaces; not passenger-operation emission,wear or fuel factors."
  - id: "bts-ncfo-2024"
    type: "official_guidance"
    reference: "BTS2024 National Census of Ferry Operators printable questionnaire,PDF pp2 and11. https://www.bts.gov/sites/bts.dot.gov/files/2025-02/2024%20NCFO%20Printable%20Questionnaire.pdf"
    used_for: "U.S.-scope census context and distinct passenger/vehicle capacities excluding crew; no adoption of capacity or assumed car length as actual occupancy,reference denominator or worldwide service definition."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "GHG Protocol Product Life Cycle Accounting and Reporting Standard2011,chapters7 and9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Allocation hierarchy and disclosure context; required ship/shore capital and specific Count/duty formulas are explicit PCR choices,not mandates attributed to this GHG standard."
  - id: "circleline-programme"
    type: "literature"
    reference: "Circle Line Best of NYC,primary operator programme page accessed21October2026. https://www.circleline.com/sightseeing-cruises/best-of-nyc"
    used_for: "Case-specific viewing itinerary,live/audio guide and onboard support,landmark passing without attraction admission; no duration,landmark count,capacity,operating or completion factor adopted. Website offer is not actual performed inventory."
  - id: "citycruises-programme"
    type: "literature"
    reference: "City Cruises London Sightseeing Cruises,primary operator page accessed21October2026. https://www.cityexperiences.com/london/city-cruises/sightseeing-cruises/"
    used_for: "Case-specific A-B/return sightseeing,commentary,time-pass and possible boat-transfer interfaces,optional concessions/attractions; no default trips,pass completion,occupancy or universal route."
  - id: "captaincook-programme"
    type: "literature"
    reference: "Captain Cook Sydney Explore Sightseeing,primary operator public programme page accessed21October2026. https://www.captaincook.com.au/explore-sydney-sightseeing/"
    used_for: "Actual offered classic/premium/HOHO/wildlife programme distinctions,commentary/maps,included versus purchased amenities and conditional re-cruise context. No universal sighting,serving,food,price,trip or quality factor."
  - id: "circleline-fleet"
    type: "literature"
    reference: "Circle Line Our Boats,primary operator fleet page accessed21October2026. https://www.circleline.com/about/our-boats"
    used_for: "Case-specific viewing decks/windows,climate facilities,multiple tour/event uses and historic conversions; no current fleet number,age,propulsion,manufacturing mass,capacity or lifetime default."
