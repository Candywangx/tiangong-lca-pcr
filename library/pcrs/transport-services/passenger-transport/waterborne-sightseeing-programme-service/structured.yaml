system_boundary:
  rules:
    - rule_id: programme_start
      applies_to: "programme_delivery"
      rule: "Include the actual agreed viewing/interpretation programme from its documented beginning to completion,all constituent boat legs/stops/transfers and included narration/amenities. Same-boat reboarding,return legs and supplier subactivities are internal to the declared programme,not extra final outputs. Ordinary scenic travel,booking/access entitlement or attraction admission alone is not this fulfilled product."
      source_ids:
        - un-cpc3-2025
        - circleline-programme
        - citycruises-programme
    - rule_id: duty_pool
      applies_to: "vessel_operation;port_support"
      rule: "Include attributable manoeuvring, waiting, hotelling, empty/repositioning, charging, maintenance/test and failed/interrupted duties within the evidenced service pool. Their lack of completed passengers is not evidence of zero burden. Preserve period/cohort causality."
      source_ids: []
    - rule_id: provider_cells
      applies_to: "all_processes"
      rule: "Use an explicit provider-by-vessel/voyage/port/stage/period coverage ledger. Either consume a completed compatible supplier result plus only uncaptured integrator burdens, or own physical inputs and link uncovered external stages. A provider-included fuel supply, use-phase release, vessel manufacture or waste treatment replaces that exact foreground cell, never coexists with it; gaps require mandatory expansion."
      source_ids: []
    - rule_id: capital_complete
      applies_to: "vessel_lifecycle;port_support"
      rule: "This PCR explicitly requires attributable vessel and shore-asset manufacture, original/replacement equipment, maintenance, dry-dock, charging/mooring/quay/terminal assets and retirement/end-of-life. Verify actual delivery gates and coverage before lifetime allocation. A manufacture-only ship identity does not cover the other stages; no lifetime service fiction or unsupported universal life."
      source_ids:
        - ghg-product-2011
    - rule_id: chemical_fates
      applies_to: "vessel_operation;onboard_residues"
      rule: "Keep actual fuel, lubricant, refrigerant, cooling, cleaning and coating supply/stock/use/recovery/fates separate. Assess each actual bilge, black/graywater, scrubber washwater/sludge, ballast intake/discharge/sediment, garbage, antifoulant leachate and hull-cleaning residue. Actual species, receiving freshwater/seawater/soil/air and subcompartment must be identified; waste handover and direct environmental release are different exchanges."
      source_ids:
        - imo-pollution
    - rule_id: crew_and_inclusions
      applies_to: "programme_delivery;vessel_operation"
      rule: "Working crew are operational support, not passenger output. Include actual attributable crew accommodation, sanitation and operator-provided meals/support and any included passenger amenities. Ordinary off-duty personal subsistence is excluded as an explicit PCR choice, disclosed for comparison; this does not remove onboard operational provisions or justify zero emissions. Actual separately transported off-duty passengers require evidenced passenger status."
      source_ids: []
    - rule_id: architecture_duties
      applies_to: "vessel_operation;vessel_lifecycle;port_support"
      rule: "Select actual displacement, hydrofoil or air-cushion architecture from vessel evidence. For hydrofoils include displacement/transition/foilborne periods, foil controls/actuators, actual foil/strut repairs and materials. For hovercraft include lift-fan and thrust energy, inflate/deflate/idle operation, shore/beach approach and actual skirt wear/replacements/residues; never omit lift energy or assume a propeller-only fuel profile. Whole-craft original parts replace their exact component manufacture cells. Actual fan/propeller air movement is internal physical operation, not a fabricated pollutant flow. Other architectures or chemical-energy routes require documented specific completion/review, not an assumed generic efficiency."
      source_ids:
        - hydrofoil-case
        - hovercraft-architecture
    - rule_id: fixed_flexible_quality
      applies_to: "programme_delivery"
      rule: "Before normalization define actual fixed itinerary or flexible selected programme and compatible quality class,viewing opportunity versus any guaranteed performance,scope of narration and completion evidence. A flexible pass needs observed programme/leg/person records and a declared reproducible grouping rule,not one tour per ticket/day/boarding or a post-hoc shortest path. Unknown completed programme units block completed use. Wildlife presence,weather/visibility and all published landmarks are not universal guaranteed outputs."
      source_ids:
        - citycruises-programme
        - captaincook-programme
    - rule_id: tour_and_supplier_ownership
      applies_to: "all_processes"
      rule: "A compatible completed external boat/guide/food result replaces only its actual native demand and covered stage cells; add only uncaptured organiser/guide/shore/amenity responsibilities. Owned boat legs are internal physical operations,not another purchased transport result. Keep actual programme-to-leg-to-vessel/provider coverage closed; no full transport result plus the same fuel/assets/releases. Include actual viewing detours,slow/loiter/photo/wildlife approaches,empty/reposition,waiting,failed and compensatory duties under their true owner."
      source_ids: []
    - rule_id: included_extras
      applies_to: "programme_delivery;programme_support;vessel_operation;port_support"
      rule: "Actual included commentary,guide/audio/content,required device/network,printed maps,refreshments or shore activities stay complete in the programme. Additional-charge independent food,bar,admission or other services require actual subdivision/shared-duty allocation and their own native output rows. Do not infer a full inclusive cruise from the word cruise or a supplied snack; a whole cruise/holiday function is a different product. Employed crew/guide work is support,not participant output or fictitious purchased labour fuel."
      source_ids:
        - circleline-programme
        - citycruises-programme
        - captaincook-programme
