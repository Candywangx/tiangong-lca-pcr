    - row_id: "completed_sightseeing_programme"
      reason: "One initial and one function/native-Count refinement return unrelated water/fishing items,bus/car travel or ship manufacture,not actual fulfilled participant waterborne sightseeing programme. Verified Count support does not identify the service."
    - row_id: "marine_distillate"
      reason: "Direct Marine diesel candidate is at-sea fishing-vessel burned-use gate; direct Gas oil candidate is refinery fraction/intermediate for later blending,not verified marine distillate bunker supply. Generic road Diesel is not a marine-grade proof. Both bounded queries exhausted."
    - row_id: "collected_bilgewater"
      reason: "Direct candidates describe oil-contamination treatment or broad industrial waste liquid at plant; initial/refinement lack collected wet engine-room bilge mixture at reception handover. Pure used lubricant and sludge are distinct identities."
    - row_id: "held_blackwater"
      reason: "Direct untreated municipal wastewater candidate is treatment-plant inlet,not ship toilet holding-tank/reception gate; other candidates industrial washwater/sludge. No exact native blackwater mixture and handover verified."
    - row_id: "vessel_shore_dc"
      reason: "Direct DC candidates constrain factory point of use below1kV or CN800kV production mix; other DC result is microbial reactor terminal. These do not verify actual external vessel charging-inlet gate/provider loss coverage. Internal DC bus is not external supply proof."
    - row_id: "sightseeing_vessel_manufacture"
      reason: "Initial and one viewing-configuration/native-Count refinement return generic cruise/excursion/ferry or completed-vessel manufacture family. Retained direct records are native Mass and broad configuration; no whole sightseeing craft Count handover or mass-to-item conversion verified."
    - row_id: "external_live_narration"
      reason: "Initial and one actual live-guide/session refinement return fish unloading/freight/towing,ship parts or agricultural/fishing/stripping labour. Worker-hour and labour identities do not identify an actual completed onboard narration session."
  unresolved_evidence:
    - "Actual compatible fulfilled programme completion/grouping/quality,pass-use and attempt records; real ship/shore/guide/audio/content/device/map/amenity provider/native/lifecycle/receiver obligations and each unrepresented atomic row remain mandatory. No universal occupancy,programme duration,trip count,wildlife success,meal/map quantity,lifetime,emission factor or range supplied."
  method_boundary_review: "Independent actual sightseeing function and material water-mode interfaces justify one waterborne programme method,not a duplicate record solely for CPC64133. The actual product is participant completion of declared fixed/flexible waterborne sightseeing programme with actual quality/inclusions; loops,A-B and evidenced multi-leg programmes are covered without default guides,advertised-duration/wildlife guarantee or arbitrary geographic threshold. Ordinary scenic transport,access/admission-only,vessel/crew availability and full inclusive cruise/holiday functions excluded. Proposed exact relation follows actual waterborne sightseeing function; UUID/quantity/route-data gaps concern readiness rather than set exclusions or full-leaf completed data. Internal physical legs are not purchases; actual external completed results replace their true native covered cells only. Ship/shore energy,assets,fates and all-function allocation remain mandatory. Draft individual ADR requires independent acceptance; no edge authored here."
