      rule: "Same asset actual delivered native quantity times compatible cohort/positive complete-life alluser usefulduty then/N, manufacturing gate only. Uncovered install/use/refit/replacement/maintenance/retirement separate, wholeinitialcomponent/providercoverage exclusive."
      inputs:
        - cp_assets
      output: "Actual attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: energy_stock_fates
      applies_to: "urban_scheduled_road_service"
      rule: "Separately reconcile fuelstock supply/netwithdrawal/burn/spill/recovery and electrical grossimports/providerDC/internalconversion/storage/regeneration/export/losses/dissipation. Wholeblend vsreplacingcomponents exclusive. Actual compatible species/source activity and medium not fabricated from residual or metering mismatch."
      inputs:
        - cp_fuel
        - cp_electric
        - cp_emissions
      output: "Actual attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
