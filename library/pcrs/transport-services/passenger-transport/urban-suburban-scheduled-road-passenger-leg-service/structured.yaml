        - ghg-product-2011
    - rule_id: tram_physical
      applies_to: "urban_scheduled_road_service"
      rule: "For actual tramway retain wheel-rail/bogie/axle/traction/brake/rail/points/embedded or segregated track/return current, collector strip/pantograph/contactwire/substation and protection interfaces. Actual steelwear/grinding/lubrication/sanding/brake/collector maintenance and air/deposit/water/waste fates require independent evidence. Do not infer all these materials present or use generic road-tyre factors for tram steelwear."
      source_ids:
        - ghg-product-2011
    - rule_id: trolley_physical
      applies_to: "urban_scheduled_road_service"
      rule: "Actual trolleybus retains rubber-tyre/road interface, two-pole/contact-wire/collector/return supply and actual off-wire battery/generator/auxiliary states. Match independent actual identities for battery/DC supply/fuel/converter and full wire/vehicle/site lifecycle; no trolleybus=ordinarybatterybus assumption."
      source_ids:
        - ghg-product-2011
    - rule_id: energy_recovery
      applies_to: "urban_scheduled_road_service"
      rule: "Draw actual gate graph from upstream AC/provider to rectification/contactline/charger/storage/vehicle and external export. Assign losses once. Recovered braking to onboard/network/wayside storage/another vehicle is internal at a whole-network boundary; actual external transfer is separately metered. Braking resistor heat/dissipation or unavailable network acceptance is not automatically exported/avoided electricity. Gross versus net meters and all-user ownership explicit, no net-saving plus duplicate credit."
      source_ids:
        - ghg-product-2011
    - rule_id: capital_provider
      applies_to: "urban_scheduled_road_service"
      rule: "Complete actual bus/tram/trolley/battery/road/track/wire/substation/charger/depot/stop/terminal manufacture, installation, renewal, use, maintenance and retirement responsibility. Delivered asset flow supports only verified manufacturing gate; useful life is allocation denominator only. Complete assembly versus same included initial components and actual inclusive provider coverage are exclusive."
      source_ids:
        - ghg-product-2011
