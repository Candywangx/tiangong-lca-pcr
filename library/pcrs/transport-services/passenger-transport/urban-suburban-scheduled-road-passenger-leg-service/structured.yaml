      evidence: "cp_fuel; cp_electric; cp_depot; cp_maintenance"
    - id: all_asset_life
      applies_to: "urban_scheduled_road_service"
      requirement: "Independently cover all actual vehicle/battery/road/track/slab/wire/pole/substation/storage/charger/depot/stop/terminal/land manufacture/install/refit/renewal/maintenance/retirement with same asset alluser life evidence. Native count/mass relationships measured, no defaultcapacity/life; wholeobject and same included initial components exclusive; no old/leased asset automaticallyzero."
