system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "all inventory rows"
      rule: "Include all actual activities supporting the declared completed cohort, including attributable empty positioning, shunting, coasting, layover/standby, cancelled or failed duty and maintenance. Coasting does not establish zero auxiliary power or zero assigned supporting burden. No new output count arises from these duties. Supporting-node quantitative references use the same final completed-leg denominator and do not create additional product outputs. Keep unserved demand and cancelled tickets outside N while assigning their actual supporting burdens through a documented causal driver."
      source_ids: []
    - rule_id: boundary_ownership
      applies_to: "all inventory rows"
      rule: "For each provider, meter, station, depot, rolling-stock unit and track asset, declare an input/output gate and coverage matrix. Buy either a complete provider result with its included duties or the disaggregated constituents for that duty; never both. Generic transport or infrastructure dataset names do not prove scope compatibility."
      source_ids:
        - ghg-product-standard-2011
    - rule_id: boundary_power
      applies_to: "all inventory rows"
      rule: "Do not record power-station emissions again as train tailpipe emissions. Internal regenerated electricity reused within the model boundary is an internal transfer, not another service or exported product. A measured external export crosses its actual gate once and cannot simultaneously be subtracted from a net import and receive an additional credit."
      source_ids:
        - ipcc-mobile-combustion-rail
    - rule_id: boundary_assets
      applies_to: "all inventory rows"
      rule: "Require asset-specific manufacture, renewal, maintenance and retirement coverage over the complete physical service life, allocated once to all users and reporting periods. Manufacture-demand rows below are conditional concrete examples; they do not replace the complete asset register. Already operated or leased assets are not zero-burden, and supplier-embedded capital cannot be added again."
      source_ids:
        - ghg-product-standard-2011
    - rule_id: boundary_fates
      applies_to: "all inventory rows"
      rule: "Independently identify actual materials, refrigerants, wastewater, maintenance waste, wear particles and exhaust species. Unknown occurrence, species, medium or receiver gate blocks completion. Do not mix captured dust or oily liquid with airborne particles, evaporated water or a treatment activity."
      source_ids: []
    - rule_id: native_public_extent
      applies_to: "all inventory rows"
      rule: "Establish actual single-city/contiguous-city extent,public availability and predetermined route/schedule. Collect board/alight origin-destination evidence,each segment passenger load,actual accompanying loads,vehicle consist,class,quality and cohort period. A through service crossing into interurban extent requires the actual separately supplied segment function/interface,not arbitrary distance truncation or a claim that the whole interurban leg is urban."
      source_ids:
        - unsd-cpc3-passenger-rail-2025
    - rule_id: native_wheels_tyres_rack
      applies_to: "all inventory rows"
      rule: "For actual wheel/rack/tyre support identify the complete bogie,traction/brake,rail/beam/rack and guide interfaces. Collect actual tyre type,gas,pressure-state stocks,inflation/recovery/venting,replacement cycles and physical wear. Rubber running/guide/stabilizing tyres and concrete guideway cannot inherit steel wheel/rail wear rates. Rack gear/toothed rail lubrication,cleaning,renewals and test duties remain actual separate phases. No universal gradient,tyre life,friction,wear or traction efficiency is supplied."
      source_ids:
        - hitachi-urban-monorail-2005
        - sytral-rack-metro-2026
    - rule_id: native_linear_levitation
      applies_to: "all inventory rows"
      rule: "Identify independently support,propulsion and braking:wheel-supported linear motors retain wheel contact plus primary coil/secondary reaction plate;levitation retains actual magnets/coils/guidance,power electronics and guideway. Collect gross supply separately for propulsion,levitation/gap control,stationary levitation,auxiliaries,conditioning/cooling,standby and rescue with reconciled meter coverage. No assertion that a stopped/coasting train uses zero energy or that lack of rail contact makes all wear/maintenance zero. Actual superconducting or other systems require their own cryogenic/cooling/consumable and engineering evidence,not Linimo values."
      source_ids:
        - jametro-linear-mechanism
        - aichi-linimo-2019
    - rule_id: native_other_energy
      applies_to: "all inventory rows"
      rule: "For every actual carrier follow its physical chain. External AC/DC and storage charge are not interchangeable;internal battery/fuel-cell/generator output and regenerated reuse are internal transfers,not extra imports. Battery initial installation/replacement and charging losses have separate covered gates. A fuel-cell route keeps actual delivered hydrogen state/purity/pressure,compression/liquefaction/conditioning,air/oxygen supply,water production,purge/leak/recovery and upstream route;hydrogen supplied is not assumed reacted or emitted,and no stoichiometric inventory substitutes actual quantities. A steam route retains actual fuel grade/carbon origin,boiler feed/makeup/condensate stock,pressure/temperature,heat/steam generation and use,blowdown,ash and actual releases;do not add internally made steam to its own fuel/boiler load or infer kg steam from kg fuel without independent evidence. Missing actual engineering/source data blocks completion,not the qualifying railway product."
      source_ids:
        - ipcc-mobile-combustion-rail
    - rule_id: native_station_provider_life
      applies_to: "all inventory rows"
      rule: "Keep actual underground ventilation/drainage,station climate/escalators/lifts/platform/control/signal,power conversion and depot/test/emergency sources with physical meter/asset scope. Ground-level,elevated and underground civil works and shared users have actual engineering quantities/life;no generic infrastructure intensity. Complete traction/station/depot/construction/repair/treatment providers replace exact covered fuel,power,materials,capital and releases;uncaptured collection transport/conditioning/current maintenance/EoL remain separately completed once. Native manufacture demand times compatible same-asset cohort duty/positive total all-user useful duty,then/N,is a covered delivered-phase allocation,not a full-life rail-service identity."
      source_ids:
        - ghg-product-standard-2011
boundary_abstraction:
  declared_starting_condition: "Actual scheduled rail service roster, supplied carriers, maintained operating assets and separately identified upstream provider gates"
  starting_condition_role: "Declared physical/service starting facts, not zero-burden historical capital or fuel"
  product_classification_scope: "CPC3.0 64111;exact;single/contiguous-city public scheduled railway function"
  recursive_input_rule: "A purchased rail subservice is a separately owned input only if its duties are outside the directly modelled train boundary; no self-recursion or duplicate reference output"
  upstream_dataset_requirement: "Compatible actual fuel/electricity, provider, manufacture/renewal and treatment datasets with explicit native quantity and non-overlap matrix"
  disclosure: "Cohort, leg/timetable/distance, scope ownership, lifetime/capital, co-products, exclusions and unresolved data; no complete-service claim with mandatory gaps"
