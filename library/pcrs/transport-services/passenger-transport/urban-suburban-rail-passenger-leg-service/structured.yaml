allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all inventory rows"
    rule: "First subdivide or submeter dedicated train, station, maintenance and asset activities. Where subdivision is infeasible, document the physical cause, all users and compatible driver for each residual shared burden; GHG Product Standard chapter 9 supports this hierarchy, not a universal rail factor."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocation_passengers
    applies_to: "all inventory rows"
    rule: "Allocate train-segment passenger burdens using measured cohort segment occupancy/distance and class resources, then sum the attributed cohort numerator and divide by its N. Use actual exposed coach-space/time or another evidenced causal driver for amenities/overheads when passenger-distance is unsuitable. Include other actual cohorts in every denominator; nominal seats, ticket revenue, fares or operator-average occupancy are not default shares."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocation_coproducts
    applies_to: "all inventory rows"
    rule: "Passenger-distance and freight tonne-distance have different dimensions and must not be added. For mixed passenger/freight trains, accompanying vehicles or separately sold ancillary products, subdivide first and justify any remaining traction, capacity and infrastructure shares using actual engineering/activity evidence. Do not treat earlier and later legs of one rail service as co-products; do not allocate twice."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: allocation_export_waste
    applies_to: "all inventory rows"
    rule: "Actual external electricity exports, recovered materials and wastes need their own physical fate and boundary rule. No automatic avoided-grid, avoided-car, avoided-freight or virgin-material credit is allowed. Disclose the selected allocation/recycling method and preserve all required physical exchanges; an internal power transfer or waste handover cannot multiply completed journeys."
    source_ids:
      - ghg-product-standard-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_journeys
      process_id: "rail_operation"
      flow_role: "completed person-legs"
      record_type: "journey_ledger"
      raw_fields: "cohort_id; city_extent_and_contiguity; public_availability; predetermined_route_and_schedule; actual_support_propulsion_mechanism; service_type; origin; destination; train_service_id; class; date; actual_boardings; actual_alightings; completion; transfers; ticket/pass reconciliation; actual_segment_km; actual_segment_passengers; N"
      collection_method: "Reconcile actual passenger counts and origin/destination evidence with operation records; validate sampling and expansions when counts are estimated. Exclude crew and reconcile incomplete/cancelled journeys without erasing their activity burdens. N completed person-legs for the declared cohort; preserve each segment load/distance ledger separately."
      unit: "Item(s)"
      frequency: "each service; reconciled reporting period"
      temporal_coverage: "same stated period and journey cohort"
      site_scope: "same train services and actual boarding/alighting stations"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "count reconciliation; route records; sampling coverage; cancellations and transfer audit"
    - protocol_id: cp_operation
      process_id: "rail_operation"
      flow_role: "actual traction and auxiliary duty"
      record_type: "meter_and_fuel_ledger"
      raw_fields: "train_id; duty_id; segment; propulsion; electricity_state; gross_import; external_export; losses; beginning_fuel; delivered_fuel; ending_fuel; fuel_leaks; fuel_grade; fuel_density_state; loaded_empty_shunting_coasting_standby; allocation_owner; assigned_quantity"
      collection_method: "Use calibrated boundary meters, dispatch and refuelling/stock records. Resolve gross versus net electricity metering and allocate measured shared duty with the same actual cohort exposure. Keep failed, empty and standby duty visible. actual attributed native quantity / N completed person-legs; internal regenerated energy is not another external input/output."
      unit: "native kWh or kg"
      frequency: "each meter interval and duty; period reconciliation"
      temporal_coverage: "same cohort period, with cut-off reconciliation"
      site_scope: "declared trains, power handover points and assigned stations"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; billing-meter reconciliation; stock closure; route/technology and provider scope"
    - protocol_id: cp_emissions
      process_id: "rail_operation"
      flow_role: "direct species and actual medium"
      record_type: "measurement_or_qualified_model"
      raw_fields: "duty_id; substance; origin; receiving_medium; measured_mass; factor_source_version; factor_unit; compatible_activity; fuel_technology; carbon_or_nitrogen_basis; uncertainty; attribution"
      collection_method: "Use actual compatible monitoring or a fully documented activity/factor method with independently supported units, technology and period. Do not derive non-CO2 gases solely from CO2 or inherit a factor from a vehicle label. actual attributed species mass / N completed person-legs."
      unit: "kg of each actual substance"
      frequency: "each monitored/modelled duty and period"
      temporal_coverage: "same duty and cohort period"
      site_scope: "actual operation release sources attributed to the declared rail service"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "monitor/model files; factor applicability; species and carbon/nitrogen basis audit"
    - protocol_id: cp_maintenance_emissions
      process_id: "rail_maintenance"
      flow_role: "direct species and actual medium"
      record_type: "measurement_or_qualified_model"
      raw_fields: "duty_id; substance; origin; receiving_medium; measured_mass; factor_source_version; factor_unit; compatible_activity; fuel_technology; carbon_or_nitrogen_basis; uncertainty; attribution"
      collection_method: "Use actual compatible monitoring or a fully documented activity/factor method with independently supported units, technology and period. Do not derive non-CO2 gases solely from CO2 or inherit a factor from a vehicle label. actual attributed species mass / N completed person-legs."
      unit: "kg of each actual substance"
      frequency: "each monitored/modelled duty and period"
      temporal_coverage: "same duty and cohort period"
      site_scope: "actual maintenance release sources attributed to the declared rail service"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "monitor/model files; factor applicability; species and carbon/nitrogen basis audit"
    - protocol_id: cp_maintenance
      process_id: "rail_maintenance"
      flow_role: "actual maintenance and waste fates"
      record_type: "maintenance_and_receiver_ledger"
      raw_fields: "asset_id; task; water_source; material_SKU; net_quantity; native_unit; mixture_contents; receiver; treatment_scope; direct_release_medium; provider_coverage; attributed_quantity"
      collection_method: "Read maintenance/cleaning orders, calibrated meters, stock issues and receiver records; independently measure each actual stream and retained contents. Separate physical waste from treatment-service inputs and avoid duplicating supplier-covered tasks. actual task quantities assigned to the cohort by compatible maintenance duty / N completed person-legs."
      unit: "native kg or m3"
      frequency: "each actual task and handover"
      temporal_coverage: "linked maintenance cycles and reporting period"
      site_scope: "declared depot/stations and receivers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "work orders; stock and receiver reconciliation; wastewater/evaporation distinction"
    - protocol_id: cp_assets
      process_id: "rail_capital"
      flow_role: "asset manufacture, renewal and retirement demand"
      record_type: "complete_lifetime_asset_register"
      raw_fields: "asset_id; physical_configuration; manufacture_gate; provider_coverage; quantity; native_unit; install_date; renewal_scope; complete_life_duty; all_user_duty; cohort_duty; retirement_fate; lifetime_evidence; uncertainty"
      collection_method: "Use asset bills of quantities and manufacture/renewal records, actual duty logs and supported complete-life engineering projections. Separate each component renewal from whole-asset demand; reconcile all users and periods, financing/lease responsibility and actual retirement pathways. Unproven useful life blocks a complete capital result. actual manufacture/renewal quantity times documented cohort share of complete-life duty / N completed person-legs; retirement is separately owned."
      unit: "native Item(s) or kg"
      frequency: "asset installation/renewal/retirement; duty period"
      temporal_coverage: "whole physical life with period/cohort shares"
      site_scope: "all train, station, depot, track and power assets serving the cohort"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "asset configuration; life/duty sensitivity; all-user closure; coverage and retirement records"
    - protocol_id: cp_mechanism
      process_id: "rail_operation"
      flow_role: "actual support/propulsion source mechanism"
      record_type: "engineering_and_source_ledger"
      raw_fields: "mechanism_id;wheel_tyre_rack_coil_guideway;actual_configuration;source_state;gross_import;propulsion_levitation_stationary_auxiliary;storage_internal_transfer;boiler_fuel_water_pressure_heat_condensate_blowdown_ash;hydrogen_purity_pressure_stock_reaction_purge_vent;source_receiver;providerphase;cohort_share;N"
      collection_method: "Identify independently support,propulsion and braking:wheel-supported linear motors retain wheel contact plus primary coil/secondary reaction plate;levitation retains actual magnets/coils/guidance,power electronics and guideway. Collect gross supply separately for propulsion,levitation/gap control,stationary levitation,auxiliaries,conditioning/cooling,standby and rescue with reconciled meter coverage. No assertion that a stopped/coasting train uses zero energy or that lack of rail contact makes all wear/maintenance zero. Actual superconducting or other systems require their own cryogenic/cooling/consumable and engineering evidence,not Linimo values. For every actual carrier follow its physical chain. External AC/DC and storage charge are not interchangeable;internal battery/fuel-cell/generator output and regenerated reuse are internal transfers,not extra imports. Battery initial installation/replacement and charging losses have separate covered gates. A fuel-cell route keeps actual delivered hydrogen state/purity/pressure,compression/liquefaction/conditioning,air/oxygen supply,water production,purge/leak/recovery and upstream route;hydrogen supplied is not assumed reacted or emitted,and no stoichiometric inventory substitutes actual quantities. A steam route retains actual fuel grade/carbon origin,boiler feed/makeup/condensate stock,pressure/temperature,heat/steam generation and use,blowdown,ash and actual releases;do not add internally made steam to its own fuel/boiler load or infer kg steam from kg fuel without independent evidence. Missing actual engineering/source data blocks completion,not the qualifying railway product."
      unit: "actual native source/species/asset units"
      frequency: "each actual source/duty/cohort and engineering change"
      temporal_coverage: "aligned actual duty/cohort period"
      site_scope: "actual qualifying railway mechanism,all direct and supporting uncovered sources"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual drawings/meters/stock/phase closure,applicability and uncertainty"
  calculation_rules:
    - id: normalize_service
      applies_to: "all inventory rows"
      rule: "Attribute actual native quantities to the declared cohort using documented activity and all-user shares, then divide the resulting cohort numerator by N; do not normalize intermediate transfers again."
      inputs:
        - cp_journeys
        - cp_operation
        - cp_mechanism
        - cp_maintenance
        - cp_emissions
        - cp_maintenance_emissions
        - cp_assets
      output: "native quantity per 1 Item(s) completed person-leg"
      source_ids: []
    - id: segment_attribution
      applies_to: "rail_operation"
      rule: "Use actual cohort segment loads/distances and compatible class-resource drivers; preserve segment totals and all users before cohort summation. Passenger-distance, vehicle-distance and freight tonne-distance remain separate dimensions."
      inputs:
        - cp_journeys
        - cp_operation
      output: "auditable cohort activity numerator"
      source_ids:
        - eurostat-rail-manual-2025
    - id: asset_duty_share
      applies_to: "rail_capital"
      rule: "For each physical asset/component, attribute actual manufacture/renewal demand by cohort duty divided by compatible complete-life all-user duty; handle its retirement once under the declared lifecycle coverage. No financial depreciation or universal service years substitute for physical duty."
      inputs:
        - cp_assets
        - cp_journeys
      output: "cohort-native asset demand before reference normalization"
      source_ids:
        - ghg-product-standard-2011
  data_quality_requirements:
    - id: actual_energy
      applies_to: "rail_operation"
      requirement: "For every actual carrier, DC interface, battery, alternative fuel, purchased heat or complete power/traction provider not exactly represented above, identify and add one independently verified atomic exchange with its actual native unit, condition and coverage. Establish evidenced non-use where inapplicable; unknown occurrence is not zero."
      evidence: "cp_operation"
    - id: actual_assets
      applies_to: "rail_capital"
      requirement: "Complete the entire rolling-stock, track, station, depot, signal and power asset register. Expand actual model/configuration/gate-specific manufacturing and renewal demands and their retirement/treatment flows. The example manufacture cards do not cover other materials or whole infrastructure; unknown asset duty, identity or lifespan blocks completion."
      evidence: "cp_assets"
    - id: actual_maintenance
      applies_to: "rail_maintenance"
      requirement: "Individually expand each actual lubricant, chemical, refrigerant, cleaning material, spare part, water source and complete outsourced task, with supplier composition and actual occurrence. Track all wastewater, retained mixtures and waste destinations independently; a missing record is not an omission permission."
      evidence: "cp_maintenance"
    - id: actual_emissions
      applies_to: "rail_operation,rail_maintenance"
      requirement: "Require all actual exhaust, refrigerant, brake/wheel/rail wear and other direct species with source, material state, particle size where relevant and receiving compartment. NOx/NMVOC/particulate totals cannot be assigned an arbitrary individual molecule UUID. Separate biogenic carbon and other media; do not use input stock deficits as emissions."
      evidence: "cp_emissions;cp_maintenance_emissions"
    - id: actual_providers
      applies_to: "rail_operation,rail_maintenance,rail_capital"
      requirement: "For each actual outsourced train, station, depot, maintenance, power, construction or waste-treatment result, retain native provider output, actual quantity and stage-coverage matrix. Expand a concrete provider service only after identifying its real reference flow; do not force a generic freight or asset UUID. Provider-included inputs/emissions/capital cannot also be counted directly."
      evidence: "cp_assets"
    - id: identity_and_factors
      applies_to: "all inventory rows"
      requirement: "A final foreground package requires verified actual flow and support identity for every applicable exchange and source-supported quantity relationships. Candidate unresolved cards and absent universal ranges are not zero inputs, verified factors or publication readiness. Missing needed quantity or identity blocks final completion."
      evidence: "cp_journeys"
    - id: actual_classification_extent
      applies_to: "completed_urban_suburban_rail_leg"
      requirement: "Establish actual single-city/contiguous-city extent,public availability and predetermined route/schedule. Collect board/alight origin-destination evidence,each segment passenger load,actual accompanying loads,vehicle consist,class,quality and cohort period. A through service crossing into interurban extent requires the actual separately supplied segment function/interface,not arbitrary distance truncation or a claim that the whole interurban leg is urban."
      evidence: "cp_journeys;cp_operation"
    - id: actual_native_mechanisms
      applies_to: "rail_operation;rail_maintenance;rail_capital"
      requirement: "For actual wheel/rack/tyre support identify the complete bogie,traction/brake,rail/beam/rack and guide interfaces. Collect actual tyre type,gas,pressure-state stocks,inflation/recovery/venting,replacement cycles and physical wear. Rubber running/guide/stabilizing tyres and concrete guideway cannot inherit steel wheel/rail wear rates. Rack gear/toothed rail lubrication,cleaning,renewals and test duties remain actual separate phases. No universal gradient,tyre life,friction,wear or traction efficiency is supplied. Identify independently support,propulsion and braking:wheel-supported linear motors retain wheel contact plus primary coil/secondary reaction plate;levitation retains actual magnets/coils/guidance,power electronics and guideway. Collect gross supply separately for propulsion,levitation/gap control,stationary levitation,auxiliaries,conditioning/cooling,standby and rescue with reconciled meter coverage. No assertion that a stopped/coasting train uses zero energy or that lack of rail contact makes all wear/maintenance zero. Actual superconducting or other systems require their own cryogenic/cooling/consumable and engineering evidence,not Linimo values. For every actual carrier follow its physical chain. External AC/DC and storage charge are not interchangeable;internal battery/fuel-cell/generator output and regenerated reuse are internal transfers,not extra imports. Battery initial installation/replacement and charging losses have separate covered gates. A fuel-cell route keeps actual delivered hydrogen state/purity/pressure,compression/liquefaction/conditioning,air/oxygen supply,water production,purge/leak/recovery and upstream route;hydrogen supplied is not assumed reacted or emitted,and no stoichiometric inventory substitutes actual quantities. A steam route retains actual fuel grade/carbon origin,boiler feed/makeup/condensate stock,pressure/temperature,heat/steam generation and use,blowdown,ash and actual releases;do not add internally made steam to its own fuel/boiler load or infer kg steam from kg fuel without independent evidence. Missing actual engineering/source data blocks completion,not the qualifying railway product. Keep actual underground ventilation/drainage,station climate/escalators/lifts/platform/control/signal,power conversion and depot/test/emergency sources with physical meter/asset scope. Ground-level,elevated and underground civil works and shared users have actual engineering quantities/life;no generic infrastructure intensity. Complete traction/station/depot/construction/repair/treatment providers replace exact covered fuel,power,materials,capital and releases;uncaptured collection transport/conditioning/current maintenance/EoL remain separately completed once. Native manufacture demand times compatible same-asset cohort duty/positive total all-user useful duty,then/N,is a covered delivered-phase allocation,not a full-life rail-service identity."
      evidence: "cp_mechanism;cp_operation;cp_maintenance;cp_assets"
    - id: atomic_native_completion
      applies_to: "all inventory rows"
      requirement: "Every actual unrepresented input,asset,provider,waste or released species/fate requires a concrete single identity/state with unique row_id,oneexistingprocess,direction/type,native property/unit/actual quantity,UUID or registered unresolved identity,raw record/source,same-parent CP,evidenced calculation/coverage/source/receiver and uncertainty. Link triggering requirement_id. Unknown occurrence/identity/quantity/fate blocks complete use,not zero or scope exclusion. Explicit affirmative evidence required for non-use or provider-covered omission."
      evidence: "all declared collection protocols"
validation_rules:
  - rule_id: validate_reference
    applies_to: "all inventory rows"
    rule: "Verify one unique actual product-output reference row, 1 Item(s), N > 0, same cohort/period and required qualifiers in both languages. Reconcile persons, tickets, passes and segment counts; do not convert seats, train departures or itinerary transfers into output without evidence."
    source_ids: []
  - rule_id: validate_closure
    applies_to: "all inventory rows"
    rule: "Reconcile actual duty and energy/fuel/water/material stocks, segment passenger loads, all-user allocation shares and full-life asset duty. A cancelled/empty operation may carry burden without completed output. Missing data, unmeasured exports or uncertain fates are not synthetic residuals or zero."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "all inventory rows"
    rule: "Check provider/foreground/upstream coverage once, internal transfers versus actual outputs, regeneration gross/net exclusivity, combustion origin/species/medium, kg N2O versus kg N and actual wastewater/waste gates. Require actual unresolved items to expand before a complete-service result."
    source_ids: []
  - rule_id: validate_comparability
    applies_to: "all inventory rows"
    rule: "Compare only matching rail service, origin/destination, distance, class, period, geography, energy/asset scope and quality. Disclose allocation and life/duty uncertainty and whether actual data are representative; no universal intensity, occupancy, trip length or asset life is authorized."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after all actual native identities,quantities,physical branches,provider coverage,fates and functional review are complete"
  allowed_use: "Actual64111public predetermined-route/schedule railway passenger leg within onecity/contiguouscities,all actual qualifying technologies with native obligations"
  excluded_use: "Interurban/tram/cable/sightseeing/mixedmode final products;generic ticket/personkm or unmodelled actual mechanism/provider/lifecycle gaps"
  required_metadata: "city_extent_and_contiguity; public_availability; predetermined_route_and_schedule; actual_support_propulsion_mechanism; service_type; origin; destination; actual_segment_distance; completed_person_leg_definition; N; train_service_and_configuration; class_and_quality; timetable_and_period; actual_energy_state_and_supplier; empty_and_cancelled_duty; accompanying_loads_and_coproducts; station_depot_provider_coverage; asset_lifetime_and_duty; geography_and_border_scope; direct_emission_medium"
  required_quality_disclosure: "Actual identities and mandatory gaps; N and distance quality; allocation/all-user scope; providers and capital life; regeneration accounting; factor applicability; measured versus projected asset duty"
  update_trigger: "Changed route, timetable, propulsion, class/load distribution, provider coverage, assets/lifetime, source/medium/fate, allocation or reference-service definition"
data_sources:
  - id: "unsd-cpc3-passenger-rail-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Ver.3.0 Explanatory Notes,30 June2025, printed/PDF pp358–362; subclasses64111 and64210. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Only actual64111single/contiguous-city public predetermined-route/schedule railway and accompanying-item inclusions,tram64112exclusion;adjacent64210/64119context distinguishes other functions. No Countunit,quantity or detailed PCR algorithm prescribed."
  - id: "eurostat-rail-manual-2025"
    type: "official_guidance"
    reference: "Eurostat, Reference Manual on Rail Transport Statistics, version12.0, April2025, pp30–31. https://ec.europa.eu/eurostat/documents/29567/3217334/Reference%2BManual%2Bon%2BRail%2B%2Btransport%2Bstatistics%2C%2BVer%2B12.pdf"
    used_for: "Distinct passenger counts, passenger-distance and train-distance concepts. Statistical national-territory truncation is not the boundary of this PCR; actual service-leg definition and attribution are declared here."
  - id: "ipcc-mobile-combustion-rail"
    type: "official_guidance"
    reference: "IPCC,2006 Guidelines for National Greenhouse Gas Inventories,Vol2,Ch3,§3.4 pp3.39–3.46. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Rail traction/fuel and direct-gas activity/technology distinctions; electricity-generation burdens are separate from train combustion. No default numeric factor or historical deterioration rate adopted."
  - id: "ghg-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD,Product Life Cycle Accounting and Reporting Standard,2011,chapters7 and9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary transparency and subdivision/physical-allocation hierarchy. Capital inclusion is an explicit expanded PCR choice, not a requirement attributed to this GHG-only standard; no universal rail allocation share adopted."
  - id: "hitachi-urban-monorail-2005"
    type: "handbook"
    reference: "Hitachi Review54(4),2005,China’s First Urban Monorail System in Chongqing,pp193–197,especially bogies/electricalequipment p196. https://www.hitachi.com/ICSFiles/afieldfile/2005/12/26/r2005_04_107.pdf"
    used_for: "Actual dated monorail running/guide/auxiliary tyres,nitrogen and beam/electrical interfaces only;no imported numerical tyre count,pressure,capacity,efficiency,wear/life or general factor."
  - id: "jametro-linear-mechanism"
    type: "handbook"
    reference: "Japan Subway Association,How does a linear motor car work?,actual primary technical page read2026-10-21. https://www.jametro.or.jp/tips/linear/how-linear-motor-works/"
    used_for: "Wheel-supported linear motor,coil/reactionplate propulsion/braking distinction only;not universal maglev assumptions or energyfactor."
  - id: "aichi-linimo-2019"
    type: "official_guidance"
    reference: "Aichi Prefecture,TobuKyuryoLine(Linimo),actual page dated21May2019 read2026-10-21. https://www.pref.aichi.jp/soshiki/kotsu/0000006670.html"
    used_for: "Actual electromagnetic suspension/linear propulsion,stationary levitation and separate infrastructure interfaces only;no speeds,gaps,capacity,frequencies,maintenancezero or quantitative factor adopted. Full original web content read,native HTML unavailable."
  - id: "sytral-rack-metro-2026"
    type: "official_guidance"
    reference: "SYTRAL Mobilités,Le métro C:unique au monde!,28July2026,actual operator article. https://magazine.sytral.fr/le-metro-c-unique-au-monde/"
    used_for: "Actual rack rail/metro and cleaning/renewal/test duties only;no uniqueness,gradient,closure duration or numerical factor adopted. Former funicular history does not change actual rack-drive function."
