system_boundary:
  rules:
    - rule_id: special_interurban_scope
      applies_to: "interurban_special_scheduled_road_service"
      rule: "Apply actual64222non-contiguous-city specific-user predetermined route/schedule or explicit scheduledinterurban shuttle function, including airport shuttle. The shuttle clause is independent: actual interurban geography/responsibility, without an added two-city or non-contiguous-city gate. Ticketaccess alone is not exclusion; airportdestination alone is not inclusion. No imported64114urban/ruralschool exception, public-alluser condition, fixedkm or nationalcutoff. Actual charter/hire/taxi/local/public/sightseeing interfaces follow fulfilled function."
