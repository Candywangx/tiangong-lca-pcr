product_category_identity:
  canonical_pcr_id: "pcr.inland-ferry-passenger-leg-service"
  classification_refs: "CPC3.0 64121 Inland water transport services of passengers by ferries; dedicated full scope, exact"
  covered_products: "Actual inland river/canal/other-inland-water ferry passenger legs, any schedule, including hydrofoils/hovercraft and accompanying vehicles/luggage/animals/items"
  excluded_products: "Coastal/ocean ferry as such; other non-ferry water transport; inclusive cruise/sightseeing/excursion; booking-only; no-operator rental or standalone vessel/crew availability; independent freight function"
  representative_product: "Completed inland ferry passenger transport leg"
  production_route: "Actual inland ferry fulfilment, ship/shore propulsion/lift/hotel, accompanied load and provider interfaces, independent fates and complete lifecycle"
  market_state: "Actually completed qualified inland ferry passenger leg with actual inclusion/quality/period evidence"
functional_unit:
  what: "Completed inland ferry passenger transport leg"
  how_much: "1 actual completed inland ferry passenger leg"
  how_well: "Actual ferry function/inland waterbody, OD/ports/calls, vessel/drive/lift configuration, accompaniment and accepted quality/accessibility"
  how_long_or_cycle: "Actual completed boarding-to-alighting interval and declared operating cohort/period; full supporting/asset duty separately attributed"
  reference_flow_link: "completed_inland_ferry_leg"
system_boundary:
  rules:
    - rule_id: service_start
      applies_to: "ferry_delivery"
      rule: "Include actual completed passenger leg, covered accompaniment and unavoidable attributable embarkation/disembarkation, voyage, hotel and port support. Record actual waterbody/OD, vessel configuration and included service; no arbitrary distance divides inland from coastal/ocean."
      source_ids:
        - un-cpc3-2025
    - rule_id: duty_pool
      applies_to: "vessel_operation;port_support"
      rule: "Include attributable manoeuvring, waiting, hotelling, empty/repositioning, charging, maintenance/test and failed/interrupted duties within the evidenced service pool. Their lack of completed passengers is not evidence of zero burden. Preserve period/cohort causality."
      source_ids: []
    - rule_id: provider_cells
      applies_to: "all_processes"
      rule: "Use an explicit provider-by-vessel/voyage/port/stage/period coverage ledger. Either consume a completed compatible supplier result plus only uncaptured integrator burdens, or own physical inputs and link uncovered external stages. A provider-included fuel supply, use-phase release, vessel manufacture or waste treatment replaces that exact foreground cell, never coexists with it; gaps require mandatory expansion."
      source_ids: []
    - rule_id: capital_complete
      applies_to: "vessel_lifecycle;port_support"
      rule: "This PCR explicitly requires attributable vessel and shore-asset manufacture, original/replacement equipment, maintenance, dry-dock, charging/mooring/quay/terminal assets and retirement/end-of-life. Verify actual delivery gates and coverage before lifetime allocation. A manufacture-only ship identity does not cover the other stages; no lifetime service fiction or unsupported universal life."
      source_ids:
        - ghg-product-2011
    - rule_id: chemical_fates
      applies_to: "vessel_operation;onboard_residues"
      rule: "Keep actual fuel, lubricant, refrigerant, cooling, cleaning and coating supply/stock/use/recovery/fates separate. Assess each actual bilge, black/graywater, scrubber washwater/sludge, ballast intake/discharge/sediment, garbage, antifoulant leachate and hull-cleaning residue. Actual species, receiving freshwater/seawater/soil/air and subcompartment must be identified; waste handover and direct environmental release are different exchanges."
      source_ids:
        - imo-pollution
    - rule_id: crew_and_inclusions
      applies_to: "ferry_delivery;vessel_operation"
      rule: "Working crew are operational support, not passenger output. Include actual attributable crew accommodation, sanitation and operator-provided meals/support and any included passenger amenities. Ordinary off-duty personal subsistence is excluded as an explicit PCR choice, disclosed for comparison; this does not remove onboard operational provisions or justify zero emissions. Actual separately transported off-duty passengers require evidenced passenger status."
      source_ids: []
    - rule_id: architecture_duties
      applies_to: "vessel_operation;vessel_lifecycle;port_support"
      rule: "Select actual displacement, hydrofoil or air-cushion architecture from vessel evidence. For hydrofoils include displacement/transition/foilborne periods, foil controls/actuators, actual foil/strut repairs and materials. For hovercraft include lift-fan and thrust energy, inflate/deflate/idle operation, shore/beach approach and actual skirt wear/replacements/residues; never omit lift energy or assume a propeller-only fuel profile. Whole-craft original parts replace their exact component manufacture cells. Actual fan/propeller air movement is internal physical operation, not a fabricated pollutant flow. Other architectures or chemical-energy routes require documented specific completion/review, not an assumed generic efficiency."
      source_ids:
        - hydrofoil-case
        - hovercraft-architecture
    - rule_id: native_provider_activity
      applies_to: "purchased_inland_ferry_leg"
      rule: "For actual provider result q_u per verified native unit u, apply measured compatible demand A_u times supported cohort/all-user share and /N once. This Count card is only one completed matching inland ferry person-leg with its real accompaniment/quality/OD scope. Native voyage/hour/vehicle-distance/pkm/other supplier outputs need their own concrete identity and evidenced conversion/demand, not a relabelled Count. Provider-covered ship/shore manufacture,use,emission,support and treatment cells replace only exact local cells; own physical legs are not purchased from oneself."
      source_ids: []
    - rule_id: inland_ferry_and_accompaniment
      applies_to: "ferry_delivery"
      rule: "Confirm actual inland waterbody and ferry function, not every boat or a nominal route length. Record each actual person including every vehicle occupant once; link each actual accompanying vehicle/item crossing once with trip/party/segment records rather than multiplying it by occupants. Separate included accompaniment from independent vehicle-deck/cargo outputs, preserving all real responsibilities and their own native output rows. Real inland/brackish/freshwater/other receiving specificity follows measured location and releases, not code-derived convenience."
      source_ids: []
    - rule_id: transported_objects_and_actual_outputs
      applies_to: "ferry_delivery;vessel_operation;port_support;vessel_lifecycle"
      rule: "An accompanying vehicle,animal,luggage or item is the transported object,not automatically a ferry production asset/input. Do not add its own manufacture,rearing or complete lifetime merely because it accompanies a passenger. Real transport-time handling,care,provision,sanitation,loading/support assets and releases/fates remain included at actual owners/native quantities. A fee line or separately priced accompaniment does not alone prove an independent co-product; subdivide/allocate only genuinely distinct delivered output functions,with their actual native output rows and no repeated passengers or objects."
      source_ids: []
