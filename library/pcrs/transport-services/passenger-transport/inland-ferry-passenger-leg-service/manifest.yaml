        inland ferry completed-person service identity confirmed in these
        bounded results; no freight/shipmanufacture/voyage/ticket/pkm
        substitution. Verified Countsupport is not service identity.
    - row_id: marine_distillate
      reason: Direct Marine diesel candidate is at-sea fishing-vessel burned-use gate;
        direct Gas oil candidate is refinery fraction/intermediate for later
        blending,not verified marine distillate bunker supply. Generic road
        Diesel is not a marine-grade proof. Both bounded queries exhausted.
    - row_id: vessel_shore_dc
      reason: Direct DC candidates constrain factory point of use below1kV or CN800kV
        production mix; other DC result is microbial reactor terminal. These do
        not verify actual external vessel charging-inlet gate/provider loss
        coverage. Internal DC bus is not external supply proof.
    - row_id: collected_bilgewater
      reason: Direct candidates describe oil-contamination treatment or broad
        industrial waste liquid at plant; initial/refinement lack collected wet
        engine-room bilge mixture at reception handover. Pure used lubricant and
        sludge are distinct identities.
    - row_id: held_blackwater
      reason: Direct untreated municipal wastewater candidate is treatment-plant
        inlet,not ship toilet holding-tank/reception gate; other candidates
        industrial washwater/sludge. No exact native blackwater mixture and
        handover verified.
    - row_id: ferry_manufacture
      reason: Direct-read generic ferry/ship and completed-vessel manufacture
        candidates are native Mass and broad configuration; they do not confirm
        the actual complete displacement ferry at native Count handover. No
        mass-to-count relabelling.
    - row_id: hydrofoil_manufacture
      reason: Initial and single source-supported foil/control whole-craft refinement
        returned fishing fuel,parts/wind machinery rather than actual complete
        battery-electric hydrofoil manufacture Count; no coherent exact
        identity.
    - row_id: hovercraft_manufacture
      reason: Initial and single lift/skirt/thrust whole-craft refinement returned
        wind nacelles,aircraft or material families,not complete passenger
        air-cushion manufacture Count. Same fulfilled ferry-leg function does
        not erase actual asset identity.
