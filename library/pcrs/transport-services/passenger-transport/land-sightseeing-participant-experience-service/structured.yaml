  calculation_rules:
    - id: normalize_participants
      applies_to: "all inventory rows"
      rule: "Attribute actual compatible native quantities to the functionally consistent fulfilled participant cohort with direct/justified shared coverage,then divide once by positive actual N. Do not also divide by tickets,boardings,loops,occupancy,guide groups or head-time to invent another reference."
      inputs:
        - cp_participants
        - cp_motor
        - cp_cable
        - cp_human
        - cp_animal
        - cp_support
        - cp_providers
        - cp_maintenance
        - cp_assets
        - cp_waste
        - cp_emissions
      output: "native quantity per1Item(s) fulfilled participant"
      source_ids: []
    - id: delivered_phase_equivalence
      applies_to: "working_horse;motor_coach_supply;motor_car_supply;pedicab_supply;horse_carriage_supply;nonrail_cable_installation"
      rule: "For each physical asset/system or animal,attributed delivered-phase demand=actual delivered native quantity times studied compatible duty/positive documented same-asset all-user total-life duty;then/N once. Record phase kind:manufacture/installation or prior rearing,not whole-life service. Life and duty must refer to the same physical cohort/compatible basis;animal resting/support periods and other real uses remain accounted. Independently add uncovered operating/care,renewals and retirement;no annual purchase,depreciation,wages or generic head-year factor."
      inputs:
        - cp_assets
        - cp_participants
        - cp_animal
        - cp_cable
      output: "actual manufacture/install or prior-rearing native equivalents per reference"
      source_ids: []
    - id: animal_physical_balance
      applies_to: "working_horse;horse_grass_hay;animal_tap_water;horse_faeces;horse_urine;animal_respiration_co2;animal_enteric_ch4"
      rule: "Actual animal species/age,working and resting head-time,ration/water,health/stabling/bedding and all users require records. Keep prior rearing/delivered animal coverage and current feed/care/manure periods exclusive:an inclusive lifetime provider replaces matching local care/releases,not another full-life load. Feed C/N/moisture,body stock,respiration/enteric releases,faeces/urine and actual fate must close physically;stocks/loss residuals are not invented emissions. Equid guidance and livestock context do not supply a generic all-species or cattle conversion."
      inputs:
        - cp_animal
        - cp_assets
        - cp_waste
        - cp_emissions
      output: "actual C/N/water/body/species and source/fate reconciliation before normalization"
      source_ids: []
    - id: supplemental_exposure
      applies_to: "sightseeing_land"
      rule: "Record actual dates/window days,loops,participant/vehicle distance,guide sessions/hours,animal head-time and coupled-system duties independently. Supplemental exposure does not replace actual fulfilled participant N or any purchased provider native unit."
      inputs:
        - cp_participants
        - cp_motor
        - cp_cable
        - cp_human
        - cp_animal
        - cp_providers
      output: "supplemental actual exposure only"
      source_ids: []
  data_quality_requirements:
    - id: actual_fulfilment
      applies_to: "fulfilled_sightseeing_participant"
      requirement: "Require actual supplied passenger sightseeing function,nonrail mode,itinerary OR real flexible window,activation/use/fulfilment,actual dates/days/loops/quality/inclusions,roles and positive compatible N. No forced full circuit,ticket/boarding/unusedpass=completion or guessed participant data. Unknown actual function/use blocks completed-experience data production."
      evidence: "cp_participants"
    - id: actual_motor
      applies_to: "motor_diesel;motor_gasoline;charging_ac"
      requirement: "Each actual carrier/grade/blend/traction/auxiliary,ACDC/charging/export needs independent concrete native identity/amount/technology/coverage. Wholeblend+ledger OR replacing components exclusive;supply/withdrawal/burn/spill/recovery distinct;internal storage/regeneration not new supply. Other real motor configurations stay in scope with actual evidence."
      evidence: "cp_motor"
    - id: actual_cable
      applies_to: "cable_drive_ac;nonrail_cable_installation"
      requirement: "Prove real sightseeing/nonrail mechanism and complete coupled drive/directions/empty/standby/rescue/test/weather/all-user scope. Complete rope/gear/carrier/station/tower/control/rescue/site original/renewal/retirement native exchanges and actual source/receiver quantities. No cable-name classification,mgh/load-proportion/default power or regenerative credit."
      evidence: "cp_cable;cp_assets"
    - id: actual_human
      applies_to: "support_tap_water;support_ac;purchased_commentary"
      requirement: "Record actual driver/guide/handler/participant roles and human/electrical assistance. Disclose ordinary human subsistence convention,assess real dedicated work food/drink/PPE/safety and included participant food/providers;no wage/calorie-to-fuel factor or presumed zero actual support. Each actual input requires native identity/quantity/coverage."
      evidence: "cp_human;cp_support"
    - id: actual_animal
      applies_to: "working_horse;horse_grass_hay;animal_tap_water;horse_faeces;horse_urine;animal_respiration_co2;animal_enteric_ch4"
      requirement: "Every actual animal species/cohort,use/rest,ration/ingredient/state/moisture/CN/water/body-stock and care/stable/bedding/source/receiver needs independent applicable identity/native quantity and physical balance. Examplehorse/hay is not allspecies/feed. Complete prior-rearing/current-feed provider nonoverlap and actual respiration/enteric/manure/urine/treatment states;unknown source/fate is not zero,no cattle factor or drywet/kgN shortcut."
      evidence: "cp_animal;cp_assets;cp_waste;cp_emissions"
    - id: actual_support
      applies_to: "purchased_commentary;support_tap_water;detergent;support_ac"
      requirement: "Expand each actual included commentary/audio/headphone/digital/IT,food/drink/recipe,entry/attraction/connection,safety/accessibility or work support as concrete native services/inputs. Actual inclusions not deleted,not universally assumed. Complete provider replaces exact personnel/transport/gear/energy/material/waste/capital cells;fees are not activities."
      evidence: "cp_support;cp_providers"
    - id: actual_capital
      applies_to: "motor_coach_supply;motor_car_supply;pedicab_supply;horse_carriage_supply;nonrail_cable_installation;working_horse"
      requirement: "Complete actual configured manufactured assets/installation and reared-animal delivery phases separately,with positive same-asset all-user complete-life duty and uncertainty. Cover missing original/replacement battery/gear/harness,road/path/site/infrastructure,care/maintenance and retirement once. No full-life UUID or duplicate prior-rearing/current feed/manufacture/wholecomponent coverage."
      evidence: "cp_assets;cp_animal"
    - id: actual_fates_species
      applies_to: "spent_oil;collected_washwater;horse_faeces;horse_urine;co2_fossil;ch4_fossil;n2o;pm25;r134a_air;animal_respiration_co2;animal_enteric_ch4"
      requirement: "Every actual waste,wastewater,faeces/urine/bedding mixture,filter,sludge,retired asset/component,food/packaging and chemical/substance/particle/receiver requires separate concrete native state/amount,source/recipient/treatment responsibility. Actual mixtures measured;unrelated wastes never collapsed. Retain actual wetdry/CN/species and known receiving specificity;unknown is not zero or automatic unspecified air."
      evidence: "cp_animal;cp_waste;cp_maintenance;cp_emissions;cp_assets"
    - id: atomic_completion
      applies_to: "all inventory rows"
      requirement: "Each actual expansion carries unique row_id,one actual process,direction/type,verified concrete UUID or registered unresolved identity,native property/unit/real amount,source/provider/recipient gate and a valid same-parent CP linked to its triggering requirement_id. Actual non-use/provider inclusion needs affirmative evidence. Missing identity/quantity/coverage/fate blocks complete downstream use,no guessed range or optional deletion."
      evidence: "all declared collection protocols"
validation_rules:
