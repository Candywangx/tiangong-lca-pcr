      collection_method: "Measure actual releases or use independently supported applicable species/technology/fuel/control/activity methods with explicit scope/basis. Species mass is not C/N/CO2-equivalent,and supplied fuel/feed or recharge does not establish release. Retain known receiver specificity and justify unspecified air;separate nonoverlapping particle/manure/enteric/respiration/provider stages. Aggregate compatible actual quantities and /N once;missing actual species/source/receiver blocks completion."
