system_boundary:
  rules:
    - rule_id: actual_experience
      applies_to: "sightseeing_land"
      rule: "Start from the actual supplied passenger sightseeing itinerary/window and its activation/use/fulfilment,quality,inclusions and operator/participant roles. A scenic destination alone does not turn ordinary transport into sightseeing;actual included commentary/food/entry/connections remain in their real function. Separate merely arranged bookings,standalone guides and bare rental only at actual product boundaries."
      source_ids:
        - unsd-land-sightseeing-2025
    - rule_id: provider_phases
      applies_to: "sightseeing_land"
      rule: "Assign every actual activity,source,provider,body/asset,period and stage one owner. Complete purchased tour,transport,guide,audio/IT,food,attraction,animal-care,repair or treatment results replace their exact included foreground inputs/releases/capital once;expand missing cells only. Preserve native supplied units and supplied function,not invoice money or an internal transfer treated as a new purchase."
      source_ids:
        - ghg-product-standard-2011
    - rule_id: motor_energy
      applies_to: "sightseeing_land"
      rule: "Collect real fuel/grade/blend and traction/auxiliary source duties. Wholeblend input+composition/origin ledger OR actual physical components replacing matching blend coverage,never both. Supply,withdrawal,burn,spill,recovery/stock/transfer differ;emissions use evidenced actual source activity. Internal battery/regeneration and recovered heat are not new external supply;actual exports have one gate/owner and no second avoided-energy credit."
      source_ids:
        - ipcc-mobile-combustion-2006
    - rule_id: human_roles
      applies_to: "sightseeing_land"
      rule: "Actual human effort is not animal feed or fuel. Ordinary human subsistence is a disclosed method boundary,not a measured zero or a calorie/wage-to-emission factor. Assess actual dedicated work food/drink,PPE,safety and other support;participant food actually supplied in the experience remains included. Record actual human/electrical assistance rather than assume a pedicab name establishes propulsion."
      source_ids: []
    - rule_id: animal_lifecycle
      applies_to: "sightseeing_land"
      rule: "Actual animal species/age,working and resting head-time,ration/water,health/stabling/bedding and all users require records. Keep prior rearing/delivered animal coverage and current feed/care/manure periods exclusive:an inclusive lifetime provider replaces matching local care/releases,not another full-life load. Feed C/N/moisture,body stock,respiration/enteric releases,faeces/urine and actual fate must close physically;stocks/loss residuals are not invented emissions. Equid guidance and livestock context do not supply a generic all-species or cattle conversion."
      source_ids:
        - ipcc-livestock-2019
    - rule_id: cable_coupling
      applies_to: "sightseeing_land"
      rule: "For actual non-rail cable mechanisms collect the complete coupled system,directions,carriers,loads,station/drive/control/heating/standby/rescue/test and actual gross source energy across all users. Do not infer energy from nominal power,mgh,load proportion or net avoided electricity. Rope,gear/vehicles,towers/stations/site,controls/rescue,renewals and actual manufacture/operation/retirement gates remain independent. Rail-guided systems need their actual rail method rather than a name-based non-rail classification."
      source_ids:
        - eu-cableway-interfaces-2016
    - rule_id: capital_and_fates
      applies_to: "sightseeing_land"
      rule: "Delivered manufactured assets/installed systems cover only verified manufacture/installation/supply;reared-animal demand covers only evidenced rearing/delivery phases. Compatible same-asset all-user life allocates that native demand,not a full-life sightseeing identity. Complete uncovered original/replacement components/batteries/harness,path/site/infrastructure,repair and retirement once. Independently identify actual water,oil,animal/wash residues and each air/water/soil species/receiver;actual recycling/disposal/treatment,not regulatory permission or assumed zero."
      source_ids: []
