allocation_rules:
  - rule_id: direct_first
    applies_to: "sightseeing_land"
    rule: "Subdivide dedicated actual participant/itinerary/provider resources first. Included repeated rides,commentary,entry or food are constituents,not extra final outputs. Native group-guide/session/vehicle services retain actual outputs without Count experience equivalence. Independent real products require real boundaries and reviewed allocation."
    source_ids: []
  - rule_id: physical_shared
    applies_to: "sightseeing_land"
    rule: "For residual common resources use demonstrated actual causal drivers across all products/users and aligned period. Actual distance,time,occupied exposure,animal work/rest support or coupled-system resource records may apply with evidence. Capacity,tickets,fare,equal group shares and assumed occupancy are not defaults;person-distance and tonne-distance cannot be added."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: unused_failure
    applies_to: "sightseeing_land"
    rule: "Retain actual unused-pass/unfulfilled,empty/positioning,waiting,standby/test/weather/rescue and failed/partial resources in their evidenced causal pool. Unknown activation/use is not guessed completion. N=0 preserves numerator for boundary/period resolution and has no finite per-participant intensity."
    source_ids: []
  - rule_id: delivered_phase_life
    applies_to: "sightseeing_land"
    rule: "For each physical asset/system or animal,attributed delivered-phase demand=actual delivered native quantity times studied compatible duty/positive documented same-asset all-user total-life duty;then/N once. Record phase kind:manufacture/installation or prior rearing,not whole-life service. Life and duty must refer to the same physical cohort/compatible basis;animal resting/support periods and other real uses remain accounted. Independently add uncovered operating/care,renewals and retirement;no annual purchase,depreciation,wages or generic head-year factor."
    source_ids: []
  - rule_id: recovery
    applies_to: "sightseeing_land"
    rule: "Actual reused product,waste/treatment,retired whole object/components and external energy output retain distinct native gates and one ownership method. Do not double recovered oil/manure product and waste/provider treatment. No automatic avoided car,feed,fertilizer,virgin material or grid credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_participants
      process_id: "sightseeing_land"
      flow_role: "Actual participant fulfilment"
      record_type: "participant_itinerary_window_ledger"
      raw_fields: "participant/windowID;actualsupplierfunction;mode/nonrailmechanism;fixed/flexitinerary;activation/use/fulfilment;dates/days/loops/stops/actualduration/quality;participants/driverguidehandlerroles;inclusions/providers;unused/partial/failed;period"
      collection_method: "Reconcile actual offers/activation/use and itinerary/fulfilment records. N=sum actual fulfilled functionally compatible participants for the declared fixed route OR real flexible service window;record actual days/loops/providers without forcing a full circuit. Repeated boardings/tickets/capacity/unused passes do not automatically create N. Unknown use remains unresolved and all unfulfilled resources stay in their causal pool."
      unit: "Item(s);persons;days;h;km"
      frequency: "Each actual event/window/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual aligned cohort/period and same-asset life interfaces"
      site_scope: "Actual applicable native route/provider/source cells,all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records,native identity/method/receiver proof,coverage/calibration,closure and uncertainty"
    - protocol_id: cp_motor
      process_id: "sightseeing_land"
      flow_role: "Actual powered vehicle energy"
      record_type: "motor_fuel_meter_duty_ledger"
      raw_fields: "vehicle/source/duty;actualgrade/blend/chemistry/carbonorigin;whole/componentrepresentation;supplied/stock/withdrawal/burn/spill/recovery/transfers;loading/empty/stops/wait/terrain;auxiliary/charging/ACDC/storage/regeneration/export;allusers/provider"
      collection_method: "Use actual reconciled fuel receipts/stocks,source meters and duty/terrain records. Wholeblend+origin ledger OR replacing physical components are exclusive;distinguish supply/withdrawal/burn/spill/recovery. Actual source activity—not nominal vehicle branding or supplied mass—supports emissions. Internal generation/storage/regeneration is not another imported supply. Attribute native quantities using evidenced all-user drivers,then/N once."
      unit: "kg;kWh;nativevolume;km;h"
      frequency: "Each actual event/window/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual aligned cohort/period and same-asset life interfaces"
      site_scope: "Actual applicable native route/provider/source cells,all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records,native identity/method/receiver proof,coverage/calibration,closure and uncertainty"
    - protocol_id: cp_cable
      process_id: "sightseeing_land"
      flow_role: "Actual coupled non-rail cable duty"
      record_type: "coupled_nonrail_installation_ledger"
      raw_fields: "actualmechanism/nonrailproof;installation/period;allcarriers/directions/users;grossmeter/drive/control/heat;loadedempty/standby/test/rescue/weather;imports/exports/regeneration;components/maintenance/provider"
      collection_method: "Collect actual whole coupled-installation supply and duty coverage;submeter only with reconciled total boundaries. All actual directions,emptycarriers,standby/rescue/testing and other users stay accounted. No nominal-power,mgh,load-proportion or automatic regenerative credit. Keep native component/manufacture/maintenance phase scope;assign justified all-user shares and /N once."
      unit: "kWh;nativeunits;h;km"
      frequency: "Each actual event/window/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual aligned cohort/period and same-asset life interfaces"
      site_scope: "Actual applicable native route/provider/source cells,all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records,native identity/method/receiver proof,coverage/calibration,closure and uncertainty"
    - protocol_id: cp_human
      process_id: "sightseeing_land"
      flow_role: "Actual human role and dedicated support"
      record_type: "human_role_work_support_ledger"
      raw_fields: "person/role;actualtask/effort/time;human/electricalassistconfiguration;ordinarysubsistenceboundary;actualdedicatedfood/drink/PPE/safety;includedparticipantfood;provider/phases/uncertainty"
      collection_method: "Record actual guide/driver/handler/participant roles and mechanism. Disclose ordinary-human-subsistence convention and assess actual dedicated work consumables/support with real supplier/quantity and sensitivity. No wage/calorie-to-fuel/emission factor or automatic equivalence to animal metabolism. Match actual included participant food;complete provider replaces its scope. Assign actual uncovered native quantities and /N once."
      unit: "h;actualnativefood/supportunits"
      frequency: "Each actual event/window/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual aligned cohort/period and same-asset life interfaces"
      site_scope: "Actual applicable native route/provider/source cells,all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records,native identity/method/receiver proof,coverage/calibration,closure and uncertainty"
    - protocol_id: cp_animal
      process_id: "sightseeing_land"
      flow_role: "Actual animal feed,body and releases"
      record_type: "species_feed_body_fate_balance"
      raw_fields: "actualspecies/head/age;working/restingtime/allusers;ration/state/asreceived/drymatter/moisture/CN;waterintake;bodyCNwaterstock;respiration/enteric;faeces/urine/bedding/mixing;health/stabling;receiver/treatment;rearing/currentfeedproviderperiods;uncertainty"
      collection_method: "Reconcile actual species-specific ration/purchases/grazing/stock,intake/body growth-loss,C/N/water and measured/modelled respiration/enteric/faeces/urine with independently applicable physiology. Retain work/rest/care and all user periods,no default cattle factors. Actual feed and wet/dry residues are not interchangeable;close documented balances without inventing residual releases. Keep prehandover rearing/provider phases exclusive from current feed/care/manure. Actual collected mixed manure replaces its same constituents;receiver/treatment and direct releases remain distinct. Assign evidenced native quantities and /N once."
      unit: "head;head-time;kgasreceived;kgdrymatter;kgC;kgN;specieskg"
      frequency: "Each actual event/window/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual aligned cohort/period and same-asset life interfaces"
      site_scope: "Actual applicable native route/provider/source cells,all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records,native identity/method/receiver proof,coverage/calibration,closure and uncertainty"
    - protocol_id: cp_support
      process_id: "sightseeing_land"
      flow_role: "Actual included tour support"
      record_type: "guide_food_audio_site_support"
      raw_fields: "actualinclusion/quality;commentary/audio/IT/headphones;food/drink/recipe/attraction/entry/connection;safety/accessibility/PPE;nativeproviderunit;water/chemical/energy/stock/waste;allusers/coverage"
      collection_method: "Read actual offer,inclusion/work/provider and meter/stock records. Each actual supplied food,commentary,audioequipment,attraction,connection,safety or support input retains concrete identity/native quantity and coverage. Included functions cannot be deleted;fees are not physical inputs. Complete provider/ingredient-energy-waste coverage are exclusive. Assign direct then evidenced shared uncovered native resources; /N once."
      unit: "nativefunctions;kWh;m3;kg;Item(s)"
      frequency: "Each actual event/window/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual aligned cohort/period and same-asset life interfaces"
      site_scope: "Actual applicable native route/provider/source cells,all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records,native identity/method/receiver proof,coverage/calibration,closure and uncertainty"
    - protocol_id: cp_providers
      process_id: "sightseeing_land"
      flow_role: "Actual complete provider scope"
      record_type: "native_provider_replacement_matrix"
      raw_fields: "actualprovidedfunction/nativeunit;quantity;session/group/time/participants;duration/language/audience/quality;ownvsprovider;personnel/transport/gear/energy/assets/material/waste/emissioncoverage;missingcells"
      collection_method: "Verify actual purchased function/native quantity and explicit phase replacement matrix. One live commentary session is not one participant or a complete group-tour output;hours/person-distance/asset services require separately justified exact equivalents,not forced Count. Complete result replaces its exact covered constituents;own driver-guide/internalservice not another purchase. Attribute uncovered native quantities and /N once."
      unit: "actualnativeunits;Item(s)sessions;h"
      frequency: "Each actual event/window/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual aligned cohort/period and same-asset life interfaces"
      site_scope: "Actual applicable native route/provider/source cells,all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records,native identity/method/receiver proof,coverage/calibration,closure and uncertainty"
    - protocol_id: cp_maintenance
      process_id: "sightseeing_land"
      flow_role: "Actual maintenance,refrigerants and used oil"
      record_type: "maintenance_charge_material_ledger"
      raw_fields: "asset/work;actualchemical/formulation/purity;originalfinalcharge;addedremovedrecovered/leakedmethod;lubricants/filters/oil/netwetdry;components/replacements;provider/treatment/receiver"
      collection_method: "Use actual monitored charge/material balances,work/stock and receiver records. Recharge is not leakage and unexplained loss is not automatically emission. Supplies,recovered products,collected wastes and real releases remain independent. Keep original/replacement and provider phases exclusive;complete actual missing chemicals/components/fates and /N once."
