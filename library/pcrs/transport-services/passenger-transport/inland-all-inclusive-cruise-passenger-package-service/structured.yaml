allocation_rules:
  - rule_id: direct_package
    applies_to: "inland_cruise_package"
    rule: "Subdivide dedicated passenger/package/class/provider resources first. One completed person package is final output; ship legs,cabin-nights,meals and performances actually included are constituents,not additional final co-products. Independent actual cargo,optional dining,rooms,shore services or energy outputs need separate function/gates."
    source_ids: []
  - rule_id: shared_pools
    applies_to: "inland_cruise_package"
    rule: "Allocate residual common resources by demonstrated actual causal drivers across all products/users and period. Submeter hotel/galley/propulsion where possible. Cabin area-time,actual occupied exposure or measured resource use may apply only with physical support. Berths,maximum capacity,assumed double occupancy,ticket prices and equal voyage fractions are not defaults; passenger-distance and tonne-distance cannot be added."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: crew_and_empty
    applies_to: "inland_cruise_package"
    rule: "Operating crew and performers are roles with actual attributable support,not extra passenger-package outputs. Retain standby,port hotel load,empty/repositioning,tests,partial/failed voyages and unfulfilled demand in evidenced pools. N=0 has no finite package intensity and does not delete the numerator."
    source_ids: []
  - rule_id: asset_lifetime
    applies_to: "inland_cruise_package"
    rule: "For each actual ship/component,attributed manufacture=actual delivered native quantity times studied compatible duty/positive documented same-asset all-user complete-life duty; then divide once by completed passenger-package N. Match numerator/lifetime to the same physical asset and compatible use; include all cruise and other actual users. Manufacture only; forecasts/uncertainty disclosed,not annual purchases,depreciation or berth occupancy as life."
    source_ids: []
  - rule_id: recovery
    applies_to: "inland_cruise_package"
    rule: "Track actual reused products,collected wastes,treatment and external energy output separately with one declared method and receiver. Do not claim both whole/component retirement or provider/foreground treatment. No automatic avoided virgin material,grid,fertilizer or travel credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_packages
      process_id: "inland_cruise_package"
      flow_role: "Actual completed passenger-package cohort"
      record_type: "package_manifest_and_acceptance"
      raw_fields: "package/passengerID;operator;waterbody;itinerary;ports;embarkation;acceptance;actualduration/nights;cabinclass/quality;actualoccupancy;food/entertainment/inclusions;connections;crewroles;partial/cancelled;period;actualinlandwaterbody/river/canal/lake;packagefunctionversus64133;acceptancegate;internallegs/returnboundary;actualclass/stay/food/inclusionsstrata;payload/crew/operatorroles"
      collection_method: "Reconcile actual offer,manifest,dispatch and fulfilment/acceptance. N=sum completed functionally compatible actual one-person packages; stratify different itinerary/duration/class/function. Count actual people without crew/seat/adult equivalence; cabin-nights,meals or voyage legs remain independent quantities. Do not count unknown/partial completion as full; retain numerator and redefine truly changed fulfilled products transparently."
      unit: "Item(s);persons;h;nights;km"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable inland package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_energy
      process_id: "inland_cruise_package"
      flow_role: "Actual fuel,power and hotel energy chain"
      record_type: "fuel_meter_stock_source_ledger"
      raw_fields: "ship/source/duty;marinegrade/chemistry;blend/components/origin;supplied/stock/withdrawal/burn/spill/recovery;converter/control;propulsion/hotel/galley/port/empty/test;grossshoreAC/DC;internalgeneration/heat;storage/regeneration/export;allusers;providercoverage;actualsources/converters/shaft/thruster;shipshore/metergate;charge/discharge/loss;manoeuvre/current/load/empty/standby;initialstock/periodtopup;sourcechemical/fates;allusers"
      collection_method: "Use actual reconciled bunker receipts,stocks and source/submeters/duty logs. Wholeblend+originledger OR replacing physical component supplies,never both. Keep supplied/withdrawn/burned/spill/recovery distinct. Separate internal generation/heat and actual imported interfaces without another external energy input. Assign compatible native quantities with justified actual all-user drivers;divide by positive completed-package N once. Missing carrier/converter evidence blocks data use,not canonical product scope. Close actual gross source/shore imports and exports, conversion/charge/discharge/storage/auxiliary and port-hotel demand across complete actual duty/all-user pools; onboard generation/steam/heat/internal recovery not new purchased energy. Separately owned initial long-term charge/store absent from whole manufacture uses actual delivered stock/compatible life and retained recovery; period topup and actual use/fates are independent, circulation/recondensation is not new supply."
      unit: "kg;kWh;nativevolume;h;km"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable inland package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_hotel
      process_id: "inland_cruise_package"
      flow_role: "Actual accommodation and linen supply"
      record_type: "actual_hotel_linen_scope_ledger"
      raw_fields: "cabin/service/provider;class/quality;occupiedpersons;actualhours/nights;cabinarea;nativeproviderunit/count;linen drymass/moisture;housekeeping/hotwater/HVAC/energy/chemical/water/capital/waste coverage;allusers;actualcabinprovider_q_u;nativeoccupiedA_u;hoursnights/servicedarea;linennew/used/laundereddrymass;laundrycycle/source;housekeeping/time;toiletries/formulation/packaging;sharedspaces/crew;exactcoveredcells"
      collection_method: "Read actual occupied-cabin/night/hour,linen/weighing,housekeeping and provider coverage records. Purchased cabin-night and dry-linen laundering results retain their native output,not passenger-package equivalence. Complete provider coverage replaces matching local hotel/linen/energy/water/chemicals/capital/waste. Owned rooms/laundry expand actual constituents without internal-purchase duplication. Subdivide class/dedicated resources then justify residual actual all-user drivers;divide native quantities by N once. For each actual accommodation/cleaning/laundry provider retain its native function and intensity q_u; multiply actual compatible occupied cabin-nights/hours, dry kg laundered or other evidenced A_u and causal cohort share, then/N once. Never assume one person=one cabin-night or wet laundry=new linen mass. Owned hotel/laundry uses actual cold/hotwater, thermal/electrical energy, detergents/toiletries, linen manufacture/replacements, machine/site life, waste and each receiving fate independently, omitting only exactly provider-covered cells."
      unit: "Item(s)actualcabin-night;h;kgdrylinen;nativeunits"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable inland package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_food
      process_id: "inland_cruise_package"
      flow_role: "Actual catering and food residues"
      record_type: "food_recipe_provider_stock_ledger"
      raw_fields: "actualmeal/drink/recipe/diet/servingsize;nativeunit;provider/ingredientmatrix;rawpreparationservedfood;edible/inedible/wetdry;stock/purchases/spoilage;galley/coldchain/water/packaging/energy;residue/cookingoil;receiver;crewvs passengermenus;actualprovider_q_u;nativeactualservingsA_u;ingredientSKU/state/formulation;recipebatch_yield/edibleinedible;rawcookedservedstocks;moisture;actualpackaging;pre/postconsumerwaste;nativefate/receiver"
      collection_method: "Reconcile actual food/serving/provider and stock/recipe/mass records,not a default meal-per-day rate. Externally prepared meal results replace their included recipe/energy/packaging/waste; owned galley uses actual ingredient/native inputs instead of another internal meal purchase. Record each actual ingredient/state,drink,stock loss,independent food residue/cooking oil/packaging and actual fate with native amounts. Separate passenger and attributable crew support,assign shared resources by physical evidence,then /N once. For each externally prepared actual meal/service q_u multiply actual compatible serving/content A_u and evidenced cohort share before/N; no ingredient-mass-to-meal or meal-to-package shortcut. Owned galley closes actual ingredient/formulation/raw/cooked/edible/inedible/moisture stocks, yields, independently measured losses/food residues/cooking oil and actual packaging/receivers. Every real ingredient, drink, chemical, package and residue is one atomic exchange; no plural food collector or residual waste/emission by guess."
      unit: "Item(s)actualmeals;kg;L;nativeunits"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable inland package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_water
      process_id: "inland_cruise_package"
      flow_role: "Actual water,sewage,bilge and receivers"
      record_type: "water_outlet_receiver_balance"
      raw_fields: "source/quality/state;supplied/abstracted/desalinated;nativevolume/mass;stock/reuse/evaporation;blackwater/greywater/bilge/ballast/scrubber;actualcomposition/wetbasis;separation/sludge/recoveredoil;holding/pumpout/directoutlet;freshwater/marine receiver;treatmentcoverage;actualinlandoutlet/location;freshwater/sewer/soil/othermedium;actualcomposition;independentwaterstockandwastefates"
      collection_method: "Measure actual each water/outlet and composition with stocks,meters and reception/operation logs. Supply is not wastewater. Keep distinct physical streams and real treatment/intermediate/recovered/waste versus direct release boundaries; a mixed stream requires actual measured mixing/composition,not arbitrary collection of unrelated fates. Independently complete each discharged species and receiver and each treatment service without duplicating provider-owned releases. Attribute native quantities and /N once; unknown destination is not zero. Record actual inland outlet and freshwater/sewer/soil/other receiving state; no marine compartment or maritime legal-rule assumption. Vessel sewage/bilge and galley/hotel/crew outlets retain their own measured composition/native mass, stocks and covered treatment events, not generic water-use equivalents."
      unit: "m3;kgwet;specieskg;nativeunits"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable inland package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_support
      process_id: "inland_cruise_package"
      flow_role: "Actual port,recreation,connections and support"
      record_type: "port_entertainment_connection_ledger"
      raw_fields: "actualinclusion/function;port/terminal/berth;excursion/air/ground/shuttle;entertainmenttype/venue/duration/audience;provider/nativeunit;crew/safety/accessibility;supplies/energy/assets/waste scope;allusers;actualnativeprovider_q_u;realcompatibleA_u;causalcohortshare;payloadhandling/stowage/safety/cleaning;actualprovidedanimalcare;crew/performerpassengerroles"
      collection_method: "Inspect actual offer and original work/provider records for each included function and actual native quantity. Included transport/shore/entertainment cannot be deleted. A complete external provider replaces its exact personnel/transport/equipment/energy/capital/waste cells; owned internal performance or transfer is not extra purchased output. Fees do not define physical quantities. Assign dedicated resources first,then supported shared all-user pools,then /N once. Native provider q_u times real compatible activity A_u times justified cohort/all-user share precedes/N once; only one-whole-reference-equivalent provider skips further normalization. Record actual included transport/excursion/guide/recreation demand in its own native units, not a new final package output. Distinguish passengers/payload from production assets; retain actual stowage/safety/cleaning and provided passenger/animal food/water/care."
      unit: "nativefunctions;Item(s)actualperformance;h;kWh;kg"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable inland package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_maintenance
      process_id: "inland_cruise_package"
      flow_role: "Actual maintenance and refrigerant balance"
      record_type: "maintenance_charge_fate_ledger"
      raw_fields: "ship/equipment;actualsubstance/formulation/purity;originalfinalcharge;add/remove/recover;work/source;usedoil;antifoul;wetdry/contents;receiver/providerphase;actualrelease/method;initiallongtermchargeversusperiodadditions;docking/cleaning/coating/repairwastes;actualreleaseversusrecovery"
      collection_method: "Use actual maintenance/stock/receiver and monitored charge records. Independently quantify supplies,recovered products,wastes and actual releases. Recharge is not leakage and unexplained deficit is not automatically emission. Preserve actual formulation and original/replacement equipment coverage; complete uncovered drydock/antifouling operations/materials/fates. Attribute nonoverlapping native quantities,then /N once. Initial long-term charge not included in equipment supply is not all current maintenance consumption: use actual stock/retained recovery and compatible asset/life attribution; actual period additions/use/fates stay causal. Read drydock hull/antifoul/cleaning/repair source and independent wastes/receivers; source regulatory description is not a zero or emission factor."
      unit: "kg;nativeunits"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable inland package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_assets
      process_id: "inland_cruise_package"
      flow_role: "Actual ship,infrastructure and lifetime demand"
      record_type: "same_asset_complete_life_register"
      raw_fields: "asset/cohort/configuration;deliverednativeamount/gate;originalcomponents/hotelfitout;studiedcompatible duty;positiveall-userlife duty;otheractualusers;forecast/uncertainty;replacement/drydock/retirement;providerstage;payloadversusoperatorasset;nativeinitialchargecoverage;samephysicalasset/allusercohort;drydock/shipshore/hotelfitoutmissingphases"
      collection_method: "Read actual supply/engineering/lifetime/duty/retirement records for the same asset/cohort. Manufacturing demand=actual delivered native quantity times studied compatible duty/positive total same-asset all-user complete-life duty;then /N once. The allocation covers manufacture/supply only,not whole-life cruise. Independently complete uncovered hotel/port/terminal/shorepower/equipment,maintenance/replacements and retirement; provider-covered fuel/emissions/phases replace matching local data. Transported passenger/private luggage/vehicle/animal bodies are not automatically acquired manufacture/rearing assets; actual operator-provided equipment and real working-production functions remain assessed. Complete native ship/port/hotel/galley/laundry/sanitary/coldchain/shorepower/refit/renewal/retirement ownership and same-asset all-user compatible life without double whole/initial/component supply."
      unit: "Item(s);asset-nativeunits;h;km"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable inland package/provider/source cells;all users and included responsibilities reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
    - protocol_id: cp_emissions
      process_id: "inland_cruise_package"
      flow_role: "Actual species,source and receiving medium"
      record_type: "species_source_medium_ledger"
      raw_fields: "actualsource/phase;fuel/converter/control/reagent/incinerator;burn/activity;sourcefactorversion/nativebasis;speciesmass/CN/CO2eq;carbonorigin;particlesize;receiver/subcompartment;provideroverlap;uncertainty"
      collection_method: "Measure actual releases or use independently supported applicable technology/species/fuel/control/activity models with explicit basis and source coverage. Fuel-LCA CO2-equivalent is not a full ship inventory or individual physical species. Preserve actual chemistry,known medium/subcompartment and particle overlap; justify unspecified air if used. Aggregate only nonoverlapping compatible species quantities and /N once. Unknown method/source/receiver blocks completion,not false zero."
      unit: "kgofeachactualspecies"
      frequency: "Each actual package/event/provider/meter;cohort reconciliation"
      temporal_coverage: "Actual compatible cohort/period;whole-life asset interface disclosed"
      site_scope: "Actual attributable package/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original actual records;native/source/receiver scope;calibration;closure and uncertainty"
  calculation_rules:
    - id: normalize_packages
      applies_to: "all inventory rows"
      rule: "Actual physical quantities use direct/causal compatible cohort share then /positive actual N once. For native provider intensity q_u first multiply actual compatible demand A_u and justified cohort/all-user share, then/N. Cabin-night/meal/dry-linen/performance/vessel-hour/distance is not package Count; only an exactly equivalent one-whole-declared-reference provider requires no further normalization. Exact included cells replace foreground once. Do not also divide by passengers/cabin occupancy/meals/nights/voyages."
      inputs:
        - cp_packages
        - cp_energy
        - cp_hotel
        - cp_food
        - cp_water
        - cp_support
        - cp_maintenance
        - cp_assets
        - cp_emissions
      output: "native quantity per1Item(s) completed inland passenger package"
      source_ids: []
    - id: asset_equivalence
      applies_to: "cruise_ship_supply"
      rule: "For each actual ship/component,attributed manufacture=actual delivered native quantity times studied compatible duty/positive documented same-asset all-user complete-life duty; then divide once by completed passenger-package N. Match numerator/lifetime to the same physical asset and compatible use; include all cruise and other actual users. Manufacture only; forecasts/uncertainty disclosed,not annual purchases,depreciation or berth occupancy as life."
      inputs:
        - cp_assets
        - cp_packages
      output: "actual native manufacture equivalents per reference"
      source_ids: []
    - id: supplemental_exposure
      applies_to: "inland_cruise_package"
      rule: "Record actual passenger-distance,cabin occupancy,hours/nights,meal counts and performance/support exposure separately from actual native provider input units and final package N. Supplemental totals do not convert the reference into pkm,roomnight or meal."
      inputs:
        - cp_packages
        - cp_hotel
        - cp_food
        - cp_support
      output: "supplemental actual exposure,not replacement reference"
      source_ids: []
  data_quality_requirements:
    - id: actual_package
      applies_to: "completed_cruise_package"
      requirement: "Require actual integrated inland transport/accommodation/food/incidentals,offer/inclusion matrix,passenger manifest,independent package boundaries and one-person fulfilment/acceptance,itinerary/duration/hours/nights,cabin/class/quality/actual occupancy,dining and actual other included contents. Actual64133standalone sightseeing/excursion differs by function,not marketing/snack/overnight. No minimum night/meal/occupancy imposed. Unknown function/completion blocks data,not source-dependent scope cuts."
      evidence: "cp_packages"
    - id: actual_energy
      applies_to: "marine_distillate;shore_ac;port_support_ac"
      requirement: "Expand each actual fuel/grade/blend/converter,DC/AC/heat interface and external export separately with real native identity/quantity/provider scope. Other fuels/propulsion are in canonical scope and require actual applicable evidence,not a road-diesel substitution. Wholeblend/components exclusive; supply/withdrawal/burn/spill/recovery distinct; internal generation/heat not new external supply."
      evidence: "cp_energy"
    - id: actual_food
      applies_to: "purchased_evening_meal;galley_food_residue"
      requirement: "Every actual included meal,drink,recipe/diet/size,ingredient/state,packaging,coldchain/galley service and food/cooking-oil/stock loss requires native quantities/identities and source/receiver. Complete meal/provider OR matching ingredient/foreground coverage,never both. No assumed meal rate or food composition. Unknown actual menu or burden scope blocks completion."
      evidence: "cp_food"
    - id: actual_hotel
      applies_to: "purchased_cabin_night;purchased_laundered_linen;tap_water;detergent"
      requirement: "Complete actual accommodation/class/occupancy/hours/nights,linen manufacture/replacement/laundry,housekeeping,HVAChotwater,refrigeration,toiletries,pools and support at real native gates. Purchased full accommodation/laundry replaces exactly covered local material/energy/waste/capital; owned internal service is not purchased again. Missing actual quantities or coverage blocks use."
      evidence: "cp_hotel;cp_water;cp_support"
    - id: actual_included_services
      applies_to: "purchased_musical_performance;port_support_ac"
      requirement: "Identify every actual included recreation/entertainment,shore excursion,guide,air/ground connection,port/terminal/berth,safety/accessibility and attributable crew support as independently specified native service/inputs. Never delete included items or equate fees with activities. Each provider/local coverage cell has one owner; unknown inclusion/quantity/scope blocks completion."
      evidence: "cp_support;cp_packages"
    - id: actual_water_fates
      applies_to: "tap_water;held_blackwater;collected_bilgewater"
      requirement: "Expand every actual water quality/withdrawal/desalination/receiver,greywater,blackwater,bilge,ballast,scrubber water,sludge,recovered oil,treatment product and each direct released species separately at measured composition/state/native quantity. Actual mixing needs real physical proof. Held reception waste is not automatically direct water emission or completed treatment; unknown receiver/stock/fate blocks completion."
      evidence: "cp_water;cp_emissions"
    - id: actual_material_assets
      applies_to: "cruise_ship_supply;r134a_supply;detergent"
      requirement: "Every actual ship/component,marine/hotel/port/shorepower asset,original/replacement battery or equipment,chemical/refrigerant/lubricant/antifoul/spare needs concrete native identity/amount/gate and exclusive provider phase. Complete same-asset positive all-user lifetime evidence and missing operation,maintenance/drydock and retirement; no double original/components or manufacture/full-life service."
      evidence: "cp_assets;cp_maintenance"
    - id: actual_waste_species
      applies_to: "spent_oil;galley_food_residue;co2_fossil;ch4_fossil;n2o;pm25;r134a_air"
      requirement: "Each actual solid/liquid waste,food,cooking oil,packaging/plastic,filter,ash,retired asset/component and actual species/source/medium/subcompartment requires a distinct concrete exchange,wet/native chemical amount and receiver/fate. No unrelated wastes merged,PM-size/provider/wholecomponent overlap,automatic recycling/discharge credit or missing-as-zero. Retain known air specificity rather than unspecified default."
      evidence: "cp_food;cp_water;cp_maintenance;cp_emissions;cp_assets"
    - id: atomic_completion
      applies_to: "all inventory rows"
      requirement: "Each actual expansion must carry unique row_id,one actual process parent,direction/type,concrete verified UUID or registered unresolved identity,native property/unit and real amount,source/provider/recipient gate and valid same-parent CP linked to its triggering requirement_id. Actual nonuse or provider inclusion needs affirmative proof. No unresolved actual required identity/quantity/coverage/fate may be used as a complete downstream result."
      evidence: "all declared collection protocols"
    - id: native_package_provider_and_payload
      applies_to: "inland_cruise_package"
      requirement: "For each actual native provider require q_u, real compatible A_u and causal share before one/N; full-reference equivalence only when actual full function/quality/time/boundary matches. Keep covered hotel/galley/laundry/shipcare/assets/fates exclusive and missing phases complete. Transported passengers/luggage/private vehicles/animals are not automatically manufactured/reared assets; actual supplied provisions/handling/care remain. Each actual alternative source/ship/ingredient/formulation/package/hotel/recreation/sanitary/waste/species needs native amount/source/receiver and unique atomic expansion,not a plural food or waste card."
      evidence: "cp_packages;cp_energy;cp_hotel;cp_food;cp_water;cp_support;cp_maintenance;cp_assets;cp_emissions"
validation_rules:
  - rule_id: package_reference
    applies_to: "inland_cruise_package"
    rule: "Reference is1Item(s) actual completed one-person integrated package. Match actual itinerary,cabin/accommodation duration/nights,dining and entertainment/other inclusions,acceptance and positive compatible N; reject automatic ticket,shipleg,roomnight,meal,berth or capacity equivalents."
    source_ids: []
  - rule_id: included_scope
    applies_to: "inland_cruise_package"
    rule: "All actual included inland package functions remain owned once,including actual connections/excursions; independent optional functions need actual separate gates. Internal ship legs/hotel/meals are constituents,not package co-products. No fuel/ship/identity/data gap silently shrinks full inland scope; exact dedicated classification does not imply foreground completeness."
    source_ids: []
  - rule_id: physical_closure
    applies_to: "inland_cruise_package"
    rule: "Reconcile supply/stock/burn/spill/recovery,wholeblend/component exclusivity,internal generation/heat/shore/import/export,actual food/linen/water/refrigerant native balances,wastes/species and known receivers. No guessed density,meal rate,occupancy,life or generic factor."
    source_ids: []
  - rule_id: provider_and_assets
    applies_to: "inland_cruise_package"
    rule: "Each provider/owned stage appears once. Preserve prepared-meal,cabin-night,performance and dry-linen native functions,manufacture-only asset gate and positive same-asset all-user life. Missing phases complete independently; avoid original/replacement/wholecomponent duplication."
    source_ids: []
  - rule_id: zero_and_failure
    applies_to: "inland_cruise_package"
    rule: "Retain actual empty/repositioned/standby/porthotel/test/partial/failed resource pools with matched period and all-user drivers;N=0 has no finite package intensity. Adult/child/crew,cabin occupancy and class records remain actual,not assumed."
    source_ids: []
  - rule_id: atomic_projection
    applies_to: "inland_cruise_package"
    rule: "Every CP process_id equals one existing processInventory.id and each card CP exists at its own parent. Bilingual rule/native/source fields and projection fingerprints match. Unresolved identities/quantity/source/coverage/fates block complete downstream use;checker pass is not external identity verification or publication approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after all mandatory actual identities,quantities,coverage,fates and functional review are complete"
  allowed_use: "Actual complete inland river/canal/other-inland-water package with declared itinerary,duration,cabin/class/quality/food/stay/inclusions/acceptance and lifecycle;actual alternative ships/sources require complete native evidence"
  excluded_use: "Generic ferry/leg/pkm/roomnight factor;ticket/capacity as completion;unmodelled included hotel/food/entertainment/connections;incomplete native/coverage/fate result"
  required_metadata: "actual provider and fulfilled cruise-package function; actual river/canal/other inland waterbody and ports; actual itinerary and embarkation/completion gate; accommodation hours and nights; cabin/class/quality and actual occupancy; actual passenger and crew roles; actual transport/food/recreation/entertainment and other inclusions; connections/excursions; actual ship/propulsion/carriers/native gates; completed package cohort/period; provider coverage; empty/partial/failed duties; all-user asset lifetime and causal drivers; species/composition/receivers and fates"
  required_quality_disclosure: "Actual package acceptance/strata/occupancy uncertainty;native identities/recipes/provider matrix;empty/failed pools;asset life/source/receiver/stock/fate and allocation limits"
  update_trigger: "Changed actual function/itinerary/duration/cabin/food/entertainment/inclusions,ship/carrier/provider,life,source/receiver/fate or completion method"
data_sources:
  - id: "unsd-cruise-2025"
    type: "official_guidance"
    reference: "UNSD CPC3.0 Explanatory Notes,30June2025,actual printed/PDFpp360–361,64122 and continued64133 sightseeing/excursion exclusion. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full integrated inland transport/accommodation/food/incidentals and actual sightseeing distinction only. Count/completion/capital/native collection/formula rules are explicit PCR choices,no minimum night or default food rate."
  - id: "imo-marine-fuel-lca-2024"
    type: "official_guidance"
    reference: "IMO MEPC.391(81),2024Guidelines on life cycle GHG intensity of marine fuels,PDFp4/annexp3§1–2. https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.391(81).pdf"
    used_for: "Marine fuel-chain/propulsion/onboardpower/shore-electricity and CO2CH4N2O scope only. Refrigerants/other pollutants and complete ship/package lifecycle are outside this source;no numerical factor/GWP imported."
  - id: "imo-ship-sewage"
    type: "official_guidance"
    reference: "IMO Prevention of Pollution by Sewage from Ships,public page read2026-10-21. https://www.imo.org/en/ourwork/environment/pages/sewage-default.aspx"
    used_for: "Qualitative actual treatment/holding/reception/outlet pathways. No regulatory permission,minimum ship size or distance is adopted as an actual flow/rate or universal inland rule."
  - id: "imo-ship-garbage"
    type: "official_guidance"
    reference: "IMO Prevention of Pollution by Garbage from Ships,public page read2026-10-21. https://www.imo.org/en/ourwork/environment/pages/garbage-default.aspx"
    used_for: "Actual separate waste categories,records,reception/incineration/disposal context only. No assumed occurrence,discharge,quantity,treatment efficiency or credit."
  - id: "viking-inclusive-value"
    type: "handbook"
    reference: "Viking River Cruises,Viking Inclusive Value,official full-page content read2026-10-21. https://www.vikingrivercruises.com/why-viking/viking-difference/viking-inclusive-value.html"
    used_for: "Operator-specific stateroom/meals/other inclusions and conditional excursions/transfers illustrate actual offer review. Amenities vary;no general occupancy,night/meal/fuel rate or uniform package adopted."
  - id: "ghg-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard,2011,Ch6–9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "General function/boundary/data disclosure and subdivision/justified physical allocation. No claim this standard mandates expanded capital or package/duty equations."
  - id: "imo-ship-pollution"
    type: "official_guidance"
    reference: "IMO Pollution Prevention,retained public snapshot21October2026. https://www.imo.org/en/ourwork/environment/pages/pollution-prevention.aspx"
    used_for: "Qualitative distinct oil/sewage/garbage/air/ballast/antifouling/ship-recycling/reception interfaces. No full inland regulatory applicability,current legal permission,actual quantity/emission factor or treatment efficiency adopted."
