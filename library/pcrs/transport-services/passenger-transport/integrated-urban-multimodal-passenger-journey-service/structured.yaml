      process_id: "uncaptured_support"
      flow_role: "actual waste and direct release"
      record_type: "fate_and_emission_ledger"
      raw_fields: "source cell; actual material/substance; composition; carbon origin; measured/native mass; calculation factor/source if used; stock; capture/treatment; transport; recipient; medium; upstream inclusion"
      collection_method: "Read actual monitoring/method and waste-transfer records. Distinguish containment from release, whole stream from separately handled fractions, collection from treatment, and stock change from consumption. Aggregation algorithm: assign actual event quantity and native conversion only with proof; reconcile fates; never fill the residual by invented emission or zero"
      unit: "native species/carrier units; kg; m3"
      frequency: "event or supported monitoring/estimation period"
      temporal_coverage: "aligned activity and waste/stock closure"
      site_scope: "each actual owned or uncovered generation/release gate; this protocol is restricted to uncaptured support waste and direct releases in this process, with its own exclusive coverage cells"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "species/medium/unit and method proof; receiver gate; actual occurrence/absence; factor provenance; balance limitations"
    - protocol_id: cp_asset_residues
      process_id: "asset_completion"
      flow_role: "actual waste and direct release"
      record_type: "fate_and_emission_ledger"
      raw_fields: "source cell; actual material/substance; composition; carbon origin; measured/native mass; calculation factor/source if used; stock; capture/treatment; transport; recipient; medium; upstream inclusion"
      collection_method: "Read actual monitoring/method and waste-transfer records. Distinguish containment from release, whole stream from separately handled fractions, collection from treatment, and stock change from consumption. Aggregation algorithm: assign actual event quantity and native conversion only with proof; reconcile fates; never fill the residual by invented emission or zero"
      unit: "native species/carrier units; kg; m3"
      frequency: "event or supported monitoring/estimation period"
      temporal_coverage: "aligned activity and waste/stock closure"
      site_scope: "each actual owned or uncovered generation/release gate; this protocol is restricted to uncovered asset lifecycle waste and direct releases in this process, with its own exclusive coverage cells"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "species/medium/unit and method proof; receiver gate; actual occurrence/absence; factor provenance; balance limitations"
    - protocol_id: cp_water_activity
      process_id: "owned_water_leg"
      flow_role: "actual energy,water and consumable supplies and all duties"
      record_type: "actual_record"
      raw_fields: "vessel;architecture;engine_motor;lift_thrust_foil_control;mode_periods;tow_rope_shore_drive_owners;fuel_grade;blend;carbon_origins;opening_stock;receipts;closing_stock;burned;leaked;recovered;shore_gate_ac_dc;gross_import;conversion_losses;battery_soc;water_stocks;other_supply;provider_cells;all_user_share;dispatch_pickup_cancel_return;commercial_private_other_uses;cargo_hotel_dwell"
      collection_method: "Obtain bunker/meter/tank/duty records and actual measured configuration. Reconcile voyage,hotel,empty,failed,charging and architecture-specific lift/transition/shore approach duties. Identify each actual fuel,water,chemical and supplied energy gate; distinguish supply,combustion,loss,recovery and stock. A whole blend with composition ledger OR replacement component supplies requires mass and provider closure, never both. Reconcile AC/DC charge boundaries and storage/charger losses; internal battery/discharge/regen is no new external supply. Reconcile actual water-taxi dispatch,pickup,waiting,cancellation/failure and return duties across all supported vessel uses,with each platform/provider owner. For cargo-passenger routes retain actual passenger hotel/food/sanitary and cargo/reefer duties and evidence each separate or shared cell; no cargo-primary free-ride assumption. Aggregation algorithm: For each actual native period quantity Q, attribute compatible duty/all-user share a to the cohort and compute sum(Q*a)/N once. Fuel activity is reconciled burned mass, not unreconciled purchase; external energy gate chosen exclusively. Actual quantities are assigned to the integrated journey cohort using closed leg/passenger/phase/provider coverage and all-user resource/duty shares;N is final mixed-mode through-journey completion,not water-leg boardings or voyages."
      unit: "kg;kWh;m3;hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "owned/uncovered onboard supply and actual all-user duties"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_water_releases
      process_id: "owned_water_leg"
      flow_role: "actual separately identified airborne species"
      record_type: "actual_record"
      raw_fields: "vessel;fuel;carbon_origin;engine;load;aftertreatment;duty;burned_activity;monitoring_or_model;factor_basis;source_context;species_mass;air_subcompartment;refrigerant_charge;topup;recovery;stocks;provider_cells;uncertainty"
      collection_method: "Collect actual species monitoring or independently supported fuel/engine/load/mode-compatible models, including actual lift/propulsion/hotel generators. Separate chemical/carbon/nitrogen bases and receiving compartment. Fuel-LCA GHG-only scope cannot remove other actual species. Determine each refrigerant actual charge/recovery balance; separately expand actual NO/NO2,SO2,CO,NMVOC components,particle sizes,biogenic CH4 and other releases as required,not one NOx/SOx collector identity. Aggregation algorithm: Assign actual molecule/species mass to the cohort using the matching duty share; /N once. Model q=sum compatible burned_activity*evidenced_species_factor, preserving actual factor units/conversion and uncertainty; no generic factor supplied. Actual quantities are assigned to the integrated journey cohort using closed leg/passenger/phase/provider coverage and all-user resource/duty shares;N is final mixed-mode through-journey completion,not water-leg boardings or voyages."
      unit: "kg"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "owned/uncovered actual airborne release at actual subcompartment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_water_residues
      process_id: "owned_water_residues"
      flow_role: "actual separately identified wastes and water/material fates"
      record_type: "actual_record"
      raw_fields: "vessel;stream_id;origin;composition;moisture;phase;mass_volume;density_basis;generated;stocks;onboard_treatment;recovery;handover;receiver;transport_treatment_coverage;direct_species_release;receiving_waterbody_subcompartment;ballast;coating;skirt_or_foil_residues;uncertainty"
      collection_method: "Use actual tank,maintenance,water,chemical and reception records. Keep bilge,blackwater,graywater,combined sewage,scrubber washwater/sludge,ballast intake/discharge/sediment,food/other garbage,coating/leachate and skirt/foil residues separate by actual composition/gate. Close input/generated-stock-treatment-recovery-handover-release fates. Expand direct water/soil/air species with actual recipient,not waste mass as elementary substance. Actual ballast environmental water intake/discharge is separate from tap-water product; do not invent universal use. Aggregation algorithm: For each actual separate wet/dry/native stream Q and supported service share a, compute sum(Q*a)/N; preserve moisture/density conversion proof. Treatment results replace exactly their included treatment/emission cells,not waste generation or unrelated streams. Actual quantities are assigned to the integrated journey cohort using closed leg/passenger/phase/provider coverage and all-user resource/duty shares;N is final mixed-mode through-journey completion,not water-leg boardings or voyages."
      unit: "kg;m3"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "actual onboard residue generation,holding,treatment and external recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_water_terminal
      process_id: "water_terminal_support"
      flow_role: "actual terminal/shore/organizer supplies,assets and fates"
      record_type: "actual_record"
      raw_fields: "port;terminal;boarding;shore_approach;charger_buffer;meter;provider;voltage;upstream_downstream_gate;supplies;wastes;releases;assets;life;all_users;attributable_duty;coverage_cells;remote_organizer;actual_pickup_docks;cargo_loading_reefer_dwell;allocation_causality"
      collection_method: "Measure or support actual attributable terminal/boarding/control/booking/mooring/charging/shoreapproach services,including shore energy losses not already captured. Inventory each actual input,waste,release and quay/ramp/terminal/charger/storage asset and its maintenance/end-of-life; no omission because owned by a port rather than ferry operator. Use a complete provider result OR its uncovered physical cells with compatible native gate. Include actual private/public pickup docks and dedicated/shared cargo-handling,reefer and cargo-caused waiting infrastructure/energy cells. Evidence causal all-user attribution separately from passenger hotel/boarding; a cargo-call delay is not automatically wholly passenger-caused or wholly free. Aggregation algorithm: Attribute actual native period flows by measured or justified all-user resource/duty shares,then /N; asset manufacture uses same-asset lifetime share before /N. Vessel_shore_ac/DC chain and port purchases must close without double allocation. Actual quantities are assigned to the integrated journey cohort using closed leg/passenger/phase/provider coverage and all-user resource/duty shares;N is final mixed-mode through-journey completion,not water-leg boardings or voyages."
      unit: "kg;kWh;m3;Item(s);hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "actual uncovered port/shore/organization responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
  calculation_rules:
    - id: count_linked
      applies_to: "completed_integrated_journey"
      rule: "N = sum(actual eligible persons on completed linked itineraries); neither tickets nor sum of leg boardings. Eligibility requires actualmorethanone mode,membership andcompletepredeterminedurban/suburbanitinerary atdeclaredquality;actualphysicallegcount isnotfinalN."
      inputs:
        - cp_journeys
      output: "N; Item(s)"
      source_ids: []
    - id: normalize_once
      applies_to: "all_processes"
      rule: "q_ref = assigned actual compatible native quantity / N, with N > 0 and matched coverage/period."
      inputs:
        - cp_journeys
        - cp_legs
        - cp_owned_road_activity
        - cp_owned_rail_activity
        - cp_support
        - cp_road_residues
        - cp_rail_residues
        - cp_support_residues
        - cp_asset_residues
        - cp_water_activity
        - cp_water_releases
        - cp_water_residues
        - cp_water_terminal
      output: "native amount per Item(s)"
      source_ids: []
    - id: leg_assignment
      applies_to: "purchased_bus_leg;purchased_rail_leg;purchased_tram_leg;purchased_trolleybus_leg;purchased_ferry_leg"
      rule: "Sum actual compatible person-leg results assigned to the integrated journey set; keep actual multiplicity and all provider-specific boundaries."
      inputs:
        - cp_journeys
        - cp_legs
      output: "provider-native quantities"
      source_ids: []
    - id: energy_units
      applies_to: "road_electricity;rail_electricity;rail_ac_export;support_electricity;land_external_dc;rail_external_dc;vessel_shore_ac;vessel_shore_dc;port_ac"
      rule: "For verified compatible electrical energy only, MJ = 3.6 * kWh. Separate gross import/export and storage; no fuel-factor inference."
      inputs:
        - cp_owned_road_activity
        - cp_owned_rail_activity
        - cp_support
      output: "MJ or kWh on compatible electrical basis"
      source_ids: []
    - id: asset_equivalents
      applies_to: "asset_completion"
      rule: "Vehicle manufacture equivalents = sum_b(delivered manufacture Item(s)_b * assigned compatible duty_b / documented total compatible lifetime duty_b); divide the period total by N. Match the numerator, denominator and delivered count to the same vehicle/cohort; other components require independent quantities."
      inputs:
        - cp_assets
        - cp_journeys
      output: "Item(s) vehicle per reference journey"
      source_ids: []
    - id: supplemental_distance
      applies_to: "journey_integration"
      rule: "Supplemental actual passenger-distance = sum(actual passengers on each stage * actual stage km); it is not the Count reference and supplies no fixed distance per journey."
      inputs:
        - cp_journeys
        - cp_legs
      output: "supplemental passenger-distance disclosure"
      source_ids:
        - dft-nts-2025
    - id: water_supply_species_fates
      applies_to: "owned_water_leg;owned_water_residues;water_terminal_support"
      rule: "For each actual waterleg/boat/phase close supplied+openingstock+generated=closingstock+used/converted+leaked/vented+recovered/exported andeachfateoncompatiblebasis;internaltransferscancel. Suppliedfuel,actualburnedactivity andchemicalemission differ. Measure/model eachactualspecies withindependentlysupportedcomposition/engine/load model,correctmolecule/origin/receiver,then causalallusercohortshare/Nonce. Wholefuelblend ORreplacingcomponentupstreamcells;externalACorDCchain andlosses exclusive;collectedwetbilge/blackwater aremixtures,notdirectspecies orpureusedoil."
      inputs:
        - cp_water_activity
        - cp_water_releases
        - cp_water_residues
        - cp_water_terminal
        - cp_journeys
      output: "native assigned material/species/fate perintegratedjourney"
      source_ids: []
  data_quality_requirements:
    - id: linked_count
      applies_to: "completed_integrated_journey"
      requirement: "Maintain actual through-journey completion and person linkage; ticket/boarding/leg totals cannot substitute for N. Missing completion or transfer linkage blocks completion."
      evidence: "cp_journeys"
    - id: provider_matrix
      applies_to: "purchased_bus_leg;purchased_rail_leg"
      requirement: "Retain a closed provider/activity/burden/period matrix with native-unit and lifecycle coverage proof. Any gap or overlap blocks completion of the affected package."
      evidence: "cp_legs"
    - id: actual_carriers
      applies_to: "road_diesel;road_electricity;rail_electricity;support_electricity"
      requirement: "Every actual fuel, hydrogen/DC/steam/heat supply, refrigerant and auxiliary chemical not represented by a compatible card must be independently identified, measured and expanded. Missing occurrence, identity or quantity blocks completion; no route is assumed to use them all."
      evidence: "cp_owned_road_activity;cp_owned_rail_activity;cp_support"
    - id: actual_provider_units
      applies_to: "purchased_bus_leg;purchased_rail_leg"
      requirement: "Expand every incompatible provider, state and native result into its own verified exchange; retain actual distance/occupancy/boundary equivalence and source uncertainty. Missing proof blocks completion; a zero search match is not a zero service."
      evidence: "cp_legs"
    - id: actual_assets
      applies_to: "battery_bus_manufacture"
      requirement: "Complete each attributable configuration-specific vehicle, battery, equipment, guideway and station lifecycle component not already included. Do not use the EV-bus card for other assets or use depreciation money as physical lifetime. Missing support blocks completion."
      evidence: "cp_assets"
    - id: actual_materials_wastes
      applies_to: "support_tap_water;paper_ticket_waste;battery_bus_manufacture"
      requirement: "Collect every actual purchased material, consumable, repair item, contained wastewater and waste stream by composition, state, native amount and receiver gate. Expand distinct streams separately. Missing identity, quantity or fate blocks completion."
      evidence: "cp_support;cp_road_residues;cp_rail_residues;cp_support_residues;cp_asset_residues"
    - id: actual_emissions
      applies_to: "road_fossil_co2;owned_rail_leg;uncaptured_support"
      requirement: "For all actual exhaust, non-exhaust, fugitive or water/soil releases, retain substance/species/particle class, origin, receiving medium and subcompartment, quantity basis and method. A known specific subcompartment cannot be discarded for a generic-air identity; unspecified requires documented scope justification. The CO2 card does not cover other species. Missing required release data blocks completion, never zero."
      evidence: "cp_road_residues;cp_rail_residues;cp_support_residues;cp_asset_residues"
    - id: actual_digital_support
      applies_to: "support_electricity;uncaptured_support"
      requirement: "Identify actual integration/IT/communication supplier services and their native service/asset/energy coverage; expand each uncaptured service separately and exclude only proven already-included burdens. Missing coverage blocks completion."
      evidence: "cp_support"
    - id: period_uncertainty
      applies_to: "purchased_bus_leg;purchased_rail_leg;completed_integrated_journey;road_diesel;road_electricity;road_fossil_co2;rail_electricity;rail_ac_export;support_electricity;support_tap_water;paper_ticket_waste;battery_bus_manufacture"
      requirement: "Keep period alignment, stock change, incomplete journeys, active-asset lifetime forecasts and sampled passenger data explicit. Estimates must have method/source/uncertainty and no invented generic range."
      evidence: "cp_journeys;cp_owned_road_activity;cp_owned_rail_activity;cp_assets"
    - id: identity_and_translation
      applies_to: "purchased_bus_leg;purchased_rail_leg;completed_integrated_journey;road_diesel;road_electricity;road_fossil_co2;rail_electricity;rail_ac_export;support_electricity;support_tap_water;paper_ticket_waste;battery_bus_manufacture"
      requirement: "Match every bound identity and official Chinese display to independent Tiangong detail/support evidence. Unresolved concrete flows remain registered; do not promote candidate status through checker pass alone."
      evidence: "all collection protocols"
    - id: full_mode_membership
      applies_to: "completed_integrated_journey"
      requirement: "MANDATORY actualwholeintegratedjourney andeligibleurban/suburbanpredeterminedroute/schedule withmorethanone evidencedmode. Retain actualrail/land/watermode taxonomy,membership,allstages/persons/transfers,quality/OD andcompletion,includingactualownedorpurchasednativecoverage. Networkcatalog/farewindow/ticketpayment/boardingdata alone notfulfilledjourney. Incompletemembership orend-to-endlinkage blocksfinishedresult."
      evidence: "cp_journeys;cp_legs"
    - id: water_architecture_wave
      applies_to: "owned_water_leg;owned_water_residues;water_terminal_support;asset_completion"
      requirement: "MANDATORY actualwaterbody/sea-state/wave/wake/itinerary/boat andpropulsionrecord. Displacement/hydrofoil/hovercraftactualhull/drive/foil/control/liftfan/skirt/shoreapproach/hold/idle/repair wear fates andactualotherchemical,manual,towed/cable orotherconfigurations requirecompletephysical/nativeinterfaces. OwnactualtowproviderORphysicaltowenergy/rope/shoremechanism/life,notassumedonboardfuel. Collect actualwave/wakephysicaldisturbance/intervention evidence/nativeunit/assessmentlimits where relevant;noinvented waveemissionkg orweatherfactor."
      evidence: "cp_water_activity;cp_water_releases;cp_water_residues;cp_water_terminal;cp_assets"
    - id: water_all_fates
      applies_to: "owned_water_leg;owned_water_residues;water_terminal_support"
      requirement: "MANDATORY everyactualmarinegradefuel/blend/lubricant/refrigerant/cooling/detergent/antifoulant/scrubbersupply;bilge,black/graywater,scrubberwashwater/sludge,ballastintake/discharge/sediment,garbage andcleaning/leachate/directrelease separately byactualcomposition,wetdry/nativequantity andreceiver. Do not substitute roadDiesel,aggregate allwaste,bindairspecies to wastewater ordelete unrepresented mandatoryfate."
      evidence: "cp_water_activity;cp_water_releases;cp_water_residues;cp_water_terminal"
    - id: land_rail_traction_life
      applies_to: "owned_road_leg;owned_rail_leg;asset_completion;uncaptured_support"
      requirement: "MANDATORY actualtrolley/tram/bus/otherland andrailroute nativeAC/DC/rectifier/charging/regeneration/fuelcell/H2/diesel/steam orotheractualpropulsioninputs,contactwire/substation/bogie/track/road/tyre/brake/railwear/heat/release andfulllife. A concretebusorheavyrailcard cannot standforallactualmodes;eachrealmissingvehicle/provider/input/asset/species/fate mustbeexpanded withthe atomicfields below,not omittedbecauseUUIDunknown."
      evidence: "cp_owned_road_activity;cp_owned_rail_activity;cp_assets;cp_support"
    - id: transfer_and_terminal
      applies_to: "uncaptured_support;water_terminal_support;asset_completion"
      requirement: "MANDATORY completeactualrail/land/waterinterchange:station/pier/quay/ramp/lift/escalator/walkway/shelter/wayfinding/ticketingIT/charging/mooringassets,waiting/access/egress boundaries andmissedconnection/recoveryduty. Include manufacture/maintenance/retirement andallactualusers;eachnativeprovider/asset/metercelloneowner. Transferusers areactualmembers,notextranewoutputs;commonfare alone notresponsibilityproof."
      evidence: "cp_support;cp_water_terminal;cp_assets"
    - id: atomic_full_expansion
      applies_to: "all_processes"
      requirement: "MANDATORY every actual unrepresented input/output,provider result,material,asset,waste or directspecies/fate has:unique row_id;oneexisting process_id;direction/product-waste-elementarytype;singleactualidentity/state/formulation;verifiedUUID or explicitunresolved;nativeproperty/unit/actualquantity andmeasured/calculatedbasis;validsameparentCP;rawsource;providerstage/nativegate/coveredcells;receiver/knownsubcompartment/waterbody/phase;uncertainty andnormalization. No pluralcollectionrow,unknownzero orcheckpass-completionclaim. Realnativeproviderquantities scaledbyactualactivity thenallocated/Nonce;eachcoveredcell replacesmatchingphysicalcellonly."
      evidence: "all actual collection protocols and coverage/quantity/fate records"
    - id: other_qualifying_mode_interfaces
      applies_to: "all_processes"
      requirement: "MANDATORY where another actual mode fulfils the same scheduled urban/suburban integrated service,establish actual endpoint/role/mode eligibility and one concrete provider-native activity per leg. Scale real native quantity by actual measured activity then causal all-user share/N;completed provider covered cells replace exact physical cells only. Expand the full mode-specific vehicle/propulsion/energy/site/terminal/maintenance/retirement and release/receiver interfaces atomically. For an actual air component,this includes actual taxi/takeoff/climb/cruise/holding/diversion/empty/landing phases,cargo/crew roles,airport support and aircraft lifecycle,with actual chemical/particle/altitude quantities;never a generic ground-air or passenger-km factor. No technical example alone proves code membership. Transfer walking/waiting does not automatically establish a second delivered transport mode. Unknown actual native identity,quantity or coverage blocks completion rather than excluding the qualifying product."
      evidence: "all actual native mode/provider/phase/asset/fate records and valid same-parent protocols"
validation_rules:
  - rule_id: validate_service
    applies_to: "completed_integrated_journey"
    rule: "Every counted record proves one actual passenger completed the declared eligible urban/suburban scheduled mixed-mode itinerary using more than one actual distinct transport mode. Declare actual accountable operator,OD,period,mode membership,predetermined route/schedule,accessibility/service quality and transfer boundaries;boardings or ticket rights alone do not prove this output."
    source_ids: []
  - rule_id: validate_denominator
    applies_to: "cp_journeys"
    rule: "N is the actual completed linked-person-journey count. Reconcile ticket, boarding, transfer, leg, cancellation and completed-trip records without equating them. Group tickets retain actual person counts."
    source_ids: []
  - rule_id: validate_distance
    applies_to: "cp_journeys;cp_legs"
    rule: "Actual stage distances and passenger counts determine supplemental passenger-distance. A 1 Item(s) journey has no fixed km conversion; never relabel the Count reference as passenger-km."
    source_ids: []
  - rule_id: validate_cells
    applies_to: "all_processes"
    rule: "Every mandatory burden cell is covered once by a compatible provider result or explicit foreground data; audit supplier data and own inputs together for both omissions and duplication."
    source_ids: []
  - rule_id: validate_native
    applies_to: "all_processes"
    rule: "Verify UUID identity, reference property/unit chain, technical state, provider/geography, boundary and receiving medium for each adopted exchange. The unresolved reference product does not waive independently verified Count support."
    source_ids: []
  - rule_id: validate_atoms
    applies_to: "all_processes"
    rule: "Expand every actual provider, material, refrigerant, asset, waste and emission into an independently compatible atomic exchange before final data completion; no collection label or inherited UUID is allowed."
    source_ids: []
  - rule_id: validate_energy
    applies_to: "owned_road_leg;owned_rail_leg"
    rule: "Close gross imports, exports, internal recovery and storage change. Do not count battery discharge as supply, infer fuel use from fare, or infer zero life-cycle burden from no tailpipe emissions."
    source_ids: []
  - rule_id: validate_residues
    applies_to: "cp_road_residues;cp_rail_residues;cp_support_residues;cp_asset_residues"
    rule: "Reconcile actual waste carrier, constituent/species, native basis, stock change and destination. Do not combine kg N with kg N2O, kg C with kg CO2, contained liquids with air/water releases, or whole objects with separately counted components."
    source_ids: []
  - rule_id: validate_temporal
    applies_to: "all_processes"
    rule: "Numerators, N, provider activity and physical allocation drivers use compatible service cells and periods; retain incomplete, zero-output and interrupted pools for resolution."
    source_ids: []
  - rule_id: validate_completion
    applies_to: "all_processes"
    rule: "Missing amounts and missing generic ranges are different. Actual quantities and required identities/coverage must be completed with evidence; no guessed range, default emission factor or missing-equals-zero rule may manufacture completeness."
    source_ids: []
  - rule_id: validate_full_mixed_scope
    applies_to: "journey_integration"
    rule: "Requireactual64113urban/suburbanpredeterminedroutes/schedules withmorethanone realdistinctmode andactualend-to-endrecipientcompletion. Fullmethod admits actualrail/land/watercombinations,notrail+busonly orallthreecompulsory. Rejectbooking/broker-only/commonfareascompletion andleg/boarding doubleoutputs."
    source_ids: []
  - rule_id: validate_water_and_power
    applies_to: "owned_water_leg;owned_water_residues;water_terminal_support;owned_road_leg;owned_rail_leg"
    rule: "Requireactualboat/rail/landarchitecture,sea/wave/nativefuelgrade andgross externalAC/DC gates;no roadDieselasmarineproof,noACrelabelledDC orinternaltransferaspurchase. Separatebilge/blackwater/oil/sludge/ballast/antifoulant/cleaningfates andactualspecies/medium/knownsubcompartment;unresolvedactualneednotzero."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only afterallactualrequiredidentities,quantities,coverage,life andfates completed/reviewed"
  allowed_use: "Use a completed evidenced service result only at its declared OD, modes, quality, period and boundary; cross-condition comparison requires functional equivalence first"
  excluded_use: "Singlemode orbooking/broker-only,unusedrights/farelabels,defaultpkmfactors,legdoublecount,missingwater/land/railbranchresponsibilities oroperationalonly resultasfull lifecycle;incomplete actualpackage"
  required_metadata: "Accountable operator/network/OD; itinerary/schedule; modes/providers; completed N; actual distances; native units; coverage matrix; capital/end-of-life boundary; physical allocation; period and uncertainty"
  required_quality_disclosure: "Identity/quantity gaps, sampling/linkage errors, provider-boundary gaps, lifecycle coverage, lifetime forecasts, emission method/medium, exclusions and sensitivities; checker pass is not completion evidence"
  update_trigger: "Changes in route/function, modes/providers/energy technology, linkage/completion rule, asset configuration/life, release/fate, measurement or applicable boundary guidance"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF page 359, subclass 64113. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full64113scope:scheduledurban/suburban morethanone mode includingrail,land,water; classificationonly,no genericmodecount/quantityfactor."
  - id: "dft-nts-2025"
    type: "official_guidance"
    reference: "UK Department for Transport, NTS 2025: Notes and definitions, updated 11 September 2026, Trips, stages and distance. https://www.gov.uk/government/statistics/national-travel-survey-2025/nts-2025-notes-and-definitions"
    used_for: "Trip/stage/distance distinctions; this PCR defines its own actual integrated service completion rule. No NTS numerical average or transfer-window rule is adopted."
  - id: "fta-ntd-glossary"
    type: "official_guidance"
    reference: "US FTA, National Transit Database Glossary, entries Unlinked Passenger Trips, Service Supplied, Service Consumed, Actual Vehicle Miles. https://www.transit.dot.gov/ntd/national-transit-database-ntd-glossary"
    used_for: "Boarding-based reporting and supplied-versus-consumed activity distinctions. NTD does not define this PCR linked-journey denominator or its whole-life boundary."
  - id: "ghg-product-standard"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard, 2011, chapters 6, 7 and 9, especially printed pages 28–29, 34–37 and 63–64. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Functional scope disclosure and allocation hierarchy; no transport factor, asset lifetime or fare allocation percentage is taken from the standard. Capital inclusion here is a disclosed PCR choice."
  - id: "iso14083-scope"
    type: "standard"
    reference: "ISO 14083:2023 official public abstract/scope, edition 1, 2023-03. https://www.iso.org/standard/78864.html"
    used_for: "Public scope establishes passenger/freight transport-chain operations context only. Full normative text was not acquired; no detailed ISO conformity claim, factor or capital rule is inferred."
  - id: "imo-fuel-lca-2024"
    type: "official_guidance"
    reference: "IMO Resolution MEPC.391(81),22March2024,2024 marine-fuel LCA Guidelines,annex p3 sections1–2. https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.391(81).pdf"
    used_for: "Fuel-chain and onboard propulsion/power interfaces,including shore electricity; CO2/CH4/N2O only. Explicitly excludes refrigerants and other listed species; not full ship inventory. No default factor adopted."
  - id: "imo-pollution"
    type: "official_guidance"
    reference: "IMO Pollution Prevention,public page accessed21October2026,opening paragraphs. https://www.imo.org/en/ourwork/environment/pages/pollution-prevention.aspx"
    used_for: "Qualitative separate oil,sewage,garbage,air,ballast,antifouling and reception pathways; not factors,actual concentrations,universal occurrence or legal discharge permission."
  - id: "iso8217-abstract"
    type: "standard"
    reference: "ISO8217:2024,edition7 May2024,public abstract only. https://www.iso.org/standard/80579.html"
    used_for: "Marine fuel specification families and before-onboard-handling gate; full normative text not read. No numeric grade,composition,density,sulphur or compliance conclusion."
  - id: "damen-ferry-cases"
    type: "literature"
    reference: "Damen Road Ferries and Ferry2306 Electric,primary product pages accessed21October2026. https://www.damen.com/vessels/ferries/roro-ferries ; https://www.damen.com/vessels/ferries/city-ferries/ferry-2306-electric"
    used_for: "Actual case interfaces: passenger/vehicle ferries,shorecharging/buffer,diesel backup and internalDC. Product cases only; marketing emission savings,capacities and charging performance not generic parameters."
  - id: "hydrofoil-case"
    type: "literature"
    reference: "Candela P-12 Shuttle,primary technical product page accessed21October2026. https://candela.com/pro-series/p-12-shuttle/"
    used_for: "Actual electric hydrofoil controls,foil structure/transition and external DC charging architecture; no advertised savings,range,capacity or life adopted as a generic factor."
  - id: "hovercraft-architecture"
    type: "literature"
    reference: "Griffon Hoverwork/Griffon Marine,How Hovercraft Work,public primary technical explanation accessed21October2026. https://www.griffonhoverwork.com/products/hovercraft/how-hovercraft-work/"
    used_for: "Actual lift-fan,flexible-skirt and thrust-propeller functions over water/shore surfaces; not passenger-operation emission,wear or fuel factors."
  - id: "bts-ncfo-2024"
    type: "official_guidance"
    reference: "BTS2024 National Census of Ferry Operators printable questionnaire,PDF pp2 and11. https://www.bts.gov/sites/bts.dot.gov/files/2025-02/2024%20NCFO%20Printable%20Questionnaire.pdf"
    used_for: "U.S.-scope census context and distinct passenger/vehicle capacities excluding crew; no adoption of capacity or assumed car length as actual occupancy,reference denominator or worldwide service definition."
  - id: "water-taxi-operator-case"
    type: "literature"
    reference: "Fastrac,Water Taxi Service,primary operator page accessed21October2026. https://fastrac.com/cruises/water-taxi/"
    used_for: "Case-specific on-demand point-to-point,private/shared and dock-out/return duty interfaces; no prices,capacity,occupancy or fuel factor adopted as a general rule."
  - id: "cargo-passenger-operator-case"
    type: "literature"
    reference: "Relais Nordik,2026–2027 Conditions and rates for carriage of passengers,PDF pp5 and7;actual crossing/cargo versus cruise homepage and optional bed/meal pages. https://relaisnordik.com/wp-content/uploads/2026/03/rni-bella-tg-p-2026-2027-en-final.pdf ; https://relaisnordik.com/en/ ; https://relaisnordik.com/en/lits/ ; https://relaisnordik.com/en/manger-a-bord/"
    used_for: "Case-specific separate port passage,cargo and inclusive-cruise products,optional cabin/meals and intermediate reboarding; no tariff,capacity,food,room-life or general allocation coefficient adopted."
  - id: "translink-schedules"
    type: "official_guidance"
    reference: "TransLink Schedules and Maps,official public page accessed21October2026. https://www.translink.ca/schedules-and-maps/"
    used_for: "Actualcase rail,bus/trolley/shuttle andSeaBusnetworkconnections/predefinedtimetables;not actualcompletedN or universalquantity/route/eligibility for everyservice."
  - id: "translink-seabus"
    type: "official_guidance"
    reference: "TransLink SeaBus Schedules,official public page accessed21October2026. https://www.translink.ca/schedules-and-maps/seabus.aspx"
    used_for: "Actualscheduledferry/waterbody/terminal andrail-landtransferinterface;no capacity,crossingtime,frequency,occupancy orfactor adopted."
  - id: "translink-transfer"
    type: "official_guidance"
    reference: "TransLink Transferring and AddFare,official public page accessed21October2026. https://www.translink.ca/transit-fares/transferring-and-addfare"
    used_for: "Actualfaremedia-dependenttransferconditions showcommonfare/accessrights arenotphysicalcompletion;no universaltransferwindow,price orallocationadopted."
