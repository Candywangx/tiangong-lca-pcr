allocation_rules:
  - rule_id: allocate_subdivide
    applies_to: "all_processes"
    rule: "Separate metered providers, modes, operations, support and assets before allocating shared burdens. Leg transfers are components of one service, not co-products requiring a second split."
    source_ids:
      - ghg-product-standard
  - rule_id: allocate_physical
    applies_to: "all_processes"
    rule: "Use documented causal physical drivers for the actual resource and all users of its pool. Passenger-distance, vehicle-distance, operating time or occupied area-time may be used only where the resource relationship is supported. Shares must close over all served products; one universal share is prohibited."
    source_ids: []
  - rule_id: no_fare_proxy
    applies_to: "journey_integration"
    rule: "Fare revenue, ticket sales and passenger capacity are not automatic physical drivers. If physical subdivision or drivers cannot be established, justify an alternative relationship and disclose sensitivity before use; do not invent a percentage."
    source_ids:
      - ghg-product-standard
  - rule_id: avoid_second_division
    applies_to: "journey_integration"
    rule: "Use a provider result already expressed per completed passenger leg at its own native basis once. Do not divide it again by vehicle occupancy, seating capacity or passengers. Normalize aggregate assigned burdens once by N."
    source_ids: []
  - rule_id: empty_and_failure
    applies_to: "owned_road_leg;owned_rail_leg"
    rule: "Assign attributable empty and failed-service burdens within the corresponding service pool; failed integrated journeys add no completed output. If N is zero, retain the pool and resolve the aggregation period or boundary with evidence, never divide by zero or declare zero intensity."
    source_ids: []
  - rule_id: export_no_credit
    applies_to: "rail_ac_export"
    rule: "A separately delivered electricity export has its own actual recipient and scope. Internal recovery is not a co-product; use the declared consistent allocation convention for actual joint output and disclose sensitivity, with no automatic avoided-grid credit."
    source_ids: []
  - rule_id: asset_lifetime_share
    applies_to: "asset_completion"
    rule: "Allocate each compatible cohort using documented lifetime activity and the studied share of that activity. Keep original vehicle/battery manufacture, replacements, maintenance and disposal in non-overlapping components across all users and periods; changing lifetime assumptions requires update and uncertainty disclosure."
    source_ids: []
  - rule_id: actual_mode_and_wave_duties
    applies_to: "all_processes"
    rule: "Subdivide actual provider/mode/boat-rail-road resource pools and retain complete actual persons/segment andotherusers. Attribute actual watercondition/wave/wake-relatedspeed/hold/manoeuvre/hotel/empty/failure,transferwait/missedconnection andtest/recovery duties with evidenced causality;no weather factor,occupancy oroneleg-permode default. Failedintegratedfulfilment creates nofinalN;directphysicalwave/wake/disturbance evidence andassessmentlimits stay explicit where relevant."
    source_ids: []
  - rule_id: whole_blend_and_supply_gate
    applies_to: "all_processes"
    rule: "Use the actual whole delivered fuel formulation/blend with composition/carbon-origin ledger OR component supplies replacing its exact supply/upstream coverage with native-mass/provider closure,never both. Distinguish required supplied/net withdrawal from actual burned/vented/spilled/recovered/retained quantities;do not equate purchases to combustion. Bridge an at-plant identity to the actual receipt/use gate and separately own missing delivery/conditioning/storage/loss stages;no grade relabel or invented density."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_journeys
      process_id: "journey_integration"
      flow_role: "completed linked-person journeys"
      record_type: "service_ledger"
      raw_fields: "privacy-preserving journey_id; actual_person_count; origin; destination; route; schedule; actual start/end; mode/vehicle changes; provider leg IDs; group-ticket persons; completion/cancellation; actual stage km; period;actual mode taxonomy;morethanone distinctmode;rail_land_water branch;stage personmembership;transfer/walk/wait boundaries;failed connection"
      collection_method: "Join actual fulfilment/validation/dispatch/transfer evidence; audit matching errors and sample expansion separately. Never infer a universal transfer window from NTS. Aggregation algorithm: N=sum actual persons on eligible completed linked itineraries; a transfer adds leg/boarding, not a new completed journey; missing completion remains unresolved Confirm each actual completed itinerary includes more than one evidenced mode on predetermined routes/schedules;do not infer physical fulfilment from mode availability,farewindow or ticketpayment. Transfers/vehiclechanges add no final completions."
      unit: "Item(s); person; km; time"
      frequency: "each itinerary; reconciled period"
      temporal_coverage: "same declared service period"
      site_scope: "declared integrated network and OD/service class"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "documented linkage and anonymization; completion proof; coverage and uncertainty"
    - protocol_id: cp_legs
      process_id: "journey_integration"
      flow_role: "provider result coverage"
      record_type: "provider_ledger"
      raw_fields: "journey_id; leg_id; provider; mode; geography; dataset/version; native unit; quantity; distance; start/end; completion; energy upstream/operation; terminal/capital/maintenance/disposal coverage;actual rail/land/water mode;boat ortram/trolley type;native quantity/activity multiplier;pier/station/transfer/fulllifecycle cells"
      collection_method: "Reconcile contract with actual provider fulfilment and full dataset boundary; inspect every adopted native result. Confirm compatible Count inputs; other units need separately verified native exchange/equivalence. Aggregation algorithm: Map every provider/activity/burden/period cell once; sum only compatible quantities; actual leg multiplicity retained For every real mode/provider leg use provider-native demand scaled by observed activity then causal share/N once. Countcardsapplyonlycountedcompletedresults;actualpkm/vehiclekm/hour results require separateexactidentityand measured conversion. A wholeprovider resultORmatchingphysicalstagecells,notboth."
      unit: "native provider units; Item(s); km"
      frequency: "each provider/cohort and update"
      temporal_coverage: "period aligned with journey set"
      site_scope: "all actually served owned and purchased legs"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "provider source, unit and boundary proof; closed coverage matrix; no double occupancy division"
    - protocol_id: cp_owned_road_activity
      process_id: "owned_road_leg"
      flow_role: "owned physical operations"
      record_type: "operating_records"
      raw_fields: "vehicle/train/configuration; owned coverage cell; gross fuel/import/export; meters; opening/closing stocks; storage; empty/revenue/test/standby/disrupted activity; all-user causal driver; factors and sources if calculation needed"
      collection_method: "Use reconciled meters, stock records, dispatch logs and actual physical allocation evidence; map operations independently of NTD metric exclusions. Split each actual carrier and technical state. Aggregation algorithm: actual consumed quantity = compatible opening + receipts - closing - non-consumption transfers, with explicit adjustment terms; assigned totals divided once by N Complete actual rubbertyre/railwheel,trolley/contactwire/tram propulsion,tractionAC/DC/rectifier/battery,track/road/overheadline/substation,brake/tyrewear,cooling and all actual energy/consumable/fate interfaces. InternalACtoDC/recovery isnot anotherpurchase;actual diesel,whole-blend and replacing component supplies retainexclusive supply/upstreamcoverage andrealburnedstocks."
      unit: "kg; kWh; km; vehicle-km; h; actual species units"
      frequency: "meter/vehicle record and period closure"
      temporal_coverage: "same operation/allocation period as N"
      site_scope: "actual owned/uncovered landbranch,including bus/trolleybus/tram under actualmodeownership"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter scope, loss/recovery reconciliation, driver rationale and all-user share closure"
    - protocol_id: cp_owned_rail_activity
      process_id: "owned_rail_leg"
      flow_role: "owned physical operations"
      record_type: "operating_records"
      raw_fields: "vehicle/train/configuration; owned coverage cell; gross fuel/import/export; meters; opening/closing stocks; storage; empty/revenue/test/standby/disrupted activity; all-user causal driver; factors and sources if calculation needed"
      collection_method: "Use reconciled meters, stock records, dispatch logs and actual physical allocation evidence; map operations independently of NTD metric exclusions. Split each actual carrier and technical state. Aggregation algorithm: actual consumed quantity = compatible opening + receipts - closing - non-consumption transfers, with explicit adjustment terms; assigned totals divided once by N Own actual railvehicle/bogie/track/guideway,tractionACorDC/rectifiers/charging/regen plus diesel/H2/steam/other actual route inputs and releases. A heavyrailprovidercard isnot proofallrailmodes use thatnativeidentity; otheractualnativeoutputs/vehicles mustbeexpanded."
      unit: "kg; kWh; km; vehicle-km; h; actual species units"
      frequency: "meter/vehicle record and period closure"
      temporal_coverage: "same operation/allocation period as N"
      site_scope: "actual owned/uncovered railmode branch with realconfigurations andnativeenergy gates"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter scope, loss/recovery reconciliation, driver rationale and all-user share closure"
    - protocol_id: cp_support
      process_id: "uncaptured_support"
      flow_role: "uncaptured integration and terminal support"
      record_type: "meter_and_procurement_records"
      raw_fields: "support cell; actual electricity/water/material; station/room/equipment; period; all-user driver; upstream inclusion; stock; actual cleaning/IT/transfer support"
      collection_method: "Inspect meters, bills, equipment logs and site records. Meter or causally allocate only support absent from linked results. Identify every chemical/material/provider separately before final use. Aggregation algorithm: remove only proven included coverage; assign actual measured amount using justified physical driver; divide once by N Close ownership of actual bus/rail/water interchange access/egress,walking connector,lift/escalator,shelter,waiting,missedconnection,wayfinding/IT andticketmedia;notoneextra passengeroutput. Water_terminal_support covers only its assigned uncaptured cells,not thesame meterorasset again."
      unit: "kWh; m3; native actual units"
      frequency: "actual transactions and closure"
      temporal_coverage: "matching service period"
      site_scope: "all uncaptured integration/terminal/support interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter boundary and supplier crosscheck; actual absence proof; mandatory identity/quantity gap register"
    - protocol_id: cp_assets
      process_id: "asset_completion"
      flow_role: "whole-life assets and infrastructure"
      record_type: "asset_cohort_ledger"
      raw_fields: "asset_id; actual configuration; original battery coverage; manufacture dataset; replacement/maintenance/disposal; in-service dates; compatible lifetime activity; actual studied and all-user activity; forecast basis and uncertainty;boat/hull/foil/skirt;rail/landvehicles;piers/ramps/shorepower;road/track/overhead;alluserlife"
      collection_method: "Inspect asset and engineering records plus provider lifecycle coverage; distinguish observed life from documented forecast for active assets. Match native manufacture references and revise forecasts when evidence changes. Aggregation algorithm: manufacture equivalents=delivered native manufacture count times assigned compatible duty/total compatible useful duty, matched to the same vehicle or cohort; other components have independent actual quantities and exclusive coverage; normalize by N Complete each actual ship/rail/road/terminal/interchange/charging/guideway asset native manufacture quantity andsameassetall-user useful-life duty,including owned andsuppliermissing stages. Boat originalhull/drive/battery/foil/fan/skirt andequipment versus subsequentreplacement/drydock/refit/maintenance/retirement exclusive. A manufacturingidentity isnot a full-life service; a single batterybus carddoesnotrepresentothervehicles."
      unit: "Item(s); compatible vehicle-km; asset-native units"
      frequency: "asset/cohort acquisition, replacement and update"
      temporal_coverage: "whole-life basis with period-specific assigned activity"
      site_scope: "every attributable vehicle, battery, station, guideway and support asset not already covered"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "configuration/lifetime/source proof; uncertainty; all-user and cross-period non-overlap; no copied default mass/life"
    - protocol_id: cp_road_residues
      process_id: "owned_road_leg"
      flow_role: "actual waste and direct release"
      record_type: "fate_and_emission_ledger"
      raw_fields: "source cell; actual material/substance; composition; carbon origin; measured/native mass; calculation factor/source if used; stock; capture/treatment; transport; recipient; medium; upstream inclusion"
      collection_method: "Read actual monitoring/method and waste-transfer records. Distinguish containment from release, whole stream from separately handled fractions, collection from treatment, and stock change from consumption. Aggregation algorithm: assign actual event quantity and native conversion only with proof; reconcile fates; never fill the residual by invented emission or zero"
      unit: "native species/carrier units; kg; m3"
      frequency: "event or supported monitoring/estimation period"
      temporal_coverage: "aligned activity and waste/stock closure"
      site_scope: "Each actual owned or uncovered generation/release gate in the unique parent owned_road_leg,including all real eligible land mechanisms such as bus,trolleybus and tram;only this process exclusive coverage cells."
      aggregation_rule: "per declared reference flow"
      quality_evidence: "species/medium/unit and method proof; receiver gate; actual occurrence/absence; factor provenance; balance limitations"
    - protocol_id: cp_rail_residues
      process_id: "owned_rail_leg"
      flow_role: "actual waste and direct release"
      record_type: "fate_and_emission_ledger"
      raw_fields: "source cell; actual material/substance; composition; carbon origin; measured/native mass; calculation factor/source if used; stock; capture/treatment; transport; recipient; medium; upstream inclusion"
      collection_method: "Read actual monitoring/method and waste-transfer records. Distinguish containment from release, whole stream from separately handled fractions, collection from treatment, and stock change from consumption. Aggregation algorithm: assign actual event quantity and native conversion only with proof; reconcile fates; never fill the residual by invented emission or zero"
