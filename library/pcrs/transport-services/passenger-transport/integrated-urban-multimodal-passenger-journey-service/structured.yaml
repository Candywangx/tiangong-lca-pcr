system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "journey_integration"
      rule: "This PCR covers one actual accountable completed mixed-mode passenger journey on predetermined urban/suburban routes and schedules. It covers actual rail,land and water combinations rather than only heavy rail plus bus. Each delivered journey must use more than one evidenced distinct transport mode; it need not contain all three broad families or a default one leg of each. Declare actual mode taxonomy,membership,OD,route/schedule,transfer/connection responsibility,quality and completion before aggregation. A network offering multiple modes or an unused transfer entitlement alone is not evidence a particular completed journey is mixed-mode."
      source_ids: []
    - rule_id: coverage_cells
      applies_to: "all_processes"
      rule: "Before quantities, assign each provider/asset/activity/burden/period cell either to a compatible linked result or to explicit foreground expansion. Mixed ownership may coexist across cells; no cell may be duplicated or left ownerless."
      source_ids: []
    - rule_id: provider_completeness
      applies_to: "journey_integration"
      rule: "Purchased legs must disclose reference unit, occupancy attribution, energy upstream and operation, maintenance, terminals, capital and disposal coverage. Collect and model each missing part before a complete-chain claim; contract payment alone proves no physical coverage."
      source_ids: []
    - rule_id: same_category_recursion
      applies_to: "journey_integration"
      rule: "A purchased same-category integrated journey is an alternative completed subchain, not an extra output. Use its disclosed completed scope once and expand only uncovered cells; stop recursive inclusion at the documented delivery gate."
      source_ids: []
    - rule_id: physical_activity_complete
      applies_to: "owned_road_leg;owned_rail_leg"
      rule: "Retain attributable empty repositioning, standby, layover, interrupted trips, maintenance tests and required support even when passenger boardings are zero. Reporting metrics such as revenue distance may omit activity and cannot replace complete activity records."
      source_ids:
        - fta-ntd-glossary
    - rule_id: capital_boundary
      applies_to: "asset_completion"
      rule: "This PCR requires disclosed allocated vehicle, battery, equipment, station and guideway manufacture, replacement, maintenance and end-of-life where attributable and not already covered. This is a PCR life-cycle choice; the public ISO 14083 operations scope is not evidence that capital is included or excluded from a supplied result."
      source_ids: []
    - rule_id: native_unit_gate
      applies_to: "journey_integration"
      rule: "The Count provider-input cards apply only to compatible completed person-leg results. Other native units require their own verified flow, property, unit and measured equivalence; do not put a pkm, vehicle-km, vehicle-hour or money-based UUID into a Count card."
      source_ids: []
    - rule_id: direct_release_gate
      applies_to: "owned_road_leg;owned_rail_leg;uncaptured_support"
      rule: "Record actual substance, carbon origin, native basis and receiving compartment for direct emissions. Contained wastewater and recovered material are not ambient releases; water loss is not automatically wastewater or water-vapour emission."
      source_ids: []
    - rule_id: unknown_not_zero
      applies_to: "all_processes"
      rule: "Unknown occurrence, quantity, identity, provider boundary, loss or fate blocks completion of the affected foreground package; it is neither zero nor permission to omit a needed exchange. Absence requires affirmative evidence."
      source_ids: []
    - rule_id: capital_complete
      applies_to: "asset_completion;water_terminal_support"
      rule: "This PCR explicitly requires attributable vessel and shore-asset manufacture, original/replacement equipment, maintenance, dry-dock, charging/mooring/quay/terminal assets and retirement/end-of-life. Verify actual delivery gates and coverage before lifetime allocation. A manufacture-only ship identity does not cover the other stages; no lifetime service fiction or unsupported universal life."
      source_ids: []
    - rule_id: chemical_fates
      applies_to: "owned_water_leg;owned_water_residues"
      rule: "Keep actual fuel, lubricant, refrigerant, cooling, cleaning and coating supply/stock/use/recovery/fates separate. Assess each actual bilge, black/graywater, scrubber washwater/sludge, ballast intake/discharge/sediment, garbage, antifoulant leachate and hull-cleaning residue. Actual species, receiving freshwater/seawater/soil/air and subcompartment must be identified; waste handover and direct environmental release are different exchanges."
      source_ids:
        - imo-pollution
boundary_abstraction:
  declared_starting_condition: "Actual journey/operation/provider/asset records and purchased results with explicit upstream coverage"
  starting_condition_role: "Coverage interface for supplied and physical operation results, not permission to ignore upstream burdens"
  product_classification_scope: "Full actual64113 scheduled urban/suburban mixed-mode function with rail,land and water combinations;at least two actual distinct modes,not allthree mandatory;one code-specific integrated output"
  recursive_input_rule: "Use a same-category completed subchain once and expand only uncovered cells; no new final output or duplicated supplied result"
  upstream_dataset_requirement: "Each energy/material/provider/lifecycle component requires native unit, boundary, geography, technology, period and quality evidence; gaps must be completed"
  disclosure: "Disclose owned/purchased matrix, full lifecycle coverage, period/denominator, allocation/exclusion rationale, uncertainty and gaps; an operational GHG result is not a complete multi-impact lifecycle result"
