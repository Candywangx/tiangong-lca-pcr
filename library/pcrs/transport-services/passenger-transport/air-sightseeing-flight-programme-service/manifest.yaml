    - row_id: "jet_a1"
      reason: "One initial+one refinement and direct read: e1ede47a is manufactured at-plant kerosene-type jet fuel family, no certified Jet A-1 grade/formulation or actual delivery gate confirmed. Do not substitute generic kerosene/road diesel or claim family record certifies grade."
    - row_id: "avgas_100ll"
      reason: "One initial+one refinement and direct read:60324705 is generic at-plant aviation gasoline with unspecified grade/additive composition; no100LL/lead content confirmation. Road gasoline/additives do not identify this actual grade."
    - row_id: "propane"
      reason: "One initial+one refinement and direct read:9c0d706a has correct propane CAS74-98-6 and Mass, but factory-mix density range lacks state basis; standard-title claim and unrelated ether text are not trustworthy qualification evidence. No compatible actual liquid-cylinder/supply gate established; do not import that range/standard or bind LPG mixture as pure propane."
    - row_id: "helium_supply"
      reason: "One initial+one refinement found other industrial gases, nitrogen, air, natural gas or unrelated compounds; no compatible actual lifting-helium product identity/purity/storage/supply gate. Helium elementary release UUID is not a product supply."
    - row_id: "turboprop_aircraft"
      reason: "One initial+one refinement returned generic aircraft-weight classes, parts or unrelated products, not unique complete single-engine turboprop assembly with native Item(s) manufacturing support. No invented mass conversion."
    - row_id: "turbine_helicopter"
      reason: "One initial+one refinement returned broad helicopters/equipment/unrelated products, not verified actual complete single-turbine passenger helicopter Item(s) assembly."
    - row_id: "unpowered_glider"
      reason: "One initial+one refinement returned mixed balloons/dirigibles/gliders family or motorcycle glider components, not one complete unpowered two-seat sailplane/native Count identity."
    - row_id: "completed_programme"
      reason: "One initial+one refinement returned aircraft assets, road passenger/distance/freight-like services, not completed participant aerial-viewing programme Count. Reference Count support verified separately; no service UUID invented."
    - row_id: "wash_wastewater"
      reason: "One initial+one refinement returned source-specific industrial wastewater or cleaning directly discharged to water; not actual independently collected aircraft-wash composition/generation/receiver identity."
  unresolved_evidence:
    - "Actual completed whole programme, mechanism-specific technical/native quantities, provider coverage, all-user duty/life and full physical fates remain mandatory before complete dataset use."
    - "Actual known flight/ground altitude or medium requires verified compatible independent rows; unspecified-air examples cannot erase known states. Physical inventory versus LCIA characterization gaps remain separate."
