          description: "Actual separately evidenced helium vent/leak mass and receiving air state from each balloon/airship/weather-balloon operation. Supply or unexplained inventory deficit is not release evidence. Retained/recovered gas is not emitted; hydrogen and other gases require separate identities. This UUID applies only when the actual record expressly and justifiably retains the unspecified-air subcompartment. Never erase known altitude, upper-troposphere/lower-stratosphere, urban, non-urban or near-ground state to fit it; each actual known state requires an independently verified compatible row without duplicate release. This row does not automatically cover all flight phases."
          amount:
            expression: "attributed_actual_helium_air_release_kg / N"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per declared reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_emissions
              source_ids:
                - faa-balloon-2024
                - zeppelin-case-2026
            ranges: []
allocation_rules:
  - rule_id: actual_roles
    applies_to: "air_sightseeing_service"
    rule: "Use actual participant programme cohort N and allocate real shared flight/launch/site duties across actual service users before normalization. Free/lap participants actually served count; pilots, crew, guides and chase staff are support, not extra passenger outputs. A charter party or seat capacity is not N."
    source_ids:
      - ghg-product-2011
  - rule_id: hierarchy
    applies_to: "air_sightseeing_service"
    rule: "First subdivide actually separable tourist/other-flight/transport/training/cargo/site products. For inseparable joint duty justify causal physical driver and sensitivity, retain allocated sums and incompatible units separately; never add passenger count to tonne-km. Economic allocation requires disclosed reason and actual prices/period only when physical relation cannot be supported."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_allocation
    applies_to: "air_sightseeing_service"
    rule: "For each same asset use actual delivered native quantity times cohort compatible duty divided by positive complete-life all-user duty, then /N. Actual hours/cycles/calendar/corrosion/envelope or engine limits need service-specific causal evidence; no useful-life, depreciation, mass-per-aircraft or capacity assumption. This allocates verified manufacture only; actual use/maintenance/retirement remain independently completed."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_normalization
    applies_to: "air_sightseeing_service"
    rule: "A purchased per-flight/per-hour/per-km/launch/transfer result scales by actual compatible attributed native activity before /N; an already per-equivalent-completed-programme result scales by actual programmes and is not divided twice. Declare included fuel/flight/ground/assets/fates cell by cell and remove only those same foreground cells. Freight or equipment results cannot substitute for this Count programme."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_completion
      process_id: "air_sightseeing_service"
      flow_role: "completed_programme"
      record_type: "operational_record"
      raw_fields: "contract; function; programme_id; participants; staff_roles; completed_partial_cancelled; class; itinerary; duration; quality; contents; period; N"
      collection_method: "Reconcile actual participant-level fulfilment to whole programme and constituent flights/transfers, not tickets or launches. Fix equivalent content/quality cohort. Include causally allocated unsuccessful/empty duties in numerator before divide positive actual N once; N=0 yields no finite service intensity."
      unit: "Item(s)"
      frequency: "each duty/event and complete period/life"
      temporal_coverage: "complete programme cohort and necessary all-user lifetime"
      site_scope: "all actual flight/launch/ground/site/maintenance providers and users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual records/calibration/coverage/balances/applicability and uncertainty"
    - protocol_id: cp_flight
      process_id: "air_sightseeing_service"
      flow_role: "jet_a1; avgas_100ll"
      record_type: "operational_record"
      raw_fields: "aircraft; engine; flight_phase; actual_trajectory_altitude; fuel_grade_composition; density_basis; open_receipts_close_returns; burn_spill_recovery_transfer; all_users; provider_cells"
      collection_method: "Collect actual aircraft/engine phased native activity and compatible fuel stocks/burn separately. Whole delivered blend with composition/carbon-origin ledger OR physical component supplies replacing matching blend coverage, never both. Document actual losses, unburned and captured/vented fates, allocate compatible all-user duty, then /N."
      unit: "kg; actual native flight activity"
      frequency: "each duty/event and complete period/life"
      temporal_coverage: "complete programme cohort and necessary all-user lifetime"
      site_scope: "all actual flight/launch/ground/site/maintenance providers and users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual records/calibration/coverage/balances/applicability and uncertainty"
    - protocol_id: cp_lift
      process_id: "air_sightseeing_service"
      flow_role: "propane; helium_supply; ballast_tap_water"
      record_type: "operational_record"
      raw_fields: "branch; burner; fan; gas_species_purity_pressure; opening_fill_topup_closing; recovery_vent_leak; ballast_material_stock_release_receiver; airship_propulsion_mooring; launch_recovery"
      collection_method: "Close actual fuel/lifting gas/ballast native stocks and all fates on compatible gates, not residual-to-emission. Separate helium/H2, burner fuel and propulsive energy; actual compressed/cryogenic state and measured mass or supported PVT relationship required. Include ground/inflation/aborted duty and all users; normalize allocated quantity /N."
      unit: "kg; actual native gas/material quantity"
      frequency: "each duty/event and complete period/life"
      temporal_coverage: "complete programme cohort and necessary all-user lifetime"
      site_scope: "all actual flight/launch/ground/site/maintenance providers and users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual records/calibration/coverage/balances/applicability and uncertainty"
    - protocol_id: cp_ground
      process_id: "air_sightseeing_service"
      flow_role: "site_ac; ground_gasoline; ground_diesel"
      record_type: "operational_record"
      raw_fields: "towplane_return; winch_auto; rope_retrieve; fan_chase_transfer; mast_truck; meter_gate; energy_stocks; charged_delivered; battery_losses; provider_cells; all_users"
      collection_method: "Record actual glider launch/return/retrieve and balloon/airship support plus included transfers and site duty. Each actual power/fuel/provider gate independent; do not count tow fuel again under inclusive tow result. Meter gross supplies, actual battery/charger losses and internal transfers; blend and stock/burn guards apply; attribute complete actual duty and /N."
      unit: "MJ; kg; native support activity"
      frequency: "each duty/event and complete period/life"
      temporal_coverage: "complete programme cohort and necessary all-user lifetime"
      site_scope: "all actual flight/launch/ground/site/maintenance providers and users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual records/calibration/coverage/balances/applicability and uncertainty"
    - protocol_id: cp_bundle
      process_id: "air_sightseeing_service"
      flow_role: "completed_programme"
      record_type: "service_record"
      raw_fields: "included_content; interpretation; transfers; meals_actual_recipe; wrappers; staff_duty; providers; served_participants; failed_duty; other_site_users"
      collection_method: "Reconcile actual contracts, delivered incidental content and provider stage coverage. Independently expand actual ingredients/packaging/consumables/services and their fates. Provider native result times actual compatible activity before /N, no repeat division for equivalent per-programme results; all actual beneficiaries and staff-support duty accounted."
      unit: "actual native quantities"
      frequency: "each duty/event and complete period/life"
      temporal_coverage: "complete programme cohort and necessary all-user lifetime"
      site_scope: "all actual flight/launch/ground/site/maintenance providers and users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual records/calibration/coverage/balances/applicability and uncertainty"
    - protocol_id: cp_maintenance
      process_id: "air_sightseeing_service"
      flow_role: "spent_oil; wash_wastewater"
      record_type: "maintenance_record"
      raw_fields: "actual_assembly_component; fluid_chemical_formulation; issue_stock_retained_consumed_collected; wash_deice; replacement; retirement; receiver; treatment_scope; all_users"
      collection_method: "Record actual inspections/repair/engine/battery/envelope/cable renewal and retirement/native materials and fates. Independently retain fresh-input and collected waste identity/composition/gate, direct releases and receiver transport/treatment; no assumed treatment or recycling credit. Allocate actual shared event duty and /N without readding initial included components."
      unit: "kg; Item(s); actual native quantities"
      frequency: "each duty/event and complete period/life"
      temporal_coverage: "complete programme cohort and necessary all-user lifetime"
      site_scope: "all actual flight/launch/ground/site/maintenance providers and users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual records/calibration/coverage/balances/applicability and uncertainty"
    - protocol_id: cp_assets
      process_id: "air_sightseeing_service"
      flow_role: "turboprop_aircraft; turbine_helicopter; unpowered_glider"
      record_type: "asset_record"
      raw_fields: "asset_id; delivered_native_count_mass; gate; initial_components; install_refit; actual_life_hours_cycles_calendar; all_users; cohort_duty; replacements; retirement; provider_cells"
      collection_method: "For each same actual asset record delivered supply quantity and documented manufacture gate. Multiply by compatible cohort duty/positive complete-life all-user duty and /N. Never use a mass-only UUID for Item(s) without actual measured conversion. Life basis is allocation only; separately finish uncaptured install/refit/use/maintenance/retirement, provider-inclusive cells replacing exact duplicates."
      unit: "Item(s); measured compatible native quantities"
      frequency: "each duty/event and complete period/life"
      temporal_coverage: "complete programme cohort and necessary all-user lifetime"
      site_scope: "all actual flight/launch/ground/site/maintenance providers and users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual records/calibration/coverage/balances/applicability and uncertainty"
    - protocol_id: cp_emissions
      process_id: "air_sightseeing_service"
      flow_role: "fossil_co2_air; fossil_ch4_air; n2o_air; so2_air; water_vapour_air; helium_air"
      record_type: "monitoring_record"
      raw_fields: "source; engine_burner_gas; burn_or_release_activity; species_CAS; carbon_origin; chemical_basis; method_factor_applicability; abatement; phase_trajectory_altitude; medium_subcompartment; stock_fates; uncertainty"
      collection_method: "Independently quantify every actual species and phase/height/receiving state through actual measurement or documented compatible source-specific method. No generic 3.16, all-jet factor, supply-to-release shortcut or invented methane/N2O zero. Known high-altitude or ground state remains distinct; physical inventory and LCIA characterization gaps separate. Attribute actual all-user releases /N."
      unit: "kg specific substance; actual native physical activity"
      frequency: "each duty/event and complete period/life"
      temporal_coverage: "complete programme cohort and necessary all-user lifetime"
      site_scope: "all actual flight/launch/ground/site/maintenance providers and users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual records/calibration/coverage/balances/applicability and uncertainty"
  calculation_rules:
    - id: normalization
      applies_to: "air_sightseeing_service"
      rule: "Sum actual compatible attributable native duty quantities across whole programme, launch/ground/bundle/failed duties and all beneficiaries, then /positive N once. Already per-equivalent-programme results avoid repeat division; per-flight/hour/km results first multiply actual activity."
      inputs:
        - cp_completion
        - cp_flight
        - cp_ground
        - cp_bundle
      output: "Attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: fuel_gas_ballast_balance
      applies_to: "air_sightseeing_service"
      rule: "On each compatible physical gate reconcile opening+receipts-closing-returns to separately evidenced burned/retained/transferred/spilled/vented/leaked/recovered fates; do not manufacture emission from residual. Whole blend with composition ledger OR actual component supplies replacing matching blend coverage. Gas inlet/air entrainment/ballonet are not all helium; actual purity and native mass balance required."
      inputs:
        - cp_flight
        - cp_lift
        - cp_ground
        - cp_emissions
      output: "Attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: same_asset_supply
      applies_to: "air_sightseeing_service"
      rule: "Actual delivered native quantity times compatible cohort duty/positive complete-life same-asset all-user duty, then/N, allocates only verified manufacturing/supply gate. Independently finish uncovered installation/refit/operation/maintenance/replacements/retirement; no double whole-assembly initial components."
      inputs:
        - cp_assets
        - cp_maintenance
      output: "Attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: species_state
      applies_to: "air_sightseeing_service"
      rule: "Actual compatible measurement or source-specific factor times actual burned/released native activity, preserving species/chemical basis/carbon origin/height/medium and abatement; no generic jet factor for balloons or arbitrary lifecycle CO2/nonCO2 multiplier. Separate physical gaps and LCIA limits."
      inputs:
        - cp_emissions
      output: "Attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: function_completion
      applies_to: "air_sightseeing_service"
      requirement: "Verify actual sightseeing function, whole content/quality/duration/trajectory and participant completion, not invoice/ticket or aircraft availability. Partial/aborted/empty/failed weather duty and all beneficiaries reconcile over complete period; positive N mandatory."
      evidence: "cp_completion; cp_bundle"
    - id: actual_branch_inputs
      applies_to: "air_sightseeing_service"
      requirement: "For every actual engine/burner/electric/hybrid mechanism independently expand each specific fuel/grade/blend component where replacement chosen, lubricant/hydraulic fluid, refrigerant/agent, battery/charger, deicer/cleaner and supplied water. Record exact process/direction/type/identity/native amount/CP/source/gate. No road gasoline/diesel proxy for avgas/Jet A-1, and no no-tailpipe=lifecycle-zero rule."
      evidence: "cp_flight; cp_ground; cp_maintenance"
    - id: glider_actual_interfaces
      applies_to: "air_sightseeing_service"
      requirement: "Determine actual aerotow/winch/auto/selflaunch/other mechanism, towplane full return, line retrieval and recovery all-user duty, rope/cable/fuel/power manufacture/replacements/maintenance/retirement. Actual purchased provider coverage is exclusive with its included quantities. Actual route technical evidence mandatory, not manufacturer defaults invented here."
      evidence: "cp_ground; cp_assets"
    - id: lift_and_propulsion_states
      applies_to: "air_sightseeing_service"
      requirement: "For actual gas balloon/airship/thermal/hybrid branch expand helium/H2/other real gases by identity/purity/storage state, compressors/cylinders/topup/recovery/vent/leak, gas cells/ballonets/envelope/basket/burner/fan, propulsion and mooring/mast/winch/ground vehicles. Independently expand actual water/sand/other ballast input/recovery/release with receiver/native unit. Source chapter scope limits do not delete actual superpressure/hybrid interfaces."
      evidence: "cp_lift; cp_ground; cp_assets"
    - id: all_assets_and_fates
      applies_to: "air_sightseeing_service"
      requirement: "Independently expand every actual whole assembly or uncovered initial component, runway/terminal/hangar/mooring/site and land interface with actual manufacture/native quantity/all-user life duty. Engine/rotor/battery/cell/envelope/rope changes, maintenance materials and each retirement/treatment state remain explicit. Choose whole assembly OR its same included initial components; no automatic zero for heritage/leased/shared assets."
      evidence: "cp_assets; cp_maintenance"
    - id: actual_releases_and_wastes
      applies_to: "air_sightseeing_service"
      requirement: "Expand all actual species/medium/altitude states: carbon origins, CO, individually specified nitrogen oxides/hydrocarbons/aldehydes, nonoverlapping particle size/chemistry, lead compounds from actual leaded fuel, sulfur species, refrigerant/gas leaks, liquid ballast to actual receivers, spills and runoff; captured residues/filters/deicing liquids/sewage/food/packaging each get real separate collection identity and receiver. Unknown is not zero; mass balances are checks, not invented species."
      evidence: "cp_emissions; cp_maintenance; cp_bundle"
    - id: altitude_and_climate
      applies_to: "air_sightseeing_service"
      requirement: "Preserve actual ground/flight phase/altitude and compatible subcompartment; never replace known upper-air by unspecified ground-air to obtain a UUID or characterization. Quantify actual physical noise/non-CO2/contrail relevant activity with declared method and uncertainty. Missing LCIA support is disclosed without erasing inventory or manufacturing a mass exchange from CO2e."
      evidence: "cp_emissions"
    - id: provider_and_evidence_closure
      applies_to: "air_sightseeing_service"
      requirement: "Require row-addressable actual quantities, method applicability/calibration, provider exact lifecycle cells, included content and independent-source applicability. A compatible purchased flight/tow/transfer/meal result replaces only covered physical cells after actual native scaling. Missing data, collection states or range evidence blocks complete application, not repaired with universal factors or guessed values."
      evidence: "cp_completion; cp_flight; cp_lift; cp_ground; cp_bundle; cp_maintenance; cp_assets; cp_emissions"
validation_rules:
  - rule_id: service_closure
    applies_to: "air_sightseeing_service"
    rule: "Reject mismatched completion/quality/content, missing zero-output causal duties, finite N=0 intensity, tickets/capacity substituted for participants or repeated normalization."
    source_ids:
      - ghg-product-2011
  - rule_id: identity_native_state
    applies_to: "air_sightseeing_service"
    rule: "Reject umbrella/selector exchanges, mismatched UUID/native Count/Mass/medium/altitude, invented factors or unknown-as-zero. Require every actual branch expansion and stock/fate evidence before complete use."
    source_ids:
      - ghg-product-2011
  - rule_id: coverage_asset_provider
    applies_to: "air_sightseeing_service"
    rule: "Reject omitted launch/recovery/bundle/maintenance/capital/retirement, unsupported allocation, inclusive-provider double count or a delivered asset UUID treated as whole-life sightseeing. Every actual CP owns exactly one existing process and its linked rows."
    source_ids:
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset/background_dataset only with actual identities, quantities and complete qualified coverage"
  allowed_use: "Actual equivalent whole participant aerial-viewing flight programme with declared mechanism/content/quality/trajectory/duty/lifecycle"
  excluded_use: "Universal air transport/aircraft factor; mere ticket, seat, sortie, hour, aircraft availability, training/jump/adventure or unreviewed whole holiday bundle"
  required_metadata: "sightseeing_function; whole_programme_content; actual_participant_completion_N; operator_and_responsibilities; aircraft_lift_launch_propulsion_mechanism; actual_trajectory_altitude_geography; duration_quality_class; constituent_flights_and_included_ground_support; period_all_user_duty; fuel_gas_ballast_state_and_fates; provider_coverage; same_asset_all_user_life; actual_species_medium; uncertainty_and_LCIA_gaps"
  required_quality_disclosure: "All actual identity/quantity/provider/asset/all-user-life/stock/fate gaps, flight and ground altitude/medium, actual branch technical applicability and physical versus LCIA uncertainty"
  update_trigger: "Actual programme/function/quality/content, mechanism/aircraft/engine/gas/fuel/launch, provider/asset/life/allocation or physical release/LCIA method changes"
data_sources:
  - id: "unsd-cpc3-air-sightseeing"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 printed p361 subclass64134; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Sightseeing passenger air transport classification only; no aircraft recipe or completed-unit mandate."
  - id: "ipcc-aviation-2006"
    type: "official_guidance"
    reference: "IPCC2006 Guidelines Vol2Ch3 §3.6 pp3.56–3.59; https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Actual engine/fuel/phases/altitude source questions; national GHG method, not lifecycle or universal branch factors. No numerical defaults adopted."
  - id: "faa-balloon-2024"
    type: "handbook"
    reference: "FAA Balloon Flying Handbook FAA-H-8083-11B actual2024, ch2 systems, ch6 layout/launch, ch8 recovery, ch11 gas balloons; https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/Balloon_Flying_Handbook"
    used_for: "Conditional actual burner/fan/gas/ballast/ground interfaces; ch11 mainly zero-pressure gas balloons. No universal purity, quantity, legal or safety prescription here."
  - id: "faa-glider-2024"
    type: "handbook"
    reference: "FAA Glider Flying Handbook FAA-H-8083-13B actual2024 ch7 pp7-17–7-18 and7-30–7-31; https://www.faa.gov/regulations_policies/handbooks_manuals/aviation/glider_handbook"
    used_for: "Actual tow-return/winch/auto/selflaunch physical interfaces; flightmanual evidence required for actual equipment. Not proof every glider flight is sightseeing."
  - id: "papillon-case-2026"
    type: "handbook"
    reference: "Papillon operator FAQ case, not an independent scientific factor; public snapshot2026-10-21; https://www.papillon.com/guest-services/frequently-asked-questions/"
    used_for: "Actual helicopter/fixedwing tour versus flighttime and included transfer/content questions, not universal durations/occupancy."
  - id: "hotair-case-2026"
    type: "handbook"
    reference: "Hot Air Australia operator FAQ case, not an independent scientific factor; public snapshot2026-10-21; https://www.hotair.com.au/frequently-asked-questions-faq"
    used_for: "Actual balloon trajectory/weather/landing and full service questions; not fixedOD, default breakfast or numerical programme recipe."
  - id: "zeppelin-case-2026"
    type: "handbook"
    reference: "Deutsche Zeppelin-Reederei operator FAQ case, not an independent scientific factor; public snapshot2026-10-21; https://zeppelinflug.de/en/faqs"
    used_for: "Actual aerial-viewing product and propulsion/helium/ballonet/mooring/ground interfaces; NT-specific quantities not generalized."
  - id: "icao-icec-2024"
    type: "official_guidance"
    reference: "ICAO ICEC methodology actual v13.1 August 2024 §§1–3 pp3–4; https://icec.icao.int/Documents/Methodology%20ICAO%20Carbon%20Emissions%20Calculator_v13_Final.pdf"
    used_for: "Operational scheduled-flight CO2 calculator scope/counterevidence only; not life cycle/non-CO2 or universal sightseeing factor. No factor adopted."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "GHG Protocol Product Life Cycle Accounting and Reporting Standard2011 chapters7–9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary/data/subdivision/allocation principles. Complete capital/launch/recovery/support boundary, Count programme and formulas are explicit PCR design choices, not quoted standard factors."
