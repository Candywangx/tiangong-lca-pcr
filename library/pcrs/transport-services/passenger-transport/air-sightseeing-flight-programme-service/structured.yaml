  - id: native_units
    applies_to: "air_sightseeing_service"
    required_property_ref:
      name: "Actual compatible native property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Keep actual native quantities: count programme/aircraft, hours/cycles, fuel/gas/material mass and electrical energy distinct. Convert compatible kWh by verified 3.6 MJ/kWh only; volume-to-mass requires actual density/state, gas PVT actual purity/pressure/temperature/compressibility and method evidence. No aircraft weight invented to bind a Mass UUID to Count."
  - id: chemical_and_medium
    applies_to: "air_sightseeing_service"
    required_property_ref:
      name: "Actual compatible native property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Retain kg compound versus kg C/N/S, fossil/biogenic origins and actual phase/altitude/receiving medium; one species cannot stand for NOx/VOC/lead/particle mixtures. Noise/contrail LCIA quantities are not elementary substance masses."
  - id: stock_and_flow
    applies_to: "air_sightseeing_service"
    required_property_ref:
      name: "Actual compatible native property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Supply, stock withdrawal, combustion, retained gas/ballast, release, capture/recovery and transfer differ. Gross electricity import/internal storage/recovery/export differ; no implicit complete oxidation, venting or automatic recycling credit."
