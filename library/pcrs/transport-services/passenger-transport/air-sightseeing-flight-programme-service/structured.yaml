product_category_identity:
  canonical_pcr_id: "pcr.air-sightseeing-flight-programme-service"
  classification_refs: "CPC 3.0 64134; exact function"
  covered_products: "Completed participant operator-fulfilled aerial-viewing flight programme; actual fixedwing/rotor/glider/hotair/gasballoon/airship and other qualifying mechanisms with mandatory complete actual interfaces"
  excluded_products: "Ordinary A-B air transport; customer-controlled aircraft availability; reservation only; primary piloting/active jump/adventure/competition; independently fulfilled multiactivity holiday"
  representative_product: "One actual participant completes the declared aerial-viewing programme"
  production_route: "Actual flight/lift/launch mechanism plus included ground/recovery/interpretation and full attributed lifecycle"
  market_state: "Actually fulfilled programme qualified by duration, view/interpretation quality and included content"
functional_unit:
  what: "Completed participant air sightseeing flight programme"
  how_much: "1 actual participant completing the whole declared programme"
  how_well: "Actual viewing/interpretation quality, mechanism, class, trajectory/altitude and included content"
  how_long_or_cycle: "Actual agreed programme beginning through fulfilled end including actual included ground/recovery content"
  reference_flow_link: "completed_programme"
system_boundary:
  rules:
    - rule_id: full_duty
      applies_to: "air_sightseeing_service"
      rule: "Retain actual taxi/start/warm-up/takeoff/hover/climb/cruise/descent/landing, tow/return, fan/inflation, launch attempts, failed/weather-aborted/zero-passenger/standby/repositioning/recovery duties causally attributable to the service pool, even when no participant completes that duty. Purchased actual providers replace only exact covered cells."
      source_ids:
        - ipcc-aviation-2006
        - faa-glider-2024
        - faa-balloon-2024
    - rule_id: glider_launch
      applies_to: "air_sightseeing_service"
      rule: "Actual aerotow includes towplane launch and return plus uncovered aircraft/engine/fuel/maintenance/capital; winch/auto launch includes actual power/rope/retrieval/ground support, selflaunch actual engine/battery interfaces. No engine on the sailplane does not mean zero lifecycle burden. A purchased inclusive tow result and its same included fuels/assets are exclusive."
      source_ids:
        - faa-glider-2024
    - rule_id: lift_branches
      applies_to: "air_sightseeing_service"
      rule: "Hot-air actual burner/cylinder/fan and ground recovery; gas-balloon actual lifting-gas storage/compression/fill/topup/vent/leak/recovery and ballast release/receiver; airship actual propulsion, lifting gas/ballonets, mast/winch/truck/mooring/hangar and ground crew are mandatory conditional interfaces. Lifting gas is not automatically fuel or wholly released each flight."
      source_ids:
        - faa-balloon-2024
        - zeppelin-case-2026
    - rule_id: complete_lifecycle
      applies_to: "air_sightseeing_service"
      rule: "Account for actual aircraft/envelope/basket/burner/cylinder/engine/rotor/battery/rope/winch/site/runway/terminal/hangar/mooring/ground-vehicle manufacture, installation, maintenance, replacements and retirement within the declared responsibility, subdividing all other users. Whole assemblies versus their included initial components are exclusive."
      source_ids:
        - ghg-product-2011
    - rule_id: physical_releases
      applies_to: "air_sightseeing_service"
      rule: "Retain actual species/carbon origin/chemical basis/phase/height/receiving medium. Captured fluids/particles are waste only at their real collection gate, not simultaneously emissions. Noise, contrail formation and other non-CO2 mechanisms need actual physical activity and explicit LCIA method/uncertainty, not arbitrary mass flows or a CO2 multiplier. Missing characterization does not make real physical releases zero."
      source_ids:
        - ipcc-aviation-2006
        - icao-icec-2024
boundary_abstraction:
  declared_starting_condition: "Actual sightseeing contract, complete programme, mechanism/aircraft/launch/site/provider/asset responsibilities"
