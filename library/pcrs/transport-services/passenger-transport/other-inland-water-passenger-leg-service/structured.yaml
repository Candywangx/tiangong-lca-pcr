      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| subdivide_then_allocate | all_processes | Separate dedicated passenger, separately sold vehicle/deck/cargo and other services wherever actual measurements permit. Allocate remaining shared propulsion/hotel/port/capital using supported physical relationships and compatible all-user duty; justify alternatives and sensitivity if no physical relationship is established. Fare/ticket revenue is not a physical allocation driver. | ghg-product-2011 |\n| accompanying_bundle | other_inland_delivery | Disclose whether vehicles, luggage, animals, cabin or other inclusions are part of the actual declared passenger bundle or separately sold outputs. Do not count accompanying objects or their occupants twice; measure actual persons including vehicle occupants once. No universal car-to-person, weight, deck-area or fare equivalence is prescribed. Separate freight cannot disappear as free accompaniment. Every independently sold cargo,vehicle-deck or other product requires its own actual atomic output row with native quantity and all section8 expansion fields; do not force it into the passenger Count reference. |  |\n| segment_person_closure | other_inland_delivery;vessel_operation | Use actual person-leg completion and onboard segment populations/distances and resource use. Stops do not create repeated completed service for the same declared leg. Allocate actual jointly used segments consistently with the declared cohort and other services; do not divide an already per-person supplier result again by occupancy. |  |\n| native_supply_life | vessel_lifecycle;port_support | For each actual delivered asset/cohort, use native manufacture quantity times attributable same-asset compatible duty / supported total all-user useful duty, then /N. Duty may be justified hours, voyages or other compatible physical use; it is allocation, not a new flow identity. Support all-user denominator, second-hand/refit histories and prospective uncertainty. Period fuel/use emissions are not divided by lifetime duty again. |  |\n| no_mixed_denominator | all_processes | Passenger Count, person-distance, vehicle count, occupied area-time and cargo tonne-distance are distinct measures and cannot be summed. Supported engineering/resource models may relate outputs only with explicit dimensions, observations and sensitivity. N=0 yields no finite reference intensity; retain and resolve the causal duty pool, not zero its numerator. |  |\n| recovery_and_export | all_processes | Use evidenced waste/product status, receiver and allocation for recovered material/energy. Internal battery discharge, regenerative energy, recirculated water and other transfers are not extra purchased inputs or avoided-product credits. Genuine external export requires a separate native gate, actual quantity and disclosed allocation without netting incompatible imports. |  |\n| mixed_waterborne_functions | all_processes | For actual water-taxi/commercial-private/cruise-charter/cargo-passenger fleet use,maintain mutually exclusive all-function duty cells and actual person/segment fulfilment. Allocate dedicated passenger,optional sold cabin/meal and cargo gear/handling loads by subdivision first; justify remaining shared hull/propulsion/hotel/dwell shares with actual causal data. Same ship or operator does not make every transaction the same product or allow an inclusive cruise package to disappear; actual included functions stay complete. |  |\n| actual_cargo_common_vessel | all_processes | For genuine independent cargo/passenger functions first measure/subdivide dedicated boarding/cabin/sanitary/meal versus cargo/reefer/loading/dwell/port quantities and actual native outputs. Justify residual shared hull/propulsion/hotel/shore/lifecycle through actual causal alluser resource/duty data and sensitivity. Cargo-primary is not passengerfreeburden, a freightjourney is not personreference, and Count plus tonnes/tonnekilometres cannot be added. Included meal/cabin remains complete; actual independent native services replace exactly covered cells once. | ghg-product-2011 |\n\n"
