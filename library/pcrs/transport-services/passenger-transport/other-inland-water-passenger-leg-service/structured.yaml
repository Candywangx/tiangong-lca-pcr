      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual64129inland residualcarriage personleg original/acceptedOD/quality/time, passenger/crew roles and dispatch/schedule/vessel/shore/provider/asset responsibility |\n| starting_condition_role | Accountability interface,not a zero-burden start for vessel/upstream history |\n| product_classification_scope | Onlyfull64129rivers/canals/otherinlandwaters passenger carriage anyschedule includingactualwatertaxi,excludingactualferry/cruise/sightseeing/excursion; notallboats orwatertaxionly |\n| recursive_input_rule | Link one concrete completed supplier subservice only after identity,native quantity and coverage verification; no extra final-leg output |\n| upstream_dataset_requirement | Verify native gate,stages,quantity,quality and coverage for each actual fuel,energy,material,asset and treatment service |\n| disclosure | Actual function,waterbody,architecture,bundle,period,all duties,coverage,lifecycle,allocation,species/media and evidence gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| service_start | other_inland_delivery | Include actual completed passenger leg, covered accompaniment and unavoidable attributable embarkation/disembarkation, voyage, hotel and port support. Record actual waterbody/OD, vessel configuration and included service; no arbitrary distance divides inland from coastal/ocean. | un-cpc3-2025 |\n| duty_pool | vessel_operation;port_support | Include attributable manoeuvring, waiting, hotelling, empty/repositioning, charging, maintenance/test and failed/interrupted duties within the evidenced service pool. Their lack of completed passengers is not evidence of zero burden. Preserve period/cohort causality. |  |\n| provider_cells | all_processes | Use an explicit provider-by-vessel/voyage/port/stage/period coverage ledger. Either consume a completed compatible supplier result plus only uncaptured integrator burdens, or own physical inputs and link uncovered external stages. A provider-included fuel supply, use-phase release, vessel manufacture or waste treatment replaces that exact foreground cell, never coexists with it; gaps require mandatory expansion. |  |\n| capital_complete | vessel_lifecycle;port_support | This PCR explicitly requires attributable vessel and shore-asset manufacture, original/replacement equipment, maintenance, dry-dock, charging/mooring/quay/terminal assets and retirement/end-of-life. Verify actual delivery gates and coverage before lifetime allocation. A manufacture-only ship identity does not cover the other stages; no lifetime service fiction or unsupported universal life. | ghg-product-2011 |\n| chemical_fates | vessel_operation;onboard_residues | Keep actual fuel, lubricant, refrigerant, cooling, cleaning and coating supply/stock/use/recovery/fates separate. Assess each actual bilge, black/graywater, scrubber washwater/sludge, ballast intake/discharge/sediment, garbage, antifoulant leachate and hull-cleaning residue. Actual species, receiving freshwater/seawater/soil/air and subcompartment must be identified; waste handover and direct environmental release are different exchanges. | imo-pollution |\n| crew_and_inclusions | other_inland_delivery;vessel_operation | Working crew are operational support, not passenger output. Include actual attributable crew accommodation, sanitation and operator-provided meals/support and any included passenger amenities. Ordinary off-duty personal subsistence is excluded as an explicit PCR choice, disclosed for comparison; this does not remove onboard operational provisions or justify zero emissions. Actual separately transported off-duty passengers require evidenced passenger status. For actual sail/operator-propelled carriage record real operator/assistant/passenger roles, tasks, exertion, work/rest, rig/control/assistance and dedicated service support. Ordinary human subsistence, personal diet/housing/reproduction and ordinary metabolic releases are excluded as an explicitly disclosed service-boundary convention, not measured physical zero. Include causally attributable service-specific food/drink, safety/PPE/facilities and business support using real native quantities and all-user shares. Comparison with motorized or other routes requires equivalent function/boundaries and explicit sensitivity to the human boundary. If an extended boundary includes incremental work nutrition or attributable metabolic releases, require independent actual physiology/intake/exertion/counterfactual and C/N/water/body-retention/compound/carbon-origin/receiving-medium evidence, with exact upstream food/provider coverage and no second food burden. Never convert wages/hours/calories/wind/humanwork into fictitious purchased fuel or a universal labour-food factor. |  |\n| architecture_duties | vessel_operation;vessel_lifecycle;port_support | Select actual displacement, hydrofoil or air-cushion architecture from vessel evidence. For hydrofoils include displacement/transition/foilborne periods, foil controls/actuators, actual foil/strut repairs and materials. For hovercraft include lift-fan and thrust energy, inflate/deflate/idle operation, shore/beach approach and actual skirt wear/replacements/residues; never omit lift energy or assume a propeller-only fuel profile. Whole-craft original parts replace their exact component manufacture cells. Actual fan/propeller air movement is internal physical operation, not a fabricated pollutant flow. Other architectures or chemical-energy routes require documented specific completion/review, not an assumed generic efficiency. |  |\n| contract_and_dispatch | other_inland_delivery;vessel_operation;port_support | Declare actual fulfilled point-to-point passenger transport versus separately sold vessel/crew availability,rental,cruise or sightseeing function; private group,booking channel or hourly price alone does not change the product to or from person-leg transport. For actual water-taxi duty,include attributable dispatch,pickup/reposition,waiting,cancelled/failed requests and return-to-dock/next-job legs. Reconcile shared commercial/private/charter/cruise/cargo vessel uses and each platform/operator/provider owner; booking-only organizer cannot claim physical transport without linked completed provider coverage. | water-taxi-operator-case;un-cpc3-2025 |\n| cargo_passenger_inclusions | other_inland_delivery;vessel_operation;port_support;vessel_lifecycle | For actual non-cruise passenger service on a freight/cargo-passenger ship,record actual boarding/alighting,calls,travel duration/class and actual included versus separately sold cabin,berth,meal or other functions. Do not treat cargo-primary operation as free passenger transport or an inclusive cruise as a bare leg. Complete dedicated/shared cargo-handling,reefer/hotel/galley/laundry/sanitary and cargo-caused port dwell cells with measured/justified causal allocation and provider ownership. Included meals/cabin must remain in the passenger bundle; separately sold services require independent actual native output rows and allocated inputs/lifecycle/fates. | cargo-passenger-operator-case |\n| other_inland_actual_function | other_inland_delivery | Verify actual64129residual passenger carriage in rivers/canals/otherinlandwaters on anyschedule, including but not limited to water taxi. Exclude actualferry/cruise/sightseeing/excursion/coastal-ocean or different availability function,not by brand/optionalmeal/cabin/cargo presence alone. Original acceptedOD/completion and actual dispatch/provider responsibilities define output; failureendpoint cannot be changed posthoc to manufacture success. | un-cpc3-2025 |\n| transported_objects_not_assets | other_inland_delivery;vessel_operation;port_support;vessel_lifecycle | Actual carried luggage/animal/vehicle/item is a transported object,not automatically a production input requiring its own manufacture/rearing/wholelife. Real transport-time loading/handling/care/sanitation/provision and support assets/releases remain owned at actual native quantities. Separately priced item alone is not independent output; true distinct functions require actual atomicnative output rows and justified subdivision/sharedallocation without repeated persons/objects. |  |\n\n"
