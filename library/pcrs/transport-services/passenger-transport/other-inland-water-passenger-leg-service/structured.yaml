allocation_rules:
  - rule_id: subdivide_then_allocate
    applies_to: "all_processes"
    rule: "Separate dedicated passenger, separately sold vehicle/deck/cargo and other services wherever actual measurements permit. Allocate remaining shared propulsion/hotel/port/capital using supported physical relationships and compatible all-user duty; justify alternatives and sensitivity if no physical relationship is established. Fare/ticket revenue is not a physical allocation driver."
    source_ids:
      - ghg-product-2011
  - rule_id: accompanying_bundle
    applies_to: "other_inland_delivery"
    rule: "Disclose whether vehicles, luggage, animals, cabin or other inclusions are part of the actual declared passenger bundle or separately sold outputs. Do not count accompanying objects or their occupants twice; measure actual persons including vehicle occupants once. No universal car-to-person, weight, deck-area or fare equivalence is prescribed. Separate freight cannot disappear as free accompaniment. Every independently sold cargo,vehicle-deck or other product requires its own actual atomic output row with native quantity and all section8 expansion fields; do not force it into the passenger Count reference."
    source_ids: []
  - rule_id: segment_person_closure
    applies_to: "other_inland_delivery;vessel_operation"
    rule: "Use actual person-leg completion and onboard segment populations/distances and resource use. Stops do not create repeated completed service for the same declared leg. Allocate actual jointly used segments consistently with the declared cohort and other services; do not divide an already per-person supplier result again by occupancy."
    source_ids: []
  - rule_id: native_supply_life
    applies_to: "vessel_lifecycle;port_support"
    rule: "For each actual delivered asset/cohort, use native manufacture quantity times attributable same-asset compatible duty / supported total all-user useful duty, then /N. Duty may be justified hours, voyages or other compatible physical use; it is allocation, not a new flow identity. Support all-user denominator, second-hand/refit histories and prospective uncertainty. Period fuel/use emissions are not divided by lifetime duty again."
    source_ids: []
  - rule_id: no_mixed_denominator
    applies_to: "all_processes"
    rule: "Passenger Count, person-distance, vehicle count, occupied area-time and cargo tonne-distance are distinct measures and cannot be summed. Supported engineering/resource models may relate outputs only with explicit dimensions, observations and sensitivity. N=0 yields no finite reference intensity; retain and resolve the causal duty pool, not zero its numerator."
    source_ids: []
  - rule_id: recovery_and_export
    applies_to: "all_processes"
    rule: "Use evidenced waste/product status, receiver and allocation for recovered material/energy. Internal battery discharge, regenerative energy, recirculated water and other transfers are not extra purchased inputs or avoided-product credits. Genuine external export requires a separate native gate, actual quantity and disclosed allocation without netting incompatible imports."
    source_ids: []
  - rule_id: mixed_waterborne_functions
    applies_to: "all_processes"
    rule: "For actual water-taxi/commercial-private/cruise-charter/cargo-passenger fleet use,maintain mutually exclusive all-function duty cells and actual person/segment fulfilment. Allocate dedicated passenger,optional sold cabin/meal and cargo gear/handling loads by subdivision first; justify remaining shared hull/propulsion/hotel/dwell shares with actual causal data. Same ship or operator does not make every transaction the same product or allow an inclusive cruise package to disappear; actual included functions stay complete."
    source_ids: []
  - rule_id: actual_cargo_common_vessel
    applies_to: "all_processes"
    rule: "For genuine independent cargo/passenger functions first measure/subdivide dedicated boarding/cabin/sanitary/meal versus cargo/reefer/loading/dwell/port quantities and actual native outputs. Justify residual shared hull/propulsion/hotel/shore/lifecycle through actual causal alluser resource/duty data and sensitivity. Cargo-primary is not passengerfreeburden, a freightjourney is not personreference, and Count plus tonnes/tonnekilometres cannot be added. Included meal/cabin remains complete; actual independent native services replace exactly covered cells once."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "other_inland_delivery"
      flow_role: "completed_other_inland_leg"
      record_type: "actual_record"
      raw_fields: "operator;vessel;architecture;voyage;person_leg_id;boarding_port;alighting_port;calls;actual_waterbody;completion;persons;vehicle_occupants;crew_role;included_bundle;separately_sold_outputs;output_identity_property_unit_quantity;segment_distance;quality;period;provider_cells;transport_kind;contract_function;booking_party_id;temporary_reboarding;included_or_separate_cabin_meals;cargo_native_outputs;actual_64129_residual_carriage;original_promised_OD_extent;chronological_amendments;accepted_final_alighting;failed_no_show_cancel_rescue;actual_dispatch_platform_pickup_dock"
      collection_method: "Reconcile actual boarding/alighting and fulfilment records by person leg and vessel; link intermediate calls without duplicating the same declared leg. Evidence actual persons including vehicle occupants once, distinguish on-duty crew, uncompleted services and sold capacity. Record included/separate accompaniment and cargo; provider cells define actual stage responsibility. Declare actual transport versus vessel/crew availability or inclusive experience. Link actual persons to bookings/parties without using party or payment as N; temporary reboarding before final destination does not duplicate the same leg. Record optional or included accommodation/meals as actual functions/native outputs. Aggregation algorithm: N=sum completed persons for the declared leg cohort; require N>0, count each actual person-leg once. Assign actual joint voyage/segment burdens using supported all-user shares, then normalize once by N. Confirm actual64129residualinlandcarriage,originalpromisedandacceptedOD/quality/time and chronologicalchanges. No endpointshrinkafterfailure, automatic party/ticket/boatcount or extrarescue/reboardingpersonleg; genuineacceptedamended/partialoutput stays explicit."
      unit: "Item(s);kg;tonne-km;km;hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "declared vessel-leg cohort and associated actual service pool"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_operation
      process_id: "vessel_operation"
      flow_role: "marine_distillate;vessel_shore_ac;vessel_tap_water;vessel_detergent;vessel_shore_dc"
      record_type: "actual_record"
      raw_fields: "vessel;architecture;engine_motor;lift_thrust_foil_control;mode_periods;tow_rope_shore_drive_owners;fuel_grade;blend;carbon_origins;opening_stock;receipts;closing_stock;burned;leaked;recovered;shore_gate_ac_dc;gross_import;conversion_losses;battery_soc;water_stocks;other_supply;provider_cells;all_user_share;dispatch_pickup_cancel_return;commercial_private_other_uses;cargo_hotel_dwell;human_operator_assistant_passenger_roles;actual_work_rest_exertion;dedicated_service_support;ordinary_subsistence_metabolic_boundary;comparison_sensitivity;conditional_incremental_nutrition_metabolism_physiology_intake_counterfactual_CN_water_origin_receiver;food_provider_covered_cells"
      collection_method: "Obtain bunker/meter/tank/duty records and actual measured configuration. Reconcile voyage,hotel,empty,failed,charging and architecture-specific lift/transition/shore approach duties. Identify each actual fuel,water,chemical and supplied energy gate; distinguish supply,combustion,loss,recovery and stock. A whole blend with composition ledger OR replacement component supplies requires mass and provider closure, never both. Reconcile AC/DC charge boundaries and storage/charger losses; internal battery/discharge/regen is no new external supply. Reconcile actual water-taxi dispatch,pickup,waiting,cancellation/failure and return duties across all supported vessel uses,with each platform/provider owner. For cargo-passenger routes retain actual passenger hotel/food/sanitary and cargo/reefer duties and evidence each separate or shared cell; no cargo-primary free-ride assumption. Aggregation algorithm: For each actual native period quantity Q, attribute compatible duty/all-user share a to the cohort and compute sum(Q*a)/N once. Fuel activity is reconciled burned mass, not unreconciled purchase; external energy gate chosen exclusively. Actual sail/operator-propelled or alternative/hybrid/fuelcell/battery configurations retain real hull/rig/propulsion/control/auxiliary/shore duties and all native supply/stock/loss/receiver interfaces; no assumed labour-food fuel or missingfuelzero fullcycle. Actual optional cabin/meal and cargo-common operation follows actual scope and nativecoveredcells, not automaticcruise exclusion. For actual sail/operator-propelled carriage record real operator/assistant/passenger roles, tasks, exertion, work/rest, rig/control/assistance and dedicated service support. Ordinary human subsistence, personal diet/housing/reproduction and ordinary metabolic releases are excluded as an explicitly disclosed service-boundary convention, not measured physical zero. Include causally attributable service-specific food/drink, safety/PPE/facilities and business support using real native quantities and all-user shares. Comparison with motorized or other routes requires equivalent function/boundaries and explicit sensitivity to the human boundary. If an extended boundary includes incremental work nutrition or attributable metabolic releases, require independent actual physiology/intake/exertion/counterfactual and C/N/water/body-retention/compound/carbon-origin/receiving-medium evidence, with exact upstream food/provider coverage and no second food burden. Never convert wages/hours/calories/wind/humanwork into fictitious purchased fuel or a universal labour-food factor."
      unit: "kg;kWh;m3;hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "owned/uncovered onboard supply and actual all-user duties"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_air
      process_id: "vessel_operation"
      flow_role: "exhaust_fossil_co2;exhaust_biogenic_co2;exhaust_fossil_ch4;exhaust_n2o;refrigerant_hfc134a"
      record_type: "actual_record"
      raw_fields: "vessel;fuel;carbon_origin;engine;load;aftertreatment;duty;burned_activity;monitoring_or_model;factor_basis;source_context;species_mass;air_subcompartment;refrigerant_charge;topup;recovery;stocks;provider_cells;uncertainty"
      collection_method: "Collect actual species monitoring or independently supported fuel/engine/load/mode-compatible models, including actual lift/propulsion/hotel generators. Separate chemical/carbon/nitrogen bases and receiving compartment. Fuel-LCA GHG-only scope cannot remove other actual species. Determine each refrigerant actual charge/recovery balance; separately expand actual NO/NO2,SO2,CO,NMVOC components,particle sizes,biogenic CH4 and other releases as required,not one NOx/SOx collector identity. Aggregation algorithm: Assign actual molecule/species mass to the cohort using the matching duty share; /N once. Model q=sum compatible burned_activity*evidenced_species_factor, preserving actual factor units/conversion and uncertainty; no generic factor supplied."
      unit: "kg"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "owned/uncovered actual airborne release at actual subcompartment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_residues
      process_id: "onboard_residues"
      flow_role: "vessel_used_oil;collected_bilgewater;held_blackwater;vessel_plastic_packaging"
      record_type: "actual_record"
      raw_fields: "vessel;stream_id;origin;composition;moisture;phase;mass_volume;density_basis;generated;stocks;onboard_treatment;recovery;handover;receiver;transport_treatment_coverage;direct_species_release;receiving_waterbody_subcompartment;ballast;coating;skirt_or_foil_residues;uncertainty"
      collection_method: "Use actual tank,maintenance,water,chemical and reception records. Keep bilge,blackwater,graywater,combined sewage,scrubber washwater/sludge,ballast intake/discharge/sediment,food/other garbage,coating/leachate and skirt/foil residues separate by actual composition/gate. Close input/generated-stock-treatment-recovery-handover-release fates. Expand direct water/soil/air species with actual recipient,not waste mass as elementary substance. Actual ballast environmental water intake/discharge is separate from tap-water product; do not invent universal use. Aggregation algorithm: For each actual separate wet/dry/native stream Q and supported service share a, compute sum(Q*a)/N; preserve moisture/density conversion proof. Treatment results replace exactly their included treatment/emission cells,not waste generation or unrelated streams."
      unit: "kg;m3"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "actual onboard residue generation,holding,treatment and external recipients"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_port
      process_id: "port_support"
      flow_role: "port_ac"
      record_type: "actual_record"
      raw_fields: "port;terminal;boarding;shore_approach;charger_buffer;meter;provider;voltage;upstream_downstream_gate;supplies;wastes;releases;assets;life;all_users;attributable_duty;coverage_cells;remote_organizer;actual_pickup_docks;cargo_loading_reefer_dwell;allocation_causality;human_operator_assistant_passenger_roles;actual_work_rest_exertion;dedicated_service_support;ordinary_subsistence_metabolic_boundary;comparison_sensitivity;conditional_incremental_nutrition_metabolism_physiology_intake_counterfactual_CN_water_origin_receiver;food_provider_covered_cells"
      collection_method: "Measure or support actual attributable terminal/boarding/control/booking/mooring/charging/shoreapproach services,including shore energy losses not already captured. Inventory each actual input,waste,release and quay/ramp/terminal/charger/storage asset and its maintenance/end-of-life; no omission because owned by a port rather than ferry operator. Use a complete provider result OR its uncovered physical cells with compatible native gate. Include actual private/public pickup docks and dedicated/shared cargo-handling,reefer and cargo-caused waiting infrastructure/energy cells. Evidence causal all-user attribution separately from passenger hotel/boarding; a cargo-call delay is not automatically wholly passenger-caused or wholly free. Aggregation algorithm: Attribute actual native period flows by measured or justified all-user resource/duty shares,then /N; asset manufacture uses same-asset lifetime share before /N. Vessel_shore_ac/DC chain and port purchases must close without double allocation. For actual sail/operator-propelled carriage record real operator/assistant/passenger roles, tasks, exertion, work/rest, rig/control/assistance and dedicated service support. Ordinary human subsistence, personal diet/housing/reproduction and ordinary metabolic releases are excluded as an explicitly disclosed service-boundary convention, not measured physical zero. Include causally attributable service-specific food/drink, safety/PPE/facilities and business support using real native quantities and all-user shares. Comparison with motorized or other routes requires equivalent function/boundaries and explicit sensitivity to the human boundary. If an extended boundary includes incremental work nutrition or attributable metabolic releases, require independent actual physiology/intake/exertion/counterfactual and C/N/water/body-retention/compound/carbon-origin/receiving-medium evidence, with exact upstream food/provider coverage and no second food burden. Never convert wages/hours/calories/wind/humanwork into fictitious purchased fuel or a universal labour-food factor."
      unit: "kg;kWh;m3;Item(s);hour"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "actual uncovered port/shore/organization responsibilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_vessel_life
      process_id: "vessel_lifecycle"
      flow_role: "water_taxi_launch_manufacture;cargo_passenger_ship_manufacture"
      record_type: "actual_record"
      raw_fields: "vessel_cohort;architecture;delivery_gate;native_quantity;materials;original_parts;battery;foil_fan_skirt;covered_stages;upgrades;replacements;drydock;useful_life;all_user_lifetime_duty;attributable_compatible_duty;retirement;recycling;uncertainty;actual_water_taxi_launch;cargo_passenger_configuration;shared_hull_dedicated_gear;commercial_private_life"
      collection_method: "Read actual whole-craft manufacture provider boundary and native unit. Reconcile hull/engine/motor/original battery/foil/control/fan/skirt inclusion with each actual replacement or repair. Collect missing upstream manufacture,delivery,maintenance,drydock and retirement/recycling via individually defined physical inputs or compatible completed provider results. Support actual useful-life/all-function duty histories and projections; a supplier manufacture result is not full-life service. Verify actual water-taxi launch and cargo-passenger complete-ship native identities rather than reusing a ferry UUID by name. Include all actual commercial/private/other useful duties and dedicated/shared cargo/passenger equipment. No known new craft type may disappear into a generic asset expansion label. Aggregation algorithm: For each supply unit j, q_j=Qnative_j*(Dcohort_j/Dtotal_allusers_j)/N with supported positive compatible Dtotal; separate each missing stage/part and any provider-included use-phase replacement. No repeated lifetime division of period operational quantities."
      unit: "Item(s);kg;hour;voyage"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "same actual craft/part/cohort all-user life and uncovered stages"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
    - protocol_id: cp_provider
      process_id: "other_inland_delivery"
      flow_role: "purchased_other_inland_leg"
      record_type: "provider_native_coverage_record"
      raw_fields: "provider_ID;actual_64129_function_inlandwaterbody_OD_extent_quality_time_roles;native_unit_u;q_per_u;actual_compatible_A_u;actualconversion;exact_shipshore_stage_period_cells;uncovered_owner;all_user_share;already_normalized;uncertainty"
      collection_method: "Read actual supplier function/nativeunit, inland geography/OD/extent/quality/time and exact shipshore/stage/period coverage. Only a matching completed64129personleg uses this Countcard; other perkm/hour/pkm/voyage/boatavailability/freight functions have independent identities and real compatible demand/conversion. q_u*A_u*supportedshare/N once; replace exactcoveredforegroundcells, add onlyuncapturedowners. Ownlegs/internalenergy notanotherpurchase, alreadyreferenceequivalentnotdividedagain."
      unit: "Item(s);actual independently verified provider-native units"
      frequency: "actual event and period closure"
      temporal_coverage: "same service period and evidenced life interfaces"
      site_scope: "declared vessel-leg cohort and associated actual service pool"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,native identity,coverage and all-user closure,uncertainty"
  calculation_rules:
    - id: completed_count
      applies_to: "completed_other_inland_leg"
      rule: "N=sum actual completed persons for declared boarding-to-alighting leg cohort. Intermediate calls without disembarking do not increment the same person leg; tickets,voyages,vehicles,crew/capacity are not N. N>0 required. Physical passenger distance=sum actual onboard person-segment distance is secondary disclosure,not a relabelled Count or fixed pkm factor."
      inputs:
        - "actual person-leg completion ledger"
      output: "N Item(s);separate person-distance"
      source_ids: []
    - id: native_flow_normalization
      applies_to: "all_processes"
      rule: "q_r=sum actual compatible native Q_r*a_r /N once,where a is justified same-scope all-user attribution. Q already expressed per completed person is scaled only to actual demanded person count,not divided by occupancy again. Keep own stage/provider cells exclusive. Missing a,Q or identity is incomplete,not zero."
      inputs:
        - "native Q"
        - "actual allocation a"
        - N
      output: "q_r per declared reference flow"
      source_ids: []
    - id: fuel_blend_ownership
      applies_to: "marine_distillate"
      rule: "Per actual fuel: opening_stock+receipts+transfers_in=closing_stock+burned+noncombustion_use+leakage+recoverable_outflow+transfers_out,with measured compatible states. Count internal transfers once. Supply quantity follows the defined upstream demand/stock boundary,not automatic purchased=burned. Represent one whole blend plus component/carbon ledger OR actual component supplies replacing corresponding whole-blend mass and upstream cells with native/provider closure; never duplicate contained biofuel. Reconcile fossil/biogenic carbon in supply,combustion,stocks and fates with actual composition; energy conversion uses actual supported density/heating basis."
      inputs:
        - "bunker receipts"
        - stocks
        - composition
        - burned
        - fates
        - "provider cells"
      output: "separate actual supply,burned,fates and carbon"
      source_ids: []
    - id: external_energy_gate
      applies_to: "vessel_shore_ac;vessel_shore_dc;port_ac"
      rule: "Choose actual external AC or DC supply gate per chain and reconcile gross imports,conversion/storage/cable losses,stored energy changes,owned loads and genuine external exports. Upstream AC+owned charger makes downstream DC an internal transfer; completed external DC supply replaces matching upstream AC coverage. Do not duplicate imports,net incompatible export,add motor output/battery discharge/regen as purchased supply,or infer external DC from an internal DC bus."
      inputs:
        - "external meter"
        - "AC_DC gates"
        - losses
        - storage
        - export
        - coverage
      output: "exclusive native energy demand and uncovered losses"
      source_ids: []
    - id: asset_share
      applies_to: "port_support;water_taxi_launch_manufacture;cargo_passenger_ship_manufacture"
      rule: "q_j=Qnative_j*(Dcohort_j/Dtotal_allusers_j)/N,matching actual delivered asset/cohort and compatible positive supported lifetime duty. Include other users/functions and all attributable empty/support duties. Complete maintenance,foil/control/fan/skirt/battery replacement,drydock,delivery and retirement missing from manufacture separately once; whole-craft original components are not purchased again. Provider included operating cells replace corresponding foreground cells."
      inputs:
        - Qnative_j
        - Dcohort_j
        - Dtotal_allusers_j
        - N
        - "covered stages"
      output: "native manufacture share plus separate missing stages"
      source_ids: []
    - id: species_and_fate_closure
      applies_to: "vessel_operation;onboard_residues"
      rule: "Keep each actual substance,mixture,state,carbon/nitrogen basis,medium and known subcompartment. Reconcile material/water generation and stocks with use,onboard treatment,recovery,waste handover and environmental release. kg N-N2O differs from kg N2O; kg C differs from CO2/CH4. Apply only evidenced molecule/element conversions. Fuel/sanitary water purchases are not emissions; no raw waste-mixture mass as a pure elementary species. Recovery and treatment outputs include their actual new identities and provider boundaries."
      inputs:
        - "actual species"
        - "chemical basis"
        - "water/material stocks"
        - recovery
        - receiver
        - provider
      output: "separate actual substance/stream/fate quantities"
      source_ids: []
    - id: actual_provider_native_contribution
      applies_to: "purchased_other_inland_leg"
      rule: "Actual providerq_u perverifiednativeu times realcompatible attributedA_u and supportedcohort/allusershare /N once, exactcoveredshipshorecells replace sameforegroundcells. Countpersonleg versusactualhour/pkm/voyage/freight functions need actualdimensional demand. Already equivalentperdeclaredpersonleg no secondN; owninternallegs notpurchasedagain."
      inputs:
        - cp_provider
        - cp_delivery
        - "exact actual provider stage ledger"
      output: "exclusive native provider contribution per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_fulfilment
      applies_to: "completed_other_inland_leg"
      requirement: "Require actual complete person-leg count,vehicle occupants,crew roles,OD/calls,distance,quality,period and included/separate bundle; no inferred actual occupancy from capacity or ticket sales. Retain class and load evidence. Each actual separately sold cargo,vehicle-deck or other output needs its own atomic product-output row,native quantity and all dq_expand_operation fields under cp_delivery or another valid same-parent protocol; reference person Count is not its unit. CPC application depends on actual inland or coastal/ocean waterbody,not arbitrary distance or tariff."
      evidence: "person/voyage/port fulfilment and actual-waterbody ledger"
    - id: dq_provider
      applies_to: "all_processes"
      requirement: "Every actual required stage must have one owner and covered/uncovered status with evidence. A completed supplier result needs its exact product/native quantity,boundary,quality,allocation and upstream/direct/capital/waste coverage; enter one specific service row only after identification. Otherwise mandatory physical expansion remains. Neither a generic all-legs/all-port-services card nor absent external supplier data closes the boundary."
      evidence: "row-linked provider x actual vessel/voyage/port/stage/period matrix"
    - id: dq_expand_operation
      applies_to: "vessel_operation"
      requirement: "MANDATORY for every actual unrepresented fuel/grade/blend component replacing whole blend,heat,cooling,lubricant,refrigerant make-up,water source,food/catering/crew operational provision,chemical/material and direct substance release: add one actual atomic row per identity/state/gate. Include actual NO/NO2,SO2,CO,NMVOC components,particle sizes,biogenic CH4 and other relevant species; no default factor or zero for an absent card. Each added row must carry unique row_id,existing process_id,direction,flow_type,specific physical/substance identity,verified UUID or honest unresolved status,native property/unit,actual quantity/basis,valid same-parent CP,source/provider scope,actual receiver/medium/known subcompartment and uncertainty. Unknown occurrence requires investigation; absence requires evidence."
      evidence: "cp_operation;cp_air;actual meter,chemical and duty records"
    - id: dq_expand_fates
      applies_to: "onboard_residues"
      requirement: "MANDATORY actual row-addressable expansion using all fields of dq_expand_operation for bilge/black/gray/combined sewage,scrubber washwater/sludge,ballast intake/discharge/sediment,food/other garbage,cleaning/coating/antifoulant substances and leaching,skirt/foil wear/cleaning residues and every other occurring stream. Actual salt/freshwater/soil/air and subcompartment cannot be selected from convenience UUID. Treatment/transport,inputs,sludges and direct species releases remain separate with one coverage owner; no assumption every vessel has ballast/scrubber or that no listed handover means no discharge. Legal discharge limits are not concentrations or permission inferred for this inventory."
      evidence: "cp_residues;reception,tank,treatment and release records"
    - id: dq_architecture
      applies_to: "vessel_operation;vessel_lifecycle;port_support"
      requirement: "MANDATORY for each actual architecture: displacement hull/drive; hydrofoil transition/foilborne energy,foil controls/actuators/materials/repairs; hovercraft lift-fan/thrust,skirt inflation/idle,shore/beach phases and actual fan/skirt replacements/wear fates. Add each actual missing input/part/release with dq_expand_operation fields and corresponding same-parent CP; no conventional-vessel factor copied to a different architecture. Actual towed/cable service must add each towing provider or owned physical duty,rope/cable/guide and wear/replacement,shore mechanism/native external energy and covered/uncovered owner using the same atomic fields; no assumed onboard propulsion or simultaneous completed-tow/owned-physical double count. Other chemical fuel or geometry requires actual completed route evidence and review before use; lack of such data blocks that application rather than excluding the actual qualifying64129product or redefining the reference."
      evidence: "configuration,energy mode and component maintenance records"
    - id: dq_expand_capital_port
      applies_to: "vessel_lifecycle;port_support"
      requirement: "MANDATORY actual expansion with dq_expand_operation fields for each missing ship/shore asset,part manufacture,battery,foil/control,fan/skirt,charger/buffer,quay/terminal/ramp,delivery,maintenance,drydock and end-of-life. One actual gate/native quantity per row,not a collection of asset services. Support same-asset all-user duty,original versus replacement coverage and projections; missing useful life or provider stage blocks completion,not omission. Actual port/organization input/waste/release expansion is equally mandatory."
      evidence: "cp_vessel_life;cp_port;delivery,life,maintenance,retirement evidence"
    - id: dq_allocation
      applies_to: "all_processes"
      requirement: "Reconcile actual passengers,accompanying bundle,separately sold vehicles/cargo,other ship/port users and service supports. Use measured subdivision first; justify any compatible physical or alternative relationship and all-user closure. Never sum Count and tonne-km or prescribe car/person equivalence; fare and capacity are not observed resource consumption. Carry uncertainty and boundary comparability,including ordinary off-duty crew subsistence exclusion."
      evidence: "physical resource/engineering/area-time/duty evidence and sensitivity"
    - id: dq_native_source
      applies_to: "all_processes"
      requirement: "Confirm each bound identity native state/gate/type/property/unit/official name and actual applicability. Generic air-unspecified bindings require a documented unspecified-air scope; known subcompartment requires verified replacement. Mass/volume conversion requires actual compatible density or attached native relation. ISO public abstract supplies no grade values; IMO fuel GHG-only method supplies no full vessel/capital/refrigerant/other-emission completeness. Actual operator cases supply no universal efficiency,capacity or life; coastal Relais product distinctions are not evidence of64129inland geography and Fastrac branding alone does not prove the actual offered function. Missing UUID or generic range is disclosed,not fabricated; actual required quantity remains mandatory."
      evidence: "direct flow/property/unitgroup proof and actual source applicability"
    - id: dq_other_water_routes
      applies_to: "other_inland_delivery;vessel_operation;port_support;vessel_lifecycle"
      requirement: "MANDATORY actual route completion for water-taxi launches and cargo-passenger ships: use the two specific native manufacture cards only when exact actual configurations/gates fit; any different actual craft/part requires its own atomic row with all dq_expand_operation fields. Do not reuse ferry/ship-mass/availability identities for the new whole-craft Count. Collect actual dispatch/pickup/cancel/return and all-function commercial/private/provider logs. Actual optional or included cabin/berth,food/meal,laundry/linen,cleaning,sanitary,cargo handling and reefer functions require specific completed provider-result identities/native quantities with exact coverage OR individually identified physical inputs/assets/wastes/releases,not both. Every independently sold service/cargo output has its own actual native quantity and same-parent protocol; no fixed generic meal/menu,room-night occupancy,fare ratio or passenger-tonne equivalence is supplied. An unknown native gate,occurrence,quantity or shared-duty driver blocks completed use,not a zero or product-set exclusion."
      evidence: "cp_delivery;cp_operation;cp_port;cp_vessel_life;actual contract,dispatch,passenger/cargo and native manufacture evidence"
    - id: dq_other_inland_scope_completion
      applies_to: "other_inland_delivery"
      requirement: "Mandatory fullactual64129inlandresidualcarriage anyschedule includingactualwatertaxi, actual original/acceptedOD/quality/time/dispatch/personcrewrole and chronologicalamendments/completion. Ferry/cruise/sightseeing/excursion actuallydistinct; optionalcabin/meal/cargocommon notautomaticcruise. Failed/partial/rescue/temporaryreboarding notposthocendpoint success or repeatedperson;tickets/parties/capacity/voyages/freight notN. Retain real no-show/cancel/emptyreturn/pickupwait/platform/provider duties then positiveactualN,N0nofiniteintensity."
      evidence: "cp_delivery;cp_operation;cp_port;cp_provider"
    - id: dq_all_actual_inland_configuration
      applies_to: "all_processes"
      requirement: "Every actual qualifying hull/drive/sail/operator/auxiliary/shore/storage/control/material/asset/provider/food/cabin/cargo/waste/species/medium/retirement not already represented must independently expand unique rowID,oneexistingparent,direction/type,singleactualidentity/formulation/state,UUIDorregisteredunresolved,nativeproperty/unit/amount/rawsource,sameparentCP,physicalcalculation/exactcoveredcells/gate/receiver/knownsubcompartment/uncertainty. Preserve complete causal/alluser/native manufacture-use-maintenance-replacement-EoL closure; actual bilgeblackgray/ballast/scrubber/antifoulant/directfreshwater chemicalfates separate. Not limitedto twoassetexamples or one propulsion. Missing isincomplete,notzero/exclusion; no labourcalorie/operatordiet,roommealrecipe,genericfactor/life or passengerfreeride default. For actual sail/operator-propelled carriage record real operator/assistant/passenger roles, tasks, exertion, work/rest, rig/control/assistance and dedicated service support. Ordinary human subsistence, personal diet/housing/reproduction and ordinary metabolic releases are excluded as an explicitly disclosed service-boundary convention, not measured physical zero. Include causally attributable service-specific food/drink, safety/PPE/facilities and business support using real native quantities and all-user shares. Comparison with motorized or other routes requires equivalent function/boundaries and explicit sensitivity to the human boundary. If an extended boundary includes incremental work nutrition or attributable metabolic releases, require independent actual physiology/intake/exertion/counterfactual and C/N/water/body-retention/compound/carbon-origin/receiving-medium evidence, with exact upstream food/provider coverage and no second food burden. Never convert wages/hours/calories/wind/humanwork into fictitious purchased fuel or a universal labour-food factor."
      evidence: "cp_operation;cp_air;cp_residues;cp_port;cp_vessel_life;cp_provider;cp_delivery"
validation_rules:
  - rule_id: validate_reference
    applies_to: "completed_other_inland_leg"
    rule: "Require exact actual delivered person-leg object,reference amount1 Item(s),all required qualifiers and positive N. Reject ticket,voyage,vehicle,crew/capacity counts or pkm relabelling. Preserve attributable failed/empty pools."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "all_processes"
    rule: "Require one stage owner and full provider/foreground coverage,including actual port,hotel,architecture,ship/shore lifecycle and treatment. Included supplier cells replace exact owned cells; missing actual supply,fate,life or identity blocks completed downstream use."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "all_processes"
    rule: "Reject duplicate whole-blend/component supply,AC/DC/internal-energy double counts,unreconciled stock/burned mass,kgN/kgC relabelling,mixed wastewater identities or waste-mixture mass as elementary emission. Require actual receiving medium/subcompartment and material/water/fate closure."
