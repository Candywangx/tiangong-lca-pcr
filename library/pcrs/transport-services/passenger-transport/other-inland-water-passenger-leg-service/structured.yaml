    applies_to: "all_processes"
    rule: "Reject allboat/watertaxionly scope,actualferry/cruise/sightseeing/excursion/coastal/availability substituted, optionalmeal/cabin/cargo automaticexclusion, personreferenceasfreightjourney or Count+tonneaddition/freepassengerburden. Require originalpromised/acceptedendpoint chronology and true personcompletion/roles, allactualnativeconfiguration/provider/life/shipshore/fates, oneparentCP and every authoredrule projected."
    source_ids:
      - un-cpc3-2025
