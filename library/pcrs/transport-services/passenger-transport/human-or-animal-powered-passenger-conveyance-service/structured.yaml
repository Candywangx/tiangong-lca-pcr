system_boundary:
  rules:
    - rule_id: delivered_scope
      applies_to: "completed_conveyance"
      rule: "Include the actual operator-provided human/animal passenger conveyance, attributable positioning, waiting, interrupted or failed service, support and allocated vehicle/animal lifecycle. Record real passenger number, OD, stops, mode, period and completion; sold tickets alone prove no delivery."
      source_ids:
        - un-cpc3-2025
    - rule_id: provider_coverage
      applies_to: "all_processes"
      rule: "Assign every provider/activity/burden/period cell to one compatible complete result or explicit physical expansion. A provider replaces its exact included inputs, releases, animal care or assets; missing stages are mandatory additions, never duplicate supplier burdens. A native provider intensity q_u is first multiplied by actual compatible service demand A_u and the evidenced cohort/all-user share, then divided by positive N once. Retain the provider's actual native hour, animal-day, distance or passenger-distance basis and coverage; these are not interchangeable with completed person-services. Only a provider result already exactly equivalent to one whole declared reference service requires no further normalization. Its exact covered activity/stage cells replace the matching foreground cells only."
      source_ids: []
    - rule_id: human_boundary
      applies_to: "conveyance_delivery;service_support"
      rule: "Ordinary human subsistence, personal diet, housing, reproduction and ordinary metabolic releases are excluded as an explicitly disclosed service-boundary convention, not measured zero metabolism. Record actual operator/assistant/passenger roles, tasks, exertion, assistance, work/rest and dedicated support. Include actual causal service-specific food/drink, facilities, PPE/safety and business travel with justified attribution. Incremental work nutrition or attributable metabolic releases, if included under an extended boundary, require independent physiology/intake/exertion/counterfactual evidence, native C/N/water/substance bases and receiving media, consistent upstream food coverage and sensitivity. Never invent an employee labour-fuel exchange or convert wages/hours/calories into a fossil-energy or universal food factor."
      source_ids: []
    - rule_id: animal_support
      applies_to: "animal_husbandry;animal_lifecycle"
      rule: "Every actual working-animal species is maintained to supply the studied service. Include attributable breeding/rearing/training before entry, daily maintenance feed/water, rest and nonworking periods, shelter, health, species-appropriate hoof/skin/equipment care, retirement and mortality fates. Actual body/age/state/cohort, work/task/environment and all supported functions determine evidence needs; a pack animal has actual carrying and saddle/load interfaces, not assumed cart traction. Pre-entry provider coverage and post-entry care are distinct; only extra pulling feed or treating existing/leased animals as free is invalid. WOAH supplies context only for its actual working-equid scope, not other-species numerical/welfare certification."
      source_ids:
        - woah-working-equids
    - rule_id: manufacture_gate
      applies_to: "vehicle_lifecycle;animal_lifecycle"
      rule: "Delivered vehicle manufacture and live-animal first-entry products cover their verified supply gates only. Lifetime duty allocates their actual native quantity and does not create a fictitious full-life service identity. Complete uncovered replacements, veterinary/farriery tasks, maintenance, facilities and retirement separately; never count original components twice."
      source_ids: []
    - rule_id: feed_state
      applies_to: "grass_hay;animal_tap_water"
      rule: "Track actual supplied, grazed, consumed, lost and stored feed/water separately by species and body cohort. Preserve feed ingredients/formulation/moisture, as-fed/dry matter, C/N, actual body retention/growth/lactation or other transfers, water intake/stores/urine/faecal moisture/respiratory-evaporative release and actual independent fates. Stocks and retention are not consumption or emissions. No unexplained wet/dry, carbon, nitrogen or water deficit may be fabricated as residual gas, wastewater or manure."
      source_ids: []
    - rule_id: biogenic_carbon
      applies_to: "enteric_ch4;respired_biogenic_co2;manure_ch4"
      rule: "Keep actual enteric, respiratory, manure and upstream feed-carbon accounts consistent. The IPCC national-inventory net-CO2 convention is not a general lifecycle zero-impact rule. Declare the lifecycle biogenic-carbon convention, actual physical releases and upstream uptake/retention coverage, with no invented sequestration or duplicated feed carbon."
      source_ids:
        - ipcc-livestock-2019
    - rule_id: manure_fate
      applies_to: "manure_handling"
      rule: "Keep excretion, collection, storage, treatment, product/waste transfer and actual deposition/application gates explicit. Separate retained manure, wastewater and atmospheric species. Document downstream responsibility and the product/waste allocation convention: required waste treatment is completed, while a genuine useful product needs its own output identity and supported allocation. Do not silently drop land-deposition or indirect nitrogen pathways, count the same emission twice, or give automatic fertilizer/biogas credits."
      source_ids:
        - ipcc-livestock-2019
    - rule_id: actual_expansion
      applies_to: "all_processes"
      rule: "Every actual unrepresented material, native conveyance/pack equipment/animal species and entry gate, feed/grazing/soil uptake, energy/fuel, provider result, waste/stream, emitted compound/particle or receiving fate requires a unique atomic row. One existing process, direction/type, single actual identity/state, UUID or explicit unresolved status, native property/unit/quantity/raw source, same-parent CP, evidenced calculation/provider gate/receiver/uncertainty and triggering DQ id are mandatory. Known subcompartments must be retained. Missing occurrence, identity, quantity or fate blocks completed data, not product scope and not zero."
      source_ids: []
    - rule_id: actual_mechanism
      applies_to: "all_processes"
      rule: "Record actual human tasks, animal carrying/drawing and all supplementary assistance as a coherent transport system. Identify harness/saddle/body contact, load/distance/terrain, coupled teams and recovery/waiting support. Assistance energy, drive, charging/refuelling, maintenance, wear, incident/rescue and life burdens are actual atomic exchanges. If an actual motor/cell/blend exists, whole formulated input with origin ledger OR physical constituent inputs replacing the same coverage is exclusive; net supply/withdrawal, stock, burned, vented, spilt and recovered quantities are distinct, and supply is not automatically combustion activity. Purely motorized or primary adventure function requires its own product decision."
      source_ids: []
