allocation_rules:
  - rule_id: subdivide
    applies_to: "all_processes"
    rule: "Subdivide dedicated journey, animal, vehicle, stable and support records before allocation. Where shared, justify an actual causal driver for that burden and all served users/functions; there is no universal passenger/freight/agricultural-duty share."
    source_ids:
      - ghg-product-standard
  - rule_id: actual_occupancy
    applies_to: "conveyance_delivery"
    rule: "Assign loaded-segment burdens using actual persons, distance and resource use with class/configuration where relevant; distinguish accompanying luggage from separately supplied freight. Normalize the attributed cohort numerator by actual completed N once. Do not divide an already per-person provider result again by occupancy."
    source_ids: []
  - rule_id: rest_and_failure
    applies_to: "all_processes"
    rule: "Keep attributable empty, waiting, failed and nonworking support burdens inside the appropriate service pool. Animal rest/maintenance is not absent because passenger delivery is zero that day. N=0 has no finite per-reference intensity; preserve the pool and resolve period/boundary with evidence."
    source_ids: []
  - rule_id: animal_maintenance_share
    applies_to: "animal_husbandry;manure_handling"
    rule: "Allocate actual whole animal-day care and emissions across all supported functions using justified availability/time/resource evidence, including rest support; do not assign only incremental feed. Reconcile any breeding, milk, meat, manure or agricultural/freight outputs. Animal mass, passenger-distance, tonne-distance and food output cannot be added as one denominator."
    source_ids: []
  - rule_id: supply_lifetime_share
    applies_to: "vehicle_lifecycle;animal_lifecycle"
    rule: "For each delivered supply unit/cohort, multiply actual native quantity by attributable compatible duty divided by supported total all-user lifetime duty, then normalize by N. Match quantity, numerator and denominator to the same supply unit/cohort; current daily care uses its period share and is not again divided by lifetime duty."
    source_ids: []
  - rule_id: useful_products
    applies_to: "manure_handling;animal_lifecycle"
    rule: "Use actual product/waste status, handover and function to select and disclose allocation. Subdivide first; if physical relationships cannot be established, justify another relationship with sensitivity. No assumed value share or avoided fertilizer/feed/vehicle credit. Retired animal products and recovered materials cannot repeat the original live-animal output or its full burden."
    source_ids:
      - ghg-product-standard
  - rule_id: species_teams_other_functions
    applies_to: "animal_husbandry;animal_lifecycle;conveyance_delivery"
    rule: "Use actual animal identities and complete supported functions, including work, rest and care. A team is not a default multiple of one animal and passenger count is not animal-head count. Subdivide dedicated duties/inputs first, then use an evidenced compatible physical relationship with sensitivity where necessary. Passenger transport, freight and genuine independent animal products share common resources once; no fixed bodyweight, head, fare or equal-share rule is prescribed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_journeys
      process_id: "conveyance_delivery"
      flow_role: "completed passenger conveyance"
      record_type: "actual_record"
      raw_fields: "journey_id;actual_persons;operator;OD;mode;species;conveyance;actual_segment_km;loaded_empty_waiting_failed_duty;completion;period;all_users;actual_passenger_transport_function;urban_suburban_extent;operator_assistant_passenger_roles;service_quality;actual_duration_window;drawn_pedalled_pack_configuration;team_animals;assistance_mechanism;shared_freight_other_outputs"
      collection_method: "Reconcile actual dispatch, passenger/OD and completion evidence, linked stops and sampling errors. Define one-way/multi-stop/return scope before aggregation; no ticket-count substitution. Aggregation algorithm: N=sum actual eligible persons completing the declared conveyance; actual duty assigned to the same cohort; divide attributed totals once by N."
      unit: "Item(s);km;h"
      frequency: "actual event and period closure"
      temporal_coverage: "same declared service period and explicit lifecycle interfaces"
      site_scope: "actual conveyance services and all users in the declared period"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,provider coverage,all-user closure,source applicability and uncertainty"
    - protocol_id: cp_husbandry
      process_id: "animal_husbandry"
      flow_role: "post-entry animal feed water and stable support"
      record_type: "actual_record"
      raw_fields: "animal_id;species;age;body_state;entry_date;animal_days;all_functions;maintenance_rest_work;feed_SKU;moisture;as_fed_DM;stock;given_consumed_lost;water_source;meters;provider_scope;health_tasks;body_cohort_start_end;growth_lactation_retention;feed_C_N_moisture;grazing_native_intake;water_body_stores;work_rest_retirement_support;species_digestive_system;team_and_all_function_share"
      collection_method: "Read actual ration/stock/meter/health and duty logs; separate each feed, grazing, water, bedding and energy identity. Retain animal-day maintenance/rest and actual veterinarian/farrier/housing records; no default ration or service load. Aggregation algorithm: Assign each actual native period supply/consumption quantity using supported all-function care share, including rest; divide the cohort numerator by N once. Keep native moisture/unit conversion evidenced. For every actual species independently close opening stocks + purchases + actual grazing against consumption, closing stocks and evidenced losses; retain actual body/cohort changes, C/N/wetdry and water stores/fates. Actual team, rest and nontransport output shares require evidence, not a borrowed equid/cattle ratio."
      unit: "kg;kWh;m3;animal-day"
      frequency: "actual event and period closure"
      temporal_coverage: "same declared service period and explicit lifecycle interfaces"
      site_scope: "actual post-entry species-specific working-animal care in this process, all supported functions"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,provider coverage,all-user closure,source applicability and uncertainty"
    - protocol_id: cp_animal_emissions
      process_id: "animal_husbandry"
      flow_role: "actual enteric and respiratory release"
      record_type: "actual_record"
      raw_fields: "animal_id;species;subgroup;animal_days;diet;feed_intake_basis;method;source_version;factor_basis;actual_species_mass;carbon_origin;air_subcompartment;upstream_carbon;retention;attribution;actual_body_feed_C_N_water_balance;respiration_water;actual_compound_mass;method_validity_species_state;no_residual_emission"
      collection_method: "Use actual monitoring or an independently supported species/diet/subgroup-compatible model, with input basis and uncertainty. Record actual respiration and chosen lifecycle carbon convention separately from any characterization effect. Aggregation algorithm: Attribute actual post-entry species masses across supported animal functions with the same care/duty scope; divide by N once. Do not combine enteric and manure events or treat national net-CO2 omission as physical zero. Reconcile feed intake and body/growth/product/other carbon-nitrogen-water retention with independently evidenced actual respiratory/enteric releases, excreta and other fates. National netCO2 omission or missing species model never proves zero physical emissions; approximate unusual-species significance factors are not production factors."
      unit: "kg species;animal-day"
      frequency: "actual event and period closure"
      temporal_coverage: "same declared service period and explicit lifecycle interfaces"
      site_scope: "actual owned animal biological release gates and documented receiving subcompartments"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,provider coverage,all-user closure,source applicability and uncertainty"
    - protocol_id: cp_manure
      process_id: "manure_handling"
      flow_role: "actual manure streams and releases"
      record_type: "actual_record"
      raw_fields: "animal_id;species;excretion;dung_urine;water;wet_mass;DM;VS;carbon;nitrogen;stock;collection;deposition;storage_system;climate;duration;treatment;recipient;product_waste_status;air_water_soil_subcompartment;factor_basis;source;provider_scope"
      collection_method: "Use independently measured stream/stock/receiver records and supported actual species/system emission methods. Track contents through collection, storage and terminal responsibility; separately identify every actual product, waste, wastewater and elementary release. Aggregation algorithm: Close actual wet/dry,carbon and nitrogen quantities across fates, preserving documented losses and uncertainties. Allocate owned events with same-animal care share and divide by N once; linked downstream results replace included events. Treat actual faeces, urine and mixtures at their real gates: separately collected streams versus a genuine mixed manure stream replace matching contents once. Actual bedding/soil-deposited/washed/stored streams retain individual identity and boundary; do not force all species into the donkey example."
      unit: "kg wet stream;kg species;kg N;kg C"
      frequency: "actual event and period closure"
      temporal_coverage: "same declared service period and explicit lifecycle interfaces"
      site_scope: "owned manure generation,storage,treatment and evidenced transfer/deposition gates"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,provider coverage,all-user closure,source applicability and uncertainty"
    - protocol_id: cp_vehicle_life
      process_id: "vehicle_lifecycle"
      flow_role: "actual conveyance manufacture and lifecycle"
      record_type: "actual_record"
      raw_fields: "asset_id;configuration;manufacture_native_quantity;included_original_parts;entry;replacement;maintenance;retirement;total_compatible_lifetime_duty;period_cohort_duty;all_users;provider_coverage;forecast_source"
      collection_method: "Read actual bills of quantities and configuration-specific supply datasets, lifetime duty/engineering evidence and fate records. A rental fee/depreciation is not physical count; identify missing phases individually. Aggregation algorithm: Actual delivered quantity times same-asset cohort duty/positive total all-user lifetime duty, then /N; separate original and replacement components and uncovered maintenance/retirement."
      unit: "Item(s);native component units;km;h"
      frequency: "actual event and period closure"
      temporal_coverage: "same declared service period and explicit lifecycle interfaces"
      site_scope: "actual human/animal conveyances and harness/road/support assets assigned to this lifecycle process"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,provider coverage,all-user closure,source applicability and uncertainty"
    - protocol_id: cp_animal_life
      process_id: "animal_lifecycle"
      flow_role: "actual service-entry animal and life allocation"
      record_type: "actual_record"
      raw_fields: "animal_id;species;training_state;first_service_gate;native_entry_count;breeding_rearing_training_coverage;pre_entry_feed;service_dates;retirement;death;all_functions;total_lifetime_duty;cohort_duty;care_provider_scope;uncertainty;pack_drawn_role;animal_id_cohort;body_state;all_functions_work_rest_retirement;included_provider_stage_cells"
      collection_method: "Read animal-specific acquisition/rearing/training and lifetime duty records; distinguish observed life and justified forecast. Verify first-entry supply coverage and complete missing upstream phases, retirement care and actual terminal fates separately. Aggregation algorithm: Actual delivered live-animal entry quantity times same-animal attributable lifetime service share, then /N. Daily post-entry feed/emissions remain in their actual periods, not a second lifetime amortization. A live animal is a biological delivered/rearing product, not a manufactured machine or a lifecycle transport result. Match same animal/cohort body/training/entry state, compatible whole-life all-user duty and native supply unit; missing pre-entry rearing/training and later care/retirement completed independently."
      unit: "Item(s);animal-day;h"
      frequency: "actual event and period closure"
      temporal_coverage: "same declared service period and explicit lifecycle interfaces"
      site_scope: "actual service-entry animal and uncovered pre-entry/retirement lifecycle gates"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,provider coverage,all-user closure,source applicability and uncertainty"
    - protocol_id: cp_support
      process_id: "service_support"
      flow_role: "actual cleaning maintenance and operator support"
      record_type: "actual_record"
      raw_fields: "task_id;actual_material;native_quantity;stock;work_specific_food_water;ordinary_subsistence_exclusion;water_meter;waste_composition;receiver;species_medium;provider_scope;all_users;attribution;human_roles_work_rest_exertion;dedicated_food_PPE_safety;incremental_metabolic_inclusion_boundary;physiology_intake_counterfactual;actual_assistance_carrier;net_withdrawal_burn_spill_recovery"
      collection_method: "Read service-specific procurement/work orders, meter/stock and independent receiver records. Separate each actual consumable, provider and residue. Distinguish ordinary personal diet from evidenced dedicated support; no generic labor-energy conversion. Aggregation algorithm: Assign actual non-overlapping native task/supply/fate quantities using justified all-user drivers and divide by N once; do not infer wastewater from water use or waste oil from virgin oil issues. Record actual human task/rest/role and work-specific food/safety/support. If an extended metabolic boundary is chosen, independently document actual intake, exertion/counterfactual, C/N/water/compound quantities and receiving media with consistent upstream food scope; disclose sensitivity, never assign fictitious labour fuel. Supplementary assistance actual energy/fuel/drive inputs and supplied/stock/burn/spill/recovery quantities remain distinct."
      unit: "native kg;m3;kWh;actual service units"
      frequency: "actual event and period closure"
      temporal_coverage: "same declared service period and explicit lifecycle interfaces"
      site_scope: "only attributable uncaptured service-support tasks and their actual fates"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "raw records,provider coverage,all-user closure,source applicability and uncertainty"
  calculation_rules:
    - id: completed_count
      applies_to: "completed_conveyance"
      rule: "N=sum actual persons completing the same declared operator-conveyance scope; preserve interrupted/no-output duty separately."
      inputs:
        - cp_journeys
      output: "Item(s)"
      source_ids: []
    - id: normalize_once
      applies_to: "all_processes"
      rule: "Assign actual compatible native quantities to the declared passenger cohort and divide by positive N once. Keep period,scope and all-user shares aligned."
      inputs:
        - cp_journeys
        - cp_husbandry
        - cp_animal_emissions
        - cp_manure
        - cp_vehicle_life
        - cp_animal_life
        - cp_support
      output: "native amount per Item(s)"
      source_ids: []
    - id: manufacture_and_entry
      applies_to: "cycle_rickshaw;equid_cart;working_donkey_entry"
      rule: "Allocated supply=sum actual delivered native supply quantity times same-unit cohort duty/total compatible all-user lifetime duty. Divide that numerator by N; other lifecycle phases keep independent native quantities."
      inputs:
        - cp_vehicle_life
        - cp_animal_life
      output: "native supply per Item(s)"
      source_ids: []
    - id: animal_period_share
      applies_to: "grass_hay;animal_tap_water;stable_ac;enteric_ch4;respired_biogenic_co2"
      rule: "Allocated animal-period amount=actual complete period amount times justified all-function support share, retaining maintenance/rest. It is not an assumed marginal work ration and is not divided by lifetime duty again."
      inputs:
        - cp_husbandry
        - cp_animal_emissions
      output: "native amount before /N"
      source_ids: []
    - id: manure_species
      applies_to: "manure_ch4;manure_n2o;manure_nh3;collected_donkey_manure"
      rule: "Use recorded species/system/source equations and native-unit conversions only. Keep generated wet stream,retained solids,carbon/nitrogen transfer and each actual release as distinct quantities; document stoichiometry where N or C is converted to molecule mass."
      inputs:
        - cp_manure
      output: "kg stream or native species"
      source_ids: []
    - id: supplemental_distance
      applies_to: "completed_conveyance"
      rule: "Supplemental passenger-distance=sum actual persons on each segment times actual segment km. This measured disclosure neither changes the Count reference nor fixes distance per journey."
      inputs:
        - cp_journeys
      output: "supplemental passenger-distance"
      source_ids: []
  data_quality_requirements:
    - id: actual_service
      applies_to: "completed_conveyance"
      requirement: "Preserve actual persons, OD, operator, route state, stops, completion, period and occupancy. Missing completion or unknown service mode blocks production; animal/vehicle/ticket counts are not person-service counts."
      evidence: "cp_journeys"
    - id: actual_feed_care
      applies_to: "grass_hay;animal_tap_water;stable_ac"
      requirement: "Expand every actual grazing source, hay specification, grain, compound feed, salt/mineral, bedding, water source, heat/energy carrier, veterinary/farriery supply or provider in its exact native identity/state and amount. The hay card is not a universal ration; animal rest support and husbandry are mandatory."
      evidence: "cp_husbandry"
    - id: actual_animal_sources
      applies_to: "enteric_ch4;respired_biogenic_co2"
      requirement: "Match actual species, digestive system, age/state, diet, animal-days, method and uncertainty. Independently expand each required actual release with substance, carbon origin, receiving medium/subcompartment and native species mass. Preserve known subcompartments and support any unspecified identity; missing releases are not zero."
      evidence: "cp_animal_emissions"
    - id: actual_manure_fates
      applies_to: "collected_donkey_manure;manure_ch4;manure_n2o;manure_nh3"
      requirement: "Expand every actual retained manure composition, bedding mixture, wastewater, useful manure product, direct deposition, collection/storage/treatment/soil pathway and actual species. Record wet/dry,VS,C,N and receiving gates, downstream responsibility and source factor scope. A single manure card or gas set is not exhaustive; unknown collection or fate blocks completion."
      evidence: "cp_manure"
    - id: actual_conveyances
      applies_to: "cycle_rickshaw;equid_cart"
      requirement: "Every actual pulled/pedalled conveyance, seat, harness, shelter, road/stable/workshop asset, replacement part and retirement material needs its own configuration/gate-native supply or fate exchange and supported all-user duty. Do not substitute generic motor vehicle, mass or rental fee for a complete native Count product."
      evidence: "cp_vehicle_life"
    - id: actual_animal_lifecycle
      applies_to: "working_donkey_entry"
      requirement: "Expand every actual species and different body/training/entry state as a concrete native live-animal/rearing identity. Actual pack rides need saddle/load/support but no fictitious cart. Complete documented breeding/rearing/training, all-user life/work/rest support, uncovered retirement care/mortality and genuine products without repeating current feed or supplier coverage; data gaps block completion, not animal scope."
      evidence: "cp_animal_life"
    - id: actual_support
      applies_to: "service_tap_water;maintenance_used_oil"
      requirement: "Expand every actual work-specific consumable, repair, hygiene/digital facility, food/drink supply, business repositioning provider and waste/direct release separately. Preserve explicit human subsistence exclusions with reasons and sensitivity. Each real lubricant/grease/chemical/water/waste needs its own identity/native amount and receiver; unknown is not absence."
      evidence: "cp_support"
    - id: identity_coverage
      applies_to: "completed_conveyance;cycle_rickshaw;equid_cart;working_donkey_entry;grass_hay;animal_tap_water;stable_ac;enteric_ch4;respired_biogenic_co2;manure_ch4;manure_n2o;manure_nh3;collected_donkey_manure;service_tap_water;maintenance_used_oil"
      requirement: "Each actual added exchange carries a unique row_id, one parent process, direction/type, specific identity, UUID or explicit unresolved state, native property/unit, amount, collection protocol, source and recipient/medium/subcompartment. Link its triggering requirement_id and provider cell; missing identity/quantity blocks final completion. No invented factors or universal ranges."
      evidence: "cp_journeys;cp_husbandry;cp_animal_emissions;cp_manure;cp_vehicle_life;cp_animal_life;cp_support"
    - id: species_body_balance
      applies_to: "animal_husbandry;manure_handling;animal_lifecycle"
      requirement: "Require actual each-species/subgroup/body-state/diet/work-rest physiology and independently supported source/method. Reconcile wet/dry C/N and water with actual stock/body/product retention and independently evidenced respiratory/enteric/excreta/soil/air/water fates. No cattle-to-camel/equid-to-other scaling or residual gas/waste closure without validated actual applicability. National net-CO2 convention is not physical-zero proof."
      evidence: "cp_husbandry;cp_animal_emissions;cp_manure;cp_animal_life"
    - id: actual_human_mechanism
      applies_to: "conveyance_delivery;service_support;vehicle_lifecycle"
      requirement: "Preserve human operator/assistant/passenger roles, actual task/work-rest/dedicated support, ordinary subsistence/metabolism boundary and sensitivity. Pack/drawn/hand/pedal and real supplementary assistance require actual native equipment/source/care/wear/fate expansion with correct same-parent CP. Missing example cards never waive real obligations."
      evidence: "cp_journeys;cp_support;cp_vehicle_life"
validation_rules:
  - rule_id: reference
    applies_to: "completed_conveyance"
    rule: "Verify one actual completed-person output,1 Item(s),positive N, operator, actual OD/route/stops and human/animal mode; tickets, passenger bodies, vehicle counts or animal counts cannot substitute."
    source_ids: []
  - rule_id: coverage
    applies_to: "all_processes"
    rule: "Close provider/pre-entry/post-entry/maintenance/retirement coverage once; manufacture or animal entry quantity must not be relabelled as full-life service. Each collection protocol references one existing process and every card uses a protocol from its own process."
    source_ids: []
  - rule_id: human_animal_boundary
    applies_to: "all_processes"
    rule: "Disclose ordinary human subsistence exclusions and animal full-support inclusion explicitly. Do not compare route labels without functional/boundary equivalence and sensitivity, infer zero animal burden, or convert food directly into labour-energy input."
    source_ids: []
  - rule_id: mass_and_state
    applies_to: "animal_husbandry;manure_handling"
    rule: "Reconcile feed moisture/stocks/consumption/loss and animal/manure water/carbon/nitrogen with independent fates; kg NH3,NH3-N,N2O,N2O-N,CO2 and C are different bases. Unknown balances require resolution, never invented residual releases."
    source_ids: []
  - rule_id: manure_emissions
    applies_to: "manure_handling"
    rule: "Keep enteric and manure sources separate; verify system/climate/time/species applicability, air subcompartment, direct/indirect/soil/downstream ownership and no double counted emission-factor scope. Complete actual deposited/uncollected manure pathways too."
    source_ids: []
  - rule_id: lifetime
    applies_to: "vehicle_lifecycle;animal_lifecycle"
    rule: "Require supported positive lifetime duty and all-user closure, actual delivered quantity and separate component/rearing/care/retirement gates. Active-life projections disclose source and uncertainty and update when observed evidence changes."
    source_ids: []
  - rule_id: completion
    applies_to: "all_processes"
    rule: "Every applicable identity and quantity/fate gap is a mandatory production gate. Missing generic ranges alone are not a zero exchange or a demand to invent factors. Bilingual/projected rules and verified native identities must agree."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after all mandatory identity,quantity,coverage and fate requirements are completed and reviewed"
  allowed_use: "Actual operator-provided urban/suburban human/animal conveyance or pack-animal passenger function, species/configuration, OD, distance, time/quality, completion period and full declared lifecycle boundary"
  excluded_use: "Bare no-operator rental, interurban or unrelated functional products, generic pkm/zero-emission/zero-metabolism labels, human food as universal fuel, unverified species factors or incomplete actual care/fates"
  required_metadata: "Actual function/completed N;operator;mode/species/configuration;OD/distance/occupancy;period;animal-days/rest;human exclusions;whole-life/provider matrix;manure fate and air subcompartment;actual allocation"
  required_quality_disclosure: "Identity/quantity gaps;diet or animal-day estimates;feed moisture;species-method applicability;life projections;carbon/nitrogen fates;boundary comparison sensitivity"
  update_trigger: "Changes in service function,species,husbandry,provider coverage,configuration/life,manure management/receiving compartment,human boundary or allocation"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD,CPC Version3.0 Explanatory Notes,30 June2025,actual parent-group6411 p358 and subclass64117 p360. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full operator-provided human/animal road conveyances and pack-animal passenger transport, within urban/suburban parent context; no equid-only scope or numerical service/physiology prescription."
  - id: "woah-working-equids"
    type: "official_guidance"
    reference: "WOAH/OIE,Terrestrial Animal Health Code,Chapter7.12,Welfare of working equids,actual19July2021 edition,Articles7.12.2 and7.12.6–7.12.13. https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/current/en/chapitre_aw_working_equids.pdf"
    used_for: "Qualitative care context for actual covered working horses/donkeys/mules; scope excludes sports/leisure/research/sole meat-biopharmaceutical equids. Not universal animal or tourism welfare certification, other-species physiology, numerical ration/life or LCA allocation rule. Other actual species remain in PCR scope with independent collection/physiology requirements."
  - id: "ipcc-livestock-2019"
    type: "official_guidance"
    reference: "IPCC,2019 Refinement to2006 Guidelines,Volume4,Chapter10,sections10.1–10.5,especially actualpp10.10–10.11,10.33–10.34,10.50 and10.74–10.75. https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf"
    used_for: "Species/feed, separate enteric/manure/C/N pathways and method applicability questions. No default factor/animal mass/ration/moisture adopted; unusual-species rough significance-screening extrapolation not treated as accurate production emission factor. No human metabolic model or physical CO2-zero claim."
  - id: "ghg-product-standard"
    type: "standard"
    reference: "WRI/WBCSD,Product Life Cycle Accounting and Reporting Standard,2011,chapters6,7 and9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Functional/boundary disclosure and subdivision/justified allocation principles. Human subsistence exclusion,working-animal life inclusion and custom formulas are disclosed PCR choices,not prescriptions or numerical factors from this standard."
