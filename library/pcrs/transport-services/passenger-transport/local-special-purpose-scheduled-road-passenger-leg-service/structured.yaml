published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset/background_dataset onlyafteractual full native/identity/quantity/lifecycle evidence"
  allowed_use: "Only actually qualifying64114completed local special-purpose scheduled leg with actual inclusionclause, responsibility/access/calendar/OD/quality/support/mechanism"
  excluded_use: "Generalpublic/taxi/nonscheduledairport/hire/sightseeing/wholeavailability; education/work/flight outputs or universalpkm/zeroelectriclifecycle claim"
  required_metadata: "actual_64114_inclusion_clause; local_specific_user_route_or_scheduled_urban_shuttle_or_pupil_rural_clause; actual_school_enterprise_airport_purpose_and_eligibility; organiser_carrier_subcontractor_responsibility; school_calendar_shift_airport_schedule; actual_stop_OD_and_passenger_distance_distribution; actual_completed_leg_N_and_period; actual_vehicle_tram_trolley_similar_mechanism; actual_quality_handover_accessibility_support; passenger_driver_escort_roles; empty_failed_no_show_waiting_duty; actual_included_transport_items; traction_AC_DC_regeneration_and_losses; sameasset_alluser_life; native_provider_coverage_fates_uncertainty"
  required_quality_disclosure: "All unknown actual identities/quantities/provider/asset/life/energybalance/wearfate/LCIA gaps and comparability limits"
  update_trigger: "Changed inclusionclause/purpose/eligibility/commissionercarrier/calendar/route/OD/quality/support/mechanism/grid/provider/assetlife/fate evidence"
data_sources:
  - id: "unsd-cpc3-64114"
    type: "official_guidance"
    reference: "UNSD CPC3.0 ExplanatoryNotes30June2025,printed359,64114 with adjacent64112/64115/64116/64132; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Actual specified-user local scheduled, urban/suburban scheduledshuttle and pupilhome-school/school-school includingrural clauses/exclusions. No universal exclusiveairportaccess, equipment/escort, numerical inventory or Countmethod supplied; note does not enumerate tram/trolley."
  - id: "ipcc-road-rail-2006"
    type: "official_guidance"
    reference: "IPCC2006Guidelines Vol2Ch3 §3.2pp3.10–3.16 and§3.4pp3.39–3.40; https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Actual fuel/engine/control/urea/carbon-origin and electric upstream questions. National inventory scope/defaultsoldfuel/allcarbon assumptions not adopted as complete lifecycle or actual release factors."
  - id: "skoda-trolleybus-case"
    type: "handbook"
    reference: "Škoda26Tr manufacturer technical case,publicsnapshot2026-10-21; https://www.skodagroup.com/reference/en-pokus-trolejbus-26tr"
    used_for: "Conditional actual DCwire/offwirebattery-or-generator/recovery/HVAC/accessibility interfaces only; no universal voltage/power/capacity/dimensions/life/factors adopted."
  - id: "siemens-regeneration-case"
    type: "handbook"
    reference: "Siemens PortlandTriMet light-rail regenerative storage technical case,publicsnapshot2026-10-21; https://www.mobility.siemens.com/us/en/portfolio/references/portland-trimet-light-rail-case-study.html"
    used_for: "Actual braking-to-substation-storage-to-othervehicles energy question; technical case is not64112classification or generic tram saving/material factor. All numerical predictions/benefit claims excluded."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "GHGProtocol ProductLifeCycleAccountingReportingStandard2011,chapters7–9; https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary/data/subdivision/allocation principles. Full track/wire/wear/site/retirement scope, specific collection/Count-leg and sameasset formulas are explicitly authoredPCR choices requiring actual records, not universal source factors."
  - id: "eu-special-regular-2009"
    type: "official_guidance"
    reference: "Regulation(EC)1073/2009 asadopted21October2009 Articles2/5, officialhistorical reproduction; https://www.legislation.gov.uk/eur/2009/1073/article/2/adopted?view=plain and https://www.legislation.gov.uk/eur/2009/1073/article/5/adopted?view=plain"
    used_for: "Dated jurisdiction-specific regular/special/occasional comparison: organiser/carrier and repetition/contract alone insufficient. No current legal test, licensing obligation or universal exclusive-user airport requirement adopted."
  - id: "epa-school-idle-2026"
    type: "official_guidance"
    reference: "US EPA SchoolBusIdleReduction, actualretainedpage updated28August2026; https://www.epa.gov/dera/school-bus-idle-reduction"
