      applies_to: "local_special_scheduled_road_service"
      rule: "Draw actual gate graph from upstream AC/provider to rectification/contactline/charger/storage/vehicle and external export. Assign losses once. Recovered braking to onboard/network/wayside storage/another vehicle is internal at a whole-network boundary; actual external transfer is separately metered. Braking resistor heat/dissipation or unavailable network acceptance is not automatically exported/avoided electricity. Gross versus net meters and all-user ownership explicit, no net-saving plus duplicate credit."
      source_ids:
        - ghg-product-2011
    - rule_id: capital_provider
      applies_to: "local_special_scheduled_road_service"
      rule: "Complete actual bus/tram/trolley/battery/road/track/wire/substation/charger/depot/stop/terminal manufacture, installation, renewal, use, maintenance and retirement responsibility. Delivered asset flow supports only verified manufacturing gate; useful life is allocation denominator only. Complete assembly versus same included initial components and actual inclusive provider coverage are exclusive."
      source_ids:
        - ghg-product-2011
    - rule_id: commissioned_support
      applies_to: "local_special_scheduled_road_service"
      rule: "Define actual organiser/carrier/subcontractor responsibility matrix and actual transport handover, escort/accessibility/securement/HVAC/heater/terminal/waiting duties. Independently collect each actual supplied service/material/equipment or in-house operating activity, not an automatic headcount/labour flow or all-equipment recipe. Education/employer/flight products are not added solely because beneficiaries attend school, work or fly."
      source_ids:
