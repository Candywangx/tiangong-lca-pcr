product_category_identity:
  canonical_pcr_id: "pcr.motorized-taxi-passenger-leg-service"
  classification_refs: "CPC3.0 64115 Taxi services; dedicated full functional scope, exact"
  covered_products: "Actually eligible motorized taxi passenger transport within/between urban/suburban areas; actual non-scheduled airport shuttle passenger transport with connected reservation responsibility"
  excluded_products: "Scheduled airport shuttle; distinct chauffeured vehicle-hire/availability function; man/animal drawn, water or air taxi; ambulance/medical care; standalone booking-only output; other distinct sightseeing/mixed-mode products"
  representative_product: "One actual person completing one qualified motorized taxi transport leg with declared OD/extent/quality/time"
  production_route: "Actual connected booking/dispatch; pickup, motorized transport and alighting; complete causal empty/wait/failed/support and asset lifecycle coverage"
  market_state: "Actually fulfilled passenger transport, with real motorized vehicle/operator and completion evidence"
functional_unit:
  what: "Completed motorized taxi passenger transport leg"
  how_much: "1 actual completed person transport leg"
  how_well: "Eligible actual service/geography/non-scheduled airport status, OD, distance/time, party/pooling, accessibility/safety and delivered quality declared"
  how_long_or_cycle: "Actual boarding-to-alighting transport interval and complete causally attributed duty/asset lifecycle; actual service period and carry disclosed"
  reference_flow_link: "completed_taxi_leg"
system_boundary:
  rules:
    - rule_id: service_coverage
      applies_to: "taxi_service"
      rule: "Use one declared service cohort and account for preparation, actual loaded and empty running, layover, failed or zero-passenger operated duties and associated support once; unexplained residuals or unknown applicability cannot be excluded as zero."
      source_ids:
        - nyc-tlc-utilization-2025
        - ghg-product-standard
    - rule_id: upstream_and_assets
      applies_to: "taxi_service"
      rule: "Include compatible energy-supply and complete-life vehicle, battery, road and depot/charging infrastructure burdens with actual duty/lifetime allocation. Document provider coverage before adding separate operation, manufacturing, maintenance or treatment so no life stage is counted twice."
      source_ids:
        - eea-electric-vehicles
        - ghg-product-standard
    - rule_id: conditional_technology
      applies_to: "taxi_service"
      rule: "Inventory only actual propulsion and control configurations, but retain compulsory identification/expansion of every other actual energy carrier, hydrogen supply, hybrid subsystem, reagent, refrigerant or material. Grid-electric operation does not prove zero upstream or non-exhaust emissions."
      source_ids:
        - eea-electric-vehicles
        - ipcc-mobile-combustion
    - rule_id: fate_interfaces
      applies_to: "taxi_service"
      rule: "Reconcile distinct collected liquids/solids, recovered products and direct substance/medium emissions; collected wastewater is not an air emission, evaporated water is not a waste-treatment input, and waste delivery is not treatment already performed."
      source_ids:
        - ghg-product-standard
    - rule_id: duty_and_personal_ownership
      applies_to: "taxi_service"
      rule: "Require a complete vehicle-duty ledger distinguishing actual customer segments, dispatch/pickup, empty cruising, waiting, failed hires and actual personal/driver travel. Retain causally attributable service duty even without a passenger. Assign cross-purpose/shared movements once with evidence; a platform fee or driver wage is not a physical burden."
      source_ids:
        - nyc-tlc-utilization-2025
        - ghg-product-standard
    - rule_id: fuel_blend_ownership
      applies_to: "gasoline_supply; diesel_supply"
      rule: "Declare whether actual supplied fuel is represented as one verified compatible whole-blend supply or as physical component supplies. A whole-blend composition/carbon-origin ledger is not an additional component input. Component exchanges replace the matching whole-blend quantity and covered upstream burdens, with mass, native units and provider-scope closure. Never add the full supplied blend plus its contained bio/fossil component supply; neither route may omit an actual constituent or its upstream burden."
      source_ids:
        - ipcc-mobile-combustion
        - ghg-product-standard
    - rule_id: taxi_function_gate
      applies_to: "taxi_service"
      rule: "Verify real motorized taxi service within/between urban/suburban areas or actual non-scheduled airport shuttle; actual connected reservation is included. General destination/distance billing is not absolute. A pickup appointment alone is not a public schedule; actual larger shuttle pooling/vehicle type does not exclude eligible function. Distinct chauffeur availability/whole hire is not forced into completed person-leg output."
      source_ids:
        - cpc3-structure
    - rule_id: native_provider_coverage
      applies_to: "purchased_taxi_leg"
      rule: "Maintain a responsibility ledger indexed by actual vehicle/duty/period/provider/lifecycle-stage cell. Each cell has exactly one owner: owned physical flows OR a compatible provider completed result plus only its uncaptured burdens. For a native provider result q_u per native unit u, use q_u times actual compatible demand A_u times supported cohort/all-user share divided once by N. Actual native unit conversion and provider completeness must be proved; no freight/vehicle/booking result substitution."
      source_ids: []
    - rule_id: asset_supply_native_gate
      applies_to: "all inventory rows"
      rule: "For each complete asset or independently supplied replacement, preserve actual native manufacture quantity and exact initial-components/provider coverage. Allocate that same asset supply by compatible attributed duty over supported positive total all-user useful duty, then /N. Include other taxi/platform/private users in the same denominator, not a finance term. Whole assembly and contained initial components cannot both be supplied; replacement packs/tanks/tyres, maintenance, actual retirement and missing delivery stay separately owned. No manufacturer warranty equals actual useful life."
      source_ids: []
    - rule_id: all_fuel_blends_and_supply_gates
      applies_to: "gasoline_supply;diesel_supply;cng_supply;lpg_supply"
      rule: "For every actual supplied fuel, use one matching full mixture/blend with its composition/carbon-origin ledger OR replacing component supplies with native mass, stock and provider coverage closure. Bi-fuel CNG/petrol or LPG/petrol are two distinct actual fuel supplies, not one blended tank unless actually mixed. Do not omit startup/idle fuel, add contained components twice, treat supply withdrawals as combustion, or treat product CNG/LPG as elementary methane/propane emissions. Complete missing at-plant-to-use delivery/conditioning/storage and fates."
      source_ids:
        - bajaj-re-config
    - rule_id: service_safety_and_all_users
      applies_to: "taxi_service"
      rule: "Evidence the actual vehicle/body/drive and delivered accessibility/safety/quality, including actual helmet/child restraint/wheelchair lift/restraint/control or remote support where relevant. Do not assume presence or a national/operator limit universally. Operator/driver/passenger ownership changes allocation and coverage, not actual necessary service interfaces; evidence non-applicability or complete every actual item and native quantity."
      source_ids:
        - uber-motorbike
        - uber-auto
boundary_abstraction:
  declared_starting_condition: "Actual motorized taxi service cohort with identified supplier gates, vehicle/duty records and connected reservation responsibilities; earlier supply/lifecycle stages remain required."
  starting_condition_role: "Measured service-cohort and supplier-gate facts defining foreground collection, not an upstream cut-off credit."
  product_classification_scope: "Dedicated64115full actual motorized taxi function within/between urban/suburban areas including actual non-scheduled airport shuttle; general distance/destination note is not absolute"
  recursive_input_rule: "No self-purchase of own physical leg. A real completed subcontracted taxi provider result may replace only its evidenced covered cells, at its verified native unit and actual matched demand; include uncaptured integrator/other lifecycle burdens."
  upstream_dataset_requirement: "Compatible complete supply, vehicle/battery/infrastructure and treatment datasets with actual native units, technology, geography, lifetime and coverage."
  disclosure: "All actual duties, completed and failed service, energy/mass balances, empty operation, provider inclusions, shared users, lifecycle allocation, unresolved data and route comparability."
