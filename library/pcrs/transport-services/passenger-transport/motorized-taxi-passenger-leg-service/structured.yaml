allocation_rules:
  - rule_id: causal_partition
    applies_to: "taxi_service"
    rule: "Subdivide by vehicle/route/duty and direct meters first. For a shared burden Q, use actual attributable drivers d_c and complete all-user denominator sum(d_j); document the physical relationship, exclusions and sensitivity. Capacity, revenue share and equal splitting are not automatic allocation factors."
    source_ids:
      - ghg-product-standard
  - rule_id: passengers_and_other_users
    applies_to: "taxi_service"
    rule: "Passenger luggage carried as part of the declared service is within that function. Separately sold freight or other actual outputs require measured causal allocation with a compatible basis; passengers, kilograms of baggage, advertisements and fares cannot simply be summed as equivalent outputs."
    source_ids:
      - ghg-product-standard
  - rule_id: empty_and_lifetime
    applies_to: "taxi_service"
    rule: "Allocate necessary deadhead, empty service and idle support to the complete relevant service cohort through the demonstrated causal route/period relationship, never by an assumed load factor. Asset allocation covers complete useful duty and actual replacements; an annual purchase, hire fee or depreciation amount is not a manufactured-asset quantity."
    source_ids:
      - nyc-tlc-utilization-2025
      - ghg-product-standard
  - rule_id: no_automatic_credit
    applies_to: "taxi_service"
    rule: "Recovered materials, regenerative energy and recycled end-of-life material need actual destination, quality and coverage. Internal regeneration already reducing net imported electricity receives no second avoided-electricity credit; no default displacement ratio or negative waste credit is prescribed."
    source_ids:
      - ghg-product-standard
  - rule_id: on_demand_duty_pool
    applies_to: "taxi_service"
    rule: "Subdivide actual dedicated and pooled service segments first. Allocate residual empty/wait/failed duty through an evidenced complete operator/vehicle/period service pool and compatible passenger exposure; preserve all completed customer persons, other users and zero-output duty. Do not assume a one-passenger taxi, full seats or a utilization percentage from a pay rule. Personal/commuting travel needs explicit causality and ownership before inclusion or exclusion."
    source_ids:
      - nyc-tlc-utilization-2025
      - ghg-product-standard
  - rule_id: shared_person_segment_exposure
    applies_to: "taxi_service"
    rule: "First subdivide actual measured vehicle/route/duty segment quantities. For a shared loaded segment s, record all actual carried customer persons and other separately fulfilled users, actual distance/time/native driver and each person OD membership. A compatible passenger-only segment may allocate Q_s by evidenced person exposure d_is / sum_j d_js with a positive denominator; equal share only when measured equivalent exposure supports it. Sum each completed person leg exposure, then attribute supported residual empty/wait/failed/return pools to the complete causal cohort; do not discard partial/failed/other-user duty or double-normalize already allocated segments. Capacity, booking parties, fare shares and promised group size are not actual occupancy or physical allocation."
    source_ids: []
  - rule_id: airport_and_connected_reservations
    applies_to: "taxi_service"
    rule: "Include causally necessary reservation/dispatch infrastructure, pickup queues, waiting, detours, staggered passenger handling, airport access/terminal/rank support and empty return at actual owners. A common airport destination or one reservation is not a completed single passenger; a vehicle may serve several OD legs. Keep platform/operator/airport provider coverage and all-user denominators exclusive, including paid/unpaid/cancelled/no-show periods. Standalone broker output is not bought again as an actual completed transport leg."
    source_ids:
      - supershuttle-service
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "taxi_service"
      flow_role: "completed_taxi_leg"
      record_type: "service_record"
      raw_fields: "cohort_id; vehicle_id; accountable_operator; hire_model; actual_purpose; booking_id; actual_person_leg_id; boarding_alighting_OD; actual_duration; segment_distance; segment_passengers; party_id; actual_completion; no_show; cancellation; meter_record; uncertainty; actual_64115_function; urban_suburban_extent; scheduling_model; airport_shuttle_status; pickup_appointment_not_public_schedule; vehicle_chassis_drive; safety_accessibility_quality; person_segment_membership; completion_rule; actual_other_user_roles"
      collection_method: "Reconcile actual passenger/party boarding and alighting with dispatch, GPS and meter records; evidence completed persons independently of bookings or payment. Preserve pooled OD/segment exposure, free passengers, failed/no-show records and missingness. A customer party/booking or driver is not one actual person by default. Calculation and aggregation: N unique completed legs; preserve OD distance distribution; do not divide by N again after normalization Verify actual eligibility independently of brand/licence/billing. Match each real person boarding/alighting/OD to the real transport leg, schedule model, airport status and quality; record each continuing passenger across shared intermediate stops once, and actual separate vehicle legs separately. Reconcile real operator, platform and all-user duty coverage."
      unit: "Item(s); km; person-km"
      frequency: "per operation; declared representative period"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_energy
      process_id: "taxi_service"
      flow_role: "gasoline_supply; diesel_supply; charging_ac; cng_supply; lpg_supply"
      record_type: "meter_stock_record"
      raw_fields: "vehicle_id; fuel_identity; fossil_biogenic_fraction; actually_burned; spilled; evaporated; recovered; transferred; native_unit; opening_stock; deliveries; closing_stock; returns; charge_gate; charger_losses; actual_loaded_km; deadhead_km; idle_hours; zero_passenger_duty; on_duty_waiting; empty_cruising; dispatch_pickup; failed_jobs; platform_sessions; personal_driver_travel; complete_odometer_ledger; each_tank_fuel_formulation; pressure_temperature; bi_fuel_switches; pilot_startup_fuel; fuel_carbon_origin; delivery_conditioning_compression_gate; external_DC; swap_boundary; internal_recovery"
      collection_method: "Separately reconcile fuel supplied/withdrawn and actual combustion, spill, evaporation, recovery and transfers; direct combustion activity is not automatically total withdrawal. Use aligned fuel stock/meter and AC import records for the same actual duties; separate purchasing from consumption, other users and transfers; reconcile charger and car battery boundaries. Partition full GPS/odometer duty, including empty service and actual multi-platform overlaps, before attributing fuel or electricity. Logins or metered paid distance alone do not cover full vehicle duty. Calculation and aggregation: Attributed fuel net withdrawals and actual AC delivered energy / N; separate their combustion/fate activities, stock-adjusted and converted only with compatible evidence For CNG/LPG bi-fuel systems, independently meter or balance each actual fuel/tank, startup and switching state; no mixture assumed and no generic pressure-density/heating-value conversion. Identify AC delivery versus external DC/battery swap and internal conversion/recovery, then expand each other actual native supply."
      unit: "kg; MJ; native volume; km; h"
      frequency: "each vehicle/charge/fill; full cohort"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_depot
      process_id: "taxi_service"
      flow_role: "support_ac; wash_water; cleaning_detergent"
      record_type: "site_record"
      raw_fields: "site_id; meter_id; covered_users; charge_meter_overlap; native_quantity; material_SKU; actual_formulation; delivered_gate; physical_driver_all_users"
      collection_method: "Collect site meters, cleaning issue records and provider scope; segregate charging, maintenance, other fleets and terminal users before allocating a measured shared residual. Calculation and aggregation: Sum attributable actual quantities / N; exact shared ownership retained"
      unit: "MJ; kg; native material units"
      frequency: "each issue/meter period; same cohort"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_maintenance
      process_id: "taxi_service"
      flow_role: "refrigerant_r134a_supply; r134a_air"
      record_type: "maintenance_record"
      raw_fields: "vehicle_id; actual_refrigerant; opening_charge; additions; removals; recovered_charge; closing_charge; urea_solution_mass; concentration; reagent_carbon_origin; replaced_component; actual_fate"
      collection_method: "Use job orders, substance/formulation certificates and balances; independently identify additions, atmospheric loss, recovered product and waste. Unknown leakage or chemistry is not zero. Collect urea/SCR-specific fields only for an actual applicable system; any real reagent needs its separate concrete exchange and coverage, while evidenced non-use is recorded explicitly. Calculation and aggregation: Attributed actual supply/emission quantities / N, using reconciled independent balances"
      unit: "kg; actual component units"
      frequency: "each maintenance event; cohort and lifetime interfaces"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_assets
      process_id: "taxi_service"
      flow_role: "gasoline_car_supply; bev_car_supply; gasoline_motorcycle_supply; cng_three_wheeler_supply; diesel_passenger_van_supply; motorcycle_helmet_supply"
      record_type: "asset_lifetime_record"
      raw_fields: "asset_ID; vehicle_configuration; initial_battery_coverage; actual_replacements; useful_life_duty; total_life_driver; attributed_driver; all_users; manufacturing_maintenance_retirement_scope; road_and_depot_service_inventory; uncertainty; chassis_body_drive; exact_initial_component_coverage; safety_assembly_owner; all_taxi_platform_private_users; actual_native_asset_delivery_quantity; native_supplier_gate; independent_replacement_and_retirement"
      collection_method: "Record each delivered car/pack manufacturing-provider gate, initial-battery scope and actual quantity separately from its full-life duty denominator. Map every manufacturing, use, maintenance and retirement stage to exactly one owner. Add independent uncovered operation, component supply, whole-vehicle or component disposal/treatment records; an inclusive provider replaces its exact covered stages. Justify lifetime and all-user duties; money is not item count. Calculation and aggregation: For each asset a: delivered manufacture/supply quantity times attributable duty / total compatible useful duty / N; this allocates only verified provider coverage, not uncovered use or retirement. Keep every positive lifetime denominator explicit All actual service, household/personal and other users enter compatible physical lifetime denominators; a loan term or residual money value is not a physical useful life. Each actual motorcycle/three-wheeler/van/other chassis, protective helmet, battery/tank/control and actual safety/accessibility assembly needs its exact independent native supply/life/coverage record. The concrete cards are not a substitute for other actual configurations. Record shared driver/passenger-owned safety items with the same compatible all-user service-life allocation, no universal lifetime or warranty conversion."
      unit: "Item(s); km; h; actual infrastructure service units"
      frequency: "asset life; update on replacement or retirement"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_fates
      process_id: "taxi_service"
      flow_role: "wash_wastewater; spent_engine_oil; spent_car_tyres"
      record_type: "fate_record"
      raw_fields: "stream_ID; material_state; native_quantity; composition; receiver_gate; waste_status; reuse_retread; transport; treatment_provider; treatment_coverage; direct_outlet; stock_change"
      collection_method: "Use independent weigh/transfer notes and receiver evidence for each actual stream. Reconcile input inventories, stocks, evaporation, abrasion and physical collected quantities; no synthetic residual waste mixture. Calculation and aggregation: Attributed independent fate quantities / N; treatment exactly once"
      unit: "kg; actual receiver-native units"
      frequency: "each transfer/discharge; cohort"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_emissions
      process_id: "taxi_service"
      flow_role: "fossil_co2_air; fossil_ch4_air; n2o_air; pm25_air"
      record_type: "species_medium_record"
      raw_fields: "source_ID; vehicle; fuel; duty; species; fossil_biogenic_origin; particle_size; receiving_medium; factor_native_basis; unit; measured_or_modelled; factor_source; scope; overlaps; uncertainty"
      collection_method: "Measure or use separately justified technology/fuel/duty-specific non-default models. Reconcile factor basis with actual activity and source/medium. Retain every applicable non-exhaust, combustion, reagent and leakage record. Calculation and aggregation: Sum non-overlapping actual source-specific species quantities / N; never CO2-equivalent as species mass"
      unit: "kg species; particle-size-specific kg"
      frequency: "actual duty or justified representative measurement"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
    - protocol_id: cp_provider
      process_id: "taxi_service"
      flow_role: "purchased_taxi_leg"
      record_type: "provider_native_coverage_record"
      raw_fields: "provider_ID; actual_recipient_leg_link; function_quality_OD; native_unit; activity_A_u; result_per_unit_q_u; measured_conversion; supplier_gate; lifecycle_cells; remaining_owner; cohort_all_user_share; already_normalized; uncertainty"
      collection_method: "Read the actual completed supplier result and native unit, recipient/leg linkage, real matched native activity and every included stage/cell. Apply q_u times A_u times evidenced cohort/all-user share /N once; the Count card applies only to one matching completed native person-leg. For other native units create a separate verified concrete exchange with real conversion evidence. Provider cells replace matching physical cells and only uncaptured responsibilities remain; no same physical owned leg self-purchase."
      unit: "Item(s); actual verified provider-native units"
      frequency: "per operation; declared representative period"
      temporal_coverage: "Complete declared cohort and necessary lifetime interfaces"
      site_scope: "Same route/vehicles and all relevant users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Raw logs, calibration, sampling/model, boundary coverage and reconciliations"
  calculation_rules:
    - id: normalize_actual
      applies_to: "all inventory rows"
      rule: "For each actual exchange divide the attributed quantity by the same N; do not divide an already normalized provider result by N a second time."
      inputs:
        - "actual attributed native quantity"
        - N
        - cp_service
      output: "quantity per reference flow"
      source_ids:
        - ghg-product-standard
    - id: shared_allocation
      applies_to: "all inventory rows"
      rule: "Attributed common quantity = measured common total times actual cohort driver / sum of compatible all-user drivers. Require a positive denominator and record the physical basis and uncertainty for each application."
      inputs:
        - "measured shared total"
        - "cohort driver"
        - "complete all-user denominator"
      output: "attributed native quantity"
      source_ids:
        - ghg-product-standard
    - id: asset_equivalence
      applies_to: "gasoline_car_supply;bev_car_supply;gasoline_motorcycle_supply;cng_three_wheeler_supply;diesel_passenger_van_supply;motorcycle_helmet_supply"
      rule: "Use delivered manufacture/supply quantities and actual complete-life duty shares recorded by cp_assets; lifetime is the allocation basis only. Separate uncovered use, maintenance and retirement; initial/replacement, vehicle/pack and inclusive-provider coverage must not overlap."
      inputs:
        - cp_assets
        - "actual complete-life quantities"
        - "positive compatible duty denominator"
      output: "attributed delivered supply equivalents"
      source_ids:
        - ghg-product-standard
    - id: fuel_fate_partition
      applies_to: "gasoline_supply;diesel_supply;cng_supply;lpg_supply"
      rule: "Net withdrawal = opening + receipts - closing - returns; reconcile independently documented burned + spill + evaporation + recovery/other fate quantities on a compatible stock boundary. Any unexplained difference blocks closure. Use actual burned mass, not withdrawal or invoice mass, in direct combustion models."
      inputs:
        - cp_energy
        - cp_emissions
        - cp_fates
      output: "attributed fuel supply and separate compatible combustion/fate activities"
      source_ids:
        - ghg-product-standard
    - id: provider_native_scaling
      applies_to: "purchased_taxi_leg"
      rule: "For actual provider result q_u per verified native unit u, inventory contribution = q_u × actual matched A_u × supported cohort/all-user share /N, once. Verify dimensions and covered cells first; do not multiply a per-person result by vehicle trips or divide by occupancy again. Replace exact covered foreground cells only."
      inputs:
        - cp_provider
        - cp_service
        - "actual native demand and covered cells"
      output: "exclusive provider contribution per reference flow"
      source_ids: []
    - id: pooled_segment_closure
      applies_to: "taxi_service"
      rule: "Sum exclusive actual segment burdens allocated by observed compatible person exposure plus causally assigned empty/wait/failed/return/support pools. Reconcile all actual persons, duties and other users to complete vehicle/operator/platform/period totals; divide compatible attributed cohort quantity by N once. No universal occupancy, one booking=one person or ignored zero-output segment."
      inputs:
        - cp_service
        - cp_energy
        - cp_depot
        - "actual segment and duty ledger"
      output: "closed actual person-leg cohort inventory"
      source_ids: []
  data_quality_requirements:
    - id: completion_and_comparability
      applies_to: "taxi_service"
      requirement: "Missing completion evidence, positive N, actual distance distribution or required qualifiers blocks completion; equal counts do not establish service comparability."
      evidence: "cp_service; nyc-tlc-yellow-2025"
    - id: other_actual_energy
      applies_to: "taxi_service"
      requirement: "Identify every actual fuel, hydrogen supply, steam/heat, hybrid pathway or auxiliary carrier omitted from the concrete examples. Record exact delivered identity, native unit, upstream scope and actual quantity; unknown applicability blocks completion. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_energy"
    - id: other_actual_materials
      applies_to: "taxi_service"
      requirement: "Identify each actual lubricant, chemical, disinfectant, cleaner, reagent formulation, spare part, tyre or battery chemistry/configuration. Expand each independently supplied or maintained item into a verified atomic exchange; no generic material collection may stand in for them. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_maintenance"
    - id: roads_depots_and_charge_assets
      applies_to: "taxi_service"
      requirement: "Obtain actual attributable road, terminal, depot, charger and other supporting infrastructure lifecycle inventories with compatible complete-life all-user denominators. Distinguish upstream infrastructure already included in provider data from genuinely missing burdens; missing coverage blocks complete-lifecycle use. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_assets"
    - id: providers_and_subcontracting
      applies_to: "taxi_service"
      requirement: "Identify each actual subcontracted operating/repair/treatment result and its native functional unit, boundary and physical driver. An inclusive provider result replaces its covered foreground exchanges; do not add them again or substitute an arbitrary freight or vehicle-manufacturing UUID. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_depot"
    - id: other_fate_streams
      applies_to: "taxi_service"
      requirement: "Expand each actual sludge, filter, packaging, battery, retired whole vehicle or dismantled component, wastewater outlet, reused product and disposal/treatment result separately. Whole-vehicle and retained-component views are mutually exclusive for the same material. Establish material, mixture state, receiver gate and native quantity; evaporation or unaccounted loss cannot be invented as collected waste. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_fates"
    - id: other_species_media
      applies_to: "taxi_service"
      requirement: "Identify actual CO, nitrogen oxides with reported chemical basis, ammonia/SCR slip, each other refrigerant, biogenic combustion products, non-exhaust size classes, road/soil deposits and runoff species/outlets. Expand every independently quantified substance/size/source/medium; no generic NOx/VOC/dust residual UUID and no missing-as-zero. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_emissions"
    - id: duty_purpose_and_platforms
      applies_to: "taxi_service"
      requirement: "Identify all actual service/personal/driver travel, pooled-party exposure and multiple-platform duty overlaps, plus actual necessary booking/dispatch digital support. Complete each unrepresented physical supply, energy or provider result separately; fees do not prove its native output or full lifecycle coverage. Unknown identity, quantity or applicability blocks completion."
      evidence: "cp_service; cp_energy; cp_depot"
    - id: full_taxivehicle_scope
      applies_to: "taxi_service"
      requirement: "MANDATORY: establish every actual qualified motorized vehicle configuration, not just the five conditional assembly cards. Independently represent each actual petrol/diesel/LPG/CNG/electric/hybrid/other two-,three-,four- or larger-wheel chassis/body/drive, initial and replacement components, energy/controls, maintenance, end-of-use and safety/accessibility interfaces with supported native amounts. Actual applicability unknown blocks completion, not product scope."
      evidence: "cp_assets;cp_energy;cp_maintenance;cp_fates;cp_emissions"
    - id: atomic_actual_expansion
      applies_to: "taxi_service"
      requirement: "MANDATORY for each actual unrepresented material, asset, provider result, supply, output, waste, species/particle/medium or treatment: create one unique row_id, one existing process, actual direction/type, one definite identity/state/formulation, UUID or explicit unresolved record, native property/unit/quantity and basis, raw source, valid same-parent collection_protocol_id, physical calculation/provider gate and covered cells, actual receiver/known subcompartment and uncertainty. Resolve occurrence or evidenced non-applicability; unknown is incomplete, never zero. Category collectors and generic waste/emission rows are not exchanges."
      evidence: "all actual records; valid process/protocol foreign keys"
    - id: airport_pooling_and_role_evidence
      applies_to: "taxi_service"
      requirement: "MANDATORY: record actual scheduled/non-scheduled function and distinct chauffeur-hire boundary, actual airport context/OD, staggered persons and segment duties, dispatch/rank waiting, cancellations, pickup and empty return. Actual driver/operating-support roles are not customer output; do not infer completed persons from party/reservation or capacity. Complete all actual platform and airport/terminal/rank native support and assets at real owners and all-user drivers."
      evidence: "cp_service;cp_provider;cp_energy;cp_depot;cp_assets"
    - id: bi_fuel_formulation_and_fates
      applies_to: "taxi_service"
      requirement: "MANDATORY: identify actual CNG/LPG formulation, each actual startup/pilot/other fuel and fuel switches, phase/pressure/temperature/native supply quantities and separate burn/leak/vent/spill/recovery/stock. Distinguish fuel product mixtures from independently quantified elementary species and actual receiving subcompartments. Any actual lubricant/reagent/refrigerant/battery/tyre/helmet-cleaning supply and each corresponding waste/species/treatment outside the concrete cards must be expanded independently; no assumed all-tank combustion or methane-equivalent input."
      evidence: "cp_energy;cp_maintenance;cp_fates;cp_emissions"
validation_rules:
  - rule_id: service_basis
    applies_to: "taxi_service"
    rule: "Verify unique completed passenger legs, actual OD/distance strata, N > 0 and identical EN/ZH reference link. Reject tickets, seats, linked journeys or on-demand vehicle departures as substitutes."
    source_ids:
      - nyc-tlc-yellow-2025
  - rule_id: period_closure
    applies_to: "taxi_service"
    rule: "Reconcile actual duty, input/output stocks, cohort carry, failed services and actual zero-passenger operation. N = 0 yields no finite per-passenger result; retain its burden and explicit relationship to the relevant service pool rather than dropping it."
    source_ids:
      - ghg-product-standard
  - rule_id: identity_and_expansion
    applies_to: "taxi_service"
    rule: "Each inventory row names one actual material/service result/waste stream/substance-medium; confirm exact UUID/property/unit compatibility before final use. Every completion requirement must be resolved by actual independent rows or evidenced non-applicability; unknown is not zero."
    source_ids:
      - ghg-product-standard
  - rule_id: closure_and_overlap
    applies_to: "taxi_service"
    rule: "Check charging/vehicle/depot energy ownership, initial/replacement batteries, direct versus upstream emissions, overlapping PM size classes, recovered refrigerant, waste treatment and asset lifetime allocations. No automatic density, occupancy, lifetime, emission factor or recycling credit is permitted."
    source_ids:
      - ipcc-mobile-combustion
      - eea-electric-vehicles
      - ghg-product-standard
  - rule_id: taxi_fullscope_function
    applies_to: "taxi_service"
    rule: "Confirm actual64115function and geography/non-scheduled airport status with observed service records. General billing note is not absolute; brands/booking appointments/national licences do not alone decide scope. Verify actual chassis/drive, quality/safety, all persons and duty/asset/provider ownership; missing an actual branch or required row makes the package incomplete."
    source_ids:
      - cpc3-structure
  - rule_id: provider_native_and_cp_ownership
    applies_to: "taxi_service"
    rule: "Every CP process_id is one existing inventory process and each card references a valid CP with that same parent. Prove provider native unit/activity scaling, Count versus pkm/vehicle/hour distinctions and mutually exclusive stage coverage. Check manufacture native quantity and same-asset positive total all-user useful duty; no duplicated whole/component/blend/initial/replacement/provider/fate responsibility."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after all mandatory actual foreground identities, quantities, completion, native provider/lifetime and fate responsibilities are completed and reviewed"
  allowed_use: "Actual qualified motorized taxi person-leg within/between urban/suburban areas or actual non-scheduled airport shuttle, with harmonized actual OD/extent/time/pooling/quality and full lifecycle"
  excluded_use: "Chauffeured availability/whole-hire engagement; scheduled airport shuttle; nonmotorized/water/air taxi or medical product; standalone booking/payment; universal pkm/occupancy/life factor; incomplete actual dataset treated as full lifecycle"
  required_metadata: "Actual eligible function/geography/airport scheduling, operator/vehicle/platform/period, persons/OD/segment/completion/quality, native supplies/provider cells, all-user useful-life asset drivers and raw sources/uncertainty"
  required_quality_disclosure: "All unverified identities, missing actual quantities, sampling/model uncertainties, unresolved infrastructure/asset/waste coverage, and cause of non-comparability"
  update_trigger: "Material route/propulsion/vehicle/battery/provider changes; revised activity, life or source evidence; changed classification or service completion definition"
data_sources:
  - id: "cpc3-structure"
    type: "official_guidance"
    reference: "UNSD CPC3.0 Explanatory Notes,30June2025,actual PDFp359,64115 and neighbouring exclusions. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full actual motorized taxi/urban-suburban and non-scheduled airport shuttle scope, connected reservations and exclusions; general destination/distance billing is not an absolute condition."
  - id: "nyc-tlc-yellow-2025"
    type: "official_guidance"
    reference: "NYC TLC Yellow Taxi Trip Records Data Dictionary,18March2025,p1. https://www.nyc.gov/assets/tlc/downloads/pdf/data_dictionary_trip_records_yellow.pdf"
    used_for: "Meter timestamps, recorded passenger number, distance, OD and payment/void fields are distinct. This regional schema does not verify actual passenger completion or universal occupancy."
  - id: "nyc-tlc-utilization-2025"
    type: "official_guidance"
    reference: "NYC TLC Notice of Promulgation,adopted25June2025,PDFpp2,6–8. https://a856-cityrecord.nyc.gov/Search/GetFile?documentId=42301&requestId=20250625045&requestStatus=Archived&sectionId=4"
    used_for: "Qualitative distinction between passenger, dispatch waiting and pickup travel in actual duty. No monetary rate, utilization percentage, financed lifetime or LCA factor adopted."
  - id: "ipcc-mobile-combustion"
    type: "official_guidance"
    reference: "IPCC2006Guidelines,Vol2Ch3,section3.2,pp3.10–3.16. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Qualitative fuel/activity, origin and technology-specific species accounting; no default factor adopted and national GHG inventory is not full service lifecycle."
  - id: "eea-electric-vehicles"
    type: "official_guidance"
    reference: "EEA Electric vehicles,Overview. https://www.eea.europa.eu/en/topics/in-depth/electric-vehicles"
    used_for: "Vehicle/battery manufacture and road/tyre/brake burdens remain; no average benefit, battery life or universal numerical intensity transferred."
  - id: "ghg-product-standard"
    type: "standard"
    reference: "WRI/WBCSD ProductLifeCycleAccountingAndReportingStandard2011,chapters7–9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary/data quality and subdivision/physical allocation; complete vehicle/infrastructure lifecycle is an explicit PCR scope choice, not a capital mandate attributed to this GHG standard."
  - id: "uber-motorbike"
    type: "official_guidance"
    reference: "Uber Bike motorbike ride service,official public page accessed22October2026. https://www.uber.com/in/en/ride/uber-moto/"
    used_for: "Actual city motorbike pickup/destination and helmet responsibility as conditional case; no universal operator-provided helmet, occupancy, age/legal rule, fuel, lifetime, price or LCA factor adopted."
  - id: "uber-auto"
    type: "official_guidance"
    reference: "Uber Auto autorickshaw ride service,official public page accessed22October2026. https://www.uber.com/in/en/ride/uber-auto/"
    used_for: "Actual autorickshaw pickup/destination/vehicle confirmation/arrival case read through official web reader; not global legal classification, measured completion, fuel, capacity or default input proof."
  - id: "supershuttle-service"
    type: "official_guidance"
    reference: "SuperShuttle How it works,official public page accessed22October2026. https://www.supershuttle.com/how-it-works/"
    used_for: "Actual shared variable-stop versus direct airport-transfer and separate hourly availability case read through official web reader; verify actual non-scheduled function separately. No service availability, number of stops/passengers, fleet fuel, environmental benefit or factor assumed."
  - id: "bajaj-re-config"
    type: "official_guidance"
    reference: "Bajaj RE actual three-wheeler configurations,official public page accessed22October2026. https://www.bajajauto.com/three-wheelers/re"
    used_for: "Manufacturer lists actual diesel/petrol/CNG/LPG and CNG/LPG bi-fuel variants, supporting conditional independent tank/fuel/assembly questions. No warranty, capacity, consumption, savings, finance term or automatic taxi classification transferred."
