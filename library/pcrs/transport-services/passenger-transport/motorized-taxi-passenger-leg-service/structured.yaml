measurement_rules:
  - id: service_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "N is the positive count of actual completed qualified motorized taxi person-legs in the declared service cohort. Preserve every actual person and boarding/alighting OD; neither driver nor party/booking/dispatch/seat/payment is a person-leg. Intermediate stops for a person remaining aboard do not create further legs. Reconcile failed/unfinished/cross-period duties and actual vehicle changes."
  - id: distance_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Native service records"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Keep actual vehicle-km, passenger-km, boardings and completed legs distinct. Passenger distance is the sum of actual passengers times actual segment distance; an optional per-passenger-km result needs its own supported reference basis and disclosure, not relabelling this Count flow."
  - id: native_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Native compatible property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Preserve measured units. Metered electricity kWh may use 3.6 MJ/kWh; this is an energy-unit conversion, not a fuel heating-value factor. Fuel/water volume-to-mass requires actual compatible density/state; N2O-N, NOx-as-NO2 and refrigerant CO2-equivalent require explicit substance conversion."
  - id: fuel_stock_and_fate
    applies_to: "gasoline_supply;diesel_supply;cng_supply;lpg_supply"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Net fuel withdrawn = opening stock + actual receipts - closing stock - returns. Independently reconcile fuel actually burned, spilled, evaporated, recovered or otherwise transferred; do not infer those fates from an unexplained residual. Fuel-supply burden follows attributed net withdrawal, while direct combustion calculations use only the compatible actually burned quantity and supported carbon/oxidation basis."
