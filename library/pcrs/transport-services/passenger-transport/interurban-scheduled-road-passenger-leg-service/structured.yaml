allocation_rules:
  - rule_id: all_users
    applies_to: "interurban_scheduled_road_service"
    rule: "First subdivide actual service strata and separable cargo/other products. Driver/operating attendants are support, not additional passenger outputs; actual infants/free passengers count persons. Allocate inseparable actual segment/route/depot/wire/track/road/asset duties across all real users with documented causal compatible physical drivers and sensitivity; no passenger/tonne-km addition, fixed occupancy or arbitrary ratio."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_native
    applies_to: "interurban_scheduled_road_service"
    rule: "For same asset actual delivered native quantity times cohort compatible duty/positive complete-life all-user useful duty, then/N. Actual hours/km/cycles/calendar/trackloading/wireuse are chosen by demonstrated causal relation, not financial depreciation or invented conversion. Manufacture allocation does not supply operation/maintenance/retirement; all uncovered stages independently completed."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_scaling
    applies_to: "interurban_scheduled_road_service"
    rule: "Purchased per-vehicle-km/hour/pkm/vehicle/maintenance/treatment result scales actual compatible attributed activity before /N. Per-pkm requires real passenger distance/membership, not capacity; already per-equivalent completed public interurban leg is not divided again. Provider covers exact stage/flow cells, replacing only those same foreground exchanges; no freight/manufacturing UUID as Count passenger output."
    source_ids:
      - ghg-product-2011
  - rule_id: stage_cohort_support
    applies_to: "interurban_scheduled_road_service"
    rule: "Use actual passenger memberships/distances and service quality on each operated segment, plus real cargo and supporting users, before aggregation to completed leg cohortN. Through riders remain one leg across its actual intermediate stages; genuine connections/substitution outcomes evidenced separately. Shared driver-rest/accommodation/terminal/maintenance duties retain actual all-user drivers and provider native quantities, no fixed per-passenger shares or omitted zero-output duty."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_completion
      process_id: "interurban_scheduled_road_service"
      flow_role: "completed_public_interurban_leg"
      record_type: "operational_record"
      raw_fields: "noncontiguous_cities; actual_public_route_schedule; actual_served_extent_stopOD; distance_distribution; quality_class; segment_memberships; through_rest_stop_reboarding; genuine_connections_operational_substitution; intended_actual_completion; children_free_staff_roles; period; N"
      collection_method: "Verify actual non-contiguous-city public schedule/function and real passenger boarding/final-alighting extent/OD, intermediate segment memberships/distance and quality cohort. Reconcile technical/rest reboarding, actual continued obligation after substitution, separately joined connections and partial/failed outcomes. Tickets/capacity/movements notN; retain actual failed/empty/support and all-user duty beforepositiveN once, N0no finite intensity."
      unit: "Item(s)"
      frequency: "each actual duty/event and period/life"
      temporal_coverage: "complete cohort/period and required alluserlife"
      site_scope: "all actual road/rail/contactgrid/site/vehicle/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/contracts/balances/provider/applicability/uncertainty"
    - protocol_id: cp_fuel
      process_id: "interurban_scheduled_road_service"
      flow_role: "diesel"
      record_type: "operational_record"
      raw_fields: "actual_engine_aux; grade_blend_origin; stock_open_receipts_close_returns; netwithdrawal_burn_spill_recovery; allusers_providercells"
      collection_method: "Measure actual grade/state native supplies/stocks and evidenced burn separately; wholeblend+composition ledger OR replacing component inputs, neverboth. Attribute real loaded/empty/idle/auxiliary compatible duty across actual users before /N; other real fuels independently expanded."
      unit: "kg"
      frequency: "each actual duty/event and period/life"
      temporal_coverage: "complete cohort/period and required alluserlife"
      site_scope: "all actual road/rail/contactgrid/site/vehicle/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/contracts/balances/provider/applicability/uncertainty"
    - protocol_id: cp_electric
      process_id: "interurban_scheduled_road_service"
      flow_role: "external_ac; purchased_traction_dc; external_export_ac"
      record_type: "operational_record"
      raw_fields: "gate_graph; AC_DC_voltage_polarity; meter_gross_net; rectifier_line_charger_storage_losses; pantograph_poles; regeneration_acceptance; resistor_heat; internal_external_transfer; allusers_providercells"
      collection_method: "Build actual physical ownership/gate energy balance: imports, real externally purchased DC, internal conversion/storage/recovery, actual external exports and dissipation separately. AC supply and same inclusive upstream DC exclusive; grid/network/braking energy not virgin supply twice. Use each measured compatible native quantity with actual whole-network/all-user sharing then/N; no assumed regeneration percentage."
      unit: "MJ"
      frequency: "each actual duty/event and period/life"
      temporal_coverage: "complete cohort/period and required alluserlife"
      site_scope: "all actual road/rail/contactgrid/site/vehicle/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/contracts/balances/provider/applicability/uncertainty"
    - protocol_id: cp_depot
      process_id: "interurban_scheduled_road_service"
      flow_role: "wash_water; wash_wastewater"
      record_type: "operational_record"
      raw_fields: "site_wash_cleaner; input_stock_fates; actual_stream_composition_receiver; losses; alluser_driver; provider_cells"
      collection_method: "Actual cleaning/site activities, water stock/use/evaporation/collected/direct fates and receiver/treatment gates independent. Collect every actual cleaner/material/utility/waste separately; do not infer wastewater from water input alone. Attribute actual all users then/N."
      unit: "kg; actual native quantities"
      frequency: "each actual duty/event and period/life"
      temporal_coverage: "complete cohort/period and required alluserlife"
      site_scope: "all actual road/rail/contactgrid/site/vehicle/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/contracts/balances/provider/applicability/uncertainty"
    - protocol_id: cp_maintenance
      process_id: "interurban_scheduled_road_service"
      flow_role: "r134a_supply; used_oil; spent_tyres"
      record_type: "operational_record"
      raw_fields: "actual_vehicle_track_wire_parts; formulation; service_renewal; input_stock_consumed_retained; tyre_steelwear_collected_release; refrigerant_stock_recovery_leak; receiver_transport_treatment"
      collection_method: "Record actual motorbus/tram/trolley and track/wire maintenance, replacement/retirement, each real material and native fate. Separate initial/recharge/stock/recovery/refrigerant leak, new oil/collected oil and tyre/steel wear/collected retired material. Actual treatment/transport coverage and all-user event allocation before/N, no assumed residual releases or recycling credit."
      unit: "kg; Item(s); actual native quantities"
      frequency: "each actual duty/event and period/life"
      temporal_coverage: "complete cohort/period and required alluserlife"
      site_scope: "all actual road/rail/contactgrid/site/vehicle/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/contracts/balances/provider/applicability/uncertainty"
    - protocol_id: cp_assets
      process_id: "interurban_scheduled_road_service"
      flow_role: "diesel_bus; battery_bus; tram_car; trolleybus; steel_rail; copper_contact_wire"
      record_type: "operational_record"
      raw_fields: "asset_id; actual_delivered_native_quantity; manufacturinggate; whole_components; initial_replacement; sameasset_cohort_duty; positive_complete_life_allusers; road_track_wire_substation_sites; retired_providercells"
      collection_method: "For each same asset native delivered manufacture quantity times supported cohort/positive total all-user life duty then/N, manufacture gate only. Native complete-vehicle Item(s) versus rail/wire kg needs actual support, no invented mass. Include uncaptured install/refit/use/maintenance/renewal/EoL independently, exact provider cells replacing duplicates; whole object versus initial components exclusive."
      unit: "Item(s); kg"
      frequency: "each actual duty/event and period/life"
      temporal_coverage: "complete cohort/period and required alluserlife"
      site_scope: "all actual road/rail/contactgrid/site/vehicle/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/contracts/balances/provider/applicability/uncertainty"
    - protocol_id: cp_emissions
      process_id: "interurban_scheduled_road_service"
      flow_role: "fossil_co2_air; fossil_ch4_air; n2o_air; pm25_air; r134a_air"
      record_type: "operational_record"
      raw_fields: "actual_source_substance_CAS; chemistry_C_N_S; size_composition; fuelburn_or_leak_wear_activity; medium_subcompartment; abatement_capture; deposit_runoff_waste; methodfactor_applicability; uncertainty; allusers"
      collection_method: "Independently measure/model each actual source/species/size/medium with documented compatible physical activity and method; chemical basis/carbon origin and control retained. Combustion, wheelrail/brake/tyre/contact wear and refrigerant fates separately evidenced, no supply=emission or CO2e-to-substance. Quantify actual air/deposit/water/collected split without invented fractions; all-user quantity/N, unknownnotzero."
      unit: "kg specific substance"
      frequency: "each actual duty/event and period/life"
      temporal_coverage: "complete cohort/period and required alluserlife"
      site_scope: "all actual road/rail/contactgrid/site/vehicle/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/contracts/balances/provider/applicability/uncertainty"
    - protocol_id: cp_long_route
      process_id: "interurban_scheduled_road_service"
      flow_role: "completed_public_interurban_leg"
      record_type: "operational_record"
      raw_fields: "carrier_subcontractor_segment_country; actual_grid_fuel_supplygate; full_route_and_preparation; driver_duty_relief_rest_role; actual_borderwait_delay; actual_sanitary_accessibility_HVAC_cabin; actual_meal_accommodation_native_units; actual_covered_stagecells; other_users; empty_failed_zerooutput_support"
      collection_method: "Collect actual entire route/cross-period/each-provider responsibilities, driver change/rest and physical support records, country/segment supply/native gates and all users. Determine actual presence or evidenced non-use of each facility/meal/stay/consumable/service and its actual lifecycle stages; no universal resthour/hotel/toilet/meal/personnel recipe. Actual purchased perkm/hour/personnight/meal/etc result times compatible actual attributed activity beforeN, exact covered cells replacing duplication; internal crew duty differs transported crew/purchased service. Whole leg not clipped by borders/statistics, actual failed/empty/standby preparation/rest-support burden retained."
      unit: "actual native activity/service quantities"
      frequency: "each actual duty/event and period/life"
      temporal_coverage: "complete cohort/period and required alluserlife"
      site_scope: "all actual road/rail/contactgrid/site/vehicle/provider users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "actual logs/calibration/contracts/balances/provider/applicability/uncertainty"
  calculation_rules:
    - id: native_normalization
      applies_to: "interurban_scheduled_road_service"
      rule: "Actual compatible raw quantity times evidenced cohort/alluser shares; close all actual failed/empty/loaded/support/stock duties then divide positiveN once. Compatible provider perkm/hour/pkm times actual native activity first, already equivalenteachleg no seconddivision."
      inputs:
        - cp_completion
        - cp_fuel
        - cp_electric
        - cp_depot
        - cp_maintenance
        - cp_emissions
      output: "Actual attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: asset_manufacture
      applies_to: "interurban_scheduled_road_service"
      rule: "Sameasset actual delivered native quantity times compatible cohort/positive complete-life alluser usefulduty then/N, manufacturinggateonly. Uncovered install/use/refit/replacement/maintenance/retirement separate, wholeinitialcomponent/providercoverage exclusive."
      inputs:
        - cp_assets
      output: "Actual attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
    - id: energy_stock_fates
      applies_to: "interurban_scheduled_road_service"
      rule: "Separately reconcile fuelstock supply/netwithdrawal/burn/spill/recovery and electrical grossimports/providerDC/internalconversion/storage/regeneration/export/losses/dissipation. Wholeblend vsreplacingcomponents exclusive. Actual compatible species/source activity and medium not fabricated from residual or metering mismatch."
      inputs:
        - cp_fuel
        - cp_electric
        - cp_emissions
      output: "Actual attributed native quantity per reference"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: interurban_reference_extent
      applies_to: "interurban_scheduled_road_service"
      requirement: "Actual non-contiguous cities, publicall-user route/schedule, real passenger servedextent/stopOD/distance/class/period/completion mandatory. No arbitrarykm threshold or inheritedurban/specificgroupcondition. Intermediate stops/rest reboarding not duplicatelegs, genuine separatelyfulfilled connections and operational substitutions have explicit completion/responsibility mapping. Local-only rides notautomaticallyinterurban fromwholevehicleroute, no inventedcitycentre endpoints foractualintermediatestops."
      evidence: "cp_completion; cp_long_route"
    - id: tram_wheelrail
      applies_to: "interurban_scheduled_road_service"
      requirement: "For actual tram derive real bogie/wheels/axles/rails/points/sleepers_slab/fasteners/returncurrent/brakes/sanding/lubrication/grinding and noise interfaces from technical records. Every actual independently supplied/replaced material, emitted species/size/medium, captured grinding residue/deposit/runoff/waste and receiver gets independent identity/native amount; no generic tyrePM factor or default steelwear split."
      evidence: "cp_maintenance; cp_assets; cp_emissions"
    - id: trolley_contact_power
      applies_to: "interurban_scheduled_road_service"
      requirement: "For actual trolleybus/tram/similar record actual collector poles/pantograph/strip/contactwire/alloy/support/feed_return/substation/protection and native current/voltage/energy gates. Offwirebattery/generator, overhead charging and all actual hybridstates independent; actual each material/state/gate CP-linked row required, not all vehicles assumed same."
      evidence: "cp_electric; cp_assets; cp_maintenance"
    - id: network_energy
      applies_to: "interurban_scheduled_road_service"
      requirement: "Resolve each real gridAC/providerDC/contactline/charger/vehicle/waysidestorage/othervehicle boundary and loss, regeneration transfer/acceptance/resistor dissipation/external export with actual meters/balance and all users. Gross/net data and provider inclusions mutually exclusive; no arbitrary regeneration credit or assumed AC/DC identity conversion."
      evidence: "cp_electric"
    - id: other_inputs
      applies_to: "interurban_scheduled_road_service"
      requirement: "Identify every actual other fuel/hydrogen/heat/steam, electrolyte/battery chemistry, oil/hydraulicfluid/cleaner/disinfectant/SCR reagent/refrigerant, component/tyre/collector alloy/rail coating/sand/water state and independent service/utility. Each actual exchange gets unique rowID,oneexistingprocess,direction/type,singleidentity/state,UUIDorunresolved,nativeproperty/unit/amount/rawsource,sameparentCP,calculation,providergate/receiver/uncertainty."
      evidence: "cp_fuel; cp_electric; cp_depot; cp_maintenance"
    - id: all_asset_life
      applies_to: "interurban_scheduled_road_service"
      requirement: "Independently cover all actual vehicle/battery/road/track/slab/wire/pole/substation/storage/charger/depot/stop/terminal/land manufacture/install/refit/renewal/maintenance/retirement with sameasset alluser life evidence. Native count/mass relationships measured, no defaultcapacity/life; wholeobject and same included initial components exclusive; no old/leased asset automaticallyzero."
      evidence: "cp_assets"
    - id: all_fates
      applies_to: "interurban_scheduled_road_service"
      requirement: "Expand each actual worn rail/wheel/collector/tyre/brake/battery/component, washwater/sludge/filter/oilymaterial/packaging and treatment/reuse/disposal state as actual single collection flow with composition/gate/receiver/transport/treatment. Direct water/soil/air substance releases distinct; evaporation/unknownloss not waste."
      evidence: "cp_depot; cp_maintenance; cp_emissions"
    - id: all_species_media
      applies_to: "interurban_scheduled_road_service"
      requirement: "Independently quantify actual CO, specific nitrogenoxides/hydrocarbons/ammonia, biogeniccarbon/reagentcarbon/refrigerants, nonoverlapping particles with actual chemistry/source and receiving air/water/soil/deposit states, brake/rail/wheel/contact wear and actual noise. No NOx/VOC/dust umbrella or captured-emitted duplication; unspecifiedair UUID cannot erase known urban/nonurban/nearground. Missing LCIA characterization does not zero physical releases."
      evidence: "cp_emissions"
    - id: provider_full_closure
      applies_to: "interurban_scheduled_road_service"
      requirement: "Actual provider service/nativeactivity/lifecyclecell mapping required for every subcontracted energy/operation/asset/maintenance/treatment result. Multiply compatible raw perkm/hour/pkm/native quantity and complete actual failed/zerooutput/support duty beforeN; already equivalenteachleg not divided twice. Every uncovered stage mandatory; missing data blocks complete application, notzero."
      evidence: "cp_completion; cp_assets; cp_electric; cp_maintenance"
    - id: whole_route_support_providers
      applies_to: "interurban_scheduled_road_service"
      requirement: "Preserve whole actual interurban leg across countries/operating segments, source-specific energy/geography/native provider boundaries, actual long-route preparation/rest/change/wait/delay/recovery/empty/failed/zero-passenger responsibilities. Each actual cabin/sanitary/food/drink/accommodation/accessibility/driver support and all-user asset/event service gets independent rowID,oneparentprocess,direction/type,one identity/UUIDorunresolved,nativeproperty/unit/amount/rawsource,sameparentCP,method/coveredstage/gate/receiver/uncertainty. No universal facilities/meals/nights/resthours/labour-count assumption; missing actual included necessary support blocks completion, independently soldproducts subdivide without doublecount."
      evidence: "cp_long_route; cp_completion; cp_assets; cp_fuel; cp_electric; cp_depot; cp_maintenance"
