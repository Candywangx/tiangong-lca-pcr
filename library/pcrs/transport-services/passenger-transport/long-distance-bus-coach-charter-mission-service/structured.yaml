allocation_rules:
  - rule_id: mission_first
    applies_to: "charter_mission"
    rule: "Assign dedicated mission vehicles, crew duties and support directly before allocating shared pools. A group mission is the declared service output: its actual persons and vehicle legs are supporting exposure records, not additional final/co-product outputs. Do not divide the mission inventory by party size to manufacture the reference."
    source_ids: []
  - rule_id: shared_physical
    applies_to: "charter_mission"
    rule: "For residual common resources use actual supported causal drivers across every served mission/product and period. Actual vehicle-distance, occupied vehicle-time, area-time or measured resources may apply only with a demonstrated relationship; seats, quoted capacity, fares and equal fractions are not defaults. Person-distance and tonne-distance cannot be added as one unit."
    source_ids:
      - ghg-product-standard-2011
  - rule_id: empty_failure
    applies_to: "charter_mission"
    rule: "Keep actual pre/post positioning, standby, waiting, recovery and failed/partial missions in their evidenced service pool. N=0 retains its numerator for period/boundary resolution and has no finite per-mission intensity. Paid cancellation or unused coach availability is not an automatically completed charter mission."
    source_ids: []
  - rule_id: asset_lifetime
    applies_to: "charter_mission"
    rule: "For each physical coach/component, actual delivered manufacture count times studied compatible duty / positive documented same-asset all-user lifetime duty gives attributed manufacture quantity; then /N completed missions. Include actual scheduled/charter/other asset users in the denominator. Keep manufacture, replacements, repair and retirement disjoint; no annual purchase/depreciation/hire money stands in for native physical demand."
    source_ids: []
  - rule_id: other_outputs
    applies_to: "charter_mission"
    rule: "Separate independent freight, dining, accommodation, guiding or other actual products by subdivision or reviewed compatible allocation. Transport-incidental services actually included in the declared mission remain inside it. Actual energy/material recovery needs its own fate and declared method; no automatic avoided-car, fertilizer, virgin material or grid credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_missions
      process_id: "charter_mission"
      flow_role: "completed_long_distance_charter_mission"
      record_type: "mission_and_party_ledger"
      raw_fields: "mission_id;operator_control;organiser;actual_party;segment_persons;luggage;OD;itinerary;stops;return_scope;actual_duration;vehicles/replacements;quality;acceptance;partial/cancelled;period;actual_distance;original_promised_scope;timestamped_amendments;actual_delivered_quality;partial_failed_release;independently_accepted_output;operator_vs_client_control;actual_charter_geography;fleet_driver_replacement_continuity;actual_64223_urban_suburban_connection_or_longdistance_extent;actual_original_itinerary_duration_quality_acceptance;multi_vehicle_mission_membership"
      collection_method: "Reconcile agreed transport mission and actual dispatch/party/itinerary/acceptance records. Define one-way/return and multi-stop scope before counting. N=sum actual completed functionally compatible missions; preserve actual passengers and each vehicle/leg as separate exposure records, not extra mission outputs. Missing acceptance/completion remains unresolved; payments do not create completion. Reconcile original and actual amended scope chronologically; no post-hoc failed-scope shrink, fee-as-completion or automatic car-availability output. Record real qualifying charter mission boundaries across fleet/internal legs/driver changes; only actual accepted compatible completed missions enter N. Verify actual64223urban-suburban connection OR long-distance charter function and complete original/changed contract extent; no fixedkm/noncontiguouscity gate. Keep real multi-vehicle/driver/internal-stage membership and only independently accepted comparable completed whole missions inN."
      unit: "Item(s);persons;km;h"
      frequency: "each actual mission;reconciled cohort"
      temporal_coverage: "Same actual mission cohort/period;whole-life asset interfaces disclosed"
      site_scope: "Only actual attributable mission/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual original records;scope/calibration;native-unit/source proof;uncertainty and closure"
    - protocol_id: cp_operation
      process_id: "charter_mission"
      flow_role: "diesel_supply;charging_ac;hydrogen_supply"
      record_type: "meter_stock_duty_ledger"
      raw_fields: "mission/vehicle/duty;fuel_grade/blend;composition/carbon_origin;whole_vs_component_representation;supplied;opening/closing;net_withdrawal;actual_burn;spill;recovery;transfers;gross_AC;losses;storage;regeneration;export;loaded_empty_wait_failed;all_users;provider_scope;hydrogen_grade_phase_pressure;H2_stock_supply_reaction_leak_vent;external_DC_swap;actual_other_fuels_hybrid_duties"
      collection_method: "Use reconciled meters, fuel stocks and dispatch/auxiliary records. Keep whole-blend and replacement-component input representations exclusive, and supply/net withdrawal/burn/spill/recovery distinct. Direct emissions use evidenced actual burning/source activity. Assign actual compatible supply/energy quantities to missions with causal all-user drivers; divide by N once. For actual H2 or other alternative drives independently close native supply/storage/consumption/leak/vent/recovery and each phase/receiver; never infer a fuel product as its direct emission or water vapour as waste."
      unit: "kg;kWh;native volume;km;h"
      frequency: "each meter/stock/duty;full mission pool"
      temporal_coverage: "Same actual mission cohort/period;whole-life asset interfaces disclosed"
      site_scope: "Only actual attributable mission/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual original records;scope/calibration;native-unit/source proof;uncertainty and closure"
    - protocol_id: cp_support
      process_id: "charter_mission"
      flow_role: "support_ac;tap_water;detergent"
      record_type: "support_provider_and_procurement"
      raw_fields: "mission/task;supplied_function;driver_rest/overnight;food/water/safety/accessibility;native_provider_unit;quantity;actual_scope;ingredient_or_provider_coverage;electricity/water/materials;all_users;stock;fates;uncertainty"
      collection_method: "Inspect actual mission inclusions, work orders, supplier records and meters. Independently identify each actual meal,water,hotel,safety,crew or other support result and its native unit; a complete provider replaces its covered foreground constituents. Exclude only evidenced unrelated/separately defined functions. Dedicated work support is assessed; no generic human-food fuel factor. Assign actual uncovered native quantities by causal drivers and divide by N once."
      unit: "native supplier units;kWh;m3;kg"
      frequency: "each actual task/provider/meter;aligned period"
      temporal_coverage: "Same actual mission cohort/period;whole-life asset interfaces disclosed"
      site_scope: "Only actual attributable mission/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual original records;scope/calibration;native-unit/source proof;uncertainty and closure"
    - protocol_id: cp_maintenance
      process_id: "charter_mission"
      flow_role: "r134a_supply;spent_oil;wash_wastewater;r134a_air"
      record_type: "maintenance_and_receiver_ledger"
      raw_fields: "vehicle/equipment;refrigerant_CAS;supplied_grade/purity;original_final_charge;additions_removals_recovery;source;net_mass;contents;washwater;stocks/reuse/evaporation;receiver;treatment_scope;actual_medium;provider_scope"
      collection_method: "Read actual monitored balances, work orders, stock and receiver records. Distinguish refrigerant supply,atmospheric leakage and recovered product/waste; independently quantify spent oil and washwater with actual composition/fates. Never derive waste from water/fresh-oil inputs or use an unexplained charge deficit as leakage. Attribute non-overlapping event quantities and divide by N once."
      unit: "kg;m3;actual native units"
      frequency: "each maintenance/release/transfer;pool closure"
      temporal_coverage: "Same actual mission cohort/period;whole-life asset interfaces disclosed"
      site_scope: "Only actual attributable mission/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual original records;scope/calibration;native-unit/source proof;uncertainty and closure"
    - protocol_id: cp_assets
      process_id: "charter_mission"
      flow_role: "diesel_coach;electric_coach;fuelcell_coach"
      record_type: "same_asset_lifetime_register"
      raw_fields: "asset/cohort;configuration;actual_delivered_count;manufacture_gate;original_battery/components;studied_compatible_duty;all_user_total_life_duty;other_charter/scheduled_uses;forecast_source;replacement;maintenance/retirement;provider_scope;uncertainty"
      collection_method: "Read actual supply/engineering/duty/retirement records. Match delivered quantity,studied duty and positive total lifetime duty to the same physical asset/cohort and all its users. Attributed manufacture=actual native delivered quantity times studied duty/total compatible lifetime duty; then /N. It covers manufacture only. Independently complete missing operation,replacement,maintenance,road/terminal/charger and retirement quantities; provider-covered phases replace matching same foreground data."
      unit: "Item(s);asset-native units;km;h"
      frequency: "whole physical life and period/cohort shares"
      temporal_coverage: "Same actual mission cohort/period;whole-life asset interfaces disclosed"
      site_scope: "Only actual attributable mission/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual original records;scope/calibration;native-unit/source proof;uncertainty and closure"
    - protocol_id: cp_emissions
      process_id: "charter_mission"
      flow_role: "co2_fossil;ch4_fossil;n2o;pm25"
      record_type: "species_source_medium_ledger"
      raw_fields: "mission/vehicle/source;fuel/auxiliary/reagent;technology/control;actual_burn/activity;factor_source_version;native_factor_basis;species_mass;fossil_biogenic;particle_size;air_water_soil_subcompartment;scope_overlap;uncertainty"
      collection_method: "Measure actual sources or use independently supported applicable species/technology/fuel/control/activity methods. Reconcile basis and actual source coverage; preserve known receiving specificity and justify unspecified air. Aggregate only non-overlapping compatible species masses and divide by N once; neither supplied fuel nor CO2-equivalent automatically establishes a species release."
      unit: "kg of each actual species"
      frequency: "actual event or justified monitoring/model period"
      temporal_coverage: "Same actual mission cohort/period;whole-life asset interfaces disclosed"
      site_scope: "Only actual attributable mission/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual original records;scope/calibration;native-unit/source proof;uncertainty and closure"
    - protocol_id: cp_provider
      process_id: "charter_mission"
      flow_role: "purchased_charter_mission"
      record_type: "provider_native_coverage_record"
      raw_fields: "provider_ID;matched_charter_mission_group_extent;native_unit_u;q_per_u;actual_demand_A_u;actual_conversion;covered_lifecycle_vehicle_period_cells;remaining_owner;all_user_share;normalization;uncertainty"
      collection_method: "Verify actual supplier function/native unit, group/itinerary/quality/duration/geography, real demand and complete covered-cell ledger. q_u*A_u*evidenced mission/all-user share/N once. Count only actual whole matching supplier mission; hour/day/leg/vehicle services need their own concrete identity and demand. Exact provider cells replace physical cells; only uncaptured responsibilities remain, and owned legs are not self-purchased. Actual country/segment/driver subcontracting must preserve original mission responsibility and exact native coveredcells; a segment provider is not renamed a whole completed charter mission."
      unit: "Item(s);actual verified native supplier units"
      frequency: "each actual mission;reconciled cohort"
      temporal_coverage: "Same actual mission cohort/period;whole-life asset interfaces disclosed"
      site_scope: "Only actual attributable mission/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual original records;scope/calibration;native-unit/source proof;uncertainty and closure"
    - protocol_id: cp_long_route
      process_id: "charter_mission"
      flow_role: "completed_long_distance_charter_mission"
      record_type: "operational_record"
      raw_fields: "original_actual_complete_route;country_segment_carrier_subcontractor;crossperiod_preparation;driver_rest_change_roles;loaded_empty_wait_borderdelay_recovery_failed;actual_cabin_sanitary_meal_drink_stay_guide_accessibility_HVAC;native_provider_unit_quantity_activity_covered_cells;actual_all_users;uncertainty"
      collection_method: "Collect original/actual agreed entire itinerary and each real country/operating/provider/driver/support responsibility, including preparation, rest/change, borderwait, failed/empty/recovery duties and all users across periods. Establish actual presence or evidenced non-use of each required included facility, meal/stay/consumable/support service; no universal equipment, legalresthour or purchasedlabour recipe. Actual perkm/hour/pkm/personnight/meal/native supplier q_u times compatible attributed actual A_u and supported share beforeN, exact coveredcells replace only identical foreground stages. Record each actual unrepresented support/material/asset/waste/species with unique row,oneexistingparent,direction/type,oneidentity/state,UUIDorunresolved,nativeproperty/unit/quantity/rawsource,sameparentCP,method/providercoveredcells/gate/receiver/uncertainty."
      unit: "actual native route/support/provider quantities"
      frequency: "each actual mission;reconciled cohort"
      temporal_coverage: "Same actual mission cohort/period;whole-life asset interfaces disclosed"
      site_scope: "Only actual attributable mission/provider/source cells;all users reconciled"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Actual original records;scope/calibration;native-unit/source proof;uncertainty and closure"
  calculation_rules:
    - id: normalize_missions
      applies_to: "all inventory rows"
      rule: "Attribute actual compatible native quantities to the functionally consistent mission cohort with evidenced direct/shared coverage,then divide by its positive completed-mission N once. Do not divide by passengers/occupancy or repeat final normalization."
      inputs:
        - cp_missions
        - cp_operation
        - cp_support
        - cp_maintenance
        - cp_assets
        - cp_emissions
      output: "native quantity per1Item(s) completed mission"
      source_ids: []
    - id: asset_equivalence
      applies_to: "diesel_coach;electric_coach"
      rule: "For each physical coach/component, actual delivered manufacture count times studied compatible duty / positive documented same-asset all-user lifetime duty gives attributed manufacture quantity; then /N completed missions. Include actual scheduled/charter/other asset users in the denominator. Keep manufacture, replacements, repair and retirement disjoint; no annual purchase/depreciation/hire money stands in for native physical demand."
      inputs:
        - cp_assets
        - cp_missions
      output: "native manufacture equivalents per reference"
      source_ids: []
    - id: party_distance
      applies_to: "charter_mission"
      rule: "Supplemental passenger-distance=sum actual persons on each segment times actual segment km. Actual party/vehicle/time records supplement the group-mission result and do not alter its Count reference."
      inputs:
        - cp_missions
        - cp_operation
      output: "supplemental passenger-distance and exposure"
      source_ids: []
    - id: native_provider_contribution
      applies_to: "purchased_charter_mission"
      rule: "Actual q_u per verified native u times real compatible A_u times supported mission/all-user share /N once; covered physical cells replace exact same foreground cells, not additive. Whole mission versus actual hours/day/vehicle/person-distance functions need verified dimensionally matching demand."
      inputs:
        - cp_provider
        - cp_missions
        - "actual covered-cell ledger"
      output: "exclusive provider contribution per reference flow"
      source_ids: []
    - id: whole_route_native_support
      applies_to: "charter_mission"
      rule: "Sum nonoverlapping real compatible native quantities over all actual mission members/countries/segments/providers and included preparatory/rest/empty/failed/support duties. Apply justified alluser shares and exact provider replacement beforepositiveN once; compatible perkm/hour/pkm/personnight/meal results first multiply actual corresponding activity. Already equivalent percompletedmission results not divided again. No mission output increment from internal stage/vehicle/driver changes."
      inputs:
        - cp_long_route
        - cp_missions
        - cp_provider
        - cp_support
      output: "complete attributable native quantity per declared reference flow"
      source_ids:
        - ghg-product-standard-2011
  data_quality_requirements:
    - id: mission_fulfilment
      applies_to: "completed_long_distance_charter_mission"
      requirement: "Require actual group mission/party,operator/organiser control,itinerary/return/stops,quality,duration,acceptance and positive completed N. Clarify charter versus scheduled person-leg,booking or renter-controlled availability using actual function,not timetable/payment alone. Unknown function or completion blocks production."
      evidence: "cp_missions"
    - id: actual_energy
      applies_to: "diesel_supply;charging_ac;support_ac"
      requirement: "Expand each actual fuel/formulation/phase, auxiliary heater, external AC/DC/swap or actual energy export with native identity/quantity and full gate/loss coverage. All actual qualifying bus/coach propulsion remains applicable; missing native data blocks completion, not scope. Whole mixture with composition/origin ledger OR replacing components, never both; net withdrawal is not combustion. For actual fuel-cell H2 retain purity/state/pressure, storage/compression/supply, reaction consumption, separate leaks/vents and real water vapour/liquid/receiver fates, not waste by default."
      evidence: "cp_operation"
    - id: actual_incidental_services
      applies_to: "support_ac;tap_water;detergent"
      requirement: "Identify every actual included meal/drinking product,driver overnight/rest facility,safety/accessibility,guide or other support at its real function/native output and provider boundary. Model actual included transport incidentals and separately define independent products; never delete an included component to fit the reference. Each supplier/ingredient/energy/waste coverage cell has one owner; missing identity/quantity/scope blocks completion."
      evidence: "cp_support"
    - id: actual_materials
      applies_to: "detergent;r134a_supply"
      requirement: "Every actual lubricant,cleaner/disinfectant,reagent concentration,other refrigerant,tyre,spare or independently supplied component needs its exact formulation/state/native quantity and independent atomic exchange. Existing examples prove neither occurrence nor generic material coverage; missing needed data blocks completion."
      evidence: "cp_support;cp_maintenance"
    - id: actual_assets
      applies_to: "diesel_coach;electric_coach"
      requirement: "Complete each actual configured coach,battery,road,depot,terminal,charger,safety/conditioning asset and its lifecycle components at native gates. Keep manufacture-only supply demand separate from operation,maintenance,replacement and retirement. Require positive same-asset all-user lifetime duty and uncertainty; missing phases or life evidence blocks complete use."
      evidence: "cp_assets"
    - id: actual_providers
      applies_to: "all inventory rows"
      requirement: "Every real subcontracted transport,vehicle/driver,hospitality,repair,digital support or treatment result needs an independently verified actual native exchange,quantity and coverage/replacement matrix. No freight,asset,person-distance or money UUID is forced into the group-mission Count reference. Unknown provider scope blocks completion."
      evidence: "cp_missions;cp_support;cp_assets"
    - id: actual_fates_species
      applies_to: "spent_oil;wash_wastewater;co2_fossil;ch4_fossil;n2o;pm25;r134a_air"
      requirement: "Expand every actual waste,retired whole asset/component,battery,sludge,filter,packaging,food residue,water fate,reused product,treatment service and every substance/particle/source/receiving subcompartment separately. Wholeobject/component,PM sizeclasses and factor-scope views must not overlap. Preserve wet/native/chemical bases and actual receiver responsibility; missing fate/species is not zero."
      evidence: "cp_maintenance;cp_emissions;cp_support;cp_assets"
    - id: atomic_completion
      applies_to: "all inventory rows"
      requirement: "Each actual added exchange carries unique row_id,one actual process parent,direction/type,concrete UUID or registered unresolved identity,native property/unit,amount,source/recipient gate and a valid same-parent protocol linked to its triggering requirement_id. Actual non-use/provider inclusion needs affirmative evidence; generic range absence neither waives quantities nor permits guessed values. Preserve chemical/formulation/wet-dry basis, raw source, exact lifecycle/provider covered cells, receiver/known subcompartment and uncertainty for each actual row."
      evidence: "all declared collection protocols"
    - id: actual_other_bus_coach_configurations
      applies_to: "charter_mission"
      requirement: "MANDATORY: actual diesel/biofuel, gas/liquid/other combustion, hybrid, BEV/fuel-cell and any other real qualifying bus/coach chassis/drive need independently defined native complete asset/initial components/tanks/stack/battery, external energy and auxiliary/reagent/control/safety/accessibility records. Collect all-user manufacture-use-maintenance-replacement-retirement and each actual species/waste/fate, not just the three assembly examples. A manufacturer medium/long-distance example neither proves qualifying charter use nor restricts functional applicability. No universal factor, lifetime or zero-direct/whole-life claim."
      evidence: "cp_operation;cp_assets;cp_support;cp_maintenance;cp_emissions"
    - id: original_scope_and_acceptance
      applies_to: "completed_long_distance_charter_mission"
      requirement: "MANDATORY actual64223betweenurban/suburbanareas OR long-distance charter function, original/timestamped amended agreement, group/vehicles/driver responsibility, actual geography/itinerary/destinations/stops/return/duration/class/quality/acceptance. No non-contiguouscity/km threshold. Define true independent missions versus orders/fleetduties/driverchanges/internallegs; keep partial/failed/cancelled/no-show burdens and independently accepted amendedoutputs without afterfactshrink, feesascompletion or automaticcarhireavailability."
      evidence: "cp_missions;actual contract and accepted delivery history"
    - id: complete_long_route_native_support
      applies_to: "charter_mission"
      requirement: "Mandatory actual complete route/countrysegment/provider/driver ownership, crossperiod/empty/failed/preparation/rest/change/wait/border/recovery and alluser nativeclosure. Actual included food/drink/sanitary/cabin/accommodation/guide/accessibility/terminal support cannot be deleted or assumed universal. Separate internal operatingpersonnel, genuinely transported persons and actual purchased native services. Every actual unrepresented identity/provider/asset/replacement/retirement/waste/species/receiver gets row-addressable sameparentCP/nativequantity/source/coveredcell/gate/uncertainty; missing incomplete,notzero."
      evidence: "cp_long_route;cp_missions;cp_provider;cp_support;cp_operation;cp_assets;cp_maintenance;cp_emissions"
validation_rules:
  - rule_id: mission_reference
    applies_to: "charter_mission"
    rule: "One completed actual accountable group mission is1Item(s). Verify itinerary/party/return/stops/duration/quality and N>0; reject passengers,seats,coaches,invoices,hours or capacity as automatic completed-mission counts."
    source_ids: []
  - rule_id: period_and_failure
    applies_to: "charter_mission"
    rule: "Actual numerator,completed mission cohort,party/vehicle exposure and causal all-user drivers align. Retain empty,waiting,recovery,failed/partial and zero-output pools; N=0 has no finite mission intensity and does not delete burden."
    source_ids: []
  - rule_id: provider_and_assets
    applies_to: "charter_mission"
    rule: "Every phase has one owner; validate native provider functions and manufacture-only supply gates,positive same-asset lifetime ratios,initial/replacement battery and whole/component fates. A full-life provider replaces exact included local fuel/emission/support/capital quantities."
    source_ids: []
  - rule_id: physical_closure
    applies_to: "charter_mission"
    rule: "Check wholeblend/component exclusivity,supply/withdrawal/burn/spill/recovery,charger/depot/internal energy,gross exports,refrigerant balance,actual water/waste fates and particle overlaps. Direct species mass and receiving scope need actual proof; no default density,occupancy,factor,meal rate or life."
    source_ids: []
  - rule_id: included_functions
    applies_to: "charter_mission"
    rule: "Validate actual mission-incidental food/water,safety,driver rest/hotel support and separate products at their declared function. Included transport obligations cannot be dropped,capacity is not occupancy,and a sightseeing/tour-package or renter-controlled availability function cannot be relabelled charter mission."
    source_ids: []
  - rule_id: atomic_and_profile
    applies_to: "charter_mission"
    rule: "Each protocol process_id equals one existing processInventory.id and each card protocol exists at its own parent. Match bilingual rule/card/native/source fields and current projection fingerprints. Resolve actual identities/quantities/coverage/fates before downstream use; checker pass is not external verification or publication readiness."
    source_ids: []
  - rule_id: actual_charter_extent_longroute
    applies_to: "charter_mission"
    rule: "Reject non-contiguouscity/km/national cutoff or absolute timetable/billing/multidestination tests, reduced original failure scope, person/vehicle/order counting, missing entirelongroute/support/nativeprovider/alluser lifecycle, invented universal facilities/resthours or automaticavailability success. Verify actual64223scope and chronological completedwholemission responsibility, fullatomic expansion and bilingual projected rules."
    source_ids:
      - unsd-coach-charter-2025
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset only after all mandatory identity,quantity,coverage,fate and functional review requirements are complete"
  allowed_use: "Actual completed qualifying64223whole bus/coach groupcharter mission betweenurban/suburbanareas OR overlongdistances with actual original/chronological extent/group/vehicles/itinerary/duration/quality/acceptance and complete nativepropulsion/provider/alluser lifecycle/support"
  excluded_use: "Generic passenger-leg/pkm/hour/fleet/order output;client-full-control rental,sightseeing or scheduled service relabelled charter;automatic car-availability completion;failed scope shrunk to success;incomplete actual lifecycle"
  required_metadata: "actual_64223_urban_suburban_connection_or_longdistance_charter_function;actual_geography_extent_no_universal_km_or_noncontiguous_city_gate;operator_accountability_vs_full_client_control;original_contract_group_itinerary_destinations_stops_return;actual_vehicle_driver_passenger_roles_and_mission_membership;actual_duration_class_quality_accessibility;chronological_amendments_promised_delivered_acceptance;partial_failed_cancelled_no_show_standby_obligations;whole_route_country_segment_provider_crossperiod_responsibility;actual_driver_rest_change_wait_border_preparation_support;all_actual_propulsion_native_supply_stock_species_receiver;native_provider_function_demand_exact_covered_cells;same_asset_positive_all_user_useful_duty;comparable_completed_mission_N_period_and_uncertainty"
  required_quality_disclosure: "Actual mission/party/completion uncertainty;native identities/provider coverage;empty/failed pools;asset life forecasts;included functions;source/medium/fate;allocation and limitations"
  update_trigger: "Changed actual64223function/geography/control/contract/itinerary/duration/acceptance/missionmembers/countries/providers/driverrest_support/nativepropulsion/assetlife/chemicalfates evidence"
data_sources:
  - id: "unsd-coach-charter-2025"
    type: "official_guidance"
    reference: "UNSD,CPC3.0 Explanatory Notes,30June2025,printed/PDF pp360,362,64118/64223 charter and66011 exclusion. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Actual64223betweenurban/suburbanareas OR longdistancechauffeurhired bus/motorcoachcharter, typicalpredeterminedroute/timetable/generalbilling/frequentdestinations notabsolute; fullclientcontrolrental66011exceptcharter excluded. No noncontiguouscity/km/nationalcutoff, missionCount/native/alluser/lifecycleformula supplied."
  - id: "eu-occasional-service-2009"
    type: "official_guidance"
    reference: "Regulation(EC)1073/2009,as adopted21October2009,Articles2/5 official reproduction. https://www.legislation.gov.uk/eur/2009/1073/article/2/adopted?view=plain and https://www.legislation.gov.uk/eur/2009/1073/article/5/adopted?view=plain"
    used_for: "Dated EU regular/special-regular/occasional-group comparison;periodicity alone is not conclusive. No universal current legal,licence or CPC test,party-size or mission formula inferred."
  - id: "ipcc-road-combustion-2006"
    type: "official_guidance"
    reference: "IPCC,2006Guidelines,Vol2Ch3MobileCombustion,§3.2,pp3.10–3.16. https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_3_Ch3_Mobile_Combustion.pdf"
    used_for: "Fuel/activity/technology/control and reagent/carbon-origin distinctions only. No default road factor or national-inventory cut-off imported into lifecycle mission result."
  - id: "eea-electric-vehicles"
    type: "official_guidance"
    reference: "European Environment Agency,Electric vehicles,Overview. https://www.eea.europa.eu/en/topics/in-depth/electric-vehicles"
    used_for: "Qualitative production/battery and persistent road/tyre/brake-wear lifecycle context only. No passenger-car average,coach consumption,range,asset life or numerical benefit transferred."
  - id: "ghg-product-standard-2011"
    type: "standard"
    reference: "WRI/WBCSD,Product Life Cycle Accounting and Reporting Standard,2011,chapters6–9. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Functional/boundary/data disclosure and subdivision/justified physical allocation hierarchy. Expanded capital,mission delivery and duty equations are explicit PCR methods,not universal factors or capital mandates claimed from this standard."
  - id: "irizar-fuelcell-coach-2026"
    type: "official_guidance"
    reference: "Irizar,La nueva generación del Irizar i6S Efficient H2 FCEV ya está aquí,29May2026. https://www.irizar.com/media-center/noticias/nueva-generacion-irizar-i6s-efficient-h2-fcev-ya-esta-aqui"
    used_for: "Actual hydrogen fuel-cell/electric motor-coach technology example only; described medium/long-distance design does not prove qualifying charter use. No range,refill time,capacity,vehicle life,zero-lifecycle/comparative benefit or universal gas phase/grade adopted."
