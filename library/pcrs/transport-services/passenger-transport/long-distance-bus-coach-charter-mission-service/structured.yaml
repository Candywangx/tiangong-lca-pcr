system_boundary:
  rules:
    - rule_id: mission_boundary
      applies_to: "charter_mission"
      rule: "Declare one accepted mission delivery gate including its actual one-way/return itinerary and multi-stop waiting. Retain group, passengers, vehicles and operator/organiser roles without equating them. Actual empty, interrupted and failed operations carry attributable burden without completed-mission outputs."
      source_ids: []
    - rule_id: provider_ownership
      applies_to: "charter_mission"
      rule: "Assign every actual activity, provider, burden stage, vehicle and period one owner. Complete subcontracted transport or a purchased vehicle-with-driver/native-hour input is allowed only at its real supplied function/gate and coverage; it is not automatically the final charter mission. Adopt a complete provider result or the exact covered foreground constituents, never both. Missing phases remain mandatory."
      source_ids:
        - ghg-product-standard-2011
    - rule_id: actual_incidentals
      applies_to: "charter_mission"
      rule: "Determine actual included driver rest/accommodation, safety/accessibility support, onboard water/food and other incidental services from the agreed mission. Each actual supplier result needs native quantity and scope. A complete meal/hotel/support provider replaces covered energy/material/waste constituents; independently expanded ingredients/services cannot repeat it. Ordinary human subsistence is a disclosed boundary convention; actual dedicated work support still requires assessment, not a generic labour-energy factor."
      source_ids: []
    - rule_id: fuel_and_energy
      applies_to: "charter_mission"
      rule: "Use one verified whole fuel-blend input with composition/carbon-origin ledger OR actual physical component supplies replacing matching blend coverage, never both. Supplied, net-withdrawn, burned, spilled, recovered and transferred fuel are distinct; supply/withdrawal is not automatic combustion activity. Internal battery discharge/regeneration is not another external supply. Actual exports need their own verified identity/gate/quantity; no second avoided-energy credit."
      source_ids:
        - ipcc-road-combustion-2006
    - rule_id: manufacture_scope
      applies_to: "charter_mission"
      rule: "Delivered coach manufacture cards carry only verified manufacture/supply coverage. Same-asset complete-life duty allocates actual delivered native quantity and never creates a full-life transport identity. Independently complete uncovered operation, initial/replacement battery, maintenance, road/terminal/charger assets and retirement; provider-included fuel/direct emissions or phases replace the matching local quantities."
      source_ids: []
    - rule_id: actual_fates
      applies_to: "charter_mission"
      rule: "Independently identify collected wastewater, evaporation, spent oil, worn/retired materials, recovered products, each actual species and receiving medium/subcompartment, and actual treatment responsibility. Unknown stock loss or unserved passengers do not create an emission or waste by residual. Preserve actual biogenic/fossil source and particle-size overlap rules."
      source_ids: []
    - rule_id: charter_contract_fulfilment
      applies_to: "charter_mission"
      rule: "Apply actual64223charter betweenurban/suburbanareas OR overlongdistances, actual operator/client control and accepted wholemission responsibility. No non-contiguouscity/km/internationalhardgate, and typicalroute/timetable/generalbilling/frequentmultidestinations notabsolute. Preserve original and timestamped amended scope and fleet/driver continuity; no after-failure shrink or automatic hireavailability completion."
      source_ids:
        - unsd-coach-charter-2025
    - rule_id: actual_native_provider_scaling
      applies_to: "purchased_charter_mission"
      rule: "For q_u per actual verified provider-native unit u, apply real compatible demand A_u times supported mission/all-user share and /N once. Matching whole-mission Count provider result covers its true stages only; actual hour/day/vehicle/distance/other function has its own identity and measured demand, not a relabelled mission. Owned legs are internal, not extra purchased missions or final outputs."
      source_ids: []
    - rule_id: whole_route_support
      applies_to: "charter_mission"
      rule: "Retain the entire actually agreed route across all operating segments/countries/providers, driverrest/change, empty/reposition/return/recovery, preparation/wait/borderdelay/failed/zero-output support responsibilities. Actual included sanitary/cabin/meal/stay/guide/accessibility/HVAC/terminal support has real native quantities and coveredcells; not universal facilities/resthours/labour flows. Do not clip service at national inventories or duplicate outputs for carrier/vehicle/driver changes."
