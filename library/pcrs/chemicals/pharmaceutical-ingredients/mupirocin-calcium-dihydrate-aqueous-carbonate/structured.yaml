  - rule_id: a_returns
    applies_to: "dispatch"
    rule: "Track each returned physical quantity against its original acceptance. For previously counted returned deliveries, reverse/restatement of the original Q and carried burden is required before subsequent acceptance; reinspection, repacking and rework add real burdens but create no second production or duplicated delivery. Disclose the cross-period correction."
    source_ids: []
  - rule_id: a_no_credit
    applies_to: "mother_liquor, offspec_salt, warehouse_api_discard"
    rule: "Recycled mother liquor and reworked salt carry existing burdens internally. No avoided-production credit for recovery, no co-product status for rejected drug, and no assumed treatment removal. Any genuinely saleable co-product requires separately verified identity, yield and disclosed allocation; CO2 venting is not such a product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_salt_records
      process_id: "salt"
      flow_role: "Precursors reaction separation"
      record_type: "supplier receipts and batch records"
      raw_fields: "lot; supplier; origin route; grade; received and consumed kg; assay; water; inventory change; reaction batch times; fresh and recycled water; electricity kWh; wet cake kg; whole mother liquor kg; species analysis; failed and zero-output runs"
      collection_method: "Owner: salt-conversion operator and procurement custodian. Collect calibrated weighings, meters and supplier records for the complete interval including cleaning and failures; retain whole purchased wet supply and constituent subledgers without duplicate purchases. Keep raw numerators and stock changes only."
      unit: "kg; kWh"
      frequency: "each receipt and batch"
      temporal_coverage: "complete reporting interval including failed runs"
      site_scope: "declared conversion site and provider chain"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; calibrations; CoA; batch ledger; supplier route coverage"
    - protocol_id: cp_finish_records
      process_id: "finish"
      flow_role: "Separation wash drying release"
      record_type: "batch and quality records"
      raw_fields: "wet cake receipt kg; wash and rinse kg; effluent kg; electricity kWh; steam kg and enthalpies; condensate; rejected kg; recovered kg; R kg; water result and method; crystallinity; particle form; release signature"
      collection_method: "Owner: isolation operator, utilities engineer and quality-release owner. Reconcile cake transfers, actual wash/drying/cleaning and tested release mass R for the complete interval. Keep raw numerator records, failure/rework history and inherited WIP burdens; perform no division by Q at collection."
      unit: "kg; kWh; MJ"
      frequency: "each batch and release"
      temporal_coverage: "same full interval with traceable WIP carry"
      site_scope: "declared isolation and drying site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "transfer tickets; meters; CoA; hydrate identity and quality decision"
    - protocol_id: cp_dispatch_records
      process_id: "dispatch"
      flow_role: "Finished stocks packing and Q"
      record_type: "warehouse and dispatch records"
      raw_fields: "opening and closing finished kg and carried burden vector; R receipts; net dispatch kg; carrier signature; rejected delivery kg; returned/reaccepted quantity with original lot id; packaged tare; each packaging material kg; electricity kWh; residence time; destruction mass and treatment"
      collection_method: "Owner: warehouse/dispatch custodian with quality owner. Weigh net product independently of packaging, match signed accepted handovers and returns by unique lot/quantity and reconcile opening + new release + returns = dispatch + destruction + closing with internal rework movements. Collect raw packing, storage, handling and dispatch loads and stock burden vectors only; unresolved older delivery corrections require restatement before Q."
      unit: "kg; kWh; hours"
      frequency: "each movement plus period close"
      temporal_coverage: "same reporting interval plus opening-stock provenance"
      site_scope: "declared factory handover and actual warehouse"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock cards; tare records; signed handovers; returns trail; packaging BOM"
    - protocol_id: cp_species_records
      process_id: "salt"
      flow_role: "Mass elements water and species"
      record_type: "analytical and vent records"
      raw_fields: "separate whole-stream masses; C H O Ca analyses; precursor and carbonate assay; reacted extent; unreacted carbonate; dissolved inorganic carbon; aqueous API; gas flow and duration or integrated volume; pressure temperature water basis; CO2 concentration; water vapour; condensate; structural and free water"
      collection_method: "Owner: analytical laboratory and environmental engineer. Independently measure stream masses, aqueous/gas species and reaction extent; use formula stoichiometry as a bounded consistency relation, not a fitted outlet. Retain raw integrated volumes without a second time multiplier and raw rate logs where integration is needed. Do not infer water or API species from COD."
      unit: "kg; mol; m3; hours"
      frequency: "each batch and representative verified vent tests"
      temporal_coverage: "same full interval and analytical coverage"
      site_scope: "reaction vents drying outlet and actual treatment interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "lab methods and detection limits; speciation; calibrated meters; uncertainty"
    - protocol_id: cp_stock_burdens
      process_id: "dispatch"
      flow_role: "WIP and finished burden carry"
      record_type: "physical stock and inherited inventory ledger"
      raw_fields: "opening and closing WIP by stage; whole mass and component masses; opening and closing finished salt; inherited exchange numerator vectors; matched interval inputs; failed run burdens; internal transfer ids; return corrections; documented FIFO or weighted-average rule"
      collection_method: "Owner: production accountant with all process owners. Reconcile physical stocks and original unnormalized burden vectors by the same product/route/form cohort and declared FIFO or weighted average. Closing WIP and finished stock retain their attributable burdens for the next interval. Retain real rework and loss burdens; no unrecorded stock assumed zero."
      unit: "kg; original exchange units"
      frequency: "each transfer and period closure"
      temporal_coverage: "opening provenance plus complete current interval"
      site_scope: "all included sites and internal interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock counts; inherited vectors; reconciled internal edges; correction ledger"
  calculation_rules:
    - id: raw_conversions
      applies_to: "all inventory rows"
      rule: "Convert raw records to the declared numerator units first: MJ = 3.6 × kWh; mass = integrated volume × independently justified density at stated conditions. Rate × duration is used only for a rate record. Retain originals and uncertainties."
      inputs:
        - cp_salt_records
        - cp_finish_records
        - cp_dispatch_records
        - cp_species_records
      output: "converted raw exchange numerators"
      source_ids: []
    - id: assigned_numerators
      applies_to: "all inventory rows"
      rule: "For each exchange i, A_i = opening inherited numerator + attributable current-period raw numerator - closing inherited numerator - independently documented transfers to other cohorts. Eliminate matched internal cake/salt edges and repeated inherited transfers once, retaining their original external burdens. Include all assigned failures, losses, cleaning, rework and stock services. Withhold results when opening or closing burden vectors are unknown."
      inputs:
        - cp_stock_burdens
        - cp_salt_records
        - cp_finish_records
        - cp_dispatch_records
      output: "A_i in original numerator units"
      source_ids: []
    - id: normalize_delivery
      applies_to: "all inventory rows"
      rule: "v_i = A_i / Q exactly once after raw conversions and stock assignment; Q is unique positive accepted net kg actually delivered at the declared handover, corrected for returns and earlier counted deliveries. Zero Q produces no per-kg inventory. Collection, cards and aggregation labels describe this same report operation and never divide it again."
      inputs:
        - A_i
        - Q
        - cp_stock_burdens
        - cp_dispatch_records
      output: "one inventory per 1 kg reference flow"
      source_ids: []
    - id: reaction_water_check
      applies_to: "carbonate_co2, water_vapour"
      rule: "Let HA denote C26H44O9 and A its singly deprotonated anion. Formula-derived check: 2 HA + CaCO3 + H2O → CaA2·2H2O + CO2. Neutralization generates one mole H2O per mole reacted carbonate and dihydrate formation binds two: net one mole water consumed for this ideal pathway. Actual extent, excess carbonate, impurities, dissolved species, free-water evaporation and hydrolysis/degradation require independent records; this equation determines no purchased feed rate, reaction yield or emitted gas amount."
      inputs:
        - cp_species_records
        - cp_salt_records
        - cp_finish_records
      output: "independent species and water consistency finding"
      source_ids:
        - pliva-2009-carbonate-route
        - pmda-jpxvii-mupirocin
  data_quality_requirements:
    - id: q_identity
      applies_to: "reference_product"
      requirement: "Reference native limitations: MUPIROCIN CALCIUM / 莫匹罗星钙; CAS 115074-43-6; Product flow; production mix, at plant; route/grade/form name components absent; geography/locationOfSupply absent; one reference property Mass only, coefficient 1, with kg reference unit. The native comments identify the calcium salt, Pseudomonas fluorescens origin, protein-synthesis inhibition and antibiotic role, but the English fusidic-acid-derivative statement conflicts with the Chinese crotonic-acid-derivative description and the independent monograph. Do not use that English chemical-family assertion as route or identity evidence. CAS, calcium-salt name and organism agree with the independent dihydrate identity; no fixed contrary CAS, manufacturing route or grade is adopted. Native identity is not a provider, quantity, approved grade, particle size or specific geographic inventory."
      evidence: "Exact native record plus independent monograph; specification and provider declaration"
    - id: q_water
      applies_to: "reaction_water, wash_water"
      requirement: "Water native limitations: Deionised water / 去离子水; CAS 7732-18-5; Product flow; production mix, at plant; ion exchange or reverse osmosis, pure substance; no extra form/grade component and no supply geography. Its comment also mentions distillation, production/consumption mixes and plant/consumer supply generically and sets no compliance standard. Apply the narrower name route only after provider verification; neither the UUID nor that comment establishes sterile or pharmacopoeial water, a universal density or actual supplier technology. One Mass property with coefficient 1 is available; no density property exists."
      evidence: "Native direct record, actual treatment train and water test"
    - id: q_stocks
      applies_to: "all inventory rows"
      requirement: "Require complete matched physical and burden ledgers, including opening/closing WIP and finished goods, failed batches, zero output, rework, losses and returns. No negative hidden adjustment or stock-free assumption."
      evidence: "stock_burdens and signed period reconciliation"
    - id: q_species
      applies_to: "salt, finish"
      requirement: "Retain independent C/H/O/Ca and whole-mass balances alongside identified species and structural/free-water balance. Never use COD, a generic neutralization-water template, or simultaneous residual fitting to invent reaction water or an outlet."
      evidence: "species_records; methods; uncertainty and unexplained residual"
    - id: q_case
      applies_to: "all processes"
      requirement: "The patent scale case establishes a real route and unit operations, not default yield, consumption, reaction time, vacuum, grade or water ratio. The JP XVII monograph is historical identity/assay-basis evidence, not evidence that every manufactured lot meets current approval. Require the actual approved specification and lot tests."
      evidence: "Original patent and monograph with lot-specific release evidence"
validation_rules:
  - rule_id: v_reference
    applies_to: "delivered_salt"
    rule: "Reject a reference based on pure free acid, anhydrous salt, medicinal formulation, activity, dose, gross drum mass, mere release R or unsent stock. Require the stated dihydrate physical identity, specification and signed corrected positive Q."
    source_ids:
      - pmda-jpxvii-mupirocin
  - rule_id: v_inventory
    applies_to: "all inventory rows"
    rule: "Verify atomic exchanges, complete raw-period and stock-burden coverage, internal elimination, one normalization, actual treatment, phase-specific emissions and independent species/water evidence. Any unknown balance, unmatched transfer or absent inherited burden remains an explicit data gap."
    source_ids: []
  - rule_id: v_native
    applies_to: "reference_product, reaction_water, wash_water"
    rule: "Recheck native name components, CAS, route, grade, geography, Product medium and all exact property/unit references before provider use. Retain the disclosed comment contradiction and water limitations. Ordinary unresolved auxiliary UUIDs require future identity/provider verification and are not zero amounts or waived exchanges."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Ingredient supply for the same physical salt and route at the declared factory handover."
  allowed_use: "Cradle-to-dispatch inventory with complete precursor backgrounds and disclosed stocks, specifications, geography and service scope."
  excluded_use: "Clinical equivalence, therapeutic comparison, free-acid substitution, full cream inventory, unverified alternative route, or an approval claim."
  required_metadata: "CAS and formula; dihydrate crystallinity and particle form; as-supplied assay and assay basis; structural versus free water and impurities; actual route and starting-material origin; actual site geography and suppliers; complete reporting interval and cohort; signed net delivery Q and unique lot/return history; release R and finished-stock reconciliation; WIP and finished-stock opening/closing carried burdens; actual packaging and storage/dispatch boundary"
  required_quality_disclosure: "Inventory gaps, whole input composition, all native restrictions in q_identity and q_water, independent reaction-water evidence, period stock/burden attribution, provider compatibility, treatment endpoints, uncertainties and any return restatement."
  update_trigger: "Change in molecule/salt/hydrate, route, grade, provider geography, delivery gate, stock accounting, analytical method or material operating conditions."
