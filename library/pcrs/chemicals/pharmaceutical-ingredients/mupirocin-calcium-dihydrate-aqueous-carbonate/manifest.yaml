  native_identity_debt:
    - "Native mupirocin-calcium English generalComment incorrectly calls mupirocin a fusidic-acid derivative; Chinese describes a crotonic-acid derivative. Independent PMDA monograph confirms CAS, formula, calcium dihydrate and organism. The erroneous English chemical-family assertion is excluded as scientific evidence and retained in both languages under q_identity."
    - "Generic reference identity has no supply geography, declared grade, particle form or detailed manufacturing route; actual specifications and precursor background remain mandatory."
    - "Water identity is ion-exchange or reverse-osmosis pure water at plant with no supply geography or pharmacopoeial standard; comment is broader than name. All provider restrictions remain in q_water."
  limitations:
    - "Only heterogeneous water-only carbonate conversion of fermentation-derived free acid is covered. Patent operating quantities and conditions are not defaults or factory records."
