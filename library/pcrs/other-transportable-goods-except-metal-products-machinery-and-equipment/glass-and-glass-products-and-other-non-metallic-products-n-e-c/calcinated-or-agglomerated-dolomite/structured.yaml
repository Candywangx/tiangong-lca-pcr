  data_quality_requirements:
    - id: dq_terminal
      applies_to: "all datasets"
      requirement: "Confirm actual dolostone feed, rotary-kiln route, fully calcined unhydrated non-sintered terminal and independent first-release QC/weighing. Missing core product identity, unsupported route or unknown Q is an unresolved hold, regardless of engineering check success. No claim of complete CPC37450 coverage."
      evidence: "feed/kiln logs; phase assays; first-release weighing and specification"
    - id: dq_native
      applies_to: "all inventory rows"
      requirement: "Recheck complete native names, synonyms/comments, CAS, form, grade, route, geography, compartment, type and all properties against the actual exchange; use exact reference property and unit-group chain, not latest or a secondary-factor guess. Keep incompatible candidates rejected. Unbound auxiliaries require specific matching before concrete dataset use; unknown site amounts are not fabricated or scientific approval."
      evidence: "complete native identity/exact property-unit chain; supplier SDS/actual state"
    - id: dq_balance
      applies_to: "all physical gates"
      requirement: "Check manufacturing subgates, separate FG-service gates and the combined physical gate; cancel internal transfers without losing source vectors. Independently close total wet mass and relevant Ca/Mg/C/O/H/S/N elements, raw and residual carbonate phases, free/structural/reaction water and actual gas molecules. LOI is not free water; oxide equivalents are not free CaO/MgO; no one residual fits two unknowns. Missing independent phase/species/reaction-water evidence remains unresolved."
      evidence: "independent phase/molecule evidence; elemental/wet mass closures; calibrated uncertainty"
    - id: dq_temporal
      applies_to: "all inventory rows"
      requirement: "Use the same manufacturing period and separately observed service horizon; no fabricated future coverage, all Q0 burden retained."
      evidence: "complete event ledger; original cohort history; observed horizon"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "all datasets"
    rule: "Confirm actual dolostone feed, rotary-kiln route, fully calcined unhydrated non-sintered terminal and independent first-release QC/weighing. Missing core product identity, unsupported route or unknown Q is an unresolved hold, regardless of engineering check success. No claim of complete CPC37450 coverage."
    source_ids:
      - jrc-clm-bref-2013
      - mpa-making-dolime
  - rule_id: validate_closure
    applies_to: "all inventory rows"
    rule: "Check manufacturing subgates, separate FG-service gates and the combined physical gate; cancel internal transfers without losing source vectors. Independently close total wet mass and relevant Ca/Mg/C/O/H/S/N elements, raw and residual carbonate phases, free/structural/reaction water and actual gas molecules. LOI is not free water; oxide equivalents are not free CaO/MgO; no one residual fits two unknowns. Missing independent phase/species/reaction-water evidence remains unresolved."
    source_ids:
      - jrc-clm-bref-2013
      - jrc-ilcd-2010
  - rule_id: validate_normalization
    applies_to: "all inventory rows"
    rule: "Verify raw collection has no Q division; raw conversion, stock/cohort reconciliation and actual allocation precede the single calc_reference division. Q=0 retains all real burdens without unit results. Confirm complete service history and packaging/asset gross ledgers, including actual X water/material ingress and wet closing stock together."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_native
    applies_to: "all UUID-bearing rows"
    rule: "Recheck complete native names, synonyms/comments, CAS, form, grade, route, geography, compartment, type and all properties against the actual exchange; use exact reference property and unit-group chain, not latest or a secondary-factor guess. Keep incompatible candidates rejected. Unbound auxiliaries require specific matching before concrete dataset use; unknown site amounts are not fabricated or scientific approval."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Downstream modelling of compatible unhydrated dolime supply, preserving actual grade/boundary"
  allowed_use: "Attributional inventory for the applicable route/terminal and actual observed services; disclose provider completeness"
  excluded_use: "Whole CPC37450 coverage, shaft kiln, half-burnt/sintered/hydrated products, bricks, default carbonation credit, scientific approval or complete future-life claim"
  required_metadata: "actual site and reporting period; carbonate feed origin and upstream preparation/provider; rotary kiln and actual preheater/cooler configuration; fully calcined unhydrated non-sintered Ca-Mg oxide product; measured Ca/Mg phase and residual carbonate/free-water assays; actual impurity and thermal/reactivity grade; particle size and acceptance specification; calibrated whole bare product net mass; first quality-release Q and unique cohort; full failed/startstop/idle/cleanup records; opening/closing physical stocks and per-exchange inherited vectors; separate observed FG-service horizon and original cohort Q_o; actual fuels and calorific basis; gas wet/dry state and species source; water phases and receiving medium; supplier-included packaging upstream owner and six gross legs; assets and repair material/fluid history; allocation and provider coverage; native identity restrictions Separate grossphysicalV from provider/burden vectors; article/component handoffs and nonadditive actualoutlet/source-W basis; ordinary storagehandlinghumidity; allactual unauthorized/failedwork; thermalcarriermass/heat oneowner."
  required_quality_disclosure: "Actual quantities, completeness, uncertainty, native restrictions, unbound auxiliaries, provider gaps, horizons and unresolved core relationships"
  update_trigger: "Changes in feed phases, kiln route, terminal specification, fuel, geography/voltage, provider, controls, allocation or newly observed service"
