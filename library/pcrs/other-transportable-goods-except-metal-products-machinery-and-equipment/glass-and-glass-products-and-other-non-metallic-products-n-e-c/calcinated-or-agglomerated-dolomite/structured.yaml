          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_terminal | all datasets | Confirm actual dolostone feed, rotary-kiln route, fully calcined unhydrated non-sintered terminal and independent first-release QC/weighing. Missing core product identity, unsupported route or unknown Q is an unresolved hold, regardless of engineering check success. No claim of complete CPC37450 coverage. | `jrc-clm-bref-2013`; `mpa-making-dolime` |\n| validate_closure | all inventory rows | Check manufacturing subgates, separate FG-service gates and the combined physical gate; cancel internal transfers without losing source vectors. Independently close total wet mass and relevant Ca/Mg/C/O/H/S/N elements, raw and residual carbonate phases, free/structural/reaction water and actual gas molecules. LOI is not free water; oxide equivalents are not free CaO/MgO; no one residual fits two unknowns. Missing independent phase/species/reaction-water evidence remains unresolved. | `jrc-clm-bref-2013`; `jrc-ilcd-2010` |\n| validate_normalization | all inventory rows | Verify raw collection has no Q division; raw conversion, stock/cohort reconciliation and actual allocation precede the single calc_reference division. Q=0 retains all real burdens without unit results. Confirm complete service history and packaging/asset gross ledgers, including actual X water/material ingress and wet closing stock together. | `jrc-ilcd-2010` |\n| validate_native | all UUID-bearing rows | Recheck complete native names, synonyms/comments, CAS, form, grade, route, geography, compartment, type and all properties against the actual exchange; use exact reference property and unit-group chain, not latest or a secondary-factor guess. Keep incompatible candidates rejected. Unbound auxiliaries require specific matching before concrete dataset use; unknown site amounts are not fabricated or scientific approval. | `jrc-ilcd-2010` |\n\n"
