system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Begin with real supplied carbonate dolostone and its complete upstream quarry/preparation/transport burden. Include actual receipt, onsite sizing/washing, fuel preparation, preheating, rotary-kiln decarbonation, direct-air cooling, screening, first bare-product testing/release, pollution controls and attributable assets/repairs. The bounded technical synthesis is supported by BREF plus MPA, not a claim of one measured factory or SKU. No universal temperature, time, purity, density, fuel, energy, yield, reaction factor or product life is prescribed."
      source_ids:
        - jrc-clm-bref-2013
        - mpa-making-dolime
    - rule_id: boundary_exclusions
      applies_to: "product"
      rule: "Exclude raw glass-batch dolomite, raw carbonate mineral supply as final output, half-burnt CaCO3/MgO, sintered/dead-burnt/double-pass densification, binder agglomeration, purchased pure-oxide blending, intentional hydration/slaking, mortar formulation and refractory-brick shaping. BREF permits shaft as well as rotary kilns; MPA rotary/solid-fuel language is regional context, not proof that shaft manufacture is impossible. These other states/routes require their own applicability assessment."
      source_ids:
        - jrc-clm-bref-2013
        - mpa-making-dolime
    - rule_id: boundary_first_release
      applies_to: "all inventory rows"
      rule: "Q is the independently weighed net as-received whole bare mass of unique newly first-quality-released dolime lots in kg. Exclude removable packaging, failed material, opening already-released FG, repeat testing and delivery. Closing newly released FG is already in Q: never debit its manufacturing vector as B_close or add it again as output. Manufacturing B_close includes only unreleased raw/WIP and separately reconciled unallocated non-WIP installed stores. Preserve wet mass and measured free water/phase qualifiers without changing Q to an assumed dry/pure-oxide basis."
      source_ids:
        - jrc-clm-bref-2013
    - rule_id: boundary_history
      applies_to: "all inventory rows"
      rule: "Retain opening/closing physical raw, fuel, WIP, captured-return dust, FG, packaging and installed asset/fluid quantities and each exchange-specific inherited burden vector. All failed batches, zero-output periods, start/stop, idle, cleaning and actual rework carry their real burden. X_in/X_out records independently measured actual material/water ingress/egress not already represented by another incoming/outgoing FLOW term; deduplicate only against other actual flow terms, never opening/closing stocks, never delete actual external ingress because its material/water remains in closing stock. Full wet closing mass and that real input both remain. Ordinary rejected/sample/broken material, waste sale and offsite disposal do not remove manufacturing burden; only documented distinct cohort/function and valid allocation/transfer moves a vector once, never shrinks gross physical mass. Independently retain each opening/closing raw, WIP and unassigned non-WIP physical quantity and every inherited exchange vector. Declare gross receipt/pool entry versus already-stock-adjusted net consumption and every correction already included; never stock-correct the same net raw consumption twice."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: boundary_service
      applies_to: "service"
      rule: "Retain post-release storage, packing, handling and dispatch as a separate actual service account for each original cohort and observed horizon. Use its original Q_o, not current new production Q; carry previously executed services once. Track openingFG + Q transfer + actual physical returns + actual added material/water against closingFG + gross dispatch + real rejects/losses/species. Trace D_rev to original shipment history; do not assume R=D_rev. Manufacturer/specification permission, postwork tests and disposition are required for rework; hydration or damage is not automatically recoverable. Consolidate by cancelling internal Q and cohort/vector transfers. No service or reacceptance creates new production."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: boundary_additions
      applies_to: "all inventory rows"
      rule: "Cards are individual conditional exchanges, not a universal plant recipe. Before using a dataset add every other actual fuel, chemical formulation, repair part, water phase, captured/exported product, waste and molecular emission as a specific atomic row with proper identity/property/unit/provider and protocol. Unknown is not zero or not_applicable. Whole purchased formulations are procured once; assay, active fraction, carrier water, ash and component observations are subledgers. Actual in-house formulation separately records every purchase, energy and loss. Do not invent future steam, boilers, additives or credits."
      source_ids:
        - jrc-clm-bref-2013
        - jrc-ilcd-2010
    - rule_id: packaging_receipt_basis
      applies_to: "each packaging receipt"
      rule: "For every actual packaging article, classify each whole external receipt once. P is paid procurement, including paid packaging bundled with another supply without a separate invoice. I is all first non-purchased external ingress: standalone gifts, loans, rental or pool receipts and non-purchased supplier-attached packaging; supplier attachment is only an I subset. ER requires this same item or an auditable configuration-matched batch linked to this site's own prior outward record; custody or another party's use alone does not prove a return. P, I and ER are disjoint. Existing I cards and their raw protocols cover the same physical article for every such I origin; no new material, UUID or quantity is presumed. X_in/X_out remain disjoint material/water-change terms, never a substitute for whole-article receipt. Retain gross physical quantity, owner/custodian, payment or non-purchase basis, origin, prior-outward link where required, native state/unit and inherited manufacturing/service vector. Non-purchase is neither a new manufacture nor automatic zero burden: attribute actual used service and incremental transport/handling once to its proper original cohort and denominator, retaining unused service separately without a default lifetime or credit. This is the declared conserving foreground accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-2010
