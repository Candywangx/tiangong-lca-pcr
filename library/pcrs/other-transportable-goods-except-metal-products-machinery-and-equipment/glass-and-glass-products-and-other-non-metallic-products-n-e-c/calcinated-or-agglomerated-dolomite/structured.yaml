  calculation_rules:
    - id: calc_raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert undivided raw readings to each row native extensive unit once. kg stays kg; electrical kWh * 3.6 = MJ. Natural-gas HHV MJ and LHV are distinct; use actual composition/calorimetry for conversion and separately retain carrierMass, not a second fuel purchase. A count item equals Item(s) with factor1 but proves no kg/item; weigh actual complete configuration separately. Convert volume with independently measured density of that substance at actual temperature/pressure/composition. Integrate only true rates; an already integrated gas/liquid volume is not multiplied by time."
      inputs:
        - cp_raw_feed
        - cp_mfg_electricity
        - cp_natural_gas
        - cp_diesel
        - cp_water_makeup
        - cp_pulverized_coal
        - cp_cooling_water_in
        - cp_cooling_water_return
        - cp_air_n2_in
        - cp_air_o2_in
        - cp_air_ar_in
        - cp_air_h2o_in
