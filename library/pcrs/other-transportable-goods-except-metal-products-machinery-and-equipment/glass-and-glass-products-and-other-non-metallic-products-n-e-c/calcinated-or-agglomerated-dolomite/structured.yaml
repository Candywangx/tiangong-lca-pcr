      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_scope | all inventory rows | Use attributional modelling only for a declared allocation-requiring situation; first directly assign dedicated operations and perform real or virtual subdivision using actual branch meters, batch records and technically justified marginal changes. Preserve unallocated inventories and all denominator/physical ledgers. Industrial manufacture descriptions do not establish LCA allocation. | `jrc-ilcd-2010` |\n| allocation_causality | joint exchanges | For each remaining exchange identify the determining physical causal relation between changes in actual co-output functions and that input/emission, distinguishing product-related carbonate carbon from process-related firing/idle/service effects. Do not freely choose mass, energy or economic shares or use one common key for every exchange. Retain causal evidence and uncertainty. | `jrc-ilcd-2010` |\n| allocation_residual | residual joint exchanges | Only after documented failure to establish determining physical causality for that residual exchange use contemporaneous representative market values for actual quantities/states at the common-process gate. Remove downstream conditioning/packing/transport price effects to reconstruct that gate, retain sensitivity and missing-value uncertainty. No fixed ratios, automatic coproduct status, substitution/avoided-mineral/disposal/carbonation credits, or burden deduction merely because dust, rejects or scrap is sold. Genuine distinct product/function transfer needs specification, destination, quantity and justified allocation; gross physical masses always remain. | `jrc-ilcd-2010` |\n\n"
