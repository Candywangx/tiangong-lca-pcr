            expression: "Use this row once-calculated x_i result; collect undivided raw quantities under cp_pack_water_vapour."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_pack_water_vapour
              source_ids:
                - jrc-clm-bref-2013
                - jrc-ilcd-2010
            ranges: []
allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory rows"
    rule: "Use attributional modelling only for a declared allocation-requiring situation; first directly assign dedicated operations and perform real or virtual subdivision using actual branch meters, batch records and technically justified marginal changes. Preserve unallocated inventories and all denominator/physical ledgers. Industrial manufacture descriptions do not establish LCA allocation."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_causality
    applies_to: "joint exchanges"
    rule: "For each remaining exchange identify the determining physical causal relation between changes in actual co-output functions and that input/emission, distinguishing product-related carbonate carbon from process-related firing/idle/service effects. Do not freely choose mass, energy or economic shares or use one common key for every exchange. Retain causal evidence and uncertainty."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_residual
    applies_to: "residual joint exchanges"
    rule: "Only after documented failure to establish determining physical causality for that residual exchange use contemporaneous representative market values for actual quantities/states at the common-process gate. Remove downstream conditioning/packing/transport price effects to reconstruct that gate, retain sensitivity and missing-value uncertainty. No fixed ratios, automatic coproduct status, substitution/avoided-mineral/disposal/carbonation credits, or burden deduction merely because dust, rejects or scrap is sold. Genuine distinct product/function transfer needs specification, destination, quantity and justified allocation; gross physical masses always remain."
    source_ids:
      - jrc-ilcd-2010
