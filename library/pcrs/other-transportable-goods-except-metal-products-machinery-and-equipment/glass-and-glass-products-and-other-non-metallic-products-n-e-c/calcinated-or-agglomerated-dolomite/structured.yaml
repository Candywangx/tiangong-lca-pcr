      applies_to: "all inventory rows"
      rule: "Per exchange vector, opening inherited burden + actual assigned additions + genuine external original-cohort returns = closing unreleased raw/WIP burden + first-release cohort transfer + traced other destinations. Manufacturing B_close includes unreleased raw/WIP and separately reconciled unallocated non-WIP stores only; never subtract newly released closing FG already in Q. Assign real dedicated/subdivided/remaining shared exchanges by section7 before normalization. Preserve all failed/zero/startstop/idle/cleanup activity. X removes duplicates from other terms only; retain true ingress even if all remains in full wet closing stock. Use actual additions on the gross current pool basis before these same stock corrections; reconstruct a compatible gross pool from independent receipts/stocks/transfers when the source is already net consumed. X is actual independently measured disjoint ingress/egress, deduplicated only against other incoming/outgoing flow terms, never against stocks; whole wet receipts and outflows already containing water/material count those components once without duplicate X. For custody-only gross physical views, including actual FG/package/asset/part acquisition, removal or return and real external cooling/thermal carrier supply or Product condensate/hot-water return, A_i is the full independently measured specific gross leg V in its true native unit/state. This overrides burden-stock assignment for that view: never B_open+U-B_close, inherited burden, net consumption or economic/service fraction. Apply the same sole Q or original Q_o over observed H quotient once; retain separate actual supplier/operation/treatment/service vectors with one owner. Carrier kg/state/T/P/enthalpy and heat MJ are distinct dimensions of one actual agreed provider, never two purchases. Actual return/movement alone is no credit or extra water/heat purchase; only matched internal circulation cancels."
