      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual carbonate dolostone feed with independent upstream quarry/preparation and supply burden |\n| starting_condition_role | Supplied raw feed, not purchased finished dolime followed only by packaging |\n| product_classification_scope | Fully calcined unhydrated non-sintered rotary-kiln subset of broader CPC37450 |\n| recursive_input_rule | A same-category purchase needs an independent provider and cannot replace this raw-to-terminal manufacture; internal dust return cancels with inherited vectors retained. |\n| upstream_dataset_requirement | Feed, whole fuel, electricity, water, actual auxiliaries, assets and waste management each need one applicable upstream burden and disclosed gaps. |\n| disclosure | actual site and reporting period; carbonate feed origin and upstream preparation/provider; rotary kiln and actual preheater/cooler configuration; fully calcined unhydrated non-sintered Ca-Mg oxide product; measured Ca/Mg phase and residual carbonate/free-water assays; actual impurity and thermal/reactivity grade; particle size and acceptance specification; calibrated whole bare product net mass; first quality-release Q and unique cohort; full failed/startstop/idle/cleanup records; opening/closing physical stocks and per-exchange inherited vectors; separate observed FG-service horizon and original cohort Q_o; actual fuels and calorific basis; gas wet/dry state and species source; water phases and receiving medium; supplier-included packaging upstream owner and six gross legs; assets and repair material/fluid history; allocation and provider coverage; native identity restrictions |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | manufacture | Begin with real supplied carbonate dolostone and its complete upstream quarry/preparation/transport burden. Include actual receipt, onsite sizing/washing, fuel preparation, preheating, rotary-kiln decarbonation, direct-air cooling, screening, first bare-product testing/release, pollution controls and attributable assets/repairs. The bounded technical synthesis is supported by BREF plus MPA, not a claim of one measured factory or SKU. No universal temperature, time, purity, density, fuel, energy, yield, reaction factor or product life is prescribed. | `jrc-clm-bref-2013`; `mpa-making-dolime` |\n| boundary_exclusions | product | Exclude raw glass-batch dolomite, raw carbonate mineral supply as final output, half-burnt CaCO3/MgO, sintered/dead-burnt/double-pass densification, binder agglomeration, purchased pure-oxide blending, intentional hydration/slaking, mortar formulation and refractory-brick shaping. BREF permits shaft as well as rotary kilns; MPA rotary/solid-fuel language is regional context, not proof that shaft manufacture is impossible. These other states/routes require their own applicability assessment. | `jrc-clm-bref-2013`; `mpa-making-dolime` |\n| boundary_first_release | all inventory rows | Q is the independently weighed net as-received whole bare mass of unique newly first-quality-released dolime lots in kg. Exclude removable packaging, failed material, opening already-released FG, repeat testing and delivery. Closing newly released FG is already in Q: never debit its manufacturing vector as B_close or add it again as output. Manufacturing B_close includes only unreleased raw/WIP and separately reconciled unallocated non-WIP installed stores. Preserve wet mass and measured free water/phase qualifiers without changing Q to an assumed dry/pure-oxide basis. | `jrc-clm-bref-2013` |\n| boundary_history | all inventory rows | Retain opening/closing physical raw, fuel, WIP, captured-return dust, FG, packaging and installed asset/fluid quantities and each exchange-specific inherited burden vector. All failed batches, zero-output periods, start/stop, idle, cleaning and actual rework carry their real burden. X_in/X_out records independently measured actual material/water ingress/egress not already represented by another incoming/outgoing FLOW term; deduplicate only against other actual flow terms, never opening/closing stocks, never delete actual external ingress because its material/water remains in closing stock. Full wet closing mass and that real input both remain. Ordinary rejected/sample/broken material, waste sale and offsite disposal do not remove manufacturing burden; only documented distinct cohort/function and valid allocation/transfer moves a vector once, never shrinks gross physical mass. Independently retain each opening/closing raw, WIP and unassigned non-WIP physical quantity and every inherited exchange vector. Declare gross receipt/pool entry versus already-stock-adjusted net consumption and every correction already included; never stock-correct the same net raw consumption twice. | `jrc-ilcd-2010` |\n| boundary_service | service | Retain post-release storage, packing, handling and dispatch as a separate actual service account for each original cohort and observed horizon. Use its original Q_o, not current new production Q; carry previously executed services once. Track openingFG + Q transfer + actual physical returns + actual added material/water against closingFG + gross dispatch + real rejects/losses/species. Trace D_rev to original shipment history; do not assume R=D_rev. Manufacturer/specification permission, postwork tests and disposition are required for rework; hydration or damage is not automatically recoverable. Consolidate by cancelling internal Q and cohort/vector transfers. No service or reacceptance creates new production. | `jrc-ilcd-2010` |\n| boundary_additions | all inventory rows | Cards are individual conditional exchanges, not a universal plant recipe. Before using a dataset add every other actual fuel, chemical formulation, repair part, water phase, captured/exported product, waste and molecular emission as a specific atomic row with proper identity/property/unit/provider and protocol. Unknown is not zero or not_applicable. Whole purchased formulations are procured once; assay, active fraction, carrier water, ash and component observations are subledgers. Actual in-house formulation separately records every purchase, energy and loss. Do not invent future steam, boilers, additives or credits. | `jrc-clm-bref-2013`; `jrc-ilcd-2010` |\n| packaging_receipt_basis | each packaging receipt | For every actual packaging article, classify each whole external receipt once. P is paid procurement, including paid packaging bundled with another supply without a separate invoice. I is all first non-purchased external ingress: standalone gifts, loans, rental or pool receipts and non-purchased supplier-attached packaging; supplier attachment is only an I subset. ER requires this same item or an auditable configuration-matched batch linked to this site's own prior outward record; custody or another party's use alone does not prove a return. P, I and ER are disjoint. Existing I cards and their raw protocols cover the same physical article for every such I origin; no new material, UUID or quantity is presumed. X_in/X_out remain disjoint material/water-change terms, never a substitute for whole-article receipt. Retain gross physical quantity, owner/custodian, payment or non-purchase basis, origin, prior-outward link where required, native state/unit and inherited manufacturing/service vector. Non-purchase is neither a new manufacture nor automatic zero burden: attribute actual used service and incremental transport/handling once to its proper original cohort and denominator, retaining unused service separately without a default lifetime or credit. This is the declared conserving foreground accounting implementation, not a claim that the cited source prescribes these variable names. | `jrc-ilcd-2010` |\n\n"
