    - id: calc_service
      applies_to: "all inventory rows"
      rule: "For each original cohort retain full FG vector ledger: openingFG burden + new Q internal transfer + actual returned original-dispatch reversal + true incremental service additions = closingFG burden + gross-dispatch destination vectors + actual other destination vectors. R is actual physical return; D_rev is its traced original shipment vector, not an assumed equal mass. Include actual added water, reaction, losses and permitted rework/new and removed parts separately. Observed service horizon and already executed services are explicit; no complete future-life claim. Asset physical acquisition/retirement and installed stocks remain gross, while only justified current service/acquisition-equivalent burden is assigned using real use history and residual vector, without fixed life or a whole kiln per kg. For ledger-only FG return/dispatch and packaging P/I/ER/S/EO/W movements, A_i in calc_reference is that leg's complete measured gross physical quantity after unit conversion, not a manufacturing/service burden vector. Use its matching original first-release cohort denominator once: Q for manufacture or Q_o for that original cohort's observed service. Do not add inherited burden vectors to this physical amount, stock-correct the same gross leg again, or apply an economic/causal burden share to its gross kg. A mere stock, dispatch or return leg creates no additional production Q or repeated provider burden. Actual supplied-purchase and incremental performed-service burdens remain separate exchange vectors with their real owner and stock history and are normalized once on their matching cohort basis. Retain already performed original-cohort services over the disclosed horizon, including services on held or undispatched FG; do not erase them because no shipment occurred or impute future service. A changed wet return R remains the independently measured physical return; D_rev remains its traced original-dispatch vector, reconciled with actual water/material changes and losses, never forced equal. For every actual manufacture or post-release work event retain real material/water/energy, releases, wastes, custody and burdens whether authorized, unapproved, unauthorized, failed or rejected. Permission/specification/posttests govern authorization and continued grade/identity qualification, never erasure of actual flows/burdens. Retain original Q_o/H and acceptance/disposition, never assumed reversal of hydration/carbonation or another first Q. Only genuinely unused/unassigned stores carry, never already performed held-FG service. Ordinary waste/scrap/offsite sale alone never transfers manufacturing/treatment burden or creates credit; only a true separate function/cohort with one justified attribution may transfer one vector."
