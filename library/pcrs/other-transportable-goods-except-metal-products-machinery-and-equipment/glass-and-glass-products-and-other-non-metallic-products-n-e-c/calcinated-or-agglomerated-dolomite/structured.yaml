    - id: calc_packaging
      applies_to: "all inventory rows"
      rule: "For each single packaging article: opening empty + attachedWIP + attachedFG + reusable + paid procurement (standalone or bundled) + first non-purchased external ingress + external-return-received + actual disjoint X_in = corresponding closing + with gross physical dispatch + standalone external-return-sent + waste + actual disjoint X_out. Keep all six mutually exclusive external gross legs even if one is measured absent; unknown is not absent. Internal reuse cancels. Retain first non-purchased external ingress physical mass with one upstream owner, and original-cohort burdens; no new product Q or automatic coproduct. Moisture and repair components stay explicit. X covers only independently observed material addition/removal and free/bound-water uptake/loss not already in another incoming/outgoing FLOW term. Deduplicate only against other flow terms, never opening/closing stocks: retained new water/material remains both real ingress and full closing wet mass; removal and full opening mass follow the same rule. A whole wet receipt/outflow already contains its measured water/material once, without extra X. Retain independent dry-component/water phase, source and destination, actual repair permission/specification, required tests and acceptance/disposition, every burden history and one supplier owner. Before data completion add each actual unrepresented material/water phase as a specific atomic exchange. Unknown occurrence/phase/amount is not zero; no presumed repair, uptake, dry wood, wood species, lifetime or residual-fitted quantity. Ordinary packaging storage/handling absorption and desorption/evaporation require no repair event. X deduplicates only another actual same-side FLOW term, never opposite flow, stock or mere card existence; true retained influx AND full wet closing stock remain. Whole supplied sack/pallet/film includes integral components and water once as memo composition. Actual separately supplied onsite components require their own atomic receipt and one provider owner. Use disjoint component contributions or a reconciled whole article: empty assembled tare equals measured whole-bought contribution plus real added matter/retained water minus actual removal/loss, excluding dolime. In article mode match component handoff IDs, replace component stocks/shipments by the reconciled article and cancel internal transfers; never whole assembled tare plus its same liner/thread/glue contributions. One real mixed collection outlet needs one qualified Waste exchange and independently measured source-W/pool withdrawals summing to that outlet as nonadditive raw subaccounts. Total OR disjoint partition, never both; treatment/provider once. Genuinely separate actual outlets remain separate. No bulk dolime packaging/repair/uptake is assumed.  Apply packaging_receipt_basis to distinguish each actual P/I/ER receipt."
