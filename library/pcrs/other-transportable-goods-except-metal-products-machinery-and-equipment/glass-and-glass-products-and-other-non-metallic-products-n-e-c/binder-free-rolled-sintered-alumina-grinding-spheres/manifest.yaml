  identity_restrictions:
    - Qualified complete grinding-media grade within native Abrasives
      Product/Mass family; actual minor phases/impurities/moisture stay in whole
      sphere. Not a selectable collection or pure constituent; no kg/item or
      density factor inferred.
    - Raw manufactured Al2O3 Product family is restricted to independently
      qualified whole unfired high-purity powder, never air emission or final
      spheres; native CAS/grade/route/geography are unspecified.
    - Electricity is CN user-side grid-average <1 kV in native MJ; de-ionised
      water is an actual whole purchased compatible liquid Product only.
    - PE film CAS 9002-88-4 and wooden-board/slat pallet have isolated taxonomy
      defects; their coherent physical identities and full restrictions are in
      every consuming card. No PET, multilayer laminate, plastic pallet, fixed
      mass or life is inferred.
    - Fossil CO/CO2 bindings are actual gaseous molecules to air unspecified
      with explicit origin, species and excluded-alias restrictions; long-term
      and different-origin flows are not interchangeable.
    - Rejected NO/HNO alias ambiguity, water-vapour isotope/ethers ambiguity,
      long-term oxygen/CO2 compartments, Product nitrogen as environmental N2,
      Product alumina as air emission, fixed-fibre carton and generic
      finished-ceramic mismatches are not silently adopted.
  core_reference_identity: Qualified broader Abrasives Product grinding-media
    member; explicit synonyms abrasive media/grinding consumables/研磨介质. One
    whole sintered alumina sphere grade including all actual minor
    phases/impurities/moisture, not Al2O3 constituent or auxiliary collection.
    Full native restrictions and actual provider/grade evidence apply.
  independent_review_repair: Complete grinding-media reference and primary
    whole-body route confirmed; gross-entry versus already stock-adjusted
    consumption clarified, post-release repair permission/acceptance and full
    packaging repair/water ingress-egress required. No scientific/translation
    approval.
  gross_service_ledger_clarification: The physical FG/package leg uses its full
    measured gross numerator in its own native unit, not a service burden
    vector; no inherited-burden addition, second stock correction, economic
    scaling, duplicate purchase or credit. Already performed services stay under
    original Qc/H even if FG is held. All 74 cards, amounts, units, 8
    identities, reference, sources, protocols and other rules/states unchanged.
