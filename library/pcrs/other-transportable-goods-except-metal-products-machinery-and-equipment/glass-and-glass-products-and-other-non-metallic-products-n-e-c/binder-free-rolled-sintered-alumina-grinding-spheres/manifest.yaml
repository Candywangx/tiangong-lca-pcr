  semantic_boundary_review:
    decision: new narrow draft after full material-scope comparison
    rationale: All 1262 ref36 material records read across 13 pages. Existing Bayer
      alumina PCR explicitly excludes downstream specialty products and cannot
      implement powder-to-rolled-fired grinding spheres. Ferrite magnets,
      decals, electrical fittings, machine tools and PTFE use different
      objects/routes. Frozen 37210 vitreous-china washbasins and 37191/37199
      glass objects differ in composition, forming, terminal use and inventory.
      No frozen 37291/37221/37222 intake was present at initial read; other
      active worktrees were not accessed. Crucibles, tableware, decorative
      ceramic, insulators and structural fired ware are expressly excluded.
    late_frozen_comparison:
      pcr_id: pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.glass-and-glass-products-and-other-non-metallic-products-n-e-c.pressed-sintered-alumina-chemical-crucible-bodies
      author_commit: 03498f25a536be07b8020d3a72f0051fbf0cf7a2
      decision: Not a reusable complete method for this sphere product
      rule_difference: Its sections 1/2 cover nominal95% uncoated empty
        chemical-crucible bodies with pressing, optional whole
        binder/sintering-aid formulation and debinding; they explicitly exclude
        grinding media and distinct high-purity alumina routes. This candidate
        covers high-purity binder-free water rolling of solid grinding spheres
        with size sorting and grinding-specific terminal acceptance, excluding
        crucibles. Shared oxide sintering and Mass/kg support do not make these
        functional/product/forming boundaries identical. Both were draft at that
        initial comparison, not approved coverage.
