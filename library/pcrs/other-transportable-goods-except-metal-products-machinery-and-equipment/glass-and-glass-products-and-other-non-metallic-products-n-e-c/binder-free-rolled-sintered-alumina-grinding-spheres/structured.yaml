    - rule_id: b_stock
      applies_to: "manufacturing numerator"
      rule: "For each exchange retain opening/closing raw, WIP and unassigned non-WIP material-store inherited burden vectors, plus all failures, zero-output, hot hold, start/stop, idle, cleanup and rework. Already-released closing FG is inside Q: neither subtract its manufacture burden nor add it as another production output. Gross receipts/pool entries before stock corrections and already stock-adjusted consumption must be distinguished. Retain corrections already included, reconcile only remaining unincluded vectors and never correct the same raw stock twice. Independently record every raw/WIP/non-WIP opening/closing physical quantity and complete inherited exchange vector."
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - rule_id: b_service
      applies_to: "original cohort"
      rule: "Keep released product burden with original cohort Qc. Record only actual subsequent packing, storage, handling, dispatch, return, retest and real cleaning/rework increment over observed H. Reinspection, returns and reshipment do not create production. Consolidation cancels internal Q transfer once. Actual post-release repair/regrinding/refiring requires governing manufacturer/design permission, continued whole-grade applicability, measured new/removed material and water phases, required retests and acceptance or waste disposition. Patent green-ball shaping before sintering does not authorize restoration of broken fired media."
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - rule_id: b_atomic
      applies_to: "all exchanges"
      rule: "Each actual purchased whole formulation, material, fuel, carrier, packaging, waste and real species is an atomic row. Add any actual unlisted exchange with specific identity and destination; no other/zero collection may hide it. Whole formulations are purchased once with assay/water/active content subaccounts only; site preparation instead retains each real purchased ingredient and operation."
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - rule_id: b_physical
      applies_to: "manufacture service combined"
      rule: "Reconcile whole physical mass and relevant Al/O/H/C/N/S element accounts at manufacture, FG-service and combined gates before allocating burdens. Do not scale gross physical exchanges by economic shares. Internal recycle, sagger reuse and circulation cancel only transfers; real energy, loss and inherited burdens remain. Gross air species replace the aggregate air row rather than duplicate it."
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - rule_id: b_assets
      applies_to: "physical asset stock and service"
      rule: "For each machine, kiln, refractory, sagger and tool preserve physical additions, installed opening/closing stock, repair components, deposits, moisture, in-machine fluid and retirement separately from current attributable service burden. Use actual asset/service evidence; no fixed life, equal virgin replacement for reuse, or whole asset per kg."
