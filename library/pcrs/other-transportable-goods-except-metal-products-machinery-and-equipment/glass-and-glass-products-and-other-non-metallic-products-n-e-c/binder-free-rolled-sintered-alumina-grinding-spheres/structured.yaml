allocation_rules:
  - rule_id: a_scope
    applies_to: "attributional multifunctionality"
    rule: "This method uses attributional accounting where allocation is needed. First assign dedicated operations and independently measured exchanges, including virtual subdivision of embodied powder and separately observed services. Internal recycling, returnable packs and saleable size fractions do not justify automatic credits."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_causality
    applies_to: "each residual shared exchange"
    rule: "For remaining joint loads identify and quantify the exchange-specific determining physical cause using real process response and batch/service measurements. Do not select physical or economic allocation arbitrarily or impose one mass share on every exchange. Heating, rolling, finishing and warehousing may have different causes; unsupported causality remains unresolved."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_market
    applies_to: "genuinely residual multifunctional load"
    rule: "Only the genuinely unassignable residual uses contemporaneous market values for real outputs at the same common-process gate, amount and actual condition. If prices refer to further processed, sorted, packed, transported or marketed products, remove those downstream differences with evidence. Retain quantity/price provenance, sensitivity and uncertainty; no fixed percentages or sales-receipt rule."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_waste
    applies_to: "rejects and treatment"
    rule: "Rejected balls, powder, sludge, waste packaging and exhausted assets are waste unless actual product status and usable specification are independently established at the relevant gate. Preserve treatment burdens and gross material routes; no assumed displaced virgin material, avoided use electricity or extension of lifetime."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_spheres"
      record_type: "batch quality and weighing record"
      raw_fields: "unique release ID; batch grade; first-release timestamp; calibrated gross tare net mass; moisture and phase tests; size distribution; final quality decision; opening closing released FG; gross dispatch IDs; returns; original release link"
      collection_method: "Weigh the accepted net complete spheres on a calibrated scale excluding packaging; reconcile grade and unique first quality release, keep failures and unreleased WIP separate."
      unit: "kg"
      frequency: "each batch and stock boundary"
      temporal_coverage: "complete declared manufacturing cohort"
      site_scope: "all declared plant stages"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; tare checks; grade assay; phase test; quality disposition; unique ID reconciliation"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each purchased material"
      record_type: "receipt recipe and stage balance"
      raw_fields: "exchange ID; supplier whole formulation; chemical assay; phase; delivered form; wet dry mass; independent moisture; opening closing raw WIP unassigned store quantities; per-exchange inherited burden vector; actual stage consumption; internal transfer ID; supplier boundary"
      collection_method: "Weigh and sample whole supplies and each real preparation stage; distinguish external purchase from internal movement and assay-only subaccounts. Record gross-entry versus already stock-adjusted consumption and the stock corrections included before any further vector adjustment."
      unit: "row native units"
      frequency: "each receipt batch and stock boundary"
      temporal_coverage: "complete cohort including all failed runs"
      site_scope: "supplier gate to first release"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge; inventory counts; supplier assay; sampled moisture; transfer reconciliation"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "each energy carrier and actual return"
      record_type: "meter operating-mode and utility record"
      raw_fields: "exchange ID; raw meter start end; genuine rate interval; native unit; kWh; gas actual standard volume; composition; measured density; net heat value; carrier mass; supply return temperature pressure dryness enthalpy; supplier water energy convention; failures start stop idle cleanup; allocation measurements"
      collection_method: "Use calibrated submeters and actual utility contracts; preserve physical carrier and heat subaccounts, all operating modes and observed external return conditions."
      unit: "row native units"
      frequency: "each operating interval and campaign"
      temporal_coverage: "entire cohort including zero output"
      site_scope: "all actual preparation drying kiln finishing and utility stages"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; unit conditions; heating-value test; enthalpy evidence; mode logs"
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "freight"
      record_type: "consignment route record"
      raw_fields: "shipment ID; material ID; payload mass; route distance; vehicle type; load factor; empty return boundary; tonne kilometre basis"
      collection_method: "Retain real shipment tickets, payload and route evidence; allocate actual service using supported causality."
      unit: "t km"
      frequency: "each actual shipment"
      temporal_coverage: "declared procurement cohort"
      site_scope: "actual inbound routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets; route source; payload checks"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "each asset tool or fluid"
      record_type: "physical asset and service ledger"
      raw_fields: "asset ID; composition; opening installed stock; new used additions; replaced component IDs; actual service events; maintenance; moisture deposits; installed fluid; closing stock; retirement; inherited service burden; supported attribution basis"
      collection_method: "Count and weigh actual assets/parts/fluids independently; determine attributable service from real documented asset and use history without an assumed lifetime."
      unit: "row native units"
      frequency: "each installation maintenance and stock boundary"
      temporal_coverage: "whole observed asset and cohort service records"
      site_scope: "actual plant asset boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; maintenance evidence; service basis; component and fluid balance"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each external waste"
      record_type: "waste sampling and transfer ledger"
      raw_fields: "waste ID; stage origin; actual type; wet mass; dry solids; independent species and moisture; destination; external treatment ticket; retained stock; internal recycle; rework energy"
      collection_method: "Weigh each real waste stream at its destination boundary and independently sample composition; distinguish internal recovery from external treatment and direct discharge."
      unit: "kg"
      frequency: "each removal and representative sample"
      temporal_coverage: "all cohort runs and stock intervals"
      site_scope: "actual process and waste gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets; calibrated scale; lab sampling; destination and closure evidence"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each environmental molecular exchange"
      record_type: "speciated inlet outlet measurement"
      raw_fields: "species ID; formula; phase; source origin; compartment; gross inlet outlet; actual versus standard state; measured concentration; genuine flow rate and interval or integrated volume; independent density; free structural reaction water evidence; relevant element assay; analytical detection limit"
      collection_method: "Use independent species/phase measurements and source carbon/water evidence; retain indicator readings separately. Reconcile physical and element gates without fitting multiple unknown species from one residual."
      unit: "kg"
      frequency: "representative intervals including actual startup idle and failed modes"
      temporal_coverage: "complete cohort with declared sampling representativeness"
      site_scope: "each actual intake stack and discharge boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "lab method; detection limit; meter state; independent species and element reconciliation"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "each specific packaging row"
      record_type: "gross packaging custody ledger"
      raw_fields: "material and type ID; ownership; actual composition; measured mass; opening empty attached WIP attached FG reusable stock; new purchases; raw-supply receipts; external returns received; closing same stocks; gross dispatched; external returns out; waste; internal reuse; provider burden convention; receiving cohort; actual new/removed repair components and independently measured water uptake/release; dry matter and full wet opening/closing stocks; source phase destination and included-flow checks"
      collection_method: "Count and weigh each packaging material and attached contents separately at every custody movement; preserve physical total regardless of burden allocation or net delivery."
      unit: "kg"
      frequency: "each receipt shipment return discard and stock boundary"
      temporal_coverage: "manufacturing and original-cohort service horizon"
      site_scope: "plant packaging custody and external pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "packaging counts; weighed tare; ownership; stock and gross shipment reconciliation"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "post-release increment"
      record_type: "original cohort service event record"
      raw_fields: "original release ID; cohort grade; original Qc; observation horizon H; opening closing FG; incoming returns; gross dispatch; breakage; actual energy water chemicals waste; retest; incremental rework; original burden vector; calibrated measurements"
      collection_method: "Link every real post-release event to its original released cohort and observe incremental loads, preserving historical burden; do not relabel returns as new production. Verify actual repair permission, required post-work retests and acceptance/disposition; measure new/removed material and water phases without assumed restorability."
      unit: "row native units"
      frequency: "each event and observed stock boundary"
      temporal_coverage: "explicit observed H for original cohort Qc"
      site_scope: "actual packing storage dispatch return and service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "cohort links; calibrated events; stock bridge; declared incomplete future horizon"
    - protocol_id: cp_pack_m
      process_id: "manufacture"
      flow_role: "each specific packaging row"
      record_type: "gross packaging custody ledger"
      raw_fields: "material and type ID; ownership; actual composition; measured mass; opening empty attached WIP attached FG reusable stock; new purchases; raw-supply receipts; external returns received; closing same stocks; gross dispatched; external returns out; waste; internal reuse; provider burden convention; receiving cohort; actual new/removed repair components and independently measured water uptake/release; dry matter and full wet opening/closing stocks; source phase destination and included-flow checks"
      collection_method: "Count and weigh each packaging material and attached contents separately at every custody movement; preserve physical total regardless of burden allocation or net delivery."
      unit: "kg"
      frequency: "each receipt shipment return discard and stock boundary"
      temporal_coverage: "manufacturing and original-cohort service horizon"
      site_scope: "plant packaging custody and external pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "packaging counts; weighed tare; ownership; stock and gross shipment reconciliation"
  calculation_rules:
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "Convert each original unit first; integrate true rates over actual intervals and do not re-integrate accumulated quantities. Preserve native row extensive unit; independently evidence density, gas composition, heat value and enthalpy. Output undivided raw_i."
      inputs:
        - original_measurement
        - original_unit
        - measured_state
        - conversion_evidence
        - cp_material
        - cp_energy
        - cp_species
        - cp_transport
      output: "raw_i"
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - id: calc_manufacture
      applies_to: "manufacture"
      rule: "q_i = A_i / Q; A_i = direct assigned raw_i plus exchange-specific shares of genuinely joint raw_i plus opening raw/WIP/unassigned-store inherited burden_i minus closing raw/WIP/unassigned-store inherited burden_i; preserve all actual failure/zero-output/idle/rework loads; closing already-released FG is not subtracted; Q = unique first-release net sphere mass in kg from cp_release; Q>0 only. Each numerator retains its own extensive unit; q_i is per 1 kg reference flow. No second quotient. Current raw_i in this stock bridge uses gross-entry burden before those corrections; if source consumption already includes stock adjustments, preserve its basis and apply only remaining unincluded WIP/non-WIP vectors, not the same raw-stock correction again."
      inputs:
        - raw_i
        - opening_vector_i
        - closing_vector_i
        - exchange_allocation_evidence
        - Q
        - cp_release
      output: "q_i"
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
        - jrc-ilcd-detailed-2010
    - id: calc_service
      applies_to: "service"
      rule: "s_i = deltaA_i / Qc; deltaA_i = actual attributable post-release incremental load during observed H for original cohort c; retain original inherited manufacture vector with that cohort; Qc = its original unique first-release net mass in kg. Physical packaging rows retain gross custody movement and original production burden only once. s_i is per 1 kg reference flow for that original cohort; no new Q and no second quotient. For ledger-only FG and packaging physical movement cards, deltaA_i is instead the full actually measured gross quantity of the particular leg in its own native extensive unit, not a service burden vector. Do not add inherited manufacturing/purchase burdens, apply another stock correction or scale that physical leg by an economic burden share. Normalize its gross amount once by original Qc and report it separately from actual attributed service burdens; physical dispatch, supplier-included arrival and returns create no extra purchase or coproduct credit. Actual services already performed on held closing FG retain their burden under original Qc/H without a deduction merely because the goods remain held. Independently preserve the matched original-delivery record; a changed wet or damaged return is not an assumed reversal of the original delivered quantity."
      inputs:
        - original_release_id
        - Qc
        - H
        - deltaA_i
        - inherited_manufacture_vector
        - cp_service
        - cp_pack
      output: "s_i"
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
        - jrc-ilcd-detailed-2010
    - id: calc_zero
      applies_to: "manufacture; service"
      rule: "When Q or Qc is zero retain actual raw loads, stocks and investigation records; issue no unit result, exclude no failed batch and fabricate no positive denominator."
      inputs:
        - Q
        - Qc
        - raw_i
        - cp_release
        - cp_service
      output: "zero_output_load_ledger"
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
        - jrc-ilcd-detailed-2010
    - id: calc_physical
      applies_to: "manufacture; service; combined"
      rule: "At each gate reconcile opening physical stock plus all actual ingress = closing stock plus all actual egress; cancel internal transfers once on consolidation. Independently reconcile relevant elements and each real species/water state with measured uncertainty; never fit two unknowns to one residual or scale physical totals by economic shares."
      inputs:
        - physical_stock
        - physical_ingress
        - physical_egress
        - species_assay
        - element_assay
        - state_evidence
      output: "physical_gate_reconciliation"
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - id: calc_pack
      applies_to: "each packaging material"
      rule: "For each material/type/ownership execute the complete b_pack physical bridge, retaining empty, WIP-attached, FG-attached and reusable stocks plus raw-supply receipts/new purchases/external returns. Separate gross physical dispatch, external return and waste; cancel internal reuse. No inclusion in ceramic Q, automatic coproduct or credit."
      inputs:
        - opening_pack_stock
        - closing_pack_stock
        - new_pack
        - inbound_pack
        - return_received
        - gross_pack_dispatch
        - external_return
        - pack_waste
        - cp_pack
        - cp_pack_m
      output: "packaging_custody_reconciliation"
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each product and species"
      requirement: "Evidence actual whole object, material, supplied state, phase, use and every native restriction; a broad Product family needs explicit product qualifiers, not CPC/name matching."
      evidence: "native exact record; supplier assay; product drawing; route and acceptance record"
    - id: dq_measurement
      applies_to: "each raw record"
      requirement: "Use calibrated measurements and original units, with representative coverage of start/stop, idle, failures and zero output; report detection limits, missingness and uncertainty."
      evidence: "calibration; original readings; sampling design; mode logs"
    - id: dq_stocks
      applies_to: "every cohort and gate"
      requirement: "Complete per-exchange inherited vectors and physical raw/WIP/FG/asset/packaging bridges; separate historical manufacture from incremental service and disclose unobserved future service beyond H."
      evidence: "opening closing inventory; cohort bridge; service observation"
    - id: dq_sources
      applies_to: "each external rule"
      requirement: "Retain complete source/context and applicability; multiple fragments of one publication are not independent sources and a successful read is not scientific coverage."
      evidence: "original provenance; contextual read; applicability assessment"
    - id: dq_completeness
      applies_to: "all inventory and allocation"
      requirement: "Add actual extra exchanges individually and never label unmeasured as zero. Ordinary auxiliary identity/provider/future quantity gaps do not alone lower maturity; real core identity or complete-method gaps retain a true hold."
      evidence: "raw-to-row audit; exclusions; gap register; allocation sensitivity"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and every UUID"
    rule: "Confirm whole solid fired alumina grinding spheres independently of powder feed and hollow granules. Every bound UUID requires compatible native material/CAS/form/route/geography/media/type and all property references; a search name, classification, unit chain or successful check is insufficient. Missing core reference identity prevents usable methodology; ordinary auxiliary/provider gaps remain disclosed."
    source_ids:
      - cn111116183a-alumina-spheres-2020
      - union-process-grinding-media
      - jrc-ceramic-bref-2007
      - jrc-ilcd-detailed-2010
  - rule_id: v_release
    applies_to: "Q and cohort"
    rule: "Q counts measured net mass at unique first release once. Closing released FG cannot reduce manufacturing loads; returns/retest/dispatch do not add Q. Check manufacturing and service physical bridges with original release IDs, raw/WIP inherited vectors, Qc and H."
    source_ids:
      - cn111116183a-alumina-spheres-2020
      - union-process-grinding-media
      - jrc-ceramic-bref-2007
      - jrc-ilcd-detailed-2010
  - rule_id: v_amount
    applies_to: "all inventory rows"
    rule: "Validate raw units and genuine rate integration, actual allocation and inherited vectors before exactly one A/Q or increment/Qc normalization. Collection retains undivided raw records; cards/aggregation reference the same final result. Q=0 retains real loads but produces no unit result."
    source_ids:
      - cn111116183a-alumina-spheres-2020
      - union-process-grinding-media
      - jrc-ceramic-bref-2007
      - jrc-ilcd-detailed-2010
  - rule_id: v_species
    applies_to: "physical and elemental gates"
    rule: "Mass/element closure does not prove molecular speciation or reaction water. No total NOx/VOC/COD/dust indicator becomes one molecular flow by convenience. Preserve free/structural/reaction water and each real air/liquid/solid destination with independent assays; one residual cannot solve two unknowns."
    source_ids:
      - cn111116183a-alumina-spheres-2020
      - union-process-grinding-media
      - jrc-ceramic-bref-2007
      - jrc-ilcd-detailed-2010
  - rule_id: v_pack_asset
    applies_to: "packaging assets carriers"
    rule: "Reconcile gross physical packaging receipts, stocks, repeated shipment, returns and waste; distinguish installed assets and fluids from service burdens. Inspect actual external heat-carrier returns and provider conventions without creating fictitious boiler, steam or credits."
    source_ids:
      - cn111116183a-alumina-spheres-2020
      - union-process-grinding-media
      - jrc-ceramic-bref-2007
      - jrc-ilcd-detailed-2010
  - rule_id: v_scope_quality
    applies_to: "complete dataset"
    rule: "Require actual routes/qualifiers, source provenance, calibration, representative coverage, failures/missingness, uncertainty and evidence for absence. Any real unlisted exchange is added specifically. Methodology, translation, mapping and publication reviews remain separate; engineering validity cannot establish plant evidence or scientific approval."
    source_ids:
      - cn111116183a-alumina-spheres-2020
      - union-process-grinding-media
      - jrc-ceramic-bref-2007
      - jrc-ilcd-detailed-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual grade-specific grinding-media manufacture background after core identity confirmation and independent review"
  allowed_use: "Link only with compatible actual product/route/unit/geography/period/supplier boundary; report manufacture and observed-H service separately or explicitly consolidate"
  excluded_use: "Equal grinding-service comparisons, inferred particle mass, life/harmlessness claims, other media/routes and usable data with unconfirmed core identity"
  required_metadata: "site region period and actual supplier; one complete solid sphere grade and intended grinding use; alumina assay crystalline phase impurities and supplied powder form; binder-free water-assisted rolling and actual supplier versus on-site preparation; actual furnace energy atmosphere heating cooling and failed operating modes; fired size shape surface finish and quality tests; unique first-release net mass Q and measured moisture; opening closing raw WIP unassigned stores and per-exchange inherited burden vectors; FG cohort gross dispatch returns and original release bridge; service horizon H and original cohort Qc; each packaging material ownership full stocks and gross physical movements; equipment lining sagger tooling installed fluid stocks and actual service basis; each real species phase compartment origin and independently measured state; carrier mass heat enthalpy provider water convention and real external returns; allocation evidence data uncertainty missing identities and downstream use limits"
  required_quality_disclosure: "Full provenance/limitations; distinguish measurements/formulas/inferences; separate core hold and ordinary gaps; all failures, measurement uncertainty, stock history, observed H and allocation sensitivity"
  update_trigger: "Grade/recipe/phase/forming/firing/finishing changes, energy/provider/native identity updates, stock/cohort corrections, extended service H and methodology review"
data_sources:
  - id: "cn111116183a-alumina-spheres-2020"
    type: "literature"
    reference: "CN111116183A, 2020-05-08; https://patents.google.com/patent/CN111116183A/zh ; original seven-page PDF, description and Figure 1"
    used_for: "Qualitative powder-to-rolled-sphere route; Figure/prose starting-boundary difference; alternatives excluded. Patent examples are not factory inventory, universal purity/size/temperature, absence of emissions or life evidence."
  - id: "union-process-grinding-media"
    type: "handbook"
    reference: "Union Process, Grinding Media, ©2017 brochure; https://www.unionprocess.com.cn/uploads/soft/UP_YMJZ_EN.pdf ; complete six-page brochure, material/form comparisons"
    used_for: "Manufactured grinding-media identity and material/shape counterexamples, selection and sorting. Commercial grades differ from the patent case; no mass per item, equal grinding service or default formulation."
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission, Ceramic Manufacturing Industry BREF, August 2007; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf ; sections 2.3.8.1–2.3.8.9 and adjacent alternatives"
    used_for: "Qualitative supplied-material boundary, technical-ceramic preparation, firing, actual hard finishing and final control. Sector examples and figures are not a common recipe, energy/emission factor or allocation rule."
  - id: "jrc-ilcd-detailed-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide—Detailed guidance, First edition March 2010; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf ; sections 7.9.2–7.9.3"
    used_for: "Attributional subdivision and exchange-specific determining physical causality, then residual common-gate market value; actual raw data, stock and cohort accounting below are explicit PCR collection requirements, not reported observations from ILCD."
