system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Include every actual operation from whole purchased unfired powder to first-released complete fired spheres, including preparation shown in Figure 1 if operated on site and actual post-sinter finishing/tests. Declare supplier preparation with compatible upstream burdens; never replace manufacture by finished-ball purchase."
