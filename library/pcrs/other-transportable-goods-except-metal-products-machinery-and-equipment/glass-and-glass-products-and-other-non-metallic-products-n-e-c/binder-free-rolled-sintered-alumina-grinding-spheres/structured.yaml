          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_scope | attributional multifunctionality | This method uses attributional accounting where allocation is needed. First assign dedicated operations and independently measured exchanges, including virtual subdivision of embodied powder and separately observed services. Internal recycling, returnable packs and saleable size fractions do not justify automatic credits. | `jrc-ilcd-detailed-2010` |\n| a_causality | each residual shared exchange | For remaining joint loads identify and quantify the exchange-specific determining physical cause using real process response and batch/service measurements. Do not select physical or economic allocation arbitrarily or impose one mass share on every exchange. Heating, rolling, finishing and warehousing may have different causes; unsupported causality remains unresolved. | `jrc-ilcd-detailed-2010` |\n| a_market | genuinely residual multifunctional load | Only the genuinely unassignable residual uses contemporaneous market values for real outputs at the same common-process gate, amount and actual condition. If prices refer to further processed, sorted, packed, transported or marketed products, remove those downstream differences with evidence. Retain quantity/price provenance, sensitivity and uncertainty; no fixed percentages or sales-receipt rule. | `jrc-ilcd-detailed-2010` |\n| a_waste | rejects and treatment | Rejected balls, powder, sludge, waste packaging and exhausted assets are waste unless actual product status and usable specification are independently established at the relevant gate. Preserve treatment burdens and gross material routes; no assumed displaced virgin material, avoided use electricity or extension of lifetime. | `jrc-ilcd-detailed-2010` |\n| asset_manufacture_conservation | existing capital/reusable manufacture attribution | Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. |  |\n\n"
