        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - rule_id: b_pack
      applies_to: "each packaging material"
      rule: "For each carton, PE film and wooden pallet type/ownership/grade reconcile opening empty + attached WIP + attached FG + reusable stocks + new purchases + packaging received on raw supplies + external returns received = closing corresponding stocks + gross packaging shipped out + external supplier/pool returns + waste. Internal reuse cancels. Actual additional lids, labels, straps and liners each require their own full bridge. Supplier-included packaging burden is not purchased again; physical receipt remains. Include actual separately measured repair additions/removals and water uptake/release as respective ingress/egress, without duplicate amounts already in other wet-article flow terms. Opening/closing stocks retain full wet physical mass; material retained in closing stock does not eliminate its corresponding real inflow. Reconcile dry matter/water and actual source/phase/destination independently; add each real specific repair/water exchange before use, with no residual-fitted quantity or duplicate supplier-included burden."
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - rule_id: b_carriers
      applies_to: "heat and water supplies"
      rule: "Only actual external steam/hot-water carriers and real external Product returns are present. Keep gross carrier kg, actual supply/return state and heat MJ/enthalpy independently, with agreed provider water/energy boundary. Internal condensate loops cancel and external liquid returns are neither air emissions nor assumed wastewater/credits."
      source_ids:
        - cn111116183a-alumina-spheres-2020
        - union-process-grinding-media
        - jrc-ceramic-bref-2007
    - rule_id: b_fg_bridge
      applies_to: "FG service physical gate"
      rule: "For each original cohort reconcile opening FG + first releases + actual physical returns + actual added service material = closing FG + gross physical dispatch + destruction/loss + other specifically documented exits. Track returned mass/condition and original dispatch IDs independently: do not assume returned kg equal originally dispatched kg or zero new water/loss. Retain original manufacture burden without new production; no net-delivery denominator is defined."
