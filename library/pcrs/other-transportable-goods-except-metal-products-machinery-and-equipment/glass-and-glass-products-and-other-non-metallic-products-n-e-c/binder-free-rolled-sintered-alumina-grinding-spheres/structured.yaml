      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole purchased unfired high-purity alumina powder in actual supplied form/moisture; separate real water supplies |\n| starting_condition_role | foreground_material_receipt |\n| product_classification_scope | Narrow candidate within CPC 37299; no accepted mapping established |\n| recursive_input_rule | Bought same-category sintered balls used as milling media need compatible upstream burdens; internal self-produced transfers cancel with inherited burden/service retained and never replace new-ball manufacture |\n| upstream_dataset_requirement | Match whole material chemistry/phase/supplied form, grade, route, supplier geography and extensive unit without duplicate formulation subcomponents or supplier-included operations |\n| disclosure | Unfired powder through first release; disclose supplier/on-site preparation split and original-cohort subsequent services. Cradle-to-gate needs compatible upstream links and explicit consolidation |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | manufacture | Include every actual operation from whole purchased unfired powder to first-released complete fired spheres, including preparation shown in Figure 1 if operated on site and actual post-sinter finishing/tests. Declare supplier preparation with compatible upstream burdens; never replace manufacture by finished-ball purchase. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n| b_stock | manufacturing numerator | For each exchange retain opening/closing raw, WIP and unassigned non-WIP material-store inherited burden vectors, plus all failures, zero-output, hot hold, start/stop, idle, cleanup and rework. Already-released closing FG is inside Q: neither subtract its manufacture burden nor add it as another production output. Gross receipts/pool entries before stock corrections and already stock-adjusted consumption must be distinguished. Retain corrections already included, reconcile only remaining unincluded vectors and never correct the same raw stock twice. Independently record every raw/WIP/non-WIP opening/closing physical quantity and complete inherited exchange vector. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n| b_service | original cohort | Keep released product burden with original cohort Qc. Record only actual subsequent packing, storage, handling, dispatch, return, retest and real cleaning/rework increment over observed H. Reinspection, returns and reshipment do not create production. Consolidation cancels internal Q transfer once. Actual post-release repair/regrinding/refiring requires governing manufacturer/design permission, continued whole-grade applicability, measured new/removed material and water phases, required retests and acceptance or waste disposition. Patent green-ball shaping before sintering does not authorize restoration of broken fired media. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n| b_atomic | all exchanges | Each actual purchased whole formulation, material, fuel, carrier, packaging, waste and real species is an atomic row. Add any actual unlisted exchange with specific identity and destination; no other/zero collection may hide it. Whole formulations are purchased once with assay/water/active content subaccounts only; site preparation instead retains each real purchased ingredient and operation. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n| b_physical | manufacture service combined | Reconcile whole physical mass and relevant Al/O/H/C/N/S element accounts at manufacture, FG-service and combined gates before allocating burdens. Do not scale gross physical exchanges by economic shares. Internal recycle, sagger reuse and circulation cancel only transfers; real energy, loss and inherited burdens remain. Gross air species replace the aggregate air row rather than duplicate it. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n| b_assets | physical asset stock and service | For each machine, kiln, refractory, sagger and tool preserve physical additions, installed opening/closing stock, repair components, deposits, moisture, in-machine fluid and retirement separately from current attributable service burden. Use actual asset/service evidence; no fixed life, equal virgin replacement for reuse, or whole asset per kg. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n| b_pack | each packaging material | For each carton, PE film and wooden pallet type/ownership/grade reconcile opening empty + attached WIP + attached FG + reusable stocks + new purchases + packaging received on raw supplies + external returns received = closing corresponding stocks + gross packaging shipped out + external supplier/pool returns + waste. Internal reuse cancels. Actual additional lids, labels, straps and liners each require their own full bridge. Supplier-included packaging burden is not purchased again; physical receipt remains. Include actual separately measured repair additions/removals and water uptake/release as respective ingress/egress, without duplicate amounts already in other wet-article flow terms. Opening/closing stocks retain full wet physical mass; material retained in closing stock does not eliminate its corresponding real inflow. Reconcile dry matter/water and actual source/phase/destination independently; add each real specific repair/water exchange before use, with no residual-fitted quantity or duplicate supplier-included burden. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n| b_carriers | heat and water supplies | Only actual external steam/hot-water carriers and real external Product returns are present. Keep gross carrier kg, actual supply/return state and heat MJ/enthalpy independently, with agreed provider water/energy boundary. Internal condensate loops cancel and external liquid returns are neither air emissions nor assumed wastewater/credits. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n| b_fg_bridge | FG service physical gate | For each original cohort reconcile opening FG + first releases + actual physical returns + actual added service material = closing FG + gross physical dispatch + destruction/loss + other specifically documented exits. Track returned mass/condition and original dispatch IDs independently: do not assume returned kg equal originally dispatched kg or zero new water/loss. Retain original manufacture burden without new production; no net-delivery denominator is defined. | `cn111116183a-alumina-spheres-2020`; `union-process-grinding-media`; `jrc-ceramic-bref-2007` |\n\n"
