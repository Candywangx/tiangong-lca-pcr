published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual dry supplied CAC alumina-spinel castable manufacture, with separately tagged observed original-cohort services"
  allowed_use: "Compatible dry blend gate, declared formulation/provider/native units, real attribution and complete physical/history records"
  excluded_use: "Installed-lining performance or lifetime comparisons; inferred recipes; ordinary cement; all37330 coverage; automatic credits; future unobserved services"
  required_metadata: "All reference qualifiers; Q Qc H; supplier and whole-preparation scope; raw/WIP/FG inherited vectors; gross packaging assets and water/species records"
  required_quality_disclosure: "Actual versus planned collection, auxiliary/provider/species/stock uncertainties, source limitations and pending scientific/translation review"
  update_trigger: "Changed bonding chemistry mix supply state raw processing QC release endpoint native restrictions provider allocation evidence or observed-service horizon"
data_sources:
  - id: "idem-vesuvius-castable-line-2003"
    type: "official_guidance"
    reference: "Indiana IDEM, Vesuvius USA 089-16134-00075, January7 2003; TSD pp1–2/13 and AppendixA pp1–2; https://permits.air.idem.in.gov/16134f.pdf"
    used_for: "Real EU011 dry prepared-feed batch/mix/bag manufacture and dust controls. Adjacent EU010 tar/solvent and shared dryer are counter-scope. Historical permit maxima and potential-to-emit calculations are not actual castable recipe, LCA allocation, current operating load or molecular emissions."
  - id: "almatis-alumina-spinel-castables"
    type: "literature"
    reference: "Racher et al., Almatis, Improvements in Workability Behavior of Calcia-Free Hydratable Alumina Binders, full six-page paper, Table3 and Figs3–4 with surrounding comparisons; https://www.almatis.com/sites/default/files/technical_papers/media/gqlnq0wj/improvements-in-workability-behaviour-of-calcia-free-hydratable-alumina-binders.pdf"
    used_for: "Independent alumina-spinel/MgO/silica-fume/CAC and whole ADS3/ADW1 preparation roles; comparison with hydratable Alphabond. Laboratory formulations and wet test-piece properties are not a disclosed Trent/Vesuvius factory recipe, universal acceptance limits or added water in the supplied dry bag."
  - id: "trent-factory-castables"
    type: "literature"
    reference: "Trent Refractories, Castables, official complete HTML; https://www.trentrefractories.com/castables"
    used_for: "Real Scunthorpe in-house blending/bagging and cement-class castables versus separate shaped products. No claim that its proprietary recipe equals the independent Almatis test mix; ratings are application-specific."
  - id: "trent-castable-testing"
    type: "literature"
    reference: "Trent Refractories, Testing Capabilities – In House, official complete HTML; https://www.trentrefractories.com/testing-capabilities-in-house"
    used_for: "Actual batch-relevant grading, flow, setting, strength and dimensional test capabilities plus supplementary testing. Select actual product acceptance protocol and laboratory burdens; no unsupported standard-version or certification claim, fixed acceptance values or universal test schedule."
  - id: "lancaster-refractory-mixing"
    type: "handbook"
    reference: "Lancaster Products, Refractory Applications, full two-page equipment-manufacturer paper; https://www.lancasterproducts.com/wp-content/uploads/2020/04/4.-Refractory-Applications-Final-Copy.pdf"
    used_for: "Mineral mixing before monolithic bagging and contrasting formed-product steps; dry/wet sequence and mixer limitations. Vendor speed/time examples are not factory energy factors, prescribed cycle times or an LCA allocation method."
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission JRC, Ceramic Manufacturing Industry BREF, August2007, §§2.2.10–2.2.12, printed31–32; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "Unshaped refractory weighing/bags/pallets, moisture-sensitive warehousing and actual recovery/contamination distinctions. Fired-ceramic kiln routes and hazardous spent lining are not automatic dry-castable operations or clean recycled feed."
  - id: "ilcd-detailed-guidance-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook – General guide for LCA – Detailed guidance, first edition March2010, §§7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Only declared attributional multifunctionality context: dedicated actual/virtual subdivision, exchange-specific determining physical causality and genuinely remaining common-gate contemporaneous market-value allocation. General bookkeeping/consistency method, not castable chemistry or predetermined shares; unrelated QFD figure fractions are not adopted."
