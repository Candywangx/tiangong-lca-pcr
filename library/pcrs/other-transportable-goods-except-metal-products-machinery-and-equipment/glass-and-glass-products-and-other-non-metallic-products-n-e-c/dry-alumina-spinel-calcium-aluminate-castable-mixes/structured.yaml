      applies_to: "primary and method evidence"
      requirement: "Distinguish real factory manufacture from laboratory formulation and application tests. Almatis CAC and Alphabond columns, on-top additives and added test water are not one closed dry factory recipe. Vendor cycle examples and IDEM potential emissions are not actual current measurements. Only ILCD supports this allocation hierarchy; industrial PDFs do not."
      evidence: "full primary context source-specific uses and limits"
validation_rules:
  - rule_id: v_scope
    applies_to: "product and process"
    rule: "Check complete dry CAC-bonded alumina-spinel formulation manufacture through first quality release, actual composition supplied forms and application-specific QC. Reject wrong material/bonding family, single-oxide, bought-final-mix-repack and installed-lining substitution."
    source_ids:
      - almatis-alumina-spinel-castables
      - idem-vesuvius-castable-line-2003
      - trent-factory-castables
      - trent-castable-testing
  - rule_id: v_native
    applies_to: "every consuming row"
    rule: "Verify whole native identity including all names aliases CAS route form grade geography medium type properties and reference units, and the complete restriction in its consuming description. Hard conflicts cannot be cured by taxonomy labels. Core unresolved identity is a usability hold; ordinary auxiliary/provider or future measurements alone are not a scientific hold."
    source_ids:
      - almatis-alumina-spinel-castables
      - idem-vesuvius-castable-line-2003
      - lancaster-refractory-mixing
  - rule_id: v_basis
    applies_to: "all denominators and history"
    rule: "Check unique Q with released closing FG included once, all raw/WIP/unassigned inheritance, real failures and no subtraction of released-FG production. Services bind original Qc and H. No Q=0 unit result, double normalization, duplicate supplier ingredient, assumed density/mass per article or retest production."
    source_ids:
      - idem-vesuvius-castable-line-2003
      - ilcd-detailed-guidance-2010
  - rule_id: v_physical
    applies_to: "all physical gates"
    rule: "Check independent total mass relevant elements actual gas/mineral species and water/reaction/phase evidence, gross FG returns/condition changes, each complete packaging ledger and machine/part/fluid stocks. Internal transfers cancel only on consolidation. One residual is not independent chemistry evidence."
    source_ids:
      - almatis-alumina-spinel-castables
      - idem-vesuvius-castable-line-2003
      - lancaster-refractory-mixing
      - ilcd-detailed-guidance-2010
  - rule_id: v_complete
    applies_to: "bilingual content projection and checks"
    rule: "Every applicable actual exchange, raw protocol, unit, one final result, source field and normative/native context must survive in both languages and the typed projection. Unknown amount or applicability is not zero/passing. Schema, fingerprints and finite measurement checks are engineering evidence only, not scientific/translation approval, accepted mapping or publication."
    source_ids:
      - almatis-alumina-spinel-castables
      - idem-vesuvius-castable-line-2003
      - trent-factory-castables
      - trent-castable-testing
      - jrc-ceramic-bref-2007
      - ilcd-detailed-guidance-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
