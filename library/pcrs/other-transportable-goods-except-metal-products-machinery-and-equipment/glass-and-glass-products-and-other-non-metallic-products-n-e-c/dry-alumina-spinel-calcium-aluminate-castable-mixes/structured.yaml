allocation_rules:
  - rule_id: a_scope
    applies_to: "attributional study"
    rule: "Apply this hierarchy only within the declared attributional study and its valid multifunctionality decision context; no unrestricted choice between physical/economic allocation and no consequential substitution or automatic avoided credit."
    source_ids:
      - ilcd-detailed-guidance-2010
  - rule_id: a_subdivide
    applies_to: "each shared operation"
    rule: "First separate dedicated lines campaigns batches tests and services through actual or virtual subdivision and direct assignment. Preserve inherited input vectors and traceable submeter/task records. Lack of metering does not justify an arbitrary share; disclose remaining uncertainty and distortion."
    source_ids:
      - ilcd-detailed-guidance-2010
  - rule_id: a_physical
    applies_to: "each residual exchange"
    rule: "Identify and justify the determining physical causal relationship specific to that exchange: actual power/mixer duty, dedicated ingredient embodiment, observed occupied storage area/volume-time or measured handling work as applicable. A convenient mass share or the same key for every exchange is not established causality."
    source_ids:
      - ilcd-detailed-guidance-2010
  - rule_id: a_residual
    applies_to: "genuine remaining common process"
    rule: "Only after subdivision and determining causality leave a genuine residual, use documented contemporaneous market values of actual co-functions at the same process gate and physical condition. Align grade moisture delivery basis and period; do not use unrelated retail delivered or installed-lining prices. Retain sensitivities and absence of reliable prices as a gap, not fixed fractions."
    source_ids:
      - ilcd-detailed-guidance-2010
  - rule_id: a_waste
    applies_to: "dust rejects packaging and assets"
    rule: "Internal reclaim retains burden and no new procurement; rejects/wastes are not saleable coproducts by default. Evidence of an actual distinct functional output and market is required before coproduct allocation. Never reduce gross physical packaging FG gas or asset stock balances by an LCA/economic share; allocate burdens in a separately linked account."
    source_ids:
      - jrc-ceramic-bref-2007
      - ilcd-detailed-guidance-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first release net mix"
      record_type: "release and net-scale record"
      raw_fields: "unique lot IDs; first-release timestamp; net mix mass; measured moisture; gross fill and separate tare; QC result; samples consumed; released closing FG"
      collection_method: "Calibrated net weighing plus batch fill/seal/homogeneity and actual acceptance records; count each first release once. Q is supplied dry-mix net mass at recorded moisture, not an oven-dry extrapolation. Collect undivided released net kg and cohort IDs; final denominator formed only in normalize_once."
      unit: "kg"
      frequency: "each batch and period close"
      temporal_coverage: "whole reporting period including failures"
      site_scope: "actual line and QC lab"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; signed batch and acceptance evidence"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each separate supplied material"
      record_type: "batch dose and stock record"
      raw_fields: "row_id; supplier lot; whole preparation; mass or volume; original units; independent density and material packing state; assay; water; opening/closing raw WIP unassigned vectors; actual recovery and waste; receipt_or_consumption_basis; already_applied_stock_adjustment; consumed_opening_history"
      collection_method: "Weigh each whole supply and dose by lot; obtain phase and composition records. For silica volume independently measure same-state bulk volume/density with calibrated vessel and balance, packing procedure and representative sampling; no secondary coefficient density. Raw undivided exchange totals and inherited vectors only; preserve source units; final once through normalize_once."
      unit: "kg; m3"
      frequency: "each receipt batch and stock close"
      temporal_coverage: "whole reporting period"
      site_scope: "feed stores and blending line"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; dose sheets; supply assays; inventory tags"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity by operation/mode"
      record_type: "meter record"
      raw_fields: "meter and row IDs; readings; kWh or MJ; process/mode times; idle failures QC compressor extraction; supplier voltage geography; observed allocation driver"
      collection_method: "Calibrated meters/submeters; retain failed batches start stop and cleanout; distinguish utility generation and downstream consumption to avoid duplicates. Collect raw undivided meter totals; kWh conversion and allocation precede normalize_once; no quotient in collection."
      unit: "kWh; MJ"
      frequency: "each meter interval and operating mode"
      temporal_coverage: "whole reporting period"
      site_scope: "actual line and support equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration and reconciliation"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "QC and cleaning supply/discharge"
      record_type: "water and specimen record"
      raw_fields: "row IDs; gross supplied mass/volume; independent density temperature; retained liquid/structural/reaction water; specimens; spills; wastewater; condensate if real"
      collection_method: "Weigh or meter actual supply and discharge; independently analyse species and water phases/reaction stoichiometry; mass loss alone is insufficient. Raw totals without denominator; separate supply retained water reaction and exits; normalize_once only."
      unit: "kg; m3"
      frequency: "each actual test cleaning and period"
      temporal_coverage: "whole reporting period"
      site_scope: "factory QC and actual cleaning system"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and lab QA; independent phase evidence"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "each actual gas or mineral species"
      record_type: "inlet outlet and species record"
      raw_fields: "row_id; true medium; species phase CAS evidence; inlet/outlet integral volumes or real rates/time; pressure temperature humidity; composition; mass; internal circulation; particulate capture; uncertainty"
      collection_method: "Actual flow/species measurement with independent state-specific conversion; integrate rates only. PM and elemental equivalents remain subledgers, not identified species. Preserve undivided gross inlet/outlet species totals and internal paths; cancel only consolidation; normalize_once once."
      unit: "kg; m3; actual rate units"
      frequency: "representative operation including failures"
      temporal_coverage: "whole period and actual test episodes"
      site_scope: "inlet physical gate building exhaust and actual external outlets"
      aggregation_rule: "per reference flow"
      quality_evidence: "independent analytical/speciation evidence and calibration"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each separate material waste"
      record_type: "waste exit and treatment record"
      raw_fields: "row_id; exact material state contamination moisture; gross exit mass; recipient; treatment; internal reclaimed transfer; inherited burden; whole versus dismantled exit"
      collection_method: "Weigh actual waste separately with manifests and composition records; distinguish collected powder from emitted species and wastewater. Collect gross undivided exits; preserve physical totals independent of allocation; normalization once in normalize_once."
      unit: "kg"
      frequency: "each exit and period close"
      temporal_coverage: "whole period including failed production"
      site_scope: "actual waste gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh tickets; treatment chain; actual water/species QA"
    - protocol_id: cp_pack
      process_id: "packaging"
      flow_role: "each packaging article and transaction"
      record_type: "gross stock transaction ledger"
      raw_fields: "article row and transaction IDs; stage manufacture/service; original cohort; new purchase; incoming attached; external returns received; empty attached WIP FG reusable opening/closing; gross physical dispatch; outward returns; waste; ownership; independently measured tare; Radd; Rremove; independent_H2Oin; independent_H2Oout; dry_wood; free_absorbed_water; repair_identity_destination; actual_state_density"
      collection_method: "Count and independently weigh each actual article/configuration; reconcile every physical pool under b_pack. Item(s) equals item with factor1 only; do not infer article kg from capacity or secondary property. Raw undivided article-specific stock/transaction totals; no new-purchase burden on own returns/internal reuse; normalize_once selects manufacturing Q or original service Qc exactly once. Add independently measured repair material Radd/Rremove and moisture H2Oin/H2Oout per article: opening pools+P+I+ER+Radd+H2Oin = closing pools+G+EO+W+Rremove+H2Oout. Deduplicate the same water/material only when already carried by another same-side flow term of this bridge, never against closing stock or an opposite-direction flow. A specifically named atomic exchange may supply this bridge term and is not by itself a reason to set it to zero. Real influx remains when added mass is retained in closing stocks. Dry wood/material and free/absorbed water have separate ledgers; one wet residual cannot fit two unknowns. Actual fasteners/glue/other added water/material and removed outlets need specific atomic identity/destination and original Q or Qc/H ownership."
      unit: "kg; item"
      frequency: "every movement and stock close"
      temporal_coverage: "manufacturing period and stated original-cohort H"
      site_scope: "empty packaging stores line WIP FG return and waste gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock reconciliation; scale calibration; ownership and supplier invoices"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "machine part mould lining and fluid"
      record_type: "physical asset and service record"
      raw_fields: "asset/part IDs; new/used ownership; configuration net mass; opening/closing installed/loose stock; measured water/fluid; additions repairs retirement; actual service driver and period; inherited upstream burden vector; gross_receipts_returns; actual_added_material_water; removed_old_material; actual_water_loss; parent_child_disjoint_scope"
      collection_method: "Maintain independent gross physical stock balance; measure net parts/machines and fluids, with installation/removal history and observed duty. Current service burden is separate from whole physical procurement and may not be estimated from an invented life. Raw undivided physical ledger and service evidence only; do not sum a full-asset purchase and its service share twice; normalize_once applies solely to attributable current burden. Separately reconcile physical opening+actual gross receipts+independently measured added material/water = closing+outward returns+retirement/waste+wear into other recorded streams+actual water loss/other exits. Terms are disjoint; whole-asset included components/fluids are child ledgers, wear is not disposed twice, closing retention never cancels influx and physical mass is not scaled by service-burden shares."
      unit: "kg; item; actual service driver"
      frequency: "each asset event and observed interval"
      temporal_coverage: "actual manufacturing period or explicit cohort H"
      site_scope: "line lab maintenance stores"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; weigh records; actual service and repair evidence"
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "each inbound freight leg"
      record_type: "route payload record"
      raw_fields: "row_id; actual payload tonnes including packaging; distance km; mode; empty returns; provider scope; source units"
      collection_method: "Weighbill and real route for each leg; prove allocation driver before attribution and distinguish own fleet from a whole bought service. Raw payload and distance only; raw_unit_conversion forms transport work once before normalize_once; no pre-divided load."
      unit: "t; km; t*km"
      frequency: "each actual trip"
      temporal_coverage: "whole reporting period"
      site_scope: "actual delivery routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "delivery records; route; allocation and provider scope"
    - protocol_id: cp_fg
      process_id: "service"
      flow_role: "original-cohort FG movements"
      record_type: "FG stock and return record"
      raw_fields: "original first-release lot and Qc; observed H; opening and closing FG mass; gross G dispatch; gross R return; each original dispatch link; actual changed water/composition/loss; retest rework waste and internal handoffs; actual_manufacturer_permission; dry_unused_grade_compatibility; hydration_contamination_evidence; actual_rework_route; reacceptance_tests_disposition; added_material_water; removed_old_material; independent_water_loss"
      collection_method: "Trace serial lot movements with calibrated actual net weighing and measured changed condition; no assumed equality of return/original delivered mass and no new acceptance output. Raw undivided gross FG and inherited burden records; original Qc and H retained; normalize_once service branch only. Any real rework requires actual manufacturer-compatible permission for the same unused dry grade, whole formulation and terminal, followed by actual reacceptance of homogeneity, moisture/hydration state, grading, relevant bonding/workability and net fill after actual reblend/rebag. Wet/hydrated/cured/degraded returns are not assumed reversible or equivalent; determine separate applicability/disposition and state-specific waste while retaining original manufacture/Qc/H. Do not assume repairability, a pass or customer installation inside this gate."
      unit: "kg"
      frequency: "each movement and stock close"
      temporal_coverage: "explicit observed original-cohort H"
      site_scope: "warehouse dispatch and actual returns"
      aggregation_rule: "per reference flow"
      quality_evidence: "original release receipt; dispatch/return/condition evidence"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "incremental observed service energy"
      record_type: "meter task record"
      raw_fields: "row_id; original cohort Qc; H; actual meter totals; repack retest rework tasks; observed causal drivers; real packaging and waste links"
      collection_method: "Meter the actual observed service tasks only; keep original manufacturing inheritance apart from real later increments. Raw undivided service energy; conversion and attribution before normalize_once using original Qc, no current-period production denominator."
      unit: "kWh; MJ"
      frequency: "each observed task interval"
      temporal_coverage: "explicit observed H"
      site_scope: "actual warehouse and handling/retest"
      aggregation_rule: "per reference flow"
      quality_evidence: "task logs; calibration; original cohort linkage"
  calculation_rules:
    - id: raw_unit_conversion
      applies_to: "all inventory rows"
      rule: "Convert each raw extensive numerator into its row unit before attribution. kWh*3.6 gives MJ. Sum payload_t*distance_km for actual freight legs. Mass=independently measured same-substance same-state density*volume when actually needed; silica m3 retains its native reference. Integrate true rates over their recorded times only; never multiply an already integrated volume by time. Counts require independently measured article mass/configuration for kg; item and Item(s) alone differ by factor1."
      inputs:
        - raw_e
        - raw_units
        - independent_state
        - density
        - payload_t
        - distance_km
        - rate_e
        - time_e
      output: "U_e"
      source_ids:
        - almatis-alumina-spinel-castables
        - idem-vesuvius-castable-line-2003
        - lancaster-refractory-mixing
        - ilcd-detailed-guidance-2010
    - id: manufacturing_attribution
      applies_to: "manufacturing burdens"
      rule: "For each exchange vector form A_e from converted actual current loads plus opening inherited raw/WIP/unassigned-store burden minus closing unreleased raw/WIP/genuinely unassigned-store burden, using Section7 attribution. Do not subtract released closing FG already in Q. Include failures Q=0 trials idle cleanout and actual rework. Internal recycle transfers retain inheritance and cancel. Declare per exchange the receipt/occurrence or already-stock-adjusted actual consumption basis. Net-consumption material is not corrected for the same stock again; actually consumed opening material retains its upstream history and unreleased WIP/non-WIP vectors use a consistent basis. Ordinary waste transfer/sale does not automatically remove original manufacture/treatment burden; apply Section7 actual function/attribution."
      inputs:
        - U_e
        - Bopen_e
        - Bclose_e
        - allocation_e
        - cp_material
        - cp_energy
        - cp_asset
      output: "A_e"
      source_ids:
        - idem-vesuvius-castable-line-2003
        - ilcd-detailed-guidance-2010
    - id: service_attribution
      applies_to: "original-cohort services"
      rule: "Form S_e only from actual incremental storage handling secondary packaging dispatch retest rework and treatment over observed H, allocated to original cohort Qc under Section7. Keep its inherited manufacturing vector attached without reallocation, removal or new production. Changes in returned water and discarded material are explicit physical exchanges, not a net-delivery denominator or automatic reversal."
      inputs:
        - U_e
        - Qc
        - H
        - service_driver
        - cp_fg
        - cp_service
        - cp_pack
      output: "S_e"
      source_ids:
        - trent-factory-castables
        - ilcd-detailed-guidance-2010
    - id: physical_reconciliation
      applies_to: "manufacture FG service consolidation"
      rule: "Retain unallocated gross physical ledgers separately: manufacturing opening raw/WIP + actual receipts = closing unreleased raw/WIP + first-release mix + actual waste/emissions/transfers, including independent water/reaction changes. FG opening + manufacturing receipt + actual R = closing + actual G + measured losses/other exits, with explicit changed condition terms. Add internal gates then cancel matched handoffs; combine with each b_pack packaging ledger and asset/fluid balances. The mix-material subbalance excludes packaging/assets; full manufacturing, FG and consolidated gates include the separately reconciled attached packaging, asset/fluid movements and gross atmospheric carriers. No economic share shrinks these physical totals. FG actual-state mass bridge explicitly retains opening+first-release receipts+gross returns+independently added material/water = closing+gross dispatch+destruction+removed old material+independent water loss+other actual exits, with disjoint terms and carried water/material counted once. Closing retention leaves actual influx intact. Dry-supply reference quantity/original Qc remain separate from wet physical changes."
      inputs:
        - gross_receipts
        - gross_exits
        - physical_stocks
        - reaction_evidence
        - cp_release
        - cp_fg
        - cp_pack
        - cp_air
        - cp_asset
      output: "physical_gate_checks"
      source_ids:
        - almatis-alumina-spinel-castables
        - idem-vesuvius-castable-line-2003
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "This is the only final normalization. For a manufacturing burden row x_e=A_e/Q; for an observed service increment x_e=S_e/Qc over H. A gross physical-movement row instead retains its corresponding unallocated actual movement G_e and reports G_e/Q or G_e/Qc once for its tagged stage, without adding a second purchase or production reference. First-release output is exactly1 kg reference flow. Asset stock movements are physical-account entries; only attributable current service vectors enter A_e/S_e, never a full-asset purchase plus its service share. No unit result when the relevant denominator is zero: retain actual loads and unresolved carry-forward fate. Cards and aggregation refer to this same single result, never divide it again."
      inputs:
        - A_e
        - S_e
        - G_e
        - Q
        - Qc
        - H
        - stage_e
        - cp_release
      output: "x_e"
      source_ids:
        - idem-vesuvius-castable-line-2003
        - ilcd-detailed-guidance-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
