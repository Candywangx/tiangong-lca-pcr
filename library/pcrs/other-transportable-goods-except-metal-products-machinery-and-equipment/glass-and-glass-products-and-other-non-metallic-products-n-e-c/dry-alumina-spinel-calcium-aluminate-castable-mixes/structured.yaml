system_boundary:
  rules:
    - rule_id: b_manufacture
      applies_to: "manufacturing gate"
      rule: "Include actual receiving transport sampling raw-material conditioning/sizing when performed dosing dry mixing transfer dedusting filling/sealing QC specimen preparation testing and first final release. Already dried/graded feed is a valid starting supply, but does not remove factory batching/mixing. Do not import the adjacent tar-taphole process or every plant dryer into the castable line."
      source_ids:
        - idem-vesuvius-castable-line-2003
        - lancaster-refractory-mixing
        - trent-factory-castables
        - trent-castable-testing
    - rule_id: b_terminal
      applies_to: "supplied-state applicability"
      rule: "The output is a complete dry uninstalled formulation, not a single oxide or installed lining. Keep customer water addition casting curing initial lining dry-out and use outside this gate, while including actual factory test-water specimen heating tests and waste. No source proves a common recipe, same manufacturer or blanket interchangeability of CAC and hydratable/sol binders."
      source_ids:
        - almatis-alumina-spinel-castables
        - idem-vesuvius-castable-line-2003
        - trent-factory-castables
        - trent-castable-testing
    - rule_id: b_supply
      applies_to: "whole supplied preparations"
      rule: "Purchase each actual whole preparation only once; its carrier water active ingredient and assay fractions are subledgers. If prepared on site, retain each real purchased substance and preparation energy/loss. Real unlisted ingredients fuel heat cleaning agents species or wastes require separate atomic rows before modelling; zero and other cannot hide them."
      source_ids:
        - almatis-alumina-spinel-castables
        - idem-vesuvius-castable-line-2003
        - lancaster-refractory-mixing
    - rule_id: b_q
      applies_to: "first-release accounting"
      rule: "Q is unique actual net as-released dry-mix mass at first final batch acceptance; exclude bag/liner/pallet mass and samples already consumed. Include newly released closing FG in Q once. Manufacturing closing inherited burden contains only unreleased raw/WIP and genuinely unassigned non-WIP stores, never already released FG; do not subtract released closing-FG manufacturing load or add that FG as a second output. All failure zero-output startup shutdown idle cleanout trial and rework loads remain."
      source_ids:
        - idem-vesuvius-castable-line-2003
        - trent-factory-castables
        - ilcd-detailed-guidance-2010
    - rule_id: b_service
      applies_to: "released cohort"
      rule: "Keep manufacturing burden attached to its first-release cohort. Later warehouse handling secondary packing dispatch return retest and incremental rework are observed services on original cohort Qc over explicit H; no assumed lifetime. Actual return mass/state and original dispatch are traced independently. This is not net-delivery normalization: delivery and reacceptance create no new Q and no automatic historical manufacture reversal."
      source_ids:
        - trent-factory-castables
        - ilcd-detailed-guidance-2010
    - rule_id: b_water_air
      applies_to: "physical and species gates"
      rule: "Reconcile independent whole physical mass and relevant Al Mg Ca Si H O balances at manufacturing FG service and consolidated gates. Actual neutral gas species inlet/outlet and each particulate phase stay separate from PM/VOC/COD indicators. Free liquid moisture atmospheric vapour crystal/structural water reaction water and true condensate are distinct; one residual cannot fit two unknowns. Integral gas/liquid volumes are not multiplied by time again; only actual rates are integrated, with substance/state-specific density."
      source_ids:
        - almatis-alumina-spinel-castables
        - idem-vesuvius-castable-line-2003
        - lancaster-refractory-mixing
        - ilcd-detailed-guidance-2010
    - rule_id: b_heat_assets
      applies_to: "actual utilities and assets"
      rule: "No steam/boiler is assumed for a dry electric blending line. If real purchased heat/steam occurs, add the specific carrier and external condensate/hot-water Product return with measured mass actual thermodynamic state enthalpy and supplier water/energy convention; do not duplicate carrier mass as a second whole-provider purchase. Separate gross new/used machines tools moulds linings maintenance parts and installed fluids from current observed service burdens; no fixed lifetime or whole machine per kg."
      source_ids:
        - idem-vesuvius-castable-line-2003
        - lancaster-refractory-mixing
        - ilcd-detailed-guidance-2010
    - rule_id: b_pack
      applies_to: "each packaging article"
      rule: "For each distinct article independently: opening empty + attached WIP/FG + reusable pools + new purchase + incoming attached + external return received = closing corresponding pools + gross dispatch outward + external return outward + waste. Cancel internal reuse/transfers; exclude packaging from Q. Keep new procurement and inherited packaging burdens distinct from gross physical movements, without economic shrinkage or automatic coproduct/credit. Integral bought components enter once. Add independently measured repair material Radd/Rremove and moisture H2Oin/H2Oout per article: opening pools+P+I+ER+Radd+H2Oin = closing pools+G+EO+W+Rremove+H2Oout. Deduplicate the same water/material only when already carried by another same-side flow term of this bridge, never against closing stock or an opposite-direction flow. A specifically named atomic exchange may supply this bridge term and is not by itself a reason to set it to zero. Real influx remains when added mass is retained in closing stocks. Dry wood/material and free/absorbed water have separate ledgers; one wet residual cannot fit two unknowns. Actual fasteners/glue/other added water/material and removed outlets need specific atomic identity/destination and original Q or Qc/H ownership."
      source_ids:
        - idem-vesuvius-castable-line-2003
        - jrc-ceramic-bref-2007
        - trent-factory-castables
        - ilcd-detailed-guidance-2010
