t actual record coverage, zero/absent/unknown distinctions, raw units and conversion evidence, species speciation, cohort histories, provider ownership and uncertainty. Source context provides methodology, not a factory recipe or default range; no fixed thickness/moisture/strength/fire/thermal/acoustic/lifetime is adopted. Record every unresolved exchange identity and missing empirical range; no claim of completed scientific/translation review follows from engineering checks. | `epa-gypsum-1993`; `grenzebach-gypsum-solutions`; `ilcd-detailed-2010` |\n\n"
