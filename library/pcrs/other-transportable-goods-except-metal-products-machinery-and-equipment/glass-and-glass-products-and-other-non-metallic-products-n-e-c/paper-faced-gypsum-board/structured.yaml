measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q = sum of measured net masses of the whole boards first released in the declared cohort; calibrated weighing excludes shipping packaging and records actual moisture state. Once released, retained FG is already included in Q."
  - id: native_energy
    applies_to: "energy rows"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve native extensive energy quantity for electricity. Convert raw kWh to MJ using the exact dimensional identity 1 kWh = 3.6 MJ before attribution; do not apply Mass/kg requirements to an energy numerator. Fuel mass and heat content remain separate linked subledgers."
  - id: actual_area
    applies_to: "geometry disclosure"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "Record the sum of actual single-face projected outlines. L times W is valid only for verified rectangles; nonrectangular/cutout shapes use measured or traceable drawing-specific geometry. No bounding box, doubled faces, nominal thickness-derived density or secondary-property factor substitutes for independent mass/area measurements."
  - id: raw_volume
    applies_to: "volume conversion"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Distinguish cumulative volume from a rate: use a total once and integrate only genuine rates. Convert gas or liquid total volume with independent density for that same substance and actual temperature/pressure/composition/wet state; never assume water density for another material."
  - id: native_count
    applies_to: "asset/count disclosure"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Item(s) and item represent the same physical count with factor 1; they do not imply kg per item. If converting a board count to mass, measure net M for the same complete configuration/conditioning state on a calibrated scale with sampling scope and uncertainty. Asset count is physical stock; current asset service is a separate burden fraction."
  - id: phase_water
    applies_to: "water phase and composition"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure free moisture independently from hemihydrate/dihydrate/anhydrite phase fractions and reaction extent using suitable phase-sensitive analysis. Preserve supplied formulation carrier water and structural water as composition subledgers; unknown phase is not an invented separate water exchange."
