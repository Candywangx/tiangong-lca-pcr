          markdown: "# Paper-faced gypsum board manufacture from purchased stucco\n\nThis PCR applies only to whole ordinary paper-faced gypsum board made from whole purchased calcined stucco with direct natural-gas drying. It covers a real manufacture route through first quality release and the actual disclosed subsequent cohort services. It does not set a recipe, board thickness, moisture limit, performance class or lifetime. The source-supported route and the accounting identities below are transparent technical synthesis, not measured production quantities or proof of one contemporary order. All conditions in this document and each flow-card description remain applicable together.\n\n"
    - unit_id: "normative_190895"
      family: "allocation"
      span:
