allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "These rules address justified attributional multifunctional processes only; no free choice between arbitrary physical and economic fractions. Preserve all source and document ancestor conditions."
    source_ids: []
  - rule_id: a_context
    applies_to: "study framework"
    rule: "Use this hierarchy only in justified attributional modelling where allocation applies; identify decision context and explain why substitution/system expansion is not the applicable solution. Industrial manufacturing sources do not establish LCA allocation."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_subdivide
    applies_to: "shared operations"
    rule: "First collect dedicated operations; subdivide physically separable operations and virtually subdivide exchange-specific dedicated materials/services. Record failed and idle loads in their causing cohort. Avoid allocating an entire mixed plant as one black box when its actual operations can be separated."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_causality
    applies_to: "remaining individual exchanges"
    rule: "For each genuinely remaining shared exchange identify its determining physical causality and justified relationship to each function; capacity-limiting area/volume/time/mass need evidence. Different exchanges may require different causes. Board dry mass or market price is never an arbitrary universal coefficient."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_residual_value
    applies_to: "irreducible common-process remainder"
    rule: "Only a genuine remainder without determining physical attribution may use contemporaneous market value at the same real common-process gate and actual moisture/quality/bulk state. Correct downstream transport, conditioning, packaging and processing differences; document values, denominator and sensitivity. Do not set fixed proportions or automatic credit; zero/negative or missing values require specific review."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_waste
    applies_to: "rejects and external transfers"
    rule: "Ordinary rejects, manufacturing waste, breakage and quality samples retain their manufacturing and treatment burden even if sold or sent away. T_j is allowed once only for a real distinct cohort/function with a justified allocation or burden-handover decision and receipt; it is not physical waste mass times an economic share. Internal recycling gives neither new upstream purchase nor avoided-product credit."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_assets
    applies_to: "capital and services"
    rule: "Keep physical machinery/parts/installed-fluid stocks separate from current service-burden attribution. Use measured actual service use and a documented charge denominator with prior unused/unassigned charge carried forward; no fabricated lifetime, future factory quantity, or one entire machine per kg. A complete outsourced/rental service and its already included fuel, capital and maintenance cannot both be charged."
    source_ids:
      - ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "p_board"
      flow_role: "Each whole supplied raw material"
      record_type: "weighing_and_receipt"
      raw_fields: "row_id; cohort_id; stage; timestamp; material/chemical identity; supplier; native raw unit; gross actual quantity; measurement state; opening stock; closing stock; status; uncertainty; unused/non-WIP stores each full physical quantity and inherited exchange vector; gross receipt versus already-net consumption flag and prior stock-correction evidence ; stage_internal_in; stage_internal_out; matched_transfer_id; inherited_vector_coordinates"
      collection_method: "Use calibrated scales and supplier/receipt/BOM records for each real article; assay free water, phases and formulation components independently. Preserve both real incoming amount and closing wet-state stock. Do not collect a normalized value. Raw aggregation condition: Retain raw totals by row and cohort; collect only un-divided raw fields for convert_raw and attribute_vector  Retain raw/WIP/non-WIP physical quantities separately from every inherited exchange history; do not repeat a stock correction on a quantity/vector already reconciled as net consumption. Record stage_internal_in and stage_internal_out as matched same-event physical transfers and inherited exchange vectors, retaining row, provider, property/unit, gate, phase, period and cohort coordinates; cancel only the matched pair at the combined boundary. Actual hydration formation/consumption remains in its species/phase subledger, not a second external receipt. First WIP-to-FG acceptance enters accepted_production once; all other FG transfers are mutually exclusive and retain original Q, so a stock movement never repeats first acceptance."
      unit: "kg"
      frequency: "Each delivery/batch and inventory opening/close"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Actual supply/storage/dosing/mixer gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; delivery; composition; ownership and reconciliation records"
    - protocol_id: cp_water
      process_id: "p_board"
      flow_role: "Separately added liquid mixing water"
      record_type: "meter_and_density"
      raw_fields: "row_id; cohort_id; cumulative_volume; mass_if_weighed; temperature; pressure; independent_density; meter_start; meter_end; unit; carrier_water_already_in_supplies"
      collection_method: "Measure separately supplied water; record cumulative totals or actual rate logs distinctly and independently determine density at the same state. Do not infer density from a flow secondary factor. Raw aggregation condition: Retain raw volume/mass and density without division; convert_raw produces extensive kg once"
      unit: "kg"
      frequency: "Each meter interval and batch"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Actual water inlet and mixing gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; density method/state; carrier-water de-duplication"
