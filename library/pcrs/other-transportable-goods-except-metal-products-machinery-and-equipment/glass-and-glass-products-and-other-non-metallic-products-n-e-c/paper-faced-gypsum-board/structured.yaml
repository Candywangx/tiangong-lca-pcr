      collection_method: "Use matched-state volumetric/mass monitoring and actual species analysis; collect true intervals and total air separately for dryer and handling. Separate filter inlet/captured material/outlet, atmospheric pass-through, fuel-generated species and water sources. Unknown species stays unknown; indicators never fill its chemical mass. Raw aggregation condition: Preserve raw gas totals/rates and analytical results; integrate only rates in convert_raw; attribute without scaling physical gross ledgers"
      unit: "kg"
      frequency: "Each representative actual operating state with full-horizon integration"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Real inlet/outlet with location and medium"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Speciation QA/QC; dry/wet consistency; independent gas state; balance residuals"
    - protocol_id: cp_gas_dispatch
      process_id: "p_dispatch"
      flow_role: "Every distinct inlet/outlet gas species"
      record_type: "species_measurement"
      raw_fields: "row_id; cohort_id; outlet/inlet; chemical_name; CAS; phase; compartment; cumulative_gas_volume; rate_if_actual; time_interval_if_rate; temperature; pressure; wet_or_dry_basis; humidity; species_fraction; independent_density_or_molar_state; background_origin; control_device; uncertainty; source_process/event/cohort; normal FG/package sorption/condensation/desorption/evaporation; non-additive package water child IDs; original Q/H"
      collection_method: "Use matched-state volumetric/mass monitoring and actual species analysis; collect true intervals and total air separately for dryer and handling. Separate filter inlet/captured material/outlet, atmospheric pass-through, fuel-generated species and water sources. Unknown species stays unknown; indicators never fill its chemical mass. Raw aggregation condition: Preserve raw gas totals/rates and analytical results; integrate only rates in convert_raw; attribute without scaling physical gross ledgers Actual ordinary gaseous H2O intake includes independently observed sorption/condensation during normal FG/package storage/handling and actual work, not only combustion air. Record disjoint source-process/event/cohort and package/component-water subaccounts once; no repair event or permission is needed for natural humidity. Separate supplied article water, free/sorbed water and measured structural/reaction phase change; no mass/Volume conversion or water fraction from one residual. Actual ordinary H2O vapour output includes independently observed desorption/evaporation from FG/packages during normal storage/handling or actual work, not only handling-engine exhaust. Match real source/event and true air medium; do not duplicate the same emission in a package subaccount, liquid/wet-waste outlet or structural-water inference. Natural moisture change needs no repair; retain original Q/H and full wet stocks."
      unit: "kg"
      frequency: "Each representative actual operating state with full-horizon integration"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Real inlet/outlet with location and medium"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Speciation QA/QC; dry/wet consistency; independent gas state; balance residuals"
    - protocol_id: cp_release
      process_id: "p_board"
      flow_role: "Whole accepted board and Q"
      record_type: "acceptance_and_net_weighing"
      raw_fields: "cohort_id; configuration; board_id; first_release_timestamp; net_mass; packaging_tare; moisture_condition; phase_assay; acceptance_spec; test_result; pass_fail; actual_single_face_area; shape; traceable_drawing; measured_thickness; measured_count; M_if_count_conversion; calibration; original_release_flag"
      collection_method: "Weigh accepted whole boards excluding removable packaging on calibrated equipment. Retain manufacturer specification and actual dimensional, paper/core integrity and applicable performance test records; do not infer an unperformed test. Measure geometry independently. Flag original first release; later retest/dispatch/returns cannot be recounted. Raw aggregation condition: Collect raw accepted net mass and original release flags; release_q sums only new first-release masses once; include closing accepted FG"
      unit: "kg"
      frequency: "Each acceptance lot/board and cohort closure"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Selected first manufacturing quality gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated scale; measured geometry; permission/specification; tests; release and rejection records"
    - protocol_id: cp_waste
      process_id: "p_board"
      flow_role: "Each actual production waste or sample"
      record_type: "weighing_and_disposition"
      raw_fields: "row_id; cohort_id; wet_mass; independent_moisture; phase/composition; destination; treatment; transport; sale_if_any; internal_return; burden_owner; distinct_function_decision_if_any"
      collection_method: "Weigh separately each actual stream; match transfer/treatment tickets and reject/sample/cleanup registers. Keep all associated treatment loads and internal-loop trace; no sale-based automatic deduction. Raw aggregation condition: Collect gross raw quantities and owner evidence; no division and no economic scaling of physical mass"
      unit: "kg"
      frequency: "Each waste movement and cohort close"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Actual manufacturing and treatment gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale tickets; analysis; disposal/treatment receipts; rejection logs"
    - protocol_id: cp_pack
      process_id: "p_dispatch"
      flow_role: "Each separate packaging article"
      record_type: "packaging_six_leg_stock"
      raw_fields: "material_id; cohort_id; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; P_purchased; I_supplier_ingress; ER_external_return_received; S_gross_shipment; EO_external_return_out; W_waste; closing_empty; closing_attached_WIP; closing_attached_FG; closing_reusable; wet_state; X_in_by_species; X_out_by_species; upstream_owner; internal_reuse; row_id; actual distinct external event and gate; article/component assembly bridge and paired handoff; independent per-origin W raw quantities and mixed outlet total, non-additive total OR partition; actual receiver/treatment owner ; bundled_paid_P; first_nonpurchased_N_ext; I_nonadditive_child; same_item_prior_outward_id; payment_and_owner_evidence"
      collection_method: "Weigh each actual tape/strap/film/riser/guard and all other real ingress packages with stock and dispatch records. Identify supplied whole-article components and each separately entering repair/water species. Supplier-included packaging is physical input even when its upstream burden is already in supplier data. Raw aggregation condition: Retain all gross P/N_ext/ER/S/EO/W with I non-additive within N_ext and full wet stocks; packaging_balance checks once. Internal reuse cancels and X terms only de-duplicate against other incoming/outgoing terms  X overlap evidence must name another same-direction material/water flow term; opening/closing stocks cannot serve as an overlap deduction. Whole supplied wet packaging counts included substrate/liner/adhesive/coating/hardware and water once as measured child accounts. Truly separately purchased onsite components have independent receipts/owners only when disjoint from the whole article, or through a measured component-to-assembly bridge with matched internal handoff cancellation. Never add complete assembled tare and those same constituent supplies twice. Retain true extra ingress and full wet closing stock simultaneously. One actual collected mixed packaging outlet uses one qualified whole-mixture Waste exchange and one real treatment/provider record. Its independently measured per-origin W raw accounts must conserve the total with uncertainty; total OR partition are alternatives, never additive exits. Existing material W cards are non-additive origin children for that event, not fabricated separate outlets. Real separate outlets retain their own correct Waste identities/treatment. Add/reselect a specific compatible mixed Waste only when the real outlet exists, not for six-leg symmetry. For every component use mutually exclusive receipt classifications: P includes separately paid and bundled paid acquisition; N_ext is first non-purchased external acquisition, with non-paid supplier-included I recorded as a non-additive child. Other first non-purchased ingress has its own specific conditional row only when observed, not ER or an outgoing leg. ER requires the same item prior outward event; EO is a real distinct external return out. Unknown payment, prior history or ownership stays unresolved. Retain each gross event and complete wet stocks; P/I/N_ext/ER do not imply a second upstream provider or automatic credit."
      unit: "kg"
      frequency: "Each receipt/shipment/return/waste and stock opening/close"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Manufacturing ingress through actual service horizon"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Receipt/shipment IDs; supplier scope; wet-state weights; species ledger; reusable movement"
    - protocol_id: cp_cohort
      process_id: "p_dispatch"
      flow_role: "Accepted FG and original service history"
      record_type: "cohort_stock_and_service"
      raw_fields: "original_cohort; original_Q; manufacturing_vector_id; service_horizon; opening_FG; first_release_in; gross_G; gross_R; original_shipment_link; added_water/material; actual_losses; closing_FG; rejects; samples; postwork_permission; postwork_tests; acceptance; disposition; performed_service; unused_unassigned_charge; added and removed new/old material and parts; free/carrier/crystal/reaction water phases; labelled repair-held FG or disjoint repair-WIP; actual maker/specification permission; post-work tests; acceptance/rejection and final destination ; accepted_production; other_FG_transfers; mutually_exclusive_event_id"
      collection_method: "Reconcile exact original board/cohort and all FG movements; preserve original manufacturing vectors for traceability without charging them again. New service has its own real horizon and original Q. Actual postrelease work requires permission/tests/disposition; returns need no fictitious same-mass original delivery or new release. Raw aggregation condition: Record raw physical G/R/stocks and performed-service quantities; original Q is only a link here; do not normalize in protocol or carry performed service as unused  Independently measure actual post-work additions/removals and wet custody states; retain each once with original-cohort vectors. Verify actual maker/specification permission and tests/acceptance/disposition without assuming hardened or damaged paper/core restores. Every actually occurred post-release operation, including unauthorized/unapproved, failed or rejected work, and all actual material/water/energy/loss/waste/burdens are collected under original Q and observed H. Manufacturer/specification permission, configuration-specific posttests and acceptance govern authorization, continued qualification and actual hold/rejection/disposition only, never deletion of an occurred load. No new Q, assumed repair/restoration or route authorization follows. Record stage_internal_in and stage_internal_out as matched same-event physical transfers and inherited exchange vectors, retaining row, provider, property/unit, gate, phase, period and cohort coordinates; cancel only the matched pair at the combined boundary. Actual hydration formation/consumption remains in its species/phase subledger, not a second external receipt. First WIP-to-FG acceptance enters accepted_production once; all other FG transfers are mutually exclusive and retain original Q, so a stock movement never repeats first acceptance."
      unit: "kg"
      frequency: "Each FG/service event and horizon close"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Original release cohort and real warehouse/service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original release/shipment IDs; stock reconciliation; permission and test records"
    - protocol_id: cp_repair
      process_id: "p_support"
      flow_role: "Each new/old part and actual water phase"
      record_type: "installed_stock_and_movements"
      raw_fields: "row_id; equipment_id; cohort_id; opening_installed_wet_mass; new_purchase; old_removed; external_return_in; external_return_out; real_X_in; real_X_out; closing_installed_wet_mass; composition; water_phase; temperature; enthalpy_if_heat_interface; supplier_water_energy_owner; waste_treatment; actual source_process and original Q/H; authorization/result/hold/disposition; complete gross carrier Product supply/return V_j; thermal state/provider ownership; disjoint repair-custody stock"
      collection_method: "Record individual physical new/old parts and fluid additions/removals on calibrated scales/meters with independent composition/moisture. Keep complete closing wet mass plus actual incoming additions even if retained. X terms only remove duplication with other incoming/outgoing terms, never with a stock term. Raw aggregation condition: Retain gross legs and installed wet stocks; assign current maintenance/service once without subtracting a performed service because FG is retained For actual cooling-water/heat-carrier Product supply and external Product return, the physical numerator is the independently measured full gross native-unit leg V_j, so this same normalization gives V_j/Q for manufacture or V_j/original Q for the observed service horizon. It is not a stock-corrected water consumption, attributed heat burden or economic/service share. Keep the independent attributable supplier/service burden and carrier mass/phase/P/T/enthalpy separately with one provider; no added purchase, boiler/steam system or return credit is implied. Every actually occurred post-release operation, including unauthorized/unapproved, failed or rejected work, and all actual material/water/energy/loss/waste/burdens are collected under original Q and observed H. Manufacturer/specification permission, configuration-specific posttests and acceptance govern authorization, continued qualification and actual hold/rejection/disposition only, never deletion of an occurred load. No new Q, assumed repair/restoration or route authorization follows."
      unit: "kg"
      frequency: "Each maintenance/fluid/water movement and period stock"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Real installed equipment and external water-return gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Work orders; new/old weights; independent water analyses; provider agreement; treatment"
    - protocol_id: cp_asset
      process_id: "p_support"
      flow_role: "Each physical machine and current service charge"
      record_type: "asset_stock_and_service"
      raw_fields: "asset_id; configuration; opening_items; purchased_items; transferred_in; transferred_out; retired_items; closing_items; prior_unassigned_burden_vector; actual_service_use; service_capacity_basis; assigned_current_share; remaining_unassigned_charge; repair_overlap; provider_scope"
      collection_method: "Audit physical asset stock independently of service attribution. Document actual service records, charge basis, uncertainty and remaining capacity/charge without fabricating a lifetime or future output. Subdivide dedication before sharing; match no double-counted complete provider. Raw aggregation condition: Collect physical item legs plus independent raw service use/charge fields; current justified service equivalent enters attribute_vector once; no normalization in collection"
      unit: "item"
      frequency: "Each asset event and service interval"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Actual individual asset and original manufacturing/service cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Asset register; service/charge derivation; uncertainty; installed-fluid and repair reconciliation"
    - protocol_id: cp_phase
      process_id: "p_board"
      flow_role: "Independent phase/free-water and reaction evidence"
      record_type: "phase_sensitive_measurements"
      raw_fields: "sample_id; batch; wet_mass; free_moisture_method; phase_sensitive_method; hemihydrate; dihydrate; anhydrite; reaction_extent; independent_evaporation; combustion_water; paper/formulation_water; dissolved_species; uncertainty"
      collection_method: "Use validated free-moisture and phase-sensitive methods such as appropriately separated XRD/TGA/DSC analyses; avoid inadvertently counting analytical dehydration as free moisture. Measure phase transformation and evaporation independently at feed, wet set board, dryer and released product. Raw aggregation condition: Retain raw measurements and uncertainty; phase_balance checks independently from total physical mass; no residual fitting of multiple unknowns"
      unit: "kg"
      frequency: "Each material/phase-changing state and representative batch"
      temporal_coverage: "Full declared cohort plus associated startup/idle/cleanup and original service observation horizon"
      site_scope: "Actual slurry/setting/dryer/release gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Validated phase/moisture methods; representative sampling; calibration; analytical uncertainty"
  calculation_rules:
    - id: convert_raw
      applies_to: "every raw exchange"
      rule: "First preserve observed raw units. Convert cumulative quantity once to the row native extensive unit; for genuine rates sum rate times its measured interval. For electricity E_MJ = E_kWh * 3.6. For a gas/liquid cumulative V, mass = V * independent_same_state_density. Composition and carrier mass/energy remain subledgers; no Q division occurs here."
      inputs:
        - raw_quantity
        - raw_unit
        - true_rate_interval
        - independently_measured_state_and_density
        - composition
      output: "R_j_native_raw; gross_physical_leg"
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
    - id: release_q
      applies_to: "new accepted whole-board cohort"
      rule: "Q = sum(new_first_release_net_mass). Include newly accepted closing FG. Exclude packaging and unreleased failed/sample mass. Existing released stock, returns, retests and dispatch do not increase Q. For count conversion use independently measured same-configuration net M and actual count before summation; never use a native secondary coefficient as M."
      inputs:
        - "cp_release net masses"
        - "original release flags"
        - "actual configuration"
        - "independently measured M if needed"
      output: "Q in kg; one original manufacturing cohort"
      source_ids:
        - ga-making-gypsum-board
        - ga-gypsum-board-identity
    - id: attribute_vector
      applies_to: "each extensive inventory coordinate j"
      rule: "A_j = Bopen_j + R_j + Sperformed_j - Bclose_j - Tlegitimate_j. R_j is converted current manufacturing activity with real justified attribution applied once; Sperformed_j is actual performed post-release service assigned to the original cohort/horizon. Each raw receipt or service event enters exactly one of R_j and Sperformed_j, never both; retain gross physical activity separately. Bopen/Bclose carry each exchange inherited raw/WIP vector and unused/unassigned service or material charge. Manufacturing Bclose excludes released FG; performed original-cohort service is not unused. Tlegitimate requires the distinct-function/cohort decision and receipt under a_waste. Already stock-corrected R is not stock-corrected again. Trace internally returned material vectors without double entry. Physical custody, packaging legs, physical asset movements, and actual cooling-water/carrier Product supply/return coordinates instead use full independent V_j for the same normalization, without changing the separately assigned burden vector. Every actually occurred post-release operation, including unauthorized/unapproved, failed or rejected work, and all actual material/water/energy/loss/waste/burdens are collected under original Q and observed H. Manufacturer/specification permission, configuration-specific posttests and acceptance govern authorization, continued qualification and actual hold/rejection/disposition only, never deletion of an occurred load. No new Q, assumed repair/restoration or route authorization follows."
      inputs:
        - Bopen_j
        - converted_raw_R_j
        - justified_attribution
        - Sperformed_j
        - Bclose_j
        - Tlegitimate_j
        - inherited_vectors
      output: "Unnormalized attributed A_j vector; separate gross physical ledger"
      source_ids:
        - ilcd-detailed-2010
    - id: normalize_once
      applies_to: "each nonreference inventory row j"
      rule: "q_j = A_j / Q; A_j = attributed extensive amount for the original cohort in the row native numerator unit; q_j = that amount per 1 kg reference flow. Execute this normalization once only when Q > 0. For post-release services use the linked original cohort Q and disclose the actual service horizon. The finished reference row is the 1 kg identity. Flow cards and aggregation only reference this same result; they do not divide again. At Q = 0 retain raw loads/stocks and issue no unit result. For an occurrence explicitly reporting physical custody/acquisition/removal (FG receipt/gross dispatch/return, packaging/waste legs or asset movements), use its independently measured unallocated gross native-unit movement as A_j for this same single division by original Q; it is a physical movement per Q, not an attributed burden vector. Label that basis and retain the absolute gross ledger separately. Do not stock-correct or economically scale that gross leg. Actual asset-service rows keep only their documented service burden; a full physical acquisition/charge is not service, a new purchase on reuse, or an automatic credit/transfer. For actual cooling-water/heat-carrier Product supply and external Product return, the physical numerator is the independently measured full gross native-unit leg V_j, so this same normalization gives V_j/Q for manufacture or V_j/original Q for the observed service horizon. It is not a stock-corrected water consumption, attributed heat burden or economic/service share. Keep the independent attributable supplier/service burden and carrier mass/phase/P/T/enthalpy separately with one provider; no added purchase, boiler/steam system or return credit is implied."
      inputs:
        - A_j
        - Q
        - original_cohort_id
        - service_horizon_if_applicable
      output: "q_j in row-native numerator unit per 1 kg whole first-released board"
      source_ids:
        - ilcd-detailed-2010
    - id: phase_balance
      applies_to: "each actual sulfate/phase/water state"
      rule: "For independently measured molar hemihydrate conversion extent xi_H, CaSO4·0.5H2O + 1.5 H2O becomes CaSO4·2H2O; any actual anhydrite hydration needs its own measured extent xi_A and 2 H2O per CaSO4. Independently measure actual reverse dehydration where present. Retain free, structural, reaction and carrier water separately as state/composition subledgers without a second purchase. Total physical mass and Ca/S/H/O/C balances do not establish the unknown extents or evaporated water."
      inputs:
        - cp_phase
        - "independently measured phase amounts/extents"
        - "free moisture"
        - "supplied component water"
        - "measured evaporation"
        - "combustion species"
      output: "Separate phase/species/water checks and unresolved residuals"
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
    - id: physical_gates
      applies_to: "manufacturing/FG/combined boundaries"
      rule: "At each physical gate, opening complete wet material/installed stocks + gross external incoming species + true internal incoming = closing complete wet stocks + gross external outgoing species + true internal outgoing. At manufacture the internal board output is Q; at FG the same Q is incoming and closing FG is real stock. Cancel that internal Q and internal reuse at combined gate only. Include actual returned mass, added water/material, real losses, repair/asset legs and carrier water; do not substitute burden shares or assume return mass equals an original delivery. Record stage_internal_in and stage_internal_out as matched same-event physical transfers and inherited exchange vectors, retaining row, provider, property/unit, gate, phase, period and cohort coordinates; cancel only the matched pair at the combined boundary. Actual hydration formation/consumption remains in its species/phase subledger, not a second external receipt. First WIP-to-FG acceptance enters accepted_production once; all other FG transfers are mutually exclusive and retain original Q, so a stock movement never repeats first acceptance."
      inputs:
        - "all gross physical legs"
        - "opening/closing raw/WIP/FG/installed/reusable stocks"
        - "internal link IDs"
      output: "Independent gate closure and species/element residuals; no fitted missing flows"
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
        - ilcd-detailed-2010
    - id: packaging_balance
      applies_to: "each individual actual packaging material"
      rule: "O_empty + O_WIP + O_FG + O_reusable + P + N_ext + ER + X_in = C_empty + C_WIP + C_FG + C_reusable + S + EO + W + X_out. P is actual purchased packaging including bundled paid supply; N_ext is first non-purchased external ingress and includes non-paid supplier-included I once, never plus I again. ER is genuine external return received with same-item prior outward evidence; S accompanies gross physical shipments; EO is external return sent; W is real waste. X is actual separately entering/leaving repair matter or water by species, removed only when already in another incoming/outgoing term. Preserve real new input and full closing wet mass simultaneously. Internal reuse cancels; no packaging enters net board Q. Deduplicate X only against the same species/material already represented in another same-direction flow term, never against opening/closing stock. Whole actual wet P/I article ingress has one physical receipt and one upstream owner; actual retained repair matter/water remains both in input and in the complete wet closing stock. Whole supplied wet packaging counts included substrate/liner/adhesive/coating/hardware and water once as measured child accounts. Truly separately purchased onsite components have independent receipts/owners only when disjoint from the whole article, or through a measured component-to-assembly bridge with matched internal handoff cancellation. Never add complete assembled tare and those same constituent supplies twice. Retain true extra ingress and full wet closing stock simultaneously. One actual collected mixed packaging outlet uses one qualified whole-mixture Waste exchange and one real treatment/provider record. Its independently measured per-origin W raw accounts must conserve the total with uncertainty; total OR partition are alternatives, never additive exits. Existing material W cards are non-additive origin children for that event, not fabricated separate outlets. Real separate outlets retain their own correct Waste identities/treatment. Add/reselect a specific compatible mixed Waste only when the real outlet exists, not for six-leg symmetry. For every component use mutually exclusive receipt classifications: P includes separately paid and bundled paid acquisition; N_ext is first non-purchased external acquisition, with non-paid supplier-included I recorded as a non-additive child. Other first non-purchased ingress has its own specific conditional row only when observed, not ER or an outgoing leg. ER requires the same item prior outward event; EO is a real distinct external return out. Unknown payment, prior history or ownership stays unresolved. Retain each gross event and complete wet stocks; P/I/N_ext/ER do not imply a second upstream provider or automatic credit."
      inputs:
        - "cp_pack six legs"
        - "each opening/closing state"
        - "actual X species and de-duplication links"
      output: "Each packaging physical closure; one upstream burden owner; no automatic coproduct"
      source_ids:
        - ga-making-gypsum-board
        - ilcd-detailed-2010
    - id: asset_service
      applies_to: "each asset and each installed fluid/repair item"
      rule: "Physical asset O + purchases + transfers_in = C + transfers_out + retirements, using complete actual item configuration. For every new/old repair material and water phase apply the corresponding wet-mass equation with actual X_in/X_out; de-duplicate X only with other real incoming/outgoing terms. Current justified service charge is assigned by dedicated use then the allocation hierarchy; carry only unused/unassigned charge, without replacing full closing physical stock with a burden share."
      inputs:
        - "cp_asset physical items and service fields"
        - "cp_repair wet-state legs"
        - "actual allocation decision"
      output: "Separate complete physical stocks and once-attributed current service vector"
      source_ids:
        - ilcd-detailed-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Whole supplied article and every native restriction must match actual product/route. Keep each unresolved auxiliary identity and provider compatibility condition explicit."
      evidence: "Native identity/profile; supplier composition; actual process and provider boundary"
    - id: dq_measurement
      applies_to: "all quantities"
      requirement: "Retain calibrated raw totals, actual rate intervals, independent densities and same-configuration geometry/mass/count evidence; report sampling and uncertainty. No numerical site quantities are fabricated here."
      evidence: "cp_release; cp_water; cp_energy_mj_board; cp_energy_mj_dispatch; cp_energy_kg_board; cp_energy_kg_dispatch; cp_gas_board; cp_gas_dispatch"
    - id: dq_cohorts
      applies_to: "every gate and service"
      requirement: "Full zero-output/failed/startstop/idle/cleanup/rework history, raw/WIP inheritance vectors and exact first-release FG bridge; performed original service stays charged when FG remains."
      evidence: "Opening/closing physical and vector ledgers; original release/shipment IDs; service horizon"
    - id: dq_sources
      applies_to: "method and ranges"
      requirement: "Use primary industrial evidence for compatible qualitative route only; ILCD for the justified attributional hierarchy only. No case recipe, dimensions, fuel factor, emission factor, lifetime or performance threshold is a default. Major input/energy/water/waste ranges remain an explicit evidence need until compatible empirical or site evidence exists."
      evidence: "Source-specific applicability and counterexamples; no fabricated empirical range"
    - id: dq_phase
      applies_to: "physical/species/phase closure"
      requirement: "Independently measure free water, phase fractions, reaction extent and actual chemical species. Publish residuals and unmeasured scope; mass closure alone is insufficient."
      evidence: "cp_phase; separate mass/element/species balances and analytical QC"
    - id: dq_ownership
      applies_to: "packaging/capital/waste/provider"
      requirement: "Preserve gross legs and full wet closing stocks including supplier ingress and retained additions; document one upstream owner and no double-counted full service, waste-sale credit or stock correction."
      evidence: "cp_pack; cp_asset; cp_repair; treatment/provider receipts"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Apply these checks with the complete scope, boundary, allocation and calculation context. A blank UUID, missing amount, unknown species or unsupported phase relationship is disclosed, not silently treated as zero or completed evidence."
    source_ids: []
  - rule_id: v_identity
    applies_to: "reference and each UUID"
    rule: "Verify whole dried paper-faced composite applicability, every native basename/synonym/comment/CAS/grade/route/form/geography/type/medium and all properties. Bound row restrictions are mandatory; a UUID alone does not verify a provider. A true core-product mismatch or unresolved core identity blocks use; an ordinary auxiliary/provider/future-measurement gap stays explicitly unresolved without automatic core failure."
    source_ids:
      - ga-making-gypsum-board
      - ga-gypsum-board-identity
      - ilcd-detailed-2010
  - rule_id: v_basis
    applies_to: "all normalized quantities"
    rule: "Reference amount, first-release Q, selected finished row, native units, collection denominators and the single normalization must agree. Preserve Q=0 actual loads and stocks with no unit result. Unknown calculations are review-required; do not remove a scientific condition to make a finite checker pass."
    source_ids:
      - epa-gypsum-1993
      - grenzebach-gypsum-solutions
      - ilcd-detailed-2010
  - rule_id: v_water
    applies_to: "phase and reaction evidence"
    rule: "Total physical mass, relevant Ca/S/H/O/C balances and independent real species/phase-water evidence are separate checks. Quantify reaction extent and free-water evaporation independently; never fit two unknowns to one residual. Bound water in received stucco and released board is not a separate purchased input or unmeasured emission. COD/VOC/carbon indicators remain indicators."
    source_ids:
      - epa-gypsum-1993
      - grenzebach-gypsum-solutions
      - ilcd-detailed-2010
  - rule_id: v_stocks
    applies_to: "all physical and burden gates"
    rule: "Reconcile manufacturing, FG and combined physical gates with all gross species, packaging and asset legs; cancel only internal crossings. Reconcile each inherited burden vector separately. Closing released FG and already performed service cannot be subtracted from manufacturing; stock-corrected consumption cannot be corrected a second time."
    source_ids:
      - epa-gypsum-1993
      - grenzebach-gypsum-solutions
      - ilcd-detailed-2010
  - rule_id: v_pack
    applies_to: "each packaging material"
    rule: "For each actual packaging article reconcile all six P/N_ext/ER/S/EO/W legs, with I retained within N_ext plus opening/closing empty, attached-to-WIP, attached-to-FG and reusable stock. Supplier-included ingress remains real material with one upstream owner. Only de-duplicate X_in/X_out against other incoming/outgoing terms; real new input retained in closing stock is not cancelled. No automatic packaging coproduct or new board Q. For every component use mutually exclusive receipt classifications: P includes separately paid and bundled paid acquisition; N_ext is first non-purchased external acquisition, with non-paid supplier-included I recorded as a non-additive child. Other first non-purchased ingress has its own specific conditional row only when observed, not ER or an outgoing leg. ER requires the same item prior outward event; EO is a real distinct external return out. Unknown payment, prior history or ownership stays unresolved. Retain each gross event and complete wet stocks; P/I/N_ext/ER do not imply a second upstream provider or automatic credit."
    source_ids:
      - ga-making-gypsum-board
      - ga-gypsum-board-identity
      - ilcd-detailed-2010
  - rule_id: v_rework
    applies_to: "post-release operations"
    rule: "Retest, dispatch and return do not create new production. Actual post-release work requires manufacturer/specification permission, postwork tests, acceptance and disposition records. Do not assume broken gypsum board is restored; its disassembly/recycling may be a distinct operation whose additional materials, water, energy and waste must all be recorded."
    source_ids:
      - ga-making-gypsum-board
      - ga-gypsum-board-identity
      - ilcd-detailed-2010
  - rule_id: v_completeness
    applies_to: "dataset quality and reporting"
    rule: "Report actual record coverage, zero/absent/unknown distinctions, raw units and conversion evidence, species speciation, cohort histories, provider ownership and uncertainty. Source context provides methodology, not a factory recipe or default range; no fixed thickness/moisture/strength/fire/thermal/acoustic/lifetime is adopted. Record every unresolved exchange identity and missing empirical range; no claim of completed scientific/translation review follows from engineering checks."
    source_ids:
      - epa-gypsum-1993
      - grenzebach-gypsum-solutions
      - ilcd-detailed-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Attributional inventory of the declared first-released whole paper-faced board and explicitly disclosed observed cohort services"
  allowed_use: "Compatible manufactured product and direct-gas route after actual data, identity, boundary, conversion and quality checks; use measured area/count conversion only"
  excluded_use: "Installation/use/lifetime comparisons or unmeasured fire/acoustic/strength claims; powder/block/fibre-board substitution; on-site calcination and unreviewed heating routes; assuming a mapped/reviewed/published PCR"
  required_metadata: "Complete reference qualifiers; site/year; configuration; feed/formulations; first-release Q and all stock/vector gates; native restrictions; original cohort and service horizon"
  required_quality_disclosure: "All unresolved auxiliary/provider/range and measurement gaps; actual analytical/speciation/phase coverage; attribution rationale; uncertainty; exclusion evidence; source applicability"
  update_trigger: "Changed product facings/formulation/feed phase or heating route; changed provider/native identity; new empirical evidence or failed physical/phase/cohort check"
