system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "entire foreground"
      rule: "Include receipt and preparation; real dosing/foam preparation; slurry mixing; liner forming; hydration/setting; wet cut; direct-natural-gas drying with actual recirculation and control; trimming; quality checks and first release. Include all startup/shutdown, failed, zero-output, idle, cleanup and rework activities. This is a technical synthesis across primary sources, not a claim that they describe one SKU or factory."
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
        - ga-making-gypsum-board
    - rule_id: b_purchased
      applies_to: "purchased intermediates"
      rule: "Whole purchased stucco and formulations enter once. Phase assays, constituent CaSO4, structural/free/carrier water and included paper chemicals are composition subledgers. If actual on-site calcination or another heating route occurs, this route does not apply until the complete upstream/utility/loss/emission units and compatible identities are separately reviewed; do not invent a boiler or buy the same stucco twice."
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
    - rule_id: b_first_release
      applies_to: "Q and accepted FG"
      rule: "Q is new first-quality-release net whole-board mass, including the same cohort closing accepted FG. Dispatch, return or retesting never creates new production. Keep all actual packaging/storage/handling after Q in an original-cohort service ledger with its own observation horizon; exclude only unused/unassigned service charge from that service period. Do not deduct already performed service merely because FG remains in stock. Actual post-release work requires manufacturer/specification permission, post-work tests and actual acceptance/rejection with final disposition. Record every added/removed new or old material/part and free/carrier/crystal/reaction-water phase independently. Repair-held FG is one labelled FG substate or a disjoint repair-WIP state, never both. Neither broken facings nor hardened/rewetted core is assumed restored; no new Q. Every actually occurred post-release operation, including unauthorized/unapproved, failed or rejected work, and all actual material/water/energy/loss/waste/burdens are collected under original Q and observed H. Manufacturer/specification permission, configuration-specific posttests and acceptance govern authorization, continued qualification and actual hold/rejection/disposition only, never deletion of an occurred load. No new Q, assumed repair/restoration or route authorization follows."
      source_ids:
        - ga-making-gypsum-board
        - ilcd-detailed-2010
    - rule_id: b_physical
      applies_to: "gross physical gates"
      rule: "Retain all gross physical incoming and outgoing legs regardless of burden allocation shares. At manufacturing gate reconcile complete wet-state raw/WIP/installed-fluid/repair stocks and actual external species against first-release board and real outputs. At warehouse gate reconcile opening FG plus first-release board plus actual returns and added matter against closing FG plus gross shipments, samples, damaged disposal and real water/material losses. At combined gate cancel internal Q and internal reuse once. No mass allocation coefficient scales physical legs. Include the full independent physical quantities and each inherited exchange vector for unused/non-WIP material stores as well as every raw/WIP state; preserve receipt/issue/closing identities and whether a quantity is already net consumption. Do not apply a second stock correction to either that quantity or its already reconciled vector. Record stage_internal_in and stage_internal_out as matched same-event physical transfers and inherited exchange vectors, retaining row, provider, property/unit, gate, phase, period and cohort coordinates; cancel only the matched pair at the combined boundary. Actual hydration formation/consumption remains in its species/phase subledger, not a second external receipt. First WIP-to-FG acceptance enters accepted_production once; all other FG transfers are mutually exclusive and retain original Q, so a stock movement never repeats first acceptance."
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
        - ilcd-detailed-2010
    - rule_id: b_actual_atoms
      applies_to: "all exchanges"
      rule: "Every actual supplied formulation, material, fuel, energy carrier, packaging article, waste and real emitted species needs one distinct atomic row. Conditional absence requires affirmative evidence; unknown is not zero or not_applicable. Add actual unlisted exchanges with their true identity and native property before use. No total dust/NOx/VOC/COD/carbon indicator is a surrogate specific chemical species."
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
    - rule_id: b_water_interface
      applies_to: "water and utilities"
      rule: "For every real external cooling-water or heat-carrier interface, disclose gross supplied/returned mass, real phase, temperature/pressure/enthalpy and provider water/energy ownership. External usable return water is Product; actual blowdown or contaminated liquid is its own Waste stream. Never duplicate complete carrier-provider energy or substitute a nonexistent steam/condensate circuit. For actual cooling-water/heat-carrier Product supply and external Product return, the physical numerator is the independently measured full gross native-unit leg V_j, so this same normalization gives V_j/Q for manufacture or V_j/original Q for the observed service horizon. It is not a stock-corrected water consumption, attributed heat burden or economic/service share. Keep the independent attributable supplier/service burden and carrier mass/phase/P/T/enthalpy separately with one provider; no added purchase, boiler/steam system or return credit is implied."
      source_ids:
        - grenzebach-gypsum-solutions
        - ilcd-detailed-2010
