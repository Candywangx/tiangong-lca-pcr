  controller_package_direction_followup: "Four package materials now have separate conditional P/I/ER/grossS/EO/W cards; original amounts/native units retained. Six real conditional repair/water cards and explicit physical-gross versus burden-vector numerator rules, one wet receipt, same-side X dedup, original Qc/H and actual permission/postchecks/disposition remain. Science and translation pending; no new acceptance or publication."
  independent_package_moisture_followup: "Atmospheric uptake and vapour-loss cards also cover actual observed storage/handling moisture exchange, not only repair/cleaning. Actual work still requires permission, post-work checks and acceptance/disposition; no moisture event or quantity is presumed. Actual unapproved/failed work movements and caused burdens remain collected, with actual hold/repair-WIP/waste disposition; permission gates do not erase facts. All original amounts, units and native bindings retained."
