    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for LCA — Detailed guidance. First edition March2010 §§7.9.2–7.9.3 pp.255–268. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and virtual subdivision; exchange-specific determining physical causality; only genuinely residual common-process-gate contemporaneous actual-state market value; no arbitrary fixed shares or automatic credit"
