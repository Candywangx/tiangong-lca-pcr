    used_for: "Primary manufacturer product description and explicit heat-strengthened counterexample; thermal safety-glass terminal and pre-toughening fabrication; no numeric performance or conformity default"
  - id: "gpd-tempering-control-2023"
    type: "literature"
    reference: "Aronen A.; Kelin S.; Lyytikäinen P. How to change the tempering process control from settings to specifications. GPD 2023 pp.268–270. https://gpd.fi/wp-content/uploads/2022/09/78-Antti-Aronen-How-to-change-the-tempering-process-control.pdf"
    used_for: "Primary technical paper; electric roller-furnace heating and air quench; Figure1 heat/cool stages; Figures2–3 quality/process dependence and schematic limits; no temperature energy yield or strength default"
