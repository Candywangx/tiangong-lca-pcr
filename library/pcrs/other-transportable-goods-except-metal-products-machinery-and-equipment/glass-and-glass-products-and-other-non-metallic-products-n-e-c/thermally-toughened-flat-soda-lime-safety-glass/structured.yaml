system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The following rules apply together. Retain every actual operation and attributable burden; zero output or failure is not a reason to delete it."
      source_ids: []
    - rule_id: boundary_route
      applies_to: "all manufacturing"
      rule: "Start at receipt of full annealed uncoated soda-lime float stock sheets. Include stock handling; actual cutting and edge grinding; required holes before heat treatment; washing and drying; electric roller-furnace heating; forced-air quench; inspection and destructive sampling; any specified heat soak and rejection; first release; and actual downstream storage/packing/handling service. This is a technical synthesis across primary sources, not a claim of one SKU or factory. No furnace temperature, density, strength, yield, energy, lifetime or certification default is set."
      source_ids:
        - pilkington-toughened-glass
        - gpd-tempering-control-2023
        - landglass-wash-dry-2020
        - glaston-fc-flat-tempering
        - bavelloni-ve-edgers
    - rule_id: boundary_upstream
      applies_to: "all purchased inputs"
      rule: "Attach actual compatible upstream burdens to full supplied sheets and each utility, supplied formulation, tooling and packaging input. Do not reproduce melting, tin-bath forming or annealing inside this conversion boundary. Do not replace conversion with purchased safety-glass packaging. Same-category external safety glass is an explicitly separate burden-bearing resale/service input and is excluded from newly manufactured Q."
      source_ids:
        - pilkington-toughened-glass
    - rule_id: boundary_release
      applies_to: "first_release and handling"
      rule: "Q is the sum of uniquely identified panes passing first required release in the reporting cohort, measured as net glass mass with dry surfaces. Destructive samples, pre-release rejects and opening already-released FG are not Q. New closing FG has already crossed Q and must not be added as another manufacturing output. Track the physically distinct FG service ledger and cancel internal Q transfers. Deliveries, returns, reinspection and repairs never create new Q. Keep original release and delivery references; reverse only the original delivery-ledger assignment before reassigning returned glass, never the original first release or its manufacturing burden. Newly released closing FG retains its complete manufacturing burden inside Q. Observed incremental post-release services follow the original release cohort and declared service interval."
      source_ids:
        - pilkington-toughened-glass
        - gpd-tempering-control-2023
    - rule_id: boundary_complete
      applies_to: "every actual exchange"
      rule: "Include failed runs, zero-output periods, warmup/cooldown, idle, start/stop, cleaning, test breakage, rework, utilities, captured waste, leaks and emissions. Unlisted actual inputs or exports require additional chemically/physically specific atomic rows with actual identities, properties, conditions and destinations; no hidden other, zero or lumped balance category is allowed. Absent exchanges require actual route evidence. Retain monitored unknowns and uncertainty; do not force balance closure."
      source_ids:
        - gpd-tempering-control-2023
        - landglass-wash-dry-2020
    - rule_id: boundary_fluid
      applies_to: "WIP and non-WIP stocks"
      rule: "Maintain quantities and a separate inherited vector for every exchange in opening/closing glass WIP, raw stocks, installed lubricants, wash tanks, recirculating liquids and other equipment charges. A stored litre or kilogram is distinct from embodied energy or each upstream exchange. Assign only attributable use/losses/removal, carry retained PRE-release or unused-stock burdens forward and cancel internal transfers. Newly released FG is already inside Q; its complete manufacturing vector is carried for traceability without reducing manufacturing A_j. Equipment fluids are not WIP panes. For any actual external steam/heat or condensate return, add separate atomic supply and Product-return flows with actual mass, temperature, pressure, phase and enthalpy and the supplier water/energy convention; this electric air-quench route does not presume a boiler."
      source_ids:
        - gpd-tempering-control-2023
        - landglass-wash-dry-2020
    - rule_id: boundary_exclusions
      applies_to: "scope and terminal"
      rule: "Exclude heat-strengthened-only panes, chemical strengthening, lamination, coated/enamelled/printed glass manufacture, bending, mirror silvering, insulating-unit assembly, framing, installation and use/end-of-life from this specific route. Fully toughened monolithic glass is not automatically suitable for post-breakage retention or a laminated balustrade. Actual conformity and performance are manufacturer/test records, not inferred from a safety label. A materially different terminal or route needs its own methodology review."
      source_ids:
        - pilkington-toughened-glass
        - gpd-tempering-control-2023
