allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The sequence below applies only to attributional multifunctional processes. Industrial manufacturing documents do not by themselves establish LCA allocation rules."
    source_ids: []
  - rule_id: allocation_subdivide
    applies_to: "attributional manufacturing and services"
    rule: "Use attributional modelling only. Identify exclusive sheet, machine, batch and service records first; subdivide or virtually subdivide wherever quantitative technical relationships can isolate an exchange. Keep manufacturing and FG services separate and allocate each to the relevant release cohort. Do not choose arbitrarily between physical and economic allocation."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_causality
    applies_to: "residual shared exchanges"
    rule: "For each exchange remaining shared, identify and document the determining physical causal relationship. Do not apply one mass ratio to every flow. Different thickness, loading, heating recipe and quench intensity require actual measurements/models; area, time or mass are not interchangeable automatic keys. For shared rack/storage/transport services demonstrate the actual limiting capacity and duration/distance. Preserve failed-load and idle burdens and document any distortion."
    source_ids:
      - ilcd-attributional-2010
      - gpd-tempering-control-2023
  - rule_id: allocation_residual
    applies_to: "genuinely inseparable residual multifunctionality"
    rule: "Only for genuinely residual shared flows after the preceding steps, use contemporaneous market values of actual co-functions in their real condition and amounts at the same common-process exit/entry gate. Strip downstream-only finishing, transport, packaging and margin from remote prices. If the correct value cannot be established retain a review hold and quantify sensitivity; do not invent a fixed percentage. This concerns multifunctional processes, not QFD comparison of multifunctional consumer products."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_waste
    applies_to: "rejects returns and packaging"
    rule: "Waste and internal recirculation are not automatic co-products, negative production or avoided-production credits. Establish actual product/waste status, ownership, treatment and burden transfer for external cullet and retired packaging. Preserve original burdens and actual incremental repair/service loads; never erase failure burdens or count returning racks as new purchases."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_preparation
      process_id: "preparation"
      flow_role: "stock sheet and preparation exchanges"
      record_type: "raw_activity_records"
      raw_fields: "sheet ID; supplier and annealed state; raw purchase and issue mass; raw meter readings and units; start/end times; cutting dimensions; thickness and calibrated mass; pre-Q reject and sample mass; water makeup and tank stocks; sludge wet mass and measured solids; independent evaporation measurement; actual formulation SDS and full supplied mass; tool replacement and wear; installed oil opening/closing physical quantities; per-exchange inherited vectors; destination; uncertainty"
      collection_method: "Calibrated scale and traceable supplier/meter records; independently sample dry solids and oil/water content; log all successful and failed jobs with start/stop idle cleaning and rework; retain original unnormalized readings. Sum raw observations only; retain stock and cohort links; per reference flow result is supplied solely by normalize_exchange after unit conversion and attribution"
      unit: "native units with kg and MJ conversions retained"
      frequency: "each job and meter interval"
      temporal_coverage: "full declared reporting period including shutdown"
      site_scope: "selected site and linked suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; meter coverage; supplier SDS; waste tickets; sampling records; stock ledger"
    - protocol_id: cp_toughening
      process_id: "toughening"
      flow_role: "electric heating quench and rejection"
      record_type: "raw_batch_records"
      raw_fields: "pane and load ID; linked preparation transfer; furnace mode and recipe; actual thickness and edge quality; raw heater/convection/blower/drive kWh; loading and operating times; ambient air temperature/humidity; measured glass quality; required heat soak record; failed load and test breakage; WIP opening/closing physical quantities; inherited exchange vectors; original first release ID"
      collection_method: "Link actual electric meter intervals and furnace logs to all loads and tests; retain quench quality measurements and actual standards; independently reconcile failures and WIP; never infer strength or release from a recipe alone. Sum unnormalized raw load records; include zero-output loads; per reference flow result only through normalize_exchange after attribution"
      unit: "native units with kg and MJ conversions retained"
      frequency: "every load and quality release"
      temporal_coverage: "same manufacturing cohort and reporting period"
      site_scope: "selected site furnace and testing stations"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/time synchronisation; actual test record; pane traceability; failed-load register"
    - protocol_id: cp_release
      process_id: "toughening"
      flow_role: "unique first_release reference"
      record_type: "release_mass_records"
      raw_fields: "unique pane ID; cohort; first required release time; prior release flag; calibrated gross mass; packaging tare; dry-surface net glass mass; specimen/reject disposition; required test and heat soak completion"
      collection_method: "Weigh accepted dry-surface panes or a traceable homogeneous lot with calibrated scale excluding packaging; link acceptance and first release once; keep any destructive specimen outside Q. Sum eligible unique first-release net glass mass as Q without dividing; the single normalized reference is 1 kg"
      unit: "kg"
      frequency: "each first release"
      temporal_coverage: "same release cohort as attributed inventory"
      site_scope: "selected first-release station"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; tare; unique release registry; test completion"
    - protocol_id: cp_handling
      process_id: "handling"
      flow_role: "physical FG and packaging services"
      record_type: "raw_service_and_stock_records"
      raw_fields: "original release and original delivery ID; returned pane/rack ID; opening/closing FG and dry glass/water masses; gross dispatch and external glass returns; actual repair additions/removals and rewash/repair energy; damaged FG; for each packaging article opening/closing empty stock and attached-WIP/FG stock and reusable stock; purchases; externalreturnreceived; gross physical outgoing; externalreturnsent; waste; internal reuse; measured article mass; raw electric and water readings; service cohort and original cohort Q; observed service start/end and coverage including unshipped FG; per-exchange historical vectors"
      collection_method: "Count/scan each article and pane with weighbridge or calibrated tare checks; reconcile every external receipt/dispatch and internal transfer; segregate cohort service readings from new manufacturing; independently measure actual service moisture changes and retain original delivery-ledger reversals without reversing or repeating manufacture. Collect raw totals without Q division; retain full packaging and FG equations; per reference flow attributable service result only through normalize_exchange"
      unit: "native units and measured kg plus MJ"
      frequency: "each physical movement plus period stocktake"
      temporal_coverage: "reporting period with original-cohort history retained"
      site_scope: "selected storage packing and handling site through declared physical dispatch"
      aggregation_rule: "per reference flow"
      quality_evidence: "stocktake; dispatch/return receipts; original delivery reversal; repair records; measured packaging mass and supplier construction"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw reading to its declared row unit before attribution. Electricity MJ = actual kWh * 3.6. True rates require integration over the measured interval; cumulative readings use differences once. Use independently measured density/state for actual liquid/gas volume and measured article configuration for count/area conversions. Preserve original readings and units."
      inputs:
        - "raw observations"
        - "unit factors"
        - "measured density and state"
        - "measured article configuration"
      output: "converted raw exchange totals"
      source_ids:
        - gpd-tempering-control-2023
    - id: attribute_raw
      applies_to: "all inventory rows"
      rule: "For each exchange j and its identified cohort ledger, use A_j = B_open_j + converted_period_j + B_external_returns_j - B_close_j - B_transferred_elsewhere_j only for attributable stock/burden reconciliation, then apply documented subdivision or residual exchange-specific allocation. Manufacturing B terms cover unused raw materials, non-WIP equipment charges and PRE-release WIP only. Assign complete manufacturing burdens to all Q at first release, including its newly released closing FG; never subtract that FG manufacturing vector or re-charge opening/returned FG manufacture. Carry it separately for traceability. Post-release service A_j contains only actual incremental service exchanges and their own retained/used stock vectors, matched to the ORIGINAL first-release cohort Q including its unshipped FG over a declared observed service interval; no forecast service or division by unrelated current-period Q. If original Q or the service attribution is unknown, retain raw records without a unit result pending review. Original delivery reversals move historical burdens between delivery/cohort ledgers only and do not reverse first release or manufacturing Q. For physical directional transfer/dispatch/return/waste rows, retain the actual gross movement assigned to the cohort as A_j; do not apply an inherited manufacturing stock correction to the physical movement. B terms are vectors of that same exchange, not scalar glass stocks. Count each purchase once and cancel internal transfers; reconcile physical amounts and environmental burdens separately. Corrections reference original records."
      inputs:
        - "converted raw totals"
        - "exchange-specific opening and closing vectors"
        - "external returns"
        - "transfer and cohort links"
        - "allocation record"
      output: "A_j attributable raw exchange totals"
      source_ids:
        - ilcd-attributional-2010
    - id: release_denominator
      applies_to: "first_release"
      rule: "Q = sum of actual dry-surface net glass mass of uniquely first-released panes after required tests. Pre-release destructive samples and failures are excluded. Newly released closing FG is already in Q; never add it as another output. Shipment, return, repair and reinspection do not add Q."
      inputs:
        - cp_release
        - "unique first-release registry"
        - "net glass mass"
        - "required tests"
      output: "Q in kg"
      source_ids:
        - pilkington-toughened-glass
        - gpd-tempering-control-2023
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "q_j = A_j / Q for Q > 0. Execute this division once after convert_raw and attribute_raw; q_j is the exchange per 1 kg reference flow. For Q = 0 retain A_j and all raw records with no unit result. Cards and protocol aggregation only reference this same result and never divide again."
      inputs:
        - A_j
        - Q
        - convert_raw
        - attribute_raw
        - cp_release
      output: "q_j per 1 kg reference flow"
      source_ids:
        - ilcd-attributional-2010
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "Manufacturing: opening raw glass stock + opening glass WIP + external raw glass received = closing raw glass stock + closing glass WIP + Q + dry-glass manufacturing wastes + any other independently identified physical glass outputs. Water/material additions, dust and moisture are balanced independently. FG service: opening FG + first-release internal receipt + external glass returns + measured repair additions = closing FG + gross glass dispatch + external glass return sent + FG waste + measured repair removals and water/air losses. All masses are on stated consistent phase/moisture bases. Consolidation cancels first-release internal receipt against manufacturing transfer; it does not add Q and new closing FG as independent external outputs."
      inputs:
        - cp_preparation
        - cp_toughening
        - cp_release
        - cp_handling
        - "independent phase and species measurements"
      output: "separate and consolidated physical mass and relevant element checks"
      source_ids:
        - gpd-tempering-control-2023
        - landglass-wash-dry-2020
    - id: packaging_ledger
      applies_to: "all inventory rows"
      rule: "For EACH packaging article separately: opening empty + opening attached WIP + opening attached FG + opening reusable + purchases + external returns received = closing empty + closing attached WIP + closing attached FG + closing reusable + gross physical outgoing + external returns sent + waste. Categories are mutually exclusive. Gross outgoing includes packaging attached to gross glass dispatch even if that glass later returns. Internal reuse/transfer cancels; it is not a new purchase, Q, yield or automatic co-product. Retain inherited per-exchange burden vectors and actual repeated-service allocation separately from this physical mass ledger."
      inputs:
        - cp_handling
        - "article-specific stocks"
        - purchases
        - "external receipts and dispatch"
        - returns
        - waste
        - "inherited vectors"
      output: "each article physical ledger and attributed burden reconciliation"
      source_ids:
        - ilcd-attributional-2010
        - pilkington-toughened-glass
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Retain the full native flow restrictions within every inventory description and actual provider matching evidence. UUID is an identity, not an amount or process approval. Auxiliary unresolved UUIDs remain concrete physical exchanges."
      evidence: "Direct native identities; supplier state and composition; actual product tests"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Use a complete representative declared period with all campaigns and start/stop idle and zero-output records. Retain original release cohorts and original delivery links across period boundaries."
      evidence: "Raw meters; period/cohort ledger; original delivery reversals"
    - id: dq_water
      applies_to: "all inventory rows"
      requirement: "Independently measure free surface water, wastewater, sludge moisture and evaporation; reaction water, structural water and dissolved species cannot be inferred from one residual. Keep actual receiving medium. Thermal stress treatment alone supplies no reaction stoichiometry."
      evidence: "Independent samples and phase/species records; moisture and tank inventories"
    - id: dq_stocks
      applies_to: "all inventory rows"
      requirement: "Separate physical stock quantities from each inherited exchange vector in WIP, FG, oil charge and water systems; do not set missing history to zero. Carry retained burdens and allocate actual use to the relevant cohort."
      evidence: "Opening/closing physical stocks; exchange-specific historical records"
    - id: dq_unknown
      applies_to: "all inventory rows"
      requirement: "Preserve unknown, measured zero, not applicable and below-detection separately. Supplier/auxiliary identity and future foreground quantities are collection requirements, not fabricated defaults or automatically missing methodology. Actual unknown core relationships require a hold."
      evidence: "Gap register; detection limits; uncertainty and sensitivity record"
validation_rules:
  - rule_id: validate_identity
    applies_to: "all dataset identities"
    rule: "Verify the input is actual annealed uncoated float and the terminal is first-released flat monolithic thermally toughened soda-lime safety glass. Keep heat-strengthened and laminated counterexamples explicit; no generic Safety glass UUID certifies route, dimensions, strength or legal conformity. Check every selected native name, synonym, CAS, form, route, geography, medium, type and property. Respect supply restrictions on each row and use a different verified identity when incompatible."
    source_ids:
      - pilkington-toughened-glass
      - gpd-tempering-control-2023
  - rule_id: validate_balance
    applies_to: "manufacturing FG and combined physical gates"
    rule: "Close manufacturing and FG-service mass gates independently and then cancel matching internal transfers. Do not add closing FG to Q as production. Test dry-glass, free-water and relevant elemental subbalances using independent measured species/phase data. Heating is physical stress treatment, not a basis to invent reaction water, oxygen consumption or carbonate CO2. Preserve actual additional reactions or coating decomposition if observed; such a changed route needs explicit review."
    source_ids:
      - gpd-tempering-control-2023
      - landglass-wash-dry-2020
  - rule_id: validate_measurement
    applies_to: "all raw records and calculations"
    rule: "Require traceable unit conversion before allocation and the single normalize_exchange operation. Do not divide in protocol collection or again in cards/aggregation. Preserve Q=0 raw burdens without a unit result. Distinguish measured zero, absent, unknown and below-detection-limit. Validate period/cohort stocks and per-exchange historical vectors; a scalar stock mass cannot substitute for its burden vector."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_packaging
    applies_to: "each packaging article"
    rule: "Require a complete material-specific physical ledger including empty, WIP-attached, FG-attached and reusable opening/closing stocks, purchases, external returns received, gross physical dispatch, external returns sent and waste. Internal reuse cancels. These flows do not change glass Q or yield or create automatic co-products. Reconcile count/area to independently measured mass for the actual article."
    source_ids:
      - ilcd-attributional-2010
      - pilkington-toughened-glass
  - rule_id: validate_completeness
    applies_to: "dataset handoff"
    rule: "Missing actual terminal evidence, missing manufacturing operations or unknown core burden relationships prevent a completed dataset claim. Ordinary supplier/activity measurements and unresolved auxiliary UUIDs are future data-production requirements rather than evidence of absent exchanges. Report each gap, failed retrieval, unresolved applicability and uncertainty without treating a technical/schema check as scientific or translation approval."
    source_ids:
      - pilkington-toughened-glass
      - ilcd-attributional-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Upstream data for qualified safety-glass-pane manufacture at declared state; disclose storage/packing services separately"
  allowed_use: "Further modelling with compatible technology state specification and provider boundary"
  excluded_use: "Automatic safety certification; cross-route performance equivalence; replacement for stock-sheet manufacture; laminated-retention function; treating net deliveries as first-release Q"
  required_metadata: "site and reporting period; release cohort and first quality-release gate; annealed uncoated soda-lime float input and supplier burden; flat monolithic unframed thermal-toughening route; stock and pane dimensions and measured thickness; dry-surface net mass and calibrated measurement method; actual thermal recipe and electrical furnace configuration; air-quench conditions and environmental conditions; actual edge preparation and hole specification; applicable product standard and actual quality-test records; heat-soak requirement and performed or absent state; destructive specimens and failed-load disposition; finished-glass surface and moisture condition; same-period WIP and FG physical stocks and exchange-specific inherited burdens; packaging composition and full returns/stocks ledger; electricity geography voltage mix and meter boundary; water treatment origin quality and receiving media; allocation justification and residual common-gate value basis; original release-cohort Q and declared observed post-release service interval including unshipped FG"
  required_quality_disclosure: "Raw quantities and coverage; zero versus unknown; failures and zero output; each physical gate and inherited exchange vector; UUID/provider limits; unresolved auxiliary identities and uncertainty"
  update_trigger: "Material change in supplied input state; core route/terminal; applicable standard; formulation; provider/geography/voltage; testing; allocation or stock method"
