  ordinary_gaps:
  - Actual future site/provider/activity and test data must satisfy collection protocols; no fabricated amounts.
  - Unbound auxiliary and internal-transfer identities remain specific and require actual matching before dataset finalization.
  - CN low-voltage electricity identity is conditional; another supply requires another identity/provider.
  - Generic Safety glass identity does not prove route or conformity.
  true_methodology_holds: []
  native_identity_notes:
  - PE-film native luggage classification is an isolated taxonomy defect; CAS, names, synonyms, form and comment consistently
    identify PE film. PET mentioned as competing polymer is not selected.
  - Rejected waste-glass candidate has wafer route, plastic commentary and Product type; no waste UUID adopted.
  - Generic safety output avoids assuming the Kunming native tempered-glass candidate applies everywhere.
  measurement_basis: Q = uniquely first-released dry-surface net glass kg after required tests. Convert and attribute raw
    exchange amounts with historical vectors first, then execute normalize_exchange once. All Q retains complete manufacturing burdens at first release, including newly released closing FG. Post-release incremental
    services use original cohort Q over a declared observed interval including unshipped FG; manufacturing history is never
    deducted/recharged as service. FG services do not restore broken/failed safety glass or produce another Q.
