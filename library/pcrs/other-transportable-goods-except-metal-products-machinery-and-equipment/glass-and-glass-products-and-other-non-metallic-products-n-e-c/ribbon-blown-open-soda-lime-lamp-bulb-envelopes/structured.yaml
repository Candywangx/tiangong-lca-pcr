data_sources:
  - id: "ge-glass-products-1990"
    type: "handbook"
    reference: "General Electric, GE Glass Products (1990), especially printed/PDF p19 Manufacturing & Quality Control and adjacent tubing/pressed-glass/borosilicate contrasts. Manufacturer original reproduced in a third-party archive, https://www.lamptech.co.uk/Documents/Components/GE%20-%20Lamp%20Components%20-%20Glass%20-%201990%20US.pdf ; retrieved 2026-10-20."
    used_for: "Qualitative open lamp bulb blank terminal, molten-glass ribbon blowing, neck separation and downstream frosting/coating distinction; no contemporary SKU, inventory factor or allocation support."
  - id: "epa-lamp-glass-1975"
    type: "official_guidance"
    reference: "US EPA, Development Document for Effluent Guidelines and Standards for the Pressed and Blown Glass Segment of the Glass Manufacturing Point Source Category (1975), Section III and incandescent lamp envelope section, printed pp42–46 and77–79; Figure9 printed p78 (PDF92). https://www.epa.gov/sites/default/files/2019-06/documents/glass-mfg_pressed-blown-glass-segment_dd_1975.pdf ; retrieved 2026-10-20."
    used_for: "Technical raw-material/melt/ribbon/anneal/inspection/shipping route, cullet and oily quench-water branches, separation from acid frosting and final lamp assembly. Historical cases are not current legal limits, recipes, water factors or default yields."
  - id: "jrc-glass-bref-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Manufacture of Glass, EUR25786 EN (2013), DOI10.2791/69502, sections2.8 and3.7, printed pp65–66 and138–140, Tables3.33–3.34. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/GLS_Adopted_03_2012_0.pdf ; original acquired 2026-10-20; reused and re-extracted 2026-10-20."
    used_for: "Technical process decomposition, actual recipe/utility/emission completeness, site-specific downstream branches and tube/ceramic counterexamples. Table3.34 is case-specific per tonne melted glass with oxide equivalents and NOx/SOx reporting bases; no numerical factors adopted."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition March2010, sections7.9.2–7.9.3, printed pp255–268 (PDF275–288), including allocation applicability and multifunctional-product counterexample. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf ; original acquired 2026-10-13; reused and re-extracted 2026-10-20."
    used_for: "Only the declared attributional case where allocation is required: subdivision/virtual subdivision, exchange-specific determining physical causality and residual same-gate/state market value with justified scope. No universal mass/economic choice, fixed proportion, automatic substitution or industrial inventory evidence."
