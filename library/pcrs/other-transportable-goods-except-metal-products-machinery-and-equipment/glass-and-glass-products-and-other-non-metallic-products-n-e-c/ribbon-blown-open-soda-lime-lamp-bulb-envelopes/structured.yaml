allocation_rules:
  - rule_id: allocation_scope
    applies_to: "attributional inventory"
    rule: "Apply this hierarchy only to the declared attributional case where allocation is methodologically required; document why other ILCD situations/system-expansion provisions are outside this task. This is a multifunctional-process assessment, not a multifunctional-product QFD comparison. First assign dedicated operations and use actual subdivision or justified virtual subdivision before any shared remainder."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "each shared exchange"
    rule: "For every remaining shared exchange identify the determining physical causal relationship to each output/function. Embodied batch material follows actual composition; heat follows demonstrated thermal need when determining; equipment/space service may need actual use/time and capacity. Do not pick one mass/economic key for all exchanges or assume the illustrative checklist establishes causality. Keep gross physical balances unchanged by burden allocation."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "genuine remaining common process"
    rule: "Only a genuinely indivisible residual without defensible determining physical causality may use contemporaneous market values of co-functions at the same common process gate and actual state, quantity and quality. Strip later packaging, delivery, upgrading and service costs from downstream prices and disclose uncertainty; no arbitrary fixed share, default credit, automatic economic switch, or negative-waste adjustment. If this evidence is absent retain a methodology hold for that remainder."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_cullets_service
    applies_to: "cullet and cohort services"
    rule: "Internal return cullet carries its actual inherited exchange vector and cancels with the matching internal input. External waste status, recovery gate and any real coproduct function require evidence; no avoided-virgin credit. Attribute rework/failure to the originating production cohort. Post-release handling/returns/repair/breakage retain original FG history and add only observed incremental service burden to the same original cohort; do not borrow unrelated current Q."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first_release"
      record_type: "release and calibrated net weighing"
      raw_fields: "cohort ID; first release timestamp; configuration; open neck condition; annealing and stress/geometry/defect tests; gross tare net kg; exclusions; first release counted flag"
      collection_method: "Calibrated batch or individual net weighing with packaging tare; link actual required glass quality test release to a unique cohort. Rejects/retests and re-deliveries do not add Q."
      unit: "kg"
      frequency: "each release"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; test release; cohort uniqueness"
    - protocol_id: cp_mfg
      process_id: "manufacture"
      flow_role: "each purchased material and supplied formulation"
      record_type: "receiving batch weigh and recipe"
      raw_fields: "row ID; supplier lot; actual grade route assay full supply mass; water state; raw unit; stage; gross receipt return loss; opening closing raw WIP non-WIP stores; each exchange inherited vector; zero/failure/rework flag"
      collection_method: "Reconcile receipts and source-stage scales with actual recipe and whole supplied formulations. Preserve original units and all failed/idle/cleanup records; separately measure composition and water."
      unit: "row native unit"
      frequency: "each lot and shift"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; SDS assay; stage weights; stock/history reconciliation"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "gas and electricity separately"
      record_type: "meter and fuel assay"
      raw_fields: "row ID; meter start end integrated quantity or rate series; original unit; LHV HHV; gas composition density temperature pressure; kWh; stage; idle startstop failure; attribution evidence"
      collection_method: "Read calibrated source-stage meters. Integrated gas/liquid volumes are already quantities; integrate only actual rates. Obtain each material density independently at measured state."
      unit: "row native unit"
      frequency: "each interval and shift"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; interval completeness; assay; voltage and supplier evidence"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "water intake and actual external return"
      record_type: "meter and state balance"
      raw_fields: "water source; gross supplied volume mass; temperature pressure density enthalpy; batch cooling quench cleanup; internal recirculation; evaporation condensation; retained fluid stocks; receiver and supplier convention"
      collection_method: "Separate supply, internal circulation, real external return and discharge. Measure each stream state and retained inventory, not assumed steam/condensate."
      unit: "row native unit"
      frequency: "each interval"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter logs; independent density; destination agreements; mass/heat balance"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each actual intake and emitted species"
      record_type: "speciated sampling and integrated flow"
      raw_fields: "row ID; species CAS phase; inlet outlet compartment; gas volume or rate; dry wet basis; humidity oxygen; temperature pressure; concentration; detection limit uncertainty; independent element assay reaction extent condensate stores"
      collection_method: "Sample and measure each real species independently with matched outlet/inlet volume. Convert units and dry/wet/state basis before attribution; verify total wet mass and elements with independent evidence. No COD/VOC/NOx/total-B inference to a species."
      unit: "kg"
      frequency: "each actual outlet interval"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "speciation; matched concentration flow; state correction; independent C N S Cl water evidence"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each actual waste stream"
      record_type: "transfer weight treatment manifest"
      raw_fields: "row ID; whole wet mass; independently measured dry solids liquid and species; internal return; external receiver; treatment boundary; zero output failure; stock history"
      collection_method: "Weigh actual external waste and sample its composition; cancel internal returns only against matching quantities and inherited vectors. Retain treatment provider and transport coverage."
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; laboratory; transfer receiver; internal-loop closure"
    - protocol_id: cp_assets
      process_id: "manufacture"
      flow_role: "each equipment and fluid stock"
      record_type: "asset service and physical ledger"
      raw_fields: "asset ID; actual configuration; installed spare counts and measured masses; opening closing physical stores; new purchases; repairs new components removed old parts; real wood/free/structural water; installed fluid fill drain leak; each exchange historical vector; provider reference; observed use horizon and service driver"
      collection_method: "Reconcile unscaled physical movements for each named asset/fluid independently; determine actual consumed service from inherited embodied exchange vectors and observed operation or justified causal use. If records already measure corrected consumption do not correct twice. No fixed life or guessed item mass."
      unit: "row native unit"
      frequency: "each movement and service interval"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "asset register; measured masses; maintenance; service horizon; vector conservation"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "each material and six gross movements"
      record_type: "package physical and burden ledger"
      raw_fields: "material ID; complete formulation; moisture; supplier included or new; return received; gross shipment out; separate return sent; waste; opening closing empty attachedWIP attachedFG reusable stocks; repairs and old pieces; original cohort; inherited service vector"
      collection_method: "Reconcile each material mass/count/moisture independently with boundary_pack. Incoming supplier-paid packaging is not repurchased; internal reuse is not an external movement. Measure actual wood and repairs only when present."
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase/return/shipping weights; mutually exclusive stocks; cohort match"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "post-release energy and breakage"
      record_type: "observed service horizon"
      raw_fields: "original release cohort; original Q; observation start end; actual incremental raw energy; gross FG movement; returns modifications added removed glass water parts; breakage; original burden vector; service numerator"
      collection_method: "Follow each released cohort through actual storage, handling, delivery and returns; retain original manufacturing burden and measure only incremental service. Do not use unrelated current Q or count a second release."
      unit: "row native unit"
      frequency: "each event"
      temporal_coverage: "Complete consecutive representative production period; services retain actual original-cohort observation horizon"
      site_scope: "All actual lines/outlets including startstop failure cleanup"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "cohort trace; actual horizon; energy and FG reconciliation"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert each original row unit to its extensive quantity. Integrate actual rates only; integrated quantities gain no time factor. Convert mass with that substance own state density; electricity kWh×3.6=MJ, fuel heat uses independent actual composition and calorific value. Keep mass, heat and service equivalents in distinct fields."
      inputs:
        - raw_fields
        - cp_energy
        - cp_water
        - cp_species
        - cp_assets
      output: "converted_raw_j"
      source_ids:
        - jrc-glass-bref-2013
    - id: attribute_numerator
      applies_to: "all inventory rows"
      rule: "Manufacturing A_j is current dedicated and actually allocated quantity/burden plus inherited opening raw/WIP/unassigned non-WIP vectors minus matching closing raw/WIP/unassigned non-WIP vectors; cancel only actual history-matched transfers. Released closing FG is excluded from manufacturing Bclose. Service A_j is only observed actual incremental quantity/burden attributed to the original cohort; carry original FG manufacturing history separately without manufacturing it again. Separate asset service from gross physical stocks; packaging physical movements receive no burden-share scaling."
      inputs:
        - converted_raw_j
        - cp_mfg
        - cp_assets
        - cp_pack
        - cp_service
        - allocation_scope
        - allocation_causality
        - allocation_residual
      output: "A_j"
      source_ids:
        - ilcd-allocation-2010
        - jrc-glass-bref-2013
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "q_j = A_j / Q"
      inputs:
        - A_j
        - Q
        - cp_release
      output: "q_j"
      source_ids:
        - ilcd-allocation-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_source
      applies_to: "all source-dependent decisions"
      requirement: "Keep original/extraction provenance, page/table context, contrary cases, actual source applicability, raw units and uncertainty. These historical technical sources support qualitative routes; no default numerical recipe, emissions, water, yield or per-item mass."
      evidence: "source-specific reviewed context; foreground collection"
    - id: dq_identity
      applies_to: "all UUID-bearing rows"
      requirement: "Identity is distinct from provider compatibility and quantities. Preserve every native card restriction and official localized display. An unresolved auxiliary needs a specific name and identity follow-up; unresolved core reference is a true hold."
      evidence: "exact original public flow and support rows; provider scope"
    - id: dq_complete
      applies_to: "all raw and burden ledgers"
      requirement: "Require complete representative consecutive production including nonproductive intervals; retain configuration/cohort/site/time and detection limits. Missing or unsupported relationships remain unknown and block the affected result."
      evidence: "coverage matrix; calibration; production and stock closure"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference and native exchanges"
    rule: "Confirm that the complete native family genuinely admits the actual primary-evidenced open uncoated soda-lime lamp envelope. The broad formed-and-finished glass Product is usable only with all explicit reference/card qualifications and real route/terminal evidence; a generic name or taxonomy alone establishes neither applicability nor provider fit. Feedstock, tube, PV glass and finished-lamp identities cannot substitute this terminal. For every adopted UUID retain all card restrictions, actual type/media/CAS/form/grade/route/geography, exact property-chain evidence and official Chinese display. Unknown core identity prevents usable guidance and mapping acceptance."
    source_ids:
      - ge-glass-products-1990
      - jrc-glass-bref-2013
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Check first-release Q against unique release and net weighing records; reference amount and finished row are 1 kg. Reconcile the complete raw-to-attributed numerator chain, execute normalize_exchange exactly once and verify no protocol/card/aggregation divides again. Q=0 retains raw burden and yields no unit result."
    source_ids:
      - ilcd-allocation-2010
      - jrc-glass-bref-2013
  - rule_id: validate_balance
    applies_to: "all physical ledgers"
    rule: "Independently close wet total mass, elements and actual species with uncertainties; verify all start/stop/failure/rework/WIP/FG/non-WIP/asset/fluid states and inherited exchange vectors. A residual is not two measured quantities. For every package material check all six gross movements and mutually exclusive stocks; reconcile separate manufacturing and service gates and cancel internal Q on consolidation."
    source_ids:
      - ilcd-allocation-2010
      - jrc-glass-bref-2013
  - rule_id: validate_completeness
    applies_to: "site data"
    rule: "Require all real utilities, full supplied formulations, materials, equipment service, packaging and destinations. Any newly observed ingredient/species/repair component needs its own specific atomic row; not_applicable requires absence evidence, and unknown cannot become zero. Industrial sources supply no allocation approval; source-specific applicability, denominator, case scope and uncertainty remain explicit."
    source_ids:
      - ilcd-allocation-2010
      - jrc-glass-bref-2013
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
