system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Include receiving, silo/cullet segregation, weighing, batch mixing, melting/refining, forehearth conditioning, water-cooled ribbon rollers, orifice belt and blow heads, actual mould lubrication and air blowing, neck scribing/detachment, cullet collection/quench, annealing lehr, cooling, inspection/testing and first required quality release. Source-stage meters and material ledgers distinguish these operations within one integrated physical control volume."
      source_ids:
        - ge-glass-products-1990
        - epa-lamp-glass-1975
        - jrc-glass-bref-2013
    - rule_id: boundary_complete
      applies_to: "all inventory rows"
      rule: "Retain failed and zero-output batches, starts/stops, idle/holding, cleanup, testing/destructive samples, rework, leaks and rejects. Record opening/closing raw materials, WIP and unassigned non-WIP stores plus each exchange inherited history vector. Internal cullet, heat, water and interstage transfers cancel only after quantities and histories reconcile. A missing value is unknown, not zero; add each actual omitted material, formulation, fuel, fluid, package, waste and emitted species as an atomic row before dataset completion."
      source_ids:
        - epa-lamp-glass-1975
        - jrc-glass-bref-2013
    - rule_id: boundary_gate
      applies_to: "first_release and service"
      rule: "Q is net glass mass newly passing its first required release, once per original cohort. Released closing FG is already inside Q: never add it again as manufacturing output or subtract its manufacturing burden as Bclose. Manufacturing Bclose covers raw/WIP and unassigned non-WIP stores only. Maintain full physical FG opening/closing/gross shipments/returns/change/breakage ledgers separately; shipping and retesting do not create new production. Service has actual incremental burden and its original cohort Q and observation horizon; it is not a net-delivery model."
      source_ids:
        - epa-lamp-glass-1975
        - ilcd-allocation-2010
    - rule_id: boundary_assets_water
      applies_to: "physical control volumes"
      rule: "For each furnace/mould/lehr/spare and each installed oil/water/gas inventory keep unscaled item/mass/volume balance and inherited exchange vectors separately from current service burden. Record new repair additions and removed old material and real moisture independently. Correct already net-consumption records once only. Include actual cooling/air-compression/water treatment and offsite receiving services; no presumed steam boiler. External hot-water/condensate return, if real, needs Product mass, actual enthalpy and supplier water/energy agreement."
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-allocation-2010
    - rule_id: boundary_pack
      applies_to: "service packaging"
      rule: "For each material independently: opening empty + opening attached WIP + opening attached FG + opening reusable pool + new purchases + supplier-included received + external returns received + real repair additions = the mutually exclusive closing stocks + gross physically shipped out + separate external returns sent + waste + measured real losses. Track wood/cork moisture and new/old repair components when real. Internal reuse cancels; gross mass never receives an economic burden fraction, net-Q correction, repurchase or coproduct credit."
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-allocation-2010
    - rule_id: boundary_species
      applies_to: "physical and elemental balances"
      rule: "Keep total wet physical mass and relevant C/N/S/Cl/Si/Na/K/Ca/Mg/Al/B balances independently from actual species evidence. Measure gas humidity/remaining oxygen, reaction extent, free/structural/carrier water, condensate and non-WIP fluid stores in the same boundary. Do not fit two unknowns with one residual; do not manufacture species from COD/VOC/total-C/total-B/NOx/SOx or particulate size. Site mass-balance discrepancy remains an uncertainty/hold until independently resolved."
      source_ids:
        - jrc-glass-bref-2013
        - epa-lamp-glass-1975
