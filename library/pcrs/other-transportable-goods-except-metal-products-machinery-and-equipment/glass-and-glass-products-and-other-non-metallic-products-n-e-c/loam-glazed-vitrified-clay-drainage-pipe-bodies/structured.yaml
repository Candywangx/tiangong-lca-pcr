system_boundary:
  rules:
    - rule_id: b_complete_route
      applies_to: "manufacture"
      rule: "Include actual receipt and upstream supply, haulage, storage, body crushing/milling/screening/blending/ageing, water kneading, vacuum extrusion and pipe-end formation, controlled drying, loam glazing and re-drying, gas tunnel firing, controlled cooling, real ceramic finishing and specified body-quality tests through unique first release. Keep stage-specific meters and WIP."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_terminal
      applies_to: "reference product"
      rule: "Use the dense loam-glazed bare ceramic body only. Integral fired glaze remains part of it. Any actually fitted seal, coupling, adhesive, composite reinforcement, installation or pressure/jacking system changes the terminal and requires renewed methodology and atomic component coverage before use. Purchased finished-pipe packing cannot replace manufacture."
      source_ids:
        - jrc-ceramic-bref-2007
        - hepworth-clay-guide
    - rule_id: b_formulation
      applies_to: "each material"
      rule: "Purchase each whole supplied formulation once. Clay mineral assay, glaze solids, active fraction and carrier water are subaccounts, not extra purchases. On-site glaze preparation instead requires each real purchased ingredient, water, milling/mixing energy and loss. Never assume the six illustrated ingredients or a fixed composition; add each actual distinct additive as one specific card."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_manufacture_stocks
      applies_to: "manufacture"
      rule: "Keep each exchange inherited vector in opening/closing raw supply, each physical WIP stage and not-yet-assigned non-WIP stores. Bclose for manufacturing excludes already-first-released FG because its manufacturing load is already in Q; never deduct that closing FG load from this first-release numerator. Include failures, Q=0, start/stop, idle, hot hold, cleanup and genuine rework without erasing them."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_first_release
      applies_to: "manufacture; service; combined"
      rule: "Q is unique newly body-quality-released net kg of complete pipe bodies, not green mass, fired charge, dispatch, reinspection or an area/count estimate. Q includes released closing FG. Transfer Q once from manufacture to FG services, cancel it on consolidation and never add Q plus its closing FG as two production outputs."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_service_cohort
      applies_to: "service"
      rule: "Retain actual packing, storage, handling, dispatch, external returns, retest and incremental rework over observed H, assigned to original first-release cohort Qc. Keep opening and closing FG original manufacturing vectors outside current manufacturing reassignment. Retest/delivery creates no new production. Disclose unobserved future services; neither assume them zero nor invent them."
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-general-guide-2010
    - rule_id: b_delivery_alternative
      applies_to: "denominator"
      rule: "Do not replace Q with net delivery. Such another model needs gross dispatch G and physical returns R, original delivery-specific burden reversal D_rev, actual changed return mass/water/loss and incremental rework; returned kg alone never establishes original delivered burden or reversal."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_mass_species
      applies_to: "physical gates"
      rule: "Independently reconcile gross physical mass and relevant C/H/O/N/S/F/Cl/mineral elements using measured composition and chemical/phase evidence. Distinguish free water, structural water released or retained, reaction water, vapour and liquid condensate. One residual cannot fit two unknowns. NOx/SOx as equivalents, VOC/COD/TOC, total elements and particle size are not identified chemical species masses."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_utilities
      applies_to: "each utility"
      rule: "Record complete fuel mixture once, electricity separately, and every real heat supply and carrier mass/state separately with explicit provider conventions. Native extensive units govern each row. Integrate actual rates once; accumulated volumes are already totals. Internal recovered heat and water transfers cancel. Actual external steam/hot-water Product returns retain mass, temperature, pressure and enthalpy reference; never invent a boiler or steam supply."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_packaging
      applies_to: "each package design and ownership"
      rule: "For each packaging item: opening empty + attached-WIP + attached-FG + reusable stock + purchases + packaging received with supplies + external returns received = corresponding closing stocks + packaging leaving on gross physical shipments + external returns sent + waste. Record each destination and wet/attached residuals separately. Internal reuse cancels; no extra purchase, pipe Q, coproduct or automatic credit. Never scale gross custody by economic shares. Add measured repair material Radd, removed old material Rremove, absorbed/added water H2Oin and water release H2Oout per article: disjoint opening pools+P+I+ER+Radd+H2Oin = closing pools+G+EO+W+Rremove+H2Oout. Deduplicate the same water/material only against another same-side flow term of this bridge, never cancel real influx because closing wet stock includes it, an opposite-direction term exists or another atomic card is present. Dry wood/material and free/absorbed water are independent; one residual cannot fit two unknowns. Every real repair/cleaning water/material destination needs a specific atomic row with manufacture-Q or original-Qc/H ownership; repair is not assumed."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_assets
      applies_to: "each capital article and replacement"
      rule: "Separate physical asset custody from current service burden. Keep complete kiln, extruder, dryer, kiln car, die, cutting wire, lining and forklift stocks, new/used additions, genuine repairs and removals, material/moisture and in-machine fluid ledgers. Use measured service history and demand for the burden vector; no fixed lifetime or one whole machine per kg. Components already in a purchased article are subaccounts; real separate replacements and outputs each need their own exchange."
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-general-guide-2010
    - rule_id: b_atomic_completeness
      applies_to: "all inventory"
      rule: "A card names one actual supplied material/article, waste stream or real elementary species and destination. Add each genuinely present unlisted input/output; unresolved identity stays a specific unbound name and never becomes a generic bucket, hidden zero or claimed absence. Each card description and complete ancestor rules remain consumable applicability context."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_packaging_receipt_identity
      applies_to: "each packaging component and physical boundary"
      rule: "In the existing packaging bridge, P includes both separately paid and bundled paid acquisitions. I is N_ext: an actual first external non-purchased receipt, including a first free receipt with goods; it is an incoming leg, not an outgoing flow or a generic first-supply burden. ER is only the same identified article returning after its recorded prior outward crossing of this boundary; an article first received from another party is not ER. EO is an actual outward return to its identified counterparty. Record item/design, ownership, event, boundary, period, prior outward ID and actual condition to make these categories disjoint. Use the appropriate existing purchase or with-supply card for a bundled paid receipt once, never both. Retain every gross incoming/outgoing leg and disjoint empty, attached-WIP, attached-FG and reusable stocks; match internal stage transfers. The provider convention carries each actual acquisition/service burden once, independently of these gross custody quantities."
      source_ids: []
