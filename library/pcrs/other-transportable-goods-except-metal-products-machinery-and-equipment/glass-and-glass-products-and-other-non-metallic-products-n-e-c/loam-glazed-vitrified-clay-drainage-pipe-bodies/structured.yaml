allocation_rules:
  - rule_id: a_scope
    applies_to: "attributional manufacture and services"
    rule: "Use this allocation sequence only for the declared attributional decision context in which allocation is appropriate. Consequential substitution/system expansion and comparisons of multifunctional products are different cases and require a separate method. Industrial manufacturing diagrams establish no allocation rule."
    source_ids:
      - ilcd-general-guide-2010
  - rule_id: a_subdivide
    applies_to: "each exchange"
    rule: "First isolate dedicated operations and actual separately metered lines. Use actual or virtual subdivision to assign exclusive ingredients, glaze, identified parts, losses and utility demands to their physical receiving functions. Shared kiln presence alone does not justify a plant-wide mass or revenue split."
    source_ids:
      - ilcd-general-guide-2010
  - rule_id: a_causality
    applies_to: "remaining exchange"
    rule: "For each remaining exchange independently identify the determining physical cause that changes its quantity with each function. Demonstrate heating demand from actual ware/water/thermal history and time or equipment service from measured capacity constraint and duration when these really determine demand. Candidate mass/area/time keys require evidence; no universal key or fixed share."
    source_ids:
      - ilcd-general-guide-2010
  - rule_id: a_residual_market
    applies_to: "only genuinely residual joint-process exchanges"
    rule: "Only after documented failure of subdivision and determining physical causality may the actual remaining common-process exchanges use contemporaneous market value at the same process gate and actual output state/quality/quantity. Remove downstream packing/transport margins where needed to recover that gate value; disclose derivation, uncertainty and sensitivity. Never freely choose economic versus physical allocation."
    source_ids:
      - ilcd-general-guide-2010
  - rule_id: a_loss_reuse
    applies_to: "rejects and transfers"
    rule: "Carry failed ware, genuine rework, startup and cleanup burdens with their causal cohorts. Internal trim/chamotte/glaze return is a transfer with inherited per-exchange vectors, not new production or negative consumption. Actual waste remains separately identified; selling scrap does not establish an automatic co-product or avoided-production credit. New co-function status needs evidence and the same sequence."
    source_ids:
      - ilcd-general-guide-2010
  - rule_id: a_physical_ledgers
    applies_to: "each physical gate"
    rule: "Keep original gross material, return, waste, packaging and capital custody balances separate from the attributional exchange vector. Economic or service-burden shares never shrink observed gross physical masses. Reconcile assigned exchange shares completely without duplicating the original shared inventory."
    source_ids:
      - ilcd-general-guide-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "material receipts and actual consumption"
      record_type: "collected_record"
      raw_fields: "lot; supplied grade; whole wet mass; moisture; mineral assay; opening and closing raw/WIP/store vectors; transfer IDs; glaze purchased or site-mixed state; receipt_or_net_consumption_basis; stock_adjustments_already_applied; consumed_opening_history"
      collection_method: "Use calibrated net scales and actual invoices, assays and recipe issue/return records at every physical stage; whole supply once."
      unit: "kg"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Complete declared manufacture period including failures and idle"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity and fuel and real external heat/carriers"
      record_type: "collected_record"
      raw_fields: "meter start and end; kWh; gas integrated m3 or rate; pressure; temperature; wet/dry basis; independent density and composition; measured HHV/LHV; carrier kg; enthalpy states; substep and operating mode"
      collection_method: "Retain original energy/volume/mass records separately; apply actual gas-state and calorific conversions before assignment. Measure genuine external returns separately."
      unit: "row native units"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Complete declared manufacture period including failures and idle"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each intake or emitted species"
      record_type: "collected_record"
      raw_fields: "species CAS; origin; compartment; phase; sampling state; integrated volume or actual rate and time; analytical concentration; detection limit; independent density; reaction and retained-element evidence"
      collection_method: "Use species-resolved analyses and measured flow states; integrated concentration times accumulated volume needs no second time multiplier. Measure water phases and element balances independently."
      unit: "kg"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Complete declared manufacture period including failures and idle"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each rejected body or liquid or solid residue"
      record_type: "collected_record"
      raw_fields: "stream ID; destination; wet mass; independent dry solids and composition; sampled density; source stage; internal reuse; inherited vector; failure and cleanup events"
      collection_method: "Weigh each external waste transfer separately; sample liquid density at recorded temperature and solids/composition independently; do not infer absence from missing data."
      unit: "kg"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Complete declared manufacture period including failures and idle"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "each equipment or replacement service and physical article"
      record_type: "collected_record"
      raw_fields: "asset serial; complete-article and component inventory; new and old additions; repair/removal mass; water and in-machine fluid; actual service history; capacity constraint; opening/closing custody; inherited service vector"
      collection_method: "Keep gross calibrated article/part/fluid custody and real history separately from current attributable service-burden vector; no invented lifetime. Separately reconcile each physical article: opening+actual gross receipts+new material/water = closing+outward returns+retirement+wear into other recorded streams+actual water loss/other exits, with disjoint terms. Whole-asset included parts/fluids are subaccounts; separately supplied repair new/old material/water has its own exchange. Closing retention does not cancel influx and service shares do not shrink physical custody."
      unit: "kg and measured service units"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Complete declared manufacture period including failures and idle"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first-quality-released bare pipe body"
      record_type: "collected_record"
      raw_fields: "unique body and cohort IDs; net released mass Q; moisture basis; measured geometry; glaze coverage; no-fitted-seal state; actual test specification and result; first-release time; failure record"
      collection_method: "Weigh complete qualified bodies on calibrated scales excluding packages and fitted accessories; join unique first acceptance with dimensions, straightness, impermeability and strength requirements of the declared product specification. No guessed item kg."
      unit: "kg"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Complete declared manufacture period including failures and idle"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_pack_service
      process_id: "service"
      flow_role: "each packaging material and ownership"
      record_type: "collected_record"
      raw_fields: "design and ownership ID; opening empty/attached-WIP/attached-FG/reusable; purchases; packages with supplied goods; external returns received; corresponding closing stocks; gross-shipment attachment; external return sent; waste; moisture and residual; actual_Radd_Rremove; independent_H2Oin_H2Oout; dry_material; free_absorbed_water; same_side_flow_ownership"
      collection_method: "Reconcile independent custody for each package design and material at both physical gates; separate every actual destination. Internal reuse is a transfer only. Add measured repair material Radd, removed old material Rremove, absorbed/added water H2Oin and water release H2Oout per article: disjoint opening pools+P+I+ER+Radd+H2Oin = closing pools+G+EO+W+Rremove+H2Oout. Deduplicate the same water/material only against another same-side flow term of this bridge, never cancel real influx because closing wet stock includes it, an opposite-direction term exists or another atomic card is present. Dry wood/material and free/absorbed water are independent; one residual cannot fit two unknowns. Every real repair/cleaning water/material destination needs a specific atomic row with manufacture-Q or original-Qc/H ownership; repair is not assumed."
      unit: "kg"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Original cohort and full observed H including opening/closing events"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "original-cohort post-release electricity and incremental operations"
      record_type: "collected_record"
      raw_fields: "original cohort c; original Qc; observation horizon H; event timestamps; stage meter original units; storage occupancy and duration; gross dispatch and actual returned mass; retest and incremental rework; opening/closing service-material vectors"
      collection_method: "Collect actual post-release events and energy at original units without reassigning original FG manufacture; track rework moisture/material change and no new production. Add actual separate service fuel/water/species rows when present."
      unit: "MJ and original kWh"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Original cohort and full observed H including opening/closing events"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_asset_service
      process_id: "service"
      flow_role: "forklift article and service"
      record_type: "collected_record"
      raw_fields: "asset and cohort IDs; gross additions and removals; opening/closing asset and fluid custody; service demand and duration; actual shared capacity limit; original asset/repair burden"
      collection_method: "Measure true electric-handling equipment service and gross custody independently; new batteries, tyres or fluids bought separately require their own specific row and query. Separately reconcile each physical article: opening+actual gross receipts+new material/water = closing+outward returns+retirement+wear into other recorded streams+actual water loss/other exits, with disjoint terms. Whole-asset included parts/fluids are subaccounts; separately supplied repair new/old material/water has its own exchange. Closing retention does not cancel influx and service shares do not shrink physical custody."
      unit: "kg and measured service units"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Original cohort and full observed H including opening/closing events"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
