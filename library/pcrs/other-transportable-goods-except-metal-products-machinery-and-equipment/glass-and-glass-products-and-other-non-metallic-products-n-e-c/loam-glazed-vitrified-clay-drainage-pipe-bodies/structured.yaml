          description: "Only actual package-repair/storage gaseous H2O CAS7732-18-5, contemporary unspecified-air Mass/kg, over original Qc/H. Native ice/heavy-water/ionic aliases do not authorize those states. Measure evaporation independently of dry-material loss; one wet residual cannot fit both. No duplicate water in other outgoing flow terms; actual incoming moisture retained in closing stocks stays an influx."
          amount:
