    - protocol_id: cp_fg
      process_id: "service"
      flow_role: "FG physical and original burden bridge"
      record_type: "collected_record"
      raw_fields: "FG_open and FG_close by original cohort; Q received once; G_phys; R_phys; independent returned composition/moisture; actual incremental additions and losses; original manufacturing vectors; external shipment/return IDs; actual_manufacturer_permission; terminal_grade_compatibility; actual_rework_route; post_rework_body_acceptance; disposition; new_material_water; removed_old_material; independent_water_loss"
      collection_method: "Reconcile gross physical FG separately from service and manufacturing burden ledgers. Observe changed return mass instead of equating it to an old shipment. Preserve original burden metadata; do not recalculate manufacture at current rates. Real rework requires manufacturer permission and compatibility with the same bare-pipe grade/terminal, recording actual route, material/water additions, removed old material, independent water losses and actual post-rework specified dimensional, crack/integrity, strength/impermeability reacceptance and disposition. Do not assume cracked pipe repair, refiring or retest automatically passes. Failed articles need actual-state/destination waste or another method, retaining original Qc/H and manufacturing history."
      unit: "kg and exchange native units"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Original cohort and full observed H including opening/closing events"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_pack_mfg
      process_id: "manufacture"
      flow_role: "each packaging material and ownership"
      record_type: "collected_record"
      raw_fields: "design and ownership ID; opening empty/attached-WIP/attached-FG/reusable; purchases; packages with supplied goods; external returns received; corresponding closing stocks; gross-shipment attachment; external return sent; waste; moisture and residual; actual_Radd_Rremove; independent_H2Oin_H2Oout; dry_material; free_absorbed_water; same_side_flow_ownership"
      collection_method: "Reconcile independent custody for each package design and material at both physical gates; separate every actual destination. Internal reuse is a transfer only. Add measured repair material Radd, removed old material Rremove, absorbed/added water H2Oin and water release H2Oout per article: disjoint opening pools+P+I+ER+Radd+H2Oin = closing pools+G+EO+W+Rremove+H2Oout. Deduplicate the same water/material only against another same-side flow term of this bridge, never cancel real influx because closing wet stock includes it, an opposite-direction term exists or another atomic card is present. Dry wood/material and free/absorbed water are independent; one residual cannot fit two unknowns. Every real repair/cleaning water/material destination needs a specific atomic row with manufacture-Q or original-Qc/H ownership; repair is not assumed."
      unit: "kg"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Complete declared manufacture period including failures and idle"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
  calculation_rules:
    - id: calc_raw_units
      applies_to: "each original raw record"
      rule: "Convert original units/state before attribution: electricity_MJ = electricity_kWh * 3.6; fuel_MJ_HHV = measured gas volume at declared state * independent measured HHV per same-state volume; carrier_mass = measured same-state volume * independent measured density. Integrate only actual rates once. Never use secondary-property factors as measured mass/density or multiply an accumulated volume by time. For actual external thermal carriers, multiply each independently measured supply/return mass in kg by its own same-reference specific enthalpy in kJ/kg to obtain that leg's kJ, then divide by 1000 once to obtain MJ. Unequal supply/return masses require their separate enthalpy legs and actual loss/storage terms on the same boundary, period and energy basis; use m times delta-h only for a demonstrated matched carrier mass and boundary. This conversion invents neither efficiency nor a second provider purchase."
      inputs:
        - cp_energy
        - cp_species
        - cp_material
      output: "Unnormalized unit-consistent raw exchange U_i"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: calc_manufacture
      applies_to: "all manufacturing rows"
      rule: "For each exchange i form C_i = Bopen_i + U_i - Bclose_i, keeping signed real input/output quantities and inherited vectors; Bclose excludes released FG. Assign C_i to target cohort by Section 7 subdivision then determining causality then only genuine residual market value to obtain A_i. The single final quotient is q_i = A_i / Q for Q > 0; finished_pipe output is 1 kg. Cards and protocol aggregation cite this same result without further division. If Q = 0 retain actual load and disposition but produce no unit result. Declare receipt/occurrence versus already-stock-adjusted actual net-consumption basis per exchange; never correct net consumption for the same stock a second time. Consumed opening material retains complete upstream vectors; unreleased WIP/non-WIP use consistent bases, with physical quantity and every inherited exchange history separate. Ordinary waste transfer/sale does not automatically subtract original manufacture/treatment burden; apply Section7 actual function/attribution without implicit credit. For a package, FG or asset custody-only physical movement card, override the burden-stock assignment for that physical disclosure: A_i is the actual full gross leg V_i in its native extensive unit, not Bopen_i + U_i - Bclose_i, an inherited burden or an economically allocated quantity. The same final q_i = V_i / Q reports that gross leg once, separately from the manufacturing burden vector, without another purchase, provider load or credit. This exception does not alter actual separately attributable supply, treatment or service burdens and does not stock-correct already measured gross movements. This same physical-only override also covers actual gross thermal-carrier ingress and external Product returns, including the carrier kg of steam, condensate and heatwater_return where actually present. Use independently measured gross carrier mass and its pressure, temperature, phase/dryness and agreed enthalpy reference; keep actual heat MJ as a separate dimension of the chosen one whole-provider supply/service, not an additional carrier-water or heat purchase. Internal circulation cancels rather than becoming an external gross leg. An actual return alone creates no credit and does not remove separately attributable real supply, conditioning, treatment or service burdens."
      inputs:
        - cp_cohort
        - cp_material
        - cp_energy
        - cp_species
        - cp_waste
        - cp_asset
        - cp_freight
        - cp_pack_mfg
        - cp_release
      output: "Per-reference-flow manufacturing inventory"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-general-guide-2010
    - id: calc_service
      applies_to: "all service rows"
      rule: "For original cohort c over observed H, A_icH is actual incremental service exchange after unit conversion, service-material stock inheritance and Section 7 assignment. The single final quotient is q_icH = A_icH / Qc for original Qc > 0. Keep original FG manufacturing vectors separately; no subtraction of released closing FG manufacture, no current manufacturing recount, no new Q and no second quotient in a card. If Qc = 0 report no unit result. For package, FG or asset custody-only physical movement cards, A_icH is instead the actual full gross leg V_icH in its native extensive unit; report q_icH = V_icH / Qc using this same single quotient. Do not add inherited manufacture, correct this gross leg for stocks, replace it with a service-burden vector or scale it by an economic share. Keep the gross physical view separate from actual attributable incremental service burdens, with no additional supply purchase, provider load or credit. Actual performed services remain assigned to original Qc/H even if serviced FG stays held at closing; only genuinely unconsumed and unassigned service-material stores may carry forward. This same physical-only override also covers actual gross thermal-carrier ingress and external Product returns, including the carrier kg of steam, condensate and heatwater_return where actually present. Use independently measured gross carrier mass and its pressure, temperature, phase/dryness and agreed enthalpy reference; keep actual heat MJ as a separate dimension of the chosen one whole-provider supply/service, not an additional carrier-water or heat purchase. Internal circulation cancels rather than becoming an external gross leg. An actual return alone creates no credit and does not remove separately attributable real supply, conditioning, treatment or service burdens."
      inputs:
        - cp_service
        - cp_pack_service
        - cp_asset_service
        - cp_fg
      output: "Observed original-cohort service inventory"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-general-guide-2010
    - id: calc_fg_bridge
      applies_to: "physical FG and consolidation"
      rule: "At consistent gates FG_open + Q + R_phys + actual added mass = FG_close + G_phys + FG_waste + actual mass lost. Use measured return composition/water and separate product/packaging/species. Q is an internal manufacture-to-FG transfer: cancel it on consolidation, never add Q and closing FG as external production. Keep each original cohort burden and actual service vector independently. Net-delivery accounting is unavailable without original D_rev bridge and cannot replace this Q."
      inputs:
        - cp_release
        - cp_fg
        - cp_service
      output: "Physical FG and original-burden bridge without new output"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: calc_physical
      applies_to: "manufacture; FG; combined; packages; assets"
      rule: "At each physical gate reconcile opening stocks + gross external inputs + actual received transfers = closing stocks + gross external outputs + actual sent transfers, including air species, vapour/liquid and material phases. Cancel internal transfers in the combined gate. Independently check relevant element and reaction balances; never use an allocation share on this gross balance or fit two unknowns with one residual. Capital custody and each package obey the same independent conservation with their specific terms in Section 5."
      inputs:
        - cp_cohort
        - cp_fg
        - cp_species
        - cp_pack_mfg
        - cp_pack_service
        - cp_asset
        - cp_asset_service
      output: "Independent mass and element and phase closure"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: calc_assets
      applies_to: "equipment and components"
      rule: "Determine current service-burden vectors from actual article/repair inherited inventories and measured service-demand/capacity/duration evidence using Section 7. Physical complete-article and part additions/removals, stored fluids and moisture remain gross custody, not multiplied by economic shares. Never invent life, annual output, utilization or a per-kg whole-machine dose. Do not double count capital components or raw physical articles as another consumed service inventory."
      inputs:
        - cp_asset
        - cp_asset_service
      output: "Attributable capital service vector and separate gross custody"
      source_ids:
        - ilcd-general-guide-2010
  data_quality_requirements:
    - id: dq_terminal
      applies_to: "identity and applicability"
      requirement: "Match actual supplied form and complete body terminal, exact native restrictions, independent primary context and required qualifiers; ordinary provider uncertainty is disclosed rather than substituted by another product."
      evidence: "Product specification; full provider/native records; actual body tests"
    - id: dq_measurement
      applies_to: "all observed records"
      requirement: "Retain calibration, raw units/state, detection limits, missingness and actual route/configuration/time/site scope; no fabricated numerical defaults or implied whole-plant pass."
      evidence: "Original scales/meters/analyses and uncertainty"
    - id: dq_completeness
      applies_to: "all stages and modes"
      requirement: "Include every real atomic exchange, all operating modes, raw/WIP/FG/asset/package stocks and inherited vectors, actual returns/rework and observed services; expose each unbound or unmeasured relationship."
      evidence: "Independent stock/species/custody ledgers and source-specific gap register"
    - id: dq_method
      applies_to: "assignment and downstream use"
      requirement: "Document decision context, exchange-specific allocation sequence, contemporaneous common-gate prices only where residual, actual H/Qc and uncertainty. No installation, pressure class or service-life equivalence is established by kg."
      evidence: "Attribution evidence and original cohort traceability"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and bound rows"
    rule: "Require physically compatible finished Product identity and each exact native extensive-property/unit chain. Retain all material/form/route/CAS/geography/media/type restrictions and provider conditions in the card. A wrong family, unreconciled hard conflict or unresolved reference identity blocks use; ordinary unresolved auxiliaries remain explicit collection/identity gaps."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_gate
    applies_to: "reference product; manufacture; service"
    rule: "Verify complete route and true bare-glazed terminal, specification and unique first-release records. Reject manufacturing Q deduction for released closing FG, double Q/FG output, net-delivery substitution, reinspection production and omission of original-cohort H/Qc services."
    source_ids:
      - jrc-ceramic-bref-2007
      - ncpi-vcp-manual-2017
      - hepworth-clay-guide
  - rule_id: v_raw_once
    applies_to: "all quantities"
    rule: "Require undivided raw collection, state-specific conversion and supported attribution before the single calc_manufacture or calc_service quotient. Cards and aggregation only reference its result. Missing density, gas state, calorific basis or denominator evidence is unknown, never pass. For Q or Qc zero preserve actual loads and report no unit result."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_closure
    applies_to: "manufacture; FG; combined; packages; assets"
    rule: "Verify independent gross mass and relevant element/species/water/reaction balances at all consistent physical gates, original inherited exchange vectors, each package custody balance, capital/parts/fluid custody and separate service burden. One residual for two unknowns, provider duplication or converting a total indicator into a species fails completeness."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_allocation
    applies_to: "each joint exchange"
    rule: "Audit subdivision, determining physical cause and only residual common-gate market value in that order, with actual evidence and uncertainty. Engineering/schema/finite-measurement checks establish neither scientific/translation approval nor accepted classification mapping/publication."
    source_ids:
      - ilcd-general-guide-2010
  - rule_id: v_sources
    applies_to: "complete input package"
    rule: "Source-specific applicable primary context and actual foreground observations must support the intended claim. A historical case diagram, source registry status, tool exit zero or metadata match supplies no numerical plant coverage. Expose unavailable observations, unresolved flows, exclusions and uncertainty; do not label a draft or unmeasured plant as covered."
    source_ids:
      - jrc-ceramic-bref-2007
      - ilcd-general-guide-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Attributed complete-pipe-body manufacture and separately disclosed observed cohort services at matched terminal"
  allowed_use: "Actual qualified bare loam-glazed pipe-body supply with applicable upstream and service contexts"
  excluded_use: "Installed sewer comparison; pressure/jacking service; generic life/strength claims; polymer/cement/refractory substitution; fitting/seal assembly; unverified provider or missing core identity"
  required_metadata: "All Section 3 qualifiers; full original raw/WIP/FG and physical custody context; source-specific evidence; exact native restrictions; Q and original H/Qc"
  required_quality_disclosure: "Actual scope and missingness; unbound specific exchanges; calibration and uncertainty; source age and counterexamples; scientific/translation/mapping state"
  update_trigger: "Changed clay/glaze supplied form or route; fitted seal/component terminal; kiln/utility/provider or native restrictions; new actual emissions or stock/service basis"
data_sources:
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission JRC, Ceramic Manufacturing Industry BREF, August 2007, §§1.5.2 and 2.3.2 and 3.3.2; Figures 2.14/2.15 and 3.5; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "Primary conventional pipe raw preparation, extrusion, drying, loam glazing, firing, optional end treatment and process emissions/losses; tables/diagrams are conditional historical examples rather than recipe, emission, energy, allocation or quality defaults."
  - id: "ncpi-vcp-manual-2017"
    type: "handbook"
    reference: "National Clay Pipe Institute, Vitrified Clay Pipe Engineering Manual, 2017, Foreword and Chapter 1 pp.1-1–1-5; https://www.ncpi.org/assets/ncpi-engineering-manual.pdf"
    used_for: "Independent primary dense vitrified clay body qualification and principal raw-to-extrusion/drying/firing/cooling/body-testing context; joint, perforated and installed-sewer cases are distinct. No numeric test, life, temperature or strength default adopted."
  - id: "hepworth-clay-guide"
    type: "handbook"
    reference: "Hepworth Clay, Product Design Guide, publisher PDF snapshot, pp.4 and 8–9 and 11 and 15–17; https://blog.wavin.com/hubfs/UK/Hepworth%20Clay/Hepworth%20Clay%20Product%20Design%20Guide.pdf"
    used_for: "Primary plain-ended/unjoined pipe and separately fitted coupling state. Proprietary calcination/roller firing, water source, recipe, moisture, geometry, performance and life are counterexamples, not transferred into the conventional loam-glazed tunnel route or claimed same SKU."
  - id: "ilcd-general-guide-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General Guide for LCA Detailed Guidance, first edition March 2010, §§7.9.2–7.9.3 pp.255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctional-process subdivision/virtual subdivision, exchange-specific determining physical causality and only residual common-gate contemporaneous market value. Product QFD/consequential and waste-fee research examples do not establish this pipe method."
