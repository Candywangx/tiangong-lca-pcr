      record_type: "collected_record"
      raw_fields: "shipment ID; actual cargo net/gross mass; route and distance; carrier type; load constraint; supplier delivery boundary; packaging custody"
      collection_method: "Use actual freight records and documented mass/distance conversion; separate freight service from payload and from an already transport-inclusive provider."
      unit: "t km"
      frequency: "Every lot/event with continuous meters where applicable"
      temporal_coverage: "Complete declared manufacture period including failures and idle"
      site_scope: "Actual facility and declared stages/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original records and calibration; actual test/analysis scope and uncertainty; missingness explicitly marked"
    - protocol_id: cp_cohort
      process_id: "manufacture"
      flow_role: "opening and closing raw/WIP and unassigned-store inheritance"
      record_type: "collected_record"
      raw_fields: "cohort and physical state; raw/WIP/store quantities; per-exchange inherited vectors Bopen/Bclose; real internal transfers; actual modes and failed Q0; released FG separated"
      collection_method: "Audit original inventory history per exchange at each stage; exclude already-first-released FG from manufacture Bclose but retain its physical stock and original vectors in cp_fg."
