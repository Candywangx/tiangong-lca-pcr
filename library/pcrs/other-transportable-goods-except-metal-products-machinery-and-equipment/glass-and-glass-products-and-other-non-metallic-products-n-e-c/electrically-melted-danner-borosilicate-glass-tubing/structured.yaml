system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "applicability"
      rule: "Use the complete section1 manufacture route. Record upstream extraction/production and real transport of whole purchased materials and utilities with appropriate providers, not just received tube packaging. Internal batches/melt/cullet/air/water/electricity transfers retain vectors and cancel once at the combined gate. Supplier substitution never proves compatibility."
      source_ids:
        - jrc-glass-bref-2013
        - schott-hot-forming
    - rule_id: b_release
      applies_to: "manufacturing and FG gates"
      rule: "Q is net kg of newly first-quality-released bare tube. Include opening/closing glass WIP and melt with inherited exchange vectors and every failed batch zero-output trial start-stop holding idle cleaning and rework load. Q already includes the same cohort closing FG; do not add closing FG to manufacturing production. The complete manufacturing physical gate includes opening raw material, WIP/melt and installed/spare material stocks plus actual external receipts = Q plus the corresponding closing unreleased raw/WIP/melt and installed/spare stocks plus all real external exits. Newly first-released closing FG is outside that manufacturing closing term and its full manufacturing exchange vector remains assigned to Q. Include reactive and bulk-gas inputs/releases where applicable; pair substage net withdrawals separately and never mix gross receipts with stock-corrected consumption."
      source_ids:
        - jrc-glass-bref-2013
        - schott-duran-tubing
    - rule_id: b_service
      applies_to: "post-release service account"
      rule: "Keep actual original-cohort packing storage handling dispatch return inspection and incremental repair/breakage loads in a separate service account normalized to that original Q and observed interval. Track opening FG + newly released tube + actual customer-return receipts + each real service material/water input = closing FG + gross physical dispatch + actual scrap/other physical exits and species releases. Reconcile actual wet/dry tube changes, added water/material and removed glass/moisture independently; add each real exchange as a specific row and retain unworked-tube applicability. Return receipt or retest is not new Q. Preserve original-dispatch reversal, prior production vector and actual incremental repair vector; no complete return-cohort result with unknown history. Cancel internal first release Q when combining manufacturing and service physical gates; do not duplicate original production burdens."
      source_ids:
        - schott-duran-tubing
        - jrc-ilcd-2010
    - rule_id: b_charge
      applies_to: "non-WIP stocks and services"
      rule: "Independently retain installed and spare electrodes refractories lubricant circuit water air receivers and any actually present process/refrigerant charge, with opening/closing physical stocks and each exchange-specific inherited historical vector. Actual measured consumption/service-equivalent accounting may replace a stock equation only on the same scope and without a second stock correction. New purchases physical receipt and installed consumption are different ledgers. For actual chillers steam boilers or other additional equipment add their true atomic exchanges; never presume they exist or erase them by a zero."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: b_pack
      applies_to: "each packaging article separately"
      rule: "For each carton, PE film and wooden pallet: opening empty + opening attached WIP/FG + opening reusable + new purchase + external return received = closing empty + closing attached WIP/FG + closing reusable + packaging accompanying gross physical outward shipment + return to external owner + waste. All terms use the same measured physical mass/configuration; each packaging form, part and destination is separate. Internal reuse cancels and does not create another purchase, net tube Q or automatic coproduct/credit. Actual packaging repair needs the real new component, removed old component, processing energy and their historical vectors."
      source_ids:
        - schott-duran-tubing
        - jrc-ilcd-2010
    - rule_id: b_species
      applies_to: "chemical and physical completeness"
      rule: "Independently reconcile total physical mass and relevant Si B Na Al C H O and actual N S Mo element balances, including atmospheric/reactive gases and each external water destination. Melting emission cards are a shared site species ledger across all included emitting stages: retain disjoint source-stage subaccounts for furnace, Danner/muffle, lehr, cleaning and service releases and assign actual ownership before aggregation. Utility water vapour and bulk carrier-gas exits remain disjoint physical quantities. One residual cannot determine two unknowns; total B/NOx-as-NO2/SOx/COD/VOC/PM is not proof of molecular mass. Add each other actual substance, carrier gas, material, package, waste or return as a specific atomic row before dataset completion; unexplained residuals remain unknown, never other/zero."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: b_boric_reaction
      applies_to: "boric-acid conversion and water destinations"
      rule: "The supported thermal pathway is H3BO3 → HBO2 + H2O, followed by 2 HBO2 → B2O3 + H2O. The net 2 H3BO3 → B2O3 + 3 H2O is only a complete-dehydration relationship, not a measured yield or purchased free-water quantity. Use assayed feed and independently determined conversion/retention and captured/emitted species; distinguish incomplete HBO2 retention from B2O3 retained in glass and actual boron volatilization. Keep free moisture, reaction water, hydrate/structural water and phase destinations separate. Do not infer both boron loss and water from one mass residual."
      source_ids:
        - jrc-glass-bref-2013
        - us-borax-optibor-2026
