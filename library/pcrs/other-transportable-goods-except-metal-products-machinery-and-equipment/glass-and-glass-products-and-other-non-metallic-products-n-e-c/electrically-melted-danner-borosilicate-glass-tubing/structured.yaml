allocation_rules:
  - rule_id: a_scope
    applies_to: "method applicability"
    rule: "Apply these allocation rules only to attributional cases where allocation is required under the declared study framework. First separate dedicated batches, product lines and services; use physical or virtual subdivision to assign exclusive materials and measured services. No free choice between system expansion and allocation is established by this PCR."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For every genuinely inseparable shared exchange identify and quantify the determining physical causal relationship to each co-function. A shared meter may use measured actual duty, heat demand or material embodiment only where it causally determines that exchange. Mass, time or value alone is not automatically valid; different exchanges may require different physical relations. Preserve evidence and all non-selected relations."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "residual multifunctional process only"
    rule: "Only the residual exchanges left after dedicated assignment/virtual subdivision and determining physical causality may use contemporaneous real co-function market values in the same actual condition and amount at the common process gate. Derive gate values transparently if only downstream conditioned/packed/transported prices exist. State period currency state quantities evidence and sensitivity; do not use one downstream finished price for all functions, an arbitrary physical/economic choice or fixed percentages. Negative-value waste requires the applicable waste framework and cannot be assigned a fictional positive sale."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_returns
    applies_to: "internal returns scrap and packaging"
    rule: "Internal glass/dust/water/air/packaging transfers carry their original exchange vectors and cancel at the combined gate; they do not create an avoided-material credit or fresh production. An actual externally sold useful coproduct needs a verified function/status and separate quantity before allocation. Post-consumer waste-glass recycling and substitution credits are outside this virgin-feed manufacturing method and require their own framework."
    source_ids:
      - jrc-ilcd-2010
      - jrc-glass-bref-2013
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "batch"
      flow_role: "whole chemicals and internal transfers"
      record_type: "weighing receipts charge sheets stock assay"
      raw_fields: "lot; supplier; whole supplied mass; assay; free moisture; hydrate/structural water; origin; dry solids; opening closing stocks; inherited vector; transfer counterpart"
      collection_method: "Calibrated scales and representative chemical/moisture tests; reconcile every supplied ingredient separately. Internal assay/water is not a second procurement."
      unit: "kg"
      frequency: "each receipt charge stock closure and batch"
      temporal_coverage: "complete manufacturing cohort including failure and carryover"
      site_scope: "receiving batch and internal donor receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration bills assays batch linkage and raw archive"
    - protocol_id: cp_energy
      process_id: "all"
      flow_role: "electricity and each actual fuel"
      record_type: "meters bills operating logs"
      raw_fields: "meter and parent; start end integrated reading; true rate timestamp if rate; voltage supplier geography; fuel composition pressure temperature reference volume LHV; stage; campaign; standby cleanup failure; allocation evidence; original cohort"
      collection_method: "Read integrated meters directly; integrate only true rates. Independently test real fuel LHV/composition and state. Reconcile parent/submeters and avoid electricity double count between utility production and consumption."
      unit: "MJ; kWh; m3"
      frequency: "continuous/log interval plus every start stop and closing read"
      temporal_coverage: "whole furnace campaign contribution and observed service interval"
      site_scope: "all stages with original-cohort attribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration invoice reconciliation and causal worksheet"
    - protocol_id: cp_balance
      process_id: "all"
      flow_role: "batch melt trim and elemental/physical gates"
      record_type: "physical transfer and independent analysis"
      raw_fields: "stage source destination; actual gross tare net mass; opening closing WIP/melt; free reaction retained water; Si B Na Al C H O plus actual N S Mo; gas inlet outlet; density state; inherited exchange vector"
      collection_method: "Pair every internal transfer; independently assay materials/product/dust and gas/water destinations. Reconcile physical and element gates separately and report uncertainty and unknown residuals."
      unit: "kg; actual gas m3"
      frequency: "batch transfer and opening closing"
      temporal_coverage: "same manufacture FG and combined gate periods"
      site_scope: "all receiving emitting and retained-stock boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "independent analytical results closure sheets and uncertainty"
    - protocol_id: cp_release
      process_id: "draw_release"
      flow_role: "unique first quality release"
      record_type: "acceptance and calibrated weighing"
      raw_fields: "unique release id; originating batch; specification revision; actual OD wall bore length and tests; first-release flag; gross tare net kg; temperature humidity moisture; rejection; original cohort"
      collection_method: "Weigh bare cooled annealed stock tube with calibrated tare; link dimensional/chemical/surface tests to the same lot and de-duplicate release ids. Retest and dispatch are not first release; no item-to-kg assumption."
      unit: "kg"
      frequency: "every first-release event"
      temporal_coverage: "one complete defined manufacturing cohort"
      site_scope: "declared first-release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "traceable calibration acceptance tests and duplicate-id review"
    - protocol_id: cp_emission
      process_id: "all"
      flow_role: "each real chemical species and destination"
      record_type: "monitoring speciation and reaction/element records"
      raw_fields: "source stage; species and CAS if known; phase; compartment; integrated gas volume or rate timestamps; concentration basis; moisture; capture; actual chemical conversion; total B NOx SOx PM COD VOC indicators separately; residual; uncertainty"
      collection_method: "Use method-matched speciation plus independently assayed reactive inputs and retained products; document actual reactions and separate free reaction structural water. Total physical and element closure cannot fabricate species. Apply actual gas-state conversions; integrated volume is not multiplied by time."
      unit: "kg; m3; actual concentration unit"
      frequency: "monitoring interval and every abnormal event"
      temporal_coverage: "same cohort and actual abnormal/zero-output coverage"
      site_scope: "all actual vents water outlets and solid captures"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full laboratory methods raw volumes origin and compartment evidence"
    - protocol_id: cp_utility
      process_id: "utilities"
      flow_role: "water air treatment and actual return"
      record_type: "meters chemistry utility supply agreement stock"
      raw_fields: "utility; fresh supply; opening closing installed circuit/receiver; pressure temperature humidity independent density; chemical whole formulation and assay; circulation; leakage; evaporation; condensate; external return and enthalpy; blowdown; supplier energy ownership; vector"
      collection_method: "Meter actual supply/return; independently measure substance/state density; correct real installed stocks once. Internal circulation and reused condensate are paired and cancelled; chemical carrier water is counted inside the formulation once."
      unit: "kg; m3; MJ"
      frequency: "meter interval each makeup drain return and stock closure"
      temporal_coverage: "manufacturing campaign and original-cohort services"
      site_scope: "real utility interfaces including external Product returns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration PVT chemistry enthalpy agreements and vector history"
    - protocol_id: cp_charge
      process_id: "all"
      flow_role: "electrode refractory lubricant installed stock"
      record_type: "installation maintenance removal and stock history"
      raw_fields: "article/fluid identity; new receipt; cold spare; opening closing installed mass; configuration; actual service; topup; removed recovered leaked dissolved amount; same-period stock and inherited exchange vector by vintage"
      collection_method: "Measure physical stocks and wear with maintenance records; follow each historical vector separately from glass WIP. Use measured service-equivalent consumption only when the same inventory is not corrected again. Add the actual species of every loss."
      unit: "kg; actual service unit"
      frequency: "each receipt installation maintenance removal and closure"
      temporal_coverage: "whole actual remaining and consumed service scope"
      site_scope: "equipment stocks independently from WIP"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing maintenance actual lifetime/service and inherited-vector records"
    - protocol_id: cp_waste
      process_id: "all"
      flow_role: "each solid or liquid waste and dust return"
      record_type: "weighing analysis handover"
      raw_fields: "origin cohort; chemistry; moisture; total mass; internal receiver; external destination; legal/physical status; actual function; retained vector; stock"
      collection_method: "Weigh and analyse each real stream separately; pair returned dust and cullet; retain actual physical destination and treatment ownership, never assume coproduct/credit."
      unit: "kg"
      frequency: "each generation transfer and closing stock"
      temporal_coverage: "whole manufacturing and service periods including failure"
      site_scope: "all waste gates and internal receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "handover receipts assays inventory and destination proof"
    - protocol_id: cp_service
      process_id: "services"
      flow_role: "FG physical dispatch return and incremental service"
      record_type: "cohort-linked stock movement and service logs"
      raw_fields: "original Q and release id; opening closing FG; gross dispatch; customer return; original delivery reversal; breakage; actual incremental repair; each actual new material/water and removed glass/moisture; actual waste/emission destination; service interval; prior production vector and current service vector"
      collection_method: "Reconcile lot-level physical FG independently from production Q. Follow returned original goods and repair increments to original cohorts and dispatch reversals, without creating production from deliveries/retests."
      unit: "kg; actual service units"
      frequency: "every movement and service event plus stock closure"
      temporal_coverage: "declared observed post-release interval by original cohort"
      site_scope: "warehouse dispatch and return gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "unique release shipment and return ids full history and burden-vector reconciliation"
    - protocol_id: cp_pack
      process_id: "services"
      flow_role: "each whole packaging article each direction"
      record_type: "purchase tare movement return repair waste stock"
      raw_fields: "one packaging material/configuration; new supply; external return received; opening closing empty attached WIP/FG reusable; gross accompanying dispatch; return to external owner; waste; tare count; new/removed repair components; original cohort vector"
      collection_method: "Weigh actual packaging separately from bare tubes; count only with measured configuration tare. Reconcile b_pack for each article and destination, cancelling internal reuse and preserving actual repair components/services."
      unit: "kg; count"
      frequency: "each purchase dispatch return repair disposal and stocktake"
      temporal_coverage: "same declared original-cohort service interval"
      site_scope: "empty attached and reusable packaging physical gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare calibration purchase receipts return notes repair and waste evidence"
  calculation_rules:
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q_c > 0, result_j_c = A_j_c / Q_c exactly once. First convert original raw numerator units and actual gas/liquid states or integrate genuine rates; then perform evidenced allocation and disjoint raw/WIP/installed-charge historical-vector carryover. For manufacturing burden/consumption numerators, A_j_c is the first-release transfer vector B_j_c^Q: attributable real additions plus opening minus closing unreleased raw/WIP/melt and unassigned installed/spare service vectors, after traced assignment to any other actual function. First-released FG, including held closing FG, is already in B_j_c^Q and is never subtracted from it. Do not correct already measured net consumption again. For each exchange the FG history ledger is opening FG vector + B_j_c^Q + actual return at original dispatch vector + real incremental service additions = closing FG vector + gross dispatch vector + other traced removals/destinations. Service burden A_j_c includes every actually performed original-cohort service increment; opening/closing correction applies only to disjoint unconsumed or unassigned service/charge stocks. Service already performed on that cohort remains included even if the serviced tube stays in closing FG, whose trace vector is retained without subtracting it from A_j_c. Original manufacture is preserved but not added again. Q_c remains the original first-release kg after returns, repair and wet/dry changes. Cancel B_j_c^Q and Q_c as internal transfers in combined history/physical gates, retaining actual external inputs/returns, closing stocks, gross dispatch and other actual exits. For manufacturing material-input cards, A_j_c is attributable whole-supply withdrawal/consumption with the stated disjoint stock correction and its inherited upstream vector; cp_material still preserves gross purchase receipts separately, so unused procurement is not all consumed in this cohort. Explicit packaging-purchase, internal-transfer, gross-dispatch, external-return and waste movement cards use actual physical movement as A_j_c and keep burden-consumption vectors separately. Packaging upstream burdens follow actual consumption/service and the retained vectors, not every repeated returned physical receipt; unused stock does not reduce a recorded gross purchase or gross shipment movement. Internal transfers cancel and no original production burden is added a second time. All cards and aggregation read this stored result; collection never divides raw records. At Q_c = 0 preserve every real load and issue no unit result."
      inputs:
        - A_j_c
        - Q_c
        - original_cohort
        - measurement_state
        - vector_history
      output: "result_j_c"
      source_ids:
        - jrc-glass-bref-2013
        - schott-hot-forming
        - schott-duran-tubing
        - jrc-ilcd-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_primary
      applies_to: "all foreground records"
      requirement: "Use real primary records for the declared site period and cohort with calibration raw archive coverage and independent analytical uncertainty. Missing future values are collection obligations; unknown is not zero or a pass."
      evidence: "meters scales full lab reports and coverage ledger"
    - id: dq_identity
      applies_to: "every UUID and supplier"
      requirement: "Apply all native card restrictions, exact physical chemistry/form/route/media/type and unit chain before actual linkage; classification or an exit0 receipt alone does not prove applicability. Preserve explicit substitutions and unresolved auxiliary identities; no invented equivalence or density."
      evidence: "complete native records supplier assays route and unit references"
    - id: dq_boundary
      applies_to: "physical manufacturing FG combined and packaging gates"
      requirement: "Retain distinct matching-period physical and burden ledgers, every inherited vector, failed/zero-output interval and missing-species uncertainty. No one-residual two-unknown fit; data from another furnace family or proprietary product does not fill the gap."
      evidence: "signed balance and history worksheets source limitations"
    - id: dq_allocation
      applies_to: "shared and multifunctional operations"
      requirement: "Document subdivision determining physical causality and any genuinely residual same-gate market-value step; report causal evidence coverage uncertainty and sensitivity. No fixed shares or automatic credits."
      evidence: "ILCD method context and actual allocation records"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and route"
    rule: "Declare every Required qualifier and satisfy the complete narrow route and native reference restrictions; waste sorting, quartz, sheet routes and downstream formed articles cannot resolve as this output."
    source_ids:
      - unsd-cpc3-2025
      - jrc-glass-bref-2013
      - schott-hot-forming
      - schott-duran-tubing
  - rule_id: v_q
    applies_to: "first release and FG"
    rule: "The selected Product output row is finished with 1 kg net bare first-release tube. Q deduplicates release events and retains failures/zero output; FG, gross dispatch, returns and repair increments obey b_release/b_service and never create another Q."
    source_ids:
      - jrc-glass-bref-2013
      - schott-duran-tubing
  - rule_id: v_once
    applies_to: "every numerator"
    rule: "Undivided raw records convert states/units/rates and allocate before normalize_once; every card and aggregation reads the same one stored result. Q=0 retains actual loads without a unit value; a failed query or unknown relation cannot become no-hit or pass."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: v_mass_species
    applies_to: "full physical and chemical gates"
    rule: "Reconcile independent total mass and each relevant element; distinguish supplied chemical from oxide equivalent and free/reaction/phase/structural water. Retain every actual species/destination and unknown remainder. NOx/COD/VOC/total B are indicators, not arbitrary molecular masses."
    source_ids:
      - jrc-glass-bref-2013
  - rule_id: v_stock
    applies_to: "WIP and non-WIP stocks"
    rule: "Opening/closing raw glass/melt WIP FG and installed/spare electrode/refractory/fluid/water/air or other actual charge records preserve independent physical stocks and exchange-specific inherited vectors. Manufacture closing excludes first-released FG, whose manufacturing vector remains in B_j_c^Q even when held. FG services retain original-dispatch reversals and actual repair additions/removals against original Q; combined gates cancel internal release transfers. Consumption-equivalent accounting and stock correction may not both consume the same stock."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: v_pack
    applies_to: "every packaging article"
    rule: "All five physical movement directions and each opening/closing empty attached reusable stock reconcile by b_pack. Gross physical shipments control accompanying packages; internal reuse is not new purchase, tube Q or credit."
    source_ids:
      - schott-duran-tubing
      - jrc-ilcd-2010
  - rule_id: v_allocation
    applies_to: "method and source traceability"
    rule: "Each cited source resolves to its full source record, keeps actual scope/countercontext and supports the stated rule. ILCD allocation remains limited to the declared attributional case and full hierarchy; engineering checks do not establish scientific approval, translation review, mapping or publication."
    source_ids:
      - jrc-ilcd-2010
      - jrc-glass-bref-2013
      - schott-hot-forming
      - schott-duran-tubing
      - unsd-cpc3-2025
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Upstream unworked tube manufacturing input only when actual grade route stock state and boundary match"
  allowed_use: "Declared narrow boric-acid batch electric-melting Danner-drawing manufacture at first release, with separate observed original-cohort service account"
  excluded_use: "Exclude waste-glass sorting/cleaning without remelting, purchased finished tube repacking, a purchased premelt/redraw-only start, primary quartz/fused-silica tubes, soda-lime tubes, optical blanks, rods/balls/microspheres, float/cast/rolled/drawn sheets, glass fibre, deliberate coloured/lead/fluoride-containing formulations, Vello/down/up-draw routes, normal fossil-fired melting with electric boost, and subsequent end forming, fire-polishing, grinding, drilling, coating, tempering, lamination, ampoule/vial or laboratory-article manufacture. A real different batch ingredient, fuel, package or auxiliary requires an additional specific atomic exchange and reassessment of applicability, never omission or a zero/other bundle."
  required_metadata: "All section3 qualifiers plus source/PCR identity boundary inventory coverage actual supply/used-state compatibility provider selection allocation and update date"
  required_quality_disclosure: "Raw record and speciation coverage; open unknowns; ordinary unresolved auxiliary UUIDs; manufacturing versus service boundary; installed stock/history and packaging closure; source countercontext and actual allocation evidence"
  update_trigger: "Composition supply state furnace or drawing route change; material utility/emission-control or package change; actual first-release specification change; boundary/stocks/returns/allocation or representative period change"
