          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_identity | reference and route | Declare every Required qualifier and satisfy the complete narrow route and native reference restrictions; waste sorting, quartz, sheet routes and downstream formed articles cannot resolve as this output. | unsd-cpc3-2025; jrc-glass-bref-2013; schott-hot-forming; schott-duran-tubing |\n| v_q | first release and FG | The selected Product output row is finished with 1 kg net bare first-release tube. Q deduplicates release events and retains failures/zero output; FG, gross dispatch, returns and repair increments obey b_release/b_service and never create another Q. | jrc-glass-bref-2013; schott-duran-tubing |\n| v_once | every numerator | Undivided raw records convert states/units/rates and allocate before normalize_once; every card and aggregation reads the same one stored result. Q=0 retains actual loads without a unit value; a failed query or unknown relation cannot become no-hit or pass. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| v_mass_species | full physical and chemical gates | Reconcile independent total mass and each relevant element; distinguish supplied chemical from oxide equivalent and free/reaction/phase/structural water. Retain every actual species/destination and unknown remainder. NOx/COD/VOC/total B are indicators, not arbitrary molecular masses. | jrc-glass-bref-2013 |\n| v_stock | WIP and non-WIP stocks | Opening/closing raw glass/melt WIP FG and installed/spare electrode/refractory/fluid/water/air or other actual charge records preserve independent physical stocks and exchange-specific inherited vectors. Manufacture closing excludes first-released FG, whose manufacturing vector remains in B_j_c^Q even when held. FG services retain original-dispatch reversals and actual repair additions/removals against original Q; combined gates cancel internal release transfers. Consumption-equivalent accounting and stock correction may not both consume the same stock. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| v_pack | every packaging article | All five physical movement directions and each opening/closing empty attached reusable stock reconcile by b_pack. Gross physical shipments control accompanying packages; internal reuse is not new purchase, tube Q or credit. | schott-duran-tubing; jrc-ilcd-2010 |\n| v_allocation | method and source traceability | Each cited source resolves to its full source record, keeps actual scope/countercontext and supports the stated rule. ILCD allocation remains limited to the declared attributional case and full hierarchy; engineering checks do not establish scientific approval, translation review, mapping or publication. | jrc-ilcd-2010; jrc-glass-bref-2013; schott-hot-forming; schott-duran-tubing; unsd-cpc3-2025 |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
