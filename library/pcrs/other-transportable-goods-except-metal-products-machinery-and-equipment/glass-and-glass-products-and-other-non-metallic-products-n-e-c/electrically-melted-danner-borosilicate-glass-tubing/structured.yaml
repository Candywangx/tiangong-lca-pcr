  covered_products: "Clear unworked straight borosilicate glass tubing by the complete section1 route"
  excluded_products: "Exclude waste-glass sorting/cleaning without remelting, purchased finished tube repacking, a purchased premelt/redraw-only start, primary quartz/fused-silica tubes, soda-lime tubes, optical blanks, rods/balls/microspheres, float/cast/rolled/drawn sheets, glass fibre, deliberate coloured/lead/fluoride-containing formulations, Vello/down/up-draw routes, normal fossil-fired melting with electric boost, and subsequent end forming, fire-polishing, grinding, drilling, coating, tempering, lamination, ampoule/vial or laboratory-article manufacture. A real different batch ingredient, fuel, package or auxiliary requires an additional specific atomic exchange and reassessment of applicability, never omission or a zero/other bundle."
  representative_product: "Bare cooled annealed unworked stock-length tube with measured net mass at unique first quality release"
  production_route: "Whole chemicals → batch → resistive tank melting refining conditioning → Danner bore-air draw → anneal cool cut inspect → first release → separate actual services"
  market_state: "Unworked straight annealed glass tube as intermediate stock; not finished laboratory/pharma article and not recovered sorted cullet"
