    reference: "UN Statistics Division, CPC Version3.0 Explanatory Notes, 30June2025, PDF p180 and adjacent37112–37115 entries; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope and tube/sheet/scrap distinctions only; no manufacturing or LCA allocation authority."
  - id: "jrc-glass-bref-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Manufacture of Glass, EUR25786EN,2013, DOI10.2791/69502; sections2.1,2.3.4–2.3.5,2.8,3.7 and4.2; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/GLS_Adopted_03_2012_0.pdf"
    used_for: "Complete raw-material/electric-melting/Danner route and utility/emission/residue context; historical Tables2.8/3.34 are countercontext only, not transferred numerical recipe energy emission or allocation rules."
  - id: "schott-hot-forming"
    type: "extension_guidance"
    reference: "SCHOTT, Glass Melting and Hot Forming, complete publisher HTML snapshot accessed2026-10-20, Glass Manufacture and Tube drawing sections with adjacent down/up-draw rolled and microfloat alternatives; https://www.schott.com/en-sg/expertise/glass-melting-and-hot-forming"
    used_for: "Manufacturer corroboration of batch melting refining conditioning Danner mandrel-air drawing and annealing; route synthesis only, not a common factory recipe or fuel inventory."
  - id: "schott-duran-tubing"
    type: "handbook"
    reference: "SCHOTT, DURAN Tubing rods and capillaries made of borosilicate glass3.3, retained publisher brochure accessed2026-10-20, PDF spreads4,5,8 (printed6–9 and14–15); https://www.schott.com/-/media/project/onex/products/d/duran-glass-tubing/downloads/datasheet/schott_duran_brochure_gb_final.pdf?rev=728c283d657c45f49f9d2464097f2b89"
    used_for: "Real unworked tube quality/traceability and carton/foil/wood packing variants; dimension compatibility and downstream strength test limitations. No density dimensions performance reannealing cycle or certification transferred; same publisher as schott-hot-forming."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, sections7.9.2–7.9.3, PDFpp275–286 including printed255,257–258,264,266 and full context; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Only declared attributional allocation-required cases: dedicated/virtual subdivision, exchange-specific determining physical causality, genuinely residual same-condition common-gate market values; no free allocation/substitution choice or waste credit."
  - id: "us-borax-optibor-2026"
