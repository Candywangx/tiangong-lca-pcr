  semantic_boundary_review:
    decision: new_narrow_candidate
    rationale: 1247-material checked33 scope and specific frozen neighbours contain no compatible resistive electric
      boric-acid-batch Danner unworked glass tube method. Existing float-sheet record requires tin-bath forming
      and sheet endpoint; fibre/glazing/machine/plastic routes are incompatible. New identity is justified by batch
      chemical transformation, independent water/boron/element and installed-service history, Danner bore air, annealing
      and tube first release, not by the classification leaf.
  ordinary_data_gaps:
  - Actual factory formulation supplier/native compatibility dimensional and chemical acceptance measurements and
    all quantities, including true emissions/speciation and period/campaign stock vectors, remain mandatory foreground
    records; no numerical defaults or claimed actual plant pass.
  - Auxiliary UUIDs remain unresolved after actual queries where native identity/form/state/media/type/route is
    incompatible or not yet directly supported. Preserve specific atomic exchanges and actual added flows rather
    than using collection labels, cutoffs or fabricated equivalences.
  - Reference native high-temperature-conductivity and chemical-plant labels remain qualified compatibility requirements;
    they do not independently establish furnace technology, current supplier, DURAN grade or scientific approval.
  first_release_accounting: Manufacturing B_j_c^Q includes all first-released tube including closing FG.
    Manufacturing closing vectors contain only unreleased raw/WIP/melt and unassigned installed/spare service.
    Preserve original-dispatch returns and each real service material/water addition or glass/moisture removal
    against original Q. Physical gross movement and allocated burden/service vectors remain separate.
    Combined gates cancel internal first-release Q and B_j_c^Q, never first-released manufacturing burdens.
    Already performed original-cohort service remains in its reported A_j_c even when serviced tube stays
    in closing FG; stock correction applies only to unconsumed or unassigned service/charge inventories.
