    - protocol_id: cp_service
      process_id: "services"
      flow_role: "FG custody and incremental service"
      record_type: "original cohort delivery and service records"
      raw_fields: "cohort_id; original_release_id; original_delivery_id; opening_FG; closing_FG; gross_shipment; external_return; reversal; rework_additions; removals; binder_change; moisture_change; service_raw; inherited_vector; actual unauthorized/failed work and all added/removed material/water/energy/loss/waste; real permission/posttests/disposition; original cohort Q_c (sole divisor) and observed horizon h (recorded separately and not an additional divisor); gross V versus each burden vector"
      collection_method: "Trace each original release/delivery and complete production/service history; measure real incremental handling/rework and material change. Delivery does not imply production. Undivided physical/service A_i_c and original production vector carried once. Aggregation reads normalize_once per reference flow of original cohort, not unrelated current Q. Permission/specification/postwork tests and acceptance govern authorization, continued qualification and disposition only; retain all actual unauthorized/unapproved/failed/rejected work material, water, energy, emission, loss, waste and treatment burdens. Real postwork records require maker/specification permission, original article/cohort custody, onsite or external provider, actual added/removed materials/water and posttests/acceptance/disposition; never assume wet, damaged or debonded mat is restored. For each actual physical gross leg, A_i_c in its gross-disclosure dimension means complete measured native-unit V_gross before dividing once by the manufacturing cohort Q_c or the original service cohort Q_c as applicable; record observed horizon h separately and not as an additional divisor. This includes FG/packages/new-old assets/parts/fluids/waste/real carrier water/external condensate or heat-exchange-water Product returns and gaseous ingress/egress. Keep inherited, stock-corrected consumption, economic and performed-service burden vectors separate, without second stock correction, purchase, provider burden or credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions with one supply owner; no invented boiler/steam or item-to-kg assumption. Already performed service remains assigned to original Q_c and actual observed h even for retained/held FG; carry only unused/unassigned service stores or charges. Actual wet return R is not original-delivery reversal D_rev. This first-release method does not automatically reverse deliveries or switch to net-delivery normalization; a separate net-delivery method requires the complete original-delivery/state/history-vector bridge."
      unit: "kg or kWh with original units retained"
      frequency: "each event and closing"
      temporal_coverage: "first release through declared observed service closing"
      site_scope: "actual FG nodes and original cohort operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Release/delivery linkage; return/reversal; readings; history reconciliation"
    - protocol_id: cp_pack
      process_id: "services"
      flow_role: "one component and one direction"
      record_type: "component weighing custody and moisture"
      raw_fields: "component; direction; owner; cohort_id; opening_empty; opening_WIP; opening_FG; opening_reusable; new_purchase; inbound_contained; external_return_in; closing_empty; closing_WIP; closing_FG; closing_reusable; gross_shipped; external_return_out; waste; moisture; repair_new; repair_old; inherited_vector; Radd/L_in/H_abs/X_in/Rremove/L_out/V_release/X_out same-side OTHER-flow overlap; ordinary moisture phases; matched article/component handoff; single mixed outlet raw-origin W versus nonadditive total; N_ext; entry_class; item_id; prior_outward_event_id; owner_custody_chain; native_unit; provider; phase; state; gate; period; complete_V; attributable_A; original_burden_history"
      collection_method: "Weigh each actual whole component per direction/disjoint state; identify material/formulation, dry solids/water and actual count-mass calibration/repairs. Reconcile b_packages before load allocation. Store undivided gross movement separately from attributable A_i_c; aggregation reads normalize_once stored per reference flow result only, no reused-package purchase or Q. For each actual component close the complete wet ledger O+P+I+N_ext+ER+Radd+L_in+H_abs-X_in=C+S+EO+W+Rremove+L_out+V_release-X_out: P purchased, I non-purchased supplier-contained ingress, N_ext first independent external non-purchase receipt, ER proven same-item external return in, S gross shipment, EO external return out, W real waste, O/C disjoint empty/attached-WIP/attached-FG/reusable stocks. X only deduplicates identical material in another same-side OTHER actual flow term, never stocks/opposite flows/mere card existence; real retained new material/water and complete wet C both remain. Whole wet articles include integral components/water once; separate onsite components must be disjoint or use matched component-out/article-in bridges cancelling internal handoffs, never whole tare plus the same constituents. One actual mixed outlet has one qualified Waste exchange and one actual treatment/provider, with independent raw-origin W subaccounts summing to the total, using total OR partitions nonadditively, not fake outlets for six-leg presentation. Ordinary storage/handling uptake/desorption/evaporation/drainage need no repair event; independently record real repair wood, added liquid water, atmospheric H2O, removed old material, liquid effluent and vapour. Permission/specification/postwork tests and acceptance govern authorization, continued qualification and disposition only; retain all actual unauthorized/unapproved/failed/rejected work material, water, energy, emission, loss, waste and treatment burdens. Real postwork records require maker/specification permission, original article/cohort custody, onsite or external provider, actual added/removed materials/water and posttests/acceptance/disposition; never assume wet, damaged or debonded mat is restored. For each actual physical gross leg, A_i_c in its gross-disclosure dimension means complete measured native-unit V_gross before dividing once by the manufacturing cohort Q_c or the original service cohort Q_c as applicable; record observed horizon h separately and not as an additional divisor. This includes FG/packages/new-old assets/parts/fluids/waste/real carrier water/external condensate or heat-exchange-water Product returns and gaseous ingress/egress. Keep inherited, stock-corrected consumption, economic and performed-service burden vectors separate, without second stock correction, purchase, provider burden or credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions with one supply owner; no invented boiler/steam or item-to-kg assumption. For each component and receipt event, classify exactly once as P, I, N_ext or ER, separate from opening stock and internal reuse. P is purchased packaging, including paid bundled packaging without a separate invoice; never also count that item in I. I is only non-purchased packaging physically received with supplied material whose manufacture is already included once in the whole supplied-material provider; retain its physical ingress without a second manufacturing charge. N_ext is first independent external non-purchase receipt, including borrowing, rental or entrusted supply, not ER or free internal reuse. ER requires evidence that this same item previously crossed outward from this system: link its original outward event, item identity, owner/custody chain and cohort. Record complete undivided physical V and attributable A histories separately, native unit, actual provider, phase/state/gate, period and original burden history for every entry. Unknown prior burdens remain unknown, never zero; assign manufacture/provider inclusion once and retain actual incremental service, transport, washing, repairs and losses on the original Q_c without invented life or credit."
      unit: "kg with count/moisture subaccounts"
      frequency: "each movement and closing"
      temporal_coverage: "all actual inbound/WIP/FG/return custody periods"
      site_scope: "each actual package custody node"
      aggregation_rule: "per reference flow"
      quality_evidence: "Tare/moisture; receipts; counts; repair proof; complete balances/vectors; mutually exclusive entry evidence; same-item prior outward/custody/cohort proof; whole-provider inclusion and original burden history"
  calculation_rules:
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q_c > 0 store result_i_c = A_i_c / Q_c exactly once. First convert original raw units/rates/state and genuinely attribute each exchange. Manufacturing A_i_c carries opening raw/WIP/utility/equipment histories plus attributable current use minus disjoint genuinely unused/unreleased closing histories and only justified once-only burden transfers to another real cohort/function; released FG is already Q, not WIP subtraction. Physical custody uses actual unallocated movement numerator in a separate view, never duplicated burden consumption. Services follow original cohorts with real incremental load and opening/closing service histories; original production carried once. Cancel internal counterparts. Q_c=0 retains loads and no unit value. Cards/aggregation only read the stored result. Manufacturing burden carries each exchange history only for still-unreleased raw/WIP and genuinely unused/unassigned non-WIP stores; manufacture of released FG already belongs to Q and is not deducted. Ordinary waste/samples/reject sales or exports do not automatically transfer burden or create credit: manufacture and actual treatment remain with the causal cohort. Only justified once-only allocation/handover to a genuine other function/cohort transfers burden. Already performed service remains assigned to original Q_c and actual observed h even for retained/held FG; carry only unused/unassigned service stores or charges. Actual wet return R is not original-delivery reversal D_rev. This first-release method does not automatically reverse deliveries or switch to net-delivery normalization; a separate net-delivery method requires the complete original-delivery/state/history-vector bridge. For each actual physical gross leg, A_i_c in its gross-disclosure dimension means complete measured native-unit V_gross before dividing once by the manufacturing cohort Q_c or the original service cohort Q_c as applicable; record observed horizon h separately and not as an additional divisor. This includes FG/packages/new-old assets/parts/fluids/waste/real carrier water/external condensate or heat-exchange-water Product returns and gaseous ingress/egress. Keep inherited, stock-corrected consumption, economic and performed-service burden vectors separate, without second stock correction, purchase, provider burden or credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions with one supply owner; no invented boiler/steam or item-to-kg assumption."
      inputs:
        - A_i_c
        - Q_c
        - cohort_id
        - original_delivery_id
      output: "result_i_c"
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-attributional-2010
    - id: raw_state_conversion
      applies_to: "all inventory rows"
      rule: "Before normalization convert original units using verified actual factors. Integrate only true flow/power rates; cumulative gas/liquid volume is not multiplied by time again. Match concentration and volume dry/wet/state basis; volume-to-mass needs independent measured substance/state density, never water density for LPG/oil or a secondary property factor as density. kWh to MJ factor3.6 applies once only where receiving unit requires."
      inputs:
        - original_reading
        - actual_state
        - independent_conversion
        - time_if_rate
      output: "converted_raw_quantity"
      source_ids:
        - gasco-csm
        - lipex-csm
    - id: stock_vector_closure
      applies_to: "all inventory rows"
      rule: "Before normalize_once close b_stocks/b_physical/b_packages on physical quantities and every historical exchange-vector component at manufacturing/service/consolidated gates. Internal roving/mat/trim/powder/package/water/air transfers cancel on identical state/cohort. Preserve non-WIP installed/charged stocks and real FG material/moisture changes; already corrected consumption is not corrected twice. For each actual component close the complete wet ledger O+P+I+N_ext+ER+Radd+L_in+H_abs-X_in=C+S+EO+W+Rremove+L_out+V_release-X_out: P purchased, I non-purchased supplier-contained ingress, N_ext first independent external non-purchase receipt, ER proven same-item external return in, S gross shipment, EO external return out, W real waste, O/C disjoint empty/attached-WIP/attached-FG/reusable stocks. X only deduplicates identical material in another same-side OTHER actual flow term, never stocks/opposite flows/mere card existence; real retained new material/water and complete wet C both remain. Whole wet articles include integral components/water once; separate onsite components must be disjoint or use matched component-out/article-in bridges cancelling internal handoffs, never whole tare plus the same constituents. One actual mixed outlet has one qualified Waste exchange and one actual treatment/provider, with independent raw-origin W subaccounts summing to the total, using total OR partitions nonadditively, not fake outlets for six-leg presentation. Ordinary storage/handling uptake/desorption/evaporation/drainage need no repair event; independently record real repair wood, added liquid water, atmospheric H2O, removed old material, liquid effluent and vapour. For each component and receipt event, classify exactly once as P, I, N_ext or ER, separate from opening stock and internal reuse. P is purchased packaging, including paid bundled packaging without a separate invoice; never also count that item in I. I is only non-purchased packaging physically received with supplied material whose manufacture is already included once in the whole supplied-material provider; retain its physical ingress without a second manufacturing charge. N_ext is first independent external non-purchase receipt, including borrowing, rental or entrusted supply, not ER or free internal reuse. ER requires evidence that this same item previously crossed outward from this system: link its original outward event, item identity, owner/custody chain and cohort. Record complete undivided physical V and attributable A histories separately, native unit, actual provider, phase/state/gate, period and original burden history for every entry. Unknown prior burdens remain unknown, never zero; assign manufacture/provider inclusion once and retain actual incremental service, transport, washing, repairs and losses on the original Q_c without invented life or credit."
      inputs:
        - opening_stock
        - current_input
        - actual_output
        - closing_stock
        - inherited_exchange_vector
      output: "reconciled_raw_numerator"
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Prove actual product/supply/chemical/form/route compatibility and every adopted restriction. Unbound mat/roving remain pending exact matching; a successful query is not provider compatibility."
      evidence: "Supplier primary specs; complete native records; exact support chain"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Actual site quantities/densities/assays/quality/energy/yield/emissions/allocation drivers need evidence and uncertainty. Missing values remain missing, never invented zero."
      evidence: "Calibrated raw records; assays; same-control-volume balances; uncertainty"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Retain every failed/nonproductive run, real atomic flow/destination, WIP/FG/charged-equipment vector and all package custody. Unknown actual mass/species/terminal/method relation stays incomplete, never pass. Verify component-wise P/I/N_ext/ER exclusivity, paid-bundle purchase treatment, whole-provider manufacture once, and ER same-item prior outward/owner/custody/cohort evidence. Missing entry or prior burden history remains incomplete, never a balancing residual, free reuse or zero burden."
      evidence: "Full logs; independent species/element evidence; custody/vector closure"
    - id: dq_sources
      applies_to: "system"
      requirement: "JRC gives roving-to-powder-mat mechanism and adjacent tissue/continuous-mat counterexamples; Gasco independently lists complete forming/oven/cooling/trim/winding/exhaust systems; Lipex establishes LPG thermal utility; Jushi documents a real powder-bonded E6 mat-roll terminal. This is transparent technical synthesis, not one common SKU/recipe/factory/current order. E6 chemistry is supplier-specific. Jushi sizing-content expression is ambiguous; its nominal115-yard/4140-inch/approximately105-metre lengths are compatible after unit conversion but cannot establish actual roll mass or binder addition. LOI includes inherited size and retained binder. Lipex approximate consumption/capacity and compressed-air rate are case data, not totals or defaults. No composition, yield, temperature, strength, compatibility, life, moisture, binder fraction or utility/emission factor is prescribed from these sources. Industrial sources do not support LCA allocation; ILCD supports only the declared attributional hierarchy."
      evidence: "Complete primary context; independent route/terminal support; applicability/counterevidence review"
validation_rules:
  - rule_id: v_scope
    applies_to: "system"
    rule: "Verify all qualifiers, assembled-roving supply, random chopped nonwoven architecture, saturated thermoplastic powder/LPG route and true mat terminal. Unbound roving/yarn, tissue, wool, woven or composite cannot serve as reference; generic fibre is not terminal evidence."
    source_ids:
      - jrc-glass-bref-2013
      - jushi-p04-csm
      - gasco-csm
  - rule_id: v_q
    applies_to: "finished_mat"
    rule: "Reconcile calibrated net roll-minus-tare, unique first release and quality tests with Q. FG closing, delivery/reinspection/return creates no new Q; preserve failures and Q=0 loads."
    source_ids:
      - jushi-p04-csm
      - jrc-glass-bref-2013
  - rule_id: v_balance
    applies_to: "all inventory rows"
    rule: "Close every physical species/phase/relevant element, WIP/FG/utility/asset quantity and historical exchange vector across manufacturing/service/consolidated gates. All real residues, water/air destinations, package directions and repair old/new parts remain. Missing measurements/species or unresolved balance is incomplete, not a forced pass. Verify component-wise P/I/N_ext/ER exclusivity, paid-bundle purchase treatment, whole-provider manufacture once, and ER same-item prior outward/owner/custody/cohort evidence. Missing entry or prior burden history remains incomplete, never a balancing residual, free reuse or zero burden."
    source_ids:
      - jrc-glass-bref-2013
      - gasco-csm
      - jushi-p04-csm
  - rule_id: v_normalize
    applies_to: "all inventory rows"
    rule: "Raw protocols collect undivided values. Unit/rate/state conversion, genuine attribution/allocation and stock/vector handling precede the sole A/Q operation in normalize_once; cards and aggregation reference its stored result without another division. Preserve original-cohort service basis and cancel internal Q."
    source_ids:
      - ilcd-attributional-2010
      - jrc-glass-bref-2013
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Inspect all native basenames/synonyms/comments/CAS, fixed grade/route/form/geography/media/type and ALL properties before final data use. Follow exact referenced property version to exact unit-group version/reference unit, not latest or secondary-factor density. Item(s)/item is count-equivalent only; count-to-kg needs actual configuration-specific net/tare mass, no guessed kg/item. Keep per-card restrictions and all unbound atomic rows visible."
    source_ids:
      - jrc-glass-bref-2013
  - rule_id: v_sources
    applies_to: "system"
    rule: "Distinguish qualitative synthesis and limitations from real site quantities. Do not transfer nominal specifications, nominal catalogue columns, LOI, approximate utilities or BREF composition as default inputs/emissions. State performed/skipped/unknown coverage. Engineering checks are no scientific/translation/mapping/publication approval."
    source_ids:
      - jrc-glass-bref-2013
      - jushi-p04-csm
      - lipex-csm
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "background_dataset for the compatible declared mat as input to separately modelled composite manufacture"
  allowed_use: "Attributional upstream-plus-complete-foreground manufacture to unique first release; separate actually observed original-cohort services"
  excluded_use: "Exclude foreground glass melting/drawing (link upstream roving), unbonded sliver/roving/yarn/chopped strands sold as such, direct continuous-filament mat, wet-laid tissue/veil, woven/knitted/stitched reinforcement, glass-wool insulation/rigid board, emulsion mat, reactive thermoset binder, resin-impregnated composite parts and downstream moulding/use/end of life. Real onsite primary sizing or binder compounding changes scope and requires each purchased ingredient and real energy/loss; do not replace a whole purchased formulation with assay constituents."
  required_metadata: "assembled roving supply form; E-glass composition and supplier grade; inherited sizing composition and moisture; roving tex and chop length; random nonwoven architecture; saturated thermoplastic polyester powder formulation; added versus inherited binder accounting; LPG oven and exhaust configuration; actual cooling and water state; mat areal mass and width; retained binder and moisture basis; integrity and quality acceptance; first-release event and cohort; net roll-minus-tare method; electricity voltage and geography; site and collection period; original-cohort service closing date"
  required_quality_disclosure: "Missing identities/quantities; scientific review pending; synthesis/age/source limits; measured/skipped coverage; physical/vector closures; actual allocation/service boundaries"
  update_trigger: "Changed glass/sizing/roving form, powder chemistry, oven/utility, terminal, quality, gate, provider or material evidence"
