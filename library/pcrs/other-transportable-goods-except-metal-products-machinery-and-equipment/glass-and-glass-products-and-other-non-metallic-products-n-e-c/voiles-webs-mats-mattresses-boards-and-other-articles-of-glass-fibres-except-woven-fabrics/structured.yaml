      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `a_context` | system | Only attributional cases where the study goal justifies allocation rather than substitution. First independently assign dedicated operations and exclusive inputs/services, then actual/virtual subdivision isolates quantities causally belonging to each output. Industrial manufacturing sources supply no allocation method. | `ilcd-attributional-2010` |\n| `a_causality` | all inventory rows | For a genuinely shared remainder identify exchange-specific determining physical causality from evidence: metered line/oven demand, thermal load, equipment load/time or storage space-time as appropriate. Mass/area correlations alone are insufficient. Different exchanges may need different causes; no free physical/economic choice or blanket saleable-mass share. | `ilcd-attributional-2010` |\n| `a_residual` | common process | Only irreducible genuine multifunctional-process remainder lacking a defensible determining physical cause may use contemporaneous market value at the same process exit and actual condition/quality. Remove later specific transport/conditioning/packing to derive that value. Sum all allocated vectors to the unallocated inventory. Internal trim/powder/package reuse/rejected mat gives no automatic co-product, zero burden or avoided-production credit. External recovery needs actual legal/economic state and a separately justified consistent convention. | `ilcd-attributional-2010` |\n\n"
