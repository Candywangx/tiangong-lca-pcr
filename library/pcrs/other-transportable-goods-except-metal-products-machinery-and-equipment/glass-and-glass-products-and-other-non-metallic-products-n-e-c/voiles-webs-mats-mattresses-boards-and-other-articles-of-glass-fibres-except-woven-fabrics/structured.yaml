      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `v_scope` | system | Verify all qualifiers, assembled-roving supply, random chopped nonwoven architecture, saturated thermoplastic powder/LPG route and true mat terminal. Unbound roving/yarn, tissue, wool, woven or composite cannot serve as reference; generic fibre is not terminal evidence. | `jrc-glass-bref-2013`; `jushi-p04-csm`; `gasco-csm` |\n| `v_q` | finished_mat | Reconcile calibrated net roll-minus-tare, unique first release and quality tests with Q. FG closing, delivery/reinspection/return creates no new Q; preserve failures and Q=0 loads. | `jushi-p04-csm`; `jrc-glass-bref-2013` |\n| `v_balance` | all inventory rows | Close every physical species/phase/relevant element, WIP/FG/utility/asset quantity and historical exchange vector across manufacturing/service/consolidated gates. All real residues, water/air destinations, package directions and repair old/new parts remain. Missing measurements/species or unresolved balance is incomplete, not a forced pass. Verify component-wise P/I/N_ext/ER exclusivity, paid-bundle purchase treatment, whole-provider manufacture once, and ER same-item prior outward/owner/custody/cohort evidence. Missing entry or prior burden history remains incomplete, never a balancing residual, free reuse or zero burden. | `jrc-glass-bref-2013`; `gasco-csm`; `jushi-p04-csm` |\n| `v_normalize` | all inventory rows | Raw protocols collect undivided values. Unit/rate/state conversion, genuine attribution/allocation and stock/vector handling precede the sole A/Q operation in normalize_once; cards and aggregation reference its stored result without another division. Preserve original-cohort service basis and cancel internal Q. | `ilcd-attributional-2010`; `jrc-glass-bref-2013` |\n| `v_identity` | all inventory rows | Inspect all native basenames/synonyms/comments/CAS, fixed grade/route/form/geography/media/type and ALL properties before final data use. Follow exact referenced property version to exact unit-group version/reference unit, not latest or secondary-factor density. Item(s)/item is count-equivalent only; count-to-kg needs actual configuration-specific net/tare mass, no guessed kg/item. Keep per-card restrictions and all unbound atomic rows visible. | `jrc-glass-bref-2013` |\n| `v_sources` | system | Distinguish qualitative synthesis and limitations from real site quantities. Do not transfer nominal specifications, nominal catalogue columns, LOI, approximate utilities or BREF composition as default inputs/emissions. State performed/skipped/unknown coverage. Engineering checks are no scientific/translation/mapping/publication approval. | `jrc-glass-bref-2013`; `jushi-p04-csm`; `lipex-csm`; `ilcd-attributional-2010` |\n\n"
