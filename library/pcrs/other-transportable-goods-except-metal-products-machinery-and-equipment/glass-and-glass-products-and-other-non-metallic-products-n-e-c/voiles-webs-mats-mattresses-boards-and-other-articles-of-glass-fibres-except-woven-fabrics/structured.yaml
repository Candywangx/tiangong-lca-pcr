system_boundary:
  rules:
    - rule_id: b_start
      applies_to: "system"
      rule: "Start with whole supplied roving and powder in stated states. Link compatible upstream melting/drawing/sizing/assembly/drying, powder synthesis, energy/water/packages/auxiliaries/transport/treatment. Do not omit inherited burdens or fabricate upstream processes onsite. A purchased finished mat does not establish this manufacturing route."
      source_ids:
        - jrc-glass-bref-2013
        - gasco-csm
    - rule_id: b_operations
      applies_to: "manufacture; utilities"
      rule: "Include every actual failed/zero-output batch, start/stop, warm-up, idle, purge, cleanup, trim/powder recovery, rework, test loss and abatement. Every real unlisted atomic input/output is added before data completion, never hidden as zero/other or cut off for missing UUID. Whole formulations enter once; assay/carried water are subaccounts. Captured glass/binder, actual sludge, cleaners, filters, refrigerants and each emitted species require separate specific cards when present. Permission/specification/postwork tests and acceptance govern authorization, continued qualification and disposition only; retain all actual unauthorized/unapproved/failed/rejected work material, water, energy, emission, loss, waste and treatment burdens. Real postwork records require maker/specification permission, original article/cohort custody, onsite or external provider, actual added/removed materials/water and posttests/acceptance/disposition; never assume wet, damaged or debonded mat is restored."
      source_ids:
        - jrc-glass-bref-2013
        - gasco-csm
        - lipex-csm
    - rule_id: b_q
      applies_to: "finished_mat"
      rule: "Q is calibrated net mat mass uniquely first quality released for the declared cohort/period. Weigh accepted rolls less independently measured core/package tare at matched moisture/configuration, retaining glass/size/binder/residual water. Width/area/areal-mass are independent checks, not catalogue roll-to-kg defaults. Closing first-released FG already belongs to Q, not a second production output. Q=0 preserves loads without a unit result."
      source_ids:
        - jrc-glass-bref-2013
        - jushi-p04-csm
    - rule_id: b_stocks
      applies_to: "all inventory rows"
      rule: "Opening/closing raw material, WIP, internal trim/powder and FG preserve physical composition/moisture and one historical vector component per exchange. Transfer vectors with actual cohort lineage. Non-WIP equipment oil/coolant/installed consumables and reusable assets also retain physical quantity and each exchange history. Do not correct already stock-corrected consumption again. Pair and cancel internal quantity/vector counterparts at consolidated gates. Manufacturing burden carries each exchange history only for still-unreleased raw/WIP and genuinely unused/unassigned non-WIP stores; manufacture of released FG already belongs to Q and is not deducted. Ordinary waste/samples/reject sales or exports do not automatically transfer burden or create credit: manufacture and actual treatment remain with the causal cohort. Only justified once-only allocation/handover to a genuine other function/cohort transfers burden. Separate actual physical equipment purchases/installed parts/fluids from fulfilled capital-service vectors. Preserve configured native count or measured mass/fluid quantity plus physical opening/closing and every exchange history, assigning by actual observed use/causal service; carry only unused/unassigned charge/service. Never consume a whole machine per kg or invent item kg/life/utilization. Parts/fluids/burdens already included in complete equipment/service supply are not repurchased; add each actual new asset/part/fluid atom and raw evidence before data completion."
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-attributional-2010
    - rule_id: b_services
      applies_to: "services"
      rule: "First release is the sole production gate. Later packing/storage/handling/dispatch/returns keep separate physical and service ledgers. Old FG/returned mats carry complete original production and prior service vectors and release/delivery ids. Retain original delivery linkage and any separately justified reversal evidence alongside actual rework additions/removals, binder/water changes and incremental burden on that cohort. Delivery/reinspection is no new Q. Do not transfer old burdens to unrelated current Q or silently switch to net delivery. Cancel internal first-release Q in the combined system. Permission/specification/postwork tests and acceptance govern authorization, continued qualification and disposition only; retain all actual unauthorized/unapproved/failed/rejected work material, water, energy, emission, loss, waste and treatment burdens. Real postwork records require maker/specification permission, original article/cohort custody, onsite or external provider, actual added/removed materials/water and posttests/acceptance/disposition; never assume wet, damaged or debonded mat is restored. Already performed service remains assigned to original Q_c and actual observed h even for retained/held FG; carry only unused/unassigned service stores or charges. Actual wet return R is not original-delivery reversal D_rev. This first-release method does not automatically reverse deliveries or switch to net-delivery normalization; a separate net-delivery method requires the complete original-delivery/state/history-vector bridge."
      source_ids:
        - jushi-p04-csm
        - ilcd-attributional-2010
    - rule_id: b_physical
      applies_to: "all inventory rows"
      rule: "Independently close gross physical mass and relevant glass/organic/C/H/O/N/S elements, separately from burden allocation and species evidence. For each species/phase: opening + external ingress = closing + external egress + independently evidenced signed chemical conversion; internal transfers cancel. Separate free/carrier/retained/ambient/condensed/reaction water. Thermoplastic binder melting is not condensation polymerisation. One residual cannot determine two unknowns. LOI, VOC, COD, elemental carbon or total boron is not a specific chemical mass. Preserve all actual liquid/gas outlets and remaining oxygen; no assumed air fractions or reaction yield."
      source_ids:
        - jrc-glass-bref-2013
        - gasco-csm
        - lipex-csm
    - rule_id: b_packages
      applies_to: "services"
      rule: "For EACH component: opening empty + opening WIP-attached + opening FG-attached + opening reusable + purchase + non-purchased supplier-contained physical ingress + first independent external non-purchase receipt + proven same-item external return received = closing empty + closing WIP-attached + closing FG-attached + closing reusable + component leaving with gross physical shipment + separate external return + waste, with independently measured dry-solid/water changes and actual repair inputs/old removals. States are mutually exclusive. Internal reuse cancels: not repurchase, mat Q or automatic co-product. Charge supplier-contained burden once while retaining custody. Wood/cork, moisture flux and repairs require actual identification, never presumed occurrence. For each actual component close the complete wet ledger O+P+I+N_ext+ER+Radd+L_in+H_abs-X_in=C+S+EO+W+Rremove+L_out+V_release-X_out: P purchased, I non-purchased supplier-contained ingress, N_ext first independent external non-purchase receipt, ER proven same-item external return in, S gross shipment, EO external return out, W real waste, O/C disjoint empty/attached-WIP/attached-FG/reusable stocks. X only deduplicates identical material in another same-side OTHER actual flow term, never stocks/opposite flows/mere card existence; real retained new material/water and complete wet C both remain. Whole wet articles include integral components/water once; separate onsite components must be disjoint or use matched component-out/article-in bridges cancelling internal handoffs, never whole tare plus the same constituents. One actual mixed outlet has one qualified Waste exchange and one actual treatment/provider, with independent raw-origin W subaccounts summing to the total, using total OR partitions nonadditively, not fake outlets for six-leg presentation. Ordinary storage/handling uptake/desorption/evaporation/drainage need no repair event; independently record real repair wood, added liquid water, atmospheric H2O, removed old material, liquid effluent and vapour. For each component and receipt event, classify exactly once as P, I, N_ext or ER, separate from opening stock and internal reuse. P is purchased packaging, including paid bundled packaging without a separate invoice; never also count that item in I. I is only non-purchased packaging physically received with supplied material whose manufacture is already included once in the whole supplied-material provider; retain its physical ingress without a second manufacturing charge. N_ext is first independent external non-purchase receipt, including borrowing, rental or entrusted supply, not ER or free internal reuse. ER requires evidence that this same item previously crossed outward from this system: link its original outward event, item identity, owner/custody chain and cohort. Record complete undivided physical V and attributable A histories separately, native unit, actual provider, phase/state/gate, period and original burden history for every entry. Unknown prior burdens remain unknown, never zero; assign manufacture/provider inclusion once and retain actual incremental service, transport, washing, repairs and losses on the original Q_c without invented life or credit."
      source_ids:
        - jushi-p04-csm
        - ilcd-attributional-2010
    - rule_id: b_water_energy
      applies_to: "utilities"
      rule: "Keep actual cooling topology, non-WIP fluid charge, makeup/purge/evaporation/drift and external Product water/condensate returns, inlet/outlet composition/thermal state/enthalpy and supplier water-energy convention. No duplicate recirculation or corrected consumption, invented boiler/steam or automatic heat credit. Actual coolant/cleaner/abatement reagent/filter/refrigerant each requires a specific atomic card. For each actual physical gross leg, A_i_c in its gross-disclosure dimension means complete measured native-unit V_gross before dividing once by the manufacturing cohort Q_c or the original service cohort Q_c as applicable; record observed horizon h separately and not as an additional divisor. This includes FG/packages/new-old assets/parts/fluids/waste/real carrier water/external condensate or heat-exchange-water Product returns and gaseous ingress/egress. Keep inherited, stock-corrected consumption, economic and performed-service burden vectors separate, without second stock correction, purchase, provider burden or credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions with one supply owner; no invented boiler/steam or item-to-kg assumption."
      source_ids:
        - gasco-csm
        - lipex-csm
