allocation_rules:
  - rule_id: a_context
    applies_to: "system"
    rule: "Only attributional cases where the study goal justifies allocation rather than substitution. First independently assign dedicated operations and exclusive inputs/services, then actual/virtual subdivision isolates quantities causally belonging to each output. Industrial manufacturing sources supply no allocation method."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "all inventory rows"
    rule: "For a genuinely shared remainder identify exchange-specific determining physical causality from evidence: metered line/oven demand, thermal load, equipment load/time or storage space-time as appropriate. Mass/area correlations alone are insufficient. Different exchanges may need different causes; no free physical/economic choice or blanket saleable-mass share."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "common process"
    rule: "Only irreducible genuine multifunctional-process remainder lacking a defensible determining physical cause may use contemporaneous market value at the same process exit and actual condition/quality. Remove later specific transport/conditioning/packing to derive that value. Sum all allocated vectors to the unallocated inventory. Internal trim/powder/package reuse/rejected mat gives no automatic co-product, zero burden or avoided-production credit. External recovery needs actual legal/economic state and a separately justified consistent convention."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_mat"
      record_type: "calibrated net weighing and first release"
      raw_fields: "cohort_id; release_id; roll_mass_raw; core_tare_raw; package_tare_raw; moisture; width; length; areal_mass; tests; opening_FG; closing_FG"
      collection_method: "Calibrated roll and independent tare at matched moisture/configuration; retain first passing integrity/declared tests; check measured area/mass independently. Sum undivided unique first-release net kg to Q. Inventory aggregation reads normalize_once stored result per reference flow only."
      unit: "kg"
      frequency: "each roll/release"
      temporal_coverage: "entire campaign including failure; declared cohort closing"
      site_scope: "declared mat site/configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; tare; release ledger; quality reports"
    - protocol_id: cp_make_records
      process_id: "manufacture"
      flow_role: "atomic exchange and stock"
      record_type: "meters invoices assays and custody"
      raw_fields: "row_id; cohort_id; timestamp; original_amount; original_unit; factor; opening; closing; input_output; composition; moisture; inherited_vector; actual_state; independent_density; allocation_driver; evidence_ref; actual unauthorized/failed work and all added/removed material/water/energy/loss/waste; real permission/posttests/disposition; original cohort Q_c (sole divisor) and observed horizon h (recorded separately and not an additional divisor); gross V versus each burden vector"
      collection_method: "Original meters/invoices and weighed disjoint stocks/returns/wastes; independently assay whole formulations. Distinguish true rate from cumulative quantity and retain actual attribution driver. Collect undivided raw numerators/histories. Conversion and attribution produce A_i_c; aggregation references normalize_once stored result per reference flow without another division. Permission/specification/postwork tests and acceptance govern authorization, continued qualification and disposition only; retain all actual unauthorized/unapproved/failed/rejected work material, water, energy, emission, loss, waste and treatment burdens. Real postwork records require maker/specification permission, original article/cohort custody, onsite or external provider, actual added/removed materials/water and posttests/acceptance/disposition; never assume wet, damaged or debonded mat is restored. For each actual physical gross leg, A_i_c in its gross-disclosure dimension means complete measured native-unit V_gross before dividing once by the manufacturing cohort Q_c or the original service cohort Q_c as applicable; record observed horizon h separately and not as an additional divisor. This includes FG/packages/new-old assets/parts/fluids/waste/real carrier water/external condensate or heat-exchange-water Product returns and gaseous ingress/egress. Keep inherited, stock-corrected consumption, economic and performed-service burden vectors separate, without second stock correction, purchase, provider burden or credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions with one supply owner; no invented boiler/steam or item-to-kg assumption."
      unit: "row-native kg or kWh or t*km"
      frequency: "each event/meter interval/closing"
      temporal_coverage: "productive and all nonproductive periods; WIP carryover"
      site_scope: "each actual operation/utility control volume"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original readings; calibration; receipts; assay; paired stock/vector reconciliation"
    - protocol_id: cp_utility_records
      process_id: "utilities"
      flow_role: "atomic exchange and stock"
      record_type: "meters invoices assays and custody"
      raw_fields: "row_id; cohort_id; timestamp; original_amount; original_unit; factor; opening; closing; input_output; composition; moisture; inherited_vector; actual_state; independent_density; allocation_driver; evidence_ref; actual unauthorized/failed work and all added/removed material/water/energy/loss/waste; real permission/posttests/disposition; original cohort Q_c (sole divisor) and observed horizon h (recorded separately and not an additional divisor); gross V versus each burden vector"
      collection_method: "Original meters/invoices and weighed disjoint stocks/returns/wastes; independently assay whole formulations. Distinguish true rate from cumulative quantity and retain actual attribution driver. Collect undivided raw numerators/histories. Conversion and attribution produce A_i_c; aggregation references normalize_once stored result per reference flow without another division. Permission/specification/postwork tests and acceptance govern authorization, continued qualification and disposition only; retain all actual unauthorized/unapproved/failed/rejected work material, water, energy, emission, loss, waste and treatment burdens. Real postwork records require maker/specification permission, original article/cohort custody, onsite or external provider, actual added/removed materials/water and posttests/acceptance/disposition; never assume wet, damaged or debonded mat is restored. For each actual physical gross leg, A_i_c in its gross-disclosure dimension means complete measured native-unit V_gross before dividing once by the manufacturing cohort Q_c or the original service cohort Q_c as applicable; record observed horizon h separately and not as an additional divisor. This includes FG/packages/new-old assets/parts/fluids/waste/real carrier water/external condensate or heat-exchange-water Product returns and gaseous ingress/egress. Keep inherited, stock-corrected consumption, economic and performed-service burden vectors separate, without second stock correction, purchase, provider burden or credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions with one supply owner; no invented boiler/steam or item-to-kg assumption. Separate actual physical equipment purchases/installed parts/fluids from fulfilled capital-service vectors. Preserve configured native count or measured mass/fluid quantity plus physical opening/closing and every exchange history, assigning by actual observed use/causal service; carry only unused/unassigned charge/service. Never consume a whole machine per kg or invent item kg/life/utilization. Parts/fluids/burdens already included in complete equipment/service supply are not repurchased; add each actual new asset/part/fluid atom and raw evidence before data completion."
      unit: "row-native kg or kWh or t*km"
      frequency: "each event/meter interval/closing"
      temporal_coverage: "productive and all nonproductive periods; WIP carryover"
      site_scope: "each actual operation/utility control volume"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original readings; calibration; receipts; assay; paired stock/vector reconciliation"
