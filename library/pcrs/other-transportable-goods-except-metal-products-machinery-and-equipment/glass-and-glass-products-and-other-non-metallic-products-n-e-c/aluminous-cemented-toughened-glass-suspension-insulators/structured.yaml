allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory attribution"
    rule: "Use this rule only for an explicitly chosen attributional inventory where allocation is necessary. First isolate dedicated shell/assembly/test/services; then physical or virtual subdivision directly assigns recipe materials and fitted components to the actual configuration. Internal cullet and reused packaging are transfers rather than automatic coproducts or avoided-production credits."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "each remaining exchange"
    rule: "For each still shared exchange identify the determining physical causal relationship and justify evidence: actual batch energy/temperature duty, press/test cycle demand, air-cooling work, heat capacity, occupied storage volume/area and duration or limiting transported mass/volume and distance as appropriate. Different exchanges can require different determinants. A list of possible mass/area/time/price keys or one blanket factor is not a decision; failed/idle/cleanup burdens remain assigned to the responsible production/service cohort."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "genuine residual shared process burdens"
    rule: "Only after documented subdivision and exchange-specific causality are exhausted allocate the genuine residual by actual same-period market values of real coproducts at the same common process gate and actual condition/quality/moisture/bulk state. Remove additional packaging/transport/conditioning from downstream prices transparently. Do not invent fixed fractions, saleability, negative waste prices as a credit or substitution. Unavailable defensible residual prices/causality remain an uncertainty requiring review. Keep all unscaled physical package, product, waste and asset ledgers independent of this burden partition."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first_release"
      record_type: "release and calibrated weighing"
      raw_fields: "cohort_id; serial_or_lot; configuration; required_tests; first_release_time; gross_mass; actual_tare; net_assembled_mass; cement_hydration; free_moisture; rejected_count"
      collection_method: "Weigh complete accepted units excluding packaging using calibrated scales and real tare; link all tests and first release uniquely; repeat tests/shipments/returns retain the original identity."
      unit: "kg"
      frequency: "each release lot"
      temporal_coverage: "full campaign and opening/closing FG bridge"
      site_scope: "actual site and configuration"
      aggregation_rule: "Sum unique net assembled kg as Q; no unit inventory division here."
      quality_evidence: "calibration; tare slips; BOM; test and release record"
    - protocol_id: cp_mfg
      process_id: "manufacture"
      flow_role: "whole raw and assembly supplies"
      record_type: "stage-resolved raw material ledger"
      raw_fields: "exchange_id; stage; supplier; whole_formulation; raw_value; raw_unit; timestamp; opening_raw_WIP; closing_raw_WIP; receipts; use; return; spill; assay; moisture; inherited_vector; already_net_flag"
      collection_method: "Weigh and reconcile actual receipt/use/return/spill and WIP by stage and supplier; preserve whole formulations/components once. Separate nominal recipe, measured assay and reaction evidence. Retain raw unnormalised amounts and stock/history vectors; aggregation references the sole normalize_exchange result per reference flow."
      unit: "native kg or actual row unit"
      frequency: "each lot and transfer"
      temporal_coverage: "full period including all operating modes"
      site_scope: "receiving through complete-unit release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; weigh slips; batch sheets; BOM; SDS; assay; stock counts"
    - protocol_id: cp_utilities
      process_id: "manufacture"
      flow_role: "each electricity fuel water heat or carrier exchange"
      record_type: "raw meters and state observations"
      raw_fields: "exchange_id; duty; meter_start; meter_end; raw_rate; integration_interval; integrated_volume; unit; pressure; temperature; humidity; substance_density; gas_composition; LHV_HHV; supply_return_mass; supply_return_enthalpy; supplier_agreement; opening_closing_fluid; inherited_vector"
      collection_method: "Submeter all actual duties including nonproductive modes. Preserve measured electricity/gas/water units; integrate only true rates. Measure each substance state independently and reconcile heat-carrier supply/return with the provider contract. Keep raw totals; no A/Q here. Reference the single normalized result after raw conversion and attribution."
      unit: "MJ; m3; kg; kWh raw"
      frequency: "continuous meter and each batch or delivery"
      temporal_coverage: "full campaign including startup idle cleanup"
      site_scope: "actual utility/control-volume gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; lab gas/density; pressure-temperature records; heat contract"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each atmospheric resource and emitted species"
      record_type: "speciated gross inlet/outlet sampling"
      raw_fields: "exchange_id; chemical_identity; CAS; isotope; phase; source_origin; medium; location; wet_dry_basis; actual_flow_rate_or_integral; sampling_time; concentration; humidity; temperature; pressure; treatment_in_out; uncertainty; element_ledger"
      collection_method: "Sample representative actual air/water/solid locations and all operating modes; reconcile units, standard/reference state, moisture, actual exhaust flow and treatment. Measure species independently from total indicators and keep origins separately. Retain raw actual species mass and uncertainty; reference normalize_exchange once for unit result."
      unit: "kg"
      frequency: "continuous or justified mode-resolved sampling"
      temporal_coverage: "full campaign with failed intervals"
      site_scope: "same raw physical control volume"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "species analysis; flow calibration; moisture; receiving compartment; independent closure"
    - protocol_id: cp_residues
      process_id: "manufacture"
      flow_role: "each separate waste and destination"
      record_type: "waste removal and treatment record"
      raw_fields: "exchange_id; net_wet_mass; dry_solid; free_water; bound_water; composition; attached_material; destination; treatment; transfer_note; internal_return; inherited_vector"
      collection_method: "Weigh each real separate waste, retained attachments, moisture and receiving route. Distinguish internal cullet, whole rejected assembly and actually dismantled component exports; prevent duplicate constituents. Retain raw gross physical removals and separately attributed vector; reference the sole unit result."
      unit: "kg"
      frequency: "each removal and stock count"
      temporal_coverage: "full campaign and waste stocks"
      site_scope: "release of each waste to its actual receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh ticket; analysis; transfer/treatment document; stock reconciliation"
    - protocol_id: cp_assets
      process_id: "manufacture"
      flow_role: "each specific asset lining filter or fluid"
      record_type: "physical stock and service-history ledger"
      raw_fields: "asset_id; composition; condition; item_count; net_mass; opening_installed; closing_installed; additions; new_repair_parts; removed_old_parts; installed_fluid; moisture; realized_service; remaining_service_evidence; service_driver; upstream_vector; inherited_vector"
      collection_method: "Count/weigh actual installed equipment and repair parts, measure actual fluid states, then determine a separately justified service contribution using service history and remaining-capacity evidence. No assumed lifetime or count-to-mass coefficient. Keep physical assets unscaled; asset_service prepares current contribution without unit normalization; reference normalize_exchange once."
      unit: "item; kg; m3"
      frequency: "each installation change and campaign closure"
      temporal_coverage: "opening history through remaining service disclosure"
      site_scope: "Each actual equipment and installed-fluid gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "asset register; maintenance log; installed-fluid count; service evidence"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "actual post-release increments"
      record_type: "original-cohort service record"
      raw_fields: "original_cohort_id; original_Q; observation_start_end; opening_closing_FG; gross_shipment; gross_return; repeated_tests; actual_extra_power_water; additional_repair_input; real_mass_change; waste; inherited_vector; governing_permission; postwork_test_scope; postwork_acceptance; actual_disposition; new_and_removed_parts_water"
      collection_method: "Observe only real incremental services and gross physical product movements over the stated horizon; retain original Q/history and add each actual repair/emission/waste as a specific service exchange. Do not erase added water or losses or treat gross return mass as an original-delivery reversal. Keep raw increments; use original cohort Q in the sole normalize_exchange result per reference flow. Before assigning a returned unit to accepted stock, verify the governing documented permission and actual post-work tests/disposition; otherwise retain reject/waste status. Track each new and removed part and water/state change separately; never infer restored electrical/mechanical fitness from a brochure or visual repair."
      unit: "actual native row unit"
      frequency: "each service and stock change"
      temporal_coverage: "declared original-cohort service horizon"
      site_scope: "actual warehouse/packing/handling gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "cohort linkage; service meters; dispatch/return documents; FG bridge ; governing permission and post-work test/disposition records"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "each crate pallet strap cover and repair piece"
      record_type: "gross physical package ledger"
      raw_fields: "package_id; material; condition; moisture; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; purchase; supplier_included; external_return_received; new_repair; closing_mutually_exclusive; gross_shipped_out; external_return_sent; waste; actual_loss; internal_reuse; original_cohort; service_driver; inherited_vector; actual_water_material_in; actual_water_material_out; independently_measured_phase_mass; other_flow_terms_dedup; full_wet_stock_mass"
      collection_method: "Weigh/count each specific full package/article or repair piece, identify actual polymer/wood/treatment and humidity, reconcile every mutually exclusive stock/movement cell and supplier inclusion. Count-to-mass uses real package weighing, not a brochure or guessed pallet weight. package_balance reconciles raw gross mass without economic scaling; reference one normalize_exchange result only for attributed unit inventory. When actual water uptake/loss or material changes occur beyond already counted package/article or repair receipts/removals, add independently measured X_in and X_out on the respective incoming/outgoing sides. Name every actual added/removed material or water phase as a specific atomic exchange before dataset completion. These extra terms are deduplicated ONLY against other incoming/outgoing flow terms, never against closing stocks. Retained water/repair material stays in BOTH the real inflow and full closing physical mass; the same applies to actual outgoing transfers and opening stocks. Preserve gross quantities and each inherited vector separately, without inventing repair/uptake, forcing dry wood, shrinking mass by a burden share or buying an embodied component twice."
      unit: "kg"
      frequency: "each packing receipt dispatch return repair and closure"
      temporal_coverage: "full service horizon with opening history"
      site_scope: "all empty attached and reusable package pools"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "BOM; package weigh slips; moisture; return/repair record; stock census"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert each raw quantity to its row native extensive unit once; integrate only a measured rate over its interval. kWh×3.6 gives MJ. For gas/liquid mass use independent density at the actual measured state; fuel heat uses measured LHV/HHV/composition. Separate physical carrier and thermal accounts. No normalization."
      inputs:
        - raw_value
        - raw_unit
        - state
        - independent_density
        - calorific_basis
        - cp_utilities
      output: "R_j"
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-allocation-2010
    - id: asset_service
      applies_to: "refractory; mould; melter; press; thermal_station; curing_station; filter_felt; hydraulic_fluid"
      rule: "Separate actual physical stock/addition/removal records from service contribution. Assign directly consumed repairs/material to the responsible cohort; partition equipment upstream vectors only by documented actual service and remaining-service evidence with exchange-specific causality. Installed-fluid and carried repair vectors are stock-corrected once; no fixed lifespan or full-asset-per-kg factor."
      inputs:
        - physical_asset_ledger
        - upstream_vector
        - service_driver
        - cp_assets
      output: "R_j"
      source_ids:
        - ilcd-allocation-2010
        - jrc-glass-bref-2013
    - id: attribute_inventory
      applies_to: "all inventory rows"
      rule: "For each exchange retain R_j and genuine dedicated/virtual-subdivision assignment, then justified physical causality and only genuine residual allocation from section7. A_j = Bopen_j + attributed_current_j - Bclose_j for manufacturing raw/WIP and unassigned non-WIP stores; released closing FG is excluded from Bclose_j. For service A_j is actual incremental vector tied to its original cohort plus its legitimate service stocks. Already-net values are not corrected twice. Gross physical ledgers are independent."
      inputs:
        - R_j
        - dedicated_assignment
        - causal_evidence
        - residual_price_evidence
        - Bopen_j
        - Bclose_j
        - inherited_vector
      output: "A_j"
      source_ids:
        - ilcd-allocation-2010
    - id: package_balance
      applies_to: "all packaging rows"
      rule: "Opening empty + opening attached WIP + opening attached FG + opening reusable + purchases + supplier-included receipt + external returns received + new repairs = mutually exclusive closing stocks + gross shipments out + separate external returns sent + waste + actual losses. Reconcile each material independently; internal reuse cancels and this equation never divides by Q or scales by economic share. When actual water uptake/loss or material changes occur beyond already counted package/article or repair receipts/removals, add independently measured X_in and X_out on the respective incoming/outgoing sides. Name every actual added/removed material or water phase as a specific atomic exchange before dataset completion. These extra terms are deduplicated ONLY against other incoming/outgoing flow terms, never against closing stocks. Retained water/repair material stays in BOTH the real inflow and full closing physical mass; the same applies to actual outgoing transfers and opening stocks. Preserve gross quantities and each inherited vector separately, without inventing repair/uptake, forcing dry wood, shrinking mass by a burden share or buying an embodied component twice."
      inputs:
        - opening_stocks
        - incoming
        - closing_stocks
        - gross_outgoing
        - waste
        - actual_losses
        - cp_pack
      output: "package_balance_residual"
      source_ids:
        - lagranja-insulators-2019
        - ilcd-allocation-2010
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "q_j = A_j / Q"
      inputs:
        - A_j
        - Q
        - cp_release
      output: "q_j"
      source_ids:
        - ilcd-allocation-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every adopted flow and provider"
      requirement: "Confirm the complete product and every card native condition with actual BOM/SDS/drawing/provider evidence. A generic family name does not prove composition or manufacturing route; unresolved auxiliaries stay specific and need compatible identity before dataset finalization."
      evidence: "native evidence; BOM; supplier agreement"
    - id: dq_coverage
      applies_to: "full campaign and service horizons"
      requirement: "No failed/idle/cleanup/rework/stock exchange is dropped; disclose completeness, unknowns, extrapolation and uncertainty by stage/cohort. Future factory quantity requirements are not measured data."
      evidence: "all protocols; operating logs; independent balances"
    - id: dq_reactions
      applies_to: "glass and cement and species"
      requirement: "Provide independent recipe/assay, phase/reaction extent and actual species evidence. Separate carbonate loss, cement hydration/free water, atmospheric water and physical stock vectors; a closure residual is not two missing measurements."
      evidence: "laboratory phase/species evidence; physical and elemental checks"
    - id: dq_method
      applies_to: "source use and attribution"
      requirement: "Maintain complete original source context, limitations and contrary examples. Industrial sources support technology only; ILCD supports the stated attributional hierarchy. No brochure number is a factory default. Independent scientific and translation review remain pending."
      evidence: "source locators; allocation decision; uncertainty disclosure"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "reference product and first_release"
    rule: "Verify complete glass/cap/forged-pin/aluminous-cement/stainless-clip BOM, hot cure and all required tests at first release. A pure glass disc, porcelain insulator, unfinished assembly, RTV variant or string fails this boundary even if an electrical-insulator name is similar."
    source_ids:
      - lagranja-insulators-2019
      - sediver-hvac-2017
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Reference and finished row are1kg of the same complete net assembled product. Verify unique Q from actual release weighing; closing released FG is already in Q. Check every raw→converted→attributed→single A_j/Q link and original-cohort service denominator. Q=0 retains burdens with no unit result."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_native
    applies_to: "all flow and unit bindings"
    rule: "Recheck every native CAS/form/route/grade/geography/compartment/property restriction in the consuming card and actual supplier choice. Exact property→unit-group→reference-unit support is required; no latest-version substitution, secondary-density inference or Item(s)-to-kg guess. Unsupported core identity makes guidance unavailable; auxiliaries remain explicit gaps until resolved."
    source_ids:
      - lagranja-insulators-2019
      - jrc-glass-bref-2013
  - rule_id: validate_balance
    applies_to: "manufacture FG services and combined control volume"
    rule: "Independently reconcile actual wet physical and relevant elemental balances, reaction/species evidence, WIP/history vectors, complete-assembly and dismantled-waste exclusivity, installed assets/fluids, actual heat-carrier water returns and every package stock/movement cell. Economic allocation changes burden attribution, not gross physical masses; one residual cannot establish multiple unknowns."
    source_ids:
      - jrc-glass-bref-2013
      - ilcd-allocation-2010
  - rule_id: validate_completeness
    applies_to: "final dataset and uncertainty"
    rule: "All actual flows and missing measurements must be accounted, including conditional inputs and extra service repairs/species. A not-applicable finding requires evidence of absence; unknowns cannot pass as zero. Schema/projection/finite measurement success does not establish scientific approval, translation approval, classification acceptance or publication."
    source_ids:
      - jrc-glass-bref-2013
      - ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Matched manufacture-to-first-release inventory of complete glass suspension units with disclosed original-cohort services"
  allowed_use: "Actual configuration and route compatible supply modelling after data-quality and applicability assessment"
  excluded_use: "Bare-shell, porcelain, composite, coating or whole-string substitution; installation/use/end-of-life modelling; unsupported comparative electrical service or certification claims"
  required_metadata: "All required qualifiers and complete product/BOM; route; raw/WIP/FG/history and service horizons; native provider compatibility; allocation and original sources"
  required_quality_disclosure: "Actual measurements and unknowns by stage/cohort; speciation and independent balances; uncertainty and hold status; no invented factory data"
  update_trigger: "Product component/coupling/coating change; batch/furnace/cure route change; material/provider/native identity change; new species or stock data; revised source/method evidence"
data_sources:
  - id: "sediver-hvac-2017"
    type: "handbook"
    reference: "Sediver. Toughened glass insulators for HVAC applications. C11-2017. https://www.sediver.com/wp-content/uploads/Sediver-toughened-glass-insulators-for-HVAC-applicationsC11-2017-2.pdf"
    used_for: "PDF pp3–6 and8: finished suspension-unit technology; hot aluminous cement assembly; tests; profiles and zinc-sleeve/coated counterexamples. Manufacturer claims/values are not defaults."
  - id: "lagranja-insulators-2019"
    type: "handbook"
    reference: "La Granja Insulators. Catalogue ES EN 2019. https://www.lagranjainsulators.com/wp-content/uploads/2023/10/Catalogue_LaGranjaInsulators_ES-EN_2019_low-1.pdf"
    used_for: "PDF pp10–16 and40–43 and46–47: components; ductile/malleable and locking/sleeve alternatives; RTV counterexample; pressing/tempering/thermal shocks; hot cement cure and routine tests; gross crate/pallet/strap/cover packing. No universal polymer grade or SKU mass adopted."
  - id: "jrc-glass-bref-2013"
    type: "official_guidance"
    reference: "European Commission JRC. Best Available Techniques Reference Document for the Manufacture of Glass. 2013. EUR25786 EN. doi:10.2791/69502. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/GLS_Adopted_03_2012_0.pdf"
    used_for: "Sections2.1–2.3 and2.8 and3.2/3.7: general raw batch/melt/utility/emission completeness and adjacent special-glass counterexamples. Tables2.1/2.2/2.8 and historical cases are not this insulator recipe or quantitative defaults; no LCA allocation evidence."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance. First edition March2010. Sections7.9.2–7.9.3. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "PDF pp275–288: chosen attributional scenario; dedicated/virtual subdivision; exchange-specific determining physical causality; residual common-gate actual-state contemporaneous market value. Adjacent QFD example is not an insulator share. No industrial recipe/quantity evidence."
