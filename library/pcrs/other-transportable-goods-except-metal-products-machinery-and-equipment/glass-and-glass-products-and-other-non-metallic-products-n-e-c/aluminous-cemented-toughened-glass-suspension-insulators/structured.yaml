system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Include batch receipt/segregation/storage/weighing/mixing, melt/fining/conditioning and gob shearing, mould preparation/hot pressing, thermal balancing/surface cooling and thermal shocks, shell inspection and reject handling, actual calcium-aluminate cement mixing, fitted cap/pin/clip assembly, hot curing, prescribed routine mechanical/electrical/dimensional tests, marking and complete-unit first release. Record all real furnaces, baths, fans/compressors, cooling loops, dust/effluent treatment and inbound freight. Do not copy an annealing-only sheet route or substitute a glass-disc gate."
      source_ids:
        - lagranja-insulators-2019
        - sediver-hvac-2017
        - jrc-glass-bref-2013
    - rule_id: boundary_complete
      applies_to: "all inventory rows"
      rule: "Retain all failed/zero-output batches, start/stop, idle/hot hold, cleanup, sampling/destructive tests, rejected shells/assemblies, rework and maintenance. Keep opening/closing raw, WIP, cure-stage partly assembled units and unassigned non-WIP stores, with each exchange inherited burden vector. Internal melt/cullet/water/heat/interstage transfers cancel only after physical and history reconciliation; unknown is not zero. Each actual newly identified supply, reaction species, auxiliary, package or destination requires a separate physically specific row."
      source_ids:
        - jrc-glass-bref-2013
        - lagranja-insulators-2019
    - rule_id: boundary_release
      applies_to: "first_release and service"
      rule: "Q includes net complete units once at their first required quality release, including released closing FG. Do not add closing FG as another manufactured output or subtract its manufacturing burden in Bclose. Manufacturing Bclose includes only raw/WIP and unassigned non-WIP stores. Later packing/storage/dispatch, reinspection and returned previously released units do not create new production. Each service account has actual incremental burdens, the original cohort Q and a declared observation horizon; do not use net shipments or current manufacture as its denominator. Rework of a previously released unit requires documented permission under the actual manufacturer procedure or governing specification, a defined post-work test scope and recorded acceptance/disposition. Residual-strength statements for a broken shell do not authorize restoration, reuse or automatic return to accepted stock. Keep failed or shattered units in their actual reject/waste disposition until eligibility is independently established; record every new/removed component, added/removed water and real loss separately, without new Q."
      source_ids:
        - lagranja-insulators-2019
        - ilcd-allocation-2010
    - rule_id: boundary_physical
      applies_to: "manufacture and FG and combined boundary"
      rule: "Reconcile whole wet physical mass and relevant Si/Na/K/Ca/Mg/Al/C/N/S/Cl/Fe/Zn/Cr/Ni balances independently from measured real species and reaction extent. Glass carbonate decomposition, cement hydration, free/carry water and atmospheric humidity have separate evidence. A single residual cannot fit two unknowns. COD/VOC/NOx/SOx/total-element/particle-size indicators do not identify molecular masses. FG physical balance is opening FG + first release + actual gross returns + measured real additions = closing FG + gross outward units + waste/removals + real losses; internal manufacturing Q cancels on combination and historic burden remains attached to its cohort."
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-allocation-2010
    - rule_id: boundary_assets
      applies_to: "equipment and installed fluids"
      rule: "Maintain unscaled physical assets/new and repaired parts/removals/moisture/installed oil and bath-water stocks separately from current service burden. No fixed machine/mould/refractory life, no kg-per-item guess and no entire machine per kg. An asset service vector uses documented actual service history, remaining service and replacement evidence; already net records receive one stock correction only. Include actual new repairs and old removals, rather than assuming equal dry mass."
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-allocation-2010
    - rule_id: boundary_heat_water
      applies_to: "utility control volumes"
      rule: "Preserve native energy/fuel/volume and independent carrier-mass accounts. Purchased hot-water heat, physical carrier supply/return and real temperatures/enthalpies follow the supplier water/energy agreement with no duplicate full provider or water burden. Internal heat recovery and recirculation cancel; steam/condensate/boilers are not presumed. Any actual steam supply or other fuel requires new specific cards and applicability review. Gross air O2/N2/Ar/CO2/humidity and their discharge remain species-resolved without a simultaneous air aggregate."
      source_ids:
        - jrc-glass-bref-2013
        - ilcd-allocation-2010
    - rule_id: boundary_packaging
      applies_to: "each separate package material"
      rule: "For each crate/pallet/strap/cover and any actual other material: opening empty + opening attached WIP + opening attached FG + opening reusable stock + new purchases + supplier-included receipt + external returns received + real new repair additions = mutually exclusive closing stocks + gross physical shipments out + separate external returns sent + waste + measured real losses. Preserve wood/moisture and removed-old/added-new repair components. Internal reuse cancels; never scale gross material by economic share, net-Q, automatic coproduct credit or another purchase. Crating short groups does not turn the reference into an installed insulator string."
      source_ids:
        - lagranja-insulators-2019
        - ilcd-allocation-2010
