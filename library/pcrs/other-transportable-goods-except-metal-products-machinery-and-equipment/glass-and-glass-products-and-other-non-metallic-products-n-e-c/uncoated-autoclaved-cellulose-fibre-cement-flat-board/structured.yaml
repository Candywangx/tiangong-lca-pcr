measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q = sum of calibrated net whole-board masses at the documented first quality release and actual moisture condition; exclude removable packaging. Retained closing FG is already in Q. Measure each configuration or an explicit traceable sampling range, never borrow catalogue/secondary-property density."
  - id: native_energy
    applies_to: "energy rows"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve each native extensive numerator. Electricity uses its verified Net calorific value/MJ reference; exact 1 kWh = 3.6 MJ conversion precedes attribution. Actual heat uses its real energy convention. Fuel carrier mass and net/gross heat are separate linked subledgers, never duplicated full providers. Mass/kg rules do not constrain MJ, kWh or m3 numerators."
  - id: actual_area
    applies_to: "geometry disclosure"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "Record actual single-face projected outline area after finishing. L times W only for a verified rectangle; use measured or traceable drawing-specific geometry for cutouts/nonrectangles, never a bounding box or doubled faces. Area is a qualifier here; no area/weight conversion without independent same-configuration measurements."
  - id: native_count
    applies_to: "count and configuration"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Item(s) and item are equivalent counts with factor 1. Count-to-kg needs measured net whole-board M on a calibrated scale for the same configuration, actual moisture, stated sampling range and uncertainty; never use a secondary Mass coefficient or assumed per-piece mass. Physical machinery count and current service burden are separate."
  - id: native_volume
    applies_to: "liquid gas and rate conversion"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use cumulative liquid/gas volume once; integrate only a true rate over actual time. Density must be independently measured for that substance at actual composition, temperature, pressure and moisture; never use water density for oil or gas. Native hydraulic-fluid m3 and physical mass are linked by such density, not by its label."
  - id: phase_basis
    applies_to: "water and mineral state"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Distinguish supplied carrier water, free moisture, liquid/vapour phase change and mineral structural/reaction water with independent phase-sensitive evidence and real composition/extent. Dry-mass assay is not another purchase or a second reference product."
