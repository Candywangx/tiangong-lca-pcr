product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.glass-and-glass-products-and-other-non-metallic-products-n-e-c.uncoated-autoclaved-cellulose-fibre-cement-flat-board"
  classification_refs: "CPC 3.0 37570; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "Whole uncoated uninstalled autoclaved cellulose-pulp-reinforced Portland-cement/quartz flat board at first quality release"
  excluded_products: "Cellulose pulp means discrete prepared plant fibres, not wood chips or wood wool. Cellulose is the only reinforcing fibre in this selected method; a real polymer retention aid is a separately supplied preparation, not automatically a reinforcing fibre. Exclude asbestos, PVA/glass/basalt or other reinforcement, gypsum matrices, resin/wood-particle agglomerates, corrugated/moulded roofing, patterned or coated boards, externally faced/laminated boards, composites with dissimilar layers and installed roof/wall systems. Those require a distinct applicability decision. Same-formulation thin-layer accumulation inherent in Hatschek forming remains included; it is not the excluded dissimilar-layer composite. Cement manufacture is upstream, not whole-board manufacture. No formulation, fibre share, water/cement ratio, curing temperature/time, strength, density, operating recipe, installation test threshold or service life is prescribed. The declared unit is manufacturing supply, not proven installed performance."
  representative_product: "UCO Superflex-type bare flat-board terminal; physical/method synthesis reference rather than a required SKU"
  production_route: "Purchased raw supplies → pulp dispersion/refining and actual sand preparation → slurry mixing → Hatschek forming/dewatering → green cutting/stacking/pressing → precuring and steam autoclaving → cooling/de-stacking/drying/trim/tests → first release"
  market_state: "Whole manufactured bare flat board at actual moisture and specification; service horizon separately disclosed"
functional_unit:
  what: "Supply a specified whole manufactured bare cellulose-cement flat board for downstream use; installed-system function is not quantified"
  how_much: "1 kg net whole board newly first-quality-released at actual recorded moisture and configuration"
  how_well: "Actual manufacturer specification and recorded integrity/dimension/moisture/phase and actually claimed performance tests; no universal class/threshold"
  how_long_or_cycle: "One first-release manufacturing cohort; disclose original Qc and actual observed service horizon H separately; no assumed building life"
  reference_flow_link: "finished_board"
system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "whole route"
      rule: "Collect real whole purchased raw supplies and their transport, pulp dispersion/refining, actual silica wet milling if performed, dosing/mixing, Hatschek sieve/felt/format-roll forming, dewatering and green cutting, stacking/pressing, documented precuring then steam autoclaving, cooling/de-stacking, actual drying and dry trim, inspection and first quality release. Internal return loops retain actual wet mass, composition and inherited burden. Air-only curing, extrusion and flow-on are not interchangeable branches. Sources describe a transparent technical synthesis, not one complete contemporary factory order."
      source_ids:
        - uac-fibre-cement-2024
        - bba-superflex-2019
        - iibcc-cutting-2010
        - swisspearl-manufacture
    - rule_id: b_gate
      applies_to: "manufacturing cohort"
      rule: "Q is the sum of net intact whole boards newly passing first quality release in this cohort at measured moisture; retained closing FG from that cohort is already in Q. Do not deduct its manufacturing burden or add Q and closing FG as two manufacturing outputs. Gross shipments, returns and reinspection never create new production. Retain all failed boards, destructive samples, startup/shutdown, idle, cleaning and actual rework burdens. Q=0 retains actual burdens and stock/physical records without a unit result."
      source_ids:
        - bba-superflex-2019
        - ilcd-allocation-2010
    - rule_id: b_service
      applies_to: "post-release service"
      rule: "Record actual performed packing/storage/handling/dispatch service increments by original cohort c and observation horizon H against its original Qc. Finished boards remaining in stock do not cancel service already performed. Only unused/unassigned service or charge may carry forward. The board-only FG bridge uses whole net board mass including actual incorporated water: opening released FG + newly first-released Q + actual returned-board mass + actual material/water incorporated into boards during permitted service = closing released FG + gross shipped-board mass + board destruction/waste + actual board-material/water outlegs. Packaging and supporting asset/fluid stocks are reconciled separately in the full service gate under b_physical/b_packaging, rather than added to a board-only bridge without their own stocks. Keep original delivery identity and original composition/burden links for each return; actual returned mass need not equal original delivered mass. Return handling, moisture changes and permitted rework are real increments. Combine manufacturing and FG/service gates by cancelling internal Q exactly once; this is not a net-delivery-Q method. Actual movements and caused loads are recorded even for unapproved, failed or rejected work. Permission, continued configuration, required postwork tests and acceptance govern authorization and qualifying stock only, never whether actual facts are collected. Keep actual hold/disjoint repair-WIP/waste custody once under original Qc/H; natural storage moisture exchange needs no fabricated work permission. Deduplicate material/water only against the same measured corresponding same-side flow term, never stock, opposite flow or an existing card. Retained influx and full closing wet stock both remain; one whole wet P/I receipt counts embedded water once. No event, restoration, fixed quantity, density or credit is presumed."
      source_ids:
        - bba-superflex-2019
        - ilcd-allocation-2010
    - rule_id: b_inheritance
      applies_to: "each exchange vector"
      rule: "Use calc_burden for each exchange in its own extensive unit. Carry opening and closing raw material, unreleased WIP and genuinely unassigned non-WIP stores with their full inherited upstream and performed-processing vectors. Closing manufacturing vectors exclude first-released FG. Do not cancel physical new material/water ingress merely because it remains in a closing wet stock. Material consumption already corrected for stocks must not receive a second stock deduction. Keep item/batch transfers and every per-flow vector rather than transferring a mass-only total. Independently record each raw/WIP/non-WIP physical quantity and every complete historical exchange vector; a mass total cannot replace per-exchange history."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_physical
      applies_to: "each gross physical gate"
      rule: "Define physical ownership of every stock and leg before reconciling the gates. The manufacturing board-material gate contains raw materials, unreleased WIP and unreleased stores, and outputs first-release Q once; it excludes released FG stock. The board FG bridge contains released FG stocks and that same incoming Q, not raw/WIP. Each gate also retains its actual full packaging, installed asset, fluid and repair subledgers with no fractional physical stocks; a physically shared utility has one separately declared stock boundary. The combined gate takes the union of all physical stocks once and cancels internal Q and paired transfers. Reconcile the full wet opening/closing state in every declared stock boundary. For each gate: opening full physical stocks + all actual external inputs = closing full physical stocks + all actual external outputs. Enumerate each raw supply, each water phase, steam carrier mass, each ambient/exhaust species, condensate/product return, waste, sample, shipment and new/removed part. Deduplicate X_in/X_out only against other actual incoming/outgoing terms already counted, including whole-article P/I embedded inputs. Never suppress a real new ingress because it remains in closing stock. Cancel internal paired transfers only at the combined gate; do not scale physical gross legs by economic or other burden shares."
      source_ids:
        - uac-fibre-cement-2024
        - ilcd-allocation-2010
    - rule_id: b_chemistry
      applies_to: "water and carbon balances"
      rule: "Establish actual cement/mineral phases, hydration extent, structural water, free water, liquid/gas phase transfer, cellulose moisture and carbon independently. Whole reference mass includes all actual board constituents and water at release. Element balances for relevant C/H/O/Ca/Si/Al/Fe/N/S and total physical mass are independent checks; one residual cannot solve two unknowns. No automatic calcination CO2, fibre oxidation, carbonation uptake or permanent storage/credit is assumed. NOx, VOC, COD, total carbon and dust-size results are indicators, not a specific molecular mass. Captured dust is not also an air release."
      source_ids:
        - uac-fibre-cement-2024
        - iibcc-cutting-2010
    - rule_id: b_packaging
      applies_to: "each packaging article"
      rule: "For every physical packaging article use opening empty + opening WIP/FG-attached + opening reusable + P (paid procurement (standalone or bundled)d) + I (first non-purchased external ingress) + ER (external returns received) + X_in = closing empty + closing WIP/FG-attached + closing reusable + S (out with gross physical shipments) + EO (external returns out) + W (waste) + X_out. P and I are disjoint upstream owners; supplier inclusion never erases the real physical ingress. Embedded material/water/fasteners already in a whole article occur once. Internal reuse cancels; it creates no purchase, net-board Q or automatic coproduct. Record each actual return/transfer/waste leg and contamination/repair separately. Add actual separately measured material/water X_in on the incoming side and X_out on the outgoing side of this formal equation. Deduplicate only the same corresponding already-counted same-side flow term, never stocks/opposite flows/an existing card; retain actual retained influx and complete wet closing stock, with each wet P/I once. If there is one real co-collected waste stream, article W values are independently measured conserving origin subaccounts, not invented separated outlets or additive component-plus-whole treatment.  Apply packaging_receipt_basis to distinguish each actual P/I/ER receipt."
      source_ids:
        - bba-superflex-2019
        - ilcd-allocation-2010
    - rule_id: b_utilities
      applies_to: "steam electricity assets and fluids"
      rule: "The selected autoclave requires real steam/thermal records; no boiler or supplier is inferred from a diagram. Choose and disclose the actual utility interface. A purchased whole steam supply has one energy/water upstream owner; record carrier mass and actual pressure/temperature/quality and enthalpy separately from MJ. Actual externally returned condensate or warm exchanger water is a Product return at measured mass/composition/thermal state; do not duplicate supplied water or assume nonexistent return. Electricity, each actual fuel and thermal supply remain separate exchanges. For machinery/autoclave/rollers/plates/mesh/felt/blades and every repair or fluid, retain full gross acquisitions, installed/unused/removed stocks, water and disposal; current service burden uses measured use and justified service attribution, with no fixed life or one machine per kg. Actual on-site boiler/fuel/water-treatment or different drying technology requires explicit additional atomic rows and evidence before use."
      source_ids:
        - swisspearl-manufacture
        - bba-superflex-2019
        - ilcd-allocation-2010
    - rule_id: b_supply
      applies_to: "whole formulation and recursion"
      rule: "Each whole purchased cement blend, pulp preparation or chemical formulation has one upstream purchase owner; assay, active ingredient and carrier water are non-additive composition subledgers. Actual on-site preparation instead records each purchased component and real mixing energy/loss. Same-category returned/recovered material is traced by origin and inherited burdens; a bought finished board cannot substitute for omitted manufacture. Add every actual unlisted chemical, packaging component, water leg, emitted species or waste as a concrete atomic row with a protocol and reviewed identity; unknown is not zero or a plural other-material bucket."
      source_ids:
        - uac-fibre-cement-2024
        - ilcd-allocation-2010
    - rule_id: packaging_receipt_basis
      applies_to: "each packaging receipt"
      rule: "For every actual packaging article, classify each whole external receipt once. P is paid procurement, including paid packaging bundled with another supply without a separate invoice. I is all first non-purchased external ingress: standalone gifts, loans, rental or pool receipts and non-purchased supplier-attached packaging; supplier attachment is only an I subset. ER requires this same item or an auditable configuration-matched batch linked to this site's own prior outward record; custody or another party's use alone does not prove a return. P, I and ER are disjoint. Existing I cards and their raw protocols cover the same physical article for every such I origin; no new material, UUID or quantity is presumed. X_in/X_out remain disjoint material/water-change terms, never a substitute for whole-article receipt. Retain gross physical quantity, owner/custodian, payment or non-purchase basis, origin, prior-outward link where required, native state/unit and inherited manufacturing/service vector. Non-purchase is neither a new manufacture nor automatic zero burden: attribute actual used service and incremental transport/handling once to its proper original cohort and denominator, retaining unused service separately without a default lifetime or credit. This is the declared conserving foreground accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-allocation-2010
