      frequency: "Each item or traceable cohort sample"
      temporal_coverage: "Whole cohort and service H"
      site_scope: "Release gate and subsequent FG stocks"
      aggregation_rule: "Preserve undivided raw release mass and event IDs; calc_raw assembles Q; only calc_normalize normalizes."
      quality_evidence: "Calibration sampling specification complete release/nonconformity disposition"
    - protocol_id: cp_vectors
      process_id: "utilities"
      flow_role: "physical stocks inheritance and services"
      record_type: "foreground_record"
      raw_fields: "per-material/water-phase gross legs; packaging P/I/ER/S/EO/W; installed/unused repair and fluid stocks; each flow historical vector; service intensity/H; once-only genuine handover decision"
      collection_method: "Independently reconcile manufacture, FG/service and combined gates; retain full wet closing stocks and real new influx simultaneously; burden attribution never scales physical legs. Record row_id, actual process/direction/cohort, every physical raw/WIP/non-WIP/asset/fluid quantity and each inherited exchange vector. Do not repeat already-net stock corrections. Work permission controls authorization/acceptance, not capture of real unapproved/failed burdens."
      unit: "native extensive unit"
      frequency: "Each event and opening/closing"
      temporal_coverage: "Full reporting period and service H"
      site_scope: "Each real external interface and internal pair"
      aggregation_rule: "Preserve undivided gross physical legs and inherited vectors; no normalization in collection."
      quality_evidence: "Physical counts paired transfers supplier water/energy convention and causal allocation records"
    - protocol_id: cp_pack_physical
      process_id: "service"
      flow_role: "seven actual package physical directions"
      record_type: "foreground_record"
      raw_fields: "row_id; actual process_id prepare or service; article/material/design/ownership; P/I/ER/S/EO/W; disjoint open/close empty/attached-WIP/attached-FG/reusable; wet/dry mass and moisture; supplier-included burden owner; original Qc/H; measured component W and actual whole mixed removal/treatment ID ; packaging P/I/ER origin and payment/non-purchase evidence; same-item prior outward ID; inherited service owner/vector"
      collection_method: "Identify each actual atomic direction and gate in the named row; independently count/weigh full wet articles. Manufacturing uses Q, actual postrelease original Qc/H. No event or zero is presumed. Whole P/I embeds water once. Actual mixed Waste has one removal/treatment; component W is a measured conserving non-additive origin ledger.  Actual movements and caused loads are recorded even for unapproved, failed or rejected work. Permission, continued configuration, required postwork tests and acceptance govern authorization and qualifying stock only, never whether actual facts are collected. Keep actual hold/disjoint repair-WIP/waste custody once under original Qc/H; natural storage moisture exchange needs no fabricated work permission. Deduplicate material/water only against the same measured corresponding same-side flow term, never stock, opposite flow or an existing card. Retained influx and full closing wet stock both remain; one whole wet P/I receipt counts embedded water once. No event, restoration, fixed quantity, density or credit is presumed.  For packaging receipts apply packaging_receipt_basis; standalone non-purchase is I, never a fabricated ER or X."
      unit: "kg"
      frequency: "each actual event and stock boundary"
      temporal_coverage: "complete manufacture and observed H for original Qc"
      site_scope: "actual named manufacture/service/external gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "measured tickets calibration phase assays and disposition records"
    - protocol_id: cp_service_changes
      process_id: "service"
      flow_role: "actual board and packaging material water and waste changes"
      record_type: "foreground_record"
      raw_fields: "row_id; actual phase/species; board or package stock owner; original delivery/Qc/H; actual added/removed wet/dry material; atmospheric uptake/evaporation; liquid supplier/treatment; actual permission/posttests/acceptance/disposition; disjoint repair-WIP; actual single mixed waste identity and destination"
      collection_method: "Independently sample and weigh each actual material/water stream and receiving phase; ordinary storage/handling moisture is recorded without fictitious work. Record actual unapproved/failed work loads and hold/waste disposition. One residual cannot determine dry material and water.  Actual movements and caused loads are recorded even for unapproved, failed or rejected work. Permission, continued configuration, required postwork tests and acceptance govern authorization and qualifying stock only, never whether actual facts are collected. Keep actual hold/disjoint repair-WIP/waste custody once under original Qc/H; natural storage moisture exchange needs no fabricated work permission. Deduplicate material/water only against the same measured corresponding same-side flow term, never stock, opposite flow or an existing card. Retained influx and full closing wet stock both remain; one whole wet P/I receipt counts embedded water once. No event, restoration, fixed quantity, density or credit is presumed."
      unit: "kg"
      frequency: "each actual event and stock boundary"
      temporal_coverage: "complete manufacture and observed H for original Qc"
      site_scope: "actual named manufacture/service/external gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "measured tickets calibration phase assays and disposition records"
  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert original quantities to each actual extensive unit; use cumulative volume once and integrate only real rates. Establish one purchase owner from actual supply/composition; do not re-correct stock-corrected material consumption. Use exclusive subdivision and actual exchange-specific causal attribution to form undivided I_e or S_e; Q is the sum of unique first-release net board masses from cp_gate."
      inputs:
        - "raw readings"
        - cp_gate
        - cp_vectors
      output: "I_e; S_e; Q"
      source_ids:
        - ilcd-allocation-2010
    - id: calc_burden
      applies_to: "all inventory rows"
      rule: "A_e = B_open_e + I_e + S_e + T_in_e - B_close_e - T_out_e. Preserve each e native unit; B contains full historical vectors only for raw materials, unreleased WIP and truly unassigned stores; B_close excludes first-released FG. S includes performed original-cohort service and is not deducted for retained FG; only unused/unassigned service/charge carries forward. Capital/repairs/fluids enter S by actual consumed service, not again as full capital purchases in I. Do not double-deduct stock-corrected consumption. T_out requires a_waste genuine other-cohort/function handover with equal receiver vector, not ordinary waste sale."
      inputs:
        - B_open_e
        - I_e
        - S_e
        - T_in_e
        - B_close_e
        - T_out_e
        - cp_vectors
      output: "A_e"
      source_ids:
        - ilcd-allocation-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "For each gate full opening wet physical stocks plus actual gross external inputs equal full closing wet physical stocks plus actual gross external outputs, under b_physical/b_packaging. Manufacture outputs Q once; the FG bridge uses that same Q and actual G/R plus real water/material increments; combine by cancelling internal Q and paired internal recoveries. Packaging six legs and repair/water X deduplicate only other already counted terms, never real new influx retained in closing wet stock. Independently balance relevant elements and each species, without fitting several unknowns from one residual."
      inputs:
        - "physical opening stocks"
        - "physical incoming legs"
        - "physical closing stocks"
        - "physical outgoing legs"
        - cp_vectors
      output: "physical gate and element reconciliations; V_e"
      source_ids:
        - uac-fibre-cement-2024
        - ilcd-allocation-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_e = A_e / Qc, once only when Qc>0; manufacturing Qc is cohort first-release Q, while post-release service uses that same original-cohort Q with actual H disclosed. Q0 retains A_e and physical inheritance without a unit result. Cards and aggregation only reference this result without further division. Reference output is 1 kg whole board. For physical disclosures of packaging P/I/ER/S/EO/W, FG custody movements including damaged-board Waste ingress and board-waste outlegs, actual repair-material/water X legs, paired internal material/water/WIP/recovery transfers and actual thermal-carrier ingress/egress or Product returns, replace the numerator by actual full gross V_e in its own native extensive unit and use this same sole q_e=V_e/Qc once. Do not add historical burden, stock-correct the measured leg, economically scale it, create another provider purchase or credit. Actual manufacturing and supply/cleaning/repair/treatment service burdens remain uniquely assigned in A_e separately, never erased by this override. Manufacturing Qc=Q; postrelease uses original Qc/observed H; internal pairs cancel once on consolidation. Asset-card current service equivalents and full physical acquisitions/installed-stock ledgers remain independent, without replacing service by new-purchase mass or buying twice."
      inputs:
        - A_e
        - Qc
        - cp_gate
        - cp_vectors
        - V_e
      output: "q_e"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every row"
      requirement: "Confirm complete native physical identity/restrictions per row; unresolved auxiliaries retain concrete names without collection labels or wrong-family binding."
      evidence: "Original supply records; actual query member; complete direct read and property/unit chain"
    - id: dq_route
      applies_to: "whole manufacture"
      requirement: "Confirm cellulose rather than wood particles/wool or other reinforcement, and actual Hatschek/press/autoclave terminal; do not present multi-factory sources as one recipe."
      evidence: "Complete primary originals; process and terminal test records"
    - id: dq_measure
      applies_to: "all quantities"
      requirement: "Collect calibrated original units, moisture/phase, total/rate, real geometry and independent density/enthalpy with uncertainty."
      evidence: "Calibration logs and relevant substance/configuration sampling/lab"
    - id: dq_cohort
      applies_to: "Q stocks and services"
      requirement: "Complete first-release identities and all-flow historical vectors including failed/zero output, retained FG and performed services; no double stock deduction."
      evidence: "Cohort ledger physical counts release/return original-delivery bridge"
    - id: dq_allocation
      applies_to: "shared burdens"
      requirement: "Independent per-exchange causal evidence and genuine residual common-gate values; waste sale never automatic T_out."
      evidence: "Subdivision metering causal alternatives actual market-state and sensitivity"
    - id: dq_complete
      applies_to: "all material water packaging asset gas and waste legs"
      requirement: "Complete each gross physical leg, wet stock, supplier-included packaging and species; add actual unlisted flows as atomic cards/protocols; missing is not zero."
      evidence: "Gate balances six-leg packaging repair/water records treatment receipt and gas speciation"
    - id: dq_quality
      applies_to: "release and postwork"
      requirement: "Actual specification work permission and postwork acceptance/disposition; no assumed restoration of broken hydraulic board or copied source thresholds."
      evidence: "Manufacturer permission original tests and nonconformity disposition"
validation_rules:
  - rule_id: v_scope
    applies_to: "product and route"
    rule: "Confirm the actual bare whole flat terminal, cellulose-only reinforcement, supply composition and Hatschek/press/autoclave route against primary evidence and site records. Apply every native restriction in the adopted flow cards. Whole mineral-binder/plant-fibre identity is not authority to model asbestos, wood-wool/particle agglomerates, gypsum, polymer/glass reinforcement, coated products or installed systems."
    source_ids:
      - uac-fibre-cement-2024
      - bba-superflex-2019
  - rule_id: v_quantity
    applies_to: "Q and normalization"
    rule: "Verify unique first-release IDs/Q, measured moisture/geometry/configuration, all zero/failed runs and original cohort service horizon. Q includes closing FG; manufacturing closing burden excludes it. Raw protocols do not divide; every non-reference amount reuses the one calc_normalize result. Q0 must not emit a unit result. Check each native numerator unit separately."
    source_ids:
      - bba-superflex-2019
      - ilcd-allocation-2010
  - rule_id: v_balances
    applies_to: "manufacturing FG and combined physical/burden gates"
    rule: "Independently close wet mass, relevant elements, water phases, each packaging cycle, repair/asset/fluid stocks and inherited exchange vectors using b_physical/b_packaging and calc_burden. Check external steam/condensate enthalpy and provider ownership, gross species and true flow-rate integration. Do not close two unknowns with one residual, scale gross physical legs by allocation, or erase real ingress retained in closing stock. Quantitative unknowns remain unresolved."
    source_ids:
      - uac-fibre-cement-2024
      - ilcd-allocation-2010
  - rule_id: v_disposition
    applies_to: "quality and post-release work"
    rule: "Retain actual specification permission, postwork tests, acceptance and disposition for post-release drying/trim/rework; a delivery/reinspection is not another release and a broken hydrated board is not presumed restored. Track wet/dry cut dimensional changes after autoclave, dust collection versus actual atmospheric releases and each actual residue destination. Do not substitute source test thresholds or assume wet cutting eliminated dry trim."
    source_ids:
      - bba-superflex-2019
      - iibcc-cutting-2010
  - rule_id: v_allocation
    applies_to: "data use and uncertainty"
    rule: "Verify exclusive/virtual subdivision before each exchange-specific causal key and the genuine residual common-gate market-value decision. Waste sale/handover alone grants no burden subtraction or credit. Report missing evidence and sensitivity by rule; no numerical site balance, scientific approval or translation approval follows from structural checking."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual board supply as downstream secondary/background data with full boundary/qualifiers and separate applicability review"
  allowed_use: "Attributional modelling with compatible bare flat terminal real route geography/period supply and moisture/configuration"
  excluded_use: "Manufacturing recipes; structural/construction thresholds; installed function; other reinforcement/matrix/coating; automatic carbon-storage credit"
  required_metadata: "Whole bare flat board with cellulose pulp as the only reinforcing fibre and hydrated Portland-cement/quartz matrix; No asbestos wood chips wood wool gypsum matrix polymer/mineral reinforcement coating or installed system; Actual site reporting period supply geography and the explicitly selected Hatschek/press/autoclave route; Actual pulp preparation and silica milling state and each whole purchased formulation with additive/carrier-water subledgers; Actual precuring autoclave drying de-stacking trim tests acceptance and disposition records; Measured whole-board first-release net mass moisture composition phase state and configuration range; Actual single-face projected outline geometry and independent same-configuration mass/area/count measurements; Actual manufacturer/specification permission and postwork tests for any post-release work; Unique first-release Q already including retained closing finished goods and zero-output/failed operation records; Opening/closing raw/WIP/unassigned-store inheritance vectors distinct from released FG; Original cohort Qc and observed horizon H for all performed post-release services; Actual steam carrier mass pressure temperature enthalpy condensate and supplier water/energy ownership; Each packaging P/I/ER/S/EO/W physical leg and opening/closing empty attached and reusable stocks; Installed assets fluids and new/removed repairs as full physical stocks and separately assigned current service; Independent molecular species phase origin receiving medium and physical/element balance evidence; Native identity restrictions from every adopted card and local provider compatibility evidence"
  required_quality_disclosure: "Per-source and actual quantities; native restrictions; unresolved identities/values; Q/H; all gate balances; allocation sensitivity and unreviewed scope"
  update_trigger: "Reassess changes in material/supplied formulation/reinforcement/forming-curing/thermal interface/surface/measurement gate/native identity/evidence"
