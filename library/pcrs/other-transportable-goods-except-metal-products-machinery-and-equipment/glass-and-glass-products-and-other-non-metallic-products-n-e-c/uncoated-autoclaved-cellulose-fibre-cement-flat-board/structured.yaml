allocation_rules:
  - rule_id: a_subdivide
    applies_to: "each multifunctional process"
    rule: "This is attributional accounting. Assign exclusive supplies/operations to their actual cohort/function first; use separate meters or defensible virtual subdivision before allocation. Retain zero/failed campaigns and their actual causal owner; lack of saleable output never deletes them. Industrial manufacturing descriptions do not justify an LCA allocation key."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For every remaining exchange independently establish its determining physical cause with real records. Autoclave heat needs actual load composition/temperature/moisture/enthalpy and losses; installed equipment/pressing need actual occupied service and intensity; transport needs limiting mass/volume plus duration/distance; parallel storage needs actual occupied area/volume and time. A convenient overall tonne share or installed rating is not proof. Record alternatives, causal test, uncertainty and sensitivity; do not arbitrarily choose physical versus economic allocation."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "genuine common-process residue only"
    rule: "Only a genuine residual shared flow that cannot be subdivided or assigned by determining physical causality may use contemporaneous market value at the actual common-process gate, quantity and physical/quality condition. Derive gate values transparently by removing later product-specific conditioning/transport/packing from downstream prices; document actual sales/costs and sensitivity. No fixed fraction, catalogue retail price or automatic market-value key applies to every exchange."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_waste
    applies_to: "waste reject sample and outward sales"
    rule: "Ordinary manufacturing rejects, broken boards, samples, captured dust, sludge and their treatment retain the cohort manufacturing/treatment burdens despite off-site handover or sale. T_out is allowed once only for a real distinct cohort/function with a defensible allocation/handover decision and equal receiver inheritance vector; it is not a waste mass deduction or automatic avoided-product credit. All gross physical legs remain full. Internal wet scrap recovery is neither a new purchase nor an extra first-released output."
    source_ids:
      - ilcd-allocation-2010
