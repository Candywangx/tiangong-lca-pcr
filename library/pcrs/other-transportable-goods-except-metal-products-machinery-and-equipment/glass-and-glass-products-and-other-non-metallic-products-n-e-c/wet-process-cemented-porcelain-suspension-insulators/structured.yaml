          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Real unfired mineral feeds and whole purchased glaze/coating preparations; purchased complete metal parts and Portland cement; actual water/utilities and physical assets at receipt |\n| starting_condition_role | Purchased supplies are upstream-linked Product inputs; onsite real transformations from raw body preparation through release are foreground; no purchased finished insulator substitutes for manufacture |\n| product_classification_scope | Single specified assembled ceramic suspension unit; CPC is context and not identity or whole-leaf coverage |\n| recursive_input_rule | Any purchased in-scope intermediate/component is one real supplied Product with a compatible upstream boundary; internal slip/green scrap/water/heat transfers cancel. A finished-unit return keeps original history and is not fresh input manufacture |\n| upstream_dataset_requirement | Link each actual mineral/formulation/component/utility and observed asset service to a compatible upstream provider; disclose gaps. Do not repeat provider internal energy/emissions |\n| disclosure | All reference qualifiers, supplied versus onsite preparation boundaries, thermal/cure sources and states, raw/WIP/FG stocks/history, gross packaging, assets, allocation and service horizons |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | selected manufacture | Include every actual raw preparation, shaping, drying, glaze/sand-band step, firing/refiring/cooling, machining, coating, cement mix, assembly/cure and required body/final tests through unique release; retain all rejects, destructive samples, failed batches, zero-output runs, startup/shutdown, idle, cleanup and rework burdens. | `jrc-ceramic-bref-2007`; `hivolt-porcelain-manufacturing`; `ppc-td-insulators-rev2015` |\n| b_stocks | manufacturing exchanges | For each exchange retain opening/closing raw-material, WIP and unassigned non-WIP-store burden vectors. Manufacturing closing-burden subtraction includes only unreleased WIP/raw/unassigned stores; released FG already belongs to Q, cannot be subtracted, and cannot be added again as another production output. Physical stock and burden inheritance use separate ledgers. Independently measure each raw/WIP/non-WIP pool opening and closing physical quantity as well as its full inherited exchange-burden vector; physical mass is not an allocated burden share. | `jrc-ceramic-bref-2007`; `ilcd-detailed-guidance-2010` |\n| b_services | released cohorts | Retain original manufacturing burden with its first-release cohort. Record actual later warehouse, packing, handling, dispatch, returned-product cleaning, retest, breakage and rework as incremental cohort services with original net-mass Qc and observed H. Retesting or delivery never creates Q. Cancel internal release hand-offs on consolidation and retain gross external flows. Any actual post-release repair/re-cementing requires independently documented governing manufacturer/design permission, continued applicability of this complete-unit boundary, required retests and acceptance or waste disposition. Original assembly/test evidence is not permission to restore a failed insulator. | `jrc-ceramic-bref-2007`; `ppc-td-insulators-rev2015`; `ilcd-detailed-guidance-2010` |\n| b_physical | mass species packaging and assets | Reconcile full actual physical gates before burden allocation: all real solids/liquids/gas species, attached water, raw/WIP/FG changes, incoming/outgoing packages, installed equipment and fluids. Do not multiply physical gross masses or stock changes by economic shares. Internal transfers cancel once while actual losses/reprocessing remain. | `jrc-ceramic-bref-2007`; `ilcd-detailed-guidance-2010` |\n| b_extra | actual unlisted exchanges | Add one physically specific card/protocol/provider decision for every actual unlisted chemical, emission species, repair part, fuel, packaging or outlet; a conditional row is absent only with positive absence evidence. Unknown, measured zero, below detection and not applicable are distinct. Whole supplied preparations and their component assays are never double purchases. | `jrc-ceramic-bref-2007`; `ilcd-detailed-guidance-2010` |\n\n"
