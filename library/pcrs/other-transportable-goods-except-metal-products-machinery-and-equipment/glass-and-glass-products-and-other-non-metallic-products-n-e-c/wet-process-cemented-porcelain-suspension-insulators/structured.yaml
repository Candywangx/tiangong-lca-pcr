  covered_products: "One complete ball-and-socket Portland-cemented wet-process porcelain suspension unit within Section 1"
  excluded_products: "Exclude bare porcelain shells or unfinished clay bodies; whole suspension strings and line hardware; glass and polymer-composite insulators; pin/post/long-rod/hollow-bushing terminals; clevis couplings; bronze clips, zinc sacrificial sleeves or RTV overcoating; electronic alumina/aluminium-nitride substrates and metallised ceramics; tableware, sanitaryware, ornamental ceramics and grinding media as saleable products; dry/isostatic-press or slip-cast body routes; onsite metal casting/forging/galvanizing and onsite Portland-cement manufacture; installation, use and end of life. Actual route departures require an applicability reassessment with complete new exchanges, not an assumed zero. Additional actual inputs, repairs, species and outlets within the declared route must always be added atomically."
  representative_product: "One glazed porcelain shell with a fired bonded sand band and complete specified metal/cement/coating assembly"
  production_route: "Mineral receipt and wet milling → sieving/de-ironing → filter pressing/ageing → vacuum extrusion/turning → drying/glaze/sand band → firing/cooling → actual grinding/body tests → interface coating/grout/assembly/cure → final tests and unique first release → actual cohort packing/storage/dispatch services"
  market_state: "Complete accepted single suspension unit at plant; original-cohort services separately declared through their actually observed horizon"
