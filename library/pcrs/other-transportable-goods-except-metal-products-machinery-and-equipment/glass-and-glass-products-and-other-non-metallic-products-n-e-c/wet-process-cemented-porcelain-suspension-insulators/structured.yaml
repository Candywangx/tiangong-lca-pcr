  how_much: "1 kg net complete unit at unique first quality release after cure and final acceptance; all released closing FG included"
  how_well: "Actual drawing/BOM, material/coupling, dimensions, measured released condition and documented electrical/mechanical acceptance requirements; no default voltage or dielectric strength"
