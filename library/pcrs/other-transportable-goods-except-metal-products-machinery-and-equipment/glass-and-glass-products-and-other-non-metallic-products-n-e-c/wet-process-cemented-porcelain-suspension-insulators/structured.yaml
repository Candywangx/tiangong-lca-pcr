system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "selected manufacture"
      rule: "Include every actual raw preparation, shaping, drying, glaze/sand-band step, firing/refiring/cooling, machining, coating, cement mix, assembly/cure and required body/final tests through unique release; retain all rejects, destructive samples, failed batches, zero-output runs, startup/shutdown, idle, cleanup and rework burdens."
      source_ids:
        - jrc-ceramic-bref-2007
        - hivolt-porcelain-manufacturing
        - ppc-td-insulators-rev2015
    - rule_id: b_stocks
      applies_to: "manufacturing exchanges"
      rule: "For each exchange retain opening/closing raw-material, WIP and unassigned non-WIP-store burden vectors. Manufacturing closing-burden subtraction includes only unreleased WIP/raw/unassigned stores; released FG already belongs to Q, cannot be subtracted, and cannot be added again as another production output. Physical stock and burden inheritance use separate ledgers. Independently measure each raw/WIP/non-WIP pool opening and closing physical quantity as well as its full inherited exchange-burden vector; physical mass is not an allocated burden share."
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - rule_id: b_services
      applies_to: "released cohorts"
      rule: "Retain original manufacturing burden with its first-release cohort. Record actual later warehouse, packing, handling, dispatch, returned-product cleaning, retest, breakage and rework as incremental cohort services with original net-mass Qc and observed H. Retesting or delivery never creates Q. Cancel internal release hand-offs on consolidation and retain gross external flows. Any actual post-release repair/re-cementing requires independently documented governing manufacturer/design permission, continued applicability of this complete-unit boundary, required retests and acceptance or waste disposition. Original assembly/test evidence is not permission to restore a failed insulator."
      source_ids:
        - jrc-ceramic-bref-2007
        - ppc-td-insulators-rev2015
        - ilcd-detailed-guidance-2010
    - rule_id: b_physical
      applies_to: "mass species packaging and assets"
      rule: "Reconcile full actual physical gates before burden allocation: all real solids/liquids/gas species, attached water, raw/WIP/FG changes, incoming/outgoing packages, installed equipment and fluids. Do not multiply physical gross masses or stock changes by economic shares. Internal transfers cancel once while actual losses/reprocessing remain."
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - rule_id: b_extra
      applies_to: "actual unlisted exchanges"
      rule: "Add one physically specific card/protocol/provider decision for every actual unlisted chemical, emission species, repair part, fuel, packaging or outlet; a conditional row is absent only with positive absence evidence. Unknown, measured zero, below detection and not applicable are distinct. Whole supplied preparations and their component assays are never double purchases."
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
