allocation_rules:
  - rule_id: a_subdivide
    applies_to: "multifunctional operations"
    rule: "Use an attributional study situation and identify actual co-functions. First use dedicated collection, actual subdivision or justified virtual subdivision to assign each exchange and observed asset/utility service to the function that determines it. Avoid an arbitrary mass/economic toggle or a universal share."
    source_ids:
      - ilcd-detailed-guidance-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange demonstrate an exchange-specific determining physical causal relationship using measured operating drivers and the correct extensive property. Equal product masses alone do not prove equal firing/turning/test demand; no fitted residual is causal evidence. Preserve allocation sums and uncertainty."
    source_ids:
      - ilcd-detailed-guidance-2010
  - rule_id: a_residual
    applies_to: "non-subdividable residual common process"
    rule: "Only genuinely unresolved residual burdens use a common process gate and contemporaneous market values for actual co-functions in their actual condition at exit; retain price period, quantities, market, sensitivity and justification. No fixed ratio, automatic substitution credit, or co-product status for internal scrap, waste, returned packaging or heat presumed absent."
    source_ids:
      - ilcd-detailed-guidance-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_unit"
      record_type: "unique_release_mass"
      raw_fields: "serial/lot ID; design BOM and coupling; first-release timestamp; acceptance/cure/moisture condition; measured net released mass; sample coverage and uncertainty; unique Q; opening/closing raw WIP FG status"
      collection_method: "Use controlled first-release and test registers and calibrated net weighing of complete same-configuration units after actual cure, excluding separable packaging and external string hardware. Retain tare/calibration and sampling evidence; sum actual release masses once. Piece counts require independently measured net masses of that complete configuration, never secondary-property factors or guessed kg/item."
      unit: "kg; item"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each supplied mineral/formulation/component"
      record_type: "raw_receipt_issue"
      raw_fields: "row and supplier lot; complete supplied preparation; raw mass/volume unit; assay solids free/structural water; state; receipts issues returns; opening/closing raw WIP unassigned stores; inherited per-exchange burden vectors; output/reject links; independently measured opening/closing physical quantity for each raw/WIP/non-WIP pool; gross entry or already stock-adjusted consumption basis and all stock corrections already included"
      collection_method: "Reconcile original scales, stock and actual BOM/recipe issues by stage. Keep full purchased preparations once with component subaccounts; onsite mixing requires every purchased input and actual energy/loss. Actual native grade/route/provider compatibility is assessed independently. Do not divide raw records by Q. Distinguish gross receipts/pool entries from already stock-adjusted issue/consumption records. Preserve which stock corrections each record already contains; do not apply the same raw-stock correction twice."
      unit: "kg; m3"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "each water electricity fuel"
      record_type: "raw_meter"
      raw_fields: "row and stage; provider geography voltage; meter interval and raw start/end; kWh MJ m3 kg or actual rate; gas P T composition independent density and heat value; operating modes; losses; service separation"
      collection_method: "Use matched calibrated submeter/invoice/tank records over representative operations including failed, idle, startup, shutdown, cleaning and rework intervals. Distinguish integrated totals from rates; preserve observed supply conditions and upstream-provider boundaries before actual allocation. No pre-normalized collection."
      unit: "kWh; MJ; m3; kg"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
    - protocol_id: cp_heat
      process_id: "manufacture"
      flow_role: "actual external steam hot-water and returns"
      record_type: "carrier_enthalpy"
      raw_fields: "carrier row; gross mass; supply/return P T steam quality; independent enthalpy; provider water and condensate convention; external returns or sewer loss; integrated heat or actual heat rate; operating interval"
      collection_method: "Measure actual carrier masses independently from heat and retain supply/return thermodynamic evidence. Match heat meters or mass/enthalpy states to the same intervals, with losses and water-stock records. External return is a Product interface only when real; internal recovery cancels. Do not invent a boiler, steam supply, cold return or density."
      unit: "kg; MJ; K; Pa"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "each machine die medium refractory fluid"
      record_type: "physical_stock_and_service"
      raw_fields: "asset ID grade configuration; opening/closing installed and loose stock; old/new replacement parts; fluid and moisture; maintenance deployment throughput/operating time; retirements wear; inherited burden vector; actual service attribution"
      collection_method: "Reconcile actual physical asset additions, retained stocks, maintenance and retirement in disjoint ledgers. Assign only documented observed period service burden by deployment and actual usage; retain inherited vectors and uncertainty, with no fixed lifetime or complete machine charged per kg. Whole hydraulic fluid is measured in m3 with independent density for physical kg."
      unit: "kg; m3; h"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each physical waste"
      record_type: "raw_exit"
      raw_fields: "row consignment; scale net wet/dry state; moisture phase assay; onsite versus offsite treatment; destination; whole versus dismantled unit; retained attached residues; internal recycle and actual losses"
      collection_method: "Measure each actual external waste separately; reconcile source stages and actual treatment boundary, retaining unknown/zero/detection-limit distinctions. A whole assembly or wastewater has composition subaccounts that are not additional gross exits; dismantling/treatment changes the actual gate and requires disjoint new rows."
      unit: "kg"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each gas liquid mineral species"
      record_type: "independent_speciation"
      raw_fields: "species row CAS phase origin destination; raw concentration and basis; dry/wet gas; actual/reference P T O2 humidity; integrated gas/liquid volume or actual rate and time; density and molar evidence; independent mineral reaction extent; carbon/element and water subledgers; limits and uncertainty"
      collection_method: "Collect simultaneous calibrated flow and representative speciated samples with headers/footnotes and actual oxygen/dry-wet corrections. Total NOx/SOx/VOC/COD/TOC/fluorine/particle-size bins are QA indicators, not molecular masses. Independently constrain reaction and water phases; one residual cannot fit two unknowns or prove an absent species."
      unit: "kg; mg/m3; m3; m3/h; h"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "original released cohort and incremental services"
      record_type: "cohort_history"
      raw_fields: "original release/dispatch IDs; original net-mass Qc; observed H; opening/closing FG masses and original burdens; gross G and physical return R; actual current returned mass water condition; incremental cleaning/retest/rework inputs and waste; unobserved future; repair/re-cementing permission and design scope; actual new and removed old parts, cement/coating, retained free/bound water and losses; required post-work retests and acceptance/disposition"
      collection_method: "Trace physical inventory by original cohort, keeping original manufacturing burden and Qc unchanged even for old FG. Measure actual incremental service meters and changes in moisture/parts/mass; no assumption that return mass equals original dispatch or that retest/dispatch creates new Q. Do not reverse original first-release manufacture as net delivery. Before attributing actual repair, verify its governing permission and post-work acceptance/disposition. Measure each new/old component and actual material/water phase separately without assuming restorability, original return mass or new first-release Q."
      unit: "kg; MJ; item"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
    - protocol_id: cp_pack
      process_id: "packaging"
      flow_role: "each package physical pool"
      record_type: "gross_pool_stock"
      raw_fields: "row material article ownership; opening/closing empty WIP-attached FG-attached reusable stock; new purchases P; attached receipts I; external-return receipts ER; gross outward S; external returns EO; waste W; internal reuse repair; net tare moisture; original cohort Qc H; independently measured dry matter and water uptake/release with phase, source and destination, excluding moisture already included in existing whole-article/repair terms"
      collection_method: "Weigh/count each real material/configuration pool at the same physical gate and reconcile all ownership and attachment states. Record all gross receipts and exits including repeated dispatch, actual repair pieces and whole assemblies without overlap; internal reuse is neither purchase nor product Q. Collect raw physical units before service attribution. Independently measure actual water entering/leaving each pool, retained moisture and dry matter; match each to its specific supply, humidity, evaporation or waste interface without adding it again beside an already wet whole article."
      unit: "kg"
      frequency: "Each receipt/batch/operation interval and stock close"
      temporal_coverage: "Declared representative period plus inherited stocks and observed service H"
      site_scope: "Actual site and traceable design/lot/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Original calibrated records; independent assay/speciation; complete stock and test links"
  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw readings into each row native extensive unit before stocks and allocation. Sum already integrated mass/volume/energy once; integrate only actual rates over their measured intervals. Convert kWh to MJ by 3.6. For volume-to-mass use independently measured substance-specific density at the recorded state; never use a water default or native secondary-property coefficient as density."
      inputs:
        - cp_utility
        - cp_heat
        - cp_species
        - cp_asset
        - raw_readings
        - actual_state
      output: "converted_raw_totals"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - id: first_release
      applies_to: "finished_unit"
      rule: "Q = sum of actual net masses of uniquely first-quality-released complete units of the declared configuration and cohort. Count each release once including closing released FG; reject/unreleased WIP does not add Q. Actual count-to-mass uses calibrated same-configuration complete-unit measurements and sampling evidence, not assumed kg/item."
      inputs:
        - cp_release
        - unique_release_IDs
        - actual_net_masses
      output: "Q"
      source_ids:
        - jrc-ceramic-bref-2007
        - hivolt-porcelain-manufacturing
        - ppc-td-insulators-rev2015
    - id: manufacturing_vector
      applies_to: "manufacture"
      rule: "For each exchange build A_j from actual converted loads plus opening raw/WIP/unassigned-store inherited burden minus closing unreleased raw/WIP/unassigned-store burden, after documented dedicated collection/subdivision and exchange-specific allocation. Retain failures and zero-output/idle/cleanup/rework; released closing FG is not a subtraction. Raw records and historical vectors remain unnormalized. The converted current-load basis entering this stock reconciliation is gross external receipt/pool-entry burden before the stated stock corrections. If a record already measures stock-adjusted consumption, retain that basis and its included corrections, do not add/subtract the same raw-stock correction again, and reconcile only remaining unincluded WIP/non-WIP or other pool vectors. Physical pool quantities remain independent of every exchange-burden vector."
      inputs:
        - converted_raw_totals
        - opening_vectors
        - closing_unreleased_vectors
        - cp_material
        - cp_asset
        - allocation_evidence
      output: "A_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - id: cohort_service_vector
      applies_to: "service"
      rule: "Keep the original cohort manufacturing vector and original first-release net mass Qc. For observed H build Aservice_j from actual incremental cohort services. Reconcile opening/closing FG, releases, gross dispatch G, physical returns R, actual added/removed water/parts, destruction and other exits using real current masses and original IDs; G and R do not define a replacement net-delivery Q or automatic production reversal. Actual services already performed for held closing FG retain their real burden at original Qc/H; holding the unit does not justify a service deduction. For each FG or packaging physical movement card, Aservice_j denotes the full actual measured gross quantity of that specific leg, distinct from a burden vector. Do not add inherited manufacturing/purchase burdens to that physical amount, stock-correct the leg again or multiply it by an economic burden share. These are ledger-only physical results, not new supplier purchases or coproduct credits. Independently retain the matched original-delivery record; a return with changed parts or moisture is not an assumed reversal of the original dispatch quantity."
      inputs:
        - cp_service
        - cp_pack
        - Qc
        - H
        - actual_FG_history
      output: "Aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - ppc-td-insulators-rev2015
        - ilcd-detailed-guidance-2010
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Independently reconcile complete physical mass and relevant elements for manufacture, FG service and consolidation, including all real gas species and water phases. Keep free water, structural/dehydroxylation water, chemically bound cement hydration, reaction water and inlet humidity as evidenced disjoint subledgers. Measure at least the independent constraints required for each unknown; never solve two species or reaction extents with one residual. Burden allocation does not alter physical balance."
      inputs:
        - cp_material
        - cp_waste
        - cp_species
        - cp_service
        - cp_asset
        - independent_reaction_evidence
      output: "physical_residuals_and_uncertainty"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - id: heat_carrier
      applies_to: "steam; hotwater; condensate_return; hotwater_return"
      rule: "For an actual purchased carrier measure gross mass and actual supply/return enthalpy independently; heat transfer equals supply enthalpy flow less real returned/exported carrier enthalpy and documented losses within the stated boundary. Keep measured integrated heat as a total; integrate a genuine heat rate only once. Preserve provider water/return convention and one upstream burden, with actual separate external return interfaces."
      inputs:
        - cp_heat
        - carrier_mass
        - supply_return_enthalpy
        - water_convention
      output: "carrier_heat_and_mass_ledgers"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - id: package_stock
      applies_to: "packaging"
      rule: "For each package material/configuration pool: opening empty + opening WIP-attached + opening FG-attached + opening reusable + P + I + ER + actual repair additions + separately measured water uptake = closing empty + closing WIP-attached + closing FG-attached + closing reusable + S + EO + W + separately measured repair removals + separately measured water release. These water terms contain only independently measured transfers not already included in another wet-article, repair, receipt or exit flow term. Opening/closing stocks retain their full physical wet mass: water retained in closing stock does not remove its corresponding real measured inflow. Preserve separate material/species/phase ledgers and never solve unknown water by forcing the stock residual. S is all gross physical dispatch including repeats. Internal reuse cancels. Reconcile actual moisture/condition changes separately so they do not masquerade as purchases, waste or product mass; do not price-scale this equation."
      inputs:
        - cp_pack
        - physical_pool_records
        - repair_records
      output: "package_stock_residuals"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - id: asset_service
      applies_to: "manufacture"
      rule: "Reconcile physical acquisitions, installed stocks, replacement, wear, fluid, repair and retirement without overlapping whole-machine and component masses. Separately carry inherited asset burden vectors and assign documented observed service burden using actual deployment/usage. Do not charge gross acquired or retired mass as current service, assume fixed life, or lose unassigned burden stored for future service."
      inputs:
        - cp_asset
        - inherited_asset_vectors
        - actual_deployment_usage
      output: "asset_physical_and_service_ledgers"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - id: final_exchange
      applies_to: "all inventory rows"
      rule: "The sole unit-result operation is a_j = A_j / Q for manufacturing and aservice_j = Aservice_j / Qc for the separately labelled original-cohort service horizon H. Cross-cut packaging uses the denominator of its actual manufacture or original-cohort service destination, preserving the complete gross physical ledger separately. Apply once after raw conversion, stock inheritance and justified attribution. Cards and protocol aggregation refer to this same result and never divide again. Q or Qc equal to zero retains real burdens and produces no unit result. The finished reference output is 1 kg. Consolidation cancels internal first-release transfers and keeps matching original-cohort services. For ledger-only FG/package movement cards normalize the full gross physical numerator defined in cohort_service_vector after its actual native-unit conversion, without burden-vector addition, a second stock correction or economic scaling. Report these physical legs separately from attributed manufacturing/service burdens. Their quotient creates neither another provider purchase nor a credit."
      inputs:
        - A_j
        - Q
        - Aservice_j
        - Qc
        - cp_release
        - cp_service
      output: "a_j; aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-detailed-guidance-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all references and providers"
      requirement: "Retain actual physical/BOM/grade/route/state/media compatibility, full native restrictions and official Chinese names. An auxiliary UUID gap stays specific; no family, CAS or particle conflict is waived by classification or a schema pass."
      evidence: "native originals supplier evidence full BOM"
    - id: dq_measurement
      applies_to: "all amounts stocks history"
      requirement: "Retain calibration, temporal representativeness, real operating modes, same-configuration weighing, raw units, stock/cohort inheritance, gas/liquid states and uncertainty; distinguish actual observations from planned collection."
      evidence: "original meters scales stock and test records"
    - id: dq_chemistry
      applies_to: "reactions emissions water"
      requirement: "Retain independent mineral/element/species/reaction and water-phase evidence; equivalent totals and COD/VOC indicators do not identify chemicals. Disclose any unresolved balance rather than fit away missing streams."
      evidence: "laboratory and independent physical checks"
    - id: dq_evidence
      applies_to: "sources and intended use"
      requirement: "Primary process/component sources constrain only their documented route/state; historical examples and manufacturer ratings are not this site data. ILCD supports the declared allocation hierarchy; no industrial catalogue establishes LCA allocation or publication approval."
      evidence: "full primary context explicit use limits"
validation_rules:
  - rule_id: v_scope
    applies_to: "product and applicability"
    rule: "Verify one complete specified single suspension unit and the whole wet-manufacture route, BOM and tests. Reject bare-shell/whole-string substitution and incompatible glass/polymer/electronic-oxide or forming/assembly states."
    source_ids:
      - jrc-ceramic-bref-2007
      - hivolt-porcelain-manufacturing
      - ppc-td-insulators-rev2015
  - rule_id: v_identity
    applies_to: "all consuming cards"
    rule: "Verify every adopted identity against its complete native restrictions and exact property/reference-unit chain; all source roles and source_ids remain visible. Resolve actual supplier compatibility or disclose the specific gap before dataset binding. A missing core product identity prevents usable methodology; ordinary auxiliary/provider quantities do not establish a scientific hold by themselves."
    source_ids:
      - jrc-ceramic-bref-2007
      - ilcd-detailed-guidance-2010
  - rule_id: v_q
    applies_to: "quantity history and normalization"
    rule: "Verify Q and original Qc from unique first-release net masses with complete FG/raw/WIP/store history; no subtraction of released closing FG, duplicate output, net-delivery reversal, assumed kg/item or repeated quotient. Q=0 retains loads without a unit result."
    source_ids:
      - jrc-ceramic-bref-2007
      - ilcd-detailed-guidance-2010
  - rule_id: v_physical
    applies_to: "manufacture FG service consolidation"
    rule: "Check complete physical mass/relevant elements, independent actual species/water/enthalpy evidence, gross packaging pools, all installed/loose assets and fluids, and disjoint whole/dismantled exits. A single residual is not two measurements. No economic share may shrink gross physical flows."
    source_ids:
      - jrc-ceramic-bref-2007
      - ilcd-detailed-guidance-2010
  - rule_id: v_complete
    applies_to: "finite checks and evidence limits"
    rule: "Require every applicable atomic exchange, correct extensive unit, raw protocol, one final calculation and complete source/native context in both renderings and projection. Unmeasured is not zero; unresolved applicability or unsupported measurements remain review findings. Schema/projection/finite measurement checks confer no science/translation approval, accepted CPC mapping or publication."
    source_ids:
      - jrc-ceramic-bref-2007
      - hivolt-porcelain-manufacturing
      - ppc-td-insulators-rev2015
      - ilcd-detailed-guidance-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Compatible configuration-specific supply of complete assembled suspension units with separately labelled observed original-cohort services"
  allowed_use: "Declared raw-mineral-to-first-release manufacture and actual observed services, with explicit upstream providers and measured physical/history ledgers"
  excluded_use: "Bare shell or whole string substitution; unsupported equal-function comparison, lifetime/certification, installation/use/end-of-life or automatic credit and whole-CPC-coverage claims"
  required_metadata: "All reference qualifiers and complete BOM; original release/cohort Q Qc H; native provider identities/restrictions; raw/WIP/FG inherited burden vectors; full gross package and asset physical/service records; allocation evidence"
  required_quality_disclosure: "Pending science/translation review, actual versus planned measurements, evidence limits, unresolved auxiliary/provider/species/stock/balance gaps and uncertainty, service future unobserved"
  update_trigger: "Changed terminal BOM/coupling/coating, body/forming/firing/cure route, provider/native restrictions, quality-release gate, actual stock/species/allocation evidence or service boundary"
data_sources:
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission JRC, Ceramic Manufacturing Industry BREF, August 2007, §§2.3.8 and 3.3.8; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "Complete electrical-porcelain mineral/wet-extrusion/drying/glaze/firing/machining/assembly context; technical-oxide and forming-route counterexamples; waste/water/air monitoring. Historical recipe/energy/concentration examples are not defaults or molecular-speciation proof."
  - id: "hivolt-porcelain-manufacturing"
    type: "literature"
    reference: "Dalian Hivolt Power System, Manufacturing Process of Porcelain Insulator, undated, p1/1; https://www.hivoltinsulators.com/userfiles/portal/20171013/a9b767ab8f163217146c89560ef78948.pdf"
    used_for: "Wet milling, de-ironing, filter pressing/ageing, vacuum pugging, staged drying/turning/glazing/firing, grinding, cemented hardware assembly and tests/packing. Illustrated post-shaped products are route evidence, not suspension-unit dimensions or current plant data."
  - id: "ppc-td-insulators-rev2015"
    type: "literature"
    reference: "PPC Insulators, T&D Insulators Catalogue, printed Revision 9/2015 (PDF metadata title 2012), pp4–12 and p26 plus adjacent alternative products; https://ppcinsulators.com/wp-content/uploads/2017/07/Catalogue_TD_Insulators.pdf"
    used_for: "Complete suspension-unit terminal; malleable-iron cap, forged galvanized ball bolt, stainless cotter, Portland cement, bituminous coating, bonded fired sand band and tests. Clevis, pin/post, HDPE and optional zinc-sleeve alternatives delimit this method; no manufacturer rating, grade, quantity or lifetime is generalized."
  - id: "ilcd-detailed-guidance-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook—General guide for LCA—Detailed guidance, first edition March 2010, §§7.4 and 7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional boundary/data consistency and multifunctionality hierarchy: subdivision/virtual subdivision, exchange-specific determining physical causality, then actual residual common-gate market values. General methodology, not porcelain chemistry, industrial recipe or a prescribed allocation fraction."
