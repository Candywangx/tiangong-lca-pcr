  semantic_boundary_decision: Full 1262-material ref36 catalog and relevant canonical scopes plus frozen glass-suspension, vitreous-china-washbasin and later pressed-sintered alumina chemical-crucible-body intakes reviewed. The crucible method is a pressed oxide-ceramic bare chemical vessel and expressly excludes electrical assemblies; its core identity hold is not coverage. Non-glass/non-ceramic insulators explicitly exclude this material; ferrite magnets, PA66 fittings, decal sheets and raw mineral feedstocks have different terminal functions/routes. No compatible existing complete wet-porcelain suspension-unit method found. Reusable utility, data-quality and allocation principles retained.
  core_reference_identity: Actual proper query member and exact public100 native manufactured-finished ceramic electrical-insulator Product family confirmed. Mass reference matches complete single Portland-cemented ball-and-socket porcelain suspension terminal supported by primary manufacturer catalogue. Family is narrowed by complete BOM and route qualifiers, not CPC identity. No bare-shell or whole-string binding.
  independent_review_repair: Physical raw/WIP/non-WIP quantities and full exchange histories are separate, with gross entry versus already-stock-adjusted consumption explicit to avoid repeated stock correction. Post-release repair requires governing permission, actual new/old parts and water-phase records, retests and acceptance/disposition. Packaging repair and moisture terms remain disjoint from wet whole articles and inherited supplier burdens.
