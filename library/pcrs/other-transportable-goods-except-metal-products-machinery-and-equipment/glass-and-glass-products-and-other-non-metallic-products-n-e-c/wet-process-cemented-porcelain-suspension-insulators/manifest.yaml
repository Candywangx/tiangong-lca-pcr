    - Every unbound row below keeps one concrete physical/chemical identity. Actual provider and native compatibility require final dataset verification; auxiliary UUID or ordinary quantity gaps alone do not turn confirmed complete-core methodology into a core hold.
    - CN low-voltage electricity, as-received natural soft clay, electrical-porcelain quartz/feldspar, whole hydraulic fluid, galvanized forged-steel part and actual PE film/wooden pallet bindings are conditional on each card full restrictions and actual supplier evidence.
