  ordinary_gaps:
  - Actual future factory recipe, supplier/grade/geography/interface, activity quantities, independent species/phase
    observations and product acceptance tests remain necessary; no fabricated site dataset or approval.
  - Specific auxiliary, packaging/waste and unresolved immediate-air identities remain atomic named rows and require
    actual compatible identity before a final dataset; no forced family or wrong-medium binding.
  - Terminal Product identity is verified as manufactured finished table/kitchen glassware with Mass/kg; it fixes
    no bowl composition, day-tank/press/anneal route, geography, food-contact or thermal performance. Narrow declared
    route and actual product evidence remain required.
  - Conditional95% natural-alkali soda ash, CN below1kV user grid, normal-volume separated industrial oxygen, C/E/F
    fibre>=80% recycled-content corrugated board and30t-diesel road service must match actual providers or be replaced;
    none is a universal factory default.
  true_methodology_holds: []
  core_reference_identity: Verified public finished-manufactured glassware Product flow with exact reference Mass
    property to exact Units-of-mass/kg chain; broad identity is qualified to the narrow bowl terminal, not adopted
    by classification/name alone.
  native_identity_notes:
  - Soda-ash carboxylic-acid, PE-film luggage and wooden-pallet electricity taxonomy defects are separately disclosed
    from consistent physical identities. Hard route/CAS/media conflicts are not waived.
  - Rejected unrelated hydropower/biomass electricity, optical-assembly cardboard, fragile folding box, fixed-fibre-ratio
    shipping-box proxy, PAO/wax-solvent lubricant, wafer-destination waste, viscose CTUe water and manganese-slag
    wastewater identities.
  - Canonical molecular names, CAS, type and full native compartments admit ordinary NO, NO2, fossil
    CH4/CO2, H2O vapour, O2 and Ar. Conflicting HNO/N2O4, carbon-black/graphite, isotope/ion/liquid
    synonyms are disclosed defects, not alternative selected identities. Actual molecular speciation,
    phase and receiving medium remain mandatory; no equilibrium, isotope or factor inference.
  - Every adopted property was inspected, including secondary oxygen/water/hydraulic-volume factors. Their values
    are not independent operating densities. Freight native unit is kg*km, not tkm.
  - Actual bounded queries and exact public reads confirm immediate unspecified outdoor-air O2/SO2 and
    ordinary species, plus ambient O2/Ar resources. Humidity/ambient-CO2 resources, mineral-CO2
    convention and other remaining auxiliary identities stay explicitly unbound; wrong media, long-term,
    correction and origin-specific candidates are not substitutes.
  - All adopted flow displays in Chinese use official direct-record zh basenames; every adopted native restriction
    is repeated in each affected full consumable description.
  measurement_basis: Unique first-release Q is calibrated net bare bowl kg after tests. Newly released closing FG
    already belongs to Q and has no manufacturing burden deduction. Convert raw first, reconcile each unassigned
    raw/WIP/non-WIP vector and actual attribution, then normalize A_j/Q once. Original-cohort service increments
    and ledger-only full gross physical movements retain original Q/horizon; no net-delivery switch.
  production_scope: Unpublished candidate; scientific review pending and Chinese aligned only. No mapping acceptance,
    coverage promotion or publication is performed.
