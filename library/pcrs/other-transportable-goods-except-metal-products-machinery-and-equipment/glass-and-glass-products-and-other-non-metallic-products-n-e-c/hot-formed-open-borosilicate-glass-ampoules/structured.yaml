              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_packages
              source_ids:
                - ilcd-attributional-2010
            ranges: []
allocation_rules:
  - rule_id: a_context
    applies_to: "system"
    rule: "Only an attributional goal that justifies allocation rather than substitution. Independently assign dedicated/exclusive operations/inputs/services first, then actual/virtual subdivision from process understanding. Industrial documents prescribe no LCA allocation."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "all inventory rows"
    rule: "For genuine shared remainder establish exchange-specific determining physical causality: measured burner/oven thermal duty, drive load-time or storage space-time as applicable. Mass/count correlation alone insufficient; different exchanges may have different causes. No free physical/economic choice, fixed ratios or saleable-mass blanket share."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "common process"
    rule: "Only irreducible common-process remainder lacking defensible determining physical causality may use contemporaneous market value at same process exit and actual condition/quality/quantity. Remove subsequent specific transport/conditioning/packing from gate value. Allocated vectors sum to unallocated inventory. Rejects/internal cullet/rework/package reuse give no automatic co-product or avoided-production credit. External recovery needs real legal/economic/treatment state and consistently justified recycling convention, not blanket zero burden."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_ampoule"
      record_type: "primary meters weighing assays traceable records"
      raw_fields: "cohort_id; release_id; drawing; capacity; scale_raw; independent_tare; bare_mass; count; M; moisture; tests; rejected; destroyed; opening_FG; closing_FG"
      collection_method: "Calibrated matched-configuration net weighing and unique first passing required-test release register. Measure tare separately and actual count-to-mass M if used, with sample/configuration scope and uncertainty. Collect undivided unique accepted kg to Q_c; retain rejects/destruction and history. Inventory aggregation reads normalize_once stored per reference flow result only."
      unit: "kg; item subaccount"
      frequency: "each event/matched meter interval/opening-closing"
      temporal_coverage: "all productive/failed/nonproductive periods and carryover; services through H"
      site_scope: "actual operation/provider/configuration/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "original records/calibration/analysis/release/stock-vector pairing/provider coverage"
    - protocol_id: cp_make
      process_id: "manufacture"
      flow_role: "one atomic exchange or asset"
      record_type: "primary meters weighing assays traceable records"
      raw_fields: "row_id; cohort_id; timestamp; original_amount; original_unit; true_rate; cumulative_volume; duration; temperature; pressure; dry_wet; composition; phase; independent_density; opening_stock; closing_stock; inherited_vector; allocation_driver; evidence_ref; asset_id; configuration; installed_fluid; new_part; removed_part; load_time"
      collection_method: "Original meters/invoices/assays with disjoint calibrated stock and asset/part/fluid records; identify whole supplied formulation and units. Collect undivided raw quantity and every inherited vector component, convert units/state and genuinely attribute before normalize_once. Physical asset stock differs from service burden. Aggregation only reads its stored per reference flow result."
      unit: "row-native kg; MJ; m3; kg*km; item"
      frequency: "each event/matched meter interval/opening-closing"
      temporal_coverage: "all productive/failed/nonproductive periods and carryover; services through H"
      site_scope: "actual operation/provider/configuration/cohort"
      aggregation_rule: "per reference flow"
