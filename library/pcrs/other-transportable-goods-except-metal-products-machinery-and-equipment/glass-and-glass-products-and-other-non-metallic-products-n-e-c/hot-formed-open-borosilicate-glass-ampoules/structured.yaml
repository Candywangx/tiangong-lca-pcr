normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:ab0057550f1b2539a874294e16c5e84b3cecc5821edbc1dfc1937398ad31ca2a"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8608"
      family: "system_boundary"
      span:
        start:
          offset: 8608
          line: 65
          column: 1
        end:
          offset: 16792
          line: 90
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole fully burdened unworked clear Type I pharmaceutical tubes and real supply-state auxiliaries/utilities/assets |\n| starting_condition_role | Upstream supplied state followed by complete foreground ampoule manufacture |\n| product_classification_scope | CPC3.0:37195 narrow tube-converted open ampoule subset |\n| recursive_input_rule | Finished/returned old ampoules carry full history as service/custody input, not new manufacture |\n| upstream_dataset_requirement | Compatible tube/material/utility/package/asset/transport/treatment providers, no duplicate included operations |\n| disclosure | clear Type I pharmaceutical tube chemistry and supplier grade; unworked tube geometry and inherited provider boundary; open Form B drawing and capacity; mechanical score-break and unprinted uncoated state; actual gas composition burner and oxygen-air configuration; electric annealing profile and cooling topology; chemical dimensional cosmetic residual-stress breakforce acceptance; unique first-release event and cohort; calibrated bare net mass moisture and tare method; real species phases compartments and utility thermal state; water-energy supplier convention; electricity voltage geography and provider; package material ownership and stock states; asset configuration service basis and inherited histories; site period and original-cohort service closing H |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_start | system | Start from whole fully burdened unworked clear Type I pharmaceutical tube with compatible batch/melt/draw/anneal provider. Include receiving damage/loading, first-bottom/body/neck/stem forming, separation/fire finish/score-break, cooling/electric annealing, inspections/tests and first release, with all real auxiliary/utility/package/asset/transport/treatment providers. Danner tube production alone or finished-ampoule repacking is insufficient. | `schott-core-2026`; `stevanato-ampoule-line`; `ocmi-fa36s` |\n| b_operations | all inventory rows | Retain all failed/zero-output attempts, ends, startup/shutdown/warm-up/idle, purge/cleanup, test destruction, rework and abatement. Every actual unlisted fuel/formulation/cleaner/reagent/filter/refrigerant/part/package/waste/species needs a specific atomic card before completion; never zero/other bundling or omission for missing UUID. Whole supplied formulations/articles cross once; assay, active chemical and carried water are subaccounts. | `stevanato-ampoule-line`; `ocmi-fa36s`; `schott-core-2026` |\n| b_q | finished_ampoule | Q_c is calibrated bare net kg uniquely first passing all required release tests in cohort c. Rejects/destroyed samples excluded but their loads retained. Closing already first-released FG is already Q, neither WIP subtraction nor another production output. Shipment/reinspection/old-return re-release is no new Q. Q_c=0 retains all loads and produces no unit value. | `schott-core-2026`; `schott-core-page` |\n| b_vectors | all inventory rows | Manufacturing A_i_c = Bopen_i_c + E_i_c - Bclose_i_c - X_i_c after conversion and genuine attribution. Bopen/Bclose contain only disjoint raw/WIP/unassigned non-WIP utility/installed-asset stores with complete per-exchange historical vectors. X is separately traced external/co-output/other-cohort exit, not already corrected consumption or released closing FG. Track composition/water/state and cancel paired internal physical/vector transfers at consolidation; no second stock correction. A physical export or sale alone never establishes a burden transfer. X_i_c may subtract only an independently traced assignment to a distinct real cohort/function under the justified allocation or burden-handover decision, once; ordinary manufacturing rejects, breakage, samples, waste or their treatment retain the caused manufacture/treatment burden in the original cohort. Do not remove their inherited vector merely because material leaves the gate. Explicit physical purchase/receipt, custody, dispatch, return and waste-movement cards retain the full converted gross leg with separately identified upstream/consumption vectors, never a burden-share-scaled mass. | `ilcd-attributional-2010` |\n| b_services | services | After Q retain actual packing/storage/handling/dispatch/returns/rework increments S_i_c(H) on original production cohort Q_c and observed horizon H. Opening/closing FG carry complete production/prior-service vectors and original release/delivery ids. Original reversal D_rev links original actual delivery and independent mass/state change, never simply returned mass R. Preserve real rework water/material/energy additions/removals. Manufacture carried once; combined gate cancels internal Q. Net-delivery normalization is outside scope and requires complete G/R/D_rev bridge before any scope change. Any actual post-release work must have manufacturer/procedure or governing-specification permission within this empty open nonsterile ampoule scope, defined post-work tests and recorded acceptance/disposition. A broken/failed ampoule is not restored by a return ledger; reject/waste remains unless eligibility is independently demonstrated. Retain actual separately measured new/removed material, water and phase transfers, and repair-held custody as FG substates OR disjoint repair-WIP once. Such work creates no new first-release Q and cannot introduce filling, sterilization, closed forms or another glass article without renewed applicability. | `ilcd-attributional-2010`; `schott-core-2026` |\n| b_physical | all inventory rows | Close gross mass and relevant Si/B/Al/Na/K/C/H/O/N/S/metal elements independently at manufacturing/service/combined gates. For each species/phase opening + external ingress = closing + external egress + independently evidenced signed chemical conversion. Glass softening is not carbonate-batch decomposition; no invented melt reactions/structural or reaction water. Separate free/carrier/ambient/condensed/retained/true reaction water. Gross fuel/air/oxygen/exhaust species independent of allocated LCI; no aggregate plus sub-species duplication. One residual cannot fit two unknowns; total B/C, VOC, COD or PM size index is not chemical mass/species. | `ocmi-fa36s`; `stevanato-ampoule-line`; `ilcd-attributional-2010` |\n| b_packages | services | For EACH component: opening empty + opening WIP-attached + opening FG-attached + opening reusable + new purchase + supplier-contained ingress + external return received = closing empty + closing WIP-attached + closing FG-attached + closing reusable + leaving with gross physical shipment + separate external return + waste, with independently measured water and true new/removed repair terms. States disjoint; internal reuse cancels, not repurchase, ampoule Q or automatic co-product. Gross physical mass is not economically scaled; upstream-included flags prevent double burdens. | `schott-core-page`; `schott-core-2026`; `ilcd-attributional-2010` |\n| b_assets | manufacture; utilities | Separate machine/kiln/chuck/wheel/refractory/filter and charged-fluid opening/new/repair/transfer/closing/retirement physical stocks from period use of their inherited service vectors. Use actual configuration/load/time and evidenced attribution, no fixed life or full machine per kg. New/removed parts, water/oil and true treatment remain atomic. Do not duplicate components already in whole-equipment provider. | `ocmi-fa36s`; `stevanato-ampoule-line`; `ilcd-attributional-2010` |\n| b_utilities | utilities | Actual topology/supplier boundary required. Fuel/steam carrierMass and thermal MJ are distinct accounts of one service, not double purchases. External condensate/heat-exchange returns are Product outlets at measured composition/temperature/pressure/enthalpy with supplier water-energy convention, distinct from waste purge/aerosols. No fictitious steam/boiler, cloned return, equal-mass default or automatic heat credit. Recirculation cancels; actual coolant/refrigerant/cleaner/abatement chemicals each get whole-supply card and true outlet. | `stevanato-ampoule-line`; `ocmi-fa36s` |\n\n"
