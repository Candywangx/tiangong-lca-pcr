    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "one actual species"
      record_type: "primary meters weighing assays traceable records"
      raw_fields: "row_id; cohort_id; timestamp; original_amount; original_unit; true_rate; cumulative_volume; duration; temperature; pressure; dry_wet; composition; phase; independent_density; opening_stock; closing_stock; inherited_vector; allocation_driver; evidence_ref; inlet_background; outlet_compartment; concentration; analytical_species; particle_size; captured_mass; fuel_assay; independent_element_balance"
      collection_method: "Matched actual inlet/outlet sampling, cumulative volume or integrated true rate, same-state concentration and independent density/species/element evidence. Gross ingress/egress separate from net LCI. Independently establish reaction/free/phase water, never residual-fit two unknowns. Raw numerators remain undivided before normalize_once; aggregation reads stored per reference flow result."
      unit: "kg with original gas/analytical units"
      frequency: "each event/matched meter interval/opening-closing"
      temporal_coverage: "all productive/failed/nonproductive periods and carryover; services through H"
      site_scope: "actual operation/provider/configuration/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "original records/calibration/analysis/release/stock-vector pairing/provider coverage"
    - protocol_id: cp_utilities
      process_id: "utilities"
      flow_role: "one actual thermal or liquid utility"
      record_type: "primary meters weighing assays traceable records"
      raw_fields: "row_id; cohort_id; timestamp; original_amount; original_unit; true_rate; cumulative_volume; duration; temperature; pressure; dry_wet; composition; phase; independent_density; opening_stock; closing_stock; inherited_vector; allocation_driver; evidence_ref; carrierMass; inlet_enthalpy; outlet_enthalpy; supplier_water_energy_convention; makeup; purge; drift; condensate_return"
      collection_method: "Original actual topology/meters with paired inlet/outlet mass/state/enthalpy and charged-fluid stocks/returns/losses. No invented steam circuit or secondary-factor density. Collect undivided raw numerators and reconcile provider coverage before normalize_once; aggregation reads stored per reference flow result only."
      unit: "row-native MJ; kg; m3"
      frequency: "each event/matched meter interval/opening-closing"
      temporal_coverage: "all productive/failed/nonproductive periods and carryover; services through H"
      site_scope: "actual operation/provider/configuration/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "original records/calibration/analysis/release/stock-vector pairing/provider coverage"
    - protocol_id: cp_services
      process_id: "services"
      flow_role: "original-cohort FG and incremental service"
      record_type: "primary meters weighing assays traceable records"
      raw_fields: "row_id; cohort_id; timestamp; original_amount; original_unit; true_rate; cumulative_volume; duration; temperature; pressure; dry_wet; composition; phase; independent_density; opening_stock; closing_stock; inherited_vector; allocation_driver; evidence_ref; original_release_id; original_delivery_id; G; R; D_rev; H; rework_new_water; additions; removals; actual_permission; postwork_test_scope; acceptance_disposition; repair_WIP_or_FG_state; actual_added_removed_parts_water_phase"
      collection_method: "Trace original release/delivery and full FG manufacturing/prior-service vectors; measure gross shipment/return and independent original reversal with actual material/water/energy rework changes. Collect undivided S_i_c(H) and opening/closing histories on original Q_c, not unrelated current Q. Aggregation reads normalize_once original-cohort per reference flow result only. Any actual post-release work must have manufacturer/procedure or governing-specification permission within this empty open nonsterile ampoule scope, defined post-work tests and recorded acceptance/disposition. A broken/failed ampoule is not restored by a return ledger; reject/waste remains unless eligibility is independently demonstrated. Retain actual separately measured new/removed material, water and phase transfers, and repair-held custody as FG substates OR disjoint repair-WIP once. Such work creates no new first-release Q and cannot introduce filling, sterilization, closed forms or another glass article without renewed applicability."
      unit: "row-native kg; MJ"
      frequency: "each event/matched meter interval/opening-closing"
      temporal_coverage: "all productive/failed/nonproductive periods and carryover; services through H"
      site_scope: "actual operation/provider/configuration/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "original records/calibration/analysis/release/stock-vector pairing/provider coverage"
    - protocol_id: cp_packages
      process_id: "services"
      flow_role: "one component one direction"
      record_type: "primary meters weighing assays traceable records"
      raw_fields: "row_id; cohort_id; timestamp; original_amount; original_unit; true_rate; cumulative_volume; duration; temperature; pressure; dry_wet; composition; phase; independent_density; opening_stock; closing_stock; inherited_vector; allocation_driver; evidence_ref; owner; opening_empty; opening_WIP; opening_FG; opening_reusable; new_purchase; inbound_contained; external_return_received; closing_empty; closing_WIP; closing_FG; closing_reusable; gross_shipped; external_return_out; waste; dry_solid; water; repair_new; repair_removed"
      collection_method: "Weigh whole component/direction at matched composition/moisture, count/tare independently when used; mutually exclusive custody stocks. Close b_packages before burden attribution. Preserve full gross physical movement independent of economic/service shares; raw numerators undivided. Aggregation reads normalize_once stored per reference flow result, never sums every direction as purchases."
      unit: "kg with count/dry-solid/water subaccounts"
      frequency: "each event/matched meter interval/opening-closing"
      temporal_coverage: "all productive/failed/nonproductive periods and carryover; services through H"
      site_scope: "actual operation/provider/configuration/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "original records/calibration/analysis/release/stock-vector pairing/provider coverage"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Integrate only true rates; cumulative amounts directly. Convert source units/state to row extensive quantity using independent evidence. Mass = cumulative volume times independently measured same-substance/state density; thermal energy uses real calorific value or inlet/outlet enthalpy while carrierMass stays separate; kWh times3.6 gives MJ, kg times km gives freight workload. No Q division."
      inputs:
        - original_amount
        - original_unit
        - true_rate
        - duration
        - cumulative_volume
        - independent_density
        - state
        - calorific_value
        - enthalpy
      output: "converted_raw"
      source_ids:
        - ocmi-fa36s
        - ilcd-attributional-2010
    - id: stock_and_attribute
      applies_to: "all inventory rows"
      rule: "Close b_vectors/b_physical/b_assets/b_packages by physical quantity and every inherited exchange component, then genuine attribution under section7. A_i_c = Bopen_i_c + E_i_c - Bclose_i_c - X_i_c; only disjoint raw/WIP/unassigned non-WIP stores, not closing FG already in Q or another correction of net consumption. S_i_c(H) retains actual original-cohort opening/closing/incremental services. Gross custody mass is not allocation-scaled. Apply the qualified X_i_c definition of b_vectors; ordinary waste/export or sale is no automatic burden deduction or credit. Complete each explicit physical movement as its actual converted gross leg; burden or consumption assignment remains a separate vector. Actual performed original-cohort service S_i_c(H) remains assigned even when serviced FG stays in closing stock. Only genuinely unconsumed/unassigned charge/service inventories carry forward, without removing completed service or correcting already-net consumption twice."
      inputs:
        - Bopen_i_c
        - E_i_c
        - Bclose_i_c
        - X_i_c
        - inherited_vector
        - allocation_driver
        - original_cohort
        - H
      output: "A_i_c; S_i_c(H); reconciled_physical_views"
      source_ids:
        - ilcd-attributional-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q_c > 0 store result_i_c = A_i_c / Q_c exactly once. Separately store original-cohort service S_i_c(H)/Q_c in this same rule; combined profile adds only stored manufacture and service results with original manufacture carried once. Physical custody is a separate view, not extra purchase burden. Q_c=0 retains raw loads/histories with no unit result. Cards/aggregation only read stored result, no second Q division; cancel internal first-release Q transfer at combined gate."
      inputs:
        - A_i_c
        - "S_i_c(H)"
        - Q_c
        - original_cohort
        - H
      output: "result_i_c; service_result_i_c_H"
      source_ids:
        - ilcd-attributional-2010
        - schott-core-2026
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Keep the qualified core Product identity and all native/card restrictions/exact support chains consumable. Ordinary auxiliary/provider/future-quantity gaps alone are not core holds."
      evidence: "query membership/full native originals and compatibility"
    - id: dq_primary
      applies_to: "system"
      requirement: "Complete primary originals with adjacent alternatives/notes; distinguish synthesis, factory records and LCA method."
      evidence: "complete sources and limitations"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Actual calibrated composition/state/density/coverage/uncertainty; unknown neither zero nor pass."
      evidence: "raw meters/assays/calibration/matched sampling"
    - id: dq_history
      applies_to: "all inventory rows"
      requirement: "Complete failed/WIP/FG/asset/fluid/package physical and historical vectors at each gate."
      evidence: "cohort/delivery/repair/stock-vector ledgers"
    - id: dq_coverage
      applies_to: "system"
      requirement: "Explicit performed/skipped/unknown scope; science/translation pending; aligned is not reviewed; separate mapping/publication approval."
      evidence: "evidence and coverage report"
validation_rules:
  - rule_id: v_scope
    applies_to: "system"
    rule: "Check every qualifier and complete tube-to-open Form B hot-conversion/electric-anneal/first-release terminal, no tube/generic wrong-family glass/drug/syringe/repacking proxy."
    source_ids:
      - schott-core-page
      - schott-core-2026
      - stevanato-ampoule-line
      - ocmi-fa36s
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Before data use inspect all native basenames/synonyms/comments/CAS, fixed form/grade/route/geography/media/type and every property. Require real query membership/full public100 exact flow/property/group/unit evidence, retaining requested versus observed/resolved externally; no latest/density/per-item-mass inference from secondary factors. Preserve all per-card restrictions in consumed context. Missing exact core final Product UUID is blocking identity hold, not an auxiliary gap or declared waiver."
    source_ids:
      - schott-core-2026
  - rule_id: v_q
    applies_to: "finished_ampoule"
    rule: "Reconcile calibrated net accepted kg/unique release and all drawing/chemical/cosmetic/residual-stress/score-break acceptance. Released closing FG already Q, no WIP subtraction/second output. Preserve failures/Q0 and original-cohort services."
    source_ids:
      - schott-core-2026
  - rule_id: v_balance
    applies_to: "all inventory rows"
    rule: "Independently close gross mass/elements/real species and every package direction, WIP/FG/asset/fluid quantity and inherited exchange vector at manufacturing/service/combined gates. No allocation-scaled physical mass or residual-fit multiple unknowns. Unknown measurement/speciation/balance remains incomplete, never pass."
    source_ids:
      - ilcd-attributional-2010
      - ocmi-fa36s
  - rule_id: v_normalize
    applies_to: "all inventory rows"
    rule: "Raw collection stays undivided. Unit/rate/state conversion, genuine attribution and stock/vector reconciliation precede sole normalize_once A_i_c/Q_c. Cards/aggregation read stored result without another division. Q0 retains load/no unit result; internal Q cancels."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_evidence
    applies_to: "system"
    rule: "Disclose synthesis and adjacent contrary alternatives. Equipment rates/kW/mass/speed, catalogue dimensions/pieces per tray, breakforce tables/charts and unlimited-glass-life marketing are not defaults, actual plant performance, drug stability or certification. Report performed/skipped/unknown scope; engineering does not approve science/translation/mapping/publication."
    source_ids:
      - schott-core-2026
      - stevanato-ampoule-line
      - ocmi-fa36s
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Upstream empty-ampoule supply for drug filling only after actual configuration/provider applicability, data completeness and independent scientific judgement; candidate methodology is not approval"
  allowed_use: "Declared configuration/provider/cohort/Q with observed H; original manufacture inherited once"
  excluded_use: "Whole37195 coverage; wrong-family proxy; drug/syringe/filled container; certification/stability/medical advice; unobserved service extrapolation or net-delivery denominator"
  required_metadata: "clear Type I pharmaceutical tube chemistry and supplier grade; unworked tube geometry and inherited provider boundary; open Form B drawing and capacity; mechanical score-break and unprinted uncoated state; actual gas composition burner and oxygen-air configuration; electric annealing profile and cooling topology; chemical dimensional cosmetic residual-stress breakforce acceptance; unique first-release event and cohort; calibrated bare net mass moisture and tare method; real species phases compartments and utility thermal state; water-energy supplier convention; electricity voltage geography and provider; package material ownership and stock states; asset configuration service basis and inherited histories; site period and original-cohort service closing H"
  required_quality_disclosure: "qualified core identity/unbound rows/native restrictions, actual records versus synthesis, all unknown/unmeasured/skipped scope, full history and service H"
  update_trigger: "real product/fuel/forming/anneal/score/cleaning/coating/utility/package/asset/provider/method/core-identity/evidence changes"
