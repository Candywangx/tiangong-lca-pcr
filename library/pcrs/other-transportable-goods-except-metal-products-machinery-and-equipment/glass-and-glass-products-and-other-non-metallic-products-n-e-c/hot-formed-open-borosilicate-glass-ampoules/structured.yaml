system_boundary:
  rules:
    - rule_id: b_start
      applies_to: "system"
      rule: "Start from whole fully burdened unworked clear Type I pharmaceutical tube with compatible batch/melt/draw/anneal provider. Include receiving damage/loading, first-bottom/body/neck/stem forming, separation/fire finish/score-break, cooling/electric annealing, inspections/tests and first release, with all real auxiliary/utility/package/asset/transport/treatment providers. Danner tube production alone or finished-ampoule repacking is insufficient."
      source_ids:
        - schott-core-2026
        - stevanato-ampoule-line
        - ocmi-fa36s
    - rule_id: b_operations
      applies_to: "all inventory rows"
      rule: "Retain all failed/zero-output attempts, ends, startup/shutdown/warm-up/idle, purge/cleanup, test destruction, rework and abatement. Every actual unlisted fuel/formulation/cleaner/reagent/filter/refrigerant/part/package/waste/species needs a specific atomic card before completion; never zero/other bundling or omission for missing UUID. Whole supplied formulations/articles cross once; assay, active chemical and carried water are subaccounts."
      source_ids:
        - stevanato-ampoule-line
        - ocmi-fa36s
        - schott-core-2026
    - rule_id: b_q
      applies_to: "finished_ampoule"
      rule: "Q_c is calibrated bare net kg uniquely first passing all required release tests in cohort c. Rejects/destroyed samples excluded but their loads retained. Closing already first-released FG is already Q, neither WIP subtraction nor another production output. Shipment/reinspection/old-return re-release is no new Q. Q_c=0 retains all loads and produces no unit value."
      source_ids:
        - schott-core-2026
        - schott-core-page
    - rule_id: b_vectors
      applies_to: "all inventory rows"
      rule: "Manufacturing A_i_c = Bopen_i_c + E_i_c - Bclose_i_c - X_i_c after conversion and genuine attribution. Bopen/Bclose contain only disjoint raw/WIP/unassigned non-WIP utility/installed-asset stores with complete per-exchange historical vectors. X is separately traced external/co-output/other-cohort exit, not already corrected consumption or released closing FG. Track composition/water/state and cancel paired internal physical/vector transfers at consolidation; no second stock correction. A physical export or sale alone never establishes a burden transfer. X_i_c may subtract only an independently traced assignment to a distinct real cohort/function under the justified allocation or burden-handover decision, once; ordinary manufacturing rejects, breakage, samples, waste or their treatment retain the caused manufacture/treatment burden in the original cohort. Do not remove their inherited vector merely because material leaves the gate. Explicit physical purchase/receipt, custody, dispatch, return and waste-movement cards retain the full converted gross leg with separately identified upstream/consumption vectors, never a burden-share-scaled mass."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_services
      applies_to: "services"
      rule: "After Q retain actual packing/storage/handling/dispatch/returns/rework increments S_i_c(H) on original production cohort Q_c and observed horizon H. Opening/closing FG carry complete production/prior-service vectors and original release/delivery ids. Original reversal D_rev links original actual delivery and independent mass/state change, never simply returned mass R. Preserve real rework water/material/energy additions/removals. Manufacture carried once; combined gate cancels internal Q. Net-delivery normalization is outside scope and requires complete G/R/D_rev bridge before any scope change. Any actual post-release work must have manufacturer/procedure or governing-specification permission within this empty open nonsterile ampoule scope, defined post-work tests and recorded acceptance/disposition. A broken/failed ampoule is not restored by a return ledger; reject/waste remains unless eligibility is independently demonstrated. Retain actual separately measured new/removed material, water and phase transfers, and repair-held custody as FG substates OR disjoint repair-WIP once. Such work creates no new first-release Q and cannot introduce filling, sterilization, closed forms or another glass article without renewed applicability."
      source_ids:
        - ilcd-attributional-2010
        - schott-core-2026
    - rule_id: b_physical
      applies_to: "all inventory rows"
      rule: "Close gross mass and relevant Si/B/Al/Na/K/C/H/O/N/S/metal elements independently at manufacturing/service/combined gates. For each species/phase opening + external ingress = closing + external egress + independently evidenced signed chemical conversion. Glass softening is not carbonate-batch decomposition; no invented melt reactions/structural or reaction water. Separate free/carrier/ambient/condensed/retained/true reaction water. Gross fuel/air/oxygen/exhaust species independent of allocated LCI; no aggregate plus sub-species duplication. One residual cannot fit two unknowns; total B/C, VOC, COD or PM size index is not chemical mass/species."
      source_ids:
        - ocmi-fa36s
        - stevanato-ampoule-line
        - ilcd-attributional-2010
    - rule_id: b_packages
      applies_to: "services"
      rule: "For EACH component: opening empty + opening WIP-attached + opening FG-attached + opening reusable + new purchase + supplier-contained ingress + external return received = closing empty + closing WIP-attached + closing FG-attached + closing reusable + leaving with gross physical shipment + separate external return + waste, with independently measured water and true new/removed repair terms. States disjoint; internal reuse cancels, not repurchase, ampoule Q or automatic co-product. Gross physical mass is not economically scaled; upstream-included flags prevent double burdens."
      source_ids:
        - schott-core-page
        - schott-core-2026
        - ilcd-attributional-2010
    - rule_id: b_assets
      applies_to: "manufacture; utilities"
      rule: "Separate machine/kiln/chuck/wheel/refractory/filter and charged-fluid opening/new/repair/transfer/closing/retirement physical stocks from period use of their inherited service vectors. Use actual configuration/load/time and evidenced attribution, no fixed life or full machine per kg. New/removed parts, water/oil and true treatment remain atomic. Do not duplicate components already in whole-equipment provider."
      source_ids:
        - ocmi-fa36s
        - stevanato-ampoule-line
        - ilcd-attributional-2010
    - rule_id: b_utilities
      applies_to: "utilities"
      rule: "Actual topology/supplier boundary required. Fuel/steam carrierMass and thermal MJ are distinct accounts of one service, not double purchases. External condensate/heat-exchange returns are Product outlets at measured composition/temperature/pressure/enthalpy with supplier water-energy convention, distinct from waste purge/aerosols. No fictitious steam/boiler, cloned return, equal-mass default or automatic heat credit. Recirculation cancels; actual coolant/refrigerant/cleaner/abatement chemicals each get whole-supply card and true outlet."
      source_ids:
        - stevanato-ampoule-line
        - ocmi-fa36s
