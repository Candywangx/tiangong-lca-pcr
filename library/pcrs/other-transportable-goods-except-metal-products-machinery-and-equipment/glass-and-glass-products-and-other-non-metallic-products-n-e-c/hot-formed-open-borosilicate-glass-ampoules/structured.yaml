      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_scope | system | Check every qualifier and complete tube-to-open Form B hot-conversion/electric-anneal/first-release terminal, no tube/generic wrong-family glass/drug/syringe/repacking proxy. | `schott-core-page`; `schott-core-2026`; `stevanato-ampoule-line`; `ocmi-fa36s` |\n| v_identity | all inventory rows | Before data use inspect all native basenames/synonyms/comments/CAS, fixed form/grade/route/geography/media/type and every property. Require real query membership/full public100 exact flow/property/group/unit evidence, retaining requested versus observed/resolved externally; no latest/density/per-item-mass inference from secondary factors. Preserve all per-card restrictions in consumed context. Missing exact core final Product UUID is blocking identity hold, not an auxiliary gap or declared waiver. | `schott-core-2026` |\n| v_q | finished_ampoule | Reconcile calibrated net accepted kg/unique release and all drawing/chemical/cosmetic/residual-stress/score-break acceptance. Released closing FG already Q, no WIP subtraction/second output. Preserve failures/Q0 and original-cohort services. | `schott-core-2026` |\n| v_balance | all inventory rows | Independently close gross mass/elements/real species and every package direction, WIP/FG/asset/fluid quantity and inherited exchange vector at manufacturing/service/combined gates. No allocation-scaled physical mass or residual-fit multiple unknowns. Unknown measurement/speciation/balance remains incomplete, never pass. | `ilcd-attributional-2010`; `ocmi-fa36s` |\n| v_normalize | all inventory rows | Raw collection stays undivided. Unit/rate/state conversion, genuine attribution and stock/vector reconciliation precede sole normalize_once A_i_c/Q_c. Cards/aggregation read stored result without another division. Q0 retains load/no unit result; internal Q cancels. | `ilcd-attributional-2010` |\n| v_evidence | system | Disclose synthesis and adjacent contrary alternatives. Equipment rates/kW/mass/speed, catalogue dimensions/pieces per tray, breakforce tables/charts and unlimited-glass-life marketing are not defaults, actual plant performance, drug stability or certification. Report performed/skipped/unknown scope; engineering does not approve science/translation/mapping/publication. | `schott-core-2026`; `stevanato-ampoule-line`; `ocmi-fa36s` |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
