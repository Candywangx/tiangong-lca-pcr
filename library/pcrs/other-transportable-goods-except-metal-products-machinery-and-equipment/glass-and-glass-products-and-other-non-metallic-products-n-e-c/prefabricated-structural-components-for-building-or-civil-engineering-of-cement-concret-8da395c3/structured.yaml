      collection_method: "Independently meter actual separate additions/removals/uptake/evaporation/liquid effluent; do not fit multiple unknowns from a stock residual. Whole wet receipts include their original water once. Use each unique event once in this specific row or a general species/utility row; deduplicate only other same-side flow terms, not retained influx or full wet closing stock. Missing data remain unknown; absence requires evidence. Retain unnormalized event/cohort records and inherited vectors in the listed unit; calc_raw then calc_attribute prepare A_i; calc_reference alone gives per reference flow. Do not collect an already divided value. aggregation_rule declares only the final display basis of that same result. Collect every actually incurred input, water, energy, loss, waste and burden from unauthorized/unapproved, failed or rejected work as well as authorized work. Permission, configuration-specific postwork tests and acceptance govern authorization, continuing qualification and actual hold/rejection/waste disposition only; they never erase actual flows or loads, create a new Q, or presume restoration. Before first release retain manufacture Q; after release retain the original cohort Q_o and actual observed horizon H. Natural storage/handling humidity needs no work permission."
