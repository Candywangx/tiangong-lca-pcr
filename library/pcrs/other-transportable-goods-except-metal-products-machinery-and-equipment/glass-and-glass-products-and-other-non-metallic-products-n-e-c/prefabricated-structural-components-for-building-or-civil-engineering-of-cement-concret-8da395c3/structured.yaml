allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "These rules apply only to attributional cases in which allocation is justified by the study context; they are not a claim of complete ILCD conformance. Physical and burden ledgers remain distinct."
    source_ids: []
  - rule_id: a_context
    applies_to: "all processes"
    rule: "Use attributional modelling only where the study context justifies partitioning. First assign exclusive operations and exchanges by actual subdivision or virtual subdivision. For remaining shared exchanges identify exchange-specific determining physical causality, including actual service duration and the real limiting physical driver; mass alone is not universally causal. Only genuinely remaining common process burdens may use same-period actual market values at the same process gate/state. Record reasons, fractions and conservation separately by exchange; no free physical/economic choice, fixed proportions or automatic avoided-production credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_failures
    applies_to: "all processes"
    rule: "Ordinary failed products, specimens, offcuts and manufacturing waste retain their associated production/testing and actual treatment burden even when sold or sent offsite. A vector transfer T_other requires a real independent other cohort/function and a justified allocation or burden-handover decision, exactly once; sale/disposal alone is insufficient. Physical gross mass remains complete and unscaled."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_normalize
    applies_to: "all inventory rows"
    rule: "Keep each inherited exchange vector in its native extensive unit. Resolve attribution and raw unit/rate conversions before calc_reference. Manufacturing A_i=B_open_i+B_current_i-B_close_i-T_other_i; B_close contains raw/WIP and unused/unassigned stores only, never first-released closingFG. If B_current is already stock-corrected, do not subtract the same stock again. Services A_i include actual performed original-cohort service; only unused/unassigned future service/charge carries. Keep a separate full physical quantity and every inherited exchange vector for EACH raw, WIP and non-WIP stock, including packaging, assets, parts and installed fluids; a stock quantity is not its burden vector. For a ledger-only physical FG/package/waste/asset/carrier-water-return movement, A_i denotes that full gross native-unit leg for display, not an allocated service vector: never multiply it by an economic/service share, add original manufacturing burden to it or apply a second stock correction. Actual assigned service and upstream burdens keep their independent vectors; normalize each declared quantity/vector once using its proper original cohort Q_i. Use Q_i=Q for manufacture and Q_i=Q_o for original-cohort service; calc_reference alone executes A_i/Q_i once. Preserve Q_i=0 without a unit result."
    source_ids:
      - ilcd-attributional-2010
