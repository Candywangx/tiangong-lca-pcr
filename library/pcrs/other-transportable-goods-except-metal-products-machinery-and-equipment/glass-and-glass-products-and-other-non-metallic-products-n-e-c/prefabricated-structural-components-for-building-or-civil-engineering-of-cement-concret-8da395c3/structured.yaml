  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert raw_i into the row native extensive unit before any product division. kWh*3.6=MJ once; actual rates integrate over their recorded interval; integrated quantities are not reintegrated. Actual substance/state-specific density or measured same-configuration mass is required for volume/count conversion; no inferred value."
      inputs:
        - raw_i
        - unit_i
        - state_i
        - conversion_evidence
      output: "u_i"
      source_ids:
        - npca-qc-2026
    - id: calc_attribute
      applies_to: "all inventory rows"
      rule: "Perform justified subdivision/causal/residual allocation per exchange. Manufacturing A_i=B_open_i+B_current_i-B_close_i-T_other_i with raw/WIP/unassigned-only B_close; already stock-corrected consumption has no second stock subtraction. For services assign actual performed original-cohort burden and only carry unused/unassigned service/charge. Every physical gross leg remains unscaled. For ledger-only physical movements use the measured full gross native-unit leg as A_i without burden allocation, old manufacturing addition or a second stock correction; retain the separate actual assigned service/upstream vector. Keep physical quantities and all exchange vectors independently for every raw/WIP/non-WIP stock. Collect every actually incurred input, water, energy, loss, waste and burden from unauthorized/unapproved, failed or rejected work as well as authorized work. Permission, configuration-specific postwork tests and acceptance govern authorization, continuing qualification and actual hold/rejection/waste disposition only; they never erase actual flows or loads, create a new Q, or presume restoration. Before first release retain manufacture Q; after release retain the original cohort Q_o and actual observed horizon H. Natural storage/handling humidity needs no work permission."
      inputs:
        - u_i
        - B_open_i
        - B_current_i
        - B_close_i
        - T_other_i
        - allocation_evidence
      output: "A_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q_i; Q_i = newly first-quality-released net cohort massQ for manufacture or original released cohort massQ_o for its observed incremental service. Perform this division once only; if Q_i=0 retain actual burden and stocks with no unit result. finished_panel is the fixed1kg reference representation of measuredQ, not another division."
      inputs:
        - A_i
        - Q_i
        - cp_release
      output: "a_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all physical gates"
      rule: "Opening full wet mass + actual gross external inflows = closing full wet mass + actual gross external outflows; reconcile each element and phase independently. Internal Q/WIP/reuse cancels on combination; real external additions stay even if retained in closing stocks. This is a physical audit, not a burden allocation or a second normalization."
      inputs:
        - opening_i
        - closing_i
        - gross_in_i
        - gross_out_i
        - independent_species_phase_evidence
      output: "physical_reconciliation_i"
      source_ids:
        - npca-qc-2026
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Actual whole product/member/native restrictions and supplier compatibility; every real unlisted exchange added atomically"
      evidence: "Complete native record; exact property/unit support; actual supplier documents"
    - id: dq_manufacturer
      applies_to: "finished_panel"
      requirement: "Real governing QC and approved structural terminal; no invented design or certification"
      evidence: "Approved drawings; test/inspection and release records; repair permissions and postwork acceptance/disposition"
    - id: dq_measure
      applies_to: "all inventory rows"
      requirement: "Raw original units/state; calibrated full configurations; independent species/water/element evidence; no residual-fitting two unknowns"
      evidence: "Meters/scales and calibration; independent assays; explicit detection limits and unknowns"
    - id: dq_cohorts
      applies_to: "all processes"
      requirement: "Complete multi-cohort long-curing/WIP and inherited vector; failed/idle/Q0 periods; first release and service horizons"
      evidence: "Cohort and stock histories; vector conservation; raw-to-A_i-to-a_i lineage"
    - id: dq_source
      applies_to: "all processes"
      requirement: "Separate primary qualitative process evidence from actual foreground quantities and LCA allocation authority; preserve complete source/ancestor context"
      evidence: "Source ids and original locators; scope/route/state limitations; missing/failed evidence disclosed"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Verify actual terminal/route, every adopted native restriction, atomic identity and exact native reference property/unit chain. A whole wall-panel reference cannot be replaced by concrete mix, steel, beam, block or installed building. Conditional incompatible grade/form/geography/provider requires a compatible re-selection, not a waived conflict. Unresolved actual auxiliary exchanges remain explicit."
    source_ids:
      - elematic-solid-wall
      - npca-qc-2026
  - rule_id: v_reference
    applies_to: "finished_panel"
    rule: "Require actual manufacturer/governing specification, approved drawings, reinforcement/insert traceability, curing records, strength/stripping and final release tests/inspections, permissions for repair and postwork test/acceptance/disposition. No PCR-created structural design, reinforcement ratio, load capacity, strength, service life, recipe or cure schedule. Evidence absence prevents a dataset claiming a qualified released structural terminal."
    source_ids:
      - npca-qc-2026
      - elematic-solid-wall
  - rule_id: v_balance
    applies_to: "all processes"
    rule: "Close physical mass, relevant elements, water phases, actual energy and each packaging/asset stock independently; keep gas species and destinations atomic. Do not infer pure chemical species from COD/VOC/NOx/totalC/totalB or particle totals. Integrated volumes are not multiplied by time again; only real rates are integrated. Density needs independent evidence for the actual material and state. One residual cannot determine two unknowns."
    source_ids:
      - npca-qc-2026
  - rule_id: v_complete
    applies_to: "all processes"
    rule: "Audit original raw records through attribution and one normalization into typed cells/cards/qualifiers; verify all formula inputs/outputs, source four fields, rule/row source_ids and complete normative ancestor context. Retain missing values, failed acquisition/read/identity attempts and unresolved scope honestly. Mechanical checks do not approve science, translation, mapping or publication."
    source_ids:
      - npca-qc-2026
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared whole structural wall-panel manufacturing input with actual boundary/cohort/QC/service horizon"
  allowed_use: "Compatible uninstalled non-prestressed solid reinforced wall-panel manufacture; scale measured mass of the same qualified configuration"
  excluded_use: "Structural design/certification or generic whole37550 coverage; other structural component or installed-system substitution; automatic avoided production/lifetime credit"
  required_metadata: "manufacturer/site and observed period; approved drawing and whole-panel configuration; structural function and governing specification; non-prestressed tied steel reinforcement and cast-in insert inventory; solid normal-weight concrete without insulation or facing; actual cement/aggregate/admixture supply states and formulation ownership; net whole-panel mass and moisture/age at first release; actual curing route and complete multi-cohort WIP vector; governing inspections/tests and first-release identifiers; permitted repair/postwork tests and disposition; packaging/asset stocks and supplier-included ingress ownership; energy/carrier/condensate state and upstream owner; original cohortQ_o and postrelease service horizon; unresolved identities/providers and uncertainty"
  required_quality_disclosure: "Unresolved actual members/providers; real measurement and failed/Q0 coverage; independent physical and burden balances; first-release/service boundaries; actual tests and source limits"
  update_trigger: "Change of approved terminal/configuration; material or route/curing/QC/repair permission; native identity restriction; supplier/energy boundary; measured cohort and service evidence"
data_sources:
  - id: "npca-qc-2026"
    type: "handbook"
    reference: "NPCA Quality Control Manual for Precast Concrete Plants; 19th edition 2026; Chapters2–5; https://precast.org/wp-content/uploads/QCM-001_19th_Edition_02-02-26.pdf"
    used_for: "Material and reinforcement traceability; batching/forming/curing/stripping/repair/inspection/storage/shipment records. Broad manual with alternatives; no default recipe/cure/strength/asset life; does not itself certify a product or establish LCA allocation."
  - id: "elematic-solid-wall"
    type: "extension_guidance"
    reference: "Elematic Solid wall; complete publisher page; https://www.elematic.com/precast-products/solid-wall/"
    used_for: "Positive whole solid reinforced wall-panel endpoint without insulation; structural applications, tables/battery moulds and cast-in openings/inserts. No transfer of dimensions, performance claims, SKU or design."
  - id: "elematic-wall-route"
    type: "extension_guidance"
    reference: "Elematic SEMI Wall; complete publisher page; https://www.elematic.com/product/semi-wall-production-line/ ; Elematic Precast Wall Production SEMI/PRO/EDGE2016 complete brochure; https://www.elematic.com/uploads/2021/02/32c68635-elematic_wall_brochure_2016_en_web.pdf"
    used_for: "Raw batching/mixing through form preparation, reinforcement/inserts, casting/compaction/curing/demoulding/finishing/cleaning/storage. Broader sandwich/double-wall/beam and line options are counter-context, not this terminal. Capacity/area/staff figures are estimates and not inventory defaults."
