    type: "official_guidance"
    reference: "European Commission JRC ILCD Handbook General guide Detailed guidance; first edition March2010; full §§7.9.2–7.9.3; PDF275–292 / printed255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation-only hierarchy: subdivision/virtual subdivision, exchange-specific determining physical causality and genuinely residual common-gate same-state market values. Not industrial manufacturing evidence, universal mass allocation, waste exemption, fixed credit or complete ILCD/PEF conformity."
