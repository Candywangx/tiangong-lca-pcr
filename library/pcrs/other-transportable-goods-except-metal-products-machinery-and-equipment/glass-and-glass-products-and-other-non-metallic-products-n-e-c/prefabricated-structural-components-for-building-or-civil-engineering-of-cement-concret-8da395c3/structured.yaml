system_boundary:
  rules:
    - rule_id: b_full
      applies_to: "all processes"
      rule: "Collect the complete raw-to-first-release route: receipt and moisture stocks; approved mix batching/mixing; tied reinforcement and inserts; mould cleaning/release/shuttering; placing/compaction; actual curing; demoulding; finishing; actual repairs, including unapproved/failed/rejected work; tests/inspection and first quality release. Keep upstream production and actual inbound transport once per supplied material. Do not replace this route by purchased finished-panel repacking. Collect every actually incurred input, water, energy, loss, waste and burden from unauthorized/unapproved, failed or rejected work as well as authorized work. Permission, configuration-specific postwork tests and acceptance govern authorization, continuing qualification and actual hold/rejection/waste disposition only; they never erase actual flows or loads, create a new Q, or presume restoration. Before first release retain manufacture Q; after release retain the original cohort Q_o and actual observed horizon H. Natural storage/handling humidity needs no work permission."
      source_ids:
        - npca-qc-2026
        - elematic-wall-route
    - rule_id: b_modes
      applies_to: "all processes"
      rule: "Keep every start/stop, failed test, rejected batch, specimen, idle, clean-up, spill and rework event, including zero-output periods. Add each actual ingredient, complete formulation, process aid, fuel, refrigerant, asset, packaging material, waste and true emitted species as a separate atomic row if not listed. Conditional absence requires evidence; unknown is not zero."
      source_ids:
        - npca-qc-2026
        - elematic-wall-route
    - rule_id: b_cohorts
      applies_to: "p_mix; p_form; p_cure; p_release"
      rule: "Track each long-curing cohort and opening/closing raw/WIP stock with per-exchange inherited burden vectors, configuration, age, moisture and actual completed steps. Released closingFG is already inQ; manufacturing B_close excludes that FG. No delivery, reinspection, return or any actual postrelease work produces newQ. Q=0 retains all actual burden and stock/disposition records without a unit result. Collect every actually incurred input, water, energy, loss, waste and burden from unauthorized/unapproved, failed or rejected work as well as authorized work. Permission, configuration-specific postwork tests and acceptance govern authorization, continuing qualification and actual hold/rejection/waste disposition only; they never erase actual flows or loads, create a new Q, or presume restoration. Before first release retain manufacture Q; after release retain the original cohort Q_o and actual observed horizon H. Natural storage/handling humidity needs no work permission."
      source_ids:
        - npca-qc-2026
        - ilcd-attributional-2010
    - rule_id: b_physical
      applies_to: "all physical gates"
      rule: "For each physical gate reconcile opening full wet stock + all actual gross external inflows = closing full wet stock + all actual gross external outflows, with independently measured reaction/phase changes and element balances. Manufacturing first-released product crosses once; combining manufacturing and FG-service gates cancels internal releaseQ and internal transfers. In the FG gate use openingFG+first releases+actual returns+actual postwork additions = closingFG+gross shipments+rejects+actual water/gas/material losses. Do not assume returned wet mass equals original dispatch. Mass includes true reinforcement/inserts and water. Burden allocation never scales physical gross legs."
      source_ids:
        - npca-qc-2026
    - rule_id: b_water_heat
      applies_to: "p_cure; p_util"
      rule: "Hydration binds water; phase/structure-bound water, free liquid, absorbed aggregate water, vapour and condensate remain separate measured subledgers, not new purchases. Do not fit two unknowns from one residual or invent a hydration/carbonation coefficient. Actual steam/heat routes require carrierMass and thermal state/enthalpy plus supplier water/energy ownership; one complete provider is charged once. Actual condensate and heat-exchange returns are external Product returns with gross mass/state, not assumed waste or default credits. No fictitious boiler/steam route. For an actual manufacturing condensate or heat-exchange-water Product return, the ledger-only numerator is its measured full gross return quantity V_i in kg, not net water consumption or an assigned heat burden; calc_reference alone gives V_i/Q. Keep independent thermal state, every inherited vector and the single actual supplier convention; a return gives no automatic credit. Actual original-cohort postrelease returns, if present, instead retain V_i/Q_o for that observed service horizon. Gross gas-species inlet/outlet pairs serve physical reconciliation. Keep independently determined net environmental process changes, origin and medium in a separate attributable inventory; unchanged pass-through is neither new pollution/resource use nor a negative credit. Never subtract aggregate gas masses across different species, origins or phases, or charge both the gross pair and the same net change."
      source_ids:
        - npca-qc-2026
    - rule_id: b_pack
      applies_to: "all processes"
      rule: "For EACH packaging material reconcile opening empty+WIP-attached+FG-attached+reusable stock + P(purchased) + I(first non-purchased external ingress) + ER(external return received) + X_in(actual separate added water/material) = closing same full stocks + S(out with gross physical shipments) + EO(external return out) + W(waste) + X_out(actual separate removed water/material). Internal reuse cancels and contributes neither new purchase nor productQ nor automatic coproduct. P/I/ER/S/EO/W and repair/water X_in/X_out deduplicate only OTHER already-counted flow terms; true new material/water influx remains when retained in closing stock, and closing wet mass remains complete. P/I whole articles count included constituents once. X terms require independently measured actual absorption/loss/repair/material-change events and their specific atomic flows before dataset completion; unknown occurrence, composition or amount is not zero. Correct only overlap with other same-side incoming/outgoing flow terms, never opening/closing stocks. No repair or water change is presumed. Each packaging material has separate P/I/ER/S/EO/W direction cards, with actual water-phase events recorded once in specific or general species/utility cards. Other real added/removed packaging-repair materials require their own specific atomic cards before dataset completion and cannot hide in a scalar X; no repair or restoration is presumed. Whole wet supplied articles include their original paper/wood/metal/polymer/adhesive/coating/liner and water once as measured child accounts. Truly paid procurement (standalone or bundled)d onsite components are independent external supplies only when disjoint from the whole receipt, or reconciled through a measured component-to-assembled-article bridge with matched internal handoff cancellation and one upstream owner. Never add the complete assembled tare plus those same constituent supplies as two receipts or stocks. No component consumption, route or density is invented. If several packaging origins physically leave in one collected mixed outlet, use one qualified complete Waste exchange for that actual mixture and one actual treatment/provider record. Keep independently measured per-origin W raw accounts that conserve the total, with documented sampling/partition uncertainty; the whole total and its partition are alternatives, never additive exchanges. Existing W cards then represent non-additive origin subaccounts only, not invented separate exits. Genuinely separate outlets retain their own correct Waste identities and treatment; add/reselect an actual qualified mixed Waste only if that real outlet exists, never merely to satisfy six-leg grammar.  Apply packaging_receipt_basis to distinguish each actual P/I/ER receipt."
      source_ids:
        - npca-qc-2026
        - ilcd-attributional-2010
    - rule_id: b_assets
      applies_to: "p_assets"
      rule: "Maintain physical assets and current service burden separately for moulds, mixer, lifting/handling equipment and every actual added asset, repair part and in-installed fluid. Gross new/old acquisition, returns, repair additions/removals and retirement preserve complete wet mass and actual water/oil legs. Service vectors use actual documented production/service basis; no fixed life, machine weight, cycles or one whole machine perkg. Only unused/unassigned future service/charge may carry forward. A stock-corrected consumption series is never corrected twice."
      source_ids:
        - npca-qc-2026
        - ilcd-attributional-2010
    - rule_id: b_service
      applies_to: "p_service"
      rule: "Keep actual warehousing, protection/packaging, handling, dispatch, reinspection and actual postrelease work, including unapproved/failed/rejected work in a separate incremental service ledger linked to original cohortQ_o and observation horizon. Already performed service is never deducted because FG stays at closing. Record actual grossG shipments andR returns, original dispatch identifiers/mass, D_rev original-burden reversal only for a separately declared net-delivery ledger, added repair materials/water/losses and new incremental burden. This PCR uses first release; never import a net-delivery denominator or silently subtract R/G fromQ. Collect every actually incurred input, water, energy, loss, waste and burden from unauthorized/unapproved, failed or rejected work as well as authorized work. Permission, configuration-specific postwork tests and acceptance govern authorization, continuing qualification and actual hold/rejection/waste disposition only; they never erase actual flows or loads, create a new Q, or presume restoration. Before first release retain manufacture Q; after release retain the original cohort Q_o and actual observed horizon H. Natural storage/handling humidity needs no work permission."
      source_ids:
        - npca-qc-2026
        - ilcd-attributional-2010
    - rule_id: packaging_receipt_basis
      applies_to: "each packaging receipt"
      rule: "For every actual packaging article, classify each whole external receipt once. P is paid procurement, including paid packaging bundled with another supply without a separate invoice. I is all first non-purchased external ingress: standalone gifts, loans, rental or pool receipts and non-purchased supplier-attached packaging; supplier attachment is only an I subset. ER requires this same item or an auditable configuration-matched batch linked to this site's own prior outward record; custody or another party's use alone does not prove a return. P, I and ER are disjoint. Existing I cards and their raw protocols cover the same physical article for every such I origin; no new material, UUID or quantity is presumed. X_in/X_out remain disjoint material/water-change terms, never a substitute for whole-article receipt. Retain gross physical quantity, owner/custodian, payment or non-purchase basis, origin, prior-outward link where required, native state/unit and inherited manufacturing/service vector. Non-purchase is neither a new manufacture nor automatic zero burden: attribute actual used service and incremental transport/handling once to its proper original cohort and denominator, retaining unused service separately without a default lifetime or credit. This is the declared conserving foreground accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-attributional-2010
