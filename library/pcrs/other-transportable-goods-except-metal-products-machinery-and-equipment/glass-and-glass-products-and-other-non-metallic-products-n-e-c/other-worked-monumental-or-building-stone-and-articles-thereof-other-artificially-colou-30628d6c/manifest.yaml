  core_reference_identity:
    status: "confirmed_physically_compatible_manufactured_product_family"
    flow_uuid: "d85d190e-3c45-46ab-98bb-a3a2c0db4441"
    restriction: "Natural quarried granite with its real mineral assemblage and irregular interlocking crystals; manufactured by cutting and grinding/polishing for architectural countertop use. Native Product identity has Area as its sole reference property; it gives no fixed stone species/grade, geometry, thickness, mass, density, geographic supplier, resin treatment or certification. Declare the actual quarry/stone and petrography, weathering, free moisture, complete drawing and holes/edges, polished faces, any local fill/impregnation and every attached component. Not marble/travertine/alabaster, ceramic tile, agglomerated resin-stone, a pure mineral powder, a flamed tread or an installed kitchen/furniture system. A supplied finished countertop cannot substitute for block/slab manufacturing."
  semantic_boundary:
    scope: "Cut-to-drawing and polished whole natural granite countertop; block or explicitly upstream-processed slab to first finished quality release."
    deduplication: "Existing non-calcareous dimension-stone PCR covers quarry blocks/rough blanks and excludes subsequent finishing. Frozen ceramic tile/concrete/gypsum-board methodologies do not cover this natural-geological block/slab-to-countertop process. Reuse upstream scope only; no duplicate canonical record for the same whole product/method identified."
    classification_decision: "Proposed narrower part of 37690 only, excluding 37610 calcareous worked stone and ceramic/resin-agglomerated products; classification acceptance remains independent."
  ordinary_gaps:
    - "Actual future factory records, stone mineralogy/configuration/geometry/moisture, provider scopes, measured Q and all raw/WIP/service vectors must be collected; no site measurements or fixed recipe/threshold/density/thickness/yield/life invented."
    - "Auxiliary and conditional flow identities remain atomic and unresolved where no compatible native record is adopted. Full adopted restrictions remain in consuming cards; generic provider/grade gaps do not justify arbitrary identity substitution."
    - "Shared-material fragment verification is not semantic coverage or numeric permission. Industrial primary route synthesis and qualitative attributional method have separate applicability decisions."
