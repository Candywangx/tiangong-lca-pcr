allocation_rules:
  - rule_id: a_scope
    applies_to: "all processes"
    rule: "This is an attributional manufacturing methodology. Establish whether multifunctionality actually exists and allocation rather than substitution is appropriate for the declared decision context. Apply dedicated measurement and real or virtual subdivision first, including saw lines, polishers, treatment and serial services. Do not select mass, energy, area or economic shares arbitrarily."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_causality
    applies_to: "each remaining exchange"
    rule: "For each still-shared nonfunctional exchange demonstrate its determining physical causal relationship to each cofunction at the actual process state. A technical extensive-property driver is acceptable only with that causal proof. Keep the derivation, measurement, uncertainty and all functions; never apply a single unproved area or mass split to every material, energy and emission coordinate."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_residual
    applies_to: "genuinely residual shared flows only"
    rule: "Only after documented subdivision and exchange-specific causality are exhausted, use contemporaneous actual market value of cofunctions in the same condition at the common process exit gate, or relevant input gate for treatment services. Preserve real quantities and gate prices, currency, period, adjustments and sensitivity; no downstream retail value, negative-waste-price shortcut, fixed percentage or automatic credit. Missing or inconsistent gate evidence remains a hold for that dataset."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_waste
    applies_to: "offcuts and rejects and samples and treatment"
    rule: "Ordinary manufacturing waste, failures, destructive samples and treatment burdens stay with the original manufacturing function even when sold or externally treated. A transfer vector Tlegitimate exists only for a genuinely distinct other function/cohort with justified allocation/handover and a receipt; apply once and preserve all gross physical legs unscaled. Internal recycling cancels physical transfer but preserves inherited burdens; it creates neither procurement nor automatic coproduct credit."
    source_ids:
      - ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_p_make
      process_id: "p_make"
      flow_role: "block_feed; slab_feed; fill_resin; fill_hardener; impregnating_sealer; cleaner; cotton_wipe"
      record_type: "measured_foreground_record"
      raw_fields: "row_id; cohort_id; stage; supplier; delivery_id; supplied_formulation; original_amount; original_unit; opening_stock; closing_stock; external_returns; upstream_owner; moisture; independent_phase_assay; inherited_vector"
      collection_method: "Weigh each real whole supplied block/slab or preparation separately; reconcile receipt, specification, batch, carried water and stock on matched wet/dry bases. Keep every actually purchased component and actual onsite mixing energy/loss, while nested assay/active/carrier constituents are not purchased again. Raw aggregation condition: preserve un-divided raw extensive totals and inherited vectors; convert_raw then attribute_vector; normalize_once is the only final division, referenced by aggregation rather than repeated."
      unit: "kg"
      frequency: "Each event/meter interval and matched cohort close; representative sampling of every actual state"
      temporal_coverage: "Whole original cohort including failed/zero-output/startstop/idle/cleanup and linked real service horizon"
      site_scope: "Actual individual physical gate and declared supplier/equipment/configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale; supplier specification/SDS; paired stock/phase records; vector provenance"
