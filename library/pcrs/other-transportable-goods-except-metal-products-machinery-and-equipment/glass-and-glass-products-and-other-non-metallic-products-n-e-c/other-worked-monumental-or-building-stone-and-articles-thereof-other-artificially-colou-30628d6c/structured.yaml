measurement_rules:
  - id: area_reference
    applies_to: "finished_countertop"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "Q = sum of the actual single-face projected areas of newly first-quality-released complete countertops in the original cohort. Include closing released FG once. Use L × W only for a proved rectangle on the declared net projected-face basis with actual holes removed; use measured or traceable drawing-specific geometry for every curved or nonrectangular shape. Do not use a bounding rectangle, both faces, thickness surface area, raw slab area or dispatched area. cp_release_p_make records raw measurements and release flags. nsi-countertops-2022; ilcd-detailed-2010"
  - id: normalize_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Row-native extensive property"
      uuid: ""
    required_unit: "m2; kg; MJ; Item(s)"
    rule: "Every nonreference card references normalize_once after convert_raw and attribute_vector. Protocols collect un-divided raw amounts; aggregation/card text is a view of the same single A_j/Q result. Electricity keeps MJ (raw kWh × 3.6); material and gas masses keep kg; the area reference keeps m2; physical machine item stock is not a kg flow. Do not apply a blanket Mass/kg requirement to energy, area or volume-native future rows. nsi-countertops-2022; ilcd-detailed-2010 Declared custody-only/gross physical disclosures instead use the same sole V_j/Q under normalize_once, replacing the burden numerator A_j/Q; actual burden vectors and physical ledgers stay separate, without another quotient or stock/economic correction of measured gross legs."
  - id: mass_count_conversion
    applies_to: "finished_countertop"
    required_property_ref:
      name: "Mass and Area and Number of items"
      uuid: ""
    required_unit: "kg; m2; Item(s)"
    rule: "Net finished mass and count are independent metadata and physical-balance observations for the same measured configuration/moisture/acceptance scope, not secondary flow-property conversion coefficients. Any requested kg/item or kg/m2 conversion requires calibrated net weighing and actual matched geometry/count from cp_release_p_make. Number of items → Item(s) and item are identical physical units with factor 1; this does not establish an item mass or a stone density. No secondary coefficient supplies either. nsi-countertops-2022; ilcd-detailed-2010"
  - id: water_and_species
    applies_to: "all material and gas rows"
    required_property_ref:
      name: "Mass and actual native energy/volume if present"
      uuid: ""
    required_unit: "kg; actual row unit"
    rule: "Measure wet whole-material mass, free moisture, phase/chemical composition and real state independently. Do not force quartz or a single feldspar to represent whole granite. Mineral structural/adsorbed/free/phase water are distinct; no calcination or fixed reaction-water amount is assumed. Do not fit two unknowns using one balance residual; COD/VOC/NOx and total PM are indicators, not specific molecular/mineral mass. A cumulative gas/liquid volume is not multiplied by time; integrate only actual rates. Density belongs to the particular substance and measured temperature/pressure/composition. nsi-countertops-2022; ilcd-detailed-2010"
