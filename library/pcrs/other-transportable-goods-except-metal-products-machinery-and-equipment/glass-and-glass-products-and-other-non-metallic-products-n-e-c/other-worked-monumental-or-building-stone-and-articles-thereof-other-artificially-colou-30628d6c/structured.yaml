system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "all manufacturing"
      rule: "A whole natural granite block undergoes real primary sawing, calibration and grinding/polishing, then template-specific cutting/holes and edge work, required local fill/impregnation, cleaning, actual specified inspection/testing and first quality release. Prepared slab input is an alternative supply boundary, not an excuse to omit/repeat its upstream sawing/finishing. Never reduce this method to purchasing and wrapping a finished countertop."
      source_ids:
        - nsi-countertops-2022
    - rule_id: b_gate
      applies_to: "manufacturing and associated services"
      rule: "The first newly accepted whole-countertop release is Q. Keep all attributable transport/templating before that gate; keep actual postrelease storage, packing, lifting and dispatch in a separate original-cohort service account with a disclosed observation horizon. Installation/use/end of life are outside this gate and receive no invented life or certification. A quoted factory gate does not erase upstream supplies or ordinary waste treatment/transport."
      source_ids:
        - nsi-countertops-2022
    - rule_id: b_no_double
      applies_to: "all source/provider interfaces"
      rule: "Keep each external whole-article/preparation receipt once and every actual single flow, phase and process state. Internal material/water transfers cancel with inherited vectors; no second provider charge for a completed upstream operation or complete outsourced service. Additional actual circuits, combustion gases, chemicals, wastes and material/water repairs require separate physical cards even when unlisted here. Distinguish actual zero, demonstrated absence and unknown; an unknown cannot be reported not_applicable."
      source_ids:
        - nsi-countertops-2022
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-detailed-2010
