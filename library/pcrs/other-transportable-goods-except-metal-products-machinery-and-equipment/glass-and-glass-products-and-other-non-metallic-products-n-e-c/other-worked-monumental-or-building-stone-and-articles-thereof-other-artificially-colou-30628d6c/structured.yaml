  calculation_rules:
    - id: convert_raw
      applies_to: "each raw extensive observation"
      rule: "Convert raw units and state before attribution: kWh × 3.6 gives MJ; independently measured substance-specific density converts actual volume to mass; integrate an observed rate over its real interval only, never multiply an already cumulative volume by time. Fuel carrier mass and heat, complete purchased formulations and their assay subaccounts remain distinct views with one burden owner. No conversion invents unmeasured density, item mass, species or allocation."
      inputs:
        - raw_amount
        - original_unit
        - true_rate_if_present
        - actual_interval
        - independent_state_density
        - measured_NCV
        - whole_supply_owner
      output: "converted extensive observations in each row unit"
      source_ids:
        - nsi-countertops-2022
    - id: release_q
      applies_to: "finished_countertop"
      rule: "Q = sum of actual net single-face projected m2 of each newly first-quality-released whole countertop in the original cohort. Include released closing FG once; subtract actual holes on the declared projection and use actual drawing-specific curves. Raw slab QC, dispatch, returns, retest and later service create no new Q. Independently sum first-release net physical mass Rmass for mass balance; Q is never substituted for that mass."
      inputs:
        - cp_release_p_make
        - original_first_release_flag
        - actual_projected_area
        - real_holes_and_curves
        - independent_net_mass
      output: "Q in m2; separate Rmass in kg"
      source_ids:
        - nsi-countertops-2022
    - id: attribute_vector
      applies_to: "each extensive inventory coordinate j"
      rule: "A_j = Bopen_j + R_j + Sperformed_j - Bclose_j - Tlegitimate_j. R_j is current converted manufacturing activity attributed once by justified subdivision/allocation; Sperformed_j is real performed postrelease service of the original cohort in its observation horizon. Every event enters exactly one term. Bopen/Bclose retain per-exchange raw/WIP and unused/unassigned material/tool/service vectors; manufacturing Bclose excludes first-released FG. Closing FG cannot remove manufacturing already counted in Q or performed services. Tlegitimate requires a_waste and a unique handover receipt for a real other function/cohort. Already stock-corrected R is not stock-corrected twice. Preserve gross physical ledgers separately and cancel internal transfers with their vectors once. Independently record each raw/WIP/truly unused-unassigned non-WIP physical quantity and every complete historical exchange vector; a mass total cannot replace the vector."
      inputs:
        - Bopen_j
        - converted_raw_R_j
        - justified_attribution
        - Sperformed_j
        - Bclose_j
        - Tlegitimate_j
        - inherited_vectors
      output: "Unnormalized attributed A_j; independent gross physical ledger; independent measured gross V_j"
      source_ids:
        - ilcd-detailed-2010
    - id: normalize_once
      applies_to: "each nonreference inventory row j"
      rule: "q_j = A_j / Q; A_j = attributed extensive amount for the original cohort in the row-native numerator unit; q_j = that amount per 1 m2 reference flow. Execute once only when Q > 0. For postrelease services use linked original-cohort Q and disclose the actual observation horizon. Cards and aggregation reference this single result without another division; the selected finished reference row is the 1 m2 identity. At Q = 0 retain all real loads and stock vectors and issue no unit result. For custody-only physical disclosures of packaging P/I/ER/S/EO/W, FG movements including internal first-release receipt/intact returns/dispatch and damaged Waste ingress/egress, actual repair material/water X legs, declared physical asset movements, real thermal-carrier legs/Product returns and paired internal transfers, the numerator is instead independently measured full gross V_j in its native extensive unit. Use this same sole q_j=V_j/Q once: manufacturing cohort Q, or the same original Q/actual H for postrelease. Do not add history, stock-correct measured gross legs, economically scale them or create another purchase/provider/credit. Actual manufacture and supply/cleaning/repair/treatment burdens stay in A_j separately; the override never deletes them. Carrier kg/state/enthalpy and actual heat MJ are dimensions of one real whole provider; internal circulation cancels and no boiler/heat supply is presumed."
      inputs:
        - A_j
        - Q
        - original_cohort
        - service_horizon_if_applicable
        - V_j
      output: "q_j in row-native numerator unit per 1 m2 reference flow"
      source_ids:
        - ilcd-detailed-2010
    - id: manufacturing_mass
      applies_to: "physical manufacturing gate"
      rule: "On each real wet-state boundary: opening raw/WIP/installed-material stocks plus all actual incoming material/water/gas and returns = closing raw/WIP/installed-material stocks plus Rmass plus every actual outgoing offcut/reject/sample/sludge/liquid/gas and external return. Use real masses and independent phases; do not scale physical legs by allocation or add gross air and its same constituent masses. Internal stage transfers cancel. First-released FG is an output transfer Rmass once, not a second closing manufacturing stock. Parts/water included in a whole supplied article are subaccounts; additional real influx retained in closing wet stock is not cancelled. Report unexplained residual and uncertainty without fitting unknowns."
      inputs:
        - gross_in_out
        - opening_wet_stocks
        - closing_wet_stocks
        - Rmass
        - independent_phase_and_species_evidence
      output: "Manufacturing physical residual; phase and water residuals separately"
      source_ids:
        - nsi-countertops-2022
    - id: fg_service_balance
      applies_to: "FG service gate and combined gate"
      rule: "FGopen + Rmass + gross_R + actual_postrelease_material_water_in = FGclose + gross_G + actual_service_waste_samples_gas_liquid + actual_return_out. Track area and independent real mass/configuration; gross_R need not equal the original shipped mass. Retain original shipment and reversal links, postwork permission/tests/acceptance/disposition and real incremental rework. Combining manufacturing and service cancels Rmass once; never add Q and its released closing FG as two product outputs. This PCR does not normalize by net deliveries; a net-delivery dataset would require a separately complete historical opening/closing FG burden and original-delivery reversal bridge. Record every actual movement and caused load, including unapproved, failed or rejected work. Permission, configuration, required postwork tests and acceptance govern work authorization and continued qualifying-stock eligibility, never whether actual facts are recorded. Natural storage/handling moisture exchange requires no fabricated work permission. Preserve actual hold/disjoint repair-WIP/waste disposition once under original Q and observed H; do not presume restored broken granite. Deduplicate actual material/water only against the same corresponding measured same-side flow term, never a stock, opposite flow or merely an existing card. Actual retained influx and full wet closing stock both remain; a whole wet P/I article embeds its water once."
      inputs:
        - cp_cohort_p_service
        - original_Q
        - Rmass
        - gross_G
        - gross_R
        - actual_added_material_water
        - losses
        - permission_tests_disposition
      output: "FG and combined gross mass bridge; unchanged original Q"
      source_ids:
        - nsi-countertops-2022
    - id: packaging_balance
      applies_to: "each individual packaging article"
      rule: "O_empty + O_attached_WIP + O_attached_FG + O_reusable + P + I + ER + X_in = C_empty + C_attached_WIP + C_attached_FG + C_reusable + S + EO + W + X_out. P is actual purchased whole article; I first non-purchased external ingress; ER external returns received; S gross physical shipment; EO external returns out; W real waste. Internal reuse cancels. X_in/out is each real separately entering/leaving repair material and water species, de-duplicated only against other incoming/outgoing terms, never against closing stock. Whole P/I constituents already counted enter no extra X; newly added material/water retained in closing stock remains a real influx plus full closing wet mass. Retain one upstream owner and real current packaging service without adding packaging to Q or automatically crediting returns. X deduplicates only the same measured corresponding same-side flow term, never an opposite leg or merely an existing card. For one actual co-collected waste stream, article W and actual co-collected stone origins are independently measured conserving non-additive subaccounts; never add components plus the whole event or duplicate treatment."
      inputs:
        - cp_pack_p_service
        - opening_full_wet_stocks
        - P
        - I
        - ER
        - S
        - EO
        - W
        - X_in
        - X_out
        - closing_full_wet_stocks
        - upstream_owner
      output: "Gross packaging residual and separate burden-owner reconciliation"
      source_ids:
        - nsi-countertops-2022
    - id: asset_and_repair
      applies_to: "each machine and each actual part/fluid"
      rule: "Physical asset opening + purchases + transfer_in = closing + transfer_out + retirements, in real Item(s), independently of current service burden. For each installed part/fluid retain opening wet mass plus actual incoming/new/return/X_in = closing full wet mass plus real old-removed/outgoing/return/waste/X_out. X only prevents duplication with other flow terms, never cancels actual influx because it remains in closing stock. Assign justified current service/repair once; carry only unused/unassigned charge, not a performed service for retained FG. Do not charge a whole machine per m2 or fabricate a mass/lifetime/capacity; reconcile complete-provider service overlap. X only deduplicates the same measured corresponding same-side term, never an opposite flow/existing card; real influx and complete wet closing stock both remain."
      inputs:
        - cp_asset_p_asset
        - cp_repair_p_asset
        - cp_water_p_asset
        - gross_physical_legs
        - service_vector
        - provider_scope
      output: "Independent asset and repair physical balances; current and remaining service vectors"
      source_ids:
        - ilcd-detailed-2010
    - id: phase_element_balance
      applies_to: "manufacturing and treatment and gas gates"
      rule: "Reconcile total wet physical mass independently from real mineral-phase, relevant-element and water-species balances. Measure phase identity, free versus adsorbed/structural water, carried formulation water, tool/binder solids and actual chemical change separately; mechanical sawing/polishing is not blanket SiO2 production, calcination or invented cure water. Resolve atmospheric O2/N2/Ar/CO2/H2O gross passages and demonstrated generated species without a second air-aggregate exchange. Unknown composition or one residual cannot establish two unknown phases/species."
      inputs:
        - independent_wet_mass
        - phase_analysis
        - elemental_assay
        - independent_water_and_gas_state
        - actual_chemical_change
      output: "Separate mass and phase and relevant-element and species-water residuals"
      source_ids:
        - nsi-countertops-2022
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and every adopted UUID"
      requirement: "Natural quarried granite with its real mineral assemblage and irregular interlocking crystals; manufactured by cutting and grinding/polishing for architectural countertop use. Native Product identity has Area as its sole reference property; it gives no fixed stone species/grade, geometry, thickness, mass, density, geographic supplier, resin treatment or certification. Declare the actual quarry/stone and petrography, weathering, free moisture, complete drawing and holes/edges, polished faces, any local fill/impregnation and every attached component. Not marble/travertine/alabaster, ceramic tile, agglomerated resin-stone, a pure mineral powder, a flamed tread or an installed kitchen/furniture system. A supplied finished countertop cannot substitute for block/slab manufacturing."
      evidence: "nsi-countertops-2022; ilcd-detailed-2010; the linked original foreground records and full native restrictions"
    - id: dq_supply
      applies_to: "each supplied block/slab and formulation"
      requirement: "Verify actual supply form and completed upstream steps, quarry geography and mineralogy, whole-formulation composition and exactly one upstream burden owner. Preserve every native flow restriction in the card and complete inherited context; a generic provider gap needs real collection, while an incompatible CAS/material/form/route/type/media cannot be excused by classification."
      evidence: "nsi-countertops-2022; ilcd-detailed-2010; the linked original foreground records and full native restrictions"
    - id: dq_complete
      applies_to: "whole original production cohort"
      requirement: "Cover all failures, zero-output, startup/shutdown, idle, cleanup, sampling, rejects and actual rework plus opening/closing raw/WIP and every inherited exchange vector. Missing records are unknown, not zero or absence. Add every actual unlisted single formulation/material/utility/asset/packaging/waste/species with its own card/protocol; collection labels and other/zero hiding are prohibited."
      evidence: "nsi-countertops-2022; ilcd-detailed-2010; the linked original foreground records and full native restrictions"
    - id: dq_sources
      applies_to: "all transferred source claims"
      requirement: "NSI describes surveyed multi-stone production and several factory stages, not one contemporary granite SKU/factory/order. Use the positively supported physical route as transparent technical synthesis; do not transfer its numerical averages, estimated energy increment, proxy materials, implied zero emissions, density, thickness, loss fractions, distances or life. Qualitative ILCD allocation evidence cannot establish an industrial route, and industrial sources cannot establish allocation."
      evidence: "nsi-countertops-2022; ilcd-detailed-2010; the linked original foreground records and full native restrictions"
    - id: dq_release
      applies_to: "first quality release and original service"
      requirement: "Retain actual required tests and acceptance/disposition before the original finished release. Later repeat testing or dispatch does not generate Q; rework permission and postwork testing/acceptance are real evidence requirements, not an assumption that broken stone can be restored. Keep performed services for stored FG and report only unused/unassigned service as remaining charge."
      evidence: "nsi-countertops-2022; ilcd-detailed-2010; the linked original foreground records and full native restrictions"
    - id: dq_physical
      applies_to: "mass and phase and packaging and assets"
      requirement: "Use independent calibrated geometry/mass/state/speciation observations and aligned manufacturing/FG/combined physical gates. Preserve gross legs without economic shrinking, and full closing wet stocks plus real material/water influx. Keep one residual and uncertainty per independent balance; do not solve multiple unknowns from one closure or infer pure quartz from PM."
      evidence: "nsi-countertops-2022; ilcd-detailed-2010; the linked original foreground records and full native restrictions"
    - id: dq_uncertainty
      applies_to: "future foreground dataset"
      requirement: "Record meter/scale/geometry/speciation calibration, sampling coverage, dates and actual site/supplier, missing items, native/provider compatibility, allocation derivations, actual service horizon and sensitivity. A method with required future measurements contains no fabricated factory quantities; an incomplete actual dataset remains inconclusive and cannot claim a measured result."
      evidence: "nsi-countertops-2022; ilcd-detailed-2010; the linked original foreground records and full native restrictions"
validation_rules:
  - rule_id: v_reference
    applies_to: "Reference and unique finished row"
    rule: "Natural quarried granite with its real mineral assemblage and irregular interlocking crystals; manufactured by cutting and grinding/polishing for architectural countertop use. Native Product identity has Area as its sole reference property; it gives no fixed stone species/grade, geometry, thickness, mass, density, geographic supplier, resin treatment or certification. Declare the actual quarry/stone and petrography, weathering, free moisture, complete drawing and holes/edges, polished faces, any local fill/impregnation and every attached component. Not marble/travertine/alabaster, ceramic tile, agglomerated resin-stone, a pure mineral powder, a flamed tread or an installed kitchen/furniture system. A supplied finished countertop cannot substitute for block/slab manufacturing. Verify the selected whole product, native Product/Area identity and all qualifiers; unsupported exact native core identity is a core hold, not an authored-methodology shortcut."
    source_ids:
      - nsi-countertops-2022
      - un-cpc3-2025
  - rule_id: v_basis
    applies_to: "All measurement relationships"
    rule: "Reference amount 1 m2, finished row, actual area Q, raw protocol basis and single A_j/Q result must agree in both languages. Execute every finite measurement check with no skipped relationships; unknown semantics require review. A mechanical pass is neither a measured factory result nor scientific/translation/mapping approval."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: v_physical
    applies_to: "All physical gates and stocks"
    rule: "Check manufacturing_mass, fg_service_balance, packaging_balance, asset_and_repair and phase_element_balance independently with full gross legs, real wet stocks and added material/water retained. Do not subtract ordinary waste loads or already performed service; do not remove released closing FG from first-release Q or count it as a second product."
    source_ids:
      - nsi-countertops-2022
      - ilcd-detailed-2010
  - rule_id: v_completeness
    applies_to: "Atomic inventory and sources"
    rule: "Every actual exchange needs its own physical/chemical name, native extensive unit, condition, collection/calculation chain and source. Recheck each adopted UUID against its full compatible native state and property/unit chain; unresolved auxiliary identity is explicit, not a generic binding waiver. Distinguish missing, absent and measured zero; failed/zero-output campaigns remain in burden/stock accounting and issue no unit result for Q=0."
    source_ids:
      - nsi-countertops-2022
      - ilcd-detailed-2010
published_dataset_profile:
  dataset_role: "Attributional first-release granite-countertop manufacturing inventory with separately attributed original-cohort service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared compatible natural granite slab countertop supply and building-LCA foreground modelling with actual qualifiers and real source coverage"
  excluded_use: "All-37690 coverage; ceramic/artificial/calcareous stone; flamed treads; purchased-finished wrapping shortcut; installed-system or lifetime/certification performance; unqualified kg/item conversion; incomplete actual datasets"
  required_metadata: "quarry and actual stone designation; petrographic mineral phases and fabric; weathering and defects; free moisture; full drawing-specific geometry and real holes or curved edges; thickness and net mass measured independently; actual polished face and edge finish; whole-product component boundary; local resin fill and impregnation formulation/state or evidenced absence; upstream block or prepared-slab processing split; site and year; machinery and provider scope; first quality-release event and acceptance specification/tests; Q area and separate mass/count; original cohort and WIP inherited vectors; gross FG and packaging ledgers; water/phase balances and actual dust/gas species; complete service horizon; allocation basis and residual gate values; uncertainty and evidence gaps"
  required_quality_disclosure: "Full measured and missing foreground scope; exact native/provider compatibility; raw/WIP/FG and service histories; physical balances; normalization and allocation evidence; uncertainty; upstream source coverage; no reported scientific or translation approval by an engineering check"
  update_trigger: "Change in geological stone/configuration, geometry/finish/treatment, supply stage, actual plant route, source/provider identity or gate/normalization/allocation; new evidence or corrected measurements"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD. CPC Ver. 3.0 Explanatory Notes, updated 30 June 2025, PDF p.185 and adjacent pp.182-186. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf; Retrieved 2026-10-20"
    used_for: "Classification scope only: 37690 versus 37610 and cement/artificial stone; not product geometry or LCA allocation."
  - id: "nsi-countertops-2022"
    type: "literature"
    reference: "Natural Stone Institute / Sustainable Minds. Life Cycle Assessment of Natural Stone Countertops, final October 2022, §§2-3, Figure 2 p.12, §§3.2.2-3.2.3 pp.18-21, Figure 3, Table 15 p.26, limitations pp.27-28. https://transparencycatalog.com/assets/uploads/pdf/Final_LCA-report_Stone-Countertop_Oct252022.pdf; Retrieved 2026-10-20"
    used_for: "Primary surveyed block/slab processing and complete countertop fabrication chain, likely consumable and packaging roles, upstream/local and installation separation. No transfer of its mixed-stone averages, assumed density/thickness, energy uplift, proxy materials, transport distances, no-emission reporting or service life to a new granite factory. Industrial evidence does not establish allocation."
  - id: "ilcd-detailed-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition March 2010, §7.9.2-7.9.3, printed pp.255-272 / PDF pp.275-292. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf; Retrieved 2026-10-20"
    used_for: "Qualitative attributional multifunctionality method where allocation is justified: dedicated/virtual subdivision, exchange-specific determining physical causality and residual common-process-gate market value. Not granite manufacturing evidence, numeric factors, consequential substitution or automatic waste credit."
