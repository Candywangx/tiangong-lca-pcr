    reference: "Pittsburgh Corning Europe NV; IBU. FOAMGLAS T3+ EPD-PCE-20260415-IBA1-EN issued2026-08-18 valid to2031-08-17. https://www.foamglas.com/-/media/project/foamglas/public/shared/files/certifications/b---common-certificates/epd-environmental-product-decl/epd-foamglas-t3plus-en.pdf"
    used_for: "Full publisher PDF actual2026 edition: printedpp1–4 product raw ingredients13-stage diagram uncoated release packaging and2023 two-site declared1m3 context. Source density91kg/m3 differs from nominal95; constituent percentages temperatures life-cycle results mass allocation and module-D scenarios are case-specific and not generic defaults."
  - id: "foamglas-process-brochure"
    type: "handbook"
    reference: "Pittsburgh Corning. FOAMGLAS insulation general brochure; publisher retained legacy process illustration p5. https://www.foamglas.com/-/media/project/foamglas/public/corporate/foamglascom/files/brochures/industry/brochures-2019/brochure---foamglas-insulation---general-brochure.pdf"
    used_for: "Complete primary industrial brochure with manufacturing diagram atp5 and adjacent industrial-use context. Historical>66% recycled claim and furnace temperatures are not transferred; this is not an independent second manufacturer or proof of one contemporary plant/order."
