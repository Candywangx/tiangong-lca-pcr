allocation_rules:
  - rule_id: allocate_subdivide
    applies_to: "each shared exchange"
    rule: "For attributional inventory first assign dedicated measured burdens and use physical or virtual subdivision with actual equipment time, metered process or documented engineering model. Preserve real common losses and failed/idle burdens; do not remove them by naming a dedicated step."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocate_causality
    applies_to: "each residual exchange"
    rule: "For remaining shared exchange j, test a determining physical causal relationship to actual product functions and changed output amounts. Different density, milling fineness, foaming recipe, dwell time and thermal condition can change the driver; plant-wide mass allocation in the cited EPD is case practice, not proof of that causality. Do not arbitrarily choose mass, volume, energy or economic shares."
    source_ids:
      - ilcd-attributional-2010
      - foamglas-t3plus-epd-2026
  - rule_id: allocate_residual_value
    applies_to: "genuinely residual multifunctional common process"
    rule: "Only if subdivision and determining physical causality cannot resolve genuine remaining multifunctionality use contemporaneous actual-state market values at the same common process gate, with quantities, currencies, moisture/quality and time aligned. Remove different downstream finishing, transport and sales service before comparing values. Record justification and sensitivity, never a fixed ratio. Saleability of scrap alone does not create a co-product or automatic substitution credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocate_cohort
    applies_to: "all stocks and service"
    rule: "Carry every exchange burden with original material/release cohort through WIP, FG, charges, returns and real repair. Allocate shared service to the actual served cohorts, retain original delivery reverse links and original Q, and keep a separate gross physical ledger. External recycled input treatment and returned packaging follow explicit burden handover and repeated-service records; internal reuse is neither another purchase nor negative credit."
    source_ids:
      - ilcd-attributional-2010
      - bau-foam-glass-pcr-2025
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mfg
      process_id: "manufacture"
      flow_role: "raw materials utilities and auxiliaries"
      record_type: "foreground production records"
      raw_fields: "supplier and whole delivery state; batch recipe; assay and moisture; each raw material mass; original meters and units; actual gas composition state density and LHV; electric supply voltage geography; campaign start stop idle failure rework; raw and non-WIP charge stocks; inherited exchange vectors; inbound transport per material and mode"
      collection_method: "Calibrated scales and meters with receipt/recipe reconciliation and direct equipment logs over the entire real route. Record whole purchased preparations once; validate actual operator flow sheet and individual real fuel/material names. Transport has actual mass distance and mode with separate real fuel/emissions if operated on site, or matched transport-service dataset outside this unit inventory. Retain undivided raw totals. convert_raw and attribute_raw precede the single normalize_exchange result per 1 kg reference flow; collection performs no division."
      unit: "kg; MJ; m3 at declared gas state; original meter units"
      frequency: "each batch and meter interval"
      temporal_coverage: "complete representative period with all zero-output campaigns"
      site_scope: "declared site and equipment boundary through first release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; actual recipe; supplier specification; metering boundaries; stock vectors"
    - protocol_id: cp_balance
      process_id: "manufacture"
      flow_role: "physical mass phase species and emission records"
      record_type: "measurements and laboratory records"
      raw_fields: "each inlet and outlet species; original volume or rate; time; temperature pressure humidity and compressibility; actual exhaust moisture and O2; retained cell gas and residual carbon; glass oxide and sulfate sulfide speciation; wet and dry waste; dissolved and suspended content; real wastewater receiving medium; actual returned water temperature enthalpy; opening closing melt powder block WIP and fluid charge; vector history"
      collection_method: "Independent calibrated mass/volume sampling and actual gas speciation across one consistent control volume. Separate stack from fugitive releases and each receiving medium. Distinguish measured species from analytical indicators; determine gas reactions, bound/free water and phase movement with independent records rather than residual fitting. Validate physical mass and elements before applying burden allocation. Retain undivided original physical/species observations. Use physical_gates separately; only attributed exchange totals enter normalize_exchange once per 1 kg reference flow."
      unit: "kg by species; original m3 or rate; measured state and enthalpy"
      frequency: "each campaign stock boundary and representative species sample"
      temporal_coverage: "same manufacture period and stock history"
      site_scope: "manufacturing physical control volume and actual treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling reports; detection limits; gas calibration; independent elemental assays; moisture and flow-state records"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first_release"
      record_type: "quality release and net weighing"
      raw_fields: "unique release identifier; product configuration; composition and carbon route; actual dimensions and density; closed-cell evidence; thermal conductivity and compressive test method results; applicable standard; anneal cutting and test record; net equilibrated mass; tare and surface condition; first-release time; destructive test loss; closing FG membership"
      collection_method: "Weigh actual uncoated accepted blocks using calibrated scales at recorded equilibrium condition; remove removable packaging and contamination, retain actual cell gases/residual carbon. Link each unique release to tests, lot, geometry and failures. Measure mass and external volume for the same configuration independently rather than importing nominal catalogue density. Collect raw Q in kg only; release_denominator defines Q and first_release represents 1 kg reference flow. No normalization of raw release records during collection."
      unit: "kg; measured dimensions and test units"
      frequency: "each block or traceable weighed lot at first release"
      temporal_coverage: "same selected first-release cohort"
      site_scope: "first release after all required manufacturing quality tests"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; unique release register; test results; tare; traceable configuration and equilibrium state"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "packaging FG returns and services"
      record_type: "cohort stock movement and meter records"
      raw_fields: "original release cohort and Q; original delivery and reversal; opening closing FG; gross dispatch; returns received and sent; breakage; actual repair additions removals; each packaging empty attached WIP attached FG reusable stocks; purchases supplier-included receipts external returned receipts gross outgoing separate returns sent waste; wood paper moisture; actual repair board nail mass and origin; full article versus constituent; inherited exchange vector; raw energy water and fluid charges"
      collection_method: "Weigh each real article/configuration and moisture condition and reconcile mutually exclusive physical stocks and movements. Keep complete FG and packaging gross ledgers even for old cohorts; link return/reversal to original delivery, real repairs and inherited burden. Meter actual storage/handling/packing and cleaning services. Add real repair materials and gas/water changes as individual rows before claiming complete coverage, without inventing them. Collect undivided raw quantities. Reconcile packaging_ledger and physical_gates before attribute_raw; use normalize_exchange once per 1 kg reference flow of the original served cohort and its original Q. Older-cohort service remains separate from unrelated current manufacturing results."
      unit: "kg; MJ; original article counts and moisture"
      frequency: "each movement and matched service meter interval"
      temporal_coverage: "selected release cohort and its original stock history"
      site_scope: "post-release physical and service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock and dispatch records; return links; calibrated article weights; actual repair evidence; inherited vectors; service meter coverage"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each actual raw record to its row unit and declared state before stock/burden attribution. Electricity MJ = kWh * 3.6. Integrate only actual mass/volume rates over measured time; cumulative meter differences and already integrated volumes are amounts and receive no second time multiplier. Use independent substance-specific density at measured state for mass/volume, and actual article mass per configuration for counts. Gas native secondary factors never replace measured density or actual LHV."
      inputs:
        - "raw readings"
        - "unit factors"
        - "measured density and state"
        - "article configuration"
      output: "converted raw totals"
      source_ids:
        - bau-foam-glass-pcr-2025
    - id: attribute_raw
      applies_to: "all inventory rows"
      rule: "Distinguish physical movement quantities from burden/consumption numerators before attribution. For each manufacture exchange j reconcile opening unreleased raw/WIP and unassigned installed/service vector + actual converted additions = corresponding closing unreleased/unassigned vector + first-release transfer B_j^Q + evidenced assignments to other real cohorts/functions. Manufacturing burden A_j is B_j^Q after documented subdivision and any genuine residual allocation; it includes all newly first-released FG even when held at closing, never subtracting that FG vector. Ordinary waste, offcuts, failed lots and destructive tests retain their caused manufacturing and handling/treatment burdens: physical export or sale alone cannot deduct their inherited burden as transferred elsewhere or create a credit. Any assignment elsewhere needs traced distinct cohort/function and the applicable allocation or burden-handover decision. FG history separately reconciles opening FG vector + B_j^Q + actual returns at original dispatch vector + actual service increments = closing FG vector + gross dispatch vector + other traced removals/destinations. Original manufacture is restored on return for tracing, not added again. Service burden A_j includes each actually performed increment for the original served cohort using original Q, even if serviced goods remain in closing FG; correct only disjoint unconsumed/unassigned service or charge inventories. For explicit purchase/receipt, gross dispatch, return and waste movement cards A_j is the converted actual physical movement; maintain burden/consumption vectors separately, without netting unused stock against a gross receipt. Each B retains that exchange numerator/unit, never stock kg substituted for every burden; never correct already stock-adjusted consumption twice. Internal transfers cancel once in the consolidated account."
      inputs:
        - "converted raw totals"
        - "exchange-specific stock vectors"
        - "cohort and return links"
        - "allocation records"
      output: "A_j attributable raw exchange totals"
      source_ids:
        - ilcd-attributional-2010
    - id: release_denominator
      applies_to: "first_release"
      rule: "Q = sum of measured net mass in kg of uniquely first-released blocks/slabs of the selected product cohort after required quality tests. Use recorded equilibrium state and remove packaging and surface contamination; keep true retained cell gas and residual carbon. Pre-release failures/test destruction are excluded; their burdens remain. First-released closing FG is already in Q. Dispatch, return, repair and retesting add no Q."
      inputs:
        - cp_release
        - "unique release registry"
        - "net mass"
        - "quality tests"
      output: "Q in kg"
      source_ids:
        - foamglas-t3plus-epd-2026
        - foamglas-t3plus-pds-2025
        - bau-foam-glass-pcr-2025
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "q_j = A_j / Q for Q > 0. Execute this single division after convert_raw and attribute_raw; q_j is the exchange per 1 kg reference flow for the same release cohort. For Q = 0 retain A_j and raw burdens without a unit result. Flow cards and protocol aggregation only reference this same computed result and never divide again."
      inputs:
        - A_j
        - Q
        - convert_raw
        - attribute_raw
        - cp_release
      output: "q_j per 1 kg reference flow"
      source_ids:
        - ilcd-attributional-2010
        - bau-foam-glass-pcr-2025
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "Manufacturing: opening raw + opening WIP + opening non-WIP charges + external supplied materials + measured gross inlet gas species = closing raw + closing WIP + closing charges + Q + each physical exported waste + each measured outlet species + each actual product return. FG service: opening FG + first-release internal receipt + external returned FG + actual repair additions + measured physical uptake = closing FG + gross dispatch + standalone external FG return + scrap + repair removals + measured gas/water loss. Apply consistent wet/phase/thermal bases and independently measured relevant elements and chemical species; one residual is not two measurements. Consolidation cancels manufacture-to-service receipt. Manufacture closing excludes already first-released FG; the combined gate cancels internal Q and first-release vectors, not completed manufacturing or performed service. Gross carrier-gas observations serve physical closure; report actual environmental withdrawal or new process release with independent origin, reaction, retention, phase and native-flow convention evidence. Equal chemical names do not make resource-input and emission UUIDs interchangeable or establish a characterization offset. Do not add closing FG to production Q or report retained cell gas as external emission."
      inputs:
        - cp_mfg
        - cp_balance
        - cp_release
        - cp_service
        - "independent species and phase measurements"
      output: "separate and consolidated physical and elemental gates"
      source_ids:
        - foamglas-t3plus-epd-2026
        - bau-foam-glass-pcr-2025
    - id: packaging_ledger
      applies_to: "all inventory rows"
      rule: "For EACH actual packaging article: opening empty + opening attached WIP + opening attached FG + opening reusable + new purchases + supplier-included receipts + external returns received = closing empty + closing attached WIP + closing attached FG + closing reusable + with gross physical shipments + standalone external returns sent + waste. All categories are mutually exclusive and each receipt counted once. Add real article water uptake/loss and actual repair-part additions/removals as separate measured terms when needed; keep complete pallet and repair components distinct without counting constituents twice. Internal reuse cancels; burden allocation and inherited exchange vectors remain separate. Packaging never enters Q or automatic co-product credit."
      inputs:
        - cp_service
        - "article stocks"
        - "physical receipts and dispatch"
        - moisture
        - "real repairs"
        - "inherited vectors"
      output: "each article physical ledger and burden reconciliation"
      source_ids:
        - foamglas-t3plus-epd-2026
        - bau-foam-glass-pcr-2025
        - ilcd-attributional-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Every row retains full native restrictions and actual matched provider/state; UUID is not a default amount, conformity certificate or proof of recipe. Unresolved auxiliaries remain single named exchanges."
      evidence: "Native direct records; provider specification; actual product tests"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Retain complete raw meter coverage with zero-output failures start/stop and idle. Separate representative production data from legacy supplier examples and manufacturer marketing claims."
      evidence: "Raw readings; calibrated logs; cohort register"
    - id: dq_species
      applies_to: "all physical gates"
      requirement: "Measure phase and molecular species independently of total mass/element balance. Cell-retained CO2 and residual carbon, sulfate/sulfide, actual free/reaction/structural water and exhaust O2 require genuine evidence. Keep indicators and molecular species distinct."
      evidence: "Independent analytical speciation; phase records; uncertainty and detection limits"
    - id: dq_stocks
      applies_to: "all stocks and service"
      requirement: "Each raw/WIP/FG/charge/packaging stock has physical quantity and inherited vector per exchange. Preserve original release and delivery reversals; actual rework additions and moisture/species changes are not silently ignored."
      evidence: "Opening closing measurements; cohort links; vector history; real repair documents"
    - id: dq_unknown
      applies_to: "dataset completion"
      requirement: "Unknown, absent, measured zero and below detection are different states. Missing actual core route, terminal or unresolved causal relationship stays a true hold. Provider matching, unbound auxiliaries and future site activity quantities remain explicit ordinary production gaps; no fabricated default or scientific approval."
      evidence: "Gap register; applicability decisions; raw observations"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "reference product and route"
    rule: "Verify actual unfaced closed-cell carbon-foamed glass slab/block from the entire manufacturing route and actual release tests, dimensions, density and surface condition. Generic Glass (formed & finished) does not certify closed cells, building suitability, thermal conductivity, compressive strength or any legal compliance. Do not apply the entire CPC leaf to one product or replace carbon-black foaming with a different foaming agent."
    source_ids:
      - foamglas-route
      - foamglas-t3plus-epd-2026
      - foamglas-t3plus-pds-2025
      - bau-foam-glass-pcr-2025
  - rule_id: validate_identity
    applies_to: "each inventory row"
    rule: "Check whole direct native basename, all synonyms/comments, CAS, grade, route, geography, form/particle structure, medium, type, every property and exact reference chain before UUID adoption. Retain each restriction in the description and actual provider evidence. Isolated taxonomy defects are disclosed separately from physical consistency; hard CAS/route/media contradictions are not waived."
    source_ids:
      - bau-foam-glass-pcr-2025
  - rule_id: validate_physical
    applies_to: "manufacturing service and consolidated gates"
    rule: "Close gross manufacturing and FG-service physical gates independently and then cancel matching internal transfers. Include all actual species, water phases, cell-retained gas/carbon, dust and moisture using independent measured composition and phase evidence. Keep physical mass/element conservation independent of burden allocation. Unknowns and imbalance retain explicit uncertainty/hold; never fit two unknown reactions by one residual."
    source_ids:
      - foamglas-t3plus-epd-2026
      - bau-foam-glass-pcr-2025
  - rule_id: validate_normalization
    applies_to: "all raw quantities"
    rule: "Convert units/state first, reconcile stock and historical vectors and allocate second, execute normalize_exchange once as A_j/Q last. Collection retains undivided raw data; cards and aggregation reference that same result and never divide it again. Q=0 retains all real raw burdens without a unit result. Manufacturing production Q, gross shipments and net deliveries are distinct. Require the attribute_raw distinction between first-release manufacture, already performed service, unassigned inventories and physical movement; neither closing FG nor ordinary waste export automatically removes caused burdens."
    source_ids:
      - ilcd-attributional-2010
      - bau-foam-glass-pcr-2025
  - rule_id: validate_packaging
    applies_to: "each packaging article"
    rule: "Require complete mutually exclusive opening/closing empty, WIP-attached, FG-attached and reusable stocks; new purchases; supplier-included physical receipts; external returns received; packaging with gross physical shipment; standalone external returns sent and waste. Count only one physical receipt per article. Internal reuse cancels and does not change Q. Identify real wood/paper moisture, nails, replacement boards and other actual repair parts separately from complete pallet purchases; do not invent repairs."
    source_ids:
      - foamglas-t3plus-epd-2026
      - bau-foam-glass-pcr-2025
      - ilcd-attributional-2010
  - rule_id: validate_coverage
    applies_to: "dataset completion"
    rule: "Actual unknown core manufacturing/terminal or causal burden relationship prevents a completed dataset claim. Preserve failed retrievals, source edition differences, mechanical applicability mismatches and unknown/absent/zero/below-detection separately. Ordinary future site measurements, provider matching and auxiliary UUID gaps remain explicit data-production requirements; technical projection/measurement checks do not establish scientific, translation, mapping or publication approval."
    source_ids:
      - foamglas-t3plus-epd-2026
      - bau-foam-glass-pcr-2025
      - ilcd-attributional-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified upstream actual uncoated cellular-glass product at declared first-release state; separately reported original-cohort packaging/handling services as applicable"
  allowed_use: "Compatible composition route state density performance and provider boundary; transparent measured kg-to-volume conversion where needed"
  excluded_use: "Automatic EN15804 or product certification; arbitrary material-grade thermal equivalence; replacing full glass manufacture with repacking; coated product or gravel; using gross shipment or net delivery as Q; automatic avoided-energy or moduleD credit"
  required_metadata: "uncoated closed-cell block or slab and declared function; carbon-black particle grade structure and supplier route; glass constituents and whole supplied forms; cullet origin treatment and burden handover; actual melting milling mould foaming anneal cutting route; density and external dimensions measured for same configuration; thermal and mechanical test method results and applicable product standard; unique first quality release cohort and original Q; equilibrium surface moisture and retained-cell gas state; raw WIP FG and non-WIP charge quantities with exchange history; failure idle start-stop and zero-output coverage; actual gas composition pressure temperature density LHV and meter state; electricity geography voltage mix and provider boundary; independent mass element molecular-species and water-phase evidence; packaging article composition moisture stocks gross movements and real repairs; original delivery reversal and returned FG incremental rework links; actual external water-return state enthalpy and supplier convention; allocation subdivision causality residual gate and period evidence"
  required_quality_disclosure: "Original raw quantities and conversions; actual coverage and failures; every physical gate and exchange-specific stock vector; molecular and phase evidence; original cohort service boundary; all identity/provider limitations; unresolved auxiliary UUIDs; unknown and detection-limit distinctions"
  update_trigger: "Changed core chemistry forming or product state; coating/facing; actual supplier route/form/geography; gas reference state; electricity mix/voltage; quality standard; stock cohort or allocation method"
