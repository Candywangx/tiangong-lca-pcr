    type: "handbook"
    reference: "Owens Corning. FOAMGLAS T3+ Product Data Sheet version08.05.2025. https://www.foamglas.com/-/media/project/foamglas/public/shared/files/foamglas-b/foamglas-t3-plus/pds/pds-foamglas-t3plus-int-en.pdf"
