system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Include actual virgin minerals and externally supplied compatible cullet with upstream burdens and inbound transport through batch mixing, melting, cooled-glass milling with carbon black, filling steel moulds, thermal cellulation, controlled annealing, rectangular cutting/grinding, inspection and first quality release. Keep each real raw ingredient, fuel, electricity, water, auxiliary and outlet atomic. Purchased finished foam-glass packing alone cannot satisfy this manufacturing scope."
      source_ids:
        - foamglas-route
        - foamglas-t3plus-epd-2026
        - foamglas-process-brochure
    - rule_id: boundary_reference_gate
      applies_to: "manufacture and service"
      rule: "Q is the calibrated net mass in kg of unique first-released uncoated closed-cell blocks after required tests, at declared equilibrium condition. Retained cell gases and residual carbon belong to actual product mass; removable packaging does not. Failed lots and pre-release destructive samples do not enter Q; their real burdens remain. Newly released closing FG is already included in Q. Delivery, reinspection, repair, return and later shipment do not create production. The reference row is first_release only."
      source_ids:
        - foamglas-t3plus-epd-2026
        - foamglas-t3plus-pds-2025
        - bau-foam-glass-pcr-2025
    - rule_id: boundary_stocks
      applies_to: "all inventory rows"
      rule: "Retain full representative period, start/stop, zero-output, idle, cleaning, failures and rework. Measure opening/closing raw materials, melt, powder and block WIP and non-WIP charges of oil, cooling water and other actual fluids separately. Each stock has its own physical quantity and exchange-specific inherited burden vector. Keep any included mould/tool/equipment asset physical stock separate from its documented remaining and consumed service vectors, with no invented life or repeated whole-asset procurement. Manufacture closing contains only unreleased raw/WIP and unassigned charge/service inventory, not already first-released FG. Raw meter consumption already corrected for charge change is not adjusted again. Internal scrap returns and interstage transfers cancel in consolidation and never become new purchases."
      source_ids:
        - foamglas-t3plus-epd-2026
        - bau-foam-glass-pcr-2025
        - ilcd-attributional-2010
    - rule_id: boundary_fg_services
      applies_to: "service"
      rule: "Keep physical receipts from first release, opening/closing FG by cohort, gross dispatch, external returns received, original-delivery reversals, standalone external returns sent, breakage and real repair additions/removals, moisture and gas changes. Returning or reworked FG retains its original release and inherited vector. Service burdens are assigned to the original served release cohort using its original Q, with actual incremental repair only; older FG and reversals cannot be transferred to unrelated current Q. Manufacturing transfers and service receipts cancel when consolidated. Already performed original-cohort service remains in its A_j even when goods stay in closing FG. No net-delivery denominator is substituted."
      source_ids:
        - foamglas-t3plus-epd-2026
        - bau-foam-glass-pcr-2025
        - ilcd-attributional-2010
    - rule_id: boundary_species
      applies_to: "manufacture and service"
      rule: "Keep full physical mass and C/S/N/O/H and other relevant elements independently from reaction-species and phase evidence. Include actual gross wet air inlet/outlet with each gas separately, product-retained gas/carbon, offcuts, dust and treatment outlets. Do not fit two unknowns with one residual, infer a gas reaction yield from cell density, turn NOx/COD/VOC into named chemical mass, or treat cell gas as a new external purchase. Actual additional raw materials, scrubber reagents, filter consumables, repair parts and newly detected species require separate cards and collection before completion; no other-flow bundle or unsupported zero."
      source_ids:
        - foamglas-t3plus-epd-2026
        - bau-foam-glass-pcr-2025
    - rule_id: boundary_supply
      applies_to: "all inventory rows"
      rule: "Every whole purchased preparation, mineral, article or supplied mixture is one purchase of the complete delivery state; assay, carrier water and active substance are constituent subaccounts, never additional purchases of the same material. Removable transport packaging has its own physical receipt ledger; identify supplier-included burden and do not purchase that embodied burden twice. Actual on-site formulation uses each bought ingredient with real mixing energy, loss and water. Match all native UUID restrictions and provider geography, route, form, medium and reference property; unidentified aux UUIDs do not remove exchanges. Disclose upstream recovery/end-of-waste and burden handover rather than assuming recycled input is free or crediting offcuts."
      source_ids:
        - foamglas-t3plus-epd-2026
        - bau-foam-glass-pcr-2025
        - ilcd-attributional-2010
    - rule_id: boundary_water_heat
      applies_to: "manufacture and service"
      rule: "Distinguish supplied water, carrier/free/structural/reaction water, wet sludge and actual atmospheric humidity and condensate origin. Use independently measured substance-specific density and thermal state; a liquid/gas integrated volume is already an amount, whereas only a true rate is integrated over time. Actual external heat-exchange water/condensate returns are Product exchanges at measured temperature/enthalpy under the supplier water-energy convention. Do not invent a steam system, boiler, condensate yield, exported heat or automatic energy credit from a recovery arrow."
      source_ids:
        - foamglas-t3plus-epd-2026
        - bau-foam-glass-pcr-2025
    - rule_id: boundary_exclusions
      applies_to: "dataset applicability"
      rule: "Exclude coated/faced/bituminous boards, aggregate/gravel, fibre wool, open-cell acoustic foam, cold-bonded glass agglomerates, insulating glazing units, pressed solid glass bricks, mirrors, tempering and installed systems. Carbonate-only, glycerine/waterglass or SiC foaming is not this carbon-black route. Ordinary surface trimming remains included; actual changed core chemistry/forming requires new applicability assessment. The source EPD cradle-to-grave modules and BAU programme declarations do not turn this manufacturing PCR into a complete EPD or authorize module-D credit."
      source_ids:
        - foamglas-route
        - foamglas-t3plus-epd-2026
        - foamglas-t3plus-pds-2025
        - bau-foam-glass-pcr-2025
