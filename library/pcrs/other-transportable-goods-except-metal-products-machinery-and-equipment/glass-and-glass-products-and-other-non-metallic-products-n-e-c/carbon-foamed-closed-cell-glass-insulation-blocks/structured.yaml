    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for LCA Detailed guidance First edition March2010 §§7.9.2–7.9.3. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality only: dedicated/virtual subdivision then exchange-specific determining physical causality and only genuinely residual actual-state contemporaneous common-process-gate market-value allocation. No industrial process recipe factor default percentage or automatic substitution credit."
