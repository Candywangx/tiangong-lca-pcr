  ordinary_gaps:
  - Actual future site quantities, product tests, supplier preparation/grade and provider state/geography matching
    are required; no fabricated defaults.
  - Unbound auxiliaries, particular emission media and exact waste identities require actual matches before dataset
    finalization; they remain atomic exchanges.
  - Generic formed-finished-glass identity contains no closed-cell grade or conformity evidence; complete qualified
    route and actual terminal tests are mandatory.
  - Conditional soda-ash95% natural-alkali and CN below1kV grid electricity identities require replacement if actual
    supplies differ.
  true_methodology_holds: []
  native_identity_notes:
  - Rejected generic glass feed-grade route and insulating glazing unit are not this product. Generic Glass (formed
    & finished) has no native route/grade/property contradiction and Mass/kg, but cannot establish actual cellular
    performance.
  - Carbon black CAS1333-86-4 solid particle aggregates is not graphite/dye/SiC; isolated graphite taxonomy retained
    separately.
  - Soda-ash carboxylic-acid, PE-film luggage and wooden-pallet electricity taxonomy defects are isolated from coherent
    physical identities; all fixed supply restrictions retained in each typed description.
  - Rejected Jiangsu2012 CHP gas has fixed composition/geography; selected gaseous natural gas uses native Volume/m3
    and actual measured state, with no native secondary-factor density assumption.
  - Rejected quicklime candidate has native Volume reference with no bulk density. Indoor SO2, freshwater water-vapour,
    soil NO and nitrite CAS candidates are incompatible with air emissions.
  - Supplementary matching outdoor-air O2 N2 SO2 and water-vapour identities were separately queried/direct-read
    with exact versions and Mass/kg; no indoor/water/soil substitution. NO2 native aliases exclusively mention N2O4;
    H2S aliases mix elemental/polysulfide substances; argon aliases include radioactive isotope; these cautious
    unresolved identities remain specific unbound exchanges rather than forced matches.
  - Paper label Product is printed sticker-use GLO at plant; used lubricating oil Waste does not prescribe treatment;
    solid glass-production Waste does not impose wafer or fixed disposal route. Their full native limitations remain
    in row descriptions.
  pallet_supply_stage: UUID-bearing wooden-pallet exchanges retain production mix in the lumber mill and wooden
    board/slat supply; actual provider linkage must match that stage. Waste and repair-part identities remain separate.
  measurement_basis: Q is uniquely first-released equilibrated net block/slab kg including real cell gas/residual
    carbon; new closing FG is included once. Convert raw and reconcile per-exchange inherited stock vectors then
    allocate and normalize A_j/Q once. Post-release services retain gross physical ledgers and original cohort Q;
    no net-delivery substitution. First-release manufacturing B_j^Q includes held closing FG and already performed
    original-cohort service remains in its A_j. Closing correction applies only to unreleased or unconsumed/unassigned
    inventories. Ordinary waste export alone never deducts caused manufacturing burdens. Physical gross movements
    and included asset stocks remain distinct from allocated burdens and documented service vectors.
