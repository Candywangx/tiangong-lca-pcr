measurement_rules:
  - id: reference_dry_mass
    applies_to: "Finished cement reference output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory amounts to exactly 1,000 kg net dry finished cement; exclude packaging tare and reconcile moisture or loss-on-drying treatment with the declared product specification."
  - id: component_mass_fractions
    applies_to: "Clinker, gypsum or calcium sulfate, slag, fly ash, pozzolana, limestone, aluminous constituents, and other main additions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg and dry-mass fraction"
    rule: "Calculate every constituent fraction from reconciled dry mass entering the declared cement product; do not infer a category-average recipe."
  - id: clinker_factor
    applies_to: "Portland and blended cement routes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg/kg cement"
    rule: "Report net clinker consumed per net finished cement output for the represented product or production-weighted mix; report a route-appropriate hydraulic-intermediate ratio instead for aluminous cement when Portland clinker is not the intermediate."
  - id: thermal_energy_basis
    applies_to: "Kiln, dryer, and other thermal fuel use"
    required_property_ref:
      name: "Energy based on lower heating value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert each recorded fuel quantity using a source- and period-specific lower heating value, and keep kiln, non-kiln, fossil, alternative, mixed, and biogenic fuel categories separate."
  - id: electricity_basis
    applies_to: "Grinding, conveying, blending, storage, packing, pollution control, and conditional clinker production"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Use metered purchased and on-site-generated electricity by process where available; report exports separately and do not use a regional default as a foreground reading."
  - id: transport_service_basis
    applies_to: "Inbound constituent, fuel, and packaging transport"
    required_property_ref:
      name: "Transport service"
      uuid: ""
    required_unit: "tonne-kilometre"
    rule: "Calculate transported dry mass multiplied by actual route distance for each mode and route; keep supplier and transport geography explicit."
process_map:
  - id: integrated_clinker_production
    name: "Integrated clinker or hydraulic-intermediate production"
    inclusion: "conditional"
    inclusion_condition: "Include when clinker or another hydraulic intermediate is produced inside the declared cement foreground system; otherwise use a qualified upstream supplier dataset."
    role: "Produce the route-specific hydraulic intermediate and record kiln raw materials, fuels, electricity, direct emissions, dust, and wastes."
    quantitative_reference: "Reconciled intermediate mass consumed by the represented cement output"
  - id: constituent_receipt_and_preparation
    name: "Constituent receipt and preparation"
    inclusion: "required"
    inclusion_condition: "Include receipt, inbound transport, storage, crushing, drying, and preparation steps that occur before final grinding or blending."
    role: "Establish product-specific dry constituent inputs and supplier identities."
    quantitative_reference: "Dry constituent mass delivered to cement finishing per reference flow"
  - id: cement_grinding_and_blending
    name: "Cement grinding, blending, and homogenization"
    inclusion: "required"
    inclusion_condition: "Include inter-grinding, separate grinding, blending, conveying, process dust control, and internal recirculation used for the declared product."
    role: "Convert clinker or other hydraulic intermediates and additions into finished cement."
    quantitative_reference: "Net bulk finished cement sent to storage per reference flow"
  - id: storage_quality_and_dispatch
    name: "Storage, quality control, packing, and dispatch"
    inclusion: "required"
    inclusion_condition: "Include silos, quality testing, loading, and conditional bagging or other packaging through the factory gate."
    role: "Release conforming bulk or packaged cement as the reference product."
    quantitative_reference: "1,000 kg net dry finished cement"
