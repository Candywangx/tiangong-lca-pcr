system_boundary:
  rules:
    - rule_id: boundary_cradle_to_gate
      applies_to: "Product system"
      rule: "Include upstream production and transport of constituents and energy, conditional on-site clinker or hydraulic-intermediate production, component preparation, grinding or blending, storage, quality control, pollution control, packing when applicable, and factory-gate dispatch."
      source_ids:
        - gcca-cement-co2-energy-protocol-v3-1
        - eu-jrc-clm-bref-2013
        - epd-international-cpcr-001
    - rule_id: boundary_product_exclusions
      applies_to: "Reference product"
      rule: "Exclude clinker as the reference output, concrete, mortar, refractory compositions, cement articles, and downstream construction or use; model those products under their own product systems."
      source_ids:
        - unsd-cpc-3-0-explanatory-notes-2024
        - gcca-cement-co2-energy-protocol-v3-1
    - rule_id: boundary_product_differentiation
      applies_to: "Product and market mixes"
      rule: "Keep Portland, blended, slag, aluminous, and other hydraulic cement formulations separate unless a disclosed production-volume-weighted mix is the declared reference product; never extrapolate one grade, plant, or region to the whole category."
      source_ids:
        - epd-international-cpcr-001
        - iso-14044-2006
    - rule_id: boundary_energy_and_fuels
      applies_to: "Energy inventory"
      rule: "Separate electricity from thermal energy and kiln fuels from non-kiln fuels; identify conventional fossil, alternative, mixed, and biomass fuels, their lower heating values, fossil and biogenic fractions, and use location."
      source_ids:
        - gcca-cement-co2-energy-protocol-v3-1
    - rule_id: boundary_emissions_and_internal_loops
      applies_to: "Direct releases, dust, and rework"
      rule: "Assign direct releases to the process where they occur; disclose monitoring or calculation method; keep returned dust and internal rework as internal loops; report externally treated dust, off-spec cement, and other wastes once at the boundary."
      source_ids:
        - gcca-cement-co2-energy-protocol-v3-1
        - eu-jrc-clm-bref-2013
    - rule_id: boundary_delivery_form
      applies_to: "Storage and dispatch"
      rule: "Include packaging manufacture and packing losses for packaged cement; omit packaging for bulk cement and declare the loading and factory-gate delivery condition in both cases."
      source_ids:
        - epd-international-cpcr-001
boundary_abstraction:
  declared_starting_condition: "Primary minerals, industrial by-products or secondary constituents, clinker or other hydraulic intermediates, fuels, electricity, water, packaging, and transport services at their documented upstream source or supplier boundary"
  starting_condition_role: "Cradle-to-gate upstream inputs feeding a product-specific cement foreground system"
  product_classification_scope: "Finished hydraulic cements corresponding to the semantic product boundary represented by CPC 3.0 code 37440; classification is context, not canonical PCR identity"
  recursive_input_rule: "Externally purchased cement used as an input shall use a separate upstream cement dataset with its own qualifiers; internal returned cement, recirculated dust, and rework remain internal loops and shall not be counted again as gross product inputs or outputs."
  upstream_dataset_requirement: "Use source-, technology-, geography-, and period-representative datasets for clinker or other hydraulic intermediates, supplementary constituents, fuels, electricity, transport, and packaging. Purchased clinker shall carry its upstream quarrying, raw-meal, kiln, fuel, electricity, and direct-emission burdens rather than being treated as burden-free."
  disclosure: "Declare facilities and route, product formulation and production weights, constituent origins and status, clinker or hydraulic-intermediate factor, kiln and non-kiln energy separation, fuel categories and biogenic fractions, electricity supply, direct emissions, dust and waste treatment, delivery form, geography, period, allocation, exclusions, and data gaps."
