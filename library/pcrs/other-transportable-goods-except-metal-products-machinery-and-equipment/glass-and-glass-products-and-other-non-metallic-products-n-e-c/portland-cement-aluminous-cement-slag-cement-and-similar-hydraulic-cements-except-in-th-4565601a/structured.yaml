allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Shared facility processes"
    rule: "Prefer product-line metering, batch records, silo identity, and process subdivision so that clinker production, constituent preparation, grinding, blending, storage, and packing burdens are assigned directly before any allocation."
    source_ids:
      - iso-14044-2006
      - epd-international-cpcr-001
  - rule_id: allocation_clinker_transfers
    applies_to: "Produced, purchased, sold, and internally transferred clinker"
    rule: "Use a reconciled clinker mass balance; count upstream clinker production once, include purchased clinker as an upstream product input, and do not treat internal transfers or stock movements as new production."
    source_ids:
      - gcca-cement-co2-energy-protocol-v3-1
  - rule_id: allocation_multi_product_cement
    applies_to: "Shared grinding, blending, storage, and dispatch"
    rule: "Assign directly metered inputs and releases first. Allocate only the remaining shared burden using a documented physical driver that reflects the shared operation, such as dry throughput, mill time, metered energy, or packing count; disclose the driver and affected products."
    source_ids:
      - iso-14044-2006
      - epd-international-cpcr-001
  - rule_id: allocation_product_mix
    applies_to: "Declared production-volume-weighted cement mix"
    rule: "Weight product-specific inventories by reconciled net dry output over the same site and reporting period. Do not use an unweighted average or combine materially different sites, regions, routes, or product families without explicit scope justification."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_secondary_constituents_and_fuels
    applies_to: "Slag, fly ash, waste-derived constituents, alternative fuels, and other secondary inputs"
    rule: "Preserve the upstream dataset's documented waste, by-product, recycling, and allocation convention. Do not assume zero upstream burden or grant an avoided-burden credit without an explicitly selected programme rule and disclosed sensitivity."
    source_ids:
      - iso-14044-2006
      - epd-international-cpcr-001
  - rule_id: allocation_internal_recycling
    applies_to: "Returned dust, internal rework, and off-spec cement returned to production"
    rule: "Model internal recirculation as an internal loop without a co-product credit; record only additional energy, losses, and material that cross the foreground boundary."
    source_ids:
      - gcca-cement-co2-energy-protocol-v3-1
dataset_production:
  collection_protocols:
    - protocol_id: cp_cement_composition_and_output
      process_id: "constituent_receipt_and_preparation_cement_grinding_and_blending_storage_quality_and_dispatch"
      flow_role: "constituent inputs, formulation, net cement output, product qualifiers"
      record_type: "batch tickets, weighbridge records, dosing system, laboratory and silo records"
      raw_fields: "product code; standard; strength class and ages; constituent identity and supplier; wet and dry mass; moisture; batch or silo; output mass; lot; route; delivery form"
      collection_method: "Reconcile batch formulation, calibrated scales, silo transfers, and laboratory release records to the declared product."
      unit: "kg dry mass and mass fraction"
      frequency: "Per batch or lot, aggregated monthly"
      temporal_coverage: "One representative continuous reporting period, normally 12 months unless seasonality and campaign production are otherwise justified"
      site_scope: "Every facility contributing to the declared product"
      aggregation_rule: "Sum dry constituent and net output masses by product; calculate production-weighted values only from disclosed product outputs."
      quality_evidence: "Scale calibration; laboratory certificate; formulation approval; stock reconciliation; signed production report"
    - protocol_id: cp_intermediate_mass_balance
      process_id: "integrated_clinker_production_constituent_receipt_and_preparation"
      flow_role: "produced, purchased, sold, transferred, stocked, and consumed clinker or hydraulic intermediate"
      record_type: "weighbridge, production meter, stock survey, transfer and purchase records"
      raw_fields: "intermediate type; supplier; produced; purchased; sold; internal in and out; opening and closing stock; consumed dry mass"
      collection_method: "Reconcile the complete site mass balance by intermediate type and product use."
      unit: "kg dry mass"
      frequency: "Monthly with annual reconciliation"
      temporal_coverage: "Same reporting period as cement output"
      site_scope: "All producing and receiving facilities in scope"
      aggregation_rule: "Opening stock plus production plus purchases plus transfers in equals consumption plus sales plus transfers out plus closing stock, subject to documented reconciliation variance."
      quality_evidence: "Stock survey; calibrated scales; invoices; transfer records; management-approved reconciliation"
    - protocol_id: cp_fuel_and_thermal_energy
      process_id: "integrated_clinker_production_constituent_receipt_and_preparation"
      flow_role: "kiln, calciner, drying, and other thermal fuels"
      record_type: "meter, weighbridge, invoices, fuel laboratory and supplier certificates"
      raw_fields: "fuel identity; use location; mass or volume; moisture; lower heating value; fossil carbon; biogenic carbon; alternative-fuel status"
      collection_method: "Measure each fuel stream and pair it with source- and period-specific fuel properties."
      unit: "kg, Nm3, MJ lower heating value"
      frequency: "Per delivery and meter period, aggregated monthly"
      temporal_coverage: "Same reporting period as production"
      site_scope: "Each kiln, dryer, and thermal unit"
      aggregation_rule: "Sum energy by fuel and use location; retain fossil, alternative, mixed, and biomass categories separately."
      quality_evidence: "Meter calibration; weighbridge record; fuel analysis; supplier certificate; fuel ledger"
    - protocol_id: cp_process_electricity
      process_id: "all_processes"
      flow_role: "electricity by process and supply type"
      record_type: "submeter, utility invoice, on-site generation and export meter"
      raw_fields: "purchased electricity; on-site generation; process consumption; export; meter boundary; voltage; supplier and geography"
      collection_method: "Use process submeters where available; otherwise allocate residual shared electricity with a documented physical driver."
      unit: "kWh"
      frequency: "Continuous or invoice period, aggregated monthly"
      temporal_coverage: "Same reporting period as production"
      site_scope: "Each facility and process in scope"
      aggregation_rule: "Purchased plus on-site electricity consumed minus separately reported exports; do not net exports against unrelated process consumption."
      quality_evidence: "Meter calibration; utility invoice; generation and export records; allocation workbook"
    - protocol_id: cp_direct_air_emissions
      process_id: "integrated_clinker_production_cement_grinding_and_blending"
      flow_role: "direct fossil and biogenic CO2, NOx, SO2, particulate fractions, and other regulated releases"
      record_type: "continuous monitoring, stack test, permit report, mass balance or approved calculation"
      raw_fields: "pollutant; flow identity; concentration; gas flow; operating hours; measured mass; calculation inputs; fossil and biogenic split; particle fraction"
      collection_method: "Prefer measured releases; where calculated, retain formula, factors, measurement inputs, and approval basis."
      unit: "kg and supporting monitoring units"
      frequency: "Continuous monitoring or each required test period"
      temporal_coverage: "Same reporting period as production and covering normal and relevant abnormal operation"
      site_scope: "Every emitting point in the declared system"
      aggregation_rule: "Sum by matched elementary flow and emitting process; do not map an unspecified dust result to a size-specific flow."
      quality_evidence: "Calibration and QA report; stack-test report; permit submission; calculation workbook"
    - protocol_id: cp_dust_rework_and_waste
      process_id: "integrated_clinker_production_cement_grinding_and_blending"
      flow_role: "returned dust, internal rework, off-spec cement, external recycling, treatment and disposal"
      record_type: "dust collector, weighbridge, stock, waste transfer and rework records"
      raw_fields: "material; dry mass; origin; internal return; external destination; treatment; stock change"
      collection_method: "Reconcile dust and off-spec material by origin and destination, separating internal loops from boundary-crossing waste."
      unit: "kg dry mass"
      frequency: "Monthly"
      temporal_coverage: "Same reporting period as production"
      site_scope: "All dust-control and rework points"
      aggregation_rule: "Internal returns are not external outputs; sum only measured external destinations as waste outputs."
      quality_evidence: "Waste manifest; weighbridge record; collector log; rework authorization; stock reconciliation"
    - protocol_id: cp_inbound_transport
      process_id: "constituent_receipt_and_preparation"
      flow_role: "inbound clinker, constituents, fuels, and packaging"
      record_type: "supplier dispatch, weighbridge, carrier and route records"
      raw_fields: "material; supplier origin; destination; mode; distance; payload; mass; backhaul assumption"
      collection_method: "Match each delivered mass to its actual route and mode; document route estimates when carrier records are incomplete."
      unit: "tonne, km, tonne-kilometre"
      frequency: "Per shipment, aggregated monthly"
      temporal_coverage: "Same reporting period as production"
      site_scope: "All included suppliers and receiving facilities"
      aggregation_rule: "Sum mass multiplied by route distance by material, supplier, mode, and route."
      quality_evidence: "Bill of lading; weighbridge ticket; carrier record; route evidence"
    - protocol_id: cp_water_balance
      process_id: "cement_grinding_and_blending"
      flow_role: "withdrawals, consumed water, recirculation and discharge"
      record_type: "water meter, utility bill, tank and discharge records"
      raw_fields: "source; withdrawal; recirculation; evaporation or product retention; discharge; destination"
      collection_method: "Reconcile water by source and destination without treating internal recirculation as a new withdrawal."
      unit: "m3 or kg"
      frequency: "Continuous or monthly"
      temporal_coverage: "Same reporting period as production"
      site_scope: "Each facility in scope"
      aggregation_rule: "Sum withdrawals by source and report recirculation and discharge separately."
      quality_evidence: "Meter calibration; utility bill; discharge report; balance reconciliation"
    - protocol_id: cp_packaging_and_dispatch
      process_id: "storage_quality_and_dispatch"
      flow_role: "packaging inputs, reusable returns, packing waste, product loading, bulk or packaged form"
      record_type: "packaging issue, packing-line count, warehouse, weighbridge and dispatch records"
      raw_fields: "package material and mass; units issued; reusable returns; damage; loading loss; net cement mass; delivery form"
      collection_method: "Reconcile packaging issues and waste to packed product; record no packaging input for bulk delivery."
      unit: "kg packaging and kg net cement"
      frequency: "Per batch or dispatch, aggregated monthly"
      temporal_coverage: "Same reporting period as production"
      site_scope: "Every packing and loading line in scope"
      aggregation_rule: "Sum packaging by material per packaged output; keep bulk and packaged products separate unless production-weighted mix is declared."
      quality_evidence: "Supplier specification; packing count; warehouse issue; weighbridge and dispatch record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "All inventory rows"
      rule: "normalized amount = reporting-period amount / reporting-period net dry finished cement output × 1,000 kg"
      inputs:
        - "reporting-period amount"
        - "net dry finished cement output"
      output: "amount per 1,000 kg net dry finished cement"
      source_ids:
        - iso-14044-2006
    - id: calc_component_fraction
      applies_to: "Every cement constituent"
      rule: "constituent dry-mass fraction = constituent dry mass consumed / net dry finished cement output"
      inputs:
        - "dry constituent mass"
        - "net dry cement output"
      output: "product-specific constituent mass fraction"
      source_ids:
        - gcca-cement-co2-energy-protocol-v3-1
    - id: calc_clinker_or_intermediate_factor
      applies_to: "Portland, blended, slag, aluminous, and similar routes"
      rule: "clinker or route-specific hydraulic-intermediate factor = reconciled intermediate dry mass consumed / net dry finished cement output"
      inputs:
        - produced
        - purchased
        - sold
        - transferred
        - "stocked and consumed intermediate mass"
        - "cement output"
      output: "declared clinker-to-cement or hydraulic-intermediate ratio"
      source_ids:
        - gcca-cement-co2-energy-protocol-v3-1
    - id: calc_fuel_energy
      applies_to: "Each thermal fuel"
      rule: "lower-heating-value energy = measured fuel quantity × source- and period-specific lower heating value; retain fuel categories and use locations separately"
      inputs:
        - "fuel mass or volume"
        - "lower heating value"
        - "use location"
        - category
      output: "MJ by fuel, process, fossil/alternative/mixed/biomass category"
      source_ids:
        - gcca-cement-co2-energy-protocol-v3-1
    - id: calc_transport_service
      applies_to: "Inbound transport"
      rule: "transport service = transported dry mass in tonnes × one-way or documented route distance in kilometres"
      inputs:
        - mass
        - mode
        - "route distance"
      output: "tonne-kilometre by material, mode and route"
      source_ids:
        - epd-international-cpcr-001
    - id: calc_direct_release
      applies_to: "Direct air emissions"
      rule: "normalized release = measured or approved calculated reporting-period release / net dry finished cement output × 1,000 kg"
      inputs:
        - "release mass or monitored concentration and gas flow"
        - "operating time"
        - "cement output"
      output: "kg matched elementary flow per reference flow"
      source_ids:
        - eu-jrc-clm-bref-2013
        - gcca-cement-co2-energy-protocol-v3-1
    - id: calc_product_mix
      applies_to: "Allowed declared cement mix"
      rule: "mixed inventory = sum of each product-specific inventory multiplied by its reconciled net dry production share over the same site and period"
      inputs:
        - "product-specific inventory"
        - "net dry output by product"
      output: "production-volume-weighted declared mix inventory"
      source_ids:
        - iso-14044-2006
    - id: calc_mass_balance
      applies_to: "Cement formulation and losses"
      rule: "reconcile clinker or intermediate, other constituents, additions and stock changes against finished cement, external dust, off-spec material and other documented losses; investigate and disclose residual variance"
      inputs:
        - "all dry inputs"
        - "stock changes"
        - "internal returns"
        - "finished cement"
        - "external wastes and losses"
      output: "reconciled mass balance and disclosed variance"
      source_ids:
        - gcca-cement-co2-energy-protocol-v3-1
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "Reference product"
      requirement: "Cement family, standard designation, strength class and test ages, formulation, route, site, period, and delivery form shall be explicit and mutually consistent."
      evidence: "Product specification; formulation approval; laboratory release; dataset metadata"
    - id: dq_composition_completeness
      applies_to: "Cement formulation"
      requirement: "Report all main constituents, calcium sulfate or gypsum, supplementary materials, minor additions, and grinding aids on a reconciled dry-mass basis; investigate and disclose any residual mass-balance variance."
      evidence: "Batch formulation; scale records; stock reconciliation; mass-balance workbook"
    - id: dq_temporal_representativeness
      applies_to: "All foreground records"
      requirement: "Use one common representative period and disclose shutdowns, campaigns, abnormal operation, substitutions, and missing months."
      evidence: "Production calendar; meter coverage; maintenance and incident log"
    - id: dq_site_and_route_representativeness
      applies_to: "Facilities and suppliers"
      requirement: "Include every facility materially contributing to the declared product and keep integrated and separate-grinding routes distinct."
      evidence: "Facility list; process map; supplier register; transfer records"
    - id: dq_energy_and_fuel_traceability
      applies_to: "Electricity and thermal energy"
      requirement: "Retain meter boundaries, allocation drivers, fuel lower heating values, alternative-fuel status, and fossil/biogenic fractions; do not substitute an unqualified generic energy value."
      evidence: "Meter register; invoices; fuel analyses; allocation workbook"
    - id: dq_emission_flow_matching
      applies_to: "Direct emissions"
      requirement: "Match each monitoring result to the correct elementary flow, compartment, fossil or biogenic origin, and particle-size fraction; unresolved matches remain disclosed data gaps."
      evidence: "Monitoring report; flow-selection record; calculation workbook"
    - id: dq_upstream_dataset_matching
      applies_to: "Clinker, other intermediates, constituents, fuels, electricity, transport and packaging"
      requirement: "Select datasets matching declared identity, technology, geography, period, and supplier status; disclose proxies and do not use a single regional cement dataset as a category default."
      evidence: "Supplier evidence; dataset metadata; proxy justification and sensitivity"
    - id: dq_measurement_control
      applies_to: "Mass, energy, water and emission records"
      requirement: "Use calibrated instruments or controlled commercial records and retain checks showing completeness and unit conversions."
      evidence: "Calibration certificate; invoice; laboratory QA; internal audit"
    - id: dq_no_hidden_estimates
      applies_to: "Missing foreground data"
      requirement: "Identify every estimate and replacement method. This PCR provides no default inventory quantities, performance thresholds, legal limits, or reasoned-estimate ranges."
      evidence: "Data-gap register; estimation method; reviewer sign-off"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail unless the reference output is exactly 1,000 kg net dry finished cement using product flow eb61e60c-c9e9-4f78-b1c4-30f47476ec0c, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66, and unit kg."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2024
  - rule_id: validate_required_qualifiers
    applies_to: "Reference product metadata"
    rule: "Fail if cement family and standard designation, strength class and ages, clinker or hydraulic-intermediate type and source, factor, main constituent fractions, gypsum or calcium sulfate, additions, route, site, period, delivery form, and dry-mass convention are missing."
    source_ids:
      - epd-international-cpcr-001
      - gcca-cement-co2-energy-protocol-v3-1
  - rule_id: validate_category_boundary
    applies_to: "Product applicability"
    rule: "Fail if the reference product is clinker, concrete, mortar, refractory composition, cement article, lime, or another non-cement product, or if a single grade, site, or regional cement is presented as the whole category."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2024
      - gcca-cement-co2-energy-protocol-v3-1
  - rule_id: validate_composition_and_factor
    applies_to: "Formulation"
    rule: "Fail if clinker or route-specific hydraulic-intermediate factor and all declared constituent fractions cannot be reproduced from reconciled dry-mass records or if materially different formulations are averaged without production weights."
    source_ids:
      - gcca-cement-co2-energy-protocol-v3-1
  - rule_id: validate_energy_and_fuels
    applies_to: "Energy inventory"
    rule: "Fail if electricity and thermal energy are not separate, kiln and non-kiln fuels are conflated, or conventional, alternative, mixed and biomass fuels lack their required identity, lower heating value, use location, and fossil/biogenic split."
    source_ids:
      - gcca-cement-co2-energy-protocol-v3-1
  - rule_id: validate_process_boundary
    applies_to: "Process map"
    rule: "Fail if applicable clinker or hydraulic-intermediate production, constituent preparation, grinding or blending, storage, pollution control, quality control, packing, or dispatch is omitted without a disclosed upstream dataset or exclusion rationale."
    source_ids:
      - eu-jrc-clm-bref-2013
      - epd-international-cpcr-001
  - rule_id: validate_direct_releases
    applies_to: "Direct emissions and wastes"
    rule: "Fail if direct releases are not assigned to their emitting process, monitoring or calculation methods are absent, particle fractions are mismatched, or internal dust and rework are double-counted as external waste."
    source_ids:
      - eu-jrc-clm-bref-2013
      - gcca-cement-co2-energy-protocol-v3-1
  - rule_id: validate_mass_balance
    applies_to: "Intermediate and finished cement mass"
    rule: "Fail if clinker or hydraulic-intermediate, constituent, stock, output, waste and loss records do not form a documented reconciliation or if internal transfers are counted as new production."
    source_ids:
      - gcca-cement-co2-energy-protocol-v3-1
  - rule_id: validate_allocation
    applies_to: "Shared processes and secondary inputs"
    rule: "Fail if direct assignment and subdivision were not attempted, the remaining allocation driver is undisclosed, or waste/by-product inputs are assigned zero burden or avoided-burden credit without an explicit programme rule."
    source_ids:
      - iso-14044-2006
      - epd-international-cpcr-001
  - rule_id: validate_packaging_and_delivery
    applies_to: "Factory-gate delivery"
    rule: "Fail if delivery form is absent, packaging is omitted for packaged cement, or packaging is included as product tare in the 1,000 kg net cement reference amount."
    source_ids:
      - epd-international-cpcr-001
  - rule_id: validate_geography_period_and_mix
    applies_to: "Representativeness"
    rule: "Fail if facilities, geography, reporting period, product production weights, and upstream dataset matches are insufficient to reproduce the declared product or mix."
    source_ids:
      - iso-14044-2006
      - epd-international-cpcr-001
  - rule_id: validate_no_cross_category_extrapolation
    applies_to: "Dataset use"
    rule: "Fail if Portland cement is used as a default for aluminous cement, if a single strength grade or formulation is generalized to all cement, or if a single plant or region is generalized beyond its declared representativeness."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2024
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Product-specific or disclosed production-volume-weighted secondary_dataset and background_dataset for finished hydraulic cement at the factory gate"
  downstream_use: "Foreground packages and downstream process or lifecyclemodel projections for concrete, mortar, construction products, buildings, infrastructure, and other users of the declared cement"
  allowed_use: "The declared cement family, standard, strength class, formulation or explicit production mix, route, facility set, geography, reporting period, and bulk or packaged delivery form"
  excluded_use: "Clinker; concrete; mortar; refractory compositions; cement articles; unspecified cement averages; other strength classes, formulations, routes, facilities, regions, or periods without representativeness evidence"
  required_metadata: "Canonical PCR id; product and reference-flow UUIDs; cement family and standard; strength class and ages; constituent fractions; clinker or hydraulic-intermediate factor; route; facilities; geography; period; delivery and packaging form; allocation; upstream datasets; collection protocols"
  required_quality_disclosure: "Meter and scale coverage; laboratory and composition evidence; mass-balance variance; energy and fuel categorization; direct-emission methods; supplier and dataset matching; production weights; exclusions; proxies; missing data; uncertainty and sensitivity where relevant"
  update_trigger: "Change in cement family or standard, strength class, formulation or clinker factor, supplier or hydraulic intermediate, kiln or grinding technology, thermal or electrical energy mix, alternative-fuel use, facility set, allocation, delivery form, geography, reporting period, or any material data-quality gap"
