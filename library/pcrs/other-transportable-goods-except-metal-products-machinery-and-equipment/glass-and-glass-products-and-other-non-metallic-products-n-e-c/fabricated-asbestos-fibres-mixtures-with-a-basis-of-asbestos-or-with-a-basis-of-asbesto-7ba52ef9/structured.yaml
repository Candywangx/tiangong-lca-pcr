allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "This hierarchy is limited to attributional cases requiring multifunctionality resolution; it is supported by ILCD, not industrial manufacturing evidence."
    source_ids: []
  - rule_id: a_subdivide
    applies_to: "attributional multifunctionality only"
    rule: "First isolate dedicated operations and real/virtual subdivision, assigning each exclusive exchange to its actual cohort/function. Industrial route literature supplies no allocation factor."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "Establish an exchange-specific determining physical causal relationship; neither mass/volume nor economic allocation is a free option."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "genuinely residual common process"
    rule: "Only after that hierarchy, allocate remaining common-process burdens by contemporaneous market value at the same process gate and actual supply state. Retain basis, prices, quantities, uncertainty and sensitivity; no fixed shares or automatic credit. Physical gross legs stay unchanged."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
