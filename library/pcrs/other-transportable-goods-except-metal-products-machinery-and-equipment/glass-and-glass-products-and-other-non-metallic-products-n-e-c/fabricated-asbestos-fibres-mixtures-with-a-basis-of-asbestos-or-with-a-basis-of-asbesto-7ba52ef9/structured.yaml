      rule: "Each actually performed packaging/storage/handling/dispatch/return-inspection service remains assigned to its original release cohort even if FG remains in store. Retain its original cohort Q and observation horizon; carry over only unused/unassigned service/charge. Returns keep original history once plus genuine new work. Post-release work requires manufacturer/specification permission, postwork tests, acceptance and disposition; do not presume a broken or cured sheet can be restored. Historical industrial descriptions establish the stated terminal/route and LCA collection context only, not current legal authorization, occupational-health compliance, safety certification or site operating/exposure thresholds. Actual applicability claims require independent governing authorization/supply evidence. Permission/postwork tests/acceptance/disposition determine authorization and continuing qualification ONLY; never erase all actual unauthorized, failed, rework/replacement, cleanup or treatment water/material/energy/loss burdens. Assign once to the real original/new cohort; do not assume cured/broken whole sheets regain qualification. For EVERY raw/WIP/nonWIP stock (assets, installed fluids/tools/parts/packaging), keep full wet physical opening/closing quantities AND every exchange-history vector; stock quantity is not its burden vector, and already-net consumption is not stock-corrected again. Original first Q includes released retained FG; preserve all failure/Q0/start-stop/idle/cleanup/test/rework/treatment burdens, without automatic T_other from waste sales/destination. Actually performed service always uses original Qc (the existing formula original cohort Q) and observed H, even for held FG; ONLY unused/unassigned service carries. Internal FG transfer is a gate/ledger event cancelled once in consolidation, not a new environmental exchange or second Q; original gross dispatch and actual changed wet return are independent."
