  calculation_rules:
    - id: calc_release
      applies_to: "finished_sheet"
      rule: "Q = sum of unique new first-release net geometric sheet volume in m3. Integrate actual one-face area with measured local thickness; only verified rectangles use L×W. No new Q from delivery/reinspection/repair-release. Measure whole-sheet net geometric volume at its actual first-release supplied compression/conditioning state. Match complete actual outline, cutouts/through-holes/open voids and local thickness map to the same sheet. Only a verified rectangle uses L×W with actual openings removed; nonrectangular shapes require actual drawing/measurement integration, not a bounding box. Exclude inter-sheet/package gaps; do not subtract unmeasured microscopic porosity or use true mineral density to replace geometric m3. Independently weigh full net kg and moisture, retaining actual SBR/constituents, with no thickness, compression-test load, density or kg/m3 default."
      inputs:
        - cp_release
        - cohort_id
      output: "Q"
      source_ids: []
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert each raw numerator to its own declared extensive property/unit before attribution: electricity1kWh=3.6MJ exactly; kg remains kg; actual m3 remains m3. Only true rate integrates over time. Measured paired mass/volume/geometry, state and configuration are required for any density/area/count conversion; native secondary factors are not factory measurements."
      inputs:
        - raw_numerator
        - raw_unit
        - measured_state
      output: "converted_raw_numerator"
      source_ids: []
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "For each exchange i and cohort c retain gross physical X legs independently of burden assignment. Determine A_i_c from dedicated/causal/residual assignments and the mutually exclusive inherited opening plus current burden less eligible closing/actual justified other-cohort handover. Correct stock once; manufacturing closing excludes first-released FG. Ordinary scrap, failure, samples, waste treatment or sales do not create a deductible T_other. Whole acquisition/provider vectors and their service vectors are linked views, never additive duplicate upstream purchases. For EVERY raw/WIP/nonWIP stock (assets, installed fluids/tools/parts/packaging), keep full wet physical opening/closing quantities AND every exchange-history vector; stock quantity is not its burden vector, and already-net consumption is not stock-corrected again. Original first Q includes released retained FG; preserve all failure/Q0/start-stop/idle/cleanup/test/rework/treatment burdens, without automatic T_other from waste sales/destination. Actually performed service always uses original Qc (the existing formula original cohort Q) and observed H, even for held FG; ONLY unused/unassigned service carries. Internal FG transfer is a gate/ledger event cancelled once in consolidation, not a new environmental exchange or second Q; original gross dispatch and actual changed wet return are independent."
      inputs:
        - converted_raw_numerator
        - inherited_vectors
        - allocation_decision
        - cohort_id
      output: "A_i_c"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_normalize_once
      applies_to: "all inventory rows"
      rule: "When Q>0, z_i_c = A_i_c / Q exactly once. Manufacturing uses its own new first-release Q; each incremental post-release service uses the original cohort Q and declared horizon. Cards and aggregation only read z_i_c, without dividing again. Preserve actual raw burdens/stocks for Q=0 and emit no unit result. Physical gross legs are never reduced by economic/causal burden fractions. For ledger-only physical FG/package/waste/asset/thermal-carrier legs, z_i_c uses full gross V_i/Q (original Qc for service), stored separately from A_i_c/A_service and every inherited manufacture/service vector. Gross physical numerators never use a stock-burden difference, net shipment, economic/causal share or old manufacturing history addition; no second acquisition/treatment charge or credit. Divide once by the original denominator and retain actual service burdens independently. Manufacturing thermal-carrier incoming/return kg/actual state/enthalpy uses V/Q; only service increments use original QcH. Heat MJ and carrier kg/actual condensate/hot-water Product returns share ONE supplier boundary and ONE burden owner. If actual hot-water heating exists add its real paired Product rows before completion, not cooling-water or environmental-release substitutes; return gives no negative water/heat credit."
      inputs:
        - A_i_c
        - Q
        - cohort_id
        - service_horizon
      output: "z_i_c"
      source_ids: []
    - id: calc_physical
      applies_to: "all physical gates"
      rule: "For each nonoverlapping gate reconcile opening full wet mass + actual external influx = closing full wet mass + actual external outflux + independently established transformation. Cancel internal transfers only. Each repair-water X term de-duplicates only another influx/outflux term that includes it, never closing stocks. Keep relevant elements and actual species/reaction water independent. For ledger-only physical FG/package/waste/asset/thermal-carrier legs, z_i_c uses full gross V_i/Q (original Qc for service), stored separately from A_i_c/A_service and every inherited manufacture/service vector. Gross physical numerators never use a stock-burden difference, net shipment, economic/causal share or old manufacturing history addition; no second acquisition/treatment charge or credit. Divide once by the original denominator and retain actual service burdens independently. Manufacturing thermal-carrier incoming/return kg/actual state/enthalpy uses V/Q; only service increments use original QcH. Heat MJ and carrier kg/actual condensate/hot-water Product returns share ONE supplier boundary and ONE burden owner. If actual hot-water heating exists add its real paired Product rows before completion, not cooling-water or environmental-release substitutes; return gives no negative water/heat credit."
      inputs:
        - physical_stocks
        - gross_influx
        - gross_outflux
        - independent_species
      output: "physical_gate_balance"
      source_ids: []
    - id: calc_packages
      applies_to: "each package article"
      rule: "Opening + P + I + ER + X_in = closing + S + EO + W + X_out for each actual package, preserving the disjoint attached/empty/reusable categories. first non-purchased external ingress keeps physical mass and one upstream owner. Internal reuse cancels; actual new material/water remaining at closing retains both influx and full closing wet stock. X_in/X_out covers only independently measured actual added/removed water/parts/material not already in OTHER same-side flow terms, never stocks, opposite legs or merely because a card exists. Whole wet P/I once; retained additions keep real influx AND full wet closing. Cover ordinary storage/handling humidity uptake/desorption and actual cleaning, not only repair. Unknown occurrence/species/amount is not zero; presume no repair, dry wood, species or life. Separate actual new/old wood/parts and liquid water/humidity/vapour; held FG and distinct repair-WIP stocks are disjoint once. Each pool has actual P/I/ER/S/EO/W cards and protocols. W cards are external exchanges ONLY for actually separately collected disjoint streams. If there is ONE real mixed collection outlet, name ONE specific mixed Waste exchange from its actual composition/state/destination before dataset completion, with ONE treatment provider; each material W is then an independently measured protocol origin subledger whose sum equals the separately measured total, never total plus origin cards/another Waste. Do not presume mixing or invent a second outlet."
      inputs:
        - cp_pack
        - P
        - I
        - ER
        - S
        - EO
        - W
        - X_in
        - X_out
      output: "package_balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all bound and unbound flows"
      requirement: "Retain exact mineral/form/supply composition, each adopted native restriction and all actual separately procured/prepared exchanges; missing auxiliary UUID is not permission to omit an exchange."
      evidence: "supplier/formulation/state and native evidence"
    - id: dq_release
      applies_to: "finished_sheet"
      requirement: "Retain real drawing/shape, independent volume/area/thickness/mass/moisture calibration, actual acceptance/test evidence and unique cohort. Volume is a declared amount, not an equivalent lifetime/sealing function."
      evidence: "cp_release records and scope"
    - id: dq_completeness
      applies_to: "all gates"
      requirement: "Report entire failed/zero-output/idle/cleanup/rework periods, all inherited vectors, packages/repairs/fluids and missing species/detection coverage. No assumed zero, default yield, credit or buried other category."
      evidence: "raw reconciliations and uncertainty register"
    - id: dq_time
      applies_to: "manufacturing and services"
      requirement: "State actual site/time/source age and service observation horizon; historical process evidence is not proof of current market/legal/health/quality status. Preserve privacy-free scientific records and uncertainties."
      evidence: "source scope plus actual site/service records"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and all bound rows"
    rule: "Apply every complete card restriction, mineral/CAS/form/supply-state/route/geography/media/type and all native properties. Taxonomy anomaly does not waive a hard physical conflict. Unconfirmed core finished-article UUID is an identity hold: retain draft/unmapped/unusable. Ordinary auxiliary/provider gaps remain explicit without inventing absence."
    source_ids: []
  - rule_id: v_measurement
    applies_to: "all inventory rows"
    rule: "Reference output is exactly finished_sheet with1m3; bilingual Q and every numerator unit agree. Preserve raw unnormalized records; invoke calc_normalize_once once after unit conversion/attribution. Cards and aggregation read the same result. Q0 keeps actual burdens without a unit result."
    source_ids: []
  - rule_id: v_geometry
    applies_to: "finished-sheet geometry"
    rule: "Use actual one-face projected area, actual thickness map and traceable geometry to obtain net geometric volume. L×W only for verified rectangles; bounding boxes, two faces and packaging air voids are not sheet area/volume. Independently weigh net product and measure conditioning/moisture; do not infer density, kg/item, yield or life from secondary native properties."
    source_ids: []
  - rule_id: v_complete
    applies_to: "all gates and services"
    rule: "Reconcile all gross inputs/outputs and disjoint stocks with per-exchange vectors, packaging P/I/ER/S/EO/W, repair-water X and complete failed/zero-output loads. Retain ordinary manufacturing waste/test/reject treatment burdens despite sale/transfer. Only a demonstrated other cohort/function plus justified allocation/handover can transfer a burden vector once."
    source_ids: []
  - rule_id: v_evidence
    applies_to: "actual dataset completion"
    rule: "Check actual source applicability and raw measurement/test records, detection coverage, treatment boundaries and unresolved identities. A structural/schema/finite measurement pass does not establish factory performance, scientific/translation approval, mapping or publication. Unknown core scope/method remains a true hold."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Identified whole jointing-sheet input for subsequent declared gasket fabrication, with complete route and service context"
  allowed_use: "Declared attributional factory first-release production plus separately disclosed real services; no equivalent life or performance claim"
  excluded_use: "Exclude other asbestos minerals, loose mineral product, asbestos textile/rope, beater-add paper, cement/fibre-cement articles, non-asbestos modern fibre sheets, friction parts, metal-reinforced/jacketed gaskets, installation/use, contaminated used articles as substitute raw feed, and purchased finished-sheet repacking or downstream cut-gasket fabrication. A changed coating/reinforcement/material/route needs new applicability and complete exchanges."
  required_metadata: "Actual site geography and observation period; Chrysotile mineral CAS12001-29-5 and fibre morphology; Whole SBR formulation supplier and delivered carrier/assay inclusions; Separate actual onsite-compounded purchases where applicable; Unreinforced uncoated sheet supply state and drawing revision; Actual mixing/calendering/solvent removal/curing route without prescribed settings; Independent net geometric volume and one-face area with measured thickness map; Independent net mass and conditioning/moisture scope; First-release event and actual test/acceptance/disposition records; Disjoint raw/WIP/FG/non-WIP stocks and per-exchange inherited vectors; Original-cohort service horizon and complete performed services; Whole package six-leg balances and supplier-included owner; Native pad37570 taxonomy anomaly and Volume-only reference; Native electricity CN user-side grid below1kV when bound; Actual pollutant species morphology phase compartment and detection coverage; Full native restrictions in every adopted-flow description"
  required_quality_disclosure: "Actual coverage/uncertainty/unresolved identities, historical source limitations, and all native restrictions"
  update_trigger: "Changed mineral/binder/coating/reinforcement, route, geometry/release basis, geography/provider, new actual flow or source evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Ver.3.0 Explanatory Notes 30June2025 pp185–186; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context only;37920 and neighbouring37570 titles have no detailed inclusion/exclusion bullets here; no methodology or acceptance inferred."
  - id: "epa-asbestos-lifecycle-1982"
    type: "literature"
    reference: "Cogley et al., GCA for US EPA, Life Cycle of Asbestos in Commercial and Industrial Use Including Estimates of Releases to Air Water and Land, February1982, section9 pp171–186, Figs21–23; https://nepis.epa.gov/Exe/ZyPDF.cgi?Dockey=P100TZ2B.PDF"
    used_for: "Historical primary calendered-sheet process and waste/secondary-fabricator distinctions; not an allocation factor or current-site quantitative default."
  - id: "sigma-jointing-sheets"
    type: "literature"
    reference: "New Era Industries / SIGMA, Jointing Sheets, undated full manufacturer page; https://www.sigma100.com/jointing-sheet.html"
    used_for: "Actual chrysotile/SBR whole sheet product;540Super versus540NA and other binder/reinforcement countercontext, without transferring operating/performance claims."
  - id: "jrc-ilcd-2010"
    type: "handbook"
    reference: "EC JRC, ILCD Handbook General Guide for LCA Detailed Guidance, first edition March2010, sections7.9.2–7.9.3 pp255–268; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional cases requiring allocation: subdivision, exchange-specific determining physical causality, then genuinely residual condition/gate-matched market value. Own foreground protocols supply measurements, not industrial-report allocation factors."
