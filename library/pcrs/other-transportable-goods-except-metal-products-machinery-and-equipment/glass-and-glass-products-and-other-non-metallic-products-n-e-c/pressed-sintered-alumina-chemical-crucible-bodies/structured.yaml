          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_scope | dataset | Verify actual uncoated pressed/sintered nominal95% alumina complete-body composition including minor phases, chemical/thermal terminal, supplied form and raw-to-first-release route. Apply the full other-refractory-ceramic-goods arm restriction in every core card. Do not select its unfired arm, raw alumina/Sintered Corundum component or silicon-specific vessel; an exact generic identity and engineering pass do not establish factory acceptance or science approval. | `jrc-ceramic-bref-2007`; `morgan-sintox-fa-2013` |\n| v_q | quantity | Q is unique first-release dry bare body mass including released closing FG. Retain failed/unreleased burdens WIP and stores and original Qc/H for services. Reconcile IDs before the single quotient. Q=0 retains loads and yields no unit result; shipment is not Q. | `jrc-ceramic-bref-2007` |\n| v_balance | physical gates | Reconcile independent total mass and relevant Al Si Mg Ca C H O N S Cl F elements at manufacture FG-service and consolidated gates. Keep free/adsorbed/structural/reaction water and phase changes distinct; do not count sintering densification as mass creation. Unknowns or unclosed balances are disclosed rather than fitted by one residual. | `jrc-ceramic-bref-2007` |\n| v_utility | utility carriers | Confirm native extensive property/unit and exact provider. Rate-only integration differs from totalised readings; independent material density and gas state are mandatory for conversions. Supplier steam/hot-water carrier mass heat supply/return enthalpy and water convention remain linked without duplicate purchase. | `jrc-ceramic-bref-2007` |\n| v_pack_asset | physical stocks | For each package reconcile all disjoint opening/closing empty attached and reusable pools plus every gross receipt shipment return waste. Reconcile physical new/used asset replacements in-service fluids repair retirements separately from current service burden. Economic allocation cannot shrink physical stock or gross flows. | `jrc-ceramic-bref-2007`; `jrc-ilcd-allocation-2010` |\n| v_sources | evidence | Check complete source context counterexamples and actual plant evidence. BREF electroporcelain emissions and thermal examples are not crucible factors; Morgan test-piece values are indicative and not guaranteed component properties. An old edition alone does not invalidate qualitative manufacturing evidence. Preserve missing data uncertainty and native identity holds. | `jrc-ceramic-bref-2007`; `morgan-sintox-fa-2013` |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
