    - rule_id: b_full
      applies_to: "foreground"
      rule: "Start with actual unformed alumina and separately supplied ingredients or one complete unfired granulate; include receipt transport conditioning milling granulation spray drying when on site pressing green/white machining drying debinding sintering cooling hard finishing cleaning tests waste treatment and first quality release. Bought fired bodies followed by packing are outside this manufacturing route."
