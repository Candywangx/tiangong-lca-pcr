        - jrc-ceramic-bref-2007
        - morgan-sintox-fa-2013
    - rule_id: b_form
      applies_to: "applicability"
      rule: "This is an explicit synthesis for uncoated pressed oxide-ceramic bodies in the nominal95% alumina chemical-crucible class. Morgan demonstrates material class chemical-crucible terminal and pressing capability; the BREF establishes the applicable powder-to-fired-body stages. This does not claim one manufacturer uses every listed option or one fixed recipe. Actual coating/surface state and plant route must be evidenced. Porcelain silicate SiC nitride quartz metal and assembled equipment require different applicability."
      source_ids:
        - jrc-ceramic-bref-2007
        - morgan-sintox-fa-2013
    - rule_id: b_stocks
      applies_to: "manufacturing numerator"
      rule: "Keep all raw/WIP/unassigned non-WIP-store opening and closing per-exchange burden vectors. Current burdens include failures zero output start/stop idle cleanup trials rework and pollution control. Closing already-released FG is inside Q; never subtract its manufacturing burden or add it as another production output. Internal transfers cancel but actual reprocessing burdens remain."
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - rule_id: b_service
      applies_to: "original-cohort service"
      rule: "Keep manufacturing burden attached to its first-release cohort. Later storage packing handling dispatch returns retest and actual incremental rework are separate observed services with original cohort Qc and horizon H. No delivery or retest creates new production. Trace physical FG IDs and actual condition changes; consolidation cancels internal body hand-offs and retains external gross exchanges."
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - rule_id: b_atomic
      applies_to: "every exchange"
      rule: "Each real material whole purchased formulation carrier fuel gas species packaging article asset replacement and waste has its own atomic exchange and actual applicable state. Add an unlisted real exchange before modelling; absence zero below detection and unknown differ. Do not hide manufacturing in other or assign zero to unmeasured flows. No total-air/species duplication or proxy species derived from COD VOC total halogens or PM."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_upstream
      applies_to: "recursive inputs"
      rule: "For whole bought formulations use compatible upstream burdens once and describe embedded ingredients as subledgers. For in-house formulation retain each purchased material and all actual energy losses and treatment. A same-category externally purchased fired body belongs to a separately disclosed purchased-body route; it cannot replace the raw-to-body manufacturing boundary. Internal scrap is not new procurement or automatic credit."
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
