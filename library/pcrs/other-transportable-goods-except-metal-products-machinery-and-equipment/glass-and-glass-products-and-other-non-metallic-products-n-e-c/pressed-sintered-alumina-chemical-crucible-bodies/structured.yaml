    used_for: "qualitative oxide-ceramic feed-to-sintering/finishing stages utilities wastes/emissions; Figures2.28/2.29 and neighboring counterexamples; no electroporcelain case-factor transfer"
  - id: "morgan-sintox-fa-2013"
    type: "extension_guidance"
    reference: "Morgan Advanced Materials; Sintox FA (Mac-A950R-1) Data Sheet; copyright2013; complete one-page specification. https://www.morgantechnicalceramics.com/media/y14by1i3/sintox-fa.pdf"
    used_for: "real95% alumina material class pressing capability and chemical-crucible terminal; test-piece values not plant defaults or component guarantees"
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC; ILCD Handbook General guide for Life Cycle Assessment Detailed guidance; first edition March2010; §7.9.2–7.9.3 pp255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "attributional subdivision/virtual subdivision then exchange-specific determining physical causality then only residual common-gate contemporaneous state-specific market value; not industrial recipe evidence"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:c1c2e45c615abf3293384de3bf83dd79ef0bfb99c44c87e9b3271ce65d3f0721"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6496"
      family: "system_boundary"
      span:
        start:
          offset: 6496
          line: 59
          column: 1
        end:
          offset: 10476
          line: 81
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | actual supplied unformed alumina and ingredients or one whole unfired pressing granulate; in-house preparation separate |\n| starting_condition_role | foreground_gate |\n| product_classification_scope | CPC3.0:37291 narrower chemical alumina crucible body |\n| recursive_input_rule | purchased same-category fired bodies require a separately disclosed route; internal recycle cancels as transfer |\n| upstream_dataset_requirement | compatible actual whole supplied-state geography/property upstream burden once; unknown is not zero |\n| disclosure | actual design/material/surface starting supplies manufacturing stages first-release Q original-cohort service H inherited vectors and all missing/identity limits |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_full | foreground | Start with actual unformed alumina and separately supplied ingredients or one complete unfired granulate; include receipt transport conditioning milling granulation spray drying when on site pressing green/white machining drying debinding sintering cooling hard finishing cleaning tests waste treatment and first quality release. Bought fired bodies followed by packing are outside this manufacturing route. | `jrc-ceramic-bref-2007`; `morgan-sintox-fa-2013` |\n| b_form | applicability | This is an explicit synthesis for uncoated pressed oxide-ceramic bodies in the nominal95% alumina chemical-crucible class. Morgan demonstrates material class chemical-crucible terminal and pressing capability; the BREF establishes the applicable powder-to-fired-body stages. This does not claim one manufacturer uses every listed option or one fixed recipe. Actual coating/surface state and plant route must be evidenced. Porcelain silicate SiC nitride quartz metal and assembled equipment require different applicability. | `jrc-ceramic-bref-2007`; `morgan-sintox-fa-2013` |\n| b_stocks | manufacturing numerator | Keep all raw/WIP/unassigned non-WIP-store opening and closing per-exchange burden vectors. Current burdens include failures zero output start/stop idle cleanup trials rework and pollution control. Closing already-released FG is inside Q; never subtract its manufacturing burden or add it as another production output. Internal transfers cancel but actual reprocessing burdens remain. | `jrc-ceramic-bref-2007`; `jrc-ilcd-allocation-2010` |\n| b_service | original-cohort service | Keep manufacturing burden attached to its first-release cohort. Later storage packing handling dispatch returns retest and actual incremental rework are separate observed services with original cohort Qc and horizon H. No delivery or retest creates new production. Trace physical FG IDs and actual condition changes; consolidation cancels internal body hand-offs and retains external gross exchanges. | `jrc-ceramic-bref-2007`; `jrc-ilcd-allocation-2010` |\n| b_atomic | every exchange | Each real material whole purchased formulation carrier fuel gas species packaging article asset replacement and waste has its own atomic exchange and actual applicable state. Add an unlisted real exchange before modelling; absence zero below detection and unknown differ. Do not hide manufacturing in other or assign zero to unmeasured flows. No total-air/species duplication or proxy species derived from COD VOC total halogens or PM. | `jrc-ceramic-bref-2007` |\n| b_upstream | recursive inputs | For whole bought formulations use compatible upstream burdens once and describe embedded ingredients as subledgers. For in-house formulation retain each purchased material and all actual energy losses and treatment. A same-category externally purchased fired body belongs to a separately disclosed purchased-body route; it cannot replace the raw-to-body manufacturing boundary. Internal scrap is not new procurement or automatic credit. | `jrc-ceramic-bref-2007`; `jrc-ilcd-allocation-2010` |\n\n"
