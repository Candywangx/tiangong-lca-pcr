            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: a_dedicated
    applies_to: "each exchange"
    rule: "This attributional method first assigns exclusive inputs/emissions to their real product or service; use measured subdivision or justified virtual subdivision. Mixing separate crucible designs batches failures or services does not justify an arbitrary common allocation factor."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_physical
    applies_to: "genuine residual multifunctionality"
    rule: "Only after subdivision is exhausted identify the exchange-specific determining physical causal relationship and supporting measurements. Different flows may need different determining properties. Kiln duty/occupancy evidence may support specific energy attribution but neither mass shares nor economic shares are automatic. Physically embodied material remains with the receiving product."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_market
    applies_to: "unresolved common-process remainder"
    rule: "For a genuine common-process remainder without a defensible determining physical cause use evidenced contemporaneous market values of actual cofunctions in the condition at the common process gate. Record gate quantities prices time geography nonfunctional flows and sensitivity. No fixed ratios free choices or default substitution/avoided-production credits; unavailable values remain unresolved."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_physical_stock
    applies_to: "physical reconciliation"
    rule: "Keep gross physical raw FG packaging water species and asset balances independent of burden allocation. Waste sale alone does not establish a product or erase treatment; demonstrate actual function specification quality and receiver. Internal reuse gives no new reference output and no automatic recycling credit."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first_release"
      record_type: "mass_and_identity"
      raw_fields: "body ID; design; geometry; surface; phase; composition; final test disposition; first-release timestamp; calibrated dry bare mass; opening/closing raw/WIP/FG"
      collection_method: "Weigh actual complete bare dry accepted bodies on calibrated scales after required finishing/tests; exclude all packaging lids not in declared body and contents. Match IDs configuration surface moisture and first-release register; sample only under an explicit representativeness/uncertainty protocol. No density-derived body mass or guessed kg/item."
      unit: "kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited history and observed H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated raw records; assays/state; traceable IDs; independent stocks and quality evidence"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "individual_supplied_material"
      record_type: "raw_material_stock"
      raw_fields: "row; supplied grade/form; gross/tare mass; full formulation; assay; carried water; dry solids; site preparation; raw/WIP/unassigned-store opening/closing; per-exchange inherited vectors; internal transfers; losses"
      collection_method: "Use calibrated scales supplier receipts complete formulation assays moisture and stock/process records. Preserve whole bought preparation once; actual in-house ingredients and all operating-mode burdens separately. Do not assume a common nominal recipe or invent unknown history."
      unit: "kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited history and observed H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated raw records; assays/state; traceable IDs; independent stocks and quality evidence"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "each_utility_and_freight"
      record_type: "raw_meter_state"
      raw_fields: "row; meter start/end; rate or totaliser; time intervals; operating mode; actual provider; native extensive property; raw unit; gas composition; temperature; pressure; compressibility; density measurement; LHV; carrier mass; enthalpy; supply/return water convention; payload; distance"
      collection_method: "Submeter each actual operation and shared utility with interval logs including failure idle cleanup and controls; retain raw totals before conversion attribution or division. Independently measure material-specific density/state and heat evidence. For real freight use payload and route records."
      unit: "MJ; m3; kg; t*km"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited history and observed H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated raw records; assays/state; traceable IDs; independent stocks and quality evidence"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "individual_asset_or_consumable"
      record_type: "physical_asset_service"
      raw_fields: "asset/row ID; configuration; material; new/used; complete supply; receipt/install/repair/retirement; opening/closing physical stocks; installed oil and water; attached material; wear; deployments; observed use; inherited service burden"
      collection_method: "Use actual asset register replacement receipts scale records maintenance logs installed-fluid measurements and observed duty. Keep physical stock and service burden ledgers separate; no arbitrary lifetime or full asset per unit product."
      unit: "kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited history and observed H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated raw records; assays/state; traceable IDs; independent stocks and quality evidence"
    - protocol_id: cp_residue
      process_id: "manufacture"
      flow_role: "each_waste"
      record_type: "waste_state_receiver"
      raw_fields: "row; whole wet mass; tare; dry constituents; free/adsorbed/structural/reaction water; contamination; physical stock; receiver; treatment; internal recovery; independent species evidence"
      collection_method: "Weigh each real externally transferred waste and verify representative assay with receiver records. Match moisture dissolved/solid constituents and upstream assignment; keep internal recycle disjoint and report uncertain residuals."
      unit: "kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited history and observed H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated raw records; assays/state; traceable IDs; independent stocks and quality evidence"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "individual_environmental_species"
      record_type: "raw_species_state"
      raw_fields: "row; exact molecule/CAS; source origin; phase; medium; inlet/outlet; concentration; dry/wet basis; totalised volume or volume rate; real time; temperature; pressure; humidity; calibration; detection limit; controls; uncertainty"
      collection_method: "Use actual representative inlet/outlet sampling/speciation and matched totalisers or rate logs over all operating modes. Convert reporting equivalents only with independent species evidence; retain blanks limits and unknowns. No aggregate-air plus sub-species double count; validate total mass and elements independently."
      unit: "kg; m3"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited history and observed H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated raw records; assays/state; traceable IDs; independent stocks and quality evidence"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "original_cohort_service"
      record_type: "incremental_service"
      raw_fields: "original release/cohort IDs; original Qc; observed H; opening/closing FG; historical manufacture vectors; actual return mass/state; gross dispatch G; matched original dispatch; added cleaning/rework materials water electricity emissions and waste; unobserved future"
      collection_method: "Follow physical bodies and their original burdens through storage dispatch return retest and incremental rework. Keep actual new inputs/losses per atomic row; original Qc is unchanged and no future operation is invented. Other actual service chemicals fuels or emissions require new cards."
      unit: "kg; MJ; m3"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited history and observed H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated raw records; assays/state; traceable IDs; independent stocks and quality evidence"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "each_package_pool"
      record_type: "gross_packaging_stock"
      raw_fields: "row/material/configuration; ownership; empty/WIP-attached/FG-attached/reusable opening and closing; P; I; ER; S; EO; W; internal reuse; tare/moisture; cohort Qc; H; inherited package vectors; actual article water uptake/loss; actual new and removed repair parts; original component state"
      collection_method: "Weigh/count each same-material configuration separately with traceable tare and actual gross shipments/returns including repeated dispatch. Reconcile every empty and attached pool without overlaps. Preserve physical quantities independent of burden allocation; internal reuse creates neither purchase nor product."
      unit: "kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited history and observed H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated raw records; assays/state; traceable IDs; independent stocks and quality evidence"
  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert original raw readings to the selected extensive numerator unit before allocation: actual rates are integrated over real time; totalised volumes are not multiplied by time again; electricity kWh*3.6 gives MJ. Use independent state-specific density/calorimetry; carrierMass and heat remain linked subaccounts."
      inputs:
        - raw_reading
        - state_evidence
        - calibration
      output: "raw_extensive_amount"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: first_release
      applies_to: "finished_crucible"
      rule: "Q = sum of dry bare net masses of unique bodies at first final quality release in the declared product cohort. Count released closing FG once inside Q; unreleased WIP is not Q. Retest re-shipment return and delivery do not create new production."
      inputs:
        - cp_release
        - unique_body_IDs
      output: "Q"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: manufacture_burden
      applies_to: "manufacture"
      rule: "For each exchange j use A_j = Bopen_j + P_j - Bclose_j - Tother_j after actual unit conversion subdivision and justified attribution. B vectors are inherited burdens held only in raw/WIP/unassigned non-WIP stores; P contains all modes including failed and zero-output operations. Released closing FG is not Bclose. Each subtraction needs an independent measured destination/vector; unknown history remains unknown. Identify receipt versus already-consumption-corrected readings; never correct the same stock consumption twice. Every raw/WIP/non-WIP physical quantity retains its own inherited exchange vector. Ordinary waste/rejects and failed loads do not automatically establish Tother burden export or credit."
      inputs:
        - Bopen_j
        - P_j
        - Bclose_j
        - Tother_j
        - cp_material
        - cp_asset
      output: "A_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: cohort_service
      applies_to: "service"
      rule: "Keep original manufacturing vectors with the original cohort. Aservice_j comprises actual incremental service burdens in observed horizon H attributed to that cohort; Qc is its original first-release dry mass. Physical FG: openingFG + first releases + real returns = closingFG + gross dispatch + destruction + other evidenced physical exits. Track ID-specific state changes and actual new water/material/loss; never assume returned mass equals original dispatch. No original manufacture reversal is applied in this first-release method. Actual performed service for held closingFG retains its burden, with no deduction merely because product is held. For FG/package physical movement cards Aservice_j is the full measured gross leg, without adding historical burden vectors, stock-correcting the same leg or economic scaling; label these ledger-only results separately and never create supplier purchases/coproduct credits. Rework requires actual manufacturer permission and design-specific acceptance. Add each actual new material/water and removed old material/waste as atomic records; include actual permitted dry-material additions on the FG input side and water/material changes on their independent physical sides. No permission, equal return weight or future service is assumed."
      inputs:
        - cp_service
        - cp_pack
        - Qc
        - H
      output: "Aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "The only unit-result operation is a_j = A_j / Q for manufacture and aservice_j = Aservice_j / Qc for the separately labelled original-cohort service horizon. Apply once after raw-unit conversion stocks and attribution. Collection retains raw totals; card amounts and protocol basis reference the same final result and do not divide it again. Q or Qc equal to zero retains real burdens with no unit result. Consolidation cancels internal body hand-offs for the same cohort."
      inputs:
        - A_j
        - Q
        - Aservice_j
        - Qc
        - cp_release
        - cp_service
      output: "a_j; aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: pack_stock
      applies_to: "cp_pack"
      rule: "For EACH package material/configuration: opening empty+WIP-attached+FG-attached+reusable stocks + purchases P + attached inbound I + external returns received ER = closing equivalent stocks + gross shipments S + external returns out EO + waste W. All pools are disjoint; internal reuse cancels. Physical terms stay gross and unallocated; service burdens include only attributed purchases/actual operations with inherited packaging vectors counted once. I is a supplier-included physical arrival whose burden is already included in that supply, not a second purchase P. Add only real measured article water changes and new/removed repair components to their physical sides; whole article and embedded constituents are never purchased twice."
      inputs:
        - cp_pack
        - P
        - I
        - ER
        - S
        - EO
        - W
      output: "packaging_balance"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: asset_stock
      applies_to: "cp_asset"
      rule: "Reconcile physical opening new/used equipment installed components retained fluids plus additions and returns against closing stocks retirement repair exits wear and leaks, separately per material/form. Assign actual period service burdens from deployment/use and inherited vectors without a fixed life. A complete purchased asset and its embedded components are not charged twice."
      inputs:
        - cp_asset
        - actual_usage
        - inherited_vectors
      output: "period_asset_service"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: physical_species
      applies_to: "manufacture and service"
      rule: "Reconcile independent whole physical mass and relevant elements using measured formulation assay water phases oxygen uptake reaction conversion emitted molecular species and external carrier returns. Separate gross environmental gas pass-through from net reaction. Total COD/VOC/PM and elemental totals are QA indicators and cannot become a guessed molecular species. A balance residual is not an extra equation for two unknowns."
      inputs:
        - cp_air
        - cp_utility
        - cp_material
        - cp_residue
        - cp_release
        - cp_service
      output: "mass_element_residuals"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each flow"
      requirement: "Require exact native type, route/form, whole supplied article/material, grade, geography, medium, property/unit and official localized names. The whole-body reference selects the verified manufactured other-refractory-ceramic-goods arm; a raw Al2O3 fraction never substitutes for a complete95% body including minor phases. Auxiliary/provider gaps remain explicit."
      evidence: "complete direct native record and actual supplier/terminal specifications"
    - id: dq_time
      applies_to: "all modes"
      requirement: "Declare representative site/period coverage and all zero-output failure start-stop idle cleanup and rework loads; retain history for raw/WIP/FG/assets and observed cohort service H."
      evidence: "meters stocks release register maintenance and dispatch evidence"
    - id: dq_balance
      applies_to: "all physical gates"
      requirement: "Quantify uncertainty in scales sampling density phase reaction and speciation; retain unclosed mass/element residuals independently. Sintering shrinkage is geometric and does not imply an equal mass loss."
      evidence: "calibration raw assays independent gas and material balances"
    - id: dq_complete
      applies_to: "entire dataset"
      requirement: "Keep absent measured-zero below-detection unknown and unverified conditions distinct. Fill genuine omitted exchanges; never delete a material process to make a checker pass or treat a measurement/schema result as scientific approval."
      evidence: "atomic completeness register and unresolved evidence"
validation_rules:
  - rule_id: v_scope
    applies_to: "dataset"
    rule: "Verify actual uncoated pressed/sintered nominal95% alumina complete-body composition including minor phases, chemical/thermal terminal, supplied form and raw-to-first-release route. Apply the full other-refractory-ceramic-goods arm restriction in every core card. Do not select its unfired arm, raw alumina/Sintered Corundum component or silicon-specific vessel; an exact generic identity and engineering pass do not establish factory acceptance or science approval."
    source_ids:
      - jrc-ceramic-bref-2007
      - morgan-sintox-fa-2013
  - rule_id: v_q
    applies_to: "quantity"
    rule: "Q is unique first-release dry bare body mass including released closing FG. Retain failed/unreleased burdens WIP and stores and original Qc/H for services. Reconcile IDs before the single quotient. Q=0 retains loads and yields no unit result; shipment is not Q."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_balance
    applies_to: "physical gates"
    rule: "Reconcile independent total mass and relevant Al Si Mg Ca C H O N S Cl F elements at manufacture FG-service and consolidated gates. Keep free/adsorbed/structural/reaction water and phase changes distinct; do not count sintering densification as mass creation. Unknowns or unclosed balances are disclosed rather than fitted by one residual."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_utility
    applies_to: "utility carriers"
    rule: "Confirm native extensive property/unit and exact provider. Rate-only integration differs from totalised readings; independent material density and gas state are mandatory for conversions. Supplier steam/hot-water carrier mass heat supply/return enthalpy and water convention remain linked without duplicate purchase."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_pack_asset
    applies_to: "physical stocks"
    rule: "For each package reconcile all disjoint opening/closing empty attached and reusable pools plus every gross receipt shipment return waste. Reconcile physical new/used asset replacements in-service fluids repair retirements separately from current service burden. Economic allocation cannot shrink physical stock or gross flows."
    source_ids:
      - jrc-ceramic-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: v_sources
    applies_to: "evidence"
    rule: "Check complete source context counterexamples and actual plant evidence. BREF electroporcelain emissions and thermal examples are not crucible factors; Morgan test-piece values are indicative and not guaranteed component properties. An old edition alone does not invalidate qualitative manufacturing evidence. Preserve missing data uncertainty and native identity holds."
    source_ids:
      - jrc-ceramic-bref-2007
      - morgan-sintox-fa-2013
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "upstream module for actual chemical-crucible manufacture or original-cohort services only after independent core identity and all applicability conditions are established"
  allowed_use: "attributional manufacture and separate services within declared boundary with actual supply/state restrictions"
  excluded_use: "usable guidance without confirmed core identity; other ceramic-family substitution; automatic CPC coverage; unobserved service-life claims; methodology approval or TIDAS-format compliance claims"
  required_metadata: "actual site period region provider and boundary; one bare empty crucible body design geometry usable capacity and delivered completeness; nominal95% alumina class actual assay phase impurities surface and open porosity; raw supplied form whole formulation and carried water; pressing type powder conditioning drying debinding sintering and finishing route; actual chemical and thermal application acceptance and contamination limits; first-release Q dry net body mass traceable release IDs; opening/closing raw WIP unassigned stores and per-exchange inherited burden vectors; all operating failure idle cleanup and rework modes; original-cohort Qc observed service horizon and FG gross movements; each packaging physical pool ownership and gross stock movements; asset service burden versus physical equipment mould refractory fluid stocks; actual species phase medium source origin state and independent evidence; carrier mass heat enthalpy and supplier water convention; exact native identities restrictions uncertainty and unresolved fields"
  required_quality_disclosure: "qualified whole finished refractory-ceramic identity and actual minor phases; all native limits; unresolved actual auxiliaries/providers/quantities; history gaps; service H; independent balance residuals and uncertainty"
  update_trigger: "resolved native core identity; material/surface/forming-sintering route/terminal change; updated supply measurement or history evidence"
