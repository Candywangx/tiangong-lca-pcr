  identity_restrictions:
    core:
      uuid: daa9b8ab-d153-43e0-a265-48e14527f6dc
      restrictions: Native Product flow is production mix at plant; no geography CAS grade or single silica phase is fixed. Its complete definition includes high-temperature fired silica-based bricks with thermal-shock/structural stability. Adopt only the actual fired machined opaline-diatom/clay backup-insulation brick supported by the cited manufacturer terminal, not any unfired powder ordinary clay building brick dense quartz silica brick or generic purchased article. Native classification says other than siliceous earths (37320), inconsistent with the broad silica-inclusive material definition; disclose this classification discrepancy without treating it as acceptance or using it to waive a hard material/phase/route/type conflict. Actual grade performance and provider compatibility require separate evidence.
    limestone:
      uuid: 6cf9f186-6e7e-40b5-800e-6759a429e7a8
      restrictions: Native Product limestone uses Mass/kg; composition purity grade extraction route geography and provider are unspecified. Adopt whole actual stone only with independent carbonate/moisture/impurity assays; not precipitated pure CaCO3 or native-ground elementary resource.
    diesel:
      uuid: 9d258d75-6792-4f1c-9856-81602ed8f816
      restrictions: Native Product diesel is Mass/kg with fuel grade formulation density heating value refinery geography and provider unspecified. Require actual delivered diesel specification; neither a water/air diesel emission node nor a fixed heating value or density.
    naturalgas:
      uuid: 4bfd1abb-9106-495a-a291-ce410f205691
      restrictions: Native Product flow specifies production mix at plant GLO and burning in an industrial furnace; reference property is Gross calorific value/MJ, not Mass, NCV or delivered useful heat. Use only that actual gas-fuel route; verify supplier composition actual GCV and carrier mass independently and do not duplicate a purchased complete heat provider.
    pe:
      uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
      restrictions: Native Product polyethylene film CAS9002-88-4 production mix at plant Mass/kg; branch/grade supplier and location are not fixed. The luggage classification is an isolated mismatch with coherent PE CAS/name/film identity. Comment compares PET as a competing material; it does not make PET part of this PE identity. Use actual single PE film only and verify formulation/recycled content/provider separately.
    pallet:
      uuid: 96b2b9ac-cfb6-46bf-8ad1-c056e338950a
      restrictions: Native Product is complete Wooden pallet (EURO), Mass/kg; no conversion to a guessed per-pallet mass or fixed reuse life. The record explicitly states account-local reconstruction of ELCD3.2 with retained canonical properties and separately documented unsupported source properties; that provenance is not independent scientific approval. Verify actual EURO configuration moisture and upstream provider.
    oxygen:
      uuid: e2fb04b0-6555-11dd-ad8b-0800200c9a66
      restrictions: Native Elementary flow O2, CAS7782-44-7, Mass/kg, Resources from air; renewable element resource; no geography/provider fixed. Broad multilingual synonyms can mention liquid isotope acid or other forms; they do not authorize a different phase structure or species. Apply only independently measured actual O2 and this precise origin/direction/medium; not purchased gas total air a total-element indicator or a guessed species.
