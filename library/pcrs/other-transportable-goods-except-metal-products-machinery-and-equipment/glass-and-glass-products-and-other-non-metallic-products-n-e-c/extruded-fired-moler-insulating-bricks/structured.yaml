      flow_role: "original released cohort brick and increments"
      record_type: "physical FG and incremental service ledger"
      raw_fields: "cohort_id; original_Qc; observed_H; openingFG; new_first_releases; gross_G; actual_R; dispatch_ID; return_state; closingFG; destruction; other_exit; new_water; new_material; real_loss; rework; inherited_vector; manufacturer_permission; moler_grade_compatibility; actual_rework_route; final_reacceptance; removed_old_material; independent_water_loss"
      collection_method: "Trace original releases dispatch and returns by IDs with actual mass moisture state and damage; keep original manufacturing burden intact and collect only real storage packing handling and post-release rework increments. No new Q or automatic reversal. Raw collection/storage remain undivided numerators; aggregation basis describes only the final value produced by the sole quotient in section 8. Any actual post-release rework requires manufacturer-compatible permission for the actual moler grade and original insulating-brick terminal, followed by actual dimensional/thermal/mechanical reacceptance after processing. Do not assume repairability, a pass, refiring or organic adhesive/coating restoration. Incompatible formulation/surface/terminal changes require a separate scope. Added material/water, removed old material and independent water loss need actual atomic exchanges/destinations; wet physical mass stays distinct from original dry-reference Qc."
      unit: "kg and each service native unit"
      frequency: "each stock movement event and observed horizon close"
      temporal_coverage: "declared actual H for each original cohort"
      site_scope: "physical FG gate and actual service operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "cohort genealogy calibrated weights state observations time logs"
  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw units and actual rates to each selected native extensive numerator before attribution. Integrate real rates over their measured interval; do not integrate already totalised volume again. kWh to MJ uses 3.6 only for matching energy; gas GCV NCV heat and carrier mass are distinct accounts requiring independent supply composition state and calorimetry."
      inputs:
        - raw_reading
        - actual_state
        - calibration
      output: "raw_extensive_amount"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: first_release
      applies_to: "finished_brick"
      rule: "Q = sum of unique dry bare complete brick net masses at first final release after machining and quality acceptance. Released closing FG is included once; unreleased WIP rejected bodies returns reinspection and dispatch are not new Q."
      inputs:
        - cp_release
        - unique_release_IDs
      output: "Q"
      source_ids:
        - skamol-moler-epd-2023
        - skamol-ceramic-brochure
    - id: manufacture_burden
      applies_to: "manufacture"
      rule: "For each exchange j: A_j = Bopen_j + P_j - Bclose_j - Tother_j after actual unit conversion subdivision and evidenced attribution. B vectors belong only to raw/WIP/unassigned non-WIP stores; released FG is never manufacturing Bclose. P retains failures zero-output idle start-stop cleanup and rework. Each transfer or subtraction requires independently identified destination and inherited vector. Declare each raw receipt/occurrence versus already-stock-adjusted actual consumption basis. A net-consumption material amount is not corrected for the same raw stock again, while consumed opening material retains its upstream history and WIP/non-WIP vectors use a consistent basis. Ordinary waste export or sale does not automatically create a Tother deduction: only an independently justified actual cofunction/attribution under Section7 can transfer burden; a destination ticket or price alone cannot erase failed production, residue manufacture or treatment burdens."
      inputs:
        - Bopen_j
        - P_j
        - Bclose_j
        - Tother_j
        - cp_material_prepare
        - cp_material_form
        - cp_material_thermal
        - cp_material_finish
        - cp_asset
      output: "A_j"
      source_ids:
        - skamol-moler-epd-2023
        - jrc-ilcd-allocation-2010
    - id: cohort_service
      applies_to: "service"
      rule: "Preserve original manufacturing vectors. Aservice_j is only actual incremental service burden attributed to original cohort Qc over observed H. Physical FG in actual-state mass: openingFG + first-release bodies at actual FG state + actual returns + actual added water/material = closingFG + gross dispatch + destruction + other evidenced physical exits including evaporation/process loss. Keep dry reference Q separate from actual wet physical masses with independently measured water; no automatic original-manufacture reversal or new Q."
      inputs:
        - cp_service
        - cp_pack
        - Qc
        - H
      output: "Aservice_j"
      source_ids:
        - skamol-moler-epd-2023
        - jrc-ilcd-allocation-2010
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "The only unit-result step is a_j = A_j / Q for manufacture and aservice_j = Aservice_j / Qc for the separately labelled original-cohort service over observed H. Perform once after raw-unit conversion stocks and attribution. Collection stores unnormalized raw; card amounts and aggregation refer to this same result without dividing again. For body hand-off and FG/dispatch/return physical-ledger cards the numerator is the actual unallocated physical quantity, not a newly generated manufacturing burden; keep inherited burden vectors and incremental-service attribution separate. Q or Qc equal to zero retains real burden with no unit result. Internal transfers cancel on consolidation."
      inputs:
        - A_j
        - Q
        - Aservice_j
        - Qc
        - cp_release
        - cp_service
      output: "a_j; aservice_j"
      source_ids:
        - skamol-moler-epd-2023
        - jrc-ilcd-allocation-2010
    - id: pack_stock
      applies_to: "cp_pack"
      rule: "For each material/configuration: opening empty+WIP-attached+FG-attached+reusable stocks + purchases P + attached inbound I + external returned receipts ER + Radd + H2Oin = corresponding disjoint closing stocks + packages with gross shipment S + outward returns EO + waste W + Rremove + H2Oout. Radd/Rremove are real repair material additions/removals outside existing whole-package directions; H2Oin/H2Oout are independent uptake/release outside water already carried in those measured streams. All flow terms are disjoint: a child in another measured direction is counted once, but retention of added mass in closing stock never cancels its real influx. Keep dry wood/other material and free/absorbed water independent; one wet residual cannot fit two unknowns. Each actual repair wood/fastener/glue/water/removed outlet requires a specific atomic identity/status and destination. Internal reuse/component handoffs cancel once, gross physical terms are not economically scaled and never enter bare-brick Q; original-cohort inherited purchase and actual incremental operation burdens are assigned once."
      inputs:
        - cp_pack
        - purchases
        - gross_shipments
        - external_returns
        - waste
        - attached_inbound
        - Radd
        - Rremove
        - H2Oin
        - H2Oout
      output: "packaging_balance"
      source_ids:
        - skamol-moler-epd-2023
    - id: asset_stock
      applies_to: "cp_asset"
      rule: "Reconcile actual physical new/used whole assets replacements installed fluids water wear repair retirement and closing stocks for each material/form. Attribute actual period service burdens from deployment and measured use plus inherited vectors without fixed life; embedded items in a whole asset are not purchased twice. For each physical item reconcile opening + actual gross receipts + independently measured new material/water = closing + outward returns + retirement/waste + wear into other recorded streams + actual water loss/other exits, with disjoint terms. Included whole-asset components/fluids remain child ledgers and worn material is not disposed twice. Closing retention leaves real influx intact; physical mass is not scaled by period-service shares."
      inputs:
        - cp_asset
        - measured_use
        - inherited_vectors
      output: "period_asset_service"
      source_ids:
        - jrc-ilcd-allocation-2010
        - jrc-ceramic-bref-2007
    - id: physical_species
      applies_to: "all physical gates"
      rule: "Reconcile independent whole mass and relevant elements using actual feed assays carbonate conversion oxygen uptake carbon-origin retention and individually measured molecular gas/phase-water paths. Gross air species and external heat carriers are physical subaccounts without duplicate provider purchases. One residual does not fit two unknowns; indicators COD VOC PM and total elements do not identify molecules."
      inputs:
        - cp_material_prepare
        - cp_material_form
        - cp_material_thermal
        - cp_material_finish
        - cp_air_thermal
        - cp_air_prepare
        - cp_air_service
        - cp_utility_prepare
        - cp_utility_form
        - cp_utility_thermal
        - cp_utility_finish
        - cp_utility_support
        - cp_utility_service
        - cp_residue_prepare
        - cp_residue_form
        - cp_residue_thermal
        - cp_residue_finish
        - cp_release
        - cp_service
      output: "mass_element_residuals"
      source_ids:
        - skamol-moler-epd-2023
        - skamol-ceramic-brochure
        - jrc-ceramic-bref-2007
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each exchange"
      requirement: "Verify exact native whole-form material phase route type media geography reference property/unit and official Chinese names. Provider grade or auxiliary gaps require actual data but alone do not imply a core hold."
      evidence: "full native records actual supplier specifications and product tests"
    - id: dq_time
      applies_to: "whole period"
      requirement: "Retain complete site/cohort period all failure idle start-stop cleanup and rework modes raw/WIP/store inheritance and original Qc observed H services."
      evidence: "raw meters stock genealogy release register and event logs"
    - id: dq_balance
      applies_to: "physical gates"
      requirement: "Quantify independent uncertainty for mass composition moisture phases gas-state speciation and calorimetry; disclose unclosed mass/element residuals without fitting missing species or declaring false precision."
      evidence: "calibrations assays sampling state certificates independent balances"
    - id: dq_complete
      applies_to: "dataset"
      requirement: "Keep absent measured-zero below-detection unknown and unresolved identity distinct. Add any actual omitted atomic exchange; future foreground amounts are requirements and not invented measurements. Scientific and translation reviews are independent of engineering checks."
      evidence: "atomic completeness register unresolved list and evidence"
validation_rules:
  - rule_id: v_identity
    applies_to: "dataset"
    rule: "Verify fired opaline diatom-earth/clay brick terminal and all native card restrictions against actual route composition state type property unit and supplier. The reference family includes fired silica-based bricks but its external classification excludes siliceous earths; this discrepancy never creates an accepted classification edge and cannot waive any physical incompatibility."
    source_ids:
      - skamol-moler-epd-2023
      - skamol-ceramic-brochure
  - rule_id: v_quantity
    applies_to: "all stages"
    rule: "Reconcile unique Q first releases including released closing FG; no extra FG output or manufacturing FG subtraction. Record every inherited raw/WIP/store vector and actual failed/rework load before one quotient. Q=0 retains loads without unit results. Retesting and shipment are not production."
    source_ids:
      - skamol-moler-epd-2023
      - jrc-ilcd-allocation-2010
  - rule_id: v_species
    applies_to: "physical gates"
    rule: "Reconcile independent whole mass and C H O N S Ca Si Al Cl F where present at manufacture service and consolidated gates. Resolve real oxidation carbonate conversion clay dehydroxylation opal water and free/adsorbed moisture with independent measurements. One residual cannot determine two unknowns; neither loss-on-ignition nor shrinkage defines molecular gas mass."
    source_ids:
      - skamol-moler-epd-2023
      - skamol-ceramic-brochure
      - jrc-ceramic-bref-2007
  - rule_id: v_utilities
    applies_to: "utilities"
    rule: "Use each row native extensive property; Mass/kg does not apply to kWh MJ or m3. Integrated volumes are not multiplied by time again; actual rates alone are integrated. Independent density composition pressure temperature and calorimetry establish conversions and carrier mass/heat subaccounts. Do not charge a whole provider and its fuel or water twice."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_stocks
    applies_to: "packaging assets and FG"
    rule: "For every packaging configuration reconcile all disjoint opening and closing empty WIP-attached FG-attached reusable pools plus purchases attached inbound external returns received against gross shipments external returns out and waste. Physical capital new/used stocks actual replacements wear retired articles and in-service fluids have separate material/state balances and actual period service attribution without an invented life."
    source_ids:
      - skamol-moler-epd-2023
      - jrc-ilcd-allocation-2010
  - rule_id: v_evidence
    applies_to: "sources and completeness"
    rule: "Confirm full source context and neighboring counterexamples. EPD composition/packaging percentages LCIA cutoffs RSL densities and old site totals are not factory defaults; BREF silica/high-alumina thermal tables and chromium figure are not moler data. Unknown species native identity or inherited history remains explicit and blocks dependent numerical results."
    source_ids:
      - skamol-moler-epd-2023
      - skamol-ceramic-brochure
      - jrc-ceramic-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "actual matching moler insulating-brick supply-chain models; manufacturing and original-cohort service disclosed separately"
  allowed_use: "attributional LCA where boundary grade application and evidence match and all qualifiers are complete"
  excluded_use: "insulation lifetime comparisons without functional equivalence other material families default density recipe life or treating engineering checks as scientific approval"
  required_metadata: "moler geological origin and natural clay/opaline skeleton composition; actual whole supply forms and moisture assays; wood species origin and pore-former carbon/ash; limestone presence assay and carbonate conversion; extrusion cut geometry and machining state; actual drying burnout firing cooling route and atmosphere; thermal mechanical dimensional acceptance method and grade; first final release cohort IDs and dry bare net mass Q; reference flow family native restrictions and classification discrepancy; raw WIP stores inherited per-exchange burden vectors; released FG dispatch return and observed cohort-service horizon; utility supplier geography voltage fuel state heat/carrier conventions; atomic gas species phases and independent mass/element evidence; disjoint packaging and physical capital/fluid stocks; single attribution and normalization with uncertainty disclosure"
  required_quality_disclosure: "actual site period representativeness uncertainty omissions restrictions unclosed balances and identity versus provider data"
  update_trigger: "material phases supply forms pore former route grade energy provider geometry terminal release gate stock or service horizon materially change"
data_sources:
  - id: "skamol-moler-epd-2023"
    type: "dataset"
    reference: "Skamol Group; MD-23062-EN Version 1 issued 14 April 2023 valid to 14 April 2028; 2021 Fur site data; full 21-page EPD; product groups pp2/4/5 flowdiagram p6 system boundary p7 limitations pp18-21. https://www.skamol.com/Admin/Public/Download.aspx?file=Files%2FFiles%2FDocumentation%2FEPD%2FEPD-Skamol-moler-products-EN15804-A2.pdf"
    used_for: "Qualitative actual moler sawdust limestone extrusion drying firing machining packaging route and terminal. No recipe packaging share site LCIA density RSL cutoff or end-of-life credit defaults."
  - id: "skamol-ceramic-brochure"
    type: "extension_guidance"
    reference: "Skamol by Etex; SkamoCeramic Insulation system for high temperature industries; undated publisher brochure; complete 8 pages; moler p4 versus vermiculite/calcium-silicate pp5-6. https://www.skamol.com/Admin/Public/Download.aspx?file=Files%2FFiles%2FDocumentation%2FBrochures%2FSkamoCeramic-UK.pdf"
    used_for: "Fired sanded moler brick terminal opaline diatom/montmorillonitic-clay structure and backup insulation function; adjacent board families are exclusions. No grade-specific performance prescription."
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission JRC; Reference Document on Best Available Techniques in the Ceramic Manufacturing Industry; August 2007; complete PDF; sections 2.3.3 and adjacent 2.3.2/2.3.4; printed pp49-54; Figures2.16/2.17 and Tables2.8-2.12. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "General unit operations utilities actual waste and gas candidates and incompatible routes. Chromium basic-brick figure and silica/high-alumina process numbers are counterexamples; no moler recipe or gas factor transfer."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC; ILCD Handbook General guide for Life Cycle Assessment Detailed guidance; first edition March 2010; sections7.9.2-7.9.3 printed pp255-272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "General attributional subdivision and exchange-specific determining physical causality followed only for residual common process by contemporaneous actual-gate state-specific market value; not industrial manufacturing evidence."
