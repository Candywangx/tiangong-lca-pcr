  semantic_boundary_decision: Complete1257-material checked35 catalog and frozen adjacent scopes lack a compatible raw-batch-to-unworked-ophthalmic-pressing method. Float/rolled/edge-worked/toughened/insulating/cellular glass, tubing, fibre/mat, food jars, lamp envelopes and domestic pressed ware have different terminal/forming/quality gates. New narrower candidate is one nonphotochromic single-vision silicate glass pressing, never the entire classification leaf. No accepted mapping edge or coverage claim.
  true_core_holds: []
  source_format_limitations:
    - The complete manufacturer page was independently read through the web tool, including raw batch, melt/fining, conditioning, gob shearing, pressing, standard annealing, photochromic countercontext and packing. This is publisher-origin web-rendered text, not a locally acquired publisher HTML/PDF. All failed local/browser acquisitions remain in review evidence; acquisition mode alone is not a missing core-method source.
    - The complete 2013 publisher specification and Glass BREF independently support terminal/quality distinctions and process completeness. Electrical heating and hydraulic pressing are bounded technical synthesis options, not proof of one contemporary all-electric factory, recipe, SKU, performance or numerical foreground inventory.
    - Scientific and translation review remain pending. Authored maturity does not grant active guidance, accepted classification mapping, coverage or publication.
  core_reference_identity:
    state: verified_public100_exact_narrow_member
    uuid: 86f99422-b0c1-4f90-8150-aa288e54a03f
    scope: Broad manufactured Product family explicitly includes spectacles glass not optically worked; only that unworked single-vision pressing member is adopted with full consumable restrictions. The optical-pressing-blank alternative with a fixed90–96% silicate descriptor is not adopted.
  ordinary_data_gaps:
    - Future actual factory quantities, individual supplier/grade/route compatibility, assays, water/speciation and historical records remain required; no numerical foreground package or factory pass is claimed.
    - Unbound auxiliary/input/waste/transport and environmental atoms remain chemically/physically specific with real query evidence; these ordinary identity/provider gaps alone do not justify draft. No acquisition-only core hold is inferred from the missing local HTML.
  native_identity_limitations:
    core: "Only the not-optically-worked spectacle-glass member of this broad manufactured Product family is selected: one uncoated nonphotochromic single-vision silicate blank after pressing and annealing. Other members in its official basename do not enter this exchange. Native mix is at plant; no CAS, recipe, grade, optical finish, geometry, geography or provider is specified. The Chinese comment refers to making such articles; neither it nor the generic finished-product route proves a polished lens. Actual unworked state and drawing/QC must be documented."
    potash: Synthetic solid K2CO3 Product, CAS584-08-7, production mix at factory; native molar-mass descriptor is not a purchased amount or purity. Confirm hydration/assay and producer route; fertilizer potash mixtures are excluded.
    limestone: Limestone Product on Mass, with composition, grade, route and provider explicitly unspecified; no invented pure-CaCO3 assay or calcite equivalence. Use the entire actual supplied mineral and its measured impurities.
    boric: Orthoboric-acid crystalline/powder Product from primary production at plant; no native CAS or fixed assay. Do not turn it into borax or B2O3. Retain free moisture and independently evidenced dehydration/reaction-water pathways.
    alumina: Bayer-process alumina Product at plant; native synonyms/comment mention corundum and hydrated occurrence but do not authorize buying aluminium hydroxide as alumina. Confirm supplied oxide phase, hydration, assay and route; no density is inferred.
    antimony: Solid Sb2O3 Product, CAS1309-64-4, factory mix, no fixed production route or purity. Use only actual separately purchased fining input; not a flame-retardant formulated mixture or measured total-Sb emission.
    ceria: CeO2 Product, CAS1306-38-3, factory mix, no fixed route/assay. This card is a batch additive only when actually present; polishing slurry and post-release optical surfacing are outside this route.
    diwater: De-ionised-water Product, Mass; no native CAS, geography, provider or temperature. Match true supply quality and boundary, not mains water or environmental abstraction; density/state require independent measurement.
    electricity: CN customer-side grid-average alternating-current Product, 1–35kV, consumption mix to user, Net calorific value/MJ. Adopt only for that delivery boundary/voltage/geography; replace identity for other locations, voltage or contractual supply. Do not add transmission/distribution already in the provider. 1kWh=3.6MJ; energy has no carrier mass.
    co2: CO2 CAS124-38-9 Elementary emission to air unspecified, fossil/mineral carbon origin only. Native noisy isotope/ion synonyms do not authorize radioactive/isotopic CO2. Separate atmospheric pass-through, biogenic sources and truly reacted mineral carbonate using independent carbon evidence; do not copy a furnace factor.
    no: NO CAS10102-43-9 Elementary air-unspecified emission only. Native synonym noise includes HNO but the adopted species is molecular NO; actual species-resolved measurements required. NOx-as-NO2 is not this mass.
    no2: NO2 CAS10102-44-0 Elementary emission to air unspecified; synonyms mention N2O4, which cannot establish its mass. Require phase/species-specific evidence and equilibrium treatment where relevant, never total NOx allocation by assumption.
    so2: SO2 CAS7446-09-5 Elementary air-unspecified emission only, not total SOx or sulfate dust. Confirm native CAS, actual molecular speciation and location; no default sulfate conversion fraction.
    waterair: H2O CAS7732-18-5 Elementary water-vapour emission to air unspecified; noisy heavy/tritiated-water synonyms are excluded. Keep evaporation, inlet humidity, actual chemical reaction water and retained structural water distinct; liquid droplets require a separate physical phase.
    n2in: Molecular N2 CAS7727-37-9 resource from air. Only actual gross ambient-air N2 intake with independently measured composition; do not add an aggregate air exchange or purchased nitrogen provider a second time.
    n2out: N2 CAS7727-37-9 Elementary emission to air unspecified. Gross pass-through plus genuinely generated N2 must be reconciled by species; not NOx, total nitrogen or a nitrate reaction assumption.
    o2in: O2 CAS7782-44-7 resource from air; no purchased bottled-oxygen supplier is represented. Keep gross intake, chemically consumed/released oxygen and outlet quantities separate; native isotope/ion synonyms are not adopted.
    wasteoil: Waste Flow of used petroleum/synthetic lubricating oil at generation; treatment unspecified. Use entire measured actual waste with water/additive contamination; no recycling credit, universal composition or automatic waste-oil sale product.
