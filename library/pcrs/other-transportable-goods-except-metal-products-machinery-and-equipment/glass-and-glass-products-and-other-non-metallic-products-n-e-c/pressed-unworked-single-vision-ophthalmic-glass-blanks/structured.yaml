allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "These attributional rules apply only to uncoated nonphotochromic single-vision optically unworked silicate ophthalmic pressings, from whole supplied batch materials through electric melting/fining/conditioning, gob shearing, hydraulic pressing/cooling and electric annealing to unique first quality release, plus actual original-cohort services. Exclude watch covers, spheres, fused segments, photochromic activation, finished optical surfacing/polishing/coating and other heating/forming routes. Consume every rule with this scope and its ancestor conditions."
    source_ids: []
  - rule_id: allocation_scope
    applies_to: "all processes"
    rule: "Use only the declared attributional inventory context where allocation is appropriate after goal/scope choice. Assign dedicated measurements and use physical/virtual subdivision first; keep exclusively related raw materials, rejection/rework and services with their actual product/cohort. Industrial manufacturing documents are not allocation evidence."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_causal
    applies_to: "shared process exchanges"
    rule: "For each genuinely shared exchange determine which physical relationship controls that exchange quantity. Use measured heat capacity/enthalpy and thermal history for heating only where causal; processing time/load or another extensive driver must be justified per exchange. A mass share is not automatically valid for all electricity, cooling, assets or pollutants. Retain method, measurements, uncertainty and sum conservation."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "remaining shared exchanges"
    rule: "Only a demonstrably remaining common-process burden without a determining physical relationship may use economic allocation: actual quantities and contemporaneous market values of cofunctions in their actual condition at the same process exit/entry gate. Explain the residual, period, quality, packing state, currency and volatility. Never freely choose physical versus economic shares, fixed ratios, avoided-production credits, or automatic cullet/recovery benefits."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_service
    applies_to: "services"
    rule: "Post-release handling/packaging/storage and actual returns retain original cohort Q and each original inherited burden vector; record only actual incremental service/rework/loss burden in its observed horizon. Do not remove manufacturing burdens of closingFG from original first-release Q, add closingFG as another production output, or create Q by reinspection or dispatch. An independently reported net-delivery study needs gross G/R, original-delivery reversal D_rev, opening/closingFG history and measured new water/loss/rework; this first-release denominator cannot be silently reused."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
