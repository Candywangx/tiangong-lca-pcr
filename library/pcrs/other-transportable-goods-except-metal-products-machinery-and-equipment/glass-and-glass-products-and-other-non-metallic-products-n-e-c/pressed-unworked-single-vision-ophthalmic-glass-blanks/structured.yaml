    - protocol_id: cp_service
      process_id: "services"
      flow_role: "fg_received; fg_dispatch; service_glass_waste"
      record_type: "Raw measured/history record"
      raw_fields: "original release id; original Q; opening/closingFG; internal Q transfer; gross dispatch G; returned lot R; original dispatch id; measured returned dry mass/water/contamination; service waste; actual rework; horizon; inherited vector; D_rev if net delivery is separately studied; permission_record; postwork_test_scope; acceptance_disposition; new_removed_parts_water_species; repair_WIP_or_FG_substate; actual_first_release_state_mass"
      collection_method: "Retain full original-cohort ledger, trace actual gross dispatch/return and new service/loss/rework at the declared observed horizon. Reinspection/redispatch do not create new Q. Net-delivery alternatives need a separate original reversal bridge and actual returned-state measurements. Collection and aggregation sum only undivided raw extensive amounts by actual exchange/cohort. Convert, reconcile history and actually attribute first; only calc_reference produces x_i on the same per1kg reference-flow basis. This aggregation field merely references that result and does not divide Q again. For each original cohort, opening physical FG + actual first-release internal physical receipt + actual external returned material + every actual added material/water/species = closing physical FG + gross physical dispatch + actual standalone external return + service waste + each actual removed material/water/species/loss. The first-release physical receipt is independently measured at its actual state and linked to dry bare-glass Q; moisture/contamination/retained contents do not become dry Q. Repair-held units are a named FG custody substate OR disjoint repair-WIP opening/closing once. Record original release and original dispatch reversal independently from current returned wet/state mass. Permit only actual manufacturer/specification-authorized compatible work within this unworked-blank boundary, with defined post-work tests and actual acceptance/disposition; broken/failed blanks are reject/waste unless independently eligible. Every actual new/removed component and water phase has an atomic row before completion; no assumed restoration or equal input/return mass. Cancel internal transfer at the combined gate, preserving original manufacture once and all observed incremental services without adding new Q."
      unit: "kg"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Complete production period/all modes; original-cohort service horizon separately"
      site_scope: "Each actual line/furnace/circuit/stock/service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; independent composition/phase evidence; history vectors; uncertainty"
