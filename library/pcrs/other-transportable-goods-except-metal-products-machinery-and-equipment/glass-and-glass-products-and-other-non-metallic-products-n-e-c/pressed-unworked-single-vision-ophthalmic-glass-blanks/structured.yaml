      process_id: "services"
      flow_role: "service_electricity"
      record_type: "Raw measured/history record"
      raw_fields: "original release id; original Q; actual service horizon; operation; meter id; readings; allocation driver"
      collection_method: "Meter only actual original-cohort service increments, preserve all nonproductive and rework loads and keep the original released denominator; future unobserved service is undisclosed coverage, not zero. Collection and aggregation sum only undivided raw extensive amounts by actual exchange/cohort. Convert, reconcile history and actually attribute first; only calc_reference produces x_i on the same per1kg reference-flow basis. This aggregation field merely references that result and does not divide Q again."
      unit: "kWh"
