system_boundary:
  rules:
    - rule_id: boundary_full
      applies_to: "all processes"
      rule: "Start at receipt of each actual whole mineral/chemical supply and compatible cullet with upstream supply burdens and actual inbound logistics; include weighing/mixing, electric melt/fining, platinum-contact stirring/conditioning, gob shearing, hydraulic pressing/cooling, electric annealing/cooling, inspection and unique first quality release. Retain actual water/air utilities, abatement, maintenance, all nonproductive conditions, stocks and separate post-release services. Do not replace this manufacture with bought-blank packing."
      source_ids:
        - jrc-glass-bref-2013
        - corning-ophthalmic-manufacturing
        - corning-ophthalmic-spec-f-2013
    - rule_id: boundary_state
      applies_to: "all processes"
      rule: "Apply only to the declared uncoated nonphotochromic single-vision silicate pressing blank. Do not require one modern order to prove the general unit operations; technical synthesis is not a same-factory recipe. Actual fuel-fired, reheat-pressed, photochromic-activation, fused-segment, optical-polishing/coating or tempered-lens routes need separate applicability review. If actual ancillary fuel or steam exists, disclose and add each atomic real supply, carrier mass/heat and return, rather than asserting zero or omitting it."
      source_ids:
        - jrc-glass-bref-2013
        - corning-ophthalmic-manufacturing
    - rule_id: boundary_history
      applies_to: "manufacture"
      rule: "For every extensive exchange i retain its independent unnormalised inherited burden vector. A_i = B_open_i + C_i - B_close_i after actual unit conversion and attribution; manufacturing B_close includes raw stock, WIP and genuinely unassigned non-WIP stores, never this cohort closingFG already released into Q. Include failed batches, zero-output periods, start/stop, idle, cleanup, rejects and actual rework. No unmeasured history is set to zero. Distinguish gross receipts from a proved already-stock-adjusted material-consumption or issue basis. Correct the same raw-stock change once only; never apply opening/closing raw stock again to already measured consumption. Keep each disjoint raw/WIP and included non-WIP installed/store physical quantity and every inherited exchange vector separately. An explicit purchase/receipt, return, gross dispatch or waste-movement card retains its full converted physical leg; allocation/stock correction affects the separate burden or consumption vector, never that gross movement."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_physical
      applies_to: "all processes"
      rule: "Close manufacturing, FG/service and combined physical gates independently of burden allocation. For each whole material and each relevant element: opening physical stocks + gross actual external inputs = closing stocks + gross actual external outputs; internal transfers cancel exactly. Keep installed assets/fluids separately with new/repair/retirement events and wear. Do not shrink gross receipts, returns, shipments, wastes or packaging by economic allocation shares."
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_species
      applies_to: "all processes"
      rule: "Whole mass and elemental balances do not prove molecular speciation or reaction-water pathways. Independently determine moisture, free/structural/chemically generated water, evaporation and actual phase. For any unresolved two-unknown water/species system obtain a second independent observation; one closure residual cannot determine both. Separate gross air species, no aggregate air plus children; no conversion of COD/VOC/NOx/total-B/total-C or size bins into invented molecular species."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: boundary_expand
      applies_to: "all inventory rows"
      rule: "This is a finite initial atomic inventory, not an assertion that every site contains only these materials. Compare each actual supply, asset/repair event, maintenance formulation, air/water outlet and packaging against it; add every real missing individual exchange, its native extensive property, protocol and uncertainty before modelling. Unknown actual core product/route/gate or unclosed required physical/species history prevents usable results. An auxiliary UUID/provider gap alone does not change product identity."
      source_ids:
        - jrc-glass-bref-2013
