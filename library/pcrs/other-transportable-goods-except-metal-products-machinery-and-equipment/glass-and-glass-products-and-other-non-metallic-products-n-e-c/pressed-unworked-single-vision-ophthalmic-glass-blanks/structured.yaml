    - protocol_id: cp_packaging
      process_id: "services"
      flow_role: "tray_purchase; tray_supplier_included; tray_returned_in; tray_gross_out; tray_return_out; tray_waste; carton_purchase; carton_supplier_included; carton_returned_in; carton_gross_out; carton_return_out; carton_waste"
      record_type: "Raw measured/history record"
      raw_fields: "material/article id; moisture; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; purchased; external_returns_received; closing_empty; closing_attached_WIP; closing_attached_FG; closing_reusable; gross_outbound; external_return_out; waste; internal_reuse; original cohort; supplier_included_receipts; supplier_burden_included; actual_repair_new_component; actual_removed_component; water_phase_in_out; independent_mass_state; flow_term_nonoverlap; complete_stock_moisture"
      collection_method: "Weigh each actual whole tray and whole carton separately; reconcile every empty/attached/reusable stock and external direction before assignment. Add any actual crate, film, pallet, label or strap as its own full atomic ledger. Internal reuse cancels and physical movements are never allocated away. Collection and aggregation sum only undivided raw extensive amounts by actual exchange/cohort. Convert, reconcile history and actually attribute first; only calc_reference produces x_i on the same per1kg reference-flow basis. This aggregation field merely references that result and does not divide Q again. Keep one complete actual article and its actual moisture/state. Apply calc_packaging: all four disjoint opening/closing states, separate purchase, supplier-included physical receipt, external return received, gross physical outward shipment, standalone outward return and waste; actual repair-component/water additions/removals use distinct measured nonoverlapping flow terms. Retained added mass stays in BOTH the actual inflow and complete closing stock. Burden/consumption history is separate from gross directions; supplier-included burden is not bought twice and internal reuse creates no Q or credit. Add every actual repair component and water phase as specific atomic exchanges before modelling; receipt issue or net consumption is declared and not stock-corrected twice."
      unit: "kg"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Complete production period/all modes; original-cohort service horizon separately"
      site_scope: "Each actual line/furnace/circuit/stock/service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; independent composition/phase evidence; history vectors; uncertainty"
  calculation_rules:
    - id: calc_raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert raw extensive quantities to the row numerator unit before attribution: kg from calibrated whole-material weighing; electricity MJ = 3.6 * metered kWh; tkm from actual tonnes and km. For a true rate integrate over time once. For an already integrated gas/liquid volume do not multiply time again; use independently measured density/composition at that substance state. Item counts require measured configuration-specific net mass M or total weighed lot kg; never infer density/item mass from native secondary factors."
      inputs:
        - raw_i
        - conversion_i
        - cp_batch
        - cp_energy
        - cp_water
        - cp_air
      output: "C_i"
      source_ids:
        - jrc-glass-bref-2013
    - id: calc_history
      applies_to: "all inventory rows"
      rule: "A_i = B_open_i + C_i - B_close_i with each vector component preserved and actual attribution applied once. Manufacturing B_close excludes all first-released cohort FG; closing raw/WIP/unassigned stores alone retain not-yet-released burden. Internal cullet/melt/Q transfers cancel without a second supplier burden. Service A_i uses actual increments assigned to original cohort and observed horizon, not another original manufacture. Use the receipt-versus-already-adjusted-consumption distinction in boundary_history: C_i must declare its original basis, and no raw-stock correction is repeated. Physical movement cards keep complete converted gross quantities rather than subtracting stocks or multiplying an economic burden share. Actual performed service increments remain assigned to original Q at the observed horizon even when the serviced FG remains held; only genuinely unconsumed/unassigned charge/service stores carry forward."
      inputs:
        - B_open_i
        - C_i
        - B_close_i
        - cp_balance
        - cp_service
        - cp_assets
      output: "A_i"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q; A_i is attributable unnormalised exchange amount in this row numerator unit; Q is unique first-released dry bare-blank kg. This is the only normalization. Inventory cards and collection aggregation merely reference x_i and never divide again. If Q = 0 retain all raw loads/history and report no unit result. Finished blank = 1 kg is a declared reference identity, not a second division."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "x_i"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all physical streams"
      rule: "At each manufacturing/FG/combined gate use opening stocks + gross external inputs = closing stocks + gross external outputs, independently for total material, water and relevant elements. Keep assets/installed fluids separate, cancel internal movements, and distinguish real reaction/phase/species routes. No allocation shares scale gross physical amounts and no residual fits two unknowns."
      inputs:
        - gross_i
        - stock_open_i
        - stock_close_i
        - cp_balance
        - cp_emissions
        - cp_water
      output: "physical_closure_i"
      source_ids:
        - jrc-glass-bref-2013
    - id: calc_packaging
      applies_to: "services"
      rule: "For EACH actual tray and carton separately: opening_empty + opening_attached_WIP + opening_attached_FG + opening_reusable + purchases + supplier_included_receipts + external_returns_received + X_in = closing_empty + closing_attached_WIP + closing_attached_FG + closing_reusable + gross_outbound + external_return_out + waste + X_out. X_in/X_out are separately measured actual repair-component or water/material transfers that have NOT already been counted in another incoming/outgoing flow term. Water or material retained in closing stocks stays in the complete closing physical mass AND its actual incoming term; being in stock never cancels that real inflow. Same logic for actual removals. Name every real new/removed component and water phase as its own atomic row before dataset completion, with independent state/mass and no invented repair or exchange. Internal reuse cancels; whole articles and constituent subaccounts are not double purchases. Supplier-included articles have real physical receipt but no second acquisition burden already owned by the supplier. Keep each physical direction unscaled and burden/history attribution separate; no automatic credit or new Q."
      inputs:
        - cp_packaging
        - stock_open_i
        - stock_close_i
        - gross_i
      output: "packaging_closure_i"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_fg
      applies_to: "services"
      rule: "For each original cohort, opening physical FG + actual first-release internal physical receipt + actual external returned material + every actual added material/water/species = closing physical FG + gross physical dispatch + actual standalone external return + service waste + each actual removed material/water/species/loss. The first-release physical receipt is independently measured at its actual state and linked to dry bare-glass Q; moisture/contamination/retained contents do not become dry Q. Repair-held units are a named FG custody substate OR disjoint repair-WIP opening/closing once. Record original release and original dispatch reversal independently from current returned wet/state mass. Permit only actual manufacturer/specification-authorized compatible work within this unworked-blank boundary, with defined post-work tests and actual acceptance/disposition; broken/failed blanks are reject/waste unless independently eligible. Every actual new/removed component and water phase has an atomic row before completion; no assumed restoration or equal input/return mass. Cancel internal transfer at the combined gate, preserving original manufacture once and all observed incremental services without adding new Q."
      inputs:
        - cp_service
        - cp_release
        - Q
        - gross_i
      output: "fg_closure_i"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "all processes"
      requirement: "Actual site scope must demonstrate complete raw-to-unworked-pressing route and first-release terminal with drawing and acceptance records. Do not convert qualitative synthesis into a claimed current factory or guaranteed optical performance."
      evidence: "Drawing; recipe; process logs; first-release QC"
    - id: dq_history
      applies_to: "all inventory rows"
      requirement: "Retain complete campaign/period modes, calibrated raw records and each inherited stock vector; no missing past burden, failed trial or zero-output load is silently cut off. Report uncertainty, detection limits and unobserved service periods."
      evidence: "Calibration; mode logs; historical ledgers; uncertainty"
    - id: dq_native
      applies_to: "all inventory rows"
      requirement: "Disclose exact native restrictions in the consuming rule context, real supplier/grade/location/medium compatibility and every unbound atomic identity. A normal auxiliary or future factory quantity gap is distinct from missing core product or method evidence."
      evidence: "Native records; supplier assay; state and property evidence"
    - id: dq_physical
      applies_to: "all processes"
      requirement: "Use independently observed whole-mass, element, molecular-species and water/phase data; match manufacturing, FG/service and combined gates, packaging and asset/fluid balances. Diagnostic residuals are tests, not invented species measurements."
      evidence: "Mass/element balance; molecular/phase analysis; packaging and asset ledger"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "These checks concern only uncoated nonphotochromic single-vision optically unworked silicate ophthalmic pressings, complete whole-batch electric melting/fining/conditioning, gob shearing, hydraulic pressing/cooling, electric annealing, first quality release and observed original-cohort services. Watch covers, spheres, fused segments, photochromic activation and optically finished lenses are excluded. This is never whole37194 coverage; engineering checks do not replace scientific, translation or mapping decisions."
    source_ids: []
  - rule_id: validate_terminal
    applies_to: "reference product"
    rule: "Verify drawing, silicate family, nonphotochromic single-vision state, unworked surfaces, pressing/annealing route and real quality gate; finished lenses, glass spheres/watch covers and generic optics are not substitute endpoints. Missing primary core route/terminal or unresolved true core native identity keeps the draft unusable regardless of engineering checks."
    source_ids:
      - corning-ophthalmic-spec-f-2013
      - corning-ophthalmic-manufacturing
  - rule_id: validate_quantities
    applies_to: "all inventory rows"
    rule: "Verify consistent first-release Q and units in both languages, exactly one calc_reference A_i/Q and complete raw conversion/history attribution. All failures, zero output, start-stop, idle, cleanup, rework and stock vectors must remain. Unsupported/unknown relationships are unresolved, not pass; report Q0 without unit inventory."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "For adopted UUIDs inspect every native basename, synonyms/comments, CAS, route/form/grade, geography/medium/type and all properties, including the exact reference-property/unit-group chain. Use official Chinese basename. Provider selection still needs actual fit; no support record or classifier alone proves applicability. Leave concrete unbound atoms explicit and do not replace them with a collection label."
    source_ids:
      - jrc-glass-bref-2013
  - rule_id: validate_closure
    applies_to: "all processes"
    rule: "Require independent whole-mass/element and actual molecular/phase/water evidence at consistent manufacturing, FG and combined gates. Reconcile each packaging/asset/fluid stock and all gross directions independently of economic shares. Quantified diagnostic totals cannot create unmeasured species; unknown outlet/state or missing inherited history blocks a concrete usable inventory."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-attributional-2010
  - rule_id: validate_evidence
    applies_to: "all processes"
    rule: "Disclose the complete manufacturer page as publisher-origin web-tool-rendered text, not locally acquired publisher HTML/PDF. Read its raw-batch, forming, standard-annealing, photochromic countercontext and packing sections together with the complete 2013 Corning specification and Glass BREF. They support a bounded qualitative synthesis, not one contemporary all-electric plant order, recipe or numerical default. Failed local acquisition alone is not a core-content gap. Scientific judgement, aligned translation review, mapping acceptance and publication remain separate decisions."
    source_ids:
      - corning-ophthalmic-spec-f-2013
      - corning-ophthalmic-manufacturing
      - jrc-glass-bref-2013
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Blank purchasing for subsequent single-vision mineral spectacle-lens manufacture"
  allowed_use: "Attributional inventory after actual site/route/state/species/history closure and independent methodological judgement"
  excluded_use: "Unresolved draft as usable guidance; finished lenses or whole-class coverage; default recipe/performance/life; automatic recycling credits"
  required_metadata: "single-vision blank drawing and dimensional configuration; silicate formulation and each whole supplied raw material; nonphotochromic and optically unworked surface state; electric melting/fining/conditioning and electric annealing route; press/shear/mould and actual lubrication state; material quality and residual-stress acceptance method; unique first-release cohort and net dry bare-glass kg Q; measured item-mass conversion configuration if count is used; opening/closing raw WIP FG and installed-fluid vectors; source-specific native identity restrictions and provider boundary; actual water phase/species evidence and physical closure; packaging construction and full stock/return routes; original-cohort services and explicitly observed horizon"
  required_quality_disclosure: "Source/route applicability limits; native/provider restrictions; unknowns; history vectors; allocation; species/water evidence; observed service horizon; uncertainty"
  update_trigger: "Changed product/surface/recipe, supply form, melt/press/anneal/QC gate, provider/native restrictions, stock/return/service or primary evidence"
data_sources:
  - id: "jrc-glass-bref-2013"
    type: "official_guidance"
    reference: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/GLS_Adopted_03_2012_0.pdf"
    used_for: "2013 Glass BREF: qualitative raw-material, melting, auxiliary and emission completeness; optical special-glass context and counterexamples. No numerical recipe, yield, energy, emissions or asset life is adopted."
  - id: "corning-ophthalmic-spec-f-2013"
    type: "handbook"
    reference: "https://www.corning.com/media/worldwide/csm/documents/Ophthalmic_Products_Specifications_(85_NQ_01).pdf"
    used_for: "Corning 85 NQ 01 edition F October 2013: real standard ophthalmic pressings, acceptance descriptors and distinction from segments, high-index/photochromic products and gobs. Product drawings override the example specification; no tolerances are copied as universal defaults."
  - id: "corning-ophthalmic-manufacturing"
    type: "handbook"
    reference: "https://www.corning.com/cala/en/products/advanced-optics/product-materials/specialty-glass-and-glass-ceramics/ophthalmic-glass/corning-manufacturing-techniques.html"
    used_for: "Complete publisher-origin web-tool-rendered technical page: raw batch, melting/fining/conditioning, gob shearing, pressing, standard annealing versus photochromic activation, and packing support qualitative route synthesis. Local publisher HTML acquisition failed and is not claimed; this source does not establish one current factory, recipe or electricity-only order."
  - id: "jrc-ilcd-attributional-2010"
    type: "official_guidance"
    reference: "https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "2010 detailed guidance sections 7.9.2–7.9.3: attributional subdivision, exchange-specific determining physical causality and residual process-gate market value, only where allocation is justified. No consequential credit or default physical/economic split."
