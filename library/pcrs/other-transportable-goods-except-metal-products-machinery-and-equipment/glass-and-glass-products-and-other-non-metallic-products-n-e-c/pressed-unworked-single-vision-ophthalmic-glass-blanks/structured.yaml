    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_blank"
      record_type: "Raw measured/history record"
      raw_fields: "release id; batch; drawing; glass type; surface state; net dry bare mass; accepted/rejected; stress/material/dimension tests; timestamp; item count; measured M configuration"
      collection_method: "Calibrated net dry bare-blank weighing with traceable first acceptance; every accepted piece enters Q once. When counts are used measure M for that actual configuration/lot or directly weigh the whole accepted lot; no nominal density or generic item weight. Collection and aggregation sum only undivided raw extensive amounts by actual exchange/cohort. Convert, reconcile history and actually attribute first; only calc_reference produces x_i on the same per1kg reference-flow basis. This aggregation field merely references that result and does not divide Q again."
      unit: "kg"
