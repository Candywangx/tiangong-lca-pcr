  - id: "jushi-direct-roving-386t"
    type: "handbook"
    reference: "Jushi USA Direct Roving386T-E6; undated two-page product/packaging/storage sheet; https://www.jushiusa.com/sites/default/files/jushiUSA-386T-E6.pdf"
    used_for: "Adjacent direct-roving terminal example and resin-dependent performance countercontext; separate product example from312 and not an independent publisher. No fibre strength or packaging mass default."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC; ILCD Handbook General guide for LCA Detailed guidance; first edition March2010; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Sections7.9.2–7.9.3: applicable attributional multifunctionality; subdivision and virtual subdivision; exchange-specific determining physical causality; residual same-state common-process-gate market value. No fixed shares or automatic recovery credit."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:947940c94b592f96ee5876b1772de2fa478901158b8c145bd62684c10ca3480a"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7911"
      family: "system_boundary"
      span:
        start:
          offset: 7911
          line: 61
          column: 1
        end:
          offset: 18702
          line: 85
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole supplied minerals and complete purchased aqueous sizing; actual compatible cullet and inherited stock states |\n| starting_condition_role | Actual physical procurement/stock starting condition for raw-to-direct-roving manufacture |\n| product_classification_scope | Narrow direct-roving subset of CPC3.0:37121 |\n| recursive_input_rule | Purchased finished roving is an explicit upstream input for a different converting route; never represent its repacking as new raw-to-roving manufacture. Recovered internal glass retains its own history and acceptance. |\n| upstream_dataset_requirement | Representative supplier-specific mining preparation sizing manufacture fuel electricity water packaging and inbound freight datasets; unknown providers remain explicit. |\n| disclosure | Declare all section3 qualifiers; operation meter interfaces; physical stock/species closures; allocation evidence; observed service boundary and uncertainty. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | manufacturing boundary | Begin with individual mineral and whole supplied sizing inputs, compatible actual cullet and their real supply/inbound histories; include batch handling, air/natural-gas recuperative melting/fining, forehearth gas heating, electrically heated Pt-Rh bushing, cooling, aqueous sizing, single-end direct winding, electric drying, inspection and first quality release. Keep actual failed/zero-output/start-stop/idle/cleanup/rework loads. | jrc-glass-bref-2013 |\n| b_atomic | all real exchanges | Listed conditional cards require real presence or documented absence. Add a separate card/protocol for every actual missing ingredient, fuel, oxygen boost, treatment chemical, packaging component, repair material, pollutant species or destination before claiming complete scope. No other/zero collection hides real manufacture. A whole bought formulation is purchased once; plant formulation instead lists every purchased ingredient and real mixing losses/energy. | jrc-glass-bref-2013 |\n| b_physical | independent physical gates | Reconcile each manufacturing process and consolidated gate by complete gross physical mass and relevant elements before burden allocation. Pair molten/wet roving, internal water, recycled glass and other internal movements, cancel on consolidation and preserve vectors. Maintain opening+receipts+actual chemical formation = closing+external exits+actual chemical consumption for each species; separate free water, actual reaction water, structural water, humidity and phase changes. A single residual cannot determine two unknowns; COD/VOC/NOx/total boron indicators are not chemical identities. | jrc-glass-bref-2013 |\n| b_first_release | first release and WIP | Q_c is the unique newly first-accepted bare dry-sized roving kg for cohort c at actual declared moisture/size state. Includes that cohort first-released material still in closing FG; do not add closing FG again as production. Wet doffs and unaccepted/rework material stay WIP. Carry opening/closing raw, melt, wet/dry WIP with separate physical quantities and each inherited exchange vector; no earlier burden is lost or counted twice. Reinspection or dispatch never creates Q. | jrc-glass-bref-2013; jushi-direct-roving-312 |\n| b_charge | equipment and fluid stocks | Keep each non-WIP bushing, refractory, oil, cooling-fluid or other installed quantity and vintage-specific exchange/service vector separate from product stocks. Use actual remaining/consumed service and real wear, removal, replenishment, leak and repair records. Do not apply a second opening/closing correction to raw records already reporting corrected consumption. | jrc-glass-bref-2013; jrc-ilcd-2010 |\n| b_service | post-release physical and burden gates | Keep actual original-cohort packing, warehouse, handling, dispatch, returns and incremental rework in a separate observed service ledger using original Q_c. Bare FG opening+new first release+actual return receipts = closing+gross physical dispatch+scrap+other specifically identified exits, with real moisture/size changes recorded separately. Retain prior production vectors, original-delivery reversal and incremental rework with the original cohort; retest/returned old goods are not new Q. Unknown return history prevents a complete cohort result. Cancel internal first_roving on manufacturing/service consolidation; no closing-FG or gross-shipment double output. Retain all already performed service of held/stored FG against its original first-release Q_c over the actually observed horizon H; only genuinely unused/unassigned future service or charge may carry. No unobserved future work is estimated. Actual unauthorized, unapproved, failed or rejected work and all its material/part/water/energy/emission/loss/waste/treatment burdens remain recorded on the proper original cohort, including Q=0, idle, start-stop, cleanup and tests. Manufacturer/specification permission and postwork tests govern authorization, continued conformity, acceptance/rejection and final disposition only; they never erase work that occurred or imply restoration. Repair-held FG is one labelled FG substate OR disjoint repair-WIP, not both; rework or retest creates no new Q. | jushi-direct-roving-312; jrc-ilcd-2010 |\n| b_pack | each packaging article | For each material/configuration separately: opening empty+attached-WIP+attached-FG+reusable stocks +first external procurement P +first standalone non-purchase receipts N_ext +non-purchased supplier-attached physical receipts I +true external return receipts ER + X_in = closing mutually exclusive stocks +accompanying gross shipment out +separate external return out +waste out + X_out. Categories are disjoint. Classify each external whole-article receipt once: ER only for the same item or an auditable configuration-matched batch linked to this site's prior outward record; among first receipts, P is actual procurement, including bundled paid packaging without a separate invoice, N_ext is independently supplied non-purchase borrowing/rental/pool receipt, and I is non-purchased supplier-attached receipt only. P, N_ext, I and ER are mutually exclusive; ownership or custody alone does not prove purchase or return. Existing _new cards record P; _supplied cards retain disjoint N_ext and I event records for the same specified article; _return_in cards record ER. An unknown occurrence or history is unresolved, never zero or a presumed return. N_ext is a whole-article inlet, never X. Retain actual owner/custodian, original cohort, item/batch and prior-outward links, and each complete exchange V/A vector with its provider, original native unit, measurement state, phase, gate, period and history. Gross dispatch, separate returns, losses/waste and real transport services remain explicit; empty, attached-WIP, attached-FG and reusable stock states are mutually exclusive. A whole-article provider including component manufacture supplies that manufacturing burden once; do not add the same component manufacture or bundled supplier burden again. Non-purchase receipts and true returns retain actual inherited history and attributable used service rather than inventing a new procurement or deleting real burden; actual incremental transport, handling and repair services are each recorded once against the proper original cohort/Q_c over H, without a default lifetime, share or recycling credit.  Internal reuse cancels; no net-Q subtraction, repurchase or automatic coproduct. Weigh actual wood moisture and real new/removed repair components separately when present; gross physical movements and upstream burden consumption are separate ledgers. Actual independent material/water changes extend this equation by +X_in on the incoming side and +X_out on the outgoing side. Measure each actual added/removed component and free/absorbed/released water independently, including ordinary storage/handling moisture uptake or evaporation without a repair event. X deduplicates ONLY the same real event already represented in OTHER same-side flow terms, never stocks, opposite-side flows or a merely present card. Real new retained influx and full wet closing mass both remain; unknown occurrence/species is unresolved, not zero. Whole wet P/N_ext/I/ER article receipts include integral wood/fasteners/film and water once. Actual on-site additions are disjoint from the receipt or reconciled through an article/component bridge and paired internal handoff; never add assembled tare and its same components twice. For a real single mixed outlet, independently measured per-material W remain nonadditive raw origin subledgers, sum(origin W)=one measured mixed total; use one qualified actual Waste outlet/treatment owner and report total OR disjoint partition, never both. Only physically separated streams are separate exits. Every actually present missing material/water/repair/mixed-outlet flow requires its own named atomic card and proper protocol/identity review under b_atomic before claiming completion; no occurrence is presumed. | jushi-direct-roving-312; jrc-ilcd-2010 |\n| b_utility | utility interfaces | Cooling and spray water, inherited formulation water, actual moisture and genuine reaction water use one consistent control volume. Resolve real condensate or external liquid-water Product returns and actual thermal state/enthalpy under supplier energy/water ownership agreements. Never infer a steam/boiler interface for an electrically heated dryer; genuine alternative heat supply requires its own atomic inputs/returns and renewed route applicability. For physical ledger-only legs, including external_water_return, actual new/removed installed articles/parts/contained fluids, gross atmospheric-carrier throughflows and all FG/package/waste directions, A_j_c is the independently measured full unallocated gross V in that native row unit. Normalize that V once by the same manufacturing Q_c or linked original service Q_c/H; it is not net consumption, burden-stock subtraction, an economic share, old manufacturing burden, an additional purchase or automatic export credit. Retain absolute physical records and each separately owned upstream/performed-service vector independently; where a card represents assigned asset service, label that separate vector and do not charge a whole physical asset again. Actual external water/carrier returns preserve measured mass, phase, temperature, pressure and enthalpy separately from heat MJ under one supplier water/energy owner, even when incoming and returning masses differ. Pair only identical internal transfers; no steam/boiler/circuit or heat alternative is introduced. | jrc-glass-bref-2013 |\n\n"
