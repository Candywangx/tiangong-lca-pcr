system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacturing boundary"
      rule: "Begin with individual mineral and whole supplied sizing inputs, compatible actual cullet and their real supply/inbound histories; include batch handling, air/natural-gas recuperative melting/fining, forehearth gas heating, electrically heated Pt-Rh bushing, cooling, aqueous sizing, single-end direct winding, electric drying, inspection and first quality release. Keep actual failed/zero-output/start-stop/idle/cleanup/rework loads."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: b_atomic
      applies_to: "all real exchanges"
      rule: "Listed conditional cards require real presence or documented absence. Add a separate card/protocol for every actual missing ingredient, fuel, oxygen boost, treatment chemical, packaging component, repair material, pollutant species or destination before claiming complete scope. No other/zero collection hides real manufacture. A whole bought formulation is purchased once; plant formulation instead lists every purchased ingredient and real mixing losses/energy."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: b_physical
      applies_to: "independent physical gates"
      rule: "Reconcile each manufacturing process and consolidated gate by complete gross physical mass and relevant elements before burden allocation. Pair molten/wet roving, internal water, recycled glass and other internal movements, cancel on consolidation and preserve vectors. Maintain opening+receipts+actual chemical formation = closing+external exits+actual chemical consumption for each species; separate free water, actual reaction water, structural water, humidity and phase changes. A single residual cannot determine two unknowns; COD/VOC/NOx/total boron indicators are not chemical identities."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: b_first_release
      applies_to: "first release and WIP"
      rule: "Q_c is the unique newly first-accepted bare dry-sized roving kg for cohort c at actual declared moisture/size state. Includes that cohort first-released material still in closing FG; do not add closing FG again as production. Wet doffs and unaccepted/rework material stay WIP. Carry opening/closing raw, melt, wet/dry WIP with separate physical quantities and each inherited exchange vector; no earlier burden is lost or counted twice. Reinspection or dispatch never creates Q."
      source_ids:
        - jrc-glass-bref-2013
        - jushi-direct-roving-312
    - rule_id: b_charge
      applies_to: "equipment and fluid stocks"
      rule: "Keep each non-WIP bushing, refractory, oil, cooling-fluid or other installed quantity and vintage-specific exchange/service vector separate from product stocks. Use actual remaining/consumed service and real wear, removal, replenishment, leak and repair records. Do not apply a second opening/closing correction to raw records already reporting corrected consumption."
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - rule_id: b_service
      applies_to: "post-release physical and burden gates"
      rule: "Keep actual original-cohort packing, warehouse, handling, dispatch, returns and incremental rework in a separate observed service ledger using original Q_c. Bare FG opening+new first release+actual return receipts = closing+gross physical dispatch+scrap+other specifically identified exits, with real moisture/size changes recorded separately. Retain prior production vectors, original-delivery reversal and incremental rework with the original cohort; retest/returned old goods are not new Q. Unknown return history prevents a complete cohort result. Cancel internal first_roving on manufacturing/service consolidation; no closing-FG or gross-shipment double output. Retain all already performed service of held/stored FG against its original first-release Q_c over the actually observed horizon H; only genuinely unused/unassigned future service or charge may carry. No unobserved future work is estimated. Actual unauthorized, unapproved, failed or rejected work and all its material/part/water/energy/emission/loss/waste/treatment burdens remain recorded on the proper original cohort, including Q=0, idle, start-stop, cleanup and tests. Manufacturer/specification permission and postwork tests govern authorization, continued conformity, acceptance/rejection and final disposition only; they never erase work that occurred or imply restoration. Repair-held FG is one labelled FG substate OR disjoint repair-WIP, not both; rework or retest creates no new Q."
      source_ids:
        - jushi-direct-roving-312
        - jrc-ilcd-2010
    - rule_id: b_pack
      applies_to: "each packaging article"
      rule: "For each material/configuration separately: opening empty+attached-WIP+attached-FG+reusable stocks +first external procurement P +first standalone non-purchase receipts N_ext +non-purchased supplier-attached physical receipts I +true external return receipts ER + X_in = closing mutually exclusive stocks +accompanying gross shipment out +separate external return out +waste out + X_out. Categories are disjoint. Classify each external whole-article receipt once: ER only for the same item or an auditable configuration-matched batch linked to this site's prior outward record; among first receipts, P is actual procurement, including bundled paid packaging without a separate invoice, N_ext is independently supplied non-purchase borrowing/rental/pool receipt, and I is non-purchased supplier-attached receipt only. P, N_ext, I and ER are mutually exclusive; ownership or custody alone does not prove purchase or return. Existing _new cards record P; _supplied cards retain disjoint N_ext and I event records for the same specified article; _return_in cards record ER. An unknown occurrence or history is unresolved, never zero or a presumed return. N_ext is a whole-article inlet, never X. Retain actual owner/custodian, original cohort, item/batch and prior-outward links, and each complete exchange V/A vector with its provider, original native unit, measurement state, phase, gate, period and history. Gross dispatch, separate returns, losses/waste and real transport services remain explicit; empty, attached-WIP, attached-FG and reusable stock states are mutually exclusive. A whole-article provider including component manufacture supplies that manufacturing burden once; do not add the same component manufacture or bundled supplier burden again. Non-purchase receipts and true returns retain actual inherited history and attributable used service rather than inventing a new procurement or deleting real burden; actual incremental transport, handling and repair services are each recorded once against the proper original cohort/Q_c over H, without a default lifetime, share or recycling credit.  Internal reuse cancels; no net-Q subtraction, repurchase or automatic coproduct. Weigh actual wood moisture and real new/removed repair components separately when present; gross physical movements and upstream burden consumption are separate ledgers. Actual independent material/water changes extend this equation by +X_in on the incoming side and +X_out on the outgoing side. Measure each actual added/removed component and free/absorbed/released water independently, including ordinary storage/handling moisture uptake or evaporation without a repair event. X deduplicates ONLY the same real event already represented in OTHER same-side flow terms, never stocks, opposite-side flows or a merely present card. Real new retained influx and full wet closing mass both remain; unknown occurrence/species is unresolved, not zero. Whole wet P/N_ext/I/ER article receipts include integral wood/fasteners/film and water once. Actual on-site additions are disjoint from the receipt or reconciled through an article/component bridge and paired internal handoff; never add assembled tare and its same components twice. For a real single mixed outlet, independently measured per-material W remain nonadditive raw origin subledgers, sum(origin W)=one measured mixed total; use one qualified actual Waste outlet/treatment owner and report total OR disjoint partition, never both. Only physically separated streams are separate exits. Every actually present missing material/water/repair/mixed-outlet flow requires its own named atomic card and proper protocol/identity review under b_atomic before claiming completion; no occurrence is presumed."
      source_ids:
        - jushi-direct-roving-312
        - jrc-ilcd-2010
    - rule_id: b_utility
      applies_to: "utility interfaces"
      rule: "Cooling and spray water, inherited formulation water, actual moisture and genuine reaction water use one consistent control volume. Resolve real condensate or external liquid-water Product returns and actual thermal state/enthalpy under supplier energy/water ownership agreements. Never infer a steam/boiler interface for an electrically heated dryer; genuine alternative heat supply requires its own atomic inputs/returns and renewed route applicability. For physical ledger-only legs, including external_water_return, actual new/removed installed articles/parts/contained fluids, gross atmospheric-carrier throughflows and all FG/package/waste directions, A_j_c is the independently measured full unallocated gross V in that native row unit. Normalize that V once by the same manufacturing Q_c or linked original service Q_c/H; it is not net consumption, burden-stock subtraction, an economic share, old manufacturing burden, an additional purchase or automatic export credit. Retain absolute physical records and each separately owned upstream/performed-service vector independently; where a card represents assigned asset service, label that separate vector and do not charge a whole physical asset again. Actual external water/carrier returns preserve measured mass, phase, temperature, pressure and enthalpy separately from heat MJ under one supplier water/energy owner, even when incoming and returning masses differ. Pair only identical internal transfers; no steam/boiler/circuit or heat alternative is introduced."
      source_ids:
        - jrc-glass-bref-2013
