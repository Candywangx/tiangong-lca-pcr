    reference: "European Commission JRC; Best Available Techniques Reference Document for the Manufacture of Glass;2013 EUR25786 EN; doi10.2791/69502; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/GLS_Adopted_03_2012_0.pdf"
    used_for: "Sections2.2–2.3 and2.6;3.5.1–3.5.4 including Tables2.6–2.7 and3.25–3.28 and Figure3.6: raw batch to continuous fibre routes; direct/conventional distinctions; water and waste context. No sector values adopted as defaults; no allocation prescription."
  - id: "jushi-direct-roving-312"
    type: "handbook"
    reference: "Jushi USA Direct Roving312-E6; undated two-page product/packaging/storage sheet; https://www.jushiusa.com/sites/default/files/jushiUSA-312-E6.pdf"
