allocation_rules:
  - rule_id: a_subdivision
    applies_to: "applicable attributional multifunctionality"
    rule: "For a study where allocation is required and appropriate, first avoid it by independently metered dedicated operations and feasible physical or virtual subdivision. Separate raw/glass embodiment, bushing service, drying and warehouse cohort services. Assess study goal and applicable multifunctionality approach; this attributional package claims no consequential substitution or automatic recovery credits."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "each remaining exchange"
    rule: "For each still-shared exchange determine the physical relationship that actually determines changes in that exchange with each output/function. Document evidence and exclusions individually: throughput alone need not determine drying moisture load, furnace holding or bushing service. A universal mass key or arbitrary physical/economic choice is prohibited; quantity closure is independent of burden shares."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "genuine unresolved common-process remainder"
    rule: "Only the genuine residual after subdivision and exchange-specific determining physical causality uses contemporaneous real market value at the same common-process gate and actual state. Remove downstream conditioning/packing/transport value where needed to derive that gate value. Document actual traded quantities and price period, sensitivity and uncertainty; absent price/history is unresolved. No fixed shares, list-price substitution, discarded-waste value invention or blanket credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_recycle
    applies_to: "rework cullet and recoveries"
    rule: "Keep actual internal cullet, fibre remelt, size residues, reusable packaging and precious-metal returns physically traced. Internal transfers are paired/cancelled; include real additional treatment and losses. Outgoing waste remains waste with actual treatment ownership unless a real separate function/product is evidenced and the applicable allocation/recycling method is justified. No avoided virgin glass, fuel or metal credit follows merely from sale or collection."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "dry_release"
      flow_role: "first quality release"
      record_type: "calibrated net weighing and acceptance"
      raw_fields: "cohort; doff identity; composition; filament diameter; linear density and unit method; size lot and solids; residual moisture; tare; accepted bare net mass; unique first-release timestamp; failed and retested flags; opening closing WIP/FG; quality tests"
      collection_method: "Weigh accepted doffs on calibrated scales and subtract measured removable tare; cross-check test methods and unique first release. Q_c is sum of newly first-accepted bare mass; no second acceptance from retest or dispatch."
      unit: "kg"
      frequency: "every doff and first acceptance"
      temporal_coverage: "whole actual campaign including failure and zero output"
      site_scope: "same declared glass formulation doff configuration and site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance/retest ledger; raw tare; moisture/size tests"
    - protocol_id: cp_material
      process_id: "all"
      flow_role: "whole supplied material and internal glass"
      record_type: "purchase receipt withdrawal and analysis"
      raw_fields: "cohort; one physical material; supplier lot; supplied mass and state; assay; carrier water; route/grade; receipts withdrawals returns; opening closing raw/melt/wet/dryWIP; internal transfer partner; per-exchange inherited vector"
      collection_method: "Weigh each supplied material/transfer independently; preserve whole-product procurement separately from consumption and constituent subledgers. Reconcile disjoint stocks and transfer pairs; select actual recipe not sector averages."
      unit: "kg"
      frequency: "each receipt batch withdrawal transfer and stock closure"
      temporal_coverage: "whole campaign plus inherited stock history"
      site_scope: "actual supplier and all raw-to-roving material gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; assays; recipe; stock and transfer history"
    - protocol_id: cp_energy
      process_id: "all"
      flow_role: "one actual electricity or fuel supply"
      record_type: "meter and operational records"
      raw_fields: "cohort; supply interface; voltage country mix; original meter unit; readings; timestamps; true rate vs integrated quantity; gas assay; independently measured density temperature pressure humidity; LHV; transformer ownership; standby startup cleanup rework; service driver"
      collection_method: "Read meters before any normalization; convert kWh to MJ by3.6 or actual fuel mass/state with independently evidenced density and heating value. Record shared service drivers and assign real loads before the single normalization."
      unit: "MJ; kg; kWh; measured gas volume"
      frequency: "meter interval and abnormal event"
      temporal_coverage: "same actual campaign and separately observed original-cohort services"
      site_scope: "actual utility supplier interface and complete operation meters"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; meter hierarchy; PVT/assay; allocation evidence; operating logs"
    - protocol_id: cp_water
      process_id: "all"
      flow_role: "water supply evaporation and actual external returns"
      record_type: "water meters stock and state measurements"
      raw_fields: "cohort; water identity; supply source quality; whole formulation water separately; original mass/volume; independently measured density; opening closing circuit charge; humidity; spray; evaporation; drift; purge; external return; temperature pressure enthalpy; supplier energy ownership; inherited exchange vector"
      collection_method: "Meter fresh water and each real exit with matching control volume. Pair internal circulation; distinguish evaporation humidity reaction water and liquid drift. Independently measure each substance/state density; respect utility water/energy ownership. For physical ledger-only legs, including external_water_return, actual new/removed installed articles/parts/contained fluids, gross atmospheric-carrier throughflows and all FG/package/waste directions, A_j_c is the independently measured full unallocated gross V in that native row unit. Normalize that V once by the same manufacturing Q_c or linked original service Q_c/H; it is not net consumption, burden-stock subtraction, an economic share, old manufacturing burden, an additional purchase or automatic export credit. Retain absolute physical records and each separately owned upstream/performed-service vector independently; where a card represents assigned asset service, label that separate vector and do not charge a whole physical asset again. Actual external water/carrier returns preserve measured mass, phase, temperature, pressure and enthalpy separately from heat MJ under one supplier water/energy owner, even when incoming and returning masses differ. Pair only identical internal transfers; no steam/boiler/circuit or heat alternative is introduced."
      unit: "kg; m3; measured thermal state"
      frequency: "each meter interval makeup drain return and closure"
      temporal_coverage: "whole manufacturing and real service period"
      site_scope: "all actual water and cooling interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; assays; independent density; humidity; enthalpy and supplier agreements"
    - protocol_id: cp_species
      process_id: "all"
      flow_role: "one real species and one destination"
      record_type: "speciation monitoring and independent balances"
      raw_fields: "cohort; source operation; species CAS and phase; final compartment; wet/dry and oxygen basis; integrated volume or actual rate/time; temperature pressure humidity; density; concentration; inlet carriers; formation consumption; retained product; capture and bypass; COD VOC NOx total B indicators separately; uncertainty"
      collection_method: "Use species-appropriate sampling and actual conversion chemistry with independent mass/element evidence. Integrate true rates only; an integrated liquid/gas volume is not multiplied by time. Preserve gross air/water/chemical ledgers before allocation. One residual cannot solve two unknowns; unmeasured species remains unresolved."
      unit: "kg; actual concentration and gas/liquid-state units"
      frequency: "monitoring interval and every release/bypass event"
      temporal_coverage: "full campaign including failed batches zero-output and cleanup"
      site_scope: "all actual inlet vent solid capture and water outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory methods; raw gas records; independent element assays; uncertainty"
    - protocol_id: cp_waste
      process_id: "all"
      flow_role: "each actual waste stream or internal recovery"
      record_type: "weighing analysis transfer destination"
      raw_fields: "cohort; origin; single stream identity; moisture; chemical constituents; gross mass; internal partner or external destination; treatment owner; stocks; retained burden vector"
      collection_method: "Weigh each real stream and retain wet mass and constituent subaccounts; pair internal movement and document verified recovery compatibility. Keep distinct streams/destinations separate and actual treatment ownership. Actual independent material/water changes extend this equation by +X_in on the incoming side and +X_out on the outgoing side. Measure each actual added/removed component and free/absorbed/released water independently, including ordinary storage/handling moisture uptake or evaporation without a repair event. X deduplicates ONLY the same real event already represented in OTHER same-side flow terms, never stocks, opposite-side flows or a merely present card. Real new retained influx and full wet closing mass both remain; unknown occurrence/species is unresolved, not zero. Whole wet P/N_ext/I/ER article receipts include integral wood/fasteners/film and water once. Actual on-site additions are disjoint from the receipt or reconciled through an article/component bridge and paired internal handoff; never add assembled tare and its same components twice. For a real single mixed outlet, independently measured per-material W remain nonadditive raw origin subledgers, sum(origin W)=one measured mixed total; use one qualified actual Waste outlet/treatment owner and report total OR disjoint partition, never both. Only physically separated streams are separate exits. Every actually present missing material/water/repair/mixed-outlet flow requires its own named atomic card and proper protocol/identity review under b_atomic before claiming completion; no occurrence is presumed."
      unit: "kg"
      frequency: "each generation transfer and closure"
      temporal_coverage: "all normal and abnormal manufacturing operations"
      site_scope: "all actual solid liquid and internal waste gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; lab methods; handover; treatment and stock evidence"
    - protocol_id: cp_charge
      process_id: "all"
      flow_role: "one non-WIP installed article or fluid"
      record_type: "installation service maintenance and removal"
      raw_fields: "article/fluid identity; alloy/grade; received cold spare; opening closing installed quantity; installation vintage; measured service; remaining service; topup wear dissolution leakage; removed recovered mass; each historical exchange vector"
      collection_method: "Measure installed quantities separately from WIP; preserve vintage-specific inherited vectors and actual remaining/consumed service. Keep all physical new/removed material even if burden allocation differs; avoid duplicate correction of raw net consumption. For physical ledger-only legs, including external_water_return, actual new/removed installed articles/parts/contained fluids, gross atmospheric-carrier throughflows and all FG/package/waste directions, A_j_c is the independently measured full unallocated gross V in that native row unit. Normalize that V once by the same manufacturing Q_c or linked original service Q_c/H; it is not net consumption, burden-stock subtraction, an economic share, old manufacturing burden, an additional purchase or automatic export credit. Retain absolute physical records and each separately owned upstream/performed-service vector independently; where a card represents assigned asset service, label that separate vector and do not charge a whole physical asset again. Actual external water/carrier returns preserve measured mass, phase, temperature, pressure and enthalpy separately from heat MJ under one supplier water/energy owner, even when incoming and returning masses differ. Pair only identical internal transfers; no steam/boiler/circuit or heat alternative is introduced."
      unit: "kg; actual service unit"
      frequency: "each receipt installation repair removal and stock closure"
      temporal_coverage: "whole actual service history assigned to cohort"
      site_scope: "all actual non-WIP equipment/circuit/fluid stocks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; maintenance; service history; physical and vector reconciliation"
    - protocol_id: cp_service
      process_id: "services"
      flow_role: "released FG dispatch returns and incremental rework"
      record_type: "cohort-linked physical movements and service logs"
      raw_fields: "original cohort and Q; release id; opening closing FG; gross shipment; return receipt; original delivery reversal; actual moisture/size change; prior production vector; incremental rework; damage scrap; observed service interval"
      collection_method: "Reconcile gross FG physically independently of Q; all original production history and dispatch reversals remain with the original cohort. Preserve actual extra rework and services; do not create output from shipment or retesting. Retain all already performed service of held/stored FG against its original first-release Q_c over the actually observed horizon H; only genuinely unused/unassigned future service or charge may carry. No unobserved future work is estimated. Actual unauthorized, unapproved, failed or rejected work and all its material/part/water/energy/emission/loss/waste/treatment burdens remain recorded on the proper original cohort, including Q=0, idle, start-stop, cleanup and tests. Manufacturer/specification permission and postwork tests govern authorization, continued conformity, acceptance/rejection and final disposition only; they never erase work that occurred or imply restoration. Repair-held FG is one labelled FG substate OR disjoint repair-WIP, not both; rework or retest creates no new Q."
      unit: "kg; actual service unit"
      frequency: "every service movement and closure"
      temporal_coverage: "declared observed interval by original release cohort"
      site_scope: "warehouse packing dispatch and return gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "unique release shipment return ids; history vectors; rework records"
    - protocol_id: cp_pack
      process_id: "services"
      flow_role: "each whole packaging article each direction"
      record_type: "purchase tare movement return repair and stock"
      raw_fields: "one material/configuration; new purchases; supplier-included receipt; external returns received; opening closing empty attachedWIP attachedFG reusable stocks; gross accompanying dispatch; separate return out; waste; tare count; real wood moisture; new/removed repair components; original burden/service vector; X_in/X_out; each actual added/removed component/water phase and ordinary humidity event; OTHER same-side overlap evidence; full wet stocks; whole wet article/component bridge; independently measured origin W and one mixed total; total-or-partition flag; unique treatment owner; P/N_ext/I/ER event class; bundled-paid evidence; actual owner/custodian; item or auditable batch configuration; prior-outward link; original cohort Q_c and H; each exchange V/A; provider; original native unit; measurement state and phase; gate; period; full history; whole-provider component-manufacture scope; actual incremental transport handling repair service owner"
      collection_method: "Classify each external whole-article receipt once: ER only for the same item or an auditable configuration-matched batch linked to this site's prior outward record; among first receipts, P is actual procurement, including bundled paid packaging without a separate invoice, N_ext is independently supplied non-purchase borrowing/rental/pool receipt, and I is non-purchased supplier-attached receipt only. P, N_ext, I and ER are mutually exclusive; ownership or custody alone does not prove purchase or return. Existing _new cards record P; _supplied cards retain disjoint N_ext and I event records for the same specified article; _return_in cards record ER. An unknown occurrence or history is unresolved, never zero or a presumed return. N_ext is a whole-article inlet, never X. Retain actual owner/custodian, original cohort, item/batch and prior-outward links, and each complete exchange V/A vector with its provider, original native unit, measurement state, phase, gate, period and history. Gross dispatch, separate returns, losses/waste and real transport services remain explicit; empty, attached-WIP, attached-FG and reusable stock states are mutually exclusive. A whole-article provider including component manufacture supplies that manufacturing burden once; do not add the same component manufacture or bundled supplier burden again. Non-purchase receipts and true returns retain actual inherited history and attributable used service rather than inventing a new procurement or deleting real burden; actual incremental transport, handling and repair services are each recorded once against the proper original cohort/Q_c over H, without a default lifetime, share or recycling credit. Weigh one complete article per configuration; convert count only with measured actual configuration tare. Reconcile b_pack separately by material and destination; internal reuse cancels. Physical gross movement is retained independently of burden consumption and upstream history. Actual independent material/water changes extend this equation by +X_in on the incoming side and +X_out on the outgoing side. Measure each actual added/removed component and free/absorbed/released water independently, including ordinary storage/handling moisture uptake or evaporation without a repair event. X deduplicates ONLY the same real event already represented in OTHER same-side flow terms, never stocks, opposite-side flows or a merely present card. Real new retained influx and full wet closing mass both remain; unknown occurrence/species is unresolved, not zero. Whole wet P/N_ext/I/ER article receipts include integral wood/fasteners/film and water once. Actual on-site additions are disjoint from the receipt or reconciled through an article/component bridge and paired internal handoff; never add assembled tare and its same components twice. For a real single mixed outlet, independently measured per-material W remain nonadditive raw origin subledgers, sum(origin W)=one measured mixed total; use one qualified actual Waste outlet/treatment owner and report total OR disjoint partition, never both. Only physically separated streams are separate exits. Every actually present missing material/water/repair/mixed-outlet flow requires its own named atomic card and proper protocol/identity review under b_atomic before claiming completion; no occurrence is presumed."
      unit: "kg; count"
      frequency: "every receipt use gross dispatch return repair and stocktake"
      temporal_coverage: "same observed original-cohort service interval"
      site_scope: "all disjoint empty attached and reusable packaging states"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare calibration; purchase and included-supply records; return repair waste and moisture evidence"
    - protocol_id: cp_transport
      process_id: "melt"
      flow_role: "one real inbound freight leg"
      record_type: "consignment payload distance and route"
      raw_fields: "material lot; mode; vehicle/fuel; actual payload; loaded distance; empty return; origin destination; period; provider boundary"
      collection_method: "Use actual consignment activity; state whether purchased service includes fuel and empty return. Own-operated legs require separate real fuel/emission records without duplication."
      unit: "t*km"
      frequency: "each consignment"
      temporal_coverage: "same receipts and campaign"
      site_scope: "actual inbound road leg only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "consignment notes; distance route and provider scope"
  calculation_rules:
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q_c>0, result_j_c=A_j_c/Q_c exactly once. First convert original raw numerator units and actual states or integrate genuine rates; then form A_j_c through evidenced subdivision and exchange-specific allocation, carrying opening minus closing vectors for disjoint raw/WIP/non-WIP installed stocks, without correcting already net-consumption records twice. Manufacturing-material A is attributable whole-supply withdrawal/consumption with its inherited upstream vector; raw purchase receipts remain recorded without consuming all unused procurement into Q. Internal transfers, waste and packaging P/N_ext/I/ER/gross-dispatch/external-return movement cards use actual physical movement as A; burden consumption separately follows actual cohort and remaining service, so returned articles do not repurchase original upstream production. Post-release service A contains only actual incremental original-cohort service and its own opening/closing service/charge vectors; do not add original manufacturing burden again. Q is original first-release kg. Cards and aggregation read this one stored result. At Q_c=0 retain every real load and issue no unit result. For physical ledger-only legs, including external_water_return, actual new/removed installed articles/parts/contained fluids, gross atmospheric-carrier throughflows and all FG/package/waste directions, A_j_c is the independently measured full unallocated gross V in that native row unit. Normalize that V once by the same manufacturing Q_c or linked original service Q_c/H; it is not net consumption, burden-stock subtraction, an economic share, old manufacturing burden, an additional purchase or automatic export credit. Retain absolute physical records and each separately owned upstream/performed-service vector independently; where a card represents assigned asset service, label that separate vector and do not charge a whole physical asset again. Actual external water/carrier returns preserve measured mass, phase, temperature, pressure and enthalpy separately from heat MJ under one supplier water/energy owner, even when incoming and returning masses differ. Pair only identical internal transfers; no steam/boiler/circuit or heat alternative is introduced. Retain all already performed service of held/stored FG against its original first-release Q_c over the actually observed horizon H; only genuinely unused/unassigned future service or charge may carry. No unobserved future work is estimated. Actual unauthorized, unapproved, failed or rejected work and all its material/part/water/energy/emission/loss/waste/treatment burdens remain recorded on the proper original cohort, including Q=0, idle, start-stop, cleanup and tests. Manufacturer/specification permission and postwork tests govern authorization, continued conformity, acceptance/rejection and final disposition only; they never erase work that occurred or imply restoration. Repair-held FG is one labelled FG substate OR disjoint repair-WIP, not both; rework or retest creates no new Q. Classify each external whole-article receipt once: ER only for the same item or an auditable configuration-matched batch linked to this site's prior outward record; among first receipts, P is actual procurement, including bundled paid packaging without a separate invoice, N_ext is independently supplied non-purchase borrowing/rental/pool receipt, and I is non-purchased supplier-attached receipt only. P, N_ext, I and ER are mutually exclusive; ownership or custody alone does not prove purchase or return. Existing _new cards record P; _supplied cards retain disjoint N_ext and I event records for the same specified article; _return_in cards record ER. An unknown occurrence or history is unresolved, never zero or a presumed return. N_ext is a whole-article inlet, never X. Retain actual owner/custodian, original cohort, item/batch and prior-outward links, and each complete exchange V/A vector with its provider, original native unit, measurement state, phase, gate, period and history. Gross dispatch, separate returns, losses/waste and real transport services remain explicit; empty, attached-WIP, attached-FG and reusable stock states are mutually exclusive. A whole-article provider including component manufacture supplies that manufacturing burden once; do not add the same component manufacture or bundled supplier burden again. Non-purchase receipts and true returns retain actual inherited history and attributable used service rather than inventing a new procurement or deleting real burden; actual incremental transport, handling and repair services are each recorded once against the proper original cohort/Q_c over H, without a default lifetime, share or recycling credit."
      inputs:
        - A_j_c
        - Q_c
        - original_cohort
        - measurement_state
        - vector_history
      output: "result_j_c"
      source_ids:
        - jrc-glass-bref-2013
        - jushi-direct-roving-312
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Native physical chemistry/route/form/grade/geography/media/type and every property must match actual use; preserve restrictions and uncertainty."
      evidence: "complete native identity and supplier applicability; full context"
    - id: dq_vectors
      applies_to: "all stocks and cohorts"
      requirement: "Retain physical quantities and every inherited exchange vector by original unit/vintage/cohort; no old FG or installed-charge burden shifted to new production."
      evidence: "raw stock/maintenance/release history"
    - id: dq_context
      applies_to: "all measurements"
      requirement: "Retain calibration, representative coverage, failure/idle/startup/rework and Q=0; do not borrow historical sector numbers or resin-dependent performance."
      evidence: "raw records; chemistry; uncertainty; complete primary context"
    - id: dq_coverage
      applies_to: "whole package"
      requirement: "List each omitted/unmeasured exchange and reason; missing core identity/history/chemistry prevents a complete result, while unresolved auxiliary UUID/provider requires actual selection and evidence before use."
      evidence: "explicit completeness statement with unresolved scope"
validation_rules:
  - rule_id: v_identity
    applies_to: "applicability"
    rule: "Confirm direct melt and one directly wound untwisted dry-sized E-glass doff specification; prove each native UUID restriction and provider match. Missing or conflicting product identity is unresolved, never cured by CPC label."
    source_ids:
      - jushi-direct-roving-312
      - jrc-glass-bref-2013
  - rule_id: v_basis
    applies_to: "all numerator and reference records"
    rule: "Q is first quality release; raw collection is undivided. Convert units/state and allocate first, then normalize_once exactly once. All cards/aggregation read that stored result. Preserve every real Q=0 load and issue no unit result."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: v_closure
    applies_to: "each process and combined gate"
    rule: "Check gross mass, relevant elements, species, moisture and stocks independently of allocation; internal transfer pairs cancel. Unknown air/water/species, two-unknown residual fits, unmeasured density or lost historical vectors prevent completeness."
    source_ids:
      - jrc-glass-bref-2013
  - rule_id: v_pack
    applies_to: "FG and packaging"
    rule: "Check b_service and b_pack at each material/configuration and original cohort, including all gross external directions and mutually exclusive stocks. Do not count closing FG twice or treat returned goods/retest as new production."
    source_ids:
      - jushi-direct-roving-312
      - jrc-ilcd-2010
  - rule_id: v_evidence
    applies_to: "all reported quantities"
    rule: "Retain original records, complete applicable primary context, exact chemistry, native identity restrictions and uncertainty. A source maximum, resin-dependent mechanical result or tool success is no factory observation or approval. Missing supplier/auxiliary data requires collection; real core holds remain explicit."
    source_ids:
      - jrc-glass-bref-2013
      - jushi-direct-roving-312
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified raw-to-direct-roving manufacturing inventory for declared compatible receiving processes"
  allowed_use: "One declared chemistry direct-roving form supply state and observed service boundary after real applicability and evidence checks"
  excluded_use: "Exclude slivers, assembled multi-cake roving, twisted yarn, chopped strands, milled fibres, glass wool, optical fibre, woven glass fabric, mat/web/board, matrix-impregnated composite, non-E-glass chemistry, marble remelting, all-electric melting, oxygen-boost/oxy-fuel melting and gas/steam drying. A changed route requires renewed applicability rather than omission of actual exchanges."
  required_metadata: "E-glass chemical composition and boron/fluorine state; actual individual mineral recipe and cullet compatibility; direct-melt air/gas recuperative route and boost state; single-end directly wound untwisted form; filament diameter and linear density method/unit; whole supplied sizing identity and formulation lot; resin compatibility and finish state; drying time-temperature and actual residual moisture; product acceptance methods and tolerances; bare product mass excluding removable packaging; first-release cohort and unique Q record; opening and closing raw/WIP/FG and installed-charge history; plant geography and period; actual utility voltage supply mix water quality and agreements; actual packaging configuration and all gross movements; observed original-cohort service interval and return/rework history"
  required_quality_disclosure: "First-release denominator; supplier/native restrictions; gross physical and inherited-vector closure; failures; species/chemistry; allocation; ordinary gaps; unresolved scope"
  update_trigger: "Changed glass chemistry; recipe; bushing/direct form; sizing; drying heat route; utility supply; packaging; cohort gate; primary evidence or native identity"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 Structure 30June2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Classification context37121 versus26890 and37129 only; does not approve a mapping or supply manufacturing rules."
  - id: "jrc-glass-bref-2013"
