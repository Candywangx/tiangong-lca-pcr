  binding_restrictions:
    wall-panel: "Only a whole factory-prefabricated steel-reinforced concrete wall panel for building structural/enclosure use; production mix at plant; prefabrication. Scope narrows this family to non-prestressed solid structural panels without insulation or installed-system work. No beam, bare concrete mix, unreinforced block, prestressed product or on-site installation is represented. No fixed grade, dimensions, geography, service life or performance certification is supplied by this identity."
    cement: "Conditional packaged finished Portland cement of strength class52.5R; native comment describes calcination of limestone/clay and packaged construction supply. Not clinker, a blended cement, arbitrary strength class or bulk supply by default. Supplier packaging ingress is weighed separately with one upstream burden owner; never add its burden if already included. TypeIII/52.5 synonyms do not establish cross-standard equivalence. Re-resolve if actual cement or supply form differs."
    sand: "Conditional wet-produced washed coarse/medium product sand at plant; native supply location CN-HN-CSX. Despite a broader gravel classification this is the singular product-sand fraction, not mixed sand-and-gravel or all minerals. Actual source/route, gradation and moisture must match; no general geographic provider proxy."
    gravel: "Conditional wet-process secondary cone-crushed gravel at plant, supply CN-HN-CSX. Not natural uncrushed gravel or every coarse aggregate. Verify actual route/location, size and moisture; grade and density are not supplied."
    rebar: "Only hot-rolled low-alloy steel rebar with C<=0.2%, production mix at plant and rolling route. Not prestressing strand, cold-drawn mesh, all structural steel or automatic weldability. Match mill certificate and approved reinforcement design; no bar size, ratio or strength is prescribed."
    water: "Treated industrial process-water Product flow; supply/treatment/quality/provider unspecified. It is not an elementary withdrawal or discharge, pure reagent or default tap-water provider. Confirm mixing suitability separately; allocate each liquid water use, return and stock without duplicate recirculation or embedded formulation water."
    electricity: "Only CN user-side grid-average consumption mix alternating current at1–35kV. Native reference property is Net calorific value with energy MJ, not Mass; convert measured kWh to MJ by3.6 exactly once. Not voltage-transformation service, specific generator, low-voltage or arbitrary-country supply. Native compliance statements are source claims, not approval of this dataset."
    diesel: "Mass-based diesel Product identity only; fuel grade, blend/formulation, density, heating value, refinery route, geographic supply and provider unspecified. Measure actual fuel and independent state-specific conversion if needed; no kg-to-MJ or density default. Combustion is collected separately and never charged again through an already complete provider."
    film: "Only polyethylene film, CAS9002-88-4, production mix at plant; not PET or a packaging bundle. Native luggage classification is inconsistent with the explicit PE-film identity; its PET discussion is a comparison, not PE/PET equivalence. Match actual resin/film grade and provider; no thickness, recycled content or density default."
    co2: "Only measured neutral fossil CO2, CAS124-38-9, emission to unspecified air. Native isotope/ion/dry-ice aliases do not establish those physical forms here. Not aggregate exhaust, carbonation uptake, biogenic carbon, geological carbonate decomposition or a carbon-total conversion. Determine fossil attribution independently."
    co: "Only species-resolved fossil CO, CAS630-08-0, emission to unspecified air. Native exhaust/flue-gas aliases do not identify the whole gas mixture; cryogenic liquid aliases are not the emitted phase. No CO2-equivalent, total-carbon or unspecified COx substitution."
    so2: "Only measured gaseous SO2, CAS7446-09-5, to unspecified air. Native general sulfur-oxide and product-form aliases do not license totalSOx, sulfite or solid/liquid product substitution. Determine species mass independently."
    air_n2in: "Only measured ordinary molecular N2, CAS7727-37-9, taken from air as an Elementary resource. Not total nitrogen, NOx, a purchased nitrogen Product, liquefied or isotope-specific supply. No fixed air fraction. Preserve the paired gross gas ledger; do not characterize unchanged pass-through as new environmental use."
    air_o2in: "Only measured neutral molecular O2, CAS7782-44-7, from air as an Elementary resource. Ionic, atomic, singlet, liquid, medicinal and isotope aliases are not adopted physical states. Not whole air or purchased pure-oxygen supply; no fixed fraction. Pair actual inlet and outlet evidence before environmental attribution."
    air_argon_in: "Only measured ordinary neutral Ar, CAS7440-37-1, as a resource from air; not purchased argon or isotope-specific gas. No assumed atmospheric fraction. Pair gross pass-through with actual outlet without inventing resource depletion or a credit."
    nitrogen_out: "Only measured molecular N2, CAS7727-37-9, to current unspecified air; not nitrogen-total excluding N2, NOx or a long-term release. Gross outlet retains pass-through physically; environmental inventory excludes unchanged paired inlet/outlet gas and identifies actual process changes independently."
    oxygen_out: "Only measured neutral molecular O2, CAS7782-44-7, to current unspecified air. Not atomic oxygen, ions, liquid oxygen or delayed release despite noisy aliases. Preserve gross phase mass and paired inlet; use only independently established process change for environmental attribution."
    argon_out: "Only measured ordinary Ar, CAS7440-37-1, to current unspecified air; not isotope-specific, indoor, high-stack or long-term release. An unchanged inlet/outlet pair is physical pass-through, not additional generated pollution or an avoided burden."
    water_vapour: "Only ordinary H2O vapour, CAS7732-18-5, emitted to current unspecified air. Heavy/tritiated water, ice, liquid and bound-water aliases do not define this phase. Separate inlet humidity, measured evaporation and actual reaction water; no residual or stoichiometric default. Gross vapour and attributed environmental change are separate."
    nitrogen_monoxide: "Only independently speciated neutral NO, CAS10102-43-9, to current unspecified air. The conflicting HNO/nitrosyl-hydride/nitroxyl and broad nitrogen-oxide synonyms are not adopted. No NOx-as-NO2 conversion, inferred speciation or fixed combustion factor."
    nitrogen_dioxide: "Only independently speciated NO2, CAS10102-44-0, to current unspecified air. Conflicting dinitrogen-tetroxide aliases are not adopted and do not authorize N2O4, nitrite or total NOx substitution. Actual state/speciation is required; no equilibrium or reaction-yield default."
    methane: "Only independently measured fossil CH4, CAS74-82-8, to current unspecified air. No long-term release, biogenic/LUC attribution, natural-gas mixture or carbon-black/formaldehyde/other conflicting aliases. Determine fossil provenance and species mass independently; no fixed factor or gas composition."
    supplier_sack: "Whole manufactured paper-bag family, production mix at plant, admits the actual compatible kraft cement sack. Not raw kraft sheet, fruit-bagging paper or a generic packaging bundle. Verify actual construction and any liner/coating/adhesive as material subledgers without adding a second purchase or upstream burden to the whole supplied bag. No default recycled fraction, dimensions or environmental superiority claim."
    dunnage: "Whole finished manufactured wooden wrapping/packaging family admits actual wooden transport dunnage. Not raw roundwood, a pallet/crate system or packaging services. Actual wood, treatments, hardware, moisture, repair additions/removals and supplier burden ownership must be documented; no wood species, dry mass, density, lifetime or reuse-cycle default."
    tie_wire: "Whole steel-wire Product family, production mix at factory, admits actual uncoated annealed carbon-steel tie wire. It is not wire-drawing service, a wire rope, prestressing strand, welded mesh or unworked steel feed. Actual annealed state, composition, diameter and supplier remain independently documented; no generic grade or annealing energy is inferred."
    steel_offcut: "Only actual steel process offcuts from cutting/forming/machining at plant and routed for recycling. Not a retired complete machine or mixed reinforced-concrete waste. Re-select if actual waste state/route differs. Gross scrap and its transport/treatment are measured; no scrap ratio, automatic manufacturing transfer, recovery yield or credit is supplied."
    spent_oil: "Used lubricating-oil Waste family at generation includes the actual spent petroleum/mineral hydraulic lubricant after use. Not new oil, a water/oil emulsion or container mass. Characterize contamination and separate actual water/solids and treatment; native treatment is unspecified and gives no recycling or combustion credit."
    mould: "Whole finished manufactured mould/tool Product family, factory production mix, admits the actual complete steel mould for mineral-material concrete forming. The actual supplied casting table must be a documented complete forming mould, not machined pre-assembly components, steel-plate feed, an entire production line or a crane/vibrator/tilting-wagon bundle. Measure that same complete assembly and any integrated parts independently; separate powered equipment or other assets when outside its actual mould boundary. Native identity supplies no machine weight, steel grade, life or cycle count. Physical acquisition/stock mass remains separate from actual service vectors."
    dunnage_i: "Conditional actual physical gross leg, native-unit V_i separate from every assigned/inherited burden vector, unique event/gate/cohort/horizon, one upstream owner, no second Q, no netting or economic scaling. Whole wet P/I contains its constituent water/material once; X only other same-side flow overlaps, never stocks or retained influx. Whole finished manufactured wooden wrapping/packaging family admits actual wooden transport dunnage. Not raw roundwood, a pallet/crate system or packaging services. Actual wood, treatments, hardware, moisture, repair additions/removals and supplier burden ownership must be documented; no wood species, dry mass, density, lifetime or reuse-cycle default."
    dunnage_er: "Conditional actual physical gross leg, native-unit V_i separate from every assigned/inherited burden vector, unique event/gate/cohort/horizon, one upstream owner, no second Q, no netting or economic scaling. Whole wet P/I contains its constituent water/material once; X only other same-side flow overlaps, never stocks or retained influx. Whole finished manufactured wooden wrapping/packaging family admits actual wooden transport dunnage. Not raw roundwood, a pallet/crate system or packaging services. Actual wood, treatments, hardware, moisture, repair additions/removals and supplier burden ownership must be documented; no wood species, dry mass, density, lifetime or reuse-cycle default."
