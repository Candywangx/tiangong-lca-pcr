  semantic_boundary_decision: "Independent scope review of all1282 material records at fixed ref40 and all251 frozen intakes finds no existing whole non-prestressed solid reinforced structural wall-panel wet-cast method. Fresh concrete, unreinforced vibropressed pavers, dry-cast drainage pipes, fibre/wood cement boards, formwork, cement powders and installed construction differ in terminal and manufacturing boundary. This is a narrower positive physical methodology, not a duplicate created from a classification leaf."
  source_synthesis_limitations: "Complete local publisher NPCA19 PDF and Elematic solid-wall/SEMI publisher HTML plus complete2016 brochure support qualitative technical synthesis, not one SKU, one factory or current certification. Failed BCA PDF URL returned redirected HTML and is not evidence. NPCA18 is retained acquisition only and superseded for this synthesis by19. ILCD full original/extraction reused under allocation-specific request; mismatched candidate reads, numeric_reuse blocked and coveredfalse remain explicit outside canonical content. No industrial document is used as LCA allocation authority; no quantitative recipe/cure/performance/asset-life default."
  core_reference_identity: "Positive member and full public state100 exact01.01.000 whole Precast reinforced-concrete wall panel; referenceMass03.00.003->unitgroup03.00.003->kg. Narrow actual primary terminal is compatible; not a bare concrete/beam/installation substitution."
  reference_gate: "New first quality release whole-panel net kgQ includes steel/inserts and actual water state. Released closingFG already inQ: no manufacturing Bclose debit or second product. Manufacturing Bclose is raw/WIP/unassigned stores only; services use original cohortQ_o with actual observation horizon. Performed services are never deducted because FG remains. All physical gross legs remain unscaled."
  ordinary_data_gaps: "Future actual manufacturer/governingQC, measured configurations/cohort quantities, permitted repairs, exact suppliers and conditional auxiliary members must be obtained for a real dataset; these are not fabricated values or methodology review."
