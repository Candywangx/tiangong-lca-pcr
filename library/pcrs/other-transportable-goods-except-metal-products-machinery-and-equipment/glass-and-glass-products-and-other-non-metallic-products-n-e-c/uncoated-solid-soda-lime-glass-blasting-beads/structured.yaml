      process_id: "manufacture"
      flow_role: "cullet"
      record_type: "weighing"
      raw_fields: "lot; source glass; supplier; gross/net kg; moisture; contaminants; sorting loss; crusher/screen; conditioning; all modes"
      collection_method: "Calibrated lot weighing and representative moisture/composition/contamination tests; retain as-received units and actual losses.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "kg"
      frequency: "Every lot/event and representative meter interval"
      temporal_coverage: "Complete campaign/all modes; services use original-cohort observed start/end"
      site_scope: "Actual included site and documented suppliers/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; lot/state trace; completeness; uncertainty/detection limits"
