      raw_fields: "asset/configuration; gross physical opening/new/repair/removed/closing; installed/spare; oil/fluid; moisture; wear; measured mass; actual use hours; supported service capacity; provider scope"
      collection_method: "Gross asset/fluid stock balance separate from actual attributable manufacturing/service fraction. Support service capacity/use and historical burden per asset, no invented fixed life/mass/full asset per kg. Add each actual missing machine/repair material individually.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "kg; h"
      frequency: "Every lot/event and representative meter interval"
      temporal_coverage: "Complete campaign/all modes; services use original-cohort observed start/end"
      site_scope: "Actual included site and documented suppliers/outlets"
