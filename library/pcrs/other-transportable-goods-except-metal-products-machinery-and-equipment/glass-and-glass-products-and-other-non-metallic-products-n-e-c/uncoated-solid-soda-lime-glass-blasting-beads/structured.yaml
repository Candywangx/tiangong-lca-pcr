      raw_fields: "meter; start/end; kWh; integrated gas volume; pressure; temperature; compressibility; composition; independent density; HHV; carrier mass; C/H/S; modes; provider scope"
      collection_method: "Calibrated meters and fuel assays; separate production and nonproductive modes. Preserve original units/HHV before conversion, independent carrier mass/element subledger without double purchase.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "kWh; m3; kg; MJ"
