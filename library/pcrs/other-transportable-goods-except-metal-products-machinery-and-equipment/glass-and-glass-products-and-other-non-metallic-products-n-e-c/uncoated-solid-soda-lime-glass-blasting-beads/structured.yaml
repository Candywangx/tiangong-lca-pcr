      collection_method: "Measure primary/secondary/feed/cooling air and outlets; reconcile dry/wet states. Convert actual individual species, integrate rates once, never multiply integrated volume by time again.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "m3; kg"
