      raw_fields: "location; integrated volume; temperature; independent density; moisture; solids; dissolved species; recirculation; purge; condensate; phase; treatment; reaction-water observation"
      collection_method: "Independently measure external liquid inlets/outlets and phase. Separate inlet humidity, free/structural water, evaporation and combustion water with independent observations and fuel evidence; one residual cannot determine two unknowns.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "m3; kg"
