    - protocol_id: cp_logistics
      process_id: "manufacture"
      flow_role: "freight"
      record_type: "shipment_record"
      raw_fields: "shipment; actual cargo tonnes; km; mode/route; empty return; boundary"
      collection_method: "Actual shipment/route records; preserve tonnes/km, each actual mode separate.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "t; km; tkm"
      frequency: "Every lot/event and representative meter interval"
      temporal_coverage: "Complete campaign/all modes; services use original-cohort observed start/end"
      site_scope: "Actual included site and documented suppliers/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; lot/state trace; completeness; uncertainty/detection limits"
    - protocol_id: cp_balance
      process_id: "manufacture"
      flow_role: "stocks; secondary_grade; reject_glass"
      record_type: "stock_record"
      raw_fields: "lot; physical amount; dry/wet state; opening/closing raw/WIP/unassigned stores; each inherited exchange vector; failed/zero/startstop/idle/cleanup/rework; coproduct state/value"
      collection_method: "Reconcile lot/stock/history independently from mass/species/element closure. First-released closingFG excluded from manufacturing B_close; actual exclusive operations and residual allocation substantiated.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "native extensive unit; kg"
      frequency: "Every lot/event and representative meter interval"
      temporal_coverage: "Complete campaign/all modes; services use original-cohort observed start/end"
      site_scope: "Actual included site and documented suppliers/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; lot/state trace; completeness; uncertainty/detection limits"
    - protocol_id: cp_service
      process_id: "services"
      flow_role: "each original-cohort service"
      record_type: "cohort_service_record"
      raw_fields: "original cohort/Q; observed start/end; opening/closingFG; gross dispatch; actual returned dry beads; original delivery; added water/dirt; new loss/rework; kWh; paired internal Q; actual manufacturer rework permission and grade acceptance; actual new material/water and removed old material; original delivery reversal; each inherited vector"
      collection_method: "Trace each movement to original release/history; independently measure returns and acquired water/contamination. Collect only observed increments, not new production at retest/redispatch; horizon explicit.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "kg; kWh"
      frequency: "Every lot/event and representative meter interval"
      temporal_coverage: "Complete campaign/all modes; services use original-cohort observed start/end"
      site_scope: "Actual included site and documented suppliers/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; lot/state trace; completeness; uncertainty/detection limits"
    - protocol_id: cp_packaging
      process_id: "services"
      flow_role: "each PE bag; PP sack; pallet"
      record_type: "article_stock_record"
      raw_fields: "article construction; tare; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; purchases; external_returns_received; closing counterparts; gross_outbound; external_return_out; waste; repairs; supplier_included_arrival; supplier burden inclusion; actual article water uptake/loss; new and removed repair parts; every inherited exchange vector"
      collection_method: "Count/weigh actual article construction/state with calibrated tare. Include pre-release attached articles where present, supplier BOM, repairs, external returns and all closing states. Internal reuse cancels, never new purchase each cycle.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again. Record purchase, supplier-included arrival, external return received, gross dispatch and separate return sent as five distinct directions with mutually exclusive stocks and each receipt once. Actual wood/paper moisture and genuine old/new repair components remain atomic; whole article and included constituent are never purchased twice."
      unit: "kg; item"
      frequency: "Every lot/event and representative meter interval"
      temporal_coverage: "Complete campaign/all modes; services use original-cohort observed start/end"
      site_scope: "Actual included site and documented suppliers/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original records; lot/state trace; completeness; uncertainty/detection limits"
  calculation_rules:
    - id: calc_conversion
      applies_to: "all inventory rows"
      rule: "Convert raw extensive amounts into row numerator units before attribution. Electricity MJ = metered kWh *3.6. Fuel MJ uses actual integrated gas and HHV, independent carrier mass subledger. kg from weighing/independent substance-state density; tkm = actual tonnes * km. Integrate true rates once, not already integrated volume. Item mass needs measured same-configuration article/lot, no secondary-factor guesses."
      inputs:
        - raw_i
        - conversion_i
        - cp_raw
        - cp_energy
        - cp_water
        - cp_air
        - cp_logistics
      output: "C_i"
      source_ids:
        - fhwa-bead-workflow-2014
        - us4385917-bead-furnace
    - id: calc_history
      applies_to: "all inventory rows"
      rule: "A_i = B_open_i + C_i - B_close_i after actual conversion/attribution, preserving each inherited vector. Manufacturing B_close includes raw/WIP/genuinely unassigned stores, never first-released FG already in Q. Internal transfers cancel once. Services assign only actual increments to original cohort/horizon without repurchasing manufacture. Asset service fraction = evidenced actual use / supported service capacity, applied to original asset burdens separately from gross asset stocks. C_i identifies receipt versus already-consumption-corrected readings: never apply a second stock correction. Every raw/WIP/non-WIP physical quantity retains its exchange-specific vector; ordinary waste/rejects and failed loads do not automatically export burden or earn credit. For all FG/package movement cards A_i is the full measured gross movement, without adding burden vectors, stock-correcting the same leg or applying allocation shares; these ledger-only legs create no provider purchase/co-product credit. Performed service for held closingFG retains actual service burden; no deduction merely because it is held."
      inputs:
        - B_open_i
        - C_i
        - B_close_i
        - cp_balance
        - cp_assets
        - cp_service
      output: "A_i"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q; A_i is attributable unnormalised exchange amount in this row numerator unit; Q is unique first-released net dry bare bead kg. This is the only normalization. Cards/aggregation reference this same x_i without dividing again. Q = 0 retains raw loads/history and produces no unit result. Finished 1 kg is reference identity, not another output addition."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "x_i"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all physical streams"
      rule: "At manufacturing, FG/service and combined gates: opening physical stocks + gross actual external inputs = closing stocks + gross actual external outputs. Pair/cancel internal Q/transfers. Independently check whole mass, water, relevant glass/metal elements and molecular species; keep asset/fluid stocks separate. No economic scaling of gross mass, or residual fitting of two unknowns."
      inputs:
        - gross_i
        - stock_open_i
        - stock_close_i
        - cp_balance
        - cp_water
        - cp_air
        - cp_emissions
        - cp_assets
      output: "physical_closure_i"
      source_ids:
        - us4385917-bead-furnace
        - fhwa-bead-workflow-2014
    - id: calc_packaging
      applies_to: "services"
      rule: "Each PE bag, PP sack and pallet separately: opening_empty + opening_attached_WIP + opening_attached_FG + opening_reusable + purchases + supplier_included_arrival + external_returns_received = closing_empty + closing_attached_WIP + closing_attached_FG + closing_reusable + gross_outbound + external_return_out + waste. Retain burden vectors and repair supplies; cancel internal reuse, not gross external movements. Never bare-glass Q/new purchase each reuse/automatic co-product or credit. All stock categories and receipts are mutually exclusive; included supply carries no second purchase. Add separately measured real article water uptake/loss and new/removed repair components on their physical sides; retain original vectors without double-buying constituents."
      inputs:
        - cp_packaging
        - stock_open_i
        - stock_close_i
        - gross_i
      output: "packaging_closure_i"
      source_ids:
        - jrc-ilcd-attributional-2010
        - fhwa-bead-workflow-2014
    - id: calc_fg
      applies_to: "services"
      rule: "OpeningFG + Q + actual external returned dry beads + true permitted dry-glass additions = closingFG + gross dispatched dry beads + service glass waste + separately identified actual dry-glass exits. Added water/contamination balances separately. Internal Q cancels at combined gate so manufacture is not output twice; original manufacture remains once and later increments keep original Q/observed horizon. Any actual dry-material addition/removal requires its own atomic record and manufacturer acceptance; do not assume such additions or equivalent return mass."
      inputs:
        - cp_service
        - cp_release
        - Q
        - gross_i
      output: "fg_closure_i"
      source_ids:
        - jrc-ilcd-attributional-2010
        - fhwa-bead-workflow-2014
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "all processes"
      requirement: "Demonstrate actual solid/uncoated/soda-lime blasting grade, whole cullet-to-first-release route and acceptance methods; qualitative synthesis is not numerical factory/performance evidence."
      evidence: "Supplier glass history; microscopy; route; grade/QC/release records"
    - id: dq_history
      applies_to: "all inventory rows"
      requirement: "Retain original units, all modes, inherited vectors, Q0, uncertainty and explicit observed service horizon; no omission of failures or unknown past burden."
      evidence: "Calibration; raw logs; stock/cohort histories; observation coverage"
    - id: dq_native
      applies_to: "all inventory rows"
      requirement: "Before binding verify full native state/form/route/geography/medium/type/CAS/properties/unit chain and full consuming-card restrictions. Distinguish unbound auxiliary/provider gaps from genuine core identity/method holds."
      evidence: "Query members; exact native records; supplier/state/boundary evidence"
    - id: dq_physical
      applies_to: "all processes"
      requirement: "Independent mass/element/species/water/phase/packaging/asset evidence must reconcile gross gates; no residual fit or economic mass scaling. Unknown speciation/non-detects remain explicit."
      evidence: "Closure; species/phase analysis; article and asset/fluid ledgers"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "These rules inherit the full solid/uncoated/soda-lime/blasting/cullet-flame/first-release scope and all ancestor boundary/cohort conditions. Engineering checks do not approve science, translation, mapping or publication."
    source_ids: []
  - rule_id: validate_terminal
    applies_to: "reference product"
    rule: "Check actual solid glass-bead abrasive, soda-lime grade, uncoated state, full raw-to-terminal route and unique quality release. Generic elementary particles, hollow/fibre/coated/composite identity or bought-bead packing cannot substitute. Real missing core native identity or primary route/terminal evidence prevents usable methodology whatever the formal check."
    source_ids:
      - swarco-cullet-industrial-beads
      - fhwa-bead-workflow-2014
      - us4385917-bead-furnace
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Both languages must use same Q/native numerator units, raw conversion, actual allocation/history and only one A_i/Q. Collection/cards never divide again; Q0 no unit output. Unknown relationships are unresolved, never pass."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: validate_gates
    applies_to: "all physical streams"
    rule: "Check manufacturing, FG/service and combined gross mass/element/species/water, complete packaging/returns, asset/fluid histories. ClosingFG in first-release Q keeps manufacturing burden. No duplicate internal Q, arbitrary economic/physical split or automatic credit."
    source_ids:
      - jrc-ilcd-attributional-2010
      - fhwa-bead-workflow-2014
      - us4385917-bead-furnace
  - rule_id: validate_native
    applies_to: "all inventory rows"
    rule: "Recheck adopted full basename/synonyms/comments, CAS/state/route/form/geography/medium/type and every property plus exact unit chain. Native noise/contradictions and family restrictions remain in each full consuming context; unbound auxiliary atoms are never replaced by generic collections."
    source_ids:
      - swarco-cullet-industrial-beads
      - us4385917-bead-furnace
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
