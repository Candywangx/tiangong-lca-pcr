      record_type: "species_record"
      raw_fields: "outlet; interval; gas flow/state; concentration basis; molecular species; phase; NO/NO2; carbon origin; dry PM size; captured dust; limits; operating modes"
      collection_method: "Representative actual sampling after controls and speciated mass calculations. Retain non-detects/uncertainty; no aggregate-to-species inference or overlapping particle bins. Water outlet constrained by independent fuel/humidity/liquid records.  Collection/aggregation sum undivided raw records only, preserving original units/history. Convert, attribute and reconcile first; only calc_reference produces x_i per 1 kg reference flow. The aggregation field references this result without dividing Q again."
      unit: "kg; m3"
      frequency: "Every lot/event and representative meter interval"
      temporal_coverage: "Complete campaign/all modes; services use original-cohort observed start/end"
      site_scope: "Actual included site and documented suppliers/outlets"
