  downstream_use: "Attributional supply of matching uncoated solid blasting bead grade with declared observed services"
  allowed_use: "Matching grade/state/route and first-release boundary after independent applicability review"
  excluded_use: "Whole37199; hollow/coated/composite/optical/fibre/road-performance extrapolation; unreviewed net-delivery/lifetime service"
  required_metadata: "solid soda-lime glass and recovered flat-glass origin; uncoated noncomposite state; actual size distribution and test; roundness and defect acceptance; thermal history and stress/QC gate; furnace and actual fuel/air/cooling route; unique first-release dry bare mass Q and cohort; dry mass and moisture method; raw/WIP/FG histories and all modes; native identity/provider restrictions; molecular species and free/reaction/phase-water evidence; each packaging construction and returns; physical assets/fluids and service burden; original-cohort service observation window"
  required_quality_disclosure: "Raw evidence; unbound identity/provider limits; modes/history; allocation; mass/species/water closure; uncertainty; cohort/service horizon; review state"
  update_trigger: "Glass source/grade, coating/solid state, route/fuel/cooling, provider, stock history/service horizon or new evidence change"
data_sources:
  - id: "swarco-cullet-industrial-beads"
    type: "literature"
    reference: "SWARCO Indusferica, How Glass Cullet Turn into High-Grade Industrial Products. https://www.swarco-indusferica.com/en/b/glass-cullet-industrial-products/"
    used_for: "Manufacturer primary: flat-glass scraps, crushers/pre-screen, shaft-furnace spherical formation and actual soda-lime blasting use. No marketing energy/size/throughput default; no LCA allocation."
  - id: "fhwa-bead-workflow-2014"
    type: "official_guidance"
    reference: "FHWA-HRT-14-021, Screening Level Assessment of Arsenic and Lead Concentrations in Glass Beads Used in Pavement Markings, January2014, pp.34–37 (PDF44–47), especially p.36 Bead Manufacturing/Bead Blending. https://www.govinfo.gov/content/pkg/GOVPUB-TD2-PURL-gpo50114/pdf/GOVPUB-TD2-PURL-gpo50114.pdf"
    used_for: "Complete official primary: common cullet/grinding/furnace/cooling/sieving/blending/QC/packing/handling and blend-only counterexample. Road-marking scope does not prove blasting specification, current health/legal limit, recipe, numeric emission or allocation."
  - id: "us4385917-bead-furnace"
    type: "literature"
    reference: "US4385917A, Method for making glass beads, granted1983-05-31, description and Figures1–6. https://patentimages.storage.googleapis.com/56/27/39/74c510f37c2920/US4385917.pdf"
    used_for: "Complete patent primary: gas/air apparatus, cullet feeding, surface-tension rounding, air cooling, discrete solid spheres/collection. Alternative fuels/oxygen enrichment and numeric dimensions/temperatures/recipes/efficiencies are examples, not defaults or LCA allocation."
  - id: "jrc-ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, First edition March2010, §§7.9.2–7.9.3, pp.255–272 (PDF275–292). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision, exchange-specific determining physical causality and only residual actual-state common-exit market value. Foreground protocols operationalize bookkeeping independently; no bead recipe/route/numeric allocation inferred."
