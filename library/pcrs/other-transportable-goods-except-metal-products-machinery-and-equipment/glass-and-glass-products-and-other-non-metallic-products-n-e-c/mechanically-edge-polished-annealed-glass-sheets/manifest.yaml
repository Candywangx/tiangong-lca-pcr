  semantic_boundary_decision: New narrower cold edge-conversion identity after
    all1247 checked33 material records and original CPC neighbors. Existing37113
    explicitly excludes worked sheets; mirror/insulating/coated legacy stubs are
    not compatible material methods. Neighbor37111/37112/37115 worktrees
    read-only at clean initial state, no new four-file material at that
    observation. No shared mapping/index/catalog/ADR changes or whole37114
    coverage claim.
  source_synthesis_limitations: Actual annealed and edgework offers from One Day
    Glass, qualified RIG availability with conflicting sharp-edge wording and
    hole heat-treatment preference, Vitro scoring/counterexamples, Bovone
    equipment/wheel/wash and historical Syracuse edgework support qualitative
    synthesis, not a common current SKU/factory/order. No density, item mass,
    life, temperature, strength, certification, capacity-derived consumption or
    fixed allocation share. ILCD hierarchy only attributional cases requiring
    allocation, not industrial recipe or whole-handbook conformity.
  reference_gate: Unique new first-quality-released dry bare-sheet kgQ; closing FG
    already inQ. Actual post-release services separate by matched cohort and
    observed interval. Retain all failed/idle/cleanup, WIP/FG/non-WIP charge
    physical and per-exchange histories, original-dispatch/return reversals,
    real wet/dry repair and package gross flow ledger. Q=0 retains raw burden;
    calc_reference A_i/Q once. Manufacture closing excludes first-released FG;
    its B_i^Q transfers to a separate FG ledger. Combined gates cancel internal
    Q/B_i^Q. Retain actual service material/water additions and removals against
    original Q; included asset physical stock and documented service assignment
    remain separate.
  native_identity_limitations:
    stock_sheet: Received clear/body-tinted uncoated monolithic stock before
      scoring/edgework. Net dry glass and original supplier burdens are counted
      once, not a purchased polished finished piece. Native identity is
      manufactured sheet at plant and also includes face-ground/polished
      variants; restrict this exchange to actual unworked annealed float stock.
      Grade, thickness, density, coating and provider are not established.
    core_electricity: Meter scoring/breakout, edging, slurry mixing, pumps, water
      treatment, wash/dry, air generation and abatement including
      failure/start/stop/idle/cleanup. Native identity is CN grid-average1–35kV
      customer-side consumption only. Native Net calorific value is the MJ
      energy property, not fuel mass. Other voltage/geography/contract mix
      requires verified replacement; no generator, renewable contract or
      site-specific factor follows from this identity.
    tap_makeup: Actual externally supplied tap-water makeup for wet grinding,
      in-house liquid preparation, cleanup and wash. Native identity leaves
      supplier/geography unspecified and supplies only the Mass reference property;
      it proves no independent density or site treatment train. Distinguish
      makeup, internal circulation and DI water; slurry carrier water is not
      repurchased.
    di_rinse: Conditional actual de-ionised water supply only. Native Product/Mass
      identity provides no specific purity, route, geography or provider; it
      cannot identify ordinary mains/raw water. If made on site, collect tap
      feed and each real treatment input/energy/reject and cancel internal DI
      transfer instead of purchasing it twice.
    dry_ceria: Only actual separately bought CeO2 powder used in in-house polishing
      liquid. Native CAS1306-38-3 describes pale yellow-white Ce(IV) oxide
      powder at plant; no specific particle size, purity, geography or polishing
      grade is fixed. Photocatalytic-use prose is no performance guarantee.
      Measure assay/moisture/form; nano, treated, mixed or pre-wetted products
      require separate compatibility. Actual mixing water, energy and loss
      remain separate.
    finished_sheet: "Q is unique new first-quality-released net dry bare-sheet mass
      after all specified edgework, wash/dry and inspection. Native Glass
      (formed & finished) has no grade/annealed/edge restriction, but its37199
      classification differs from this37114 scope: disclose that isolated
      classification discrepancy and use only its broad physical glass identity.
      This row must state uncoated soda-lime-silicate monolithic unframed
      flat-polished annealed sheet, actual drawing/thickness/inspection and
      non-safety state. Identity supplies no density, per-piece mass,
      certification or provider match."
    service_electricity: Actual post-release packing/storage/handling/dispatch and
      incremental repair/wash/repack electricity by the same first-Q cohort,
      including waits and failed moves. Separate manufacture and opening-FG
      cohorts. Native identity only CN1–35kV customer grid-average consumption,
      with Net calorific value as MJ energy property, not fuel mass. Other
      voltage/geography/mix requires verified replacement.
    pack_film: Conditional one actual supplied packaging article, with complete
      composition and empty/attached/reusable stocks and return history. The
      upstream numerator counts new acquisition and justified service
      assignment, not each internal reuse or returned item. Gross dispatch/waste
      and actual incoming-sheet package are independent. Native polyethylene
      film CAS9002-88-4 is plant production mix without fixed grade/geography;
      its leather/luggage classification conflicts with coherent PE
      name/CAS/comments, an isolated disclosed classification defect. Competing
      PET mentioned in comments does not identify PE as PET. Actual
      composition/provider still require matching.
    water_vapor: Actual independently measured water evaporation to air from wet
      processing/drying, reconciled with carryover/wastewater and stock change;
      no inferred reaction water or purchased steam. Native CAS7732-18-5 water
      vapour is Elementary/Mass/kg to air unspecified only. The native synonym
      list contains liquid/ice and heavy/tritiated-water noise; these do not
      override the coherent ordinary-water CAS, vapour basename and air
      compartment and are not adopted as isotope, liquid, ice, water/soil or
      high-stack identities. Actual destination still must match.
    airborne_glass_dust: Actual escaping soda-lime glass particulate to air
      unspecified, mass measured without an assigned particle-size fraction.
      Native definition fixes no chemistry, size distribution, stack height or
      LCIA factor. Its clinker-calcination example and0.01689kg/t are explicitly
      source-specific applications, not glass-route restrictions or an emission
      factor here. Preserve actual glass chemistry; this is not pure crystalline
      silica or a sum of overlapping total/PM10/PM2.5 measures. If
      size/compartment is known use its correctly matched flow instead. Add each
      actual identified volatile scoring/cleaning species and destination
      separately; totalVOC cannot replace them.
  ordinary_gaps:
    - Actual future supplier/grade/drawing, measured quantities and product
      acceptance are foreground collection requirements; no invented factory
      numbers.
    - Specific unbound auxiliary/packaging/waste/species UUIDs and
      provider/voltage/geography compatibility remain explicit per row.
    - Actual missing species/destinations, phase/reaction water, charge and
      inventory histories must be collected; unknowns hold the affected dataset,
      not become zeros.
