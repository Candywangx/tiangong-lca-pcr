system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Start at received unworked annealed float stock with inherited supplier burdens. Include unloading/storage, layout, wheel scoring/breakout, wet grinding/polishing of every specified edge/chamfer, actual polishing-liquid preparation, wash/rinse/dry and dimensional/edge inspection to first release. Include pumps, air generation, dust capture, water/sludge treatment, cleaning and maintenance. Buying an already polished sheet and packing it is outside this conversion route."
      source_ids:
        - vitro-scoring-td119
        - bovone-glass-2024
        - oneday-edgework
    - rule_id: boundary_scope
      applies_to: "all products"
      rule: "Require an actual flat-polished annealed terminal. Polishing proves no safety performance, tempered state or certification. Exclude heat strengthening/tempering, laminated, bent/drilled/engraved/enamelled, coated, mirrored, insulating and framed products. A different evidenced route needs its own applicability decision. This narrower candidate does not cover all37114. Upstream stock melting is not repeated as foreground conversion."
      source_ids:
        - unsd-cpc-2025
        - vitro-heat-treatment-td124
        - rig-fabrication
        - oneday-annealed
    - rule_id: boundary_q
      applies_to: "manufacture; supply_services"
      rule: "Q is unique new first-quality-released dry bare-sheet kg after declared edgework, wash/dry and inspection. Count each physical piece once; closing FG of that cohort is already Q, never another output. Delivery/reinspection/repair/reshipment create no Q. Keep actual post-release packing/storage/handling/dispatch and losses in a separate matched-cohort service account with observed interval, incomplete future coverage and later increments. Opening-FG services cannot be divided by unrelated current Q."
      source_ids:
        - oneday-edgework
        - ilcd-general-2010
    - rule_id: boundary_history
      applies_to: "all inventories"
      rule: "Reconcile manufacture and FG-service ledgers separately by physical quantity and per-exchange inherited vector. Manufacture closing stocks are unreleased raw/WIP and unassigned installed tool/fluid/asset service inventories; transfer every newly first-released sheet and its manufacturing vector into FG, including sheets still held at period end. Keep failed/zero-output, start/stop, idle, cleanup and actual rework burdens. FG returns reverse the original gross dispatch quantity/vector; record each actual added repair/wash material and water, removed glass/water, and incremental service exchange separately against the original Q cohort. Reinspection and repair create no new Q. Retain included asset physical stocks and documented service assignments separately; no invented lifetime or repeated full procurement. Internal release transfers and internal Q cancel on consolidation."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_packaging
      applies_to: "supply_services"
      rule: "For each article opening empty + attached WIP/FG + reusable stock + external acquisitions + external-return-received = corresponding closing + with gross physical dispatch + external-return-sent + waste. Apply independently to incoming and outgoing packages/racks. Cancel internal reuse/transfers; return receipt is not new procurement. Preserve gross dispatch even when glass returns. Packaging never enters bare-glass Q, becomes an automatic coproduct or substitution credit."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_formulations
      applies_to: "all inventory rows"
      rule: "Purchase each whole supplied scoring fluid, slurry, coolant or detergent once. Assay, carrier water, active material and impurities are child composition ledgers. For actual in-house preparation record every separately purchased ingredient, makeup water, electricity and preparation loss without also purchasing the same complete slurry. Add each actual missing material, energy/fuel/heat, package, waste and identified species/destination as an individual card; unknown presence is not zero/not-applicable."
      source_ids:
        - vitro-scoring-td119
        - bovone-glass-2024
    - rule_id: boundary_physical
      applies_to: "all physical gates"
      rule: "Independently reconcile total wet/dry mass, free/carryover/evaporated water and relevant glass/Ce/wheel/organic elemental content. Mixed glass fines are not pure SiO2; COD/VOC are indicators, not one chemical. Actual species, reactions, oxygen uptake and reaction/structural/phase water need independent evidence; cold mechanical work implies no batch-carbonate decomposition or combustion. One residual cannot determine two unknowns. Manufacturing subgates, FG service and combined physical gates must agree; unresolved closure holds the affected dataset."
      source_ids:
        - bovone-glass-2024
        - ilcd-general-2010
    - rule_id: boundary_utilities
      applies_to: "all utilities"
      rule: "Meter each actually present utility; catalog power/capacity is not consumption. Air knives may be blower-driven; invent no compressed-air purchase, boiler or steam. For actual external heat-exchange water/condensate returns record incoming/outgoing mass, actual temperature/pressure/enthalpy and supplier water/energy convention, including the real return as Product flow. Suppress neither real returns nor copy fictitious ones. Internal circulation is not repeated procurement."
      source_ids:
        - bovone-glass-2024
