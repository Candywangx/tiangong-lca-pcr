      record_type: "Raw measurement and history record"
      raw_fields: "single article/material; actual tare/configuration; opening/closing empty plus attachedWIP/FG plus reusable; acquisition; external-return-received; gross dispatch; external-return-sent; waste; internalreuse; inherited vector; provider packaging boundary"
      collection_method: "Weigh each package/article and gross physical movement independently from procurement/service burden; count conversion requires same-configuration weighed mass; cancel internal reuse/transfers Aggregation method: Sum undivided raw quantities per actual exchange/cohort; convert units and reconcile histories/physical ledgers then perform actual allocation; calc_reference alone yields per reference flow. Never divide raw collection or normalized x_i again."
      unit: "kg; actual item count with measured mass"
