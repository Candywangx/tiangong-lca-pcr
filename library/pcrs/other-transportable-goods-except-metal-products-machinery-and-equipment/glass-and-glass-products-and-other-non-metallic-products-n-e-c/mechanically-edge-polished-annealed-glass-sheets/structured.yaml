  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "stock_sheet"
      record_type: "Raw measurement and history record"
      raw_fields: "supplier lot; net wet/dry mass; dimensions/thickness; received state; opening/closing raw/WIP; transfers; inherited vector per exchange"
      collection_method: "Calibrated receiving/issue/net weighing and stock reconciliation; geometry only with independent actual density/removal volume Aggregation method: Sum undivided raw quantities per actual exchange/cohort; convert units and reconcile histories/physical ledgers then perform actual allocation; calc_reference alone yields per reference flow. Never divide raw collection or normalized x_i again."
      unit: "kg"
      frequency: "Each event/batch/move and period reconciliation"
      temporal_coverage: "Same full production period including all modes; actual same-cohort observed service interval separately disclosed"
      site_scope: "Each included line/circuit/stock and actual service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; full raw logs; composition/state evidence; signed physical/history ledger and uncertainty/coverage"
