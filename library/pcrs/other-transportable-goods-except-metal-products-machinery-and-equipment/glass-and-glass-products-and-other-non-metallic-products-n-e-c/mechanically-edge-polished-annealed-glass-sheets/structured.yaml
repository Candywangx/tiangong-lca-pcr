  calculation_rules:
    - id: calc_raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert each original unit to row unit once before assignment: raw kWh×3.6 = MJ; integrate only actual rates. An integrated gas/liquid volume is not multiplied by time. Mass-from-volume requires independently measured density for the same material/state and actual tare."
      inputs:
        - cp_energy
        - cp_water
        - cp_aux
        - cp_formulation
        - cp_species
      output: "converted undivided raw_i"
      source_ids:
        - bovone-glass-2024
    - id: calc_history
      applies_to: "all inventory rows"
      rule: "Per exchange, manufacture ledger: opening raw/WIP and unassigned installed tool/fluid/asset service vector + actual additions = corresponding closing unreleased/unassigned vector + first-release transfer B_i^Q + other traced destinations. First-released closing FG is outside that manufacture closing term and remains in B_i^Q. FG-service ledger: opening FG vector + B_i^Q + actual external return at its original dispatch vector + actual incremental service additions = closing FG vector + gross dispatch vector + other traced removals/destinations. Return reversal never cancels the manufacture already included in original Q. Manufacturing A_i is B_i^Q; service A_i is only the actually assigned same-cohort service increment, each normalized once by original Q. Preserve separate physical installed-charge/asset stocks and documented service assignment; retained equipment mass is not a consumption or lifetime assumption. Cancel internal B_i^Q and transfers when consolidating; never subtract closing FG from first-release manufacturing A_i."
      inputs:
        - cp_material
        - cp_aux
        - cp_release
        - cp_service
        - cp_packaging
      output: "A_i undivided assigned exchange vector"
      source_ids:
        - ilcd-general-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q; A_i is the converted history-reconciled actually allocated undivided numerator for this exchange and Q cohort; Q is unique new first-quality-released dry bare-sheet kg of that cohort. Divide exactly once for Q>0. Q=0 retains raw burden/investigation/future assignment but no unit result. Cards and collection aggregation reference this same x_i, never divide again. Manufacture and separately labelled service vectors remain distinct; closing FG is already inQ."
      inputs:
        - cp_release
        - cp_material
        - cp_energy
        - cp_water
        - cp_aux
        - cp_formulation
        - cp_residue
        - cp_species
        - cp_service
        - cp_packaging
      output: "x_i per1kg reference flow"
      source_ids:
        - ilcd-general-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "Reconcile three linked physical gates independently. Manufacture: opening raw/WIP/installed stocks + actual external inputs = corresponding closing unreleased/installed stocks + dry first-release transfer Q + measured manufacturing waste/export/emissions. FG services: opening FG + Q transfer + actual external returns + actual service material/water inputs = closing FG + gross physical dispatch + actual other external outflows + measured service waste/emissions, including actual repair glass/moisture removal. At the combined gate cancel internal Q/transfers: opening all physical stocks + actual external inputs/returns = closing all stocks + gross external dispatch/other outflows + measured wastes/emissions; Q is not another external product beside closing FG or dispatch. Apply wet-mass, glass-solids, free/carryover/evaporated-water and relevant Si/Ce/metal/organic-element subledgers to actual constituents, with installed tool/fluid/asset quantities separate. No single residual fits unknown glass loss and evaporation together; element totals or COD/VOC do not determine actual reaction water/species."
      inputs:
        - cp_material
        - cp_release
        - cp_formulation
        - cp_water
        - cp_residue
        - cp_species
        - cp_service
      output: "independent physical/elemental closure"
      source_ids:
        - bovone-glass-2024
        - ilcd-general-2010
    - id: calc_package
      applies_to: "all inventory rows"
      rule: "Per article: opening empty + attachedWIP/FG + reusable + acquired + external-return-received = corresponding closing + with gross physical dispatch + external-return-sent + discarded. Internalreuse cancels. Assign separate actual procurement/service burden to its true cohort; no movement becomes another purchase and collection does not divide raw quantities byQ."
      inputs:
        - cp_packaging
        - cp_service
      output: "article balance and undivided assigned burden"
      source_ids:
        - ilcd-general-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Actual drawing, measured dry net mass/configuration and polished-edge first release must establish the annealed non-safety terminal. Manufacturer offers do not certify a future end use."
      evidence: "drawing; supplier declaration; inspection; calibrated weighing"
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "Complete representative raw site/period data include failure, zero-output, start/stop, idle, cleanup, rework, WIP/FG and non-WIP charges with per-exchange inheritance. Unknown core terminal/route, historical vector or actual physical/species closure holds the affected dataset, never an invented zero."
      evidence: "full coverage/uncertainty register; signed reconciliation"
    - id: dq_native
      applies_to: "all inventory rows"
      requirement: "Check all native basenames, synonyms/comments, CAS, form, grade/route/geography/medium/type and all properties. Keep official Chinese display; exact reference property/unit-group/unit chain does not import secondary density/item mass, performance or inventory. Disclose broad glass/film classification defects; actual providers remain normal collection gaps."
      evidence: "native restrictions and supplier/state compatibility"
    - id: dq_services
      applies_to: "all inventory rows"
      requirement: "Publish manufacture and observed same-cohort post-release services separately, with interval/completeness. Audit original-dispatch/return reversals, actual wet/dry repair and each package gross physical ledger. Future unobserved services are not lifetime-complete burdens."
      evidence: "cohort movement/service and package ledgers"
    - id: dq_synthesis
      applies_to: "all inventory rows"
      requirement: "Independent product/machine/method evidence is qualitative synthesis, not one factory/SKU/order. No default temperature, strength, certification, life, density, sheet weight, fixed ratio or catalog-rated consumption. Ordinary auxiliary UUID/provider gaps alone do not force draft methodology."
      evidence: "source-specific scope/counterevidence and data disclosures"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Require actual narrower covered terminal and all qualifiers, with no safety claim. Reject heat-treated, laminated, coated, mirrored, insulating or merely repacked finished sheets under this route."
    source_ids:
      - unsd-cpc-2025
      - vitro-heat-treatment-td124
      - oneday-annealed
      - oneday-edgework
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Finished row is1kg dry bare first-release glass using Mass/kg. Every other row collects raw protocol amounts and references calc_reference x_i once after unit conversion/history/allocation. Q=0 yields no unit result. Count/native secondary coefficients do not establish net mass or density."
    source_ids:
      - ilcd-general-2010
  - rule_id: validate_route
    applies_to: "all operations"
    rule: "Confirm received stock, score/breakout, wet edge grind/polish, actual liquid preparation, wash/dry, edge/dimensional release and every real utility/residue/species. Include failure/idle/cleanup/returns; no evidence is not absence."
    source_ids:
      - vitro-scoring-td119
      - bovone-glass-2024
  - rule_id: validate_ledgers
    applies_to: "all balances"
    rule: "Close separate manufacture, FG-service and combined physical wet/dry/water/element and per-exchange history ledgers, including installed tool/fluid/asset stocks, actual repair additions/removals and each package. Manufacture closing excludes first-released FG; its B_i^Q includes that FG. Combined gates cancel internal Q/B_i^Q rather than counting release, closing FG and dispatch as separate products. Keep original Q for service increments and preserve gross dispatch/returns. Do not duplicate slurry carrier water, tool wear, cake water or overlapping particle measures."
    source_ids:
      - ilcd-general-2010
      - bovone-glass-2024
  - rule_id: validate_allocation
    applies_to: "all allocated exchanges"
    rule: "Show actual/virtual subdivision, exchange-specific determining physical causality, then only justified residual common-gate/state-matched contemporaneous market value. No fixed ratio, free choice, automatic scrap credit or invented price."
    source_ids:
      - ilcd-general-2010
  - rule_id: validate_evidence
    applies_to: "all datasets"
    rule: "Binding requires real native restrictions and exact property→unit group→reference unit. Keep concrete provider/auxiliary gaps explicit. Unknown core terminal/route, stock history, measurement or physical closure remains a hold. Engineering checks are not science, translation, mapping or publication approval."
    source_ids:
      - ilcd-general-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Upstream matching annealed edge-polished sheet input; retain manufacture and separately observed supply service vectors"
  allowed_use: "Actual uncoated monolithic unframed flat-edge-polished annealed sheets matching configuration/state, site/period/gate and native limitations"
  excluded_use: "Whole37114 coverage; safety/strength/certification claim; tempered, bent, drilled, laminated, coated, mirrored, insulating/framed products; finished-sheet repacking as manufacture; assumed lifetime service; automatic credits"
  required_metadata: "annealed soda-lime-silicate composition and clear/body-tinted state; uncoated monolithic unframed state; actual unworked float-stock supplier boundary and upstream dataset; measured net dry mass and dimensions; thickness/configuration distribution; machined flat polished edge and chamfer drawing; actual inspection and acceptance method; absence of heat strengthening and tempering; absence of laminate coating mirror insulating assembly bending holes and engraving; scoring and breakout route; wheel types and actual cerium supply/preparation route; water quality and each actual formulation; first-release Q gate and unique lot genealogy; period and site/geography; actual energy voltage and mix; WIP/FG and non-WIP tool/fluid exchange histories; each package and gross movement ledger; separately observed matched-cohort service interval and coverage"
  required_quality_disclosure: "Source scope/technical synthesis; native restrictions/provider gaps; complete raw/uncertainty evidence; actual causal assignment; WIP/FG/non-WIP charge vectors and physical balances; service interval/completeness; actual unknown holds"
  update_trigger: "Glass/finish/drawing/terminal or heat-safety route; formulation/particle form; wheel/wash/utility technology; supplier/energy mix; gate/stock history; emission/treatment or allocation change"
data_sources:
  - id: "unsd-cpc-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0 Explanatory Notes,30June2025, PDF p180. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context separating unworked, worked, safety and mirror/insulating glass."
  - id: "vitro-scoring-td119"
    type: "handbook"
    reference: "Vitro, TD-119 Guidelines for Glass Scoring and Breakout Quality, complete9-page publisher PDF incl pp4–8 counterexamples and table footnotes. https://www.vitroglazings.com/media/10hbno4i/tech_doc_119.pdf"
    used_for: "Wheel scoring/breakout, fluid, inspection, replacement and defects; no universal settings, strength, yield or energy."
  - id: "vitro-heat-treatment-td124"
    type: "handbook"
    reference: "Vitro, TD-124 Fabrication of Heat Treated Glass, revision1,2016-10-04, complete2-page publisher PDF. https://www.vitroglazings.com/media/rocj2kmu/tech_doc_124.pdf"
    used_for: "Counterevidence: post-heat-treatment fabrication restrictions, no polished tempered/annealed substitution."
  - id: "bovone-glass-2024"
    type: "handbook"
    reference: "Bovone, Glass Division2024, complete publisher PDF; PDF pp4–6 (printed6–11) edging/wheels/Companion and PDF p9 (printed16–17) washing; lamination/coating elsewhere. https://bovone.com/wp-content/uploads/2024/09/Cat_glass2024.pdf"
    used_for: "Qualitative grinding/polishing, metal/resin/felt wheels and coolant/ceria removal/wash synthesis. Catalog ratings are not actual consumption, common factory/SKU or terminal certification."
  - id: "rig-fabrication"
    type: "handbook"
    reference: "Rochester Insulated Glass, Glass Fabrication, whole publisher HTML snapshot2026-10-20; edgework plus adjacent hole/notch text. https://rochesterinsulatedglass.com/fabrication/"
    used_for: "Annealed polished-edge availability, qualified by conflicting sharp-edge wording and heat-treatment preference for holes/notches; no general drilling or end-use approval."
  - id: "oneday-annealed"
    type: "handbook"
    reference: "One Day Glass / Peninsula Glass, Annealed Glass, whole publisher HTML snapshot2026-10-20. https://www.onedayglass.com/types-of-glass/annealed-glass/"
    used_for: "Actual annealed supply, cabinet/furniture-covering examples and non-safety breakage caveats; no density, mass, load or suitability default."
  - id: "oneday-edgework"
    type: "handbook"
    reference: "One Day Glass / Peninsula Glass, Custom Glass Edgework, whole publisher HTML snapshot2026-10-20. https://www.onedayglass.com/capabilities/custom-edgework/"
    used_for: "Machined flat-polished edges with small chamfers as supply option, distinct from ground/seamed/bevel; combined technical synthesis, not a verified current order."
  - id: "syracuse-edgework-2012"
    type: "handbook"
    reference: "Syracuse Glass, Glass Edgework Options,2012-04-24 Rev1, whole2-page publisher PDF. https://syracuseglass.com/E-DOCS/general/EDOCS/Glass%20Edgework%20Options.pdf"
    used_for: "Independent polished-edge geometry and clean-cut/ground/seamed counterexamples; historical guidance only, no current ASTM conformity or numerical tolerance adopted."
  - id: "ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD General guide for LCA Detailed guidance, first edition March2010, §§7.9.2–7.9.3, PDF pp275–288 (printed255–268). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation cases: subdivision, exchange-specific determining physical causality, residual common-gate state-matched market value. No fixed shares, free choice, automatic substitution or whole-handbook conformity."
