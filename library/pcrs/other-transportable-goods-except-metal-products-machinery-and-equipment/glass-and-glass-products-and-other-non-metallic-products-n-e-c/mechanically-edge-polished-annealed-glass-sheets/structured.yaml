allocation_rules:
  - rule_id: allocation_first
    applies_to: "all allocated exchanges"
    rule: "Only attributional cases requiring allocation use this hierarchy. First dedicate/submeter operations or defensibly virtually subdivide, assigning exchanges exclusively caused by a product. Then identify the determining physical causality of each remaining exchange, not merely a correlated physical property."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_drivers
    applies_to: "manufacture; supply_services"
    rule: "Test edging/cutting electricity against actual machine time, edge length and removal work by configuration; wash against actual area/flow/time; storage/handling against occupied space-time or moves. These are candidate exchange-specific drivers, not fixed ratios. Do not allocate all burdens automatically by glass mass, area or gross dispatch."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_residual
    applies_to: "residual common process"
    rule: "Only after explaining why actual/virtual subdivision and exchange-specific determining physical causality leave a residual, use contemporaneous market value at the same common-process exit and actual quality, moisture, packaging and amount state. Remove downstream conditioning/transport/packing margins. Keep amounts, prices, dates and sensitivity; absent causal/value evidence stays unresolved. There is no free physical/economic choice."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_scrap
    applies_to: "offcut; residues; packages"
    rule: "Distinguish real marketable coproducts, external recycling materials and wastes. Retain losses and handling/treatment burdens. Reused internal offcuts retain original exchange vectors. External sale/disposal uses real state/value and treatment boundary; scrap sales, rack/water returns and reuse create no automatic virgin-glass or avoided-treatment credit."
    source_ids:
      - ilcd-general-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
