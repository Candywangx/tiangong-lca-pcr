      collection_method: "Trace each released sheet through storage/dispatch/returns; measure true cohort service increments and wet/dry repair changes; keep opening-FG cohort apart; no newQ Aggregation method: Sum undivided raw quantities per actual exchange/cohort; convert units and reconcile histories/physical ledgers then perform actual allocation; calc_reference alone yields per reference flow. Never divide raw collection or normalized x_i again."
