          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual receipt of a burden-bearing whole prepared natural marble slab |\n| starting_condition_role | foreground_collection_start |\n| product_classification_scope | Natural marble countertop panel from supplied whole prepared slab |\n| recursive_input_rule | Record same-category purchased worked slab once at actual supply state with complete upstream dataset; no burden-free recursion or self-referencing site output loop. |\n| upstream_dataset_requirement | Quarry through real slab sawing/treatment/transport; one owner for all supplier-included matter and packing |\n| disclosure | actual site and collection period; natural marble lithology and mineral structure; supplier and whole prepared-slab lot; measured outline and thickness configuration; actual net single-face projected area and hole status; face and edge finish; supplied resin/filler/mesh/rod/wax/coating and burden owner; actual fabricator preparation identities and treatment stages; moisture and independent composition evidence; permitted repair and postwork acceptance; unique first-quality-release gate; cohort Q and WIP burden vectors; energy interface and provider; water source and loop; phase/species/receiving medium; actual waste treatment; packaging six legs; post-release horizon H and original cohort Qc; allocation and uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_supply | fabrication | Start at actual receipt of a whole prepared natural marble slab, never at a purchased already-shaped finished countertop with only repacking. Disclose supplier quarry extraction, block/slab sawing, face preparation, drying, filling/resin/mesh/wax/coating and transport in a complete upstream dataset. Supplier treatment is not free, and physical packaging still enters. If integrating a block-to-slab operation, establish and inventory that complete distinct route before using this method; do not silently splice primary sites. | jrc-hard-coverings-2018; ksa-stone-manual-2021 |\n| boundary_terminal | finished_panel | Attributional LCA methodology for one-piece natural marble countertop panels produced from a burden-bearing whole prepared slab by real inspection/template layout, wet sawing or abrasive-waterjet cutting, sizing, actual core-drilled holes/CNC cutouts, edge profiling, grinding/polishing, cleaning and inspection through unique first factory quality release. Face finish may already be supplied; record actual face reworking rather than assuming a second face-polishing line. Include actual compatible epoxy filling/reinforcement and aqueous impregnator treatment when performed, and all upstream supplier treatments retained in the slab. This is a transparent technical synthesis of distinct sources, not one factory, SKU or order. The declared endpoint can retain explicitly deferred site cutouts only when fully disclosed and appropriate to that purchased panel; never describe a blank as a completed holed panel. Exclusions: Setts; curbstones; flagstones; tiles; cubes and similar paving/tile articles; coloured granules/chippings/powder; raw quarry block as reference; travertine and alabaster variants not established here; granite/sandstone/slate/other lithology; resin-agglomerated engineered stone; ceramic/porcelain/sintered stone; cement artificial stone; multi-panel countertop assembly; cabinets; attached sink/appliance; installation; whole building/kitchen and use-life performance. | jrc-hard-coverings-2018; ksa-stone-manual-2021; greatlakes-fabrication |\n| boundary_complete | all exchanges | Every real purchased preparation/article is recorded whole once; composition, assay and carrier water are subaccounts. Actual in-house formulation instead records every purchased ingredient plus mixing energy, loss and emission. Split every additional actual chemical, fuel, lubricant, tool, package, waste and species into a named atomic card before releasing a dataset; conditional absence needs records and is never a concealed unknown zero. The listed aqueous impregnation example does not cover solvent coatings or polyester/acrylic resin recipes. Obtain source/supplier evidence and full individual exchanges for such actual variants. | jrc-hard-coverings-2018; ksa-stone-manual-2021 |\n| boundary_release | fabrication | Q is measured net complete-panel mass at unique first quality release in the defined cohort, including supplied retained constituents and manufacturing additions, excluding removable packs. All failed, zero-output, startup, shutdown, idle, cleanup, rejected and sampled material burdens remain. For each exchange component, carry opening raw/WIP burden vector Bopen and deduct only closing raw/WIP or genuinely unused/unassigned non-WIP charge/service Bclose once; no closing released FG manufacturing deduction, because that panel has already entered Q. Do not count Q and the same closing FG again as two product outputs. Ordinary offcut/waste/scrap sale or transfer does not authorize burden removal. Keep separate full physical quantities and EVERY exchange-history vector for each raw/WIP/non-WIP stock, including packaging, assets, installed tools/parts/fluids; never stock-correct already-net consumption twice. Ledger-only FG/package/waste/asset/actual thermal-carrier gross legs display V_i/Q or original Qc once, wholly separately from A, A_service and inherited manufacture/service vectors. Do not change gross legs using Bopen+U-Bclose, economic shares or old manufacture additions, or add another purchase/treatment charge/credit. Manufacturing thermal-carrier incoming/return mass and actual enthalpy use V/Q; only actual postrelease service divides once by original Qc; record observed horizon H separately, not as an additional divisor. Steam/heat MJ/mass has one supplier scope and one burden owner; actual returns create no duplicate negative water/heat. Original dispatch and changed wet return are independent; cancel internal FG transfer once at consolidation, with no second Q. Retain actually performed service on original Qc over the observed horizon H even for retained FG; record H separately and do not use it as an additional divisor; gross flows and single-Qc normalization never remove those burdens. | ilcd-detailed-2010; ksa-stone-manual-2021 |\n| boundary_service | postrelease | Record real post-release packing, storage, handling and dispatch increments against original cohort Qc over actual observed horizon H, including its closing retained FG. Performed service does not become unused merely because FG remains stored; carry only genuinely unused/unassigned charge/service. Keep original manufacturing burden vectors in the FG ledger for history, not a second manufacturing charge. In consolidation cancel the internal first-release product transfer once and add performed service once. Returns, redelivery, reinspection and permitted incremental repair never make new Q; link original identity, gross outward/return legs and actual added inputs/losses. Net delivery is not this denominator; adopting it needs a separate complete opening/closing FG burden and gross G/R plus original-delivery reversal D_rev bridge. Keep separate full physical quantities and EVERY exchange-history vector for each raw/WIP/non-WIP stock, including packaging, assets, installed tools/parts/fluids; never stock-correct already-net consumption twice. Ledger-only FG/package/waste/asset/actual thermal-carrier gross legs display V_i/Q or original Qc once, wholly separately from A, A_service and inherited manufacture/service vectors. Do not change gross legs using Bopen+U-Bclose, economic shares or old manufacture additions, or add another purchase/treatment charge/credit. Manufacturing thermal-carrier incoming/return mass and actual enthalpy use V/Q; only actual postrelease service divides once by original Qc; record observed horizon H separately, not as an additional divisor. Steam/heat MJ/mass has one supplier scope and one burden owner; actual returns create no duplicate negative water/heat. Original dispatch and changed wet return are independent; cancel internal FG transfer once at consolidation, with no second Q. Retain actually performed service on original Qc over the observed horizon H even for retained FG; record H separately and do not use it as an additional divisor; gross flows and single-Qc normalization never remove those burdens. | ilcd-detailed-2010; ksa-stone-manual-2021 |\n| boundary_physical | all physical gates | For fabrication, FG service and consolidation, preserve all gross physical legs without allocation-share scaling. Reconcile full wet opening stocks + external gross receipts + independently evidenced species/reaction/phase transfers = full wet closing stocks + gross external output/removal for each actual material, phase and relevant element. In the fabrication gate Q is physical first-release output; in the combined gate it is internal and cancels, leaving actual dispatch/returns and full FG stocks. Reconcile water in slab/preparations, WIP, FG, cake, cloth, tools, oil and wastewater separately. Structural water, free liquid, vapour and mist require independent evidence; mechanical marble cutting does not establish calcination CO2. One residual cannot solve two unknown species or moisture terms. COD/VOC/PM/total silica indicators are not specific chemical mass. Keep separate full physical quantities and EVERY exchange-history vector for each raw/WIP/non-WIP stock, including packaging, assets, installed tools/parts/fluids; never stock-correct already-net consumption twice. Ledger-only FG/package/waste/asset/actual thermal-carrier gross legs display V_i/Q or original Qc once, wholly separately from A, A_service and inherited manufacture/service vectors. Do not change gross legs using Bopen+U-Bclose, economic shares or old manufacture additions, or add another purchase/treatment charge/credit. Manufacturing thermal-carrier incoming/return mass and actual enthalpy use V/Q; only actual postrelease service divides once by original Qc; record observed horizon H separately, not as an additional divisor. Steam/heat MJ/mass has one supplier scope and one burden owner; actual returns create no duplicate negative water/heat. Original dispatch and changed wet return are independent; cancel internal FG transfer once at consolidation, with no second Q. Retain actually performed service on original Qc over the observed horizon H even for retained FG; record H separately and do not use it as an additional divisor; gross flows and single-Qc normalization never remove those burdens. | ilcd-detailed-2010; jrc-hard-coverings-2018 |\n| boundary_waterloop | makeup_water; wastewater; wet_cake | Map actual slurry sump, settling/filter press, filtrate return, fresh makeup, evaporation, carry-out, spills, cleaning and purge with real meters/stocktakes. Internal loop transfers cancel and are not new tap-water purchases. Whole external wastewater/cake transfer includes all carried water/solids once; composition subaccounts are not parallel emissions. On-site treatment consumes actual named inputs and energy and generates real cake plus individually identified releases to their real media. No generic recycling percentage, water consumption residual, steam/boiler, heat-exchanger water return or condensate is assumed. If a real external thermal carrier/return exists, add its physical mass, actual state/enthalpy and supplier energy/water ownership agreement distinctly. | jrc-hard-coverings-2018; ksa-stone-manual-2021 |\n| boundary_packaging | all packaging | For each actual packaging material/article keep opening empty + attached-to-WIP/FG + reusable stock, and six external legs P (paid procurement receipts (standalone or bundled)), I (first non-purchased external ingress), ER (external returns received), S (with gross physical shipments), EO (external outward returns) and W (waste). Opening + P + I + ER + X_in = closing + S + EO + W + X_out. Closing includes full empty/attached/reusable wet material. Internal reuse cancels and is neither a new purchase, Q nor automatic coproduct. Record both real new influx and full closing wet stock even when that influx remains in closing. P/I whole-article composition and packaging/repair-water X_in/X_out deduplicate only against other incoming/outgoing terms, never erase an influx against its closing stock. Burden ownership/service allocation is separate from this full physical account. X includes only independently measured actual separately added/removed water/material not already in OTHER flow terms on the SAME side. Never deduplicate opening/closing stocks, opposite-side legs or merely because a card exists. Whole wet P/I contains its constituents once; separate retained additions keep real X_in AND full wet closing. Cover ordinary storage/handling humidity uptake, evaporation, cleaning and actual repair; presume no repair, wood species, dry state, water use or unknown zero. Each actual packaging pool needs actual six-direction cards or independently measured source subledgers. If pallets/crates/removed repair wood are actually collected as ONE external mixed wood-waste stream, use waste_pack_wood as ONE Waste exchange with ONE treatment provider; independently measure each origin W in its protocol and require their sum to equal the total, without adding waste_pack_pallet. When separately collected, each card records disjoint actual events only; crate total and pallet stream cannot overlap. | ilcd-detailed-2010; jrc-hard-coverings-2018 |\n| boundary_repair | all repair | Actual pre- or post-release repair requires manufacturer/specification permission for the structural location/material, actual additional resin/hardener/mesh/rod/tooling/energy/water and losses, postwork tests, acceptance and final disposition. Natural fissure is not the same as handling-induced crack; do not assume broken panels regain acceptability. Unsuccessful repair/replacement and its treatment remain in the proper original/new cohort once. Exclude installation and in-use repair from the factory horizon. Permission/specification, postwork tests, acceptance and disposition determine authorization and continuing product qualification ONLY. They never erase all actual unauthorized, unsuccessful, rework/replacement material, water, energy, loss or treatment burdens; assign them once to the real original/new cohort. Independently measure actual new/old parts/wood and liquid water/humidity/vapour, with specific atomic rows and one event owner before dataset completion. Held FG versus a distinct repair-WIP stock must use disjoint physical/vector boundaries, never both; do not assume broken stone is restored. | ksa-stone-manual-2021 |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | ilcd-detailed-2010 |\n\n"
