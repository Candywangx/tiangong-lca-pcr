allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all burdens"
    rule: "Only attributional cases that require allocation are covered. First independently assign exclusive supplies, operations, meters, failure/rework and service to their actual function/cohort; use real or virtual subdivision before allocation. Explain why any remaining multifunctional unit cannot be subdivided. Physical gross material accounts never use burden fractions."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange identify a determining physical causal relationship supported by that operation and its service intensity; do not choose mass, area, count or price arbitrarily or apply one key to everything. For example cut-to-shape effort may be caused by the panel rather than by the incidental sale of its offcuts. A content assay can assign embodied matter but cannot alone allocate all sawing energy and waste treatment. Preserve failures/loss burdens."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_residual
    applies_to: "irreducible residual burden"
    rule: "Only genuinely remaining common-process burdens use contemporaneous market values in the real state, quantity and common process gate, with downstream conditioning/transport/packing stripped from later prices. Document data, uncertainty and sensitivity, never fixed ratios or automatic waste/energy credit. A transfer vector Tother may leave the product account only for a real independent other cohort/function with a justified allocation/handover and one receiving owner; ordinary manufacturing rejects, samples, treatment and sold waste are not Tother by their destination alone."
    source_ids:
      - ilcd-detailed-2010
