  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "x_j = independent raw total times verified same-property unit factor; only true rates are integrated over actual intervals. Preserve native raw units; deduplicate same events/whole-preparation components/internal recirculation once, never eliminate a real influx against its stock."
      inputs:
        - raw_event
        - unit_factor
        - actual_interval
      output: "x_j"
      source_ids:
        - ilcd-detailed-2010
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "For each exchange vector A = Bopen + actual current burdens - Bclose - Tother. First exclusive/virtual subdivision, then exchange-specific physical causality, lastly genuine residual common-gate contemporaneous values. Bclose covers only unreleased raw/WIP and genuinely unused/unassigned service/charge; never deduct released FG or ordinary waste, failures, samples/sold waste burdens. Do not deduct stock-corrected consumption twice. Keep separate full physical quantities and EVERY exchange-history vector for each raw/WIP/non-WIP stock, including packaging, assets, installed tools/parts/fluids; never stock-correct already-net consumption twice. Ledger-only FG/package/waste/asset/actual thermal-carrier gross legs display V_i/Q or original Qc once, wholly separately from A, A_service and inherited manufacture/service vectors. Do not change gross legs using Bopen+U-Bclose, economic shares or old manufacture additions, or add another purchase/treatment charge/credit. Manufacturing thermal-carrier incoming/return mass and actual enthalpy use V/Q; only actual postrelease service divides once by original Qc; record observed horizon H separately, not as an additional divisor. Steam/heat MJ/mass has one supplier scope and one burden owner; actual returns create no duplicate negative water/heat. Original dispatch and changed wet return are independent; cancel internal FG transfer once at consolidation, with no second Q. Retain actually performed service on original Qc over the observed horizon H even for retained FG; record H separately and do not use it as an additional divisor; gross flows and single-Qc normalization never remove those burdens."
      inputs:
        - x_j
        - Bopen
        - Bclose
        - Tother
        - allocation_evidence
      output: "A"
      source_ids:
        - ilcd-detailed-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "Unit result = A / Q, or service unit result = A_service / original Qc; execute each once only. Q is the sum of unique first-release measured net masses from cp_finished_panel; service is bound to original cohort/H. Q=0 preserves burden and produces no unit result. Keep separate full physical quantities and EVERY exchange-history vector for each raw/WIP/non-WIP stock, including packaging, assets, installed tools/parts/fluids; never stock-correct already-net consumption twice. Ledger-only FG/package/waste/asset/actual thermal-carrier gross legs display V_i/Q or original Qc once, wholly separately from A, A_service and inherited manufacture/service vectors. Do not change gross legs using Bopen+U-Bclose, economic shares or old manufacture additions, or add another purchase/treatment charge/credit. Manufacturing thermal-carrier incoming/return mass and actual enthalpy use V/Q; only actual postrelease service divides once by original Qc; record observed horizon H separately, not as an additional divisor. Steam/heat MJ/mass has one supplier scope and one burden owner; actual returns create no duplicate negative water/heat. Original dispatch and changed wet return are independent; cancel internal FG transfer once at consolidation, with no second Q. Retain actually performed service on original Qc over the observed horizon H even for retained FG; record H separately and do not use it as an additional divisor; gross flows and single-Qc normalization never remove those burdens."
      inputs:
        - A
        - Q
        - A_service
        - Qc
        - H
        - cp_finished_panel
      output: "unit_result"
      source_ids:
        - ilcd-detailed-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "For each actual wet material/phase/species/relevant element: opening + external gross receipts + independently evidenced transfers = full closing + external gross outputs. Manufacturing Q is unique physical first-release output; consolidated Q cancels internally, leaving full historical FG stocks and actual dispatch/returns. Burden allocation never changes gross physical legs. Keep separate full physical quantities and EVERY exchange-history vector for each raw/WIP/non-WIP stock, including packaging, assets, installed tools/parts/fluids; never stock-correct already-net consumption twice. Ledger-only FG/package/waste/asset/actual thermal-carrier gross legs display V_i/Q or original Qc once, wholly separately from A, A_service and inherited manufacture/service vectors. Do not change gross legs using Bopen+U-Bclose, economic shares or old manufacture additions, or add another purchase/treatment charge/credit. Manufacturing thermal-carrier incoming/return mass and actual enthalpy use V/Q; only actual postrelease service divides once by original Qc; record observed horizon H separately, not as an additional divisor. Steam/heat MJ/mass has one supplier scope and one burden owner; actual returns create no duplicate negative water/heat. Original dispatch and changed wet return are independent; cancel internal FG transfer once at consolidation, with no second Q. Retain actually performed service on original Qc over the observed horizon H even for retained FG; record H separately and do not use it as an additional divisor; gross flows and single-Qc normalization never remove those burdens."
      inputs:
        - physical_opening
        - gross_in
        - species_transfer
        - physical_closing
        - gross_out
      output: "physical_residual"
      source_ids:
        - ilcd-detailed-2010
    - id: calc_packaging
      applies_to: "all packaging"
      rule: "For each packaging material: opening empty/attached WIPFG/reusable + P + I + ER + X_in = full wet closing + S + EO + W + X_out. Cancel internal reuse. Packaging/repair-water X_in/X_out deduplicate only other incoming/outgoing terms; new material retained at closing keeps both its real influx and full closing mass. X includes only independently measured actual separately added/removed water/material not already in OTHER flow terms on the SAME side. Never deduplicate opening/closing stocks, opposite-side legs or merely because a card exists. Whole wet P/I contains its constituents once; separate retained additions keep real X_in AND full wet closing. Cover ordinary storage/handling humidity uptake, evaporation, cleaning and actual repair; presume no repair, wood species, dry state, water use or unknown zero. Each actual packaging pool needs actual six-direction cards or independently measured source subledgers. If pallets/crates/removed repair wood are actually collected as ONE external mixed wood-waste stream, use waste_pack_wood as ONE Waste exchange with ONE treatment provider; independently measure each origin W in its protocol and require their sum to equal the total, without adding waste_pack_pallet. When separately collected, each card records disjoint actual events only; crate total and pallet stream cannot overlap."
      inputs:
        - opening_pack
        - P
        - I
        - ER
        - closing_pack
        - S
        - EO
        - W
        - X_in
        - X_out
      output: "packaging_residual"
      source_ids:
        - ilcd-detailed-2010
        - jrc-hard-coverings-2018
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify complete card material/form/route/medium/type and all native properties; match provider datasets to actual supply, never infer factory/recipe from generic UUID."
      evidence: "complete supplier evidence; composition; specification; native conditions"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Cover complete actual cohort and seasonal/downtime scope, retaining failure/zero output; service retains original cohort and real H."
      evidence: "event ledger; production schedule; WIP and FG history"
    - id: dq_quantity
      applies_to: "all inventory rows"
      requirement: "Calibrate each property, same-configuration geometry/mass conversion, independent dry/wet/species measurements; underdetermined unknowns stay unresolved. No invented ranges, density, yield, machine mass or life."
      evidence: "calibration; drawings; weighing; laboratory phase/element evidence; residuals/sensitivity"
    - id: dq_sources
      applies_to: "all rules"
      requirement: "Trace sources/source_ids to complete relevant context; one case is not an industry range, repeated citations are not independent sources."
      evidence: "complete sources; applicability statement; data gaps and uncertainty"
validation_rules:
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Confirm whole natural marble lithology/structure and finished panel state using supplier evidence and native full identity context, not classification or basename alone. All declared qualifiers must accompany reference and inventory context. UUID availability for auxiliary materials/providers does not establish their suitability, and unresolved auxiliary identities remain explicit."
    source_ids:
      - ilcd-detailed-2010
      - jrc-hard-coverings-2018
      - ksa-stone-manual-2021
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Check first-release Q, unique row linkage, native property units, same-configuration conversions, raw event deduplication, all flow-wise opening/closing inherited burden vectors and the single A/Q normalization. Q=0 retains actual burden and produces no unit result. Unsupported actual relationships, missing measurements or incomplete speciation are unresolved findings, never a claimed pass or fabricated zero."
    source_ids:
      - ilcd-detailed-2010
      - jrc-hard-coverings-2018
      - ksa-stone-manual-2021
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Independently reconcile full physical mass, relevant elements, separate real species/phases/water and actual energy at fabrication, service and combined gates; do not shrink gross legs by allocated burden. Validate each packaging six-leg identity and repair-water deduplication, including new receipts retained at closing. Reject unclosed or underdetermined balances."
    source_ids:
      - ilcd-detailed-2010
      - jrc-hard-coverings-2018
      - ksa-stone-manual-2021
  - rule_id: validate_sources
    applies_to: "all inventory rows"
    rule: "Trace every source-supported requirement and calculation to complete relevant source context and its limitations. JRC is a preliminary report, some countertop examples concern granite, and AKEMI is only a compatible preparation example. No source supplies this factory recipe, performance, density, yield, safety certification or life. Translation alignment and engineering checks do not approve science, mapping or publication."
    source_ids:
      - ilcd-detailed-2010
      - jrc-hard-coverings-2018
      - ksa-stone-manual-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Upstream material data for same declared one-piece marble panel configuration/gate; installer adds real installation service separately"
  allowed_use: "Attributional modelling with traceable applicability, supply burdens, Q and independent service H"
  excluded_use: "Setts; curbstones; flagstones; tiles; cubes and similar paving/tile articles; coloured granules/chippings/powder; raw quarry block as reference; travertine and alabaster variants not established here; granite/sandstone/slate/other lithology; resin-agglomerated engineered stone; ceramic/porcelain/sintered stone; cement artificial stone; multi-panel countertop assembly; cabinets; attached sink/appliance; installation; whole building/kitchen and use-life performance."
  required_metadata: "actual site and collection period; natural marble lithology and mineral structure; supplier and whole prepared-slab lot; measured outline and thickness configuration; actual net single-face projected area and hole status; face and edge finish; supplied resin/filler/mesh/rod/wax/coating and burden owner; actual fabricator preparation identities and treatment stages; moisture and independent composition evidence; permitted repair and postwork acceptance; unique first-quality-release gate; cohort Q and WIP burden vectors; energy interface and provider; water source and loop; phase/species/receiving medium; actual waste treatment; packaging six legs; post-release horizon H and original cohort Qc; allocation and uncertainty"
  required_quality_disclosure: "completeness; actual missing data and UUID/provider gaps; no industry quantity ranges; original evidence; allocation/boundary sensitivity; no scientific or translation review approval"
  update_trigger: "Actual material/treatment/supply/gate change; preparation/native restriction change; Q/FG policy change; new measurement evidence"
data_sources:
  - id: "jrc-hard-coverings-2018"
    type: "official_guidance"
    reference: "European Commission JRC. Revision of European Ecolabel Criteria for hard coverings products. Preliminary report, November 2018. https://susproc.jrc.ec.europa.eu/product-bureau/sites/default/files/contentype/product_group_documents/1581681927/PR_v1-0_14-11-2018.pdf"
    used_for: "§§2.4.1–2.4.2 and 2.6: whole natural stone slab routes, treatments, packaging, water loops and countertop operations; granite examples are not marble factors."
  - id: "ksa-stone-manual-2021"
    type: "handbook"
    reference: "Kitchen Specialists Association. Fabrication and installation of stone countertops, 2021 file edition. https://www.ksa.co.za/downloads/KSA_StoneManual_2021.pdf"
    used_for: "Natural marble versus engineered/ceramic surfacing; edge profiles/cutouts; resin-impregnated slabs, reinforcement, conditional repair and sealer limitations, printed pp.2–3,10–11,15–19. No operating parameters/performance thresholds adopted."
  - id: "park-marble-2025"
    type: "handbook"
    reference: "Park Industries. How to Cut Marble Countertops & Slabs, 1 October 2025. https://www.parkindustries.com/blog/how-to-cut-marble-countertops-slabs/"
    used_for: "Primary machine-maker evidence for real natural-marble wet diamond cutting, CNC profiling and hole options; no machine weight, cutting settings, yield or performance claim used."
  - id: "greatlakes-fabrication"
    type: "handbook"
    reference: "Great Lakes Granite & Marble. The Countertop Fabrication Process, retained complete page. https://www.greatlakesgm.com/education/countertop-fabrication-process/"
    used_for: "Fabricator context for slab inspection/templates, CNC and quality inspection; granite strengthening/polishing/sealing examples are conditional and not transferred quantitatively to marble. Partly reproduced by JRC; not independent numerical evidence."
  - id: "akemi-natura-2026"
    type: "handbook"
    reference: "AKEMI. NATURA Impregnator Technical Data Sheet, TDS 09.26, all three pages. https://stein.akemi.de/fileadmin/user_upload/products/productdocuments/TMB/Natura_Impregnator_TMB_GB.pdf"
    used_for: "Existence of a whole water-emulsified silane/siloxane preparation for compatible absorbent marble; full layer/absorbency/sample-test restrictions, excess removal and cleaning. No coverage/density/drying values or default suitability adopted."
  - id: "ilcd-detailed-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance, first edition March 2010, §§7.9.2–7.9.3. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation-required cases: subdivision/virtual subdivision, exchange-specific determining physical causality, remaining common-process gate-state market values and explicit service/burden ownership. Factory collection/balance equations below implement these principles; not source-reported marble measurements."
