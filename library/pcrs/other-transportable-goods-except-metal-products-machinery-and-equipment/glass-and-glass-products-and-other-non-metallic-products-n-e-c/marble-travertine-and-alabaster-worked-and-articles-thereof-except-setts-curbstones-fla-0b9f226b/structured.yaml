      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_identity | all inventory rows | Confirm whole natural marble lithology/structure and finished panel state using supplier evidence and native full identity context, not classification or basename alone. All declared qualifiers must accompany reference and inventory context. UUID availability for auxiliary materials/providers does not establish their suitability, and unresolved auxiliary identities remain explicit. | ilcd-detailed-2010; jrc-hard-coverings-2018; ksa-stone-manual-2021 |\n| validate_quantity | all inventory rows | Check first-release Q, unique row linkage, native property units, same-configuration conversions, raw event deduplication, all flow-wise opening/closing inherited burden vectors and the single A/Q normalization. Q=0 retains actual burden and produces no unit result. Unsupported actual relationships, missing measurements or incomplete speciation are unresolved findings, never a claimed pass or fabricated zero. | ilcd-detailed-2010; jrc-hard-coverings-2018; ksa-stone-manual-2021 |\n| validate_balance | all inventory rows | Independently reconcile full physical mass, relevant elements, separate real species/phases/water and actual energy at fabrication, service and combined gates; do not shrink gross legs by allocated burden. Validate each packaging six-leg identity and repair-water deduplication, including new receipts retained at closing. Reject unclosed or underdetermined balances. | ilcd-detailed-2010; jrc-hard-coverings-2018; ksa-stone-manual-2021 |\n| validate_sources | all inventory rows | Trace every source-supported requirement and calculation to complete relevant source context and its limitations. JRC is a preliminary report, some countertop examples concern granite, and AKEMI is only a compatible preparation example. No source supplies this factory recipe, performance, density, yield, safety certification or life. Translation alignment and engineering checks do not approve science, mapping or publication. | ilcd-detailed-2010; jrc-hard-coverings-2018; ksa-stone-manual-2021 |\n\n"
