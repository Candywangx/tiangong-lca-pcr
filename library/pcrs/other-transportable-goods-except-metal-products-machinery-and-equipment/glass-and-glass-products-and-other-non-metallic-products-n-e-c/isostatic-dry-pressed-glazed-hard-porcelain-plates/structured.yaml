system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Only the declared undecorated glazed hard-porcelain plate design/grade and isostatic dry-press/two-firing route are applicable. Begin with whole supplied unfired raw ingredients and include all actual receipt/transport, wet milling, mixing, screening/iron removal, spray drying, isostatic pressing, edge dressing/pre-drying, biscuit firing, onsite glaze preparation/application/foot cleaning, glost firing/cooling, foot grinding/polishing, sorting/tests and controls to unique first release. Purchased granulate or fired plates cannot replace this declared route."
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
    - rule_id: b_supply
      applies_to: "all inputs"
      rule: "Record each full supplied formulation once; constituent assays/carrier water are child ledgers. Onsite formulation records each bought ingredient plus actual water/energy/emissions/losses. Actual ingredients/cleaners/refrigerants/control chemicals not named here require a specific added atomic exchange; no other/zero bundle conceals them."
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
    - rule_id: b_cohort
      applies_to: "manufacturing burden"
      rule: "Preserve failed and zero-output runs, startup/shutdown, idle/hot hold, cleanup and pre-release rework/refiring. Carry each exchange inherited opening/closing raw, WIP and unassigned non-WIP-store burden vector. Closing already-released FG is already in Q: neither subtract its manufacture burden nor add it again as production. Internal loops cancel once while real reprocessing remains."
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
    - rule_id: b_service
      applies_to: "post-release services"
      rule: "Keep original manufacture with each unique released cohort. Separately collect actual packing, FG storage, handling, dispatch, external returns, cleaning/retest/rework and losses by original cohort Qc and observed horizon H; no later movement creates Q. Physical gross shipments/returns have independent states/masses. Consolidation cancels the internal released-plate handoff and retains external movements."
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
    - rule_id: b_physical
      applies_to: "manufacture service combined"
      rule: "Reconcile full wet/dry physical mass and relevant elements separately at manufacture, FG-service and consolidated gates, including all gas constituents, free/structural/reaction water, oxygen uptake, carrier Product returns, WIP, FG, waste and assets. Independent species evidence is separate from elemental closure; a residual cannot solve two unknowns. No gross air aggregate is added beside its constituents; no economic share reduces physical stocks or shipments."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_identity
      applies_to: "each bound exchange"
      rule: "All card restrictions are mandatory when using the suggested UUID. Verify complete native names, synonyms, comments, CAS, fixed grade/route/form/geography/media/type and every property. Compatible broad physical families require actual primary terminal qualifiers; isolated classification error is disclosed separately. A hard conflict needs a different identity; no core-reference workaround."
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
