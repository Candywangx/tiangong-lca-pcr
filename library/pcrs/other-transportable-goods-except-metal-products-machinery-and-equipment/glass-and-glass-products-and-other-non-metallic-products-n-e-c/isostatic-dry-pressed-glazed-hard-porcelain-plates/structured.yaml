allocation_rules:
  - rule_id: a_goal
    applies_to: "attributional inventory"
    rule: "Use this hierarchy only for the declared undecorated dry-pressed hard-porcelain plate manufacture and separately observed original-cohort services in a justified attributional study where allocation is required. First identify dedicated independent operations, physical subdivision and justified virtual subdivision; directly assign design-specific materials, shaping, grinding/tests and cohort services."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_cause
    applies_to: "each shared exchange"
    rule: "For each remaining exchange establish determining physical causality with independent actual operations. Kiln occupancy/time/heat capacity or load may matter differently for each exchange; simple measured mass/count/volume is not automatically causal. Failure, idle, cleanup and support loads remain assigned and documented."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "irreducible common process"
    rule: "Only genuine residual multifunctionality uses contemporaneous market value at one real common-process gate and actual state/quality/quantity, correcting further conditioning/packing/transport with evidence. Preserve nonpositive/unavailable value and unresolved attribution; no arbitrary physical/economic choice, fixed share, waste exemption or avoided-production credit. For each exchange the sum assigned to every co-function must equal the complete pre-allocation inventory, including failures and support loads. Different lower grades are not equal reference function."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_asset
    applies_to: "recovery packaging assets"
    rule: "Internal recovery is not new purchase or coproduct; retain actual recovery burdens and inherited vectors. Asset/mould/refractory/fluid and packaging gross physical balances remain unallocated. Period capital service uses actual deployment/use and supported inherited burden, without fixed lifetime, full machine per kg or automatic scrap credit. Recycling/recovery beyond this gate needs its own documented method and receiver."
    source_ids:
      - jrc-ilcd-allocation-2010
      - jrc-ceramic-bref-2007
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "unique first quality release"
      record_type: "raw_records"
      raw_fields: "unique piece/lot ID; design and grade; accepted net plate mass; release timestamp/status; calibrated scale; sampled count and same-configuration net mass; opening/closing raw WIP FG identities"
      collection_method: "Reconcile quality and production registers; calibrated net weighing of real released bare plates excludes all packaging. Q is the sum of first-release net kg once, including closing released FG; count is a separate measured ledger, not an assumed kg/item."
      unit: "kg; item"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each whole material/formulation"
      record_type: "raw_records"
      raw_fields: "row ID; batch/stage; supplier form and grade; whole supplied quantity; independent solids/assay/free structural water; recipe issue; opening/closing raw WIP non-WIP stores; each inherited burden vector; recovery and losses; operating mode; receipt_or_consumption_basis; already_applied_raw_stock_adjustment; consumed_opening_material_history"
      collection_method: "Use calibrated weigh/tank records and real issue/receipt/stock reconciliations with independent assays. Preserve unnormalised raw data for all successful/failed/cleanup/rework modes; whole bought formulations and measured child contents stay distinct."
      unit: "kg"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "each carrier and transport service"
      record_type: "raw_records"
      raw_fields: "row ID; meter integrated start/end or actual rate and interval; native unit; T P humidity; independent composition density calorific basis; steam dryness carrier mass inlet/return enthalpy; water-energy provider agreement; real loaded/empty freight legs; idle demand"
      collection_method: "Use stage meters and supply bills; integrate only rates, not already integrated volume. Establish substance/state-specific density and energy independently; preserve physical carrier mass beside energy without a duplicate provider. Onsite compressed-air electricity is not a purchased second air service."
      unit: "kg; m3; MJ; kWh; t km"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "individual tool asset and fluid"
      record_type: "raw_records"
      raw_fields: "asset/component ID; actual complete material/form fluid scope; opening/closing physical stock; new old repairs return retirement wear moisture and deposits; installed oil; actual deployment/usage; inherited embodied burden vectors; period service rule; gross_receipts_returns; measured_new_material_water; removed_old_material; independent_water_loss; parent_child_disjoint_scope"
      collection_method: "Balance each physical asset/component/fluid independently. Keep gross receipts/stocks/retirements separate from the documented current-period service inventory and actual usage attribution. Include repairs and new materials without duplicating a supplied complete asset or assuming fixed life."
      unit: "kg; m3; actual usage unit"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
    - protocol_id: cp_residue
      process_id: "manufacture"
      flow_role: "each external residue"
      record_type: "raw_records"
      raw_fields: "row ID; stage batch; wet mass; independent dry solids moisture chemical contamination; internal/external destination; receiver treatment; inherited burden; retained child species; stock transfers"
      collection_method: "Weigh and characterize every compatible stream separately with actual transfer/treatment notes. Internal treatment/recovery transfers cancel; do not duplicate whole waste/wastewater treatment and its contained direct releases."
      unit: "kg"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "each actual atmospheric species"
      record_type: "raw_records"
      raw_fields: "row ID; CAS and phase; source origin; dry wet basis; gas T P humidity O2 correction; real rate/time or totalised gas volume; species concentration; detection limits; control inlet/outlet; independent raw mineral phase carbonate organic composition; water and oxygen origins"
      collection_method: "Match species assays with gas quantity on the same actual state/period and boundary. Measure free/adsorbed water without silently including structural OH; use independently characterized mineral phases and validated evolved-gas H2O/CO2 analysis or equivalent to separate dehydroxylation/combustion/carbonate contributions. Keep equivalent indicators separately. Gross inlet and outlet air constituents close physically without adding an air aggregate."
      unit: "kg; measured concentration and gas volume"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "each actual direct water discharge"
      record_type: "raw_records"
      raw_fields: "row ID; actual receiver; integrated flow or real rate/time; state density; dissolved/suspended identity and detection limit; independent chemistry; separate whole offsite wastewater transfer"
      collection_method: "Match actual discharge sampling and water quantity. Record specific ions only with analytical evidence; total elements/COD/AOX do not identify a salt or molecule. Direct discharge and external treatment transfer are disjoint boundaries."
      unit: "kg; actual analytical units"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "each exact packaging material"
      record_type: "raw_records"
      raw_fields: "material/configuration ownership; opening/closing empty WIP-attached FG-attached reusable stock; new purchase P; external returned-in ER; gross physical shipped S; external returned-out EO; waste W; internal reuse; supplier-included glue/print; inherited burden; cohort Qc and H; supplier_attached_inbound_I; repair_material_Radd_Rremove; independently_measured_water_H2Oin_H2Oout; dry_wood; free_absorbed_water; actual_repair_identity_destination"
      collection_method: "Weigh each actual material/stock pool and trace receipts, gross dispatches and returns; empty/attached/reusable pools are disjoint and packaging-only. Keep whole supplied components and their children distinct. Assign actual incremental and inherited packaging burdens by original cohort without reducing gross physical quantities by economic shares. Explicitly retain I, independent repair additions/removals and water uptake/release. Water/material already in another measured flow direction is not duplicated, but closing retention never cancels a receipt. Add a specific atomic row for every additional actual repair material/water/removed outlet; unknown is not zero."
      unit: "kg"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "original cohort observed services"
      record_type: "raw_records"
      raw_fields: "original first-release cohort; original Qc net kg; manufacture burden vector; horizon H; opening/closing FG; gross G shipments and R returns with measured water contamination and losses; return/retest/rework increments; meters; physical residual; manufacturer_permission; body_glaze_compatibility; actual_rework_route; reacceptance; measured_new_material_water; removed_old_material; independent_mass_bridge"
      collection_method: "Collect actual incremental operations for the named cohort through observed H. Preserve original manufacture separately from new water/energy/materials/losses; returned plate mass need not equal its original delivered mass. No retest/re-delivery creates production; do not replace Qc by current manufacturing Q or net shipments. Rework applies only with actual manufacturer permission, body/glaze/mark compatibility, restoration to the original plate terminal and actual reacceptance; do not assume repairability, a pass or organic restoration. Incompatible adhesive/coating/decoration requires separate scope. Independently reconcile physical mass: actual opening+first-release receipt+returns+added material/water = closing+gross dispatch+destruction+removed old material+independent water loss+other actual exits. Terms are disjoint with species/phase checks and original Qc/H retained."
      unit: "kg; m3; MJ; t km"
      frequency: "each batch receipt interval and stock close"
      temporal_coverage: "declared representative period with inherited stocks and observed H"
      site_scope: "actual site design and traceable cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records independent assays and reconciliation"
  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw records to each own declared extensive unit and physical state before stock or allocation calculations. Integrate true rates once; use independent material/state density and calorific/enthalpy evidence. kWh to MJ uses 3.6. Whole formulations and carrier children remain disjoint; no secondary Flow factor supplies a density, chemistry or kg/item."
      inputs:
        - cp_material
        - cp_utility
        - cp_asset
        - cp_air
        - cp_water
        - cp_pack
        - cp_service
      output: "raw_native_totals"
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
    - id: manufacturing_stock
      applies_to: "manufacture"
      rule: "For each exchange j obtain attributable raw numerator A_j from inherited opening raw/WIP/unassigned non-WIP-store burden plus actual current operations after justified dedicated/subdivision/causal/residual attribution, less corresponding closing uncompleted raw/WIP/unassigned stores. Keep each vector and all failed/start-stop/idle/cleanup/rework loads. Do not subtract already-released closing FG, which is in Q. Internal recoveries cancel once; physical gross stocks are reconciled separately. Declare for each exchange whether its raw basis is gross receipts/occurrence or actual consumption already adjusted for stock. A net-consumption material reading is not corrected by the same raw-material stock a second time. Consumed opening material still carries its real upstream history; unreleased WIP and unassigned non-WIP inherited vectors use their own consistent basis, with unknowns retained."
      inputs:
        - raw_native_totals
        - cp_release
        - inherited_vectors
        - allocation_evidence
      output: "A_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
        - jrc-ilcd-allocation-2010
    - id: service_increment
      applies_to: "service"
      rule: "For each original cohort retain original first-release Qc and manufacture vector. Determine Aservice_j as actual assigned incremental services through H, retaining opening/closing FG and packaging history and true return/rework additions/losses. Goods returned/redispatched do not create Q or reverse original manufacture. Gross physical G/R and packaging movements are separate from burden attribution. For physical movement/output cards Aservice_j is the actual gross quantity of that specific movement, never its economic burden share; inherited manufacturing is not a second service consumption."
      inputs:
        - cp_service
        - cp_pack
        - Qc
        - H
        - inherited_vectors
      output: "Aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
    - id: final_exchange
      applies_to: "all inventory rows"
      rule: "The only unit-result operation is a_j = A_j / Q for manufacture and aservice_j = Aservice_j / Qc for explicitly separate original-cohort services over H. Apply once after raw conversion, stock/history and justified attribution. Protocol collection remains raw; cards/aggregation reference this same result without division again. Q is first-release net kg; Qc is original cohort first-release net kg. If either denominator is zero retain actual burden and issue no unit result. Finished reference amount is 1 kg. Consolidation cancels internal first-release transfer and retains actually observed services."
      inputs:
        - A_j
        - Q
        - Aservice_j
        - Qc
        - cp_release
        - cp_service
      output: "a_j; aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
        - jrc-ilcd-allocation-2010
    - id: packaging_stock
      applies_to: "cp_pack"
      rule: "For each actual material/configuration: opening empty+WIP-attached+FG-attached+reusable packaging + P + I + ER + Radd + H2Oin = closing corresponding disjoint stocks + S + EO + W + Rremove + H2Oout. I is actual external packaging attached to other supplies; Radd/Rremove are actual repair material additions/removals outside the existing whole-package directions; H2Oin/H2Oout are independently measured uptake/release outside water already carried in those measured streams. All flow terms are disjoint: a child already in another measured direction is counted once, but retaining added mass in closing stock never cancels its real influx. Dry wood and water have independent subledgers, not two unknowns fitted from one wet residual. Every actual wood/glue/fastener/water/removed material needs a specific atomic exchange and status/destination. Internal reuse/component handoffs cancel once; gross physical mass is unallocated and packaging never enters Q. Original-cohort inherited burden and actual incremental service remain separate and assigned once."
      inputs:
        - cp_pack
        - P
        - ER
        - S
        - EO
        - W
        - I
        - Radd
        - Rremove
        - H2Oin
        - H2Oout
      output: "packaging_residuals"
      source_ids:
        - jrc-ceramic-bref-2007
        - rosenthal-porcelain-production
    - id: physical_balance
      applies_to: "manufacture and service gates"
      rule: "Independently reconcile wet/dry physical mass and relevant elements across manufacturing, FG-service and combined gates. Include raw/WIP/FG, full supplies, assets/fluids, all actual inlet/outlet gas species, water phase/chemical changes, external Product returns and waste. Measure free/structural/reaction water and actual chemistry independently; no one residual determines two unknown species. Physical residuals remain disclosed before any burden shares."
      inputs:
        - cp_material
        - cp_release
        - cp_asset
        - cp_residue
        - cp_air
        - cp_water
        - cp_utility
        - cp_service
        - cp_pack
      output: "physical_element_species_residuals"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: asset_service
      applies_to: "cp_asset"
      rule: "Keep actual new/old/repair/retired equipment, moulds, media, refractory, deposited solids and in-machine fluids in a disjoint gross stock balance. Separately derive current service burden from verified inherited embodied inventory and actual deployment/usage. Do not assign one full machine per kg, guess mass or fix a life; materials worn into another recorded stream are not disposed again. Separately reconcile each physical asset/component/fluid: opening + actual gross receipts + independently measured added material/water = closing + outward returns + retirement/waste + wear entering other recorded streams + actual water loss/other exits. Terms are disjoint; included whole-machine components/fluids are child ledgers and worn material is not disposed twice. Closing retention never cancels an actual influx, and physical mass is not scaled by period-service burden shares."
      inputs:
        - cp_asset
        - inherited_asset_vectors
        - actual_usage
      output: "period_asset_service"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each exchange"
      requirement: "Check exact native identity/property chain and every card restriction. Unresolved specific auxiliary identities/providers remain visible, with no false collection UUID or generic substitution."
      evidence: "native full records and real supplier specifications"
    - id: dq_time
      applies_to: "all modes and stocks"
      requirement: "Declare representative period/site/design/cohort, all nonproducing modes and inherited stock vectors; services only through observed H with original Qc."
      evidence: "raw operation release stock and dispatch records"
    - id: dq_measure
      applies_to: "amounts and chemistry"
      requirement: "Preserve calibration/sampling/detection uncertainty, independent assays/speciation/density/heat evidence and unresolved physical residuals. No published case becomes a plant measurement."
      evidence: "laboratory reports meters mass and element reconciliations"
    - id: dq_scope
      applies_to: "completeness and use"
      requirement: "Differentiate missing/unknown, measured zero, below detection and demonstrated absence. Complete real materials/formulations/packaging/species/assets/control flows before asserting a data package; no engineering check certifies science, food contact or equivalent service."
      evidence: "gap register actual provider data and independent applicability review"
validation_rules:
  - rule_id: v_scope
    applies_to: "data package"
    rule: "Verify one declared undecorated transparent-glazed hard-porcelain plate design/grade, real raw-to-spray-granulate isostatic dry pressing and biscuit/glost two-firing route, finishing/testing and first-release gate; exclude incompatible material/route/component states. Core UUID and complete restrictions must hold; scientific applicability is reviewed separately from engineering."
    source_ids:
      - jrc-ceramic-bref-2007
      - rosenthal-porcelain-production
  - rule_id: v_q
    applies_to: "quantity and history"
    rule: "Reconcile unique first-release Q including released closing FG; all raw/WIP/store inherited exchange vectors, actual failed/zero-output/idle/cleanup loads and original Qc/H service accounts remain. No retest/reship creates Q, no double unit division. Zero denominators retain loads without a unit result."
    source_ids:
      - jrc-ceramic-bref-2007
      - rosenthal-porcelain-production
  - rule_id: v_species
    applies_to: "mass elements species"
    rule: "Check independent physical and relevant Si/Al/Na/K/C/H/O/S/F/Cl balances and phase/species evidence. NOx-as-NO2, SOx/HF equivalents, total metals/boron/carbon, VOC, AOX and COD are indicators, not identified chemical species. Unclosed residuals and detection limits remain explicit; do not fit reaction water and carbon dioxide from one loss-on-ignition number."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_stock
    applies_to: "all packaging assets and carriers"
    rule: "Verify each packaging opening/closing empty/WIP/FG/reusable pool, whole purchases/external returns/gross shipments/waste, and asset/fluid physical stocks versus period service burden. Match actual steam/hot-water/condensate states and provider water-energy convention without duplicate full supplies."
    source_ids:
      - jrc-ceramic-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: v_complete
    applies_to: "every applicable row"
    rule: "Require raw records, native extensive numerator unit, one final quotient, actual conditions/provider and all card qualifiers, uncertainty and source-role limits. Unknown, below detection, measured zero and demonstrated absence differ. Add every real missing atomic exchange. UUID/provider/data gaps in auxiliaries remain disclosed and cannot be hidden by a collection flow."
    source_ids:
      - jrc-ceramic-bref-2007
      - rosenthal-porcelain-production
      - jrc-ilcd-allocation-2010
  - rule_id: v_use
    applies_to: "allocation downstream claims"
    rule: "Review dedicated/subdivided operations, exchange-specific causal evidence and any residual common-gate values. No food-contact certification, functional equivalence, dimensions, per-item mass or lifetime is inferred from names/typical recipes/native marketing. Engineering checks approve neither methodology nor translation, accepted mapping or publication."
    source_ids:
      - jrc-ceramic-bref-2007
      - rosenthal-porcelain-production
      - jrc-ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Design/grade-specific ceramic plate production input to a separately specified product/service study"
  allowed_use: "Declared raw-to-first-release manufacture with verified upstream supplies and separately labelled actually observed Qc/H services"
  excluded_use: "All-CPC coverage, generic ceramic substitute, equal food-serving/food-contact/life comparison, alternate body/forming/firing/decoration, unobserved future services and automatic recovery credit"
  required_metadata: "site region period and actual provider; one actual plate design material and quality grade; hard porcelain body and transparent glaze chemistry; whole supplied raw materials formulations and moisture; on-site wet preparation spray granulation isostatic dry pressing and two-stage gas firing; drying atmosphere surface finishing and acceptance tests; unique first-release net mass Q and no inferred kg per item; opening closing raw WIP non-WIP stores and each inherited burden vector; original released FG cohort and gross shipment return state bridge; observed service horizon H and original cohort Qc; each packaging identity ownership empty attached reusable stocks and gross returns; actual species phase compartment CAS origin and analytical detection basis; independent full physical mass and element balance; native extensive units carrier mass thermal state enthalpy and provider water energy convention; machine mould refractory fluid physical stocks versus period service burden; dedicated subdivision physical causality residual common-gate value evidence; uncertainty unresolved auxiliaries and downstream limits"
  required_quality_disclosure: "Candidate scientific status and aligned unreviewed translation; source scope/time limits; actual raw observations versus requirements; unresolved auxiliary/provider/species and stock/physical residuals; allocation evidence; horizon completeness"
  update_trigger: "Changed body/glaze/formulation, supplied state, granulation/forming/firing route, finish/mark/decor, quality gate, native restriction/provider, stock attribution or service boundary"
data_sources:
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission, Ceramic Manufacturing Industry BREF, August 2007, §§2.3.6 and3.3.6; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "Qualitative whole tableware route, actual input/output and environmental-control families, finishing and adjacent material/forming/firing counterexamples. Historical tables and jiggering mass-flow example are not recipes, factors or this dry-press plant records."
  - id: "rosenthal-porcelain-production"
    type: "literature"
    reference: "Rosenthal, The fascinating world of porcelain production; https://www.rosenthal.de/en-de/porzellan-herstellung.html"
    used_for: "Manufacturer primary qualitative evidence for hard porcelain, spray-granulate dry pressing, two firings/glazing, grinding/sorting and finished white-ware terminal, with casting/decor counterexamples. No universal recipe/temperature/pressure/shrinkage/food-contact/performance/life inference."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, First edition March 2010, §§7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation scenario only: dedicated/subdivision/virtual subdivision, exchange-specific determining physical causality, residual common-process actual-state market value and explicit limits. No industry process proof, fixed share, QFD product-function method or recovery credit."
