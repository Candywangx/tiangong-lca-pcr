measurement_rules:
  - id: reference_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Q_c is the sum of actual single-face projected areas of uniquely first-released bare units. Use calibrated dimension measurements and traceable design-specific drawings. L × W is valid only for a verified rectangle; exclude inter-unit joints and do not use a bounding box, both faces or an installed pavement area. The output row is exactly 1 m2."
  - id: one_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "native extensive property"
      uuid: ""
    required_unit: "row-specific"
    rule: "Collect unnormalized raw records; convert original units and actual rates, assign and reconcile cohort ownership, then use normalize_once exactly once. Cards and protocol aggregation refer to that result. Q_c includes closing FG of newly released cohorts; it is not net deliveries. For service rows use the original cohort Q_H. Q=0 retains actual loads without a unit result."
  - id: moisture_and_mass
    applies_to: "material and bare-product mass"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net wet/as-received material and bare paver masses with calibrated balances and documented sampling. Keep free water, absorbed water and chemically/structurally bound water independently determined by suitable tests and phase evidence. Total wet stock and real influx both remain. Mass/area is measured for the same drawing, thickness, batch, moisture and release age; no secondary native factor, assumed item mass or density is a conversion."
  - id: electricity_conversion
    applies_to: "m_electricity; s_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the native extensive energy property. Convert measured kWh to MJ using 3.6 MJ/kWh, without interpreting electrical energy as a measured fuel calorific value. Verify China 1–35 kV grid-average supply; keep transformer and provider boundaries explicit."
  - id: volume_state
    applies_to: "m_gas; m_hydraulic"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Native Volume is retained. State pressure, temperature, gas composition and dry/wet convention for natural gas, and temperature/formulation for hydraulic fluid. Integrated volumes are not multiplied by time again. Convert a true rate by integration once. Use independently measured material-specific density for mass and actual lower heating value for fuel heat; native secondary coefficients do not establish either."
  - id: carrier_heat
    applies_to: "m_purchased_heat; m_steam; m_condensate; m_return_water; m_heat_carrier_water; s_heat_carrier_water"
    required_property_ref:
      name: "actual heat and carrier mass"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "Do not invent steam, boilers or heat exchange circuits. If actually used, record purchased heat once, steam carrier mass/quality/enthalpy, returned condensate or heat-exchange water and supplier water/energy ownership independently. Do not double count the same whole heat provider and its fuel/steam subledger. For the actual external carrier/return legs m_steam, m_heat_carrier_water, s_heat_carrier_water, m_condensate and m_return_water, A_e denotes the independently measured full gross physical V_e in that native row unit, not an attributed burden vector, net consumption, stock difference or economic share. Apply normalize_once to V_e once using Q_c for the manufacturing leg or its linked original Q_H for a service leg over observed H. Keep the absolute gross inlet and return separately, even when equal; measure actual temperature, pressure, phase/quality and enthalpy independently of delivered thermal MJ. One agreed water/heat provider owns the supply burden once; this physical carrier/return is not an additional whole purchase, export credit or assumed boiler/circuit. Only an identical OTHER same-side physical flow/event can deduplicate a leg; no stock, opposite flow or merely present card cancels it. A true return not yet listed requires its own qualified actual atomic card before use; no return or route is presumed."
  - id: species_balance
    applies_to: "all elementary rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep physical mass and relevant C/H/O/Ca/N/S balances separate from species/phase evidence. Determine hydration and carbonation independently; one residual cannot fit two unknowns. NOx as NO2-equivalent, COD, VOC, total carbon and PM size bins are indicators rather than proof of a particular chemical species. Do not add a gross air total to the same included species."
  - id: asset_service
    applies_to: "m_vibropress; m_mould; m_board; s_forklift"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure the complete configured asset mass from calibrated weighing or traceable compatible manufacturer records. Record physical purchases, installed stock, retirement and repair separately from the assigned embodied service vector. Only evidenced service/capacity allocation is permitted; no fixed lifetime or one whole machine per kg/m2. Unknown service capacity remains a concrete dataset gap."
