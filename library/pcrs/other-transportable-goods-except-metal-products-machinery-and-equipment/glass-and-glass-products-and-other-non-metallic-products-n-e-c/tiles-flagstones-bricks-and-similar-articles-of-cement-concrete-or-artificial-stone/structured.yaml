product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.glass-and-glass-products-and-other-non-metallic-products-n-e-c.tiles-flagstones-bricks-and-similar-articles-of-cement-concrete-or-artificial-stone"
  classification_refs: "CPC 3.0 37540; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "Complete bare single-layer unreinforced vibropressed and cured concrete paving block of one declared through-mix grade"
  excluded_products: "Exclude ready-mixed wet concrete, cement/clinker, natural stone, fired ceramic paving, resin-dominant artificial stone, reinforced articles, AAC/autoclaved products, wet-cast slabs, separate face-mix layers, deliberately CO2-cured products and installed pavement systems. The selected terminal is a bare through-mix paver without coating or sealer. Integral mineral pigment and one qualified whole admixture are individually recorded when present. Actual washing, blasting, polishing, coating, a new binder/aggregate chemistry or another curing route requires renewed applicability and all added atomic exchanges; it cannot disappear into zero or an unspecified residual. Purchased finished-paver packing cannot replace manufacture."
  representative_product: "Uninstalled concrete pavement block at unique first quality release"
  production_route: "Actual unfabricated supplies → preparation/mixing → vibrocompression → controlled curing → required mechanical edge finishing/tests → first release"
  market_state: "Bare complete hardened unit; no coating or separate face layer; packaging outside net reference"
functional_unit:
  what: "Manufacture of the declared complete concrete paving block; this declared unit is not installed-pavement functional equivalence"
  how_much: "1 m2"
  how_well: "Actual specification, drawing, grade and required tests met at first release; native high-strength pavement-brick family is qualified by actual results, without a universal threshold"
  how_long_or_cycle: "One declared manufacturing cohort and reporting period; separate original-cohort service horizon H; no assumed service life"
  reference_flow_link: "accepted_paver"
system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "product system"
      rule: "Include upstream production and actual inbound transport of every whole supplied material, fuel, water and package; receiving/preparation, mixing, forming, curing, all required finishing/tests and controls through first release, then separately all performed original-cohort services. Foreground begins with actual supplied cement, aggregates and complete formulations, never purchased finished pavers."
      source_ids:
        - masa-concrete-block-production
        - marshalls-through-mix-2023
        - cmha-pav-tec-010
    - rule_id: boundary_supplies
      applies_to: "purchased formulations"
      rule: "A whole purchased cement, pigment preparation, admixture or release formulation crosses the boundary once, with supplier-included packaging and one upstream owner. Assay constituents, carrier water and active solids are composition subledgers, not duplicate purchases. Actual in-house compounding requires each purchased constituent and real mixing energy/losses. Add each actually present flow not listed below as its own atomic card; none is concealed by zero or an other-material total."
      source_ids:
        - cmha-pav-tec-010
        - marshalls-through-mix-2023
    - rule_id: boundary_first_release
      applies_to: "manufacturing cohorts"
      rule: "Q_c records a unit once at its first specified quality release after actual curing, finishing and tests. Newly released closing FG is already inside Q_c; never add it as a second production output or remove its manufacturing burden. Reinspection, storage, dispatch, returns and sale do not create new output. Unreleased curing stock remains WIP with its full per-exchange inherited history."
      source_ids:
        - masa-concrete-block-production
        - marshalls-through-mix-2023
    - rule_id: boundary_burden_stocks
      applies_to: "manufacturing inventory vectors"
      rule: "For each exchange e and cohort c reconcile A_m,e = B_open,e + X_owned,e + T_in,e - B_close,e - T_other,e. B_open/B_close contain raw materials, unreleased WIP and genuinely unused/unassigned stores or service charges only; exclude already released FG. X_owned contains real operating loads and influx owned once. Keep all failed/zero-output/start-stop/idle/cleanup/rework loads and waste treatment. Ordinary rejects, samples, externally sold waste and disposal do not justify T_other. That term requires a real independent cohort/function and a justified allocation/handover with one vector transfer. A consumption record already corrected for stock is not corrected a second time."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: boundary_service
      applies_to: "original released cohorts"
      rule: "Services use A_s,e for actual incremental work over observed H and the original cohort first-release area Q_H. Include service of FG still in store; only genuinely unused/unassigned service or charges may carry forward. Keep historical manufacturing and performed service vectors, gross shipment G, physical return R and original delivery reversal D_rev separately: gross returned mass need not equal original delivered mass because water, loss, damage or genuine rework may change it. This first-release method never replaces Q by G-R. A net-delivery dataset requires a separately reviewed complete opening/closing FG historical-burden and original-delivery reversal bridge."
      source_ids:
        - jrc-ilcd-2010
        - marshalls-through-mix-2023
    - rule_id: boundary_physical
      applies_to: "manufacturing FG and combined physical gates"
      rule: "Reconcile full wet opening stock plus every actual gross incoming material/water/fuel/atmospheric-species/repair/asset leg against full wet closing stock plus unique new-Q bare mass, every gross waste/sample/reject/release/return/retired-asset leg and installed-asset change. FG separately reconciles opening + first release + physical returns with closing + gross shipments + actual waste and transfers; combined gates cancel only internal first-release/FG and other identical transfers. Do not scale gross physical legs by burden shares. Water and repair X_in/X_out deduplicate only identical other inflow/outflow terms: a real new influx retained in closing wet stock remains an influx together with full closing mass. In the displayed stock equation M_open/M_close exclude installed asset bodies and contained fluids already represented in delta_installed; retain their complete separate wet installed-stock ledger. FG stocks belong to the FG gate, raw/WIP stocks to manufacturing; consolidation includes each once."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: boundary_rework
      applies_to: "unreleased and released rework"
      rule: "Trace actual stage, original cohort, condition, added materials/water/energy, emissions, losses, tests and disposition of each rework pass. Post-release work requires manufacturer/specification permission and postwork tests/acceptance/disposition. Broken hydraulic-cement units are not assumed to regain their original function. Crushing a reject to aggregate is not another accepted paver or automatic credit. Independently record each actual new/old material or part added and removed and each free/carrier/absorbed/structural/reaction-water phase. Repair-held FG is one labelled FG substate or a disjoint repair-WIP state, never both. Trace actual maker/specification permission, postwork tests, acceptance or rejection and final destination; neither a broken/hardened/rewetted paver nor its restoration is assumed, and no work creates another Q. Manufacturer/specification permission and postwork tests govern authorization, continued conformity and acceptance/rejection/disposition only. Independently record every actually performed unauthorized, unapproved, failed or rejected operation and all its material/part/water/energy inputs, emissions, losses, waste and burdens on the proper original Q_c or Q_H/H, even when permission or tests fail. This neither authorizes that operation nor assumes a damaged hydraulic-cement body is restored; no new Q arises."
      source_ids:
        - masa-concrete-block-production
        - cmha-pav-tec-010
    - rule_id: boundary_packaging
      applies_to: "each packaging article"
      rule: "For each material/article independently reconcile opening empty + opening attached WIP/FG + opening reusable + P + I + ER + X_in = closing empty + closing attached WIP/FG + closing reusable + S + EO + W + X_out. P is paid procurement (standalone or bundled)d; I is first non-purchased external ingress; ER external return received; S accompanies gross physical shipments; EO other external return/output; W waste. Count P/I whole articles once with one upstream owner; internal reuse cancels. Six legs deduplicate only identical other physical incoming/outgoing terms. New packaging retained at closing is still real ingress. Do not put packaging into bare Q, re-purchase it on every reuse, or create an automatic co-product.  Independently weigh actual repair material and water additions/removals; X only covers matter absent from another same-direction flow term, never opening/closing stocks. Whole wet P/I articles enter once with one upstream owner; retained actual influx remains alongside complete wet closing mass. A whole wet article receipt already includes its integral wood/fasteners/coating and contained water once. Separately added on-site components or water are independent real influxes only when disjoint from the whole receipt; retain an article/component bridge and paired internal handoff so consolidation never counts a whole assembled tare plus its same components twice. For a real single mixed packaging-waste outlet, independently measure each source-material W in a nonadditive raw origin ledger, reconcile sum(origin W) to the one measured mixed total, and use one qualified actual Waste exchange/treatment owner. Report the total OR its disjoint partition, never both additively. A material W card is an actual separate outlet only if physically separated; otherwise it is that origin subledger, not an invented separated outlet. Add/qualify a single mixed-outlet card only if that outlet actually occurs; no mixed stream is presumed.  Apply packaging_receipt_basis to distinguish each actual P/I/ER receipt."
      source_ids:
        - marshalls-through-mix-2023
        - jrc-ilcd-2010
    - rule_id: packaging_receipt_basis
      applies_to: "each packaging receipt"
      rule: "For every actual packaging article, classify each whole external receipt once. P is paid procurement, including paid packaging bundled with another supply without a separate invoice. I is all first non-purchased external ingress: standalone gifts, loans, rental or pool receipts and non-purchased supplier-attached packaging; supplier attachment is only an I subset. ER requires this same item or an auditable configuration-matched batch linked to this site's own prior outward record; custody or another party's use alone does not prove a return. P, I and ER are disjoint. Existing I cards and their raw protocols cover the same physical article for every such I origin; no new material, UUID or quantity is presumed. X_in/X_out remain disjoint material/water-change terms, never a substitute for whole-article receipt. Retain gross physical quantity, owner/custodian, payment or non-purchase basis, origin, prior-outward link where required, native state/unit and inherited manufacturing/service vector. Non-purchase is neither a new manufacture nor automatic zero burden: attribute actual used service and incremental transport/handling once to its proper original cohort and denominator, retaining unused service separately without a default lifetime or credit. This is the declared conserving foreground accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-2010
