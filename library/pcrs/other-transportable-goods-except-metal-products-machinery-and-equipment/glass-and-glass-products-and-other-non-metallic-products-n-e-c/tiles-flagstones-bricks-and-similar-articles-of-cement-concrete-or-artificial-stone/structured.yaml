allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "attributional multifunctionality"
    rule: "Define the real co-functions and common gate. First assign exclusive flows and subdivide, including virtual subdivision with reviewable technical evidence. For each remaining exchange determine and quantify the physical causality that actually determines that exchange; do not apply mass, area, time or energy to all exchanges merely because it is available. Only the genuinely residual indivisible process uses contemporaneous market value of each function at the same gate and actual supplied state/amount, correcting downstream transport/conditioning/packing costs. Document alternatives and sensitivity. No arbitrary physical/economic choice, fixed share, substitution or automatic avoided-product credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_loss
    applies_to: "rejects samples and waste treatment"
    rule: "Normal manufacturing failures, tests, rejects and ordinary waste management remain loads of the paver cohort, even when shipped away or sold. A real separate function or other cohort needs a documented causal/subdivision/handover decision before exactly one burden vector can move; physical gross legs always remain intact. Internal recovered concrete, dust or water carries its inherited vector once and cannot be both a new purchase and an avoided virgin input."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_assets
    applies_to: "capital repair and original-cohort services"
    rule: "Keep each new/old part, in-place fluid and repair water physically visible. Assign embodied asset burdens using evidenced actual service and the justified capacity/usage convention; direct repairs belong to actual receiving operations/cohorts. Retain performed service on stored FG. Do not subtract closing FG from manufacturing or already performed service and do not deduct stocks twice."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "cure_release"
      flow_role: "accepted_paver"
      record_type: "measured"
      raw_fields: "unique unit and lot IDs; drawing revision; shape-specific projected area; actual net bare wet mass; curing/finishing/test records; unique first-release time; Q_c; original Q_H; projection plane; net outline/void records; actual declared grade and manufacturer tests"
      collection_method: "Calibrated dimensions and independently checked drawing geometry; count each conforming unit once at the actual first release. Weigh complete bare same-design/configuration units with calibrated balances and representative moisture/age sampling. Trace any area/mass conversion to this measured population.  Declare the single projection plane and measured net outline, including interlocks and actual holes/cut-outs. Exclude installation joints/gaps, neighbouring units and summing both faces or all surfaces. L*W requires a verified solid rectangle without openings; no EPD size, thickness, density or mass/area coefficient is a measured conversion.  The native high-strength pavement-brick descriptor requires an actually compatible declared paving grade and manufacturer specification/test evidence; it provides no universal strength threshold or service life. Retain the declared single-face net projection convention rather than an installed-pavement area."
      unit: "m2; kg"
      frequency: "each lot and release event"
      temporal_coverage: "full reporting period and inherited unreleased cohorts"
      site_scope: "declared paver line and actual quality gate"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "drawings; calibration; unique acceptance ledger; moisture tests; rejected sample disposition"
    - protocol_id: cp_raw
      process_id: "mix_form"
      flow_role: "raw materials"
      record_type: "measured"
      raw_fields: "row_id; supplier and supply form; gross receipts; P/I ingress packaging owner; wet mass; moisture/assay; dosing; internal transfers; opening/closing raw/WIP; inherited exchange vector"
      collection_method: "Calibrated balances and actual supplier/delivery/dosing records per whole supply. Reconcile as-received water and composition independently. Sample retained WIP through actual curing state and keep its accumulated per-exchange vector; do not subtract newly released FG."
      unit: "kg"
      frequency: "each receipt batch and stocktake"
      temporal_coverage: "opening history plus all reporting-period activity including zero-output intervals"
      site_scope: "supplier gate to mixing/forming and curing WIP"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "delivery records; balances; assay; wet-stock reconciliation; complete original units"
    - protocol_id: cp_water
      process_id: "cure_release"
      flow_role: "each water phase and return"
      record_type: "measured"
      raw_fields: "water row_id; supply owner; meter readings or actual rate; integrated volume; temperature; pressure; density independently measured for this substance/state; wet stocks; carrier water; condensate/heat-water return; discharge; retained free and bound water; species evidence; gross V_e per actual carrier/return row and native unit; Q_c or original Q_H/H; actual T/P/phase/enthalpy; unique provider owner; same-side OTHER flow overlap links"
      collection_method: "Meter and sample each real water stream and phase. Independently determine total wet mass, free/absorbed water and hydration/structural phases with suitable laboratory methods and controls; separate carbonation evidence and gas measurements. Read integrated volume once; integrate actual rates once; no water-density assumption for another liquid. Keep real influx plus full closing wet mass. For the actual external carrier/return legs m_steam, m_heat_carrier_water, s_heat_carrier_water, m_condensate and m_return_water, A_e denotes the independently measured full gross physical V_e in that native row unit, not an attributed burden vector, net consumption, stock difference or economic share. Apply normalize_once to V_e once using Q_c for the manufacturing leg or its linked original Q_H for a service leg over observed H. Keep the absolute gross inlet and return separately, even when equal; measure actual temperature, pressure, phase/quality and enthalpy independently of delivered thermal MJ. One agreed water/heat provider owns the supply burden once; this physical carrier/return is not an additional whole purchase, export credit or assumed boiler/circuit. Only an identical OTHER same-side physical flow/event can deduplicate a leg; no stock, opposite flow or merely present card cancels it. A true return not yet listed requires its own qualified actual atomic card before use; no return or route is presumed."
      unit: "kg; m3; MJ"
      frequency: "continuous actual records and each sample/return"
      temporal_coverage: "all curing residence across periods and observed service H"
      site_scope: "actual water system and external return gate; cohort tag required"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "calibration; independent density and phase tests; supplier energy/water agreement; uncertainty"
    - protocol_id: cp_utilities
      process_id: "manufacturing_controls"
      flow_role: "each utility"
      record_type: "measured"
      raw_fields: "row_id; meter/batch; actual stage; original unit or rate; state; fuel composition and LHV; density; gas pressure/temperature; electricity voltage/supply geography; opening/closing unassigned charge; zero-output/start-stop/idle/cleanup loads; cohort ownership"
      collection_method: "Read calibrated submeter/counter and supply records. Convert native extensive units before assigning inventory; independently measure gas/liquid state and LHV when needed. Separate purchased whole heat providers and all real internal heat-carrier subledgers. Keep all actual load even when production is zero."
      unit: "MJ; kg; m3"
      frequency: "meter interval each fuel receipt and operation"
      temporal_coverage: "complete manufacturing observation plus inherited charges"
      site_scope: "declared site and actual manufacturing stages"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "meter calibration; supply invoice; independent state/LHV tests; allocation evidence"
    - protocol_id: cp_species
      process_id: "manufacturing_controls"
      flow_role: "individual atmospheric or emitted species"
      record_type: "measured"
      raw_fields: "row_id; real chemical species/CAS and phase; compartment; fossil/biogenic origin where relevant; sampling state; integrated gas volume or rate/time; independently measured composition; separate gross air species; liquid water; PM disjoint sizes; C/H/O/Ca/N/S evidence; controls and blank tests"
      collection_method: "Use species-specific calibrated monitoring/laboratory methods and actual documented process balances with independent constraints. Distinguish direct measurement from calculation. Sampling must cover load changes and real controls; keep indicator totals separately and never invent species or two reaction extents from one residual."
      unit: "kg; actual gas-state m3"
      frequency: "continuous or justified representative event sampling"
      temporal_coverage: "manufacturing failures and service events identified separately"
      site_scope: "actual intake/release points and receiving compartments"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "raw instrument records; detection limits; independent water/carbonation phases; specimen identity; uncertainty"
    - protocol_id: cp_waste
      process_id: "manufacturing_controls"
      flow_role: "each real waste stream"
      record_type: "measured"
      raw_fields: "row_id; stage/cohort; wet whole mass; solids/water and retained fluid subledger; opening/closing waste; samples/failures; internal reuse; gross external shipment/sale; treatment owner; any justified separate-function handover"
      collection_method: "Weigh actual separated streams and retained stock, sample composition and verify destination/treatment records. Avoid duplicating removed parts/fluid and refuse automatic burden removal for rejects or sold waste. Record actual postwork permission, tests, acceptance and disposition. A whole wet article receipt already includes its integral wood/fasteners/coating and contained water once. Separately added on-site components or water are independent real influxes only when disjoint from the whole receipt; retain an article/component bridge and paired internal handoff so consolidation never counts a whole assembled tare plus its same components twice. For a real single mixed packaging-waste outlet, independently measure each source-material W in a nonadditive raw origin ledger, reconcile sum(origin W) to the one measured mixed total, and use one qualified actual Waste exchange/treatment owner. Report the total OR its disjoint partition, never both additively. A material W card is an actual separate outlet only if physically separated; otherwise it is that origin subledger, not an invented separated outlet. Add/qualify a single mixed-outlet card only if that outlet actually occurs; no mixed stream is presumed."
      unit: "kg"
      frequency: "each disposal/rework/test event and stocktake"
      temporal_coverage: "whole reporting period including all failures"
      site_scope: "actual generation and treatment gates"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "weigh tickets; laboratory tests; destination and treatment receipts; handover justification"
    - protocol_id: cp_assets
      process_id: "manufacturing_controls"
      flow_role: "each asset part and contained fluid"
      record_type: "measured"
      raw_fields: "asset/part row_id; complete configured measured mass; opening/in-use/closing body and contained fluid; real new influx X_in; old removal X_out; repair water; actual service counters; supported capacity and burden vector; unused/unassigned charges; receiving operation/cohort"
      collection_method: "Use actual configuration drawings, calibrated weighing or compatible traceable manufacturer mass records and maintenance/service logs. Quantify justified embodied service from actual use and evidenced capacity; carry only unused/unassigned service, with no fixed lifetime. New repair material/water influx remains even when installed at closing; whole parts/fluids are not duplicated in subledgers."
      unit: "kg; m3; service-counter original units"
      frequency: "each acquisition repair retirement and service interval"
      temporal_coverage: "full asset histories and current actual service"
      site_scope: "each declared asset and receiving cohort including FG services"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "configuration; calibrated mass; maintained service capacity evidence; stock and repair records"
    - protocol_id: cp_packaging
      process_id: "cohort_services"
      flow_role: "each whole packaging article"
      record_type: "measured"
      raw_fields: "material/article row_id; upstream owner; opening/closing empty; opening/closing attached WIP/FG; opening/closing reusable; P; I; ER; S; EO; W; actual tare and condition; internal reuse; original Q_H and H; separate actual repair new/old parts and materials; absorbed/retained/released water phases; X_in/X_out; same-direction other-flow overlap links; complete independent wet stocks; each of the six atomic directional row IDs; integral article components/water; disjoint on-site additions; paired article/component bridge; independently measured origin W and single mixed total; total-or-partition flag; one treatment owner ; packaging P/I/ER origin and payment/non-purchase evidence; same-item prior outward ID; inherited service owner/vector"
      collection_method: "Count and weigh each actual article/material and attached stock with compatible moisture/condition. Verify supplier-included ingress and one upstream owner. Independently close the full six-leg equation; internal reuse cancels and real new ingress remains even when closing attached/empty stock rises. Retain gross physical quantities without burden-share scaling.  Independently weigh actual repair material and water additions/removals; X only covers matter absent from another same-direction flow term, never opening/closing stocks. Whole wet P/I articles enter once with one upstream owner; retained actual influx remains alongside complete wet closing mass. A whole wet article receipt already includes its integral wood/fasteners/coating and contained water once. Separately added on-site components or water are independent real influxes only when disjoint from the whole receipt; retain an article/component bridge and paired internal handoff so consolidation never counts a whole assembled tare plus its same components twice. For a real single mixed packaging-waste outlet, independently measure each source-material W in a nonadditive raw origin ledger, reconcile sum(origin W) to the one measured mixed total, and use one qualified actual Waste exchange/treatment owner. Report the total OR its disjoint partition, never both additively. A material W card is an actual separate outlet only if physically separated; otherwise it is that origin subledger, not an invented separated outlet. Add/qualify a single mixed-outlet card only if that outlet actually occurs; no mixed stream is presumed.  For packaging receipts apply packaging_receipt_basis; standalone non-purchase is I, never a fabricated ER or X."
      unit: "kg; actual counts with measured tare"
      frequency: "each receipt pack shipment return waste event and stocktake"
      temporal_coverage: "opening histories and complete original-cohort horizon H"
      site_scope: "packaging storage WIP/FG and all external gates"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "tare measurements; all six-leg receipts; supplier ownership; attached stock records"
    - protocol_id: cp_services
      process_id: "cohort_services"
      flow_role: "each original-cohort incremental service exchange"
      record_type: "measured"
      raw_fields: "row_id; original unit/cohort; original first-release area Q_H; observed H; opening/closing FG and inherited manufacturing/performed-service vectors; actual new service raw units; gross G; physical R; original delivery D_rev; new water/loss; postwork permission/tests/acceptance/disposition; actual added/removed new/old materials and parts; independent water phases; labelled repair-held FG or disjoint repair-WIP; actual maker/specification permission; postwork tests; acceptance/rejection and final destination; intact Product and damaged Waste returns separately; native projected areas and independent wet masses"
      collection_method: "Trace real stored, handled, packed, shipped and returned units to original release/delivery events. Meter and measure incremental work by actual service type and native extensive unit; retain performed service on stored FG. No reinspection or redelivery creates Q. Compare actual return mass/state with original delivery rather than assuming equality.  Actual cross-process first-release handover is paired to manufacturing output by unit/cohort and cancels on consolidation; it is custody only, not an extra environmental input or purchase. Measure gross dispatch and compatible intact returns independently in native Area and wet mass, and damaged returns independently as whole wet Waste mass; do not force a kg/m2 or original-delivery equality. Record real postwork additions/removals and repair custody once, with performed service of held FG retained over original Q_H/H. Existing packaging-W cards keep this service-event protocol and link their row-specific gross wet discarded-article record to cp_packaging W; measure actual physical disposal, destination and treatment separately from incremental service burden. Manufacturer/specification permission and postwork tests govern authorization, continued conformity and acceptance/rejection/disposition only. Independently record every actually performed unauthorized, unapproved, failed or rejected operation and all its material/part/water/energy inputs, emissions, losses, waste and burdens on the proper original Q_c or Q_H/H, even when permission or tests fail. This neither authorizes that operation nor assumes a damaged hydraulic-cement body is restored; no new Q arises."
      unit: "MJ; kg; m3; m2"
      frequency: "each service interval and gross leg"
      temporal_coverage: "observed H bound to original cohort records"
      site_scope: "actual original-cohort FG service gates"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "original release/delivery links; gross-leg records; submeter; revised moisture; permission/tests and uncertainty"
  calculation_rules:
    - id: release_area
      applies_to: "accepted_paver"
      rule: "Q_c = sum(n_j * a_j); a_j = independently measured or traceable drawing-specific single-face projected area; n_j = unique first-released conforming units. Use L*W only for verified rectangles. Closing FG newly released in c is already in n_j.  Declare the single projection plane and measured net outline, including interlocks and actual holes/cut-outs. Exclude installation joints/gaps, neighbouring units and summing both faces or all surfaces. L*W requires a verified solid rectangle without openings; no EPD size, thickness, density or mass/area coefficient is a measured conversion."
      inputs:
        - n_j
        - a_j
        - cp_release
      output: "Q_c"
      source_ids:
        - masa-concrete-block-production
        - marshalls-through-mix-2023
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert each original raw extensive quantity to that row unit before attribution. Integrate genuine rates once; do not multiply an integrated volume by time. Apply measured material-specific density/state and actual LHV only where needed. Electrical MJ = measured kWh * 3.6. Preserve original records and independent physical/species ledgers."
      inputs:
        - raw_records
        - state_measurements
        - cp_utilities
        - cp_water
      output: "converted_raw"
      source_ids:
        - jrc-ilcd-2010
    - id: manufacturing_vector
      applies_to: "manufacturing rows"
      rule: "A_m,e = B_open,e + X_owned,e + T_in,e - B_close,e - T_other,e. Apply boundary_burden_stocks and allocation_hierarchy before normalization; B_close excludes released FG. Already stock-corrected consumption is not corrected again. Ordinary waste/sale is not T_other."
      inputs:
        - B_open
        - X_owned
        - T_in
        - B_close
        - T_other
        - cp_raw
        - cp_assets
      output: "A_m"
      source_ids:
        - jrc-ilcd-2010
    - id: service_vector
      applies_to: "service rows"
      rule: "A_s,e is the actual incremental original-cohort service over observed H after exclusive assignment/subdivision and justified residual allocation. Retain already performed service of stored FG. Q_H is the original cohort first-release area, not gross shipments minus returns; maintain separate G/R/D_rev and inherited burden bridge."
      inputs:
        - raw_service
        - original_cohort
        - Q_H
        - H
        - cp_services
      output: "A_s"
      source_ids:
        - jrc-ilcd-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "a_e = A_e / Q_b; A_e is the reconciled assigned unnormalized extensive numerator in the row unit; Q_b = Q_c for manufacturing or the linked original Q_H for service. Perform this division once only when Q_b > 0. The reference product output is exactly 1 m2. For Q_b = 0 preserve A_e without a unit result. For the explicitly identified physical-custody rows, including each P/I/ER/S/EO/W packaging direction, actual FG gate movements and physical asset acquisitions/removals, A_e instead denotes that independently measured unallocated gross movement in the native row unit. Label this physical basis and divide only by the same original Q_c/Q_H; do not stock-correct or economically scale a gross leg. It is not an attributable LCI burden vector, new production/purchase, or automatic burden export/credit. Keep the absolute gross ledger and original manufacturing/service vectors separately; an asset-service row retains only its documented service burden, never a whole physical asset charge. For the actual external carrier/return legs m_steam, m_heat_carrier_water, s_heat_carrier_water, m_condensate and m_return_water, A_e denotes the independently measured full gross physical V_e in that native row unit, not an attributed burden vector, net consumption, stock difference or economic share. Apply normalize_once to V_e once using Q_c for the manufacturing leg or its linked original Q_H for a service leg over observed H. Keep the absolute gross inlet and return separately, even when equal; measure actual temperature, pressure, phase/quality and enthalpy independently of delivered thermal MJ. One agreed water/heat provider owns the supply burden once; this physical carrier/return is not an additional whole purchase, export credit or assumed boiler/circuit. Only an identical OTHER same-side physical flow/event can deduplicate a leg; no stock, opposite flow or merely present card cancels it. A true return not yet listed requires its own qualified actual atomic card before use; no return or route is presumed."
      inputs:
        - A_e
        - Q_b
        - Q_c
        - Q_H
        - cp_release
      output: "a_e"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_gates
      applies_to: "all physical records"
      rule: "M_open + sum(X_in) = M_close + sum(X_out) + delta_installed. Apply boundary_physical separately to manufacturing, FG and combined gates with actual wet states and unique new-Q mass; cancel only identical internal transfers. Keep gross legs intact regardless of burden allocation. Check relevant elemental balances independently of species and hydration/carbonation extents."
      inputs:
        - physical_raw
        - wet_stocks
        - installed_change
        - phase_species_tests
      output: "physical_balance"
      source_ids:
        - jrc-ilcd-2010
    - id: packaging_six_legs
      applies_to: "each packaging material"
      rule: "O_empty + O_attached + O_reusable + P + I + ER + X_in = C_empty + C_attached + C_reusable + S + EO + W + X_out. Apply boundary_packaging per article/material; preserve both real ingress and full closing stock and cancel internal reuse only.  Independently weigh actual repair material and water additions/removals; X only covers matter absent from another same-direction flow term, never opening/closing stocks. Whole wet P/I articles enter once with one upstream owner; retained actual influx remains alongside complete wet closing mass.  Apply packaging_receipt_basis to distinguish each actual P/I/ER receipt."
      inputs:
        - O_empty
        - O_attached
        - O_reusable
        - P
        - I
        - ER
        - C_empty
        - C_attached
        - C_reusable
        - S
        - EO
        - W
        - cp_packaging
        - X_in
        - X_out
        - actual_repair_material_water
        - same_direction_overlap_evidence
      output: "package_balance"
      source_ids:
        - marshalls-through-mix-2023
        - jrc-ilcd-2010
    - id: measured_mass_area
      applies_to: "actual mass-area conversion only"
      rule: "m_bare_per_m2 = measured_net_bare_mass / independently determined projected_area for the same actual drawing/configuration/moisture/age population. Never use an EPD example, secondary native factor or assumed density/item weight. No conversion is needed to establish the native Area reference itself."
      inputs:
        - measured_net_bare_mass
        - projected_area
        - cp_release
      output: "m_bare_per_m2"
      source_ids:
        - marshalls-through-mix-2023
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each bound or unbound row"
      requirement: "Retain every native material/form/route/grade/geography/media/type and property restriction in the complete card context. Supplier/grade/amount absence is a collection requirement rather than permission to use another family. No source query success establishes applicability."
      evidence: "full identity and provider compatibility evidence"
    - id: dq_completeness
      applies_to: "entire observed route"
      requirement: "Keep failures, zero output, start/stop, idle, cleanup, retained curing WIP, full wet stocks and every real atomic flow including conditional additions. Distinguish absent from unmeasured and zero from unknown."
      evidence: "coverage ledger and full stock/service histories"
    - id: dq_sources
      applies_to: "method and site evidence"
      requirement: "Retain original source context and contrary routes. Industrial evidence does not approve LCA allocation. Use actual site/period data with calibration, uncertainty, representativeness and separate measured/calculated/provisional status; transfer no source numerical recipe or credit."
      evidence: "sources plus original foreground records and uncertainty assessment"
    - id: dq_translation
      applies_to: "bilingual units and native displays"
      requirement: "Keep the same first-release/area/service bases, qualifiers, process/row/rule/source IDs, formulas and actual native Chinese basenames. Alignment and engineering checks do not approve science or translation."
      evidence: "paired full-field review"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "reference product"
    rule: "Require confirmed whole concrete-paver Product/Area identity, traceable actual geometry, cure/finish/test/acceptance and all Required qualifiers. An unresolved or incompatible core final identity is a true hold: no usable/authored coverage claim may be inferred from a mechanical check."
    source_ids:
      - masa-concrete-block-production
      - cmha-pav-tec-010
  - rule_id: validate_units
    applies_to: "each inventory and calculation"
    rule: "Check each row native extensive property, exact compatible unit/state and all actual conversions; execute normalize_once once only. Verify unique reference row accepted_paver and 1 m2, all raw collection links and explicit Q=0 behavior. A unit/schema pass does not solve an unknown method relationship."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_history
    applies_to: "cohorts physical and burden vectors"
    rule: "Reconcile opening/closing curing WIP and every inherited exchange, first-release Q including closing FG once, actual original-cohort service/Q_H/H and gross G/R/D_rev. Do not subtract FG manufacturing or performed service. Independently close manufacturing/FG/combined wet mass, elements and the six packaging legs without fitting multiple unknowns or scaling physical legs."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_allocation
    applies_to: "each attribution and burden transfer"
    rule: "Verify exclusive assignment/subdivision, exchange-specific determining physical causality and only genuine residual same-gate/state contemporary market value. Keep ordinary losses and waste treatment owned; require independent function/cohort plus justified once-only handover for any T_other."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_rework
    applies_to: "actual post-release work"
    rule: "Require manufacturer/spec permission, actual added inputs/outputs/water/losses, postwork tests/acceptance/disposition and original-cohort trace. A broken paver is not assumed restored, and reinspection or delivery creates no new Q."
    source_ids:
      - cmha-pav-tec-010
  - rule_id: validate_gap_reporting
    applies_to: "concrete foreground dataset"
    rule: "Report unresolved auxiliary UUIDs, incompatible providers, missing raw activity, sampling and uncertain conversions as explicit completeness limitations. Do not invent defaults, mark unknown as zero, call draft a covered leaf, or interpret engineering evidence as scientific/translation/mapping/publication approval."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified upstream concrete paving block input with the same terminal/geometry/moisture and observed service scope"
  allowed_use: "Declared actual grade/site/period and explicitly matching whole bare paver; original-cohort service only over observed H"
  excluded_use: "Installed pavement functional equivalence; all CPC37540 coverage; another material/route; unmeasured lifetime; automatic carbonation/recycling credit"
  required_metadata: "All Required qualifiers; provider/native limits; process/source IDs; physical and burden boundaries; original units and calculations"
  required_quality_disclosure: "Unknowns and unresolved non-core identities; calibration/representativeness/uncertainty; actual wet phases and histories; independent review state"
  update_trigger: "Real binder/aggregate/formulation/geometry/route/gate/supply change; new evidence or phase test; provider replacement; scientific or translation review"
data_sources:
  - id: "masa-concrete-block-production"
    type: "handbook"
    reference: "Masa, Concrete Block and Paver Production; https://www.masa-group.com/Dokumente/Prospekte/Masa_concrete-block-paver-production_EN_ma-0000026y.pdf"
    used_for: "Complete equipment/route context; dosing; vibrocompression; curing; QA; board loops; optional face/surface counterexamples. Output/cycle/size examples are not defaults."
  - id: "marshalls-through-mix-2023"
    type: "dataset"
    reference: "Marshalls, HUB-0305, Concrete Block Paving - Pigmented Semi Dry Mix, 24 February 2023; https://media.marshalls.co.uk/image/upload/v1678718418/EPD-Marshalls-Pigmented-Concrete-Block-Paving.pdf"
    used_for: "Historical eight-site through-mix semi-dry manufacturing and market-state example; curing and packing distinctions. No transfer of recipe; mass/area; depth factors; service life; carbon uptake; negligible waste or mass/volume allocation."
  - id: "cmha-pav-tec-010"
    type: "extension_guidance"
    reference: "Concrete Masonry and Hardscapes Association, Application Guide for Interlocking Concrete Pavements, PAV-TEC-010; https://www.cmha.org/resource/pav-tec-010/"
    used_for: "Independent material/pressure-vibration/paver function context; actual specification and test evidence required. Application dimensions and ratings are not defaults."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General Guide for LCA - Detailed Guidance, first edition March 2010, sections 7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision; exchange-specific determining physical causality; residual actual-state process-gate market value and counterexamples. Foreground accounting rules are explicit operationalization, not claims of paver chemistry or an industry ratio."
  - id: "epa-concrete-batching-2012"
    type: "official_guidance"
    reference: "US EPA, AP-42 section 11.12 Concrete Batching, June 2006 with January 2012 editorial corrections; https://www.epa.gov/sites/default/files/2020-10/documents/c11s12.pdf"
    used_for: "Batching raw handling/dust-control context and distinction between ready-mix and concrete products. No emission factor or curing/chemistry/allocation claim adopted."
