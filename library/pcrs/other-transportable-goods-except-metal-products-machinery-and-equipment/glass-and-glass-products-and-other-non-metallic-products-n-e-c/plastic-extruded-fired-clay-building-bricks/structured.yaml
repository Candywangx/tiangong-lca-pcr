allocation_rules:
  - rule_id: a_scope
    applies_to: "all assigned loads"
    rule: "Use this attributional inventory only where its allocation context and goal/scope justify allocation. The industrial route references do not establish LCA allocation. Do not impose substitution, avoided-production credit or a fixed allocation ratio."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_subdivide
    applies_to: "each exchange"
    rule: "First assign dedicated stages, meters and actual material/energy demands exclusively; then use documented subdivision or feasible virtual subdivision. A shared kiln does not make all clay, heat, emissions, tooling or downstream services one common burden."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_causality
    applies_to: "each remaining joint exchange"
    rule: "For genuinely remaining joint exchange i, establish the determining physical causal relationship to actual products/services using measured response and relevant thermal state, processing demand or material reaction. A convenient mass/time/volume proxy alone is insufficient; different exchanges may need different demonstrated relationships. Preserve gross mass/species/pack/asset balances before any burden allocation."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_residual
    applies_to: "residual common-process burden only"
    rule: "Only after documenting why physical causality cannot resolve a specific residual, use contemporaneous market values of all real co-functions at the same common-process gate in their actual condition/quality/bulk state. Derive that gate value transparently if only downstream prices exist, removing later processing/packing/transport. Handle zero/negative prices and waste treatment explicitly; do not clip them into arbitrary positive values. Dedicated later service remains separate; internal rework or a recyclable waste is not automatically a coproduct."
    source_ids:
      - jrc-ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first quality release"
      record_type: "release and weighing record"
      raw_fields: "cohort ID; grade; original release ID; first-release timestamp; calibrated gross tare net mass; product moisture; actual fired geometry; coring; quality tests and disposition; failed mass; opening closing FG; gross dispatch G; returned R; original shipment link"
      collection_method: "Weigh complete accepted units on a calibrated scale with actual tare and packaging excluded; retain specification-specific dimensions, coring, strength/absorption and other real tests. Sum unique first releases only."
      unit: "kg"
      frequency: "each release and stock boundary"
      temporal_coverage: "complete actual manufacturing cohort"
      site_scope: "all manufacturing and FG gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; tare checks; quality decision; unique-release reconciliation"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each supplied material"
      record_type: "receipt and stage records"
      raw_fields: "exchange ID; supplier; whole preparation; material mineralogy; supplied form; raw wet dry amounts; independent moisture; carbonate and organic carbon; structural water; supplier boundary; opening closing raw and stage WIP; unassigned stores; inherited vector by exchange; internal transfer IDs; every physical opening/closing raw/WIP/non-WIP pool quantity; gross-entry or already stock-adjusted consumption basis and corrections included"
      collection_method: "Retain raw receiving/weighing, assay and actual stage-use records for every supply; separately sample free/structural water and carbon origin. Receipts and internal issues are not two purchases."
      unit: "kg"
      frequency: "each receipt and batch boundary"
      temporal_coverage: "complete cohort including failures"
      site_scope: "supplier gate through site stages"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge; sample design; assay; stocks; transfer reconciliation"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "each utility and actual return"
      record_type: "meter and operating-mode record"
      raw_fields: "exchange ID; original readings and unit; kWh; true rates and interval or integrated amount; composition; actual standard gas state; independent density; LHV; carrier kg; supply return temperature pressure dryness enthalpy; provider water energy convention; startup idle cleanup failed modes; actual allocation evidence"
      collection_method: "Meter every real electrical/thermal/fuel input and external carrier return separately. Retain original states; do not multiply accumulated volume by time or derive unknown density from another substance."
      unit: "MJ; m3; kg"
      frequency: "each operating interval"
      temporal_coverage: "complete cohort including zero output"
      site_scope: "all actual plant utility gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; meter states; gas assays; heat and enthalpy records; mode logs"
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "inbound freight"
      record_type: "consignment record"
      raw_fields: "shipment ID; material; payload; distance; vehicle; load state; empty return boundary; original service unit"
      collection_method: "Record actual payload and supported route distance for undivided t km; keep freight separate from carried material mass."
      unit: "t km"
      frequency: "each actual shipment"
      temporal_coverage: "actual incoming material cohort"
      site_scope: "mine supplier to site"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets; payload; route evidence"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each actual waste stream"
      record_type: "removal and analysis record"
      raw_fields: "waste ID; origin stage; wet mass; independent solids water composition; actual species; retained amount; internal reuse; destination; treatment receipt; rework energy"
      collection_method: "Weigh each actual stream, independently sample water/solids/species and reconcile origin, retention and destination including failed batches."
      unit: "kg"
      frequency: "each removal and representative sample"
      temporal_coverage: "all batch and stock intervals"
      site_scope: "actual waste transfer gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets; calibration; lab limits; wet dry reconciliation"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each actual environmental species"
      record_type: "speciated inlet outlet sampling"
      raw_fields: "species; formula; phase; source origin; compartment; gross inlet outlet; dry wet gas conditions; measured concentration; actual rate and interval or integrated volume; independent density; free structural reaction water; relevant element assay; detection limit; uncertainty"
      collection_method: "Use independent actual species and state evidence, with source-specific carbon and water analysis. Retain indicators separately and distinguish unmeasured, below-limit and evidenced absent; no total-to-species invention."
      unit: "kg"
      frequency: "representative intervals across all modes"
      temporal_coverage: "complete cohort with sampling limits"
      site_scope: "each intake stack fugitive and water boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "method; limits; state; independent mass and element reconciliation"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "each packaging material and destination"
      record_type: "gross custody ledger"
      raw_fields: "material design ownership ID; measured mass moisture; opening closing empty WIP-attached FG-attached reusable stocks; purchase; inbound supply packaging; external return received; gross dispatch packaging; external return sent; waste; internal reuse; attached residues; supplier burden convention; original cohort; actual new/removed repair-component identities and masses; measured X_in/X_out by material/water phase and source/destination; independent dry matter/water and full wet stock quantities; other-flow dedup; independent repair-board identity and wet/dry mass; liquid-water supplier and actual supply mass; atmospheric water phase and measured uptake; separately removed board; liquid wastewater assay/destination; speciated current-air H2O; actual permission postchecks acceptance/disposition; disjoint repair custody; original Qc/H; P paid acquisition and bundled-paid evidence; first independent N_ext nonpurchase receipt and contract/fee basis; same-item prior S/EO ID for ER; owner and custodian chain; original cohort/history; each exchange prior V/A/provider and native extensive unit; whole/component inclusion; gate/state/phase/medium/period"
      collection_method: "Count and independently weigh each package type, retain each raw movement and execute b_pack at manufacturing/service/combined gates. A return receipt is physical ingress, not a new manufacturing purchase; reconcile external receipts individually. Measure actual repair and water changes independently, retaining complete wet stocks and real ingress/egress together. Add each actually needed specific material/water row before numeric use; do not deduplicate against stock retention or invent a repair event. Resolve P/N_ext/I/ER/S/EO/W by actual event: P and N_ext are disjoint tagged subledgers on the same material-specific independent-entry card; I/ER/S/EO/W retain their distinct atomic cards. Evidence ER against that same item prior S/EO, owner/custodian and original cohort history; first independent nonpurchase receipt is N_ext, not a fabricated ER or stock. Retain every original native V/A/provider vector and b_pack context, without zero-filling unknown history. Obtain independent dry-material/moisture and gas/liquid phase evidence; measure actual totals, integrate only genuine rates and use independent same-state density only when needed, never a secondary property as measured density. Keep whole wet receipts once and actual completed original-cohort service burden even if FG stays held. Record every actual packaging movement and caused work load, including unapproved, failed or rejected work. Card-level permission, configuration, post-work checks and acceptance conditions govern work authorization and continued qualifying-stock eligibility only, not data capture: they never erase actual material/water ingress or egress, energy, waste or treatment. Record actual hold, disjoint repair-WIP or waste disposition once, without assumed restoration or new Q."
      unit: "kg"
      frequency: "each movement and stock boundary"
      temporal_coverage: "actual manufacture and cohort service H"
      site_scope: "plant and external packaging pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "tare; moisture; material counts; dispatch return and ownership evidence"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "original released-cohort incremental service"
      record_type: "original-cohort event record"
      raw_fields: "original release ID; Qc; observed H; opening closing FG; original inherited manufacturing vector; gross G; returned R; original shipment link; changed water mass; actual loss; damage; retest; actual incremental rework; all actual energy materials waste; service attribution; actual repair permission/specification scope; new/removed parts/material and water phase; required post-work tests; acceptance/disposition"
      collection_method: "Observe post-release events and gross physical movements with original cohort links. Preserve actual changed mass/moisture/loss; returns need not equal original delivered mass. Do not reverse first-release manufacture or generate new Q. Add any real extra service input/output as an atomic row. Verify governing permission and actual post-work acceptance/disposition before returning a worked brick to accepted stock; do not assume restorability or zero new water/loss."
      unit: "MJ; kg; m3"
      frequency: "each service event and stock boundary"
      temporal_coverage: "declared observed H for original Qc"
      site_scope: "packing storage handling dispatch returns"
      aggregation_rule: "per reference flow"
      quality_evidence: "cohort links; metering; loss records; physical bridge; horizon disclosure"
    - protocol_id: cp_allocation
      process_id: "manufacture"
      flow_role: "each assigned or genuinely joint exchange"
      record_type: "subdivision causality and residual-price evidence"
      raw_fields: "exchange ID; goal allocation context; dedicated meter or stage; virtual subdivision inputs; actual response to product change; thermal and reaction state; co-function quantity; common-process exit condition; contemporaneous gate market price and period; downstream price and removed later processing packing transport costs; zero negative price treatment; selected share and uncertainty"
      collection_method: "Collect dedicated measurements first, then documented subdivision or feasible virtual subdivision. Independently observe exchange-specific determining physical response; only for a justified unresolved residual collect contemporaneous actual common-gate values with condition and downstream-cost evidence. Preserve original raw extensive quantities before burden shares."
      unit: "row-native unit; price per actual gate quantity"
      frequency: "each relevant operation and valuation period"
      temporal_coverage: "actual manufacturing and original-cohort service periods"
      site_scope: "actual common-process gate and separately assigned service"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and subdivision workpaper; measured response; original dated prices; grade/state proof; removed-cost bridge; uncertainty"
    - protocol_id: cp_asset_m
      process_id: "manufacture"
      flow_role: "each actual asset tool component and fluid"
      record_type: "physical stock and service record"
      raw_fields: "asset ID; complete configuration; actual measured net mass; opening installed stock; new and used additions; components included in whole supply; separate replacements; repair; moisture; installed fluid; service events and demand; closing stock; retirement; inherited service vector; allocation evidence"
      collection_method: "Reconcile gross physical stock by actual component and measured configuration; determine only attributable asset-service equivalent demand from real service history. Impact vectors are not asset kg; service shares never shrink gross physical changes."
      unit: "kg"
      frequency: "each install repair service and stock boundary"
      temporal_coverage: "observed asset and cohort service records"
      site_scope: "actual machinery and fluid gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; scale; configuration; repair history; service basis; fluid balance"
    - protocol_id: cp_asset_s
      process_id: "service"
      flow_role: "each actual asset tool component and fluid"
      record_type: "physical stock and service record"
      raw_fields: "asset ID; complete configuration; actual measured net mass; opening installed stock; new and used additions; components included in whole supply; separate replacements; repair; moisture; installed fluid; service events and demand; closing stock; retirement; inherited service vector; allocation evidence"
      collection_method: "Reconcile gross physical stock by actual component and measured configuration; determine only attributable asset-service equivalent demand from real service history. Impact vectors are not asset kg; service shares never shrink gross physical changes."
      unit: "kg"
      frequency: "each install repair service and stock boundary"
      temporal_coverage: "observed asset and cohort service records"
      site_scope: "actual machinery and fluid gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; scale; configuration; repair history; service basis; fluid balance"
  calculation_rules:
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "Convert original units before attribution. Integrate genuine rates over measured intervals once; accumulated volumes are already integrated. Preserve row-specific extensive property. Independently evidence gas composition/density/state, LHV, enthalpy and measured mass; retain undivided raw_i."
      inputs:
        - original_reading
        - original_unit
        - actual_state
        - conversion_evidence
        - cp_material
        - cp_energy
        - cp_species
      output: "raw_i"
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - id: calc_manufacture
      applies_to: "manufacture"
      rule: "q_i = A_i / Q; A_i = dedicated assigned raw_i plus exchange-specific shares of genuinely joint raw_i plus opening raw/WIP/unassigned-store inherited burden_i minus corresponding closing raw/WIP/unassigned-store inherited burden_i. Preserve failure/idle/cleanup/rework. Closing already-released FG is excluded from Bclose. Q = unique first-release net kg from cp_release. Each numerator keeps its own native unit; q_i is per 1 kg reference flow. Perform this quotient once for Q>0. Current raw_i entering the stock bridge uses gross entry before the stated corrections. If the source already reports stock-adjusted consumption, preserve its included corrections and reconcile only unincluded remaining WIP/non-WIP or other vectors, not the same raw stock again. For custody-only physical movement disclosures, including an actual thermal-carrier Product return, replace this burden-stock numerator by the actual full gross leg V_i in its native extensive unit and use the same final q_i = V_i / Q once. Do not add inherited burden, stock-correct a measured gross leg, economically scale it or create another supply/provider/credit. Keep actual attributable manufacturing burdens in their separate vector; this exception is not permission to delete real supply or treatment loads."
      inputs:
        - raw_i
        - opening_vector_i
        - closing_vector_i
        - allocation_evidence_i
        - Q
        - cp_release
        - cp_allocation
      output: "q_i"
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
        - jrc-ilcd-detailed-2010
    - id: calc_service
      applies_to: "service"
      rule: "s_i = deltaA_i / Qc; deltaA_i is actual incremental post-release service load attributable to original cohort c over observed H. Qc is its original unique first-release net kg. Keep original inherited manufacturing vector with cohort c, never charge it again as service. Preserve package gross custody and count its original supply burden once. s_i is per 1 kg reference flow of that original cohort; no new Q, no second quotient and no future-service extrapolation. For every custody-only packaging/FG/asset movement card, the numerator is instead its actual full gross native leg V_i,c,H, reported by this same sole quotient V_i,c,H / Qc, not an allocated service-burden vector or Bopen + U - Bclose. Keep P/N_ext/I/ER/gross S/EO/W and actual material/water changes independently; no extra provider purchase, repeated historical burden, credit or economic scaling. Actual attributable supply/cleaning/repair/treatment burdens remain in deltaA_i separately with one original provider owner. Actually performed original-cohort services stay under original Qc/H even when serviced FG remains held at closing; only genuine unconsumed/unassigned service stores may carry forward."
      inputs:
        - original_release_id
        - Qc
        - H
        - deltaA_i
        - inherited_manufacture_vector
        - cp_service
        - cp_pack
      output: "s_i"
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
        - jrc-ilcd-detailed-2010
    - id: calc_zero
      applies_to: "manufacture; service"
      rule: "For Q=0 or Qc=0 retain actual loads and stocks in the zero-output ledger and issue no unit result. Never remove failed batches or fabricate a denominator."
      inputs:
        - Q
        - Qc
        - raw_i
        - cp_release
        - cp_service
      output: "zero_output_ledger"
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
        - jrc-ilcd-detailed-2010
    - id: calc_physical
      applies_to: "manufacture; service; combined"
      rule: "Opening physical stock plus every actual ingress equals closing stock plus every actual egress at each gate; consolidate by cancelling internal transfers once. Independently reconcile relevant elements and actual species/water phases using independent measured evidence and uncertainty. Gross FG movements include G/R, historical opening stock, actual changed water/loss and original cohort. Do not scale physical totals by economic shares or solve two unknowns from one residual."
      inputs:
        - physical_open
        - physical_in
        - physical_close
        - physical_out
        - species_assay
        - element_assay
        - state_evidence
        - cp_release
        - cp_service
      output: "physical_gate_reconciliation"
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - id: calc_pack
      applies_to: "each packaging material"
      rule: "Execute the complete b_pack physical equation for every material/design/ownership at each gate. Keep P paid acquisition (including documented bundled-paid), N_ext first independent external nonpurchase receipt, I attached supply, genuine same-item ER, each stock class, gross S, EO and W separate. Aggregate the P and N_ext tagged subledgers of each existing material independent-entry card once, retaining separate gross native legs and complete prior vectors. Require same-item prior S/EO, owner/custodian/original cohort history for ER and the full b_pack context for all entries; unknown history is not zero. Count freight and actual service increments once, supplier-included burden and original manufacture once under original Qc/H. Cancel only internal reuse. No additional purchase, brick Q or automatic coproduct credit is generated. Include the actual separately measured material/water X_in/X_out required by b_pack, disjoint from other flow terms but never cancelled against retained stock. No extra X duplicates a wet article already measured in another receipt/exit."
      inputs:
        - pack_open
        - pack_purchase
        - external_nonpurchase_entry
        - inbound_pack
        - external_return_received
        - pack_close
        - gross_pack_dispatch
        - external_return_sent
        - pack_waste
        - cp_pack
      output: "packaging_custody_reconciliation"
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each product and species"
      requirement: "Verify actual material/form/terminal/native restrictions and supplier boundary; distinguish compatible family from a quantified provider process."
      evidence: "exact native identity; supplier specification; drawings; route; acceptance"
    - id: dq_raw
      applies_to: "each raw record"
      requirement: "Preserve original units, calibration, sampling representativeness, uncertainty and detection limits across all productive/nonproductive modes. Unknown is not zero."
      evidence: "raw meter; lab method; calibration; mode log"
    - id: dq_stocks
      applies_to: "each cohort and physical gate"
      requirement: "Require per-exchange inherited raw/WIP vectors, physical released FG bridge and original-cohort services; separate asset stocks from services and preserve full package custody. Audit disjoint P/N_ext/I/ER event labels, bundled-paid versus upstream-included evidence, same-item prior S/EO for ER, owner/custodian/original cohort chain and complete prior V/A/provider/native-unit/whole-component/gate/state/phase/medium/period/history; unresolved history remains explicit."
      evidence: "stock counts; original release links; packaging and asset ledger"
    - id: dq_sources
      applies_to: "each method or quantitative claim"
      requirement: "Industrial evidence supports qualitative route and counterexamples only. Quantities and chemistry require real foreground evidence; ILCD alone supports the allocation hierarchy and its scope."
      evidence: "source locators; direct identity; actual measurements; allocation justification"
    - id: dq_service_horizon
      applies_to: "post-release services"
      requirement: "Disclose observed H and original Qc and any unobserved future logistics/returns; do not claim lifetime completeness or infer a new release from delivery."
      evidence: "cohort service events; H; actual G/R and loss bridge"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference product; each adopted UUID"
    rule: "Verify complete native physical identity, every basename/synonym/comment/grade/route/form/geography/media/type and all property/unit chains. Match actual clay building-brick terminal and supplier conditions. A taxonomy discrepancy cannot waive a hard material/CAS/phase/route/state conflict. An unconfirmed core reference identity blocks usable methodology."
    source_ids:
      - bia-brick-manufacturing-2006
      - jrc-ceramic-bref-2007
      - epa-brick-structural-clay-1997
  - rule_id: v_qualifiers
    applies_to: "reference flow"
    rule: "Declare every required qualifier and actual quality acceptance evidence. No universal recipe, kiln temperature, energy demand, strength class, density, mass per item or service life is supplied by this PCR. A mass-equivalent kg of complete units does not mean one brick weighs one kg."
    source_ids:
      - bia-brick-manufacturing-2006
      - jrc-ceramic-bref-2007
      - epa-brick-structural-clay-1997
  - rule_id: v_denominator
    applies_to: "all inventory rows"
    rule: "Retain undivided original records; convert units/rates and assign real exchange loads and stock vectors before exactly one A/Q or deltaA/Qc calculation. Cards and collection aggregation reference that single result. Q=0 retains loads and yields no unit result. Both languages use first release, not net delivery."
    source_ids:
      - bia-brick-manufacturing-2006
      - jrc-ceramic-bref-2007
      - epa-brick-structural-clay-1997
      - jrc-ilcd-detailed-2010
  - rule_id: v_stocks
    applies_to: "manufacture; service; combined"
    rule: "Verify complete raw/WIP inherited vectors and released FG physical bridge, retaining original FG manufacture. Check original-cohort H/Qc service attribution, gross shipments/returns, no second release Q and one cancellation of internal Q. Do not subtract closing released-FG manufacturing burden."
    source_ids:
      - bia-brick-manufacturing-2006
      - jrc-ceramic-bref-2007
      - epa-brick-structural-clay-1997
      - jrc-ilcd-detailed-2010
  - rule_id: v_physical
    applies_to: "each physical gate"
    rule: "Reconcile actual masses and relevant elements at manufacture, service and combined gates independently from species/reaction-water evidence. Account for air species without a second aggregate air exchange, real heat-carrier returns and material-specific packaging/asset/fluid stocks. Explain measured uncertainty and unknowns, never force residual closure. Verify each real independent P/N_ext entry, I and ER is recorded once with same-item prior S/EO evidence for ER and the complete b_pack prior vector/context. Reject omission of a first independent loan or its relabeling as ER, opening, internal reuse or repair/moisture X; preserve gross stocks/S/EO/W and actual incremental transport/service with one provider burden owner."
    source_ids:
      - bia-brick-manufacturing-2006
      - jrc-ceramic-bref-2007
      - epa-brick-structural-clay-1997
  - rule_id: v_completeness
    applies_to: "each process and row"
    rule: "Every actual material, fuel, utility, package, waste and species needs an atomic identity, native numerator unit, raw collection, calculation, source link and destination. Conditional absence requires evidence; unknown is not zero. Add real missing flows. Generic family identity is not a quantitative provider dataset; unresolved auxiliary bindings require later qualified lookup."
    source_ids:
      - bia-brick-manufacturing-2006
      - jrc-ceramic-bref-2007
      - epa-brick-structural-clay-1997
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Downstream LCA of declared building-brick grade and manufacturing route"
  allowed_use: "Attributional manufacturing inventory for actually compatible terminal/supply; original-cohort H services disclosed separately"
  excluded_use: "Whole 37350-leaf coverage; refractory/concrete/tile/tableware routes; universal recipe/factors; lifetime or installed-performance equivalence; science/mapping approval"
  required_metadata: "actual clay deposit and whole supplied form; mineral composition and carbonate/organic carbon origin; free and structural water evidence; body recipe and actual separate additives; non-refractory building-brick terminal; plastic extrusion and cutting configuration; actual fired geometry and coring; unglazed and without applied engobe or surface coating; drying and gas-fired tunnel-kiln route; actual heat recovery and supplemental burner boundary; firing atmosphere and measured thermal history; actual finishing and quality test specification; actual strength and water absorption results; unique first quality release ID and cohort Q; calibrated net product mass and moisture basis; complete failed/idle/rework and WIP inherited vectors; actual supplier and every native flow restriction; all actual species and external destinations; asset service basis separate from physical stocks; packaging gross custody balances; original-cohort service horizon H and Qc; allocation purpose and source-specific evidence; no installation/use-life performance equivalence"
  required_quality_disclosure: "Raw measurements/missingness; native restrictions; source applicability; species/reaction water; stocks/failures; allocation; assets/packages; future service beyond H; uncertainty"
  update_trigger: "Actual route/material/terminal/quality/supply change; new species; native identity/evidence change; real data refresh; science and translation review"
