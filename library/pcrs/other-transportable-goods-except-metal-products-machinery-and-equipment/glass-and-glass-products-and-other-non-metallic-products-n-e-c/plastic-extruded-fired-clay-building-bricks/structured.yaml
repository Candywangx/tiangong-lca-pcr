    used_for: "Supply/extrusion/tunnel-kiln/dryer source boundaries; actual potential species, raw-material sulfur/fluorine/chlorine, organics, controls and gas destinations. Source/table-footnote limitations only; no emission factors or TOC/NOx-to-molecule conversion; no LCA allocation support."
