    used_for: "Brick feed preparation/extrusion/drying/firing/finishing and physical flows; Figures2.8/2.13, Tables2.1–2.4 and adjacent refractory/tile counterexamples. No recipe, temperature, energy or roof-tile ratio adopted; no LCA allocation support."
