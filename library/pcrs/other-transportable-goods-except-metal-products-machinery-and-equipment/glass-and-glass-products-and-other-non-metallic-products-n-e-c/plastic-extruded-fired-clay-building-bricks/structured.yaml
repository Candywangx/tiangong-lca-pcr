system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Include actual clay receipt/haulage, storage, crushing/screening/blending/ageing, water tempering and kneading, vacuum de-airing where used, plastic extrusion/cutting, loading, drying, gas-fired tunnel firing/cooling, unloading, actual mechanical finishing and tests through first quality release. Sources describe routes, not one factory recipe."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_supply
      applies_to: "each incoming product"
      rule: "Retain extraction and supplier preparation upstream for actual incoming clay and every other Product. Disclose mine-gate versus delivered supply, actual freight and actual on-site work; supplier crushing never removes real on-site crushing. Do not replace manufacturing with bought-fired-brick packing."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_manufacture_stock
      applies_to: "manufacture"
      rule: "Carry an inherited burden vector for every exchange in opening/closing raw material, WIP at each physical stage and not-yet-assigned non-WIP material stores. Include all failures, zero-output runs, start/stop, hot hold, idle, cleanup and genuine rework. Bclose for manufacture excludes already-first-released FG; its manufacturing burden remains with Q. Physical mass stocks still include all FG. Independently measure each opening/closing raw/WIP/non-WIP physical quantity separately from its full inherited exchange vector. Distinguish gross receipts/pool entries before stock correction from already stock-adjusted consumption; retain corrections included and never correct the same raw stock twice."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_service
      applies_to: "service; combined"
      rule: "Retain actual post-release packaging, storage, handling, shipping, returns, retesting and incremental rework over observed H, assigned to each original cohort Qc. Delivery/retest/re-release never creates new Q. Cancel the internal manufacture-to-service Q transfer once on consolidation; do not add Q and its closing FG as two production outputs. Historical opening FG retains original manufacture, not current-manufacture reassignment. Unobserved future service is disclosed. Actual post-release repair/regrinding/refiring requires documented governing manufacturer/specification permission, continued declared brick-grade/route applicability, actual added/removed parts/material and free/bound water, required post-work tests and acceptance or waste disposition. Original forming/reject recycling evidence is not permission to restore a failed released brick."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_atoms
      applies_to: "all inventory rows"
      rule: "One card is one actual supplied material/formulation/article, one waste stream or one real environmental species/physical particulate stream. Whole formulations are purchased once; assay, carrier water and active content are subaccounts. Actual on-site formulation retains each purchased ingredient, energy and loss separately. Add individually identified real missing exchanges; no generic other bucket, hidden zero or inferred absence."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_species
      applies_to: "manufacture; physical gates"
      rule: "Reconcile total physical mass and relevant C/H/O/N/S/Cl/F/mineral elements independently from actual species and reaction evidence. Measure free water, released/retained structural water, combustion reaction water, condensate and vapour separately. Ignition loss, COD, TOC, VOC, NOx, total metal and particle size do not identify molecular masses; one residual cannot solve two unknowns."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_energy
      applies_to: "each utility"
      rule: "Keep electricity, whole fuel mixture, heat and carrier mass distinct. Record original extensive units and actual meter state; integrate only genuine rates. External steam/hot-water/returns require actual mass and thermodynamic states plus provider water/energy convention. Internal recovered heat and carrier transfers cancel; do not create a nonexistent boiler or duplicate a whole provider inventory with its attributes."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_pack
      applies_to: "each packaging material; manufacture; service"
      rule: "For each material/design/ownership, opening empty + attached-WIP + attached-FG + reusable stock + purchases P + first independent external nonpurchase entries N_ext + packages received with supplies I + genuine external return received ER + X_in = corresponding closing stocks + packaging leaving on gross physical shipments + external return sent + waste + X_out. Separate every destination, moisture and attached residual. Internal reuse cancels, without another purchase, brick Q, automatic coproduct or credit. Physical custody totals are never reduced by economic allocation. When actual repair or moisture changes occur beyond other measured receipt/removal flow terms, include independently measured X_in and X_out on their respective incoming/outgoing sides. Identify each real added/removed material/component and water phase as a specific atomic exchange before dataset completion. Deduplicate ONLY against other flow terms, never opening/closing stocks: actual retained water/repair material remains in BOTH its real inflow and full closing wet physical mass, and actual removal remains in its real outflow and full opening stock. Material/water already inside a measured whole-article receipt or exit is counted there once, not again X. Independently reconcile dry matter/water, sources/phases/destinations and every inherited burden vector, without residual-fitting unknowns, assuming uptake/repair, dry wood/species or shrinking physical quantity by allocation. Supplier-included packaging burden is not purchased again. P is an actual paid acquisition of this whole packaging article, new or used, including a documented bundled-paid acquisition; N_ext is its first independent external borrowed, rented or entrusted whole-article receipt without a purchase of the article. A rental/service fee is not an article purchase. Classify each actual entry once: P and N_ext use the same material-specific independent-entry card with separate event subledgers, I uses its attached-supply card, and ER uses its return card. Supplier-included packaging attached to another supplied good stays I with one upstream burden owner; do not split out another P merely because the delivered supply price is bundled. ER requires evidence that this same identified item previously left this custody pool on S or EO, with linked owner, custodian, original cohort and prior outward event; a first independent loan without that history is N_ext, never ER, opening stock, internal reuse or X. Preserve for every exchange its complete prior V/A/provider vector, original native extensive amount/unit, whole-article/component inclusion, gate, state, phase, medium, period and original history. Unknown prior burden remains unknown, not zero; identify the actual provider convention before quantitative use. Keep full gross S, EO, W and stocks; count actual freight and incremental service once under original Qc/H, with original manufacture and supplier-included burden once."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_assets
      applies_to: "each asset and component"
      rule: "Reconcile complete machine/kiln/car/die/refractory physical stock, new and used additions, repairs, removals, moisture and in-machine fluid independently from current service burden. Collect genuine service history and attributable demand; never prescribe fixed life or charge one whole asset per kg. Whole-asset components remain subaccounts unless separately purchased; actual replacements and spent parts each get their own exchange."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
    - rule_id: b_output_gate
      applies_to: "manufacture; service"
      rule: "Q is newly first quality-released net kg of complete conforming building bricks only, never dispatch net of returns, area, green ware or total fired charge. Net delivery would require a different method with gross G/R and original delivery-specific burden reversal D_rev plus independent changed mass/water/loss and incremental rework; do not substitute it into this first-release denominator."
      source_ids:
        - bia-brick-manufacturing-2006
        - jrc-ceramic-bref-2007
        - epa-brick-structural-clay-1997
