allocation_rules:
  - rule_id: a_scope
    applies_to: "each study"
    rule: "Use this attributional hierarchy only where the goal/context requires partitioning; disclose why substitution is not used. No freely interchangeable physical/economic keys, fixed shares or automatic avoided-product credit. Industrial process evidence is not allocation authority."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_subdivide
    applies_to: "each exchange"
    rule: "First separately meter dedicated body/glaze lines, product grades, pressing/firing/finishing and logistics; use physical or defensible virtual subdivision to assign exclusive exchanges directly, including grade-specific pigment, tests and genuine failure loads. Document infeasibility and material distortion when subdivision is not possible."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_causal
    applies_to: "remaining joint exchanges"
    rule: "For each still-joint exchange demonstrate the determining physical causal relation to actual functions. Metered thermal demand, residence/load, actual constrained freight capacity or service occupancy may differ by exchange; area, mass, item count or time is not automatically the correct driver. Retain explanatory tests, units and sensitivity, rather than one plant-wide mass split."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_residual
    applies_to: "genuinely residual exchanges"
    rule: "Only the remaining inseparable noncausal residual may use actual contemporaneous market values at the common process gate, actual quality/condition/amount and currency/period. Remove later packaging/conditioning/transport value from downstream prices. Record genuine co-functions, price evidence, residual exchanges, uncertainties and sum-to-one assigned shares. Physical custody is not downscaled."
    source_ids:
      - jrc-ilcd-detailed-2010
  - rule_id: a_no_credit
    applies_to: "waste; rework; returned assets"
    rule: "Recycling, external sale, a returned package or kiln condensate is no automatic substitution credit or coproduct. Preserve causing-cohort failure/treatment burden unless an evidenced independent function and explicit approved handoff allocate one vector once. Internal recirculation cancels physical transfers without deleting actual energy/loss."
    source_ids:
      - jrc-ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "finish"
      flow_role: "unique first release"
      record_type: "measurement"
      raw_fields: "release_id; original_cohort; design_revision; geometry_class; actual_outline; holes_cutouts; measured_dimensions; projected_area; net_mass; moisture_state; acceptance_tests; calibration; uncertainty; samples; failures; Q"
      collection_method: "Measure actual single-face projected finished outlines using calibrated dimensions/planimetry and traceable design drawings. L×W only for verified rectangles; other shapes use actual drawing-specific geometry, not bounding boxes. Measure net mass independently. Deduplicate unique first release IDs after all required finishing/tests; preserve Q=0."
      unit: "m2; kg; original dimensions"
      frequency: "each design and release event"
      temporal_coverage: "full cohort including failures and opening/closing WIP"
      site_scope: "actual plant and finished configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; drawing revision; geometry proof; acceptance and nonconformance records"
    - protocol_id: cp_material
      process_id: "plant_services"
      flow_role: "each supplied material"
      record_type: "receipt_and_stock"
      raw_fields: "row_id; supplier; supplied_form; whole_receipt; stage_issues; external_ingress; recipe; assay; carrier_water; free_structural_water; original_unit; lot; new_used; X_in; X_out; opening_stock; closing_stock; inherited_vector; uncertainty ; actual_process_id; actual_gate; row_id; event_time; original_cohort"
      collection_method: "Collect undivided whole supplied receipts and actual stage issues with calibrated weighing, invoices and independent composition/moisture records. Account purchases once; assays/active/water are subaccounts. Retain real ingress and complete wet closing stock simultaneously. Bind upstream preparation/haulage once. This definition is shared under plant_services and instantiated separately for each referencing card actual process/row/gate/time window. Do not pool different stage totals or duplicate master/submeter records; retain actual process/row/gate/cohort linkage."
      unit: "original unit; kg"
      frequency: "each receipt, issue and stock close"
      temporal_coverage: "complete cohort and adjacent opening/closing stores"
      site_scope: "each actual supplier and plant stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "scales; supplier declaration; mineral/species lab data; mass and inherited-vector ledgers"
    - protocol_id: cp_energy
      process_id: "plant_services"
      flow_role: "each electricity, fuel and heat service"
      record_type: "meter_and_state"
      raw_fields: "row_id; meter; original_reading; original_unit; accumulated_or_rate; interval; actual_state; composition; measured_density; carrier_mass; LHV; inlet_enthalpy; outlet_enthalpy; provider_water_heat_convention; operating_mode; dedicated_or_joint; inherited_vector ; actual_process_id; actual_gate; row_id; event_time; original_cohort"
      collection_method: "Collect undivided readings and actual productive/failed/start/stop/idle/hot-hold/cleanup loads. Identify accumulated totals versus rates, integrate rates only once and document original unit conversion. Measure fuel/heat carrier properties independently, not from water defaults or native secondary coefficients. Keep internal heat recovery and external supplies/returns separate. This definition is shared under plant_services and instantiated separately for each referencing card actual process/row/gate/time window. Do not pool different stage totals or duplicate master/submeter records; retain actual process/row/gate/cohort linkage."
      unit: "kWh; MJ; m3; kg; original rate unit"
      frequency: "each meter interval and event"
      temporal_coverage: "full cohort and observed service horizon"
      site_scope: "actual voltage, geography, provider and stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; gas analysis; thermodynamic records; provider convention; mode logs"
    - protocol_id: cp_water
      process_id: "plant_services"
      flow_role: "each actual water phase and return"
      record_type: "meter_and_phase"
      raw_fields: "row_id; phase; temperature; pressure; mass; accumulated_volume; rate; density_measurement; dissolved_solids; free_structural_reaction_origin; supplier_owner; external_return; original_unit; wet_open; wet_close; X_in; X_out ; actual_process_id; actual_gate; row_id; event_time; original_cohort"
      collection_method: "Collect each real external water ingress/egress and thermal state without netting closing water against true ingress. Independently measure density at the actual substance state; cumulative volumes are not re-integrated. Whole purchased solutions and water already in materials remain non-additive subaccounts; internal circulation cancels. This definition is shared under plant_services and instantiated separately for each referencing card actual process/row/gate/time window. Do not pool different stage totals or duplicate master/submeter records; retain actual process/row/gate/cohort linkage."
      unit: "kg; m3; actual state units"
      frequency: "each transfer, sampling and stock close"
      temporal_coverage: "full cohort and service H"
      site_scope: "actual water provider, circuit and destination"
      aggregation_rule: "per reference flow"
      quality_evidence: "density and phase measurements; calibration; water and solids assays; thermal state"
    - protocol_id: cp_species
      process_id: "plant_services"
      flow_role: "each real molecular species or particulate matrix"
      record_type: "speciation_and_state"
      raw_fields: "row_id; inlet_outlet; stage; medium; species; CAS_or_phase; carbon_origin; concentration; wet_dry_basis; gas_state; accumulated_volume; rate; interval; mass; reaction_evidence; element_assay; detection_limit; uncertainty; particulate_overlap ; actual_process_id; actual_gate; row_id; event_time; original_cohort"
      collection_method: "Measure actual inlet/outlet species and physical matrices by independent representative sampling and validated gas/phase methods. Convert original concentration/volume bases before attribution. Separate chemical speciation and reaction/free/structural water from full mass/element closure. Do not solve two unknown species with one residual or convert indicators into a molecule; retain nondetects and uncertainty. This definition is shared under plant_services and instantiated separately for each referencing card actual process/row/gate/time window. Do not pool different stage totals or duplicate master/submeter records; retain actual process/row/gate/cohort linkage."
      unit: "original concentration/state units; kg"
      frequency: "representative continuous/periodic samples plus abnormal events"
      temporal_coverage: "all operating modes and temporal coverage of cohort"
      site_scope: "each actual inlet/outlet and environmental medium"
      aggregation_rule: "per reference flow"
      quality_evidence: "lab methods; detection limits; calibration; independent phase/species/reaction evidence"
    - protocol_id: cp_waste
      process_id: "plant_services"
      flow_role: "each actual waste stream"
      record_type: "waste_transfer"
      raw_fields: "row_id; wet_mass; solids; free_structural_water; matrix; attached_residual; destination; internal_reuse; external_sale; cause_cohort; treatment; inherited_vector; independent_handoff; uncertainty ; actual_process_id; actual_gate; row_id; event_time; original_cohort"
      collection_method: "Weigh whole actual waste by stream and destination, retain its non-additive water/solids subaccounts and genuine treatment. Internal recycle is a stage transfer with actual energy/loss, not another purchase. Ordinary failure/sample waste burdens stay with cause even on external sale. This definition is shared under plant_services and instantiated separately for each referencing card actual process/row/gate/time window. Do not pool different stage totals or duplicate master/submeter records; retain actual process/row/gate/cohort linkage."
      unit: "kg; original units"
      frequency: "each removal, reuse and treatment receipt"
      temporal_coverage: "all failures, samples, cleanup and stocks"
      site_scope: "actual waste generator and real treatment boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge; waste manifest; composition; treatment and handoff records"
    - protocol_id: cp_asset
      process_id: "plant_services"
      flow_role: "each asset, replacement and installed fluid"
      record_type: "physical_stock_and_service"
      raw_fields: "asset_id; row_id; new_used_repair; full_physical_open; all_additions; full_physical_close; removals; installed_water_oil; moisture; X_in; X_out; embodied_vector; prior_service; current_attributable_service; actual_driver; remaining_owner ; actual_process_id; actual_gate; row_id; event_time; original_cohort"
      collection_method: "Reconcile complete physical stock and every real new/used/repair/removal, with water/oil and components measured independently. X_in/X_out deduplicate only other ingress/egress. Collect genuine attributable service history and inherited burden vectors separately; no assumed lifetime or whole-machine-per-m2 charge. This definition is shared under plant_services and instantiated separately for each referencing card actual process/row/gate/time window. Do not pool different stage totals or duplicate master/submeter records; retain actual process/row/gate/cohort linkage."
      unit: "kg; original count; service driver units"
      frequency: "each asset/repair event and service interval"
      temporal_coverage: "complete real asset history and cohort interval"
      site_scope: "actual configuration, asset owner and service demand"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; weighing; maintenance records; service meters; burden owner and uncertainty"
    - protocol_id: cp_pack
      process_id: "packaging"
      flow_role: "each material/design/owner custody"
      record_type: "gross_custody"
      raw_fields: "row_id; material; design; owner; actual_gate; original_cohort; empty_open; WIP_attached_open; FG_attached_open; reusable_open; purchased; supplier_included; external_return_received; empty_close; WIP_attached_close; FG_attached_close; reusable_close; gross_shipped; external_return_sent; waste; internal_reuse; moisture_residuals; one_upstream_owner; service_vector ; actual new/old repair parts wood residues and water-phase X_in_material_water/X_out_material_water; duplicate-flow-term register; measured complete closing moisture/composition; paid_acquisition_P; bundled_paid_event; first_external_nonpurchase_N_ext; true_return_ER; item_or_item_lot; prior_outward_event; gross_shipment_S; external_owner_return_EO; supplier_included_event_owner"
      collection_method: "Collect undivided gross physical quantities separately for all b_pack terms, by actual gate and original cohort. Verify material identity independently; retain supplier-included ingress even with included price/upstream burden. Reconcile custody without economic scaling; service burden is a separately owned vector, not each physical custody crossing purchased again. Apply actual b_pack X terms and deduplicate only other flow terms; actual ingress and retained closing mass coexist. Separate manufacture, service and pre-H history by real event time, without repeating old receipts or upstream burden. P includes separately invoiced and bundled-price paid acquisitions exactly once, whether new or previously used. N_ext is first external non-purchase ingress, including genuinely non-purchased supplier-provided, gifted or loaned articles; it is an input, never an outgoing return. Supplier-included is provenance, not another additive ingress if the same event is already in P or N_ext. ER requires the same item or traceable item-lot and its prior outward event; a first external supply is not ER. Keep gross shipment S and external-owner return sent EO as separate outward legs. Retain actual owner, event, paid/bundled/non-purchase classification and one upstream burden owner; price inclusion does not create a second provider purchase."
      unit: "kg; original count with measured net article mass"
      frequency: "each ingress, gross dispatch, return, waste and stock close"
      temporal_coverage: "manufacture and full observed original-cohort H"
      site_scope: "each material/design/owner at actual gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "package material specification; scale; custody stock ledger; supplier ownership convention"
    - protocol_id: cp_service
      process_id: "post_release"
      flow_role: "original-cohort increments and FG bridge"
      record_type: "cohort_event"
      raw_fields: "original_release_id; Qc; H; inherited_manufacture_vector; opening_FG; closing_FG; gross_G; gross_R; original_delivery_id; actual_return_mass_water_loss; incremental_energy; tests; permission; rework; acceptance; disposition; treatment ; actual new/removed parts material water fragments and phase records; repair-held FG substate or disjoint repair-WIP; performed service versus genuine unused unassigned inventory; actual_unused_unassigned_charge_service_store_vectors; performed_service_evidence"
      collection_method: "Preserve original released cohorts including historical opening FG. Collect only actual incremental packing/storage/handling/dispatch/return/retest/permitted-rework and waste over observed H, plus the full physical FG bridge. Trace each return to original delivery and independently measure changed water/mass/loss; never infer equality or new production from delivery/retest. Apply b_failure permission/postwork tests/acceptance-disposition per event; retain actual material/water changes and repair custody once. Performed original-cohort service is not deducted because FG stays held."
      unit: "m2; kg; native extensive service units"
      frequency: "each event and horizon close"
      temporal_coverage: "observed H with unobserved future service disclosed"
      site_scope: "original released cohort and actual service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "original release/delivery records; tests and permission; meters; gross stock and loss records"
    - protocol_id: cp_transport
      process_id: "plant_services"
      flow_role: "each actual freight movement"
      record_type: "transport_activity"
      raw_fields: "trip; actual_mode; route; distance; actual_loaded_mass; volume_capacity; empty_return; load_factor; upstream_delivery_owner; cohort; H; allocation_evidence ; actual_process_id; actual_gate; row_id; event_time; original_cohort"
      collection_method: "Retain actual trips and original mass/distance units, including abnormal/return trips and constrained capacity. A delivered upstream provider and a foreground freight service cannot both own the same trip. This definition is shared under plant_services and instantiated separately for each referencing card actual process/row/gate/time window. Do not pool different stage totals or duplicate master/submeter records; retain actual process/row/gate/cohort linkage."
      unit: "kg; km; t km"
      frequency: "each actual trip"
      temporal_coverage: "manufacture and observed cohort service H"
      site_scope: "actual route and load scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "trip log; weighbridge; distances; load/capacity and provider ownership"
    - protocol_id: cp_allocation
      process_id: "plant_services"
      flow_role: "exchange-specific multifunctionality"
      record_type: "method_evidence"
      raw_fields: "study_goal; context; dedicated_exchange; subdivision; virtual_subdivision; infeasibility; determining_causal_driver; measured_function; residual_exchange; common_gate; condition; period; price; currency; uncertainty; handoff_owner"
      collection_method: "Collect actual evidence for a_scope through a_residual separately for each exchange. Retain raw totals before shares and normalization; prove shares sum to one only for genuine jointly allocated burden. Gross physical stock/custody/species is not reduced by economic shares."
      unit: "native extensive quantities; actual value/currency units"
      frequency: "each decision and material change"
      temporal_coverage: "consistent study period and real common gate"
      site_scope: "actual co-functions and exchanges"
      aggregation_rule: "per reference flow"
      quality_evidence: "metering; causal evidence; current condition/gate-matched prices; sensitivity; documented handoff"
  calculation_rules:
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw original units and actual rates into the row extensive unit before burden assignment. Electricity kWh × 3.6 = MJ is a unit conversion, not normalization. Use independently measured substance-specific state/density/enthalpy. Integrated liquid/gas volume stays integrated. Keep undivided raw_i, physical stock, carrier/species subaccounts and uncertainty."
      inputs:
        - raw_original
        - unit_evidence
        - state_evidence
        - cp_energy
        - cp_water
        - cp_species
      output: "raw_i"
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - id: calc_assign
      applies_to: "manufacturing burden rows"
      rule: "Form A_i from dedicated raw_i and evidenced exchange-specific shares of truly joint raw_i, plus opening raw/WIP/unassigned-material-store inherited vector_i minus corresponding closing unreleased raw/WIP/unassigned-store vector_i. Released closing FG is excluded from manufacturing Bclose. Retain failure/idle/cleanup/rework and actual waste treatment. For assets use genuine current service-equivalent demand and inherited history, not full stock purchase mass as current service. Set D_i to first-release Q from cp_release. Distinguish gross receipts/purchases from already stock-corrected net consumption; do not subtract closing or add opening vectors a second time to already-net consumption. Preserve raw/WIP/non-WIP quantities and every inherited exchange vector; pair internal stage handoffs on consolidation. Apply b_failure justified real handover conditions; ordinary waste export/sale never automatically deducts manufacture/treatment burden."
      inputs:
        - raw_i
        - opening_vector_i
        - closing_vector_i
        - allocation_evidence_i
        - Q
        - cp_release
        - cp_material
        - cp_asset
        - cp_allocation
      output: "A_i; D_i"
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
        - jrc-ilcd-detailed-2010
    - id: calc_service_assign
      applies_to: "post-release burden rows"
      rule: "Form A_i as actual incremental attributable service vector for original cohort c during observed H. Preserve its original inherited manufacture separately, without charging it again. D_i is original first-release Qc, not current dispatch minus returns. Packaging and asset service has one original upstream owner and genuine service demand. Historical opening FG retains original manufacture. Actually performed original-cohort service stays assigned under original Qc/H even when serviced FG remains in closing stock. Carry only genuine unconsumed/unassigned charge or service stores, without deducting completed service or correcting net consumption twice."
      inputs:
        - original_release_id
        - Qc
        - H
        - incremental_vector_i
        - inherited_manufacture_vector
        - cp_service
        - cp_pack
        - cp_asset
      output: "A_i; D_i"
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
        - jrc-ilcd-detailed-2010
    - id: calc_custody_assign
      applies_to: "physical custody rows"
      rule: "For a custody-only Product/waste/FG movement use actual gross raw_i as A_i with no economic allocation; D_i is its owning manufacture Q or original service Qc. Keep absolute gross quantities and complete stock bridge as primary physical evidence. A normalized physical view is not another upstream purchase, manufacture, coproduct or automatic burden credit. Supplier-included packages have one separately evidenced original upstream owner."
      inputs:
        - gross_raw_i
        - original_cohort
        - actual_gate
        - Q
        - Qc
        - cp_pack
        - cp_service
      output: "A_i; D_i"
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - id: calc_once
      applies_to: "all inventory rows"
      rule: "q_i = A_i / D_i; D_i is the uniquely selected Q or original-cohort Qc in m2 from the applicable assignment rule. Execute this quotient exactly once for D_i>0; each numerator retains its native extensive unit and q_i is per 1 m2 reference flow. Cards and collection aggregation reference this one result and never divide it again. For D_i=0 retain all actual loads and stocks in zero_output_ledger and issue no unit result."
      inputs:
        - A_i
        - D_i
        - cp_release
        - cp_service
        - cp_allocation
      output: "q_i; zero_output_ledger"
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
        - jrc-ilcd-detailed-2010
    - id: calc_physical
      applies_to: "manufacture; service; combined"
      rule: "At each real gate opening physical stock + every actual ingress = closing physical stock + every actual egress; cancel only paired internal transfers once on consolidation. Independently reconcile relevant element and real species/free/structural/reaction-water evidence with uncertainty. Keep Q and released FG bridge separate: internal first-release transfer Q cancels, not Q plus closing FG counted twice. Gross G/R includes independent changed water/mass/loss. One residual cannot fit two unknowns."
      inputs:
        - physical_open
        - physical_in
        - physical_close
        - physical_out
        - species_evidence
        - element_evidence
        - cp_material
        - cp_species
        - cp_service
      output: "physical_gate_reconciliation"
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - id: calc_pack
      applies_to: "each packaging material"
      rule: "Execute every b_pack term separately at manufacture, service and combined gates. Internal reuse cancels; actual incoming packages and complete wet closing stocks both remain. Deduplicate physical X_in/X_out only against other counted ingress/egress. Check each material/design/owner and one upstream burden owner; do not divide collection totals or economically scale physical balances. X_in_material_water/X_out_material_water are real repair material wood residue and water-phase additions/removals, not cancelled by closing retention. Close actual manufacturing/service windows separately; pre-H receipts enter history/opening stocks rather than being repeated H ingress. Preserve actual flows and stocks without repeated upstream burden. P includes separately invoiced and bundled-price paid acquisitions exactly once, whether new or previously used. N_ext is first external non-purchase ingress, including genuinely non-purchased supplier-provided, gifted or loaned articles; it is an input, never an outgoing return. Supplier-included is provenance, not another additive ingress if the same event is already in P or N_ext. ER requires the same item or traceable item-lot and its prior outward event; a first external supply is not ER. Keep gross shipment S and external-owner return sent EO as separate outward legs. Retain actual owner, event, paid/bundled/non-purchase classification and one upstream burden owner; price inclusion does not create a second provider purchase."
      inputs:
        - pack_open
        - pack_purchases
        - supplier_included
        - external_return_received
        - pack_close
        - gross_shipped
        - external_return_sent
        - pack_waste
        - cp_pack
        - X_in_material_water
        - X_out_material_water
        - P
        - N_ext
        - ER
        - S
        - EO
        - item_or_item_lot
        - prior_outward_event
      output: "packaging_custody_reconciliation"
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each flow and actual provider"
      requirement: "Verify whole supplied identity and every native grade/form/route/geography/media/type/property restriction. Unbound specific flows need compatible confirmation before concrete dataset UUID binding; identity alone is no provider quantity or scientific approval."
      evidence: "whole native record; supplier specification; actual state; exact support chain"
    - id: dq_raw
      applies_to: "each raw record"
      requirement: "Retain calibrated original units, accumulated/rate distinction, sampling representativeness, uncertainty, detection limits, all operating modes and real missingness. Do not invent plant amounts, geometry, mass per tile, density, recipe, service life or test passes."
      evidence: "raw meters; calibration; lab methods; operating logs"
    - id: dq_cohorts
      applies_to: "all gates"
      requirement: "Preserve raw/WIP inheritance per exchange, released FG original manufacture, full gross movements and actual service Qc/H. Physical wet stocks and all true X_in/X_out remain even when material/water stays in closing stock."
      evidence: "cohort and stock records; per-flow vector; gross G/R and independent water/loss bridge"
    - id: dq_sources
      applies_to: "each external claim"
      requirement: "BREF is historical industrial route/counterevidence; the expired Sassuolo EPD is a historical product-mix example, not current certification or one matched factory recipe. Its continuous forming variant and PE/PET wording conflict stay explicit. Use no source recipe/energy/mass-per-area/recovery/life or credit as default. ILCD supports attributional hierarchy only."
      evidence: "complete primary originals; figure/table context; actual plant and source applicability records"
    - id: dq_service
      applies_to: "post_release"
      requirement: "Disclose actual observed H, original Qc and unobserved future service. Distinguish permission, actual postwork tests, acceptance and final disposition. Historical manufactured burden is not a new service burden."
      evidence: "original delivery and release IDs; actual service records; H; tests and uncertainty"
validation_rules:
  - rule_id: v_native
    applies_to: "reference product; each UUID"
    rule: "Before concrete dataset binding verify query membership and full exact native physical identity, all multilingual basenames/synonyms/comments, CAS, fixed grade/route/form/geography/media/type and every property-to-unit chain. An inconsistent core terminal is a core hold and unusable draft; an ordinary input/provider gap is not evidence of core failure. Each adopted card retains its actual restrictions in consumable context."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
  - rule_id: v_area
    applies_to: "reference flow; finish"
    rule: "Require measured first-release Q from actual single-face projected finished outline; verified rectangles may use measured L×W. Other outlines need traceable drawing-specific geometry or calibrated planimetry, excluding holes/cutouts as appropriate. No bounding box, double-face counting, nominal carton area, density or secondary-property inferred item mass. Report uncertainty and geometry/configuration coverage."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
  - rule_id: v_once
    applies_to: "all inventory rows"
    rule: "Collect only undivided raw original quantities/rates and real stock vectors; convert units and assign burdens before calc_once. Cards and aggregation reuse its one q_i result. For Q or Qc zero retain full real loads and stocks but no unit result. kg requirements never override native MJ/kWh/m3/t km numerator."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
      - jrc-ilcd-detailed-2010
  - rule_id: v_vectors
    applies_to: "manufacture; service; combined"
    rule: "Check each raw/WIP/unassigned-store inherited vector, all operating modes and first-release Q. Released closing FG keeps its manufacturing burden and is not another output. Original-cohort Qc/H services include historical opening FG and independent mass/water/loss bridge. Consolidation cancels internal Q once."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
      - jrc-ilcd-detailed-2010
  - rule_id: v_physical
    applies_to: "each physical gate"
    rule: "Check wet total mass and relevant elements at manufacture, FG service and combined gates independently from real species and reaction-water evidence. Every package and asset/fluid stock keeps real gross ingress/egress. No economic share on physical mass, no residual fitted to two unknowns, no whole-provider plus carrier/assay double count."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
  - rule_id: v_failure
    applies_to: "waste; rework"
    rule: "Retain rejects, samples, failed/idle/cleanup loads and actual treatment. Export/sale cannot erase burdens. Rework needs actual permission/tests/acceptance/disposition; do not assume a broken tile recovers, no new Q from retest/delivery."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
      - jrc-ilcd-detailed-2010
  - rule_id: v_complete
    applies_to: "every actual exchange"
    rule: "Require one atomic supplied formulation/article or actual waste/species per card, concrete specific names for unbound rows, native extensive numerator, real collection protocol, one calculation and sources. Add real missing auxiliaries, treatment chemicals, phases, pollutants and destinations. Unknown, absent, below detection and measured zero differ; do not infer absence from a failed or bounded query."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
  - rule_id: v_quality
    applies_to: "actual released design"
    rule: "Require real mineral/porcelain grade, glaze formulation, polish/rectification permission, geometry, surface/glaze integrity, appearance, absorption, strength and actual use-specific slip/abrasion tests against the declared specification. Historical EPD tables and generic native comments are not current design passes or universal numerical limits."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
  - rule_id: v_readiness
    applies_to: "whole PCR; concrete dataset"
    rule: "Mechanical schema/fingerprint/finite-measurement checks establish declared consistency only. They do not approve science, translation, supplier compatibility, actual factory completeness, mapping or publication. Disclose real unknowns and core holds separately from ordinary future foreground requirements."
    source_ids:
      - jrc-ceramic-bref-2007
      - marazzi-sassuolo-epd-2019
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual indoor porcelain floor-tile supply for compatible downstream modelling with disclosed system boundary and cohort service horizon"
  allowed_use: "Use complete measured first-release area inventory and separately disclosed original-cohort service increments for the matching design and provider scope"
  excluded_use: "Automatic outdoor or lifetime/installed-system equivalence; other ceramic or stone families; unmeasured mass/count conversion; product/SKU certification; net-delivery substitution; automatic credits"
  required_metadata: "All reference qualifiers; actual grade/geometry and acceptance; source/provider/native limits; each physical gate; Q and raw/WIP vectors; released FG bridge; original Qc/H; package/asset ownership; allocation evidence"
  required_quality_disclosure: "Calibrated raw quantities; original units and state; speciation; uncertainty and missingness; conditional absences; unresolved auxiliary UUIDs; inherited burden; observed service only; source historical limits"
  update_trigger: "Material/formulation or native-identity change; geometry/grade/use change; firing/finishing/coating route change; provider/energy/abatement change; changed stock/return or allocation logic; new quality/evidence requirements"
data_sources:
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission, Reference Document on Best Available Techniques in the Ceramic Manufacturing Industry, August 2007; §§2.3.5.1–2.3.5.7; figures2.20–2.21; table2.14; printed59–63. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "Historical primary route and input/output context; discrete hydraulic pressing; wet spray granulation; glazed single-fire versus alternative routes; optional polishing; counterevidence. No transferred numerical recipe/energy/performance."
  - id: "marazzi-sassuolo-epd-2019"
    type: "literature"
    reference: "Marazzi Group, Ceramic tiles, Sassuolo plant, MAR_SAS_18_0001 / EPDItaly0099, issued9December2019, valid to9December2024; §§3–4, PDF5–10. https://www.marazzi.it/app/uploads/2023/10/EPD_Sassuolo_en.pdf"
    used_for: "Historical manufacturer product-mix primary: complete wet-preparation/press/dry/glaze/single-fire/cool route; actual optional polishing/rectification and individual quality sorting; packing/storage; abatement/heat-recovery context. Continuous-forming variant and PE/PET wording conflict retained. No current certification or transferred numerical factors, EPD impacts, lifetime or moduleD credit."
  - id: "jrc-ilcd-detailed-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook — General guide for Life Cycle Assessment — Detailed guidance, first edition March2010, §§7.9.2–7.9.3; printed255–268. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional cases requiring allocation only: subdivision/virtual subdivision; exchange-specific determining physical causality; genuinely residual common-gate condition-matched economic value; examples and counterexamples. Not ceramic manufacturing evidence, a fixed allocation key or an industrial numerical factor."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:7ccaddaf7fa5cc9f4171b3d6fc11a4eee27b9cb54231c01e1adafaaa58e20d71"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8770"
      family: "system_boundary"
      span:
        start:
          offset: 8770
          line: 68
          column: 1
        end:
          offset: 18206
          line: 97
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual unfired supplied raw material forms and upstream extraction/preparation plus real inbound haulage; full site manufacture |\n| starting_condition_role | foreground_collection_boundary |\n| product_classification_scope | CPC 3.0:37370 narrower indoor glazed polished porcelain floor-tile route |\n| recursive_input_rule | Any purchased same-category fired tile used as grog or a real article retains its actual role and inherited burden without recursively duplicating manufacture or replacing full raw-to-tile production. |\n| upstream_dataset_requirement | Actual mineral/formulation/article and utility provider scope with one ownership of supplied processing, packages and transport; UUID identity implies no provider or quantity |\n| disclosure | First-release Q; raw/WIP inheritance; released-FG bridge; gross species, water, package and asset custody; original Qc/H service; actual uncertainty and missingness |\n\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | manufacture | Include every actual operation from unfired supplied clay/kaolin/quartz/feldspar and other real recipe materials through body preparation, wet milling/sieving, slip agitation, spray granulation, hydraulic die pressing, green-body drying, glaze preparation/application and genuine decoration, one roller-hearth firing/cooling, specified polishing/rectification/washing/drying, tests and first release. BREF/EPD support a technical synthesis, not one common SKU, factory or order. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_supply | each supplied material | Retain actual extraction, supplier processing and inbound transport boundary. A whole supplied frit, glaze, ink or solution is acquired once; composition, active content and carrier water are subaccounts. Actual on-site formulation keeps each separately purchased ingredient, energy and loss. Add each real unlisted atomic input/output; unknown and unlisted are not zero. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_first_release | manufacture; finish | Q is unique newly first-quality-released single-face projected m2 of complete conforming tiles after all required finishing/tests. Already released closing FG is included in Q and keeps its manufacturing burden. Manufacturing Bclose includes only unreleased raw materials/WIP and unassigned non-WIP material stores; never deduct released-FG manufacture or add Q and closing FG as two outputs. Delivery, retesting, returns and rerelease create no new Q. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_wip | every physical stage | Carry opening/closing stock quantities and a separate inherited vector for every upstream exchange in raw stores, wet slip, granulate, pressed/dried/glazed bodies and fired-but-unreleased WIP. Keep all failed/zero-output/start/stop/idle/hot-hold/cleanup/rework loads. One stage transfer cancels once at the consolidated boundary; no duplicate upstream purchase or hidden failed cohort. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_service | post_release; combined | Post-release increments over observed H belong to original release cohort Qc with its historical manufacture, including opening FG. Retain gross shipment/return G/R and independent actual changes in water, mass, losses and permitted rework. Keep original manufacture separate from incremental service, cancel the internal Q transfer once and disclose unobserved future service. This first-release method is not net delivery; changing the gate requires a full original delivery-specific reversal D_rev and historical stock bridge. Actual permitted work also records every real new/removed part material water fragment and phase transfer, retaining b_failure postwork tests and acceptance/disposition. Count repair-held custody as FG substates OR disjoint repair-WIP once, without lost/double stock, new Q or presumed broken-tile restoration. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_water_species | manufacture; service; combined | Independently reconcile full wet physical mass and relevant C/H/O/N/S/F/Cl/Si/Al/Na/K/Ca/Mg/Zr/actual pigment elements. Actual molecular species, mineral phases, free/structural/reaction water, condensate and vapour require independent evidence; loss on ignition, COD, VOC, NOx, total carbon/boron/fluorine and particle size do not identify a molecule. One residual cannot fit two unknowns. No aggregate air plus its species, no whole dust matrix plus its quartz submass double count. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_utilities | each utility | Keep each fuel mixture, electricity and external heat service atomic with native extensive units. Carrier mass, composition, LHV and enthalpy are non-additive physical attributes of the same whole supply. Use actual/standard gas state and independent density, never a water density or secondary native coefficient as measurement. Integrate real rates once; do not multiply accumulated volume by time. External steam/heat-water and actual Product returns need mass, actual enthalpy/state and supplier convention. Internal recovered heat cancels; no nonexistent boiler or duplicated whole provider. With specific enthalpy h in kJ/kg, each measured leg m in kg times h gives kJ; divide by 1000 exactly once for MJ. For unequal supply and return masses, retain each inlet/outlet enthalpy leg and independently evidenced real losses or storage on the same boundary, period and enthalpy reference state. Use m times an enthalpy difference only for a demonstrated matched-mass boundary; infer no boiler efficiency or condensate credit. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_pack | each packaging material; every gate | For each material/design/owner: opening empty + WIP-attached + released-FG-attached + reusable stock + paid acquisitions P + first external non-purchase ingress N_ext + true external returns ER + X_in_material_water = corresponding closing stocks + leaving with gross physical shipments + external return sent + waste + X_out_material_water. Retain actual ingress even if it stays in closing stock. Declare one upstream burden owner for supplier-included packages. Internal reuse cancels without another purchase, tile Q, coproduct or automatic credit. Gross masses are never reduced by economic allocation. X_in_material_water and X_out_material_water include actual new/removed repair parts wood residues and phase-specific moisture uptake/release only when not already in another flow term. Deduplicate X only against other flow terms, never stocks; actual ingress and measured closing mass containing it both remain. P includes separately invoiced and bundled-price paid acquisitions exactly once, whether new or previously used. N_ext is first external non-purchase ingress, including genuinely non-purchased supplier-provided, gifted or loaned articles; it is an input, never an outgoing return. Supplier-included is provenance, not another additive ingress if the same event is already in P or N_ext. ER requires the same item or traceable item-lot and its prior outward event; a first external supply is not ER. Keep gross shipment S and external-owner return sent EO as separate outward legs. Retain actual owner, event, paid/bundled/non-purchase classification and one upstream burden owner; price inclusion does not create a second provider purchase. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_assets | each asset; component; fluid | Keep full physical opening stock + all new/used/repair additions = full closing stock + real removals/leaks/waste. Each actual separately purchased component and each water/oil phase remains an atomic ingress; never remove it merely because retained in closing stock. Deduplicate X_in/X_out only against other already counted ingress/egress, not stocks. Separate real current service burden and inherited history from physical stock; no fixed lifetime or full machine per m2. A whole supplied asset and included components are not two purchases. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_failure | rejects; samples; treatment | Ordinary waste, breakage, failure and samples and their treatment stay with the causing cohort even if sold or sent elsewhere. Only a real independent cohort/function with justified allocation or burden handoff can transfer one burden vector once; gross physical egress stays complete. Ceramic breakage is not presumed repairable. Actual rework requires manufacturer/spec permission, postwork tests, acceptance and disposition, without creating new release production. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| b_applicability | reference product | Restrict to complete indoor glazed polished porcelain floor tiles made by this wet-prepared spray-dried hydraulic-die-pressed single-fired route and passing actual design tests. Exclude green bodies, raw powders, tableware, sanitaryware, extruded bricks, refractories, stone, dry-granulated/extruded/cast or double-fired alternatives, non-polished tiles and installed systems. Other real coating/treatment routes require renewed applicability assessment with atomic exchanges; no family-name or CPC match overrides a hard physical conflict. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n\n\n"
