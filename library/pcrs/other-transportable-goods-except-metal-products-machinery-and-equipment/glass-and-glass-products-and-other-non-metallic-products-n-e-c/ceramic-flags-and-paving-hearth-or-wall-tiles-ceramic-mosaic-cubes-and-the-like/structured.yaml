      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_native | reference product; each UUID | Before concrete dataset binding verify query membership and full exact native physical identity, all multilingual basenames/synonyms/comments, CAS, fixed grade/route/form/geography/media/type and every property-to-unit chain. An inconsistent core terminal is a core hold and unusable draft; an ordinary input/provider gap is not evidence of core failure. Each adopted card retains its actual restrictions in consumable context. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| v_area | reference flow; finish | Require measured first-release Q from actual single-face projected finished outline; verified rectangles may use measured L×W. Other outlines need traceable drawing-specific geometry or calibrated planimetry, excluding holes/cutouts as appropriate. No bounding box, double-face counting, nominal carton area, density or secondary-property inferred item mass. Report uncertainty and geometry/configuration coverage. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| v_once | all inventory rows | Collect only undivided raw original quantities/rates and real stock vectors; convert units and assign burdens before calc_once. Cards and aggregation reuse its one q_i result. For Q or Qc zero retain full real loads and stocks but no unit result. kg requirements never override native MJ/kWh/m3/t km numerator. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019`; `jrc-ilcd-detailed-2010` |\n| v_vectors | manufacture; service; combined | Check each raw/WIP/unassigned-store inherited vector, all operating modes and first-release Q. Released closing FG keeps its manufacturing burden and is not another output. Original-cohort Qc/H services include historical opening FG and independent mass/water/loss bridge. Consolidation cancels internal Q once. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019`; `jrc-ilcd-detailed-2010` |\n| v_physical | each physical gate | Check wet total mass and relevant elements at manufacture, FG service and combined gates independently from real species and reaction-water evidence. Every package and asset/fluid stock keeps real gross ingress/egress. No economic share on physical mass, no residual fitted to two unknowns, no whole-provider plus carrier/assay double count. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| v_failure | waste; rework | Retain rejects, samples, failed/idle/cleanup loads and actual treatment. Export/sale cannot erase burdens. Rework needs actual permission/tests/acceptance/disposition; do not assume a broken tile recovers, no new Q from retest/delivery. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019`; `jrc-ilcd-detailed-2010` |\n| v_complete | every actual exchange | Require one atomic supplied formulation/article or actual waste/species per card, concrete specific names for unbound rows, native extensive numerator, real collection protocol, one calculation and sources. Add real missing auxiliaries, treatment chemicals, phases, pollutants and destinations. Unknown, absent, below detection and measured zero differ; do not infer absence from a failed or bounded query. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| v_quality | actual released design | Require real mineral/porcelain grade, glaze formulation, polish/rectification permission, geometry, surface/glaze integrity, appearance, absorption, strength and actual use-specific slip/abrasion tests against the declared specification. Historical EPD tables and generic native comments are not current design passes or universal numerical limits. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n| v_readiness | whole PCR; concrete dataset | Mechanical schema/fingerprint/finite-measurement checks establish declared consistency only. They do not approve science, translation, supplier compatibility, actual factory completeness, mapping or publication. Disclose real unknowns and core holds separately from ordinary future foreground requirements. | `jrc-ceramic-bref-2007`; `marazzi-sassuolo-epd-2019` |\n\n\n"
