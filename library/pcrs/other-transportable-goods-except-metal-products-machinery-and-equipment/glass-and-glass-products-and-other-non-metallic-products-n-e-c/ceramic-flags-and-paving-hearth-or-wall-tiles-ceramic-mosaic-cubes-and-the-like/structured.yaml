system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Include every actual operation from unfired supplied clay/kaolin/quartz/feldspar and other real recipe materials through body preparation, wet milling/sieving, slip agitation, spray granulation, hydraulic die pressing, green-body drying, glaze preparation/application and genuine decoration, one roller-hearth firing/cooling, specified polishing/rectification/washing/drying, tests and first release. BREF/EPD support a technical synthesis, not one common SKU, factory or order."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_supply
      applies_to: "each supplied material"
      rule: "Retain actual extraction, supplier processing and inbound transport boundary. A whole supplied frit, glaze, ink or solution is acquired once; composition, active content and carrier water are subaccounts. Actual on-site formulation keeps each separately purchased ingredient, energy and loss. Add each real unlisted atomic input/output; unknown and unlisted are not zero."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_first_release
      applies_to: "manufacture; finish"
      rule: "Q is unique newly first-quality-released single-face projected m2 of complete conforming tiles after all required finishing/tests. Already released closing FG is included in Q and keeps its manufacturing burden. Manufacturing Bclose includes only unreleased raw materials/WIP and unassigned non-WIP material stores; never deduct released-FG manufacture or add Q and closing FG as two outputs. Delivery, retesting, returns and rerelease create no new Q."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_wip
      applies_to: "every physical stage"
      rule: "Carry opening/closing stock quantities and a separate inherited vector for every upstream exchange in raw stores, wet slip, granulate, pressed/dried/glazed bodies and fired-but-unreleased WIP. Keep all failed/zero-output/start/stop/idle/hot-hold/cleanup/rework loads. One stage transfer cancels once at the consolidated boundary; no duplicate upstream purchase or hidden failed cohort."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_service
      applies_to: "post_release; combined"
      rule: "Post-release increments over observed H belong to original release cohort Qc with its historical manufacture, including opening FG. Retain gross shipment/return G/R and independent actual changes in water, mass, losses and permitted rework. Keep original manufacture separate from incremental service, cancel the internal Q transfer once and disclose unobserved future service. This first-release method is not net delivery; changing the gate requires a full original delivery-specific reversal D_rev and historical stock bridge. Actual permitted work also records every real new/removed part material water fragment and phase transfer, retaining b_failure postwork tests and acceptance/disposition. Count repair-held custody as FG substates OR disjoint repair-WIP once, without lost/double stock, new Q or presumed broken-tile restoration."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_water_species
      applies_to: "manufacture; service; combined"
      rule: "Independently reconcile full wet physical mass and relevant C/H/O/N/S/F/Cl/Si/Al/Na/K/Ca/Mg/Zr/actual pigment elements. Actual molecular species, mineral phases, free/structural/reaction water, condensate and vapour require independent evidence; loss on ignition, COD, VOC, NOx, total carbon/boron/fluorine and particle size do not identify a molecule. One residual cannot fit two unknowns. No aggregate air plus its species, no whole dust matrix plus its quartz submass double count."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_utilities
      applies_to: "each utility"
      rule: "Keep each fuel mixture, electricity and external heat service atomic with native extensive units. Carrier mass, composition, LHV and enthalpy are non-additive physical attributes of the same whole supply. Use actual/standard gas state and independent density, never a water density or secondary native coefficient as measurement. Integrate real rates once; do not multiply accumulated volume by time. External steam/heat-water and actual Product returns need mass, actual enthalpy/state and supplier convention. Internal recovered heat cancels; no nonexistent boiler or duplicated whole provider. With specific enthalpy h in kJ/kg, each measured leg m in kg times h gives kJ; divide by 1000 exactly once for MJ. For unequal supply and return masses, retain each inlet/outlet enthalpy leg and independently evidenced real losses or storage on the same boundary, period and enthalpy reference state. Use m times an enthalpy difference only for a demonstrated matched-mass boundary; infer no boiler efficiency or condensate credit."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_pack
      applies_to: "each packaging material; every gate"
      rule: "For each material/design/owner: opening empty + WIP-attached + released-FG-attached + reusable stock + paid acquisitions P + first external non-purchase ingress N_ext + true external returns ER + X_in_material_water = corresponding closing stocks + leaving with gross physical shipments + external return sent + waste + X_out_material_water. Retain actual ingress even if it stays in closing stock. Declare one upstream burden owner for supplier-included packages. Internal reuse cancels without another purchase, tile Q, coproduct or automatic credit. Gross masses are never reduced by economic allocation. X_in_material_water and X_out_material_water include actual new/removed repair parts wood residues and phase-specific moisture uptake/release only when not already in another flow term. Deduplicate X only against other flow terms, never stocks; actual ingress and measured closing mass containing it both remain. P includes separately invoiced and bundled-price paid acquisitions exactly once, whether new or previously used. N_ext is first external non-purchase ingress, including genuinely non-purchased supplier-provided, gifted or loaned articles; it is an input, never an outgoing return. Supplier-included is provenance, not another additive ingress if the same event is already in P or N_ext. ER requires the same item or traceable item-lot and its prior outward event; a first external supply is not ER. Keep gross shipment S and external-owner return sent EO as separate outward legs. Retain actual owner, event, paid/bundled/non-purchase classification and one upstream burden owner; price inclusion does not create a second provider purchase."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_assets
      applies_to: "each asset; component; fluid"
      rule: "Keep full physical opening stock + all new/used/repair additions = full closing stock + real removals/leaks/waste. Each actual separately purchased component and each water/oil phase remains an atomic ingress; never remove it merely because retained in closing stock. Deduplicate X_in/X_out only against other already counted ingress/egress, not stocks. Separate real current service burden and inherited history from physical stock; no fixed lifetime or full machine per m2. A whole supplied asset and included components are not two purchases."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_failure
      applies_to: "rejects; samples; treatment"
      rule: "Ordinary waste, breakage, failure and samples and their treatment stay with the causing cohort even if sold or sent elsewhere. Only a real independent cohort/function with justified allocation or burden handoff can transfer one burden vector once; gross physical egress stays complete. Ceramic breakage is not presumed repairable. Actual rework requires manufacturer/spec permission, postwork tests, acceptance and disposition, without creating new release production."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
    - rule_id: b_applicability
      applies_to: "reference product"
      rule: "Restrict to complete indoor glazed polished porcelain floor tiles made by this wet-prepared spray-dried hydraulic-die-pressed single-fired route and passing actual design tests. Exclude green bodies, raw powders, tableware, sanitaryware, extruded bricks, refractories, stone, dry-granulated/extruded/cast or double-fired alternatives, non-polished tiles and installed systems. Other real coating/treatment routes require renewed applicability assessment with atomic exchanges; no family-name or CPC match overrides a hard physical conflict."
      source_ids:
        - jrc-ceramic-bref-2007
        - marazzi-sassuolo-epd-2019
