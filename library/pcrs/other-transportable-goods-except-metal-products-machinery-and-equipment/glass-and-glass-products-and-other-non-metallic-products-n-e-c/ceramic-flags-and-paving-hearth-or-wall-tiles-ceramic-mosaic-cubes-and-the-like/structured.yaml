process_map:
  - id: preparation
    name: "Raw receipt, wet body preparation and spray granulation"
    inclusion: "required"
    inclusion_condition: "Actual receipt/haulage/storage, gravimetric batching with moisture, real crushing, wet milling/sieving, agitated slip tanks, spray drying and powder storage. Stage-tag internal transfers without repurchasing."
    role: "foreground_stage"
    quantitative_reference: "Unique final Q; original Qc for observed services; not a stage-production sum"
  - id: press_dry
    name: "Hydraulic dry pressing and green-body drying"
    inclusion: "required"
    inclusion_condition: "Discrete die pressing of actual granulate, unloading/trimming/conveying and actual body drying/heat recovery. No casting or plastic extrusion substituted."
    role: "foreground_stage"
    quantitative_reference: "Unique final Q; original Qc for observed services; not a stage-production sum"
  - id: glaze
    name: "Glaze preparation and pre-firing application"
    inclusion: "required"
    inclusion_condition: "Actual individual raw-material wet milling/mixing or separately purchased whole prepared glaze, engobe where declared, actual glaze application/decoration and post-application drying. Different real unlisted formulation requires its own atomic exchange."
    role: "foreground_stage"
    quantitative_reference: "Unique final Q; original Qc for observed services; not a stage-production sum"
  - id: kiln
    name: "Single roller-hearth firing and controlled cooling"
    inclusion: "required"
    inclusion_condition: "Actual loading, one body-and-glaze firing, atmosphere/thermal history, controlled cooling/unloading and internal heat recovery. No second biscuit/glost cycle copied from tableware."
    role: "foreground_stage"
    quantitative_reference: "Unique final Q; original Qc for observed services; not a stage-production sum"
  - id: finish
    name: "Specified polishing, rectification, testing and first release"
    inclusion: "required"
    inclusion_condition: "Actual required grinding/polishing of a manufacturer-qualified glazed design, rectification/cutting, washing/drying, surface/geometry/quality tests and unique first release. Preserve all rejects and samples."
    role: "reference_production"
    quantitative_reference: "Unique final Q; original Qc for observed services; not a stage-production sum"
  - id: plant_services
    name: "Shared utilities, abatement and physical species gates"
    inclusion: "required"
    inclusion_condition: "Collect each real utility, water phase, gas/solid species, environmental outlet, waste treatment and maintenance by actual stage and gate; allocate only genuinely joint burden."
    role: "foreground_stage"
    quantitative_reference: "Unique final Q; original Qc for observed services; not a stage-production sum"
  - id: packaging
    name: "Packaging custody across manufacture and service gates"
    inclusion: "required"
    inclusion_condition: "Logical material-specific custody ledger at each actual physical ingress/egress, not a second plant or chronological reordering. Supplier-included packaging belongs to its real pre-release stage/owner; service uses original cohort Qc."
    role: "gross_custody"
    quantitative_reference: "Unique final Q; original Qc for observed services; not a stage-production sum"
  - id: post_release
    name: "Observed original-cohort packing, storage and delivery services"
    inclusion: "required"
    inclusion_condition: "Actual increments during observed H, including handling, returns, retests, permitted rework and waste, retaining original manufacture. Delivery and reinspection never create new Q."
    role: "original_cohort_service"
    quantitative_reference: "Unique final Q; original Qc for observed services; not a stage-production sum"
