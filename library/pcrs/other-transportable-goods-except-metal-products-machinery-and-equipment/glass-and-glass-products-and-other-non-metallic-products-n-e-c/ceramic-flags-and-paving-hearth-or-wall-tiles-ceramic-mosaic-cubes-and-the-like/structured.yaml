      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_scope | each study | Use this attributional hierarchy only where the goal/context requires partitioning; disclose why substitution is not used. No freely interchangeable physical/economic keys, fixed shares or automatic avoided-product credit. Industrial process evidence is not allocation authority. | `jrc-ilcd-detailed-2010` |\n| a_subdivide | each exchange | First separately meter dedicated body/glaze lines, product grades, pressing/firing/finishing and logistics; use physical or defensible virtual subdivision to assign exclusive exchanges directly, including grade-specific pigment, tests and genuine failure loads. Document infeasibility and material distortion when subdivision is not possible. | `jrc-ilcd-detailed-2010` |\n| a_causal | remaining joint exchanges | For each still-joint exchange demonstrate the determining physical causal relation to actual functions. Metered thermal demand, residence/load, actual constrained freight capacity or service occupancy may differ by exchange; area, mass, item count or time is not automatically the correct driver. Retain explanatory tests, units and sensitivity, rather than one plant-wide mass split. | `jrc-ilcd-detailed-2010` |\n| a_residual | genuinely residual exchanges | Only the remaining inseparable noncausal residual may use actual contemporaneous market values at the common process gate, actual quality/condition/amount and currency/period. Remove later packaging/conditioning/transport value from downstream prices. Record genuine co-functions, price evidence, residual exchanges, uncertainties and sum-to-one assigned shares. Physical custody is not downscaled. | `jrc-ilcd-detailed-2010` |\n| a_no_credit | waste; rework; returned assets | Recycling, external sale, a returned package or kiln condensate is no automatic substitution credit or coproduct. Preserve causing-cohort failure/treatment burden unless an evidenced independent function and explicit approved handoff allocate one vector once. Internal recirculation cancels physical transfers without deleting actual energy/loss. | `jrc-ilcd-detailed-2010` |\n\n\n"
