  unresolved_evidence:
    - Important-flow quantity ranges remain unsupported and omitted rather than fabricated; range lint warnings are retained.
    - Actual SKU, formulation, moisture, firing cycles, quality thresholds, quantities, species and provider links require foreground collection; no quantitative defaults claimed.
    - Shared kilns or joint saleable outputs require independent allocation review before use; dedicated campaign is required here.
  semantic_boundary_review:
    decision: retain original residual-category directory and id; narrow to glazed porcelain cabinet knob bodies
    historical_reference: bf14ac0dc2e59810a64b6cb9fb2a06751fd775ab; 90305550697d35e22a81c54afa484e5c5e3ad667; 626197bc352c0c2ecb9789a4d03416b1acf0b388
    excluded_historical_candidate: binder-free rolled sintered alumina grinding spheres already accepted under 37291; do not copy its four files or reuse its id
    accepted_neighbour_decision: docs/adr/2026-correct-alumina-crucible-and-grinding-sphere-classification.md
    comparison: Grinding media, refractory crucibles, vitreous-china washbasins, tableware, decorative statuettes and electrical fittings differ in intended use and release boundary; shared firing is not whole-method equivalence. The authoring baseline contained no accepted cabinet-knob mapping. Current 37221 plate has onsite mineral preparation, spray granulation and isostatic pressing; current 37222 figurine has multipart slip forming and assembly. Neither implements purchased plastic-body cabinet fittings.
    classification_evidence: UNSD CPC3 June 2025 full relevant pages and CBP N014163 original text; historical HS corroboration is not CPC3 mapping acceptance.
    source_applicability: US2197A is historical route evidence only; JRC household ceramic operations are process analogues, not proof of one modern factory or recipe. All quantitative plant rules are explicit collection requirements.
    modules: Retained core modules are scaffold conventions only; no scientific rule or numeric default inferred. PEF module not claimed because no EF study is selected.
