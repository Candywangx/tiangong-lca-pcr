allocation_rules:
  - rule_id: a_campaign
    applies_to: "manufacture"
    rule: "Use a dedicated single-SKU campaign with all attributable drying/firing, rejects, idle and controls. Submeter and segregate other production before assigning loads. Unresolved shared kiln causality blocks a unit dataset; neither mass nor price is a default allocation key."
    source_ids:
      - jrc-ceramics-2007
  - rule_id: a_recycle
    applies_to: "scrap"
    rule: "Internal recycle carries its real collection and reprocessing burdens; cancel internal transfers once. External rejects remain waste unless an independently documented product function and allocation decision exist. No avoided virgin-body credit."
    source_ids:
      - jrc-ceramics-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "accepted output"
      record_type: "foreground_record"
      raw_fields: "release_id; SKU; accepted net mass Q; moisture; rejects; opening and closing stocks"
      collection_method: "Calibrated net weighing and signed first-release inspection; exclude packing/fittings"
      unit: "kg"
      frequency: "Each batch/cycle"
      temporal_coverage: "Complete declared campaign, including failures and idle"
      site_scope: "One site, one SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source records; stock reconciliation; uncertainty"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "materials"
      record_type: "foreground_record"
      raw_fields: "receipt; issue; return; wet mass; moisture; assay; raw/WIP stocks; inherited burdens"
      collection_method: "Weigh each whole purchased formulation; reconcile issues, returns, stocks and internal recycling"
      unit: "kg"
      frequency: "Each batch/cycle"
      temporal_coverage: "Complete declared campaign, including failures and idle"
      site_scope: "One site, one SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source records; stock reconciliation; uncertainty"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "energy"
      record_type: "foreground_record"
      raw_fields: "meter start/end; cycles; idle; temperature; pressure; supplier; heating value"
      collection_method: "Dedicated meter readings for all actual cycles and auxiliaries; preserve native units"
      unit: "kWh; m3"
      frequency: "Each batch/cycle"
      temporal_coverage: "Complete declared campaign, including failures and idle"
      site_scope: "One site, one SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source records; stock reconciliation; uncertainty"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "asset service"
      record_type: "foreground_record"
      raw_fields: "asset id; opening/closing stock; additions; uses; retirement; service evidence"
      collection_method: "Trace mould/setter actual cohort service without a default life; physical stock separate from attributed service"
      unit: "kg"
      frequency: "Each batch/cycle"
      temporal_coverage: "Complete declared campaign, including failures and idle"
      site_scope: "One site, one SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source records; stock reconciliation; uncertainty"
    - protocol_id: cp_pack
      process_id: "manufacture"
      flow_role: "packaging"
      record_type: "foreground_record"
      raw_fields: "material; item/cohort; ownership; true purchases; first non-purchase receipts with origin; traceable returned items and original outbound IDs; opening/closing empty/WIP/finished/reusable stocks; dispatch; owner/supplier returns; waste; inherited burden coverage; repair and water changes"
      collection_method: "Weigh each material/leg. Opening stock + purchases + all first non-purchase external receipts + verified returns + measured actual additions = closing stock + gross dispatch + owner/supplier returns + waste + separately measured actual removals. First receipts include incoming supplies, independent loans and gifts regardless of upstream burden coverage. Internal reuse cancels once. Record repair additions/removals and water changes separately when present; avoid double counting wet mass. Gross physical legs are ledger-only. Attribute actual purchase/service and inherited burdens once by provenance; upstream-uncovered receipts are not automatically burden-free, and upstream-included supply is not purchased twice. Missing provenance or attribution evidence blocks its dataset use."
      unit: "kg"
      frequency: "Each batch/cycle"
      temporal_coverage: "Complete declared campaign, including failures and idle"
      site_scope: "One site, one SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source records; stock reconciliation; uncertainty"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "waste"
      record_type: "foreground_record"
      raw_fields: "stream; wet mass; moisture; composition; destination; transfer receipt"
      collection_method: "Weigh each segregated waste and wastewater shipment or metered discharge; treatment burdens linked once"
      unit: "kg"
      frequency: "Each batch/cycle"
      temporal_coverage: "Complete declared campaign, including failures and idle"
      site_scope: "One site, one SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source records; stock reconciliation; uncertainty"
    - protocol_id: cp_emission
      process_id: "manufacture"
      flow_role: "species"
      record_type: "foreground_record"
      raw_fields: "species; origin; compartment; concentration; gas flow; time; state; detection limit; uncertainty"
      collection_method: "Integrate representative independent stack assays and matched gas-flow/time records; identify dust size and sources; analyse body/glaze volatile releases"
      unit: "kg"
      frequency: "Each batch/cycle"
      temporal_coverage: "Complete declared campaign, including failures and idle"
      site_scope: "One site, one SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source records; stock reconciliation; uncertainty"
  calculation_rules:
    - id: calc_campaign
      applies_to: "all inventory rows"
      rule: "For each non-reference exchange i, q_i = A_i / Q. A_i is its campaign-attributable extensive quantity after one documented raw/WIP inherited-burden stock adjustment; do not repeat a correction already in consumption records. Q is measured unique accepted net kg. Keep Q = 0 loads in investigation records and issue no quotient. Reference output is 1 kg. For packaging ledger-only physical legs, A_i is instead the full measured gross mass of that leg, without inherited-burden stock adjustment, economic allocation, duplicate purchase or automatic credit; report A_i/Q separately from attributed purchase/service burdens."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "q_i"
      source_ids:
        - jrc-ceramics-2007
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Confirm each UUID, supplied state and unit independently; blank UUIDs cannot be substituted by generic ceramic, pure oxide or aggregate gas flows."
      evidence: "Direct identity record; supplier specification"
    - id: dq_balance
      applies_to: "campaign"
      requirement: "Reconcile physical dry solids and water separately through raw/WIP/finished stocks, scrap, effluent and actual air emissions. Firing shrinkage does not determine gas species or reaction loss."
      evidence: "Independent assays and measured uncertainty"
    - id: dq_quality
      applies_to: "accepted output"
      requirement: "Retain drawing-based dimensional/hole, glaze coverage, crack/warpage and mechanical acceptance results; no invented universal threshold. Disclose gaps and failed batches."
      evidence: "Specification; signed quality release"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference"
    rule: "Require cabinet fitting use, porcelain body and specified forming/firing route, no included metal assembly; technical or refractory products fail applicability."
    source_ids:
      - unsd-cpc3-2025
      - us2197a-knobs-1841
  - rule_id: v_basis
    applies_to: "all rows"
    rule: "Check identical per-kg basis, positive Q, undivided raw totals, stock adjustments once, actual quality release and actual energy cycles. Missing species or identities remain explicit; a successful engineering check proves no plant data or scientific approval."
    source_ids:
      - jrc-ceramics-2007
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Grade-specific ceramic-body input to later furniture fitting assembly"
  allowed_use: "Only after identity confirmation, actual campaign collection and independent applicability review"
  excluded_use: "Installed locksets, service equivalence, complete CPC leaf, technical ceramics or claims of safety/compliance"
  required_metadata: "SKU and drawing; porcelain body and glaze supplier/formulation/moisture; forming route; each firing and atmosphere; measured accepted net mass Q; quality specification and tests; campaign and site/period; energy provider; stocks and losses; packaging; boundary exclusions and unresolved identities"
  required_quality_disclosure: "All missing identities, data gaps, proxy/upstream boundaries, uncertainty, campaign coverage and review status"
  update_trigger: "Body/glaze, use, forming/firing, energy provider, quality or boundary change"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC 3.0 explanatory notes, 30 June 2025, pp. 182–183; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Residual category and neighbouring positive categories; no itemized CPC3–HS concordance claimed."
  - id: "us2197a-knobs-1841"
    type: "literature"
    reference: "US2197A, 29 July 1841, description and drawing; https://patents.google.com/patent/US2197A/en"
    used_for: "Historical primary evidence of clay/porcelain furniture knobs and moulding, turning, burning, glazing; not a modern recipe or measured inventory. Metal attachment is downstream of this ceramic-body boundary."
  - id: "jrc-ceramics-2007"
    type: "official_guidance"
    reference: "European Commission, Ceramic Manufacturing Industry BREF, August 2007, sections 2.2 and 2.3.6.3–2.3.6.5; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "Qualitative plastic shaping, drying, glazing, firing, finishing and environmental exchange screening. Household-sector examples transfer as process analogues only; no temperature, yield, mould life, intensity or emission range adopted."
  - id: "cbp-n014163-2007"
    type: "official_guidance"
    reference: "US CBP, NY N014163, 20 July 2007; https://rulings.cbp.gov/ruling/N014163 ; original text https://rulings.cbp.gov/api/ruling/N014163"
    used_for: "Independent product/category countercheck: porcelain cabinet knobs classified under other ceramic articles. Historical US tariff decision is not current CPC acceptance or a ruling on this unassembled body. No tariff rate or sample dimension adopted."
