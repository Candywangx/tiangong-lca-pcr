  semantic_boundary_decision: "Complete checked34 material scope: 1252 unique records in 13 pages. Full relevant
    glass/lamp/luminaire/parts/polycarbonate scopes and frozen
    37111/37112/37114/37115/37116/37117/37121/37129/37191 intakes read. Lamp-parts PCR starts with
    borosilicate stock and mounting-ready lamp-source parts; finished-light-source and luminaire rules
    explicitly exclude separately supplied parts. Their stock conversion or assembly rules do not cover this
    raw-mineral electric-melt/pressed-annealed bare soda-lime luminaire shade. Frozen37192 ribbon-blown open
    bulb-envelope and37194 unworked single-vision ophthalmic-pressing intakes were subsequently available and
    read in full: the former is a raw-to-open-shell ribbon-blowing route for later light-source assembly; the
    latter is an optically unworked pressing for later lens surfacing. Neither supplies this as-moulded
    finished luminaire rim/flange and shade optical-face acceptance. 37193 and37195 frozen intakes remained
    unavailable at final read; their original classification and all five retained empty-scaffold contexts
    were read without treating scaffolds as methodology. No shared mapping/index/ADR changes."
  source_synthesis_limitations: BREF raw batch/electric melting/special-glass pressing plus independent EPA
    pressing/cooling/annealing/inspection context and Lampoptics real pressed-shade/electric-furnace/annealing
    capability are qualitative technical synthesis, not one SKU, plant, recipe or contemporary order. The
    as-pressed clear rim/flange configuration excludes optional secondary finishing. No source recipe, size,
    yield, temperature, lifetime, optical/thermal/safety rating, density or emission/utility factor is a
    default. BREF Table2.8 is final oxide guide; Table3.34 is historical ceramic/tube/bulb non-electric cases
    per melted glass. Mineral-wool and container-water figures are countercontext only. ILCD alone supports
    attributional allocation hierarchy; shared-material fragment_verified or exit0 does not imply
    applicability/coverage.
  reference_gate: Unique new first quality release Q in net dry bare-shade kg. Closing same-cohort FG is already
    in Q and never manufacturing Bclose or another production output. Manufacturing Bclose only
    not-yet-released raw/batch/melt/WIP/internal cullet and separately reconciled non-WIP installed/store
    residue. Separate observed FG services retain original cohort Q and horizon; original dispatch reversal,
    real increments, water changes/losses and complete stock vectors remain. Physical gates cancel internal Q
    on consolidation. Raw quantities remain undivided; only calc_reference performs A_i/Q once. Q0 retains
    actual burdens without unit result.
  core_reference_identity: Confirmed public exact native finished-manufactured glass lighting-component family
    on Mass/kg. It is applied only to the explicitly narrower shade with real manufacturing/terminal evidence,
    not generic glass, tableware, open bulb envelope or complete luminaire. Actual
    grade/configuration/provider and collected values remain dataset obligations.
  ordinary_data_gaps: Actual factory recipe, assays, supplier compatibility, quantitative stock/cohort records,
    true atmospheric species and auxiliary UUID matches are required during data production. They are not
    fabricated quantities and do not themselves turn the established product/route into a missing core
    identity.
