          markdown: "# Electrically melted pressed soda-lime glass lamp shades\n\nAll rules in this PCR apply only to complete manufacture of bare clear uncoloured soda-lime luminaire glass shades from individual mineral ingredients and compatible cullet: electric melting/fining/conditioning, three-part-mould gob pressing, electric annealing and drawing-based first inspection/release of the final as-moulded rim/flange. Exclude open electric-lamp envelopes, complete lamps/luminaires, jars/tableware, spectacle-glass blanks, ampoules, tubing/sheets/glass fibres and cellular glass; exclude borosilicate/quartz/lead/opal/coloured glass, blowing/spinning, normal fossil-fired melting and grinding/drilling/fire-polishing/acid-etching/sandblasting/coating/strengthening/lamination/assembly routes. Use every restriction with the actual composition/drawing and native identity in sections1–3.\n\nThe first-release gate and stock/package/normalization equations below are explicit foreground collection/calculation conventions of this PCR; external documents support only their stated process mechanisms and allocation hierarchy. The only Q is original-cohort newly first-quality-released net dry bare-shade kg; same-cohort closing FG is already in Q. Reconcile manufacture and actually observed FG services in separate physical gates and original-cohort vectors, cancelling internal Q on consolidation. Raw quantities remain undivided; after unit conversion and actual assignment/allocation, only calc_reference performs A_i/Q once. Species/water phases, total mass/elements, gross packages and asset physical ledgers remain independent; no numerical default or automatic credit. [jrc-glass-bref-2013; epa-pressed-glass-1975; lampoptics-pressed-shades; jrc-ilcd-2010]\n\n"
    - unit_id: "normative_183829"
      family: "allocation"
      span:
        start:
          offset: 183829
          line: 1602
          column: 1
        end:
          offset: 189001
          line: 1615
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nApply all allocation rules together only within their stated attributional scenario and actual multifunctionality conditions; no fixed share or automatic substitution benefit is prescribed.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_applicability | attributional multifunctional processes | Apply this hierarchy only to attributional cases requiring allocation. Identify actual coproduct/waste/reuse status at the physical process gate and disclose the specific shared exchange and functions. An industrial product specification, value-bearing waste or real return does not by itself justify coproduct allocation or substitution credit. | `jrc-ilcd-2010` |\n| a_subdivide | all shared exchanges | First assign exclusively attributable measurements and embodied materials to their actual product/cohort. Subdivide physically or virtually using supported process separation and actual records, retaining all nonproductive burdens. Document what cannot truly be subdivided and why; no arbitrary zero burden for failed output. | `jrc-ilcd-2010` |\n| a_causality | remaining shared exchanges | For each remaining exchange determine the physical cause of its amount and which functions actually determine it; apply that exchange-specific relationship with measured drivers. Furnace residence/load and actual heat demand, press/lehr service, transport capacity and storage area-time may differ. Mere mass/energy correlation is not determining causality and one share cannot be applied to all exchanges. | `jrc-ilcd-2010` |\n| a_residual | genuinely non-subdividable noncausal remainder | Only the genuinely remaining noncausal common-process inventory uses relative real contemporaneous market values of actual outputs in their actual state at the same common gate. Remove downstream transport/conditioning/packing value not present there; document quantities, prices, period and sensitivity. Do not use final delivery prices for unfinished products or freely choose physical versus economic allocation. | `jrc-ilcd-2010` |\n| a_physical | all balances | Allocation assigns burdens; it does not reduce gross physical product/air/water/package/asset mass or close a species balance. Internal cullet, returnable packaging and returned shades receive no fixed share or automatic avoided-primary credit. Retain true waste treatment and original-cohort reversal/increments. | `jrc-ilcd-2010` |\n| asset_manufacture_conservation | existing capital/reusable manufacture attribution | Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory. |  |\n\n"
