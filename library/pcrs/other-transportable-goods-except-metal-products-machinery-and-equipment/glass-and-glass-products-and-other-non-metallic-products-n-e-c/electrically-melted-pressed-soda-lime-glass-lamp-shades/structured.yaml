    - rule_id: b_route
      applies_to: "all datasets"
      rule: "Begin at receipt of individually supplied mineral ingredients and compatible separately traced cullet. Include inbound freight/storage/weighing/mixing; electric resistive melting/fining and conditioning; gob shearing; matched three-part mould pressing/cooling/release; electric annealing/cooling; drawing-based inspection and unique first release. Include actual cooling/compressed-air generation, extraction/treatment, maintenance and all failed/startstop/idle/hot-hold/cleanup/rework modes."
