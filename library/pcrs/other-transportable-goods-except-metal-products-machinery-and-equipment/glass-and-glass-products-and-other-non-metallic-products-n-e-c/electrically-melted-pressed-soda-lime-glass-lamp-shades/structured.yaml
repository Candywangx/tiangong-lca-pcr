      markdown: "## 9. Validation Rules\n\nThe checks below require actual evidence; structural checking does not establish future factory measurements, scientific review or human translation approval.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_terminal | all datasets | Verify actual clear soda-lime shade composition, complete raw-to-pressed/electric-annealed route, finished rim/flange drawing and inspection. Reject use of open electric-lamp envelopes, complete luminaires, tableware or wrong native glass families. Mandatory missing core terminal/identity/route evidence prevents a usable completed dataset. | `lampoptics-pressed-shades`; `jrc-glass-bref-2013`; `epa-pressed-glass-1975` |\n| v_reference | all inventory rows | Match the unique finished_shade Product output to the declared reference UUID and 1kg net dry bare first-release basis. All rows retain their own native extensive numerator unit and the same original cohort denominator. Require all qualifiers and actual weighed conversion for counts; Item(s)/item factor1 never supplies kg/item. | `jrc-glass-bref-2013`; `epa-pressed-glass-1975`; `lampoptics-pressed-shades`; `jrc-ilcd-2010` |\n| v_quantities | all inventory rows | Require undivided raw records, once-only unit/rate conversion, actual history reconciliation/allocation and one A_i/Q normalization through calc_reference. Q0 retains real burdens without a unit result. Check every stock vector, packaging leg, return reversal, incremental rework and observed service horizon; reinspection and closing FG create no new production. | `jrc-ilcd-2010` |\n| v_identity | all UUID-bearing exchanges | Preserve every native name/comment/CAS/form/grade/route/geography/medium/type/property restriction in the consumed card context. Reference mass, electricity energy, volume and transport service are not interchangeable. A successful schema or measurement check supplies no actual supplier match or scientific approval. Unbound concrete atomic exchanges require proper matching before dataset use. | `jrc-ilcd-2010` |\n| v_closure | all physical gates | Require independent total/element and actual molecular/phase closures at manufacture, service and consolidated gates. No double purchase of formulation constituents, energy plus its provider fuel, whole air plus its subcomponents or a waste mixture plus its constituent assays. Real missing species/reaction water, stocks, return history or quantities remain unknown and cannot be called measured pass. | `jrc-glass-bref-2013`; `epa-pressed-glass-1975`; `jrc-ilcd-2010` |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
