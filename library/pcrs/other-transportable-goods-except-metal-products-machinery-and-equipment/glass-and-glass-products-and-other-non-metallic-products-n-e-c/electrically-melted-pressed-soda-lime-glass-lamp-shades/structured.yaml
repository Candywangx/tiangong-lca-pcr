    - protocol_id: cp_packaging
      process_id: "services"
      flow_role: "carton_new; carton_return_received; carton_gross_out; carton_return_sent; carton_waste; divider_new; divider_return_received; divider_gross_out; divider_return_sent; divider_waste; film_new; film_return_received; film_gross_out; film_return_sent; film_waste; pallet_new; pallet_return_received; pallet_gross_out; pallet_return_sent; pallet_waste"
      record_type: "Raw measurement and history record"
      raw_fields: "one article/composition; moisture/tare; exclusive opening/closing empty attachedWIP attachedFG reusable stock; new purchase; supplier-included arrival; return received; gross shipment; external return sent; waste; repair new/old parts; cohort/vector"
      collection_method: "Calibrated article/leg weighing and raw stock/receipt/dispatch/return/waste records under calc_packaging. Supplier-included packaging enters physically without new acquisition; internal reuse cancels. Use independently weighed same-configuration mass for counts, preserving real moisture and repair parts. Aggregation method: Sum each undivided actual raw amount; convert, reconcile history and actually assign/allocate first. Only calc_reference computes x_i once; this protocol and cards reference that same x_i without another normalization."
      unit: "kg; count with actual measured mass"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service horizon separately"
      site_scope: "Each real line/equipment/circuit/stock and physical gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original invoices and waybills; independent composition/species assays; complete physical/history ledgers; uncertainty"
  calculation_rules:
    - id: calc_convert
      applies_to: "all inventory rows"
      rule: "Convert undivided raw_i once to its own row unit before allocation. kWh ×3.6 = MJ only for the native energy rows; kg stays kg; tkm uses actual payload tonnes × actual distance. Integrate true rates only. Already integrated gas/liquid volume is not multiplied by time again. Mass/volume needs independently measured density of that actual substance/state; never water density for oil/emulsion or density inferred from a secondary flow coefficient. Count needs calibrated same-configuration net mass with stated sampling; no invented kg/item."
      inputs:
        - cp_batch
        - cp_energy
        - cp_water
        - cp_formula
        - cp_asset
        - cp_species
        - cp_transport
        - cp_packaging
        - cp_service_energy
        - cp_service_water
        - cp_service_transport
      output: "converted_raw_i"
      source_ids:
        - jrc-glass-bref-2013
        - epa-pressed-glass-1975
    - id: calc_history
      applies_to: "all inventory rows"
      rule: "Reconcile each converted undivided exchange vector using b_history and b_services before applying section7 actual assignment/allocation. Manufacturing Bclose includes only unreleased raw/batch/melt/WIP/internal cullet and separately reconciled residual non-WIP stores/installed assets. First-released closingFG belongs to Q, not manufacturing Bclose. Service openingFG + firstQ transfer + actual original-dispatch reversal + true incremental additions = service closingFG + gross-dispatch destination vectors + actual other destinations. Preserve original cohorts and actual state/mass changes; reverse original delivery rather than assuming current returned mass equals original mass."
      inputs:
        - cp_batch
        - cp_release
        - cp_asset
        - cp_formula
        - cp_service
        - cp_packaging
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q; A_i is the converted history-reconciled actually assigned/allocated undivided numerator for the originating first-release cohort; Q is its unique newly first-quality-released net dry bare-shade kg. Execute exactly once for Q>0. For Q=0 retain actual raw burdens and investigation/future traced assignment without a unit result. Every card and aggregation references this same x_i without a second division. Services retain separate vectors and their original cohort Q and observed horizon."
      inputs:
        - cp_release
        - cp_batch
        - cp_energy
        - cp_water
        - cp_formula
        - cp_asset
        - cp_waste
        - cp_species
        - cp_transport
        - cp_service
        - cp_service_energy
        - cp_service_water
        - cp_service_transport
        - cp_packaging
      output: "x_i"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "Reconcile opening physical stock + actual external inputs = closing stock + actual gross exits at manufacture and FG services separately. Manufacture first-Q outlet is service internal inlet; cancel it on consolidation, retaining gross external shipment/return and closing FG without adding another external Q. Preserve full asset/fluid physical legs and measured wear. Total wet/dry mass and relevant elements are independent from actual molecular species and free/carrier/structural/reaction water; one residual cannot determine two unknowns. Count fuel carrier mass and heat in distinct subledgers without duplicate purchase."
      inputs:
        - cp_batch
        - cp_release
        - cp_water
        - cp_formula
        - cp_asset
        - cp_species
        - cp_waste
        - cp_service
        - cp_service_water
      output: "physical_closure"
      source_ids:
        - jrc-glass-bref-2013
        - epa-pressed-glass-1975
    - id: calc_packaging
      applies_to: "all inventory rows"
      rule: "For each single article: opening empty + attachedWIP + attachedFG + reusable + new purchase + supplier-included physical arrival + external-return-received = corresponding closing + with gross physical dispatch + standalone external-return-sent + waste. Legs must be mutually exclusive; cancel internal reuse, preserve real moisture and separately named repair new/old parts. Derive actual acquisition/service burden separately for the original cohort. Never put packages in shade Q, shrink gross mass by allocation, repurchase an internal return or grant automatic coproduct credit."
      inputs:
        - cp_packaging
        - cp_service
      output: "packaging_closure"
      source_ids:
        - jrc-ilcd-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_terminal
      applies_to: "all datasets"
      requirement: "Declare actual composition, rim/flange/optical-face drawing, press and electric-melt/lehr route, annealing and actual inspection/release. Manufacturer capability does not prove the future plant/supplier or safety certification."
      evidence: "drawing; actual batch and equipment records; supplier specification; net weighing; release tests"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Collect same full production period, all operating modes and complete opening/closing inherited vectors. Disclose each actually observed post-release horizon with old cohorts and incomplete future services."
      evidence: "full period logs; calibration; actual stock and cohort histories; horizon disclosure"
    - id: dq_identity
      applies_to: "all UUID-bearing rows"
      requirement: "Require actual native identity restrictions and supplier/form match; unbound auxiliary identities stay concrete. Source-specific industrial process evidence is separate from attributional allocation and UUID identity."
      evidence: "native identity records; exact reference-property and unit chain; actual supplier assay/SDS"
    - id: dq_closure
      applies_to: "all physical gates"
      requirement: "Retain independent total/element/species/water calibration, detection limits and uncertainty, actual conversions/allocation, returns, stock vectors and gross packaging/assets. Unknown real core relationships remain unknown."
      evidence: "independent assays; original meters; physical and burden ledgers; uncertainty and gap report"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "The checks below require actual evidence; structural checking does not establish future factory measurements, scientific review or human translation approval."
    source_ids: []
  - rule_id: v_terminal
    applies_to: "all datasets"
    rule: "Verify actual clear soda-lime shade composition, complete raw-to-pressed/electric-annealed route, finished rim/flange drawing and inspection. Reject use of open electric-lamp envelopes, complete luminaires, tableware or wrong native glass families. Mandatory missing core terminal/identity/route evidence prevents a usable completed dataset."
    source_ids:
      - lampoptics-pressed-shades
      - jrc-glass-bref-2013
      - epa-pressed-glass-1975
  - rule_id: v_reference
    applies_to: "all inventory rows"
    rule: "Match the unique finished_shade Product output to the declared reference UUID and 1kg net dry bare first-release basis. All rows retain their own native extensive numerator unit and the same original cohort denominator. Require all qualifiers and actual weighed conversion for counts; Item(s)/item factor1 never supplies kg/item."
    source_ids:
      - jrc-glass-bref-2013
      - epa-pressed-glass-1975
      - lampoptics-pressed-shades
      - jrc-ilcd-2010
  - rule_id: v_quantities
    applies_to: "all inventory rows"
    rule: "Require undivided raw records, once-only unit/rate conversion, actual history reconciliation/allocation and one A_i/Q normalization through calc_reference. Q0 retains real burdens without a unit result. Check every stock vector, packaging leg, return reversal, incremental rework and observed service horizon; reinspection and closing FG create no new production."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_identity
    applies_to: "all UUID-bearing exchanges"
    rule: "Preserve every native name/comment/CAS/form/grade/route/geography/medium/type/property restriction in the consumed card context. Reference mass, electricity energy, volume and transport service are not interchangeable. A successful schema or measurement check supplies no actual supplier match or scientific approval. Unbound concrete atomic exchanges require proper matching before dataset use."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_closure
    applies_to: "all physical gates"
    rule: "Require independent total/element and actual molecular/phase closures at manufacture, service and consolidated gates. No double purchase of formulation constituents, energy plus its provider fuel, whole air plus its subcomponents or a waste mixture plus its constituent assays. Real missing species/reaction water, stocks, return history or quantities remain unknown and cannot be called measured pass."
    source_ids:
      - jrc-glass-bref-2013
      - epa-pressed-glass-1975
      - jrc-ilcd-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Composition/route/host-compatible glass-shade manufacturing data; post-release services separately disclosed by original cohort"
  allowed_use: "Link compatible luminaire-component supply only after actual input/property/provider and terminal applicability checks"
  excluded_use: "No whole-leaf average, open bulb envelope, complete-lamp performance, safety certification, arbitrary glass substitution or undisclosed future services"
  required_metadata: "all section3 qualifiers; actual factory and period; netQ and each raw/history ledger; original-cohort service horizon; sources and native restrictions"
  required_quality_disclosure: "actual coverage and unknowns; source-specific applicability limits; measurement state; reuse/allocation method; stock/species closure; unobserved services; review state"
