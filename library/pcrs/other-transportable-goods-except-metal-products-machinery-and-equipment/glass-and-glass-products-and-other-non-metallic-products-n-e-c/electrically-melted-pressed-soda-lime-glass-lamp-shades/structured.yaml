      site_scope: "Each real line/equipment/circuit/stock and physical gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original invoices and waybills; independent composition/species assays; complete physical/history ledgers; uncertainty"
    - protocol_id: cp_waste
