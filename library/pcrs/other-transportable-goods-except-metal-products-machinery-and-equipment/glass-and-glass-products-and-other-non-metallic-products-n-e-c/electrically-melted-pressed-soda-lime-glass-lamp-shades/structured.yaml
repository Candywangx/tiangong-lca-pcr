      collection_method: "Segregated calibrated weighing, sampling and actual destination receipts for each waste. A whole emulsion/sludge is not also exported as all its assay constituents; treatment direct emissions need separate actual species evidence. Aggregation method: Sum each undivided actual raw amount; convert, reconcile history and actually assign/allocate first. Only calc_reference computes x_i once; this protocol and cards reference that same x_i without another normalization."
      unit: "kg"
