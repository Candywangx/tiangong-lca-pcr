      flow_role: "shear_concentrate; mould_release"
      record_type: "Raw measurement and history record"
      raw_fields: "single whole supplied formulation; supplier/SDS; assay; free/carrier/structural water; applied/retained/captured fractions; actual mixing ingredients; mixing energy; opening/closing preparation; losses"
      collection_method: "Weigh the whole supplied shear concentrate or release paste once; carrier/active components remain child accounts. Independently measure actual site dilution/compounding inputs and genuine step-specific reacted extent/water; no total-C/VOC-to-species guess. Aggregation method: Sum each undivided actual raw amount; convert, reconcile history and actually assign/allocate first. Only calc_reference computes x_i once; this protocol and cards reference that same x_i without another normalization."
