      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Individually supplied actual mineral ingredients and separately traced compatible cullet; no purchased-finished-shade start |\n| starting_condition_role | Actual supply-gate and upstream-link facts |\n| product_classification_scope | Narrow CPC37196 bare glass luminaire-shade manufacture; no whole-leaf extrapolation |\n| recursive_input_rule | Same-category returns/cullet stop at declared supply gate with original burdens and traced conversion; internal reuse cancels |\n| upstream_dataset_requirement | Complete compatible actual material preparation/transport, utility and asset-service upstream links without provider duplication |\n| disclosure | Composition/drawing, electric-melt/press/anneal route, all modes, firstQ, raw/WIP/non-WIP vectors, original-cohort FG service horizon, packages/assets, true species/water and every gap |\n\nAll boundary rules below apply together; conditions, physical gates and original-cohort limits must not be removed from a selected rule.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | all datasets | Begin at receipt of individually supplied mineral ingredients and compatible separately traced cullet. Include inbound freight/storage/weighing/mixing; electric resistive melting/fining and conditioning; gob shearing; matched three-part mould pressing/cooling/release; electric annealing/cooling; drawing-based inspection and unique first release. Include actual cooling/compressed-air generation, extraction/treatment, maintenance and all failed/startstop/idle/hot-hold/cleanup/rework modes. | `jrc-glass-bref-2013`; `epa-pressed-glass-1975`; `lampoptics-pressed-shades` |\n| b_optional | all inventory rows | Conditional means demonstrably absent or actually measured, never automatically zero. Add every real ingredient, whole supplied preparation, fuel, water-treatment chemical, sorbent, refrigerant, repair part, package and identified exit as its own physical exchange. Actual on-site compounding lists every purchased constituent and real energy/loss. Optional tempering, chemical strengthening, grinding/drilling, frosting, coating, decoration, lamination or assembly is outside this selected route and requires new applicability review. | `jrc-glass-bref-2013`; `epa-pressed-glass-1975`; `lampoptics-pressed-shades` |\n| b_q_gate | all datasets | Q is unique newly first-quality-released net dry bare-shade kg for the actual cohort. Include the actual finished glass mass; exclude removable packages and fixture hardware. Same-cohort closing FG is already in Q. Manufacture ends at first release and transfers Q internally to services; it cannot both debit closing FG and count Q, or add Q and closing FG as two outputs. Shipment/return/reinspection creates no new Q. | `lampoptics-pressed-shades`; `jrc-ilcd-2010` |\n| b_history | all datasets | Manufacturing inherited-vector equation: opening raw/batch/melt/WIP/internal-cullet and non-WIP stores/installed burden plus real additions equals closing not-yet-released raw/batch/melt/WIP/internal-cullet and separately reconciled residual non-WIP installed/store burden plus actual first-Q cohort burden and other traced destinations. Closing newly first-released FG never belongs in manufacturing Bclose. Preserve each exchange vector through failures, zero output, internal returns and real rework. | `jrc-ilcd-2010` |\n| b_services | services | Keep an actual separate post-release account with original cohort Q, inherited vector and observed horizon. Opening FG vector plus first-Q transfer plus actual returned original-dispatch reversal plus real incremental service additions equals closing FG vector plus gross-dispatch destination vectors plus real other destinations. Reverse the actual original-delivery vector; returned mass need not equal original-delivery mass. Measure actual new/removed material, water, losses and rework. Closing FG remains with its original burden, and unobserved future services remain disclosed. | `jrc-ilcd-2010` |\n| b_physical | all physical gates | At manufacturing, FG-service and consolidated gates reconcile opening physical stock plus actual inputs against closing stock plus gross product/waste/species exits. Manufacture Q is the service internal inlet; cancel Q on consolidation so Q is not another external exit alongside FG and shipments. Gross air, asset and package mass is not shrunk by economic allocation. Independently reconcile total mass/relevant elements, true species and free/carrier/structural/reaction water; never fit two unknowns with one residual. | `jrc-glass-bref-2013`; `epa-pressed-glass-1975`; `jrc-ilcd-2010` |\n| b_assets | cp_asset | Separate physical installation and fluid stock from actual period service burden for furnace, press, electric lehr, mould, electrodes and each refractory/filter article. Preserve real refurbishment new/old parts, moisture, installed fluid, residual vector and wear destinations without a fixed life, full immediate consumption or one machine per kg. Check embedded replacement-material/provider coverage before adding an exchange. | `jrc-glass-bref-2013`; `epa-pressed-glass-1975`; `jrc-ilcd-2010` |\n| b_upstream | all product inputs | Use compatible upstream extraction/preparation/transport or utility-supply datasets without hiding unperformed glass manufacture in a finished-shade purchase. Same-category unfinished/returned shade or cullet retains original cohort burdens and explicitly traced conversion; stop recursion at that declared supply condition. Internal reuse creates no purchase, extra Q or avoided-production credit. | `jrc-ilcd-2010` |\n\n"
