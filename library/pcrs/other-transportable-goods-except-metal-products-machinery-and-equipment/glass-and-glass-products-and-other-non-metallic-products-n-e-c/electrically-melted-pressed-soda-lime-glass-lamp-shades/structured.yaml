        - jrc-glass-bref-2013
        - epa-pressed-glass-1975
        - lampoptics-pressed-shades
    - rule_id: b_optional
      applies_to: "all inventory rows"
      rule: "Conditional means demonstrably absent or actually measured, never automatically zero. Add every real ingredient, whole supplied preparation, fuel, water-treatment chemical, sorbent, refrigerant, repair part, package and identified exit as its own physical exchange. Actual on-site compounding lists every purchased constituent and real energy/loss. Optional tempering, chemical strengthening, grinding/drilling, frosting, coating, decoration, lamination or assembly is outside this selected route and requires new applicability review."
      source_ids:
        - jrc-glass-bref-2013
        - epa-pressed-glass-1975
        - lampoptics-pressed-shades
    - rule_id: b_q_gate
      applies_to: "all datasets"
      rule: "Q is unique newly first-quality-released net dry bare-shade kg for the actual cohort. Include the actual finished glass mass; exclude removable packages and fixture hardware. Same-cohort closing FG is already in Q. Manufacture ends at first release and transfers Q internally to services; it cannot both debit closing FG and count Q, or add Q and closing FG as two outputs. Shipment/return/reinspection creates no new Q."
      source_ids:
        - lampoptics-pressed-shades
        - jrc-ilcd-2010
    - rule_id: b_history
      applies_to: "all datasets"
      rule: "Manufacturing inherited-vector equation: opening raw/batch/melt/WIP/internal-cullet and non-WIP stores/installed burden plus real additions equals closing not-yet-released raw/batch/melt/WIP/internal-cullet and separately reconciled residual non-WIP installed/store burden plus actual first-Q cohort burden and other traced destinations. Closing newly first-released FG never belongs in manufacturing Bclose. Preserve each exchange vector through failures, zero output, internal returns and real rework."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_services
      applies_to: "services"
      rule: "Keep an actual separate post-release account with original cohort Q, inherited vector and observed horizon. Opening FG vector plus first-Q transfer plus actual returned original-dispatch reversal plus real incremental service additions equals closing FG vector plus gross-dispatch destination vectors plus real other destinations. Reverse the actual original-delivery vector; returned mass need not equal original-delivery mass. Measure actual new/removed material, water, losses and rework. Closing FG remains with its original burden, and unobserved future services remain disclosed."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_physical
      applies_to: "all physical gates"
      rule: "At manufacturing, FG-service and consolidated gates reconcile opening physical stock plus actual inputs against closing stock plus gross product/waste/species exits. Manufacture Q is the service internal inlet; cancel Q on consolidation so Q is not another external exit alongside FG and shipments. Gross air, asset and package mass is not shrunk by economic allocation. Independently reconcile total mass/relevant elements, true species and free/carrier/structural/reaction water; never fit two unknowns with one residual."
      source_ids:
        - jrc-glass-bref-2013
        - epa-pressed-glass-1975
        - jrc-ilcd-2010
    - rule_id: b_assets
      applies_to: "cp_asset"
      rule: "Separate physical installation and fluid stock from actual period service burden for furnace, press, electric lehr, mould, electrodes and each refractory/filter article. Preserve real refurbishment new/old parts, moisture, installed fluid, residual vector and wear destinations without a fixed life, full immediate consumption or one machine per kg. Check embedded replacement-material/provider coverage before adding an exchange."
      source_ids:
        - jrc-glass-bref-2013
        - epa-pressed-glass-1975
        - jrc-ilcd-2010
    - rule_id: b_upstream
      applies_to: "all product inputs"
      rule: "Use compatible upstream extraction/preparation/transport or utility-supply datasets without hiding unperformed glass manufacture in a finished-shade purchase. Same-category unfinished/returned shade or cullet retains original cohort burdens and explicitly traced conversion; stop recursion at that declared supply condition. Internal reuse creates no purchase, extra Q or avoided-production credit."
