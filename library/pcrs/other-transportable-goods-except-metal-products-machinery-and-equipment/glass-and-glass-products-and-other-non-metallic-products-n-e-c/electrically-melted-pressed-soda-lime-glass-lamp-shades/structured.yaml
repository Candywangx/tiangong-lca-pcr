      collection_method: "Calibrated stage/circuit submeter and invoice reconciliation for batch/melt/conditioning/press/lehr/cooling/compression/extraction/QC/treatment. Separately record actual campaign-start gas and its whole mass; do not double the electricity supplier fuel. Aggregation method: Sum each undivided actual raw amount; convert, reconcile history and actually assign/allocate first. Only calc_reference computes x_i once; this protocol and cards reference that same x_i without another normalization."
      unit: "kWh; MJ; kg; actual gas volume/state"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service horizon separately"
      site_scope: "Each real line/equipment/circuit/stock and physical gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original invoices and waybills; independent composition/species assays; complete physical/history ledgers; uncertainty"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "process_water; steam; cooling_water_in; cooling_return; condensate_return"
      record_type: "Raw measurement and history record"
      raw_fields: "source/phase; makeup; meter volume/mass; density/temperature/pressure; inlet/return enthalpy; supplier convention; installed opening/closing fluid; purge; condensate; evaporation; true water origin"
      collection_method: "Meter only actual external supplies and real Product returns; trace water into batch/preparation/cooling/cullet and each outlet, cancelling recirculation. Steam/condensate or heat-exchange-water return requires actual contract/state evidence, not an assumed boiler. Aggregation method: Sum each undivided actual raw amount; convert, reconcile history and actually assign/allocate first. Only calc_reference computes x_i once; this protocol and cards reference that same x_i without another normalization."
      unit: "kg; actual volume/state; MJ"
