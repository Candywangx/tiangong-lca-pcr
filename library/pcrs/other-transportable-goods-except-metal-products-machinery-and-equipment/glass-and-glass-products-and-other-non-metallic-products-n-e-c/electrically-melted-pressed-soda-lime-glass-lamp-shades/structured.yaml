      record_type: "Raw measurement and history record"
      raw_fields: "single asset/part/material/fluid; composition/form; actual new/old repair items; opening/closing installed and non-WIP stores; original burden vector; actual service/campaign driver; wear and retirement; retained moisture/fluids"
      collection_method: "Weigh each actual new/retired article and fluid separately and inspect real equipment/maintenance records. Reconcile gross physical stock independently from actual service burden release/residual vector; no fixed lifetime or immediate full purchase consumption. Preserve real replacements without duplicating embedded article material. Aggregation method: Sum each undivided actual raw amount; convert, reconcile history and actually assign/allocate first. Only calc_reference computes x_i once; this protocol and cards reference that same x_i without another normalization."
