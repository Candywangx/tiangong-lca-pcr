allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Apply all allocation rules together only within their stated attributional scenario and actual multifunctionality conditions; no fixed share or automatic substitution benefit is prescribed."
    source_ids: []
  - rule_id: a_applicability
    applies_to: "attributional multifunctional processes"
    rule: "Apply this hierarchy only to attributional cases requiring allocation. Identify actual coproduct/waste/reuse status at the physical process gate and disclose the specific shared exchange and functions. An industrial product specification, value-bearing waste or real return does not by itself justify coproduct allocation or substitution credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_subdivide
    applies_to: "all shared exchanges"
    rule: "First assign exclusively attributable measurements and embodied materials to their actual product/cohort. Subdivide physically or virtually using supported process separation and actual records, retaining all nonproductive burdens. Document what cannot truly be subdivided and why; no arbitrary zero burden for failed output."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange determine the physical cause of its amount and which functions actually determine it; apply that exchange-specific relationship with measured drivers. Furnace residence/load and actual heat demand, press/lehr service, transport capacity and storage area-time may differ. Mere mass/energy correlation is not determining causality and one share cannot be applied to all exchanges."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "genuinely non-subdividable noncausal remainder"
    rule: "Only the genuinely remaining noncausal common-process inventory uses relative real contemporaneous market values of actual outputs in their actual state at the same common gate. Remove downstream transport/conditioning/packing value not present there; document quantities, prices, period and sensitivity. Do not use final delivery prices for unfinished products or freely choose physical versus economic allocation."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_physical
    applies_to: "all balances"
    rule: "Allocation assigns burdens; it does not reduce gross physical product/air/water/package/asset mass or close a species balance. Internal cullet, returnable packaging and returned shades receive no fixed share or automatic avoided-primary credit. Retain true waste treatment and original-cohort reversal/increments."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch
      process_id: "manufacture"
      flow_role: "silica; soda; limestone; dolomite; alumina; sulfate; nitrate; batch_carbon; external_cullet"
      record_type: "Raw measurement and history record"
      raw_fields: "actual whole lot; raw issue/receipt; formula/assay; moisture; carbonate carbon; cullet origin/contamination; opening/closing raw batch melt WIP cullet; each inherited vector"
      collection_method: "Calibrated weighing/tare and independent composition/moisture analysis; reconcile actual receipt/issue and every stock/cohort. Glass oxide analysis is not a purchased ingredient recipe. Aggregation method: Sum each undivided actual raw amount; convert, reconcile history and actually assign/allocate first. Only calc_reference computes x_i once; this protocol and cards reference that same x_i without another normalization."
      unit: "kg"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service horizon separately"
      site_scope: "Each real line/equipment/circuit/stock and physical gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original invoices and waybills; independent composition/species assays; complete physical/history ledgers; uncertainty"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_shade"
      record_type: "Raw measurement and history record"
      raw_fields: "unique shade/lot; actual drawing and rim/flange datum; net dry bare mass; annealing/QC; first release time; Q; rejected and reworked lots; WIP/FG movements"
      collection_method: "Calibrated bare-shade weighing excluding packages/fixture hardware, matched to visual/dimensional/residual-stress and specified fit/optical acceptance. Sum unique new first-release kg Q; no repeat shipment/reinspection or capacity-to-mass assumption. Aggregation method: Sum each undivided actual raw amount; convert, reconcile history and actually assign/allocate first. Only calc_reference computes x_i once; this protocol and cards reference that same x_i without another normalization."
      unit: "kg"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service horizon separately"
      site_scope: "Each real line/equipment/circuit/stock and physical gate"
      aggregation_rule: "per 1 kg reference flow"
