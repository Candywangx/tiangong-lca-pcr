    used_for: "Only attributional cases requiring allocation: subdivision/virtual subdivision then exchange-specific determining physical causality then genuinely remaining common-gate contemporaneous market value; sections7.9.2–7.9.3 PDFpp275–288. No industrial manufacturing evidence, fixed shares, unrestricted economic/physical choice or automatic credit. References from boundary/history/normalization/service rules support their actual allocation step only; first-release gates, stock/package balances and once-only normalization are explicit PCR foreground protocol conventions, not quoted ILCD mandates."
