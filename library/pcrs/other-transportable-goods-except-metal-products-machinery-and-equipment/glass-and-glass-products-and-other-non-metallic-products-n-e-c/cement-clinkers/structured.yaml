product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.glass-and-glass-products-and-other-non-metallic-products-n-e-c.cement-clinkers"
  classification_refs: "CPC 3.0 37430; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "Grey Portland clinker from the specified dry preheater-precalciner/grate-cooler route; no universal coverage of every cement clinker"
  excluded_products: "Exclude wet, semi-wet, semi-dry, shaft-kiln, white-clinker whitening/quenching, calcium-aluminate and other clinker chemistries unless independently extended and reviewed. Exclude gypsum/addition blending, cement finish grinding, cement bags, concrete, installation, use, hydration and carbonation service claims. Crushing hot clinker for cooler operation is included; grinding clinker with gypsum to make cement is excluded. Purchased finished clinker cannot replace mineral-to-clinker manufacture. No BREF temperatures, energy intensities, feed ratios, oxide percentages, strength values or emission factors are PCR defaults."
  representative_product: "Cooled unhydrated nodular Portland clinker meeting an actual manufacturer specification at first quality release"
  production_route: "This PCR covers grey Portland cement clinker produced from documented mineral supplies through preblending, raw-meal preparation, suspension preheating, separate precalcination, rotary-kiln sintering, grate cooling and first quality release. It is an attributional cradle-to-first-release manufacturing method with separately disclosed cohort storage/handling/dispatch services. It is a transparent technical synthesis of primary process descriptions, not one claimed SKU, factory observation or contemporary purchase order. Supplier extraction and transport remain upstream inventory or explicit controlled foreground operations, with one owner per operation."
  market_state: "Bulk clinker at first quality release; actual later packing/handling/dispatch services separately tied to original cohorts"
functional_unit:
  what: "Dry preheater-precalciner Portland cement clinker"
  how_much: "1 kg net dry first-released conforming clinker excluding packaging and free water"
  how_well: "Actual clinker specification, mineral phases/free lime and relevant laboratory acceptance records; no default strength grade, oxide recipe or test result"
  how_long_or_cycle: "One declared original production cohort and complete reporting interval; separate observed cohort service horizon; no assigned use life"
  reference_flow_link: "clinker_first_release"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "Manufacture"
      rule: "Include source-specific upstream quarrying and transport, receipt/preblending, crushing/milling/drying/homogenisation, fuel preparation, calcination/sintering, cooler/crusher, pollution control and first clinker acceptance. Declare purchased-prepared input boundaries; do not duplicate their provider operations."
      source_ids:
        - eu-jrc-clm-2013
        - us-epa-ap42-cement-2025
    - rule_id: b_quality_gate
      applies_to: "First release and stock history"
      rule: "Q is the sum of newly first-released conforming net dry clinker in the selected cohort. Reinspection, transfer, dispatch, returned FG and permitted rework never create another Q. Closing FG already belongs to Q; neither subtract its manufacturing burden nor add it as another production output. Opening raw material, WIP, hot meal, kiln coating/rings, held clinker and unallocated non-WIP stores carry exchange-specific inherited histories; distinguish them from already released FG."
      source_ids:
        - eu-jrc-clm-2013
    - rule_id: b_all_states
      applies_to: "Complete operation"
      rule: "Keep failed/off-spec/sampled clinker and all start-up, shutdown, idle, cleanup, repair, blocked cyclone, CO-trip and zero-output intervals. Record actual dispositions, losses and treatment without assuming recoverability. Rework of FG requires manufacturer/specification permission plus postwork testing, acceptance and disposition; hydraulic material damage is not presumed reversible. Q=0 retains the full burden ledger and yields no unit result."
      source_ids:
        - eu-jrc-clm-2013
    - rule_id: b_dust
      applies_to: "Dust and alternative feeds"
      rule: "Track kiln dust and bypass dust separately by internal return, retained stock, external use and disposal. Internal dust and recovered hot air/heat retain histories and cancel only at an actual consolidation boundary. Mineral carbonate CO2 and each fuel carbon origin remain separate. Accept alternative raw materials/fuels only with formulation, legal status, contamination, feed point and quality evidence; supplier waste status never grants zero burden or automatic credit."
      source_ids:
        - eu-jrc-clm-2013
        - us-epa-ap42-cement-2025
    - rule_id: b_atomic
      applies_to: "Every exchange"
      rule: "Every supplied formulation is purchased once as a whole; assay, carrier water, oxide/element composition and LHV are subaccounts. On-site preparation instead records every actual purchased ingredient, energy and loss. Add a separate named card/protocol for every actual flow absent below, including each process chemical, fuel, emission species, wastewater destination and packaging component; absence requires evidence, unknown is not zero. Gross material, water, gas, waste and asset quantities are never scaled by economic allocation shares."
      source_ids:
        - eu-jrc-clm-2013
    - rule_id: b_service
      applies_to: "Released clinker services"
      rule: "Retain storage, sampling, handling, conditional packing, loading, transport under control and returns as actual incremental services linked to original cohort c and its original Q_c over a declared observed service horizon. Carry opening/closing FG identity and prior manufacturing burden once; separate historical burden from new service burden. Internal Q cancels in the consolidated gate. Do not normalize service to current-period shipments, replace Q by net delivery, or repeat manufacturing because of a return; trace original dispatch and reversal records independently of returned wet weight. Retain performed original-cohort service even for held closing FG, using actual observed H_c without future-service assumptions. For actual permitted post-release work record new and removed materials/parts, new/old state and each added/removed water phase; keep repair-held FG as a labelled FG substate or a disjoint repair-WIP state once. Require actual permission, postwork tests, acceptance and final disposition; do not assume hydration damage is restored or create new manufactured Q."
      source_ids:
        - eu-jrc-clm-2013
    - rule_id: b_thermal
      applies_to: "Conditional heat systems"
      rule: "Recover cooler/exit-gas heat internally without a second purchased heat input. Include separate heat/power exports only when delivered and measured; no assumed CHP, boiler or steam. For actual external steam or hot-water systems keep carrier mass, temperature/pressure/phase, enthalpy, condensate/liquid return as a Product exchange, and provider water/energy ownership. No implicit water-density or enthalpy default."
      source_ids:
        - eu-jrc-clm-2013
    - rule_id: b_assets
      applies_to: "Physical assets and repair"
      rule: "Keep kiln shell, cooler, mill and each installed/replacement component physical stock separately from the period service burden. Track new/used refractory, steel parts, lubricant and maintenance water inflows/outflows plus full wet closing stocks. X_in/X_out only remove overlap with another listed flow, never a true influx retained in stock. Allocate embodied service from measured use and documented service history; no fixed lifetime or whole kiln per kg clinker."
      source_ids:
        - eu-jrc-clm-2013
boundary_abstraction:
  declared_starting_condition: "Whole mineral/fuel/water/utility/auxiliary supplies at disclosed provider gates, with full upstream extraction/production/transport; controlled quarry operations explicitly included once"
  starting_condition_role: "Cradle-to-first-release manufacture plus separate original-cohort service accounting"
  product_classification_scope: "A narrower real Portland-clinker route within CPC 3.0:37430; classification does not establish identity or positive mapping"
  recursive_input_rule: "Purchased clinker, if actually used for permitted seed/rework blending, requires its own qualified upstream manufacture and original identity; internal clinker/dust/raw-meal transfers retain histories and cancel internally once, never as another purchase or Q"
  upstream_dataset_requirement: "Match each actual provider, formulation, route, state, geography and period with one upstream burden owner; native identity does not establish provider/process compatibility"
  disclosure: "grey Portland clinker family and actual product specification; mineral phase and oxide analyses with actual methods and test ages where relevant; free lime and acceptance criteria without default limits; unhydrated nodular supply state and measured free moisture; dry preheater/precalciner rotary kiln and grate cooler configuration; mineral suppliers and quarry/transport ownership; each alternative mineral and fuel formulation/status/feed point; fossil/biogenic/mineral carbon and measured water phases; kiln/raw-mill operating modes and bypass/CKD return/export routes; site/geography and complete reporting horizon; first-release cohort Q and inherited raw/WIP/store burden vectors; cohort-specific FG service horizon and actual dispatch/return history; bulk or actual clinker packaging with upstream owner; native identity restrictions and unresolved exchanges; allocation and upstream dataset matches"
