allocation_rules:
  - rule_id: a_scope
    applies_to: "Attributional inventory"
    rule: "Use the attributional hierarchy only in the ILCD situations requiring allocation. Assign dedicated processes and uniquely attributable exchanges first; subdivide physically or virtually with defensible process evidence. Unneeded allocation is not mandatory."
    source_ids:
      - ec-jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "Remaining multifunctional exchanges"
    rule: "For each residual exchange identify its determining physical causal relationship with the actual co-functions. Mass, energy or any other physical ratio is admissible only when it determines that exchange; a single convenient plant-wide physical ratio is not justified by correlation. Retain the driver, measurements, affected flows and sensitivity."
    source_ids:
      - ec-jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "True unassigned residual"
    rule: "Only after dedicated assignment/subdivision/causality are exhausted may the common residual use documented contemporary market values of actual co-functions in their real state at the same common process gate. Record quantity, price basis, contracts, period, moisture/quality, gate, residual flow set and rationale; absent values remain unresolved. Do not mix dedicated processing or downstream transport prices into that ratio; do not choose freely between physical and economic rules or invent shares."
    source_ids:
      - ec-jrc-ilcd-2010
  - rule_id: a_waste
    applies_to: "Dust/waste/external sales"
    rule: "Ordinary exported or sold manufacturing waste, broken/failed clinker, samples and their treatment retain the manufacturing burdens they caused. Only a real independent co-function/cohort and justified one-time burden-transfer decision can transfer an exchange vector; preserve the entire physical gross flow. Neither revenue, waste status nor external recovery alone removes manufacture or grants avoided-production credit."
    source_ids:
      - ec-jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "burn_cool"
      flow_role: "First-release cohort"
      record_type: "foreground_record"
      raw_fields: "actual process; cohort; first acceptance record; wet net mass; tare; free moisture; dry Q; tests; raw/WIP/stores opening and closing; historic vectors; failures; samples; rework permission; postwork tests; disposition; gross dispatch/returns; original dispatch/reversal identifiers; actual observed H_c; held-FG performed services; repair-FG substate versus disjoint repair-WIP; actual new/removed materials and parts with new/old state; added/removed free/structural/reaction water; permission; postwork acceptance or rejection and destination ; actual work authorization/status separate from occurrence; unapproved/unauthorized/failed/rejected work; actual flow and burden capture; maker/spec permission; posttests; acceptance/disposition"
      collection_method: "Use calibrated scale/weigh-feeder and reconciled stock survey with product-specific moisture/phase tests and first-release authorisation. Trace each cohort once; record original-cohort Q for services and wet return changes separately.  Keep full first-release manufacturing Q including closing FG and all failures. Follow actual performed services against original Q_c/H_c; independently weigh repair inputs/removals and all affected wet stocks, without assuming damaged clinker is restored. The burden-stock equation does not assign the numerator of a custody-only gross physical card; that physical view uses full measured V under calc_inventory. For every actual manufacture or post-release work event, retain actual materials/water/energy, releases, wastes, custody and burdens whether authorized, unapproved, unauthorized, failed or rejected. Manufacturer/specification permission and postwork tests govern authorization and continued identity/quality, never erasure of actual flows or burdens. Retain original Q_c/H_c and actual acceptance/disposition; do not assume hydrated/damaged clinker restored. Future unperformed work stays unknown; only unused and unassigned stores may carry."
      unit: "kg"
      frequency: "Each batch/meter interval and stock boundary"
      temporal_coverage: "Complete cohort plus all failed/zero-output intervals; original service horizon separately"
      site_scope: "Declared kiln line with raw_prep, burn_cool and fg_service as applicable; actual supplier gates and original cohort. process_id identifies the governing kiln system; raw_fields separately retain the actual process."
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, original records, composition/phase tests, complete reconciliations and upstream ownership"
    - protocol_id: cp_raw
      process_id: "burn_cool"
      flow_role: "Atomic material and stock"
      record_type: "foreground_record"
      raw_fields: "actual process; row_id; provider; whole formulation; original quantity/unit; wet/dry state; composition; raw/WIP/non-WIP/FG/asset opening and closing; new/used; water phases; inherited vector; actual inputs/outputs; treatment; ownership; allocation; independent X overlap evidence; gross-receipt versus already-net-consumption flag and prior stock correction; every inherited exchange vector; actual new/old repair additions and removed parts/materials; independent water phases and repair-WIP custody"
      collection_method: "Weigh each physically named material/external waste separately and reconcile invoices, recipes, stock survey, maintenance logs and actual destination. Track supplier-included packaging and water subaccounts without duplicating upstream purchase.  Distinguish physical asset purchase from attributable service and preserve every stock quantity and inherited exchange history. Do not reapply stock corrections to measured net consumption or deduct ordinary discarded/sold material manufacturing burdens automatically."
      unit: "kg"
      frequency: "Each batch/meter interval and stock boundary"
      temporal_coverage: "Complete cohort plus all failed/zero-output intervals; original service horizon separately"
      site_scope: "Declared kiln line with raw_prep, burn_cool and fg_service as applicable; actual supplier gates and original cohort. process_id identifies the governing kiln system; raw_fields separately retain the actual process."
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, original records, composition/phase tests, complete reconciliations and upstream ownership"
    - protocol_id: cp_energy
      process_id: "burn_cool"
      flow_role: "Electricity and each fuel"
      record_type: "foreground_record"
      raw_fields: "actual process; row_id; process/mode; meter interval; raw kWh; fuel raw mass/volume/rate; state; density; LHV; fossil/biogenic carbon; ash; moisture; operating/idle/zero-output hours; supplier; gross carrier mass; enthalpy; imports/exports; original unit; upstream owner ; gross thermal-carrier supply/return V; independent kg/state/enthalpy and heat MJ; original Q_c; one provider agreement and return ownership"
      collection_method: "Retain calibrated interval meter readings and fuel weigh/volume records; assay each supply. Keep carrier mass separate from thermal energy. Electricity purchase, onsite generation and recovered heat require one upstream owner and no duplicated fuel/provider burden. The custody-only gross exception also covers each actual external thermal-carrier supply and Product condensate/hot-water return, including steam_in and condensate_return: A_ic is the complete measured gross leg V in its true native unit/state, not B_open+U-B_close, an inherited burden sum, net consumption or an economic/service share. Preserve carrier kg, phase/T/P/enthalpy reference independently of actual heat MJ and use this one original-Q_c quotient once. Separate attributable supply/operation/treatment/service vectors have one actual provider owner; neither a return nor mass/heat dimensions create another purchase, provider or automatic credit. Internal circulation cancels only at matched internal interfaces."
      unit: "kWh; MJ; kg; m3"
      frequency: "Each batch/meter interval and stock boundary"
      temporal_coverage: "Complete cohort plus all failed/zero-output intervals; original service horizon separately"
      site_scope: "Declared kiln line with raw_prep, burn_cool and fg_service as applicable; actual supplier gates and original cohort. process_id identifies the governing kiln system; raw_fields separately retain the actual process."
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, original records, composition/phase tests, complete reconciliations and upstream ownership"
    - protocol_id: cp_species
      process_id: "burn_cool"
      flow_role: "Actual gas and aqueous species"
      record_type: "foreground_record"
      raw_fields: "actual process; species; CAS where valid; input/output; inlet/stack/fugitive media; original concentration and basis; dry/wet gas flow; integrated or rate flag; interval; oxygen correction; T/P; humidity; speciation; detection limits; mineral/fuel carbon; ash/dust/stock phases; air constituent totals; reaction evidence"
      collection_method: "Use calibrated monitoring and independent material/phase analyses; retain every operating state and gas-path split, including bypass, mill-on/off and cooler. Preserve NOx/VOC/COD indicators separately until actual molecular identity and mass are known; never use one mass residual for two unknowns."
      unit: "kg; original concentration; m3; time"
      frequency: "Each batch/meter interval and stock boundary"
      temporal_coverage: "Complete cohort plus all failed/zero-output intervals; original service horizon separately"
      site_scope: "Declared kiln line with raw_prep, burn_cool and fg_service as applicable; actual supplier gates and original cohort. process_id identifies the governing kiln system; raw_fields separately retain the actual process."
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, original records, composition/phase tests, complete reconciliations and upstream ownership"
    - protocol_id: cp_pack
      process_id: "fg_service"
      flow_role: "Each actual packaging material"
      record_type: "foreground_record"
      raw_fields: "actual process; material j; empty/attached WIP/FG/reusable opening and closing; new receipt; supplier-included receipt/owner; external return received; gross dispatched; external return out; waste; repair material/water in/out; X overlap; measured tare; original cohort and service horizon; separate P_purchase_j and I_supplier_j; repair-material and water X_in_j/X_out_j not represented by another flow term; exact same-direction overlap evidence; complete wet stock independently ; exact P/I/ER/S/EO/W row/direction; article/component boundary; matched internal transfers; per-pool W source and actual collection total; ordinary humidity uptake/release; actual new/removed wood and water phases; meter/outlet overlaps; original Q_c/H_c"
      collection_method: "Weigh each real packaging type, reconcile all six gross legs and wet stock, and retain return/dispatch/repair records. Supplier-included ingress stays physical with upstream owner once; internal reuse is not new procurement.  Keep purchased P (including paid bundled supply) and first non-purchased external ingress I disjoint, each whole wet article with one upstream owner. Six movement legs are P/I/ER/S/EO/W, never opening or closing stock. Only deduplicate X against the same material/water already represented in another flow term, never against a stock; retained ingress and full wet closing stock both remain. Ordinary storage/handling uptake and desorption/evaporation require no repair event. X removes only duplication in another same-side actual FLOW term, not stock, opposite direction or mere atomic-card presence; retained influx and full wet closing stock both remain. Whole supplied articles include integral liner/seam/glue/print and water once as child composition; actual separately supplied onsite components need independent atomic receipt/provider ownership. Use disjoint component contributions or reconciled whole article: empty assembled tare equals measured whole-bought contribution plus actual added matter/retained water minus real removed/lost matter, excluding clinker. Never add whole assembled tare plus its same components; match internal handoff IDs and replace component stock/shipment by the reconciled article in article mode, cancelling matched transfers. A real mixed collection outlet uses one qualified atomic Waste exchange; independently measured per-pool W origins are raw nonadditive source withdrawals whose sum matches the outlet. Total OR disjoint partition, never both; treatment/provider once. Separate actual outlets keep separate cards. All packaging and repair cards are conditional on actual physical presence; bulk clinker does not create invented packages or repairs."
      unit: "kg"
      frequency: "Each batch/meter interval and stock boundary"
      temporal_coverage: "Complete cohort plus all failed/zero-output intervals; original service horizon separately"
      site_scope: "Declared kiln line with raw_prep, burn_cool and fg_service as applicable; actual supplier gates and original cohort. process_id identifies the governing kiln system; raw_fields separately retain the actual process."
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, original records, composition/phase tests, complete reconciliations and upstream ownership"
  calculation_rules:
    - id: calc_inventory
      applies_to: "all inventory rows"
      rule: "x_ic = A_ic / Q_c. This is the unique normalization: A_ic is the exchange-specific native-unit attributable burden numerator after raw-unit/rate conversions, dedicated assignment, actual allocation and inherited vector reconciliation; Q_c is original newly first-released net dry clinker in kg. The reference row is exactly 1 kg. Manufacturing and incremental service retain separate A vectors and the same original cohort Q_c. For Q_c=0 retain A without a unit result. Cards and aggregation refer to this calculation; neither divides again. For physical-custody-only rows (gross FG dispatch/returns, packaging legs, asset movements and outgoing waste), A_ic instead denotes that independently measured, unallocated gross movement converted to its own native extensive unit; its x_ic is a physical movement per original Q_c, not an attributable burden vector. Keep the absolute gross ledger primary and separate from manufacturing/service burden; neither custody output nor historical FG creates a new Q, purchase or burden credit. The custody-only gross exception also covers each actual external thermal-carrier supply and Product condensate/hot-water return, including steam_in and condensate_return: A_ic is the complete measured gross leg V in its true native unit/state, not B_open+U-B_close, an inherited burden sum, net consumption or an economic/service share. Preserve carrier kg, phase/T/P/enthalpy reference independently of actual heat MJ and use this one original-Q_c quotient once. Separate attributable supply/operation/treatment/service vectors have one actual provider owner; neither a return nor mass/heat dimensions create another purchase, provider or automatic credit. Internal circulation cancels only at matched internal interfaces."
      inputs:
        - A_ic
        - Q_c
        - cp_release
        - cp_raw
        - cp_energy
        - cp_species
        - cp_pack
      output: "x_ic"
      source_ids:
        - ec-jrc-ilcd-2010
        - eu-jrc-clm-2013
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert tonnes to kg using 1000 kg/t; electricity MJ = recorded kWh × 3.6. Convert measured gas/liquid amounts by their documented state-specific method. Fuel LHV MJ is an energy subaccount of the same supplied carrier, not a second purchase. For actual steam/hot-water carriers, measured kg multiplied by specific enthalpy in kJ/kg gives kJ; divide by 1000 once for MJ. Use independently measured supply and return masses with each leg's actual state and a consistent enthalpy reference; reconcile real losses and storage changes on the same boundary/time basis. The shortcut mass × enthalpy difference applies only to matched equal-mass supply/return legs; do not invent efficiency or a return credit. Never infer unit-item mass, density, recipe or emission factors."
      inputs:
        - cp_energy
        - cp_species
        - original_units
      output: "converted_native_numerators"
      source_ids:
        - eu-jrc-clm-2013
        - us-epa-ap42-cement-2025
    - id: calc_vectors
      applies_to: "all inventory rows"
      rule: "For each original cohort c and exchange i, carry B_open_ic and add true new attributable burden; subtract only B_close_ic in raw/WIP/unallocated non-WIP stores and independently justified transfers to other functions/cohorts. Released closing FG is never in manufacturing B_close. Preserve each inherited exchange amount, native unit, upstream dataset, water/composition state, prior treatment and allocation history. Ordinary waste/treatment and all failures stay in manufacture. Asset physical stock remains a separate ledger; only documented current asset service enters the burden numerator. Service A_ic contains actual incremental service and inherited unfinished-service work only, not a new copy of manufactured FG. Exchange index i also preserves original source process, carrier, pathway and compartment: an inherited upstream-provider burden is not reclassified as a direct kiln emission or added alongside a provider model that already owns it. Label every input basis: gross receipts/purchases require the applicable opening/closing stock reconciliation for each exchange; already reconciled net consumption must not receive the same stock correction again. Physical quantities and every inherited exchange vector remain separately reconciled. Other-function/cohort transfers require actual eligibility, allocation and handover evidence once; ordinary manufacturing waste, breakage, samples, off-site removal or sale do not automatically export the burden of causing or treating them. Retain all actually performed original-cohort services over observed H_c using original Q_c even while FG remains held; only genuinely unconsumed and unassigned stores/unfinished work may carry forward, never completed service merely attached to closing FG. The burden-stock equation does not assign the numerator of a custody-only gross physical card; that physical view uses full measured V under calc_inventory. For every actual manufacture or post-release work event, retain actual materials/water/energy, releases, wastes, custody and burdens whether authorized, unapproved, unauthorized, failed or rejected. Manufacturer/specification permission and postwork tests govern authorization and continued identity/quality, never erasure of actual flows or burdens. Retain original Q_c/H_c and actual acceptance/disposition; do not assume hydrated/damaged clinker restored. Future unperformed work stays unknown; only unused and unassigned stores may carry."
      inputs:
        - cp_release
        - cp_raw
        - cp_energy
        - cp_species
        - cp_pack
        - B_open_ic
        - B_close_ic
        - new_burden_ic
        - justified_transfers_ic
      output: "A_ic"
      source_ids:
        - ec-jrc-ilcd-2010
    - id: calc_physical_manufacture
      applies_to: "all inventory rows"
      rule: "At the manufacturing gate reconcile opening raw/WIP/unallocated stores and separate full wet installed/spare physical-asset stocks plus every true external gross wet-material and air input against closing raw/WIP/unallocated stores and separate full wet installed/spare physical-asset stocks, first-released physical clinker, all unreleased loss/waste and each actual gas/liquid/solid exit. First-released physical clinker equals Q plus separately measured free moisture, not Q plus closing FG. Track hot meal, kiln coating/rings and dust stock as real states; thermal MJ and electricity are not physical kg."
      inputs:
        - cp_release
        - cp_raw
        - cp_energy
        - cp_species
        - opening_physical_stocks
        - true_external_gross_inputs
        - closing_physical_stocks
        - first_release_wet_clinker
        - actual_waste
        - actual_gas_liquid_solid_exits
      output: "manufacturing_mass_reconciliation"
      source_ids:
        - eu-jrc-clm-2013
        - us-epa-ap42-cement-2025
    - id: calc_physical_fg
      applies_to: "all inventory rows"
      rule: "FG service gate: opening wet FG plus actual first-release transfers and gross returned material plus other real service-material/water influx equals closing wet FG plus gross dispatch, external returns, actual waste/loss and every real water/gas exit. Returned wet mass need not equal original delivered mass. In the consolidated physical gate cancel internal first-release and other paired transfers once; retain opening/closing FG and installed/spare-asset wet stock and all external gross legs. Maintain constituent balances for Ca/Si/Al/Fe/C/H/O/S/Cl and measured other relevant elements separately from total mass. No residual may solve two unknown species or phases. Record each actual repair/handling addition and removal of new/old materials, parts and free/structural/reaction water, separately measured rather than inferred from one wet residual. Repair-held FG belongs to one labelled FG substate or disjoint repair-WIP, never both. Retained actual influx remains on the input side while the complete wet closing material remains on the stock side. Actual permission, postwork tests, acceptance or rejection/disposition govern the resulting identity; no assumed restoration or new Q."
      inputs:
        - cp_release
        - cp_raw
        - cp_species
        - opening_FG_and_assets
        - first_release_transfer
        - gross_returns
        - real_service_inputs
        - closing_FG_and_assets
        - gross_dispatch
        - external_returns
        - real_loss_waste
        - actual_water_gas_exits
      output: "FG_and_consolidated_mass_element_reconciliation"
      source_ids:
        - eu-jrc-clm-2013
        - us-epa-ap42-cement-2025
    - id: calc_packaging
      applies_to: "all inventory rows"
      rule: "For each actual packaging material j: P_open_j + P_purchase_j + I_supplier_j + P_external_return_received_j + X_in_j = P_close_j + P_gross_shipped_j + P_external_return_out_j + P_waste_j + X_out_j. The six gross movement legs are separate purchased P (including paid bundled supply), first non-purchased external ingress I, external return received ER, gross shipment S, external return out EO and waste W; opening and closing stocks are not movement legs. Each stock includes empty, attached WIP, attached FG and reusable states. P and I each cover the whole actual wet article once with one upstream owner; internal reuse is not procurement. X_in/X_out contain actual repair-material and water additions/removals only to the extent absent from other same-direction flow terms; record the overlap evidence and never deduplicate against stocks. Retained actual influx and complete wet closing stock both remain. Reconcile new/old repaired parts, wood/material and free/absorbed/released water independently; no economic scaling of physical quantities. Ordinary storage/handling uptake and desorption/evaporation require no repair event. X removes only duplication in another same-side actual FLOW term, not stock, opposite direction or mere atomic-card presence; retained influx and full wet closing stock both remain. Whole supplied articles include integral liner/seam/glue/print and water once as child composition; actual separately supplied onsite components need independent atomic receipt/provider ownership. Use disjoint component contributions or reconciled whole article: empty assembled tare equals measured whole-bought contribution plus actual added matter/retained water minus real removed/lost matter, excluding clinker. Never add whole assembled tare plus its same components; match internal handoff IDs and replace component stock/shipment by the reconciled article in article mode, cancelling matched transfers. A real mixed collection outlet uses one qualified atomic Waste exchange; independently measured per-pool W origins are raw nonadditive source withdrawals whose sum matches the outlet. Total OR disjoint partition, never both; treatment/provider once. Separate actual outlets keep separate cards. All packaging and repair cards are conditional on actual physical presence; bulk clinker does not create invented packages or repairs."
      inputs:
        - cp_pack
        - P_open_j
        - P_purchase_j
        - I_supplier_j
        - P_external_return_received_j
        - P_close_j
        - P_gross_shipped_j
        - P_external_return_out_j
        - P_waste_j
        - X_in_j
        - X_out_j
        - repair_material_in_out
        - repair_water_in_out
        - X_overlap_evidence
      output: "packaging_gross_mass_reconciliation"
      source_ids:
        - eu-jrc-clm-2013
        - us-epa-ap42-cement-2025
    - id: calc_species_phases
      applies_to: "all inventory rows"
      rule: "Convert original amounts/rates to the exchange native extensive property before actual allocation. Integrate a true rate over time once; integrated gas/liquid volume is not multiplied by time again. Density and gas state/compressibility are substance-specific independent measurements. Preserve fossil, biogenic and geogenic carbon origins; separate free water, carrier water, mineral structural/dehydration water, reaction water, retained liquid, vapour and measured hydration changes. Oxide assay/LOI, COD, total carbon, VOC, NOx or total metals are indicators, not unique molecular species. Use actual resolved reaction/phase evidence and full gas constituent balances, not default stoichiometric conversion of an unknown mixture."
      inputs:
        - cp_species
        - cp_raw
        - cp_energy
        - actual_concentration
        - actual_volume_or_rate
        - measured_state
        - independent_composition
        - independent_phase_evidence
      output: "independent_species_phase_reconciliation"
      source_ids:
        - eu-jrc-clm-2013
        - us-epa-ap42-cement-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Confirm whole formulation, native Product/Waste/Elementary type, CAS/form/media/route/geography and every property. Preserve adopted restrictions in each card and context; unresolved auxiliary identities remain explicit and cannot be filled with a broad collection."
      evidence: "Direct identity and measured supplier/specification matching"
    - id: dq_balance
      applies_to: "all physical gates"
      requirement: "At the manufacturing gate reconcile opening raw/WIP/unallocated stores and separate full wet installed/spare physical-asset stocks plus every true external gross wet-material and air input against closing raw/WIP/unallocated stores and separate full wet installed/spare physical-asset stocks, first-released physical clinker, all unreleased loss/waste and each actual gas/liquid/solid exit. First-released physical clinker equals Q plus separately measured free moisture, not Q plus closing FG. Track hot meal, kiln coating/rings and dust stock as real states; thermal MJ and electricity are not physical kg."
      evidence: "Independent stock/mass/element/phase measurements, uncertainty and unexplained residuals"
    - id: dq_complete
      applies_to: "all operating states"
      requirement: "Keep failed/off-spec/sampled clinker and all start-up, shutdown, idle, cleanup, repair, blocked cyclone, CO-trip and zero-output intervals. Record actual dispositions, losses and treatment without assuming recoverability. Rework of FG requires manufacturer/specification permission plus postwork testing, acceptance and disposition; hydraulic material damage is not presumed reversible. Q=0 retains the full burden ledger and yields no unit result."
      evidence: "Complete event/meter/stock/test histories; no silent exclusions"
    - id: dq_source
      applies_to: "method and site data"
      requirement: "Technical sources support qualitative process scope only; all quantities/specification limits/conditions come from real foreground or separately justified sources. Keep detection limits, time/geography representativeness, numerical gaps, uncertainty and allocation sensitivity explicit."
      evidence: "eu-jrc-clm-2013; us-epa-ap42-cement-2025; ec-jrc-ilcd-2010"
validation_rules:
  - rule_id: v_reference
    applies_to: "Reference and output"
    rule: "Reject a core reference identity conflict or unconfirmed core flow. Require one first-release clinker row with the same UUID, 1 kg and all qualifiers in both languages. A bound cement/calcite identity cannot stand for clinker."
    source_ids:
      - eu-jrc-clm-2013
      - us-epa-ap42-cement-2025
  - rule_id: v_units
    applies_to: "all inventory rows"
    rule: "Require raw native-unit conversion, one actual attribution step, complete cohort vectors and exactly one calc_inventory normalization; Q=0 gives no unit result. Energy is not forced to Mass/kg. Unknown quantities are not successful measured results."
    source_ids:
      - eu-jrc-clm-2013
      - us-epa-ap42-cement-2025
  - rule_id: v_physical
    applies_to: "all physical gates"
    rule: "FG service gate: opening wet FG plus actual first-release transfers and gross returned material plus other real service-material/water influx equals closing wet FG plus gross dispatch, external returns, actual waste/loss and every real water/gas exit. Returned wet mass need not equal original delivered mass. In the consolidated physical gate cancel internal first-release and other paired transfers once; retain opening/closing FG and installed/spare-asset wet stock and all external gross legs. Maintain constituent balances for Ca/Si/Al/Fe/C/H/O/S/Cl and measured other relevant elements separately from total mass. No residual may solve two unknown species or phases."
    source_ids:
      - eu-jrc-clm-2013
      - us-epa-ap42-cement-2025
  - rule_id: v_species
    applies_to: "gas/water/materials"
    rule: "Convert original amounts/rates to the exchange native extensive property before actual allocation. Integrate a true rate over time once; integrated gas/liquid volume is not multiplied by time again. Density and gas state/compressibility are substance-specific independent measurements. Preserve fossil, biogenic and geogenic carbon origins; separate free water, carrier water, mineral structural/dehydration water, reaction water, retained liquid, vapour and measured hydration changes. Oxide assay/LOI, COD, total carbon, VOC, NOx or total metals are indicators, not unique molecular species. Use actual resolved reaction/phase evidence and full gas constituent balances, not default stoichiometric conversion of an unknown mixture."
    source_ids:
      - eu-jrc-clm-2013
      - us-epa-ap42-cement-2025
  - rule_id: v_stocks
    applies_to: "manufacture and FG services"
    rule: "Retain storage, sampling, handling, conditional packing, loading, transport under control and returns as actual incremental services linked to original cohort c and its original Q_c over a declared observed service horizon. Carry opening/closing FG identity and prior manufacturing burden once; separate historical burden from new service burden. Internal Q cancels in the consolidated gate. Do not normalize service to current-period shipments, replace Q by net delivery, or repeat manufacturing because of a return; trace original dispatch and reversal records independently of returned wet weight."
    source_ids:
      - eu-jrc-clm-2013
      - us-epa-ap42-cement-2025
  - rule_id: v_pack_assets
    applies_to: "packaging and physical assets"
    rule: "Require all six gross packaging legs, supplier-included ingress/upstream owner, repair material/water and full wet stocks; X only removes overlap. Require new/used asset physical stocks separate from current service burden, with no fixed life or invented per-machine mass."
    source_ids:
      - eu-jrc-clm-2013
      - us-epa-ap42-cement-2025
  - rule_id: v_allocation
    applies_to: "multifunctional processes"
    rule: "Reject arbitrary physical/economic choice, fabricated shares, automatic waste/sale burden subtraction or credit. Verify dedicated/virtual subdivision, exchange-specific determining physical causality and only the justified market-value residual at the real common gate."
    source_ids:
      - ec-jrc-ilcd-2010
  - rule_id: v_scope
    applies_to: "route/product gate"
    rule: "Reject purchased-clinker packaging-only manufacture, gypsum finish grinding within the clinker gate, an unsupported route, missing actual exchange, hidden failure/cleanup interval or an unknown treated as zero. No engineering check establishes scientific/translation/mapping/publication approval."
    source_ids:
      - eu-jrc-clm-2013
      - us-epa-ap42-cement-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared clinker input to cement grinding and qualified downstream LCA; first-release manufacture and separately disclosed cohort services"
  allowed_use: "Only the specified grey dry-precalciner Portland-clinker route/state/site/period and verified native restrictions"
  excluded_use: "Exclude wet, semi-wet, semi-dry, shaft-kiln, white-clinker whitening/quenching, calcium-aluminate and other clinker chemistries unless independently extended and reviewed. Exclude gypsum/addition blending, cement finish grinding, cement bags, concrete, installation, use, hydration and carbonation service claims. Crushing hot clinker for cooler operation is included; grinding clinker with gypsum to make cement is excluded. Purchased finished clinker cannot replace mineral-to-clinker manufacture. No BREF temperatures, energy intensities, feed ratios, oxide percentages, strength values or emission factors are PCR defaults."
  required_metadata: "grey Portland clinker family and actual product specification; mineral phase and oxide analyses with actual methods and test ages where relevant; free lime and acceptance criteria without default limits; unhydrated nodular supply state and measured free moisture; dry preheater/precalciner rotary kiln and grate cooler configuration; mineral suppliers and quarry/transport ownership; each alternative mineral and fuel formulation/status/feed point; fossil/biogenic/mineral carbon and measured water phases; kiln/raw-mill operating modes and bypass/CKD return/export routes; site/geography and complete reporting horizon; first-release cohort Q and inherited raw/WIP/store burden vectors; cohort-specific FG service horizon and actual dispatch/return history; bulk or actual clinker packaging with upstream owner; native identity restrictions and unresolved exchanges; allocation and upstream dataset matches Separate physical-gross and burden/provider views; disjoint article/components and actual outlet versus origin-W memo; ordinary humidity and all actual unapproved/failed work; original Q_c/H_c and one provider per thermal supply."
  required_quality_disclosure: "Actual source/quantity coverage, auxiliary UUID/provider gaps, atomic species and phase uncertainty, balances, inherited vectors, failures, allocation, service horizon and exclusions; do not claim reviewed science from engineering validation"
  update_trigger: "Changed mineral/fuel supply, phase/grade, kiln/cooler/control system, actual auxiliary exchange, upstream boundary, product gate, Q method, allocation or service horizon"
data_sources:
  - id: "eu-jrc-clm-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Cement, Lime and Magnesium Oxide, EUR 26129 EN (2013), DOI 10.2788/12850, §§1.2.1–1.2.6, printed pp.9–39; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/CLM_Published_def_0.pdf"
    used_for: "Industrial route and neighbouring exclusions; mineral/fuel preparation, precalciner kiln, cooling, dust loops, water conditioning and storage. Technical synthesis only; no numerical defaults and no LCA allocation authority."
  - id: "us-epa-ap42-cement-2025"
    type: "official_guidance"
    reference: "US EPA, AP-42 §11.6 Portland Cement Manufacturing, February 2025, §11.6.1, Fig.11.6-1 and neighbouring wet/semi-dry/finish-grinding descriptions, pp.11.6-1–11.6-9; https://www.epa.gov/system/files/documents/2025-02/c11s06_final_2-2025_0.pdf"
    used_for: "Independent process description and clinker/cement terminal distinction; free/combined water, calcination, fuel and bypass paths. Emission-factor tables and historical recipes are not adopted."
  - id: "ec-jrc-ilcd-2010"
    type: "handbook"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation hierarchy only: subdivision/virtual subdivision, exchange-specific determining physical causality, residual market value at the actual common process gate; conditions and limitations retained."
