allocation_rules:
  - rule_id: allocation_scope
    applies_to: "foreground_burden_allocation"
    rule: "This method is attributional only, in a declared scenario requiring allocation (Situation C2, or a specifically justified allocation case under the ILCD provisions). It does not offer a free choice between physical/economic allocation, substitution or consequential expansion. Industrial route sources establish manufacturing facts, not an LCA allocation method."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_order
    applies_to: "foreground_burden_allocation"
    rule: "First use dedicated measurements and real or virtual subdivision to assign every exclusively caused exchange. For the genuinely shared remainder, identify the determining physical causality for each exchange/function, supported by quantitative change or an actual limiting service relationship; generic mass/energy shares alone are not proof. Different exchanges may need different determining causes."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "foreground_burden_allocation"
    rule: "Only the unresolved common remainder after those steps may use contemporaneous actual market values for the real co-functions at the same common-process gate, actual state and quantity. Remove downstream conditioning/packing/transport value; document observed transactions, missing/negative values, residual scope and sensitivity. No fixed fraction or automatic heat/dust/recycling credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_vectors
    applies_to: "foreground_burden_allocation"
    rule: "Keep complete gross physical mass, species, packages and assets before burden allocation. For each flow retain dedicated/shared/remaining-stock vectors and the reason for each single transfer. Ordinary manufacturing rejects, breakage, samples, control wastes and treatment burden remain assigned to the actual production function unless an independently real other cohort/function and justified burden handoff are demonstrated; sale/offsite transfer is insufficient."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "lime_line"
      flow_role: "finished"
      record_type: "Release and phase tests"
      raw_fields: "batch/SKU; unique first acceptance ID/time; calibrated gross/tare/net kg; CaO/active CaO/Ca(OH)2/carbonate/Mg/hydraulic phase assays; free and bound water; assay basis; reactivity method/result; particle form/size; acceptance/disposition; Q"
      collection_method: "Weigh each unique accepted whole-product batch after actual final cooling/sizing on calibrated equipment; separately sample phases/water and test actual specification. Link reinspection/return IDs without another Q."
      unit: "kg"
      frequency: "each acceptance and representative lab lot"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; signed first release; lab methods; uncertainty"
    - protocol_id: cp_inputs
      process_id: "lime_line"
      flow_role: "limestone; gas; electricity; process_water; diesel; lubricant; refractory; filter_bag"
      record_type: "Receiving and native-unit meters"
      raw_fields: "row_id; source/owner; lot and whole formulation; opening/purchase/ingress/use/closing; supplier-included packaging; phase/moisture; route/form/grade; gas T/P/Z/wetness/composition; fuel calorific test; electricity geography/voltage/mix; water treatment; original unit; asset installed/loose state; receipt_or_already_net_consumption_basis; included_stock_adjustments; independent_raw_WIP_nonWIP_quantities; full_per_exchange_history"
      collection_method: "Read calibrated receiving scales/meters and complete supplier records; record whole externally supplied material once. Meter stages and all operating modes separately. Preserve raw measured quantities and same-state conversions; keep actual ingress alongside closing wet stock. Preserve gross/net basis and corrections already included; no second stock adjustment."
      unit: "kg; m3; MJ"
      frequency: "each receipt and continuous/interval meter"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; supplier declarations; bills; stock tickets"
    - protocol_id: cp_air
      process_id: "lime_line"
      flow_role: "oxygen_in; nitrogen_in; argon_in; humidity_in; ambient_co2_in; oxygen_out; nitrogen_out; argon_out; vapour_out; co2_carbonate; co2_fuel; co2_ambient_out; co; methane; no; no2; so2; n2o; pm"
      record_type: "Source gas and particulate monitoring"
      raw_fields: "species/phase/CAS; inlet/outlet/source/mode; interval/hours; true rate or integrated volume; T/P/humidity/Z; dry/wet/O2-correction convention; concentration/molar basis; independent carbonate/fuel/ambient origin; speciation; mineral PM fraction/condensable/metal overlaps; uncertainty and detection limits; leak inventory"
      collection_method: "Use applicable calibrated source-specific inlet/stack/fugitive methods and independent phase/composition evidence. Preserve measured rates or integrated quantities as observed; normalize concentration states before integration. NOx/TOC/COD indicators never create species masses. Keep gross carriers and net generated releases separately."
      unit: "kg; m3; rate with original time unit"
      frequency: "continuous/representative modes with complete operating hours"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling method applicability; calibration; blanks; paired flow/composition; detection limits"
    - protocol_id: cp_water
      process_id: "lime_line"
      flow_role: "process_water; wastewater; sludge; vapour_out; water_fresh"
      record_type: "Water phase and receiving body"
      raw_fields: "source/treatment/use; external ingress; internal circulation; original volume/rate; measured same-state density; free/adsorbed/structural/reaction water; whole effluent wet mass; water carrier and dissolved/suspended matter; sludge water; temperatures; receiving endpoint; named chemical species"
      collection_method: "Pair calibrated water meters and representative laboratory phase/species tests; distinguish actual resources, purchased water, offsite wastewater, onsite sludge and direct freshwater output. Independent measurement reconciles water phases and heat interfaces; no automatic water density or residual species inference."
      unit: "kg; m3"
      frequency: "each interval/discharge/cleaning with paired sampling"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water meters; density/state measurements; laboratory; receiver records"
    - protocol_id: cp_cohort
      process_id: "lime_line"
      flow_role: "all inventory rows"
      record_type: "Stage physical and burden inheritance"
      raw_fields: "stage and paired transfer IDs; all original units; opening/closing raw/WIP/FG; first-release ID/Q; failed/startstop/idle/cleanup/sample/rework; each flow inherited amount/burden vector and owner; FG cohort manufacture vector; service horizon H_c and Q_c; gross shipments/returns/losses and original IDs; wet mass; Ca/Mg/C/O/H/N/S and other actual elements; actual phases; actual_service_on_held_FG; original_delivery_specific_record; actual_return_new_water_CO2; removed_old_material; independent_water_loss; postwork_acceptance_disposition; authorization/status separate from performed-event occurrence; actual unauthorized/unapproved/failed/rejected work; all real incremental matter/water/energy/emission/waste burdens; acceptance/disposition; future unperformed unknown; unused-unassigned stores"
      collection_method: "Reconcile calibrated stage material/energy records and traceable stock/cost-burden vectors by batch/cohort. Carry every flow independently across raw/WIP and older FG; obtain actual rework permission/test/disposition. Preserve manufacture, FG-service and combined physical gates without counting the internal Q checkpoint twice. Real rework requires actual manufacturer permission, same-terminal grade compatibility, actual route and postwork phase/assay/reactivity/size/moisture acceptance and disposition. Hydrated/hardened/carbonated material is not presumed reversible; separately measure all actual new material/water/CO2 and removed old material/water, retain original Q_c/H_c and manufacturing history. Capture all actual work and resulting physical flows and burdens regardless of permission, failure or rejection. Permission and posttests authorize work/continued qualification only and never erase unauthorized/failed events. Preserve original Q_c/H_c and actual new/old material/water, custody and disposition; no assumed reversal of hydration/carbonation."
      unit: "kg; m3; MJ; original native unit"
      frequency: "every batch/transfer plus full period stock closure"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired stage logs; stock reconciliation; inherited vectors; release/return lineage; test reports"
    - protocol_id: cp_packaging
      process_id: "lime_line"
      flow_role: "sack_new; sack_return_in; sack_dispatch; sack_return_out; film_new; film_return_in; film_dispatch; film_return_out; pallet_new; pallet_return_in; pallet_dispatch; pallet_return_out; waste_sack; waste_film; waste_pallet; sack_with_supply; film_with_supply; pallet_with_supply; pallet_repair_wood; pack_repair_water; pack_humidity_in; removed_pallet_wood; pack_repair_wastewater; pack_water_vapour"
      record_type: "Single-article packaging stock"
      raw_fields: "article/material/construction; net article kg or actual same-configuration weighing; new/used owner; supplier-included ingress burden; opening/closing empty/attached WIP/FG/reusable states; fresh receipt; external return received; gross shipment ID/carried article mass; empty external return; waste; internal reuse; service history; P; I; ER; S; EO; W; Radd; Rremove; H2Oin; H2Oout; same_side_flow_ownership; independent_dry_material_water; complete gross P/I/ER/S/EO/W by each pool; ordinary storage/handling humidity interval; real assembly tare and disjoint component masses; matched internal handoff IDs; actual single/multiple collection outlets; per-pool W source quantities; total-versus-partition nonadditivity; X same-side other-flow identities, not stocks; P including bundled-paid; I = N_ext first non-purchase incoming; payment and prior-outward article IDs"
      collection_method: "Weigh and reconcile each material/article separately, including all product-accompanying gross dispatches and returned articles. Distinguish mutually exclusive stock states and trace prior burden ownership; include actual liner/adhesive boundaries. Record original counts without an assumed article weight. Partition every incoming article by actual purchase/payment and same-item prior outward history into P, I = N_ext or ER. Preserve actual ownership, condition and included-provider/service records once; first non-purchase receipt is not a return or an outward leg. Measure full gross six directions and actual repair/moisture terms separately, retaining real added material/water on influx even when in closing wetstock; only same-side flow-term duplication cancels. Include ordinary storage/handling moisture uptake/release without inventing repair. Reconcile assembled article versus unique components through measured paired internal transfers; whole wet ingress includes integral water once. For a real combined waste outlet retain one actual Waste exchange with independent per-pool source-W memo records, total OR disjoint partition and one treatment/provider; do not fabricate separate exits for ledger symmetry."
      unit: "kg; original item count"
      frequency: "each receipt/dispatch/return/disposal and stock closure"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "article specifications; calibrated weights; ownership and signed return records"
    - protocol_id: cp_assets
      process_id: "lime_line"
      flow_role: "kiln_asset; refractory; filter_bag; lubricant; spent_refractory; spent_filter; used_oil; retired_kiln"
      record_type: "Physical asset and service history"
      raw_fields: "asset/part boundary/configuration; measured complete net mass; initial supplier-included lining/fluids; opening/closing loose/in-service new/used mass; actual installed/removed/worn mass; adhering lime/water; installed fluids; inherited manufacturing vector; actual operating/function history; remaining service; maintenance/retirement; service share and uncertainty; gross_receipts_returns; actual_new_material_water; removed_old_material; independent_water_loss; parent_child_disjoint_ledger"
      collection_method: "Use calibrated weighing or traceable complete component mass records for the same equipment configuration. Reconcile physical stock and actual new/used receipts/removals independently of service burden. Derive causal service shares from actual function/use histories, including residual burden; no lifetime, depreciation percentage or per-item kg is invented. Independently retain actual new parts/material/water and removed old parts/water, full gross receipts/returns and closing moisture/fluid; wholearticle included parts remain subaccounts and service shares never shrink physical quantities."
      unit: "kg; actual service/time unit"
      frequency: "each installation/repair/removal plus period service closure"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "asset boundary/mass records; service logs; causal assignment; remaining-burden reconciliation"
    - protocol_id: cp_residues
      process_id: "lime_line"
      flow_role: "limestone_screenings; kiln_dust; offspec; spent_filter; spent_refractory; used_oil; wastewater; sludge; waste_sack; waste_film; waste_pallet; retired_kiln"
      record_type: "Residue and receiver handoff"
      raw_fields: "row_id; whole wet kg; phase/chemical/element assays; free/bound water; adhering versus separated dust; reject/rework/sample lineage; legal/functional state; receiver/treatment; sale/transport; inherited burden owner and single transfer decision"
      collection_method: "Weigh every separate actual outward stream and characterize it with representative samples and receiver records; distinguish reuse/coproduct/waste/environmental release. Keep attached/separated material once while retaining every real boundary crossing; preserve ordinary manufacturing waste burden and all downstream treatment required by the chosen model."
      unit: "kg; original wet volume with measured density"
      frequency: "each shipment/removal/treatment and representative lab lot"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale tickets; lab; receiver acceptance and treatment; vector transfer ledger"
    - protocol_id: cp_energy
      process_id: "lime_line"
      flow_role: "gas; electricity; diesel; export_heat"
      record_type: "Energy and thermal state"
      raw_fields: "stage/mode; true energy/rate/interval; gas volume state; fuel composition and calorific basis; electricity native unit; solid/gas/liquid flow/temperature/pressure/phase; specific heat/enthalpy method; reaction duty; stored energy; actual internal/external recovered heat; losses; supplier return and water/energy convention; actual gross thermal-carrier ingress and Product return V; matched kg/state/T/P/enthalpy reference; independent heat MJ; same-provider owner; no extra purchase/credit"
      collection_method: "Read calibrated fuel/electricity/heat meters and paired physical-state records. Integrate only true rates; retain carrier mass separately from heat. Reconcile real heat recovery and thermodynamic reference; add any actual external steam/hot-water and return interfaces individually before completion, with no default boiler. For each actual external thermal interface added before completion, retain full gross carrier supply/return kg independently of heatMJ and attributable provider-service vector; normalize physicalV once, with one provider and no assumed return credit or second purchase."
      unit: "MJ; m3; kg; original rate unit"
      frequency: "continuous/interval and all operating modes"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter/thermal calibration; independent calorific/state data; heat balance"
    - protocol_id: cp_allocation
      process_id: "lime_line"
      flow_role: "all inventory rows"
      record_type: "Dedicated causality and residual values"
      raw_fields: "attributional scenario; real outputs/functions; dedicated meters; real/virtual subdivision; exchange-specific determining causality; remaining common vector; common gate and actual state; period market prices/quantities; downstream cost adjustments; sensitivity; each physical/burden owner and transfer"
      collection_method: "Document each hierarchy decision and actual limiting relation from primary process/transaction records. Only unresolved common burdens use the same-gate/state contemporary values. Physical mass remains full; retain pre/post allocation and inherited vectors, service cohort and residual stock. No source brochure determines a universal allocation share."
      unit: "native exchange unit; currency; share"
      frequency: "each actual multifunctional case and study period"
      temporal_coverage: "Full declared production interval and cohort-specific subsequent observed service horizon; all modes included"
      site_scope: "One actual site and named stage/cohort; older cohorts separately retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "dedicated measurement; quantitative causality; transaction/price evidence; alternatives and sensitivity"
  calculation_rules:
    - id: first_release_q
      applies_to: "finished"
      rule: "Q = sum of calibrated net kg at unique first acceptance events for the selected cohort; reinspection and shipment events contribute no new production. Q = 0 retains all real loads and unresolved attribution, with no unit result."
      inputs:
        - cp_reference
      output: "Q"
      source_ids:
        - epa-lime-1998
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "For each source interval convert original mass/volume/energy units before attribution. Integrate a true rate over its actual interval, or multiply matched concentration by an already integrated volume without multiplying time again. Reconcile T/P, dry/wet, oxygen-correction and chemical/molar bases first; retain originals, conversions and uncertainties."
      inputs:
        - cp_inputs
        - cp_air
        - cp_water
        - cp_energy
      output: "Unnormalized compatible source amounts"
      source_ids:
        - epa-lime-1998
    - id: manufacturing_vector
      applies_to: "all inventory rows"
      rule: "B_mfg = B_open_raw_WIP_unassigned_stores + B_current + B_inherited_attributable - B_close_raw_WIP_unassigned_stores - B_single_justified_other_function_transfer. Each B is a per-flow vector with source, stage, quantity basis and owner. Released FG vectors are never part of B_close; they are already in Q. Carry unassigned Q=0 failure burdens explicitly rather than deleting them or inventing physical WIP. Declare gross receipt/occurrence versus already-stock-adjusted net issue/consumption per exchange; only apply stock adjustments not yet included, never the same raw-stock correction twice. Independently preserve every disjoint raw/WIP/unassigned non-WIP physical quantity and each inherited exchange vector, including upstream history of consumed opening material. Ordinary waste/reject/failure or sale alone does not establish a transfer outside the cohort or burden credit; require a real distinct function/cohort and justified attribution once. This B_mfg burden-vector equation does not define any custody-only physical card numerator. For actual FG, packaging, asset/part receipts/removals/returns and any real external thermal-carrier supply or return, A_physical is the full measured specific gross leg V in its actual native unit/state, never B_open+U-B_close, an inherited-vector sum or an economic/service share. Keep physical quantities and each separately owned supply/operation/treatment/service vector in separate views; reconcile the latter by this rule only once."
      inputs:
        - cp_cohort
        - cp_inputs
        - cp_allocation
      output: "Manufacturing burden vector for selected Q"
      source_ids:
        - ilcd-attributional-2010
    - id: service_vector
      applies_to: "all inventory rows"
      rule: "For each original released cohort c retain Q_c, its manufacturing vector and observed horizon H_c. Attribute only actual incremental post-release storage/packing/handling/dispatch/rework service to c with dedicated or determining causal records. Current-production cohort uses Q_c = Q; older FG keeps its own Q_c and separate service result. Reuse, return or repeated dispatch never recreates manufacturing burden or released kg. Actual performed services on held closing FG retain their full actual incremental burdens over original Q_c/H_c; holding does not justify a deduction. Gross FG-return and package movement quantities are independent ledger-only physical legs, not inherited burden vectors, second stock corrections or economic shares. Keep original delivery-specific records distinct from changed wet return mass; never infer D_rev or replace Q by net delivery. Manufacturer/specification permission and postwork tests govern authorization and continued product qualification, not whether actual performed work exists. Retain every actual unauthorized, unapproved, failed or rejected work event and its material/water/energy, releases, waste, custody and attributable burden at original Q_c/H_c; record its real disposition without assuming restoration or another first release. Future unperformed work remains unknown, while only unused and unassigned store burden may carry forward."
      inputs:
        - cp_cohort
        - cp_allocation
        - cp_packaging
      output: "Separate cohort service increments"
      source_ids:
        - ilcd-attributional-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q. A_i is the compatible unnormalized manufacturing exchange or attributable service increment of the same selected first-release cohort after raw_conversion and the documented allocation decision. For old cohorts perform the same operation once with their original Q_c in their own ledger. Physical outputs remain gross before allocation. Flow cards and protocol aggregation reference this calculation only and never divide again. For ledger-only gross FG/package movements, the numerator is the full measured specific leg after native-unit conversion, without burden-vector additions, stock correction or allocation scaling; normalize once by the actual owning Q or original Q_c and report separately from attributed supplier/operation burdens. A receipt included with another supply or a return/dispatch creates no additional provider purchase or credit. This gross-V exception also covers actual assets/parts and any real thermal-carrier ingress or condensate/hot-water Product return added under boundary_heat_water: convert the full measured carrier leg once and divide only by owning Q or original Q_c/H_c. Preserve carrier kg, phase/T/P/enthalpy reference independently of heat MJ. Neither carrier return nor separate mass/energy dimensions create a second provider purchase, automatic credit or a negative manufacturing/service burden. Internal circulation cancels only at matched internal interfaces."
      inputs:
        - Q
        - cp_reference
        - cp_inputs
        - cp_air
        - cp_water
        - cp_cohort
        - cp_packaging
        - cp_assets
        - cp_residues
        - cp_energy
        - cp_allocation
      output: "a_i per 1 kg reference flow"
      source_ids:
        - ilcd-attributional-2010
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "For each stage and the combined physical gate: opening actual wet stock + full external physical ingress = closing actual wet stock + full actual external egress, including gas species, water phases, products, packages, residues and assets. Pair identical internal transfers and cancel them only once. The manufacture-to-FG Q checkpoint cancels internally at the combined gate; combined stock/shipment mass must not add Q a second time. Element balances for Ca/Mg/C/O/H/N/S and every relevant measured element are independent of chemical phase evidence; do not force both unknown reaction water and CO2 from one residual."
      inputs:
        - cp_cohort
        - cp_inputs
        - cp_air
        - cp_water
        - cp_assets
        - cp_packaging
        - cp_residues
      output: "Unallocated stage and combined physical ledgers"
      source_ids:
        - epa-lime-1998
    - id: reaction_water_carbon
      applies_to: "all inventory rows"
      rule: "Use measured carbonate/oxide/hydroxide phases, feed/fuel carbon and actual gas species to check CaCO3 → CaO + CO2 and real Mg-carbonate conversions. CaO + H2O → Ca(OH)2 consumes water; Ca(OH)2 + CO2 → CaCO3 + H2O generates water. Pure carbonate decarbonation generates no water; combustion water requires actual fuel hydrogen and conversion. Distinguish free/adsorbed/liquid/vapour/structural water, actual hydroxyl equivalents and dissolved components. No default purity, conversion, fuel stoichiometry or future carbonation credit."
      inputs:
        - cp_reference
        - cp_cohort
        - cp_air
        - cp_water
      output: "Independent element and species reconciliation"
      source_ids:
        - epa-lime-1998
    - id: packaging_stock
      applies_to: "sack_new; sack_return_in; sack_dispatch; sack_return_out; film_new; film_return_in; film_dispatch; film_return_out; pallet_new; pallet_return_in; pallet_dispatch; pallet_return_out; waste_sack; waste_film; waste_pallet; sack_with_supply; film_with_supply; pallet_with_supply; pallet_repair_wood; pack_repair_water; pack_humidity_in; removed_pallet_wood; pack_repair_wastewater; pack_water_vapour"
      rule: "For each single packaging article/material separately: opening empty + opening attached WIP/FG + opening reusable + all paid receipts P + first non-purchase external receipts I = N_ext + true external returns ER = closing in the same complete states + all gross shipment-accompanying outward mass + empty external returns + waste. Categories partition stock, not overlapping totals. Internal reuse cancels; supplier-included ingress keeps physical mass and one upstream owner. No packaging mass enters Q, repeated purchase, automatic coproduct or mass scaled by economic share. For each material partition receipts into all paid P (including bundled-paid packaging), first non-purchase external receipts I = N_ext (including unpaid supplier-included, loaned, rented, gifted or transferred articles) and true received returns ER with the same-item prior outward record. N_ext is incoming, never outward or inferred from generic first supply; it may be new or used. Keep gross shipments S, external returns sent EO and waste W separately. Retain one upstream owner and actual service provider without a second included purchase or an assumed zero burden. Add actual measured repair Radd/Rremove and water H2Oin/H2Oout: opening disjoint pools+P+I+ER+Radd+H2Oin = closing pools+S+EO+W+Rremove+H2Oout. Deduplicate only the same water/material already carried by another same-side flow term of this bridge; never cancel real retained influx against closing wetstock, an opposite-direction term or another atomic-card representation. Whole wet P/I/ER/Radd contents count once. Independently measure drymaterial and free/absorbed water, with specific actual repair inputs/removed outlets and manufactureQ/originalQc/H ownership; no assumed repair or wet slaking. Ordinary storage/handling absorption and desorption/evaporation require no repair event; record actual moisture directions and states whether or not any repair occurs. Whole purchased sacks include supplier-integral liner/adhesive/seam/print only as composition subaccounts; separately supplied onsite components require their own actual receipt and one owner. Use a disjoint component basis or reconciled whole-article basis: empty assembled tare equals measured bought-article contribution plus actual added component/retained water minus real removal/loss, excluding product contents. Never add complete assembled tare and its same liner/thread/glue contribution again. In article mode pair component-to-article internal handoff IDs, replace their same-gate stock/shipment figures with the reconciled article and cancel matched internal transfers. If actual collection combines sources in one outlet, instantiate one qualified atomic Waste exchange for that real stream; independently measured per-pool W source values are raw memo withdrawals summing to that outlet, not extra LCA outlets. Use the total OR its disjoint partition, never both, and count treatment/provider once; genuinely separate outlets retain separate actual cards."
      inputs:
        - cp_packaging
        - cp_residues
      output: "Three separate complete package ledgers"
      source_ids:
        - ilcd-attributional-2010
    - id: asset_service
      applies_to: "kiln_asset; refractory; filter_bag; lubricant; spent_refractory; spent_filter; used_oil; retired_kiln"
      rule: "Preserve actual new/used spare and equipment receipts, installation/removal, wear, loose/in-service stocks, adhering matter and installed fluids on complete physical mass gates. Do not cancel a real ingress merely because its mass remains in closing stock. Separately derive attributable manufacturing/service burden from verified asset boundary, inherited vector and actual limiting use/service history across cohorts; retain unallocated remainder, actual maintenance and retirement. No fixed lifetime or one full asset per kg output."
      inputs:
        - cp_assets
        - cp_inputs
        - cp_residues
        - cp_allocation
      output: "Physical asset stock and separate service-burden ledger"
      source_ids:
        - ilcd-attributional-2010
    - id: energy_balance
      applies_to: "gas; electricity; diesel; export_heat"
      rule: "Reconcile actual fuel heat, electrical energy and opening stored enthalpy against carbonate reaction duty, drying, product/gas/water enthalpy, closing stored enthalpy, exported heat and measured/model-disclosed losses on one declared reference. Internal recovery cancels once. Do not add fuel oxidation energy twice as both LHV and extra reaction heat; preserve physical fuel/air/water mass independently."
      inputs:
        - cp_energy
        - cp_inputs
        - cp_air
        - cp_water
      output: "Declared energy and enthalpy reconciliation"
      source_ids:
        - epa-lime-1998
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Confirm real phase/form/CAS, whole-supply composition, native route/type/media/property/unit and provider restrictions. Unresolved auxiliary identities stay concrete atomic rows; they do not prove absence or authorize near-match UUIDs."
      evidence: "cp_reference; cp_inputs; cp_air; cp_residues"
    - id: raw_complete
      applies_to: "all inventory rows"
      requirement: "Keep original units, instrument calibration, representative operating modes, period/cohort matching, all failure/idle loads, uncertainty and detection limits. Pending observations are never zero or a claimed completed dataset."
      evidence: "cp_reference; cp_cohort; cp_air; cp_energy"
    - id: balances
      applies_to: "all inventory rows"
      requirement: "Independently reconcile full wet physical mass, relevant elements, actual chemical species/water phases, every packaging state, asset stock, service burden and heat. An unexplained residual remains a visible discrepancy rather than an invented balancing exchange."
      evidence: "cp_cohort; cp_packaging; cp_assets; cp_water"
    - id: sources
      applies_to: "all inventory rows"
      requirement: "US historical EPA and undated industry brochure support general process/state distinctions only. No factor, temperature, density, purity, recipe or grade transfers into a site result. ILCD is the chosen attributional method source only; no full standards-compliance or scientific-approval claim."
      evidence: "epa-lime-1998; nla-lime-essential; ilcd-attributional-2010"
validation_rules:
  - rule_id: validate_applicability
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm natural calcitic feed, actual natural-gas kiln and CaO-dominant industrial prehydration terminal product with actual acceptance specification. A leaf name or molecular-reagent UUID cannot establish the whole product; deliberate hydrate, hydraulic binder, dolime or another fuel route requires a separate scope decision."
    source_ids:
      - epa-lime-1998
      - nla-lime-essential
  - rule_id: validate_q
    applies_to: "foreground_dataset_conformance"
    rule: "finished is the only reference product output: 1 kg net first released whole product. Bilingual gate/cohort/denominator agree. No finished-stock manufacturing deduction or second Q; older FG keeps original burdens and own Q_c. Q=0 produces no unit result."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_atomic
    applies_to: "foreground_dataset_conformance"
    rule: "Every actual exchange is atomic and current native/type/media identity compatible; unresolved rows, measured additional species and all conditional absence proofs remain explicit. Provider support, real quantities and characterization coverage are independent checks."
    source_ids:
      - epa-lime-1998
  - rule_id: validate_normalization
    applies_to: "foreground_dataset_conformance"
    rule: "Raw collection and conversion precede real allocation. Apply normalize_once once to each attributable exchange/vector of the selected Q; cards/aggregation do not repeat division. Physical gross mass is never scaled by burden shares."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_complete
    applies_to: "foreground_dataset_conformance"
    rule: "Require complete physical/species/element/water/energy/packaging/asset and stage/combined gates, inheritance and rework acceptance evidence. Unresolved real data contradictions make that package incomplete. Structural measurement success does not establish scientific review, translation review, accepted mapping or publication."
    source_ids:
      - epa-lime-1998
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply of the specified industrial calcitic prehydration quicklime after actual quantities, native/provider identities, burden inheritance and declared service horizon are complete"
  excluded_use: "Whole-leaf37420 coverage; hydrated/hydraulic/dolomitic product claims; pure-CaO equivalence; unmeasured emission or recarbonation credit; unsupported comparative/compliance claims"
  required_metadata: "All reference qualifiers; actual stage/stock/cohort and Q gate; FG horizon; supply backgrounds; native restrictions; every raw protocol and conversion; allocation and physical ledgers Separate gross physicalV and inherited/allocated burden views with original cohortQ_c/H_c; disjoint whole-article/component assembly and internal handoff reconciliation; actual collection-outlet identities with nonadditive per-pool source-W memo subaccounts; ordinary storage/handling humidity and all actual unauthorized/failed work retained."
  required_quality_disclosure: "Unresolved identities/provider and characterization coverage; pending quantities/speciation; inherited-vector and balance discrepancies; time/site relevance, uncertainty and independent review state"
  update_trigger: "Changed feed origin, kiln/fuel, intentional hydration/hydraulic state, product grade, utility/provider/media, actual waste function, service horizon, asset history or new primary evidence"
data_sources:
  - id: "epa-lime-1998"
    type: "official_guidance"
    reference: "US EPA AP-42 §11.17 Lime Manufacturing; February1998; SupplementD update described in text. §§11.17.1–11.17.3; Figure11.17-1; Table11.17-5 and its source/footnote continuation. https://www.epa.gov/sites/default/files/2020-10/documents/c11s17.pdf"
