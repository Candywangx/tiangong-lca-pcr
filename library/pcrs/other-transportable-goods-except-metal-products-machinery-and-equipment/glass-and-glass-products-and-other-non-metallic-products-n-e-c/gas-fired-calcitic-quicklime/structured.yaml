system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "foreground_system_boundary"
      rule: "Include receipt of natural limestone with upstream quarry/preparation burden, actual onsite preparation, natural-gas calcination, cooling/heat recovery, screening/conditional grinding, first QC release, dust/water controls and maintenance. Expand each actual stage and pairing inside the aggregate model; no purchased-finished-product repacking shortcut."
      source_ids:
        - epa-lime-1998
        - nla-lime-essential
    - rule_id: boundary_modes
      applies_to: "foreground_system_boundary"
      rule: "Retain all failed batches, no-output periods, starts/stops, standby, cleanup, testing samples and actual rework. Rework of hydrated/carbonated/off-grade quicklime requires manufacturer/specification permission, actual route, postwork tests and acceptance/disposition; never assume it safely returns to grade. A reinspection or delivery cannot create another first release."
      source_ids:
        - epa-lime-1998
    - rule_id: boundary_services
      applies_to: "foreground_system_boundary"
      rule: "First-release manufacturing is the reference gate. Preserve actual subsequent same-cohort storage, packing, handling and factory dispatch as a separate incremental service vector over a declared observation horizon. Older opening-FG cohorts retain their own original released kg and manufacturing history; never assign their service to current Q by default. No downstream application, slaking or future recarbonation credit."
      source_ids:
        - epa-lime-1998
        - ilcd-attributional-2010
    - rule_id: boundary_complete
      applies_to: "foreground_system_boundary"
      rule: "Each real chemical formulation, utility, fuel, article, waste and species requires one concrete atomic exchange and one physical/burden owner. Whole purchased mixtures include assay/water/additive subaccounts without extra purchases; onsite mixing retains every actual purchased input, energy and loss. Add any real unlisted chemical, refractory grade, filter, spare part, transport service, fuel or release before dataset completion; absence and a numeric zero require evidence."
      source_ids:
        - epa-lime-1998
        - ilcd-attributional-2010
    - rule_id: boundary_heat_water
      applies_to: "foreground_system_boundary"
      rule: "Reconcile actual cooling/wash/wet-control water and each free/liquid/vapour/bound/reaction-water phase. Internal heat/air/water returns cancel only after equal paired interfaces. If a real external steam/hot-water/condensate interface exists, add separately verified atomic supply and return cards with mass, temperature, pressure/phase, enthalpy reference and supplier water/energy convention; do not duplicate a provider or invent a boiler."
      source_ids:
        - epa-lime-1998
