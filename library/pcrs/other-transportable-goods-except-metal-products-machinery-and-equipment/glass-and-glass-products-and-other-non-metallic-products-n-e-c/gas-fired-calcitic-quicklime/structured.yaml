measurement_rules:
  - id: first_release
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q = sum of measured net whole quicklime first quality releases after cooling and final sizing for one declared production cohort. Count each accepted physical batch once. Include accepted retained incidental constituents; exclude all packaging. Q is not pure/active CaO, dry solids, oxide-equivalent Ca, shipment or invoice mass. Closing finished stock already released belongs in Q; do not subtract its manufacturing vector or add its mass as another production output."
  - id: species_basis
    applies_to: "reference product; limestone; offspec; kiln_dust"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure mineral phases, free/active CaO, Ca(OH)2, Ca/Mg carbonate and actual hydraulic phases separately; oxide-equivalent elemental assays and loss on ignition do not establish real oxide, water or CO2 species. Record test atmosphere, temperature schedule, dry/as-received/ignited basis and uncertainty. Independently determine free moisture, bound water and carbonate conversion; one mass residual cannot fit both unknown water and CO2."
  - id: gas_state
    applies_to: "gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Meter gas in its actual delivery T/P, wetness, composition and compressibility; reconcile to the provider cubic-metre state. Derive physical carrier kg and heat MJ only from independent same-state density/composition/calorific evidence, never from a secondary flow-property coefficient."
  - id: electrical_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve electricity native MJ; exact support units convert 1 kWh to 3.6 MJ. Keep electrical energy, fuel heat and material carrier mass separate; do not impose Mass/kg on an energy inventory row."
  - id: quantity_dimensions
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Native extensive property"
      uuid: ""
    required_unit: "Native reference unit"
    rule: "Preserve each selected row native extensive property/unit. For physical balances additionally measure actual material kg independently, with substance-specific same-state density for liquids/gases. An already integrated m3 quantity is not multiplied by time; only true rates are integrated. Counts need measured same-article net mass/configuration, never a guessed item kg or secondary coefficient."
