    used_for: "Complete primary report; Chapter 2 with adjacent WWCB/WSCB/wall alternatives, raw preparation, hydration incompatibility, wet-basis moisture footnote and full process Fig.2.9/photographs. Qualitative process and counterexample context only; figures reprinted from Eltomation share underlying evidence. No recipe, moisture, density, timing, capacity, emission or carbon claim adopted."
