          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_context | dataset | This PCR is attributional and uses allocation only where the study context justifies allocation rather than substitution. First identify real co-functions and separate physically distinguishable operations with dedicated records; then use virtual subdivision/direct assignment of exclusively caused inputs, outputs and service burdens. Document any inability to subdivide and its distortion. Waste, samples, packaging loops and failed boards are not co-products merely because sold or transferred. No automated avoided-production credit or fixed share is authorized. | ilcd-allocation-2010 |\n| allocation_causality | each residual exchange | For each genuinely shared remaining exchange establish the determining physical causal relationship, not any convenient physical property. Wood/binder embodied contents, press work, drying water/enthalpy, residence/occupied storage volume or area and actual asset service may have different demonstrable relationships; each requires evidence and justification. Do not impose one mass/area/time key on every utility, material, waste and service, nor a freely chosen physical-versus-economic switch. Record raw totals, distinct per-exchange criteria and conservation across functions. | ilcd-allocation-2010 |\n| allocation_residual_value | remaining common process burden | Only the still unassignable common-process residual uses representative contemporaneous market value for actual quantities and actual material/quality/packaging state at the same common-process gate. Derive that gate value transparently if traded after transport, drying, finishing or packaging, removing those later services rather than using final retail price. Missing or nonrepresentative market values remain unresolved. The full sum of allocated exchange vectors equals the original vector. Distinguish multifunctional process allocation from multifunctional-product comparison; this PCR supplies no service-life/QFD or recycling-loop default. | ilcd-allocation-2010 |\n| allocation_waste_handover | manufacture and service | Ordinary manufacturing losses/rejects/samples and their actual treatment remain with the producing cohort; sale or off-site removal alone cannot enter T_other or remove their burden. A genuine independent other cohort/function needs a justified one-time inherited vector transfer and explicit recipient. Any recycling/reuse expansion needs its own actual quality changes, true joint process, legal/economic state, treatment and method evidence; these industrial references and the limited ILCD allocation hierarchy do not establish a universal cut-off, recycling rate, compostability, infinite loop or end-of-life credit. Gross physical stocks/flows are never multiplied by economic shares. | ilcd-allocation-2010 |\n\n"
