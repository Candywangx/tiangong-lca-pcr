ion or performed-service deduction. Resolve each unexplained residual or mark actual dataset review/incomplete; a method specification is not a measured plant pass. | cwsf-wwcb-2023; eltomation-woodcement-2020; ilcd-allocation-2010 |\n| validate_evidence | dataset | Each rule and collected/calculated value preserves actual source/context, collection method, original unit, uncertainty and ownership. Keep missing versus zero, qualitative technical synthesis versus site data and current versus historic evidence explicit. Verify allocation conservation, provider compatibility, permission/tests for post-release work and coherent bilingual qualifiers. No publication, mapping approval, scientific approval, translation review or full LCA/EN compliance is established by this method or engineering checks. | ilcd-allocation-2010; cwsf-wwcb-2023; eltomation-woodcement-2020 |\n\n"
