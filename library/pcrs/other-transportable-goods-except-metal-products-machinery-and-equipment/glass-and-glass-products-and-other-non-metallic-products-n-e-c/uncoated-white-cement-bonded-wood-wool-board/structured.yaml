    - id: calc_first_release
      applies_to: "finished_board"
      rule: "Q = sum of measured net first-accepted board lot masses at the defined release condition; each lot enters once including released closing FG. Packaging and repeats are excluded. A zero Q has no unit result."
      inputs:
        - cp_finished_board
        - cp_vectors
        - cp_fg_service
      output: "Q in kg"
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
    - id: calc_stock_allocation
      applies_to: "all inventory rows"
      rule: "For each original exchange j derive A_m,j = B_open,j + X_j + T_in,j - B_close,j - T_other,j on the real native unit. Apply actual allocation after subdivision and native conversion with full vector conservation; stock-corrected X must not receive another stock deduction. B_close excludes released FG; ordinary waste/sale is not T_other. Service A_s,j preserves carried already-performed service plus real H increments less only unused/unassigned carryforward, assigned to original Qc. Do not deduct performed services for closing FG or add historical manufacturing to service again. Physical balances use unallocated gross quantities. For an explicitly custody-only gross physical view, A_m,j or A_s,j is that full independently measured specific leg V in its true native unit/state, never B_open+X+T_in-B_close-T_other, an inherited vector sum, net consumption or economic/service fraction. This includes actual FG/package/asset/part receipts/removals/returns and real thermal-carrier supply or condensate/hot-water Product return. Carrier kg/phase/T/P/enthalpy and heat MJ are independent dimensions of one agreed provider; no second water/heat purchase/provider or automatic return credit. Use the same sole Q or original Qc/H quotient once and keep actual supplier/operation/treatment/service burden vectors separately owned once. All actual manufacture/post-release work, whether authorized, unauthorized, unapproved, failed or rejected, retains actual material/water/energy, emissions, wastes, custody and burdens on its original Qc/H. Manufacturer/spec permission and posttests authorize work and continued quality/identity only, never erase real flows or burdens. Record actual acceptance/disposition and new/old matter/water; broken cured boards or changed chemistry are not assumed restorable. Future unperformed work stays unknown; only unused/unassigned stores carry, never performed held-FG service."
      inputs:
        - cp_vectors
        - cp_fg_service
        - cp_packaging
        - cp_assets
        - cp_allocation
      output: "Unnormalized exchange vectors A_m and A_s in each row native unit"
      source_ids:
        - ilcd-allocation-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For Q > 0 manufacturing row value = A_m,j / Q. For original Qc > 0 service row value = A_s,j / Qc. This is the only division by the reference denominator. Cards and aggregation labels refer to this same result without dividing it again. finished_board = 1 kg; service board receipt/dispatch/return rows use their actual physical numerator for the same original Qc and never establish a new Q. For Q or Qc = 0 retain raw vectors and report no unit result. Each occurrence must identify whether it reports attributable burden/service or a physical custody/acquisition/removal movement. For an explicitly physical packaging, waste or asset movement, substitute its independently measured unallocated gross movement converted to the native extensive unit as the numerator, exactly as for physical FG legs; keep absolute gross quantities primary and separate from the burden vector. Physical purchase/stock/removal does not itself define asset service, another purchase on reuse, a burden-transfer deduction or a new Q. A documented asset-service burden remains its actual justified service numerator, without substituting the full physical asset charge. For an explicitly custody-only gross physical view, A_m,j or A_s,j is that full independently measured specific leg V in its true native unit/state, never B_open+X+T_in-B_close-T_other, an inherited vector sum, net consumption or economic/service fraction. This includes actual FG/package/asset/part receipts/removals/returns and real thermal-carrier supply or condensate/hot-water Product return. Carrier kg/phase/T/P/enthalpy and heat MJ are independent dimensions of one agreed provider; no second water/heat purchase/provider or automatic return credit. Use the same sole Q or original Qc/H quotient once and keep actual supplier/operation/treatment/service burden vectors separately owned once."
