system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Start with actual coniferous roundwood receipt including forest-roadside-to-plant supply and debarking/seasoning where actual; include complete cross-cutting and wood-wool preparation, removal of fines, waterglass bath and actual dilution, whole white-cement dosing, continuous mixing, mat forming on circulating moulds, pre-press/separation, stacking pressure and first setting, demoulding, second setting with climate control, real drying, trimming/profiling, first QC and all associated handling/cleanout. Actual times, temperatures, recipes and losses are collected rather than copied from the examples."
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
    - rule_id: boundary_terminal
      applies_to: "dataset"
      rule: "Scope is a whole uncoated white-Portland-cement-bonded wood wool board for separately specified acoustic/insulating use at first factory quality release, not installed service. Exclude resin-bonded board, dense cement particleboard, magnesia/gypsum binder, pure cement slab, painted/faced board, composite insulation sandwich, reinforced wall/roof element and building installation. A different actual binder, terminal or fibre form needs a separate applicability assessment and complete compatible evidence, not a leaf-derived duplicate."
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
        - troldtekt-unpainted-colours
    - rule_id: boundary_first_release
      applies_to: "finished_board"
      rule: "Define Q as sum of actual net board mass newly accepted for the first time in the declared cohort at the documented release moisture/condition after setting, drying, trimming and QC. Packaging is excluded. First-release closing FG is already in Q and is neither an additional production output nor a manufacturing closing-burden deduction. Reinspection, dispatch, return and post-release rework never create another Q. Zero Q retains raw physical flows and burdens but yields no unit result."
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
    - rule_id: boundary_vectors
      applies_to: "manufacture"
      rule: "Retain an extensive inventory vector by original exchange and cohort for opening/closing raw stocks, each preparation/formed/first-setting/second-setting/drying/trim WIP stage, unassigned non-WIP supplies and all internal transfers. For exchange j use A_m,j = B_open,j + X_j + T_in,j - B_close,j - T_other,j. X_j contains real period activity after actual unit/rate conversion and justified allocation; no normalized values enter it. B_close is only unused raw/WIP/unassigned stores, never already released FG. If X already uses stock-corrected consumption, do not subtract that stock again. T_other exists only for a real independent cohort/function and justified one-time burden handover; ordinary failures, waste, samples or sold/off-site scrap do not qualify merely by their destination. Physical gross remains intact."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_service
      applies_to: "service"
      rule: "Retain packing, storage, handling, dispatch and any permitted post-release work as an observed incremental service account for original cohort Qc and explicit horizon H. Record original manufacturing vector, any already-performed service vector before H and actual H service separately. Only unused/unassigned service or supplies may carry forward; performed service is not removed because its FG remains stored. Normalize service only by original Qc in calc_normalize. Do not divide by shipments, dispatch count, current returned mass or a new first-release denominator. Disclose horizon completeness and leave future service unknown."
      source_ids:
        - ilcd-allocation-2010
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
    - rule_id: boundary_physical
      applies_to: "all physical ledgers"
      rule: "Reconcile manufacturing, post-release FG and merged gates independently. Manufacturing opening raw/WIP + actual external physical ingress = first-release board Q + full real wastes/emissions/external returns + closing raw/WIP + measured other genuine outputs, with actual phase/species transformations and stock changes explicitly bridged. FG opening + physical first-release receipts + actual external returned boards + other genuine physical ingress = gross external dispatch + closing FG + real rejects/samples + actual gas/water or other physical outflux. Do not assume received or returned board mass equals the original release/delivery mass; retain real water gain/loss and test/rework changes. On merge cancel internal first-release receipt/output and internal WIP transfers; retain external dispatch and closing FG, never Q plus that same closing FG as two outputs. Asset and packaging physical ledgers remain separate complete gross balances and do not scale with economic allocation shares."
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
        - ilcd-allocation-2010
    - rule_id: boundary_packaging
      applies_to: "each packaging occurrence"
      rule: "For each paper sack, real separable liner, PE-LD film, PP strap, wooden pallet and corrugated protector keep: opening empty + opening attached-WIP + opening attached-FG + opening reusable + real external purchased/supplier-included ingress + external returns received = all closing states + material leaving with gross physical shipments + external returns sent + waste + separately evidenced true physical losses/gains. Never omit actual ingress because retained in closing stock. Ingress packaging included in a supplier package still has full physical mass and exactly one upstream burden owner. Internal reuse cancels rather than adding procurement, production, net product Q or coproduct credit. Retain attached water/contents once and add every actually present new packaging component atomically. Keep P (all paid standalone or bundled ingress), N_ext (actual non-purchased first external ingress), ER (return of this same article after its own evidenced prior outward movement), S (gross shipment), EO (actual external return sent, linked to its prior receipt and receiver) and W as six disjoint movement legs, separate from all stocks. For each of the seven actual source pools (cement_sack, inbound_ldpe_liner, inbound_pallet, film, pp_strap, pallet and edge_protector), its existing I-labelled inbound card records N_ext including non-purchased supplier-included I, gift and loan receipts without that same article's own prior outward movement. I is a nonadditive subset of N_ext, not another leg; paid bundled packaging belongs to P. Verify the actual payment, article history, source and owner rather than using a generic first-supply label. N_ext is incoming, never an outward transfer, internal reuse or same-article ER. Actual repair material/new or old parts and water absorbed/released require X_in/X_out on their actual sides only when not already represented in another same-direction flow term; preserve overlap evidence. X never cancels against stocks. A whole wet P/I receipt is counted once; any actual retained added material/water stays in influx and in complete wet closing stock simultaneously."
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
        - ilcd-allocation-2010
    - rule_id: boundary_assets
      applies_to: "each machine mould component and fluid"
      rule: "Keep complete opening/new/used/repair/retired/closing machine and mould inventories, real material acquisitions/removals, moisture, corrosion and installed-fluid balances. For component i: opening_i + real new/used/repair X_in,i + other real ingress = closing_i + real removal/retirement X_out,i + actual wear/leakage/outflux. Deduplicate X only against another counted ingress/outflux, never against retained closing stock. Allocate documented current asset service separately from these gross physical events; no fixed lifetime, guessed mass, full machine per kg or automatic reuse credit. Actual refractory, grease, fastener, coating or other newly found material is individually added before dataset release."
      source_ids:
        - ilcd-allocation-2010
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
    - rule_id: boundary_species_water_carbon
      applies_to: "all material and elementary occurrences"
      rule: "Measure total physical mass and relevant elemental inventories independently from actual material/species, assay and reaction evidence. Track free liquid/vapour water, wood moisture, supplier carrier water, phase/structural water, water incorporated by hydration and any true reaction-produced water separately; hydration does not create water mass. Do not infer hydrate fraction or wood dry loss from one balance residual for two unknowns. Measure biogenic carbon on actual dry wood/composite and binder mineral carbon separately; original forestry uptake and later plant changes have one owner. Carbonation requires independent CO2/phase/time/gas evidence. No assumed wood species moisture, lifetime carbon storage, end-of-life credit, carbon-negative label or zero emissions. COD/VOC/NOx and PM size totals remain indicators until independently speciated; each real species and receiving destination is atomic."
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
        - ilcd-allocation-2010
    - rule_id: boundary_heat
      applies_to: "water and energy carriers"
      rule: "Maintain whole purchased binder/solution/steam packages once and separate analytical water/active/thermal subledgers. Actual site preparation uses every purchased ingredient and real energy/loss. Thermal MJ, fuel/steam carrier mass and gas/liquid volume are different extensive properties. Only genuine rates are integrated; integrated volumes are not multiplied by time again. Independent substance/state density is required for mass conversion; no universal 1000 kg/m3. External condensate and heat-exchange water returns retain gross Product mass and actual enthalpy plus supplier water/energy ownership. A nonexistent boiler/steam/cooling circuit is never inferred."
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
    - rule_id: boundary_upstream_rework
      applies_to: "dataset"
      rule: "Primary sources support a transparent technical synthesis of actual terminal and industrial operations, not one recipe/SKU/order/site. Connect compatible upstream supplier datasets and actual transport once per exchange without claiming supplier approval from a Flow identity. A purchased finished board input may support an explicitly disclosed service/recursive input only; it cannot replace the manufacturing route. Every failed run, zero-output run, start/stop, cleanup, idle, sample and rework load remains. Post-release work requires manufacturer/specification permission, actual post-work tests, acceptance/disposition and original-lot linkage; repeated approval is never new production. Record every actual new and removed material/part with new/old state and added/removed free, carrier, structural or reaction water, with separate physical and inherited-vector histories. Repair-held boards are a labelled FG substate or a disjoint repair-WIP state once. Manufacturer/specification permission, post-work tests, actual acceptance or rejection and final destination determine any resumed conformity; no assumed repair of hardened/broken boards or new Q."
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
        - ilcd-allocation-2010
