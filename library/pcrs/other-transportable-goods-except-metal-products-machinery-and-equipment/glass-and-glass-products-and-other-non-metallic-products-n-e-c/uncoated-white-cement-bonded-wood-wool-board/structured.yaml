      rule: "For independently measured wet mass m_w and dry matter m_d use wet-basis water fraction w=(m_w-m_d)/m_w and dry-basis u=(m_w-m_d)/m_d only within the verified drying/assay method. The source report uses wet-basis moisture, not a universal value. Composite drying mass loss cannot automatically distinguish free water hydrate water organic volatiles or dry wood loss. Actual dry-wood biogenic carbon = measured dry wood mass × independent carbon fraction; binder mineral carbon and true carbonation remain separately measured. No default CO2 storage or end-of-life credit follows."
      inputs:
        - cp_species_water_carbon
        - cp_roundwood
        - cp_finished_board
      output: "Independent moisture/species/carbon subledgers with uncertainties"
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
    - id: calc_gate_reconciliation
      applies_to: "manufacture; service"
      rule: "Use boundary_physical, boundary_packaging and boundary_assets balances independently on full wet-state physical quantities. Retain real inbound packaging/material/water/repair influx even if held in closing stock; deduplicate only another actual ingress/outflux term. Bridge first-release board to FG wet masses and original gross shipments/returns with independently measured changes. Cancel internal Q and WIP transfers on merge; no residual-fitting, economic scaling of physical mass or ordinary waste burden deduction. Ordinary storage/handling absorption/desorption/evaporation needs no repair event. X deduplicates only another actual same-side FLOW term, not stock/oppositeflow/cardexistence; retained true influx AND full wet closing stock remain. Bought whole articles carry integral liner/seam/glue/print/water once as composition memo; actual separately supplied onsite components need independent receipt/owner. Empty assembled tare equals measured whole-bought contribution plus real added matter/retained water minus actual removal/loss, excluding board. Use disjoint components or a reconciled whole article with matched internal handoff IDs replacing component stocks/shipments, never whole assembled tare plus its same components. Inbound cement_sack/inbound_pallet/inbound_ldpe_liner are distinct actual supplier-included source pools; service film/pallet/strap/protector are distinct actual service pools. One physical article transferred/reused between them uses paired internal handoff and inherited ownership, not another external ingress/purchase; a liner integral to a whole composite sack is memo only. If real collection combines sources in one physical outlet, use one qualified atomic Waste exchange; independently measured per-pool W/source withdrawals sum to that outlet as nonadditive raw subaccounts. Total OR disjoint partition, never both, treatment/provider once; genuinely separate outlets stay separate. No packaging/repair/uptake or fixed source split is assumed."
      inputs:
        - cp_vectors
        - cp_fg_service
        - cp_packaging
        - cp_assets
        - cp_species_water_carbon
      output: "Separate manufacturing FG merged packaging asset and elemental reconciliations"
      source_ids:
        - cwsf-wwcb-2023
        - eltomation-woodcement-2020
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Use whole actual preparations and each atomic exchange with full native restrictions and compatible upstream owner. No contradictory CAS/form/media/route substitution."
      evidence: "Supplier specification SDS native identity and exact property/unit evidence"
    - id: dq_scope
      applies_to: "manufacture; service"
      requirement: "Complete real route and first-release Q with all raw/WIP/FG stocks and original-cohort services. Technical synthesis is not measured site performance."
      evidence: "Batch/process/QC logs and stock-service bridge"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Retain native extensive units and raw totals before exactly one A/Q; independently measure state density moisture geometry and machine mass/service when needed."
      evidence: "Calibration raw meter series weighings assays drawings and uncertainty"
    - id: dq_completeness
      applies_to: "all periods and flows"
      requirement: "Include every real additional material/species and receiving destination and all failures/idle/cleanup/rework. Unknowns are not zero; residuals cannot fit two unknowns."
      evidence: "Independent physical/element balances and actual gap register"
    - id: dq_allocation
      applies_to: "shared exchanges"
      requirement: "Dedicated and virtual subdivision precede exchange-specific determining causality and only then common-gate residual market value. Preserve one-time inheritance and all-function conservation."
      evidence: "Actual allocation criteria co-function state prices and conserved vectors"
    - id: dq_rework
      applies_to: "post-release work"
      requirement: "Actual manufacturer/spec permission plus post-work tests acceptance/disposition; no new Q or assumed restoration of cured broken board."
      evidence: "Traceable permission tests actual lot and burden bridge"
    - id: dq_sources
      applies_to: "dataset"
      requirement: "Distinguish actual primary originals selected extraction and images from excerpts and historical cases; disclose shared underlying sources uncertainties and limits without claiming approvals."
      evidence: "Complete source context and bilingual rule/qualifier alignment"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference and every inventory row"
    rule: "Check whole-product identity and exact native reference property/unit chain, all basename qualifiers, synonyms/comments, CAS where present, material family, form, phase, route, component state, geography, media and Product/Waste/Elementary type. No broad family or classification code excuses a contradictory route/CAS/particle state. Preserve each adopted restriction in the full card context and official Chinese basename when supplied. Unconfirmed auxiliary UUIDs stay blank with exact atomic name and manifest tracking. A missing core manufactured reference identity is a core hold and cannot be promoted by a formal check."
    source_ids:
      - cwsf-wwcb-2023
      - eltomation-woodcement-2020
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Verify actual first-release Q, explicit finished_board link, unnormalized collection and exactly one A/Q calculation, native extensive unit per row and actual scope-specific conversions. Verify Q=0 handling, every period including failures, exact actual geometries and reference moisture. Area conversions require sum of actual single-face projected board areas; L*W is allowed only for proven rectangles, otherwise actual drawing-specific geometry is required. Count-to-mass uses measured net board configuration mass with calibrated weighing and moisture scope; never a secondary coefficient."
    source_ids:
      - cwsf-wwcb-2023
      - eltomation-woodcement-2020
  - rule_id: validate_conservation
    applies_to: "manufacture service packaging and assets"
    rule: "Independently reconcile physical mass, relevant elements, free/bound/reaction water, gas species, all raw/WIP/FG stocks and inherited vectors, packaging loops, gross returns and all assets/fluids. Never fit two unknowns with one residual; never replace actual waste/air species with an aggregate indicator. Confirm full real influx remains when held in stock and no ordinary waste-sale deduction or performed-service deduction. Resolve each unexplained residual or mark actual dataset review/incomplete; a method specification is not a measured plant pass."
    source_ids:
      - cwsf-wwcb-2023
      - eltomation-woodcement-2020
      - ilcd-allocation-2010
  - rule_id: validate_evidence
    applies_to: "dataset"
    rule: "Each rule and collected/calculated value preserves actual source/context, collection method, original unit, uncertainty and ownership. Keep missing versus zero, qualitative technical synthesis versus site data and current versus historic evidence explicit. Verify allocation conservation, provider compatibility, permission/tests for post-release work and coherent bilingual qualifiers. No publication, mapping approval, scientific approval, translation review or full LCA/EN compliance is established by this method or engineering checks."
    source_ids:
      - ilcd-allocation-2010
      - cwsf-wwcb-2023
      - eltomation-woodcement-2020
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Compatible specified wood-wool board manufacturing input with original first-release basis and explicit observed service addition"
  allowed_use: "Only declared material binder route gate geometry moisture geography and provider scope; actual dataset completeness must be independently established"
  excluded_use: "Installed service comparison without actual performance/life evidence; resin/magnesia/gypsum/dense particleboard substitution; generic carbon storage or recycling credit; product certification"
  required_metadata: "All reference qualifiers; native extensive units; unique Q cohort and H; actual raw/WIP/FG packaging/asset vectors; upstream owners; allocation and data gaps Separate physicalgross/burden/provider views; disjoint seven source/package pools and matched internal transfers; wholearticle/component and actualoutlet/source-W nonadditivity; ordinary humidity/unauthorizedfailedwork; exact originalQcH and thermalcarrier mass/heat owner."
  required_quality_disclosure: "Actual temporal/geographic/technology coverage uncertainty identity/provider gaps source limits physical residuals and service-horizon completeness"
  update_trigger: "Real binder/fibre/terminal/geometry/route change; provider/native restriction change; new phase/carbon evidence; actual service/rework difference; revised independent scientific review"
