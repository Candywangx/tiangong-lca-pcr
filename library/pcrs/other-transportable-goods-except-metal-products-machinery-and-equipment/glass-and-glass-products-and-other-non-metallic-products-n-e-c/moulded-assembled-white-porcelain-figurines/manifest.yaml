  independent_review_scope_note: Frozen 37221 is now available and independently excludes ornamental statuettes; its isostatic dry-pressed plate route does not cover multipart moulding and slurry assembly. Original author availability statement above remains historical.
  identity_restrictions:
    - Core is the verified public manufactured decorative clay/porcelain family narrowed to a complete ceramic-only white hard-porcelain animal figurine. Native historic China commentary is not a fixed provider/geography. Item(s) equals item with factor 1; no guessed mass.
    - Electricity only CN user-side grid-average <1 kV, native energy/MJ; never the historical German maker provider. Municipal potable tap water only. Other actual sites/supplies require a different compatible native identity.
    - Purchased plaster mould uses one complete manufactured plaster article, not powder/resin; high-alumina brick retains its actual >48% alumina/shaped-sintered/firing-route restriction. Actual grade qualification remains required.
    - Adopted PE film keeps coherent CAS9002-88-4 and form despite isolated luggage classification; comment comparison to PET does not authorize PET. Every adopted species card carries phase/origin/media/alias restrictions in full consumable context.
    - Independently verified contemporary O2/Ar outlets, natural Ar resource, measured fossil CH4 and whole manufactured wooden load-platform identities retain exact native units, phase/origin/medium and alias/provider limits on every bound card. Repair material and independently measured packaging water have disjoint gross physical terms and specifically identified actual exchange obligations.
    - Rejected native long-term gas variants, hydropower at plant, NO2/tetroxide conflict, gas mass-volume/CAS ambiguity, gypsum dihydrate/hemihydrate conflict, recovered-metallurgy/grade-specific soda, glass/electrical-bound feldspar, fixed-fibre carton and manganese-slag wastewater cannot silently be reused.
  gross_ledger_clarification: Distinguish already-net consumption from gross receipt stock-vector calculation, retain all physical quantities and inherited exchange vectors, ordinary waste is not automatic burden export. Gross physical FG/package numerators are separate ledger-only quantities, not service burden vectors or second stock/allocation corrections. Actual performed service on held FG remains in original Qc/H. No inventory, amount, Count reference, sources or science/translation gate changed.
