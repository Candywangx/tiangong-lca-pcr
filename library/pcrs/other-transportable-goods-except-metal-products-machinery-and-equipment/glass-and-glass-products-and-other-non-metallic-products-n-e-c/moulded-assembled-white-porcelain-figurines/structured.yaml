          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole actually supplied unfired mineral ingredients or compatible whole slip; no purchased fired figurine replacing manufacture |\n| starting_condition_role | foreground_material_receipt |\n| product_classification_scope | Narrow white hard-porcelain animal-statuette subset of CPC 37222 |\n| recursive_input_rule | Bought fired same-category pieces require compatible upstream burden and a new scope assessment; their packing is not this route |\n| upstream_dataset_requirement | Match whole supply formulation and all actual grade/route/form/geography/unit restrictions; do not duplicate constituent or provider burdens |\n| disclosure | Receipt-to-first-release manufacture with complete upstream links and separately labelled original-cohort services through stated horizon; consolidation boundary explicit |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | manufacture | Include every actual raw preparation, mould preparation/use, part forming, slurry joining/retouching, drying, mark/glaze preparation/application, firing/refiring, finishing, testing, controls and support operation. Record actual heat source per stage; a manufacturer case is not a fixed factory recipe. | `meissen-raw-preparation`; `meissen-figurine-assembly`; `meissen-glazing`; `meissen-firing`; `jrc-ceramic-bref-2007` |\n| b_whole | supplied formulations | Purchase each complete supplied slip/glaze/mark/tint/fuel/lubricant once, including carrier and additives. Assays and water are subledgers. On-site mixing instead records every real external ingredient, energy and loss; no duplicate internal formulation purchase. A whole purchased kiln/mould and its embodied lining/supports/initial fluids are acquired once; component rows only record independent supply or actual repairs, with disjoint parent/child masses and service burdens. | `meissen-raw-preparation`; `meissen-figurine-assembly`; `meissen-glazing`; `jrc-ceramic-bref-2007` |\n| b_first_release | manufacturing numerator | Include failed/zero-output/start-stop/idle/cleanup/rework loads and opening/closing raw, unreleased WIP and unassigned non-WIP-store inherited burden vectors per exchange. Closing already-released FG is in Q: never subtract its manufacture from the numerator or add it as another production output. | `jrc-ceramic-bref-2007` |\n| b_services | original released cohorts | Keep original manufacturing history; post-release actual packing, storage, dispatch, returns, retest, cleanup and rework increments belong to original cohort Qc and observed horizon H. No retest/return/re-shipment creates Q. A service with Qc=0 has no unit result. Cancel internal Q hand-offs on consolidation. | `jrc-ceramic-bref-2007`; `meissen-white-lion` |\n| b_atomic | all exchanges | Every real additional material, applied colour/medium, fuel, chemical, cooling fluid, waste and elemental species must be added as its own specific row with actual identity and collection. Do not hide actual exchanges as zero, other, a selector or total indicator. Demonstrated absence, missing measurement and measured zero differ. Incompatible new decoration requires scope extension. | `jrc-ceramic-bref-2007`; `meissen-glazing`; `meissen-figurine-assembly` |\n| b_gates | physical balances | Close manufacturing, FG-service and combined wet/dry/material/element/species physical gates before allocation; internal transfers cancel once. Gross air species and gross asset/packaging physical masses are not economically scaled. External Product returns, waste transfers and direct environmental emissions differ. | `jrc-ceramic-bref-2007`; `jrc-ilcd-allocation-2010` |\n\n"
