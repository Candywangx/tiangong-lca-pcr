allocation_rules:
  - rule_id: a_subdivide
    applies_to: "shared operations"
    rule: "For an attributional goal that needs allocation, first separate dedicated operations and use supported virtual subdivision: actual fragments/slip/mark/glaze embodied in one design follow that design; document shared meter disaggregation. No allocation just because different products share a site."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_physical
    applies_to: "remaining individual exchanges"
    rule: "Determine and quantify exchange-specific physical causality for each residual shared exchange, using the property or combined properties actually determining the function. Kiln occupancy/time, heating and support masses are candidates to prove, not automatic keys. A single mass or economic factor cannot govern all flows."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "genuinely inseparable residual"
    rule: "Only genuinely unassigned residuals after those steps use contemporaneous market values of actual co-functions in their real condition at the common process gate. Retain quantities, values, time, market and uncertainty and sensitivity. No arbitrary physical/economic choice, fixed shares, automatic substitution or avoided-burden credit."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_not_coproduct
    applies_to: "internal loops failures packaging assets"
    rule: "Internal slip/trim/glaze/water recirculation, failures, packaging returns, mould reuse, spent supports and retired assets are not automatically coproducts. Retain their actual material/waste/service functions and full physical balances; economic burden allocation never scales gross physical stocks or emissions used for balance."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "Each actual supply and formulation"
      record_type: "raw_foreground_record"
      raw_fields: "supplier lot; whole received mass; grade; route; moisture; assay; separate recipe input; preparation stage; waste; internal transfer; opening_raw; closing_raw; opening_WIP; closing_WIP; unassigned_stores; inherited_vector_j; gross_receipt_or_already_net_consumption_basis; stock_adjustments_already_included; independent_opening_closing_raw_WIP_nonWIP_physical_quantities; complete_inherited_exchange_vectors"
      collection_method: "Calibrated weighing and matched invoices/assays; reconcile each lot through raw preparation and wet/dry part assembly without duplicating whole formulations or carriers. Record gross versus already-net consumption explicitly and preserve adjustments already included, independently measuring all disjoint opening/closing raw/WIP/non-WIP physical quantities and every inherited exchange vector. Do not apply the same stock correction twice."
      unit: "kg"
      frequency: "each lot/cycle/movement"
      temporal_coverage: "declared representative period plus opening history and actual H"
      site_scope: "actual site and original design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration original records lineage and unknowns"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "Each meter fuel heat carrier and inbound freight"
      record_type: "raw_foreground_record"
      raw_fields: "stage; firing_ID; operating_mode; raw_reading; unit; start; end; totalised_or_rate; fuel_supply; stock; temperature; pressure; density_evidence; heating_value; enthalpy_supply; enthalpy_return; carrier_mass; provider_convention; actual_load; distance"
      collection_method: "Read calibrated stage/cycle meters and real provider/transport records including failed, hot-hold, idle, mould drying and cleanup; keep each energy/volume/mass stream native and unnormalised."
      unit: "row native units"
      frequency: "each lot/cycle/movement"
      temporal_coverage: "declared representative period plus opening history and actual H"
      site_scope: "actual site and original design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration original records lineage and unknowns"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "Each mould kiln refractory support and fluid"
      record_type: "raw_foreground_record"
      raw_fields: "asset_ID; design; cavity; material; opening_unused; opening_installed; additions; actual_water; in_machine_fluid; maintenance; closing_unused; closing_installed; retired; actual_cycles; observed_use; inherited_vector_j"
      collection_method: "Weigh or use traceable calibrated component records for each complete asset/material and actual fluid/water; reconcile physical movements separately from empirically supported period service burden."
      unit: "kg"
      frequency: "each lot/cycle/movement"
      temporal_coverage: "declared representative period plus opening history and actual H"
      site_scope: "actual site and original design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration original records lineage and unknowns"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "Each individual inlet and outlet species"
      record_type: "raw_foreground_record"
      raw_fields: "species; CAS; origin; phase; compartment; concentration_basis; dry_wet_basis; inlet_composition; gas_total_or_rate; time_interval; temperature; pressure; humidity; particle_phase; calibration; detection_limit; blanks; independent_elements; conversion_evidence"
      collection_method: "Use actual speciated monitoring with matched gas basis or independent validated reaction/material data; integrate true rates only. Keep PM/VOC/COD/NOx/total-element indicators separate from identified molecular masses. Unknown species remain unknown."
      unit: "kg"
      frequency: "each lot/cycle/movement"
      temporal_coverage: "declared representative period plus opening history and actual H"
      site_scope: "actual site and original design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration original records lineage and unknowns"
    - protocol_id: cp_residue
      process_id: "manufacture"
      flow_role: "Each separate waste and actual treatment"
      record_type: "raw_foreground_record"
      raw_fields: "stream_ID; stage; wet_mass; dry_mass; free_water; structural_water; composition; dissolved_species; waste_status; transfer_ticket; destination; retained_stock; internal_recovery; reagent_receipt"
      collection_method: "Weigh each waste and sample independently; retain off-site treatment tickets and actual in-site cleaning reagent/effluent records. Dissolved species are subledgers of outgoing wastewater unless directly emitted, not a duplicate mass."
      unit: "kg"
      frequency: "each lot/cycle/movement"
      temporal_coverage: "declared representative period plus opening history and actual H"
      site_scope: "actual site and original design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration original records lineage and unknowns"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "Only first completed-figurine release"
      record_type: "raw_foreground_record"
      raw_fields: "design; fragment_lineage; unique_ID; first_release_time; Q; net_complete_mass; scale_calibration; moisture_state; geometry; surface_test; crack_test; deformation_test; mark_check; failure; unreleased_WIP; closing_released_FG"
      collection_method: "Count each complete accepted object once; reconcile physical IDs and actual acceptance results including held released FG. Weigh the same complete design on a calibrated scale without packaging; preserve test failures and unproduced burdens."
      unit: "item; kg"
      frequency: "each lot/cycle/movement"
      temporal_coverage: "declared representative period plus opening history and actual H"
      site_scope: "actual site and original design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration original records lineage and unknowns"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "Each original released cohort and observed service"
      record_type: "raw_foreground_record"
      raw_fields: "cohort_ID; original_Qc; H; opening_FG; first_release_transfer; gross_dispatch_G; return_R; original_dispatch_ID; actual_return_mass; moisture_change; repair_input; loss; closing_FG; destruction; raw_meter; inherited_manufacturing_vector_j; manufacturer_permission; actual_rework_route; material_glaze_compatibility; reacceptance_results; measured_added_material; measured_added_water; measured_removed_old_material; independently_measured_water_loss; actual_destinations"
      collection_method: "Use gross ID-linked receipt/dispatch/return records and actual incremental service meters, repair and waste. Retain original cohort count and inherited history; a return is not assumed to match original mass or contain no new water/loss. Any actual post-release rework requires documented manufacturer-compatible permission for the particular body/glaze/mark and restoration of the original complete ceramic-only terminal, followed by actual reacceptance of geometry, cracks, surface and marking. Do not assume repairability, a pass, extra refiring or cold organic restoration; incompatible adhesive/coating/component repair requires a separately reviewed scope. Identify every added material/water and removed old material/loss as an actual specific exchange, retain their destinations and avoid duplicating water carried in another measured stream."
      unit: "row native units"
      frequency: "each lot/cycle/movement"
      temporal_coverage: "declared representative period plus opening history and actual H"
      site_scope: "actual site and original design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration original records lineage and unknowns"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "Each single package material/configuration"
      record_type: "raw_foreground_record"
      raw_fields: "package_ID; material; provider; ownership; opening_empty; opening_WIP_attached; opening_FG_attached; opening_reusable; purchase_P; inbound_attachment_I; external_return_received_ER; closing_empty; closing_WIP_attached; closing_FG_attached; closing_reusable; gross_shipped_S; outward_return_EO; waste_W; internal_reuse; inherited_vector_j; dry_material; moisture_state; repair_material_added_Radd; repair_material_removed_Rremove; independent_water_uptake_H2Oin; independent_water_release_H2Oout; repair_input_identity; removed_material_destination"
      collection_method: "Calibrated separate packaging masses and matched gross movement tickets including raw-material arrival packs; disjoint empty/attached/reusable pools per configuration. Each new material gets its own rows and balance; no economic scaling of mass. Independently record actual repair material addition/removal and water uptake/release outside existing whole-package streams, without double counting. Every real wood/adhesive/fastener/water or removed-material outlet requires its own specific atomic row and supplier/destination; missing measurement is not zero."
      unit: "kg"
      frequency: "each lot/cycle/movement"
      temporal_coverage: "declared representative period plus opening history and actual H"
      site_scope: "actual site and original design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration original records lineage and unknowns"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert raw measurements to each native extensive numerator unit before stocks/attribution. Integrate genuine rates over recorded intervals once; retain totalised volumes as totals; convert kWh to MJ by 3.6. Density/enthalpy/heating value require independent actual substance/state evidence; no secondary-coefficient inference."
      inputs:
        - raw_reading
        - state_evidence
        - unit_factor
      output: "raw_extensive_amount"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: manufacturing_stock
      applies_to: "manufacture"
      rule: "For each exchange j use A_j = Bopen_j + P_j - Bclose_j - Tother_j after internal cancellation and justified attribution. Bopen/Bclose hold inherited raw, unreleased WIP and unassigned non-WIP-store vectors only. P includes every real operating mode and losses. Tother is separately justified burden assigned outside the target cohort. Already-released closing FG is not in Bclose. Unknown history is not zero. Declare whether each raw basis is a gross receipt/occurrence or an issue/consumption amount already adjusted for stock. Apply only stock adjustments not already included in that basis, never the same raw-stock correction twice. Independently record every raw/WIP/unassigned non-WIP opening and closing physical quantity and its full inherited per-exchange vector, including the upstream history of consumed opening material. Ordinary waste, rejects, failed loads or a sale alone do not establish Tother burden export or credit; any transfer needs a real distinct cohort/function and justified attribution once."
      inputs:
        - Bopen_j
        - P_j
        - Bclose_j
        - Tother_j
        - cp_material
        - cp_asset
        - cp_release
      output: "A_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: first_release
      applies_to: "finished_figurine"
      rule: "Q is the count of unique complete objects first quality-released in the declared design/cohort, including those held in closing FG. Unreleased fragments/WIP and failures do not enter Q; their attributable burdens remain. Retest, return, repair and re-dispatch never create another first release."
      inputs:
        - cp_release
        - unique_first_release_IDs
      output: "Q"
      source_ids:
        - jrc-ceramic-bref-2007
        - meissen-white-lion
    - id: cohort_services
      applies_to: "service"
      rule: "For each original cohort retain its manufacturing vector and original Qc. Assemble Aservice_j from actual incremental services through observed H after justified assignment; do not transfer old manufacture into a new production Q. Count/ID bridge: opening FG + first-release receipts + actual returns = closing FG + gross dispatch + actual destruction + separately evidenced other physical exit. Independently reconcile actual physical mass: opening + first-release receipts + returns + separately measured added material/water = closing + gross dispatch + destruction + removed old material + separately measured water loss + other actual exits. All terms are disjoint; water/material already carried by a measured stream is not added again. Record actual returned condition, actual maker-permitted compatible rework and reacceptance, every incremental input and outlet; no blind reversal or net-delivery denominator. Actual performed service for held closing FG retains its burden; holding the goods does not justify a service deduction. For FG and packaging physical movement cards, Aservice_j is the full measured gross quantity of that particular leg, not a burden vector, a second stock correction or an economically scaled amount. Keep these ledger-only results distinct from actual attributed supplier/operation burdens; a physical shipment, supplier-included receipt or return creates neither another purchase nor coproduct credit. Preserve the independently matched original delivery record; a changed wet return is not an assumed reversal of the original delivery quantity."
      inputs:
        - cp_service
        - Qc
        - H
      output: "Aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: final_exchange
      applies_to: "all inventory rows"
      rule: "The sole unit-result operation is a_j = A_j / Q for manufacture and aservice_j = Aservice_j / Qc for separately labelled original-cohort services over H. Apply only after raw conversion, stocks and attribution; cards reuse this result and protocols retain raw totals without another division. Q=0 or Qc=0 retains actual burdens and produces no unit result. The reference output is 1 item. Consolidation combines corresponding original-cohort results while cancelling the internal Q hand-off exactly once. For ledger-only physical FG/package movements use their full actual gross numerators defined in cohort_services after native-unit conversion, without burden-vector additions, stock correction or allocation scaling. Report those normalized physical legs separately from attributed manufacturing/service burdens; normalization itself creates no provider purchase or credit."
      inputs:
        - A_j
        - Q
        - Aservice_j
        - Qc
        - cp_release
        - cp_service
      output: "a_j; aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: package_bridge
      applies_to: "cp_pack"
      rule: "For each material/configuration: opening empty + opening WIP-attached + opening FG-attached + opening reusable + P + I + ER + Radd + H2Oin = closing empty + closing WIP-attached + closing FG-attached + closing reusable + S + EO + W + Rremove + H2Oout. Pools and gross directions are disjoint. Radd/Rremove are independently measured actual repair material added/removed outside the already recorded whole-package directions; H2Oin/H2Oout are actual water uptake/release outside water already carried in those measured streams. Keep dry wood/material and free/absorbed water subledgers; never infer either from one wet residual. Add a specifically identified atomic exchange for every real repair wood, adhesive, fastener, cleaning water and removed material/water outlet with correct supply/waste/emission status, ownership and original-cohort history; cancel internal component transfers once. Internal reuse cancels, gross physical terms are unallocated, package mass never enters Q. Assign purchase/service and inherited packaging burden once to actual original cohorts; stock changes cannot erase inherited vectors."
      inputs:
        - cp_pack
        - P
        - I
        - ER
        - S
        - EO
        - W
        - Radd
        - Rremove
        - H2Oin
        - H2Oout
      output: "packaging_residual"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: assets_physical_service
      applies_to: "cp_asset"
      rule: "Reconcile each mould, kiln, refractory, support, repair part and installed fluid by actual opening + new and returned receipts + independently measured water/material addition = closing + outward return + retirement/waste + actual loss. Separately assign its observed period service burden with inherited vectors using documented deployment/cycles/causality; no fixed life, one asset per item, or economic fraction of gross asset mass."
      inputs:
        - cp_asset
        - inherited_vector_j
        - observed_use
      output: "asset_balance; period_asset_service"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: species_gates
      applies_to: "manufacture and service"
      rule: "Independently close total physical mass and relevant C/H/O/Si/Al/Ca/Mg and actual other elements at manufacture, FG-service and combined gates with actual air inlet/outlet species, wet/dry states, rejected material and carrier returns. Use measured mineral composition and independent reaction/phase-water evidence; do not equate firing loss with water, fit carbonate CO2 and water from one residual, or convert a COD/VOC/NOx/total-element indicator to a guessed species. Keep unidentified residuals explicit."
      inputs:
        - cp_air
        - cp_material
        - cp_residue
        - cp_asset
        - cp_release
        - cp_service
      output: "mass_element_species_residuals"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each flow"
      requirement: "Apply every native material, form, grade, route, geography, medium, type and property restriction in the full card context. Ordinary unbound auxiliary/provider data remains a disclosed gap; never substitute incompatible core identity."
      evidence: "Full native records and actual supply specification"
    - id: dq_coverage
      applies_to: "all actual stages"
      requirement: "Retain failures, zero output, start/stop, idle, cleaning, repairs and each firing; map every ID to raw records and inherited exchange vectors. Missing history/speciation is unknown and cannot be labelled pass."
      evidence: "Representative-period raw logs stock and cycle history"
    - id: dq_measure
      applies_to: "each raw observation"
      requirement: "Use calibrated instruments and independent density/moisture/chemistry/enthalpy evidence, stated detection limits and raw units. No illustrative manufacturer’s quantity or native secondary coefficient is a foreground measurement."
      evidence: "Calibration samples analytical basis and uncertainty"
    - id: dq_cohort
      applies_to: "manufacture and services"
      requirement: "Keep design, part assembly, first release, original FG cohorts, H, Q/Qc, packaging and asset physical balances separately traceable before consolidation."
      evidence: "Unique IDs gross movements and inherited vectors"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference and output"
    rule: "Verify one complete qualified ceramic-only figurine and exact count/property/unit; finished_figurine uniquely selects the Product output. Qualifiers and actual first-release tests must all be supplied; no unknown core identity may be treated as usable."
    source_ids:
      - meissen-white-lion
      - meissen-figurine-assembly
      - meissen-firing
  - rule_id: v_complete
    applies_to: "actual route"
    rule: "Check complete raw-to-release operations and each real heat source/firing plus whole-formulation purchase once. Actual extra inputs/waste/species need atomic rows; no apparently absent zero can conceal an unmeasured exchange."
    source_ids:
      - meissen-raw-preparation
      - meissen-figurine-assembly
      - meissen-glazing
      - meissen-firing
      - jrc-ceramic-bref-2007
  - rule_id: v_denominator
    applies_to: "all exchanges"
    rule: "Check raw numerator conversion and justified attribution precede the sole final_exchange division. Q includes already-released closing FG without deducting its manufacturing vector. Services use original Qc and H; no Q+closingFG double output, current-period service denominator or Q0 unit result."
    source_ids:
      - jrc-ceramic-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: v_physical
    applies_to: "manufacture FG combined"
    rule: "Check independent mass and relevant element/species closure, free/structural/reaction water, carbonate gas, air constituents and actual heat-carrier returns. All gross packaging and asset bridges must close before economic allocation. Residual or unknowns require investigation, not an invented species or zero."
    source_ids:
      - jrc-ceramic-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: v_allocation
    applies_to: "shared burdens"
    rule: "Verify dedicated/virtual subdivision, exchange-specific determining physical causality and only then documented genuine residual market value at the same actual process gate/state/period. Do not infer approval from a numerical schema or engineering pass."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Only compatible complete white-porcelain-figurine manufacturing inventory and separately labelled observed services"
  allowed_use: "Site/design/route-specific attributional production accounting with complete upstream links and stated Q/Qc/H; screening with uncertainty explicitly disclosed"
  excluded_use: "Automatic CPC coverage or methodology approval; equal decorative-service comparison; tableware/sanitary/electrical ceramics; resin/metal/electronic assemblies; unsupported use life or net-delivery accounting; per-kg or area claims without a separately evidenced conversion"
  required_metadata: "All Section 3 qualifiers plus original records protocol IDs upstream provenance and full normative context"
  required_quality_disclosure: "Measurement and identity/provider gaps; inherited raw/WIP/FG/asset vectors; service horizon completeness; species/density/heat uncertainty; physical residuals and actual allocation decisions"
  update_trigger: "Changed body/glaze/mark formulation or mould/assembly/firing route; actual extra decoration/component; supplier/native restriction change; quality gate or cohort/stock boundary change"
data_sources:
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission, Ceramic Manufacturing Industry BREF, August 2007, §2.3.6 pp.64–70; figures 2.22–2.23 and tables 2.15–2.20. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "Independent ceramic material preparation, forming, drying, actual firing/decoration alternatives, subsequent finishing/QC/packaging and environmental streams. Qualitative context only; not measured figurine recipe, yield, kiln demand or allocation authority."
  - id: "meissen-raw-preparation"
    type: "literature"
    reference: "MEISSEN, Kaolin & the Mine; https://www.meissen.com/en/craft/kaolin"
    used_for: "Primary washing/settling and blending of kaolin with ground feldspar/quartz to actual paste/slip; upstream preparation boundary. No proportions or future site quantities."
  - id: "meissen-figurine-assembly"
    type: "literature"
    reference: "MEISSEN, Demonstration Workshop; https://www.erlebniswelt-meissen.com/en/experience/demonstration-workshop"
    used_for: "Primary multipart figurine moulding and slurry assembly/retouching, hand details and underglaze marking; onglaze turpentine/extra-firing and round tableware context are adjacent excluded routes. Not one SKU bill of materials."
  - id: "meissen-glazing"
    type: "literature"
    reference: "MEISSEN, Glazing; https://www.meissen.com/net/craft/glazing"
    used_for: "Primary transparent glaze raw-material family and delicate-figurine spray mist/tracing tint versus tableware dipping; actual formulation/medium must be independently collected."
  - id: "meissen-firing"
    type: "literature"
    reference: "MEISSEN, Bisque & Glaze Firing; https://www.meissen.com/int/craft/firing"
    used_for: "Primary drying/biscuit then mark/glaze/glost sequence and final fired surface; not an adopted kiln temperature, time, fuel or shrinkage default."
  - id: "meissen-white-lion"
    type: "literature"
    reference: "MEISSEN, Meissen Atelier Lion, Art.-No. 000001-78018-1; https://www.meissen.com/en/000001-78018-1.html"
    used_for: "Primary real white porcelain animal-sculpture terminal and gift-box context. Product-specific listed mass/dimensions and adjacent coloured/stoneware recommendations are not conversions or scope expansion."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "JRC ILCD Handbook, General guide for LCA — Detailed guidance, first edition March 2010, §7.9.3 pp.257–258 and referenced subdivision context; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation only when required: dedicated/virtual subdivision and exchange-specific determining physical causality before genuine residual actual-gate/state market value. Not industrial manufacturing data or automatic recycling credit."
