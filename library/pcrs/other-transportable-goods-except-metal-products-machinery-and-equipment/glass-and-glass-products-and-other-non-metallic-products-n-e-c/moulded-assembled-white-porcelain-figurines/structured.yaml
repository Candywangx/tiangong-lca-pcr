system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Include every actual raw preparation, mould preparation/use, part forming, slurry joining/retouching, drying, mark/glaze preparation/application, firing/refiring, finishing, testing, controls and support operation. Record actual heat source per stage; a manufacturer case is not a fixed factory recipe."
      source_ids:
        - meissen-raw-preparation
        - meissen-figurine-assembly
        - meissen-glazing
        - meissen-firing
        - jrc-ceramic-bref-2007
    - rule_id: b_whole
      applies_to: "supplied formulations"
      rule: "Purchase each complete supplied slip/glaze/mark/tint/fuel/lubricant once, including carrier and additives. Assays and water are subledgers. On-site mixing instead records every real external ingredient, energy and loss; no duplicate internal formulation purchase. A whole purchased kiln/mould and its embodied lining/supports/initial fluids are acquired once; component rows only record independent supply or actual repairs, with disjoint parent/child masses and service burdens."
      source_ids:
        - meissen-raw-preparation
        - meissen-figurine-assembly
        - meissen-glazing
        - jrc-ceramic-bref-2007
    - rule_id: b_first_release
      applies_to: "manufacturing numerator"
      rule: "Include failed/zero-output/start-stop/idle/cleanup/rework loads and opening/closing raw, unreleased WIP and unassigned non-WIP-store inherited burden vectors per exchange. Closing already-released FG is in Q: never subtract its manufacture from the numerator or add it as another production output."
      source_ids:
        - jrc-ceramic-bref-2007
    - rule_id: b_services
      applies_to: "original released cohorts"
      rule: "Keep original manufacturing history; post-release actual packing, storage, dispatch, returns, retest, cleanup and rework increments belong to original cohort Qc and observed horizon H. No retest/return/re-shipment creates Q. A service with Qc=0 has no unit result. Cancel internal Q hand-offs on consolidation."
      source_ids:
        - jrc-ceramic-bref-2007
        - meissen-white-lion
    - rule_id: b_atomic
      applies_to: "all exchanges"
      rule: "Every real additional material, applied colour/medium, fuel, chemical, cooling fluid, waste and elemental species must be added as its own specific row with actual identity and collection. Do not hide actual exchanges as zero, other, a selector or total indicator. Demonstrated absence, missing measurement and measured zero differ. Incompatible new decoration requires scope extension."
      source_ids:
        - jrc-ceramic-bref-2007
        - meissen-glazing
        - meissen-figurine-assembly
    - rule_id: b_gates
      applies_to: "physical balances"
      rule: "Close manufacturing, FG-service and combined wet/dry/material/element/species physical gates before allocation; internal transfers cancel once. Gross air species and gross asset/packaging physical masses are not economically scaled. External Product returns, waste transfers and direct environmental emissions differ."
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
