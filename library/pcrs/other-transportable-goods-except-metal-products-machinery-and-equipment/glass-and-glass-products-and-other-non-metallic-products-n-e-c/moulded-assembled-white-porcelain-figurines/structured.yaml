      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_reference | reference and output | Verify one complete qualified ceramic-only figurine and exact count/property/unit; finished_figurine uniquely selects the Product output. Qualifiers and actual first-release tests must all be supplied; no unknown core identity may be treated as usable. | `meissen-white-lion`; `meissen-figurine-assembly`; `meissen-firing` |\n| v_complete | actual route | Check complete raw-to-release operations and each real heat source/firing plus whole-formulation purchase once. Actual extra inputs/waste/species need atomic rows; no apparently absent zero can conceal an unmeasured exchange. | `meissen-raw-preparation`; `meissen-figurine-assembly`; `meissen-glazing`; `meissen-firing`; `jrc-ceramic-bref-2007` |\n| v_denominator | all exchanges | Check raw numerator conversion and justified attribution precede the sole final_exchange division. Q includes already-released closing FG without deducting its manufacturing vector. Services use original Qc and H; no Q+closingFG double output, current-period service denominator or Q0 unit result. | `jrc-ceramic-bref-2007`; `jrc-ilcd-allocation-2010` |\n| v_physical | manufacture FG combined | Check independent mass and relevant element/species closure, free/structural/reaction water, carbonate gas, air constituents and actual heat-carrier returns. All gross packaging and asset bridges must close before economic allocation. Residual or unknowns require investigation, not an invented species or zero. | `jrc-ceramic-bref-2007`; `jrc-ilcd-allocation-2010` |\n| v_allocation | shared burdens | Verify dedicated/virtual subdivision, exchange-specific determining physical causality and only then documented genuine residual market value at the same actual process gate/state/period. Do not infer approval from a numerical schema or engineering pass. | `jrc-ilcd-allocation-2010` |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
