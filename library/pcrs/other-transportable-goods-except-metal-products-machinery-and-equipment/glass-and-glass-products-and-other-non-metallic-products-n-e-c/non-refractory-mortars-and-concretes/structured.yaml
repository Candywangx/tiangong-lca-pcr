allocation_rules:
  - rule_id: attributional_hierarchy
    applies_to: "all inventory rows"
    rule: "Use this hierarchy only for the declared attributional allocation situation. First assign dedicated observations and use real or virtual subdivision to isolate the function. For remaining multifunctional exchanges establish the exchange-specific determining physical causal relationship and quantitative driver; do not choose mass or energy merely for convenience. Only the genuine residual common process uses contemporaneous market value of actual co-functions at the same process gate, condition and quantity basis; justify adjusted prices and uncertainty. No fixed share, optional physical/economic choice or automatic system-expansion credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: waste_is_not_credit
    applies_to: "mix; controls; services"
    rule: "Returned concrete, recovered water, dust and rejected/test concrete are not automatic coproducts. Retain source manufacturing and real recovery/treatment burdens, physical gross exits and carryover. A genuine independent other cohort/function and a defensible allocation/handover decision are required for one outward burden-vector transfer; a positive scrap price is insufficient. Recovered material used within this gate is one internal circulation, not another purchase or a negative virgin input."
    source_ids:
      - epa-concrete-washout-2012
      - jrc-ilcd-2010
