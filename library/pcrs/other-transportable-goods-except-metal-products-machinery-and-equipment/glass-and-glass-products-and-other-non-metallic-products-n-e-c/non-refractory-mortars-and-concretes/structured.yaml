system_boundary:
  rules:
    - rule_id: complete_route
      applies_to: "all processes"
      rule: "Carry one compatible upstream burden for each whole supplied material plus actual inbound legs not already included. Whole cement is one purchase: clinker, gypsum, CaO and cement assay constituents are not additional purchases. Included packaging ingress has one supplier/foreground upstream owner. Include real test/QC resources and controls; do not replace manufacture with finished-concrete handling. Add every actual omitted single material, formulation, fuel, water phase, packaging component, waste and measured emitted species before dataset completion."
      source_ids:
        - epa-concrete-batching-2012
        - nrmca-quality-2022
    - rule_id: fresh_first_release
      applies_to: "mix; services"
      rule: "Q is the independently weighed net wet concrete uniquely first released at the declared plant discharge/QC interface for this cohort. Record approved mixture, mixing completion and applicable fresh tests before release. Strength is a later sample result and is not assumed verified in fresh Q. Sampling/reject mass removed before release is excluded from Q but retains loads. Closing released FG is already in Q: do not add it as another production output or subtract its manufacturing vector as WIP. Retest, delivery, transfer, return and permitted postrelease work produce no new Q."
      source_ids:
        - nrmca-quality-2022
        - jrc-ilcd-2010
    - rule_id: cohort_vectors
      applies_to: "all inventory rows"
      rule: "Retain opening and closing inherited burdens separately for every exchange and raw/WIP/unassigned non-WIP store. A_i carries opening inheritance plus actual attributable current loads plus genuine inward burden transfers less still-unreleased closing stores and justified once-only outward transfers. All failed/zero-output/idle/startup/cleanup/rework and waste-treatment loads remain. A waste sale or removal alone never justifies a transfer to another function. Stock-corrected consumption is not corrected twice. Released FG is outside this manufacturing closing subtraction."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: actual_services
      applies_to: "services"
      rule: "Retain actual incremental within-plant postrelease holding/agitation, loading, dispatch, return reception, follow-up QC and permitted rework under original cohort Q_c and observed horizon h; no guessed future service. Already performed service is not removed because FG remains in stock; only unused/unassigned service stores carry forward. Offsite customer transport, placement and curing are outside this plant-gate dataset; any separately reported transport module needs its actual route and fuel/emission rows. Do not normalize by net deliveries. Combine modules by cancelling internal first-release Q and matching internal return/rework transfers."
      source_ids:
        - nrmca-quality-2022
        - epa-concrete-washout-2012
        - jrc-ilcd-2010
    - rule_id: returns_permission
      applies_to: "mix; controls; services"
      rule: "Measure each returned load in its actual wet state, age, additions, contamination, loss and hydration condition; retain original delivery/lot links without assuming returned mass equals original delivered mass. Reuse or postrelease adjustment requires manufacturer/specification permission, documented additions, complete mixing and postwork tests/acceptance/disposition. Hardened or contaminated material is not assumed restored to fresh concrete. Actual internal recovered water/aggregate has its measured composition and inherited vector; cancel internal transfer once and never purchase it again or grant avoided-production credit. Independently document actual elapsed age, temperature, hydration/setting/plasticity and continued same-mixture permission over the observed interval. No universal workable/storage time is supplied. Material that has set, expired its actual specification permission or hardened cannot remain labelled usable fresh FG or be presumed restored by water/agitation. Record the actual changed-state stock, testing/rejection/recovery/disposition and all new/removed material/water; original first-release Q and historical burdens stay unchanged. Permission/specification, postwork tests, acceptance and disposition govern authorization and continuing qualification ONLY. They never erase actually incurred unauthorized, failed or rejected work material/water/energy/loss/treatment or historical burdens. F_to/F_back and specific physical outlets record ALL real work regardless of approval or test outcome; assign once to the real original/new cohort, without reopening first Q. Held FG and a distinct repair-WIP stock are disjoint once. Qualification still depends on actual age/hydration/plasticity/specification and disposition evidence, never presumed restoration by water/agitation."
      source_ids:
        - nrmca-quality-2022
        - epa-concrete-washout-2012
        - jrc-ilcd-2010
    - rule_id: water_species_physical
      applies_to: "all processes"
      rule: "Close gross wet mass and relevant C/H/O/N/S/Ca/Si balances independently of LCI attribution. Whole wet sand/gravel and supplied formulations include their carrier water; absorbed/free water and dry solids are subledgers. Separately observe mixing/wash water, vapour, liquid purge, water retained in wet residues, free water and chemically bound hydration water. Hydration transfers internal water into phases without creating external water; no fixed hydration degree or residual fitting of two unknowns. Each actual exhaust/air species and receiving medium is separate; total NOx/VOC/COD or total PM is not a chemical species. Purchased electricity and diesel retain their distinct energy/mass units, with fuel heat as a linked subledger rather than a second purchase. No boiler, steam or condensate export is assumed. Actual introduced steam/heat needs distinct carrier mass, state/enthalpy, supplier ownership and real liquid-return rows. If external heat/steam/hot water or process/cooling-water return actually exists, independently meter carrier/return gross kg, liquid/vapour phase, actual temperature/pressure/enthalpy and each real Product return; never derive mass from MJ, default density/state or a net-return difference. Heat MJ and water/steam mass are linked views of ONE actual supplier transaction with ONE upstream burden owner; invent no boiler/thermal supply when absent. Manufacturing physical incoming/returns use V/Q and only actual postrelease service uses original Q_c/h. Incoming/return cards add no second water/heat purchase/treatment charge or negative credit; contaminated liquids and direct environmental releases need their real Waste/Elementary interfaces."
      source_ids:
        - epa-concrete-batching-2012
        - nrmca-quality-2022
        - epa-concrete-washout-2012
    - rule_id: packaging_assets
      applies_to: "all processes"
      rule: "For each actual paper sack, PE-LD liner and wooden pallet: opening empty plus attached WIP/FG plus reusable stock plus external supply plus external returns received = closing corresponding stocks plus packaging on gross physical shipments plus outward returns plus waste. Include supplier-included real ingress even if it remains in closing stock; its upstream owner pays once. Internal reuse cancels without new procurement or product Q. Assets, spare/new/old repair pieces and installed fluids likewise retain full wet physical opening + real inward supply + X_in = closing + retirement/returns/waste + X_out. X only deduplicates another inward/outward term, never cancels new ingress retained in stock. Physical quantities are not reduced by economic shares; capital/service burden is assigned separately from physical stock without assumed lifetime or one whole machine per kg. Record actual purchases P, first non-purchased external receipts I, external-return receipts ER, gross shipment S, empty outward returns EO and waste W as independent directions per material. Actual repair Radd/Rremove and water H2Oin/H2Oout require their own specific exchanges: disjoint opening pools+P+I+ER+Radd+H2Oin = closing pools+S+EO+W+Rremove+H2Oout. Deduplicate the same material/water only against another same-side flow term of this bridge; closing wetstock, opposite directions or another atomiccard do not erase real retained influx. Whole wetarticles carry their included water/material once. Independently measure drymaterial, free/absorbed water, actual added and removed parts/water and physical asset/fluid custody; no assumed package repair, life or weight.  Apply packaging_receipt_basis to distinguish each actual P/I/ER receipt."
      source_ids:
        - nrmca-quality-2022
        - jrc-ilcd-2010
    - rule_id: packaging_receipt_basis
      applies_to: "each packaging receipt"
      rule: "For every actual packaging article, classify each whole external receipt once. P is paid procurement, including paid packaging bundled with another supply without a separate invoice. I is all first non-purchased external ingress: standalone gifts, loans, rental or pool receipts and non-purchased supplier-attached packaging; supplier attachment is only an I subset. ER requires this same item or an auditable configuration-matched batch linked to this site's own prior outward record; custody or another party's use alone does not prove a return. P, I and ER are disjoint. Existing I cards and their raw protocols cover the same physical article for every such I origin; no new material, UUID or quantity is presumed. X_in/X_out remain disjoint material/water-change terms, never a substitute for whole-article receipt. Retain gross physical quantity, owner/custodian, payment or non-purchase basis, origin, prior-outward link where required, native state/unit and inherited manufacturing/service vector. Non-purchase is neither a new manufacture nor automatic zero burden: attribute actual used service and incremental transport/handling once to its proper original cohort and denominator, retaining unused service separately without a default lifetime or credit. This is the declared conserving foreground accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-2010
