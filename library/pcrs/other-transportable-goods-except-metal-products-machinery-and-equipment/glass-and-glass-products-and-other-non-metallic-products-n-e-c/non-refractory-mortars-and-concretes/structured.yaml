  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert original observations once to each row native extensive unit before allocation. Integrated measurements are summed once; only true rates are integrated over measured time. Electricity kWh * 3.6 = MJ. Actual gas/liquid mass needs independently applicable concentration/density and temperature/pressure/wet-dry conditions; no second time factor for integrated volume, no generic water density for oil/gas, and no secondary-property density or kg/item. Keep energy, mass, volume and count separate."
      inputs:
        - raw_observations
        - actual_states
        - independent_densities
        - measured_intervals
      output: "converted_raw"
      source_ids:
        - epa-concrete-batching-2012
        - nrmca-quality-2022
    - id: manufacture_vector
      applies_to: "all inventory rows"
      rule: "A_i = B_open_i + C_i + T_in_i - B_close_i - T_out_i. Every term is the same-unit inherited exchange vector after dedicated assignment, subdivision and justified exchange-specific allocation. C_i retains failed batches, zero output, start/stop, idle, test, cleanup, recovery and treatment. B_close_i contains only still-unreleased raw/WIP and unassigned non-WIP stores, never released FG. T_out_i requires a real other cohort/function and one justified burden handover; physical waste/scrap sales alone do not qualify. Do not subtract the same stock-corrected consumption twice. Explicitly declare gross receipt/occurrence versus already-stock-adjusted net issue/consumption and the corrections already included for every exchange. Apply only stock adjustments not included yet, retaining independent opening/closing raw/WIP/unassigned non-WIP physical quantities and each complete exchange history, including consumed opening-material upstream burdens. This equation determines assigned burden vectors ONLY, not ledger-only gross physical quantities. For physical asset/new-old-part/installed-fluid/waste and actual thermal-carrier or process-water Product incoming/return cards, retain full native-unit V_i independently; never replace or scale the real gross leg with B_open+C+T_in-B_close-T_out, an economic/service share or old manufacturing history. Actual assigned capital-service/operation/supply burdens retain their separate per-exchange vectors, with one acquisition/supplier scope and no duplicate charge."
      inputs:
        - B_open_i
        - C_i
        - T_in_i
        - B_close_i
        - T_out_i
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: service_vector
      applies_to: "services"
      rule: "A_service_i_c_h contains only actual incremental postrelease services/treatment assigned to original cohort c over observed horizon h, with original first-release Q_c and manufacture vector retained separately. Use dedicated logs or the allocation hierarchy. Only unused/unassigned service stores carry forward; performed service remains even if FG stays in closing stock. Rework retains permission, tests and disposition and never creates fresh Q. For FG receipt/return/dispatch and packaging physical movement cards, A_service_i_c_h means the full actual measured gross specific leg after native-unit conversion, not inherited manufacturing/purchase burden, a second stock correction or an economic burden share. Report ledger-only physical results separately from actual supplier/operation burdens; normalization creates no new provider purchase or credit. Preserve independently matched original-delivery quantities distinct from actual changed wet returns."
      inputs:
        - original_cohort
        - Q_c
        - h
        - actual_service_records
        - unused_service_vectors
      output: "A_service_i_c_h"
      source_ids:
        - nrmca-quality-2022
        - epa-concrete-washout-2012
        - jrc-ilcd-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "u_i = A_i / Q; u_i is the exchange amount per 1 kg reference flow. For a separately reported service use A_service_i_c_h and Q_c in this same operation. Q must be positive; Q = 0 retains all original burdens and produces no unit result. This is the only division by the product denominator. Cards and collection aggregation refer to this same result without another division. first_release_concrete is exactly 1 kg net wet first-released concrete. Ledger-only physical FG/package movement numerators are complete measured legs with no burden-vector addition, second stock correction or economic scaling, using the actual owning Q or original Q_c once. Actual already-performed holding/agitation/QC/loading services remain at their original cohort Q_c and observed h even when goods are held at closing. The full-gross-physical exception also applies to actual assets, parts, fluids, wastes and thermal-carrier/process-water Product incoming/returns, not only FG/packaging. Their same once-displayed result is V_i/Q or V_i/Q_c for actual original-cohort service, after conversion to EACH native extensive unit, with independent wet mass for physical reconciliation. V_i is not a stock-burden difference, second stock correction, allocated share, old manufacture/acquisition/treatment addition or return credit. Actual performed service and supply burdens remain separately normalized once under their real original cohort and observed h; listing gross legs never erases them."
      inputs:
        - A_i
        - Q
        - A_service_i_c_h
        - Q_c
        - cp_first_release_concrete
        - V_i
      output: "u_i"
      source_ids:
        - jrc-ilcd-2010
    - id: manufacture_physical_gate
      applies_to: "mix; controls; assets"
      rule: "Manufacture gross wet mass: opening raw/WIP/unreleased stores/packaging/physical assets/installed fluids + actual external physical ingress + original-FG material withdrawn for actual work F_to = corresponding closing unreleased/in-place wet stocks + first-release net wet Q + actual attached packaging transfer P_Q + original-cohort material returned after work F_back + actual other external solid/liquid/gas exits. Include atmospheric species, supplier-included packages, new repair pieces and water even when retained in closing stock. Cancel matched internal washout/recovery transfers; no economic shares scale this equation. Electricity and heat are separate energy ledgers."
      inputs:
        - opening_manufacture_stocks
        - external_ingress
        - F_to
        - closing_manufacture_stocks
        - Q
        - P_Q
        - F_back
        - external_exits
      output: "manufacture_gross_balance"
      source_ids:
        - epa-concrete-batching-2012
        - nrmca-quality-2022
        - epa-concrete-washout-2012
    - id: fg_physical_gate
      applies_to: "services"
      rule: "FG concrete-material mass: opening released FG + Q + actual physical customer returns R + F_back + X_in = closing released FG + gross dispatch G + F_to + actual FG waste + consumed samples + X_out. X records actual additional water/material or genuine exits only when not already in another term; retained added water is still real ingress and is also in complete closing wet mass. Returned R is measured in its current state and is not presumed the original delivery reverse. Packaging follows its own complete component ledger. For combined gates cancel Q, P_Q, F_to/F_back and matched internal packaging transfers; retain external returns, added water and real losses."
      inputs:
        - opening_FG
        - Q
        - R
        - F_back
        - X_in
        - closing_FG
        - G
        - F_to
        - FG_waste
        - samples
        - X_out
        - P_Q
      output: "FG_and_combined_gross_balances"
      source_ids:
        - nrmca-quality-2022
        - epa-concrete-washout-2012
    - id: water_phase_check
      applies_to: "all inventory rows"
      rule: "Independently measure total wet material, dry mineral solids, free/absorbed water, bound water by actual hydrate phases, gas humidity, water vapour, liquid outlets and retained wet residue. Hydration conserves total mass while changing phases; source cement composition does not prove hydration degree. Resolve actual chemical reaction and oxygen/carbon transfers separately. Check water and relevant elements using independent evidence; one residual cannot solve both evaporation and hydration. Do not turn COD/VOC/total carbon or PM size into a specific chemical mass."
      inputs:
        - wet_materials
        - dry_solids
        - free_water
        - independent_hydrate_phases
        - humidity
        - vapour
        - liquid_outlets
        - retained_water
        - species_elements
      output: "water_phase_and_element_check"
      source_ids:
        - epa-concrete-batching-2012
        - nrmca-quality-2022
        - epa-concrete-washout-2012
    - id: asset_service
      applies_to: "assets"
      rule: "Keep full actual machine/part/fluid physical receipts, installed/spare stocks, removals, moisture and disposal in their native units plus independently measured wet mass. Assign only capital-manufacture service burden using justified actual usage/capacity records and exchange-specific causality; retain the measured driver and denominator. No fixed lifetime, guessed kg per item or entire machine per kg concrete. New replacement and maintenance materials are real whole supplies; unused stock carries its vector once without erasing physical influx."
      inputs:
        - asset_register
        - actual_usage
        - measured_service_driver
        - driver_denominator
        - physical_mass
        - unused_stock_vectors
      output: "capital_service_burden"
      source_ids:
        - nrmca-quality-2022
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and every exchange"
      requirement: "Retain all native restrictions, complete qualifiers, whole formulation/article state, actual origin and compatible provider. A family UUID is not proof of supplier equivalence."
      evidence: "Native identity support; supplier certificates; whole-article records"
    - id: dq_raw
      applies_to: "every raw field"
      requirement: "Retain raw originals before conversion, allocation and normalization, including calibration, timestamps, stock boundaries, density state, detection limits and uncertainty. Future foreground measurements are requirements, not claimed collected numbers."
      evidence: "Meter/scale records; sampling methods; independent tests"
    - id: dq_scope
      applies_to: "all processes and periods"
      requirement: "Include unsuccessful and zero-output intervals, idle/start-stop, cleanup, tests, stocks, recovery, actual air/aqueous/solid species and original-cohort services; document observed absence and every added atomic exchange."
      evidence: "Whole-site/cohort reconciliation; original ledgers"
    - id: dq_source
      applies_to: "external sources and rules"
      requirement: "EPA supports process/control and washout distinctions, not allocation or a universal mixture/factor. NRMCA supports producer QC and perishable fresh state; the sample QC plan is illustrative and contains a slump-method inconsistency, so use body C143 context and actual applicable methods rather than copying sample C173. ILCD is used only for the attributional hierarchy. Technical sources are independent documents, not multiple registrations of one source."
      evidence: "Source context; adjacent alternatives; source-specific applicability appraisal"
    - id: dq_bilingual
      applies_to: "both renderings and projection"
      requirement: "Preserve every row/rule/protocol ID, official Chinese UUID name, source field/list, qualifier, formula input/output, physical gate and full description. Aligned translation is not reviewed translation or scientific approval."
      evidence: "Full-field bilingual and raw-to-typed audit"
validation_rules:
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Require complete reference qualifiers and atomic physical identity with original native restrictions. Reference-family use must remain plant-mixed hydraulic fresh concrete; reject substituted asphalt, installed or precast product identity. Providers require independent route/form/grade/geography/year/gate compatibility. Missing auxiliary UUIDs are visible unresolved identities and never generic collection bindings."
    source_ids:
      - epa-concrete-batching-2012
      - nrmca-quality-2022
  - rule_id: validate_release
    applies_to: "mix; services"
    rule: "Check unique first-release IDs, weighed Q and sampling/reject exclusions. Verify actual permitted mix and fresh QC; disclose later strength findings without creating a second first release. Q=0 retains all real burdens and yields no normalized result. Closing released FG is neither second output nor manufacturing burden subtraction."
    source_ids:
      - nrmca-quality-2022
      - jrc-ilcd-2010
  - rule_id: validate_balances
    applies_to: "all processes"
    rule: "Reconcile manufacture, FG service and combined physical gates, full wet inventories, every packaging balance and every inherited exchange vector. Keep independent water-phase/species/element observations; report unresolved closure, detection limits and uncertainty rather than claim success from one residual. Verify no source/constituent/provider double purchase, no repeated normalization and no waste-sale burden deletion."
    source_ids:
      - epa-concrete-batching-2012
      - nrmca-quality-2022
      - epa-concrete-washout-2012
      - jrc-ilcd-2010
  - rule_id: validate_completeness
    applies_to: "all processes"
    rule: "Before using a completed dataset resolve real core terminal/method gaps; obtain actual foreground quantities, permissions, all additional exchanges and compatible upstream data. An absent conditional exchange requires observed absence evidence, not a convenient zero. A recipe or thermal-conditioning change outside scope requires reassessment. Engineering checks establish neither scientific approval nor publication or classification mapping acceptance."
    source_ids:
      - epa-concrete-batching-2012
      - nrmca-quality-2022
      - epa-concrete-washout-2012
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "foreground manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Selected fresh concrete supply at first plant quality release with compatible upstream providers and separately disclosed observed plant services"
  excluded_use: "Installed construction, cured/precast articles, generic mortar coverage, EPD approval, unqualified strength/lifetime equivalence or carbon-credit claims"
  required_metadata: "site and reporting period; ordinary Portland-cement binder specification and whole supplied cement ownership; natural fine-sand and coarse-gravel origins and grading; actual separately supplied ingredients and supply forms; no deliberate supplementary cementitious material or chemical admixture in this selected route; central complete wet mixing before first release; no steel reinforcement or manufactured component; actual mixture designation and permitted adjustments; aggregate free moisture and absorption; measured wet net first-release mass and timestamp; fresh slump and air content and temperature and density tests where required by the actual specification; later strength-test status without claiming cured strength at sale; water phases and hydration evidence; unique first-release lot/cohort and original Q_c; opening/closing raw and WIP inherited exchange vectors; released FG stock and true return state; gross shipments and no repeat production; service horizon h and actual incremental services; electricity voltage and supply geography; each fuel and atmospheric species where actually used; packaging ingress and upstream ownership; asset and installed-fluid stocks; actual supplier and receiving media"
  required_quality_disclosure: "Actual foreground coverage; unresolved identities/providers; failed/zero-output loads; stock/return/vector closure; permissions; source limitations; observed service horizon; pending independent review"
  update_trigger: "Actual mixture, ingredient/supply form, process, terminal, water phase, provider, native restriction, measurement method or quality specification changes"
data_sources:
  - id: "epa-concrete-batching-2012"
    type: "official_guidance"
    reference: "US EPA, AP-42 11.12 Concrete Batching, June 2006 with January 2012 editorial corrections; https://www.epa.gov/sites/default/files/2020-10/documents/c11s12.pdf"
    used_for: "Raw constituents, central-mix manufacture, contrasting truck/precast routes, dust controls and emission-factor limitations; no recipe or factor adopted"
  - id: "nrmca-quality-2022"
    type: "handbook"
    reference: "NRMCA, Quality Control Guide for Ready-Mixed Concrete Producers, April 2022; https://www.nrmca.org/wp-content/uploads/2022/04/Quality_Guide.pdf"
    used_for: "Fresh unfinished/perishable terminal, receipt/batching/central-mixer QC, moisture and density/yield tests, traceability, adjustments and nonconformance; example plan is not a universal plant prescription"
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice Concrete Washout, EPA-833-F-11-006, February 2012; https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Contained washout, actual returns, liquid/solid separation and recovery with specification restrictions; construction-site examples are limited to actual plant interfaces and do not authorize credit"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, first edition March 2010, sections 7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional dedicated/virtual subdivision, determining exchange-specific physical causality and residual same-gate economic allocation; cohort vector attribution is the declared foreground implementation"
