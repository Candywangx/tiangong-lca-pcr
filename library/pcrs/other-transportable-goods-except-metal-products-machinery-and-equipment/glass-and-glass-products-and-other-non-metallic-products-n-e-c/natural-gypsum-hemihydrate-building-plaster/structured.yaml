system_boundary:
  rules:
    - rule_id: route_boundary
      applies_to: "all processes"
      rule: "Carry supplier burdens of natural gypsum, utilities, packaging, maintenance and assets into the complete manufacture route. The delivered natural-gypsum identity already includes quarry-to-plant delivery; any additional delivery must identify its uncovered leg. Do not add a rotary dryer, kettle, autoclave, boiler or steam system merely because it appears in another route. Keep actual controls, all failures, zero-output intervals, startup/shutdown, idling, cleaning, spills, samples and permitted rework. Add each real omitted material, energy carrier, water phase, waste and emitted species as an atomic row with actual property/unit and supplier/fate."
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
        - grenzebach-hammer-mill
    - rule_id: first_release_gate
      applies_to: "release; services"
      rule: "Q is the independently weighed total net powder in uniquely first-accepted bagged lots during the production cohort. First testing and bagging precede Q. A first-released lot in closing FG is already in Q; never subtract its manufacturing burden as closing WIP or add closing FG again as production output. Delivery, stock transfer, return and retest do not generate new Q. Retain after-release warehousing, handling, repacking and dispatch as actual incremental services attributed to original cohort Q_c over a disclosed horizon h; no new manufacture burden or guessed service for an unobserved future. A combined dataset cancels the internal Q transfer. This is not a net-delivery denominator."
      source_ids:
        - knauf-stuckgips-2023
        - jrc-ilcd-2010
    - rule_id: stocks_vectors
      applies_to: "all inventory rows"
      rule: "Retain per-exchange inherited vectors for opening/closing raw materials, WIP and unassigned non-WIP stores. Manufacturing A_i carries opening inherited burdens plus current attributable loads and real inward burden transfers, less closing still-unreleased stocks and justified once-only outward transfers to a genuinely different cohort/function. Released FG never enters that manufacturing closing subtraction. Failed products, samples, broken bags, wastes, sale and removal retain originating manufacturing and treatment burdens unless an independently justified transfer applies; a physical output is not itself that justification. Do not subtract a mass scalar from a burden vector. Independently retain opening/closing physical quantities for each raw, WIP and unassigned non-WIP store as well as every inherited exchange vector. Declare whether each source quantity is gross receipt/pool entry before stock adjustment or already net consumed; identify each correction already included and never apply the same raw-stock correction twice."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: mass_phase_energy
      applies_to: "receipt; calcine; finish; controls; release; services"
      rule: "Close gross physical mass and relevant Ca/S/H/O/C/N balances at manufacture, FG service and combined gates independently of LCI allocation. Measure as-received feed and phase/free-moisture assays, all wet stocks, dry powder and true species separately. Pure ideal dihydrate-to-hemihydrate stoichiometry is only a phase check when independently justified, not a yield or two-unknown residual solver. Separately observe free-water evaporation, crystal-water release/uptake, combustion water, ambient humidity, condensate, liquid purge and water retained in solids. Gypsum dehydration is not invented chemical reaction water or automatic exported steam. Measure natural-gas carrier mass/composition and thermal MJ separately without two upstream purchases; electricity keeps its energy property. Actual steam/heat contracts, if introduced, require separate atomic carriers, true states, enthalpies and actual liquid returns; never copy an absent boiler."
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
        - grenzebach-hammer-mill
    - rule_id: packaging_assets
      applies_to: "release; maintenance; services"
      rule: "For each real packaging article/material retain opening empty + attached WIP/FG + reusable stock + paid purchases + first non-purchased external receipts + external returns received = closing corresponding stocks + packaging on gross physical shipments + outward returns + waste, with internal reuse cancelling. first non-purchased external ingress packaging is still real physical ingress and has one upstream burden owner; no extra purchase of already supplied components. Packaging is not net product Q or an automatic coproduct. For each asset, wear part and installed fluid retain opening + real inward supply + X_in = closing wet/in-place/spare stock + outward retirement/waste + X_out, counting X only when absent from another actual inward/outward term. Keeping new wet material in closing stock never deletes its actual ingress. Separate physical asset stocks from the current measured service-burden share; no fixed life or complete machine per kg. In the packaging bridge distinguish actual purchases P, first non-purchased external ingress I and external returns received ER from gross shipments S, outward returns EO and waste W. Add actual separately measured material/water changes X_in on the ingress side and X_out on the egress side: opening full wet stocks + P + I + ER + X_in = closing full wet stocks + S + EO + W + X_out. Internal first-release packaging transfers are reconciled once between manufacture and FG gates, not additional external receipts. Deduplicate X only against other actual incoming/outgoing FLOW terms, never opening or closing stocks: retained new water/material remains both real ingress and full closing wet mass. The same applies to actual removal and full opening mass. Water/material already included in a whole wet receipt or outflow is counted once there without duplicate X. Independently record dry components, free/bound water, source, phase, destination, actual repair permission/tests/disposition and burden histories. Before completing data, add a specific atomic exchange for every real added/removed material or water phase not already represented; no assumed repair, uptake, dry wood, wood species or residual-fitted quantity. X_in/X_out deduplicates only the same measured material/water already in another same-side incoming/outgoing FLOW term of this same bridge, never stock, opposite-direction flow or the mere existence of an atomic card. Retained new material/water remains actual influx AND full closing wet stock. Whole wet P/I includes its integral matter and water once. For assembly choose a disjoint component basis or a reconciled whole-article basis: the bought whole sack already contains supplier-integral liner/seam/glue/print; only actual separately supplied onsite additions are distinct components. The empty assembled tare equals the measured whole-bought-sack contribution plus actual added liner/thread/other matter and retained water minus actual removed/lost matter, excluding powder contents. In component mode keep each unique contribution once in stocks and S/EO/W; never use the full assembled tare as paper_sack and also add its separate liner/thread. In article mode transfer components into that article using paired measured internal handoff IDs, replace their same-gate stock/shipment figures by the reconciled article figure and cancel matched internal transfers. Integral chemical/component assays are memo subaccounts, not additional exchanges. For a single real mixed PE collection outlet, pe_waste is the one actual Waste exchange: independently measured liner and wrap source-W quantities are disjoint original subaccounts/pool withdrawals which sum to the matched outlet, with other real sources identified separately. Use total OR its disjoint partition at the same boundary, never both; no invented second outlet or duplicated treatment/provider. A genuinely separate actual outlet instead requires its own specific card before completion.  Apply packaging_receipt_basis to distinguish each actual P/I/ER receipt."
      source_ids:
        - grenzebach-hammer-mill
        - jrc-ilcd-2010
    - rule_id: supplier_ownership
      applies_to: "all supplied exchanges"
      rule: "Whole purchased preparations and supplied articles carry their complete mass and one upstream provider burden. Assays, active components, carrier water and installed-fluid content are subledgers, not second purchases. Actual onsite blending requires each purchased ingredient, real mixing energy and losses separately. Do not silently add admixtures to this unformulated-binder scope or treat substrate, pure component or raw ore identity as the complete finished product. Substantiate raw origin, native route/form/geography/type and all relevant properties before binding any later UUID."
      source_ids:
        - bvg-stuckgips-2022
        - jrc-ilcd-2010
    - rule_id: packaging_receipt_basis
      applies_to: "each packaging receipt"
      rule: "For every actual packaging article, classify each whole external receipt once. P is paid procurement, including paid packaging bundled with another supply without a separate invoice. I is all first non-purchased external ingress: standalone gifts, loans, rental or pool receipts and non-purchased supplier-attached packaging; supplier attachment is only an I subset. ER requires this same item or an auditable configuration-matched batch linked to this site's own prior outward record; custody or another party's use alone does not prove a return. P, I and ER are disjoint. Existing I cards and their raw protocols cover the same physical article for every such I origin; no new material, UUID or quantity is presumed. X_in/X_out remain disjoint material/water-change terms, never a substitute for whole-article receipt. Retain gross physical quantity, owner/custodian, payment or non-purchase basis, origin, prior-outward link where required, native state/unit and inherited manufacturing/service vector. Non-purchase is neither a new manufacture nor automatic zero burden: attribute actual used service and incremental transport/handling once to its proper original cohort and denominator, retaining unused service separately without a default lifetime or credit. This is the declared conserving foreground accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-2010
