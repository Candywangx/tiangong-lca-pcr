allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all shared burdens"
    rule: "Use this hierarchy only for an attributional study whose goal requires allocation rather than substitution. First assign dedicated operations and exchange vectors to their real product/cohort/function; perform physical or virtual subdivision as far as technically possible. Demonstrate and disclose residual multifunctionality and any accuracy loss when subdivision is infeasible. Industrial equipment evidence does not establish an LCA allocation rule."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_causality
    applies_to: "each residual exchange"
    rule: "For each genuinely residual exchange identify its determining physical causal relation to the co-functions and justify the measured criterion. Do not apply one convenient mass, heat, duration or revenue percentage to every exchange; physical presence alone does not prove determining causality. Only the remaining unresolved common-process vector may use contemporary market values at the same common-process exit state, grade, moisture, quantity and gate. Document prices, period, adjustments and sensitivity. There is no free physical/economic choice, fixed split or automatic avoided-product credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_losses
    applies_to: "waste; services; packaging; returns"
    rule: "Keep complete physical gross, waste handling and originating manufacturing loads independently of burden sharing. Waste sale, ordinary breakage, rejects, samples or dispatch to treatment do not alone justify allocating away their burden. A real independent other cohort/function requires documented once-only vector transfer and separate physical quantities. Track after-release returns to original cohorts, actual extra water/materials, losses and rework permission/tests/disposition; no repeated production or implicit recovery credit. Attributional recycling decisions require their actual system boundary, not an unreviewed module-D credit."
    source_ids:
      - jrc-ilcd-2010
