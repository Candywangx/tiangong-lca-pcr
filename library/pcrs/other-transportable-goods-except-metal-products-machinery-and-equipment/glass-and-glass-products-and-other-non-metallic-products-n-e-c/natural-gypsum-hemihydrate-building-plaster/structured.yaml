  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert each original reading to its row extensive unit before allocation: sum integrated readings once; integrate actual rates over their real intervals once. Electricity kWh * 3.6 gives MJ. Gas/liquid mass = measured integrated volume * independently applicable density at the recorded state, with explicit standard/actual-volume corrections. No generic water density for gas/oil, no extra time factor for integrated volume, and no secondary-property density. Keep mass, energy and volume subledgers rather than adding unlike units."
      inputs:
        - raw_readings
        - actual_state
        - independent_density
        - meter_intervals
      output: "converted_raw"
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
        - grenzebach-hammer-mill
    - id: manufacture_vector
      applies_to: "all inventory rows"
      rule: "For exchange i: A_i = B_open_i + C_i + T_in_i - B_close_i - T_out_i. Each term is the same-unit inherited exchange vector after justified dedicated assignment/subdivision and exchange-specific allocation; C_i retains all actual current production/failed/idle/cleanup/rework and associated treatment loads. B_close_i covers only raw, WIP and still-unassigned non-WIP stores, never released FG. T_out_i needs a genuine distinct receiving cohort/function and once-only transfer decision, never ordinary waste/sales deduction. Gross physical measurements stay unallocated. Record links to opening/closing lots and every transfer. Define C_i on the gross current acquisition/load basis before these same stock corrections. When a source already reports stock-adjusted net consumption, reconstruct the compatible gross pool from independent receipt/stock/transfer evidence and explicitly retain its included corrections; never stock-correct that net quantity again. For a custody-only gross physical disclosure card, including packaging/FG/asset movement and actual thermal-carrier supply/return or accepted process-condensate export, override this burden-stock assignment for that physical view: A_i is its independently measured full gross leg V_i in the row native unit. It is not B_open+C+T_in-B_close-T_out, an inherited burden, net consumption or an economic fraction. Actual separate supply/treatment/service burden vectors remain attributed once under their real owner. Do not charge another provider or create credit from the physical view."
      inputs:
        - B_open_i
        - C_i
        - T_in_i
        - B_close_i
        - T_out_i
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: service_vector
      applies_to: "services"
      rule: "For original released cohort c and observation horizon h, A_service_i_c_h includes actual incremental storage/handling/dispatch/repacking and every actually performed postrelease rework/treatment load attributable to that cohort, whether authorized, unapproved, unauthorized, failed or rejected, with its original manufacture vector retained separately. Use original first-release Q_c, not current shipments or repeated acceptance, as its basis. Assign remaining service stores and genuine intercohort transfers once with inherited vectors. No observed service means no claimed future service result; unresolved service records stay disclosed. For any actual postrelease rebagging, redrying or recalcining, retain governing manufacturer/specification permission, continued route/grade applicability, independently measured added/removed materials and free/bound-water phases, required postwork tests, and accepted return or waste disposition. Retain the original cohort and all actual service loads; storage guidance or application-stage drying is not permission to restore a failed powder. Performed service stays with original Q_c/h even if serviced FG is held at closing; only genuinely unused and unassigned service-material stores carry. Trace repair/rebagging custody, actual responsible provider, new and removed matter/water, unchanged applicable powder grade and native phase, postwork tests and acceptance/rejection/disposition. Damp, set or hydrated plaster is not assumed recoverable as the same supplied dry hemihydrate powder."
      inputs:
        - original_cohort
        - Q_c
        - h
        - actual_service_records
        - service_stock_vectors
      output: "A_service_i_c_h"
      source_ids:
        - jrc-ilcd-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "u_i = A_i / Q; u_i is the exchange amount per 1 kg reference flow. For a separately reported service result replace A_i and Q by A_service_i_c_h and Q_c in this same operation. Q must be positive; if Q = 0 retain all raw burdens and report no unit result. This is the only division by the product denominator. Cards reuse u_i, and collection aggregation labels refer to this same result rather than executing a second division. first_release_plaster is exactly 1 kg net powder. For the custody-only physical view use this same operation with A_i=V_i, or A_service_i_c_h=V_i_c_h and original Q_c for actual original-cohort services; do not stock-correct or economically scale a measured gross leg, add inherited manufacture to it, or divide twice. Thermal-carrier gross kg/state/enthalpy and actual heat MJ are separate dimensions of one agreed whole-provider supply/service; actual carrier/process-condensate return alone creates no extra water/heat purchase or credit. Internal circulation and matched article/component handoffs cancel."
      inputs:
        - A_i
        - Q
        - A_service_i_c_h
        - Q_c
        - cp_release
      output: "u_i"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_gates
      applies_to: "manufacture; services; combined"
      rule: "Manufacturing total wet physical mass: opening raw/WIP/unreleased stores/packaging/assets/installed fluid + real external ingress + FG material sent for actual rework, whether authorized, unapproved, failed or rejected = closing corresponding unreleased and in-place stocks + unique first-released net powder Q + actual packaging transferred with that first release P_Q + reworked original-cohort material and its actual packaging returned to FG + all other external solid/liquid/gas exits. Count every real wet article/fluid ingress even if retained at closing. Track material-species subledgers separately; asset service shares never replace physical mass. Separately the FG powder-material ledger (packaging follows its own full ledger): opening FG + Q + physical customer returns R + rework backflow F_back + X_in = closing FG + gross shipments G + rework withdrawal F_to + FG waste + consumed samples + X_out. X includes only measured material/water not already in another term. Returned mass is not assumed equal to any original shipment. Combine gates by cancelling Q, P_Q and matched F_to/F_back and associated packaging internal transfers, not external returns or real added water/losses. Use source phase/element assays and independent gas/liquid observations; mismatch is an open balance, not fabricated closure. X_in/X_out deduplicates only the same measured material/water already in another same-side incoming/outgoing FLOW term of this same bridge, never stock, opposite-direction flow or the mere existence of an atomic card. Retained new material/water remains actual influx AND full closing wet stock. Whole wet P/I includes its integral matter and water once. For assembly choose a disjoint component basis or a reconciled whole-article basis: the bought whole sack already contains supplier-integral liner/seam/glue/print; only actual separately supplied onsite additions are distinct components. The empty assembled tare equals the measured whole-bought-sack contribution plus actual added liner/thread/other matter and retained water minus actual removed/lost matter, excluding powder contents. In component mode keep each unique contribution once in stocks and S/EO/W; never use the full assembled tare as paper_sack and also add its separate liner/thread. In article mode transfer components into that article using paired measured internal handoff IDs, replace their same-gate stock/shipment figures by the reconciled article figure and cancel matched internal transfers. Integral chemical/component assays are memo subaccounts, not additional exchanges. For a single real mixed PE collection outlet, pe_waste is the one actual Waste exchange: independently measured liner and wrap source-W quantities are disjoint original subaccounts/pool withdrawals which sum to the matched outlet, with other real sources identified separately. Use total OR its disjoint partition at the same boundary, never both; no invented second outlet or duplicated treatment/provider. A genuinely separate actual outlet instead requires its own specific card before completion."
      inputs:
        - opening_stocks
        - closing_stocks
        - Q
        - R
        - G
        - F_to
        - F_back
        - P_Q
        - X_in
        - X_out
        - phase_assays
        - species_measurements
      output: "gross_gate_balances"
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
        - grenzebach-hammer-mill
    - id: phase_water_check
      applies_to: "gypsum_feed; hot_stucco; first_release_plaster; water_vapour; condensate_export"
      rule: "Partition measured solid mass into actual sulfate phases, impurities and free moisture. Infer bound-water change only from independently validated phase amounts and chemically appropriate formula masses, allowing actual residual dihydrate and anhydrite and measured uptake during cooling. Check it against separately measured vapour/condensate/retained free water plus fuel-derived and ambient water. One residual cannot determine both phase conversion and evaporated water. No default total-water-to-steam conversion, fixed phase fraction or source-case yield."
      inputs:
        - independent_phase_amounts
        - free_moisture
        - fuel_water
        - ambient_water
        - vapour
        - condensate
      output: "water_phase_check"
      source_ids:
        - epa-gypsum-1993
        - grenzebach-gypsum-solutions
        - grenzebach-hammer-mill
    - id: asset_service
      applies_to: "maintenance"
      rule: "Keep actual physical asset/part/fluid receipts, installed stocks, spare stocks, wear, returns and disposal in native units plus measured wet masses. For capital manufacture burdens only, assign measured service capacity/use to the actual cohort using justified service logs and exchange-specific causality; record the resulting fraction and its measured denominator. Maintenance consumables and replacements are separately supplied whole articles and actual current burdens, with inherited unused-stock vectors; never charge a new complete machine per kg or delete new physical ingress because it remains installed at closing."
      inputs:
        - asset_register
        - wet_mass_measurements
        - actual_service_logs
        - unused_stock_vectors
      output: "asset_service_share"
      source_ids:
        - grenzebach-hammer-mill
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference; all inventory"
      requirement: "Retain origin, phase, form, supplier, native restrictions, qualifiers, unit chain and real direction/compartment. A broad compatible manufactured family does not assert brand or provider equivalence."
      evidence: "Assays and specifications; exact identity support; supplier records"
    - id: dq_measurement
      applies_to: "each raw field"
      requirement: "Keep raw records before conversion/allocation/normalization, calibration, detection limits, uncertainty, sampling timing and dry/wet/standard-state basis. No invented numerical recipe, phase ratio, mass per item or service life."
      evidence: "Meter and scale calibration; laboratory methods; timestamps"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Retain failed and zero-output periods, startup/shutdown, idle/cleaning, actual fugitive leaks, controls, samples, rework and stocks. Add each real omitted exchange; unknown is not zero or absent. Treatment, upstream and future service coverage are separately disclosed."
      evidence: "Full period logs; discrepancy register; stock and service ledgers"
    - id: dq_sources
      applies_to: "all source-dependent claims"
      requirement: "EPA is historic route/control context, not current China plant emission data. Grenzebach describes technology options, not this factory recipe. Knauf is a German bagged-binder quality example, not the selected China SKU. BVG covers German industry and an unpackaged reference; transfer only qualitative phase/product distinctions, not German inventory/results, packaging exclusion, module-D credit, service life or application rates. ILCD applies only to the justified attributional allocation question."
      evidence: "Source scope and counterexamples; actual foreground representativeness"
    - id: dq_translation
      applies_to: "both renderings"
      requirement: "Preserve ordered rule IDs, atomic row IDs, official Chinese UUID displays, reference gate, all qualifiers, formulas, source lists and actual units. Aligned is not independent scientific or translation review."
      evidence: "Bilingual full-field audit"
validation_rules:
  - rule_id: identity_gate
    applies_to: "first_release_plaster; all bound rows"
    rule: "Check hemihydrate powder rather than dihydrate ore, anhydrous binder, board or cured paste. Verify the native Product reference and every adopted UUID restriction with complete reference-property and unit-group chain; family permission never overrides a hard phase/CAS/route/form/media/type conflict. Confirm China at-plant reference and exact official Chinese names. Ordinary unresolved auxiliaries remain named and disclosed; unresolved core reference identity blocks usable methodology."
    source_ids:
      - epa-gypsum-1993
      - grenzebach-gypsum-solutions
      - grenzebach-hammer-mill
  - rule_id: denominator_gate
    applies_to: "all inventory rows"
    rule: "Q must be unique independently measured first-release net powder, consistent with first_release_plaster, cp_release and both language bases. Audit stocks/vectors, no closing-FG manufacture subtraction, no Q plus closing-FG production sum, no return/retest production, one normalization and all zero-output loads. A zero Q retains raw burdens and yields no unit result. A new net-delivery dataset needs a different documented denominator and full original-delivery reversals; it is not validated here."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: balance_gate
    applies_to: "manufacture; FG; combined"
    rule: "Reconcile all three physical gates, packaging articles, assets, in-place fluids, gas species, water phases and relevant elements with independent measurements and uncertainty. Do not close two unknowns with one residual or force density/phase/condensate from a secondary factor. Preserve known versus unknown, absence versus measured zero and tested versus untested. Integrated gas/liquid volumes are not multiplied by time; real rates are integrated once. Confirm postwork permission/test/disposition before accepting reworked product."
    source_ids:
      - epa-gypsum-1993
      - grenzebach-gypsum-solutions
      - grenzebach-hammer-mill
  - rule_id: coverage_gate
    applies_to: "foreground package"
    rule: "Each applicable card needs actual numerator units, period/lot matching, inherited vectors, provider/fate, data quality and source applicability. Add all real omitted exchanges atomically; not_applicable requires evidence of absence. Unknown amounts remain unknown; no recipe, yield, phase proportion, emission factor, price or lifetime is fabricated. Mechanical projection/measurement checks establish neither scientific/translation approval nor completeness of a future factory inventory."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared China natural-gypsum hemihydrate building-binder supply with full route and first-release basis"
  allowed_use: "Only the measured unhydrated product grade and gate; separately disclose any original-cohort after-release service increment"
  excluded_use: "Raw dihydrate, FGD equivalence, alpha/anhydrous substitution, cured mortar/board/article performance, packaging-only manufacture, unmeasured net-delivery result, universal recipe/factors or assumed lifetime"
  required_metadata: "site and reporting period; natural quarried gypsum origin and delivered-China boundary; dry direct natural-gas hot-gas-generator and hammer-mill route; unhydrated powder state; hemihydrate-dominant measured phase assay including actual AIII/AII and residual dihydrate; free moisture separately from crystal water; impurities and actual product grade; fineness and declared setting/strength tests; absence of factory-added admixtures for this scope; actual bag configuration and net contents; unique first quality release and lot traceability; Q excludes packaging and all repeat releases; raw/WIP inherited vectors and released-FG stock history; after-release service cohort and observation horizon; all actual utilities and water phases; emissions species and receiving subcompartments; actual supplier/upstream burden ownership; physical asset and packaging stock balances; physical disclosure versus actual burden/provider inventory; component/article and PE-source-W/oneoutlet basis; actual paired handoff and meter/collection IDs; source-use totals never additive to their children"
  required_quality_disclosure: "Source scope, supplier gaps, native restrictions, unresolved auxiliary identities, stock/burden ownership, actual phase/water/element closure, uncertainty and unobserved service scope; mechanical checks are not scientific or translation approval"
  update_trigger: "Change of feed origin, phase, additives, route, fuel, utility interface, grade, package, gate, stock/service model, provider, control or evidence applicability"
data_sources:
  - id: "epa-gypsum-1993"
    type: "official_guidance"
    reference: "US EPA, AP-42 §11.16 Gypsum Manufacturing, July 1993 (reformatted January 1995), https://www.epa.gov/sites/default/files/2020-10/documents/c11s16.pdf"
