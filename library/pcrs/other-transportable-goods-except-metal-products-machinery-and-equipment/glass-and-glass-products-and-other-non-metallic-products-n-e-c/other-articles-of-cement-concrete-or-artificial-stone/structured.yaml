  - rule_id: determining_causality
    applies_to: "all inventory rows"
    rule: "For each genuinely shared residual exchange identify its determining physical causal relation with real evidence. Mixing/vibration work, water demand, equipment occupation and transport capacity can have different drivers. Time, mass, volume or items is usable only when demonstrated to determine that exchange; no arbitrary physical-versus-economic menu."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: residual_value
    applies_to: "only unresolved common-process burden"
    rule: "Only after dedicated/virtual subdivision and exchange-specific determining physical causality are exhausted may a genuine remaining common-process burden be partitioned by contemporaneous market value at the same actual process gate and supply state. Align quantity, grade, moisture, price period, currency and transport/packaging boundary. Preserve evidence, sensitivity and uncertainty; no fixed shares or sale-price default for waste."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: waste_no_auto_transfer
    applies_to: "all rejects and wastes and samples"
    rule: "A failed body, ordinary manufacturing waste, sample or external sale does not automatically reduce manufacturing or treatment burden. Transfer an inherited vector only once when a genuinely independent other cohort/function and justified allocation/handover decision exist. Physical gross mass still all crosses its actual destination. Internal recycle/reuse is not a new purchase or avoided-production credit."
    source_ids:
      - jrc-ilcd-2010
