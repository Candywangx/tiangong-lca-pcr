      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| terminal_identity | reference product | Confirm whole manufactured bare pipe and complete drawing/components/QC gate; no raw-concrete, binder, steel structure or installed-network surrogate. A native hard material/form/route/CAS/type/media conflict blocks identity; ordinary provider/auxiliary gaps stay explicit. | `mgcpi-nrcp`; `hawkeye-masterflex`; `npca-qcm-2026` |\n| release_once | manufacture; services | Verify unique first release after curing/tests, measured as-released wet Q, no repeated acceptance, no Q plus closingFG duplication and no released-FG manufacturing subtraction. Original service Q_c and horizon stay explicit; Q=0 has no unit inventory. | `npca-qcm-2026`; `jrc-ilcd-2010` |\n| normalize_once | all inventory rows | Check raw units/rate conversion then actual attribution and inherited-vector treatment before the single A_ec/Q_c calculation. Cards and aggregation reference that result and perform no additional division. Physical and burden ledgers are distinct. | `jrc-ilcd-2010` |\n| physical_phases | all processes | Close wet mass and relevant elements independently with observed water phases and identified species/media. Preserve six packaging legs and full wet stock/new influx; X deduplicates only other flow terms. No indicator-to-species fiction or shared residual for two unknowns. | `npca-qcm-2026`; `jrc-ilcd-2010` |\n| native_and_units | all inventory rows | Verify every adopted UUID against its entire native record and exact reference-property to unit-group reference unit. Keep official Chinese names and every restriction in consumable descriptions. Energy remains MJ, hydraulic fluid m3 and count item; mass does not override all numerator units. | `jrc-ilcd-2010` |\n| permission_and_completeness | all processes | Check actual manufacturer/specification permission for repair, postwork tests/acceptance/disposition, all failed/sample/waste/treatment loads, true whole supplies and additional actual exchanges. Missing real records or unsupported conversions remain unknown and prevent a complete foreground dataset; this PCR supplies no fabricated site values. | `npca-qcm-2026`; `jrc-ilcd-2010` |\n\n"
