      process_id: "manufacture"
      flow_role: "one component per physical leg"
      record_type: "six-leg stock ledger"
      raw_fields: "component; row_id; P; P_sep; I_paid; I_free; N_ext; N_other; same-item prior-outward link for ER; I; ER; S; EO; W; opening and closing empty/attached-WIP/attached-FG/reusable stocks; wet mass; residue and water subaccounts; upstream owner; internal reuse; actual repair new/removed wood or part dry/wet mass; separately supplied/absorbed/retained/discharged/vapour water; custody; same-side flow overlap; provider; per-pool Radd/Rremove/H2Oin/H2Oout/X same-side OTHER flow; matched component/article handoff; single mixed outlet and nonadditive raw-origin W; ordinary storage/handling water phases"
      collection_method: "Count and independently weigh each same-configuration component, including supplier-included real ingress. Preserve full physical gross legs; only deduplicate another flow term, never new influx retained in closing stock. Each named row is one gross direction, not a net sum or burden vector; measure actual material/water additions and removed matter separately, keeping retained influx and full wet stock together. For each actual packaging pool the complete wet ledger is O+P+N_ext+ER+Radd+H2Oin-X_in=C+S+EO+W+Rremove+H2Oout-X_out. O/C include empty, attached WIP/FG and reusable wet stocks; P is every paid acquisition including packaging paid within a bundled goods price; N_ext is first non-purchased external ingress (including actual gift, loan or free supply), never an outward leg or a return without that same item’s prior outward record. ER requires an identified same-item prior outward event and actual incoming state; EO is a distinct actual outward return. S is gross shipment and W actual waste. Keep the existing separate-purchase cards as P_sep and supplier-included I cards as disjoint physical partitions: P = P_sep + I_paid and N_ext = N_other + I_free. I = I_paid + I_free is a nonadditive supply-channel disclosure, not another term added to P or N_ext; each N_other card excludes I and ER. Unknown acquisition/payment/return history stays unresolved, not zero. Radd/Rremove are actual separate added/removed material; H2Oin/H2Oout retain separately added liquid/atmospheric intake and actual liquid/vapour outlet subaccounts. The six-leg equation is the special case of no separate increments or increments already consolidated into same-side legs. X only removes the same material duplicated in another same-side OTHER actual flow term, never stocks, opposite flows or mere card existence; real retained influx and complete wet closing mass both remain. Whole wet articles include their integral components/water once. Separately supplied onsite components must be disjoint from the article or replaced through matched component-out/article-in transfer bridges; internal handoffs cancel on consolidation. Never add complete assembled tare to the same included constituents. If real origins join one mixed outlet, retain one identity-qualified Waste exchange and one actual treatment/provider, with independent raw per-origin W subaccounts summing to the total; use total OR constituent partitions nonadditively, without invented separate outlets or purchases. Ordinary storage/handling uptake, desorption and evaporation require no repair event. Permission/specification and postwork tests/acceptance govern authorization, continued qualification and disposition only; they never erase actual unauthorized/unapproved/failed/rejected work. Retain every real material, water, energy, emission, loss, waste, treatment and burden on manufacture Q_c or original cohort Q_c and observed h; no assumed restoration of hardened broken pipe or new Q."
      unit: "kg"
      frequency: "each real event/lot including zero-output periods"
      temporal_coverage: "complete original cohort and observed service h"
      site_scope: "actual plant and corresponding supplier/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; calibration; timestamps; component/lot links; uncertainty"
