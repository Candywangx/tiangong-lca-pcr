      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Burden-bearing whole cement, natural aggregate, actual water and whole preparations plus real asset/maintenance/packaging supplies entering the plant; not finished-pipe receipt |\n| starting_condition_role | supplied_material |\n| product_classification_scope | CPC 3.0:37560; narrower |\n| recursive_input_rule | Do not replace manufacture with purchased same-category finished pipe; assess any actual external same-category feed first. Internal recovery retains vectors and cancels once without procurement. |\n| upstream_dataset_requirement | One compatible provider and burden owner per whole supply/real treatment service; match form/route/geography/year and included transport/packaging |\n| disclosure | plant and reporting period; actual approved pipe drawing and configuration with net whole-body boundaries including bell/spigot geometry; no steel or fibre reinforcement and no lining or installed gasket or insert; whole cement and natural fine/coarse aggregate supply forms and moisture; actual whole mould-release preparation and any permitted repair supplies; core-vibration dry casting and immediate demoulding before curing; documented non-heated moisture-retention curing with actual water and polyethylene cover stocks; actual manufacturer and governing specification with real inspections and test evidence before unique first quality release; measured net as-released wet mass and timestamp with free/absorbed/bound water distinguished; opening/closing raw and long-curing WIP inherited vector for every exchange; released FG and original cohort Q_c plus observed service horizon h; full gross shipments and actual return states with original delivery links; supplier-included packaging ingress and one upstream owner with six packaging legs; asset/new/old repair part and installed-fluid stocks with measured states; native voltage and geography and every actual fuel and identified species/media; same-configuration measured mass/geometry only for any count/volume/area conversion |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| whole_route | manufacture | Carry one compatible upstream burden owner for each whole supplied cement, aggregate, release emulsion, repair preparation and packaging ingress, plus real transport not already included. Manufacturer records determine actual batch preparation and permitted finishing/repair; The selected terminal is a whole unreinforced bare pipe without installed seals/inserts;37560 is a narrower residual-article assessment, with no pipe-specific original note; its classification relationship is governed by the authoritative mapping and decision record outside this PCR; do not turn assay constituents or carrier water into additional purchases. Stock-corrected consumption is not corrected again. Add every actual omitted atomic input/output and its collection evidence before dataset completion. Permission/specification and postwork tests/acceptance govern authorization, continued qualification and disposition only; they never erase actual unauthorized/unapproved/failed/rejected work. Retain every real material, water, energy, emission, loss, waste, treatment and burden on manufacture Q_c or original cohort Q_c and observed h; no assumed restoration of hardened broken pipe or new Q. | `npca-qcm-2026`; `un-cpc3-2025`; `mgcpi-nrcp` |\n| first_release | manufacture; services | Q_c is the sum of independently weighed net as-released wet whole-body masses of uniquely first-accepted pipes after actual curing and governing QC/test clearance in cohort c. Rejects or destructive samples removed before release are outside Q_c but retain all loads. Immediate dry-cast demoulding alone establishes no Q. Closing released FG is already in Q_c: neither add another production output nor subtract its manufacturing burden. Dispatch, repeat acceptance, return and any actual postrelease repair create no new Q. | `hawkeye-masterflex`; `npca-qcm-2026`; `jrc-ilcd-2010` |\n| cohort_inheritance | all inventory rows | Preserve an inherited vector for every exchange in opening/closing raw supplies and every long-curing WIP stage, including green demoulded pipe, partly cured and pending-test body. Manufacturing A_ec contains opening inheritance plus actual attributable new load and justified inward transfers minus still-unreleased closing raw/WIP and unused/unassigned non-WIP stores and justified outward vector transfer once. Released FG is never that closing subtraction. Keep all failed/zero-output/start/stop/idle/cleanup/rework/test/waste-treatment loads. Q_c=0 retains raw physical legs and burdens without a unit result. | `jrc-ilcd-2010` |\n| service_original_cohort | services; assets | Observe all actual postrelease storage/packing/handling/loading/dispatch/return receipt/retest and every actual work event over horizon h, retaining original cohort Q_c. Already performed service is not removed because FG remains in closing stock; only unused/unassigned charge or service stores carry forward. Combine manufacturing and service modules by cancelling internal released-pipe and matched return/rework transfers once. No net-delivery denominator is used. The manufacturing physical gate reports Q_c once with closing unreleased raw/WIP; the service physical gate receives that internal Q_c and opening FG plus actual returns/new material/water and discharges actual gross shipments, closing FG, wastes and phase losses. Consolidated plant mass cancels internal Q_c; it never adds Q_c to the same closing FG. Any separately developed net-delivery account must independently bridge gross G, real R, original delivery reversal D_rev, opening/closing FG inherited burdens and actual new water/material/loss; R is not presumed equal to original delivered mass. Permission/specification and postwork tests/acceptance govern authorization, continued qualification and disposition only; they never erase actual unauthorized/unapproved/failed/rejected work. Retain every real material, water, energy, emission, loss, waste, treatment and burden on manufacture Q_c or original cohort Q_c and observed h; no assumed restoration of hardened broken pipe or new Q. | `npca-qcm-2026`; `jrc-ilcd-2010` |\n| water_and_gross_mass | all processes | Close gross wet physical mass and relevant Ca/Si/C/H/O/N/S element ledgers independently of burden allocation. Distinguish aggregate free/absorbed water, separately added liquid water, whole-formulation carrier water, product free/gel/chemically bound hydration water, evaporation, purge and water in residues/repair materials. Hydration is an internal phase conversion, not an extra water input; independently observe reaction/phase evidence and moisture losses. One residual cannot fit two unknowns. Keep full wet closing stock and actual new influx together. Each incoming/outgoing gas species and phase remains atomic; do not add an aggregate air purchase to its constituent species. Gross physical legs never shrink with economic burden shares. If a real heat/steam route is proposed, reassess this non-heated boundary and add each actual carrier: heat MJ and carrier-water kg/state/enthalpy are dimensions of one provider supply; external condensate/hot-water Product returns keep actual mass/state and one owner, without a second full purchase or automatic credit. Laboratory specimen curing/tests are actual factory QC burdens, not proof of the whole production body cure state. | `npca-qcm-2026`; `jrc-ilcd-2010` |\n| packaging_and_assets | all processes | For each actual packaging pool the complete wet ledger is O+P+N_ext+ER+Radd+H2Oin-X_in=C+S+EO+W+Rremove+H2Oout-X_out. O/C include empty, attached WIP/FG and reusable wet stocks; P is every paid acquisition including packaging paid within a bundled goods price; N_ext is first non-purchased external ingress (including actual gift, loan or free supply), never an outward leg or a return without that same item’s prior outward record. ER requires an identified same-item prior outward event and actual incoming state; EO is a distinct actual outward return. S is gross shipment and W actual waste. Keep the existing separate-purchase cards as P_sep and supplier-included I cards as disjoint physical partitions: P = P_sep + I_paid and N_ext = N_other + I_free. I = I_paid + I_free is a nonadditive supply-channel disclosure, not another term added to P or N_ext; each N_other card excludes I and ER. Unknown acquisition/payment/return history stays unresolved, not zero. Radd/Rremove are actual separate added/removed material; H2Oin/H2Oout retain separately added liquid/atmospheric intake and actual liquid/vapour outlet subaccounts. The six-leg equation is the special case of no separate increments or increments already consolidated into same-side legs. X only removes the same material duplicated in another same-side OTHER actual flow term, never stocks, opposite flows or mere card existence; real retained influx and complete wet closing mass both remain. Internal reuse cancels once; use acquisition totals OR their disjoint card partitions, never both. P/N_ext/ER remain actual influx even if retained in full wet closing stock; a bundled price does not create a second provider charge. Packaging is outside net product Q. For each real asset and new/old repair part and installed fluid use opening + actual inward supplies - X_in = closing + actual external retirement/returns/waste - X_out; X only removes duplication with another incoming/outgoing term and never erases influx left in stock. Keep physical asset stocks separate from observed service burden and actual additions/withdrawals; no fixed lifetime or whole machine per kg. No fictitious kiln/refractory inventory for this non-heated route. Whole wet articles include their integral components/water once. Separately supplied onsite components must be disjoint from the article or replaced through matched component-out/article-in transfer bridges; internal handoffs cancel on consolidation. Never add complete assembled tare to the same included constituents. If real origins join one mixed outlet, retain one identity-qualified Waste exchange and one actual treatment/provider, with independent raw per-origin W subaccounts summing to the total; use total OR constituent partitions nonadditively, without invented separate outlets or purchases. Ordinary storage/handling uptake, desorption and evaporation require no repair event. All actual FG/package/asset/new-old-part/installed-fluid physical gross legs, and any real thermal-carrier ingress or condensate/hot-water Product return established after boundary reassessment, use complete measured native-unit V as A_ec or S_ech for gross disclosure before the sole Q_c quotient; services retain original Q_c/h. These are separate from inherited, stock-corrected, economic or service-burden vectors, without extra purchase/credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions of one provider supply; item supplies no assumed kg. This non-heated pipe route invents no heat/steam/boiler; real heat introduction requires prior applicability reassessment and every actual carrier atom. | `npca-qcm-2026`; `jrc-ilcd-2010` |\n| repair_permission | manufacture; services | Actual pre/postrelease repair needs manufacturer/governing-specification permission, qualified defect assessment, individual whole purchased preparations or actual on-site ingredients, new water/energy/losses, postwork inspection/tests, acceptance or rejection and disposition. The NPCA dry-cast immediate-stripping exception must not be replaced by a wet-cast stripping-strength schedule. Broken hardened pipe is not assumed restorable; no default remanufacturing credit. Any actual treatment of rejects remains a burden of its function unless a justified once-only transfer to a genuinely separate function/cohort is evidenced. Trace actual repair custody, onsite versus external work/provider, original body/cohort, all new materials and separately added water, actual removed old concrete/parts, collected wastewater and vapour, and final acceptance/rejection/disposition. A whole wet preparation and its carrier enter once. No permission or acceptance is inferred from an ordinary return, test specimen, repeated release or assumed rehydration of hardened scrap. Permission/specification and postwork tests/acceptance govern authorization, continued qualification and disposition only; they never erase actual unauthorized/unapproved/failed/rejected work. Retain every real material, water, energy, emission, loss, waste, treatment and burden on manufacture Q_c or original cohort Q_c and observed h; no assumed restoration of hardened broken pipe or new Q. | `hawkeye-masterflex`; `npca-qcm-2026`; `jrc-ilcd-2010` |\n\n"
