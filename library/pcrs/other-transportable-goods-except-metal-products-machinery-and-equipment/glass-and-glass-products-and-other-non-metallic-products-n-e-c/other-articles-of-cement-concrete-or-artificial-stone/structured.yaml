  calculation_rules:
    - id: native_conversion
      applies_to: "all inventory rows"
      rule: "First convert real totals/rates and original units into this row native extensive unit; 1 kWh = 3.6 MJ. Integrated volume is not multiplied by time; density is independently measured for that substance/state, never assumed for water or oil."
      inputs:
        - raw_native_records
        - actual_state
        - cp_water
        - cp_energy
        - cp_species
      output: "converted_raw"
      source_ids:
        - jrc-ilcd-2010
    - id: manufacture_vector
      applies_to: "all inventory rows"
      rule: "A_ec = B_open_ec + current_attributed_ec + transfer_in_ec - B_close_unreleased_ec - unused_unassigned_ec - justified_transfer_out_ec. B_close_unreleased contains only unreleased raw/WIP; never deduct released FG. No second correction of stock-corrected consumption and no automatic waste/sale burden transfer. Permission/specification and postwork tests/acceptance govern authorization, continued qualification and disposition only; they never erase actual unauthorized/unapproved/failed/rejected work. Retain every real material, water, energy, emission, loss, waste, treatment and burden on manufacture Q_c or original cohort Q_c and observed h; no assumed restoration of hardened broken pipe or new Q. All actual FG/package/asset/new-old-part/installed-fluid physical gross legs, and any real thermal-carrier ingress or condensate/hot-water Product return established after boundary reassessment, use complete measured native-unit V as A_ec or S_ech for gross disclosure before the sole Q_c quotient; services retain original Q_c/h. These are separate from inherited, stock-corrected, economic or service-burden vectors, without extra purchase/credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions of one provider supply; item supplies no assumed kg. This non-heated pipe route invents no heat/steam/boiler; real heat introduction requires prior applicability reassessment and every actual carrier atom."
      inputs:
        - converted_raw
        - cp_inheritance
        - cp_allocation
        - cp_release
      output: "A_ec"
      source_ids:
        - jrc-ilcd-2010
    - id: service_vector
      applies_to: "services; assets"
      rule: "S_ech contains actual already performed original-cohort service over h and justified inheritance/transfers; FG retention does not remove performed service. Carry only unused/unassigned charge. Cancel matched internal pipe/recovery transfers once between manufacturing/service; do not purchase old manufacturing burden again as new work. For every FG/package/repair physical card S_ech denotes its full measured gross leg, independently of associated inherited/allocated burden vectors; it is not a second stock correction, economic fraction, provider purchase or credit. Held-FG performed services keep original Q_c and h. Actual changed-state return mass R never rewrites original delivered mass or unique Q_c. Permission/specification and postwork tests/acceptance govern authorization, continued qualification and disposition only; they never erase actual unauthorized/unapproved/failed/rejected work. Retain every real material, water, energy, emission, loss, waste, treatment and burden on manufacture Q_c or original cohort Q_c and observed h; no assumed restoration of hardened broken pipe or new Q. All actual FG/package/asset/new-old-part/installed-fluid physical gross legs, and any real thermal-carrier ingress or condensate/hot-water Product return established after boundary reassessment, use complete measured native-unit V as A_ec or S_ech for gross disclosure before the sole Q_c quotient; services retain original Q_c/h. These are separate from inherited, stock-corrected, economic or service-burden vectors, without extra purchase/credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions of one provider supply; item supplies no assumed kg. This non-heated pipe route invents no heat/steam/boiler; real heat introduction requires prior applicability reassessment and every actual carrier atom."
      inputs:
        - converted_raw
        - cp_service
        - cp_assets
        - cp_inheritance
        - cp_allocation
        - cp_assets_inheritance
        - cp_service_inheritance
        - cp_assets_allocation
        - cp_service_allocation
      output: "S_ech"
      source_ids:
        - npca-qcm-2026
        - jrc-ilcd-2010
    - id: calc_once
      applies_to: "all inventory rows"
      rule: "For Q_c>0 compute manufacturing y_ec = A_ec / Q_c and original-cohort service y_service_ech = S_ech / Q_c exactly once each. Report each physical leg using its unscaled gross raw quantity on the same Q_c, separately from attributed-burden columns. Q_c=0 retains records and burdens without a unit result. For each named gross physical card, including packaging/FG/repair/assets/parts/installed fluids and boundary-reassessed real thermal-carrier/Product returns, the corresponding A_ec or S_ech numerator is the full measured physical leg before the sole division, separately from its inherited or allocated burden vector; do not net these legs by stocks, consumption, economic shares or provider charges. All actual FG/package/asset/new-old-part/installed-fluid physical gross legs, and any real thermal-carrier ingress or condensate/hot-water Product return established after boundary reassessment, use complete measured native-unit V as A_ec or S_ech for gross disclosure before the sole Q_c quotient; services retain original Q_c/h. These are separate from inherited, stock-corrected, economic or service-burden vectors, without extra purchase/credit. Heat MJ and carrier kg/state/enthalpy are separate dimensions of one provider supply; item supplies no assumed kg. This non-heated pipe route invents no heat/steam/boiler; real heat introduction requires prior applicability reassessment and every actual carrier atom."
      inputs:
        - A_ec
        - S_ech
        - Q_c
        - cp_release
      output: "y_ec; y_service_ech"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_and_packages
      applies_to: "all inventory rows"
      rule: "Independently close section5 gross wet mass/elements, each packaging P/N_ext/ER/S/EO/W balance using the disjoint P_sep/I_paid/I_free/N_other card bridge and each asset/part/fluid equation; full wet closing stock and real new influx coexist. X only deduplicates another incoming/outgoing term. Retain gross gas species legs without aggregate-air duplication. X deduplicates only the same actual material/water in another same-side incoming/outgoing flow term of this same bridge, never a stock, opposite-side term or mere existing atomic card.  Retained new wood/water remains both influx and closing wet stock; whole wet P/I and its carried water enter once. Removed repair material is not also whole W. Actual packaging repairs/water need individual dry/wet composition, outlets, custody and one provider owner. For each actual packaging pool the complete wet ledger is O+P+N_ext+ER+Radd+H2Oin-X_in=C+S+EO+W+Rremove+H2Oout-X_out. O/C include empty, attached WIP/FG and reusable wet stocks; P is every paid acquisition including packaging paid within a bundled goods price; N_ext is first non-purchased external ingress (including actual gift, loan or free supply), never an outward leg or a return without that same item’s prior outward record. ER requires an identified same-item prior outward event and actual incoming state; EO is a distinct actual outward return. S is gross shipment and W actual waste. Keep the existing separate-purchase cards as P_sep and supplier-included I cards as disjoint physical partitions: P = P_sep + I_paid and N_ext = N_other + I_free. I = I_paid + I_free is a nonadditive supply-channel disclosure, not another term added to P or N_ext; each N_other card excludes I and ER. Unknown acquisition/payment/return history stays unresolved, not zero. Radd/Rremove are actual separate added/removed material; H2Oin/H2Oout retain separately added liquid/atmospheric intake and actual liquid/vapour outlet subaccounts. The six-leg equation is the special case of no separate increments or increments already consolidated into same-side legs. X only removes the same material duplicated in another same-side OTHER actual flow term, never stocks, opposite flows or mere card existence; real retained influx and complete wet closing mass both remain. Whole wet articles include their integral components/water once. Separately supplied onsite components must be disjoint from the article or replaced through matched component-out/article-in transfer bridges; internal handoffs cancel on consolidation. Never add complete assembled tare to the same included constituents. If real origins join one mixed outlet, retain one identity-qualified Waste exchange and one actual treatment/provider, with independent raw per-origin W subaccounts summing to the total; use total OR constituent partitions nonadditively, without invented separate outlets or purchases. Ordinary storage/handling uptake, desorption and evaporation require no repair event."
      inputs:
        - cp_packaging
        - cp_assets
        - cp_water
        - cp_species
        - cp_inheritance
        - cp_service_packaging
        - cp_service_waste
        - cp_service_species
        - cp_assets_inheritance
        - cp_service_inheritance
      output: "physical_balance_and_uncertainty"
      source_ids:
        - npca-qcm-2026
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: product_identity
      applies_to: "reference product"
      requirement: "Keep actual drawing, absence/presence register for every seal/sleeve/insert, supply state and qualification evidence. A compatible broad manufactured family is not proof of design approval or a particular SKU."
      evidence: "real originals; matched configuration/state; calibration/uncertainty; source restrictions"
    - id: all_raw
      applies_to: "all collection protocols"
      requirement: "Keep full original records and units, meter calibration, dates, site, supplier and lot ownership, failed periods and sample/reject dispositions; missing measurement remains unknown rather than zero."
      evidence: "real originals; matched configuration/state; calibration/uncertainty; source restrictions"
    - id: all_exchanges
      applies_to: "all inventory rows"
      requirement: "Actual conditional absence requires evidence; any real omitted single input/output or species is added before completion. Verify supplier-included ingress and one upstream owner. No collection label conceals manufacture."
      evidence: "real originals; matched configuration/state; calibration/uncertainty; source restrictions"
    - id: source_limits
      applies_to: "all source-based rules"
      requirement: "Retain source context and independent-source roles; manufacturer process evidence does not justify allocation. Handbooks and machinery rates are not measured plant quantities or certification."
      evidence: "real originals; matched configuration/state; calibration/uncertainty; source restrictions"
    - id: state_vectors
      applies_to: "manufacture; services; assets"
      requirement: "Reconcile all wet states, long-curing WIP, FG, asset fluids, six packaging legs and per-exchange inherited vectors with uncertainty. One residual cannot establish two unknowns."
      evidence: "real originals; matched configuration/state; calibration/uncertainty; source restrictions"
validation_rules:
  - rule_id: terminal_identity
    applies_to: "reference product"
    rule: "Confirm whole manufactured bare pipe and complete drawing/components/QC gate; no raw-concrete, binder, steel structure or installed-network surrogate. A native hard material/form/route/CAS/type/media conflict blocks identity; ordinary provider/auxiliary gaps stay explicit."
    source_ids:
      - mgcpi-nrcp
      - hawkeye-masterflex
      - npca-qcm-2026
  - rule_id: release_once
    applies_to: "manufacture; services"
    rule: "Verify unique first release after curing/tests, measured as-released wet Q, no repeated acceptance, no Q plus closingFG duplication and no released-FG manufacturing subtraction. Original service Q_c and horizon stay explicit; Q=0 has no unit inventory."
    source_ids:
      - npca-qcm-2026
      - jrc-ilcd-2010
  - rule_id: normalize_once
    applies_to: "all inventory rows"
    rule: "Check raw units/rate conversion then actual attribution and inherited-vector treatment before the single A_ec/Q_c calculation. Cards and aggregation reference that result and perform no additional division. Physical and burden ledgers are distinct."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: physical_phases
    applies_to: "all processes"
    rule: "Close wet mass and relevant elements independently with observed water phases and identified species/media. Preserve six packaging legs and full wet stock/new influx; X deduplicates only other flow terms. No indicator-to-species fiction or shared residual for two unknowns."
    source_ids:
      - npca-qcm-2026
      - jrc-ilcd-2010
  - rule_id: native_and_units
    applies_to: "all inventory rows"
    rule: "Verify every adopted UUID against its entire native record and exact reference-property to unit-group reference unit. Keep official Chinese names and every restriction in consumable descriptions. Energy remains MJ, hydraulic fluid m3 and count item; mass does not override all numerator units."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: permission_and_completeness
    applies_to: "all processes"
    rule: "Check actual manufacturer/specification permission for repair, postwork tests/acceptance/disposition, all failed/sample/waste/treatment loads, true whole supplies and additional actual exchanges. Missing real records or unsupported conversions remain unknown and prevent a complete foreground dataset; this PCR supplies no fabricated site values."
    source_ids:
      - npca-qcm-2026
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Only a complete applicable measured dataset with upstream chain supports later LCA of its declared uninstalled bare pipe; packaging/services disclosed at their actual scope"
  allowed_use: "Attributional product-chain modelling with matched material/route/drawing configuration/moisture/geography/gate"
  excluded_use: "Structural/hydraulic design, load/strength certification, installation specification, lifetime prediction, installed-network equivalence, full37560 coverage or automatic carbon/recycling credits"
  required_metadata: "plant and reporting period; actual approved pipe drawing and configuration with net whole-body boundaries including bell/spigot geometry; no steel or fibre reinforcement and no lining or installed gasket or insert; whole cement and natural fine/coarse aggregate supply forms and moisture; actual whole mould-release preparation and any permitted repair supplies; core-vibration dry casting and immediate demoulding before curing; documented non-heated moisture-retention curing with actual water and polyethylene cover stocks; actual manufacturer and governing specification with real inspections and test evidence before unique first quality release; measured net as-released wet mass and timestamp with free/absorbed/bound water distinguished; opening/closing raw and long-curing WIP inherited vector for every exchange; released FG and original cohort Q_c plus observed service horizon h; full gross shipments and actual return states with original delivery links; supplier-included packaging ingress and one upstream owner with six packaging legs; asset/new/old repair part and installed-fluid stocks with measured states; native voltage and geography and every actual fuel and identified species/media; same-configuration measured mass/geometry only for any count/volume/area conversion"
  required_quality_disclosure: "unmeasured/unbound UUID and provider gaps; source scope; observed service h; per-exchange inheritance/allocation evidence; completeness and uncertainty"
  update_trigger: "change in material/formulation/supply or component boundary, drawing, curing/manufacturing route, governing specification, geography/energy, measurement/allocation or source restriction"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025, pp.183-185; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Residual article title and neighboring boundaries only; no pipe-specific explanatory note. This source alone does not establish the repository classification relationship, which is governed by the authoritative mapping and its decision record."
  - id: "hawkeye-masterflex"
    type: "extension_guidance"
    reference: "HawkeyePedershaab VIHY Masterflex brochure, undated, complete pp.1-4; https://www.ammermann.com.au/website/wp-content/uploads/2016/11/Masterflex-Brochure2.pdf"
    used_for: "Non-reinforced pipe identity; core vibration and hydraulic presshead; immediate demoulding before transport to curing. Page4 C76-based rates and machine capacity are not adopted."
  - id: "mgcpi-nrcp"
    type: "extension_guidance"
    reference: "Manuela Gonzales Concrete Pipes Inc., Products and company profile, undated; https://mgcpi.com/index.html"
    used_for: "Manufactured non-reinforced concrete pipe for drainage contrasted with reinforced pipe. No load capacity or neighboring RCP strength used."
  - id: "npca-qcm-2026"
    type: "handbook"
    reference: "NPCA Quality Control Manual for Precast Concrete Plants, 19th edition, 2 February 2026, §§3.1-3.4 and 4.1-4.8; https://precast.org/wp-content/uploads/QCM-001_19th_Edition_02-02-26.pdf"
    used_for: "Whole material batching and moisture corrections; forms and release agent; dry-cast exceptions; moisture-retention curing; inspection and permission-based repair and shipment. Broader reinforcement/heated routes and all numerical design/QC/cure prescriptions are not imported as PCR defaults."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March 2010, §7.9 pp.255-268 (PDF275-288); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional inventory; dedicated subdivision and virtual subdivision; exchange-specific determining physical causality; only residual common-process market value at the actual state/gate. No industrial recipe, fixed share or automatic substitution credit."
