      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| dedicated_first | all inventory rows | Use actual dedicated records and independent subdivision first. Virtual subdivision separates loads belonging exclusively to the selected pipe/cohort and observed services; no division by product mass or price merely for convenience. | `jrc-ilcd-2010` |\n| determining_causality | all inventory rows | For each genuinely shared residual exchange identify its determining physical causal relation with real evidence. Mixing/vibration work, water demand, equipment occupation and transport capacity can have different drivers. Time, mass, volume or items is usable only when demonstrated to determine that exchange; no arbitrary physical-versus-economic menu. | `jrc-ilcd-2010` |\n| residual_value | only unresolved common-process burden | Only after dedicated/virtual subdivision and exchange-specific determining physical causality are exhausted may a genuine remaining common-process burden be partitioned by contemporaneous market value at the same actual process gate and supply state. Align quantity, grade, moisture, price period, currency and transport/packaging boundary. Preserve evidence, sensitivity and uncertainty; no fixed shares or sale-price default for waste. | `jrc-ilcd-2010` |\n| waste_no_auto_transfer | all rejects and wastes and samples | A failed body, ordinary manufacturing waste, sample or external sale does not automatically reduce manufacturing or treatment burden. Transfer an inherited vector only once when a genuinely independent other cohort/function and justified allocation/handover decision exist. Physical gross mass still all crosses its actual destination. Internal recycle/reuse is not a new purchase or avoided-production credit. | `jrc-ilcd-2010` |\n\n"
