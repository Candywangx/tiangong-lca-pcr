allocation_rules:
  - rule_id: allocate_direct
    applies_to: "all exchanges"
    rule: "Apply only in attributional cases requiring allocation. First use dedicated measurements and actual/virtual subdivision, assigning embodied articles and directly attributable tests, failures and service to the relevant release cohort. Keep gross physical outputs independent from burden shares."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocate_causal
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange demonstrate the determining physical causal relationship specific to that exchange and function. Metered heater time/load, washing cycles or actual heated sealant demand may be investigated, but neither mass nor area nor energy nor a convenient shared fraction is automatically causal. Retain evidence and sensitivity separately for each exchange."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocate_residual
    applies_to: "genuine unassignable residual"
    rule: "Only for genuinely remaining inseparable multifunctional burdens use documented contemporaneous market values for actual coproducts in their actual state at the same common process gate. Separate quantity, actual price, currency/date, moisture/quality and gate, then disclose shares and sensitivity. No arbitrary physical/economic choice, fixed percentage, universal price or default avoided-burden credit. A waste sale, internal reuse or return does not automatically create a coproduct."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocate_returns
    applies_to: "FG and packaging"
    rule: "Retain original release and delivery IDs. Reverse the original delivery/burden assignment before a returned unit is redelivered; retain actual material removals/additions, moisture/gas changes and incremental repair/test/service burden on its original cohort. Historical manufacture is not recharged to unrelated current Q. Record damaged units and stock loss rather than silently deleting them. Packaging gross physical balance does not depend on allocated life shares."
    source_ids:
      - ilcd-attributional-2010
      - bostik-5000-application
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_manufacture
      process_id: "manufacture"
      flow_role: "all manufacture materials utilities and waste"
      record_type: "raw_activity_records"
      raw_fields: "supplier lot and state; outer/inner pane mass and dimensions; profile alloy and length; joint material; bead size and moisture; full formulation masses; input and waste weights; raw water and energy meter readings with units; equipment fluid opening/closing and inherited vectors; raw/WIP/hold-up opening/closing quantities and per-exchange vectors; failure idle startstop cleanup and rework; destination; uncertainty"
      collection_method: "Retain original invoices, calibrated scales/meters, stocktakes, SDS/TDS and all successful/failed job records. Collect raw unnormalized quantities; independently sample water/solids and material identities. Link every reading to a process interval and cohort; retain corrected-consumption flag. Actual non-WIP fluid/tooling/other included stock quantities and per-exchange vectors are independent of WIP. For included capital assets additionally retain actual physical acquisition/closing/retirement quantities separately from service vectors; add each actually needed specific flow, with no default asset weight/life."
      unit: "native units retained with actual conversions"
      frequency: "each lot job interval and stocktake"
      temporal_coverage: "full reporting period including shutdown"
      site_scope: "selected manufacturer and linked actual suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; invoices; SDS; waste tickets; stock and history ledger"
    - protocol_id: cp_gases
      process_id: "manufacture"
      flow_role: "each cavity/air-handling gas species and water"
      record_type: "raw_gas_and_moisture_records"
      raw_fields: "control volume; each species identity; integrated volume or true rate; time for true rate only; temperature; absolute pressure; humidity; measured composition; independent substance density; cavity retained mass; bead water before/after; wash evaporation; actual condensate origin; gas/water outflow and destination; uncertainty"
      collection_method: "Collect original paired gross inlet/outlet observations at one defined boundary with independent moisture/gas measurements. Preserve gross quantities, independently evidenced unchanged passthrough, actual retained cavity/bead stock and real net changes as separate linked records. Raw physical closure uses both gross directions. Only a separately documented matched-species/phase/state/boundary passthrough may be removed from BOTH corresponding gross inlet and outlet to derive the net environmental view; never remove it from only one side or add net and gross views together. Resource-from-air and emitted-vapour/species identities remain distinct; no automatic LCIA cancellation or substitution across unmatched chemical/phase/compartment identities. Condensate/adsorption/evaporation and actual atmospheric water entry require independent source/exit evidence. Never infer air composition, cross-substance density, two unknown sinks or reaction yield from a residual."
      unit: "native volume/rate units and measured kg"
      frequency: "each run and paired measurement interval"
      temporal_coverage: "same full reporting period and stock boundaries"
      site_scope: "selected cavity/air-handling physical boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "gas/humidity instrument calibration; paired samples; independent water/species evidence"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first_release"
      record_type: "first_quality_release_records"
      raw_fields: "unit ID; both panes and sealed configuration; actual outline/shape and drawing revision; independently measured dimensions; verified rectangular flag or traceable geometry/planimetry and uncertainty; actual one-face projected A_k including sealed edge; calibrated net unit mass; seal/nozzle/corner/cooling inspections; applicable current specification and actual tests; sample/reject disposition; first release time; reporting cohort; raw Q; uncertainty"
      collection_method: "Measure each actual configuration and link test/release evidence to a unique unit. Determine actual one-face projected A_k from calibrated dimensions/drawing-specific geometry or traceable planimetry. Length × width is only a verified rectangular case; do not substitute a bounding box for a shaped unit. Sum actual A_k of unique first releases as Q; keep net unit/component mass independently measured for physical balances. No guessed kg per unit, fixed kg/m2, density from a secondary property, doubled pane area, service life or manufacturer certification."
      unit: "m2 and independently measured kg"
      frequency: "each unit and first release"
      temporal_coverage: "full declared release cohort"
      site_scope: "selected production gate after all required tests"
      aggregation_rule: "per reference flow"
      quality_evidence: "dimension/scale calibration; actual tests; unique release log"
    - protocol_id: cp_handling
      process_id: "handling"
      flow_role: "FG services and each individual packaging movement"
      record_type: "raw_stock_and_dispatch_records"
      raw_fields: "original release/delivery/cohort IDs; opening/closing FG and each exchange vector; gross dispatch and external unit return; reverse original assignment; material additions/removals and gas/water changes; repair/testing/service raw readings; each packaging article composition and mass; mutually exclusive empty attached-WIP attached-FG reusable opening/closing quantities; new purchased; supplier-included receipt; externalreturnreceived; grossout; externalreturnsent; waste; internalreuse; repair and water changes; uncertainty"
      collection_method: "Scan/count and independently weigh/tare actual units and each packaging direction; stocktake mutually exclusive states and retain supplier-inclusion flags, original cohort history and original-delivery reversal separately from changed physical-return mass/state. Source permission to rewarm surplus sealant or correct molten corners is not permission to repair a failed/broken IGU. Rework/replacement/cleaning is included only when actual manufacturer/system compatibility instructions and acceptance/testing permit it; otherwise retain actual reject/discard and the gap, not an assumed successful repair. Record each actual new/removed pane, profile/joint, bead, sealant, cleaning or gas/water direction and independently measured old/new masses/state with its own specific atomic card before complete data is claimed; no equal-weight, reusable-old-glass/seal/desiccant, repairability or life-extension assumption. Keep original first-release area Q/history fixed and actual incremental service on that cohort. Released custody includes permitted work-in-progress once: either within explicit released-FG substates or as disjoint repair-WIP opening/closing quantities, never both. Materially changed/new route needs renewed applicability."
      unit: "native counts mass area and energy units"
      frequency: "each movement and periodic stocktake"
      temporal_coverage: "reporting period with full historical cohort links"
      site_scope: "actual storage/packing/dispatch service gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch/return tickets; stocktakes; composition; moisture/repair evidence; original burden reversal"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert original raw units before attribution: measured kWh × 3.6 = MJ; kg from calibrated net weighing; actual one-face whole-unit projected m2 from cp_release. Use measured length × width only for a verified rectangular unit; other actual shapes require their own traceable measured-outline area determination, not a bounding box. An integrated liquid/gas volume is already a quantity and is not multiplied by time again; integrate only true rates. Volume-to-mass needs independently measured density of that actual substance at its declared state, not water density, a fixed kg/m2 or a secondary flow-property factor."
      inputs:
        - "raw readings"
        - calibration
        - "actual state"
        - cp_release
      output: "converted raw quantities"
      source_ids:
        - lisec-qualitypass-2024
        - ilcd-attributional-2010
    - id: attribute_raw
      applies_to: "all inventory rows"
      rule: "Reconcile raw physical movements and every inherited exchange vector before normalization, retaining original undivided records. A_j is the exchange in the declared reporting view attributed to the same release cohort after conversions and evidenced assignment/stock carry/allocation. Gross physical Product/waste/package/return directions retain measured real quantities with their own burden vectors; burden shares, reuse or a corrected-consumption ledger cannot shrink an actual gross movement. Gas/species environmental A_j is separately derived from the paired gross records under cp_gases and balance_water_gas, with the same evidenced passthrough removed on both corresponding sides; retain raw physical quantities and never add both views. Manufacturing vectors include all new first-released output even when closing FG, without subtracting that assigned production again; prior released FG is not new current manufacture. Retain failures/Q=0, all disjoint raw/WIP/hold-up/non-WIP histories and true incremental handling service. Old/returned FG services keep original release-area Q, service horizon and history, not unrelated new-period Q. Separately evidence unused transfers versus spent/waste/leaked charge/tool quantities and their remaining/consumed vectors. If capital-equipment service is included, its actual physical stocks/acquisitions/retirements stay separate from the per-exchange service burden. Correct measured consumption OR its proved equivalent stock/vector account once, not both."
      inputs:
        - "converted raw quantities"
        - "cohort vectors"
        - "allocation evidence"
      output: "A_j"
      source_ids:
        - ilcd-attributional-2010
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "q_j = A_j / Q for Q > 0. Execute this division once after convert_raw and attribute_raw; q_j is the exchange per 1 m2 reference flow. For Q = 0 keep A_j and all physical/history records with no unit result. Cards and protocol aggregation reference this same result and never divide again."
      inputs:
        - A_j
        - Q
        - convert_raw
        - attribute_raw
        - cp_release
      output: "q_j per 1 m2 reference flow"
      source_ids:
        - ilcd-attributional-2010
    - id: balance_manufacture
      applies_to: "manufacture"
      rule: "For each same material/element and declared physical gate close opening disjoint raw/WIP/recoverable hold-up and included non-WIP stocks + all actual gross external physical inputs = corresponding closing disjoint stocks + newly first-released whole-unit mass + every actual gross external Product/waste/species outflow. Link the separately recorded equipment-fluid/tooling stocks of boundary_stocks; cancel only matched internal transfers with real losses and energy retained. Gross atmospheric intake and gross gas/water outflow are used together here: never retain gross intake while replacing its outlet by a net environmental amount. A separately derived paired net environmental view must reduce both matched unchanged inlet and outlet by the same evidenced passthrough; raw gross and net views are linked alternatives, never additive. Retained cavity species and actual adsorbed water are already included once in full released/WIP masses. Newly released mass includes both panes, frame/joints, beads with actual water, both seals and cavity gas. Area Q is not mass, and closing already-released FG is not a further manufacturing output. Do not fit two unknowns with one residual or double-count embedded components."
      inputs:
        - "physical masses"
        - "species assays"
        - "stock quantities"
        - cp_manufacture
        - cp_gases
        - cp_release
      output: "independent material and element residuals"
      source_ids:
        - guardian-glasstime-2022
        - fenzi-molver-2021
    - id: balance_fg
      applies_to: "handling"
      rule: "For each FG cohort opening physical FG + internal newly released receipt + actual external returned units + actual added parts/species/water = closing physical FG + gross physical unit shipments + discarded FG + actually removed material/species/water. Maintain original burden vector separately; no second production output for closing FG. Cancel internal first-release handover in the combined manufacturing/FG gate. If already-released repair-held units are separately identified as repair WIP, include their disjoint opening and closing physical component/state terms once; otherwise explicitly include them within released-FG custody stock. Never assume original delivery mass/contents equal a changed physical return. Repair remains conditional on the actual instruction/compatibility/acceptance gate of cp_handling; broken/failed glass is not restored by bookkeeping."
      inputs:
        - "FG physical stocks"
        - "gross dispatch"
        - returns
        - additions
        - removals
        - cp_handling
      output: "cohort FG mass and area reconciliation"
      source_ids:
        - ilcd-attributional-2010
        - guardian-glasstime-2022
    - id: balance_packaging
      applies_to: "handling"
      rule: "For each packaging article separately: opening empty + opening attached-WIP + opening attached-FG + opening reusable + new separately purchased + supplier-included arriving + externalreturnreceived = closing empty + closing attached-WIP + closing attached-FG + closing reusable + gross physically shipped outward + externalreturnsent + waste. Stock buckets are mutually exclusive; internal reuse cancels. Measure actual cork/wood water change and repair new/removed components separately if present, with their own atomic flows; track quality/history vectors. No net-shipment shortcut or automatic repurchase/credit."
      inputs:
        - "each article movement"
        - stocktakes
        - moisture
        - repair
        - cp_handling
      output: "per-article gross physical reconciliation"
      source_ids:
        - bostik-igu-hotmelt
        - fenzi-aluminium-spacer
        - fenzi-molver-2021
    - id: balance_water_gas
      applies_to: "manufacture and handling"
      rule: "Keep free wash water, supplied formulation water, bead residual/structural water, adsorbed moisture, humid-air intake/outflow and actual condensate as different physical accounts at the same control volume. Independently measure water and species transfers; retained/desorbed moisture is not fictitious reaction water. Thermoplastic cooling creates no assumed gas stoichiometry. Gross N2/O2/Ar/CO2/H2O passthrough is paired before identifying actual net species changes; COD/VOC/total-element indicators are not species masses."
      inputs:
        - "independent water/species observations"
        - "actual gas state"
        - cp_gases
        - cp_manufacture
      output: "water and individual-species balances"
      source_ids:
        - guardian-glasstime-2022
        - fenzi-molver-2021
        - bostik-igu-hotmelt
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Match actual type, composition, formulation, CAS, particle/form, route, geography, voltage, medium and reference property; UUID is identity rather than provider approval. Preserve all stated native restrictions on each row. Unbound auxiliary identity cannot become an unspecified collection."
      evidence: "direct native records; supplier SDS/TDS; test and provider documents"
    - id: dq_complete
      applies_to: "raw inventory and stocks"
      requirement: "Cover the full period including failure/zero output, all stock layers and equipment charges. Maintain per-exchange inherited vectors and original cohort/service attribution. Unknown, absent, measured zero and below detection are different; report unresolved physical residuals honestly."
      evidence: "raw stock/meter records; balance residuals and uncertainty"
    - id: dq_sources
      applies_to: "all constrained rules"
      requirement: "Retain primary scope and alternatives. This synthesis does not assert a common plant/SKU or transfer supplier numbers across products. Industrial sources do not support allocation. Standards mentioned by manufacturers require the actual applicable version and real test evidence; product claims alone are not conformity."
      evidence: "primary originals and full context; actual specification and test records"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset applicability"
    rule: "Verify two annealed uncoated panes, aluminium/desiccant frame, separate PIB primary and thermoplastic hot-melt secondary, air fill and protected edge terminal. Reject mirror, single-seal, TPS, inert-gas, reactive-seal or structural/exposed-edge substitution under this route."
    source_ids:
      - guardian-glasstime-2022
      - bostik-igu-hotmelt
      - fenzi-hotver-2000
  - rule_id: validate_gate
    applies_to: "Q and first_release"
    rule: "Require unique first-release/test evidence and one-face whole-unit area; verify the explicitly linked Product output equals 1 m2 and no new Q from retest/returns. Separate both pane masses and cavity contents. No manufacture output for closing FG in addition to Q."
    source_ids:
      - guardian-glasstime-2022
      - bostik-5000-application
  - rule_id: validate_accounting
    applies_to: "all inventories"
    rule: "Check complete manufacturing/FG/combined mass gates, each relevant element and species, raw-to-converted-to-attributed quantities, complete historical vectors, packaging gross equation and exactly one normalize_exchange operation. Q=0 has real raw burden and no unit result. Do not close two unknowns with one residual or characterize whole wastewater as a chemical."
    source_ids:
      - ilcd-attributional-2010
      - fenzi-molver-2021
      - guardian-glasstime-2022
  - rule_id: validate_release
    applies_to: "quality and usability"
    rule: "Retain actual applicable product/system specification, geometric/edge-seal checks, primary continuity, secondary wetting/depth/corners, desiccant condition, cooling/handling support and actual test results before first release. A handling-time brochure figure, UUID or projection pass proves neither quality conformity nor scientific approval. Missing terminal tests or core route evidence prevents a ready dataset; future site-specific quantities and auxiliary UUIDs remain required without invented defaults."
    source_ids:
      - guardian-glasstime-2022
      - bostik-5000-application
      - lisec-qualitypass-2024
      - fenzi-molver-2021
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared unframed insulating-glass input to compatible downstream window/building models"
  allowed_use: "Same specified air-filled two-pane dual-seal route with actual measured configuration and full burdens"
  excluded_use: "Mirror or all-CPC coverage; thermal equivalence; certification; complete window; unsupported route or default factory inventory"
  required_metadata: "site and reporting period; first quality-release gate and unique cohort IDs; two uncoated annealed soda-lime panes and suppliers; pane dimensions thickness edge preparation and full supplier burden; single-face projected whole-unit area including sealed edge; aluminium spacer alloy geometry joint composition and desiccant filling; 3A bead grade size supplied moisture and exposure; whole PIB primary formulation and hot-melt secondary formulation; nozzle temperature wetting corner continuity seal depth cooling and release tests; air cavity gas composition humidity temperature pressure and retained mass; protected edge application and excluded structural exposed-edge use; opening closing WIP FG equipment fluids and per-exchange inherited vectors; gross packaging movements composition moisture repair and stocks; actual electricity voltage geography mix and water supply/treatment boundary; independent species balances uncertainty and receiving destinations; attributional allocation applicability causal drivers and residual market evidence"
  required_quality_disclosure: "Actual quality/test coverage; source limits; supply identity restrictions; unbound rows; measured residuals; uncertainty; allocation and stock/cohort history; no invented quantities"
  update_trigger: "Change in terminal, pane treatment/coating, gas, spacer, seal chemistry, supply state, specification, allocation evidence or physical stock method"
data_sources:
  - id: "guardian-glasstime-2022"
    type: "handbook"
    reference: "Guardian GlassTime, August 2022, §§2.1–2.4 and 9.2.5; https://www.guardianglass.com/content/dam/guardianindustriesholdings/technical/europe/GlassTimeHandbook_EN_0822.pdf"
    used_for: "Unit architecture; dry-air drawing; dual barriers; UV exclusions; dimensional inspection context. No default performance or inert-gas recipe."
  - id: "bostik-igu-hotmelt"
    type: "handbook"
    reference: "Bostik, Smart Seal Good Feel, 2018 brochure, pp.3–6; https://www.bostik.com/files/live/sites/shared_bostik/files/import-uk/bostik-insulating-glass.pdf"
    used_for: "Compounded PIB primary and one-part butyl hot-melt secondary supply; heated application and cooling; drum/block alternatives and final limitations. Marketing waste/timing figures are not inventory defaults."
  - id: "bostik-5000-application"
    type: "handbook"
    reference: "BOSTIK 5000 product overview and Applications & Features, snapshot 2026-10-20; https://www.bostik.com/uk/en_GB/catalog/product/f/bostik_dg_butyl_ig_emea/p/bostik-5000/"
    used_for: "Heated dispenser; nozzle-temperature checks; wetting and corner/seal-depth checks; support under both panes. Page announces a new version; historical route support only."
  - id: "fenzi-hotver-2000"
    type: "handbook"
    reference: "Fenzi Hotver 2000 product/application/storage text, snapshot 2026-10-20; https://www.fenzigroup.com/en/products/igu/sealants/hotver/hotver-2000"
    used_for: "Independent one-part thermoplastic secondary-seal example; clean dry substrate; rewarming surplus; single-seal counterexample excluded. Brand-specific temperatures and certification claims are not transferred."
  - id: "lisec-vhw-f-washing"
    type: "handbook"
    reference: "LiSEC VHW-F full product page, snapshot 2026-10-20; https://www.lisec.com/solutions/individual-machines/detail/wash/vhw-f"
    used_for: "Washing zones; treated water; blower drying; heating and cleaning; optional circulation. This is component-level evidence rather than one complete factory."
  - id: "lisec-bsv-spacer-forming"
    type: "handbook"
    reference: "LiSEC BSV-45ANK full product page, snapshot 2026-10-20; https://www.lisec.com/solutions/individual-machines/detail/frame-processing/bsv-45ank"
    used_for: "Profile sawing; connection; bending geometry; aluminium subset. Plastic hot bending is an excluded alternative."
  - id: "lisec-qualitypass-2024"
    type: "handbook"
    reference: "LiSEC, lis.qualitypass – Traceable quality in insulating glass production, 23 April 2024; retained full page snapshot 2026-10-20; https://blog.lisec.com/qualitypass"
    used_for: "Linking pressure/temperature/time and structure to automatic and manual quality records. Software deployment and its version requirements are not PCR requirements."
  - id: "fenzi-molver-2021"
    type: "handbook"
    reference: "Fenzi MOLVER MGM 01 Technical Data Sheet, Revision 08 October 2021, complete one-page original hosted by Tecglass; https://tecglass.es/wp-content/uploads/2021/11/MOLVER-MGM-01_Technical-Data-Sheet_20211019.pdf"
    used_for: "3A granular desiccant compatible with hot-melt second barriers; water adsorption and residual-water distinction; supply packaging. No dose or adsorption yield default."
  - id: "fenzi-aluminium-spacer"
    type: "handbook"
    reference: "Fenzi Aluminum Spacer H65, snapshot 2026-10-20; https://www.fenzigroup.com/en/products/igu/spacers/conventional/aluminum-h65"
    used_for: "Supplied aluminium-alloy spacer profile and optional connectors; cardboard/steel supply containers. No assumed connector composition or universal profile dimension."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA, Detailed guidance, first edition March 2010, §7.9.3 pp.257–258; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation cases only: subdivision; determining exchange-specific physical causality; residual actual-state common-gate market value. No recipe, emission factor, stock formula or automatic credit."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:dd63186a2c46c2c90f2562136fed7ef60dca12d069d48052419d0da9c3d755d4"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6604"
      family: "system_boundary"
      span:
        start:
          offset: 6604
          line: 57
          column: 1
        end:
          offset: 12110
          line: 78
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Prepared cut-to-size uncoated annealed soda-lime glass panes; fabricated aluminium profiles; whole purchased bead/sealant supplies |\n| starting_condition_role | Burden-bearing raw assembly inputs; not finished insulating units |\n| product_classification_scope | Narrower part of CPC3.0:37116; no mirror coverage |\n| recursive_input_rule | Same-category purchased finished units are separate burden-bearing resale/service articles outside new Q; matched internal release transfers cancel |\n| upstream_dataset_requirement | Match full supplied pane manufacture through its preparation and each actual profile/formulation/utility provider; no free raw inputs or duplicated supplier-included packaging burden |\n| disclosure | Declare start/release/service gates; actual configuration and tests; every stock/history vector; gas/water control volumes; packaging gross balances; native restrictions and uncertainty |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_route` | manufacture | Begin with fully burdened purchased prepared panes and supplied profile, beads and sealant formulations. Include receiving and damage; washing and blower drying; profile sawing/bending/jointing; desiccant filling; heated PIB application; alignment and pressing around ambient-derived air; hot-melt secondary filling and corner correction; cooling; actual inspection/testing and first release. This is a transparent synthesis of compatible primary operations, not one contemporary SKU/factory. No purchased finished-IGU repacking substitute. | `guardian-glasstime-2022`; `lisec-vhw-f-washing`; `lisec-bsv-spacer-forming`; `bostik-igu-hotmelt`; `fenzi-molver-2021` |\n| `boundary_release` | manufacture and handling | Q is the sum of one-face overall projected areas of unique units at their first required quality release in the reporting cohort. Opening already-released FG, reinspection, delivery and external returns never create Q. Destructive specimens and pre-release rejects are excluded. Newly released closing FG is already in Q; do not add it as another production output. Keep packing/storage/lifting/dispatch in the handling service account; cancel matched first_release/released_in internal handover on consolidation. | `guardian-glasstime-2022`; `bostik-5000-application` |\n| `boundary_stocks` | all physical stocks | Keep physical quantities and a separate historical upstream/foreground exchange vector for every raw stock, WIP cohort, released FG cohort, equipment oil/tank liquid and recoverable sealant hold-up. Opening WIP carries actual inherited burdens; closing WIP carries actual unfinished burdens forward. Allocate all current activity including zero-output failures, warmup, idle, start/stop, cleanup, tests and rework before normalization. Correct raw stock changes once only. Equipment charges are not WIP. Include actual tooling and every other included non-WIP stock with independently measured physical quantity and each inherited vector; do not infer stock from allocated burden or treat a service share as a reduced physical article. If durable-equipment service is inside the declared capital boundary, retain its actual physical units/mass, additions/handovers/retirements and independent service-vector attribution without guessed kg/item or lifetime; actual specific exchanges need their own cards. | `ilcd-attributional-2010`; `lisec-vhw-f-washing`; `bostik-igu-hotmelt` |\n| `boundary_complete` | actual exchanges | Every real input/export must have an individual physically or chemically named row with real quantity, unit, state and destination. Add any actual chemical, maintenance part, fuel, heat, water treatment flow, cleaning article, airborne species or leak absent from these conditional cards; neither other nor a zero can hide it. Supplier formulation ingredients already included are subaccounts, not duplicate purchases. For actual external heat/steam add separate supply and Product condensate/heat-transfer-water return with actual mass, phase, pressure, temperature, enthalpy and supplier water/energy convention; the electric route presumes no boiler. Where external steam really occurs, add a separate thermal-energy supply row and a physical steam-water mass input row plus each actual condensate/return/waste/vapour direction. Identify one upstream steam provider/burden owner; the linked mass and heat views must not buy the same supply twice or use MJ as a water-mass balance. Quantities/conversions require actual phase/state/enthalpy and supplier inclusion evidence, never an assumed steam system. | `lisec-vhw-f-washing`; `bostik-igu-hotmelt`; `ilcd-attributional-2010` |\n| `boundary_exclusions` | applicability | This category excludes mirrors, glass melting/float forming as foreground, coated/laminated/toughened-pane manufacture, inert-gas enrichment, vacuum glazing, triple units, TPS or flexible spacers, reactive two-component sealants, single-seal units, structural silicone glazing, exposed organic-seal edges, frames and installation/use/end-of-life. Upstream prepared-pane manufacture remains fully burdened. An actual on-site extra operation requires its full specific submodel and applicability review; do not silently extend this narrower route. No insulation-performance equivalence to low-E argon glazing is claimed. | `guardian-glasstime-2022`; `fenzi-hotver-2000`; `lisec-bsv-spacer-forming` |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 336
              line: 10
              column: 1
            end:
              offset: 425
              line: 10
              column: 90
          text: "# Dual-sealed air-filled double insulating glass units with hot-melt butyl secondary seal"
          depth: 1
        - kind: "heading"
          span:
            start:
              offset: 6604
              line: 57
              column: 1
            end:
              offset: 6625
              line: 57
              column: 22
          text: "## 5. System Boundary"
          depth: 2
      ancestor_context:
        - span:
            start:
              offset: 0
              line: 1
              column: 1
