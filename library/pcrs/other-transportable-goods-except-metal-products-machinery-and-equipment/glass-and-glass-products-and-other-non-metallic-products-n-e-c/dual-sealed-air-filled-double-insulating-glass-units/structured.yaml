              column: 1
          markdown: "---\n"
    - unit_id: "normative_135632"
      family: "allocation"
      span:
        start:
          offset: 135632
          line: 1407
          column: 1
        end:
          offset: 140429
          line: 1417
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocate_direct` | all exchanges | Apply only in attributional cases requiring allocation. First use dedicated measurements and actual/virtual subdivision, assigning embodied articles and directly attributable tests, failures and service to the relevant release cohort. Keep gross physical outputs independent from burden shares. | `ilcd-attributional-2010` |\n| `allocate_causal` | remaining shared exchanges | For each remaining exchange demonstrate the determining physical causal relationship specific to that exchange and function. Metered heater time/load, washing cycles or actual heated sealant demand may be investigated, but neither mass nor area nor energy nor a convenient shared fraction is automatically causal. Retain evidence and sensitivity separately for each exchange. | `ilcd-attributional-2010` |\n| `allocate_residual` | genuine unassignable residual | Only for genuinely remaining inseparable multifunctional burdens use documented contemporaneous market values for actual coproducts in their actual state at the same common process gate. Separate quantity, actual price, currency/date, moisture/quality and gate, then disclose shares and sensitivity. No arbitrary physical/economic choice, fixed percentage, universal price or default avoided-burden credit. A waste sale, internal reuse or return does not automatically create a coproduct. | `ilcd-attributional-2010` |\n| `allocate_returns` | FG and packaging | Retain original release and delivery IDs. Reverse the original delivery/burden assignment before a returned unit is redelivered; retain actual material removals/additions, moisture/gas changes and incremental repair/test/service burden on its original cohort. Historical manufacture is not recharged to unrelated current Q. Record damaged units and stock loss rather than silently deleting them. Packaging gross physical balance does not depend on allocated life shares. | `ilcd-attributional-2010`; `bostik-5000-application` |\n| asset_manufacture_conservation | existing capital/reusable manufacture attribution | Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory. |  |\n\n"
