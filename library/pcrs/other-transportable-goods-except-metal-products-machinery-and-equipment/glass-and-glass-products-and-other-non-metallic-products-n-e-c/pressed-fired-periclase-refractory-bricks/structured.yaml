system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Begin with actual natural-magnesite-derived dead-burned periclase aggregate and actual whole aqueous magnesium sulfate binder supplies. Include receiving transport storage crushing screening fraction control fine milling mixing pressing deaeration drying ceramic firing cooling required grinding/cleaning inspection destructive tests reject handling emissions control and first final release. Upstream aggregate calcination and dead-burning must be represented in the compatible supplier dataset; in-house versions require their real inputs fuels reaction gases losses and outputs rather than a duplicate bought aggregate. Bought finished-brick wrapping is a different route."
      source_ids:
        - unido-magnesite-brick-trials-1986
        - jrc-ceramic-bref-2007
    - rule_id: b_primary
      applies_to: "route applicability"
      rule: "The narrow route is a transparent technical synthesis: UNIDO chapterVI M-A demonstrates natural DBM-A periclase with minor calcium silicates aqueous sulfate binder hydraulic pressing drying industrial tunnel firing and actual fired brick tests; BREF sections2.3.3.1–2.3.3.8 support industrial operation variants and necessary finishing. Trial amounts temperatures porosity and strengths are case observations not universal defaults. M-BF/M-BS modified feed and chapterVII chromium-bearing bricks are distinct cases. BREF Fig2.16 includes chromite and is not an instruction to add chromium; its carbon-bonded curing/pitch impregnation route is excluded. No single contemporary SKU/factory is claimed to implement all conditional rows."
      source_ids:
        - unido-magnesite-brick-trials-1986
        - jrc-ceramic-bref-2007
    - rule_id: b_stocks
      applies_to: "manufacturing numerator"
      rule: "Keep each exchange in its native extensive unit with its own opening/closing inherited burden vector for raw stores unreleased WIP and unassigned non-WIP stores. Retain all failed zero-output trial start/stop idle cleanup rework kiln-furniture maintenance and abatement burdens. Already first-released closing FG is inside Q: neither subtract its manufacturing burden as Bclose nor add its mass to Q again. Unreleased fired ware remains WIP until actual final acceptance. Use actual cohort/operation attribution rather than a blanket production-volume percentage."
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - rule_id: b_service
      applies_to: "post-release service"
      rule: "Preserve first-release manufacturing history by original cohort c. Storage packing handling dispatch returns retest and actual finishing rework after that gate are observed incremental services with original Qc and horizon H; current-period output and net deliveries are not their denominators. Dispatch retest and returned reinspection do not create production. Retain actual FG opening/closing states gross G external returns R moisture/fragment changes and real incremental rework; cancel the internal released-brick handoff on consolidation. This PCR does not use a net-delivery Q; a switch requires a reviewed full G/R/original-delivery reversal and inherited FG burden bridge. Actual post-release work requires manufacturer/procedure or governing-specification permission, defined post-work tests and recorded acceptance/disposition while remaining the same bare uncoated fired periclase brick and declared grade/dimensions/duty. A broken or failed brick is not restored by accounting; hold/reject remains unless eligibility is independently demonstrated. Retain actual new/removed material water fragments and phase transfers; repair-held custody is an FG substate OR disjoint repair-WIP once, never new Q."
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - rule_id: b_atomic
      applies_to: "all exchanges"
      rule: "Every actually present purchased formulation ingredient fuel energy carrier water packaging article replacement part asset receipt waste and real emitted species needs one physically/chemically specific row. Add each actual unlisted exchange before modelling. Not applicable requires evidence of absence; zero below detection missing and unknown are distinct. Keep whole purchased formulations once; assay active ions solvent/crystal water and minor phases are subledgers. For true in-house preparation record each actual purchased feed and energy/loss stream instead. No other collection or assumed-zero manufacturing input is allowed."
      source_ids:
        - unido-magnesite-brick-trials-1986
        - jrc-ceramic-bref-2007
    - rule_id: b_physical
      applies_to: "physical gates"
      rule: "Close gross mass and relevant element balances independently of LCA burden allocation at manufacturing service and consolidated gates. Actual air intake/exhaust species phases water fuel carrier mass steam/hot-water carrier returns solids liquid wastes and inventories must reconcile. Do not add total air or an effluent aggregate to its constituent exchanges at the same boundary. Bulk oxide-equivalent assay COD VOC total boron total carbon NOx or PM is not a named chemical species. Sulfate conversion residual carbonate hydration/dehydroxylation and free/crystal/reaction water require independent evidence; one residual cannot fit two unknown reactions/species."
      source_ids:
        - unido-magnesite-brick-trials-1986
        - jrc-ceramic-bref-2007
    - rule_id: b_pack
      applies_to: "each packaging pool"
      rule: "For each actually used film pallet and strap and every additional real article retain separate empty-stock attached-WIP attached-FG and reusable opening/closing subpools plus new purchases inbound supplier articles externally returned articles gross shipment departures outward supplier/owner returns and waste. Internal reuse/transfers cancel; use actual gross physical movements without economic-share scaling. Packaging is outside dry bare-brick Q; repeated reuse is not repeated procurement and no automatic coproduct credit applies. Each pool also retains actual material/water X_in and X_out not already counted in another flow term, including new/removed repair parts wood residues and moisture uptake/release. Deduplicate X only against other flow terms; actual retained ingress and its measured closing stock mass must both remain."
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - rule_id: b_assets
      applies_to: "equipment and fluids"
      rule: "Keep each actual press kiln die lining setter maintenance part and installed fluid stock as physical receipts/returns/installations/removals/retirements independently from its period service burden. No fixed lifetime one complete machine per kilogram or physical stock multiplied by economic burden share is allowed. Separate drained fluids new/refurbished parts moisture and contamination from dry metal/refractory article mass; actual maintenance electricity fuel water dust and waste remain foreground."
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
