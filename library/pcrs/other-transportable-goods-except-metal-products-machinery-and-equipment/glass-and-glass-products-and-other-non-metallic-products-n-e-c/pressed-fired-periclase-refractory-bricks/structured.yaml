allocation_rules:
  - rule_id: a_framework
    applies_to: "goal and modelling framework"
    rule: "Use attributional modelling only where the study goal justifies allocation; do not freely choose allocation versus substitution. Keep waste treatment and internal reprocessing responsibilities explicit. Industrial manufacturing documents establish route facts and do not establish allocation policy."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_dedicate
    applies_to: "each exchange"
    rule: "First collect dedicated operation/recipe/lot data or physically subdivide the system. If that is infeasible use supported virtual subdivision to assign each actually dedicated input emission service and waste to the receiving product/cohort before any residual allocation. Record why subdivision cannot remove each remaining common item."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_causal
    applies_to: "each remaining inventory exchange"
    rule: "Identify and quantify the exchange-specific determining physical causal relationship; material incorporated process heat actual moisture removal kiln load/hot-face heat loss pressing work and shared transport/storage services can have different causal drivers. A mass ratio energy ratio occupied area or time alone is not automatically causal. Use measured engineering relationships with counterchecks; no one blanket physical allocation applies to all flows."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "genuinely unresolved common process items"
    rule: "Only after documenting the lack of a determining physical causal relationship for a specific residual common item may contemporaneous representative market value be used at the actual common-process exit/entry gate and actual quantity quality moisture packaging and technical state. Use prices for those same states/time/geography; strip later product-specific finishing packaging freight and storage values where outside that gate. Quantify sensitivities; unknown prices are not zero or permission for a fixed share."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_scrap
    applies_to: "rejects recycling and co-products"
    rule: "Internal recovered powder or green scrap cancels as transfer with its inherited vector; actual extra processing and losses remain. A sale of waste does not by itself establish a co-product or avoided-production credit. For an actual externally traded secondary product verify state quality receiving process and allocation responsibility at its true common gate; never reduce gross material/packaging/asset masses by the burden share."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first final release"
      record_type: "quality-release and weighing records"
      raw_fields: "lot and unique release IDs; grade and dimensions; as-weighed bare mass; packaging tare; free moisture; dry bare mass; acceptance time; phase chemistry defects porosity and strength/thermal results; rejected/test specimens; closing released FG"
      collection_method: "Use calibrated traceable scales and validated representative moisture sampling of actual bare bricks at first final acceptance; bind dimensions/grade and tests to the same batch. Keep reported test conditions and actual acceptance specification; no copied test-piece guarantees. Collect undivided unique release mass records and reconcile once into Q under calc_release; no exchange normalization here."
      unit: "kg"
      frequency: "each lot and release"
      temporal_coverage: "whole period including failures and carryover lots"
      site_scope: "declared site and final acceptance gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration chain moisture method traceable lot tests first-release registry"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each whole supplied ingredient"
      record_type: "receipt recipe assay and consumption ledgers"
      raw_fields: "row_id; supplied grade route form hydrate; complete formulation mass; concentration assay and impurity/phase records; free/crystal water; receipts issues spills returns; raw/WIP opening and closing; inherited vector by native exchange; supplier boundary"
      collection_method: "Weigh whole deliveries/issues on calibrated systems; obtain actual supplier SDS/phase/assay evidence and site inventory checks. For in-house binder record separately bought salt water energy losses and cleaning; external formulation constituents remain subledgers. Collect raw undivided per-row totals; state conversion and real attribution precede calc_unit_result; do not divide here."
      unit: "kg"
      frequency: "each delivery lot and period reconciliation"
      temporal_coverage: "full manufacturing period and carryover"
      site_scope: "receipt preparation mixing and stores"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale assay phase supplier documents counts and vector provenance"
    - protocol_id: cp_route
      process_id: "manufacture"
      flow_role: "operation-resolved manufacturing"
      record_type: "batch travellers machine/kiln and quality logs"
      raw_fields: "lot and operation IDs; coarse/fine masses and grading; binder addition; press configuration pressure cycles deaeration; drying humidity and time; firing temperature atmosphere schedule loads cooling; grinding tools stock removal; quality gates; every failure idle cleaning start/stop and rework mode"
      collection_method: "Trace each real operation and lot with synchronized logs and meters; use actual scale and sensor calibrations. Record deviations and rejected/zero-output loads rather than excluding them. The historic trial demonstrates route not universal settings. Raw operation totals only; retain internal transfer pairing and inherited vectors; use calc_attribution before calc_unit_result once."
      unit: "row native unit; kg; degC; h; cycle"
      frequency: "continuous plus each batch/event"
      temporal_coverage: "full period all operating modes"
      site_scope: "all included operations and shared equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "time synchronization calibration batch genealogy deviations and controls"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "each actual utility fuel or external heat"
      record_type: "meters fuel invoices state analysis and balances"
      raw_fields: "row_id and meter; start/end integrated readings; actual rate timebase where relevant; kWh or MJ; gas/oil volume and state; composition independent density LHV; steam kg pressure temperature dryness supply/return enthalpy; supplier water-energy convention; interval operation/cohort allocation; failures and idle use"
      collection_method: "Read calibrated meter differences; integrate genuine rates only. Measure each fluid composition/density at stated pressure temperature moisture and independent calorific/enthalpy evidence. Pair external carriers and returns; include actual fan compressor treatment and maintenance use. Raw undivided readings; calc_convert then calc_attribution then final unit result under calc_unit_result; no division in collection."
      unit: "each row native unit; MJ; kWh; m3; kg"
      frequency: "meter interval event and billing reconciliation"
      temporal_coverage: "full period including start/stop and Q0"
      site_scope: "actual utility interfaces and submeters"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration fuel assay state LHV/enthalpy supplier boundary and meter closure"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "each actual liquid water/effluent"
      record_type: "water meters weighings analyses and destination records"
      raw_fields: "row_id; integrated volume; true rates and time; measured temperature pressure density; actual intake treatment quality; internal circulation; independent free/bound water solids dissolved species and indicators; returns effluent sludge evaporation; stock vectors"
      collection_method: "Measure actual gross liquid streams with calibrated meters/scales and representative analyses; keep water source and receiving/treatment boundary. Density belongs to this liquid at this state; do not use a default water density for a salt solution oil sludge or gas. Collect raw undivided streams; no per-Q division; calc_convert and calc_physical precede the one final unit-result rule."
      unit: "each row native unit; m3; kg"
      frequency: "interval and discharge/treatment batch"
      temporal_coverage: "complete period and water stocks"
      site_scope: "actual wet operations utilities and treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter closure sampling state density destination and detection limits"
    - protocol_id: cp_gas
      process_id: "manufacture"
      flow_role: "each inlet/exhaust species"
      record_type: "gas monitoring speciation phase and material balances"
      raw_fields: "row_id; chemical/CAS phase origin medium; inlet and outlet state humidity composition; integrated dry/wet gas volume or genuine rate time series; species concentrations units detection limits; fossil/mineral/background carbon; sulfur/hydrate reaction evidence; dust mass size and independent phase; abatement capture stock and destination"
      collection_method: "Use actual calibrated gas volume/state and species-specific monitoring; integrate rates only and correct concentration and gas volume to the same dry/wet pressure-temperature basis. Independently characterize actual particle phase/size and reaction-water sources. NOx/VOC/COD total indicators do not establish component masses. Raw species totals only with separate physical origins and no aggregate duplication; use calc_convert/calc_physical/calc_attribution before calc_unit_result once."
      unit: "kg; m3; native concentration and state units"
      frequency: "continuous plus representative events/operating modes"
      temporal_coverage: "full period all startup shutdown failures and treatment"
      site_scope: "actual inlet process fugitive and stack locations"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration speciation phase medium source origin state limits and independent closure"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each specific waste stream"
      record_type: "weighbridge waste transfer recovery and analysis"
      raw_fields: "row_id; wet gross and dry solids; water and real phases/species; operation and lot; internal recycle external dispatch; destination treatment; rejects destructive samples dust sludge sorbent; stocks inherited vectors"
      collection_method: "Weigh each segregated actual stream and sample moisture/composition independently; reconcile internal recycle pairs and retain added processing burdens. Document actual external treatment/secondary-product status rather than assume a credit. Raw undivided wet/dry stream records and vector attribution; do not divide or credit here."
      unit: "kg"
      frequency: "each waste batch plus period closure"
      temporal_coverage: "complete period including failures cleanup"
      site_scope: "actual manufacturing and waste gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale sampling transfer permits destination and recovery records"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "each asset part tool filter or fluid"
      record_type: "asset service maintenance and physical stock ledger"
      raw_fields: "row_id; actual configuration material moisture and installed fluid; new/refurbished receipt return; opening and closing installed/store stock; issue remove wear breakage retirement; maintenance inputs and waste; actual operation/service driver inherited and remaining burden"
      collection_method: "Use traceable inventory weighings supplier configurations and maintenance logs; measure actual fluid and article separately. Derive service burden only from actual usage/remaining service evidence and actual repair/replacement; unknown lifetime is not an invented amortization. Raw physical movements are not economically scaled; current service vector enters calc_attribution/calc_unit_result only once; no whole-asset-per-kg shortcut."
      unit: "kg; actual service-driver units"
      frequency: "each receipt installation repair and retirement"
      temporal_coverage: "period plus traceable historical service"
      site_scope: "actual equipment tools abatement and fluid pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "configuration weighings stock service-driver evidence maintenance and fluid reconciliation"
    - protocol_id: cp_logistics
      process_id: "manufacture"
      flow_role: "each actual freight service"
      record_type: "shipment vehicle payload route and delivered-supply records"
      raw_fields: "row_id; actual shipment mass; vehicle payload; route distance; empty returns; supplier delivery convention; product/cohort assignment; service limiting factor"
      collection_method: "Use real transport records and payload weighings; establish whether mass volume or another actual factor determines the service. Do not add a second freight provider if already supplied. Raw payload and distance; calc_convert and actual allocation before final result; no division here."
      unit: "t*km"
      frequency: "each trip and reconciled period"
      temporal_coverage: "actual included trips"
      site_scope: "real supply-to-site legs"
      aggregation_rule: "per reference flow"
      quality_evidence: "waybill weighbridge distance evidence supplier boundary and causal allocation"
    - protocol_id: cp_packaging_m
      process_id: "manufacture"
      flow_role: "each actual packaging article pool"
      record_type: "physical packaging pool and purchase/return ledger"
      raw_fields: "row_id and article specification; ownership moisture attached residues; measured item mass if counting; opening/closing empty attached-WIP attached-FG reusable stocks; new purchase inbound supplier pack external return received; gross shipment departures outward supplier/owner return waste; internal reuse and pool transfer; inherited burden history ; actual new/old repair parts wood residues and phase-specific water X_in/X_out; duplicate-flow-term register; actual retained ingress and measured closing composition/moisture"
      collection_method: "Weigh actual complete article or calibrate item mass for the actual configuration/moisture; trace every gross movement and stock subpool. Reconcile separately for each material and process/cohort; reused/returned objects are not automatically new purchases. Raw gross physical movements only; calc_packaging closes stocks; attributable burdens or service increments reference calc_unit_result once with the correct Q or original Qc. Record all real material/water additions and removals per pool. Retained actual ingress and measured closing mass coexist; X is deduplicated only against other flow terms, not stock attachment."
      unit: "kg; measured item counts as raw subledger"
      frequency: "each purchase receipt dispatch return and stocktake"
      temporal_coverage: "complete period plus linked service horizon"
      site_scope: "manufacturing inbound and post-release service pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "article specification weighings purchase invoices transfer/return logs moisture and historical ownership"
    - protocol_id: cp_packaging_s
      process_id: "service"
      flow_role: "each actual packaging article pool"
      record_type: "physical packaging pool and purchase/return ledger"
      raw_fields: "row_id and article specification; ownership moisture attached residues; measured item mass if counting; opening/closing empty attached-WIP attached-FG reusable stocks; new purchase inbound supplier pack external return received; gross shipment departures outward supplier/owner return waste; internal reuse and pool transfer; inherited burden history; original cohort c; original first-release Qc; actual observed horizon H ; actual new/old repair parts wood residues and phase-specific water X_in/X_out; duplicate-flow-term register; actual retained ingress and measured closing composition/moisture"
      collection_method: "Weigh actual complete article or calibrate item mass for the actual configuration/moisture; trace every gross movement and stock subpool. Reconcile separately for each material and process/cohort; reused/returned objects are not automatically new purchases. Bind each service movement and incremental burden to cp_service original cohort/Qc/H records. Raw gross physical movements only; calc_packaging closes stocks; attributable burdens or service increments reference calc_unit_result once with the correct Q or original Qc. Record all real material/water additions and removals per pool. Retained actual ingress and measured closing mass coexist; X is deduplicated only against other flow terms, not stock attachment."
      unit: "kg; measured item counts as raw subledger"
      frequency: "each purchase receipt dispatch return and stocktake"
      temporal_coverage: "complete period plus linked service horizon"
      site_scope: "manufacturing inbound and post-release service pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "article specification weighings purchase invoices transfer/return logs moisture and historical ownership"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "each original-cohort service exchange"
      record_type: "observed FG logistics retest and incremental rework"
      raw_fields: "row_id; original cohort c original first-release dry Qc and release IDs; observation horizon H; opening/closing FG physical state and historical vector; actual handoff gross G external R; original dispatched identities and entries actually reversed; added/removed water fragments losses; actual incremental electricity water finishing tools dust sludge effluent evaporation; dedicated/causal allocation ; actual manufacturer/procedure/specification work permission; post-work tests and acceptance/disposition; repair-held FG substate or disjoint repair-WIP; actual new/old parts material water and phase additions/removals"
      collection_method: "Observe actual operations and state-resolved weighings for the declared horizon; retrieve historical first-release evidence and bind every movement to its cohort. Do not assume return mass equals original shipment; preserve actual state changes and charge only real incremental operations. Add atomic fuel/species/tool rows for any additional actual rework before modelling. Collect raw S_i_c_H and gross physical movements only; no predivision. The unique calc_unit_result uses original Qc once; current Q or net deliveries never replace Qc. Confirm b_service permission, post-work tests, acceptance/disposition and unchanged applicable article grade/dimensions/duty for every actual event; never assume broken-brick restoration. Retain unaccepted stocks repair custody and actual material/water changes without loss or double count."
      unit: "each row native unit; kg; MJ; m3"
      frequency: "each movement service interval return and retest"
      temporal_coverage: "explicit observed H and complete original cohort trace"
      site_scope: "actual post-release site/storage/handling gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "historic release registry calibrated state weighings service logs return/reversal evidence and coverage"
  calculation_rules:
    - id: calc_release
      applies_to: "finished_brick"
      rule: "Q = sum of independently measured dry bare mass of unique first-final-release bricks in the declared period; include released closing FG once and exclude unreleased WIP packaging rejects and destructive test specimens. If Q=0 retain actual burdens and provide no unit result. No count-to-kg value is assumed."
      inputs:
        - cp_release
        - unique_release_ids
        - measured_dry_bare_mass
      output: "Q"
      source_ids:
        - unido-magnesite-brick-trials-1986
        - jrc-ceramic-bref-2007
    - id: calc_convert
      applies_to: "all inventory rows"
      rule: "Convert actual raw units/state before attribution: MJ_elec = 3.6 * measured_kWh; integrated gas/liquid volumes are totals and are never multiplied by time again; only true rates are integrated. m_i = independently_measured_density_i_at_state * actual_volume_i_at_same_state. Heat/carrier mass use actual LHV or supply/return enthalpy and supplier convention as linked dimensions of one provider. A native secondary mass coefficient is not independent density evidence. Actual item counts need measured net article mass for the same configuration/moisture; Item(s) and item are the same physical count with factor1 but never establish kg. This PCR has no area Q and no assumed rectangle or two-face area."
      inputs:
        - cp_utility
        - cp_water
        - cp_gas
        - cp_material
        - cp_packaging_m
        - cp_packaging_s
        - cp_asset
        - cp_logistics
        - raw_state_records
      output: "converted_raw_i"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "For each exchange native extensive unit construct A_i = Bopen_i + E_i - Bclose_i after real dedicated/subdivided and exchange-specific causal attribution and only justified residual common-item allocation. E_i includes all actual failures start/stop idle cleanup rework treatment and maintenance. Bopen/Bclose are inherited vectors of raw stores unreleased WIP and unassigned non-WIP stores; already-released FG is excluded from Bclose because its manufacture is in Q. Do not sum unlike units or economically scale physical stocks. For service keep raw incremental S_i_c_H for original cohort c and observed H with its own actual attribution; historical FG manufacturing vectors remain attached but are not newly incurred service burdens. Ordinary manufacturing waste breakage samples export or sale do not automatically remove caused manufacturing/treatment burden. Assignment to a real other cohort/function requires justified allocation or burden handover with per-vector evidence once. Distinguish receipts/purchases from already corrected actual consumption; no second stock correction. Actually performed original-cohort services remain assigned under original Qc/H even when FG stays in stock; only genuinely unconsumed and unassigned charge/service inventories carry, without deducting completed service."
      inputs:
        - converted_raw_i
        - opening_vectors
        - closing_vectors
        - allocation_evidence
        - cp_route
        - cp_material
        - cp_service
      output: "A_i; S_i_c_H"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: calc_unit_result
      applies_to: "all inventory rows"
      rule: "I_i = A_i / Q for manufacture; J_i_c_H = S_i_c_H / Qc for original-cohort service. This is the only per-reference division and is performed once after conversion and attribution; Qc is the original cohort first-release dry mass and H the actually observed service horizon. Cards and aggregation reference these final results without dividing again. Q=0 or Qc=0 retains raw burdens with no corresponding unit result; no net-delivery denominator. Gross physical FG packaging asset and carrier movements remain complete raw closure ledgers; any diagnostic per-reference display is derived once here on the same Q/Qc and is not new procurement or current LCI burden. Historical burdens travel separately and only real current increments enter the service vector."
      inputs:
        - A_i
        - Q
        - S_i_c_H
        - Qc
        - H
        - cp_release
        - cp_service
      output: "I_i; J_i_c_H"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: calc_physical
      applies_to: "physical balances"
      rule: "For manufacturing and service separately: opening physical stocks + actual external receipts + actual physical internal handoffs = closing physical stocks + actual gross physical external outputs + counterpart internal handoffs. Consolidation cancels internal handoffs including first-release Q; use actual wet/dry/phase state bridges. Run total mass and relevant Mg Ca Si Fe Al S B C H O balances independently using actual species/carrier and test/waste evidence. Mineral assays expressed as oxides are not phase/species inventories. Free moisture crystal/hydroxyl water and reaction water are independent; a total mass residual is a diagnostic not a fit for two unknowns. Physically reconcile all actual air constituents without a duplicate air total exchange. Retain unresolved residuals and missing evidence; no assumed closed balance."
      inputs:
        - cp_material
        - cp_release
        - cp_gas
        - cp_water
        - cp_waste
        - cp_asset
        - cp_packaging_m
        - cp_packaging_s
        - cp_service
        - independent_species_and_state_evidence
      output: "gross_mass_and_element_ledgers"
      source_ids:
        - unido-magnesite-brick-trials-1986
        - jrc-ceramic-bref-2007
    - id: calc_packaging
      applies_to: "each packaging article"
      rule: "For each article/process/cohort pool: opening_empty + opening_attached_WIP + opening_attached_FG + opening_reusable + new_purchases + inbound_supplier_pack + external_returns_received + X_in_material_water = closing_empty + closing_attached_WIP + closing_attached_FG + closing_reusable + with_gross_dispatch_out + external_supplier_owner_returns + waste + X_out_material_water. Pair actual inter-pool transfers and cancel internal reuse; moisture/residue/component changes need measured bridges. Keep all physical terms gross and independent of economic burden shares; article mass never enters bare-brick Q. Only actual new purchase and evidenced incremental repair/service burden enter attribution, without duplicate delivered-supply burden. X_in_material_water and X_out_material_water are actual new/removed repair material water wood and residues only when not already recorded in another flow term. Deduplicate only against other flow terms; retaining actual ingress in closing stock does not cancel that ingress or the measured closing composition/moisture mass. No assumed restoration or fixed moisture content."
      inputs:
        - cp_packaging_m
        - cp_packaging_s
        - article_pool_records
        - measured_article_state
      output: "article_stock_closure"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: calc_assets
      applies_to: "each physical asset and installed fluid"
      rule: "Opening equipment/part/fluid stock + actual new/refurbished external receipts + external repair returns = closing stock + actual outward returns/retirements + measured wear/loss/waste; pair internal installation/removal transfers. Separate fluid water and retained contaminants from article dry mass. Actual period service burden is evidenced independently by usage service capacity maintenance and remaining-history records and then attributed; it is not the physical stock movement itself or an invented fixed-life fraction."
      inputs:
        - cp_asset
        - physical_asset_records
        - actual_service_evidence
      output: "physical_asset_closure; period_service_vector"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: calc_service_bridge
      applies_to: "service"
      rule: "For each original cohort and observed state reconcile opening_FG + actual_released_handoff + actual_external_returns_received + actual_measured_added_material_or_water = closing_FG + gross_G + actual_brick_waste + measured_removed_water_and_separately_named_fragments. Retain the full corresponding historical manufacturing vector ledger and document actual original entries reversed for a return. Return mass is measured rather than equated to its original dispatch; delivery/retest do not create new Q. Service increments S_i_c_H alone feed calc_unit_result with original Qc; internal handoff Q cancels on consolidation. closing_FG includes repair-held substates OR adds disjoint repair-WIP once, without lost or double custody. Actual material/water ingress retained at closing remains; deduplicate against other flow terms, not closing attachment. Apply b_service permission post-work test and acceptance/disposition gates."
      inputs:
        - cp_service
        - original_Qc
        - H
        - historical_FG_vectors
        - actual_state_changes
        - reversal_records
      output: "cohort_gross_and_burden_bridge"
      source_ids:
        - jrc-ceramic-bref-2007
        - jrc-ilcd-allocation-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all selected identities"
      requirement: "Every used UUID requires actual native family form route CAS state geography medium type and reference-property compatibility; supplier/grade gaps remain declared. Wrong-identity candidates do not fill blanks."
      evidence: "full native records exact chains actual supplier/phase evidence and complete consumed descriptions"
    - id: dq_primary
      applies_to: "route and terminal"
      requirement: "Retain complete source context actual product states neighboring counterexamples and trial limitations; historic tests are not contemporary factory measurements or universal ranges. Full source acquisition and current extraction are distinct provenance events."
      evidence: "UNIDO trial with actual phase/terminal tests; BREF context; actual future plant release records"
    - id: dq_measure
      applies_to: "all measured extensive records"
      requirement: "Keep calibration raw units exact state timestamps operating coverage uncertainty detection limits and independent conversion evidence; no assumed density item mass recipe yield or zero burden."
      evidence: "calibration trace time/state-matched analyses and raw-to-result audit"
    - id: dq_cohorts
      applies_to: "stocks release services"
      requirement: "Preserve every native-unit inherited vector and physical lot history; explain raw/WIP deferral closing released FG manufacture service horizon and original Qc; quantify unresolved closure instead of inventing a fit."
      evidence: "stocktake release registry raw vector lineage original return/reversal and service records"
    - id: dq_completeness
      applies_to: "all operations and species"
      requirement: "Add each actual unlisted input output maintenance part gas phase and packaging article. Preserve failures Q0 idle cleanup treatment and unresolved species; actual missing quantities are incomplete data and no scientific pass is inferred from a mechanical check."
      evidence: "mode/event and full atomic exchange register physical/element diagnostics provider and source coverage"
    - id: dq_allocation
      applies_to: "multifunctionality"
      requirement: "Document study framework dedication/subdivision each determining physical cause and only genuine residual common-item market values with actual gate/state/time and sensitivity; no fixed shares or automatic credits."
      evidence: "ILCD allocation rationale exchange-level evidence same-state market records and sensitivity"
validation_rules:
  - rule_id: v_core
    applies_to: "reference product"
    rule: "Require a proper query member and full public direct native record for one physically compatible manufactured Product family plus the exact reference-property/unit-group/unit chain. The selected generic fired-refractory-brick family is narrowed by the complete card context. Wrong mineral powder unfired ware siliceous-earth insulation crucible or incompatible native route cannot fill core identity. A finite check does not approve applicability or science."
    source_ids:
      - unido-magnesite-brick-trials-1986
      - jrc-ceramic-bref-2007
  - rule_id: v_reference
    applies_to: "reference and release"
    rule: "Reference amount is1kg dry bare first-release brick; one explicit finished_brick row links the functional unit. Verify unique first-release IDs and actual chemistry phase grade geometry defect/porosity mechanical/thermal criteria and final cooling/finishing state. Q includes already-released closing FG once; destructive tests rejects delivery and retest do not add Q."
    source_ids:
      - unido-magnesite-brick-trials-1986
      - jrc-ceramic-bref-2007
  - rule_id: v_units
    applies_to: "all inventories"
    rule: "Use the native extensive property for each row; kg is not a requirement for MJ m3 or t*km. Raw records precede state/rate conversion and real attribution; exactly one calculation rule produces A_i/Q or S_i_c_H/Qc once. Cards and aggregation only reference that result. Q0 retains actual burdens and produces no per-unit result. Unsupported/unknown conversions remain explicit and cannot be claimed passing."
    source_ids:
      - jrc-ceramic-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: v_physical
    applies_to: "mass element species and heat"
    rule: "Independently reconcile real gross mass and relevant elements using inlet/outlet water air species residual carbonate sulfate/hydrate state actual solids liquid wastes inventories and external carrier returns. Phase/spatial/media evidence is required for each species; total indicators cannot substitute. Do not fit multiple unknowns from one mass residual or copy a water density to oil solution or gas. State/enthalpy and supplier convention must support any purchased heat."
    source_ids:
      - unido-magnesite-brick-trials-1986
      - jrc-ceramic-bref-2007
  - rule_id: v_pools
    applies_to: "manufacture service packaging and assets"
    rule: "Verify every exchange inherited raw/WIP/unassigned-store vector; do not subtract closing released FG manufacturing burden. Service records bind original Qc and H plus historical FG vectors gross G/R actual moisture and fragment changes and documented original entry reversals. For each packaging article and asset/installed-fluid pool verify complete gross receipts issues returns stocks and waste; internal transfers cancel on consolidation."
    source_ids:
      - jrc-ceramic-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: v_evidence
    applies_to: "coverage and uncertainty"
    rule: "Require all qualifier elements full card descriptions collection fields source_ids and source records in the consumed projection. Verify actual provider/route/form/CAS/geography/media/type and all native property restrictions before selecting UUIDs. A blank auxiliary UUID or future factory quantity is an ordinary collection gap rather than automatic draft; a real core terminal/identity/method gap is a hold. Zero below detection absent unmeasured and unresolved species remain different. Engineering status neither approves science translation accepted mapping nor publication."
    source_ids:
      - unido-magnesite-brick-trials-1986
      - jrc-ceramic-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual compatible fired periclase-brick supply in a downstream lining construction or industrial-equipment model; separately declared observed services may be attached with original Qc/H"
  allowed_use: "Use only matching declared chemistry phase dense bare fired state route site/time/provider and native unit; disclose complete measured inventory quality uncertainty and service horizon"
  excluded_use: "No general coverage claim for all refractory goods; no unfired castable diatomite crucible carbon-bonded chromite/spinel/doloma proxy; no fixed lifetime performance guarantee industry numeric default automatic credit or net-delivery denominator"
  required_metadata: "actual site period region provider and starting supply state; natural magnesite derived dead-burned periclase aggregate grade assay phase and minor calcium-silicate chemistry; whole magnesium sulfate aqueous formulation or actual in-house salt hydrate and solvent route; coarse/fine grading and pressing deaeration drying ceramic firing cooling and finishing configuration; dense bare uncoated non-carbon-bonded non-chromite constructional brick geometry and measured net dry mass; actual final defect dimensional phase porosity mechanical and thermal acceptance tests; unique first-release identifiers Q including already-released closing FG and unreleased WIP distinction; opening/closing raw WIP and unassigned-store per-exchange inherited burden vectors; failed zero-output trial start/stop idle cleanup rework and abatement operation records; original service cohort Qc observed horizon H and actual FG gross dispatch return and state-change bridge; each packaging empty attached-WIP attached-FG reusable pool gross receipts purchases returns departures and wastes; equipment mould lining setter and installed-fluid physical stocks versus current service burden; actual species CAS phase origin medium native-property restrictions and independent mass/element evidence; carrier mass energy supply/return enthalpy supplier water convention and actual conversion evidence; unresolved identities quantities providers reaction fates uncertainty and coverage limits"
  required_quality_disclosure: "actual primary measurements data/provider completeness all operating modes raw/WIP/FG vectors species/state evidence allocation rationale native restrictions and all unresolved fields; engineering qualification is distinct from scientific/translation review"
  update_trigger: "changed aggregate origin chemistry binder supplied state hydrate forming/firing/finishing route terminal specification fuel/utility/provider native reference versions emissions control stocks cohort service horizon or evidence revealing an identity/method contradiction"
data_sources:
  - id: "unido-magnesite-brick-trials-1986"
    type: "official_guidance"
    reference: "UNIDO / Research Institute Magnohrom. Assistance in Laboratory Scale Investigation on Magnesite Ore and Magnesite Bricks — Zimbabwe Final Report UC/ZIM/85/199; 30 June1986; https://downloads.unido.org/ot/48/13/4813041/15001-20000_15961.pdf"
    used_for: "Complete primary trial report; chapterVI printed pp58–76 establishes natural DBM-A to M-A aqueous sulfate-bound pressed dried industrially fired brick chemistry physical tests and periclase/calcium-silicate phase evidence. Printed p59 image1720degC overrides erroneous existing text layer1120. M-BF/M-BS and chapterVII chromium routes are distinct counterexamples. Not a universal recipe/dose/energy range or allocation rule."
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission JRC. Reference Document on Best Available Techniques in the Ceramic Manufacturing Industry; August2007; sections2.3.3.1–2.3.3.8 and general processing/finishing context; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf"
    used_for: "Raw preparation shaping drying ceramic firing finishing sorting packaging protection industrial utility/waste/emission candidates and route exclusions. Fig2.16 is chromium-bearing; tables2.9–2.12 are case data rather than defaults; carbon-bonded tempering/pitch impregnation does not establish this fired periclase route. Foreground protocols specify future real measurement; no copied factory values or allocation policy."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook — General guide for Life Cycle Assessment — Detailed guidance; first edition2010; chapter7.9 especially7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality only where allocation is justified: dedicated and physical/virtual subdivision then exchange-specific determining physical causality then only genuinely residual common-process items using representative contemporaneous market value at actual process gate and technical state. Supports explicit service/cohort responsibility and sensitivity; does not establish industrial materials firing recipes or scientific approval."
