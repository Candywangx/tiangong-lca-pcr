measurement_rules:
  - id: reference_product_mass
    applies_to: "net accepted reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize every exchange to 1,000 kg of saleable, quality-accepted sheets after edge trimming and rejection; exclude packing mass."
  - id: area_mass_conversion
    applies_to: "conversion between area and mass"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use mass = accepted area × measured mean thickness × measured product density. If measured density is unavailable for soda-lime-silicate glass, 2,500 kg/m3 may be used only as the EN 572-1 conventional calculation value and must be disclosed; do not use it for a different composition without evidence."
  - id: thickness_area_records
    applies_to: "each saleable product group"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record accepted area and thickness distribution by product group; do not convert a mixed-thickness output using one undeclared nominal thickness."
  - id: cullet_fraction
    applies_to: "batch cullet statement"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg/kg batch"
    rule: "Calculate internal, pre-consumer external and post-consumer cullet separately on a dry batch-input mass basis; report their sum and do not count internally returned edge trim as external recycled content."
  - id: cutting_yield
    applies_to: "inspection and cutting"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg/kg ribbon input"
    rule: "Cutting yield equals net accepted unpacked sheet mass divided by annealed ribbon mass entering inspection/cutting for the same reporting boundary."
  - id: optical_iron_declaration
    applies_to: "product identity and performance qualifier"
    required_property_ref:
      name: "declared test property"
      uuid: ""
    required_unit: "declared method unit"
    rule: "Declare either measured total iron/iron-oxide content or an applicable light-transmittance specification and test method. Low-iron, tinted and coated variants shall not inherit ordinary-clear performance."
