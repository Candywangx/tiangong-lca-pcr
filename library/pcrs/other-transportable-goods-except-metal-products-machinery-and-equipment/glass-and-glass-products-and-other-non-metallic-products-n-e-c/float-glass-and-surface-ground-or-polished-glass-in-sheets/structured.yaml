system_boundary:
  rules:
    - rule_id: boundary_inputs
      applies_to: "cradle-to-gate foreground data package"
      rule: "Include receiving and preparation of virgin batch materials, separately identified cullet, fuels, electricity, water, process gases, tin make-up, coating or polishing materials when applicable, and packaging."
      source_ids:
        - nga-flat-glass-pcr-2020
        - eu-jrc-glass-bref-2013
    - rule_id: boundary_core
      applies_to: "required manufacturing"
      rule: "Include batching, melting/refining, float forming on molten tin, annealing, inspection, edge trimming, cutting, internal cullet return, quality rejection and packing."
      source_ids:
        - eu-jrc-glass-bref-2013
        - eurofloat-epd-2024
        - vitro-flat-glass-epd-2024
    - rule_id: boundary_conditionals
      applies_to: "route-specific manufacturing"
      rule: "Include online coating and surface grinding/polishing only when performed before the declared gate; record them as separate conditional processes."
      source_ids:
        - unsd-hs-7005
        - eu-jrc-glass-bref-2013
    - rule_id: boundary_gate
      applies_to: "delivery state"
      rule: "End at the factory gate with quality-accepted, unworked sheets in the declared jumbo or cut stock-sheet and packing state."
      source_ids:
        - nga-flat-glass-pcr-2020
        - eurofloat-epd-2024
    - rule_id: boundary_exclusions
      applies_to: "downstream products and use/end-of-life"
      rule: "Exclude tempering, heat strengthening, laminating, insulating-unit assembly, silvering/mirror manufacture, offline/downstream coating, installation, use and end-of-life; model any brought-in operation separately and do not relabel it as category-wide float-glass production."
      source_ids:
        - unsd-cpc-3-0-explanatory-notes-2025
        - unsd-hs-7005
        - nga-flat-glass-pcr-2020
    - rule_id: boundary_cutoff
      applies_to: "omitted flows"
      rule: "Seek complete mass and energy balance. Any cutoff shall be disclosed and justified; a flow expected to be environmentally relevant shall be included regardless of mass."
      source_ids:
        - nga-flat-glass-pcr-2020
