                basis_kind: "process_output"
                evidence_kind: "reasoned_estimate"
                source_ids: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "product groups, lines and conditional processes"
    rule: "First avoid allocation through meter separation, production-line or campaign subdivision, and separate modelling of online coating or surface finishing."
    source_ids:
      - nga-flat-glass-pcr-2020
  - rule_id: allocation_recycled_glass
    applies_to: "internal and external cullet"
    rule: "Internal edge trim and rejects returned within the site carry forward the burdens already inside the system and receive no recycled-content credit. External cullet shall use the recycled-material convention required by the declared study framework, with origin and any collection/processing burdens disclosed."
    source_ids:
      - nga-flat-glass-pcr-2020
  - rule_id: allocation_shared_energy
    applies_to: "shared furnace, utilities and lehr"
    rule: "After subdivision is exhausted, allocate shared mass/energy-driven burdens by a documented physical relationship such as mass, energy demand or operating time that reflects causality."
    source_ids:
      - nga-flat-glass-pcr-2020
  - rule_id: allocation_coproducts
    applies_to: "saleable co-products"
    rule: "If a co-product with material economic value remains and physical causality cannot be established, use economic allocation with contemporaneous prices and disclose a sensitivity result."
    source_ids:
      - nga-flat-glass-pcr-2020
  - rule_id: allocation_no_avoided_burden
    applies_to: "exported cullet, heat or by-products"
    rule: "Do not subtract an avoided burden inside the core product inventory unless the declared LCA framework explicitly requires system expansion; report exports and method separately."
    source_ids:
      - nga-flat-glass-pcr-2020
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_materials
      process_id: "batch_preparation"
      flow_role: "virgin batch materials and prepared batch"
      record_type: "batch ticket and stock reconciliation"
      raw_fields: "material id; supplier; wet mass; moisture; dry mass; formulation; batch id"
      collection_method: "calibrated scale plus stock reconciliation"
      unit: "kg dry"
      frequency: "per batch and monthly reconciliation"
      temporal_coverage: "representative reporting period, normally 12 months"
      site_scope: "each included float line/site"
      aggregation_rule: "sum dry constituent masses and normalize to accepted output"
      quality_evidence: "scale calibration; batch tickets; purchase/stock records"
    - protocol_id: cp_cullet_inputs
      process_id: "batch_preparation"
      flow_role: "internal and external cullet"
      record_type: "cullet charge and origin record"
      raw_fields: "mass; internal/external; pre/post-consumer; contamination; supplier; batch"
      collection_method: "calibrated scale and origin documentation"
      unit: "kg dry"
      frequency: "per charge or lot"
      temporal_coverage: "same period as output"
      site_scope: "each included site"
      aggregation_rule: "sum by origin; calculate fractions on total dry batch input"
      quality_evidence: "scale calibration; supplier declarations; internal return log"
    - protocol_id: cp_energy_carriers
      process_id: "melting_refining_annealing"
      flow_role: "fuel and electricity"
      record_type: "meter, invoice and lower-heating-value record"
      raw_fields: "carrier; physical quantity; energy; meter id; process assignment; supplier/grid mix"
      collection_method: "calibrated meter; invoice reconciliation; documented shared-meter allocation"
      unit: "MJ LHV; kWh"
      frequency: "continuous/monthly"
      temporal_coverage: "same period as output"
      site_scope: "each furnace and included utilities"
      aggregation_rule: "sum by carrier and allocate only after subdivision"
      quality_evidence: "meter calibration; invoices; allocation worksheet"
    - protocol_id: cp_furnace_mass_balance
      process_id: "melting_refining"
      flow_role: "molten refined glass"
      record_type: "furnace production balance"
      raw_fields: "batch input; cullet; volatilization estimate; pull rate; transferred mass; period"
      collection_method: "production controls reconciled to mass inputs and outputs"
      unit: "kg"
      frequency: "shift/daily, monthly reconciliation"
      temporal_coverage: "same period as output"
      site_scope: "each furnace"
      aggregation_rule: "reconcile furnace pull to downstream ribbon and losses"
      quality_evidence: "control-system export; signed reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "melting_refining"
      flow_role: "direct furnace emissions"
      record_type: "stack monitoring and calculation record"
      raw_fields: "substance; compartment; concentration; gas flow; fuel/carbonate input; method; uncertainty"
      collection_method: "continuous/periodic monitoring or documented mass/emission calculation"
      unit: "kg"
      frequency: "permit frequency, aggregated monthly"
      temporal_coverage: "same period as output"
      site_scope: "each included stack"
      aggregation_rule: "calculate by substance and normalize to accepted output"
      quality_evidence: "monitoring QA/QC; laboratory report; calculation file"
    - protocol_id: cp_process_materials
      process_id: "float_forming"
      flow_role: "tin-bath operating inputs"
      record_type: "meter and stock record"
      raw_fields: "material; purchase; opening/closing stock; replenishment; gas conditions"
      collection_method: "meter or inventory reconciliation"
      unit: "kg; Nm3 with conditions"
      frequency: "continuous/monthly"
      temporal_coverage: "same period as output"
      site_scope: "each tin bath"
      aggregation_rule: "convert gas volume with declared conditions and sum by flow"
      quality_evidence: "meter calibration; inventory reconciliation"
    - protocol_id: cp_ribbon_output
      process_id: "float_forming_annealing"
      flow_role: "ribbon output"
      record_type: "line production record"
      raw_fields: "timestamp; width; length; thickness; density basis; mass; product group"
      collection_method: "line sensors reconciled with weighbridge/product records"
      unit: "m2; mm; kg"
      frequency: "continuous"
      temporal_coverage: "same period as output"
      site_scope: "each included line"
      aggregation_rule: "calculate mass by group and reconcile to accepted output plus cullet"
      quality_evidence: "sensor calibration; production reports"
    - protocol_id: cp_conditional_process_inputs
      process_id: "surface_finishing_online_coating"
      flow_role: "conditional process inputs"
      record_type: "meter, recipe and issue record"
      raw_fields: "product group; material; chemistry; quantity; meter; treated area/mass"
      collection_method: "process meter and material issue reconciliation"
      unit: "kg; m3; kWh; MJ"
      frequency: "per campaign/monthly"
      temporal_coverage: "same period as conditional output"
      site_scope: "each applicable process"
      aggregation_rule: "sum only for products receiving the operation"
      quality_evidence: "recipes; meter calibration; issue records"
    - protocol_id: cp_conditional_process_outputs
      process_id: "surface_finishing_online_coating"
      flow_role: "conditional process output"
      record_type: "production and quality record"
      raw_fields: "input mass; accepted output; rejects; treated face; removed thickness or coating specification"
      collection_method: "production system and quality inspection"
      unit: "kg; m2; mm"
      frequency: "per lot/campaign"
      temporal_coverage: "same period as output"
      site_scope: "each applicable process"
      aggregation_rule: "sum accepted output by declared treatment"
      quality_evidence: "inspection/test reports; production records"
    - protocol_id: cp_cutting_packing_inputs
      process_id: "inspection_cutting_packing"
      flow_role: "cutting electricity and packaging"
      record_type: "meter and material issue record"
      raw_fields: "electricity; material id; issue mass; returned stock; product group"
      collection_method: "submeter or documented allocation plus stock reconciliation"
      unit: "kWh; kg"
      frequency: "monthly"
      temporal_coverage: "same period as output"
      site_scope: "each cutting/packing area"
      aggregation_rule: "sum by input and normalize to accepted output"
      quality_evidence: "meter data; purchase/stock reconciliation"
    - protocol_id: cp_cutting_yield
      process_id: "inspection_cutting_packing"
      flow_role: "edge trim, rejects and breakage"
      record_type: "cutting and rejection log"
      raw_fields: "ribbon input mass; accepted mass; edge trim; reject reason; breakage; internal return; external destination"
      collection_method: "line mass/area records and calibrated scales"
      unit: "kg"
      frequency: "shift/lot, monthly reconciliation"
      temporal_coverage: "same period as output"
      site_scope: "each included line"
      aggregation_rule: "yield = accepted mass / ribbon input; reconcile every residual by destination"
      quality_evidence: "scale/sensor calibration; rejection and transfer records"
    - protocol_id: cp_accepted_sheet_output
      process_id: "inspection_cutting_packing"
      flow_role: "accepted reference product"
      record_type: "shipment, packing and quality record"
      raw_fields: "product group; glass kind; state; thickness; dimensions; area; net mass; packing mass; coating; optical/iron result"
      collection_method: "calibrated scale or validated area-thickness-density calculation linked to acceptance"
      unit: "kg; m2; mm"
      frequency: "per pack/lot"
      temporal_coverage: "same period as inputs"
      site_scope: "each included cutting and packing area"
      aggregation_rule: "sum net accepted mass by product group; exclude packing mass"
      quality_evidence: "calibration; calculation check; test certificate; shipment record"
  calculation_rules:
    - id: calc_area_mass
      applies_to: "sheet mass from geometry"
      rule: "mass_kg = accepted_area_m2 × mean_thickness_m × density_kg_per_m3; retain unrounded intermediate values"
      inputs:
        - cp_ribbon_output
        - cp_accepted_sheet_output
      output: "kg sheet glass"
      source_ids:
        - en-572-1-2012
    - id: calc_cullet_fraction
      applies_to: "cullet content"
      rule: "cullet fraction by origin = dry cullet mass by origin / total dry batch-input mass; total cullet is the sum of origin fractions"
      inputs:
        - cp_batch_materials
        - cp_cullet_inputs
      output: "kg/kg dry batch input"
      source_ids:
        - nga-flat-glass-pcr-2020
        - eu-jrc-glass-bref-2013
    - id: calc_cutting_yield
      applies_to: "inspection/cutting yield"
      rule: "cutting yield = net accepted unpacked sheet mass / annealed ribbon mass entering inspection/cutting"
      inputs:
        - cp_ribbon_output
        - cp_cutting_yield
        - cp_accepted_sheet_output
      output: "kg/kg ribbon input"
      source_ids: []
    - id: calc_reference_normalization
      applies_to: "all inventory exchanges"
      rule: "normalized exchange = reporting-period exchange × 1,000 kg / reporting-period net accepted reference-product mass"
      inputs:
        - "all applicable collection protocols"
      output: "exchange per 1,000 kg reference product"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "each process and full foreground system"
      rule: "input mass = product output + internally transferred cullet + exported waste + releases + documented stock change; explain non-measured residuals"
      inputs:
        - batch
        - furnace
        - ribbon
        - "cutting and output records"
      output: "reconciled mass balance and residual"
      source_ids:
        - eu-jrc-glass-bref-2013
  data_quality_requirements:
    - id: dq_representativeness
      applies_to: "foreground period and product mix"
      requirement: "Use a period representative of stable continuous operation, normally at least 12 consecutive months; disclose shutdowns, rebuilds, abnormal campaigns and product-mix weighting."
      evidence: "dated production and operating records"
    - id: dq_primary_data
      applies_to: "controlled foreground processes"
      requirement: "Use primary site data for all included operations under operational control and report coverage by mass and energy."
      evidence: "meters, batch records, production records and coverage calculation"
    - id: dq_identity
      applies_to: "each declared product group"
      requirement: "Link ordinary/low-iron/tinted state, ground/polished state, coating status, thickness, dimensions and optical/iron evidence to the output group."
      evidence: "specification, test certificate and production master data"
    - id: dq_energy
      applies_to: "furnace, lehr and auxiliaries"
      requirement: "Keep fuels and electricity separate, state heating-value basis, electricity mix and shared-meter allocation; do not infer a fuel/electricity split from sector totals."
      evidence: "meter/invoice reconciliation and allocation worksheet"
    - id: dq_mass_balance
      applies_to: "batch through saleable sheet"
      requirement: "Reconcile dry batch, cullet, molten/ribbon transfers, accepted output, internal returns, exported waste, emissions and stock change; investigate material residuals."
      evidence: "signed mass-balance worksheet"
    - id: dq_secondary_data
      applies_to: "upstream datasets"
      requirement: "Select temporally, geographically and technologically representative datasets and document substitutions and data age."
      evidence: "dataset register and data-quality assessment"
    - id: dq_reasoned_estimate
      applies_to: "provisional cutting-yield QA range"
      requirement: "Treat the 0.80–1.00 range only as a replaceable author screening value; it is neither a default inventory value nor a performance, legal or conformance threshold."
      evidence: "explicit estimate label and replacement review"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "The product resolves to CPC 3.0 37113 and declares glass kind, applicable surface state, thickness, dimensions, delivery state and online-coating status."
    source_ids:
      - unsd-cpc-3-0-explanatory-notes-2025
      - unsd-hs-7005
  - rule_id: validate_reference_flow
    applies_to: "reference flow"
    rule: "Net accepted unpacked output equals 1,000 kg and uses product flow 1b43024e-16ea-42d2-830d-329c4a2abc3d, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass group 93a60a57-a4c8-11da-a746-0800200b9a66, and kg."
    source_ids: []
  - rule_id: validate_area_mass
    applies_to: "geometry conversion"
    rule: "Every area-to-mass conversion identifies area, thickness and density; use of 2,500 kg/m3 is limited to the disclosed EN 572-1 conventional soda-lime-silicate calculation value."
    source_ids:
      - en-572-1-2012
  - rule_id: validate_optical_iron
    applies_to: "product qualifier"
    rule: "Iron content or applicable light-transmittance evidence is product-group specific and identifies the test/specification method; no category-wide value is inferred."
    source_ids:
      - en-572-1-2012
  - rule_id: validate_cullet
    applies_to: "cullet statement"
    rule: "Internal, pre-consumer external and post-consumer cullet masses and fractions are separately reported and reconcile to total dry batch input."
    source_ids:
      - nga-flat-glass-pcr-2020
      - eu-jrc-glass-bref-2013
  - rule_id: validate_processes
    applies_to: "process map"
    rule: "Melting/fuels/electricity, tin bath, annealing and inspection/cutting are present; surface finishing and online coating are included only when applicable and remain separately visible."
    source_ids:
      - eu-jrc-glass-bref-2013
  - rule_id: validate_yield
    applies_to: "cutting and mass balance"
    rule: "Ribbon input, accepted output, internal return, external waste and stock change reconcile, and cutting yield is reported; a value outside the reasoned-estimate screen triggers review but not automatic nonconformance."
    source_ids: []
  - rule_id: validate_exclusions
    applies_to: "scope protection"
    rule: "Tempering, laminating, insulating-unit assembly, mirrors, offline coating and downstream fabrication are excluded or modelled as explicitly separate downstream processes; photovoltaic cover glass is not generalized to the whole category."
    source_ids:
      - unsd-hs-7005
      - nga-flat-glass-pcr-2020
  - rule_id: validate_sources
    applies_to: "evidence and estimates"
    rule: "Every source ID resolves in the data-source register, site measurements retain quality evidence, and any reasoned estimate is labelled provisional and replaceable."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_unit_process_or_aggregated_cradle_to_gate_process"
  downstream_use: "upstream material dataset for photovoltaic-module cover-glass, building-envelope and automotive-glazing studies when the declared product qualifiers match"
  allowed_use: "unworked CPC 37113 sheet glass matching glass kind, thickness, optical/iron specification, online-coating status, geography, technology, period and factory gate"
  excluded_use: "direct representation of tempered, laminated, insulating, mirrored, offline-coated, fabricated or single-purpose photovoltaic glass without additional specific processes and evidence"
  required_metadata: "reference UUIDs; CPC code; glass kind; surface state; thickness/area/mass basis; density basis; iron or optical specification; online coating; cullet origin fractions; furnace and energy carriers; tin bath; annealing; cutting yield; delivery and packing state; geography; period; allocation; boundary"
  required_quality_disclosure: "primary-data coverage; meter/calibration evidence; mass and energy reconciliation; product-mix weighting; upstream dataset choices; cutoff; allocation; estimate replacements; data-quality assessment"
  update_trigger: "furnace rebuild or fuel switch; material electricity mix change; formulation or cullet-source change; coating/polishing route change; product-mix or thickness shift; boundary/allocation change; reporting data older than the declared validity period"
