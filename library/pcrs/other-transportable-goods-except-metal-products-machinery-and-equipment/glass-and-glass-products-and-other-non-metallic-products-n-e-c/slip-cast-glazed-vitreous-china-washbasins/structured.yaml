measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use 1 item of the complete released ceramic basin body. Native Item(s) and item denote the same count unit with factor 1. Count each unique first-release ID once; use cp_release. No per-kg conversion or assumed item mass is defined."
  - id: native_units
    applies_to: "each inventory exchange"
    required_property_ref:
      name: "Preserve row property"
      uuid: ""
    required_unit: "native unit"
    rule: "Preserve each row native extensive property: Mass/kg, Number of items/item, energy/MJ, measured gas volume/m3 or freight/t km as declared. Convert kWh to MJ by 3.6; a flow secondary property coefficient never establishes density, heat value or basin mass. Count is not mass."
  - id: independent_physical
    applies_to: "physical mass and species gates"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated wet/dry mass and independent moisture/mineral/element/species evidence for each supply, WIP, FG, waste and actual gas component. Structural hydroxyl, adsorbed/free water, reaction water and gas/liquid states differ. Do not fit water and carbonate gas from one firing-loss residual."
  - id: volume_and_heat
    applies_to: "actual utilities and emissions"
    required_property_ref:
      name: "Preserve row property"
      uuid: ""
    required_unit: "native unit"
    rule: "Integrate only genuine rates with their recorded interval. Already integrated gas/liquid volume is not multiplied by time again. Convert volume with independent substance/state-specific density; energy from actual heat value or enthalpy difference requires its own evidence. Preserve gross carrier mass beside MJ without duplicating provider purchase."
