          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_goal | attributional inventory | Apply this hierarchy only when the declared attributional goal requires allocation. Identify independently dedicated operations, physical subdivision and justified virtual subdivision first; measure basin-specific ingredients, tests, grinding and service directly. | `jrc-ilcd-allocation-2010` |\n| a_causality | each remaining shared exchange | For each remaining shared exchange establish determining physical causality from independent operational evidence, including actual kiln occupancy, time, heat demand, failure and idle demands. A mass/volume/count fraction is not causal merely because measured; different exchanges may require different determinants. | `jrc-ilcd-allocation-2010` |\n| a_residual | irreducible common process | Only truly remaining multifunctionality uses contemporaneous market values at the same real common-process gate, physical state, quality and quantity, correcting downstream processing/transport as necessary with evidence. Document unavailable/nonpositive prices and unresolved attribution; no arbitrary physical/economic choice, fixed percentage, avoided-product credit or automatic zero burden for sold scrap. Do not transfer the EPD case allocation. | `jrc-ilcd-allocation-2010`; `duravit-sanitary-ceramic-2022` |\n| a_internal | reuse stocks and assets | Internal recycling is neither new purchase nor coproduct; retain actual recovery energy/losses and inherited burden. Packaging and asset gross physical stocks/receipts/returns/waste never shrink by allocated economic share. Capital and mould service burden uses actual deployment/usage without assumed life or an entire kiln per reference item. | `jrc-ilcd-allocation-2010`; `jrc-ceramic-bref-2007` |\n| asset_manufacture_conservation | existing capital/reusable manufacture attribution | Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. |  |\n\n"
