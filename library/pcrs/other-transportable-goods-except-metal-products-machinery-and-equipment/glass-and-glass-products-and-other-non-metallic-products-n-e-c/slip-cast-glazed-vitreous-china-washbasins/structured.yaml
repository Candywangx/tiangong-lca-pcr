      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole purchased unfired raw materials with actual supplier preparation and moisture; no pre-fired basin |\n| starting_condition_role | foreground_material_receipt |\n| product_classification_scope | Narrow ceramic washbasin body subset of CPC 37210; no accepted mapping implied |\n| recursive_input_rule | Any bought same-category fired ceramic carries its own compatible upstream burden and is not this manufacturing route; disclose and reassess applicability |\n| upstream_dataset_requirement | Match actual whole material/formulation, mineral/chemical identity, phase, supplied form, grade, supplier route/geography and extensive unit; avoid duplicate constituent/provider burdens |\n| disclosure | Declare raw-to-first-release manufacture and separately bounded original-cohort packing/FG services; cradle-to-gate requires compatible upstream links and explicit consolidation |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | manufacture | Begin with actual whole supplied unfired ingredients and include every real on-site preparation, forming, drying, glazing, firing, finishing/test, control and supporting operation to first release. Supplier beneficiation/frit manufacture carries compatible upstream burdens; no complete fired-basin substitution. | `jrc-ceramic-bref-2007`; `duravit-sanitary-ceramic-2022` |\n| b_stock | manufacturing numerator | For each exchange keep opening and closing raw/WIP/unassigned non-WIP store burden vectors and all failure/zero-output/start/stop/idle/cleanup/rework loads. Closing already-released FG is inside Q and cannot be subtracted from manufacturing numerator or added again as output. Internal slip/scrap/glaze/water transfers cancel once without erasing real reprocessing. Independently record each opening/closing raw, WIP and non-WIP physical quantity and its full inherited exchange vector; physical quantity is not its burden share. | `jrc-ceramic-bref-2007`; `duravit-sanitary-ceramic-2022` |\n| b_service | post-release cohort | Keep original manufacturing burden with its unique first-release cohort. Record subsequent actual packing, storage, handling, dispatch, returns, retest, cleaning, breakage and rework increment by cohort and horizon; none creates Q. Services have original Qc, not current-period Q. Consolidation cancels the internal Q hand-off and retains external gross flows. Any actual post-release repair or refiring requires independently documented manufacturer/design permission, continued applicability of the bare-body boundary, required retests and acceptance or waste disposition. The cited factory quality-reject rework is not general permission to restore or reuse returned basins. | `jrc-ceramic-bref-2007`; `duravit-sanitary-ceramic-2022` |\n| b_complete | all exchanges | Each actual formulation/material/fuel/water/packaging/waste/species is its own specific exchange. If the plant has a real additional raw material, chemical, coating, refrigerant, combustion source, treatment reagent, dissolved species or mixed waste not listed, add and qualify the actual atomic row before use; no other/zero collection may hide it. Demonstrated absence and unmeasured amount differ. | `jrc-ceramic-bref-2007`; `duravit-sanitary-ceramic-2022` |\n| b_physical | manufacture FG combined | Reconcile full physical wet/dry/component and element balances at manufacturing, FG-service and combined gates before any economic burden shares. Treat direct environmental discharge, external waste treatment, Product carrier returns and internal circulation distinctly. Gross air constituents are not added beside an air aggregate; water and energy provider conventions must be explicit. | `jrc-ceramic-bref-2007`; `duravit-sanitary-ceramic-2022` |\n\n"
