product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.glass-and-glass-products-and-other-non-metallic-products-n-e-c.slip-cast-glazed-vitreous-china-washbasins"
  classification_refs: "CPC:3.0:37210; narrower"
  covered_products: "Complete bare glazed vitreous-china washbasin ceramic bodies"
  excluded_products: "Exclude fine-fireclay/fireclay and stoneware body routes, resin/mineral-cast and metal/plastic sanitaryware, green bodies or slips sold as the reference product, tiles/tableware/refractories/electrical porcelain, toilets/cisterns/baths, assembled WC units, taps/waste fittings/siphons/brackets/furniture, sanitary accessories, decorative transfers, water-repellent post-coatings, installation, use-phase water/energy/cleaning, durability claims and end-of-life of installed basins. Buying fired basins and packing them cannot replace this manufacturing route. A bought full body slip or complete supplied glaze requires a renewed supply-boundary decision and one whole formulation purchase; it cannot be combined with duplicate constituent purchases or silently suppress on-site preparation."
  representative_product: "One declared design of complete washbasin body without fitted hardware"
  production_route: "This attributional method covers complete manufacture of one declared bare glazed vitreous-china washbasin ceramic body: actual separate incoming clay/kaolin and hard mineral materials; wet body preparation, screening/deferrisation and ageing; plaster or actual identified porous-polymer mould slip casting, garnishing and fettling; drying, on-site preparation/application of the actual glaze, gas-fired high-temperature firing, cooling, required mounting-surface grinding and quality tests through unique first quality release. Include actual inbound transport, re-firing before first release, failed and zero-output runs, start/stop, hot hold, idle, cleanup, rework, mould/asset service and pollution controls. Packing, warehouse, handling, dispatch and returns remain a separately disclosed original-cohort service account."
  market_state: "First-quality-released fired/glazed/required-finished bare body at plant; subsequent actual services separately reported"
functional_unit:
  what: "Provide the declared ceramic hand-washing basin body for later installation with separately sourced fittings"
  how_much: "1 item of one design at unique first quality release"
  how_well: "Actual declared design/dimensions, vitreous-china/glaze identity, surface/geometry and required quality tests supported by real acceptance records; no generic compliance result"
  how_long_or_cycle: "One declared production cohort; actual post-release service horizon H is separate; no use-life assumption"
  reference_flow_link: "finished_basin"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Begin with actual whole supplied unfired ingredients and include every real on-site preparation, forming, drying, glazing, firing, finishing/test, control and supporting operation to first release. Supplier beneficiation/frit manufacture carries compatible upstream burdens; no complete fired-basin substitution."
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - rule_id: b_stock
      applies_to: "manufacturing numerator"
      rule: "For each exchange keep opening and closing raw/WIP/unassigned non-WIP store burden vectors and all failure/zero-output/start/stop/idle/cleanup/rework loads. Closing already-released FG is inside Q and cannot be subtracted from manufacturing numerator or added again as output. Internal slip/scrap/glaze/water transfers cancel once without erasing real reprocessing. Independently record each opening/closing raw, WIP and non-WIP physical quantity and its full inherited exchange vector; physical quantity is not its burden share."
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - rule_id: b_service
      applies_to: "post-release cohort"
      rule: "Keep original manufacturing burden with its unique first-release cohort. Record subsequent actual packing, storage, handling, dispatch, returns, retest, cleaning, breakage and rework increment by cohort and horizon; none creates Q. Services have original Qc, not current-period Q. Consolidation cancels the internal Q hand-off and retains external gross flows. Any actual post-release repair or refiring requires independently documented manufacturer/design permission, continued applicability of the bare-body boundary, required retests and acceptance or waste disposition. The cited factory quality-reject rework is not general permission to restore or reuse returned basins."
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - rule_id: b_complete
      applies_to: "all exchanges"
      rule: "Each actual formulation/material/fuel/water/packaging/waste/species is its own specific exchange. If the plant has a real additional raw material, chemical, coating, refrigerant, combustion source, treatment reagent, dissolved species or mixed waste not listed, add and qualify the actual atomic row before use; no other/zero collection may hide it. Demonstrated absence and unmeasured amount differ."
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - rule_id: b_physical
      applies_to: "manufacture FG combined"
      rule: "Reconcile full physical wet/dry/component and element balances at manufacturing, FG-service and combined gates before any economic burden shares. Treat direct environmental discharge, external waste treatment, Product carrier returns and internal circulation distinctly. Gross air constituents are not added beside an air aggregate; water and energy provider conventions must be explicit."
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
boundary_abstraction:
  declared_starting_condition: "Whole purchased unfired raw materials with actual supplier preparation and moisture; no pre-fired basin"
  starting_condition_role: "foreground_material_receipt"
  product_classification_scope: "Narrow ceramic washbasin body subset of CPC 37210; no accepted mapping implied"
