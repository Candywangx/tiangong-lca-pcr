allocation_rules:
  - rule_id: a_goal
    applies_to: "attributional inventory"
    rule: "Apply this hierarchy only when the declared attributional goal requires allocation. Identify independently dedicated operations, physical subdivision and justified virtual subdivision first; measure basin-specific ingredients, tests, grinding and service directly."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_causality
    applies_to: "each remaining shared exchange"
    rule: "For each remaining shared exchange establish determining physical causality from independent operational evidence, including actual kiln occupancy, time, heat demand, failure and idle demands. A mass/volume/count fraction is not causal merely because measured; different exchanges may require different determinants."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "irreducible common process"
    rule: "Only truly remaining multifunctionality uses contemporaneous market values at the same real common-process gate, physical state, quality and quantity, correcting downstream processing/transport as necessary with evidence. Document unavailable/nonpositive prices and unresolved attribution; no arbitrary physical/economic choice, fixed percentage, avoided-product credit or automatic zero burden for sold scrap. Do not transfer the EPD case allocation."
    source_ids:
      - jrc-ilcd-allocation-2010
      - duravit-sanitary-ceramic-2022
  - rule_id: a_internal
    applies_to: "reuse stocks and assets"
    rule: "Internal recycling is neither new purchase nor coproduct; retain actual recovery energy/losses and inherited burden. Packaging and asset gross physical stocks/receipts/returns/waste never shrink by allocated economic share. Capital and mould service burden uses actual deployment/usage without assumed life or an entire kiln per reference item."
    source_ids:
      - jrc-ilcd-allocation-2010
      - jrc-ceramic-bref-2007
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first quality release"
      record_type: "count_and_mass"
      raw_fields: "unique body ID; design/configuration; release timestamp; first-release status; count Q; dry bare net mass; inspection disposition; opening/closing raw/WIP/FG identity"
      collection_method: "Use controlled first-release registers reconciled with inspection and serial/lot records. Independently weigh actual bare released bodies on calibrated scales with packaging/hardware excluded; keep same-configuration scope and sampling uncertainty. No assumed kg/item."
      unit: "item; kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited stocks and observed service H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated original records independent assay and reconciled IDs"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "each actual material"
      record_type: "raw_supply_and_stock"
      raw_fields: "row ID; supplier/grade/form; full formulation mass; assay/free/structural water; batch stage; opening/closing raw/WIP/stores; each inherited exchange-burden vector; internal return; external waste; operating mode; independently measured physical quantity for every raw/WIP/non-WIP opening and closing pool; gross receipt or already-stock-adjusted consumption basis and stock adjustments already included"
      collection_method: "Reconcile deliveries, calibrated tank/scale stocks, actual recipe issue logs and independent assays. Preserve raw unnormalised records; mark whole formulations and child constituents; trace every failure/cleanup/rework cohort. Identify whether each input is a gross receipt or an already stock-adjusted issue/consumption amount. Keep its documented stock adjustments so that no opening/closing quantity or inherited burden is corrected twice."
      unit: "kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited stocks and observed service H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated original records independent assay and reconciled IDs"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "each utility carrier"
      record_type: "raw_metered"
      raw_fields: "row ID; site/stage/cohort; meter start/end; rate or integrated reading; duration; native unit; T/P/humidity; independent density/composition/LHV; steam quality/enthalpy; return state/mass; provider water/energy convention; failed/idle load"
      collection_method: "Use calibrated stage meters and bills reconciled to site supply. Independently establish gas mass and energy; measure actual external carriers/returns. Do not re-integrate totalised volume, assume water density for another material, or purchase on-site compressed-air energy twice."
      unit: "MJ; m3; kg; t km"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited stocks and observed service H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated original records independent assay and reconciled IDs"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "each physical asset and service"
      record_type: "stock_and_service"
      raw_fields: "individual asset/mould/brick ID; material and installed state; opening/closing physical stock; bought/returned/repaired/retired mass; installed fluids; actual usage; service-burden inventory and evidence; water/retained deposit"
      collection_method: "Keep calibrated physical asset balance and component receipts distinct from period service-burden allocation. Trace actual new and old components, repair materials, retained fluids, mould hydration and supporting operations; no default life."
      unit: "kg; actual service unit"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited stocks and observed service H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated original records independent assay and reconciled IDs"
    - protocol_id: cp_residue
      process_id: "manufacture"
      flow_role: "each residue and destination"
      record_type: "raw_waste"
      raw_fields: "row ID; process/batch; gross wet mass; dry solids/moisture; composition/contamination; internal return; external receiver; actual treatment; original burden vector; spent-media child masses"
      collection_method: "Weigh and sample each compatible waste stream separately and reconcile stock/transfer notes. Keep internal loops, product outputs, whole treatment transfers and direct environmental releases distinct."
      unit: "kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited stocks and observed service H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated original records independent assay and reconciled IDs"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "each actual gas or particulate species"
      record_type: "raw_monitoring_and_balance"
      raw_fields: "row ID; stage/stack; phase/CAS/origin; raw/dry/wet gas basis; T/P/humidity/O2 correction; integrated gas or actual rate/time; measured species concentration; control inlet/outlet; detection limits; independent mineral/carbon/water assays; reaction conversion; solid retained elements; air gross composition"
      collection_method: "Match concentrations and gas volume on the same state/time and post-control boundary, retaining raw equivalent indicators separately. Determine free/adsorbed water by a validated moisture method that does not silently include structural dehydroxylation; independently characterize actual mineral phases and carbonate content. Use qualified evolved-gas thermal analysis or equivalent independent H2O/CO2-specific measurements plus retained-phase/element evidence to distinguish structural/reaction water from carbonate gas and organic burn-out; bulk loss on ignition alone cannot do this. Independently constrain free-water evaporation, dehydroxylation/reaction water and carbonate conversion; do not close two unknown species with one mass residual. Keep gross O2/N2/Ar/H2O/CO2 inlet/outlet without duplicate air aggregate; add each actual identified extra species before use."
      unit: "kg; measured gas state units"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited stocks and observed service H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated original records independent assay and reconciled IDs"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "original cohort services"
      record_type: "cohort_raw_service"
      raw_fields: "original cohort/release IDs; original Qc; observed horizon H; opening/closing FG count/mass and original burden vectors; gross dispatch G; physical returns R; receipt mass/condition; original dispatch match; added testing/cleaning/rework inputs and losses; repacking; unobserved future; actual repair/refiring permission and design scope; required retests and acceptance/disposition; actual added/removed material and water"
      collection_method: "Trace each already-released body through physical stock, shipment, return, re-test, breakage and increment-only service meters. Preserve original cohort manufacturing burden and Qc even for old FG; no new production on delivery or reinspection. For actual repair/refiring verify the governing permission and acceptance evidence; trace every new/old component, retained water, loss and actual operation without assuming restorability."
      unit: "item; kg; MJ"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited stocks and observed service H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated original records independent assay and reconciled IDs"
    - protocol_id: cp_pack
      process_id: "service"
      flow_role: "each packaging article pool"
      record_type: "gross_physical_stock"
      raw_fields: "packaging row/material/configuration; ownership; empty/WIP-attached/FG-attached/reusable opening and closing stock; purchases P; attached inbound I; external returns received ER; gross shipped S; external returns out EO; waste W; internal reuse; original cohort Qc and H; unit tare/condition; actual new/old repair-component identities and masses; measured material/water transfers X_in and X_out with source destination and phase; dry matter and retained moisture"
      collection_method: "Weigh/count the same physical material/configuration pool with actual tare and moisture, reconcile all attached/empty/reusable states. Record actual gross dispatch packaging even on repeated shipment; internal reuse cancels and neither creates purchases nor product Q. If maintenance or moisture changes the pool, independently measure every repair material, removed component and water uptake/release. Add the actual specific exchange before use; a repair board is not another complete-pallet purchase. Distinguish transfers between tracked pools, cancel them once at consolidation and preserve their physical quantities and inherited burden vectors."
      unit: "kg"
      frequency: "each receipt/batch/operating interval and stock close"
      temporal_coverage: "declared representative period plus inherited stocks and observed service H"
      site_scope: "actual site and traceable design/cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated original records independent assay and reconciled IDs"
  calculation_rules:
    - id: raw_convert
      applies_to: "all inventory rows"
      rule: "Convert each raw unnormalised record into its declared extensive numerator unit using measured calibration and state-specific evidence before attribution: only actual rates are integrated; a totalised volume is used once; kWh becomes MJ by multiplying 3.6. Preserve carrier mass and energy separately."
      inputs:
        - raw_reading
        - state_evidence
        - unit_factor
      output: "raw_extensive_amount"
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - id: manufacturing_stock
      applies_to: "manufacture"
      rule: "For each exchange j: A_j = Bopen_j + P_j - Bclose_j - Tother_j after cancellation of internal transfers and justified attribution. Bopen/Bclose are inherited burdens in raw/WIP/unassigned non-WIP stores only; P includes all actual current operating-mode burdens including failures; Tother is separately evidenced assignment outside the target cohort. Closing released FG is never in Bclose. Unknown vectors remain unknown. Define P_j on gross external receipts/burdens entering the declared pool before the stated stock corrections. If a supplied record is already stock-adjusted consumption, retain that basis and the adjustments already included, do not add/subtract the same raw-stock correction again, and reconcile only remaining unincluded WIP/non-WIP or other pool vectors. Keep independently measured physical pool quantities distinct from these exchange-burden vectors."
      inputs:
        - Bopen_j
        - P_j
        - Bclose_j
        - Tother_j
        - cp_material
        - cp_asset
        - cp_release
      output: "A_j"
      source_ids:
        - jrc-ilcd-allocation-2010
        - jrc-ceramic-bref-2007
    - id: first_release
      applies_to: "finished_basin"
      rule: "Q = sum of unique first-quality-released complete basin bodies in the target design/cohort, counted once, including bodies held in closing FG. Failed/unreleased WIP is excluded from Q but all attributable burdens remain. Retest, return, re-shipment and closing FG do not add another output."
      inputs:
        - cp_release
        - unique_release_IDs
      output: "Q"
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - id: cohort_services
      applies_to: "service"
      rule: "Keep the original manufacturing vector per released cohort unchanged. For each observed service horizon H, assemble Aservice_j from actual incremental operations attributed to that original cohort; Qc is its original first-release count. Keep opening/closing FG physical/history ledgers: opening FG + first releases + actual returns = closing FG + gross dispatch + post-release destruction + documented other physical exit. Use IDs and actual mass changes; never assume a return has the original dispatch mass or zero new water/loss. Do not reverse original production or substitute net-delivery Q."
      inputs:
        - cp_service
        - cp_pack
        - Qc
        - H
      output: "Aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - id: final_exchange
      applies_to: "all inventory rows"
      rule: "The only unit-result operation is a_j = A_j / Q for manufacturing and aservice_j = Aservice_j / Qc for the separately labelled original-cohort service horizon. Apply once after raw-unit conversion, stocks and justified attribution. Collection protocols retain raw totals; cards use this final result without dividing again. Q or Qc equal to zero retains actual burdens and yields no unit result. The finished reference is 1 item. Consolidation combines corresponding cohort results and cancels internal Q hand-offs."
      inputs:
        - A_j
        - Q
        - Aservice_j
        - Qc
        - cp_release
        - cp_service
      output: "a_j; aservice_j"
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - id: packaging_stock
      applies_to: "cp_pack"
      rule: "For EACH actual material/configuration: opening empty+WIP-attached+FG-attached+reusable stocks + P + I + ER + X_in = closing equivalent stocks + S + EO + W + X_out. X_in/X_out contain only independently measured actual repair-material and water transfers into/out of this pool that are not already included in the other incoming/outgoing flow terms P/I/ER/S/EO/W; keep each material/component/water species separate and avoid duplicate whole-article and constituent purchases or outputs. Track new and removed old repair parts, retained water and losses; independently reconcile dry matter and water, with zero terms only for demonstrated absence. Internal reuse and inter-pool transfers cancel once, gross physical terms stay unallocated, attached stocks contain packaging only and are disjoint. Service burden associated with new purchases/operations is assigned once to actual cohorts with independently supported inherited packaging burdens. Add a new pool for every different actual package. This deduplication is against other actual incoming/outgoing flow terms ONLY, never against an opening or closing stock. Actual added water or repair material retained in the pool must remain in BOTH its real incoming term and the complete closing physical mass. Water/material already arriving inside a measured whole-article receipt is counted in that receipt once, not an extra X_in. The same nonoverlap applies to actual removals and outgoing terms; dry matter and water remain independently measured."
      inputs:
        - cp_pack
        - P
        - I
        - ER
        - S
        - EO
        - W
        - X_in
        - X_out
      output: "packaging_balance"
      source_ids:
        - jrc-ceramic-bref-2007
        - duravit-sanitary-ceramic-2022
    - id: physical_species
      applies_to: "manufacture and service gates"
      rule: "Independently reconcile total physical mass and relevant element inventories using actual supplied/waste/FG/WIP states, dry solids, free/adsorbed/structural water, oxygen uptake, reaction gas and carrier returns. Derive species only where independent chemistry/conversion/monitoring closes them. Report residuals separately; do not fit a second unknown from the same residual or use economic shares to close physical balances."
      inputs:
        - cp_air
        - cp_material
        - cp_residue
        - cp_release
        - cp_service
        - cp_utility
      output: "mass_element_species_residuals"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: assets_service
      applies_to: "cp_asset"
      rule: "Keep physical equipment/mould/refractory/fluid additions, retained installed stock, maintenance and retirement in a disjoint material balance. Separately assign actual period service burden through observed deployment and use, retaining inherited vectors and uncertainty. Never prescribe fixed life, a complete kiln per item or economic fractions of gross asset mass."
      inputs:
        - cp_asset
        - actual_usage
        - inherited_asset_vectors
      output: "period_asset_service"
      source_ids:
        - jrc-ilcd-allocation-2010
        - jrc-ceramic-bref-2007
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each exchange"
      requirement: "Use verified native property/unit chains and all physical restrictions; unresolved auxiliary UUID/provider is disclosed, no substitute family or invented binding."
      evidence: "actual full native records and supplier specifications"
    - id: dq_time
      applies_to: "all operation modes"
      requirement: "Use a representative declared period covering operating and non-producing modes with site/cohort traceability; old WIP/FG/asset history and service horizon are explicit."
      evidence: "raw meters release stock shipment and maintenance logs"
    - id: dq_completeness
      applies_to: "all flows"
      requirement: "Unknown, below detection, demonstrated absence and measured zero remain distinct; no nonempty card or engineering check proves plant data completeness. Add actual omitted atomic exchanges before any data-package claim."
      evidence: "reconciled inventories and unresolved-item register"
    - id: dq_uncertainty
      applies_to: "amounts and chemistry"
      requirement: "Retain calibration uncertainty, sampling/speciation/density/heat-value evidence, raw units, independent reaction constraints and unclosed physical/element residuals; historical case numbers are not primary plant observations."
      evidence: "laboratory records calibrated meters independent balances"
validation_rules:
  - rule_id: v_scope
    applies_to: "data package"
    rule: "Verify vitreous-china ceramic-only complete washbasin, true starting materials, actual casting/glazing/gas-firing/finishing and first-release gate. A different body family, assembly or bought-fired-basin route cannot pass applicability. Confirm exact native identities and all card restrictions before provider binding."
    source_ids:
      - jrc-ceramic-bref-2007
      - duravit-sanitary-ceramic-2022
  - rule_id: v_q
    applies_to: "quantity and stocks"
    rule: "Reconcile unique first releases, raw/WIP/store burden vectors and separate FG-service stocks; Q includes closing released FG. Retesting/re-shipping returns adds no output. Preserve original Qc and observed horizon and apply the Section 8 quotient exactly once. Q=0 retains loads and produces no unit result."
    source_ids:
      - jrc-ceramic-bref-2007
      - duravit-sanitary-ceramic-2022
  - rule_id: v_species
    applies_to: "physical and analytical evidence"
    rule: "Check independent total mass and relevant Si/Al/C/H/O/S/F/Cl balances, actual molecular/phase evidence and measured water paths. Total dust, oxide analyses, NOx/SOx equivalents, inorganic fluorine/chlorine equivalents, total boron, VOC or COD do not prove a specific molecule. Report unknown speciation and balance residuals, not a successful factory result."
    source_ids:
      - jrc-ceramic-bref-2007
  - rule_id: v_complete
    applies_to: "inventory quality"
    rule: "Confirm every applicable row has one raw numerator, correct extensive unit, collection protocol, source-role limits, stock/history attribution and uncertainty. Include failed/zero-output/idle/cleanup burdens, full packaging and assets; measured zero, absent, below detection and unknown are distinct. Unresolved auxiliary identity requires disclosure and a real provider decision, not deletion or a generic collection binding."
    source_ids:
      - jrc-ceramic-bref-2007
      - duravit-sanitary-ceramic-2022
      - jrc-ilcd-allocation-2010
  - rule_id: v_allocation
    applies_to: "allocation and downstream use"
    rule: "Review actual goal, dedicated/subdivided operations, exchange-specific causal determinants and any residual common-gate market values independently. Engineering Schema/measurement checks do not approve science, translation, mappings or publication, nor establish equal washbasin performance or a service-life comparison."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Configuration-specific production input for a compatible later installation/product system"
  allowed_use: "Declared raw-to-first-release ceramic-body manufacture with separately labelled actually observed cohort services; linked upstream providers as disclosed"
  excluded_use: "Whole fitted sanitary unit; equal-function comparison; installation/use/end-of-life; universal life/compliance; inferred all-CPC coverage or automatic recycling credit"
  required_metadata: "All reference qualifiers; exact release cohort Q; service Qc/H; upstream/foreground boundaries; actual provider/flow/property identities; full stock/physical/gross-package/asset and inherited-burden ledgers"
  required_quality_disclosure: "Scientific and translation review status; candidate method scope; source case limits; unresolved identities and measurements; uncertainty/speciation/balance/stock gaps; allocation evidence and future services unobserved"
  update_trigger: "Changed body/glaze family, supplied formulation, forming/firing route, quality gate, design/hardware/coating, native restrictions, provider, stock attribution or service boundary"
data_sources:
  - id: "jrc-ceramic-bref-2007"
    type: "official_guidance"
    reference: "European Commission; Reference Document on Best Available Techniques in the Ceramic Manufacturing Industry; August 2007; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/cer_bref_0807.pdf ; sections 2.3.7 and 3.3.7; PDF pp.99-102 and 155-158; Figures 2.24/2.25/3.8; Tables 2.21-2.23 and 3.41-3.46"
    used_for: "Full sanitaryware raw-to-finish process, vitreous-china slip-casting example, recycling/waste and monitoring context. Historical cases and equivalent-pollutant reporting are limitations, not numeric defaults or LCA allocation evidence."
  - id: "duravit-sanitary-ceramic-2022"
    type: "dataset"
    reference: "Duravit AG; Sanitary ceramic; EPD-DUR-20210288-IBC1-EN; issued 2022-01-24; https://wgassets.duravit.com/statc/download/EPD_Sanitary_ceramic_EN.pdf ; sections 2.1-2.6, 2.9 and 3.1-3.8; PDF pp.2-6"
    used_for: "Manufacturer complete manufacture/inspection/refiring and packaging example, ceramic-body/accessory boundary. 2019 Hornberg mixed-product EPD; no transfer of average mass/recipe, temperature, packaging weight, proxies, cutoffs, allocation or end-of-life assumptions."
