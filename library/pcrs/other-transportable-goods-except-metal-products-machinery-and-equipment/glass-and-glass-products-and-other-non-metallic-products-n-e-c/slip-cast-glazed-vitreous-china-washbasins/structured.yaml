      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_scope | data package | Verify vitreous-china ceramic-only complete washbasin, true starting materials, actual casting/glazing/gas-firing/finishing and first-release gate. A different body family, assembly or bought-fired-basin route cannot pass applicability. Confirm exact native identities and all card restrictions before provider binding. | `jrc-ceramic-bref-2007`; `duravit-sanitary-ceramic-2022` |\n| v_q | quantity and stocks | Reconcile unique first releases, raw/WIP/store burden vectors and separate FG-service stocks; Q includes closing released FG. Retesting/re-shipping returns adds no output. Preserve original Qc and observed horizon and apply the Section 8 quotient exactly once. Q=0 retains loads and produces no unit result. | `jrc-ceramic-bref-2007`; `duravit-sanitary-ceramic-2022` |\n| v_species | physical and analytical evidence | Check independent total mass and relevant Si/Al/C/H/O/S/F/Cl balances, actual molecular/phase evidence and measured water paths. Total dust, oxide analyses, NOx/SOx equivalents, inorganic fluorine/chlorine equivalents, total boron, VOC or COD do not prove a specific molecule. Report unknown speciation and balance residuals, not a successful factory result. | `jrc-ceramic-bref-2007` |\n| v_complete | inventory quality | Confirm every applicable row has one raw numerator, correct extensive unit, collection protocol, source-role limits, stock/history attribution and uncertainty. Include failed/zero-output/idle/cleanup burdens, full packaging and assets; measured zero, absent, below detection and unknown are distinct. Unresolved auxiliary identity requires disclosure and a real provider decision, not deletion or a generic collection binding. | `jrc-ceramic-bref-2007`; `duravit-sanitary-ceramic-2022`; `jrc-ilcd-allocation-2010` |\n| v_allocation | allocation and downstream use | Review actual goal, dedicated/subdivided operations, exchange-specific causal determinants and any residual common-gate market values independently. Engineering Schema/measurement checks do not approve science, translation, mappings or publication, nor establish equal washbasin performance or a service-life comparison. | `jrc-ilcd-allocation-2010` |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
