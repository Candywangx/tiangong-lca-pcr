  ordinary_data_gaps:
    - Actual site/design/supplier grades and quantities, mineral/species/state
      evidence, quality tests, inherited raw/WIP/FG/asset vectors, all
      stock/gross-packaging records and observed cohort services remain required
      foreground data; no actual plant pass or numeric defaults.
    - Each unbound auxiliary is kept specific and visible; qualify actual
      provider/exact native identity before dataset binding. Unmeasured, absent
      and zero differ; add any actual unlisted exchange.
