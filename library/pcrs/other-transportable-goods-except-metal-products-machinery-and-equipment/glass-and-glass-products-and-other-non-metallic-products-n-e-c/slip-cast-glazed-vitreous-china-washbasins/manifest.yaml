  semantic_boundary_review:
    decision: new narrow material candidate
    rationale: 1257 material catalog records read from ref35 with 13 complete
      bounded pages. Metal sanitaryware expressly excludes ceramics; cement,
      ferrite magnets, mineral feedstocks, decals and electrical fittings do not
      implement raw-material-to-vitreous-china washbasin slip
      casting/glazing/firing/finishing. Frozen nearby glass/polymer intakes use
      incompatible material/production boundaries.
  independent_review_repair: Packaging physical reconciliation explicitly includes
    actual repair-component and water transfers, without duplicating
    whole-article receipts or burden attribution. Post-release repair/refiring
    requires independent design/manufacturer permission and
    acceptance/disposition evidence; no restorability or quantities assumed.
    Raw/WIP/non-WIP physical stock quantities are separate from exchange-burden
    vectors, and gross receipt versus already-stock-adjusted consumption is
    explicit to prevent duplicate stock corrections.
