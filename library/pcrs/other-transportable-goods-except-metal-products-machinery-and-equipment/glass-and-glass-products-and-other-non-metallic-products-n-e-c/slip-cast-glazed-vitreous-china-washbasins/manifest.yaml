  identity_restrictions:
    - Core public Product identity includes high-temperature-fired mineral/clay
      washbasins, Number of items reference; no whole fitted assembly is
      inferred. Specific vitreous-china design requires independent
      qualification.
    - CN <1kV user-side grid-average electricity only; MJ native energy
      property. Tap water only actual treated municipal potable supply, never
      native secondary-coefficient density inference.
    - Adopted PE film has an isolated luggage-classification defect; molecular
      CAS/form/comment are coherent for PE film, not PET. Pallet family is
      restricted to one complete wooden load pallet.
    - HCl binding is only non-urban air/high stack; other adopted pollutant
      flows are air unspecified. Species and origin restrictions appear in
      complete bilingual flow-card descriptions.
    - Rejected generic paper-box/corrugated fixed-fibre candidates, mine-run
      clay for unspecified prepared clay, gas mass-volume/CAS ambiguity and
      long-term HCl/Ar candidates cannot be silently reused.
    - NO2 exact direct has tetroxide-only synonyms and methane direct has
      substantial unrelated carbon/formaldehyde aliases. They remain unbound
      specific molecular rows pending better native identity; oxygen output
      exact molecular CAS/compartment is adopted with explicit form
      restrictions.
  retained_package_inflow_clarification: X_in/X_out deduplicate only against other
    incoming/outgoing flow terms, never against stocks. Actual retained added
    water/material stays in both the real incoming term and full closing
    physical mass; contents already in a measured whole-article receipt stay
    counted once. Reference/units/flows/amounts/sources and
    scientific/translation gates unchanged.
