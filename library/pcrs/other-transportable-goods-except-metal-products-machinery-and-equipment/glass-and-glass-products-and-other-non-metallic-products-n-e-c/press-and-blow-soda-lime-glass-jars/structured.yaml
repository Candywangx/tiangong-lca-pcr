    - protocol_id: cp_service_transport
      process_id: "services"
      flow_role: "services_road_freight; services_rail_freight"
      record_type: "Raw measurement and history record"
      raw_fields: "actual origin/destination; measured payload; distance; mode/vehicle; empty legs; provider boundary and upstream inclusion; cohort; causal capacity limitation"
      collection_method: "Use actual freight records for purchased transport service; derive undivided tkm from actual payload and distance after checking scope. If own vehicles occur, list actual individual fuel/energy/emission exchanges and do not also purchase the same transport service. Aggregation method: Sum undivided raw amounts for each actual exchange/cohort; convert, reconcile history and actually allocate first. Only calc_reference produces per-reference-flow x_i; do not divide in raw collection or aggregation again."
      unit: "tkm; kg; km"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service window separately"
      site_scope: "Each actual line/furnace/circuit/stock and service gate"
