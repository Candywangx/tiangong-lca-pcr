published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Empty food-jar purchase and packaging modelling for declared configuration/route"
  allowed_use: "Attributional use after actual site data, physical/history/species closure, native matching and independent method judgement"
  excluded_use: "Uncovered bottles/closures/routes; filled food; performance/life/certification; default reuse; whole37191 coverage; automatic credits"
  required_metadata: "wide-mouth jar drawing and finish; uncoloured soda-lime composition and measured mass state; virgin batch ingredients and individual whole supply forms; external cullet provenance and contamination; internal cullet/WIP history; regenerative natural-gas/air melting and actual boost; press/plunger blank and final blow route; actual coating formulation and retained mass; actual lehr and inspection/rejection specification; unique first-release Q cohort and time; actual post-release service interval and return history; raw and installed-stock exchange vectors; each packaging article and gross movements; species/compartments and independent water/carbon evidence; provider geography and electricity voltage/mix"
  required_quality_disclosure: "Actual measurement period/site, source differences, species/water/carbon evidence, native restrictions, allocation, stock history, observed service interval and unknowns"
  update_trigger: "Changed jar finish/composition/batch, furnace/forming/coating/annealing/QC gate, supplier, data period, stock/returns/package route or evidence"
data_sources:
  - id: "jrc-glass-bref-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Manufacture of Glass (2013), doi10.2791/69502; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/GLS_Adopted_03_2012_0.pdf"
    used_for: "Qualitative raw-batch chemistry and regenerative melting (2.2–2.3); press-and-blow jar versus bottle and post-forming/annealing/QC/coating (2.4 and figure2.5); actual inputs, downstream/aqueous/waste/energy completeness (3.3). Tables2.4/3.9/3.10/3.19/3.21 and adjacent caveats prohibit recipe/factor/yield/species defaults."
  - id: "emhart-making-containers"
    type: "handbook"
    reference: "Bucher Emhart Glass, Making Glass Containers; https://www.emhartglass.com/node/26"
    used_for: "Independent primary mechanism: raw materials, furnace/forehearth, gob feeder, plunger-pressed parison and final blown jar versus blow-and-blow bottle, take-out, annealing, inspection and empty-container supply (steps1–11). No numerical defaults."
  - id: "oi-glass-manufacture"
    type: "handbook"
    reference: "O-I, How Glass is Made; https://www.o-i.com/wp-content/uploads/2019/04/How-a-Glass-Bottle-is-Made.pdf"
    used_for: "Publisher one-page seven-stage manufacturing original confirms raw ingredients, melting, gob separation, blown container, annealing, pre-shipment inspection with rejected-bottle remelt, and packing/shipping. Generic bottle infographic is not proof of the selected jar SKU route; its temperature is not a method value."
  - id: "oi-jar-500766"
    type: "handbook"
    reference: "O-I Glass Catalog, product500766 1 Gallon Jar; publisher five-page specification https://glass-catalog.com/na-en/index.php/actions/butPdfCreation/index/generatePdf?destination=detail&shapeCodes=500766"
    used_for: "Real empty flint wide-mouth food jar terminal. Read original PDF photo/category p1–3, technical table p4 and suitability/not-a-drawing/withdrawal caveat p5 together. Neither catalog mass/capacity/refillable flag nor product-specific finish is a PCR default; actual drawing, suitability and manufacture must be established independently."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for Life Cycle Assessment—Detailed guidance, First edition March2010, sections7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Limited attributional allocation: actual/virtual subdivision, exchange-specific determining physical causality, genuinely residual common-gate market value at actual condition; traceable foreground accounting and disclosure. Does not establish industrial recipe, emission chemistry, avoided credits or whole-handbook conformity."
