      raw_fields: "start/end meter; carrier; original unit; integrated amount or true rate/time; actual voltage/geography/mix; gas composition/density/state/NCV; operation failure hot hold idle cleanup; causal driver; cohort"
      collection_method: "Calibrated submeter for batch/melt/forehearth/compression/cooling/lehr/coating/QC/treatment and separately observed services; reconcile fuel/electric invoices and actual allocation. Record gas whole mass independently of heating-value energy. Aggregation method: Sum undivided raw amounts for each actual exchange/cohort; convert, reconcile history and actually allocate first. Only calc_reference produces per-reference-flow x_i; do not divide in raw collection or aggregation again."
      unit: "kWh; MJ; kg; actual gas-volume state"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service window separately"
      site_scope: "Each actual line/furnace/circuit/stock and service gate"
