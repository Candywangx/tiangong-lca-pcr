      collection_method: "Link physical jar movement to its original cohort and reverse original dispatch before assigning actual increments. Track new-release internal transfer, old FG and returns separately. No repeated first release, assumed net delivery or reassignment to unrelated current production. Aggregation method: Sum undivided raw amounts for each actual exchange/cohort; convert, reconcile history and actually allocate first. Only calc_reference produces per-reference-flow x_i; do not divide in raw collection or aggregation again."
      unit: "kg; h; actual item count with measured net mass"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service window separately"
      site_scope: "Each actual line/furnace/circuit/stock and service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; composition/state assays; complete physical/history ledgers; uncertainty"
    - protocol_id: cp_packaging
      process_id: "services"
      flow_role: "pack_pallet; pack_pad; pack_film; pack_strap; out_pallet; out_pad; out_film; out_strap; waste_pallet; waste_pad; waste_film; waste_strap; return_received_pallet; return_sent_pallet; return_received_pad; return_sent_pad; return_received_film; return_sent_film; return_received_strap; return_sent_strap"
      record_type: "Raw measurement and history record"
      raw_fields: "one article/form/composition; moisture; mutually exclusive empty/attachedWIP/attachedFG/reusable opening/closing stock; new purchase; supplier-included physical arrival; return received; gross dispatch attached; stand-alone return sent; waste; original vector; actual repair components"
      collection_method: "Weigh each real article/leg independently; match incoming-material supplier packaging inclusion before assigning new acquisition, retain external return identifiers and cancel internal reuse. Actual wood/paper water and real repair parts need separate atomic quantities. Count-to-mass conversion requires independently weighed same configuration, never a default kg/item. Aggregation method: Sum undivided raw amounts for each actual exchange/cohort; convert, reconcile history and actually allocate first. Only calc_reference produces per-reference-flow x_i; do not divide in raw collection or aggregation again."
      unit: "kg; actual item count with measured mass"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service window separately"
      site_scope: "Each actual line/furnace/circuit/stock and service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; composition/state assays; complete physical/history ledgers; uncertainty"
