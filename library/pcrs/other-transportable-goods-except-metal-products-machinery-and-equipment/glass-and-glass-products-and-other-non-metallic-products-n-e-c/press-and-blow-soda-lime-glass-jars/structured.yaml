      collection_method: "Calibrated net dry finished-jar weighing excluding removable packages/closures and linked to dimensional/visual/physical QC and true first release. Sum unique new first-release kg as Q; no capacity/density/item-weight assumption. Aggregation method: Sum unique newly first-released net dry finished-jar kg as Q; shipment, reinspection and same-cohort closing FG are not additional production. Raw collection is undivided; calc_reference alone normalizes."
      unit: "kg"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service window separately"
      site_scope: "Each actual line/furnace/circuit/stock and service gate"
