      flow_role: "air_oxygen; air_nitrogen; air_argon; air_water; air_co2; co2_fuel; co2_mineral; co2_air_return; water_vapor; nitrogen_out; oxygen_out; argon_out; no_air; no2_air; so2_air; hcl_air; hf_air; co_air; sncl4_air; sno2_air; pe_mist; silica_air; glass_particulate; oil_mist; hcl_fugitive"
      record_type: "Raw measurement and history record"
      raw_fields: "molecule/CAS and phase/particle structure; compartment/outlet; concentration and detection limit; actual integrated gas/liquid volume or true rate/time; temperature/pressure/humidity; independently measured substance density; raw/fuel/air carbon origin; free/carrier/structural/reaction water"
      collection_method: "Independent species sampling at matched intake/outlets and all operating modes; preserve actual dry/wet/reference-state conversions once. Indicators NOx/totalSn/totalC/VOC/COD do not supply a species split. Actual formula/assay and measured reacted extent are required for calculated reaction contributions, with independent retained/captured amounts. Aggregation method: Sum undivided raw amounts for each actual exchange/cohort; convert, reconcile history and actually allocate first. Only calc_reference produces per-reference-flow x_i; do not divide in raw collection or aggregation again."
      unit: "kg; actual concentration/volume/state units"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service window separately"
      site_scope: "Each actual line/furnace/circuit/stock and service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; composition/state assays; complete physical/history ledgers; uncertainty"
    - protocol_id: cp_service
      process_id: "services"
      flow_role: "dispatch_jars; service_broken_jar; release_transfer; returned_jars"
      record_type: "Raw measurement and history record"
