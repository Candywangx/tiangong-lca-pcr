allocation_rules:
  - rule_id: allocation_boundary
    applies_to: "all datasets"
    rule: "This section applies only to the complete section1 raw-to-first-release empty wide-mouth uncoloured soda-lime press-and-blow jar and explicitly matched original-cohort services. Bottles, closures, other glass chemistries or furnace/forming routes, decoration/filling and downstream use are excluded; do not extrapolate to the broad classification."
    source_ids:
      - jrc-glass-bref-2013
      - emhart-making-containers
      - jrc-ilcd-2010
  - rule_id: allocation_scope
    applies_to: "all datasets"
    rule: "Apply this hierarchy only to an attributional study requiring allocation. Declare goal, included coproduct functions, common-process gate, stocks and temporal scope. A different modelling situation, recycling transfer convention or product comparison needs its own method decision; neither industrial process diagrams nor this candidate imply whole-ILCD conformity."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_subdivide
    applies_to: "all exchanges"
    rule: "First assign dedicated measured inputs/operations and actual or virtual subdivision to the receiving product/cohort. Preserve separately metered batch, furnace, forehearth, mould cooling/compression, lehr, surface treatment, inspection and services; evaluate each shared exchange independently. A common furnace does not justify one arbitrary global ratio."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_causality
    applies_to: "remaining common exchanges"
    rule: "For each remaining exchange identify the determining physical causal relationship and quantify its actual driver, considering real energy/enthalpy demand, processing duration, capacity constraint, occupancy or handled quantity only where causally determining. Different exchanges can need different drivers; mass, price or equal shares are not interchangeable author choices. Retain evidence, numerator, denominator and reconciliation."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_residual
    applies_to: "genuinely residual common exchanges"
    rule: "Only what genuinely remains after subdivision and exchange-specific causality uses the co-functions’ contemporaneous market values in their actual condition at the same common-process exit/entry gate. Preserve quantities, price period, product/waste/service status and sensitivity; future retail value, arbitrary fixed shares or a total plant revenue shortcut are not this basis. Missing required causal/value evidence remains unresolved."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_returns
    applies_to: "cullet; rejects; packaging; services"
    rule: "Internal cullet/rework cancels as internal physical transfer and retains every inherited burden, with actual recooling/remelting/cleanup increments. External cullet has an explicitly declared upstream waste/preparation/transport convention. Rejected jars, packaging returns and recovered heat are not automatic coproducts or avoided-product credits. Maintain all failed/zero-Q burdens and their real causal assignment without exporting them to unrelated accepted production."
    source_ids:
      - jrc-ilcd-2010
      - jrc-glass-bref-2013
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "silica; soda; limestone; dolomite; feldspar; sulfate; batch_carbon; external_cullet"
      record_type: "Raw measurement and history record"
      raw_fields: "actual whole supplier lot; wet/dry mass; assay and chemical formula; moisture; cullet origin/contamination; opening/closing raw batch melt WIP internal cullet; each inherited vector"
      collection_method: "Calibrated weighing/tare and issue/receipt records, independent composition/moisture analysis, furnace/forehearth stock and route records; separate native ingredient, supplied mixture and oxide child accounts. Aggregation method: Sum undivided raw amounts for each actual exchange/cohort; convert, reconcile history and actually allocate first. Only calc_reference produces per-reference-flow x_i; do not divide in raw collection or aggregation again."
      unit: "kg"
      frequency: "Each event and period reconciliation"
      temporal_coverage: "Full production period with all modes; actual original-cohort service window separately"
      site_scope: "Each actual line/furnace/circuit/stock and service gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; raw records; composition/state assays; complete physical/history ledgers; uncertainty"
    - protocol_id: cp_release
      process_id: "manufacture"
