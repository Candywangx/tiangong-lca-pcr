system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "all datasets"
      rule: "Only empty wide-mouth uncoloured soda-lime food jars by raw-batch air/natural-gas regenerative melting and wide-mouth plunger press-and-blow forming through actual hot-end outer coating when used, annealing/cooling, actual cold-end outer lubrication when used and unique first QC release are covered. Bottles; other forming/furnace routes; lids and closures; ampoules/vials; coloured/opal/lead/borosilicate glass; tubing; sheets; mirrors; insulating glazing; building blocks; glass fibres/fabrics/mats; decoration and inner treatment; filling and food processing remain outside this method. Real changed chemistry/route requires renewed applicability and all actual atomic exchanges; source product500766 does not prove the selected factory route."
      source_ids:
        - jrc-glass-bref-2013
        - emhart-making-containers
        - oi-jar-500766
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "From individually received raw ingredients and prepared external cullet, include receipt/storage, batch weighing/mixing, tank melting/fining/conditioning, gob shear and delivery, plunger blank pressing, inversion/final air blowing, take-out/ware handling, actual hot-end outer coating when used, annealing/cooling, actual cold-end outer lubrication when used, inspection/reject sorting and first release. Preserve batch, melt, forming, coating/anneal and QC subgate physical records even when inventory is consolidated. Do not replace manufacture with bought-finished-container packing."
      source_ids:
        - jrc-glass-bref-2013
        - emhart-making-containers
        - oi-glass-manufacture
    - rule_id: boundary_utilities
      applies_to: "manufacture"
      rule: "Include actual compressor/fan/pump and treatment energy, shear dilution, mould swabbing, cullet-quench water/oil separation, emission control, maintenance and every failed/zero-output/start/stop/idle/hot-hold/cleanup/rework interval. Purchased heat, each backup fuel, process gas, water-treatment chemical or other genuinely used ingredient requires its own atomic row and upstream boundary. No generic utilities bundle or nominal zero is allowed."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: boundary_q
      applies_to: "manufacture; services"
      rule: "Q is the sum of unique newly first-quality-released net dry finished-jar kg of the declared cohort, including retained actual coating and excluding removable packages/closures. Count each jar once; its closing FG is already in Q and is not added again as production output. Shipment, return, reinspection and service repair create no Q. Do not substitute net delivery or gross shipment as denominator. Actual post-release services retain original cohort, observed interval and future-coverage gaps separately."
      source_ids:
        - oi-glass-manufacture
        - emhart-making-containers
        - jrc-ilcd-2010
    - rule_id: boundary_history
      applies_to: "all inventories"
      rule: "Reconcile opening/closing raw stock, prepared batch, molten furnace/forehearth glass, forming/annealing WIP, internal cullet and FG by physical quantity and each inherited exchange vector. For non-WIP installed refractory, moulds, filter bags and fluid charges also retain physical stock and full historical vector. Already consumption-corrected raw records are not corrected twice. Current additions follow actual consumption/service assignment; retained stock is not assumed fully consumed."
      source_ids:
        - jrc-ilcd-2010
        - jrc-glass-bref-2013
    - rule_id: boundary_returns
      applies_to: "services"
      rule: "Link each real returned jar to original dispatch and first-release cohort, reverse its original dispatch quantity/vector, retain carried product/coating/water state and add only true incremental work/material/energy and measured mass/species changes. Opening FG, old returns and their histories never burden unrelated current Q. Re-melting a returned article transfers its original burden once into its actual new manufacturing cohort; it is not simultaneously a repair and a free new ingredient."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: boundary_packaging
      applies_to: "all packages"
      rule: "For each material/article and both incoming/outgoing supply, independently reconcile opening empty + attached WIP + attached FG + reusable inventory + new purchased + supplier-included physical arrival + external return received = corresponding closing + with gross physical dispatch + stand-alone external return sent + waste. These inventories and movement legs are mutually exclusive. Internal reuse/transfer cancels. Return received is not another purchase. Packaging is excluded from Q, and gross dispatch is not net product quantity or an automatic coproduct/credit. Identify actual moisture and any real repaired old/new wood/metal components separately."
      source_ids:
        - jrc-ilcd-2010
        - jrc-glass-bref-2013
    - rule_id: boundary_formulation
      applies_to: "all supplied preparations"
      rule: "Each bought whole formulation is purchased once; assay, active ingredient, retained coating and carrier water/oil are child mass/element accounts, not second purchases. Real on-site preparation instead lists each actual purchased ingredient, added water, mixing energy and loss; cancel internal mixture transfer. Raw glass ingredients are not purchased as finished batch and repeated again. Other actually used precursor/sorbent/packaging forms require a new specific row and applicability assessment."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: boundary_species
      applies_to: "all physical gates"
      rule: "Each actual species and outlet is atomic. NOx, SOx, total Sn/B/C, VOC as carbon, COD and aggregate metals/particles are analytical indicators, not arbitrary chemical masses. Keep NO, NO2, N2O and N2O4 distinct. Chemical formula/assay and independent reacted extent plus measured residual/capture support any stoichiometry; generic oxide or emission tables do not. Preserve all unknown species/quantities as unresolved, not zero or a fabricated split."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: boundary_water_air
      applies_to: "manufacture; services"
      rule: "Use one consistent physical control volume for humid-air intake and gross gas/water exits. Independently measure actual intake composition, outlet residual O2/N2/Ar, CO2 sources and water phases. Separate air-carried H2O, free raw moisture, formulation carrier, actual evaporation/condensation, structural water and genuinely evidenced step-specific reaction water/fuel water. Integrated volume is already integrated; only a true rate is integrated over time. Density is independently measured for that substance and state. External heat-exchange water/condensate returns are Product returns with true thermal state/enthalpy and supplier water-energy convention, not invented steam/boilers or free credits."
      source_ids:
        - jrc-glass-bref-2013
    - rule_id: boundary_completeness
      applies_to: "all datasets"
      rule: "Each manufacturing subgate, the FG service gate and their consolidation must close full wet physical mass and independently relevant elements (Si/Na/Ca/Mg/Al/C/H/O/S/Sn/Cl and real other constituents), with internal batch/melt/cullet/first-Q transfers cancelled. Reconcile measured product coating/water/part changes by cohort. A single residual cannot solve two unknowns; total mass/element closure does not prove molecular or reaction-water identity. Measured gaps beyond declared uncertainty remain a data-production hold."
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
