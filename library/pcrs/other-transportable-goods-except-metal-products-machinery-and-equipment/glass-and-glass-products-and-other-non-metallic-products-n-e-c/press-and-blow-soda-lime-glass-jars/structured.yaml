  calculation_rules:
    - id: calc_raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert each raw amount to its row unit once before allocation: native kWh ×3.6 = MJ; kg remains kg. Only true rates are time-integrated; already integrated volumes are not multiplied by duration. Mass/volume requires independently measured density for that material/state. A count with Item(s)/item factor1 still supplies no kg/item. A real count-to-mass conversion requires measured net mass for the same configuration and stated sampling/weighing method; capacity never determines glass mass."
      inputs:
        - cp_material
        - cp_energy
        - cp_water
        - cp_formulation
        - cp_aux
        - cp_species
        - cp_packaging
        - cp_transport
        - cp_service_energy
        - cp_service_transport
      output: "converted undivided raw_i"
      source_ids:
        - jrc-glass-bref-2013
    - id: calc_history
      applies_to: "all inventory rows"
      rule: "For each physical stock and exchange vector: opening inherited burden + assigned actual additions + real returned/original-dispatch reverse = closing inherited burden + actual completed-cohort burden + other traced destinations. Preserve raw batch/melt/WIP/cullet/FG and separate non-WIP installed stocks; correct a consumption basis only once. Apply section7 allocation to remaining actual shared exchanges before normalization. Internal transfers cancel without losing their original burden. For the manufacturing account the closing vector includes only not-yet-first-released raw/batch/melt/WIP/internal-cullet stock and the separately reconciled residual installed stock; newly first-released FG is the first-Q transfer, never also a manufacturing closing-FG debit. The FG-service vector ledger is separate: opening FG vector + first-Q internal transfer + actual returned original-dispatch reversal + true incremental service additions = closing FG vector + gross-dispatch destination vectors + actual other external destinations. Preserve each original cohort; this ledger neither adds another Q nor reassigns opening FG to current Q."
      inputs:
        - cp_material
        - cp_release
        - cp_aux
        - cp_formulation
        - cp_service
        - cp_packaging
      output: "A_i converted history-reconciled actually allocated undivided numerator"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q; A_i is this converted history-reconciled actually allocated undivided exchange numerator for its originating first-release cohort; Q is unique newly first-quality-released net dry finished-jar kg of that cohort. Divide exactly once for Q>0; Q=0 retains raw burden and investigation/future assignment but no unit result. Cards and aggregation reference this same x_i without dividing again. Manufacturing and separately observed service vectors remain distinct; closing FG already belongs to Q."
      inputs:
        - cp_release
        - cp_material
        - cp_energy
        - cp_water
        - cp_formulation
        - cp_aux
        - cp_residue
        - cp_species
        - cp_service
        - cp_packaging
        - cp_transport
        - cp_service_energy
        - cp_service_transport
      output: "x_i per 1 kg reference flow"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "At each manufacturing subgate, FG-service gate and combined gate, opening physical quantities + actual external inputs = closing quantities + actual gross product/waste/species exits, cancelling internal batch/melt/cullet/Q transfers. Reconcile wet mass, relevant elements and water phases independently from molecular species and genuine step-specific reaction/fuel water evidence. Include true coating/parts/water changes and their cohort histories. Gross air and package ledgers stay physical even when their burden accounting differs. No one residual solves two unknowns. Manufacturing physical closing excludes newly first-released FG: its Q outlet is the service gate’s internal inlet. The FG-service physical gate independently reconciles opening FG + new-Q transfer + actual returned jars + actual added material/water = closing FG + gross physical jar dispatch + actual other jar/waste/species destinations, retaining real coating/parts/moisture changes. Consolidation cancels the internal Q transfer; the single reference-production Q remains an accounting reference, not an extra external physical exit alongside FG and gross shipments."
      inputs:
        - cp_material
        - cp_release
        - cp_water
        - cp_formulation
        - cp_aux
        - cp_residue
        - cp_species
        - cp_service
      output: "independent physical/elemental and molecular/source closures"
      source_ids:
        - jrc-glass-bref-2013
        - jrc-ilcd-2010
    - id: calc_packaging
      applies_to: "all inventory rows"
      rule: "Per single article: opening empty + attachedWIP + attachedFG + reusable + new purchase + supplier-included physical arrival + external-return-received = corresponding closing + with gross physical dispatch + stand-alone external-return-sent + waste. Mutually exclusive legs prevent duplication. Cancel internal reuse; separately assign actual acquisition/service burden to the original cohort. Moisture and real repair new/old components reconcile separately and never enter jar Q."
      inputs:
        - cp_packaging
        - cp_service
      output: "article gross physical balance and undivided assigned burden"
      source_ids:
        - jrc-ilcd-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_terminal
      applies_to: "all datasets"
      requirement: "Actual jar drawing, composition, blank-press/final-blow route, annealing/coating/QC evidence and calibrated net mass establish the terminal; a manufacturer offer alone does not establish the future site route or suitability."
      evidence: "drawing; batch record; furnace/forming/lehr logs; coating supplier data; release and weighing records"
    - id: dq_temporal
      applies_to: "all inventory rows"
      requirement: "Use the same full production period for raw quantities, Q and stock vectors, including failures/idle/cleanup. Disclose each actually observed post-release service window, retained old cohorts, incomplete future coverage and later increments."
      evidence: "period ledger; calibration; all-mode logs; cohort-return history"
    - id: dq_identity
      applies_to: "all UUID-bearing rows"
      requirement: "Retain native restrictions and actual provider/form match; external evidence controls methodology while UUIDs identify physical rows. Concrete unbound flows require real future matching, not a collection-label substitute."
      evidence: "native record review; actual supplier assay/SDS; stated geography/voltage/state"
    - id: dq_closure
      applies_to: "all physical gates"
      requirement: "Retain independent calibration, sampling/detection limits, moisture/species uncertainty, raw conversion, causal assignment and full physical/history balances. Unknown core relationships or missing required stocks/species closure remain unresolved; a successful engineering check cannot certify measured data."
      evidence: "complete raw ledgers; independent assays; outlet sampling; balance and uncertainty report"
validation_rules:
  - rule_id: validate_scope
    applies_to: "all datasets"
    rule: "These checks concern only the complete section1 raw-to-first-release empty wide-mouth uncoloured soda-lime press-and-blow jar and its original-cohort services. Unproved product, manufacture, stock/species relationships or later service interval remain explicitly unresolved; these engineering checks cannot extend the method to bottles, closures or other routes."
    source_ids:
      - jrc-glass-bref-2013
      - emhart-making-containers
      - jrc-ilcd-2010
  - rule_id: validate_terminal
    applies_to: "all datasets"
    rule: "Verify empty wide-mouth uncoloured soda-lime jar, actual batch-to-regenerative-melt and press/plunger-blank/final-blow route, annealing and first QC release. A purchased jar, bottle route, broad classification match or supplier catalog alone cannot prove the foreground route."
    source_ids:
      - jrc-glass-bref-2013
      - emhart-making-containers
      - oi-jar-500766
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Use finished_jar as the unique linked Product output and 1kg net dry finished jar as reference. Every other exchange collects undivided raw records and uses calc_reference x_i once after conversion/history/actual allocation. Q=0 retains raw burdens and produces no unit result. Do not infer kg/item, density, yield or a glass mass from container capacity."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_ledgers
    applies_to: "all physical gates"
    rule: "Check independent wet-mass/element, molecular/water-source, manufacturing-WIP, non-WIP installed-stock, first-release FG and per-article packaging balances. Original-return reversals and actual repair mass/composition changes must agree with each cohort Q. No guessed residual, hidden inventory stream, double correction, old-FG burden transfer or repeated first release can pass."
    source_ids:
      - jrc-glass-bref-2013
      - jrc-ilcd-2010
  - rule_id: validate_native
    applies_to: "all UUID-bearing rows"
    rule: "Recheck all native names, synonyms/comments, CAS, fixed grade/form/route/geography/medium/type and every exact referenced flow-property to unit-group reference-unit chain. Each card carries its binding limitations; ordinary provider/auxiliary UUID gaps remain concrete and tracked. A contradictory CAS, form, structure or route is not repaired by classification; isolated taxonomy noise is disclosed separately. UUID identity never supplies a quantitative factor or provider approval."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_evidence
    applies_to: "all datasets"
    rule: "Keep source-specific scope, counterexamples, uncertainty, temporal/site coverage and observed service window visible. Missing true core terminal/route evidence, required histories, valid measurement or physical/species closure is a hold; routine future factory measurement, unspecified provider or a concrete auxiliary identity gap alone does not make the method draft. Schema/projection/finite checks establish engineering consistency, not scientific/translation approval, accepted mapping or publication."
    source_ids:
      - jrc-ilcd-2010
      - oi-jar-500766
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
