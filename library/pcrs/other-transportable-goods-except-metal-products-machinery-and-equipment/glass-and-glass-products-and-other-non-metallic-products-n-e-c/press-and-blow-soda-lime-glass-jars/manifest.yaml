  semantic_boundary_decision: All1252 material records at checked34 inspected through complete13-page
    material catalog; relevant glass-sheet, woven-fibre, food-in-bought-jar methods are not
    compatible raw-to-empty-jar manufacture. Frozen37111 tubing,37112 rolled sheet,37114 cold-edge
    and37115 toughened sheet scopes read without mutation. Concurrent37116/37117/37121/37129 slots
    initially clean at common base; their assigned mirror/insulating, building-glass, filament and
    nonwoven boundaries are explicitly excluded. New identity is the narrower empty uncoloured
    wide-mouth soda-lime press-and-blow jar method, not the whole37191 leaf. No shared
    mapping/catalog/ADR/index mutation.
  source_synthesis_limitations: JRC container method plus independent Emhart mechanism and O-I full
    manufacture/real jar terminal support qualitative technical synthesis. O-I product500766 is
    evidence of actual food-jar supply, not the selected factory, recipe or furnace/forming/coating
    route. Do not reuse nominal recipe, temperature, yield, density, per-item weight,
    furnace/emission factors, capacity, certification, strength or life. ILCD only supports declared
    attributional allocation hierarchy; industrial documents do not.
  reference_gate: Unique new first-quality-released net dry finished-jar kgQ including actual retained
    coating and excluding removable packaging/closures. ClosingFG already inQ. Actual later services
    keep original cohort/history and observed interval, with original-dispatch reversal and true
    incremental repair/mass/species changes. All failed/zero/startstop/idle/cleanup and
    opening/closing raw/WIP/FG/non-WIP installed vectors retained. Raw collection remains undivided;
    calc_reference A_i/Q once. Q0 has no unit result.
