  native_identity_limitations:
    limestone: Whole carbonate rock input; actual assay and moisture determine retained mineral and
      separately evidenced reacted carbon. Native Product/Mass limestone explicitly leaves
      composition, purity, industrial grade, extraction route and provider unspecified; no fixed
      geography, CAS or other property is declared. Actual rock assay, supplied moisture, processing
      and upstream burdens must be established; this is not pure CaCO3 or burnt lime by default.
    dolomite: Only if the actual batch uses raw uncalcined dolomite; no implied purchased burnt dolomite
      or default Mg/Ca composition. Native Product/Mass is raw dolomite mineral/rock at plant
      production mix for glass batching, not calcinated/agglomerated dolomite. No fixed geography,
      assay, CAS, grade or physical conversion is established. Native unreported-quantity wording is
      no quantity evidence.
    feldspar: Actual mineral batch constituent if used; analyze its alkali/alumina/silica contribution
      without transferring a typical-recipe estimate. Native Product/Mass is
      feldspar/alkali-feldspar mineral sand at plant production mix used as batch raw material; no
      CAS, fixed geography, chemistry or grade. Its comment mentions a typical soda-lime recipe
      estimate; none of that estimate is adopted as amount, composition or factor. Actual
      assay/provider state governs.
    core_electricity: Submeter batch transport/mixing, actual boost, compressors, cooling fans/pumps,
      lehr electric heat, inspection and abatement across all operating modes; no equipment rating
      times nominal hours. Native Product identity is CN customer-side grid-average consumption mix
      at1–35kV, not generator output or a renewable contract. The reference property named Net
      calorific value is the MJ energy property, with native kWh factor3.6; it does not describe
      fuel mass or a heating value for glass. A different location, voltage or contractual mix
      requires a verified replacement, not inherited CN or emission factors.
    furnace_gas: Actual natural gas burned in the regenerative melter and separately submetered
      forehearth/lehr furnace burners. Keep gas mass, state-specific volume and measured net heating
      value distinct; backup fuel requires its own actual species/form row. Native Product/Mass
      natural gas is burned in an industrial furnace, with no fixed composition, geography or
      heating value; it does not identify boiler-only fuel, LNG storage or a guaranteed methane
      purity. Record whole supplied gas at actual state and each combustion location. The preserved
      old source-classification399 is taxonomy history, not chemistry or route.
    process_water: External treated industrial-water makeup for batch wetting, shear dilution, cullet
      cooling, circuit losses and cleaning. Record each destination; recirculation and
      purchased-formulation carrier water are not new supply. Native Product/Mass Process Water is
      treated industrial process/utility water, also naming reclaimed/recirculating water; no grade,
      supplier, geography or independent density is fixed, and the only declared property is Mass.
      Match actual supplied treatment and source. It is not raw abstraction, steam, internally
      circulating water repurchased, or water already in a bought formulation.
    air_nitrogen: Molecular child of actual combustion, forming, cooling and hood air within the same
      physical control volume; measured humid-air intake and composition, not a purchased
      compressed-air product in addition to compressor energy. Do not impose a nominal air fraction.
      Native Elementary/Mass is molecular N2 CAS7727-37-9, Resources from air/Renewable element
      resources from air; no geography or air fraction. Use only actual gas intake from ambient air,
      not the N2 emission, purchased liquid nitrogen, nitrates or a nominal dry-air coefficient.
      Liquefied/isotope synonyms do not change the declared ambient molecular state.
    finished_jar: Unique first quality release of one declared wide-mouth uncoloured soda-lime
      press-and-blow jar after actual annealing, specified surface treatment and QC. Q is weighed
      net dry finished-article mass including retained coating but excluding removable packages; no
      lid/closure is part of Q. Closing finished stock of this cohort is already in Q. Native
      Product/Mass identity is Glass Jar at plant production mix, with
      glass-container/container-glass synonyms and jar/food-storage comments; no fixed composition,
      wide-mouth dimensions, forming route, geography, provider or grade. Use only the declared
      empty uncoloured soda-lime press-and-blow wide-mouth jar within this PCR; bottles, closures
      and filled product are excluded. Native food-resistance prose does not certify this use or
      supply a life/strength/density/item mass.
    co2_fuel: Actual generated fossil-fuel/carbon-origin CO2 to air; keep mineral and ambient carried
      CO2 in separately measured source ledgers. This is no generic total-carbon conversion factor.
      Native Elementary/Mass is CO2 CAS124-38-9 of fossil origin emitted to unspecified air, not
      water, land-use-change, biogenic or a generic carbon-accounting correction. No geography or
      factor is fixed. Retain carbonate and atmospheric pass-through source accounts separately and
      select a verified other compartment when an actual more specific outlet is used. No
      reference-flow synonym noise authorizes a different chemical.
    water_vapor: Actual gross H2O release to air; separately trace air-carried, free moisture,
      formulation carrier, evaporation, fuel-generated and genuinely evidenced reaction-water
      contributions. Never infer all water from one mass residual. Native Elementary/Mass is
      ordinary H2O vapour CAS7732-18-5 to unspecified air, without geography or phase-conversion
      factor. Its expansive synonym list also contains ice, liquid, heavy/tritiated water and
      unrelated fragments; these are not adopted identities or permission to alter isotope/phase.
      Use only ordinary gaseous H2O; liquid wastewater and steam supply stay separate.
    oxygen_out: Actual unreacted or genuinely released molecular O2 to air; measure remaining oxygen and
      its source rather than infer nominal excess air. No dissolved/ionic/singlet oxygen or
      purchased liquid oxygen identity follows. Native Elementary/Mass is molecular O2 CAS7782-44-7
      to unspecified air; no geography or residual-oxygen factor. Synonyms include liquid,
      singlet/ionic and dissolved forms; these do not identify the actual ordinary gaseous outlet.
      The corresponding atmospheric intake needs its own resource identity rather than reusing an
      emission UUID.
    no_air: Only actual molecular NO with species-specific measurement; NOx reported as NO2-equivalent
      is not this amount. Nitrous oxide candidates are not NO. Native Elementary/Mass is molecular
      NO CAS10102-43-9 to unspecified air, without a fixed geography or factor. Synonyms include
      correct nitric oxide/NO but also HNO/nitroxyl and a French dioxide term; those are not adopted
      species. Use only independently measured ordinary gaseous NO consistent with the basename and
      CAS; no NOx-equivalent, NO2, N2O, HNO or default speciation. A changed outlet requires a
      compatible reference.
    so2_air: Actual molecular SO2 to air from measured fuel/batch/retained-sulphur balance and species
      sampling; SOx or sulphur totals do not supply the molecule mass. Native Elementary/Mass is
      molecular SO2 CAS7446-09-5 to unspecified air with sulphur-dioxide synonyms; no fixed
      geography, concentration or factor. It is not SOx-as-SO2 analytical equivalence, sulphate ion,
      elemental sulphur or a product gas. Verify any changed compartment before reuse.
    hcl_air: Actual gaseous HCl to air from real furnace/coating operation after abatement; no aqueous
      hydrochloric-acid mixture or assumed SnCl4 conversion is represented. Native Elementary/Mass
      is HCl CAS7647-01-0 specifically to non-urban air or from high stacks. Use only that evidenced
      outlet; other HCl outlets remain separate. Synonyms include aqueous acids and formulations,
      which do not turn this molecular gaseous emission into a purchased acid solution. No
      concentration, capture efficiency, geography or reaction yield is supplied.
    hf_air: Conditional actually detected HF from raw/cullet contamination; no intentional fluoride
      formulation in scope and no HF default from a sector range. Native Elementary/Mass is
      molecular HF CAS7664-39-3 to unspecified air, without fixed geography/grade or emission
      factor. Isotope, hydrofluoric-acid and formulation synonyms do not identify actual
