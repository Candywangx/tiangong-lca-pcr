          description: "Conditional independently measured ordinary molecular H2O vapour, CAS7732-18-5, emitted from actual packaging repair/drying over H into the declared air compartment. Distinguish incoming air moisture, retained water and collected wastewater. No reaction source, fixed evaporation fraction, heavy-water identity or duplicate same-side emission is assumed. Ordinary molecular H2O vapour only; the primary basename/CAS and current unspecified-air category determine identity. Legacy heavy-water, ice, tritium and ethers synonyms do not authorize isotope, liquid, solid or other chemical substitution. This is not evapotranspiration or an assumed high-stack/long-term outlet. Native Mass 93a60a56-a3c8-11da-a746-0800200b9a66 → unit group 93a60a57-a4c8-11da-a746-0800200c9a66 → kg."
          amount:
            expression: "Use the single normalized a_i result defined in Section8; collect only original unnormalized records in cp_pack."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_pack
              source_ids:
                - jrc-ceramic-bref-2007
                - ilcd-allocation-2010
            ranges: []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Apply this section only to attributional studies whose decision context justifies allocation rather than substitution. The product method provides no free choice of physical versus economic fractions. Gross physical balances remain independent of burden sharing. ilcd-allocation-2010"
    source_ids: []
  - rule_id: allocation_subdivide
    applies_to: "shared operations"
    rule: "First dedicate or subdivide real processes and then virtually subdivide directly traceable ingredients, supplied formulations, equipment service and controls by actual recipe/batch/stage/cohort. Record why any remainder cannot be separated."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_physical
    applies_to: "residual shared exchanges"
    rule: "For each remaining exchange establish its own determining physical causality using actual measured cause of that exchange, such as time/load/thermal duty/throughput only where physically determining. A common mass fraction cannot automatically allocate electricity, kiln heat, mould wear and material at the same share. Reconcile allocation vectors to original totals."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "genuine unresolved multifunctional process"
    rule: "Only the demonstrably remaining inseparable inventory may use actual contemporaneous market values of real co-functions at the same common process gate and actual condition. Remove downstream conditioning/packing/transport from those prices; disclose source period, units, prices and sensitivity. No fixed ratio, automatic credit or unconstrained choice."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_failure
    applies_to: "manufacture; waste"
    rule: "Ordinary failure, breakage, rejected/sample material and offsite/sold waste remain with the originating production and actual treatment burdens. A burden transfer T_other requires a real independent other cohort/function and a justified allocation/handover decision once, with a recipient vector. Physical gross outlets remain complete. Internal reuse is not a new purchase or automatic co-product."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_stock
    applies_to: "manufacture; cohort_service"
    rule: "Carry every exchange’s inherited burden vector with opening/closing raw/WIP and genuinely unused unassigned service charges. Closing FG already belongs to first-release Q and does not defer its manufacturing burden. Preserve performed original-cohort service even for retained FG; only unused/unassigned service/charge carries. Do not deduct stock-corrected consumption twice."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "whole material inputs"
      record_type: "receipts and stage ledger"
      raw_fields: "supplier lot; whole supply form; mass or measured volume and density; carrier water; assay; opening/closing raw/WIP; stage issues and returns; inherited exchange vector; provider ownership"
      collection_method: "Calibrated weigh/invoice/recipe records and representative composition/moisture/phase samples; retain failed and zero-output activity. Capture each new true ingredient separately."
      unit: "kg; m3"
      frequency: "each receipt and batch"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_wheel"
      record_type: "first release record"
      raw_fields: "configuration and drawing; wheel ID; net complete bare-wheel mass; count; measured retained water/porosity; QC/test results; maker/specification; release time; sample/reject disposition; cohort Q"
      collection_method: "Weigh complete accepted bare wheels on a calibrated scale, excluding removable packages; reconcile unique first-release and all required manufacturer-governed tests/disposition. Collect actual count independently; no inferred kg/item."
      unit: "kg; item"
      frequency: "each wheel or traceable same-configuration weighed lot"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "energy and fuel"
      record_type: "meter and state records"
      raw_fields: "stage meter readings; original unit; interval; failed/idle/start/cleanup; gas/diesel composition; pressure temperature compressibility; independent carrier density; actual LHV/HHV; heat state and water ownership; providers"
      collection_method: "Read calibrated total/submeters; distinguish integrated volume from rate, gas mass from heat and electrical MJ from thermal MJ. Independently measure needed density/enthalpy at actual state; reconcile real recovery and external returns."
      unit: "MJ; kWh; kg; m3"
      frequency: "each stage/charge and meter interval"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
    - protocol_id: cp_asset
      process_id: "manufacture"
      flow_role: "named physical assets and repairs"
      record_type: "asset stock and service ledger"
      raw_fields: "asset ID/configuration; full acquisition/retirement mass/count; opening/closing installed wet stock; new/used replacement part and water X_in/X_out; charge receipts/withdrawals; actual use/wear/service driver; inherited provider vector"
      collection_method: "Separate physical stock movement from current measured service attribution. Weigh old/new parts and wet stocks; trace installed fluid and avoid whole-provider overlap only once; document genuine unused service/charge carry. No default life."
      unit: "item; kg; m3"
      frequency: "each acquisition/repair and period stocktake"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each separate named waste"
      record_type: "weighing sampling and destination"
      raw_fields: "stage/cohort; gross wet mass; moisture; dry constituents; retained/outsourced leg; treatment provider; sample/failure ID; justified burden recipient only if real"
      collection_method: "Independently weigh/sample each actual waste and destination; keep wet sludge and separate liquid, not total residues as one exchange; include genuine treatment activity and losses."
      unit: "kg"
      frequency: "each batch/transfer and period reconciliation"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each atomic resource/emission"
      record_type: "species and phase measurement"
      raw_fields: "outlet and compartment; CAS/chemical; source origin; phase; actual concentration basis; integrated volume or real flow rate/time; P/T/humidity/density; dust disjoint size bins; oxygen nitrogen argon water CO2 intake; organic burnout/structural water/retained water measurements"
      collection_method: "Use actual species-resolving sampling/monitoring and independent mass/element/phase evidence; no NOx-to-NO2, VOC-to-molecule or single-residual multi-unknown fit. Retain original units, detection limits and all real outlets."
      unit: "kg; m3; kg/h; mg/m3"
      frequency: "each actual run/outlet with representative monitoring"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
    - protocol_id: cp_pack
      process_id: "cohort_service"
      flow_role: "each packaging article/material"
      record_type: "six-leg physical and burden ledger"
      raw_fields: "material ID; supplier included I and owner; external purchase P; ER received returns; opening/closing empty and attached WIP/FG/reusable; gross S; EO; W; wet tare; internal reuse; source cohort; treatment; actual repair new/removed dry material and complete wet mass; separate H2O inlet/retention/wastewater/vapour; disjoint same-side flow overlaps; custody and provider owner ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID"
      collection_method: "Weigh/count each specific article with real composition and wet mass; reconcile full physical legs independently of burden shares; keep included ingress once and actual new inflow even in closing stock. Attribute waste/services to real stage/cohort. Actual repair/water measurements extend the same article balance; retained input and closing wet stock both remain. Match each child leg to its one parent meter/provider; no extra whole wet article purchase.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
      unit: "kg; item"
      frequency: "every receipt/shipment/return/waste and stocktake"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
    - protocol_id: cp_service
      process_id: "cohort_service"
      flow_role: "original-cohort incremental services"
      record_type: "observed service records"
      raw_fields: "original release IDs and Q; H; full opening/closing FG; actual service meters; gross delivery G and return R; state/moisture/added material/loss; permission/postwork tests/acceptance/disposition; unused charges"
      collection_method: "Observe actual original-cohort services over H; preserve performed load on retained FG. Record return history and genuine extra work separately, no new production or assumed reversibility. Add all real service emissions/waste/repair cards atomically before completeness claims."
      unit: "MJ; kg; m3"
      frequency: "each actual event within disclosed H"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "road_transport"
      record_type: "actual freight leg records"
      raw_fields: "provider scope; route; distance; gross load; packages; return leg/load; activity unit; fuel/exhaust ownership"
      collection_method: "Use actual distance and carried mass with declared service unit; no kilogram-only flow as tkm and no duplicate provider fuel/exhaust."
      unit: "tkm; kg; km"
      frequency: "each external road leg"
      temporal_coverage: "all real production events and opening/closing stocks; service actual H separately"
      site_scope: "declared plant, actual suppliers and each cohort/stage"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; original records; supplier scope; samples/tests; reconciled complete physical and inherited burden ledgers"
  calculation_rules:
    - id: raw_convert
      applies_to: "all inventory rows"
      rule: "Convert each original raw unit before attribution. Integrated gas/liquid volume is already a quantity and is not multiplied by time again; integrate only a true rate over its real interval. Use independently measured actual composition/state density for mass and actual enthalpy/heating convention for heat; electrical kWh ×3.6=MJ. Keep whole fuel mass and linked heat/species subledgers with one provider owner."
      inputs:
        - cp_material
        - cp_utility
        - cp_species
      output: "converted unnormalized activity"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: cohort_assign
      applies_to: "all inventory rows"
      rule: "For each manufacturing burden dimension i, separately from its physical-event disclosure, form attributable unnormalized manufacturing burden A_man_i = B_open_i + F_i - B_close_i - T_other_i. F_i is the actual already unit-converted, directly assigned or justified allocated current contribution including real failures/treatment. B_close excludes already-Q closing FG; T_other is used only with a genuine other function/cohort and one justified recipient transfer. Ordinary waste/sale/sample is not such a transfer. Stock-corrected consumption is not corrected again. These inherited/allocated burden vectors do not replace the complete gross V_i of an actual physical event; once_normalize selects that physical numerator separately."
      inputs:
        - cp_material
        - cp_utility
        - cp_asset
        - cp_waste
        - cp_species
      output: "A_man_i"
      source_ids:
        - ilcd-allocation-2010
    - id: cohort_service_assign
      applies_to: "cohort_service"
      rule: "A_serv_i is the actually performed incremental original-cohort service and attributable packaging burden over H. Carry only genuine unused/unassigned service or charge and unused packaging burden; do not subtract performed service for retained FG. Packaging physical balances stay gross, with ingress waste attributed to its originating stage. Keep raw manufacture/service totals and original Q; on consolidation cancel the internal first-release product leg and use A_i=A_man_i+A_serv_i without a second output. For FG/service physical cards A_serv_i denotes the full actually measured gross leg, separate from the attributed burden vector; it is not a second stock correction, economic fraction, provider purchase or credit. Actual held-FG service retains its original Q/H. Gross changed-state return R does not redefine the original delivered mass or unique first-release Q."
      inputs:
        - cp_pack
        - cp_service
        - cp_release
      output: "A_serv_i; A_i"
      source_ids:
        - ilcd-allocation-2010
    - id: once_normalize
      applies_to: "all inventory rows"
      rule: "For Q>0 evaluate a_i=A_i/Q once, where Q is measured uniquely first-released complete bare-wheel kg for the declared cohort and A_i is the final unnormalized ledger quantity in its own extensive native unit. Select the numerator by reported dimension. Every actual physical-event card uses A_i=V_i, its complete independently measured and unit-converted gross leg: this includes manufacture cards collected under cp_asset, cp_waste or cp_species, dissipated_heat, packaging/FG physical legs and any actual added thermal-carrier or return disclosure. Do not apply B_open+F-B_close-T_other, stock consumption, a service fraction or an economic share to that physical numerator. Keep the associated manufacturing/embodied/service burden vector separate with one provider owner; a gross movement creates no extra purchase, full-machine charge or credit. Material, fuel, electricity, transport and performed-service burden dimensions continue to use their separately attributed A_man_i or A_serv_i, not an unrelated site gross total. For every packaging P/I/ER/S/EO/W card A_i is its complete physical gross leg for the declared cohort/H, unaffected by burden shares; associated burden vectors are attributed separately under one owner. For separate manufacture/service reports use their corresponding A_i with the same original Q; report horizon H. Reuse a_i in each card/aggregation without further division. Q=0 retains burdens and has no unit inventory."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "a_i"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_gates
      applies_to: "manufacture; cohort_service"
      rule: "Total physical mass obeys opening wet stock + gross inputs = closing wet stock + gross outputs, with no mass creation term. Manufacturing ends at first-release handover Q and its stock gate includes raw/WIP, not the same-Q FG again. The FG/service gate includes complete opening FG + Q handover + gross returns R + real extra material/water inputs = complete closing FG + gross shipments G + real waste/species/other outputs. On consolidation cancel internal Q and stage transfers; do not add Q and its own closing FG as two outputs. Species reaction terms use independent phase/reaction evidence; relevant element balances also conserve. Retained/structural/reaction/free water and all air constituents remain independent measurements; one residual cannot determine two unknowns. Real material/water X_in/X_out deduplicates other incoming/outgoing flow terms only. X deduplicates only the same actual material/water already present in another same-side incoming/outgoing flow term of this same bridge; never a stock, opposite-side term or mere atomic-card existence. Retained new water/material remains both actual influx and closing wet stock. Record opening/closing non-WIP assets, installed fluids and packaging physical quantities independently of every inherited exchange vector."
      inputs:
        - cp_material
        - cp_release
        - cp_waste
        - cp_species
        - cp_asset
        - cp_service
        - cp_pack
      output: "physical and relevant-element residuals with independently measured unknowns"
      source_ids:
        - jrc-ceramic-bref-2007
    - id: packaging_gross
      applies_to: "cohort_service"
      rule: "For each packaging article j: opening_empty_j+opening_attached_WIP_j+opening_attached_FG_j+opening_reusable_j+P_j+I_j+ER_j = closing_empty_j+closing_attached_WIP_j+closing_attached_FG_j+closing_reusable_j+S_j+EO_j+W_j. S follows gross real shipments including re-deliveries, EO is external return out; internal reuse cancels. Remove only duplicate P/I whole-supply components and other overlapping influx/outflux terms, never new influx because it remains in closing stock. Allocate burdens separately; do not scale physical legs or Q by burden shares. When actual repairs or water exchange occur, extend the wet equation with disjoint Radd_j+H2Oin_j on the left and Rremove_j+H2Oout_j on the right; record free/bound/absorbed water, removed wood, wastewater and vapour separately. Whole wet P/I includes its carried water once. X removes only overlap in another same-side flow term, not closing stocks: retained repair additions and water must stay on both sides. Do not count the same replacement part in P and Radd, or removed matter in W and Rremove."
      inputs:
        - cp_pack
        - cp_service
      output: "each packaging physical reconciliation and separate burden ledger"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Whole-article reference identity must match the complete terminal; audit every native name/synonym/comment/CAS/form/route/geography/media/type and all properties. Retain exact property/group/unit support externally and carry actual use restrictions into this description. Specific unresolved auxiliaries remain visible; no generic bundle binding."
      evidence: "complete native identity and actual supplier/terminal records"
    - id: dq_complete
      applies_to: "manufacture; cohort_service"
      requirement: "Reconcile every stage, real route extension, failures, stock vector, treatment and physical outlet before dataset completeness. A chemistry/provider/auxiliary gap differs from a missing core whole-wheel identity. No unknown is reported as measured zero or passed QC."
      evidence: "raw-to-final trace; calibrated records; detection limits; source and uncertainty disclosures"
    - id: dq_sources
      applies_to: "all modelling rules"
      requirement: "Primary industry documents support the declared synthesis and counterexamples, not plant-specific quantities. Allocation relies on applicable ILCD attributional context, not industrial process PDFs. Preserve sampling period/site/configuration and independent source limitations."
      evidence: "source-specific applicability; manufacturer/spec QC; measurement and allocation decisions"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "finished_wheel"
    rule: "Require a positively compatible complete bare-wheel reference Product identity, all qualifiers and real maker/spec acceptance evidence before a concrete dataset claims usable methodology. Grain/binder/ball/other-tool identities and repeat release do not establish the terminal."
    source_ids:
      - jrc-ceramic-bref-2007
      - norton-38a-terminal
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Require finite unit-consistency inspection in both languages plus independent actual records for Q and each raw→converted→assigned A→single a chain. Preserve Q=0 and all real losses/stocks. Mechanical checking never establishes scientific/translation approval or a factory test pass."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_physical
    applies_to: "all physical gates"
    rule: "Require complete full-gross manufacturing/FG/combined balances, each packaging six-leg/stock equation, actual asset/repair/installed-fluid movement, and independent water/phase/species/element evidence. Do not reduce physical flow by allocation share or infer specific chemical mass from COD/VOC/NOx/total boron/carbon."
    source_ids:
      - jrc-ceramic-bref-2007
      - epa-abrasives-1995
  - rule_id: validate_returns
    applies_to: "cohort_service"
    rule: "Retain actual G/R masses/states and original release lineage; do not assume returned weight equals original delivered weight or that no material/water/loss changed. Any actual postrelease work needs manufacturer/spec permission and postwork tests/acceptance/disposition; broken vitrified wheels are not assumed recoverable. Services add no new production."
    source_ids:
      - comet-wheel-manufacture
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared compatible wheel manufacturing inventory in an LCA; complete applicability/identity/measurement evidence required"
  allowed_use: "Selected physical terminal and route; disclosed separate manufacture/service H accounts and honest uncertainty"
  excluded_use: "Operating/selection/safety/certification advice; recipe/speed/load/temperature/lifetime/yield defaults; full37910 coverage; automatic mapping/publication; unsupported whole-wheel identity or unmeasured plant claims"
  required_metadata: "All reference qualifiers; provider and whole-formulation ownership; original raw extensive units; cohort/Q/H; stocks/physical outlets; allocation decision and native restrictions"
  required_quality_disclosure: "Identity, core versus auxiliary/provider gaps, measured versus assumed fields, zeros/nonapplicability evidence, temporal/site scope, uncertainty and unresolved balances"
  update_trigger: "Change in whole-wheel/grain/bond family, geometry/insert/impregnation state, supply/recipe/firing/finishing/control route, provider native limits, acceptance specification, evidence or allocation boundary"
