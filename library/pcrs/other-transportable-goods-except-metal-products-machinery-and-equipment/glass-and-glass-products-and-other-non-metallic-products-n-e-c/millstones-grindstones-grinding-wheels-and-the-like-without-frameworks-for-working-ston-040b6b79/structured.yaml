system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "manufacture; cohort_service"
      rule: "Only complete bare plain straight annular white-fused-alumina vitrified-ceramic-bond wheels from whole grain/bond/dextrin/water through mixing, hydraulic pressing, drying, natural-gas periodic firing/cooling, full required finishing, balancing and maker-governed first complete acceptance are covered. Exclude loose grain/powder, binder-free grinding spheres, natural-stone wheels, SiC/sol-gel/diamond/CBN abrasive families, resin/rubber/shellac/silicate/magnesia bonds, cut-off discs, coated paper/belts, framework/shank/metal-hub/bushing assemblies, impregnation or wax/oil/sulfur treatment, recessed/cup/worm profiles, grinding equipment and installation/use systems. Retain actual postrelease original-cohort services without new Q. Other utility voltages/geographies need a compatible new identity; current electrical card is China1–35kV user-side grid only."
      source_ids:
        - jrc-ceramic-bref-2007
        - epa-abrasives-1995
        - norton-38a-terminal
    - rule_id: boundary_complete
      applies_to: "manufacture"
      rule: "Include all raw-to-complete-wheel operations and actual start/stop/idle/failed/zero-output/cleanup/rework/control/asset burdens; a wheel is not finished merely after firing. Actual final finishing and maker-governed balance/test/acceptance are inside first-release manufacture."
      source_ids:
        - jrc-ceramic-bref-2007
        - zische-wheel-manufacture
        - comet-wheel-manufacture
        - epa-abrasives-1995
    - rule_id: boundary_gross
      applies_to: "all physical exchanges"
      rule: "Maintain independent full gross mass and relevant Al/Si/C/H/O/B/F/Cl/S/N element balances. Incoming prepared formulations and assets include actual carrier water/deposits. Each external repair/water/packaging inflow and full wet closing stock remain; X_in/X_out removes only overlap with another incoming/outgoing flow term already counting that same leg, never stock retention. Physical gross legs are never multiplied by burden-allocation shares."
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-allocation-2010
    - rule_id: boundary_fg
      applies_to: "manufacture; cohort_service"
      rule: "First release Q already includes the same cohort closing FG; do not subtract its manufacturing burden or add it again as product output. Manufacturing B_close contains raw stores, WIP and genuinely unused/unassigned non-WIP supplies/service charges only. Postrelease delivery/return/reinspection is not production; original cohort burden and Q remain linked. Net-delivery accounting is outside this method and requires a full opening/closing-FG historical-burden, gross G/R and original-delivery reversal bridge before use."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_extension
      applies_to: "all inventory rows"
      rule: "Add every real newly observed supplied formulation, chemical, energy carrier, repair part, waste, emission species and external return as its own atomic card with native extensive unit and provider scope. A missing UUID is recorded for that specific physical exchange, not a collection label or permission to omit it. No fixed steam/boiler/condensate/air aggregate is assumed."
      source_ids:
        - jrc-ceramic-bref-2007
        - epa-abrasives-1995
    - rule_id: boundary_stage_receive_mix
      applies_to: "manufacture"
      rule: "Whole supply/packaging receipts and opening/closing feed; actual screening/conditioning, dextrin dissolution, wet/dry mixing and dust capture; retain upstream bond manufacture once"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-allocation-2010
    - rule_id: boundary_stage_form_dry
      applies_to: "manufacture"
      rule: "Actual die fill, hydraulic forming, demoulding, green-state inspection, dryer moisture/air/energy and green rejects/WIP"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-allocation-2010
    - rule_id: boundary_stage_fire_cool
      applies_to: "manufacture"
      rule: "Actual kiln charge/setting, binder/porogen burnout, vitrification, gas/air/heat, cooling, kiln losses and failed charges; no schedule specified"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-allocation-2010
    - rule_id: boundary_stage_finish_accept
      applies_to: "manufacture"
      rule: "All real face/bore/periphery machining, dust/wet-sludge/wastewater/consumable records, balancing, maker-required tests, samples/disposition and unique first release"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-allocation-2010
    - rule_id: boundary_stage_controls_assets
      applies_to: "manufacture"
      rule: "Actual extraction/filtration/maintenance and measured asset service with physical new/old parts, wet installed charge and stocks"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-allocation-2010
    - rule_id: boundary_stage_fg_service
      applies_to: "cohort_service"
      rule: "Actual original-cohort packing/storage/handling/dispatch/returns/H; ingress packaging attributed to its real originating stage"
      source_ids:
        - jrc-ceramic-bref-2007
        - ilcd-allocation-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-allocation-2010
