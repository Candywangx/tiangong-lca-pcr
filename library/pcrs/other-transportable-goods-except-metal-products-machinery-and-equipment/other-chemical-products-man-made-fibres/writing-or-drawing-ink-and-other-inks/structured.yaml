  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert raw numerator units with traceable actual factors before reporting. For measured volume use same-formulation density at the measured temperature; integrate rate over its recorded interval once. An integrated volume is already a total. For purchased steam heat use transferred mass times measured enthalpy difference; use 3.6 MJ per kWh only as an exact unit conversion."
      inputs:
        - "raw records"
        - "measured factors"
      output: "raw_period_j"
      source_ids: []
    - id: delivery_normalization
      applies_to: "all inventory rows"
      rule: "Q = unique positive actual net accepted delivered ink kg for the matched product/route/state/cohort, excluding packaging and undelivered stock; returns carry their reversals and cannot be credited twice. For each exchange/burden j, A_j = raw_period_j + opening_WIP_burden_j + opening_finished_burden_j - closing_WIP_burden_j - closing_finished_burden_j, after linked internal-transfer cancellation and documented physical subdivision; opening/closing terms are attributed exchange quantities, not kg of stock substituted for energy. Report a_j = A_j / Q once, only for Q > 0. Include all attributable failed/zero-output, reject, rework, packing, storage, handling and dispatch burdens. Cards and aggregation_rule refer to this same one reporting operation, never successive divisions. Terminal delivered_ink is fixed at 1 kg after this operation."
      inputs:
        - raw_period_j
        - opening_WIP_burden_j
        - opening_finished_burden_j
        - closing_WIP_burden_j
        - closing_finished_burden_j
        - Q
        - cp_delivery
        - cp_materials
        - cp_utilities
        - cp_packaging
        - cp_outlets
      output: "a_j"
      source_ids: []
    - id: physical_reconciliation
      applies_to: "formulate_dispatch"
      rule: "For each production and warehouse ledger reconcile physical opening mass + actual external receipts = external outputs + physical closing mass, cancelling internal links on consolidation and including measured air uptake if any. Keep packaging separate from ink. Assayed dye, carrier water and elemental subledgers do not become extra purchases. Actual species, reaction-water formation/consumption and phase/free-water changes need independent evidence; physical mixing alone supplies no reaction-water term. Unknown differences remain quantified uncertainty, not fitted emissions or fitted reaction water."
      inputs:
        - "mass and element ledgers"
        - "species and water measurements"
        - "stock and transfer records"
      output: "reconciliation evidence"
      source_ids: []
