allocation_rules:
  - rule_id: allocation_trace
    applies_to: "formulate_dispatch"
    rule: "First trace ingredients and production/warehouse/dispatch burdens to actual product-route-state cohorts, then subdivide shared operations using measured drivers. Record driver values and conservation. Do not invent a fixed allocation or credit waste as a co-product."
    source_ids: []
  - rule_id: allocation_failures
    applies_to: "formulate_dispatch"
    rule: "All attributable failed, zero-output, rejected and rework burdens remain in raw ledgers. A positive delivery cohort may bear them through documented causality; a standalone zero-Q period cannot be divided or silently discarded. Retain it for an explicit linked cohort or report no normalized dataset. Internal reacceptance creates no new production."
    source_ids: []
