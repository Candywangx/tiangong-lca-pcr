  reference_identity_debt: Native reference name, CPC35140, manufactured Product and Mass agree; generalComment
    erroneously says 352 Pharmaceutical products / 352 药品产品. Adopted as broad ink identity only, not pharmaceutical
    method. Geography/locationOfSupply, CAS and grade unspecified. No supplier, recipe, geography or hazard established.
  native_input_limits: 'Ethylene glycol: CAS107-21-1, pure industrial substance, ethylene-oxide hydration route,
    production and industrial input mix at plant; name mentions electrolyte solvent use but is not electrolyte-only
    grade. No geography/locationOfSupply or purity number. glycerol: CAS56-81-5, production mix at plant; no geography/locationOfSupply,
    grade or manufacturing route. Its health claims are not adopted. Both identities require supplier/background
    route and commercial-form verification.'
