allocation_rules:
  - rule_id: a_subdivide
    applies_to: "oil and secondary outlets"
    rule: "Separate directly attributable filtration/packing/storage/testing burdens from joint distillation burdens first. Record hydrolat and spent biomass with their true destination and specification: sale as a qualified coproduct versus discarded waste are disjoint physical portions, never both the same mass. Residue ethanol extraction is a separate downstream process; no automatic credit for potential use."
    source_ids:
      - turrini-lavender-2021
  - rule_id: a_joint
    applies_to: "joint burdens"
    rule: "Use a documented demonstrable causal physical relationship where it exists. Otherwise use actual contemporaneous net revenue shares of qualified oil and genuinely sold coproducts for residual joint burdens, with prices, quantities, time basis and sensitivity disclosed. No default coefficient, automatic hydrolat-water mass allocation or credit for disposal. Apply allocation only to burdens, not to the independent physical mass/species balance. If evidence cannot justify attribution, the concrete dataset remains incomplete."
    source_ids: []
  - rule_id: a_once
    applies_to: "all inventory rows"
    rule: "Every collection protocol retains undivided actual-period measurements, including failed/zero-output runs, cleaning, returns/rework and raw-material/WIP/finished stock masses and their carried exchange burdens. Assign by genealogy and physical subdivision before allocation. For each exchange, A_i is the attributable converted numerator after opening-WIP carried burden and closing-WIP deferral, co-product attribution and matched in-scope finished-cohort burdens. Do not apply a WIP correction twice or subtract released finished stock from production Q. calc_normalize is the sole reporting division: A_i / Q. Its appearance on a card and in aggregation_rule denotes that same operation, never sequential division. A zero-output campaign has no stand-alone per-kg result; carry its burdens to the causally matched accepted cohort or disclose unresolved attribution."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "oil_production"
      flow_role: "Plant receipts/charges"
      record_type: "collected_record"
      raw_fields: "species; cultivar; plant-part proportions; state; lot; wet net mass; moisture; raw-stock opening/closing; upstream provider basis; transport"
      collection_method: "Store undivided actual receiving/charge weights and moisture assays, stock and transport records; preserve complete supplier and cultivation burdens for each lot. No A_i/Q in collection."
      unit: "kg; moisture mass fraction; t km"
      frequency: "Every actual batch/transfer and matched reporting period"
      temporal_coverage: "Full period including failed/zero-output runs and all carried cohorts"
      site_scope: "Named actual plant, equipment owner and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated scales; botanical authentication; supplier records"
    - protocol_id: cp_utility
      process_id: "oil_production"
      flow_role: "Steam and electricity meters"
      record_type: "collected_record"
      raw_fields: "steam kg; pressure; temperature; dryness; enthalpy; meter start/end; electricity kWh; failed runs; utility provider; actual duration"
      collection_method: "Utility owner stores undivided matched-period meters, control loads and shared-load attribution; preserve upstream generator boundary. Rates may be integrated with duration; already integrated totals receive no extra time factor."
      unit: "kg; kWh; kPa; degC; kJ/kg"
      frequency: "Every actual batch/transfer and matched reporting period"
      temporal_coverage: "Full period including failed/zero-output runs and all carried cohorts"
      site_scope: "Named actual plant, equipment owner and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; steam supply contract; meter and equipment logs"
    - protocol_id: cp_water
      process_id: "oil_production"
      flow_role: "Separate water pathways"
      record_type: "collected_record"
      raw_fields: "makeup kg or integrated volume; density and temperature; circuit recirculation; washwater; steam water; plant moisture; condensate gross mass; oil/hydrolat separation; recycle; purge"
      collection_method: "Water owner records undivided actual pathway amounts and transfers; keep each internal stream identifiable and preserve physical water closure independently of purchases. No total-loop-volume procurement."
      unit: "kg; m3; kg/m3; degC"
      frequency: "Every actual batch/transfer and matched reporting period"
      temporal_coverage: "Full period including failed/zero-output runs and all carried cohorts"
      site_scope: "Named actual plant, equipment owner and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Separate meters; tank weights; density/temperature records"
    - protocol_id: cp_acceptance
      process_id: "oil_production"
      flow_role: "First oil release"
      record_type: "collected_record"
      raw_fields: "lot lineage; species and part; route; whole-oil net weight; tare; residual water; residual solvent test; chromatographic identity; specification; first-release flag; returned/reaccepted mass; Q"
      collection_method: "Quality owner weighs and records undivided newly accepted whole oil by unique first-release identity; oil specification and water/solvent acceptance are actual declared tests/limits, not invented generic values. Keep samples, rejects and already released rework separate."
      unit: "kg; measured composition"
      frequency: "Every actual batch/transfer and matched reporting period"
      temporal_coverage: "Full period including failed/zero-output runs and all carried cohorts"
      site_scope: "Named actual plant, equipment owner and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Net/tare weigh tickets; batch release and test records"
    - protocol_id: cp_finishing
      process_id: "oil_production"
      flow_role: "Filtration packing and tests"
      record_type: "collected_record"
      raw_fields: "pad dry mass; drum empty mass; complete supplied article; actual analytical solvent mass/composition; sample draw; reuse; cleaning; warehouse and dispatch energy/service; time and lot"
      collection_method: "Finishing owner retains undivided actual consumables, package transactions and test/warehouse/handling loads, including after-release loads belonging to this cohort. Full supplied articles/solutions are purchases once; constituents are subledgers."
      unit: "kg; kWh; actual service units"
      frequency: "Every actual batch/transfer and matched reporting period"
      temporal_coverage: "Full period including failed/zero-output runs and all carried cohorts"
      site_scope: "Named actual plant, equipment owner and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices; weights; test and store submeter/service records"
    - protocol_id: cp_residual
      process_id: "oil_production"
      flow_role: "Outlets emissions and coproducts"
      record_type: "collected_record"
      raw_fields: "hydrolat sale/discard/recycle; leachate; wet residue sale/discard; moisture; retained oil; rejected oil; used pad; washwater; spent lab solvent; cooling return; vapour; species/medium; control captures; composition; destination; price"
      collection_method: "Environmental owner records undivided separately measured actual outlets and disjoint destinations; assay actual species independently with uncertainty and mass closure. Retain failures and zero-output runs. COD is a water-quality measure, not a substitute mass/species ledger."
      unit: "kg; composition; actual monetary units"
      frequency: "Every actual batch/transfer and matched reporting period"
      temporal_coverage: "Full period including failed/zero-output runs and all carried cohorts"
      site_scope: "Named actual plant, equipment owner and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste tickets; water/air tests; receiver receipts; sale invoices"
    - protocol_id: cp_stock
      process_id: "oil_production"
      flow_role: "Cohort stock and burden lineage"
      record_type: "collected_record"
      raw_fields: "period; all batch runs; opening/closing raw stock and WIP; carried exchange burdens; new Q; opening/closing finished oil; dispatch; returns; rejects; rework; warehouse/packing/handling burdens; internal transfers; allocation evidence"
      collection_method: "Inventory owner stores undivided cohort mass/burden ledgers, including historical carried WIP and finished-stock burdens. Reconcile production and finished-store accounts separately; cancel internal transfers once on consolidation. Do not add released closing stock to Q or create new output on reacceptance."
      unit: "kg; original exchange units"
      frequency: "Every actual batch/transfer and matched reporting period"
      temporal_coverage: "Full period including failed/zero-output runs and all carried cohorts"
      site_scope: "Named actual plant, equipment owner and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Full batch genealogy; stock counts; historical LCI records; allocation worksheet"
  calculation_rules:
    - id: calc_convert
      applies_to: "all inventory rows"
      rule: "Convert raw measurements to their actual numerator unit before attribution. Liquid mass = integrated volume times actual composition/temperature-matched density. Integrate rate over actual duration only when it is a rate. Preserve steam state/enthalpy and independently measured phase/species amounts; no default yield or second duration multiplier."
      inputs:
        - cp_material
        - cp_utility
        - cp_water
        - cp_residual
      output: "converted raw ledger"
      source_ids: []
    - id: calc_attribute
      applies_to: "all inventory rows"
      rule: "For each exchange, construct A_i from complete converted matched-period burdens plus attributable opening-WIP carried burdens minus closing-WIP deferred burdens, with physical subdivision and justified residual joint allocation, and actual in-scope finished-cohort packing/storage/handling burdens. Track old released returns/rework with the original cohort; reconcile separate finished mass/burden ledger and cancel internal transfers. Do not add released closing finished stock as production output. Physical outlet A_i retains its actual matched mass; burden allocation does not reduce or duplicate that physical outlet ledger."
      inputs:
        - cp_stock
        - cp_material
        - cp_utility
        - cp_water
        - cp_finishing
        - cp_residual
      output: "A_i"
      source_ids: []
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "Report the attributable exchange amount per 1 kg reference flow as A_i / Q exactly once; Q is cp_acceptance unique positive newly released whole-oil net kg for the same cohort. The reference row is 1 kg. Card formulas and protocol aggregation point to this one operation, not repeated division."
      inputs:
        - A_i
        - Q
        - cp_acceptance
        - cp_stock
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: calc_physical
      applies_to: "oil_production"
      rule: "Reconcile complete physical input mass plus opening process stock and real inward returns against actual outward oil/aqueous/solid/waste/emission masses plus closing process stock, preserving internal transfer cancellation and disjoint destinations. Newly released Q is a subset of unique accepted oil, not every oil re-transfer. Separately reconcile water and independently supported actual species/elements. No unknown reaction-water residual fitting."
      inputs:
        - cp_material
        - cp_water
        - cp_acceptance
        - cp_residual
        - cp_stock
      output: "independent physical water and species balance"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "released_oil"
      requirement: "Verify real species/part/cultivar and supplied oil state, actual test methods, residual water and solvent limits, grade and batch identity; no source default or molecular substitute."
      evidence: "cp_material; cp_acceptance"
    - id: q_complete
      applies_to: "all inventory rows"
      requirement: "No missing failed runs, zero-output burdens, samples, WIP/stock carry or actual included warehouse/packaging/handling/rework. Keep uncertainty and unresolved attribution explicit."
      evidence: "cp_stock; cp_finishing"
    - id: q_source
      applies_to: "source applicability"
      requirement: "Use the two studies for their verified botanical/physical route and stream distinction only. Utah frozen laboratory material and Italian Rosa residue work do not establish present industrial quantities or geography. Wilson Table2 mass ratio and printed inverted sentence conflict; no yield default is taken."
      evidence: "wilson-lavender-2021; turrini-lavender-2021"
    - id: q_provider
      applies_to: "unbound auxiliaries"
      requirement: "Resolve each actual auxiliary and elementary species/medium before dataset finalization; retain blank UUID rather than adopting a contrary route/grade. Native broad identity is not a provider LCI amount."
      evidence: "supplier and environmental primary records"
validation_rules:
  - rule_id: v_identity
    applies_to: "released_oil"
    rule: "Require exact species/part/route/state and full actual oil identity and acceptance records; verify generic Product UUID compatibility separately from provider quantities, grade and geography. The unique reference_flow_link must select released_oil in both languages with the same UUID. Auxiliary UUID/provider gaps require disclosure and later binding, not fabricated identities."
    source_ids: []
  - rule_id: v_cohort
    applies_to: "all inventory rows"
    rule: "Q must be positive unique first-release whole-oil net mass of the matched cohort. Include all failed runs, rework, WIP carry and real storage/packing/handling loads; trace zero-output burdens. Production and warehouse balances must reconcile without counting released closing finished stock twice or a return as new production. Any unavailable actual required record leaves the concrete dataset incomplete."
    source_ids: []
  - rule_id: v_physical
    applies_to: "physical and species ledgers"
    rule: "Close total physical mass with measured inputs, water phases, oil, all outputs and stock changes before allocation; independently verify actual molecular species and supported elemental balances. Steam condensation, evaporation and water redistribution are phase changes, not net reaction-water production. Do not infer a reaction-water term, missing VOC or second unknown outlet from the same closure residual; disclose uncertainty and investigated losses. No oil amount from COD, GC-area conversion, assumed extraction yield or biomass remainder."
    source_ids: []
  - rule_id: v_dimension
    applies_to: "all inventory rows"
    rule: "Normalize only once using calc_normalize after raw conversions, attribution and stock burdens. Volumes require actual independently supported composition/temperature-matched density; a native secondary coefficient is not density. Hydrolat, leachate, oil and cooling return remain separate. Each waste transfer, direct release and coproduct portion must have one physical destination and no duplicate mass."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified industrial whole lavender oil input at the declared release gate"
  allowed_use: "Actual same botanical part, steam route, oil state and gate with compatible provider basis and complete carried burdens"
  excluded_use: "No service or therapeutic equivalence, other species, expressed/solvent/fractionated oils, hydrolat as oil, pure linalool as whole oil or assumed full35410 coverage"
  required_metadata: "species and cultivar; flower leaf stem proportions and harvested state; route and steam boundary; actual whole-oil identity and chromatographic test; actual residual water and solvent specifications; net mass tare and volume conversion temperature; first-release gate and unique Q; site and complete period; failed runs returns rework and samples; raw WIP finished stocks and carried exchange burdens; hydrolat leachate residue destinations and allocation; actual packaging warehouse handling dispatch scope; native classification debt and provider compatibility"
  required_quality_disclosure: "Primary measurements, provider compatibility, full stocks and water/species closure, allocation/uncertainty, native classification debt and unresolved auxiliary UUIDs"
  update_trigger: "Change in species/part/state, route, supplier/provider, steam boundary, specification, reference gate, coproduct destination or material evidence"
data_sources:
  - id: "wilson-lavender-2021"
    type: "literature"
    reference: "Wilson et al. (2021), Molecules 26, 2343, section 4 and Table 2; https://doi.org/10.3390/molecules26082343"
    used_for: "Actual flowering-top steam distillation, condenser/separator and filtration; plant-part qualification. Utah July2020 laboratory case, frozen material; no industrial setpoints, density or default yield. Printed yield sentence is inverted relative to table masses and is not adopted. Analytical hexane is not an extraction route."
  - id: "turrini-lavender-2021"
    type: "literature"
    reference: "Turrini et al. (2021), Applied Sciences 11, 5495, section 1, Figure 1 and section 2.1; https://doi.org/10.3390/app11125495"
    used_for: "Oil phase, hydrolat, still leachate and spent biomass are distinct; 2017 Albenga Italy cultivar Rosa case. Introductory volume/dry-weight yield and leachate concentration are not oil mass yields. Subsequent ethanol/ultrasound residue extraction is outside this oil route."
