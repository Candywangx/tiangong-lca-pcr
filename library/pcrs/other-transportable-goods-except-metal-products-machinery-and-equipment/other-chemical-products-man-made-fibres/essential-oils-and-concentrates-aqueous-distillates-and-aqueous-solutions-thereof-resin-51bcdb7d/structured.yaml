system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "oil_production"
      rule: "Include receiving, any actual pre-distillation holding, steam contact, condenser cooling, separator operation, filtration, release tests, cleaning, pollution controls, actual packing/onsite storage/handling and in-scope dispatch activities, rejects and rework. Delivered steam generation is upstream; if generated onsite, expand the generator as a separate measured unit, replace the internal steam purchase, cancel internal steam transfer and include actual feedwater, fuel/electricity, blowdown and emissions once. No equipment setting or laboratory scale is a factory default."
      source_ids:
        - wilson-lavender-2021
    - rule_id: b_phases
      applies_to: "water and oil ledgers"
      rule: "Separate direct-contact steam mass/enthalpy, inherent plant water, cooling-circuit makeup/return, cleaning water, gross condensed distillate, separated oil, hydrolat, bottom leachate, wet spent biomass, vapour and actual releases. Condensed steam is water transferred internally, not new oil or new purchased water. Closed cooling circulation is not fresh abstraction. Internal recycled hydrolat/condensate cancels when consolidated; record makeup, purge and real losses. Distinguish oil dissolved/dispersed in each aqueous stream from accepted oil."
      source_ids:
        - turrini-lavender-2021
    - rule_id: b_stock
      applies_to: "all inventory rows"
      rule: "Q is the positive net mass of uniquely identified whole oil first accepted and newly quality-released in the actual reporting cohort, excluding packaging tare and separately separated aqueous phase. It includes measured residual water retained within the accepted oil specification; do not substitute dry constituents, biomass, all condensate, sales or actual deliveries. A released lot returned, filtered and reaccepted is not newly produced Q. Keep its further burdens with its original cohort. Production outputs already include Q; do not add that same released closing finished stock as another output. Keep a separate finished-store/dispatch mass and burden ledger: opening finished stock plus production release and traced physical returns equals dispatch plus closing stock and actual loss, with return reversals linked. Cancel internal release handover when consolidating. Retain real packing, warehouse, handling/dispatch and rework burdens assigned to the same cohort; do not presume release equals delivery."
      source_ids: []
    - rule_id: b_complete
      applies_to: "all inventory rows"
      rule: "Whole purchased formulations, including their carrier water/solvent, enter procurement once; constituent assays are subledgers. This route uses actual plant material and steam, not a synthetic reconstruction from pure aromatic chemicals. Listed cards are not an exclusion list: add a separate atomic card for every actual extra cleaning chemical, fuel, refrigerant, package component, transport service, waste or elementary species/medium. No actual burden may be removed to fit the example. Distribution after the disclosed scope, consumer use and end of life remain separate stages."
      source_ids: []
