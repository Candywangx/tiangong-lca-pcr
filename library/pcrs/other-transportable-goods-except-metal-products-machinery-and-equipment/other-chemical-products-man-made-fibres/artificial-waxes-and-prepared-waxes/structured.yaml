      raw_fields: "owner: warehouse/despatch lead; SKU; route; state; cohort/lot; tare; G; R; P; accepted delivery timestamp; returns/reinspection/redelivery links"
      collection_method: "Retain unnormalized calibrated net weights and complete movement/acceptance records, distinguish P from delivery, trace each physical mass once and preserve prior-period return burden references."
      unit: "kg"
      frequency: "each movement and close"
      temporal_coverage: "complete actual interval including failed runs"
      site_scope: "declared site gate and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; signed acceptance; returns trace"
    - protocol_id: cp_materials
      process_id: "wax_blend_delivery"
      flow_role: "ingredient input"
      record_type: "lot weighing and procurement"
      raw_fields: "owner: production supervisor; separate material/SKU/CAS if supplied; actual route/grade; whole supply weight; water/active assay; receipt/consumption; raw stock opening/closing; internal reuse"
      collection_method: "Retain raw weighed receipts and actual consumption by material, reconcile stock changes without counting purchases and consumption twice. Keep assay subledgers separate from commercial purchases, no division by Q."
      unit: "kg"
      frequency: "each lot and run"
      temporal_coverage: "same complete interval and carried lots"
      site_scope: "receipt to dosing and remelt"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier CoA/SDS; recipe; scales; stock ledger"
    - protocol_id: cp_utilities
      process_id: "wax_blend_delivery"
      flow_role: "electricity, heat and supplied water in separate subledgers"
      record_type: "meters and utility service records"
      raw_fields: "owner: utilities engineer; meter/start/end; carrier; unit; supply/return state; power/flow rate and duration if applicable; integrated volume flag; temperature/density; all stage/run identifiers"
      collection_method: "Retain unnormalized meter differences or raw rate-duration observations for each actual stage including idle, failed, rework and warehouse loads. Measure net imported heat independently; no A/Q at collection."
      unit: "kWh; MJ; kg"
      frequency: "each shift/run and meter interval"
      temporal_coverage: "complete interval, no failed-run deletion"
      site_scope: "production plus declared warehouse/handling services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; calibration; utility bills; stage logs"
    - protocol_id: cp_packaging
      process_id: "wax_blend_delivery"
      flow_role: "carton and liner separately"
      record_type: "packaging issue/return records"
      raw_fields: "owner: packing supervisor; packaging material; net item mass/count; issues/returns; opening/closing stocks; reuse/loss; actual wax lot; tare"
      collection_method: "Record raw quantities by each actual package material and cohort including damaged/reused packages. Exclude packaging from wax mass, retain its real burdens; composite purchased packages are whole commercial inputs."
      unit: "kg"
      frequency: "each packing lot"
      temporal_coverage: "complete included storage and delivery interval"
      site_scope: "packing and warehouse"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase/issue documents; tare tests; reuse logs"
    - protocol_id: cp_logistics
      process_id: "wax_blend_delivery"
      flow_role: "road freight"
      record_type: "shipment and service records"
      raw_fields: "owner: logistics lead; origin/destination; mode; vehicle; actual payload mass; route distance; empty return; load allocation; declared gate"
      collection_method: "Retain raw mass-distance/service records for actual included legs without division; distinguish internal handling, inbound transport and terminal delivery to avoid duplicate carrier services."
      unit: "tkm"
      frequency: "each shipment"
      temporal_coverage: "all included legs and matched cohort"
      site_scope: "declared supply and dispatch boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "waybills; route evidence; carrier basis"
    - protocol_id: cp_residuals
      process_id: "wax_blend_delivery"
      flow_role: "each waste and elementary emission separately"
      record_type: "weighing, effluent and exhaust records"
      raw_fields: "owner: EHS lead; substance/stream; total mass; water/wax/element assays; destination/medium; treatment handoff; gas volume already integrated or rate/time; sampling condition; controls; recovery"
      collection_method: "Keep all raw residues/releases from normal, failed, cleaning and rework periods. Distinguish exported wastewater from direct water release. Independently support actual species and water phase movement, never infer reaction water or emissions from COD/residual."
      unit: "kg"
      frequency: "each waste movement and monitoring interval"
      temporal_coverage: "complete interval including incidents"
      site_scope: "actual receiver/air compartment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "manifests; treatment receipts; sampling/assays; mass balance"
    - protocol_id: cp_stock
      process_id: "wax_blend_delivery"
      flow_role: "raw, WIP and finished stock and burdens"
      record_type: "physical and carried-inventory ledgers"
      raw_fields: "owner: inventory accountant; raw/WIP/FG opening/closing mass; lot; route/state; carried inventory vector B; date; failed/rework/return links; warehouse handovers"
      collection_method: "Retain unnormalized physical stocks and their historical inventory vectors separately, including opening/closing WIP and finished wax. Record failed-period burdens and all production/warehouse handovers; trace return historical burdens and no new production on reacceptance."
      unit: "kg; row-specific inventory units"
      frequency: "each movement and interval close"
      temporal_coverage: "actual interval with prior-period lineage"
      site_scope: "production plus finished warehouse"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock count; reconciled transfer records; historical inventories"
    - protocol_id: cp_quality
      process_id: "wax_blend_delivery"
      flow_role: "identity and batch acceptance"
      record_type: "specification and test records"
      raw_fields: "owner: quality manager; SKU; complete recipe/whole commercial ingredients; supplier CAS if known; origin/route; physical state; approved specification; test methods; acceptance/rejection; geography/period"
      collection_method: "Preserve real lot composition and tests without replacing proprietary ranges by a universal formula. Verify solvent-free solid wax character and actual process; retain food-contact prohibition for representative 6006A and all native limitations."
      unit: "kg; specification units"
      frequency: "each SKU/lot/change"
      temporal_coverage: "current lot and complete interval"
      site_scope: "supplier and manufacturing site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "CoA/SDS; actual recipe; signed release; versioned tests"
    - protocol_id: cp_allocation
      process_id: "wax_blend_delivery"
      flow_role: "shared services and real coproducts"
      record_type: "metering and allocation decision"
      raw_fields: "owner: LCA lead; direct/shared load; product cohorts; physical relationship; measured driver; actual saleable output/value if needed; rejected alternatives"
      collection_method: "Keep raw totals and evidence for subdivision, physical causality and any justified alternative. Reject/waste is not a fictitious valuable coproduct. No collection-side division by Q."
      unit: "row-specific numerator units"
      frequency: "each interval and scope change"
      temporal_coverage: "matched complete interval"
      site_scope: "shared plant/warehouse assets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; allocation rationale; sensitivity; receiver records"
  calculation_rules:
    - id: calc_units
      applies_to: "raw conversions"
      rule: "m = V × rho(T, lot) for an already integrated material volume; rate readings are integrated over duration once. Electricity MJ = 3.6 × kWh only for a matching provider basis. Exhaust species mass uses measured concentration and compatible actual integrated dry/wet gas volume; never multiply integrated volume by time again. Preserve conversions, uncertainty and original units."
      inputs:
        - cp_materials
        - cp_utilities
        - cp_residuals
        - temperature
        - "lot density"
        - "meter basis"
      output: "raw converted numerator by row"
      source_ids: []
    - id: calc_gate
      applies_to: "wax_ref"
      rule: "Q = G - R from cp_output for the reconciled same product/route/state cohort, after tare and event deduplication, Q > 0. P is newly quality-released wax and is recorded separately. Preserve opening/closing FG stocks and historical burden on prior-period returns; neither undelivered FG nor reinspection is extra delivery or new production."
      inputs:
        - cp_output
        - cp_stock
        - cp_quality
        - G
        - R
        - P
      output: "Q"
      source_ids: []
    - id: calc_allocate
      applies_to: "shared burdens"
      rule: "Assign direct burdens first; subdivide shared operations where feasible. Otherwise use an evidenced causal physical driver; justify any other relationship and sensitivity after explaining why earlier options fail. Keep real saleable coproducts separate and preserve the unallocated gross mass/element ledger; no automatic waste credit."
      inputs:
        - cp_allocation
        - "raw period inventory"
      output: "attributed raw period inventory"
      source_ids:
        - eu-pef-allocation-2021
    - id: calc_stock
      applies_to: "all delivered-cohort rows"
      rule: "For inventory/burden component i, A_del_i = A_period_i + B_open_WIP_i + B_open_FG_i - B_close_WIP_i - B_close_FG_i, after documented cohort attribution and explicit historical-return corrections. A_period_i uses raw consumed inputs/services, includes all failed/zero-output/rework loads and actual included warehouse/packing/handling/dispatch; raw-material receipts and raw stock changes establish consumption once. B terms are carried inventory vectors, not invented current physical exchanges. Cancel paired internal transfers. Unresolved stock burden or all-failed period without positive supplied Q stays carried/pending, never dropped or normalized."
      inputs:
        - cp_materials
        - cp_utilities
        - cp_packaging
        - cp_logistics
        - cp_residuals
        - cp_stock
        - calc_allocate
        - "historical-return corrections"
      output: "A_del_i"
      source_ids: []
    - id: calc_normalize
      applies_to: "all reported inventory"
      rule: "q_i = A_del_i / Q once after raw conversion, stock reconciliation and attribution. Every card formula and protocol aggregation refers to this same reporting operation, never sequential division. The reference output is Q / Q = 1 kg. Do not divide at collection or normalize failed runs separately."
      inputs:
        - A_del_i
        - Q
        - calc_gate
        - calc_stock
      output: "q_i per 1 kg reference flow"
      source_ids: []
    - id: calc_balance
      applies_to: "physical ledger"
      rule: "Reconcile opening raw/WIP/FG mass + external material receipts + physical returns against gross external deliveries, exported waste, measured releases and closing raw/WIP/FG, separating packaging, utility water and wax component subledgers without double counting. Internal P/warehouse transfers cancel. Conserve applicable C/H/O with actual assays; actual species and water formation/consumption need independent evidence. A residual is unresolved, not an adjustable reaction-water or outlet term. This check does not perform a second normalization."
      inputs:
        - cp_stock
        - cp_materials
        - cp_output
        - cp_residuals
        - "actual composition"
      output: "physical closure and unresolved findings"
      source_ids:
        - igi-6000-sds-2018
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inputs and wax_ref"
      requirement: "Verify actual source/route/form/SKU and all native full-field limits; retain paraffin classification debt and 6006A food-contact prohibition."
      evidence: "cp_quality; supplier originals; full native records"
    - id: dq_period
      applies_to: "all rows"
      requirement: "Complete matched actual intervals including failed/zero-output/rework, stocks and historical burdens; no deleted warehouse/packing/handling/dispatch or duplicate normalization."
      evidence: "cp_output; cp_stock; cp_utilities; calc_normalize"
    - id: dq_balance
      applies_to: "physical mass and species"
      requirement: "Gross physical mass/elements close within documented measurement uncertainty; independent species and water records, no fabricated residual terms."
      evidence: "cp_materials; cp_residuals; calc_balance"
    - id: dq_provider
      applies_to: "concrete dataset"
      requirement: "Resolve actual auxiliary identities, compatible upstream quantities/geography/time and treatment routes before a completed linkage claim; preserve uncertainty and missing metadata."
      evidence: "provider records; unresolved register; sensitivity"
validation_rules:
  - rule_id: v_identity
    applies_to: "product and route"
    rule: "Verify the prepared paraffin–soy mixture, non-reactive route and solid carrier-free delivery; preserve every native name/route/mix/absence/metadata debt and actual SKU restrictions. Class label alone, broad UUID or tool schema success cannot establish applicability or science approval."
    source_ids:
      - wco-hs34-2022
      - igi-6006a
  - rule_id: v_measurement
    applies_to: "all rows"
    rule: "Require positive unique actual supplied Q, complete matching interval raw numerators, failed/zero-output/rework and return records, opening/closing WIP/FG burdens and one normalization. Distinguish P from Q; keep all included real warehouse/packing/handling/dispatch loads and cancel only internal handovers."
    source_ids: []
  - rule_id: v_mass
    applies_to: "whole materials and actual species"
    rule: "Require whole-purchase versus component reconciliation, independent mass/element and actual-species evidence, no phase-change reaction water, no volume-time duplication and no fitted outlets. Report unresolved mass or emission speciation explicitly."
    source_ids:
      - igi-6000-sds-2018
  - rule_id: v_complete
    applies_to: "dataset completion"
    rule: "Each conditional atomic row needs evidence of presence with quantity or genuine non-applicability. Add actual additional inputs, wastes and species as specific rows; missing auxiliary UUID/provider blocks that dataset linkage, not an otherwise authored PCR. Unresolved final reference identity or method scope does block usable methodology."
    source_ids: []
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input wax material for further formulation/candle manufacture, conditional on actual grade/gate compatibility."
  allowed_use: "Matched solid paraffin–soy prepared wax with declared net-delivery and complete inventory."
  excluded_use: "Finished candle/use-stage combustion, food-contact approval, pure paraffin/synthetic-wax synthesis, emulsion or generic whole-leaf coverage."
  required_metadata: "Required qualifiers in §3; process/site and date; all protocols/units; stock and return burden lineage; packaging/logistics; allocation; providers; native limitations."
  required_quality_disclosure: "Actual evidence coverage, failed runs and raw numerator completeness, unresolved UUID/provider/species gaps, measurement uncertainty and exact boundaries; not a claim of scientific approval."
  update_trigger: "Recipe, supplier/route, physical state, acceptance restriction, energy/treatment, gate, inventory practice, source or native identity changes."
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes (30 June 2025), PDF p.172, subclass 35332; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification coordinate and adjacent polishing preparations only; no recipe or acceptance decision."
  - id: "wco-hs34-2022"
    type: "official_guidance"
    reference: "WCO, HS Nomenclature 2022, Chapter 34, Note 5 and headings 3404–3406; https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0634_2022e.pdf?la=en"
    used_for: "Positive wax/fat mixture identity and exclusions, including mineral-wax-only mixtures and liquid-medium dispersions; classification context, not a customs determination for IGI."
  - id: "igi-6006a"
    type: "literature"
    reference: "The International Group, IGI 6006A product page; https://igiwax.com/product/igi-6006a/"
    used_for: "Real specialty wax formulation for further container-candle manufacture; product page says not for food contact. No factory, recipe, quantity or certification default."
  - id: "igi-candle-waxes"
    type: "literature"
    reference: "The International Group, Waxes for Candles, IGI 6006A row; https://igiwax.com/application/candles/"
    used_for: "Paraffin-soy blend identity and soft white/off-white market character; fragrance capacity is downstream context, not fragrance already present or a universal loading."
  - id: "igi-wax-blending"
    type: "literature"
    reference: "The International Group, Wax Blending capabilities; https://igiwax.com/capabilities/wax-blending/"
    used_for: "Industrial physical blending, solidification/forming and packaging interfaces; multiple North American sites, no assignment of 6006A to one site, energy source or exact recipe."
  - id: "igi-6000-sds-2018"
    type: "literature"
    reference: "The International Group, 6000 Series SDS 929124, Version 02, 11 April 2018, pp.1–2,4,9; https://igiwax.com/app/uploads/2024/11/6000-Series-929124_USA_English.pdf"
    used_for: "Series includes 6006A; mixture, solid forms, stable normal use and proprietary composition. Broad series percentages and property ranges are not a 6006A recipe, density conversion, process emission factor or target. Hazardous decomposition under abnormal conditions does not prescribe normal emissions."
  - id: "eu-pef-allocation-2021"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279, Annex I §4.5, pp.63–64; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Generic multifunctionality hierarchy only; no wax share, automatic avoided burden or claim of full PEF/CFF conformity."
