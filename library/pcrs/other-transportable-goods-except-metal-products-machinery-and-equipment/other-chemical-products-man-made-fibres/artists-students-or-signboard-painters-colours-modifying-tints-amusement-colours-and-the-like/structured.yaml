allocation_rules:
  - rule_id: al_cohort
    applies_to: "colour_make"
    rule: "Use direct job/lot metering for this one colour; allocate shared manufacturing support by documented causal driver and retain the full unallocated totals and residual reconciliation. Do not use a generic paint energy split, revenue ratio, solvent credit or artist-use benefit."
    source_ids: []
  - rule_id: al_returns
    applies_to: "i_return; o_reaccepted"
    rule: "Same-product reacceptance is not a co-product or new saleable production. Pair original mass/burden ids; cancel transferred original burdens and count incremental rework once on the original cohort. Reopened cohorts require a disclosed restatement. A zero-output failure retains its losses/energy in the matched cohort; if Q=0 retain a raw failure record and do not divide or emit a per-kg result."
    source_ids: []
  - rule_id: al_waste
    applies_to: "waste outputs"
    rule: "Off-spec paste, dust, washwater and rejected packaging are separately measured wastes. Actual recovery and receiver treatment require evidence; none is an automatic negative product burden. Any genuine separately sold co-product requires a distinct boundary/allocation review before this single-product profile is used."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "colour_make"
      flow_role: "o_new"
      record_type: "Quality release and calibrated weighing"
      raw_fields: "lot; product identity; first-release timestamp/id; gross/tare/net kg; acceptance; rejected samples; prior-release id; Q"
      collection_method: "QC owner and filling supervisor reconcile calibrated net fills to unique first release. Deduplicate prior releases, returns and reacceptance. Keep raw Q in kg, packaging excluded; no division. Finished warehouse handover and dispatch are separate raw ledgers."
      unit: "kg"
      frequency: "Each filled lot and release"
      temporal_coverage: "Complete actual period and traced cohort, including failed/zero-output runs and all periods carrying WIP or returns"
      site_scope: "Declared site and this PW6 acrylic route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration, signed release and cohort id audit"
    - protocol_id: cp_period
      process_id: "colour_make"
      flow_role: "i_return; o_reaccepted; WIP"
      record_type: "Stock and burden ledger"
      raw_fields: "period; lot; opening/closing WIP kg and composition; carried material/energy/waste burdens by exchange id; internal transfer ids; first release ids; returned/reaccepted kg and original burden ids; Q"
      collection_method: "Production accountant owns the raw matched-cohort ledger. Record all period activity, zero-output failures, rework and WIP carry; trace opening burdens from prior periods and carry closing burdens forward. Pair return transfers with original cohorts and preserve incremental rework. Collect physical stock and burden ledgers separately, with no A/Q division; final-stock movements after first release do not create production outputs."
      unit: "kg; MJ"
      frequency: "Each movement and period close"
      temporal_coverage: "Complete actual period and traced cohort, including failed/zero-output runs and all periods carrying WIP or returns"
      site_scope: "Declared site and this PW6 acrylic route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed stocktake, prior-period burden ledger and non-duplication reconciliation"
    - protocol_id: cp_material
      process_id: "colour_make"
      flow_role: "purchased ingredients and water"
      record_type: "Weighing and supplier records"
      raw_fields: "exchange id; lot; supplied wet kg; receipts/issues/returns; stock; assay/solids/water; supplier article; temperature; volume or rate and duration; density source"
      collection_method: "Material custodian records raw actual weighed issues and losses, including failed batches and cleaning; reconcile opening and closing raw stock and matched WIP burdens. Keep each complete commercial formulation as one external purchase; composition fractions are a separate non-additive subledger. Retain raw converted numerators without division."
      unit: "kg"
      frequency: "Each issue and batch"
      temporal_coverage: "Complete actual period and traced cohort, including failed/zero-output runs and all periods carrying WIP or returns"
      site_scope: "Declared site and this PW6 acrylic route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices, scales, supplier CoA and composition disclosure"
    - protocol_id: cp_energy
      process_id: "colour_make"
      flow_role: "i_power"
      record_type: "Meter and operating log"
      raw_fields: "meter id; start/end kWh; time; run/failure/rework id; shared support total; causal allocation; WIP carry"
      collection_method: "Utilities owner collects full attributable actual-period meter numerators and matched carried burdens. Include failed runs, standby, filling, ventilation, cleaning and handling; reconcile shared totals before conversion. Preserve raw kWh and converted MJ, no division."
      unit: "kWh; MJ"
      frequency: "Per run and meter interval"
      temporal_coverage: "Complete actual period and traced cohort, including failed/zero-output runs and all periods carrying WIP or returns"
      site_scope: "Declared site and this PW6 acrylic route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, job logs and support allocation reconciliation"
    - protocol_id: cp_pack
      process_id: "colour_make"
      flow_role: "individual packaging rows"
      record_type: "Packaging count, mass and reject log"
      raw_fields: "article id; polymer; component; count; measured item kg; used/rejected/recovered count; attached paint; supplier; cohort; carried burdens"
      collection_method: "Packaging supervisor counts and weighs each supplied article and each waste separately. Retain full packing/repacking/failed-fill quantities, component evidence and coating residue subledgers, matched with WIP carry. Record raw numerators only; include actual ancillary packaging and avoid double-counting article constituents."
      unit: "kg; count"
      frequency: "Each fill/packing lot"
      temporal_coverage: "Complete actual period and traced cohort, including failed/zero-output runs and all periods carrying WIP or returns"
      site_scope: "Declared site and this PW6 acrylic route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighed component samples, supplier bill of materials and reject tickets"
    - protocol_id: cp_outlets
      process_id: "colour_make"
      flow_role: "waste and elementary outputs"
      record_type: "Weighbridge, sampling and receiver records"
      raw_fields: "species/stream id; wet kg; water/solid fractions; sample/time; air compartment; control inlet/capture/outlet; destination; receiver; stock and burden carry; uncertainty"
      collection_method: "Environmental owner collects raw actual wet waste and independently supported emitted-species numerators after controls, including failures and all retained WIP burdens. Distinguish fresh water, retained free water, internal recycle, washwater, capture and evaporation. Do not derive unknown reaction water and unknown emissions from one residual or translate COD into species. This physical blending route has no claimed net reaction-water source. No division in collection."
      unit: "kg"
      frequency: "Each outlet movement and sampling interval"
      temporal_coverage: "Complete actual period and traced cohort, including failed/zero-output runs and all periods carrying WIP or returns"
      site_scope: "Declared site and this PW6 acrylic route only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste tickets, receiver acceptance, species methods and independent uncertainty/balance evidence"
  calculation_rules:
    - id: calc_conversion
      applies_to: "all inventory rows"
      rule: "Perform only required raw conversions: kg=integrated m3 × independently measured kg/m3; integrated volume=rate × actual duration only for a rate; MJ=kWh × 3.6. Composition fractions of purchased gel/additives do not create extra procurement."
      inputs:
        - raw_volume
        - density
        - temperature
        - rate
        - duration
        - raw_kWh
      output: "converted raw numerators"
      source_ids: []
    - id: calc_cohort
      applies_to: "all inventory rows"
      rule: "Build each raw attributable numerator A_i from complete actual-period activity plus opening WIP carried burdens minus closing WIP carried burdens, using traced cohort ids. Preserve zero-output losses and incremental rework. Cancel only documented internal stock/return transfers and original burden duplicates; never delete a real burden. Reopened returned cohorts retain original unique release Q and receive disclosed incremental-burden restatement. Unresolved carry or cross-cohort attribution blocks a complete dataset."
      inputs:
        - period_totals
        - opening_WIP_burdens
        - closing_WIP_burdens
        - cohort_ids
        - return_ids
      output: "A_i"
      source_ids: []
    - id: calc_report
      applies_to: "all inventory rows"
      rule: "Report q_i = A_i / Q once for the complete matched positive first-release cohort, after raw conversions and burden carry reconciliation. Q is raw newly accepted net wet paint kg; o_new is 1 kg. Cards and protocol aggregation describe this same reporting operation, not successive divisions. i_return and o_reaccepted retain measured paired loop mass per this same Q and cancel on consolidation; they do not increase Q or represent a second saleable product."
      inputs:
        - A_i
        - Q
        - cp_release
        - cp_period
      output: "per 1 kg reference flow"
      source_ids: []
    - id: calc_balance
      applies_to: "all inventory rows"
      rule: "Reconcile physical wet mass independently before burden normalization: opening WIP + external formulation/cleaning material issues (excluding packaging) + returned paint = closing WIP + newly released Q + reaccepted returned mass + separately measured wastes + separately supported air releases. Packaging has its own supplied/retained/rejected stock balance; energy is not mass. Reconcile water and Ti across actual product/waste/stock species using supplier assay and measured outlet evidence. Physical carrier evaporation is not reaction water. Neither an unknown outlet nor a hypothetical species may be solved by fitting the same unexplained residual."
      inputs:
        - raw_mass_ledger
        - water_subledger
        - Ti_assay
        - measured_outlets
        - WIP
        - return_ledger
      output: "mass and element reconciliation with uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Keep full supplied product/chemical/phase/grade, native route/geography/medium restrictions and actual supplier compatibility. Broad native identities give no recipe or quantities; unresolved auxiliary UUID is a linkage gap, not zero use. Reference must retain the selected PW6 aqueous acrylic artist scope."
      evidence: "Supplier specification and identity audit"
    - id: dq_raw
      applies_to: "all protocols"
      requirement: "Retain full actual-period raw records, owner signoff, all failures and stock/burden carry, single calc_report operation and uncertainty. No invented foreground measurements or industry averages."
      evidence: "Raw and derived ledgers with reproducible reconciliation"
    - id: dq_formula
      applies_to: "formulated supplies"
      requirement: "Confirm each actual commercial grade. Supplier ingredient/active/water composition is a non-additive subledger; SDS ranges do not define recipe or pigment loading. If this named-gel route cannot be demonstrated, do not silently substitute another binder/route."
      evidence: "Supplier bills, CoA, recipe issue records"
    - id: dq_sources
      applies_to: "method evidence"
      requirement: "The four Golden pages are one manufacturer evidence family. The historical DIY article and water-reclamation case are qualitative only. EPA independently distinguishes physical paint manufacture from cooked varnish; its solvent/particulate/control factors are not adopted. Product viscosity and lightfastness labels are not lifetime or colour-equivalence factors."
      evidence: "golden-product; golden-diy; golden-water; epa-paint"
validation_rules:
  - rule_id: vr_reference
    applies_to: "o_new"
    rule: "Require one explicit o_new link, the declared reference UUID, 1 kg net mass and matching bilingual scope. i_return/o_reaccepted are real paired Product exchanges sharing the UUID and cannot be hidden or counted as a second new reference."
    source_ids: []
  - rule_id: vr_denominator
    applies_to: "all inventory rows"
    rule: "Require Q>0 unique first release, raw A_i and full WIP/return carry with only one calc_report division. Reject Q inferred from dispatch or Q plus same-cohort closing finished stock. An actual delivery study needs its own stock/burden reconciliation."
    source_ids: []
  - rule_id: vr_completeness
    applies_to: "colour_make"
    rule: "Every actual ingredient, utility, packaging component, rework burden, waste stream and emitted species must be individually present or supported absent. Auxiliary unresolved UUIDs and supplier gaps remain disclosed; no data package can claim complete linked inventory while applicable gaps remain."
    source_ids: []
  - rule_id: vr_balance
    applies_to: "calc_balance"
    rule: "Require physical mass, water and Ti reconciliation supported independently from actual species evidence, allowing stated measurement uncertainty without assigning unknown chemistry to a residual. Keep waste receiver transfers distinct from elementary emissions."
    source_ids: []
  - rule_id: vr_claims
    applies_to: "dataset profile"
    rule: "Do not infer service life, coverage, pigment/binder recipe, dry-film function, zero VOC, product safety or scientific approval from identity or finite structural checks."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground physical manufacture of the declared PW6 aqueous acrylic artist colour"
  downstream_use: "Background-linked manufacturing inventory at first quality release"
  allowed_use: "Declared product/route/phase cohort only; separate expansion for warehouse/dispatch"
  excluded_use: "Full CPC35120 coverage, industrial paint or ink proxy, service/colour/lifetime comparison, undisclosed proprietary recipe"
  required_metadata: "All reference qualifiers, raw period and cohort ids, Q gate, stock/return and burden ledgers, supplier native compatibility, all additional atomic rows"
  required_quality_disclosure: "Measurement uncertainty, all unresolved links, native metadata debts, historical source limits, allocations, exclusions and missing evidence"
  update_trigger: "Changed pigment/binder/formulation, supply article, process, packaging, release/delivery gate, site/period or new contrary identity evidence"
data_sources:
  - id: "golden-product"
    type: "handbook"
    reference: "https://goldenartistcolors.com/products/heavy-body-acrylic-color-titanium-white"
    used_for: "Manufacturer item 1380: real PW6 rutile heavy-body artist white and HDPE-pail market example. Identity only; no supplied recipe, density, fill-mass conversion, performance equivalence or lifetime adopted."
  - id: "golden-making"
    type: "handbook"
    reference: "https://goldenartistcolors.com/discover-golden/how-we-make-our-paints"
    used_for: "Manufacturer qualitative mixing, milling, testing and before-shipping QC; no measured site inputs or universal recipe. Same publisher as other Golden pages."
  - id: "golden-diy"
    type: "handbook"
    reference: "https://justpaint.org/just-make-paint/"
    used_for: "Golden Artist Colors, Just Make Paint, 1 October 2000: purchased acrylic gel, dry-pigment dispersion and separate formulated dispersant/defoamer route, water and packaging functions. Historical DIY method only; no ratio, additive concentration, pH, industrial yield, current product availability or proprietary recipe adopted."
  - id: "golden-water"
    type: "handbook"
    reference: "https://goldenartistcolors.com/resources/golden-manufacturing-water-reclamation-process"
    used_for: "Ben Gavett manufacturer case: carrier water versus equipment cleaning, washwater and pigment/polymer residue. Qualitative completeness only; its water-use ratio, RO recovery, transport distance, on-site treatment and COD cannot be transferred as this site inventory or species emissions. Same manufacturer evidence family."
  - id: "epa-paint"
    type: "official_guidance"
    reference: "https://www.epa.gov/sites/default/files/2020-10/documents/c06s04.pdf"
    used_for: "US EPA AP-42 6.4, May 1983 reformatted January 1995, p.1: independent physical dispersion/mixing/packaging versus cooked-varnish process distinction. Solvent-paint archetype; no artist recipe, generic loss/emission/control factors or quantitative default adopted."
