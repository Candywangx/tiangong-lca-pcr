allocation_rules:
  - rule_id: al_avoid
    applies_to: "Shared operations and utilities"
    rule: "First avoid allocation through batch segregation, submetering, or process subdivision."
    source_ids:
      - iso-14044-2006
  - rule_id: al_internal_rework
    applies_to: "In-specification closed-loop rework"
    rule: "Keep internal rework inside the foreground system; do not create a co-product credit, and reconcile its mass without double counting fresh input."
    source_ids:
      - mass-balance-identity
  - rule_id: al_saleable_coproduct
    applies_to: "Multiple saleable outputs"
    rule: "Use a documented physical causal relationship where it represents resource use; use economic allocation only when no defensible physical relationship exists and disclose prices, period, and sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: al_waste_recovery
    applies_to: "Waste, recovered solvent, and recovered packaging"
    rule: "Model treatment burdens and any credits under the governing programme; disclose system expansion, substitution, or cut-off and never treat avoided waste as negative foreground input."
    source_ids:
      - iso-14044-2006
      - epd-international-pcr-2019-14-v2-0-1
  - rule_id: al_shared_site_energy
    applies_to: "Shared site electricity and heat"
    rule: "Allocate by metered equipment consumption or causal runtime and load; mass allocation is allowed only with justification and sensitivity for materially different routes."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_materials
      process_id: "formulation_dispersion"
      flow_role: "formulation ingredients"
      record_type: "batch issue and return record"
      raw_fields: "material ID, lot, gross issue, return, density, solids"
      collection_method: "ERP issue and calibrated scale; volume conversion only with measured density"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "sum net issues by material and product family"
      quality_evidence: "purchase ledger, batch sheet, scale calibration"
    - protocol_id: cp_formulation_energy
      process_id: "formulation_dispersion"
      flow_role: "electricity"
      record_type: "meter and equipment log"
      raw_fields: "meter start, meter end, runtime, load, product family"
      collection_method: "submeter; otherwise reconciled site meter with causal allocation"
      unit: "kWh"
      frequency: "batch or monthly"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "sum direct readings; allocate documented shared remainder"
      quality_evidence: "meter calibration, energy reconciliation"
    - protocol_id: cp_batch_outputs
      process_id: "formulation_dispersion"
      flow_role: "bulk output and residue"
      record_type: "batch yield record"
      raw_fields: "released mass, retained sample, rework, residue, stock change"
      collection_method: "calibrated scale and batch reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "mass-weighted aggregate by product family"
      quality_evidence: "release record, waste record, mass balance"
    - protocol_id: cp_process_emissions
      process_id: "formulation_dispersion"
      flow_role: "VOC and particulate release"
      record_type: "monitoring and material balance"
      raw_fields: "solvent charged, solvent retained, recovery, waste, capture, control, measured concentration, gas flow"
      collection_method: "compliant monitoring or documented mass balance"
      unit: "kg"
      frequency: "campaign and reporting period"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant and emission point"
      aggregation_rule: "sum pollutant mass after control; keep routes separate"
      quality_evidence: "monitoring report, control log, balance reconciliation"
    - protocol_id: cp_thermal_batch
      process_id: "thermal_cooking"
      flow_role: "precursors and cooked intermediate"
      record_type: "batch record"
      raw_fields: "precursor issue, return, intermediate output, residue"
      collection_method: "calibrated scale and batch reconciliation"
      unit: "kg"
      frequency: "each thermal batch"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "sum net input and output by route"
      quality_evidence: "batch sheet, scale calibration, mass balance"
    - protocol_id: cp_thermal_energy
      process_id: "thermal_cooking"
      flow_role: "fuel and heat"
      record_type: "meter and fuel record"
      raw_fields: "fuel mass or volume, net calorific value, heat meter, runtime"
      collection_method: "calibrated meter and supplier fuel specification"
      unit: "MJ"
      frequency: "each batch or monthly"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "convert with recorded net calorific value and sum by route"
      quality_evidence: "meter calibration, fuel certificate"
    - protocol_id: cp_thermal_emissions
      process_id: "thermal_cooking"
      flow_role: "route VOC"
      record_type: "monitoring and batch balance"
      raw_fields: "volatile input, retained mass, condensate, recovery, control, measured release"
      collection_method: "compliant monitoring or documented mass balance"
      unit: "kg"
      frequency: "campaign and reporting period"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant and emission point"
      aggregation_rule: "sum release after control by route"
      quality_evidence: "monitoring report, batch balance"
    - protocol_id: cp_packaging_records
      process_id: "filling_packaging"
      flow_role: "bulk input, product output, and packaging"
      record_type: "filling and bill-of-material record"
      raw_fields: "bulk transfer, filled net mass, unit count, packaging issue, return, scrap"
      collection_method: "calibrated filler or scale plus inventory reconciliation"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "normalize saleable net output to 1 kg and sum packaging by material"
      quality_evidence: "fill check, bill of materials, scale calibration"
    - protocol_id: cp_cleaning_inputs
      process_id: "cleaning_waste_management"
      flow_role: "water and solvent input"
      record_type: "cleaning-event record"
      raw_fields: "equipment, water, fresh solvent, recovered solvent, return"
      collection_method: "meter, weighed issue, and solvent log"
      unit: "kg"
      frequency: "each cleaning event"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "assign directly to product campaign or documented shared cleaning driver"
      quality_evidence: "cleaning log, meter calibration"
    - protocol_id: cp_cleaning_outputs
      process_id: "cleaning_waste_management"
      flow_role: "wastewater, residue, and VOC"
      record_type: "discharge, shipment, and balance record"
      raw_fields: "wastewater, solids, residue, recovery, solvent issued, solvent returned, VOC control"
      collection_method: "discharge meter, weighed shipment, and solvent balance"
      unit: "kg"
      frequency: "each event and reporting period"
      temporal_coverage: "representative reporting year"
      site_scope: "reporting plant"
      aggregation_rule: "sum by destination and product family; reconcile recovery"
      quality_evidence: "manifests, discharge report, solvent balance"
  calculation_rules:
    - id: calc_normalize
      applies_to: "All foreground exchanges"
      rule: "normalized amount = reporting-period amount / net saleable coating mass"
      inputs:
        - "exchange amount"
        - "net saleable coating mass"
      output: "amount per kg net product"
      source_ids:
        - mass-balance-identity
    - id: calc_material_balance
      applies_to: "Each production route"
      rule: "closure gap = total mass inputs - saleable output - transferred intermediates - recorded wastes - recorded releases - justified stock change"
      inputs:
        - "wet-mass inputs"
        - outputs
        - wastes
        - releases
        - "stock change"
      output: "absolute and percentage closure gap"
      source_ids:
        - mass-balance-identity
    - id: calc_voc_balance
      applies_to: "VOC release"
      rule: "VOC release = volatile input - VOC retained in product - recovered solvent - solvent in shipped waste - destroyed or captured mass - justified stock change"
      inputs:
        - "solvent and volatile-component balance"
      output: "kg VOC after control"
      source_ids:
        - us-epa-ap42-6-4-1995
        - mass-balance-identity
    - id: calc_pm_release
      applies_to: "Particulate release"
      rule: "released particulate = dry material handled × measured or justified loss fraction × one minus capture efficiency × one minus control efficiency"
      inputs:
        - "dry pigment and filler handled"
        - loss
        - capture
        - control
      output: "kg particulate release"
      source_ids:
        - us-epa-ap42-6-4-1995
    - id: calc_shared_energy
      applies_to: "Shared energy"
      rule: "allocate reconciled shared energy by metered runtime and load or another documented causal driver; test material alternatives"
      inputs:
        - "meter total"
        - "direct readings"
        - "driver quantities"
      output: "process and product energy"
      source_ids:
        - iso-14044-2006
    - id: calc_service_conversion
      applies_to: "Comparative service"
      rule: "required product mass = declared area × application-specific mass per area × applied fraction × maintenance multiplier for the declared study period"
      inputs:
        - area
        - "coverage or spreading rate"
        - "density where needed"
        - "applied fraction"
        - "maintenance cycle"
        - "study period"
      output: "kg product for equivalent declared service"
      source_ids:
        - jrc-145239-2026
  data_quality_requirements:
    - id: dq_technology
      applies_to: "Foreground route"
      requirement: "Data shall represent the declared water-borne, solvent-borne, powder, one-component, multi-component, or thermal route and its actual control technology."
      evidence: "process description, formulation family, equipment and control records"
    - id: dq_time
      applies_to: "Foreground data"
      requirement: "Use a representative continuous twelve-month period where available; explain shutdowns, campaigns, abnormal batches, and extrapolation."
      evidence: "dated batch, meter, purchase, waste, and production records"
    - id: dq_geography
      applies_to: "All datasets"
      requirement: "Identify plant country or region and use representative electricity, fuel, transport, water, and waste-treatment datasets."
      evidence: "dataset metadata and supplier or utility records"
    - id: dq_completeness
      applies_to: "Material and emission inventory"
      requirement: "Reconcile mass and energy, list omissions and cut-offs, and retain hazardous or environmentally significant constituents and releases."
      evidence: "balance checks, omission register, monitoring reports"
    - id: dq_source_priority
      applies_to: "Secondary data"
      requirement: "Prefer official standards, PCRs, regulations, official datasets and institutional reports, then peer-reviewed literature, then industry documents; label reasoned estimates as provisional."
      evidence: "source register and estimate flags"
    - id: dq_uncertainty
      applies_to: "Estimates and allocation"
      requirement: "Quantify or qualitatively assess uncertainty for provisional estimates, secondary substitutions, allocation, and service conversion."
      evidence: "sensitivity results and data-quality notes"
validation_rules:
  - rule_id: val_reference_identity
    applies_to: "Reference flow"
    rule: "Confirm Paint UUID b2aa1a35-1823-4b13-96db-d5b89eda2db5, Mass UUID 93a60a56-a3c8-11da-a746-0800200b9a66, unit-group UUID 93a60a57-a4c8-11da-a746-0800200c9a66, kg unit, and exactly 1 kg net product excluding packaging."
    source_ids:
      - mass-balance-identity
  - rule_id: val_qualifiers
    applies_to: "Dataset metadata"
    rule: "Reject an incomplete reference definition when any required qualifier is absent or ambiguous."
    source_ids:
      - eu-commission-2025-2607
      - jrc-145239-2026
  - rule_id: val_route_coverage
    applies_to: "Process map"
    rule: "Require formulation_dispersion, filling_packaging, and cleaning_waste_management; require thermal_cooking only when on-site cooking or reaction occurs and otherwise record it as not applicable."
    source_ids:
      - us-epa-ap42-6-4-1995
  - rule_id: val_mass_closure
    applies_to: "Foreground processes"
    rule: "Calculate route and site mass-balance closure, report the gap and threshold, and investigate rather than clip unexplained losses."
    source_ids:
      - mass-balance-identity
  - rule_id: val_records
    applies_to: "Collected values"
    rule: "Confirm temporal coverage, site scope, units, calibration, aggregation, and traceability to the named collection protocol."
    source_ids:
      - epd-international-pcr-2019-14-v2-0-1
  - rule_id: val_emissions
    applies_to: "Direct VOC and particulate"
    rule: "Confirm route-specific monitoring or balances, capture and control treatment, and absence of double counting; use AP-42 ranges only as historical QA checks."
    source_ids:
      - us-epa-ap42-6-4-1995
  - rule_id: val_allocation
    applies_to: "Shared operations and outputs"
    rule: "Confirm subdivision was considered first, the causal basis is documented, and economic allocation is justified and sensitivity-tested if used."
    source_ids:
      - iso-14044-2006
  - rule_id: val_background
    applies_to: "Cradle-to-gate profile"
    rule: "Confirm upstream datasets and transport are present for material inputs and disclose geography, technology, age, and substitutions."
    source_ids:
      - epd-international-pcr-2019-14-v2-0-1
  - rule_id: val_service_claim
    applies_to: "Comparative claims"
    rule: "Reject service-equivalence claims based only on 1 kg product; require declared area, performance, applied fraction, coverage or spreading rate, maintenance, and study period."
    source_ids:
      - jrc-145239-2026
  - rule_id: val_provisional
    applies_to: "Reasoned estimates"
    rule: "Flag all reasoned_estimate ranges as provisional and prevent their use as plant defaults; replace them before publication unless explicitly reviewed and justified."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for a declared paint or varnish product family and plant route"
  downstream_use: "Cradle-to-gate LCA, EPD modules A1 to A3 where the governing programme permits, product footprinting, and input to expanded application or building studies"
  allowed_use: "Products and routes within the declared scope when reference qualifiers, process coverage, source quality, and validation checks are satisfied"
  excluded_use: "Direct comparison of unlike coating services; coating-application inventory without added use-stage data; printing inks, artists' colours, adhesives, paint removers, or cured coated articles"
  required_metadata: "PCR id and version; product and formulation family; route; CPC reference; product and flow UUID; plant geography; period; solids, density, VOC and coverage properties; packaging; process map; allocation; cut-offs; data sources"
  required_quality_disclosure: "Primary-data share; secondary dataset substitutions; mass and energy closure; direct-emission method; allocation; uncertainty; provisional estimates; excluded and outsourced operations"
  update_trigger: "Material formulation or route change; new plant or control technology; packaging change; revised classification or applicable PCR; data older than the governing programme permits; material correction to UUID, source, or calculation"
