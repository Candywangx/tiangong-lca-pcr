measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the strictly positive unique net actually delivered monofilament mass for one matched product/route/state cohort, weighed with calibrated tare subtraction and stated supply-moisture conditioning. Core, pallet, packaging and machinery mass are excluded. Q is not automatically the newly quality-released production P."
  - id: linear_conversion
    applies_to: "length or bobbin records"
    required_property_ref:
      name: "Mass and length separately"
      uuid: ""
    required_unit: "kg; m; dtex; tex"
    rule: "Measure net monofilament mass M and measured length L of the same homogeneous conditioned lot using cp_release/cp_delivery; raw length l converts to l*M/L kg, and bobbin counts require measured net masses for that exact bobbin cohort. dtex is g per 10000 m and tex is g per 1000 m, not volume density. Area applies only with an independently measured same-product kg per area; this monofilament is not a film sheet. No nominal-diameter density shortcut."
  - id: energy_unit
    applies_to: "make_electricity; dispatch_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain the native energy reference and unit group Units of energy 93a60a57-a3c8-11da-a746-0800200c9a66. Raw metered kWh is converted to MJ by factor 3.6 before the sole normalization. Metered integrated energy is not multiplied by time again."
  - id: water_volume
    applies_to: "quench_makeup; process_effluent; water_vapour"
    required_property_ref:
      name: "Mass and volume separately"
      uuid: ""
    required_unit: "kg; m3"
    rule: "An integrated liquid/gas volume is already an amount, not a rate; no extra duration factor. Convert volume only using actual temperature/pressure/state and independently evidenced liquid density or gas humidity/composition. The tap-water secondary 0.001 m3/kg coefficient is not a measured plant density. Track wet/dry and standard/actual gas conditions explicitly."
