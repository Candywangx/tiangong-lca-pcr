    used_for: "Attributional direct assignment, virtual subdivision and flow-specific determining physical causality for shared production, storage and packing burdens. No PA6 grade, operating recipe, factory quantity, loss/yield/intensity factor, universal mass allocation, substitution credit or claim that the handbook literally prescribes this PCR stock-ledger implementation. Other frameworks require goal-consistent independent review."
