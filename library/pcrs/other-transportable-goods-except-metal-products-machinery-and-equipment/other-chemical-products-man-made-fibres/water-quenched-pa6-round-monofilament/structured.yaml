system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Include actual receiving/drying, electric melt filtration/extrusion, quenching-water system, hot-water plus hot-air drawing, annealing, take-up and quality release, including changeover, failed/zero-output runs, start-up, idle auxiliaries, rejects and rework. The two independent manufacturers support this selected line; do not append slitting or polymerisation."
      source_ids:
        - basf-monofilaments
        - basf-extrusion-guide
        - sanchyi-monofilament-line
    - rule_id: boundary_delivery
      applies_to: "dispatch"
      rule: "Include the actual storage duration, humidity control, rewinding/reinspection, packaging, internal movement and loading needed by the delivered cohort. Do not delete these burdens when production precedes delivery. Production release P is an internal transfer, not the terminal denominator Q. Warehouse and production balances are separate, with paired transfers cancelled only on consolidation."
      source_ids: []
    - rule_id: boundary_formulations
      applies_to: "purchased inputs"
      rule: "Weigh each complete purchased PA6 formulation or supplied solution once; assay polymer, embedded additives and moisture only as constituent subledgers. Do not procure the embedded additive or carrier water again. Additional onsite mixing, spin finish, dyeing, coating, non-electric heat or cleaning chemistry requires a reviewed expansion with every actual atomic input and outlet; do not silently omit it."
      source_ids:
        - basf-extrusion-guide
    - rule_id: boundary_water_species
      applies_to: "manufacture"
      rule: "Separate purchased make-up from internal recirculation, liquid effluent, droplet carry-out, retained product moisture and net air-borne water transfer. Melting, crystallisation, cooling, drawing and moisture drying are physical changes and do not themselves form reaction water. Any hydrolysis, degradation or reaction-water claim needs independent reaction/species evidence; do not solve an unknown water term and unknown outlet from one residual."
      source_ids:
        - basf-extrusion-guide
