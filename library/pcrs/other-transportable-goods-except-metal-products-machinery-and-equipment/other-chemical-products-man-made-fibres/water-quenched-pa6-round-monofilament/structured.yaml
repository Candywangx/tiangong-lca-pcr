allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all inventory rows"
    rule: "Avoid allocation using line/lot meters and origin-specific stock/burden tracking first. Shared energy requires demonstrated actual load/run-time relationship, storage uses actual cohort dwell/load, and packaging uses actual component consumption. Do not allocate different diameters or grades simply by metres. Disclose remaining allocation, uncertainty and sensitivity; mass allocation is not an automatic default."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_rework
    applies_to: "rework and scrap"
    rule: "Do not credit internal regrind or returned product as avoided virgin material or new output. Retain all repeat extrusion/drawing/inspection/storage burdens. Actual exported scrap treatment remains included; a genuine saleable co-product requires a separately declared identity, allocation method and review before use. No negative burden or cut-off is inferred from a waste label."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "monofilament_make"
      flow_role: "resin and equipment oil"
      record_type: "weighing and purchase stock ledger"
      raw_fields: "owner material custodian; batch/grade; complete supply formulation; opening/receipts/closing; net kg; polymer/additive/water assays; regrind lots; oil issues and returns"
      collection_method: "Owner material custodian retains undivided raw period consumption, procurement and assay subledgers. Reconcile actual issue/return/stock weights; allocate no amount by Q here. Include all failed/zero-output runs and rework; prevent duplicate embedded-constituent procurement. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kg"
      frequency: "each receipt issue and stock close"
      temporal_coverage: "actual production history for matched delivered cohort, including prior-period carry"
      site_scope: "monofilament plant and selected line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scales; invoices; COA/SDS; reconciled ledgers"
    - protocol_id: cp_energy_make
      process_id: "monofilament_make"
      flow_role: "manufacturing electricity"
      record_type: "submeter and operating log"
      raw_fields: "owner line energy engineer; meter start/end; kWh; interval; voltage; country; running/idle/failed runs; dryer; pumps; air compressor; draw/anneal/winder loads; shared-use evidence"
      collection_method: "Energy engineer records raw integrated kWh for all attributable operating and auxiliary loads; main-meter reconcile and direct assignment first. If measured rate is used, integrate rate over actual duration once; integrated readings receive no extra time factor and no division here. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kWh; MJ"
      frequency: "each shift and campaign"
      temporal_coverage: "full matched production history including zero-output periods"
      site_scope: "manufacture and its electric utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; load log; voltage/provider; allocation evidence"
    - protocol_id: cp_water
      process_id: "monofilament_make"
      flow_role: "external water and liquid effluent"
      record_type: "water-system balance and assays"
      raw_fields: "owner utility engineer; make-up meter; integrated volume; temperature density; loop opening/closing; circulation; purge overflow droplets; product retained moisture; wastewater mass; constituent assays"
      collection_method: "Utility engineer retains raw external make-up and each physical outlet; read actual water-system records. Internal loop turnovers are not fresh water. Independently measure state/density, wastewater and water in polymer/product/air; retain every stock change without normalization. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kg; m3"
      frequency: "meter interval and bath change"
      temporal_coverage: "same production history and stock cut-offs"
      site_scope: "quench drawing and actual cleaning outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water meters; density/state evidence; effluent assays; routing records"
    - protocol_id: cp_release
      process_id: "monofilament_make"
      flow_role: "newly quality-released monofilament P and WIP"
      record_type: "lot production and quality ledger"
      raw_fields: "owner production quality lead; unique lots; net mass; core tare; measured length; dtex; diameter; grade/form; moisture conditioning; first acceptance; failures/rework; opening/closing WIP mass and burden vectors"
      collection_method: "Quality lead weighs net conditioned product with calibrated scales and performs lot-specific geometric/linear-mass tests. Record raw P once at first positive production release; no new P from reinspection. Preserve incomplete/failed lots and WIP carried burdens. Do not divide by P or Q here. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kg; m; dtex; mm"
      frequency: "each lot and WIP cut-off"
      temporal_coverage: "all actual production periods serving delivery cohort"
      site_scope: "selected production line to warehouse handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "first acceptance IDs; calibration; QC; WIP stage/burden reconciliation"
    - protocol_id: cp_waste_make
      process_id: "monofilament_make"
      flow_role: "PA6 scrap and spent oil"
      record_type: "segregated weighing and handover"
      raw_fields: "owner waste custodian; row substance; contamination moisture; kg; generation lot; internal rework; opening/closing waste; treatment destination"
      collection_method: "Waste custodian retains undivided separately weighed physical streams, reconciling internal returns and external handover. Include failed runs and rejects; no automatic avoided-product credit. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kg"
      frequency: "each generation and shipment"
      temporal_coverage: "matched actual production history"
      site_scope: "manufacturing waste gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; segregation; transfer notes; treatment contracts"
    - protocol_id: cp_species
      process_id: "monofilament_make"
      flow_role: "net air water and caprolactam"
      record_type: "substance-specific sampling and air balance"
      raw_fields: "owner environmental engineer; substance/CAS when known; compartment; inlet/outlet humidity; dry-air mass; integrated gas volume or rate/time; temperature pressure; concentration; capture; droplets; detection limits; uncertainty"
      collection_method: "Environmental engineer retains raw inlet/outlet air and compound records, integrates rates once or uses already integrated volumes, and subtracts background only on matched state/dry-air bases. Determine actual species independently from total physical/element balances. No residual or COD fitting, no assumed reaction water, and no normalization here. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kg; m3"
      frequency: "representative campaigns and actual emission episodes"
      temporal_coverage: "complete matched run coverage including failures"
      site_scope: "actual vents and room-air export with stated subcompartment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory method; blanks; humidity/state instruments; detection/coverage limits"
    - protocol_id: cp_stock
      process_id: "dispatch"
      flow_role: "internal receipt, FG stock and PA6 rejects"
      record_type: "warehouse mass and burden ledger"
      raw_fields: "owner warehouse custodian; paired release/receipt IDs; P; opening/closing FG kg; burden vectors by origin lot; returns/rework; damage/reject kg; storage duration; dispatch gate"
      collection_method: "Warehouse custodian records undivided FG and WIP-interface movements, segregated by product/route/state and origin lot, preserving prior-period burdens and current storage increments. Reconcile production and warehouse separately. No division and no counting closing FG as a second production output. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kg"
      frequency: "each movement and stock close"
      temporal_coverage: "all periods and storage days for delivered cohort"
      site_scope: "actual warehouse, return and rework gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired lots; stock count; stage burden ledger; return/reject records"
    - protocol_id: cp_energy_dispatch
      process_id: "dispatch"
      flow_role: "warehouse packing handling electricity"
      record_type: "electric submeter and storage-time ledger"
      raw_fields: "owner warehouse energy lead; raw kWh; humidity control; storage days; rewinding; packing; loading; charging losses; idle time; shared load assignment; voltage/geography"
      collection_method: "Warehouse energy lead retains raw period numerators, including failed packing, returned/reworked consignments and closing-stock storage increments, with load/time attribution. Carry undelivered-stock burdens forward; do not allocate all warehouse energy to current dispatch by assumption. No division here. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kWh; MJ"
      frequency: "each metering period and lot dwell"
      temporal_coverage: "matched storage/delivery history including opening FG"
      site_scope: "actual warehouse packing and loading"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter log; charging record; storage-time allocation evidence"
    - protocol_id: cp_pack
      process_id: "dispatch"
      flow_role: "core carton wrap and segregated waste"
      record_type: "component weighing and stock records"
      raw_fields: "owner packing lead; complete component/provider; kg consumed; opening receipts closing; reusable-core rotations/losses; scrap; delivered pack tare; core mass; unreleased pack lots"
      collection_method: "Packing lead weighs each complete component and waste separately, retains raw stock/consumption and actual reuse/loss records. Allocate reusable cores by supported actual service cycles, without putting core mass in product kg. No generic whole-pack mixture and no normalization here. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kg"
      frequency: "each packed lot and stock close"
      temporal_coverage: "matched delivered cohort and its retained stock"
      site_scope: "actual winding-core and dispatch packaging gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component scales; supplier specifications; reuse ledger; tare; waste notes"
    - protocol_id: cp_delivery
      process_id: "dispatch"
      flow_role: "terminal actual net delivered Q"
      record_type: "unique consignment and return reconciliation"
      raw_fields: "owner dispatch quality lead; lot/consignment unique IDs; actual forward dispatch kg D; return kg R; return credit corrections; redispatch links; calibrated gross/tare/net; moisture conditioning; actual accepted net Q; unreleased/undelivered exclusions"
      collection_method: "Dispatch quality lead retains undivided raw D and each R with the physical lot and prior delivery credit. Match dispatch acceptance and net weighing; cancel returned credits and link redispatch so each accepted physical kg contributes once. Adjust the original cohort and restore returned burdens where returns cross periods. Keep stock/carry records; do not divide any raw numerator here. The aggregation label is the result basis of the sole section-8 reporting operation, not an additional division during collection."
      unit: "kg"
      frequency: "each consignment return and settlement"
      temporal_coverage: "explicit delivery cohort with settled returns or disclosed provisional correction"
      site_scope: "factory net-dispatch gate, not customer-use gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "dispatch/return acceptance; calibrated tare; cohort deduplication; moisture records"
  calculation_rules:
    - id: convert_units
      applies_to: "make_electricity; dispatch_electricity; quench_makeup; process_effluent; water_vapour; caprolactam_air"
      rule: "Convert raw meter/assay records to each row unit before attribution: kWh*3.6 = MJ; raw length l*M/L = kg only with same conditioned lot measurements. Use independently measured state/density/humidity for liquid or gas conversion. Integrated volumes get no extra duration. This rule performs no division by Q."
      inputs:
        - cp_energy_make
        - cp_energy_dispatch
        - cp_water
        - cp_species
        - cp_release
        - cp_delivery
      output: "raw amount A_i in row unit"
      source_ids: []
    - id: cohort_attribution
      applies_to: "all inventory rows"
      rule: "For each burden component i, A_i = B_open,i + B_period,i + B_return_correction,i - B_close,i - B_other_cohort,i. B_open retains opening WIP/FG burdens, B_period contains the complete actual matched raw period inputs and attributable shared/storage/rework burdens, B_close is independently identified ending WIP/undelivered FG carry, and B_other_cohort is a documented transfer to another product/route/state cohort, not an arbitrary residual. Preserve all raw records; carry independently identified ending WIP and undelivered FG vectors forward. Associate failure/zero-output burdens and unrecoverable reject treatment with the actual causal cohort. Reconcile other-cohort transfers explicitly. Returned-stock burdens are restored from the original credited cohort without repurchasing or creating output. This produces undivided A_i attributable to Q, not a pre-normalized coefficient."
      inputs:
        - cp_release
        - cp_stock
        - cp_material
        - cp_energy_make
        - cp_energy_dispatch
        - cp_delivery
        - cp_waste_make
        - cp_pack
        - cp_water
        - cp_species
      output: "undivided cohort amount A_i and retained ending burden vectors"
      source_ids: []
    - id: delivery_quantity
      applies_to: "delivered_monofilament"
      rule: "Q is the sum of actual net kg credited to unique accepted physical consignments in the declared delivery cohort after linked return/re-delivery corrections. Reconcile raw forward D and return R movements with stock and original delivery credits; repeated dispatch or reacceptance cannot add another copy of the same kg. Cross-period returns correct the original credited cohort and restore its carried burdens. Q excludes all undelivered FG and WIP; a nonpositive or unsettled unquantifiable Q cannot support a completed dataset."
      inputs:
        - cp_delivery
        - cp_stock
        - cp_release
      output: "Q"
      source_ids: []
    - id: normalize_delivery
      applies_to: "all inventory rows"
      rule: "The sole reporting normalization is x_i = A_i / Q, with Q the unique strictly positive return-adjusted actual net delivered kg of the same product/route/state cohort. A_i is the undivided amount from convert_units and cohort_attribution; do not divide it elsewhere first. The reference output is 1 kg. Card formulas and protocol aggregation text refer to this same operation, never sequential divisions. P, reel count, machine mass and all produced-plus-closing-stock totals are not alternative denominators."
      inputs:
        - A_i
        - Q
        - cp_delivery
        - cp_stock
      output: "row quantity per 1 kg reference flow"
      source_ids: []
    - id: reconcile_ledgers
      applies_to: "monofilament_make; dispatch"
      rule: "Production ledger: opening raw material and WIP plus external material receipts equals new release P plus closing raw/WIP plus exported waste and independently measured net material releases, with internal regrind cancelled. Do not append closing finished-goods stock as another production output of P. Warehouse ledger: opening FG plus P plus physical returns equals raw forward dispatch D plus closing FG plus actual rejects/rework exports, with paired rework transfers explicit. Consolidate by cancelling P/receipt, then derive return-adjusted unique Q with prior-cohort credit corrections. Keep packaging, water and oil subledgers; mass uncertainty is not a chemical species."
      inputs:
        - cp_material
        - cp_release
        - cp_stock
        - cp_delivery
        - cp_water
        - cp_species
        - cp_pack
        - cp_waste_make
      output: "physical balances, cohort corrections and unexplained residuals"
      source_ids: []
  data_quality_requirements:
    - id: quality_scope
      applies_to: "all rows"
      requirement: "Demonstrate the declared PA6 direct pellet route, one round solid filament and actual supply state. Mother-yarn splitting, multifilament/tow, copolyamide, slitting, coatings or chemical treatment require separate applicability review."
      evidence: "basf-monofilaments; sanchyi-monofilament-line; yusheng-pa6-monofilament"
    - id: quality_completeness
      applies_to: "all protocols"
      requirement: "Retain full actual history with failures, zero-output periods, rework, returns, opening/closing WIP/FG and burden carry. Future measurement/provider gaps are disclosed; never replace them with zero or an invented factor. Detection limits and unmeasured scope remain explicit."
      evidence: "cp_material; cp_energy_make; cp_water; cp_release; cp_stock; cp_delivery"
    - id: quality_identity
      applies_to: "UUID-bearing cards"
      requirement: "Preserve complete native names, route, location, physical form, reference property and official Chinese basename. CN 1–35 kV electricity applies only to that interface. PA6 classification/Chinese-comment defects and the 100–150°C native descriptor remain explicit; actual grade/temperature capability requires supplier evidence. Generic identity is not a background provider or scientific approval."
      evidence: "cp_material; cp_release; cp_energy_make; cp_energy_dispatch"
    - id: quality_balances
      applies_to: "water polymer air and packaging"
      requirement: "Check total physical mass and relevant C/H/N/O ledgers independently of measured actual chemical species, air humidity and free/retained water. Quantify measurement uncertainty; never label closure residual as caprolactam, particulate, CO2 or reaction water."
      evidence: "cp_water; cp_species; cp_material; cp_release; cp_stock; cp_pack"
validation_rules:
  - rule_id: validation_reference
    applies_to: "delivered_monofilament"
    rule: "Require the explicit terminal Product row, reference UUID agreement, 1 kg net actual delivered basis, complete required qualifiers and unique physical consignment reconciliation. Internal released/received rows deliberately share the PA6 UUID and must remain visible, paired and cancelled."
    source_ids: []
  - rule_id: validation_measurement
    applies_to: "all inventory rows"
    rule: "All applicable final exchanges use the same 1 kg delivery basis, raw conversions before exactly one A_i/Q. Q must be positive finite; raw failed batches with no output remain in burdens. Check net product M/L conversions, native property/unit chains and conditioned supply moisture; no tex-density or integrated-volume/time error."
    source_ids: []
  - rule_id: validation_stock
    applies_to: "manufacture and dispatch"
    rule: "Reconcile independent production and warehouse ledgers and carried burden vectors. Undelivered ending FG is not in Q and retains burdens; opening FG is not burden-free. Returned reaccepted product cannot create new P or duplicate Q. Retain real packaging, storage, handling, dispatch and rework burdens through the chosen gate."
    source_ids: []
  - rule_id: validation_species
    applies_to: "water and chemical balances"
    rule: "Separately verify make-up, circulation, effluent, droplets, product moisture and net gas humidity; preserve actual substance/medium identities and independent emission evidence. Thermal phase changes do not prove chemical water formation; uncertainty cannot be solved by two residual-derived unknowns. Missing data is inconclusive, not a zero."
    source_ids: []
published_dataset_profile:
  dataset_role: "manufacturing_foreground_with_actual_factory_net_delivery"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "The declared water-quenched direct-spun PA6 monofilament route with validated actual cohort records and matched upstream providers"
  excluded_use: "Whole CPC35530 coverage, strip/film/strap, multifilament/tow, medical or lifetime equivalence, polymerisation inventories and automatic supplier/grade certification"
  required_metadata: "PCR id/version; product/grade/form/diameter/dtex; moisture conditioning; site; native limits; process configuration; production and delivery periods; P/D/R/Q; WIP/FG mass and burden carry; return links; packaging; actual providers; allocation and cut-offs"
  required_quality_disclosure: "Meter/weighing/species coverage and uncertainty; failed-run/rework/stock attribution; unresolved flow UUIDs/providers; source limitations; native classification and translation debt; unverified temperature descriptor; missing environmental scope; scientific review pending"
  update_trigger: "Change in grade, polymer, direct-spinning route, drawing/heat supply, finish, product moisture, geometry, delivery gate, returns/stock attribution, provider geography or new contrary evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, 30 June 2025, printed p174, 35510/35520/35530 and 36310; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Current classification titles and adjacent boundaries only. The 35530 note supplies no industrial recipe or inventory; no accepted mapping is established."
  - id: "wco-hs2022-ch54"
    type: "official_guidance"
    reference: "WCO, HS 2022, Chapter 54, note 1 and headings 5402/5404; https://www.wcotradetools.org/en/harmonized-system/2022/en/1154"
    used_for: "Physical discrimination: synthetic monofilament at least 67 dtex with no cross-sectional dimension above 1 mm, versus thinner filament yarn and plastic profiles; strip remains a different form. HS evidence supplements the sparse current CPC description, without claiming a new correspondence acceptance."
  - id: "basf-monofilaments"
    type: "handbook"
    reference: "BASF, Monofilaments, publisher web snapshot 16 October 2026; https://chemicals.basf.com/global/en/Monomers/polyamides-and-precursors/monofilaments"
    used_for: "PA6 grades and direct extrusion, quenching, drawing and relaxation. PA6/66 copolyamide grades and thick-profile cases excluded; no numerical operating settings or service rating adopted."
  - id: "basf-extrusion-guide"
    type: "handbook"
    reference: "BASF, Ultramid Properties and Extrusion Processing Guide, undated guide (PDF metadata October 2021), pp10-11 and14-15; https://chemicals.basf.com/dam/jcr%3A794caec6-5ccb-4345-8cc5-26f39840adca/basf/chemicals/north-america/nylon-polyamides/gated-pdfs/BASF_Ultramid_Properties_and_Extrusion_Processing_Guide.pdf"
    used_for: "Monofilament process decomposition, pre-dried moisture-protected resin supply and grade/additive distinctions. Table 5 is an example, not the chosen factory or an inventory factor. Thermal-decomposition discussion requires independent species evidence, not automatic emissions."
  - id: "sanchyi-monofilament-line"
    type: "handbook"
    reference: "SAN CHYI MACHINERY, Monofilament Extrusion Lines, SC-MFP / SC-MFN, publisher rendered-DOM snapshot 16 October 2026; https://www.sanchyi.com/catalog/index.php?index_m1_id=23"
    used_for: "Independent equipment maker supports melt filtration/extrusion, water quench, electrically heated water drawing, PA additional hot-air drawing, hot-air annealing and winding. Multiple polymers and winder designs are offered; only the declared PA6 line configuration is within scope. No throughput/nameplate-energy default."
