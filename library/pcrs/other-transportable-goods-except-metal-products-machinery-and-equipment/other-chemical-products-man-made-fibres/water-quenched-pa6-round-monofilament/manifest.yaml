review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  semantic_boundary_decision:
    decision: new_narrow_semantic_method
    rationale: Material catalog contains PET monofilament filter mesh and dry PP rope methods starting
      from filaments, as well as staple preparation/ring-spun and multifilament weaving/yarn methods;
      none governs virgin PA6 direct-pellet round-monofilament formation and actual net delivery. Retained
      synthetic-monofilament/strip legacy record is empty and remains untouched. Same-batch35510 targets
      PET staple;35520 investigates filament yarn including PP multifilament; this scope excludes both
      tow/staple and multifilament. Identity follows industrial product and water-quench/draw/anneal route,
      not a classification leaf.
  scientific_review:
    status: pending
    limitations:
    - Candidate methodology, scientific approval, accepted mapping and publication remain root-owned pending.
    - No factory measurements or inventory numerical defaults supplied. Actual grade, conditioned state,
      emissions, line configuration, providers, WIP and FG burdens and settled return corrections must
      be evidenced by the data producer.
    - Primary technical synthesis uses independent polymer and equipment manufacturers; not a single SKU/factory
      inventory. YUSHENG mother-yarn splitting and inconsistent0.30mm figures are excluded; BASF example
      recipes and copolyamides excluded.
  native_identity_debts:
  - Reference PA6 direct-spun Product/Mass record has no CAS or explicit geography, a100–150°C name descriptor
    requiring independent grade applicability, CPC35520 classification debt for the declared>=67dtex product,
    and a Chinese polycaprolactam mistranslation. These are preserved in all three corresponding inventory
    descriptions and quality/profile context, not hidden as trace-only notes.
  - PA6 granulate native GLO at-plant context is broad and comments on a moulded-parts input role; this
    is not a contrary resin route. It does not establish monofilament grade, composition or supplier burden.
  - Electricity UUID is CN1–35kV grid-average to user only. Tap-water geography unspecified; its secondary
    volume factor is not a measured density. Paper core has no fixed composition/recycled share.
  - The generic packaging category is not adopted as a specific carton identity; the separate corrugated-carton
    exchange remains unbound pending a compatible concrete flow. No whole-carton display exception is assumed.
    LDPE film has no stated route/geography/grade;
    air water and caprolactam identities use ordinary-water/monomer CAS and unspecified air, not isotope,
    indoor, long-term or other compartments.
  unresolved_flow_identities:
