allocation_rules:
  - rule_id: a_hierarchy
    applies_to: "albumin_supply"
    rule: "First separate attributable collection/testing, product-specific manufacturing, QC, packaging, cold storage and handling by physical records. For shared plasma and shared manufacturing, retain every actual co-product and the unallocated physical inventory. Use justified physical causality where demonstrated; otherwise use explicitly justified actual allocation-gate economic values, with same-period quantities/prices and sensitivity against another defensible basis. No universal albumin allocation share, zero-burden donated plasma or automatic clinical-value allocation is supplied."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_ledger
    applies_to: "albumin_supply"
    rule: "Allocate shared burdens only after raw physical closure; product-specific burdens stay with that product. Fractions leaving at different intermediate/final states use values at that exact shared gate, never final retail prices uncorrected for later processing. Allocation shares sum to one for the shared pool. Separate wastes, recirculation and co-products; no double avoided-product credit. Preserve both allocated and unallocated ledgers."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "albumin_supply"
      flow_role: "Terminal product and inventory gate"
      record_type: "foreground_record"
      raw_fields: "Quality and warehouse data owners: product/specification; anonymised batch/cohort; P new release; unique net dispatch receipts Q; returns; mass; density/volume if converted; opening/closing WIP and finished goods; carried burden vectors; destination; acceptance status"
      collection_method: "Owners retain raw unreduced receipts, weighing and inventory/carried-burden records. Reconcile production-to-store transfers P and store-to-dispatch movements separately, cancel internal transfers; establish Q from accepted unique net supplied wet mass, excluding undelivered stocks, duplicate acceptance and unresolved returns. No division here."
      unit: "kg"
      frequency: "Each batch/event and period close"
      temporal_coverage: "One matched closed raw reporting period plus traced opening/closing carry-over"
      site_scope: "Declared collection/supplier/manufacturing and storage sites; no donor personal data"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated measurements; invoices; environmental batch ledger; stock reconciliation; full provider boundary and uncertainty"
    - protocol_id: cp_material
      process_id: "albumin_supply"
      flow_role: "Actual material and consumable exchanges"
      record_type: "foreground_record"
      raw_fields: "Manufacturing/environmental data owner: each actual purchased formulation; supplied mass; assay; supplier; receipts; opening/closing raw stock; opening/closing WIP; carried burdens; rejected and zero-output batches; returns/rework; recovery; losses"
      collection_method: "Reconcile all raw-period actual consumptions and full supplied formulations with invoices, batch environmental records and stocks; constituent assays are subledgers. Include zero-output, rework and QC burdens, upstream collection and testing coverage. No enrichment or manufacturing procedure is recorded. Retain unnormalised numerators only."
      unit: "kg"
      frequency: "Each batch/event and period close"
      temporal_coverage: "One matched closed raw reporting period plus traced opening/closing carry-over"
      site_scope: "Declared collection/supplier/manufacturing and storage sites; no donor personal data"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated measurements; invoices; environmental batch ledger; stock reconciliation; full provider boundary and uncertainty"
    - protocol_id: cp_utilities
      process_id: "albumin_supply"
      flow_role: "Energy water and refrigeration"
      record_type: "foreground_record"
      raw_fields: "Utilities owner: separate meter readings and unit conversions; carrier; calorific value; rates/duration or integrated volume flag; water source; utility returns; refrigeration service and charge/recovery; site/time; allocation drivers"
      collection_method: "Collect raw full-period meters including idle/startup, failed batches, water preparation, clean-area services, QC, cold chain and actual finished-store/loading loads. Separate purchased utilities from internal generation; maintain disaggregated units and actual attribution records. No normalisation in collection."
      unit: "kWh; MJ; m3; kg"
      frequency: "Each batch/event and period close"
      temporal_coverage: "One matched closed raw reporting period plus traced opening/closing carry-over"
      site_scope: "Declared collection/supplier/manufacturing and storage sites; no donor personal data"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated measurements; invoices; environmental batch ledger; stock reconciliation; full provider boundary and uncertainty"
    - protocol_id: cp_packaging
      process_id: "albumin_supply"
      flow_role: "Packaging consumption"
      record_type: "foreground_record"
      raw_fields: "Packaging owner: each material/component; mass per item measured; purchased/used counts; reject/breakage; stock movements; formulation mass excluded from tare"
      collection_method: "Keep unreduced component totals for the matched cohort, including scrap, tests, rework and returned packaging. Count-to-mass needs actual weighed component mass. Document complete supplier composition; no default pack mass."
      unit: "kg"
      frequency: "Each batch/event and period close"
      temporal_coverage: "One matched closed raw reporting period plus traced opening/closing carry-over"
      site_scope: "Declared collection/supplier/manufacturing and storage sites; no donor personal data"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated measurements; invoices; environmental batch ledger; stock reconciliation; full provider boundary and uncertainty"
    - protocol_id: cp_waste
      process_id: "albumin_supply"
      flow_role: "Wastewater and individual wastes"
      record_type: "foreground_record"
      raw_fields: "Environmental/waste owner: individual stream; wet mass/volume; independently measured composition/density; treatment destination; off-spec/expiry; sludge; recovery; inventory and provider coverage"
      collection_method: "Retain complete raw transfers, sampling and treatment manifests for each waste with its actual handling burden. Reconcile mass, water and constituents without COD-to-mass inference. Include failed/zero-output and return disposal; avoid double treatment with provider datasets. No treatment operations protocol is supplied."
      unit: "kg; m3"
      frequency: "Each batch/event and period close"
      temporal_coverage: "One matched closed raw reporting period plus traced opening/closing carry-over"
      site_scope: "Declared collection/supplier/manufacturing and storage sites; no donor personal data"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated measurements; invoices; environmental batch ledger; stock reconciliation; full provider boundary and uncertainty"
    - protocol_id: cp_emissions
      process_id: "albumin_supply"
      flow_role: "Individual elementary exchanges"
      record_type: "foreground_record"
      raw_fields: "Environmental owner: species; medium; actual measured mass or independently supported factor inputs; control boundary; time; uncertainty; water balance; fuel carbon; refrigerant balance"
      collection_method: "Keep raw species-specific monitoring or factor calculations before division, including control and cold-chain losses. Total VOC, COD and closure residuals cannot identify an unknown species. Separate reaction-water evidence from independent physical mass/element closure; never solve two unknowns from one residual."
      unit: "kg"
      frequency: "Each batch/event and period close"
      temporal_coverage: "One matched closed raw reporting period plus traced opening/closing carry-over"
      site_scope: "Declared collection/supplier/manufacturing and storage sites; no donor personal data"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated measurements; invoices; environmental batch ledger; stock reconciliation; full provider boundary and uncertainty"
    - protocol_id: cp_allocation
      process_id: "albumin_supply"
      flow_role: "Shared burdens and co-products"
      record_type: "foreground_record"
      raw_fields: "LCI accounting owner: all actual co-products; exact shared gate and state; raw physical outputs; causal driver; same-period quantities and gate prices; allocated/unallocated burdens; WIP/finished inventory carry vectors"
      collection_method: "Collect underlying records without division by Q. Preserve actual co-product states and the complete common burden pool, then apply the disclosed a_hierarchy decision and trace inventory/carried burdens to the same final supplied cohort. Record actual driver and price uncertainty."
      unit: "kg; declared currency"
      frequency: "Each batch/event and period close"
      temporal_coverage: "One matched closed raw reporting period plus traced opening/closing carry-over"
      site_scope: "Declared collection/supplier/manufacturing and storage sites; no donor personal data"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated measurements; invoices; environmental batch ledger; stock reconciliation; full provider boundary and uncertainty"
  calculation_rules:
    - id: carry_dispatch
      applies_to: "all inventory rows"
      rule: "For each exchange/burden j, retain A_j = raw-period attributable burden + opening WIP burden + opening finished-goods burden - closing WIP burden - closing finished-goods burden, with same-product/route/state cohort tracking and explicit returned-material reversal/carry adjustments. This is burden matching, not raw physical output accounting. Keep product-specific and allocated shared burdens identifiable; cancel internal transfers and do not divide here."
      inputs:
        - raw_period_burdens
        - opening_wip_burdens
        - closing_wip_burdens
        - opening_finished_burdens
        - closing_finished_burdens
        - return_adjustments
        - cp_output
        - cp_allocation
      output: "A_j"
      source_ids:
        - jrc-ilcd-2010
    - id: normalize_dispatch
      applies_to: "all inventory rows"
      rule: "x_j = A_j / Q. Q is the positive unique accepted net dispatched wet-solution mass at the selected plant gate in kg. This is the sole reporting division after raw conversions and carry_dispatch; flow-card amount and protocol aggregation are references to this same operation, not extra divisions. No numeric dataset can be reported when Q is zero, negative or unresolved."
      inputs:
        - A_j
        - Q
        - cp_output
        - cp_material
        - cp_utilities
        - cp_packaging
        - cp_waste
        - cp_emissions
        - cp_allocation
      output: "x_j"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_closure
      applies_to: "albumin_supply"
      rule: "Reconcile complete raw physical inputs plus opening raw/WIP/finished stocks against unique dispatched solution, actual co-products, other actual external Product outlets and utility returns, wastes/emissions and closing raw/WIP/finished stocks before allocation. Keep a separate complete physical packaging ledger, including packaging carried out with dispatched goods, rejects and opening/closing packaging stocks; packaging mass remains outside solution Q. Use only actual physical masses in each applicable balance and cancel internal transfers between material, utility and packaging ledgers once. P production release is an internal transfer and is cancelled, never added again as external output. Measure total wet mass, water and independently supported protein/solvent/element balances; reaction water and actual species require independent evidence. Do not fit unknown water and another unknown outlet to a residual."
      inputs:
        - cp_output
        - cp_material
        - cp_utilities
        - cp_packaging
        - cp_waste
        - cp_emissions
        - cp_allocation
      output: "unallocated_physical_ledger"
      source_ids:
        - ifc-pharma-biotech-2007
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: q_identity
      applies_to: "reference product"
      requirement: "Match human origin, exact formulation/strength, full wet supplied state and plant gate; native family UUID alone cannot define any of these qualifiers. Site and supply geography must be measured, not inferred from the native blank geography or historical label."
      evidence: "Original supplier specification and anonymised batch release/dispatch records"
    - id: q_complete
      applies_to: "all inventory rows"
      requirement: "Retain complete actual black-box manufacturing, upstream collection/testing, energy/water, packaging, QC, storage/loading, failure and rework burdens. Never claim packaging-only records cover manufacturing. Ordinary auxiliary UUID/provider matching is disclosed separately from final-reference identity."
      evidence: "Complete material/utility/waste ledger and upstream coverage matrix"
    - id: q_inventory
      applies_to: "all inventory rows"
      requirement: "Opening stocks carry prior burdens, closing undelivered stocks carry burdens forward. Returns remain linked to original batch/dispatch; reverse prior dispatch and burdens when required, carry subsequent rework/storage, and count final net supplied mass once. Reacceptance does not create new production or a second delivery."
      evidence: "Separate production, store and dispatch reconciliations with transaction linkage and burden vectors"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_solution"
    rule: "Require one terminal Product output finished_solution, 1 kg complete wet solution, with the declared UUID and at-plant gate in both languages. Other real intermediates/co-products stay separate; no renaming or UUID hiding to imply another reference. No efficacy or generic blood-unit conversion."
    source_ids:
      - csl-albuminar25-label-2013
  - rule_id: v_period
    applies_to: "albumin_supply"
    rule: "Require positive Q, matched full raw period/cohort, complete failed/zero-output and rework burdens, physical closure and opening/closing WIP/finished-goods carry-over. Prove one normalize_dispatch division only. Do not equate P release with Q dispatch or include undelivered finished stock in Q."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_inventory
    applies_to: "all inventory rows"
    rule: "Every actually present exchange must be represented atomically with complete native restrictions where selected, compatible provider boundaries, real amounts/units and a protocol owner. Missing material burdens, unresolved physical closure, unsupported species or omitted carry-over prevent a complete foreground dataset; unknowns cannot be zero-filled."
    source_ids:
      - ifc-pharma-biotech-2007
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Environmental modelling of the exactly specified human albumin solution supplied at plant"
  allowed_use: "Matched formulation, human source, strength, route, site, gate and period with complete upstream and carry-over accounting"
  excluded_use: "Clinical dosing, therapeutic equivalence, generic blood units, other species/fractions, recombinant route or packaging-only representation of manufacture"
  required_metadata: "Product formulation and assay; original supply specification; period; site/geography; plant dispatch gate; Q and P distinction; upstream boundary; allocation; temperatures; all actual protocols and provider identities"
  required_quality_disclosure: "Uncertainty, sampling, exclusions, native broad-identity/classification limits, auxiliary UUID/provider gaps, zero-output/rework and inventory carry-over; no methodology approval implied"
  update_trigger: "Change in human source, formulation/strength, route, site, supply state, temperature chain, provider boundary, allocation, reference gate or inventory method"
data_sources:
  - id: "csl-albuminar25-label-2013"
    type: "official_guidance"
    reference: "CSL Behring, Albuminar-25 prescribing information, revised June2013; https://labeling.cslbehring.com/pi/us/albuminar25/en/albuminar25-prescribing-information.pdf ; retrieved 2026-10-16"
    used_for: "Original manufacturer label pp1-2: human plasma origin, 25 g/100mL aqueous supplied state, vial presentations and controlled-room-temperature storage. Historical US example only; no current-market guarantee, global-site assumption, environmental factor, recipe, clinical use or efficacy conversion."
  - id: "ifc-pharma-biotech-2007"
    type: "official_guidance"
    reference: "World Bank Group/IFC, EHS Guidelines Pharmaceuticals and Biotechnology Manufacturing, 30April2007, pp4-5,12,19-20; https://www.ifc.org/content/dam/ifc/doc/2000/2007-pharma-biotech-ehs-guidelines-en.pdf ; retrieved/reverified 2026-10-16"
    used_for: "Sector environmental boundary: actual wastewater, waste, clean utilities, water preparation and monitoring. General applicability only; no product-specific yield, emission factor, operating parameter or mandatory chemical recipe."
  - id: "jrc-ilcd-2010"
    type: "handbook"
    reference: "European Commission JRC, ILCD Handbook General guide Detailed guidance, first edition March2010, section7.9, PDF pp275-277,283-284; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf ; retrieved/reverified 2026-10-16"
    used_for: "Attributional subdivision, physical causality and justified exact-gate economic allocation. PCR-specific raw-period, return and carry-over rules operationalise mass/burden consistency; no blood-specific fixed share, clinical value or physiological burden factor is derived."
