system_boundary:
  rules:
    - rule_id: boundary_manufacture
      applies_to: "p_suture"
      rule: "Include input receipt and handling, extrusion, quench and cooling, drawing, holding and thermal stabilisation, cutting, winding, packaging, actual clean-area and QA resources, failed runs, rework, waste and emissions through first release. Process stages come from the disclosed patent route; actual resources and quantities require foreground records."
