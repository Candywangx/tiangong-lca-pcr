    - rule_id: boundary_environment_only
      applies_to: "all datasets"
      rule: "Clinical use, surgical technique, therapeutic equivalence, sterilisation instructions and patient outcomes are outside this manufacturing LCA. Record resource and release evidence without setting clinical or sterilisation operating parameters."
      source_ids: []
