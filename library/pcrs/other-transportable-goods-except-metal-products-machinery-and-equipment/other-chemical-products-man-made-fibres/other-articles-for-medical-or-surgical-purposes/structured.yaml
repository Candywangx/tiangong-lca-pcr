        - epo-0800834-suture
    - rule_id: boundary_external_gamma
      applies_to: "p_gamma"
      rule: "Include the actual external gamma treatment burden, load allocation, rejected loads, associated handling and return freight. Preserve a route-compatible provider dataset; do not substitute the patent's EO example or omit contractor burdens. Transfer and return of owned thread are internal movements, not purchases or new output."
      source_ids:
        - fda-k993997-suture
    - rule_id: boundary_storage
      applies_to: "p_store"
      rule: "Preserve every actually included warehouse, handling, packaging and dispatch burden. Pre-release burdens belong to production; post-release stock and dispatch remain a separate ledger with the same cohort IDs. Exclude distribution beyond the declared boundary only with explicit disclosure."
