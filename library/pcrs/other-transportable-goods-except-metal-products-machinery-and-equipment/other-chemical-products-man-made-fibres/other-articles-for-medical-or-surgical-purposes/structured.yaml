measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of unique positive first quality-released net thread masses for the same SKU, route and supplied state. Use calibrated weighing or measured count-by-SKU thread mass, retaining sample size and uncertainty. Exclude needles, carriers, pouches, cartons, QA-consumed samples and rejected thread. Actual shipments are not Q."
  - id: once_only_normalisation
    applies_to: "all inventory amounts"
    required_property_ref:
      name: "Recorded physical property"
      uuid: ""
    required_unit: "original unit per kg"
    rule: "Collect undivided raw period amounts and burdens in the protocols. Apply cr_normalise once after raw conversion and WIP burden reconciliation; the card and aggregation label describe that same reporting operation, not successive divisions."
  - id: volume_and_energy
    applies_to: "raw resource records"
    required_property_ref:
      name: "Actual volume, mass or energy"
      uuid: ""
    required_unit: "m3; kg; kWh; MJ"
    rule: "An integrated volume is already a period total and receives no extra time multiplier. A measured rate requires its actual duration. Use independently supported density for the actual solution and conditions; no native secondary coefficient is presumed to be density. Preserve kWh; convert to MJ only when needed using 1 kWh = 3.6 MJ."
  - id: product_mass_balance
    applies_to: "thread and formulation ledgers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Balance material issues plus opening WIP against Q, closing WIP, QA samples, rejects and separately measured losses. Track polymer and formulation constituents independently of water. Stretching and heat setting change dimensions and structure, not automatically polymer mass or reaction-water stoichiometry. Do not infer an emission, species or reaction-water quantity from a balance residual."
  - id: supply_formulation
    applies_to: "purchased resin, cleaner and pouch"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Purchase each complete supplied formulation or assembled pouch once. Resin stabilisers, cleaning-solution water and pouch layers are compositional subledgers, not duplicate purchases. If separately acquired ingredients or a different route occur, add specific atomic rows and measured mixing burdens before using that dataset."
