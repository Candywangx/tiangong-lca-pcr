      raw_fields: "SKU; cohort; site; period; raw issues; opening and closing material stock; opening and closing WIP by stage; carried WIP burdens; unique first release IDs; thread mass; QA samples; rejects; losses; returns; repeated passes"
      collection_method: "Production data owner retains undivided raw batch/period quantities and opening/closing carried burdens; weigh each physical stream or retain traceable count-to-thread-mass measurements; reconcile transfers and release IDs before calculation"
      unit: "kg; item; m; native burden units"
      frequency: "Every batch and stock closure"
      temporal_coverage: "Full matched period including failed and zero-output runs"
      site_scope: "Manufacturer and traced offsite WIP"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; weigh sheets; BOM; resin certificates; release register; WIP valuation and burden trail; reject and return records"
    - protocol_id: cp_resources
      process_id: "p_suture"
      flow_role: "Utility and cleaning resources"
      record_type: "Meter, issue and QA-resource logs"
      raw_fields: "SKU; cohort; period; meter totals; rate and duration when applicable; cooling make-up and discharge; supplied cleaner amount and assay; measured losses; QA and clean-area shares; complete shared denominator"
      collection_method: "Resource owner retains unnormalised period totals including standby, startup, failed runs, rework, QA and actual cleaning; distinguish recirculation from external make-up; reconcile shared-meter allocation and WIP burden attribution"
      unit: "kWh; MJ; kg; m3; h"
      frequency: "Each meter interval and issue"
      temporal_coverage: "Same full production period"
      site_scope: "Manufacturer with shared utilities identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; invoices; safety data sheets; density evidence; allocation worksheets; QA-resource records"
    - protocol_id: cp_packaging
      process_id: "p_suture"
      flow_role: "Pouch, carrier and carton"
      record_type: "Packaging issue and reject records"
      raw_fields: "SKU; pack specification; supplied component mass; counts; opening/closing stock; issues; pack rejects; pouch layer composition; secondary pack configuration"
      collection_method: "Packaging owner retains complete undivided purchased-component and consumption quantities, failed packs and repacking; measure unit component masses; retain layer composition as a subledger of the whole purchased pouch"
      unit: "kg; item"
      frequency: "Each lot and stock closure"
      temporal_coverage: "Same matched production period"
      site_scope: "Packaging line and contracted packer if used"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Component drawings; supplier composition; sampling/weighing records; stock reconciliation; pack-integrity release evidence"
    - protocol_id: cp_losses
      process_id: "p_suture"
      flow_role: "Waste and direct releases"
      record_type: "Weigh, manifest and monitoring records"
      raw_fields: "Cohort; period; polymer scrap; pouch scrap; paper scrap; aqueous effluent; spent cleaner; evaporation; actual species; destination; method and uncertainty"
      collection_method: "Environmental owner retains raw period masses or measured concentrations with integrated carrier amounts; distinguish waste-to-treatment from direct elementary releases; quantify species independently, rather than fitting closure or COD residuals"
      unit: "kg; m3; concentration with basis"
      frequency: "Each transfer and monitoring interval"
      temporal_coverage: "Full matched period including failed runs"
      site_scope: "Manufacturer to identified treatment or environmental boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste manifests; laboratory results; ventilation and discharge measurements; independent mass-balance reconciliation"
    - protocol_id: cp_gamma
      process_id: "p_gamma"
      flow_role: "Contract gamma irradiation service"
      record_type: "Contractor load and burden records"
      raw_fields: "Provider; load and cohort IDs; received/returned thread and pack mass; failed/zero-release loads; repeated treatment events; occupied capacity; full load denominator; raw treatment energy and source-service records; allocation and scope"
      collection_method: "Contractor data owner supplies undivided actual treatment burden or a compatible service inventory and raw activity; link every load to owned-goods transfers and returns; retain failed loads and rework; never replace burden evidence with a sterility certificate alone"
      unit: "kg treated thread; original service/resource units"
      frequency: "Every load"
      temporal_coverage: "All loads linked to the released cohort and WIP"
      site_scope: "Named gamma provider, with site and actual logistics scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Load ledger; invoices; compatible provider inventory; resource evidence; release and return reconciliations; proof of exclusions preventing duplicate freight"
    - protocol_id: cp_logistics
      process_id: "p_store"
      flow_role: "Storage, handling and road freight"
      record_type: "Stock, meter and consignment records"
      raw_fields: "Cohort; first-release IDs; finished opening/closing stock and carried burdens; first-release transfer Q; returns; dispatch; losses; kg-hours; route; payload; distance; actual packaging and handling resources"
      collection_method: "Logistics owner retains undivided full interval records and carried burdens; split pre-release and post-release accounts; preserve actual trips, storage electricity and handling, including failed returns; identify the owned internal transfers to eliminate on consolidation"
      unit: "kg; kg h; kWh; tkm"
      frequency: "Every consignment and stock/meter interval"
      temporal_coverage: "Declared storage/dispatch interval linked to production cohorts"
      site_scope: "Manufacturer warehouse, provider warehouse and actual freight routes"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Stock and dispatch reconciliation; measured payload/distance; occupancy allocation; meter records; retained burden carry-forward and return IDs"
  calculation_rules:
    - id: cr_release
      applies_to: "unique production denominator"
      rule: "Q = sum of positive net thread masses first quality-released for the matched SKU, route and supplied state. A return or repeated acceptance of the same goods adds no new Q. No closing finished stock is added to this production output. Zero Q makes normalisation undefined; retain the failed run and its burdens."
      inputs:
        - "first release IDs"
        - "measured thread masses"
        - "SKU and route"
        - "return/rework links"
      output: "Q in kg"
      source_ids: []
    - id: cr_raw_convert
      applies_to: "raw amount conversions"
      rule: "Count-based packaging consumption equals actual consumed count times measured mass of that same supplied component. Volume-based mass equals integrated volume times independently supported density at the recorded state; rate totals require actual duration. Preserve the complete supplied formulation, with constituents as subledgers."
      inputs:
        - "raw counts"
        - "measured unit masses"
        - "integrated volumes"
        - "density and conditions"
        - rates
        - durations
        - assay
      output: "Converted undivided raw period amounts"
      source_ids: []
    - id: cr_wip
      applies_to: "production burden attribution"
      rule: "B_release = B_open_WIP + B_period - B_close_WIP for each burden dimension after causal allocation to the matched cohort. B_period retains startup, failures, QA, rejects, rework and repeat processing. Opening/closing WIP carry stage-specific embodied burdens, not just a mass subtraction. Reconcile material stock issues separately."
      inputs:
        - "opening WIP mass and burdens"
        - "complete raw period burdens"
        - "closing WIP mass and burdens"
        - "shared allocation"
      output: "Burdens attributable to first release, before normalisation"
      source_ids: []
    - id: cr_normalise
      applies_to: "reporting all non-reference rows"
      rule: "Report each reconciled attributable raw amount or burden A as A / Q once for the declared 1 kg reference flow. Protocol aggregation_rule and inventory cards are labels for this same operation; collection_method retains raw amounts. Apply separately to every resource, waste, emission and service dimension after conversion and cr_wip where applicable."
      inputs:
        - A
        - Q
        - cr_raw_convert
        - cr_wip
        - "causal allocation"
      output: "Inventory per 1 kg reference flow"
      source_ids: []
    - id: cr_stock_dispatch
      applies_to: "separate finished-stock and delivery account"
      rule: "Finished opening stock + first-release transfer Q + identified physical returns = actual dispatch + closing finished stock + measured losses, with internal movements reconciled. The production output already includes all newly released Q; closing stock is not another production output. If a later study selects actual net delivery, retain opening/closing finished stock with carried burdens, use actual delivered mass as its denominator and keep undelivered goods outside delivery Q. Do not mix the two gates."
      inputs:
        - "finished opening and closing stock"
        - "carried burdens"
        - "Q transfer"
        - "physical returns"
        - dispatch
        - losses
        - gate
      output: "Reconciled storage/dispatch supplement, with internal transfer cancelled on consolidation"
      source_ids: []
    - id: cr_physical_balance
      applies_to: "polymer, water and actual emissions"
      rule: "Independently reconcile polymer/formulation mass and water: material issues plus opening WIP equal released thread plus closing WIP, QA samples, rejects and measured losses. Quench water make-up has independently measured discharge, evaporation and inventory change. No invented reaction water; no unknown emission and unknown water amount fitted to one residual."
      inputs:
        - "material issues"
        - composition
        - Q
        - WIP
        - "QA samples"
        - "reject weights"
        - "measured species"
        - "water make-up"
        - discharge
        - evaporation
        - "stock changes"
      output: "Separate physical balances and unexplained residual with uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: dq_reference
      applies_to: "finished_suture"
      requirement: "Use the selected broad medical-consumable family only with complete external article evidence, actual SKU and release records; recheck all native names, comments, CAS, form/grade, route, type, geography and property/unit support. Its stockpile/home-care/DME context is not a specification for this suture. Verify undyed, uncoated, needle-free, dry and gamma-treated supply state; no other member or mixed supplies can be the reference."
      evidence: "Complete native direct and original product evidence; SKU/BOM and release records; conditional family identity and unknown grade/provider facts disclosed separately"
    - id: dq_pp
      applies_to: "polypropylene_in"
      requirement: "Native Polypropylene has CAS 9003-07-0, production-of-polypropylene route and factory production mix, no additional grade/form name component and empty geography; no delivery location is specified. Its comment covers semicrystalline PP and isotactic/syndiotactic variants, not suture-grade certification. Its 34740 classification conflicts with the polymer identity; retain that defect. Accept only as broad raw polymer identity, never proof of the actual supplied resin formulation, location or provider inventory."
      evidence: "Complete native direct record; supplier resin certificate and compatible upstream inventory"
    - id: dq_evidence_scope
      applies_to: "external source use"
      requirement: "FDA K993997 is a historical applicant case, not current universal inventory. Its page 3 absorbable wording is not used; pages 1-2 explicitly identify the nonabsorbable article. EPO process examples do not set yield, electricity, formulation, gamma burden or operating conditions. The selected route requires actual gamma-provider evidence."
      evidence: "Source locators; original limitations; foreground records and explicit route decisions"
    - id: dq_completeness
      applies_to: "all period ledgers"
      requirement: "Preserve failed/zero-output runs, WIP and finished-stock carried burdens, repeat passes, returns, QA, packaging, storage and real contractor loads. Ordinary auxiliary identity/provider matching remains distinct from the conditional family-reference and actual SKU/specification evidence. No missing amount is silently set to zero."
      evidence: "Complete cohort closure and uncertainty/gap register"
validation_rules:
  - rule_id: validate_reference_gate
    applies_to: "reference and production"
    rule: "Require the single terminal Product output finished_suture with 1 kg net thread at first quality release. Confirm its physical supplied state and selected native-family UUID against the declared reference. Reject a shipment denominator mixed with new release Q, or Q plus the same batch's closing finished stock as extra production."
    source_ids: []
  - rule_id: validate_period
    applies_to: "raw records and calculations"
    rule: "Verify complete matched raw numerators, independent protocol owners, WIP carried burdens, unique positive Q and one normalisation. Retain zero-output periods as burden evidence; a finite arithmetic check does not establish measurement completeness or scientific approval."
    source_ids: []
  - rule_id: validate_outsource
    applies_to: "gamma and logistics"
    rule: "Check provider compatibility, all successful and failed load burdens, owned-goods return reconciliation and retained actual handling/freight/storage; eliminate internal transfer and duplicate service-resource accounting."
    source_ids: []
  - rule_id: validate_mass
    applies_to: "physical balances"
    rule: "Keep polymer, supplied formulation, water, actual waste species and emissions independently evidenced. Report unresolved residuals and uncertainty; no invented reaction water, density, emission or COD closure."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "interpretation"
    rule: "No coverage claim for the whole 35290 category, no clinical equivalence claim and no general medical-use shortcut to classify a product. A native schema pass alone cannot resolve final reference or provider applicability."
    source_ids:
      - un-cpc3-2025
      - wco-hs2022-ch30
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after actual production data completion and applicable independent review"
  downstream_use: "Embodied manufacturing burden of the same sterile needle-free undyed polypropylene monofilament suture specification and declared release gate"
  allowed_use: "Environmental modelling with explicit quantity, SKU, supplied state, foreground boundary, geography/year and provider compatibility"
  excluded_use: "Clinical or efficacy comparison; surgical or sterilisation instruction; generic medical supplies; other sutures or instruments; use/end-of-life claims inferred from this release-gate inventory"
  required_metadata: "All reference qualifiers; material and pack specifications; release/cohort identifiers; stage boundaries; treatment-provider and logistics scope; actual raw period and carried burdens; allocation; upstream datasets and units"
  required_quality_disclosure: "Conditional broad-family reference and actual SKU/specification evidence; native polypropylene classification defect and unspecified geography/grade; source case limitations; missing measurements/providers; stock and WIP reconciliations; uncertainty and omitted scope without zero imputation"
  update_trigger: "Final reference identity resolved; change of resin/formulation, diameter/length, coating or dye, needle configuration, pack, irradiation provider/route, gate, geography, period, WIP or allocation method"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed p.171; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "35290 corresponds to HS 30.06; 35279 to HS 30.05. Classification context only; no product recipe or environmental amount."
  - id: "wco-hs2022-ch30"
    type: "official_guidance"
    reference: "WCO, HS 2022 Chapter 30, note 4(a), headings 30.05 and 30.06; https://www.wcotradetools.org/en/harmonized-system/2022/en/0630"
    used_for: "Positive sterile-suture scope and separation from dressings and other pharmaceuticals. Public legal nomenclature only; subscription explanatory notes not acquired; no medical-use shortcut or full-residual coverage claim."
  - id: "fda-k993997-suture"
    type: "official_guidance"
    reference: "FDA-hosted applicant summary K993997, prepared 29 September 1999, PDF pp.1-3, printed pp.9-11; https://www.accessdata.fda.gov/cdrh_docs/pdf/K993997.pdf"
    used_for: "Actual historical nonabsorbable sterile PP monofilament, undyed and needle-free options, gamma treatment and dry foil/polyester packaging. Applicant-specific, not a universal/current inventory or efficacy basis; conflicting absorbable wording on p.3 is not adopted."
  - id: "epo-0800834-suture"
    type: "literature"
    reference: "EPO, EP0800834B1, 15 January 2003, paragraphs 0009-0018, pp.2-4; https://data.epo.org/publication-server/rest/v1.0/publication-dates/20030115/patents/EP0800834NWB1/document.pdf"
    used_for: "Structural manufacturing-stage evidence for PP resin extrusion, quench, drawing, thermal stabilisation and packaged sutures. Historical patent, not foreground measurements, a universal recipe or intensity; its EO example does not support gamma burdens. No operating parameters adopted."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance, first edition March 2010, §7.9.3, printed pp.257–258 (PDF pp.277–278). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Only the declared attributional context in which allocation is required: virtual subdivision, exchange-specific determining physical causality and only then contemporaneous market values of genuine residual co-functions in their actual condition at the same process exit. Supports allocation method, not this product’s industrial route, recipe, measured quantities, fixed shares, substitution credits or scientific approval; it does not literally prescribe this PCR stock/cohort implementation."
