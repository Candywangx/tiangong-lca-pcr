allocation_rules:
  - rule_id: allocation_cohort
    applies_to: "production and WIP"
    rule: "Assign directly metered material and resource burdens to the actual SKU/cohort first. Include failed and zero-output runs and rework attributable to that cohort. Reconcile opening carried WIP burden, new period burden and closing WIP burden before cr_normalise; never discard rejected-run burden or divide it by a fictitious positive output."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared equipment, QA, contractor loads and warehouses"
    rule: "Subdivide by actual metering where possible. Otherwise use documented causal machine hours, occupied load capacity or mass-time records with the complete shared denominator, including unsuccessful loads; disclose rationale, uncertainty and sensitivity. Do not assume equal burden per suture, per kg or per invoice without evidence."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_scrap
    applies_to: "rejects and recovered polymer"
    rule: "Internal regrind is a measured internal loop, not a second purchased input or saleable co-product. Keep its processing energy and repeated passes. Record external scrap treatment with actual mass and route; no automatic avoided-virgin credit. If recovery substitution is separately modelled, disclose its independent assumptions and avoid a second credit."
    source_ids: []
