  semantic_boundary_decision: Seed material manifest inventory and current/prior unmerged intake contain no same
    unformulated single-C18 sodium stearate powder method. Generic 35321 legacy scaffold is empty, not methodology.
    Adjacent 35310 nonsoap surfactants, tall-oil acidulation, glycerol refining and soap auxiliary inputs are not
    duplicates. New semantic identity is narrower than CPC leaf; no mapping requested.
  reference_identity_limitations: Native Soap has no CAS, grade, moisture, form or geography restriction and no
    fixed mixture ratio. It consistently permits alkali salts from fatty acids; adopt only as a broad physical identity,
    with CAS822-16-2 C18 powder, vegetable origin, assay and neutralisation route separately constrained here. No
    supplier background or quantitative recipe is implied.
  source_limitations: 'EPA1974 is historical US route evidence only. US4397760A supports fatty-acid + NaOH water
    formation and drying, not universal operation, yield or formulation: Example I contains glycerol and composite
    auxiliaries and is not this additive-free recipe. Sigma S3381 page supports a real plant-derived >=99% powder
    product, ambient shipment and 2-8C storage, but does not disclose its manufacturing route or batch water/packaging.
    Its functional-group ester label is inconsistent with displayed carboxylate formula; chemical identity follows
    formula/CAS, and the metadata debt remains disclosed. Producer evidence is a persisted web-tool rendering, not
    a locally downloaded publisher PDF or lot CoA. Native DI-water CPC18000 is a classification mismatch with treated-water
    identity; retain metadata debt.'
  normalisation_owner: Only calc_normalise divides the matched raw burden by actual net accepted external delivery
    Q. Card formulas and protocol aggregation describe that same report operation. Collection methods retain raw
    period/cohort records, opening/closing WIP and finished-stock carried burdens without A/Q.
