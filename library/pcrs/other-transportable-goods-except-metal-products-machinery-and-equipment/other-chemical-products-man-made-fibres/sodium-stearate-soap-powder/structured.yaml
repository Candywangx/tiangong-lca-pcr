system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "all inventory rows"
      rule: "Include receiving/storage, melting, solution handling, neutralisation, actual removal of water, milling/sieving, air systems, pollution controls, cleaning, QA, packing, warehouse and dispatch handling up to the actual factory-delivery gate. Include real rework and failed runs, plus upstream and external treatment links."
      source_ids:
        - epa-soap-1974
        - us-soap-neutralisation-1983
    - rule_id: boundary_actual
      applies_to: "all inventory rows"
      rule: "Atomic cards are a collection starting set, not a fixed plant recipe. Every actual extra package component, cleaner, utility, refrigerant loss, onsite fuel, treatment reagent, waste or elementary species requires an additional atomic card and protocol. Demonstrated absence permits not_applicable; a blank UUID or catalogue silence does not permit omission."
      source_ids:
        - epa-soap-1974
    - rule_id: boundary_sources
      applies_to: "all inventory rows"
      rule: "The producer page identifies a real high-purity plant-origin powder, not this supplier route or water/packaging composition. Its ambient shipment and 2-8 C storage differ; match actual conditions and retain refrigeration burdens when present. The ester metadata label conflicts with its carboxylate formula and is not a reaction basis. Patent Example I contains glycerol and composite additives: its formulation is not transferred."
      source_ids:
        - sigma-s3381
        - us-soap-neutralisation-1983
    - rule_id: boundary_physical
      applies_to: "all inventory rows"
      rule: "Independently close manufacturing, FG and combined total mass, C/H/O/Na and actual species/phase ledgers. Drying/ventilation has separately measured gross N2, O2, Ar, atmospheric-origin CO2 and gaseous H2O intake/outlets; no fixed air recipe or automatic fossil CO2/uptake credit. Purchased compressed-air carriers are composition child accounts, not duplicate environmental intake. Actual gas reaction/uptake, condensate, droplets and aerosols require separate measured identities/destinations. Packaging custody and external steam-water supply/return remain gross physical exchanges regardless of allocation."
      source_ids: []
    - rule_id: boundary_pack
      applies_to: "hdpe_body; hdpe_lid"
      rule: "For EACH actual separate article: opening empty + opening attachedWIP + opening attachedFG + opening reusable + new external purchase/supplier-attached receipt + external return received = closing empty + closing attachedWIP + closing attachedFG + closing reusable + article accompanying every gross physical dispatch + separate external return sent + actual article waste. New purchase and attached supplier receipt count once; contents are independent from dry tare. Internal reuse cancels within custody, never reduces gross outward article mass, raises net powder Q or creates automatic credit. Add every genuinely different material/article and its five external directions."
      source_ids: []
