allocation_rules:
  - rule_id: allocation_single
    applies_to: "all inventory rows"
    rule: "This free-acid route produces no reaction glycerol and defines only soap powder as the reference. Do not add hypothetical glycerol output, substitution credit, soap-base credit or avoided waste-treatment benefit. Upstream fat-splitting glycerol belongs to the supplied-acid background with its disclosed allocation."
    source_ids:
      - epa-soap-1974
      - us-soap-neutralisation-1983
  - rule_id: allocation_actual
    applies_to: "all inventory rows"
    rule: "Establish the study situation first: these provisions apply when attributional allocation is required; industrial route evidence does not authorize consequential substitution. First subdivide actual distinguishable operations or use evidenced virtual subdivision to assign exclusive materials, failures, cleanup, package and service exchanges. For each still-shared exchange independently establish the determining physical cause and measured driver, including actual state/time/geometry as relevant; mass or output count is not universal causality. Only a genuine residual without determining physical assignment uses relative market values of actual cofunctions at the same process exit/entry gate, condition and period, removing downstream transport/conditioning/packaging costs where needed. Collect quantities, prices/currency/date, allocation-sum conservation and sensitivity. Unknown cause/value evidence leaves the concrete dataset incomplete; no arbitrary fixed key. Internal return/rework/dust is not a coproduct or credit; actual external recovery follows applicable recycling provisions."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "soap_line"
      flow_role: "product; fg_return; gross_dispatch"
      record_type: "acceptance_record"
      raw_fields: "lot_id; portion_id; grade; CAS; route; origin; fatty_acid_profile; assay; assay_basis; moisture; free_acid; free_alkali; net_mass; package_tare; dispatch; acceptance; returns; opening_finished; closing_finished; carried_burdens; returned_carried_burdens; prior_report_corrections  dry_salt; water; actual_FG_new_inputs; FG_evaporation; condensation; adsorption; FG_waste_and_other_exits; original_Q_and_vector;"
      collection_method: "Owner: QA lead and dispatch/stock accountant. Reconcile calibrated powder net weights, lot CoA, acceptance, outward dispatch and return links. Preserve raw masses and carried burden vectors; no A/Q. Resolve prior counted versus replacement portions by physical lineage.  Independently weigh gross custody G/returns and actual phase/composition changes; record each actual new FG/rework input/output and incremental service with correction history."
      unit: "kg; %; lot ID"
      frequency: "Each dispatch/return; period-end reconciliation"
      temporal_coverage: "Complete actual delivery period and source production periods"
      site_scope: "Same powder/route/state and actual site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, acceptance and return documents, CoA, stock and burden ledgers"
    - protocol_id: cp_material
      process_id: "soap_line"
      flow_role: "stearic_acid; caustic_solution; process_water"
      record_type: "purchase_and_batch_record"
      raw_fields: "material_id; supplier; route; origin; wet_mass; assay; water_fraction; density; temperature; pressure; receipts; issues; returns; opening; closing; WIP_mass; WIP_composition; carried_burdens; failed_run; rework"
      collection_method: "Owner: production mass-balance engineer. Capture actual whole supply receipts/issues and calibrated dosing for every run, including failures. Retain active/carrier subledgers, traceable WIP and carried burdens; close raw inventory without normalising."
      unit: "kg; m3; kg/m3; %"
      frequency: "Each receipt/batch; stock endpoints"
      temporal_coverage: "Full actual production and delivery cohort history"
      site_scope: "Acid handling, alkali handling, reaction, cleaning and WIP"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices, calibrated scales/meters, assays, supplier origin, WIP genealogy and burden records"
    - protocol_id: cp_energy
      process_id: "soap_line"
      flow_role: "electricity; steam_heat"
      record_type: "meter_and_service_record"
      raw_fields: "meter_start; meter_end; kWh; steam_mass; inlet_enthalpy; condensate_enthalpy; run_duration; integrated_volume; storage_time; temperature; allocation_driver; failed_run; carried_burdens"
      collection_method: "Owner: utilities engineer. Keep undivided raw readings by stage/run and the attributable warehouse, refrigeration, packing, handling, dispatch and treatment service pools, including failed runs and carried stock services. Record actual supply voltage/geography and steam conditions."
      unit: "kWh; MJ; kg; kJ/kg; h"
      frequency: "Meter interval and each batch/service"
      temporal_coverage: "Complete actual period and relevant stock service history"
      site_scope: "All included stages and shared facilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibrations, bills, enthalpy conditions and causal allocation records"
    - protocol_id: cp_pack
      process_id: "soap_line"
      flow_role: "hdpe_body; hdpe_lid; all packaging directions"
      record_type: "package_and_dispatch_record"
      raw_fields: "component_id; resin; tare; issued_count; returned_count; damaged_count; opening; closing; packed_lot; delivered_portion; rework; carried_burdens  empty/attachedWIP/attachedFG/reusable opening_closing; new_receipt; external_return_received; gross_outward; external_return_sent; article_waste; contents; inherited_exchange_vectors;"
      collection_method: "Owner: packaging and warehouse manager. Weigh each actual component separately and retain raw issue/stock/return/damage records matched to delivered portions; include repacking, handling and retained finished-stock packaging burdens. No per-kg calculation during collection.  Apply boundary_pack separately to every article and actual five external directions, with gross physical dispatch independent from reuse/allocation."
      unit: "kg; count"
      frequency: "Each package design/lot and dispatch"
      temporal_coverage: "Full actual period and package stock history"
      site_scope: "Actual packing, stock and dispatch area"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare tests, bill of materials, stock issues/returns and dispatch linkage"
    - protocol_id: cp_outlets
      process_id: "soap_line"
      flow_role: "wash_water; discarded_soap; water_vapour; soap_dust"
      record_type: "measurement_and_treatment_record"
      raw_fields: "wet_mass; composition; water; sodium; stearate; exhaust_flow; humidity_in; humidity_out; particulate_concentration; duration; condensate; capture; rework; receiving_treatment; failed_run; carried_burdens"
      collection_method: "Owner: environmental engineer. Keep independent undivided outlet measurements and treatment records, including failed runs, cleaning and rework. Preserve units and measurement boundary; measure vapour/dust independently of reaction-water calculation and total-mass residual."
      unit: "kg; m3; kg/m3; h"
      frequency: "Each event; representative monitored intervals"
      temporal_coverage: "Complete actual period and stock-linked losses"
      site_scope: "Dryer/exhaust, cleaning, residue and treatment boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling/calibration, humidity and flow conditions, waste manifests and treatment evidence"
    - protocol_id: cp_balance
      process_id: "soap_line"
      flow_role: "all inventory rows"
      record_type: "species_and_inventory_balance"
      raw_fields: "reacted_stearic_moles; reacted_NaOH_moles; residual_species; water_in; water_out; WIP_open; WIP_close; finished_open; finished_close; transfers; loss; burden_vectors  nonWIP_equipment_location; opening_closing_charge; actual_makeup_recovery_leak_disposal; per_exchange_open_current_close_vectors; manufacturing_FG_combined_gates;"
      collection_method: "Owner: process chemist with stock accountant. Establish reacted species from independent feed/product analyses and conversion tests; retain complete raw stage/whole-site physical, C/H/O/Na and water ledgers with stock changes and carryover. Do not solve both reaction water and an unknown outlet from a residual.  Each actual non-WIP stock has independent physical and every-exchange-vector conservation, disjoint from raw/WIP; include all actual FG mass/species movements before cancelling internal transfers."
      unit: "kg; mol; %"
      frequency: "Each batch and complete period close"
      temporal_coverage: "Whole cohort including prior stock origins"
      site_scope: "Reaction, water removal, WIP and finished store"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Assays, reaction tests, raw balances, transfer receipts and carried burden reconciliation"
    - protocol_id: cp_air
      process_id: "soap_line"
      flow_role: "all actual carrier species"
      record_type: "gas_measurement"
      raw_fields: "species; origin; integrated_volume_or_rate; interval; P; T; humidity; composition; actual uptake; compartment; FG_or_manufacturing"
      collection_method: "Owner: environmental engineer. Independently measure each gross species intake/outlet and phase, not a fixed air mixture. Purchased carrier child accounts do not repeat resource intake; retain raw unnormalised records before calc_normalise."
      unit: "original unit"
      frequency: "each interval/event"
      temporal_coverage: "complete period and cohort history"
      site_scope: "actual air and FG boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; species/humidity analysis; phase records"
    - protocol_id: cp_stock
      process_id: "soap_line"
      flow_role: "steam_water_supply; condensate_return; each actual nonWIP charge"
      record_type: "physical_and_exchange_vector_ledger"
      raw_fields: "material; location; opening; supply; return; state; enthalpy; actual loss; closing; original_vector; each_current_increment; supplier_water_energy_convention"
      collection_method: "Owner: utilities and stock engineers. Measure each actual mass and separate phase/state, carry each inherited exchange vector, and reconcile stock/returns/loss without overlap. Supply/return masses need independent meters; upstream steam production is owned once across heat and water records. Retain raw records before calc_normalise."
      unit: "kg; state; kJ/kg"
      frequency: "each movement and stock endpoint"
      temporal_coverage: "complete period and inherited histories"
      site_scope: "actual supplier and equipment locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; supplier convention; physical stock and burden-vector evidence"
  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Retain each external whole-supply raw exchange once; reconcile receipts/issues/returns and opening/closing unreacted material. Convert tonnes to kg; kWh to MJ by 3.6; liquid integrated volume to mass by measured-condition density. Heat is net delivered enthalpy. Rate x duration is allowed; integrated volume gets no extra time. Subledgers are not duplicate exchanges."
      inputs:
        - cp_material
        - cp_energy
        - cp_pack
        - cp_outlets
      output: "raw_exchange_vectors"
      source_ids:
        - epa-soap-1974
    - id: calc_delivery
      applies_to: "product"
      rule: "Q = unique net externally delivered and accepted powder mass of the declared cohort after linked return adjustments; never count re-delivery of the same already counted physical portion twice. A return reverses the original delivery recognition for that physical portion; later re-delivery restores it once and creates no new production. Record prior-period corrections so neither the original and replacement delivery nor their history burdens are duplicated. Keep opening + releases + physical returns + actual new FG material/moisture = gross dispatch + closing + all actual FG waste/vapour/other exits, with separate new-production and delivered quantities. Unresolved return lineage or nonpositive Q blocks reporting.   Independently retain gross G, external returned mass and water/dry-salt/state changes; the simplified FG equation must include actual new material/moisture inputs and real vapour/waste/other exits, not force release plus returns into unchanged wet mass. Preserve the original Q and numerator of affected historical reports for explicit corrections; re-delivery restores only the actually accepted reconditioned portion/state once, never old mass blindly and never new manufacture."
      inputs:
        - cp_output
        - cp_balance
      output: "Q"
      source_ids: []
    - id: calc_carry
      applies_to: "all inventory rows"
      rule: "For each burden vector B_i, take complete actual period raw burden plus opening WIP/finished carried burden and inbound returned-product carried burden not already included in opening stock, with linked prior-report corrections, minus closing WIP/undelivered finished carried burden and separately justified other-product shares. Assign retained failed/zero-output and irrecoverable-loss burdens to the responsible cohort; include actual rework, cleaning, treatment, storage, packaging, handling and dispatch. Physical stock balances and burden balances are separate. Stage/warehouse handovers cancel, including prior stock load rather than treating it as zero. Carry external returned-product history without recreating production.   Extend the same per-exchange opening/current/closing reconciliation to non-WIP loops and equipment charges at each declared location; every genuine change in remaining stock keeps its inherited vector, not only purchase expenditure. Actual new FG/rework inputs, exits and incremental services belong to the causally matching net-delivery cohort. Do not use one old cohort burden or denominator for unrelated current output. Net delivery reference and gross custody cards are alternative accounting views of the same product movements, never additive duplicate product exports."
      inputs:
        - raw_exchange_vectors
        - cp_balance
        - cp_output
        - cp_energy
        - cp_pack
        - cp_outlets
      output: "B_i"
      source_ids: []
    - id: calc_chemistry
      applies_to: "all inventory rows"
      rule: "Independently establish reaction extent xi from identified reacted C18 acid/NaOH and residual assays: n(H2O formed) = xi; n(glycerol formed) = 0 for this route. Use documented molar masses for mass conversion. Distinguish incoming solution water, residual free water, evaporation, condensate and any evidenced structural water. Confirm C/H/O/Na and complete mass with WIP/stock. Do not infer xi from an unknown water outlet or closure residual; a glyceride route needs another method."
      inputs:
        - cp_balance
        - cp_material
        - cp_output
        - cp_outlets
      output: "independent_species_and_water_balance"
      source_ids:
        - us-soap-neutralisation-1983
        - epa-soap-1974
    - id: calc_normalise
      applies_to: "all inventory rows"
      rule: "For every non-reference exchange, report B_i / Q exactly once after calc_raw and calc_carry; Q is from calc_delivery, not production release or dry-active mass. The product output is 1 kg. Inventory expressions and protocol aggregation describe this same report, not successive divisions. Preserve all unnormalised ledgers and conversion/attribution provenance."
      inputs:
        - B_i
        - Q
        - cp_output
        - cp_material
        - cp_energy
        - cp_pack
        - cp_outlets
        - cp_balance
      output: "normalised_inventory"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Confirm actual C18 profile, vegetable origin, assay basis, powder state and route; product name/CAS alone or nonaqueous titration cannot establish the complete composition. UUID supports only its native identity limitations; background compatibility is independent."
      evidence: "Supplier CoA/SDS, fatty-acid analysis, site route and background documentation"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Complete raw periods, failed runs, returned/reworked portions, physical WIP/finished stocks and their full carried burden vectors must reconcile. Document sampling uncertainty and missing-data resolution before quantitative use."
      evidence: "Raw ledgers, transfer genealogy, calibrated meters and independent balances"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Historical EPA/patent descriptions are route evidence, not modern inventory or scientific approval. Producer page provides no lot water, package, manufacturing route or climate inventory. Match actual storage/transport conditions, suppliers, place and time."
      evidence: "Primary originals, full source limitations and collected activity records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "product"
    rule: "Require product as the sole terminal net-delivery reference with reference_flow_link product, the Soap UUID, Mass/kg and 1 kg; gross_dispatch is its gross custody ledger, never an additional net product output; verify declared C18 powder qualifiers and actual net delivery gate. Intermediate soap or internal returns cannot become another reference under the same UUID."
    source_ids: []
  - rule_id: validate_accounts
    applies_to: "all inventory rows"
    rule: "Require positive Q, matched raw/cohort records, complete WIP/finished burden carryover, return deduplication, no double procurement and exactly one normalisation. Verify production release and delivery separately; no closing-stock double output and no omitted warehouse/packing/dispatch/rework load.   Independently close the manufacturing, FG and combined physical/species gates, non-WIP physical and inherited exchange stocks, all package directions and steam carrier supply/return. Gross product custody must reconcile to the single net reference rather than add duplicate product exports. Verify separate phase outlets and original return corrections with each actual new rework input and loss."
    source_ids: []
  - rule_id: validate_chemistry
    applies_to: "all inventory rows"
    rule: "Require independent complete mass/element and species/water evidence. Reject generic reaction-water assumptions, glycerol reference/credits, COD or residual fitted unknown outlets and integrated-volume time multiplication. Check active, water and whole-supply subledger agreement."
    source_ids:
      - us-soap-neutralisation-1983
      - epa-soap-1974
  - rule_id: validate_boundaries
    applies_to: "all inventory rows"
    rule: "Check actual atomic utility/package/treatment/emission completeness, native property/unit and geography limits, provider and source applicability. Empty auxiliary UUIDs remain disclosed identity work; they do not erase actual flows. Source limitations and stock burdens remain in both language renderings and projection."
    source_ids: []
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Ingredient supply of this specified sodium stearate powder"
  allowed_use: "Matched composition/assay, powder state, route, supply and net-delivery boundary after data quality review"
  excluded_use: "Mixed soaps, triglyceride route, liquid/bar/formulated cleansers, substrate articles and equal-use cleaning comparisons"
  required_metadata: "All reference qualifiers, raw period/cohort, stage/provider links, stock and return genealogy, allocation and exact background versions"
  required_quality_disclosure: "Actual composition/water/assay basis, complete carried burdens, upstream coverage, losses, uncertainty, missing auxiliaries and source limitations"
  update_trigger: "Change of acid profile/origin, route, formula, powder grade, package, utilities, storage, provider or delivery boundary"
data_sources:
  - id: "epa-soap-1974"
    type: "official_guidance"
    reference: "US EPA, EPA-440/1-74-018-a, April 1974, printed pp.24-29, especially p.26 and Figure 4; https://www.epa.gov/sites/default/files/2016-08/documents/soap-detergent-mfg_dd_1974.pdf"
    used_for: "Historical US fatty-acid neutralisation versus glyceride/fat-splitting routes; receiving/storage, recycle and wastewater boundary. No modern quantity, emission or zero-effluent default; no supplier recipe."
  - id: "us-soap-neutralisation-1983"
    type: "literature"
    reference: "Story and Myers / Armour-Dial, US4397760A, 1983-08-09, columns 5-10, especially equation in column 7 and powder finishing in column 8; https://patents.google.com/patent/US4397760A/en"
    used_for: "Primary patent reaction and mixing/water-removal description. Explicit acid + NaOH -> soap + water; no transfer of its approximate water percentages, example recipes, airflows or energy. Example I composite additives/glycerol are outside this unformulated powder; no claim that producer uses this equipment or achieves this grade."
  - id: "sigma-s3381"
    type: "literature"
    reference: "Sigma-Aldrich / Merck, S3381 Sodium stearate producer page, dated reading 2026-10-16; https://www.sigmaaldrich.com/US/en/product/sigma/s3381"
    used_for: "Primary producer identity: CAS822-16-2, C18 carboxylate, >=99% plant-origin powder; ambient shipment and 2-8C storage differ. Actual lot water/packaging and manufacturing route are not supplied. The ester metadata tag conflicts with displayed carboxylate structure; not a reaction basis. Retained evidence is a web-tool-rendered primary page, not an acquired publisher PDF or lot CoA."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "First edition March2010, complete sections7.9.2–7.9.3 printed255–272/PDF275–292; applicable attributional situation, subdivision/virtual subdivision, per-exchange determining physical causality, genuine residual common-gate actual-state market value and recycling limitations. No fixed allocation factors."
