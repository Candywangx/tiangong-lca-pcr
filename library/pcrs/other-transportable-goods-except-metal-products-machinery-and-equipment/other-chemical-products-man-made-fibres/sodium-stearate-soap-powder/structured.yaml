measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is actual net accepted external delivered powder mass for one product/route/state cohort. Exclude packaging tare, internal transfers, undelivered finished stock and already counted returns. Deduplicate physical lot/portion IDs; returned and reaccepted material creates no additional Q. Retained moisture is included; dry-active analysis is a subledger, not another reference."
  - id: inventory_carry
    applies_to: "all inventory rows"
    required_property_ref:
      name: ""
      uuid: ""
    required_unit: ""
    rule: "Keep separate manufacturing, FG and combined physical gates. FG: opening + actual new release + external returns + independently measured actual material/moisture entering FG = closing + gross outward dispatch G + actual FG waste, vapour and other physical exits. Track dry C18 salt, free water and other actual species independently at opening, release, return, rework, closing and dispatch. Cancel internal production/rework handovers only once; release plus closing FG is not a double output. Net accepted delivery Q follows calc_delivery, not G or release. Every raw/WIP and non-WIP water loop, steam/condensate, cooling fluid, lubricant, refrigerant and equipment charge retains independent physical amount/state/location AND each inherited exchange vector, with original cohort/history and no overlapping stocks. Add every actual charge makeup, recovery, leak, replacement and disposal as a specific atomic exchange before data use."
  - id: single_normalisation
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass / Energy"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Collect raw period numerators without dividing. Attribute actual failed/zero-output runs, returns/rework, utilities, warehouse/packing/handling/dispatch and treatment burdens to their matched cohort including stock carryover. calc_normalise alone divides the resulting numerator B_i by Q once. Card amount rules and protocol aggregation are the same report operation, never sequential divisions. No positive Q means no finite per-kg dataset."
  - id: wet_supply
    applies_to: "whole wet material supplies"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Purchase each whole wet solution once. NaOH assay and carrier water are component subledgers. With onsite preparation, separately acquired ingredients and actual mixing/dilution energy/loss replace the formulation purchase. Do not buy feed oil, its stearic acid and a whole soap base again for the same upstream material."
  - id: unit_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass / Energy / Volume"
      uuid: ""
    required_unit: "kg; MJ; m3"
    rule: "Use 1000 kg/t and 3.6 MJ/kWh. Convert liquid volumes using measured density at recorded conditions. Rate times duration is valid; an integrated volume is not multiplied by time again. Steam supply and condensate return masses remain separate physical records; heat service uses each actual measured mass and state enthalpy. Heat is not water mass, and secondary flow-property coefficients are not density."
  - id: species_water
    applies_to: "physical material and species ledgers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Check whole physical mass and C/H/O/Na separately from species reaction chemistry. For confirmed stearic-acid neutralisation, C18H36O2 + NaOH -> C18H35NaO2 + H2O forms one mole water per reacted mole and no glycerol. Glyceride + 3NaOH -> glycerol + 3soap does not itself form net water and is outside this route. Free water, evaporation, condensation and any structural water are separately evidenced; never fit reaction water and an unknown outlet to one closure residual or COD."
