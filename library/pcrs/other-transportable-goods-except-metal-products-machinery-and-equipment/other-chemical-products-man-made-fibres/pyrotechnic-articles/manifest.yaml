  mapping_proposal: "accepted_narrower under docs/adr/2026-11-22-accept-cpc-35460-civilian-maritime-distress-signal-first-french-market-placement.md"
  semantic_boundary: >-
    One complete sealed civilian hand-held maritime distress-signal cohort first
    placed on the French national market for paid or free onward supply. Earlier
    factory release abroad is compatible. No manufacture, composition, performance,
    activation, operating, use or treatment methodology; no new factory or buyer gate.
  evidence_limits: >-
    PYReO 2022/2024 page 7 establishes a separate hand-held category and national
    average-mass estimates, not a measured local lot, pack, supplier inventory or
    collection probability. Committee 2023 page 2 distinguishes scope change and
    removal of one-for-one attribution. ADEME independently supports national
    producer reporting and separate packaging coverage. These support a bounded
    accounting method, not an actual qualified product dataset. The dated consolidated
    Legifrance endpoint returned 403, but the original Decree 2020-1725 article 7(3)
    was independently read through its ELI article_7 alias. This verifies the original
    national definition, not a specific current cohort or its dated scheme binding.
  module_applicability: >-
    Referenced core modules are placeholders rather than substantive evidence.
    The candidate PEF module grants no scientific approval. Independently inspected
    original boundary, reuse and allocation principles are used without PEF conformity.
  reference_flow_identity:
    status: unresolved
    unresolved_support_fields:
      - reference_product_flow_uuid
    support_evidence: >-
      Historical public ILCD originals at TianGong-LCA-Data commit
      a55b302e1ca1bf190e4c412c74e046e2d54d32f6 independently bind Mass
      93a60a56-a3c8-11da-a746-0800200b9a66 to Units of mass
      93a60a57-a4c8-11da-a746-0800200c9a66, reference kg.
      Energy f6811440-ee37-11de-8a39-0800200c9a66 points to Units of energy
      93a60a57-a3c8-11da-a746-0800200c9a66 with MJ/kWh conversion.
      These are fixed historical support identities, not current platform observations
      or evidence for a particular product/electricity provider.
  unresolved_flow_identities:
    - row_id: sealed_article_input
      reason: Exact sealed finished article and compatible whole-product environmental provider unverified.
    - row_id: box_purchased
      reason: Actual corrugated outer box unbound; searched native box fibre-share qualifiers are not established for the cohort.
    - row_id: box_first_nonpurchase
      reason: Same actual box and externally inherited remaining burden unbound; free or supplier-included does not imply zero burden.
    - row_id: box_true_return
      reason: Actual box identity, same-item prior outward link and remaining burden unbound.
    - row_id: accounting_electricity
      reason: Actual electricity flow/provider native property unverified; Energy measurement support cannot imply net calorific value.
    - row_id: reference_product
      reason: Unique declared reference product output; exact finished-product flow UUID unresolved.
    - row_id: unplaced_article_transfer
      reason: Exact whole sealed unplaced-article flow and actual outward receiving assignment unbound.
    - row_id: box_outward
      reason: Actual outer box and outward recipient coverage unbound.
    - row_id: discarded_outer_box
      reason: Actual separately evidenced uncontaminated corrugated box waste and recipient unbound.
    - row_id: unplaced_article_waste
      reason: Whole sealed unplaced waste-article handoff and qualified black-box recipient unbound; no treatment technology prescribed.
  unresolved:
    - code: foreground_records
      detail: Existing anonymized first-French-event evidence, prior placement state, dated issuer/year and responsible declarant, actual counts and net/pack measurements, handoffs and both stock equations are required before a dataset.
    - code: environmental_burden_coverage
      detail: Compatible whole-product supplier environmental bundle, actual services, inherited burden vectors and losses must close without opening the finished-product black box.
    - code: conditional_interfaces
      detail: Corrugated outer boxes and metered accounting electricity are conditional interfaces, not observed operations. Actual additional packaging, pallets, utilities or services require supported individual cards before completeness.
    - code: independent_review
      detail: Controller completed the scoped method and mapping review under docs/adr/2026-11-22-accept-cpc-35460-civilian-maritime-distress-signal-first-french-market-placement.md. Separate translation review, scientific approval and actual study qualification remain outstanding.
