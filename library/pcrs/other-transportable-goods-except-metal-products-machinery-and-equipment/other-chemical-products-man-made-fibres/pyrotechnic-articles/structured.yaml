    reference: "ADEME chemical-products EPR, producer reporting, producers concerned, packaging and accredited-body accounting sections: https://filieres-rep.ademe.fr/en/filieres-REP/filiere-PCHIM"
    used_for: "Independent declaration/national-role context; separate placement/collection/treatment data, packaging and fee coverage. Aggregates are not participant-lot evidence; no treatment/operating content adopted."
  - id: "ec-pef-method"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, corrected consolidated Annex I, sections 3.2.2, 4.4.9, 4.5, PDF pp.33,79,87–88: https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02021H2279-20211230"
    used_for: "Independently inspected boundary/disclosure, actual reusable-pack lifecycle attribution and allocation/subdivision principles. No full PEF conformity or source example weights/reuse rates/credits adopted."
