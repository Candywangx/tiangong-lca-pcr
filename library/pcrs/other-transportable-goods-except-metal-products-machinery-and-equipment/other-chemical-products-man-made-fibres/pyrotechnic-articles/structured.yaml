system_boundary:
  rules:
    - rule_id: boundary_national_event
      applies_to: "first placement"
      rule: "Bind the dated French definition and actual responsible declarant. Distinguish domestic manufacture, first national introduction/import, paid/free onward supply and sole-brand reseller responsibility. Direct own use is outside the selected onward-supply cohort but stays in a separate branch when reconciling a broader statutory population, alongside applicable statutory exclusions. Foreign factory release, filing, sale elsewhere or later dispatch alone is not the French event."
      source_ids:
        - french-producer-definition
        - ademe-pchim
    - rule_id: boundary_closed_product
      applies_to: "supplied article"
      rule: "Keep the supplied sealed article's complete environmental bundle as a black box. Do not reconstruct manufacture, internal materials, operating conditions or performance. Missing supplier coverage is unknown, not invented inputs/emissions or an impact factor."
      source_ids:
        - ec-pef-method
        - pyreo-market-2024
    - rule_id: boundary_two_stocks
      applies_to: "physical article perimeter"
      rule: "Limit this method to a cohort whose evidenced physical perimeter covers the actual custodian at the first French event, including an anonymous entrusted third party if documented. Maintain adjacent pre-French-placement and already-French-placed stock books over that same perimeter. A declarant's legal title alone cannot bring outside goods into these books. Record first-French events outside this perimeter separately in the national-report bridge, not as fictitious local receipt/dispatch or Q in these books. Q leaves the former and enters the latter once, cancelling in their sum. Opening already-placed stock, old returns, resale and subsequent shipments never create Q. Samples still inside remain stock."
      source_ids:
        - french-producer-definition
        - ademe-pchim
    - rule_id: boundary_packs_services
      applies_to: "conditional interfaces"
      rule: "Include real separately evidenced external packaging and attributable services once, without overlap with supplier coverage. A fee or payment is neither a physical exchange nor an environmental factor. Do not assume boxes, pallets, electricity or transport exist; any other actual interface needs its own supported atomic row before completeness."
      source_ids:
        - ademe-pchim
        - ec-pef-method
    - rule_id: boundary_later_events
      applies_to: "after first placement"
      rule: "The gate may occur without physical outward movement. Reconcile later stocks and services without another reference output. Expired-product collection/treatment is a separate function, with no one-for-one attribution or automatic credit to newly placed goods."
      source_ids:
        - pyreo-committee-2023
        - ademe-pchim
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Each crossing has one origin/destination type. Article cards link cp_article_ledger and cp_cohort; box cards link cp_outer_box. These are applicability rules, not instructions to create physical movements. Post-gate reconciliation records do not create additional gate LCI outputs. This method's physical cohort includes the actual custodian at the event; if only the declarant's own perimeter is evidenced, outside events stay outside both U/V books and are reported separately. All A_V/R_V/D_V/W_V entries retain their own original cohort, original quantity, prior cumulative burden and exclusive assignment through cp_later_services."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "This is an algebraic bookkeeping illustration, not a measured case, product weight or factor. One sealed article has an existing measured net mass m. Its actual anonymous entrusted custodian is inside the evidenced physical perimeter; the declarant need not have a local receipt or dispatch. Initially U0 = 1 article (m kg), V0 = 0. The documented first French event occurs without movement: Q = 1 article (m kg), U1 = 0, V1 = 1 article (m kg), and all external crossings are zero. In the next interval it is actually handed off: V0 = 1, D_V = 1, V1 = 0 and Q = 0; the original cohort remains 1 article and m kg. Any real later service is external supplemental inventory divided only by that evidenced original m, without another reference output. If the custodian were outside the evidenced perimeter, the event would instead be Qoutside in the national bridge; it would not enter the declarant's U/V stocks."
      source_ids: []
