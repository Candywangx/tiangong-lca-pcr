allocation_rules:
  - rule_id: allocation_cohort_first
    applies_to: "articles and services"
    rule: "Directly assign to the actual cohort/function, subdividing shared records first. If unavoidable, justify a measurable causal physical relationship. Fees, prices, national ratios or arbitrary equal shares are not automatic environmental factors. A status change, return or transfer is not a co-product."
    source_ids:
      - ec-pef-method
      - ademe-pchim
  - rule_id: allocation_inherited_vectors
    applies_to: "original items/cohorts/exchanges"
    rule: "Separately conserve remaining already-incurred environmental inventory: opening carryover plus externally brought remaining burden plus genuinely new burden equals current attribution plus closing carryover plus mutually exclusive external/other attribution. Never recharge original manufacture on a return or erase unknown inherited burden. Physical card quantities are not automatic new-manufacture provider multipliers: only Bcurrent contributes to the reference cohort, while BX/Bother retain their separate receiving assignments without negative credits."
    source_ids:
      - ec-pef-method
  - rule_id: allocation_boxes
    applies_to: "actual box pool"
    rule: "Distinguish purchase, first non-purchased external receipt and genuine same-box return. Define one physical perimeter; outside title-only records cannot simultaneously be outward dispatches and inside stocks. Attribute measured burden consumption and real services once; no assumed lifetime, turn count or return rate."
    source_ids:
      - ec-pef-method
      - ademe-pchim
  - rule_id: allocation_later_service
    applies_to: "already-placed cohorts"
    rule: "Preserve original quantity and cumulative burden. Later services are external supplemental records under cp_later_services, explicitly excluded from the current gate inventory. Their increments do not recreate original article input, reference output or production burdens. Unlinked old or externally already-placed articles keep separate assignments."
    source_ids:
      - pyreo-committee-2023
      - ec-pef-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_cohort
      process_id: "first_france_gate"
      flow_role: "unique national placement"
      record_type: "environmental/administrative event records"
      raw_fields: "anonymous item/lot; finished/sealed state; prior French placement; first French event and basis; declarant role; issuer/year; paid/free onward supply or own use; separate factory, filing and handoff dates; eligible count; measured net mass; external-pack exclusion; Qc"
      collection_method: "Reconcile documentary eligibility with existing traceable whole-article/lot measurement and independent first-supply/handoff evidence. No new handling or tests. Filing alone is insufficient."
      unit: "kg"
      frequency: "each event and closure"
      temporal_coverage: "original cohort first-placement period"
      site_scope: "declared anonymous custody perimeter and responsible-declarant population"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "applicable dated issuer/year; category/eligibility evidence; measured mass provenance; duplicate and declaration reconciliation"
    - protocol_id: cp_article_ledger
      process_id: "first_france_gate"
      flow_role: "receipts, stocks and dispositions"
      record_type: "anonymized stock/handoff records"
      raw_fields: "item/cohort; prior French placement; opening/closing count and mass; first external receipt; true-return original outward link; Q; pre-placement transfer; later dispatch; actual waste handoff; held sample; destination assignment; bundle coverage"
      collection_method: "Join adjacent ledgers using the System Boundary condition cards. Reconcile count and measured kg independently with actual crossings and gate dates. Carry opening stock without another production claim."
      unit: "kg"
      frequency: "each crossing/state event and closure"
      temporal_coverage: "period plus opening/closing stocks"
      site_scope: "identical explicit physical perimeter in both books"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "both stock equations; same-item return links; distinct factory/gate/filing/handoff evidence; unexplained differences retained"
    - protocol_id: cp_outer_box
      process_id: "first_france_gate"
      flow_role: "one actual outer-box pool"
      record_type: "external-pack environmental records"
      raw_fields: "actual box/type; measured empty-box mass or homogeneous measured-pack lot; opening/closing stock; purchase receipt; first non-purchase receipt with goods or borrowed/free; same-box genuine return; outward/waste handoff; supplier inclusion; remaining burden; consumed share"
      collection_method: "Reconcile one actual box type over the physical perimeter, distinguishing all external origins regardless of supplier inclusion. Use existing pack measurements. Every other actual pack type needs separate cards/ledger."
      unit: "kg"
      frequency: "each external crossing and closure"
      temporal_coverage: "cohort interval and actual box carryover"
      site_scope: "anonymous physical box pool, excluding outside stocks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "measured pack evidence; disjoint origins; supplier-coverage crosswalk; no repeated acquisition/turn charge; stock and burden closure"
    - protocol_id: cp_accounting_energy
      process_id: "first_france_gate"
      flow_role: "conditional actual electricity"
      record_type: "existing environmental meter/allocation records"
      raw_fields: "metered kWh; interval; attributable share; causal allocation; supplier overlap; eventual native flow/property/unit; unresolved coverage"
      collection_method: "Use existing attributable accounting-electricity totals, checking interval, allocation and supplier coverage. Retain kWh measurement independently of provider flow identity; no dedicated operation/equipment."
      unit: "kWh"
      frequency: "each reported interval and closure"
      temporal_coverage: "actual declared accounting-service interval"
      site_scope: "only evidenced services attributable to the cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "metered-total evidence; causal share; no overlap; separately qualified provider native property/unit"
    - protocol_id: cp_later_services
      process_id: "first_france_gate"
      flow_role: "external supplemental records only, excluded from current gate inventory"
      record_type: "old-cohort stock/service environmental records"
      raw_fields: "original cohort and first-placement period; original eligible count/net Qc; prior cumulative burden; A_V/R_V/D_V/W_V subtype and original return link; actual later interval; one service exchange per record, including electricity measured in kWh if present; actual native property/unit and compatible environmental provider; exclusive assignment; increment"
      collection_method: "Retain each old cohort independently. Record actual later electricity as a separate one-exchange supplemental interface, never as a new gate input; other real service exchanges need their own specific supplemental records. Missing positive original Qc permits raw service totals only, not an intensity."
      unit: "source exchange unit"
      frequency: "each actual later service/event"
      temporal_coverage: "later interval linked to the evidenced original first-placement period"
      site_scope: "same actual custody perimeter and exclusive original-cohort assignment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original positive Qc evidence; prior burden preserved; no repeated article production/reference output; independently qualified service/property/unit; no current-gate overlap"
    - protocol_id: cp_burden_ledger
      process_id: "first_france_gate"
      flow_role: "inherited and new inventory"
      record_type: "compatible whole-product/pack/service environmental bundles"
      raw_fields: "original item/cohort/exchange; reference amount/property/unit; opening remainder; externally brought remainder; genuinely new vector; current attribution; closing remainder; exclusive external/other assignment; overlap"
      collection_method: "Crosswalk every vector component to physical assignments without internal product detail. Missing supplier/carryover/service data stay unknown. Preserve historical source versus current observation distinction."
      unit: "source exchange unit"
      frequency: "every bundle/assignment and closure"
      temporal_coverage: "original cohort history and selected interval"
      site_scope: "same physical/cohort assignment crosswalk"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "componentwise conservation; provider compatibility; mass/energy support; one-time burden retirement; explicit missing coverage"
  calculation_rules:
    - id: cohort_reference_mass
      applies_to: "reference_product"
      rule: "Qc = sum of traceable net whole-article masses of distinct eligible first-French-placement articles in the original cohort. Counts cross-check the mass; count conversion needs documented homogeneous measured-lot evidence. Separately exclude external packs. Require positive Qc for an intensity."
      inputs:
        - cp_cohort
        - cp_article_ledger
      output: "original cohort net kg and eligible count"
      source_ids:
        - pyreo-market-2022
        - pyreo-market-2024
        - ec-pef-method
    - id: adjacent_article_stocks
      applies_to: "article movement condition cards"
      rule: "U0 + A_U + R_U = Q + U1 + X_U + W_U; V0 + Q + A_V + R_V = V1 + D_V + W_V. U is physically held not-yet-French-placed stock, V physically held already-French-placed stock; 0/1 are opening/closing. A_U is first external unplaced receipt, R_U genuine same-item unplaced return, X_U unplaced outward transfer, W_U unplaced actual waste handoff; A_V is first external already-French-placed receipt, R_V genuine same-item placed return, D_V actual subsequent outward dispatch/return/transfer and W_V placed actual waste handoff. Each entry retains its own original cohort, original count/net mass and exclusive receiving assignment. First external receipt and genuine return are disjoint. Only Qinside contributes to Qc; Qoutside is separate in the national bridge. Q cancels in the sum. Held/reclassified articles stay in closing stock."
      inputs:
        - cp_article_ledger
        - cp_cohort
      output: "closed counts and kg over one physical perimeter"
      source_ids:
        - french-producer-definition
        - ademe-pchim
    - id: box_physical_stock
      applies_to: "box movement condition cards"
      rule: "K0 + P + F + R = K1 + O + W independently for every actual pack type in measured kg and count. P purchased first receipt, F first non-purchased external receipt, R proven same-box return; O/W are exclusive actual outward destinations. Internal use/title change is no crossing."
      inputs:
        - cp_outer_box
      output: "box stock including all non-purchased origins"
      source_ids:
        - ec-pef-method
        - ademe-pchim
    - id: remaining_burden_balance
      applies_to: "all inventory rows"
      rule: "B0 + Bext_remaining + Bnew = Bcurrent + B1 + BX + Bother componentwise in the same exchange unit. B0/B1 are opening/closing remaining burden; Bext_remaining already-incurred external remainder; Bnew only genuinely new burden. Current, external and other attribution are mutually exclusive. A return brings only remaining original burden plus actual new services. Allocate real waste/loss consequences explicitly, never erase them."
      inputs:
        - cp_burden_ledger
        - cp_article_ledger
        - cp_outer_box
      output: "conserved inherited/new environmental inventory"
      source_ids:
        - ec-pef-method
    - id: mass_basis_inventory
      applies_to: "all inventory rows"
      rule: "Divide each separately attributable exchange numerator by original Qc in kg. Whole-period receipts, fees or physical turns cannot be divided by current placement without stock and burden attribution. Separate transfers, waste and closing stock; no automatic credit."
      inputs:
        - cp_cohort
        - cp_burden_ledger
      output: "exchange per 1 kg reference flow, separate other assignments"
      source_ids:
        - ec-pef-method
    - id: later_service_increment
      applies_to: "old-cohort services"
      rule: "At zero current Q, preserve the old cohort quantity and cumulative burden. If original Qc is evidenced and positive, separately report later-service increment divided by that original Qc. Combining compatible intervals preserves prior cumulative intensity and adds only this increment; never recreate original article input/reference output or upstream burden. Unlinked old stock cannot use a new-cohort denominator."
      inputs:
        - cp_cohort
        - cp_article_ledger
        - cp_later_services
        - cp_burden_ledger
      output: "separate old-cohort service intensity, or unavailable result"
      source_ids:
        - pyreo-committee-2023
        - ec-pef-method
    - id: statutory_population_bridge
      applies_to: "administrative declaration"
      rule: "Reconcile the selected onward-supply cohort to the broader applicable report through disjoint category/year/territory, direct-own-use, applicable-exclusion, correction and timing branches. Identify responsibility shifts to a sole-brand reseller without duplicating first national events. Separately reconcile Qinside from the evidenced custodian perimeter and disjoint Qoutside events. Filing corrections and collection totals create no physical movement or Q."
      inputs:
        - cp_cohort
      output: "declaration bridge, independent from physical stocks"
      source_ids:
        - french-producer-definition
        - ademe-pchim
  data_quality_requirements:
    - id: dq_non_operational
      applies_to: "all collection"
      requirement: "Existing sealed-product environmental/administrative records only; no composition, manufacture, performance, operating, equipment or use information."
      evidence: "anonymized records and coverage statement"
    - id: dq_first_national_event
      applies_to: "eligibility"
      requirement: "Bind applicable dated issuer/year, responsible declarant and first French event independently of factory release/filing. Missing dated legal/scheme confirmation is a qualification gap."
      evidence: "cp_cohort; independent first-supply and actual-handoff evidence"
    - id: dq_measurement
      applies_to: "articles and packs"
      requirement: "Match actual closed-whole-article and external-pack mass records to cohort/state. Disclose traceability, measurement basis and uncertainty without physical handling. National averages/catalogue weights/collection totals are not substitutes."
      evidence: "existing measured records and any homogeneous-lot sampling rationale"
    - id: dq_complete_interfaces
      applies_to: "stocks and burdens"
      requirement: "Close both article books, each actual pack book and each burden component. Additional actual packs/pallets/utilities/losses/services need individual supported rows; no data is not proof of absence."
      evidence: "cp_article_ledger; cp_outer_box; cp_burden_ledger; applicability evidence"
    - id: dq_supplier
      applies_to: "environmental bundle"
      requirement: "Verify actual product state, extensive property/unit, original-cohort applicability and precise pack/service coverage. Flow identity alone is not environmental inventory or supplier equivalence."
      evidence: "whole-product/pack/service environmental evidence and overlap crosswalk"
    - id: dq_statistics
      applies_to: "public statistics"
      requirement: "Keep market, collection and treatment populations/years separate, including 2022 expansion and removal of one-for-one attribution. Do not use annual ratios as original-cohort collection probabilities."
      evidence: "inspected PYReO accounting pages; no quantitative defaults adopted"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require positive original-cohort net mass, one unique reference output and all qualifiers. Invent no UUID, mass, factor or activity. Identity support and actual environmental-provider compatibility are separate checks."
    source_ids:
      - ec-pef-method
  - rule_id: validate_event_states
    applies_to: "cohort and stock books"
    rule: "Verify first French event separately from factory release, filing and dispatch. Close both article equations in count/kg with Q cancelling in the sum. Old external receipts/returns/shipments and held samples never create Q."
    source_ids:
      - french-producer-definition
      - ademe-pchim
  - rule_id: validate_packs
    applies_to: "actual pack interfaces"
    rule: "Check disjoint purchase, first non-purchase receipt and same-item return origins, actual outward/waste events and physical perimeter. Reconcile supplier coverage and remaining burdens once; any actual unrepresented pack type blocks completeness."
    source_ids:
      - ademe-pchim
      - ec-pef-method
  - rule_id: validate_burdens
    applies_to: "each item/cohort/exchange"
    rule: "Close the componentwise remaining-burden equation with no repeated manufacture, overlapping assignments, unsupported credits or zeroed unknown coverage. Opening goods, external already-placed goods and borrowed/free packaging keep their original assignments."
    source_ids:
      - ec-pef-method
  - rule_id: validate_zero_and_collection
    applies_to: "old cohorts and expired articles"
    rule: "Zero current placement does not erase old quantity/burden. Later-service intensity needs positive original mass and no new product output. Aggregate sold/collected totals cannot establish one-for-one collection, treatment probability or avoided-production credit."
    source_ids:
      - pyreo-market-2022
      - pyreo-market-2024
      - pyreo-committee-2023
  - rule_id: validate_completeness
    applies_to: "data package"
    rule: "Unknown identities, dated issuer/scheme applicability, actual mass, conditional exchanges or supplier/service inventory coverage stay explicit. Projection validity does not grant scientific approval or study qualification; missing evidence prevents a complete product-impact claim."
    source_ids:
      - ademe-pchim
      - ec-pef-method
published_dataset_profile:
  dataset_role: "secondary_dataset only after evidence and independent qualification; bounded first-national-placement environmental inventory, not manufacture/use guidance."
  downstream_use: "background_dataset only for a compatible sealed product, original cohort, national event and disclosed gate/coverage; separately identify later-service increments."
  allowed_use: "Supported environmental accounting at this first French gate, with actual original-cohort/service reconciliation and complete compatible supplier bundles."
  excluded_use: "Full-life-cycle/PEF conformity from this gate alone; rescue-function comparisons; manufacture, composition, activation, operating or use guidance; other product categories; production inferred from resale/filings/dispatch; collection/treatment attribution from aggregate ratios."
  required_metadata: "Anonymous cohort/product; national issuer/year and scope; declarant role; first French and separate other dates; original net kg; prior placement; physical perimeter; exact supplier/pack/service coverage; all qualifiers and exchange identities."
  required_quality_disclosure: "Actual local mass/stock/burden evidence and uncertainty; source/year/category limits; unresolved UUID/provider/coverage; conditional interfaces and exclusions; independent review/scientific/study state; no national average as local measurement."
  update_trigger: "Changed issuer/year or scheme population, first-supply evidence, placement-history correction, product/pack state or supplier coverage, additional actual exchange, later original-cohort services, or resolved identity/measurement evidence."
