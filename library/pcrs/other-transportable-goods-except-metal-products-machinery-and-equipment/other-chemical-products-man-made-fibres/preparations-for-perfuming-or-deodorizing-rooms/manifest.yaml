  scope_decision: "Narrow conventional nitrogen-pressure aerosol manufactured from water/ethanol/DPnP/purchased fragrance, printed tinplate can and PP actuator/cap. Physical pressure filling/retained gas and packaging method is the reason for this scope, not room versus body label. Same-batch35323 must be rechecked before integration; physically identical supported routes require conditional reuse or revision, not a duplicate accepted mapping."
  reference_gate: "Q is first newly quality-released net contents including retained nitrogen, excluding packaging tare. Q is not actual net deliveries. Released closing finished goods already belong to Q and are not another production output. Separate warehouse/dispatch raw/cohort ledger retains actual burdens and cancels internal receipt on consolidation. No repeat production from return/reacceptance."
  native_identity_limitations:
    - "Reference377fa3df generic Product/Mass, finished manufactured production mix at plant, no CAS/phase/grade/route/geography/locationOfSupply or recipe. Native Mass1 only. Conditional finished aerosol contents identity, no provider or service performance."
    - "Fragrance2fb8cc73 Product/Mass generic at plant purchased fragrance oil blend, no fixed composition, CAS, grade or geography; full mixture procurement and carrier subledgers required."
    - "Ethanol df7bb021 CAS64-17-5, production mix at plant, no specified route/grade/concentration/geography. Isolated class35499 debt retained; whole hydrous/denatured supplies require composition/provider reconciliation. Candidate not adopted for whole supplied ethanol solution; supplier composition/provider and full supply-state identity remain explicit auxiliary gaps."
    - "Water5b3acbab CAS7732-18-5, plant production mix, ion-exchange/RO pure substance name-route; comments mention distillation and consumer supply without geography or numeric standard. Restrict to matched actual purchased DI."
