    source_ids: []
  - rule_id: allocation_returns
    applies_to: "aerosol"
    rule: "Failed and zero-output runs, rework and returns retain their actual burdens. Internal recovery is not external co-production; reaccepting an already released lot creates no new Q. Waste recovery has no automatic avoided-product credit. Document any real co-product separately with its actual physical mass, fate and allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "aerosol"
      flow_role: "Complete commercial ingredients and nitrogen"
      record_type: "batch_material_records"
      raw_fields: "owner: material custodian; period; cohort; lot; supplier; all identity/route/grade/geography; supplied mass; assay basis; complete constituent fractions; gas pressure/temperature/composition; density source and conditions; opening/closing raw stores; issue/return; WIP burdens"
      collection_method: "Use calibrated weighing, receipt/charge records and supplier composition. Reconcile receipts, uncharged stores and actual issues as separate linked views, not additive purchases. Meter nitrogen mass independently of catalog coefficients and distinguish retained gas from purges. Whole formulations are one procurement; constituents are non-additive subledgers. Retain complete converted raw numerators and attributable opening/closing carried burdens without division. period_normalization alone divides once by Q; card formulas and aggregation_rule name the same final reporting operation. Q=0 retains the complete raw/burden pool without a normalized value."
      unit: "kg; mass fraction; m3 with actual gas conditions"
      frequency: "Every receipt/issue and batch"
      temporal_coverage: "Complete actual period with earlier/later carry links"
      site_scope: "Same physical route/site/SKU and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; receipts; certificates; full composition; stock reconciliation"
    - protocol_id: cp_packaging
      process_id: "aerosol"
      flow_role: "Each separately supplied packaging article"
      record_type: "packaging_records"
      raw_fields: "owner: packaging engineer; lot; bill of materials; pressure rating; whole article/tare mass; separately purchased items; rejects; opening/closing stock; supplier manufacture/printing/coating; compatibility test"
      collection_method: "Weigh representative actual articles with uncertainty and reconcile counts/masses, issues and scrap. Validate valve/can/actuator interfaces, retained contents and actual test rejection records. Include real extra labels, film, tape or pallets with separate exchanges. Retain complete converted raw numerators and attributable opening/closing carried burdens without division. period_normalization alone divides once by Q; card formulas and aggregation_rule name the same final reporting operation. Q=0 retains the complete raw/burden pool without a normalized value."
      unit: "kg; item count with measured mass conversion"
      frequency: "Each packaging lot and filling batch"
      temporal_coverage: "Complete actual period and stock-linked cohorts"
      site_scope: "Same physical route/site/SKU and cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare sampling; bills of materials; compatibility and pressure/test records"
    - protocol_id: cp_services
      process_id: "aerosol"
      flow_role: "Actual utilities cleaning testing handling storage"
      record_type: "meter_and_service_records"
      raw_fields: "owner: utilities engineer; meter interval; voltage/location/mix; compression service; water; actual heat/fuel/refrigerants; test/cleaning/lab/ventilation; shared drivers; failures; warehouse/dispatch cohort links; opening/closing carried burdens"
      collection_method: "Submeter complete operations including startup/idle/failure, air compression and actual hot-water testing if present. Record either purchased compressed-air service or onsite compression resources, never both for the same service. Add every actual thermal/fuel/lab input as a specific exchange rather than assuming the electric representative list is complete. Keep actual matching finished-cohort storage/dispatch burdens in a separate linked ledger. Retain complete converted raw numerators and attributable opening/closing carried burdens without division. period_normalization alone divides once by Q; card formulas and aggregation_rule name the same final reporting operation. Q=0 retains the complete raw/burden pool without a normalized value."
      unit: "kWh; kg; original service units"
      frequency: "Each meter interval/service event"
      temporal_coverage: "Full actual period including zero-output and warehouse cohort intervals"
      site_scope: "Same site and attributable actual product route/cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters; invoices; allocation reconciliation; warehouse/handling records"
    - protocol_id: cp_release
      process_id: "aerosol"
      flow_role: "Unique first production-quality release and inventories"
      record_type: "quality_release_and_mass_records"
      raw_fields: "owner: independent quality officer; period; formulation/container revision; lot/event genealogy; first-release decision; gross/tare/net contents and retained gas; rework/return; failed lots; opening/closing unreleased WIP; WIP carried burdens; separate released-finished stock/dispatch records"
      collection_method: "Weigh actual accepted filled articles and subtract matched actual packaging tare. Define Q solely as net contents newly first quality-released during the selected production period/cohort, positive and counted once. Old-stock dispatch, internal transfers, return/reinspection/reacceptance do not create Q. Reconcile production charges and opening unreleased WIP against Q, closing unreleased WIP and actual losses; released closing finished goods already belong to Q and are not added again. Warehouse ledger separately reconciles opening released stock plus receipt of Q against dispatch, closing stock and losses, with internal production receipt cancelled on consolidation; retain matching actual burdens. Retain complete converted raw numerators and attributable opening/closing carried burdens without division. period_normalization alone divides once by Q; card formulas and aggregation_rule name the same final reporting operation. Q=0 retains the complete raw/burden pool without a normalized value."
      unit: "kg"
      frequency: "Every release event and cut-off"
      temporal_coverage: "Whole actual period and linked opening/closing cohort history"
      site_scope: "Same actual SKU/container/route and declared release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Independent release certificate; calibrated gross/tare; failed/rework genealogy; WIP/warehouse reconciliation"
    - protocol_id: cp_losses
      process_id: "aerosol"
      flow_role: "Each physical waste and actual emitted species"
      record_type: "weighing_speciation_monitoring"
      raw_fields: "owner: environmental metrology officer; actual period/cohort; whole waste/tare/contents; recipient; composition; captured/released species; air/water subcompartment; integrated volume or rate/time; gas temperature/pressure/wet basis; concentrations; uncertainty/detection limits; opening/closing held wastes and carried burdens"
      collection_method: "Use weighing manifests and independently validated species-specific measurements, including failed/zero-output runs, filling leaks and actual test sprays. No generic VOC/fragrance bundle, COD or mass residual establishes actual species. Retain complete measured water and elemental balances separately from independently evidenced chemistry. Integrated volume is not multiplied by duration again; account intact waste can or its separated outlets once. Retain complete converted raw numerators and attributable opening/closing carried burdens without division. period_normalization alone divides once by Q; card formulas and aggregation_rule name the same final reporting operation. Q=0 retains the complete raw/burden pool without a normalized value."
      unit: "kg; m3 with conditions; species kg/m3; h only for rate integration"
      frequency: "Each waste movement and monitoring interval"
      temporal_coverage: "Full period including failed/testing/cleaning and carried burdens"
      site_scope: "Same physical site/product route/cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste manifest; selective assays; capture/vent monitoring; uncertainty; independent closure investigation"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Convert and attribute the complete raw-period numerator of each exchange; divide once by positive Q defined only by first production-quality release in cp_release. Carry opening WIP burdens in and documented closing unreleased WIP burdens out. Retain failures, zero-output runs, all rework/returns and matched actual testing, packaging, storage, handling/dispatch burdens. Q is not deliveries; closing released finished goods of Q are not another production output or another closing production-WIP subtraction. A separate warehouse ledger cancels internal handover on consolidation and retains matching burdens without renormalizing already normalized factors. Q=0 preserves the full raw/burden pool without a normalized result."
      inputs:
        - cp_material
        - cp_packaging
        - cp_services
        - cp_release
        - cp_losses
      output: "Exchange amount per 1 kg reference flow"
      source_ids: []
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Use calibrated mass or independently evidenced volume times density at matched composition and conditions; convert pieces using actual measured article mass. Integrate rate times actual duration only for rate records. An integrated gas/liquid volume receives concentration or justified density conversion, no extra time factor. No native factor1.25 or secondary coefficient is a measured density."
      inputs:
        - cp_material
        - cp_packaging
        - cp_services
        - cp_losses
      output: "Converted raw quantities before normalization"
      source_ids: []
    - id: mixture_subledger
      applies_to: "ethanol; fragrance; dpnp; nitrogen"
      rule: "Constituent mass equals complete supplied commercial input mass times its compatible independently assayed mass fraction. Carrier water, solvents and impurities reconcile within that input, not another purchase. Do not treat v/v as w/w. Retained nitrogen is part of net product contents; total gas charged also includes measured losses."
      inputs:
        - cp_material
        - cp_release
      output: "Non-additive constituent ledger"
      source_ids: []
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Maintain separate formulation/propellant, packaging and utility/ambient-air physical ledgers and independent elemental/water subledgers. Production charges plus opening unreleased WIP equal Q plus closing unreleased WIP, actual wastes/emissions and documented net transfers; net contents exclude packaging, so reconcile packaging to accepted-product tare and actual scrap separately. For an intact rejected filled can, only its separately measured contents enter the formulation/propellant ledger and its tare enters the packaging ledger; neither is added again beside the whole waste exchange. Internal recirculation cancels. Finished-stock warehouse balance is separate and must not add Q closing stock twice. Physical mixing/gas dissolution establishes no reaction yield or reaction water. Any actual chemistry or species/water formation/consumption needs independent evidence, never COD or fitting two unknown outlets to one residual."
      inputs:
        - cp_material
        - cp_packaging
        - cp_services
        - cp_release
        - cp_losses
      output: "Independent physical elemental water and species ledgers"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Retain complete native names, route/grade/form, geography and property/unit restrictions in actual dataset matching. Ordinary auxiliary UUID/provider gaps require later verified binding, not surrogate chemicals or zero burdens."
      evidence: "Full native records; supplier certificates; provider applicability"
    - id: period
      applies_to: "all inventory rows"
      requirement: "Complete matched periods and positive unique Q; trace failed batches, returns, opening/closing WIP and every carried burden. Distinguish first release from actual net delivery and do not discard real warehouse/dispatch burdens."
      evidence: "Cohort genealogy; full raw ledgers; warehouse reconciliation"
    - id: actual_product
      applies_to: "reference product"
      requirement: "Qualify actual formula, phase stability, can/valve compatibility, net contents and actual pressure/leak/release criteria using responsible laboratory/quality owners. Patent or equipment examples do not establish a real site recipe, certified safety or fragrance/disinfection function."
      evidence: "Actual validated tests; composition; container specifications"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_aerosol"
    rule: "Require the unique terminal Product output finished_aerosol to match reference UUID, Mass/kg and net contents at first quality release in both languages. An intermediate sharing a generic UUID remains visible and cannot be renamed or hidden to evade selection."
    source_ids: []
  - rule_id: validate_full_period
