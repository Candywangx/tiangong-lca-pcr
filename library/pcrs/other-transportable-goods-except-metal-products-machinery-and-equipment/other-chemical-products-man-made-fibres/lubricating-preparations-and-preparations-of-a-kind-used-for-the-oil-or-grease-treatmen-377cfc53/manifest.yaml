  semantic_scope:
    existing_material: "Petroleum-derived finished lubricating oils (CPC 33380) explicitly excludes non-petroleum preparations; no material antifreeze/coolant method found in live canonical manifests. This retained unpublished scaffold is narrowed in place, not duplicated."
    covered_route: "Purchase G140K SC whole formulation and compatible ethylene-oxide-hydration ethylene glycol; physically mix to inhibitor-containing concentrate, then dilute with deionised water to a declared final aqueous antifreeze; actual net dispatch gate."
    excluded: "Other lubricants, base oils/esters, standalone additives, hydraulic fluids, propylene-glycol/glycerol fluids, airport deicers, reclaimed glycol and onsite inhibitor chemistry; no claim to all 35430."
  native_identity_limits:
    - "Antifreeze generic identity is Product, at plant, dissolution/dilution/additive, Mass/kg; no CAS, no geography, no fixed grade. Comment usually 30–70% base liquid is descriptive, not a formulation or density. Native classification 34139 is a disclosed classification debt; a formulated aqueous antifreeze is not pure ethylene glycol."
    - "Ethylene glycol UUID is CAS 107-21-1, ethylene-origin ethylene-oxide hydration, production/industrial input mix at plant. Electrolyte solvent use is an application, not an exclusion of antifreeze feed. Route compatibility and supplier grade require actual records. Geography unspecified; no invented location."
    - "Deionised water UUID: CAS 7732-18-5, ion exchange or reverse osmosis, pure substance, production mix at plant; general comment also mentions distillation but selected named route remains IX/RO. Geography unspecified; natural-water classification does not establish treatment burdens."
    - "Electricity query candidate 50657322-939c-4829-a87b-47c093bfa6a7 has explicit CN supply, <1 kV, user-side consumption mix and grid-average route. Not adopted across an unspecified site. Electricity row remains UUID-unresolved until actual geography/voltage/provider compatibility is established."
    - "Manufacturer G140K SC source is Asia-Pacific only. July 2023 G140K and December 2023 G40 typical property tables differ; current batch specifications and confirmation of the paired concentrate recipe are required. These are one manufacturer, not independent confirmation. No supplier yield, environmental inventory or service-life default is established."
