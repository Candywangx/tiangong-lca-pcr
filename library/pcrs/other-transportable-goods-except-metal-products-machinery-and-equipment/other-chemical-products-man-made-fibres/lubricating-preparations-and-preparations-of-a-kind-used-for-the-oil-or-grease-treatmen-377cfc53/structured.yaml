allocation_rules:
  - rule_id: allocation_trace
    applies_to: "all inventory rows"
    rule: "Prefer batch/tank and same-formulation tracing with measured equipment use; allocate shared utilities/storage by metered causal drivers and reconcile site totals. Retain failed and zero-output run burdens in the actual route/period, rather than selecting only positive-output batches."
    source_ids: []
  - rule_id: allocation_internal
    applies_to: "cohorts and returns"
    rule: "Internal concentrate, WIP, rework and finished-warehouse handovers are not coproducts. Cancel internal loops without repurchase or new production. Actual external returns retain unique identity, original carried burdens and additional rework burdens without duplicating denominator or old burdens."
    source_ids: []
  - rule_id: allocation_no_credit
    applies_to: "rejects and other products"
    rule: "Wastes/losses are neither accepted delivery nor burden credits. A genuine saleable coproduct needs separate physical-identity and causal-allocation evidence; until established, do not claim this single-product method covers that joint route."
    source_ids: []
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_gate
      process_id: "mix_dilute_dispatch"
      flow_role: "delivered_antifreeze"
      record_type: "dispatch_and_inventory"
      raw_fields: "owner: logistics and QA; batch/formulation revision/concentration; unique first release P; net delivery Q; packaging tare; external returns and original invoices; opening/closing raw/WIP/finished masses and exchange-by-exchange carried burdens; internal transfers/rejects"
      collection_method: "Logistics/QA owners collect undivided masses and carried inventory burdens from calibrated net weighing, dispatch and acceptance records; reconcile production/warehouse/delivery by batch. Q counts net first accepted external deliveries, reversing a return against its original invoice and linking redelivery; onsite reacceptance creates no new production. Do not calculate A/Q during collection. Aggregation explanation:  normalize_once owns the single reporting operation; this protocol retains undivided numerators and complete carry ledgers."
      unit: "kg"
      frequency: "Each batch and period boundary"
      temporal_coverage: "Declared actual start/end, including failed, zero-output and rework"
      site_scope: "One site/route/final-formulation cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, opening-burden provenance, unique batch/return chain, signed ledgers and cancelled warehouse handovers"
    - protocol_id: cp_materials
      process_id: "mix_dilute_dispatch"
      flow_role: "inhibitor_superconcentrate; ethylene_glycol; dilution_water; cleaning_water"
      record_type: "batch_supply_and_composition"
      raw_fields: "owner: production and laboratory; each whole commercial supply wet mass/lot/provider/route/revision; issues/returns; assay/water/active composition; density/temperature/integrated volume or rate-duration; concentrate-intermediate and final-liquid samples; opening/closing raw/WIP masses and carried burdens"
      collection_method: "Production/laboratory owners weigh each supply or convert using that material’s measured temperature/density; reconcile whole purchased formulations with composition subledgers, concentrate top/bottom homogeneity and final dilution state. Retain all actual-period raw records, failed charges, cleaning/rework and opening/closing inventory carry without collection-side normalization. Aggregation explanation:  normalize_once owns the single reporting operation; this protocol retains undivided numerators and complete carry ledgers."
      unit: "kg; L; kg/L; degC"
      frequency: "Each batch and period boundary"
      temporal_coverage: "Declared actual start/end, including failed, zero-output and rework"
      site_scope: "One site/route/final-formulation cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier CoA/traceable confidential composition, route evidence, scale calibration, water-quality and species analysis"
    - protocol_id: cp_utilities
      process_id: "mix_dilute_dispatch"
      flow_role: "electricity; steam; diesel"
      record_type: "meter_and_duty"
      raw_fields: "owner: utilities engineer; electricity start/end/voltage/supply region; steam mass/supply-return enthalpy/condensate; diesel mass/equipment duty; rate-duration or integrated amount; shared allocation drivers; carried utility burdens in inventories"
      collection_method: "Utility owner collects undivided full-period readings including failed/start-stop/rework, actual storage/packaging/handling/loading and cleaning; allocate by equipment causal drivers and reconcile totals. Do not multiply integrated volume/energy by duration or divide by Q during collection. Aggregation explanation:  normalize_once owns the single reporting operation; this protocol retains undivided numerators and complete carry ledgers."
      unit: "kWh; MJ; kg"
      frequency: "Each batch and period boundary"
      temporal_coverage: "Declared actual start/end, including failed, zero-output and rework"
      site_scope: "One site/route/final-formulation cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, energy invoices/region-voltage, duty allocation and site reconciliation"
    - protocol_id: cp_packaging
      process_id: "mix_dilute_dispatch"
      flow_role: "hdpe_drum; hdpe_closure; paper_label; wood_pallet"
      record_type: "packaging_and_handling"
      raw_fields: "owner: packaging supervisor; each component receipts/issues/returns/scrap/net tare; reusable-asset allocation evidence; packaged production and actual delivery; opening/closing finished and packaging inventories with carried burdens"
      collection_method: "Packaging owner weighs each actual component and links to delivery, retaining packaging/handling rework and packaged/unpackaged stock states and burdens. Document bulk absence of drums; add each observed unlisted component. Retain raw amounts without normalization. Aggregation explanation:  normalize_once owns the single reporting operation; this protocol retains undivided numerators and complete carry ledgers."
      unit: "kg"
      frequency: "Each batch and period boundary"
      temporal_coverage: "Declared actual start/end, including failed, zero-output and rework"
      site_scope: "One site/route/final-formulation cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Component weights, material reconciliation, measured reuse, packaging-state and stock evidence"
    - protocol_id: cp_residuals
      process_id: "mix_dilute_dispatch"
      flow_role: "offspec_liquid; glycol_wastewater; empty_hdpe_container; ethylene_glycol_air; water_air"
      record_type: "waste_and_species"
      raw_fields: "owner: environmental engineer and laboratory; each waste wet mass/composition/destination/water; container residual; glycol air compartment and species mass/rate-duration; independently measured evaporated water; raw/WIP/finished and elemental ledgers; detection limits/uncertainty"
      collection_method: "Environmental/laboratory owners measure wastes and actual species releases separately, retaining whole wet masses and composition subledgers; reconcile total mass and water/glycol/inhibitor elements over complete period and inventories. COD or residual closure cannot solve both unknown reaction water and an unknown outlet; non-detection is not zero. Collect undivided raw amounts only. Aggregation explanation:  normalize_once owns the single reporting operation; this protocol retains undivided numerators and complete carry ledgers."
      unit: "kg"
      frequency: "Each batch and period boundary"
      temporal_coverage: "Declared actual start/end, including failed, zero-output and rework"
      site_scope: "One site/route/final-formulation cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Treatment manifests, species/water analyses, methods/detection limits, independent conservation and uncertainty"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw record to its physical native unit first; liquid m = V × rho(T, composition); use integrated amounts directly and multiply only rates by corresponding duration. Composition m_k = m_supply × w_k is an internal check, not extra procurement. Steam process heat uses mass and supply/return enthalpy difference."
      inputs:
        - raw_records
        - density_at_temperature
        - assay
        - cp_materials
        - cp_utilities
        - cp_residuals
      output: "converted_raw"
      source_ids:
        - basf-g140k-sc-2023
        - basf-g40-2023
    - id: cohort_delivery
      applies_to: "delivered_antifreeze"
      rule: "By batch, net delivery Q sums unique first accepted external delivery masses, reverses returns against original invoices and tracks redelivery. For returns of historical deliveries, explicitly align cohort boundary and burden reversal without duplication. Require Q > 0. Opening finished + first release P + external returns = outbound shipments + closing finished + warehouse rejects + returns to processing; cancel internal handovers on aggregation. Never presume P = Q."
      inputs:
        - cp_gate
        - opening_finished
        - first_release
        - external_returns
        - closing_finished
        - rejects
        - internal_returns
      output: "Q"
      source_ids: []
    - id: carry_burdens
      applies_to: "all inventory rows"
      rule: "For each exchange component form undivided attributable numerator A_i = actual-period external input/operation burdens + opening raw/WIP/finished carried burdens + evidenced net external-return carry - burdens retained in closing raw/WIP/finished stock. Inventories retain actual composition/state/packaging and burden provenance; keep conservation separate from burden accounting. Retain whole-period failed/zero-output/rework losses and waste-treatment burdens without avoided-product credits. Include actual storage, packaging, handling/loading by stage; cancel internal handovers once."
      inputs:
        - converted_raw
        - cp_gate
        - cp_materials
        - cp_utilities
        - cp_packaging
        - cp_residuals
        - opening_carry
        - closing_carry
        - return_carry
      output: "A_i"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q, reported once after all raw conversions, period attribution and inventory carry; each a_i is an exchange per 1 kg net delivered reference flow. Terminal delivery gives Q/Q = 1 kg. Flow-card amount formulas and protocol aggregation_rule point to this same reporting operation, not sequential further division. Do not report a normalized dataset when Q is nonpositive or carry attribution is unresolved."
      inputs:
        - A_i
        - Q
        - cp_gate
      output: "a_i"
      source_ids: []
    - id: physical_closure
      applies_to: "formulation and residuals"
      rule: "Across the complete physical boundary, opening total mass + actual external receipts = actual outbound mass + closing total mass + independently measured wastes/releases; keep product, packaging and energy physical ledgers separate and cancel internal transfers. Independently check water, glycol and known inhibitor elements using actual analyses and uncertainty. Physical mixing creates no inherent reaction water; a real reaction needs actual-species and independent extent evidence and route reassessment, never residual-fitted water or loss."
      inputs:
        - cp_materials
        - cp_gate
        - cp_residuals
        - species_assays
        - uncertainty
      output: "mass_and_species_reconciliation"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: quality_recipe
      applies_to: "reference and materials"
      requirement: "Align formulation, supplied wet state, water/active bases, supply region and native route; record superconcentrate, concentrate and final liquid separately. A manufacturer example proves no actual site production or OEM approval."
      evidence: "cp_materials; supplier specification; basf-g140k-sc-2023; basf-g40-2023"
    - id: quality_revisions
      applies_to: "supplier properties"
      requirement: "G140K 2023-07 and G40 2023-12 typical density/water tables differ; retain each material/revision context, not merged constraints or maxima as actual contents. Actual batch CoA and temperature/density govern; no universal final-solution density is supplied."
      evidence: "batch CoA; temperature-density measurements; basf-g140k-sc-2023; basf-g40-2023"
    - id: quality_complete
      applies_to: "all inventory rows"
      requirement: "Declare complete actual period/cohort, failed/zero-output/returns/rework, opening/closing raw/WIP/finished stock and per-exchange carry, detection limits and uncertainty; missing data are not zero."
      evidence: "cp_gate; cp_materials; cp_utilities; cp_packaging; cp_residuals"
    - id: quality_native
      applies_to: "UUID-bearing rows"
      requirement: "All native name components, route, CAS, medium and properties establish identity only. Antifreeze has unspecified geography and 34139 classification proves neither pure alcohol nor accepted 35430 mapping; generic typical base-liquid proportion fixes no recipe. Water identity supplies no quality certification; verify actual glycol supplier route."
      evidence: "native identity audit; cp_materials"
validation_rules:
  - rule_id: validate_reference
    applies_to: "delivered_antifreeze"
    rule: "The unique reference_flow_link selects the terminal Product output with the declared UUID; require every qualifier and the same net wet-liquid delivery basis excluding packaging. Concentrate intermediates cannot replace the terminal."
    source_ids: []
  - rule_id: validate_ledger
    applies_to: "all inventory rows"
    rule: "Every card is atomic and links to an owned protocol. Trace raw period and inventory carry; normalize once only; require Q > 0 and consistent release/delivery, stocks, returns and burden ledgers; never fill unknowns as zero."
    source_ids: []
  - rule_id: validate_chemistry
    applies_to: "physical_closure"
    rule: "Conserve complete physical mass separately from actual constituents/elements. Pure mixing has no inherent reaction water; COD or the same residual cannot fit reaction water and an unknown outlet. A species-evidence gap limits a concrete dataset; fictitious reaction water cannot close it."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "reference and external inputs"
    rule: "CAS, classification label, a source application or generic UUID establishes neither a whole formulation nor efficacy, maintenance, lifetime or supplier burdens. Preserve actual revision, region, state, route, grade and provider limits; resolve true contradictions and disclose ordinary auxiliary UUID gaps."
    source_ids:
      - basf-g140k-sc-2023
      - basf-g40-2023
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Declared actual-site foreground mixing/dilution/delivery dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product-mass modelling for matched formulation/concentration/route/delivery gate with all applicability conditions"
  excluded_use: "All-35430 coverage; neat-glycol/petroleum-oil substitution for formulation; default life/efficacy/service counts; use-service comparisons; unsupported certification"
  required_metadata: "Every reference qualifier; raw/WIP/finished ledgers and carry; actual boundary and protocol owners; specification revisions and evidence"
  required_quality_disclosure: "Measured/allocated/missing data, detection limits, uncertainty, UUID/provider gaps, native classification/geography limits and common manufacturer source"
  update_trigger: "Reassess changes in formulation/feed grade/route/concentration/provider/gate/geography/carry or measurement method"
data_sources:
  - id: "basf-g140k-sc-2023"
    type: "literature"
    reference: "BASF, GLYSANTIN G140K SC, July 2023, D/EVO 3080 e, pp. 1–2. https://promo.basf.com/campaign/tasa/fichas-tecnicas/Glysantin%C2%AE%20G140K%20SC%20-%20Engine%20Coolant%20Super%20Concentrate%20-%20TI_BMB%20updated.pdf"
    used_for: "Manufacturer-specific Asia-Pacific superconcentrate mixing route, mass recipe and homogeneity check; typical tables are not actual batch specifications. Supports the stated material/revision, not a plant input factor."
  - id: "basf-g40-2023"
    type: "literature"
    reference: "BASF, GLYSANTIN G40, December 2023, pp. 1–4. https://promo.basf.com/campaign/tasa/fichas-tecnicas/Glysantin%C2%AE%20G40%C2%AE%20-%20Engine%20Coolant%20Concentrate%20-%20TI_12-2023.pdf"
    used_for: "Concentrate/aqueous states, dilution basis and water-quality guidance; same manufacturer technical originals, not independent environmental-inventory or performance verification. Concentrate density is not final-dilution density."
  - id: "unsd-cpc-3-0"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Structure, 30 June 2025, subclass 35430. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "35430 antifreeze preparation classification scope and distinction from petroleum oils only; establishes neither all-class coverage, correct native UUID classification nor accepted mapping."
