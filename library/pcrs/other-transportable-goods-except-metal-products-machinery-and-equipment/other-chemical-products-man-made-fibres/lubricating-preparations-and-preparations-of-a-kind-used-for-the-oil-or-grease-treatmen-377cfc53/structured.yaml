measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use actual net delivery Q from cp_gate as the sole denominator, excluding packaging and undelivered finished stock. Release P is not Q; returned product reacceptance creates no new production."
  - id: wet_active_basis
    applies_to: "formulation inputs and output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Separate whole supplied wet mass from glycol, inhibitor actives, water and other composition subledgers; dry, active, concentrate and final aqueous bases are not interchangeable."
  - id: volume_temperature
    applies_to: "liquid records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "m = V × rho(T, actual composition). An integrated volume receives no time factor; integrate only a volume rate. Use each liquid’s actual batch state and temperature-specific density; neither neat-glycol density for formulations nor secondary property factors establish density. Volume ratios are not mass ratios and volume additivity is not assumed."
  - id: energy_preservation
    applies_to: "utilities"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh; MJ"
    rule: "Preserve measured energy units; 1 kWh = 3.6 MJ is only an explicit unit conversion. Steam heat uses mass and supply/return enthalpy difference, with mass and energy in separate ledgers."
  - id: manufacturer_dilution
    applies_to: "final aqueous formulation"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For this G40 route restrict final preparation to the manufacturer-described 33–60 vol% concentrate, recording the actual supplier preparation definition; the illustrative 50/50 volume ratio is neither a mass ratio nor a default input factor. Convert the component additions using concentrate/water densities at their measured temperature and measure final-liquid state; do not assume additive mixed volume. Water must satisfy applicable batch specifications, checking manufacturer guidance of hardness 0–3.6 mmol/L and chloride and sulfate each no more than 100 ppm. Actual use-temperature/freeze performance requires separate acceptance evidence, not typical datasheet values. See basf-g40-2023."
