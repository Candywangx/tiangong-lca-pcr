system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "opaque_coverage: The selected whole-product dataset owns all utilities, packaging and waste already included. No factory burden may be added again. A separately reported ordinary exchange requires a precise signed upstream exclusion, actual environmental records and independent same-cohort attribution. If that cannot be established, flag the missing coverage and do not fill it with an impact indicator. Sources: nepd-4019-environmental; nepd-9418-environmental."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "event_bridge: Bridge the A1–A3 declaration gate to first market placement explicitly. A4/A5 declarations do not automatically belong to this event. Only actual documented ordinary additions attributable to this cohort within its declared environmental boundary are eligible; unrelated later packaging or transport is excluded. Disclose timing differences between the first-market event and the covered environmental burdens. No transport method is specified. Source: npcr-product-stage-2021."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "packaging_bridge: Use documentary definitions to distinguish the complete sealed article from each separable ordinary external package. Do not treat an integral product part as removable packaging or infer internal fractions. For applicable periods use eu-packaging-2025; earlier periods use then-applicable definitions. Statistical net kg and environmental declaration kg must be reconciled individually."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "market_eligibility: The already manufactured individual article must be supplied for distribution, consumption or use on the Union market. An invoice, payment, ownership, possession or statistical record within the Union alone does not prove that purpose or first placement. The eligible event can precede, coincide with or follow physical handover; record the separate dates. Sources: eu-first-market-2014, eu-blue-guide-2022."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "custody_perimeter: Declare an anonymous physical custody accounting perimeter and the period actually covered by the environmental inventory, separately from the market-event ledger. A first-market event outside this perimeter creates no fictitious receipt or dispatch in the declarant's physical stock records. Reconcile the event cohort to actual custody records only where applicable and show unmatched ownership and custody states explicitly."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "burden_mass_distinction: Net-article mass and environmental burden coverage are different boundaries. Excluding external packaging mass from the denominator does not remove its real product-delivery burden already included in the opaque inventory. Preserve that covered burden once; remove only evidenced duplicates. Distinguish first-seal original packaging from separable external packaging using nontechnical documentation, without inspecting product construction. Keep later recorded burdens attributable to the original cohort in a separate timing ledger; include only evidenced original-cohort obligations within the declared environmental boundary, updating that same cohort once rather than creating a second first-market event. Unknown later shares remain explicit study gaps."
      source_ids: []
