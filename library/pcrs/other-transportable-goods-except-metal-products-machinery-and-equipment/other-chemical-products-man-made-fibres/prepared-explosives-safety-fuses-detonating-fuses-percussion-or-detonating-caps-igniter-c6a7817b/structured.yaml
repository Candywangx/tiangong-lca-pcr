allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "attribution_first: Directly attribute supported ordinary additions before allocating residual shared quantities. Require the original site/period accounting evidence, eligible products and matching denominators. Site totals alone do not establish the share for this first-market cohort."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "shared_mass_case: Mass allocation observed in nepd-4019-environmental is case evidence, not a universal default. If adopted, justify that common burden follows matched net whole-product output, reconcile allocated totals and test justified alternative attribution. Keep nepd-9418-environmental independent; do not transfer shares, site conditions or years. Keep verified upstream allocation sealed rather than reallocating it here."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "stock_periods: Keep original manufacturing burdens attached to the relevant articles across periods. Reconcile opening stock, additions, first-market placements, closing stock, returns and later movements without assigning a second upstream burden to the same article. Work in progress and failed output cannot enter the first-market mass denominator; document their environmental burden ownership. Let Q be current-period eligible first-market net kg. Q = 0 yields no new-cohort per-kg result. A separately evidenced positive original-cohort denominator Qc may support a later attributable ordinary-exchange supplement: divide only that incremental or corrected exchange by original Qc, never by Q and never repeat original product or upstream inventory. If Qc is unproven, retain the exchange total in its original unit as unresolved; do not discard it or invent a normalized result."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cohort
      process_id: "first_market"
      flow_role: "whole-product cohort"
      record_type: "administrative_records"
      raw_fields: "nontechnical article/lot identity; Union distribution/consumption/use purpose; actual custody perimeter and dates; event/handover timing bridge; completion and original-seal attestation; first Union provision evidence/date; unique event key; net article kg; external packaging kg/basis; opening/closing stocks; returns; later movements"
      collection_method: "Use existing signed nontechnical records; link each completed article once to the first-market event and its recorded net mass. Bridge any trade statistics explicitly; no customs event is required. Never unpack or perform tests."
      unit: "kg"
      frequency: "each event; period reconciliation"
      temporal_coverage: "declared study period"
      site_scope: "same cohort and responsible accounting entity"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "document provenance; mass basis; unique-event reconciliation; estimate/rounding uncertainty"
    - protocol_id: cp_coverage
      process_id: "first_market"
      flow_role: "opaque inventory coverage"
      record_type: "environmental_records"
      raw_fields: "signed LCI identity/hash; source product/period; unit/gate; included utilities/packaging/waste; exclusions; conversion bridge; completeness; attribution evidence"
      collection_method: "Inspect only non-operational signed environmental scope and whole-product exchange evidence; reconcile A1–A3 ownership and exact event additions. Never reconstruct hidden inputs from impact scores."
      unit: "kg; native exchange units"
      frequency: "each source revision and cohort"
      temporal_coverage: "matched source and study periods"
      site_scope: "documented source environmental system"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed source, coverage ledger, no duplicate burdens"
    - protocol_id: cp_additions
      process_id: "first_market"
      flow_role: "ordinary external additions"
      record_type: "environmental_records"
      raw_fields: "specific exchange; physical movement evidence; existing coverage status; incremental burden evidence; native amount/unit; period; current Q; original cohort key and positive Qc evidence; revision version and prior reported amount; attribution; exact upstream exclusion; package basis; eligible cohort; shared total; allocation evidence; uncertainty"
      collection_method: "Use existing ordinary packaging/utility environmental records only; verify actual additions and reconcile direct or justified shared attribution with the same cohort. Unassignable amounts remain a disclosed gap."
      unit: "kg; kWh as appropriate to each atomic row"
      frequency: "each accounting period and event linkage"
      temporal_coverage: "same cohort period or documented carry-over"
      site_scope: "declared ordinary environmental account"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; exclusion proof; total reconciliation; sensitivity"
  calculation_rules:
    - id: cohort_denominator
      applies_to: "first_market_product"
      rule: "Sum documentary net whole-article kg for the unique eligible first-market cohort; exclude repeated events and noneligible stock. Do not subtract internal product fractions."
      inputs:
        - cp_cohort
      output: "eligible net kg"
      source_ids:
        - eu-first-market-2014
        - eu-blue-guide-2022
        - eurostat-net-mass
    - id: normalise_ordinary
      applies_to: "outer_carton; event_electricity; carton_waste"
      rule: "Divide each independently attributable ordinary exchange total by eligible net kg, retaining its native numerator unit. Same cohort and coverage ledger required; no eligible net kg means no new-cohort normalized result; a documented original-cohort supplement follows original_cohort_revision."
      inputs:
        - cp_cohort
        - cp_additions
        - cp_coverage
      output: "exchange per 1 kg reference flow"
      source_ids:
        - eurostat-net-mass
        - nepd-4019-environmental
        - nepd-9418-environmental
    - id: opaque_bridge
      applies_to: "sealed_product_input"
      rule: "Use the signed whole-product inventory on its reconciled net-article basis once. Document any source-unit conversion without inferring hidden product contents; an unresolved bridge blocks a complete result."
      inputs:
        - cp_coverage
        - cp_cohort
      output: "one covered whole-product input per reference flow"
      source_ids:
        - npcr-product-stage-2021
    - id: original_cohort_revision
      applies_to: "outer_carton; event_electricity; carton_waste"
      rule: "When current Q = 0 and original Qc > 0 is evidenced, report only the attributable incremental/corrected ordinary exchange total divided by Qc, in its native numerator unit per original-cohort kg. Do not emit another whole-product input/output or repeat upstream inventory. Record replacement-versus-delta semantics and original account version so a correction replaces the previous amount once. Without proven Qc, preserve the native-unit total separately as unresolved."
      inputs:
        - cp_cohort
        - cp_additions
        - cp_coverage
      output: "original-cohort supplement or unnormalised unresolved total"
      source_ids:
        - eu-blue-guide-2022
        - nepd-4019-environmental
        - nepd-9418-environmental
  data_quality_requirements:
    - id: first_event
      applies_to: "cp_cohort"
      requirement: "Separate method eligibility from study qualification: a study must prove its completed sealed product identity, unique first Union event and packaging-excluding mass. Public enterprise transactions are not required to establish the method."
      evidence: "eu-first-market-2014; eu-blue-guide-2022"
    - id: basis_conflicts
      applies_to: "cp_cohort"
      requirement: "Never merge trade net kg, production sold-volume kg or EPD kg without a matched bridge. Some production statistics include normal retail packaging; declarations may have different units. Do not assume every market event has a trade record."
      evidence: "eurostat-net-mass; eurostat-manual-2026; cp_cohort"
    - id: coverage_quality
      applies_to: "cp_coverage; cp_additions"
      requirement: "Keep declarations, sites and years separate; quantify data uncertainty from actual records. Missing signed exchange coverage, unassignable shares and unverified identities remain explicit study gaps. No generic zero, factor or impact-to-inventory substitution is permitted."
      evidence: "nepd-4019-environmental; nepd-9418-environmental"
