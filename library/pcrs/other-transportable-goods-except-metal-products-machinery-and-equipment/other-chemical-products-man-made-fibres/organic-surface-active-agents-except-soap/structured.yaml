system_boundary:
  rules:
    - rule_id: boundary_units
      applies_to: "sds"
      rule: "Include receipt/storage, SO3 vaporization, air treatment, film sulfation/cooling, prompt neutralization, vacuum/film drying, actual powder finishing, testing, packing, finished storage and factory loading; retain start-up/shutdown, failed runs, rework, cleaning and controls."
      source_ids:
        - chemithon-sulfation-1997
    - rule_id: boundary_interfaces
      applies_to: "sds"
      rule: "Retain real upstream chemical and steam backgrounds. Model external inbound/outbound transport at declared interfaces separately; process simplification never removes actually included burdens. Downstream formulation, dilution and washing services need separate data."
      source_ids:
        - chemithon-sulfation-1997
    - rule_id: boundary_stocks
      applies_to: "sds"
      rule: "The production ledger retains opening raw material/WIP, real material issues/returns, new release P, closing raw material/WIP and every real waste/species outlet, cancelling internal transfers. FG physical ledger: opening FG/rework WIP + P + measured gross physical returns R + other actual inward transfers + actual added materials/water = disjoint closing FG/rework WIP + measured gross physical dispatch G + other real outward transfers/returns + actual rejects, effluents and species outlets. Independently measure each handover mass, composition and moisture; real rework need not be isomass. Each addition/removal has an atomic row before data use. Cancel P on consolidation. gross_physical_dispatch and physical_return are non-additive custody views of G and R, not new production/purchase/background or quantities added to delivered_powder Q. Q remains unique net delivered accepted powder at the declared reference state; reverse the ORIGINAL accepted delivery quantity D_rev, not blindly the current returned mass R. Only proven matching state, acceptance, cohort and timing permit Q=G-D_rev; only separately proven unchanged mass/state permits D_rev=R. Rework or outside moisture change requires measured physical bridge terms, not renaming R as D_rev. Late returns correct their original delivery/report or an explicit separate adjustment, never an unrelated current Q. Trace reshipment once without creating new production or imposing first release P as denominator."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "sds"
      rule: "For each complete drum or liner separately: opening empty + attached-to-WIP/FG + reusable stocks + actual new external acquisitions + actual external returns received = disjoint corresponding closing stocks + packages accompanying gross physical dispatch + separate external returns sent + actual waste. Measure full physical quantities; net powder Q, economic attribution and reuse cycles never shrink gross packaging movement. Internal reuse is not another purchase or credit. Returned packages incur new manufacture only for a real new acquisition; retain existing history and actual cleaning separately without duplication, checking supplier-included production once. Packaging is neither powder composition nor net powder delivery, and empty/attached/reusable states must not overlap."
      source_ids: []
    - rule_id: boundary_nonwip
      applies_to: "sds"
      rule: "Keep raw materials, WIP/FG, cooling-loop water, steam/condensate, heat-transfer fluids, oil/refrigerant charges and actual abatement consumables in separate physical opening/closing quantity, composition/state and per-exchange inherited-vector accounts; equipment hold-up is not WIP again. Instantiate specific substance accounts only when present. Declare whether raw records are receipts, actual issues or consumption already corrected for stocks; never add opening minus closing again to an already corrected consumption record. For an uncorrected ledger, derive real attribution released/carried from independent stock genealogy and include it in B_i once; installed charge and internal circulation are not new period consumption. Missing history remains a quantitative-package gap, not zero. Reconcile gross steam received, external condensate return, leakage and each water loop independently; charge thermal-service upstream burden once under the provider convention."
      source_ids: []
    - rule_id: boundary_air_steam
      applies_to: "sds"
      rule: "Steam-water supply and external condensate return are distinct gross Mass exchanges. steam_heat is the single owner of the matched upstream supplier water/energy convention; their physical cards do not add repeated boiler/treatment backgrounds or automatic return credit. Record real grade, T/P/phase/enthalpy, stock changes, flash/leaks and each receiver, never assume supply=return. Ambient air has no extra additive bulk exchange: measure the aggregate only as a non-additive raw check and record each actual N2/O2/Ar/atmospheric CO2/H2O Resource input and each real gaseous outlet separately. No fixed air recipe, purchased compressed-air default or fossil/biogenic attribution. Actual different supplies, droplet/aerosol/condensate phases and receivers require their own atomic rows before data use."
      source_ids:
        - chemithon-sulfation-1997
