    used_for: "Figures18/29 identify carrier-air and steam/condensate physical interfaces, not measured air composition, steam grade, return amount or a supplier credit. Unit principles for C12 sulfation diagram, liquid-SO3 supply, acid/NaOH neutralization, drying and formulation boundary. Historical equipment guidance also covers other chemistries/ether sulfates; no recipe, conditions, active/moisture, yield or energy example is a general default. Reaction-water stoichiometry is derived for the shown acid reacting with NaOH; actual quantity still requires independent evidence."
