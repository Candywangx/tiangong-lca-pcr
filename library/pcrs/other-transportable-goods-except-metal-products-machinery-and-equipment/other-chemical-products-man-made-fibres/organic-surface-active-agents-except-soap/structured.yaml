allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "sds"
    rule: "First subdivide by actual cohort and unit meters; retain shared-unit start-up and failed burdens. Use evidenced causal drivers such as runtime/throughput for shared services, disclosing driver, values and uncertainty; no default sales-value allocation."
    source_ids: []
  - rule_id: allocation_recycle
    applies_to: "sds"
    rule: "No co-product is presumed. Internal acid/paste/powder/condensate recycling and handover P create no extra purchase, production or credit. An actually saleable by-product requires proven quality/function and independent export plus allocation review; wastewater, sludge and salt impurities are not automatically co-products."
    source_ids:
      - chemithon-sulfation-1997
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "sds"
      flow_role: "chemical and water supply"
      record_type: "purchase charge and assay records"
      raw_fields: "lot_id; supply_mass; charge_mass; water_fraction; assay; CAS; alkyl_EO_profile; grade; raw_unit; temperature; density_evidence; opening_closing_feed_stock; supplier_basis"
      collection_method: "owner=receiving and production material custodian; match invoices, calibrated weighing/tank meters, charges, supplier CoA and actual assays for the whole wet supply; retain raw mass/volume and unnormalized carried burdens, without duplicate receipt-plus-charge procurement."
      unit: "kg; m3; mass fraction; degC"
      frequency: "each lot and continuous meter records"
      temporal_coverage: "complete actual reporting period including failed and zero-output runs"
      site_scope: "actual same site, product, route and supply state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, CoA, weigh tickets, stock and supplier originals"
    - protocol_id: cp_energy
      process_id: "sds"
      flow_role: "electricity and steam heat"
      record_type: "meter and utility records"
      raw_fields: "meter_id; start_end; raw_electricity; gross_steam_mass; steam_grade_dryness_quality; inlet_T_P_phase_specific_enthalpy; external_condensate_return_mass_T_P_phase_specific_enthalpy_quality_receiver; opening_closing_steam_condensate_holdup; actual_leaks_flash_other_outlets_losses; supplier_water_energy_owner; start_stop; allocation_driver; warehouse_loading; each_carried_burden_vector"
      collection_method: "owner=utility metering custodian; independently measure gross steam water supplied, actual liquid condensate returned and each real loss/hold-up in native mass/state, and actual enthalpy flows separately from heat MJ. Meter every real matched branch and all electricity, abnormal/idle/rework periods; no supply-return mass/quality equality. steam_heat owns the supplier background once; physical kg cards and internal circulation create no second procurement. Retain unnormalized observations, conversions and exchange-specific history; only normalize_delivery reports unit results."
      unit: "kWh; MJ; kg; h"
      frequency: "continuous meters reconciled each period"
      temporal_coverage: "same complete period and cohort carryover"
      site_scope: "actual manufacturing and warehouse utility scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, enthalpy basis, supplier bills and allocation evidence"
    - protocol_id: cp_pack
      process_id: "sds"
      flow_role: "drum and liner"
      record_type: "packaging and dispatch records"
      raw_fields: "article_id; composition; net_article_mass; ownership; opening_closing_empty_attached_WIP_FG_reusable_stocks; new_external_acquisition; gross_external_return_received; gross_physical_dispatch; separate_external_return_sent; waste; receiver; cleaning; each_historical_exchange_vector; supplier_inclusion"
      collection_method: "owner=packaging and logistics custodian; weigh and stocktake each drum/liner article by material and direction and close boundary_packaging. Keep raw gross physical quantities separate from attributed upstream burden vectors. Trace actual attached/empty/reusable transitions once; no collection division by Q or shrinking physical output on reuse."
      unit: "kg; item"
      frequency: "each packaging and dispatch lot"
      temporal_coverage: "complete actual packaging, storage and delivery period"
      site_scope: "actual onsite packaging and delivery interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "article bill, weighing, reuse and logistics originals"
    - protocol_id: cp_delivery
      process_id: "sds"
      flow_role: "terminal powder output"
      record_type: "quality acceptance and net delivery records"
      raw_fields: "lot_id; release_P; gross_tare_net; G_actual_dispatch_state_mass; eligible_accepted_delivery_entries; R_actual_return_mass_state; original_delivery_id_mass_state; D_rev_original_accepted_quantity; repeat_handovers; actual_rework_add_remove_water; acceptance; grade; water_method; dry_wet_assay; salt; cohort; reporting_interval; dispatch_gate"
      collection_method: "owner=quality release and delivery acceptance custodian; preserve each gross physical G/R event with separately weighed composition/moisture and original accepted quantity/state D_rev. Determine eligible net Q only by delivery_mass_bridge and unique genealogy, not assumed G-R or first-release P. Record all actual rework additions/removals and identify late original-report adjustments. G/R cards are non-additive custody observations and delivered_powder is the net reporting reference; retain raw amounts without stock-burden/economic shrinkage or repeated procurement. Collect unnormalized records; only normalize_delivery reports unit results."
      unit: "kg; mass fraction"
      frequency: "each release, delivery and return"
      temporal_coverage: "complete period and associated opening/closing cohorts"
      site_scope: "one actual net factory-delivery gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated net weights, assay originals, delivery and return genealogy"
    - protocol_id: cp_stocks
      process_id: "sds"
      flow_role: "raw material WIP FG and disjoint non-WIP loop charge and rework histories"
      record_type: "stage genealogy and burden ledger"
      raw_fields: "stage; lot_id; opening_closing_mass_composition_state; each_inherited_exchange_vector; raw_receipt_issue_or_already_corrected_consumption; disjoint_nonWIP_water_fluid_charge_stocks; release_P; internal_transfer; gross_dispatch_and_returns; original_delivery_reversal; actual_rework_material_water_in; actual_removed_material_effluent_species_out; failure; zero_output; loss; driver"
      collection_method: "owner=production costing and stock genealogy custodian; retain opening/closing physical stocks and each historical exchange vector by stage and separate non-WIP equipment loop, linking new raw inputs, failed runs, real rework additions/removals/water and actual outlets. Do not correct again when material consumption already uses real issues/returns/stock changes; include WIP/FG and non-WIP history released to the attributable B_i once. Link returned old deliveries to original delivery and complete history before adding real incremental rework; preserve historical normalization bases for interpretation/reversal, while this report denominator still matches declared net delivery Q. Cancel internal P; collect raw ledgers without B_i/Q."
      unit: "kg; kWh; MJ; original exchange units"
      frequency: "each lot and opening/closing reconciliation"
      temporal_coverage: "complete period plus historical carryover genealogy"
      site_scope: "same product, route, state and real manufacturing/warehouse stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stocktakes, stage ledgers, allocation drivers and historical burden originals"
    - protocol_id: cp_outlet
      process_id: "sds"
      flow_role: "air water and exported waste"
      record_type: "physical outlet and waste records"
      raw_fields: "stream_id; stage; nonadditive_bulk_wet_air_in_out_raw_aggregate; individual_gas_species_in_out; raw_mass; rate; duration; integrated_volume; temperature; pressure; humidity; composition; separate_gas_droplet_aerosol_condensate_phases; condensate_reuse; waste_destination; treatment_boundary; uncertainty"
      collection_method: "owner=site environment and waste custodian; measure each actual external phase/directional inlet/outlet independently. Retain bulk air/gas totals only as non-additive checks against independently measured species sums; no bulk air_in Resource/Emission row is added to species. Distinguish gas H2O, droplets/aerosol water, collected condensate, actual offsite waste and internal reuse. New actual phase/receiver/formulation requires its own atomic row before data use. Physical raw movements stay gross, without burden-vector corrections, allocation or collection division; no residual fits multiple unknowns."
      unit: "kg; m3; h; degC; Pa"
      frequency: "continuous/each lot outlet and waste handover"
      temporal_coverage: "complete actual period including control start-up and failed runs"
      site_scope: "actual outlets and treatment boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meters, waste manifests, water/composition and treatment evidence"
    - protocol_id: cp_species
      process_id: "sds"
      flow_role: "actual species reaction and water"
      record_type: "analytical species and reaction-extent records"
      raw_fields: "species; CAS; actual_Resource_or_Emission_medium; N2_O2_Ar_atmospheric_CO2_H2O_each_in_out_mass; dry_wet_flow_T_P; inlet_outlet_humidity; nonadditive_atmospheric_process_H2O_source_fractions_and_E; CO2_origin_evidence_without_default; gas_liquid_droplet_aerosol_state; raw_concentration; analytical_basis; rate_duration; method; recovery; detection_limit; reaction_extent; acid_alkali_assay; free_bound_water; hydration_state; uncertainty"
      collection_method: "owner=analytical chemistry and emissions monitoring custodian; independently sample each actual inlet/outlet species and phase with matched gas flow/T/P/wet-dry bases. N2/O2/Ar/atmospheric CO2 and humidity have real Resource inputs and gross gas outlets; no fixed atmosphere fractions, equal pass-through or fossil/biogenic default. Report water_air as gross gaseous H2O with non-additive atmospheric/process origins; net E is only a check. Separately collect phase water and actual reaction extent/acid-base assays, interferences, detection limits and uncertainties. Never solve several species or reaction water from COD/one residual; retain unnormalized quantities, no physical allocation or stock-burden reduction."
      unit: "kg; mol; mg/m3; m3; mass fraction"
      frequency: "each batch and outlet monitoring representative of the complete period"
      temporal_coverage: "same cohorts and complete period including abnormal and rework activity"
      site_scope: "actual reaction stages and post-control/fugitive outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "independent assay/species reports, volume/concentration bases, reaction evidence and uncertainty"
  calculation_rules:
    - id: normalize_delivery
      applies_to: "all inventory rows"
      rule: "Keep TWO linked ledgers. Physical directional events retain their measured gross raw quantities m_i after unit conversion; report m_i/Q once where a unit view is needed. Do not subtract inherited burdens or apply economic allocation to physical mass. In particular G, R, steam-water supply/condensate return, each gas species and packaging directions retain actual event quantities; the G/R custody views and net reference Q are alternatives, never additive production/purchase. Separately, delivery-cohort BURDEN numerator B_i equals matched opening raw-material/WIP/FG/non-WIP inherited exchange vectors plus complete actual-period attributable exchanges minus only documented vectors retained in closing/undelivered stock or transferred to independent cohorts. Preserve failed/zero-output runs, losses, actual rework, packaging, storage/loading and original-delivery reversals; use genealogy and causal allocation once. Already stock-corrected consumption is not corrected again. No glass/powder stock scalar substitutes for every exchange vector. Divide each completed B_i/Q exactly once after conversion/attribution; it is the burden result, not a correction of physical m_i. A physical view never buys the same background again: steam_heat owns the steam supplier water/energy convention once and G/R carries existing SDS history without another procurement. Cards and aggregation only reference these same single reporting operations. Q from delivery_mass_bridge stays the declared net-delivery gate, never P or an unrelated historical Q. For Q<=0 retain raw physical/burden records without a unit result and resolve eligibility/adjustments before dataset completion."
      inputs:
        - cp_material
        - cp_energy
        - cp_pack
        - cp_delivery
        - cp_stocks
        - cp_outlet
        - cp_species
      output: "Exchange amount per 1 kg reference flow"
      source_ids: []
    - id: delivery_mass_bridge
      applies_to: "delivered_powder; gross_physical_dispatch; physical_return"
      rule: "From original accepted delivery/return genealogy, Q is the sum of eligible accepted delivery entries at their actually weighed declared reference state minus D_rev, the sum of original accepted-entry quantities reversed. G is all physical dispatch; R is the actual physical returned quantity at its current mass/composition/moisture. D_rev uses the ORIGINAL accepted quantity/state and is not inferred from R. Q=G-D_rev is permitted only where all G has matching acceptance/reference state, cohort, reporting interval and unique-event evidence. G-R is not a net-delivery shortcut when moisture, composition, screening/rework or timing changed. Reconcile each measured addition/removal and distinct original versus returned state; no assumed isomass. Reshipments count only as actual eligible events after original reversal, never as new production or duplicated final supply; late old-cohort returns update the original report or an explicit separate adjustment. delivered_powder=1kg is the net reference view, while G/Q and R/Q are non-additive custody observations, not a third powder output or another supplier purchase. Preserve actual first release P internally and retained/failed/zero-Q burdens; no unmeasured bridge term is zero."
      inputs:
        - cp_delivery
        - cp_stocks
        - cp_species
      output: "Measured G/R and original-state reversals linked to net Q"
      source_ids: []
    - id: raw_conversions
      applies_to: "all inventory rows"
      rule: "Use calibrated mass or actual volume times independent substance-specific density with composition/temperature/pressure and phase bases retained. Rate integrates only over its true measured interval; integrated gas/liquid volume receives no second time multiplier. Gas species use measured concentration/composition and matched dry/wet gas quantity; do not substitute bulk-air volume for water volume or fix atmospheric fractions. For the declared steam boundary use actual entering enthalpy flow minus independently measured returning/exported enthalpy flows and the actual stock/other-outlet terms under the supplier convention; do not assume equal steam/condensate mass or quality and do not apply one return enthalpy to all supplied steam. Retain line losses and actual leakage destinations; utility-water kg and heat MJ reconcile separately. kWh and MJ remain explicit."
      inputs:
        - cp_material
        - cp_energy
        - cp_outlet
        - cp_species
      output: "Converted raw numerators before normalization"
      source_ids: []
    - id: constituent_ledger
      applies_to: "dodecanol; so3; naoh_solution; delivered_powder; wastewater"
      rule: "Each constituent mass equals whole actual supply/outlet mass times independently assayed mass fraction on a compatible basis. Converting dry assay to as-supplied needs actual same-lot water; loss-on-drying is not automatically water. Active titration equivalents, C12 profile and EO are distinct. Count a purchased formulation/solution once; constituent/carrier-water subledgers never duplicate procurement. Onsite blending instead records actual separately acquired constituents and real blending energy/loss."
      inputs:
        - cp_material
        - cp_delivery
        - cp_species
      output: "Non-additive constituent/carrier-water subledgers"
      source_ids:
        - thermo-sds-a11183-2026
    - id: mass_elements_water
      applies_to: "all inventory rows"
      rule: "Use ACTUAL G and R in physical manufacture/FG and consolidated gates, not Q as a substitute for gross movement. External physical inputs including steam-water and each ambient species + opening disjoint raw/WIP/FG/non-WIP stocks = G + external condensate return + every actual gas/liquid/solid outlet + closing stocks + other independently identified outward transfers; cancel P and internal recirculation. R is an external physical input at its measured return state; original delivery reversal D_rev belongs to the reporting bridge, not an extra physical outlet. Q is a non-additive net reference view. Reconcile complete mass and C/H/O/Na/S, plus relevant N/Ar and every actual species, independently. Bulk wet-air/gas observations are non-additive checks against species sums, never extra Resource/Emission alongside contained species. Gaseous H2O includes all uncondensed carrier and process-source water; source fractions and net increment E are non-additive subledgers, not more H2O outputs. Droplets, condensate, aerosol-carried water and other real phases have separate atomic receiver-specific flows. Independently distinguish reagent/carrier water, incoming humidity, steam water/leaks, free/bound/structural water, reaction extent and actual water outlets. One residual cannot solve several unknown species or water terms. Close steam and other non-WIP loops with actual hold-up/losses; physical steam kg is not MJ. Preserve the complete per-article packaging equation and all gross directions; neither burden allocation nor stock-vector attribution shrinks physical events."
      inputs:
        - cp_material
        - cp_delivery
        - cp_stocks
        - cp_outlet
        - cp_species
      output: "Independent physical, element and stage-water balances"
      source_ids: []
    - id: reaction_species
      applies_to: "sds"
      rule: "Stoichiometric checks only: C12H25OH+SO3→C12H25OSO3H forms no net water; C12H25OSO3H+NaOH→C12H25OSO3Na+H2O. Actual reaction water needs independent acid-base assay, reaction extent and side-reaction evidence, never complete conversion presumed from delivered powder kg. Actual SO3 hydration, free-sulfuric-acid neutralization and organosulfate hydrolysis need separately supported extents and water consumption/formation. Never import water/HCl from sulfuric-acid/oleum or chlorosulfonic routes. Outlet species require independent concentration/volume/medium evidence; COD, total sulfur and closure residuals neither identify species nor fit unknown reaction water and another unknown outlet together."
      inputs:
        - cp_material
        - cp_species
        - cp_outlet
      output: "Independent reaction-extent and actual species/reaction-water records"
      source_ids:
        - chemithon-sulfation-1997
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "reference and inputs"
      requirement: "Independently verify C12/EO/sodium/form/grade/route; distinguish whole supply from active/water/salt subledgers. All native name, comment, geography, medium and property limits apply; classification labels or similar names do not replace chemical identity."
      evidence: "thermo-sds-a11183-2026"
    - id: cohort_quality
      applies_to: "all inventory rows"
      requirement: "Trace complete actual periods/cohorts, failed zero-output runs, rework and historical stock burdens; separate release P from actual net delivery Q. Never delete actually included storage, packaging and loading burdens."
      evidence: "cp_stocks; cp_delivery; cp_energy; cp_pack"
    - id: species_quality
      applies_to: "water and outlets"
      requirement: "Independently calibrate mass/volume, assay and species analysis; retain detection limits, wet/dry gas, temperature/pressure and uncertainty. Physical/element balances and reaction-water evidence stand separately; no residual or COD fitting."
      evidence: "cp_outlet; cp_species"
    - id: transferability
      applies_to: "dataset"
      requirement: "Thermo specifies no manufacturing route; Chemithon1997 is equipment technical guidance covering broad alcohol/ether sulfates and other chemical routes, not this product’s factory inventory. Adopt applicable unit principles only; no example recipe, conditions, yield, heat/electricity, moisture or active level becomes a general default."
      evidence: "chemithon-sulfation-1997; thermo-sds-a11183-2026"
validation_rules:
  - rule_id: validate_identity
    applies_to: "delivered_powder"
    rule: "Reference must select one unique terminal Product row with the same UUID and physical row in both languages; never rename/hide intermediate acid/paste or a real co-product to evade checks. The package must substantiate every reference qualifier and actual route; SLES/other chain distributions/salts/supply concentrations are not interchangeable."
    source_ids:
      - thermo-sds-a11183-2026
  - rule_id: validate_gate
    applies_to: "all inventory rows"
    rule: "Check Q from actual accepted reference-state delivery entries and original D_rev with complete event/custody genealogy. Independently verify G and R physical masses and rework/moisture changes; never equate R to D_rev without matching-state evidence or substitute net Q for G in a physical balance. P is internal, undelivered FG not Q, and G/R custody views add no production or procurement to the net reference. Normalize physical event quantities and separately attributed burden vectors once only; Q<=0 retains raw records without a unit result."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Validate actual steam input and external condensate output in Mass with T/P/phase/quality/enthalpy and independently measured stocks/losses; one supplier burden owner prevents double steam-water/heat background. Require separate actual Resource air-species inputs and gross gaseous species outputs with true compartments; bulk air, source-water fractions and net E are non-additive views. Never use an Emission as Resource or assume atmospheric CO2 fossil/biogenic origin. Independently close all physical/species/element/phase-water gates using G/R and actual additions/outlets, not Q. No duplicate whole supply and constituents; no extra time for integrated volume; no COD or shared residual fitting of multiple species/reaction-water unknowns."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Each row requires raw evidence, protocol owner, actual quantity basis and compatible flow/property/medium. Disclose unmatched auxiliary UUIDs/backgrounds without invented defaults or deleted real burdens. Format validation does not establish scientific methodology approval."
    source_ids: []
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing and net-delivery background for the actual C12 SDS powder grade"
  allowed_use: "Compatible C12/non-EO/sodium/powder grade and supply basis; actual delivered kg with evidenced constituent conversion"
  excluded_use: "SLES, mixed-chain SLS, other salts/concentration supplies, washing performance, whole downstream formulations or unverified vendor route"
  required_metadata: "Actual product/grade, all qualifiers, period/site, route, delivery gate, Q/P, carried stock burdens, supply chain and all actual auxiliaries"
  required_quality_disclosure: "Assay basis/uncertainty, failure/rework completeness, species/reaction-water evidence, UUID/provider limits, unresolved data/cut-offs and shared-service allocation"
