    type: "literature"
    reference: "Thermo Scientific, Sodium n-dodecyl sulfate A11183.18 Product Specification, print2026-10-16; https://assets.thermofisher.com/chem-specs-pdf/retrievePdf?countryCode=cn&erp_type=CN_E1_LCD&rootSku=A11183&sku=A11183.18 ; retrieved2026-10-16"
    used_for: "CAS151-21-3 and C12 powder market form; dry assay and regional moisture-method distinction. Heading99% versus supplier-CofA minimum98.5% dry basis; US loss-on-drying≤2.0% and non-US Karl Fischer water<2.0% have separate applicability. Amendable specification proves no route, production origin, actual lot assay or pure-water loss; no general threshold."
