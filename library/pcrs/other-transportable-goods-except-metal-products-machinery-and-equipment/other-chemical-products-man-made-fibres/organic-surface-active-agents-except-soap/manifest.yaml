  scope_decision: "Only straight-chain C12 non-ethoxylated SDS dry powder from purchased-liquid-SO3/n-dodecanol film sulfation, aqueous-NaOH neutralization and vacuum/film drying. No full35310 coverage; prior nearby surfactant uses are inputs/formulations. Actual vendor route not established by catalogue specification."
  reference_gate: "Actual net delivered accepted whole powder Q remains the denominator; unique eligible delivery entries minus original-reference-state D_rev, never blindly current R. G/R are non-additive gross custody observations; first release P stays internal. Unknown or changed-state bridge terms require actual measurement, not an assumed isomass shortcut."
  source_limitations: "Chemithon1997 industrial equipment guidance supports a synthesis of compatible C12 route units, not a particular factory recipe/performance or guaranteed purity. ThermoA11183.18 is a market powder specification, no route/origin proof; 99% heading versus98.5% supplier-CofA dry minimum and USLoD/non-USKF distinctions retained. Actual grade/complete route/physical and chemical balances require real foreground evidence; no quantitative defaults."
  native_identity_limitations:
    - "Reference e15fed31 is the C12 sodium organosulfate, Production mix at plant; no native CAS, geography, grade or route, sole Mass reference factor1. Primary specification independently supports CAS151-21-3. Class35499 remains an isolated taxonomy defect; no provider/assay/density follows. Same chemical identity is used for non-additive G/R custody views, without another production/purchase/background."
    - "Water5b3acbab is Product, CAS7732-18-5, production mix at plant, ion-exchange/RO pure substance in name-route; comment also mentions distillation, production/consumption mix and plant/consumer supply, no numeric standard or geography; restrict to actual matched DI supply. Sole referenceMass factor1."
