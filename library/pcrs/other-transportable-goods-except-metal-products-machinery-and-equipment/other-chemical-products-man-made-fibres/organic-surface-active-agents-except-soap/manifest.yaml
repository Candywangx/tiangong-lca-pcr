  unresolved_identity_notes:
    - "Auxiliary UUIDs remain blank pending complete exact native identity review; specific physical names and actual collection obligations retained. Ordinary provider/quantity matching is dataset-production work, not a missing final-reference identity or automatic draft blocker. Dodecanol and lauryl queries hit only rheology additives; SO3 query returns SOx/oleum/acid/SO2 not liquidSO3; fixed-strength NaOH cannot represent arbitrary supply; SLES/ammonium-salt elementary hits cannot identify SDS air. Other utility/packaging/waste candidates remain unselected, not failed requests reclassified as no-match."
    - "Physical follow-up retains specific steam/condensate and atmospheric CO2/H2O UUID gaps rather than imposing fixed steam pressure, inconsistent condensate origin, fossil/biogenic CO2 or a Volume resource on Mass. These are ordinary identity/actual-state matching duties; every real different phase/receiver/formulation requires an atomic row before data use."
