  physical_accounting_review:
    packaging: "Each drum and liner retains independent gross acquisition, received return, attached shipment, separate outward return, waste and disjoint stock movements; physical quantities are not allocated burden shares."
    nonwip: "Separate real utility-fluid/charge quantity/state and per-exchange history; an already stock-corrected consumption ledger is never corrected again."
    delivery: "Q remains unique net accepted delivery; actual G/R custody events and original-state D_rev have independent measured physical bridges. Physical mass is not reduced by inherited burden stocks/economic allocation; burden vectors B_i/Q remain separate and once only."
    steam: "Distinct gross steam-water input and external liquid-condensate Product return in kg with actual quality/T/P/phase/enthalpy and stocks/losses. steam_heat owns the one supplier water/energy background convention; no supply-return isomass/quality or automatic credit."
    air: "No additive bulk air_in exchange. Independently measured N2/O2/Ar/atmospheric CO2/H2O Resource inputs and gross gas outputs; bulk wet-air and H2O origin/net-E observations are non-additive. Actual phases/media and no fossil/biogenic/default atmospheric recipe."
  elementary_identity_limits:
    receiving_compartment: "Adopted SDS, SO2, H2SO4, n-dodecanol and H2O-vapour identities are Elementary/Mass at Emissions to air, unspecified; real more-specific media require matching identities, not automatic downgrade."
    chemistry: "CAS and independently measured actual species control; broad native synonyms do not authorize SLES, ammonium salt, sulfonate, dodecane, isotope water, aqueous-droplet mass or total-SOx substitution. No occurrence or quantity follows from identity."
    carrier: "Adopted N2/O2/Ar inputs are Resources from air, outputs are Emissions to air unspecified; CAS, Mass and actual receiving medium control. No Resource/Emission interchange, isotope gas substitution or occurrence/quantity defaults."
