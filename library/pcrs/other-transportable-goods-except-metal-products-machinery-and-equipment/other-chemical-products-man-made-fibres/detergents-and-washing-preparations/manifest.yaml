  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scope_decision: "This PCR covers one aqueous liquid laundry detergent made by physically blending a purchased complete anionic/nonionic surfactant mixture of BIO-SOFT LD-190 grade, purchased STEPANATE SXS sodium xylene sulfonate liquid, separately acquired sodium chloride and urea, and deionised water. Supplier formulation 297 establishes an actual route and ingredient roles, not an industry recipe. No ingredient proportions, temperature, mixing time, yield, energy intensity, density, dose, performance or stability default is adopted. Actual approved formula and assays define each dataset. Terminal Q is actual net factory delivery; P is separate internal first release. No claim to all CPC35322 products."
  native_reference_limitations: "Terminal net-delivered detergent, selected uniquely by reference_flow_link. Native Product flow basename Liquid Detergent / 液体洗涤剂 and English comment describe laundry liquid; CN comment confusingly calls it liquid washing powder. Treat that wording as metadata debt, not permission for powder substitution. All other native name components, CAS, grade, route and geography are unspecified; only Mass is provided, reference factor 1. The record does not verify formula, density, provider, cold-water/oily-stain/hard-water performance or sensitive-skin claims. Dataset qualifiers and actual tests must supply these; no universal performance assumption."
  native_water_limitations: "CAS7732-18-5; native name components specify production mix at plant and ion exchange or reverse osmosis, pure substance. Native comment additionally mentions distillation and consumer supply but does not override the narrower name-route/gate. Geography and numerical quality specification are absent; no CN/HK origin, supplier delivery or density is established. Add actual delivery/provider burdens once. Only actual compatible DI water qualifies; onsite water production must be inventoried explicitly."
  source_limitations: "Stepan297 is one starter formulation, not an industry recipe. LD190 exact composition is proprietary; SDS hazard percentages, web solids and active assay are not interchangeable. No quantitative source defaults adopted; lot-specific evidence and actual period data required. BASF is independent grade/form counterevidence only. EPA is US process/wastewater context only."
  normalization_owner: "Collection protocols retain raw unnormalized full-period numerators and complete stock/WIP burden vectors. reconcile_stock assigns delivery numerator A_j without division; normalize_delivery is the unique A_j/Q reporting operation. Card formulas and aggregation_rule are references to the same operation."
  pending_quantitative_evidence: "No industry range for ingredient proportions, active/water fraction, density, yield, utility use, packaging, emissions, wastewater or losses is adopted. These are future foreground collection requirements, not a missing final-reference identity."
