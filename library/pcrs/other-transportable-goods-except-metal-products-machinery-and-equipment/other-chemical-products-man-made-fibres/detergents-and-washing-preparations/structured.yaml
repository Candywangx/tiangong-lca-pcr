allocation_rules:
  - rule_id: a_separate
    applies_to: "all processes"
    rule: "Separate other products by actual submeter/batch/line records first. For shared utilities and warehouse operations use documented causal drivers such as occupied tank-hours, metered machine-hours and pallet-days; reconcile allocated totals to the full raw-period record. No equal split, negative waste credit or cleaning-performance allocation default."
    source_ids: []
  - rule_id: a_rework
    applies_to: "returns and stock"
    rule: "Carry actual burdens with WIP and finished stock into the next ledger and retain incremental rework, storage and transport. Internal rework is not a co-product, an external purchase or a second accepted output. Treat discarded detergent as waste with actual treatment; no assumed market value or avoided production."
    source_ids: []
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "formulate"
      flow_role: "ingredient receiving and dosing"
      record_type: "purchase and batch records"
      raw_fields: "lot; supplier grade/SDS/CoA; whole preparation wet mass; active/water/ethanol/salt assay and method; solid moisture/purity; receipt/dose/return events; raw opening/closing stock and carried burdens"
      collection_method: "Production materials owner reconciles calibrated scales, tank inventories, invoices and actual dosing for every run, including failed batches, rework and zero-output runs. Preserve complete raw period numerators and carry-in/out burdens; do not divide by Q here."
      unit: "kg"
      frequency: "each receipt and batch"
      temporal_coverage: "complete actual matched period plus opening/closing carryover"
      site_scope: "declared production site and finished-goods warehouse through dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed source records; calibration; full lot and burden reconciliation"
    - protocol_id: cp_water
      process_id: "formulate"
      flow_role: "separately supplied DI water"
      record_type: "meter and supply record"
      raw_fields: "source and route; meter start/end; integrated volume or mass; temperature/density if converted; formulation/cleaning split; supplier gate/delivery"
      collection_method: "Water-system owner retains calibrated meter differences and delivery invoices as raw quantities, excluding water already purchased inside preparations. Record actual treatment and delivery boundary; do not divide by Q."
      unit: "kg; m3"
      frequency: "each batch and period"
      temporal_coverage: "complete actual matched period plus opening/closing carryover"
      site_scope: "declared production site and finished-goods warehouse through dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed source records; calibration; full lot and burden reconciliation"
    - protocol_id: cp_energy
      process_id: "formulate"
      flow_role: "electricity and steam separately"
      record_type: "meter and operating logs"
      raw_fields: "meter readings; kWh; steam MJ or mass/enthalpy; actual rates and duration if not integrated; grid/voltage; heating/cooling; test/cleaning/warehouse/handling allocation; idle/rework/failed-run loads; carrying stock burdens"
      collection_method: "Utilities owner collects full raw-period meters and causal allocation records independently for each energy carrier. Distinguish rate times duration from already integrated quantities. Retain stock-attributed burdens and actual operations; do not divide by Q."
      unit: "kWh; MJ"
      frequency: "continuous and each period"
      temporal_coverage: "complete actual matched period plus opening/closing carryover"
      site_scope: "declared production site and finished-goods warehouse through dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed source records; calibration; full lot and burden reconciliation"
    - protocol_id: cp_pack
      process_id: "formulate"
      flow_role: "each supplied packaging component"
      record_type: "packaging ledger"
      raw_fields: "component and configuration; supplier bill of materials; empty/gross/net mass; received/used/rejected/returned components; opening/closing packaging stock; filling losses; reuse and dispatch records"
      collection_method: "Packaging owner weighs each component and reconciles actual packaging consumed with fills, rejects and stock. Include real warehousing/handling/return burdens and assigned carry-ins; keep detergent Q free of packaging mass; do not divide by Q."
      unit: "kg"
      frequency: "each configuration and period"
      temporal_coverage: "complete actual matched period plus opening/closing carryover"
      site_scope: "declared production site and finished-goods warehouse through dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed source records; calibration; full lot and burden reconciliation"
    - protocol_id: cp_delivery
      process_id: "formulate"
      flow_role: "reference gate and stock continuity"
      record_type: "release warehouse and signed dispatch ledger"
      raw_fields: "lot/cohort and formulation; P unique first positive release; signed dispatch and return masses; net Q; tare; opening/closing WIP and finished mass and full burden vectors; failed/zero-output runs; rework histories; stock age and pallet-days; internal transfers; sample/heel/loss events"
      collection_method: "Quality and warehouse owners jointly reconcile calibrated net weights with unique release, acceptance, dispatch and return events. Select actual net factory delivery Q, distinguish P, reverse returned dispatches and prevent duplicate reacceptance. Trace cross-period returns and retained stock with original burdens; never reset their burden to zero. Keep Q and all raw carry records, without normalizing exchanges."
      unit: "kg; pallet-day"
      frequency: "each event and period close"
      temporal_coverage: "complete actual matched period plus opening/closing carryover"
      site_scope: "declared production site and finished-goods warehouse through dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed source records; calibration; full lot and burden reconciliation"
    - protocol_id: cp_waste
      process_id: "formulate"
      flow_role: "each waste transfer separately"
      record_type: "weighing analytical and treatment manifest"
      raw_fields: "individual stream; mass/volume/density; actual composition including water/ethanol/urea/salts; COD/BOD method; sampler; treatment receiver; retained drum residues; internal recovery; stock changes"
      collection_method: "Waste owner reconciles full raw-period waste weights, representative analyses and transfer manifests, with boundaries excluding internal recycle and avoiding duplicate elementary loads. Keep uncertainty and failed-run wastes; do not divide by Q."
      unit: "kg"
      frequency: "each transfer and representative sample"
      temporal_coverage: "complete actual matched period plus opening/closing carryover"
      site_scope: "declared production site and finished-goods warehouse through dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed source records; calibration; full lot and burden reconciliation"
    - protocol_id: cp_emission
      process_id: "formulate"
      flow_role: "each identified atmospheric species"
      record_type: "species-specific measurement and balance"
      raw_fields: "species/CAS; air compartment; source and capture device; actual integrated gas volume and conditions or rate/duration; concentration and blank; solvent inventory; condensate; uncertainty; water evaporation evidence"
      collection_method: "Environmental owner retains raw full-period species tests and supported solvent/water balances across blending, filling and storage. An SDS constituent, total VOC, COD or closure residual cannot establish a species emission. Already integrated gas volume has no extra time factor. Collect raw quantities and carried burden evidence; do not divide by Q."
      unit: "kg; m3"
      frequency: "representative operations and each period"
      temporal_coverage: "complete actual matched period plus opening/closing carryover"
      site_scope: "declared production site and finished-goods warehouse through dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed source records; calibration; full lot and burden reconciliation"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw numerator to its declared unit once using actual calibrated factors: mass = integrated liquid volume times lot/temperature-specific density; a genuine rate is integrated over its actual duration. Already integrated volume has no additional time multiplier. Keep each stream and uncertainty separate; no manufacturer density default."
      inputs:
        - raw_numerators
        - actual_conversion_factors
      output: "unit-consistent raw amounts"
      source_ids: []
    - id: reconcile_stock
      applies_to: "all inventory rows"
      rule: "For each traced product cohort, assign full converted period burdens plus opening WIP/finished-stock burdens, then transfer closing WIP/finished-stock burdens to their own continuing ledger with causal storage/rework attribution. Cancel internal P/handoffs. The delivered burden numerator A_j retains the matched delivered cohort share of failed/zero-output production, rework, rejects, cleaning, filling, storage and factory dispatch. Reconcile all vector components to the complete ledger; no burden disappears. Do not divide by Q in this step."
      inputs:
        - converted_raw_amounts
        - opening_burden_vectors
        - closing_burden_vectors
        - signed_dispatch_events
        - cp_delivery
      output: "A_j and Q; stock burden continuity"
      source_ids: []
    - id: normalize_delivery
      applies_to: "all inventory rows"
      rule: "Report a_j = A_j / Q once for the same net-delivered liquid formulation and cohort, Q > 0 kg; terminal output = 1 kg. Collection protocols preserve raw numerators. This is the sole division by Q: card amount rules and protocol aggregation references describe this same reporting operation, not additional divisions. A zero-delivery cohort retains burdens and cannot yield a per-kg dataset."
      inputs:
        - A_j
        - Q
        - cp_delivery
      output: "a_j per 1 kg net delivered detergent"
      source_ids: []
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Reconcile complete physical mass and relevant C/N/S/Na/Cl elements across all whole inputs, opening/closing WIP/finished stock, actual deliveries/returns, samples, waste and independently identified emissions. Keep active matter, carrier water, free water and dissolved solids as composition subledgers; no double procurement. Dissolution and physical mixing imply no assumed net reaction water. Actual reaction/species/water changes require independent chemical evidence; do not fit unknown water and an unknown outlet to a common residual or infer species from COD/total VOC. Retain unexplained imbalance for review."
      inputs:
        - whole_input_masses
        - stock_masses
        - composition_assays
        - delivery_and_return_masses
        - measured_waste
        - identified_emissions
      output: "physical and element reconciliation with independent species evidence"
      source_ids:
        - stepan297
        - stepan-ld190-sds
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Verify complete supplied formulation/grade, state, medium, provider, geography and boundary. Native UUID establishes broad physical identity only; keep all native limitations in descriptions and dataset metadata. No unsupported equivalence of grades, actives, solids or powder/liquid."
      evidence: "CoA/SDS; lot/formula approval; provider match; native identity review"
    - id: q_complete
      applies_to: "all inventory rows"
      requirement: "Use a complete actual matched period with all runs, inventories and burden carryovers. Meter calibration, detection limits, shared allocation, sample representativeness and uncertainty remain explicit; missing measurements are not zero."
      evidence: "Full raw ledgers; calibration; signed inventory and delivery reconciliation"
    - id: q_source
      applies_to: "all processes"
      requirement: "Manufacturer starter formulation and product/SDS documents provide a bounded route and identity, not cross-site quantitative defaults. SDS disclosure is incomplete and partly proprietary; solids, active matter and hazardous-ingredient percentages have different bases. Validate actual matrix-specific assays, formulation suitability and packaging stability."
      evidence: "Actual qualification tests and current supplier documents"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference product"
    rule: "Require all qualifiers and one terminal Product output detergent_delivered with the declared reference UUID and 1 kg whole liquid basis. Reject unverified powder/SDS/SLES substitution, active-kg normalization, packaging-in-Q or unmatched cohorts."
    source_ids: []
  - rule_id: v_ledger
    applies_to: "all inventory rows"
    rule: "Require positive actual net-delivery Q, distinct P, full signed stock/return events and all carrying burdens; one normalize_delivery operation only. Reject doubled internal output, discarded closing-stock burden, omitted zero-output/rework/storage/dispatch load and manufactured new output from repeated acceptance."
    source_ids: []
  - rule_id: v_species
    applies_to: "all inventory rows"
    rule: "Require whole-preparation purchases, separate real atomic exchanges, physical/element reconciliation and independent species evidence. Do not treat total VOC, COD, SDS ranges or closure residuals as emission species, reaction water, yield or density. A waste transfer and its downstream discharge must not repeat the same load."
    source_ids:
      - stepan-ld190-sds
      - epa-detergents
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Input of the declared net-delivered liquid laundry formulation to a downstream model"
  allowed_use: "Same formulation family, supply state, gate and evidenced geography/technology with explicit provider match"
  excluded_use: "Generic industry recipe; powder/SLES/SDS manufacture; washing service per load; universal efficacy, safety or regulatory claim; automatic cradle-to-gate claim"
  required_metadata: "approved formula and supplier grades; anionic/nonionic composition and solvent information; active matter and water/salt assay with method; liquid state and temperature; net delivery gate and Q ledger; lot and period; opening/closing WIP and finished stock with carried burdens; packaging and warehouse/dispatch scope; site and provider geography; quality acceptance and label instructions; density method if volume is converted"
  required_quality_disclosure: "Foreground scope; complete carry-in/out burden ledger; provider and geography gaps; calibration and matrix assay limitations; missing auxiliary UUIDs and quantitative ranges"
  update_trigger: "Formula/grade/state/route/gate/provider or packaging change; revised assay or new compatible primary evidence; stock/burden reconciliation defect"
