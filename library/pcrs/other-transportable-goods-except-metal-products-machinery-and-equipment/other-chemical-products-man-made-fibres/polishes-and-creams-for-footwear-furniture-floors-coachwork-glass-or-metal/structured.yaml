allocation_rules:
  - rule_id: a_direct
    applies_to: "all rows"
    rule: "Prefer subdivision and direct metering of this recipe/cohort. Allocate shared heat, electricity, warehouse and loading by an evidenced causal driver; retain raw whole-plant totals, driver units, attribution and sensitivity. Apply each allocation once before stock attribution and normalization."
    source_ids: []
  - rule_id: a_outputs
    applies_to: "real co-products and residues"
    rule: "No coproduct is assumed. Rejects, waste and internal recovered solvent are not invented valuable coproducts. If a real marketable coproduct crosses the boundary, preserve its own atomic row/identity, measure it and justify physical or other allocation; do not hide it by renaming a shared UUID. Gross mass balance is independent of environmental allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "paste_delivery"
      flow_role: "plant handover and release"
      record_type: "original period and lot records"
      raw_fields: "owner: dispatch manager; SKU/lot; handover event; gross/tare/net G; return/credit links R; receiving acceptance; first-release P; time; gate"
      collection_method: "Retain undivided dated weights and acceptance/return ledgers. Link physical lots and eliminate duplicate event IDs; record P separately from delivery. A reaccepted return is not a new production run. No division by Q."
      unit: "kg"
      frequency: "each transfer and interval close"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scales; signed handover and credits; lot lineage"
    - protocol_id: cp_materials
      process_id: "paste_delivery"
      flow_role: "individual commercial ingredients"
      record_type: "original period and lot records"
      raw_fields: "owner: batch supervisor; input SKU/lot; actual supplied mass; rate/duration if relevant; density and temperature if volumetric; measured composition/solids/water; route/grade; returns; purchases/issues; failed runs"
      collection_method: "Retain complete unnormalized receipts/issues, weigh tickets and all batch charges including failed/zero-output and rework. Mark whole formulations and constituent subledgers. No formula substituted for measurement and no A/Q at collection."
      unit: "kg; measured composition units"
      frequency: "each lot/batch and reporting interval"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier CoA/SDS; recipe revisions; raw scales and issue records"
    - protocol_id: cp_stock
      process_id: "paste_delivery"
      flow_role: "raw, WIP, finished and return stocks"
      record_type: "original period and lot records"
      raw_fields: "owner: inventory accountant; opening/closing mass by lot/state; actual recipe content; exchange-vector carried burdens; internal P and rework transfers; returns; discarded stock; warehouse service totals"
      collection_method: "Keep undivided physical stock counts and historical carried exchange inventories. Identify production/warehouse/return boundaries and internal transfer IDs. Preserve burdens on undelivered stock and all failed campaigns; no current-period burden reset, equal-P/Q assumption or normalization."
      unit: "kg; exchange-specific burden units"
      frequency: "opening/closing; every stock/return event"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock reconciliation; versioned cohort burden vectors; rework trace"
    - protocol_id: cp_utilities
      process_id: "paste_delivery"
      flow_role: "each utility and handling load"
      record_type: "original period and lot records"
      raw_fields: "owner: utility engineer; individual meter readings; kWh; steam flow/enthalpy/condensate; water make-up/bleed; cooling/refrigeration; warehouse/loading energy; actual fuels; failure/rework periods; shared driver"
      collection_method: "Retain raw period totals per carrier and each included stage, including standby, controls, failed and zero-output runs. Distinguish rates from already integrated readings; keep calibration, units, density and T/P where applicable. No division by output."
      unit: "kWh; MJ; kg; m3; hours"
      frequency: "metered interval aligned with batches and stocks"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters/invoices; steam conditions; equipment and allocations"
    - protocol_id: cp_packaging
      process_id: "paste_delivery"
      flow_role: "each purchased packaging article"
      record_type: "original period and lot records"
      raw_fields: "owner: packaging manager; body/lid/carton SKU; purchased assembly scope; tare per item; counts; opening/closing stock; rejects; rework; recycled content/provider"
      collection_method: "Keep actual undivided article counts, weights and losses. Distinguish complete can from separately purchased body/lid. Include real labels/pallets etc separately. Packaging mass is outside paste Q; its real burdens remain. No normalization."
      unit: "kg; count"
      frequency: "each packaging lot and reporting interval"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase specifications; weighed tares; rejects and stock ledgers"
    - protocol_id: cp_logistics
      process_id: "paste_delivery"
      flow_role: "actual freight and dispatch"
      record_type: "original period and lot records"
      raw_fields: "owner: logistics manager; gate-owned services; payload net mass; route/distance; return loading; mode; warehouse and on-site handling records; embedded delivered supplier services"
      collection_method: "Retain undivided journey and included loading/warehouse records. Flag embedded freight to prevent duplicates; preserve actual declared scope and add actual modes/fuels as separate cards. No A/Q or tkm/Q at collection."
      unit: "kg; km; tkm; raw energy units"
      frequency: "each journey and complete interval"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbills; distance/mode evidence; warehouse/loading meters"
    - protocol_id: cp_residuals
      process_id: "paste_delivery"
      flow_role: "waste, emissions and solvent fate"
      record_type: "original period and lot records"
      raw_fields: "owner: environmental engineer; solvent input/product/stock/recycle/air/waste masses; actual liquid and vapour speciation; exhaust rate/time or integrated volume; T/P/wet-dry basis; concentrations; capture/destruction; waste receiver; cleaning wastewater; uncertainty"
      collection_method: "Retain complete undivided monitoring, stock/fate and waste-transfer totals through normal, failed, cleaning and rework periods. Match actual species, phase and medium. Integrated volume gets no additional time factor. Do not infer evaporative loss from recipe or open-tin tests. No division by Q."
      unit: "kg; m3; mg/m3; time; species units"
      frequency: "each event and complete monitored interval"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "analysis/calibration; sampling conditions; receiver records; uncertainty"
    - protocol_id: cp_quality
      process_id: "paste_delivery"
      flow_role: "product and process qualification"
      record_type: "original period and lot records"
      raw_fields: "owner: quality manager; recipe; supplier/lot; all six ingredient identities and forms; intended receiver substrate/use; non-aqueous paste phase; measured solids/retained solvent/water/density at stated T; actual acceptance criteria and results; process observations; rejection reason"
      collection_method: "Keep original SKU/lot specifications and actual tests, including solids method and volatile loss conditions. Source examples do not supply a universal recipe, phase at all temperatures, density, receiver approval, polishing lifetime or VOC fraction. Retain native identity limitations and paraffin classification debt."
      unit: "kg; specification/test units"
      frequency: "each lot, recipe or source change"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier originals; signed tests; process logs and native full records"
    - protocol_id: cp_allocation
      process_id: "paste_delivery"
      flow_role: "shared services and real coproducts"
      record_type: "original period and lot records"
      raw_fields: "owner: LCA lead; direct/shared loads; output cohorts; measured causal driver and units; allocation rationale; actual coproduct quantities/values if required; sensitivity"
      collection_method: "Keep raw totals and allocation evidence without dividing by Q. Allocation does not change physical mass balance; do not allocate away failed/rework burdens or convert waste into a fictitious coproduct."
      unit: "exchange-specific units"
      frequency: "each interval and scope change"
      temporal_coverage: "complete actual interval plus linked carried cohorts"
      site_scope: "declared plant and its documented supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; measured drivers; rationale and sensitivity"
  calculation_rules:
    - id: calc_convert
      applies_to: "all inventory rows"
      rule: "Convert raw quantities to each row numerator unit once. Liquid mass = integrated volume times measured same-lot density at measured temperature. Rate totals = integral of rate over time; an already integrated gas/liquid volume is used without another time multiplier. Gas concentration and volume must share T/P and wet/dry conditions. Electricity MJ = kWh times3.6; package mass = actual count times measured article tare."
      inputs:
        - "raw meter and assay records"
        - cp_materials
        - cp_utilities
        - cp_packaging
        - cp_residuals
      output: "unallocated raw numerator in row unit"
      source_ids: []
    - id: calc_allocate
      applies_to: "all inventory rows"
      rule: "Use directly metered burdens first; attribute shared burdens by justified causal driver with units and a sum-to-total check. Apply once to raw complete-period burdens including failed/zero-output and rework; keep gross physical mass unallocated for balance."
      inputs:
        - cp_allocation
        - "converted raw burdens"
      output: "attributed exchange vector by cohort"
      source_ids: []
    - id: calc_stock
      applies_to: "all inventory rows"
      rule: "Retain opening plus incoming physical mass = external outputs plus closing physical mass for each stock boundary, with measured losses. Carry the same logic as exchange vectors: opening carried burdens plus actual period burdens = delivered-cohort burden A plus closing undelivered carried burdens plus other independently attributed exits. Reconcile raw/WIP/finished/return cohorts; cancel internal P and rework transfers. Retain real warehouse, packing and loading burden. A has raw numerator units, not per-kg units."
      inputs:
        - cp_stock
        - cp_output
        - "attributed exchange vectors"
      output: "A in each row numerator unit; closing carried inventory"
      source_ids: []
    - id: calc_gate
      applies_to: "paste_ref"
      rule: "Compute Q = G - R using unique accepted plant-handover events net of packaging and linked returns/credits. Match the actual supplied recipe, route, form and cohort; Q must be positive. P is a separate first-release register and is not substituted for Q. Reacceptance never invents new P or a duplicated Q."
      inputs:
        - cp_output
        - cp_stock
      output: "Q in kg; separate P register"
      source_ids: []
    - id: calc_balance
      applies_to: "all inventory rows"
      rule: "Reconcile complete raw physical mass at each declared boundary and for the consolidated cohort, including retained solvent, measured free/water content, waste, air releases, stocks and returns. Check supported elements independently. Speciate actual solvent fate with analytical evidence; no default VOC fraction, no liquid-to-vapour composition equality, no COD/closure-residual fit. Physical melting/dissolution/cooling has no stoichiometric reaction-water term. Any independently observed chemistry needs separate evidence and method extension."
      inputs:
        - cp_materials
        - cp_stock
        - cp_residuals
        - cp_quality
      output: "physical and species/water reconciliation; explicit uncertainty"
      source_ids:
        - who-white-spirit-1996
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "Report amount = A / Q for the declared 1 kg reference flow, once only after raw conversion, allocation and cohort stock attribution. A is the undivided attributable exchange numerator in that row unit; Q is actual net accepted delivered paste kg from calc_gate of the same recipe/route/state/cohort. This is the sole output normalization. Cards and protocol aggregation describe this identical reporting operation, not subsequent divisions."
      inputs:
        - A
        - Q
        - calc_gate
        - calc_stock
      output: "amount per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all material rows"
      requirement: "Actual grade, route, form and full native limitations must be retained; patent and generic UUID do not certify the current supplier or receiver use."
      evidence: "cp_quality; supplier originals"
    - id: dq_period
      applies_to: "all rows"
      requirement: "Complete raw actual-period and carried burdens including failed, rework and zero-output runs; positive matched Q and no double normalization."
      evidence: "cp_output; cp_stock; calc_normalize"
    - id: dq_balance
      applies_to: "all physical streams"
      requirement: "Independent mass/elements, actual species/water/phase evidence and stated uncertainty; unexplained closure is explicit and not fitted."
      evidence: "cp_materials; cp_residuals; calc_balance"
    - id: dq_linkage
      applies_to: "concrete foreground dataset"
      requirement: "Resolve actual auxiliary identities/provider quantities and treatment before completed dataset linkage; preserve missing metadata and uncertainty rather than assigning arbitrary UUIDs or zero."
      evidence: "cp_quality; unresolved register; provider records"
validation_rules:
  - rule_id: v_identity
    applies_to: "paste_ref and ingredients"
    rule: "Verify actual recipe, non-aqueous solvent-retaining paste, receiving use, supplier origin/route/grade/form and full native limitations in section3. A schema-valid broad UUID or application label alone cannot establish scope, approval or provider compatibility."
    source_ids:
      - clariant-pastes-2016
  - rule_id: v_gate
    applies_to: "paste_ref"
    rule: "Require Q positive, unique and traceable to actual net plant handover, distinct P, returns/credits and same-cohort opening/closing stocks. Reacceptance never creates new P or duplicated Q. Missing gate/stock lineage blocks a completed dataset."
    source_ids: []
  - rule_id: v_complete
    applies_to: "all rows"
    rule: "Match complete raw-period numerators, failed/zero-output/rework burdens and carried WIP/finished-stock inventories to Q. Collection never divides by Q. After conversions, allocation and stock attribution, execute calc_normalize once; card formulas and aggregation rules refer to that same reporting operation."
    source_ids: []
  - rule_id: v_balance
    applies_to: "material and species accounts"
    rule: "Check complete physical mass and supported element balances with independently measured emissions, residue, stock and retained-solvent content; compare independent species and water records. Keep uncertainty and unexplained differences explicit. Do not close by fitting unknown reaction water and another unknown output, or use retention-test loss as factory VOC."
    source_ids:
      - clariant-pastes-2016
      - who-white-spirit-1996
  - rule_id: v_coverage
    applies_to: "concrete foreground package"
    rule: "Conditional rows require actual evidence of presence or absence. Add every real ingredient, energy carrier, packaging component, waste and elementary species as a separate atomic exchange; the illustrative species rows are not a complete emission list. Missing data are not zero. Resolve dataset-specific auxiliary/provider matching and uncertainty before claiming complete linkage."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified solvent polishing paste as an input to actual receiving activities; retain plant handover and all recipe/state limits."
  allowed_use: "Same declared material route, physical state, SKU acceptance and gate with complete cohort inventory."
  excluded_use: "Whole CPC35333, aqueous/acrylic/abrasive/aerosol formulations, solid prepared wax, functional polishing-life comparison or default downstream VOC."
  required_metadata: "All section3 qualifiers; protocols and units; raw/WIP/finished/return burden lineage; actual receiving use; native full-field limits, sources/providers and allocation."
  required_quality_disclosure: "Actual evidence/measurement coverage, failed and zero-output periods, uncertainty, unresolved auxiliary/provider/speciation gaps and paraffin metadata debt; no scientific approval claim."
  update_trigger: "Recipe or supplied formulation, route, grade, phase, receiving use, controls, gate, stocks/returns, utility/provider, native identity or source changes."
