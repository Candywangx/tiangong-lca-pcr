system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The selected foreground is physical melting, dissolution and cooling. Melting/solidification, dissolution and solvent evaporation are phase/structural changes, not chemical reaction-water generation or consumption. Purchased esterified montan wax carries its actual upstream reaction inventory, not an invented onsite water term. Reconcile total physical mass and supported element balances separately from independently evidenced molecular species and water. No COD-equivalent closure, assumed VOC fraction or two unknown residual-fitted outlets."
      source_ids: []
    - rule_id: b_operations
      applies_to: "paste_delivery"
      rule: "Include receipt, melting/dissolution, cooling, filling/quality control, finished warehouse, onsite handling and plant handover, rework, failed runs, cleaning and installed pollution controls. Identify actual inbound transport and downstream freight interfaces; retain any real service already included and disclose which gate owns it."
      source_ids:
        - clariant-pastes-2016
    - rule_id: b_purchase
      applies_to: "ingredient inputs"
      rule: "A whole purchased solution, dispersion or wax blend is procured once at supplied mass. Its assayed wax/active, solvent, water and additives are constituent subledgers, not extra purchases. This route uses separate purchases, so use their actual individual charges; no universal recipe."
      source_ids: []
    - rule_id: b_controls
      applies_to: "emissions and treatment"
      rule: "Collect capture, recycle, destruction and release separately for every actual solvent species and medium. Retained solvent in delivered paste is product content; later customer evaporation is outside this manufacturing gate. Offgas transferred to an external treatment provider is a waste transfer, not simultaneously a direct air release."
      source_ids:
        - who-white-spirit-1996
    - rule_id: b_stocks
      applies_to: "all rows"
      rule: "Record raw-material, WIP and finished-goods opening/closing mass with their carried exchange inventories. Production records transfer P into the finished store; the finished store records Q, returns and closing stock. Cancel P as an internal transfer when consolidating; do not add its same-batch closing stock as a second production output. Undelivered finished goods are outside Q but retain their attributable carried burdens. Keep warehouse, packaging, handling, dispatch, failed/zero-output campaigns, cleaning and rework burdens in their real accounts; no burden disappears at a stock or return boundary. Use cohort-linked stock attribution before the sole normalization calc_normalize."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Receipt of separately specified waxes, white spirit, actual utilities and packaging with their upstream inventories; no onsite wax synthesis assumed."
