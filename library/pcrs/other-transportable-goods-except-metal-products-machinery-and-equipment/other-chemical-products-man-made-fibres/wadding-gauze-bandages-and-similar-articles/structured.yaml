allocation_rules:
  - rule_id: allocation_separate
    applies_to: "shared equipment and utilities"
    rule: "Separate SKU/route/sterility/packaging cohorts first. Use meters or documented physical causation for shared loads; retain failed and zero-output runs in their causal cohort. No default yield, inspection loss or economic allocation factor is assigned."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: allocation_rework
    applies_to: "rework, waste and coproducts"
    rule: "Internal recirculation cancels on integration and adds its actual repeated processing burdens. Returned/reaccepted cotton is not new production. Cotton rejects are waste unless an evidenced saleable coproduct specification and allocation are declared; no avoided-product credit by assumption. External treatment and recycling are counted once under the declared accounting convention."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "new accepted output"
      record_type: "foreground_records"
      raw_fields: "SKU; lot ID; first release event; net cotton mass; tare; moisture; rejects; returns; WIP"
      collection_method: "Weigh newly accepted finished rolls on calibrated scales and reconcile unique lot first release. Q is positive new net cotton release, not dispatch or reacceptance. Preserve failed/zero-output lots and WIP ledgers without creating Q."
      unit: "kg"
      frequency: "Each lot and meter interval"
      temporal_coverage: "Complete actual period and matched cohort with carried burdens"
      site_scope: "Declared site and named subcontractors"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Release register, scale calibration and SKU acceptance tests"
    - protocol_id: cp_materials
