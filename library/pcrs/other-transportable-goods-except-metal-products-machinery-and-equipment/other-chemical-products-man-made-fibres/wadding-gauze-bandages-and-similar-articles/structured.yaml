  calculation_rules:
    - id: raw_cohort
      applies_to: "all manufacturing numerators"
      rule: "For each exchange, retain complete raw consumption/burden, including failed/zero-output and repeated rework. Attribute A_i = raw period burden + opening WIP carried burden - closing WIP carried burden for the same product, route and supplied-state cohort; substantiate actual transfer records. Direct raw physical exchanges and carried historical burdens remain separately traceable; do not add carried mass as a second purchase. Do not subtract finished stock already counted in Q."
      inputs:
        - raw_period
        - opening_WIP
        - closing_WIP
        - cp_materials
        - cp_utilities
        - cp_waste
      output: "A_i"
      source_ids: []
    - id: normalize_release
      applies_to: "all included inventory rows except terminal reference"
      rule: "q_i = A_i / Q; Q = unique positive newly quality-released net cotton mass in kg for the matched cohort from cp_release. First convert raw records once to each row unit. This is the only normalization: inventory amount expressions, protocol aggregation references and this rule describe the same report operation, not sequential divisions. For storage_dispatch use its separately reconciled A_i attributable to that same release cohort and Q, retaining any unfinished residence as a disclosed scope limit. Q <= 0 cannot produce a normalized released-product dataset; retain its burdens for the matched causal cohort."
      inputs:
        - A_i
        - Q
        - cp_release
        - cp_storage
      output: "q_i"
      source_ids: []
    - id: supply_subledgers
      applies_to: "solutions, cotton moisture and water"
      rule: "For each whole purchased formulation m, constituent mass = m times its independent assay fraction. For cotton, dry mass = wet mass times (1 - measured moisture fraction). Carrier water, active matter and fibre dry mass are subledgers, not extra external inputs. Independently support actual species and any reaction-water formation/consumption; keep phase/free/bound-water changes distinct. No COD or closure-residual fitting."
      inputs:
        - whole_supply_mass
        - assay_fraction
        - measured_moisture
        - cp_balance
      output: "constituent_and_water_subledgers"
      source_ids: []
    - id: finished_ledger
      applies_to: "storage and dispatch reconciliation"
      rule: "Closing finished stock = opening finished stock + new release + actual returns - actual dispatch - disposal, with other documented physical movements shown explicitly. Carry historical burdens with the same lots. Returns/reacceptance do not increase new release. Integration cancels the release-to-storage internal handoff and its burdens. Actual net delivery, if separately reported, excludes undispatched stock and is a different denominator requiring its own matched carried-burden calculation."
      inputs:
        - cp_release
        - cp_storage
        - stock_movements
        - carried_burdens
      output: "reconciled_finished_ledger"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "supplied product"
      requirement: "Retain fibre identification, non-sterile/unmedicated declaration, actual formulation, dimensions, moisture, package BOM and acceptance tests. Generic flow identity does not prove performance or background/provider compatibility."
      evidence: "Supplier and release evidence"
    - id: quality_completeness
      applies_to: "all raw loads and transfer burdens"
      requirement: "Reconcile stock, WIP, zero-output runs, rejects, rework, outsourcing, utility supply and treatment destinations. Every additional actual ingredient, package component, fuel, waste and emission must have its own atomic dataset exchange. Document excluded scope and remaining uncertainty explicitly."
      evidence: "Raw ledgers and independent balance"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference and scope"
    rule: "Require terminal Product output finished_roll, matching reference UUID, 1 kg net cotton, complete required qualifiers and the declared new-release gate. Reject a different fibre, form, sterile/drug/composite state or unassessed packaging route."
    source_ids:
      - gima-nonsterile-cotton-roll
  - rule_id: validate_period
    applies_to: "normalization and ownership"
    rule: "Require positive unique Q, matched raw numerators with failed/zero-output and rework, full WIP carried burdens, and one normalize_release operation. Collection cannot already divide by Q. Do not add closing finished goods to new release or count returns twice. Separate warehouse/dispatch owner and retained loads are mandatory when included."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "mass, water and environmental exchanges"
    rule: "Check physical mass/elements and moisture on stated bases, using independent actual species/reaction evidence. Whole formulations cannot be duplicated as constituent purchases; integrated volume cannot be multiplied by time again. Unknown reaction water cannot close an unknown outlet by the same residual. Retain treatment/provider evidence and uncertainty rather than claim closure from COD."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "claim limits"
    rule: "Public project recipes, losses, nominal package counts, absorption tests and sterilization discussion are contextual evidence, not industry defaults, clinical equivalence or operating instructions. Missing actual foreground evidence makes the concrete dataset incomplete; it does not create measured values."
    source_ids:
      - msme-cotton-wool-roadmap
      - gima-nonsterile-cotton-roll
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Environmental modelling of this exact supplied roll and declared release gate"
  allowed_use: "Manufacturing inventories with matched SKU, route, fibre, supplied state, moisture, packaging, geography and period"
  excluded_use: "Clinical efficacy/safety equivalence, treatment instruction, sterile or other-fibre substitution, whole-CPC coverage and unqualified delivery-gate comparison"
  required_metadata: "pure cotton fibre grade and origin; virgin ginned lint; supply and release moisture; roll dimensions and actual net cotton mass; non-sterile and unmedicated state; scour and peroxide/finishing formulation; drying and steam supply; outsourced steps; paper and PE grade and actual packaging architecture; release gate and lot cohort; site geography and period; waste/treatment route; storage and dispatch coverage"
  required_quality_disclosure: "Actual raw period and cohort; Q and first-release deduplication; WIP and finished-stock carried burdens; each protocol owner; missing auxiliary identities/provider matching; source and native identity limitations; allocation and scope uncertainty"
  update_trigger: "Fibre origin/grade, recipe, outsourcing, bleaching, treatment/sterility, drying, package, release gate, provider or site/period changes"
