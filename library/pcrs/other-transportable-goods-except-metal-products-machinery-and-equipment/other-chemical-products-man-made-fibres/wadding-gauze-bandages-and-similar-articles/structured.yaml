product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.other-chemical-products-man-made-fibres.wadding-gauze-bandages-and-similar-articles"
  classification_refs: "CPC 3.0 35279; classification broader than method; mapping review pending"
  covered_products: "Wrapped, unmedicated non-sterile pure-cotton absorbent wool roll of one declared SKU"
  excluded_products: "Gauze; bandages; balls/pads; other fibres; impregnated/composite/sterile products"
  representative_product: "Non-sterile cotton wool roll, e.g. GIMA 34838; nominal pack size is not a universal measured mass"
  production_route: "Virgin cotton lint; alkaline scour; peroxide bleach; wash; conditional HCl finish; extract; dry; card; roll; cut; pack; release"
  market_state: "Dry-to-declared-moisture non-sterile roll in declared paper/PE packaging; carton when actually included"
functional_unit:
  what: "Manufacture the declared non-sterile absorbent pure-cotton roll; a material supply function without a clinical equivalence claim"
  how_much: "1 kg net cotton, excluding all packaging, at the declared release moisture"
  how_well: "Meet the actual SKU acceptance specification and report its test evidence; no universal absorption or sterility performance is imposed"
  how_long_or_cycle: "One matched actual production/release cohort; no number of uses or lifetime is assumed"
  reference_flow_link: "finished_roll"
system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "manufacture"
      rule: "Include actual opening/cleaning, scour, bleach, all rinses/finishing, extraction, drying, carding, conversion, QC, packing, internal movement and cleaning, including failed runs and rework. Keep purchased heat/electricity and actual outsourced operations once. An onsite boiler, onsite effluent treatment or other energy route requires explicit process expansion with separate fuel, water, chemical, waste and elementary exchanges, not omitted loads."
      source_ids:
        - msme-cotton-wool-roadmap
    - rule_id: boundary_gate
      applies_to: "production and finished goods"
      rule: "Production ends at new quality release. Do not add closing finished stock of the same released Q as another production output. Maintain opening/closing finished stocks and carried burdens in the separate storage/dispatch ledger; preserve actual storage, packing, handling, freight and returns burdens. When combining ledgers, cancel internal product and burden handoffs. A delivery-gate dataset must use actual net deliveries and matched opening/closing finished inventory with carried burdens; it cannot relabel Q or assume release equals delivery."
      source_ids: []
    - rule_id: boundary_state
      applies_to: "supplied state"
      rule: "Non-sterile does not justify deleting actual treatment. Record any real subcontract treatment and its losses; sterile or medicated output is outside this scope until independently reassessed. Exclude clinical use and end of life from this manufacturing dataset and disclose them."
      source_ids:
        - gima-nonsterile-cotton-roll
boundary_abstraction:
  declared_starting_condition: "Received virgin ginned cotton lint and separately supplied chemicals, utilities and packaging"
  starting_condition_role: "Externally acquired inputs, with upstream agricultural/ginning burdens"
  product_classification_scope: "Only the qualified non-sterile unmedicated pure-cotton roll subset of CPC 35279"
  recursive_input_rule: "Purchased already purified cotton retains its prior processing burden; disclose the shifted entry gate and do not model purification twice. This is a boundary variant requiring review, not virgin lint by relabelling."
  upstream_dataset_requirement: "Compatible fibre origin/grade, commercial formulations, utility supply, packaging and outsourced treatment providers; generic identity does not select a provider"
  disclosure: "Declare all included sites, periods, subcontractors, pre-release storage, rejects and post-release ledger coverage; no measured industrial averages are supplied"
