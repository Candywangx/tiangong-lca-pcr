  mapping_decision: "narrower_candidate_only_pending_controller_acceptance"
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  semantic_scope:
    decision: "Promote the matching unpublished scaffold only for acarbose50mg uncoated direct-compression tablets supplied in100-tablet closed bottles. Material scan found no same-product method; no whole-medicament or API identity is created."
    source_boundary: "Historical2015 FDA product/pack evidence and independent2007 Huadong patent route evidence do not prove one commercial SKU recipe or route. Each concrete dataset requires traceable full actual formula, route and packaging evidence; no defaults adopted."
    gate: "Q is unique newly quality-released fully packed net-tablet mass, not delivered mass. Same-Q closing finished stock is not another production output. Post-release storage/dispatch keeps separate stocks/carried burdens; combined systems cancel internal handovers."
  evidence_limitations:
    - "FDA label is historical2015, not current-label confirmation or a clinical recommendation.50mg is active content, not whole-tablet mass."
    - "Patent is applicant primary route disclosure, not independent factory measurements, current proprietary recipe or medical-equivalence evidence; no numerical recipe, times, yield or factors transferred."
    - "IFC2007 is qualitative sector/monitoring evidence. Release/WIP/stock equations are author-defined environmental accounting rules; no regulatory limits become emission factors."
    - "A concrete site must expand every actual unlisted auxiliary, packaging waste, support system and species individually; no actual burden may be omitted."
  native_identity_review:
    reference: "Acarbose tablet e0ae1660-e0d6-4830-aadd-126c4c1a6aa4 has explicit tablet identity, Mass/kg, production mix at plant, no specified geography/route/strength/pack and no CAS. Native CPC35240 disagrees with its tablet name/comment; classification debt disclosed without discarding consistent physical identity or claiming mapping approval."
    ingredients: "Acarbose API CAS56180-94-0, microcrystalline cellulose CAS9004-34-6, native starch and magnesium stearate CAS557-04-0 are broad physical identities. Actual grade, moisture, origin and supplier remain evidence requirements. MCC plant-fibre70%/30% wording and awkward API organism wording supply no quantitative defaults."
    electricity: "Selected native low-voltage electricity is explicitly locationOfSupply CN,<1kV,grid-average consumption mix,to user. Only that actual supply is compatible; other sites require replacement while retaining all consumption."
    water: "Process Water is treated industrial process water with unspecified geography, grade and route; no sterile/injection-water or supplier equivalence."
  unresolved_flow_ids:
    - "compressible_starch"
    - "colloidal_silica"
    - "bottle_body"
    - "bottle_closure"
    - "bottle_seal"
    - "bottle_label"
    - "leaflet"
    - "shipping_carton"
    - "rejected_tablets"
    - "collected_dust"
    - "cleaning_effluent"
    - "dust_air"
  unresolved_flow_details:
    - row_id: "compressible_starch"
      selected_flow: "Compressible starch excipient"
      reason: "Conditional actual separately purchased compressible starch. Confirm modification/pregelatinisation, botanical origin, composition, moisture and SKU; a native-starch flow is not silently substituted for a physically modified grade. A purchased mixture is recorded whole once, with constituents as analyses only."
    - row_id: "colloidal_silica"
      selected_flow: "Colloidal anhydrous silicon dioxide"
      reason: "Actual pharmaceutical glidant grade only; record surface treatment, form, moisture and whole acquired mass. Quartz sand, crystalline silica, silicate and a generic industrial route are not assumed equivalent."
    - row_id: "bottle_body"
      selected_flow: "Primary100-tablet bottle body"
      reason: "One actual bottle body, weighed without closure or contents. Confirm material, layers, dimensions, supplier and pharmaceutical-contact specification; do not infer HDPE or glass from a label that says only bottle."
    - row_id: "bottle_closure"
      selected_flow: "Tablet-bottle closure"
      reason: "Actual separately supplied closure; record polymer/metal, liner construction and mass. If supplied as one inseparable assembly, retain the assembly mass and avoid counting its liner again."
    - row_id: "bottle_seal"
      selected_flow: "Bottle-mouth tamper seal"
      reason: "Conditional actual separately supplied seal, retaining complete laminate/coating composition and mass. It is not universally required by the historical label; absence requires actual packaging evidence."
    - row_id: "bottle_label"
      selected_flow: "Printed bottle label"
      reason: "Actual supplied printed label as one article; record substrate, adhesive/ink already included by its provider, mass and reject labels. Do not separately repurchase constituents already included in that article."
    - row_id: "leaflet"
      selected_flow: "Printed paper product leaflet"
      reason: "Conditional actual leaflet, with measured mass, paper and print supplier boundary. Electronic information is not silently given the mass or impacts of a paper leaflet."
    - row_id: "shipping_carton"
      selected_flow: "Corrugated shipping carton"
      reason: "Conditional actual single corrugated carton used before the selected release gate; record measured mass, composition and bottle count. Post-release transport packaging remains in the finished-goods account when that extension is claimed, never omitted or charged twice."
    - row_id: "rejected_tablets"
      selected_flow: "Discarded acarbose tablets"
      reason: "Actual discarded off-spec tablets and destroyed quality-control samples; retain active content, excipients, wet mass, destination and treatment acceptance. Reworkable tablets remaining within this gate are internal, not this waste and not new output."
    - row_id: "collected_dust"
      selected_flow: "Discarded acarbose formulation dust"
      reason: "Collected powder actually discarded from weighing, mixing, compression and dedusting; measure composition/moisture and receiver. Powder legitimately returned internally is tracked by batch with no new purchase or output; it is not emitted dust."
    - row_id: "cleaning_effluent"
      selected_flow: "Acarbose tablet-line cleaning wastewater"
      reason: "Actual whole wastewater exported to treatment, separately measuring water, suspended solids, acarbose and cleaning constituents, COD/TOC and destination. COD/BOD is an analytical oxygen-demand indicator, not an effluent mass, active-mass measurement or elementary emission identity."
    - row_id: "dust_air"
      selected_flow: "Acarbose formulation particulate to air"
      reason: "Actual post-control particulate released to the declared air compartment, including fugitives. Retain particle-size basis, active/species composition, air conditions and abatement records. Do not add collected filter dust again or assume every particle is pure API. An unresolved native UUID does not permit omission."
  shared_integration:
    required: "Controller alone owns aliases/catalog/coverage/mapping/ADR integration and scientific review. Author changes only this unpublished PCR four-file leaf."
    full_validation: "Not run by author; controller cadence last full24 next28 checkedbatch26. No claim that new data corpus is fully qualified."
