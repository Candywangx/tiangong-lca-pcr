measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use1kg net whole-tablet mass at unique new packed-product quality release. cp_release measures Q; include API, excipients and actual moisture, exclude all packaging and destroyed samples."
  - id: count_mass
    applies_to: "finished_tablets"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For each same-SKU/lot cohort measure net whole-tablet mass from calibrated tare-corrected weighing or representative counted tablet samples. Q=sum(N_lot×measured mean tablet mass_lot in kg).100 tablets/bottle converts counts only;50mg active/tablet never substitutes for whole-tablet mass. Do not pool incompatible configurations."
