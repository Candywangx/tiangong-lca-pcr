    required_unit: "MJ"
    rule: "Record raw metered kWh or MJ.1kWh=3.6MJ from the exact native energy unit chain; preserve CN,<1kV,grid-average to-user restrictions and do not interpret NCV as a fuel dose."
  - id: raw_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual declared property"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Convert raw quantities before the sole normalize_period operation. A rate multiplied by its matching duration yields a total; an already integrated liquid/gas volume gets no extra time factor. Volume-to-mass needs independently measured density at actual state, never a secondary native-property factor assumed to be density."
