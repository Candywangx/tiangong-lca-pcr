      - jrc-ilcd-2010-allocation
  - rule_id: a_rework
    applies_to: "all inventory rows"
    rule: "Keep actual internal recovery/rework loads and failed-run burdens in the matched cohort once. Waste transfer earns no assumed avoided-product credit. A sold second product or solvent/material recovery outside this single-output profile needs an explicit reviewed multi-output extension, not renaming a co-product as waste."
    source_ids:
      - ifc-pharma-biotech-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "formulation"
      flow_role: "Quality-unit owner: denominator and release identity"
      record_type: "foreground_record"
      raw_fields: "SKU; lot; route; strength; pack; net tablet mass; measured mean tablet mass; counted tablets/bottles; first release ID/time; prior-release/return IDs; destroyed sample count; Q; opening/closing finished stock; deliveries"
      collection_method: "Record unique new accepted fully packed tablets with calibrated tare-corrected weighing and lot-specific counted checks. Match release ledger to production and packaging records; exclude rejects, destroyed samples and previously released returns. Retain raw Q, count and mass records without dividing inputs."
      unit: "kg; tablet; bottle"
      frequency: "Each lot and reporting period"
      temporal_coverage: "Full matched production/release period including start/end cut-off"
      site_scope: "Quality unit and final packing station"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration/tare records; batch release and packing reconciliation; duplicate-release audit"
    - protocol_id: cp_ingredients
      process_id: "formulation"
      flow_role: "Materials and manufacturing owner: ingredients"
      record_type: "foreground_record"
      raw_fields: "Ingredient identity/SKU/lot; complete supply form; supplier route/grade; full formula; gross/tare/net acquisitions; returns; raw-material opening/closing stocks; issued amount; assay basis; moisture; premix components"
      collection_method: "Reconcile actual consumed whole commercial supplies from receipts, issues and stock ledgers; supplier returns retain their exact disposition. Keep active/water/component analyses separate from procurement. Preserve all raw converted masses for failed runs, rework and matched lots; no A/Q here."
      unit: "kg"
      frequency: "Each receipt/issue/lot"
      temporal_coverage: "Complete representative period and linked lots"
      site_scope: "Receiving/dispensing/blending; materials owner"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices; approved batch formula; CoAs; scales; stock and issue records"
    - protocol_id: cp_utilities
      process_id: "formulation"
      flow_role: "Engineering owner: utilities and support systems"
      record_type: "foreground_record"
      raw_fields: "Meter IDs/readings; kWh/MJ; water mass or volume/density/state; start/end; voltage; country; supplier; HVAC/dehumidification/idle hours; raw shared loads and allocation drivers"
      collection_method: "Capture full raw differential meter totals for every actual stage and attributable support operation, including failed/zero-output runs, cleaning and holding. Derive unmetered shares only with documented causal evidence and preserve totals. Rates require duration; integrated totals do not. Keep numerator units and provider boundary explicit; no output division."
      unit: "MJ; kWh; kg; m3"
      frequency: "Continuous meters; period/lot reconciliation"
      temporal_coverage: "Same product/route/state cohort and complete period"
      site_scope: "Utilities/HVAC/cleaning/QC/packing within gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; bills; supply contracts; allocation worksheets; density evidence"
    - protocol_id: cp_packaging
      process_id: "formulation"
      flow_role: "Packaging owner: complete pack supply"
      record_type: "foreground_record"
      raw_fields: "SKU;100-tablet bottle configuration; body/closure/seal/label/leaflet/carton IDs; layers/materials; supplied component masses/counts; rejects; stock changes; provider boundary"
      collection_method: "Weigh each actual acquired article/component and reconcile issues, wastage and opening/closing stock with packed bottles. Include supplied coatings/inks/liners once; never guess material or pack mass from the historical label. Segregate pre-release packaging from later shipping-pack account without deleting either. Collect raw totals only."
      unit: "kg; item"
      frequency: "Each component lot and packing run"
      temporal_coverage: "Matched production and packing cohort"
      site_scope: "Packing line and packaging stores"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier specifications/BOM; component weighing; packing records; rejects"
    - protocol_id: cp_wip
      process_id: "formulation"
      flow_role: "Production accounting owner: WIP/rework and carried burdens"
      record_type: "foreground_record"
      raw_fields: "Opening/closing WIP by stage/lot; mass/composition; opening carried burdens by exchange; raw new period loads; closing carried burdens by exchange; failed/zero-output runs; internal return IDs; release handover IDs"
      collection_method: "Maintain unnormalised mass and exchange-burden ledgers by the same product/route/state cohort. Retain complete opening and complete closing carried burdens, including unconsumed opening carry still in closing WIP, using traceable process progress/physical drivers. The reporting equation adds complete opening carry and subtracts complete closing carry once, without separately subtracting unconsumed opening carry again. Keep failed-run and rework loads once; internal circulation is not a new external purchase/output. Retain all raw ledger entries; do not divide by Q."
      unit: "kg; MJ and each original exchange unit"
      frequency: "Every lot movement and period cut-off"
      temporal_coverage: "Full period plus preceding WIP carry-in and future carry-out links"
      site_scope: "Manufacturing, QA and accounting joint sign-off"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Lot genealogy; signed WIP count; stage completion and burden worksheets"
    - protocol_id: cp_wastes
      process_id: "formulation"
      flow_role: "Environmental owner: discarded streams"
      record_type: "foreground_record"
      raw_fields: "Stream/lot; wet mass; moisture; API and other composition; QC destroys; collected dust; wastewater; COD/TOC; receiver and treatment; transfers and returned waste"
      collection_method: "Measure every actual discarded stream and destination before mixing where necessary; distinguish retained/reworked solids, collected waste and actual emissions. Wastewater is whole wet transfer; analytical species are subledgers. Retain raw period totals, failed runs and treatment-chain references without division or assumed credit."
      unit: "kg; analytical units retained"
      frequency: "Each transfer with representative sampling"
      temporal_coverage: "Complete matched period including cleanouts and rejected lots"
      site_scope: "Waste/effluent gate and actual receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weigh tickets; manifests; lab methods; receiver acceptance; zero-output run log"
    - protocol_id: cp_emissions
      process_id: "formulation"
      flow_role: "Environmental monitoring owner: air releases"
      record_type: "foreground_record"
      raw_fields: "Actual air compartment; vent/fugitive ID; particulate/active composition; particle size; concentrations; gas state; flow-rate/time or integrated volume; control performance; detection limits; monitoring coverage"
      collection_method: "Use calibrated post-control measurements or an independently justified species-specific model with full temporal coverage including upsets. Concentration times matched integrated gas volume gives raw mass; a rate is integrated once. Do not infer species, API fraction, water formation or emitted mass from COD, inventory residual or guideline limits. Retain raw masses and uncertainty, no A/Q."
      unit: "kg; raw concentration/volume units retained"
      frequency: "Representative normal/upset sampling and continuous records as applicable"
      temporal_coverage: "Complete matched period and documented extrapolation coverage"
      site_scope: "Every actual included air outlet and fugitives"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling protocols; detection limits; full composition and control evidence"
    - protocol_id: cp_finished_goods
      process_id: "formulation"
      flow_role: "Logistics/accounting owner: separate post-release ledger"
      record_type: "foreground_record"
      raw_fields: "Opening/closing finished stock and carried burdens; release receipts; deliveries; returns; reacceptance IDs; actual warehouse energy; storage duration; added packaging; handling/shipping loads; destinations"
      collection_method: "Record all actual post-release operations in a separate account. Retain inventory burdens and cohort linkage; unreleased WIP is separate. If an expanded delivery system is reported, combine with production only after internal handovers cancel and a delivery denominator with its own opening/closing stock burdens is declared. Never silently replace production Q by delivery quantity or omit included loads."
      unit: "kg; item; MJ; duration; transport units"
      frequency: "Each movement and period cut-off"
      temporal_coverage: "Actual finished-stock/dispatch period with carried-burden links"
      site_scope: "Post-release warehouse/dispatch, separately owned"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Warehouse counts; stock valuation by exchange; dispatch/return records; bills"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each exchange e, first convert raw units and reconcile the complete matched cohort: A_e = raw period attributable burden_e + complete opening WIP carried burden_e - complete closing WIP carried burden_e. Keep failed/zero-output and rework burdens once. Q is unique positive newly quality-released packed-tablet net mass. Report a_e=A_e/Q once per1kg reference flow. Card formulas and protocol aggregation labels describe this same reporting operation, never a second division. With Q=0 retain the raw burden/carry ledger and report no finite unit dataset."
      inputs:
        - cp_release
        - cp_ingredients
        - cp_utilities
        - cp_packaging
        - cp_wip
        - cp_wastes
        - cp_emissions
      output: "One normalized inventory per1kg net released tablets"
      source_ids:
        - ifc-pharma-biotech-2007
    - id: physical_balance
      applies_to: "formulation"
      rule: "Keep unallocated physical mass, dry solids, water, active and relevant elemental balances separate from burden allocation. Opening WIP + actual incoming materials = unique newly released tablets + closing WIP + actual discarded/air/water outlets, allowing evidenced transfers; packaging has its own balance and finished stocks from Q are not a second production output. Dry blending/compression prescribes no chemical reaction water. Investigate independent measured moisture/evaporation/cleaning water and any actual degradation species; never solve unknown reaction water and unknown outlet from the same residual."
      inputs:
        - cp_ingredients
        - cp_release
        - cp_wip
        - cp_wastes
        - cp_emissions
      output: "Independent raw mass/composition closure and explained uncertainty"
      source_ids:
        - ifc-pharma-biotech-2007
    - id: finished_goods_reconcile
      applies_to: "finished_tablets"
      rule: "Production Q enters finished-goods stock as an internal receipt once; deliveries follow their own opening stock + release receipts + physical returns - closing stock - actual losses ledger. Previously released returns retain historical burdens and no new Q. If reporting actual delivery, attribute opening/closing finished-stock burdens and all included warehouse/packing/handling/dispatch loads to that delivery cohort and cancel internal release transfers; undelivered goods are excluded from delivered Q. This is a separate extension, not a second normalization of the base production inventory."
      inputs:
        - cp_finished_goods
        - cp_release
        - cp_wip
      output: "Separate release and delivery ledgers with internal cancellation"
      source_ids:
        - ifc-pharma-biotech-2007
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Confirm full native name components, CAS where present, form/route/grade/geography/type, all properties and exact referenced property/unit-group versions. Flow identity is separate from supplier/background and quantitative compatibility. Reference tablet35240 classification debt remains explicit; no automatic mapping."
      evidence: "Native originals and supplier/batch evidence"
    - id: dq_completeness
      applies_to: "formulation"
      requirement: "Retain the full formula, purchased supply states, complete packaging, all raw period inputs/burdens, failed and zero-output runs, rework, WIP and carried burdens. Verify all included supports/outlets; missing quantities require collection, not zero substitution."
      evidence: "Signed material/energy/stock reconciliation and stage records"
    - id: dq_temporal
      applies_to: "formulation"
      requirement: "Match site, product, direct-compression route, strength, packaging, release gate and cohort across numerator/denominator. Document representativeness, uncertainty and extrapolation; retain all limitations."
      evidence: "Meter dates; lot genealogy; sampling/calibration and uncertainty records"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_tablets"
    rule: "Reject a missing reference identity, wrong dosage form/strength/route/pack or absent net-tablet weighing/count conversion. Confirm the explicit link selects exactly one terminal Product output consistent with reference UUID in both languages. Do not hide an intermediate/co-product with the same UUID."
    source_ids:
      - fda-precose-label-2015
      - huadong-acarbose-direct-compression-2007
  - rule_id: v_gate_stock
    applies_to: "formulation"
    rule: "Check unique new release IDs, raw Q>0 and exact cohort. Fail duplicate returned/reaccepted production, omitted failed-run/rework burdens, missing WIP/finished-stock carry ledgers, production Q plus same-Q closing finished-stock output, unexplained release-delivery equality or any repeated A/Q division."
    source_ids:
      - ifc-pharma-biotech-2007
  - rule_id: v_mass_species
    applies_to: "all inventory rows"
    rule: "Check unallocated mass/water/active and relevant element balances independently from allocation and actual species evidence. Reject pure-active output as whole tablets, duplicate formulation constituents, integrated-volume times time, COD as species/mass, assumed reaction-water closure or waste transferred and emitted twice."
    source_ids:
      - ifc-pharma-biotech-2007
  - rule_id: v_provider
    applies_to: "all inventory rows"
    rule: "Review native and provider restrictions, complete actual formula/pack records, raw fields/protocol ownership and all conditional occurrences. Empty auxiliary UUIDs require matching before concrete dataset use, not fabricated evidence. A method/format check does not grant clinical, scientific, GMP or mapping approval."
    source_ids:
      - ifc-pharma-biotech-2007
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Traceable environmental modelling of the same qualified finished tablet product, with exact gate and mass basis"
  allowed_use: "Supplier/site-specific secondary formulation inventory and background links with explicit scope/quality disclosure"
  excluded_use: "Clinical selection/dosing, efficacy comparisons, default medical equivalence, manufacturing recipe/operating settings, all-medicament proxies, API or other dosage-form substitution and automatic regulatory/scientific approval"
  required_metadata: "All reference qualifiers; source/projection identity; actual full formula and supply/pack BOM evidence; stage boundary, release/cohort and separate finished-stock account; allocation; providers/receivers; raw protocol records"
  required_quality_disclosure: "Historical FDA presentation and independent patent-route evidence do not identify one proprietary SKU recipe; native tablet classification debt; unspecified native ingredient grade/geography; explicit CN<1kV electricity limit; unresolved auxiliary identities; site data/coverage/uncertainty and review status"
  update_trigger: "Change in active/strength/formulation, route, dosage form, net-mass/count basis, pack configuration, release/delivery gate, utility/provider/geography, stock treatment or waste/emission boundary"
data_sources:
  - id: "fda-precose-label-2015"
    type: "official_guidance"
    reference: "FDA, PRECOSE label,03/2015, NDA020482 supplement027, Reference ID3713301, pp1,12–13. https://www.accessdata.fda.gov/drugsatfda_docs/label/2015/020482s027lbl.pdf"
    used_for: "Historical acarbose50mg tablet identity, excipient names,100-tablet bottle and moisture/storage presentation only. Not current-label verification, tablet mass, proprietary route, complete pack composition, clinical equivalence or a recipe/operating default."
  - id: "huadong-acarbose-direct-compression-2007"
    type: "literature"
    reference: "Hangzhou Zhongmei Huadong Pharmaceutical, CN101019874A, published2007-08-22, specification pp3–4/5, PDF pp6–7; retained Chinese scanned original. https://patents.google.com/patent/CN101019874A/zh"
    used_for: "Applicant evidence for a feasible acarbose dry-blend/direct-compression route and separate filler/glidant/lubricant roles. No patent quantity, mixing order/time prescription, yield, environmental factor or linkage to the historical FDA product is adopted."
  - id: "ifc-pharma-biotech-2007"
    type: "official_guidance"
    reference: "IFC/World Bank Group, EHS Guidelines for Pharmaceuticals and Biotechnology Manufacturing,30 April2007, §§1.1,2.1, AnnexA secondary manufacturing, pp1–5,12,19. https://www.ifc.org/content/dam/ifc/doc/2000/2007-pharma-biotech-ehs-guidelines-en.pdf"
    used_for: "Qualitative formulation/packaging, HVAC, dust, cleaning effluent, waste and monitoring coverage; site collection design. Sector guidance is not an emission measurement, mandatory universal operation, regulatory compliance conclusion or clinical evidence. Release/WIP/stock accounting equations are explicit PCR author modelling rules, not quoted IFC equations."
  - id: "jrc-ilcd-2010-allocation"
    type: "handbook"
    reference: "European Commission JRC, ILCD Handbook General guide Detailed guidance, first edition March 2010, section 7.9.3, PDF pp277–278 / printed pp257–258; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Virtual subdivision and determining physical causality for attributional shared-service burden assignment only. No product-specific route, composition, yield, emission or utility factor, fixed allocation share, substitution credit or full PEF conformity is supplied. Stock and normalization rules remain PCR-specific consistency reasoning."
