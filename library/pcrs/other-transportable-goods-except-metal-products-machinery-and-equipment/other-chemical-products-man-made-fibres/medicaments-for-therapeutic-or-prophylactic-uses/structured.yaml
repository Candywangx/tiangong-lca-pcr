system_boundary:
  rules:
    - rule_id: b_gate
      applies_to: "formulation"
      rule: "Include receipt, dispensing/sieving when used, blending/lubrication, compression, dedusting, filling/closure/labelling, actual pre-release storage/handling, quality tests, cleaning/changeover, HVAC/dehumidification, abatement, failed/zero-output runs and rework. Keep stage records within one aggregated foreground process."
      source_ids:
        - huadong-acarbose-direct-compression-2007
        - ifc-pharma-biotech-2007
    - rule_id: b_release_gate
      applies_to: "finished_tablets"
      rule: "Q is unique positive newly quality-released packed-tablet net mass, not actual deliveries. In the production account never add closing finished stocks from the same Q as another output. Finished-goods storage/dispatch has its own opening/closing mass and carried burdens, real packaging/handling/shipping loads, returns and deliveries. When combined, cancel internal release handovers once and do not treat Q and deliveries as equal. Returned previously released goods create no new Q on reacceptance. Their physical return/restore handovers, historical burdens and new reinspection/rework loads remain in a separately linked finished-goods restoration subaccount; never charge an unrelated new-release cohort or omit these loads. Never-released WIP rework remains within the production cohort and enters Q only at its first accepted release."
      source_ids:
        - ifc-pharma-biotech-2007
    - rule_id: b_completion
      applies_to: "all inventory rows"
      rule: "The cards are an explicit initial stream map, not a cut-off list. A concrete site must add each actual cleaning formulation, fuel, refrigerant, filter, desiccant, secondary pack, waste packaging and direct species as separate atomic exchanges before claiming completeness. Record a whole purchased formulation once; constituents/carrier water are analyses. Preserve all actual burdens; zero requires evidence."
      source_ids:
        - ifc-pharma-biotech-2007
    - rule_id: b_outlets
      applies_to: "formulation"
      rule: "Base profile exports wastewater and solid wastes to evidenced receivers and has no on-site API synthesis, combustion or effluent treatment. If any is actually within the declared boundary, extend all associated inputs and species/medium-specific outputs rather than omitting them. Treatment emissions occur at the declared treatment boundary, not again at the waste-transfer row."
      source_ids:
        - ifc-pharma-biotech-2007
boundary_abstraction:
  declared_starting_condition: "Received qualified API/excipients and complete purchased packaging articles; no upstream API reactor inside this foreground"
  starting_condition_role: "foreground_gate_input"
  product_classification_scope: "CPC35260 narrower finished-tablet subset only"
  recursive_input_rule: "Internal same-batch returns/rework retain identity and burden without new production. Purchased finished tablets/repacking are outside this route; purchased premixes remain one whole input with compatible upstream burdens, never duplicated as constituent purchases."
  upstream_dataset_requirement: "API fermentation/purification, excipient manufacture, actual packaging manufacture, transport and utilities require compatible supplier/state/geography/period references; waste transfers require actual treatment receivers"
  disclosure: "Release gate, upstream starting states, complete formula and pack, actual pre/post-release storage boundary, stage meters, WIP/carried burdens, returns/rework, support systems and destinations"
