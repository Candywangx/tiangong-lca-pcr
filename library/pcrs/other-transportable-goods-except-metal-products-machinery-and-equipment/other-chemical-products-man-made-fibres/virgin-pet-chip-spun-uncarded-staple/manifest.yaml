    limitations:
      - "Candidate authored method only; no scientific approval, publication or accepted mapping."
      - "Narrow virgin PET chip-fed can-tow-to-cut-staple route, not all CPC 35510 products."
      - "Actual plant quantities, finish compositions, specification, utilities and provider compatibility require foreground evidence. No default temperatures, recipes, draw ratios, yields or moisture/regain."
      - "Production release and delivery are different gates; finished-goods warehouse services retain independent stock and burden ledgers."
  semantic_boundary_decision:
    decision: "new_narrow_semantic_method"
    rationale: "Material PET chip synthesis ends at polymer granulate; prepared-fibre, ring-yarn and wadding methods receive existing fibres. None covers purchased virgin PET chips through primary fibre formation, can-tow drawing and cut uncarded staple production release. CPC 35520 filament yarn and CPC 35530 monofilament/strip have different terminal physical forms. Retained CPC 35510 leaf scaffold is not material methodology and remains untouched."
  native_identity_limits:
    - "Reference native identity is virgin textile-fibre industrial production mix at factory, without CAS or geography. Specific cut, form, chip route, finish and moisture qualifiers come from this method and actual records, not from native defaults."
    - "Generic PET granulate input has no native CAS, geography, grade, virgin or route statement. Actual fibre-grade virgin supplier compatibility remains mandatory; no bottle-grade or fixed-purity substitution."
