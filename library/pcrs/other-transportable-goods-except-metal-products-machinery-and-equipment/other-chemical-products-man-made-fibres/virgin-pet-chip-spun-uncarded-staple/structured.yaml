measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is positive newly accepted net fibre at first production release under cp_output; 1 kg includes measured retained finish and water. Exclude all packaging tare. Returns and repeat acceptance never create the same mass again."
  - id: moisture_basis
    applies_to: "material and product mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use actual as-released weighing as denominator. Record wet-basis water fraction w and dry nonwater mass D=m(1-w); assay retained finish separately to obtain polymer mass. Dry-basis regain R=m_water/D gives m=D(1+R). A contractual standard regain changes reported mass only through an explicit measured conversion, never silently changes Q."
  - id: linear_density
    applies_to: "fibre fineness and length"
    required_property_ref:
      name: "Linear density"
      uuid: ""
    required_unit: "tex; dtex"
    rule: "tex and dtex are linear density, not volume density: 1 tex = 1 g/km and 1 dtex = 1 g/10000 m. A length conversion requires measured total relevant filament length and matching fineness; bale count, area and length alone never imply kg. Use actual mean net bale mass M measured by cp_output for count-to-mass, m=n*M, with configuration and spread retained."
  - id: formulations
    applies_to: "finish and additive inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Whole purchased wet formulation is the external input. Active fraction and carrier water are subledgers, not extra purchases; onsite blending uses actual individual ingredients, mixing energy and losses. Distinguish chip-borne additives from new additions."
  - id: raw_conversion
    applies_to: "liquid/gas and energy measurements"
    required_property_ref:
      name: "Mass; energy"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Before normalize_period, convert actual integrated volumes using independently supported composition/density at stated conditions, or integrate rates over duration. An already integrated volume is never multiplied by time again. Electricity MJ = measured kWh * 3.6; count energy once. Steam mass/enthalpy and condensate are paired, not a second heat purchase."
