system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "pet_staple"
      rule: "Include chip receipt/conditioning, extrusion/filtration/spinning, quench/finish/can handling, creeling/drawing/crimping/drying/final finish, cutting, baling and unique production release. Keep substage meters and internal tow transfers within the connected process."
      source_ids:
        - jrc-polymers-2007
        - neumag-staple-2023
    - rule_id: boundary_services
      applies_to: "pet_staple"
      rule: "Retain all attributable actual utilities, start/stop/failed-run energy, cooling/air preparation, abatement, cleaning, packaging, handling and rework. Add a specific atomic card for every real fuel, cleaning chemical, replacement part, waste or measured emission not already listed. Conditional rows are absent only with recorded nonoccurrence, not presumed zero."
      source_ids:
        - jrc-polymers-2007
        - epa-synthetic-fibres
    - rule_id: boundary_release_and_storage
      applies_to: "pet_staple"
      rule: "The terminal quantity gate is new production release, not net delivery. In the production ledger Q already contains every newly released bale, including bales still in closing finished-goods stock: never add that stock again as production output. Keep a separate finished-goods warehouse/dispatch mass and carried-burden ledger, including opening/closing stock, returns and actual included storage/packaging/handling/dispatch services. Reconcile release+opening FG+returns=dispatch+closing FG+documented withdrawals on one mass basis. Cancel internal release/receipt and their inherited burden on consolidation; do not cancel real service burdens. Attribute those services to the matching release cohort or retained stock, and disclose unobserved future services. A delivery dataset needs a separately declared delivery Q and full FG burden carry-over; no equality of release and delivery is assumed."
      source_ids: []
    - rule_id: boundary_reaction_water
      applies_to: "pet_staple"
      rule: "This chip-fed remelt route has no inherent polymerisation reaction-water output. Separate chip/finish water, bath water, condensate and physical evaporation from any independently evidenced hydrolysis/degradation species and water consumed/formed. Do not introduce PTA/MEG synthesis, polymerisation-water factors, COD species, or a pair of unknown reaction water and unknown outlet fitted to the same residual. A material change to an integrated synthesis route requires scope review."
      source_ids:
        - jrc-polymers-2007
        - epa-synthetic-fibres
    - rule_id: boundary_excluded
      applies_to: "pet_staple"
      rule: "Foreground excludes virgin chip synthesis, recycled-flake preparation, melt-direct polycondensation, fibre carding/combing, yarn/monofilament/strip production, textile conversion, use and end of life. Declare transport legs and capital/infrastructure treatment explicitly; upstream coverage is required before any cradle-to-gate claim."
      source_ids:
        - jrc-polymers-2007
        - epa-synthetic-fibres
boundary_abstraction:
  declared_starting_condition: "Purchased virgin fibre-grade PET chips and actual separately acquired finishes/utilities/packaging at plant receipt; no onsite polymer synthesis"
  starting_condition_role: "Foreground gate-to-gate polymer-to-fibre conversion with separately linked upstream suppliers"
  product_classification_scope: "Only the stated uncarded virgin PET cut-staple route within CPC 35510; not whole-leaf coverage"
  recursive_input_rule: "Tow in cans and internal PET returns are tracked physical transfers with inherited burdens, not purchased fibre or additional Q. Purchased staple/tow changes this starting condition and requires review."
  upstream_dataset_requirement: "Compatible actual virgin fibre-grade chip, finish formulation, packaging and utility providers; a broad flow UUID establishes identity only, not a supplier or cradle-to-gate quantity"
  disclosure: "Declare stages, can-tow residence, actual energy/finish systems, quality gate, full period, moisture/finish basis, WIP burdens, included warehouse/dispatch ledger scope, actual geography and upstream gaps"
