allocation_rules:
  - rule_id: allocation_internal
    applies_to: "pet_staple"
    rule: "Prevent allocation by treating tow, finish recirculation, reusable cans and same-lot rework as internal transfers. Track their masses and accumulated burdens. A returned released bale is not new production when inspected or repacked; retain original release identity and add actual incremental rework burden."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "pet_staple"
    rule: "Submeter or subdivide shared utilities and warehouse services first. If unavoidable, use a documented physical causal driver such as measured equipment time/load, actual processed mass or measured occupied bale-days, specific to the service. Retain complete site totals and allocation to other products/old FG, not just this successful output. Do not invent a universal yield, operating load or draw ratio."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_waste
    applies_to: "pet_staple"
    rule: "No automatic avoided-virgin credit for PET waste, captured dust, condensate or packaging. Determine actual waste/product status, destination and any genuine coproduct independently; apply a disclosed compatible allocation/treatment convention without omitting waste burdens or changing reference Q."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "pet_staple"
      flow_role: "Unique release and mass"
      record_type: "release/weighing/test records"
      raw_fields: "lot_id; first_release_id; prior_release_id; gross; tare; net; moisture_wet_basis; retained_finish; polymer_fraction; cut_length; dtex; crimp; tenacity; elongation; acceptance; time; M; bale_configuration"
      collection_method: "Owner: production quality manager. Calibrated weighing at first release after cutting/baling, with real moisture and retained-finish assays on matching lots; subtract wrappers/straps. Identify previously released returned mass so it cannot enter new Q. Collect M and distribution by configuration when counts are used. Retain raw masses and tests only, without division. Aggregation context: Sum unique positive newly released net mass as Q; final reporting uses normalize_period once per 1 kg reference flow. aggregation_rule labels the final report basis, not division during collection."
      unit: "kg; kg/kg; dtex; mm"
      frequency: "each lot/release"
      temporal_coverage: "Matched full period; release cohort"
      site_scope: "Factory production release; buyer specification"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, tare tests, assay method, lot acceptance and duplicate-release audit"
    - protocol_id: cp_feed
      process_id: "pet_staple"
      flow_role: "External solid materials and oil"
      record_type: "issue/return/stock ledger"
      raw_fields: "material_id; supplier_grade; lot; opening; receipts; unused_returns; closing; wet_mass; moisture; composition; stage; filter_replacement; oil_makeup"
      collection_method: "Owner: materials accountant. Weigh actual chip/filter/oil issues and unused returns, reconcile receipt and stock, link certificates and stage/lot. Include start-up, failure and rework issues, not only good runs; independently retain water/additive subledgers. No A/Q in collection. Aggregation context: Retain raw net external use and stage totals; carry into cp_burden, then normalize_period once per 1 kg reference flow. aggregation_rule labels the final report basis, not division during collection."
      unit: "kg"
      frequency: "each issue and stock close"
      temporal_coverage: "Full period including zero-output runs"
      site_scope: "Receipt to connected fibre line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier certificate, scale, stock reconciliation, replacement log"
    - protocol_id: cp_finish
      process_id: "pet_staple"
      flow_role: "Actual finish formulations"
      record_type: "commercial formulation and dosing ledger"
      raw_fields: "formulation_id; supply_lot; wet_issue; return; active_fraction; carrier_water; bath_opening; bath_closing; dilution_water; dosing_point; retain; discharge; mixing_energy"
      collection_method: "Owner: finish preparation supervisor. Meter each whole supplied emulsion and destinations at both application points; assay active and water, reconcile retained finish, bath stocks and effluent. Onsite mixing records each separately purchased ingredient and losses. Do not count carrier/active masses as new procurement. Retain raw records, no division. Aggregation context: Sum each actual external formulation once; route raw totals through cp_burden and normalize_period once per 1 kg reference flow. aggregation_rule labels the final report basis, not division during collection."
      unit: "kg; kg/kg; MJ"
      frequency: "each supply/dose and period close"
      temporal_coverage: "Full matched period and bath carry-over"
      site_scope: "Spin-draw and final-finish circuits"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier/SDS identity, assays, dosing/stock and wastewater reconciliation"
    - protocol_id: cp_utilities
      process_id: "pet_staple"
      flow_role: "Stage utility burdens"
      record_type: "meters and service records"
      raw_fields: "stage; carrier; supplier; geography; voltage; opening_meter; closing_meter; time; rate; integrated_volume; temperature; pressure; density; purity; steam_enthalpy; condensate; runtime; other_product_share"
      collection_method: "Owner: utilities engineer. Capture complete measured stage and site totals including drying/air preparation, compressor, heating, abatement, failed batches, idle/changeover and rework. Distinguish utility import from internal generation/recirculation; document allocation. Convert raw units with convert_raw, but collect no normalized values. Aggregation context: Raw attributed totals with shared-service allocation retained; cp_burden then normalize_period once per 1 kg reference flow. aggregation_rule labels the final report basis, not division during collection."
      unit: "kWh; MJ; kg; m3; h"
      frequency: "continuous meters plus each batch"
      temporal_coverage: "Entire matched period, shutdown and restarts included"
      site_scope: "Declared facility services and real providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, bill reconciliation, density/enthalpy basis and allocation evidence"
    - protocol_id: cp_pack
      process_id: "pet_staple"
      flow_role: "Packaging and finished-goods services"
      record_type: "issue/weighing and warehouse ledger"
      raw_fields: "lot; wrapper; strap; net_issue; offcut; rewrap; first_release; opening_FG; closing_FG; dispatch; returns; withdrawal; inherited_burden; storage_days; handling_energy; dispatch_energy; service_cohort"
      collection_method: "Owner: packaging/warehouse manager. Weigh each packaging component and actual waste. Maintain a separate FG mass/burden ledger and meter real included storage, handling, dispatch and repacking by cohort; do not assume deliveries equal releases or add FG closing stock to production output. Preserve raw totals and opening-stock burden. Aggregation context: Retain raw cohort totals; eliminate internal handovers once on consolidation; cp_burden then normalize_period once per 1 kg reference flow. aggregation_rule labels the final report basis, not division during collection."
      unit: "kg; MJ; bale-day"
      frequency: "each pack/transfer and period close"
      temporal_coverage: "Full period with explicit release and service cohorts"
      site_scope: "Pack-out and declared onsite FG services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare/component measurements, FG reconciliation, service drivers and burden transfers"
    - protocol_id: cp_residual
      process_id: "pet_staple"
      flow_role: "Atomic residuals and species"
      record_type: "waste manifests/sampling"
      raw_fields: "stream; species; medium; wet_mass; water; polymer; finish; filter_metal; concentration; sample_time; integrated_flow; dry_wet_basis; abatement; destination; internal_return; reaction_evidence"
      collection_method: "Owner: environmental engineer. Weigh waste streams and sample actual outlet species/compartments; preserve sampling coverage and outlet flows. Measure phase water independently; identify actual reaction species only with independent evidence. Record captured and residual emissions separately, with no COD-to-species or closure-residual fitting. No collection normalization. Aggregation context: Retain raw stream totals and uncertainty; cp_burden then normalize_period once per 1 kg reference flow. aggregation_rule labels the final report basis, not division during collection."
      unit: "kg; m3; kg/m3"
      frequency: "each event and representative sampling"
      temporal_coverage: "Full period including starts, failures and cleaning"
      site_scope: "Every actual outlet after onsite control"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighbridge/manifests, assay/sampling plan, species evidence and treatment boundary"
    - protocol_id: cp_burden
      process_id: "pet_staple"
      flow_role: "Period WIP, failure and stock burden reconciliation"
      record_type: "linked mass and burden ledger"
      raw_fields: "period; run_id; stage; lot; opening_WIP; closing_WIP; opening_carried_exchange; closing_carried_exchange; zero_output_runs; rework_transfer; FG_transfer; other_outputs; actual_period_exchange; released_cohort_services"
      collection_method: "Owner: LCI accountant, reconciled with production and warehouse owners. Preserve every raw numerator by stage and cohort, plus opening/closing WIP and FG carried burdens. Carry closing WIP forward and consume opening burden once when released. Failed/zero-output runs and rework remain assigned or transparently carried to the matching product; never dropped or double counted. Collect un-divided amounts only; do not execute A/Q here. Aggregation context: Preserve reconciled raw A_j and Q separately for normalize_period; final basis per 1 kg reference flow, no prior division. aggregation_rule labels the final report basis, not division during collection."
      unit: "kg; MJ; exchange-specific units"
      frequency: "each transfer/run and period close"
      temporal_coverage: "Full campaign across relevant period boundaries"
      site_scope: "Connected line plus separately bounded FG services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Mass/burden roll-forward, stage records, failure log, allocation and cohort reconciliation"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert raw physical quantities to each row unit before normalization: electricity MJ=3.6*kWh; liquid mass=integrated_volume*measured_density; gas mass uses actual composition and stated pressure/temperature basis; rate totals=sum(rate*duration). Never multiply integrated volume by duration."
      inputs:
        - raw_quantity
        - density
        - composition
        - temperature
        - pressure
        - duration
        - cp_utilities
      output: "converted raw quantities"
      source_ids: []
    - id: release_q
      applies_to: "pet_staple"
      rule: "Q=sum(unique first-release accepted net fibre kg), with measured residual water/finish included and packaging tare excluded. Count released material once even if later returned, reworked, repacked or reaccepted. Q>0 is required for reporting; zero-output periods retain all raw burdens for explicit matched-cohort carry-over."
      inputs:
        - accepted_net_mass
        - first_release_id
        - prior_release_id
        - cp_output
      output: "Q"
      source_ids: []
    - id: burden_rollforward
      applies_to: "all inventory rows"
      rule: "For each exchange j, assemble raw A_j=actual attributed period exchange+opening WIP carried exchange-closing WIP carried exchange, with documented attribution to other real outputs where needed. Internal transfers/rework cancel, not their incremental burdens. Add only matched-cohort FG service increments from the separate ledger; do not import old FG production burdens into new-release Q. Every closing burden has one next-period receiver."
      inputs:
        - actual_period_exchange
        - opening_carried_exchange
        - closing_carried_exchange
        - FG_service_increment
        - cp_burden
        - cp_pack
      output: "A_j"
      source_ids: []
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "q_j=A_j/Q is the sole reporting normalization to per 1 kg reference flow. All protocols supply un-divided raw numerators, after convert_raw and burden_rollforward. Card amount formulas and aggregation references describe this same operation, not successive divisions. Terminal pet_staple=Q/Q=1 kg."
      inputs:
        - A_j
        - Q
        - cp_burden
        - cp_output
      output: "q_j"
      source_ids: []
    - id: physical_reconciliation
      applies_to: "all inventory rows"
      rule: "For each constituent separately, opening process stocks+external inputs=Q constituent+other measured external Product outputs+external wastes/emissions+closing WIP/process stocks, after cancelling internal transfers. Include returned condensate in the non-reference Product-output subledger. Record measured packaging carried with released bales as a separate physical output/subledger excluded from net fibre Q; count that packaging once without creating extra fibre output. Q already contains newly released FG stock, so do not add closing FG in this production equation. Use a separate FG equation under boundary_release_and_storage. Reconcile PET, finish active, water, filter metal and packaging separately, and relevant elements from actual species assays; disclose measurement uncertainty and unexplained difference rather than fit unknown reaction water or outlet."
      inputs:
        - raw_materials
        - Q
        - waste
        - emissions
        - opening_stocks
        - closing_stocks
        - cp_residual
        - cp_burden
        - other_outputs
        - released_packaging
        - cp_utilities
        - cp_pack
      output: "constituent and elemental reconciliation"
      source_ids: []
    - id: moisture_and_regain
      applies_to: "pet_staple"
      rule: "For the same weighed lot, D=m*(1-w); m_water=m*w; polymer=D-measured_nonwater_finish-other_measured_nonpolymer_constituents. R=m_water/D. Any contractual mass D*(1+R_standard) is separately labelled and cannot silently replace as-released Q; no universal w, finish fraction or R_standard is supplied."
      inputs:
        - net_mass
        - w
        - finish_nonwater
        - nonpolymer_constituents
        - cp_output
      output: "D; m_water; polymer; R"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inputs and reference"
      requirement: "Verify actual polymer, virgin chip route, full supplied formulations and finished uncarded form against certificates. UUID broad identity never supplies absent geography, grade, water, oil or quantities."
      evidence: "Supplier certificates; native fields; lot acceptance"
    - id: period
      applies_to: "all inventory rows"
      requirement: "One complete matched period/cohort; failed starts, zero output, rework, WIP and FG burden transfers are explicit. No successful-batch-only denominator or omitted negative balance."
      evidence: "cp_output; cp_burden; cp_pack"
    - id: measurement
      applies_to: "all measured quantities"
      requirement: "Retain raw units, calibration, tare, assays, density/state, substage utility totals, uncertainty and any shared-service driver. Missing measurement remains a concrete-data gap, never an invented default."
      evidence: "Raw meter and lab records"
    - id: completeness
      applies_to: "all physical outlets"
      requirement: "Identify every actual stream and species; distinguish physical water from reaction chemistry, purchased formulations from constituent subledgers, capture from release and internal circulation from external supply."
      evidence: "Mass/element balance and outlet evidence"
validation_rules:
  - rule_id: validate_identity
    applies_to: "pet_staple"
    rule: "Reject filament yarn, monofilament/strip, sold tow, carded/combed fibre, recycled or non-PET feed, hollow/bicomponent/dope-dyed fibre and integrated-polymerisation substitution within this route. Check actual cut staple and reference row pet_staple against the reference UUID in both languages."
    source_ids:
      - jrc-polymers-2007
      - epa-synthetic-fibres
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Require unique positive new-release Q, actual as-released wet/finish basis, tare exclusion and once-only normalization. Reject use of delivery mass, added closing FG production, repeat returns/reacceptance output, or count/area/length conversions without measured mass evidence."
    source_ids: []
  - rule_id: validate_burden
    applies_to: "all inventory rows"
    rule: "Require full period, failed/zero-output burdens, WIP/FG carry-over and independent protocols with raw undivided numerators. Closing burden must roll forward once, opening burden must be consumed once, and real included warehouse/dispatch/packaging/rework burdens must survive internal elimination."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "all material rows"
    rule: "Check complete wet/dry/finish and relevant elemental closure with independently evidenced outlet species; no inherent remelt polymerisation water, COD species, duplicated formulation/carrier procurement or residual-fitting. Distinguish linear from volume density and integrated volume from a rate."
    source_ids: []
  - rule_id: validate_native
    applies_to: "all UUID-bearing rows"
    rule: "Preserve complete native identity restrictions in consumable card descriptions. Supplier, grade, geography, route and measurement compatibility require actual evidence. Blank auxiliary UUIDs require later matching, not fabricated certainty or a replacement final reference."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified input to fibre preparation, yarn or nonwoven models after provider/basis matching"
  allowed_use: "Declared 1 kg production-release uncarded virgin PET staple for this chip-fed route"
  excluded_use: "Whole CPC coverage, use-life equivalence, delivery-Q equivalence, other polymers/routes and scientific-approval claims"
  required_metadata: "All required qualifiers; exact boundary/services; Q and period; upstream providers; units; allocation; WIP/FG burden ledger; moisture/finish; geography"
  required_quality_disclosure: "Raw-data completeness, uncertainty, unobserved future services, provider gaps and independent scientific review pending"
  update_trigger: "Polymer/grade/virgin status, route, finish, moisture/reference gate, site/services, supplier or measurement change"
data_sources:
  - id: "jrc-polymers-2007"
    type: "official_guidance"
    reference: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf"
    used_for: "August 2007, §§10.2.6–10.2.7, printed pp.167–168 (PDF193–194), Figures10.7–10.9: chip conditioning and can-tow spinning/finishing/cut/bale sequence. No temperature, recipe, yield, moisture or performance values adopted."
  - id: "epa-synthetic-fibres"
    type: "official_guidance"
    reference: "https://www.epa.gov/sites/default/files/2020-10/documents/c06s09_0.pdf"
    used_for: "AP-42 §6.9, 9/90 reformatted1/95, §6.9.2.1 and Figure6.9-2, PDF2–3: independent melt-versus-solvent route and staple-versus-tow/yarn distinction; actual oil/aerosol controls require collection. No generic emission factors, fixed filament counts or plant recipe adopted."
  - id: "neumag-staple-2023"
    type: "handbook"
    reference: "https://www.oerlikon.com/ecoma/files/DL_ONE_Staple_Fiber_Technology_2023_en.pdf?download=true"
    used_for: "2023 manufacturer brochure, printed p.2 “The idea” on PDF2 spread: industrial extrusion/spinning/drawing/crimping/cutting/baling steps only. Other one/two-step and integrated-polycondensation systems, marketing savings and capacities are not the selected factory/SKU or numeric defaults."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, First edition March2010, section7.9.3, printed pp.257–258 (PDF277–278); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Method support for attributional cases where allocation rather than substitution is selected: virtual subdivision and flow-specific determining physical causality support the measured shared-utility and warehouse-service allocation rule. The process literature supplies manufacturing context, not this LCA method. No generic mass/time share, economic coefficient, production/yield/utility factor, substitution credit or PEF/CFF conformity is established; actual service-specific drivers, site totals and cohort attribution remain required."
