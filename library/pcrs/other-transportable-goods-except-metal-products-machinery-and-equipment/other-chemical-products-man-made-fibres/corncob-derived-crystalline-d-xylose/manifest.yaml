  semantic_boundary_decision: "No equivalent specific material PCR found. The existing 23210 sugar PCR is route-neutral within its declared food-sugar scope and includes generic carbohydrate hydrolysis/finishing; it is not evidence for a chemically identified D-xylose corncob factory recipe. The present boundary is one separated CAS/crystal state and pentosan route, with acid-removal cake speciation, individual resin/regeneration streams, methanol balance, and mother-liquor/rework and delivery-stock burdens. These concrete methodological needs, not a different classification label, justify the narrow candidate. Starch, cellulose, sucrose and sugar ether/ester products are chemically different. The general sugar PCR supplies prior generic accounting principles; this narrow chemical-route record does not duplicate its declared food-sugar boundary. Classification acceptance and scientific review remain root-owned pending decisions."
  native_identity_limitations: "The selected native identity is Xylose / 木糖, a Product flow with biomass-extraction, food-safety-compliant, five-carbon-sugar and factory production-mix name components, crystalline D-xylose synonyms and xylan/corncob comments. The bilingual raw/原生 qualifier is retained as a virgin biomass-origin qualifier, not a measured purity. Native geography is empty: no CN/HK or other location of supply is asserted. CAS, exact purity, hydration, sulfuric-acid route detail, supplier and production quantities are unspecified in that row. Its 23210 classification conflicts with the proposed chemically pure residual-sugar context; record this metadata debt separately from physical identity. Comment claims about calorie content, healing or other benefits and synthetic derivatives are not adopted. A concrete dataset must verify D identity, actual crystal state, grade, residual methanol and source compatibility; the broad identity is no supplier/background-production dataset."
