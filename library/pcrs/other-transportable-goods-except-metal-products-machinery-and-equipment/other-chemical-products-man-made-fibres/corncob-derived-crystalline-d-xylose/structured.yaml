allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared production and services"
    rule: "Use segregated process meters and cohort traceability before allocating joint burdens. Record shared utility, treatment and warehouse drivers; never omit failed/zero-output runs. Attribute their burdens to the supported same-product cohort or a separately justified cause, not an invented positive output."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_residue
    applies_to: "residue and mother liquor"
    rule: "Document whether each actual output is waste or a usable co-product, its measured composition and destination. No automatic avoided-product credit. If inseparable useful co-products exist, first identify and apply supported determining physical causal relationships to each exchange, including virtual subdivision where possible. Only remaining burdens that cannot be assigned this way may use documented market values for actual co-functions at the same process-exit condition; explain why physical assignment is unavailable, document matched-period quantities/prices, and report sensitivity. Record the whole period before allocation."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_carryover
    applies_to: "WIP and finished goods"
    rule: "Transfer the original exchange-burden vector with each WIP, first release, stock movement, return and rework batch. Internal transfers cancel across production and warehouse ledgers. Carry undelivered burdens into closing finished goods and opening burdens into actual deliveries, without adding the same released mass again as an external output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "xylose_supply"
      flow_role: "biomass and whole purchased reagents"
      record_type: "scale, issue, purchase and assay records"
      raw_fields: "lot; supplier; chemical/CAS; form; opening/closing material stocks; receipts; issues; returns; gross/tare/net mass; concentration; water; density/temperature; seed origin; routing; batch"
      collection_method: "Materials owner reconciles actual whole-supply consumption by lot from calibrated scales and stores records, retaining raw mass and composition subledgers. On-site blends retain separate actual acquired ingredients, blend energy and losses. Include rejected/zero-output batches and all return/rework movements; perform no division by Q."
      unit: "kg; mass fraction; m3; kg/m3"
      frequency: "each receipt and batch"
      temporal_coverage: "complete declared period plus opening/closing inheritance"
      site_scope: "all included operations and warehouse/dispatch of this process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tickets; supplier COA; moisture and carbohydrate speciation methods; concentration and density records; inventory reconciliation"
    - protocol_id: cp_media
      process_id: "xylose_supply"
      flow_role: "carbon and each resin"
      record_type: "replacement and service-cycle log"
      raw_fields: "identity; wet/dry basis; ion form; purchased mass; opening/closing installed stock; additions; retired mass; conditioning; regeneration cycles; attributable service period; burden vector"
      collection_method: "Media owner reconciles each medium independently from purchase, installed-stock and cycle records; retain actual conditioning liquids, regeneration and spent-media routes. Carry prior-service burdens and closing unconsumed life; no default lifetime or per-kg normalisation at collection."
      unit: "kg; cycles"
      frequency: "each addition, regeneration and retirement"
      temporal_coverage: "complete declared period plus opening/closing inheritance"
      site_scope: "all included operations and warehouse/dispatch of this process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier form/specification; service log; stock and burden reconciliation"
    - protocol_id: cp_water
      process_id: "xylose_supply"
      flow_role: "external water, condensate and aqueous drain"
      record_type: "water meter and liquid routing record"
      raw_fields: "meter; raw integrated volume or rate/time; temperature; density; source; drain; condensate return; internally reused volume; sample composition; whole-stream mass; carrier-water subledger"
      collection_method: "Water owner reads calibrated meters and matched sample/scale records for each actual stream; preserve integrated readings, material formulation water, internal reuse and external treatment transfer separately. Measure net water balance without assigning reaction water from its residual; retain raw totals only."
      unit: "kg; m3; kg/m3"
      frequency: "continuous and each transfer"
      temporal_coverage: "complete declared period plus opening/closing inheritance"
      site_scope: "all included operations and warehouse/dispatch of this process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; routing diagram; temperature/composition-matched density; sample chain"
    - protocol_id: cp_utilities
      process_id: "xylose_supply"
      flow_role: "each energy carrier and support load"
      record_type: "meter, invoice and equipment log"
      raw_fields: "electricity readings; steam mass/pressure/temperature/enthalpy; condensate; source; equipment hours; failed and zero-output time; shared driver; QA; warehouse; handling; dispatch; rework"
      collection_method: "Utilities owner retains the complete period raw metered inputs and engineering allocation evidence by carrier, including idle, failure and post-release operations. Separate purchased utility from on-site generation to prevent double counting; retain raw totals before any reference division."
      unit: "kWh; kg steam; MJ; hours"
      frequency: "continuous and each invoice period"
      temporal_coverage: "complete declared period plus opening/closing inheritance"
      site_scope: "all included operations and warehouse/dispatch of this process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoice reconciliation; run logs; shared-driver evidence"
    - protocol_id: cp_packing
      process_id: "xylose_supply"
      flow_role: "each bag component and scrap"
      record_type: "packing issue, scale and supplier record"
      raw_fields: "component; actual polymer/composition; supplier article; assembled/separate purchase; opening/closing stocks; issues; returned unused items; packing/repacking batch; delivered package mass; scrap mass; burden"
      collection_method: "Packing owner weighs representative actual components and counts actual issues/returns, retaining raw kg, stock carryover and loss/repack records. One assembled supplied sack is one procurement; constituent masses are only subledgers. Product net mass excludes the bag; no division during collection."
      unit: "kg; items; kg/item"
      frequency: "each component receipt and packing batch"
      temporal_coverage: "complete declared period plus opening/closing inheritance"
      site_scope: "all included operations and warehouse/dispatch of this process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier composition; calibrated scales; issue/return/scrap records"
    - protocol_id: cp_delivery
      process_id: "xylose_supply"
      flow_role: "release, WIP, stock, returns and net delivery"
      record_type: "QC, batch genealogy, warehouse and dispatch records"
      raw_fields: "D identity/CAS; assay method/basis; phase; moisture; methanol result/detection limit; batch and cohort; first release R; opening/closing WIP and FG mass; inherited burden vectors; gross/tare/net gate delivery; accepted/reversed transaction; return; rework; stock losses; package"
      collection_method: "Release/warehouse owner separately signs the production and post-release ledgers; weighs actual outgoing net product on calibrated scales and links accepted deliveries, reversals and returns to original lot/transaction. Preserve raw Q and R records, all zero-output runs, opening/closing WIP/FG and their burdens. Never relabel reinspection as first release or undelivered stock as delivered product; collection performs no inventory normalisation."
      unit: "kg; mass fraction; kg-exchange burden vectors"
      frequency: "each batch, transaction and period close"
      temporal_coverage: "complete declared period plus opening/closing inheritance"
      site_scope: "all included operations and warehouse/dispatch of this process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; analytical method/detection limits; phase evidence; unique transaction register; signed dual-ledger burden roll-forward"
    - protocol_id: cp_residues
      process_id: "xylose_supply"
      flow_role: "each residue, purge and retired resin"
      record_type: "weighing, assay and treatment manifest"
      raw_fields: "physical stream; whole wet mass; moisture; actual species; methanol; residual sugar; sulfate/calcium/carbon; origin batch; destination; waste/product evidence; revenue if relevant; opening/closing stocks; inherited burdens"
      collection_method: "Residue owner samples and weighs each physically separate exported stream, preserving the whole mixed cake or mother liquor and composition subledgers. Retain raw destination/treatment burdens and residue stock carryover; independently substantiate species and reaction extent instead of deriving them from COD or balance closure."
      unit: "kg wet; mass fraction; kg species"
      frequency: "each batch and removal"
      temporal_coverage: "complete declared period plus opening/closing inheritance"
      site_scope: "all included operations and warehouse/dispatch of this process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling plan; analysis; scale; manifests; documented chemistry; product/waste and allocation decision"
    - protocol_id: cp_emissions
      process_id: "xylose_supply"
      flow_role: "each measured air species"
      record_type: "source monitoring and activity record"
      raw_fields: "source; actual species; concentration; dry/wet gas basis; temperature/pressure; rate and duration or integrated volume; control efficiency evidence; captured return; residual solvent; operating interval; carbonate consumption/speciation"
      collection_method: "Environment owner matches measured species concentration to the correct gas volume/operating interval after controls, retaining independently evidenced calculations where used. Rate times duration is integrated once; integrated volume receives no second time factor. Keep measured raw pollutant mass, detection limits and unmeasured gaps without presumed zeroes."
      unit: "kg; mg/m3; m3; hours"
      frequency: "each monitoring interval plus full operating coverage"
      temporal_coverage: "complete declared period plus opening/closing inheritance"
      site_scope: "all included operations and warehouse/dispatch of this process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; gas conditions; sample chain; monitor report; activity/speciation basis; uncertainty"
  calculation_rules:
    - id: assemble_delivery_burden
      applies_to: "all inventory rows"
      rule: "For each original exchange component, assemble the attributable unnormalised delivery-cohort numerator A from opening WIP and FG carried burdens plus complete period burdens, less closing WIP/FG carried burdens and separately justified other-product burdens. Reconcile returns, waste treatment, media service-life and internal handoffs once; zero-output/rework burdens remain. Preserve raw source units and conversion traces. No division here."
      inputs:
        - cp_materials
        - cp_media
        - cp_water
        - cp_utilities
        - cp_packing
        - cp_delivery
        - cp_residues
        - cp_emissions
      output: "A, unnormalised delivery-cohort exchange vector"
      source_ids: []
    - id: report_once
      applies_to: "all inventory rows"
      rule: "Reported exchange = A / Q, exactly once, after raw unit conversion and burden roll-forward; Q is strictly positive net accepted factory-gate delivery kg from the unique transaction register. This is the same reporting operation named by card amount expressions and aggregation_rule, never a second sequential division. For the terminal product the numerator is Q and the output is 1 kg."
      inputs:
        - A
        - Q
        - cp_delivery
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: physical_reconciliation
      applies_to: "production and post-release ledgers"
      rule: "Independently reconcile complete physical material/water/element ledgers: opening stock plus actual inputs and transfers equals closing stock plus actual outputs and transfers within measurement uncertainty. Record first release R once in production and its counterpart warehouse receipt once, then cancel them on consolidation. Finished stock opening plus receipts and returns reconciles gross dispatch, closing stock, rework withdrawals and losses. Support actual hydrolysis, carbonate products, ion exchange, sugar degradation and phase/water changes independently; never use two unknown outlets to fit one residual."
      inputs:
        - cp_delivery
        - cp_materials
        - cp_water
        - cp_residues
        - cp_emissions
      output: "signed physical and burden ledgers; independently supported species accounting"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Verify D identity/CAS and actual crystal phase, grade, moisture, assay basis and residual methanol against site/supplier records. Native broad identity and no-geography data cannot supply missing grade, route, supplier or location facts."
      evidence: "COA; analytical and phase evidence; full native fields; usp-fcc-xylose-2015"
    - id: dq_coverage
      applies_to: "all raw records"
      requirement: "Keep the complete matched period and causal cohort, including failed/zero-output batches, prior and closing WIP/FG burden vectors, losses, returns, rework, stock/packing/warehouse/dispatch and actual treatment burdens. Missing burdens are gaps, not zeroes."
      evidence: "signed dual ledgers and completeness reconciliation"
    - id: dq_measurement
      applies_to: "each exchange"
      requirement: "Retain calibration, uncertainty, original units, assay versus mass-fraction basis, density conditions, gas integration and source-specific reaction/species evidence; do not impose source typical numbers."
      evidence: "raw meter/scale/sample records and conversion file"
validation_rules:
  - rule_id: validate_product
    applies_to: "product identity"
    rule: "Reject substitution among CAS, D/L forms, sugar ethers/esters, syrup, hydrates and other routes. Require the full declared qualifiers and the selected route, not the classification label alone."
    source_ids:
      - usp-fcc-xylose-2015
  - rule_id: validate_gate
    applies_to: "net delivery and inventory"
    rule: "Require Q > 0, unique accepted net delivery transactions, first release R separately, physical FG/WIP reconciliation and inherited burdens. Undelivered stock never enters Q; returns/reinspection never fabricate first production or duplicate delivery."
    source_ids: []
  - rule_id: validate_numerator
    applies_to: "all inventory rows"
    rule: "Require complete matched raw-period records, failed/zero-output/rework burdens and inventory carryover, original conversions and one final A/Q operation. Raw collection, card formula and aggregation metadata are not three sequential normalisations."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "inventory and supplied preparations"
    rule: "Each actual external exchange must be one specific flow. Whole purchased solutions/assembled articles are procured once with constituent subledgers. Expand actual additional fuel, treatment reagent, solvent-recovery, packaging or pollutant rows explicitly before claiming completeness."
    source_ids: []
  - rule_id: validate_chemistry
    applies_to: "physical and species balances"
    rule: "Require independent measured physical mass/elements and evidence for actual species, hydrolytic/reaction water, structural/free water and phase changes. Never infer xylose from COD, impose zero residual methanol or force closure by unknown water and unknown waste."
    source_ids:
      - enco-xylose-technology
  - rule_id: validate_native
    applies_to: "UUID and provider compatibility"
    rule: "Read complete native names, route, geography, CAS/comment, medium/type and all properties and the exact referenced property/unit versions. Preserve the disclosed 23210 metadata debt and empty geography; do not substitute latest support, infer density from a secondary factor, or claim native format checks approve methodology or mapping."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process foreground manufacturing and actual net-delivery dataset for the stated D-xylose route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only route/state/grade/geography/boundary-compatible D-xylose supply after explicit provider and evidence review"
  excluded_use: "Generic sugar markets; other CAS/states/routes; unreviewed food/pharmaceutical claims; automatic classification acceptance; silent substitution for starch/cellulose or glucose"
  required_metadata: "D identity and CAS; non-hydrate crystal phase confirmation; assay method and assay basis; actual moisture and residual methanol; corncob origin; sulfuric-acid/calcium-carbonate/methanol route; batch and period; site geography; supplier and native-name compatibility; actual net-delivery gate; opening and closing WIP/finished-stock masses and carried burdens; first release versus delivery; returns/rework lineage; bag composition; utility route; allocation and waste destinations"
  required_quality_disclosure: "Source scope/age, foreground coverage, native metadata debt and unspecified geography, all unresolved auxiliary/provider UUIDs, raw and carried burden records, independent chemistry/phase evidence, monitoring gaps, uncertainty and allocation sensitivity"
  update_trigger: "Chemical identity, feedstock/route, wash solvent, crystal/solution/grade, site, utility/treatment, supplier, package, inventory gate, allocation or evidence change"
data_sources:
  - id: "usp-fcc-xylose-2015"
    type: "standard"
    reference: "USP FCC, Xylose monograph public preview (2015), DOI 10.31003/FCC_F104507_07_01; https://doi.usp.org/USPFCC/FCC_F104507_07_01.html (accessed 2026-10-16)"
    used_for: "D-xylose/CAS/formula, crystal supply form and corncob process sequence only. Public preview, not acquired full monograph; no numeric purity, hydration or moisture limit, inventory, yield or route-specific operating factor."
  - id: "enco-xylose-technology"
    type: "literature"
    reference: "Hangzhou Enco Machinery Co., Ltd., Xylose Technology, undated publisher technical page; https://www.encocn.com/xylose-technology (snapshot 2026-10-16)"
    used_for: "Qualitative corncob sulfuric hydrolysis, calcium-carbonate refining, carbon/resin stages, crystal/mother-liquor handling, methanol wash, drying and lined-bag packing. One equipment-vendor route, not measured factory inventory or independent numeric ranges. Alternative routes, typical parameters, imprecise chemistry/health claims and undetectable-methanol assertion not adopted."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, first edition March2010, §7.9.3, printed257–258/PDF277–278; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional virtual subdivision, determining physical causality and the context for economic relationships at the process gate support shared-process/co-product allocation choices. No xylose recipe, yield, allocation share, substitution credit or plant quantity, and no claim that the handbook literally prescribes this PCR stock-cohort implementation."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:05f8a453ffa3c9ed84a9897f62420901f67c77a005ce0f6c343da725ea9d6a04"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6836"
      family: "system_boundary"
      span:
        start:
          offset: 6836
          line: 61
          column: 1
        end:
          offset: 10416
          line: 83
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual received corncobs, whole commercial reagents, replacement media and bags; matched upstream supply chains |\n| starting_condition_role | Foreground gate-in, with internally separated production and warehouse/dispatch ledgers |\n| product_classification_scope | Only the named chemically identified solid D-xylose; classification is context |\n| recursive_input_rule | Purchased seed D-xylose is one external input with inherited upstream burden. Recovered seed, dust, mother liquor, condensate and rework are internal transfers, never fresh purchases or fresh output. |\n| upstream_dataset_requirement | Match actual commercial form, concentration, origin, geography and technology of each external input; unresolved providers remain disclosed |\n| disclosure | Receipt through actual net delivery, including production release, failed batches, stock carryover, warehouse/handling/packing/dispatch, rework, utility supply, emissions, off-site treatment and any on-site treatment expansion |\n\n### Boundary Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_operations` | xylose_supply | Include reception, hydrolysis, residue separation, neutralisation, carbon/ion exchange, concentration/crystallisation, methanol washing, drying, QC, packing, storage, handling and loading actually performed. Separate production and post-release ledgers; cancel internal handoffs on consolidation. | `enco-xylose-technology` |\n| `boundary_utilities` | utility and treatment systems | The supplied-utility inventory below uses external electricity and steam with condensate accounting. If the site has a boiler, direct-fired dryer, refrigerated utility, on-site effluent treatment or solvent recovery, expand the process inventory with each actual fuel, reagent, refrigerant, recovered output and pollutant as separate atomic rows before claiming coverage; retain their complete burdens. Off-site treatment is linked once to the measured waste, not counted as foreground discharge. |  |\n| `boundary_identity` | reference and intermediate streams | The selected native identity is Xylose / 木糖, a Product flow with biomass-extraction, food-safety-compliant, five-carbon-sugar and factory production-mix name components, crystalline D-xylose synonyms and xylan/corncob comments. The bilingual raw/原生 qualifier is retained as a virgin biomass-origin qualifier, not a measured purity. Native geography is empty: no CN/HK or other location of supply is asserted. CAS, exact purity, hydration, sulfuric-acid route detail, supplier and production quantities are unspecified in that row. Its 23210 classification conflicts with the proposed chemically pure residual-sugar context; record this metadata debt separately from physical identity. Comment claims about calorie content, healing or other benefits and synthetic derivatives are not adopted. A concrete dataset must verify D identity, actual crystal state, grade, residual methanol and source compatibility; the broad identity is no supplier/background-production dataset. |  |\n| `boundary_solvent` | methanol wash and drying | Test residual solvent and trace methanol in purchased formulation, recycled mother liquor, recovered solvent, purge and air. Do not adopt a generic assertion that drying removes every trace or that methanol-washed mother liquor is food-grade. Exported mother liquor requires actual composition/destination and product-or-waste evidence. | `enco-xylose-technology` |\n\n"
