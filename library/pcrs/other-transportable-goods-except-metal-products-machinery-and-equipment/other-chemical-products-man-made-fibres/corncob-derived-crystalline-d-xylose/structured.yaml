system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "xylose_supply"
      rule: "Include reception, hydrolysis, residue separation, neutralisation, carbon/ion exchange, concentration/crystallisation, methanol washing, drying, QC, packing, storage, handling and loading actually performed. Separate production and post-release ledgers; cancel internal handoffs on consolidation."
      source_ids:
        - enco-xylose-technology
    - rule_id: boundary_utilities
      applies_to: "utility and treatment systems"
      rule: "The supplied-utility inventory below uses external electricity and steam with condensate accounting. If the site has a boiler, direct-fired dryer, refrigerated utility, on-site effluent treatment or solvent recovery, expand the process inventory with each actual fuel, reagent, refrigerant, recovered output and pollutant as separate atomic rows before claiming coverage; retain their complete burdens. Off-site treatment is linked once to the measured waste, not counted as foreground discharge."
      source_ids: []
    - rule_id: boundary_identity
      applies_to: "reference and intermediate streams"
      rule: "The selected native identity is Xylose / 木糖, a Product flow with biomass-extraction, food-safety-compliant, five-carbon-sugar and factory production-mix name components, crystalline D-xylose synonyms and xylan/corncob comments. The bilingual raw/原生 qualifier is retained as a virgin biomass-origin qualifier, not a measured purity. Native geography is empty: no CN/HK or other location of supply is asserted. CAS, exact purity, hydration, sulfuric-acid route detail, supplier and production quantities are unspecified in that row. Its 23210 classification conflicts with the proposed chemically pure residual-sugar context; record this metadata debt separately from physical identity. Comment claims about calorie content, healing or other benefits and synthetic derivatives are not adopted. A concrete dataset must verify D identity, actual crystal state, grade, residual methanol and source compatibility; the broad identity is no supplier/background-production dataset."
      source_ids: []
    - rule_id: boundary_solvent
      applies_to: "methanol wash and drying"
      rule: "Test residual solvent and trace methanol in purchased formulation, recycled mother liquor, recovered solvent, purge and air. Do not adopt a generic assertion that drying removes every trace or that methanol-washed mother liquor is food-grade. Exported mother liquor requires actual composition/destination and product-or-waste evidence."
      source_ids:
        - enco-xylose-technology
