    type: "official_guidance"
    reference: "European Commission C(2021) 9332 final, Annex I, pp. 63–64, 68, 70; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "General multifunctionality and animal/slaughterhouse scope. Pig table is not a thyroid-specific coefficient; no numerical factors are transplanted. A study claiming full PEF must retain its binding defaults and classify its actual output correctly; this PCR alone does not establish full PEF conformity."
