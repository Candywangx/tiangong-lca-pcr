allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Do not assign zero upstream burdens to thyroid merely because it is a small slaughter output. Obtain animal-origin and output-class evidence and the actual upstream dataset allocation method. Attribute organ-specific collection, cold-chain, losses and transport directly; document joint-output quantities and allocation drivers without inferring value or yield. The EC method distinguishes farming and slaughterhouse allocations and has binding pig defaults in its own scope; they are not thyroid-specific coefficients and are not imported here. Preserve that distinction when a study chooses a full PEF method. Source: ec-pef-2021."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "For shared foreground services first separate attributable operations/meters; justify any remaining allocation by a measured causal relationship, or a disclosed alternative if no causal basis is supported. Keep the unallocated physical ledger and all co-products visible. No clinical-dose, activity or hormone-equivalent allocation is allowed by this mass-based method. Source: ec-pef-2021."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "api_supply"
      flow_role: "Net delivery and inventory"
      record_type: "weighing_and_stock_ledger"
      raw_fields: "lot; species; tissue; route; state; period; gross; tare; accepted_dispatch; returns; opening_WIP; closing_WIP; opening_finished; closing_finished; carried_burdens; internal_transfer; failed_runs"
      collection_method: "Owner: site quality and warehouse custodians jointly. Preserve raw unnormalised weights, lot acceptance and return identifiers, quality-release and delivery records, and both stock/burden ledgers. Reconcile unique delivered lots against opening stocks, current receipts/releases, losses and closing stocks. No A/Q during collection."
      unit: "kg"
      frequency: "Every lot and period close"
      temporal_coverage: "Complete actual period and carried cohorts"
      site_scope: "Named site and loading acceptance gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, stock reconciliation, signed acceptance/returns, composition and supplier origin"
    - protocol_id: cp_environment
      process_id: "api_supply"
      flow_role: "Atomic environmental exchanges and carried burdens"
      record_type: "meter_invoice_and_waste_ledger"
      raw_fields: "row_id; lot; period; raw_amount; original_unit; conversions; starting_condition; incoming_composition; opening_WIP_burden; closing_WIP_burden; opening_finished_burden; closing_finished_burden; failed_zero_output; rework; shared_service; allocation_driver; destination"
      collection_method: "Owner: site environmental data custodian, with meter, production and waste owners. Retain full undivided period numerators, conversion evidence and complete WIP/finished-stock burden carry. Include zero-output/failed runs, real cold-chain/storage/packing/handling/dispatch and rework. Separate each acquired whole formulation from its component subledger; preserve each actual elementary species and receiving medium. No division by delivery or release during collection."
      unit: "kg; kWh; MJ by atomic row"
      frequency: "Each batch/meter interval and period close"
      temporal_coverage: "Full matched period, including opening carry and failed runs"
      site_scope: "Declared site, actual upstream interface and destination"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, meters, assays, treatment manifests, loss and burden reconciliation; explicit missing versus zero"
  calculation_rules:
    - id: net_delivery_basis
      applies_to: "all inventory rows"
      rule: "Q = sum of unique accepted gross-minus-tare dispatched API mass minus returned mass in the declared cohort; require Q > 0. For each exchange j, assemble the attributable numerator A_j from unnormalised full-period records and opening carried burdens, less supported closing WIP and finished-stock carry, with actual allocation and internal-transfer cancellation. Report A_j / Q once per 1 kg net delivered reference. The card instruction and aggregation basis describe this same reporting operation, never sequential divisions. Retain excluded closing burdens for the next period, and retain failed/zero-output/rework burdens in their documented cohorts; zero-output periods carry burdens and do not yield a normalized product dataset."
      inputs:
        - cp_delivery
        - cp_environment
      output: "Exchange amount per 1 kg net delivered API"
      source_ids: []
  data_quality_requirements:
    - id: origin_state
      applies_to: "all inventory rows"
      requirement: "Keep animal/tissue, actual route, whole formulation, moisture and supplied state distinct. Supplier example European origin cannot establish every producer geography or batch origin; the medicinal label is not a supply-chain identity link."
      evidence: "bioiberica-thyroid-api; dailymed-armour-thyroid; cp_delivery"
    - id: physical_balance
      applies_to: "all inventory rows"
      requirement: "Reconcile full unallocated physical mass and relevant elements over opening inventory + external inputs = actual outputs + closing inventory; internal transfers cancel. Establish actual species, water formation/consumption and phase/structural/free-water changes independently. Neither COD nor a closure residual supplies unknown species or reaction water. Disclose residual uncertainty rather than invent a missing outlet."
      evidence: "cp_delivery; cp_environment"
    - id: identity_limits
      applies_to: "delivered_api"
      requirement: "Broad native reference is not a species, organ, desiccated-state or grade specification. Use it only with the full porcine thyroid qualifiers and one finished physical row. Other actual exchanges require compatible local identities and providers; auxiliary UUID gaps do not erase measured burdens."
      evidence: "cp_delivery; cp_environment"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Reject interchange of tissues, animal species, purified actives and whole extracts, or omission of the native flow limitations. The explicit reference link must select the unique terminal Product output with the same UUID in both languages; real co-products or intermediates cannot be hidden or renamed to bypass that check."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive unique net delivered Q, complete raw numerators and carried WIP/finished-stock burdens. Reject inventory counted in delivery Q, duplicate reacceptance, omission of failed/zero-output burdens, repeated A/Q, integrated-volume times time, and duplicate component purchases. Unknown values remain gaps, never zero."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Check all actually included storage, packing, handling, dispatch, cold-chain, rework, waste destinations and actual elementary media. Require independent physical/element balances and species/water evidence. Missing site measurements or provider matches require explicit uncertainty and completion before a concrete dataset is accepted; this method establishes no scientific approval, clinical claim or publication permission."
    source_ids: []
