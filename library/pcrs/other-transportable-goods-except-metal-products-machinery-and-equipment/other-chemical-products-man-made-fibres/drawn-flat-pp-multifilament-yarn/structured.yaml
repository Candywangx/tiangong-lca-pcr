allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "manufacture and internal loops"
    rule: "Prefer lot/submeter subdivision; retain start-up failures, internal rework and WIP carried burdens. Internal returns are not coproduct sales. Actual marketable off-grade products require separate identities and measured quantities. Where attributional allocation rather than substitution is justified, apply exchange-specific determining physical causality and virtual subdivision first, then residual process-gate market value; document actual drivers, matched quantities/values and sensitivity. No default fractions or automatic avoided-product credit for waste treatment"
    source_ids:
      - ilcd-attributional-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first released yarn"
      record_type: "acceptance and weighing"
      raw_fields: "lot and unique bobbin ID; first acceptance/rejection/return status; gross kg; tube/bag/box/pallet/wrap tare kg; conditioning; finish and moisture assays; dtex; filament count; twist/IPM; tensile elongation shrinkage tests; Q"
      collection_method: "Production quality owner signs first positive lot acceptance to actual order/TDS and calibrated net weighing, before identifying unique released kg. Record full-gate supplied-state water/finish condition and all packaging tares independently; reconcile duplicate IDs, withdrawals, returns and unaccepted WIP. Retain raw net kg; no input numerator is divided here"
      unit: "kg"
      frequency: "each bobbin and lot"
      temporal_coverage: "complete matched accounting period"
      site_scope: "declared factory and same grade/route/state cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tare tests; lot TDS; acceptance and return log"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "purchased material and water"
      record_type: "receipts issues and stocks"
      raw_fields: "individual supply ID; whole received/issued/returned kg; resin/masterbatch/finish assays; water meter; formulation lot; opening/closing raw stock; internal transfers"
      collection_method: "Material-store and preparation owner retains gross raw-period supply records and measured issue/return/stock values, including failed runs and on-site blending losses. Assay constituent ledgers separately; separately acquired dilution water alone is external. Preserve measured volume/temperature/density conversions before any reporting division; no A/Q here"
      unit: "kg"
      frequency: "each supply issue and meter interval"
      temporal_coverage: "same full period including downtime and rework"
      site_scope: "declared factory manufacture"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; calibrated balances/meters; SDS/assays; batch reconciliation"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "foreground electricity"
      record_type: "meters and service attribution"
      raw_fields: "kWh opening/closing meters; submeter periods; compressor/quench/cooling/melt/draw/pack loads; start-up/zero-output/rework hours; shared service allocation driver"
      collection_method: "Utilities owner retains full undivided meter differences and justified shared-service allocations for all actual operations including idle/failed/rework, mixing and pack-out. Record only one acquisition of each internal compressed-air/cooling service burden. Keep stock/carried-burden links; never divide by Q in collection"
      unit: "kWh"
      frequency: "meter interval and period close"
      temporal_coverage: "complete matched period"
      site_scope: "manufacture and attributed utilities at declared factory"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; meter timestamps; service allocation evidence"
    - protocol_id: cp_pack
      process_id: "manufacture"
      flow_role: "each packaging article"
      record_type: "weighed packaging issue/return"
      raw_fields: "separate tube/bag/box/pallet/wrap identity; gross/tare kg; count; returns; reuse cycles; damaged packaging; opening/closing packaging inventory"
      collection_method: "Packing owner weighs each actual article or verifies a representative tare for the exact article/lot and measured count; retains complete raw mass and reuse attribution with rejects, rework and returns. This is procurement/consumption evidence separate from cp_release net-yarn tare; no A/Q here"
      unit: "kg"
      frequency: "each lot and package issue"
      temporal_coverage: "complete matched period"
      site_scope: "manufacture pack-out boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare study; procurement; reuse and damage log; package IDs"
    - protocol_id: cp_balance
      process_id: "manufacture"
      flow_role: "physical mass WIP waste and carried burdens"
      record_type: "lot balance and work-content ledger"
      raw_fields: "opening/closing WIP by material state kg and accumulated exchange burdens; internal melt/as-spun/drawn transfers; failures; returns/rework; waste kg/composition/treatment; product kg; water/finish/pigment ledgers"
      collection_method: "Production accounting owner retains complete raw mass/element balances and supported work-content burdens with each opening/closing WIP state; no zero-output run is removed. Track actual waste dispositions and independent outlet/species measurements; unresolved closure is investigated and disclosed, never assigned to invented species or reaction water. Retain original undivided records"
      unit: "kg"
      frequency: "lot transfer and each period boundary"
      temporal_coverage: "complete period plus provenance of opening burdens"
      site_scope: "same connected manufacture cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "state-resolved stock counts; transfer receipts; independent mass/element/species checks"
    - protocol_id: cp_emission
      process_id: "manufacture"
      flow_role: "each elementary release"
      record_type: "species and medium monitoring"
      raw_fields: "species identity; medium; concentration and basis; integrated gas/liquid volume or actual rate/duration; temperature/pressure; capture; collected water; blanks; detection limits"
      collection_method: "Environmental owner retains full-period measured releases, control/capture performance and uncertainty, including failed/rework periods. Convert measured species at documented conditions before normalization; integrated volume is not multiplied by time again. General polymer or finish descriptions do not establish actual chemical species. Add a separate atomic card for every additional observed species/medium; no generic VOC/COD or unknown-water residual"
      unit: "kg"
      frequency: "monitoring interval and period"
      temporal_coverage: "complete matched period"
      site_scope: "actual manufacture releases"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lab methods; raw monitoring data; independent species evidence"
    - protocol_id: cp_stock
      process_id: "manufacture"
      flow_role: "finished store handling and dispatch bridge"
      record_type: "separate warehouse ledger"
      raw_fields: "opening released stock kg and carried burdens; new-release receipt IDs; shipments and returns IDs/kg; closing released stock kg and burdens; storage duration; actual packing/handling/dispatch burdens; internal transfers"
      collection_method: "Warehouse owner records finished-stock opening/closing and carried burdens separately from production WIP and first-release Q. Preserve every actually included storage, pack-out, handling and dispatch service with lot attribution. Reconcile receipt/issue/return without treating reacceptance as new manufacture. Combining accounts cancels internal product transfers; collection retains all undivided values"
      unit: "kg; kWh; tonne-km"
      frequency: "each movement and period boundary"
      temporal_coverage: "matched cohort through disclosed store/dispatch interval"
      site_scope: "declared factory and any included stores/dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "inventory counts; burden provenance; shipment/return IDs; service records"
  calculation_rules:
    - id: cohort_burden
      applies_to: "all inventory rows"
      rule: "For exchange e, A_e = opening-WIP carried burden_e + complete current-period burden_e - closing-WIP carried burden_e - separately assigned coproduct burden_e. Use state-resolved work content and lot links; preserve failures/rework. Physical waste outlet quantities remain measured quantities, not burden residuals. Add only the separately justified store/dispatch service share of this newly released cohort; carry other released-stock burdens in cp_stock. Cancel internal transfers before reporting"
      inputs:
        - opening_WIP_burden_e
        - period_burden_e
        - closing_WIP_burden_e
        - coproduct_burden_e
        - cp_balance
        - cp_stock
      output: "A_e"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "q_e = A_e / Q; Q is positive unique first quality-released packed net supplied-state yarn kg under cp_release. This is the single reporting division after raw unit conversion and cohort/WIP attribution; card amounts and protocol aggregation refer to this same operation, never a second division. Released reference output is 1 kg. If Q is zero, retain the full burdens and justified WIP/later-cohort carryover; do not create a per-kg result"
      inputs:
        - A_e
        - Q
        - cp_release
      output: "q_e"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "reference and suppliers"
      requirement: "Verify virgin PP, single-bundle flat drawn state, circular shape, colour, no twisting/texturing and no sewing/retail gate against actual orders/tests. Source catalogue maximum bobbin mass, dtex and typical polymer properties are not measured batch mass, density, yield or process energy"
      evidence: "order/TDS; lot acceptance; supply records; native-limit disclosure"
    - id: measurement
      applies_to: "raw data and denominator"
      requirement: "Independently measure yarn kg, tares, finish/moisture and line density/filament count. Declare instrument uncertainty, sampling and conditioning. Keep all raw numerators before the one normalization; no default yield, consumption, energy, density or regain"
      evidence: "calibrations; assays; raw data; once-only calculation trail"
    - id: completeness
      applies_to: "period and stocks"
      requirement: "Match actual full period, factory, route and cohort. Retain failed/zero-output/rework burdens, WIP opening/closing work content and finished-stock carryovers separately. Independently close physical and element ledgers without inventing species. Every applicable missing measurement/provider link is disclosed and resolved before claiming a complete dataset"
      evidence: "cp_balance and cp_stock; source/assay/monitoring records"
validation_rules:
  - rule_id: scope_match
    applies_to: "reference flow"
    rule: "Require all declared qualifiers and actual order/TDS acceptance. Reject substitution of POY, DTY, twisted/plied yarn, sewing thread, retail packages, monofilament, tape or another polymer. Air intermingling alone does not imply bulk texturing or multiple yarns"
    source_ids:
      - chemosvit-pp-2016
      - chemosvit-pp-list-2024
  - rule_id: basis_and_stock
    applies_to: "inventory"
    rule: "Require Q > 0 unique new-release net kg and once-only A_e/Q after conversions; no period-ending finished stock added to Q output, no shipped-Q substitution and no new output from reacceptance. Reconcile full WIP/finished-stock kg and burden ledgers and cancel internal transfers. Flag missing failed/zero-output/rework or actually included service burdens"
    source_ids: []
  - rule_id: chemistry_and_units
    applies_to: "mass utilities and emissions"
    rule: "Require separate whole-formulation procurement and constituent subledgers, independent yarn mass/linear density/tare/conditioning, physical and element checks, and independently supported species/reaction water. Reject density inferred from dtex, integrated-volume times duration, guessed reaction water or COD/residual-derived species. Measure additional applicable atomic exchanges before final dataset completeness"
    source_ids: []
  - rule_id: native_and_evidence
    applies_to: "identity and downstream use"
    rule: "Preserve the broad native identity limitations and classification/wording debts in the reference card and normative context. Exact flow identity does not certify a supplier inventory, geography, emission factor or method approval. Retain source originals, actual supplier/measurement evidence and unresolved matching separately"
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Mass-based input of the same flat drawn PP filament grade/state into subsequent textile conversion"
  allowed_use: "Same declared virgin PP flat intermingled single-bundle industrial yarn with matched grade, colour, site, period, supplied-state kg and upstream links"
  excluded_use: "Universal CPC coverage, POY/DTY/sewing/retail or plied yarn, other polymers, functional/recycled grades, cradle-to-gate without upstream completion, actual delivery claims based solely on production Q"
  required_metadata: "All reference qualifiers; process/boundary; raw/cohort normalization; source/measurement/provider links; WIP and finished-stock burden provenance"
  required_quality_disclosure: "Uncertainty, full-period coverage, mass/element/species closure, raw formulation accounting, native metadata debts, missing quantities/UUID/provider matches and excluded stages"
  update_trigger: "Change in polymer origin, recipe, shape, draw/texturing/twist/ply state, acceptance, packaging, inventory gate, site, utilities, provider or source evidence"
data_sources:
  - id: "chemosvit-pp-2016"
    type: "handbook"
    reference: "Chemosvit Fibrochem, Polypropylene Multifilament Yarn PROLEN Technical Information, June 2016, pp. 1–2; https://prolen.sk/wp-content/uploads/2020/01/Technical-Information-about-PP-Yarn.pdf"
    used_for: "Granulate/masterbatch melt and drawn-flat H/HP branch, distinct textured/twisted branches, sorting/packing; descriptive portfolio only, not batch quantities or acceptance thresholds"
  - id: "chemosvit-pp-list-2024"
    type: "handbook"
    reference: "Chemosvit Fibrochem, PROLEN Yarns Product List and Functionalities, 03/2024 Issue 4, pp. 1–2; https://prolen.sk/wp-content/uploads/2024/04/Prolen%C2%AE-Yarns-Product-ListFunctionalities-2024-1.pdf"
    used_for: "Industrial HP 330 dtex/66 full-circular option, FDY/intermingling identity, bobbin/PE bag/box/pallet wrap and storage; 6000 g is catalogue maximum only; TDS and lot tests needed; portfolio locations are not batch origin or delivery proof"
  - id: "lohia-pp-sdw"
    type: "handbook"
    reference: "Lohia Corp, Multifilament – Spin-Draw-Wind Lines for PP Multifilament Yarn; https://www.lohiagroup.com/products/multifilament"
    used_for: "Independent industrial PP FDY spinning/drawing and filament/intermingling control; integrated equipment capability only, not evidence for the selected separate-stage route, Chemosvit equipment, actual speed, energy or yield"
  - id: "goulston-filament-finish"
    type: "handbook"
    reference: "Goulston Technologies, Filament Spin Finishes; https://www.goulston.com/fiber-filament.php"
    used_for: "Topical filament finish and common aqueous-emulsion application/evaporation; qualitative only, not a selected PP supplier recipe, compatibility certificate, active fraction or dose"
  - id: "ilcd-attributional-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment - Detailed guidance, first edition March 2010, section 7.9.3, printed pp.257-258 (PDF pp.277-278); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation methodology only: determining physical causality, virtual subdivision and residual process-gate market value. No PP recipe, factor, fixed share, substitution credit or universal waste cutoff."
