measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "cp_release weighs accepted net supplied-state yarn using calibrated scales, subtracting measured bobbin and all transport packaging tares; record conditioning, finish and moisture separately. Q contains only unique first quality releases of the declared cohort"
  - id: linear_density
    applies_to: "yarn identity and length conversion"
    required_property_ref:
      name: "Linear density"
      uuid: ""
    required_unit: "dtex; den; m"
    rule: "Measure linear density and filament count independently: dtex is g/10000 m and den is g/9000 m; matched measured length and dtex may cross-check mass but never replace calibrated net release weighing. Linear density is not kg/m3 material density; nominal cone size and catalogue maximum bobbin mass are not Q"
  - id: finish_water
    applies_to: "resin finish yarn and water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain as-received wet mass and separately assayed dry solids/active fraction/free water. State assay denominators. Yarn finish and moisture remain in supplied-state net yarn mass where present; never apply generic regain or remove them without a separately declared conversion. Do not purchase formulation constituents twice"
  - id: meter_units
    applies_to: "utilities and species"
    required_property_ref:
      name: "Energy; volume; mass"
      uuid: ""
    required_unit: "kWh; m3; kg"
    rule: "Retain meter units; 1 kWh = 3.6 MJ. A measured integrated water/gas volume is already a period total and receives no extra time factor. A measured rate uses its matched duration once; gas mass needs independently specified pressure, temperature, composition and conversion. Preserve each measured emission species and medium"
