product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.other-chemical-products-man-made-fibres.drawn-flat-pp-multifilament-yarn"
  classification_refs: "CPC 3.0: 35520, narrower semantic subset; no accepted mapping established"
  covered_products: "Virgin PP mass-coloured full-circular flat drawn continuous multifilament yarn; one yarn bundle, untwisted, air-intermingled; industrial bobbins"
  excluded_products: "POY, textured/bulked yarn, twisted yarn, multiple/cabled yarn, sewing thread, retail yarn, monofilament, slit/fibrillated tape, staple yarn, recycled polymer, hollow/profiled filaments, functional additive speciality grades and polymer blends"
  representative_product: "Flat intermingled PP FDY, represented by the industrial PROLEN HP 330 dtex / 66-filament full-circular option; actual colour and acceptance specification declared per lot"
  production_route: "Virgin PP granulate and colour masterbatch receipt → melting/filtering → spinneret spinning, quenching, finish application and initial winding → separate unwinding/drawing and air intermingling with final take-up → sorting, weighing, packing and first quality release; no downstream texturing or twisting"
  market_state: "Newly quality-released packed industrial bobbin at production release gate; not the quantity actually shipped"
functional_unit:
  what: "Supply a declared flat drawn PP filament intermediate for knitting/weaving conversion"
  how_much: "1 kg newly accepted net supplied-state yarn"
  how_well: "Single untwisted full-circular PP multifilament bundle with actual dtex, filament count, colour, intermingling points, tenacity, elongation, shrinkage, finish and moisture tested to the order/TDS; lot sorting and package identity passed"
  how_long_or_cycle: "One matched production accounting period and same-product/route/state cohort; no service lifetime claim"
  reference_flow_link: "released_yarn"
system_boundary:
  rules:
    - rule_id: route_gate
      applies_to: "manufacture"
      rule: "Include feed receipt, dosing, melt homogenisation/filtering, spinneret spinning, quench-air conditioning, finish preparation/application, initial winding, separate unwinding/drawing, air intermingling, final take-up, sorting, weighing, packing and first acceptance. Intermingling entangles filaments of one bundle; it does not authorize texturing or combining independent yarns"
      source_ids:
        - chemosvit-pp-2016
        - lohia-pp-sdw
    - rule_id: supply_gate
      applies_to: "terminal gate"
      rule: "Q is unique newly positive quality-released packed net yarn kg of this cohort, before any repeated warehouse issue. Unaccepted as-spun or drawn bobbins are WIP, not independent sold POY by assumption; later drawing/texturing cannot be silently added, omitted or counted twice"
      source_ids:
        - chemosvit-pp-2016
        - chemosvit-pp-list-2024
    - rule_id: stock_services
      applies_to: "WIP and finished stores"
      rule: "Retain raw burdens of failed/zero-output periods, start-up, cleaning, rework, returns and all actually included packing, storage, handling and dispatch. Retain opening/closing WIP and their carried burdens. A new-release production account records Q once and never adds closing stock of the same released Q as another product output. Track finished stores and shipments separately with opening/closing kg and carried burdens; cancel internal transfers when accounts are combined. Reaccepted returns never create new Q; an eventual delivery dataset needs its own delivered denominator and undelivered stock burden carryover"
      source_ids: []
    - rule_id: external_internal
      applies_to: "formulations and utilities"
      rule: "Count whole purchased colour masterbatch and whole finish formulation once. Their pigment/polymer/active/carrier-water assays are subledgers, not extra procurement. Count only separately acquired dilution water as an external water input. Count on-site blending losses/energy. On-site compressed air and recirculating cooling water are internal utility transfers; include their measured electricity, make-up, purge and losses once. Add each actually present fuel, purchased heat, cleaner, refrigerant leak, filter consumable or waste as a separate atomic exchange and protocol before dataset completion"
      source_ids:
        - goulston-filament-finish
    - rule_id: physical_chemistry
      applies_to: "mass and release accounting"
      rule: "Melting/solidification and molecular orientation do not create polymerisation water. PP chain growth belongs upstream. Conserve total physical mass and polymer/pigment/finish/water subledgers separately; document actual degradation, oxidation, hydrolysis or other side reactions with independent species evidence when present. Do not infer reaction water, VOC species or an outlet mass from a closure residual or COD. Measure actual species and media; no default zero or generic emission factor"
      source_ids: []
    - rule_id: native_limits
      applies_to: "reference identity"
      rule: "The UUID is a broad PP filament Product flow, production mix at plant, with upstream polymerisation/spinning/drawing wording; no POY/FDY, colour, denier, filament count, supplier, measured yield, recipe, specific country or delivery scope is certified. It has no CAS and an empty geography object. The English aggregation wording and the knitted-fabric class 28190 are disclosed metadata debts; physical PP filament identity agrees across baseNames and comments. Use only this declared narrower flat drawn route, independently verify the virgin resin supply, and review each eventual background provider for actual grade, route, site, period and system boundary"
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased virgin fibre-grade PP granulate already polymerised and stabilised, a single specified PP-carrier colour masterbatch and whole supplied finish at the filament factory receipt"
  starting_condition_role: "Polymer conversion foreground; upstream propylene chain-growth polymerisation remains in resin supply"
  product_classification_scope: "Only the declared nonretail nonsewing single-bundle PP flat filament subset of 35520"
  recursive_input_rule: "Internal melt, as-spun yarn, drawn yarn, returns and rework are lot transfers, not new procurement or extra accepted output. External purchased yarn requires a separately scoped conversion route; do not substitute its mass for PP granulate"
  upstream_dataset_requirement: "Link compatible virgin PP polymerisation/granulate, actual masterbatch and finish formulation, electricity and each packaging supply once; native yarn identity is not a background provider or quantity"
  disclosure: "Gate-to-gate conversion through packed first quality release; disclose actual site, interval, process configuration, upstream links, storage/dispatch inclusion and omissions. Native PP yarn has no locationOfSupply or CAS; its erroneous knitted-fabric classification 28190 does not establish textile construction. The route label is aggregation/spinning/stretching (CN polymerisation/spinning/drawing); polymerisation is upstream here, not an on-site reaction"
