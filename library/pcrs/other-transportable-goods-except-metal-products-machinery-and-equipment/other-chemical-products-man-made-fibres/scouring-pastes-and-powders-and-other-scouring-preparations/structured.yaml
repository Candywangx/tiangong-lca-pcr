      rule: "Include all actual ingredient preparation, powder handling/wetting, dispersion, alcohol addition, quality sampling, filling, closure, cleaning, emission controls, storage and dispatch within the declared gate. Failed or zero-output runs and rework retain burdens; no hypothetical zero dust/VOC."
