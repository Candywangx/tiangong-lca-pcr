allocation_rules:
  - rule_id: allocation_shared
    applies_to: "cream_delivery"
    rule: "Avoid allocation with separate meters and batch/lot tracing first. For genuine shared utility, warehouse and handling burdens retain the measured total, causal driver, all product denominators, fractions summing to1 and sensitivity. Product-specific failed/rework burden stays with its cohort; no unreported loss subtraction."
    source_ids: []
  - rule_id: allocation_returns
    applies_to: "cream_delivery"
    rule: "Internal recovered cream/dust and return/reacceptance are not co-products or new output. Attribute retained burdens with the same persistent cohort ledger. Actual waste treatment is included; any externally saleable co-product requires separate identity, quantity and justified allocation, never an automatic recycling credit."
    source_ids: []
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "cream_delivery"
      flow_role: "ingredient and preparation records"
      record_type: "weighing and supplier records"
      raw_fields: "batch_id; supplier_lot; recipe_version; wet_mass; assay; solids; water; impurities; rejected_charge; opening_raw; closing_raw"
      collection_method: "Owner: formulation technologist. Retain unnormalised receipts, weighed actual consumed charges and raw-stock movements for every eligible run, including failures. Preserve whole preparations and constituent subledgers without duplicate procurement. Confirm natural carbonate, gum/mineral grades and actual denaturants; no patent recipe defaults. Retain raw totals and carry vectors only; calc_normalize is the sole reporting normalisation, not another operation here"
      unit: "kg and actual assays"
      frequency: "Each lot and complete reporting period"
      temporal_coverage: "One matched complete production/stock/delivery period including failed runs and stock carry"
      site_scope: "Actual named manufacturing and delivery sites and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, invoices, original assays, lot links, raw meter/delivery/stock and review records"
    - protocol_id: cp_utilities
      process_id: "cream_delivery"
      flow_role: "actual operating loads"
      record_type: "meter and fuel records"
      raw_fields: "meter_start; meter_end; timestamps; rate; integrated_volume; unit; temperature; density; heating; failed_run_energy; shared_driver"
      collection_method: "Owner: utilities engineer. Keep raw readings and matched operation/cleaning/idle/emission-control/warehouse/handling/dispatch burdens; record actual electric/fuel/heating arrangements. Rates and integrated volumes remain distinct. No division byQ here; collect real conditional-operation inputs and each actual emission species separately. Retain raw totals and carry vectors only; calc_normalize is the sole reporting normalisation, not another operation here"
      unit: "kWh; MJ; kg; m3; h"
      frequency: "Each lot and complete reporting period"
      temporal_coverage: "One matched complete production/stock/delivery period including failed runs and stock carry"
      site_scope: "Actual named manufacturing and delivery sites and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, invoices, original assays, lot links, raw meter/delivery/stock and review records"
    - protocol_id: cp_packaging
      process_id: "cream_delivery"
      flow_role: "each packaging article"
      record_type: "BOM weighing and stock records"
      raw_fields: "article_id; supplier; resin; mass; counts; opening; closing; scrap; reuse; returns; net_fill; tare"
      collection_method: "Owner: packaging engineer. Weigh each actual bottle, closure, label, carton, film and pallet and retain composition/stock/return evidence. Include filling rejects and actual loads. A complete purchased article includes its embedded constituents; no duplicate constituent purchase. Retain raw totals and carry vectors only; calc_normalize is the sole reporting normalisation, not another operation here"
      unit: "kg and count"
      frequency: "Each lot and complete reporting period"
      temporal_coverage: "One matched complete production/stock/delivery period including failed runs and stock carry"
      site_scope: "Actual named manufacturing and delivery sites and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, invoices, original assays, lot links, raw meter/delivery/stock and review records"
    - protocol_id: cp_delivery
      process_id: "cream_delivery"
      flow_role: "net accepted delivery and all stocks"
      record_type: "traceable delivery acceptance and inventory"
      raw_fields: "unique_lot_unit; P_release; gross_delivery; tare; accepted_net; returns; reacceptance; opening_WIP; closing_WIP; opening_FG; closing_FG; burden_vectors; storage_days; dispatch"
      collection_method: "Owner: quality-and-logistics controller. Retain unnormalised measured net deliveries and acceptance/return corrections, separate new releaseP, opening/closingWIP/FG mass and carried burdens, complete same-period release/storage/dispatch logs. Track unique physical units across returns and periods so reacceptance cannot manufacture output; correct earlier claims explicitly. Never include undelivered closingFG inQ. Do not divide any raw numerator here. Retain raw totals and carry vectors only; calc_normalize is the sole reporting normalisation, not another operation here"
      unit: "kg; burden vectors; day"
      frequency: "Each lot and complete reporting period"
      temporal_coverage: "One matched complete production/stock/delivery period including failed runs and stock carry"
      site_scope: "Actual named manufacturing and delivery sites and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, invoices, original assays, lot links, raw meter/delivery/stock and review records"
    - protocol_id: cp_balance
      process_id: "cream_delivery"
      flow_role: "mass species water and wastes"
      record_type: "weighing assays and treatment manifests"
      raw_fields: "opening_mass; receipts; WIP; FG; delivered; wastes; captured_dust; effluent; water_states; elemental_assays; reaction_evidence; uncertainty"
      collection_method: "Owner: process mass-balance engineer. Retain complete raw wet/dry/element/species ledgers and all sampled/wasted/returned material, measured water states and carry burdens. Reconcile physical balances separately from lifecycle burden attribution. If an actual reaction exists obtain independent stoichiometry/speciation and extent evidence; never fit two unknown outlets or reaction water to a shared residual. Retain raw totals and carry vectors only; calc_normalize is the sole reporting normalisation, not another operation here"
      unit: "kg and elemental/species assays"
      frequency: "Each lot and complete reporting period"
      temporal_coverage: "One matched complete production/stock/delivery period including failed runs and stock carry"
      site_scope: "Actual named manufacturing and delivery sites and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, invoices, original assays, lot links, raw meter/delivery/stock and review records"
    - protocol_id: cp_emissions
      process_id: "cream_delivery"
      flow_role: "particulate ethanol water and additional actual species"
      record_type: "source-specific measured emissions"
      raw_fields: "test_location; timestamps; exhaust_rate; integrated_volume; concentration; particle_fractions; mineral_assay; ethanol; denaturant_species; vapour; condensate; capture; uncertainty"
      collection_method: "Owner: environmental measurement engineer. Collect unnormalised measured source concentrations/volumes or justified species-specific factors with original method and time coverage; distinguish captured dust from release, ethanol from other organics, physical water vapour from reaction/structural-water change. Require independent evidence for actual reaction gas/water if present; otherwise no invented species. No missing test becomes zero. Retain raw totals and carry vectors only; calc_normalize is the sole reporting normalisation, not another operation here"
      unit: "kg; mg/m3; m3; h"
      frequency: "Each lot and complete reporting period"
      temporal_coverage: "One matched complete production/stock/delivery period including failed runs and stock carry"
      site_scope: "Actual named manufacturing and delivery sites and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, invoices, original assays, lot links, raw meter/delivery/stock and review records"
  calculation_rules:
    - id: calc_conversion
      applies_to: "physical raw ledgers"
      rule: "Convert each actual raw unit once to its row unit; m=rho_actual(T)*V only with actual solution density. Dry/active/carrier-water subledgers use measured fractions without duplicating external procurement. For a rate use integral(rate dt); integratedV receives no extra time factor."
      inputs:
        - raw_quantity
        - raw_unit
        - measured_density
        - measured_fraction
        - integrated_volume
        - duration
      output: "converted raw ledger"
      source_ids: []
    - id: calc_delivery
      applies_to: "terminal delivered_cream"
      rule: "Q=sum(unique net actually accepted cream deliveries) minus documented returns/corrections not retained as delivered; Q>0. Resolve cross-period return corrections and avoid counting reaccepted units twice. P is separately recorded quality-release mass. Opening/closingFG and WIP retain their own mass and carried burdens; closing undeliveredFG is not Q."
      inputs:
        - "unique accepted net"
        - returns
        - corrections
        - opening_FG
        - closing_FG
        - opening_WIP
        - closing_WIP
      output: "Q in kg and physical stock ledger"
      source_ids: []
    - id: calc_burden
      applies_to: "unnormalised delivery-cohort burdens"
      rule: "For each flow burden retain all raw product-assigned current-period loads D_i, opening carried load O_i and closing carried load C_i; delivered cohort numerator A_i=D_i+O_i-C_i, with documented lot attribution and shared-load allocation. Raw purchases versus consumption retain raw-stock corrections separately. Include failed/zero-output/rework/return, packaging, storage, handling and dispatch loads; carry undelivered/WIP burdens instead of dropping them. Cancel internal cream/dust transfers, never their operating loads. Distinguish current measured physical emissions from historical carried emission burdens."
      inputs:
        - D_i
        - O_i
        - C_i
        - "lot attribution"
        - "shared allocation"
      output: "unnormalised A_i and carry reconciliation"
      source_ids: []
    - id: calc_normalize
      applies_to: "all inventory cards"
      rule: "Report x_i=A_i/Q per1kg net delivered wet cream, once only after calc_conversion, calc_delivery and calc_burden. The terminal cream is Q/Q=1kg. Card Amount rule and protocol aggregation_rule refer to this same reporting operation; collection methods never predivide byQ. Do not divide already normalised vectors again."
      inputs:
        - A_i
        - Q
      output: "x_i per1kg net delivered cream"
      source_ids: []
    - id: calc_physical_closure
      applies_to: "complete physical mass elements and water"
      rule: "For each physical constituent: opening raw+WIP+FG plus external receipts and actual supported reaction/uptake equals delivered+closing raw+WIP+FG+actual waste+actual emissions and independently supported transformations, with sampling/returns and uncertainty explicit. ReleaseP is internal. Maintain C/Si/Ca and water subledgers using actual assays. No balance residual establishes reaction gas, reaction water, evaporation or a COD-derived species."
      inputs:
        - "physical stock and receipts"
        - delivery
        - waste
        - emissions
        - assays
        - "independently supported species"
      output: "separate closure and unresolved residual"
      source_ids:
        - nist-water-phase
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: quality_recipe
      applies_to: "all materials"
      requirement: "Confirm actual whole supply states, all ingredients/denaturants, grades, assays, geography and route. Public lists/patent examples cannot fill unknown recipe proportions or purity."
      evidence: "Supplier originals, process records and complete BOM"
    - id: quality_gate
      applies_to: "reference and burdens"
      requirement: "Require positiveQ, unique accepted delivery ledger and raw numerator/carry reconciliation. Unresolved stock burden or omitted failed runs makes delivery result incomplete."
      evidence: "Lot, return, WIP, finished stock and raw-period audits"
    - id: quality_species
      applies_to: "emissions and water"
      requirement: "Keep detection limits, test coverage and uncertainty; missing is not zero. Independently justify every species/factor and every reaction-water claim; physical evaporation and captured dust remain distinct."
      evidence: "Original source tests, assay and species evidence"
    - id: quality_native
      applies_to: "all selected UUIDs"
      requirement: "Broad reference identity retains every disclosed name/comment/geographic/property limit. Verify auxiliary native identities and supplier providers before dataset production; UUID/schema success is not methodological approval."
      evidence: "Complete exact native originals and provider compatibility evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "delivered_cream"
    rule: "Require exactly one declared terminal Product row consistent with reference UUID,1kg Mass and actual delivery gateQ; no rebranding an intermediate or co-product with the same UUID. Preserve thirteen complete required qualifiers."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "cream_delivery"
    rule: "Each inventory card is one physical exchange. All actual inputs, waste and emission species, operations and carry burdens are complete. Conditional absent exchanges need documented non-applicability; no generic zero VOC/dust, bleach or fragrance added from label."
    source_ids:
      - ecover-cream-supply
      - niosh-carbonate-dust
      - niosh-ethanol-volatility
  - rule_id: validate_accounting
    applies_to: "all ledgers"
    rule: "Verify unit conversions, no repeated normalisation, complete WIP/FG burden carry, returns and shared allocation, physical mass/element closure and independently supported species/reaction-water versus physical evaporation. Unexplained residuals are findings, not fitted emissions."
    source_ids:
      - nist-water-phase
  - rule_id: validate_evidence
    applies_to: "dataset applicability"
    rule: "EPO comparative laboratory cream is not the Ecover formula or factory. No patent speeds, recipe percentages, pH, abrasion, dose or emission factor is imposed. Manufacturer marketing is not functional equivalence; dataset actual recipe, gate and tests control applicability."
    source_ids:
      - omya-cream-dispersion
      - ecover-cream-supply
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Mass-based upstream supply of the explicitly qualified cream at its declared delivery gate"
  allowed_use: "Use with matching SKU chemistry, physical state, supplier route, gate and complete burden accounting"
  excluded_use: "Universal CPC35334 default, soap/surfactant synthesis, bleach/acid product, polishing or cleaning-dose equivalence, pure mineral supply"
  required_metadata: "All required qualifiers, period, route, actual sites, inventory scope, raw ledger owners and source identity"
  required_quality_disclosure: "Reference native classification debt, unresolved auxiliary/provider identities, recipe uncertainty, test limits, stock carry and coverage; no scientific approval inferred"
  update_trigger: "Recipe/grade/supply state, packaging, actual process, gate, source, provider or species evidence changes"
data_sources:
  - id: "ecover-cream-supply"
    type: "literature"
    reference: "Ecover Global, Cream Cleaner, snapshot2026-10-16. https://global.ecover.com/global/products/ecover/cream-cleaner/"
    used_for: "500ml bottle and disclosed ingredient set only. No factory process, proportions, assays, polymer grade/mass, density, location or efficacy factor; usage copy not adopted."
  - id: "omya-cream-dispersion"
    type: "literature"
    reference: "Omya International AG, EP2883573A1,2015-06-17, Example3 paras0130-0133 Table7 comparative Sample10, PDFp14. https://data.epo.org/publication-server/rest/v1.2/publication-dates/20150617/patents/EP2883573NWA1/document.pdf"
    used_for: "Original laboratory wet dispersion/GCC cream process decomposition. Different alkali/thickener/lemon/polysorbate recipe; not Ecover manufacture, industrial rate or numeric default. Samples11/12 surface-reacted mineral excluded."
  - id: "niosh-carbonate-dust"
    type: "official_guidance"
    reference: "NIOSH Pocket Guide, Calcium carbonate, reviewed2019-10-30, snapshot2026-10-16. https://www.cdc.gov/niosh/npg/npgd0090.html"
    used_for: "Independent pure-carbonate powder/dust and natural/synthetic identity context only. Not quartz evidence, emission factor, product density or occupational-limit-based emitted mass."
  - id: "niosh-ethanol-volatility"
    type: "official_guidance"
    reference: "NIOSH Pocket Guide, Ethyl alcohol, reviewed2019-10-30, snapshot2026-10-16. https://www.cdc.gov/niosh/npg/npgd0262.html"
    used_for: "Independent pure-ethanol volatility/species evidence only; not blend loss rate, actual denaturant identity, mixture density or zero VOC."
  - id: "nist-water-phase"
    type: "official_guidance"
    reference: "NIST Chemistry WebBook SRD69, Water, phase change data, snapshot2026-10-16. https://webbook.nist.gov/cgi/cbook.cgi?ID=C7732185&Mask=4"
    used_for: "Independent physical water phase-change context only; no reaction-water stoichiometry, site evaporation or thermal-energy factor."
  - id: "niosh-quartz-dust"
    type: "official_guidance"
    reference: "NIOSH Pocket Guide, Silica crystalline as respirable dust, snapshot2026-10-16. https://www.cdc.gov/niosh/npg/npgd0684.html"
    used_for: "Independent quartz/crystalline-silica particulate identity only; no product emission factor, actual grade, cream density or concentration-limit conversion to emitted mass."
