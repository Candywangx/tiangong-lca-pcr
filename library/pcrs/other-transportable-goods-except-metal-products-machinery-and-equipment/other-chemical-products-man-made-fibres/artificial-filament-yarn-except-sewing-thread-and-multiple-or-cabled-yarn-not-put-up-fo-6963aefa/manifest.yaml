  semantic_deduplication: No material duplicate found. Retail filament rewinding
    starts from finished yarn and ends in retail put-up; multiple/cabled
    assembly ends in excluded construction; textile processing and fabrics have
    a different terminal object; artificial prepared staple rules do not
    manufacture uncut continuous yarn. Same-batch 35540 uses NMMO lyocell
    staple, chemically and physically distinct. Promote only retained
    unpublished 35550 scaffold to narrower undyed bright single continuous
    viscose yarn, actual delivery gate; no accepted mapping is created.
  native_reference_limitations: Generic manufactured finished Product flow,
    production mix at plant. No CAS/geography/locationOfSupply/fixed
    route/grade/titre/conditioning/supplier. All UUID-bearing card descriptions
    preserve these limitations in both languages. Exact Mass and unit-group
    versions were verified before kg selection.
