measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use 1 kg net delivered yarn at one declared conditioning/moisture/finish basis, excluding tube and all packaging tare. Record actual moisture and retained spin finish; do not silently report dry cellulose as conditioned yarn."
  - id: titre_check
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "dtex means grams per 10000 m; mass_kg = dtex * length_m / 10000000 only for the same verified conditioning, finish and net-yarn basis. Filament count does not multiply total yarn titre again; use weighing as the controlling net-delivery record and treat unsupported length conversion as a gap."
  - id: supplied_form
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass; Energy"
      uuid: ""
    required_unit: "kg; kWh; MJ"
    rule: "Whole commercial solutions/emulsions/pulp cross the boundary at actual supplied mass; active solute, cellulose and water are subledgers. Convert raw units before the single normalize_delivery operation. Integrate a rate over duration; never multiply already integrated volumes by time. Density, heating value and assay require independent actual-condition evidence, not an unrelated native property factor."
