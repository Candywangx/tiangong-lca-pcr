allocation_rules:
  - rule_id: allocation_internal
    applies_to: "foreground_burden_allocation"
    rule: "Recovered CS2, liquor and wash water reused inside the boundary receive no avoided-production credit; retain all recovery burdens and cancel internal exchanges on consolidation."
    source_ids:
      - jrc-polymers-2007
  - rule_id: allocation_salt
    applies_to: "foreground_burden_allocation"
    rule: "First separate actual salt-recovery/finishing-specific burdens and any other independently produced coproduct. For remaining common burdens document the defensible physical relationship; if none is established, use transparent contemporaneous market-value shares at the common process gate for actual marketable outputs with sensitivity analysis. Do not impose a numeric split, claim substitution, allocate to internal cycles or label untreated waste as a coproduct."
    source_ids:
      - jrc-polymers-2007
      - enka-industrial-recovery
      - ilcd-attributional-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "viscose_line"
      flow_role: "Whole supplied materials and internal recovery subledgers"
      record_type: "receipt, weighbridge, tank and assay records"
      raw_fields: "lot; supplier; supplied mass; assay; carrier water; pulp dry solids; opening/closing chemical tanks; internal recovered amount and composition; failed runs; WIP masses and historical exchange vectors"
      collection_method: "Owner: production materials accountant with laboratory verification. Collect unnormalised actual period receipts/consumption/stock changes and complete formulation masses for every matched campaign, including failed/zero-release runs and rework. Keep assays and water as composition subledgers; collect internal streams and carried WIP burdens separately. Do not divide by P or Q during collection."
      unit: "kg"
      frequency: "each batch and reconciled reporting period"
      temporal_coverage: "complete matched production campaigns plus opening WIP history"
      site_scope: "actual production plant and suppliers, separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weights; invoices; CoA; tank reconciliation; batch genealogy"
    - protocol_id: cp_utilities
      process_id: "viscose_line"
      flow_role: "Actual line and auxiliary utility burdens"
      record_type: "meter and operating logs"
      raw_fields: "operation/submeter; raw electricity; steam flow/enthalpy; condensate; integrated gas volume or rate series; reference temperature/pressure; independent density/heating value; timestamps; failed-run/standby loads; WIP burden vectors"
      collection_method: "Owner: utilities engineer. Retain each unnormalised energy/volume numerator across production, vacuum, washing/drying, cooling, recovery, effluent pretreatment and any coproduct drying. Keep gross supply/returns and submeter reconciliation; collect actual failed/zero-output and rework energy plus opening/closing WIP carry. No collection-side normalization."
      unit: "kWh; MJ; m3"
      frequency: "continuous meters; whole matched campaign"
      temporal_coverage: "same production/WIP intervals as cp_materials"
      site_scope: "actual utility boundary and provider; no default ENKA CHP"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; energy invoices; temperature/pressure; condensate and utility balance"
    - protocol_id: cp_release
      process_id: "viscose_line"
      flow_role: "New acceptance P and production/WIP genealogy"
      record_type: "quality release and rejected-batch ledger"
      raw_fields: "unique lot/package; actual P net kg; failed/rejected run; return/rework origin; conditioning T/RH/time; moisture; finish; titre; filament count; tube tare; opening/closing WIP quantities and exchange vectors"
      collection_method: "Owner: quality release officer. Weigh accepted new yarn net of tare at the declared conditioning basis and retain complete failed/off-grade records. Track recovered/reworked material through original IDs; returned yarn reinspection is not new P. Collect unnormalised P, all WIP masses, original carried burdens and internal transfer receipts, without adding closing finished stock to P or dividing by Q."
      unit: "kg; dtex"
      frequency: "each release/rejection; reconciled period"
      temporal_coverage: "complete campaigns including zero-positive-output periods"
      site_scope: "same manufacturing line and physical package IDs"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed quality release; calibrated net weights; moisture/finish tests; full reject genealogy"
    - protocol_id: cp_recovery
      process_id: "viscose_line"
      flow_role: "Recovery, coproducts, actual species and environmental exits"
      record_type: "stream assay, gas monitoring and transfer notes"
      raw_fields: "stream ID; raw mass/volume; gas flow and species concentrations; CS2/H2S separately; C/S/Na/Zn assay; wastewater composition; COD as indicator; salt hydrate/purity; sludge solids; free/structural water; independently evidenced reaction extents/water; opening/closing recovered-stream stocks; receiver"
      collection_method: "Owner: environmental/recovery engineer with analytical laboratory. Collect unnormalised inlet/outlet/recycle masses, actual species and water evidence independently, including abatement consumables, energy, wastes and external treatment burdens. Use concentration times matched integrated volume or rate integration with stated gas conditions; no extra duration factor on integrated volume. Do not infer reaction water or an unknown exit from a second unknown closure."
      unit: "kg; m3; mg/m3"
      frequency: "matched sampling/continuous monitoring and each transfer"
      temporal_coverage: "all matched campaigns, upset periods and recovery stock history"
      site_scope: "actual collection/recovery units and effluent receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling/QC; calibration; actual reaction/species evidence; elemental/water closure; receiver treatment receipt"
    - protocol_id: cp_delivery
      process_id: "dispatch"
      flow_role: "Actual unique supplied Q and finished-stock carry"
      record_type: "dispatch/acceptance and finished-stock genealogy"
      raw_fields: "physical lot/package; P receipt; gross shipments G; accepted returns R; unique accepted net delivered Q; opening/closing finished kg; carried exchange vectors; stock withdrawal/scrap; conditioning/moisture/finish; package tare"
      collection_method: "Owner: dispatch controller with stock accountant and customer acceptance records. Collect unnormalised actual deliveries/returns, opening/closing stock masses and historical exchange vectors matched to this route/grade/state. Weigh net yarn excluding all tare; distinguish shipment event from unique accepted physical output and do not count repeated reshipments twice. Retain P separately; do not assume P equals Q or treat undelivered stock as delivery. Returns restore the original carried burden and correct the original accepted-supply cohort when already counted; subsequent reinspection/reshipment is never a second positive output. No collection-side division."
      unit: "kg"
      frequency: "each dispatch/acceptance/return and opening/closing stocktake"
      temporal_coverage: "declared actual delivery cohort and all preceding carried production/stock periods"
      site_scope: "producing-site dispatch gate; route/grade/state matched stock"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "dispatch acceptance; calibrated tare/net record; returns/stock reconciliation; historical burden provenance"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "Warehouse packaging handling returns and dispatch burdens"
      record_type: "meters, package receipts and dwell/handling logs"
      raw_fields: "actual carton/tube/film mass; tube reuse and returns; stock dwell; conditioning energy; handling energy; dispatch energy; failed dispatch/rework; packaging wastes and receivers; opening/closing burden vectors; opening/closing empty and attached-to-WIP/finished-stock packaging kg by article; packaging kg leaving with gross physical shipments; external reusable-packaging returns received/sent kg"
      collection_method: "Owner: warehouse operations engineer. Collect complete unnormalised actual packaging, storage, conditioning, handling, returns/rework and dispatch burdens for matched stock histories, including failed deliveries. Split each physical material/fuel/waste and actual provider separately. Keep allocation to dispatched versus closing stock explicit; do not delete incurred loads or divide during collection. Keep a separate physical ledger for each packaging article: opening empty/attached stock plus external receipts and returns received equals closing empty/attached stock plus packaging carried out with gross physical shipments, reusable packaging sent back outside and actual waste. Cancel internal reuse transfers. Use independently weighed article/tare masses and traced package IDs; associated packaging outflows are neither extra yarn Q nor automatically coproducts. Keep these physical quantities separate from allocated burden vectors."
      unit: "kg; kWh; MJ"
      frequency: "each operation and complete inventory interval"
      temporal_coverage: "same delivered/closing-stock cohorts as cp_delivery"
      site_scope: "actual warehouse and dispatch equipment; no downstream external distribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "package weights; energy/dwell logs; allocation reconciliation; waste treatment receipts"
  calculation_rules:
    - id: match_cohort
      applies_to: "all inventory rows"
      rule: "Build raw attributable exchange vectors before normalization: released-production burdens carry opening WIP plus complete actual-period inputs/loads including failed and rework runs, less closing WIP carried to future production, with actual coproduct allocation. Delivery burdens carry opening finished-stock exchange vectors plus new released vectors plus actual warehouse/packaging/handling/returns/dispatch loads, less closing finished-stock carried vectors and separately traced other destinations. Cancel internal P and recycle transfers; do not sum the same inherited vector twice. Physical raw stock reconciliation is separate: opening finished mass + new P + physical return receipts + independently measured moisture/finish gains = gross physical dispatch + closing finished mass + actual scrap/other exits + independently measured moisture/finish losses. Reconcile all terms on the declared component/conditioning basis; document uncertainty without inventing a residual water exchange; Q is unique positively accepted net supply from those events, not automatically gross dispatch or P."
      inputs:
        - opening_wip_vectors
        - raw_period_vectors
        - closing_wip_vectors
        - opening_finished_vectors
        - new_released_vectors
        - dispatch_vectors
        - closing_finished_vectors
        - other_destinations
        - cp_release
        - cp_delivery
      output: "attributable_raw_vectors"
      source_ids:
        - jrc-polymers-2007
        - enka-filament-products
        - enka-industrial-recovery
    - id: normalize_delivery
      applies_to: "all inventory rows"
      rule: "For each external exchange, divide the matched attributable raw amount from match_cohort by actual positive accepted delivered net yarn mass Q in kg, exactly once, after raw unit conversions. The inventory amount expression and collection aggregation reference this same reporting operation, not sequential divisions. Terminal delivered_yarn is Q/Q = 1 kg; released_yarn and stock_yarn retain equal measured P transfer quantities per the same Q and cancel on consolidation. If Q is zero, report the failed/stock-building interval and carry its burdens to the eligible cohort; never divide by zero or silently discard it."
      inputs:
        - attributable_raw_vectors
        - Q
        - cp_delivery
      output: "exchange amount per 1 kg reference flow"
      source_ids:
        - enka-filament-products
    - id: physical_species_water
      applies_to: "viscose_line; dispatch"
      rule: "Reconcile complete unnormalised stream masses and C/S/Na/Zn separately from LCA allocation. Track cellulose solids, solutes, moisture, finish, recovered streams, wastewater, residues, actual gas species and stocks. Free water, condensate, evaporation and Na2SO4 hydrate crystal water are separate from net chemical water. Reaction-water formation/consumption requires independent actual chemistry, assays and reaction-extent evidence; no mandatory numeric amount or closure-derived species. A stated analytical uncertainty remains a gap, not an invented sink."
      inputs:
        - raw_stream_masses
        - elemental_assays
        - actual_species
        - independently_evidenced_reaction_extents
        - cp_recovery
        - cp_release
        - cp_delivery
      output: "raw physical reconciliation and unresolved uncertainty"
      source_ids:
        - jrc-polymers-2007
  data_quality_requirements:
    - id: identity_basis
      applies_to: "reference and all stock"
      requirement: "Same viscose route, undyed bright grade, single continuous-filament construction, conditioning/moisture/finish and supply gate across both languages and every accepted cohort; no substituted staple yarn, polymer or generic mixed route."
      evidence: "CoA; route declaration; net weights; native limitations in cards"
    - id: complete_carry
      applies_to: "all inventory rows"
      requirement: "Retain raw actual periods, failure/zero-output, WIP and finished-stock mass/exchange-vector carry, returns/rework, positive unique Q and P separately; inability to substantiate historical stock burdens prevents a complete delivered dataset."
      evidence: "cp_materials; cp_utilities; cp_release; cp_delivery; cp_dispatch"
    - id: source_limits
      applies_to: "evidence and providers"
      requirement: "JRC 2007 process examples and ENKA product/2023 comparison establish bounded technical context, not current inventory values or a complete same-SKU dataset. Declare current plant/provider/geography and all deviations. No BREF batch/integrated wash range, ENKA tick or hypothetical environmental claim becomes a measured exchange."
      evidence: "primary source scope; current foreground records; supplier matching"
    - id: species_closure
      applies_to: "recovery and physical ledgers"
      requirement: "Verify all gas/liquid environmental outlets, independent actual species and reaction-water evidence, elemental balance and treatment destination; no COD-to-organics or residual fit. Do not duplicate external wastewater treatment emissions."
      evidence: "cp_recovery; analytical QA; treatment receipts"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm single continuous viscose xanthate yarn and the declared actual delivery gate; reject excluded routes/forms and missing qualifiers. Generic native identity does not establish factory or supplier compatibility."
    source_ids:
      - jrc-polymers-2007
      - enka-filament-products
  - rule_id: validate_mass_stock
    applies_to: "foreground_dataset_conformance"
    rule: "Check P/Q distinction, full WIP/finished-stock carried vectors, complete failed/rework loads, unique positive accepted delivery and tare/moisture/finish consistency. Reinspection/reshipment cannot create new production or duplicate Q; no closing finished stock is added as production output."
    source_ids:
      - enka-filament-products
  - rule_id: validate_normalization
    applies_to: "foreground_dataset_conformance"
    rule: "Check raw unit conversion, match_cohort and one normalize_delivery operation only. Reject a second division, unsupported density/heating value, double-counted formulation constituents, copied yields or unsupported gas integration. All applicable measured amounts and actual optional auxiliaries must be present before dataset use."
    source_ids:
      - jrc-polymers-2007
  - rule_id: validate_physical
    applies_to: "foreground_dataset_conformance"
    rule: "Check unnormalised mass/element/species/water closure independently of allocation and normalization, with real outlets and separate recovery stocks. Unknown reaction water and unknown outlet cannot share a fitted residual; retain and resolve material uncertainty."
    source_ids:
      - jrc-polymers-2007
published_dataset_profile:
  dataset_role: "foreground production-and-dispatch inventory"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supplier-matched delivered single viscose continuous-filament yarn for downstream textile modelling after completeness checks"
  excluded_use: "Retail winding, folded/cabled yarn, sewing thread, tow/staple, lyocell/acetate/cupro, synthetic yarn, tyre cord, generic all-artificial yarn average; no claim of methodology approval"
  required_metadata: "Actual plant/geography, route/grade/titre/filaments, conditioning/moisture/finish, net delivery Q and separate release P, stock and WIP genealogy, reporting cohorts, providers, allocation and source dates"
  required_quality_disclosure: "Measurement uncertainty, historical carried burdens, missing auxiliary UUID/provider matches, evidence limits, actual optional operations, physical balance gaps and incomplete scope"
  update_trigger: "Route, product state, conditioning, provider, recovery/treatment, supply gate, stock attribution or source evidence changes"
data_sources:
  - id: "jrc-polymers-2007"
    type: "official_guidance"
    reference: "European Commission, August 2007, Reference Document on Best Available Techniques in the Production of Polymers, §§11.2.1/11.2.3/11.3, Figure 11.1, §§12.7.2–12.7.7. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf"
    used_for: "Industrial xanthate filament route, no staple-cut substitution, bath chemicals, recovery, gas/liquid outlets, salt and zinc treatment. Historical example concentrations, rates, recovery efficiencies and washing ranges are not defaults; separate actual species/water evidence is required."
  - id: "enka-filament-products"
    type: "literature"
    reference: "ENKA, Viscose filament yarns, manufacturer product page. https://www.enka.de/en/products/"
    used_for: "Primary commercial continuous-filament yarn, titre/filament distinctions and textile use. Product family is not a measured SKU, full recipe or conditioning/moisture/finish/tare specification; catalogue examples are not numeric constraints."
  - id: "enka-industrial-recovery"
    type: "literature"
    reference: "ENKA, Sustainability, production and recovery sections. https://www.enka.de/en/sustainability/"
    used_for: "Primary wood-pulp conversion, material cycles, salt coproduct, wastewater treatment and energy context. Swedish pulp/Domsjö supply and Obernburg CHP describe that supply chain only, not generic plant geography/provider or zero-carbon proof. No generic recovery factor, allocation or reaction-water rate."
  - id: "enka-consumption-context"
    type: "literature"
    reference: "ENKA, Consumption & emission values, 24 October 2024; data 2023, one-page table and footnotes 1–3. https://www.enka.de/wp-content/uploads/2024/10/ENK_1825_20241024_Consumption-Emission-values.pdf"
    used_for: "Industrial spin finish, zinc and washing counterevidence. BREF comparator is batch washing; ENKA cells are qualitative ticks, with higher-zinc and proprietary-washing exceptions. Ambiguous Hydrogene Sulphate is not acid identity evidence. No table number/tick is copied as a foreground amount, yield or QA range."
  - id: "ilcd-attributional-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment - Detailed guidance, first edition March 2010, section 7.9.3, printed pp.257-258 (PDF pp.277-278). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation method only: separate specific burdens, determining physical causality before residual common-process-gate market value. No viscose factor, fixed share, substitution credit, waste cutoff or recipe."
