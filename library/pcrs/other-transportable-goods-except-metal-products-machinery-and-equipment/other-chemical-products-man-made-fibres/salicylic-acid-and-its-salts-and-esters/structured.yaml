  calculation_rules:
    - id: delivery_cohort
      applies_to: "delivered_salicylic_acid"
      rule: "Q = sum of unique positive actual net delivered/accepted mass for the matched cohort, with returns reversing original deliveries. Reconcile physical events using FG_close = FG_open + Released + Returns_in - Deliveries_out - Rework_out - Losses. Release is not delivery; undelivered stock and its burdens remain at close; reacceptance creates no new production."
      inputs:
        - cp_gate
      output: "Q; physical finished-stock ledger"
      source_ids: []
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Retain original quantities and units first. Use actual measured liquid mass or volume with an applicable density; convert gas mass using actual composition, temperature, pressure, wet/dry basis and compressibility. Never multiply integrated volume by time; integrate rates over matching durations. Constituent subledgers only decompose whole formulations without new procurement."
      inputs:
        - cp_materials
        - cp_utilities
        - cp_emissions
      output: "R_i in each declared numerator unit"
      source_ids: []
    - id: stock_burdens
      applies_to: "all inventory rows"
      rule: "A_i = B_openWIP_i + B_openFG_i + R_i - B_closeWIP_i - B_closeFG_i - B_other_i. Terms are undivided burden vectors for the same exchange component. R_i retains the full period including failed/zero-output runs, losses, rework, storage/packing/dispatch and treatment. B_other_i is only independently evidenced attribution to other products, not an arbitrary credit. Stock carry needs genealogy and evidence; do not retain production burdens and charge the same stock again. Cancel same-cohort production/warehouse transfers on consolidation. This is burden attribution, not the current-period physical input/output mass ledger."
      inputs:
        - cp_gate
        - cp_materials
        - cp_utilities
        - cp_packaging
        - cp_waste
        - cp_emissions
      output: "A_i; documented burden-carry ledgers"
      source_ids: []
    - id: normalize_delivery
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q, reported per 1 kg reference flow only when Q>0. This is the sole normalization operation; inventory cards and protocol aggregation_rule describe this report without another division by Q. A zero-delivery period retains raw burdens and stock carry; it neither invents unit inventory values nor erases failed burdens."
      inputs:
        - A_i
        - Q
        - cp_gate
      output: "a_i per 1 kg reference flow"
      source_ids: []
    - id: physical_species
      applies_to: "all inventory rows"
      rule: "Independently reconcile complete wet physical mass and C/H/O/Na/S elements: opening plus actual external inputs equals actual external outputs plus closing, with internal circulation cancelled. Separately verify chemical water formation/consumption using independent species and reaction-extent evidence, distinguishing formulation carrier water, dissolution/wash water, free/structural water and phase transfer. This method supplies no reaction-water coefficient: patent dehydration is not formation measurement, and suspension hydrolysis experiments show condition dependence without transferability. Sulfuric acidification of salicylate cannot use a generic water-per-neutralisation template. Unknown reaction water and an unknown outlet cannot both be fitted to one residual; COD/TOC are not species. Investigate and disclose closure differences."
      inputs:
        - cp_materials
        - cp_gate
        - cp_waste
        - cp_emissions
      output: "independent physical/element and species/water ledgers"
      source_ids:
        - jansen-salicylic-1983
        - jrc-ofc-2006
        - mohammad-kolbe-2024
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "reference product"
      requirement: "Require the same actual technical solid free acid and exact native reference-property chain. A broader manufactured finished Product is usable only when complete native information has no true chemical, form, grade or route contradiction and independent evidence establishes the single acid CAS 69-72-7 qualifiers; missing native CAS is not a verified CAS. Reject actual salt/ester, isomer, mixture or crude wet-cake substitution and independently verify supplier and actual specification."
      evidence: "Complete native identity, exact reference chain and actual single-product specification"
    - id: period
      applies_to: "all inventory rows"
      requirement: "Retain real period, cohort, failures/rework, stock/burden transfers, raw conversions and sole normalization evidence; unmeasured cannot be zero."
      evidence: "Protocol original ledgers and calibration"
    - id: species
      applies_to: "all inventory rows"
      requirement: "Conservation checks, actual species and reaction-water evidence are independent; disclose closure differences, detection limits, geographic/temporal and provider/receiver mismatches."
      evidence: "Independent sampling/reaction evidence and complete reconciliation"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Confirm technical solid free acid CAS 69-72-7, no-organic-solvent/H2SO4 route, actual specification and supplied moisture. reference_flow_link uniquely selects delivered_salicylic_acid, the same physical row in both languages. The broader UUID binding is not scientific approval; verify complete native limits and the actual single-product qualifiers, and reject use if a true contradiction or identity gap remains."
    source_ids:
      - alta-salicylic-technical
      - jansen-salicylic-1983
  - rule_id: validate_inventory
    applies_to: "all inventory rows"
    rule: "Check atomic exchanges, direction, type, whole formulation, units and protocol owner. Retain complete native name components, absent CAS, GLO/at-plant limits and supply-geography uncertainty. UUID or Schema correctness does not prove provider-burden compatibility."
    source_ids: []
  - rule_id: validate_ledger
    applies_to: "sa_delivery"
    rule: "Prove delivery Q is distinct from release/stock and opening/closing WIP/finished burdens are complete and counted once. Retain actual failures/zero-output, rework, storage/packing/handling/dispatch and waste treatment. Check sole normalization and independent physical/element and species/water evidence; unknown is not zero."
    source_ids:
      - jrc-ofc-2006
      - mohammad-kolbe-2024
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Route-specific technical solid-acid gate data only after reference identity and dataset-quality gaps are resolved"
  allowed_use: "Same product/state/route with declared geography/time, actual supply specification and verified provider/receiver matching"
  excluded_use: "Salt/ester/isomer or drug-formulation substitution; efficacy/dose/pharmacopoeial approval; automatic carbon-removal credit; treating draft as approved methodology"
  required_metadata: "Identity and actual reference gate; period/cohort; raw stocks/burden carry; supply specification; utilities; packaging; treatment and provider/receiver evidence"
  required_quality_disclosure: "Broader native reference and independent single-free-acid qualifiers; auxiliary UUID/provider matching; native phenol limits; species/water evidence and closure differences; missing measurements/uncertainty; pending scientific review"
  update_trigger: "Changed reference identity, route, acidifying reagent, grade/moisture, feed formulations, energy, site/period, packaging, waste receiver or measurement evidence"
data_sources:
  - id: "jansen-salicylic-1983"
    type: "literature"
    reference: "Jansen and Wolff. Chemical process. US4376867A (1983-03-15), original patent PDF pp. 2–3, columns 1–4. https://patents.google.com/patent/US4376867A/en"
    used_for: "Process evidence for salt formation, dehydration, CO2 carboxylation, sulfuric precipitation, isolation and by-acid/mother-liquor losses; historical process examples, not proof of a current supplier route, universal yield, recipe, reaction-water coefficient or emission factor."
  - id: "alta-salicylic-technical"
    type: "literature"
    reference: "Alta Laboratories Ltd. Salicylic Acid, Technical Grade product table, snapshot 2026-10-16. https://alta.in/salicylic-acid/"
    used_for: "Technical coarse powder, CAS 69-72-7, 2-hydroxybenzoic acid and bagged supply identity. Actual route, bag material and universal assay are not established; repeated pharmacopoeial labels in the technical table and webpage efficacy claims are not adopted."
  - id: "jrc-ofc-2006"
    type: "official_guidance"
    reference: "European Commission JRC. Reference Document on Best Available Techniques for the Manufacture of Organic Fine Chemicals (August 2006), printed pp. 380–381, sections 5.2.1 and Table 5.1. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/ofc_bref_0806.pdf"
    used_for: "Chemical waste-stream origins, balances, actual composition and operating-mode/species monitoring guidance; no universal salicylic-plant recipe, reaction-water or emissions factors, and COD/TOC are not molecular species."
  - id: "mohammad-kolbe-2024"
    type: "literature"
    reference: "Mohammad, Onwudili and Yuan. Potential Large-Scale CO2 Utilisation for Salicylic Acid Production via a Suspension-Based Kolbe–Schmitt Reaction in Toluene. Molecules 29 (2024), 2527, section 2.2.1 and Scheme 4. https://doi.org/10.3390/molecules29112527"
    used_for: "Independent hydrolysis experiments and species counterevidence under toluene-suspension, added-water laboratory conditions. Used only to reject treating phase transfer or a universal template as actual reaction water; route, quantities, yields and side-reaction fractions do not transfer."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance, first edition March 2010, §7.9.3, printed pp.257–258 (PDF pp.277–278). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Only the declared attributional context in which allocation is required: virtual subdivision, exchange-specific determining physical causality and only then contemporaneous market values of genuine residual co-functions in their actual condition at the same process exit. Supports allocation method, not this product’s industrial route, recipe, measured quantities, fixed shares, substitution credits or scientific approval; it does not literally prescribe this PCR stock/cohort implementation."
