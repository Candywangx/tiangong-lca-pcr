      applies_to: "sa_delivery"
      rule: "Identify actual waste origins and composition before matching receiver treatment. External contaminated-water transfer is a waste exchange, not simultaneously a direct water emission. For onsite treatment include actual chemicals, energy, sludge and post-treatment species, expanding atomic rows rather than substituting pollutant totals for species."
