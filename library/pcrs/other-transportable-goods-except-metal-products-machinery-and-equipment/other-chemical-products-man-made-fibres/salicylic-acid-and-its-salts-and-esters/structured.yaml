      rule: "Keep quality release and delivery in separate ledgers. Bring opening finished goods and WIP with carried burdens; retain undelivered closing stock and its burdens for later periods. Never presume release equals delivery or add same-batch closing finished goods as another reference output. Retain actual storage/dispatch burdens rather than dropping them through a gate change."
