      rule: "Retain salt formation, dehydration, carboxylation, phenol recovery, sulfuric precipitation, filtration/washing/drying, quality release, actual storage/packing/handling/dispatch, cleaning and actual abatement. Include start/stop, failed/zero-output and rework operations. If subdivided, match transfer amount, composition and burdens and cancel internal exchanges on consolidation."
