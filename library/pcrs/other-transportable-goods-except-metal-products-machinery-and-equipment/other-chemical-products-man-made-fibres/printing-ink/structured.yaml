allocation_rules:
  - rule_id: al_trace
    applies_to: "all inventory rows"
    rule: "Trace physical lots and causal service use before allocation. Retain every failed/zero-output run, test, cleaning and rework burden attributable to the selected product cohort. Assign shared services by measured machine time/load or another documented physical driver; never dilute with other colours or routes. No patent output yield is assumed."
    source_ids:
      - epa-eiip-ink-manufacture-2005
  - rule_id: al_stock
    applies_to: "manufacture; delivery"
    rule: "Maintain separate WIP, production-transfer and finished-stock ledgers and carried burden vectors by lot. Production transfer P is paired with its receipt, then cancelled in consolidation. Do not count P plus closing stock as two production outputs. Q remains actual net delivery; closing undelivered stock and its burdens are carried, never included in Q or granted an avoided-production credit. Opening stock delivered now brings its historical burdens."
    source_ids:
      - epa-eiip-ink-manufacture-2005
  - rule_id: al_returns
    applies_to: "delivery; cleaning"
    rule: "Link every return/reacceptance/rework event to its original lot and delivery. A return cancels the relevant delivery contribution and restores traceable stock and carried burdens; a later handover enters net delivered Q only after that cancellation, never as a second unique delivery. Returned reacceptance is not new production. Disclose cross-period reconciliation; nonpositive Q cannot be normalized. Captured residues or solvents are wastes unless actual coproduct functionality and receiving system are separately demonstrated; no default substitution credit."
    source_ids:
      - epa-eiip-ink-manufacture-2005
dataset_production:
  collection_protocols:
    - protocol_id: cp_manufacture
      process_id: "manufacture"
      flow_role: "Material, WIP, P and rejects"
      record_type: "batch ledger"
      raw_fields: "lot; product/route/state; period; full supplied vehicle/pigment/toluene issues and returns; active/solvent/water assays; opening/closing WIP masses and carried burdens; P transfers; failures/zero output; rework links; beads/filter consumed; rejects and receivers"
      collection_method: "Owner: production/material-accounting lead. Calibrated weighing, issue/return slips, batch/QC sheets and opening/closing WIP counts; pair P by lot with delivery receipt. Retain all runs, including failed and zero-output runs. Retain undivided raw period numerator records, conversions and carried WIP/finished-stock burden vectors; do not execute A/Q during collection."
      unit: "kg"
      frequency: "Each batch and stock close"
      temporal_coverage: "Complete actual period plus historical carry records"
      site_scope: "Selected ink line and causal shared services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scales; batch identity; assays; stock/burden ledger; acceptance and disposal receipts"
    - protocol_id: cp_delivery
      process_id: "delivery"
      flow_role: "Finished stock, drums, Q and returns"
      record_type: "delivery stock ledger"
      raw_fields: "lot; P receipt; opening/closing finished mass and carried burdens; drum tare/closure; filled gross/net; accepted dispatch event; returns/original event; reacceptance; storage residence/handling/filling loads; spills/expiry and receiver; positive net Q; after-control filling/storage toluene concentrations and measured integrated gas volumes"
      collection_method: "Owner: warehouse/dispatch controller. Use calibrated gross-minus-tare and signed factory-gate handover/return documents, unique event IDs and physical stock reconciliation; quality release alone is not delivery. Trace returns across periods and restored burdens; no reacceptance creates output. Retain actual included storage, packaging, handling and dispatch burdens. The environmental monitoring lead provides independent species/air-medium and control evidence for filling/storage/dispatch releases, including fugitive sources; no closure residual substitutes for measurement. Retain undivided raw period numerator records, conversions and carried WIP/finished-stock burden vectors; do not execute A/Q during collection."
      unit: "kg; event; residence time"
      frequency: "Each handover/return and stock close"
      temporal_coverage: "Complete actual period and returned-lot history"
      site_scope: "Declared factory-gate handover; selected lots only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Net weight/tare; signed receipts; unique IDs; physical stocks; historical burden vectors"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "Purchased electricity for whole declared system"
      record_type: "meter record"
      raw_fields: "period; opening/closing kWh; submeter; voltage; CN provider/grid period; machine hours/load; milling/cooling/extraction/filling/storage/handling/cleaning allocations; historical stock energy burden"
      collection_method: "Owner: site energy engineer. Meter all included operations once and reconcile shared meter allocation without duplicating downstream row purchases; retain raw kWh, use mu_energy for MJ. A different voltage or country requires a compatible identity, not silent reuse of the CN below-1-kV native row. Retain undivided raw period numerator records, conversions and carried WIP/finished-stock burden vectors; do not execute A/Q during collection."
      unit: "kWh; MJ"
      frequency: "Continuous meters and each reporting close"
      temporal_coverage: "Same complete period, plus carried-stock energy"
      site_scope: "All included operations at selected site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; voltage; bills; causal allocation and no double counting"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "Manufacturing toluene and PY12 dust to air"
      record_type: "species monitoring"
      raw_fields: "species/CAS; medium; source; sampled concentrations; measured flow rates and duration or integrated volume; standard conditions; stack/fugitive split; capture; control inlet/outlet; retained solvent in ink/stocks/wastes; dust composition/size; detection limits"
      collection_method: "Owner: environmental monitoring lead. Retain independently supported species masses using measured concentrations and appropriately integrated gas volumes, or a verified species-specific model with all retention paths. Separate captured waste from air releases, do not infer pollutant mass from a total-mass or COD residual. Record actual high-impact impurity species as additional separate rows if present. Retain undivided raw period numerator records, conversions and carried WIP/finished-stock burden vectors; do not execute A/Q during collection."
      unit: "kg; concentration; gas volume"
      frequency: "Representative source campaigns linked to actual batches and period"
      temporal_coverage: "Whole actual period including start-up/failure/cleaning interface"
      site_scope: "Manufacturing sources only; cp_cleaning handles disjoint cleaning sources"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Laboratory reports; species/medium; detection limits; gas integration; uncertainty"
    - protocol_id: cp_cleaning
      process_id: "cleaning"
      flow_role: "Cleaning inputs, liquid/solid waste and cleaning emissions"
      record_type: "cleaning and transfer record"
      raw_fields: "event/lot; fresh toluene; water mass or volume/density/temperature; dry wipe; return loop; spent liquor/washwater/used filter/used wipe gross and composition; retained solvent/water; tank opening/closing; recipient/treatment; actual after-control cleaning toluene emission evidence"
      collection_method: "Owner: cleaning and waste coordinator. Weigh fresh supply and each separate captured liquid/solid stream; record receiving facility and actual treatment. Keep independent species analysis and cleaning source measurements with no overlap with cp_air. Closed circulation is internal; no automatic recovery yield or substitution credit. Retain undivided raw period numerator records, conversions and carried WIP/finished-stock burden vectors; do not execute A/Q during collection."
      unit: "kg; m3 if measured"
      frequency: "Each cleaning/transfer and tank close"
      temporal_coverage: "Same complete actual period including failure/rework cleaning"
      site_scope: "Selected line plus causally allocated shared cleaning"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighing; composition; storage; manifests/recipient; species monitoring"
  calculation_rules:
    - id: cr_match_ledgers
      applies_to: "all inventory rows"
      rule: "Before normalization, construct raw attributable A_r for the delivered cohort from actual supplies and services plus opening WIP/finished-stock burden vectors and their historical records, less quantities/burdens genuinely retained in closing WIP/finished stocks. Trace actual returns and failure/rework causes; do not erase failures or invent negative burdens. Close physical production and stock accounts separately, pair mf_bulk with dp_bulk by P and cancel the internal transfer when consolidated. Unresolved stock/burden attribution is a data gap, never zero."
      inputs:
        - "raw supplies"
        - "raw services"
        - "WIP records"
        - "finished-stock records"
        - "carried burden vectors"
        - P
        - "delivery events"
      output: "A_r; positive Q"
      source_ids:
        - epa-eiip-ink-manufacture-2005
    - id: cr_report_once
      applies_to: "all inventory rows"
      rule: "For each exchange r report x_r = A_r / Q once, after raw unit conversion and lot/burden matching. Q is unique positive net actually delivered kg of the declared cohort after linked return cancellations; dp_delivered is 1 kg. Inventory amount cards and protocol aggregation refer to this same operation, not additional divisions. Never normalize failed runs separately or replace Q with P."
      inputs:
        - A_r
        - Q
      output: "x_r per 1 kg reference flow"
      source_ids:
        - epa-eiip-ink-manufacture-2005
    - id: cr_physical_balances
      applies_to: "manufacture; delivery"
      rule: "Before attribution or normalization, close physical kg ledgers: manufacturing opening WIP plus actual wet material input equals P plus closing WIP plus actual waste and air/water outlets. Separately, delivery opening bulk-buffer/filling-WIP/finished stock plus P and actual returns equals gross outward handovers plus closing bulk-buffer/filling-WIP/finished stock plus measured filling/storage waste and air outlets. Stock burdens travel with these same lots. P is an internal release, never a second terminal output; its inclusion does not authorize adding same-lot closing stock again as production. Net delivered Q follows the linked return convention in cp_delivery; it excludes every undelivered closing stock. Packaging has its own physical ledger, outside net ink mass. Species/element checks use independent assays and monitored species, not an unknown outlet fitted to either residual."
      inputs:
        - "raw wet masses"
        - P
        - "WIP masses"
        - "finished stocks"
        - "gross handovers"
        - "linked returns"
        - "independent assays"
      output: "separate physical mass balances"
      source_ids:
        - epa-eiip-ink-manufacture-2005
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify complete native names/routes/form/grade/geography/reference dimensions; qualify actual providers independently. Explicitly retain toluene residual classification debt, CN below-1-kV electricity limits and unspecified ink/water geography. Unresolved auxiliary UUIDs require later matching, not invented substitutions."
      evidence: "Direct native records; supplier documents; traceable exact support chain"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Preserve actual complete reporting period, matched product/route/state, failed and zero-output runs, rework/returns, opening/closing WIP and finished goods plus carried burdens. Record zero/absence with evidence and independently measured actual species; investigate mass/element residuals without fitting them."
      evidence: "Raw ledgers; historical burden vectors; QC; monitoring and uncertainty"
validation_rules:
  - rule_id: val_gate
    applies_to: "dp_delivered"
    rule: "Require a unique terminal Product output with the reference UUID and exactly 1 kg; both languages select dp_delivered. P transfers and stocks cannot be substituted for Q. Require positive matched net delivery, returned-event cancellation and stock/burden closure before accepting dataset amounts."
    source_ids:
      - epa-eiip-ink-manufacture-2005
  - rule_id: val_quantities
    applies_to: "all inventory rows"
    rule: "Verify complete raw numerator coverage, one raw conversion and one cr_report_once operation, paired/cancelled internal transfers, no repeated purchased formulation components, no duplicate return production and no omitted warehouse/dispatch/cleaning/failure burdens. Retain undelivered stocks and historical burdens separately."
    source_ids:
      - epa-eiip-ink-manufacture-2005
  - rule_id: val_species
    applies_to: "manufacture; cleaning"
    rule: "Validate physical mass/elements independently of actual species evidence. Require after-control medium, sampling/model basis, captured liquid/solid recipients and no assumed total-solvent release or recovery credit. Hazardous minor constituents cannot disappear by a generic mass cutoff. Unmeasured applicable pathways remain explicit gaps."
    source_ids:
      - epa-eiip-ink-manufacture-2005
  - rule_id: val_route
    applies_to: "all inventory rows"
    rule: "Reject incompatible colour/vehicle/milling form, water/UV/toner route, native hard CAS/grade/medium or reference dimension. Require the packaging reference dimension to support measured mass, including its declared closure coverage. A record UUID or schema pass alone does not establish scientific or supplier applicability."
    source_ids:
      - wipo-py12-gravure-2004
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared paper publication-gravure ink input with the same formulation/state and actual delivery gate"
  allowed_use: "Foreground study or qualified background use after full upstream, site, supplier, inventory-carry and waste-treatment matching"
  excluded_use: "Universal printing ink; other colours/vehicles/routes; printed-area equivalence; legal/food-contact suitability; default recovery credit; science approval from technical checks"
  required_metadata: "actual delivery gate and period; net Q and return convention; lot cohort; PY12 CAS/grade/surface treatment; vehicle resin chemistry and supplied solids; solvent/impurity composition; viscosity and temperature; pigment/nonvolatile fractions; paper publication-gravure use; plant and geography; below-1-kV CN electricity; drum specification; WIP/finished-stock and carried-burden records; capture/treatment recipients"
  required_quality_disclosure: "Actual period, recipe, provider/voltage/geography, opening/closing stock and burden vectors, failed/zero-output/rework/return handling, included storage/packing/dispatch, species evidence, waste recipients, UUID gaps, uncertainty and explicit exclusions"
  update_trigger: "Pigment/vehicle/solvent/form/route or delivery-gate change; native identity correction; material stock/burden or control-system change; new representative foreground evidence"
data_sources:
  - id: "epa-eiip-ink-manufacture-2005"
    type: "official_guidance"
    reference: "US EPA, EIIP Volume II Chapter 8, February 2005, sections 2.1-2.3 and 4-5. https://www.epa.gov/sites/production/files/2015-08/documents/ii08_feb2005.pdf"
    used_for: "Manufacturing operations, filling, cleaning, source/species-specific emission assessment and material-balance cautions. US historical technical guidance; no adopted numeric emission/default loss/control factor, recipe or universal LCA stock-allocation formula. Raw stock/normalization protocols are explicit requirements of this PCR."
  - id: "wipo-py12-gravure-2004"
    type: "literature"
    reference: "Ciba Specialty Chemicals, WO2004013237A1, Organic solvent-based printing inks, 12 February 2004, printed p15 (PDF p16), Comparative Examples A and B. https://patents.google.com/patent/WO2004013237A1/en"
    used_for: "Primary patent original scanned publication acquired through Google Patents PDF mirror, visually verified p16. Supports PY12 dry pigment bead-milled into rosin-modified phenolic resin solution in toluene with additional toluene. Comparative laboratory examples only; does not establish factory quantities, yield, emissions, energy, contemporary supplier coverage or approval. Dye/carbinol embodiments excluded."
