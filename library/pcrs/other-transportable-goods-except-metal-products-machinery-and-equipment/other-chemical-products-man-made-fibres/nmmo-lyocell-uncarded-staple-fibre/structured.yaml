allocation_rules:
  - rule_id: internal_loops
    applies_to: "internal transfers"
    rule: "Keep P and NMMO/water transfers explicit in the process inventories and cancel matched internal exchanges on consolidation. Their energy, losses, waste treatment and carried burdens remain. Internal recovery is neither a coproduct credit nor fresh production."
    source_ids: []
  - rule_id: shared_services
    applies_to: "shared services and stock"
    rule: "Prefer direct process/lot metering. Subdivide shared facilities; otherwise document causal physical drivers and sensitivity. Carry stock burdens to delivered cohorts by a consistent explicit method. Sold secondary material requires real product/specification and an independently justified allocation method; waste price alone is not product evidence. No default share or avoided-burden credit."
    source_ids:
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_fibreline
      process_id: "fibreline"
      flow_role: "atomic exchanges and service burdens"
      record_type: "period ledger"
      raw_fields: "process owner; period; lot; meter start/end; receipts/issues; whole formulation mass and assays; output and disposition; internal transfer IDs; opening/closing WIP/stock; inherited burden vector; failed/zero-output runs; rework; steam mass and state; condensate mass and enthalpy; independently measured moisture gains/losses; integrated volume or rate and duration; density evidence"
      collection_method: "The named process owner retains unnormalised raw records, full boundary numerators and opening/closing carried burdens. Reconcile each atomic exchange and paired transfers; no A_i/Q in collection. Retain all failed and zero-output operation burdens; causally assign shared services once. Supply owner also retains P, Q, dispatch/acceptance/return IDs, stock lineage and tare/moisture tests."
      unit: "kg; kWh; MJ; m3; h"
      frequency: "each lot and meter interval"
      temporal_coverage: "complete reporting period plus stock-origin periods"
      site_scope: "one declared site, route and grade; named owner"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; assays; mass ledger; stock/burden reconciliation; treatment manifests"
    - protocol_id: cp_recovery
      process_id: "recovery"
      flow_role: "atomic exchanges and service burdens"
      record_type: "period ledger"
      raw_fields: "process owner; period; lot; meter start/end; receipts/issues; whole formulation mass and assays; output and disposition; internal transfer IDs; opening/closing WIP/stock; inherited burden vector; failed/zero-output runs; rework; steam mass and state; condensate mass and enthalpy; independently measured moisture gains/losses; integrated volume or rate and duration; density evidence"
      collection_method: "The named process owner retains unnormalised raw records, full boundary numerators and opening/closing carried burdens. Reconcile each atomic exchange and paired transfers; no A_i/Q in collection. Retain all failed and zero-output operation burdens; causally assign shared services once. Supply owner also retains P, Q, dispatch/acceptance/return IDs, stock lineage and tare/moisture tests."
      unit: "kg; kWh; MJ; m3; h"
      frequency: "each lot and meter interval"
      temporal_coverage: "complete reporting period plus stock-origin periods"
      site_scope: "one declared site, route and grade; named owner"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; assays; mass ledger; stock/burden reconciliation; treatment manifests"
    - protocol_id: cp_supply
      process_id: "supply"
      flow_role: "atomic exchanges and service burdens"
      record_type: "period ledger"
      raw_fields: "process owner; period; lot; meter start/end; receipts/issues; whole formulation mass and assays; output and disposition; internal transfer IDs; opening/closing WIP/stock; inherited burden vector; failed/zero-output runs; rework; steam mass and state; condensate mass and enthalpy; independently measured moisture gains/losses; integrated volume or rate and duration; density evidence"
      collection_method: "The named process owner retains unnormalised raw records, full boundary numerators and opening/closing carried burdens. Reconcile each atomic exchange and paired transfers; no A_i/Q in collection. Retain all failed and zero-output operation burdens; causally assign shared services once. Supply owner also retains P, Q, dispatch/acceptance/return IDs, stock lineage and tare/moisture tests."
      unit: "kg; kWh; MJ; m3; h"
      frequency: "each lot and meter interval"
      temporal_coverage: "complete reporting period plus stock-origin periods"
      site_scope: "one declared site, route and grade; named owner"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; assays; mass ledger; stock/burden reconciliation; treatment manifests"
  calculation_rules:
    - id: cohort_burdens
      applies_to: "all inventory rows"
      rule: "Retain full raw period exchange vector R_i. Derive unnormalised delivered-cohort numerator A_i = opening carried vector + current attributable vector - closing carried vector - separately documented other-outlet carried vector. Apply documented lot tracing or consistent causal stock-layer method at WIP and finished-stock gates. Include failed/zero-output and rework burdens; cancel internal P, NMMO and water transfers once without cancelling their actual processing burdens. Preserve every undelivered burden for later delivery."
      inputs:
        - R_i
        - opening_carried_vector
        - closing_carried_vector
        - other_outlet_carried_vector
        - cp_fibreline
        - cp_recovery
        - cp_supply
      output: "A_i"
      source_ids: []
    - id: normalize_supply
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q. This is the sole normalisation to 1 kg net actual delivered reference flow; the card amount and protocol aggregation describe this same report operation, not additional divisions. Q must be positive and from the identical product, route, supplied state and delivered cohort; no positive Q means no per-kg result."
      inputs:
        - A_i
        - Q
        - cp_supply
      output: "a_i"
      source_ids: []
    - id: constituent_accounts
      applies_to: "all solution and fibre rows"
      rule: "For each whole commercial solution or wet fibre mass, multiply by independently measured matching constituent fraction for its subledger only. Close NMMO, water, cellulose and finish with stock changes, measured residues, effluent, actual emissions and independently identified transformation species. Internal solution recovery is not external purchase; no fixed solvent recovery fraction or residual-fitted outlet."
      inputs:
        - whole_mass
        - constituent_assay
        - stock_changes
        - measured_outlets
      output: "constituent_ledger"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all rows"
      requirement: "Verify actual grade, state, route, supplier, geography and full native identity; a generic reference UUID supplies no recipe or provider amount. Keep unresolved auxiliary UUIDs explicit and match real providers before dataset use."
      evidence: "Direct identity records; product and supplier specifications"
    - id: period_completeness
      applies_to: "all processes"
      requirement: "Reconcile raw period inputs, internal transfers, positive accepted release P, Q delivery, all stocks and carried burdens including failures/rework; investigate residuals with measured uncertainty, never force closure."
      evidence: "Lot ledger; calibrated scales/meters; opening/closing burden vectors"
    - id: environment
      applies_to: "recovery and treatment"
      requirement: "Identify each actual outlet and receiving medium from sampling/analysis and treatment evidence. Wastewater to a treatment provider is not the same as a direct elemental water discharge. Do not infer zero air emissions or reaction-water stoichiometry from a closed-loop label."
      evidence: "Sampling methods; permits/monitoring; treatment contracts and mass/species ledgers"
    - id: quantities
      applies_to: "all inputs and outputs"
      requirement: "No source-paper recipe, lab setting, claimed recovery rate or industry allocation share substitutes for actual matched records. Missing auxiliaries require completion, not invented quantities or an automatic downgrade of this authored collection method."
      evidence: "Originals, real source scope and foreground protocol evidence"
validation_rules:
  - rule_id: terminal
    applies_to: "delivered_fibre"
    rule: "Exactly one explicit terminal Product row is selected by reference_flow_link, with the same UUID in both languages. Real internal or coproduct rows sharing that UUID remain visible. Terminal quantity is 1 kg supplied-state fibre, not pulp, dope, tow, P, stock, gross bale or yarn."
    source_ids: []
  - rule_id: normalisation
    applies_to: "all inventory rows"
    rule: "Require positive Q, matched raw cohort and carried burdens, once-only normalize_supply, separately reconciled P/Q and all opening/closing WIP/finished stocks. Returns/re-acceptance do not create new production. Missing raw data, untraced stocks or unexplained duplicate exchanges make the produced dataset incomplete."
    source_ids: []
  - rule_id: atomic_completeness
    applies_to: "all processes"
    rule: "Every real material, utility, waste, treatment and elementary species is one correctly typed exchange with its own amount, unit, process owner and collection link. Conditional absence needs actual evidence; all additional actual consumables/outlets must be added as atomic rows before dataset completion. Do not emit wastewater treatment twice or invent molecular species from COD, stock residuals or physical evaporation."
    source_ids: []
  - rule_id: readiness
    applies_to: "dataset use"
    rule: "Scientific review, classification acceptance and publication are independent pending decisions. Structural/measurement/native-format checks establish neither methodology approval nor measured plant performance."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared-route supplied lyocell staple input for later spinning or nonwoven manufacture, once a complete real dataset is produced and reviewed"
  allowed_use: "Only matching uncarded staple grade/state/supply gate, with provider and geography compatibility evaluated"
  excluded_use: "Filament yarn, viscose/modal/cupro/acetate, synthetic fibres, prepared fibre and unqualified cross-route averages; no producer-brand footprint claim"
  required_metadata: "All reference qualifiers; site/route/period; primary records; upstream/treatment links; P/Q; stock/burden cohort; moisture/finish; packaging and dispatch gate"
  required_quality_disclosure: "Completeness, uncertainty, stock carry, native generic-identity limits, auxiliary UUID/provider gaps, service allocation, exclusions and pending scientific review"
  update_trigger: "Changed route, feedstock, functional treatment, staple state, process order, moisture basis, recovery configuration, supplier, geography or terminal gate"
data_sources:
  - id: "jrc-polymers-2007"
    type: "official_guidance"
    reference: "European Commission (2007), Reference Document on Best Available Techniques in the Production of Polymers, section 11.2.4, printed pp.179–180. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf"
    used_for: "Industrial direct-dissolution, precipitation, cutting, washing, finishing and recovery architecture only; no numerical recovery rate, consumption factor, operating recipe or emission claim adopted. Diagram winding does not define this staple terminal gate."
  - id: "lenzing-lyocell-technology"
    type: "literature"
    reference: "Lenzing, Fiber Technologies: Explore Lenzing’s Production Processes, Process A: Lyocell, publisher web snapshot 2026-10-16. https://www.lenzing.com/technology-production/technologies/"
    used_for: "Producer primary evidence of a commercial pulp/NMMO route and cut fibre endpoint. Actual operation order and product qualification are site-specific. No brand-wide inventory, solvent-recovery percentage or alternative cellulose feedstock assumed."
  - id: "cirfs-lyocell-production"
    type: "literature"
    reference: "CIRFS, Lyocell, Production, publisher web snapshot 2026-10-16. https://www.cirfs.org/man-made-fibers/Fibre-range/lyocell"
    used_for: "Independent industry-origin description of commercial staple-fibre production and aqueous NMMO recovery; qualitative corroboration, not the same plant or a quantitative inventory."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, First edition March2010, section7.9.3, printed pp.257–258 (PDF277–278); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "LCA method support only for attributional cases where allocation rather than substitution is selected: virtual subdivision and flow-specific determining physical causality support direct metering, subdivision and documented causal-driver allocation of shared services. The process sources establish fibre/recovery architecture, not this LCA method. No default physical/economic share, stock-layer formula, recovery rate, yield/utility/emission factor, automatic coproduct status, avoided-burden credit or PEF/CFF conformity is established. Actual stock lineage, service drivers, sensitivity and any genuine secondary-product allocation remain independently evidenced."
