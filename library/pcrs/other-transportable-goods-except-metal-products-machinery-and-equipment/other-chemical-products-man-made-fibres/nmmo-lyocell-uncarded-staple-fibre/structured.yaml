measurement_rules:
  - id: net_supply_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the unique positive net delivered fibre at the declared gate, not P. Weigh each delivered bale net of all packaging; record moisture/finish state and exclude cancelled/held dispatches. Returns and reshipments cannot manufacture a second accepted quantity."
  - id: fibre_moisture
    applies_to: "all fibre and pulp masses"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep wet net fibre, dry cellulose, non-cellulosic pulp solids, finish solids, residual NMMO and water as separate measured components. Drying-test mass loss is not automatically pure water; use the actual validated method. Convert wet-basis moisture w to dry fibre mass only with declared scope: dry mass = wet mass × (1-w); dry-basis regain r gives wet mass = dry mass × (1+r). Do not apply either factor twice or erase finish."
  - id: whole_formulation
    applies_to: "external solution inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Procure whole NMMO solution and whole spin-finish emulsion once. Assayed NMMO/active finish and carrier water are constituent subledgers, never duplicate purchases. Onsite blending instead records separately purchased ingredients plus actual blend losses and energy."
  - id: utility_dimensions
    applies_to: "metered utilities"
    required_property_ref:
      name: "Energy or volume"
      uuid: ""
    required_unit: "kWh, MJ, m3"
    rule: "Preserve electricity and useful steam heat separately; steam mass needs measured pressure/temperature/quality and return-condensate enthalpy for heat conversion. Rate × duration yields volume; an already integrated volume gets no second duration multiplier. Convert volume to mass only with independent fluid-state density, not a secondary flow-property factor."
  - id: physical_ledger
    applies_to: "fibre and recovery processes"
    required_property_ref:
      name: "Mass and elements"
      uuid: ""
    required_unit: "kg"
    rule: "Close total physical mass and relevant elemental ledgers independently of the species/reaction ledger. Direct dissolution, aqueous precipitation and water evaporation do not establish stoichiometric reaction water. Independently evidence any real degradation, cleaning or treatment reactions and actual species; never solve unknown reaction water and an unknown outlet from the same residual, or infer species from COD."
