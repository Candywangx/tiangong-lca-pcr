  classification_refs: "CPC 3.0: 35540; proposed narrower scope, acceptance pending"
  covered_products: "Unblended, unmodified lyocell staple from dissolving-grade wood pulp and aqueous NMMO, supplied before carding or combing"
  excluded_products: "Viscose, modal, cupro, cellulose acetate/triacetate, synthetic fibres, tow for sale, filament yarn, prepared fibre, spun yarn, functionalised/recycled-feedstock variants without an evidenced extension"
  representative_product: "One declared lyocell staple grade and cut length, at measured supplied moisture/finish state"
  production_route: "Pulp receipt, NMMO direct dissolution and filtration, solution spinning, aqueous precipitation, washing, finishing, drying and cutting in documented site order; NMMO/water recovery, packing, storage and dispatch"
  market_state: "Net delivered uncarded staple fibre at producing-site dispatch gate; packaging and finish/moisture disclosed"
functional_unit:
  what: "Supply of uncarded lyocell staple fibre for subsequent textile or nonwoven manufacture"
  how_much: "1 kg net actual delivered fibre Q at the producing-site dispatch gate"
  how_well: "One documented grade, cut length, linear density, supplied moisture and finish state; no packaging tare in Q"
  how_long_or_cycle: "One reconciled production-to-delivery cohort; no service lifetime is claimed"
  reference_flow_link: "delivered_fibre"
system_boundary:
  rules:
    - rule_id: route_scope
      applies_to: "all processes"
      rule: "Keep NMMO direct dissolution distinct from chemical derivatisation/regeneration and synthetic polymer manufacture. No source recipe, recovery percentage or nominal grade becomes a plant value."
      source_ids:
        - jrc-polymers-2007
        - lenzing-lyocell-technology
        - cirfs-lyocell-production
    - rule_id: complete_gate
      applies_to: "all processes"
      rule: "Include actual receipt handling, dissolution, filtration, spinning, precipitation, washing, cutting, finishing, drying, solvent/water recovery, treatment services, packing, storage, handling and dispatch to the selected Q gate. Add atomic rows and protocols for every actual stabiliser, cleaning/regeneration chemical, fuel, refrigerant, packing component, treatment reagent and measured emission absent from these baseline cards; missing collection is not zero. Model internal boilers and treatment explicitly if present, with no purchased-steam or offsite-treatment double count."
      source_ids:
        - jrc-polymers-2007
        - lenzing-lyocell-technology
    - rule_id: period_stock
      applies_to: "all processes"
      rule: "Collect full raw period numerators including failed and zero-output runs, rework and opening/closing WIP with inherited burdens. Supply ledger on a consistent component basis: opening finished fibre + P + external accepted receipts + physical returns + independently measured moisture gains = Q + closing finished fibre + other documented physical outlets + independently measured moisture losses. Packaging is separate. Identify repeat dispatches as physical transfers without new accepted Q; reverse/correct prior delivery acceptance for returns while retaining inherited burdens, and release returned stock once without new P. Reconcile each unique lot and its moisture state; do not force as-supplied masses of different moisture into equality. Manufacturing output is P, never P plus closing stock of that same P. Carry the burdens of all undelivered stock; include them when its cohort is delivered, not again as new production. Internal P output/input cancels on consolidation."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Received dissolving wood pulp, purchased whole NMMO solution, finish emulsion, utilities and packing at the producing site; upstream inputs and transport remain linked"
  starting_condition_role: "Foreground receipt gate for one NMMO-route fibre/supply system, with inherited opening-stock burdens"
  product_classification_scope: "Only uncarded lyocell staple within proposed CPC 3.0 35540 narrower scope; no filament-yarn or prepared-fibre substitution"
  recursive_input_rule: "Externally received same-category fibre remains an explicit upstream-linked input. Internal recovered solvent, water, fibre returns and transfer P retain their lineage and cancel on consolidation; they are not fresh procurement or new production"
  upstream_dataset_requirement: "Use route-, supplied-state-, geography- and property-compatible datasets for pulp, whole solutions, energy, packaging, transport and waste treatment. An identity UUID does not establish a provider quantity"
  disclosure: "Declare all actual process owners, start/end gates, P/Q, WIP/finished opening/closing stocks and carried burdens, treatment cut points, internal transfer cancellation, stock cohort method and allocated services"
