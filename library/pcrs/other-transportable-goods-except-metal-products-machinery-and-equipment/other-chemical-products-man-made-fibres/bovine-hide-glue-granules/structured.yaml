product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.other-chemical-products-man-made-fibres.bovine-hide-glue-granules"
  classification_refs: "CPC 3.0 35420, restricted bovine hide-glue subset; no accepted mapping is asserted"
  covered_products: "Unformulated dry granulated technical hide glue made from untanned bovine hide stock by lime conditioning, sulfuric-acid washing, hot-water extraction, filtration, concentration and drying"
  excluded_products: "Bone, fish, porcine or equine glue; chrome-tanned stock; edible/pharmaceutical gelatin; peptones; casein and caseinates; plant/synthetic adhesives; gelatin-scrap compounding; liquid ready-to-use glue; purchased finished-glue repacking"
  representative_product: "Dry bovine hide-glue granules supplied as a technical collagen adhesive"
  production_route: "One untanned bovine hide route only: receipt, washing and size preparation, lime treatment, removal of lime with water and sulfuric acid, hot-water extraction, liquor filtration, evaporation, drying, granulation, packing, storage and gate handover"
  market_state: "Net as-supplied dry granules containing measured residual moisture; no automatic dry-protein or anhydrous correction"
functional_unit:
  what: "Dry technical bovine hide-glue granules actually net delivered at the factory gate"
  how_much: "1 kg net whole supplied product, excluding packaging and retaining measured residual moisture"
  how_well: "Accepted to declared customer technical-adhesive specification; declare measured moisture, protein basis, gel strength, viscosity and test conditions"
  how_long_or_cycle: "Actual net accepted handover for one declared period and delivery cohort; no service lifetime applies"
  reference_flow_link: "rf_delivered_glue"
system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "scoped foreground"
      rule: "Include actual hide preparation, lime treatment, acid/water washing, repeated extraction, filtration, evaporation, drying, finishing and quality testing. Receipt of finished glue followed by packing does not implement this manufacturing route."
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
    - rule_id: boundary_gate
      applies_to: "scoped foreground"
      rule: "The reference gate is actual accepted net handover to the customer or carrier at the factory. Include attributable packing, factory storage, internal handling and loading through that gate; exclude subsequent external distribution and use. Report production releases and actual deliveries separately."
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
    - rule_id: boundary_upstream
      applies_to: "scoped foreground"
      rule: "Purchased untreated bovine hide stock is a complete wet commercial input. Link its actual slaughter/hide-processing supply chain, preservation, transport, supplier allocation and incoming state. A by-product description does not establish zero upstream burden. This foreground does not recreate slaughter, tanning or milk production."
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
    - rule_id: boundary_utilities
      applies_to: "scoped foreground"
      rule: "The representative foreground purchases steam and electricity; steam generation remains upstream, while condensate return and direct-injection water are traced at the actual interface. A site with an on-site boiler must extend the model with its individually identified fuel, water, treatment and emissions rather than delete them. Include cleaning and waste handling actually used."
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
    - rule_id: boundary_waste
      applies_to: "scoped foreground"
      rule: "The representative model exports separately characterised raw wastewater and wet residues to documented off-site management. Internal transfers to an on-site treatment plant require its explicit foreground expansion, each actual reagent and utility, measured treated discharge and sludge; do not label raw effluent as treated water."
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
boundary_abstraction:
  declared_starting_condition: "Untanned bovine hide stock at receipt, with actual moisture, preservation salts and pre-treatment declared; no chrome stock or bone input"
  starting_condition_role: "Complete upstream commercial hide-stock input to actual glue manufacture"
  product_classification_scope: "Restricted technical bovine hide-glue subset of CPC3 35420"
  recursive_input_rule: "External same-category glue input retains upstream burdens and distinct lot identity; such repacking-only operation is excluded here. Internal glue recycling is a paired transfer; remove it on consolidation without deleting reprocessing energy or losses."
  upstream_dataset_requirement: "Trace actual hide supplier, animal origin, geography, time, preservation and upstream allocation; verify each utility, chemical and transport provider independently"
  disclosure: "Disclose factory and time coverage, moisture/protein bases, net-delivery gate, stock burdens, waste destinations, co-product sale proof, included warehouse/loading, utility boundary and every unmeasured data requirement"
