allocation_rules:
  - rule_id: allocation_separation
    applies_to: "scoped foreground"
    rule: "Trace individual extraction runs and glue grades. Assign separable materials, energy, packaging, storage and treatment directly using actual meters and batch records before allocating shared operations. Do not assign all burdens to the first extraction or count later extracts as burden-free."
    source_ids:
      - seljel-technical-catalogue
      - epa-hide-glue-1977
      - epa-animal-glue-1975
  - rule_id: allocation_sale_gate
    applies_to: "scoped foreground"
    rule: "Wet extracted hide tankage, grease and filter solids are physically distinct streams. Treat each as waste unless its actual sale specification, legal destination, accepted net quantity, transfer record and market evidence demonstrate a co-product at the stated gate. Historic recovery examples establish a possibility, not this site's sale. Never substitute dry residue mass for measured wet dispatch."
    source_ids:
      - seljel-technical-catalogue
      - epa-hide-glue-1977
      - epa-animal-glue-1975
  - rule_id: allocation_shared
    applies_to: "scoped foreground"
    rule: "For remaining joint burdens, document the actual causal relationship and measured physical driver. If no defensible physical relationship exists, declare an explicitly reviewed site-specific allocation with contemporaneous quantities and prices at a common gate and sensitivity analysis; keep the unallocated ledger. No borrowed dairy/IDF, livestock or organisation economic coefficient, automatic avoided-product credit, or negative upstream-hide burden is allowed."
    source_ids:
      - seljel-technical-catalogue
      - epa-hide-glue-1977
      - epa-animal-glue-1975
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prepare
      process_id: "hide_preparation"
      flow_role: "Receipt, liming, acid washing and inbound supply"
      record_type: "foreground_records"
      raw_fields: "site; period; lot; owner; whole wet hide mass; provenance; moisture; protein; salt; supplier burden; whole slurry mass and assay; whole acid solution mass and assay; fresh water; meter readings; freight payload and km; failed runs; WIP opening/closing mass and carried burdens"
      collection_method: "Owner: production and procurement data steward. Collect unnormalized weigh tickets, assays, stock movements, meter differences and supplier records for the complete matched period. Do not divide by Q during collection; quantify dilution and internal preparation separately from procurement."
      unit: "kg; kWh; t*km"
      frequency: "each batch and event; period close"
      temporal_coverage: "same complete actual reporting period including failures and zero-output"
      site_scope: "declared single site and matched route/product cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; signed batches; supplier CoA; route/provenance; freight records; stock burden reconciliation"
    - protocol_id: cp_extract
      process_id: "hot_extraction"
      flow_role: "Extraction fractions and utilities"
      record_type: "foreground_records"
      raw_fields: "site; period; lot; owner; paired hide transfer; wet liquor per extraction; solids/protein assay; fresh water; integrated steam heat and mass; condensate; electricity; failed/zero-output runs; rework; opening/closing WIP and carried burdens"
      collection_method: "Owner: extraction supervisor and utility metering steward. Retain every extraction and actual raw utility numerator, including unsuccessful runs; link batch fractions and opening/closing WIP burdens without any A/Q operation. Measure steam state and determine direct-injection versus indirect heating."
      unit: "kg; MJ; kWh"
      frequency: "each batch and event; period close"
      temporal_coverage: "same complete actual reporting period including failures and zero-output"
      site_scope: "declared single site and matched route/product cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired batch transfers; solids assays; steam/condensate and enthalpy records; calibrated meters; grade records"
    - protocol_id: cp_dry
      process_id: "drying_finishing"
      flow_role: "Liquor finishing, water removal and granule release"
      record_type: "foreground_records"
      raw_fields: "site; period; lot; owner; liquor wet mass and dry matter; granule wet mass and moisture; protein basis; gel strength/viscosity and methods; electricity; heat; steam/condensate mass; cooling/cleaning make-up; recycle fines; failed runs; opening/closing WIP and carried burdens; new-release event id"
      collection_method: "Owner: finishing supervisor and quality laboratory. Record complete unnormalized batch and meter records including failed drying, captured fines and cleaning. Determine actual product quality and residual water; link every internal release to packing stock. A release is neither delivery Q nor an extra closing-stock output."
      unit: "kg; MJ; kWh; declared assay units"
      frequency: "each batch and event; period close"
      temporal_coverage: "same complete actual reporting period including failures and zero-output"
      site_scope: "declared single site and matched route/product cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; laboratory methods; unique release ids; fraction balances; recycle and stock logs"
    - protocol_id: cp_gate
      process_id: "packing_delivery"
      flow_role: "Actual net deliveries, stocks, returns and packing"
      record_type: "foreground_records"
      raw_fields: "site; period; delivery cohort; owner; unique handover id; accepted net product kg; packaging tare and composition; lot moisture; opening/closing FG mass and carried burdens; new releases; transfers; returns and original handover links; rework and failed runs; paper and liner inputs/losses; warehouse duration/location; electricity; diesel; loading records"
      collection_method: "Owner: warehouse and dispatch steward with quality acceptance owner. Collect raw event quantities, unnormalized burdens and complete WIP/FG carried burdens; derive positive unique net accepted delivery Q only from actual handovers corrected in the original return cohort. Retain undelivered stock and its burdens; production release is not assumed equal to Q. Reinspection/reacceptance cannot mint a second product."
      unit: "kg; kWh; recorded storage hours"
      frequency: "each batch and event; period close"
      temporal_coverage: "same complete actual reporting period including failures and zero-output"
      site_scope: "declared single site and matched route/product cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed carrier/customer acceptance; calibrated net weights; lot tracking; packaging bills; stock and burden reconciliation; return links; meters"
    - protocol_id: cp_water
      process_id: "drying_finishing"
      flow_role: "Physical water, species, effluent and residue records"
      record_type: "foreground_records"
      raw_fields: "site; period; lot; owner; fresh/carrier/feed water; steam and condensate; hydrolysis evidence; acid/base assays; actual neutralisation extent; dissolved ions and hydrate state; wet outlet masses; solids/moisture/protein; C/N/Ca/S; gas/air humidity; integrated volume; measured density/state; treatment destination; sale or disposal evidence; opening/closing water/species stock"
      collection_method: "Owner: environmental laboratory and process chemist, hosted by drying_finishing and covering hide_preparation, hot_extraction and drying_finishing. Retain unnormalized measured mass/volume, composition and actual reaction evidence independently. Obtain reaction extent from assayed reagents/species and validated chemistry, not a mass residual or COD. Separate liquid effluent, residue, condensate and vapour; prove any sale and actual treatment. Keep full stock water/species and carried burdens."
      unit: "kg; m3; declared assay units"
      frequency: "each batch and event; period close"
      temporal_coverage: "same complete actual reporting period including failures and zero-output"
      site_scope: "declared single site and matched route/product cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated flow/weight records; independently supported density; laboratory speciation; validated mechanism/extent; outlet samples; manifests and actual sale proof"
  calculation_rules:
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw records before aggregation: rate times actual duration gives an integrated amount; an already integrated liquid/gas volume receives no further time multiplier. Convert volume to mass using independently supported density at the recorded temperature/composition; no native secondary property coefficient is assumed to be density. Preserve electricity kWh and steam MJ separately."
      inputs:
        - raw_measurement
        - duration_if_rate
        - density_if_volume
        - cp_prepare
        - cp_extract
        - cp_dry
        - cp_gate
        - cp_water
      output: "raw_period_exchange"
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
    - id: calc_delivery_cohort
      applies_to: "all inventory rows"
      rule: "For each raw exchange/burden component, reconcile opening WIP and finished-stock burdens plus complete actual period additions, less closing WIP and finished-stock burdens and burdens assigned with evidence to other product/cohorts. This yields A_row attributable to the declared delivered cohort, after documented joint-product allocation. Include its failed/zero-output, return, rework, warehouse, packing and loading loads; do not remove genuine incurred losses. Pair and eliminate internal transfers once without deleting their external burdens. Keep a separate raw physical ledger, stock ledger and burden bridge; do not subtract a stock mass from electricity."
      inputs:
        - raw_period_exchange
        - opening_WIP_burdens
        - closing_WIP_burdens
        - opening_FG_burdens
        - closing_FG_burdens
        - other_cohort_burdens
        - cp_prepare
        - cp_extract
        - cp_dry
        - cp_gate
        - cp_water
      output: "A_row"
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
    - id: calc_gate_once
      applies_to: "all inventory rows"
      rule: "Report each non-reference exchange as A_row / Q for per 1 kg reference flow; Q is the positive unique actual net accepted factory-gate delivery kg of this product/route/state/cohort excluding packaging and corrected for returns against original handovers. The reference output is 1 kg. Perform this division exactly once after raw conversions and stock/burden reconciliation; the card expression and protocol aggregation instruction describe this same reporting operation, not successive divisions. No per-kg result exists for Q=0; retain its burdens for explicit attribution or carryover."
      inputs:
        - A_row
        - Q
        - cp_gate
      output: "exchange_per_kg_delivered"
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
    - id: calc_water_species
      applies_to: "all inventory rows"
      rule: "For each stock/stream, distinguish whole wet mass, measured water, dry solids and measured protein; dry matter equals wet mass times one minus measured water fraction, not protein mass. Establish total mass and element conservation independently. In the actual lime/sulfuric-acid step, distinguish acid-base water formation from collagen-hydrolysis water consumption and physical evaporation. Quantify the former from independently verified actual neutralisation extent; determine hydrolysis contribution from independent validated reaction/analytical evidence, never a closure residual. Record dissolved calcium/sulfate and actual hydration state without assuming all sulfate precipitates as gypsum. Reconcile water entering with hide, solutions, fresh water and direct steam, reaction formation/consumption, water leaving in glue, effluent, residue, vapour, condensate and opening/closing stocks. Do not fit two unknowns with one balance."
      inputs:
        - raw_period_exchange
        - actual_reaction_extent
        - speciation_evidence
        - moisture_assays
        - opening_closing_stock
        - cp_water
      output: "independent_mass_element_water_ledgers"
      source_ids:
        - seljel-technical-catalogue
        - epa-hide-glue-1977
        - epa-animal-glue-1975
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference and feed identity"
      requirement: "Use native broad Hide Glue only with the qualified bovine technical route and full limitations; native geography/CAS are unspecified, not inferred. Prove supplier route and grade independently."
      evidence: "actual supplier, production, laboratory, warehouse and delivery records; applicable primary sources"
    - id: quality_period
      applies_to: "every collection protocol"
      requirement: "Use one complete actual reporting period and site per disclosed scope. Preserve normal operations, maintenance, cleaning, failures and zero-output work; reconcile any exclusions to their actual receiving cohort."
      evidence: "actual supplier, production, laboratory, warehouse and delivery records; applicable primary sources"
    - id: quality_representativeness
      applies_to: "external evidence and enterprise package"
      requirement: "SelJel is a manufacturer-specific bovine technical example, not an industry yield or universal moisture factor; EPA reports describe historic US processes, with the 1975 report marked draft. No numerical yield, duration, dose, emission or allocation factor is transferred. Actual enterprise data, quality specifications, utility configuration, wastewater and supplier matching remain required."
      evidence: "actual supplier, production, laboratory, warehouse and delivery records; applicable primary sources"
    - id: quality_completeness
      applies_to: "inventory extensions"
      requirement: "Identify each actual cleaning reagent, filter consumable, preservative, pallet, refrigerant, combustion species and treatment operation separately when present; document genuine absence. These site data requirements cannot be replaced by an omnibus flow or silent zero."
      evidence: "actual supplier, production, laboratory, warehouse and delivery records; applicable primary sources"
validation_rules:
  - rule_id: validate_scope
    applies_to: "scoped foreground"
    rule: "Verify bovine untanned hide provenance, actual lime/sulfuric-acid route and granulated technical product specification; reject true native grade, route, medium or material contradictions."
    source_ids:
      - seljel-technical-catalogue
      - epa-hide-glue-1977
      - epa-animal-glue-1975
  - rule_id: validate_gate
    applies_to: "scoped foreground"
    rule: "Require positive Q from unique net accepted delivery events, linked to lots and gate records. Newly released production, internal granule transfers and finished-stock increases are not additional deliveries. Returns and repeat acceptance create no second output; correct the original delivery cohort and carry its burdens."
    source_ids:
      - seljel-technical-catalogue
      - epa-hide-glue-1977
      - epa-animal-glue-1975
  - rule_id: validate_inventory
    applies_to: "scoped foreground"
    rule: "Retain all matched-period raw inputs and burdens, including failed and zero-output runs, rework, returns, opening/closing WIP and finished-stock carryover. Reconcile cohort attribution and stock transfers before one normalization. Q=0 does not permit discarding the numerator or publishing a finite per-kg inventory."
    source_ids:
      - seljel-technical-catalogue
      - epa-hide-glue-1977
      - epa-animal-glue-1975
  - rule_id: validate_balance
    applies_to: "scoped foreground"
    rule: "Close total physical mass and C/N/Ca/S balances separately from the water/species ledger. Reconcile assayed commercial solutions, feed water, steam, evaporation, wastewater, wet residues and stocks. COD/BOD are analytical indicators, not a conversion to gelatin or an unknown balancing species. Do not fit reaction water and another unknown outlet from one residual."
    source_ids:
      - seljel-technical-catalogue
      - epa-hide-glue-1977
      - epa-animal-glue-1975
  - rule_id: validate_evidence
    applies_to: "scoped foreground"
    rule: "Require actual supplier/background compatibility, native identity limitations, calibration, assay, source evidence and complete bilingual fields. Unsupported species, sale status or allocation is an explicit data-package gap rather than an inferred number."
    source_ids:
      - seljel-technical-catalogue
      - epa-hide-glue-1977
      - epa-animal-glue-1975
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Technical collagen-adhesive input to downstream manufacturing with compatible supplier, route, grade, state, geography and time"
  allowed_use: "Qualified bovine dry-granule production and actual net factory-gate supply after evidence and scientific review"
  excluded_use: "No automatic applicability to other animals, edible/pharma gelatin, protein hydrolysates, caseinates, compounded liquid glue or recycled pharmaceutical gelatin; no clinical or culture-use instruction"
  required_metadata: "All required qualifiers, native identity limitations, source/protocol ids, raw-period and stock burden bridge, measured product quality and actual supplier/background datasets"
  required_quality_disclosure: "Unmeasured site/provider fields, calibration/assay quality, mass/species balance uncertainty, residue classification and any reviewed allocation; identity compatibility is not scientific approval"
  update_trigger: "Changes to feed species/treatment, acid, supplier, recipe, drying, utility boundary, reference gate, quality, waste treatment, sale status, allocation or evidence"
data_sources:
  - id: "seljel-technical-catalogue"
    type: "handbook"
    reference: "SelJel product catalogue, Technical Gelatine, PDF page 12, printed pp.22-23; https://seljel.com/katalog.pdf"
    used_for: "Primary manufacturer support for bovine hide route, lime treatment, acid/water washing, extraction/evaporation/drying and granular technical form. Reported 10-12% moisture is that product example only, not a conversion factor or universal grade. Catalogue is undated (PDF metadata created2021); no site yield, utility, acid identity or allocation is established."
  - id: "epa-hide-glue-1977"
    type: "official_guidance"
    reference: "US EPA, Potential Environmental Impact of Compounding and Fabricating Industries: A Preliminary Assessment, EPA-600/2-77-160, August1977, pp.55-56 and Figure26; https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9100PHTX.TXT"
    used_for: "Historic primary industrial report supporting hide-glue manufacture through cleaning, hot-water extraction, filtration, evaporation and drying with separate water and solids outlets. Official HTML/TXT rendering; not a current plant recipe, performance factor or acquired publisher PDF. Bone/casein/fish and other adhesive branches are excluded."
  - id: "epa-animal-glue-1975"
    type: "literature"
    reference: "US EPA, Development Document for Effluent Limitations Guidelines and Standards of Performance, Miscellaneous Chemicals Industry, prepared by Roy F. Weston under contract 68-01-2932, February1975 DRAFT, animal-glue sections IV-102 and IV-105 to IV-107; https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=2000UTT8.TXT"
    used_for: "Historic contractor draft (not Agency-reviewed and not an official EPA publication) primary industrial evidence for lime-conditioned hide, dilute sulfuric-acid removal of residual lime, hot-water extraction and effluent origins; tankage/grease recovery is a possible outlet requiring actual sale proof. Not legal advice, current regulatory limits or transferable dosage, yield, wastewater loading or allocation. Preserve separation from fleshings, chrome splits and bone routes."
