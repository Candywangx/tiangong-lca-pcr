review_metadata:
  scientific_review: "pending"
  independent_review: "pending_controller_review"
  mapping_decision: "accepted narrower association; canonical authority: classifications/mappings/cpc-3.0-to-pcr.yaml; decision: docs/adr/0429-accept-biodiesel.md; scientific/translation review and publication remain separate"
  semantic_scope:
    decision: "Promote matching unpublished biodiesel scaffold for refined virgin soybean-oil methyl esters only. Existing petroleum gas-oil excludes neat biodiesel; material glycerol uses fat-splitting crude-feed refining and excludes transesterification. No material FAME-equivalent PCR found in live manifests/index."
    terminal_gate: "Actual net bulk delivery at plant loading hose, not fresh production. Q and opening/closing WIP/finished stock carried burdens must be reconciled."
  native_identity_limits:
    - "Biodiesel factory production-mix Product, Mass/kg; native oxygen-content 11% characteristic has no assay tolerance. Actual assay and compatibility review required; comment covers methyl/ethyl/propyl esters, but PCR admits methyl only. No native supply geography or CAS is specified."
    - "Refined soybean-oil native finished-product production mix has no geography/assay stated; supplier cultivation, extraction and refining burdens remain required."
    - "Methanol CAS 67-56-1, market average of coal gasification/coking and natural gas, pipeline/tank supply; actual provider mix and supply state require review."
    - "Electricity identity is explicitly CN, 1–35 kV, grid-average consumption mix to user; native Net calorific value/MJ property is an energy reference, not an electricity combustion or fuel-LHV claim. Other supply is not covered by this UUID."
  evidence_limitations:
    - "NREL 2004 original supports industrial unit operations, catalyst alternatives and species distinctions. No theoretical yields, recipes, numerical dosage/ranges, historical prices, laboratory exercises or utility/effluent factors adopted."
    - "Desmet original webpages independently support industrial CSTR/decanter, soybean/refined vegetable oil and physical methanol recovery feasibility. Yield, zero-effluent and recovery marketing claims are not inventory data."
    - "ILCD §7.9.3 supplies allocation hierarchy only; actual flow-specific causality and residual gate-specific market-value evidence remain required for any numerical dataset."
    - "No actual factory dataset is claimed. Future collection requirements do not imply actual provider approval, actual fuel-specification compliance or completed scientific review."
  unresolved_flow_ids:
    - "methoxide_solution"
    - "sulfuric_solution"
    - "soft_water"
    - "heating_steam"
    - "filter_medium"
