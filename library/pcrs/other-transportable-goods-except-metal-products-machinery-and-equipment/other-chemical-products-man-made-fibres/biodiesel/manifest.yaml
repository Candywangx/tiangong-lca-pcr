  unresolved_flow_details:
    - row_id: "methoxide_solution"
      selected_flow: "Sodium methoxide solution in methanol"
      reason: "Weigh the actual purchased sodium methoxide-in-methanol solution, with supplier concentration, residual water and impurities. Active sodium methoxide and methanol carrier are composition subledgers, not two additional external exchanges; no 25% or 30% concentration or in-situ NaOH preparation is prescribed."
    - row_id: "sulfuric_solution"
      selected_flow: "Sulfuric acid solution for catalyst neutralisation"
      reason: "This selected variant uses actual sulfuric acid solution for catalyst/soap-phase treatment and, where documented, acidified washing. Record whole supplied solution and actual H2SO4/water assay; do not substitute a fixed concentrated acid grade or an acid-esterification feed route."
    - row_id: "soft_water"
      selected_flow: "Softened process water"
      reason: "Record externally supplied softened water used for ester washing, cleaning and actual makeup. Retain branch meters, treatment provider and water quality; internal wash-water reuse is a transfer and the report example is not a water-use factor."
    - row_id: "heating_steam"
      selected_flow: "Steam supplied to indirect biodiesel-process heaters"
      reason: "Meter actual external steam for reaction heating, methanol recovery, drying and tank heating, with pressure, temperature, phase/dryness and incoming enthalpy. Retain condensate-return state; steam is not a direct material reactant or an unspecified heat/fuel bundle."
    - row_id: "filter_medium"
      selected_flow: "Polypropylene liquid polishing filter medium"
      reason: "Include only when the actual polishing filter is polypropylene; retain SKU, mass, replacement and retained-liquid records. A different actual polymer or an added adsorbent requires its own atomic row; no dry-wash resin route is covered by this water-wash profile."
    - row_id: "crude_glycerol"
      selected_flow: "Demethanolised crude glycerol solution from soybean biodiesel"
      reason: "Include as Product only with actual receiver acceptance and evidence of a usable traded crude solution. Measure the whole wet solution, glycerol/water/methanol/salts/soap/fat assay and gate, not theoretical pure glycerol or a fixed 80–85% grade. Pharmaceutical refining is outside this route. Unsaleable material is a distinct waste transfer, never this row plus waste for the same quantity."
    - row_id: "returned_condensate"
      selected_flow: "Condensate returned to external steam supplier"
      reason: "Record only actual external return, with mass, temperature and enthalpy; internal circulation cancels. The supply contract determines heat accounting; return is not automatically a saleable co-product, avoided-water credit or wastewater discharge."
    - row_id: "aqueous_effluent"
      selected_flow: "Biodiesel wash wastewater exported for treatment"
      reason: "Measure actual exported wash/cleaning/recovery wastewater after internal reuse, with water, methanol, glycerol, oil, salts, pH and receiver records. COD/TOC may describe treatment demand but cannot identify species, supply a missing mass or determine reaction water. No zero-effluent marketing claim proves absence."
    - row_id: "salt_sludge"
      selected_flow: "Wet sodium-salt and soap separation sludge"
      reason: "Retain the actual single sludge stream with wet mass, water, sodium, sulfate, residual organics and treatment destination. Do not assume fertilizer saleability or subtract a pure-salt product credit; if the measured material differs, resolve its own identity before use."
    - row_id: "waste_glycerol"
      selected_flow: "Unmarketable crude glycerol solution for treatment"
      reason: "Use only for actual discarded crude-glycerol solution, retaining composition, rejection and destination. Keep it separate from saleable crude_glycerol and internal reprocessing; saleable versus waste classification requires evidence, not a negative/positive price rule alone."
    - row_id: "offspec_ester"
      selected_flow: "Discarded off-specification soybean methyl ester mixture"
      reason: "Include final off-spec ester discarded after actual recovery decisions, including delivery returns. Internal return, retesting or rework is not external waste and creates no new output; retain all rework burdens and stock carryover."
    - row_id: "spent_filter"
      selected_flow: "Spent polypropylene biodiesel polishing filter medium"
      reason: "For actual filter_medium replacement only, measure spent medium with retained ester, water and solids and the receiving treatment. Do not also place the same retained liquid in another discarded-liquid row."
    - row_id: "methanol_air"
      selected_flow: "Methanol emitted to air"
      reason: "Capture speciated methanol from vents, tanks, loading and fugitive losses after recovery/control. Retain direct measurement or validated site-specific calculation, medium and abatement boundary; no total VOC or unrecovered-alcohol residual establishes this species amount."
    - row_id: "water_vapour"
      selected_flow: "Water vapour emitted to air from biodiesel drying"
      reason: "Include actual uncondensed water discharged to air, separating co-emitted methanol. Recovered condensate is internal or an actual liquid outlet; water phase change is not chemical production of water."
  provider_review: "Required per concrete data package; whole catalyst/acid formulations, actual crude glycerol state, all waste/emission media, supply geography and exact reference compatibility are unresolved auxiliary/provider work, not a missing final product reference."
