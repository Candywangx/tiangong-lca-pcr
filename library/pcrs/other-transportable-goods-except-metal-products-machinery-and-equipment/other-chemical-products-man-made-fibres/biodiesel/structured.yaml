allocation_rules:
  - rule_id: allocation_unallocated
    applies_to: "joint production"
    rule: "Retain complete unallocated physical joint-output records first, including the actual wet crude glycerol, wastes and losses. Internal methanol/oil recovery is neither an external co-product nor an avoided-purchase credit. A waste-treatment fee alone does not settle product status."
    source_ids:
      - nrel-biodiesel-technology-2004
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_causal
    applies_to: "shared burdens"
    rule: "Select attributional allocation, first subdividing measured ester-only, glycerol-only and shared operations. Assign direct burdens and demonstrate determining physical causality per remaining flow; wet mass share or theoretical stoichiometry alone is not a causal allocation model. Preserve the evidence and sensitivity."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "inseparable residual burdens"
    rule: "Only after documenting why subdivision and physical causality cannot resolve a residual, use the actual market values of all usable co-functions in their actual state at the same joint-process exit. Retain contemporaneous quantities, net gate receipts/contract values, moisture/quality, conditioning and transport adjustments and sensitivity. Do not apply a generic biodiesel:glycerol mass-price ratio, the 2004 price example, pure-glycerol prices or negative weights; missing/unstable values require review before numerical use."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_no_credit
    applies_to: "derived reference dataset"
    rule: "Keep waste-treatment burdens with the responsible process. No automatic glycerol, salt, methanol, oil or carbon substitution credit. Do not combine allocated burdens with a second avoided-product credit. Report unallocated multi-output and allocated biodiesel views separately so physical coproduct mass is never reduced to hide an allocation."
    source_ids:
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_gate
      process_id: "sme_site"
      flow_role: "bulk reference delivery"
      record_type: "delivery and inventory reconciliation"
      raw_fields: "lot/cohort ID; release and loading dates; gross/tare/net kg; accepted shipments; returns and resupply IDs; opening/closing WIP and finished kg; inherited burden vectors; new first-acceptance production kg"
      collection_method: "Owner: loading and quality managers. Weigh actual net loading on calibrated equipment and reconcile signed acceptance/returns by unique physical lot. Keep new release, internal transfers and net delivery as separate unnormalised records; include actually delivered opening finished stock and leave undelivered finished stock with its carried burdens."
      unit: "kg"
      frequency: "each loading/return and inventory close"
      temporal_coverage: "one declared matched reporting period and stock cohorts"
      site_scope: "actual soybean-FAME site and loading hose"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; signed loads/returns; stock ledger"
    - protocol_id: cp_material
      process_id: "sme_site"
      flow_role: "external feed and reagent withdrawals"
      record_type: "metered material ledger"
      raw_fields: "receipt/withdrawal kg; opening/closing stock; supplier SKU and complete formulation; oil water/FFA/glycerides; acid and catalyst active fraction/carrier; temperature/density; spills; failed-run/rework IDs"
      collection_method: "Owner: stores and process engineer. Retain unnormalised receipts, actual withdrawals and stock movements for the complete matched period, including unsuccessful operations; distinguish purchased whole solutions from their nested constituents. Attribute stocks and carried burdens by lot without dividing by Q."
      unit: "kg"
      frequency: "each receipt/withdrawal and assay"
      temporal_coverage: "same period and cohorts as cp_gate"
      site_scope: "feed, reagent and filter stores and actual unit branches"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; supplier certificate; assays; stock logs"
    - protocol_id: cp_utilities
      process_id: "sme_site"
      flow_role: "electricity and steam/condensate"
      record_type: "meters and state records"
      raw_fields: "start/end kWh; steam kg; supply/return pressure/temperature/dryness/enthalpy; timestamps; integrated volume or rate/duration flag; operation owner; idle/startup/failure/rework/tank/loading loads"
      collection_method: "Owner: utilities engineer. Retain raw totals by operation and complete period, including support and zero-output loads. Distinguish integrated meter readings from rates; record condensate state and meter allocation evidence. Collection performs no Q division."
      unit: "kWh; kg; pressure; temperature; kJ/kg"
      frequency: "continuous meters and each period close"
      temporal_coverage: "same period and stock-burden cohorts"
      site_scope: "reaction/recovery/finishing and actual storage/loading utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; bills; enthalpy basis; submeter reconciliation"
    - protocol_id: cp_outputs
      process_id: "sme_site"
      flow_role: "co-products and waste outlets"
      record_type: "outlet mass and acceptance records"
      raw_fields: "stream and lot IDs; whole wet kg; water/methanol/glycerol/ester/oil/soap/salts assay; receiver and sale/rejection status; inventories and inherited burdens; treatment records; actual net gate values"
      collection_method: "Owner: co-product sales and environmental managers. Retain each actual physical outlet and composition before any allocation; separate sold crude glycerol from discarded solution and distinguish internal recycle from external transfers. Preserve raw unnormalised period quantities and stock burdens, including rejected runs."
      unit: "kg"
      frequency: "each outlet/assay and stock close"
      temporal_coverage: "same matched period and cohorts"
      site_scope: "actual outlet gate and receiving facility"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receiver certificates; lab methods; waste manifests; invoices"
    - protocol_id: cp_emissions
      process_id: "sme_site"
      flow_role: "methanol and water air outlets"
      record_type: "speciated air monitoring"
      raw_fields: "source ID; medium; concentration; actual wet/dry gas volume; sampling duration only for rates; control efficiency evidence; methanol/water separately; startup/tank/loading/fugitive coverage"
      collection_method: "Owner: environmental engineer. Retain direct measured mass or validated concentration with matched integrated gas volume and reference conditions; use rate times duration only when raw data are rates. Keep raw numerator, detection limits and unresolved species without residual fitting or division by Q."
      unit: "kg"
      frequency: "campaign/continuous per actual source"
      temporal_coverage: "same reporting period including nonproductive periods"
      site_scope: "controlled and fugitive air outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling plan; calibration; detection limits; gas basis"
    - protocol_id: cp_recovery
      process_id: "sme_site"
      flow_role: "internal methanol/oil and species balances"
      record_type: "recycle, reaction and stock audit"
      raw_fields: "gross reactor charges; fresh reagent; carrier methanol; recovered methanol/oil kg and assay; loop start/end inventory; phase outlet kg and water; actual glycerides/FFA/soap/salts/glycerol/ester species; independent reaction/speciation evidence"
      collection_method: "Owner: process chemist. Record raw internal movements, assays and actual chemistry independently of whole-stream closure. Ester exchange produces glycerol without net reaction water; FFA methyl esterification is a different water-producing reaction excluded here. Methoxide protonation, hydroxide neutralisation/hydrolysis and phase evaporation have different species/water effects; prove actual species and extents before calculation."
      unit: "kg"
      frequency: "each operating/stock interval and assay"
      temporal_coverage: "matched complete period and cohorts"
      site_scope: "each reactor, separator, recovery and tank interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "assay methods; PFD; independent chemistry records; uncertainty"
  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw units before normalization: mass from traceable weighing or matched volume times measured density; kWh times 3.6 gives MJ; a rate times duration gives an integrated quantity, whereas an integrated volume is used once. Steam heat is measured mass times actual supply-minus-return enthalpy when that is the provider basis."
      inputs:
        - cp_material
        - cp_utilities
        - cp_emissions
      output: "raw compatible numerator totals"
      source_ids: []
    - id: cohort_carryover
      applies_to: "all inventory rows"
      rule: "Keep physical production and delivery stock equations separate. For the matched product/route/state, production receipts enter finished stocks only once. Net supplied Q comes from signed loading less reconciled same-cohort returns, with repeated delivery of the same retained lot not counted twice. Derive delivery-attributable unnormalised burden vectors from actual current burdens plus inherited opening WIP/finished/return burdens, less burdens retained in closing WIP/finished stocks and separately assigned other co-functions. Preserve waste/loss/rework burdens with their responsible cohort; do not subtract a physical closing mass directly from an energy or other burden numerator. Unresolved cohort attribution blocks a numerical result."
      inputs:
        - cp_gate
        - cp_material
        - cp_utilities
        - cp_outputs
        - cp_recovery
      output: "unnormalised delivery-cohort vectors and Q"
      source_ids: []
    - id: normalize_delivery
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q; A_i is each reconciled unnormalised delivery-cohort exchange or attributable burden and Q is actual accepted net bulk delivery in kg; report this division once and require Q positive. The resulting reference row is 1 kg. Card amount expressions and protocol aggregation_rule name this same reporting operation, not additional divisions. Keep the complete unallocated joint-output balance and separately disclose the allocated biodiesel view; do not apply allocation a second time in the provider or subtract a second coproduct credit."
      inputs:
        - A_i
        - Q
        - cp_gate
        - cp_material
        - cp_utilities
        - cp_outputs
        - cp_emissions
        - cp_recovery
      output: "inventory per 1 kg reference flow"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: physical_species
      applies_to: "all inventory rows"
      rule: "Reconcile complete external wet masses and internal stocks with uncertainty, then independently reconcile C/H/O/Na/S and actual molecular species across glycerides, methyl esters, methanol, glycerol, fatty acids, soaps, salts and water. An ideal triglyceride-plus-methanol equation supports reaction identity only, never observed yield. Protonating sodium methoxide or reacting it with residual FFA yields methanol rather than automatically forming water; hydroxide, acid-esterification and hydrolysis routes have different water terms and must not be substituted. Determine chemical water formation/consumption from independently identified actual reactions/extents and phase water from measured phase records; never solve unknown reaction water and unknown outlet from one residual or COD."
      inputs:
        - cp_recovery
        - cp_material
        - cp_outputs
        - cp_emissions
      output: "separate mass, element, species and water audits"
      source_ids:
        - nrel-biodiesel-technology-2004
  data_quality_requirements:
    - id: quality_gate
      applies_to: "all inventory rows"
      requirement: "Retain complete matched raw records, calibration, traceable state/assay and stock burden genealogy. Zero is demonstrated absence, not missing data. Failed runs remain in coverage; Q=0 prevents a per-kg result."
      evidence: "cp_gate; cp_material; cp_utilities; cp_outputs; cp_emissions; cp_recovery"
    - id: quality_identity
      applies_to: "native rows and providers"
      requirement: "Verify whole names, route, medium, property reference and supplier compatibility. Biodiesel native oxygen-content 11% is a declared identity characteristic with no assay tolerance supplied; retain the actual oxygen test and compatibility decision, never a measured default. General native description includes ethyl/propyl esters but this PCR is methyl-only; native geography is unspecified."
      evidence: "supplier and native identity review; assay certificates"
    - id: quality_evidence
      applies_to: "all rows"
      requirement: "NREL is a 2004 technology report covering industrial options and separate laboratory exercises, not a plant inventory. Desmet documents industrial hardware/feed flexibility and recovery feasibility, not audited yields, zero discharges, specifications or site consumption. Collect all actual amounts; no numerical operating range is imported."
      evidence: "nrel-biodiesel-technology-2004, desmet-biodiesel-process, desmet-cstr-transesterification, desmet-methanol-recovery"
validation_rules:
  - rule_id: validate_reference
    applies_to: "delivered_biodiesel"
    rule: "Require a unique Product terminal row consistent with reference_flow_link and the Mass reference. Reject HVO, fossil diesel, blended fuel, alcohol or incompatible ester identity."
    source_ids:
      - nrel-biodiesel-technology-2004
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Require positive matched Q, complete raw-period and inherited stock burdens, unique return/resupply reconciliation and one normalization. New release plus closing finished stock is not a second production output; actual delivery and release must not be equated."
    source_ids: []
  - rule_id: validate_chemistry
    applies_to: "cp_recovery"
    rule: "Reject theoretical-yield factors, duplicate formulation constituents, COD/residual-fitted species or water, omitted failed runs or unverified internal-recovery credits. Require independent species/phase evidence and uncertainty-aware mass/element closure."
    source_ids:
      - nrel-biodiesel-technology-2004
  - rule_id: validate_allocation
    applies_to: "joint production"
    rule: "Require actual glycerol/residue market or waste state, gate-matched allocation evidence and an unallocated physical balance. Missing causal/residual value evidence prevents numerical use; it is not resolved by generic prices or wet mass shares."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Record checks performed, skipped and findings; missing auxiliary providers, actual site data, added atomic flows or native compatibility remain explicit gaps. The PCR does not certify fuel specification, scientific approval or TIDAS schema conformity."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "One kg net bulk supplied soybean FAME at the declared loading gate with inherited stocks and reviewed allocation; multi-output view retained separately"
  allowed_use: "Declared matching route, feedstock, quality, geography, period and provider basis only"
  excluded_use: "Universal biodiesel/HVO/fossil-diesel proxy; diesel-blend composition; fuel combustion; pure glycerol; automatic waste-feed credits; plant factors from laboratory examples"
  required_metadata: "Q delivery gate; new-release and stock reconciliation; feed/formulation assay; route; location; period; oxygen/specification evidence; recovery; coproduct/waste status; allocation; native/provider limits"
  required_quality_disclosure: "Raw completeness; WIP/finished-stock carried burdens; failed/zero-output/rework coverage; chemical/phase water evidence; uncertainty; unresolved identities and no unsupported factors"
  update_trigger: "Feed/route/gate/specification, catalyst/acid formulation, provider geography, recovery or coproduct market/treatment changes"
data_sources:
  - id: "nrel-biodiesel-technology-2004"
    type: "handbook"
    reference: "Van Gerpen, Shanks, Pruszko, Clements and Knothe, Biodiesel Production Technology, NREL/SR-510-36244, July 2004, https://docs.nlr.gov/docs/fy04osti/36244.pdf"
    used_for: "Printed pp. 1–6, 30–36, 75–77 and 79: triglyceride/FFA distinction; refined soy feed; base/catalyst solution; industrial reaction/separation/wash/dry and methanol/glycerol operations. Whole report includes laboratory exercises, ideal triolein, dated prices and illustrative quantities; none are adopted as plant yield, recipe, dose, effluent factor or acceptance specification."
  - id: "desmet-biodiesel-process"
    type: "literature"
    reference: "Desmet, Biodiesel, publisher page, https://www.desmet.com/en/biofuel/biodiesel"
    used_for: "Industrial continuous methylester technology and refined vegetable/soybean feed feasibility; not audited factory factors, actual site geography, guaranteed 100% yield or zero effluent."
  - id: "desmet-cstr-transesterification"
    type: "literature"
    reference: "Desmet, Transesterification, publisher page, https://www.desmet.com/en/biofuel/biodiesel/transesterification"
    used_for: "Serial industrial CSTR/decanter and glycerine separation configuration; equipment capacities and performance marketing are not foreground values or proof of selected catalyst chemistry."
  - id: "desmet-methanol-recovery"
    type: "literature"
    reference: "Desmet, Methanol rectification, publisher page, https://www.desmet.com/en/biofuel/biodiesel/methanol-rectification"
    used_for: "Physical methanol rectification/condensation and internal reuse; no 100% recovery, zero emission/wastewater or energy factor is imported."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for LCA — Detailed guidance, first edition March 2010, §7.9.3, printed pp.257–258, https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation of inseparable multifunctional operations: virtual subdivision/determining physical causality then residual market value at actual process-exit state. Not a biodiesel-specific allocation fraction, waste cut-off, energy credit, price or compliance certification; the sawmill example continuing later is not used."
