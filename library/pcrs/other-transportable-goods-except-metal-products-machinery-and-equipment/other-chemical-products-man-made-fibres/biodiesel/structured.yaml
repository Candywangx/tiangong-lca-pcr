  production_route: "Refined-oil receipt → serial CSTR transesterification/decanting → methanol recovery → acid/water washing → drying/polishing → released-tank storage → bulk loading; crude glycerol demethanolisation/neutralisation"
  market_state: "Whole actual supplied liquid at plant loading hose; residual water/methanol and quality retained, not pure ester-active mass"
functional_unit:
  what: "Neat bulk soybean FAME biodiesel at actual net loading handover"
  how_much: "1 kg"
  how_well: "Actual accepted fuel specification, methyl-ester/oxygen assay and whole supplied state declared; no generic performance equivalence"
  how_long_or_cycle: "One net supply at the loading gate; no combustion/service life reference"
  reference_flow_link: "delivered_biodiesel"
system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "sme_site"
      rule: "Include receipt/storage, reaction/separation, methanol rectification, wash/dry/polish, crude-glycerol conditioning to its actual gate, utilities, cleaning, rework, finished storage and loading. Split any actual additional chemical, fuel, packaging component, waste and elementary species into its own row before using a dataset; absent rows do not license a cut-off."
      source_ids:
        - nrel-biodiesel-technology-2004
        - desmet-biodiesel-process
        - desmet-cstr-transesterification
        - desmet-methanol-recovery
    - rule_id: boundary_stocks
      applies_to: "all inventory rows"
      rule: "Keep raw period and cohort ledgers including failed/zero-output runs, returns and opening/closing raw materials, WIP, recovered alcohol/oil and finished goods. Transfer existing burdens with stocks; do not charge current deliveries for untouched closing stocks or omit the opening stock burdens actually delivered."
      source_ids: []
    - rule_id: boundary_upstream
      applies_to: "refined_oil"
      rule: "This route consumes refined virgin soybean oil with inherited cultivation/extraction/refining burdens. Waste oil is excluded. Any proposed waste-feed extension requires evidence of prior use, legal/physical waste state, collection/pretreatment, inherited burdens and allocation system; never apply universal zero burden."
      source_ids:
        - nrel-biodiesel-technology-2004
        - jrc-ilcd-allocation-2010
boundary_abstraction:
  declared_starting_condition: "Externally refined soybean oil and separately supplied reagents/utilities at biodiesel-site receipt; full upstream burdens retained"
  starting_condition_role: "foreground collection start, not burden-free cradle"
  product_classification_scope: "Neat soybean FAME subset of CPC 3.0 35491 only"
  recursive_input_rule: "Same-category returned or purchased biodiesel retains origin and inherited burdens. Internal transfer cancels; purchased product is not new onsite production."
  upstream_dataset_requirement: "Match oil cultivation/extraction/refining, actual country/land-use accounting and co-product allocation; match complete catalyst/acid formulation, methanol production mix, water and utilities. No waste cut-off inferred from price or name."
  disclosure: "Declare actual supply state, gate, geography, operations, stock/carryover basis, recovery interfaces, allocations and unresolved providers. Downstream road transport, use and combustion are outside the loading gate."
