measurement_rules:
  - id: reference_mass
    applies_to: "ethylene_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Meter net accepted ethylene grade at the custody point, exclude returns/off-spec diversion and reconcile opening/closing inventory. All row denominators are per 1 kg reference flow. Keep the full physical ledger before allocation."
  - id: gas_quantity_basis
    applies_to: "ethane feed, fuel gas, hydrogen and gaseous products"
    required_property_ref:
      name: "Mass or Volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Retain measured pressure (absolute versus gauge), temperature, moisture, composition and compressibility. For a volume measurement, n = P_abs V / (Z R T); mass = n times the measured-mixture molar mass. Use consistent SI units and traceable molecular identities. Do not use an unexplained supplier mass factor as density or silently treat actual m3 as reference m3."
  - id: solution_basis
    applies_to: "caustic and formulated materials"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record delivered formulation mass and assay independently. Pure constituent mass equals solution mass times its measured mass fraction; neither may replace the other background reference without an explicit conversion."
  - id: heat_basis
    applies_to: "steam_import, steam_export, condensate_return"
    required_property_ref:
      name: "Mass and enthalpy"
      uuid: ""
    required_unit: "kg and MJ"
    rule: "Preserve each actual header grade and gross physical mass. Net useful heat is the enthalpy of supplied steam less actual returned-water enthalpy under the same boundary, with losses and inventory change disclosed; internal heat recovery is not purchased heat or exported heat. UUID energy metadata cannot establish this basis by itself."
  - id: carbon_sulfur_water
    applies_to: "all material and direct release records"
    required_property_ref:
      name: "Species mass and provenance"
      uuid: ""
    required_unit: "kg"
    rule: "Close whole mass and C/H/O/N/S at each stage and the aggregate boundary, with fossil/biogenic carbon separate. Include all measured compounds, formulation carriers, water, oxygen/air, products, wastes, actual releases and opening/closing stocks. Reactions conserve total mass and atoms; never add reaction formation/consumption as total-mass or elemental sources/sinks. Species balances may include stoichiometric formation/consumption once, based on actual conversion. Unknown composition remains an explicit residual, not a zero fraction or default emission."
  - id: species_and_particles
    applies_to: "air releases"
    required_property_ref:
      name: "Species mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve compound CAS and actual air compartment; mass-as-carbon, NO2-equivalent and wet/dry/reference-temperature concentration bases need documented conversion. Use NO and NO2 actual masses only when speciation supports them; exclude N2O from NOx. Particulate bins <=2.5, >2.5–10 and >10 micrometres are mutually exclusive; total PM/PM10 are QA observations, not added exchanges."
