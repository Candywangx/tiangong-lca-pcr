product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.coke-oven-products-refined-petroleum-products-nuclear-fuel.ethylene-propylene-butylene-butadiene"
  classification_refs: "CPC 3.0 33421; proposed narrower applicability, not an accepted mapping"
  covered_products: "Conforming gaseous ethylene (CAS 74-85-1) delivered from the defined fossil-ethane cracker and integrated front-end-demethaniser separation."
  excluded_products: "Pure butadiene or individual butenes as references; other olefin manufacture/recovery routes; liquid ethylene shipment; downstream polymers and extracted aromatics."
  representative_product: "One accepted bulk ethylene gas grade at the declared pipeline battery limit."
  production_route: "Fossil ethane receipt → steam cracking → water quench/condensate separation → compression/caustic wash → molecular-sieve drying → demethanisation and selective C2 hydrogenation → ethylene/ethane fractionation and recycle → integrated handling/delivery."
  market_state: "Ethylene gas at measured delivery pressure and temperature; composition, water/acetylene limits and phase shall satisfy the actual purchaser specification."
functional_unit:
  what: "Supply of conforming ethylene gas for chemical synthesis at the stated battery limit."
  how_much: "1 kg net accepted ethylene product grade, not 1 kg mixed olefins or purity-adjusted pure-component equivalent."
  how_well: "Meets the declared purchaser grade, assay, water/acetylene specification and pipeline acceptance; physical phase is demonstrated at actual pressure and temperature."
  how_long_or_cycle: "One representative reporting period that includes normal operation, startup/shutdown, trips, flaring, decoking and inventory changes."
  reference_flow_link: "ethylene_product"
system_boundary:
  rules:
    - rule_id: boundary_integrated
      applies_to: "ethane_steam_cracker"
      rule: "Include the declared integrated stages, recycle, furnaces, heat recovery, actual utilities, refrigeration, storage/delivery, source pretreatment, decoking and catalyst maintenance/regeneration. Stage data are collected separately, then consolidated as one foreground unit."
      source_ids:
        - jrc-lvoc-2017
        - epa-ethylene-2006
    - rule_id: boundary_feed_origin
      applies_to: "imported feed and materials"
      rule: "Link upstream natural-gas production, ethane recovery/separation and transport to the actual supplier/region. Retain feed composition, fossil/biogenic provenance, sulfur and source-specific provider quantities. Do not substitute refinery-naphtha production or wood/pulp evidence for this route."
      source_ids:
        - jrc-lvoc-2017
        - shell-monaca-2025
    - rule_id: boundary_internal_links
      applies_to: "recycle and recovery"
      rule: "Record ethane/propane recycle, internally recovered hydrogen, methane-rich firing gas, quench water, condensate and recovered steam with equal sender/receiver quantities in the same period. Cancel internal transfers in the aggregate boundary inventory. Record associated emissions once; do not add an upstream purchase or displacement credit for internally generated fuel."
      source_ids:
        - jrc-lvoc-2017
        - ipcc-chemical-2006
    - rule_id: boundary_external_products
      applies_to: "co-products"
      rule: "Preserve every actual gas, liquid and solid product output with composition, quantity, acceptance and destination, before allocation. Only net external delivery is a co-product. Mixed C4 and pyrolysis gasoline end at their transfer interface; their downstream extraction is not part of integrated ethylene separation."
      source_ids:
        - jrc-lvoc-2017
        - epa-ethylene-2006
    - rule_id: boundary_releases
      applies_to: "direct and waste interfaces"
      rule: "Include controlled/uncontrolled vents, leaks, furnace/flare/decoking outlets and actual refrigerant losses. Transfer distinct spent liquor, purge water and solids to their real external treatment datasets once. These transfers are not freshwater elementary emissions; direct releases require species and receiving-compartment rows."
      source_ids:
        - jrc-lvoc-2017
        - epa-ethylene-2006
    - rule_id: boundary_maintenance
      applies_to: "supply containers and equipment maintenance"
      rule: "Include actual catalyst/adsorbent/refrigerant replacement, lubricants, cleaning materials, packaging and reusable supply-container cleaning/repair/return services attributable to this route. Pipeline ethylene has no assumed disposable product package. Record each actual material/grade separately, distinguish tare from contents and returnable stock from consumption; include compatible service burdens once. Absence must be evidenced, not inferred from missing UUIDs."
      source_ids:
        - jrc-lvoc-2017
        - eu-pef-2021
    - rule_id: boundary_no_overlap
      applies_to: "alternatives and downstream datasets"
      rule: "Do not combine this route with independently modelled ethylene purification, refinery-gas recovery, C4/butadiene extraction, aromatics recovery or polymer manufacture. Utility/treatment datasets must begin at the declared transfer point without duplicating onsite processes. A different feed/configuration requires an applicability decision."
      source_ids:
        - jrc-lvoc-2017
        - epa-ethylene-2006
boundary_abstraction:
  declared_starting_condition: "Fossil ethane from identified natural-gas/NGL separation is received with quantity, composition, source and upstream reference basis; no refinery feed or purchased ethylene is assumed."
  starting_condition_role: "Physical foreground feed receipt, with upstream supply burdens linked separately."
  product_classification_scope: "The ethylene subset of CPC 3.0 33421 under this manufacturing route; other named products and routes are not automatically covered."
  recursive_input_rule: "Purchased ethylene used only as actual refrigerant make-up retains its own supplier dataset; it does not permit recursion into a second cracker or reclassification as independently purified feed. Internal ethylene diversion cancels within this unit."
  upstream_dataset_requirement: "Source-specific ethane recovery and supply, electricity/fuels/materials/steam, external treatment, and any actual externally supplied hydrogen or refrigerant with compatible quantity bases."
  disclosure: "State process diagram, feed origin, gas/liquid/solid outputs, internal transfers, shared utilities, external treatment points, gases and aqueous contaminants, controls, allocation, uncertainties and unresolved interfaces."
