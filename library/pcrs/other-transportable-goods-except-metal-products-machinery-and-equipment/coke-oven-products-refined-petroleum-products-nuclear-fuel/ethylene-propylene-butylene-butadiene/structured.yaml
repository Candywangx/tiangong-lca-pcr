              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_species
              source_ids:
                - jrc-lvoc-2017
                - ipcc-chemical-2006
                - nist-webbook-srd69
            ranges: []
allocation_rules:
  - rule_id: allocation_physical_ledger
    applies_to: "all stages and outputs"
    rule: "Keep the period physical ledger and material/water/carbon/sulfur/energy balances unchanged by allocation. Dividing an exchange by the reference denominator is normalization; multiplying a co-product's physical output by a burden share is prohibited. Retain actual export quantities and equal internal transfer pairs."
    source_ids:
      - jrc-lvoc-2017
      - ipcc-chemical-2006
      - eu-pef-2021
  - rule_id: allocation_subdivide
    applies_to: "separately metered stages"
    rule: "First investigate subdivision or system expansion. Assign separable product handling and independently metered duties directly to the relevant product. An expanded system reports its combined functions; it cannot silently produce a single-ethylene result with unverified displacement credits."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_shared
    applies_to: "residual inseparable burden"
    rule: "For remaining shared inputs/emissions, require a demonstrated relevant physical relationship. Mass or heating value alone is not proof of causal allocation for chemical products, fuels and steam together. If neither subdivision/expansion nor a relevant physical relation is feasible, justify economic allocation using contemporaneous net accepted external output and prices at the same transfer stage, retain all factors and compare a justified alternative sensitivity. No default shares are supplied."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_recovery
    applies_to: "internal fuel, exported utilities and wastes"
    rule: "Internal methane/hydrogen/steam/water reuse is not an external co-product and does not enter the export allocation denominator. External steam uses verified net useful heat and compatible price/physical units; its full water mass remains in the water ledger. Record actual product acceptance versus waste treatment and link external treatment once. Do not give saleable-product allocation to an unaccepted residue, or combine allocation with an unverified substitution credit for the same export."
    source_ids:
      - jrc-lvoc-2017
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "ethane_steam_cracker"
      flow_role: "fresh feed; one reference output; each co-product; internal links"
      record_type: "custody and stage mass record"
      raw_fields: "link id; stage sender/receiver; native property/unit; gross/net amount; accepted delivery versus production; returns/off-spec; opening/closing stocks; P_abs; T; humidity; Z; full gas/liquid/solid composition; constituent CAS/formula; C/H/O/N/S fractions; fossil/biogenic origin; phase/grade; acceptance; destination"
      collection_method: "Calibrated custody/stage meters, weighed records and actual chromatographic/elemental assays. Reconcile complete mixtures, internal recycle, hydrogen uptake, coke stocks and actual combustion/decoking air via cp_balance; no BREF exemplar yield is a measured quantity."
      unit: "kg; retain original m3/P/T"
      frequency: "continuous totals; each transfer and reconciled period"
      temporal_coverage: "same complete reporting period, including abnormal events"
      site_scope: "declared integrated units and custody points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assay QA; custody acceptance; uncertainty and matched link matrix"
    - protocol_id: cp_energy
      process_id: "ethane_steam_cracker"
      flow_role: "purchased gas/electricity/steam and exported steam"
      record_type: "utility and enthalpy record"
      raw_fields: "carrier/header id; gross amount; supplier m3 convention; P/T/Z and composition; NCV/GCV definition; electrical property/voltage; steam grade/enthalpy; condensate mass/enthalpy; recovery; destination; source carbon fractions"
      collection_method: "Use calibrated carrier meters and actual supplier definitions; measure return conditions and reconcile a joint heat/power/recovery balance. Meter furnace, compression, refrigeration and fractionation separately where possible; internal fuel cancels at the unit boundary but its actual combustion remains."
      unit: "m3; kWh; kg; MJ with basis"
      frequency: "continuous and each supply/export event"
      temporal_coverage: "same period plus event coverage"
      site_scope: "actual headers/meters and shared-utility attribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "provider background reference basis; meter QA; calorimetry; steam tables/EOS version; enthalpy reconciliation"
    - protocol_id: cp_water
      process_id: "ethane_steam_cracker"
      flow_role: "make-up; condensate; evaporation; purge interfaces"
      record_type: "water and composition record"
      raw_fields: "supply source/grade; mass or volume and density; dilution/quench/cooling/decoking circuit id; recirculation; make-up; bleed; return; evaporation; inventory; actual contamination"
      collection_method: "Separately meter external inputs/outputs and internal loop totals; assay water quality. Reconcile source pretreatment and actual external receiving treatment. Estimate evaporation only from a closed, uncertainty-documented balance or measurements, never from gross cooling circulation."
      unit: "kg; retain measured m3 and density"
      frequency: "continuous and each purge/decoking event"
      temporal_coverage: "same complete period"
      site_scope: "included water loops and external transfer points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "flowmeter QA; sampling chain; water balance; recipient acceptance; uncertainty"
    - protocol_id: cp_materials
      process_id: "ethane_steam_cracker"
      flow_role: "one actual chemical/catalyst/adsorbent/lubricant/refrigerant grade per row"
      record_type: "SKU and material account"
      raw_fields: "SKU; provider; constituent CAS; SDS; formulation/active fraction; water; grade; quantity; stock; installation/replacement; regeneration; phase; fossil/biogenic carbon; sulfur"
      collection_method: "Purchase/stock reconciliation and actual batch assays; record dry/solution/formulation mass correctly. Reconcile refrigerant make-up, circulating stock, recovery and directly measured or justified releases. Extend the atomic inventory for any extra actual grade or chemical; do not borrow database recipe numbers."
      unit: "kg and assay fractions"
      frequency: "each receipt/use/replacement plus period reconciliation"
      temporal_coverage: "period and maintenance/replacement history"
      site_scope: "included equipment and actual commercial grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specification and acceptance; SDS/assay agreement; mass-basis/provider compatibility"
    - protocol_id: cp_waste
      process_id: "ethane_steam_cracker"
      flow_role: "each liquid/solid waste at external transfer"
      record_type: "weighed waste and receiving record"
      raw_fields: "stream id; wet mass; water/dry solids; carbon; sulfur; metal/SKU contaminants; pH; COD; sulfide/sulfate; species concentrations; pretreatment; recipient; acceptance; treatment reference"
      collection_method: "Separately weigh/meter each spent liquor, purge, sludge, catalyst, adsorbent and oil. Apply actual analytical composition, retaining dissolved/dispersed fractions. Match receiving quantities and treatment starting condition; final external treatment emissions come from that service once."
      unit: "kg; constituent kg; original mg/L and volume"
      frequency: "each transfer and representative composite sampling"
      temporal_coverage: "period with decoking/maintenance events"
      site_scope: "source pretreatment to external receiving point"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "manifests; recipient receipts; lab QA; wet/dry reconciliation; no duplicated product/waste classification"
    - protocol_id: cp_stack
      process_id: "ethane_steam_cracker"
      flow_role: "actual furnace/flare/decoking outlet species and particles"
      record_type: "source monitoring record"
      raw_fields: "source/event id; duration; flow; concentration; wet/dry/reference P/T; gas composition; actual versus equivalent mass basis; fossil/biogenic fraction; controls/bypass; particle cut size; capture; detection limit"
      collection_method: "Integrate calibrated source-specific flow and speciated concentration through the period; retain flare gas quantity/composition and actual destruction evidence. Separately cover decoking/regeneration/startup/trips; resolve NO/NO2 quantity definitions and PM size cuts. Never infer complete destruction or a size/species split without evidence."
      unit: "species kg; original concentration/flow bases"
      frequency: "continuous where available; representative tests and each abnormal event"
      temporal_coverage: "all covered normal and abnormal operating hours"
      site_scope: "included combustion/flare/decoking sources after controls"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source test/CEMS QA; event logs; original method version; controls; detection-limit/uncertainty records"
    - protocol_id: cp_species
      process_id: "ethane_steam_cracker"
      flow_role: "actual fugitive/vent organic and sulfur species"
      record_type: "component and stream-speciation record"
      raw_fields: "equipment count/type; stream composition and CAS/isomer assay; pressure/phase; screening/test readings; leak durations/repairs; vent/flare routing; condensate handling; refrigerant source; carbon origin"
      collection_method: "Use an applicable documented component/vent measurement method and actual stream speciation; reconcile directly measured releases with any justified component calculations. Deduplicate captured, routed and emitted mass. Aggregate VOC/NMVOC legal reports remain QA evidence; unresolved species residual remains a disclosed gap."
      unit: "species kg; original method units"
      frequency: "survey schedule with repair durations and each vent event"
      temporal_coverage: "period with actual equipment and event coverage"
      site_scope: "included feed, recycle, separation, delivery, liquor handling and refrigeration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component census; stream assays; method applicability; repair history; bound/sensitivity for unspeciated mass"
    - protocol_id: cp_balance
      process_id: "ethane_steam_cracker"
      flow_role: "all physical links, reaction stages, air and water carriers"
      record_type: "whole mass, compound and atom reconciliation"
      raw_fields: "stream/event id; total mass; full constituent mass/mole fractions; CAS/formula; molecular/atomic basis; unresolved fraction; incoming air/O2/N2/Ar/water; outgoing O2/N2/Ar/H2O and other gas; liquid carried water; reaction extent; coke and installed-material stocks; heat/work/chemical energy and losses; uncertainty"
      collection_method: "Meter actual air/oxygen/purge and exhaust; derive mixture mass only from compatible measured composition and P/T/Z. Assay all phases and close sum fractions with unresolved remainder explicit; no invented oxygen/air ratio or formula for a mixture. Reconcile C/H/O/N/S and other actually material elements, compound reaction balances and water; keep reaction source terms solely in species account. Use actual common energy datum/NCV-GCV, sensible/latent heat, reaction duty and stock energy; avoid duplicating fuel chemical energy as purchased heat."
      unit: "kg; mol with basis; MJ with datum"
      frequency: "continuous totals plus each decoking/abnormal/maintenance event"
      temporal_coverage: "same complete period as Q"
      site_scope: "every stage then aggregate boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full assays; humidity/oxygen and meter QA; atom/whole mass residuals; energy reconciliation and uncertainty"
    - protocol_id: cp_stock
      process_id: "ethane_steam_cracker"
      flow_role: "feed, products, coke, loops, installed consumables and returnable containers"
      record_type: "period quantities and carried burden record"
      raw_fields: "cohort/stock id; opening/closing quantity and composition; acquisition/use/return/disposal; original carried burden by cohort; current-period burden; recipient; allocation/service driver and life/use records"
      collection_method: "Reconcile opening + receipts/production - use/delivery/return/disposal = closing with uncertainty. Trace burdens carried into, consumed within and carried out of the period; do not charge every purchase/installation to current delivery or omit opening stock burden. Reuse catalyst/adsorbent/refrigerant and container stock without counting circulating mass as new input; collect actual cleaning/repair and replacement separately. Unknown life/use evidence remains a disclosed coverage debt, not a fabricated lifetime."
      unit: "kg; actual service units; native burden units"
      frequency: "each receipt/use/return/replacement plus period close"
      temporal_coverage: "period plus linked acquisition/service cohorts"
      site_scope: "included equipment, material stocks and supply-return interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "acquisition/stock/return records; carried-burden ledger; maintenance and measured service basis"
    - protocol_id: cp_links
      process_id: "ethane_steam_cracker"
      flow_role: "every actual upstream supply and receiving service"
      record_type: "original and scaled background-link record"
      raw_fields: "foreground row/link id; provider/service identity, source version/hash; route/state/grade/geography; reference exchange/property/unit; native reference quantity; original exchange quantities; supplier quantity convention; conversion formula/data; treatment entry state/wet-dry basis; collection period; link scale; original and scaled burdens"
      collection_method: "Compare full provider reference against each physical flow and actual interface. Preserve native exchanges q_j and provider reference r, then scale q_j by compatible foreground provider quantity L/r and normalize by Q; audit original and scaled quantities/units. Collect source-specific gas reference P/T/moisture/Z/composition, steam pressure/enthalpy/net heat and actual return pairing. kg waste or returned container is not by itself a treatment/service unit; match receiving acceptance and measured service basis. No background source is silently chosen or default metadata factor used; unknown fields prevent completion of that link. Supplied/installed consumables and their cleaning/replacement services enter the direct or shared burden pool only once after stock reconciliation; a waste-treatment service must not reproduce the same physical waste as a second foreground output."
      unit: "native quantity/property/unit; explicit compatible converted units"
      frequency: "each provider/reference/interface change plus period reconciliation"
      temporal_coverage: "same period and declared provider temporal scope"
      site_scope: "actual supply/receiving boundary without onsite overlap"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source/hash-bound native provider records; original/scaled exchange comparison; recipient receipts; conversion and overlap audit"
    - protocol_id: cp_allocation
      process_id: "ethane_steam_cracker"
      flow_role: "directly attributable and residual shared environmental burdens"
      record_type: "separate burden allocation account"
      raw_fields: "unit duty; direct/shared inputs and releases; actual external product quantities; physical-driver evidence; common-stage net prices; factors; internal/export tags; uncertainty"
      collection_method: "Retain the unallocated physical ledger. Test subdivision/expansion and physical relationships; document any economic fallback and sensitivity using actual quantity/price units and the same period. Factor sums must close for the declared product set."
      unit: "original burden units; kg or useful MJ; currency per compatible unit"
      frequency: "reconciled period and material changes"
      temporal_coverage: "same complete reporting period"
      site_scope: "allocated functions and original boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "allocation rationale; metering; price records; sum check; sensitivity; physical versus burden ledger distinction"
  calculation_rules:
    - id: period_reference
      applies_to: "all inventory rows"
      rule: "Let Q be net accepted ethylene grade mass in the reporting period. Preserve each reconciled boundary physical exchange X_i in its own units; report physical x_i = X_i / Q per 1 kg reference flow. The ethylene_product output is 1 kg. Internal paired transfers cancel; no co-product physical output is multiplied by a burden factor."
      inputs:
        - cp_mass
        - cp_energy
        - cp_water
        - cp_materials
        - cp_waste
        - cp_stack
        - cp_species
      output: "physical normalized ledger"
      source_ids:
        - jrc-lvoc-2017
    - id: gas_conversion
      applies_to: "gas measurement records"
      rule: "n = P_abs V / (Z R T); mass = n times sum of mole_fraction_s times molar_mass_s. Use the actual gas/water composition, pressure/temperature basis and supplier background definition; separately prove applicability to any reference m3."
      inputs:
        - "actual gas fields"
        - cp_mass
        - cp_energy
      output: "compatible gas quantities, no default density"
      source_ids:
        - nist-webbook-srd69
    - id: net_heat
      applies_to: "steam and return interfaces"
      rule: "Useful heat = sum of externally supplied steam mass times its specific enthalpy minus sum of actually returned-water mass times its specific enthalpy, with boundary losses/stock disclosed. Keep imported and exported headers separate, and keep gross steam/water mass in the physical ledger."
      inputs:
        - cp_energy
        - cp_water
      output: "supplier-compatible net useful heat"
      source_ids:
        - jrc-lvoc-2017
    - id: species_mass
      applies_to: "source concentrations and losses"
      rule: "Integrate source flow times concentration over actual operating/event time after compatible wet/dry/P/T conversion. For carbon-based observations, use actual species composition and molecular conversion; for NO2-equivalent observations, use measured NO/NO2 proportions or keep the split pending. Final emitted mass is after actual capture/destruction, without double counting captured/routed streams."
      inputs:
        - cp_stack
        - cp_species
      output: "actual species mass and uncertainty"
      source_ids:
        - jrc-lvoc-2017
        - nist-webbook-srd69
    - id: element_balances
      applies_to: "physical process diagram"
      rule: "Whole mass: sum actual incoming mass - sum actual outgoing mass - (closing stock - opening stock) = residual. For each E in C/H/O/N/S, replace each stream mass by its measured elemental mass; distinguish fossil/biogenic C. Include full compounds/mixtures, salt/metal/other material constituents, carrier water and actual air/O2/N2/Ar/humidity, exhaust species, captured solids and installed/coke stocks. No reaction sources/sinks enter whole mass or elemental conservation. Species: in_s + formed_s - out_s - consumed_s - stock_change_s = residual_s, with consistent reaction extents and atoms and no double-counted exchanged mass. For H2O, measured reaction formation/consumption can also enter this species balance; net atmospheric water subtracts measured incoming humidity. Quantify residual/uncertainty, never assign unknown mass to CO2/VOC or zero."
      inputs:
        - cp_mass
        - cp_balance
        - cp_stock
        - cp_water
        - cp_waste
        - cp_stack
        - cp_species
      output: "whole mass, compound, C/H/O/N/S and water QA plus residual"
      source_ids:
        - ipcc-chemical-2006
        - jrc-lvoc-2017
        - nist-webbook-srd69
    - id: gross_net_air
      applies_to: "air/exhaust and compound-ledger interfaces"
      rule: "Use complete gross inlet air and outlet exhaust for whole-mass/atom QA; constituent masses decompose their parent stream and are not additional whole-stream mass. Include actual oxygen/nitrogen/argon, water humidity and every measured compound. Process-added atmospheric release is the source/event-matched net amount after measured inlet-carried background subtraction where applicable; preserve both gross observations and the net exchange. No fixed air ratio, complete combustion assumption, hidden unspeciated remainder or duplicate mixture-plus-component mass. Add atomic actual oxygen/purge/material/release rows when applicable; ambient carrier quantities remain explicit in the physical link matrix rather than invented positive exchanges."
      inputs:
        - cp_balance
        - cp_stack
        - cp_species
        - cp_water
      output: "distinct gross physical and net-release accounts"
      source_ids:
        - jrc-lvoc-2017
        - nist-webbook-srd69
    - id: period_carry
      applies_to: "physical and burden stock accounts"
      rule: "For each traced stock/cohort, opening + acquired/generated - used/delivered/returned/disposed = closing, retaining original quantity units. Trace attributable burden similarly: opening carried burden + newly attributable burden - burden accompanying actual use/delivery/return/disposal = closing carried burden; this is a burden-tracing identity, not physical mass allocation. Match delivered product cohorts to Q; preserve returned burdens and recipient responsibility, avoiding duplicate supply/treatment credits. Catalyst/adsorbent/container service shares require actual duty/use/replacement evidence, never a default lifetime."
      inputs:
        - cp_stock
        - cp_mass
        - cp_materials
        - cp_links
        - cp_allocation
      output: "period-linked physical stock and burden ledgers"
      source_ids:
        - jrc-lvoc-2017
        - eu-pef-2021
    - id: provider_scale
      applies_to: "each background link"
      rule: "Let r be the provider native reference quantity and L the compatible foreground quantity after evidenced property/unit/state conversion. Preserve native exchange q_j; linked exchange is q_j times L/r and its normalized quantity is q_j times L/r/Q. Preserve original/scaled units, conversion data, provider source and receiving state. Distinguish physical waste mass from service reference/duty and stock-carried burden from current acquisition; link once before residual-shared burden allocation."
      inputs:
        - cp_links
        - cp_stock
        - cp_energy
        - cp_waste
      output: "auditable native and scaled provider/service quantities"
      source_ids:
        - jrc-lvoc-2017
        - eu-pef-2021
    - id: burden_allocation
      applies_to: "environmental burden ledger only"
      rule: "For output p, b_p = (direct burden_p + alpha_p times residual shared burden) / Q_p, retaining original burden units. Sum alpha_p = 1 for the declared eligible external product set. If justified economic allocation is used, alpha_p = value_p / sum value_j, where value uses actual accepted mass or verified useful heat times a compatible common-stage unit price. Internal fuel is excluded. Physical Y_j remains Y_j and physical normalized output remains Y_j / Q_ethylene."
      inputs:
        - cp_allocation
        - "reconciled product and utility quantities"
      output: "allocated burden per reference product plus unchanged physical outputs"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: route_identity
      applies_to: "applicability"
      requirement: "Actual fossil-ethane feed, front-end demethanisation, C2 hydrogenation, gas delivery and treatment interfaces must match the declared route; do not use a classification label as process evidence."
      evidence: "supplier assays; P&ID/process diagram; actual SKU/grade; custody and receiving records"
    - id: flow_chain
      applies_to: "every UUID-bearing exchange"
      requirement: "Search hit, direct state-100 identity, CAS/name/comment/route, type, actual compartment, reference property and unit-group/unit must all agree. Product identity does not establish provider quantity compatibility. Specific unresolved flows retain blank UUIDs, not a nearby proxy/correction flow."
      evidence: "retained original lookup and support-row evidence outside canonical PCR"
    - id: full_period
      applies_to: "quantities and emissions"
      requirement: "Same representative period across denominators, products, inventories, startup/shutdown, decoking and waste; report uncovered hours, detection limits and uncertainty rather than assuming zero."
      evidence: "cp_mass through cp_allocation originals"
    - id: complete_species
      applies_to: "emissions and carbon origin"
      requirement: "Keep actual chemical and isomer species, fossil/biogenic CO2 and methane, and non-overlapping PM. Extend for all actual additional species; do not erase ethane/biogenic CO2 due to reporting conventions."
      evidence: "actual stream/CAS assays; source-specific methods; reconciled balances"
    - id: no_default_factors
      applies_to: "external evidence"
      requirement: "BREF tables and historical national/single-site data support only their own stated context; none supplies a universal recipe, positive emission or quantity for this route."
      evidence: "source locators, conditions and actual foreground collection"
    - id: ready_dataset
      applies_to: "first dataset completion"
      requirement: "Missing reference identity, provider basis, steam net-heat basis, emission speciation, recipient chain or material-balance closure blocks a complete usable dataset; record each debt and its needed evidence. Methodological scientific review is a separate requirement."
      evidence: "identity/property/unit evidence; actual collection; independent methodology review"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_flow and ethylene_product"
    rule: "Require exactly one 1 kg accepted ethylene output, the declared gas/grade/feed/route/custody qualifiers, and compatible verified flow/property/unit-group references before UUID-bound dataset completion. No proxy reference is accepted."
    source_ids:
      - jrc-lvoc-2017
      - nist-webbook-srd69
  - rule_id: validate_balances
    applies_to: "physical versus burden accounts"
    rule: "Check complete whole-mass/C/H/O/N/S, full compounds/mixtures, net water/humidity, actual oxygen/air and exhaust, energy datum/heat recovery, installed/coke and other stocks, returns, containers/maintenance and matched link pairs. No reaction source terms in conserved whole mass/atoms; reaction terms enter species balances once. Check uncertainty/residual and carried stock burdens. Allocation must not reduce actual co-product output or internal transfer quantities."
    source_ids:
      - jrc-lvoc-2017
      - ipcc-chemical-2006
      - eu-pef-2021
  - rule_id: validate_emissions
    applies_to: "elementary rows"
    rule: "Check substance/isomer CAS, actual air compartment, carbon origin, physical species mass and independent NOx/N2O handling. Reconcile aggregate VOC observations on the same source/period/basis to separately measured species and disclose only the unspeciated residual; the residual cannot mask known compounds/isomers or be double-added to them. Physical biogenic origin requires original source evidence, not a cleaning-solvent trace or assumed biomass. No biogenic CO2 is omitted, and nested PM fractions are not summed twice. Unknown speciation, controls or quantity basis remain incomplete."
    source_ids:
      - jrc-lvoc-2017
      - ipcc-chemical-2006
      - nist-webbook-srd69
  - rule_id: validate_interfaces
    applies_to: "route and background links"
    rule: "Require compatible source-specific feed/utility references and receiving treatment boundaries. No in-boundary separation is duplicated by external purification; C4 extraction/aromatics/polymer stages remain external. Waste transfer is not a direct-water elementary release."
    source_ids:
      - jrc-lvoc-2017
      - epa-ethylene-2006
  - rule_id: validate_links
    applies_to: "upstream and receiving-service matrix"
    rule: "Verify every source identity/hash, native reference quantity/property/unit, complete native exchange list and actual original-to-scaled calculation; check gas/steam/condensate/phase/grade/geography and service entry state against the real interface. Trace supplier/recipient return and stock burdens once, then direct versus shared service burdens in cp_allocation. Hard opposed source route/state fields cannot be repaired by a name match or invented grade. Unknown actual fields block the corresponding link, not automatically the method. Withdraw an opposed inventory UUID while keeping its specific physical row and gap visible. Only an unresolved actual method, reference or measurement blocker requires draft maturity; an ordinary coproduct-identity gap alone does not."
    source_ids:
      - jrc-lvoc-2017
      - eu-pef-2021
  - rule_id: validate_completeness
    applies_to: "actual dataset"
    rule: "Distinguish quantity-check coverage, flow-identity verification, factory-record completeness and independent methodology review. A lookup/authentication failure cannot be reported as no-match or a completed audit. Unresolved reference or support fields block UUID-bound production."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground route-specific ethylene production; physical ledger and separately derived allocated burden ledger."
  downstream_use: "secondary_dataset; background_dataset, only after the required evidence and reviews are complete."
  allowed_use: "Chemical supply LCA using the same accepted gaseous ethylene grade, fossil-ethane route, feed origin, period, boundary and allocation."
  excluded_use: "Other feedstock/manufacturing/recovery routes; independently purified purchased ethylene; liquid dispatch; pure butadiene/butene production; downstream extraction or polymer manufacture; use as an approved method merely because a projection/quantity check succeeded."
  required_metadata: "PCR id; actual reference identity/support references; product grade/CAS/phase/P/T; feed and provider origins; diagram and configuration; period; custody; actual co-product/waste composition and recipient; utility quantity definitions and net heat; internal links; physical balances; allocation; data owner and review state."
  required_quality_disclosure: "Identity and provider-basis debts; measurement/speciation coverage; abnormal events; detection limits; source-rule applicability; physical versus allocated quantities; balance residuals; treatment references; uncertainty and allocation sensitivity; excluded processes; independent review status."
  update_trigger: "Feed origin/composition; furnace/separation/refrigeration configuration; delivery phase/grade; sulfur dosing; utilities/provider definitions; treatment recipient or control changes; material measured imbalance or newly identified species; changed allocation or review findings."
data_sources:
  - id: "jrc-lvoc-2017"
    type: "official_guidance"
    reference: "European Commission JRC, 2017 LVOC BREF, JRC109279, EUR 28882 EN, DOI https://doi.org/10.2760/77304; official PDF https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf. Chapter 3 §§3.2.1–3.2.3, 3.3.1.1–3.3.1.5, 3.3.2–3.3.6; Figures 3.2–3.3, printed pp.126–156 (PDF pp.164–194)."
    used_for: "Route limitations, integrated separation/recirculation, actual co-products, caustic/drying/hydrogenation, decoking, waste/water/energy interfaces and species monitoring needs. Table 3.3 printed p.133 explicitly gives exemplary once-through yields, not overall recycle-adjusted yields or products present at every plant; none is a default quantity."
  - id: "epa-ethylene-2006"
    type: "official_guidance"
    reference: "U.S. EPA, Ethylene MACT Compliance Manual, July 20 2006, printed p.2-5 (PDF p.16), https://www.epa.gov/sites/default/files/2015-06/documents/ethylene_mact_compliancemanual_final-1-24-07.pdf."
    used_for: "Historical manufacturing-unit boundary and distinction between integrated associated cuts and downstream butadiene/aromatics manufacture. No claim of current legal applicability, universal emission factors or a plant recipe."
  - id: "ipcc-chemical-2006"
    type: "official_guidance"
    reference: "2006 IPCC Guidelines, Volume 3 Chapter 3 §§3.9.2.1, 3.9.2.3–3.9.2.4, 3.9.4; printed pp.3.63–3.67, 3.81–3.83, 3.88; https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/3_Volume3/V3_3_Ch3_Chemical_Industry.pdf."
    used_for: "Characterisation of feed/product/by-product carbon and energy interfaces, actual source measurements and duplicate-combustion avoidance. The Tier 2 national-inventory assumption that non-CO2 carbon becomes CO2 is expressly not adopted as species-resolved LCI; no historical default factors adopted."
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I §4.5, Annexes PDF pp.63–64, http://data.europa.eu/eli/reco/2021/2279/oj."
    used_for: "Generic multifunctionality hierarchy, proof of a physical relation, justified economic fallback and disclosure; no sector-specific livestock/paper recipe or allocation factor is transferred."
  - id: "shell-monaca-2025"
    type: "literature"
    reference: "Shell, Our growth projects, Shell Polymers Monaca section, page last updated 30 October 2025, https://www.shell.com/business-customers/chemicals/about-shell-chemicals/our-growth-projects.html."
    used_for: "Actual producer illustration of shale-gas-derived ethane origin; not a product yield, ethylene capacity, energy intensity or default configuration. Polyethylene capacity is not an ethylene inventory denominator."
  - id: "nist-webbook-srd69"
    type: "dataset"
    reference: "NIST Chemistry WebBook SRD 69, actual substance/CAS records, https://webbook.nist.gov/chemistry/; ethylene https://webbook.nist.gov/cgi/cbook.cgi?ID=C74851&Units=SI; named species are selected by their individual CAS."
    used_for: "Chemical/CAS identity and molecular interpretation only; no Tiangong UUID, environmental compartment, plant phase, production recipe or background provider basis is inferred."
