    reference: "U.S. EPA, AP-42 Section 5.2 Transportation and Marketing of Petroleum Liquids, June 2008, https://www.epa.gov/sites/default/files/2020-09/documents/5.2_transportation_and_marketing_of_petroleum_liquids.pdf; retrieved 2026-08-09"
