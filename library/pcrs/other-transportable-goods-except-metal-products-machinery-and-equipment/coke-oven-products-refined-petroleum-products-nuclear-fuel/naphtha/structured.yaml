            ranges: []
allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "refinery units and directly metered streams"
    rule: "Avoid allocation by subdividing unit operations and assigning directly measured feed, energy, materials, wastes, and releases to the process and product that cause them."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical_relationship
    applies_to: "inseparable multifunctional refinery operations"
    rule: "When subdivision or justified system expansion is not possible, use a documented, quantifiable physical relationship that reflects how shared inputs and releases relate to the co-product functions; do not select mass or energy content merely because it is convenient."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_other_relationship
    applies_to: "operations with no defensible physical relationship"
    rule: "If another relationship such as economic allocation is used, document why subdivision, system expansion, and physical allocation were rejected; use prices at the co-production stage and test sensitivity to the allocation basis and price period."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_internal_energy
    applies_to: "refinery gas, recovered heat, steam, hydrogen, and internal recycle"
    rule: "Keep recovered energy and internal transfers visible. Assign shared utility burdens consistently with the chosen allocation method and prevent credits or avoided burdens from being counted twice."
    source_ids:
      - eu-pef-2021
      - us-epa-ap42-refining-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_refinery_mass_balance
      process_id: "refinery_separation"
      flow_role: "refinery feed, separated naphtha, and co-products"
      record_type: "custody meters, tank gauges, laboratory release records, and production ledger"
      raw_fields: "stream_id; grade; opening_inventory; receipts; transfers; recycle; closing_inventory; saleable_output; meter_unit; density; reference_temperature"
      collection_method: "Calibrated mass meter or reconciled volume meter plus density, matched to tank and production records."
      unit: "kg; source units retained"
      frequency: "Per batch or shift; reconciled monthly"
      temporal_coverage: "At least one representative 12-month period or every campaign for campaign production"
      site_scope: "All included separation units and connected tanks"
      aggregation_rule: "Reconcile feed and outputs over a common period; investigate unexplained imbalance; normalize only after allocation."
      quality_evidence: "calibration records; tank reconciliation; laboratory release certificate; signed production ledger"
    - protocol_id: cp_treatment_mass_balance
      process_id: "naphtha_treatment"
      flow_role: "naphtha input, conforming output, recycle, off-spec, and co-products"
      record_type: "unit meters, tank gauges, laboratory records, and operating log"
      raw_fields: "stream_id; input_mass; output_mass; recycle_mass; offspec_mass; inventory_change; treatment_route; quality_result"
      collection_method: "Calibrated meters with batch or period mass-balance reconciliation."
      unit: "kg"
      frequency: "Per batch or shift; reconciled monthly"
      temporal_coverage: "Same period as represented treatment campaign"
      site_scope: "Every included treatment unit"
      aggregation_rule: "Reconcile all hydrocarbon inputs and outputs; retain off-spec and recycle separately."
      quality_evidence: "meter calibration; laboratory analysis; operating log; reconciliation approval"
    - protocol_id: cp_treatment_inputs
      process_id: "naphtha_treatment"
      flow_role: "hydrogen, treatment chemicals, water, and treatment utilities"
      record_type: "flow meters, utility meters, issue records, purchase records, and stock ledger"
      raw_fields: "input_id; quantity; concentration; meter_start; meter_end; opening_stock; receipts; issues; closing_stock; unit"
      collection_method: "Direct metering by carrier or substance preferred; otherwise reconcile purchases, issues, and stock change for the represented treatment unit."
      unit: "kg; m3; kWh; MJ; source units retained"
      frequency: "Continuous or per issue; reconciled monthly"
      temporal_coverage: "Same period as represented treatment campaign"
      site_scope: "Every included treatment unit and its dedicated input storage"
      aggregation_rule: "Calculate net consumption separately by carrier or substance; keep recovered or returned material distinct and apply shared-utility allocation only after the site balance."
      quality_evidence: "meter calibration; invoice; issue record; stocktake; utility balance; allocation record"
    - protocol_id: cp_storage_dispatch
      process_id: "storage_and_loading"
      flow_role: "naphtha receipts, tank inventory, blend transfers, and dispatch"
      record_type: "tank gauges, custody-transfer meter, bill of lading, and release certificate"
      raw_fields: "tank_id; opening_inventory; receipts; blend_transfers; returns; closing_inventory; dispatch_mass; grade; destination; custody_point"
      collection_method: "Custody-transfer mass meter or volume meter with stream-specific density and reference temperature."
      unit: "kg; L or m3 with conversion evidence"
      frequency: "Each transfer; reconciled monthly"
      temporal_coverage: "Same reporting period as production"
      site_scope: "All final product tanks and loading systems"
      aggregation_rule: "Net dispatch equals measured dispatch less returns, with inventory and internal transfers reconciled."
      quality_evidence: "meter proving; gauge records; bill of lading; quality release certificate"
    - protocol_id: cp_energy_records
      process_id: "refinery_separation_naphtha_treatment_storage_and_loading"
      flow_role: "electricity, steam, heat, fuel, and recovered energy"
      record_type: "utility meters, fuel ledger, and engineering allocation record"
      raw_fields: "carrier; meter_start; meter_end; heating_value; import; export; recovered_energy; unit; allocation_driver"
      collection_method: "Direct submetering preferred; otherwise documented engineering allocation from a complete site utility balance."
      unit: "kWh; MJ; kg steam; source units retained"
      frequency: "Continuous or shift readings; monthly reconciliation"
      temporal_coverage: "Same period as represented production"
      site_scope: "Included units and shared utilities"
      aggregation_rule: "Net each carrier separately; allocate shared utilities after site balance; do not net different carriers."
      quality_evidence: "meter calibration; invoice; utility balance; allocation workbook"
    - protocol_id: cp_material_and_water_records
      process_id: "refinery_separation_naphtha_treatment"
      flow_role: "water, hydrogen, catalysts, caustic, and treatment chemicals"
      record_type: "purchase, issue, meter, and inventory records"
      raw_fields: "material_id; quantity; concentration; opening_stock; receipts; issues; closing_stock; recycle; unit"
      collection_method: "Metered use or stock-change reconciliation by substance and concentration."
      unit: "kg; m3; source units retained"
      frequency: "Per issue or continuous meter; monthly reconciliation"
      temporal_coverage: "Same period as represented production"
      site_scope: "Included units and storage"
      aggregation_rule: "Net consumption equals opening stock plus receipts minus closing stock minus documented transfers or returns."
      quality_evidence: "invoice; meter calibration; stocktake; specification or certificate of analysis"
    - protocol_id: cp_direct_emissions
      process_id: "refinery_separation_naphtha_treatment"
      flow_role: "combustion, process, vent, flare, and fugitive emissions"
      record_type: "continuous monitoring, stack tests, leak surveys, flare and activity records, and permit calculations"
      raw_fields: "source_id; pollutant; measured_concentration; flow_rate; duration; activity; factor; control_efficiency; downtime; method"
      collection_method: "Use applicable direct measurement first; otherwise a documented regulatory or engineering method with current site activity data."
      unit: "kg pollutant; source units retained"
      frequency: "Monitoring frequency required by the applicable permit or method; at least each material operating mode"
      temporal_coverage: "Same period as represented production, including startups, shutdowns, and abnormal events"
      site_scope: "All attributable direct sources and shared sources after allocation"
      aggregation_rule: "Integrate measured releases over time; calculate other releases from activity and method; subtract only verified capture or recovery."
      quality_evidence: "monitoring QA/QC; stack test; leak-detection record; flare log; permit report; calculation file"
    - protocol_id: cp_wastewater_releases
      process_id: "refinery_separation_naphtha_treatment"
      flow_role: "wastewater and final releases to water"
      record_type: "flow meter, composite sample, laboratory result, and treatment log"
      raw_fields: "discharge_point; volume; pollutant; concentration; sample_time; detection_limit; treatment_route; receiving_compartment"
      collection_method: "Flow-proportional composite sampling where appropriate, paired with represented discharge volume."
      unit: "m3; mg/L; kg"
      frequency: "Permit frequency and after material process changes"
      temporal_coverage: "Same period as represented production"
      site_scope: "All included discharge points and outsourced treatment transfers"
      aggregation_rule: "Pollutant mass equals concentration times represented volume; handle non-detects by a disclosed rule; avoid double counting internal transfers."
      quality_evidence: "accredited laboratory result; sampler log; flow-meter calibration; permit report"
    - protocol_id: cp_waste_records
      process_id: "refinery_separation_naphtha_treatment_storage_and_loading"
      flow_role: "sludges, spent treatment materials, tank bottoms, and other wastes"
      record_type: "weighbridge ticket, waste manifest, contractor record, and stock ledger"
      raw_fields: "waste_id; composition; mass; date; origin_unit; destination; treatment_route; opening_stock; closing_stock"
      collection_method: "Direct weighing preferred; otherwise documented stock-change mass balance."
      unit: "kg"
      frequency: "Each shipment and monthly inventory"
      temporal_coverage: "Same period as represented production, with campaign wastes annualized only when justified"
      site_scope: "All included units and temporary waste storage"
      aggregation_rule: "Sum dispatched waste plus inventory change; keep recycling, recovery, treatment, and disposal routes separate."
      quality_evidence: "weighbridge calibration; manifest; contractor certificate; stocktake"
    - protocol_id: cp_storage_voc
      process_id: "storage_and_loading"
      flow_role: "tank, loading, and equipment-leak releases"
      record_type: "tank parameters, throughput, vapor properties, loading mode, vapor-control monitor, and leak survey"
      raw_fields: "source_id; throughput; liquid_temperature; vapor_pressure; vapor_molecular_weight; loading_mode; capture_efficiency; control_efficiency; downtime; measured_outlet; leak_rate"
      collection_method: "Direct monitoring where required; otherwise a documented AP-42 or permit-consistent calculation using site-specific inputs."
      unit: "kg pollutant; source units retained"
      frequency: "Each loading event or monthly calculation; continuous control monitoring where installed"
      temporal_coverage: "Same period as represented dispatch"
      site_scope: "All naphtha tanks, loading racks, and associated equipment"
      aggregation_rule: "Calculate by source and substance; add control residuals and uncontrolled downtime; keep recovered vapor internal."
      quality_evidence: "control monitor; calculation file; leak survey; throughput and vapor-property records"
  calculation_rules:
    - id: calc_net_naphtha_output
      applies_to: "each included process and final reference output"
      rule: "Net conforming output = measured outbound transfer + closing conforming inventory - opening conforming inventory - returned or internally recycled quantity; adapt signs transparently to the site's ledger convention."
      inputs:
        - "outbound transfers"
        - "opening inventory"
        - "closing inventory"
        - returns
        - "internal recycle"
        - "off-spec diversion"
      output: "net conforming naphtha mass"
      source_ids:
        - eu-pef-2021
    - id: calc_volume_to_mass
      applies_to: "liquid streams recorded by volume"
      rule: "Mass = observed or reference-temperature-corrected volume × density applicable to the same stream and temperature basis."
      inputs:
        - volume
        - density
        - "measurement temperature"
        - "reference temperature"
        - "correction method"
      output: "stream mass in kg"
      source_ids:
        - unsd-cpc-3-2025
    - id: calc_normalized_inventory
      applies_to: "every inventory row"
      rule: "Normalized amount = allocated reporting-period row quantity ÷ net reporting-period conforming naphtha output × 1,000 kg."
      inputs:
        - "row quantity"
        - "allocation factor"
        - "net conforming output"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - eu-pef-2021
    - id: calc_pollutant_release
      applies_to: "calculated elementary flows"
      rule: "Pollutant mass = integrated measured mass rate, or activity × applicable factor adjusted by verified capture and control efficiency; method, factor version, operating mode, and downtime shall be retained."
      inputs:
        - "monitoring data or activity"
        - factor
        - "capture efficiency"
        - "control efficiency"
        - downtime
      output: "pollutant mass by source and compartment"
      source_ids:
        - us-epa-ap42-refining-2015
        - us-epa-ap42-petroleum-liquids-2008
        - eu-refinery-bat-2014
    - id: calc_allocation_factor
      applies_to: "shared refinery unit or utility burdens"
      rule: "Allocation factor = the naphtha-specific value of the declared allocation driver divided by the sum of that driver across all co-products; apply the same factor consistently to shared inputs, wastes, and releases and document exceptions."
      inputs:
        - "co-product quantities"
        - "physical or economic driver"
        - "prices and price period when used"
      output: "naphtha allocation factor"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and intermediate naphtha streams"
      requirement: "Retain grade, actual distillation range, treatment route, contractual quality results, density basis when used, and custody-transfer point; demonstrate that the output remains within the naphtha category and is not a separately classified fuel, solvent, or downstream chemical."
      evidence: "laboratory certificate; product specification; flow identity; batch and transfer records"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use a common representative period, normally at least 12 months unless campaign production is justified; align material, utility, emission, wastewater, and waste data and disclose shutdowns, startups, and abnormal events."
      evidence: "period coverage table; operating calendar; reconciliation report"
    - id: dq_technology
      applies_to: "separation, treatment, storage, and control systems"
      requirement: "Identify the actual fractionation, treatment, tank, loading, vapor-control, wastewater, and emission-control technologies and demonstrate that selected secondary datasets represent them."
      evidence: "process flow diagram; equipment list; technology-to-dataset mapping"
    - id: dq_geography
      applies_to: "upstream datasets and direct releases"
      requirement: "Use geography-specific upstream supply and regulatory context where material; disclose mismatches between refinery location, crude origin, electricity, hydrogen, and other upstream datasets."
      evidence: "supplier origin; dataset metadata; geography gap assessment"
    - id: dq_completeness
      applies_to: "inventory and boundary"
      requirement: "Reconcile total hydrocarbon mass, include material energy and water carriers, direct and fugitive emissions, wastewater releases, and wastes, and justify every exclusion."
      evidence: "mass and energy balances; completeness checklist; permit-to-inventory crosswalk"
    - id: dq_precision_uncertainty
      applies_to: "measured, calculated, and allocated values"
      requirement: "Retain calibration, sampling, detection-limit, factor, allocation, and uncertainty information; distinguish measured data from calculated values and assess sensitivity to material allocation choices."
      evidence: "calibration and QA/QC records; calculation files; uncertainty and sensitivity results"
    - id: dq_representativeness
      applies_to: "completed foreground dataset"
      requirement: "Assess technological, geographical, and time representativeness and precision, and report completeness and methodological consistency."
      evidence: "documented data-quality assessment consistent with eu-pef-2021"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "The product flow UUID, Mass property UUID, Units of mass UUID, 1,000 kg reference amount, CPC boundary, grade, distillation range, treatment route, and custody-transfer point shall all be present and mutually consistent."
    source_ids:
      - unsd-cpc-3-2025
  - rule_id: validate_process_coverage
    applies_to: "foreground process map"
    rule: "Separation and final storage/loading shall be present; treatment shall be present whenever the declared product route includes stabilization, hydrotreating, sweetening, fraction adjustment, or specification blending."
    source_ids:
      - us-epa-ap42-refining-2015
      - eu-refinery-bat-2014
  - rule_id: validate_mass_balance
    applies_to: "each process and reporting period"
    rule: "Hydrocarbon inputs, outputs, recycle, inventory change, off-spec diversion, wastes, and unexplained imbalance shall be reconciled before normalization; unresolved material imbalance is an error."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_allocation
    applies_to: "multifunctional refinery operations and shared utilities"
    rule: "The selected allocation hierarchy, driver, factor, co-product set, price period if applicable, and sensitivity result shall be disclosed and applied consistently; double counting recovered energy or internal transfers is an error."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_direct_releases
    applies_to: "air, water, and waste inventory"
    rule: "Direct combustion and process emissions, flares, vents, fugitive leaks, storage/loading losses, final water releases, and treatment wastes shall be included by substance and destination or have a documented non-applicability determination."
    source_ids:
      - us-epa-ap42-refining-2015
      - us-epa-refinery-effluent-guidelines
      - eu-refinery-bat-2014
  - rule_id: validate_period_and_quality
    applies_to: "completed foreground dataset"
    rule: "All foreground records shall cover a consistent declared period; calibration, sampling, calculation, representativeness, completeness, and uncertainty evidence shall be retained and material gaps disclosed."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "Foreground refinery-gate production dataset for naphtha."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product carbon footprint and LCA models needing refinery-gate naphtha as a feedstock, provided grade, route, geography, period, and allocation are compatible with the study."
  excluded_use: "Direct comparison of unlike naphtha grades or refinery routes without harmonization; representation of motor gasoline, jet fuel, kerosene, white spirit, pyrolysis gasoline, or downstream petrochemicals; use-phase combustion without a downstream model."
  required_metadata: "canonical PCR id; product flow UUID; grade and distillation range; treatment route; key quality specification; feed slate; refinery technology; geography; reference period; custody-transfer point; allocation hierarchy, driver and factor; included units; upstream dataset identities; data owner and review status"
  required_quality_disclosure: "mass-balance closure; meter and laboratory QA/QC; temporal, technological and geographical representativeness; direct versus calculated data shares; emission and wastewater methods; allocation sensitivity; completeness; uncertainty; exclusions and unresolved gaps"
  update_trigger: "Material change in feed slate, product grade or specification, fractionation or treatment route, tank/loading or control technology, allocation method, upstream supply, applicable permit method, or represented period; or a material data-quality finding."
