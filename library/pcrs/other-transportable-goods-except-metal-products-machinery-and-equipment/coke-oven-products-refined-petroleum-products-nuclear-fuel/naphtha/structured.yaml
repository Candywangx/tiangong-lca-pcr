    reference: "U.S. EPA, Petroleum Refining Effluent Guidelines, 40 CFR Part 419 overview, https://www.epa.gov/eg/petroleum-refining-effluent-guidelines; retrieved 2026-08-09"
    used_for: "Refinery product and process scope, wastewater boundary, discharge and treatment coverage."
  - id: "eu-refinery-bat-2014"
    type: "standard"
    reference: "European Commission, Implementing Decision 2014/738/EU establishing BAT conclusions for the refining of mineral oil and gas, ELI http://data.europa.eu/eli/dec_impl/2014/738/oj; retrieved 2026-08-09"
    used_for: "Monitoring and inclusion of air and water emissions, distillation off-gas and sour-water treatment, product treatment, storage, loading, vapor recovery, waste, and control-system records."
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279, Annex I Product Environmental Footprint Method, ELI http://data.europa.eu/eli/reco/2021/2279/oj; retrieved 2026-08-09"
    used_for: "Functional unit and reference flow, completeness, multifunctionality hierarchy, allocation disclosure, data collection, representativeness, precision, and quality requirements."
