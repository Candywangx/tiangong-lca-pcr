system_boundary:
  rules:
    - rule_id: boundary_refinery_gate
      applies_to: "foreground naphtha production"
      rule: "Include refinery activities from receipt of crude oil or unfinished refinery feed through separation, applicable product treatment, storage, specification blending, and loading at the declared refinery-gate custody-transfer point."
      source_ids:
        - us-epa-ap42-refining-2015
        - us-epa-refinery-effluent-guidelines
    - rule_id: boundary_upstream_links
      applies_to: "purchased and imported inputs"
      rule: "Link crude production and transport, imported refinery intermediates, purchased naphtha, electricity, fuels, steam, hydrogen, water, and chemicals to representative upstream datasets; do not silently absorb them into an unqualified refinery average."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_direct_releases
      applies_to: "controlled and fugitive refinery releases"
      rule: "Include direct combustion and process emissions, vents, flares, equipment leaks, storage and loading losses, wastewater releases, and treatment wastes attributable to the included processes."
      source_ids:
        - us-epa-ap42-refining-2015
        - eu-refinery-bat-2014
    - rule_id: boundary_exclusions
      applies_to: "downstream conversion and use"
      rule: "Exclude downstream steam cracking, catalytic reforming, aromatics or olefins production, gasoline blending beyond the declared naphtha specification, distribution after the refinery gate, and product use or combustion."
      source_ids:
        - us-epa-ap42-refining-2015
        - unsd-cpc-3-2025
    - rule_id: boundary_cutoff_disclosure
      applies_to: "omitted flows"
      rule: "Quantify all environmentally relevant material, energy, waste, and elementary flows. Any justified exclusion shall be disclosed with its basis and a sensitivity or materiality check; legal or permit-reportable releases shall not be cut off."
      source_ids:
        - eu-pef-2021
        - eu-refinery-bat-2014
boundary_abstraction:
  declared_starting_condition: "Crude oil and any unfinished refinery feed are received at the refinery boundary with feed identity, origin, quantity, and quality basis recorded."
  starting_condition_role: "Foreground refinery entry condition."
  product_classification_scope: "Naphtha under CPC 3.0 subclass 33330, limited to the declared qualifying petroleum fraction and excluding separately classified finished fuels, solvents, and downstream chemicals."
  recursive_input_rule: "Purchased or internally transferred naphtha that enters an included process is recorded as a distinct product input with its own upstream dataset or documented internal transfer; do not recursively recreate its upstream naphtha production inside the same process."
  upstream_dataset_requirement: "Use representative datasets for crude production and transport, imported unfinished feed, purchased hydrogen, electricity, steam, fuels, water, chemicals, and externally supplied naphtha."
  disclosure: "Declare feed slate, route and treatment status, included units, shared utilities, allocation method and factors, tank and loading boundary, geography, period, data gaps, and every excluded refinery activity."
