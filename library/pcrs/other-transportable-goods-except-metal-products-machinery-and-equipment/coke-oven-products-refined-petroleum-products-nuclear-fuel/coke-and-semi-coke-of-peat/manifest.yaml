  scope_decision:
    relation_recommendation: "narrower"
    route: "Traditional externally heated sealed dry retorts, exclusive sod-peat carbon feed, gas/condensate recovery and enclosed cooling; grade-separated campaigns with one accepted solid grade output."
    evidence_limitations: "USGS1910 historical European route, not all modern factories; VTT1986 publisher abstract only, not full report; no default quantities or wood pyrolysis factors."
    identity_rationale: "Peat coke and half coke are carbonised solids distinct from received peat, wood/coal/lignite/petroleum coke and peat tar. Feedstock difference alone does not establish different coking physics; source/land and actual route controls require peat-specific applicability."
    adjacent_33110: "Initial coal/lignite scaffold was empty. Final read-only neighboring material wet-quenched-byproduct-metallurgical-coal-coke is candidate/authored and explicitly excludes peat, semi-coke and retort carbon; its coking-coal slot oven, wet quench and by-product chemistry do not cover the historical sealed sod-peat retort route. No neighboring files modified."
    scientific_review: "Independent authoring/identity/measurement inspection performed; scientific methodology review remains pending. Candidate/authored, not active/reviewed/published."
    neighbor_33220: "Read-only sealed assessment and bilingual tar extension support missing phase/destination rules only. No liquid tar reference, 33220 coverage edge or refinery identity added; original solid reference retained."
  dataset_requirements:
    carbon_origin: "Keep physically measured peat-derived CO2/CO/CH4 pending when source-class convention is unresolved; national GHG reporting does not decide LCI UUID. Origin fractions must partition the physical total without overlap."
    natural_gas_basis: "No UUID selected: pure-methane CAS on the prior natural-gas-mixture candidate conflicts with mixture identity. Resolve actual gas certificate, compression/pipeline route, composition and native reference Volume/m3 with provider T/P/wet-dry/Z; do not adopt single Jiangsu plant composition."
    electricity_basis: "Selected identity requires CN, 1–35 kV, user-side grid-average supply; actual supplier/year matching or separately verified alternate electricity identity is mandatory."
    nox_basis: "Mass/kg does not establish NO2 equivalence; actual analytical/LCI/LCIA quantity compatibility required; exclude N2O and duplicate NO/NO2."
    heat_basis: "Net delivery enthalpy and actual carrier/pressure/temperature/provider service remain site requirements, not steam-mass or MJ inference."
    upstream_land: "Actual deposit area/land-use/drainage/water-table history, occupation duration, extracted carbon and stock pools, persistent gas/waterborne fluxes and actual rewetting must be linked without double counting material extraction as assumed instantaneous land CO2."
    packing_maintenance: "Whole physical bill, stock/returns/losses, calibrated tare, documented service life and actual replacement/waste plus supporting utilities required. Add every actual atomic exchange before dataset completeness; no guessed mass, reuse count or burden-free support."
  unresolved_flow_rows:
    - row_id: "natural_gas"
      selected_flow: "Gaseous pipeline natural-gas fuel mixture"
      reason: "NativeProperty/SourceRoute identity unresolved: prior candidate carries pure methane CAS 74-82-8 while declaring natural-gas consumption mixture and compressed pipeline route; no native reference-state definition or mixture-compatible replacement established. Case-specific Jiangsu gas and already-combusted furnace inputs are not substitutes."
    - row_id: "peat_tar"
      selected_flow: "Separated raw peat tar"
      reason: "Grade/SourceRoute unresolved: returned coal-tar, coal-carbonisation, solid peat/coke and gas-oil candidates do not establish liquid peat-derived separated raw organic condensate. Record actual accepted grade, separation endpoint and water/solids/receiver; no coke-to-tar identity reuse."
    - row_id: "peat_gas"
      selected_flow: "Exported noncondensable peat carbonisation gas"
      reason: "SourceRoute/NativeProperty unresolved: biomass-pyrolysis-gas candidate does not define peat-origin convention or compatible export mass/state/provider basis; returned peat solids and generic fuel are not this gas."
    - row_id: "heat_export"
      selected_flow: "Net delivered heat from retort gas recovery"
      reason: "NativeProperty/SourceRoute unresolved: recovered-energy candidate gives Net calorific value/MJ but no net supply-return enthalpy/service definition. Garment-finish heat, natural-gas heat and residential fuel-oil heat are incompatible routes."
    - row_id: "aqueous_condensate"
      selected_flow: "Peat carbonisation aqueous condensate for external treatment"
      reason: "Grade/SourceRoute unresolved: generic wastewater to water is not an identified peat-condensate transfer to treatment; textile/wafer/paper routes cannot substitute. Preserve dissolved/entrained composition, hazardous status and actual treatment receiver."
    - row_id: "mineral_residue"
      selected_flow: "Mineral ash residue from peat gas firing"
      reason: "SourceRoute unresolved: only ore-concentrate or coal-power combustion-residue evidence; neither establishes independently removed mineral residue from entrained minerals in peat-gas firing. Actual absence or chemistry/removal/receiver requires collection."
    - row_id: "waste_tar"
      selected_flow: "Waste raw peat tar for external treatment"
      reason: "Grade/SourceRoute unresolved: waste-peat-tar search returned coal-derived tar residue and unrelated wastes; no peat organic-condensate waste identity with actual treatment endpoint confirmed. Keep actual phase/destination and volatile losses."
    - row_id: "co2_peat"
      selected_flow: "Carbon dioxide from peat carbon, origin unresolved"
      reason: "Source convention unresolved: actual CAS 124-38-9 species and outdoor-air medium can be checked, but returned fossil/biogenic/correction candidates do not decide peat classification in the chosen LCI/LCIA convention. Keep all physically measured unassigned remainder and land/stock transfers."
    - row_id: "co_peat"
      selected_flow: "Carbon monoxide from peat carbon, origin unresolved"
      reason: "Source convention unresolved: CAS 630-08-0 CO and outdoor-air identity do not establish peat origin category. Partition measured CO without deleting unknown carbon or assuming a fossil/biogenic label from national reporting."
    - row_id: "ch4_peat"
      selected_flow: "Methane from peat carbon, origin unresolved"
      reason: "Source convention unresolved: CAS 74-82-8 methane and outdoor-air identity do not establish peat source category. Keep measured vent/leak/unburnt remainder, separate from actually traced auxiliary fossil methane; no correction flow."
