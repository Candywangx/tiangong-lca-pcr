measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted net unpackaged dispatch coke with cp_product. One reference unit is 1 kg; intermediate and final coke must not be counted as two reference outputs."
  - id: moisture_basis
    applies_to: "peat_feed; peat_coke; peat_tar; captured_dust"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Dry mass = wet mass × (1 − measured wet-basis water fraction); retain wet mass, representative sampling and a matrix-valid water-specific method. Tar drying loss can include volatile organics and cannot stand for water. Report proximate fixed carbon separately from elemental total carbon. No historic moisture/yield default."
  - id: gas_basis
    applies_to: "natural_gas; peat_gas"
    required_property_ref:
      name: "Volume or Mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Metered T, absolute P, wet/dry composition and compressibility must match provider m3. Gas mass conversion needs measured same-state composition/density, not secondary property coefficients."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Metered kWh × 3.6 = MJ; the selected UUID requires CN, 1–35 kV user-side grid-average supply. Match supplier/year; another geography, voltage or dedicated generator requires a different verified flow."
  - id: heat_basis
    applies_to: "heat_export"
    required_property_ref:
      name: "Defined delivery energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Integrate delivery mass flow × supply/return enthalpy difference; specify carrier/pressure/temperature and service definition. Steam mass or MJ alone is insufficient."
  - id: emission_basis
    applies_to: "elementary rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain species/source/medium, wet/dry standard-state and flow/concentration bases. NOx requires an explicit quantity convention and PM fractions must be disjoint."
