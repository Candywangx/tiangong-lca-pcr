allocation_rules:
  - rule_id: allocation_physical
    applies_to: "retort"
    rule: "Keep gross physical gas/liquid/solid, water/carbon/sulfur and energy balances before allocating environmental burdens. Never multiply actual coproduct outputs by allocation shares. Internal return and external export are mutually exclusive quantities."
    source_ids:
      - usgs-peat-retort-1910
  - rule_id: allocation_order
    applies_to: "retort"
    rule: "Authored PCR allocation policy: limited adaptation of the GHG Product Standard hierarchy to this LCI, without claiming full GHG-standard conformity. First use measured subdivision for separable operations. For remaining shared burdens document a demonstrated causal physical relationship; otherwise use an explicit economic scenario with actual grade/product quantities and period-matched net prices, uncertainty and sensitivity. A historic profitability assertion establishes neither a share nor an avoided-burden credit."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocation_status
    applies_to: "peat_tar; peat_gas; heat_export; captured_dust"
    rule: "Distinguish actual marketable coproducts from wastes using receiver contracts and quality evidence. Retain wastewater/residue treatment burdens and no arbitrary burden-free byproduct. Show allocated burden shares summing to unity for each shared burden pool; retain the unallocated physical ledger."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocation_support
    applies_to: "retort"
    rule: "Assign directly attributable packing, handling, maintenance and treatment burdens to their actual operation/product before shared allocation. Economic scenarios use matched net receipts after discounts/returns, quantity states, currency/date, freight/tax boundary and treatment fees; historical capital or operating costs are not current sales prices. Shared shares sum to one; physical outputs, stocks and return links remain unweighted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "retort"
      flow_role: "Accepted reference grade"
      record_type: "Weighing and laboratory records"
      raw_fields: "Batch/grade; net mass; dispatch moisture; volatile/fixed/total carbon; ash; sulfur; phosphorus; size; strength; stocks"
      collection_method: "Calibrated net dispatch weighing without packaging; representative grade sampling and actual accredited or validated methods; reconcile production and dispatch inventories"
      unit: "kg"
      frequency: "Each lot; composite sampling by declared plan"
      temporal_coverage: "Complete declared period"
      site_scope: "Same product grade/gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sample chain, rejects and inventory reconciliation"
    - protocol_id: cp_material
      process_id: "retort"
      flow_role: "Each solid/liquid/gas branch"
      record_type: "Mass, acceptance and phase-composition ledger"
      raw_fields: "Batch; phase/stage/endpoint; gross generation; sale/use/disposal/returns; mass; water/solids; elemental C/H/O/N/S/P/minerals; proximate analysis; gas composition/T/absolute P/wet-dry/Z/density/NCV; receiver; stock change"
      collection_method: "Calibrated solid/liquid weighing or temperature/density-supported tank measurement; matched gas metering; representative phase sampling including entrained/dissolved fractions; verify both ends of transfers and receiver acceptance"
      unit: "kg"
      frequency: "Each lot; gas logged through operating states"
      temporal_coverage: "Complete declared period"
      site_scope: "All material branches"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, methods/bases, sample chain, matched links, receiver receipts, residual uncertainty"
    - protocol_id: cp_energy
      process_id: "retort"
      flow_role: "Electricity, auxiliary fuel and delivered heat"
      record_type: "Meter/provider records"
      raw_fields: "Supply voltage/mix; kWh; natural-gas volume/T/P/wet-dry/Z; fuel composition/NCV; heat carrier/flow/pressure/supply-return enthalpy; return/export split"
      collection_method: "Calibrated meters and supplier reference-quantity definitions; matched time-integrated net delivery enthalpy; retain internal recovery separately"
      unit: "MJ; m3"
      frequency: "Continuous logs reconciled to invoices"
      temporal_coverage: "Complete declared period, including startup"
      site_scope: "Energy delivery and internal recovery interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; provider reference definitions; enthalpy and period reconciliation"
    - protocol_id: cp_water
      process_id: "retort"
      flow_role: "Water in each actual phase and external supply/release"
      record_type: "Water/phase balance"
      raw_fields: "Feed/fuel/coke/tar water; external supply source/treatment or onsite abstraction medium; circuit stocks/returns; separated aqueous mass; dissolved/entrained organics/N/S; air inlet humidity; wet outlet gas; reaction/combustion water; actual blowdown and receiver"
      collection_method: "Meter actual make-up/abstraction, weigh and water-specifically sample each phase; reconcile humid inlet/outlet and H/O elements with measured activity and uncertainty; record direct liquid discharge separately from treatment transfer"
      unit: "kg"
      frequency: "Continuous meters and batch phase samples"
      temporal_coverage: "Complete declared period"
      site_scope: "All water interfaces and matched air records"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/sample evidence, method selectivity, source/receiver and water residual"
    - protocol_id: cp_air
      process_id: "retort"
      flow_role: "Each emitted species/size/source"
      record_type: "Monitoring and release survey"
      raw_fields: "Outlet/leak/vent; operating state/hours; flow; concentration; gas standard T/P; wet-dry/O2 basis; species/CAS; source carbon; NOx convention; PM size definition; controls; limits"
      collection_method: "Qualified species-specific tests and validated stack flow methods; representative tests for all operating states plus quantified leaks/vents; actual carbon-source tracing; integrate mass rates and hours; retain nondetect limits, never assume zero"
      unit: "kg"
      frequency: "State-representative tests and continuous activity logs"
      temporal_coverage: "Complete declared period with startup/shutdown"
      site_scope: "All actual air outlets and diffuse releases"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original methods/results, QA, coverage, uncertainty, detection limits and source-origin evidence"
    - protocol_id: cp_route
      process_id: "retort"
      flow_role: "Route, upstream land and quality applicability"
      record_type: "Site/supplier documentary record"
      raw_fields: "Retort configuration; temperature/residence; gas/condensate diagram; peat deposit/land/drainage/extraction history; restoration; utility definitions; all omitted exchanges"
      collection_method: "Verify installed route against source-bound scope; supplier land and upstream evidence; walk-through exchange survey; document gaps before data completeness"
      unit: "record"
      frequency: "Each campaign and material/provider change"
      temporal_coverage: "Same declared period with land-history context"
      site_scope: "Plant plus linked upstream providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Process diagram, land records, applicability and completeness sign-off"
    - protocol_id: cp_land
      process_id: "retort"
      flow_role: "Linked upstream peatland scope"
      record_type: "Supplier geospatial, land-history and upstream-LCI records"
      raw_fields: "Deposit polygon/area; land use/climate/nutrient class; water-table/drainage/extraction dates; occupation period; extracted dry carbon; above/below-ground/litter/deadwood/soil pools; CO2/CH4/N2O and relevant drainage-water carbon; actual rewetting/restoration; dataset boundary/times and included burdens"
      collection_method: "Link traceable supplier land records to applicable drained/rewetted soil scope and upstream inventory with declared allocation/time horizon; reconcile stock/exported peat carbon and ongoing fluxes; do not copy national area factors to plant kg or credit presumed restoration"
      unit: "record"
      frequency: "Each deposit/land-management change; annual scope reconciliation"
      temporal_coverage: "Land history plus declared upstream assessment horizon"
      site_scope: "Supplier deposit and linked extraction/transport dataset"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Geospatial/date evidence, compatible LCI scope, stock/flux reconciliation and missing-coverage disclosure"
    - protocol_id: cp_air_inlet
      process_id: "retort"
      flow_role: "Combustion/dryer/cooling air physical interfaces"
      record_type: "Calibrated air/activity and weather records"
      raw_fields: "Inlet/ingress location; dry air mass/volume; T/P; O2/N2/CO2 fractions; humidity; operating hours; matched outlet"
      collection_method: "Measure or derive from validated equipment tests with uncertainty; account for ambient water/carbon and oxygen consumption, nitrogen pass-through and leakage without assuming stoichiometric complete combustion; preserve documented LCI gross/net reconciliation"
      unit: "kg"
      frequency: "State-representative tests and continuous activity/weather logs"
      temporal_coverage: "Complete declared period"
      site_scope: "Each air circuit and matched outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Airflow/humidity calibration, dry/wet bases, inlet-outlet reconciliation"
    - protocol_id: cp_support
      process_id: "retort"
      flow_role: "Each actual packing, maintenance and support exchange"
      record_type: "Physical bill, work order and return ledger"
      raw_fields: "Component material; measured mass/tare; purchases/stocks; duty/service life; reuse/return counts; rejects/losses; lubricant/filter/refractory/steel replacement; cleaning utilities; waste receiver; infrastructure cut-off; actual net prices/currency/date/fees"
      collection_method: "Survey complete physical bill including inbound containers and recovery tanks, bags/liners/pallets if used; weigh each material and reconcile stocks/returns; allocate attributable maintenance by documented duty or service period, retain physical replacement/waste and supporting energy; create a separate verified card for every actual exchange"
      unit: "kg; record"
      frequency: "Each purchase, replacement and return, period reconciliation"
      temporal_coverage: "Same campaign plus documented service life"
      site_scope: "Whole support account, including upstream interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Bills, calibrated tare, work orders, return receipts, lifetime evidence, cut-off and burden reconciliation"
  calculation_rules:
    - id: batch_normalisation
      applies_to: "all inventory rows"
      rule: "Each external exchange result = its measured campaign amount divided by P; retain raw campaign amount and selected-grade P. Physical coproduct outputs use actual mass, never an allocation-weighted mass."
      inputs:
        - "Campaign exchange"
        - P
        - inventories
        - cp_product
      output: "Exchange per 1 kg reference flow"
      source_ids: []
    - id: phase_balances
      applies_to: "retort"
      rule: "For each gross mass/element ledger, inputs = outputs + stock increase + quantified residual. Conserve measured C, H, O, N, S, P and relevant mineral elements across feed, fuel, air, coke, organic/aqueous phases, gas, dust and residues. Convert species to element mass by molecular stoichiometry; report wet/dry/ash-free analytical bases, water, ash and proximate fixed carbon separately. Internal links cancel only after both ends agree; do not assume complete oxidation or that all non-CO/CO2 oxygen becomes water."
      inputs:
        - cp_material
        - cp_water
        - cp_energy
        - cp_air
        - cp_air_inlet
      output: "Unallocated elemental and total-mass ledgers with uncertainty"
      source_ids:
        - osti-peat-conversion-1980
    - id: elemental_partition
      applies_to: "retort"
      rule: "Measured tar/char/aqueous/gas N and S may have different distributions. A laboratory trapped-tar analysis does not close unmeasured gas or predict NOx/H2S emission amounts; keep oxygen by-difference uncertainty and measured H/O loss separate from water assignment. Collect actual species and retained phase elements before declaring closure."
      inputs:
        - cp_material
        - cp_air
        - cp_water
      output: "Phase-specific N/S/H/O evidence and unresolved residuals"
      source_ids:
        - suo-peat-pyrolysis-1987
    - id: water_closure
      applies_to: "retort"
      rule: "Water in feed/fuel/products, external water supply and air humidity plus separately substantiated reaction/combustion water = water in products/condensate/discharges/exhaust plus stock increase and quantified residual. Do not count stream-contained H2O again as an extra stream; water formation/consumption must reconcile the H/O ledger. Preserve gross inlet/outlet and documented net LCI water quantities."
      inputs:
        - cp_water
        - cp_air_inlet
        - cp_material
        - cp_air
      output: "Water ledger and LCI reconciliation"
      source_ids:
        - osti-peat-conversion-1980
    - id: energy_closure
      applies_to: "retort"
      rule: "Use one declared energy datum and matched gross/net calorific basis, moisture and reference state. Reconcile fuel chemical energy, electricity, imported heat, sensible/latent delivery, exported energy, product chemical energy, losses and storage. Show gross stage recovery but cancel matched internal gas/heat links at aggregate boundary; internal recovery is never an additional external energy input or avoided burden."
      inputs:
        - cp_energy
        - cp_material
        - cp_air_inlet
        - cp_product
      output: "Unallocated energy balance"
      source_ids: []
    - id: support_closure
      applies_to: "retort"
      rule: "For each actual packing/maintenance material, reconcile purchases, stocks, service use, returns, losses and identified waste. Reuse counts and service life come from traceable records; never divide purchase mass by a guessed number of cycles. Product denominator excludes tare and counts no returned/redelivered lot twice."
      inputs:
        - cp_support
        - cp_product
      output: "Support-material ledger and attributable burdens"
      source_ids: []
    - id: air_integral
      applies_to: "elementary rows"
      rule: "For each outlet/state, emitted mass = time-integral of compatible species mass concentration × gas volume flow; sum actual states/leaks. Reconcile temperature/pressure, moisture and sampling flow states; undo reference-O2 concentration correction or apply a demonstrably compatible volume basis before integration. Keep source-origin partitions exhaustive/nonoverlapping; nondetect is bounded uncertainty, not zero."
      inputs:
        - cp_air
        - "gas reference state"
        - "operating hours"
      output: "Species mass and completeness evidence"
      source_ids: []
    - id: carbon_partition
      applies_to: "co2_peat; co2_fossil; co2_biogenic; co_peat; co_fossil; ch4_peat; ch4_fossil"
      rule: "For each species/outlet, trace auxiliary and peat-derived physical amounts separately; retain the unassigned peat remainder after documented compatible source assignments. If physical peat/auxiliary attribution itself is unresolved, retain that additional tracing gap and the full measured total rather than call the whole remainder peat. National reporting or plant ancestry alone cannot decide LCI source; retain all totals and transfers."
      inputs:
        - "Physical species masses"
        - tracing
        - "stated LCI/LCIA convention"
      output: "Nonoverlapping physical source ledger"
      source_ids:
        - ipcc-peat-classification
  data_quality_requirements:
    - id: route_match
      applies_to: "retort"
      requirement: "Prove traditional dry sealed externally heated retort; no inferred equivalence of modern equipment"
      evidence: "cp_route and source-limited comparison"
    - id: finite_basis
      applies_to: "all inventory rows"
      requirement: "Same grade, gate and campaign denominator; separate wet/dry states and stocks; retain all raw quantities and uncertainty"
      evidence: "cp_product and linked protocols"
    - id: closure
      applies_to: "physical balances"
      requirement: "Explain each measured residual against combined measurement uncertainty; no universal tolerance or balancing emission invented"
      evidence: "Phase ledger and analytical uncertainty"
    - id: origin
      applies_to: "carbon species"
      requirement: "Deposit/land history, auxiliary fuel source and explicit carbon convention; unknown identity remains unresolved, never deleted"
      evidence: "cp_route; cp_air; compatibility decision"
    - id: identity_basis
      applies_to: "UUID-bearing and unresolved rows"
      requirement: "Exact physical identity is separate from provider quantity/background compatibility. Require medium/source/species/property/unit consistency; missing UUID or NOx/heat/gas definition prevents an asserted complete dataset"
      evidence: "Direct identity plus actual provider/site records"
    - id: source_route_grade
      applies_to: "reference product and every linked provider"
      requirement: "Declare actual grade/test endpoint, route and supply geography. Missing actual collection is a dataset gap; an unverified identity, unsupported route or unknown native quantity definition remains a specific unresolved method/link issue and cannot be waived as ordinary data debt."
      evidence: "cp_route; native records; specific compatibility decision"
    - id: support_media_complete
      applies_to: "retort"
      requirement: "Complete physical packing/maintenance/returns, resource versus supplied product and actual release-medium accounts. Add all actual missing atomic rows and treatment/utility units before claiming a complete dataset; the screened list is never an exhaustive emissions recipe."
      evidence: "cp_support; cp_water; cp_air_inlet; cp_air"
validation_rules:
  - rule_id: validation_reference
    applies_to: "peat_coke"
    rule: "Require exactly one reference output, 1 kg net declared grade, all qualifiers and same bilingual denominator. Do not substitute coal coke, wood charcoal or ordinary peat."
    source_ids:
      - usgs-peat-retort-1910
  - rule_id: validation_route
    applies_to: "retort"
    rule: "Verify site route and all actual exchanges; unsupported equipment, chemical refining or wastewater treatment needs a completed supplement. Unknown quantity/identity or uncovered emissions are explicit incomplete findings, not passes."
    source_ids:
      - usgs-peat-retort-1910
  - rule_id: validation_balance
    applies_to: "all inventory rows"
    rule: "Reconcile gross phase/water/carbon/sulfur/energy ledgers and matched internal loops before burden allocation. Keep source partitions and PM intervals nonoverlapping; retain biogenic CO2 when established."
    source_ids:
      - usgs-peat-retort-1910
      - ipcc-peat-classification
  - rule_id: validation_evidence
    applies_to: "retort"
    rule: "No historic/single-plant quantities, wood factors or guessed carbon class may replace actual collection. Separate method authorship, future dataset completeness and scientific review."
    source_ids:
      - usgs-peat-retort-1910
      - vtt-peat-coke-1986-abstract
  - rule_id: validation_land_carbon
    applies_to: "peat_feed; carbon species"
    rule: "Reconcile extracted physical carbon, land-stock change, continuing soil/water emissions and gate carbon without counting extracted carbon again as an assumed immediate land CO2 release. Keep every measured physical CO2 source and all stock transfers. LCI/LCIA origin definitions, uptake treatment and characterization must agree; reporting peat as fossil-like is not a shortcut to deleting CO2 or assigning all carbon one source UUID."
    source_ids:
      - ipcc-peat-classification
      - ipcc-wetlands-2013
