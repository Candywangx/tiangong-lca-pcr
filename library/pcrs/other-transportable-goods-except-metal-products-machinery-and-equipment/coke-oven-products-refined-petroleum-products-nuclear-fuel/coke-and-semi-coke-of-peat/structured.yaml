published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after a real complete foreground package and review"
  downstream_use: "Declared grade and matching traditional-retort route, with separately modelled downstream carbon fate"
  allowed_use: "Site-period-specific supply of the declared peat coke/half-coke grade and compatible land/utility backgrounds"
  excluded_use: "All modern peat coking default; charcoal/coal/petroleum coke proxy; carbon-neutrality claim; activated-carbon production; unsupported emission-factor recipe"
  required_metadata: "All reference qualifiers; site/period; gross and allocated ledgers; upstream land history; provider bases; receivers; method source limitations"
  required_quality_disclosure: "UUID/basis gaps; carbon convention; temporal/geographic/route scope; measurement limits/residuals; allocation scenario/sensitivity; excluded downstream fate"
  update_trigger: "Route/grade/feed/deposit/provider change; new measurements; changed land history/carbon convention; resolved flow identity; revised source applicability"
data_sources:
  - id: "ghg-product-allocation-2011"
    type: "standard"
    reference: "WRI/WBCSD, Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9, printed p.63, Tables 9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Subdivision and physical/economic relationships support the declared limited LCI allocation adaptation; no peat-plant allocation shares, avoided-burden credits or full conformity claim. Physical outputs remain unallocated; USGS 1910 supports historical process and market context only."
  - id: "usgs-peat-retort-1910"
    type: "official_guidance"
    reference: "C. A. Davis, The preparation and use of peat as fuel, USGS Bulletin 442-B (1910), printed pp.121–123, PDF pp.21–23. https://pubs.usgs.gov/bul/442-B/report.pdf"
    used_for: "Historical European sealed-retort peat coke/half coke, gas return, organic/aqueous condensate recovery and enclosed cooling. Quantities/costs and claimed profitability are not defaults; no modern plant coverage."
  - id: "vtt-peat-coke-1986-abstract"
    type: "literature"
    reference: "Brandt, Sipilä and Thun, Production and use of peat coke, VTT Tiedotteita 542 (1986), publisher abstract only. https://cris.vtt.fi/en/publications/production-and-use-of-peat-coke/"
    used_for: "Historical product/feedstock/pretreatment and grade distinctions only; full report not acquired, no default quantities or present factory status."
  - id: "ipcc-peat-classification"
    type: "official_guidance"
    reference: "IPCC TFI FAQ Q2-7. https://www.ipcc-nggip.iges.or.jp/faq/faq.html"
    used_for: "Distinction between peat identity and national GHG reporting convention; not a peat-coke manufacturing factor or LCI origin assignment."
  - id: "osti-peat-conversion-1980"
    type: "literature"
    reference: "F. C. Schora and D. V. Punwani, Peat — An Energy Alternative, IGT conference paper (1980), OSTI 5328068, PDF pp.8–11, 28 and 31 (printed pp.5–8, 25 and 28). https://www.osti.gov/servlets/purl/5328068"
    used_for: "Qualitative separation of conversion routes, pyrolysis water/carbon oxides and oxygen retained in liquids/char. Hydrogasification aqueous-organic results are route-limited cautions, never dry-retort yields, compositions or partition/emission factors."
  - id: "ipcc-wetlands-2013"
    type: "official_guidance"
    reference: "IPCC (2014), 2013 Wetlands Supplement, ch.2 §§2.1–2.2, 2.4 (printed pp.2.6–2.8, 2.47–2.48); ch.3 §§3.1–3.2 (printed pp.3.4–3.7). https://www.ipcc-nggip.iges.or.jp/public/wetlands/index.html"
    used_for: "Upstream drained/rewetted organic-soil scope, stock pools and persistent gaseous/waterborne carbon interfaces; no site default or automatic rewetting credit. National reporting categories do not select an LCI carbon-origin flow."
  - id: "suo-peat-pyrolysis-1987"
    type: "literature"
    reference: "Martti Aho, Pyrolysis of peat, Suo 38(5):105–110 (1987), PDF pp.1–6, especially printed pp.106 and 108–109. https://suo.fi/pdf/9636"
    used_for: "Nitrogen-atmosphere laboratory peat/tar/char elemental observations and incomplete gas analysis; supports phase-specific collection and uncertainty only, not industrial operating settings, yield, purity or emission factors."
