system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "retort"
      rule: "Aggregate receipt/forming/drying, heating/leaks, gas handling/return, organic/aqueous condensation, enclosed cooling and grading; actual route equivalence is required. Other equipment requires method supplement."
      source_ids:
        - usgs-peat-retort-1910
    - rule_id: boundary_land
      applies_to: "peat_feed"
      rule: "Link actual deposit polygon/area, climate, land use, drainage/water-table dates, extraction quantity, occupation duration, stock pools and restoration/rewetting to compatible upstream datasets. Retain continuing CO2, CH4, N2O and relevant waterborne carbon impacts with the declared time horizon; no automatic restoration credit or carbon neutrality. National inventory methods inform scope, not a plant emission factor."
      source_ids:
        - ipcc-wetlands-2013
    - rule_id: boundary_outputs
      applies_to: "retort"
      rule: "Retain all actual gas/liquid/solid branches and water/carbon/sulfur/energy interfaces. Chemical refining, onsite wastewater treatment and direct discharges require completed additional units, never silent omission."
      source_ids:
        - usgs-peat-retort-1910
    - rule_id: boundary_carbon
      applies_to: "carbon-bearing flows"
      rule: "Maintain physical peat, fossil auxiliary and substantiated biogenic ledgers separately from reporting. IPCC counts peat combustion CO2 in national totals like fossil fuel; this alone does not select an LCI carbon-origin UUID."
      source_ids:
        - ipcc-peat-classification
    - rule_id: boundary_resources
      applies_to: "retort"
      rule: "Purchased water is a product input with upstream abstraction; actual onsite groundwater/surface-water abstraction is a separately identified resource input in its real medium. Never count the same water supply twice. Direct releases to air, water or soil require species and receiving submedium; waste transferred to treatment remains a technosphere waste exchange."
      source_ids: []
    - rule_id: boundary_support
      applies_to: "retort"
      rule: "Include actual support utilities, packing and maintenance exchanges. Keep whole physical mass/return/stock accounts even when a justified infrastructure cut-off excludes an environmental burden; disclose the cut-off and sensitivity. Unpackaged reference mass excludes tare, not its attributable production or handling burdens."
      source_ids: []
