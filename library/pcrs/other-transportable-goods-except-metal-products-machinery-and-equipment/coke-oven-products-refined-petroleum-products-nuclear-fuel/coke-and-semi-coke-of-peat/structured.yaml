      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_physical | retort | Keep gross physical gas/liquid/solid, water/carbon/sulfur and energy balances before allocating environmental burdens. Never multiply actual coproduct outputs by allocation shares. Internal return and external export are mutually exclusive quantities. | usgs-peat-retort-1910 |\n| allocation_order | retort | Authored PCR allocation policy: limited adaptation of the GHG Product Standard hierarchy to this LCI, without claiming full GHG-standard conformity. First use measured subdivision for separable operations. For remaining shared burdens document a demonstrated causal physical relationship; otherwise use an explicit economic scenario with actual grade/product quantities and period-matched net prices, uncertainty and sensitivity. A historic profitability assertion establishes neither a share nor an avoided-burden credit. | ghg-product-allocation-2011 |\n| allocation_status | peat_tar; peat_gas; heat_export; captured_dust | Distinguish actual marketable coproducts from wastes using receiver contracts and quality evidence. Retain wastewater/residue treatment burdens and no arbitrary burden-free byproduct. Show allocated burden shares summing to unity for each shared burden pool; retain the unallocated physical ledger. | ghg-product-allocation-2011 |\n| allocation_support | retort | Assign directly attributable packing, handling, maintenance and treatment burdens to their actual operation/product before shared allocation. Economic scenarios use matched net receipts after discounts/returns, quantity states, currency/date, freight/tax boundary and treatment fees; historical capital or operating costs are not current sales prices. Shared shares sum to one; physical outputs, stocks and return links remain unweighted. | |\n\n"
