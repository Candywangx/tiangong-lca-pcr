  unresolved_identity_issues:
  - code: non_reference_atomic_flow_identity_pending
    row_ids: *id001
    note: Bounded direct searches retain concrete physical rows without approximate UUIDs. Untreated distillate is distinct from finished
      hydrotreated kerosene; natural-gas methane-CAS/mixture ambiguity and LPG input-only interface remain unresolved. Whole acid gas
      is not its H2S component. Steel-drum candidates have incompatible native CTUe reference property; pressure-specific steam or heat
      identities are not generic steam. These gaps prevent complete foreground linkage and publication.
  provider_compatibility_pending:
  - 'All rows: actual site/SKU/quantity/composition/receiver/provider evidence must be collected; dimensional consistency is not actual
    dataset binding or scientific approval'
  - 'crude_input: native nominal calorific-value qualifier must match supplier evidence; no fixed heating value or oil/water fraction
    is a site default'
  - 'electricity_input: native CN, 1–35 kV customer-side grid-average interface; actual generation geography, period, losses and voltage
    must match; outside CN requires another identity'
  - 'natural_gas_input: unresolved variable mixture versus methane CAS/high-pressure synonyms; native Volume/m3 alone states no reference
    T/P/purity, and secondary property factors are not actual density/energy'
  - 'hydrogen_input: actual H2 fraction, whole make-up gas versus pure-H2 basis, pressure/temperature/purity/source route and purge/recycle
    remain site requirements; coal-methanol-ethylene identity is not generic refinery supply'
  - 'steam_input and steam_export: actual absolute/gauge pressure, temperature, dryness, mass, enthalpy datum and actual condensate/steam-return
    quantity define net energy; no arbitrary pressure or heat default'
  - 'caustic_input: only actual supplied solid industrial 95–98% NaOH; no universal grade requirement; other solution/concentration
    requires a separate whole-solution identity'
  - 'ferric_chloride_input: only actual supplied anhydrous chemical matching CAS 7705-08-0; other solution/hydrate requires its own
    whole-material identity'
  - 'nox_air: native Mass/kg does not define NO2-equivalent quantity; monitoring/flow/LCIA definitions remain unresolved'
  - 'Waste and container rows: whole wet stream, composition, source and actual treatment/reuse receiver remain independent of elementary
    discharge identities'
  - 'effluent_water: native freshwater Water/Volume/m3 identifies liquid-water component, not automatically the entire wastewater-carrier
    volume; actual fractions/density required'
  - 'lpg_output: external refinery mixed-LPG export identity unresolved; existing industrial fuel/feedstock input interface not reinterpreted
    as export'
  source_limitations:
  - JRC BREF process descriptions reused for the actual petroleum route, not historical or single-site recipes/amount factors
  - AP-42 source structure only; no historical emission factor adopted
  - UNSD historical numeric descriptors not used as universal modern quality limits
  independent_review_status: independent_identity_and_method_consistency_review_completed_scientific_approval_pending
