  what: "Supply of accepted hydrotreated non-aviation kerosene at the refinery dispatch gate"
  how_much: "1 kg net accepted kerosene"
  how_well: "Actual declared non-aviation supply specification and batch acceptance; grade and use do not alone establish identity"
