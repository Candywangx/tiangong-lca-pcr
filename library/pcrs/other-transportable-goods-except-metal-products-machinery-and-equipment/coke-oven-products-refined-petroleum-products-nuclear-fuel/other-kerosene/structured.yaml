measurement_rules:
  - id: net_mass
    applies_to: "reference_product_output"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use net mass of the actually dispatched and accepted finished kerosene mixture, including its measured retained water and incorporated additives, excluding container tare and separately removed water/sediment or rejected material. No universal water, additive or hydrocarbon proportion is prescribed. Convert a custody volume only with the matching whole-batch density at the same temperature and documented volume correction."
  - id: gas_volume
    applies_to: "natural_gas_input"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Retain the declared Volume/m3 collection basis. Match meter and provider temperature, absolute pressure, wet/dry composition and compressibility; record gauge-to-absolute pressure conversion where applicable. A gas-volume unit alone defines no normal/standard reference conditions, purity or density. Identity ambiguity and incompatible background quantity bases remain pending."
  - id: electrical_energy
    applies_to: "electricity_input"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve the verified flow-property label; use metered electrical energy, with 1 kWh = 3.6 MJ from the verified energy unit group. This is a unit conversion, not fuel heating value."
  - id: steam_basis
    applies_to: "steam_input, steam_export"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect actual steam mass, absolute/gauge pressure distinction, temperature, dryness, inlet/return states and enthalpy on one documented datum. Reconcile delivered enthalpy, actual condensate/steam returns and losses to net delivered energy in MJ. Preserve a selected record's native mass or energy property; kg and MJ are not interchangeable without this state-dependent bridge. Do not choose a pressure-specific identity from its short name or infer usable heat from MJ alone; never count one supply again as both physical steam and purchased heat burden."
