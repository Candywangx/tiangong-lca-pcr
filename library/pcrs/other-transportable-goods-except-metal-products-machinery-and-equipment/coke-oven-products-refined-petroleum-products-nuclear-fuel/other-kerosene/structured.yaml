system_boundary:
  rules:
    - rule_id: boundary_manufacture
      applies_to: "kerosene_manufacture"
      rule: "Include all operated contributing separation, hydrotreatment, finishing, tank/loading, hydrogen/utility and abatement operations. The declared refinery boundary retains its actual co-product slate."
      source_ids:
        - eu-jrc-ref-bref-2015
        - us-epa-ap42-5-1-2015
    - rule_id: boundary_internal
      applies_to: "internal interfaces"
      rule: "Aggregate this foreground as one manufacturing unit; retain stage-specific metering and internal source/destination links with equal quantities. Internal kerosene transfers are not additional finished outputs."
      source_ids:
        - eu-jrc-ref-bref-2015
    - rule_id: boundary_use
      applies_to: "downstream use"
      rule: "Exclude customer combustion, distribution after the declared gate and user storage. Model actual site combustion/flaring only; any extension is a separate downstream process."
      source_ids:
        - eu-jrc-ref-bref-2015
        - us-epa-ap42-5-1-2015
    - rule_id: boundary_completeness
      applies_to: "actual site exchanges"
      rule: "Inventory cards are atomic templates, not a universal plant recipe. Include only applicable rows with supporting records and extend with one row per other actual feed, additive, fuel, co-product, waste or emitted species. Missing observations are unknown, not zero; no unlisted stream may be silently cut off."
      source_ids:
        - eu-jrc-ref-bref-2015
        - us-epa-ap42-5-1-2015
boundary_abstraction:
  declared_starting_condition: "Crude petroleum and actual unfinished refinery feed received by the operated refinery; purchased inputs carry upstream datasets"
  starting_condition_role: "Foreground manufacturing supply boundary"
  product_classification_scope: "Hydrotreated non-aviation petroleum kerosene, proposed narrower subset of CPC 3.0 33349, not every kerosene route"
  recursive_input_rule: "Already finished kerosene received for commingling/rework remains a product input with its original upstream burden; identify its actual prior treatment and any genuinely operated additional treatment separately. Never relabel a hydrotreated finished input as untreated distillate, hide repeated treatment, or reattribute its completed upstream manufacture. Stand-alone finishing of purchased finished fuel is outside this PCR"
  upstream_dataset_requirement: "Link actual crude/feed, hydrogen, grid electricity, natural gas, steam, water, chemicals and waste-treatment providers; match technology, geography, period and quantity basis"
  disclosure: "Retain a full unallocated site/unit physical ledger and a separate allocated environmental-burden ledger; record all internal paired transfers and receiving boundaries"
