allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared units"
    rule: "Avoid allocation where feasible by subdivision with actual unit meters and causally attributable operations. System expansion may be used only with explicit equivalent function, substitution evidence and separate sensitivity; it is not an automatic credit."
    source_ids:
      - eu-jrc-ref-bref-2015
  - rule_id: allocation_burdens
    applies_to: "shared environmental burdens"
    rule: "For remaining shared burdens, justify a physical relationship for the actual unit and output slate. Mass or energy shares are not automatically causal. If no defensible physical relationship exists, disclose economic allocation with matched period, prices, currency, output states and sensitivity. Retain factors and source workbooks, and verify factor sum equals 1. Container manufacture, actual repeated use, washing, repair, loss and end-of-life are assigned separately from the full physical container return ledger; no default reuse count or substitution credit."
    source_ids:
      - eu-jrc-ref-bref-2015
  - rule_id: allocation_physical
    applies_to: "all physical exchanges"
    rule: "Maintain full measured gas/liquid/solid products and mass/water/carbon/sulphur/energy balances before allocation. Apply allocation only to attributable environmental burdens in a separate ledger; do not mechanically multiply physical co-product outputs or internal paired flows by allocation shares. Do not delete co-products to make a reference-output check pass."
    source_ids:
      - eu-jrc-ref-bref-2015
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "The allocation hierarchy and audit safeguards above are this PCR’s declared modelling rules, informed by the BREF’s actual multifunctional refinery structure; the BREF is not represented as prescribing a numerical allocation formula."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "kerosene_manufacture"
      flow_role: "reference product"
      record_type: "quality/dispatch/tank records"
      raw_fields: "batch; SKU; specification; distillation curve; sulphur; aromatics; flash point; actual retained water/additives; separated water/sediment; density; temperature; accepted whole-mixture net dispatched mass; tank change; rework; rejected material"
      collection_method: "Use calibrated custody mass metering or traceable volume and same-batch density/temperature correction; reconcile release certificate, tank change, rework and loss; normalization operation: net accepted reference mass; per 1 kg reference flow"
      unit: "kg"
      frequency: "each batch and dispatch"
      temporal_coverage: "all accepted production"
      site_scope: "full declared dispatch boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; density test; certificate; reconciliation"
    - protocol_id: cp_inputs
      process_id: "kerosene_manufacture"
      flow_role: "purchased materials/utilities"
      record_type: "meter and supplier records"
      raw_fields: "flow; supplier; batch/SKU; route; grade; composition/purity; concentration; state; amount; unit; pressure absolute/gauge; temperature; wet/dry; compressibility; density; enthalpy datum; condensate; provider reference basis; containers/maintenance materials"
      collection_method: "Meter actual receipts and stock change; retain invoices and supplier reference definitions; verify each conversion and exclude internally recycled amounts; normalization operation: physical input totals divided by accepted reference mass; per 1 kg reference flow"
      unit: "row unit"
      frequency: "each receipt; continuous utilities"
      temporal_coverage: "same production period"
      site_scope: "all contributing refinery stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; supplier declarations; composition tests; provider checks"
    - protocol_id: cp_products
      process_id: "kerosene_manufacture"
      flow_role: "co-products"
      record_type: "unit/tank/dispatch ledgers"
      raw_fields: "output; grade; phase; mass; density; water; C; S; energy; destination; internal transfer; stock change"
      collection_method: "Meter each actual co-product separately before allocation; reconcile internal transfer endpoints and sold batches; prevent LPG/constituent overlap; normalization operation: physical output totals divided by accepted reference mass; per 1 kg reference flow"
      unit: "row unit"
      frequency: "each batch and continuous unit totals"
      temporal_coverage: "same production period"
      site_scope: "full shared gas/liquid/solid slate and utility exports"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "output certificates; meter calibration; paired-flow reconciliation"
    - protocol_id: cp_wastes
      process_id: "kerosene_manufacture"
      flow_role: "outgoing wastes"
      record_type: "weighbridge and receiver records"
      raw_fields: "stream; source; mass; volume; moisture; dry solids; oil; metals; S; N; hazardous constituents; receiver; route"
      collection_method: "Weigh or meter each exported stream and sample composition; distinguish primary sludge, biological sludge, catalyst and spent liquor; record actual treatment acceptance; normalization operation: physical waste totals divided by accepted reference mass; per 1 kg reference flow"
      unit: "row unit"
      frequency: "each shipment and representative composite sampling"
      temporal_coverage: "same production period including catalyst campaigns"
      site_scope: "all outgoing site waste boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receiver acceptance; manifests; weighing; lab results"
    - protocol_id: cp_air
      process_id: "kerosene_manufacture"
      flow_role: "direct air emissions"
      record_type: "monitoring and control records"
      raw_fields: "source; species; origin; concentration; whole carrier/kerosene-vapour mass and vapour composition; gas flow; time; T; P; oxygen; wet/dry; capture; flare events; size class; detection limit; method"
      collection_method: "Use actual stack/vent monitoring or justified source-specific calculations and leak/tank measurements; match gas and concentration bases; retain raw and post-control values, including abnormal operation; normalization operation: species release totals divided by accepted reference mass; per 1 kg reference flow"
      unit: "kg"
      frequency: "continuous where available; representative runs and all events"
      temporal_coverage: "same production period"
      site_scope: "actual operated utility/process/tank/wastewater/flare sources"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring method; calibration; detection limits; carbon/sulphur checks"
    - protocol_id: cp_water
      process_id: "kerosene_manufacture"
      flow_role: "water/resource exchanges"
      record_type: "water meters and laboratory records"
      raw_fields: "abstraction; outfall; actual receiving medium/receiver; location; whole effluent carrier volume/mass; water fraction; density; time; species; concentration; ion/element basis; temperature; reuse; evaporation; inventory change"
      collection_method: "Meter abstraction and final outfall separately; use time-matched flow-weighted species sampling, declare freshwater/sea/sewer receiving boundary and record actual water reuse; normalization operation: water/species totals divided by accepted reference mass; per 1 kg reference flow"
      unit: "m3; kg"
      frequency: "continuous volume; matched composite sampling"
      temporal_coverage: "same production period"
      site_scope: "direct resource and environmental boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; lab speciation; water reconciliation"
    - protocol_id: cp_balances
      process_id: "kerosene_manufacture"
      flow_role: "physical and burden reconciliation"
      record_type: "unit balance and allocation workbook"
      raw_fields: "unit; whole feed/carriers/combustion air; gas/liquid/solid output; internal endpoints; water; C fossil/bio; H; O; S; N; other relevant elements; reaction species changes; heat/enthalpy datum; electricity; returns; losses; inventories; containers/maintenance; error; allocation driver; prices; factors"
      collection_method: "Retain the complete physical process map and unallocated ledgers; reconcile each conserved component with measured composition and inventories; calculate burden allocation separately; normalization operation: retain unallocated balances and allocated burdens; per 1 kg reference flow"
      unit: "kg; m3; MJ; dimensionless"
      frequency: "each period and route/grade change"
      temporal_coverage: "same production period"
      site_scope: "all shared contributing units and their receiving systems"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "balance residual explanation; factor-sum check; workbook reproduction"
    - protocol_id: cp_containers
      process_id: "kerosene_manufacture"
      flow_role: "container movements/maintenance"
      record_type: "custody and maintenance ledger"
      raw_fields: "material; container id; actual SKU; tare; contents; owner; receiver; stock; receipt; return; reuse; repair; cleaning materials/energy/water; residues; loss; retirement; actual services"
      collection_method: "Weigh container and contents separately and reconcile paired returns and stock; add each actual cleaning/repair material, utility and waste as an atomic row; normalization operation: physical exchange totals divided by accepted reference mass; per 1 kg reference flow"
      unit: "kg; row unit"
      frequency: "each movement and service"
      temporal_coverage: "same production period with documented reuse history"
      site_scope: "actual feed/chemical containers and receiving systems"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; custody; service logs; receiver acceptance; separate burden ledger"
  calculation_rules:
    - id: period_normalization
      applies_to: "all physical inventory rows"
      rule: "For the same period define R as net accepted kerosene mass in kg. Physical normalized exchange = measured exchange total / R; R must be positive. Keep co-products unallocated."
      inputs:
        - cp_reference
        - cp_inputs
        - cp_products
        - cp_wastes
        - cp_containers
      output: "physical exchange per 1 kg reference flow"
      source_ids:
        - eu-jrc-ref-bref-2015
    - id: species_release
      applies_to: "air and water species"
      rule: "Integrate matched concentration × carrier flow × duration over measured intervals after controls; convert units explicitly, or use measured species mass directly. Ion/element and NOx definitions must match; no default factor."
      inputs:
        - cp_air
        - cp_water
      output: "species totals for period_normalization"
      source_ids:
        - eu-jrc-ref-bref-2015
        - us-epa-ap42-5-1-2015
    - id: physical_balance
      applies_to: "shared physical process map"
      rule: "For each unit, total mass and each conserved element: inputs = outputs + inventory change + explained residual. Include actual whole carriers and combustion/process air; reconcile C fossil/biogenic, H, O, S, N and other relevant elements from actual composition. Reactions redistribute species but are never an extra source/sink of total mass or elements. Water-species generation/consumption may be recorded only through documented reaction stoichiometry consistent with H/O conservation; track all liquid, vapour, product-bound, solution/sludge and return water. Reconcile energy on a declared enthalpy/heating-value datum, including chemical/thermal/electrical inputs, actual exports, returns, losses and inventory; avoid adding reaction heat again when included in the selected energy convention. Internal transfers cancel only in aggregation and retain both endpoints."
      inputs:
        - cp_balances
      output: "unallocated physical balance and unexplained gap register"
      source_ids:
        - eu-jrc-ref-bref-2015
    - id: burden_allocation
      applies_to: "remaining shared environmental burdens"
      rule: "Product burden = dedicated attributable burden + sum of each shared burden × its justified product factor. Reconcile factor sum to 1 per shared burden; keep physical flows unchanged and divide the product burden by R."
      inputs:
        - cp_balances
        - cp_reference
      output: "separate allocated product environmental-burden ledger"
      source_ids:
        - eu-jrc-ref-bref-2015
  data_quality_requirements:
    - id: dq_scope
      applies_to: "reference product"
      requirement: "Verify the exact distillation/hydrotreatment route and non-aviation supply subset; no aviation/specification or untreated route substitution."
      evidence: "route diagram; batch certificate; actual quality tests"
    - id: dq_quantity
      applies_to: "all exchanges"
      requirement: "Separate flow identity from provider/reference-basis compatibility. Unknown pressure, composition, concentration, receiving medium or NOx definition remains pending and blocks a claim of complete dataset linkage."
      evidence: "original flow metadata; supplier documentation; raw meters and lab results"
    - id: dq_coverage
      applies_to: "site ledger"
      requirement: "Cover normal, start-up, shutdown, abnormal, flare, catalyst-change and waste-treatment activity for the declared period; disclose missing data, uncertainty and detection-limit treatment."
      evidence: "operations log; monitoring coverage; receiver records"
    - id: dq_balance
      applies_to: "co-products and internal transfers"
      requirement: "Retain every actual co-product and paired internal transfer before burden allocation; explain mass/water/C/S/energy residuals."
      evidence: "full physical graph; unallocated balances; separate burden workbook"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Reject an untreated, aviation-certified, sulfonated, synthetic/biogenic or other excluded product offered under the generic kerosene name; require the declared release quality and route."
    source_ids:
      - unsd-kerosene-definitions
      - eu-jrc-ref-bref-2015
  - rule_id: validate_reference
    applies_to: "all outputs"
    rule: "Require exactly one finished reference-product output and 1 kg net accepted basis. Preserve co-products and combine physically identical kerosene inter-stage transfers inside the aggregated unit; never fabricate an extra UUID or hide an identity to pass checking."
    source_ids:
      - eu-jrc-ref-bref-2015
  - rule_id: validate_balances
    applies_to: "physical and allocated ledgers"
    rule: "Require physical co-product quality/quantity, whole-carrier/species non-overlap, complete paired transfers, container/maintenance/return/inventory coverage, total mass/water/element/energy checks and a separately reproducible allocation ledger. Chemical reaction is never an extra total-mass or elemental source/sink. Absence is incomplete evidence, not proof of zero."
    source_ids:
      - eu-jrc-ref-bref-2015
  - rule_id: validate_emissions
    applies_to: "direct releases"
    rule: "Require correct species, origin and receiving compartment; exclude customer combustion from site emissions. Keep N2O separate from NOx, PM size classes disjoint, captured dust separate, VOC totals non-duplicated and biogenic CO2 visible where applicable."
    source_ids:
      - eu-jrc-ref-bref-2015
      - us-epa-ap42-5-1-2015
  - rule_id: validate_providers
    applies_to: "upstream linkage"
    rule: "A verified UUID alone is insufficient. Unresolved identity or supplier steam/gas/electricity/concentration basis must be disclosed and prevents calling that exchange fully linked; no incompatible nearby identity or correction flow substitution."
    source_ids:
      - eu-jrc-ref-bref-2015
      - us-epa-ap42-5-1-2015
published_dataset_profile:
  dataset_role: "Unallocated multi-output foreground refinery manufacturing dataset with one kerosene reference output and a separate product-specific allocated burden ledger"
  downstream_use: "secondary_dataset; background_dataset only after complete actual provider linkage and disclosed allocation"
  allowed_use: "Declared refinery-gate kerosene supply; cradle-to-gate models with upstream links; downstream use models adding distribution/combustion separately"
  excluded_use: "Generic all-route/all-grade kerosene factors; fuel combustion service; aviation qualification; unverified terminal manufacture"
  required_metadata: "Batch/specification/quality; actual route; geography/period; gate; composition; atomic flows/providers; co-products; balances; allocation hierarchy and drivers"
  required_quality_disclosure: "Unresolved identities and quantity bases; missing coverage; uncertainty; historical/external factors and their actual scope; separately reported allocation sensitivity"
  update_trigger: "Material change in crude/feed, quality subset, hydrotreatment, blend slate, utilities, control, provider, gate, co-products, allocation or monitoring"
data_sources:
  - id: "eu-jrc-ref-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Refining of Mineral Oil and Gas (2015), https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/REF_BREF_2015.pdf"
    used_for: "Sections 1.4.1–1.4.3 (printed 29–33/PDF 63–67), 2.13 (78–86/PDF 112–120), 2.19 (101–102/PDF 135–136), 2.21 (107–108/PDF 141–142), 2.25 (115/PDF 149), 4.24.1–4.24.2 (540–542/PDF 574–576): actual refinery process interfaces, co-products, utilities, air/water/waste coverage; no universal historical quantity reuse"
  - id: "us-epa-ap42-5-1-2015"
    type: "official_guidance"
    reference: "U.S. EPA, AP-42 Section 5.1 Petroleum Refining (April 2015), https://www.epa.gov/sites/default/files/2020-09/documents/5.1_petroleum_refining.pdf"
    used_for: "5.1.1, printed 5.1-1 and 5.1-3/PDF 1 and 3: refinery manufacture, separation/treating/handling and auxiliary boundaries. Emission factors are not adopted; apply only actual source-specific methods if separately verified"
  - id: "unsd-kerosene-definitions"
    type: "official_guidance"
    reference: "UNSD Energy Yearbook Definitions, Kerosene and kerosene-type jet fuel, https://unstats.un.org/unsd/energy/yearbook/def_english_print.htm"
    used_for: "Qualitative petroleum kerosene versus aviation fuel distinction only; historical numeric descriptors are not a contemporary universal supply specification"
