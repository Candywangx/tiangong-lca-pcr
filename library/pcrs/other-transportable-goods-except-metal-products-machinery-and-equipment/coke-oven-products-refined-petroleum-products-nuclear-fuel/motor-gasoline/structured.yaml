system_boundary:
  rules:
    - rule_id: boundary_refinery_gate
      applies_to: "foreground_system"
      rule: "Include operations from receipt of refinery feedstocks and purchased inputs through release and dispatch of finished motor gasoline at the declared refinery gate."
      source_ids:
        - epa-ap42-petroleum-refining-2015
        - eu-jrc-ref-bref-2015
    - rule_id: boundary_required_operations
      applies_to: "process_completeness"
      rule: "Include every separation, conversion, treating, hydrogen-consuming, utility, blending, storage and environmental-control operation that materially serves the represented gasoline route; mark non-applicable units explicitly."
      source_ids:
        - epa-ap42-petroleum-refining-2015
        - eu-jrc-ref-bref-2015
    - rule_id: boundary_upstream_links
      applies_to: "purchased_inputs"
      rule: "Model purchased crude oil, feedstocks, energy, hydrogen, components, chemicals and transport with separate upstream datasets and avoid duplicating their production inside the foreground refinery."
      source_ids:
        - eu-pef-method-2021
    - rule_id: boundary_direct_releases
      applies_to: "foreground_emissions_and_waste"
      rule: "Include direct combustion and process releases, catalyst-regeneration emissions, flaring, fugitive and storage/loading losses, wastewater discharges, recovered sulfur, spent catalysts, sludges and other wastes when generated by included operations."
      source_ids:
        - epa-ap42-petroleum-refining-2015
        - eu-jrc-ref-bref-2015
    - rule_id: boundary_exclusions
      applies_to: "downstream_and_use"
      rule: "Exclude downstream terminal distribution, retail dispensing and vehicle combustion unless the study explicitly extends the gate and reports those stages separately."
      source_ids:
        - un-cpc-v3-2025
        - eu-pef-method-2021
    - rule_id: boundary_capital_goods
      applies_to: "infrastructure"
      rule: "Exclude capital equipment by default only when the goal and applicable program permit it; disclose the exclusion and include material infrastructure when required by the governing study rules."
      source_ids:
        - eu-pef-method-2021
boundary_abstraction:
  declared_starting_condition: "Metered or invoiced crude oil, refinery feedstocks, blending components, oxygenates, additives, purchased energy, water, hydrogen and treatment chemicals received at the declared refinery boundary, with quantity, composition or grade, origin, time and inventory state recorded"
  starting_condition_role: "Foreground refinery-gate starting condition; upstream production and inbound transport are represented by linked supplier or regional datasets rather than recreated inside the foreground refinery processes"
  product_classification_scope: "Finished motor gasoline only; aviation gasoline, jet fuel, naphtha, unfinished blendstocks sold as products, and alternative fuels outside the declared motor-gasoline classification are excluded"
  recursive_input_rule: "Motor gasoline or same-category rework entering the foreground system shall be recorded as a separate product input with supplier or prior-batch identity. Stop recursion at the declared upstream dataset and prevent its burdens or mass from being counted again as virgin refinery production."
  upstream_dataset_requirement: "Link each purchased feedstock, energy carrier, hydrogen, oxygenate, additive, chemical and inbound transport service to a temporally, geographically and technologically representative upstream dataset; disclose proxy use and material gaps"
  disclosure: "Facility and gate; refinery configuration; included process units; crude and feedstock slate; production and inventory period; product-grade mix; oxygenate and biogenic fractions; applicable product standard; allocation drivers and factors; shared utilities and controls; flare, storage, wastewater and waste-treatment coverage; exclusions and proxies"
