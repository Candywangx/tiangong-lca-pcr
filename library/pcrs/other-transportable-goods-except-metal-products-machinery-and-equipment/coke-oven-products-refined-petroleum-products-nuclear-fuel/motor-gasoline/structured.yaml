allocation_rules:
  - rule_id: allocation_subdivide_units
    applies_to: "multifunctional_refinery_units"
    rule: "First subdivide the refinery into measured unit operations and trace feed, energy, hydrogen, utilities, products and direct releases to the units and products that cause them."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
      - argonne-refinery-allocation-2003
  - rule_id: allocation_shared_utilities
    applies_to: "shared_utility_and_control_systems"
    rule: "Assign shared steam, electricity, fuel, hydrogen, flare, wastewater and environmental-control burdens with measured causal drivers such as metered service, fuel demand, hydrogen demand, treated load or pollutant load."
    source_ids:
      - eu-pef-method-2021
      - argonne-refinery-allocation-2003
  - rule_id: allocation_remaining_multifunctionality
    applies_to: "unresolved_refinery_burdens"
    rule: "When subdivision and direct causal assignment cannot resolve a shared burden, use a documented physical relationship. Process-level energy allocation based on product-specific net energy is the preferred screening fallback for energy-bearing refinery products; justify deviations."
    source_ids:
      - iso-14044-2006
      - argonne-refinery-allocation-2003
  - rule_id: allocation_economic_fallback
    applies_to: "no_defensible_physical_relation"
    rule: "Use economic allocation only when no defensible physical relationship exists and the study goal permits it; use contemporaneous, representative prices and disclose the price period, geography and sensitivity."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
  - rule_id: allocation_internal_recycling
    applies_to: "internal_fuels_rework_and_recovered_material"
    rule: "Track internal refinery fuel, rework, recovered vapor and recovered hydrocarbon as internal transfers. Count their production burdens once and do not credit or subtract the same quantity twice."
    source_ids:
      - eu-pef-method-2021
      - eu-jrc-ref-bref-2015
  - rule_id: allocation_sensitivity
    applies_to: "material_allocation_choice"
    rule: "Report a sensitivity result for each materially different defensible allocation method and explain the method selected for the published dataset."
    source_ids:
      - iso-14044-2006
      - argonne-refinery-allocation-2003
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_separation_records
      process_id: "feedstock_separation"
      flow_role: "feedstock receipts, separated streams, desalting inputs, residues and direct releases"
      record_type: "calibrated meters; tank gauges; invoices; laboratory assays; operating and emissions records"
      raw_fields: "timestamp; material/stream id; supplier/origin; mass or volume; density and temperature; water/sulfur or other relevant assay; opening/closing inventory; destination; meter id; uncertainty; pollutant and monitoring basis"
      collection_method: "reconcile receipts, unit transfers, tank inventories, residues and monitored releases by stream and reporting period"
      unit: "kg; m3; kg pollutant"
      frequency: "continuous or per transfer, batch and reporting period"
      temporal_coverage: "complete foreground reporting period, including startup, shutdown and abnormal events"
      site_scope: "all included receipt, desalting and primary-separation units"
      aggregation_rule: "sum measured quantities, convert volume with batch density, reconcile inventory change, then normalize after allocation"
      quality_evidence: "meter calibration; laboratory method; invoice/tank reconciliation; data-gap and abnormal-event log"
    - protocol_id: cp_conversion_treating_records
      process_id: "conversion_treating"
      flow_role: "conversion feeds, auxiliaries, components, co-products, spent materials and direct releases"
      record_type: "unit meters; production logs; catalyst and chemical inventory; laboratory assays; continuous monitors and approved calculations"
      raw_fields: "unit id; route; feed/output stream; mass; energy; hydrogen; catalyst/chemical charge; recycle; inventory change; operating hours; pollutant; monitoring method; control status"
      collection_method: "reconcile each included unit before aggregation and retain route-specific transfers and emissions"
      unit: "kg; MJ; kWh; kg pollutant"
      frequency: "continuous, batch charge and reporting period"
      temporal_coverage: "complete foreground reporting period with downtime and abnormal operation"
      site_scope: "every included conversion and treating unit"
      aggregation_rule: "calculate net unit outputs and direct releases, then assign or allocate them with the declared driver"
      quality_evidence: "meter calibration; assay; catalyst inventory; CEMS/stack-test record; unit mass-and-energy balance"
    - protocol_id: cp_utilities_environment_records
      process_id: "utilities_environment"
      flow_role: "purchased and onsite utilities, environmental-treatment loads, recovered products, residuals and releases"
      record_type: "utility meters; fuel analyses; invoices; flare logs; hydrogen/steam/power balances; wastewater and waste records"
      raw_fields: "service id; source; meter; quantity; energy basis; receiving unit; influent/effluent quantity and composition; flare flow/composition; waste mass/moisture; recovered-product mass"
      collection_method: "reconcile generated, purchased, distributed, exported and lost services; reconcile treatment influent and outputs"
      unit: "MJ; kWh; kg; m3; kg pollutant"
      frequency: "continuous/monthly and reporting period"
      temporal_coverage: "same period as production, including abnormal operation"
      site_scope: "all shared utility and environmental-control systems serving included processes"
      aggregation_rule: "assign direct metered services first; allocate remaining shared service by declared causal driver"
      quality_evidence: "calibrated meters; fuel analysis; treatment laboratory data; flare and waste manifests; allocation reconciliation"
    - protocol_id: cp_blending_certification_records
      process_id: "blending_certification"
      flow_role: "blend components, same-category inputs, released batches, off-spec material and blending releases"
      record_type: "batch tickets; blend-control system; tank gauges; component certificates; accredited or approved laboratory tests; release/disposition records"
      raw_fields: "batch id; component id/source; fossil/biogenic status; mass/volume; density/temperature; octane; sulfur; benzene; oxygenate; volatility/RVP; distillation; grade; specification; release status; rework destination"
      collection_method: "retain one component and quality record set per batch and reconcile blend inputs to released, rework and loss quantities"
      unit: "kg; m3; property-specific units"
      frequency: "each component transfer and finished batch"
      temporal_coverage: "every released and nonconforming batch in the reporting period"
      site_scope: "all finished-gasoline blend tanks and certification points"
      aggregation_rule: "calculate component fractions and batch mass; aggregate only conforming released batches to the declared grade mix"
      quality_evidence: "calibration; certificate of analysis; laboratory method; chain of custody; signed release/disposition record"
    - protocol_id: cp_storage_dispatch_records
      process_id: "storage_dispatch"
      flow_role: "finished-gasoline receipts, inventories, dispatch, returns, residues and releases"
      record_type: "custody-transfer meters; tank gauges; dispatch tickets; vapor-control records; spill and residue records"
      raw_fields: "batch/grade; tank; opening/closing stock; receipts; dispatch; returns; density/temperature; meter id; destination; vapor-control status; residue or spill disposition"
      collection_method: "reconcile each tank and grade on one mass basis before summing net refinery-gate dispatch"
      unit: "kg; m3; kg pollutant"
      frequency: "each transfer and reporting period"
      temporal_coverage: "complete foreground reporting period"
      site_scope: "all finished-product tanks and dispatch points inside the declared gate"
      aggregation_rule: "receipts + opening stock - closing stock - net dispatch - documented transfers = reconciled loss or unexplained difference; calculate emissions separately"
      quality_evidence: "custody-transfer calibration; tank table; dispatch document; vapor-control operation; variance investigation"
  calculation_rules:
    - id: calc_volume_to_mass
      applies_to: "all liquid streams reported by volume"
      rule: "mass = observed or standardised volume × batch-specific density on the matching temperature basis"
      inputs:
        - volume
        - density
        - "temperature basis"
        - "test method"
      output: "kg by batch or stream"
      source_ids:
        - china-gb-17930-2016
        - us-40-cfr-1090
    - id: calc_component_fraction
      applies_to: "finished gasoline blend"
      rule: "component fraction = component mass or corrected volume divided by the corresponding total finished-batch basis; fossil and biogenic components remain separate"
      inputs:
        - "component transfers"
        - density
        - "total released batch"
      output: "component fractions and fossil/biogenic split"
      source_ids:
        - us-40-cfr-1090
    - id: calc_net_unit_output
      applies_to: "refinery unit and storage inventories"
      rule: "net output = measured transfers out - measured returns - increase in attributable inventory, reconciled with transfers in and documented losses"
      inputs:
        - "transfer meters"
        - "opening/closing inventory"
        - returns
        - rework
        - losses
      output: "net process output by stream"
      source_ids:
        - eu-jrc-ref-bref-2015
    - id: calc_allocation_factor
      applies_to: "shared unit or refinery burden"
      rule: "allocation factor = selected causal or physical driver for gasoline divided by the same driver summed over all co-products; factors across the pool shall sum to 1 within rounding tolerance"
      inputs:
        - "metered drivers"
        - "product energy or other physical relation"
        - "co-product set"
      output: "burden-allocation factors"
      source_ids:
        - iso-14044-2006
        - argonne-refinery-allocation-2003
    - id: calc_reference_normalization
      applies_to: "completed foreground inventory"
      rule: "normalized amount = allocated reporting-period amount divided by net kg of conforming motor gasoline dispatched at the declared gate"
      inputs:
        - "allocated inventory"
        - "reference dispatch mass"
      output: "inventory amount per 1 kg reference flow"
      source_ids:
        - eu-pef-method-2021
    - id: calc_storage_reconciliation
      applies_to: "finished-product tankage and dispatch"
      rule: "reconcile receipts, dispatch, returns and inventory change first; classify only supported releases as emissions or wastes and retain unexplained variance as a data-quality finding"
      inputs:
        - "tank and custody-transfer records"
        - spill
        - "vapor and residue records"
      output: "net dispatch, supported loss flows and unexplained variance"
      source_ids:
        - eu-jrc-ref-bref-2015
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate that every aggregated output batch is finished motor gasoline and not aviation gasoline, jet fuel, naphtha, an unfinished blendstock or another alternative fuel."
      evidence: "applicable specification; certificate of analysis; batch release and classification record"
    - id: dq_technology
      applies_to: "refinery configuration and route"
      requirement: "Identify included and non-applicable units, feedstock slate, hydrogen source, utility system, blend route and environmental controls; do not use a generic refinery route without qualification."
      evidence: "unit list; process-flow diagram; production ledger; configuration record"
    - id: dq_temporal
      applies_to: "all foreground data"
      requirement: "Use one coherent production and inventory period that includes normal, startup, shutdown and abnormal events; disclose exclusions and any temporally mismatched upstream datasets."
      evidence: "meter coverage report; event log; dataset dates; gap register"
    - id: dq_geography
      applies_to: "foreground and upstream data"
      requirement: "State the facility location and market; use geographically representative upstream datasets or disclose proxies and sensitivity."
      evidence: "facility metadata; supplier origin; upstream dataset geography"
    - id: dq_measurement
      applies_to: "volumes, masses, energy and emissions"
      requirement: "Retain calibration, density/temperature conversion, laboratory and emissions-monitoring evidence with uncertainty or method limitations."
      evidence: "calibration certificates; laboratory methods; CEMS/stack-test reports; calculation sheets"
    - id: dq_completeness
      applies_to: "process and flow coverage"
      requirement: "Account for all included units, shared utilities, flares, storage, wastewater, wastes and co-products; reconcile missing or excluded data against materiality and governing study rules."
      evidence: "process-to-data matrix; completeness check; exclusion log"
    - id: dq_allocation
      applies_to: "multifunctional burdens"
      requirement: "Store pool membership, drivers, factors, factor sum, rationale and sensitivity; allocation shall be reproducible from collected data."
      evidence: "allocation workbook or machine-readable calculation; alternative-method result"
    - id: dq_mass_balance
      applies_to: "facility, unit, blend and storage balances"
      requirement: "Reconcile inputs, outputs, recycle, inventory change, wastes and documented losses on compatible bases; investigate unexplained imbalance rather than assigning it automatically to emissions."
      evidence: "signed balance; variance threshold and investigation record"
    - id: dq_no_generic_defaults
      applies_to: "quantitative inventory"
      requirement: "Do not replace missing refinery measurements with an uncited generic process dataset or an unlabeled estimate. Report the gap; any later provisional estimate shall be explicitly marked reasoned_estimate, scoped, reviewed and replaced before publication-critical use."
      evidence: "data-gap register; estimate approval and replacement plan"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference_flow"
    rule: "The product flow UUID, mass property UUID, unit-group UUID, reference unit and 1 kg amount shall match the Reference Flow table."
    source_ids: []
  - rule_id: validation_product_scope
    applies_to: "released_batches"
    rule: "Every reference-output batch shall be documented as finished motor gasoline under the applicable specification; excluded fuel categories and unfinished blendstocks shall not be aggregated."
    source_ids:
      - un-cpc-v3-2025
      - china-gb-17930-2016
      - us-40-cfr-1090
  - rule_id: validation_required_qualifiers
    applies_to: "dataset_metadata"
    rule: "All required qualifiers shall be present and internally consistent with the represented batches, geography, period and route."
    source_ids:
      - china-gb-17930-2016
      - us-40-cfr-1090
  - rule_id: validation_mass_conversion
    applies_to: "volume_based_records"
    rule: "Every volume-to-mass conversion shall include density, temperature basis, test method and calculation; otherwise the affected mass result is inconclusive."
    source_ids:
      - us-40-cfr-1090
  - rule_id: validation_process_coverage
    applies_to: "foreground_process_map"
    rule: "Every required process shall have records or an explicit non-applicability justification, and every material operating unit serving the gasoline route shall map to one process."
    source_ids:
      - epa-ap42-petroleum-refining-2015
      - eu-jrc-ref-bref-2015
  - rule_id: validation_recursive_input
    applies_to: "same_category_input"
    rule: "Same-category gasoline and rework inputs shall carry supplier or prior-batch identity and shall not be counted again as virgin reference output or receive duplicated upstream burden."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validation_allocation
    applies_to: "multifunctionality"
    rule: "Allocation pools, drivers, factors and factor sums shall be reproducible; subdivision and causal assignment shall precede remaining physical or economic allocation."
    source_ids:
      - iso-14044-2006
      - eu-pef-method-2021
      - argonne-refinery-allocation-2003
  - rule_id: validation_mass_balance
    applies_to: "unit_blend_and_storage_balances"
    rule: "Input, output, recycle, inventory, waste and documented-loss balances shall close within the facility's approved measurement uncertainty; unexplained variance shall be reported as a finding, not forced into a flow."
    source_ids:
      - eu-jrc-ref-bref-2015
  - rule_id: validation_direct_releases
    applies_to: "emissions_and_waste"
    rule: "Direct process, combustion, regeneration, flare, fugitive, storage, wastewater and waste flows shall be species- and destination-specific where records permit; aggregate or omitted flows require documented limitations."
    source_ids:
      - epa-ap42-petroleum-refining-2015
      - eu-jrc-ref-bref-2015
  - rule_id: validation_representativeness
    applies_to: "published_dataset"
    rule: "Technology, crude/feedstock slate, product mix, time and geography shall match the stated use; an old or foreign refinery proxy shall not be presented as a current local benchmark without explicit limitation and sensitivity."
    source_ids:
      - eu-pef-method-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply of refinery-gate finished motor gasoline to foreground processes and lifecycle models, with separate downstream distribution and combustion when required by the study"
  allowed_use: "Attributional product and process modelling for the declared refinery configuration, geography, reporting period, product-grade mix and allocation method; transparent scenario or sensitivity use when limitations are retained"
  excluded_use: "Vehicle tailpipe or use-phase emissions by itself; filling-station or delivered-fuel supply without downstream stages; aviation gasoline or other excluded fuels; an unqualified global, current-China or current-market benchmark; regulatory compliance certification"
  required_metadata: "PCR id and version; facility and gate; geography; reporting period; applicable standard; batch and grade mix; octane; sulfur and benzene; oxygenate type/fraction; fossil and biogenic fractions; seasonal/volatility class; density and temperature basis; refinery configuration and feedstock slate; included units; energy and hydrogen sources; allocation pools/drivers/factors; reference flow UUIDs; upstream dataset references"
  required_quality_disclosure: "Data-quality rating or equivalent evidence for technology, geography, time and precision; coverage and gap register; meter/laboratory basis; mass-balance results; allocation sensitivity; proxy and exclusion list; abnormal-operation treatment; unexplained variance"
  update_trigger: "Change in applicable fuel specification, product or oxygenate slate, refinery configuration, crude/feedstock slate, hydrogen or energy system, environmental controls, allocation drivers, gate definition, or evidence that the represented period is no longer technologically, geographically or temporally representative"
