allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "unit-process burdens"
    rule: "Avoid allocation by subdividing metered unit operations and assigning directly measured feeds, utilities, emissions, and wastes to the process outputs that cause them."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_2
    applies_to: "shared refinery units"
    rule: "When subdivision or system expansion is not feasible, allocate shared burdens using a documented physical relationship that reflects how the unit operation changes with its outputs; mass, energy, or another causal parameter may be used only when justified for that unit."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_3
    applies_to: "economic fallback"
    rule: "Use economic allocation only when subdivision, system expansion, and a relevant physical relationship are not feasible; use site- and period-specific net product values and disclose prices, averaging period, currency, and sensitivity."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rule_4
    applies_to: "recovered streams and rework"
    rule: "Do not credit internal recirculation, recovered fuel, off-spec rework, or recovered vapour as avoided external production while it remains inside the foreground system; record the transfer and prevent double counting."
    source_ids:
      - mass-balance-identity
      - eu-jrc-ref-bref-2015
  - rule_id: allocation_rule_5
    applies_to: "allocation disclosure"
    rule: "Publish unallocated measured totals, output quantities, allocation factors, allocation method, and the post-allocation inventory so reviewers can reproduce the jet-fuel share."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_material_balance
      process_id: "component_manufacture_or_receipt"
      flow_role: "feed, component, intermediate, co-product, and inventory balance"
      record_type: "mass ledger and tank records"
      raw_fields: "batch_id; material_id; opening_inventory; receipts; transfers; outputs; closing_inventory; density_15c; meter_status"
      collection_method: "calibrated mass or volume meters plus tank reconciliation"
      unit: "kg and m3"
      frequency: "each transfer and monthly close"
      temporal_coverage: "all included batches in the reporting period"
      site_scope: "all included component units and tanks"
      aggregation_rule: "reconcile opening inventory + receipts - outputs - closing inventory by material and period"
      quality_evidence: "meter calibration; tank gauge verification; reconciliation sign-off"
    - protocol_id: cp_hydrogen_and_chemicals
      process_id: "component_manufacture_or_receipt"
      flow_role: "hydrogen and treatment chemicals"
      record_type: "meter and issue records"
      raw_fields: "material_id; supplier; quantity; purity; unit; unit_id; batch; destination"
      collection_method: "calibrated meter, weigh ticket, or controlled issue record"
      unit: "kg"
      frequency: "each transfer or shift"
      temporal_coverage: "all operated treatment campaigns"
      site_scope: "all included treatment units"
      aggregation_rule: "sum by material and normalize after allocation"
      quality_evidence: "calibration; purchase reconciliation; purity certificate"
    - protocol_id: cp_utility_meters
      process_id: "all"
      flow_role: "electricity, fuel, steam, and heat"
      record_type: "utility meter records"
      raw_fields: "meter_id; timestamp; opening; closing; unit; energy_basis; pressure; temperature; allocation_key"
      collection_method: "calibrated site or submeter readings"
      unit: "kWh, MJ, kg, or m3"
      frequency: "hourly, shift, or monthly according to meter"
      temporal_coverage: "complete reporting period"
      site_scope: "included units, tank farm, loading, and laboratory"
      aggregation_rule: "subtract exports and non-scope use; apply disclosed shared-utility allocation"
      quality_evidence: "calibration; meter coverage map; invoice reconciliation"
    - protocol_id: cp_water_and_wastewater
      process_id: "all"
      flow_role: "make-up water, wastewater, treatment, and effluent"
      record_type: "flow meter and laboratory records"
      raw_fields: "stream_id; volume; timestamp; source_or_destination; sample_id; concentration; analyte; detection_limit"
      collection_method: "calibrated flow meter and representative sampling"
      unit: "m3 and kg"
      frequency: "continuous or each discharge with matched sampling"
      temporal_coverage: "complete reporting period"
      site_scope: "all included water and wastewater systems"
      aggregation_rule: "match concentration and flow periods; sum substance loads; avoid duplicate transfer and emission entries"
      quality_evidence: "meter calibration; laboratory QA/QC; sampling plan"
    - protocol_id: cp_waste_records
      process_id: "all"
      flow_role: "solid and liquid residuals"
      record_type: "weigh ticket and manifest"
      raw_fields: "waste_id; description; quantity; unit; date; treatment_route; carrier; recovery_status"
      collection_method: "scale, container record, and waste manifest"
      unit: "kg or m3"
      frequency: "each shipment or internal transfer"
      temporal_coverage: "complete reporting period"
      site_scope: "all included units and waste stores"
      aggregation_rule: "sum by waste type and route; reconcile opening and closing waste inventory"
      quality_evidence: "scale calibration; signed manifest; receiver record"
    - protocol_id: cp_direct_emissions
      process_id: "all"
      flow_role: "direct air and water emissions"
      record_type: "monitoring and factor-calculation records"
      raw_fields: "source_id; substance; compartment; measured_value; activity_data; factor; factor_source; control_status; period"
      collection_method: "continuous monitoring, periodic test, mass balance, or approved factor calculation"
      unit: "kg"
      frequency: "source-specific monitoring frequency"
      temporal_coverage: "complete reporting period"
      site_scope: "every included emission source"
      aggregation_rule: "calculate each substance separately and normalize after allocation"
      quality_evidence: "monitoring calibration; test report; factor provenance; control downtime log"
    - protocol_id: cp_batch_blending
      process_id: "batch_blending_and_release"
      flow_role: "blend components and additives"
      record_type: "batch recipe and transfer records"
      raw_fields: "batch_id; component_batch_id; component_type; volume; mass; density_15c; additive_id; additive_dose; addition_point"
      collection_method: "controlled batch recipe plus calibrated transfer measurement"
      unit: "kg, m3, and mg/L"
      frequency: "each batch"
      temporal_coverage: "every released and rejected batch in the reporting period"
      site_scope: "blending tanks and additive systems"
      aggregation_rule: "convert volumes with batch-specific density; reconcile recipe to tank mass"
      quality_evidence: "meter calibration; component certificates; additive qualification and issue records"
    - protocol_id: cp_batch_quality_release
      process_id: "batch_blending_and_release"
      flow_role: "specification testing, homogeneity, release, quarantine, and rework"
      record_type: "certificate and laboratory records"
      raw_fields: "batch_id; tank_id; specification; grade; sample_id; test_method; result; limit; additive_declaration; component_share; release_status; certificate_id"
      collection_method: "representative batch sampling and accredited or controlled laboratory testing"
      unit: "specification units"
      frequency: "each batch before release"
      temporal_coverage: "every batch in the reporting period"
      site_scope: "point of manufacture"
      aggregation_rule: "do not average away a failure; aggregate only conforming released batches and separately report rejected or reworked mass"
      quality_evidence: "certificate of quality; laboratory QA/QC; sample chain of custody; authorized release signature"
    - protocol_id: cp_storage_and_loading
      process_id: "finished_storage_and_loading"
      flow_role: "certified tank receipt, inventory, samples, losses, and dispatch"
      record_type: "tank and loading ledger"
      raw_fields: "batch_id; tank_id; receipt_mass; opening_inventory; closing_inventory; sample_mass; rework_mass; dispatch_mass; meter_id"
      collection_method: "calibrated tank gauge and dispatch meter with batch traceability"
      unit: "kg and m3"
      frequency: "each transfer and dispatch; daily inventory"
      temporal_coverage: "all released fuel in the reporting period"
      site_scope: "finished-product tanks through point-of-manufacture dispatch meter"
      aggregation_rule: "reconcile certified receipt to net dispatch, inventory change, samples, rework, and losses"
      quality_evidence: "meter calibration; tank reconciliation; dispatch ticket; certificate link"
    - protocol_id: cp_allocation_records
      process_id: "component_manufacture_or_receipt"
      flow_role: "shared refinery burdens and co-products"
      record_type: "allocation workbook and source ledgers"
      raw_fields: "unit_id; input_total; output_id; output_quantity; physical_driver; price; currency; period; allocation_factor"
      collection_method: "reviewed calculation from metered unit and product records"
      unit: "dimensionless plus source units"
      frequency: "each reporting period and material route change"
      temporal_coverage: "same period as the foreground inventory"
      site_scope: "all shared units contributing to the product"
      aggregation_rule: "apply the declared hierarchy and retain unallocated and allocated totals"
      quality_evidence: "independent recalculation; factor sum check; source ledger links; sensitivity result"
  calculation_rules:
    - id: calc_mass_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = allocated reporting-period amount / net dispatched conforming product mass"
      inputs:
        - "allocated amount"
        - "net dispatched mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_volume_to_mass
      applies_to: "liquid feeds, components, and product"
      rule: "mass = observed volume corrected to 15°C × batch-specific density at 15°C"
      inputs:
        - "observed volume"
        - temperature
        - "correction method"
        - density_15c
      output: "kg"
      source_ids:
        - mod-def-stan-91-091-14
    - id: calc_energy_conversion
      applies_to: "electricity and energy carriers"
      rule: "electricity_MJ = kWh × 3.6; other carrier energy = measured quantity × declared net or gross calorific value or measured enthalpy"
      inputs:
        - "metered quantity"
        - "carrier property"
        - "energy basis"
      output: "MJ with retained original unit"
      source_ids:
        - mass-balance-identity
    - id: calc_effluent_load
      applies_to: "treated effluent"
      rule: "substance mass = matched-period discharged volume × concentration, with unit and detection-limit treatment documented"
      inputs:
        - "discharge volume"
        - "analyte concentration"
        - "sampling coverage"
      output: "kg substance to water"
      source_ids:
        - eu-jrc-ref-bref-2015
    - id: calc_allocation
      applies_to: "shared refinery burdens"
      rule: "apply subdivision first; otherwise apply the justified physical relation; use economic allocation only as documented fallback; verify all allocation factors sum to 1 for the shared burden"
      inputs:
        - "unallocated inventory"
        - outputs
        - "allocation drivers"
      output: "allocated inventory and factor set"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_storage_reconciliation
      applies_to: "finished storage and loading"
      rule: "certified receipts = net dispatch + closing inventory - opening inventory + samples + rework transfers + measured losses, with unexplained remainder disclosed"
      inputs:
        - "tank and dispatch ledger fields"
      output: "reconciled net reference output and loss balance"
      source_ids:
        - mass-balance-identity
        - mod-def-stan-91-091-14
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Declare fuel grade, governing specification, point of manufacture, component shares, additive package, and Tiangong reference-flow UUID; do not substitute generic kerosene or a narrow non-representative product flow."
      evidence: "product specification; certificate of quality; flow identity record"
    - id: dq_batch_traceability
      applies_to: "blending, release, storage, and loading"
      requirement: "Maintain batch lineage from every blend component through the release certificate and dispatch record; identify rework and commingled batches explicitly."
      evidence: "component certificates; batch recipe; certificate of quality; tank and dispatch ledger"
    - id: dq_temporal
      applies_to: "foreground inventory"
      requirement: "Use one complete, declared reporting period representative of normal operation; identify shutdowns, abnormal events, inventory carry-over, and campaigns that materially affect the result."
      evidence: "dated meters, ledgers, operating log, and production report"
    - id: dq_completeness
      applies_to: "mass, energy, emissions, and wastes"
      requirement: "Reconcile material and energy ledgers without silent cut-offs; disclose every excluded stream, estimated record, unmatched balance remainder, and monitoring gap."
      evidence: "signed reconciliation; completeness register; gap log"
    - id: dq_measurement
      applies_to: "meters and laboratory results"
      requirement: "Use calibrated measurement systems and retain method, unit, detection limit, correction basis, and calibration status."
      evidence: "calibration certificates; laboratory QA/QC; sampling plan"
    - id: dq_allocation
      applies_to: "shared refinery units"
      requirement: "Retain unallocated totals and reproduce every allocation factor from source records for the same reporting period."
      evidence: "allocation workbook; output ledger; physical-driver or price evidence; sensitivity result"
    - id: dq_upstream_linkage
      applies_to: "purchased inputs and off-site treatment"
      requirement: "Use geography-, technology-, and market-state-appropriate upstream datasets and prevent duplication with foreground operations."
      evidence: "supplier identity; dataset metadata; boundary cross-check"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "product identity"
    rule: "Reject a dataset whose product is gasoline-type jet fuel, non-aviation kerosene, aviation gasoline, an undeclared synthetic blend outside the CPC petroleum-product scope, or a product lacking a declared kerosene-type aviation turbine fuel specification and grade."
    source_ids:
      - unsd-energy-product-definitions
      - astm-d1655-23
      - faa-ac-20-24d-chg1
  - rule_id: validation_rule_2
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net dispatched conforming product linked to flow e1ede47a-b840-45e6-b711-98cb547902cf, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, and Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_rule_3
    applies_to: "fuel-grade conformance"
    rule: "Require a batch-specific quality certificate or equivalent release record and apply the limits of the declared grade and specification. For ASTM D1655 grades, Jet A-1 differs from Jet A by the lower maximum freezing point of -47°C versus -40°C; do not apply one grade label to the other without evidence."
    source_ids:
      - astm-d1655-23
      - faa-ac-20-24d-chg1
  - rule_id: validation_rule_4
    applies_to: "Jet A-1 quality checks"
    rule: "When the dataset declares Jet A-1 to Defence Standard 91-091 Issue 14, verify at least flash point ≥ 38.0°C, density at 15°C between 775.0 and 840.0 kg/m3, freezing point ≤ -47.0°C, viscosity at -20°C ≤ 8.000 mm2/s, and net specific energy ≥ 42.80 MJ/kg, together with all other applicable standard requirements."
    source_ids:
      - mod-def-stan-91-091-14
  - rule_id: validation_rule_5
    applies_to: "batch integrity and traceability"
    rule: "Require a homogeneous batch, representative sampling, component and additive declarations, authorized release, and traceability from component certificates to the dispatch record; for Defence Standard 91-091 Issue 14, investigate density variation greater than 3.0 kg/m3 across the batch rather than treating it as homogeneous."
    source_ids:
      - mod-def-stan-91-091-14
  - rule_id: validation_rule_6
    applies_to: "system boundary"
    rule: "Confirm that operated component supply or linked upstream datasets, treatment, blending, quality release, finished storage, and point-of-manufacture loading are included and that downstream distribution and aircraft use are not silently mixed into the foreground result."
    source_ids:
      - eu-jrc-ref-bref-2015
      - us-epa-ap42-5-1-2015
  - rule_id: validation_rule_7
    applies_to: "inventory completeness"
    rule: "Require explicit records for feeds and components, hydrogen when treatment is operated, utilities, water, co-products, direct emissions, wastewater, wastes, off-spec material, storage and loading losses, and off-site treatment links where applicable."
    source_ids:
      - eu-jrc-ref-bref-2015
      - us-epa-ap42-5-1-2015
  - rule_id: validation_rule_8
    applies_to: "allocation"
    rule: "Verify the allocation hierarchy, causal justification, factor sum, unallocated totals, allocated totals, and economic sensitivity where economic allocation is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_rule_9
    applies_to: "mass and batch reconciliation"
    rule: "Require reconciliation of component inputs, released batch mass, net dispatch, inventory change, samples, rework, co-products, wastes, and measured losses; disclose rather than force-close any unexplained remainder."
    source_ids:
      - mass-balance-identity
      - mod-def-stan-91-091-14
  - rule_id: validation_rule_10
    applies_to: "estimates and UUIDs"
    rule: "Flag any modelled amount, provisional range, non-reference flow UUID, or process UUID that lacks documented selection evidence; Tiangong identity rows do not by themselves justify quantitative amounts."
    source_ids:
      - eu-pef-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production dataset for a finished kerosene-type jet fuel batch or representative production mix at the point-of-manufacture dispatch boundary"
  downstream_use: "Secondary dataset or background dataset for product-system models that require refinery- or terminal-gate kerosene-type jet fuel supply"
  allowed_use: "Cradle-to-gate models when linked to complete upstream datasets; refinery or terminal benchmarking with matched boundaries; downstream fuel distribution and aircraft-use models that add those stages separately"
  excluded_use: "Stand-alone claim of ASTM or Defence Standard certification; CORSIA or sustainability eligibility; comparison of grades or sites without matched specification, allocation, geography, technology, and reporting period; direct representation of airport delivery or aircraft combustion"
  required_metadata: "PCR id; Tiangong flow UUID; fuel grade and specification; point of manufacture; geography; technology and route; component shares; additive package; batch or reporting period; foreground boundary; allocation method; reference mass; density at 15°C; net calorific value basis; data sources"
  required_quality_disclosure: "Batch traceability and release status; measured versus calculated amounts; meter and laboratory coverage; inventory reconciliation; direct-emission methods; wastewater and waste coverage; allocation factors and sensitivity; upstream dataset choices; cut-offs; data gaps; provisional estimates"
  update_trigger: "Change in fuel specification or grade; material route, component slate, synthetic or co-processed share, refinery configuration, treatment severity, energy source, allocation method, storage or loading system, geography, regulation, or reporting-period representativeness"
