system_boundary:
  rules:
    - rule_id: boundary_rule_1
      applies_to: "foreground production"
      rule: "Include the operated component-manufacture or component-receipt route, treatment, blending, quality release, finished-product storage, and point-of-manufacture loading needed to produce the certified reference product."
      source_ids:
        - eu-jrc-ref-bref-2015
        - us-epa-ap42-5-1-2015
        - mod-def-stan-91-091-14
    - rule_id: boundary_rule_2
      applies_to: "upstream supply"
      rule: "Link upstream datasets for every purchased feed, blend component, utility, additive, and treatment service crossing the foreground boundary; a terminal dataset must not claim refinery operations that it did not operate."
      source_ids:
        - eu-jrc-ref-bref-2015
        - eu-pef-2021-2279
    - rule_id: boundary_rule_3
      applies_to: "emissions and wastes"
      rule: "Include measured or calculated direct air emissions, wastewater, oily residues, spent treatment materials, off-spec fuel, tank bottoms, and loading or storage losses from included units, without double counting recovered streams."
      source_ids:
        - eu-jrc-ref-bref-2015
        - us-epa-ap42-5-1-2015
    - rule_id: boundary_rule_4
      applies_to: "excluded downstream stages"
      rule: "Exclude downstream pipeline, truck, rail, marine, airport storage and hydrant operations, aircraft refuelling, and aircraft combustion unless the study explicitly extends the boundary and reports those stages separately."
      source_ids:
        - eu-jrc-ref-bref-2015
    - rule_id: boundary_rule_5
      applies_to: "infrastructure"
      rule: "Exclude capital equipment and one-time construction from the default foreground production dataset; disclose and separately model them when material to the declared study goal."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Integrated refinery route: conditioned crude oil or petroleum feedstock received at the refinery process boundary. Manufacturing-terminal route: qualified kerosene-range blend components received with upstream datasets and batch-quality documentation."
  starting_condition_role: "The foreground starting condition identifies where site records begin; activities before that point are represented by linked upstream datasets rather than omitted."
  product_classification_scope: "Finished kerosene-type aviation turbine fuel within CPC 3.0 code 33342 and its petroleum-product parent scope; grade and specification are dataset qualifiers, not separate canonical PCR identities."
  recursive_input_rule: "Finished kerosene-type jet fuel entering blending, rework, or commingling is recorded as a product input with its own upstream dataset and batch identity; do not recursively expand the same category inside the foreground system."
  upstream_dataset_requirement: "Provide geographically and technologically representative upstream datasets for crude or petroleum feedstocks, purchased kerosene components, hydrogen, electricity, fuels, steam, water, additives, treatment chemicals, and off-site waste treatment."
  disclosure: "Declare site type, route, feed and component slate, specification and grade, reporting period, foreground start and end points, included process units, storage and loading point, allocation method, cut-offs, and any boundary extension."
