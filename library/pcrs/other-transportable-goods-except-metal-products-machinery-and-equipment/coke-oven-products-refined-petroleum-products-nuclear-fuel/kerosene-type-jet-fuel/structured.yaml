measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all inventory results to 1 kg net released fuel; do not use gross tank volume or loaded vehicle volume as the reference amount."
  - id: volume_to_mass
    applies_to: "liquid product and liquid blend components"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert measured volume to mass with the batch-specific density corrected to 15°C and retain the observed volume, temperature, density, test method, and correction method; do not apply a generic default density."
  - id: energy_basis
    applies_to: "calorific value and energy-normalized reporting"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ/kg"
    rule: "Record whether energy values use net or gross calorific value; use batch-specific net calorific value for optional MJ-normalized results and do not replace the mass reference flow."
  - id: grade_property_basis
    applies_to: "fuel quality properties"
    required_property_ref:
      name: "Grade-specific property"
      uuid: ""
    required_unit: "Specification unit"
    rule: "Record each quality result in the unit and test basis required by the declared fuel specification; a batch average must not be used to conceal a nonconforming batch."
  - id: utility_energy_conversion
    applies_to: "electricity, steam, heat, and fuel use"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Preserve the metered unit and conversion basis; use 1 kWh = 3.6 MJ for electricity conversion and declare pressure, temperature, and enthalpy assumptions for steam or heat."
