measurement_rules:
  - id: reference_mass
    applies_to: "wax_ref"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use 1 kg complete QA-accepted wax mixture after tare as denominator for every inventory row; exclude packaging, separated oil, soft wax and rejected wax."
  - id: mass_conversion
    applies_to: "Liquid and molten material rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert metered volume using actual lot density and temperature; preserve measured oil/water/solvent fractions. No database secondary coefficient is a universal density."
  - id: gas_basis
    applies_to: "hydrogen, nitrogen, purge_gas and air species"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For volumetric gas readings record reference and actual T/P, wet/dry composition and compressibility; use a traceable composition-specific conversion and provider basis. Component mass is not whole-stream mass."
  - id: electric_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve actual NCV/MJ reference of the electrical flow; convert kWh meter energy to MJ with 1 kWh = 3.6 MJ. Verify voltage/provider; do not apply a fuel heating-value factor to electricity."
  - id: thermal_basis
    applies_to: "steam, hot_oil_heat, condensate_return"
    required_property_ref:
      name: "Mass and measured net thermal energy"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Keep imported steam mass, steam-contact water and clean condensate return distinct. Derive net duty from actual supply/return enthalpy or fluid heat capacity; an MJ or GCV identity alone does not prove net delivered heat. Unresolved provider definitions block completed dataset linkage."
  - id: physical_ledgers
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass, component mass and energy"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Retain raw unallocated mass, water species, C/H/O/N/S/Cl and energy ledgers first. Treat internal transfers and recycle consistently on both ends; only attribute environmental burdens afterward."
