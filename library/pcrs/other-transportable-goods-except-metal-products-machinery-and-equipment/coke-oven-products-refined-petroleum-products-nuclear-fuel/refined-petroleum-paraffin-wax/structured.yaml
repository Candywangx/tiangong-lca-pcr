allocation_rules:
  - rule_id: allocation_physical_first
    applies_to: "all streams"
    rule: "Preserve the unallocated physical process graph, gas/liquid/solid outputs and water-species/C/H/O/N/S/Cl/energy ledgers. Do not multiply actual co-product outputs, internal links or conserved masses by burden-allocation fractions."
    source_ids:
      - eu-refining-bref-2015
      - eu-pef-allocation-2021
  - rule_id: allocation_avoid
    applies_to: "shared stages"
    rule: "First investigate subdivision by independent stage meters or justified system expansion; retain the expanded result as such. Wax-specific hydrofinishing/storage/loading is directly attributable when separately measured."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_physical
    applies_to: "wax and separated saleable products"
    rule: "Where avoidance is impracticable, justify a relevant quantifiable physical relationship for shared deoiling/recovery/utility burdens. Mass allocation is allowed only with demonstrated relevance and comparable net solvent-free product masses, not because the products share33500."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_other
    applies_to: "nonphysical allocation"
    rule: "If physical relation is unsupported, justify another relationship such as period-specific economic values at the co-production gate; document rejected alternatives, product grades, price period, currency and sensitivity. Fractions sum to one for the chosen shared burden pool."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_interfaces
    applies_to: "upstream and receivers"
    rule: "Retain upstream slack-wax refinery allocation and full exported oil/soft wax/gas amounts, with receiver quantities. No automatic burden-free residue, avoided refinery product, recycled-solvent credit, or double-counted recovery credit."
    source_ids:
      - eu-refining-bref-2015
      - eu-pef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "wax_manufacturing"
      flow_role: "wax and co-products"
      record_type: "production and acceptance records"
      raw_fields: "stream_id; lot; SKU; origin; oil; water; C; H; O; N; S; Cl; full_mixture_composition; refining_degree; crystallinity; CAS_if_applicable; residual_DCE; congealing/melting; state; density; T; net_mass; opening/closing_stock; returns; receiver"
      collection_method: "Calibrated weighing/custody meters, actual lot laboratory release, tank reconciliation and separate stage records. Aggregation detail: Net accepted reference-wax kg Q is denominator; each real external co-product recorded once; each physical net amount / Q."
      unit: "kg; actual laboratory units retained"
      frequency: "Each lot and transfer; monthly reconciliation"
      temporal_coverage: "Same actual representative reporting period, including every represented campaign and stock change"
      site_scope: "All included wax stages and connected storage/utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; sampling; stock ledger; receiver receipt"
    - protocol_id: cp_materials
      process_id: "wax_manufacturing"
      flow_role: "material inputs"
      record_type: "supplier, charge and stock records"
      raw_fields: "material_id; CAS; grade; whole_supplied_mass; carrier; water; impurities; C/H/O/N/S/Cl; full_composition; origin; route; purity; unit; T; P; wet/dry; Z; receipts; charge; replenishment; recovered; export; stocks; service_throughput"
      collection_method: "Reconciled calibrated mass/flow meters and inventory changes; supplier CoA/SDS and catalyst feed-acceptance records; meter purity and composition for gas conversion. Aggregation detail: Net external material use over the same period / Q; catalyst/filter replacements matched to actual service throughput then period; no double charging of initial stock."
      unit: "kg; source volume and conditions retained"
      frequency: "Each receipt/charge; shift readings; service-life reconciliation"
      temporal_coverage: "Same actual representative reporting period, including every represented campaign and stock change"
      site_scope: "All included wax stages and connected storage/utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier identity/CoA; gauges; issue records; service log"
    - protocol_id: cp_solvent
      process_id: "wax_manufacturing"
      flow_role: "DCE circulation and make-up"
      record_type: "closed-loop solvent ledger"
      raw_fields: "whole_stream_mass; full_composition; carrier_water_impurities; DCE_purity; fresh_receipts; opening/closing_tanks; charged; wax/oil_branch_recovered; recirculated; residue; product_residual; aqueous_transfer; air_release; sample_ID"
      collection_method: "Calibrated flow/mass meters and solvent-specific laboratory measurements on both recovery branches, products, water and residues; independently reconcile air measurements. Aggregation detail: Fresh external input / Q; internal gross circulation retained separately with both link ends equal; sum actual DCE exits and stock change on common period."
      unit: "kg DCE and kg actual stream"
      frequency: "Shift/batch records; monthly closed-loop reconciliation"
      temporal_coverage: "Same actual representative reporting period, including every represented campaign and stock change"
      site_scope: "All included wax stages and connected storage/utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "assays; meter calibration; branch ledger; loss reconciliation"
    - protocol_id: cp_energy
      process_id: "wax_manufacturing"
      flow_role: "electricity, steam and hot-oil heat"
      record_type: "stage and utility meters"
      raw_fields: "carrier_id; provider; voltage; meter_energy; steam_mass; pressure_gauge/absolute; T; dryness; enthalpy_in/out; clean_return_mass; hot_oil_flow; fluid_heat_capacity; supply/return_T; recovery; loss; allocation_driver"
      collection_method: "Calibrated stage submeters, supplier bills and common heat/energy balance; preserve carrier units; verify provider heat denominator before linkage. Aggregation detail: Actual physical carrier amount separately / Q; allocate shared environmental burdens only in the separate burden ledger; retain full import/return mass and enthalpy, and no netting electricity against heat."
      unit: "MJ electricity/thermal; kg steam; measured source units"
      frequency: "Continuous/shift; monthly reconciliation"
      temporal_coverage: "Same actual representative reporting period, including every represented campaign and stock change"
      site_scope: "All included wax stages and connected storage/utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; supplier reference definition; enthalpy balance; allocation record"
    - protocol_id: cp_water
      process_id: "wax_manufacturing"
      flow_role: "make-up, condensate and evaporation"
      record_type: "water and thermal records"
      raw_fields: "origin; treatment; flow; density; T; clean_return; contact_condensate; blowdown; evaporation; product/waste_water; wet_gas_water; feed_material_water; reaction_formation/consumption; stocks"
      collection_method: "Calibrated water meters, actual density conversion and paired thermal/water balance; segregated samples and actual receivers. Aggregation detail: Each actual external water amount / Q; internal circulating water separate; steam condensate distinguished by contact state."
      unit: "kg; m3 retained with conversion"
      frequency: "Continuous/shift; reconciled monthly"
      temporal_coverage: "Same actual representative reporting period, including every represented campaign and stock change"
      site_scope: "All included wax stages and connected storage/utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water meter; laboratory; return receipt; balance closure"
    - protocol_id: cp_gas
      process_id: "wax_manufacturing"
      flow_role: "recovery gas and internal hydrogen"
      record_type: "gas meters and composition"
      raw_fields: "stream_id; T; P; dryness; Z; H2; CH4; CO2; H2S; NH3; H2O; other_species; full_wet_stream_mass; C/H/O/N/S/Cl; reaction_water; flow; period; recovered_return; receiver; sulfur/carbon_mass"
      collection_method: "Calibrated matched gas meters with laboratory/composition analysis and mass conversion at documented conditions; receiver readback and sulfur/carbon reconciliation. Aggregation detail: Net external gas stream / Q; whole-stream and contained-species masses separate; internal returned hydrogen equal at both ends."
      unit: "kg whole stream; kg component; measured gas units"
      frequency: "Continuous/shift; composition by batch/change; monthly reconcile"
      temporal_coverage: "Same actual representative reporting period, including every represented campaign and stock change"
      site_scope: "All included wax stages and connected storage/utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; gas analysis; receiver receipt; elemental balance"
    - protocol_id: cp_waste
      process_id: "wax_manufacturing"
      flow_role: "aqueous and solid wastes"
      record_type: "segregated waste records"
      raw_fields: "row_id; origin; wet/dry_mass; water; DCE; oil; catalyst_metals/support; cloth_material; C; H; O; N; S; Cl; full_carrier_mass; hazard; treatment; receiver; transfer_date"
      collection_method: "Calibrated weighbridge/containers or metered aqueous stream with density, representative sampling, receiver acceptance and manifests; distinguish reuse from actual outward disposal. Aggregation detail: Each net actual outward waste amount / Q; contained pollutants are not also direct environmental outputs at sender."
      unit: "kg wet stream; dry and constituent kg retained"
      frequency: "Each transfer; monthly reconciliation"
      temporal_coverage: "Same actual representative reporting period, including every represented campaign and stock change"
      site_scope: "All included wax stages and connected storage/utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling; assays; custody; accepted treatment evidence"
    - protocol_id: cp_air
      process_id: "wax_manufacturing"
      flow_role: "species after controls"
      record_type: "source inventory and emission measurement"
      raw_fields: "source_id; species; CAS; fossil/biogenic; location/subcompartment; control; mass_rate; gas_volume; concentration; response_factor; T; P; dryness; hours; detection_limit; uncertainty; capture/recovery"
      collection_method: "Use species-specific calibrated vent/stack mass-rate measurement or justified site-representative quantified leak method. BREF3.26.1.3 explains that sniffing/OGI location alone does not give mass; retain detection limits and controls. Reconcile H2/N2 and water with physical ledgers. Aggregation detail: Integrated actual post-control species mass / Q, by source and common period; no total-VOC plus species double count and no arbitrary positive or zero emission."
      unit: "kg molecular species; measured source units"
      frequency: "Measured operating and startup/shutdown periods; full source survey on changes"
      temporal_coverage: "Same actual representative reporting period, including every represented campaign and stock change"
      site_scope: "All included wax stages and connected storage/utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; source coverage; raw readings; method validity; uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Normalized external amount = actual period external amount / Q; Q is kg net accepted reference wax from cp_product. Physical co-product masses remain full amounts in the raw ledger."
      inputs:
        - "actual period amount"
        - Q
        - cp_product
      output: "amount per1kg"
      source_ids:
        - eu-refining-bref-2015
    - id: stock_reconciliation
      applies_to: "stored inputs"
      rule: "Net use = opening stock + receipts - closing stock - actual outward returns/transfers; internal recycle does not create an additional external receipt."
      inputs:
        - cp_materials
        - cp_solvent
      output: "net external kg"
      source_ids:
        - eu-refining-bref-2015
    - id: solvent_closure
      applies_to: "DCE"
      rule: "Opening DCE + fresh receipts = closing DCE + DCE in products + DCE in exported oil/soft wax/gas + DCE in waste + DCE emitted + other documented exits. Internal recovered solvent cancels only between matching stage links, not against gross process energy."
      inputs:
        - cp_solvent
        - cp_gas
        - cp_waste
        - cp_air
      output: "solvent balance residual"
      source_ids:
        - eu-refining-bref-2015
    - id: mass_and_elements
      applies_to: "physical process"
      rule: "For total mass and each measured C/H/O/N/S/Cl element: opening inventory + gross external inputs = closing inventory + gross external outputs, including accepted wax, all co-products, returns, wastes and actual molecular emissions. Include water, gas impurities, catalyst/support and other carriers in their whole streams. Reactions add no total-mass or elemental source/sink. Reconcile stage links, gas conversion and analytical scope with uncertainty; unknown composition is an explicit gap, not zero or an invented balancing loss."
      inputs:
        - cp_product
        - cp_materials
        - cp_water
        - cp_gas
        - cp_waste
        - cp_air
      output: "unallocated ledger residual"
      source_ids:
        - eu-refining-bref-2015
    - id: species_reactions
      applies_to: "water and reacting species"
      rule: "Opening species + species inputs + evidenced reaction formation = closing species + species outputs + evidenced reaction consumption. Water includes feed/carrier moisture, wet H2/N2, steam/contact condensate, clean return, cooling evaporation, wastewater and product/waste moisture. H2 consumption, H2S/NH3 formation and actual reaction water belong here; molecular species are contained in whole streams and are not added again to total mass. DCE closure assumes no reaction; investigate demonstrated degradation with a separate species balance and Cl/C/H conservation."
      inputs:
        - cp_materials
        - cp_solvent
        - cp_water
        - cp_gas
        - cp_waste
        - cp_air
      output: "species balance and reaction evidence"
      source_ids:
        - eu-refining-bref-2015
    - id: gross_net_accounting
      applies_to: "boundary exchanges and stocks"
      rule: "Retain gross receipts, dispatch, outward/inward returns and opening/closing stocks before deriving net use. Use gross exchanges plus stock change for physical balances; never subtract stock change again from a balance already using net use. Catalyst/filter/refrigerant service attribution is a separate throughput burden calculation; the actual charge, in-service stock, recovery and disposal remain whole physical masses in their actual periods."
      inputs:
        - cp_product
        - cp_materials
        - cp_solvent
        - cp_waste
      output: "gross ledger; separate net use and service burden"
      source_ids:
        - eu-refining-bref-2015
        - eu-pef-allocation-2021
    - id: interface_matrix
      applies_to: "all stage and external links"
      rule: "Record link_id, sender/receiver unit and stream, boundary/internal role, gross quantity/unit, whole composition, water and elements, T/P/wet basis, energy datum, period/stocks/returns, source record, provider reference and allocated burden separately. Preserve paired solvent, wax, oil/soft wax, H2/wet gas, water/steam/condensate and heat links. Missing linkage is a disclosed gap, not a proxy or zero; external treatment emissions belong at the treatment unit."
      inputs:
        - "all collection protocols"
        - "receiver records"
      output: "paired link matrix and unresolved links"
      source_ids:
        - eu-refining-bref-2015
        - eu-pef-allocation-2021
    - id: thermal_duty
      applies_to: "steam and hot-oil circuit"
      rule: "Heat transferred at the metering interface = measured inlet enthalpy flow - measured returned enthalpy flow, using the same datum and full flow conditions. Useful process duty subtracts only downstream losses not already included in that interface difference; record the meter boundary so the same loss is never subtracted twice. Keep imported steam kg and steam-contact water in the water ledger; verify whether supplier reference denotes gross production, delivered heat or net usable heat."
      inputs:
        - cp_energy
        - cp_water
      output: "measured net MJ; separate kg"
      source_ids:
        - eu-refining-bref-2015
    - id: energy_closure
      applies_to: "whole unit and stages"
      rule: "Reconcile imported electricity/work and heat, exported useful energy, full material-stream sensible/latent enthalpy, thermal accumulation and boundary losses on a common datum and period. Represent chemical conversion either with consistent species chemical enthalpies or with an independently evidenced reaction-heat term, never both. Retain gross heating/cooling, recovered heat and stage pairs; recovery is not a second purchased utility or an automatic credit. No wax-name calorific qualifier, boiler GCV or invented conversion substitutes for the actual energy balance."
      inputs:
        - cp_energy
        - cp_product
        - cp_materials
        - cp_gas
        - cp_water
      output: "unallocated energy residual"
      source_ids:
        - eu-refining-bref-2015
    - id: gas_species
      applies_to: "gas stream and emissions"
      rule: "Obtain molecular component mass from actual composition and a valid condition-specific whole-gas mass conversion; integrate measured emitted species mass rates over observed operating time. Monitoring as C, S or N needs explicit molecular conversion/speciation, not silent relabelling."
      inputs:
        - cp_gas
        - cp_air
      output: "kg actual molecular species"
      source_ids:
        - eu-refining-bref-2015
    - id: burden_partition
      applies_to: "shared burden pool"
      rule: "Product burden per kg wax = directly attributable wax burden / Q + justified wax allocation fraction × remaining shared burden / Q. Derive physical or economic fractions from collected evidence; do not apply this equation to real co-product output quantities."
      inputs:
        - Q
        - "direct burden"
        - "shared burden"
        - "allocation evidence"
      output: "attributed environmental burden"
      source_ids:
        - eu-pef-allocation-2021
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all rows"
      requirement: "Verify actual SKU, CAS/composition, material state, route, exact media, property and provider basis separately; unresolved UUID or background cannot be represented by an incompatible close name."
      evidence: "CoA, original identity, supplier records"
    - id: quality_period
      applies_to: "unit ledger"
      requirement: "Use a representative actual common period and disclosed campaigns; include shutdown/startup and catalyst/refrigerant changes; no fabricated survey duration."
      evidence: "dated raw records and representativeness assessment"
    - id: quality_balance
      applies_to: "all physical stages"
      requirement: "Investigate residuals against measured uncertainty, sampling and stocks; report unresolved residuals explicitly. No arbitrary numeric tolerance."
      evidence: "unallocated mass/element/water/energy balances"
    - id: quality_emission
      applies_to: "source coverage"
      requirement: "Retain species, control, location, detection limit and uncertainty. Absence of a test is not zero; screening concentration/OGI alone is not mass."
      evidence: "source inventory, method and raw tests"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product and route"
    rule: "Verify petroleum-distillate macrocrystalline origin, single DCE route, actual catalyst/feed acceptance, hydrofinishing, SKU and bulk dispatch state. Mixed classification33500does not establish applicability."
    source_ids:
      - eu-refining-bref-2015
      - sasol-wax-route-2011
  - rule_id: validate_reference
    applies_to: "wax_ref"
    rule: "Exactly one accepted reference-product output uses the reference UUID and row link; 1 kg net accepted wax is identical to all inventory/protocol denominators in both languages. Internal intermediate wax is in the stage ledger."
    source_ids:
      - eu-refining-bref-2015
  - rule_id: validate_atomic_identity
    applies_to: "inventory"
    rule: "Every row is one real exchange; independently check route/CAS, exact media, property, unit and official localized name. Fill UUID gaps only after actual search and state100direct read; blank UUIDs remain explicit and actual datasets require compatible resolved identities/providers."
    source_ids:
      - eu-refining-bref-2015
  - rule_id: validate_balance
    applies_to: "physical ledger"
    rule: "Retain complete gas/liquid/solid, water-species, C/H/O/N/S/Cl and energy records; internal links equal at both ends and exported streams match receivers. Physical co-products are not scaled by burden fractions."
    source_ids:
      - eu-refining-bref-2015
      - eu-pef-allocation-2021
  - rule_id: validate_recovery
    applies_to: "solvent and gas"
    rule: "Reconcile DCE on both product branches and all measured losses; gas to recovery or condensate to treatment is not also a direct environmental emission. Retain control losses and declared refrigerant changes."
    source_ids:
      - eu-refining-bref-2015
  - rule_id: validate_energy
    applies_to: "utility links"
    rule: "Verify electrical voltage/NCV basis, steam0.45MPaGwhere selected, gauge/absolute pressure, T/dryness, provider reference and net thermal-energy basis. A generic MJflow or calorific property alone does not complete steam/heat linkage."
    source_ids:
      - eu-refining-bref-2015
  - rule_id: validate_allocations
    applies_to: "burden ledger"
    rule: "Record avoidance assessment, justified relationship, real driver/price records, fractions, sensitivity and upstream refinery share. Do not silently assign zero burden to residues or double-count credits."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: validate_extensions
    applies_to: "additional site units"
    rule: "Before complete dataset claims, add actual atomic flows and evidence for combustion, flare, wastewater treatment, other utilities/refrigerants or packaging. Include all measured species; particulate nested size intervals and aggregates must not be added twice. Unknown relationships or missing emission coverage remain incomplete."
    source_ids:
      - eu-refining-bref-2015
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after complete provider, inventory and quality resolution"
  downstream_use: "Qualified petroleum paraffin input to separately modelled wax formulations or applications"
  allowed_use: "Matching petroleum origin, product specification, route, state, geography and period; declared allocation and utility basis"
  excluded_use: "Whole33500coverage; coke/bitumen/petrolatum/FT/plastic wax proxies; universal recipe; use-phase performance equivalence; food/pharma certification claim"
  required_metadata: "All reference qualifiers; upstream refinery share; actual atomic exchanges/providers; unit boundaries; period; co-product receivers; method/uncertainty; allocation and compatible utility definitions"
  required_quality_disclosure: "Identity/provider gaps, missing sampling, residual balances, provisional backgrounds and unreviewed/excluded units remain explicit; no automatic methodological approval"
  update_trigger: "Feed origin/SKU/solvent/catalyst/process/control/utility/receiver/geography/period change or authoritative evidence change"
data_sources:
  - id: "eu-refining-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Refining of Mineral Oil and Gas, 2015, https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/REF_BREF_2015.pdf"
    used_for: "§2.3 p.48(PDF82); §3.26.1.3 pp.228–229(PDF262–263); §4.3.3–4.3.8 pp.256–259(PDF290–293); §4.25 p.574(PDF608). Process, solvent-recovery branches, hydrogen/catalysts, gas/sulfur interfaces, utilities, waste and quantified-leak limitations. Historical numbers are not defaults; chlorinated-solvent avoidance and applicability limits retained."
  - id: "sasol-wax-route-2011"
    type: "literature"
    reference: "Sasol Limited, Form20-F for year ended30June2011, filed7October2011, printed pp.68–69(PDF69–70), https://www.sasol.com/sites/default/files/2023-11/Sasol%20Form%2020-F%2C%2030%20June%202011.pdf"
    used_for: "Primary historical producer description distinguishes petroleum slack-wax deoiling/hydrogenation in Hamburg from FT manufacture in Sasolburg; bulk/solidified sales. Does not identify DCE or catalyst, establish current production, or supply a recipe, capacity default, emission factor or quantitative range."
  - id: "eu-pef-allocation-2021"
    type: "official_guidance"
    reference: "European Commission, Recommendation(EU)2021/2279, AnnexI §4.5, pp.63–64, https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Generic multifunctionality hierarchy only: investigate subdivision/expansion, relevant physical relationship, then justified other relationship. No wax-specific fraction; no claim of complete PEF or recycling-CFF compliance."
