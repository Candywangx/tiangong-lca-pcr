  classification_refs: "CPC3.0:33500; proposed narrower coverage of qualified petroleum paraffin only"
  covered_products: "Unformulated macrocrystalline petroleum paraffin wax from distillate slack wax"
  excluded_products: "All excluded products and routes in §1; no whole mixed-leaf refinery method"
  representative_product: "One accepted SKU of solvent-deoiled, hydrofinished petroleum paraffin wax"
  production_route: "Slack-wax receipt → dissolution → chilling/crystallisation → filtration/washing → separate wax and soft-wax/oil solvent recovery → qualified hydrofinishing → QC/storage/bulk dispatch"
  market_state: "Bulk wax; molten or solidified state, temperature and grade declared; no package mass in reference"
functional_unit:
  what: "Accepted unformulated petroleum paraffin wax at wax-unit dispatch gate"
  how_much: "1 kg net accepted wax"
  how_well: "Actual SKU specification with measured oil, congealing/melting behaviour, colour, sulfur and residual DCE; no use-phase service equivalence"
  how_long_or_cycle: "One documented production campaign represented in a common reporting period; no lifetime assumption"
  reference_flow_link: "wax_ref"
system_boundary:
  rules:
    - rule_id: boundary_units
      applies_to: "wax unit"
      rule: "Include receipt/storage, dissolution, chilling/crystallisation, filtration/washing, wax-side and soft-wax/oil-side solvent recovery, accepted-feed hydrofinishing, QC, rework, storage, solidification if actual bulk dispatch needs it, loading and controls. Retain stage meters inside one unit."
      source_ids:
        - eu-refining-bref-2015
        - sasol-wax-route-2011
    - rule_id: boundary_recovery
      applies_to: "solvent and gas"
      rule: "Include both recovery branches and refrigerant losses; trace recovered solvent, actual fresh make-up, purge and residues. Record inert-gas or steam stripping as actually installed and reject solvent-contaminated feed from hydrofinishing until plant/catalyst acceptance is met."
      source_ids:
        - eu-refining-bref-2015
    - rule_id: boundary_refinery_interface
      applies_to: "slack wax and co-products"
      rule: "Link the supplying refinery share at the physical transfer; do not duplicate its distillation/base-oil complex or charge the wax with an entire refinery. Link exported gas to actual recovery/SRU, waste liquids/solids to actual treatment; matching receiver and sender quantities use the same basis."
      source_ids:
        - eu-refining-bref-2015
        - eu-pef-allocation-2021
    - rule_id: boundary_extensions
      applies_to: "site applicability"
      rule: "The baseline uses purchased utilities, external wastewater treatment and bulk delivery. On-site combustion, flaring, integrated wastewater treatment, solvent mixtures, packaged dispatch or different catalyst grades require evidenced additional atomic inventory and unit boundaries before claiming completeness. Do not omit measured releases, including biogenic CO2 if genuinely present in an extended site."
      source_ids:
        - eu-refining-bref-2015
    - rule_id: boundary_support
      applies_to: "logistics and maintenance"
      rule: "Include actual supply transport, loading/unloading, tank/container cleaning, filter/catalyst maintenance and associated chemicals, water, wastes and emissions within the declared boundary, with individual atomic rows when present. Bulk dispatch excludes packaging from Q but does not erase its actual burdens: record any packaging or reusable container manufacture, repairs, cleaning, trips, returns, losses and end-of-life with measured service attribution. Declare ownership and receiver interfaces; unknown activity data remain unresolved, never a fabricated recipe."
      source_ids:
        - eu-refining-bref-2015
        - eu-pef-allocation-2021
    - rule_id: boundary_no_factor_default
      applies_to: "quantities"
      rule: "BREF historical utility/yield tables and Sasol capacities are context, not recipe, emission factor, allocation share or universal range; do not transfer wood/paper/coal-coke evidence into petroleum wax manufacture."
      source_ids:
        - eu-refining-bref-2015
        - sasol-wax-route-2011
boundary_abstraction:
  declared_starting_condition: "Measured petroleum-distillate slack wax transferred to the wax unit with composition, upstream provider and allocation; actual solvents, catalysts and utilities received"
  starting_condition_role: "Foreground wax manufacturing gate, not entire refinery crude input"
  product_classification_scope: "Only qualified petroleum paraffin subset of CPC3.0:33500"
  recursive_input_rule: "Same-unit recycled solvent/H2/wax remains internal; externally supplied refined wax or other routes require own provider and applicable method, never burden-free recursion"
  upstream_dataset_requirement: "Include actual slack-wax refinery share, hydrogen, DCE, catalyst/filter material, electricity, steam, water and heat providers; include supply logistics with documented origin/distance/mode and compatible transport service; disclose unavailable backgrounds"
  disclosure: "Route, SKU, state, plant/period, starting transfer, exact included units, shared-utility attribution, co-product/waste receivers, actual mass and elemental balances, upstream allocation and unresolved provider bases"
