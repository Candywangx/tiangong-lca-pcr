validation_rules:
  - rule_id: validate_identity_scope
    applies_to: "product identity"
    rule: "Fail if the product is not a liquid finished lubricating oil, if petroleum-oil fraction is below 0.70 or unsupported, or if required qualifiers are missing."
    source_ids:
      - unsd-cpc-3-0
  - rule_id: validate_reference_flow
    applies_to: "quantitative reference"
    rule: "Require exactly 1 kg net conforming Lubricating oil 66628f20-9d33-4997-bd6c-6357453fa268 with Mass 93a60a56-a3c8-11da-a746-0800200b9a66; packaging must be separate."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_process_coverage
    applies_to: "process inventory"
    rule: "Require both formulation_blending and filling_dispatch, including bulk loading when no primary packaging is used; fail if a plant-controlled material, utility, waste, or direct release is silently omitted."
    source_ids:
      - api-tr-1533-2023
  - rule_id: validate_mass_balance
    applies_to: "formulation and dispatch"
    rule: "Require documented process mass-balance closure, investigation of residuals against the site's approved tolerance, and disclosure of remaining residual; rework must not be double counted as product and waste."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_allocation
    applies_to: "shared operations"
    rule: "Require sub-metering, mass allocation for similar-intensity routes, or a documented causal basis for materially different routes; disclose the selected basis and affected flows."
    source_ids:
      - api-tr-1533-2023
  - rule_id: validate_temporal_completeness
    applies_to: "foreground data period"
    rule: "Require at least 12 consecutive months of representative foreground records or a justified shorter campaign that covers the complete production campaign and its inventory changes."
    source_ids:
      - api-tr-1533-2023
  - rule_id: validate_upstream_links
    applies_to: "material and energy inputs"
    rule: "Require a provider dataset or reviewed proxy for every non-trivial input and disclose technology, geography, time, and allocation limitations."
    source_ids:
      - api-tr-1533-2023
  - rule_id: validate_no_double_count
    applies_to: "utilities, packaging, emissions, and rework"
    rule: "Fail when a quantity is counted in more than one process, embedded provider emissions are repeated as direct emissions, reusable packaging is counted on every cycle without adjustment, or rework receives a second production burden."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_reasoned_ranges
    applies_to: "provisional ranges"
    rule: "Treat every reasoned_estimate range as a screening aid only; it cannot replace foreground records and must be disclosed and replaced before publication-critical use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for petroleum-derived finished lubricating oil at the lubricant plant dispatch gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product- and site-qualified process LCI, cradle-to-gate models with linked upstream providers, supplier footprints, and comparison only between datasets with aligned formulation scope, boundary, allocation, period, packaging treatment, and data quality"
  excluded_use: "Lubricating grease or non-petroleum formulations; generic use-phase performance; avoided-emission claims; cradle-to-grave claims; combustion or fuel substitution; unqualified comparison across product families or performance grades"
  required_metadata: "canonical PCR id; product family and application; liquid state; petroleum fraction; base-oil group and re-refined share; additive package; viscosity or performance grade and specification; plant geography; production period; bulk or packaging format; boundary; allocation; provider datasets; proxy list"
  required_quality_disclosure: "foreground coverage and calibration; mass-balance residual; utility allocation; formulation confidentiality treatment; temporal, geographic, and technological representativeness; upstream proxy limitations; reasoned estimates; exclusions and cut-off decisions"
  update_trigger: "Material formulation, base-oil route or re-refined share change; product-family or performance-specification change; plant or technology change; packaging change; allocation change; provider replacement; production period rollover; new evidence that invalidates a provisional range or boundary rule"
