allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "batch materials, utilities, wastes, and emissions"
    rule: "Avoid allocation by separate batch records, sub-metering, tank reconciliation, or subdivision of independently measured operations wherever practical."
    source_ids:
      - api-tr-1533-2023
  - rule_id: allocation_shared_utilities
    applies_to: "shared electricity, heat, steam, water, and site services"
    rule: "When product routes have similar utility intensity, allocate reconciled shared utilities by net mass of conforming output; when intensity differs materially, use sub-metering or a documented causal engineering basis and disclose the result."
    source_ids:
      - api-tr-1533-2023
  - rule_id: allocation_rework
    applies_to: "in-system rework"
    rule: "Return controlled same-product rework to the batch mass balance without assigning a second upstream burden; material leaving the product system is recorded as product, waste, or emission according to its actual fate."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_upstream_coproducts
    applies_to: "base oils and additive provider datasets"
    rule: "Use the provider dataset's reviewed co-product allocation; do not reallocate upstream refinery or chemical burdens inside the lubricant blending foreground. If a provider method is unknown, disclose the limitation."
    source_ids:
      - api-tr-1533-2023
  - rule_id: allocation_no_unverified_credit
    applies_to: "waste and recovered material"
    rule: "Do not assign avoided-burden or recycling credits in this foreground process without an explicit downstream system model and consistent allocation method."
    source_ids:
      - api-tr-1533-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_materials
      process_id: "formulation_blending"
      flow_role: "base oils, additives, and formulation materials"
      record_type: "batch recipe, weigh ticket, transfer meter, tank inventory"
      raw_fields: "batch_id; product_code; supplier_flow; material_role; base_oil_group; virgin_or_rerefined; opening_mass; received_mass; charged_mass; closing_mass; unit; density; temperature"
      collection_method: "reconcile recipe, weigh/flow records, and tank inventory for each batch"
      unit: "kg; L with density conversion"
      frequency: "each batch"
      temporal_coverage: "representative period covering at least 12 consecutive months"
      site_scope: "all production lines and tanks serving the declared product"
      aggregation_rule: "sum attributable material by product and divide by conforming blended output; reconcile inventory change"
      quality_evidence: "calibrated scale or meter record, recipe authorization, supplier specification, tank reconciliation"
    - protocol_id: cp_blending_utilities
      process_id: "formulation_blending"
      flow_role: "electricity, heat, steam, fuel, and water"
      record_type: "utility meter, invoice, equipment log"
      raw_fields: "meter_id; carrier; opening_reading; closing_reading; unit; line_or_area; operating_hours; batch_ids; allocation_basis"
      collection_method: "use sub-metering first; otherwise reconcile site totals and apply the approved allocation rule"
      unit: "kWh; MJ; kg; m3"
      frequency: "monthly and by batch where metered"
      temporal_coverage: "same representative 12-month period"
      site_scope: "blending, heating, cooling, filtration, laboratory, and attributable support equipment"
      aggregation_rule: "subtract non-production demand, allocate only the reconciled remainder, and normalize to conforming output"
      quality_evidence: "meter calibration, invoices, fuel analysis, allocation worksheet, reconciliation sign-off"
    - protocol_id: cp_blending_outputs_wastes
      process_id: "formulation_blending"
      flow_role: "released product, rework, oily waste, filters, and wastewater"
      record_type: "tank transfer, production report, waste manifest, wastewater meter"
      raw_fields: "batch_id; released_mass; rework_returned; waste_stream; waste_mass; wastewater_volume_or_mass; treatment_route; opening_inventory; closing_inventory"
      collection_method: "reconcile released product and all non-product outputs to material inputs"
      unit: "kg; m3 with density conversion"
      frequency: "each batch and each waste shipment"
      temporal_coverage: "same representative 12-month period"
      site_scope: "all included blending operations"
      aggregation_rule: "aggregate by product family and treatment route; keep rework inside the balance and waste outside it"
      quality_evidence: "signed release record, manifest, wastewater log, inventory reconciliation"
    - protocol_id: cp_direct_emissions
      process_id: "formulation_blending_filling_dispatch"
      flow_role: "direct elementary releases"
      record_type: "stack or fugitive measurement, permit report, emission calculation"
      raw_fields: "substance; compartment; measurement_method; activity_data; factor; measured_amount; uncertainty; reporting_period; process_area"
      collection_method: "use measured releases where available; otherwise use the regulated calculation method and retain inputs"
