    - id: calc_process_mass_balance
      applies_to: "each process and batch family"
      rule: "residual = total mass inputs - net product outputs - recorded rework transfers - waste outputs - measured elementary mass releases - closing inventory increase + opening inventory decrease; investigate and disclose residual"
      inputs:
