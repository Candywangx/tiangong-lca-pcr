        - product
        - waste
        - emission
        - "and inventory records"
      output: "mass-balance residual and closure statement"
      source_ids:
        - mass-balance-identity
    - id: calc_packaging_intensity
      applies_to: "packaged product"
      rule: "packaging intensity by material = packaging material issued less verified reusable returns and rejects / net kg lubricant dispatched"
