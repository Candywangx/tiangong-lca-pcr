allocation_rules:
  - rule_id: allocation_physical
    applies_to: "coking_plant"
    rule: "Keep the unallocated physical graph and mass/C/H/O/N/S/water/energy ledgers separately from burden allocation. Never multiply the real coke, breeze, gas, tar, benzol, sulphate or recovered sulphur quantities by allocation shares. Internal gas, recycle liquor and residue returns are not saleable co-products at this boundary. Packaging dispatched with a chemical product is an attached physical component with no separate co-product revenue/share; retain its real count/mass and attribute its manufacturing burden only once to that packaged product."
    source_ids:
      - jrc-iron-steel-coking-2013
  - rule_id: allocation_direct
    applies_to: "coking_plant"
    rule: "Under this authored attributional protocol, first assign independently measured separable processing burdens to their actual products. Document any remaining demonstrable physical causal relationship; mass or calorific allocation is not automatically causal for gas/liquid/solid chemical recovery. Record decisions and evidence through cp_allocation."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "coking_plant"
    rule: "If separability and physical causality cannot be established, use documented actual campaign net gate revenues for remaining shared burdens, with cp_allocation: share_j = revenue_j / sum revenues of all genuine exported co-products; assigned burden_j = directly attributable burden_j + share_j × residual shared burden. Retain every qualifying product, common pricing units/currency/period and sensitivity to another justified basis. Do not assign a share to an internal gas loop or waste sent for paid treatment. Zero/negative or missing revenues require reviewed resolution, not an invented fraction."
    source_ids: []
  - rule_id: allocation_export
    applies_to: "coking_plant"
    rule: "Exported clean gas, crude tar and crude benzol receive their documented burden at the outgoing gate. Their receiving datasets begin at the same physical state and amount. Do not simultaneously give avoided-product credit and partition the same shared burden; any substitution study is a separate declared scenario."
    source_ids:
      - jrc-iron-steel-coking-2013
dataset_production:
  collection_protocols:
    - protocol_id: cp_coke
      process_id: "coking_plant"
      flow_role: "coke_dispatch"
      record_type: "weighing_record"
      raw_fields: "lot; accepted net dispatch mass; opening/closing stock; grade; rejected mass; moisture sample/method; sieve distribution; calibration; start/end date"
      collection_method: "Calibrated dispatch scale plus accepted stock reconciliation; representative moisture/quality tests; independently preserve dry-equivalent mass"
      unit: "kg"
      frequency: "each lot and campaign close"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_material
      process_id: "coking_plant"
      flow_role: "atomic material inputs"
      record_type: "supply_record"
      raw_fields: "row_id; material/grade/CAS if relevant; supplier; lot; net supplied mass; water; concentration; C/H/O/N/S/ash with analytical basis; NCV/GCV methods and bases; stock/returns; stage"
      collection_method: "Calibrated weighing/stock records and representative lab tests; verify each actual coal component and supplied chemical form; no recipe inferred from a database identity"
      unit: "kg"
      frequency: "each delivery and batch"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_products
      process_id: "coking_plant"
      flow_role: "each exported coproduct"
      record_type: "dispatch_record"
      raw_fields: "row_id; lot; grade; actual net gate mass; water/purity; C/H/O/N/S and analytical basis; destination; stock; light-oil composition; acceptance/revenue record"
      collection_method: "Separate calibrated product meters/weighing and stock correction; analyse tar/benzol water and composition; keep mass distinct from allocated burden"
      unit: "kg"
      frequency: "each dispatch/shift"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_gas
      process_id: "coking_plant"
      flow_role: "atomic gas inputs and cog_export"
      record_type: "meter_record"
      raw_fields: "meter/source/stage; raw reading; T; absolute P; water fraction; dry composition; Z method; density method; NCV/GCV; gross clean gas; firing; other internal use; flare; leaks; export; storage"
      collection_method: "Continuous calibrated gas meters with paired composition/moisture samples and state equations; reconcile each split and supplier reference conditions, not database secondary conversion"
      unit: "kg; m3; MJ"
      frequency: "continuous; paired analyses by documented variability"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_utilities
      process_id: "coking_plant"
      flow_role: "electricity_import; steam_import"
      record_type: "meter_record"
      raw_fields: "meter/stage; electricity CN location, grid-average mix, user voltage and kWh; supply/return steam mass; pressure/temp/dryness; condensate; provider enthalpy/system basis; firing boundary; start-up and losses"
      collection_method: "Calibrated interval electricity/steam meters; reconcile stage totals and imported versus internally generated energy with supplier documentation; obtain enthalpy by documented steam-state calculation"
      unit: "kWh; MJ; kg"
      frequency: "continuous or each shift"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_water
      process_id: "coking_plant"
      flow_role: "water supplies, river, vapour, liquid return and wastewater transfer"
      record_type: "water_balance_record"
      raw_fields: "stage; source; air humidity; rain/runoff; intake/make-up; recycle; steam/condensate; coal water; generated reaction water; coke/tar retained water; evaporation; liquid bleed/return; recipient; wastewater treatment endpoint; density; stock"
      collection_method: "Independent calibrated meters/levels and paired mass/moisture measurements; retain quench/cooling/flush loops and reaction water explicitly; measured water balance with residual uncertainty, not arbitrary closure"
      unit: "kg; m3"
      frequency: "continuous; daily reconciliation"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_waste
      process_id: "coking_plant"
      flow_role: "each externally transferred waste"
      record_type: "transfer_record"
      raw_fields: "row_id; stage/origin; wet mass/volume; dry solids; contaminants/PAH; receiver/treatment; internal returned mass; stock; manifests"
      collection_method: "Calibrated weighed transfer plus composition/moisture analysis and signed receiver records; independently inventory recycle rather than treating it as external waste"
      unit: "kg; m3"
      frequency: "each transfer and campaign close"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_air
      process_id: "coking_plant"
      flow_role: "each atmospheric species and size fraction"
      record_type: "emission_record"
      raw_fields: "row_id; source/stack height; ducted/diffuse/fugitive; process/load/time; abatement/bypass; species/CAS; gas T/P/wet-dry/O2 reference; concentration and flow; sampling duration; PM fraction/filter/condensable definition; non-detect/LOQ; combustion fuel origin; method"
      collection_method: "Actual source-specific measurements or a documented source/control-matched estimation model; integrate concentration × matched gas volume over operation and discrete pushes/charges; separate leaks and flare, retain method and uncertainty. Historical EPA/BREF factors are not default values"
      unit: "kg"
      frequency: "continuous where available plus representative source/event sampling"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_effluent
      process_id: "coking_plant"
      flow_role: "each final water species/indicator"
      record_type: "analytical_record"
      raw_fields: "row_id; treatment outlet/recipient; volume/time; lab analyte/CAS; ion versus element equivalent; units; dissolved/total; sampling/compositing; concentration; lab conversion; LOQ; sludge split"
      collection_method: "Paired calibrated outlet volume and representative flow-proportional/composite laboratory sample, matched in time; species-specific analysis; keep COD/BOD/total N/total phenols/PAH totals as auxiliary indicators, not invented species"
      unit: "kg; m3"
      frequency: "documented sampling schedule and campaign integration"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_balances
      process_id: "coking_plant"
      flow_role: "unallocated physical balances"
      record_type: "balance_record"
      raw_fields: "stage graph; matched internal link ids/amounts; all external quantities; all materials/product/waste water/C/H/O/N/S/ash; complete gas composition; actual combustion air/O2/N2/humidity and wet exhaust; quench slurry/sludge; condensate; packing/returns; stocks; NCV/GCV/enthalpy; heat losses; tolerance from uncertainty"
      collection_method: "Build stage and whole-plant mass/element/energy balances from paired measurements; preserve reactions, oxygen, fuel loops, reaction water and measured or modelled losses; report residuals and their uncertainty instead of assigning them to an invented emission"
      unit: "kg; m3; MJ"
      frequency: "daily and campaign close"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
    - protocol_id: cp_packaging
      process_id: "coking_plant"
      flow_role: "ammonium-sulphate bags"
      record_type: "packaging_record"
      raw_fields: "specification; nominal capacity; actual issued and delivered counts; discarded count; stock and returns; net empty-bag mass samples; polypropylene/liner/coating/closure composition and inclusive supplier packing boundary; provider item definition"
      collection_method: "Count issued bags against procurement and stocks; weigh representative empty bags of the same specification on a calibrated scale, converting packaging mass to count only using those samples; nominal capacity is not bag mass"
      unit: "Item(s); kg"
      frequency: "each packaging operation and campaign close"
      temporal_coverage: "same declared campaign"
      site_scope: "selected coking-plant packaging stage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "count records, representative weighing, specification and provider quantity definition"
    - protocol_id: cp_allocation
      process_id: "coking_plant"
      flow_role: "allocation burden ledger"
      record_type: "allocation_record"
      raw_fields: "directly attributable burdens; residual shared burdens; every genuine external product quantity; physical causal justification; net gate prices/revenues; basis/unit/currency/period; transfers; decision; sensitivity"
      collection_method: "Use actual campaign accounts and product acceptance/receiver records; derive shares from a justified measured basis only for residual common burdens; retain complete unallocated ledgers and evidence for each excluded or included product"
      unit: "kg; MJ; currency"
      frequency: "one consistent campaign, with price sensitivity"
      temporal_coverage: "same declared campaign; include start-up/shutdown and abnormal events"
      site_scope: "selected coke plant and separately identified meters/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw timestamps; chain of custody; paired analytical basis; reconciliation; uncertainty and missing-data disclosure"
  calculation_rules:
    - id: campaign_normalisation
      applies_to: "all inventory rows"
      rule: "Inventory intensity = actual external exchange integrated over the same campaign / accepted net as-received dispatched coke mass in kg. Correct opening/closing stocks and exclude breeze from this denominator; final coke output is 1 kg. Unallocated physical amounts remain attached to the physical graph."
      inputs:
        - cp_coke
        - cp_material
        - cp_packaging
        - cp_products
        - cp_gas
        - cp_utilities
        - cp_water
        - cp_waste
        - cp_air
        - cp_effluent
      output: "per 1 kg reference flow"
      source_ids: []
    - id: gas_state_conversion
      applies_to: "cog_export; natural_gas_import; nitrogen_makeup"
      rule: "Dry reference volume = measured wet volume × dry mole fraction × measured absolute P / reference absolute P × reference T / measured T × reference Z / measured Z, with temperatures in kelvin and a declared equation-of-state method. Mass = measured volume × density at the same composition/wet-dry/T/P/Z state. Reject incomplete provider quantity matching."
      inputs:
        - cp_gas
      output: "state-bound gas quantities, then campaign_normalisation"
      source_ids: []
    - id: air_integration
      applies_to: "atmospheric emissions except water vapour"
      rule: "Emission mass = sum of matched concentration × gas volume intervals plus independently justified event/fugitive loads; keep raw measurement basis before reference-gas or oxygen corrections. Do not replace the actual gas volume with a BAT limit concentration or default coke-gas yield. Separate exclusive PM bins; subtract cumulative measurements only if sampling definitions/time are compatible and differences are non-negative."
      inputs:
        - cp_air
      output: "species mass per 1 kg reference flow"
      source_ids:
        - jrc-iron-steel-coking-2013
        - epa-coke-production-2008
    - id: effluent_integration
      applies_to: "final water emissions"
      rule: "Species mass = sum of concentration × matched final discharged volume with documented unit conversion. If reported as N, S or a total assay, establish the actual analyte and method-specific conversion first. Only laboratory-speciated ions enter corresponding atomic rows; auxiliary total indicators do not close the elemental balance by assumption."
      inputs:
        - cp_effluent
        - cp_water
      output: "species mass per 1 kg reference flow"
      source_ids:
        - jrc-iron-steel-coking-2013
    - id: balance_reconciliation
      applies_to: "unallocated physical ledgers"
      rule: "For total mass and each of C/H/O/N/S, external inputs = external outputs + stock change + disclosed residual with measurement/model uncertainty; reactions do not create or destroy mass or elements. Include complete combustion air, humidity and exhaust carriers, all wet materials, products, waste and return interfaces. For the water species ledger alone, record chemically formed/consumed H2O explicitly, alongside incoming humidity and material-bound water. Internal pipes have equal amounts, composition, wet/dry basis and state at paired ends, canceling only at the aggregate boundary. Energy uses one consistent NCV or GCV/reference-state convention with documented conversions: external chemical/thermal/electrical inputs = external chemical/sensible/latent/thermal/electrical outputs + losses + energy-stock change + disclosed reference-state/reaction-energy residual. Coal-derived gas burned inside is counted once within coal input energy, never again as external gas input/export; avoid double-counting latent heat under the chosen calorific convention. Do not close residuals by invented emissions."
      inputs:
        - cp_balances
        - cp_gas
        - cp_water
        - cp_material
        - cp_products
        - cp_utilities
        - cp_packaging
        - cp_waste
      output: "separate total-mass/C/H/O/N/S/water/energy ledgers with uncertainty"
      source_ids:
        - jrc-iron-steel-coking-2013
  data_quality_requirements:
    - id: dq_route
      applies_to: "coking_plant"
      requirement: "Document one actual connected configuration. A BREF alternative or historical single-plant example is not evidence of its presence at the site."
      evidence: "site diagram, operation records and cited original sections"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Every actual external material, fuel, product, waste and emission needs one atomic row. Add distinct actual coal components, treatment chemicals, oils, packaging, maintenance inputs and pollutants when present, with equivalent bilingual units and verified identities. Unmeasured is not zero; non-applicability requires evidence."
      evidence: "meter map, procurement/product/waste accounts and source assessment"
    - id: dq_source_limits
      applies_to: "coking_plant"
      requirement: "No universal yield, moisture, carbon/sulphur, heating value, quench evaporation or emission default is prescribed. BREF Table 5.2 is explicitly unsuitable for calculations and excludes some diffuse/fugitive/handling releases; the single-plant energy illustration is not a standard balance. EPA historical factors require independent source/control/basis matching if later used."
      evidence: "BREF 5.2.1–5.2.2; EPA 12.2.2 and factor-specific provenance"
    - id: dq_identity
      applies_to: "coking_plant"
      requirement: "UUID establishes only the declared physical identity/property, not a compatible supplier process dataset. Retain source classification defects and independently verify concentrations, geographical/voltage/supply states and reference quantities. Unknown UUIDs or pressure/state bases remain explicit until resolved."
      evidence: "identity records, analyses and supplier reference definition"
validation_rules:
  - rule_id: validate_reference
    applies_to: "coke_dispatch"
    rule: "Require exactly one accepted final product reference with 1 kg as-received net coke, and identical bilingual denominator, aggregation and formula. Do not hide a verified intermediate UUID or add a fabricated identity to bypass reference checks."
    source_ids: []
  - rule_id: validate_route
    applies_to: "coking_plant"
    rule: "Check coal-coke manufacturing and wet-quench route, actual gas treatment connectivity and supply boundaries; reject petroleum-coke or dry/non-recovery route mixing and unreviewed chemical substitutions."
    source_ids:
      - jrc-iron-steel-coking-2013
      - epa-coke-production-2008
  - rule_id: validate_balances
    applies_to: "coking_plant"
    rule: "Require source-bound whole-plant and stage mass/C/H/O/N/S/water/energy ledgers before allocation, paired internal links and independently justified residual uncertainty. No generic complete closure tolerance or per-coke recipe is assumed. Missing balances make the concrete dataset incomplete."
    source_ids:
      - jrc-iron-steel-coking-2013
  - rule_id: validate_pollutants
    applies_to: "coking_plant"
    rule: "Check outdoor air/water versus resource/waste identity, each species/CAS, fossil origin where specified and reference property/unit. Preserve NOx quantity-definition uncertainty separately from identity; exclude N2O from NOx. Do not sum nested PM ranges or compound/total indicator duplicates. Biogenic CO2, if actual biogenic carbon is introduced under a reviewed extension, remains in the LCI irrespective of GHG reporting conventions."
    source_ids:
      - jrc-iron-steel-coking-2013
      - epa-coke-production-2008
  - rule_id: validate_allocation
    applies_to: "coking_plant"
    rule: "Confirm each genuine external co-product, direct/shared burden split, matched revenue basis if used and conservation of allocated burden. Preserve physical output amounts and receiving gates without allocation-share scaling. Unresolved zero/negative values, absent prices or causal basis require review."
    source_ids: []
