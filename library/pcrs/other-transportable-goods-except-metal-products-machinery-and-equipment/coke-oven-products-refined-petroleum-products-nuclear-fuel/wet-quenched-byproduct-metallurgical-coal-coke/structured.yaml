measurement_rules:
  - id: reference_mass
    applies_to: "coke_dispatch"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use 1 kg net accepted coke on the declared as-received dispatch basis; weigh with cp_coke and exclude packaging and breeze. Measure moisture on representative dispatch samples and retain the independently derived dry equivalent. All inventory rows and collection aggregation use this same coke denominator."
  - id: material_bases
    applies_to: "coal_charge; coke_dispatch; crude_tar_dispatch; crude_benzol_dispatch; ammonium_sulphate_dispatch"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For each material record as-received mass and water fraction independently; dry mass = wet mass × (1 − wet-basis water fraction). Dry ash-free, dry and received carbon/sulphur/heat bases are distinct; convert using that material’s analysed water/ash, never another material’s moisture. cp_material/cp_products/cp_coke retain samples and methods."
  - id: gas_bases
    applies_to: "cog_export; natural_gas_import; nitrogen_makeup"
    required_property_ref:
      name: "Mass or Volume, according to verified reference property"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Store measured gas volume with T, absolute P, water fraction, composition and Z. Conversion to a specified dry reference volume follows the documented equation-of-state protocol; conversion to mass uses the same measured composition and state. Do not assume Nm3 temperature or pressure, density or NCV. Self-produced gas gross and internal links remain equal on both ends."
  - id: packaging_count
    applies_to: "sulphate_bags"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "Item(s)"
    rule: "Collect the count of the same declared complete empty-bag specification using cp_packaging; if only packaging mass is recorded, derive count using the measured net empty bag mass from actual representative samples, never a database default bag weight. Keep packaging separate from net ammonium sulphate mass."
  - id: energy_bases
    applies_to: "electricity_import; steam_import; natural_gas_import"
    required_property_ref:
      name: "verified energy property plus independent carrier quantity"
      uuid: ""
    required_unit: "MJ; kg; m3"
    rule: "Keep electricity, fuel chemical energy and net supplied steam enthalpy in separate ledgers. For electricity preserve the actual direct-read property and use 1 kWh = 3.6 MJ. For coal/coke/gas keep NCV and GCV and sampling water basis separate. Steam net heat requires mass × (supply enthalpy − return enthalpy) on the provider boundary including dryness/pressure; unknown basis prevents the background link."
