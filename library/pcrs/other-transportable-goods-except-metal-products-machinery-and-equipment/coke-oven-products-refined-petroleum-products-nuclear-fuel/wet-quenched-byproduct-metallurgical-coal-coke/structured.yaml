published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "actual coal-coke supply at the declared coking gate; allocated companion-product interfaces only with their own verified gates"
  allowed_use: "compatible blast-furnace coke procurement/manufacturing LCI with actual route and grade; matched secondary/background use after dataset evidence review"
  excluded_use: "petroleum/peat/lignite/semi-coke/retort carbon; dry quench or non-recovery; downstream refining or iron output prediction; default factory inventory from literature"
  required_metadata: "reference qualifiers; supplier flow/process pins; gas/steam/electricity basis; route diagram; complete campaign/stock/source records; all coproduct quantities and allocation; receiving states"
  required_quality_disclosure: "unallocated balances and residuals; analysed water/carbon/sulphur/heat bases; meter/sampling/LOQ/missing data; route-specific exclusions; unresolved identities; price/causal sensitivity; scientific review state"
  update_trigger: "coal/blend/grade or quench/charging change; gas-cleaning chemistry; utility/recipient/provider basis; recovered product gate; allocation market change; new original evidence"
data_sources:
  - id: "jrc-iron-steel-coking-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Iron and Steel Production BREF, 2013, EUR 25521 EN, doi:10.2791/97469; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/IS_Adopted_03_2012.pdf"
    used_for: "Chapter 5 §§5.1.1–5.1.5, printed pp.209–221 (PDF237–249): coal/battery, distinct wet/dry quench, tar/ammonia/light oil and desulphurisation alternatives/water circuits; §§5.2.1–5.2.2 printed pp.225–234 (PDF253–262): source omissions, wastewater/residue and single-plant energy limits. Manufacturing and balance context only, no default amounts."
  - id: "epa-coke-production-2008"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 12.2 Coke Production, May 2008; https://www.epa.gov/sites/default/files/2020-11/documents/c12s02_may08.pdf"
    used_for: "§12.2.1.1–12.2.1.4 and Figures12.2-1–3, pp.12.2-1–6; §12.2.1.5–12.2.2 pp.12.2-7–9: conventional byproduct route, wet quench, ammonium sulphate and petroleum wash-oil/crude light-oil recovery, source/emission separation and non-recovery exclusion. Historical US context, no universal percentages, operating conditions or emission factors."
  - id: "ipcc-energy-fuel-definitions-2006"
    type: "official_guidance"
    reference: "IPCC 2006 Guidelines for National Greenhouse Gas Inventories, Volume 2, Chapter 1, Tables 1.1–1.2; https://www.ipcc-nggip.iges.or.jp/public/2006gl/pdf/2_Volume2/V2_1_Ch1_Introduction.pdf"
    used_for: "Table 1.1, printed p.1.14/PDF14: positive high-temperature coal-carbonisation coke-oven/metallurgical-coke definition. Table 1.2, printed p.1.18/PDF18: confirms the referenced secondary NCV is a statistical default, not a site grade. No default NCV, yield, moisture, carbon content or emission factor is adopted."
