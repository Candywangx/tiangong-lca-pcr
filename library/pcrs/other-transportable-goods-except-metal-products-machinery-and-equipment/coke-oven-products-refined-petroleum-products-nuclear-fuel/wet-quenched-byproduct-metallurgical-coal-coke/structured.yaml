system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "coking_plant"
      rule: "Confirm the actual site route against the cited manufacturing descriptions and a site diagram. Wet quench excludes a dry-quench gas loop and dry-quench recovered steam/electricity credit. Coal pretreatment includes actual crushing/blending/handling; purchased coal washing is upstream unless physically included and separately collected."
      source_ids:
        - jrc-iron-steel-coking-2013
        - epa-coke-production-2008
    - rule_id: boundary_gas
      applies_to: "coking_plant"
      rule: "Include actual gas primary cooling, tar separation, ammonia-sulphate recovery, final cooling, selected wash-oil light-oil recovery and installed absorption/stripping desulphurisation. Keep their measured configuration; BREF alternatives do not license mixing unrelated scrubbers/catalysts. Exclude downstream chemical refining at the outgoing gate."
      source_ids:
        - jrc-iron-steel-coking-2013
        - epa-coke-production-2008
    - rule_id: boundary_interfaces
      applies_to: "coking_plant"
      rule: "The aggregate foreground retains stage measurements and equal internal links for hot coke, raw/clean gas, condensate, flushing/quench liquor, tar residue and lean/rich wash oil. Internal transfers cancel only in the aggregate external-exchange table; do not erase them from the physical process graph or charge a second upstream dataset. Imported versus internally generated heat/gas and flare feed are separately reconciled."
      source_ids:
        - jrc-iron-steel-coking-2013
    - rule_id: boundary_water_emissions
      applies_to: "coking_plant"
      rule: "Collect quench/cooling net make-up, recycle, evaporation, coke water, bleed and recipient returns independently. Include actual abatement and on-site effluent treatment. Treat externally transferred wastewater as a waste exchange; only actual environmental discharge after the selected treatment endpoint is an elementary emission. Document cooling configuration and abnormal bypasses."
      source_ids:
        - jrc-iron-steel-coking-2013
    - rule_id: boundary_upstream
      applies_to: "coking_plant"
      rule: "Link each external input to an applicable upstream dataset with independently verified quantity/supply basis. Include actual start-up, shutdown, flaring, off-spec handling and maintenance in the campaign. Disclose initial capital construction and any separately reported transport; no unsupported infrastructure lifetime or exclusions hidden in a yield factor."
      source_ids:
        - jrc-iron-steel-coking-2013
boundary_abstraction:
  declared_starting_condition: "delivered coking coal and separately metered supplies at the coal-handling inlet; coal washing upstream unless actually included"
  starting_condition_role: "foreground_entry"
  product_classification_scope: "narrower portion of CPC 3.0 33110; physical coal-coke identity governs"
  recursive_input_rule: "purchased same-category coke is a separately weighed external input with its own upstream dataset; internally recycled breeze/dust is an equal physical link, never new production"
  upstream_dataset_requirement: "required for delivered coal, each supply and external waste treatment; verify route, property, water/heat/gas and delivery boundary compatibility"
  disclosure: "site; campaign; charging; coal preprocessing; wet quench; gas-cleaning diagram; utilities; treatment gates; raw and allocated ledgers; missing identities; capital/transport and cut-offs"
