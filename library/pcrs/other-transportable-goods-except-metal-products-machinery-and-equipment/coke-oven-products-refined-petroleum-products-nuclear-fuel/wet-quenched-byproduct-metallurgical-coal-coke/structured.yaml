  what: "Supply coal-derived coke as reducing agent, heat source and permeable burden support for blast-furnace use; this is a declared product unit, not guaranteed iron output"
  how_much: "1 kg accepted net coke at dispatch, as received"
  how_well: "actual specified size distribution, moisture, ash, carbon/sulphur, strength/reactivity and acceptance test basis"
