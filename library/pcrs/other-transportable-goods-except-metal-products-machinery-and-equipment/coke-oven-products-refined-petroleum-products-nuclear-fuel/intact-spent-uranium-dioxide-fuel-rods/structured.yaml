system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary starts with already separated, identifiable intact spent rods and their inherited records. It accounts for receipt/inventory, actual wet-storage auxiliary exchanges and documented plant handover. Separate generation/fuel-origin, earlier assembly/rod preparation, off-site transport, dry storage, laboratory examination and disposal in the stage register. A foreign historical example cannot fill a missing CN stage or supplier inventory (gao-spent-fuel-2005, ornl-full-length-rods-2020)."
      source_ids: []
    - rule_id: whole_element_gate
      applies_to: "all processes"
      rule: "Preserve the complete rod as the physical reference entity. Begin only after documented separate-rod receipt; do not replace an assembly by a rod or import a removal/cutting procedure."
      source_ids:
        - iaea-glossary-2022
        - ornl-full-length-rods-2020
    - rule_id: cn_native_admission
      applies_to: "receipt_rod, spent_rod_handover"
      rule: "Bind this native only to compatible actual CN at-plant delivery and origin. Independently adjudicate its opposing non-irradiated classification; reject any hard conflicting name/state/route/geography. Foreign sources are object/method evidence, never a CN site inventory or provider."
      source_ids:
        - iaea-glossary-2022
        - gao-spent-fuel-2005
        - ornl-full-length-rods-2020
    - rule_id: stage_register
      applies_to: "all processes"
      rule: "Declare completed gates and dates; separate off-site transport and future treatment/disposal. Keep earlier generation and preparation burdens visible without double counting; unknown coverage is a gap, not zero."
      source_ids:
        - iaea-glossary-2022
        - ilcd-allocation-2010
    - rule_id: route_completeness
      applies_to: "rod_wet_storage"
      rule: "Inventory every actual utility, material, secondary waste and source discharge as an atomic exchange. Extend the rows for actual treatment, maintenance, containers and attributable infrastructure; applicable unmeasured modules block a complete dataset."
      source_ids:
        - ilcd-allocation-2010
boundary_abstraction:
  declared_starting_condition: "Already separately inventoried intact irradiated civilian UO2 PWR rods at a declared compatible CN plant receipt gate, with actual history, state, mass/date and inherited burdens"
  starting_condition_role: "Physical spent-element/custody transfer, without assigning a fresh-fuel function, recovery credit or nuclear processing recipe"
  product_classification_scope: "Narrower individual complete spent-element scope within CPC33720; the selected native's CPC33710 contrary metadata remains subject to independent admission"
  recursive_input_rule: "Match each same-category transfer by rod/cohort identity, whole mass, state and dates; retain physical quantities at both ends and cancel only genuine internal transfers on aggregation; later storage does not create a new acceptance cohort"
  upstream_dataset_requirement: "Link only actual compatible site/provider/time/state backgrounds; preserve origin and raw/WIP/accepted-stock burdens and explicit unlinked gaps. Do not double-add generation or management already included elsewhere. No zero upstream burden follows from spent/waste designation."
  disclosure: "CN gate/native admission; actual completed storage interval; opening/closing raw, WIP and accepted stocks; first acceptance versus later increment; inherited burdens; containers, infrastructure and shared utilities; source monitoring coverage; legal custody, missing stages, receiver and nuclear expert approval"
