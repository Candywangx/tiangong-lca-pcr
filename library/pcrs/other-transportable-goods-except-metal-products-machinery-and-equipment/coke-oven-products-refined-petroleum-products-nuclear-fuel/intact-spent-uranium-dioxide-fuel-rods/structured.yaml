allocation_rules:
  - rule_id: direct_assignment
    applies_to: "all processes"
    rule: "Subdivide/directly assign exchanges by actual rod/cohort and interval before allocating shared activity. Preserve each physical transfer and waste stream unallocated in the raw ledger."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: shared_pool_causality
    applies_to: "rod_wet_storage"
    rule: "Allocate each residual shared utility by documented causal service: use recorded attributable energy for thermal load when available; occupancy-time may serve only documented space/time-driven overhead. Mass-times-duration is not a universal proxy for cooling, activity or hazard. Record all served cohorts, drivers, denominator and sensitivity under cp_shared_services; absent a defensible driver, keep raw shared totals and an allocation gap."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: no_recovery_credit
    applies_to: "receipt_rod, spent_rod_handover"
    rule: "No co-product, economic value, avoided fresh fuel or recovery credit follows from this intact spent-rod handover. Any actual co-function requires separate evidence and review; physical radionuclide activity or contained U cannot allocate away custody transfers."
    source_ids:
      - iaea-glossary-2022
      - ilcd-allocation-2010
  - rule_id: inheritance_no_double_count
    applies_to: "all processes"
    rule: "Carry attributable inherited raw/WIP/accepted-stock burdens by cohort, preserving their origin and scope. Do not assign old stock zero burdens or divide only new utility consumption by newly dispatched mass. Later increments retain original accepted Q0 and add only that interval's documented exchanges; do not add the original product/generation inventory again."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Raw/WIP here means an already received eligible whole rod whose identity or gate acceptance is not yet complete; it does not authorize fuel fabrication or processing. Separate exchanges assigned to unfinished raw/WIP, newly accepted output, and later service for opening accepted stock. Carry unfinished-cohort burdens forward; normalize only the burden share attributable to the accepted cohort. Never divide the undivided facility total by new acceptance Q. A shared exchange is assigned once, and both its stock state and original dataset link remain visible."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_rod_identity
      process_id: "rod_receipt"
      flow_role: "Complete incoming rod and mass"
      record_type: "existing operator/manufacturer custody and mass record"
      raw_fields: "public-safe rod/cohort id; UO2 PWR origin; irradiation/permanent-removal evidence; full-length/unpunctured state; integral ends/cladding; net mass and date; record method/uncertainty; external water/container exclusions; CN gate; expert native/classification decision"
      collection_method: "Reconcile existing traceable entire-rod mass/design records to the same actual object, state and gate; retain documented adjustments and uncertainty. Do not prescribe new nuclear handling or a new weighing operation. Aggregation detail: retain raw whole-rod mass by unique identity; normalize attributable receipt totals per 1 kg reference flow using cp_acceptance"
      unit: "kg"
      frequency: "each receipt/state change"
      temporal_coverage: "actual origin and receipt dates"
      site_scope: "actual CN plant and admitted cohort only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "custody/receipt reconciliation; mass source/calibration if existing weighing used; expert state/geography/native admission"
    - protocol_id: cp_acceptance
      process_id: "rod_handover"
      flow_role: "Unique accepted reference output"
      record_type: "acceptance and stock register"
      raw_fields: "identity; first acceptance date/gate; net mass; new dispatch; new closing accepted stock; opening accepted stock; returns/retests; accepted cohort Q0; original dataset link; mode"
      collection_method: "Join acceptance and dispatch/stock records by unique identity and gate; exclude duplicates and previously accepted stocks; verify actual physical object and receiver acceptance. Aggregation detail: Q = unique new accepted dispatch + unique new accepted closing stock, each once; exclude opening accepted stock/returns/retests. Later increment denominator is original accepted Q0."
      unit: "kg"
      frequency: "each acceptance/dispatch and period close"
      temporal_coverage: "same disclosed accounting period; original dates retained for later increments"
      site_scope: "admitted same-state CN cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "unique-id reconciliation; positive denominator; receiver/stock sign-off; origin link and original acceptance quantities"
    - protocol_id: cp_cohort_ledger
      process_id: "rod_receipt"
      flow_role: "Stocks, inherited burdens and state/date transitions"
      record_type: "physical and burden ledger"
      raw_fields: "opening raw/WIP/accepted stocks; receipts; stage movements; dispatch; closing stocks; measured differences; each inherited burden; source datasets/gates; isotope/activity dates; mode"
      collection_method: "Reconcile physical and inherited-burden records for the same cohort, avoiding internal-transfer duplication. Keep isotope/activity accounting separate from whole-rod mass. Aggregation detail: retain opening + receipt = dispatch + closing + evidenced physical differences with uncertainty; carry attributable inherited raw/WIP/accepted-stock burdens; normalize per 1 kg reference flow with the same Q or Q0"
      unit: "kg and separately declared original burden/activity units"
      frequency: "each transition and period close"
      temporal_coverage: "continuous actual cohort history and selected interval"
      site_scope: "same CN plant and actual upstream stage links"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock bridge, documented difference/uncertainty, stage overlap check and unreconciled-item log"
    - protocol_id: cp_storage_utilities
      process_id: "rod_wet_storage"
      flow_role: "Electricity and makeup water"
      record_type: "meters, supplier records and invoices"
      raw_fields: "each meter/flow id; actual supply voltage/route/CN provider; original unit; readings; interval; net makeup; density/state if volume; attribution driver; cohort denominator"
      collection_method: "Reconcile actual auxiliary meters and supplier records, subtract verified unrelated loads, preserve net water makeup separately from recirculation and link compatible backgrounds. Aggregation detail: attributable exchange totals divided by same Q or Q0 per 1 kg reference flow; preserve raw totals and conversions"
      unit: "MJ; kg, retained separately"
      frequency: "each available meter interval and period close"
      temporal_coverage: "actual wet-storage interval"
      site_scope: "actual CN plant; electricity UUID only for compatible 35–330 kV customer grid supply"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter/record uncertainty, supply compatibility, purchase reconciliation, missing-interval evidence"
    - protocol_id: cp_shared_services
      process_id: "rod_wet_storage"
      flow_role: "Shared storage services"
      record_type: "causal attribution workbook"
      raw_fields: "each exchange total; all served cohorts; measured energy or evidenced driver; actual time intervals; occupancy record; denominator; assigned shares; sensitivity"
      collection_method: "Directly assign first; document a physically causal driver for each remaining exchange and reconcile all shares to its total. Do not derive thermal load or hazard from rod mass/activity by assumption. Aggregation detail: attributable share = exchange total times evidenced cohort driver / all-user driver total; then normalize per 1 kg reference flow with Q or Q0"
      unit: "original exchange unit; actual driver unit and time"
      frequency: "each driver interval and period close"
      temporal_coverage: "all actual overlap intervals"
      site_scope: "all users of the same shared system, including out-of-scope users"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "complete user coverage, driver evidence, shares sum to one, sensitivity and expert review"
    - protocol_id: cp_secondary_waste
      process_id: "rod_wet_storage"
      flow_role: "Resin, whole filter and liquid purge"
      record_type: "waste transfer and receiver records"
      raw_fields: "separate stream id; chemistry/whole-object basis; retained water; mass; activity/species/date; custody; actual receiver/process; treatment boundary"
      collection_method: "Reconcile each entire stream to existing site waste and receiver records. Retain physical whole mass separately from contained nuclide activities; verify native flow and receiver before linking a background. Aggregation detail: assign each stream by actual origin/cohort; raw total and stock bridge retained; divide attributable mass by same Q or Q0 per 1 kg reference flow"
      unit: "kg; separate original activity units"
      frequency: "each transfer and period close"
      temporal_coverage: "same actual storage interval"
      site_scope: "actual site and each receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stream-specific identity/state, receipt, measurement basis/uncertainty and unresolved-background disclosure"
    - protocol_id: cp_source_releases
      process_id: "rod_wet_storage"
      flow_role: "Each nuclide and receptor exchange"
      record_type: "authorized environmental source-monitor records"
      raw_fields: "nuclide; chemical form if known; medium/subcompartment; measured activity; unit; collection interval; activity reference date; method; detection limit; uncertainty; source attribution"
      collection_method: "Read existing authorized source-release inventory and analytical metadata; distinguish source discharges from ambient concentrations, stored activity and waste transfers. Preserve unmeasured/non-detect coverage explicitly. Aggregation detail: sum compatible activity records only, attribute actual source share and divide by same Q or Q0 per 1 kg reference flow; no default decay adjustment or activity-to-mass conversion"
      unit: "kBq"
      frequency: "each reported interval and period close"
      temporal_coverage: "actual source-monitor interval and reference dates"
      site_scope: "actual source serving the admitted cohort; exact receptor match"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source report, laboratory/method evidence, detection limits, nuclide/media/date coverage and uncertain attribution"
  calculation_rules:
    - id: unique_acceptance
      applies_to: "spent_rod_handover"
      rule: "Q is the sum of net mass over the union of newly first-accepted dispatched rods and newly first-accepted closing accepted-stock rods; include each identity once. Opening accepted stock, returns and retests contribute no new acceptance. Missing/zero Q prohibits normalization."
      inputs:
        - cp_acceptance
        - cp_rod_identity
      output: "Q in kg and identity audit"
      source_ids:
        - iaea-glossary-2022
        - gao-spent-fuel-2005
    - id: ledger_normalization
      applies_to: "all inventory rows"
      rule: "For burden-bearing exchanges, first-acceptance normalized amount = the interval exchange share attributable to the newly accepted cohort plus that cohort's applicable inherited burden, divided by Q. Carry unfinished-cohort burdens forward and assign opening accepted-stock later service separately. Physical transfer rows retain their actual stock-reconciled whole masses without a second addition of inherited transfer quantities; the reference output remains 1 kg. Preserve every term, unit, origin and stock state."
      inputs:
        - cp_cohort_ledger
        - cp_acceptance
        - "each row protocol"
      output: "exchange per 1 kg reference flow"
      source_ids:
        - ilcd-allocation-2010
    - id: subsequent_storage
      applies_to: "all inventory rows"
      rule: "Later normalized increment = exchanges attributable to that same original accepted cohort during the declared later interval divided by original Q0; keep Q0, original acceptance record and interval. No newly dispatched/returned rod creates new product acceptance and no original burden is added again."
      inputs:
        - "original accepted Q0"
        - cp_acceptance
        - cp_cohort_ledger
        - "each row protocol"
      output: "incremental exchange per 1 kg original reference flow, with dates"
      source_ids:
        - ilcd-allocation-2010
    - id: shared_attribution
      applies_to: "storage_electricity, pool_makeup_water"
      rule: "After direct assignment, allocated exchange = residual actual shared exchange times evidenced cohort-specific causal driver divided by the driver total for all served cohorts. Use different justified drivers where causality differs; preserve unresolved allocation instead of guessing."
      inputs:
        - cp_shared_services
        - cp_storage_utilities
      output: "attributable raw exchange in its original unit"
      source_ids:
        - ilcd-allocation-2010
    - id: recorded_unit_conversion
      applies_to: "storage_electricity, tritium_air, tritium_freshwater, carbon14_air, cesium137_freshwater"
      rule: "Compatible electricity MJ = recorded kWh times 3.6; kBq = recorded Bq / 1000. Preserve original unit and scope; neither formula converts activity to mass or invents a physical emission."
      inputs:
        - cp_storage_utilities
        - cp_source_releases
      output: "compatible unit-correct exchange"
      source_ids: []
    - id: physical_nuclide_ledgers
      applies_to: "receipt_rod, spent_rod_handover"
      rule: "Reconcile whole-rod/element physical ledgers with evidenced losses and measurement uncertainty. Maintain each nuclide quantity/activity in a distinct date-resolved ledger; decay or species change requires actual supported study evidence and is not a mass-balance residual. Balance only genuinely conserved quantities; do not impose chemical-element or isotope conservation where actual supported nuclear change alters identity. Never force nuclide activity conservation or invent a half-life/conversion."
      inputs:
        - cp_rod_identity
        - cp_cohort_ledger
        - cp_source_releases
      output: "separate physical and nuclide/date reconciliations"
      source_ids:
        - iaea-glossary-2022
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Lock Q to unique independently measured first-acceptance events. Use the two-term dispatch/closing-stock bridge only when L_new is zero; otherwise reconcile disjoint D_new, F_new_close and actual post-acceptance net exits L_new on the original acceptance basis. Retain original event Q for later losses/services and prevent internal/return/rework throughput duplication. Do not add Q as an extra external output. Unresolved event/stock evidence blocks complete normalization."
      inputs:
        - "original acceptance events"
        - "net parcel-state bridge"
        - "original cohort quantities"
      output: "auditable positive event Q and separate physical stock bridge"
      source_ids: []
  data_quality_requirements:
    - id: dq_native_admission
      applies_to: "reference and received rods"
      requirement: "Actual compatible CN at-plant/power-generation origin, full-object state and independent disposition of serious native CPC33710 contrary metadata; no hard field overridden. No compatible provider/process background is implied by flow identity."
      evidence: "cp_rod_identity; full native/admission record; actual plant/receiver records"
    - id: dq_whole_object
      applies_to: "all rod records"
      requirement: "Trace the same full-length intact unpunctured UO2 PWR rod, cladding and integral ends, with mass/date/uncertainty. State change to a breached/cut/damaged rod or fragment exits this category."
      evidence: "identity/custody/state records; iaea-glossary-2022; ornl-full-length-rods-2020"
    - id: dq_denominator
      applies_to: "all normalized records"
      requirement: "Positive unique first-acceptance Q or independently traceable original-cohort Q0; opening stocks, dispatch, returns/retests and raw/WIP burdens reconciled; no normalization when denominator is unavailable."
      evidence: "cp_acceptance; cp_cohort_ledger"
    - id: dq_temporal_species
      applies_to: "stored inventory, releases and waste"
      requirement: "Actual nuclide/activity reference dates, unit, species/medium and uncertainty; no shared default decay date or mass/activity substitution."
      evidence: "actual analytical and source records; cp_source_releases"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Actual CN site utilities, materials, shared services, secondary wastes, releases, containers/maintenance and attributable infrastructure addressed separately; no absent measurement treated as absent flow. Historical foreign cases are not quantitative backgrounds."
      evidence: "complete stage/flow coverage register; cp_storage_utilities; cp_secondary_waste; cp_source_releases"
    - id: dq_ranges
      applies_to: "all variable exchanges"
      requirement: "Retain actual collection and unresolved range evidence needs. Foreign historical object cases/definitions do not establish CN plant inventory ranges, rod mass, storage duration, decay factors or release rates."
      evidence: "site measurement coverage and uncertainty; source applicability record"
    - id: dq_expert_scope
      applies_to: "complete study"
      requirement: "Nuclear experts approve actual state/custody/site and reference compatibility; LCA reviewer approves scope, inheritance, allocation and background links. These do not replace legal/operating/safety authorization."
      evidence: "named expert/reviewer decisions and actual scope, with unresolved issues disclosed"
validation_rules:
  - rule_id: validate_reference_object
    applies_to: "receipt_rod, spent_rod_handover"
    rule: "Reject whole-assembly, fresh-fuel, contained-U, fragment, breached/cut/damaged rod, non-UO2/non-PWR or service-output substitutions. Require entire rod/cladding/ends, actual spent state and permanent-removal evidence."
    source_ids:
      - iaea-glossary-2022
      - ornl-full-length-rods-2020
  - rule_id: validate_native_geography
    applies_to: "reference binding"
    rule: "Require compatible actual CN at-plant origin/delivery and independent expert decision on contrary native CPC33710 classification. Any unresolved hard conflict or non-CN provider fails admission; US/IAEA principles cannot supply missing CN site facts."
    source_ids:
      - gao-spent-fuel-2005
      - ornl-full-length-rods-2020
  - rule_id: validate_acceptance_stock
    applies_to: "all inventory rows"
    rule: "Verify unique first-acceptance dispatch plus closing accepted stock, with opening stock/return/retest exclusion, inherited raw/WIP/accepted burdens and raw stock bridge. Verify original Q0 for later intervals; retain raw quantities and fail normalized reporting for missing/zero basis."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_species_units
    applies_to: "storage and releases"
    rule: "Keep whole mass, conserved element quantities, stored nuclide/activity and source releases separate; verify actual dates, receptor and units. Reject invented decay factors, per-rod masses and activity-to-mass conversions."
    source_ids:
      - iaea-glossary-2022
  - rule_id: validate_inventory_coverage
    applies_to: "all processes"
    rule: "Require atomic actual flows, correct selected property/unit, protocols, allocation evidence and compatible provider/background. Unresolved secondary-waste identities or applicable unmeasured modules remain gaps; non-detects and incomplete monitoring do not prove zero."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_claim_limits
    applies_to: "complete dataset"
    rule: "Declare the actual completed CN gate/interval, review limitations and unlinked stages. Do not claim operating/safety approval, complete fuel-cycle results, foreign case equivalence, final disposal or methodology approval from this inventory check."
    source_ids:
      - iaea-glossary-2022
      - gao-spent-fuel-2005
published_dataset_profile:
  dataset_role: "Site-specific physical spent-element stage inventory; separately identified subsequent storage increment retains original accepted cohort"
  downstream_use: "secondary_dataset; background_dataset only for independently admitted compatible site/state/time/gate scope"
  allowed_use: "Environmental inventory linkage for actual compatible CN plant intact individual UO2 PWR spent rods, with expert native/geography admission, whole-rod basis and declared completed interval"
  excluded_use: "Fresh fuel, whole assemblies, other fuel/reactor types, non-CN native/provider substitution, nuclear operation/design/safety instructions, recovery credits, destructive examination, uncompleted transport/disposal, or full fuel-cycle claims without all linked stages"
  required_metadata: "Actual CN plant/gate and receiver; native contrary-classification/expert decision; rod/cohort state and net mass evidence; irradiation/permanent-removal and activity dates; actual interval; first-acceptance Q or original Q0; opening/closing raw/WIP/accepted stocks and inherited burdens; source units/uncertainties; legal designation; provider/background/stage links"
  required_quality_disclosure: "Scientific/site/native qualification; independent review state; actual monitoring and allocation coverage; unresolved stream identities/ranges/backgrounds; mass/isotope/date uncertainty; omitted stages and infrastructure; no quantitative transfer from foreign cases"
  update_trigger: "Native hard-field/admission or classification change; site/geography/provider change; fuel/state or whole-object change; acceptance/cohort ledger correction; revised monitoring/analytical evidence; actual interval/boundary or allocation change"
data_sources:
  - id: "iaea-glossary-2022"
    type: "official_guidance"
    reference: "IAEA Nuclear Safety and Security Glossary, 2022 (Interim) Edition, downloaded PDF pp.99 and212, printed pp.90 and203; https://www-pub.iaea.org/MTCD/Publications/PDF/IAEA-NSS-GLOweb.pdf"
    used_for: "Complete element versus assembly; spent-state and management-stage terminology. No operating, safety, duration, geometry or decay default."
  - id: "gao-spent-fuel-2005"
    type: "official_guidance"
    reference: "GAO-05-339, April2005, printed pp.1–2, official Government Publishing Office original: https://www.govinfo.gov/content/pkg/GAOREPORTS-GAO-05-339/pdf/GAOREPORTS-GAO-05-339.pdf"
    used_for: "Historical independent evidence of separately inventoried/stored spent rods and distinction from fragments. Not current regulation or a Chinese inventory."
  - id: "ornl-full-length-rods-2020"
    type: "literature"
    reference: "ORNL/LTR-2020/8, March2020, introduction and section3, printed pp.1,3; https://info.ornl.gov/sites/publications/Files/Pub138356.pdf"
    used_for: "Historical receipt and onward handover of unpunctured full-length spent PWR rods; physical object/gate evidence only. No testing/reprocessing recipes, operating parameters or CN factors adopted."
  - id: "wco-spent-elements-2022"
    type: "standard"
    reference: "WCO Harmonized System Nomenclature2022, Chapter28, subheading2844.50, PDFp.11; https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0628_2022e.pdf?la=en"
    used_for: "Spent fuel elements distinguished from radioactive residues; classification wording only, not proof of rod/native applicability or a CPC3 mapping."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA, Detailed guidance, first edition March2010, section7.9.3, printed pp.257–258; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Direct assignment/virtual subdivision and flow-specific determining physical causality, including time-dependent services. Does not prescribe a nuclear storage driver or numeric factor."
