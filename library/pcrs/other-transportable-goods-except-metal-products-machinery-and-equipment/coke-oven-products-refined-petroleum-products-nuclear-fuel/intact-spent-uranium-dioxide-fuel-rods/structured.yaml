measurement_rules:
  - id: whole_rod_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_rod_identity traceable mass records for the same entire rod, including cladding/integral ends and excluding pool water, separate containers and cask. A documented design/pre-irradiation record needs compatible scope, actual adjustment evidence and uncertainty. Do not prescribe new handling/weighing, invent rod mass or substitute uranium/heavy-metal/pellet mass."
  - id: accepted_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "per 1 kg reference flow"
    rule: "Use cp_acceptance and cp_cohort_ledger. First-acceptance Q is unique newly accepted dispatch plus unique newly accepted closing finished stock, each once; exclude opening accepted stock, returns and retests. A later storage increment uses the same original accepted cohort Q0 and actual increment, without fresh acceptance. Missing/zero denominators retain raw totals and prohibit a normalized result."
  - id: activity_identity
    applies_to: "tritium_air, tritium_freshwater, carbon14_air, cesium137_freshwater"
    required_property_ref:
      name: "Radioactivity"
      uuid: "93a60a56-a3c8-17da-a746-0800200c9a66"
    required_unit: "kBq"
    rule: "Preserve nuclide, species/form where known, compartment, interval and activity reference date. Bq/1000 gives kBq. Stored activity is not an emitted exchange; activity, mass and dose are different quantities. No activity-to-mass or default decay conversion is allowed."
  - id: electricity_identity
    applies_to: "storage_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "This native electricity reference is MJ. Convert compatible recorded kWh by multiplying by 3.6; preserve the CN 35–330 kV customer-side grid supply condition. Other voltage, self-generation or supplier routes require their own verified row/background rather than reuse by UUID."
  - id: water_identity
    applies_to: "pool_makeup_water, pool_water_purge"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use actual net purchased makeup and actual whole liquid purge separately. Circulated pool volume is not net makeup; volume-to-mass needs recorded density/state. Nuclide activity in a purge does not equal purge solution mass or an environmental release."
