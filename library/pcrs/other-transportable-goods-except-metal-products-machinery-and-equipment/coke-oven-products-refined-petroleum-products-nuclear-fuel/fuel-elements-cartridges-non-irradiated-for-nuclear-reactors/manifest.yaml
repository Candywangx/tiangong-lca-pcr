review_metadata:
  authoring_decision: promote_legacy; pending independent controller acceptance
  scope_decision: Only complete fresh civilian UO2 PWR assembly from purchased sealed rods and finished structural components; exclude material preparation and other fuels. CPC33710 proposed narrower, not accepted mapping. Adjacent33720 is irradiated and excluded.
  scientific_review: Independent identity, bilingual and accounting review completed for archival preparation; scientific methodology acceptance remains pending. Candidate/authored_methodology and zh-CN aligned; no active/publication approval.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  identity_metadata_debts:
    - uuid: bc68ae27-dcc2-4716-aa92-264c1f7e7308
      issue: Chinese generalComment says fuel pellet. English full baseName, manufactured finished-product route, mass property and independent complete-PWR-assembly evidence support conditional complete fuel-element identity; capsules, pellets and pure uranium excluded. Official Chinese baseName preserved; source-owner correction remains pending.
    - uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
      issue: CPC29220 classification mismatch; PE name/CAS9002-88-4/comment agree on film. Actual PE supplier/grade basis required.
    - uuid: 08a91e70-3ddc-11dd-9c44-0050c2490048
      issue: Official Chinese uranium-238 name is 铀α; restrict to English isotope identity, never total alpha. Generic elemental uranium CAS is not an isotope assay.
    - uuid: 4d9a8790-3ddd-11dd-8db4-0050c2490048
      issue: Same uranium-238 Chinese label debt for freshwater record.
  provider_compatibility: UUID identity is separate from actual supplier environmental qualification. Whole accepted assembly net mass includes all retained components and excludes packaging. Rod composition/isotope/state require actual lot certificates, never CPC inference; Zircaloy material identity requires evidenced actual grade and complete component manufacture/delivery background; electricity CN user-side grid-average 1–35 kV with matching time/geography; supplied water has no certified grade from its generic UUID. No invented grade, quantity, lifetime, yield, recipe or release.
  unresolved_flow_uuids:
    - row_id: in_steel_end
      selected_flow: Stainless-steel assembly end fitting
      reason: Tube/pipe fittings and primary steel do not identify a delivered finished assembly end fitting; actual alloy, finished-component scope and provider denominator remain unresolved.
    - row_id: in_cradle
      selected_flow: Wooden transport cradle
      reason: Generic wood/pallet stock does not establish the actual finished transport cradle, treatment and moisture state; obtain exact delivered-component identity.
    - row_id: in_container
      selected_flow: Reusable steel fuel transport container
      reason: Generic steel can/material does not establish a reusable fuel transport container; qualify actual container identity, full acquisitions/return/fleet ledger and separate service basis.
    - row_id: out_cradle
      selected_flow: Wooden transport cradle delivered with assembly
      reason: Pair to actual incoming cradle identity and condition; no compatible delivered wooden transport cradle identity confirmed, and environmental shares cannot scale its physical output.
    - row_id: waste_zr
      selected_flow: Rejected uncontaminated zirconium-alloy grid
      reason: Zirconium metal or generic alloy is not a characterized outgoing rejected grid waste; exact alloy, uncontaminated state and actual receiver route remain unresolved.
    - row_id: waste_steel
      selected_flow: Rejected uncontaminated stainless-steel end fitting
      reason: Stamping/bending offcuts and casting/forging scrap have incompatible generation routes; no characterized rejected finished end-fitting waste identity confirmed.
    - row_id: waste_pe
      selected_flow: Untreated waste polyethylene protective film
      reason: Cleaned mechanical-recycling PE feed is incompatible with untreated outgoing protective film; actual contamination state and receiving route need an identity.
    - row_id: waste_wipe
      selected_flow: Uranium-contaminated cellulose cleaning wipe
      reason: Generic cellulose and unspecified radioactive waste do not identify uranium-contaminated finished cellulose wipe including moisture and actual contamination; need characterized outgoing waste identity.
    - row_id: wastewater
      selected_flow: Untreated assembly-hardware cleaning wastewater
      reason: Direct environmental water discharge and electrolytic-manganese washwater are incompatible with untreated assembly-hardware wastewater sent off site; actual composition and receiver route need an identity.
    - row_id: in_nickel_spring
      selected_flow: Nickel-alloy assembly spring
      reason: Nickel profile and ferronickel are not finished assembly springs; exact actual alloy/grade and delivered component manufacturing scope remain unresolved.
    - row_id: in_wipe
      selected_flow: Cellulose cleaning wipe
      reason: Bare cellulose, pulp and tissue/toilet-paper stock do not establish actual finished cleaning wipe composition, moisture and delivered state.
    - row_id: waste_rods
      selected_flow: Unopened rejected UO2 sealed fuel rod
      reason: Tailings, spent/high-radioactive waste or generic nuclear waste do not identify an unopened fresh rejected sealed rod; complete rod state, activity record and receiver route need a waste identity.
  release_scope: Six isotope-specific air-unspecified/freshwater conditional flows plus separate freshwater carrier-water row, no positive emission assumption. Additional actually monitored chemicals/nuclides need separate atomic identities and records; no zero claim from missing monitoring.
  accounting_contract: Full physical/stock/paired return and maintenance accounts separate from service use and allocated environmental inventory. Total mass/elements have no reaction source/sink; species may have evidenced formation/consumption. Net H2O volume excludes solutes/suspended matter; isotope kBq require individual qualified detector/assay and UTC Z reference date; physical particle/chemical and isotope records linked without duplicate characterization.
