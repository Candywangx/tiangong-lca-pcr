allocation_rules:
  - rule_id: allocation_physical
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide by same-model campaigns and retain full physical mass, water, metal/heavy-metal and packaging-reuse accounts. Never multiply physical co-product outputs by allocation shares. No generic yield, recipe or scrap fraction."
    source_ids:
      - iaea-ssr4-2017
  - rule_id: allocation_burdens
    applies_to: "foreground_burden_allocation"
    rule: "Prefer separately metered stages/campaigns; attribute shared energy using actual causal metering evidence and demonstrate shares sum to one. Unknown causal relationships remain disclosed, without default allocation of every burden by heavy-metal mass. Rejected items, wastes and packaging receive no automatic substitution credit; do not reallocate an already allocated supplier background."
    source_ids:
      - iaea-ssr4-2017
  - rule_id: allocation_services
    applies_to: "foreground_burden_allocation"
    rule: "Preserve full physical packaging/container acquisitions, circulation, retirement, maintenance and stocks independently of service use. Attribute only environmental burdens using evidenced service pools and provider denominators; no assumed lifetime or rotation count, and no duplicated manufacture already included in a service."
    source_ids:
      - iaea-ssr4-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "assembly"
      flow_role: "reference product"
      record_type: "weighing"
      raw_fields: "model; supplier; lot; serial; net accepted mass; fuel-compound mass; elemental heavy-metal mass; cladding mass; support-metal mass by material; moisture; package tare"
      collection_method: "Calibrated weighing or traceable accepted complete-assembly net-mass records; reconcile supplier certified mass accounts; accepted net-mass total; all exchanges per 1 kg reference flow"
      unit: "kg"
      frequency: "each accepted lot"
      temporal_coverage: "whole declared campaign"
      site_scope: "complete accepted assembly at gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; supplier certificate"
    - protocol_id: cp_material
      process_id: "assembly"
      flow_role: "purchased rods and structural components; returned rods"
      record_type: "supplier and stock records"
      raw_fields: "SKU; sealed status; lot; gross receipts; installed mass; supplier returns; opening/closing stock; each support component; provider denominator"
      collection_method: "Weigh or reconcile actual certified supplier net-mass records by delivered identity and lot; same-period physical and stock reconciliation; per 1 kg reference flow"
      unit: "kg"
      frequency: "each receipt and campaign closure"
      temporal_coverage: "same campaign"
      site_scope: "assembly inputs, returns and stocks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier BOM; invoices; delivery/return receipts; provider scope"
    - protocol_id: cp_energy
      process_id: "assembly"
      flow_role: "electricity"
      record_type: "meter log"
      raw_fields: "stage; interval; voltage; meter reading; utility sharing evidence; provider; reference quantity"
      collection_method: "Read calibrated meters and verify complete assembly/support-services coverage; attributable same-period electricity per 1 kg reference flow"
      unit: "MJ"
      frequency: "each metered interval"
      temporal_coverage: "same campaign"
      site_scope: "assembly and attributable utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; provider voltage/region/time; causal allocation record"
    - protocol_id: cp_water
      process_id: "assembly"
      flow_role: "cleaning water and wastewater"
      record_type: "meter and discharge records"
      raw_fields: "source; treatment; water mass; density if volume meter; wastewater mass; contaminants; stock/reuse; receiver"
      collection_method: "Meter or weigh water and wastewater separately; verify actual treatment/receiver; retain water balance; same-period water/wastewater per 1 kg reference flow"
      unit: "kg"
      frequency: "each metered interval and transfer"
      temporal_coverage: "same campaign"
      site_scope: "cleaning and auxiliary boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; density measurement; sample and receiver records"
    - protocol_id: cp_pack
      process_id: "assembly"
      flow_role: "packaging input/output and container fleet"
      record_type: "weighing and reuse ledger"
      raw_fields: "material; grade; moisture; incoming/outgoing single-use mass; container serial; full new/replacement acquisitions; dispatch/return/retirement mass; opening/closing fleet stock; maintenance inputs and wastes; service use; provider denominator; environmental allocation shares"
      collection_method: "Weigh full packaging and container physical exchanges; pair dispatch/return records; reconcile fleet stocks; keep service use and manufacture/maintenance environmental attribution separate, without assumed life; per 1 kg reference flow"
      unit: "kg"
      frequency: "each delivery and campaign closure"
      temporal_coverage: "same campaign"
      site_scope: "packaging and fleet interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare; supplier; delivery/return and fleet records; service allocation evidence"
    - protocol_id: cp_waste
      process_id: "assembly"
      flow_role: "each waste identity"
      record_type: "transfer record"
      raw_fields: "mass; material; moisture; isotope-resolved activity; contamination; storage change; receiver; destination"
      collection_method: "Characterize and weigh each segregated waste; retain authorized receiving evidence; same-period transferred waste per 1 kg reference flow; stock separately"
      unit: "kg"
      frequency: "each transfer and stock closure"
      temporal_coverage: "same campaign"
      site_scope: "assembly waste-management interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; laboratory; waste transfer and stock records"
    - protocol_id: cp_release
      process_id: "assembly"
      flow_role: "each nuclide and medium"
      record_type: "monitoring"
      raw_fields: "isotope; detector/assay report; calibration; sampling location; medium/submedium; isotope activity concentration; matching gas/liquid discharge quantity; sampling interval; activity reference date UTC Z; control stage; background; detection limit; isotope-specific uncertainty; linked physical particle/chemical record"
      collection_method: "Use qualified isotope-resolved assay and monitoring records; integrate post-control isotope concentration with matched measured discharge quantity on the same reference-date basis; retain non-detect uncertainty and coverage; link physical releases without duplicate impact contribution; per 1 kg reference flow"
      unit: "kBq"
      frequency: "site monitoring programme intervals"
      temporal_coverage: "same campaign"
      site_scope: "actual outdoor-air or freshwater release point"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "detector and laboratory QA; calibration; sampling; reference-date and monitoring coverage records"
    - protocol_id: cp_water_release
      process_id: "assembly"
      flow_role: "net H2O portion of freshwater liquid release"
      record_type: "discharge meter and composition record"
      raw_fields: "whole-liquid mass/volume; H2O mass; independently evidenced composition; water density and conditions; net H2O volume basis; receiving freshwater; meter interval; post-control stage; isotope/chemical sample coverage; event links"
      collection_method: "Measure whole discharge and independently establish its net H2O portion on a compatible density/volume basis; keep every solute/suspended constituent and isotope activity separate with matched intervals; per 1 kg reference flow"
      unit: "m3"
      frequency: "each discharge interval"
      temporal_coverage: "same campaign"
      site_scope: "direct freshwater outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; composition and density evidence; receiver and sample records"
  calculation_rules:
    - id: campaign_basis
      applies_to: "all inventory rows"
      rule: "Divide full measured physical exchange totals and separately evidenced service attribution for the same period by accepted assembly net-mass total in cp_mass; out_assembly is fixed at 1 kg; never divide by count."
      inputs:
        - cp_mass
        - cp_material
        - cp_energy
        - cp_water
        - cp_pack
        - cp_waste
        - cp_release
        - cp_water_release
      output: "Atomic exchange amount per 1 kg reference flow"
      source_ids:
        - iaea-ssr4-2017
  data_quality_requirements:
    - id: complete_provider
      applies_to: "upstream and reference"
      requirement: "Preserve physical identity, completeness, actual provider quantity/environmental denominator, time, geography and allocation; missing items are not zero and a UUID does not establish complete background."
      evidence: "Original provider environmental data and acceptance certificates"
    - id: environmental_coverage
      applies_to: "all exchanges"
      requirement: "Include every actual BOM material and consumed utility; additional actual flows need individually verified atomic identities. No supplied-solution default; if actually used, account separately for each component, active matter and carrier water and add atomic cards. Missing monitoring is not zero release; disclose uncovered nuclides/chemicals."
      evidence: "Actual invoices, campaign records, discharge and waste survey"
validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm complete non-irradiated civilian UO2 PWR assembly, distinct rod identity and provider start/end states; exclude the other fuels above; finished identity cannot represent rods or pellets."
    source_ids:
      - framatome-htp
      - iaea-ssr4-2017
  - rule_id: validate_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Same-period, same-model net-mass denominator applies across bilingual reference, inventory, collection and calculation; reconcile full physical/water/heavy-metal/support-metal and packaging accounts before environmental attribution; allocated mass is not physical output."
    source_ids:
      - iaea-ssr4-2017
  - rule_id: validate_releases
    applies_to: "foreground_dataset_conformance"
    rule: "Check each nuclide, medium, unit and detection coverage; never sum total alpha/total uranium with their isotope components; nuclides in off-site wastewater/solid waste are not direct releases here; retain every evidenced emission. Report absent monitoring coverage, detection limits or unresolved identities."
    source_ids:
      - iaea-ssr4-2017
  - rule_id: validate_metrology
    applies_to: "foreground_dataset_conformance"
    rule: "Require isotope-specific detector/assay evidence, calibration, uncertainty and UTC Z activity reference date for kBq. Link physical chemical/particle mass and radioactivity without duplicate characterization; particle fundamental quantities must match the model. Net H2O Volume/m3 is not whole-liquid volume. Total mass and element balances have no reaction source/sink; species formation/consumption is a separate evidenced account. A permit limit is not an actual release."
    source_ids:
      - iaea-ssr4-2017
published_dataset_profile:
  dataset_role: "Public assembly/delivery environmental foreground dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Civilian environmental LCA with matching physical and provider denominators"
  excluded_use: "Nuclear-material preparation, design/optimization, key-parameter inference, radiological safety/licensing decisions or full-fuel-cycle claims"
  required_metadata: "Section 3 qualifiers, denominator, provider backgrounds, stage coverage and attribution"
  required_quality_disclosure: "Identity metadata defects, missing provider/nuclide monitoring/actual materials, detection limits, uncertainty and unresolved items"
  update_trigger: "Changes in SKU, provider, delivery state, material, utilities, monitoring or quantity basis"
data_sources:
  - id: "iaea-ssr4-2017"
    type: "official_guidance"
    reference: "IAEA, Safety of Nuclear Fuel Cycle Facilities, SSR-4 (2017), 1.8 (printed 3/PDF23), 9.102–9.108 (printed 110–111/PDF130–131); https://www-pub.iaea.org/MTCD/Publications/PDF/PUB1791_web.pdf"
    used_for: "Nuclear-facility scope and environmental record categories. No LCI factors, recipes, permit limits or quantity defaults. Denominator, physical/species/service accounts and metrology requirements are authored PCR collection rules."
  - id: "framatome-htp"
    type: "handbook"
    reference: "Framatome, PWR Fuel Assembly HTP, A0529, manufacturer original; https://www.framatome.com/solutions-portfolio/portfolio/product/A0529/pwr-fuel-assembly-htp; HTP product sheet PS_US_328_ENG_05_18, pages 1–2; https://www.framatome.com/solutions-portfolio//app/uploads/2025/09/a0529-p-us-g-en-328-05-18-htp.pdf"
    used_for: "Example of civilian PWR complete-assembly and zirconium-alloy-cladding category. One manufacturer; no generic mass, energy, recipe or design requirement."
