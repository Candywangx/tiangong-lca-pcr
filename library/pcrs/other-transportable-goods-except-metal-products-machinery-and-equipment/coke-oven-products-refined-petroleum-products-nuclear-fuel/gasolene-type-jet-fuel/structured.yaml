allocation_rules:
  - rule_id: allocation_direct
    applies_to: "terminal batches"
    rule: "Use measured stage/batch records first. Attribute shared electricity, water and consumables through a site-supported driver such as metered pumping energy or equipment operating time; demonstrate the relation and disclose other serviced loads; no default shares."
    source_ids:
      - ref-bref-2015
  - rule_id: allocation_refinery
    applies_to: "component providers"
    rule: "Each component provider supplies actual multi-product refinery units, allocation policy, causal evidence, same-period outputs/prices if used and factor reconciliation. Retain all gas/liquid/solid products and water/carbon/sulfur/energy interfaces with the unallocated ledger. An unsupported provider remains a linkage gap; product specifications cannot reconstruct it."
    source_ids:
      - ref-bref-2015
      - ap42-refining-2015
  - rule_id: allocation_physical
    applies_to: "all balances"
    rule: "Keep allocated environmental burdens separate from the physical process diagram. Do not multiply actual co-product output, internal transfer or rework quantities by allocation shares. A waste does not become a co-product merely because it has heating value; actual sale and acceptance conditions must support the change. Economic allocation, if justified after considering subdivision and physical causation, retains same-period net quantities, actual prices, currency, price date/basis, transport/tax treatment and sensitivity. Monetary value is not a mass or energy conversion."
    source_ids:
      - ref-bref-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "terminal_manufacture"
      flow_role: "component/water/cartridge"
      record_type: "foreground_record"
      raw_fields: "batch_id; supplier; material; grade; mass; volume; temperature; pressure; density; sample_id; composition; H2O; source_document; provider_process_id; provider_version; native_reference_amount; native_property_unit; conversion; scaled_amount; opening_inventory; closing_inventory; returns"
      collection_method: "Calibrated mass meter/scale; tank-volume and same-batch density reconciliation; qualified certificates"
      unit: "kg"
      frequency: "Each batch/transfer and period closure"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All covered terminal stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; certificates"
    - protocol_id: cp_additive
      process_id: "terminal_manufacture"
      flow_role: "additive dosing"
      record_type: "foreground_record"
      raw_fields: "batch_id; additive SKU; composition; carrier; purity; dose; cumulative carry-over; recipe; meter; whole_formulation_mass; active_mass; carrier_mass; container_tare; volume_temperature; supplier_source; native_and_scaled_amounts"
      collection_method: "Supplier certificate, issue weighing and matched fuel/additive transfer records; whole supplied formulation enters once, including carrier, while active ingredient is an analytical subledger and not a second exchange"
      unit: "kg"
      frequency: "Each batch/transfer and period closure"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All covered terminal stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier qualification; batch dose reconciliation"
    - protocol_id: cp_energy
      process_id: "terminal_manufacture"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "meter_id; kWh; stage; batch; voltage; period; supplier; driver; non-scope use"
      collection_method: "Calibrated submeter and measured service allocation; retain kWh and 3.6 MJ/kWh conversion"
      unit: "MJ"
      frequency: "Each batch/transfer and period closure"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All covered terminal stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; meter map; invoices; driver proof"
    - protocol_id: cp_release
      process_id: "terminal_manufacture"
      flow_role: "reference mass and quality"
      record_type: "foreground_record"
      raw_fields: "batch_id; grade; standard edition; release certificate; density; temperature; net dispatch kg; opening/closing stocks; samples; rework; rejected kg; property test results; sample_id; sample_time; preservation; test_method_edition; uncertainty; replicate_and_QA; retained_additive_mass; water; net_gross_calorific_basis; measured_calorific_value"
      collection_method: "Calibrated dispatch mass meter and certified batch sampling; test methods from governing standard"
      unit: "kg"
      frequency: "Each batch/transfer and period closure"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All covered terminal stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling chain; laboratory QA; release signature"
    - protocol_id: cp_waste
      process_id: "terminal_manufacture"
      flow_role: "waste transfers"
      record_type: "foreground_record"
      raw_fields: "stream_id; receiver; status; wet mass; water; oil; dry solids; retained fuel; sulfur; contamination; date"
      collection_method: "Calibrated shipment weighing and representative composition testing; receiver manifests"
      unit: "kg"
      frequency: "Each batch/transfer and period closure"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All covered terminal stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale; laboratory QA; receiver acknowledgement"
    - protocol_id: cp_air
      process_id: "terminal_manufacture"
      flow_role: "speciated air emissions"
      record_type: "foreground_record"
      raw_fields: "source_id; species; CAS; location; vapour composition; period; gas volume; temperature; absolute pressure; Z; dry_wet_basis; humidity; species_fraction_basis; carrier_inflow; exhaust_outflow; recovery_return; measured load; recovery efficiency; outage; method; sampling_QA; detection_limit; uncertainty"
      collection_method: "Representative emission/speciation measurement or documented source-specific calculation; reconcile net boundary species release after separately accounting for carrier inflow/background and internal recovery returns; retain total vapour and unidentified species coverage as a subledger, never assign whole fuel evaporation to any one species; record monitoring gaps and non-detect limits, not automatic zero; no automatic AP42 factor"
      unit: "kg"
      frequency: "Each batch/transfer and period closure"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All covered terminal stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling plan; calibration; source calculation and uncertainty"
    - protocol_id: cp_support
      process_id: "terminal_manufacture"
      flow_role: "packaging, maintenance and returns ledger"
      record_type: "foreground_record"
      raw_fields: "item_id; precise_material_or_whole_article; supplier; receiver; source_record; mass; tare; contents; construction; reuse_cycles; period; opening_closing_stocks; internal_external_link; maintenance_service; return_status; disposal; transport; inclusion_policy; native_reference_amount; native_property_unit; conversion; scaled_amount"
      collection_method: "Reconcile actual purchase/issue/return/maintenance and receiver records with calibrated quantities; add one atomic external exchange per physical item and treatment; no default item or reusable-container lifetime"
      unit: "kg"
      frequency: "Each issue, return, service and period closure"
      temporal_coverage: "Complete declared reporting period"
      site_scope: "All covered terminal stages and supporting consumables"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; calibrated weighing; return and service records; provider reference exchange"
  calculation_rules:
    - id: normalize_reference
      applies_to: "all inventory rows"
      rule: "Actual period amount of each flow / conforming net dispatched mass; attribute shared burdens with evidenced drivers first; physical exchanges are not multiplied by allocation shares."
      inputs:
        - "measured flow"
        - "net dispatch"
        - cp_release
      output: "per 1 kg reference flow"
      source_ids:
        - pcr-balance-method
    - id: volume_mass
      applies_to: "in_kerosene,in_naphtha,in_gasoline,out_fuel"
      rule: "Mass = volume × same-batch density rho(T) on matched temperature/state bases; retain sample id, measured volume/density, corrections and uncertainty."
      inputs:
        - volume
        - temperature
        - density
      output: "kg"
      source_ids:
        - pcr-balance-method
    - id: electricity_conversion
      applies_to: "in_electricity"
      rule: "Electricity MJ = metered kWh × 3.6."
      inputs:
        - kWh
      output: "MJ"
      source_ids:
        - pcr-balance-method
    - id: physical_reconciliation
      applies_to: "all inventory rows"
      rule: "Reconcile each physical material ledger: opening stock + external receipts and returns = net dispatch + closing stock + external waste + net external releases + samples and external returns; distinguish sold products and waste, and avoid overlap. Internal rework/recovery cancel at matched ends; maintain stage inventories and storage/loading/transport evaporation at their actual boundaries. Reconcile water, carbon, hydrogen, sulfur and energy using measured composition, H2O, carrier air/humidity, stock changes and actual transfers. Keep chemical energy of stored/dispatched fuel separate from electrical input and heat rejection; no combustion CO2 is created by volatilisation. Packaging/container and maintenance ledgers remain separate from net fuel mass; disclose unexplained residuals without invented balancing flows."
      inputs:
        - "physical ledgers"
        - "batch composition"
        - cp_material
        - cp_waste
        - cp_air
      output: "unallocated balance; disclosed residual"
      source_ids:
        - pcr-balance-method
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flows"
      requirement: "Verify actual material, compartment, route, property and supplier quantity basis; UUID identity is not a complete background dataset."
      evidence: "certificates; provider boundaries; identity records"
    - id: dq_temporal
      applies_to: "all rows"
      requirement: "Use one real reporting period; declare historical production/cessation, gaps and abnormalities."
      evidence: "dated production and purchase records"
    - id: dq_completeness
      applies_to: "all rows"
      requirement: "Show measured, demonstrated absent or gap for each item; unsupported zero is invalid. Extend each actual additional ingredient, cleaning agent, carrier and species as a separate row."
      evidence: "site diagram; source ledger; gap register"
    - id: dq_recipe
      applies_to: "batch"
      requirement: "Actual component fractions and additive grade/composition/dose come from production records; specification limits do not establish recipes or emissions."
      evidence: "batch recipe; certificates"
    - id: dq_upstream
      applies_to: "component supply"
      requirement: "Upstream completeness covers real refinery multi-product, water/carbon/sulfur/energy interfaces and allocation; do not insert an unverified kerosene finished-fuel route."
      evidence: "provider process inventory and allocation records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "out_fuel"
    rule: "Exactly one product output links the reference row; amount 1 kg and declared mass chain agree. Reject missing qualifiers or contrary kerosene/aviation-gasoline routes."
    source_ids:
      - pcr-balance-method
      - cpc3-2025
  - rule_id: validate_specification
    applies_to: "batch"
    rule: "Check all applicable specification, sampling and additive requirements; retain property-specific methods/results. Jet B conformance does not automatically prove 33320 classification."
    source_ids:
      - cgsb-jetb-2022
      - cpc3-2025
  - rule_id: validate_boundaries
    applies_to: "site and providers"
    rule: "Verify actual route against section 1 or extend the method before use. Do not duplicate off-site wastewater transfers as local water emissions or internal recycling as external outputs."
    source_ids:
      - ap42-refining-2015
  - rule_id: validate_accounting
    applies_to: "all inventory"
    rule: "Check physical, water/carbon/sulfur/energy balances separately from allocated burdens; allocation fractions cannot alter physical co-product amounts and product loss cannot replace species emissions."
    source_ids:
      - ref-bref-2015
      - pcr-balance-method
  - rule_id: validate_support
    applies_to: "supporting ledgers"
    rule: "Verify complete packaging/containers, maintenance, returns and whole-cartridge balances; each external item has an atomic exchange and exact provider/receiver. Retain source, native reference/property/unit, conversion and scaled amount for every linked process. Missing real SKU/site data is a collection requirement; unsupported physical identity or conversion cannot be waived."
    source_ids:
      - pcr-balance-method
  - rule_id: validate_emissions
    applies_to: "all emissions"
    rule: "Use actual species and compartments with monitoring/factor coverage and source years. Avoid total/species and nested-PM double counts; retain CO2 origins; define NOx quantity and exclude N2O. This route authorizes no unsupported general emission factor."
    source_ids:
      - ap42-refining-2015
published_dataset_profile:
  dataset_role: "Terminal manufacture foreground dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Terminal-gate wide-cut Jet B supply with complete upstream links"
  excluded_use: "Unsupported whole-refinery recipe, kerosene/avgas substitution, historical JP-4 market extrapolation, certification or aircraft-combustion claims"
  required_metadata: "Jet B grade and specification edition; producer/geography/manufacturing year; actual recipe and petroleum origin; additive grade/carrier/cumulative dosing; batch certificate; density temperature and calorific-value bases; upstream refinery route/allocation; voltage; dispatch boundary; actual CPC property assessment"
  required_quality_disclosure: "Measured/calculated/gaps, UUID limitations, provider bases, meter coverage, recipe evidence, balances, allocation and source years"
  update_trigger: "Changed specification, route, provider, recipe, additives, voltage, contamination, treatment or production period"
data_sources:
  - id: "cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Ver. 3.0 Explanatory Notes, 30 June 2025, p.155; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification boundary, not recipe"
  - id: "cgsb-jetb-2022"
    type: "standard"
    reference: "CAN/CGSB-3.22-2012, reaffirmed September 2022, sections 1, 3–6, PDF pp.8–14; https://publications.gc.ca/collections/collection_2022/ongc-cgsb/P29-003-022-2022-eng.pdf"
    used_for: "Jet B scope/additives/sampling; not actual purchase or production evidence"
  - id: "ref-bref-2015"
    type: "official_guidance"
    reference: "JRC, Refining of Mineral Oil and Gas BREF, 2015, section 2.21 printed p.107/PDF p.141; 4.21.14–16 printed pp.461–462/PDF pp.495–496; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/REF_BREF_2015.pdf"
    used_for: "General handling/multi-product blending interfaces; diesel diagram is not Jet B recipe; no default savings/recovery factors"
  - id: "ap42-refining-2015"
    type: "official_guidance"
    reference: "US EPA, AP-42 section 5.1 Petroleum Refining, April 2015, sections 5.1.1–5.1.2; https://www.epa.gov/sites/default/files/2020-09/documents/5.1_petroleum_refining.pdf"
    used_for: "General process/emission-source identification; historical US factors are not universal route amounts"
  - id: "shell-civil-2025"
    type: "handbook"
    reference: "Shell, Civil Jet Fuel, page updated 20 November 2025, read 12 October 2026; https://www.shell.com/business-customers/aviation/aviation-fuel/civil-jet-fuel-grades.html"
    used_for: "Supplier Jet B market context; older standard references not specification authority"
  - id: "shell-military-2025"
    type: "handbook"
    reference: "Shell, Military Jet Fuel, page updated 20 November 2025, read 12 October 2026; https://www.shell.com/business-customers/aviation/aviation-fuel/military-jet-fuel-grades.html"
    used_for: "JP-4 history/distinction; not a 2026 production survey"
  - id: "cgsb-catalogue-2026"
    type: "official_guidance"
    reference: "Government of Canada, Canadian General Standards Board Catalogue, checked 13 October 2026; https://www.canada.ca/en/public-services-procurement/services/standards-oversight/canadian-general-standards-board/catalogue.html"
    used_for: "Listed Jet B edition/amendment status and CGSB service status; no production or flight-approval evidence"
  - id: "nist-additive-identity"
    type: "official_guidance"
    reference: "NIST Chemistry WebBook, SRD 69, Butylated Hydroxytoluene (CAS 128-37-0) and Ethanol, 2-(2-methoxyethoxy)- (CAS 111-77-3), checked 13 October 2026; https://webbook.nist.gov/cgi/cbook.cgi?ID=C128370 and https://webbook.nist.gov/cgi/cbook.cgi?ID=111-77-3"
    used_for: "Molecular/CAS identity only; no additive formulation, dose or fuel approval"
  - id: "pcr-balance-method"
    type: "method_factor"
    reference: "Conservation and unit-conversion rules authored in this PCR; no empirical default amount"
    used_for: "Normalization and unallocated physical reconciliation"
