system_boundary:
  rules:
    - rule_id: boundary_upstream
      applies_to: "upstream links"
      rule: "Refinery intermediates may enter several product pools, and actual unit schemes depend on feed and product slate. Obtain distillation, treatment, hydrogen, heat and sulfur-recovery coverage from real component providers; Jet B properties do not prove all units operate. For a same-site preceding unit, retain an actual handoff with producer/receiver, native flow identity, amount, period, composition/state and both-end reconciliation; an internal component is not a burden-free purchase. Link each provider by exact process identity and retained dataset version, reference exchange, technology/geography/year, native property/unit and unscaled amount. Preserve conversion and scaled model amount and detect omitted or duplicated upstream stages. A finished kerosene-type jet-fuel provider is not a wide-cut finished-fuel provider; only verified component supply may link."
      source_ids:
        - ref-bref-2015
        - ap42-refining-2015
    - rule_id: boundary_ledgers
      applies_to: "physical system"
      rule: "Retain the unallocated physical map: receipt → blending/dosing → testing → storage → dispatch. Internal rework and recovered vapour returns have equal quantities at both ends and are not extra external emissions. Preserve inventories, external liquid/gas/solid outputs, wastewater and water/carbon/sulfur/energy ledgers. Off-site wastewater transfer is not a local water emission."
      source_ids:
        - ref-bref-2015
        - ap42-refining-2015
    - rule_id: boundary_support
      applies_to: "supporting physical exchanges"
      rule: "Preserve a complete ledger of each actual additive drum/bottle/liner/closure, pallet and other packaging, sample container, returnable transport container, cleaning material, maintenance lubricant, replacement seal/cartridge and discarded counterpart. Distinguish contents from whole container tare and dry cartridge construction from retained fuel/water. Track supplier, receiver, external/internal status, reuse cycles, opening/closing stocks, damage, returns and actual quantities. Each external material/waste needs its own physically specific atomic exchange and exact provider/treatment before completeness is claimed; durable equipment and transport assets follow an explicit consistent inclusion policy. Do not invent a packaging material or hide it in additive/fuel mass."
      source_ids:
        - pcr-balance-method
    - rule_id: boundary_route
      applies_to: "foreground"
      rule: "This route has no on-site boiler, steam, combustion vapour destruction or wastewater treatment. If actually present, source-supported units and atomic flows must be added before use; electricity cannot stand in for them or justify zero emissions. Any real extension records biogenic CO2, fossil CO2 and each emitted substance separately."
      source_ids:
        - ap42-refining-2015
boundary_abstraction:
  declared_starting_condition: "Verified refinery components and stated additives at terminal receipt boundary"
  starting_condition_role: "Foreground record start; earlier production and transport require complete upstream links"
  product_classification_scope: "Only this route with verified CPC properties supports a narrower 33320 suggestion"
  recursive_input_rule: "Purchased same-category finished fuel needs its own product-input row and upstream dataset, without recursive expansion; it is not covered automatically by this component-blending inventory"
  upstream_dataset_requirement: "Components, additives, carriers, cartridges, water, electricity and off-site waste treatment; refinery providers retain technology and co-product allocation evidence"
  disclosure: "Period/batches, component lineage, site diagram, internal rework, losses, water/carbon/hydrogen/sulfur/energy ledgers, all packaging/containers, maintenance, returns, source/native/scaled amounts, upstream boundaries and gaps"
