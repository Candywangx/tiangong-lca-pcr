measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report all inventory rows per 1 kg reference flow; net dispatch includes all retained components, additives and carriers in the complete conforming fuel; excludes containers, packaging, free separated water and unreleased fuel."
  - id: density_basis
    applies_to: "liquid material"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert liquid volume using measured same-batch density rho(T) at the same temperature basis; record sample/state, actual or corrected volume, temperature, pressure where material, correction method and uncertainty. Do not multiply tank volume at one temperature by density at another; no default density."
  - id: electricity_basis
    applies_to: "in_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain meter kWh; 1 kWh = 3.6 MJ; the database property is an electricity quantity convention, not fuel calorific value."
  - id: gas_measurement
    applies_to: "out_benzene_air,out_hexane_air,out_toluene_air,out_ethylbenzene_air,out_oxylene_air,out_mxylene_air,out_pxylene_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record gas sampling point and period, absolute pressure, temperature, compressibility Z, actual/reference volume, dry/wet basis, humidity, species fraction basis and molecular mass. Convert only consistent measured bases; an ideal-gas Z or a reference temperature/pressure requires documented applicability, never an automatic default."
  - id: calorific_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep net/gross calorific basis, sample composition/water, temperature and test/calculation method with QA. Specification minima are acceptance limits, not measured fuel calorific values or conversion defaults."
  - id: substance_basis
    applies_to: "all elementary outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain species, CAS, compartment and monitoring definition; VOC totals and speciated rows are not summed twice."
