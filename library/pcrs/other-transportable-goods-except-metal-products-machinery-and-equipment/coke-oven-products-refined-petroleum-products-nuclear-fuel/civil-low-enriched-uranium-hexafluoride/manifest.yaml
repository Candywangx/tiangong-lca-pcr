review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  unresolved:
    inventory_flow_uuids:
      - row_id: "spent_filter"
        reason_code: "no_exact_candidate"
        explanation: "Successful query returned mineral tailings, dust, uranium dioxide scrap or broad radioactive waste; none establishes a uranium-contaminated spent air filter with actual receiver conditions."
      - row_id: "wastewater"
        reason_code: "no_exact_candidate"
        explanation: "Successful query returned unspecified radioactive waste or generic effluent; none establishes the specified uranium-bearing aqueous waste sent to licensed off-site treatment."
  reference_identity:
    scope: "Full native reference name/comments explicitly include enriched uranium compounds; CAS/formula are absent and route is finished product at plant, without metal-only restriction. Conditional broad identity includes the LEUF6 subset, not Pu or a category-average provider. Actual isotope/current grade is absent, not verified; certificate or future qualified sampling remains a dataset obligation. No classification label may override contradictory chemical/route/grade metadata."
  background_compatibility:
    scope: "Each dataset requires supplier and gate/quantity verification. UF6 identity is a natural-feed chemical candidate only; actual natural composition/current grade is unverified and native supply geography is CN. Depleted broad compound identity applies to UF6 output only; no thorium, oxide or metal. Electricity is CN grid-average1–35kV identity only; non-CN or contractual providers require separate compatibility verification; gas volume T/P/wet-dry/composition/compressibility and provider definition remain site collection obligations; no dataset factor inferred from identity records."
  isotope_identity:
    scope: "Same-UUID official JRC air/freshwater definitions and full native records establish uranium-238, matching compartments and Radioactivity/kBq. Native Chinese 铀α and generic elemental-U CAS are broader translation/identifier debt, not a totalalpha-only restriction. Both isotope links are conditional on future isotope-specific analytical records, reference date and real Bq/kBq conversion; no current site measurements or total-alpha equivalence is asserted."
  methodology_review:
    status: "pending_independent_review"
    scope: "Environmental accounting only: no enrichment/plutonium-separation/fuel-making operating parameters, cascade/equipment design, recipes, optimization, default assay, yield, energy intensity, radiological conversion or generic allocation factor. Conditional inventory is a documented baseline, not proof that every facility emits these species. Full wet-air/water/energy/stock/packing/container/maintenance/return registers, paired physical links and site-period/cohort burden carryover are dataset obligations; service/background/allocated inventories are separate from physical ledgers. Total mass/conserved elements have no chemical-reaction sources or sinks; species may have evidenced formation/consumption."
  mapping_review:
    status: "pending_controller_decision"
    explanation: "Candidate narrower relation: conventional civil low-enriched UF6 is a strict subset of CPC33620; plutonium and other compounds, mixtures, alloys, dispersions and ceramics remain outside. No positive shared mapping is authored."
