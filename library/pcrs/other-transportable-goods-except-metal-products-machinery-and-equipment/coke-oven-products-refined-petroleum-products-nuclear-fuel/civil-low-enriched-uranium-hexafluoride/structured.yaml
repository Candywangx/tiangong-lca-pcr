  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "check_environment: Verify each actual atomic flow's type, species, origin, compartment, reference property/unit and compatible provider. Reconcile product/waste/environmental fates, wet air/water, energy, packing/containers, maintenance, returns and stocks. Distinguish retained contamination from actual environmental release. Do not allocate physical output masses; internal links must agree in identity, property, unit, amount and period at both ends. Reconcile stock-carried burdens and service/background links separately from physical conservation."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "check_completeness: A completed dataset requires positive independently measured D, compatible upstream data, full actual environmental-stream register, source-specific isotope reporting, evidence-backed allocation and uncertainty. Empty UUIDs, unknown quantity bases, untreated coverage gaps or missing monitoring are explicit pending items; a structural PCR check is not dataset completion, permit compliance or independent scientific approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground environmental inventory for a declared civil conventional UF6 supply boundary"
  downstream_use: "secondary_dataset; background_dataset only after dataset-level completeness and independent applicability review"
  allowed_use: "Public civil environmental accounting with the declared product, provider, gate, quantities and uncertainty"
  excluded_use: "Enrichment/separation/fabrication operating instructions; weapon-material production or optimization; plutonium; excluded product grades; reactor dose/safety claims; automatic comparison of different chemical or isotope bases"
  required_metadata: "Required qualifiers; D and period; upstream coverage; storage and waste fates; allocation evidence; individual species/medium and activity reference date"
  required_quality_disclosure: "Authored candidate; independent review pending; unresolved identities; monitoring/detection limits; provider quantity compatibility; missing stages and uncertainty"
  update_trigger: "Different product/feed history/state, supplier boundary, environmental outlets, provider basis, monitoring method or reviewed identity correction"
