  calculation_rules:
    - id: normalization
      applies_to: "all inventory rows"
      rule: "Physical exchange = independently collected boundary amount / D; preserve unallocated physical totals and stock changes. D is accepted whole UF6 output in kg for the cp_product gate/cohort. Compute the product environmental inventory separately from evidence-backed attributable/allocated burdens and lot-matched stock carryover / D. Allocated inventory cannot be used as the physical balance or to rescale paired physical transfers."
      inputs:
        - cp_product
        - "row-specific protocol"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: quantity_reconciliation
      applies_to: "all inventory rows"
      rule: "Reconcile whole-compound mass, water, stocks and external transfers using independent records; preserve elemental-U assays, isotope fractions and activity as separate descriptors. No default purity, moisture, formulation, purification yield, enrichment work or activity-to-mass conversion. Obtain any actual conversion from a validated lab/provider method with scope and uncertainty."
      inputs:
        - "Actual scales/meters"
        - "certificates and laboratory records"
      output: "Reconciliation residuals and uncertainty, separately from allocated burdens"
      source_ids: []
    - id: physical_conservation
      applies_to: "actual boundary register"
      rule: "Reconcile opening stock plus all external physical inflows against closing stock plus all external physical outflows, including wet air, water, retained material, containers and returns. For total mass and conserved elements, chemical reactions do not add sources or sinks. Species accounting may record evidenced chemical formation/consumption on the same scope, without authoring reaction recipes or operational parameters. Keep residuals and measurement uncertainty; do not infer missing process quantities to force closure."
      inputs:
        - "Full physical register"
        - "independent quantity/composition records"
      output: "Unallocated mass/element/species reconciliation with explicit scope"
      source_ids: []
    - id: ledger_separation
      applies_to: "site, services and product inventory"
      rule: "Preserve the complete site physical and energy records, matched internal-link endpoints and retained stocks. Keep service quantities, upstream background inventories and allocated product burdens in separate ledgers with explicit cross-references; prevent double counting and reconcile period/cohort coverage."
      inputs:
        - "Meter/transfer/stock records"
        - "supplier services"
        - "allocation evidence"
      output: "Traceable physical records and separately derived product inventory"
      source_ids: []
  data_quality_requirements:
    - id: identity_gate
      applies_to: "Product and providers"
      requirement: "Verify actual single compound, civil specification, feed origin, product state and compatible net whole-UF6 basis; broad UUID is not a generic provider or composition default"
      evidence: "Lot acceptance and source-specific background"
    - id: monitoring_scope
      applies_to: "All environmental streams"
