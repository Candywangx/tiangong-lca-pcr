system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "civil_environment_boundary: Use one aggregate foreground environmental unit covering attributable utilities, environmental controls, storage and delivery within the declared site gate. Keep actual production stages as independently metered collection scopes without publishing technical operation instructions. Preserve physical internal links with equal amounts at both ends; cancel internal transfers only when aggregating this unit."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "environmental_streams: Separate purchased inputs, transferable products, waste sent for treatment and releases to each environmental medium. Radioactive waste and air/water releases require site-specific permitted monitoring (ea-nuclear-environment). Use CWW BAT2(II–III) stream-characterization principles only as analogous chemical environmental inventory practice; nuclear limits and permit applicability are not imported (jrc-cww-bat2)."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "complete_scope: The cards below are a concrete conditional baseline, not an exhaustive plant bill of materials. Before a completed dataset, reconcile all actual site environmental streams and permits; add one atomic row for every additional fuel, purchased heat, water source, chemical, cylinder/overpack material, refrigerant, waste and emission. Record actual compositions and destinations. No absent, unmeasured or unresolved stream may silently become zero. Container reuse requires actual lifetime/use allocation; neither container-free supply nor a container recipe is assumed."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "physical_scope_register: Reconcile every actual boundary inflow/outflow and opening/closing stock. Include wet intake/exhaust air and its dry-air/moisture basis, water vapour, liquid water, cooling returns, condensate, aqueous carriers, retained filters/sludge/contamination, returned product and residual material, packing, cylinders/overpacks, maintenance supplies and wastes. Record actual quantity and fate per atomic exchange; add identities only after verification. Internal air/water circulation is not an external input or release. Purchased transport, storage, treatment and maintenance services are separate service records; their background inventories must not be added as duplicate foreground physical streams."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "energy_scope_register: Reconcile metered electricity, each actual fuel, purchased heat/steam/cooling, exported energy and energy accumulation/loss on consistent reporting scopes. Collect time-integrated readings; where only power is observed, record the measured time profile and integrate it over the actual interval. Nameplate power, calendar hours or an assumed load factor cannot establish consumption. Purchased-utility burdens and site-owned direct emissions remain separate (urenco-environment)."
      source_ids: []
