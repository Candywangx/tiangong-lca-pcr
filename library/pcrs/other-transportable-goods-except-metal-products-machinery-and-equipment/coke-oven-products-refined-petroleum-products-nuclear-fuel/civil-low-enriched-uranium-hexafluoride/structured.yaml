allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "physical_and_burden_ledgers: Keep an independently measured physical ledger for feed, accepted product, depleted material, waste, discharge and changes in stocks. Preserve each physical co-output in full before allocating environmental burdens; multiplying its actual mass by an allocation share would corrupt the physical account. Do not derive output, yield, purification loss or a recipe from assumed balances."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_decision: Avoid allocation through actual collection subdivision where feasible, consistent with the general product GHG hierarchy (ghg-product-allocation, chapter9, p.63). For inseparable joint burdens, require a documented physical causal relation; otherwise justify and independently review another relationship, including actual economic evidence if used. This is an authored adaptation for LCI, not a nuclear-specific allocation standard. No default split, work-unit equation, isotope balance or substitution credit is supplied."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "tails_fate: Distinguish retained tails, usable co-product and waste using actual acceptance, owner and receiver records. Include attributable storage and eventual-management coverage or disclose omissions; storage does not prove avoided production. Retained material is closing physical stock, not an external product or waste transfer; production and later dispatch are different events. External product/waste transfers are distinct from environmental release."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "period_burden_carryover: Preserve lot-linked opening/closing stocks and their carried environmental burdens separately from physical quantities. For the accepted lots counted in D, reconcile prior-period burdens brought forward, current-period attributable burdens and burdens retained for future lots. Earlier production must not be charged again merely on later dispatch; current-period site totals must not all be assigned to dispatch of opening stocks. Storage, shared services and returned/reworked lots need actual scope and allocation evidence. Disclose an unreconciled carryover rather than treating stocks as burden-free."
    source_ids: []
