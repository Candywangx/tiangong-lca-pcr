system_boundary:
  rules:
    - rule_id: boundary_existing
      applies_to: "all operations"
      rule: "Start at the disclosed gas/liquid inlet to the existing recovery/fractionation submodel. Preserve supplier extraction/refinery conversion burdens, feed provenance and all upstream gas/liquid/solid co-products (including coke where applicable) in their original physical ledger; do not delete or duplicate them. Shared treatment, sulfur recovery, wastewater management and energy systems must have one owner. An integrated site may expose the shared physical submodel and operation-level allocation; a standalone terminal links qualified upstream datasets."
      source_ids:
        - ref-bref-2015
        - epa-gas-processing-1995
    - rule_id: boundary_stages
      applies_to: "lpg"
      rule: "Declare reception, actual cooling/absorption, de-ethanising, depropanising/debutanising/isomer separation, actual sweetening/drying, blending, odorisation, liquid storage and closed-loop loading/vapour handling stage meters. Their sequence is site-specific. Aggregate them as one LPG foreground unit; cancel internal same-material links with identical endpoint quantities, while retaining stage mass/energy observations. No additional finished-reference output at a storage/packaging handoff."
      source_ids:
        - ref-bref-2015
        - eia-storage-2026
    - rule_id: boundary_vapour
      applies_to: "lpg"
      rule: "Distinguish recovered vapour recycled internally, gas sent to an existing fuel header, gas transferred to external treatment, vented species and flare/combustion exhaust. Measure the actual recovery and destruction state; never classify all displaced LPG vapour as emitted or assume complete combustion. Refrigeration-circuit losses are tracked independently from product losses."
      source_ids:
        - ref-bref-2015
        - epa-gas-processing-1995
    - rule_id: boundary_energy
      applies_to: "lpg"
      rule: "Record electricity, imported steam, fuel and each actual refrigerant separately. Recovered upstream reboiling heat retains its heat interface and prior burden; it is not free steam. Imported steam is distinct from foreground boiler fuel and exhaust. Include actual refrigeration/cooling, wastewater and spent adsorbent handling. Actual additional chemicals, refrigerants, packaging, wastes and releases each require their own atomic exchange before dataset completion. A background link must cover the entire actual operation and upstream burdens; record its gate, period, composition/state and coverage. A cutoff needs a documented rationale, omitted burdens and sensitivity; missing quantities never become zero, and paired physical pipes remain in the unallocated ledger."
      source_ids:
        - ref-bref-2015
    - rule_id: boundary_gate
      applies_to: "lpg"
      rule: "The product gate is the documented liquid custody transfer, before customer vaporisation or use. Include on-site tank residence and loading losses through that gate; off-site shipping enters only if explicitly within the declared boundary and supported by its own submodel. Allocate infrastructure over actual lifetime throughput or justify exclusion and sensitivity. Bulk tank and pressure-container manufacture are not additional foreground production stages, but their service burdens remain attributable to LPG delivery: collect container/tank identity, material and tare, lifetime throughput or service cycles, repair/replacement, inspection, cleaning/hydrotest, coating, utilities, wastes and retirement. Include actual reusable-container return/empty handling within the gate, residual LPG and returned stocks. Link complete service datasets once; add an atomic exchange for each actual material, utility, waste or release they do not cover. Do not count the entire durable container mass as consumed per filling, assume unlimited reuse, or assign a default lifetime."
      source_ids:
        - eia-storage-2026
