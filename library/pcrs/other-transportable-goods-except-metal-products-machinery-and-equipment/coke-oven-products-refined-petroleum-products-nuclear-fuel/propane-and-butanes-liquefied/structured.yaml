allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared burdens"
    rule: "First subdivide by actual metered operations or assess a documented expanded system. For unresolved shared burdens, use a demonstrable causal physical relationship; if unavailable, justify same-gate period-matched economic allocation and sensitivity. Do not infer a universal mass or heating-value share from the product label."
    source_ids:
      - eu-pef-multifunctionality-2021
  - rule_id: allocation_ledgers
    applies_to: "all rows"
    rule: "Keep the unallocated physical process diagram and feed/product/total-mass/water/C/H/O/N/S/energy balances separate from the environmental burden account. Preserve co-product quantities, compositions, phases, receivers and stock changes. Multiply only shared burdens by accepted allocation factors; do not mechanically multiply physical co-product outputs by those factors. In the reference-specific result, selected product is 1 kg; all physical observations remain traceable by D."
    source_ids:
      - eu-pef-multifunctionality-2021
      - ref-bref-2015
  - rule_id: allocation_internal
    applies_to: "internal links"
    rule: "Internal recycling of absorbent, refrigerant, vapour, gas fuel or condensate is recorded at both stage endpoints with matching quantities, but does not create a second external input or avoided-product credit. Own-use fuel is part of actual physical energy/carbon balance and its combustion has one owner. Waste disposal and flaring do not become saleable co-products."
    source_ids:
      - ref-bref-2015
      - eu-pef-multifunctionality-2021
