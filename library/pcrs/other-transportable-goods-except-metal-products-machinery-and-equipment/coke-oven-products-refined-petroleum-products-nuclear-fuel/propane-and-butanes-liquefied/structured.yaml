  calculation_rules:
    - id: normalization
      applies_to: "all inventory rows"
      rule: "Normalized physical exchange=actual matched-period quantity / D; environmental burden=(direct burden+allocated shared burden)/D. Cancel internal links first; physical co-product quantities are not multiplied by allocation shares."
      inputs:
        - cp_final_product
        - "row-specific cp"
        - cp_allocation
      output: "per 1 kg reference flow"
      source_ids:
        - eu-pef-multifunctionality-2021
    - id: physical_balance
      applies_to: "lpg"
      rule: "Reconcile original physical ledger as sum(in)+opening_stock=sum(out)+closing_stock+residual; check total mass, water, C, H, O, N, S and energy separately. Whole carriers cross each physical boundary once; their constituent species are partitions, not additional mass. Chemical reactions redistribute species and may form/consume water, but are not extra sources or sinks of total mass or conserved elements. Measured composition with T/P/density or gas-state conversion establishes species mass. Retain combustion air, fuel, exhaust and incomplete flare conversion separately; unknown losses retain residuals and investigation."
      inputs:
        - "Stage meters"
        - composition
        - "T/P"
        - stocks
        - cp_allocation
      output: "Balance residuals, uncertainty and unallocated physical ledger"
      source_ids:
        - ref-bref-2015
        - epa-gas-processing-1995
    - id: water_elements
      applies_to: "lpg"
      rule: "Track water in feeds, solutions, product, steam, condensate, wastewater, humid air, evaporated water and stocks. Include reaction water with measured/stoichiometric provenance in the water-species account; conserve H/O over all species independently. Reconcile C/H/O/N/S from actual compositions, including air oxygen/nitrogen, purging N2, unreacted exhaust N2/O2, odorant sulfur and amine nitrogen. Retain sodium and other actual elements where needed for caustic/adsorbent closure. Gross exhaust/wastewater carriers and their pollutant species must not be added twice to total physical mass; missing species remain identified residuals."
      inputs:
        - "Stage assays"
        - "air/fuel/steam/water meters"
        - cp_acid_gas
        - cp_spent_amine
        - cp_spent_caustic
      output: "Separate water and conserved-element ledgers with residuals"
      source_ids:
        - ref-bref-2015
        - epa-gas-processing-1995
    - id: energy_balance
      applies_to: "lpg"
      rule: "Reconcile actual fuel/feed/product chemical energy, imported net steam heat, electricity/work, recovered heat interfaces, refrigeration duty, exported heat, heat loss and energy stocks using declared consistent enthalpy and calorific bases. Electricity, heat and cooling duty are not material mass inputs. A net-steam-MJ exchange is accompanied by physical steam/return water observations, not a second gross-steam energy burden or condensate heat credit. Cooling duty is heat moved, not additional purchased energy when electricity/fuel already supplies it. No product heating value, boiler efficiency or utility-per-product default is assumed."
      inputs:
        - "Actual compositions/calorimetry"
        - "utility meters"
        - "steam and return enthalpies"
        - stocks
      output: "Energy residuals and supplier-basis compatibility"
      source_ids:
        - ref-bref-2015
    - id: species_emission
      applies_to: "air emissions"
      rule: "Species emission mass=integral(actual exit flow*matching mass concentration*dt), or documented composition/mole/volume-concentration conversion. Speciate after recovery; total VOC, carbon-equivalent readings or NO2-equivalent require explicit original monitoring basis and conversion. Do not treat all VOC as propane."
      inputs:
        - "Source flow"
        - "species assay"
        - "T/P"
        - duration
        - "capture/destruction observations"
      output: "This species mass crossing gate; normalize by D"
      source_ids:
        - ref-bref-2015
        - epa-gas-processing-1995
  data_quality_requirements:
    - id: representative
      applies_to: "lpg"
      requirement: "Same SKU, route, period, site and state; record seasonal blend changes and startup/shutdown separately, without pooling incompatible batch purities."
      evidence: "Original records, assays and stage ledger"
    - id: evidence_limits
      applies_to: "all rows"
      requirement: "No universal yield, recipe or range. BREF historical utility ratios are per feed, not product; EPA historical sulfur factors apply only to their specific acid-gas combustion conditions. Neither is a default. Identity lookup does not establish provider basis or complete dataset."
      evidence: "Source limitations and foreground protocols"
validation_rules:
  - rule_id: validate_reference
    applies_to: "final_product"
    rule: "Verify one selected saleable liquid product identity and one final_product output, 1 kg net reference, positive measured D, actual composition/purity and all qualifiers. An unresolved reference UUID or incompatible physical route/property/unit prevents a usable completed dataset. Do not reuse a gas/LNG reference or refrigerant circuit charge as LPG."
    source_ids:
      - ref-bref-2015
      - eia-storage-2026
  - rule_id: validate_quantity
    applies_to: "all rows"
    rule: "Preserve raw mass/volume/T/P and conversion provenance. Gas and liquid volume bases remain separate; supplier/background reference bases must be independently compatible, not merely identity-matched. Steam pressure and enthalpy basis, active chemical fraction and electricity property must be established."
    source_ids:
      - ref-bref-2015
  - rule_id: validate_balance
    applies_to: "lpg"
    rule: "Reconcile feeds, liquid and gaseous products, vents, flare carbon/sulfur, water, spent materials, own use and stock change before allocation. Retain residuals and meter uncertainty; no forced zero residual. Distinguish acid gas sent for sulfur recovery from air H2S; distinguish wastewater transfer from receiving-water emissions."
    source_ids:
      - ref-bref-2015
      - epa-gas-processing-1995
  - rule_id: validate_carriers_services
    applies_to: "lpg"
    rule: "Check complete stage/background coverage, paired pipes, liquid/vapour inventories and returns; reconcile whole-carrier mass without adding constituent quantities twice. Require separate total mass, water, C/H/O/N/S and energy residuals. Check actual packaging and durable pressure-container/tank service life, maintenance, cleaning, return and retirement burdens with one owner and per-D service allocation; exclusions need evidence and sensitivity. A generic reference label or a matching unit cannot override conflicting source route, location, composition or grade."
    source_ids:
      - ref-bref-2015
      - eia-storage-2026
      - eu-pef-multifunctionality-2021
  - rule_id: validate_species
    applies_to: "air emissions"
    rule: "Check actual species, fossil/biogenic origin, CAS where applicable, outdoor-air compartment/subcompartment and amount definition against the flow original. Never substitute nitropropane for propane, a correction flow for a pollutant, or a total VOC/NOx quantity for individual species. NO and NO2 cannot be duplicated with total NOx; NOx is not N2O. Preserve actual biogenic CO2 if an auxiliary biogenic fuel occurs, with its own added input/emission rows. Particulate bins must be disjoint with filterable/condensable definitions."
    source_ids:
      - ref-bref-2015
      - epa-gas-processing-1995
  - rule_id: validate_complete
    applies_to: "dataset"
    rule: "Document performed/skipped checks, identity gaps, missing upstream burdens, measurements and provider bases. Actual MEA/TEG regeneration, sulfur recovery, on-site water treatment, other refrigerants or combustion engines require complete compatible submodels, including actual BTEX/isomers, N2O and other measured releases as atomic rows. Missing, unknown, measured zero and a measured nondetect with detection limit are different; conditional not-applicable status requires route evidence. Future collection requirements do not establish actual quantities or SKU acceptance. No historical/single-plant composition, utility ratio or factor establishes a general default."
    source_ids:
      - ref-bref-2015
      - epa-gas-processing-1995
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Commercial liquid propane/butane supply at the verified same composition, grade and gate, only after complete identity/provider-basis linkage"
  excluded_use: "Standalone natural-gas fractionator reference binding; LNG; gaseous delivery; olefin-rich petrochemical gas; extraction or whole-refinery inventory; analytical/refrigerant certification; cylinder manufacture; customer combustion"
  required_metadata: "site and production period; one SKU and commercial grade; propane/n-butane/isobutane assay and olefin impurities; purity; water and sulfur; fossil origin; raw-feed sources and upstream gates; recovery/separation or purchased-component blending route; liquid phase at transfer; mass meter or liquid density and measured volume; temperature and absolute pressure; gas-volume wet/dry and reference conditions with compressibility; storage and loading vapour destination; utilities and steam-return basis; co-products and allocation; gate and transport scope"
  required_quality_disclosure: "Unallocated physical ledger, burden account, coverage, provider bases, identity gaps, uncertainty, skipped checks and scientific-review state"
  update_trigger: "Changed product composition/state, feed provenance, separation/blending route, provider basis, recovery/treatment or allocation"
data_sources:
  - id: "ref-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Refining of Mineral Oil and Gas BREF (2015),2.12 printed pp76–77/PDF110–111;2.17 pp96–97/PDF130–131;3.12 p191/PDF225;4.12 p397/PDF431. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/REF_BREF_2015.pdf"
    used_for: "Gas/liquid feeds, multiproduct separation, final treatment, fugitive/odorant losses and energy interfaces; no offshore extraction model or historical utility/diagram-condition defaults."
  - id: "epa-gas-processing-1995"
    type: "official_guidance"
    reference: "US EPA, AP-42 5.3 Natural Gas Processing (January1995),5.3.1–5.3.3 and Table5.3-1 caveats, PDF1 and4. https://www.epa.gov/sites/default/files/2020-09/documents/5.3_natural_gas_processing.pdf"
    used_for: "Gas processing/acid-gas destinations, leaks and TEG-regeneration emissions evidence; historical acid-gas combustion factors and regional H2S values are not universal LPG/boiler factors."
  - id: "eia-propane-2023"
    type: "official_guidance"
    reference: "US EIA, Where do hydrocarbon gas liquids come from? Propane in depth, updated26December2023, propane-production paragraphs. https://www.eia.gov/energyexplained/hydrocarbon-gas-liquids/where-do-hydrocarbon-gas-liquids-come-from-in-depth.php"
    used_for: "Natural-gas/refinery origins and Y-grade/fractionation distinction; not a purity acceptance standard, fixed composition or yield."
  - id: "eia-storage-2026"
    type: "official_guidance"
    reference: "US EIA, Transporting and storing hydrocarbon gas liquids,13October2026 acquisition snapshot, transport/storage paragraphs. https://www.eia.gov/energyexplained/hydrocarbon-gas-liquids/transporting-and-storing-hydrocarbon-gas-liquids.php"
    used_for: "Liquid LPG components and pressure/refrigeration state; transport modes do not impose transport inclusion or numerical defaults."
  - id: "eu-pef-multifunctionality-2021"
    type: "official_guidance"
    reference: "European Commission,C(2021)9332 final AnnexI,4.5,PDF63–64. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Multifunctionality hierarchy and allocation rationale; no claim of complete PEF conformity."
