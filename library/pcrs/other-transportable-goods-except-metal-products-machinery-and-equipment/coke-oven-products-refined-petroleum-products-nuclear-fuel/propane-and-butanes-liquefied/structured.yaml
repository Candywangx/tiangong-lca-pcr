measurement_rules:
  - id: reference_mass
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is positive accepted net whole liquid product mass for the same SKU, route, site and period, collected using cp_final_product; every row uses per 1 kg reference flow. Include accepted contained water, odorant and other additives in D; D is not dry hydrocarbon mass. Exclude packaging, container tare and duplicate internal handoffs. Reconcile actual returns, heels and stock changes without subtracting a return twice."
  - id: liquid_volume
    applies_to: "final_product, blend_propane, blend_nbutane, blend_ibutane"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Obtain liquid mass by calibrated mass metering or m_liquid=V_liquid*rho_liquid(T,P,x), with measured liquid volume, temperature, absolute pressure and composition-compatible density. Gas volume cannot directly represent liquid product quantity; unknown liquid density/state remains unresolved."
  - id: gas_volume
    applies_to: "raw_gas, refinery_gas, residue_gas, fuel_gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Keep raw gas volume wet/dry basis and metered/reference T/P. Convert using m_gas=P_abs*V_gas*MW(x)/(Z*R*T) in consistent units, or matching measured gas-phase density. Match provider/background m3 definition; a database secondary mass factor is not gas density."
  - id: steam_heat
    applies_to: "steam, condensate_return"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Record steam and returned condensate using actual mass, pressure, temperature, quality and enthalpy. Net delivered heat=m_in*h_in-m_return*h_return with declared enthalpy datum, other losses and boundary. Steam mass or an MJ property alone does not establish net delivery basis."
  - id: utilities_active
    applies_to: "electricity, mea, teg, caustic, odorant"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "Preserve actual electricity reference property; 1kWh=3.6MJ. Input flow quantity is delivered-grade product mass. Active substance mass=m_product*w_active; retain carrier water/contaminants in the physical ledger, without an additional purchased-water exchange for contained water. Do not treat wet solution as pure chemical. No default concentration or quantity."
