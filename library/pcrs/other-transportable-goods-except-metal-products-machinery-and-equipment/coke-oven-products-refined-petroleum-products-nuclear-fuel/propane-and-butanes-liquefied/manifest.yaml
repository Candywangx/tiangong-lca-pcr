        explanation: "No verified C1-C5 refinery gas inlet identity. Candidate 1f11a155 refinery route/comments conflict with natural-gas classification and oil/rock-formation location; retain source-identity ambiguity until authoritative repair or an independently compatible identity. Gas oil is liquid distillate; LPG and H2S-speciation flows cannot represent whole inlet gas."
      - row_id: "mixed_ngl"
