        explanation: "No exact verified product isobutane after species and CAS queries. Isoparaffins C4-C5 is a different mixture, not pure/specified isobutane."
      - row_id: "steam"
        reason_code: "supplier_heat_basis_unresolved"
        explanation: "Industrial steam ea4e839d is explicitly a recovered-fibre fluting-line source-specific mass flow, not LPG steam. Steam 293f9fd9 is Mass with hard 11.0 MPaG, not a verified net-MJ interface. Process heat from steam fcf9e128 uses Gross calorific value, not proven net delivered heat; keep actual LPG steam concrete and unresolved, never infer net MJ from a property."
      - row_id: "teg"
        reason_code: "no_verified_compatible_identity"
        explanation: "No exact verified Triethylene glycol CAS112-27-6 after name and CAS searches. Polyethylene glycol, triethanolamine and dimethyl ether are different chemicals."
      - row_id: "sieve"
        reason_code: "no_verified_compatible_identity"
        explanation: "ZSM-5 catalyst is not established as actual LPG drying molecular-sieve adsorbent of the required grade; no generic composition default."
      - row_id: "odorant"
        reason_code: "no_verified_compatible_identity"
        explanation: "No exact product ethanethiol CAS75-08-1 after name/CAS search; heptane, ethane and triethanolamine are different substances."
      - row_id: "residue_gas"
        reason_code: "no_verified_compatible_identity"
