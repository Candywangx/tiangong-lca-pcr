measurement_rules:
  - id: reference_basis
    applies_to: "final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is the independently weighed positive accepted reporting-period net commercial UF6 contents in kg, including actual incidental water and impurities accepted under the specification and excluding packing, containers, rejects and cancelled internal transfers; collect using cp_final_product. All rows use per 1 kg reference flow."
  - id: product_vs_uranium
    applies_to: "feed_uo3; final_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record whole compound, contained elemental U, impurity and moisture as distinct measured quantities. m_U = m_product * measured_U_mass_fraction only when both quantities have the same actual assay basis. Do not infer a default UF6/UO3 assay, isotope composition or mass conversion from an ideal chemical formula. No drying or aqueous-solution assumption establishes accepted UF6 identity."
  - id: activity_basis
    applies_to: "radionuclide rows"
    required_property_ref:
      name: "Radioactivity"
      uuid: ""
    required_unit: "kBq"
    rule: "Preserve measured nuclide identity, activity reference date and uncertainty; 1 kBq = 1000 Bq. Convert measured Bq to the verified kBq row unit before normalization. Neither total-U kg nor gross-alpha activity determines individual nuclide activity without independent evidence."
  - id: utility_basis
    applies_to: "electricity; natural_gas; water_supply"
    required_property_ref:
      name: "Declared reference property"
      uuid: ""
    required_unit: "MJ; m3; kg"
    rule: "Use the verified reference property of each supply. Electricity: 1 kWh = 3.6 MJ. Gas m3 requires meter/provider temperature, pressure, wet/dry, composition and compressibility correspondence. Water m3 to kg requires applicable measured density. Do not copy non-reference meanValue factors as physical densities."
  - id: physical_accounts
    applies_to: "production"
    required_property_ref:
      name: "Mass; Volume; energy"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Keep total-material mass, separate C/H/O/N/S/U/F elemental accounts, water-species and energy accounts before burden allocation. Record all actual inputs, outputs and opening/closing stocks: feed, chemicals, work in progress, accepted/rejected product, retained residues, liquids, filters and carriers. Add any other actual element; preserve fossil/biogenic carbon separately. Track water in supplied formulations, moisture, wet-air intake/exhaust, independently observed reaction water, recycle, evaporation, waste and product without default chemistry. Wet/dry stream conversion requires matching measured composition, flow basis and time. Include attributable electricity, each fuel and heat supply, exported heat/work, losses and stored energy with compatible measured bases; energy is not material mass. Pair internal-transfer endpoints by identity, quantity, assay basis and time before aggregate cancellation; investigate residuals rather than forcing closure."
