allocation_rules:
  - rule_id: subdivision_first
    applies_to: "production"
    rule: "Prefer independent metering and subdivision for UF6 and any separately operating UO2 line; UO2 line ammonia does not establish a UF6-line release. Allocate only genuinely shared burdens using evidenced causal drivers; disclose basis, fraction, period, other outputs and sensitivity. No allocation share is prescribed."
    source_ids:
      - cnsc-case
  - rule_id: physical_vs_burden
    applies_to: "all inventory rows"
    rule: "Maintain a physical material/process ledger separately from the environmental burden ledger. Keep full independently weighed co-product outputs in the physical ledger; do not multiply physical co-product mass by a burden allocation share. No coproduct, yield or avoided-disposal credit is presumed."
    source_ids: []
  - rule_id: waste_and_reuse
    applies_to: "waste and container service"
    rule: "Classify actual outputs by accepted recipient/use and authorization. Internal uranium/dust/water recovery cancels at the aggregate boundary, not an external coproduct or avoided-burden credit. Characterized radioactive waste requires its actual receiver/treatment chain; distinguish current operations from legacy remediation. Reusable container burdens require demonstrated uses and cleaning/repair records."
    source_ids:
      - iaea-environment
      - cnsc-case
  - rule_id: ancillary_completeness
    applies_to: "actual packing; carriers; filters; maintenance"
    rule: "At site instantiation add each actually used packing material, fresh filter medium, coolant, cleaning chemical and repair consumable as its own identified atomic input with collection method; pair actual spent material, retirement, packing removal and carrier dispatch/return as distinct outputs with receiver, ownership and quantity. Generic carrier or material service is not physical product mass. Track complete opening/closing carrier and consumable stocks. Record manufacture, transport, cleaning, repair and retirement burdens separately with evidenced service-life/output allocation and no automatic recycling credit; disclose pending exact identities without deleting actual physical flows."
    source_ids:
      - cww-inventory
      - iaea-environment
