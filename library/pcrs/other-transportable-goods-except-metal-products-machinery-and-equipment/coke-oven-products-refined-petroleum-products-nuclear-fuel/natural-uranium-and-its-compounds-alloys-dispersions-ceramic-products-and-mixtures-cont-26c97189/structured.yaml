system_boundary:
  rules:
    - rule_id: gate_boundary
      applies_to: "production"
      rule: "This PCR covers the environmental inventory of accepted solid natural-isotope uranium hexafluoride (UF6) delivered at a declared civil nuclear fuel supply factory gate, starting with externally supplied qualified purified uranium trioxide (UO3) powder. It records net deliveries, attributable utilities, actual externally supplied chemicals, waste transfers and environmental releases. Receipt, environmental production accounting, controls, container service and dispatch form one aggregated foreground unit; stage readings remain separate evidence. It provides no executable conversion, purification, enrichment, separation parameters, equipment designs or optimization. Public producer and regulator evidence establishes the UO3-to-UF6 delivery boundary, not a universal chemical recipe (cameco-delivery, cameco-delivery-state, cnsc-case)."
      source_ids:
        - cameco-delivery
        - cnsc-case
    - rule_id: upstream_partition
      applies_to: "all inventory rows"
      rule: "Retain supplier burdens without repeating ore/concentrate, refining, enrichment, fuel fabrication or electricity-generation operations. The historical civil EPD already separates these stages; its per-kWh results cannot be used as per-kg UF6 factors."
      source_ids:
        - vattenfall-lca
    - rule_id: environment_boundary
      applies_to: "all inventory rows"
      rule: "Track actual air and water releases separately from captured dust, stored waste and authorized offsite transfers. Collect process and non-process water routes separately; site-specific licence limits and ambient monitoring values are not default emission quantities."
      source_ids:
        - cnsc-case
        - iaea-environment
        - cww-inventory
    - rule_id: scope_completeness
      applies_to: "all inventory rows"
      rule: "Cards are conditional measurement templates, not a universal recipe. Build a complete actual site exchange census; add every actually used absent chemical, coolant, fuel, transport service, water resource, land/infrastructure item, waste and pollutant as a separately identified atomic row. Document absent, measured zero, below-detection and unknown separately. Include attributable infrastructure/maintenance/closure with verified service-life and output attribution, or disclose exclusion and sensitivity."
      source_ids:
        - cww-inventory
        - iaea-environment
