  calculation_rules:
    - id: normalization
      applies_to: "all inventory rows"
      rule: "Physical exchange = independently established reporting-period quantity / D after reconciling stocks and paired internal transfers; keep gross external carrier movements. Environmental burden attribution is a separate calculation and never scales physical material quantities or allocates them into fictitious closure. The reference product is 1 kg accepted net commercial UF6 contents."
      inputs:
        - cp_final_product
        - "each row-specific collection protocol"
      output: "per 1 kg reference flow"
      source_ids: []
    - id: uranium_account
      applies_to: "feed_uo3; final_product; waste and release observations"
      rule: "m_U = measured whole-material mass * measured U mass fraction on the same analytical basis; reconcile elemental U receipts, products, wastes, releases and stocks without prescribing process yield."
      inputs:
        - "Traceable weights"
        - "laboratory assays"
        - "stock observations"
      output: "separate kg-U physical ledger"
      source_ids:
        - cnsc-case
    - id: release_load
      applies_to: "elementary outputs"
      rule: "Integrate matched source concentration times actual stream flow times interval; retain original concentration and flow units, blanks/background, analytical basis, coverage and uncertainty. Normalize each confirmed species and compartment separately; ambient concentration, licence limit or historical daily average alone is insufficient."
      inputs:
        - "Source measurements"
        - "laboratory data"
        - "source flow and interval"
        - cp_final_product
      output: "per 1 kg reference flow"
      source_ids:
        - cww-inventory
        - iaea-environment
    - id: activity_conversion
      applies_to: "u238_air; u235_air; u234_air; u238_water; u235_water; u234_water"
      rule: "activity_kBq = measured_activity_Bq / 1000; record nuclide-specific reference date and any laboratory-supported decay correction before dividing by D. No gross-alpha or uranium-mass proxy conversion."
      inputs:
        - "Nuclide measurements"
        - "laboratory basis"
        - cp_final_product
      output: "kBq per 1 kg reference flow"
      source_ids:
        - iaea-environment
  data_quality_requirements:
    - id: identity
      applies_to: "reference and feed"
      requirement: "Verify compound versus mixture, actual natural-isotope evidence and supply state. Tiangong flow identity is distinct from actual provider composition, isotope qualification and inventory reference quantity. Do not use a neighbour product or classifier label to close a physical mismatch."
      evidence: "Lot acceptance; assays; provider originals"
    - id: measurement
      applies_to: "all inventory rows"
      requirement: "Trace calibrations, sample representativity, reporting period and production scope; record low loads, detection limits, uncertainty and balance residuals. No historical single-facility coefficient becomes a default."
      evidence: "Original meter and laboratory records"
    - id: basis_compatibility
      applies_to: "all background links"
      requirement: "Verify supply route/geography/period and reference-property basis separately from identity lookup; keep concrete missing UUID or provider compatibility pending. A flow record is not a complete inventory dataset."
      evidence: "Verified flow plus actual provider definition"
    - id: radiological
      applies_to: "nuclide releases"
      requirement: "Keep nuclide-specific activity, total elemental uranium mass and whole-compound mass distinct. The U-238 exchanges are conditional on the exact native English isotope identity, source compartment and verified Radioactivity/kBq chain; official Chinese 铀α and broad synonyms/CAS do not identify a laboratory analyte. Keep the official display when linked, but never assign gross-alpha, total-U or U-234 measurements to U-238. The Uranium Mass/kg row likewise needs independently measured elemental-U mass, not alpha activity. No isotope or equilibrium assumptions."
      evidence: "Laboratory nuclide data and reference date"
    - id: coverage
      applies_to: "environment and shared plant"
      requirement: "Document actual routes, startup/shutdown/unplanned releases, sampled intervals, other production lines, waste fate, legacy contamination and excluded infrastructure. Do not claim complete environmental coverage when fields remain unknown."
      evidence: "Source register; actual environmental monitoring and waste records"
validation_rules:
  - rule_id: reference_complete
    applies_to: "final_product"
    rule: "Require exactly one accepted reference output with whole-UF6 Mass/kg basis, independent D and all chemical, isotope and provider qualifiers; reject enriched/depleted or unspecified uranium identity."
    source_ids:
      - cameco-delivery
  - rule_id: quantity_agreement
    applies_to: "all inventory rows"
    rule: "Reference quantity, inventory denominator, collection aggregation and calculations must use the same per-1-kg-whole-UF6 basis in both languages. Whole compounds, elemental uranium, water and activity must not substitute for one another."
    source_ids: []
  - rule_id: atomic_and_species
    applies_to: "all inventory rows"
    rule: "Each card is one exchange with its own source, direction, type, property and unit. Verify actual medium/submedium and fossil/biogenic origin. HF and total fluoride as F, kg-U and isotope kBq, captured dust and escaped PM are different quantities. Preserve measured biogenic CO2 when present; never infer NO2-equivalent NOx or combine overlapping PM fractions."
    source_ids:
      - cww-inventory
      - iaea-environment
  - rule_id: physical_integrity
    applies_to: "production"
    rule: "Physical mass/water/element accounts are retained before burden allocation; independently weighed outputs and equal internal transfer endpoints reconcile, with investigated residuals rather than fabricated closure or yield."
    source_ids: []
  - rule_id: source_coverage
    applies_to: "all inventory rows"
    rule: "Disclose unresolved flow identity and provider basis. Validate actual source load methods, detection limits, analytical species and nuclide dates; site ambient values, historic coefficients and operating licence limits are not replacement data. Unresolved relevant methods or quantities make the concrete dataset incomplete."
    source_ids:
      - cww-inventory
      - cnsc-case
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible civil natural-isotope UF6 supply models linked by evidenced physical identity and provider basis"
  excluded_use: "Chemical operating instructions; equipment design; enrichment/separation optimization; isotope or recipe defaults; proxy enriched/depleted products; kg UF6 as kWh electricity results"
  required_metadata: "Actual supplier and lot; UF6 chemical identity and accepted solid shipment state; independently evidenced natural isotopic origin and measured isotope assay with date and uncertainty; whole-product purity/impurities and moisture basis; accepted net commercial contents include actual measured incidental water/impurities within the acceptance specification, not an anhydrous pure-UF6 equivalent; exclude all packing and carrier tare; positive accepted net whole-product D excluding tare; contained-U mass distinct from UF6 mass; receiving gate, period, region and provider quantity; actual utilities/chemicals; source-specific waste and release compartments; analytical detection limits, activity reference dates and attribution/allocation. No assumed natural abundance, stoichiometric purity, water fraction, yield, recipe, emission factor or energy demand."
  required_quality_disclosure: "Pending identity/provider quantities; measurement coverage and detection limits; nuclide reference date; species/compartment; burden attribution and physical balances; upstream/infrastructure gaps"
  update_trigger: "Reverify changes in supplier, delivery state, chemical/isotope qualification, route, metering, environmental licence/method or background data"
data_sources:
  - id: "cameco-delivery"
    type: "literature"
    reference: "Cameco Fuel Services, Port Hope Conversion Facility, web snapshot 2026-10-13, paragraph on purified UO3 and UF6/UO2 destinations; https://www.camecofuel.com/business/port-hope-conversion-facility"
    used_for: "Producer first-party qualitative delivery boundary only; no universal recipe, isotope assay or factor."
  - id: "cnsc-case"
    type: "official_guidance"
    reference: "CNSC, Regulatory Oversight Report for Uranium and Nuclear Substance Processing Facilities in Canada: 2021, §§3.1–3.2, Appendix I Port Hope/Table I-6 and Liquid effluent; https://www.cnsc-ccsn.gc.ca/eng/reactors/regulating-nuclear-reactors-power-plants/regulatory-oversight-reports/uranium-and-nuclear-substance-processing-facilities/2021/"
    used_for: "Historical Canadian facility observation: distinct UO3/UO2/UF6 gates, monitored uranium/fluoride and process/non-process water. No emission quantity, chemistry recipe or licence condition generalized."
  - id: "cww-inventory"
    type: "official_guidance"
    reference: "European Commission JRC, CWW BREF, 2016, Scope printed xxiii/PDF29; Chapter4 printed540/PDF570, BAT2 printed543/PDF573, BAT3–4 printed544/PDF574; https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf"
    used_for: "Horizontal chemical-sector stream inventory and representative load monitoring; actual jurisdiction and installation scope assessed separately. Not uranium-specific BAT recipes, radionuclide methods or emission defaults; BAT-AEL yearly concentrations do not establish emission mass."
  - id: "iaea-environment"
    type: "official_guidance"
    reference: "IAEA, Safety of Nuclear Fuel Cycle Facilities, SSR-4, 2017, §1.8 printed3/PDF23; §§9.104–9.108 printed111/PDF131; https://www-pub.iaea.org/MTCD/Publications/PDF/PUB1791_web.pdf"
    used_for: "Fuel-cycle environmental effluent monitoring and characterized waste generation/storage/transfer records; used only for high-level accounting. No preparation, isotope-separation conditions, equipment design, activity or equilibrium defaults."
  - id: "vattenfall-lca"
    type: "literature"
    reference: "Vattenfall, Summary of certified EPD of Electricity from Vattenfall Nordic Nuclear Power Plants, S-P-00923, 2016-12-31, printed/PDF2; https://group.vattenfall.com/se/siteassets/sverige/ringhals/in-english/environment/epd-summary-vattenfall-nuclear-power-2016.pdf"
    used_for: "Historical EPD expired 2019-12-31; prior civil LCA stage boundary evidence only. Its declared unit is electricity, so kWh results, plant lifetime and full fuel-cycle coefficients cannot be moved to kg UF6; does not certify this PCR."
  - id: "cameco-delivery-state"
    type: "literature"
    reference: "Cameco U101 - Refining & Conversion, web snapshot 2026-10-13, steel transport cylinders paragraph; https://www.cameco.com/uranium_101/fuel-processing/refining-conversion/"
    used_for: "Producer first-party solid UF6 shipment in specialized containers; no numerical state conditions, operating instructions, design, isotope ratios or energy-equivalent defaults adopted."
