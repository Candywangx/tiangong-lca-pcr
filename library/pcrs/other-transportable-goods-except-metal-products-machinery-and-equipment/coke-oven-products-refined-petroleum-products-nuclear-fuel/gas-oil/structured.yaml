allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "unit operations and independently metered streams"
    rule: "First avoid allocation by subdividing the refinery into feed preparation, distillation, conversion/treatment, blending, and terminal operations and directly assigning measured inputs and releases where causal records exist."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_relationship
    applies_to: "inseparable multifunctional operations"
    rule: "When subdivision or system expansion is not practicable, use a documented, quantifiable physical relationship relevant to the function delivered; explain why the relationship represents the burden driver."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_refinery_shared_burdens
    applies_to: "refinery-wide utilities, shared treatment, and upstream crude burdens"
    rule: "State the refinery model, co-product set, allocation basis, time period, prices or physical data where applicable, treatment of negative or zero-value outputs, and a sensitivity case for materially influential choices; do not silently apply mass, energy, or economic allocation."
    source_ids:
      - jrc-refinery-allocation-2017
      - eu-pef-2021-2279
  - rule_id: allocation_product_or_waste_status
    applies_to: "recovered sulphur, off-specification material, sludges, spent catalysts, and other secondary outputs"
    rule: "Classify each output from its documented legal and market destination; apply the chosen allocation or waste-treatment rule consistently and prevent double counting of rework or recovered products."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_biogenic_components
    applies_to: "blended gas oil containing biogenic material"
    rule: "Attach component-specific upstream burdens to the measured fossil and biogenic component quantities before allocating shared blending and terminal burdens; disclose the mass- or volume-share conversion."
    source_ids:
      - unsd-cpc-3-33360
      - eu-fuel-quality-98-70-consolidated-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_feedstock_receipt
      process_id: "feedstock_receipt_and_preparation"
      flow_role: "received and prepared refinery feed"
      record_type: "custody-transfer, assay, and stock record"
      raw_fields: "supplier; origin; crude or feed grade; fossil or biogenic status; mass; volume; density; temperature; water and sediment; receipt date; tank; stock change"
      collection_method: "calibrated custody meter, weighbridge, laboratory assay, and tank reconciliation"
      unit: "kg; m3; kg/m3"
      frequency: "each receipt and daily tank balance"
      temporal_coverage: "complete reporting period plus opening and closing stock"
      site_scope: "represented refinery feed system"
      aggregation_rule: "reconcile receipts, transfers, removals, and stock change; convert volume only at matched density and temperature"
      quality_evidence: "calibration; assay report; supplier document; signed stock reconciliation"
    - protocol_id: cp_distillation_streams
      process_id: "primary_distillation"
      flow_role: "atmospheric and vacuum feed and product streams"
      record_type: "unit operating and laboratory record"
      raw_fields: "unit; stream id; atmospheric or vacuum origin; mass flow; density; temperature; distillation characterization; sulphur; destination; operating hours"
      collection_method: "calibrated flow meters, laboratory sampling, and data historian"
      unit: "kg; kg/h; kg/m3; mg/kg"
      frequency: "continuous with batch or shift quality sample"
      temporal_coverage: "complete reporting period"
      site_scope: "every atmospheric and vacuum train contributing to gas oil"
      aggregation_rule: "time-integrate streams and reconcile all unit inputs, products, internal recycle, water, and losses"
      quality_evidence: "meter calibration; sample chain; historian completeness; unit balance sign-off"
    - protocol_id: cp_treatment_operation
      process_id: "conversion_and_hydrotreating"
      flow_role: "treatment feed, hydrogen, catalysts, utilities, treated product, and co-products"
      record_type: "unit operation, issue, and quality record"
      raw_fields: "unit; technology; feed streams; output streams; mass; hydrogen; catalyst; energy; water; inlet and outlet sulphur; density; co-product destination; operating hours"
      collection_method: "meters, laboratory results, catalyst inventory, and unit historian"
      unit: "kg; kg/h; kWh; MJ; m3; mg/kg"
      frequency: "continuous or per batch with period inventory reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "every contributing conversion or treatment unit"
      aggregation_rule: "integrate by unit, reconcile feed and outputs, and preserve stream routing to blending"
      quality_evidence: "meter calibration; lab QA; catalyst issue records; signed unit balance"
    - protocol_id: cp_blending_and_quality
      process_id: "blending_and_product_finishing"
      flow_role: "fossil components, biogenic components, additives, finished gas oil, and off-specification material"
      record_type: "blend recipe, meter, tank, and certificate-of-analysis record"
      raw_fields: "batch; component identity and origin; mass; volume; density and temperature; fossil or biogenic status; blend-share basis; additives; sulphur; grade; intended market; applicable specification; disposition"
      collection_method: "calibrated component meters, tank reconciliation, and accredited or controlled laboratory analysis"
      unit: "kg; m3; kg/m3; mg/kg; mass or volume percent"
      frequency: "each blend batch or continuous-blend campaign"
      temporal_coverage: "all released and off-specification production in reporting period"
      site_scope: "all blending systems contributing to reference product"
      aggregation_rule: "reconcile component inputs to finished, rework, downgraded, waste, and stock outputs; calculate shares on declared basis"
      quality_evidence: "meter calibration; recipe authorization; certificate of analysis; batch release"
    - protocol_id: cp_storage_and_delivery
      process_id: "storage_and_terminal_delivery"
      flow_role: "storage input, stock change, returns, losses, and loaded reference product"
      record_type: "tank gauge and custody-transfer record"
      raw_fields: "tank; batch; opening and closing stock; transfers; returns; loaded mass and volume; density; temperature; loading point; delivery mode; time; grade"
      collection_method: "calibrated tank gauging and custody-transfer meter"
      unit: "kg; m3; kg/m3"
      frequency: "each transfer and loading; daily stock"
      temporal_coverage: "complete reporting period plus opening and closing stock"
      site_scope: "represented refinery or connected terminal"
      aggregation_rule: "loaded output equals inputs plus net stock withdrawal minus returns, rework, wastes, and losses on a consistent mass basis"
      quality_evidence: "meter calibration; tank table; delivery ticket; signed stock balance"
    - protocol_id: cp_unit_utilities
      process_id: "all_included_processes"
      flow_role: "electricity, fuel, steam, water, and material utilities"
      record_type: "meter, invoice, and engineering balance"
      raw_fields: "unit; utility identity; quantity; meter; allocation tag; operating hours; provider; delivery state"
      collection_method: "dedicated meter preferred; documented engineering balance or invoice reconciliation otherwise"
      unit: "native flow unit"
      frequency: "continuous or invoice period"
      temporal_coverage: "complete reporting period"
      site_scope: "all included units and shared systems"
      aggregation_rule: "directly assign dedicated use; allocate only documented shared use under section 7"
      quality_evidence: "meter calibration; invoice; balance owner; allocation worksheet"
    - protocol_id: cp_direct_emissions
      process_id: "all_included_processes"
      flow_role: "direct releases to air and water"
      record_type: "continuous monitor, sample, flare, vent, and loss-model record"
      raw_fields: "source; pollutant; concentration; flow; duration; control status; detection limit; calculation method; release compartment"
      collection_method: "continuous monitoring, representative sampling, or documented site-specific engineering calculation"
      unit: "kg; mg/Nm3; mg/L and supporting activity units"
      frequency: "continuous or permit/sample frequency; event-specific for flares and incidents"
      temporal_coverage: "complete reporting period including abnormal events"
      site_scope: "all included units, tanks, loading points, and final discharges"
      aggregation_rule: "integrate pollutant mass after controls and prevent double counting internal transfers to treatment"
      quality_evidence: "monitor calibration; accredited analysis; event log; calculation review"
    - protocol_id: cp_waste_and_water_records
      process_id: "all_included_processes"
      flow_role: "wastewater, sludge, spent catalyst, tank bottoms, and other waste"
      record_type: "transfer, treatment, and shipment record"
      raw_fields: "source unit; material identity; mass or volume; composition; hazardous status; destination; recovery or disposal route; date"
      collection_method: "meter, scale, manifest, and treatment-plant reconciliation"
      unit: "kg; m3"
      frequency: "each transfer or shipment"
      temporal_coverage: "complete reporting period"
      site_scope: "all included units and on-site treatment interfaces"
      aggregation_rule: "sum by source, material, and destination; reconcile internal transfer against final treatment output"
      quality_evidence: "scale calibration; waste manifest; treatment acceptance; mass balance"
    - protocol_id: cp_refinery_yield_balance
      process_id: "all_included_processes"
      flow_role: "refinery products, co-products, internal transfers, and stock"
      record_type: "production accounting record"
      raw_fields: "stream; source unit; destination; mass; density; stock change; saleable or waste status; price or physical allocation variable when used"
      collection_method: "reconciled refinery production accounting"
      unit: "kg; declared allocation variable"
      frequency: "daily or accounting period"
      temporal_coverage: "complete reporting period"
      site_scope: "represented refinery and product slate"
      aggregation_rule: "close refinery-wide mass and yield balance before normalization and allocation"
      quality_evidence: "signed production balance; allocation dataset; discrepancy explanation"
  calculation_rules:
    - id: normalize_to_reference_mass
      applies_to: "all inventory rows"
      rule: "normalized amount = reporting-period amount divided by net kg of loaded reference gas oil"
      inputs:
        - "relevant collection protocol"
        - cp_storage_and_delivery
      output: "amount per 1 kg loaded gas oil"
      source_ids: []
    - id: convert_volume_with_density
      applies_to: "volume-based feed, component, stock, and delivery records"
      rule: "mass = observed volume multiplied by density corrected or measured at the same declared reference temperature"
      inputs:
        - cp_feedstock_receipt
        - cp_blending_and_quality
        - cp_storage_and_delivery
      output: "kg on a consistent temperature basis"
      source_ids: []
    - id: reconcile_process_mass
      applies_to: "each included unit and the refinery-wide balance"
      rule: "input mass plus opening stock = product, co-product, waste, direct mass release, and closing stock; explain residuals above the facility QA criterion"
      inputs:
        - "all process collection protocols"
        - cp_refinery_yield_balance
      output: "signed unit and refinery mass-balance result"
      source_ids: []
    - id: calculate_biogenic_share
      applies_to: "finished blended gas oil"
      rule: "biogenic share = measured biogenic component quantity divided by total finished blend quantity on one declared mass or volume basis; apply component-specific density before converting bases"
      inputs:
        - cp_blending_and_quality
      output: "biogenic component share and component-resolved upstream inventory"
      source_ids:
        - unsd-cpc-3-33360
        - eu-fuel-quality-98-70-consolidated-2023
    - id: calculate_sulphur_balance
      applies_to: "distillation, treatment, blending, and final product"
      rule: "reconcile sulphur entering in feed and components with sulphur in products, recovered sulphur, wastes, water, and air releases using measured contents and masses"
      inputs:
        - cp_distillation_streams
        - cp_treatment_operation
        - cp_blending_and_quality
        - cp_direct_emissions
        - cp_waste_and_water_records
      output: "sulphur balance and unexplained residual"
      source_ids:
        - eu-refining-bat-2014-738
    - id: apply_allocation
      applies_to: "multifunctional refinery operations"
      rule: "allocated burden = unassigned shared burden multiplied by the documented allocation factor after direct assignment; factors across the declared co-product set shall reconcile to one"
      inputs:
        - cp_refinery_yield_balance
        - cp_unit_utilities
        - cp_direct_emissions
      output: "allocated inventory and sensitivity results per product"
      source_ids:
        - eu-pef-2021-2279
        - jrc-refinery-allocation-2017
    - id: calculate_net_loaded_output
      applies_to: "storage and terminal delivery"
      rule: "net loaded mass = custody-transfer loadings minus documented returns, with tank stock change, rework, wastes, and losses reconciled for the same period"
      inputs:
        - cp_storage_and_delivery
      output: "kg reference product at declared gate"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and blend components"
      requirement: "Product grade, intended market, specification, origin, route, sulphur, density and temperature, biogenic share basis, and delivery gate shall be complete and internally consistent."
      evidence: "batch release, certificate of analysis, blend recipe, and delivery ticket"
    - id: dq_refinery_configuration
      applies_to: "process map"
      requirement: "List every contributing unit, technology, stream connection, operating period, and bypass; justify every conditional exclusion."
      evidence: "current process-flow diagram, unit roster, historian tags, and signed applicability review"
    - id: dq_measurement
      applies_to: "mass, volume, density, quality, utility, and emission records"
      requirement: "Use calibrated instruments or controlled analytical methods; record detection limits, missing periods, substitutions, and corrections."
      evidence: "calibration certificates, laboratory QA, data-completeness report, and correction log"
    - id: dq_temporal_reconciliation
      applies_to: "production period"
      requirement: "Feed, production, utility, emissions, waste, stock, and delivery data shall cover the same period and include opening and closing stock."
      evidence: "period-close reconciliation and timestamp coverage report"
    - id: dq_allocation
      applies_to: "multi-output refinery burdens"
      requirement: "Preserve direct assignment, co-product set, allocation factors and variables, data period, and sensitivity results in an auditable worksheet."
      evidence: "allocation workbook, production balance, price or physical-variable source, and reviewer sign-off"
    - id: dq_upstream_matching
      applies_to: "purchased product flows"
      requirement: "Each provider dataset shall match the declared origin, technology, quality, and delivery state or disclose the mismatch and sensitivity."
      evidence: "provider metadata and applicability assessment"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Confirm the selected flow UUID, Mass property UUID, Units of mass UUID, 1 kg reference amount, and all required qualifiers are present."
    source_ids:
      - unsd-cpc-3-33360
  - rule_id: validate_category_scope
    applies_to: "dataset applicability"
    rule: "Reject use as a category-wide dataset when the package represents only one regional diesel grade, marine grade, supplier formulation, or neat biodiesel without an explicit narrower scope."
    source_ids:
      - unsd-cpc-3-33360
      - eu-fuel-quality-98-70-consolidated-2023
  - rule_id: validate_route_and_boundary
    applies_to: "process coverage"
    rule: "Confirm feed origin, refinery configuration, atmospheric and vacuum contribution, conversion and hydrotreating status, blending, storage, and loaded gate; every omitted conditional unit shall have a documented non-applicability reason."
    source_ids:
      - eu-refining-bat-2014-738
  - rule_id: validate_quality_measurements
    applies_to: "finished product and contributing streams"
    rule: "Confirm sulphur and density values have sample or record identifiers, methods, units, reference temperature where relevant, and the same product-period basis as the inventory."
    source_ids:
      - eu-fuel-quality-98-70-consolidated-2023
  - rule_id: validate_biogenic_content
    applies_to: "blended gas oil"
    rule: "Confirm component identity, renewable feedstock route, measured quantity, mass-or-volume basis, density conversion where used, and separate upstream provider; prohibit an undeclared zero assumption."
    source_ids:
      - unsd-cpc-3-33360
      - eu-fuel-quality-98-70-consolidated-2023
  - rule_id: validate_mass_and_sulphur_balance
    applies_to: "unit and refinery balances"
    rule: "Require reconciled mass and sulphur balances, documented residuals, and consistent stock changes before normalization."
    source_ids:
      - eu-refining-bat-2014-738
  - rule_id: validate_allocation
    applies_to: "multi-output burdens"
    rule: "Confirm direct assignment precedes allocation, the co-product set and factors reconcile, the chosen relationship is justified, and materially influential allocation choices have a sensitivity result."
    source_ids:
      - eu-pef-2021-2279
      - jrc-refinery-allocation-2017
  - rule_id: validate_releases_and_wastes
    applies_to: "foreground inventory completeness"
    rule: "Confirm direct air and water releases, internal treatment transfers, final discharges, spent catalysts, sludges, and terminal losses are covered without double counting."
    source_ids:
      - eu-refining-bat-2014-738
  - rule_id: validate_upstream_providers
    applies_to: "purchased inputs"
    rule: "Confirm crude, secondary feed, hydrogen, utilities, additives, and biogenic components have matching provider datasets or an explicit documented data gap."
    source_ids:
      - eu-refining-bat-2014-738
published_dataset_profile:
  dataset_role: "unit_process or aggregated refinery-gate production dataset with transparent process and allocation detail"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "gas-oil production and supply studies whose feedstock origin, refinery route, product grade, intended market, blend composition, geography, period, allocation, and terminal gate match the dataset"
  excluded_use: "unqualified global gas-oil proxy; substitution for neat biodiesel; automatic substitution for a regional road-diesel or marine-fuel grade; combustion or downstream distribution not modelled as separate stages"
  required_metadata: "reference-flow UUIDs; CPC scope; refinery and terminal geography; reporting period; feedstock origin; refinery configuration; atmospheric and vacuum contribution; treatment route; sulphur; density and temperature; biogenic share basis; specification; intended market; allocation; delivery gate"
  required_quality_disclosure: "measurement coverage and calibration; mass and sulphur reconciliation; stock treatment; emission and waste coverage; provider matching; allocation factors and sensitivity; data gaps and substitutions"
  update_trigger: "material change in crude slate, refinery configuration, contributing stream routes, hydrotreating, product specification, sulphur or blend formulation, allocation method, terminal gate, provider datasets, or reporting-period representativeness"
