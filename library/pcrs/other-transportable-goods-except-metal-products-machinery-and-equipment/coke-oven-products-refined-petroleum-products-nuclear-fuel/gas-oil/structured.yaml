measurement_rules:
  - id: reference_mass
    applies_to: "reference product and product intermediates"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net mass and normalize all inventory results to 1 kg of gas oil loaded at the declared delivery gate."
  - id: volume_to_mass
    applies_to: "volume-based feed, blend, stock, or delivery records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert volume to mass only with the measured or specification-supported density for the same batch and a stated reference temperature; do not apply an undeclared generic diesel density."
  - id: sulphur_measurement
    applies_to: "feed streams, treated streams, blend components, and finished gas oil"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "mg/kg or declared mass fraction"
    rule: "Record sampling point, analytical method, reporting basis, and measured sulphur content; a jurisdiction-specific limit is a qualifier, not a category-wide default."
  - id: biogenic_share
    applies_to: "gas oil containing biodiesel or another biogenic component"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg/kg or explicitly declared volume fraction"
    rule: "State component identity, renewable feedstock route, measured blend quantity, and whether the reported share is mass- or volume-based; keep fossil and biogenic upstream burdens separately traceable."
  - id: energy_conversion
    applies_to: "optional energy-based reporting"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "MJ/kg"
    rule: "Use a batch-, grade-, or supplier-specific net calorific value and state its source and measurement basis; retain mass as the PCR reference property."
process_map:
  - id: feedstock_receipt_and_preparation
    name: "Feedstock receipt and preparation"
    inclusion: "required"
    inclusion_condition: "Always; include desalting or equivalent preparation when operated"
    role: "foreground"
    quantitative_reference: "prepared refinery feed"
  - id: primary_distillation
    name: "Atmospheric and vacuum distillation"
    inclusion: "required"
    inclusion_condition: "Atmospheric distillation is required; include vacuum distillation when a vacuum fraction contributes to represented gas oil or its conversion feed"
    role: "foreground"
    quantitative_reference: "gas-oil-range streams leaving distillation"
  - id: conversion_and_hydrotreating
    name: "Conversion and hydrotreating"
    inclusion: "conditional"
    inclusion_condition: "Include every cracking, hydrocracking, hydrotreating, sweetening, or other treatment unit whose stream contributes to the final gas oil"
    role: "foreground"
    quantitative_reference: "treated gas-oil blend components"
  - id: blending_and_product_finishing
    name: "Blending and product finishing"
    inclusion: "required"
    inclusion_condition: "Always; include all fossil and biogenic blend components and additives"
    role: "foreground"
    quantitative_reference: "finished gas oil sent to storage"
  - id: storage_and_terminal_delivery
    name: "Storage and terminal delivery"
    inclusion: "required"
    inclusion_condition: "Always to the declared loaded-product gate"
    role: "foreground"
    quantitative_reference: "net loaded reference product"
