allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "shared refinery or terminal operations"
    rule: "Avoid allocation by separately metering or otherwise subdividing aviation-gasoline blending, testing, storage, loading, and emission-control activities whenever technically possible."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_physical_driver
    applies_to: "non-subdividable shared utilities and operations"
    rule: "When subdivision is not possible, allocate using a documented causal physical driver such as metered energy, equipment operating time, batch mass throughput, tank occupancy, or loading throughput. Apply the same driver consistently to inputs and direct emissions."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "remaining multifunctional burdens"
    rule: "Use another relationship, including economic allocation, only when subdivision and a relevant physical relationship are not feasible. Disclose values, period, formula, affected flows, and a sensitivity result."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_rework_and_waste
    applies_to: "rework, off-spec product, recovered vapor, and waste"
    rule: "Return-to-blend material remains within the mass balance without an avoided-product credit. Assign waste treatment according to the declared treatment route and do not credit recovered material unless a separately justified downstream substitution model is included."
    source_ids:
      - eu-pef-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_batch_components
      process_id: "blending_release"
      flow_role: "base_blend_components; grade_specific_additives"
      record_type: "batch tickets, tank gauges, mass meters, formulation sheets, supplier records"
      raw_fields: "batch_id; component_id; supplier_or_on_site_source; mass; unit; additive_function; specification; grade; lead_content; oxygenate_status; timestamp"
      collection_method: "reconcile charged masses to formulation and batch records"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all blending trains in scope"
      aggregation_rule: "sum accepted charges and normalize by released product mass"
      quality_evidence: "calibrated meter or gauge records; signed formulation; supplier lot traceability"
    - protocol_id: cp_blending_utilities
      process_id: "blending_release"
      flow_role: "blending_electricity; blending_water"
      record_type: "submeter, invoice, laboratory and cleaning logs"
      raw_fields: "meter_id; opening; closing; unit; timestamp; process_scope; allocation_driver"
      collection_method: "direct submetering preferred; otherwise documented subdivision or causal allocation"
      unit: "kWh; kg"
      frequency: "continuous or each billing period"
      temporal_coverage: "complete reporting period"
      site_scope: "all blending, testing, and cleaning operations in scope"
      aggregation_rule: "subtract unrelated loads, aggregate, then normalize by released product mass"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet"
    - protocol_id: cp_finished_product_release
      process_id: "blending_release"
      flow_role: "aviation_gasoline_output"
      record_type: "batch release certificate and custody or tank mass records"
      raw_fields: "batch_id; released_mass; unit; specification; edition; grade; lead_status; lead_content; oxygenate_status; test_results; release_decision; timestamp"
      collection_method: "verify specification-grade identity and sum only released product"
      unit: "kg"
      frequency: "each released batch"
      temporal_coverage: "complete reporting period"
      site_scope: "all released batches in scope"
      aggregation_rule: "sum released mass; retain rejected and reworked batches separately"
      quality_evidence: "signed certificate; laboratory accreditation or QA record; calibrated mass or density-volume measurement"
    - protocol_id: cp_waste_and_rework
      process_id: "blending_release"
      flow_role: "off_spec_and_spill_waste; blending_wastewater"
      record_type: "waste manifests, spill logs, wastewater meters, rework tickets"
      raw_fields: "event_or_batch_id; material_identity; mass_or_volume; density; destination; treatment_route; rework_status; timestamp"
      collection_method: "measure each exit and reconcile with batch mass balance"
      unit: "kg"
      frequency: "each event and monthly reconciliation"
      temporal_coverage: "complete reporting period"
      site_scope: "all blending-related waste and wastewater"
      aggregation_rule: "aggregate by material and route; convert volume with measured density"
      quality_evidence: "manifest or meter; incident record; treatment receipt; mass-balance reconciliation"
    - protocol_id: cp_direct_air_emissions
      process_id: "blending_release"
      flow_role: "blending_air_emissions"
      record_type: "monitoring results, leak surveys, throughput and engineering-calculation inputs"
      raw_fields: "source_id; substance; measured_concentration_or_factor; throughput; vapor_pressure; temperature; control_status; collection_efficiency; control_efficiency; downtime; result_mass; method"
      collection_method: "direct monitoring preferred; otherwise site-specific documented engineering calculation"
      unit: "kg"
      frequency: "monitoring schedule plus each material event"
