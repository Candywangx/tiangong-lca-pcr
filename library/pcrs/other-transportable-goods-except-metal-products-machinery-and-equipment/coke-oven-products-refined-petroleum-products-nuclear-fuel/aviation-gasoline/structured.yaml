validation_rules:
  - rule_id: validation_identity
    applies_to: "reference flow and dataset metadata"
    rule: "Fail if the Tiangong reference product flow UUID, Mass flow-property UUID, Units-of-mass UUID, specification, grade, lead status, oxygenate status, production location, or reporting period is missing or inconsistent."
    source_ids:
      - faa-ac-20-24d
      - astm-d910
  - rule_id: validation_reference_amount
    applies_to: "quantitative reference"
    rule: "Confirm that the plant-gate product output is exactly 1 kg after normalization and that all volume-to-mass conversions retain batch density and temperature evidence."
    source_ids:
      - astm-d910
  - rule_id: validation_process_coverage
    applies_to: "process inventory"
    rule: "Confirm that blending and release plus storage and loading are represented, or explicitly document why a separately linked process replaces one of them without creating a gap."
    source_ids:
      - epa-ap42-5-1
      - epa-ap42-5-2
  - rule_id: validation_mass_balance
    applies_to: "blending and storage"
    rule: "Reconcile component, product, inventory-change, rework, waste, wastewater, spill, and direct-loss masses over one consistent period; report the residual and investigation rather than forcing closure."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_direct_emissions
    applies_to: "air, water, and waste releases"
    rule: "Confirm that site-specific releases and control performance are collected or calculated and that a generic factor is not used without the required facility inputs and applicability statement."
    source_ids:
      - epa-ap42-5-1
      - epa-ap42-5-2
  - rule_id: validation_allocation
    applies_to: "shared operations"
    rule: "Confirm subdivision was attempted first and every remaining allocation has a stated driver, formula, period, affected flows, and sensitivity where another relationship is used."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_reasoned_estimates
    applies_to: "provisional ranges"
    rule: "Treat every reasoned_estimate range as a screening flag only. It must not replace foreground values, define a conformance limit, or support a public comparative assertion."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for finished aviation-gasoline production, publishable as a secondary_dataset or background_dataset after review"
  downstream_use: "Process and lifecyclemodel construction for specification-declared aviation gasoline at a refinery or terminal plant gate"
  allowed_use: "Attributional modelling of the declared production route, grade, facility geography, technology, and reporting period; upstream linkage to actual blend components and utilities"
  excluded_use: "Aircraft combustion or operation; downstream distribution beyond the declared gate; substitution for turbine fuel, automotive gasoline, another aviation-gasoline grade, or an unspecified geography or technology without review; public comparative assertions based on provisional ranges"
  required_metadata: "canonical PCR id; reference flow UUID; specification and edition; grade; lead and oxygenate status; formulation route; facility and geography; reporting period; batch coverage; component origin; storage and loading configuration; vapor-control status; allocation method; upstream dataset references"
  required_quality_disclosure: "primary-data share; technological, geographical, and time representativeness; precision; mass-balance residual; missing or modelled flows; provisional ranges used only for screening; source and control-method limitations"
  update_trigger: "Change in product specification or grade, formulation or additive package, lead or oxygenate status, component origin, facility technology, storage or vapor control, allocation method, reporting period representativeness, or any material data gap"
