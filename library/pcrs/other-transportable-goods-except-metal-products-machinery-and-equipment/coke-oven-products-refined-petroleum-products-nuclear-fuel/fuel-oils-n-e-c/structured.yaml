system_boundary:
  rules:
    - rule_id: boundary_route_completeness
      applies_to: "foreground route"
      rule: "Include every on-site operation needed to convert the declared starting condition into released fuel oil: applicable separation, conversion, treating, blending, quality control, storage, transfer, utilities, direct emissions, wastewater, and wastes."
      source_ids:
        - us-epa-ap42-petroleum-refining
    - rule_id: boundary_purchased_components
      applies_to: "received refinery streams and fuel components"
      rule: "Treat received components as product inputs with upstream datasets; do not claim cradle-to-gate coverage when their production is omitted."
      source_ids:
        - unsd-cpc-33370
    - rule_id: boundary_recursive_fuel_oil
      applies_to: "CPC 33370 input used in blending"
      rule: "Stop recursion at the received product input, retain its upstream dataset, and disclose the input and output grades so blending does not duplicate upstream production."
      source_ids:
        - mass-balance-identity
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream life cycle"
      rule: "Exclude transport beyond the facility gate, distributor or user storage, combustion, ash management, and end-use equipment unless the study explicitly extends the boundary and reports those stages separately."
      source_ids:
        - unsd-cpc-33370
    - rule_id: boundary_market_specification
      applies_to: "marine and other regulated grades"
      rule: "Apply market-specific quality and sulfur requirements only to the relevant declared grade; do not use a marine or heating-fuel specification to narrow the entire CPC category."
      source_ids:
        - iso-8217-2024
        - imo-sulphur-2020
        - astm-d396-21
boundary_abstraction:
  declared_starting_condition: "Identify every starting feed or purchased component as crude or unfinished oil, refinery intermediate, residual stream, distillate cutter stock, additive, or market fuel component; state whether it is produced on site or received across the foreground boundary."
  starting_condition_role: "The starting condition determines which separation, conversion, treating, and upstream supplier processes are foreground and which are linked upstream product systems."
  product_classification_scope: "CPC 3.0:33370 only; another fuel category, unfinished intermediate, or non-fuel petroleum product must not be relabelled to use this PCR."
  recursive_input_rule: "A purchased input that itself qualifies as CPC 33370 is recorded as a product input with its own upstream dataset and declared grade; its production is not recreated inside the receiving blending process."
  upstream_dataset_requirement: "Link crude oil, refinery intermediates, hydrogen, electricity, heat, water, chemicals, additives, and transport to representative upstream datasets, preserving supplier-specific data when available."
  disclosure: "Declare facility and geography, reporting period, product grade, feed and component basis, route units used, allocation approach, storage and transfer boundary, and any excluded refinery infrastructure or shared operation."
