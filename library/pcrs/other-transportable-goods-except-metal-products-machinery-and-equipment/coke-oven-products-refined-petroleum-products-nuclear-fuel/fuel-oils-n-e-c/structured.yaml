allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "shared refinery and blending operations"
    rule: "First avoid allocation by unit-process subdivision, separate metering, batch or tank tracing, or expanding the system for a separately modelled function when justified."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_physical
    applies_to: "unavoidable multi-output process"
    rule: "When subdivision or system expansion is not feasible, allocate using a demonstrated physical relationship that reflects how inputs and emissions change with the co-products, such as mass, energy content, or another causal process parameter."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_other_relationship
    applies_to: "process without a defensible physical relationship"
    rule: "Use an economic or other relationship only after documenting why physical allocation is not representative; state prices, geography, period, currency basis, and perform sensitivity to a plausible physical alternative."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: allocation_internal_rework
    applies_to: "off-specification internal return"
    rule: "Treat internal rework as an internal transfer without co-product credit; include the additional blending, utility, storage, and loss burdens incurred."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_disclosure
    applies_to: "all allocated burdens"
    rule: "Report each shared process, co-product, allocation key, denominator, assigned share, excluded flow, and sensitivity result so totals can be reproduced."
    source_ids:
      - eu-recommendation-2021-2279
dataset_production:
  collection_protocols:
    - protocol_id: cp_primary_refining_records
      process_id: "primary_refining"
      flow_role: "feeds, utilities, components, wastes"
      record_type: "meter, tank, laboratory, invoice, and waste records"
      raw_fields: "material id; source; opening and closing inventory; receipt; transfer; mass or volume; density; temperature; NCV; destination"
      collection_method: "reconcile meters and tank movements to unit operating logs"
      unit: "recorded mass, volume, energy, and test units"
      frequency: "batch and monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "included separation units and associated tanks"
      aggregation_rule: "sum by material and unit; calculate inventory-adjusted totals; normalize after allocation"
      quality_evidence: "calibrated meters; tank tables; laboratory certificates; signed reconciliation"
    - protocol_id: cp_conversion_treating_records
      process_id: "conversion_and_treating"
      flow_role: "feeds, auxiliaries, outputs, wastes, direct emissions"
      record_type: "unit feed and output meters; chemical logs; catalyst records; continuous monitoring; stack tests; waste manifests"
      raw_fields: "unit id; operating hours; feed; output; hydrogen; utilities; sulfur; controls; emissions; waste"
      collection_method: "reconcile unit records and emission calculations by operating campaign"
      unit: "recorded material, energy, concentration, and emission units"
      frequency: "continuous or batch records aggregated monthly"
      temporal_coverage: "same period as product output"
      site_scope: "each included conversion or treating unit"
      aggregation_rule: "aggregate only homogeneous routes; retain unit-level calculations before allocation"
      quality_evidence: "calibration; laboratory data; monitoring QA; calculation worksheets; waste receipts"
    - protocol_id: cp_blending_release_records
      process_id: "blending_and_quality_control"
      flow_role: "components, auxiliaries, released product, rework"
      record_type: "blend ticket, tank transfer, laboratory release, meter, invoice"
      raw_fields: "batch id; component ids and quantities; density; viscosity and temperature; sulfur; water; sediment; NCV; specification; pass or fail"
      collection_method: "reconcile batch recipe, tank movement, and release certificate"
      unit: "kg, recorded volume unit, MJ/kg, and property-specific test units"
      frequency: "every released batch"
      temporal_coverage: "all batches in reporting period"
      site_scope: "blending assets and release laboratory"
      aggregation_rule: "calculate saleable output only from passing batches; mass-weight reporting-period properties where valid"
      quality_evidence: "controlled recipe; calibrated meter; accredited or documented test method; release approval"
    - protocol_id: cp_storage_transfer_records
      process_id: "storage_and_transfer"
      flow_role: "stored product, energy, gate output, wastes, air releases"
      record_type: "tank gauges, transfer meters, loading tickets, energy meters, maintenance and emission-model inputs"
      raw_fields: "tank id; opening and closing stock; receipts; dispatch; density; temperature; NCV; heating energy; waste removal; tank and control parameters"
      collection_method: "reconcile stock and transfer records and apply documented substance-specific emission method"
      unit: "kg, recorded volume unit, MJ, kWh, and kg emission"
      frequency: "each transfer with monthly reconciliation"
      temporal_coverage: "same period as product output"
      site_scope: "included product tanks, pumps, and loading points"
      aggregation_rule: "gate output equals dispatch adjusted to consistent mass and energy basis; allocate tank emissions by defensible throughput or causal driver"
      quality_evidence: "meter calibration; tank table; loading ticket; model input review; inventory sign-off"
    - protocol_id: cp_onsite_utility_treatment_records
      process_id: "onsite_utilities_and_treatment"
      flow_role: "utility inputs, services, treatment outputs, direct emissions"
      record_type: "fuel and utility meters, operating logs, monitoring, discharge records, waste manifests"
      raw_fields: "system id; inputs; service output; fuel composition; emission controls; emissions; wastewater; sludge; destination"
      collection_method: "calculate service efficiencies and attributable outputs from reconciled operating records"
      unit: "recorded material, energy, service, discharge, and emission units"
      frequency: "continuous or shift records aggregated monthly"
      temporal_coverage: "same period as product output"
      site_scope: "included on-site support systems"
      aggregation_rule: "allocate delivered service and residuals using section 7 hierarchy"
      quality_evidence: "calibrated instruments; laboratory and monitoring QA; operator sign-off; disposal receipts"
  calculation_rules:
    - id: calc_saleable_energy
      applies_to: "released product batch"
      rule: "saleable energy (MJ) = saleable product mass (kg) × batch net calorific value (MJ/kg)"
      inputs:
        - "passing-batch mass"
        - "batch-matched NCV"
      output: "MJ saleable output"
      source_ids:
        - mass-balance-identity
    - id: calc_reference_normalization
      applies_to: "every foreground inventory amount"
      rule: "normalized amount = allocated reporting-period amount ÷ total saleable output energy; multiply by 1 MJ reference amount"
      inputs:
        - "allocated amount"
        - "saleable output MJ"
      output: "amount per 1 MJ NCV output"
      source_ids:
        - mass-balance-identity
    - id: calc_liquid_mass
      applies_to: "volume-metered liquid"
      rule: "mass = corrected volume × density at the same reference condition; do not mix density and volume reference temperatures"
      inputs:
        - "raw volume"
        - "meter correction"
        - density
        - "reference temperature"
      output: "kg material"
      source_ids:
        - astm-d396-21
    - id: calc_mass_reconciliation
      applies_to: "each unit, blend batch, and storage system"
      rule: "inputs + opening inventory = products + co-products + wastes + measured releases + closing inventory + quantified unexplained difference"
      inputs:
        - "measured input"
        - output
        - waste
        - release
        - "and stock records"
      output: "balanced mass and disclosed residual"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_technological
      applies_to: "route and equipment"
      requirement: "Describe actual separation, conversion, treating, blending, storage, utility, and control technologies; do not combine materially different routes without separate results or weighting."
      evidence: "unit list, process diagram, operating records, and route weights"
    - id: dq_geographical
      applies_to: "foreground and upstream data"
      requirement: "Use facility geography for direct operations and representative supplier geography for purchased inputs; disclose geographic proxies."
      evidence: "site address, supplier origin, dataset geography, and proxy rationale"
    - id: dq_temporal
      applies_to: "all foreground records"
      requirement: "Use one internally consistent period not normally longer than 12 months, covering representative operating conditions; disclose shutdowns, start-ups, and abnormal flaring."
      evidence: "timestamps, production calendar, operating hours, and exception log"
    - id: dq_precision_completeness
      applies_to: "meters, tests, and balances"
      requirement: "Report meter and test method, calibration or QA status, sampling frequency, missing-data treatment, mass-balance residual, and coverage of material and emission points."
      evidence: "calibration records, laboratory QA, completeness table, and reconciliation workbook"
    - id: dq_method_consistency
      applies_to: "allocation and normalization"
      requirement: "Apply one declared allocation hierarchy and the NCV reference basis consistently across all processes; retain unrounded calculation inputs."
      evidence: "allocation workbook, NCV records, and normalization checks"
validation_rules:
  - rule_id: validate_category_identity
    applies_to: "product and reference flow"
    rule: "Fail if the dataset lacks CPC 33370 identity and all Required qualifiers, or if the product is an unfinished stream or belongs to a more specific fuel category."
    source_ids:
      - unsd-cpc-33370
      - astm-d396-21
      - iso-8217-2024
  - rule_id: validate_reference_identity
    applies_to: "Tiangong reference flow"
    rule: "Require product flow 6908344a-d905-4a65-a5e6-9511198fde88, NCV property 93a60a56-a3c8-11da-a746-0800200c9a66, energy unit group 93a60a57-a3c8-11da-a746-0800200c9a66, and reference unit MJ without embedded dataset version."
    source_ids: []
  - rule_id: validate_route_completeness
    applies_to: "process map"
    rule: "Require both required processes and every conditional process triggered by the declared route; fail if a route unit, direct emission point, waste, or attributable utility is omitted without quantified justification."
    source_ids:
      - us-epa-ap42-petroleum-refining
  - rule_id: validate_energy_normalization
    applies_to: "reference output"
    rule: "Recalculate saleable MJ from passing-batch mass and NCV and confirm every inventory row uses the same allocated denominator."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_mass_balance
    applies_to: "unit, blend, and storage balances"
    rule: "Recalculate the mass reconciliation; report the signed residual and fail when it exceeds the facility's reviewed measurement uncertainty without investigation and approval."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_allocation
    applies_to: "co-products and shared systems"
    rule: "Confirm the allocation hierarchy, reproduce assigned shares, and require sensitivity when an economic or non-physical fallback is used."
    source_ids:
      - eu-recommendation-2021-2279
  - rule_id: validate_emission_resolution
    applies_to: "direct air and water releases"
    rule: "Require substance-specific flows, source or calculation method, control status, and no double counting between process units and on-site utilities."
    source_ids:
      - us-epa-ap42-petroleum-refining
  - rule_id: validate_market_requirements
    applies_to: "declared regulated grade"
    rule: "Apply the declared market specification and sulfur limit only to the relevant product; for marine fuel, verify declared MARPOL area and applicable sulfur requirement."
    source_ids:
      - iso-8217-2024
      - imo-sulphur-2020
  - rule_id: validate_data_quality
    applies_to: "foreground package"
    rule: "Report checks performed, checks skipped, findings, completeness, temporal and geographic fit, technological representativeness, precision, and unresolved evidence gaps."
    source_ids:
      - eu-recommendation-2021-2279
published_dataset_profile:
  dataset_role: "Foreground production data package for marketable CPC 33370 fuel oil at a refinery or blending-facility gate."
  downstream_use: "Construction of Tiangong flow, process, and lifecyclemodel projections and comparative or accounting studies that preserve the declared grade and route."
  allowed_use: "Use for the represented facility, period, route, product grade, allocation, and gate condition; broader use requires an explicit representativeness assessment."
  excluded_use: "Do not use as a generic combustion dataset, crude-oil dataset, diesel or gas-oil dataset, marine-fuel default without matching qualifiers, or substitute for a route or geography not represented."
  required_metadata: "PCR id; CPC code; product and commercial grade; reference UUIDs; facility and geography; period; route; feed and component basis; NCV; sulfur; density and temperature; viscosity and test temperature; water and sediment; specification; allocation; gate; data owner and review status."
  required_quality_disclosure: "Primary versus proxy data shares; source and age of upstream datasets; meter and laboratory QA; missing-data treatment; mass-balance residuals; allocation sensitivities; excluded operations; abnormal events; unresolved identity and quantitative-evidence gaps."
  update_trigger: "Material change in product grade, component basis, route technology, sulfur or other specification, facility or geography, allocation, reference-flow identity, reporting period representativeness, or governing classification and market requirements."
