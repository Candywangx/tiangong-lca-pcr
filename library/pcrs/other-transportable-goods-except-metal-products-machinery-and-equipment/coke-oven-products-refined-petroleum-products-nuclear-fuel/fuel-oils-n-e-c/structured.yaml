    applies_to: "saleable product and fuel components"
    required_property_ref:
      name: "Net calorific value and mass"
      uuid: ""
    required_unit: "MJ and kg"
    rule: "Record product mass and net calorific value separately; calculate output energy as saleable mass multiplied by batch-matched net calorific value. Do not substitute gross calorific value without a documented conversion."
