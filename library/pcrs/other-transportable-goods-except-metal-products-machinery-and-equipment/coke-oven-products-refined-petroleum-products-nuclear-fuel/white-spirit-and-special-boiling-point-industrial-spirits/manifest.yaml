review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scientific_review:
    status: "not_independently_reviewed"
    limitation: "Independent identity, bilingual, physical-accounting and evidence review does not establish scientific approval; controller approval remains pending."
  mapping_review:
    suggested_relationship: "narrower"
    explanation: "Bulk petroleum mixtures through fractionation/optional HDS or hydrogenation only; extraction type 2, synthetic routes, isolated species and packaged/formulated products excluded. Shared alias/catalog integration belongs to controller."
  identity_review:
    status: "reference_identity_verified"
    reference_flow: "5fb93398-c4c6-4b60-bb16-ca956bc35985"
    reference_property: "93a60a56-a3c8-11da-a746-0800200b9a66"
    reference_unit_group: "93a60a57-a4c8-11da-a746-0800200c9a66"
    limitations: "Actual grade assay and provider route/quantity remain data-package requirements; reference record has no CAS or fixed catalytic route; white spirit 135-200 degC and flash above 30 degC, SBP 30-200 degC without that flash condition. No grade assay or quantity invented."
  unresolved_flow_uuids:
    - row_id: "hydrogen"
      selected_flow: "Hydrogen gas for catalytic solvent treatment"
      reason: "Successful bounded Hydrogen/Chinese/CAS/gaseous searches: near chemicals and route-specific ethylene or coal-MTO H2; no route-independent exact supplied gas adopted. Provider route and purity must establish compatible H2 identity."
    - row_id: "steam"
      selected_flow: "Process steam supplied to solvent fractionation"
      reason: "11.0 and 0.45 MPaG steam are hard pressure limited; paper-specific industrial steam is incompatible; process steam 41a70607 is deodorisation stripping, not generic distillation supply. Mass or MJ cannot establish delivery state or net heat; public process-steam d71fef59 uses NCV/MJ and unspecified route, not verified supply/return useful enthalpy."
    - row_id: "refinery_fuel_gas"
      selected_flow: "Refinery fuel gas supplied from an external refinery unit"
      reason: "Gas oil is liquid; raw distilled gas, methane-only and ethylene-cracking gas do not establish the actual mixed refinery fuel stream."
    - row_id: "nimo_catalyst"
      selected_flow: "Nickel-molybdenum oxide catalyst on alumina for hydrotreating"
      reason: "Alloy and smelting intermediate are not supported Ni/Mo oxide/alumina catalyst formulation."
    - row_id: "como_catalyst"
      selected_flow: "Cobalt-molybdenum oxide catalyst on alumina for hydrodesulfurization"
      reason: "Cadmium intermediate is not Co/Mo oxide/alumina catalyst."
    - row_id: "light_cut"
      selected_flow: "Light petroleum distillate separated from solvent fractionation"
      reason: "Naphtha 91cc5451 is hard crude atmospheric-distillation side-cut, not a solvent-redistillation side fraction; HC/reformer streams have other routes."
    - row_id: "heavy_cut"
      selected_flow: "Heavy petroleum distillate separated from solvent fractionation"
      reason: "Vacuum residue, gas oil and fuel oil do not establish actual solvent fractionation bottoms."
    - row_id: "sour_purge_gas"
      selected_flow: "Hydrogen-rich sour purge gas to refinery gas recovery"
      reason: "Crude distillation gas, cracked-gasoline hydrogenation gas or H2S constituent does not represent the actual whole H2-rich sour mixture."
    - row_id: "condensate_return"
      selected_flow: "Steam condensate returned to the utility supplier"
      reason: "Only milk-evaporation condensate returned; not utility steam condensate."
    - row_id: "exported_heat"
      selected_flow: "Useful heat exported from solvent manufacture"
      reason: "260672cc is natural-gas-boiler heat and b27a0de0 is garment-finishing heat; neither represents measured useful recovered solvent-process heat. Recovered energy 45abee18 uses NCV/MJ and lacks the actual useful-heat carrier/supply-return definition; quantity compatibility remains unresolved."
    - row_id: "sour_water"
      selected_flow: "Sour wastewater from petroleum-solvent treatment sent to external treatment"
      reason: "d2d44ce1 is electrolytic-manganese wash water; bc2cd1d5 hard secondary/tertiary treatment does not establish untreated sour-water handoff; remaining aqueous residues/sludge are not exact."
    - row_id: "spent_nimo"
      selected_flow: "Spent nickel-molybdenum hydrotreating catalyst"
      reason: "684a8d7c is filtered spent nickel catalyst after hydrogenation; not fixed-bed Ni/Mo oxide-alumina catalyst replacement."
    - row_id: "spent_como"
      selected_flow: "Spent cobalt-molybdenum hydrodesulfurization catalyst"
      reason: "Nickel catalyst, power-plant catalyst and metal scraps are incompatible with spent Co/Mo oxide-alumina bed."
    - row_id: "oily_sludge"
      selected_flow: "Oily sludge from petroleum-solvent tank cleaning"
      reason: "956abaf8 carries mechanically separated/recyclable state and oil20–50/water40–80; actual tank-cleaning waste state and assay not established; refinery sludge b8bb8aa8 is a possible narrower receiver/origin candidate but actual generation/handling and composition are not established; generic sludge does not resolve them."
    - row_id: "waste_solvent"
      selected_flow: "Waste petroleum solvent purge sent off site for recovery or disposal"
      reason: "Unspecified spoil, black liquor, acid/alkali and generic waste liquid do not establish petroleum waste-solvent purge."
  provider_basis_requirements:
    - "Actual petroleum mixture assay and route for each input/output; no UVCB CAS or native kerosene C15H32 as assay. Preserve separate white-spirit and SBP boiling/flash subsets; no ethanol/beverage/mineral-oil substitution."
    - "Actual steam pressure including gauge/absolute and local atmospheric pressure, state, gross supply/return mass, common enthalpy reference and background definition; no heat inferred from MJ alone or duplicate carrier/heat burden."
    - "Gas T/P/Z/wet-dry and reference volume compatibility; fuel composition and NCV/GCV."
    - "NOx monitor/LCI/LCIA basis, excluding N2O; NMVOC molecular mass with actual vapour composition and methane exclusion."
  metadata_issues:
    - flow_uuid: "5fb93398-c4c6-4b60-bb16-ca956bc35985"
      issue: "Official Chinese baseName mistranslates spirit as alcoholic liquor; English name, bilingual generalComment and CPC hierarchy consistently identify petroleum solvent. Preserve exact official Chinese display while physical qualifiers and supplier assay govern applicability."
  independent_contract_review:
    status: "authored_aligned_scientific_pending"
    actual_data_binding: "Required future collection of site/SKU/quantity/provider; dimensional consistency is assessed separately and never implies filled actual observations."
    physical_accounting: "Whole carrier and constituent water/C/H/O/N/S ledgers, stocks, paired internal links, containers, maintenance and returns remain unallocated; reaction is not a total-mass or elemental source/sink."
    hard_field_limits: "Electricity CN 1-35 kV grid average at user; naphtha crude atmospheric side-cut; DI water ion exchange or reverse osmosis at plant. Broad comments never override hard fields."
  quantity_basis_review:
    nox: "Mass/kg does not establish NO2-equivalent basis; verify actual monitor/LCI/LCIA agreement before using aggregate quantities."
    nmvoc: "Residual mass only after individually inventoried hazardous/speciated components removed; actual vapour speciation and response/molecular basis required."
    steam: "No UUID adopted for unknown pressure/enthalpy or contrary supply use; collect actual state and compatible provider before concrete data-package use."
