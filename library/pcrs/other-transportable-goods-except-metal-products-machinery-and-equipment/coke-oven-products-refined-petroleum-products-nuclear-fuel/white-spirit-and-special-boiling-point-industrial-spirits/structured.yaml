measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use net accepted mass at the declared gate; exclude packaging, tank heels, off-spec waste and internal transfers; all inventory rows use per 1 kg reference flow."
  - id: liquid_conversion
    applies_to: "liquid streams"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert volume only with the actual stream density and declared temperature; retain volume, assay and method. No universal solvent density or UVCB molecular weight is assumed."
  - id: steam_basis
    applies_to: "steam"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep steam mass and net useful heat distinct; Q = m_supply*h_supply - m_return*h_return with measured supply/return states, kg and kJ/kg yielding kJ, and a common declared enthalpy reference; include each carrier stream if there are multiple returns. Convert gauge pressure with measured local atmospheric pressure, not a universal offset. Meter gross supplied steam and return mass separately; a return does not silently reduce a provider reference defined as gross supplied kg. For a heat-service provider, use its measured net delivered MJ definition instead. Count one external energy service and retain carrier mass/water balances without duplicating heat burdens; unknown provider/state/heat basis remains pending."
  - id: gas_basis
    applies_to: "gas inputs"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Preserve gas reference temperature, pressure, composition, wet/dry and compressibility with the provider definition; a secondary mass coefficient is not a density. H2 circulation is not net makeup."
  - id: energy_basis
    applies_to: "electricity and fuel records"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Record carrier-specific meters and actual provider property (including NCV/GCV for fuel); retain original kWh and documented conversion. Do not count fuel input and its generated heat as two external energy supplies."
