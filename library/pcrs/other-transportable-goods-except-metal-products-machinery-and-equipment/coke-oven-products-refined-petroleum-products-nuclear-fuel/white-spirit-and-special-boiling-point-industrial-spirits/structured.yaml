allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared production"
    rule: "First avoid allocation through documented subdivision or system expansion where appropriate; otherwise justify a physical relationship, then economic allocation if no defensible physical relationship exists. A solvent-use label alone does not determine allocation."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_ledgers
    applies_to: "all physical outputs"
    rule: "Keep all measured product, side-cut, gas, water and waste amounts in the unallocated physical ledger. Allocate only shared environmental burdens; never multiply coproduct mass, internal transfer or actual discharge mass by an allocation share to close the physical balance."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_factor
    applies_to: "shared environmental burdens"
    rule: "For a justified basis b_j, a_j = b_j / sum(b_j) over the documented coproduct set; allocated shared burden B_j = a_j * B_shared, with directly attributable burdens assigned separately. Retain period, product set, basis, prices or physical relationships and sensitivity; no fixed allocation factor is supplied. For an economic basis, use same-stage accepted quantities and comparable net unit prices: b_j = P_j*p_j; document currency, period, taxes, transport, container charges, rejected/returned lots and prices supported by sales records. Stage-specific shares sum to one over the documented coproduct set; physical quantities remain unallocated."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_recovery
    applies_to: "recovery and waste treatment"
    rule: "No default avoided-product credit for recovered cuts, heat or catalyst. Record actual receiving route and consistent treatment model, allocation and substitution quality before applying a justified credit; avoid counting recovery at both sender and receiver."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "solvent_manufacture"
      flow_role: "Material and reference-product mass"
      record_type: "Calibrated custody meters, scales, batch/tank records and supplier certificates"
      raw_fields: "SKU; route; feed/cut IDs; assay; net accepted product; density/temperature; opening/closing stocks; makeup H2; gas composition; internal transfers; receiver; C/H/O/N/S assays; stage stocks/moisture; rejects/rework/returns; gross/tare/reuse container ledger; maintenance inputs/wastes"
      collection_method: "Read and reconcile actual external and paired internal meters; collect assay per feed and product lot. Aggregation rule: Sum external net quantities with inventory reconciliation; divide by net accepted solvent kg for per 1 kg reference flow; retain all unallocated physical coproducts"
      unit: "kg; m3 where traceably converted"
      frequency: "Each batch/transfer; monthly reconciliation"
      temporal_coverage: "One declared representative period covering actual grade campaigns and significant transients"
      site_scope: "Feed, fractionation, reactor, separators, recovery and loading"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; supplier basis; assays; stage diagram; balance residuals"
    - protocol_id: cp_energy
      process_id: "solvent_manufacture"
      flow_role: "Electricity, steam, fuels and recovered/exported heat"
      record_type: "Carrier-specific meters and utility contracts"
      raw_fields: "meter IDs; voltage/property; kWh/MJ; fuel composition; NCV/GCV; gas T/P/Z/wet-dry; steam P/T/dryness and gauge/absolute basis; local atmosphere; supply/return m/h with common reference; internal recovered heat; material sensible/latent heat; energy stocks/losses"
      collection_method: "Meter actual stages and pair energy transfers; record supply/return enthalpy and reference; preserve original carrier. Aggregation rule: Sum each compatible carrier independently; divide by net accepted solvent kg for per 1 kg reference flow; keep internal heat and external heat separate"
      unit: "MJ; kWh; kg steam; m3 gas"
      frequency: "Continuous or each utility period; monthly reconciliation"
      temporal_coverage: "One declared representative period covering actual grade campaigns and significant transients"
      site_scope: "All included compressors, pumps, heaters, cooling and vapour recovery"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; contract/reference property; enthalpy method; stage attribution"
    - protocol_id: cp_water
      process_id: "solvent_manufacture"
      flow_role: "Withdrawal, purchased makeup, sour water, condensate and final discharge"
      record_type: "Water meters, flow-proportional sampling and treatment manifests"
      raw_fields: "source compartment; water T/density; wash/cooling/steam destination; circulation; evaporation; condensate return; receiver; oil/sulphide/NH3; final benzene concentration; concurrent discharge volume; whole wet carrier and water fraction; inlet humidity; supported net reaction water"
      collection_method: "Pair water interfaces and sample actual final discharge; integrate species concentration with contemporaneous flow/duration; no COD/TOC-to-species conversion. Aggregation rule: Reconcile withdrawals plus imports, returns, evaporation, discharge and stock change; divide each external quantity by accepted solvent kg for per 1 kg reference flow"
      unit: "kg; m3; mg/L; hours"
      frequency: "Continuous volume; representative batch/flow-proportional samples"
      temporal_coverage: "One declared representative period covering actual grade campaigns and significant transients"
      site_scope: "Actual water and treatment interfaces within the declared boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; chain of custody; laboratory limits; moisture and receiver records"
    - protocol_id: cp_waste
      process_id: "solvent_manufacture"
      flow_role: "Wastewater, spent catalysts, tank sludge and waste solvent"
      record_type: "Weigh tickets, waste assays, stock and recovery records"
      raw_fields: "stream ID; wet mass; water/oil/solids; metal/sulphur/coke; hazard status; internal recovery; external receiver; transport; treatment model; whole wet carrier composition closure; separated packaging tare; maintenance wastes and returns"
      collection_method: "Measure each actual waste stream independently; catalyst replacement campaigns are linked to the product output represented by their service period. Aggregation rule: Sum each external wet waste independently; preserve constituent mass and service-period attribution; divide by accepted solvent kg for per 1 kg reference flow"
      unit: "kg"
      frequency: "Each waste transfer or catalyst replacement"
      temporal_coverage: "One declared representative period covering actual grade campaigns and significant transients"
      site_scope: "Included waste generation, collection and actual recovery handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste manifests; assays; campaign records; receiving treatment contract"
    - protocol_id: cp_air
      process_id: "solvent_manufacture"
      flow_role: "Actual post-control elementary releases"
      record_type: "Stack/vent tests, validated leak/tank/loading calculations and event logs"
      raw_fields: "source; species/CAS or aggregate membership; vapour assay; concentration response basis; flow; duration; capture and destruction; flare event; fuel C/S; particle cut; fossil carbon; uncertainty; aerosol species/LCIA overlap; inlet/outlet humidity and carrier background; residual NMVOC membership coverage"
      collection_method: "Measure representative actual sources; validate estimates against stream service, controls and operating time. Retain liquid/vapour distinction, raw detection limits, response factors and complete pollutant scope. Aggregation rule: Integrate each non-overlapping release after actual control; divide by accepted solvent kg for per 1 kg reference flow; retain physical release and separately allocated burden ledgers"
      unit: "kg species; measured raw concentration and flow units"
      frequency: "Representative normal/transient campaigns and continuous operating logs"
      temporal_coverage: "One declared representative period covering actual grade campaigns and significant transients"
      site_scope: "Actual heaters, boilers, flare, vents, equipment, tanks, loading and included treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Method/version; calibrations; assay; gas-basis conversion; source coverage; uncertainty"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "x_ref = X_net / P; X_net is an actual inventory-reconciled external exchange over the same period; P is net accepted finished-solvent kg in cp_mass. Retain physical balances before allocation and normalize allocated burdens separately."
      inputs:
        - X_net
        - P
        - cp_mass
      output: "exchange per 1 kg reference flow"
      source_ids:
        - eu-pef-2021
    - id: calc_balances
      applies_to: "physical ledgers"
      rule: "Across all whole carrier streams: external inputs + opening inventory = external outputs + closing inventory + separately measured losses not already represented as emissions or waste. At each stage pair every internal transfer with the same unallocated quantity and composition; preserve feed, intermediate, finished/rejected product, catalyst, recoverable solvent and container stocks. Close total mass and C/H/O/N/S and other relevant elements with actual assays, air O2/N2, inlet humidity and outlet gases included. HDS/hydrogenation transform species and H2/S distribution but cannot be additional total-mass or elemental sources/sinks. In the water-component ledger include verified net reaction formation/consumption without adding it again to total mass. Whole wet waste, purge and discharge carriers include their constituent water/oil/solids once. Energy closure uses consistent measured chemical-energy/enthalpy bases, work, useful supplied/exported heat, material sensible/latent heat, stock change and supported dissipation; do not add reaction heat twice to a formation-enthalpy balance."
      inputs:
        - cp_mass
        - cp_water
        - cp_energy
        - cp_waste
        - cp_air
      output: "unallocated balance residuals and uncertainty"
      source_ids:
        - eu-refinery-bref-2015
    - id: calc_emission_mass
      applies_to: "air and water release rows"
      rule: "Integrate compatible species concentration and contemporaneous flow over measured operating duration, with raw unit conversions and real capture/destruction accounted once. For gas records reported as carbon or FID equivalents, actual speciation and response/molecular conversion are needed before reporting kg compound or kg NMVOC; unexplained balance residual is not a specific emission."
      inputs:
        - cp_air
        - cp_water
        - "actual sample analyses"
      output: "kg actual non-overlapping release before reference normalization"
      source_ids:
        - us-epa-ap42-refining-2015
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Resolve physical identity using complete name, CAS, comment, classification and hard route/state fields; property and unit-group support plus provider quantity basis are separate checks. A broad hydrocarbon CAS does not establish a mixture assay."
      evidence: "Supplier assay/specification; direct flow records; compatible provider definitions"
    - id: dq_methods
      applies_to: "measurements and estimates"
      requirement: "Declare actual representative period, completeness, calibration, limits and uncertainty. Historical or one-factory observations, typical producer compositions, SDS disclosure/analytical thresholds and BAT concentrations are not universal recipes, emission factors, doses, absence evidence or input defaults. Boilers, flares, storage and loading each require their own applicable method; AP-42 refinery examples do not establish their quantities."
      evidence: "Retained actual raw records, method applicability and excluded-source rationale"
    - id: dq_completeness
      applies_to: "process boundaries"
      requirement: "Record additional actual chemicals, catalysts, flared gases, pollutants and wastes as separate atomic exchanges; do not omit known releases merely because no exact UUID is available. Biogenic CO2, if actually present, requires its own row and is retained in LCI despite any climate reporting convention."
      evidence: "Actual plant diagram, source register and balance coverage"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Reject white mineral oil, extraction-route type 2, pure monomers, synthetic solvent routes or grades whose actual mixture/route/state falls outside this scope. Classification or broad CAS alone is insufficient."
    source_ids:
      - who-white-spirit-1996
  - rule_id: validate_reference
    applies_to: "finished_solvent"
    rule: "Exactly one finished-solvent product output realizes the 1 kg reference. Known identical intermediate solvent transfers remain physical internal links; neither a fabricated UUID nor hidden identity may evade reference-output checks."
    source_ids:
      - eu-refinery-bref-2015
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Require the same period, net accepted-mass denominator, collection aggregation and unit conversion in both languages; inspect physical/provider bases independently from database identity."
    source_ids:
      - eu-pef-2021
  - rule_id: validate_balance
    applies_to: "physical and allocated ledgers"
    rule: "Reconcile complete unallocated whole-carrier mass, water components, C/H/O/N/S and other relevant elements and energy with uncertainties, actual side-cut receivers, stocks, containers, maintenance, returns and paired internal links. Reaction transformations do not repair a total-mass/elemental residual, and allocation does not repair missing physical outputs."
    source_ids:
      - eu-refinery-bref-2015
  - rule_id: validate_pollutants
    applies_to: "elementary rows"
    rule: "Verify species, medium/subcompartment, fossil/biogenic origin, actual property/unit and monitor/LCIA basis. No correction flow or nearby substance may substitute. Use a residual NMVOC mass sum excluding benzene and every individually represented constituent, plus non-overlapping particle-size fractions and documented aerosol-species/particle characterization overlap; exclude N2O from NOx and require evidence for its NO2-equivalent basis."
    source_ids:
      - us-epa-ap42-refining-2015
  - rule_id: validate_pending
    applies_to: "unresolved links"
    rule: "A missing reference-product identity, reference property/unit-group support, unspecified steam quantity basis or unsupported pollutant aggregate prevents a complete ready-to-use data package. Preserve precise names and actual quantities while resolving gaps; no zero or proxy silently replaces them."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after complete data-package validation and declared use."
  downstream_use: "Supply of the declared bulk solvent to a separately modelled formulation or industrial use."
  allowed_use: "One compatible physical solvent grade, route and supplier quantity basis with disclosed allocation and complete linked upstream/service records."
  excluded_use: "White mineral oil, generic hydrocarbon mixtures, extraction/synthetic routes, pure chemicals, retail packaging, use-phase emissions or comparisons of unlike grades without harmonization."
  required_metadata: "SKU; petroleum/mixture identity; feed and actual route; assays/boiling curve; bulk state and gate; provider bases; period/site; stage and internal transfer map; allocation; recovery and treatment receivers."
  required_quality_disclosure: "Measurement coverage; balanced physical ledgers; allocated burdens; uncertainty; method applicability; remaining identity/provider gaps and their use restrictions."
  update_trigger: "Change in feed/crude source, aromatic class, boiling range, treatment, catalyst, utilities, controls, receiver, allocation or provider reference basis."
data_sources:
  - id: "who-white-spirit-1996"
    type: "official_guidance"
    reference: "[WHO/IPCS EHC 187, 1996](https://www.inchem.org/documents/ehc/ehc/ehc187.htm), §§2.1.1, 3.2; §§2.1.2/5.3.1 as mixture-context qualifications"
    used_for: "Historical identity and route distinctions only; no historical assay, density, recipe, factors or survey default."
  - id: "shell-sbp-40-65-tds"
    type: "handbook"
    reference: "[Shell SBP 40/65 Technical Datasheet](https://www.shell.com/content/dam/shell/assets/en/business-functions/chemical/documents/Shell%20TDS-SBP%2040%2065.pdf), pp.1–3"
    used_for: "Specific hydrogenated-feedstock mixture example and grade/contract qualification; no typical assay, density, flash point, dose or yield default."
  - id: "shell-sbp-140-165-tds"
    type: "handbook"
    reference: "[Shell SBP 140/165 Technical Datasheet](https://www.shell.com/content/dam/shell/assets/en/business-functions/chemical/documents/Shell%20TDS-SBP%20140%20165.pdf), pp.1–3"
    used_for: "Specific SBP example distinguishes SBP from white-spirit flash-point condition; no universal grade or quantitative default."
  - id: "shell-sbp-product"
    type: "handbook"
    reference: "[Shell Chemicals, Special boiling point solvents](https://www.shell.com/business-customers/chemicals/our-products/solvents-hydrocarbon/special-boiling-point-solvents.html), product description and sales-contract qualification; page updated 20 January 2026"
    used_for: "Producer evidence for a deeply hydrogenated SBP mixture range, limited to that range; individual pure-solvent listings do not broaden this scope. No quantitative performance default."
  - id: "eu-refinery-bref-2015"
    type: "official_guidance"
    reference: "[JRC Refining of Mineral Oil and Gas BREF, 2015](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/REF_BREF_2015.pdf), §§2.13 (PDF 112–115), 2.21 (PDF 141–142), 2.25 (PDF 149), spent catalyst §3.25 (PDF 256)"
    used_for: "Actual hydrotreatment/recycle/wash-water, catalyst and refinery transfer interfaces; storage and abatement scope. Not hydrocracking-yield or general solvent-quantity defaults."
  - id: "us-epa-ap42-refining-2015"
    type: "official_guidance"
    reference: "[US EPA AP-42 §5.1 Petroleum Refining, April 2015](https://www.epa.gov/sites/default/files/2020-09/documents/5.1_petroleum_refining.pdf), §§5.1.2.4, 5.1.2.8–9, 5.1.3; PDF 7, 9, 15–17"
    used_for: "Utility/steam, blowdown, heaters, leaks, tanks, transfer and wastewater interfaces; historical hypothetical-refinery/factor tables excluded as defaults. Chapter 1 boiler and source-specific methods remain necessary."
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "[Commission Recommendation (EU) 2021/2279, Annex I §4.5](https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf), multifunctionality hierarchy"
    used_for: "Allocation hierarchy and disclosed modelling choices; no PEF-compliance or published-methodology approval claim."
