  classification_refs: "CPC 3.0 33350; proposed narrower relationship, subject to independent acceptance."
  covered_products: "Bulk white spirit and SBP petroleum-solvent mixtures from fractionation, with actually operated HDS/hydrogenation declared."
  excluded_products: "White mineral oil; isolated chemical solvents; synthetic isoparaffins; type 2 solvent extraction; formulated products; retail packs; generic feedstock or fuel grades."
  representative_product: "One assayed and accepted bulk petroleum-solvent SKU at custody transfer."
  production_route: "Refinery-stock receipt; actual fractionation and optional HDS/hydrogenation in documented order; recovery; quality release; storage; bulk loading."
  market_state: "Unformulated bulk liquid with specified distillation curve, aromatic class and actual supply condition."
functional_unit:
  what: "Supply of one specified petroleum-solvent mixture at the solvent-works bulk gate."
  how_much: "1 kg net accepted bulk solvent, excluding containers and vehicle."
  how_well: "Actual SKU specification is met; assay, aromatic basis, treatment history, distillation curve and supply state are declared. This mass basis does not assert equal solvent performance across grades."
  how_long_or_cycle: "One representative reporting period with inventories reconciled; no use lifetime is assumed."
  reference_flow_link: "finished_solvent"
system_boundary:
  rules:
    - rule_id: boundary_stocks
      applies_to: "solvent_manufacture"
      rule: "Start at metered refinery-stock receipt, include actual fractionation and treatment, recovery, quality release, tank operations, utilities and bulk loading; retain stage-level records."
      source_ids:
        - eu-refinery-bref-2015
    - rule_id: boundary_upstream
      applies_to: "external inputs"
      rule: "Link representative stock, H2, power, fuels, steam, water and catalyst background datasets with their physical/quantity bases, upstream refining coproduct handling and actual route; no zero-burden refinery stocks."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_releases
      applies_to: "included operations"
      rule: "Include actual process vents, equipment leaks, tanks, loading, heaters, flares, water interfaces and waste transfers after actual control. Extend inventory with each actual chemical, fuel or pollutant not enumerated here; this conditional list is not a cut-off."
      source_ids:
        - us-epa-ap42-refining-2015
    - rule_id: boundary_internal
      applies_to: "recycle and recovery"
      rule: "Retain a physical process map with same-quantity paired transfers for H2 recycle, light/heavy returns, recovered liquid, steam/condensate and heat. Internal links cancel only in the aggregated external inventory, not in the mass/water/carbon/sulphur/energy ledgers."
      source_ids:
        - eu-refinery-bref-2015
    - rule_id: boundary_services
      applies_to: "off-site treatment"
      rule: "Wastewater, sour gas and spent catalyst transferred outside the foreground retain actual amounts, composition and receivers and linked treatment. If treatment is inside the foreground, replace transfer with measured inputs, recovered products, residues and direct releases without double counting."
      source_ids:
        - eu-refinery-bref-2015
boundary_abstraction:
  declared_starting_condition: "Separately metered straight-run naphtha/kerosene stocks received with declared upstream origin, prior treatment, assay and quantity basis."
  starting_condition_role: "Foreground solvent-works entry; crude distillation remains in linked upstream datasets."
  product_classification_scope: "Narrower than CPC 33350: petroleum solvent mixtures through fractionation and optional HDS/hydrogenation, bulk supply; extraction and other excluded routes require separate assessment."
  recursive_input_rule: "Same-category external solvent feed requires its own representative upstream record and measured input. Internal recycle retains source/destination and equal mass without recursive dataset creation."
  upstream_dataset_requirement: "Physical identity, actual route, geography/time, state, property and quantity compatibility for every purchased stock or utility; disclosed refinery coproduct allocation."
  disclosure: "Actual stage order, feed and grade, aromatic/boiling assays, bulk gate, period, control equipment, utility bases, balances, receiving services, exclusions and unresolved links."
