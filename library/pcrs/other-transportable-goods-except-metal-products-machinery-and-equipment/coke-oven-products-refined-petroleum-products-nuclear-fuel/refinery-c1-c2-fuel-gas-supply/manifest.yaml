      - row_id: "steam"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "Physical steam carrier measured in kg; actual supply/return pressure, temperature, dryness, mass, enthalpy and supplier burden basis required. Pressure-specific records not adopted. Compute heat separately and apply compatible mass- or heat-based provider once."
      - row_id: "water"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "Industrial-production-water candidate72dcdee6 is explicitly source-specific recovered-fibre fluting in Sheyang with upstream cutoff; opposite route. No compatible generic water identity confirmed."
      - row_id: "mdea"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "Initial methyldiethanolamine and CAS supplement returned different amines/chemicals; no exact MDEA identity established. Ethanolamine/triethylamine cannot replace it. The inventory measures whole delivered grade including aqueous-stock carrier water, not neat-active mass; actual concentration/formulation requires provider confirmation."
      - row_id: "absorbent"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "Light gasoline query returned motor/reformulated gasoline and light crude. Naphtha91cc5451 hard-limits atmospheric-distillation side-cut; actual recirculating absorbent grade/origin must be confirmed before adoption."
      - row_id: "naphtha"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "Native Naphtha91cc5451 is explicitly an atmospheric-distillation side-cut, not a gas-plant debutanized light-gasoline outlet; hydrotreated/pyrolysis naphtha are different routes. Retain precise outlet name."
      - row_id: "acid_gas"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "Acid Gases e2d2fcae lists liquid-acid vapours, not H2S/CO2 refinery sour gas. 0da1d98a identifies contained H2S, not full acid-gas mixture mass; cannot replace the whole physical transfer."
      - row_id: "condensate_return"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "Milk-condensate record is dairy-specific; condensation water cc69ba9d comment specifies water vapour from growing renewables and conflicts with boiler-condensate liquid. Neither is steam-return water."
      - row_id: "spent_amine"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "Triethylamine/methylamine wastes are not spent MDEA solvent; preserve actual composition/receiver and blank identity."
      - row_id: "wastewater"
        reason_code: "no_compatible_identity_confirmed"
        explanation: "949be59d specifies untreated discharge to water, not refinery wastewater sent for treatment. d2d44ce1 is manganese-residue washing; paper-mill/municipal records are opposite sources. No exact treatment-handover identity confirmed."
      - row_id: "nox_air"
        reason_code: "quantity_definition_pending"
        explanation: "Nitrogen oxides f79d0f8f is air unspecified, nativeMass/kg and CAS11104-93-1; metadata does not establish NO2-equivalent quantity. Do not assume that basis, include N2O or repeat NO/NO2. UUID remains blank pending LCI/LCIA/provider quantity-definition proof."
    steam_background_basis: "Actual supply pressure, dryness, condensate return and provider heat basis must be compatible; no specific-pressure steam identity adopted."
    elementary_identity_and_quantity: "Eleven species are state100 confirmed for outdoor-air unspecified; NOx NO2-equivalent definition remains unresolved. Site-specific emission amounts, actual species and subcompartment must be collected; no default positive quantity, species substitution or repeated nested PM intervals."
    allocation_evidence: "Actual parent refinery and residual common gas-plant service allocation require supplier records and reviewed rationale; no default allocation fractions or avoided flaring credit."
    completeness: "Methodology prescribes future actual route/grade/state/metering/composition and supplier collection. A completed dataset requires all conditional exchange/provider gaps resolved or documented absent; no historical BREF/AP42 quantity defaults."
    reference_provider_basis: "Broad whole-product Gas084a3bc0 provides native Volume/m3 only. Actual accepted refinery-mixture source, composition, quality admission, usage/storage gate, reference T/P/moisture/Z and any provider burden/quantity basis must be collected. Missing future data do not negate the compatible broad flow identity; no density, calorific value, background provider or taxonomy mapping inferred."
    range_evidence_policy: "No compatible independently supported generic feed/utility/co-product ranges are prescribed. Amounts come from actual linked foreground protocols; historical/single-site BREF and EPA quantities are not transferred into universal recipes or ranges. The target check retains report-only missing-range warnings."
    nox_quantity_definition: "NO2-equivalent reported quantity is explicitly separated from physical kg/species sum. f79d0f8f native Mass/kg and CAS11104-93-1 do not prove reporting equivalence. NOx UUID remains blank; actual NO/NO2 species and monitor/LCI/LCIA definitions are required."
    site_interface_completeness: "Future site walkdown must collect all actual paired streams, whole solutions/mixtures, C/H/O/N/S, carrier water/humidity/reaction water, full exhaust, energy, stocks, returns, packaging/container maintenance and individual service burdens. No invented generic operation or quantity, default zero, historical recipe or forced closure."
    cohort_and_service_records: "Actual unique first-acceptance cohort ids, thermodynamically compatible new dispatch/new closing FG volumes, original-cohort Q/volume basis, raw/WIP/FG and inherited service vectors required. Unknown or zero Q remains raw, never division or attribution to current output."
  physical_output_design: "One first-accepted refinery fuel-gas reference output includes newly accepted dispatch and new accepted closing finished-gas stock once, on one declared volume basis. Retain own-use/export/storage physical branches and raw/WIP/FG stocks separately; receiving endpoints equal branch transfers. Opening accepted stock, returns and retests retain original cohorts and service vectors."
