review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scope_decision:
    product: "Accepted crude coal tar recovered from by-product coal coke-oven tar-water condensate; fixed tar reference and separate condensate recovery foreground, without duplicating coal carbonisation."
    classification_relation: "narrower; excludes independent coal-tar distillation products, peat tar, unassessed lignite/other mineral-tar routes and reconstituted tar. No accepted mapping decision is claimed."
    upstream_interface: "Unallocated joint coking/cooling inventory and complete physical outputs with documented staged attribution, or an already allocated condensate supply with its exact stage and fractions. Neither a free coproduct nor an invented purchase of separated crude tar."
  unresolved:
    inventory_flow_uuids:
      - row_id: "condensate"
        reason_code: "specific_identity_pending"
        explanation: "Successful lookup returns separated tar, fuel oil or gas, not the measured tar-water condensate intermediate."
      - row_id: "steam"
        reason_code: "specific_identity_pending"
        explanation: "Pressure-specific steam candidates at 11.0 and 0.45 MPaG require actual matching supply conditions; heat-service and source-specific industrial steam records do not establish this delivered mass interface."
      - row_id: "recovered_heat"
        reason_code: "specific_identity_pending"
        explanation: "Reviewed names do not establish the actual recovered heat carrier, useful delivery and supplier-reference convention."
      - row_id: "coal_water_recycle"
        reason_code: "specific_identity_pending"
        explanation: "Aqueous ammonia products do not establish the contaminated coke-oven coal-water composition and process-reuse state."
      - row_id: "condensate_return"
        reason_code: "specific_identity_pending"
        explanation: "Steam and milk condensate candidates do not establish the liquid utility return from this heater."
      - row_id: "tar_sediment_recycle"
        reason_code: "specific_identity_pending"
        explanation: "Coal tar, pitch and standard coal do not establish the PAH-bearing thick-tar/coal-fines return to charging."
      - row_id: "coal_water_purge"
        reason_code: "specific_identity_pending"
        explanation: "Successful lookup does not establish coke-tar recovery ammoniacal wastewater; unrelated radioactive, waste-acid and other aqueous records are rejected."
      - row_id: "tar_sludge_waste"
        reason_code: "specific_identity_pending"
        explanation: "Tar residue candidate fixes 31.4 MJ/kg in its native identity, not merely an optional coefficient; this grade is unproved. Petroleum refinery/oil sludge and water-treatment sludge have different routes or composition. Retain concrete coal-tar recovery sludge without a UUID until a compatible identity is verified."
    provider_compatibility:
      - row_id: "reference_tar"
        need: "The broad coal-tar identity is compatible with the coal-carbonisation subset; actual residual water, grade, origin and supplier mass basis are collected before choosing any background process. No production yield or heating value is inherited."
      - row_id: "electricity_low"
        need: "Native identity is CN grid-average consumption mix below 1 kV; a different country or supply route requires a separately verified compatible flow and provider."
      - row_id: "electricity_medium"
        need: "Native identity is CN grid-average consumption mix at 1–35 kV; a different country or supply route requires a separately verified compatible flow and provider."
      - row_id: "electricity_high"
        need: "Native identity is CN grid-average consumption mix at 35–330 kV; a different country or supply route requires a separately verified compatible flow and provider."
  independent_review: "Independent content and native-identity remediation completed; candidate/authored methodology and aligned translation remain scientifically pending with the controller. Concrete interface identity gaps remain explicit; no publication, methodology approval or mapping acceptance claimed."
