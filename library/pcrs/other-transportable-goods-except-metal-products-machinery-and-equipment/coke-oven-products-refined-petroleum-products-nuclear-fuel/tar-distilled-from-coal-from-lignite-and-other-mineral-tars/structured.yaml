allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared upstream and foreground burdens"
    rule: "First subdivide directly attributable measured units; use system expansion only with explicit study purpose and verified additional functions. If allocation cannot be avoided, justify a relevant physical causal relationship, otherwise justify economic allocation from measured same-stage quantities and contemporaneous prices, retaining reasons and sensitivity. Tar is not burden-free because it is a coproduct and fuel-energy allocation is not automatic."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_stages
    applies_to: "condensate"
    rule: "The unallocated joint-inventory route requires the complete staged coking, gas-cooling and recovery attribution tree and all physical outputs, proving that shared burdens are assigned once and fractions sum to one at each stage. The already allocated condensate route retains exact boundary, method, fractions and included units; do not allocate its upstream burdens again and remove overlapping units."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Preserve unallocated physical quantities for mass/water/C/H/O/N/S balances and internal interfaces. Physical outputs per kg tar are divided only by accepted tar output, never mechanically multiplied by the tar burden fraction. Attribute relevant inputs/emissions in a separate environmental-burden ledger and label its nature. Real coal-water/sediment returns are not substitution credits and do not automatically enter the economic coproduct set."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: allocation_waste
    applies_to: "coal_water_purge; tar_sludge_waste"
    rule: "Retain waste composition, quantities, receiver and treatment burdens; only substantiated actual marketable coproducts enter the applicable allocation set. Close internal returns without recording the same material as both disposed and reused, and never hide physical products through environmental allocation."
    source_ids:
      - jrc-iron-steel-bref-2013
      - eu-environmental-footprint-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_condensate
      process_id: "tar_recovery_delivery"
      flow_role: "condensate"
      record_type: "measurement and traceable primary records"
      raw_fields: "condensate header/branch readings and composition; water, tar, solids, gas, C/H/O/N/S; temperature; stock; upstream physical network and attribution tree"
      collection_method: "Weigh or use calibrated flow meters with measured same-temperature density; representative assays for water, tar, solids and C/H/O/N/S; reconcile source branches and obtain the complete upstream inventory or documented allocated supply"
      unit: "kg"
      frequency: "each transfer/acceptance; continuous meters; representative operating samples; period stock reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared tar recovery/storage/delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, representativeness, originals, supplier/receiver evidence, stocks and measurement uncertainty"
    - protocol_id: cp_tar
      process_id: "tar_recovery_delivery"
      flow_role: "reference_tar"
      record_type: "measurement and traceable primary records"
      raw_fields: "net mass of each accepted delivery; moisture; free water; coal fines/solids; C/H/O/N/S; temperature; sample representativeness; acceptance rule; tank opening/closing stocks"
      collection_method: "Measure net accepted deliveries with calibrated weighbridge or mass flowmeter, excluding containers/packaging and separate water phase; keep independent separator/tank/loading records; verify delivery state by declared representative sampling and validated analytical methods without assuming a universal moisture specification"
      unit: "kg"
      frequency: "each transfer/acceptance; continuous meters; representative operating samples; period stock reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared tar recovery/storage/delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, representativeness, originals, supplier/receiver evidence, stocks and measurement uncertainty"
    - protocol_id: cp_electricity
      process_id: "tar_recovery_delivery"
      flow_role: "electricity_low; electricity_medium; electricity_high"
      record_type: "measurement and traceable primary records"
      raw_fields: "gate and submeter electricity; voltage; supplier; location/year; losses boundary; kWh or MJ; equipment runtime"
      collection_method: "Submeter pumps, actual dewatering, storage and loading or substantiate attribution; convert against the voltage-compatible supplier basis without adding whole-plant and included submeter totals"
      unit: "MJ"
      frequency: "each transfer/acceptance; continuous meters; representative operating samples; period stock reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared tar recovery/storage/delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, representativeness, originals, supplier/receiver evidence, stocks and measurement uncertainty"
    - protocol_id: cp_steam
      process_id: "tar_recovery_delivery"
      flow_role: "steam; condensate_return"
      record_type: "measurement and traceable primary records"
      raw_fields: "steam and returned condensate mass; pressure/temperature/dryness; enthalpy method; supplier reference quantity; return destination; purge/direct injection; losses"
      collection_method: "Meter supply and return with calibrated instruments, collect their states over the same period and reconcile supplier mass/heat bases; direct injection enters the process water balance while indirect heating/return forms a separate utility circuit"
      unit: "kg"
      frequency: "each transfer/acceptance; continuous meters; representative operating samples; period stock reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared tar recovery/storage/delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, representativeness, originals, supplier/receiver evidence, stocks and measurement uncertainty"
    - protocol_id: cp_heat
      process_id: "tar_recovery_delivery"
      flow_role: "recovered_heat"
      record_type: "measurement and traceable primary records"
      raw_fields: "actual heat service/carrier; supply/return temperature, pressure, flow; useful delivered enthalpy; supplier reference basis; upstream heat attribution"
      collection_method: "Meter useful delivered heat or derive it from traceable carrier flow/enthalpy differences, matching the supplier definition and excluding heat already counted with steam"
      unit: "MJ"
      frequency: "each transfer/acceptance; continuous meters; representative operating samples; period stock reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared tar recovery/storage/delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, representativeness, originals, supplier/receiver evidence, stocks and measurement uncertainty"
    - protocol_id: cp_water
      process_id: "tar_recovery_delivery"
      flow_role: "wash_water; coal_water_recycle; coal_water_purge"
      record_type: "measurement and traceable primary records"
      raw_fields: "each water/recycle/purge meter; aqueous mass/composition; NH3, phenols, tar, elemental C/H/O/N/S and individual sulfur species; source; receiver; merging points"
      collection_method: "Meter each source/destination separately and convert liquid volume using measured same-temperature density; assay water, dissolved and suspended constituents; count separated water once at its actual destination. Add a separate atomic cleaning-wastewater row when not merged"
      unit: "kg"
      frequency: "each transfer/acceptance; continuous meters; representative operating samples; period stock reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared tar recovery/storage/delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, representativeness, originals, supplier/receiver evidence, stocks and measurement uncertainty"
    - protocol_id: cp_residue
      process_id: "tar_recovery_delivery"
      flow_role: "tar_sediment_recycle; tar_sludge_waste"
      record_type: "measurement and traceable primary records"
      raw_fields: "sediment/thick-tar weights; wet/dry basis; coal-fines/tar/water composition; C/H/O/N/S/PAH; stock; coal-charge return/export receiver receipts"
      collection_method: "Weigh and sample representatively; separate return, disposal and temporary stocks; match receiver composition/quantity; do not substitute distilled-pitch identity for thick tar"
      unit: "kg"
      frequency: "each transfer/acceptance; continuous meters; representative operating samples; period stock reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared tar recovery/storage/delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, representativeness, originals, supplier/receiver evidence, stocks and measurement uncertainty"
    - protocol_id: cp_air
      process_id: "tar_recovery_delivery"
      flow_role: "methane_air; co2_air; benzene_air; naphthalene_air; phenol_air; bap_air; ammonia_air; h2s_air; water_air"
      record_type: "measurement and traceable primary records"
      raw_fields: "vents/fugitive sources; release environment; operating state; controls; actual gas flow; species concentration; T/P and wet/dry basis; sampling phase; detection limits/calibration; complete coverage"
      collection_method: "Inventory separator/tank/loading release points; quantify species by validated applicable sampling/analysis, gas flow and operating intervals or disclose an auditable estimate, retaining gas/aerosol phases. Measure inlet ambient humidity and CO2 background and outlet concentrations with corresponding gas flows; derive net process-added water vapour after retaining inlet/outlet totals; a detection limit is not zero. Missing quantities or species prevent a complete-data claim"
      unit: "kg"
      frequency: "each transfer/acceptance; continuous meters; representative operating samples; period stock reconciliation"
      temporal_coverage: "same complete reporting period"
      site_scope: "declared tar recovery/storage/delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, representativeness, originals, supplier/receiver evidence, stocks and measurement uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide each same-period physical exchange by same-period accepted delivered tar net mass; reference_tar is fixed at 1 kg. Retain stock changes as physical-network reconciliation entries rather than another delivery; environmental attribution is applied in a separate ledger."
      inputs:
        - cp_tar
        - "relevant collection protocol"
      output: "physical exchange per 1 kg reference flow"
      source_ids:
        - eu-environmental-footprint-2021
  data_quality_requirements:
    - id: quality_physical_balance
      applies_to: "all inventory rows"
      requirement: "Reconcile before allocation over the whole period: inputs plus opening stocks equal all gas/liquid/solid outputs plus closing stocks and substantiated losses. Close water and each elemental C/H/O/N/S balance separately on consistent measured composition/stock bases; COD is not C and total S is not an emitted species. Investigate differences against declared measurement uncertainty without inventing a balance tolerance. Keep indirect steam/return in a separate utility circuit and include direct injection in process water."
      evidence: "physical network, assays, stocks and matching interface originals"
    - id: quality_energy
      applies_to: "all inventory rows"
      requirement: "Reconcile supplied electricity and useful heat, carrier enthalpy in/out, material sensible/latent enthalpy, stock energy changes and evidenced losses for the same complete boundary and period. Declare reference states and measured properties; measured supply/return differences and actual moisture removal support the dewatering balance. Include chemical energy only on separately justified measured composition/calorific bases, never a generic tar or sludge coefficient. Do not hide heat by counting both a carrier and its heat service or balancing unexplained losses with invented quantities."
      evidence: "stage meters, enthalpy methods, stocks and energy ledger"
    - id: quality_upstream
      applies_to: "condensate"
      requirement: "Obtain complete coking/gas-cooling physical and burden ledgers for coke, gas, tar, actual benzol/ammonia/sulfur products, all water/solid waste and energy. Verify whether a prior package already contains this separator/delivery unit; removing overlaps needs original evidence rather than assumptions from a supplier name."
      evidence: "upstream inventories, attribution tree and operating network"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Resolve blank UUIDs and exact supply/treatment links in the data package while preserving concrete physical identity; infrastructure failure is not no-match. Verified identity still requires separate checks of actual mass/composition, pressure, voltage, compartment and provider reference quantity; database secondary coefficients do not replace site data."
      evidence: "native identities, provider/receiver records and actual collection"
    - id: quality_coverage
      applies_to: "all inventory rows"
      requirement: "Distinguish applicability, demonstrated absence, unquantified amount and unresolved identity; do not fill zeros without evidence. Extend the atomic inventory for each actual chemical, direct fuel, package or control consumable when present, with verified sources. An actual boiler requires a separately evidenced heat-supply unit rather than hidden combustion with only a steam entry."
      evidence: "complete meter coverage, methods and gap disclosure"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_tar"
    rule: "Require exactly one foreground finished-tar output at 1 kg delivery state, consistent with the reference link, bilingual denominator and protocols; reject independent distillate or pitch applicability."
    source_ids:
      - wco-hs-2022-ch27
      - un-cpc-3-2025
  - rule_id: validate_material
    applies_to: "all inventory rows"
    rule: "Verify unallocated mass/water/C/H/O/N/S networks, stocks, every real upstream coproduct and equal-quantity interfaces. Allocation-scaled recycle, condensate, water or sediment cannot serve as physical balances; retain discrepancies, unknown components and missing measurements as unresolved."
    source_ids:
      - jrc-iron-steel-bref-2013
  - rule_id: validate_allocation
    applies_to: "condensate; shared burdens"
    rule: "Verify the unallocated/already allocated upstream route, stages, fraction sums and direct-attribution evidence, avoiding duplicate allocation; absence of allocation evidence prevents a complete tar-supply burden claim."
    source_ids:
      - eu-environmental-footprint-2021
  - rule_id: validate_species
    applies_to: "all inventory rows"
    rule: "Verify atomicity, UUID, native Chinese name, flow type, reference property/unit and air compartment per row; cover emitted species, coal-water contaminants and upstream gas/liquid/solid boundaries. A passing static methodology check does not resolve missing measurements, identities or provider conditions."
    source_ids:
      - jrc-iron-steel-bref-2013
  - rule_id: validate_heat
    applies_to: "steam; recovered_heat; condensate_return; electricity_low; electricity_medium; electricity_high"
    rule: "Verify actual steam pressure/enthalpy basis, condensate routing, useful delivered heat and voltage/provider scope; prevent duplicate heat-carrier/service and voltage-level/internal-meter counting. Unknown quantity or background bases make the package links incomplete."
    source_ids:
      - jrc-iron-steel-bref-2013
published_dataset_profile:
  dataset_role: "primary foreground tar-supply process with separate physical and attributed-burden ledgers"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply recovered coal-carbonisation crude tar only with compatible measured delivery state, upstream allocation and provider bases"
  excluded_use: "independent distillation products; unassessed mineral/peat/wood tar; burden-free coproduct; gas reference substituted for tar; full PEF conformity claim"
  required_metadata: "all reference qualifiers; actual boundary/technology; physical balances and attribution tree; originals and interfaces"
  required_quality_disclosure: "pending identities/provider bases; unquantified releases; sampling coverage/uncertainty; measured versus estimated values and all gaps"
  update_trigger: "material change in coal/coke-oven route, condensate source, separation/dewatering/delivery technology, product state, upstream attribution or supplier/receiver"
