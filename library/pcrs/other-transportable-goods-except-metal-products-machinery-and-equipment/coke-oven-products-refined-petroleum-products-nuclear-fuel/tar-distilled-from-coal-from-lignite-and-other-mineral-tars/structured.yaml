system_boundary:
  rules:
    - rule_id: boundary_recovery
      applies_to: "tar-recovery-delivery"
      rule: "Include separation, actual dewatering/residue removal, tar tanks, sampling/loading and operated controls; meter actual cleaning, warming and utilities separately. Link condensate generation, coal coking and main gas processing upstream rather than duplicating their inventories."
      source_ids:
        - jrc-iron-steel-bref-2013
    - rule_id: boundary_outputs
      applies_to: "all inventory rows"
      rule: "Retain water, thick tar, sludge, gas losses and all actual physical coproducts for every destination; internal reuse is not an environmental release. Add an audited atomic row for each additional emitted species rather than dropping it or replacing species by total VOC/PAH."
      source_ids:
        - jrc-iron-steel-bref-2013
    - rule_id: boundary_distillation
      applies_to: "reference_tar"
      rule: "Actual independent distillate oils or distillation pitch/pitch coke require an applicable fractionation method retaining all fractions and residues; this PCR cannot represent that delivery scope. Removal of free water/sediment without fraction grading is supported with measured delivery-state disclosure."
      source_ids:
        - wco-hs-2022-ch27
        - un-cpc-3-2025
    - rule_id: boundary_interfaces
      applies_to: "condensate; coal_water_recycle; tar_sediment_recycle"
      rule: "Retain the upstream physical network for coal, coke, gas, tar, benzol recovery, sulfur/ammonia products and all actual gas/liquid/solid streams. Inventory only this foreground exchanges without pretending upstream coproducts leave this unit. Match quantity/state at both interface ends and provide physical and environmental-burden ledgers separately."
      source_ids:
        - jrc-iron-steel-bref-2013
        - eu-environmental-footprint-2021
