measurement_rules:
  - id: reference_mass
    applies_to: "reference_tar"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure accepted net delivery mass with cp_tar, excluding packaging and a separate free aqueous phase; residual dispersed water remains part of the delivery mass and moisture is supplementary. Normalize every inventory to 1 kg of the same-state reference flow."
  - id: moisture_basis
    applies_to: "condensate; reference_tar"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain measured water, tar and solids masses of condensate and accepted product. Any supplementary dry-tar result uses measured moisture and the defined solids convention while preserving the delivery-state denominator; it must not silently become a 1 kg dry-tar denominator."
  - id: power_basis
    applies_to: "electricity_low; electricity_medium; electricity_high"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Use each native CN grid-average consumption-mix electricity interface reference property Net calorific value and MJ; convert measured electricity with 1 kWh = 3.6 MJ. Match supplier geography, year and losses boundary; do not add internal submeter quantities again to gate delivery."
  - id: heat_basis
    applies_to: "steam; recovered_heat; condensate_return"
    required_property_ref:
      name: "Mass; Energy"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Record actual delivered steam mass and a separate condensate return. Supplementary useful heat is reconciled from measured supply/return enthalpies, recovery and losses for the same period against the background reference basis; an MJ steam property alone does not establish net delivered heat. A separate heat service uses supplier-compatible useful delivered MJ and is not also counted as carrier steam."
  - id: species_basis
    applies_to: "condensate; reference_tar; coal_water_recycle; coal_water_purge; tar_sediment_recycle; tar_sludge_waste; methane_air; co2_air; benzene_air; naphthalene_air; phenol_air; bap_air; ammonia_air; h2s_air; water_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain species, water and elemental C/H/O/N/S conventions separately and convert only from measured composition; COD is not carbon mass and ammonia-N is not NH3 mass. Air identities represent outdoor environmental air with an unspecified subcompartment; use a compatible precise compartment when known without duplicating the emission."
