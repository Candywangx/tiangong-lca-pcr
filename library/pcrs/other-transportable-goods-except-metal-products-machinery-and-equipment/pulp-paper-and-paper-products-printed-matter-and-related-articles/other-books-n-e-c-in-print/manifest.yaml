  classification_review: "Only CPC 3.0 32299 context retained; narrower adult novel subset. No positive mapping, alias, catalog or index acceptance is performed by this author."
  reference_configuration: "Complete adult general-interest prose fiction novel; uncoated chemical-pulp text and flexible cover sheets; wet sheetfed conventional offset; process-free plates; milled-spine non-reactive EVA spine/side glue; no sewing, case, laminate or alternative printing. 1 kg net newly first-released complete novels of one edition."
