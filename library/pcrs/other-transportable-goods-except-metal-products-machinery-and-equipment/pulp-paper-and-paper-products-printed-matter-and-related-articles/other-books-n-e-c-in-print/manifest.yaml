  unresolved_identity_conditions:
    process_free_plate: "Finished photosensitive-coated process-free aluminium plate; inspected surface-prepared bare substrate is incomplete. Whole finished-plate provider and coating fate required."
    fountain_concentrate: "One actual complete aqueous wet-offset fountain-concentrate formulation, not a water, biocide or individual additive identity. Supplier SKU/chemistry and whole provider unresolved."
    blanket_wash: "Actual petroleum-distillate conventional offset blanket-wash formulation; coal-tar wash-oil route/calorific specification is unsupported for this product."
    "carton_in; carton_out": "Complete actual corrugated carton; inspected fibre-fixed 16.6%/83.4% candidate cannot be imposed without actual specification. Whole/component ownership and supplier basis pending."
    carton_waste: "Whole discarded carton, including supplier packaging; on-site trim/reject candidate and its 2% commentary do not establish this distinct post-use stream or quantity."
    pmover10: "One actual >10 micrometre outdoor particle bin; exact medium/size identity not yet established. It is not cumulative PM10 or captured waste dust."
  quantity_and_provider_obligations:
    - "All amounts are future actual foreground records except the declared reference extent and exact unit identities. No site recipe, factors, yields, efficiency, service life, ranges or emission fractions are established."
    - "Actual primary paper, complete supplied ink/EVA, complete finished-novel construction and their providers must match every physical and amount qualifier. An actual reference/primary identity conflict blocks that use rather than changing the product to fit a UUID."
    - "Preserve first-release new Q including new closing FG once, separate prior Qc and each inherited exchange vector; no new Q from old FG, same-item return, reinspection/rework or added services. Q=0 and failed/idle/cleanup loads remain."
    - "Packaging P includes first purchases paid in an all-in price without separate invoice. Separate first external nonpurchase N_ext and true same-item ER linked to prior outward movement. Preserve owner/cohort, mutually exclusive stocks, gross legs and actual transport; whole/component provider once; no default reuse lifetime."
    - "Utility delivery voltage/year/grid, actual gas T/P/humidity/composition/Z, and hot-water independent enthalpy/mass/side-flow/storage boundary require measurement/provider evidence. Heat flow reference MJ alone proves no delivery state or efficiency."
    - "All actual additional chemicals, maintenance, transport modes, fuels, refrigerants, waste streams and emission species need individual atomic rows and quantities before a complete concrete dataset; listed conditional cards are not a complete site survey."
    - "NOx identity does not prove NO2-equivalent quantity convention; demonstrate monitoring/flow/characterization agreement or keep quantitative use pending. Retain distinct N2O and fossil/biogenic carbon."
    - "Actual shared-burden causality, complete driver denominator and gate/condition value evidence required. Missing/negative/zero fee cases stay review-required, with no clipping, absolute-fee shortcut, automatic recycling credit or forced allocation."
  source_metadata_debts:
    - "Printed Matter has broad printed-paper route but source CPC32690 and unrelated 3D sentence; bound only to qualified complete paper novel. No generic or 3D supplier background approved."
    - "PE-film positive name/CAS9002-88-4 supports PE; source classification and extraneous PET commentary need clarification. No PET or laminate substitution."
    - "Cotton-fabric positive textile name/synonyms versus raw-cotton classification/comment; actual textile grade/provider required."
    - "Wood-waste positive name/comment includes wood packaging; agglomerated source classification conflicts with unagglomerated pallet state and requires clarification; do not infer briquetting or recycling credit."
    - "Heat uses Net calorific value/MJ and natural-gas district/industrial route. Secondary volume coefficient is not a delivery-state or density measurement; actual compatible hot-water supply and heat_ledger required."
