allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "This method selects an attributional manufacturing inventory. ILCD §§7.9.2–7.9.3 provide the allocation approach within their stated situation limits; they are not a book recipe or a claim of full ILCD compliance. The following ledger/cohort implementation is this PCR's application of that approach and the declared foreground protocols. EPA VOC accounting does not justify LCA burden allocation."
    source_ids: []
  - rule_id: a_physical_vector
    applies_to: "all exchanges"
    rule: "Preserve unallocated physicalV separately from environmental burdenA for each exchange, stage, owner and cohort. Never reduce exported books, packaging, waste or emissions by a burden share. Preserve each inherited vector entry with its original provider and quantity basis."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_subdivide
    applies_to: "shared operations"
    rule: "Prefer separate job/stage data and virtual subdivision. Assign only the residual shared load using exchange-specific determining physical causality; retain measured driver numerator, complete denominator, window and uncertainty. Test press demand by actual sheet area/passes/runtime, glue-pot cycles and packed service separately; none is a universal allocation key."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual_value
    applies_to: "unresolved shared burden"
    rule: "Only after physical causality is unavailable, assess economic allocation at the actual joint-process gate and condition. Require complete amounts, prices and genuine conditioning/transport cost adjustments for every co-function, with sensitivity. Missing prices, negative/zero fees or an unproven joint process require review; no clip-to-zero, absolute-fee shortcut or forced share is authorized here."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_recycling
    applies_to: "trim, plates and packaging recovery"
    rule: "Identify actual stream status, receiver and responsibility. Record treatment and material transfers once; a sale or deposit is not an automatic virgin-material credit. Recycling/substitution and negative-value treatment cases require their own reviewed model, compatible provider boundary and explicit ownership before any credit or residual allocation."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_release_services
    applies_to: "new/old cohorts and reuse"
    rule: "Use release_cohorts and cohort_service for inherited burdens and actual additional service. Q=0, idle, cleanup and failed production retain their loads and stocks for justified causal assignment or explicit review, without a fabricated denominator. Reusable packaging requires measured service ownership; zero purchase price or an absent invoice never means zero burden."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "novel_manufacture"
      flow_role: "reference novel and cohort"
      record_type: "future foreground record"
      raw_fields: "title/edition; adult audience/purpose; publication schedule; page/trim/construction; lot/cohort; first-release timestamp; accepted copies; measured net mass/moisture; S0/S1 raw/WIP/newFG/oldFG; dispatch; returns; rejects"
      collection_method: "Inspect content and job brief; weigh accepted complete same-edition novels on calibrated scales after trim/binding checks, excluding packaging; trace first release and every stock movement. Sample mass only with documented design/uncertainty and checked lot weighing. Aggregation ownership conditions: release_cohorts preserves original Qc separately."
      unit: "kg; copies"
      frequency: "each lot first release and stock closure"
      temporal_coverage: "full declared period with actual new/old cohort coverage"
      site_scope: "actual printer and declared outsourced operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "originals; calibration; sampling; acceptance; identity and stock reconciliation"
    - protocol_id: cp_materials
      process_id: "novel_manufacture"
      flow_role: "text/cover paper, plate, powder and cloth"
      record_type: "future foreground record"
      raw_fields: "row/grade/SKU; supplier; batch; moisture/solids; mass/tare; S0/S1; external/internal in/out; formation/consumption; stage/job; retained and waste fractions"
      collection_method: "Weigh each material/state separately and reconcile stage-conservation records; record complete plate coating and its fate, dry cloth and retained contaminants independently. Actual raw/WIP inventories must not overlap finished stock. Aggregation ownership conditions: keep physicalV and cohort ownership before assignment."
      unit: "kg"
      frequency: "every receipt/issue/return and closure"
      temporal_coverage: "full declared period including make-ready, failures and cleaning"
      site_scope: "actual stage and supplier boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; supplier specs; job issues; moisture/constituent assays; closure residuals"
    - protocol_id: cp_formulations
      process_id: "novel_manufacture"
      flow_role: "each supplied ink, fountain concentrate and blanket wash"
      record_type: "future foreground record"
      raw_fields: "colour/SKU; supplier; supplied mass; density/T; complete composition/CAS/water/solids; fossil/biogenic carbon; purchase/stock/issue; retention; residue; evaporation"
      collection_method: "Weigh each whole supplied formulation separately; obtain current technical/SDS and complete supplier disclosures or validated analyses. Assess VOC species for the actual chemistry. Use component quantities for physical reconciliation; link upstream formulation or exhaustive component model once. Aggregation ownership conditions: current-cohort assignments under cohort_service."
      unit: "kg; m3"
      frequency: "each job/material change and closure"
      temporal_coverage: "setup, production, shutdown, storage and wash cycles in period"
      site_scope: "actual press, supplier and capture system"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier originals; assays; density conditions; inventory and species closure"
    - protocol_id: cp_binding
      process_id: "novel_manufacture"
      flow_role: "spine and side EVA"
      record_type: "future foreground record"
      raw_fields: "separate glue grades/masses; formulation; melt/standby/start/stop; pot T/time; purges; internal recovery; retained glue; binder settings; quality tests"
      collection_method: "Weigh each as-supplied non-reactive EVA formulation and each purge; log heater meter and actual thermal history. Test complete binding and reconcile retained mass. No catalogue dose, temperature or lifetime is presumed. Aggregation ownership conditions: preserve failed/rework cohort assignment."
      unit: "kg; MJ"
      frequency: "each lot, pot cycle and cleanup"
      temporal_coverage: "full period including idle and failed binding"
      site_scope: "actual binder and glue supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "glue specification; scales; heater meter; quality and purge records"
    - protocol_id: cp_utilities
      process_id: "novel_manufacture"
      flow_role: "electricity, gas and hot-water service separately"
      record_type: "future foreground record"
      raw_fields: "meter/device/stage; kWh; voltage/grid/year; gas volume/T/P/wet-dry/Z/composition; heating function; hot-water supply/return masses/P/T/h; leaks/bleeds/makeup/storage; service driver"
      collection_method: "Meter prepress, printing, compressor, cooling, extraction, folding, binding/glue pot, trimming and packing; reconcile bills and independent shared meters. Measure gas separately if used. For purchased hot-water energy apply heat_ledger and verify property/provider; on-site fuel and purchased heat cannot both own the same generation. Aggregation ownership conditions: exchange-specific causal burden assignment."
      unit: "MJ; kWh; m3; kg"
      frequency: "each job/cycle; utility-bill closure"
      temporal_coverage: "full period including standby, Q=0 and cleanup"
      site_scope: "actual plant and utility delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; bills; grid/voltage; gas conditions; paired enthalpy/flow readings"
    - protocol_id: cp_packaging
      process_id: "novel_manufacture"
      flow_role: "each carton, film and pallet in/out/waste leg"
      record_type: "future foreground record"
      raw_fields: "component/whole-container ID; owner; cohort; inherited exchange vector/provider; P; N_ext; ER with original outward ID; raw/WIP/newFG/oldFG/reusable S0/S1; conversion; gross dispatch; owner return; waste; trips/mass/distance/mode"
      collection_method: "For every component distinguish first external purchase P, including a component paid within an all-in package without separate invoice; first non-purchase external receipt N_ext from loan/rental/entrustment/supplied goods; genuine same-item external return ER linked to a preceding outward movement. Inspect actual whole-container/component ownership once; weigh each gross leg and retain actual outward/return/waste transport. Same-state internal transfers are stock movements, not external receipts/formation. Measure actual reuse service and repairs; no default life or cycle count. Aggregation ownership conditions: retain gross physical legs and original cohort bases under cohort_service."
      unit: "kg; items; t km"
      frequency: "each receipt, dispatch, return, repair, waste and stock closure"
      temporal_coverage: "full period with opening and closing component cohorts"
      site_scope: "printer, actual owner, provider and transport/treatment receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices/contracts including all-in price; custody/outward links; weights; trip logs; inherited vectors; mutually exclusive stocks"
    - protocol_id: cp_wastes
      process_id: "novel_manufacture"
      flow_role: "each separately transferred waste"
      record_type: "future foreground record"
      raw_fields: "row/bin/state/receiver; whole as-exported mass; density/T/volume; actual water fraction; independent solids/volatile and chemical assays; stock; destination; gate fee/value"
      collection_method: "Weigh each actual separate stream at handover and reconcile contaminants once; wet mixture mass is not dry solids. Measure moisture and solids independently. Preserve paper trim versus dust, ink versus retained ink in liquid/rags, and packaging component waste versus new purchases. Confirm legal status and actual receiver route. Aggregation ownership conditions: physicalV unallocated; burdenA assigned independently."
      unit: "kg"
      frequency: "every collection/dispatch and closure"
      temporal_coverage: "complete reporting period and waste stocks"
      site_scope: "actual plant, transporter and treatment/recycling gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/tare; assays; receiver acceptance; transfer notes; treatment scope/value evidence"
    - protocol_id: cp_emissions
      process_id: "novel_manufacture"
      flow_role: "each outdoor chemical and particle bin"
      record_type: "future foreground record"
      raw_fields: "outlet/source/species/CAS; medium/subcompartment; composition/carbon origin; flow and concentration/time; T/P/humidity; control; inlet/outlet match; LOD/recovery; PM size/cumulative basis; NOx equivalent basis"
      collection_method: "Survey actual formulations, milling/powder and conditional combustion; use validated species-specific measurement and paired ventilation balances with compatible bases. Reconcile retained product/waste/stock and transformations; do not identify a balance residual as a chemical. Keep captured dust distinct; subtract inlet only with matched measurement/airflow closure. TVOC/carbon equivalents are QA until demonstrated species conversion. Aggregation ownership conditions: release_cohorts and cohort_service retain causal ownership."
      unit: "kg; mg/m3; m3/time"
      frequency: "representative setup/run/wash/idle/upset surveys and period closure"
      temporal_coverage: "actual full reporting period and operating modes"
      site_scope: "actual outdoor plant releases after controls"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original assays; sampling/recovery/LOD/calibration; control and ventilation closure; explicit missing species"
  calculation_rules:
    - id: release_cohorts
      applies_to: "all inventory rows"
      rule: "Q is the measured net mass of newly made complete novels first passing quality release in this lot, including that cohort's newly released closing FG exactly once. Opening FG, earlier cohort Qc, same-item returns, reinspection/rework, later packing/storage/dispatch and service never create Q. WIP is excluded until first release; count and mass reconcile to unique copy/lot IDs. Retain each old cohort's original per-exchange vector and original accepted Qc."
      inputs:
        - cp_release
        - cp_materials
        - "unique lot and first-release records"
      output: "new-cohort Q and separate original Qc histories"
      source_ids:
        - ilcd-allocation-2010
    - id: cohort_service
      applies_to: "all inventory rows"
      rule: "For a positive new-cohort Q, report each compatible assigned exchange divided by that Q per 1 kg reference flow, retaining gross unallocated physicalV alongside burdenA. Preserve old-cohort exchange vectors entry by entry; add actual additional service to that cohort using its original accepted Qc or an explicitly reviewed causal service method. Do not spread old stock/return burdens or all services over current Q. Q=0, idle/cleanup and failed-lot burdens remain in raw ledgers pending justified assignment/review; no zeroing or forced division."
      inputs:
        - cp_release
        - cp_packaging
        - "all actual exchange and service records"
        - "allocation evidence"
      output: "cohort-specific physical and burden accounts per 1 kg reference flow, with unassigned loads disclosed"
      source_ids:
        - ilcd-allocation-2010
    - id: stage_balance
      applies_to: "each stage and conserved constituent"
      rule: "Apply b_stage_conservation with measured states and real transformations. S0 and S1 raw/WIP/newFG/oldFG/reusable stocks are disjoint. Internal links cancel only with matching material, state, quantity, owner and cohort. For each packaging component, external_in = P + N_ext + ER; ER preserves original vector and cannot generate another provider purchase. Dispatch, owner return and waste retain separate legs and transport."
      inputs:
        - cp_materials
        - cp_release
        - cp_packaging
        - cp_wastes
        - cp_emissions
      output: "stage/factory physical balances and explicit residuals"
      source_ids:
        - epa-eiip-printing
    - id: heat_ledger
      applies_to: "hot_water_heat"
      rule: "Delivered heat requires independent supply and return enthalpy flows: measured integral of supply mass flow times supply enthalpy minus return mass flow times return enthalpy, on one consistent reference state and boundary. Reconcile actual leaks, bleeds, makeup, other material enthalpy crossings and stored-energy change to distinguish delivered, useful and lost heat. Use m times (hs minus hr) only after proving matching boundary mass over the same interval with those terms resolved. No assumed boiler efficiency."
      inputs:
        - cp_utilities
        - "compatible enthalpy/property/provider definition"
        - "supply/return and all side-flow/storage records"
      output: "actual delivered hot-water energy in MJ, with independent mass/energy closure"
      source_ids:
        - ilcd-allocation-2010
    - id: species_mass
      applies_to: "each actual elementary release"
      rule: "Integrate compatible measured outlet species concentration times outlet flow and subtract measured matching inlet species mass; convert to kg with actual units/T/P/humidity, validated recovery and nonoverlapping intervals. Establish chemistry, carbon origin and medium; reconcile controls, stocks, product retention and waste. Missing speciation or NOx quantity convention stays unresolved."
      inputs:
        - cp_emissions
        - cp_formulations
        - cp_utilities
      output: "actual outdoor species mass before cohort assignment"
      source_ids:
        - epa-eiip-printing
  data_quality_requirements:
    - id: dq_identity
      applies_to: "novel and route"
      requirement: "Adult prose fiction and general readership, complete edition/page sequence, non-periodical purpose and every physical/printing/binding qualifier must be independently verified; catalogue options alone cannot qualify a job."
      evidence: "editorial/job brief; actual publication; equipment and supplier specifications; acceptance"
    - id: dq_amounts
      applies_to: "all rows"
      requirement: "Collect actual amounts, composition, state, provider and compatible units; document sampling/calibration uncertainty and source limitations. Identity evidence, maximum equipment capacity and safety/environmental claims supply no recipe or default quantity."
      evidence: "primary factory and supplier records; calibrated meter/scale; original methods"
    - id: dq_cohorts
      applies_to: "stocks, returns and services"
      requirement: "Reconcile unique first-release Q, old Qc, disjoint stocks and per-exchange inherited vectors; keep gross P/N_ext/ER and transport legs, no double whole/component ownership."
      evidence: "stock and custody ledgers; first-release/return links; provider-vector and transport audit"
    - id: dq_completeness
      applies_to: "concrete dataset"
      requirement: "Reconcile all actual extra constituents, fuels, aids, maintenance, wastewater, leaks and emission species separately. No unobserved flow is zero. Missing ordinary auxiliary UUID is a row gap; actual reference/primary physical conflict blocks that use, while missing quantities/providers prevent quantitative completeness."
      evidence: "complete site/constituent survey; physical balances; receiver/provider evidence; performed/skipped checks and explicit gaps"
    - id: dq_allocation
      applies_to: "burden account"
      requirement: "Preserve raw physicalV and assigned burdenA separately, including residual and Q=0 loads. Retain causal evidence, denominator, gate values/fees and sensitivity; unsupported allocation remains review-required."
      evidence: "original allocation records and independent method review"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference dataset"
    rule: "Check adult general-interest fiction and non-periodical identity, all exclusions and complete novel qualifiers. Do not replace this independent record with the prior multi-category manufacturing PCR. No whole-leaf/all-technology applicability follows from one representative route or a generic printed-material UUID."
    source_ids:
      - unsd-cpc3-books
      - walsworth-books
  - rule_id: v_reference
    applies_to: "finished_novel and all rows"
    rule: "Require one final reference row, 1 kg net complete novel, same final denominator and matching EN/ZH identities/units/rules. Check unique first release, new closing FG once, old Qc inheritance, returns/rework and all additional-service ownership; retained ink/glue/powder belongs in net book mass."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_physical
    applies_to: "all physical stages"
    rule: "Close material/water/carbon and energy by actual state, stocks and transformation, cancelling matched internal links. Require separately metered water, formulation-carried water and retained/waste/air water without duplicate inputs. Unexplained residuals and missing quantity bases stay explicit; no invented yield or plant recipe."
    source_ids:
      - epa-eiip-printing
  - rule_id: v_packaging
    applies_to: "each component"
    rule: "Verify P includes all-in purchases, N_ext is genuinely first external non-purchase receipt, ER has preceding same-item outward proof; audit owner/cohort/inherited vector, all disjoint inventories, gross dispatch/owner-return/waste and each actual transport leg. Whole-container and component supply providers occur once, with measured reuse service or pending review."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_utilities
    applies_to: "utilities and provider selection"
    rule: "Recheck actual voltage/grid/year, gas-volume conditions and hot-water property/energy boundary. Heat mass mismatch requires independent enthalpy legs and actual side-flow/storage terms. Distinguish on-site generation, purchased heat and electric heating, with no duplicated generation or assumed efficiency."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_species
    applies_to: "emissions and wastes"
    rule: "Verify flow type, CAS where applicable, outdoor medium and exact measurement basis. PM size bins are disjoint; never add cumulative PM10/TSP to their sum or captured dust. Preserve fossil/biogenic carbon, retained carbon and actual combustion; do not infer all VOC escapes or equate TVOC-as-carbon to species. Each actual extra species needs separate identity and quantity review."
    source_ids:
      - epa-eiip-printing
  - rule_id: v_burden_gaps
    applies_to: "completed quantitative dataset"
    rule: "Review allocation separately from physical balances and database identity. Unresolved values/fees, incompatible providers, unassigned Q=0 loads, missing species/quantities or unsupported service basis prevent a completeness claim. Ordinary auxiliary UUID gaps are specific row debts, not evidence that all methodology is unavailable. Scientific and bilingual acceptance remain independent reviews."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing input for the same qualified adult novel edition and construction, after actual data and provider review"
  allowed_use: "Route-specific factory-gate production with measured new/old cohorts, complete compatible supply/treatment models and disclosed uncertainty"
  excluded_use: "All-books or all-32299 average; excluded editorial categories/technologies; equal reading-service/lifetime claim; fabricated default recipe or ready quantitative dataset inferred from UUIDs"
  required_metadata: "Full reference qualifiers; original edition/cohort and first release; actual site/year/providers; boundary and source limitations; grade/formulation; physical and burden/transport ownership; allocation and measurement methods"
  required_quality_disclosure: "Range/UUID/provider/quantity/species gaps; balance residuals; uncertainty; allocation sensitivity; Q=0 loads; performed and skipped validation; excluded scope"
  update_trigger: "Editorial audience/purpose, edition/construction, stock/formulation, plate/printing/binding, utilities/provider boundary, cohort/service method, packaging ownership, receiver or measurement changes"
data_sources:
  - id: "unsd-cpc3-books"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 Explanatory Notes, 30 June 2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf ; official code page https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/32299"
    used_for: "PDF/printed pp.148–152: book categories, 32299 adult/general-interest fiction applicability, audio exclusion, periodical frequency and music/advertising separation. Classification evidence only; no manufacturing recipe or HS rule adopted."
  - id: "epa-eiip-printing"
    type: "official_guidance"
    reference: "US EPA EIIP Vol. II Chapter 15, Preferred and Alternative Methods for Estimating Air Emissions from Printing, Packaging and Graphic Arts, May 2002, https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "§2.1.1/PDF14–15, Figure15.2-1 and §4.1/PDF31 onward: wet sheetfed operations, setting, materials and physical record accounting. Historical air-emission guidance, not LCA allocation, universal factors, recipes or actual site observations."
  - id: "mm-antaro"
