  classification_refs: "CPC 3.0 32299; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "Complete adult general-interest prose fiction novels made in the specified uncoated-sheet, wet-sheetfed, non-reactive-EVA, flexible-paper-cover construction"
  excluded_products: "Educational/reference/directory/professional/children's titles; periodicals/music/advertising/audio/electronic products; other general-interest book forms; alternative stock, finishing, printing and binding routes listed in section 1"
  representative_product: "One declared adult novel edition, black narrative text, optional CMYK cover, uncoated chemical-pulp paper, milled-spine EVA paperback, complete and accepted at printer gate"
  production_route: "File/prepress; process-free CTP plate imaging; text and cover wet sheetfed offset and absorption/oxidative setting; fold/gather; spine milling; EVA spine/side glue and cover attachment; three-side trim; inspect; pack"
  market_state: "Newly manufactured, first-quality-released complete novel at factory gate; dispatch packaging is accounted separately"
functional_unit:
  what: "Supply the complete printed narrative of one declared adult general-interest literary fiction novel edition"
  how_much: "1 kg net accepted complete novels of that edition; report copy count and measured net copy mass as supporting information"
  how_well: "Verified edition/text/page sequence, legibility and print register, complete cover and trimmed dimensions, binding integrity and purchaser-agreed acceptance tests; declare measured criteria and results, without a universal performance threshold"
  how_long_or_cycle: "One manufacturing lot at first quality release; reading duration, rereading count, reader satisfaction and service lifetime are not quantified"
  reference_flow_link: "finished_novel"
system_boundary:
  rules:
    - rule_id: b_novel_scope
      applies_to: "applicability"
      rule: "Confirm adult fiction, general readership, complete non-periodical title and each structural/route qualifier from the actual job. Similar binding does not admit excluded editorial categories or the rest of 32299."
      source_ids:
        - unsd-cpc3-books
        - walsworth-books
    - rule_id: b_route
      applies_to: "manufacturing"
      rule: "Include file preparation, CTP, plate make-ready and coating fate, body/cover printing and setting, fold/gather, milling, glue melting/standby/purges, cover pressing, trimming, quality release, packing, cleaning, compressors, cooling and dust extraction. Keep stage records inside novel_manufacture."
      source_ids:
        - epa-eiip-printing
        - mm-antaro
        - kodak-process-free
    - rule_id: b_provider_once
      applies_to: "inputs and background models"
      rule: "Use one complete-formulation or explicitly complete component-supply model per actual purchase; do not add assayed ink/glue components or paper's mill energy again. Verify constituent closure, delivered state and actual provider scope. The same applies to whole containers and their components."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_stage_conservation
      applies_to: "each stage and constituent"
      rule: "Retain S0 + external_in + internal_in + formation = S1 + external_out + internal_out + consumption + residual. Formation/consumption require real transformation and constituent/stoichiometric evidence; matched same-state transfers are neither formation nor external receipts. At aggregation, each internal_out equals the receiving internal_in and cancels. Retain water/oxygen/carbon uptake and actual evaporation/oxidation separately; unexplained residual is uncertainty, not an identified emission."
      source_ids:
        - epa-eiip-printing
    - rule_id: b_cohorts
      applies_to: "products and services"
      rule: "Apply release_cohorts to raw stock, WIP, new and old finished goods, failed lots and same-item returns. Internal rework and same-state warehouse transfers preserve physical identity and inherited exchange vectors; they do not generate new Q, upstream purchases or avoided burdens."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_gate
      applies_to: "waste, emissions and transport"
      rule: "Include actual incoming delivery and attributable waste transport/treatment once, with all gross packaging dispatch/return legs. Record outdoor releases after controls; distinguish captured dust, sewer/offsite waste and indoor exposure. Auxiliary heating is separate from ink setting; supplier electricity/heat emissions remain in backgrounds. Extra actual fuels, refrigerants, maintenance parts or chemicals require individual surveyed rows and provider review before dataset completeness."
      source_ids:
        - epa-eiip-printing
boundary_abstraction:
  declared_starting_condition: "Dry unprinted text and cover paper sheets, complete process-free coated plates and as-supplied ink, fountain concentrate, wash and EVA received at printer"
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "Adult general-interest fiction novel subset of CPC 3.0 32299 only, in the selected complete-paperback construction"
  recursive_input_rule: "Purchased complete novels, opening finished stock and same-item returns retain their actual original upstream exchange vectors and cohort identities; they cannot become virgin paper receipts or newly formed output by relabelling or reinspection"
  upstream_dataset_requirement: "Actual compatible paper, complete plate, complete formulations, utilities, each packaging component, transport and treatment backgrounds; retain production, delivery and end-of-life ownership once"
  disclosure: "Edition/site/period, included outsourced stages, new and old cohorts, suppliers, all boundary exclusions, meters and balances, unresolved identities/providers/ranges, allocation rationale and quality limits; downstream distribution, retail, reading and novel disposal excluded"
