    applies_to: "electricity; natural_gas; hot_water_heat"
    required_property_ref:
      name: "actual reference property"
      uuid: ""
    required_unit: "MJ; m3"
    rule: "Electricity uses the verified Net calorific value property and exact 1 kWh = 3.6 MJ. Gas uses Volume, with actual T/P, humidity, composition and compressibility matched to provider. Heat requires a separately verified delivered-energy property/provider and heat_ledger, never an assumed efficiency or mass-as-heat substitution."
