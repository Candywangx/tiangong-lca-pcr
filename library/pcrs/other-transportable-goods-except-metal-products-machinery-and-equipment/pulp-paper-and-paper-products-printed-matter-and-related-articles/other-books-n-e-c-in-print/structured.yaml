    applies_to: "all inventory rows"
    required_property_ref:
      name: "reference-product Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Final values use per 1 kg reference flow. Keep gross physical records and cohort ownership before normalization; first-release Q and inherited old-cohort Qc are distinct under release_cohorts. Never divide all monthly sales, returns or services by current new Q."
  - id: supplied_basis
    applies_to: "formulation rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record as-supplied ink, fountain concentrate, blanket wash and EVA formulations individually. Assayed components explain retention/releases and do not add duplicate purchase/provider inputs. Volume conversion requires actual formulation density and temperature."
