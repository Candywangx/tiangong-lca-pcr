    used_for: "§§7.9.2–7.9.3, printed255–272/PDF275–292, especially255–258 and263–266: attributional subdivision, exchange-specific determining physical causality, residual gate/condition economic allocation and special recycling/negative-fee limits. General method assessed for this manufacturing study; cohort, packaging and heat-ledger implementation requires actual foreground evidence; no blanket ILCD compliance or recycling formula claimed."
