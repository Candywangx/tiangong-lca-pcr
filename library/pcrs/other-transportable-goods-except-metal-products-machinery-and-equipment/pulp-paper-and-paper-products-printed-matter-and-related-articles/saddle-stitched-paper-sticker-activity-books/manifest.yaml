  semantic_boundary:
    product: "One paper sticker activity booklet with non-adhesive content pages, printed kiss-cut coated-paper removable water-borne acrylic PSA on siliconized paper liners, metal saddle stitches and flexible paper cover"
    route: "Receive finished supplied printed/kiss-cut/finished components; dry collate/fold/staple/trim/pack; upstream production must remain linked once"
    mapping_proposal: "CPC3.0:32690 narrower only; official32292 exclusion points sticker books to32690, not whole residual coverage; controller independent acceptance required"
    legacy_scaffold: "other-printed-matter remains untouched; new semantic identity avoids a residual-name canonical record"
    reuse_decision: "Existing32540 loose sheet,32197 wet-flexo PSA label,32210 EVA paperback and32410 heatset magazine are partial upstream methods, not complete sticker-book identity, composition denominator and assembling route; same audience/content does not create identity"
  unresolved_flow_rows:
    - "sticker_sheets"
    - "carton"
    - "incoming_carton"
    - "lubricating_oil"
    - "sticker_trims"
    - "reject_books"
    - "collected_dust"
  unresolved_identity_details:
    carton: "Complete outgoing corrugated carton; available 4f197bec fixes 16.6% primary/83.4% recycled fibre not justified by actual supplier; no compatible unrestricted complete-container UUID confirmed. Bare board, folding carton and mixed packaging are not substitutes."
    incoming_carton: "Complete received supplier corrugated carton, conditional; retain gross/net mass, supplier returns, reuse, stock and waste. Bundled upstream packing burden is reconciled once, not charged twice; complete-container UUID unresolved."
    sticker_sheets: "Receive one finished printed, kiss-cut laminate: coated cellulose-paper facestock, dried removable water-borne acrylic PSA and siliconized paper liner. Record each retained layer, ink, any actual surface finish, moisture and delivered matrix. Supplier kiss-cutting leaves the liner intact; no onsite coating or kiss-cutting is presumed. The paper-label candidate does not establish the identity and reference-mass inclusion of the whole delivered liner-backed sheet, so its UUID stays unresolved."
    lubricating_oil: "Conditional mineral lubricating oil actually consumed in finishing-machine maintenance. Measure withdrawals, returns and retained machine stock by grade. A total-synthesis lubricating-oil record with a petroleum-refining comment is not accepted for this mineral-oil identity; no general oil recipe or dose is assumed."
    sticker_trims: "One composite offcut stream of the received printed paper/acrylic-PSA/siliconized-paper laminate. Keep actual ink/finish contamination and component fractions. Do not relabel it as clean waste paper, pure adhesive or bare separator-paper scrap; no matching complete-composite UUID is confirmed."
    reject_books: "One rejected assembled sticker-book stream, retaining its actual paper/adhesive/liner/finish/wire composition. Record units and measured net mass. Internal rework is not an external waste exchange; dismantled separately shipped constituents need distinct cards and a reconciliation to the original reject mass."
    collected_dust: "Separately collected dry printed-paper cutting dust, with actual pigment/mineral/PSA/liner/finish contamination from its capture location. Weigh collector stocks and offsite dispatch. This solid waste is not outdoor particulate release and is not automatically paper-recyclable. No exact powder-state/composition UUID is confirmed."
  identity_limits:
    finished_book: "Printed Matter a07593ed broad mechanical paper-print identity conditionally contains assembled paper book; no contradictory route/material limit observed; full postal-fee/paper3D comment is neither a postal-service identity nor a required prototype route; actual supplier quantities/backgrounds remain unverified"
    cover_sheets: "Same generic printed identity for received paper cover input; its protective layers/provider are separately disclosed; input identity reuse does not create another final output"
    stitch_wire: "SteelWire62bb non-alloy classification; actual grade/coating and provider reference basis required; no galvanized quenching route inferred"
    paper_trims_and_incoming_cartons: "Generic waste-paper identity only for each explicitly segregated paper stream; recipient and contamination remain required; not adopted for PSA composites or collected dust"
  native_hard_limits:
    electricity: "50657322 requires CN supply, <1kV grid-average consumption mix to user; other country/voltage needs separately verified identity, not a later-data waiver."
    wire_scrap: "ae44c4ac is steel cutting offcuts at plant GLO, treatment excluded; previous f4c839b2 incoming-wire/strip preparation identity does not establish stitcher staple-cutting origin."
    sticker_grade: "Removable dried water-borne acrylic PSA on paper, proved on specified printed-paper adherend; liner release alone is not removability. Permanent/high-tack or UV-hotmelt grades require applicability review."
  provider_compatibility: "Identity lookup is not supplier dataset compatibility. Complete component dry/wet/liner-inclusive mass, actual finish chemistry, non-alloy wire/coat, <1kV grid, recipients, layer process boundaries and quantities require foreground/supplier records before a dataset is complete. No real factory data is claimed."
  source_limits: "UN classification establishes inclusion only. Sunnywell/Chinaprinting4u commercial evidence establishes real constructions/capability only, not universal quantities or selected grade. BASF portfolio supports removable acrylic application but not chosen supplier/SKU/safety approval. Paper BREF is upstream paper scope. EPA methods retain specific phase/location/version conditions. YUEN was directly read via web; local HTML HTTP403 and shared browser busy prevented original acquisition, so metadata-only registration is not verified reusable original and is not relied upon as an exclusive method source."
  measurement_limits: "No factory consumption/emissions measured by author; protocols require actual calibration, stock/layer/moisture and representative outlet/fugitive records. Total/droplet/condensable coverage and matching size fractions cannot be inferred from Method201A alone. Actual material water exchange needs physical survey and additional atomic row when crossing boundary."
