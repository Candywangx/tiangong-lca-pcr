    required_unit: "kg"
    rule: "Weigh accepted complete lots on calibrated scales through cp_output. Retained liners, matrix, adhesive, finishes and staples belong to net book mass. Exclude transport packing and rejects."
  - id: common_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "All rows and collection aggregation use per 1 kg reference flow over the same site/campaign/configuration. Divide measured attributable campaign exchanges by measured accepted net book mass. Zero/missing denominator blocks normalization. Counts and areas cannot replace measured mass."
  - id: composite_basis
    applies_to: "sticker_sheets, cover_sheets"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Incoming delivered composite wet/as-received mass is distinct from dry facestock, dry adhesive, liner and finish masses. Derive fractions only from actual supplier assay/area-coat records and measured moisture. Never apply a bare-sticker provider quantity to a liner-inclusive sheet or count component backgrounds twice."
