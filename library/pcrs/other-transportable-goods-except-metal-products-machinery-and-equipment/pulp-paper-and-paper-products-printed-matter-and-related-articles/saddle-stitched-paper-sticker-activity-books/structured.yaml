system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "physical applicability"
      rule: "Require the explicit paper/PSA/paper-liner/stapled activity-book structure; do not substitute a marketing category for construction or assign whole residual coverage."
      source_ids:
        - un-cpc3-2025
        - china4u-sticker
    - rule_id: b_foreground
      applies_to: "p_assemble"
      rule: "Include receiving losses, QC/collation/folding/stapling/trimming, actual dust capture, packing, attributed electricity/maintenance and all measured waste/net releases. Printing/coating/laminating/kiss-cutting are supplied stages; onsite occurrence requires explicit scope extension and replacement of corresponding upstream stages."
      source_ids:
        - sunnywell-sticker
        - china4u-sticker
    - rule_id: b_upstream
      applies_to: "supplied parts"
      rule: "Include complete actual pulp/paper manufacture and coating, drying/calender/cutting/broke/wastewater; supplied printing ink/plate/wash/energy/emissions; PSA polymer/coat/dry losses; liner silicone and retained finishes. BREF7.1.4/7.1.10 concerns paper mills, not binder factors; wood/plywood sources do not establish paper processing. EPA ink guidance distinguishes supplier routes without prescribing default retained percentages."
      source_ids:
        - jrc-paper-bref-2015
        - epa-offset-ctg-2006
        - basf-psa
    - rule_id: b_ledgers
      applies_to: "physical and allocated ledgers"
      rule: "Report one foreground assembly unit with separate stage meters. Internal transfers match at both ends in mass, moisture and composition. Keep unallocated material/water/fossil-and-biogenic-carbon and energy balances separate from allocated environmental burdens; never multiply physical co-product output by allocation shares. Retained delivered liner/matrix is product, not site waste. Include incoming supplier packing, shipment packing, returns and maintenance stocks in whole-site physical ledgers. Match supplier returns at both ends; they are not consumption or automatically waste, but their attributable transport, inspection and handling remain. Shipped packing leaves the physical gate while remaining outside net book reference mass. Reuse moves existing packing stock; never book it again as a new carton purchase."
      source_ids: []
    - rule_id: b_releases
      applies_to: "nature boundary"
      rule: "Distinguish collected dust from outdoor releases and filterable fractions from cumulative/condensable PM. Include fugitive releases using a site-specific valid protocol; stack Method201A cannot measure open-room exposure or be extended to droplet-laden exhaust. Add actual moisture exchange and other emissions as individually identified exchanges; do not force a mass residual into PM. Keep actual upstream/treatment biogenic CO2 in LCI even if a climate reporting metric excludes it."
      source_ids:
        - epa-method201a-2020
