allocation_rules:
  - rule_id: a_subdivide
    applies_to: "shared operations"
    rule: "Use dedicated campaign/stage measurements first. For shared finishing electricity and labour-supported service loads use documented causal machine runtime/load evidence, retaining start-up and reject work. Do not assume page counts, price or mass prove a causal share."
    source_ids: []
  - rule_id: a_residual
    applies_to: "joint burdens"
    rule: "If subdivision or a justified causal relationship cannot resolve remaining joint burdens, define and justify a separate study allocation with complete physical and value evidence (actual sale quantities, price, currency, price date, valuation boundary and any conversion); keep unallocated totals and shares summing to one. Unknown allocation blocks affected dataset completeness. Physical output is unchanged by these shares."
    source_ids: []
  - rule_id: a_waste
    applies_to: "residues"
    rule: "Classify recipients using actual contamination and acceptance. Waste does not become a co-product because it is sold or labelled recyclable. Apply declared study recycling/end-of-life rules once, with actual treatment; neither supplier recycled content nor outgoing scrap gives an automatic avoided-burden credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "p_assemble"
      flow_role: "finished_book"
      record_type: "acceptance weighing"
      raw_fields: "lot/configuration; accepted count; net book mass; packing tare; moisture; page/liner/matrix/staple composition; acceptance tests"
      collection_method: "Calibrated net lot weighing excluding removable transport packing; reconcile counts and delivered complete configuration. Count/area QA checks use measured actual book mass, not a catalogue grammage default."
      unit: "kg"
      frequency: "each accepted lot"
      temporal_coverage: "same declared campaign; retain actual dates"
      site_scope: "one stated site/configuration, suppliers explicitly linked"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, stock reconciliation, original records and uncertainty/limits"
    - protocol_id: cp_parts
      process_id: "p_assemble"
      flow_role: "product inputs"
      record_type: "material lot records"
      raw_fields: "SKU/provider; received/returned/opening/closing mass; moisture; sheet area/count; layer assay/coat/liner/matrix/finish; component elemental-carbon assay and fossil/biogenic origin; wire grade; background reference basis; external/internal return sender/receiver; incoming/shipped packing and reuse stock; inlet/outlet air T/P/RH/volume and material conditioning/moisture change"
      collection_method: "Calibrated scales and reconciled supplier stock/assay records; weigh each received physical component. Use actual moisture/elemental-carbon analyses or matched supplier certificates and carbon-origin records; no fixed carbon fraction or biomass-balance substitution. Reconcile wet/dry/area bases and retain source uncertainty; purchased composites count once, their constituents are upstream decomposition only. Reconcile supplier returns and every stage transfer on both sides. Measure received packing separately even if its supply burden is bundled in the component provider; do not charge it twice. Record shipped packing and closure materials as physical gate outputs outside net reference mass."
      unit: "kg"
      frequency: "each lot and inventory change"
      temporal_coverage: "same declared campaign; retain actual dates"
      site_scope: "one stated site/configuration, suppliers explicitly linked"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, stock reconciliation, original records and uncertainty/limits"
    - protocol_id: cp_energy
      process_id: "p_assemble"
      flow_role: "electricity"
      record_type: "stage meter record"
      raw_fields: "meter/calibration; kWh; stage running/idle/setup; compressor/dust-capture allocation; grid supply country/voltage/year/location/provider; incoming and outgoing energy, stock change and heat dissipation with measurement/estimate uncertainty"
      collection_method: "Read calibrated submeter and actual shared-meter attribution records; reconcile energy totals and supplier delivered-electricity boundary. No steam or fuel inferred from electrical-property naming. Track electrical work and resulting heat dissipation once; internal compressed air is not another purchased-electricity exchange. Document the physical energy balance and uncertainty; no invented heat quantity or automatic zero for missing losses."
      unit: "kWh; MJ"
      frequency: "each shift/campaign"
      temporal_coverage: "same declared campaign; retain actual dates"
      site_scope: "one stated site/configuration, suppliers explicitly linked"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, stock reconciliation, original records and uncertainty/limits"
    - protocol_id: cp_waste
      process_id: "p_assemble"
      flow_role: "waste outputs"
      record_type: "segregated waste ledger"
      raw_fields: "stream; source stage; kg; opening/closing stock; moisture; paper/ink/coating/PSA/liner/finish/steel contamination; component carbon assay and origin; recipient/treatment; rework status"
      collection_method: "Segregated calibrated bin/dispatch weighing with recipient evidence. Keep solid collector dust separate from outdoor releases and shipped liner/matrix separate from offsite waste. Reject dismantling and internal rework preserve physical history."
      unit: "kg"
      frequency: "each collection/dispatch and stock change"
      temporal_coverage: "same declared campaign; retain actual dates"
      site_scope: "one stated site/configuration, suppliers explicitly linked"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, stock reconciliation, original records and uncertainty/limits"
    - protocol_id: cp_maintenance
      process_id: "p_assemble"
      flow_role: "lubricating_oil; spent_oil"
      record_type: "maintenance lot ledger"
      raw_fields: "grade/SDS; withdrawals/returns; machine stocks; run hours; spent oil moisture/contamination and recipient"
      collection_method: "Weigh actual grade withdrawals, retained stocks and separately dispatched used oil; assign causally to campaign equipment work. Non-use requires records; spills/wipes/other grades need separate atomic rows."
      unit: "kg"
      frequency: "each maintenance and campaign"
      temporal_coverage: "same declared campaign; retain actual dates"
      site_scope: "one stated site/configuration, suppliers explicitly linked"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, stock reconciliation, original records and uncertainty/limits"
    - protocol_id: cp_air
      process_id: "p_assemble"
      flow_role: "pm_fine; pm_mid; pm_coarse"
      record_type: "emission measurement campaign"
      raw_fields: "outlet/control; operating hours; air volume T/P wet/dry basis; fractional filter/cyclone masses; blanks/recovery/detection limits; fugitive protocol; aerodynamic cut basis"
      collection_method: "Use a competent laboratory with documented applicable sampling, calibration, representative operating coverage and unit basis. For dry droplet-free stationary exhaust, Method201A describes filterable particle size cuts; satisfy its complete sampling/temperature/recovery conditions. It is not a fugitive/indoor method or proof of total/condensable coverage. Survey fugitive pathways separately with an independently justified site protocol; unsupported quantities remain unknown."
      unit: "kg; mg/m3; m3; h"
      frequency: "representative runs with campaign/control changes"
      temporal_coverage: "same declared campaign; retain actual dates"
      site_scope: "one stated site/configuration, suppliers explicitly linked"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, stock reconciliation, original records and uncertainty/limits"
  calculation_rules:
    - id: normalize_campaign
      applies_to: "all inventory rows"
      rule: "For each row divide its measured net attributable campaign numerator in its declared unit by accepted net complete book mass in kg; no numerical consumption default. Final reference output is 1 kg."
      inputs:
        - cp_parts
        - cp_energy
        - cp_waste
        - cp_maintenance
        - cp_air
        - cp_output
      output: "per 1 kg reference flow"
      source_ids: []
    - id: physical_reconciliation
      applies_to: "physical ledgers"
      rule: "Reconcile opening stock plus received material against accepted complete books, external wastes/releases and closing stock in the same moisture/composition basis. Keep separate water and fossil/biogenic-carbon ledgers; measure changing moisture or add actual elementary moisture exchanges rather than assigning residuals to dust. Account explicitly for external supplier returns, shipped packing and maintenance retained stocks. Distinguish net H2O sorption/desorption from throughflow ambient-air humidity using measured material-water change and inlet/outlet air T/P/RH on matched wet/dry volume bases. Do not treat all exhaust moisture as product evaporation or use dry solids to close a wet-mass balance. Identify actual cross-boundary moisture in its correct direction/phase/medium as separate atomic exchanges before completing a dataset; unknown is not zero. Separately reconcile electrical input, useful work, stored energy and heat dissipation, retaining estimation uncertainty without creating an environmental credit. Set tolerance from actual instrument uncertainty and unresolved terms, never a universal percentage."
      inputs:
        - cp_parts
        - cp_output
        - cp_waste
        - cp_maintenance
        - cp_air
      output: "unallocated physical balances"
      source_ids: []
    - id: particle_intervals
      applies_to: "pm_fine; pm_mid; pm_coarse"
      rule: "Use matched campaign/control/sampling bases. PM2.5 is cumulative fine mass; PM2.5–PM10 is PM10 minus PM2.5; >PM10 is directly recovered oversize mass or compatible verified total minus PM10. Reject negative/incompatible differences; never sum PM2.5 and cumulative PM10. Method201A filterable and condensable coverage remain distinct."
      inputs:
        - cp_air
      output: "three disjoint outdoor fractions"
      source_ids:
        - epa-method201a-2020
  data_quality_requirements:
    - id: dq_parts
      applies_to: "supplied components"
      requirement: "Resolve every physical layer/state and amount-compatible supplier stage, including upstream removed matrix/liner and coating/drying water. Missing layer masses, provider unit basis or offsite waste fate prevents a complete linked dataset."
      evidence: "cp_parts; supplier primary records"
    - id: dq_acceptance
      applies_to: "finished_book"
      requirement: "Retain agreed liner release and separate removable adhesion tests on the specified printed-paper adherend, including PSA grade, dwell/conditioning, peel/residue/fibre damage, liner integrity, configuration and stitching/trim acceptance tests. Manufacturer safety/quality claims are not an actual product test or certification."
      evidence: "cp_output; actual test records"
    - id: dq_completeness
      applies_to: "all rows"
      requirement: "Retain actual quantities, limits, non-use evidence and named unresolved identities separately. Blank UUID, unknown emission or missing supplier data is not zero or a verified substitute; identity lookup is not dataset quality approval."
      evidence: "all collection records"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_book"
    rule: "Require exactly one final reference output and calibrated liner/matrix-inclusive accepted mass. Match reference amount, inventory denominator, collection aggregation and EN/ZH scope. Missing qualifiers/reference basis fails completeness."
    source_ids: []
  - rule_id: v_chain
    applies_to: "all inputs and wastes"
    rule: "Check flow type, physical state, route/CAS, official localized names, native reference property/unit group/unit and each row’s provider quantity compatibility. Native region, route, pressure, concentration, composition and phase restrictions are hard matching conditions, not gaps waived by later collection. Broad identity does not excuse an opposing route or omitted liner; unresolved rows need an explicit reviewed physical match before dataset linkage."
    source_ids: []
  - rule_id: v_ledgers
    applies_to: "physical balances and allocation"
    rule: "Reconcile unallocated mass/water/carbon/energy/internal links, supplier returns, incoming and shipped packing, maintenance and reject/rework/waste stocks before allocation. Check separate burden shares and donor/receiver consistency; actual negative differences or unexplained residuals block affected data acceptance."
    source_ids: []
  - rule_id: v_air
    applies_to: "air releases"
    rule: "Require disjoint size fractions and correct outdoor medium, actual control/measurement coverage, no duplicated captured solids and no unsupported zero. Preserve unknown >PM10/fugitives/condensables; methods do not themselves prove a measurement was performed."
    source_ids:
      - epa-method201a-2020
  - rule_id: v_boundary
    applies_to: "scope/provider review"
    rule: "Reject substituted bare stickers, textbook UUIDs explicitly excluding sticker books, incompatible synthetic media/binding/routes, duplicated supplier stages or untracked onsite extensions. Candidate methodology is not independent scientific approval or accepted CPC mapping."
    source_ids:
      - un-cpc3-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Explicit route-matched sticker activity book supply in declared downstream studies"
  allowed_use: "Only measured documented configuration with complete supplier/treatment links and stated uncertainty; assess additional distribution/use/end-of-life separately"
  excluded_use: "Whole CPC32690 averages, label-only/bare-sticker substitution, other bindings/materials, safety approval or generic per-book default quantity"
  required_metadata: "All reference qualifiers; geography/date/technology, supply handoffs, layer masses, moisture, utilities, recipients, allocation and original evidence"
  required_quality_disclosure: "Coverage/performed/skipped checks; source independence and limits; unresolved identity/provider/quantity; measurement uncertainty and non-use evidence"
  update_trigger: "Change in paper/PSA/liner/finish/wire/binding/print route, supplier boundary, site/control/meter method, accepted design or better evidence"
