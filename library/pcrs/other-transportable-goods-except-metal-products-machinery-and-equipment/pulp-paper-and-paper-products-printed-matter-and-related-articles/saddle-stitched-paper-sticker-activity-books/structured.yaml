    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Meter delivered electricity; 1 kWh = 3.6 MJ. Preserve the native Net calorific value property for this electric-energy identity and its provider boundary; it is not proof of delivered steam heat."
