measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure accepted complete directory net mass at recorded moisture under cp_release; include retained ink/glue/powder and exclude dispatch packaging."
  - id: one_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "reference product mass"
      uuid: ""
    required_unit: "kg"
    rule: "Every exchange, collection aggregation and calculation uses per 1 kg reference flow. Reconcile raw period/lot amounts and first quality release Q before a single final normalization; input sheets, impressions, listings and dispatch copies are not substitutes for Q."
  - id: quantity_ownership
    applies_to: "supplied formulations and wastes"
    required_property_ref:
      name: "whole-stream mass"
      uuid: ""
    required_unit: "kg"
    rule: "Quantify each supplied ink/concentrate/wash/EVA grade once as a whole formulation; constituent assays support balances, not duplicate input exchanges. Retain actual density, temperature, moisture and concentration if converting records. Whole liquid mass is not dry solids."
  - id: electric_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert actual metered electricity by 1 kWh = 3.6 MJ. A flow's property label does not establish voltage, provider or heating duty."
  - id: gas_volume
    applies_to: "natural_gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Preserve meter/provider temperature, absolute pressure, wet/dry basis, composition and compressibility; establish compatible delivered volumes. For the separate consolidated mass balance, gas mass = compatible metered volume × actual gas density established by calibrated measurement or documented composition/T/P/Z calculation under cp_energy. Keep the inventory exchange in native m3. No generic density or pure-methane composition."
