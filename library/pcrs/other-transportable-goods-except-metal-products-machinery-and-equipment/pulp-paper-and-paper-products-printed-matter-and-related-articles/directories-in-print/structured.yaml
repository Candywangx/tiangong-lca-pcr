allocation_rules:
  - rule_id: a_physical_first
    applies_to: "all ledgers"
    rule: "Close gross physical material/water/carbon and packaging ledgers before allocating environmental burdens. Preserve actual product and waste mass; never multiply physical outflows by an environmental-load share. Show gross physical exchange/Q and attributed burden/Q as distinct accounts. EIIP supports emission/material accounting, not the LCA allocation hierarchy. Apply ILCD 7.9 partitioning only within its attributional scope: document study goal/decision context, LCI approach and why allocation cannot be avoided by subdivision, virtual subdivision or goal-compatible system expansion/substitution. This manufacturing PCR supplies no consequential substitution scenario or blanket ILCD-compliance claim."
    source_ids:
      - epa-eiip-2002
      - ec-jrc-ilcd-2010
  - rule_id: a_cause
    applies_to: "shared equipment"
    rule: "Prefer job segregation, direct metering or subdivision, including virtual subdivision where process understanding quantifies an exchange exclusively related to a job. Assign directory-specific file correction, plate changes, reprinted listing/index signatures and cleanup to their causal lot; record job order and changeover responsibility. For remaining shared compression/cooling/press/binder/standby loads use demonstrated exchange-specific causal runtime, impressions/printed area/passes or metered thermal demand, with the full competing-job denominator. Runtime alone requires comparable service intensity; justify differing operating modes and split loads where needed. Do not impose one key on all exchanges or use title, listing count, selling price or accepted mass as a default causal share."
    source_ids:
      - ec-jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "unavoidable shared loads"
    rule: "Document why actual/virtual subdivision is infeasible and test a determining physical relationship for each residual exchange; a convenient mass, time or other physical ratio without causal evidence is not sufficient. Only for loads with no justified determining physical relationship may residual economic allocation use evidenced co-function amounts and representative market values at the same process boundary and delivered condition. State numerator, full competing-function denominator, price period, boundary adjustments, uncertainty and sensitivity; unavailable causal data is a gap, not proof of no causal relationship or permission to invent an equal/physical/economic share. Across all functions, allocated exchange quantities and provider burdens must sum to their original totals. Failed Q=0 lots retain physical and energy loads in failed/WIP ledgers and later justified cohort assignment; they cannot be divided by zero or silently deleted. Normalize the final attributable account once by the same Q."
    source_ids:
      - ec-jrc-ilcd-2010
  - rule_id: a_recovery
    applies_to: "paper/plate and reusable packaging"
    rule: "Record actual receiving process and ownership; sale does not automatically create a co-product credit. Declare treatment/recycling burden and any goal-compatible, evidenced substitution separately, with no duplicated avoided production or switching between attributional partitioning and consequential credits. Before recycling allocation, identify the treatment boundary, valuable secondary function, changes in material properties and true joint process under ILCD 7.9.3 VI; these conditions cannot be inferred from a sale or a waste UUID. Preserve actual signed prices and treatment/gate fees, including zero/negative values, for review of the applicable case; do not clip them to zero or invent a fee-based share, recycling rate or credit. Unresolved case/receiver evidence leaves allocation pending without deleting treatment burdens. Incoming returnable packaging, reuse cycles, closing stock, return and discard stay physically reconciled; any per-use burden needs documented service/ownership and original component/provider evidence under cp_pack and calc_pack."
    source_ids:
      - ec-jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "directory_manufacture"
      flow_role: "directory first release"
      record_type: "required future foreground record"
      raw_fields: "edition/cut-off; layout revision; listing/index checksum; signatures/pages; ordered copies; first accepted copies/net kg; moisture; release date; failed/held/rework lineage; sample design; package tare; opening/closing FG; dispatch/returns"
      collection_method: "Check approved contact fields and index locators against imposed proofs and sampled finished directories; verify signature sequence/page completeness, trim/gutter and binding. Weigh accepted complete net directories on calibrated scales. Separate first release from reinspection of already counted items."
      unit: "kg; copies; pages"
      frequency: "every job and release"
      temporal_coverage: "full declared reporting period with lot cohort reconciliation"
      site_scope: "actual edition, factory and declared outsourced stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed proof/release register; test results; scale calibration; sampling uncertainty; FG reconciliation"
    - protocol_id: cp_material
      process_id: "directory_manufacture"
      flow_role: "each paper/plate/aid/maintenance exchange"
      record_type: "required future foreground record"
      raw_fields: "lot/stage; supplier/grade; count; mass; sheet area/grammage; moisture; opening/receipts/issues/returns/closing raw stock and WIP; plate area/coating; service replacement"
      collection_method: "Weigh each actual grade, reconcile goods receipt and stage issues/returns, measure plate/maintenance component mass. Retain actual woodfree furnish and uncoated state. Paper area/grammage is a check, not invented yield or accepted output."
      unit: "kg; sheets; m2"
      frequency: "every receipt/job/replacement and period close"
      temporal_coverage: "full reporting period including setup/failed/corrected runs"
      site_scope: "factory stages and actual suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weighing; purchase/issue records; furnish/coating specification; stock/WIP account"
    - protocol_id: cp_formula
      process_id: "directory_manufacture"
      flow_role: "each complete formulation and separately added IPA"
      record_type: "required future foreground record"
      raw_fields: "grade/SKU; whole delivered/issued/returned mass; complete composition/CAS including unlisted SDS ingredients; concentration/water/carbon origin; measured density/temperature; retained constituents; stock; supplier background boundary"
      collection_method: "Weigh each supplied ink/concentrate/wash/EVA formulation once. Record separate IPA addition only outside the purchased concentrate. Assay constituents for water/carbon/species balances and provider matching; do not also enter those embedded ingredients as purchased inputs. Weigh spine/side application and purges separately."
      unit: "kg; m3"
      frequency: "every job/material change and period close"
      temporal_coverage: "actual edition/period including startup and cleanup"
      site_scope: "printer, formulation supplier and binder"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "delivery/weighing logs; current supplier formulation; assay; background ownership ledger"
    - protocol_id: cp_energy
      process_id: "directory_manufacture"
      flow_role: "electricity and gas separately"
      record_type: "required future foreground record"
      raw_fields: "device/stage/job; start/end meter; kWh; voltage/grid/year/provider; gas m3/T/P/Z/wet-dry/composition; running/startup/idle/cleanup hours; all competing jobs; fuel/heat ownership"
      collection_method: "Submeter file/CTP, press, compressor/cooling, dust collection, folders/binder/glue pots, trim and packing; reconcile total bills and all period loads. Meter actual ancillary gas separately. Document absence of purchased steam/heat for this selected electric-glue route; an observed other utility requires a new atomic card and applicability review."
      unit: "kWh; MJ; m3"
      frequency: "job/stage meters and bill periods"
      temporal_coverage: "entire declared period including failed jobs, WIP and standby"
      site_scope: "actual facility and attributable service providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; meter/bill reconciliation; equipment logs; causal allocation and gas-volume compatibility"
    - protocol_id: cp_water
      process_id: "directory_manufacture"
      flow_role: "tap water and net vapour separately"
      record_type: "required future foreground record"
      raw_fields: "source/treatment; added water meter; density/T; formulation water; paper moisture; inlet/outlet humidity/airflow/T/P; condensate; spent liquid water; retained product water; stocks; combustion hydrogen"
      collection_method: "Meter separately purchased water, retain whole-formulation carrier water as constituent information, sample liquid streams and product moisture. Measure net outdoor vapour with matched ambient inlet correction; do not call an unexplained balance residual evaporation."
      unit: "kg; m3"
      frequency: "each filling/bleed/job and representative air survey"
      temporal_coverage: "matched reporting period and actual operating modes"
      site_scope: "factory wet-offset/cleanup and any verified ancillary heater"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water-specific assay; calibrated meters/air measurements; density basis; full water balance"
    - protocol_id: cp_waste
      process_id: "directory_manufacture"
      flow_role: "each segregated outgoing stream"
      record_type: "required future foreground record"
      raw_fields: "bin/stage/lot; net whole-stream mass/tare; moisture; liquid volume/density/T; water-specific fraction; independently determined solids/nonwater constituents; retained paper/ink/glue/solvent; opening/closing waste stock; dispatch/receiver/treatment"
      collection_method: "Weigh each actual stream at transfer, reconcile generated/held/dispatched amounts and receiver acceptance. Keep clean trim, printed spoil, failed bound directories, milling dust, used plates, spent liquids and contaminated cloth separate where physically segregated. Never count the same retained ink in two outgoing streams."
      unit: "kg; m3"
      frequency: "collection/dispatch and period close"
      temporal_coverage: "complete period including cleanup and stock change"
      site_scope: "factory transfer point and actual receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing tickets; composition/moisture assays; legal transfer/receiver records; waste stock balance"
    - protocol_id: cp_pack
      process_id: "directory_manufacture"
      flow_role: "each packaging receipt/dispatch/return/waste"
      record_type: "required future foreground record"
      raw_fields: "event id/date/direction; component id/material/grade; owner and original cohort; complete mass/tare and unit; mutually exclusive first purchased receipt P/first external non-purchase N_ext/true inward return ER; prior outward event and same-item continuity for ER; incoming raw-supply attachment; gross dispatch D; outward owner return EO; opening/closing unused/raw-attached/WIP-attached/FG-attached/held/waste stocks; discarded outward component W; receiver; original per-exchange physical and attributed/provider vectors with references/quantities/units; whole-supply included scope; incremental rental/cleaning/transport service and original cohort Q_c"
      collection_method: "Weigh carton, PE film, PP strap and pallet separately if present, for every actual inward/outward event and stock state, including incoming supply packs and unsent WIP/FG. Classify each inward event once: P is first purchased entry, including components covered by an invoiced whole supply; N_ext is first external non-purchase entry, including borrowed, rented, entrusted or free components; ER requires the same component and proven prior outward transfer, not merely absence of an invoice. Distinguish gross dispatch from outward owner returns and actual component waste. Preserve original owner/cohort and each original exchange vector, even across periods; a true return does not acquire production again. Establish whether the whole-supply provider already covers each component before assigning its production once. Free/non-purchase does not mean zero burden; unresolved scope stays a gap. Record actual incremental services separately without adding services already covered by a provider."
      unit: "kg; items"
      frequency: "receipt/packing/dispatch/return and close"
      temporal_coverage: "same lot cohort and reporting period as directory"
      site_scope: "printer stores/packing and actual owner/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "event weighing/BOM and stock reconciliation; purchase/non-purchase agreement; prior outward and same-item return proof; owner/cohort lineage; original exchange/provider scope and service records"
    - protocol_id: cp_air
      process_id: "directory_manufacture"
      flow_role: "each outdoor species/particle bin"
      record_type: "required future foreground record"
      raw_fields: "constituent survey/CAS; outlet; operation mode; concentration; airflow; T/P/humidity; inlet background; interval; calibration/response/recovery; detection limit; PM cut/filterable/condensable; controls; fossil/biogenic origin"
      collection_method: "Measure representative printing, setup, cleaning, storage and actual heat cycles after controls. Validate species recovery/method for the actual matrix, sum distinct outlets/intervals and document detection-limit treatment. TVOC carbon/calibration-gas equivalents are QA totals, not identified chemical mass. Add each actually identified extra species separately."
      unit: "kg; mg/m3; m3/time"
      frequency: "representative surveys and material/control changes"
      temporal_coverage: "full actual period and all significant operating modes"
      site_scope: "outdoor factory release; no supplier/treatment double count"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "validated sampling/lab reports; airflow closure; inlet correction; response factors; disjoint PM evidence"
  calculation_rules:
    - id: calc_release
      applies_to: "directory_output"
      rule: "Q is sum of measured net kg at first quality release for newly manufactured directories of the defined cohort; alternatively accepted copies times calibrated same-design sampled mean kg, checked against lot weighing. Reinspection/internal rework of already released units adds no Q. Dispatch = opening accepted FG + first release + physical customer returns - closing accepted FG - destruction/other transfers, with returned goods never recounted as new manufacture."
      inputs:
        - cp_release
        - "cohort lineage"
        - "calibrated mass"
        - "FG movements"
      output: "Q in kg and reconciled accepted FG account"
      source_ids: []
    - id: calc_stock
      applies_to: "whole directory_manufacture consolidated physical unit only"
      rule: "For one common mass basis: S_open + E_in = S_close + E_product + E_return + E_waste + E_air + R. S contains mutually exclusive raw/WIP/FG/held/waste stocks; E terms are actual external boundary transfers, not first release Q. Record water, ambient/combustion intake and other actual mass crossings needed for closure. For every stage link and lot/state/unit, T_out(a,b) = T_in(b,a); sum internal incoming minus outgoing legs is zero in this consolidated equation. Internal transfer is neither external receipt nor formation. Chemical reaction creates no total mass; species consumption/formation, if evidenced, is paired in separate constituent accounts. R is signed unexplained residual, never an invented source."
      inputs:
        - cp_material
        - cp_formula
        - cp_release
        - cp_pack
        - cp_waste
        - cp_water
        - cp_air
        - "matched stage transfer ledger"
      output: "gross consolidated physical account and signed residual R"
      source_ids:
        - epa-eiip-2002
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "After stock/cohort reconciliation, compatible gross physical exchange per reference = gross cohort exchange / Q. Separately, attributed environmental load per reference = (directly assigned + justified shared cohort load) / Q. Carry opening-WIP embodied amounts/provider loads to their original cohort and carry closing-WIP/failed Q=0 amounts forward explicitly; do not attach all period receipts to period releases. Preserve each original provider reference and quantity alongside its attribution. Apply no second allocation or normalization."
      inputs:
        - cp_release
        - "all raw protocols"
        - "original provider and allocation ledgers"
        - Q
        - "opening and closing WIP/cohort lineage"
      output: "each physical exchange and separately attributed load per 1 kg reference flow"
      source_ids: []
    - id: calc_species
      applies_to: "each measured outdoor species"
      rule: "Species kg = sum of compatible outlet concentration times integrated outlet flow minus matched incoming species mass, with calibrated unit/response/recovery corrections. Convert mg to kg by dividing by 1000000. Unknown residual VOC is an identified-data gap, not a known species."
      inputs:
        - cp_air
        - cp_formula
        - "measured matched flows and intervals"
      output: "species kg before the single normalization"
      source_ids:
        - epa-method18-2025
        - epa-method25a-2017
    - id: calc_formula_balance
      applies_to: "each constituent"
      rule: "Actual constituent mass = whole supplied formulation mass times measured/verified constituent fraction. Reconcile opening/purchases with retained accepted/failed product, waste, outdoor release, transformations and closing stock. Use these component quantities as balances only while a complete formulation provider owns production."
      inputs:
        - cp_formula
        - cp_water
        - cp_waste
        - cp_air
      output: "constituent/water/carbon balance without duplicate purchase"
      source_ids:
        - epa-ctg-2006
    - id: calc_pack
      applies_to: "each package component"
      rule: "On the same component/mass basis, B_open + P + N_ext + ER = B_close + D + EO + W + R_pack. P, N_ext and ER are mutually exclusive measured inward events as defined in cp_pack. D is gross outward dispatch, including attached directory/supply packaging, without netting ER; EO is outward return to an owner, excluded from D; W is actual outward discarded component mass. B stocks contain disjoint unused, raw-supply-attached, WIP-attached, FG-attached, held and awaiting-disposal states; waste still on site remains stock, not W. R_pack is a signed unexplained residual, not invented receipt. Match internal stage legs and cancel them on consolidation under calc_stock; detaching/reusing a component is not new purchase or material formation. Keep all packaging outside directory net Q. Reconcile gross physical vectors separately from attributed/provider vectors, retaining each original exchange direction, quantity, unit, provider reference, owner and cohort; inherit those on ER rather than charging production again. Assign each component's production once, within the whole-supply provider where already covered or through an evidenced separate component provider, never both and never zero solely for N_ext/no invoice. Additional actual rental, cleaning and return-transport service exchanges retain their service scope and original cohort denominator Q_c (that cohort's Q), not automatically this period's new Q; no extra Q is created by circulation or service. Retain Q_c=0/failed/WIP service loads pending justified cohort assignment under calc_normalize."
      inputs:
        - cp_pack
        - cp_release
        - cp_waste
        - "matched internal stage legs"
        - "original owner/cohort and per-exchange physical/provider ledgers"
      output: "gross component-event closure and separate once-only provider/service attribution"
      source_ids: []
  data_quality_requirements:
    - id: dq_directory
      applies_to: "applicability and release"
      requirement: "Verify contact directory purpose, edition/cut-off, ordered listings and index/page integrity; test readability and gutter after binding/trim. A cover title, annual date or common printing route does not establish classification."
      evidence: "actual publication contents; signed specification/proofs; finished-copy tests; release register"
    - id: dq_complete
      applies_to: "all stages"
      requirement: "Survey all actual inputs/wastes/species and period modes. Record conditional absence with evidence; missing observation is not zero. No complete quantitative dataset while core reference/forming identities, provider quantities or material balances remain unresolved. Auxiliary UUID gaps are row-specific rather than proof that the entire methodology is invalid."
      evidence: "stage/chemical survey; calibrated original logs; explicit gaps; performed/skipped checks"
    - id: dq_basis
      applies_to: "quantity and provider links"
      requirement: "Match whole formulation, unit/property, gas conditions, moisture/phase and waste receiver state. Paper input/retained output, gross/allocated and count/mass are distinct. Never borrow a factory amount, supplier capacity or historic retention fraction."
      evidence: "native identity and support chain; supplier specifications; raw metering; stock and ownership records"
    - id: dq_translation
      applies_to: "both renderings"
      requirement: "Preserve ordered rule/row/protocol/source identities, quantities, conditions and complete Amount fields; use official Chinese baseName for every UUID-bearing selected flow."
      evidence: "bilingual field comparison and source/native records"
validation_rules:
  - rule_id: v_category
    applies_to: "reference dataset"
    rule: "Require a complete physical contact directory with actual organized contact content, edition/index qualifiers and selected representative construction. Reject a generic book, catalogue, magazine or database-access identity even when printed by the same machine."
    source_ids:
      - unsd-cpc3-2025
  - rule_id: v_quality
    applies_to: "accepted output"
    rule: "Confirm Q includes only new lots' first quality-released net directory mass. Reconcile signatures/pages, contact legibility, index locators, gutter/trim and binding acceptance with rejected/reprinted pages. A later reinspection or internal rework never creates a second denominator."
    source_ids:
      - mm-antaro-perfect-binding
  - rule_id: v_accounts
    applies_to: "physical and load ledgers"
    rule: "Reconcile opening/closing raw, WIP, FG, held/rejected and waste stocks, dispatch/returns and all retained constituents. Keep failed Q=0 loads, setup, changeovers, cleanup and standby; explain discrepancies with measured uncertainty. Keep gross physical and allocated burden accounts separate and normalize once."
    source_ids:
      - epa-eiip-2002
  - rule_id: v_formulation
    applies_to: "purchased chemicals and providers"
    rule: "One actual whole supplied formulation per exchange, with composition and density basis; do not add its embedded components or its provider load twice. Separate added IPA and tap water from concentrate-carried quantities. EVA is nonreactive bookbinding formulation, not pure EVA resin or PUR."
    source_ids:
      - epa-ctg-2006
      - mm-antaro-perfect-binding
  - rule_id: v_emissions
    applies_to: "waste/air/water"
    rule: "Captured dust is not emitted PM; use disjoint PM2.5, 2.5–10 and >10 bins after controls. Waste liquids are whole transferred mixtures; nonwater fraction is not automatically dry solids or direct discharge. Validate actual VOC species, NOx as declared NO2-equivalent excluding N2O, fossil/biogenic carbon and net water vapour; no factor, total VOC or residual substitutes for identified release."
    source_ids:
      - epa-method18-2025
      - epa-method25a-2017
      - epa-gas-ap42-2026
  - rule_id: v_identity
    applies_to: "all exchanges"
    rule: "Recheck compatible native state-100 type, full name/route/use/form/phase, CAS/species/medium and reference property → unit group → unit. Missing reference or forming-flow identity requires explicit review; ordinary auxiliary identity gaps remain individually visible. No blank UUID implies zero quantity, approved provider or publication readiness."
    source_ids: []
  - rule_id: v_packaging
    applies_to: "packaging and FG"
    rule: "Check each actual component's measured inward P/N_ext/ER and outward gross D/owner return EO/waste W against disjoint opening/closing stocks under calc_pack, including raw-supply, WIP and unsent-FG attachment. Reject overlap, netted dispatch/returns and ER without prior outward same-item proof. Verify original owner/cohort and each exchange's original physical and attributed/provider vectors survive returns and period boundaries; whole-supply and separate component production must cover the actual component once. No invoice, first loan, rent or free supply cannot establish zero burden; unresolved provider scope remains explicit. Verify actual incremental rental/cleaning/transport services separately against included provider scope and original Q_c, without new Q or automatic division by new releases. Packaging must not inflate directory Q or disappear when FG remains unsent; retain failed/Q_c=0 and stock loads."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Route-specific manufacture of one declared printed contact-directory edition at printer gate, after actual foreground and identity review."
  allowed_use: "The stated black sheetfed, uncoated woodfree, process-free-plate, EVA-bound subset with complete directory acceptance, measured lot/period accounts and compatible actual providers."
  excluded_use: "Whole-leaf average; other CPC identities; full directory information/lookup service, equal contact utility or universal annual replacement; other printing/binding routes; ready-to-use numerical dataset inferred from a UUID or this methodology."
  required_metadata: "Every reference qualifier; actual edition/job/site/period; raw and allocated ledgers; WIP/FG/reject disposition; actual material grades; provider/packaging ownership; source limits; performed/skipped checks."
  required_quality_disclosure: "Scientific/translation review status, unresolved reference/forming and auxiliary identities separately, missing measurements/providers, uncertainty, physical residuals, allocation sensitivity and excluded service/lifecycle scope."
  update_trigger: "Listing/index design or edition scope, cut-off, paper/ink/fount/wash/EVA grade, printing/binding route, utilities, supplier/control/treatment, packaging ownership or acceptance changes. Same category revisions retain this PCR identity."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "PDF/printed p.149 directory contact-information boundary; p.148 general-reference and p.150 periodical distinctions. No printing route, quantity or acceptance threshold."
  - id: "lithographics-publishing"
    type: "literature"
    reference: "Lithographics, Publishing, official capabilities; https://lithographicsinc.com/services/publishing/"
    used_for: "Publishing paragraphs on directories, one/four-colour production and sheetfed/web/digital alternatives, plus prepress/proof workflow. Supports candidate route availability, not a job's combined EVA/uncoated recipe, quantities or whole-leaf representation."
  - id: "epa-ctg-2006"
    type: "official_guidance"
    reference: "EPA-453/R-06-002, Control Techniques Guidelines for Offset Lithographic Printing and Letterpress Printing, September 2006; https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "IV.A PDF12–14/printed6–8: directories, sheetfed versus web, paste ink, absorption/oxidation, fountain and wash. Historical regulatory proportions/retention/emission assumptions are not LCI defaults."
  - id: "epa-eiip-2002"
    type: "official_guidance"
    reference: "EPA EIIP Volume II Chapter 15, Preferred and Alternative Methods for Estimating Air Emissions from Printing, Packaging and Graphic Arts, May 2002; https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "Section2.1.1/Figure15.2-1 PDF14–15 and accounting discussion PDF27/31; process decomposition and material records. No universal directory recipe, factor or per-copy weight."
  - id: "ec-jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition March 2010, EUR 24708 EN; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Sections 7.9.1–7.9.3, PDF275–292/printed255–272: attributional applicability, subdivision/virtual subdivision, exchange-specific determining physical causality, residual boundary-specific economic allocation and 100% conservation. 7.9.3 VI addresses recycling case boundaries, valuable secondary functions and negative-value treatment; it is not a default credit, price adjustment, recycling rate or factory allocation key. This PCR applies these conditions to its manufacturing ledgers and requires actual evidence; it does not claim full ILCD compliance or quantify consequential substitution."
  - id: "kodak-sonora-process-free"
    type: "literature"
    reference: "Kodak SONORA Process Free Plates Sustainability datasheet; https://www.kodak.com/content/pdfs/print/KODAK-SONORA-Process-Free-Plates-Sustainability-datasheet-EN.pdf"
    used_for: "PDF1 only: no separate plate processor chemistry/rinse for this route. Not zero entire-plant water, plate manufacture, coating fate, energy or startup waste."
  - id: "mm-antaro-perfect-binding"
    type: "literature"
    reference: "Müller Martini Antaro official perfect-binder documentation; https://mullermartini.com/en/product/antaro/"
    used_for: "Offset gathering/three-knife trimmer, milling/spine preparation and EVA/PO/PUR options; select only EVA softcover. No guaranteed directory job, output rate, thickness, grammage or binding-test threshold adopted."
  - id: "heidelberg-powder-2010"
    type: "literature"
    reference: "Heidelberg News270, Small Grains that Have a Big Effect, 2010; https://www.heidelberg.com/global/media/en/global_media/company___publications/heidelberg_news/editorial/pdf_10/hn_270.pdf"
    used_for: "Printed/PDF53: powder materials differ. Conditional unmodified starch only; no dose, coating composition, particle distribution or emitted fraction."
  - id: "epa-method18-2025"
    type: "official_guidance"
    reference: "EPA Method18, Gaseous Organic Compound Emissions by Gas Chromatography, 1 April2025 copy; https://www.epa.gov/system/files/documents/2025-04/m-18-04012025_0.pdf"
    used_for: "PDF1–2 sections1–2; species/calibration method with volatility, condensation and polymerisation limits. Requires actual-matrix validation; no measured release is asserted."
  - id: "epa-method25a-2017"
    type: "official_guidance"
    reference: "EPA Method25A, Total Gaseous Organic Concentration Using a Flame Ionization Analyzer, 3 August2017 copy; https://www.epa.gov/sites/default/files/2017-08/documents/method_25a.pdf"
    used_for: "PDF1 sections1–2; carbon or calibration-gas equivalent total differs from chemical species mass. No universal response/speciation factor."
  - id: "epa-gas-ap42-2026"
    type: "official_guidance"
    reference: "EPA AP42 Section1.4, Natural Gas Combustion, retained October2026 copy; https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "PDF1–3 sections1.4.1–1.4.3; ancillary combustion source/species survey only. No boiler factor, standard gas composition, thermal efficiency or print-dryer assumption adopted."
