product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.pulp-paper-and-paper-products-printed-matter-and-related-articles.directories-in-print"
  classification_refs: "CPC 3.0 32230; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "Printed collections of systematically organized contact information with optional entity descriptions, in the selected black-only sheetfed/EVA softcover construction."
  excluded_products: "Dictionaries/encyclopaedias and other general reference books; professional prose books; daily or non-daily periodicals; product-price advertising catalogues without directory function; online/database/enquiry services; other printing, binding and finishing constructions."
  representative_product: "One edition of a black-only business/trade contact directory, with ordered entity listings, category index and page locators, uncoated woodfree text/cover and nonreactive EVA milled-spine binding. No standard dimensions, listing count or mass are imposed."
  production_route: "Approved directory snapshot and imposition → CTP imaging → text/cover wet sheetfed offset and setting → folding/gathering by signature sequence → milling/EVA gluing/cover attachment → trimming → listing/index/page and binding acceptance → packing."
  market_state: "Newly first-released complete printed directories at printer gate; retained text, cover, ink, glue and actual powder included; delivery packaging separately accounted."
functional_unit:
  what: "Manufacture a complete printed contact directory of one declared edition and listing/index design."
  how_much: "1 kg net newly accepted complete printed directories of the same design and reporting-period lot cohort."
  how_well: "Meet commissioned contact legibility, listing sequence/completeness, index-to-page accuracy, page order, trim and binding requirements; record tests, sampling and disposition. No contact-response success or universal durability is implied."
  how_long_or_cycle: "One edition's manufacturing cycle at factory gate. Record edition/data cut-off and expected supersession separately; no assumed annual replacement or equal information-service duration."
  reference_flow_link: "directory_output"
system_boundary:
  rules:
    - rule_id: b_directory
      applies_to: "applicability"
      rule: "Confirm systematically organized contact information as the principal product and preserve actual listing/index/edition qualifiers. Similar subject matter, binding or publication frequency cannot extend this identity to general reference books or periodicals."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: b_route
      applies_to: "production"
      rule: "Include file preflight/proofs, CTP exposure, make-ready, text and cover offset, setting, folding/gathering, milling, EVA spine/side gluing, trimming, directory-specific acceptance, cleanup, packing and attributable extraction/compression/cooling/standby. No heatset dryer, UV curing, separate plate developer bath or processor rinse belongs to the selected route. Plate production, coating removal/fate and startup waste still belong."
      source_ids:
        - epa-ctg-2006
        - epa-eiip-2002
        - kodak-sonora-process-free
        - mm-antaro-perfect-binding
    - rule_id: b_supplier
      applies_to: "purchased inputs"
      rule: "Include actual upstream paper production and delivery, complete coated plates, formulated materials and packaging once. Use supplier-compatible state/quantity/geography/year and avoid adding ingredients already covered by a whole-formulation provider. Outsourced printing/binding is not a zero-burden service."
      source_ids:
        - epa-eiip-2002
    - rule_id: b_transfer
      applies_to: "internal stages and stocks"
      rule: "Preserve identical physical transfers of printed signatures, covers and gathered blocks between stages; they are not additional final references. Track opening/closing raw stock, WIP, accepted finished goods, held/rejected stock and all internal rework. Include setup, failed lots, corrected pages, cleanup and closing WIP loads; do not erase them at a period boundary."
      source_ids:
        - epa-eiip-2002
        - mm-antaro-perfect-binding
    - rule_id: b_release_boundary
      applies_to: "waste and outdoor emissions"
      rule: "Separate captured dust, liquid/cloth waste and outdoor species after actual controls. Include ancillary gas only when attributable heating exists; it is not the ink-setting mechanism. Offsite power/treatment emissions stay in their background provider. Record water/ambient-air/combustion-air contributions needed to close balances, with each actual elementary exchange separately identified."
      source_ids:
        - epa-ctg-2006
        - epa-method18-2025
        - epa-gas-ap42-2026
    - rule_id: b_service_limit
      applies_to: "downstream use"
      rule: "Exclude contact-data research/verification and editorial work before the approved production-file gate, directory distribution/lookup use and end of life from this foreground boundary; disclose them when a larger lifecycle study includes them. Printer preflight, corrections/proofs and all actual factory energy remain included. Never claim full information-service or cradle-to-grave coverage from this gate-to-gate dataset."
      source_ids:
        - unsd-cpc3-2025
        - lithographics-publishing
boundary_abstraction:
  declared_starting_condition: "Approved directory contact/index file supplied to print production; purchased dry unprinted text/cover sheets and finished process-free plates; actual complete supplied formulations."
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "Only printed contact directories in CPC 3.0 32230, limited to the selected black-only sheetfed, uncoated woodfree, flexible-cover, nonreactive-EVA construction."
  recursive_input_rule: "A purchased already printed directory or signature is not raw paper. Identify external production separately, retain upstream burdens and matched transfers, and prevent duplicate final output. An internal corrected/reprinted signature remains internal rework."
  upstream_dataset_requirement: "Compatible actual paper/pulp, plate, ink/concentrate/wash, adhesive, utilities, maintenance, packaging and transport/treatment backgrounds. Each supplier stage is owned once; flow UUIDs supply no production burden."
  disclosure: "Factory/outsourced stages and reporting period, approved edition scope, starting file state, excluded contact-research/editorial services, included file preflight, all supplier/treatment links, stocks/WIP, physical balances and separately allocated loads."
