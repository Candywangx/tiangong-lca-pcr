measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use 1 kg of accepted card-body net mass at measured moisture, including actual retained ink, coating, anti-setoff starch and moisture and excluding envelope/film/label. Measure campaign Q by calibrated weighing; reject gross-pack weight."
  - id: batch_basis
    applies_to: "reference denominator"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Collect full campaign totals B_i in each row's declared native numerator property/unit (including electrical MJ) and accepted net card mass Q in kg for the same route/site/time, then report B_i/Q per 1 kg reference flow. Mass/kg constrains Q, not every numerator. Never normalize by card count alone. Counts may support weighing, with measured lot-specific mass, but do not replace Q."
  - id: mixture_basis
    applies_to: "fountain, wash, inks, varnish"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record delivered formulation mass and actual ingredient/volatile/solids basis; convert volume only with measured grade-specific density and conditions. Premix and separately purchased components must not be double counted."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Native electrical identity is Net calorific value/MJ; use supplier-compatible electrical meter totals with 1 kWh = 3.6 MJ. This is an electrical conversion, not delivered thermal heat; no steam or gas is in this route."
  - id: particle_basis
    applies_to: "air particulate rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use disjoint ≤2.5 μm, >2.5–10 μm and >10 μm mass fractions on the same sampling/control/dry-gas basis; report actual size method. Never add PM2.5 to cumulative PM10 or total dust; unresolved fractions have no zero default."
