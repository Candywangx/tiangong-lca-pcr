allocation_rules:
  - rule_id: direct_assignment
    applies_to: "card_delivery"
    rule: "First separate actual jobs/variants and directly meter/assign material, spoilage, cleaning, curing and waste activity. Investigate subdivision before sharing burdens; a no-varnish job receives no UV-coating burden."
    source_ids:
      - eu-pef-2021-allocation
  - rule_id: shared_burdens
    applies_to: "card_delivery"
    rule: "For genuinely shared residual burdens, demonstrate a measured physical cause such as machine time with actual load, or printed/coated area for the affected operation. Record driver, all jobs and denominator; total allocated burden must equal the measured total. Mass share is not automatically causal. If no defensible relationship exists, disclose unresolved allocation; do not silently select economic shares."
    source_ids:
      - eu-pef-2021-allocation
  - rule_id: physical_outputs
    applies_to: "card_delivery"
    rule: "Maintain actual cards, scraps, accessories, liquids and dust in the physical ledger, including balances and equal internal links. Keep the allocated environmental-burden account separately: never multiply co-product physical output by an allocation share. Record recycling/treatment receiver; no negative paper input or generic avoided-material credit."
    source_ids:
      - eu-pef-2021-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "card_delivery"
      flow_role: "accepted net card-body mass"
      record_type: "primary measurement and traceable records"
      raw_fields: "campaign/lot; variant; artwork; dimensions/fold; calibrated scale; accepted net mass Q; moisture; retained ink/varnish; rejected output; stock"
      collection_method: "Weigh accepted complete card bodies on a calibrated scale, excluding envelope, film and label; reconcile lot acceptance and moisture. Preserve actual full-campaign Q and variant-specific totals."
      unit: "kg"
      frequency: "Every lot/job and each material/waste transaction; representative time-resolved meters/sampling"
      temporal_coverage: "Entire declared campaign, including setup, cleaning and rejects; same variant"
      site_scope: "Declared site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw readings, invoices/SDS, acceptance, mass/water/carbon reconciliation, stock and uncertainty; no fabricated data"
    - protocol_id: cp_materials
      process_id: "card_delivery"
      flow_role: "each purchased material and replacement"
      record_type: "primary measurement and traceable records"
      raw_fields: "row_id; supplier/product/SDS; colour/grade; delivered composition; wet/dry mass; density/conditions if volumetric; incoming/remaining/returned stock; stage; campaign"
      collection_method: "Weigh each actual formulation or article separately and reconcile invoices, dispensing and stock; use measured grade-specific density only for volume records. Include make-ready, cleaning and replacement across the full campaign. Record supplier evidence for every grade and condition; no recipe from database metadata."
      unit: "kg"
      frequency: "Every lot/job and each material/waste transaction; representative time-resolved meters/sampling"
      temporal_coverage: "Entire declared campaign, including setup, cleaning and rejects; same variant"
      site_scope: "Declared site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw readings, invoices/SDS, acceptance, mass/water/carbon reconciliation, stock and uncertainty; no fabricated data"
    - protocol_id: cp_energy
      process_id: "card_delivery"
      flow_role: "purchased low-voltage AC"
      record_type: "primary measurement and traceable records"
      raw_fields: "meter id/calibration; opening/closing electrical kWh; stage/variant; actual auxiliary load; supply voltage/provider/year; shared driver; accepted net card mass Q"
      collection_method: "Read calibrated meters/submeters over the same campaign; reconcile all stage and shared auxiliary totals and supplier boundary. Convert recorded electrical kWh to MJ by 3.6, then use accepted card-body Q. Do not treat Net calorific value metadata as a heat-service measurement."
      unit: "MJ"
      frequency: "Every lot/job and each material/waste transaction; representative time-resolved meters/sampling"
      temporal_coverage: "Entire declared campaign, including setup, cleaning and rejects; same variant"
      site_scope: "Declared site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw readings, invoices/SDS, acceptance, mass/water/carbon reconciliation, stock and uncertainty; no fabricated data"
    - protocol_id: cp_water
      process_id: "card_delivery"
      flow_role: "fresh supplied water"
      record_type: "primary measurement and traceable records"
      raw_fields: "fresh-water meter; measured mass or volume/density/temperature;actual water carried by board, inks, concentrate, wash, varnish and wipes;  replenishment; evaporation; exported spent liquid; retained water; stock; incoming/outgoing exhaust humidity"
      collection_method: "Meter fresh supplied water separately from internal circulation. For Mass/kg quantity use calibrated mass records or actual density at meter conditions. Reconcile fresh input, stock, card/wipe retention, exported liquid and net evaporation without a generic density or consumption factor. Formulation/material carrier water remains inside its purchased mixture exchange, not a duplicate tap-water input. Preserve full ambient inlet/outlet humidity separately from net anthropogenic evaporation, with compatible exhaust flow/time and wet/dry/T/P basis."
      unit: "kg"
      frequency: "Every lot/job and each material/waste transaction; representative time-resolved meters/sampling"
      temporal_coverage: "Entire declared campaign, including setup, cleaning and rejects; same variant"
      site_scope: "Declared site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw readings, invoices/SDS, acceptance, mass/water/carbon reconciliation, stock and uncertainty; no fabricated data"
    - protocol_id: cp_packaging
      process_id: "card_delivery"
      flow_role: "each actual shipped accessory"
      record_type: "primary measurement and traceable records"
      raw_fields: "row_id; supplier/specification; composition/embedded adhesive; incoming/remaining stock; actual net shipped envelope/film/label mass; offcuts/damage; accepted net card mass Q"
      collection_method: "Weigh each component independently at input and dispatch, excluding it from card-body Q. Reconcile input, shipment, stock and actual rejects; absence is documented by bill of materials and pack-out records, not an assumed zero."
      unit: "kg"
      frequency: "Every lot/job and each material/waste transaction; representative time-resolved meters/sampling"
      temporal_coverage: "Entire declared campaign, including setup, cleaning and rejects; same variant"
      site_scope: "Declared site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw readings, invoices/SDS, acceptance, mass/water/carbon reconciliation, stock and uncertainty; no fabricated data"
    - protocol_id: cp_waste
      process_id: "card_delivery"
      flow_role: "each exported waste"
      record_type: "primary measurement and traceable records"
      raw_fields: "row_id; stream/container; tare/gross/net; ink/coating/solvent/water/mercury/metal content; receiver/route; stock; collection dates; internal reuse"
      collection_method: "Weigh segregated streams with calibrated scales and manifest/receiver records. Keep unvarnished/UV-coated paper, ink residue, used wipes, spent liquid, composite plates, uncured varnish, cutting dust, collected starch, PE offcuts and spent lamps distinct. Avoid counting contaminants both in the composite waste and as separate exported mass."
      unit: "kg"
      frequency: "Every lot/job and each material/waste transaction; representative time-resolved meters/sampling"
      temporal_coverage: "Entire declared campaign, including setup, cleaning and rejects; same variant"
      site_scope: "Declared site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw readings, invoices/SDS, acceptance, mass/water/carbon reconciliation, stock and uncertainty; no fabricated data"
    - protocol_id: cp_emissions
      process_id: "card_delivery"
      flow_role: "each species and disjoint particle interval"
      record_type: "primary measurement and traceable records"
      raw_fields: "row_id; CAS/species/source; medium/subcompartment; sampling method/limits; concentration and dry/wet/standard gas conditions; gas flow/time; fugitives; inlet/outlet and abatement; detection limits; actual formulation; water/solvent balance"
      collection_method: "Use calibrated representative full-campaign sampling or a validated species-specific material balance with retained/exported/control terms; record uncertainty, fugitives and sample/time coverage. Gas mass = compatible concentration × gas volume, corrected once for actual conditions. Identify additional emitted ingredients and add individual atomic species/medium rows. Preserve size-method compatibility; non-detection is not an unqualified zero."
      unit: "kg"
      frequency: "Every lot/job and each material/waste transaction; representative time-resolved meters/sampling"
      temporal_coverage: "Entire declared campaign, including setup, cleaning and rejects; same variant"
      site_scope: "Declared site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw readings, invoices/SDS, acceptance, mass/water/carbon reconciliation, stock and uncertainty; no fabricated data"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "a_i = B_i / Q; B_i is actual attributed full-campaign exchange in its own unit; Q is accepted net card-body mass in kg for the same route and period. For the sole reference output a_i = 1 kg. Preserve raw actual physical totals independently from allocated burdens."
      inputs:
        - B_i
        - Q
        - cp_output
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: measured_balances
      applies_to: "card_delivery"
      rule: "For each actual conserved material component: opening stock + incoming = closing stock + retained product/accessories + exported waste + actual environmental release; explain measured uncertainty and oxidation/oxygen uptake when applicable. Water and fossil/biogenic carbon require separate component ledgers, not a sum of unlike masses."
      inputs:
        - "Measured component/stock/output/air and liquid records"
      output: "Pre-allocation physical balance"
      source_ids:
        - jrc-sts-2020
  data_quality_requirements:
    - id: identity_and_provider
      applies_to: "each exchange"
      requirement: "A selected broad UUID must contain the physical subset without contrary route/species/native-reference fields; independently verify actual supplier formulation, quantity basis and provider. A blank UUID is an explicit linking gap, not evidence that a near match may be used."
      evidence: "Supplier specification/SDS; direct identities and native chain; receiver agreement"
    - id: campaign_completeness
      applies_to: "card_delivery"
      requirement: "Use one coherent site/time/product variant and include setup, reject, cleaning, consumables, actual packaging, stock and controls. Identify missing rows/data/providers and detection/split uncertainty; historical or single-factory amounts are not defaults."
      evidence: "Complete campaign records and actual balance closure"
    - id: separate_ledgers
      applies_to: "card_delivery"
      requirement: "Preserve physical stage diagram and equal internal links, physical mass/water/fossil-and-biogenic-carbon balance, and a separately reconciled allocated-burden ledger. No allocation-scaled physical co-product outputs."
      evidence: "Raw stage records and allocation driver audit"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_card"
    rule: "Exactly one reference output with 1 kg accepted card-body Mass/kg; EN/ZH quantities, denominator, qualifiers and row identities agree. Associated accessories remain separate physical outputs."
    source_ids: []
  - rule_id: validate_routes
    applies_to: "card_delivery"
    rule: "Verify actual uncoated substrate, each actual conventional oil-based offset ink and outsourced imaged plate, wet offset/drying, manual cleaning, finish and lamp route. Unresolved identities, providers, additional auxiliaries/species, ingredient formulations or incompatible waste receivers prevent a claim of a complete linked dataset."
    source_ids:
      - epa-offset-ctg-2006
  - rule_id: validate_environment
    applies_to: "card_delivery"
    rule: "Check explicit CAS/species and air/water/soil medium, net plant-boundary release, shared controls, disjoint particles, captured versus emitted dust, water balance and fossil/biogenic carbon. No correction flow, cumulative-PM double count, universal VOC factor or omission of actual biogenic CO2."
    source_ids:
      - uk-sg6-2011
  - rule_id: validate_physical_and_burden
    applies_to: "card_delivery"
    rule: "Check independently the raw physical ledger and shared-burden allocation sums. Internal links match at both ends; shipped accessories plus waste and stock reconcile with input; allocation affects attributable burdens, not physical product or co-product mass."
    source_ids:
      - eu-pef-2021-allocation
published_dataset_profile:
  dataset_role: "Foreground factory-gate greeting-card production process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared same-route card supply, with all actually matched upstream providers and explicit finish/accessory configuration."
  excluded_use: "Universal CPC32530 coverage, postcard/ornament routes, message-service comparison, or a complete dataset claim with unresolved identity/data/provider gaps."
  required_metadata: "Scope/reference qualifiers; site/time; exact flows/providers/native units; route and finish; component composition; actual accessory masses; pollution-control/transport/treatment boundary; allocation drivers."
  required_quality_disclosure: "Collection/coverage and calibration; raw physical versus allocated burden ledgers; uncertain constituent/size split; missing UUID/provider/data; limits and exclusions."
  update_trigger: "Changed construction, furnish, ink/concentrate/cleaner/varnish, lamp technology, supplier basis, electricity, accessories, control/waste route or new emissions evidence."
data_sources:
  - id: "epa-offset-ctg-2006"
    type: "official_guidance"
    reference: "EPA-453/R-06-002, September 2006, Control Techniques Guidelines for Offset Lithographic Printing and Letterpress Printing, printed pp.7–8 / PDF13–14. https://nepis.epa.gov/Exe/ZyPDF.cgi?Dockey=P1009O71.txt"
    used_for: "Sheetfed paste-ink absorption/oxidation, fountain ingredients, manual cleaning and optional radiation-cured coatings. Historic description only; no VOC/retention percentages or regulatory limits adopted."
  - id: "jrc-sts-2020"
    type: "official_guidance"
    reference: "JRC STS BREF 2020, section 11.2, printed pp.344–346 / PDF383–385. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2021-06/jrc122816_sts_2020_final.pdf"
    used_for: "Only explicit general offset/sheetfed clauses on wetting, non-heatset drying and blanket/roller cleaning within the heatset chapter; no heatset dryer or default solvent recipe transposed."
  - id: "uk-sg6-2011"
    type: "official_guidance"
    reference: "UK Sector Guidance Note IPPC SG6 (11), February 2011, Table 9 printed p.32 / PDF38, sheet-fed offset column; section 3.47 printed p.34 / PDF40, cutting/trimming dust and collected waste. https://assets.publishing.service.gov.uk/media/5a80811ded915d74e33facf5/surface-treatment-using-solvents-sector-guidance-note-sg-6-11.pdf"
    used_for: "Printing-side solvent, ozone, spent liquid, contaminated wipes, ink and UV-lamp waste survey; printing-side paper dust from cutting/trimming, distinct captured waste and net air release; actual species and amounts need site measurement. No current legal-compliance claim or default emission."
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "JRC Production of Pulp, Paper and Board BREF 2015, section 7.1.10, printed p.670 / PDF708. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Upstream paper-mill finishing/cutting and internal-broke context only; not a greeting-card plant inventory, fibre recipe, dust or water factor."
  - id: "eu-pef-2021-allocation"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5, pp.63–64. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Subdivision then demonstrated relevant physical relationship for shared burdens; no assumed economic share, substitution credit or generic recycling result."
  - id: "loxleys-litho"
    type: "literature"
    reference: "Loxleys, Litho Printing, manufacturer webpage, retrieved 2026-10-12. https://www.loxleys.co.uk/litho-print"
    used_for: "One producer demonstrates B1 greeting-card litho, board/envelope procurement, die cutting, folding/inserting and distinct optional pack-out/finishes. Not evidence of this plant using the chosen ink, substrate, cleaner or lamp; no output rate or inventory default adopted."
  - id: "loxleys-finishes"
    type: "literature"
    reference: "Loxleys, Print Finishes, manufacturer webpage, retrieved 2026-10-12. https://www.loxleys.co.uk/print-finishes"
    used_for: "Separate CMYK/die-cut and UV spot/all-over varnish capabilities, alongside excluded foil/glitter routes. No formulation, coating mass, cure dose or lamp-type claim."
