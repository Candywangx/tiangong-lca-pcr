system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "card_delivery"
      rule: "Include make-ready, colour changes, cleaning, ventilation/extraction and conditional finishing/pack-out over the whole campaign; associate all upstream supplied materials and actual transport/treatment. No universal cut-off of small chemicals or packaging."
      source_ids:
        - epa-offset-ctg-2006
        - uk-sg6-2011
    - rule_id: physical_ledger
      applies_to: "card_delivery"
      rule: "Keep a process/stage diagram and pre-allocation physical ledger. Internal stage links carry equal actual amounts at both ends; one integrated foreground output avoids duplicate card references. Water, substrate/ink/coat carbon and accessory balances include stored/retained/exported/emitted quantities."
      source_ids:
        - jrc-sts-2020
        - eu-pef-2021-allocation
    - rule_id: actual_emissions
      applies_to: "card_delivery"
      rule: "Survey actual solvent/ink/coating ingredients and species-specific air/water/soil releases; every additional emitted substance gets one atomic row with its medium. No total-VOC or correction flow may replace a species. No combustion occurs in this route, but any actual biogenic CO2 in foreground or linked background must remain in LCI independently of GHG-accounting convention."
      source_ids:
        - uk-sg6-2011
boundary_abstraction:
  declared_starting_condition: "Purchased dry uncoated woodfree card stock and ready-imaged aluminium plates delivered to the printer; actual consumables and optional accessories."
  starting_condition_role: "purchased_intermediate"
  product_classification_scope: "Qualified narrower folded-card subset of CPC3.0 32530; classification label does not extend the route."
  recursive_input_rule: "Finished-card outsourcing is outside this own-printing route. Record returned work-in-progress/rework physically once; no silent recursive reference output. A bought printed card requires a different disclosed starting condition and supplier guidance."
  upstream_dataset_requirement: "Actual provider datasets for substrate including pulping/papermaking/finishing, imaged plates, each ink, chemicals, electricity, accessories, inbound freight and off-site waste treatment. Declare unavailable provider/cut-off; an identity UUID alone is not a provider or complete dataset."
  disclosure: "Declare site, campaign, actual starting inputs, drying/UV variant, electricity supply, outsourced plate processing, pollution controls, transport and any boundary exclusions. Paper BREF7.1.10 is upstream context, not a printing-factor source."
