      issue: "Finished cotton fabric/cloth/woven-fabric name/synonyms; raw-cotton CPC01921 and fibre prose require source clarification. Actual manufactured fabric/finishing/provider, not raw fibre."
    - uuid: "a4a75541-e156-4e30-947c-ba067a682afd"
      issue: "Actual IPA grade/purity and China-production provider/geographic compatibility, not a universal supplier background."
    - uuid: "96c5f842-ea53-419b-b1cd-c02c479efb45"
      issue: "Contaminated aluminium-scrap/old-article identity before recycling; total complete plate scrap mass and component assay, actual coating/ink/receiver/provider quantity convention required. No pure-Al input or foreground remelting inferred."
    - uuid: "55d93375-7f04-4166-b2a2-88ce929051a5"
      issue: "Collected used petroleum-based/synthetic liquid lubricant, at generation, not complete grease/cloth; actual contamination/recipient and disjoint retained mass required."
    - uuid: "fe0acd60-3ddc-11dd-a8c4-0050c2490048"
      issue: "Mercury CAS7439-97-6 to outdoor-air unspecified, only actual documented release/incident plus speciation/sampling or valid Hg balance. No positive factor from lamp content/count; retain complete Hg lamp/cleanup waste, no indoor-to-outdoor assumption. Prefer differentiated species if LCIA requires."
    - uuid: "38e48719-f415-4f0f-a3e7-2893d2fbaffd"
      issue: "Native non-water solvent/oil-based flat/offset/lithographic ink identity has no mandatory heatset route or fixed recipe. Actual per-colour conventional sheetfed paste grade/SDS, absorption/oxidation, carrier/volatile/retained species/carbon origin and kg/provider compatibility required. Optional glycol examples and heat categorisation do not supply a formula or drying default. Loxleys originals contain no soy/soya/vegetable formulation claim."
