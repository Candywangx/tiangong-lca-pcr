    - row_id: "maintenance_oil"
      selected_flow: "Actual formulated machine lubricating oil"
      reason: "Successful bounded lookup did not establish the complete actual composition/assembly/state. One actual supplied liquid lubricating oil used in the installed press/cutter/folder. Record base oil, additives, grade/viscosity, supplier/SDS, application, stock and equipment instructions. Mineral, PAO and wax/solvent products are not interchangeable. No universal dose, replacement interval or lubricant is prescribed."
    - row_id: "maintenance_grease"
      selected_flow: "Actual formulated machine lubricating grease"
      reason: "Successful bounded lookup did not establish the complete actual composition/assembly/state. One actual supplied grease for the installed moving parts; record base oil, thickener/additives, consistency, supplier grade and weighed replenishment. A liquid-oil identity or a wax/solvent lubricant is not the complete grease. Allocate actual shared maintenance activity causally without imposing a brand, recipe or lifetime."
    - row_id: "blanket"
      selected_flow: "Complete replaceable rubber-faced offset printing blanket"
      reason: "Successful bounded lookup did not establish the complete actual composition/assembly/state. One complete replaceable offset blanket fitted to the actual wet-offset press. Record rubber face, fabric backing, other layers, net assembled mass, grade and supplier; a textile blanket or pure rubber raw material is not this composite. Collect actual installation/removal/remaining stock and attribution; no universal blanket lifetime or copy yield."
    - row_id: "spent_maintenance_grease"
      selected_flow: "Separately collected spent machine lubricating grease"
      reason: "Successful bounded lookup did not establish the complete actual composition/assembly/state. One actually removed and separately collected spent grease stream with composition and receiver documented. Used liquid oil is not complete grease. Grease retained on wipes or removed parts is included in those physical streams, not duplicated here; documented absence of a separate collected stream is permitted."
    - row_id: "spent_blanket"
      selected_flow: "Spent composite rubber-faced offset printing blanket"
      reason: "Successful bounded lookup did not establish the complete actual composition/assembly/state. One actually removed complete blanket, retaining its rubber/fabric layers and actual ink/cleaner contamination. Record net composite mass, receiver and fate; a generic tyre-rubber record does not by itself confirm this full contaminated assembly or treatment. Contaminants are not exported again as separate waste mass."
    - row_id: "spent_wash"
      selected_flow: "Separately collected spent aliphatic-hydrocarbon blanket wash liquid"
      reason: "Successful bounded lookup did not establish the complete actual composition/assembly/state. Only if actual manual cleaning generates a separately collected liquid: record the complete aliphatic-hydrocarbon wash/ink/water stream, concentration and recipient. Do not duplicate liquid retained on wipes, paste-ink residue or spent fountain solution. No direct environmental discharge, unrelated machining coolant or universal liquid-waste quantity is implied."
  provider_basis_requirements:
    - "Actual uncoated woodfree card-stock grade, fibre mix and moisture; named upstream supplier including papermaking and finishing."
    - "Each ink colour needs its actual non-waterborne oil-based sheetfed paste SKU/SDS, full formulation, absorption/oxidation setting and provider. Petroleum/vegetable/soy oil origins are measured evidence, not mandatory species or proportions; no recipe/retention is imported from identity metadata."
    - "Delivered concentrate and separate IPA/water quantities must reconcile without premix/component double counting."
    - "Native grid AC below 1 kV uses Net calorific value/MJ; actual electrical quantity and provider loss boundary remain separately verified."
    - "Exact UV-varnish recipe, lamp technology, coating area and retained mass; no borrowed cure or emission factor."
    - "Actual waste composition, contamination, receiver and measured speciation/particle-size fractions."
