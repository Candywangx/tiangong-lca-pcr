system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "mill foreground"
      rule: "Include stock preparation/refining, separate ply furnish, forming/pressing, drying, actual sizing, actual calendering, winding/trimming/packing, water/waste treatment and actual utilities. Integrated chip handling/cooking/washing/screening and chemical recovery apply only to the internally produced pulp fraction."
      source_ids:
        - jrc-pulp-bref-2015
    - rule_id: boundary_recovery
      applies_to: "integrated kraft fraction"
      rule: "Include actual black-liquor evaporation, recovery furnace, smelt/green liquor, recausticising, lime kiln and NCG collection/combustion. Internal wet pulp is not dried/baled as market pulp unless it actually leaves the site. Purchased route includes upstream pulp/recovery once through the supplier dataset, without duplicating those foreground units."
      source_ids:
        - jrc-pulp-bref-2015
        - epa-chemical-pulping-1990
    - rule_id: boundary_utilities
      applies_to: "steam and CHP"
      rule: "Onsite fuel, abatement, generation and final emissions plus physical internal steam/power links form one utility system. Never add a purchased-heat/electricity background for the same onsite output; purchased utilities use only true external interfaces. Keep imports and exports gross and separate."
      source_ids:
        - jrc-pulp-bref-2015
    - rule_id: boundary_links
      applies_to: "internal physical links"
      rule: "Record both ends of fibre/broke, black/white/green liquor, lime mud/lime, steam/condensate and captured NCG links with identical period, state and amount; reconcile storage changes. Internal black liquor is neither an external fuel purchase nor a discharged waste."
      source_ids:
        - jrc-pulp-bref-2015
        - epa-chemical-pulping-1990
    - rule_id: boundary_upstream
      applies_to: "completed product system"
      rule: "Retain upstream forestry/chip preparation, purchased pulp, reagent/fuel/water supply, input transport and external waste treatment. Foreground ends at accepted reels at mill gate; corrugation, box conversion, outbound customer delivery, use and end of life remain outside this foreground."
      source_ids:
        - jrc-pulp-bref-2015
    - rule_id: boundary_complete
      applies_to: "additional actual flows"
      rule: "The rows are a mandatory screening list, not a complete site recipe. Add each actual aid, nutrient, lubricant, refrigerant, other fuel, packaging item, metal/mineral emission or distinct waste as one audited atomic row. Measured absence is distinct from missing evidence."
      source_ids:
        - jrc-pulp-bref-2015
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "For each actual site, formulation, ply recipe, fibre provenance and production period, maintain a gross physical vector V and a separate attributed burden vector A, both indexed by exchange identity, origin, phase, compartment, process and period. Do not pool different recipes, recovered-fibre substitutions, grades or provider routes into one formulation. Site-specific single- or multi-ply furnish and purchased/integrated shares must be measured; the PCR prescribes no universal recipe. Ordinary non-pigmented sizing is declared separately from actual coating/barrier treatment. A genuinely coated or laminated product is excluded. Actual calendering, slitting and reeling remain in the mill route when performed. [jrc-pulp-bref-2015; cp_lineage]"
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Opening and closing raw material, pulp, liquor, WIP, broke and finished-paper stocks retain their complete exchange-specific inherited vectors, including the providers and prior energy, emissions and treatment already carried. Receipt, stage issue, internal transfer, loss, waste, sale and stock are separate legs. For every conserved constituent, opening stock + true external arrivals + measured formation = external departures + measured consumption/transformation + closing stock, with matched internal transfers cancelling only in the aggregate. Keep gross leg measurements before allocation. Water, carbon, fibre, Na, S, Ca and energy balances have independent observations; one residual cannot identify several missing quantities. [cp_lineage; cp_balance]"
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "Q is net paper mass first accepted and released during the period for this one formulation, including newly accepted closing finished goods once. Reconcile production, first release, gross dispatch, opening/closing finished goods and returns by lot. Dispatch of previously accepted opening stock carries its inherited A and does not create new Q. Preserve the original service/release record Qc for an already released lot: actual customer return, reinspection, repacking or rework carries its inherited vector plus actual incremental exchanges; a repeat dispatch is not a new manufacture or a second Qc. A rejected, unreleased or failed lot has Q = 0 until real first acceptance; retain its raw/WIP burden, rework, treatment and final destination. Idle operation, start-up, grade change, cleanup and failed production remain in the accounts. When Q = 0, keep absolute V and A and report normalization unavailable; never divide by zero, invent a service or erase the exchanges. [cp_output; cp_lineage]"
      source_ids: []
    - rule_id: system_boundary_rule_10
      applies_to: "foreground_system_boundary"
      rule: "For each card e, retain measured gross external g_e and its physical normalized display g_e/Q in that card's native property/unit. Retain A_e separately, following actual stock provenance, direct assignment and residual allocation; it is not a multiplier on real coproduct masses. The reference output is 1 kg net paper. If stock or release provenance is incomplete, neither period purchases/Q nor dispatch/Q establishes a complete attributable dataset. Missing values are unknown, not zero. Protocols and row conditions below apply to every card; no range, recipe, density, yield, price, emission factor, recovery credit or arbitrary balance tolerance is supplied. Report observed lot ranges and uncertainty with their original bases, not as industry defaults. [cp_lineage; cp_output; cp_balance]"
      source_ids: []
    - rule_id: system_boundary_rule_11
      applies_to: "foreground_system_boundary"
      rule: "Apply this ledger independently to each actual paperboard core, uncoated paper wrapper and single-layer PE wrap, and add a separate atomic card for any other real component before claiming completeness. Identify material, physical form, packaging type, wet/dry mass, measured count-to-mass conversion, direction, receipt, custody, owner, provider and prior burden vector. Core/wrap/film never enters net reference paper mass. P means genuinely purchased provision, including a batch purchase without a separate component invoice. N_ext means first external non-purchased entry, including borrowed, leased, entrusted or non-purchased supplied-with-goods items. ER is the same physical item returning externally after a documented previous outward leg. A fresh borrowed core without a previous outward record is N_ext, not ER. Existing stock and internal circulation are neither P nor N_ext. These entries are disjoint, recorded at actual receipt; do not relabel a real new entry as internal reuse or remove only an OTHER duplicate and call that complete coverage. [cp_pack]"
      source_ids: []
    - rule_id: system_boundary_rule_12
      applies_to: "foreground_system_boundary"
      rule: "For each component, opening empty + raw-attached + WIP-attached + finished-attached + reusable stock, together with P + N_ext + ER, reconciles to the corresponding closing stocks + every gross external outward leg + external waste, with internal attach/detach/repair/reuse legs paired. Distinguish shipment attached to current product, shipment attached to old finished stock, empty returns to owner, loan/service outward and waste, retaining actual custody and receipt. Gross dispatch may include repeated circulation and is not purchased manufacture. Inherit the whole manufacturing provider once at its true first entry, including the prior vector on non-purchased items; unknown prior burden stays unknown rather than zero. Allocate only the attributable manufacturing/service share using actual measured service and stock records, retaining unconsumed closing vectors. Record repair, washing, replacement, transport and losses once when real. No invented lifetime, reuse count, loss fraction, free entry, new paper Q, avoided product or recycling credit follows from circulation. [cp_pack; cp_lineage]"
      source_ids: []
    - rule_id: system_boundary_rule_13
      applies_to: "foreground_system_boundary"
      rule: "A whole purchased pulp, wood-chip lot, chemical formulation, size or external mixed stream receives its whole compatible provider once. Dry fibre, water, active ingredients, carrier and source partitions are analytical components of that same whole, not additional purchases. Independently supplied dilution water or separately purchased chemical is a different measured exchange. Inherit upstream forestry/harvest/chipping, actual kraft pulping and recovery, chemical manufacture, utilities and delivery from verified providers. Trace actual provider scopes and transport modes/loads/distances; a provider identity alone does not fill missing upstream operations. [cp_material; cp_receivers]"
      source_ids: []
    - rule_id: system_boundary_rule_14
      applies_to: "foreground_system_boundary"
      rule: "Record purchased steam, imported electricity, own CHP power/heat, condensate returns, internal recovered water and truly external reclaimed water at their actual distinct interfaces. Reused internal white water/condensate has a paired transfer and retains carried treatment/energy; no second water-manufacturing provider or recovery credit is added. External reclaimed water has its own supplier treatment/gate and measured quality; it cannot be silently omitted or charged again as virgin abstraction. Coupled heat/power/recovery burdens are counted once. Incoming and outgoing utility quantities remain gross, with state, energy basis and recipient service verified; a net utility bill cannot replace them. [cp_utility; cp_water; cp_receivers]"
      source_ids: []
    - rule_id: system_boundary_rule_15
      applies_to: "foreground_system_boundary"
      rule: "A collected co-product must have a documented physical receiver function and acceptance, not merely a sale price. For every external waste, retain actual composition, wet/dry basis, legal/physical status, sender/receiver receipts and the real treatment function and emissions once. Source paper formation and the actual receiver service are both retained; purchasing finished packaging alone is not the production route of this PCR. Every actual chemical, pollutant or other exchange absent from the screening cards remains a specific declared gap until added and verified. [cp_receivers; cp_waste]"
      source_ids: []
    - rule_id: system_boundary_rule_16
      applies_to: "foreground_system_boundary"
      rule: "Retain independent gas wet/dry volume, T/P, composition, carbon origin, actual emission compartment and phase; liquid water, vapour and aerosol are distinct. Pure molecular mass conversions require actual species identity and reporting basis. Total PM, COD/BOD, NOx and total metals are analytical aggregates, not substances with one molecular weight. Measure or independently establish their species fractions and analytical equivalence before a dependent conversion; do not infer several unknown species from a single balance residual. No catalogue grammage, density or background coefficient repairs a missing native area-to-mass chain. Retain actual paired lot area and measured net mass when such conversion is required. [cp_air; cp_water; cp_balance]"
      source_ids: []
    - rule_id: boundary_classification
      applies_to: "finished reference reels"
      rule: "Require all original ply/route/unbleached/uncoated conditions and verified machine-finished or machine-glazed state, roll width >36 cm and finished-paper grammage w >115 g/m². Under HS 2022 Chapter 48 Subheading Note 1, minimum Mullen bursting strength B_min in kPa at grammage in g/m² is (115,393), (125,417), (200,637), (300,824), (400,961). For any other weight use the original note's linearly interpolated or extrapolated equivalent: between adjacent anchors calculate B_min = B1 + (w - w1) * (B2 - B1) / (w2 - w1); above 400 continue the last segment. Retain the selected anchors and calculation. The 115 anchor does not admit w =115 or less. Actual corresponding Mullen bursting strength B must be >=B_min; width =36 cm or less fails. Chapter Notes 3/6/8 and heading 4804 apply together; permissible finishing/surface sizing does not establish the required finish state by itself, and the formal >=80% total-fibre wood sulphate/soda definition never relaxes this PCR's every-ply all-virgin unbleached sulphate wood-fibre scope. Missing, incompatible or failed evidence stops applicability; do not substitute SCT, another generic strength or an assumed grade. These definition values are not LCI amounts or site defaults."
      source_ids:
        - un-cpc3-2025
        - wco-hs2022-48
