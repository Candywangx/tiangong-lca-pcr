allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "multiple grades/co-products"
    rule: "First test subdivision or system expansion; retain expanded-system results as such. Directly assign separable operations. For remaining joint burdens use a demonstrated relevant physical relationship; use gate-value allocation only when earlier choices are unsuitable and justified. No universal mass, energy or revenue share is prescribed."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_chp
    applies_to: "joint heat/power"
    rule: "Separate recovery chemical functions, process heat, actual power/heat exports and other grades using metered physical service/energy balances and a justified joint-burden model. Any exergy method requires actual T/P and declared reference conditions. Do not use kg steam as delivered MJ; avoid simultaneous export credit and allocation of the same service."
    source_ids:
      - eu-pef-allocation-2021
      - jrc-pulp-bref-2015
  - rule_id: allocation_ledgers
    applies_to: "physical and burden accounts"
    rule: "Keep full physical mass/water/carbon/energy flows and matched internal links before allocation. Allocate environmental joint burdens in a separate ledger; never multiply real co-product masses or exported energy by the linerboard allocation share. The paper reference remains 1 kg."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_causality_residual
    applies_to: "all coproducts and joint services"
    rule: "Assign exchange-level causality and verifiable process subdivision/services first. Only after rejecting earlier methods with reasons may residual joint burdens be allocated by actual coproduct/service values at the same gate, period and quality state. Use real quantities, verifiable prices, currency and dates; missing value data remains pending. Allocate coupled heat/power and chemical recovery once, keep physical V unscaled, and reconcile residual closure and sensitivity."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_residues
    applies_to: "waste and recovered products"
    rule: "Distinguish captured internally reused dust/broke/chemicals, external waste requiring treatment, and actual marketed co-products. Receiving-party records determine fate; do not grant automatic zero burden or avoided-production credit to a waste stream. Report sensitivity to material allocation choices."
    source_ids:
      - eu-pef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "kraftliner_mill"
      flow_role: "net accepted paper"
      record_type: "production and shipment"
      raw_fields: "lot; first-release Q and original Qc; opening/closing raw/WIP/FG exchange vectors; real returns/rejection/failedQ0/idle/cleanup; route; ply dry-fibre origin/species; ply grammage; strength/test; reel net/gross/core/wrap mass; moisture; rejects; stocks; actual machine-finished/machine-glazed state and finishing/surface-treatment records; measured finished-roll width; finished-paper grammage; corresponding same-lot Mullen bursting kPa, method/version, sampling, specimen construction/conditioning and grammage basis; original report; threshold anchors/calculation/comparison and applicability decision"
      collection_method: "Calibrate scales; subtract tare from accepted saleable reels; test lot moisture and fibre records; reconcile shipment/stock and production; keep dry-mass ledger separately. Verify finish records, measure actual finished width and grammage, and retain corresponding representative Mullen tests on the declared specimen basis. Compare all conditions under boundary_classification; missing/incompatible evidence or failure stops applicability. SCT or another generic strength is not a Mullen substitute. The HS note does not specify an ISO method number; disclose the actual method and verify compatibility rather than inventing one."
      unit: "kg; dry fraction; cm; g/m²; kPa"
      frequency: "Each lot/continuous meters and representative tests; monthly totals"
      temporal_coverage: "Complete representative consecutive period covering seasons, grades, start-up and disturbances; prefer 12 months and justify shorter campaigns"
      site_scope: "Declared site/route, every stage and true boundary outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, methods, lot/time matching; uncertainties/gaps and receiving records; original classification evidence and comparison under un-cpc3-2025 and wco-hs2022-48"
    - protocol_id: cp_material
      process_id: "kraftliner_mill"
      flow_role: "each actual material"
      record_type: "receipts issues stocks"
      raw_fields: "supplier; identity; unbleached/kraft proof; species; wet/dry mass; solids; assay/hydrate; whole formulation/active/remaining additives/water; core receipts/returns/dispatch/reuse/loss/opening-closing stocks; volume/packing; transport; stocks; dose by stage"
      collection_method: "Reconcile receipts, stock changes, actual stage issues and returns; retain SDS/supplier reference amounts and upstream scope. Split virgin purchased pulp from internal wet pulp and same-grade broke."
      unit: "kg; m3; solids"
      frequency: "Each lot/continuous meters and representative tests; monthly totals"
      temporal_coverage: "Complete representative consecutive period covering seasons, grades, start-up and disturbances; prefer 12 months and justify shorter campaigns"
      site_scope: "Declared site/route, every stage and true boundary outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, methods, lot/time matching; uncertainties/gaps and receiving records"
    - protocol_id: cp_utility
      process_id: "kraftliner_mill"
      flow_role: "fuel/steam/power"
      record_type: "meters invoices supplier"
      raw_fields: "imports; own generation/use; exports; meter interface/voltage; fuel origin/composition; T/P; wet/dry; compressibility; calorific basis; steam quality/enthalpy and return; boiler stage"
      collection_method: "Use calibrated separate import/export meters; retain matched supplier reference definitions. Balance steam delivery/return and CHP net generation/own use; never infer pressure or delivered heat from a UUID unit."
      unit: "MJ; kWh; kg; m3; T/P"
      frequency: "Each lot/continuous meters and representative tests; monthly totals"
      temporal_coverage: "Complete representative consecutive period covering seasons, grades, start-up and disturbances; prefer 12 months and justify shorter campaigns"
      site_scope: "Declared site/route, every stage and true boundary outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, methods, lot/time matching; uncertainties/gaps and receiving records"
    - protocol_id: cp_water
      process_id: "kraftliner_mill"
      flow_role: "abstraction final water indicators"
      record_type: "meters composite samples lab"
      raw_fields: "intake/outlet/catchment; flow; paired concentration; method; COD/BOD oxygen basis; N/P element basis; TSS; temperature; stocks; H2O fraction; water/effluent density at T; stage vapour; combustion/reaction water; recovered condensate; evaporation; offsite transfer"
      collection_method: "Use calibrated intake/outlet meters and representative time/flow-matched final-outlet composite sampling; retain laboratory methods/detection limits. Calculate actual loads, not dilution-based concentration proxies."
      unit: "m3; mg/l; kg"
      frequency: "Each lot/continuous meters and representative tests; monthly totals"
      temporal_coverage: "Complete representative consecutive period covering seasons, grades, start-up and disturbances; prefer 12 months and justify shorter campaigns"
      site_scope: "Declared site/route, every stage and true boundary outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, methods, lot/time matching; uncertainties/gaps and receiving records"
    - protocol_id: cp_air
      process_id: "kraftliner_mill"
      flow_role: "final atmospheric species/bins"
      record_type: "CEMS stack fugitive lab"
      raw_fields: "outlet; equipment; fuel/carbon origin; species/CAS; concentration; gas volume; time; wet/dry normal conditions; abatement/bypass; TRS speciation; NMVOC/speciation and chemical-mass vs kgC/propane convention; aggregate/species overlap; NOx equivalent; cumulative PM definitions"
      collection_method: "Use calibrated representative stack/fugitive measurements matched to actual exhaust/time and operating states; include start-up/bypass. Record cutting/winding exhaust and collection separately. No default historical emission factor is adopted."
      unit: "kg; mg/m3; m3; hours"
      frequency: "Each lot/continuous meters and representative tests; monthly totals"
      temporal_coverage: "Complete representative consecutive period covering seasons, grades, start-up and disturbances; prefer 12 months and justify shorter campaigns"
      site_scope: "Declared site/route, every stage and true boundary outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, methods, lot/time matching; uncertainties/gaps and receiving records"
    - protocol_id: cp_waste
      process_id: "kraftliner_mill"
      flow_role: "each distinct external waste"
      record_type: "weighbridge analyses receipt"
      raw_fields: "origin; solid/liquid state; wet/dry mass; volume; measured density at T/state; H2O fraction; composition; contaminant/entrained liquor; recipient; treatment; stock changes; transport"
      collection_method: "Weigh/measure each external transfer with representative solids/composition tests and receiving-party receipts. Separate primary/biological sludge and ash sources; internal reuse/burning is not an offsite waste transfer."
      unit: "kg; m3; dry fraction"
      frequency: "Each lot/continuous meters and representative tests; monthly totals"
      temporal_coverage: "Complete representative consecutive period covering seasons, grades, start-up and disturbances; prefer 12 months and justify shorter campaigns"
      site_scope: "Declared site/route, every stage and true boundary outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, methods, lot/time matching; uncertainties/gaps and receiving records"
    - protocol_id: cp_balance
      process_id: "kraftliner_mill"
      flow_role: "internal links and joint burdens"
      record_type: "stage meters physical and cost accounts"
      raw_fields: "link id; sender/receiver; date; fibre/wood/water/carbon/Na/S/Ca; liquor solids; energy/enthalpy; stocks; uncertainties; grade/co-product amounts; gate prices; allocation rationale"
      collection_method: "Reconcile link pairs on identical physical bases including stock changes; retain unallocated physical and allocated burden ledgers. Trace lime-carbon origin from actual material chemistry; justify allocation without modifying physical co-product outputs."
      unit: "kg; m3; MJ; currency"
      frequency: "Each lot/continuous meters and representative tests; monthly totals"
      temporal_coverage: "Complete representative consecutive period covering seasons, grades, start-up and disturbances; prefer 12 months and justify shorter campaigns"
      site_scope: "Declared site/route, every stage and true boundary outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, methods, lot/time matching; uncertainties/gaps and receiving records"
    - protocol_id: cp_lineage
      process_id: "kraftliner_mill"
      flow_role: "exchange-specific physical and burden inheritance"
      record_type: "lot production/stock/first-release"
      raw_fields: "formulation/lot/species and ply dry-fibre origin; each exchange raw quantity/unit/state/compartment; opening/closing raw/WIP/broke/FG V and A; first Q; original Qc; gross dispatch/actual returns/failedQ0/idle/cleanup; provider hash/scope; destination"
      collection_method: "Trace each receipt, issue, transformation, release and stock by exchange; do not add source partitions to whole providers; reconcile V independently of A; retain absolute quantities at Q=0"
      unit: "kg; m3; MJ; native units"
      frequency: "Every lot and stock leg"
      temporal_coverage: "Same complete production period including idle and disturbances"
      site_scope: "Same site/formulation, all stages and actual receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/meter calibration; provenance; first release and actual return receipts; gaps/uncertainty"
    - protocol_id: cp_pack
      process_id: "kraftliner_mill"
      flow_role: "every real packaging component in every direction"
      record_type: "receipts/custody/ownership/stocks/dispatch/waste"
      raw_fields: "material/form/type; count and measured item mass; P/N_ext/ER receipt; prior outward for ER; owner/custody; manufacturing provider and inherited vector; empty/raw/WIP/FG/reusable opening/closing; gross outward/discard and receiver; washing/repair/transport"
      collection_method: "Pair each disjoint actual first entry with item/lot records; no separate invoice is required for batch P; attach/detach is internal; first borrowed/leased/entrusted/non-purchased supplied-with-goods entry is N_ext; only same-item external return is ER; reconcile and inherit per component"
      unit: "kg; count"
      frequency: "Each receipt/dispatch/state change"
      temporal_coverage: "Same period plus actual prior-period records"
      site_scope: "Every real component and handover interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Receipt/return/dispatch/waste signatures; calibration; ownership/prior burden gaps"
    - protocol_id: cp_receivers
      process_id: "kraftliner_mill"
      flow_role: "whole provider chain and actual receiver function"
      record_type: "supplier process/handover/service acceptance"
      raw_fields: "actual whole formulation/wood/mixed stream; species/route/recovery and forestry; steam/power/water interface/coupled scope; transport; coproduct function/acceptance; waste composition/treatment; raw quantities and supplier-basis conversion evidence"
      collection_method: "Read native physical restrictions and whole provider scope per interface; reconcile both handover sides and real service; whole provider once, components not extra purchases; treatment/emissions not duplicated; gaps stay pending"
      unit: "Each native unit"
      frequency: "Each provider/receiver and change"
      temporal_coverage: "Same period and actual upstream representative period"
      site_scope: "Every real input/output interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Independent originals and bilateral receipts; scope/conversion/function gaps"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Physical display per 1 kg reference flow is measured card gross g_e / first-released net paper Q; cp_output and cp_lineage reconcile new closing FG once, old stocks and original Qc; Q=0 retains absolute amounts. Attribute A_e independently by real provenance and allocation without scaling physical coproducts."
      inputs:
        - cp_output
        - cp_lineage
        - cp_material
        - cp_utility
        - cp_water
        - cp_air
        - cp_waste
        - cp_pack
        - cp_receivers
      output: "gross exchange per reference flow; separate attributed vector"
      source_ids:
        - jrc-pulp-bref-2015
    - id: outlet_load
      applies_to: "final air/water exchanges"
      rule: "Integrate matched concentration × discharged volume, retaining dimensional conversion, gas normal/wet/dry bases and observed abnormal intervals; retain oxygen-equivalent/element definitions for indicators."
      inputs:
        - cp_air
        - cp_water
      output: "period outlet load"
      source_ids:
        - jrc-pulp-bref-2015
    - id: balance_check
      applies_to: "internal physical links"
      rule: "Reconcile sent/received link amounts and stock changes on the same period/state; dry paper mass reconciles to actual ply dry fibre, additives and losses; do not invent a closure tolerance."
      inputs:
        - cp_balance
        - cp_material
        - cp_output
      output: "physical balance with residual uncertainty"
      source_ids:
        - jrc-pulp-bref-2015
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Match identity, medium, species, carbon origin, actual route, property and unit; a UUID is not a site amount or supply dataset."
      evidence: "direct identity; cp_material; cp_air; cp_water"
    - id: dq_layers
      applies_to: "reference product"
      requirement: "Retain ply dry-fibre origin/unbleached kraft proof, measured grammage and grade; reject applicability to external recovered-fibre plies. Require complete corresponding finish/width/grammage/Mullen evidence and passing boundary_classification comparison; a trade grade or SCT result alone is insufficient."
      evidence: "cp_output; supplier evidence; un-cpc3-2025; wco-hs2022-48"
    - id: dq_scope
      applies_to: "route and background links"
      requirement: "Count purchased-pulp upstream/onsite integrated recovery, utilities and offsite treatment once; disclose gaps and incompatible supplier quantity bases."
      evidence: "cp_material; cp_utility; cp_balance; cp_waste"
    - id: dq_primary
      applies_to: "all amounts"
      requirement: "Use actual site quantities, representative measurement and matching periods; disclose detection limits/non-detect rules. Unknowns are not zero and historical single-mill ranges are not substitutes."
      evidence: "cp_output; all collection protocols"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference and basis"
    rule: "Require one accepted finished reel reference output with all qualifiers, actual net paper mass/moisture and one common per-1-kg denominator; no duplicate same-identity intermediate/final outputs. Unresolved reference identity prevents complete methodology delivery."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: validation_route
    applies_to: "ply and route"
    rule: "Verify every ply is virgin unbleached kraft wood fibre. Check actual purchased/internal dry-fibre shares and exclude recovered-core variants; no trade-label or classification-only applicability."
    source_ids:
      - jrc-pulp-bref-2015
      - mondi-containerboard-fibre
  - rule_id: validation_double_count
    applies_to: "recovery and energy"
    rule: "Reconcile physical internal links and separate burden accounts; purchased pulp contains upstream recovery once, integrated production contains onsite recovery once. Do not double count black liquor as bought fuel/waste or onsite CHP as a purchased energy background."
    source_ids:
      - jrc-pulp-bref-2015
      - epa-chemical-pulping-1990
  - rule_id: validation_emissions
    applies_to: "final outlets"
    rule: "Check outdoor-air/freshwater compartment, true species/origin, pressure/gas definitions and NOx equivalence. PM bins must be disjoint; TRS and species, NOx and NO/NO2, and indicators/constituents must not duplicate impacts. Keep biogenic CO2; collected internally reused dust is not external air/waste."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: validation_gaps
    applies_to: "completed dataset"
    rule: "Missing UUID, quantity, field method, supplier reference basis, emission equivalence or unsupported relationship remains pending; report checks performed/skipped and completeness. Measured non-occurrence differs from unknown. This PCR never establishes scientific approval or native TIDAS schema validity."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "| validation_lineage_pack | every card, stock and packaging service | Reconcile first Q including new closing FG once; retain original Qc, real returns, Q0 and idle/cleanup. Per component reconcile P/N_ext/ER against every empty/raw/WIP/FG/reusable stock, gross outward and waste leg; ER needs the same prior outward item, and a new non-purchased entry is not burden-free. Whole provider once, physical V conserved independently of allocated A; deleting duplicates does not supply missing first entries; unmeasured/unreviewed scope remains explicit. | jrc-pulp-bref-2015 |"
    source_ids: []
  - rule_id: validation_classification
    applies_to: "finished reference reels and lot evidence"
    rule: "Check boundary_classification as a conjunction: original all-virgin unbleached sulphate wood-fibre/uncoated scope, permitted actual processing and machine-finished/machine-glazed state, measured width >36 cm, measured finished-paper w >115 g/m², and corresponding measured Mullen B >=B_min from the original five anchors and linear interpolation/extrapolation rule. Verify cp_output lot/sample linkage, actual method/version, specimen construction/conditioning and grammage basis, units, selected anchors, calculation and comparison in the original report. Do not substitute SCT or unrelated strength, copy a catalogue value or claim an ISO number specified by the HS note. Any failed condition stops applicability; missing or incompatible evidence leaves applicability unestablished and also stops use under this scope. Keep actual rejected/failed production and its inherited exchanges under existing Q/V/A rules; a classification stop never erases burdens or creates defaults. This test neither accepts a mapping nor approves a supplier dataset."
    source_ids:
      - un-cpc3-2025
      - wco-hs2022-48
      - jrc-pulp-bref-2015
published_dataset_profile:
  dataset_role: "Attributional mill-gate product dataset for the physically limited route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Input to downstream corrugating models after verified identity, ply composition, delivery state, quantity basis and boundary"
  excluded_use: "Testliner, white/bleached grades, other pulping routes, whole corrugated-box life cycle, unreviewed industry average or unresolved-identity dataset"
  required_metadata: "All reference qualifiers; supplier backgrounds/transport; physical graph/balances and burden ledger; utility interfaces/recovery shares; allocation; treatment/outlets; site period"
  required_quality_disclosure: "Actual collection coverage, verified/unresolved identities, basis compatibility, abnormalities/gaps, uncertainty, scientifically unreviewed scope and source applicability limitations"
  update_trigger: "Change of ply fibre origin, pulping/sizing, recovery/CHP, fuel/steam pressure, supplier quantity basis, grade or outlet"
data_sources:
  - id: "jrc-pulp-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board, 2015; DOI 10.2791/370629; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "§2.1.1–2.1.2 purchased/integrated route; §2.2.2 monitoring; §3.1 cooking/washing/recovery; §7.1/7.2 papermaking, sizing, reeling dust and plies. Method only; no historical case, recipe, concentration or BAT numerical inventory default. §7.1.11.5 printed p.677/PDF715 includes liner/corrugating-medium weights below 100 g/m², counterevidence to classification by end use alone, not a factory lot or inventory default."
  - id: "epa-chemical-pulping-1990"
    type: "official_guidance"
    reference: "US EPA, AP-42 §10.2 Chemical Wood Pulping, September 1990, reformatted January 1995; pp.10.2-1–10.2-3; https://www.epa.gov/sites/default/files/2020-10/documents/c10s02.pdf"
    used_for: "Integrated kraft recovery loop and reduced-sulphur species only. Historical batch/continuous and direct/indirect evaporation are alternatives, not a site prescription. No numerical values/factors; does not establish onsite recovery at a purchased-pulp paper mill."
  - id: "eu-pef-allocation-2021"
    type: "official_guidance"
    reference: "European Commission, Recommendation C(2021)9332 final / (EU)2021/2279, Annex I §4.5, pp.63–64; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Multifunctionality hierarchy and justification only; no claim of complete PEF compliance or fixed CHP shares."
  - id: "mondi-containerboard-fibre"
    type: "literature"
    reference: "Mondi, Containerboard Paper, product ranges, retrieved 2026-10-27; https://www.mondigroup.com/products-and-solutions/containerboard/"
    used_for: "Producer original: fresh top/recycled base in SmartKraft Brown is counterevidence to applicability by kraft name alone; no industry recipe or quantity."
  - id: "metsa-white-kraftliner"
    type: "literature"
    reference: "Metsä Board, White kraftliner, product-layer description, retrieved 2026-10-27; https://www.metsagroup.com/metsaboard/explore-paperboard/paperboard-as-packaging-material/white-krafliner/"
    used_for: "Producer original supports ply-specific review; white/coated examples are outside this unbleached/uncoated route and supply no default quantities."
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Ver. 3.0 Explanatory Notes, updated 30 June 2025, p.146, subclass 32132; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Direct definition of 32132 through HS 2022 4804.11 and 4804.19; classification context for this narrower unbleached branch, not a recipe, accepted mapping or whole-leaf coverage claim."
  - id: "wco-hs2022-48"
    type: "official_guidance"
    reference: "World Customs Organization, HS Nomenclature 2022, Chapter 48, Chapter Notes 3/6/7/8 (PDF pp.1–2), Subheading Note 1 and Mullen table (PDF p.3), heading 4804 and subheadings 4804.11/.19 (PDF p.5); https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/1048_2022e.pdf"
    used_for: "Actual finish, reel form, strict >115 g/m² and >36 cm conditions and minimum Mullen bursting kPa at original grammage anchors with linear interpolation/extrapolation; Note 3 finishing/surface-sizing limits and formal total-fibre definition. This PCR retains stricter every-ply all-virgin unbleached sulphate wood fibre. Classification definition only, not LCI/factory defaults, an invented ISO test number or customs ruling."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:dbcbf046d75d47a80c9ed7409136341b9c0098be8ee3759d50b67763ae7224d7"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7627"
      family: "system_boundary"
      span:
        start:
          offset: 7627
          line: 67
          column: 1
        end:
          offset: 21181
          line: 125
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased route: delivered unbleached kraft wood pulp; integrated route: received debarked chips and external make-up |\n| starting_condition_role | Foreground receiving interface, not an upstream burden cut-off |\n| product_classification_scope | CPC 3.0 32132 narrower; physical scope requires virgin unbleached kraft wood fibre in each ply plus every boundary_classification condition; failure or missing evidence stops applicability, with no accepted mapping established here |\n| recursive_input_rule | A purchased same-category liner or outsourced rework return retains its supplied product burden; record only actual incremental operations. This method does not replace finishing-only methodology or recreate supplied finished-board production |\n| upstream_dataset_requirement | Verify pulp species/route/unbleached state/dryness/recovery boundary; chips, chemical assay, water/electricity/fuel, actual input transport and external treatment datasets. Flow identity resolution is not a complete background dataset |\n| disclosure | Route and measured supply shares, site/period, pulp output/paper grades, internal links, CHP imports/own-use/exports, outlet media/treatment, actual emissions and gaps |\n\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_route` | mill foreground | Include stock preparation/refining, separate ply furnish, forming/pressing, drying, actual sizing, actual calendering, winding/trimming/packing, water/waste treatment and actual utilities. Integrated chip handling/cooking/washing/screening and chemical recovery apply only to the internally produced pulp fraction. | jrc-pulp-bref-2015 |\n| `boundary_recovery` | integrated kraft fraction | Include actual black-liquor evaporation, recovery furnace, smelt/green liquor, recausticising, lime kiln and NCG collection/combustion. Internal wet pulp is not dried/baled as market pulp unless it actually leaves the site. Purchased route includes upstream pulp/recovery once through the supplier dataset, without duplicating those foreground units. | jrc-pulp-bref-2015; epa-chemical-pulping-1990 |\n| `boundary_utilities` | steam and CHP | Onsite fuel, abatement, generation and final emissions plus physical internal steam/power links form one utility system. Never add a purchased-heat/electricity background for the same onsite output; purchased utilities use only true external interfaces. Keep imports and exports gross and separate. | jrc-pulp-bref-2015 |\n| `boundary_links` | internal physical links | Record both ends of fibre/broke, black/white/green liquor, lime mud/lime, steam/condensate and captured NCG links with identical period, state and amount; reconcile storage changes. Internal black liquor is neither an external fuel purchase nor a discharged waste. | jrc-pulp-bref-2015; epa-chemical-pulping-1990 |\n| `boundary_upstream` | completed product system | Retain upstream forestry/chip preparation, purchased pulp, reagent/fuel/water supply, input transport and external waste treatment. Foreground ends at accepted reels at mill gate; corrugation, box conversion, outbound customer delivery, use and end of life remain outside this foreground. | jrc-pulp-bref-2015 |\n| `boundary_complete` | additional actual flows | The rows are a mandatory screening list, not a complete site recipe. Add each actual aid, nutrient, lubricant, refrigerant, other fuel, packaging item, metal/mineral emission or distinct waste as one audited atomic row. Measured absence is distinct from missing evidence. | jrc-pulp-bref-2015 |\n\n\n### Exchange, stock and release accounting\n\nFor each actual site, formulation, ply recipe, fibre provenance and production period, maintain a gross physical vector V and a separate attributed burden vector A, both indexed by exchange identity, origin, phase, compartment, process and period. Do not pool different recipes, recovered-fibre substitutions, grades or provider routes into one formulation. Site-specific single- or multi-ply furnish and purchased/integrated shares must be measured; the PCR prescribes no universal recipe. Ordinary non-pigmented sizing is declared separately from actual coating/barrier treatment. A genuinely coated or laminated product is excluded. Actual calendering, slitting and reeling remain in the mill route when performed. [jrc-pulp-bref-2015; cp_lineage]\n\nOpening and closing raw material, pulp, liquor, WIP, broke and finished-paper stocks retain their complete exchange-specific inherited vectors, including the providers and prior energy, emissions and treatment already carried. Receipt, stage issue, internal transfer, loss, waste, sale and stock are separate legs. For every conserved constituent, opening stock + true external arrivals + measured formation = external departures + measured consumption/transformation + closing stock, with matched internal transfers cancelling only in the aggregate. Keep gross leg measurements before allocation. Water, carbon, fibre, Na, S, Ca and energy balances have independent observations; one residual cannot identify several missing quantities. [cp_lineage; cp_balance]\n\nQ is net paper mass first accepted and released during the period for this one formulation, including newly accepted closing finished goods once. Reconcile production, first release, gross dispatch, opening/closing finished goods and returns by lot. Dispatch of previously accepted opening stock carries its inherited A and does not create new Q. Preserve the original service/release record Qc for an already released lot: actual customer return, reinspection, repacking or rework carries its inherited vector plus actual incremental exchanges; a repeat dispatch is not a new manufacture or a second Qc. A rejected, unreleased or failed lot has Q = 0 until real first acceptance; retain its raw/WIP burden, rework, treatment and final destination. Idle operation, start-up, grade change, cleanup and failed production remain in the accounts. When Q = 0, keep absolute V and A and report normalization unavailable; never divide by zero, invent a service or erase the exchanges. [cp_output; cp_lineage]\n\nFor each card e, retain measured gross external g_e and its physical normalized display g_e/Q in that card's native property/unit. Retain A_e separately, following actual stock provenance, direct assignment and residual allocation; it is not a multiplier on real coproduct masses. The reference output is 1 kg net paper. If stock or release provenance is incomplete, neither period purchases/Q nor dispatch/Q establishes a complete attributable dataset. Missing values are unknown, not zero. Protocols and row conditions below apply to every card; no range, recipe, density, yield, price, emission factor, recovery credit or arbitrary balance tolerance is supplied. Report observed lot ranges and uncertainty with their original bases, not as industry defaults. [cp_lineage; cp_output; cp_balance]\n\n### Packaging custody and physical service\n\nApply this ledger independently to each actual paperboard core, uncoated paper wrapper and single-layer PE wrap, and add a separate atomic card for any other real component before claiming completeness. Identify material, physical form, packaging type, wet/dry mass, measured count-to-mass conversion, direction, receipt, custody, owner, provider and prior burden vector. Core/wrap/film never enters net reference paper mass. P means genuinely purchased provision, including a batch purchase without a separate component invoice. N_ext means first external non-purchased entry, including borrowed, leased, entrusted or non-purchased supplied-with-goods items. ER is the same physical item returning externally after a documented previous outward leg. A fresh borrowed core without a previous outward record is N_ext, not ER. Existing stock and internal circulation are neither P nor N_ext. These entries are disjoint, recorded at actual receipt; do not relabel a real new entry as internal reuse or remove only an OTHER duplicate and call that complete coverage. [cp_pack]\n\nFor each component, opening empty + raw-attached + WIP-attached + finished-attached + reusable stock, together with P + N_ext + ER, reconciles to the corresponding closing stocks + every gross external outward leg + external waste, with internal attach/detach/repair/reuse legs paired. Distinguish shipment attached to current product, shipment attached to old finished stock, empty returns to owner, loan/service outward and waste, retaining actual custody and receipt. Gross dispatch may include repeated circulation and is not purchased manufacture. Inherit the whole manufacturing provider once at its true first entry, including the prior vector on non-purchased items; unknown prior burden stays unknown rather than zero. Allocate only the attributable manufacturing/service share using actual measured service and stock records, retaining unconsumed closing vectors. Record repair, washing, replacement, transport and losses once when real. No invented lifetime, reuse count, loss fraction, free entry, new paper Q, avoided product or recycling credit follows from circulation. [cp_pack; cp_lineage]\n\n### Provider and receiver interfaces\n\nA whole purchased pulp, wood-chip lot, chemical formulation, size or external mixed stream receives its whole compatible provider once. Dry fibre, water, active ingredients, carrier and source partitions are analytical components of that same whole, not additional purchases. Independently supplied dilution water or separately purchased chemical is a different measured exchange. Inherit upstream forestry/harvest/chipping, actual kraft pulping and recovery, chemical manufacture, utilities and delivery from verified providers. Trace actual provider scopes and transport modes/loads/distances; a provider identity alone does not fill missing upstream operations. [cp_material; cp_receivers]\n\nRecord purchased steam, imported electricity, own CHP power/heat, condensate returns, internal recovered water and truly external reclaimed water at their actual distinct interfaces. Reused internal white water/condensate has a paired transfer and retains carried treatment/energy; no second water-manufacturing provider or recovery credit is added. External reclaimed water has its own supplier treatment/gate and measured quality; it cannot be silently omitted or charged again as virgin abstraction. Coupled heat/power/recovery burdens are counted once. Incoming and outgoing utility quantities remain gross, with state, energy basis and recipient service verified; a net utility bill cannot replace them. [cp_utility; cp_water; cp_receivers]\n\nA collected co-product must have a documented physical receiver function and acceptance, not merely a sale price. For every external waste, retain actual composition, wet/dry basis, legal/physical status, sender/receiver receipts and the real treatment function and emissions once. Source paper formation and the actual receiver service are both retained; purchasing finished packaging alone is not the production route of this PCR. Every actual chemical, pollutant or other exchange absent from the screening cards remains a specific declared gap until added and verified. [cp_receivers; cp_waste]\n\n### Chemical, phase and compartment observations\n\nRetain independent gas wet/dry volume, T/P, composition, carbon origin, actual emission compartment and phase; liquid water, vapour and aerosol are distinct. Pure molecular mass conversions require actual species identity and reporting basis. Total PM, COD/BOD, NOx and total metals are analytical aggregates, not substances with one molecular weight. Measure or independently establish their species fractions and analytical equivalence before a dependent conversion; do not infer several unknown species from a single balance residual. No catalogue grammage, density or background coefficient repairs a missing native area-to-mass chain. Retain actual paired lot area and measured net mass when such conversion is required. [cp_air; cp_water; cp_balance]\n\n### Classification applicability\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_classification` | finished reference reels | Require all original ply/route/unbleached/uncoated conditions and verified machine-finished or machine-glazed state, roll width >36 cm and finished-paper grammage w >115 g/m². Under HS 2022 Chapter 48 Subheading Note 1, minimum Mullen bursting strength B_min in kPa at grammage in g/m² is (115,393), (125,417), (200,637), (300,824), (400,961). For any other weight use the original note's linearly interpolated or extrapolated equivalent: between adjacent anchors calculate B_min = B1 + (w - w1) * (B2 - B1) / (w2 - w1); above 400 continue the last segment. Retain the selected anchors and calculation. The 115 anchor does not admit w =115 or less. Actual corresponding Mullen bursting strength B must be >=B_min; width =36 cm or less fails. Chapter Notes 3/6/8 and heading 4804 apply together; permissible finishing/surface sizing does not establish the required finish state by itself, and the formal >=80% total-fibre wood sulphate/soda definition never relaxes this PCR's every-ply all-virgin unbleached sulphate wood-fibre scope. Missing, incompatible or failed evidence stops applicability; do not substitute SCT, another generic strength or an assumed grade. These definition values are not LCI amounts or site defaults. | un-cpc3-2025; wco-hs2022-48 |\n\n"
