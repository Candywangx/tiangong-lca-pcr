measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is calibrated net accepted complete-notebook lot mass at declared gate moisture; collect using cp_finished, deduct measured packaging tare and rejects; Q must be positive."
  - id: same_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "reference-product Mass"
      uuid: ""
    required_unit: "kg"
    rule: "All row amounts and protocol aggregation use per 1 kg reference flow. Close physical lot records first, then divide attributable exchanges by Q for the same design and period; no assumed mass per notebook."
  - id: paper_geometry
    applies_to: "body_paper; front_cover; back_cover; endleaf"
    required_property_ref:
      name: "area; grammage; measured Mass"
      uuid: ""
    required_unit: "m2; g/m2; kg"
    rule: "Measure cut dimensions and grammage at the stated moisture/conditioning. Count physical sheets, not written surfaces; two usable page surfaces are one sheet unless the actual design differs. Geometry is a mass-balance cross-check, not the net finished-product denominator."
  - id: electric_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert metered electrical energy by 1 kWh = 3.6 MJ; preserve low-voltage user delivery and provider losses. This property does not establish steam net heat or enthalpy."
  - id: water_basis
    applies_to: "tap_water; washwater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Water input identity references kg. If volume is metered, use sampled actual density/temperature for the kg ledger and matched provider basis; no database screening density is assumed."
  - id: exclusive_particles
    applies_to: "pm25; pmcoarse; pmover10"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep disjoint aerodynamic bins at the same outdoor boundary. Cumulative PM10 cannot be added to PM2.5; compatible differences require common sampling coverage. Captured dust is a separate solid waste."
