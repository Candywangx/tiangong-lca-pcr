allocation_rules:
  - rule_id: allocation_separate
    applies_to: "physical ledgers"
    rule: "Keep physical stage/product/residue, water and carbon balances before burden allocation. Internal links retain identical physical quantities on both ends; do not multiply physical co-product outputs by burden shares."
    source_ids: []
  - rule_id: allocation_avoid
    applies_to: "shared production"
    rule: "First assess actual subdivision or feasible system expansion with declared functions and reference before allocation. Use design/job submetering and material issues where subdivision is possible. Otherwise justify a measured relevant physical causal relationship; an alternative relationship requires reasons why earlier options fail and representative data. Reconcile allocated burdens to the total; a kg reference does not itself justify mass allocation. Physical outputs and transfers retain complete quantities. This hierarchy citation does not assert full PEF or circular-footprint conformity."
    source_ids:
      - pef-allocation-2021
  - rule_id: allocation_residues
    applies_to: "paper_trim; cover_trim; spiral_trim"
    rule: "Record actual destination and waste/product status. No automatic avoided-paper/metal, biogenic-carbon deletion or energy credit. If a saleable co-product exists, justify applicable allocation and keep its physical output intact in a separate environmental-burden account."
    source_ids:
      - jrc-paper-bref-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_finished
      process_id: "notebook_manufacture"
      flow_role: "finished_notebook"
      record_type: "acceptance and calibrated weighing"
      raw_fields: "design; lot; accepted/reject counts; gross mass; packing tare; net mass Q; moisture; sheets/pages; dimensions; calibration"
      collection_method: "Weigh accepted complete same-design notebooks on a calibrated scale, subtract actual packaging tare, exclude rejects and reconcile counts. Count physical leaves and page surfaces separately; no default item mass."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "declared full reporting period"
      site_scope: "selected converter/design"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; acceptance and tare records"
    - protocol_id: cp_materials
      process_id: "notebook_manufacture"
      flow_role: "individual material inputs"
      record_type: "stock issue/return and weighing"
      raw_fields: "row_id; supplier/lot/grade; issue/return; opening/closing stock; mass; dimensions; grammage; moisture; measured water/carbon content and fossil/biogenic origin; spiral alloy/nylon/pitch/diameters; commissioning protection transfer"
      collection_method: "Weigh each material separately; reconcile issues, unused returns and stock changes with each job and stage. Measure sheet area/grammage and retained constituents; measure packing separately. For oil declare actual supplied grade/provider compatibility; retain commissioning inputs and protection transfer once."
      unit: "kg"
      frequency: "each lot and issue"
      temporal_coverage: "same period as accepted output"
      site_scope: "all attributable stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specifications; calibrated balances; job stock ledger"
    - protocol_id: cp_utilities
      process_id: "notebook_manufacture"
      flow_role: "electricity; tap_water"
      record_type: "meters and delivery records"
      raw_fields: "row_id; stage; start/end meter; time; voltage/region/provider; kWh; cleaning water mass or volume/density/temperature; attributable idle load"
      collection_method: "Meter each stage and shared supply with documented attribution; retain kWh to MJ conversion. For water, weigh supply or multiply actual volume by sampled density. Record utilities in original units and reconcile common period before normalization; no assumed steam or fuel."
      unit: "MJ; kg"
      frequency: "meter interval and job"
      temporal_coverage: "same period as accepted output"
      site_scope: "selected route and auxiliary loads"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; delivery invoices; density sample; stage attribution"
    - protocol_id: cp_waste
      process_id: "notebook_manufacture"
      flow_role: "each individual waste output"
      record_type: "weighing; samples; transfer receipt"
      raw_fields: "row_id; source stage; wet mass; moisture; fibre/filler; metal/alloy; nylon; oil contamination; receiver/destination; internal reuse; rejects; stock changes"
      collection_method: "Weigh each external waste separately, sample actual composition and receiver requirements. Keep clean paper, cover trim, captured dust, coated metal ends, oil-soiled paper, used oil and washwater distinct. Track internal rework and rejected-unit component separation without duplicate external transfers."
      unit: "kg"
      frequency: "each collection/transfer"
      temporal_coverage: "same period as accepted output"
      site_scope: "all included converter stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; samples; recipient acceptance; manifests; physical ledger"
    - protocol_id: cp_air
      process_id: "notebook_manufacture"
      flow_role: "pm25; pmcoarse; pmover10"
      record_type: "post-control source testing and fugitive survey"
      raw_fields: "source/outlet; outdoor medium; dry/wet basis; aerodynamic cuts; method coverage; concentration; compatible exhaust volume; operating hours; capture; detection limits; fugitive evidence"
      collection_method: "Survey cutting/punching and extraction; test actual release after control, including separately assessed fugitive paths. Method201A is only applicable filterable stationary-source sizing with its sampling/temperature/droplet limitations; total-filterable and condensable coverage needs suitable additional methods. Integrate compatible concentration and exhaust volume over actual operation. Unmeasured fraction or pathway remains pending, never a zero."
      unit: "kg"
      frequency: "representative operating tests and period logs"
      temporal_coverage: "same period as accepted output"
      site_scope: "all actual outdoor outlets and fugitive routes"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "method QA/calibration; sample blanks; detection limits; exhaust coverage and uncertainty"
  calculation_rules:
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q; A_i is attributable same-period exchange in its stated unit; Q is accepted net complete-notebook lot mass in kg. Final reference output is 1 kg."
      inputs:
        - cp_finished
        - cp_materials
        - cp_utilities
        - cp_waste
        - cp_air
      output: "amount per 1 kg reference flow"
      source_ids: []
    - id: paper_mass_check
      applies_to: "body_paper; front_cover; back_cover; endleaf"
      rule: "m_sheet_kg = measured_area_m2 × measured_grammage_g_per_m2 / 1000; lot paper = measured physical sheet count × m_sheet_kg. Reconcile cutting/punch loss, moisture and covers separately against actual weighing; page surfaces never double sheet mass."
      inputs:
        - cp_materials
        - "measured dimensions/grammage/counts"
      output: "paper mass cross-check, not denominator"
      source_ids: []
    - id: electric_conversion
      applies_to: "electricity"
      rule: "E_MJ = 3.6 × metered_kWh; normalize the attributed same-period MJ by Q after meter reconciliation."
      inputs:
        - cp_utilities
        - cp_finished
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: water_mass_conversion
      applies_to: "tap_water; washwater"
      rule: "whole_liquid_kg = measured_volume_m3 × measured_density_kg_per_m3 at sampled temperature; direct weighing needs no density assumption. For each actual input/effluent, H2O_kg = whole_liquid_kg × measured_H2O_mass_fraction. Keep dissolved and suspended fractions; non-water mass is not automatically dry solids. Preserve phase, losses and stocks without duplicate component exports."
      inputs:
        - cp_utilities
        - cp_waste
      output: "kg water ledger"
      source_ids: []
    - id: particle_integration
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "For each compatible source/interval, released mass = integrated post-control concentration × matched exhaust volume with documented unit conversion. Compatible coarse = PM10 − PM2.5; above10 = total filterable PM − PM10 only when total sampling coverage is established. Include measured fugitive releases separately without duplicating captured dust."
      inputs:
        - cp_air
        - cp_finished
      output: "exclusive released kg per 1 kg reference flow"
      source_ids:
        - epa-method201a-2020
    - id: physical_closure
      applies_to: "notebook_manufacture"
      rule: "For each material/constituent and the same period, opening stock + full physical external additions = retained accepted output + separately shipped packing/materials + external unused returns + external residues/releases + closing stock, with documented rejects/rework and measured moisture change. Internal link outgoing quantity = incoming quantity before burden allocation. Keep paper, metal/nylon, oil, water and carbon ledgers separately; declared residuals must be explained, never silently forced to zero. Reconcile paper/cleaning/material water, moisture changes, actual atmospheric humidity entering/leaving and water stocks separately; no unexplained residual is assigned to vapour. Actual net water release requires a separate compatible elementary exchange and measured coverage. Packing bands/cartons, supplier containers, pallets/liners, filters, replacement parts and protection/maintenance materials retain full physical receipts, returns, stocks and destinations; extend atomic rows when present or substantiate absence, independently of service-life burden attribution."
      inputs:
        - cp_materials
        - cp_waste
        - cp_air
        - cp_finished
      output: "physical ledgers and closure residuals"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all rows"
      requirement: "Verify physical state, formulation, route, reference property/unit and provider basis independently. Unknown UUID/provider remains an explicit gap; generic names do not overcome conflicting route/CAS fields."
      evidence: "supplier/direct identity/measurement evidence"
    - id: quality_period
      applies_to: "all rows"
      requirement: "Cover the same declared reporting period and design for stocks, acceptance, utilities, wastes and emissions. Preserve stage detail, instrument calibration, detection limits and uncertainty; representative sampling must explain extrapolation."
      evidence: "raw records; calibration; sampling plan"
    - id: quality_structure
      applies_to: "reference notebook"
      requirement: "Prove blank paper/cover and selected spiral construction by actual drawings, orders, material issues and acceptance. A catalogue confirms capability only; no invented factory data or reviewed status."
      evidence: "drawing; issue/acceptance records"
    - id: quality_complete
      applies_to: "foreground package"
      requirement: "List each additional atom separately and reassess applicability before completion. Material shortages, unsupported conversions or omitted pathways are not a pass."
      evidence: "completeness ledger and unresolved inventory"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_notebook"
    rule: "Exactly one final output equals 1 kg net accepted complete qualified notebooks; preserve all required qualifiers. Reject printed/glued/stapled/double-loop/loose-leaf or other excluded construction and packaging-included denominator."
    source_ids:
      - renz-spiral-manual
      - renz-metal-spirals
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Confirm same per 1 kg reference flow basis in collection/amount/calculations and both languages, positive Q, calibrated weighing, sheet/page distinction, compatible provider units and complete stage/constituent balances. No assumed per-notebook mass."
    source_ids: []
  - rule_id: validate_waste_air
    applies_to: "waste and elementary outputs"
    rule: "Require actual composition and recipient for waste, after-control outdoor medium for particles and mutually exclusive PM bins. Missing total/size/fugitive coverage is pending; captured dust, indoor dust and mill emissions cannot masquerade as converter air release."
    source_ids:
      - epa-method201a-2020
      - jrc-paper-bref-2015
  - rule_id: validate_completion
    applies_to: "foreground dataset"
    rule: "Unresolved UUID, provider quantity basis, source conflict or missing collection evidence must be reported; it blocks the affected completed dataset rather than inventing a substitute or zero. No scientific approval is established by a mechanical projection/measurement check."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing process per 1 kg qualified net notebook output."
  downstream_use: "secondary_dataset; background_dataset, after actual identity/provider/collection gaps are resolved"
  allowed_use: "Actual selected unprinted single-metal-spiral notebook route of the declared design/site/period; supplier-model use with preserved gate and upstream coverage."
  excluded_use: "All CPC32700 stationery, alternative binding/printing/thermal routes, equal writing-service claims, use-phase or generic environmental certification."
  required_metadata: "Required qualifiers, physical stage graph, net output, stocks and atomic rows, supplier/treatment/freight cut points, balances and allocation."
  required_quality_disclosure: "Actual measured/modelled evidence, UUID/provider/source debts, missing paths, sampling coverage, period and uncertainty; no publication/scientific-review implication."
  update_trigger: "Change in paper/cover/spiral structure, printing/glue/finish/thermal route, suppliers/reference bases, acceptance, utilities, waste destination or emission evidence."
data_sources:
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015), §§7.1.4,7.1.10; printed665/670, PDF703/708. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Upstream paper mill broke/finishing; cutting dust potential prompts actual converter survey, not a converter factor or recycling default."
  - id: "renz-spiral-manual"
    type: "handbook"
    reference: "RENZ SPB 360 comfortplus Operation Manual, order971000069, publisher snapshot2026-10-12, PDF2–3 and9. https://www.renz.com/fileadmin/Manuals/SPB_360_comfortplus.pdf"
    used_for: "Electric punching/inserting, metal SC-pliers restriction and commissioning trial paper; PDF9 built-in cutting is plastic-only under PDF2 restriction. No capacity/energy recipe."
  - id: "renz-metal-spirals"
    type: "handbook"
    reference: "RENZ Metal spirals, Overview, publisher snapshot2026-10-12. https://www.renz.com/products/coil-spiral/metal-spirals/"
    used_for: "Actual preformed NC-wire spiral with nylon coating; no universal alloy, coating mass, size or sheet count."
  - id: "clairefontaine-notebooks"
    type: "handbook"
    reference: "Clairefontaine Notebooks and pads, Notebooks paragraph, publisher snapshot2026-10-12. https://www.clairefontaine.com/gb/contenu/9/notebooks-and-pads"
    used_for: "Producer blank/ruled and staple/wire construction distinctions; capability only, not an exact surveyed selected SKU or dimensions default."
  - id: "mm-antaro-binding"
    type: "handbook"
    reference: "Müller Martini Antaro perfect binder, Top class end products, publisher snapshot2026-10-12. https://mullermartini.com/en/product/antaro/"
    used_for: "Milling and EVA/PO/PUR gluing as distinct excluded route; no glue quantity or production rate."
  - id: "kokuyo-binder"
    type: "handbook"
    reference: "KOKUYO Campus Binder Notebook, Features/open-close and replace Loose Leaf, publisher snapshot2026-10-12. https://www.kokuyo.com/en/stationery/series/campus/notebinder/"
    used_for: "Openable replaceable-leaf mechanism establishes excluded loose-leaf construction; no spiral component quantities."
  - id: "epa-method201a-2020"
    type: "official_guidance"
    reference: "US EPA Method201A, October7,2020 web copy, §§1.1–1.6, PDF1–2. https://www.epa.gov/sites/default/files/2019-08/documents/method_201a_0.pdf"
    used_for: "Filterable stationary-source PM2.5/PM10 sizing and limitations; no droplets/fugitive factor, no total/condensable coverage from sizing alone; no legal compliance claim."
  - id: "pef-allocation-2021"
    type: "official_guidance"
    reference: "European Commission, PEF method Annex I §4.5, PDF63–64 (2021). https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Multi-functionality hierarchy only; no full PEF/CFF compliance, automatic credit or physical-flow deletion."
