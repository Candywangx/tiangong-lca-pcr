  excluded_products: "Other binding constructions and all printed/ruled/adhesive/laminated/insert-rich variants; onsite pulping/papermaking, wire coating/forming and thermal routes; other stationery in CPC32700."
  representative_product: "One design of accepted complete blank-page single-metal-spiral notebook with unprinted paper covers."
  production_route: "Receive dry materials → cut/count/gather → punch leaves/covers → insert preformed single metal helix → metal-capable end cutting/crimping → inspect → tuck-pack/dispatch."
  market_state: "Complete net accepted notebook at converter gate; dispatch packaging separate."
functional_unit:
  what: "Provide blank paper writing leaves retained in the specified complete single-metal-spiral notebook."
  how_much: "1 kg net accepted complete notebooks of one declared design."
  how_well: "Actual paper writing specification, dimensions, complete leaf count, matching punch pattern/coil pitch, secure safe ends, page-turning and cover integrity with order-specific acceptance records; no universal durability or opening-performance value."
  how_long_or_cycle: "One manufacturing lot and factory-gate delivery; writing-service life or number of uses needs a separate declared service study."
  reference_flow_link: "finished_notebook"
system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "notebook_manufacture"
      rule: "Include cutting, make-ready/trial stock, gathering, paper/cover punching, spiral inserting, metal-capable end cutting/crimping, checking, dust capture, actual cleaning/maintenance and packing. Preformed component supply starts upstream; a machine instruction is not an energy/yield factor."
      source_ids:
        - renz-spiral-manual
        - renz-metal-spirals
    - rule_id: boundary_structure
      applies_to: "applicability"
      rule: "Require blank uncoated sheets and unprinted uncoated paper covers with a nylon-coated single metal spiral. Glue/staple/sewn/loose-leaf/double-loop/plastic-coil and printed/laminated structures need separate assessed methodology; a different writing purpose does not change physical identity."
      source_ids:
        - renz-spiral-manual
        - mm-antaro-binding
        - clairefontaine-notebooks
        - kokuyo-binder
    - rule_id: boundary_paper
      applies_to: "supplied paper"
      rule: "Complete actual upstream pulping/papermaking and finishing once within supplied paper. BREF7.1.4 describes mill broke circulation;7.1.10 describes mill trimming and dust potential. These mill facts do not prove converter recycling or a converter factor. Reject wood/plywood surveys as papermaking evidence."
      source_ids:
        - jrc-paper-bref-2015
    - rule_id: boundary_links
      applies_to: "internal stages"
      rule: "Keep one aggregated foreground unit but retain stage graph, meters and constituent ledgers. Sheet bundles and punched blocks pass between stages at equal physical quantities on both ends; internal recirculation is not another factory exchange. No intermediate output shares the final reference UUID."
      source_ids:
        - renz-spiral-manual
    - rule_id: boundary_releases
      applies_to: "factory releases"
      rule: "Survey actual post-control exhaust and fugitive outdoor release separately from captured dust, indoor deposition and external waste transfer. Survey dry cutting/punching even when dust is not visible. No combustion or steam source is in this route; actual deviations require reassessment. Upstream fossil and biogenic CO2 remain in compatible supplier LCI, independently of any GHG reporting convention."
      source_ids:
        - jrc-paper-bref-2015
        - epa-method201a-2020
boundary_abstraction:
  declared_starting_condition: "Purchased finished dry blank uncoated paper sheets and preformed nylon-coated single metal spirals received at converter; actual separate cover stock, protective leaves and packing inputs."
  starting_condition_role: "foreground_collection_gate with upstream background completion"
  product_classification_scope: "Only the qualified notebook subset of CPC32700; reference names and classification labels do not confer wider methodology coverage."
  recursive_input_rule: "Internal recut/reuse is circulation. Purchased same-category notebooks are not sheet stock; declare resale/rework separately with actual upstream cut point and no duplicate reference output or arbitrary recursion cut-off."
  upstream_dataset_requirement: "Actual pulp/paper manufacture, dry-sheet finishing, metal wire/nylon coating and preforming, lubricant, electricity, supplied water and packaging production/delivery; link each compatible provider once."
  disclosure: "Actual design/site/period, all in/outside stages, outsourcing, supply/delivery/treatment conditions, provider/identity gaps, constituent and water/carbon ledgers, allocation and uncertainty; downstream writing/retail/use/disposal excluded."
