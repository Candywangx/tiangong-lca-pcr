allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "This is an attributional manufacturing inventory. Establish the study decision context before applying ILCD's attributional provisions; a consequential comparison needs separately reviewed system expansion/substitution choices. EPA material balances support organic-material accounting only, never the LCA shared-load hierarchy. [ilcd-2010]"
    source_ids: []
  - rule_id: a_two_ledgers
    applies_to: "all exchanges"
    rule: "Retain unallocated physicalV by stage/state and all output/stock legs. Apply burdenA attribution only to environmental inventory loads; do not multiply actual catalogue/waste/output masses by a burden share to force closure. Every acquired whole/component provider has one burden owner."
    source_ids:
      - ilcd-2010
  - rule_id: a_subdivide
    applies_to: "shared press/finishing/ancillary service"
    rule: "First subdivide or virtually subdivide using actual job/colour meters, material issue and machine records, separately identifying make-ready, operation, cleaning, standby and failed production. Directly assign uniquely attributable exchanges before allocating only the remaining shared loads."
    source_ids:
      - ilcd-2010
  - rule_id: a_causal
    applies_to: "residual shared exchanges"
    rule: "Establish a determining physical cause for each exchange: measured area/passes, processing time with intensity, cleaning demand, or occupied volume/area×duration for compatible storage. Document the driver, all served jobs/cohorts including old stock/services, complete denominator, uncertainty and why alternatives are weaker. Printed pages, sales mass, price or one monthly denominator cannot stand for every exchange. Shares must conserve the pre-allocation inventory."
    source_ids:
      - ilcd-2010
  - rule_id: a_economic
    applies_to: "residual without supported causal assignment"
    rule: "Only after documenting failed subdivision/causal options, use evidence of process-gate co-function values in the same condition, quantities, currency and period, correcting demonstrable extra transport/conditioning from later sale prices. Missing/zero/negative/fee values or an unsupported denominator remain specific review cases; no arbitrary share, absolute-value shortcut or clipping to zero. Do not calculate a forced result without an actual defensible basis."
    source_ids:
      - ilcd-2010
  - rule_id: a_recovery
    applies_to: "paper/metal/packaging recovery"
    rule: "Preserve receiver/state/value and explicit burden ownership. A scrap sale or owner-return is not an automatic negative input or avoided virgin-material credit. ILCD recycling rules require the real joint process, property changes and actual positive/negative-value treatment boundary. Keep this unresolved where evidence is absent; no invented recycling rate, number of cycles, negative-fee clip or universal cutoff. Any approved separate scenario must not duplicate the main treatment/provider inventory."
    source_ids:
      - ilcd-2010
  - rule_id: a_cohorts
    applies_to: "returns, rework, packaging reuse"
    rule: "Transport/carry-forward an item or component's original exchange vector with its owner/cohort; do not repurchase its manufacture on ER or reallocate old FG to current new Q. Add actual new handling/laundry/storage/transport/waste services on original Qc or a separately reviewed service basis. Retain Q=0 and failed/idle loads with explicit attribution or pending review, never erase them."
    source_ids:
      - ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "catalogue_manufacture"
      flow_role: "complete first-release catalogue"
      record_type: "future foreground measurement"
      raw_fields: "seller/design/edition; actual contents/commission; audience/distribution purpose; cohort/item/lot IDs; new first release; copies/pages; calibrated net mass; tare/moisture; rejected mass; opening/new/old closing FG; order/colour/staple acceptance"
      collection_method: "Inspect actual contents and job brief; weigh complete accepted catalogue lots after trim on calibrated scales excluding shipping packaging. Reconcile count with same-design measured sample mass and sampling uncertainty. Deduplicate first release by item/lot; retain new accepted closing stock. Aggregation conditions: only compatible unique cohort first-release Qc."
      unit: "kg; copies"
      frequency: "each lot/release and stock closure"
      temporal_coverage: "declared representative job/cycle period"
      site_scope: "actual printer and declared design"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "job content/specification; scale calibration; acceptance/stock logs; sample design"
    - protocol_id: cp_materials
      process_id: "catalogue_manufacture"
      flow_role: "separate body/cover/plate/cloth/powder"
      record_type: "future foreground measurement"
      raw_fields: "row/stage/cohort; supplier/grade; P/N_ext/ER where relevant; receipts/issues/returns; S0/S1 raw/WIP; actual net mass; moisture; coating; powder/cloth state; spools/cores"
      collection_method: "Weigh deliveries/issues/leftovers and reconcile stage ledger; distinguish same-state transfer from actual printed/formed product transformation. Record plate coating fate and paper make-ready/trim; no sheet-count default mass. Aggregation conditions: retain raw physicalV, carry-forward and original Qc."
      unit: "kg"
      frequency: "each delivery/job and closure"
      temporal_coverage: "declared job/cycle period"
      site_scope: "site and actual supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; supplier specs; calibration; matched stage records"
    - protocol_id: cp_formulations
      process_id: "catalogue_manufacture"
      flow_role: "each whole ink/fount/wash and separate IPA"
      record_type: "future foreground measurement"
      raw_fields: "SKU/colour/cohort; supplied mass/volume; assay/purity/density/T; complete constituents/CAS; carrier water; fossil/biogenic origin; made-up dilution; retained/waste/air/stock fractions; provider ownership"
      collection_method: "Weigh each whole supplied formulation and separately added substance; obtain full supplier composition beyond public SDS. Measure dilution water separately. Keep assays nested, not additive provider exchanges. Evaluate actual organic species and concentration/state compatibility. Aggregation conditions: compatible cohort amount and single provider owner."
      unit: "kg; m3"
      frequency: "each SKU/job/mixture and closure"
      temporal_coverage: "actual material batches in reporting period"
      site_scope: "site and actual formulation supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full supplier disclosure/assays; density/T; calibrated weights; constituent balance"
    - protocol_id: cp_stitch
      process_id: "catalogue_manufacture"
      flow_role: "coated round stitching wire"
      record_type: "future foreground measurement"
      raw_fields: "wire grade/route; diameter/roundness/coating; spool net/tare; head setup; actual staple count/length; retained/cut/mis-stitch mass; rejected catalogue identity"
      collection_method: "Weigh whole coated wire issued/returned and independent scrap; verify round wire supplier route, measured staple retention and bindery acceptance. Counts only convert using measured compatible wire geometry/density or weighed staple samples with uncertainty, never a universal2-staple dose. Aggregation conditions: retained wire and waste disjoint."
      unit: "kg; count"
      frequency: "each job/spool/setup"
      temporal_coverage: "declared job/cycle period"
      site_scope: "actual stitching line and wire supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "wire certificate; scale records; stitch/pull/handling acceptance; reconciliation"
    - protocol_id: cp_energy
      process_id: "catalogue_manufacture"
      flow_role: "electricity and site utility survey"
      record_type: "future foreground measurement"
      raw_fields: "meter/voltage; kWh; stage/job; grid/year/provider; start/stop/standby/cleanup; intensity/runtime; all served jobs; heat/fuel/refrigerant audit; any supply/return mass/h/T/P"
      collection_method: "Calibrated stage submeters and bills, including compressed air/cooling/extraction; reconcile unmetered loads with documented causal evidence. Verify bounded electric configuration. Record any heat/fuel occurrence as retained out-of-scope extension debt, with independent supply/return streams and loss/storage terms. Aggregation conditions: compatible cohort burden only, preserve idle/failed/old-cohort services."
      unit: "kWh; MJ"
      frequency: "each stage/job and bill closure"
      temporal_coverage: "representative cycles including Q=0 periods"
      site_scope: "actual site utility service"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters/bills; load tests; survey/absence evidence; full driver denominator"
    - protocol_id: cp_water
      process_id: "catalogue_manufacture"
      flow_role: "municipal and formulation water, vapour"
      record_type: "future foreground measurement"
      raw_fields: "separate meter; source/treatment; volume/mass/density/T; carried water; incoming paper moisture; product/waste stocks; inlet/outlet humidity/airflow/T/P; condensate"
      collection_method: "Meter separately added water; assay actual formulation and paper moisture; reconcile all physical water states. Integrate measured matched vapour inlet/outlet mass, condensate and stock change. No unmeasured residual as identified vapour. Aggregation conditions: each compatible cohort water amount."
      unit: "kg; m3"
      frequency: "fills/bleeds/lots and representative ventilation cycles"
      temporal_coverage: "actual job/cycle period"
      site_scope: "site circuits and outdoor boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; water-specific assay; humidity/flow closure; uncertainty"
    - protocol_id: cp_packaging
      process_id: "catalogue_manufacture"
      flow_role: "each carton/film/pallet component"
      record_type: "future foreground component/ownership ledger"
      raw_fields: "component/item/owner/cohort IDs; original Qc and inherited vector; first purchased P including bundled price; first non-purchase N_ext; prior outward link for ER; raw/WIP/attached-newFG/attached-oldFG/reusable S0/S1; gross dispatch; owner-return; waste; component mass/grade; every transport leg; whole/component provider"
      collection_method: "Inspect contracts/consignment and item history, weigh components with tare and match every ER to its genuine preceding outward leg. No standalone invoice is needed for P if bought as part of a whole. Separate borrowed/leased/entrusted/supplied first entry from same-item return and same-state internal reissue. Reconcile each location once; measure actual loss/repair/transport without invented reuse lives. Aggregation conditions: manufacture once on actual acquisition basis and carry vector to served original cohorts; actual later services separately."
      unit: "kg; count; distance"
      frequency: "each acquisition/movement/dispatch/return and closure"
      temporal_coverage: "component history plus declared service period"
      site_scope: "site/owner/carrier and actual receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase/bundled contract; consignment/ownership; item-linked movements; gross transport and stock records"
    - protocol_id: cp_waste
      process_id: "catalogue_manufacture"
      flow_role: "each separate whole outgoing waste"
      record_type: "future foreground measurement"
      raw_fields: "stream/bin/cohort; whole mass/tare/state; water-specific fraction; independent solids/volatiles; actual components; volume/density/T; S0/S1; receiver/route/value/fee; transport"
      collection_method: "Weigh each actual segregated whole transfer; retain wet/dry definitions, actual contamination and receiver acceptance. Keep treatment, laundry/owner return and internal rework distinct. Never add analytical components to whole waste or count paper/staples in multiple outgoing streams. Aggregation conditions: compatible cohort leg and actual treatment ownership."
      unit: "kg; m3"
      frequency: "each collection/transfer/closure"
      temporal_coverage: "declared period including failed lots"
      site_scope: "site handover and actual receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weigh/assay and transfer records; receiver/fee agreement; balance"
    - protocol_id: cp_air
      process_id: "catalogue_manufacture"
      flow_role: "each actual outdoor organic species/PM bin"
      record_type: "future foreground monitoring"
      raw_fields: "source/cohort/time; constituent/CAS survey; outlet/inlet flow/concentration/T/P/humidity; instrument response/recovery; blanks/LOD; control; PM cut/filterable/condensable definition; carbon origin"
      collection_method: "Competent species analysis validated for actual volatility/matrix over make-ready, steady print, cleaning and storage; integrate matched ventilation measurements. GC Method18 has polymerisation/low-vapour-pressure limits; FIA carbon/calibration-gas equivalents are not species masses. Establish disjoint PM cuts, no captured-dust double count. Aggregation conditions: compatible cohort species amounts; preserve LOD/unknowns."
      unit: "kg; mg/m3; m3/time"
      frequency: "representative cycles and material/control changes"
      temporal_coverage: "actual job/cycle period"
      site_scope: "site post-control outdoor boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/recovery; blanks; matched flow/conditions; control and sample coverage"
    - protocol_id: cp_cohorts
      process_id: "catalogue_manufacture"
      flow_role: "physicalV and inherited burdenA"
      record_type: "future traceable accounting"
      raw_fields: "all row/stage/state IDs; first-release Qc; raw/WIP/new-oldFG/reusable stocks; P/N_ext/ER; internal links; transformations; gross outward/waste; each exchange vector/owner/provider; direct/shared/idle/failure/service loads; causal/economic evidence"
      collection_method: "Reconcile physical stages and mutually exclusive stocks before attributing burdens. Carry opening/imported item vectors without re-adding original manufacture. Deduplicate acquisition and first release; partition only supported shared load residues. Keep every unmatched return, price/fee ambiguity, missing vector and Q=0 load explicitly pending. Aggregation conditions: new compatible amounts on Qc, inherited/later amounts on original Qc or explicitly reviewed service basis."
      unit: "row-native kg or MJ; cohort kg"
      frequency: "each movement/job and period closure"
      temporal_coverage: "original cohort history and current services"
      site_scope: "complete declared site/provider boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original vectors and acceptance IDs; provider ownership; stage/stock closure; allocation evidence"
  calculation_rules:
    - id: cohort_normalize
      applies_to: "all inventory rows"
      rule: "For a positive unique first-release cohort Qc, divide that cohort's compatible attributable row amount by Qc to report per1 kg reference flow. Preserve physicalV before burdenA and stock attribution. This division applies neither to unrelated current-month purchases nor old-cohort inventories/services. If Qc=0 retain the raw load and assignment gap without division."
      inputs:
        - "row-native amount"
        - cp_cohorts
        - cp_release
        - "original Qc"
      output: "compatible normalized row and explicit unresolved load"
      source_ids:
        - ilcd-2010
    - id: release_count_mass
      applies_to: "cp_release"
      rule: "Unique first-release accepted kg = same-design first-released copies × calibrated measured mean net complete-copy mass, verified against lot weighing; include newly accepted closing FG once. Reconcile FG0 + first release + genuine ER + matched internal FG_in = FG1 + gross dispatch + owner-return + withdrawal to rework/waste + matched internal FG_out; restored already accepted items enter through their matched return, not another release."
      inputs:
        - cp_release
        - "calibrated sample mass"
        - cp_cohorts
      output: "Qc and FG movement reconciliation"
      source_ids:
        - ilcd-2010
    - id: stage_balance
      applies_to: "cp_materials; cp_stitch; cp_cohorts"
      rule: "For each material/state and stage apply b_stage, including actual formation/consumption at real conversions and all losses/transfers. Matched internal_out/in cancel on consolidation. Transfers between raw/WIP/FG/reusable locations in the same state create neither external receipt nor transformation formation."
      inputs:
        - S0
        - S1
        - "actual receipts/outward/losses"
        - internal_in
        - internal_out
        - "measured transformation map"
      output: "unallocated stage/state physicalV and residual uncertainty"
      source_ids:
        - epa-eiip-2002
    - id: component_assay
      applies_to: "cp_formulations; cp_waste"
      rule: "Analytical component mass = measured whole mixture mass × measured/verified mass fraction. Volume requires actual compatible density at recorded T. Whole liquid×(1−water-specific fraction) gives non-water mass, not automatically dry solids. Keep assays nested and provider burden once."
      inputs:
        - "whole mass"
        - "constituent/water assays"
        - "density/T"
        - cp_formulations
        - cp_waste
      output: "component balance supporting one whole exchange"
      source_ids:
        - epa-ctg-2006
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "MJ = measured kWh ×3.6, followed by compatible cohort attribution and normalization; no thermal efficiency factor."
      inputs:
        - cp_energy
        - cp_cohorts
      output: "electricity MJ per1 kg reference flow"
      source_ids:
        - ilcd-2010
    - id: air_species
      applies_to: "cp_air"
      rule: "Species kg = integral of matched outlet flow×species concentration minus matched incoming species mass on consistent T/P/humidity basis, converted to kg. Sum disjoint outlets/times only; retain sign/uncertainty for review rather than clipping negative results. PM bins cannot include cumulative PM10/TSP again."
      inputs:
        - cp_air
        - "compatible response/recovery and flow evidence"
      output: "actual outdoor species/PM physical mass"
      source_ids:
        - epa-method18
        - epa-method25a
    - id: burden_partition
      applies_to: "cp_cohorts"
      rule: "Assign directly attributable inventory first; distribute only residual shared loads using evidenced exchange-specific causal shares, or approved process-gate value shares after a_economic. Sum all assigned burdens plus explicit pending residue back to original inventory; physical outputs do not get mechanically scaled by shares."
      inputs:
        - "full shared inventory"
        - "complete served cohort/driver set"
        - "signed value/fee evidence"
        - cp_cohorts
      output: "burdenA vectors and conservation/pending-residue check"
      source_ids:
        - ilcd-2010
    - id: packaging_closure
      applies_to: "cp_packaging"
      rule: "For each mutually exclusive component location, S0 + P + N_ext + proven ER + matched internal_in = S1 + gross dispatch + owner-return + waste + matched internal_out, with genuine repair/component changes explicit. P includes bundled first procurement; N_ext is first non-purchased external entry; ER requires same-item prior outward. Preserve every original vector and all transports; provider charge/production is owned once."
      inputs:
        - cp_packaging
        - cp_cohorts
        - "component owner/history"
        - "all gross legs"
      output: "component physical closure and acquisition/service ownership"
      source_ids:
        - ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "catalogue and each atomic row"
      requirement: "Verify actual commercial content/distribution purpose, complete physical construction, official bilingual flow names, native type/property/unit/state/route and supplier compatibility. UUID discovery is not site confirmation or a default provider."
      evidence: "content/job brief; exact native identity and support-chain records; supplier/receiver scope"
    - id: dq_basis
      applies_to: "all rows/cohorts"
      requirement: "Preserve first-release Qc, new closing FG once, original old-cohort reference and each inherited exchange vector. No sales-month denominator or repeated manufacture on same-item returns."
      evidence: "acceptance IDs; original vectors; mutually exclusive stock and gross leg records"
    - id: dq_composition
      applies_to: "formulations and products"
      requirement: "Obtain whole recipes, water/carbon origins, retained components and true process transformations; public SDS may omit ingredients. No formulation factor or foreign plant dose is a default."
      evidence: "supplier disclosure/assays; stage/component balances and uncertainty"
    - id: dq_coverage
      applies_to: "site and period"
      requirement: "Cover startup, failed lots, Q=0/idle, cleanup, stocks/returns and every actual extra material/species. Record absence evidence, missing data and out-of-scope extensions separately."
      evidence: "meter/utility/material survey; representative monitoring; explicit unresolved register"
    - id: dq_allocation
      applies_to: "burdenA and provider links"
      requirement: "Evidence subdivision and each residual causal/value denominator, preserving negative/fee uncertainty and total inventory; whole/container/component, acquisition, treatment and transport cannot each charge the same burden twice."
      evidence: "ILCD scope decision; driver/price records; provider ownership and reconciliation"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference"
    rule: "Confirm actual commercial goods-promotion/ordering contents and distribution purpose plus every construction qualifier. The code's title is insufficient; no whole32620 coverage, campaign-effect service equivalence, publication service or ordinary directory/book substitution."
    source_ids:
      - unsd-cpc3
      - demago-catalogues
  - rule_id: v_release
    applies_to: "Qc and stock"
    rule: "Check unique new first quality release, complete net mass and one final output. New closing FG counts once; opening FG/old cohorts/ER/rework/later service cannot create Q. Every inherited row uses original Qc or approved service method. Retain Q=0/failure/idle/cleanup loads and explicit unresolved assignment."
    source_ids:
      - ilcd-2010
  - rule_id: v_physical
    applies_to: "stage and components"
    rule: "Reconcile stage/state physicalV with internal_in/out, real formation/consumption and mutually exclusive stocks. Same-state transfer is not acquisition or formation. Match retained paper/ink/water/wire/zinc/powder to accepted/rejected products; whole plus analytical components cannot double mass."
    source_ids:
      - epa-eiip-2002
      - bekaert-stitching-wire
  - rule_id: v_packaging
    applies_to: "each component"
    rule: "Verify bundled first purchases P, first true non-purchase N_ext and same-item prior-outward ER evidence, ownership and inherited vector. Keep gross dispatch/owner-return/waste and every transport leg separate. Check whole-container/component and acquisition/reuse provider burdens once; zero cost proves no burden exemption."
    source_ids:
      - ilcd-2010
  - rule_id: v_allocation
    applies_to: "burdenA"
    rule: "Independently assess subdivision, each physical causal driver and full served denominator, residual gate value/fee evidence and recycling boundary. Missing or negative values are review cases, not clipped zero. Sum assigned plus pending loads to total without scaling actual physical output masses."
    source_ids:
      - ilcd-2010
  - rule_id: v_utilities
    applies_to: "actual site"
    rule: "Verify electric-only declared scope and actual voltage/grid/provider basis; retain actual heat/fuel/refrigerant additions as extension gaps. Any heat proposal needs independent supply/return masses and enthalpies, leakage/blowdown/storage reconciliation and no assumed efficiency."
    source_ids:
      - epa-ctg-2006
      - ilcd-2010
  - rule_id: v_air_water
    applies_to: "emissions and treatment"
    rule: "Confirm actual species/CAS/medium, inlet/outlet basis and method recovery, disjoint PM bins and no captured-dust double count. TVOC-carbon equivalents are not species mass; unmeasured water/organic residuals remain uncertainty. Keep treatment transfers out of direct emissions."
    source_ids:
      - epa-method18
      - epa-method25a
      - epa-ctg-2006
  - rule_id: v_completeness
    applies_to: "dataset delivery"
    rule: "Report accepted inputs, checks performed/skipped, findings and completeness. Missing actual site/provider/quantity evidence or unreviewed extension cannot pass as a completed quantitative dataset. A coherent draft method and identity lookup do not establish scientific/translation approval or mapping acceptance."
    source_ids:
      - ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Route-specific physical commercial product-catalogue manufacturing input after real foreground/provider evidence and independent review."
  allowed_use: "Declared uncoated, conventional CMYK wet sheetfed, round zinc-coated wire saddle-stitch catalogue at printer gate with actual measurements and cohort/component ownership."
  excluded_use: "Whole-leaf/industry average; books/directories/editorial periodicals; other printing/binding/finishing; online/publishing/distribution or equal advertising-effect service; ready-made inventory inferred from machine capability or UUID."
  required_metadata: "Every reference qualifier; actual site/period/route/providers; original cohort basis and exchange vectors; stock and component acquisition/return history; physicalV/burdenA; transport/treatment ownership; allocation evidence."
  required_quality_disclosure: "Measurement/recipe/identity/provider gaps; site-scope restrictions; residual balances; unassigned Q=0/old-cohort loads; uncertainty; performed/skipped review/checks and incompleteness."
  update_trigger: "Changed design/content/distribution gate, stock/ink/fount/wash/wire, printing/setting/finishing, plate, utility/control/receiver/provider, cohort/reuse method or evidence."
data_sources:
  - id: "unsd-cpc3"
    type: "official_guidance"
    reference: "UNSD CPC3.0 code32620 official detail, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/32620 ; CPC3.0 Explanatory Notes30June2025, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Code hierarchy326/3262/32620 and PDF/printed148–152; content categories, directory and periodical distinctions.32620 has no extra frequency/construction note. No HS rule or manufacturing recipe inferred."
  - id: "epa-eiip-2002"
    type: "official_guidance"
    reference: "EPA EIIP VolumeII Chapter15, May2002, https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "PDF14–15 §2.1.1/Figure15.2-1 sheetfed process; PDF27–31 material accounting/site-specific data limitations. Historical retention/VOC factors not adopted; not a LCA allocation source."
  - id: "epa-ctg-2006"
    type: "official_guidance"
    reference: "EPA-453/R-06-002, September2006, https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "PDF12–14/printed6–8 §IV.A; conventional sheetfed ink setting, fountain and wash separation. No historic solvent fraction/retention/regulatory threshold used as an LCI default."
  - id: "ilcd-2010"
    type: "official_guidance"
    reference: "JRC ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "PDF275–292/printed255–272 §§7.9.2–7.9.3 including scope, subdivision/virtual subdivision, determining physical causality, serial/parallel services, residual process-gate economic value, recycling positive/negative value and100% rule. Cohort/packaging equations are this PCR's declared accounting implementation, not quoted ILCD factory formulas; heat guard is dimensional conservation, not an ILCD steam factor."
  - id: "demago-catalogues"
    type: "literature"
    reference: "Demago Print, Catalogues, magazines, notebooks (Stapled binding), https://www.demagoprint.com/publications-catalogues-magazines-notebooks-stapled-binding-c-562_1802.html"
    used_for: "“How the binding works”, “Materials and preparation” and alternatives; real folded/collated wire-stapled catalogue offering, with uncoated options. Not proof of selected wet offset/site/recipe; advertised2 staples/page counts/quantities/lifetimes not defaults."
  - id: "mm-primera"
    type: "literature"
    reference: "Müller Martini PrimeraPRO, https://mullermartini.com/en/product/primera-pro/"
    used_for: "Saddle-stitch equipment, gathering/stitch/eject and automatic three-knife trim paragraphs. No speed, format, number of staples or site configuration imported."
  - id: "bekaert-stitching-wire"
    type: "literature"
    reference: "Bekaert Stitching wire official product page, https://www.bekaert.com/en/products/consumer-goods/domestic/stitching-wire"
    used_for: "Coated round/flat wire, zinc alternative, C-steel/wire features and staple formation; only selected round zinc-coated steel here. Actual wire grade/route/coating/quantity still collected. No nominal-PDF content or generic diameter/dose adopted."
  - id: "breese-sheetfed"
    type: "literature"
    reference: "Breese Publishing Digital and Prepress Printing Services, https://www.breesepub.com/services/digital-and-prepress-printing-services"
    used_for: "Sheetfed catalogue production and separate bindery saddle-stitch/fold options; alternatives include web/digital/coatings, so capability does not certify a combined job, uncoated recipe or electric-only site."
  - id: "kodak-process-free"
    type: "literature"
    reference: "Kodak SONORA Process Free Plates Sustainability datasheet, https://www.kodak.com/content/pdfs/print/KODAK-SONORA-Process-Free-Plates-Sustainability-datasheet-EN.pdf"
    used_for: "PDF1 absence of a separate chemical processor/rinse for this plate option only. Plate/coating production, on-press coating fate and make-ready still required; no environmental-zero claim."
  - id: "huber-sheetfed-ink"
    type: "literature"
    reference: "hubergroup RAPIDAECO official product page, https://www.hubergroup.com/us/en/product-finder/product/rapida-eco"
    used_for: "Conventional quick-setting sheetfed process ink on absorbent substrates, four colours and IPA-free alternatives. Mineral-oil-free claim is neither full composition nor zero emissions/site supplier proof."
  - id: "heidelberg-powder"
    type: "literature"
    reference: "Heidelberg News270(2010), https://www.heidelberg.com/global/media/en/global_media/company___publications/heidelberg_news/editorial/pdf_10/hn_270.pdf"
    used_for: "PDF/printed53 “Small Grains that Have a Big Effect”; starch versus calcium-carbonate/sugar and coated powder alternatives; no dose, grain-size range, humidity or emission fraction adopted."
  - id: "epa-method18"
    type: "official_guidance"
    reference: "EPA Method18 web copy1April2025, https://www.epa.gov/system/files/documents/2025-04/m-18-04012025_0.pdf"
    used_for: "PDF1–2 §§1–4; GC species calibration, humidity/interference and low-vapour-pressure/polymerisation limitations. Method requires competent matrix-specific validation; no claim of site monitoring or regulatory certification."
  - id: "epa-method25a"
    type: "official_guidance"
    reference: "EPA Method25A web copy3August2017, https://www.epa.gov/sites/default/files/2017-08/documents/method_25a.pdf"
    used_for: "PDF1 §§1–2 distinguishes calibration-gas/carbon equivalent from individual species mass. No automatic response factor."
  - id: "pgm-counterexample"
    type: "literature"
    reference: "PGM Advertising Materials and Catalogues, https://www.pgm.lv/en/services/advertising-materials-and-catalogues/"
    used_for: "Possibilities/Equipment describes heatset/web catalogue capability and alternative finishing; counterexample only, not selected sheetfed supplier, recipe or quantity evidence."
