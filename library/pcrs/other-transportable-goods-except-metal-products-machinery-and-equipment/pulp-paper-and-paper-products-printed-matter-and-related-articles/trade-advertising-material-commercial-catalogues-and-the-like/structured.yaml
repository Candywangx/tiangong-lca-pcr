functional_unit:
  what: "Supply the declared seller's product-promotion and ordering content as an accepted complete physical catalogue."
  how_much: "1 kg net accepted complete catalogues of one declared design and first-release cohort; report copies/pages alongside measured mass."
  how_well: "Actual agreed print legibility/colour specification, page completeness/order, fold/trim dimensions, staple integrity/position and safe handling acceptance; no universal functional equivalence across designs."
