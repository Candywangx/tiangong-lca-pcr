system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "catalogue manufacture"
      rule: "Include prepress/CTP, make-ready, body/cover wet sheetfed printing and setting, folding/gathering, cover feeding, wire forming/stitching, trimming, inspection, packing and attributable cooling/compressed-air/collection/cleanup/standby. Supplier technology existence does not establish this site's configuration or quantities."
      source_ids:
        - epa-eiip-2002
        - epa-ctg-2006
        - mm-primera
        - breese-sheetfed
    - rule_id: b_content
      applies_to: "applicability"
      rule: "Verify seller goods-promotion/ordering contents, commission and intended distribution independently of title/binding. Exclude services, books/directories/editorial periodicals and incompatible constructions. No publication-frequency threshold is imposed on32620 by this method."
      source_ids:
        - unsd-cpc3
        - demago-catalogues
    - rule_id: b_utilities
      applies_to: "bounded electric foreground"
      rule: "This selected configuration uses electrically driven stages and electric ancillary service, without onsite combustion, purchased steam/heat or thermal ink dryer. Actual site survey must demonstrate this scope; missing evidence is a gap, not zero. If fuel/heat/refrigerant loss or another excluded operation occurs, retain its quantities and require a separately assessed atomic extension before claiming dataset completeness."
      source_ids:
        - epa-ctg-2006
        - breese-sheetfed
    - rule_id: b_heat_guard
      applies_to: "any proposed heat extension"
      rule: "Meter supply and return mass independently and use separate incoming/outgoing enthalpy streams at actual pressure/temperature/quality/reference state; reconcile actual leak/blowdown/condensate/storage-energy terms. Use mass×(supply enthalpy−return enthalpy) only after proving matched mass at the same boundary. Do not invent an efficiency or equate electrical MJ with delivered steam heat. This guard does not approve an unassessed heat route."
      source_ids:
        - ilcd-2010
    - rule_id: b_stage
      applies_to: "stage and stock accounts"
      rule: "For each material/state and stage, retain S0 + external receipts + internal_in + actual transformation formation = S1 + external outward legs + internal_out + actual transformation consumption. Record every loss/emission and documented species transformation; formation/consumption are real conversion terms, not same-state stock transfers. Internal_out and the receiving internal_in must match identity/state/cohort/quantity and cancel on consolidation. Component assay ledgers are nested under whole products, never added as extra mass."
      source_ids:
        - epa-eiip-2002
        - ilcd-2010
    - rule_id: b_cohort
      applies_to: "first release and subsequent handling"
      rule: "Preserve raw/WIP/new FG/old FG/reusable stocks as mutually exclusive locations. Qc records each new physical item only on its first quality release; include new closing FG once. Opening FG, old accepted stock, true same-item external returns, rework, repacking or later service do not create Q. Preserve each inherited exchange vector with owner/cohort and original Qc; add only actual later services on that original basis or an explicitly reviewed service reference. Keep Q=0/idle/cleanup/failed-lot burdens pending assignment; never divide them by current new Q merely because the reporting month matches."
      source_ids:
        - ilcd-2010
    - rule_id: b_packaging
      applies_to: "each packaging component"
      rule: "Record first external purchased P even if its cost is included in a whole consignment without a separate invoice; first genuinely non-purchased borrowed/leased/entrusted/supplied-with-goods N_ext; ER only with proof of the same item and its preceding outward leg. Preserve owner/cohort/inherited vector and raw/WIP/attached-FG/reusable stock location without overlap. Keep gross dispatch, owner-return, waste and all actual transport legs separately, never netted. A zero price is not zero burden; whole-container and component providers each have one owner, not both."
      source_ids:
        - ilcd-2010
    - rule_id: b_backgrounds
      applies_to: "upstream and wastes"
      rule: "Link input production/delivery and outgoing receiver treatment once; whole formulated ink/fount/wash/coated wire/complete packaging already containing components excludes duplicate component production. Direct outdoor species are post-control site exchanges; transferred wastewater is a treatment handover, captured dust is waste and ambient intake is not a new process emission."
      source_ids:
        - epa-ctg-2006
        - ilcd-2010
boundary_abstraction:
  declared_starting_condition: "Purchased unprinted dry paper, finished coated process-free plates, complete supplied formulations and coated stitching wire received at printer gate."
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "Only the declared physical commercial product-catalogue subset of32620; no all-leaf or all-process coverage."
  recursive_input_rule: "Purchased already printed catalogues are not virgin paper or new production; retain origin/cohort/inherited exchange vector and original reference basis. Same-item return/rework cannot generate another first-release output."
  upstream_dataset_requirement: "Compatible actual paper manufacture, plate/coating, whole ink/fount/wash/wire, utility supply, packaging acquisition and waste treatment backgrounds once, matching delivered state, quantity and ownership."
  disclosure: "Design/site/period; gate and actual commercial handover; stages/outsourcing; excluded routes and site heat/fuel survey; physicalV, burdenA and stock ownership; unresolved identity/provider/quantity and scope."
