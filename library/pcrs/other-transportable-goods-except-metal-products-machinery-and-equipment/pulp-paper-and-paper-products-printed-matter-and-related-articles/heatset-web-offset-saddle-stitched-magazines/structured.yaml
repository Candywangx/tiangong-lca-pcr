allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "p_magazine"
    rule: "First use actual job/stage meters and identified materials. Separately account for make-ready, cleaning, start-up/shutdown and rejects attributable to each campaign; document causal remaining shared-service drivers. Do not allocate all ink or heat simply by sales revenue or copy count."
    source_ids:
      - eu-sts-bref-2020
      - epa-printing-eiip-2002
  - rule_id: allocation_physical
    applies_to: "physical ledgers"
    rule: "Keep full unallocated physical outputs, stock changes and paired internal transfers in mass/water/carbon/solvent ledgers. Apply an agreed share only to the environmental burden ledger. Do not mechanically multiply co-product physical output by that share."
    source_ids:
      - eu-sts-bref-2020
      - epa-printing-eiip-2002
  - rule_id: allocation_scrap
    applies_to: "waste and recovered heat"
    rule: "Declare scrap classification and actual treatment/recipient. No automatic avoided-virgin credit for paper, plate or wire waste and no credit for internally recovered heat. Any system expansion belongs to a separately justified downstream study and must not duplicate waste treatment."
    source_ids:
      - eu-sts-bref-2020
      - eu-paper-bref-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "p_magazine"
      flow_role: "reference acceptance"
      record_type: "foreground_record"
      raw_fields: "job id, period, accepted copies, net accepted kg, moisture, covers, stitches, box/wrap tare, rejected kg; title/edition/issue, lot/cohort, unique first manufacturing release event/date, original Qc, opening/closing raw/WIP/new and old FG, real return/rework and dispatch IDs"
      collection_method: "Weigh accepted complete magazines on calibrated scales or reconcile traceable net weighing records. Representative copy sampling needs a measured count-to-mass record; no generic copy mass. Preserve batch totals. Establish Q_acc from unique first manufacturing quality releases only; count newly released closing FG once, opening unreleased WIP only at its first completed release, and never add old FG dispatch/reinspection/repacking or same-item returned/reworked released product. Retain original Qc and release lineage for later services under quantity preparation."
      unit: "kg"
      frequency: "each campaign and release/return event"
      temporal_coverage: "Matched production campaign including startup/cleaning/control outages; linked prior and later cohort periods"
      site_scope: "Declared printer and actual equipment/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated records, supplier identity/basis, raw totals, uncertainty and exclusions; unique release register and complete stock/cohort bridge"
    - protocol_id: cp_material
      process_id: "p_magazine"
      flow_role: "material input"
      record_type: "foreground_record"
      raw_fields: "purchase/stock/return kg, job and colour, grade, CAS, formulation, dry/wet basis, coating, wire length/mass, reuse, supplier dataset; exchange/event and original cohort/release IDs, complete opening/closing raw/WIP/FG/return V/A/provider/gate/phase/medium/period; each packaging component P/N_ext/ER/EO, prior outward ID, owner/custody, state, mass/count conversion and all gross direction/recipient/transport/service records"
      collection_method: "Use opening + receipts - closing - returns by product/colour and stage; weigh waste/retained fractions. Preserve formulation mass and separate active-species mass. Reconcile paper and cover, plate, cotton and wire; include startup. This net-use bridge does not replace complete gross external legs or inherited vectors. Apply quantity preparation and the controlled packaging direction ledger, including paid bundles and first nonpurchase provision; carry raw/WIP/FG/real-return vectors without recharging manufacture. Keep complete unnormalized physical V and separately supported A in native units; campaign_normalization alone divides the selected manufacturing numerator by its Q_acc, with old-cohort services separately on original Qc."
      unit: "kg"
      frequency: "each receipt/job/stock and packaging movement"
      temporal_coverage: "Matched production campaign including startup/cleaning/control outages; linked prior and later cohort periods"
      site_scope: "Declared printer and actual equipment/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated records, supplier identity/basis, raw totals, uncertainty and exclusions; complete exchange vectors, component stocks, entry/prior-outward and recipient/transport evidence"
    - protocol_id: cp_energy
      process_id: "p_magazine"
      flow_role: "power and fuel"
      record_type: "foreground_record"
      raw_fields: "stage meter readings, voltage, gas m3, T/P, wet/dry, composition, Z, provider m3, run/idle/cleaning, integrated/separate dryer/control, recovery and bypass; complete exchange V/A/provider/gate/phase/medium/period and raw/WIP/FG/return cohort vectors, actual service and embedded closing-WIP quantities"
      collection_method: "Read calibrated electricity and gas meters at matched campaign boundaries. Separate equipment and idle/make-ready where measurable; integrated common meter counted once. Preserve gas supplier-volume conversion evidence and kWh/MJ conversion. Keep every gross period meter reading; attribute actual released-cohort use separately from measured embedded closing WIP and old-cohort later services using quantity preparation. Carry prior energy vectors once, not all period energy onto current new Q_acc. Preserve unnormalized V/A in native units; campaign_normalization divides only the selected manufacturing numerator once."
      unit: "MJ; m3"
      frequency: "continuous and campaign/service"
      temporal_coverage: "Matched production campaign including startup/cleaning/control outages; linked prior and later cohort periods"
      site_scope: "Declared printer and actual equipment/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated records, supplier identity/basis, raw totals, uncertainty and exclusions; meter-to-cohort/closing-WIP and original-Qc service bridge"
    - protocol_id: cp_water
      process_id: "p_magazine"
      flow_role: "water balance"
      record_type: "foreground_record"
      raw_fields: "input m3, fountain dilution, washing, cooling makeup/blowdown, emulsion carrier, paper moisture in/out, condensate, vapour, combustion-generated water, stores; exchange/event and original cohort/release IDs, complete inherited V/A/provider/gate/phase/medium/source-period vectors"
      collection_method: "Meter each fresh water use and weigh/assay actual water in paper/liquids. Retain liquid/water-vapour output and reaction-water records; internal loop water is not new input. Harmonize measured density. Apply quantity preparation to complete exchange-indexed V/A/provider/gate/phase/medium/period and raw/WIP/FG/real-return cohort carryover. Keep gross native totals, closing embedded burdens and actual later original-Qc services separately; campaign_normalization divides only the supported new-manufacturing numerator once."
      unit: "m3; kg"
      frequency: "campaign and monitoring"
      temporal_coverage: "Matched production campaign including startup/cleaning/control outages; linked prior/later cohort periods"
      site_scope: "Declared printer and actual equipment/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated records, supplier identity/basis, raw totals, uncertainty and exclusions; complete vector/stock and original-cohort service evidence"
    - protocol_id: cp_waste
      process_id: "p_magazine"
      flow_role: "external residuals"
      record_type: "foreground_record"
      raw_fields: "stream id, net kg, ink/solvent/moisture/coating, dust bins, sorted wire, receiver, waste code, treatment, containers/tare, internal return; exchange/event and original cohort/release IDs, complete inherited V/A/provider/gate/phase/medium/source-period vectors; per-component gross accompanying/empty/EO/service/waste directions, owner/custody, recipient and actual transport"
      collection_method: "Weigh each outgoing stream and obtain acceptance/transfer records. Distinguish entrained liquid from cloth and ink-on-paper from separate ink residue. Collected dust is not air emission. Track returned material internally. Apply quantity preparation to complete exchange-indexed V/A/provider/gate/phase/medium/period and raw/WIP/FG/real-return cohort carryover. Keep gross native totals, closing embedded burdens and actual later original-Qc services separately; campaign_normalization divides only the supported new-manufacturing numerator once. Apply the component-specific controlled packaging direction ledger; chemical residue and container tare remain disjoint."
      unit: "kg"
      frequency: "each consignment/campaign"
      temporal_coverage: "Matched production campaign including startup/cleaning/control outages; linked prior/later cohort periods"
      site_scope: "Declared printer and actual equipment/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated records, supplier identity/basis, raw totals, uncertainty and exclusions; complete vector/stock and original-cohort service evidence"
    - protocol_id: cp_emission
      process_id: "p_magazine"
      flow_role: "species and controls"
      record_type: "foreground_record"
      raw_fields: "species/CAS, material source fraction, stack/room/bypass id, time, actual airflow, concentration, carbon/species basis, T/P, wet/dry, capture and destruction, NO/NO2 split, particle sizes, retention/waste carbon; exchange/event and original cohort/release IDs, complete inherited V/A/provider/gate/phase/medium/source-period vectors"
      collection_method: "Use appropriate source tests/GC speciation and flow measurements over actual operating modes, or a closed species material balance with measured retention/waste/capture/destruction. Assess uncertainty and detection limits. TVOC alone cannot supply species amounts. For each matched interval use species-mass concentration times measured exhaust volume, or integrate concentration times measured volume rate over actual duration; do not multiply an already integrated volume by duration again. Use matching wet/dry, temperature, absolute pressure and oxygen-correction conventions; a concentration or rated fan flow alone is not campaign mass. Keep startup, bypass and ventilation inlet baselines, and record carbon-to-species conversion only for an identified molecular composition. Keep unknown species as incompleteness and add verified atomic rows before dataset completion. Apply quantity preparation to complete exchange-indexed V/A/provider/gate/phase/medium/period and raw/WIP/FG/real-return cohort carryover. Keep gross native totals, closing embedded burdens and actual later original-Qc services separately; campaign_normalization divides only the supported new-manufacturing numerator once."
      unit: "kg"
      frequency: "representative modes, full campaign coverage"
      temporal_coverage: "Matched production campaign including startup/cleaning/control outages; linked prior/later cohort periods"
      site_scope: "Declared printer and actual equipment/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated records, supplier identity/basis, raw totals, uncertainty and exclusions; complete vector/stock and original-cohort service evidence"
    - protocol_id: cp_chiller
      process_id: "p_magazine"
      flow_role: "chiller chemical mass"
      record_type: "foreground_record"
      raw_fields: "equipment/refrigerant CAS, charge, recovery, stock, additions, losses, service dates, actual installed route; exchange/event and original cohort/release IDs, complete inherited V/A/provider/gate/phase/medium/source-period vectors"
      collection_method: "Reconcile service/stock charge balance on the installed chiller. Apply quantity preparation to complete exchange-indexed V/A/provider/gate/phase/medium/period and raw/WIP/FG/real-return cohort carryover. Keep gross native totals, closing embedded burdens and actual later original-Qc services separately; campaign_normalization divides only the supported new-manufacturing numerator once. Internal charge cycling is not repeated input; no leakage default. Record documented absence if not installed."
      unit: "kg"
      frequency: "service and campaign"
      temporal_coverage: "Matched production campaign including startup/cleaning/control outages; linked prior/later cohort periods"
      site_scope: "Declared printer and actual equipment/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated records, supplier identity/basis, raw totals, uncertainty and exclusions; complete vector/stock and original-cohort service evidence"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "a_i = B_i / Q_acc; B_i is the supported attributed external exchange coordinate A for newly first-released manufacture in its stated unit, including inherited opening vectors actually used once; Q_acc is cp_mass unique first manufacturing-release net kg. Finished_magazine is 1 kg. Use one complete matched reporting-period pool for the same product, grade, route, site and reference state, retaining all startup/shutdown, wholly failed or zero-output batches, rejects, WIP and rework. Sum supported attributable numerator totals before dividing once by strictly positive Q_acc; newly released closing FG counts once, old FG dispatch/reinspection/repacking and same-item return/rework add no Q_acc. Bridge every opening/use/closing raw/WIP/FG/real-return exchange V/A/provider/gate/phase/medium/source-period and cohort under quantity preparation; measured closing-WIP embedded burden remains there until later completion, not wholly on current released Q_acc, while the full period gross meters remain. Later actual services, cleanup, transport and losses of released goods are separate incremental original-cohort views divided only by the supported original Qc, with prior vectors retained and no repeated manufacture. Keep physical V unallocated and pair/cancel internal transfers; transformation is no second receipt. Never average batch ratios, omit failed/idle/cleanup activity or invent allocation shares from EPA solvent balances. Zero/unknown Q_acc or Qc retains absolute exchanges and uncertainty without division or loss of accounts; require review of unresolved attribution."
      inputs:
        - B_i
        - Q_acc
        - cp_mass
      output: "a_i"
      source_ids:
        - epa-printing-eiip-2002
    - id: species_release
      applies_to: "solvent species"
      rule: "For each confirmed species j, reconcile input_j + opening_j = retained_j + waste_j + closing_j + destroyed_j + emitted_j. emitted_j comprises disjoint stack, room fugitive and bypass only; internal captured/recirculated gas is not emitted. Keep destroyed carbon for CO2/CO origin balances."
      inputs:
        - cp_material
        - cp_waste
        - cp_emission
      output: "species kg per 1 kg reference flow"
      source_ids:
        - eu-sts-bref-2020
        - epa-printing-eiip-2002
    - id: carbon_water_reconcile
      applies_to: "p_magazine"
      rule: "Maintain separate unallocated fossil/biogenic carbon and water ledgers, including paper/cover/ink/stitches product state, discarded materials, moisture evaporation, fuel/solvent destruction and measured gases. Preserve carbon in retained product and wastes; do not call destroyed solvent an avoided emission. Reaction water and combustion air belong to the physical balance, not assumed mass-loss closure."
      inputs:
        - cp_material
        - cp_water
        - cp_waste
        - cp_emission
      output: "physical balances and reported residuals"
      source_ids:
        - eu-sts-bref-2020
        - epa-printing-eiip-2002
  data_quality_requirements:
    - id: basis_identity
      applies_to: "all rows"
      requirement: "Flow UUID/medium/species identity and actual supplier quantity/background compatibility are separate acceptance checks. An unresolved UUID or provider basis stays explicit, not an approximate positive match."
      evidence: "Supplier declarations and complete identity records"
    - id: full_period
      applies_to: "p_magazine"
      requirement: "Same campaign/accepted mass across EN/ZH, meters, stock changes, waste and emissions; include rejects and bypass periods. Reconcile unique first releases/new closing FG, original Qc and old-FG/return later services across periods; keep every gross meter and embedded closing-WIP vector without charging it all to current released Q_acc. Zero/unknown new Q retains absolute failed/idle/cleanup and service accounts. Historical factors are not substituted for measurement."
      evidence: "cp_mass; cp_energy; cp_emission; release/cohort registers and complete exchange carryover"
    - id: speciation_completeness
      applies_to: "elementary rows"
      requirement: "List actual species beyond the conditional starter rows and resolve every relevant CAS/medium with its own row. No assumed positive dodecane/toluene/IPA or zero unknown residue. Explain non-detects, missing speciation and NOx/PM basis gaps."
      evidence: "cp_emission"
    - id: balances
      applies_to: "physical and burden accounts"
      requirement: "Keep paired internal transfers, unallocated material/water/carbon totals and the allocated burden ledger separately; record residual and uncertainty rather than forcing a default recipe. Check every raw/WIP/FG/real-return inherited V/A/provider/gate/phase/medium/period coordinate and original cohort. For each actual packaging component reconcile disjoint stocks, P including paid bundles, N_ext, proven same-item ER, EO and every gross accompanying/empty/service/waste/transport leg outside Q_acc; provision whole or components once, actual later services once, unknown/free provision never zero by assumption."
      evidence: "cp_material; cp_water; cp_emission; cp_waste; complete stock, prior-outward, provider and direction/service evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_magazine"
    rule: "Require exactly one complete reference output, net mass, moisture and physical construction. Intermediate signatures and shipping packaging cannot replace it; cross-stage transfers match on both ends. Verify actual issue contents, intended readers and editorial/distribution purpose against general-interest scope, retaining title, edition, issue number/date and schedule evidence; reject excluded content categories or frequency even when the physical route matches."
    source_ids:
      - pgm-magazines
      - un-cpc3-periodicals-2025
  - rule_id: validate_emissions
    applies_to: "elementary rows"
    rule: "Validate CAS, source carbon origin, outdoor-air receiving boundary and chemical mass. Do not combine NO/NO2 with a NOx aggregate or N2O; do not sum nested PM totals or collected dust with air releases. Missing source/speciation/detection evidence is incomplete, not a pass."
    source_ids:
      - eu-sts-bref-2020
      - epa-offset-ctg-2006
  - rule_id: validate_control
    applies_to: "drying and control"
    rule: "Check operating, startup/shutdown and bypass coverage; reconcile captured, destroyed, retained and emitted solvent/carbon. Measured stack TVOC mg C/Nm3 without speciation does not prove full LCI or zero fugitive emissions."
    source_ids:
      - eu-sts-bref-2020
      - epa-offset-ctg-2006
      - epa-printing-eiip-2002
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Every manufacturing amount, collection aggregation and calculation uses the same 1 kg accepted net denominator from unique first manufacturing release. Verify new closing FG once, original Qc, no extra Q from old FG dispatch/reinspection/returned rework, complete inherited exchange V/A/provider/gate/phase/medium/period through raw/WIP/FG/returns and measured closing-WIP burden carryover while gross period meters remain complete. Validate later actual services on original-cohort Qc separately, and zero/unknown-Q absolute inventories without lost failed/idle/cleanup activity. Verify per-component P/N_ext/ER/EO ownership/prior-outward tests, disjoint packaging stocks and all gross outward/return/waste/service/transport directions outside magazine Q; whole or constituent provision once, actual later increments once, no invented cycles/share/credit or free/unknown burden as zero. UUID identity does not prove complete site data. Unknown m3 basis, formulation, inherited burden or waste recipient remains explicit and prevents a complete dataset claim."
    source_ids:
      - epa-printing-eiip-2002
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after independently checked site evidence and upstream link completeness"
  downstream_use: "One declared gate-to-gate foreground inventory per accepted kg with linked upstream supply/treatment; can be embedded in a separately scoped lifecycle model"
  allowed_use: "Manufacturing of general-interest print magazines issued less than four times a week and matching the coated-paper heatset wire-stitched route; actual publication identity and route evidence required"
  excluded_use: "CPC 32420 or 32490 applicability, full CPC 32410 coverage, online editions, publications issued four or more times a week, reading-service equivalence, other excluded routes, a background inferred from an identity UUID alone"
  required_metadata: "Reference qualifiers, period/site, stocks and accepted mass, flows/properties/providers, capture/abatement/bypass, formulas, physical and allocated accounts, sources and actual waste routes"
  required_quality_disclosure: "Unresolved identities and basis, speciation coverage, particle-size/NOx limitations, detection limits, unmeasured scope and uncertainty; no scientific approval inferred from tooling"
  update_trigger: "Paper/cover/ink/fountain/wash/plate/wire grade change, dryer/control/fuel or chiller change, changed supplier m3/MJ basis, new species or packaging/waste route"
data_sources:
  - id: "eu-sts-bref-2020"
    type: "official_guidance"
    reference: "European Commission/JRC, STS BREF 2020, chapter 11 §§11.2,11.3.1,11.3.2.4,11.3.3,11.4.1,11.4.3.2; printed pp344-375, PDF pp383-414. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2021-06/jrc122816_sts_2020_final.pdf"
    used_for: "Heatset route, separated solvent balances, thermal control, wastes and combustion monitoring; no historical virtual-plant percentages or measured default factors."
