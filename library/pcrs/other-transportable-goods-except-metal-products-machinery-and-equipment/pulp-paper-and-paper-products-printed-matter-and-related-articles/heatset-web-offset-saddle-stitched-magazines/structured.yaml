system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "p_magazine"
      rule: "Include receipt, imaging, make-ready, wet printing, drying/oxidation, chill/remoistening when installed, folding/gathering, wire stitching, trim, waste/emissions and dispatch packing. Distribution/use/end of life are outside the foreground gate."
      source_ids:
        - eu-sts-bref-2020
        - pgm-magazines
        - kodak-sonora-2026
    - rule_id: boundary_upstream
      applies_to: "purchased paper"
      rule: "Paper background must actually cover pulp/furnish preparation, forming, drying and mill coating of the declared grade, with upstream emissions/waste and allocation disclosed. Woodworking/plywood surveys cannot establish papermaking. Do not duplicate mill broke or mill dust as printer emissions."
      source_ids:
        - eu-paper-bref-2015
    - rule_id: boundary_control
      applies_to: "dryer and press"
      rule: "Retain a stage-specific extraction/control diagram. Split stack after treatment, fugitive room loss and bypass; capture and destruction are distinct. Internal solvent incineration/heat recovery is not an external fuel/avoided-emission credit. Keep fuel and ink/additive carbon origins separate."
      source_ids:
        - eu-sts-bref-2020
        - epa-offset-ctg-2006
        - contiweb-ecoset
    - rule_id: boundary_aggregate
      applies_to: "p_magazine"
      rule: "Aggregate actual interstage signature/cover transfer and packaging into one foreground unit with separate stage meters. Keep transfer ledgers at identical quantity/state on both ends. Only finished_magazine is the external reference-product output."
      source_ids:
        - pgm-magazines
        - muller-primera
boundary_abstraction:
  declared_starting_condition: "Purchased unprinted coated paper and complete plate/chemicals enter the printer gate."
  starting_condition_role: "Paper/pulp/coating manufacture remains upstream; foreground is printing and finishing."
  product_classification_scope: "Only CPC 32410 general-interest print magazines published less than four times a week that also match this physical route; CPC 32420 and 32490 are excluded."
  recursive_input_rule: "A same-category purchased printed input keeps its measured state and distinct supplier; never use this full PCR again on an internal signature or self-linked output."
  upstream_dataset_requirement: "Link route/grade-compatible paper, plate, each ink/additive, wire, electricity, gas, water, packaging and each waste treatment; identity UUID alone is insufficient."
  disclosure: "Site, dates, meters, moisture, capture/control/bypass, internal circulation, outsourcing, exclusions and unresolved actual evidence."
