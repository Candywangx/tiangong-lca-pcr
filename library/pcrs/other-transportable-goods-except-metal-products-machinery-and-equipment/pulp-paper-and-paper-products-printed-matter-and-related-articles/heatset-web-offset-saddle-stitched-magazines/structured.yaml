measurement_rules:
  - id: reference_mass
    applies_to: "finished_magazine"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_mass accepted net kg of complete magazines, excluding boxes/wrap and rejected copies. Denominator is identical for every inventory and protocol in the same manufacturing view: Q_acc counts only unique first manufacturing releases, including new closing FG once. Old FG dispatch, reinspection and same-item return/rework retain original Qc and create no new Q_acc; later services have a separate original-cohort view. Declare product moisture; do not replace accepted mass with gross paper input or copy count."
  - id: gas_basis
    applies_to: "natural_gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Match recorded T/P, dry/wet state, composition and compressibility to supplier reference m3; unknown compatibility is pending. Do not use the nonreference Mass meanValue as density."
  - id: energy_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain source meter kWh and convert with verified unit group, 1 kWh = 3.6 MJ; do not reinterpret the property as boiler heat. Meter 1-35 kV delivered electricity with matching background."
  - id: species_basis
    applies_to: "all elementary emissions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use chemical species mass and actual receiving medium. mg C/Nm3 TVOC is carbon-equivalent, not solvent kg; monitor flow/concentration wet/dry/T/P conventions must agree. NO/NO2 speciation is required before use of their UUIDs; NOx-as-NO2 totals remain pending without it."
