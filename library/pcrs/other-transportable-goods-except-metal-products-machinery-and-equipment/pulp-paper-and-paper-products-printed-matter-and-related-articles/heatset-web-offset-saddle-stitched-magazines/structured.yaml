    type: "official_guidance"
    reference: "US EPA, EPA-453/R-06-002, September 2006, §§IV-VI and VIII, printed pp6-14,18-20; PDF pp12-20,24-26. https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "Independent offset ink/fountain/wash and capture evidence; US guidance, no transplanted legal thresholds or efficiency."
