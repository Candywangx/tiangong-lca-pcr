    reference: "US EPA, EIIP Volume II Chapter 15, May 2002, §4.1, PDF pp31-32. https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "Material-balance and measurement method selection; no default chemical recipe."
  - id: "eu-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission/JRC, Production of Pulp, Paper and Board BREF 2015, §§7.1.4 and 7.1.10, printed pp665,670; PDF pp703,708. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Purchased paper upstream manufacturing, broke and cutting scope; not printing-site emission factors or wood-processing evidence."
  - id: "pgm-magazines"
    type: "handbook"
    reference: "Poligrafijas grupa Mukusala, Magazines, official snapshot 2026-10-12, Heatset / Saddle stitched magazines / equipment headings. https://www.pgm.lv/en/services/magazines/"
    used_for: "Real heatset saddle-stitched magazine product and cover/paper alternatives; single producer, no universal size/grammage/run length."
  - id: "contiweb-ecoset"
    type: "handbook"
    reference: "Contiweb, Ecoset/T hot air dryer, official snapshot 2026-10-12, dryer/chill sections. https://www.contiweb.com/web-offset/drying-and-chilling/ecoset"
    used_for: "Equipment illustration for afterburning/chilling, gas and silicone; no assertion installed at PGM, no marketing savings or zero-emission defaults."
  - id: "kodak-sonora-2026"
    type: "handbook"
    reference: "Kodak, SONORA Ultra and UltraXR Process Free Plates, brochure K-1228.26.07.13.EN.02, 2026, PDF pp4-5 process elimination and p6 technical table. https://www.kodak.com/content/pdfs/print/KODAK-SONORA-UltraXR-Process-Free-Plates-brochure-EN.pdf"
    used_for: "Complete process-free plate example with heatset application; no manufacturer recipe or imaging-energy default."
  - id: "hohner-wire-stitching"
    type: "handbook"
    reference: "Hohner, Universal 43/6 S operating instructions, §§1.5,2.4,4.1-4.1.1, PDF/printed pp7,11,39. https://www.hohner-postpress.com/fileadmin/mediathek/schmalheftkoepfe/universal43-6-s/manuals/43-6S_MNL_EN_436009798_436010716.pdf"
    used_for: "Wire stitching use, steel-wire hardware and separate oil/grease maintenance; no generic wire gauge, staple count, lubricant recipe or dose."
  - id: "muller-primera"
    type: "handbook"
    reference: "Muller Martini, Primera PRO, official snapshot 2026-10-12, saddle-stitcher, gathering and three-knife trimmer. https://mullermartini.com/en/product/primera-pro/"
    used_for: "Gathering, stitching and trimming process; no default speed/yield."
  - id: "un-cpc3-periodicals-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Ver. 3.0 Explanatory Notes, updated 30 June 2025, printed/PDF p150, 32300 and 32410/32420/32490. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "General-interest content and publication-frequency boundary and adjacent exclusions; classification frequency is not a production or LCI default."
  - id: "theweek-editorial-purpose"
    type: "handbook"
    reference: "The Week, About Us, updated 22 May 2026, opening purpose paragraphs and The Week magazine section; accessed 27 October 2026. https://theweek.com/about-us"
    used_for: "Real general-interest world-news/current-affairs reading function; content example only, no printer, machine, binding, page-count or inventory assumption."
  - id: "theweek-weekly-print"
    type: "handbook"
    reference: "The Week UK, official subscription page, PRINT + DIGITAL offer, weekly printed delivery statement; accessed 27 October 2026. https://theweek.com/uk/subscription"
    used_for: "Real weekly print distribution; no production run, paper grade, lifespan or specific printer attribution."
