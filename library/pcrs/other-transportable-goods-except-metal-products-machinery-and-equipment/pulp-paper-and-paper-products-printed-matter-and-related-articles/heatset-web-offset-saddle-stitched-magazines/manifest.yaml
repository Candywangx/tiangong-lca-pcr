review_metadata:
  methodology_review: "Authored and independently checked for declared physical/reference/source/identity consistency; scientific review and mapping acceptance remain external decisions. No published factory quantities, recipes, emission factors or generic efficiencies are asserted."
  scope_decision: "Retain this canonical ID for general-interest print magazines published less than four times a week, within the existing coated-paper wet heatset web-offset and steel-wire saddle-stitch route. CPC 32420 and 32490 are excluded even when manufacture matches. UN CPC 3.0 p150 determines content/frequency; The Week illustrates actual editorial function and weekly print distribution separately from PGM route evidence. No common printer job or factory quantities are asserted. Scientific and independent scope/translation review remain pending."
  unresolved_flow_identities:
    - row_id: "process_free_plate"
      selected_flow: "Coated thermal process-free aluminium offset printing plate"
      issue: "Purchased complete coated plate, thermal imaging on site. Bare grained aluminium substrate is not the plate. Preserve plate manufacture/coating upstream and collect actual coating retention/transfer destinations using product instructions and plant evidence, without assumed transfer fractions; no separate developer bath."
    - row_id: "fountain_concentrate"
      selected_flow: "Acidified wet-offset fountain-solution concentrate"
      issue: "One purchased concentrate formulation, with supplier dilution instructions and actual additive chemistry. Concentrate kg excludes separately purchased dilution water and IPA; purchased premix water/IPA must not be counted again. Regular working fountain solution is not proof of concentrate identity."
    - row_id: "blanket_wash"
      selected_flow: "Hydrocarbon-based offset blanket and roller wash formulation"
      issue: "One actual purchased low-volatility wash blend; retain CAS/species, flash point, water fraction, blanket/roller compatibility, evaporation and waste destinations. Inkjet printhead cleaner is incompatible."
    - row_id: "silicone_emulsion"
      selected_flow: "PDMS-based heatset chill-roll silicone emulsion"
      issue: "Conditional actual chill-roll application: collect the complete emulsion grade, polymer CAS, dry-polymer fraction, carrier water, other ingredients and supplier dataset. A primary polysiloxane UUID cannot represent the whole emulsion; no application rate is prescribed."
    - row_id: "spent_fountain"
      selected_flow: "Spent acidified offset fountain solution"
      issue: "Collect spent fountain bath separately with actual alcohol, biocide, ink and water composition; record offsite recipient, not direct freshwater emission."
    - row_id: "spent_wash"
      selected_flow: "Spent hydrocarbon blanket wash liquid"
      issue: "One collected liquid wash stream; record dissolved ink and water, separate from cloth and atmospheric solvent loss; no unrelated process wastewater UUID."
    - row_id: "soiled_wipe"
      selected_flow: "Solvent-and-ink contaminated cotton wiping cloth"
      issue: "One contaminated cotton cloth waste stream with actual retained solvent/ink, route and laundry/reuse status. Do not also put retained liquid into spent_wash."
    - row_id: "pe_trim"
      selected_flow: "Unwashed polyethylene wrapping-film offcuts"
      issue: "Conditional unwashed film offcuts, actual contamination and receiver. A cleaned mechanically recycled material is downstream of this gate and is rejected as the waste exchange."
    - row_id: "spent_silicone"
      selected_flow: "Spent PDMS chill-roll emulsion"
      issue: "Only when actual emulsion is collected as one liquid stream; record concentration and destination, separate from transfer onto paper or water discharge."
    - row_id: "cooling_blowdown"
      selected_flow: "Chiller cooling-water blowdown sent for treatment"
      issue: "Conditional actual cooling-loop blowdown; declare inhibitors, contamination, recipient and treatment. Closed-loop circulation is not discharge. Direct environmental releases need actual pollutant-specific elementary rows."
    - row_id: "maintenance_oil"
      selected_flow: "Actual formulated machine guideway lubricating oil"
      issue: "One actually supplied formulated guideway/felt-pad oil used in the installed printing or stitching equipment. Record supplier/SDS, petroleum or synthetic base, additives, viscosity and actual application/stock changes; obey that machine's instructions. Hohner section 4.1.1 is an equipment example, not an imposed universal grade or interval. Do not substitute a wax/solvent lubricant or infer a dose from operating hours."
    - row_id: "maintenance_grease"
      selected_flow: "Actual formulated high-temperature machine lubricating grease"
      issue: "One actual supplied high-temperature grease for guideways/friction points on the installed equipment. Record base oil, thickener/additives, consistency, supplier grade and weighed application/replenishment. A liquid lubricating-oil UUID is not the complete grease. Equipment instructions establish the need to collect maintenance, not a default recipe, dose or universal brand."
    - row_id: "spent_maintenance_grease"
      selected_flow: "Separately collected spent machine lubricating grease"
      issue: "One actually removed and separately collected used grease stream, with base oil, thickener, contamination and recipient documented. A used liquid-oil identity does not establish complete grease identity. Grease retained on the machine or wiping cloth is not counted again here; absence of a separate collected stream needs recorded applicability evidence."
  identity_conditions:
    - uuid: "a07593ed-90ed-4236-b90d-7a41ec14871c"
      issue: "Full bilingual name/paper-printing route/synonyms and mechanical-material definition support paper printed matter. The separate paper-3D prototyping sentence does not restrict the flow to additive prototypes; it proves no final binding or postal-service unit. Actual completed magazine qualifiers/provider required; CPC32690 and mixed-topic comment require source clarification, not a magazine-specific background."
    - uuid: "e64eb06c-6dc9-45f1-b003-3dc6c44b27e2"
      issue: "Physical PE-film name/CAS9002-88-4/comment agree; CPC29220 mismatch remains. Confirm actual grade and supplier."
    - uuid: "4f19ca0e-7b3b-11dd-ad8b-0800200c9a66"
      issue: "Volume/m3 compressed pipeline-delivered consumption supply. Full name/route/comment do not fix methane purity/pressure; CAS74-82-8 and CH4 synonyms remain source-definition ambiguity, never methane fraction/density. Confirm actual composition, T/P/Z/wet-dry/provider m3 and supply-processing compatibility."
    - uuid: "3d76981f-964a-4865-b588-0e067a2a1163"
      issue: "Medium voltage 1-35kV customer-side grid electricity and Net calorific value/MJ; actual voltage/geographic background required."
    - uuid: "38e48719-f415-4f0f-a3e7-2893d2fbaffd"
      issue: "Broad solvent flat-printing identity used separately for each actual heatset CMYK formulation; provider route, kg product basis and composition must be confirmed."
    - uuid: "62bb3717-f62c-43e0-baca-46a1e6f847c4"
      issue: "Broad non-alloy steel wire, not fixed coated stitch-wire background. Actual coating/diameter/alloy and supplier compatibility required."
    - uuid: "dd9f2248-bc28-43b9-8d57-d77756754f4d"
      issue: "Cotton fabric/woven-cotton names establish manufactured-cloth identity; raw-cotton CPC01921 and fibre-composition prose need source clarification. Actual finished fabric, finishing and supplier background required; water-treatment-only f8292 was rejected."
    - uuid: "4f197bec-7b3b-11dd-ad8b-0800200c9a66"
      issue: "Only actual corrugated boxes matching source 16.6% primary/83.4% recycled fibre and supplier technology/basis. Otherwise unresolved box identity; source fractions are not a default recipe."
    - uuid: "3a8411b6-e476-4f98-9d77-0d492661a07f"
      issue: "Native supply mix is Hong Kong water-treatment plant, Volume/m3. Verify actual geographic/treatment/provider compatibility and measured density; no reuse of its nonreference screening mass coefficient as universal density."
    - uuid: "a4a75541-e156-4e30-947c-ba067a682afd"
      issue: "Native production mix is China. Actual IPA grade/purity and production/provider/geography must be compatible; purchased formulation mass and active species separately recorded."
    - uuid: "a7c886ee-6447-4af3-89ea-ed0828fb115c"
      issue: "Actual segregated steel fabrication wire offcuts/rejected staples to recycling; alloy/coating/contamination/recipient required. Native welding example and 5% estimate are not process or quantity defaults."
    - uuid: "55d93375-7f04-4166-b2a2-88ce929051a5"
      issue: "Collected used petroleum-based or synthetic lubricating oil, at generation; not complete grease or an oil-contaminated cloth. Actual composition/recipient and disjoint retention are required."
    - uuid: "210b4222-adda-4097-9e79-f2c9a6c172e4"
      issue: "Generic named R134a Product/Mass/kg; no ship/charging route restriction and no native CAS/purity/phase. Installed nameplate/SDS/certificate must independently establish R134a CAS811-97-2, actual supplied purity/state and kg/provider compatibility. No inferred installation or leakage default."
  dataset_readiness: "Identity audit is not an actual site dataset. Required material formulations, solvent species, capture/bypass/abatement monitoring, NO/NO2 quantity basis, particle-size completeness and backgrounds are collected for each dataset; unresolved actual fields prohibit a complete dataset claim."
  mapping_candidates: "CPC 3.0 32410 only, narrower physical-route subset with actual general-interest issue/readership/purpose and frequency evidence. No positive applicability to CPC 32420 or 32490. Shared mapping replacement and independent acceptance remain controller-owned; current mapping decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs."
