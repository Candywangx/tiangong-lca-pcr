allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Maintain the unallocated whole-mass/element, reactive-component and enthalpy accounts defined in physical_balances independently from the allocated environmental-burden ledger. Stage metering and subdivision take priority: exclusive pulp burdens stay with pulp; shared utilities/treatment are assigned by measured physical demand or causal pollutant load with documented residuals and uncertainty. Internal recovered heat/fibre is reuse, not a co-product credit. This scope has one market pulp output and no external heat sale. If a useful external co-product actually occurs, first establish its identity, output amount and separation step, then review a physical relationship or justified economic allocation and sensitivity; do not silently treat it as waste. No universal economic/mass share or avoided-product credit is set. Never multiply the physical co-product output or either endpoint of an internal link by a burden-allocation share. Supplier wood co-product allocation is inherited and disclosed, not assumed zero. These are foreground accounting requirements, not source-derived numerical coefficients."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "ctmp"
      flow_role: "accepted pulp"
      record_type: "foreground collection"
      raw_fields: "batch; net wet bale mass; dry fraction d; sample method; grade; stock change"
      collection_method: "Calibrated net weighing and representative solid-pulp dry matter testing; exclude wrapping/wire, record volatile-solids limitation and lot sampling."
      unit: "kg; fraction"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_chips
      process_id: "ctmp"
      flow_role: "chips"
      record_type: "foreground collection"
      raw_fields: "species; origin; wet/dry mass; solid/bulk volume; packing; bark; supplier reference convention; transport"
      collection_method: "Weigh receipts, sample moisture and measure volume in declared state; obtain supplier solid/bulk reference and loss boundary."
      unit: "kg; m3"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_energy
      process_id: "ctmp"
      flow_role: "electricity"
      record_type: "foreground collection"
      raw_fields: "gross kWh; stage submeters; voltage; supply mix; auxiliaries; shared users"
      collection_method: "Read calibrated supply/stage meters synchronously; reconcile transformer and motor losses to the defined supply boundary."
      unit: "kWh; MJ"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_heat
      process_id: "ctmp"
      flow_role: "steam heat"
      record_type: "foreground collection"
      raw_fields: "steam mass; pressure; temperature; quality; condensate return; enthalpies; recovered/used/vented heat; supplier MJ definition"
      collection_method: "Meter incoming/outgoing streams and matched enthalpy states; obtain supplier reference-quantity definition and verified conversion. No generic steam enthalpy."
      unit: "kg; MJ"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_water
      process_id: "ctmp"
      flow_role: "water and internal stock"
      record_type: "foreground collection"
      raw_fields: "make-up water; each stage stock mass/flow and consistency; dissolved solids; density; condensate; final moisture; vapour; water in chips, formulations, wet rejects/sludge and stocks; linked reaction evidence"
      collection_method: "Meter external water and paired internal links; validate consistency with gravimetric samples. Track H2O separately from fibre and total dry matter using physical_balances, including evidenced chemical formation/consumption from cp_chem and, only for included biological treatment, cp_effluent/cp_waste/cp_air. Retain phase transfers and material-bound water; do not infer evaporation from an unexplained residual."
      unit: "kg; m3; fraction"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_chem
      process_id: "ctmp"
      flow_role: "each chemical row"
      record_type: "foreground collection"
      raw_fields: "chemical identity/CAS; supplied mass; actual formulation/composition; concentration/purity; hydration; opening/closing stock; stage charge; supplier basis; peroxide dose, residual and recycle; bleach/decomposition conditions and evidenced reacted extents; pH-adjustment reagents; oxygen and product compositions"
      collection_method: "Reconcile deliveries, calibrated dosing and stocks with certificate assays; separate active substance/carrier water, no double counting recirculated liquor. Retain stage assays and matched reaction/speciation evidence to distinguish peroxide bleaching from decomposition and other actual reactions, including pH adjustment. Evidence each formation/consumption term and oxygen uptake/release with uncertainty; reagent disappearance alone does not fix reaction pathway or extent. No assumed decomposition fraction or recipe."
      unit: "kg; fraction"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_pack
      process_id: "ctmp"
      flow_role: "wrap and wire"
      record_type: "foreground collection"
      raw_fields: "component mass; material/grade/coating; tare; bale count; supplier"
      collection_method: "Weigh each component or trace actual bills and returns; packaging tare excluded from pulp net mass."
      unit: "kg"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_effluent
      process_id: "ctmp"
      flow_role: "each water pollutant and off-site wastewater"
      record_type: "foreground collection"
      raw_fields: "flow; whole wet mass/density at temperature; H2O versus non-water component masses; receiver; untreated/final point; constituent concentrations; test duration; detection limits; treatment scope; actual included biological-treatment substrate, oxygen uptake, biomass, gas, liquid and stock compositions/changes and transformation evidence"
      collection_method: "Pair calibrated flow with representative flow-proportional composite samples and documented lab methods; measure whole wet handover mass or matched effluent density, and H2O component mass/density for direct water-carrier volume. Keep external transfer and final discharge branches separate; TN includes organic N; state censored-result treatment. Only when biological treatment is included, match influent, effluent, oxygen/air, biomass/sludge, gases and stocks to evidenced transformations and uncertainty via cp_waste/cp_air. COD/BOD removal is not a material mass, biomass yield or gas partition."
      unit: "m3; mg/L; kg"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_waste
      process_id: "ctmp"
      flow_role: "each separated waste"
      record_type: "foreground collection"
      raw_fields: "wet mass; dry fraction; composition and relevant elemental fractions; contamination; return/purge; recipient; included treatment biomass production/decay evidence and stock changes"
      collection_method: "Weigh and sample each segregated reject/sludge; document treatment receipts and distinguish internal recycle from external purge. For actual included biological treatment, retain measured biomass/sludge and composition evidence for formation/consumption, distinct from captured fibre; do not assume a biological yield."
      unit: "kg; fraction"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
    - protocol_id: cp_air
      process_id: "ctmp"
      flow_role: "each emitted species and particle interval"
      record_type: "foreground collection"
      raw_fields: "source; species/CAS; carbon origin; humid/dry gas basis; gas flow; concentration; controls; hours; particle diameter; detection limits; actual atmospheric/oxygen supply, uptake/release and exhaust compositions; reaction and included biological-treatment evidence"
      collection_method: "Component-specific source tests or justified site emission models, paired with actual operating/control periods; measure dust intervals and wastewater gases; report gaps rather than generic VOC/CO2 closure. Retain actual inlet/exhaust and dissolved-gas transfer evidence needed for whole-mass/element and reactive-component accounts, including peroxide oxygen release/uptake and actual included biological treatment. Do not infer oxygen demand or gas partition from a closure residual."
      unit: "kg; mg/m3; m3; h"
      frequency: "Each batch/shift; continuous meters and scheduled representative tests"
      temporal_coverage: "Matched full reporting period including startup, shutdown and grade changes"
      site_scope: "Declared CTMP line and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample/lab records; stock reconciliation; supplier definitions; uncertainty"
  calculation_rules:
    - id: cohort_normalization
      applies_to: "all inventory rows"
      rule: "D=sum(m_net,b*d_b) for accepted matched bales; x_i=sum(X_i,attributable)/D. D is kg oven-dry pulp solids. Reference output = 1 kg. Match stock changes and periods; divide sums, never average batch ratios."
      inputs:
        - cp_reference
        - "each linked collection protocol"
      output: "Exchange per 1 kg reference flow"
      source_ids: []
    - id: moisture_and_stock
      applies_to: "cp_reference; cp_water; cp_chips"
      rule: "Solid sample dry fraction d=m_dry/m_wet. For pulp suspension c=m_fibre_dry/m_stock; keep dissolved solids separate. Wet water = wet mass minus measured total dry solids, not wet mass minus fibres alone, only where the actual composition and sampling/drying method support that H2O determination; retain volatile non-water and hydration limitations. These sample identities do not establish conservation through a reactive stage; use physical_balances. D_ADt=900*A_ADt only when the source defines 90% ADt; I_OD=I_ADt/900 for a reported quantity per ADt."
      inputs:
        - cp_reference
        - cp_water
        - cp_chips
      output: "Separate dry fibre, total dry matter, water and ADt convention"
      source_ids:
        - jrc-pulp-paper-bref-2015
        - iso638-dry-matter-scope
        - iso4119-stock-scope
    - id: chemical_quantity
      applies_to: "cp_chem"
      rule: "Active mass = supplied formulation mass * measured active mass fraction; retain carrier water and stocks. Convert to provider reference amount only with matching species, hydration, concentration and actual definition. Reconcile stage peroxide dose, residual/recycle and evidenced bleaching/decomposition extents and actual pH-adjustment chemistry; use measured compositions and actual oxygen uptake/release to support physical_balances formation/consumption terms. No default decomposition fraction, complete-conversion assumption or duplicate purchase for chemically formed water."
      inputs:
        - cp_chem
        - cp_water
        - cp_air
      output: "Measured reagent and background demand; explicit pending where definition missing"
      source_ids: []
    - id: electricity_quantity
      applies_to: "electricity"
      rule: "Electricity MJ=3.6*metered kWh. Reconcile gross intake, stages and auxiliaries; keep heat recovery separate. No default kWh/kg or recovery percentage."
      inputs:
        - cp_energy
      output: "Gross attributable electricity"
      source_ids: []
    - id: heat_account
      applies_to: "steam"
      rule: "Physical net steam heat Q=sum(m_in*h_in)-sum(m_return*h_return)-other documented outgoing enthalpy. Record lost/vented heat and actual recovered/used internal heat at their own boundaries. Provider GCV reference demand requires its documented conversion to this physical account; no Q=GCV assumption, no subtraction from electrical MJ, no simultaneous avoided-heat credit."
      inputs:
        - cp_heat
        - cp_energy
      output: "Physical enthalpy ledger and separately compatible provider quantity"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: effluent_load
      applies_to: "cod; bod; tss; tn; tp; dtpa_out; ww"
      rule: "Load kg=sum(V_m3,j*C_mg/L,j*0.001) for matched flow/samples. Use actual final emission point or external handover, not both for the same treatment branch. Keep COD/BOD/TSS/TN/TP and constituent species as different indicators with overlap disclosed, not summed material masses. For ww these loads characterise composition, not the whole wet liquid exchange; freshwater_out is water-component volume, not a pollutant load."
      inputs:
        - cp_effluent
      output: "Receiver-specific measured pollutant loads"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: wastewater_native_quantity
      applies_to: "ww"
      rule: "X_ww=sum(V_handover,j*rho_effluent,j) or measured whole wet mass at the same temperature/state; x_ww=X_ww/D. Retain stock-adjusted liquid volume and constituent loads separately. No fixed density, dry-basis substitution or duplicate treatment branch."
      inputs:
        - cp_effluent
        - cp_water
      output: "kg wet wastewater per kg oven-dry pulp"
      source_ids: []
    - id: freshwater_carrier_quantity
      applies_to: "freshwater_out"
      rule: "m_H2O=sum(m_final_effluent,j*w_H2O,j) from actual composition or an equivalent verified H2O account under physical_balances including evidenced reaction formation/consumption; V_H2O=sum(m_H2O,j/rho_H2O(T_j)); x_H2O=V_H2O/D. Measured density/water fractions and stocks, liquid versus vapour and actual freshwater receiver required; external transfer treatment branch excluded. Unknown reaction terms cannot be closed by adjusting discharge water."
      inputs:
        - cp_effluent
        - cp_water
        - cp_chem
        - cp_waste
        - cp_air
      output: "m3 liquid H2O per kg oven-dry pulp"
      source_ids: []
    - id: dust_intervals
      applies_to: "pmfine; pmmid; pmcoarse"
      rule: "fine=PM2.5; middle=PM10-PM2.5; coarse=total emitted PM-PM10, only for matched source/time/diameter methods. Negative differences invalidate the split. Unknown size distribution blocks a complete interval inventory; never add nested PM totals."
      inputs:
        - cp_air
      output: "Three disjoint particle intervals"
      source_ids: []
    - id: physical_balances
      applies_to: "ctmp"
      rule: "At each stage and for the aggregate boundary/period, conserve whole mass and each actual element (C/Na/S/O/H and other elements present): opening + inputs = closing + outputs, with all wet streams, material-bound water, atmospheric/oxygen and exhaust exchanges included. Count measured losses as physical outputs once; disclose signed unexplained residuals and measurement uncertainty separately. For H2O, fibre and other reactive dry species/components use opening + inputs + evidenced formation = closing + outputs + evidenced consumption; these quantities are not individually conserved through reactions. Derive reaction terms only from actual formulation, peroxide dose/residual/recycle, evidenced bleaching versus decomposition and pH-adjustment extents, oxygen uptake/release and measured reactant/product compositions; cross-check mass/element totals. Include biological substrate/biomass/gas transformations only for actual included treatment, using its measured streams, stocks, compositions and evidenced extents; no assumed biological yield. Distinguish dissolution/phase transfer from chemical transformation and do not add internal formation/consumption as external exchanges. Reconcile wood organics in effluent, captured fibres and transformed components. Internal link endpoints match. Track carbon by measured mass/elemental fractions and actual species; C_CO2=(12/44)*CO2, C_CH4=(12/16)*CH4. Keep biogenic/fossil origin distinct. Unknown chemistry remains a disclosed gap; no forced closure, assumed peroxide decomposition fraction or CO2/gas partition."
      inputs:
        - cp_reference
        - cp_chips
        - cp_water
        - cp_chem
        - cp_waste
        - cp_effluent
        - cp_air
      output: "Separate conserved mass/element and reactive-component accounts; signed residuals, reaction evidence gaps and uncertainty"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: burden_assignment
      applies_to: "ctmp"
      rule: "B_pulp=B_exclusive+sum(a_pulp,k*B_shared,k), with each a based on measured causal demand and documented denominator. Retain unallocated physical outputs and separately report allocated burdens. No numerical shares or credit are predefined."
      inputs:
        - "stage meters"
        - "shared-service records"
      output: "Separate allocated environmental-burden account"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "One physical/chemical exchange; verified identity distinct from supplier amount compatibility; hard route/CAS contradictions reject use"
      evidence: "Supplier grades, assays, flow-property/unit records"
    - id: cohort_quality
      applies_to: "ctmp"
      requirement: "Same accepted dry pulp denominator for all stages and both languages; complete stocks, startup/shutdown and grade coverage"
      evidence: "cp_reference; cp_energy; cp_heat"
    - id: balance_quality
      applies_to: "ctmp"
      requirement: "Reconcile unallocated whole-mass/actual-element and reactive-component accounts under physical_balances, and the separate enthalpy account, against documented measurement and reaction-evidence uncertainty. Water and reactive dry solids require evidenced formation/consumption, not unchanged component conservation. Report residuals and unknown extents explicitly; unresolved evidence prevents a complete balance claim. Do not force closure by adjusting evaporation, effluent, solids, oxygen or CO2; no default peroxide decomposition fraction or biological yield."
      evidence: "cp_reference; cp_chips; cp_water; cp_chem; cp_waste; cp_heat; cp_effluent; cp_air"
    - id: source_limits
      applies_to: "ctmp"
      requirement: "BREF route evidence and indicative multi-grade tables, producer/history cases and standard public scopes retain their stated limits; no universal recipe, factor or compliance claim"
      evidence: "jrc-pulp-paper-bref-2015; rottneros-ctmp-route-2023; valmet-ctmp-bleach-2016"
    - id: missing_quality
      applies_to: "all inventory rows"
      requirement: "Missing UUID, quantity or provider definition remains pending. Report detection limits and uncertainty; neither absence of measurement nor a wastewater-treatment assumption proves zero"
      evidence: "Coverage matrix and primary records"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Verify single Na2SO3 CTMP/peroxide route and species; never substitute groundwood, TMP, APMP, CMP or NSSC identities."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one reference product output: pulp = 1 kg oven-dry. Keep wet stock and packed pulp within the aggregate unit and internal ledger; packaging is excluded from reference mass."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "All row denominators, protocol aggregation and cohort_normalization use accepted dry solids D. Dry fraction, stock consistency and ADt conventions cannot be interchanged."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm source compartments, species/CAS, reference properties/units, actual chemical grades and background amount definitions before complete dataset linkage. Steam GCV/MJ is pending until its relation to measured enthalpy is evidenced."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "External wastewater transfer and final direct water emissions are alternative accounting branches for each treatment boundary; include on-site treatment chemicals/energy/sludge/gases where operated. Add every actual chemical, lubricant, coating, waste or pollutant as its own atomic row if this minimum inventory does not contain it."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "No boiler or direct-fired-dryer emission is covered by chip/dryer dust rules. Actual combustion/export/recovery requires a reviewed extension; exclude neither biogenic CO2 nor unknown water release on a default zero assumption."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Reject duplicate nested PM, VOC/species or nutrient/species impact accounting; retain overlapping analytical indicators in disclosed separate accounts. Internal links and physical co-product outputs are unchanged by burden allocation."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Verify whole-mass and actual-element conservation separately from H2O/reactive dry-component formation and consumption under physical_balances. Require matched formulation, peroxide dose/residual/recycle, bleach/decomposition and pH-adjustment extent, oxygen/air/exhaust and composition evidence with uncertainty; biological terms apply only to actual included treatment. Preserve measured wet streams, material-bound water, stocks and paired internal links. Missing reaction evidence or unexplained residuals block complete physical-balance claims; reject assumed decomposition fractions, biological yields or forced evaporation/solids/gas closure."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground CTMP manufacturing dataset; later background linkage only with compatible reference amount"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Specified dry bleached softwood CTMP supply to paper/board models, with site quality and quantity compatibility"
  excluded_use: "Complete comparative functional equivalence; other pulp routes/species; universal recipe; unverified supplier linkage; finished paper footprint"
  required_metadata: "All reference qualifiers, source locators, measured cohort/D, background states, allocation, process boundary and flow coverage"
  required_quality_disclosure: "Missing identities and supplier conversions; chemistry/receiver limits; evidenced reaction extents and unresolved terms; measurement uncertainty and signed residual balances; no methodology approval inferred"
  update_trigger: "Species, pretreatment/bleach, dryer/supply, product quality, chemical grade, effluent route, co-product, provider reference or source-method change"
data_sources:
  - id: "jrc-pulp-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Production of Pulp, Paper and Board BREF (2015), https://publications.jrc.ec.europa.eu/repository/bitstream/JRC95678/pp_revised_bref_2015_def.pdf"
    used_for: "§§2.2.2 monitoring;5.1.5–5.1.7 route/chemistry, including peroxide decomposition and pH adjustment (p.497);5.2.2.3 actual treatment context (pp.505–507);5.2.2.4–5.2.2.7 air, sludge and energy;5.3.9 recovered heat; Glossary ADt. Qualitative route/reaction context only; no default doses, reaction extents, biological yields or survey/table factors."
  - id: "rottneros-ctmp-route-2023"
    type: "literature"
    reference: "Rottneros Annual Report 2023, p.23, https://www.rottneros.com/files/Main/15260/3948171/rottneros-ab--annual-report-2023.pdf"
    used_for: "Actual CTMP heated chemical pretreatment, disc refining and dried baled market state, including bleached/unbleached offering. Specific producer; no universal yield or energy claim."
  - id: "valmet-ctmp-bleach-2016"
    type: "literature"
    reference: "Valmet, HC bleaching success at Rottneros (2016-11-02), https://www.valmet.com/insights/articles/pulp/mechanical-pulping/hc-bleaching-success-at-rottneros/"
    used_for: "Historical CTMP washing/high-consistency bleach installation; corroboration only, not recipe, output, improvement percentage or present mill performance."
  - id: "iso638-dry-matter-scope"
    type: "standard"
    reference: "ISO 638-1:2022 official public abstract, https://www.iso.org/standard/83614.html"
    used_for: "Solid-sample dry-matter scope/volatility and slush/saleable-mass exclusions; total dry matter includes dissolved solids. Full laboratory standard not acquired; no conformance claim."
  - id: "iso4119-stock-scope"
    type: "standard"
    reference: "ISO 4119:1995 official public abstract, https://www.iso.org/standard/1493.html"
    used_for: "Aqueous-pulp stock concentration scope and exclusion of saleable slush mass. Full test procedure not acquired; site sampling/calibration records required."
normative_context:
