      applies_to: "foreground_system_boundary"
      rule: "Aggregate receiving, impregnation, refining/reject refining, washing, bleaching, dewatering, flash drying, baling and on-site wastewater treatment when present as one foreground unit. Maintain separately metered stages and physical links. Internally reused steam, pulp, filtrate and recovered fibres are not extra purchased inputs or a second saleable pulp output. Drying here is indirect steam-heated air/steam drying; on-site fuel-fired boilers, direct-fired dryers, chemical recovery and exported heat require a separately reviewed extension with atomic fuels, combustion emissions and supply/output identities. They cannot disappear from a dataset that actually operates them. Heat generation outside this declared foreground stays in the linked provider. Incoming transport must be covered once in supplier/upstream service data with measured route/load/distance, not silently omitted. [jrc-pulp-paper-bref-2015, §§5.1.5,5.2.2.7,5.3.9.]"
