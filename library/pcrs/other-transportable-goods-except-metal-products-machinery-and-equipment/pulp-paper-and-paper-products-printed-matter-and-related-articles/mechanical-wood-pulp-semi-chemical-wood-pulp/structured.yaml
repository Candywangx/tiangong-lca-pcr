  source_sha256: "sha256:b5cb951f1c719b6cb016d8218b436b5e73af2d4031bb3a67d01f7fb9928d1ceb"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5991"
      family: "system_boundary"
      span:
        start:
          offset: 5991
          line: 61
