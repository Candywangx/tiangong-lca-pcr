review_metadata:
  independent_scientific_review: Pending independent scientific review of the repaired whole-mass/element and reactive-component accounting. The narrower softwood sodium-sulphite CTMP, downstream peroxide bleaching and indirect-steam flash-dried bale route retains explicit identity, quantity and provider debts. No scientific, publication or classification approval is established.
  boundary_decision: Softwood Na2SO3 CTMP with downstream peroxide bleaching and flash-dried bales. CPC 32113 is broader than this methodology; the mapping is narrower. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate.
  unresolved_flow_uuids:
    - row_id: silicate
      reason: Sodium silicate aqueous solution for peroxide stabilisation, specified Na2O/SiO2 ratio and solids. The candidate describes solution but also >99.5% purity; delivered-solution versus dry-solute mass remains unresolved. No UUID is adopted until formula, modulus, concentration and supplier quantity agree.
    - row_id: tss
      reason: No exact freshwater TSS identity confirmed; unspecified-water TSS rejected for this known receiving subcompartment. Keep dry suspended residue and site lab method specific.
  quantity_background_compatibility_pending:
    - row_id: chips
      reason: Volume/m3 has no solid/bulk convention; require measured packing, state and provider reference quantity.
    - row_id: pulp
      reason: Physical CTMP identity confirmed; Mass/kg does not specify oven-dry versus saleable mass. Require background and supplier reference state before a completed link.
    - row_id: steam
      reason: GCV/MJ identity lacks delivered net-enthalpy definition. Require supplier reference and measured enthalpy/condensate account; no automatic net/GCV equivalence.
    - row_id: peroxide
      reason: Broad H2O2 identity, concentration and supplier kg solution/active basis must be collected.
  source_metadata_limitations:
    - row_id: wire
      reason: Record name/comment supports baling wire for paper; isolated classification 42946 is fencing wire. Verify actual wire composition, coating and supply route; source taxonomy clarification remains owed.
    - row_id: dtpa
      reason: Official Chinese baseName 二乙基三胺五乙酸 is preserved verbatim; physical species governed by CAS67-43-6/name/comment; actual acid versus pentasodium salt and quantity must agree.
    - row_id: cod
      reason: Direct record provides no Chinese baseName. Canonical English retained and absence explicitly documented in Chinese description; descriptive Chinese gloss is not claimed as official name.
    - row_id: naoh
      reason: Raw CAS field is absent. English/Chinese names, NaOH formula and comment agree; source 95–98% grade retained. No verified CAS-field claim. Supplier grade, assay and reference quantity remain required.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  qualified_flow_identities:
    - rows:
        - rejects
      uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
      limits: Actual externally purged coarse fibres/shives, with separate measured wet and dry solids, chemicals, mineral contamination and recipient. Internal reject refining is not an exchange. No sludge blend or clean-wood/municipal identity.
    - rows:
        - primary_sludge
        - bio_sludge
      uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
      limits: Actual primary fibrous/inorganic CTMP wastewater sludge and excess biological sludge remain separate measured streams. The source explicitly includes industrial wastewater-treatment sludge. Record each wet dispatch, dry solids, water, chemicals, carbon, stocks and receiver/provider basis. The paper-production-only b48 record does not establish independent CTMP pulp-mill origin. No assumed composition, treatment or credit.
    - rows:
        - ww
      uuid: bdfc32cf-8028-40a8-a2e4-2d73422ece34
      limits: Actual untreated CTMP washing/bleaching wastewater handed to external treatment only. The broad industrial liquid-waste record includes wastewater. Native Mass/kg requires measured wet handover mass or measured volume times actual effluent density. Composition and receiver/provider compatibility remain pending. The same external handover cannot also produce direct foreground freshwater outputs.
    - rows:
        - phosphoric
      uuid: d0671bdc-bd18-4089-bac0-7d4058782ae8
      limits: Conditional actual as-supplied 85% aqueous H3PO4, CAS7664-38-2, with compatible source two-step thermal route and at-plant gate. The 85% grade limits identity; it is not a default dose, concentration or nutrient ratio. Verify provider wet/dry basis. Other actual supply needs a compatible identity. No duplicate pure-acid or carrier-water purchase.
    - rows:
        - wrap
      uuid: 936bdcb2-06b6-4ee9-8e7c-2f7762aba298
      limits: Actual external uncoated kraft wrapping sheet, with measured grammage, fibre blend, moisture and supplier grade/gate. Broad uncoated packaging-paper physical identity is compatible. CPC32129 woodfree graphic-paper classification conflicts with the packaging name; source/provider clarification remains pending. No exact kraft recipe/background claim, paper bag, wet web or second own-pulp output.
    - rows:
        - freshwater_out
      uuid: 5e50fc01-19c6-4377-a1cc-bc65a12498ea
      limits: Conditional actual liquid H2O carrier after on-site foreground treatment, emitted to the declared freshwater receiver. Native Volume/m3, CAS7732-18-5 and freshwater medium verified. Measure water-component mass and density at discharge temperature; do not assume mixed effluent is pure water. Keep liquid water, vapour, resource uptake and pollutant indicators separate. Exclude the same external wastewater-treatment branch.
  historical_gap_review: Original eight gap decisions, author queries/direct reads and source evidence remain in immutable intake and the original controller audit. Fresh bounded queries support separately qualified industrial solid/liquid waste, uncoated packaging paper and conditional 85% aqueous phosphoric acid. Physical locators are not exact recipes or background compatibility. The paper-production-only b48 origin is unresolved. Sodium-silicate species/modulus and solution versus >99.5% assay basis, and known-freshwater TSS identity, remain gaps.
  source_flow_classification_review:
    - row_id: wire
      uuid: 56ddb6db-1bf1-4c3c-b3db-bb00063774a8
      conflict: CPC42946 fencing wire versus baling-wire name/comment explicitly including paper.
      disposition: Retain qualified actual baling-wire physical identity. Source/provider classification clarification remains pending; no silent source rewrite or claim that all metadata is verified.
    - row_id: wrap
      uuid: 936bdcb2-06b6-4ee9-8e7c-2f7762aba298
      conflict: CPC32129 woodfree graphic paper versus uncoated packaging-paper names/synonyms.
      disposition: Retain the conditional broad physical locator for an actual external uncoated kraft sheet. Fibre blend, state, grammage, supplier gate and source classification clarification remain pending. No bag, own-pulp or coated/laminated substitution.
  provider_limits:
    - CN source medium-voltage electricity is 1–35kV at the user. Actual region, year, mix, voltage and delivery/loss gate compatibility remain pending.
    - DTPA official Chinese 二乙基三胺五乙酸 is preserved as source metadata. The correct chemical description is 二乙烯三胺五乙酸, CAS67-43-6 acid. Source/provider naming clarification and actual acid grade compatibility remain pending.
    - Steam GCV is not automatically net delivered enthalpy; chip volume is not automatically solid/bulk volume or mass; pulp Mass/kg is not automatically oven-dry, air-dry or wet mass. Original quantity/provider gaps remain.
    - Conditional 85% H3PO4 whole aqueous grade and two-step thermal route require compatible actual supply. No default recipe/nutrient dose or duplicate pure acid/carrier water.
    - Waste liquid native Mass/kg is actual wet transfer mass or measured volume times effluent density. Final freshwater H2O native Volume/m3 is a separate measured water component. External treatment and direct final outputs are mutually exclusive for the same actual branch.
    - Three industrial Waste solid rows retain distinct primary fibrous sludge, excess biological sludge and chemically contaminated coarse rejects, each with transport water, dry solids, carbon, stocks and provider/receiver records. No composition/treatment merge or credit.
  audit_summary:
    inventory_rows: 37
    searched_inventory_rows: 37
    adopted_uuid_rows: 35
    distinct_uuid_count: 33
    elementary_rows: 17
    identity_gaps: 2
    meaning: Qualified physical locators only. Actual site/background quantities, composition and compatibility remain pending. The water lead was independently confirmed by a successful own 100-result query and state-100 direct read; earlier top-20 omissions are preserved.
  physical_water_carrier_extension: One conditional final freshwater H2O Volume/m3 output extends the already declared on-site treatment branch. No new production or treatment route. Native CAS7732-18-5 and freshwater medium verified; actual water fraction and density required. No whole-effluent, vapour, resource or external-treatment double count.
  classification_mapping_authority: Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate.
