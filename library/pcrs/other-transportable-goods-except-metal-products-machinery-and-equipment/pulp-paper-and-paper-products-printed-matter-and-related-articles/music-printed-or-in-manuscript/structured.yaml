  classification_refs: "CPC 3.0 32520; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "Complete self-covered uncoated paper musical-score booklets with black dry toner and steel saddle staples, accepted for notation reading."
  excluded_products: "Prose/music-study books without the selected score identity; directories; advertising/catalogues; digital/manuscript/loose/folio products; other substrates, print routes, colours and binding constructions; publishing, retail, licensing, distribution and performance services."
  representative_product: "One job/design of a monochrome self-covered saddle-stitched paper rehearsal/performance score booklet."
  production_route: "File checking/imposition → dry electrostatic image transfer → oil-less belt fusing → gather/fold → saddle staple → face trim/inspect → pack."
  market_state: "Newly first-quality-released complete score at printer gate; packaging excluded from net score mass."
functional_unit:
  what: "Supply the actual musical composition in a complete paper notation booklet for rehearsal/performance reading."
  how_much: "1 kg net accepted complete score booklets of one design and construction."
  how_well: "Correct notation, page sequence/completeness, legibility at declared music size, toner adhesion, fold/staple security, safe staple closure and design-specific opening/page-turning acceptance; no universal lay-flat or durability claim."
  how_long_or_cycle: "One manufacturing lot at first quality release; no prescribed use life, performance count, practice duration or replacement interval."
  reference_flow_link: "finished_score"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "score manufacture"
      rule: "Include file preparation/imposition, setup/test sheets, dry toner transfer/fusing, gathering/folding, saddle stitching, trimming, quality acceptance, packing and attributable extraction, ventilation, maintenance and utility activity. No plate/fountain/offset wash, EVA glue or sewing thread is prescribed in this construction. Verify their absence in the actual job."
      source_ids:
        - ricoh-dry-toner-2019
        - songburd-score-options
    - rule_id: b_classification
      applies_to: "applicability"
      rule: "Verify actual musical-composition notation and intended reading/distribution independently of format. Keep manuscripts, electronic text and other physical constructions outside this route. Printed music rights are a declared applicability fact, not a licence-service inventory or an environmental allocation driver."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: b_stage
      applies_to: "each physical state j and stage"
      rule: "Retain opening_j + external_receipts_j + internal_in_j + actual_formation_j = closing_j + external_dispatch_j + internal_out_j + actual_consumption_j. Attach separately measured waste/release legs to their own states. Transformation consumes input states and forms distinct output states with component/mass closure; it never creates material. Same-state store transfers are internal links, neither external receipts nor formation. Matched internal_out/internal_in cancel when aggregating the plant."
      source_ids:
        - ricoh-dry-toner-2019
    - rule_id: b_gate
      applies_to: "providers and releases"
      rule: "Include actual input production/delivery and transferred waste treatment once through compatible backgrounds. Indoor concentration or a device chamber rate is not an outdoor elementary exchange; assess ventilation/outlet transfer and controls. Captured dust and cartridge residues are waste, not emitted toner. No electricity-provider emission is re-added as a factory emission."
      source_ids:
        - dguv-laser-emissions
        - ilcd-allocation-2010
    - rule_id: b_utility_extensions
      applies_to: "actual heat, fuels or additional inputs"
      rule: "The representative printing/fusing route uses electricity. Survey attributable space heat, cooling, transport and maintenance; absence needs records. Any actual fuel, purchased heat, refrigerant, extra formulation or separately transferred waste requires its own atomic row, identity, measurement and compatible provider before the concrete dataset is complete. This survey obligation does not assert that any listed carrier occurs."
      source_ids:
        - ricoh-dry-toner-2019
        - ilcd-allocation-2010
boundary_abstraction:
  declared_starting_condition: "Purchased dry unprinted uncoated paper, finished dry black toner and steel staple supplies at printer reception; electronic print file is the information input."
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "The selected physical notated score booklet subset of CPC 3.0 32520 only; no whole-leaf or other-category coverage claim."
  recursive_input_rule: "Purchased complete printed scores and returned accepted same items retain upstream/cohort vectors; disclose resale/rework separately. They are not newly manufactured raw paper and cannot create another first-release output or a zero-burden recursion cut."
  upstream_dataset_requirement: "Match actual paper manufacture, complete toner/staple manufacture, electricity, conditional maintenance inputs and each package provider by grade, state, quantity, geography/year and boundary; include delivery/treatment once."
  disclosure: "Declare exact job/site/period, gate, outsourcing, maintenance/infrastructure choices, foreground versus background ownership, species and media, inventories, allocation, uncertainties and specific gaps; downstream sales/distribution/use/end of life outside this gate."
