allocation_rules:
  - rule_id: a_framework
    applies_to: "modelling framework"
    rule: "Declare attributional modelling and why subdivision/allocation is appropriate to the study decision context. ILCD §§7.9.2–7.9.3 support the hierarchy used here; this does not claim full ILCD conformity or silently select substitution for a consequential study."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_subdivide
    applies_to: "every shared exchange"
    rule: "First use job/stage-specific measured records or justified virtual subdivision. Direct paper, toner and staples follow actual use and losses by design/cohort. Retain setup, rejected output, idle, warm-up and cleanup burdens; do not allocate them away as zero output."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_causal
    applies_to: "remaining shared loads"
    rule: "Determine exchange-specific physical causality with evidence, not a universal sales/mass/page key: machine runtime only for comparable service intensity, measured fuser/engine activity for electric consumption, actual occupied area/volume × duration for shared storage/space services, actual limiting mass/volume × distance for transport. Document each numerator, all co-functions in the denominator, units and sensitivity; unsupported drivers remain pending review."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "irreducible shared process burdens"
    rule: "Only after documenting unavailable subdivision and determining physical causality, consider consistent representative process-gate economic values for the actual co-functions/conditions, in a common currency/period and with justified quantity basis. Missing values, zero denominators, mixed product/service conditions or negative/gate-fee values require an explicit reviewed method and sensitivity; do not use max(value,0), invent prices or force a share. Without valid evidence keep the residual unallocated and the affected dataset incomplete."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_vectors
    applies_to: "physical V and burden A"
    rule: "Preserve unallocated physical vector V for every exchange and state balance. Assign only attributable burden vector A exchange by exchange; retain each original cohort's inherited vector and actual added service vector separately. Physical goods/waste masses do not shrink by environmental-load shares. All assigned shares plus explicitly pending residual equal the original burden, with no provider/component double counting."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_release_cohort
    applies_to: "first release and later services"
    rule: "Qc is the immutable measured net first-release kg of cohort c; Q is the newly first-released lot's Qc, not current sales. Determine Qc from unique first-release events; reconcile subsequent movements with c_release_stock_bridge, never an unconditional dispatch-plus-closing identity. Opening old FG has its previous Qc and vector; genuine same-item returns/re-dispatch/rework do not create Q. Carry the original exchange vector unchanged where the item is unchanged, and assign only actual additional service through its original Qc or a separately justified explicit service method. Do not divide every old-cohort/service exchange by the current new lot's Q. If Q or the relevant Qc is zero/unknown, retain absolute failure/idle/cleanup/service amounts and attribution evidence pending a valid denominator; never divide by zero or silently drop them."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_pack_components
    applies_to: "each packaging component and owner/cohort"
    rule: "Distinguish P: first external purchase, including a component contained in a purchased whole-pack price without a separate invoice; N_ext: genuine first non-purchase external acquisition such as loan, lease, consignment or accompanying goods; ER: actual same-component return with a proven preceding outward movement. An unproven return is not ER. Opening stock and transfers between raw, WIP, new FG, old FG and reusable inventory are not new acquisition. Preserve component owner, acquisition history, remaining stock and inherited exchange vector. Record physical gross dispatch, owner return and waste separately, and each actual transport leg; do not net legs."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_pack_burdens
    applies_to: "packaging backgrounds and reuse"
    rule: "Assign whole-container or component-manufacture/provider burden once, with documented exclusive ownership. A free/loaned component is not zero burden; use evidenced inherited burdens or explicitly reviewed supplier rental/reuse service scope. Existing reusable components retain original vectors and actual repair/wash/transport increments; do not invent lifetime/cycles or recharge new manufacture on every return. If a whole-container provider already includes components or return logistics, do not add them again. Missing previous burdens/lifetime/service allocation remains a specific gap."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_recovery
    applies_to: "exported wastes"
    rule: "Disclose actual legal/economic state, receiver and treatment boundary for each stream. A sale, free transfer or gate fee alone establishes neither co-product status nor an avoided virgin-material credit. No default recycling/substitution credit here; any such model requires separately justified recycling/true-joint-process evidence and consistent boundary ownership. Sections 7.9.2–7.9.3 alone do not supply an arbitrary recycling factor or zero-value clipping rule."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "score_manufacture"
      flow_role: "new score reference and cohort ledger"
      record_type: "future measured foreground record"
      raw_fields: "title/design; notated content and purpose; rights declaration; page/sheet/copy count; construction; acceptance record/time; net lot kg; measured sample copy mass and uncertainty; moisture; packaging tare; cohort c and Qc; opening/closing new-old FG; gross dispatch; actual same-item return ID; prior outward ID; rework; added service ; post-release waste/loss; disjoint repair stocks; other gross transfers; measured material/water state changes"
      collection_method: "Weigh complete first-quality-released scores on calibrated scales excluding packs. Count-to-mass requires same-design measured representative net copy mass and reconciliation to lot weighing. Record every first-release identity exactly once; separately trace old FG, same-item returns and later work."
      unit: "kg; copies"
      frequency: "each first release and every subsequent movement"
      temporal_coverage: "full declared lot/reporting period and linked original cohort history"
      site_scope: "actual job/site and declared outsourced stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original release sheets; matched warehouse/dispatch/return records; sampling and moisture evidence"
    - protocol_id: cp_material
      process_id: "score_manufacture"
      flow_role: "each paper/toner/staple and conditional cleaning input"
      record_type: "future measured foreground record"
      raw_fields: "item/SKU; stage/job/cohort/owner; supplier and provider scope; current SDS/full composition; CAS; supplied versus component basis; concentration/purity; paper grade/furnish/grammage/moisture; staple coating/form; measured gross/tare/net mass; opening/closing raw/WIP; external receipt; internal_in/out; actual formation/consumption; retention; waste; formulation/carrier ownership"
      collection_method: "Weigh receipts/issues/returns and state stocks with calibrated instruments. Measure actual toner/paper/staple use, not cartridge yield, nominal grammage or assumed staple mass. Reconcile supplied formulation and analytical component mass without a second provider charge. Record any actual extra maintenance part/chemical/cartridge/filter individually before completeness."
      unit: "kg"
      frequency: "each job/material/grade change and stock closure"
      temporal_coverage: "complete lot including failed setup and cleanup"
      site_scope: "actual site/stages and verified suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; calibrated stock/issue records; complete supplier disclosures; assays; stage balances"
    - protocol_id: cp_utility
      process_id: "score_manufacture"
      flow_role: "electricity and conditional supplied water"
      record_type: "future measured foreground record"
      raw_fields: "device/stage/job; electric meter start/end; kWh; voltage; grid/geography/year/provider; time in setup/fuse/finishing/idle/cleanup; water source/treatment; meter volume; actual density/temperature; included carrier water; common-service pool and driver denominator; heat/fuel survey"
      collection_method: "Use calibrated submeters and reconcile full-period bills. Separate direct and shared services and retain all operating states. Water volume conversion needs measured compatible density; no default m3-to-kg. Record actual fuel/heat/refrigerant occurrence separately and add atomic cards/providers before modelling an expanded actual site scope."
      unit: "kWh; MJ; kg; m3"
      frequency: "each job/stage interval and bill/stock closure"
      temporal_coverage: "full representative lot/period including nonproduction states"
      site_scope: "actual printer, finishing, attributable utilities and space services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; tariff/provider boundary; water source; activity records; causal assignment"
    - protocol_id: cp_pack
      process_id: "score_manufacture"
      flow_role: "each corrugated box, PE film and wooden pallet"
      record_type: "future measured component ledger"
      raw_fields: "component ID/material/grade; owner; cohort c; acquisition/previous outward IDs; P; N_ext; ER; whole-pack inclusion; prior exchange vector; open/close raw/WIP/new-old-FG/reusable stock; internal_in/out; packaging use; gross dispatch; owner-return; waste; repair/wash; actual mass/distance/load by transport leg; provider scope/cost basis"
      collection_method: "Weigh/count each component, match external acquisitions to contracts and bundled purchase records, prove same-item ER against prior outward ID. Place every component in one mutually exclusive stock state at a time. Record embedded packaging with no individual invoice as P if first purchased. Preserve inherited vectors and separate actual new services. Reconcile each gross leg; do not net returns/dispatch or assume free supply is burden-free."
      unit: "kg; items; km; tonne-km"
      frequency: "every acquisition/movement/repair/waste and stock closure"
      temporal_coverage: "declared reporting period plus acquisition/return/cohort history"
      site_scope: "all actual inbound, dispatch and reusable package owners/providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices/contracts; whole-pack bill boundaries; serial/cohort ledgers; scale records; transport and provider records"
    - protocol_id: cp_waste
      process_id: "score_manufacture"
      flow_role: "each separately transferred actual waste"
      record_type: "future measured foreground record"
      raw_fields: "stream/state/bin; job/cohort; whole outgoing net mass; moisture; independent solids/water/organic fractions; retained toner/steel/solvent; receiver and treatment; opening/closing; gross transfers and actual returns; legal/economic state; fee/value evidence"
      collection_method: "Weigh each segregated as-exported stream at handover. For liquid use measured whole wet mass or compatible volume/density/temperature and independent composition; non-water fraction is not automatically dry solids. Separate collected powder, cartridge/filter assemblies, paper rejects and actual separated metal. Do not count the same retained constituents twice."
      unit: "kg; m3"
      frequency: "each collection/handover and closure"
      temporal_coverage: "entire lot/period including maintenance/upsets"
      site_scope: "actual site/receiver boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weighing/assays; receiver acceptance; legal transfer; stocks and treatment boundary"
    - protocol_id: cp_air
      process_id: "score_manufacture"
      flow_role: "each actual outdoor species/particle bin/water vapour"
      record_type: "future measured foreground record"
      raw_fields: "source/device/job; toner/material survey; CAS; outlet and inlet flow/concentration; T/P/humidity; dry/wet/normal basis; sampling duration; operating phase; control/decay/capture; species calibration/recovery/LOD; disjoint PM cuts and mass/number distinction; humidity/condensate; uncertainty"
      collection_method: "Survey actual print/fuse, toner replacement, trim, cleanup and maintenance states. Use competent calibrated species-specific methods validated for the actual matrix and outlet, and measured ventilation transfer. Integrate matched outlet/inlet mass on consistent bases; inspect reaction/storage/condensation rather than using an unexplained residual as a species. Chamber thresholds, indoor observations and particle numbers do not establish outdoor kg."
      unit: "kg; mg/m3; m3/time"
      frequency: "representative surveys and integrated actual operating intervals"
      temporal_coverage: "declared lot/period including setup, routine, maintenance and upset states"
      site_scope: "actual outdoor outlets after controls; indoor evidence separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory method validation; calibration/recovery/LOD; air balance; operating and control logs"
    - protocol_id: cp_assignment
      process_id: "score_manufacture"
      flow_role: "separate V and A ledgers"
      record_type: "future measured and reviewed assignment record"
      raw_fields: "exchange ID; original cohort/Qc; physical V; inherited vector; direct A; residual shared pool; driver/unit/all co-functions; market-gate values/currency/period; zero/negative/missing cases; additional service; provider included components; assignment sensitivity"
      collection_method: "Implement Section 7 exchange by exchange. Preserve physical balances before assignment and prove assigned burden plus explicit residual equals source burden. Retain original vectors and current service increments separately; justify any change in provider or service methodology. Missing/negative economic bases are reviewed, not clipped."
      unit: "native exchange units; kg basis; common currency where justified"
      frequency: "each pool/cohort/provider/method change and reporting closure"
      temporal_coverage: "current activity plus original cohorts"
      site_scope: "actual shared processes and all co-functions in each denominator"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "physical/causal evidence; economic originals if used; conservation audit; explicit unresolved cases"
  calculation_rules:
    - id: c_reference
      applies_to: "finished_score"
      rule: "1 kg denotes complete accepted net scores. Qc = measured kg of first-quality-released cohort c; unique first-release event records establish Qc independently of later dispatch, returns, repair and loss. Count conversion uses actual same-design measured mean net mass and accepted count, reconciled to lot weighing; old FG/returns/services add no new Q."
      inputs:
        - cp_release
        - "first-release records"
        - "calibrated mass"
      output: "unique reference production and Qc ledger"
      source_ids:
        - ricoh-dry-toner-2019
    - id: c_release_stock_bridge
      applies_to: "finished_score"
      rule: "Qc is obtained only from unique measured first-quality-release events, not reconstructed from dispatch plus closing FG. For each original cohort and declared observation interval retain the gross physical bridge: opening released FG and disjoint post-release repair stocks + unique first releases within this interval + actual same-item external returns + other actual inward transfers + independently measured material/water gains = closing released FG and disjoint repair stocks + gross dispatch + post-release waste/loss exits + other actual outward transfers + independently measured material/water losses. Preserve original release state/mass, current measured states, item IDs, prior outward links and stock-boundary ownership; cancel internal movement within the included stock set. Returns/re-dispatch, repair or later damage never create or subtract a first-release event. The dispatch-plus-closing shortcut is permissible only after proving all omitted opening, return, loss, transfer and state-change terms are zero and dispatch is not repeated. Missing closure stays unresolved; already-incurred manufacturing and actual subsequent service burdens retain their original cohort Qc.  Every outward/inward movement and material/water state-change term is disjoint: the same measured evaporation, removal or added matter appears once, either in an explicit boundary leg or its corresponding state-change term, never both."
      inputs:
        - cp_release
        - cp_waste
        - cp_material
        - original_release_events
        - gross_stock_movements
        - measured_state_changes
      output: "first_release_and_subsequent_stock_reconciliation"
      source_ids:
        - ilcd-allocation-2010
    - id: c_normalize
      applies_to: "all inventory rows"
      rule: "For a compatible new-lot exchange use measured physical V divided by that lot's positive Q for physical disclosure, and separately assigned A divided by the same Q for the model burden account. Preserve raw values. Old-cohort inherited exchanges and added later services use their original positive Qc or an explicit reviewed service basis, never automatic current-new-Q division. Zero/unknown denominators retain absolute records and require review."
      inputs:
        - cp_release
        - cp_assignment
        - "relevant physical protocol"
      output: "physical and assigned exchange per 1 kg reference flow with cohort provenance"
      source_ids:
        - ilcd-allocation-2010
    - id: c_stage
      applies_to: "each state j"
      rule: "opening_j + external_receipts_j + internal_in_j + actual_formation_j = closing_j + external_dispatch_j + internal_out_j + actual_consumption_j. Trace real input consumption to formed output composition; matched internal legs cancel at plant aggregation. Same-state re-storage forms nothing. Retain measured residual/uncertainty, no forced closure to a named emission."
      inputs:
        - cp_material
        - cp_pack
        - cp_waste
        - cp_air
        - "stage/state records"
      output: "state and component reconciliation"
      source_ids:
        - ricoh-dry-toner-2019
    - id: c_power
      applies_to: "electricity"
      rule: "Metered MJ = actual kWh × 3.6; avoid duplicate whole-engine and fuser submeter totals. Assignment and cohort normalization occur after this exact conversion."
      inputs:
        - cp_utility
        - "compatible meter coverage"
      output: "measured electricity MJ before assignment"
      source_ids:
        - ricoh-dry-toner-2019
    - id: c_heat_extension
      applies_to: "any actual added thermal-service row"
      rule: "Delivered net thermal service = independently integrated supplied mass × supply enthalpy minus independently integrated returned mass × return enthalpy, with explicitly measured leakage/blowdown/condensate, other boundary legs and storage change on the same boundary. Use m(hs−hr) only if supply and return masses match on that boundary and interval. Use actual pressure/state/enthalpy basis; no invented efficiency or fuel-equivalent double count with a complete heat provider."
      inputs:
        - cp_utility
        - "actual separate thermal meters and enthalpy/state records"
      output: "reviewed added thermal-service quantity and boundary residual"
      source_ids:
        - ilcd-allocation-2010
    - id: c_species
      applies_to: "actual outdoor elemental rows"
      rule: "Integrate actual outlet species mass minus matched inlet background on compatible flow/T/P/humidity bases, including controls/reaction/storage as applicable. Keep TVOC response equivalents separate, and cumulative PM and particle number outside the disjoint mass sum. No default species fraction."
      inputs:
        - cp_air
        - "validated species and ventilation methods"
      output: "actual net species kg and measurement uncertainty"
      source_ids:
        - dguv-laser-emissions
    - id: c_pack
      applies_to: "each packaging component"
      rule: "Opening stocks + P + N_ext + proven ER + matched internal_in = closing stocks + gross dispatch + owner-return + waste + matched internal_out, adjusted only for documented real repair/transformation component additions/losses. All stock categories are mutually exclusive. Carry inherited A plus actual service increments; whole-container/component provider burden belongs once."
      inputs:
        - cp_pack
        - cp_assignment
        - "provider ownership"
      output: "component physical ledger and distinct burden vector"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_score
      applies_to: "reference product"
      requirement: "Confirm actual notation/composition and purpose, self-cover, dry monochrome toner, steel spine staples and acceptance including page order, music readability, toner adhesion and page turning. No claimed service-life equality."
      evidence: "actual job file/specification; complete sample; quality-release and rights declaration"
    - id: dq_measure
      applies_to: "all cards"
      requirement: "Replace no unmeasured amount with zero or a manufacturer yield. Collect every actual extra formulation/maintenance/packaging/utility/waste/emission as a separate atomic row before completeness. Unresolved UUID is distinct from measured absence or unavailable provider."
      evidence: "calibrated raw records; full ingredient/utility survey; explicit row gaps"
    - id: dq_identity
      applies_to: "UUID/property/provider"
      requirement: "Verify actual native name/type/form/route/CAS/region/comments, reference property→unit group→unit and actual provider boundary. Broad compatible identities are narrowed by measured grade/state; hard incompatible form/route stays unbound."
      evidence: "direct state100 native record; support chain; supplier specification and provider check"
    - id: dq_cohort
      applies_to: "stocks and normalization"
      requirement: "Preserve first-release identity/Qc, new closing FG, original old-cohort vectors and actual later services. Reject monthly sales as a universal denominator and preserve Q0/idle/failed-job/cleanup absolute burdens."
      evidence: "matched lot/stock/dispatch/return histories; per-exchange vector reconciliation"
    - id: dq_pack
      applies_to: "reusable and dispatch components"
      requirement: "Reconcile purchased bundled P, first non-purchase N_ext and proven same-item ER, each owner/cohort and mutually exclusive stocks; retain gross dispatch, owner-return, waste and actual transport legs. No invented cycles/free-zero assumption."
      evidence: "contracts/invoices; prior outward IDs; component/provider and transport ledger"
    - id: dq_emission
      applies_to: "air/water/solids"
      requirement: "Competent matrix-appropriate methods must distinguish indoor from outdoor, captured dust from airborne mass, particle number from mass, TVOC from species, and wet liquid from non-water/dry solids. Actual added fuel combustion requires its own species/carbon-origin assessment."
      evidence: "laboratory/ventilation/control and stream assays; residual and uncertainty disclosure"
validation_rules:
  - rule_id: v_scope
    applies_to: "application"
    rule: "Require all scope qualifiers and actual notated-score content/purpose. Check the selected dry-toner/self-cover/steel-saddle construction at the stated gate; no whole-CPC-leaf, catalogue/prose-book or electronic-service substitution."
    source_ids:
      - unsd-cpc3-2025
      - songburd-score-options
      - ricoh-dry-toner-2019
  - rule_id: v_reference
    applies_to: "completed reference"
    rule: "Check unique finished_score output, complete net retained-component mass, same denominator and reference chain in both languages. Paper input, shipped gross kg, old FG, returned scores and intermediate sheets cannot redefine Q."
    source_ids:
      - ricoh-dry-toner-2019
  - rule_id: v_states
    applies_to: "material and component accounts"
    rule: "Reconcile b_stage/c_stage and cp_pack with real formation/consumption and matching internal legs, mutually exclusive stock states, measured moisture/contamination and complete gross outward/return/waste transports. Report uncertainty/residuals instead of artificial closure."
    source_ids:
      - ricoh-dry-toner-2019
      - ilcd-allocation-2010
  - rule_id: v_assignment
    applies_to: "all burden pools and cohorts"
    rule: "Verify direct/subdivided then causal then justified residual assignment, complete denominators and vector conservation. Unresolved fee/value/negative-value cases stay pending; no clip-to-zero, default recycling credit or replacement of old inherited vectors by current averages. Q0 and missing Qc retain absolute activity."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_identity
    applies_to: "every actual exchange"
    rule: "Match native identity/property/unit and actual supplier/receiver scope. The toner, conditional cleaner and corrugated-box identity/provider gaps remain explicit; identity success cannot manufacture a recipe or measured amount. Whole formulation/container and component provider ownership must be exclusive."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_emissions
    applies_to: "emissions and waste"
    rule: "Require actual outlet/species/PM-bin and water balances after capture, with validated methods, moisture and units. Never transfer office-device test thresholds/rates to this plant, infer zero from non-detection without method/LOD, sum overlapping PM, or classify every captured toner gram as an air release."
    source_ids:
      - dguv-laser-emissions
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing input for the verified physical score-booklet route with declared gate and cohort provenance after actual foreground collection and review."
  allowed_use: "Complete black dry-toner, self-covered uncoated paper saddle-stapled score manufacture with actual compatible providers, measured quantities and explicit unresolved scope."
  excluded_use: "Whole-leaf/all-printing average; ordinary books/directories/advertising; electronic/licensing/retail/performance services; universal useful-life or repertoire equivalence; alternative printing/binding/substrate route; ready-to-use numerical LCI inferred from UUIDs or catalogue specifications."
  required_metadata: "All reference qualifiers; site/period; first-release/cohort histories; complete paper/toner/staple specifications; actual supplier/receiver and foreground/background boundaries; package component ownership; stock/transport/service and allocation ledgers."
  required_quality_disclosure: "Measurement and sampling uncertainty; species/media/particle coverage; physical residuals; native identity and actual-provider gaps; performed/skipped checks; pending assignments and omitted/out-of-scope stages."
  update_trigger: "Change in score design/acceptance, paper/toner/staple grade, self-cover, print/fuse/binding route, site/provider, packaging ownership/history, emissions control, collection period or assignment method."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "PDF/printed151, 32520 inclusion/distribution and retail/licensing exclusions, with neighbouring pp.148–152 category context; no frequency, process, grade or HS rule adopted."
  - id: "songburd-score-options"
    type: "literature"
    reference: "Songburd Music, Print Options; https://songburdconnect.com/print-options/"
    used_for: "Printing Options, Binding/Saddle Stitch and Black & White sections; actual score configurations only, not proof of the site's dry-toner equipment, self-cover/paper grade, recipe, quantities or lifetime."
  - id: "ricoh-dry-toner-2019"
    type: "literature"
    reference: "Ricoh Canada, Pro8310s/8310/8320s/8320 B&W Production Printer brochure, ©2019; https://assets.ricoh-usa.com/j2jqn9lauv41/28NYDSS6aM8eAFsZX7evnX/0db49e139c4ede5a822cb00156b760a2/pro8310s-8320s-8310-8320.pdf"
    used_for: "PDF3–4 and7–8: uncoated paper, dry electrostatic transfer, oil-less belt fusing, optional saddle stitching/face trim and actual toner supplies; capability/route only. No TEC, nominal toner yield, speed, paper weight or staple/page limits become plant LCI values."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for Life Cycle Assessment—Detailed guidance, first edition March2010; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "§§7.9.2–7.9.3, printed255–272/PDF275–292: attributional context, subdivision, exchange-specific determining physical causality, residual process-gate market value, reuse/recycling limits and 100% conservation. No arbitrary recovery/lifetime factor, fee clipping, or generic waste credit adopted."
  - id: "dguv-laser-emissions"
    type: "official_guidance"
    reference: "DGUV Institute for Occupational Safety and Health (IFA), Safe laser printers—laser copiers; https://www.dguv.de/ifa/praxishilfen/hazardous-substances/laserdrucker-kopierer/index.jsp"
    used_for: "Studies and advice from IFA: dust/ozone/benzene/styrene screening and setup/toner-replacement context. Office-device, indoor and tested-model limits are retained; no industrial outdoor quantity, universal absence, chemical recipe or emission factor inferred."
