allocation_rules:
  - rule_id: a_rework
    applies_to: "recovery"
    rule: "Recovered fit notes are internal rework. Count once in finally accepted mass and retain actual rejected waste separately. Face-value currency is neither product mass nor an environmental allocation driver."
    source_ids:
      - bep-manufacture
      - bep-stewardship
  - rule_id: a_shared
    applies_to: "shared operations"
    rule: "Prefer submetering, batches and separable processes. Allocate shared printing, vault conditioning, wiping and treatment burdens with verified causal drivers such as actual area/coverage, machine time, paper mass or pollutant load where justified. Never assume equal ink formulation/dose across denominations or allocate by banknote monetary value."
    source_ids: []
  - rule_id: a_physical
    applies_to: "co-products and credits"
    rule: "First retain unallocated physical outputs and paper/water/carbon balances. If a real marketable recovered co-product exists, record physical delivery/receiver and selected method, allocate burdens separately and disclose sensitivity. Secure destruction, replacement printing and recycling benefit do not automatically establish avoided burdens or negative emissions."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "p_currency_printing"
      flow_role: "finished notes"
      record_type: "weighing/acceptance"
      raw_fields: "lot; series; paper grade; accepted net mass; packaging tare; count; WIP/rework/reject stocks"
      collection_method: "Calibrated weighing of accepted notes excluding packaging; reconcile serial/QC and stocks without a fixed per-note mass. Aggregation procedure: sum same-period accepted net mass; finished_notes = 1 kg per 1 kg reference flow."
      unit: "kg"
      frequency: "each lot/shift and actual handoff"
      temporal_coverage: "complete named production period including startup/reject/rework"
      site_scope: "route site and actual linked providers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot/source, raw records, SDS/composition, balance residual and provider compatibility"
    - protocol_id: cp_material
      process_id: "p_currency_printing"
