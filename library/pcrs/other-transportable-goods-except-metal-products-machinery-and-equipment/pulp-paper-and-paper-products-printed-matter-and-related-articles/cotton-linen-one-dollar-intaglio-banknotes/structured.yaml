      collection_method: "Individual weighed deliveries/issues and stock reconciliation; preserve whole solution/packing supply with constituent subledgers and compatible actual providers. Aggregation procedure: divide same-period attributable measured row quantity by same-period accepted net note kg, keeping physical and allocated-burden ledgers separate; per 1 kg reference flow."
      unit: "kg"
      frequency: "each lot/shift and actual handoff"
      temporal_coverage: "complete named production period including startup/reject/rework"
