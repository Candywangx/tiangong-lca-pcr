  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide each same-period attributable row quantity by accepted net note kg; finished_notes is 1 kg of the same reference output; missing or zero denominator blocks. Retain physical, concentration and moisture subledgers rather than scaling physical mass by environmental allocation shares."
      inputs:
        - "each cp record"
        - "accepted net mass"
      output: "row reference quantities"
      source_ids: []
    - id: liquid_balance
      applies_to: "spent_wipe; spent_solvent"
      rule: "For each whole liquid use net wet m = V × rho at measured matching T/composition, or net weighing. Independently measured w_H2O gives water m × w_H2O and non-water m × (1 − w_H2O); non-water is not dry/suspended solids. Conserve water and each actual constituent across input, retention, stock, cake, liquid and release ledgers without duplicate outgoing exchanges."
      inputs:
        - cp_water
        - cp_material
        - cp_ink
        - cp_waste
        - cp_air
      output: "wet mass, constituent balances and residual uncertainty"
      source_ids: []
    - id: delivery_basis
      applies_to: "supply and background"
      rule: "Verify whole wet/active, heat/electricity/volume and background reference bases separately for every provider using measured conversions; absent compatibility cannot establish complete linkage. Database secondary coefficients replace neither density nor provider reference basis."
      inputs:
        - "provider reference quantity"
        - "each cp"
      output: "auditable compatible link"
      source_ids: []
  data_quality_requirements:
    - id: q_scope
      applies_to: "route"
      requirement: "Confirm actual one-dollar route, paper/inks/security fibres and absence of added strips/coatings/adhesive back; PWS is not all current factories."
      evidence: "current design, lots and site sequence"
    - id: q_complete
      applies_to: "all rows"
      requirement: "Unknown UUIDs/providers/gas species/heat bases stay pending and prevent complete-LCI claims. Add, search and directly verify each additional actual atomic flow; confidentiality is no reason to assume zero releases."
      evidence: "row records and coverage matrix"
    - id: q_auxiliaries
      applies_to: "packing, maintenance and containers"
      requirement: "Verify each actual packing layer/label liner, replacement part, filter medium, cleaning wipe, other oil grade, sludge drum and transport container separately by material/grade, tare, receipts, returns, repair/reuse and actual handoff. Add one atomic exchange per actual supplied or discarded item before claiming complete coverage; unknown construction or occurrence remains a specific gap, never an assumed recipe or zero. Keep durable-item physical receipts/returns/stocks separate from burdens attributed over documented service; do not reduce actual delivered mass by allocation shares."
      evidence: "supplier specifications, maintenance/tool records and handoff/tare records"
    - id: q_balance
      applies_to: "paper/water/carbon"
      requirement: "Retain paper/ink/water/carbon/packing retention, loss, stock and handoff ledgers with balance residuals and uncertainty; the 75/25 fibre description cannot determine finished-note carbon."
      evidence: "weighing, analyses and stage linkage"
validation_rules:
  - rule_id: v_scope
    applies_to: "data package"
    rule: "Declare every reference qualifier and named route; classification label, broad UUID or same-purpose other denomination cannot prove applicability. Keep pending scientific review explicit; determine current mapping acceptance from the canonical mapping and its ADRs."
    source_ids:
      - bep-manufacture
      - uscep-one-dollar
  - rule_id: v_basis
    applies_to: "all rows"
    rule: "Align bilingual reference amount/unit, row IDs, denominator, collection aggregation and calculations; exactly one final product output matches finished_notes reference row/UUID. Conserve stage physical quantities/internal handoffs and check allocated burden ledgers separately."
    source_ids: []
  - rule_id: v_identity
    applies_to: "UUID and providers"
    rule: "Check each actual flow name, CAS, phase, route, classification, medium/submedium, reference property and unit; identity lookup does not prove actual provider/basis compatibility. Blank UUIDs and specific conflicts remain pending; neither correction flows nor approximate elementary identities replace actual releases."
    source_ids: []
  - rule_id: v_emissions
    applies_to: "air/water/waste"
    rule: "Require non-overlapping PM bins; collected dust/internal reuse/indoor exposure cannot duplicate outdoor releases; close actual species composition/monitoring. Distinguish sewer effluent handoff from environmental-water release and retain wet-sludge composition/receiver conditions. Unknowns cannot be reported as zero or complete pass."
    source_ids:
      - jrc-paper-bref-2015
      - bep-wcf-pws-2018
      - niosh-bep-1988
  - rule_id: v_full_model
    applies_to: "lifecyclemodel completeness"
    rule: "Verify actual upstream paper/ink/plate/utility, delivery and downstream sewer/waste coverage behind prepared-input handoffs; replace matching backgrounds with quantified linked foreground for real same-site manufacture. Historical/site percentages, occupational exposure, tonnage or avoided totals are not universal recipe/LCI defaults."
    source_ids:
      - bep-manufacture
      - bep-wcf-pws-2018
      - nist-intaglio-1992
      - niosh-bep-1988
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Background only for this declared note-printing unit; complete manufacture needs the actual linked units"
  allowed_use: "Manufacturing models with compatible providers/current route/reference bases and completeness disclosure"
  excluded_use: "Whole CPC leaf, other notes/documents, financial-service/circulation-lifetime comparison, confidential-recipe inference or complete-factory claims omitting upstream"
  required_metadata: "all reference qualifiers; foreground handoffs; upstream/downstream coverage; every supplied/background reference basis; actual sampling/acceptance period"
  required_quality_disclosure: "identity/concentration/energy/provider uncertainties; release screening; physical/burden ledgers; quantitative uncertainty; scientific review/mapping state"
  update_trigger: "Reassess on changed issue security structure, paper/ink, drying/wiping/treatment, packing/provider, energy or actual monitoring"
data_sources:
  - id: "bep-manufacture"
    type: "official_guidance"
    reference: "BEP, The Buck Starts Here: How Money is Made, https://www.bep.gov/currency/how-money-is-made"
    used_for: "one-dollar offset exception, cotton-linen paper and distinct ink/print/acceptance/packing routes; no ink dose, dwell-time or packing-count coefficients"
  - id: "uscep-one-dollar"
    type: "official_guidance"
    reference: "US Currency Education Program, $1 Note, https://www.uscurrency.gov/denominations/1"
    used_for: "one-dollar paper and embedded red/blue fibre identity, without fibre/chemical input recipe"
  - id: "bep-wcf-pws-2018"
    type: "official_guidance"
    reference: "BEP WCF, Wastewater Pretreatment Plant Maintenance Services PWS, Version01/24/2018, PDF pp.1–2; government-authored original mirror: https://imlive.s3.amazonaws.com/Federal%20Government/ID84027261251878272595468497169786081421/PWS_Wastewater_Treatment__Mar-2019_Clean.pdf"
    used_for: "WCF case wiping supply/pretreatment and sewer handoff; verify actual batch/current version, without default dose, concentration or hazard/fate; mixed-denomination offset wording does not apply to one-dollar"
  - id: "bep-stewardship"
    type: "official_guidance"
    reference: "BEP, Environmental Stewardship, https://www.bep.gov/about-bep/environmental-stewardship"
    used_for: "inspection recovery and central utility scope; dated multi-denomination savings are not product factors"
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "JRC, Production of Pulp, Paper and Board BREF2015, §§7.1.1–7.1.2,7.1.4,7.1.10; printed pp.660–661,665,670 / PDF pp.698–699,703,708; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "upstream paper stages and cutting-dust mechanisms, cotton-linen stages need provider proof; no woodworking evidence or historical/BAT number transfer"
  - id: "nist-intaglio-1992"
    type: "literature"
    reference: "NISTIR4752, January1992, annual report September1988, printed pp.1,3 / PDF pp.9,11; https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nistir4752.pdf"
    used_for: "historical prototype cure/wipe route distinctions and counterevidence against ordinary solvent gravure; no research resin/recipe/dose adoption"
  - id: "niosh-bep-1988"
    type: "official_guidance"
    reference: "NIOSH HETA87-266-1860, January1988, PDF p.4 process description; https://stacks.cdc.gov/view/cdc/171954/cdc_171954_DS1.pdf"
    used_for: "historical paper/ink offgassing and ink/particle screening, indoor/outdoor distinction; no current wet-strength resin/ink formula or occupational concentration-to-LCI inference"
  - id: "epa-pm201a-2020"
    type: "official_guidance"
    reference: "EPA Method201A, October7,2020 Internet copy, §§1–4 / PDF pp.1–3; §12.3.2 and §12.5 equations28–29,45–47; https://www.epa.gov/sites/default/files/2019-08/documents/method_201a_0.pdf"
    used_for: "Filterable stationary-source size-sampling applicability, entrained-droplet exclusion, nested differencing and condensable coverage limits; sampled gas volume versus sampling rate and size-fraction mass/volume concentration definitions (not a factory release factor); no universal printing factor or current legal/compliance claim"
