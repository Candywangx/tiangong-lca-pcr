      collection_method: "Validated sampling/lab method suitable for actual exhaust; integrate net concentration times matched T/P wet/dry volumetric gas flow rate over operating time, or sum net concentration times already integrated interval gas volume without another time factor. Apply compatible unit conversions and retain raw species mass before normalization, covering uncaptured paths. Indoor occupational data cannot become LCI; retain detection limits rather than default zero. Aggregation procedure: divide same-period attributable measured row quantity by same-period accepted net note kg, keeping physical and allocated-burden ledgers separate; per 1 kg reference flow."
      unit: "kg"
