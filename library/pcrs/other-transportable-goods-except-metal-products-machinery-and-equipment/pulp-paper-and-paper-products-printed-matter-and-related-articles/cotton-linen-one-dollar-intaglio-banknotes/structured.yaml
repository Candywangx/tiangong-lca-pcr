system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "applicability"
      rule: "Select only this one-dollar cotton-linen, steel-intaglio/letterpress and aqueous-caustic wiping route. BEP original one-dollar offset exception takes precedence over the mixed-denomination PWS general description. Exclude polymer, composite security strips, added fluorescent coatings, adhesive stamps, securities/cheques and other printing/curing routes."
      source_ids:
        - bep-manufacture
        - uscep-one-dollar
        - bep-wcf-pws-2018
    - rule_id: b_handoff
      applies_to: "upstream coverage"
      rule: "Actual in-house ink blending, paper manufacture, engraving/plating and central utilities cannot disappear at a modelling handoff. Each needs atomic inventory, actual measurements/releases and compatible reference quantity; conserve both ends of its handoff and replace rather than duplicate supplied backgrounds."
      source_ids:
        - bep-manufacture
        - bep-wcf-pws-2018
        - jrc-paper-bref-2015
    - rule_id: b_physical
      applies_to: "stage and allocation ledgers"
      rule: "Aggregate one printing-treatment foreground unit while retaining stage paper/water/ink/carbon and stock ledgers. Internal transfers/rework are neither extra final products nor outgoing releases. Keep physical balances separate from allocated environmental burdens; allocation fractions never scale actual waste/co-product delivery quantities."
      source_ids: []
    - rule_id: b_waste
      applies_to: "water and waste boundary"
      rule: "Include wiping and actual wastewater pretreatment; separate paper waste, collected dust, wet sludge, segregated spent solvent and sewer effluent. Sewer handoff is not direct freshwater elementary release; link actual POTW treatment and its releases. Historical PWS disposal/hazard state cannot establish current receiver conditions."
      source_ids:
        - bep-wcf-pws-2018
    - rule_id: b_air
      applies_to: "air and utility releases"
      rule: "Record actual outdoor boundary releases by species; indoor exposure is not outdoor discharge and size bins cannot overlap. Measure central boilers independently within linked utility units; paper cutting or printing factors cannot stand in for boiler emissions. Retain actual biogenic CO2 in LCI regardless of a GHG reporting convention; retained product carbon is not emitted carbon."
      source_ids:
        - jrc-paper-bref-2015
        - niosh-bep-1988
        - bep-stewardship
