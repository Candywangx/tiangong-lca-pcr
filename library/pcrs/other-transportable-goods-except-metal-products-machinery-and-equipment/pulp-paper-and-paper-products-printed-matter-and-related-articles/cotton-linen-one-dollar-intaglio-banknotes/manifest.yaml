review_metadata:
  author_review_state: "No independent scientific/methodology approval; narrower CPC 32610 scope only. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  identity_decision: "New semantic identity. Existing whole-leaf retained scaffold is a terminal legacy alias; do not promote it or change shared aliases. No existing material banknote PCR found in seed or controller durable intake/reviewed titles."
  evidence_limits:
    - "BEP current web route excludes one-dollar offset; WCF PWS is Version01/24/2018 procurement original hosted at a public mirror, not universal current manufacturing recipe. Confirm actual period/site route."
    - "NIST1992 prototype radiation-curing/neutral-water work and NIOSH1988 Washington observations are historical counterevidence/screening only. No resin/pigment recipe, dose, dwell time or emission factor adopted."
    - "JRC2015 paper BREF supports actual upstream paper process review and cutting-dust mechanisms only; no sawmill/plywood evidence, no wood-furnish assumptions for cotton-linen paper."
    - "EPA Method201A2020 Internet copy applies only to qualified filterable stationary-source measurement; actual moisture/droplet/temperature/flow and condensable coverage remain site-specific. Method0011 DRE scope was discovered but not adopted as a universal printing-exhaust aldehyde protocol."
  unresolved_flow_uuids:
    - row_id: "electricity"
      selected_flow: "US user-side low-voltage alternating current"
      reason: "50657322 native geography is CN; successful bounded US/GLO query returned CN user-side, CN transformation/hydropower and unrelated generation/cable routes, no compatible US/GLO below-1-kV consumer identity. Keep UUID blank, MJ and actual US voltage/grid/year/provider/loss boundary pending."
    - row_id: "security_paper"
      selected_flow: "Unprinted cotton-linen currency paper sheets"
      reason: "Cotton/linen fabric and finished document candidates do not identify unprinted rag currency paper; no paper-grade provider or security-fibre composition. Supplement cotton paper query also returns textile/blanket/battery identities, not this input."
    - row_id: "ink_green_intaglio"
      selected_flow: "Green intaglio currency printing ink"
      reason: "Direct gravure candidate c2ed is explicitly low-viscosity solvent/toluene-based, incompatible with steel-intaglio vault drying; flat ink is planographic, not currency ink. Generic Ink has ZH water-based identity without proof actual is water-based. Supplement Ink UV record has explicit UV route."
    - row_id: "ink_green_letterpress"
      selected_flow: "Green letterpress currency printing ink"
      reason: "Flexographic candidate is optical-assembly route, gravure wrong process; solvent-based relief-ink record requires actual supplied solvent chemistry not established. No generic ink formula inferred."
    - row_id: "ink_black_intaglio"
      selected_flow: "Black intaglio currency printing ink"
      reason: "Returned pigment and stamp products do not identify complete black steel-intaglio ink. Shared bounded printing-ink supplement gives water-based/UV/planographic/solvent-gravure/soy restrictions, none proven for this formulation."
    - row_id: "ink_black_letterpress"
      selected_flow: "Black letterpress currency printing ink"
      reason: "Generic Ink bilingual metadata constrains water-based; solvent-based relief flow conditional chemistry not proven. Actual prepared formulation provider and curing carrier remain unspecified; do not conflate black steel-intaglio with black letterpress."
    - row_id: "water"
      selected_flow: "Softened water for aqueous cylinder wiping"
      reason: "Softened water f80e is ion-exchange Ca/Mg route. PWS proves softened water supply, not actual softening technology. Candidate supports Volume/m3 but that cannot establish the provider route; leave UUID blank."
    - row_id: "castor_oil"
      selected_flow: "Aqueous sulfonated castor oil wiping surfactant solution"
      reason: "Search returns soap, sulfonated kerosene and unrelated fat/oil substances. None is actual aqueous supplied commercial sulfonated-castor-oil formulation. PWS terminology does not resolve sulfation/sulfonation, counterion/CAS or active fraction."
    - row_id: "paper_band"
      selected_flow: "Currency denomination binding band"
      reason: "Currency band query returns unrelated pulp, plastic label, PET and other goods, not one finished denomination band with known actual construction. No paper/steel/adhesive recipe inferred."
    - row_id: "barcode_label"
      selected_flow: "Printed currency-pack barcode label"
      reason: "8153 candidate directly specifies electronics-only labels/stickers with an unrelated amount estimate; cannot establish actual currency barcode-label construction. No raw paper/adhesive substitution."
    - row_id: "printing_plate"
      selected_flow: "Engraved steel currency intaglio printing plate"
      reason: "Raw steel pipe-mill/low-alloy plate, polystyrene plate, aluminium printing substrate and plate developer are not one engraved steel currency printing plate with its actual coating/preparation."
    - row_id: "steam"
      selected_flow: "Steam for currency-printing conditioning"
      reason: "293f steam name.flowProperties explicitly 11.0 MPaG; actual pressure not public/collected. Other heat/steam records are specific recovered-fibre/chemical/deodorisation or unverified boiler/heat handoffs. No actual net delivered enthalpy/provider basis; no steam UUID selected."
    - row_id: "calcium_chloride"
      selected_flow: "Calcium chloride aqueous coagulation solution"
      reason: "Primary calcium-chloride request failed and is not no-match. Successful 35%-solution supplement returns cbe945 unspecified-strength CaCl2 with CN geography, without whole-solution strength/reference proof; cannot replace historical nominal supply with dry/unspecified salt or establish current US delivery. Actual lot strength/provider pending; exact solution UUID blank."
    - row_id: "sulfuric_acid"
      selected_flow: "Sulfuric acid aqueous pretreatment reagent"
      reason: "98% solution efbf requires actual delivered strength not reported by PWS; oleum is different phase/composition. No supply strength chosen or recipe dose set."
    - row_id: "hydraulic_oil"
      selected_flow: "Currency press hydraulic lubricating oil"
      reason: "Returned hydraulic oil has vacuum-distillation/synthesis route; PAO lubricant, sizing agent and other route-specific oils cannot prove this actual hydraulic-oil grade. Keep one real grade name pending, not an energy/fuel surrogate."
    - row_id: "ink_sludge"
      selected_flow: "Centrifuged intaglio-ink coagulation sludge"
      reason: "851fd235 solid-waste candidate has successful query and direct read, mass/kg and sludge-inclusive comments; usable only for verified actual wet solid centrifuge cake, not liquid slurry. Current lot/state, net wet mass, independent moisture/solids and recipient evidence absent; retain specific blank UUID. Pharmaceutical/BOD liquid and slags incompatible. Historical PWS does not certify current hazard/fate."
  unresolved_dataset_compatibility:
    - "Prepared paper and four separately recorded ink products require complete real upstream submodels; confidential composition must be auditable with provider assurance, never guessed."
    - "Soft-water treatment mechanism, steam actual pressure/state and net delivered heat, calcium-chloride and sulfuric-acid supply strengths, plate preparation/coating and hydraulic-oil grade remain site/provider-specific."
    - "US user-side LV electricity identity remains blank after rejecting CN-geography and incompatible route candidates; actual US voltage/grid/year/provider and point-of-use loss/transformer boundary required."
    - "Plastic film UUID is broad physical identity only; actual polymer/layers/additives/grade and provider remain pending. Bands and barcode labels need actual construction and any included adhesive."
    - "Air species/size-bin metrology and current emission presence, wastewater/sludge chemistry, secure waste receivers and POTW background remain mandatory before claiming a complete LCI."
    - "Any actual onsite ink preparation, plate manufacture/plating or central fuel-fired utilities must be separately quantified and linked without duplicate supplied-background coverage."
  independent_review_state: "Independent source, native identity, bilingual and measurement-contract review completed; scientific/methodology approval remains pending. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  conditional_supply_branches:
    - "NaOH50 UUID applies only to source-qualified whole-solution supply with actual current site/period/lot strength proof. Different or unknown strength requires a specific actual solution exchange with blank UUID; never a factory-wide default or wiping-bath recipe."
    - "Steam pressure/state unknown blocks enthalpy calculation and pressure-specific UUID selection; current MJ row states only the required future net-delivery basis."
  completeness_gaps:
    - "Actual packing layers, label liners, maintenance parts/filter media/wipes/other oil grades, sludge drums and transport-container material/grade/tare/reuse/handoffs require individual atomic exchanges when present; no invented construction or zero quantities."
    - "Whole waste-liquid volume, temperature-matched density, net wet mass, independently measured water, dissolved constituents and method-defined dry/suspended solids need separate subledgers; non-water is not solids. Actual current wet solid sludge/cake remains unconfirmed."
    - "Durable-item physical receipts/returns/stocks and complete physical waste deliveries remain separate from service-attributed or allocated environmental burdens."
  metadata_debts:
