      issue: "Official ZH baseName mistranslates petroleum white spirit as alcoholic drink; EN/classification/bilingual comments identify non-fuel petroleum distillate. Exact ZH retained, physical petroleum qualifier explicit. Request source correction; never use as ethanol."
  quantity_policy: "No recipe/dose, note mass, yield, default energy, control factor, allocation fraction, lifetime, moisture or security material coefficient. Site-specific records and compatible reference normalization only."
