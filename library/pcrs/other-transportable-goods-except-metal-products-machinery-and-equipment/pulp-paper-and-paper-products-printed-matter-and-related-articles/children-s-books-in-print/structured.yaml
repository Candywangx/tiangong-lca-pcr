allocation_rules:
  - rule_id: a_framework
    applies_to: "shared processes"
    rule: "Declare an attributional study context. Subdivide or virtually subdivide by actual job/stage first; use determining physical relationships for the remaining exchange-specific shared loads. Metered runtime is suitable only with evidenced service intensity; sheet area/passes or heat demand likewise need an actual causal basis and complete service-population denominator."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "residual joint load"
    rule: "Only after documenting unavailable subdivision/physical causality may a justified residual economic basis use actual co-function value in its gate condition. Missing prices, disputed charges, zero/negative values or incomplete denominators require method review; do not clip fees to zero or force shares. No generic mass/page/sales split."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_two_accounts
    applies_to: "all exchanges"
    rule: "Maintain unallocated physicalV and environmental burdenA separately. Each assigned load records its source exchange, original owner/cohort and driver. Shares close over the full served population; physical waste/product/return masses remain intact. Include setup, failures, idle and cleanup; unidentified attribution stays explicit rather than disappearing into a successful new lot."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_recovery
    applies_to: "recovered paper, plates and packaging"
    rule: "Record actual waste/product status, receiver and treatment. A sale or return creates no automatic substitution credit. Recycling and reuse scenarios require explicit system/burden ownership and method review; a whole supplier/treatment and its component providers cannot both be charged."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "children_book_manufacture"
      flow_role: "finished books and Q"
      record_type: "future measured foreground"
      raw_fields: "title/design; child audience/purpose; picture/text/activity; first-release item/lot id; new/old cohort; accepted copies; calibrated net masses; moisture; reject/rework/return; opening/closing finished stock; packaging tare"
      collection_method: "Weigh complete accepted books on calibrated scales after trimming/binding inspection; retain copy sampling and lot weighing reconciliation. Unique first-release register establishes Q, not dispatch or sales; audit all reacceptance links."
      unit: "kg; copies"
      frequency: "each first release and stock close"
      temporal_coverage: "declared cohort through complete release/stock cycle"
      site_scope: "actual manufacturer and declared design"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; acceptance/proof; contents and publisher brief; unique release and stock records"
    - protocol_id: cp_stages
      process_id: "children_book_manufacture"
      flow_role: "each component state and cohort"
      record_type: "future physical ledger"
      raw_fields: "stage; owner/cohort/component; opening; external_in/out; internal_in/out; formation/consumption; closing; moisture; inherited exchange/provider vector"
      collection_method: "Weigh and reconcile each stage at its real gate, including paper/signatures/covers/blocks/finished books and circulation. Record conversions and reacting/retained components; verify matched internal transfers cancel only on aggregation."
      unit: "kg"
      frequency: "each transfer/conversion and period close"
      temporal_coverage: "entire cohort including incomplete WIP"
      site_scope: "all actual printing/binding stages and declared outsourcing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated gate records; component balances; no overlapping stock states"
    - protocol_id: cp_materials
      process_id: "children_book_manufacture"
      flow_role: "each paper, plate, powder, cloth"
      record_type: "future measured foreground"
      raw_fields: "material/grade; supplier; delivered quantity; stock/issue/return; coating; furnish; moisture; sheet/plate dimensions/count; dry/wet basis; actual route"
      collection_method: "Weigh actual whole materials at receipt/issue and reconcile inventory with stages. Measure plate including coating; verify actual process-free route. Separate body/cover and every actual extra material; supplier capability is not a recipe."
      unit: "kg"
      frequency: "each receipt/job/material change; stock close"
      temporal_coverage: "all setup/production/cleanup of cohort"
      site_scope: "actual manufacturer and supplier scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase/issue/tare records; specifications; calibration; balance residuals"
    - protocol_id: cp_preparations
      process_id: "children_book_manufacture"
      flow_role: "each ink, fountain preparation and wash"
      record_type: "future measured foreground"
      raw_fields: "job/colour/SKU; supplied mass/volume; density/T; complete composition/CAS; active/carrier fractions; fossil/biogenic origin; beginning/end; issue/recovery; retained/waste/release"
      collection_method: "Weigh whole supplied preparation and reconcile containers/stock; obtain full supplier formula or assay beyond SDS omissions. Actual chemical constituent balances are analytical subledgers; link the complete preparation provider once, or explicitly replace with compatible component modelling without duplication."
      unit: "kg; m3"
      frequency: "each issue, colour/formulation change and stock close"
      temporal_coverage: "full job including storage and wash"
      site_scope: "actual press and preparation supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "SDS plus complete formulation/assays; scales; densities; supplier and provider ownership"
    - protocol_id: cp_binding
      process_id: "children_book_manufacture"
      flow_role: "spine and side EVA separately"
      record_type: "future measured foreground"
      raw_fields: "glue/SKU/chemistry; issue/return/purge; retained mass; pot heating/standby; thermal history; binder setup; pull/opening acceptance"
      collection_method: "Weigh whole supplied glue by application point; log actual pot heat and cleaning, verify non-reactive EVA and actual retained/purged components. Manufacturer glue compatibility proves no actual dose, temperature or safety result."
      unit: "kg; MJ"
      frequency: "each job, melt and cleaning cycle"
      temporal_coverage: "setup, production, failure and standby"
      site_scope: "actual binder and outsourced binding if included"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "glue supplier composition; weighing; metering; binding acceptance; purge receiver"
    - protocol_id: cp_utilities
      process_id: "children_book_manufacture"
      flow_role: "electricity, gas, tap water and heat separately"
      record_type: "future measured foreground"
      raw_fields: "meter start/end; device/stage/job; electricity voltage/grid/year; water density/T; gas T/P/wet-dry/composition/Z; steam supply/return mass/enthalpy/time; leaks/blowdown/storage; provider; shared service population"
      collection_method: "Submeter and reconcile bills over identical time windows. Preserve all idle/failed/cleanup service. Match volume conventions and supplied state. For heat measure independent supply/return enthalpy flows and losses/storage; no assumed efficiency, mass equality or calorific-to-delivered-heat identity."
      unit: "MJ; kWh; kg; m3"
      frequency: "each job/cycle and bill/stock close"
      temporal_coverage: "full reporting period and every attributable cycle"
      site_scope: "actual site/support devices and suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meters; utility invoices/assays; state records; complete driver denominator"
    - protocol_id: cp_pack
      process_id: "children_book_manufacture"
      flow_role: "each packaging component and leg"
      record_type: "future measured physical and ownership ledger"
      raw_fields: "component/id; owner/cohort; inherited vector; P; N_ext origin; ER and prior-outward link; opening/closing raw/WIP/new-FG/old-FG/reusable state; internal legs; grossdispatch; owner-return outward; waste; route/distance/load; price inclusion; whole/component provider"
      collection_method: "Weigh/count each complete actual component and link all custody movements. Audit first external acquisition even in a bundled price, first loan/lease/consignment/accompanying supply, and proven same-item returns. Preserve disjoint stocks and every transport leg; reconcile provider ownership and actual reuse services without a default life."
      unit: "kg; pieces; tonne-km"
      frequency: "each entry/exit/use and stock close"
      temporal_coverage: "all packaging movements serving new and old cohorts"
      site_scope: "incoming supply and actual dispatch/return receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "custody/purchase/loan records; prior outward proof; scales; carrier records; inherited vectors and ownership reconciliation"
    - protocol_id: cp_waste
      process_id: "children_book_manufacture"
      flow_role: "each outgoing waste transfer"
      record_type: "future measured foreground"
      raw_fields: "stream/bin; component/owner/cohort; state; whole mass; moisture/water fraction; independent solids/solvent/metal/polymer; liquid volume/density/T; stocks; receiver/treatment; actual waste status"
      collection_method: "Weigh segregated streams at handover. Liquid whole mass and non-water composition are distinct; dry residue alone cannot represent all non-water material. Preserve every component exactly once across ink, cloth, wash, books, dust and packaging; verify actual treatment and transport."
      unit: "kg; m3"
      frequency: "each bin/dispatch and stock close"
      temporal_coverage: "full period including failures and cleanup"
      site_scope: "actual site and receiving treatment boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weights; sampling methods; receiver acceptance and transfer/transport documents"
    - protocol_id: cp_emissions
      process_id: "children_book_manufacture"
      flow_role: "each species and disjoint PM bin"
      record_type: "future measured foreground"
      raw_fields: "source/outlet/stage/job; actual constituents/CAS; time; inlet/outlet flow/concentration; T/P/humidity; dry/wet basis; calibration/response/recovery; LOD; PM cut/filterable/condensable; control; carbon source; fuel/oxygen balance"
      collection_method: "Survey actual constituents and all operating modes, then validate species-specific sampling for the actual matrix. Integrate matched inlet/outlet flux after control, include fugitive/storage/cleanup outlets. TVOC equivalents are QA only without demonstrated conversion; no uncharacterized residual assigned a species. Retain inlet air/oxygen/water and transformations in balance subledgers."
      unit: "kg; mg/m3; m3/time"
      frequency: "representative setup/run/idle/cleanup/heat surveys"
      temporal_coverage: "every actual operating mode and period"
      site_scope: "outdoor factory releases; upstream supplier emissions separate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "competent analytical methods/calibration; outlet/inlet closure; LOD/uncertainty; complete source survey"
    - protocol_id: cp_loads
      process_id: "children_book_manufacture"
      flow_role: "exchange-specific burdenA"
      record_type: "future measured allocation evidence"
      raw_fields: "exchange j; owner/cohort; original Qc; provider; physicalV; measured dedicated/shared activity; complete served population; driver; residual prices/fees/status; added service; uncertainty"
      collection_method: "Preserve raw physical ledger; separately assign loads by justified direct/subdivision/physical relationships and review any residual economic basis. Carry inherited vectors and attach actual new services to their own cohorts. Retain unassigned loads and Q=0 periods for review."
      unit: "original exchange unit; kg reference output"
      frequency: "every assignment and period close"
      temporal_coverage: "identical service windows for all beneficiaries"
      site_scope: "full relevant shared-service population"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters/job tickets; causal evidence; price/fee originals where justified; share closure and sensitivity"
  calculation_rules:
    - id: first_release_q
      applies_to: "cp_release"
      rule: "Q = sum of unique first-released net new-book masses, including new closing finished goods once; trace same-design sampled copy mass against calibrated lot weights. Exclude opening/old FG and repeated release of returns/rework."
      inputs:
        - "first-release register"
        - "complete net mass"
        - cohort
        - "stock reconciliation"
      output: "Q in kg and excluded/repeated-item audit"
      source_ids:
        - un-cpc3-children
    - id: cohort_normalization
      applies_to: "all inventory rows"
      rule: "For compatible new-cohort quantities report physicalV_j / Q and separately burdenA_j / Q only when Q is positive; physicalV is the closed unallocated cohort ledger and burdenA the independently assigned load ledger. Inherited exchange vectors and added old-cohort services retain original Qc or an explicitly reviewed service basis. Q=0 remains raw and unnormalized, never deleted or shifted automatically."
      inputs:
        - cp_release
        - cp_stages
        - cp_loads
        - "original Qc"
        - physicalV_j
        - burdenA_j
      output: "separate physical and burden values per 1 kg reference flow with original-cohort service records"
      source_ids:
        - ilcd-allocation-2010
    - id: stage_closure
      applies_to: "cp_stages"
      rule: "For each component/state, opening + external_in + internal_in + formation = closing + external_out + internal_out + consumption. Pair identical internal links before summing; conversions need balanced constituent inputs/products. Unchanged transfers create no formation or external receipt."
      inputs:
        - "stage/state/cohort quantities"
        - "actual conversion"
        - "moisture/composition"
      output: "closed physical stage and aggregate ledgers with residuals"
      source_ids:
        - epa-print-process
    - id: preparation_constituents
      applies_to: "cp_preparations"
      rule: "Actual constituent mass = measured whole preparation mass times independently verified mass fraction; include carrier water and retained mass once. Reconcile input/stock, actual conversions, book retention, disjoint wastes and air; a discrepancy is uncertainty, not identified release."
      inputs:
        - "whole mass"
        - "actual composition"
        - cp_stages
        - cp_waste
        - cp_emissions
      output: "analytical constituent ledger without duplicate whole/component provider"
      source_ids:
        - epa-offset-ctg
    - id: packaging_closure
      applies_to: "cp_pack"
      rule: "For each component/owner/cohort, opening + P + N_ext + ER + internal_in = closing + grossdispatch + owner-return outward + waste + other real exits + internal_out. Stock transformation from unissued to packed is an internal state movement, not acquisition; recover same-item prior-outward proof before ER. Preserve each transport leg."
      inputs:
        - cp_pack
        - "unique component identity"
        - "previous outward"
        - "inherited vector"
      output: "full component/custody balance and provider ownership"
      source_ids:
        - ilcd-allocation-2010
    - id: steam_service
      applies_to: "purchased_steam_heat"
      rule: "Meter supply enthalpy flux and return enthalpy flux independently. Delivered boundary energy = supply enthalpy inflow minus return/outward enthalpy flows minus measured boundary storage change, with real leakage/blowdown and other exchanges explicit on their correct side. Only proven matched supply/return mass at the same boundary permits m times (hs minus hr). No efficiency is inferred."
      inputs:
        - cp_utilities
        - "mass/time"
        - h_supply
        - h_return
        - "actual exits"
        - storage
        - boundary
      output: "delivered MJ with heat/water/provider reconciliation"
      source_ids:
        - epa-gas-combustion
    - id: species_flux
      applies_to: "cp_emissions"
      rule: "Integrate species concentration times compatible outlet flow minus matched inlet species flux over the actual windows; convert to kg and retain recovery, humidity and detection limits. Distinct outlets/time windows only. Do not clip negative residuals or label TVOC-as-carbon as a chemical species."
      inputs:
        - concentrations
        - "inlet/outlet flow/time/state"
        - calibration
        - composition
      output: "outdoor species kg and residual/uncertainty before cohort normalization"
      source_ids:
        - epa-species-method
  data_quality_requirements:
    - id: dq_child_design
      applies_to: "reference"
      requirement: "Actual child-directed non-textbook content and physical construction must meet scope. Record image/text/activity layout, age audience, colour/blank pages and declared medium/opening/binding acceptance without deriving safety or learning performance."
      evidence: "publisher brief; actual contents/proofs; material/route evidence; first-release acceptance"
    - id: dq_cohorts
      applies_to: "stocks and services"
      requirement: "Keep disjoint raw/WIP/new-FG/old-FG/reusable stocks and individual inherited exchange vectors; no repeat Q or blanket normalization to current sales. No unmeasured zero."
      evidence: "unique first-release/return links; component/cohort ledger; original Qc and service attribution"
    - id: dq_identity_provider
      applies_to: "each row"
      requirement: "Verify actual flow type, whole/active state, names/routes/CAS, reference property, unit group and unit against compatible delivered material and provider. Broad identity, successful search and manufacturer's capability do not prove a plant recipe or amount."
      evidence: "native identities; supplier/receiver specification; actual invoice/assay/meter; provider matching"
    - id: dq_completeness
      applies_to: "whole factory"
      requirement: "Survey unlisted formulations, aids, packages, spare parts, chemicals, emissions/media and utilities; add each actual atomic exchange before declaring dataset complete. A UUID gap is local and explicit, while an unresolved reference/material physical conflict blocks that affected model."
      evidence: "complete source/material survey; stage/chemical/water/carbon balances; explicit gaps and exclusions"
    - id: dq_uncertainty
      applies_to: "results"
      requirement: "Preserve measured residuals, detection limits, uncertainty and performed/skipped checks; identify source scope, vintage and supplier limits. No source recipe, emission factor, fixed lifetime, universal yield or safety result is imported."
      evidence: "calibration/sampling design; originals/locators; reconciliations; allocation sensitivity and independent review"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference"
    rule: "Verify the complete selected children's book, actual audience/non-textbook purpose, image/text/activity structure and all construction qualifiers. No electronics, toy/sticker structure or blank stationery silently enters this route; no whole-leaf, learning or safety approval claim."
    source_ids:
      - un-cpc3-children
      - wco-hs49-2022
      - printninja-colouring
  - rule_id: v_release
    applies_to: "reference amount"
    rule: "One output is 1 kg net first-released complete books including retained constituents, excluding packaging. Audit Q's first-release register, new closing FG, old cohorts, genuine same-item returns and repeated rework/service. No second Q."
    source_ids:
      - un-cpc3-children
  - rule_id: v_physical
    applies_to: "stages and mixtures"
    rule: "Close all raw/stage/component/water/carbon accounts, including matched internal links and real formation/consumption. Whole preparations/books/packages and their analytical components/providers are reconciled once. Preserve whole transferred waste and real receiver/treatment; residuals require investigation."
    source_ids:
      - epa-print-process
      - epa-offset-ctg
  - rule_id: v_packaging
    applies_to: "every packaging component"
    rule: "Verify P including bundled purchase, first N_ext with custody and ER with same-item prior-outward proof. Audit mutually exclusive owner/cohort stocks, inherited vectors, gross dispatch, owner-return outward, waste and every actual transport leg. No netting or cost-based zero load."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_loads
    applies_to: "shared loads and cohorts"
    rule: "Check physicalV independently from burdenA, one supplier/treatment ownership, actual drivers and complete share denominators, original Qc inheritance and newly added services. Keep Q=0 and unresolved allocation/fees visible; independent review is needed before forcing a numerical result."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_utilities_air
    applies_to: "utilities and releases"
    rule: "Match electricity/gas provider units and heat supply/return boundaries, mass and enthalpy including leakage/blowdown/storage. Verify each outdoor species and disjoint PM bin after control; no captured-dust duplicate, assumed fuel recipe, NOx/NO2 basis substitution, TVOC species substitution or deletion of biogenic carbon."
    source_ids:
      - epa-species-method
      - epa-gas-combustion
      - heidelberg-powder
  - rule_id: v_gaps
    applies_to: "complete dataset"
    rule: "A blank UUID, unresolved delivered-state/provider, incomplete formula, missing measurement or method denominator remains a specific gap. Conditional absence needs site evidence. Reject incompatible reference or primary material matches and disclose all actual excluded operations, incomplete checks and uncertainty."
    source_ids:
      - epa-offset-ctg
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Completed actual manufacturing inventory for the declared child-directed ordinary paper-book design and selected route, following provider/data/method review."
  allowed_use: "Compatible factory-gate production of the qualified non-textbook children's books with actual amounts, suppliers, original-cohort ledgers and uncertainty; independent scope and methodology review required."
  excluded_use: "Whole-32292 average; textbooks/adult/periodical/sticker/toy/electronic products; other constructions/routes; equal reading/learning/colouring service or safety-compliance claims; a quantitative dataset inferred from UUIDs, machine brochures or sales totals."
  required_metadata: "All reference qualifiers; site/time/design/cohort/Q and original Qc; raw/stage/component/packaging ownership; suppliers/routes/providers; formulation and heat/volume bases; system/allocation decisions."
  required_quality_disclosure: "Actual measured versus missing/absent data; local UUID/provider gaps; original-cohort and Q=0 handling; physical/burden ledger residuals; source limits, exclusions, uncertainty and independent science/translation review."
  update_trigger: "Change in audience/purpose, page/activity structure, stock/printing/setting/binding/formulation, supplier/utility/receiver, cohort/period, packaging/reuse, controls, acceptance or identity evidence."
data_sources:
  - id: "un-cpc3-children"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 Code 32292 original page https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/32292 ; CPC 3.0 Explanatory Notes 30 June 2025 https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Original leaf and PDF148–150, especially149: audience, non-textbook products and sticker/toy exclusions; neighbouring textbook/periodical distinction. No age, process or quantity rule supplied."
  - id: "wco-hs49-2022"
    type: "official_guidance"
