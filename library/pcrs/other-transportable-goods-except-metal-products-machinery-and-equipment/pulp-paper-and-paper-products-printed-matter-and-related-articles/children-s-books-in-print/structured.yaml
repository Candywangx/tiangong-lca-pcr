system_boundary:
  rules:
    - rule_id: b_children_scope
      applies_to: "applicability"
      rule: "Verify non-textbook child-directed content from actual publication/specification. Distinguish picture/colouring tasks from formal-study workbooks, blank stationery, sticker/toy books and electronic additions. Enforce every selected construction condition; no age-derived safety or learning claim."
      source_ids:
        - un-cpc3-children
        - wco-hs49-2022
        - printninja-colouring
    - rule_id: b_route
      applies_to: "factory"
      rule: "Include prepress/CTP and make-ready, separate body/cover wet offset, setting, folding/gathering, milling, spine/side EVA application, covering, trimming, first-release inspection, packing, cleaning and attributable support services. Excluded finishes/routes require new assessment rather than a substituted flow UUID."
      source_ids:
        - epa-print-process
        - epa-offset-ctg
        - kodak-process-free
        - mm-eva-binder
    - rule_id: b_providers_once
      applies_to: "supply and treatment"
      rule: "Include actual upstream paper/pulp/plate-coating/ink/glue/packaging manufacture and delivery and offsite treatment once. A complete preparation/book/container provider and its embodied components cannot both be loaded. Survey actual lubricants, blankets, filters, replacement parts, refrigerants and incoming supply packaging; add each occurring exchange separately, with a documented infrastructure/cut-off decision and missing-data disclosure."
      source_ids:
        - ilcd-allocation-2010
        - epa-offset-ctg
    - rule_id: b_stages
      applies_to: "physical ledger"
      rule: "Preserve each stage's internal_in/internal_out by material state and cohort. For each component: opening + external_in + internal_in + formation = closing + external_out + internal_out + consumption. Formation/consumption require a real defined conversion with reactants/products; moving unchanged stock between bins is neither. Sum stages with matching internal links cancelled once; circulation/rework never becomes an external purchase or credit."
      source_ids:
        - epa-print-process
        - mm-eva-binder
    - rule_id: b_releases
      applies_to: "waste and air"
      rule: "Count actual post-control outdoor releases separately from captured dust, transferred liquids and contaminated cloth. Retained ink/glue/powder are in the book. Conventional setting is not a heatset dryer. Optional gas/steam is actual ancillary heat only; supplier electricity/heat emissions remain upstream. Survey unlisted actual species and media before dataset completeness."
      source_ids:
        - epa-offset-ctg
        - epa-gas-combustion
        - epa-species-method
