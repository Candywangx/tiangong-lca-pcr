      markdown: "## 9. Validation Rules\n\nRequire exactly one product output linked by finished and the reference UUID, equal to 1 kg net accepted newspaper. English/Chinese reference amounts, row IDs, chemical identity, denominator, collection aggregation and formulas must match. Verify actual coldset equipment and absence of heatset/UV operation independently of frequency. Missing newsprint/prepress supply, complete ink/fountain/wash formulas, actual outdoor species, provider basis, receiver treatment or important quantities prevents completeness. A blank atomic-flow UUID is not zero; correction flows, adjacent chemicals and contrary routes cannot close it. Particle intervals do not overlap; captured/returned dust is not duplicated as outdoor emission; merged residues cross the boundary once. Keep physical and allocated-burden ledgers and expose performed/skipped/unresolved checks. No universal recipe, furnace, VOC/dust/leakage or wet/dry quantity defaults are supplied. Different old AP-42 newspaper-retention and later CTG values are applicability cautions, never proof of zero factory VOC. [epa-ap42-printing-1981, epa-litho-ctg-2006, defra-sg6-2011]\n\n"
