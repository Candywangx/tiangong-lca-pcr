  classification_refs: "CPC 3.0 32300; narrower; scope and accepted decisions: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADRs; 32410/32420/32490 are applicability context only, not accepted edges to this coldset PCR"
  covered_products: "Wet-coldset folded unbound newspapers on uncoated newsprint; frequency and subject do not constrain the method"
  excluded_products: "Heatset/hybrid, UV/EB, waterless, gravure/flexo/digital, bound magazines/journals, glued/stitched articles, separate inserts"
  representative_product: "Actual issue/grade of CMYK coldset newspaper; named producer technical evidence establishes route, without its quantitative defaults"
  production_route: "Supplied reels and prepared plates; wet offset coldset, dampening, cleaning, cut/fold, acceptance and actual bundling; off-site waste/effluent treatment"
  market_state: "Net folded newspaper at dispatch and measured moisture, excluding transport packing and inserts"
functional_unit:
  what: "Supply physical newspaper at actual contracted print quality; manufacturing declared unit, not automatic reading-service equivalence"
  how_much: "1 kg net accepted newspaper"
  how_well: "Declare actual pages, dimensions, grammage, moisture, imaged/CMYK coverage, readability and acceptance; no universal thresholds"
  how_long_or_cycle: "Same declared issue/campaign and dispatch acceptance; no assumed storage/reading lifetime"
  reference_flow_link: "finished"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The physical map is reel/prepared-plate receipt -> make-ready/plate change -> dampening and wet-coldset offset -> cut/fold -> acceptance/bundling. Cleaning and collection branches distinguish internal return, measured outdoor release and separate exported residues. Retain stage meters, stocks, material ledgers and equal mass/state/time at both ends of internal links. Dryer, UV and boiler presence/absence needs actual configuration evidence; coldset does not imply zero VOC, and substrate/formulation/cleaning losses govern real emitted species. Combustion of supplied utilities stays in its supplier node; actual fossil and biogenic CO2 both remain in that LCI even when a greenhouse-gas reporting convention excludes biogenic carbon. [defra-sg6-2011, epa-litho-ctg-2006]"
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Received traceable newsprint reels and prepared wet-offset aluminium plates, with complete upstream papermaking/prepress nodes linked"
  starting_condition_role: "intermediate_input"
  product_classification_scope: "Proposed route-limited narrower subsets of the four newspaper/periodical leaves; not whole-leaf coverage"
  recursive_input_rule: "Internal returned paper and fountain recirculation do not cross the node. Externally received printed newspapers/rework retain original supply and treatment history; no recursive method call may invent that background"
  upstream_dataset_requirement: "Actual route/state/site/time/quantity-compatible newsprint, prepared plates, each ink/chemical, electricity/water, packing, transport and residue/wastewater receiving treatment; unknown is not zero"
  disclosure: "Disclose the aggregated print node and all upstream/receiver links; exclude editorial work, reader distribution/use/end-of-life and separate inserts. Actual boilers, heatset/UV or direct water discharge require separately reviewed nodes before any complete-route claim"
