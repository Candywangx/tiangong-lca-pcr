    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve the original Net calorific value electrical-energy property; reconcile actual voltage, supply boundary and metered kWh with MJ = 3.6 * kWh."
