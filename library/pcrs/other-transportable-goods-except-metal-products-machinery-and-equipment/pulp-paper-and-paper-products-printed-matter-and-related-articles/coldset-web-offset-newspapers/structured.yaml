                - epa-litho-ctg-2006
            ranges: []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide and directly attribute issues/grades/stages. Keep unallocated physical paper fibre, pigments/minerals, vehicles/resins, water, energy and fossil/biogenic carbon separate from allocated environmental burdens. Internal return is not a co-product and receives no automatic substitution credit. Never multiply waste-paper or other co-product physical output by burden shares, or change equal internal-link quantities through allocation. Shared meters first use measured time/load, dampening/cleaning cycles and operating conditions as causal drivers; retain make-ready, plate changes, idle and reject burdens instead of dividing only by accepted copy count. If subdivision is impossible, disclose defensible causal physical allocation and sensitivity; economic allocation needs separate justification/review. Scrap paper/plate sale does not automatically establish co-products or credits. These are author methodological rules informed by process differentiation, not a claim that BAT prescribes LCA allocation. [defra-sg6-2011]"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "print"
      flow_role: "finished"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "gross dispatch mass; measured strap/film tare; net newspaper mass; accepted issue/batch; copy count; actual moisture; stock and acceptance"
      collection_method: "Weigh accepted folded copies/bundles on calibrated scales; subtract measured external packing; reconcile only newspapers from the same declared route/issue. Inserts and rejects excluded. Copy counts and measured mean net copy mass are QA, not an unverified reference replacement."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_paper
      process_id: "print"
      flow_role: "newsprint"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "supplier lot; grade; fibre/ash; reel gross/core/wrapper tare; net paper; moisture; stocks; splice/make-ready/trim; upstream supply"
      collection_method: "Traceable receipt and reel-use weighing, actual grammage/area and moisture tests; reconcile output, waste and stocks per stage. Record supplier furnish and uncoated state without importing pulp or wood-processing defaults."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_formulas
      process_id: "print"
      flow_role: "ink_black; ink_cyan; ink_magenta; ink_yellow; fount; ipa; wash"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "SKU; colour; lot; supplier; every ingredient identity/CAS or UVCB; wet mass fraction; water/solids; fossil/biogenic carbon; density/T; dilution; additions; stocks; retained/exported/evaporated material; provider reference"
      collection_method: "Weigh supplied batches/dosing and reconcile stocks; obtain complete supplier formulation, including nonhazardous ingredients omitted by SDS. Full fractions close each supplied mixture. Use documented analytical speciation for unresolved UVCB fractions and retained product/residue. Actual separately blended ingredients require distinct exchanges in a separate preparation node; never count both paste and its ingredients."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_utilities
      process_id: "print"
      flow_role: "electricity; water"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "stage meter; boundary voltage/country/time; kWh; transformer/compressor/chiller loads/losses; water mass/volume/density/T; stocks; formulation water; cooling-loop make-up; provider gate"
      collection_method: "Read calibrated supply and stage meters across make-ready, runs, cleaning, idle and finishing; reconcile the node boundary and actual causal allocation. Preserve original units and provider quantity definition. No fuel, steam, useful-heat or dryer requirement is inferred from machine capacity."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_consumables
      process_id: "print"
      flow_role: "plate; blanket; cloth; lubricant"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "component/SKU; composition; actual incoming mass; lubricant calorific-value specification/basis; area/count and measured mass; replacement; reuse/laundry; stocks; prepress imaging/developer upstream; provider"
      collection_method: "Weigh and inventory actual components, reconcile replacement/use and supplier/prepress boundaries. Retain physical internal links at identical mass/state/time at both ends; no arbitrary lifetime or unmeasured count-to-mass factor."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_packaging
      process_id: "print"
      flow_role: "strap; film"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "actual component/resin/grade; supplied mass; net issued mass; rejects/return; reference packing tare; receiver/provider"
      collection_method: "Weigh each component independently and reconcile issue/return; retained external packing remains an input and is excluded from product denominator. Actually supplied composite purchases are not fictitiously decomposed into double purchases."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_residues
      process_id: "print"
      flow_role: "spoilage; spent_plate; spent_wash; spent_cloth; spent_fount; ww; spent_oil; waste_ink; spent_blanket"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "stage; stream; physical state; whole as-exported mass; liquid volume/density/temperature; water-specific fraction; independently verified solids; water/solvent; fibre/ink/minerals/coating/metals; hazard; stocks; internal return; receiving treatment and transport"
      collection_method: "Weigh actual separate external streams and paired composition samples; preserve receiver transfer manifests. If streams combine before node exit, retain internal constituents/transfers and count the receiver exchange once. Resolve aqueous off-site treatment versus direct discharge; a plate-wash or unrelated wastewater is not a press-wash proxy."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_species
      process_id: "print"
      flow_role: "ipa_air; ethanol_air; glycol_air"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "actual CAS/species/UVCB; raw concentration and air volume; T/P; wet/dry/reference oxygen; operating interval; outlet/fugitive capture; calibration/blanks; retained product/cloth/liquid; carbon origin; method/uncertainty"
      collection_method: "Use species-resolved validated outlet/fugitive sampling such as documented GC analysis appropriate to the real composition, with simultaneous flow and actual operating intervals; reconcile species material balance. Total carbon FID/VOC compliance values require response and molecular/carbon conversion and speciation, never arbitrary full attribution to IPA. Unidentified oil fractions or unmeasured fugitive releases remain unresolved."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_dust
      process_id: "print"
      flow_role: "collected_dust; pm25; pm2510; pm10"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "source stage; complete as-collected/exported dust wet mass, measured moisture and independently verified solids; aerodynamic cut; compatible concentration/air volume/T/P/wet-dry basis; control state; fibre/mineral/ink; collected/deposited/returned mass; receiver; uncertainty"
      collection_method: "Calibrated size-resolved outlet and actual fugitive sampling paired with air-flow records; independently weigh capture and internal return. Cover handling, cutting/folding, cleaning and ink-mist conditions. Use no wood/dry-paper default factor; unmeasured is unresolved, not zero."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_water
      process_id: "print"
      flow_role: "water_air"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "water supply/formulation/loop; product moisture; residue liquid; stocks; process air humidity/volume; T/P; ambient baseline"
      collection_method: "Close actual water ledger with measured supplied, retained and exported water and/or humidity/flow change; retain measurement uncertainty and ambient correction. Unknown evaporation is pending, not the difference of unrelated campaigns."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
    - protocol_id: cp_refrigerant
      process_id: "print"
      flow_role: "r134a_input; r134a"
      record_type: "meter/laboratory/transfer record"
      raw_fields: "equipment/nameplate; refrigerant CAS/certificate; initial/final charge and cylinder stocks; purchased make-up; recovered/exported gas; service log; losses; provider"
      collection_method: "Traceable charge/recovery and cylinder weighing with calibrated scales, paired service/leak records; compare net mass changes for the same period. Recovered refrigerant is not air leakage; if exported, add a separate actual receiver flow before completeness. Other refrigerants require individually verified input/release cards."
      unit: "Original row unit and basis"
      frequency: "Each batch/matched metering interval"
      temporal_coverage: "Same complete campaign, including make-ready, cleaning, idle and rejects"
      site_scope: "Selected grade/issue/node; upstream and receiver identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original records, composition certificates, sample chain and uncertainty"
  calculation_rules:
    - id: net_campaign
      applies_to: "finished"
      rule: "P = sum(accepted newspaper bundle gross mass - measured packing tare - mass of material not belonging to that newspaper); exclude rejects/other routes by batch. Internal stage transfers are not a second output."
      inputs:
        - cp_mass
      output: "P"
      source_ids:
        - coldsetinnovation-production
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "x = X / P; X is the compatible unallocated physical campaign amount of the atomic exchange and P accepted net newspaper kg; paper input, printed area and copy counts do not replace P."
      inputs:
        - cp_mass
        - "all applicable row protocols"
      output: "x"
      source_ids:
        - defra-sg6-2011
    - id: electricity_units
      applies_to: "electricity"
      rule: "MJ = 3.6 * kWh; preserve metered electrical quantity and supply voltage/boundary before normalization by P."
      inputs:
        - cp_utilities
        - cp_mass
      output: "MJ per kg"
      source_ids:
        - defra-sg6-2011
    - id: constituent_mass
      applies_to: "ink_black; ink_cyan; ink_magenta; ink_yellow; fount; wash; ipa"
      rule: "m_i = supplied_mass * actual_wet_mass_fraction_i; all supplied-mixture fractions sum to 1 with uncertainty disclosed. Preserve whole formulation, water, dry solids and active bases; constituent ledgers are not duplicate purchases."
      inputs:
        - cp_formulas
      output: "kg constituent in physical balance"
      source_ids:
        - epa-litho-ctg-2006
    - id: species_release
      applies_to: "ipa_air; ethanol_air; glycol_air"
      rule: "L_i = sum(c_i,k * V_k * 0.000001), with species-specific c in mg/m3 and V in m3 at matching wet/dry/T/P basis and operating interval; normalize by P. Other concentration definitions need actual molecular-mass/analytical-response conversion. A residual balance retains stock, product, liquid/cloth and recovered fates; unseparated species remain unresolved."
      inputs:
        - cp_species
        - cp_formulas
        - cp_mass
      output: "kg species per kg"
      source_ids:
        - epa-litho-ctg-2006
    - id: particle_intervals
      applies_to: "pm25; pm2510; pm10"
      rule: "Compatible cumulative PM10 minus same-condition PM2.5 yields only the middle interval; total particles minus PM10 yields only the coarse interval. Match volume/T/P/wet-dry/sampling periods and uncertainty; no arbitrary size split, and do not clip a negative difference to zero to hide measurement conflict."
      inputs:
        - cp_dust
        - cp_mass
      output: "Separate kg interval per kg"
      source_ids:
        - defra-sg6-2011
    - id: refrigerant_balance
      applies_to: "r134a_input; r134a"
      rule: "Leakage = initial equipment and cylinder stock + external purchase/receipts - final equipment and cylinder stock - exported recovery/other measured removals, for the same period and chemical identity; retain uncertainty and service measurements, never equate purchase with leakage."
      inputs:
        - cp_refrigerant
        - cp_mass
      output: "kg leakage per kg"
      source_ids:
        - defra-sg6-2011
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Check actual name, CAS, hard route, medium/submedium, carbon origin, reference property/unit. Separate identity acceptance from provider quantity compatibility and disclose misplaced classifications."
      evidence: "Provider and identity originals"
    - id: physical_balances
      applies_to: "print"
      requirement: "Close independent stage physical paper-fibre/pigment/mineral/vehicle/resin dry solids, water, energy and fossil/biogenic carbon, including actual oxidation/oxygen exchange, deposits, dust and stocks. Measurable oxidation changes require reactant/product evidence and separate species exchanges; do not force an unmeasured input total to equal finished mass."
      evidence: "Original stage ledgers, composition tests and uncertainty"
    - id: full_formulas
      applies_to: "print"
      requirement: "A data package cannot claim completeness without every ink/fountain/wash complete formula. Unknown ingredients remain specific debts; a hazard-ingredient table or site typical ratio is not the full formula."
      evidence: "Full supplier formulas, lots and species samples"
    - id: air_completeness
      applies_to: "print"
      requirement: "Reconcile complete formulations with actual paper dust, ink mist, volatiles and refrigerant. Detection limits require methods/uncertainty and do not establish true zero. Do not add VOC or total-carbon summary to its individual LCI species."
      evidence: "Outlet/fugitive measurements, analytical response and control conditions"
    - id: coverage
      applies_to: "print"
      requirement: "Same-period coverage includes make-ready, cleaning, changes, downtime, rejects and all supply/transport/receiving treatment; limited invoices or advertised capacity are not a complete factory survey."
      evidence: "Campaign records and external links"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Require exactly one product output linked by finished and the reference UUID, equal to 1 kg net accepted newspaper. English/Chinese reference amounts, row IDs, chemical identity, denominator, collection aggregation and formulas must match. Verify actual coldset equipment and absence of heatset/UV operation independently of frequency. Missing newsprint/prepress supply, complete ink/fountain/wash formulas, actual outdoor species, provider basis, receiver treatment or important quantities prevents completeness. A blank atomic-flow UUID is not zero; correction flows, adjacent chemicals and contrary routes cannot close it. Particle intervals do not overlap; captured/returned dust is not duplicated as outdoor emission; merged residues cross the boundary once. Keep physical and allocated-burden ledgers and expose performed/skipped/unresolved checks. No universal recipe, furnace, VOC/dust/leakage or wet/dry quantity defaults are supplied. Different old AP-42 newspaper-retention and later CTG values are applicability cautions, never proof of zero factory VOC. [epa-ap42-printing-1981, epa-litho-ctg-2006, defra-sg6-2011]"
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Wet-coldset unbound-newspaper manufacture with compatible upstream and receiving-treatment links; daily and actual route-matched non-daily outputs"
  excluded_use: "All-periodical coverage, heatset/UV/waterless/bound journals, full reading service, complete LCI/LCIA from identity success without formulas/site quantities"
  required_metadata: "Required qualifiers; P; physical/burden ledgers; each colour formula; supply/receiver; method selection and quantity bases"
  required_quality_disclosure: "Measured/unmeasured exchanges, blank UUIDs, formula/species gaps, source classification defects, missing official Chinese name, provider matching, allocation/uncertainty and review state"
  update_trigger: "Changed paper/printing/setting/binding route, formulas, prepress, utilities, packing, treatment, species or provider reference"
data_sources:
  - id: "jrc-sts-2020"
    type: "official_guidance"
    reference: "European Commission JRC, BAT Reference Document on Surface Treatment Using Organic Solvents (2020), https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2021-06/jrc122816_sts_2020_final.pdf"
    used_for: "§11.2 printed pp344–345/PDF383–384: generic wet-offset and coldset/heatset distinction only; §21.7.3.1–2 printed p989/PDF1028: newspaper versus magazine route context. Heatset virtual-plant tables, quantities and limits not adopted."
  - id: "defra-sg6-2011"
    type: "official_guidance"
    reference: "UK Defra, Sector Guidance Note SG6 (11), February 2011, https://assets.publishing.service.gov.uk/media/5a80811ded915d74e33facf5/surface-treatment-using-solvents-sector-guidance-note-sg-6-11.pdf"
    used_for: "§§3.36–3.38 printed p30/PDF36: coldset absorption/oxidation, dampening and blanket cleaning; Table 9 printed p32/PDF38: coldset cleaning solvent releases; finishing printed p34/PDF40: paper cutting/trim dust and collected waste. Table 9 contains a contradictory parenthetical on lithographic dampening; it is not adopted over the explicit §3.36 wet-offset description. Historical technical scope only, no current legal compliance, limits or factor defaults."
  - id: "epa-litho-ctg-2006"
    type: "official_guidance"
    reference: "US EPA, Control Techniques Guidelines for Offset Lithographic Printing and Letterpress Printing, EPA-453/R-06-002 (September 2006), https://nepis.epa.gov/Exe/ZyPDF.cgi?Dockey=P1009O71.txt"
    used_for: "IV.A printed pp7–8/PDF13–14, comparative letterpress IV.B and VOC-source overview printed p9/PDF15, and Appendix A printed p19/PDF25: constituent families, fountain aids, cleaning, species/material-fate and volatile-content test scope. D6419/Method24 cited only as method-selection discussion, not acquired full procedures. Regulatory VOC/ink-oil/shop-towel retention percentages are not universal factory factors."
  - id: "epa-ap42-printing-1981"
    type: "official_guidance"
    reference: "US EPA AP-42 §4.9.1 General Graphic Printing, 4/81 reformatted 1/95, https://www.epa.gov/sites/default/files/2020-10/documents/c4s09-1.pdf"
    used_for: "§4.9.1.1.1/PDF1–2: historic newspaper line contrasted with a heatset publication-line figure; §4.9.1.2/Table4.9.1-1/PDF6–7: old retention defaults explicitly excluded. No zero-VOC conclusion, ink ratio or generic factor adopted; plant evidence and later CTG need separate applicability assessment."
  - id: "coldsetinnovation-production"
    type: "literature"
    reference: "ColdsetInnovation Fulda, COLDSET / ZEITUNGSPRODUKTION, producer technical sheet, https://www.coldsetinnovation.de/wp-content/uploads/2017/08/A4_Coldset-Innovation_Technische-Daten_Zeitungsproduktion_webRZ.pdf"
    used_for: "PDF1: explicit rotary offset coldset and process-colour newspaper route; no spot colours. Product formats, screen/tone settings and area coverage are site specifications, not universal mass/ink/quality defaults; actual ink formula and emissions undisclosed."
  - id: "coldsetinnovation-offering"
    type: "literature"
    reference: "ColdsetInnovation Fulda, first-party newspaper production offering, https://www.coldsetinnovation.de/"
    used_for: "Zeitungsdruck: same coldset operator produces daily and weekly newspapers. Supports frequency-independent method reuse, not coverage of every periodical, supplied recipe or measured LCI; optional stitches/special formats remain outside the selected unbound route."
  - id: "kba-naumann-2017"
    type: "literature"
    reference: "Koenig & Bauer, Modern Commander CL to mark the 50th anniversary of the company (11 October 2017), https://investors.koenig-bauer.com/en/publications/press-releases/details/article/modern-commander-cl-to-mark-the-50th-anniversary-of-the-company/"
    used_for: "Named operating newspaper installation with reelstands, offset towers and KF5 jaw folder. Hardware case only; no full plant survey, current recipe/utility/zero-release assumption."
  - id: "kba-commander-cl"
    type: "literature"
    reference: "Koenig & Bauer, Commander CL product description, https://www.koenig-bauer.com/en/products/p/commander-cl"
    used_for: "Spray dampening and optional wash/plate change/heatset extension. Installed features and dryer absence must be checked; capability is not operating inventory."
  - id: "hubergroup-good-news"
    type: "literature"
    reference: "hubergroup, INKREDIBLE GOOD NEWS, https://www.hubergroup.com/us/en/print-solutions-division/family/inkredible/inkredible-good-news"
    used_for: "First-party coldset process-ink family existence only; not a full recipe or proof of a named printer’s supply. Supplier complete formulation, SKU/colour and actual consumption are mandatory."
