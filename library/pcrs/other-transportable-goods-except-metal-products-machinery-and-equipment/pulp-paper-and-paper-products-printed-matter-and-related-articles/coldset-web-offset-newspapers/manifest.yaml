review_metadata:
  scientific_review: "Independent source, atomic identity, bilingual method and native property/unit review completed after bounded repairs. Scientific publication approval remains pending; candidate authored methodology retained. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  classification_scope_review: "Single-owner scope: CPC 3.0 32300 only, limited to wet-coldset folded unbound newspaper-form publications on uncoated absorbent newsprint. UNSD 30 June 2025 explanatory notes p150 define daily as at least four publications per week, not seven. Actual publication schedule/dates, issue, edition, regional edition and news/periodical reading purpose require job evidence. CPC 32410/32420/32490 are excluded even when printed by the same coldset route; operator weekly production is counterevidence to inferring category from equipment. Existing 32300 acceptance remains governed by the canonical mapping; no shared mapping is edited here. Independent review of this scope amendment and scientific/translation approval remain pending."
  unresolved_flow_rows:
    - "plate"
    - "fount"
    - "wash"
    - "blanket"
    - "strap"
    - "lubricant"
  identity_limitations:
    finished: "Broad mechanical Printed Matter identity conditionally includes paper newspaper subset without a contrary manufacturing route. CPC 32690 differs from the sole 32300 category; source classification clarification remains pending. No postal or 3D-printing background is selected."
    "ink_black/ink_cyan/ink_magenta/ink_yellow": "Broad solvent/oil-based flat-printing-ink identity does not establish actual colour, coldset recipe, supplier gate or mixture fractions. Use only compatible conventional oil-based coldset paste; every actual pigment/vehicle/binder/additive and carbon origin is required from complete provider formulation. No UV, water-based or optical-assembly substitution."
    electricity: "1–35 kV grid-average consumption boundary only. Actual supply voltage/country/time and transformer-loss/provider conventions must match; other voltages require verified alternatives. Net calorific value is the exact reference property."
    water: "Broad product water identity has preserved legacy classification, not a supply-water treatment specification. Provider/source quality and wet-mass basis still required."
    ipa: "China production mix. Actual provider geography/gate/purity and water content remain required; optical-assembly/antiseptic record rejected."
    film: "Physical PE film name/CAS/comment accepted conditionally; CPC 29220 luggage field is defective and source clarification remains required. Actual supplied film/grade and provider needed."
    lubricant: "No adopted UUID. Candidate 66628f20 carries a hard 40.5 MJ/kg name qualifier; actual numeric specification and gross/net, dry/wet, temperature and grade/additive compatibility are unproven. Mass reference and treating oil as maintenance rather than fuel do not waive this hard restriction."
    plate: "Prepared coated aluminium plate identity unresolved: polystyrene PS Plate, bare anodized substrate and combined non-daily plate/files do not match the complete prepared plate."
    wash: "Inkjet printhead cleaner identity rejected. Actual coldset blanket/roller wash full formulation and compatible product identity needed."
    fount: "Specific coldset wet-offset supplied concentrate identity unresolved. Complete recipe including low-level nonhazardous ingredients needed; SDS is not sufficient."
    strap: "PP resin/fibre/twine/cable tie are not manufactured packaging strap."
    collected_dust: "Broad non-metal industrial Dust waste with Mass/kg and no contrary material/route conditionally locates the captured paper/ink-dust subset. Actual fibre/mineral/ink composition, moisture, internal return, receiver treatment and provider reference remain mandatory; this is not an airborne particle flow or kiln ash."
    r134a: "Official Chinese baseName absent for elementary HFC-134a; canonical chemical token preserved. Product make-up must be actual identified R134a, not source proxy or industrial freezer identity."
    "ethanol_air/glycol_air/ipa_air": "Conditional identities only. Actual CAS/formulation/outdoor release and carbon origin require site evidence. They do not resolve unknown petroleum fractions or all VOC."
    ww: "Broad bdfc32cf waste-liquid identity is restricted to actual physically liquid press-cleaning whole-mixture transfer, with measured volume/density/temperature/water/solids and receiver compatibility. No dry-solids-only quantity or direct receiving-water discharge."
    r134a_input: "210b4222 generic R134a/tetrafluoroethane Product/Mass identity has no freezing/ship/proxy-use restriction; raw CAS/purity/provider state are unspecified and require actual equipment and supplier certification. dd298c73 Aluminium-content record and sector/proxy cases are rejected; no default charge, dose or mass-balance exclusion."
    cloth: "dd9f2248 positive fabric/cloth/woven-fabric naming identifies actual cotton textile. Raw-cotton CPC01921 and cotton-plant comment remain source-quality debts; no raw-cotton cultivation background is selected. Water-treatment-specific cotton cloth remains incompatible."
    "spent_plate/spent_cloth/spent_blanket": "851fd235 broad industrial solid waste locates each physically solid whole spent assembly as separate exchanges with actual coatings/ink/solvent/water. Not pure aluminium/rubber/textile recycling, no automatic hazard class or receiver route."
    "spent_wash/spent_fount": "bdfc32cf broad industrial waste liquid identifies each actual physically liquid whole-mixture transfer separately; full as-exported mass and actual composition/density/temperature/water/solids/receiver remain required. Generic hazard prose is not a site hazard classification."
    blanket: "Bedding blanket or couch-felt/paper-machine fabric does not establish a composite ink-transfer blanket; remains unresolved."
  foreground_completeness: "This is a method, not measured factory data. Actual full ink/fount/wash formulations, species-resolved air releases, water/solids/carbon balances, chiller nameplate/leakage and compatible providers must be collected; important missing species/identities/quantities prevent complete downstream datasets. No positive quantities, zero emissions or historical retention defaults are supplied."
