system_boundary:
  rules:
    - rule_id: boundary_conversion
      applies_to: "wallcovering_converter"
      rule: "Include receipt losses, adhesive preparation/dilution, lamination/drying, cooling, inspection/trimming/reeling, packaging, water-only cleaning and attributable auxiliary operations in one converter unit; retain separately measured stages. Do not emit an intermediate laminate under the final reference UUID a second time."
      source_ids:
        - desima-manufacture
        - jrc-textiles-bref-2023
    - rule_id: boundary_upstream
      applies_to: "linen_face; paper_backing; laminating_adhesive"
      rule: "A purchased fabric carries spinning/weaving and all actual dye/pretreatment/impregnation burdens through upstream links. Backing manufacture requires actual pulp/paper and reinforcement evidence; the unreinforced wallpaper-base route is not a proxy for cellulose/PET nonwoven backing. No sawmill or plywood survey supplies papermaking evidence."
      source_ids:
        - jrc-textiles-bref-2023
        - jrc-paper-bref-2015
    - rule_id: boundary_treatment
      applies_to: "cleaning_effluent; laminate_trim; adhesive_waste; collected_dust"
      rule: "Handover to an external receiver is a waste exchange plus linked transport/treatment. It is not also a foreground elemental water/pollutant release. Document any real split branch; on-site effluent treatment needs an extension including its chemicals, sludge and direct releases."
      source_ids:
        - jrc-paper-bref-2015
        - jrc-textiles-bref-2023
    - rule_id: boundary_finish
      applies_to: "linen_face; laminating_adhesive"
      rule: "Purchased retained treatments require declared supplier chemistry and mass/state evidence. Converter-applied stain repellents, FR or decorative coatings, onsite dyeing and additional mixed chemicals are outside this selected route; do not omit them if actually performed."
      source_ids:
        - innovations-confluence
        - jrc-textiles-bref-2023
boundary_abstraction:
  declared_starting_condition: "Purchased finished wet-processed woven linen, paper backing, one premixed aqueous laminating adhesive and separate utility/packaging supplies"
  starting_condition_role: "Foreground conversion starting condition; not an upstream life-cycle cut-off"
  product_classification_scope: "The paper-backed plain-woven pure-linen subset of textile wall coverings; CPC label does not establish full coverage"
  recursive_input_rule: "Internal laminate, adhesive, condensate and recovered dust transfers have identical quantities at sending and receiving stages and are counted only once at the external boundary. Purchased same-category material needs a declared compatible upstream gate; do not recurse indefinitely or duplicate final product outputs."
  upstream_dataset_requirement: "Require flax cultivation/retting/fibre preparation, yarn spinning, weaving and actual wet processing/finishes in the fabric chain; actual backing pulping/papermaking, PET reinforcement/binders where used; adhesive, packaging, utilities and external waste treatment. Match material, quantities, geography/year and supplier boundaries."
  disclosure: "Declare separate stage meters, upstream links, transport coverage, utility gates, waste receivers, gaps and capital-equipment treatment. A source or process outside the foreground is not assumed zero."
