allocation_rules:
  - rule_id: allocation_separate
    applies_to: "wallcovering_converter"
    rule: "Retain the complete physical process graph and unallocated mass/water/carbon ledger separately from the allocated environmental burden ledger. Internal sending/receiving transfers remain equal; actual product, packaging and waste masses are not multiplied by burden shares."
    source_ids:
      - ec-ef-2021
  - rule_id: allocation_hierarchy
    applies_to: "wallcovering_converter"
    rule: "First investigate direct subdivision or justified system expansion; use a demonstrated causal physical relationship if allocation cannot be avoided. Other relationships, including economic allocation, require explaining why prior options fail, period/gate-consistent values and sensitivity. No fixed allocation share is given."
    source_ids:
      - ec-ef-2021
  - rule_id: allocation_quality
    applies_to: "finished_wallcovering; laminate_trim; collected_dust"
    rule: "Allocate common line demand across actual grades using measured causally relevant drivers and retain their totals. Rejected laminate and waste do not become saleable co-products merely because sold; determine actual status and receiver function. No automatic avoided virgin-material or energy credit."
    source_ids:
      - ec-ef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "wallcovering_converter"
      flow_role: "Accepted final delivery"
      record_type: "calibrated measurement"
      raw_fields: "article; batch/roll; acceptance; gross kg; actual core/package tare kg; net kg; width/length; measured kg/m2; actual water fraction; opening/closing finished stocks"
      collection_method: "Weigh accepted rolls with calibrated scales and measured matching tare; reconcile production/warehouse records. Use a validated water-specific method with disclosed composite/finish interference, not unverified drying loss as water. Aggregation: Sum accepted net wallcovering kg S; report per 1 kg reference flow"
      unit: "kg; m; m2; kg/m2"
      frequency: "Each roll/batch and period reconciliation"
      temporal_coverage: "Same declared common reporting period"
      site_scope: "One converter site and defined pure-linen article family"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; tare logs; water-method uncertainty; acceptance and stock reconciliation"
    - protocol_id: cp_supplies
      process_id: "wallcovering_converter"
      flow_role: "Each purchased constituent, packaging and actual maintenance component"
      record_type: "measured receipt/issue/return"
      raw_fields: "row_id; supplier/grade; invoice; batch; wet kg; solids/water; polymer/CAS/residuals; backing fibre/PET/binders; fabric dye/finish; opening/closing stock; delivered package tare"
      collection_method: "Weigh receipt, issue and returns; reconcile actual stock movements and supplier composition/test records. Count-to-mass packaging conversion uses measured same-grade pieces. Verify upstream gate/reference quantity independently. Aggregation: Net attributable native-unit consumption divided by S; per 1 kg reference flow"
      unit: "kg; actual count; mass fraction"
      frequency: "Each batch/lot and stock period"
      temporal_coverage: "Same cp_output period, including rejected runs"
      site_scope: "Supplies physically attributable to selected converter articles"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier grade/SDS/primary records; scales; measured solids; transaction/stock checks"
    - protocol_id: cp_utilities
      process_id: "wallcovering_converter"
      flow_role: "Each water, electricity, gas and steam row"
      record_type: "metered native quantities/state"
      raw_fields: "stage; meter start/end; electricity kWh and voltage; water m3/density/T; gas m3/T/P/wet-dry composition/Z/provider conditions; steam supply/return kg/P/T/dryness/enthalpy; drains; condensate; downtime; shared-line drivers"
      collection_method: "Calibrated stage meters and state sampling; distinguish purchased utility from internal generated/returned transfer. Match provider reference basis and loss/generation gate before linking, retaining raw physical quantities separately. Aggregation: Each attributable native-unit amount divided by S; per 1 kg reference flow"
      unit: "kWh; MJ; kg; m3; state units"
      frequency: "Meter intervals/state changes plus each batch attribution"
      temporal_coverage: "Same cp_output period with operating/load coverage"
      site_scope: "Converter and attributable on-site utility equipment only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; supply contract/reference definition; enthalpy and volume-convention reconciliation"
    - protocol_id: cp_waste
      process_id: "wallcovering_converter"
      flow_role: "Each independent exported waste"
      record_type: "weighed external handover"
      raw_fields: "row_id; wet kg; dry solids; water; linen/cellulose/PET/adhesive/finish fractions; COD/BOD/chemistry for liquid; generated/captured; returned; stock; exported; receiver; transport and treatment"
      collection_method: "Weigh external handover separately from internal reuse and generation; use measured density for liquid volumes. Test actual composition and acceptance/hazard state with receiver evidence; do not infer recipe from broad waste name. Aggregation: Each attributable exported native-unit quantity divided by S; per 1 kg reference flow"
      unit: "kg; m3; concentration and fraction units"
      frequency: "Each consignment and representative composition sampling"
      temporal_coverage: "Same cp_output period with stocks reconciled"
      site_scope: "Converter external waste gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighbridge/receiver receipts; sampled composition and density; waste classification; equal internal transfer records"
    - protocol_id: cp_air
      process_id: "wallcovering_converter"
      flow_role: "Each species or exclusive particle bin"
      record_type: "sampled/continuously monitored emission"
      raw_fields: "row_id/species/CAS; fossil/biogenic origin; stack/fugitive point; raw concentration; gas flow; T/P; wet/dry; O2 correction; sampling duration; hours/load/control; PM fractions; residual-monomer screening; NOx and NMVOC mass conventions; detection limit"
      collection_method: "Measure representative post-control emissions and simultaneous compatible exhaust volume/operating coverage; include starts/stops and fugitive sources. Estimate unmeasured components only with a reviewed applicable method and uncertainty. Verify raw analytical and database/LCIA conventions. Aggregation: Each attributable species or exclusive-bin emitted kg divided by S; per 1 kg reference flow"
      unit: "kg; mg/Nm3; Nm3; h; state units"
      frequency: "Actual representative operating/load intervals with declared coverage"
      temporal_coverage: "Same cp_output period; disclose unsampled conditions"
      site_scope: "Actual outside-air releases from converter and on-site gas-fired heater/furnace only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling/calibration reports; concentration-volume state agreement; controls/load records; speciation/particle reconciliation and uncertainty"
  calculation_rules:
    - id: net_product
      applies_to: "finished_wallcovering"
      rule: "S = sum(accepted roll gross kg - corresponding measured core and packaging tare kg); S must be positive and stock-consistent in the common period."
      inputs:
        - cp_output
      output: "Net accepted product S in kg"
      source_ids: []
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Each inventory amount = its measured attributable native-unit period total / S; final reference output = 1 kg. Preserve the unnormalized physical ledger. Do not average batch ratios without weighting by accepted net mass."
      inputs:
        - cp_output
        - cp_supplies
        - cp_utilities
        - cp_waste
        - cp_air
      output: "Native unit per 1 kg reference flow"
      source_ids: []
    - id: dry_components
      applies_to: "linen_face; paper_backing; laminating_adhesive; finished_wallcovering; laminate_trim; adhesive_waste; collected_dust; cleaning_effluent"
      rule: "Dry solids = measured wet mass × measured dry-solids fraction; water = measured wet mass × independently measured water fraction; other retained constituents = wet mass - dry solids - water. Quantify non-water volatile/liquid components separately and verify no overlapping fractions; drying loss is not all water. Reconcile each species retained, emitted or exported. Map actual constituent quantity to provider supply state; no assumed fibre/solids ratios."
      inputs:
        - cp_output
        - cp_supplies
        - cp_waste
      output: "Separate wet, dry and water ledgers"
      source_ids: []
    - id: energy_conversion
      applies_to: "electricity; natural_gas; steam"
      rule: "Electricity MJ = metered kWh × 3.6. Convert gas measured volume to provider reference T/P/wet-dry/Z conditions with a documented thermodynamic method. Net steam heat = incoming mass×specific enthalpy - all outgoing mass×specific enthalpy, in matched units; losses/state uncertainty retained. This net heat does not equal an unverified GCV reference quantity."
      inputs:
        - cp_utilities
      output: "Compatible native-reference utility quantity and separate physical heat ledger"
      source_ids: []
    - id: emission_load
      applies_to: "pm_fine; pm_coarse; pm_over10; co2_fossil; co2_biogenic; co; nox; methane; n2o; so2; ammonia; vinyl_acetate; nmvoc"
      rule: "Emitted kg = sum(matched concentration mg/Nm3 × exhaust Nm3)/1000000, plus separately measured fugitive kg. If using rate, integrate over measured covered hours. Preserve matching wet/dry/T/P/O2 states; a permit concentration or detection limit is not measured total load."
      inputs:
        - cp_air
      output: "Actual period species/bin kg before division by S"
      source_ids:
        - jrc-paper-bref-2015
    - id: balance_ledgers
      applies_to: "wallcovering_converter"
      rule: "Reconcile incoming constituents, finished product including retained treatments, exported waste, actual water evaporation and stock change in wet/dry/water/carbon units. Record actual packaging delivery separately. Combustion carbon and air/oxygen accounting are a separate physical balance; retain fossil and biogenic origins. Equal internal transfers cancel at the outer gate. Do not force closure by inventing emissions or scaling physical co-products by burden shares."
      inputs:
        - cp_output
        - cp_supplies
        - cp_utilities
        - cp_waste
        - cp_air
      output: "Reconciled physical ledgers with residuals and uncertainty; separate allocated burden ledger"
      source_ids:
        - ec-ef-2021
  data_quality_requirements:
    - id: identity_and_grade
      applies_to: "all inventory rows"
      requirement: "Investigate actual maintenance components separately: laminating/drive belts, rollers and replacement covers, trimming blades, dust filters, lubricants and any cleaning consumables. Record actual composition/state, stocks, service life/use allocation, measured mass, route/gate and spent material receiver; add compatible atomic input/output rows for actual use and disclose missing identities/amounts, without an invented bundle or assumed zero. Each adopted UUID must match actual substance/material, route/state, medium and native property. Broad identity remains distinct from supplier dataset representativeness and reference-quantity compatibility. Blank UUIDs and provider/convention gaps remain explicit."
      evidence: "Original identity fields and actual supplier/receiver records"
    - id: textile_and_backing
      applies_to: "linen_face; paper_backing"
      requirement: "Confirm pure woven linen face and actual cellulosic backing structure. Retained finishing, PET reinforcement and binder data are mandatory when present; no paper-wallpaper furnish or textile blend default."
      evidence: "Upstream chain, batch grade and primary composition/route evidence"
    - id: completeness
      applies_to: "wallcovering_converter"
      requirement: "Review every row for applicable/measured/not_applicable/missing status. Document proof of absence; add separate actual chemicals, packaging, wastes and emissions outside the minimum rows with method review where scope changes."
      evidence: "Site process walkdown, recipe/SDS, meter and receiver register"
    - id: physical_vs_burden
      applies_to: "wallcovering_converter"
      requirement: "Preserve unallocated physical balances, equal internal transfers, output acceptance and stocks independently from allocated burdens; disclose residuals, detection limits and uncertainty."
      evidence: "Separate linked physical and environmental ledgers"
    - id: temporal_provider
      applies_to: "all inventory rows"
      requirement: "Match one foreground reporting period and actual supplier region/year/technology and supply gate; disclose upstream transport, utility loss and waste treatment gaps."
      evidence: "Dated primary records and verified provider definitions"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_wallcovering"
    rule: "Exactly one product output represents the reference object and declares 1 kg net delivered product. All applicable rows and collection aggregation use the same accepted net S; area/moisture or a package gross mass cannot replace it."
    source_ids: []
  - rule_id: validation_scope
    applies_to: "linen_face; paper_backing; laminating_adhesive"
    rule: "Verify the selected physical face/backing, supplied-grade route and upstream dye/impregnation/finishes. Reject unverified conversions or contrary CAS/material/route; actual additional finishing or treatment requires supported scope extension."
    source_ids:
      - innovations-confluence
      - jrc-textiles-bref-2023
  - rule_id: validation_balance
    applies_to: "wallcovering_converter"
    rule: "Require independent wet/dry/water/carbon and packaging ledgers, acceptance/stock reconciliation and same-amount internal links. Assess residuals against actual measurement uncertainty; allocation cannot repair an inconsistent physical balance."
    source_ids:
      - ec-ef-2021
  - rule_id: validation_release
    applies_to: "pm_fine; pm_coarse; pm_over10; collected_dust; nox; nmvoc; cleaning_effluent"
    rule: "No nested PM double counting, captured-dust duplication, NOx/N2O conflation, VOC-species/total duplication or external-treatment/direct-water branch duplication. An unknown NOx/steam/provider basis is a pending linkage, not a validation pass for that dataset."
    source_ids:
      - jrc-paper-bref-2015
      - jrc-textiles-bref-2023
      - epa-ap42-gas
  - rule_id: validation_carbon
    applies_to: "co2_fossil; co2_biogenic; methane"
    rule: "Keep actual fossil and biogenic releases in LCI regardless of a downstream GHG reporting convention; do not count retained linen/paper carbon as a release or import an external receiver's emissions into this converter twice."
    source_ids: []
  - rule_id: validation_evidence
    applies_to: "all inventory rows"
    rule: "Identity success, a source discussion, missing monitor or blank UUID does not supply an amount. Require real collected records or an applicable reviewed calculation; expose missing rows/coverage, unsupported relationships and uncertainty before dataset use."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset, only after actual data completion and separate dataset review"
  downstream_use: "Gate-delivered paper-backed woven-linen wallcovering input with verified upstream material/utility and external-treatment links"
  allowed_use: "The declared pure-linen/paper-backed aqueous lamination route and actual article, provider and reporting-period conditions"
  excluded_use: "Other faces/lamination/finishing routes; paper wallpaper recipe; unconverted backing; installed-wall service equivalence; automatic fire/acoustic or lifetime claim"
  required_metadata: "Article and full qualifiers; net reference/area/moisture; constituent formulations/retained treatments; process-stage and utility gates; supplier/receiver/transport boundaries; source period/region; allocation and dataset identifiers"
  required_quality_disclosure: "Measured coverage, non-use evidence, uncertainty, physical/burden ledgers, blanks, unresolved provider/convention links, source classification defects and scientific-review status"
  update_trigger: "Face/backing/finish/adhesive or supplied solids change; utility pressure/voltage/mix or gate change; new waste receiver/control; new period or corrected source identity/quantity evidence"
data_sources:
  - id: "innovations-confluence"
    type: "literature"
    reference: "Innovations, Confluence, manufacturer product specification; https://www.innovationsusa.com/item/confluence ; product description and Specifications, accessed 2026-10-11"
    used_for: "Market example of basic-weave pure linen face and paper backing; Limitations: Manufacturer qualitative structure only; no adhesive/dye/finish recipe, quantity default or factory heat-route claim"
  - id: "desima-manufacture"
    type: "literature"
    reference: "Desima, Textile Wallcoverings; https://www.desima.com/textile-wallcoverings/ ; Manufacture: raw materials, dyeing, weaving and wallcovering manufacturing, accessed 2026-10-11"
    used_for: "Actual yarn/fabric/backing and adhesive lamination, trimming and upstream textile distinction; Limitations: Single producer; polyester-warp variants and yarn-bath/loom case quantities are not this pure-linen recipe or sector defaults"
  - id: "jrc-textiles-bref-2023"
    type: "official_guidance"
    reference: "JRC, Best Available Techniques Reference Document for the Textiles Industry, EUR 31316 EN, 2023; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2023-01/TXT_BREF_2023_for_publishing%20ISSN%201831-9424_final_1_revised.pdf ; §§2.1.1.12,2.5.1,2.10.1,2.10.3, printed20,35–36,116,125–126 (PDF55,70–71,151,160–161)"
    used_for: "Flax/fabric upstream context, lamination/drying and formulation-dependent release screening; Limitations: Technical sector descriptions only; no guarantee of any producer formulation, chemical presence, process temperature or emission amount"
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board, 2015; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf ; §§2.2.2.1,2.2.2.2,7.1.10, printed48–50,670 (PDF86–88,708)"
    used_for: "Upstream paper/manufactured net-output distinction, matched concentration-flow-period monitoring, paper-layer cutting dust screening; Limitations: Not a textile-wallcovering or PET nonwoven recipe; paper broke recycling cannot be assumed for bonded composite scrap; no mill case quantities or BAT-AEL factors transferred"
  - id: "epa-ap42-gas"
    type: "official_guidance"
    reference: "US EPA, AP-42 §1.4 Natural Gas Combustion; https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf ; §§1.4.1–1.4.3, PDF1–2, original printed footer10/26"
    used_for: "Conditional external natural-gas boiler/furnace emission species and measurement priority; Limitations: Preserve actual publisher footer edition marking without inferring chronology; no default gas composition/heating value, emission factor or permit/compliance limit; not electric/steam/biomass emissions"
  - id: "ec-ef-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I §4.5, 2021; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf ; PDF63–64"
    used_for: "Subdivision/system-expansion and justified physical/other allocation hierarchy; Limitations: Method hierarchy only; no PEF-conformity, sector allocation share, recycling default or avoided-product credit claimed"
