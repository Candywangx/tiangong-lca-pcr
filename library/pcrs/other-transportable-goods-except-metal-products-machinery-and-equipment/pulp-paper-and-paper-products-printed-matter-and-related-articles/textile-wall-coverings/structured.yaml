measurement_rules:
  - id: reference_mass
    applies_to: "finished_wallcovering"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "S is the sum of accepted net wallcovering mass from calibrated gross-minus-measured-tare weighings for the reporting period. Exclude core, wrap, box and end caps; retain actual delivery moisture. Every exchange uses the same S."
  - id: area_mass
    applies_to: "finished_wallcovering; linen_face; paper_backing"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure width, length and areal mass at matching conditioning/moisture. Area times measured kg/m2 gives kg; never use a catalogue grammage or standard roll length as production mass. Area is supplementary, not a second functional unit."
  - id: supplied_dry_basis
    applies_to: "linen_face; paper_backing; laminating_adhesive; adhesive_waste; laminate_trim; collected_dust; cleaning_effluent"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain supplied wet mass, measured water/dry solids and each known constituent separately. Map to supplier reference quantity only after verifying wet/dry/concentration state. One adhesive row is one purchased formulation; internally mixing extra chemicals requires individual new atomic rows."
  - id: utility_basis
    applies_to: "electricity; process_water; natural_gas; steam"
    required_property_ref:
      name: "Native reference property"
      uuid: ""
    required_unit: "MJ; kg; m3"
    rule: "Electricity native Net calorific value/MJ uses measured kWh × 3.6; no combustion heating value is inferred. Tap water native Mass/kg requires actual density if metered in m3. Gas native Volume/m3 requires matched T/P, wet/dry composition, Z and provider volume definition. Steam mass/state and net heat are separate; no MJ/GCV label proves net delivered heat."
  - id: particle_basis
    applies_to: "pm_fine; pm_coarse; pm_over10; collected_dust"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report escaped atmospheric PM2.5, PM2.5–PM10 and >PM10 as disjoint measured bins. Captured dust, internal return and exported dust are separate physical records; never add nested TSP/PM10/PM2.5 totals."
  - id: emission_basis
    applies_to: "co2_fossil; co2_biogenic; co; methane; n2o; nox; so2; ammonia; vinyl_acetate; nmvoc; water_vapour"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve actual chemical species, fossil/biogenic origin, phase and release compartment. NOx mass versus NO2-equivalent requires monitoring/provider/LCIA agreement and excludes N2O. NMVOC is a documented sum-indicator remainder and cannot duplicate speciated VOC or methane. Water vapour is emitted H2O, not withdrawal."
