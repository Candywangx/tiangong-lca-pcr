  flow_identity_limitations:
    finished: "75ec26b8 physical identity is a moulded-pulp protective insert, with no incompatible furnish/drying constraint. Its auxiliary-use/missing-quantity comment is not adopted as a mass-balance exclusion or quantity/background evidence."
    film: "e64eb06c name, CAS9002-88-4 and comment support actual PE film; CPC29220 conflicts. Retain classification defect and supplier/grade/background clarification debt."
    twine: "0f3c91d9 names PP bundling twine without a manufacture-route contradiction; original farm-gate usage is a case context, not plant quantities. Actual provider and composition require proof."
    recovered_paper: "f140a5a2 broad waste-paper identity requires actual waste handover, grade, received moisture and contaminants; no automatic waste/product status or recycling allocation."
    sludge: "b48b29ab broad paper sludge is restricted here to actual primary fibre/mineral sludge; composition, receiver and background dataset are not supplied."
    oil: "No adopted UUID. Petroleum-derived candidate 66628f20 has a hard 40.5 MJ/kg calorific-value name qualifier; actual supplier composition/additives and gross/net, dry/wet, temperature and numeric specification compatibility are unproven. Its Mass reference does not permit generic mineral-oil adoption."
    reject: "851fd235 broad industrial solid waste is used only for the actual mixed pulping screen/cleaner reject; composition, moisture, receiver and treatment stay explicit. Separately collected fractions need separate rows."
    wastewater: "bdfc32cf broad industrial waste liquid represents whole untreated transferred process liquid; actual temperature/density/water/solids and receiver compatibility remain required. Generic hazardous-language metadata is not this site's hazard classification or composition."
    dust: "2a6c9b60 waste Dust is restricted to actual captured dry paper-finishing dust leaving the site; composition and receiver compatibility remain required. English industrial-collection comment and nonspecific Chinese comment are preserved without inferring a paper-dust factor."
    film_waste: "1cc18dac broad plastic-packaging waste has no hard cleaning/recycling route. Actual as-generated PE dispatch-film offcuts stay a separate row with polymer/contamination/receiver evidence."
    twine_waste: "1cc18dac also identifies actual as-generated PP bundling-twine offcuts as a separate exchange; no bundling or mixing with PE film and no implied mechanical-recycling route."
