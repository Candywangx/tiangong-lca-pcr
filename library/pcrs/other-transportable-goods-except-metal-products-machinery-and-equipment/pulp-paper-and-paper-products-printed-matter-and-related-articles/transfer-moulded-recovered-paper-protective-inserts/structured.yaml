allocation_rules:
  - rule_id: allocation_physical
    applies_to: "physical unit and outputs"
    rule: "Keep an unallocated physical ledger of received/wet/dry fibre, water, product, waste, captured solids, releases and stock changes. Never multiply coproduct physical output or one end of an internal link by an allocation share. Record waste versus useful coproduct status and receiver evidence."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_burdens
    applies_to: "shared environmental burdens"
    rule: "For an attributional insert dataset, first subdivide or directly meter burdens. Where impossible, document a causal physical driver for the shared duty, product scope and period, and reconciled shares summing to one. Economic allocation requires evidence why a physical relationship fails, matching stage-specific prices and sensitivity. Keep a separate burden ledger; no default mass share or automatic recovered-material substitution credit. System expansion would be a separately specified multi-function study."
    source_ids:
      - eu-pef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "p_insert"
      flow_role: "finished"
      record_type: "production/acceptance record"
      raw_fields: "lot; design; net/tare mass; count; wet-basis moisture; accepted/rejected status; stocks; Q"
      collection_method: "Calibrated net product weighing matched to acceptance and stock records; count requires measured design-specific net mass, never a literature per-piece weight"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "one matched representative reporting period; document missing intervals"
      site_scope: "declared insert line and linked utilities/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, reconciliation, laboratory QA and uncertainty"
    - protocol_id: cp_material
      process_id: "p_insert"
      flow_role: "input materials"
      record_type: "receipts, consumption and assay"
      raw_fields: "supplier; grade/CAS; waste handover; wet mass/moisture/ash/contamination; opening/closing stock; PE/PP grade; lubricant state; composition and calorific-value basis"
      collection_method: "Weigh deliveries and stock changes, reconcile issues/returns with actual production; assay fibre solids; verify each material and supplier basis"
      unit: "kg"
      frequency: "each receipt/lot"
      temporal_coverage: "one matched representative reporting period; document missing intervals"
      site_scope: "declared insert line and linked utilities/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, reconciliation, laboratory QA and uncertainty"
    - protocol_id: cp_utility
      process_id: "p_insert"
      flow_role: "electricity; gas"
      record_type: "calibrated meters and supplier definitions"
      raw_fields: "stage meter start/end; kWh; voltage/delivery point; gas m3; T/P; composition; wet/dry basis; Z; supplier background reference conditions; burner configuration"
      collection_method: "Matched boundary meters with submeter or documented causal allocation; compare supplier delivery/reference definitions; preserve gas volume and verify any state conversion"
      unit: "kWh; MJ; m3"
      frequency: "interval meter and bill reconciliation"
      temporal_coverage: "one matched representative reporting period; document missing intervals"
      site_scope: "declared insert line and linked utilities/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, reconciliation, laboratory QA and uncertainty"
    - protocol_id: cp_water
      process_id: "p_insert"
      flow_role: "water; wastewater"
      record_type: "meters, samples and transfer manifests"
      raw_fields: "make-up; circulating white water; wet stock; purge/cleaning transfer; volume; temperature; measured whole-liquid density and water fraction; independently measured suspended/dissolved solids; concentration units; COD/BOD/TSS/nutrients; receiver; destination and stocks"
      collection_method: "Calibrated meters and whole-liquid mass/density measurements at documented temperature; independent water/solids assays and representative flow-matched composites and receiver records; measure treatment condition and prove no direct discharge"
      unit: "kg; m3; reported concentration units"
      frequency: "interval flows, representative campaigns"
      temporal_coverage: "one matched representative reporting period; document missing intervals"
      site_scope: "declared insert line and linked utilities/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, reconciliation, laboratory QA and uncertainty"
    - protocol_id: cp_air
      process_id: "p_insert"
      flow_role: "elementary air rows"
      record_type: "outlet tests, gas/solid balances and fugitive surveys"
      raw_fields: "outlet/source; species/CAS; fossil/biogenic origin; submedium; concentration and units; flow/time; moisture/O2/reference T/P; capture; PM fractions/filterable/condensable; NOx definition; detection limits; uncertainty"
      collection_method: "Measure representative matched concentrations and exhaust volumes including start/stop, dryer/trim fugitive losses and actual leakage; speciate VOCs and reconcile carbon/water; extrapolation requires operating coverage and uncertainty"
      unit: "kg; reported concentration and volume units"
      frequency: "representative monitoring plus continuous operation coverage"
      temporal_coverage: "one matched representative reporting period; document missing intervals"
      site_scope: "declared insert line and linked utilities/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, reconciliation, laboratory QA and uncertainty"
    - protocol_id: cp_waste
      process_id: "p_insert"
      flow_role: "external waste outputs"
      record_type: "weighing, composition and handover"
      raw_fields: "stream; wet mass/moisture/solids; fibre/ash/plastic/metal/ink/oil; contamination; generation/returns; storage; receiver and accepted treatment state"
      collection_method: "Weigh each separately handled stream; sample actual composition and moisture; reconcile dispatch/receiver manifests and internal returns"
      unit: "kg"
      frequency: "each stream/dispatch"
      temporal_coverage: "one matched representative reporting period; document missing intervals"
      site_scope: "declared insert line and linked utilities/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, reconciliation, laboratory QA and uncertainty"
    - protocol_id: cp_balance
      process_id: "p_insert"
      flow_role: "physical stages and shares"
      record_type: "stage/link and allocation records"
      raw_fields: "received/cleaned/wet/dried/accepted quantities; moisture/ash/carbon; white water/stock changes; internal link pairs; operating duties and coproduct evidence"
      collection_method: "Maintain stage-resolved unallocated physical accounts; reconcile both ends of internal links and measured carbon/water/solids; independently derive justified burden shares"
      unit: "kg; justified driver unit"
      frequency: "matched reporting period and each process change"
      temporal_coverage: "one matched representative reporting period; document missing intervals"
      site_scope: "declared insert line and linked utilities/outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, reconciliation, laboratory QA and uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Exchange per 1 kg reference flow = actual compatible period exchange / Q kg accepted net as-sold insert. Keep physical quantities separate from attributed environmental burdens."
      inputs:
        - cp_output
        - cp_material
        - cp_utility
        - cp_water
        - cp_air
        - cp_waste
      output: "normalized exchange"
      source_ids:
        - didone-moulded-pulp-2017
    - id: release_load
      applies_to: "air outlet records"
      rule: "Integrate matched species concentration × actual compatible exhaust volume over measured intervals, with documented units, reference conditions, startup/shutdown and uncertainty. Different NOx/VOC/PM reporting definitions require proven equivalence; no concentration alone is a period mass."
      inputs:
        - cp_air
        - cp_utility
      output: "actual released period mass"
      source_ids:
        - epa-gas-screening
    - id: physical_balance
      applies_to: "unallocated stock, stages and internal loops"
      rule: "Water mass = wet mass × measured wet-basis water fraction; non-water mass = wet mass × (1 − that fraction). Independently measure or validate dry-solids and other non-water constituent accounts; loss on drying need not equal water. Reconcile inputs = outputs + stock change in separate constituent, water and fossil/biogenic carbon ledgers, including actual residues and gases, intake combustion air/oxygen, air moisture, combustion water and uncertainty. Do not invent ash/carbon/oxidation fractions or numerical closure tolerances."
      inputs:
        - cp_balance
        - cp_output
        - cp_material
        - cp_water
        - cp_air
        - cp_waste
      output: "reconciled physical ledgers"
      source_ids:
        - jrc-ppb-2015
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Confirm atomic identity, name/CAS, hard route/material limits, medium/submedium and reference property/unit. A metadata defect or missing identity remains explicit; never substitute a neighbouring flow merely because it resolves."
      evidence: "cp_material; cp_air; cp_waste"
    - id: dq_basis
      applies_to: "supplier and site quantities"
      requirement: "Require traceable matched period, meter calibration, actual dry/wet bases, source-resolved emissions and supplier background compatibility. Unknown differs from zero or demonstrated non-occurrence."
      evidence: "cp_output; cp_utility; cp_water; cp_air"
    - id: dq_scope
      applies_to: "evidence and inventories"
      requirement: "Historical literature and one producer are scope evidence only, not universal recipes or quantitative priors. Document missing monitoring, records, receiver composition/treatment and additional actual species; a provisional methodology is not a completed plant dataset."
      evidence: "all collection protocols"
    - id: dq_physical
      applies_to: "balances and allocated burdens"
      requirement: "Preserve the measured physical map and all internal links at equal quantities, then create a separate justified burden ledger. Investigate residuals using uncertainty, not arbitrary forced closure."
      evidence: "cp_balance"
validation_rules:
  - rule_id: validation_reference
    applies_to: "reference and route"
    rule: "Exactly one product output is the final reference: finished = 1 kg net accepted insert at actual as-sold moisture. Confirm received recovered waste, forming and transfer moulds, oven route and each exclusion/qualifier. Equal purpose, mass or label does not prove route compatibility."
    source_ids:
      - didone-moulded-pulp-2017
  - rule_id: validation_measurement
    applies_to: "all rows"
    rule: "EN/ZH must share reference quantity, denominator, aggregation and formulas. Require property/unit chains and actual provider/monitor quantity equivalence; gas m3 and NOx kg compatibility may not be presumed."
    source_ids:
      - jrc-ppb-2015
  - rule_id: validation_outlets
    applies_to: "physical loops and releases"
    rule: "Reconcile measured water/non-water constituents, independently verified solids and carbon before burden allocation; transferred wastewater uses whole-liquid mass with compatible volume/density/temperature, not dry solids. No double counting internal white water/broke/captured dust, outside-treatment emissions or nested PM intervals. Retain biogenic CO2 in LCI; N2O is separate from NOx. VOC total carbon and COD/BOD/TSS analytical descriptors do not substitute for individual released species."
    source_ids:
      - jrc-ppb-2015
      - epa-gas-screening
  - rule_id: validation_completeness
    applies_to: "completed foreground package"
    rule: "Missing identities, actual amounts, receiver routes, provider/reference equivalence, additional actual flows or unexplained residuals make the dataset incomplete, not zero. Report checks performed/skipped and all gaps. Unknown or unsupported measurements require review; passing content checks establishes neither scientific approval nor TIDAS schema validity."
    source_ids:
      - jrc-ppb-2015
published_dataset_profile:
  dataset_role: "Attributed foreground production of the bounded moulded insert"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Route- and design-compatible protective insert input after all dataset identity/quantity/background gaps are supplied"
  excluded_use: "Full CPC32199 coverage, dry-cut paper or cigarette paper, food-contact/other forming routes, generic recipes, automatic recycling credits or equal-mass protection claims"
  required_metadata: "Reference qualifiers, source/receiver/background references, actual stage physical records, period, normalized exchanges, recycling method and independent burden-allocation ledger"
  required_quality_disclosure: "Verified/conditional/unresolved identities, quantity bases, omitted scope, uncertainty/residuals, checks performed/skipped and remaining gaps"
  update_trigger: "Changed furnish/waste status, forming/drying/additive route, energy supply, treatment receiver, new species/monitoring or resolved identity/basis debt"
data_sources:
  - id: "didone-moulded-pulp-2017"
    type: "literature"
    reference: "Didone et al. (2017), Moulded Pulp Manufacturing: Overview and Prospects for the Process Technology. Packaging Technology and Science 30(6), 231–249. https://doi.org/10.1002/pts.2289 ; https://backend.orbit.dtu.dk/ws/files/130393242/Moulded_Pulp_Manufacturing_Overview_and_Prospects_for_the_Process_Technology.pdf"
    used_for: "Accepted manuscript §1.1 (printed p.3/PDF p.4), §2/2.1 (printed p.6/PDF p.7), §2.2 and Figure 4 (printed pp.7–8/PDF pp.8–9): transfer/oven versus precision hot-mould routes, vacuum forming and mechanical recovered-paper screening. Technology scope only; no historical thickness, moisture, residence-time, throughput or energy values adopted."
  - id: "jrc-ppb-2015"
    type: "official_guidance"
    reference: "JRC (2015), Best Available Techniques Reference Document for the Production of Pulp, Paper and Board. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "§6.1.2, printed pp.551–554/PDF pp.589–592: mechanical repulping, screening, process-water purification and rejects; only corresponding operations, not a moulded-product recipe or Testliner machine layout. §7.1.10, printed p.670/PDF p.708: dry cutting dust as an operation-specific completeness check, not a factor."
  - id: "huhtamaki-recovered-fibres"
    type: "handbook"
    reference: "Huhtamaki, Fibers: recycled and virgin. https://www.huhtamaki.com/en/highlights/sustainability/fibers-recycled-and-virgin/"
    used_for: "Publisher paragraph on post-consumer recovered paper used for wine-bottle protectors and other moulded packaging; historical producer-specific material-use evidence and virgin-fibre food-contact countercontext. Does not prove this site forming/fuel/additive route or generic quantities."
  - id: "epa-gas-screening"
    type: "official_guidance"
    reference: "US EPA, AP-42 §1.4 Natural Gas Combustion, October 2026 disclaimer edition (footer 10/26), pp.1.4-1–1.4-3. https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "Boiler/furnace combustion discussion used for pollutant/speciation screening and source-testing cautions only. No boiler emission factor, gas composition, PM-size assertion or fixed oxidation fraction is transferred to moulded-pulp oven burners."
  - id: "eu-pef-allocation-2021"
    type: "official_guidance"
    reference: "European Commission (2021), Recommendation (EU) 2021/2279, Annex I §4.5, pp.63–64. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Allocation hierarchy and justification of physical/economic relationships. This bounded attributional method adopts no automatic substitution credit, full PEF circular-footprint formula or PEF compliance claim."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:e71807f610547bbb4e57c5526af778341ba8432219de3c369fc99a044c0269d3"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5985"
      family: "system_boundary"
      span:
        start:
          offset: 5985
          line: 60
          column: 1
        end:
          offset: 8757
          line: 80
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Recovered waste paper received in actual delivered waste state; disclose earlier collection/sorting/baling/transport and contamination |\n| starting_condition_role | Foreground production gate; upstream recovery and treatment remain explicit linked burdens |\n| product_classification_scope | CPC 3.0:32199; narrower |\n| recursive_input_rule | Internal white water, off-spec inserts and dust returns remain internal links; externally recovered same-category paper retains its actual handover and compatible upstream dataset once, without recursively re-counting prior product lives |\n| upstream_dataset_requirement | Compatible received waste state, recovery operations and freight; actual water/materials/utility delivery; receiver-specific off-site effluent/waste handling |\n| disclosure | Physical operations and balances, linked background operations, additive absence proof, supply/reference bases, stocks, captured/emitted fractions, receivers, exclusions and gaps |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | production route | Include actual receiving, sorting, mechanical repulping/screening/cleaning and any mechanical refining, stock tanks/pumps, forming vacuum, take-off/transfer, oven heating/fans, actual dry trimming, inspection, dispatch and auxiliaries. Confirm chemical-free stock/water route and the absence of excluded processing from equipment and purchasing records. | didone-moulded-pulp-2017; jrc-ppb-2015 |\n| boundary_recovery | received waste | Waste status/recycled content never establishes zero prior burden. Record legal/physical handover and the governing recycling allocation method; represent earlier recovery and freight once within foreground or supplier background. Missing allocation evidence remains a gap. | jrc-ppb-2015; eu-pef-allocation-2021 |\n| boundary_outlets | water, waste and air | External treatment transfer is a waste exchange, not receiving-water discharge. The selected route includes no on-site biological treatment or direct liquid discharge. Retain chemical-free fibre separation, purge/cleaning water and actual solids. Air rows cover only final outdoor releases after actual capture; shared exhausts require source separation. | jrc-ppb-2015 |\n| boundary_energy | oven and utilities | Record actual electricity and optional pipeline-gas burners. Do not add purchased steam/heat for the same oven duty or infer fuel from the word drying. Actual different fuel, steam, CHP, abatement reagent or onsite biological treatment fails this bounded route until its separate reviewed exchanges/method are available. | didone-moulded-pulp-2017; epa-gas-screening |\n\n"
