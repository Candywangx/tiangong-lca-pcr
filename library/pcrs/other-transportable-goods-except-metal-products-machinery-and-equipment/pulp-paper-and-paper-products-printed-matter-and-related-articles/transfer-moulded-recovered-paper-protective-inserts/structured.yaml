measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q = total accepted net as-sold insert kg for the matched reporting period. Exclude packaging, rejects and unaccepted stock. Every row and collection aggregation uses per 1 kg reference flow."
  - id: moisture_basis
    applies_to: "wet stock and accepted product"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Record actual water mass fraction w on a wet basis: water mass = wet mass × w and non-water mass = wet mass × (1 − w). Non-water mass is not automatically dry solids: independently measure or validate solid, dissolved and nonaqueous constituents using a documented method, including volatile-organic losses where relevant. Use Q at as-sold moisture for normalization, never a literature dry-content default."
  - id: quantity_compatibility
    applies_to: "utility and release rows"
    required_property_ref:
      name: "Verified row reference property"
      uuid: ""
    required_unit: "Verified row reference unit"
    rule: "Prove supplier/reference quantity equivalence for gas volume, electricity delivery, water mass and monitoring species. Identity availability alone does not prove background linkage or conversion. Unknown remains pending."
