system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "production route"
      rule: "Include actual receiving, sorting, mechanical repulping/screening/cleaning and any mechanical refining, stock tanks/pumps, forming vacuum, take-off/transfer, oven heating/fans, actual dry trimming, inspection, dispatch and auxiliaries. Confirm chemical-free stock/water route and the absence of excluded processing from equipment and purchasing records."
      source_ids:
        - didone-moulded-pulp-2017
        - jrc-ppb-2015
    - rule_id: boundary_recovery
      applies_to: "received waste"
      rule: "Waste status/recycled content never establishes zero prior burden. Record legal/physical handover and the governing recycling allocation method; represent earlier recovery and freight once within foreground or supplier background. Missing allocation evidence remains a gap."
      source_ids:
        - jrc-ppb-2015
        - eu-pef-allocation-2021
    - rule_id: boundary_outlets
      applies_to: "water, waste and air"
      rule: "External treatment transfer is a waste exchange, not receiving-water discharge. The selected route includes no on-site biological treatment or direct liquid discharge. Retain chemical-free fibre separation, purge/cleaning water and actual solids. Air rows cover only final outdoor releases after actual capture; shared exhausts require source separation."
      source_ids:
        - jrc-ppb-2015
    - rule_id: boundary_energy
      applies_to: "oven and utilities"
      rule: "Record actual electricity and optional pipeline-gas burners. Do not add purchased steam/heat for the same oven duty or infer fuel from the word drying. Actual different fuel, steam, CHP, abatement reagent or onsite biological treatment fails this bounded route until its separate reviewed exchanges/method are available."
      source_ids:
        - didone-moulded-pulp-2017
        - epa-gas-screening
boundary_abstraction:
  declared_starting_condition: "Recovered waste paper received in actual delivered waste state; disclose earlier collection/sorting/baling/transport and contamination"
