system_boundary:
  rules:
    - rule_id: boundary_corrugator_conversion
      applies_to: "foreground corrugator conversion"
      rule: "Include liner and fluting unwinding, heat or steam conditioning, corrugating rolls, starch application, single-facing and double-backing, setting or drying, slitting, cutting or reeling, stacking, and directly associated internal handling."
      source_ids:
        - fefco-corrugated-board-production
        - fefco-corrugated-board-boundaries
    - rule_id: boundary_supporting_operations
      applies_to: "site support operations"
      rule: "Include onsite heat or steam generation, electricity generation, water treatment, wastewater treatment, and solid-waste handling when they occur inside the reporting site boundary; otherwise represent purchased utilities or external treatment as product or waste exchanges."
      source_ids:
        - fefco-corrugated-board-boundaries
    - rule_id: boundary_upstream_base_paper
      applies_to: "upstream liner and fluting production"
      rule: "Exclude pulp and corrugated base-paper manufacture from the foreground corrugator process, but require upstream datasets and actual grade masses for all liners and fluting media."
      source_ids:
        - fefco-corrugated-board-boundaries
    - rule_id: boundary_container_conversion
      applies_to: "downstream container manufacture"
      rule: "Exclude printing, slotting, die-cutting, folding, stitching, and gluing that convert corrugated board into boxes or other containers; create a separate downstream process if these operations are needed."
      source_ids:
        - unstats-cpc-32151
        - fefco-corrugated-board-production
    - rule_id: boundary_cutoff_disclosure
      applies_to: "inventory completeness"
      rule: "Do not omit known liner, fluting, adhesive, electricity, heat or steam, water, shavings, rejects, or treatment flows. Any other omission must be quantified where feasible and disclosed with its rationale and estimated significance."
      source_ids:
        - eu-pef-2021-2279
boundary_abstraction:
  declared_starting_condition: "Liner and fluting reels, starch or prepared adhesive, purchased utilities, and ancillary materials are received at the corrugator site boundary."
  starting_condition_role: "Foreground gate-to-gate corrugator conversion start; upstream fibre, pulp, recovered-paper preparation, and base-paper production remain represented by supplier or secondary datasets."
  product_classification_scope: "CPC 3.0 subclass 32151 only; the boundary ends before conversion into CPC 32152 or 32153 sacks, bags, cartons, boxes, cases, or related containers."
  recursive_input_rule: "Corrugated board returned internally for rework remains an internal loop. Purchased or externally recovered corrugated material crossing the boundary is recorded as a separate input with origin, treatment state, and upstream dataset; it is not silently netted against output."
  upstream_dataset_requirement: "Use grade- and route-specific upstream datasets for each liner, fluting medium, adhesive, electricity mix, heat or steam supply, water supply, and external waste treatment."
  disclosure: "Declare site, geography, reporting period, wall and flute construction, product mix, integrated or non-integrated operations, included finishing, upstream dataset substitutions, onsite utility generation, wastewater treatment, and all cut-offs."
