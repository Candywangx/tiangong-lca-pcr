allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "corrugator conversion producing corrugated board"
    rule: "Treat corrugated board as the reference product and shavings, rejects, wastewater, and other treatment outputs as explicit waste or residual flows; do not assign them a share of foreground burdens merely because they may have recovery value."
    source_ids:
      - fefco-corrugated-board-closed-loop
  - rule_id: allocation_subdivision_first
    applies_to: "multiple board grades or lines sharing utilities"
    rule: "Subdivide metered data by line, grade, campaign, or machine time wherever technically feasible. Allocate only the unresolved shared remainder, using net saleable mass as the default driver and disclosing the allocation share for every product group."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: allocation_recycling_separate
    applies_to: "paper shavings and downstream recycling"
    rule: "In this gate-to-gate foreground dataset, report shavings and their destination without an avoided-production credit. If a downstream lifecycle model applies a closed-loop or circular-footprint method, identify the method, geography, period, recycled-content inputs, recovery outputs, and allocation factors separately."
    source_ids:
      - fefco-corrugated-board-closed-loop
      - eu-pef-2021-2279
  - rule_id: allocation_no_silent_netting
    applies_to: "internal rework and inventory changes"
    rule: "Internal rework may remain inside the boundary, but purchased or externally recovered board, external waste outputs, and opening or closing inventories must not be silently netted. Preserve gross records and show the normalization calculation."
    source_ids:
      - fefco-corrugated-board-data-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_saleable_product
      process_id: "corrugator_conversion"
      flow_role: "net saleable corrugated board"
      record_type: "calibrated scale record and product-quality record"
      raw_fields: "timestamp; product code; wall construction; flute profile; liner and fluting grades; gross mass; transport-packaging mass; reject mass; moisture sample; grammage; thickness"
      collection_method: "Export scale or production scale linked to product batch; ISO 536 grammage; ISO 287 moisture; ISO 3034 thickness or demonstrably equivalent methods"
      unit: "kg; g/m2; % by mass; mm"
      frequency: "Each batch or production order, aggregated monthly"
      temporal_coverage: "At least 12 consecutive representative months, or the full campaign for seasonal or short-run production"
      site_scope: "All lines and products represented by the dataset"
      aggregation_rule: "Sum net saleable mass after subtracting separately reported transport packaging; retain product-level totals before normalization"
      quality_evidence: "Scale calibration; sampling plan; test records; reconciliation to sales or dispatch totals"
    - protocol_id: cp_base_paper_receipts
      process_id: "corrugator_conversion"
      flow_role: "liner and fluting base papers"
      record_type: "receiving, issue, and inventory record"
      raw_fields: "supplier; mill; grade; liner or fluting role; primary or recovered fibre status; flow UUID; upstream dataset; reel mass; issue mass; opening inventory; closing inventory; moisture basis"
      collection_method: "Calibrated receiving or process scales and inventory ledger"
      unit: "kg"
      frequency: "Each delivery and issue, reconciled monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "All base-paper inputs to included corrugator lines"
      aggregation_rule: "Consumption = opening inventory + receipts - closing inventory - documented transfers; preserve grade-level values"
      quality_evidence: "Scale calibration; supplier specification; invoice or goods receipt; inventory reconciliation"
    - protocol_id: cp_adhesive_records
      process_id: "corrugator_conversion"
      flow_role: "starch adhesive and formulation constituents"
      record_type: "batch sheet, purchase issue, and tank balance"
      raw_fields: "batch id; dry starch; water; caustic soda; borax or alternatives; wet-strength agent; prepared adhesive mass; return or loss; solids content"
      collection_method: "Batch weighing or flowmeter plus stock reconciliation"
      unit: "kg"
      frequency: "Each batch, aggregated monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "All adhesive preparation serving included lines"
      aggregation_rule: "Report prepared adhesive and dry constituents on explicitly declared bases; prevent double counting water and formulation components"
      quality_evidence: "Calibrated scales or meters; formulation sheet; stock reconciliation"
    - protocol_id: cp_utility_meters
      process_id: "corrugator_conversion"
      flow_role: "electricity, heat or steam, and process water"
      record_type: "utility meter and allocation record"
      raw_fields: "meter id; start and end readings; unit; pressure; temperature; condensate return; shared-load driver; downtime"
      collection_method: "Dedicated meters where available; otherwise documented engineering allocation from site meters"
      unit: "kWh; MJ; kg"
      frequency: "Continuous or per shift, aggregated monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "Corrugator and included supporting operations"
      aggregation_rule: "Subtract documented non-production loads; allocate shared utilities by measured machine time, throughput, or engineering heat balance before normalization"
      quality_evidence: "Meter calibration; invoices; allocation worksheet; completeness reconciliation"
    - protocol_id: cp_shavings_records
      process_id: "corrugator_conversion"
      flow_role: "shavings and rejected board"
      record_type: "waste dispatch and production-reject record"
      raw_fields: "weight ticket; container id; product grade; internal rework; external destination; recycler or treatment route; moisture basis"
      collection_method: "Dedicated waste scale, baler scale, or verified collector weight ticket"
      unit: "kg"
      frequency: "Each dispatch or production shift, aggregated monthly"
      temporal_coverage: "Same reporting period as product output"
      site_scope: "All trim and rejects from included lines"
      aggregation_rule: "Exclude internal rework from external output; sum gross external shavings and rejects by destination"
      quality_evidence: "Scale calibration; recycler receipt; waste manifest; reconciliation to paper mass balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "every inventory exchange"
      rule: "normalized amount = reporting-period exchange amount / reporting-period net saleable board mass × 1,000 kg"
      inputs:
        - "exchange amount"
        - "net saleable board mass"
      output: "amount per 1,000 kg reference flow"
      source_ids:
        - fefco-corrugated-board-boundaries
    - id: calc_base_paper_consumption
      applies_to: "liner and fluting input"
      rule: "consumed base paper = opening inventory + receipts - closing inventory - transfers out; retain separate liner and fluting grade totals before summing"
      inputs:
        - "inventory and receipt records by grade"
      output: "kg base paper consumed by grade and in total"
      source_ids:
        - fefco-corrugated-board-material-inputs
    - id: calc_board_mass_balance
      applies_to: "corrugator conversion"
      rule: "reconcile base papers + dry adhesive constituents + other retained materials against net saleable board + external shavings and rejects + documented inventory or moisture change; investigate and disclose the residual"
      inputs:
        - "base-paper records"
        - "adhesive records"
        - "output mass"
        - shavings
        - moisture
        - inventories
      output: "mass-balance residual and explanation"
      source_ids:
        - fefco-corrugated-board-data-2024
    - id: calc_energy_conversion
      applies_to: "heat or steam"
      rule: "convert steam to MJ only from metered energy or documented mass, pressure, temperature, condensate return, and enthalpy difference; record the property basis used by the selected flow"
      inputs:
        - "steam or heat records"
        - "operating conditions"
      output: "MJ delivered heat on declared gross or net basis"
      source_ids:
        - eu-pef-2021-2279
    - id: calc_moisture_disclosure
      applies_to: "product and paper masses"
      rule: "preserve as-sold mass as the reference basis; if dry-mass comparison is also reported, calculate it from measured moisture and keep both values with the formula"
      inputs:
        - "as-sold mass"
        - "ISO 287 moisture result"
      output: "as-sold mass and optional dry mass"
      source_ids:
        - iso-287-2017
        - fefco-corrugated-board-outputs
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and process identity"
      requirement: "Product code, wall construction, flute profile, liner and fluting grades, product form, surface treatment, site, geography, and reporting period must be unambiguous and consistent with CPC 32151."
      evidence: "Product specification, production order, and classification review"
    - id: dq_temporal
      applies_to: "foreground activity data"
      requirement: "Use at least 12 consecutive representative months unless a shorter complete campaign is justified; identify shutdowns, abnormal periods, and the reference year."
      evidence: "Meter extracts, production ledger, and reporting-period reconciliation"
    - id: dq_completeness
      applies_to: "all required inventory roles"
      requirement: "Reconcile base papers, adhesive, utilities, saleable output, shavings, and other known outputs. Record zero only after confirming that the flow does not occur; distinguish unavailable data from zero."
      evidence: "Mass balance, utility reconciliation, waste records, and omission log"
    - id: dq_measurement
      applies_to: "mass, grammage, moisture, thickness, and utilities"
      requirement: "Retain instrument identity, calibration status, sampling frequency, test method, unit conversion, and aggregation worksheet."
      evidence: "Calibration certificates, ISO or equivalent test records, and calculation workbook"
    - id: dq_representativeness
      applies_to: "site dataset and secondary datasets"
      requirement: "Assess technological, geographical, time-related, and precision representativeness; justify any proxy upstream dataset and identify differences in fibre route, energy mix, mill technology, and product grade."
      evidence: "EU PEF data-quality assessment and supplier dataset metadata"
    - id: dq_supplier_coverage
      applies_to: "liner, fluting, adhesive, energy, and treatment datasets"
      requirement: "Every material upstream input and external treatment route must have a named dataset or a documented gap; average FEFCO values may support QA but do not replace supplier- or route-specific foreground quantities."
      evidence: "Supplier declarations, secondary dataset references, and gap register"
    - id: dq_industry_prior
      applies_to: "comparison with industry evidence"
      requirement: "Treat FEFCO weighted averages as external screening priors. Do not claim they are site-specific or universally representative outside the reported European geography, technology, and reference year."
      evidence: "FEFCO questionnaire coverage and peer-review statement"
validation_rules:
  - rule_id: validation_identity_scope
    applies_to: "product category"
    rule: "Confirm that the output is corrugated paper or paperboard and not base paper, a box, carton, sack, bag, display, or manufacturing service; reject ambiguous product identities."
    source_ids:
      - unstats-cpc-32151
      - environdec-pcr-2010-14-v4-2026
  - rule_id: validation_reference_flow
    applies_to: "reference flow"
    rule: "Require exactly 1,000 kg normalized net saleable corrugated board with the mass property and units-of-mass UUIDs, plus every required product qualifier."
    source_ids:
      - fefco-corrugated-board-boundaries
      - iso-536-2019
      - iso-287-2017
      - iso-3034-2011
  - rule_id: validation_process_coverage
    applies_to: "corrugator boundary"
    rule: "Require documented coverage of paper conditioning, fluting, starch application, liner joining, setting or drying, slitting, cutting or reeling, stacking, and included supporting utilities; separately disclose every excluded onsite operation."
    source_ids:
      - fefco-corrugated-board-production
      - fefco-corrugated-board-boundaries
  - rule_id: validation_mass_balance
    applies_to: "material inventory"
    rule: "Check gross base-paper input, adhesive constituents, net saleable output, shavings and rejects, moisture basis, and inventory changes as one mass balance; a non-zero unexplained residual is a finding, not an automatic adjustment."
    source_ids:
      - fefco-corrugated-board-data-2024
  - rule_id: validation_energy_water
    applies_to: "utilities"
    rule: "Require measured or transparently allocated electricity, heat or steam, and process water; require unit and property conversions to be reproducible from retained records."
    source_ids:
      - eu-pef-2021-2279
  - rule_id: validation_recycling
    applies_to: "shavings and recycling"
    rule: "Require gross shavings or reject output and destination. Reject silent netting or an avoided-production credit inside the gate-to-gate process unless a separately declared downstream recycling method is in scope."
    source_ids:
      - fefco-corrugated-board-closed-loop
  - rule_id: validation_data_quality
    applies_to: "published foreground data package"
    rule: "Require temporal, technological, geographical, completeness, precision, calibration, proxy, and uncertainty disclosures sufficient for downstream secondary or background use."
    source_ids:
      - eu-pef-2021-2279
      - fefco-corrugated-board-questionnaire-2024
published_dataset_profile:
  dataset_role: "Site- and technology-specific foreground dataset for corrugator conversion to corrugated paper or paperboard"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Foreground process construction, supply-chain modelling, product environmental footprint studies, EPD preparation under an applicable current PCR, scenario comparison, and lifecyclemodel assembly when product qualifiers and geography match"
  excluded_use: "Direct representation of pulp or base-paper production; direct representation of box or container conversion; unsupported geography or technology claims; use of provisional reasoned-estimate ranges as measured site data; product-to-product comparative assertions without applicable programme rules"
  required_metadata: "canonical PCR id; CPC reference; site and geography; reporting period; technology; liner and fluting grades and routes; wall and flute construction; grammage; thickness; moisture basis; recycled-fibre claim basis; surface treatment; reference flow UUIDs; upstream dataset identities; allocation; cut-offs"
  required_quality_disclosure: "Primary-data share; meter and sampling coverage; calibration; mass-balance residual; proxy datasets; temporal, technological, geographical, and precision representativeness; provisional estimates; uncertainty; treatment destinations; review status"
  update_trigger: "Material change in corrugator technology, product mix, fibre route, adhesive formulation, energy or heat supply, allocation, system boundary, site, data source, or more than five years since the foreground reference year"
