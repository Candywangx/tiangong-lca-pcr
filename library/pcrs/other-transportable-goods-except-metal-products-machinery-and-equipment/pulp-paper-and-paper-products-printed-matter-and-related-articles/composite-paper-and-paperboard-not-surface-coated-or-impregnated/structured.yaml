system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "All inventory cards inherit this complete context. Keep gross physical exchange vector V, in each flow's original unit, separate from the attributed burden vector A. Establish raw record identity, actual time/scope, rate integration and dimensional conversion first; then isolate dedicated operations and justify each remaining shared exchange by its own physical cause. Only a genuinely inseparable residual may use another relationship. Perform one final division by positive new accepted net board mass Q. Allocation never alters gross mass, water, carbon, inventory stock or physical co-output quantities. [eu-pef-multifunctionality-2021]"
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Q is new board first accepted after bonding, required pressing, drying/conditioning, flattening and final slitting to the declared flat-sheet supply gate. Record rejects and every acceptance ID. New accepted closing finished goods are already included in Q; do not add them again to measured accepted production. Reconcile dispatch with opening/closing finished goods, external returns and transfers. Reinspection or return of previously accepted board creates no new Q. Opening finished goods dispatched now retain their original burdens. Raw/unused material, work in progress and finished-goods cohorts carry a vector b_i of inherited quantities for every flow i, including earlier material, electricity, heat, water and emissions; bring in their actual opening vectors, carry actual closing vectors, and transfer vectors at actual completion stages without deleting them or applying allocation twice. Unknown history is unknown, never a zero vector."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Q=0, failed batches, starts/stops, idle periods, cleanup and trial runs retain their real loads. Attribute them to the causally served production period/cohort with a documented rule; do not drop them, divide by zero, or substitute an invented output. A measured service quantity Qc or actual operating hours H may describe a separately declared service or attribution driver, never new board production Q. No machine mass, recipe, yield, moisture, price or loss share is prescribed."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "A composition ledger partitions a whole supplied material; it does not create additional exchanges. Purchased paper includes its actual fibre/filler/sizing upstream once; purchased whole adhesive includes starch, carrier water and other supplied ingredients once. Wastewater wet mass, H2O, solids and COD are different quantities; only the whole shipment links to one actual compatible treatment provider. Do not sum its constituent ledger into whole-stream mass, add duplicate upstream manufacture, or claim recycling, substitution or energy credits."
      source_ids: []
    - rule_id: boundary_layers
      applies_to: "converter"
      rule: "Foreground starts at paper receipt; supplier pulping, sizing, fillers, drying and emissions belong once to the ply background and are not repeated at converter."
      source_ids:
        - wco-hs-2022-ch48
        - ec-paper-bref-2015
    - rule_id: boundary_operations
      applies_to: "converter"
      rule: "Include bonding, pressing, actual drying/conditioning and necessary flattening, cutting, dust capture, cleaning and actual gate packing; a converter without a pulper cannot call exported trim an internal broke loop."
      source_ids:
        - ec-paper-bref-2015
        - klug-es-adhesive
    - rule_id: boundary_variant
      applies_to: "product"
      rule: "Reinforcement, surface treatment, synthetic binder, on-site combustion heat or on-site water treatment exceeds this route and requires complete corresponding methods and atomic rows; producer emission-free marketing does not replace site screening."
      source_ids:
        - paramelt-paper-board
        - solidus-board
        - klug-es-adhesive
boundary_abstraction:
  declared_starting_condition: "Purchased dried uncoated/unimpregnated flat paper or paperboard plies and whole starch adhesive in supplied state arrive at converter"
  starting_condition_role: "Foreground receiving boundary; upstream burden is not zero"
  product_classification_scope: "The stated restricted subset of 32141; classification is not physical applicability"
  recursive_input_rule: "Record any same-category purchased board once as a supplier input, without recursively duplicating current manufacture; an already-composite board core needs a separately verified flow and boundary."
  upstream_dataset_requirement: "Link compatible pulp/papermaking background per ply grade/origin; purchased adhesive includes formulation manufacture. Verify transport endpoints and existing transport coverage; add actual transport-service rows for uncovered routes."
  disclosure: "Declare supplier cut points, background quantity definitions, transport/packing coverage and actual foreground facilities; wood-processing studies do not establish papermaking recipes."
