allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "converter"
    rule: "First investigate subdivision or explicit system expansion; expansion requires real co-functions, representative boundaries and whole-expanded-system reporting. Isolate dedicated paper grades, glue batches, meters and production campaigns before any allocation. For each remaining exchange document the causal physical relation: paper by actual grade/ply issues, glue by actual formulation dosing, heat by measured drying duty, electricity by measured drives/run state and water by actual cleaning/dilution operations. Neither board mass nor one factory-wide percentage automatically allocates every exchange."
    source_ids:
      - eu-pef-multifunctionality-2021
  - rule_id: allocation_physical
    applies_to: "physical ledger"
    rule: "Preserve gross V and all physical outputs/internal links/stocks independently of attributed A. Transfer inherited per-flow cohort vectors through raw material, WIP and finished goods once. The chosen target Q contains only new accepted board; unrelated output, returned board, opening-stock dispatch and reusable packaging do not enlarge it."
    source_ids:
      - eu-pef-multifunctionality-2021
  - rule_id: allocation_residual
    applies_to: "genuinely inseparable residual"
    rule: "Only after documenting why subdivision/expansion and a relevant physical relation fail, justify an economic relationship for the actual residual. Use actual same-gate, same-state, same-period quantities and realized values of all real co-functions, with cost/negative-value cases and sensitivity disclosed; no invented prices or universal share."
    source_ids:
      - eu-pef-multifunctionality-2021
  - rule_id: allocation_trim
    applies_to: "clean_trim; bonded_trim; captured_dust"
    rule: "Verify waste versus saleable coproduct from actual specification, recipient use, waste status and market evidence; a payment alone is insufficient. A genuine coproduct needs its own qualified Product output and physical quantity, with dedicated and shared burdens assigned before normalization. Keep waste as waste with one actual receiver; internal returns cancel and carry history. No automatic avoided-paper, energy-recovery or substitution credit."
    source_ids:
      - ec-paper-bref-2015
      - eu-pef-multifunctionality-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "converter"
      flow_role: "reference output"
      record_type: "scale/meter/laboratory/supplier records"
      raw_fields: "gross/tare/net mass; lot; order acceptance; grade; moisture; accepted production; dispatch; opening/closing stock"
      collection_method: "Calibrated weighing and representative gate-moisture tests; reconcile accepted production with dispatch and stock"
      unit: "kg; mass fraction"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared units"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, sample chain, SOP, supplier definitions and complete raw records"
    - protocol_id: cp_layers
      process_id: "converter"
      flow_role: "each paper grade"
      record_type: "scale/meter/laboratory/supplier records"
      raw_fields: "supplier; grade; ply position/count; moisture; received/issued/returned mass; stock; surface coating/impregnation declaration; transport endpoint"
      collection_method: "Per-grade scale/stock balance and supplier declaration; keep upstream paper manufacture separate from converter"
      unit: "kg; mass fraction"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared units"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, sample chain, SOP, supplier definitions and complete raw records"
    - protocol_id: cp_adhesive
      process_id: "converter"
      flow_role: "starch adhesive"
      record_type: "scale/meter/laboratory/supplier records"
      raw_fields: "supplier/SDS and applicable CAS; starch origin and modification; all formulation ingredients; supplied form; wet mass; starch/other measured solids/H2O fractions; dilution; residue; shelf/storage change; background reference basis"
      collection_method: "Lot dosing/stock balance and validated solids method; do not double count supplier carrier water or the adhesive manufacturing process"
      unit: "kg; mass fraction"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared units"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, sample chain, SOP, supplier definitions and complete raw records"
    - protocol_id: cp_energy
      process_id: "converter"
      flow_role: "electricity"
      record_type: "calibrated meters/provider originals"
      raw_fields: "stage power/time/kWh; provider voltage/region/year/mix/gate/losses; actual electric dryer and steam configuration; meter overlaps; coupled utilities; startup/idle/cleaning/stocks"
      collection_method: "Integrate actual operation without overlapping meters; distinguish supplier joint heat/power/water production from converter demand, without repeating covered generation/boiler fuel, water or emissions"
      unit: "kWh; MJ"
      frequency: "each interval/campaign"
      temporal_coverage: "full period including failures/idle/cleaning"
      site_scope: "selected line and actual shared units"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, provider basis and originals"
    - protocol_id: cp_pack
      process_id: "converter"
      flow_role: "paper-wrap component"
      record_type: "physical receipt/issue/return/stock records"
      raw_fields: "atomic material/form/type/direction; original measurement/unit and kg conversion; receiptID/time/origin; procurement/burden owner/custody/cohort/prior vector/provider; purchases P and first nonpurchase N; ER matched to same-item earlier outward; empty/raw/WIP/FG/reusable opening/closing and grossS/EO/W"
      collection_method: "Separate physical receipt from procurement/burden ownership; purchased batch components remain P without separate invoice; actual loan/rental/entrusted/nonpurchase accompanied receipts enter actual receiving side as N; internal issue/reuse cancel and unknown history is not zero"
      unit: "kg"
      frequency: "each event and period close"
      temporal_coverage: "full period including stocks/returns"
      site_scope: "actual receiving side and packaging gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "original receipt/custody/history/provider evidence"
    - protocol_id: cp_waste
      process_id: "converter"
      flow_role: "each waste export"
      record_type: "scale/meter/laboratory/supplier records"
      raw_fields: "stream; mass; moisture/solids; starch/filler/sizing contamination; liquid/gelled/semi-solid/dry state; H2O and other formulation fractions; receiver; treatment; stock; internal return; collector capture"
      collection_method: "Separate weighed loads and composition tests for each export; receiver tickets; collector stock balance"
      unit: "kg"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared units"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, sample chain, SOP, supplier definitions and complete raw records"
    - protocol_id: cp_air
      process_id: "converter"
      flow_role: "each outdoor particle bin"
      record_type: "scale/meter/laboratory/supplier records"
      raw_fields: "source; aerodynamic size cut; concentration; sampled gas volume T/P wet/dry; time; controls; outdoor compartment; capture; blanks; detection limits; uncertainty"
      collection_method: "Site-approved size-resolved sampling of exhaust and fugitives; integrate matched concentration and volumetric rate over time; absence requires documented screening"
      unit: "kg; concentration; gas volume"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared units"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, sample chain, SOP, supplier definitions and complete raw records"
    - protocol_id: cp_water
      process_id: "converter"
      flow_role: "water and cleaning effluent"
      record_type: "scale/meter/laboratory/supplier records"
      raw_fields: "purchased m3; density/T; glue/paper/product/waste moisture; wash discharge whole volume/wet mass/mixture density and temperature/H2O fraction/solids; receiver; returned condensate; humidity; water stock"
      collection_method: "Calibrated water meters, wet/dry composition and sampled density; matched physical water balance including purchased-glue carrier water once"
      unit: "m3; kg; mass fraction"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared units"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, sample chain, SOP, supplier definitions and complete raw records"
    - protocol_id: cp_steam
      process_id: "converter"
      flow_role: "steam heat/carrier and condensate interfaces"
      record_type: "heat/steam meters and provider originals"
      raw_fields: "actual boiler or CHP route; steam/return IDs; mass-rate/time; P/T/quality; inlet/outlet enthalpy and datum; pipe losses; condensate kg/density/T/destination; heat meter; provider native units; coupled heat/power/water and stocks"
      collection_method: "Calibrated metering, actual-time integration and same-interface enthalpy ledger; verify provider native heat basis rather than equating kg, MJ or differing heat conventions"
      unit: "kg; MJ; time"
      frequency: "each heat interval and campaign"
      temporal_coverage: "full period including startup/idle/cleaning"
      site_scope: "actual converting line and heat-delivery gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, provider invoices/utility diagram, enthalpy calculations and return receipts"
    - protocol_id: cp_stock
      process_id: "converter"
      flow_role: "each-flow stock inheritance and attribution"
      record_type: "cohort/stock/acceptance/allocation records"
      raw_fields: "each raw/unused/WIP/FG opening/closing quantity and per-flow vector; completion stage; first acceptance ID; dispatch/return; failed/start/idle/cleaning loads; co-outputs; subdivision and each-exchange physical cause; actual residual same-period/gate values"
      collection_method: "Track physical quantities and inherited burden vectors by cohort, gross V separate from attributed A; reconcile new Q without recounting new closing FG or returns"
      unit: "each flow original unit; kg"
      frequency: "each event and period close"
      temporal_coverage: "complete production/stock period"
      site_scope: "selected board gate and related shared units"
      aggregation_rule: "per reference flow"
      quality_evidence: "original acceptance/stock accounts, historical vectors and attribution rationale"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all non-reference rows"
      rule: "First establish original units/actual-rate integration, same-scope conversion, stock_vectors and each-flow dedicated/shared attribution; then q_i = A_i / Q once. A_i is the quantity attributed to new target board in this card native unit; Q is same-period first accepted net board kg. Preserve gross V and physical co-outputs separately."
      inputs:
        - cp_mass
        - cp_layers
        - cp_adhesive
        - cp_energy
        - cp_pack
        - cp_waste
        - cp_air
        - cp_water
        - cp_steam
        - cp_stock
      output: "row amount per reference flow"
      source_ids: []
    - id: electricity_mj
      applies_to: "electricity"
      rule: "A_MJ = 3.6 * A_kWh; 3.6 is the kWh-to-MJ unit conversion; convert at the metered delivery point."
      inputs:
        - cp_energy
      output: "MJ per reference flow"
      source_ids: []
    - id: dry_water_components
      applies_to: "paper/glue/product/waste"
      rule: "m_dry = m_wet * s; m_H2O = m_wet * w_H2O; s is validated measured dry-solids fraction and w_H2O is independently established H2O fraction. Use 1-s only when the entire non-solid fraction is proven to be water; retain non-water volatiles/solvents and other formulation components separately, without assuming all drying loss is H2O."
      inputs:
        - cp_layers
        - cp_adhesive
        - cp_mass
        - cp_waste
        - cp_water
      output: "physical dry matter and water; wet reference unchanged"
      source_ids: []
    - id: physical_balances
      applies_to: "converter"
      rule: "For dry solids, water and carbon separately, inputs = product + exported waste + environmental releases + stock change; equal internal-link ends cancel. Convert pure-water input V using measured water density; whole mixed-liquid wet mass = V * measured mixture density, and its water ledger contains only wet mass * w_H2O. Collect carbon composition/biogenic origin; no default carbon fraction or CO2 emission."
      inputs:
        - cp_layers
        - cp_adhesive
        - cp_mass
        - cp_water
        - cp_waste
        - cp_air
      output: "unallocated physical ledger and residuals"
      source_ids: []
    - id: pm_exclusive
      applies_to: "particle rows"
      rule: "PM2.5-10 = matched PM10 - PM2.5; >10 = comparable total particulate - PM10; apply only with compatible definitions, conditions and detection limits, otherwise collect. Investigate negative differences rather than clipping to zero."
      inputs:
        - cp_air
      output: "exclusive particle kg per reference flow"
      source_ids:
        - ec-paper-bref-2015
    - id: exported_liquid_basis
      applies_to: "liquid adhesive residue/off-site cleaning wastewater"
      rule: "Native wet Mass/kg is measured whole wet mass or measured V * mixture density(T,state); same-stream H2O = wet mass * w_H2O. Formulation solids/pollutant indicators are separate composition ledgers, not additional whole-liquid quantities. Normalize once by same-period Q, with no on-site treatment or duplicate direct receiving-water releases. Non-liquid residue needs a separately verified identity and atomic row."
      inputs:
        - cp_waste
        - cp_water
        - cp_mass
      output: "wet kg per reference flow and separate H2O ledger"
      source_ids: []
    - id: stock_vectors
      applies_to: "all inventory rows"
      rule: "For each flow i: newly completed production burden vector = actual current activities + inherited raw/WIP vectors brought into production - actual raw/unused/WIP vectors carried forward; separately reconcile external returns/transfers/disposal at actual stages without subtracting net-issued material twice. Newly accepted FG vectors remain within Q, then are split between current dispatch and new closing FG; opening FG dispatch/returns keep original vectors and create no Q. Allocate only real common residual once."
      inputs:
        - cp_stock
        - cp_mass
        - cp_layers
        - cp_adhesive
      output: "each-flow attributed A and stock vectors; gross V independent"
      source_ids:
        - eu-pef-multifunctionality-2021
    - id: packaging_receipts
      applies_to: "paper_wrap"
      rule: "Complete physical ledger: opening S0 + purchased P + first nonpurchase N + ER matched to the same article previously outward = closing S1 + actual external outward EO + waste W. Include every empty/raw/WIP/FG/reusable stock; internal grossS issue/reuse ends cancel. P remains purchased without separate invoice. N records atomic material/form/direction/original measurement/receiptID and time/origin/owner/custody/cohort/priorvector/provider. Unknown history is not zero; whole article and components have no duplicate manufacture; current attribution and future carryover are separate."
      inputs:
        - cp_pack
        - cp_stock
      output: "complete receipt ledger and one provider burden"
      source_ids: []
    - id: steam_delivery
      applies_to: "steam_heat; condensate_return"
      rule: "Actual steam kg is mass-rate integrated over time; reconcile delivered MJ using a common inlet/outlet enthalpy datum and actual condensate/vent/loss paths. Retain provider thermal-energy quantity, usable heat and carrier-water kg separately; a different provider basis requires verified conversion, never an assumed equality or latent-heat factor. Verify coupled heat/power/water from actual provider joint burdens and each-exchange physical relationships; do not repeat provider fuel/water/electricity/emissions or invent a condensate energy credit."
      inputs:
        - cp_steam
        - cp_energy
        - cp_water
        - cp_stock
      output: "attributed native heat and separate water/energy physical ledgers"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all exchanges"
      requirement: "Check name, CAS when relevant, route, classification, medium, property and unit; physical identity is distinct from background quantity compatibility; unresolved UUIDs remain blank."
      evidence: "supplier specifications and direct flow/property/unit records"
    - id: period_scope
      applies_to: "collection"
      requirement: "Declare actual place/complete period, ply grades, adhesive supply state and line; historical or single-plant examples are not generic recipes or energy amounts."
      evidence: "cp_mass; cp_layers; cp_adhesive; cp_energy"
    - id: uncertainty
      applies_to: "measurement"
      requirement: "Retain calibration, representativeness, detection limits, material/water/carbon residuals and uncertainty; missing is not zero and supplier VOC-free claims do not prove zero release at all stages."
      evidence: "cp_air; cp_water; cp_waste"
    - id: coverage
      applies_to: "actual route"
      requirement: "Investigate and atomically complete actual packing, transport, maintenance/lubricants/cleaners/wastes and utilities. This method supplies no assumed on-site boiler or treatment unit. Distinguish real species/compartment/water/heat/phase from total PM, COD, NOx or elemental indicators; an indicator is not an additional species, and one residual cannot solve multiple unknowns. Retain actual biogenic CO2 in LCI irrespective of GHG reporting conventions."
      evidence: "cp_energy; cp_steam; cp_pack; cp_water; site process diagram"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product"
    rule: "Check flat plies, adhesive, surface/gate state and actual route; any unknown requires review, with no inference from classification or the name solid board."
    source_ids:
      - wco-hs-2022-ch48
      - klug-es-adhesive
      - solidus-board
  - rule_id: validate_reference
    applies_to: "reference"
    rule: "Exactly one board_output is the 1 kg reference product output; identity must have verifiable physical limitations and cannot borrow a neighbouring product UUID."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "collection"
    rule: "Verify every Amount original unit, real rate integration, conversion scope, each-flow subdivision/shared attribution, raw/WIP/FG inherited vectors and final single A/Q. Independently review gross V dry matter/water/carbon, stocks, physical co-outputs, Q=0 loads and first external packaging receipts. New closing FG is already in Q; return/reinspection creates no Q. A finite measurement check does not establish actual dataset completeness."
    source_ids:
      - eu-pef-multifunctionality-2021
  - rule_id: validate_air
    applies_to: "emissions"
    rule: "Do not sum the three exclusive particle bins with cumulative PM10 or total particulate; captured dust is separate from air releases. Zero requires screening evidence; unknown emissions/background bases prevent complete acceptance."
    source_ids:
      - ec-paper-bref-2015
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Declared gate-board input to downstream paper/packaging converting models"
  allowed_use: "Only datasets physically within this scope with complete evidence/inventory"
  excluded_use: "Wet multilayer board, corrugated/coated/impregnated materials; packages with unknown identity or quantity bases"
  required_metadata: "Reference net mass/moisture, layer construction, adhesive, gate state, supplier backgrounds/utilities, actual period/place, each-flow stock inheritance and first flat-board supply gate"
  required_quality_disclosure: "Missing measurements, unresolved identity/background bases, balance residuals, emission coverage, allocation and uncertainty"
  update_trigger: "Changes in plies/adhesive/surfaces, process/energy/water treatment, supplier background or quality"
