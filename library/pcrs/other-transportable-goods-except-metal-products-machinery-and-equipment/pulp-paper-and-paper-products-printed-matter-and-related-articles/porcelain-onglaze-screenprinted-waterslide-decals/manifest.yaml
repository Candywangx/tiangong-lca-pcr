    ceramic_ink: "Actual black onglaze ceramic paste including its pigment/flux/organic medium; near-name conductive silver paste or conventional inks rejected."
    covercoat: "Actual compatible clear burn-out ceramic lacquer, not purchased PE film or generic finished coated article."
