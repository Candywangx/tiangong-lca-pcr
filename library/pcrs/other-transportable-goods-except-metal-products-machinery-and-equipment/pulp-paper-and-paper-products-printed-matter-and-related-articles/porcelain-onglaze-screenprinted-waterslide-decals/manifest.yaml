  independent_methodology_review: "pending; no independent scientific approval or publication claimed"
  semantic_boundary_decision: "New semantic identity for unapplied screenprinted ceramic waterslide sheets qualified for hard-porcelain onglaze firing; calendars and incompatible receiving substrates/processes excluded. Mixed leaf scaffold retained untouched; only the narrower subset is covered. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  adjacent_method_assessment: "Read material paper PSA label scope, sealed 32210 paperback-book intake, sealed 32540 single-sheet image-print intake and 32620 reuse assessment. None implements water-softenable release gum with transferred ceramic ink/covercoat film. Calendar content alone does not justify another method; remaining forms stay in coverage assessment."
  reference_identity: "Broad finished-at-plant transfers/calendars UUID aef085ba-9ea8-418c-a94e-796a8bce8c8f genuinely contains qualified transfer sheets without contradictory material/route limit. Preserve official Chinese baseName verbatim despite awkward translation. Provider dataset amount and background compatibility remains independently required."
  provider_compatibility: "Actual paper/gum batch composition, ceramic ink/film compatibility on the declared porcelain glaze, verified electric-only heater and native CN grid-average 1–35kV user supply (the German producer source does not establish either for this site), mesh woven PET construction, packing and receiver must be collected. Successful identity lookup never proves full provider dataset compatibility."
  source_limitations: "Manufacturer sources establish separate capabilities/layers, not a single maker's use of another supplier's grades. Producer HTML acquisition returned HTTP429; official full page was read through web reader and retained with remote line locators. Independent bounded gap searches encountered OAuth refresh network failures; existing actual author search/direct originals were independently hash-verified, not described as fresh results. No invented recipe, site amount, drying range or emission factor. BREF applies to actual upstream paper; downstream dust survey is stated physical analogy only."
  independent_content_review: "Bilingual route, all 32 atomic exchanges, primary-source fragments and native property/unit chains independently reviewed; actual supplier/site quantities, electric-only heating applicability and scientific approval remain pending. No source maker inventory or full plant coverage is claimed. Unresolved identities remain explicit. Allocation uses verified PEF4.5 hierarchy only. Whole wet/components, net ambient water, stock/rework, packaging and maintenance completeness require actual records."
  metadata_debts: "Ethyl-acetate product CAS141-78-6 and name agree but CPC34180 is inconsistent; retain bounded chemical identity and require supplier/source clarification. Ethyl-acetate elementary names and CAS141-78-6 agree, but its synonym CH3-CO-O-CH3 denotes methyl acetate and must not establish chemical identity or conversion. Water-vapour names and CAS7732-18-5 agree; synonym entries for heavy/tritiated water and ice do not establish isotope composition or supplied phase. Screen-fabric broad identity includes polyester but knitted-textile classification is inconsistent with the required actual woven monofilament printing mesh. Broad waste-paper identity does not prove recycling suitability. All must remain disclosed."
  rejected_identity_notes: "Reject source-specific on-disc ink waste, direct-to-water printing washwater, waste-incineration electricity, fixed-blend corrugated boxes, near-name acetate isomers and conflicting n-butyl-acetate Chinese species and water-treatment-only Cotton Fabric route. Do not substitute their backgrounds."
