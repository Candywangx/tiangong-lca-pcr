measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is total calibrated net accepted dry sheet mass in the same period, including carrier/gum/image/film and measured residual water and solvent at the accepted supplied state, excluding packing/reject/test sheets. No per-sheet mass is fixed."
  - id: common_basis
    applies_to: "reference denominator for all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Mass/kg applies to the common reference denominator Q only. Each numerator retains its own native property/unit: electricity is Net calorific value/MJ, not Mass/kg. Normalize every exchange and protocol to the same accepted output Q; zero/missing Q blocks normalization."
  - id: layer_mass
    applies_to: "decal_paper, ceramic_ink, covercoat, finished"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep dry carrier, release-gum solids, ink solids, retained dry film and residual water separately. Purchased coated paper is one input: component disclosure cannot create duplicate paper/gum exchanges or backgrounds."
  - id: wet_supply
    applies_to: "ceramic_ink, covercoat, emulsion, thinner, cleaner"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Supplied formulations use actual wet mass. Reconcile whole supplied mass into measured H2O, each organic/inorganic non-water liquid, actual measured nonvolatile solids and any other retained components. Non-water mass is not a solids measurement. Constituent mass uses actual lot composition; measured solids/retention reconcile every component to waste, stock, product and air. No source recipe becomes a default."
  - id: electric_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "The selected electricity flow property is named Net calorific value, not a heating-value assumption about electric power. Record measured kWh and exact 3.6 MJ/kWh conversion; match the native CN grid-average consumption mix delivered at user-side 1–35 kV, actual region/year and provider. Producer machinery evidence does not establish this supply."
  - id: water_mass
    applies_to: "water, washwater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For volume records use measured density at recorded temperature and composition. Database secondary mass coefficients are not density; record wastewater solids and wet basis."
  - id: particle_basis
    applies_to: "pm_fine, pm_coarse, pm_large, collected_dust"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Separate emitted disjoint fractions ≤2.5, >2.5–10 and >10 micrometres from collected dust. PM10 and total particulate sums are QA only, not additional exchanges."
