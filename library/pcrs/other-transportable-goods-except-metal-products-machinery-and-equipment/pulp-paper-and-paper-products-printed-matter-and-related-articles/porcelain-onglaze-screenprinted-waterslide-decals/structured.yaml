allocation_rules:
  - rule_id: allocation_separate
    applies_to: "foreground"
    rule: "First investigate process subdivision and feasible system expansion to avoid allocation; meter actual campaigns/stages and directly attributable shared utilities. If neither is feasible, justify a relevant causal physical relationship; another relationship, including economic allocation, requires documented reasons for rejecting prior steps and matched output/value records. Expanded-system results cover the added functions explicitly. This uses the hierarchy in PEF Annex I Section 4.5 only and does not claim full PEF conformity or adopt a recycling formula. Physical product, stock, waste, water and carbon balances retain actual quantities before any environmental burden allocation; never multiply co-product physical output by allocation share."
    source_ids:
      - pef-allocation
  - rule_id: allocation_waste
    applies_to: "waste"
    rule: "No co-product or substitution credit is assumed for contaminated paper, spent solvent or ink. If actual marketable recovery exists, independently establish quality, receiver and method, report pre-allocation physical balances and post-allocation burden ledger separately. Internal returns are counted once and treatment receiver burdens are linked explicitly."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "decal_converting"
      flow_role: "finished"
      record_type: "foreground_record"
      raw_fields: "accepted sheet lots; wet/dry net mass; tare; design; moisture; test/reject mass"
      collection_method: "Calibrated weighing and lot acceptance; moisture test at actual supplied state; preserve batch output Q"
      unit: "kg"
      frequency: "Each lot and matched reporting period"
      temporal_coverage: "Complete matched period, including setup and rejects"
      site_scope: "Actual site and supplier lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch/SDS/provider records, acceptance and uncertainty"
    - protocol_id: cp_layers
      process_id: "decal_converting"
      flow_role: "decal_paper, ceramic_ink, covercoat"
      record_type: "foreground_record"
      raw_fields: "supplier lots; carrier and gum dry masses; coat composition; wet ink/lacquer; retained image/film solids; water/solvent residual; area"
      collection_method: "Supplier actual batch bill and validated coat-mass witness/differential tests; weigh each layer addition and dried witness; reconcile retention and test losses, never use a brochure grade as recipe"
      unit: "kg"
      frequency: "Each lot and matched reporting period"
      temporal_coverage: "Complete matched period, including setup and rejects"
      site_scope: "Actual site and supplier lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch/SDS/provider records, acceptance and uncertainty"
    - protocol_id: cp_materials
      process_id: "decal_converting"
      flow_role: "materials"
      record_type: "foreground_record"
      raw_fields: "receipts; beginning/end stock; returns; formulation/SDS/CAS; mesh life; solids; supplier background; constituents"
      collection_method: "Calibrated issues/returns plus inventory reconciliation; record actual replacement/reuse and formulations; separate each newly identified exchange"
      unit: "kg"
      frequency: "Each lot and matched reporting period"
      temporal_coverage: "Complete matched period, including setup and rejects"
      site_scope: "Actual site and supplier lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch/SDS/provider records, acceptance and uncertainty"
    - protocol_id: cp_energy
      process_id: "decal_converting"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "stage submeters; actual voltage; transformer losses; drying heater and ventilation; region/year/provider; kWh"
      collection_method: "Read calibrated matched-period meters; separately retain prepress/press/drying/trim counters and idle/changeover shares; verify electric-only heat"
      unit: "kWh; MJ"
      frequency: "Each lot and matched reporting period"
      temporal_coverage: "Complete matched period, including setup and rejects"
      site_scope: "Actual site and supplier lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch/SDS/provider records, acceptance and uncertainty"
    - protocol_id: cp_water
      process_id: "decal_converting"
      flow_role: "water, washwater"
      record_type: "foreground_record"
      raw_fields: "purchased and returned water; density/temperature; washwater mass/volume; solids; receiver; residual water"
      collection_method: "Meter supply and segregated discharge, characterize washwater and measure retained/evaporated water; internal recirculation is not another withdrawal"
      unit: "kg"
      frequency: "Each lot and matched reporting period"
      temporal_coverage: "Complete matched period, including setup and rejects"
      site_scope: "Actual site and supplier lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch/SDS/provider records, acceptance and uncertainty"
    - protocol_id: cp_packing
      process_id: "decal_converting"
      flow_role: "packing"
      record_type: "foreground_record"
      raw_fields: "interleaf/carton/PE grade; receipt; shipped mass; stock; offcuts; tare; reusable shares"
      collection_method: "Weigh actual individual packing components; match input and shipped output and stocks, exclude from Q"
      unit: "kg"
      frequency: "Each lot and matched reporting period"
      temporal_coverage: "Complete matched period, including setup and rejects"
      site_scope: "Actual site and supplier lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch/SDS/provider records, acceptance and uncertainty"
    - protocol_id: cp_waste
      process_id: "decal_converting"
      flow_role: "wastes"
      record_type: "foreground_record"
      raw_fields: "separate stream mass; composition; solvent/water/solids; collected dust sizes; receiver; manifests"
      collection_method: "Calibrated segregated bins and waste transfer records; avoid double counting solids in water, solvent in rags, internal reuse and emitted dust"
      unit: "kg"
      frequency: "Each lot and matched reporting period"
      temporal_coverage: "Complete matched period, including setup and rejects"
      site_scope: "Actual site and supplier lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch/SDS/provider records, acceptance and uncertainty"
    - protocol_id: cp_air
      process_id: "decal_converting"
      flow_role: "elementary releases"
      record_type: "foreground_record"
      raw_fields: "actual chemical CAS; input species fractions; retained/stock/waste/recovery species; matched vent/fugitive measurement; disjoint PM fractions; capture; uncertainty"
      collection_method: "Species-specific material balance and verified net vent/fugitive monitoring; apply actual capture/retention only. Survey all formulation constituents; new actual release species require separate verified cards"
      unit: "kg"
      frequency: "Each lot and matched reporting period"
      temporal_coverage: "Complete matched period, including setup and rejects"
      site_scope: "Actual site and supplier lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, batch/SDS/provider records, acceptance and uncertainty"
  calculation_rules:
    - id: period_basis
      applies_to: "all inventory rows"
      rule: "For each row i, divide its measured period exchange A_i by accepted net output Q; a_i = A_i / Q. Keep the numerator unit and disclose stock/changeover reconciliation."
      inputs:
        - A_i
        - Q
        - cp_output
      output: "Amount per 1 kg reference flow"
      source_ids: []
    - id: layer_reconcile
      applies_to: "decal_paper, ceramic_ink, covercoat, finished"
      rule: "Accepted sheet mass is retained dry carrier + dry gum + retained image solids + retained covercoat-film solids + actual residual water/solvent. For purchased composite paper, its component sum reconciles to one receipt; no constituent double counting."
      inputs:
        - cp_layers
        - cp_output
      output: "Disclosed physical layer balance"
      source_ids:
        - tullis-waterslide
        - vibrantz-ceramic
    - id: solvent_balance
      applies_to: "butyl_air, ethyl_air"
      rule: "For each actual species, net release is species input minus product retention, net stock accumulation, solvent sent out in each waste and documented recovered export. Internal solvent recovery is a loop, not destruction. Reconcile monitored vent and fugitive components without subtracting recovery twice or adding total VOC again. A negative/unclosed balance requires investigation, never clamping to zero."
      inputs:
        - cp_materials
        - cp_layers
        - cp_waste
        - cp_air
      output: "Species-specific net kg release"
      source_ids:
        - epa-eiip-2002
    - id: wet_stream_balance
      applies_to: "wet formulations and waste outputs"
      rule: "For each separately collected liquid stream, use whole wet mass or V multiplied by its measured density at the recorded state. Keep H2O, non-water liquids, actual solids and contaminants as internal composition ledgers whose sum equals that one whole stream; never send its solids or solvent out again unless physically separated and independently measured. Semisolid paste, separated solids, captured dust and contaminated cloth require their actual phase and receiver; “wet” alone does not establish liquid identity. Track issues/unused returns, beginning/end raw-material and work-in-progress stocks, test loss and internal rework once."
      inputs:
        - cp_layers
        - cp_materials
        - cp_water
        - cp_waste
      output: "Reconciled whole-stream and component accounts with residual uncertainty"
      source_ids:
        - epa-eiip-2002
    - id: packing_reconcile
      applies_to: "interleaf, carton, pe_wrap and their shipped outputs"
      rule: "For each actual component reconcile beginning stock plus receipts against end stock, shipped packing, unused supplier returns, recorded offcuts/damage and other actual losses. Shipped tare is outside Q. Screen inbound supplier containers, pallets, tape and other actual packing separately; identify each additional exchange and compatible receiver instead of hiding it in the sheet or imposing a generic packing rate."
      inputs:
        - cp_packing
        - cp_materials
        - cp_waste
      output: "Full individual packing/input-stock-output account"
      source_ids: []
  data_quality_requirements:
    - id: physical_balances
      applies_to: "all inventory rows"
      requirement: "Retain pre-allocation paper/solids, water and fossil/biogenic carbon balances, supplier backgrounds, actual losses and stock changes with uncertainty. Carbon in paper/gum/film is not an invented direct CO2 emission; actual biogenic CO2, if an expanded route emits it, must never be removed because of greenhouse-gas reporting conventions."
      evidence: "cp_layers; cp_water; cp_waste; cp_air"
    - id: identity_provider
      applies_to: "all inventory rows"
      requirement: "Verified broad identities require actual compatible material/route qualifiers and independent provider quantity/background checks. Missing UUIDs or unresolved chemical composition/receiving medium remain explicit gaps before concrete dataset release. Survey every actual extra chemical, waste or release; this conditional inventory is not a fixed factory recipe."
      evidence: "cp_materials; cp_air"
    - id: actual_consumables
      applies_to: "screen preparation, press, drying, cleaning and controls"
      requirement: "Screen actual frame/replacement parts, squeegees, sensitizers, reclaimers, antiblocking additions, oils/greases, filters and other maintenance/control consumables and their spent streams. A supplier-emulsion formulation is one receipt; separately purchased auxiliaries are separate exchanges. Retain reusable life/stock allocation and actual setup/replacement records; add each actual material, chemical, waste and elementary release as an atomic card before claiming complete LCI. No positive generic consumption is invented. If onsite abatement is present, measure its inputs, captured streams and actual species transformations in an explicit process extension; captured VOC is not automatically destroyed and exhaust after capture is the gate emission."
      evidence: "cp_materials; cp_energy; cp_water; cp_waste; cp_air"
    - id: source_scope
      applies_to: "all source rules"
      requirement: "Manufacturer statements support the corresponding layer/operation only. Do not claim one maker uses another supplier’s grade. EPA supports solvent accounting, JRC supports actual upstream paper and qualitative cutting screening; no historical factor or single-site amount is generalized."
      evidence: "mr-screen-production; tullis-waterslide; vibrantz-ceramic; epa-eiip-2002; jrc-paper-bref-2015"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Reject incompatible receiver/process routes, direct PSA labeling and every calendar. Require actual hard-porcelain glaze/firing compatibility; food-contact suitability requires separate actual migration/compliance evidence and is not established by this PCR."
    source_ids:
      - mr-screen-production
  - rule_id: validate_basis
    applies_to: "all inventory rows"
