system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "foreground"
      rule: "Include screen preparation, make-ready, ink and covercoat printing, electric drying/ventilation, actual cleaning, trim/QC losses and dispatch. Aggregate them into one foreground unit while metering each stage separately; physical internal handoffs have equal incoming/outgoing masses."
