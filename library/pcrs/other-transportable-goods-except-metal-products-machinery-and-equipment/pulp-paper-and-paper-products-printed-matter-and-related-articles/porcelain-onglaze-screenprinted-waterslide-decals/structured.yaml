      applies_to: "application"
      rule: "The paper carrier is delivered, then removed during downstream water release; track gum partition, film/ink transfer, spent paper, application water and kiln burnout/firing in any downstream model. No fired-ware or decoration-lifetime claim is made by the gate inventory."
