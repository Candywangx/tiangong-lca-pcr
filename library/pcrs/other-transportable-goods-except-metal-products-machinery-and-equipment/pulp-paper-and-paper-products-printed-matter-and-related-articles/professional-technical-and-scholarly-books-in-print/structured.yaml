allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following selects attributional manufacturing inventory treatment. ILCD chapter 7.9 concerns attributional multifunctionality; its decision-context limitations and annex 14.4 recycling distinctions apply. It is not permission to use attributional partitioning for a consequential claim. EPA VOC accounting supplies no LCA allocation hierarchy. [ilcd-lca-2010]"
    source_ids: []
  - rule_id: a_physical_load
    applies_to: "all inventory rows"
    rule: "Retain unallocated physical vector V by exchange, stage, owner and cohort, independently of environmental-load vector A. Burden shares do not shrink actual accepted books, wastes, purchased components or return/dispatch legs. Document which representation a model consumes; do not add V-based complete providers and already expanded A for the same service."
    source_ids:
      - ilcd-lca-2010
  - rule_id: a_subdivision
    applies_to: "shared processes"
    rule: "First separate title/edition jobs and directly meter distinguishable prepress, printing, binding, cleanup and utility operations. Apply justified virtual subdivision to uniquely attributable inputs before partitioning only the genuinely joint remainder. Keep setup, idle, failed-run and cleaning records, including periods with Q = 0."
    source_ids:
      - ilcd-lca-2010
  - rule_id: a_causal
    applies_to: "remaining shared loads"
    rule: "Test the determining physical relationship for each load: matched press runtime and load, actual sheet area/passes and ink coverage, binder/glue service, occupied space-time or measured thermal duty as applicable. Document why the selected driver changes that load, its numerator and complete denominator including other users and failed/idle activity. Page count, copy mass, topic or selling price alone is not demonstrated causality. If unsupported, retain unresolved allocation for that load."
    source_ids:
      - ilcd-lca-2010
  - rule_id: a_residual_value
    applies_to: "residual truly joint multifunctional loads"
    rule: "Only after documenting infeasible subdivision and absence of determining physical causality may a reviewed residual market-value method be considered. Use comparable quantities and actual prices at the joint point and condition, removing downstream-specific packaging/transport/services. If all necessary values and product/waste roles are justified and the positive denominator is valid, the proposed share is quantity_i × price_i divided by the sum over all relevant cofunctions; record period and sensitivity. Missing, zero or negative fee/value cases require explicit method review; never clip negative values to zero or force a ratio without support."
    source_ids:
      - ilcd-lca-2010
  - rule_id: a_cohort
    applies_to: "new production, WIP and old FG"
    rule: "First-release Q is a physical cohort fact, not monthly sales. Transfer inherited exchange-specific V/A from earlier WIP into its actual production cohort and carry closing WIP forward. Carry A for newly released closing FG with those books; later sale cannot allocate that burden again. Returned/old FG retains original Qc and vector plus actual additional service. Do not divide unrelated period purchases, all old services or all returns by current new Q."
    source_ids:
      - ilcd-lca-2010
  - rule_id: a_waste_recycling
    applies_to: "trim, plates, packaging and reused assets"
    rule: "Preserve full waste mass and actual receiver/treatment. A sale, nonpurchase entry, zero invoice or return does not establish zero embodied load, co-product status or avoided virgin production. Identify waste-treatment function versus recovered product and apply the study's reviewed recycling model with explicit ownership once; no automatic substitution credit. Unresolved fee, quality, displacement or provider boundaries remain gaps."
    source_ids:
      - ilcd-lca-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "book_manufacture"
      flow_role: "first-release complete book"
      record_type: "future foreground measurement"
      raw_fields: "title; edition; master hash; professional/research purpose; approved proofs; required figures/tables/equations/index; signature/page/copy count; accepted net masses; moisture; first-release time; original cohort; opening/closing FG; packaging tare"
      collection_method: "Inspect approved manuscript against imposition and sampled finished copies; record symbol/figure legibility, page sequence and binding/trim acceptance. Weigh using calibrated scales or traceable same-design measured copy sampling, reconciled to lot weights. Record first quality release separately from sale. Aggregation scope: per 1 kg reference flow; cp_release establishes compatible new Q only."
      unit: "kg; copies"
      frequency: "every job and release; stock closure"
      temporal_coverage: "declared lot and reporting period, including opening WIP and new closing FG"
      site_scope: "actual printer and declared finishing contractor"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed master/release record; scale calibration; sampling plan; rejected/corrected-copy log"
    - protocol_id: cp_materials
      process_id: "book_manufacture"
      flow_role: "paper, finished plate, starch, cloth separately"
      record_type: "future foreground measurement"
      raw_fields: "stage; lot; SKU; supplier; state; sheets/count; gross/tare/net mass; moisture; fibre/coating/solids; B/C stocks; external/internal movements; formation/consumption; transport; inherited vector"
      collection_method: "Weigh actual receipts, issues and states; verify supplier specifications and finished-plate coating. Close stage/component balances under calc_stage; same-state transfers are internal. Survey blankets, rollers, lubricants and refrigeration separately and add actual atomic exchanges before completeness. Aggregation scope: per 1 kg reference flow for compatible cohort V; A assigned independently."
      unit: "kg; sheets"
      frequency: "each receipt/job/transfer; period stock closure"
      temporal_coverage: "declared period with each production cohort identified"
      site_scope: "actual print/bind/pack stages and attributable contractors"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; weighing; supplier certificates; stage ledgers; uncertainty and discrepancies"
    - protocol_id: cp_formulations
      process_id: "book_manufacture"
      flow_role: "each colour ink and whole fount/wash SKU"
      record_type: "future foreground measurement"
      raw_fields: "stage; colour; SKU; batch; whole mass; density/temperature; complete ingredients/CAS; concentration; water/volatile/solid fractions; carbon origin; issue/recovery; product retention; waste/air fate; provider-owned components"
      collection_method: "Weigh each complete formulation and stock changes; obtain full supplier recipe/assay including ingredients absent from public SDS. Maintain analytical constituent balances and water subledger without adding their quantities/providers to an already owned whole formulation. Aggregation scope: per 1 kg reference flow for compatible cohort; whole/component ownership reconciled first."
      unit: "kg; m3"
      frequency: "each job, batch and formula change; period closure"
      temporal_coverage: "real batches during setup, run and cleanup"
      site_scope: "press, dampening, washing and storage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "actual SDS plus complete supplier disclosure/assays; calibrated weighing; density and recovery evidence"
    - protocol_id: cp_binding
      process_id: "book_manufacture"
      flow_role: "spine and side EVA separately"
      record_type: "future foreground measurement"
      raw_fields: "edition/job; glue SKU; chemistry; actual formulation; pot B/C; issues; returns; purges; retained glue; temperature/residence; setup/idle/running heater energy; milling and pull/handling acceptance"
      collection_method: "Verify nonreactive EVA grades for both used positions; weigh separate supplied issues and cooled purges; log melt-pot and binder energy. Reconcile glue in accepted/rejected books and WIP; source capability cannot establish a recipe or consumption. Aggregation scope: per 1 kg reference flow for compatible cohort."
      unit: "kg; MJ"
      frequency: "each job and pot filling/cleaning"
      temporal_coverage: "complete actual binding and standby cycles"
      site_scope: "actual binder and contractor if included"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier grade/recipe; weighing; meter logs; approved binding tests"
    - protocol_id: cp_utilities
      process_id: "book_manufacture"
      flow_role: "electricity; gas; purchased heat as separate exchanges"
      record_type: "future foreground measurement"
      raw_fields: "meter/device/stage; start/end; kWh; voltage; grid/region/year; gas m3; T/P; wet/dry; composition; compressibility; heating value; burner duty; supply/return masses in kg and specific enthalpies in kJ/kg; leaks/blowdown/storage with original energy units; full shared drivers"
      collection_method: "Submeter all stages and reconcile bills, distinguishing electricity, actual auxiliary gas and imported heat. Retain original units for all heat records, including already-MJ meters; apply the common-kJ balance and single net-kJ-to-MJ conversion in calc_heat. Preserve actual function, provider boundary and causal load evidence; never infer heatset drying, efficiency or steam-return mass equality. Add other actual fuels individually. Aggregation scope: per 1 kg reference flow for compatible cohort A/V; zero-Q records retained."
      unit: "MJ; kJ; kWh; m3; kg; kJ/kg"
      frequency: "continuous or each complete cycle; bill reconciliation"
      temporal_coverage: "actual setup, production, failed, idle and cleanup intervals"
      site_scope: "included plant utilities and declared outside heat supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; gas assays; T/P bases; enthalpy evidence; provider and shared-denominator records"
    - protocol_id: cp_water
      process_id: "book_manufacture"
      flow_role: "supplied water and net vapour separately"
      record_type: "future foreground measurement"
      raw_fields: "source; stage; volume; density/T; formula carrier water; paper moisture; B/C; makeup; bleed; condensate; product/waste water; inlet/outlet airflow and humidity; fuel hydrogen if relevant"
      collection_method: "Meter separately added water and independently quantify formulation/paper water and outgoing liquids. Measure matched inlet/outlet vapour on compatible bases, including control condensate. Reconcile actual water formation/consumption; residual is not an identified release. Aggregation scope: per 1 kg reference flow for compatible cohort; preserve whole-mixture subledger ownership."
      unit: "kg; m3"
      frequency: "each fill/bleed and representative full cycle; stock closure"
      temporal_coverage: "declared period and actual humidity/production conditions"
      site_scope: "actual fountain/wash/cooling and outdoor outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meters; moisture-specific methods; humidity/flow data; liquid assays and balance uncertainty"
    - protocol_id: cp_wastes
      process_id: "book_manufacture"
      flow_role: "each segregated whole waste stream"
      record_type: "future foreground measurement"
      raw_fields: "stream/bin; job/cohort; physical state; whole gross/tare/net mass; water fraction; independently measured solids/volatile fraction; constituents; receiver; treatment; fees/value; dispatch time; transport; B/C"
      collection_method: "Weigh every specific waste at transfer, retaining actual as-exported moisture and contamination. Distinguish rejected books, paper trim, collected dust, plates, ink, wash, fountain bleed, cloth and cooled glue; do not add contained components again. Aggregation scope: per 1 kg reference flow for compatible cohort; physical V never scaled by A shares."
      unit: "kg; m3"
      frequency: "every collection/dispatch and stock closure"
      temporal_coverage: "actual reporting period including stored waste and cleanup"
      site_scope: "factory gate and declared treatment contractor"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receiver acceptance; weighbridge; assays; contracts; actual treatment ownership and fee evidence"
    - protocol_id: cp_packaging
      process_id: "book_manufacture"
      flow_role: "each packaging component and leg"
      record_type: "future foreground measurement"
      raw_fields: "component/SKU/state; owner; cohort; original inherited V/A; raw/WIP/new-old FG/reusable B/C; first purchase P; first nonpurchase N_ext; same-item prior outward proof and ER; internal_in/out; real conversion; grossdispatch; owner-return; waste; transport; bundled price/provider ownership"
      collection_method: "Identify each box/film and every actual additional incoming/outgoing/reusable component. P includes first outside purchase even when embedded in a package price with no separate invoice; N_ext covers genuine first loan/rental/entrusted/with-goods entry. ER requires a proven same physical item's prior outward leg. Preserve each gross outward/owner-return/waste leg and actual transport; close calc_pack by component/state without netting. Aggregation scope: per 1 kg reference flow for compatible cohort; old services retain Qc or reviewed service basis."
      unit: "kg; items; tonne-km"
      frequency: "every first entry, shipment, return, discard and stock closure"
      temporal_coverage: "actual period and original reusable/FG cohorts"
      site_scope: "all included supplier and dispatch packaging boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "contracts/invoices including bundled charges; component weights; owner and same-item linkage; stock and transport evidence"
    - protocol_id: cp_returns
      process_id: "book_manufacture"
      flow_role: "returned/old book and actual added services"
      record_type: "future foreground measurement"
      raw_fields: "same-item identity; title/edition; owner; prior outward date; cohort c; Qc; inherited vector per exchange; physical gross return/outward; rework/repack/storage; added materials/energy/waste/transport; FG B/C"
      collection_method: "Match genuine return to the original outward item; carry its full compatible exchange vector, identify actual new service separately, and retain all physical legs. Record purchased complete books separately with an actual compatible provider; no duplicate whole-book and component expansion. Aggregation scope: per 1 kg reference flow of original cohort Qc or explicitly reviewed service basis; no new Q."
      unit: "kg; service units"
      frequency: "every return/rework/re-dispatch and closure"
      temporal_coverage: "original cohort plus actual service interval"
      site_scope: "actual receiving/servicing/dispatch site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original release/outward records; exchange vector; rework/service meters and transport records"
    - protocol_id: cp_emissions
      process_id: "book_manufacture"
      flow_role: "each actual outdoor species and disjoint particle bin"
      record_type: "future foreground measurement"
      raw_fields: "outlet/stage/time; actual ingredient/CAS survey; compound/carbon origin; inlet/outlet concentrations and flows; T/P; humidity; wet/dry/normal basis; response; recovery; calibration; LOD; filterable/condensable particle bins; control; NOx mass convention"
      collection_method: "Survey actual fount/wash/ink/glue/thermal chemistry, including species not prelisted here. Use competent validated compound-specific sampling and matched airflow integration over setup/run/cleaning/idle; Method18 excludes very low-volatility/polymerizing compounds unless another valid method covers them. Keep TVOC equivalents as QA rather than an additional species sum; residuals and nondetect uncertainty remain explicit. Aggregation scope: per 1 kg reference flow for compatible cohort; each outlet/time counted once."
      unit: "kg; mg/m3; m3/time"
      frequency: "representative complete operating cycles and each chemistry/control change"
      temporal_coverage: "actual period and outlet conditions including abnormal cycles"
      site_scope: "factory outdoor vents/stacks/fugitives; offsite providers excluded"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory/method competence; calibration/recovery/blank/LOD data; ventilation closure; actual carbon/species and PM definitions"
  calculation_rules:
    - id: calc_cohort
      applies_to: "all inventory rows"
      rule: "For a compatible new cohort with Q > 0, report physical exchange V_i / Q and assigned burden A_i / Q as different quantities. Q is total first-released net new book mass, with newly released closing FG once. Reconcile opening/closing raw and WIP and inherited vectors first; do not use all purchases or monthly sales as every numerator/denominator. If Q = 0 preserve records without division and leave assignment explicit."
      inputs:
        - cp_release
        - cp_materials
        - cp_utilities
        - "compatible V"
        - "separately assigned A"
      output: "per 1 kg reference flow physical and burden records with scope"
      source_ids:
        - ilcd-lca-2010
    - id: calc_copy_mass
      applies_to: "cp_release"
      rule: "Cohort accepted kg = sum of first-released accepted copy count by same-design stratum × its calibrated measured mean net copy mass; reconcile total lot weighing and moisture. Never substitute a generic book weight or include dispatch packaging."
      inputs:
        - cp_release
        - "stratum counts"
        - "same-design measured masses"
      output: "first-release Q in kg"
      source_ids:
        - chicago-production
    - id: calc_returns
      applies_to: "returned_book; old_book_dispatch"
      rule: "Carry each original exchange vector Vc_i and Ac_i with its actual same-item/cohort movement. Add measured new service vectors deltaV_i and deltaA_i separately; use original Qc for that cohort or an explicit reviewed service extent. Do not book inherited whole-book providers/components twice, net outward against return, or add copies to new Q."
      inputs:
        - cp_returns
        - "original Qc"
        - "original exchange vectors"
        - "actual added services"
      output: "original and incremental per-cohort inventory, no new reference production"
      source_ids:
        - ilcd-lca-2010
    - id: calc_stage
      applies_to: "all physical stages"
      rule: "For each material/state, B + external_in + internal_in + real formation = C + external_out + internal_out + real consumption + discrepancy. Transformation links reconcile underlying components and moisture. Same-state transfer is only internal_in/out; paired legs cancel across the consolidated process. Treat book-quality release as the Q event, not extra material formation in addition to an already counted complete book."
      inputs:
        - cp_materials
        - cp_formulations
        - cp_binding
        - cp_release
        - cp_wastes
        - cp_water
      output: "closed state-specific V ledger with explained discrepancies"
      source_ids:
        - epa-eiip-2002
        - mm-antaro
    - id: calc_pack
      applies_to: "each packaging component"
      rule: "At component/state level B + P + N_ext + ER + internal_in + actual formation = C + grossdispatch + owner-return + waste + internal_out + actual consumption + discrepancy. P, N_ext and ER are mutually exclusive entry facts; same-state inventory movement creates no formation. Sum mutually exclusive raw/WIP/new-old-FG/reusable stocks; keep owners/cohorts and inherited V/A. Use either whole-container or disaggregated component providers once, with actual repair/clean/transport additions; a zero separate price is not zero load."
      inputs:
        - cp_packaging
        - "component weights"
        - "owner/cohort records"
        - "original outward proof"
        - "compatible providers"
      output: "full physical component/leg ledger and separately attributed A"
      source_ids:
        - ilcd-lca-2010
    - id: calc_components
      applies_to: "complete supplied formulations"
      rule: "Analytical component mass = whole delivered mass × actual measured/verified mass fraction. Convert volume only with compatible measured density and temperature. Analytical water, carbon, pigments/resins and volatile fractions are linked subaccounts; only disjoint replaced provider portions become independent exchanges."
      inputs:
        - cp_formulations
        - cp_water
        - "actual composition/density"
      output: "constituent balances without whole/component double counting"
      source_ids:
        - epa-ctg-2006
    - id: calc_electric
      applies_to: "electricity"
      rule: "MJ = metered kWh × 3.6. Apply compatible cohort/service assignment separately from this exact unit conversion."
      inputs:
        - cp_utilities
        - "metered kWh"
      output: "electricity MJ before attribution"
      source_ids:
        - ilcd-lca-2010
    - id: calc_heat
      applies_to: "purchased_heat"
      rule: "Delivered control-volume heat is reconciled from the sum of supply mass × specific enthalpy minus the sum of return mass × specific enthalpy, with separately observed leakage/blowdown/other outlet and stored-energy terms at the declared boundary. Each kg × kJ/kg stream is kJ. Convert every energy term to kJ before combining with its declared control-volume sign; an already-MJ term is multiplied by 1000 only to enter this common-kJ balance. Divide the reconciled net kJ by 1000 exactly once to report MJ (1 MJ = 1000 kJ); an already-MJ meter reading used directly on the same delivered-heat basis is not divided again. Derive useful heat only from a complete energy balance; m(hs−hr) needs proven equal mass and, with m in kg and h in kJ/kg, yields kJ before this single division by 1000. Do not add boiler fuel again when included in a complete purchased-heat provider."
      inputs:
        - cp_utilities
        - "independent mass/enthalpy streams"
        - "leaks/blowdown"
        - "stored energy"
        - "provider boundary"
      output: "explicitly based delivered MJ and unresolved balance if incomplete"
      source_ids:
        - ilcd-lca-2010
    - id: calc_species
      applies_to: "each elementary air row"
      rule: "Integrate compatible outlet species mass flows minus matched inlet species mass flows, with measured response/recovery and correct wet/dry T/P bases. Count distinct outlet/time windows once; identify actual transformation and retention in product/waste before interpreting a balance. Unidentified organic remainder is not a known species."
      inputs:
        - cp_emissions
        - cp_water
        - "actual compound analyses"
        - "matched ventilation"
      output: "actual species kg with uncertainty before cohort normalization"
      source_ids:
        - epa-method18
        - epa-ctg-2006
  data_quality_requirements:
    - id: dq_purpose_master
      applies_to: "reference product"
      requirement: "Verify intended specialist use and approved edition; check required page/signature, diagram, equation, table, reference and index completeness against the real master. Professional topic does not prove this category or scientific correctness."
      evidence: "publication/commission; approved files and proofs; final-copy acceptance"
    - id: dq_site_recipe
      applies_to: "inputs and operations"
      requirement: "Verify actual equipment configuration, paper/plate/glue/ink/fount/wash SKU and complete formulations. Machine and manufacturer records establish possible technology, not the site's recipe, provider match or measured amount."
      evidence: "equipment/job logs; suppliers and assays; calibrated field records"
    - id: dq_ranges
      applies_to: "all important flows"
      requirement: "Obtain independent boundary-compatible range evidence or real foreground uncertainty before quantitative completion. This draft supplies no invented empirical ranges, plant factors, emission fractions or lifetimes; preserve each missing amount/range need and distinguish unobserved from demonstrated absence."
      evidence: "actual measured distributions; source applicability; explicit unresolved register"
    - id: dq_vectors
      applies_to: "all cohorts and packaging"
      requirement: "Audit per-exchange inherited V/A, mutually exclusive stocks, P/N_ext/ER and gross legs. Shared-load denominators cover all real users and intervals, not merely current sales; preserve zero-Q loads and incomplete allocation."
      evidence: "original cohort vectors; inventory/owner contracts; period balance and driver coverage"
    - id: dq_environment
      applies_to: "wastes and emissions"
      requirement: "Retain whole as-exported waste mass with independent water/solid/volatile analyses, actual receiver and treatment. Check species/CAS, carbon origin, air subcompartment, nonoverlapping PM bins and NOx basis; generic comments and factors cannot replace site evidence."
      evidence: "laboratory/receiver records; ventilation/combustion survey; mass/water/carbon reconciliation"
    - id: dq_identity
      applies_to: "every UUID/provider"
      requirement: "Exact native name/type/property/unit and route constraints establish only conditional identity. Verify site grade, form, geography/year and provider-owned stages separately; source classification/synonym defects remain disclosed. Missing UUID/provider/quantity is not zero or universal methodological rejection."
      evidence: "original database detail and support chain; compatible actual provider and specification"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference dataset"
    rule: "Confirm real professional/research purpose and selected physical route, complete approved title/edition and functional-unit qualifiers. Distinguish textbooks/general reference/directories/periodicals; do not infer book classification from an academic subject or a journal frequency rule."
    source_ids:
      - unsd-cpc3-2025
      - chicago-production
  - rule_id: v_q
    applies_to: "release and stocks"
    rule: "Check only one new reference output, Q first release and new closing FG once. Opening FG, already released returns, rework and later services cannot increase Q; record failed/idle/cleanup and zero-Q loads. Check WIP and old-cohort exchange vectors rather than redistributing all period purchases over current Q."
    source_ids:
      - ilcd-lca-2010
  - rule_id: v_balance
    applies_to: "stage and component ledgers"
    rule: "Verify each internal_out/internal_in pair, real state transformation and underlying component balance, mutually exclusive stocks and observed discrepancies. Same-state transfer is not receipt/formation. Retained ink/EVA/powder stay in full book mass; waste, airborne matter and product components are not double counted."
    source_ids:
      - epa-eiip-2002
      - mm-antaro
  - rule_id: v_pack
    applies_to: "packaging and returns"
    rule: "Reconcile every component's first purchase including bundled prices, first nonpurchase entry and proven same-item ER, owners/cohorts, inherited vectors, gross dispatch/owner-return/waste and actual transport. Reject net-only ledgers, free-entry zero-load assumptions and duplicated whole-container/component providers."
    source_ids:
      - ilcd-lca-2010
  - rule_id: v_loads
    applies_to: "assignment and recycling"
    rule: "Keep V separate from A; verify subdivision and each load-specific causal driver before any justified residual economic method. Missing/negative fees or values stay for review, never clip0. Audit waste/recovery function, actual treatment, provider ownership and any proposed credit once; no automatic credit from sales or returns."
    source_ids:
      - ilcd-lca-2010
  - rule_id: v_utility
    applies_to: "electricity, fuel and heat"
    rule: "Match native MJ/m3 units, actual electricity CN/voltage and provider, gas T/P/composition basis and separate supply/return heat streams. Missing leakage/blowdown/storage or mass equality prevents forced enthalpy simplification. No default boiler efficiency or combustion/print-drying factor."
    source_ids:
      - ilcd-lca-2010
      - epa-gas-2026
  - rule_id: v_species
    applies_to: "elementary outputs"
    rule: "Verify actual outdoor compounds, matched inlet/outlet quantities and relevant media; exclude indoor/long-term/correction candidates. Check disjoint PM bins, fossil/biogenic carbon and NOx-equivalent basis separately from N2O. TVOC equivalents, uncharacterized residuals, collected dust and offsite provider emissions are not additional identified factory species."
    source_ids:
      - epa-method18
      - epa-gas-2026
      - epa-ctg-2006
  - rule_id: v_gaps
    applies_to: "concrete dataset completion"
    rule: "Inspect actual extra chemicals, spot colours, maintenance parts, reusable packaging, transport and refrigeration. Add each real atomic exchange and disclose performed/skipped checks, amounts, ranges, sources and unresolved identities/providers/allocation. Mechanical consistency does not establish scientific, bilingual or classification acceptance."
    source_ids:
      - ilcd-lca-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Compatible route-specific specialist printed-book production input only after real foreground inventory and independent review."
  allowed_use: "The declared title/edition and manufacturing subset with compatible actual providers, complete cohort/component ledgers, measured quantities and uncertainty."
  excluded_use: "All-books or entire-classification average; alternative printing/binding construction; equal learning/professional/research service, content validity, lifetime or avoided-material claim; numerical dataset inferred from equipment capability or UUIDs."
  required_metadata: "Every reference qualifier; site/contractor/year; composition and provider scope; actual Q/Qc and V/A basis; stock/packaging/return legs; shared drivers and reviewed residual method; sources and transport/treatment ownership."
  required_quality_disclosure: "Sampling/calibration and balance discrepancies; actual chemistry/species/media and process coverage; unresolved range, identity, site/provider and allocation needs; performed/skipped checks and scientific/translation review status."
  update_trigger: "Change in intended use, edition/master, page/figure/index design, paper/ink/plate/glue/fount/wash grade, printing/binding route, site/provider/year, utilities/control, packaging system, return service or allocation evidence."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, PDF/printed pp.148–150; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Actual category/use, adjacent textbook/reference/directory distinctions and periodical-frequency context; no HS definition, construction or process requirement inferred."
  - id: "chicago-production"
    type: "literature"
    reference: "University of Chicago, How Books and Journals Are Produced, retained 27 October 2026; https://www.chicagomanualofstyle.org/help-tools/production-technologies.html"
    used_for: "Design, Electronic Workflow and Print Technologies sections: production/master and print-ready-file integrity context. Job-specific equation/index checks are this PCR's collection obligations, not universal numerical tests or LCI quantities."
  - id: "epa-eiip-2002"
    type: "official_guidance"
    reference: "EPA, EIIP Volume II Chapter 15, May 2002, §2.1.1 PDF14–15, Fig15.2-1; https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "Sheetfed offset books, dampening, penetration/oxidation and physical-stage survey; historical source description only, no universal recipe, factor or LCA allocation authority."
  - id: "epa-ctg-2006"
    type: "official_guidance"
    reference: "EPA-453/R-06-002, September 2006, IV.A, PDF12–14/printed6–8; https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "Actual ink/fountain/wash source categories and heatset contrast; no regulatory retention/VOC percentages, recipe or LCA allocation hierarchy adopted."
  - id: "mm-antaro"
    type: "literature"
    reference: "Müller Martini, Antaro official product page, retained 12 October 2026; https://mullermartini.com/en/product/antaro/"
    used_for: "Compact/flexible, Top class end products and Unbeatable variability paragraphs: offset gathering, milling, EVA options, softcover and trimming; alternatives and catalog limits are not actual site settings or quantities."
  - id: "kodak-sonora"
    type: "literature"
    reference: "Kodak, SONORA Process Free Plates Sustainability datasheet, PDF1, retained original with 2026 copyright; https://www.kodak.com/content/pdfs/print/KODAK-SONORA-Process-Free-Plates-Sustainability-datasheet-EN.pdf"
    used_for: "Processor-chemical/rinse exclusion for the specific process-free route; not proof of zero upstream plate burdens, on-press waste or plant water."
  - id: "henkel-hotmelt"
    type: "literature"
    reference: "Henkel, TECHNOMELT GA485D official product page, retained 12 October 2026; https://next.henkel-adhesives.com/us/en/products/industrial-adhesives/central-pdp.html/technomelt-ga-485d/SAP_IB-95677.html"
    used_for: "Soft-cover spine bookbinding hotmelt existence only; does not establish EVA composition, actual selected SKU, temperature, consumption or provider."
  - id: "walsworth-books"
    type: "literature"
    reference: "Walsworth, Commercial Book Printing, retained 12 October 2026; https://www.walsworth.com/book-printing"
    used_for: "Markets/Print Platforms/Binding options: scientific, technical and professional book production and available platforms. No single-job sheetfed/EVA combination, formulation, factory amount or provider match is established."
  - id: "ilcd-lca-2010"
    type: "official_guidance"
    reference: "JRC, ILCD Handbook General Guide for LCA—Detailed Guidance, first edition March 2010, §§7.9.2–7.9.3 PDF275–288/printed255–268 and annex14.4; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional decision-context limits, subdivision, determining physical causality, justified residual joint-point value, service-specific drivers and recycling distinctions. Negative waste-fee adjustment is an outlook requiring further method development, not permission to clip0 or invent a credit."
  - id: "epa-method18"
    type: "official_guidance"
    reference: "EPA Method18, web copy dated 1 April 2025, §§1–2 and4, PDF1–2; https://www.epa.gov/system/files/documents/2025-04/m-18-04012025_0.pdf"
    used_for: "Compound survey/calibration, interference and moisture correction; polymerizing/very low-volatility exclusions remain. Internet copy itself refers to the official regulatory version; used as technical design guidance, not a legal compliance assertion or measured emission result."
  - id: "epa-gas-2026"
    type: "official_guidance"
    reference: "EPA AP42 §1.4 Natural Gas Combustion, October 2026 retained copy, §§1.4.1–1.4.3 PDF1–3; https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "Conditional actual boiler/furnace and species survey only. No average gas composition/heating value, factor, efficiency or quantity transferred to book production."
  - id: "heidelberg-powder"
    type: "literature"
    reference: "Heidelberg News270, 2010, Small Grains that Have a Big Effect, PDF/printed53; https://www.heidelberg.com/global/media/en/global_media/company___publications/heidelberg_news/editorial/pdf_10/hn_270.pdf"
    used_for: "Distinct starch/sugar/calcium-carbonate powders and coating alternatives; survey actual powder type and fate only, no catalog particle size, application rate or airborne fraction adopted."
  - id: "eva-sds"
    type: "literature"
    reference: "BÜHNEN, Hotmelt Adhesives with product code A (Ethylenvinylacetate), SDS revision4 January2018 v2, PDF4 §10.6; https://www.buehnen.de/files/datenblaetter/Safety_Data_Sheet_EVA-A.pdf"
    used_for: "EVA-class possible acetic-acid/hydrocarbon decomposition survey; not the actual selected formulation or proof of emissions, temperature, density or VOC fraction."
