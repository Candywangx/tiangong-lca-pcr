product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.pulp-paper-and-paper-products-printed-matter-and-related-articles.professional-technical-and-scholarly-books-in-print"
  classification_refs: "CPC 3.0 32291; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "Specialized research, advanced technical and professional-practice titles in the declared complete uncoated-paper EVA-bound paperback construction."
  excluded_products: "Formal-programme textbooks; public general-reference works; contact directories; children's/general-interest books; periodicals; advertising catalogues; printed music as such; electronic/audio services; every alternative structure or printing/binding route excluded in section 1."
  representative_product: "One approved edition of a specialist scholarly monograph or professional technical book, complete with its manuscript-required diagrams, formulae and index, in an unlaminated flexible-paper-cover EVA paperback."
  production_route: "Approved print master → CTP → wet sheetfed text/cover offset and setting → fold/gather → mill/EVA glue/attach cover → trim/inspect → pack and factory-gate dispatch."
  market_state: "First-quality-released complete printed book at printer gate; net book mass includes retained ink and adhesive, and excludes transport packaging."
functional_unit:
  what: "Supply the approved specialized textual and graphical content as a complete printed professional, technical or scholarly book of a declared title and edition."
  how_much: "1 kg accepted net complete new books of the same design; retain copy count, page count and measured mass distribution."
  how_well: "Approved manuscript/edition, complete ordered signatures and required back matter; legible diagrams, symbols, equations and index; accepted trim, cover attachment and binding integrity under the actual job specification."
  how_long_or_cycle: "One manufacturing lot to first quality release at factory gate; no default reading service life, update interval, obsolescence date or equal professional outcome."
  reference_flow_link: "finished_book"
system_boundary:
  rules:
    - rule_id: b_content_gate
      applies_to: "applicability"
      rule: "Check specialized professional/research use from the real publication and commission. Academic subject, ISBN, periodic reprint or binding alone is insufficient; distinguish formal-course, public-reference and serial-periodical purposes before using this category. No HS-derived extra definition is imposed."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: b_route
      applies_to: "book_manufacture"
      rule: "Include production preflight/proofs, CTP, make-ready and corrective sheets, text and cover printing, setting, folding, gathering, milling, EVA melting/application, cover pressing, trimming, QC, packing, attributable maintenance and utilities. Confirm the selected construction from job/equipment/material records."
      source_ids:
        - epa-eiip-2002
        - epa-ctg-2006
        - mm-antaro
        - kodak-sonora
    - rule_id: b_master_integrity
      applies_to: "print master and release"
      rule: "Reconcile approved edition, final files and all manuscript-required content with plate/imposition records and sampled finished copies; record rejected/corrected impressions and their material/energy costs. Original research, authorship and rights administration are outside this manufacturing study; disclose that limit rather than implying all publishing services are included."
      source_ids:
        - chicago-production
    - rule_id: b_provider_once
      applies_to: "upstream and outsourced stages"
      rule: "Link each actually supplied whole product or formulation once. If disaggregating a provider, replace its owned portions explicitly; do not add contained pigments/resins/water to a whole recipe, paper mill to a complete paper background, or contractor operations to the same complete service twice. Retained book components are not additional final products."
      source_ids:
        - ilcd-lca-2010
    - rule_id: b_stage_balance
      applies_to: "every physical stage"
      rule: "For material/state k at stage s record B + external_in + internal_in + formation = C + external_out + internal_out + consumption + discrepancy. Formation/consumption are only real conversion between defined states: raw sheets become ink-bearing signatures, then gathered blocks and glued/trimmed books. Retain component mass, moisture and conversion links; do not create total matter from a bookkeeping state change. Same-state warehouse transfers are internal legs, never external receipts or formation. Match internal_out to the receiving internal_in; these cancel on consolidation."
      source_ids:
        - epa-eiip-2002
        - mm-antaro
    - rule_id: b_stock_cohort
      applies_to: "raw/WIP/FG/return records"
      rule: "Keep raw, WIP, newly released FG, previously released FG and reusable assets mutually exclusive at each cut-off. Track genuine outward and same-item return identities, owners, original cohorts and inherited V/A per exchange. Include current closing-new-FG first release once; failed lots, idle, cleanup and zero-Q burdens remain visible pending justified assignment."
      source_ids:
        - ilcd-lca-2010
    - rule_id: b_environment
      applies_to: "wastes and emissions"
      rule: "Measure each actual stream and species after capture at its true boundary. Collected dust, spent liquids and indoor circulation are not outdoor elementary releases. Factory boiler emissions are separate from purchased electricity/heat or offsite treatment backgrounds. No process-free plate-processor bath is assumed; plate manufacture and on-press coating fate still require accounting."
      source_ids:
        - epa-ctg-2006
        - epa-method18
        - epa-gas-2026
        - kodak-sonora
    - rule_id: b_additions
      applies_to: "actual additional exchanges"
      rule: "Survey ancillary heat/fuel, refrigeration leakage, lubricants, blankets, rollers, filters, incoming packaging and transport. Add each actually present specific exchange and provider/receiver basis before claiming completeness. Missing observation cannot establish absence or a cut-off. Alternative printing/binding structures require applicability review rather than automatic reuse."
      source_ids:
        - ilcd-lca-2010
        - epa-ctg-2006
boundary_abstraction:
  declared_starting_condition: "Approved manuscript/master and purchased dry unprinted text/cover sheets, finished process-free plates and actual supplied formulations at the printer; inherited WIP/FG/returns identified separately."
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "Only the declared professional/technical/scholarly printed-book subset; one classification coordinate does not broaden the physical route."
  recursive_input_rule: "Complete bought-in or returned books retain upstream production and original cohort evidence. Do not treat them as virgin paper, create another first-release output or cut off recursion with zero burdens."
  upstream_dataset_requirement: "Compatible paper, finished plate, complete formulated ink/fountain/wash/EVA, packaging, utilities, transport and waste-treatment providers, each with documented amount/state/route/geography/year and owned stages."
  disclosure: "Included site and contractors; edition and reporting period; original-content creation boundary; source/provider limits; raw/WIP/new-old FG and reusable stocks; all gross legs, balances, attribution and gaps; downstream use/disposal excluded."
