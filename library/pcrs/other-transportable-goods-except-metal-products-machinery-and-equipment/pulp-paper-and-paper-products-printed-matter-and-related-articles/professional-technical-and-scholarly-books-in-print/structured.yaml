measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh complete accepted new books after final trim, excluding dispatch packaging and including retained paper/ink/EVA/powder at recorded moisture; collect with cp_release."
  - id: cohort_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For the compatible new production cohort use per 1 kg reference flow. Q is the net mass first released in that cohort, including newly released closing FG once; opening FG and previously released books never enlarge Q. Preserve raw V and assigned A before normalization."
  - id: return_basis
    applies_to: "returned_book; old_book_dispatch"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "A genuine same-item return retains original cohort c, original accepted mass Qc and inherited exchange vector. Re-release, rework, repacking or dispatch does not create Q. Normalize original and additional service exchanges against that original Qc or a separately declared reviewed service basis, never indiscriminately against current new Q."
  - id: formulation_basis
    applies_to: "supplied chemical formulations"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh the whole supplied SKU, record water/solids/constituents and density/temperature for any volume conversion. Analytical component accounts are linked subledgers, not additional whole-formulation purchases or duplicate providers."
  - id: electric_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Native electricity uses MJ; 1 kWh = 3.6 MJ exactly. Match declared 1–35 kV supply and provider geography/year; bills alone do not identify a provider."
  - id: gas_basis
    applies_to: "natural_gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Preserve actual metering T/P, wet/dry basis, composition and compressibility; reconcile to provider volume. A secondary unit coefficient or methane CAS does not prove gas density, composition or heating value."
  - id: heat_basis
    applies_to: "purchased_heat"
    required_property_ref:
      name: "delivered energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Collect supply and return mass and specific enthalpy independently. When masses differ use separate enthalpy streams plus measured leakage, blowdown and storage terms. Mass in kg × specific enthalpy in kJ/kg gives kJ; under calc_heat reconcile all energy terms in kJ, then divide net kJ by 1000 exactly once to report MJ (1 MJ = 1000 kJ). Preserve already-MJ meter units and avoid duplicate conversion. Use m(hs−hr) only after proving equal mass at the same boundary; no invented efficiency."
