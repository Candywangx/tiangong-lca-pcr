allocation_rules:
  - rule_id: allocation_direct
    applies_to: "zine"
    rule: "First subdivide by issue/cohort and stage. Directly attribute masters, proofs, ink, remake/cleaning and measured energy to their causing jobs, including failed jobs. For remaining shared loads, substantiate causal time/load/occupancy drivers; only then use a documented physical allocation with sensitivity, or justified economic allocation if physical causation cannot be established. No universal shares."
    source_ids:
      - riso-sf-eii-2019
  - rule_id: allocation_ledgers
    applies_to: "all inventory rows"
    rule: "Preserve gross unallocated material, water, carbon, energy, waste and stock accounts separately from the attributed environmental-burden ledger. Burden shares never scale physical co-products, outgoing waste or paired internal links. Attribute a common provider once; do not add a second stencil/ink ingredient background to its whole-product purchase."
    source_ids:
      - epa-eiip-printing-2002
  - rule_id: allocation_recovery
    applies_to: "residues"
    rule: "Internal sheet reuse is not a co-product or a second released zine. Paper sale, cartridge return and core recovery do not automatically earn substitution credits. Retain actual receiver treatment and ownership; any expanded system or co-product choice needs explicit study-specific justification without double counting treatment."
    source_ids:
      - riso-sf-eii-2019
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "These are declared LCA accounting rules for this method; the equipment manual does not itself prescribe LCA allocation. The EPA chemical-fate balance is not evidence for an LCA allocation policy. Document actual causal allocation evidence separately; do not invent prices or shares, clip negative fees/residuals to zero, or award automatic return/recovery credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "zine"
      flow_role: "finished"
      record_type: "foreground_record"
      raw_fields: "title/issue/cohort; lot id; original first release event and net Qc; new first-release Q including new closing FG; net/gross/tare kg; moisture; copy count; page/fold/ink acceptance; opening/closing raw/WIP/new and old finished/returned goods; dispatch/returns/rework/rejects; complete exchange-indexed inherited V/A with native unit/provider/boundary/gate/stage/state/phase/medium/original period; later-service event/cohort/period"
      collection_method: "Weigh complete folded accepted lots on calibrated scales; subtract measured transport tare. Link each lot's first quality release once, including new closing FG once. Reconcile counts to measured mass without an assumed copy weight. Previously released stock, genuine returned copies and repeated rework acceptance do not create Q or another manufacture. Preserve their original issue/release/Qc and complete inherited vectors through each stock transfer; unknown inheritance stays unknown. Record actual later service/loss increments once on that original cohort, with any service view divided separately by known positive Qc, never unrelated current Q."
      unit: "kg"
      frequency: "each release, stock/service event and period close"
      temporal_coverage: "Complete declared new cohort and separately dated original accepted cohorts"
      site_scope: "Declared title, route, site and reference moisture state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration, unique release log, original Qc/vector provenance, physical stock and acceptance/service records"
    - protocol_id: cp_material
      process_id: "zine"
      flow_role: "paper; wipe; cleaner"
      record_type: "foreground_record"
      raw_fields: "SKU/lot; supplier; net/gross/tare; full composition; paper furnish/grain/grammage/moisture/area; cleaner formula/density/temperature; opening/receipts/returns/closing; stage issue/unused return; WIP"
      collection_method: "Weigh and reconcile each actual supplied product independently. Record proof, remake, setting, cutting and fold losses. Count whole cleaner once; keep formulation fractions separately. Retain raw unnormalized material and cohort burdens, including opening/closing WIP carry-forward."
      unit: "kg"
      frequency: "each lot/issue and period close"
      temporal_coverage: "Same cohort including failed and cleanup activity"
      site_scope: "Received supplies and every actual stage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated weights, supplier specification, complete formula, matched stock ledger"
    - protocol_id: cp_master
      process_id: "zine"
      flow_role: "master; spent_master; empty_core"
      record_type: "foreground_record"
      raw_fields: "roll SKU/composite; gross/web/core/fittings tare; opening/closing usable web; active drum master; original/replacement/confidential master ids; proof/reproof; unused tails; wet spent mass/retained ink"
      collection_method: "Measure actual web use and cores by tare/weighing; reconcile master-event counters with roll change and used-master collection. Do not assume one master per issue or constant mass per master. Keep retained active master and ink in stocks, not outgoing waste."
      unit: "kg; count as cross-check"
      frequency: "each master event/roll change/period close"
      temporal_coverage: "Full same-cohort master preparation and disposal"
      site_scope: "Actual machine/drum and disposal box"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Event log, SKU composition, scale/tare records and used-master reconciliation"
    - protocol_id: cp_ink
      process_id: "zine"
      flow_role: "ink_black; waste_ink"
      record_type: "foreground_record"
      raw_fields: "cartridge/SKU/lot; net ink/tare; full wet ingredient fractions/CAS/UVCB/carbon origins; receipts/returns; opening/closing drum/cartridge ink; paper/master/tissue/waste retained fractions"
      collection_method: "Obtain complete supplied formulation, weigh delivered and retained ink and reconcile all fates. Distinguish emulsion water from purchased cleaning water. A manufacturer ingredient family is not a full recipe or default emission/retention factor."
      unit: "kg"
      frequency: "each cartridge/job/period close"
      temporal_coverage: "Same cohort, including idle deterioration, proofs, remakes and failed jobs"
      site_scope: "Actual black drum and ink provider"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier full composition, calibrated net/tare weights, fate analyses and uncertainty"
    - protocol_id: cp_energy
      process_id: "zine"
      flow_role: "electricity; room_heat"
      record_type: "foreground_record"
      raw_fields: "actual supply voltage/provider/time; start/end stage meters; kWh/MJ; master/print/standby/cleanup; computer/extraction/finishing; shared occupancy/load; heat supply/return; excluded boiler boundary"
      collection_method: "Use calibrated boundary/submeters and matched time/load observations. Keep electrical and delivered heat quantities separate and include attributable idle/failed/cleanup loads. Do not use nameplate maximum power or advertised copies per minute as consumption."
      unit: "kWh; MJ"
      frequency: "operating modes and whole period"
      temporal_coverage: "Complete matched production/idle/cleanup period"
      site_scope: "Studio supply and shared room boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter logs, voltage/provider records and causal shared-load reconciliation"
    - protocol_id: cp_water
      process_id: "zine"
      flow_role: "water; wastewater; water_air"
      record_type: "foreground_record"
      raw_fields: "actual added water; volume/density/temperature; paper/ink/cleaner water; drum/stock/WIP/product moisture; spent tissue/master; outgoing liquid; inlet/outlet humidity/airflow"
      collection_method: "Weigh/meter actual additions and sample actual water content in retained/exported material. Derive net process-added evaporation from compatible water balance or matched humid-air measurements, retaining uncertainty; no assumption that all emulsion water immediately evaporates."
      unit: "kg; measured m3 if converted"
      frequency: "additions/sampling/period close"
      temporal_coverage: "Same cohort and matched water/air interval"
      site_scope: "Entire declared material and air boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/calibration, moisture/density methods, ambient baseline and residual balance"
    - protocol_id: cp_pack
      process_id: "zine"
      flow_role: "box; dispatch_box; empty_cartridge"
      record_type: "foreground_record"
      raw_fields: "atomic assembly/component id/material/unit/mass/count/tare; owner/custody/deposit/original cohort; P/N_ext/ER inward event and same-item prior outward proof; supplier-included packaging/provider boundary; inherited exchange-indexed V/A/provider/gate/stage/state/phase/medium/period; disjoint opening/closing empty-awaiting-decision, reusable-ready, raw-attached, WIP-attached, new-FG-attached and old-FG-attached stocks; gross EO attached dispatch/empty external return/service outward and separate waste; internal paired legs; actual wash/repair/transport/loss/service records; retained ink"
      collection_method: "Weigh each actual assembly. P is genuine purchase including packaging already paid within the goods price without a separate invoice; N_ext is first external nonpurchase borrowing/lease/entrustment/with-goods provision; ER requires evidence of the same item's prior outward movement. Classify each inward event once; opening stock/internal circulation is none of these. EO outward categories and waste are disjoint; preserve every gross leg and actual transport, never net ER against EO. Each stock item occupies one physical state/location; reusable status never adds another mass. Retain original owner/cohort and complete inherited vectors, with unknown prior burden explicit. Count compatible whole manufacture or disjoint component providers once, plus actual later wash/repair/transport/loss/service increments once; no free nonpurchase assumption, invented cycles/lifetime or credit. Reconcile new/old-cohort packaging separately from zine net mass and Q/Qc. Preserve cartridge packaging carried by the purchased whole-ink background exactly once, plus its physical return/waste fate. Add actual extra tape/band/wrapper individually."
      unit: "kg"
      frequency: "each inward/outward/internal/service event and period close"
      temporal_coverage: "Original owner/issue/cohort and separately dated packaging/service periods"
      site_scope: "Supply ownership, all stock states, studio boundary and every external gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Receipts/bundled-price or nonpurchase custody evidence, same-item outward/return chain, original cohort vectors, calibrated tare, gross transport/service records and stock balance"
    - protocol_id: cp_residue
      process_id: "zine"
      flow_role: "paper_waste; spent_master; waste_ink; spent_wipe; wastewater; empty_cartridge; empty_core; collected_dust"
      record_type: "foreground_record"
      raw_fields: "stream id/phase; whole wet mass; water/solids/ink/composite composition; density/temperature when liquid; collection/opening/closing; receiver/transport/treatment; retained constituents"
      collection_method: "Weigh disjoint whole external streams with composition samples and receiver records. If physically combined before gate, record one actual mixture and retain internal component transfers; do not count both. No generic hazard or recycling assumption; closing residues remain stock, not exported waste."
      unit: "kg"
      frequency: "each collection/consignment and period close"
      temporal_coverage: "Same cohort, cleanup and all residue stocks"
      site_scope: "Actual source stage and external receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Transfer manifests, analyses, calibrated weights, actual receiver acceptance and uncertainty"
    - protocol_id: cp_air
      process_id: "zine"
      flow_role: "pm_fine; pm_middle; pm_coarse; collected_dust; actual additional species"
      record_type: "foreground_record"
      raw_fields: "actual species/CAS/phase/carbon origin; size intervals; inlet/outlet concentration and measured volume; time/T/P/wet-dry; controls/fugitive paths; captured/deposited/returned mass; limits/uncertainty"
      collection_method: "Match species-resolved concentration to simultaneous air volume or integrate measured flow rate over time. Correct inlet baseline; avoid counting integrated volume twice with duration. Assess ink/cleaner constituents and actual aerosols beyond these starter rows; unresolved important fractions prevent an exhaustive inventory claim."
      unit: "kg"
      frequency: "representative real modes and complete interval integration"
      temporal_coverage: "Same cohort with proofing, idle, cleanup and failures"
      site_scope: "Outdoor boundary after controls plus actual fugitives"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling chain, calibration/blanks, speciation/size methods, measured flow/time and detection limits"
  calculation_rules:
    - id: release_quantity
      applies_to: "finished"
      rule: "Q = sum(net kg of new lots at first finished-product quality release), including newly released closing FG once whether dispatched or retained. Preserve original issue/cohort/release and its original first-release net Qc for already-released FG and genuine returns. Opening/closing FG, dispatch, returns, downgrades and moisture changes have separate physical reconciliation; old FG, sales, returns and repeated rework release never create Q or repeat manufacture."
      inputs:
        - cp_release
      output: "New-production Q in kg; separately retained original Qc in kg"
      source_ids:
        - risopop-folded-zines
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "For new production only, v_i = V_i / Q for strictly positive Q. V_i is the unallocated physical exchange of the selected new cohort in its declared native unit; burden shares never scale it. Separately normalize that cohort's attributed/allocated A by Q; A does not replace V_i or the original provider-labelled receipt vector. For shared loads retain the full common physical meter and causally identified cohort uses, then allocate only burdens with justified evidence. Sum raw new-cohort totals including setup, proofs, replacement masters, cleanup, idle and wholly failed zero-output lots before dividing once; never average lot ratios. Include opening WIP's complete carried inventory once and retain closing WIP's measured embedded V/A for later completion, without forcing all burden onto completed units. For already-released FG, genuine returns and rework, continue the original issue/release/Qc and complete exchange-indexed V/A/provider/whole-component boundary/gate/stage/state/phase/medium/original-period vectors through raw/WIP/FG/returned stocks; no current-average substitution or repeated manufacture. Assign actual later repacking/reinspection/rework/wash/repair/transport/cleanup/loss increments once to that original cohort with their actual periods. A separately reported continued-cohort/service view divides the original cohort's continued vector or separately identified service increment by original positive Qc, never current new Q; disclose which view is reported and do not add inherited manufacture twice. Internal rework enters Q only on first final release; old FG and returns never create Q. When Q = 0 retain absolute new-production/idle/failed/cleanup accounts and require review; real old-cohort services remain on original Qc. Unknown Qc or inherited burden remains unknown, with absolute service/stock accounts retained and no invented normalized value."
      inputs:
        - cp_release
        - cp_material
        - cp_master
        - cp_ink
        - cp_energy
        - cp_water
        - cp_pack
        - cp_residue
        - cp_air
      output: "New-production physical v_i per 1 kg reference flow and separate burden; original-Qc continued/service views and complete stock vectors"
      source_ids:
        - epa-eiip-printing-2002
    - id: energy_conversion
      applies_to: "electricity"
      rule: "Delivered electrical MJ = metered kWh * 3.6. Preserve voltage, provider and loss boundary; count common meter and submeter totals only once before period_normalization."
      inputs:
        - cp_energy
      output: "electrical MJ before normalization"
      source_ids:
        - riso-sf-eii-2019
    - id: physical_stock_balance
      applies_to: "zine"
      rule: "For each stage/storage account and conserved component on one measured state/unit basis: closing = opening + external_in + internal_in - external_out - internal_out + reported_residual. external_in/out cross the whole declared foreground boundary; internal_in/out cross only its stage/storage boundaries. Pair each internal transfer's source and destination at identical component mass/state/time; summing all accounts cancels the two internal legs, leaving closing_total = opening_total + external_in_total - external_out_total + residual_total. External outputs include disjoint product, waste and environmental fates. Residual is the calculated closing-minus-accounted discrepancy, not an exchange or a source; disclose it without adjusting observations. No receipt or same-state transfer is formation. For actual chemical species transformation, separately evidence paired stoichiometric formation/consumption while conserving elemental mass; evaporation is a water-state transfer, not water creation. Preserve gross raw provider-labelled receipts and returns; no burden share or Q changes this physical equation. For each atomic packaging component and owner/cohort: closing_total = opening_total + P + N_ext + ER - EO - external_waste + residual_total. P/N_ext/ER are mutually exclusive inward events; EO sums disjoint gross new/old-FG attached dispatch, empty external return and service outward events, once and separate from waste. ER requires same-item prior outward evidence; internal paired transfers cancel. Opening/closing stocks distinguish empty-awaiting-decision, reusable-ready, raw-attached, WIP-attached, new-FG-attached and old-FG-attached locations without overlapping mass. Preserve count/mass conversion, gate/state/provider, original owner/cohort V/A and each actual transport leg; no burden shares scale gross quantities. Later wash/repair/transport/loss increments enter the original account once, never another manufacture or zine Q. Whole/component providers cannot overlap, including whole-ink cartridge coverage."
      inputs:
        - cp_material
        - cp_master
        - cp_ink
        - cp_water
        - cp_pack
        - cp_residue
        - cp_air
        - cp_release
      output: "Unallocated stage/stock and consolidated component balances with measured residuals"
      source_ids:
        - epa-eiip-printing-2002
    - id: composition_fates
      applies_to: "ink_black; cleaner; spent_master; waste_ink; spent_wipe; wastewater; empty_cartridge"
      rule: "Constituent kg = whole-mixture kg * actual wet-mass fraction. Close supplied formulation fractions with uncertainty and reconcile opening + receipts against product retention, outgoing waste, emissions and closing stocks. Keep carrier water, dry solids and organic species distinct; uncertain residual is not a measured emission or a second purchase."
      inputs:
        - cp_material
        - cp_master
        - cp_ink
        - cp_water
        - cp_residue
        - cp_air
      output: "Disjoint raw constituent and carbon/water fates"
      source_ids:
        - riso-emulsion-technology
        - epa-eiip-printing-2002
    - id: measured_air_mass
      applies_to: "pm_fine; pm_middle; pm_coarse"
      rule: "For matching intervals, mass kg = sum(species or interval concentration in mg/m3 * measured air volume in m3) / 1000000, with matched T/P/wet-dry basis and inlet correction. Use disjoint size intervals; cumulative PM10 minus concurrent PM2.5 gives only the middle interval. Do not invent a size split or equate workplace concentration to outdoor emission."
      inputs:
        - cp_air
      output: "Raw outdoor kg before period_normalization"
      source_ids:
        - epa-eiip-printing-2002
  data_quality_requirements:
    - id: category_identity
      applies_to: "finished"
      requirement: "Establish seriality, actual frequency and residual subject category independently of equipment, broad UUID or another accepted PCR edge. Boundary uncertainty between general-interest, professional and other periodicals requires review."
      evidence: "Publisher publication plan, issue history, intended readership and content-category decision"
    - id: core_materials
      applies_to: "paper; master; ink_black; finished"
      requirement: "Resolve reference identity and full actual material composition without substituting conflicting route/form/furnish records. Retain specific identity gaps; missing primary identity or a hard physical conflict requires explicit review."
      evidence: "Official native identity/property/unit records and actual supplier/publisher specifications"
    - id: period_integrity
      applies_to: "all inventory rows"
      requirement: "Reconcile new first-release Q including new closing FG once, complete zero-output/idle/failed/cleanup activity and opening/closing raw/WIP/FG/return/residue stocks. Preserve original issue/release/Qc and complete inherited exchange V/A/provider/boundary/gate/stage/state/phase/medium/period vectors; unknown remains unknown. Later service/loss belongs once to that original cohort and any service view uses original positive Qc separately; no current averages, unrelated Q or repeated manufacture."
      evidence: "cp_release and stage/cohort/stock ledgers with original Qc, complete vector provenance and separately dated actual service records"
    - id: provider_once
      applies_to: "all purchased rows"
      requirement: "Match actual supply state, voltage, geography, property/unit and provider boundary once; whole formulations and composite packaging include upstream manufacture without overlapping constituent providers. Verify packaging P including bundled-price purchase, first nonpurchase N_ext and same-item evidenced ER, disjoint EO/waste and every gross transport/service leg. Nonpurchase is not free; preserve original owner/cohort vectors and disjoint cp_pack stocks, actual wash/repair increments and whole-ink cartridge background once without invented cycles or credit."
      evidence: "Supplier data/reference basis, bundled-price/custody and prior-outward evidence, complete inherited V/A, paired physical/burden accounts and gross stock/transport/service records"
    - id: chemistry_air
      applies_to: "ink_black; cleaner; elementary outputs"
      requirement: "Complete supplier formulation and actual fate/species assessment required; partial SDS, low-odour claims and regulatory total VOC do not establish zero or species-complete emissions. No Riso-specific factors are supplied."
      evidence: "Full formulation, cp_ink, cp_water, cp_air, receiver analysis and quantified uncertainty"
    - id: translation_context
      applies_to: "all inventory rows"
      requirement: "Preserve ordered rule ids, whole amount objects, process/direction/type, reference denominator and full H2/ancestor conditions in both languages; UUID-bearing names use official Chinese baseName."
      evidence: "Both Markdown renderings, generated projection and field-level author audit"
validation_rules:
  - rule_id: validate_category
    applies_to: "finished"
    rule: "Check publisher evidence against the category exclusions and selected stencil/fold construction. Similar paper-processing equipment never admits another CPC product under this identity."
    source_ids:
      - unsd-cpc3-2025
      - risopop-folded-zines
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Require one finished reference row at 1 kg, linked by finished; match EN/ZH denominator, raw aggregation and once-only normalization. Verify new closing FG enters Q once; old FG/returns/rework never create Q. Require original issue/release/Qc and complete inherited exchange V/A/provider/boundary/gate/stage/state/phase/medium/period vectors; later actual service/loss stays on original cohort and any service view uses known positive Qc separately. Reject current-average substitution, charging old service to new Q, repeated manufacture, ignored zero-output/idle/failed/cleanup accounts and unexplained WIP/FG/return differences; retain unknowns and absolute accounts."
    source_ids:
      - riso-sf-eii-2019
  - rule_id: validate_stencil
    applies_to: "master; spent_master; ink_black; paper_waste"
    rule: "Reconcile original/replacement masters, proof/remake sheets, residual drum ink, collected composite masters and paper waste separately. No constant stencil yield, ink dose, spare-part life or zero evaporation is presumed."
    source_ids:
      - riso-sf-eii-2019
      - riso-emulsion-technology
  - rule_id: validate_completeness
    applies_to: "zine"
    rule: "Report performed, skipped and unresolved checks separately from identity success. Unknown reference/primary identity, full formula, important site quantity/species or receiver remains explicit and prevents a complete applicable dataset claim. Ordinary auxiliary identity gaps alone do not establish a global methodology hold. Assess every actual additional consumable, container, part, service and release with its own atomic exchange before claiming complete site coverage."
    source_ids:
      - epa-eiip-printing-2002
      - riso-sf-eii-2019
  - rule_id: validate_ledgers
    applies_to: "all inventory rows"
    rule: "Keep gross physical mass/water/carbon/energy accounts and allocated burdens distinct, with paired internal legs cancelling. Check packaging closing = opening + P + N_ext + ER - EO - external_waste + residual on each component/owner/cohort basis: inward classes exclusive, ER same-item prior outward proven, EO categories and waste exclusive, all gross legs/actual transport retained, cp_pack stocks disjoint and complete. Count compatible whole or disjoint component manufacture and actual wash/repair/service increments once; preserve unknown prior burden, original owner/cohort vectors and whole-ink cartridge inclusion. Reject free nonpurchase, netted-away legs, invented reuse counts/credits, duplicate manufacture or new Q. No summed nested PM totals, automatic recovery credit, invented prices/shares or clipping negative fees/residuals. Preserve source scope and uncertainty; EPA fate balances do not authorize LCA allocation."
    source_ids:
      - epa-eiip-printing-2002
published_dataset_profile:
  dataset_role: "Candidate unit-process methodology for producing a site inventory; not measured plant data"
  downstream_use: "secondary_dataset or background_dataset only after actual applicability, identities, quantities and compatible upstream/receiver links are independently checked"
  allowed_use: "The declared monochrome digital-stencil single-sheet folded serial subject zine within CPC 3.0 32490"
  excluded_use: "Whole-leaf/all-technology coverage; other CPC products; equal reading-service claims; a complete lifecycle or complete site inventory inferred from tooling success"
  required_metadata: "All reference qualifiers; unique cohort and first-release Q; raw and carried WIP/FG/return records; master/ink composition; supply/receiver boundaries; physical and allocated accounts; source limits"
  required_quality_disclosure: "Core/auxiliary identity gaps, identity evidence period and any unavailable verification, formulation/species/quantity coverage, detection limits, uncertainty and independent review state"
  update_trigger: "Changed serial subject/category, sheet/furnish, stencil/ink chemistry, colour/passes, folding/binding, utility/cleaning/packaging/provider, new emission or treatment; retain this category identity for a revision"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF p150 and reference books/directories pp148-149. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification boundary only, including specific-subject zines and frequency; no process quantities, recipe or printing route imposed."
  - id: "risopop-folded-zines"
    type: "handbook"
    reference: "Riso Pop, Riso Folded Zine Workshop, first-party page, retrieved 2026-10-27. https://www.risopop.com/workshops?category=zine+making"
    used_for: "Existence of single-sheet folded Riso zines only. Workshop output does not prove serial publication, residual subject category, black ink, production scale or a measured LCI."
  - id: "riso-sf-eii-2019"
    type: "handbook"
    reference: "RISO, SF EII Series User's Guide, 065-36003, 2019. https://us.riso.com/wp-content/uploads/2019/08/UsersGuide_9450_ENG-RI-US-redux.pdf"
    used_for: "Printed pp15-16/PDF17-18 paper/dust context; p25/PDF27 master/proof/print; pp137-145/PDF139-147 consumables; pp148-150/PDF150-152 maintenance. Equipment-specific process/material evidence; no default yields, compositions, power consumption, emissions or local disposal route."
  - id: "riso-emulsion-technology"
    type: "handbook"
    reference: "RISO, Ink Development Technology, For RISOGRAPH section, retrieved 2026-10-27. https://www.riso.co.jp/english/tech_portal/core/ink.html"
    used_for: "Water-in-oil emulsion and separation/setting mechanism, distinct from ComColor inkjet. No full black-ink recipe, retained/evaporated fraction, marketing CO2 savings or universal emission factor adopted."
  - id: "epa-eiip-printing-2002"
    type: "official_guidance"
    reference: "US EPA, EIIP Volume II Chapter 15, May 2002, section 4.1, PDF31-32. https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "General material-balance/measurement method caution only, used by analogy to audit actual chemical fates. No claim that its offset/other-print factors characterize digital stencil or that its regulatory VOC convention is a full LCI."
