measurement_rules:
  - id: reference_mass
    applies_to: "finished"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_release for the net mass Q of newly produced lots at their first finished-product quality release. Include retained paper, ink and moisture; exclude transport packing, rejects and previously released stock."
  - id: sheet_master_basis
    applies_to: "paper; master"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect count, dimensions, actual grammage and independently measured mass/tare under cp_material and cp_master. Sheet area or master count is a cross-check, not a default conversion; roll core and end fittings are not stencil web mass."
  - id: mixture_basis
    applies_to: "ink_black; cleaner; wastewater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve whole supplied or exported mixture mass. Constituent/species mass uses actual full wet-mass fractions and measured water; solids and non-water mass are different. Volume requires compatible measured density and temperature."
  - id: energy_basis
    applies_to: "electricity; room_heat"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve metered kWh, convert electrical energy by 1 kWh = 3.6 MJ, and record delivered room heat separately. This quantity convention does not assert a boiler or a fuel input."
  - id: particle_basis
    applies_to: "pm_fine; pm_middle; pm_coarse"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report disjoint aerodynamic size intervals using matching concentration/air-volume/time bases. Captured dust and indoor circulating dust are not additional outdoor releases."
