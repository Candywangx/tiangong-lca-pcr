  methodology_review: Independent controller raw/source/measurement review complete; scientific methodology approval pending; not published
  semantic_boundary: Finished flat wet-formed wood-pulp depth sheets/plates, within the declared non-integrated route. Narrower CPC 32198 scope; no service-equivalence claim.
  deduplication: 'Controller queue and durable reviewed 32136 inspected: uncut resin-free cellulose filter base-paper reels exclude filled/resin-hardened filters and cut/formed products; this finished depth-media boundary is distinct.'
  reference_identity: 083aa644-72ee-464e-8ffa-f5b5f62321d5 confirmed manufactured factory-gate Mass/kg. Wet undried preforms rejected. Sparse broad identity does not establish a background provider.
  unresolved_flow_rows:
