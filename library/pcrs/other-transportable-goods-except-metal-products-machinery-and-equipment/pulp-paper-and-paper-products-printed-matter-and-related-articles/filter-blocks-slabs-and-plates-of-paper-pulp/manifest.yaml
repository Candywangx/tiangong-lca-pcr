    - carton_in
  unresolved_identity_reasons:
    resin_in: No exact polyamidoamine aqueous wet-strength formulation in bounded successful searches; nearby polyacrylamide/paint/injection resin rejected. Actual supplier composition/CAS/solids needed.
    carton_in: Actual board grade/furnish unavailable; 16.6/83.4 fibre-share box and laminated folding-carton records cannot establish generic shipping-box identity.
  provider_compatibility_pending:
    - All incoming materials/packaging/utilities require actual provider/basis/route verification; identity search is not background dataset completion.
    - Perlite UUID requires the recorded gas-heated vertical shaft expansion and grinding/purification route; alternative routes need compatible identity/provider.
    - Diatomaceous-earth identity used only for incoming unused aid; actual calcination/silica phase/grade and supplier route remain collection requirements.
    - Grid-average electricity below 1 kV; alternative supply must use compatible flow.
    - Steam-heat Mass/kg identity requires actual provider confirmation of delivered steam reference; no pressure or enthalpy default. Treated process-water output requires actual clean condensate quality and industrial-reuse acceptance.
    - DE locator is specifically beverage clarification; actual grade and destination must satisfy this limitation. Electricity locator is CN below1kV.
    - Screenings and unused sheet rejects use broad discarded-solid identity as distinct streams. Paper-production sludge requires actual primary mechanical fibre/mineral residue. Liquid-waste identity requires full mixture mass and actual phase/receiver; no hazard-class default.
  unresolved_range_evidence: No numerical input/yield/energy/water/emission/waste ranges adopted. Collect real grade-specific data and independent compatible sources; historical/single-plant values are not defaults.
  mapping_review: CPC 32198 narrower scope only for the finished flat wet-formed depth-media route; moulded blocks, specialised sorbent/support media and assemblies require separate evidence. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate.
