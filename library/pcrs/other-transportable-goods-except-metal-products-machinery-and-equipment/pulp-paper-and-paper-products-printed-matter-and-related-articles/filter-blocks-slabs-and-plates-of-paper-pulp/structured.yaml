          description: "Exported liquid to a named external treatment receiver; not direct freshwater discharge. Meter volume and sample COD, BOD, suspended solids, dissolved constituents, total nitrogen/phosphorus and AOX where resin chemistry warrants. Keep oxygen-demand indices as wastewater characteristics, not separate species emissions; document composition and treatment compatibility. The generic industrial liquid-waste identity is conditional on the actual liquid phase and receiver compatibility. Its native quantity is full liquid-mixture Mass/kg. Preserve the original measured wastewater volume V in m3; obtain m = V × rho using the measured batch/temperature-specific mixture density rho in kg/m3, then normalize m by Q. Record actual H2O fraction independently for the water balance; suspended/dissolved material is included in m. Do not treat full mixture mass as pure water or infer a legal hazard classification from generic narrative. Gel, solid residues or another phase need separate exchanges."
