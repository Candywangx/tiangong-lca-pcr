      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain measured V (m3), actual mixture density rho (kg/m3) at recorded temperature, full liquid mass m = V × rho and actual H2O fraction separately. Use m/Q for this native mass exchange; no default density or pure-water assumption."
  - id: particle_basis
    applies_to: "pm_fine, pm_coarse, pm_large"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use disjoint aerodynamic size classes on compatible sample/control/time bases. Missing or inconsistent size data cannot establish zero or a default split."
