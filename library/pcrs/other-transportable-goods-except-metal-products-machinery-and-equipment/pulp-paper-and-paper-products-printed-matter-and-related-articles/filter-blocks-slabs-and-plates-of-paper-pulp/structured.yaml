allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground_burden_allocation"
    rule: "First avoid allocation through measured process subdivision or an evidenced system expansion that preserves the additional functions, functional unit and compatible reference flows. Explain infeasibility before using causal physical relationships; when those cannot be established or used, justify other relationships and sensitivity. No default fraction or automatic avoided-production credit."
    source_ids:
      - epa-lca-2006
  - rule_id: allocation_physical
    applies_to: "foreground_burden_allocation"
    rule: "Keep full physical product/waste/water/carbon balances separately from the allocated environmental-burden ledger. Do not multiply physical co-product outputs or internal transfers by allocation shares."
    source_ids:
      - epa-lca-2006
  - rule_id: allocation_recovery
    applies_to: "foreground_burden_allocation"
    rule: "Internal broke/white water gets no avoided virgin-input credit. External sale of rejects or residues requires actual receiver/use evidence and declared allocation or system-expansion boundaries, without double credits."
    source_ids:
      - epa-lca-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "manufacture"
      flow_role: "filter_out"
      record_type: "weighing and acceptance"
      raw_fields: "batch; grade; accepted net mass Q; tare; gate moisture; geometry; performance test conditions"
      collection_method: "Calibrated weighing of accepted unused cut sheets/plates excluding packaging; moisture and grade tests linked to the same campaign"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative production campaign, including start/stop and changes"
      site_scope: "selected line and grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; lot acceptance; moisture and grade reports"
    - protocol_id: cp_materials
      process_id: "manufacture"
      flow_role: "pulp_in; de_in; perlite_in; resin_in"
      record_type: "lot issue and analysis"
      raw_fields: "supplier; lot; species/CAS; grade/production route; received and returned mass; moisture/solids; composition; stocks"
      collection_method: "Weigh actual ingredient issues and unused returns; reconcile opening/closing stock. Obtain supplier specifications and measure moisture/active solids; do not count carrier water twice"
      unit: "kg"
      frequency: "each lot/batch"
      temporal_coverage: "same campaign as cp_output"
      site_scope: "receipt and formulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; scales; certificates; formulation and stock reconciliation"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity_in; steam_in; condensate_out"
      record_type: "stage meters and supplier interface"
      raw_fields: "stage; kWh; steam kg; pressure; temperature; dryness; condensate kg and state; supplier reference; losses"
      collection_method: "Submeter all active stages; separately measure delivered steam and returned condensate. Reconcile utilities with the supplier boundary and measured state; retain steam mass where heat compatibility is unestablished"
      unit: "MJ; kg"
      frequency: "continuous or each batch"
      temporal_coverage: "same campaign including idle/changeover"
      site_scope: "manufacture and supplier interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; supply contract; state measurements; stage reconciliation"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "water_in; effluent_out; water_vapour"
      record_type: "water meters and laboratory measurements"
      raw_fields: "source; intake volume/mass; density/temperature; slurry/water stocks; internal transfers; product/waste water; export volume; sample load indices; exhaust humidity/flow"
      collection_method: "Meter external intake/export; use measured density for mass; reconcile formulation carrier water, product/waste moisture, condensate and evaporation. Flow-weighted wastewater samples include cleaning and changes; reconcile total nitrogen definitions and AOX applicability"
      unit: "kg; m3"
      frequency: "continuous balance; each batch and representative export sample"
      temporal_coverage: "same campaign including cleaning"
      site_scope: "wet/dry substages and named external treatment receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lab methods/LOD; receiver acceptance; water balance"
    - protocol_id: cp_pack
      process_id: "manufacture"
      flow_role: "film_in; carton_in"
      record_type: "packaging issue and weighing"
      raw_fields: "material; polymer/board construction; grade; fibre shares; issued/returned/scrap kg; stock"
      collection_method: "Weigh each packaging component separately and reconcile actual issues, unused returns and scrap; retain supplier material and route specifications"
      unit: "kg"
      frequency: "each packing lot"
      temporal_coverage: "same campaign"
      site_scope: "packaging station"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; purchase specs; issue records"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "screen_out; reject_out; dust_out; sludge_out"
      record_type: "weighing composition and transfer"
      raw_fields: "stream; external wet mass; moisture/dry solids; fibre/mineral/resin fractions; silica phase; hazard state; stock; receiver; internal return"
      collection_method: "Weigh each external waste separately; assay dry solids/composition and receiver compatibility. Retain internal wet/dry broke and captured dust recovery separately from external handover"
      unit: "kg"
      frequency: "each transfer/batch"
      temporal_coverage: "same campaign"
      site_scope: "manufacture and handover receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; analysis; transfer manifest; receiver route"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "pm_fine; pm_coarse; pm_large"
      record_type: "source tests and fugitive assessment"
      raw_fields: "source; grade; size cut; concentration; exhaust volume; temperature/pressure/wet-dry basis; control; hours; captured dust; fugitive paths; uncertainty"
      collection_method: "Test dry cutting and powder-handling discharge after controls with compatible flow and size measurement. Integrate load across actual operations including fugitive releases; distinguish cumulative from disjoint fractions; no wood-processing factor"
      unit: "kg"
      frequency: "representative source/grade/control measurements and operating logs"
      temporal_coverage: "same campaign including cutting/handling peaks"
      site_scope: "outdoor air at site boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling/calibration/LOD; source map; controls; size and flow compatibility"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "For each atomic exchange, divide the measured campaign total in its declared unit by Q, the same accepted net kg finished reference product; product reference output is 1 kg. Preserve stage meters and units. No factor is inferred from this normalization."
      inputs:
        - "campaign totals"
        - Q
        - cp_output
      output: "per 1 kg reference flow"
      source_ids:
        - epa-lca-2006
  data_quality_requirements:
    - id: physical_balances
      applies_to: "manufacture"
      requirement: "Close dry fibre, mineral, resin, total mass, water and carbon balances before allocation; include opening/closing stocks, full physical co-product outputs and internal links. Distinguish biogenic pulp carbon from fossil resin/film carbon; stored carbon is not an automatic removal credit. Any actual biogenic CO2 release must be retained separately from fossil CO2, regardless of greenhouse reporting conventions; extend species inventory if identified."
      evidence: "weighing; composition; cp_water; full physical ledger"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Include losses, cleaning/changeovers and tests; demonstrate conditional absence. Inventory is not complete until every actual aid, packaging component, waste and emission has its own exchange and actual provider/receiver. Missing identity or amount is not zero."
      evidence: "route audit; records; analytical screening"
    - id: identity_quantity
      applies_to: "all inventory rows"
      requirement: "Audit flow physical identity separately from supplier dataset reference quantity, route, geography and boundary. Sparse identity fields cannot supply a process burden, concentration, density, dosage or default energy value."
      evidence: "supplier specifications; verified identity; compatibility assessment"
    - id: ranges
      applies_to: "all inventory rows"
      requirement: "No universal input, yield, utility, emission or waste range is supported here. Obtain actual grade/route-specific records and independent compatible sources before defining quantitative ranges; historical/single-factory observations remain case evidence."
      evidence: "collection protocols; external-source applicability"
validation_rules:
  - rule_id: validate_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Require finished unused cut depth medium, declared formulation and manufacturing route; do not resolve an undried preform, uncut base paper or filtration service as the reference product."
    source_ids:
      - oiv-depth-sheets-2021
      - pall-seitz-sheets
  - rule_id: validate_measurement
    applies_to: "foreground_dataset_conformance"
    rule: "Require one 1 kg reference output, same net-moisture Q across rows and complete calibration/conversions. Product, dry ingredient, water and heat bases must be explicit and compatible with providers."
    source_ids:
      - jrc-paper-bref-2015
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Missing UUID, unsupported supplier reference, incomplete source measurement or unaccounted actual exchange prevents claiming a complete dataset. Assess wastewater receiver and contaminant load; do not invent a matching flow or a zero emission."
    source_ids:
      - epa-lca-2006
  - rule_id: validate_air
    applies_to: "foreground_dataset_conformance"
    rule: "Check actual dry cutting and powder handling; particulate fractions must be disjoint, collected dust distinct and source/medium correct. Screen actual resin-related species; any identified chemical release requires separate exact species/media row. No universal emission factor."
    source_ids:
      - jrc-paper-bref-2015
  - rule_id: validate_function
    applies_to: "foreground_dataset_conformance"
    rule: "A factory-gate material inventory cannot establish adsorption or filtration service equivalence. Comparisons require matching challenge conditions, throughput, retention, cleaning/regeneration and lifetime evidence for the stated actual grade."
    source_ids:
      - pall-seitz-sheets
      - oiv-depth-sheets-2021
published_dataset_profile:
  dataset_role: "Foreground manufacturing inventory; after completion/review, secondary_dataset or background_dataset"
  downstream_use: "Input for explicitly modelled filtration-system product and actual-use studies"
  allowed_use: "Declared gate-moist grade/route with matched providers and complete actual inventory"
  excluded_use: "Automatic mass-based filtration/adsorption equivalence; universal recipe; manufacture of excluded products/routes"
  required_metadata: "Reference qualifiers; grade/formulation; site/period; stage diagram; physical balances and allocated burden ledger; supplier/receiver boundaries"
  required_quality_disclosure: "Measured/modelled amounts; identity gaps; provider compatibility; uncertainties; omitted ranges; unreviewed scope; treatment handover"
  update_trigger: "Change in furnish, mineral/resin grade, porosity/retention requirement, drying/cutting, utilities, water/effluent route or waste receiver"
