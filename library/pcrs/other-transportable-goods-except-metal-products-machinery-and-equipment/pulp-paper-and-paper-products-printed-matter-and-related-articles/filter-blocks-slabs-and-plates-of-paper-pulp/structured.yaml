    required_unit: "kg"
    rule: "Preserve supplied solution mass and measured solids separately; dry active mass is solution mass times verified active fraction. Carrier water belongs in the water balance, not a second purchased-water exchange."
  - id: energy_basis
    applies_to: "electricity_in"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Verified energy unit group supports 1 kWh = 3.6 MJ; retain provider voltage, delivery point and loss boundary. This conversion does not establish net steam heat."
  - id: steam_basis
    applies_to: "steam_in, condensate_out"
