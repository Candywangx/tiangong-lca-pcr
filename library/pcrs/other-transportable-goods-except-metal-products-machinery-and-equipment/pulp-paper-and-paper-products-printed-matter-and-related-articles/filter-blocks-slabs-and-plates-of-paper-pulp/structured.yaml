      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record delivered steam and returned liquid separately. Heat balance uses their measured states and supplier-defined reference; do not infer usable heat from a property label or default enthalpy."
  - id: water_mass_basis
    applies_to: "water_in"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve delivered tap-water mass. When measured by volume, convert using measured density and temperature compatible with the supplier reference; no default density."
  - id: effluent_volume_basis
    applies_to: "effluent_out"
    required_property_ref:
