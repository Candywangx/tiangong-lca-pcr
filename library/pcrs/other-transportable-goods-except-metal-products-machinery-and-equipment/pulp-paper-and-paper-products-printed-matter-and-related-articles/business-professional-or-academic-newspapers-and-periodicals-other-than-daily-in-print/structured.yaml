system_boundary:
  rules:
    - rule_id: boundary_manufacture
      applies_to: "journal"
      rule: "Include receipt/tare, issue/forme preflight, make-ready and plate changes, both-side sheet printing, wet dampening, pile setting, cleaning, folding/nesting, stitching/trim, first release and packing. Keep imposition/plate-preparation burdens at the actual provider once."
      source_ids:
        - epa-printing-eiip-2002
        - chicago-journal-production
        - newman-saddle-stitching
    - rule_id: boundary_utilities
      applies_to: "journal"
      rule: "Account for drives, compressors, extraction, pile drying/ventilation, folders/stitchers/trimmers, cleaning and common services over run, idle, failed lots and shutdown. Verify no combustion, purchased process heat or refrigeration in this case; if present, extend reviewed atomic input/emission/stock records before completeness."
      source_ids:
        - epa-offset-ctg-2006
    - rule_id: boundary_transfers
      applies_to: "journal"
      rule: "Aggregate physical stages into one foreground node while retaining paired equal mass/state/time transfers and stage stocks. Count a material, provider service or waste crossing once; internal circulation is neither a fresh purchase nor a disposal credit."
      source_ids:
        - epa-printing-eiip-2002
