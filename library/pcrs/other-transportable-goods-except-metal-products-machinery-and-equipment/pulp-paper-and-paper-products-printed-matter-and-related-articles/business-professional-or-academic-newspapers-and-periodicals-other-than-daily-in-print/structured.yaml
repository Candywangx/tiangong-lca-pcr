measurement_rules:
  - id: reference_mass
    applies_to: "finished"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "cp_acceptance measures Q, net complete issues first released in the period; include their stitches, self-cover, retained constituents and actual moisture. Exclude shipping tare, inserts outside this construction, rejects, opening finished stock and repeat release of the same item."
  - id: sheet_mass
    applies_to: "paper; paper_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "cp_materials records net sheet mass. Area times measured grammage may cross-check it only for the same grade/moisture and measured sheets; page count is not sheet count, and imposed blank/trim areas remain material."
  - id: electricity_units
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the native electrical-energy convention and compatible supply boundary; 1 kWh = 3.6 MJ. This property does not turn electricity into fuel or purchased useful heat."
  - id: mixture_basis
    applies_to: "ink; fountain; wash; powder; maintenance_oil; maintenance_grease"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain whole supplied-mixture mass and complete measured/certified constituent fractions separately; water, solids and active substance are distinct bases. Components of one purchase are not additional purchases."
  - id: air_species
    applies_to: "ipa_air; ethanol_air; pm25; pm2510; pm10; water_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report actual species/size-interval mass to outdoor air. Match concentration and volume conditions; do not equate TVOC carbon mass with a solvent, indoor exposure with emission, or nested PM totals with disjoint fractions."
