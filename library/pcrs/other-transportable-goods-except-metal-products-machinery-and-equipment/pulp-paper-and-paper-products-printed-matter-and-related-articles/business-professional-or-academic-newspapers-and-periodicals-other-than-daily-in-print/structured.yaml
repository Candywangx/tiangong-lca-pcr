allocation_rules:
  - rule_id: allocation_cause
    applies_to: "journal"
    rule: "First subdivide by issue/forme/stage and attribute measured paper, ink, plates, cleaning and wire to actual jobs. For shared electricity/extraction/maintenance use measured load-time, actual impressions/passes, wash cycles or demonstrated causal service use before a justified allocation; no default revenue/copy/mass share. Record evidence and sensitivity when causality cannot be resolved."
    source_ids:
      - epa-printing-eiip-2002
  - rule_id: allocation_ledgers
    applies_to: "journal"
    rule: "Maintain gross physical material/water/carbon/energy balances, stocks and equal internal links separately from attributed/allocated environmental burdens. Do not multiply physical waste or transfer quantities by burden shares. Apply the selected burden attribution once, then the sole applicable cohort-denominator normalization under normalize_period, including original Qc for later old-FG service; do not successively divide each stage/lot."
    source_ids:
      - epa-printing-eiip-2002
  - rule_id: allocation_residuals
    applies_to: "journal"
    rule: "Paper, wire or plate resale is not automatic co-product status or an avoided-virgin credit. Internal return and recovered service remain internal; require explicit receiver, method and study-boundary evidence for any separately reviewed allocation/system expansion."
    source_ids:
      - epa-printing-eiip-2002
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "These are author-designed LCA accounting requirements informed by physical process and material-balance evidence; the sources do not prescribe journal-specific LCA allocation shares."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "journal"
      flow_role: "finished"
      record_type: "foreground_record"
      raw_fields: "title/ISSN; frequency; volume/issue/edition; lot/item identity; first-release date; gross/tare/net kg; moisture; copies; page/signature map; print/trim/stitch acceptance; opening/closing FG; dispatch/returns; original owner/cohort/Qc/basis; complete prior exchange V/A/provider/gate/state/phase/medium/period vectors; actual later services and attribution"
      collection_method: "Calibrated net weighing or traceable weighed lots of complete accepted issues. Reconcile first-release identifiers against stocks and dispatch; copy sampling requires actual same-configuration mass and uncertainty. Wrong issue/sequence or incomplete binding cannot pass by mass alone. Trace all later old-FG service, including unreturned packing/inspection, to original Qc and complete prior foreground/background vectors; distinguish service-only increment from continued-cohort view without new manufacture or first release."
      unit: "kg"
      frequency: "each lot and first release"
      temporal_coverage: "complete fixed period including zero-output lots and rework"
      site_scope: "same title/issue/construction and printer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed acceptance, calibrated weighings, issue/page checks, original-cohort/Qc/vector evidence, later-service attribution and FG ledger"
    - protocol_id: cp_materials
      process_id: "journal"
      flow_role: "paper"
      record_type: "foreground_record"
      raw_fields: "supplier/grade; coated sheet size; fibre/coating; grammage/moisture; receipt gross/tare; opening/closing unused and stage WIP; sheets issued/returned; forme/side/pass; trim/blank area; rejects/rework; provider"
      collection_method: "Weigh net stock and stage transfers; reconcile count-area-grammage against actual moisture and imposition. Include all makeup and failed runs. Distinguish stage transformation from a new receipt; same self-cover stock crosses purchase boundary once."
      unit: "kg; m2; sheets"
      frequency: "receipt/forme and period boundaries"
      temporal_coverage: "complete same period"
      site_scope: "receipt, press, pile setting, folding and finishing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale and grammage/moisture tests, supplier specification, imposed sheet/page map"
    - protocol_id: cp_formulas
      process_id: "journal"
      flow_role: "ink; fountain; wash; powder"
      record_type: "foreground_record"
      raw_fields: "actual SKU/lot; full constituent CAS/UVCB/mass fractions/water/solids/carbon origin; density/T; receipt/stock/return; measured dose; pan/wash/powder stocks; retention/residue/emission"
      collection_method: "Weigh supplied mixtures and dose records; obtain full formulas including nonhazardous constituents omitted from SDS. Reconcile complete fractions, stock and disjoint fates; do not invent generic acid/solvent/powder recipes."
      unit: "kg"
      frequency: "each batch/change/wash"
      temporal_coverage: "make-ready, runs, failed lots, idle, cleanup and shutdown"
      site_scope: "actual press and suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full composition certificates, balance records, analytical methods/uncertainty"
    - protocol_id: cp_consumables
      process_id: "journal"
      flow_role: "plate; wire; blanket; cloth; maintenance_oil; maintenance_grease"
      record_type: "foreground_record"
      raw_fields: "assembly/grade; issue/forme/side; plate area/net mass/coating/imaging provider; wire alloy/coating/diameter/length/mass/stitches; replacement/service/installed stock; oil/grease full grade/formula; fabric reuse/laundry"
      collection_method: "Weigh assemblies and actual consumed/replaced makeup, retain installed and stores stocks, paired reuse/laundry and receiver records. Wire counts/length convert only with actual measured compatible mass data. Record outsourced plate preparation once."
      unit: "kg; m; count"
      frequency: "receipt/change/service and period"
      temporal_coverage: "complete same period and attributed service interval"
      site_scope: "press, fold/stitch/trim and actual supplier/laundry"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales, component specifications, service logs, plate-provider boundary and uncertainty"
    - protocol_id: cp_utilities
      process_id: "journal"
      flow_role: "electricity; water"
      record_type: "foreground_record"
      raw_fields: "meters/boundaries; kWh; country/voltage/grid/provider; run/idle/makeup/cleanup loads; compressor/extraction; water kg/volume/density/T/source/treatment; actual heat/fuel/refrigeration presence"
      collection_method: "Read calibrated supply/stage meters at matched boundaries. Preserve raw kWh and water basis. Meter or causally attribute common services with full run/idle/failed/cleanup coverage; rated power times advertised output is not measurement."
      unit: "kWh; MJ; kg"
      frequency: "matched readings and interval modes"
      temporal_coverage: "complete same period"
      site_scope: "whole journal node and actual shared services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meters, equipment/supply diagrams, source/voltage/provider evidence"
    - protocol_id: cp_packaging
      process_id: "journal"
      flow_role: "box; waste_box"
      record_type: "foreground_record"
      raw_fields: "component/item identity; actual material/grade/state; owner/custodian/cohort; original unit and measured quantity conversion; acquisition/payment/bundled-paid evidence; P/N_ext/ER classification; same-item prior outward record; complete prior V/A/provider/gate/state/phase/medium/period vectors; supplier-included burden; gross/tare/net contents; mutually exclusive opening/closing empty/raw/WIP/FG/reusable/waste stocks; all gross new/old-FG dispatch; EO owner-return/service outward; external waste; each actual transport/wash/repair/loss leg"
      collection_method: "Weigh each actual packing component. P is first procured entry, including packaging paid within a bundle even without a separate packaging invoice. N_ext is first actual external non-purchased supply, including loan, lease, customer/entrusted or goods-accompanying packaging; it is incoming, never an outgoing term. ER requires the same item's prior evidenced outward leg, owner/cohort continuity and prior vectors; a loan/lease/entrusted receipt without that prior outward is N_ext, not ER. P/N_ext/ER are mutually exclusive per entry event; opening stock and internal movement are not new entries. Reconcile ownership/custody, all stock states and gross movements under packaging_balance. Retain complete prior foreground/background vectors and unknown history as unresolved, never zero because free. Count manufacture/provider burden once at its actual boundary, including supplier-included supply; charge actual later washing/repair/transport/loss once to the applicable cohort without invented reuse cycles, lifetime or credit."
      unit: "kg"
      frequency: "receipt/pack/dispatch/return"
      temporal_coverage: "complete same period"
      site_scope: "receiving, packing and FG stores"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "measured tare/conversion and stock records; acquisition/bundled payment and ownership/custody evidence; same-item prior outward/cohort/vector records; all gross transfer/transport and receiver evidence"
    - protocol_id: cp_residues
      process_id: "journal"
      flow_role: "paper_waste; spent_plate; spent_fountain; spent_wash; spent_blanket; spent_cloth; wire_waste; waste_ink; spent_oil; spent_grease"
      record_type: "foreground_record"
      raw_fields: "stream/stage; whole mass/state; water-specific fraction; independently assessed solids; density/T for liquids; actual contamination; opening/closing waste; internal return; receiver/transport/treatment"
      collection_method: "Weigh disjoint outgoing streams and waste stocks; sample whole mixtures. Distinguish water from nonwater and dry solids from volatile organic mass. Count merged outlet once, retain internal transfers/composition. Capture all rejects and cleanup residues; no arbitrary drying of waste quantities."
      unit: "kg"
      frequency: "generation/consignment and stocks"
      temporal_coverage: "complete same period including stored waste"
      site_scope: "each actual stream and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale records, samples, manifests, compatible receiver basis and uncertainty"
    - protocol_id: cp_species
      process_id: "journal"
      flow_role: "ipa_air; ethanol_air"
      record_type: "foreground_record"
      raw_fields: "actual CAS/species/formulation; c in species mg/m3; matched volume/flow-time/T/P/wet-dry/oxygen basis; outlet/fugitive/control state; blanks/detection; retained/waste/stock/transformations; carbon origin ; matched inlet/background species concentration and independent inlet/outlet integrated volumes; gross legs; background-correction ownership; uncertainty"
      collection_method: "Validated species-resolved sampling with simultaneous flow and representative operating-mode coverage, reconciled with material/species balance. Do not treat total FID carbon as a pure solvent, or a workplace concentration/rated fan capacity as boundary mass. Additional actual species need separate cards.  Measure matched ventilation inlet and final outdoor outlet/fugitive boundaries in the same operating intervals and compatible gas states. Retain both gross species masses and calculate the net contribution under species_mass; concentration already corrected for inlet background must not receive that correction again. Missing inlet/boundary coverage remains an explicit evidence gap, not assumed zero background."
      unit: "mg/m3; m3; kg"
      frequency: "matched monitoring intervals"
      temporal_coverage: "complete period modes including cleanup and fugitive losses"
      site_scope: "final outdoor boundary, not internal circulation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "analytical calibration, sampling chain, flow/basis, coverage and uncertainty"
    - protocol_id: cp_dust
      process_id: "journal"
      flow_role: "collected_dust; pm25; pm2510; pm10"
      record_type: "foreground_record"
      raw_fields: "source/collector; fibre/coating/ink/starch/moisture; capture/return/export/stocks; matched air volumes/concentrations and aerodynamic cuts; fugitive/bypass; uncertainty"
      collection_method: "Weigh captured/exported dust separately; measure outdoor disjoint size intervals or compatible cumulative differences, with matching flow/conditions. Retain missing size fractions and monitoring modes as gaps. Do not use a wood-dust emission factor."
      unit: "kg; mg/m3; m3"
      frequency: "collection and matched air intervals"
      temporal_coverage: "complete same period and finishing/cleanup modes"
      site_scope: "press/powder/folding/trim and outdoor boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "collector/bin weights, composition, size-resolved tests and uncertainty"
    - protocol_id: cp_water
      process_id: "journal"
      flow_role: "water_air"
      record_type: "foreground_record"
      raw_fields: "paper/formulation/supply water; pan/stock/WIP/product moisture; liquid/cloth/waste water; inlet/outlet humidity/flow/T/P; reaction water and uncertainty"
      collection_method: "Reconcile measured water and stocks with net process-added vapour, retaining separate gross inlet/outlet moisture. Validate any oxidation-related reactant/product water and oxygen terms before physical closure; no assumed supply-to-evaporation fraction."
      unit: "kg"
      frequency: "period and matched monitoring"
      temporal_coverage: "complete same period"
      site_scope: "all material/water stocks and final air boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water-specific analysis, moisture tests, humidity/flow records and residual uncertainty"
  calculation_rules:
    - id: accepted_period
      applies_to: "finished"
      rule: "Q = sum(net kg of complete lots/items first quality-released in the fixed period). Include newly accepted closing FG; exclude opening FG dispatch and duplicate rework release. Reconcile closing FG = opening FG + new release + returned accepted stock - dispatch - scrapped/other removals, with internal rework traced separately. Q must be positive to normalize."
      inputs:
        - cp_acceptance
      output: "Q in kg and FG reconciliation"
      source_ids:
        - chicago-journal-production
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For the matched new-manufacture pool, x_i = X_i / Q for the complete issue/route/site/period; Q is accepted_period first release, including new closing FG once. Sum raw exchange totals, including zero-output failures, WIP stock movements, internal rework and cleanup, before the sole division. For every actual later service to old FG, including unreturned/unreworked packing or inspection, use service_increment_i = actual cohort-attributable added exchange / original valid Qc, in its original numerator unit and kg basis, never current unrelated new Q. A continued view carries each complete original V/A/provider/background/foreground/gate/state/phase/medium/period vector once and adds the increment; a service-only view references that vector and reports the increment alone. Neither creates new manufacture or Q. An explicitly justified reviewed service basis must be disclosed separately. Unresolved Q/Qc/history/attribution stays absolute for review, not zero; positive original Qc remains usable when current Q = 0. Never average lot ratios or divide intermediates independently; finished = 1 kg. Keep gross physical V and attributed burden A separately, with one evidenced attribution before burden normalization and no burden share applied to physical V."
      inputs:
        - cp_acceptance
        - "applicable row protocol"
        - "period and allocation ledgers"
      output: "each numerator unit per 1 kg reference flow"
      source_ids:
        - epa-printing-eiip-2002
    - id: stock_reconcile
      applies_to: "journal material/component/species accounts"
      rule: "For each stage and same-state account: S_close = S_open + R_external + T_in + F - T_out - O_external - C. Paired T_out = T_in in identity/state/unit/time; internal receipts are T, never external receipts or formation. Sum stages only after matching legs: sum(S_close - S_open) = sum(R_external - O_external + F - C). R/O cross the whole foreground gate once; F/C are evidenced paired transformations, zero for conserved total material mass. Retain WIP/rework/failed lots, actual boundary reactants and uncertainty. Keep original provider vectors, burden attribution and Q separate from this physical balance."
      inputs:
        - cp_materials
        - cp_formulas
        - cp_consumables
        - cp_residues
        - cp_acceptance
      output: "unallocated stage and combined-node physical ledger"
      source_ids:
        - epa-printing-eiip-2002
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "X_electricity in MJ = metered attributable kWh * 3.6, with raw gross and attributed service totals retained; normalize_period performs the sole applicable Q or original-Qc division for that cohort, including later old-FG service."
      inputs:
        - cp_utilities
      output: "MJ period amount"
      source_ids:
        - epa-printing-eiip-2002
    - id: constituent_ledger
      applies_to: "ink; fountain; wash; powder; maintenance_oil; maintenance_grease"
      rule: "constituent kg = whole supplied-mixture kg * actual wet mass fraction; fractions close the whole mixture with uncertainty. Track water/solids/carbon separately; constituent accounts do not add purchases to the whole-mixture exchange."
      inputs:
        - cp_formulas
        - cp_consumables
      output: "constituent physical masses and fate ledger"
      source_ids:
        - epa-offset-ctg-2006
    - id: species_mass
      applies_to: "ipa_air; ethanol_air"
      rule: "X_j = sum(c_out,k × V_out,k - c_in,k × V_in,k) × 0.000001 for independently identified species concentrations in mg/m3 and independently integrated volumes in m3 on matched time, temperature/pressure and wet/dry/reference bases. Retain gross inlet and outlet/fugitive masses separately and disjointly; integrate an actual flow rate over time once, not an already integrated volume. If c is already a validated background-corrected result on the same measured boundary, apply no second inlet subtraction. Reconcile stocks, retained product, liquids/cloth, recovered fates and real reaction/abatement; total FID carbon/TVOC or response equivalents require species-specific conversion and never become additional solvent mass. A negative or uncertainty-dominated balance is retained for investigation or a separately justified actual uptake model, not clamped to zero or relabelled as a positive emission. Missing inlet or outlet coverage prevents a complete net-release claim. Pass the supported period kg to normalize_period once."
      inputs:
        - cp_species
        - cp_formulas
        - cp_residues
        - matched_inlet_concentration
        - matched_outlet_concentration
        - integrated_inlet_volume
        - integrated_outlet_volume
        - gas_state_and_time
        - prior_background_correction
      output: "species period kg before normalize_period"
      source_ids:
        - epa-printing-eiip-2002
        - epa-offset-ctg-2006
    - id: particle_intervals
      applies_to: "pm25; pm2510; pm10"
      rule: "Same-condition cumulative PM10 minus PM2.5 gives only 2.5-10 micrometre mass; total particulate minus PM10 gives only >10 mass. Propagate uncertainty and retain negative conflicts for investigation; do not clip them or invent size shares."
      inputs:
        - cp_dust
      output: "disjoint outdoor particle period kg"
      source_ids:
        - epa-printing-eiip-2002
    - id: packaging_balance
      applies_to: "box; waste_box"
      rule: "For each component/item in matched state/unit: Opening + P + N_ext + ER = Closing + Ship + EO + W. P/N_ext/ER use the mutually exclusive cp_packaging entry tests; ER requires same-item prior outward/cohort/vector evidence. Opening/Closing each sum mutually exclusive on-site empty/raw, WIP, packed FG, reusable and waste-awaiting-removal stocks; moving between those states is internal, not a fresh entry or external discard. Ship is every gross outward dispatch packing leg on both new and old FG; EO is every disjoint owner-return/service/other evidenced outward leg, and W is external waste removal, not waste merely generated into closing stock. Correct for packing released from opening FG and incoming returns through the matched stocks and ER, without duplicating either. Retain all gross legs and each actual transport, wash, repair and loss; never net repeated outward/return legs. Keep owner/custody/cohort, complete inherited V/A and provider vectors, upstream-included manufacture once and actual added service separately. Unknown prior non-purchased burdens are not zero; no assumed reuse cycles, credits or box mass in journal Q."
      inputs:
        - cp_packaging
        - cp_acceptance
      output: "packaging physical ledger before normalize_period"
      source_ids:
        - chicago-journal-production
  data_quality_requirements:
    - id: product_purpose
      applies_to: "journal"
      requirement: "Establish professional/academic serial purpose and less-than-four-weekly frequency. A blank journal, directory, encyclopedia instalment or technical monograph fails this boundary even if printed identically."
      evidence: "Publisher masthead, title/issue records, page content category and actual frequency"
    - id: issue_integrity
      applies_to: "finished"
      requirement: "Verify correct issue/edition, page/signature sequence, self-cover, stitch integrity and actual print acceptance; mass alone cannot detect mixed/duplicate/missing signatures."
      evidence: "Signed page/forme/imposition map and release/reject records"
    - id: quantity_chain
      applies_to: "all inventory rows"
      requirement: "Reference kg, raw numerator unit, applicable new-manufacture Q or original-cohort Qc, collection aggregation and formulas agree. All later old-FG services retain complete prior V/A/foreground/background/provider/gate/state/phase/medium/period vectors and only actual added services; service-only/continued views do not repeat manufacture or shift burdens to new output. Counts/area/length use actual measured conversion; no factory quantity follows from identity. Unknown quantities/history remain absolute unresolved accounts."
      evidence: "Raw weighing/meter/stock records, calibration, original Qc/vector and service-attribution evidence and matched bases"
    - id: composition_and_identity
      applies_to: "all inventory rows"
      requirement: "Confirm native type/form/route/CAS/medium/property and actual provider boundary. Full formulas and contaminated waste state are required, including nonhazardous constituents; adjacent chemistry/grade or an unrelated waste route cannot fill a gap."
      evidence: "Native and supplier originals, full composition and receiver specifications"
    - id: period_completeness
      applies_to: "journal"
      requirement: "Include failed Q0 lots, all makeup/cleanup/idle energy, WIP/rework/FG stocks, packaging returns and actual maintenance. Include unreturned old-FG services under original cohorts even when current Q = 0. Verify packaging P including bundled-paid supply, first external non-purchased N_ext, and ER only with same-item prior outward/owner/cohort/vectors; retain mutually exclusive gross stocks, all new/old-FG Ship, EO owner-return/service, W and every actual transport leg. Free/history-unknown supply is not zero; manufacture/provider once and actual added service remain separate, without invented reuse counts or credits. Explain stock/burden carryover; no yield-based sample selection."
      evidence: "Fixed period plan, complete job logs, acquisition/prior-outward/cohort/vector/transport records and physical/allocated ledgers"
    - id: emissions_and_balances
      applies_to: "journal"
      requirement: "Maintain separate dry solids, water, fossil/biogenic carbon and energy balances including actual oxidation/oxygen, stocks and residues. Require actual additional species and missing particle intervals; non-detect is method-limited, not true zero."
      evidence: "Supplier/analytical data, measured outdoor/collector records and residual uncertainty"
    - id: evidence_limits
      applies_to: "journal"
      requirement: "Distinguish primary technical facts, author accounting rules and site data requirements. Historical retention/thresholds, advertised capacities and a source's equipment options are not measured site defaults or complete LCI."
      evidence: "Source sections/limitations, site configuration and disclosed unresolved scope"
validation_rules:
  - rule_id: validate_product
    applies_to: "journal"
    rule: "Confirm the sole classification and product purpose/frequency, then the declared monochrome coated-sheet self-cover wet-offset/saddle-stitch route. Other products and unreviewed configurations cannot inherit this method."
    source_ids:
      - un-cpc3-32420
      - epa-printing-eiip-2002
  - rule_id: validate_reference
    applies_to: "finished"
    rule: "Require exactly one product output linked by finished with 1 kg accepted complete issues. Check net mass/tare, first-release Q and page/issue/stitch integrity; opening FG dispatch and internal rework never create another denominator."
    source_ids:
      - chicago-journal-production
      - newman-saddle-stitching
  - rule_id: validate_ledgers
    applies_to: "all inventory rows"
    rule: "Check positive manufacturing Q or retained unnormalized Q0 inventory; failed/cleanup/WIP/FG coverage, paired internal transfers, complete receipts/ownership/returns/wastes and single provider charging. Trace every later old-FG service, including unreturned packing/inspection, to original valid Qc or separately justified reviewed service basis and complete prior V/A/foreground/background/provider/gate/state/phase/medium/period vectors. Check actual service increments and distinct service-only/continued views without new Q, duplicate manufacture, or assignment to another new lot; unresolved history/quantity is not zero. Check packaging P including bundled-paid supply, incoming first non-purchased N_ext, and ER only with same-item prior outward and owner/cohort/vector continuity. Verify mutually exclusive gross stock states, all new/old-FG dispatch, EO owner-return/service, external waste and each actual transport/wash/repair/loss leg; no netting of cycles, invented reuse life/credit or packaging in journal Q. Separate physical and allocated ledgers and normalize once by the applicable cohort denominator."
    source_ids:
      - epa-printing-eiip-2002
  - rule_id: validate_species
    applies_to: "journal"
    rule: "Verify actual CAS/phase/receiving medium, species mass/air conditions and disjoint PM intervals. Captured dust, retained solvent, wastes and outdoor emissions are not duplicate fates. Unknown recipes/species, major quantities, providers or receivers prevent a complete dataset claim."
    source_ids:
      - epa-offset-ctg-2006
      - epa-printing-eiip-2002
  - rule_id: validate_projection
    applies_to: "journal"
    rule: "EN/ZH must preserve ordered row/rule/protocol ids, amount objects, units, qualifiers, formulas and ancestor context. Empty auxiliary UUIDs remain explicit review debts; reference/primary hard conflicts require a specific applicability decision. Tool checks do not approve methodology or translation."
    source_ids:
      - un-cpc3-32420
published_dataset_profile:
  dataset_role: "unit_process_dataset"
  downstream_use: "secondary_dataset; background_dataset after actual site/upstream/receiver verification"
  allowed_use: "Manufacturing inventory of the declared professional/academic non-daily issue and representative construction at printer gate"
  excluded_use: "Whole-leaf technology coverage, other CPC identities, blank writing journals, books/directories, online publishing, reading-service equivalence and complete LCI inferred from UUID success"
  required_metadata: "All reference qualifiers; actual Q/first-release/period; issue/forme/signature map; material/formula/provider boundaries; WIP/FG/rework/failed lots; packaging ownership/returns; utility modes; residues/species; allocation and physical ledgers"
  required_quality_disclosure: "Scientific and translation review state; unresolved identities/current native freshness; actual measured, calculated, missing and excluded exchanges; source limits, uncertainty, performed/skipped checks and incompleteness"
  update_trigger: "Title-purpose/frequency boundary or route change; colour/cover/plate/binding/stock/formula/provider change; new equipment/utilities/emitted species; revised receiver, supply basis or stock/allocation method; retain this unique category identity"
data_sources:
  - id: "un-cpc3-32420"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, printed pp148-150 (PDF pp148-150), subclasses 32220/32230 and 32420/32490; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Product-purpose distinction and 32420 frequency less than four weekly, including scientific/medical journals; excludes online periodicals. Classification evidence only, no quantity, physical recipe or technology prevalence."
  - id: "chicago-journal-production"
    type: "handbook"
    reference: "University of Chicago Press, How Books and Journals Are Produced, Print Technologies: Printing and Binding, https://www.chicagomanualofstyle.org/help-tools/production-technologies.html (accessed 2026-10-27)"
    used_for: "Plate/blanket transfer, sheet/web distinction, imposition and signatures. Production overview, not a named factory's route, stock choice, yield or energy evidence; numerical examples are not defaults."
  - id: "epa-printing-eiip-2002"
    type: "official_guidance"
    reference: "US EPA, EIIP Volume II Chapter 15, Preferred and Alternative Methods for Estimating Air Emissions from Printing, Packaging, and Graphic Arts, May 2002, section 2.1.1 printed pp15.2-4/5 (PDF14/15), section 4.1 printed pp15.4-1/2 (PDF31/32); https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "Sheetfed offset physical diagram, penetration/oxidation versus heatset distinction, material-balance/record method context. Author selects collection/accounting requirements; no default recipe, emission/retention factor or site throughput."
  - id: "epa-offset-ctg-2006"
    type: "official_guidance"
    reference: "US EPA, Control Techniques Guidelines for Offset Lithographic Printing and Letterpress Printing, EPA-453/R-06-002, September 2006, IV.A and VOC-source overview, printed pp6-9 (PDF12-15); https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "Paste ink constituent families, sheetfed setting, fountain/wash chemistry and separate VOC sources. Historical US control guidance; retention percentages, doses, thresholds and efficiencies are not site defaults or current legal advice."
  - id: "newman-saddle-stitching"
    type: "handbook"
    reference: "Newman Thomson, Saddle Stitching, process and artwork/creep sections; https://www.newmanthomson.com/service/saddle-stitching/ (accessed 2026-10-27)"
    used_for: "First-party fold/wire/nesting and trim-creep explanation; self-cover is an available construction. Does not establish a particular academic title, wire grade, universal page limit or quantities."
  - id: "heidelberg-powder-2010"
    type: "handbook"
    reference: "Heidelberger Druckmaschinen, Heidelberg News 270 (2010), Small Grains that Have a Big Effect, printed/PDF p53; https://www.heidelberg.com/global/media/en/global_media/company___publications/heidelberg_news/editorial/pdf_10/hn_270.pdf"
    used_for: "First-party anti-setoff function, starch/sugar/calcium-carbonate alternatives and hydrophobic-starch multiple-pass restriction. Selected starch preparation needs actual specification; no recommended grain size, humidity, grade, dose or performance claim becomes a default."
