  unresolved_identity_details: "These are specific physical exchanges, not grouped selectors. Prepared imaged/coated plate is not bare aluminium or polystyrene PS plate; blanket is not bedding; powder is actual starch anti-setoff preparation, not assumed pure starch; box has no adopted fibre-ratio-specific UUID. Complete fountain/wash/oil/grease formulations, compatible whole press-blanket identity, stitch-wire waste origin and the actual removed grease state remain unconfirmed. Generic records do not resolve contrary specific route or composition qualifiers. Auxiliary identity gaps do not alone place all methodology on hold, but actual important unresolved exchanges prevent complete downstream datasets. Missing reference/primary formation or a hard physical conflict requires explicit applicability review."
  foreground_completeness: "No factory inventory, recipe, accepted-copy mass, emissions, yields, allocation shares or lifetime defaults are provided. Site producer must collect all material/energy/stock, issue/forme/signature, failed-lot, rework, cleanup, packaging ownership and species evidence. No-combustion/no-purchased-heat/no-refrigeration configuration is a bounded representative case requiring equipment evidence, not a whole-leaf assumption."
  shared_integration: "Existing shared-PCR refs, accepted mapping replacement, aliases, catalog and ADR are reserved to ROOT; consumer availability is not claimed by this author."
