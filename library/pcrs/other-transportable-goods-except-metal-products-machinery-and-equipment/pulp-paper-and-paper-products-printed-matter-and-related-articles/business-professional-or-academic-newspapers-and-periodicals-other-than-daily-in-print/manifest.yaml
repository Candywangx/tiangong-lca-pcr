review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scope_decision: "Owner-directed one-to-one materialization of the existing semantic scaffold for CPC 3.0 32420. This sole identity is retained for subsequent revisions of this CPC. The representative method is monochrome conventional sheetfed wet-offset, coated-paper self-cover, wire-saddle-stitched professional or academic periodical production. Other constructions within the leaf are not claimed to have been authored. No other CPC is assigned to this record."
  scientific_review: "Pending independent methodological and source-applicability review; author checks are not peer acceptance."
  translation_review: "Pending independent EN/ZH field-by-field scientific translation review; draft translation retained."
  native_identity_freshness: "After authentication restoration, fresh official state100 reads confirmed every previously bound flow and verified the native flow-property, unit-group and reference-unit chains. Additional compatible auxiliary identities were confirmed by targeted searches and exact state100 reads. Fresh official ink and process-water display names were aligned without changing their UUIDs. A targeted product query and exact official read additionally confirmed the category-specific finished non-daily professional/academic periodical identity; it replaces the broad printed-matter reference without changing the declared product, representative route, reference quantity or Amount rules. Earlier authentication failures and new bounded query failures remain evidence, not proof of database absence. Identity observations do not establish site/provider compatibility or scientific, translation or mapping acceptance; those reviews remain pending."
  reference_identity_review: "40eab261-c65d-482a-8a05-d13cfa6f35f8 is an official state100 Product/Mass/kg record expressly identifying manufactured finished business/professional/academic non-daily newspapers and periodicals. Its full definition includes scientific/medical journals published less than four times weekly and excludes online periodicals. These positive product/state/property facts match the unchanged physical journal construction; selection is not based on taxonomy alone. No specific printing or binding route, recipe, quantity or provider background is inferred. The prior broad printed-matter locator remains archived evidence and is not called physically incompatible merely for its classification/comment defects."
  primary_material_identity_review: "faaae1a8-97af-4a26-bdb2-198abfc0d8e4 identifies coated printing paper, Mass/kg; actual unprinted sheet stock, coating, fibre, moisture and upstream provider remain required. The native generic varnish/AQ discussion is not a required printer coating operation or a supplied-paper recipe."
  identity_conditions:
    electricity: "3d76981f-964a-4865-b588-0e067a2a1163 is CN grid-average 1-35 kV consumption supply with Net calorific value/MJ. Other geography, voltage or supply boundaries require a compatible verified identity; UK operator sources do not establish Chinese site quantities."
    ink: "38e48719-f415-4f0f-a3e7-2893d2fbaffd is broad oil/solvent-based flat-printing ink, not a black sheetfed SKU or full formula. Actual paste chemistry, setting route, pigment, vehicle, binder and additives must be compatible; no UV, water-based or heatset substitution."
    water: "d8ad9111-4304-46fb-bc23-9a2f36d65a83 is product process water, Mass/kg, without source/treatment specification. Supplied liquid water only; provider quality and measured density are required, not elementary withdrawal."
    wire: "62bb3717-f62c-43e0-baca-46a1e6f847c4 is iron/non-alloy steel wire. Actual wire alloy, coating, diameter and supplier production must match; other alloys need a different identity."
    paper_waste: "f140a5a2-5318-4d06-956f-a87b9c6fda25 is unspecified waste paper, not a recycling credit or receiver dataset. Separately exported stocks/streams retain their own composition and destination."
    cloth: "dd9f2248-bc28-43b9-8d57-d77756754f4d positively names cotton fabric and woven cotton cloth, with Mass/kg and no water-treatment route. Botanical comment and raw-cotton classification remain source-quality debts; use only the already-required actual manufactured cotton fabric and compatible finished-fabric provider, never raw-cotton cultivation as its supplier."
    spent_solid_assemblies: "851fd235-5a89-4cf9-b7da-5c278ed1dcbb is a broad industrial solid-waste locator used for the separately authored whole spent plate, blanket and contaminated cloth streams. Preserve each complete solid assembly, retained coating/ink/solvent/water, actual receiver and stream separation; no pure-material recycling or hazard classification is inferred."
    spent_liquids: "bdfc32cf-8028-40a8-a2e4-2d73422ece34 is a broad industrial-liquid-waste locator for separate actual physically liquid fountain purge and spent wash. Existing whole wet mass, measured density/temperature/water/solids/composition and receiver rules remain. Generic hazardous prose does not establish site hazard; this is neither a dry-solids amount nor direct environmental water discharge."
    collected_dust: "2a6c9b60-a075-45ec-b611-c3b4dd255935 identifies industrial captured dust as Waste/Mass/kg without a kiln/furnace restriction. Only the already-declared collected paper-fibre stream is selected, with actual composition, moisture, stocks/returns and receiver; not airborne PM or a prescribed dust recipe."
    waste_ink: "468ac05a-00a0-4153-a4ba-4084ef981e4c explicitly includes offset-printing residue as Waste/Mass/kg. Only the separately collected black paste is selected; ink retained on paper or in liquid/cloth remains disjoint and no amount default is supplied."
    waste_box: "72270223-04b1-4986-a546-94e5a0821317 explicitly includes discarded corrugated packaging and damaged boxes at packing, with Mass/kg and unspecified treatment. Its incidental two-percent expert estimate is not adopted; the unchanged Amount requires actual packaging records, ownership/returns and receiver."
    spent_oil: "55d93375-7f04-4166-b2a2-88ce929051a5 identifies separately generated used petroleum or synthetic lubricating oil, Mass/kg, without prescribing treatment. Preserve the actual liquid whole stream and contamination; no grease substitution, retained-oil duplication, recovery factor or credit."
