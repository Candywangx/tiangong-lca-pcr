review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  independent_scientific_review: pending; no approval or publication asserted
  semantic_boundary:
    route: Purchased coated art-paper sheets and prepared imaged aluminium plates; conventional wet sheetfed offset; absorption/oxidation setting; flat trimming and packing; no post-print varnish/lamination/binding
    mapping_proposal: CPC3.0:32540 narrower only for this route-matched single-sheet image-print subset; controller acceptance remains required
    non_identity_qualifiers: Image, design or photograph content is not a manufacturing identity. Matching flat maps/leaflets/cards may reuse physical rules after their own product-reference and mapping assessment.
    adjacent_methods: 32210 includes EVA book assembly;32300 coldset web and fold;32410 heatset and wire stitching;32510 spherical wet paper mounting;32530 finalized c403476bb77e01844de3394604be603fda270a90 covers uncoated-board soybean-paste-ink creased/folded greeting cards, with unvarnished or mercury-lamp UV-varnish variants, explicitly excluding flat postcards and coated base board;32192 unprinted gummed envelope;32197 acrylic-PSA/glassine water-based flexo. Same printing subrules are reusable, but folded cards are not this flat coated-paper delivery construction.
  unresolved_flow_rows:
    - plate
    - fountain_concentrate
    - wash
    - packing_box
  unresolved_identity_details:
    plate: Supplied finished imaged plate ready to print; record aluminium/coating mass, imaging/development route and supplier upstream coverage. Bare cut/grained aluminium lacks the finished image/coating; the PS-plate candidate has conflicting polystyrene thermoplastic fields. Neither is adopted. If imaging/development occurs at the reporting site, explicitly add its atomic inputs and outputs and replace corresponding upstream coverage.
    fountain_concentrate: One supplied wet regular-offset concentrate, with its whole composition/SDS, carrier water and solids recorded. The regular working-solution candidate does not establish concentrate identity or dose. Count separately purchased dilution water and separately purchased IPA only once; do not count ingredients again when already included in a complete formulation background.
    wash: One actual as-supplied blanket/roller wash, with complete supplier composition and each CAS/VOC documented; no universal hydrocarbon recipe or volatility. Record dilution separately, dirty solvent stock, reusable returns and rag retention. Unrelated fabric and generic detergent candidates do not establish this formulation.
    packing_box: Conditional supplied finished corrugated box, with actual ply/furnish, moisture, dimensions, coatings and supplier. A fixed-furnish 16.6%/83.4% box identity is not used for unknown composition; optical-assembly cardboard and folding carton are not this box. No packing mass or scrap default.
  provider_basis_pending: All UUIDs identify physical exchanges only. Actual supplier datasets, formulas, campaign quantities, density, grade and receiving treatment are not established by identity lookup.
  identity_metadata_debts:
    - row_id: packing_film
      uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
      issue: CPC29220 luggage classification conflicts with names/CAS9002-88-4/comment for film. Physical PE film identity conditionally retained; supplier/curator clarification required.
    - row_id: ipa
      uuid: a4a75541-e156-4e30-947c-ba067a682afd
      issue: CAS field absent; bilingual names/synonyms support IPA. Verify actual CAS67-63-0/purity and China-production-mix/provider compatibility.
    - row_id: paper
      uuid: faaae1a8-97af-4a26-bdb2-198abfc0d8e4
      issue: Broad comment combines paper coating and optional print varnish examples; actual mineral-coated unvarnished sheet must be confirmed from supplier grade/structure.
    - row_id: wipe
      uuid: dd9f2248-bc28-43b9-8d57-d77756754f4d
      issue: Positive cotton-fabric/cloth/woven-fabric names/synonyms versus raw cotton seed-fibre comment/CPC01921. Actual finished textile/weave/finish/provider required; not raw cotton, no water-treatment hard route in this record.
    - row_id: electricity
      uuid: 50657322-939c-4829-a87b-47c093bfa6a7
      issue: Raw CN/<1kV grid-average customer supply requires actual site/country/year/provider/meter/voltage/loss compatibility; EXCARD route evidence is not an actual CN factory dataset.
  conditional_identity_links:
    - row_id: ink_cyan
      uuid: 38e48719-f415-4f0f-a3e7-2893d2fbaffd
      qualification_EN: The broad nonwater oil/solvent-based planographic ink record has offset/lithographic synonyms and no hard heatset route. Use only for this colour's actual conventional sheetfed paste SKU whose supplier confirms nonwater vehicle, absorption/oxidative setting, complete pigment/binder/oil/solvent/wax/SDS and compatible provider mass basis. The comment's optional glycol-ester examples and heat-based classification do not prescribe a recipe, heater or VOC fraction. UV/EB, aqueous, inkjet or predominantly volatile heatset/solvent-evaporation formulations require another identity/route. Preserve four separate colour charges, returns, stocks, retained film and waste without collapsing them.
      qualification_ZH: 广义非水性油/溶剂型平版油墨记录具有胶印/平版同义名，且无硬性热固路线。仅用于本色真实常规单张纸浆状牌号：由供方证明非水性连接料、渗透/氧化定着、完整颜料/黏结剂/油/溶剂/蜡/SDS及相容供方质量基准。备注可选醇醚酯例子和按加热分类不规定配方、加热器或VOC比例。UV/EB、水性、喷墨或以挥发溶剂热固/蒸发为主的配方须另有身份/路线。四色领用、退回、存量、留存墨膜和废料分开，不合并计量。
