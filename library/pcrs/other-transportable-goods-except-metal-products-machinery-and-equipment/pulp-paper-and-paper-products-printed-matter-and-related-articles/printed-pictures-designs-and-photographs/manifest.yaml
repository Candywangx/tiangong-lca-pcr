    - row_id: waste_fountain
      uuid: bdfc32cf-8028-40a8-a2e4-2d73422ece34
      qualification_EN: The broad industrial liquid-waste identity locates this one actual independently received whole liquid stream. Confirm liquid handoff phase, full water/solvent/oil/dissolved and suspended composition, weighed whole wet kg or actual volume times representative measured density at stated temperature, stocks and actual receiver acceptance/treatment. H2O and contaminants are subledgers, not second external water/waste exchanges. Non-water mass is not automatically dry solids; measure actual solids and non-water liquids separately. No pure-solvent mass, direct environmental release, hazard class, route or credit is defaulted.
      qualification_ZH: 广义工业废液身份定位这一实际独立接收的整股液体物流。确认液态交接、完整水/溶剂/油/溶解及悬浮组成、整湿kg称量或实际体积乘声明温度的具代表性实测密度、存量及真实接收方接纳/处理。H2O和污染物作分账，不另重复对外水/废物交换。非水质量不自动等于干固体；真实固体及非水液体分别实测。不默认纯溶剂质量、直接环境排放、危险类别、路线或信用。
