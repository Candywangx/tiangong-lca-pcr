    - row_id: captured_dust
      uuid: 2a6c9b60-a075-45ec-b611-c3b4dd255935
      qualification_EN: Use this captured industrial-dust Waste identity only for the actual collected cutting stream. Confirm paper/mineral/ink/powder composition, whole handoff mass, dry constituents/moisture, stage, collector stock and actual receiver. It is neither an elementary air release nor a generic dust factor. Separate actual powder bins from paper-dust bins; a real combined bin is weighed once with component subledgers.
      qualification_ZH: 工业收尘废物身份仅用于实际收集裁切物流。确认纸/矿物/油墨/喷粉组成、交接整质量、干组分/水分、阶段、集尘存量及真实接收方。不是空气基本排放或通用粉尘因子。实际粉料容器与纸尘容器分开；真实混合容器只称一次并保留组分分账。
    - row_id: packing_film_waste
      uuid: 1cc18dac-e06b-424b-98af-b4d25043db56
      qualification_EN: 'Use only for this actual separate PE transport-wrap waste stream: verify packaging origin, polymer/additives, contamination, handoff phase, whole net mass/moisture and receiver. The broad plastic-packaging record does not specify a cleaned/recycled grade or treatment. Exclude product laminate and unrelated packaging; stock/returns and measured shipped film remain separate, with no assumed scrap ratio.'
      qualification_ZH: 仅用于这一真实独立PE运输包膜废物流：核实包装来源、聚合物/添加剂、污染、交接相态、整净质量/含水和接收方。广义塑料包装记录不规定清洗/再生等级或处理。排除制品覆膜及无关包装；存量/退回及实测随货膜分开，不假定废品比例。
  controller_review:
    scope: Independent complete EN/ZH34-row raw-name/CAS/route/type/medium/native-property-unit and actual-original-source review with bounded four-file repair
    scientific_approval: false
    mapping_accepted: false
    physical_balance_requirements: Whole liquids measured as wet mass or V*rho; H2O/nonwater liquids/actual solids subledgers; ambient/material/stock/reaction water and actual oxidative O/H/element terms remain actual-data requirements. Packing/container/blanket/oil/grease/filter/maintenance coverage must be explicitly measured or documented absent. No generic quantity or correction flow.
    allocation_source: Actual PEF original Annex I4.5 subdivision/system expansion then justified relationships; no full PEF/CFF conformity claimed.
    hard_rejections: Printhead/inkjet-specific Printing Ink Cleaner records and polystyrene/thermoplastic PS Plate cannot establish blanket wash or prepared imaged aluminium identity. Working fountain bath is not concentrate. Fixed16.6%/83.4% box recipe not generalized.
  classification_mapping_authority: Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate.
