    - row_id: waste_plate
      uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
      qualification_EN: Broad industrial solid-waste identity applies only to this independently collected actual whole solid stream. Record its stage, handoff phase, actual metal/coating/ink/cloth/starch/solvent contamination as applicable, whole net wet mass, moisture/dry constituents and actual receiver acceptance/treatment. No bare clean aluminium scrap, photopolymer-plate substitution, cleaned textile/recycled grade, hazard class, disposal route or credit is inferred. Components are subledgers, not duplicate external wastes; separated free liquid requires its own stream.
      qualification_ZH: 广义工业固废身份仅用于这一实际独立收集的整股固体物流。记录阶段、交接相态、适用金属/涂层/油墨/布/淀粉/溶剂污染、整净湿质量、水分/干组分及真实接收方接纳/处理。不推定裸洁净铝废料、光聚合印版替代、清洗纺织/再生等级、危险类别、处置路线或信用。组分作分账而不重复对外废物；分离自由液须另列真实物流。
