measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use 1 kg accepted net finished print including every actual retained ink/coating/water and anti-setoff powder constituent. Weigh calibrated accepted lots through cp_output; exclude packaging and rejects."
  - id: common_denominator
    applies_to: "reference product and shared normalization denominator"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "This Mass/kg requirement applies only to the accepted print reference and each row's normalization denominator. Preserve each exchange numerator's native property/unit: electricity remains Net calorific value/MJ; mass exchanges remain kg. Every row and collection aggregation uses the same campaign/site/configuration and measured accepted net print kg. Zero or missing accepted mass blocks normalization; count/area cannot replace it."
  - id: formulation_water
    applies_to: "wet formulations and water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve wet as-supplied quantity, composition and mass basis; active/solids values require actual assay. Volume conversion needs measured density/temperature; carrier water and recycled liquid are not new purchases."
  - id: electricity_units
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Meter actual below1kV supply; 1 kWh = 3.6 MJ. Native Net calorific value property does not prove heat/steam delivery."
