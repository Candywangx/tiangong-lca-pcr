allocation_rules:
  - rule_id: a_separate
    applies_to: "p_print"
    rule: "First investigate subdivision or feasible system expansion to avoid allocation; use actual job/stage/submeter separation and assign make-ready, cleaning and trim to their jobs with stock/reject history. If expansion is justified, include the additional functions and report the expanded system as a whole. Only where those approaches are unavailable use a demonstrated measured causal relationship for shared burdens, such as applicable press time, impression area or cleanup events; mass alone is not a proven driver. Other relationships need explicit justification and sensitivity rather than a default share."
    source_ids:
      - ec-pef-allocation-2021
  - rule_id: a_ledgers
    applies_to: "p_print"
    rule: "Keep physical outputs and stock/transfer balances at actual quantities. Allocate only attributable environmental burdens; never multiply co-product physical mass by a burden share. Share totals must reconcile; disclose method, drivers and sensitivity."
    source_ids:
      - ec-pef-allocation-2021
  - rule_id: a_waste
    applies_to: "waste streams"
    rule: "Keep waste identity and actual receiving treatment; a scrap sale does not automatically make it a burden-free co-product or justify substitution credit. Any co-product/recycling allocation needs separately declared study method and evidence; no universal credit."
    source_ids:
      - ec-pef-allocation-2021
