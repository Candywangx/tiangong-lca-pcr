      record_type: "collected_record"
      raw_fields: "Accepted lot mass; tare; moisture; size; ink/stock/order; rejects; opening/closing output stocks"
      collection_method: "Calibrated net lot weighing at gate acceptance, paired order/quality records; include every actual retained ink/coating/moisture/powder constituent and exclude independently weighed packing, rejects and removed samples. Reconcile output stocks and shipment with the same job; no fixed per-sheet mass"
      unit: "kg"
      frequency: "Each lot/job/event; utilities and emissions time-matched"
      temporal_coverage: "Complete same production campaign including setup/idle/cleaning"
      site_scope: "Selected reporting site and declared configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipts/SDS, lab methods, manifests and uncertainty/coverage records"
    - protocol_id: cp_materials
      process_id: "p_print"
      flow_role: "paper,inks,plate,fountain,ipa,wash,powder,wipe"
      record_type: "collected_record"
      raw_fields: "Each SKU/CAS; supplied wet mass; receipt/issue/return/stocks; solids/carrier; plate/coating; carbon origins; provider native basis"
      collection_method: "Weigh/stock-reconcile each atomic material and retain supplier SDS/composition/basis; separate ingredients only if not already in complete formula background. Screen actual supplier containers, plate/coating changes, blanket replacement, oils/greases, filters, cleaning and maintenance consumables from receipt/service/issue/return records; document supported absence or add separately measured atomic inputs/spent streams and actual provider/receiver before completeness. No generic per-job consumption. Record actual oxidative-setting chemistry and retained-film O/H uptake/products from supplier and measured constituent/element balances, not an assumed solvent-only drying yield"
      unit: "kg"
      frequency: "Each lot/job/event; utilities and emissions time-matched"
      temporal_coverage: "Complete same production campaign including setup/idle/cleaning"
      site_scope: "Selected reporting site and declared configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipts/SDS, lab methods, manifests and uncertainty/coverage records"
    - protocol_id: cp_water
      process_id: "p_print"
      flow_role: "water"
      record_type: "collected_record"
      raw_fields: "Fresh supply meter/weights; density/temperature; carrier water; bath stocks; liquid waste; evaporation; product moisture"
      collection_method: "Meter external supply and measure density for volume-to-mass; reconcile actual material/formulation H2O, product/cloth/bath/waste/packing moisture and stocks, measured liquids/density, matched ambient inlet/outlet humidity and actual reaction water/capture/condensate. Whole wet liquid and H2O/nonwater/solids subledgers stay separate; nonwater is not automatically dry solids. Missing terms and residuals remain incomplete, not assumed net vapour"
      unit: "kg"
      frequency: "Each lot/job/event; utilities and emissions time-matched"
      temporal_coverage: "Complete same production campaign including setup/idle/cleaning"
      site_scope: "Selected reporting site and declared configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipts/SDS, lab methods, manifests and uncertainty/coverage records"
    - protocol_id: cp_energy
      process_id: "p_print"
      flow_role: "electricity"
      record_type: "collected_record"
      raw_fields: "kWh intervals; voltage; press/cut/air/ventilation/pack meter; idle/make-ready time; supplier boundary"
      collection_method: "Actual circuit/submeter records; separate jobs and avoid double counting in-house compressed-air electricity"
      unit: "MJ"
      frequency: "Each lot/job/event; utilities and emissions time-matched"
      temporal_coverage: "Complete same production campaign including setup/idle/cleaning"
      site_scope: "Selected reporting site and declared configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipts/SDS, lab methods, manifests and uncertainty/coverage records"
    - protocol_id: cp_packing
      process_id: "p_print"
      flow_role: "packing_film,packing_box"
      record_type: "collected_record"
      raw_fields: "Packing component SKU/CAS/furnish; receipts/opening/closing stocks; issues/unused external returns; measured shipped tare; scraps/damage; supplier containers; phase/moisture; actual provider/receiver"
      collection_method: "Weigh each actual packing component; reconcile packing receipts plus opening stock to actual shipped tare, external unused returns, characterized scraps/damage and closing stock, all outside net print mass. Incoming supplier containers and packing-stage wastes are distinct measured origins; no universal scrap/reuse factor"
      unit: "kg"
      frequency: "Each lot/job/event; utilities and emissions time-matched"
      temporal_coverage: "Complete same production campaign including setup/idle/cleaning"
      site_scope: "Selected reporting site and declared configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipts/SDS, lab methods, manifests and uncertainty/coverage records"
    - protocol_id: cp_waste
      process_id: "p_print"
      flow_role: "all waste rows"
      record_type: "collected_record"
      raw_fields: "Waste row; wet/dry mass; composition/moisture/species; mixed-stream splits; stock; receiver/transport/treatment"
      collection_method: "Segregated whole container/stream net weighing and manifests, handoff phase and actual receiver acceptance; liquid volume uses representative measured density/temperature, with water, nonwater liquids, actual solids and retained contaminants distinguished. Constituent subledgers never export the same whole waste again; internal reuse is not external waste"
      unit: "kg"
      frequency: "Each lot/job/event; utilities and emissions time-matched"
      temporal_coverage: "Complete same production campaign including setup/idle/cleaning"
      site_scope: "Selected reporting site and declared configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipts/SDS, lab methods, manifests and uncertainty/coverage records"
    - protocol_id: cp_emissions
      process_id: "p_print"
      flow_role: "all elementary output rows"
      record_type: "collected_record"
      raw_fields: "Species/CAS; actual input constituents; retained product/waste/stock; exhaust flow/time; controls/capture/destruction; detection; PM size cumulative/bins; outdoor medium"
      collection_method: "Matched outlet/stack and fugitive survey with traceable sampling/speciation; reconcile per-species mass balances using measured retention/waste/capture/destruction, never historical default fractions"
      unit: "kg"
      frequency: "Each lot/job/event; utilities and emissions time-matched"
      temporal_coverage: "Complete same production campaign including setup/idle/cleaning"
      site_scope: "Selected reporting site and declared configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipts/SDS, lab methods, manifests and uncertainty/coverage records"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "Divide each measured attributable campaign numerator in its native unit by the common measured accepted net print mass in kg; finished_print remains exactly1 kg."
      inputs:
        - cp_output
        - cp_materials
        - cp_water
        - cp_energy
        - cp_packing
        - cp_waste
        - cp_emissions
      output: "Inventory exchange per 1 kg reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Metered kWh multiplied by3.6 gives MJ before campaign normalization."
      inputs:
        - cp_energy
        - cp_output
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: species_balance
      applies_to: "air_ipa;air_decane;air_butoxy"
      rule: "For each actual species reconcile input and opening stocks with closing stocks, retained product, external liquid/solid waste, destroyed amount and net outdoor release. Internal capture/reuse is circulation, not a destruction credit. Match measured outlets and fugitives; unresolved balance is uncertainty, not zero emission."
      inputs:
        - cp_materials
        - cp_waste
        - cp_emissions
      output: "Species-specific reconciled releases"
      source_ids:
        - epa-eiip-2002
    - id: particles_disjoint
      applies_to: "air_pm25;air_pm10;air_pmover10"
      rule: "Use mutually exclusive <=2.5, >2.5–<=10 and >10 micrometre mass intervals. Difference same-basis cumulative PM10 and PM2.5 only when compatible; do not add cumulative PM10 to its nested PM2.5. Captured dust and reused powder are separate physical destinations. Unknown split remains pending."
      inputs:
        - cp_waste
        - cp_emissions
      output: "Nonoverlapping outdoor particle quantities"
      source_ids: []
    - id: physical_campaign_balance
      applies_to: "p_print"
      rule: "Receipts plus opening stocks and measured actual physical reaction/intake terms reconcile to accepted net print, shipped packing, external unused returns, full separately characterized wastes/net releases and closing stocks. Paper/coating/ink/powder/water already retained in net product are constituents, not additional outputs. Use receipts/stocks consistently, not stock-adjusted use plus the same stock movements twice. Oxidative setting can redistribute C/H/O and incorporate atmospheric oxygen into retained ink; actual supplier chemistry, constituent/element measurement and matched air/humidity are required. Unknown uptake/reaction/products remain incomplete, never fictitious conservation/emission adjustments or a blanket ink-retention factor. Internal transfers cancel; preserve uncertainty and unallocated physical quantities separately from environmental burdens."
      inputs:
        - cp_output
        - cp_materials
        - cp_water
        - cp_packing
        - cp_waste
        - cp_emissions
      output: "Physical material/water/element and packing ledgers"
      source_ids:
        - epa-eiip-2002
        - ec-pef-allocation-2021
  data_quality_requirements:
    - id: identity_and_providers
      applies_to: "all inventory rows"
      requirement: "Verify exact physical identity/CAS/medium/native property/unit independently from actual supplier/treatment dataset coverage and denominator. Unresolved UUIDs remain named atomic rows; no unrelated substitute or empty-row cutoff."
      evidence: "Raw specifications, provider basis and receiver acceptance"
    - id: physical_balance
      applies_to: "p_print"
      requirement: "Retain stage diagrams and unallocated paper/ink/coating/water/fossil-and-biogenic-carbon balances, including make-ready, offcuts, retained powder, wastes and stocks. Match internal endpoints exactly. Reconcile a separate environmental burden ledger."
      evidence: "Raw mass and stock records; equal transfers; driver records"
    - id: coverage
      applies_to: "p_print"
      requirement: "Same site/time/configuration and complete event coverage; retain calibrations, SDS/assays, detection limits, size/species split uncertainty and additional actual components. Historic or supplier case quantities are not defaults."
      evidence: "Campaign and lab coverage/uncertainty evidence"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_print"
    rule: "Exactly one product reference output, net1 kg; EN/ZH reference quantity, row IDs, denominator, collection aggregation and calculations agree."
    source_ids: []
  - rule_id: v_route
    applies_to: "p_print"
    rule: "Verify actual coated stock, plate handoff, conventional wet non-UV setting, flat trim and absence of added varnish/laminate/binding. Expanded or unknown route requires applicability review, not silent inclusion."
    source_ids:
      - excard-offset-sheet
      - epa-eiip-2002
  - rule_id: v_exchanges
    applies_to: "p_print"
    rule: "Confirm atom-by-atom physical identity, CAS, medium/property/unit and provider compatibility. Missing identities, quantities, formulas, provider/receiver or additional actual species prevent a complete dataset claim even when PCR method is authored."
    source_ids: []
  - rule_id: v_environment
    applies_to: "p_print"
    rule: "Check per-species outdoor balances, controls, disjoint particles, captured dust and wastewater receiver; reject correction flows, generic species substitutions, cumulative-PM double counting and deletion of real biogenic CO2."
    source_ids:
      - epa-eiip-2002
  - rule_id: v_ledgers
    applies_to: "p_print"
    rule: "Verify stage links at equal physical quantities and independently reconcile environmental attribution shares; physical co-product/output mass is never scaled by burden allocation."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground gate-ready single-sheet paper printing process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared same-route unlaminated/unvarnished flat image-print supply with actual linked providers and accepted net basis"
  excluded_use: "Universal CPC32540 coverage, wet photographic/inkjet or finished laminated/bound substitutes; visual service equivalence per kg; complete dataset claim with unresolved gaps"
  required_metadata: "All reference qualifiers, site/time, physical route/handoffs, provider identities/bases, allocation drivers, emitted media/species, actual receiving treatment and study boundary"
  required_quality_disclosure: "Collection and calibration coverage, physical versus burden ledgers, CAS/particle split uncertainty, missing UUIDs/formulas/quantities/providers and scope limitations"
  update_trigger: "Changed substrate/coating, ink/plate/fountain/wash/powder, finishing, supplier basis, utility, pollution control, waste route or new species evidence"
data_sources:
  - id: "epa-eiip-2002"
    type: "official_guidance"
    reference: "EPA EIIP Vol.II Ch.15 May2002; section2.1.1 printed15.2-4/PDF14, Post-Press subsection/PDF24, material balance4.1/PDF31. https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "Sheetfed poster/artwork route, postpress cutting and species/material accounting; historical factors not adopted"
  - id: "epa-offset-ctg-2006"
    type: "official_guidance"
    reference: "EPA-453/R-06-002 September2006; sectionIV.A printed6–8/PDF12–14. https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "Conventional sheetfed setting, fountain and cleaning distinctions; no regulatory thresholds or retention defaults"
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "JRC Production of Pulp Paper and Board BREF2015;7.1.4 printed665/PDF703;7.1.10 printed670/PDF708. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Upstream papermill/broke/cutting and need to inspect cutting dust; no printer emission factor or recipe"
  - id: "excard-offset-sheet"
    type: "handbook"
    reference: "EXCARD Flyer/Brochure Offset Bulk Order Print; current product-linked specification PDF1/7, snapshot2026-10-12. https://www.excard.com.my/product/loose-sheet ; https://s3-ap-southeast-1.amazonaws.com/excard/product-spec/1788890353_Flyer_Brochure_LO.pdf"
    used_for: "Real loose-sheet poster supply and optional/compulsory finish distinctions; art-card compulsory finish is excluded. No ink/plate/provider/quantity default"
  - id: "fujifilm-ra4"
    type: "handbook"
    reference: "Fujifilm RA-4 Processing Chemicals, snapshot2026-10-12. https://www.fujifilm.com/us/en/business/photofinishing/photographic-chemicals/ra-4"
    used_for: "Counterevidence: photographic emulsion developer/bleach-fix/rinse route excluded; no chemical recipe used"
  - id: "ec-pef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU)2021/2279 Annex I4.5, original PDF63–64; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Subdivision/feasible system expansion before evidenced causal or justified other allocation; no universal driver/share, waste credit or claim of full PEF/CFF conformity."
