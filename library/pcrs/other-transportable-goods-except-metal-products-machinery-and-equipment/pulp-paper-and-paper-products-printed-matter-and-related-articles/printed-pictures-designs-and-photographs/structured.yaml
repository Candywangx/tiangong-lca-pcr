system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "physical applicability"
      rule: "Require coated cellulose paper, wet conventional sheetfed offset with absorption/oxidative setting, and a flat trimmed unbound output with no post-print protective coating/laminate. Excluded constructions require separate reviewed extension; subject labels never change method identity."
      source_ids:
        - epa-eiip-2002
        - excard-offset-sheet
        - fujifilm-ra4
    - rule_id: b_foreground
      applies_to: "p_print"
      rule: "Include make-ready, wet offset, actual air/handling/cleaning, setting, trimming, inspection, packing and attributable utilities/wastes/net outdoor releases. No dryer burner, boiler, purchased steam, onsite pulp/coating, UV lamp or photochemistry is presumed. Actual onsite imaging, fuel/heat or additional stages must be measured atomically and assessed as an explicit extension."
      source_ids:
        - epa-eiip-2002
        - epa-offset-ctg-2006
    - rule_id: b_upstream
      applies_to: "purchased inputs"
      rule: "Include actual pulp/paper furnish, stock preparation, sheet formation/drying/coating/calendering/cutting, broke, energy and effluent providers. Paper BREF supports these paper processes, not wood/plywood recipes or printer emission factors. Supplied-plate upstream includes actual imaging/development; bring onsite work into foreground by replacing corresponding provider stages."
      source_ids:
        - jrc-paper-bref-2015
        - epa-eiip-2002
    - rule_id: b_links
      applies_to: "physical and burden ledgers"
      rule: "Aggregate print/trim/pack into one reported foreground unit while retaining separate stage meters and physical diagrams. Internal printed-sheet transfers have identical mass/moisture/ink on both endpoints, not extra product reference outputs. Keep unallocated material/water/fossil-and-biogenic-carbon balances and allocated environmental-burden ledgers separately. Transport packing is tracked in physical shipped mass but excluded from net print reference."
      source_ids: []
    - rule_id: b_releases
      applies_to: "nature boundary"
      rule: "Record outdoor releases after actual controls, segregated collected dust/wastes and liquid to receiving treatment distinctly. Indoor exposure is not outdoor LCI. Species/medium must match, and additional actual VOCs need separate cards. Preserve real biogenic CO2 in upstream/receiving-treatment LCI even if a greenhouse-gas metric excludes it; no combustion CO2 is invented for this non-fired foreground."
      source_ids:
        - epa-eiip-2002
boundary_abstraction:
  declared_starting_condition: "Received finished coated art-paper sheets and prepared imaged aluminium plates, supplied formulations and actual packing"
  starting_condition_role: "Disclosed supplied-material/plate foreground handoff, with prior production linked once"
  product_classification_scope: "Route-constrained single-sheet image-print subset of CPC3.0:32540"
  recursive_input_rule: "Purchased already printed sheets require their prior printing background and overprint-route review; do not recurse into the output or treat printed stock as blank. Internal rework retains its physical history."
  upstream_dataset_requirement: "Actual amount-compatible pulp/papermaking/coating, plate imaging/development, formulations, cloth/powder, packing, utility and transport providers; complete receiving waste treatment"
  disclosure: "Physical configuration, foreground/background handoffs, excluded/extended stages, provider bases, site/time, controls, data/identity gaps and downstream study assumptions"
