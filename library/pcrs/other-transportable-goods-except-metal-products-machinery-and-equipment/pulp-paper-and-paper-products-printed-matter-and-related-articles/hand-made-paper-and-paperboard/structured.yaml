process_inventory:
  - id: hand_papermaking
    label: "Cotton hand-sheet manufacture, recovery and finishing"
    inputs:
      product:
        - row_id: cotton_input
          role: "Cotton cloth cutting furnish"
          name: "Rags, scrap twine, cordage, rope and cables and worn out articles of twine, cordage, rope or cables, of textile materials"
          flow_type: "product"
          flow_ref:
            uuid: "d7e63c9a-9ebe-4a2a-b2f3-486bd5958a13"
          property_unit: "Mass / kg"
          description: "Use only sorted, pre-cut, clean cotton garment cuttings without synthetic blends, coatings, printing ink, or elastic. This broad rag identity includes that subset; do not model virgin cotton or cotton linters with it. Weigh consumed as-received mass and sample moisture; retain dry cotton mass separately. Verify supplier preparation and upstream burden allocation. Confirm the actual supplied, prepared secondary material is represented by the Product identity and disclose supplier preparation, legal/product-versus-waste status and allocation; an actual incoming waste transfer needs its own applicable waste identity and boundary review. Neither scrap classification nor purchase alone establishes zero upstream burden."
          amount:
            expression: "Collected physical amount divided by accepted net finished kg for the same reporting period; cp_materials."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_materials
              source_ids:
                - khadi-cotton-route
            ranges: []
        - row_id: water_input
          role: "Purchased tap water"
          name: "Tap water"
          flow_type: "product"
          flow_ref:
            uuid: "d1e0e36c-07f0-4a75-bdcb-efb5d9e2ac36"
          property_unit: "Mass / kg"
          description: "Meter fresh water supplied for soaking, beating, vat makeup, felt washing, equipment cleaning and sizing dilution. Convert measured volume to mass with documented site density and temperature, not the database secondary coefficient. Exclude internal recirculation from fresh input; water in emulsion is already part of that product mass. Use an actual local water-supply background."
          amount:
            expression: "Collected physical amount divided by accepted net finished kg for the same reporting period; cp_water."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_water
              source_ids:
                - eu-pp-bref-2015
            ranges: []
        - row_id: electricity_input
          role: "Low-voltage grid electricity"
          name: "Alternating current"
          flow_type: "product"
          flow_ref:
            uuid: "50657322-939c-4829-a87b-47c093bfa6a7"
          property_unit: "Net calorific value / MJ"
          description: "Meter consumed user-side electricity below 1 kV. Include electric Hollander motor, pumps, hydraulic press power pack, ventilation, electric gelatin-bath heater, auxiliary electric drying/conditioning and attributable storage/cleaning power. Convert kWh to MJ using 3.6; the database property name is retained and does not imply electricity is a fuel. Keep stage submeter totals; sum each kWh once and link location/time/voltage-compatible grid background. Raw supply geography is CN: verify actual workshop/provider geography, year, grid mix, voltage and delivery losses before background linkage. No automatic China or generic-world supply is established."
          amount:
            expression: "Collected physical amount divided by accepted net finished kg for the same reporting period; cp_energy."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_energy
              source_ids:
                - khadi-cotton-route
                - eu-pp-bref-2015
            ranges: []
        - row_id: sizing_emulsion_input
          role: "Ketene-dimer internal sizing emulsion"
          name: "Ketene-dimer internal sizing emulsion"
          flow_type: "product"
          property_unit: "Mass / kg supplied emulsion"
          description: "Measure one purchased ketene-dimer sizing emulsion added near the end of beating. Declare brand, current formulation, solids fraction, pH, carrier-water fraction and storage conditions. Supplier instructions establish a possible hand-papermaking option, not Khadi composition or a universal dose. Resolve the neutral-pH instructions versus linked acidic Hercon SDS before claiming pH or background compatibility. The AKD component identity, including its synthesis/emulsification metadata, does not establish the actual supplied mixture, complete composition or supplied-emulsion reference mass; UUID remains blank. No starch, alum, dye or filler is presumed present."
          amount:
            expression: "Collected physical amount divided by accepted net finished kg for the same reporting period; cp_additives."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_additives
              source_ids:
                - chp-sizing-directions-2014
                - solenis-hercon-sds-2018
            ranges: []
        - row_id: gelatin_input
          role: "Gelatin surface size"
          name: "gelatin"
          flow_type: "product"
          flow_ref:
            uuid: "aa9b81c7-64ab-40a2-9419-50fedc25a2c7"
          property_unit: "Mass / kg"
          description: "Use the selected physical powder identity only for concentrate/dry/grind gelatin with supplier-confirmed purity above 99.5%, CAS 9000-70-8. Weigh new powder added to the electrically heated aqueous tub; report animal origin, residual moisture, bath stocks, spills, spent solution and retained dry gelatin. Do not equate wet sizing-bath mass to powder consumption or import a database recipe. Actual supplier composition and powder-state compatibility remain required."
          amount:
            expression: "Collected physical amount divided by accepted net finished kg for the same reporting period; cp_additives."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_additives
              source_ids:
                - khadi-cotton-route
            ranges: []
        - row_id: felt_input
          role: "Wool papermaking couching felt"
          name: "Felt"
          flow_type: "product"
          flow_ref:
            uuid: "144717eb-3301-402a-89c8-3ba5a969425a"
          property_unit: "Mass / kg"
          description: "Measure the actual finished wool papermaking couching felt used over its documented service interval. The broad finished Felt physical Product identity includes this qualified subset without an opposing material or application route; require actual wool fraction, felted structure, dimensions, grade, reuse/wash history and supplier compatibility. It does not establish a bedding blanket, raw wool, synthetic vacuum-bag breather or matched felt-production background. Retain dry felt, water and in-use/stored inventories with actual purchase/replacement/retirement events. Keep the full physical gate and stock ledger separate from environmental consumption attributed by documented actual service to this reporting period; no assumed lifetime, sheet-count mass factor or duplicate replacement burden."
          amount:
            expression: "Collected physical amount divided by accepted net finished kg for the same reporting period; cp_materials."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_materials
              source_ids:
                - khadi-cotton-route
            ranges: []
        - row_id: wrapping_input
          role: "Uncoated paper wrapping"
          name: "Uncoated printing, writing and packaging paper"
          flow_type: "product"
          flow_ref:
            uuid: "936bdcb2-06b6-4ee9-8e7c-2f7762aba298"
          property_unit: "Mass / kg"
          description: "When sheets are wrapped at the gate, weigh one uncoated paper wrapping grade consumed, including documented stock changes and offcuts. The broad uncoated-paper record includes packaging paper without a contrary route restriction; require the actual grade and supplier background. Keep wrapping out of the reference net paper mass. If delivered loose, document absence; never infer other packaging has zero mass. Actual discarded wrapping offcuts and additive containers, if present, need independently weighed and identified waste records; do not merge them with cotton rejects, sludge or spent felt."
          amount:
