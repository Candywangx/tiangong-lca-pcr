        - row_id: handmade_paper_output
          role: "Accepted finished handmade cotton paper"
          name: "Hand-made paper and paperboard"
          flow_type: "product"
          flow_ref:
            uuid: "7f14ce45-f456-4f95-991d-e4693db18679"
          property_unit: "Mass / kg"
          description: "1 kg net accepted finished paper after both drying passes, conditioning and acceptance; exclude wrapping, rejects and unfinished work. Record actual lot moisture, grammage, sheet area/count and sizing status. The broad handmade-paper-and-board identity is narrowed by these qualifiers; it supplies no cotton recipe or performance default."
          amount:
            expression: "1 kg"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
