measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted finished conditioned sheets on a calibrated balance using cp_output, excluding packaging, rejects and unfinished stock. Normalize every row to the same accepted net mass."
  - id: wet_dry_basis
    applies_to: "cotton_input; gelatin_input; sizing_emulsion_input; handmade_paper_output; sludge_output; cotton_reject_output; spentfelt_output"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve as-received/wet and dry amounts separately. Determine representative moisture/solids with a documented applicable constant-mass drying method, replicate samples, temperature/time and possible volatile-loss bias. No standard moisture fraction is assumed."
  - id: electricity_basis
    applies_to: "electricity_input"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Record meter kWh and convert using 1 kWh = 3.6 MJ. Do not treat electric bath heat as a second purchased-heat exchange; keep its stage submeter and useful-heat diagnostic separate."
  - id: water_basis
    applies_to: "water_input; wastewater_output; evaporation_output"
    required_property_ref:
      name: "Mass or Volume as specified in the row"
      uuid: ""
    required_unit: "kg or m3 as specified in the row"
    rule: "Convert volumes only using documented density/temperature; distinguish fresh withdrawal, internal recirculation, final wastewater, retained moisture and evaporation."
process_map:
  - id: hand_papermaking
    name: "Cotton hand-sheet manufacture, recovery and finishing"
