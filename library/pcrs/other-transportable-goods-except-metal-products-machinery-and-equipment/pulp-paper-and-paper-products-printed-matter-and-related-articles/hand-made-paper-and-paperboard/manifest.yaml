review_metadata:
  independent_methodology_review: pending
  mapping_review:
    proposed_relation: narrower
    rationale: Cotton-only hand-formed sheets with electric beating/pressing, loft drying and gelatin surface sizing are a subset of CPC 32122; other fibre and board routes are not covered. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_rows:
    - sizing_emulsion_input
  unresolved_identity_details:
    sizing_emulsion_input: AKD component identity includes synthesis/emulsification metadata but does not establish actual supplied mixture composition or whole-emulsion mass reference. Keep UUID blank; current supplier formula, ingredient/reference basis, solids and carrier water mandatory. Historical neutral-pH instructions conflict with linked2018Hercon acidic product SDS; no neutral-pH/archival performance claim.
  quantity_background_compatibility:
    cotton_input: Broad rag identity is valid only for verified pure cotton cuttings; actual moisture, collection/preparation, supplier allocation and upstream model remain foreground requirements.
    gelatin_input: Powder purity above 99.5% and concentrate/dry/grind route must be confirmed for the actual lot; bath-water mass is not powder mass.
    electricity_input: Raw CN user-side grid-average supply below1kV, NCV/MJ physical identity; actual site/provider/geography/year/mix/voltage/loss compatibility required, no China/global default.
    water_input: Mass/kg is the reference; use measured site density for volume conversion and actual supply background rather than database secondary conversion defaults.
    wrapping_input: Broad uncoated packaging-paper identity; require one actual uncoated grade, supplier route and physical packaging mass.
    wastewater_output: Broad industrial liquid Waste Mass/kg only for actual separately characterized aqueous transfer to accepted external treatment. Measure bulk kg or m3×measured event kg/m3; actual water fraction is separate, no1000kg/m3 or product SDS density. Keep original m3 pollutant-load analysis, no direct freshwater emission or matched treatment background.
    felt_input: Broad finished Felt Product Mass/kg qualifies actual wool papermaking couching felt only with fibre fraction, felted structure, dimensions, grade and provider compatibility. Actual service attribution separate from full physical gate/in-use stock/replacement/retirement ledger; no lifespan or burden defaults.
  integration_required: Promoting this retained scaffold may invalidate shared legacy-alias/catalog derivatives. Controller must serially rebuild and independently verify them; author cannot edit shared artifacts.
  identity_qualifications:
    - row_id: cotton_reject_output
      uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
      condition: Actual separately collected industrial solid residue from this specific stated operation; wet/dry water/cotton/wool/sizing, stocks, contamination/hazard, waste status and specific receiver/provider acceptance independently traceable. Same UUID does not merge streams or prove treatment/background. Liquid or saleable Product requires separate applicability review.
    - row_id: sludge_output
      uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
      condition: Actual separately collected industrial solid residue from this specific stated operation; wet/dry water/cotton/wool/sizing, stocks, contamination/hazard, waste status and specific receiver/provider acceptance independently traceable. Same UUID does not merge streams or prove treatment/background. Liquid or saleable Product requires separate applicability review.
    - row_id: spentfelt_output
      uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
      condition: Actual separately collected industrial solid residue from this specific stated operation; wet/dry water/cotton/wool/sizing, stocks, contamination/hazard, waste status and specific receiver/provider acceptance independently traceable. Same UUID does not merge streams or prove treatment/background. Liquid or saleable Product requires separate applicability review.
    - row_id: wastewater_output
      uuid: bdfc32cf-8028-40a8-a2e4-2d73422ece34
      condition: Broad industrial liquid Waste Mass/kg only for actual separately characterized aqueous transfer to accepted external treatment. Measure bulk kg or m3×measured event kg/m3; actual water fraction is separate, no1000kg/m3 or product SDS density. Keep original m3 pollutant-load analysis, no direct freshwater emission or matched treatment background.
    - row_id: felt_input
      uuid: 144717eb-3301-402a-89c8-3ba5a969425a
      condition: Broad finished Felt Product Mass/kg qualifies actual wool papermaking couching felt only with fibre fraction, felted structure, dimensions, grade and provider compatibility. Actual service attribution separate from full physical gate/in-use stock/replacement/retirement ledger; no lifespan or burden defaults.
  source_classification_review_debt:
    - row_id: gelatin_input
      uuid: aa9b81c7-64ab-40a2-9419-50fedc25a2c7
      raw_classification: CPC36270 vulcanized/hard rubber articles
      conflict: Coherent gelatin/明胶, CAS9000-70-8, animal-collagen protein comment and concentrate/dry/grind powder route contradict rubber classification.
      disposition: Conditional actual gelatin powder purity>99.5% with composition/origin/provider compatibility retained; source/provider classification clarification pending, no resolved metadata or matched background claim.
    - row_id: wrapping_input
      uuid: 936bdcb2-06b6-4ee9-8e7c-2f7762aba298
      raw_classification: CPC32129 wood-free uncoated graphic paper
      conflict: Broad official name explicitly includes uncoated packaging paper; comment describes uncoated structure with graphic uses as examples, not exclusive use. Classification does not itself establish actual packaging grade/furnish.
      disposition: Retain only actual uncoated wrapping grade with supplied fibre/furnish/state/provider applicability review; request source/provider clarification of classification versus stated packaging scope before matched background claims.
  actual_completeness_review_required:
    - Verify press model and actual hydraulic working-fluid/lubrication formulation, in-use/stored stocks and real additions/changes/recovery/spills; separately identify each confirmed external exchange; no mineral-oil assumption.
    - Inspect handling pre-cut cotton, dry-sheet finishing and ventilation for actual fine lint; dry captured residues, coarse cotton rejects, wet fibre sludge and outdoor particles remain distinct, with actual identity/quantity/media evidence if present; no paper-machine factor or silent zero.
    - No direct freshwater discharge or biological-treatment/combustion route is adopted. A site with such routes requires separate source-specific boundary/inventory review.
    - Current supplied ketene-dimer emulsion composition, solids, carrier water, product-versus-bath pH, ingredient/active-versus-supplied reference basis and recipient acceptance remain unresolved; historical SDS hazard component list is incomplete formula and no neutral-pH/archival claim is established.
    - For actual optional AKD use, independently evidence molecular-H2O chemical formation/consumption, reaction extent and actual product destinations with uncertainty; simplified evaporation accounting requires absent or evidenced negligible H2O reactions. Unknown terms remain gaps; no assumed hydrolysis fraction, rate, complete conversion or CO2 amount/origin.
  classification_mapping_authority: Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate.
