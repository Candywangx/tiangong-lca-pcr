  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use the calibrated measured net mass of complete first-released books at recorded moisture, including all retained components; exclude packaging. Collect using cp_release."
  - id: same_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "reference-product Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Every final exchange and protocol aggregation uses per 1 kg reference flow. Close physical period/lot ledgers and burden attribution separately before one final division by positive accepted net mass Q; neither incoming paper, printed sheets, shipments nor repeated rework acceptance is Q."
  - id: formulation_basis
    applies_to: "wet chemical and glue inputs"
    required_property_ref:
      name: "supplied preparation Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep each complete supplied ink/concentrate/wash/glue wet formulation and its provider once. Constituents and water are internal composition evidence, not extra purchased exchanges unless separately supplied. Any component replacement must reconcile a complete recipe and retire the whole-preparation burden."
