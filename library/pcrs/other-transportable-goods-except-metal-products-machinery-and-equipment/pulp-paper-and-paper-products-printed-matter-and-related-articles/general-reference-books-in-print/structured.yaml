allocation_rules:
  - rule_id: a_physical_first
    applies_to: "all accounts"
    rule: "Keep gross physical V independently from attributed environmental-load A and the original supplier/provider vector. V includes all receipts, stocks, WIP, failed runs, rework, cleanup, internal legs and actual waste/releases; never multiply physical book/waste/transfer quantities by an allocation share to force closure."
    source_ids: []
  - rule_id: a_causal_subdivision
    applies_to: "shared operations"
    rule: "Avoid allocation using job/stage submetering and subdivision first. Attribute remaining setup/press/sewing/case-making/cleaning/drying/standby by supported causal measurements such as actual runtime, sheet passes/area, stitch cycles or delivered heat; record every eligible job/WIP/failed-job driver in the denominator. Page count, sales value or a convenient mass share is not a default cause. Retain the original provider vector, split it once by the documented shares, and prove the shares sum to one over the entire eligible account."
    source_ids: []
  - rule_id: a_cohort
    applies_to: "release and WIP"
    rule: "Keep each lot's original cohort and carried V/A through opening WIP, internal repairs, rebinding, returns and later release. Charge Q=0 failure/startup/cleanup to its causal production cohort or disclose a separately retained unresolved cost account; never drop it, reset its denominator, or divide by zero. A lot may enter Q only on its first genuine quality release. Closing WIP retains its attributable load for later release."
    source_ids: []
  - rule_id: a_recycling_packaging
    applies_to: "waste and packaging"
    rule: "No default avoided-production credit for paper/board/plates and no separate product function for transport packaging. Preserve measured waste, provider and receiver obligations once. For owned returnables retain stock/returns and evidenced reuse/life accounting; a return is not fresh manufacture. Document any separately justified co-product/recycling method and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "reference_manufacture"
      flow_role: "first-released complete reference books and Q"
      record_type: "required future foreground record"
      raw_fields: "title; public-reference purpose; edition/language/volume/parent; approved proof; signature/entry/index completeness; lot/cohort; first-release event; accepted copies; individual/lot net mass; measured moisture; opening/hinge/text-opacity acceptance; packing tare; prior release/rework flag"
      collection_method: "Verify the edition against publisher instructions and approved specimen; inspect signature order, missing/duplicate pages, guide words/index and gutter readability. Weigh complete dry-to-acceptance books on calibrated scales net of dispatch packaging; record moisture. Reconcile first release once against serialized lot records and calibrated copy sampling checked against lot weighing."
      unit: "kg; copies"
      frequency: "each lot and release event; period stock count"
      temporal_coverage: "declared complete period with opening WIP history and closing holds"
      site_scope: "actual printing/binding site and declared contractors"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed proof/release register; calibration; sample plan and net weighing; rejection/rework history"
    - protocol_id: cp_paper
      process_id: "reference_manufacture"
      flow_role: "text, endsheet and case-wrap paper separately"
      record_type: "required future foreground record"
      raw_fields: "supplier/grade; fibre/recycled fraction; grammage; opacity; dimensions/grain; moisture; received/issued/returned mass; opening/closing blank stock; printed signatures/wraps; stage transfer IDs; make-ready; offcuts"
      collection_method: "Weigh each paper grade and stage separately. Reconcile imposition and full-sheet area with actual grammage only as a checked secondary estimate; count signatures, recto/verso passes and discarded forms. Preserve moisture and independent transfers of printed wrap versus text."
      unit: "kg; sheets; m2"
      frequency: "receipt; job setup/run; each stock/transfer event"
      temporal_coverage: "complete period including failed formes and repeat printing"
      site_scope: "text and wrap press/folding stores within declared site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock cards/invoices; calibrated scales; imposition/cut plans; opacity and grain specifications"
    - protocol_id: cp_binding
      process_id: "reference_manufacture"
      flow_role: "board/strip/thread/mull/backliner and each wet glue"
      record_type: "required future foreground record"
      raw_fields: "stage/lot; panel and spine-strip cut plan/count/mass; thread polymer/twist/spool/core/return; stitch pattern; mull/backliner grade/roll; three glue SKUs; wet issue/return/stock; solids/water/residual monomer; sewn-block/case WIP; paired transfers; nip/press/dry cycle; rejected/repair books"
      collection_method: "Weigh distinct components and wet glue formulations. Check thread length only against actual measured linear density, subtract spool cores. Log intact-fold sewing and each glue use separately. Record case and block construction, cold-gluing compatibility, drying/pressing, water retained/evaporated and adhesion/opening tests; reconcile independently made cases with matched blocks."
      unit: "kg; m; cycles"
      frequency: "each lot, component change, glue issue and cleanup; period closure"
      temporal_coverage: "complete period and carried WIP production history"
      site_scope: "sewing, backlining, case-making and casing-in including disclosed outsourcing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "BOM/cut plans; supplier TDS/SDS/full recipe; balances; sewing/hinge acceptance and calibrated weighing"
    - protocol_id: cp_print
      process_id: "reference_manufacture"
      flow_role: "complete plates, ink, concentrate, separate IPA, wash, powder and cloth"
      record_type: "required future foreground record"
      raw_fields: "job/forme/side; replacement plates/coating; black ink SKU; concentrate/wash batch; full composition/CAS/carbon source; wet mass/density/T; stock/issue/return; fountain dilution; IPA separately added; retained ink/powder; rags; startup/reprint/cleaning events"
      collection_method: "Measure as-supplied quantities for each formulation and separately delivered IPA/water. Retain supplier composition beyond public SDS omissions; audit whole-versus-component provider ownership. Weigh complete plates and trace on-press coating to paper/wash. Record waste/retention/emission links without adopting historic retention factors."
      unit: "kg; L; plates"
      frequency: "each job, formulation and plate change; cleanup; period stocks"
      temporal_coverage: "complete period including make-ready, zero-output jobs and storage"
      site_scope: "actual CTP, sheetfed press and cleaning area"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original issues/returns; weighed plate/chemical stocks; composition assays and current equipment/grade proof"
    - protocol_id: cp_energy
      process_id: "reference_manufacture"
      flow_role: "electricity, conditional gas and imported heat separately"
      record_type: "required future foreground record"
      raw_fields: "device/stage/job/cohort; meter starts/ends; kWh/voltage; grid/provider/year; gas m3/T/P/Z/composition/wet-dry; heat supply/return flow/enthalpy; runtime/drivers; startup/standby/cleanup; bill reconciliation; original provider vector"
      collection_method: "Submeter all process and shared equipment, including air compression, chillers, ventilation, sewing, cold-glue drying and press/joint heaters. Retain imported-heat provider once; retain actual on-site gas emissions separately. Reconcile raw meters to bills before causal subdivision and A assignment, including Q=0 jobs and closing WIP."
      unit: "kWh; MJ; m3"
      frequency: "job/cycle or continuous meters; each bill/period closure"
      temporal_coverage: "representative complete reporting period, not steady-state samples only"
      site_scope: "manufacturing site and attributed outsourced energy only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; bills; provider conditions; complete driver denominator; energy balance and uncertainty"
    - protocol_id: cp_water
      process_id: "reference_manufacture"
      flow_role: "separately supplied water, internal carrier water and outdoor vapour"
      record_type: "required future foreground record"
      raw_fields: "source/grade; use submeter; T/density; dilution/cleaning; formulation water; paper/board/glue moisture; liquid waste water; supply/return/condensate; inlet/outlet humidity/flow/T/P; WIP and product water; fuel hydrogen if applicable"
      collection_method: "Meter purchased water separately by use. Treat formulation water as contained mass in whole supplies, not another purchase. Sample liquid/product moisture and match humidity/airflow at inlet/outlet; reconcile physical water and any actual reaction-generated combustion water with fuel evidence. A residual is a gap, not known evaporation."
      unit: "kg; m3"
      frequency: "fills/cleaning/drying campaigns and period closure"
      temporal_coverage: "all actual production and cleaning modes in declared period"
      site_scope: "plant boundary plus matched carrier-water accounts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water bills/meters; moisture/assay methods; psychrometric basis; calibrated flow/T/P and balance residuals"
    - protocol_id: cp_waste
      process_id: "reference_manufacture"
      flow_role: "each physically separate waste stream"
      record_type: "required future foreground record"
      raw_fields: "stage/lot/bin; stream identity/state; net whole mass; tare; liquid volume/density/T; water-specific fraction; independent solids/nonwater contents; ink/glue/thread/board contamination; internal returns; dispatch/stock; receiver/treatment"
      collection_method: "Weigh each stream where it exits or enters measured waste stock. Keep unprinted/printed trim, board, whole rejected books, plate, ink, fountain, wash, glue liquids/solids, cloth, thread, mull and captured dust separate when physically separated. Do not split a whole waste mass into fictitious duplicate component transfers."
      unit: "kg; m3"
      frequency: "collection and handover; period waste-stock counts"
      temporal_coverage: "complete period with cleanup, failed production and stock changes"
      site_scope: "plant exit and named waste storage/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "bin/weighbridge records; receiver acceptance; water/solid assays; treatment contracts and physical balance"
    - protocol_id: cp_pack
      process_id: "reference_manufacture"
      flow_role: "carton/film receipts, accompanying output, waste, returns and FG stocks"
      record_type: "required future foreground record"
      raw_fields: "ownership/provider; receipt/issue/return; carton/film grade/mass; opening/closing raw packaging; packaged FG by original cohort; opening-FG dispatch; first-release dispatch; unpack/repack; scraps; supply packaging; pallet/container/tape/label survey; component/item and event IDs; owner/custodian and original owner-cohort; mutually exclusive P/N_ext/ER entry class; purchase/bundled-price or loan/lease/commission/customer/accompanying-goods evidence; same-item prior outward event and owner-cohort proof for ER; each exchange original V/A/provider/gate/phase/period vector; packing-WIP and reusable stock states; gross dispatch/owner-return/other outward/waste and actual transport; actual wash/repair service"
      collection_method: "Weigh each material, reconcile receipt/returns and on-book packaging at shipment and closing FG. Separate opening-FG shipments from current first-release output; retain rejected/repacked and closing-FG packaging. Record actual returnable ownership, service/reuse burdens and extra materials as separate atomic exchanges. Classify each component at its first external entry to the traced item/owner-cohort account as purchase P, including a bundled paid component without a separate invoice, or first non-purchase N_ext, including borrowed, leased, commissioned, customer-owned or accompanying-goods components. Use ER only for a genuine external return linked to the same item and original owner-cohort by its prior outward record; internal R and other T transfers are neither first external entry nor ER. Keep unresolved classification/history/provider burdens as explicit gaps, never zero. Reconcile every gross leg and mutually exclusive stock state; preserve original burden vectors and add actual wash/repair/transport increments once."
      unit: "kg; units"
      frequency: "receipt, packing, dispatch, returns and period count"
      temporal_coverage: "complete period with opening and closing packaged FG and prior outward/item history"
      site_scope: "factory stores/packing and actual return loop"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "packaging stock/ownership records; dispatch and FG reconciliation; tare weights; reusable-service evidence; purchase/bundled-price and non-purchase agreements; matched item/owner-cohort outward-return chain; provider coverage and actual service/transport records"
    - protocol_id: cp_air
      process_id: "reference_manufacture"
      flow_role: "each actual outdoor chemical species and disjoint particle bin"
      record_type: "required future foreground record"
      raw_fields: "stage/outlet/time; actual formulation/fuel species; CAS; inlet/outlet concentration and flow; T/P/humidity/dry-normal basis; detection limit/recovery; calibration response; particle cut and filterable/condensable definition; control efficiency; species/NOx basis; source/cohort"
      collection_method: "Survey actual formulations then validate species sampling against the matrix. Measure complete operating, cleaning/storage/drying and any auxiliary-burner cycles; integrate distinct sources after compatible ambient subtraction and capture. Check low-volatility/polymerizing limitations of Method 18; TVOC as carbon is QA only until species composition/response is demonstrated."
      unit: "kg; mg/m3; m3/time"
      frequency: "representative campaigns covering every actual mode and period"
      temporal_coverage: "complete reporting-period activity with declared extrapolation and uncertainty"
      site_scope: "actual outdoor air boundary, not indoor exposure or offsite providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "accredited/competent sampling report; blanks/calibration/recovery; ventilation closure; detection/uncertainty and source-specific applicability"
  calculation_rules:
    - id: calc_stage_v
      applies_to: "each stage/material-state stock account"
      rule: "O_s + external_in_s + T_in_s + formation_s = C_s + external_out_s + T_out_s + consumption_s + residual_s. A same-state internal receipt belongs only to T_in_s, never external_in_s or formation_s. For each internal transfer t from s to r, T_out_s,t = T_in_r,t. For conserved whole mass, formation_s = consumption_s = 0 and include actual water/air/reactant masses. For species transformations only, record evidenced paired consumed/formed species through the same reaction event and its stoichiometric mass balance; a receipt is not formation."
      inputs:
        - cp_paper
        - cp_binding
        - cp_print
        - cp_water
        - cp_waste
        - cp_pack
        - "stage stock and transfer records"
      output: "gross stage V and explicit residuals in the declared physical unit"
      source_ids: []
    - id: calc_whole_v
      applies_to: "complete reference_manufacture boundary"
      rule: "Sum the stage equations over the complete declared unit: sum(T_in_s) = sum(T_out_s), so O_unit + external_in_unit + formation_unit = C_unit + external_out_unit + consumption_unit + residual_unit. Eliminate internal legs only after exact pair matching; do not add them again as receipts or count them as final books. Keep same-species transformation terms paired; for whole mass they are zero, with all actual reactants/products included. External_out includes actually dispatched books, separately accompanying packaging, rejects, wastes and actual releases, not their sum plus duplicate contained components. Retained accepted books remain closing FG; Q is a separate production-release memorandum and is not added to external_out."
      inputs:
        - calc_stage_v
        - cp_release
        - "complete gross period inventory"
      output: "reconciled unallocated whole-unit V with unmatched legs/residuals disclosed"
      source_ids: []
    - id: calc_q
      applies_to: "cp_release"
      rule: "Q = sum of calibrated net complete-book mass at each unique lot's first quality release in the selected original cohort; Q must be positive for a normalized result. Count-based Q requires accepted copies times the measured same-design mean net mass, verified against lot weighing/moisture. Repaired/rebound or previously released returned books cannot create a second Q. Q=0 lots retain V and A; opening released FG dispatches are not current first release."
      inputs:
        - cp_release
        - "release IDs"
        - "original cohort"
        - "net mass and moisture"
      output: "Q in kg and complete exclusion/rework register"
      source_ids: []
    - id: calc_a
      applies_to: "each attributable provider/utility burden vector"
      rule: "Direct measured job subdivision first; for a remaining shared account j, A_j,c = original_provider_vector_j × d_j,c / sum(d_j,k) across every eligible cohort, WIP and Q=0 account k. Record the evidence for causal driver d, keep its full denominator and prove sum(A_j,c) = original_provider_vector_j. Do not rescale gross V by this share. Retain opening WIP's original A, add actual newly attributed load and carry closing WIP A forward; the provider remains the same and is linked once."
      inputs:
        - cp_energy
        - "job/stage records"
        - "original provider vector"
        - "all drivers"
        - "opening/closing WIP A"
      output: "disjoint attributed burden A with conserved original provider vector"
      source_ids: []
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "First close gross period V and select original first-release production cohort C_cohort with all carried earlier records, causal failed/startup/cleanup costs and closing-WIP separation. Physical quantity per reference = V_row,C_cohort / Q; burden quantity per reference = A_row,C_cohort / Q, retained as a separate ledger. Divide once after closure/subdivision/allocation; do not divide again at each internal stage or attach the provider to both V and A. If cohort history or Q is unresolved, retain unnormalized evidence and do not issue a completed normalized dataset."
      inputs:
        - calc_whole_v
        - calc_q
        - calc_a
        - "original cohort history"
        - "each linked collection protocol"
      output: "physical and attributed results separately per 1 kg reference flow"
      source_ids: []
    - id: calc_formulation
      applies_to: "supplied formulations and associated water ledger"
      rule: "Supplied constituent mass = measured supplied formulation mass × evidenced actual constituent mass fraction. Use the complete formulation input/provider once; this calculation checks retention/waste/release and internal carrier water. If replacing it with components, fractions including water and undisclosed remainder must close to the supplied mass and replace, rather than add to, the complete background."
      inputs:
        - cp_binding
        - cp_print
        - cp_water
        - "current complete supplier composition"
      output: "actual contained-constituent/water checks and provider ownership"
      source_ids:
        - epa-ctg-2006
    - id: calc_air_species
      applies_to: "each actual air species"
      rule: "Outdoor species kg = integrated matched outlet flow × species concentration minus compatible integrated incoming species mass, converted on common T/P/humidity and calibrated response/recovery. Sum disjoint outlet/time intervals only; do not replace a species by TVOC carbon or assign an unmeasured residual to a named species."
      inputs:
        - cp_air
        - "time/flow/species/ambient observations"
      output: "outdoor species mass before cohort attribution and normalization"
      source_ids:
        - epa-method18-2025
    - id: calc_pack_v
      applies_to: "each packaging material and ownership account"
      rule: "For direct raw-to-FG packing: opening raw packaging + external receipts + returns from use + matched internal T_in = closing raw packaging + packaging issued + external returns + raw waste + matched internal T_out; packaging issued + opening packaging on FG = closing packaging on FG + packaging on dispatched books + packing waste + returns from use, with opening/current FG cohorts separate. External receipts = P + N_ext + ER; external returns and other outward transfers belong to EO, excluding book-dispatch packaging and waste. When packing WIP or reusable states occur, apply calc_stage_v to each disjoint state and include all matched transfers instead of forcing those stocks into raw/FG. For each component/item-owner-cohort, the consolidated account is O_all_states + P + N_ext + ER = C_all_states + gross accompanying dispatch + EO + gross waste + disclosed residual. O_all_states and C_all_states include raw, packing WIP, new-FG, old-FG, reusable-store and any separate in-use stocks exactly once. Cancel paired internal/reuse legs at whole-unit boundary, retaining R separately from other T. Split extra ownership/receiver transfers explicitly; no manufactured receipt or default reuse credit. Keep gross transport and actual incremental wash/repair services separately, with each original provider vector covered once and unresolved obligations retained."
      inputs:
        - cp_pack
        - cp_release
        - "shipment/FG/ownership records"
      output: "complete physical packaging balance and correct current-cohort accompanying output"
      source_ids: []
  data_quality_requirements:
    - id: dq_reference
      applies_to: "finished_reference"
      requirement: "Verify public-reference purpose, title/edition/parent installment and actual content; verify signature/index completeness and fine-print/gutter/opening/hinge acceptance with the actual sewn hardcase sample. Mass alone is not functional equivalence."
      evidence: "publisher brief; approved proof; complete specimen/BOM; release/acceptance records"
    - id: dq_identity
      applies_to: "each exchange"
      requirement: "Verify native type, full name/route/form/CAS/media, reference property→unitgroup→unit, actual provider grade/state/quantity and Chinese official display. Historical records do not prove current database status; missing auxiliary identity is a local gap, while an incompatible reference or primary formation route requires explicit review."
      evidence: "original native records and reading dates; property/unit records; supplier/receiver specification; documented unresolved/rejected candidates"
    - id: dq_ledgers
      applies_to: "V, A, Q and stocks"
      requirement: "Close each stage and whole-unit account with explicit matched T_in/T_out, original cohort continuity, water/solid/organic-carbon checks, complete Q=0 and cleanup/energy records and independent provider-vector conservation. Derive tolerances from measurement uncertainty; no default balance allowance or loss. Check component-level P/N_ext/ER exclusivity, same-item/owner-cohort prior outward proof for ER, disjoint raw/WIP/new-FG/old-FG/reusable stocks and gross dispatch/EO/waste/transport; verify provider coverage and actual wash/repair increments once."
      evidence: "original weigh/meter/transfer records; lot/WIP/FG histories; uncertainty and residual register; provider/driver reconciliation; component entry and outward-return evidence; service/transport records"
    - id: dq_coverage
      applies_to: "all actual site operations"
      requirement: "Survey extra supplies, supplier packaging, pallet/tape/labels, press maintenance/lubricant/filter/refrigerant, wastes and species; add separate atomic rows where present. Missing values are gaps, measured absence is evidence, and a successful identity match is not a measured amount."
      evidence: "full receipt/equipment/SDS/maintenance survey; sampling and provider evidence; gap/absence register"
    - id: dq_sources
      applies_to: "evidence reuse"
      requirement: "Keep the source's edition, product, route and page limits. CPC notes classify purpose only; supplier options and old single-factory descriptions supply neither actual job proof nor quantities. No recipe, release fraction, machine capacity, service lifetime or emission factor is adopted as a default."
      evidence: "primary locators and applicability assessment; actual job/supplier documents; disclosed source acquisition limits"
validation_rules:
  - rule_id: v_applicability
    applies_to: "reference identity"
    rule: "Confirm only the general-reference leaf, public readership and declared dictionary/encyclopedia construction. Exclude contact directories and periodicals independently of matching theme. Verify the manufactured complete general-reference-book identity, edition/part and all physical qualifiers; unbound intermediates and generic printing-service/printed-matter providers cannot substitute for the declared complete volume."
    source_ids:
      - unsd-cpc3-2025
  - rule_id: v_construction
    applies_to: "material/process evidence"
    rule: "Match signature count/order and thread through intact folds, endpapers, board/strip/wrap geometry, separate case/block WIP, mull/backliner and all three cold dispersion-glue uses to actual records. An adhesive-only paperback, milled spine, colour/atlas variant or premade case cannot silently satisfy this method."
    source_ids:
      - cps-manufacturing-2018
      - schmedt-adhesive-guide
      - schmedt-machine-thread
  - rule_id: v_v_a_q
    applies_to: "inventories and normalization"
    rule: "Execute calc_stage_v and calc_whole_v with same-state paired internal legs; execute separate calc_a and calc_q. Reject duplicated provider vectors, repeated Q from rework/returns, dropped Q=0 jobs/cleanup, omitted closing WIP/FG or unmatched opening costs. Require cp_pack and calc_pack_v component entry classes, same-item original owner-cohort outward-return proof and complete gross legs/stocks; reject netted external returns, free-as-zero burdens, duplicated container/component providers or invented reuse cycles/credits. Normalize once only after these ledgers close; unresolved history/basis is incomplete data, not a passing quantitative dataset."
    source_ids: []
  - rule_id: v_water_chemicals
    applies_to: "all preparations and water"
    rule: "Reconcile supplied wet glues/ink/fountain/wash, retained dry matter/water, cleanup waste, outdoor vapour and stocks. Whole preparation plus components/carrier-water burdens cannot coexist. Use actual density/assay and no assumed generic glue solids or all-water evaporation."
    source_ids:
      - epa-ctg-2006
      - schmedt-adhesive-guide
  - rule_id: v_emissions
    applies_to: "outdoor air and waste"
    rule: "Resolve each actual organic species/medium and disjoint PM bin after control; collected dust and waste liquid are not elementary air/water emissions. Keep carbon origin and any combustion-water/reaction evidence; NOx-equivalent basis and N2O are separate. Gas/heat/electricity backgrounds and on-site combustion must not duplicate each other. Add actual unlisted species before completeness."
    source_ids:
      - epa-method18-2025
      - epa-gas-ap42
  - rule_id: v_readiness
    applies_to: "completed foreground dataset"
    rule: "Report performed/skipped checks, missing identities/providers/measurements, sampling limits, residuals and scientific/translation review state. Structural/finite checks establish declared consistency only, not independent methodology approval, database currency, actual measured completeness or publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input of the same declared complete general-reference volume at manufacturing gate after actual foreground data and provider review."
  allowed_use: "One verified edition/volume of the selected monochrome uncoated sheetfed, through-fold sewn, paper-covered hardcase dictionary/encyclopedia construction, with complete original-cohort records and compatible providers."
  excluded_use: "Whole-leaf technology average; directory/periodical/textbook/professional/children's title substitution; colour atlas or excluded finishing/binding route; equivalent lifetime/knowledge/lookups claim; publication-ready quantitative dataset inferred from UUIDs, supplier options or check success."
  required_metadata: "All reference qualifiers; actual gate/stage/job history; site/geography/period; supplier grades/recipes/units; native-record evidence dates; original V/A/provider vector/Q/cohort; WIP/FG/packaging ownership; actual allocation and receiver methods."
  required_quality_disclosure: "Measured versus required/unmeasured fields; identity/provider/reaction/species gaps; source limits; unreviewed scope; uncertainty/residuals; performed/skipped tests; scientific and bilingual review status."
  update_trigger: "Changed title purpose, edition/design, signature/board/glue/ink/fount/wash construction, print/drying/binding/finish route, provider/utility conditions, release/cohort practice, stocks, treatment or evidence. Revisions of this CPC retain the same PCR identity."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "PDF/printed pp.148–150: general-reference purpose/public readership, examples/installments and neighbouring content/periodical exclusions only. No production quantities or route prescribed."
  - id: "epa-eiip-2002"
    type: "official_guidance"
    reference: "EPA EIIP Volume II Chapter 15, Preferred and Alternative Methods for Estimating Air Emissions from Printing, Packaging and Graphic Arts, May 2002; https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "PDF14–15, §2.1.1 and Figure15.2-1: sheetfed books, wet offset and penetration/oxidation; qualitative process/record context only, no historic factors or emission shares."
  - id: "epa-ctg-2006"
    type: "official_guidance"
    reference: "EPA-453/R-06-002, Control Techniques Guidelines for Offset Lithographic Printing and Letterpress Printing, September 2006; https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "PDF12–15/printed6–9, §IV.A and source overview: separate ink/fountain/wash formulations and emissions; historical recipes, retention/regulatory factors are not adopted."
  - id: "kodak-sonora-2026"
    type: "literature"
    reference: "Kodak SONORA Process Free Plates Sustainability datasheet, 2026 retained edition, K-1020.26.07.13.EN.03; https://www.kodak.com/content/pdfs/print/KODAK-SONORA-Process-Free-Plates-Sustainability-datasheet-EN.pdf"
    used_for: "PDF1: absence of separate plate processor chemicals/rinse for the declared grade; manufacturer marketing comparison does not remove plate/coating/on-press burdens or prove the actual site's grade."
  - id: "cps-manufacturing-2018"
    type: "handbook"
    reference: "Thomson Reuters Core Publishing Solutions, Guide to Book Manufacturing, July 2018, bindery pp.8-3–8-6 and glossary11-20–11-21; https://cdn2.hubspot.net/hubfs/213379/docs/Compact-CPS-BMWGuide-July2018-Ed.pdf"
    used_for: "PDF53–56,94–95: separate case making, block binding and casing-in; through-fold sewing/cold glue and endpapers. Historical first-party process text only; no diagram/numeric reuse or proof of the actual site's configured route."
  - id: "mm-ventura"
    type: "literature"
    reference: "Müller Martini, Florjančič Tisk hardcover production case study, retained 2026 web edition; https://mullermartini.com/en/producttyp/hardcover-production/"
    used_for: "“Wide range of print runs”/printing-room paragraphs: sheetfed offset, folding, thread sewing and hardcover line coexist as real route options. Not proof of this reference-book job, exact glue/materials, factory configuration or amounts; digital foil/UV options are excluded."
  - id: "schmedt-board"
    type: "literature"
    reference: "Schmedt, Cardboard for bookbinding; https://www.schmedt.com/material/cardboard/"
    used_for: "Introductory physical construction: front/rear boards, spine and covering sheet form a hardcover; greyboard differs from cover material. No thickness, furnish or recycled-content default."
  - id: "schmedt-machine-thread"
    type: "literature"
    reference: "Schmedt, Product information – machine sewing thread, December 2015; https://www.schmedt.de/ww2000/pdf/e-pi_machine_sewing_threads.pdf"
    used_for: "PDF1: polyester versus cotton/mixed threads, spool/core and linear-density conventions; no example thread weight, coating, length factor or required SKU adopted."
  - id: "schmedt-adhesive-guide"
    type: "literature"
    reference: "Schmedt, Guide: Adhesives for bookbinding; https://www.schmedt.com/guides-tutorials/adhesive-glue-guide/"
    used_for: "“Dispersion glue”, “Backlining”, “Spine-binding”, machine case-making and casing-in sections: aqueous dispersion options, drying/pressing and application distinctions. PVAc grade and substrate suitability require actual supplier proof; not a universal recipe or quantity."
  - id: "heidelberg-powder-2010"
    type: "literature"
    reference: "Heidelberg News270, “Small Grains that Have a Big Effect”, 2010; https://www.heidelberg.com/global/media/en/global_media/company___publications/heidelberg_news/editorial/pdf_10/hn_270.pdf"
    used_for: "PDF/printed53: actual starch versus other/coated anti-setoff powders; product-specific powder survey only, no application rate, size distribution or emitted fraction imported."
  - id: "epa-method18-2025"
    type: "official_guidance"
    reference: "EPA Method18, Measurement of Gaseous Organic Compound Emissions by Gas Chromatography, 1 April2025 web copy; https://www.epa.gov/system/files/documents/2025-04/m-18-04012025_0.pdf"
    used_for: "PDF1–2, §§1,2,4: species calibration, humidity and volatility/polymerization limitations. Internet copy directs readers to the official regulation; matrix validation remains necessary and no measured emission is claimed."
  - id: "epa-gas-ap42"
    type: "official_guidance"
    reference: "EPA AP42 §1.4 Natural Gas Combustion, retained October2026 corrected copy; https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "PDF1–3, §§1.4.1–1.4.3: auxiliary combustion/fuel composition and equipment-dependent species only. No factor, efficiency, average heating value, sulphur content or complete oxidation assumed."
