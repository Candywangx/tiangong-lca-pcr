    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Use the native reference property for the selected electricity identity. Convert meter kWh with exactly 3.6 MJ/kWh and match voltage, grid, year and provider basis."
  - id: gas_volume
    applies_to: "natural_gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Reconcile meter and provider pressure, temperature, wet/dry composition and compressibility before use. The native secondary mass factor does not establish density, pure methane or standard-volume conditions."
  - id: heat_service
    applies_to: "purchased_heat"
    required_property_ref:
      name: "delivered thermal energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Determine useful imported heat from compatible supply/return enthalpy and flow; subtract returned carrier enthalpy. Do not equate water circulation with consumed water or add the same provider fuel."
