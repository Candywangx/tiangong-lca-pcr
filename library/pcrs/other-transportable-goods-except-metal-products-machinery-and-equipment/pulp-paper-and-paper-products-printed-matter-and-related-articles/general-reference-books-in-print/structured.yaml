product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.pulp-paper-and-paper-products-printed-matter-and-related-articles.general-reference-books-in-print"
  classification_refs: "CPC 3.0 32220; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "General-public printed dictionaries and encyclopedia volumes, including identified reference-title installments, only with the declared monochrome sheetfed/uncoated/sewn/paper-covered hardcase construction."
  excluded_products: "Contact directories; formal-study textbooks; specialized professional/technical/scholarly or children's titles; daily/non-daily newspapers and periodicals; advertising catalogues; electronic/audio publications; all alternative physical constructions and routes excluded in section 1."
  representative_product: "One edition/volume design of a complete sewn dictionary or encyclopedia with uncoated text/endpapers, printed paper wrap over greyboard, polyester thread, cotton mull, paper backliner and aqueous PVAc adhesives."
  production_route: "File/edition proof and imposition → process-free CTP → black wet sheetfed offset and absorption/oxidative setting → fold/gather/verify → thread sew/nip/glue-off/backline/dry → three-side trim; parallel cut board/print wrap/case make → case-in/press/joint set/dry → quality release → pack."
  market_state: "First-quality-released complete bound volume at manufacturing gate, net of dispatch packaging."
functional_unit:
  what: "Supply the declared general-public reference content in a complete printed dictionary or encyclopedia volume with the specified sewn hardcase construction."
  how_much: "1 kg net first-quality-released complete books of one declared edition/volume/design; report accepted copies, page count and measured mass distribution alongside mass."
  how_well: "Accepted correct edition, entry/index and page/signature completeness; readable fine text and guide words; declared opacity/show-through, gutter readability, sewing/endpaper/hinge integrity and design-specific opening/handling acceptance. No universal lifetime, lay-flat or pull-strength claim."
  how_long_or_cycle: "One declared manufacturing reporting period and its traceable new production lots at factory gate; reference-use lifetime is outside this mass-based dataset."
  reference_flow_link: "finished_reference"
system_boundary:
  rules:
    - rule_id: b_reference_identity
      applies_to: "applicability"
      rule: "Confirm general-public reference purpose and actual edition/volume independently from printed format. A reference-title installment retains its parent identity; contact-information collections and independent periodicals are excluded even with similar subject matter."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: b_sewn_case
      applies_to: "selected technology"
      rule: "Preserve intact folded signatures for through-fold sewing, with endpapers, nipping/glue-off/backlining and a separately formed two-board/spine-strip/paper-wrap case followed by casing-in. No spine milling, adhesive-only paperback substitution or inferred universal lookup lifetime."
      source_ids:
        - cps-manufacturing-2018
        - mm-ventura
        - schmedt-board
    - rule_id: b_full_gate
      applies_to: "all datasets"
      rule: "Include proof/imposition/CTP, text and wrap make-ready/printing/setting, folding/gathering/sewing, separate case making, drying/pressing/trimming, release, packing, cleaning and attributable compressor/cooling/extraction/standby. Keep stages and parallel case/block stocks distinguishable inside the aggregate process."
      source_ids:
        - epa-eiip-2002
        - cps-manufacturing-2018
    - rule_id: b_upstream_once
      applies_to: "supplied exchanges"
      rule: "Include each actual supplier's raw materials, production and delivery once. Paper/board mill pulp recovery, fuel, water and treatment remain in their compatible suppliers. Inks, glues and concentrates use complete supplied preparations; no additional duplicate resin, solvent, pigment or carrier-water production."
      source_ids:
        - epa-ctg-2006
        - schmedt-adhesive-guide
    - rule_id: b_process_free
      applies_to: "plate route"
      rule: "Exclude a separate developer/rinse processor only when the finished process-free plate and on-press development are demonstrated. Include plate manufacture/coating, imaging, startup paper/ink/water use, coating destination and plate waste; manufacturer avoidance claims are not zero burden for all prepress."
      source_ids:
        - kodak-sonora-2026
    - rule_id: b_outdoor_boundary
      applies_to: "waste and emissions"
      rule: "Record actual outdoor residual emissions after capture, separately from indoor exposure, collected dust and liquid/cloth waste. Conventional ink absorption/oxidation is not heatset drying; auxiliary gas, imported heat and electric glue drying are separately metered services. Actual extra species/consumables require their own specific exchanges before completeness."
      source_ids:
        - epa-ctg-2006
        - epa-method18-2025
        - epa-gas-ap42
boundary_abstraction:
  declared_starting_condition: "Purchased dry unprinted paper/greyboard/backliner/mull/thread, complete process-free plates and supplied formulations received at the manufacturing site; neither a preprinted book block nor a finished purchased case is this starting gate."
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "CPC 3.0 32220 general-public reference books only; selected dictionary/encyclopedia sewn hardcase subset, not the complete leaf."
  recursive_input_rule: "An incoming already printed or bound same-category volume is a separately traced rework/resale transfer, not blank paper. Preserve its prior burden once and do not count it as newly produced reference output."
  upstream_dataset_requirement: "Actual production/delivery of each paper/board/textile/plate/formulation/utility/packaging input and actual outgoing waste treatment, with compatible grade, state, quantity, geography, time and ownership."
  disclosure: "Actual equipment and complete jobs; reporting period; outsourcing and all internal transfers; included/excluded stages; full utility/maintenance/packaging survey; physical and burden ledgers; providers, unresolved identities, sampling/uncertainty and incomplete evidence. Downstream distribution, reference use and book end-of-life are excluded."
