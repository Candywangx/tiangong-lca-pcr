allocation_rules:
  - rule_id: a_single_product
    applies_to: "selected output"
    rule: "The normal unit has one complete globe output and characterized outgoing wastes. First assign process/stage meters to the actual model/configuration; use observed causal resource drivers for shared energy/cleaning and disclose residual shared burdens. A measured complete-component input is not decomposed and charged again through its constituent backgrounds."
    source_ids: []
  - rule_id: a_physical_ledger
    applies_to: "allocation"
    rule: "Allocate environmental loads only after retaining full physical stocks, component/output masses and matching internal transfers. Never multiply actual globe/stand/waste physical output by a burden share. If a genuine saleable co-product arises, prefer subdivision; a residual allocation needs its actual basis, study-program justification and sensitivity before the dataset is complete."
    source_ids: []
  - rule_id: a_waste
    applies_to: "waste handling"
    rule: "Retain gross exported waste and actual recipient/treatment. Internal usable paper rework does not earn an avoided-production credit. Offsite treatment and recycling follow the declared study method in a separate load account; never silently net waste against purchased paper or grant a default substitution/flight-case reuse credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "p_globe_assembly"
      flow_role: "accepted output and net reference mass"
      record_type: "foreground_record"
      raw_fields: "lot; configuration; globe id; diameter; cartography edition; shell/stand components; accepted net mass; moisture/cure; packing tare"
      collection_method: "Weigh accepted complete globes with stands on calibrated scales before case packing; reconcile acceptance list, removed samples, separately weighed accompanying case/packaging tare and the same configuration. Record shipped packaging and packing stock independently of the net globe denominator. Sum actual accepted net mass; no assumed per-globe weight. Aggregation procedure: sum accepted net mass; finished_globe = 1 kg per 1 kg reference flow"
      unit: "kg"
      frequency: "each lot/stage; meters over the declared period"
      temporal_coverage: "complete declared period, including start-up, scrap, drying and rework"
      site_scope: "one factory and consistent model/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, invoices/BOM/SDS, QC, stage logs, transfer notes, uncertainty and gap register"
    - protocol_id: cp_materials
      process_id: "p_globe_assembly"
      flow_role: "supplied component and formulation exchanges"
      record_type: "foreground_record"
      raw_fields: "lot; row_id; supplier; grade; formulation/CAS; wet/dry mass; stocks; stage; retained constituents; provider"
      collection_method: "Weigh receipts, use/returns and stocks by one formulation/component at a time; retain BOM/SDS and actual constituents. Record whether each prepared component is externally delivered or a measured internal handoff linked to its required preparation process. Screen actual attributable brushes, rags, abrasive/filter material, maintenance oils/greases and replacement consumables from issue/service/return records; document supported absence or add individually identified actual inputs and spent streams before completeness. No per-globe consumption default. Duplicate rows for distinct colours/grades. Record stage transfers with identical outgoing/incoming mass. Aggregation procedure: retain each raw attributable whole-period exchange total in its native unit; calc_batch_mass divides once by the matched accepted net mass. Include failed and reworked model activity, not just accepted lots."
      unit: "kg"
      frequency: "each lot/stage; meters over the declared period"
      temporal_coverage: "complete declared period, including start-up, scrap, drying and rework"
      site_scope: "one factory and consistent model/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, invoices/BOM/SDS, QC, stage logs, transfer notes, uncertainty and gap register"
    - protocol_id: cp_energy
      process_id: "p_globe_assembly"
      flow_role: "purchased electricity and electric drying"
      record_type: "foreground_record"
      raw_fields: "meter; voltage; region/period; stage; kWh; active time; shared-meter driver; provider"
      collection_method: "Meter electric operations and attributable drying/ventilation; use logged actual operating drivers for shared meters. Preserve below1kV supply and provider basis. No drying duration, load or intensity default. Aggregation procedure: retain each raw attributable whole-period exchange total in its native unit; calc_batch_mass divides once by the matched accepted net mass. Include failed and reworked model activity, not just accepted lots."
      unit: "kWh; MJ"
      frequency: "each lot/stage; meters over the declared period"
      temporal_coverage: "complete declared period, including start-up, scrap, drying and rework"
      site_scope: "one factory and consistent model/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, invoices/BOM/SDS, QC, stage logs, transfer notes, uncertainty and gap register"
    - protocol_id: cp_water
      process_id: "p_globe_assembly"
      flow_role: "added water, effluent and evaporation"
      record_type: "foreground_record"
      raw_fields: "water meter/mass; density/temperature; formulation water; moist stocks; retained water; effluent mass/composition; evaporation; uncertainty"
      collection_method: "Meter separately added treated water; weigh/measure outgoing washwater and characterize solids/dissolved constituents. Reconcile product moisture, formulation carriers and stock changes; net outdoor evaporation requires matching inlet/outlet humidity correction, leakage/path checks and uncertainty; an unexplained balance residual is not automatically a water-vapour exchange. Keep whole wet effluent and H2O/contaminants as subledgers without duplicate external water/waste exports. Aggregation procedure: retain each raw attributable whole-period exchange total in its native unit; calc_batch_mass divides once by the matched accepted net mass. Include failed and reworked model activity, not just accepted lots."
      unit: "kg; source volume with measured conversion"
      frequency: "each lot/stage; meters over the declared period"
      temporal_coverage: "complete declared period, including start-up, scrap, drying and rework"
      site_scope: "one factory and consistent model/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, invoices/BOM/SDS, QC, stage logs, transfer notes, uncertainty and gap register"
    - protocol_id: cp_waste
      process_id: "p_globe_assembly"
      flow_role: "individual outgoing waste streams"
      record_type: "foreground_record"
      raw_fields: "row_id; wet/dry mass; composition; contamination; internal reuse; collector stock; transfer note; recipient; acceptance/treatment"
      collection_method: "Weigh each segregated external stream and record actual receiving conditions. Separate bare shell rejection, uncontaminated printed-paper scrap, collected dust, chemicals and cloth; new composite rejects require additional characterized rows. Aggregation procedure: retain each raw attributable whole-period exchange total in its native unit; calc_batch_mass divides once by the matched accepted net mass. Include failed and reworked model activity, not just accepted lots."
      unit: "kg"
      frequency: "each lot/stage; meters over the declared period"
      temporal_coverage: "complete declared period, including start-up, scrap, drying and rework"
      site_scope: "one factory and consistent model/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, invoices/BOM/SDS, QC, stage logs, transfer notes, uncertainty and gap register"
    - protocol_id: cp_emissions
      process_id: "p_globe_assembly"
      flow_role: "outdoor constituent and particle releases"
      record_type: "foreground_record"
      raw_fields: "species/CAS; source formulation; source flow/time; background correction; capture; stocks/retention/wastes; calibration; particle cuts; medium; uncertainty"
      collection_method: "Use qualified species-specific sampling/analysis or a closed constituent balance for actual outdoor release. Record compound-specific response and outlet flow/time; PM needs size-matched sampling and after-control fate. Survey every actual formula; measured absence, detection limits and uncharacterized remainder stay distinct. Aggregation procedure: retain each raw attributable whole-period exchange total in its native unit; calc_batch_mass divides once by the matched accepted net mass. Include failed and reworked model activity, not just accepted lots."
      unit: "kg"
      frequency: "each lot/stage; meters over the declared period"
      temporal_coverage: "complete declared period, including start-up, scrap, drying and rework"
      site_scope: "one factory and consistent model/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, invoices/BOM/SDS, QC, stage logs, transfer notes, uncertainty and gap register"
  calculation_rules:
    - id: calc_batch_mass
      applies_to: "all inventory rows"
      rule: "For each row divide the attributable reporting-period exchange, in its recorded numerator unit, by the same reporting-period accepted complete globe/stand net mass in kg. Keep stock corrections and rejected production attributable; no per-item normalization or assumed item mass. Use one complete matched reporting-period pool for the same product, grade, route, site and reference state, including all attributable startup/shutdown, wholly failed or zero-output batches, rejects, work in progress and rework. Sum raw numerator totals before dividing once by the strictly positive accepted net output; count reworked product once only at final acceptance. Never average batch ratios or omit failed activity. A pool with no accepted output retains its absolute unnormalized inventory and requires review."
      inputs:
        - "traceable row records"
        - "cp_output accepted net mass"
      output: "recorded-unit amount per 1 kg reference flow"
      source_ids: []
    - id: calc_kwh
      applies_to: "electricity"
      rule: "1 kWh = 3.6 MJ; normalize actual attributed MJ using calc_batch_mass."
      inputs:
        - cp_energy
        - cp_output
      output: "MJ/kg"
      source_ids: []
    - id: calc_constituent_balance
      applies_to: "individual water or solvent species"
      rule: "Species receipts plus beginning stock equal product retention, outgoing waste/treatment transfer, ending stock and net outdoor release. Account for control-device fate and measured humidity where relevant; measure and disclose residual uncertainty. Do not use regulatory printing retention percentages."
      inputs:
        - cp_materials
        - cp_water
        - cp_waste
        - cp_emissions
      output: "species kg before common output normalization"
      source_ids:
        - epa-eiip-2002
  data_quality_requirements:
    - id: dq_scope
      applies_to: "configuration and period"
      requirement: "Maintain declared physical subset, actual component handoff, stage observations and complete rejected/start-up production for the same period. Do not claim industry representativeness from one maker."
      evidence: "BOM, supplier and stage records; QC"
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Atomic actual exchanges and actual grade/CAS/medium/property/provider basis are required. Unknown UUID/provider/formula is a gap, never zero or a proxy."
      evidence: "supplier definitions, composition and amount records"
    - id: dq_uncertainty
      applies_to: "measurement and allocation"
      requirement: "Retain calibration, sampling/detection limits, stocks, allocation drivers, uncertainty/residuals, and separate measured absence from missing data. No generic tolerances or emission defaults."
      evidence: "meter/test reports and gap register"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference output"
    rule: "Require one final finished_globe output, the adopted broad finished-product identity plus all physical qualifiers and exactly 1 kg normalized net complete globe with its stand. Weigh after acceptance at recorded moisture/cure condition, excluding case packaging. Preserve cartographic resolution/edition, diameter and declared display quality; mass alone is not functional equivalence."
    source_ids:
      - unsd-cpc3-2025
  - rule_id: v_material_balance
    applies_to: "physical stocks and losses"
    rule: "Reconcile beginning stocks plus receipts/transfers with net accepted complete globes, separately shipped case/packaging, external unused-material returns, exported wastes/emissions and ending stocks using actual composition/moisture. Retained paper/ink/glue/paint/finish/stand constituents are already inside complete product mass; constituent subledgers never add them again as outputs. Packaging receipts plus opening stock reconcile separately to shipped tare, scraps/returns and closing stock, all outside the net-globe denominator. Use receipts and stock movements consistently, not stock-adjusted consumption plus the same stocks twice. Keep measured/supplier-supported dry/wet, H2O and biogenic/fossil carbon fractions and sources for each actual material, formulation, stand and packing; unknown fractions remain unresolved. Reject unexplained residuals rather than force a yield or insert a hidden adjustment. Track paper tears, shell rejection and mounting/finishing rework separately."
    source_ids:
      - bellerby-globe-route
  - rule_id: v_water_solvents
    applies_to: "constituents and boundary"
    rule: "Reconcile added water and formulation carriers with product retention, stocks, aqueous effluent, chemical/cloth wastes and outdoor vapour. Species air mass requires a defensible material balance or calibrated compound-specific monitoring; include capture and actual exit routes. Aggregate TVOC/carbon response is QA evidence, never a second sum alongside species or an identity for an unknown remainder. Actual formula/measurement may require additional atomic input/waste/elementary rows; missing constituents are incomplete coverage."
    source_ids:
      - epa-eiip-2002
  - rule_id: v_particle_bins
    applies_to: "paper cutting"
    rule: "Review actual cutting equipment, dust collection and outdoor pathway; record disjoint PM2.5, PM2.5–10 and PM>10 only on matching measured size and filterable/condensable definitions. Collected dust is measured separately. Cumulative PM10 or total PM is a check, not an additional mass; there is no default cutting emission factor."
    source_ids:
      - jrc-paper-bref-2015
  - rule_id: v_provider_completeness
    applies_to: "all exchange identities"
    rule: "Verify actual grade, formulation, supplier route, direct-read reference property/unit and medium. Blank UUID does not mean zero; do not insert generic proxies to claim complete provider coverage. Require all declared component manufacturing and delivery backgrounds, actual waste acceptance and complete stage observations. For the cited integrated maker or any same-site preparation, require quantified linked sphere-preparation, cartography/printing and wood/metal stand-making units with actual atomic inventories and conserved handoffs; a purchase label or a promise to extend later does not establish these units. This assembly dataset alone cannot pass complete-maker LCI acceptance without them. Conditional measured absence must have evidence; unknown is pending."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site/configuration-specific foreground assembly dataset for complete rigid paper-gore globes"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared globe-component supply-chain modelling and lifecyclemodel assembly after physical applicability, provider and quality checks; method review remains required"
  excluded_use: "Automatic coverage of all CPC32510; book/flat-map/inflatable/plastic-print/electronic/celestial routes; lifetime comparisons from kg alone; claims of complete data with unresolved actual providers"
  required_metadata: "All reference qualifiers; starting handoff; geography/period; component and formulation providers; actual mass/energy/medium and normalization; waste recipient and study assumptions"
  required_quality_disclosure: "Identity and composition gaps; missing/not-applicable observations; calibration, uncertainty, proxies, allocation and completeness; author candidate status does not establish approved methodology"
  update_trigger: "Changed sphere/stand/printing/material recipe, supplier, drying/finish route, energy supply, geography/period, cartography/quality or waste receiving conditions"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 Explanatory Notes,30June2025, PDF/printed p151,3251/32510; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Non-book form classification, including globes; no method or full-scope mapping proof"
  - id: "bellerby-globe-route"
    type: "handbook"
    reference: "Bellerby & Co How They Are Made, dated publisher snapshot2026-10-12; https://bellerbyandco.com/how-theyre-made/"
    used_for: "Actual sphere/gores/wet mounting/brush watercolour/finish/base/packing stage structure. Maker example, not universal quantities, recipe or evidence of purchased sourcing."
  - id: "bellerby-globe-faq"
    type: "handbook"
    reference: "Bellerby & Co Globemakers FAQ, dated publisher snapshot2026-10-12, Mini Desk Globe/Albion, packing and care paragraphs; https://blog.bellerbyandco.com/faq/"
    used_for: "Real wooden/metal bearing stand variants, case and coated-paper product state; no fixed size, component count, service lifetime or packaging recipe"
  - id: "bellerby-maker-interview"
    type: "literature"
    reference: "Merchant & Makers, Interview with Peter Bellerby: No Ordinary Orb, dated retrieved snapshot2026-10-12, globe-making challenges question; https://www.merchantandmakers.com/bellerby-and-co-globemakers/"
    used_for: "Primary maker statement confirming wet paper gore attachment with glue; historical case without adhesive chemistry or recipe"
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Production of Pulp, Paper and Board BREF2015,7.1.4 printed665/PDF703 and7.1.10 printed670/PDF708; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Actual upstream papermill broke/water-loop and finishing/cutting dust coverage. Qualitative cutting hazard prompts site review; mill percentages/energy/moisture are not globe defaults."
  - id: "epa-eiip-2002"
    type: "official_guidance"
    reference: "US EPA EIIP VolumeII Chapter15, May2002,4.1/4.1.1/4.1.3 printed15.4-1–15.4-3,PDF31–33; https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "Printing/graphic-arts volatile material balance and route-specific retention/capture limits; informs actual printing provider and species survey. No lithography factors transferred to globe finishing."
