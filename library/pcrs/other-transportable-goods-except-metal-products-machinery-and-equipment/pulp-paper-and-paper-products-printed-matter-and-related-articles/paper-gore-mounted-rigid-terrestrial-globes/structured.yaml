system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "physical applicability"
      rule: "Require a rigid non-illuminated terrestrial globe covered by printed paper gores, brush watercolour and a protective varnish, delivered complete with a wooden bearing stand. The adopted shape has genuine wet mounting and support/finish operations. Exclude flat/folded/wall maps, book-form atlases, printed-only sheets, inflatable globes, directly printed plastic shells, illuminated/electronic globes and non-terrestrial/toy variants. Map content, publication frequency or subject is not a new methodology boundary."
      source_ids:
        - unsd-cpc3-2025
        - bellerby-globe-route
        - bellerby-globe-faq
    - rule_id: b_foreground
      applies_to: "selected component handoff"
      rule: "Include component receipt/QC, paper-gore cutting, initial watercolour wash/drying, paper wetting, adhesive mounting/stretching, additional brush colouring, varnishing/drying, complete stand fitting, final QC and case packing, plus attributable electricity, water, cleaning, waste and boundary emissions. Baseline drying is ambient or electric; direct fuel combustion, purchased heat/steam, spray finishing, shell sanding/casting and base fabrication are outside this prepared-component route and require an explicit assessed extension when actually present."
      source_ids:
        - bellerby-globe-route
        - bellerby-maker-interview
    - rule_id: b_upstream
      applies_to: "all purchased components"
      rule: "Require complete actual backgrounds for shell fabrication, pulp/papermaking and actual printing of supplied gore sheets, mounting glue/paint/varnish formulation, complete stand and fitted case manufacture, utility supply and delivery. Paper supplier coverage includes applicable stock preparation, paper formation/drying/finishing, broke circuits, fuel/heat and effluent treatment. Use pulp/paper evidence for those steps, never sawmill/plywood recipes. Separate pre-existing ink/coatings in supplied parts from foreground additions. No component may be treated as burden-free because its UUID is unavailable."
      source_ids:
        - jrc-paper-bref-2015
        - epa-eiip-2002
        - bellerby-globe-route
    - rule_id: b_handoff_truth
      applies_to: "reporting-site operations"
      rule: "Prepared-component receipt is a declared modelling handoff, not evidence that the cited maker buys spheres, printing or stands. If those steps occur at the reporting site, collect them as additional foreground units and replace the matching supplied-component background. Preserve actual paper/ink/plate and sphere/base material exchanges atomically; do not omit in-house work or count it twice."
      source_ids:
        - bellerby-globe-route
    - rule_id: b_physical_links
      applies_to: "stage and environmental ledgers"
      rule: "Maintain one aggregated assembly unit with independent stage measurements. The same paper, shell and mounted globe cross adjacent stage ledgers at identical physical quantities and moisture/composition, including retained ink/glue/paint/varnish. Internal transfers/rework are circulation, not additional final outputs. Preserve unallocated material/water/carbon balances separately from the environmental burden allocation ledger."
      source_ids: []
    - rule_id: b_releases
      applies_to: "factory and nature boundary"
      rule: "Record outdoor post-collection/abatement species release, collected dust, segregated spent chemicals, contaminated cloth and aqueous washwater to treatment as distinct exchanges. Indoor exposure is not an outdoor LCI emission. Biogenic/fossil carbon retained in paper/ink/glue/finish is not emitted carbon; keep actual biogenic CO2 in upstream/waste-treatment LCI even when a reporting metric treats it differently. Do not assume zero VOC from a watercolour or water-based label."
      source_ids:
        - epa-eiip-2002
        - jrc-paper-bref-2015
boundary_abstraction:
  declared_starting_condition: "Prepared rigid globe sphere, uncut printed paper gore sheets, complete wooden bearing stand, glue/paint/varnish and fitted flight case at the assembly handoff: verified external delivery or measured transfer from required linked preparation processes"
  starting_condition_role: "Explicit prepared-component foreground handoff with actual upstream component manufacture/printing linked once"
  product_classification_scope: "Narrower rigid paper-gore terrestrial-globe subset of CPC3.0:32510, excluding all book form"
  recursive_input_rule: "Internal rework returns are physical circulation. Purchased previously completed globes require their actual prior production/background and restoration route assessment; never recurse through the finished-globe output or treat them as raw bare shells."
  upstream_dataset_requirement: "Actual amount-compatible shell, papermaking/printing, formulations, stand, case, utility and delivery providers; replacement rather than duplicate coverage if stages are brought into foreground"
  disclosure: "Factory stages and suppliers; exclusions/extensions; provider geography/time; material/stock/emission gaps; primary/reference units; transport and downstream study assumptions"
