  semantic_boundary_decision: "Rigid sphere plus wet paper-gore mounting, brush watercolour and protective finishing and wooden bearing stand assembly; CPC32510 is mixed in physical forms, so the mapping covers only this narrower subset. Book-form atlases, planar maps and other globe routes are excluded. New semantic identity retains the old mixed-leaf scaffold untouched. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  adjacent_method_assessment: "Read current adjacent authored Markdown scope/product identity for sheetfed-offset-eva-perfect-bound-paperback-books (32210), coldset-web-offset-newspapers (32300), and heatset-web-offset-saddle-stitched-magazines (32410). Book/glued, coldset cut-fold newspaper and heatset stitched structures share paper/printing accounting but none covers rigid spherical wet paper-gore mounting, brush finish and complete globe/stand. These in-progress author drafts have not received this task independent methodology approval."
  reference_identity:
    flow_uuid: "ffbb7718-2cb6-4962-8dd4-93ef71ac9e0c"
    scope: "Broad finished non-book maps/charts record explicitly includes globes; no contradictory material or manufacturing-route restriction. Used only with this PCR rigid mounted-paper terrestrial-globe qualifiers."
    localized_name_note: "Official Chinese baseName is retained verbatim, including its broad atlas and planar-sphere wording; the PCR physical qualifiers control actual scope."
    quantity_background_compatibility: "Mass/kg identity is verified; actual net complete globe mass, configuration and provider coverage must be collected, not inferred from the UUID."
  unresolved_flow_rows:
    - "sphere_shell"
    - "globe_stand"
    - "clean_cloth"
    - "flight_case"
    - "waste_adhesive"
    - "waste_watercolour"
    - "waste_varnish"
  unresolved_identity_details:
    sphere_shell: "No exact compatible prepared rigid globe sphere flow established by bounded search. Require actual substrate/resin/filler, geometry, cure state, coatings, mass and supplier. Sources establish a rigid spherical support, not a universal hollow/two-hemisphere construction; no hollow or joined-hemisphere default is required."
    globe_stand: "No candidate established compatible complete physical identity for this row after successful bounded search. One complete supplied wooden stand including its actual bearing supports, finish and fasteners. Record species, material masses, finishes and supplier fabrication. It is not bare timber, furniture in general or a set of amusement-equipment modules; do not add components already included in a complete stand background."
    clean_cloth: "No candidate established compatible complete physical identity for this row after successful bounded search. Conditional fresh cotton cloth used for wiping tools. Record fibre, grade, dry mass, reuse cycles and cleaning route. The otherwise cotton-named record is hard-qualified as water treatment chemical and is rejected for this role."
    flight_case: "No candidate established compatible complete physical identity for this row after successful bounded search. One complete supplied fitted flight case including the actual lining and cushioning. Obtain material/BOM, gross and tare mass, supplier fabrication and delivery. A plane, generic glass product, wooden crate or standalone foam is not this case. Case manufacture is background; case mass is excluded from reference globe mass."
    waste_adhesive: "No candidate established compatible complete physical identity for this row after successful bounded search. One segregated spent glue formulation; collect wet mass, carrier/solid/species fractions, stock change and actual recipient. Do not merge tool-wash water or contaminated cloth into this row, or treat unused returned stock as waste."
    waste_watercolour: "No candidate established compatible complete physical identity for this row after successful bounded search. One segregated spent watercolour formulation; collect wet mass, carrier/solid/species fractions, stock change and actual recipient. Do not merge tool-wash water or contaminated cloth into this row, or treat unused returned stock as waste."
    waste_varnish: "No candidate established compatible complete physical identity for this row after successful bounded search. One segregated spent varnish formulation; collect wet mass, carrier/solid/species fractions, stock change and actual recipient. Do not merge tool-wash water or contaminated cloth into this row, or treat unused returned stock as waste."
  provider_basis_debts:
    - "Every actual supplied shell, printed paper, glue, paint, finish, stand, utility, case and outgoing waste needs a compatible provider and documented physical/reference basis. Identity search does not produce a complete dataset."
    - "The declared prepared-component start is an explicit foreground handoff. Producer sources describe in-house sphere/printing/base steps and do not demonstrate purchased sourcing. Any earlier steps at the reporting factory require foreground expansion rather than omission or duplicate upstream burdens."
    - "Unknown shell chemistry, adhesive solids/binder, paint colour formulations and clear-finish solvents/cure remain actual-data collection requirements; no producer recipe is invented."
    - "Conditional ethanol/isopropanol/acetone rows do not demonstrate their use or positive releases at the producer. Every other actual species needs an additional atomic measured row; unresolved organic remainder is an incompleteness finding."
    - "Selected elementary flows use outdoor-air unspecified. Record actual outdoor subcompartment and choose a matching verified flow when a more specific route is known; never substitute indoor exposure, long-term air or liquid discharge."
  rejected_identity_constraints:
    - "Cotton fabric f8292a12 has water-treatment-chemical route; not adopted for wiping cloth."
    - "Acrylic varnish56a0ef1c specifies water-free87.5% solution and is not generic protective globe varnish; architectural water-based paint47411f13 does not establish artist watercolour."
    - "Hong-Kong volume-reference tapwater3a8411b6 is not the selected generic Mass-reference treated-water record; its secondary1000kg/m3 screening conversion is not a field density."
    - "Plastic Printed Matter e1380a96 is not printed paper. Glass beads/optical sphere segments/helmet shells are not globe spheres; flightcase searches returned aircraft identities, not packing cases."
    - "Paper-mill or manganese-slag wastewater, sludge, waste solvent and kiln dust do not replace this factory specific washwater, contaminated cloth or cutting dust."
  quantity_policy: "No default sphere mass, paper moisture, material recipe, yield/loss, drying energy, retention/emission factor, reuse count or lifetime. Reference normalization and traceable unit conversions alone are fixed."
  controller_review:
    scope: "Independent full bilingual, actual-original-source and native UUID/property/unit review with bounded four-file repair"
    scientific_approval: false
    mapping_accepted: false
    assembly_boundary_decision: "Separable wet paper-mounting, watercolour/finish and whole stand-fitting unit is methodologically distinct; complete source-maker LCI additionally requires quantified linked sphere preparation, cartography/printing and wood/metal stand fabrication with actual inventories and conserved same-site handoffs. No fictitious purchases, omitted in-house stages or later-extension promises establish completeness."
    source_method_limits: "Producer proves watercolour, resin/varnish finish and drying, not exact varnish brush method, formula, cure chemistry or drying energy. Actual selected application and drying route must be confirmed before use."
    electricity_geography_debt: "50657322 raw CN supply and <1kV consumption/grid-average route retained. Actual site/country/year/provider, voltage and loss boundary must be compatible before background linkage; maker London location does not establish CN electricity supply."
