system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "plate_making"
      rule: "Collect only the declared positive thermal aqueous-developed plate-shop route. Retain measured imaging/development/rinse/gum/drying stages and all actual auxiliaries. Upstream alloy/surface/coating manufacture is not silently omitted or repeated in the shop."
      source_ids:
        - eu-sts-image-carrier-2007
        - fuji-lh-ple-2019
    - rule_id: boundary_liquid_fate
      applies_to: "wastewater; elementary releases"
      rule: "Declare actual off-site treatment versus site treatment/direct outfall. A liquid transferred to a treatment receiver is a waste exchange, not a site elementary emission. A site release reports carrier water and species at the same real outfall after treatment where present; do not duplicate the discharged liquid as an off-site waste."
      source_ids:
        - epa-metals-2007-1994
    - rule_id: boundary_recursion
      applies_to: "reference_plate; plate_blank"
      rule: "Record a purchased coated blank at its actual unexposed state, with upstream coverage. A reused finished plate belongs to a regeneration/service boundary rather than recursively passing through this manufacture as new material. Stop unsupported upstream links and disclose the missing provider coverage."
      source_ids:
        - eu-sts-image-carrier-2007
    - rule_id: boundary_completeness
      applies_to: "all inventory rows"
      rule: "No default cutoff may hide coating chemicals, small-mass toxic species or solvents. Include actual inbound transport through verified supplier/transport coverage and document cutoffs and infrastructure treatment. Keep upstream printing-paper manufacture and downstream printing/service use distinct from platemaking."
      source_ids: []
