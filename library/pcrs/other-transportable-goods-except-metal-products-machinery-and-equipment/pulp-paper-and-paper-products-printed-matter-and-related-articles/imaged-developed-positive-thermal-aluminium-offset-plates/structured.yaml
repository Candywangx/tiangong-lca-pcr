    required_property_ref:
      name: "Mass; Volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Elemental analysis uses mass as element; COD uses oxygen-demand mass; liquid discharge uses m3; vapour uses kg to air. Media and species/constituent masses are not interchangeable."
