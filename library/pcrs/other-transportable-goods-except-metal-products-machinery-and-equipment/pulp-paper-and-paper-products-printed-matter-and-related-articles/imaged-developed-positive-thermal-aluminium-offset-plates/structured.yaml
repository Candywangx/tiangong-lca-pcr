measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference is 1 kg accepted complete net plate mass; calibrated cp_mass weighing excludes packaging/clamps/free water and includes substrate plus retained coating/protective layer and its residual water at the declared delivery condition. Preserve dry solids and residual-water subaccounts; do not convert the whole output to dry aluminium."
  - id: campaign_basis
    applies_to: "common accepted-reference denominator only"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Per 1 kg reference flow; divide attributable campaign exchanges by the same-grade accepted complete net plate kg. Item count, image count and plate area are not kg; measured same-grade count/area/mass conversions are traceable diagnostics. Preserve each raw numerator native property/unit: electricity MJ and freshwater-carrier m3 are not Mass/kg quantities."
  - id: solution_basis
    applies_to: "developer; replenisher; gum; water; wastewater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve complete wet solution mass and temperature/density/composition; separate as-supplied replenisher, dilution water and recirculation without assumed concentration/density."
