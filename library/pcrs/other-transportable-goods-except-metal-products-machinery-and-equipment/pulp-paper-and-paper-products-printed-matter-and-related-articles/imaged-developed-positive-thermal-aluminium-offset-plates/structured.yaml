allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared operations"
    rule: "First use stage meters, bath throughput and job records to separate attributable burdens. For inseparable baths/shared electricity, collect causally relevant processed area, operating/idle time and grade; document the chosen driver and shares. Do not impose a universal mass or price allocation factor."
    source_ids: []
  - rule_id: allocation_physical_ledger
    applies_to: "reference_plate; reject_plate; recovered material"
    rule: "Allocate environmental burdens only after preserving the complete physical ledger. Keep accepted/reject/recovered-stream masses intact; never multiply a co-product physical output by its burden share. Document whether scrap is waste or an actual saleable co-product, receiver route and chosen recycling convention. No automatic avoided-virgin-aluminium credit or 100% recovery yield."
    source_ids: []
  - rule_id: allocation_service_life
    applies_to: "reference_plate; downstream print job"
    rule: "Manufacturing output remains complete plate kg. A downstream print job may distribute the linked manufacture burden using documented compatible service, actual accepted impressions or qualified area and plate replacements. Keep whole-plate physical mass, recovered-carrier mass, regeneration mass loss and service allocation in separate accounts. Never reduce physical kg by impression count or count recycled aluminium as the same reused imaged plate. Manufacturer maximum run claims do not establish actual life."
    source_ids:
      - fuji-lh-ple-2019
      - eu-sts-image-carrier-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "plate_making"
      flow_role: "linked atomic exchanges"
      record_type: "acceptance/weighing"
      raw_fields: "campaign; grade; alloy; coating; gauge; plate count; area; complete net kg; retained coating/gum solids and water; drying/conditioning time, temperature and humidity; rejected kg"
      collection_method: "Calibrated net weighing of complete accepted plates after declared drying, with same-grade acceptance records; exclude packaging/free water/clamps. Aggregation: accepted net plate mass; all records normalized per 1 kg reference flow"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "representative campaign including startup, idle and rejects"
      site_scope: "declared plate shop/grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; grade traceability; area/count cross-check"
    - protocol_id: cp_material
      process_id: "plate_making"
      flow_role: "linked atomic exchanges"
      record_type: "stock/receipt/dosing"
      raw_fields: "material grade; provider; current SDS; wet kg; density; solids; all constituent/CAS and solvent/water fractions; packaging inclusion/tare; opening/closing stocks; returns; maintenance consumables; stage"
      collection_method: "Reconcile receipts, calibrated dosing/weights, formulation basis and stocks; record supplier upstream manufacture and delivered reference quantity. Aggregation: retain raw attributable campaign totals in each exchange native unit; normalize_campaign performs the sole output-mass division."
      unit: "kg"
      frequency: "lot and campaign"
      temporal_coverage: "same campaign as cp_mass"
      site_scope: "declared shop and supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receipts; meter calibration; current composition and provider chain"
    - protocol_id: cp_energy
      process_id: "plate_making"
      flow_role: "linked atomic exchanges"
      record_type: "meter"
      raw_fields: "stage kWh; startup/idle; supplier; voltage and supply region; property/unit basis; transformer loss; ventilation/cooling/maintenance; drying heat and condensate; shared-operation driver"
      collection_method: "Read calibrated supply/stage meters; keep supply voltage and boundaries compatible with the background link. Preserve electrical energy despite database NCV label. Aggregation: retain raw attributable campaign totals in each exchange native unit; normalize_campaign performs the sole output-mass division."
      unit: "kWh; MJ"
      frequency: "stage and campaign"
      temporal_coverage: "same campaign as cp_mass"
      site_scope: "actual supply intake and shop stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; supply contract; driver and loss reconciliation"
    - protocol_id: cp_water
      process_id: "plate_making"
      flow_role: "linked atomic exchanges"
      record_type: "water/moisture balance"
      raw_fields: "stage fresh water; density; bath stocks; solution water; plate moisture; wet wastes; inlet/outlet air humidity and dry-air flow; condensate; evaporated water; recirculation"
      collection_method: "Meter new supply and reconcile solution/stock/moisture/destination records; internal recirculation is not fresh input. Evaporation needs measured or independently supported water balance. Aggregation: retain raw attributable campaign totals in each exchange native unit; normalize_campaign performs the sole output-mass division."
      unit: "kg; m3"
      frequency: "stage and campaign"
      temporal_coverage: "same campaign as cp_mass"
      site_scope: "actual shop liquid system"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; density/temperature; moisture and closure uncertainty"
    - protocol_id: cp_waste
      process_id: "plate_making"
      flow_role: "linked atomic exchanges"
      record_type: "weighing/transfer"
      raw_fields: "stream ID; shipment packaging/returns; wet kg; moisture/solids; coating; metal/solvent content; waste/co-product decision; receiver; recovery yield"
      collection_method: "Weigh segregated streams and reconcile transfer records, contamination and receiver acceptance; record physical output before burden allocation. Aggregation: retain raw attributable campaign totals in each exchange native unit; normalize_campaign performs the sole output-mass division."
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "same campaign as cp_mass"
      site_scope: "shop gate and verified receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; composition; receiver/treatment evidence"
    - protocol_id: cp_effluent
      process_id: "plate_making"
      flow_role: "linked atomic exchanges"
      record_type: "flow-weighted laboratory monitoring"
      raw_fields: "outfall; freshwater receiving body; bulk solution m3; carrier-water fraction and m3; wastewater wet kg; analyte/CAS; concentration; dissolved/total; COD method; detection limits; QA"
      collection_method: "Sample actual discharge with representative flow-weighted concentrations; for Al use validated matrix-appropriate total-recoverable/dissolved method such as EPA 200.7 with digestion/filtration recorded. Identify other species separately. Aggregation: retain raw attributable campaign totals in each exchange native unit; normalize_campaign performs the sole output-mass division."
      unit: "m3; mg/L; kg"
      frequency: "representative discharge events and campaign"
      temporal_coverage: "same campaign as cp_mass"
      site_scope: "site freshwater outfall; not off-site treatment transfer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "chain of custody; blanks; recovery; matrix/interference; flow calibration"
    - protocol_id: cp_air
      process_id: "plate_making"
      flow_role: "linked atomic exchanges"
      record_type: "species monitoring/balance"
      raw_fields: "chemical CAS; solution composition/purity/origin; input; retained/recovered/waste kg; water and other medium releases; disjoint stocks; vent flow; species and aerosol/PM relationship; capture/control evidence"
      collection_method: "Measure outdoor release or use an independently supported closed species balance with capture, recovery, waste and stocks; VOC-as-carbon totals require documented speciation and conversion. Aggregation: retain raw attributable campaign totals in each exchange native unit; normalize_campaign performs the sole output-mass division."
      unit: "kg"
      frequency: "maintenance/bath handling event and campaign"
      temporal_coverage: "same campaign as cp_mass"
      site_scope: "actual outdoor shop release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "SDS; monitoring calibration; independent balance terms and uncertainty"
    - protocol_id: cp_service
      process_id: "plate_making"
      flow_role: "linked atomic exchanges"
      record_type: "allocation/service account"
      raw_fields: "stage driver; burden shares; print job; compatible plate ID; actual accepted impressions; area; replacement; recovered-carrier kg"
      collection_method: "Keep manufacturing physical ledger immutable; use job/receiver records for separately declared burden allocation and downstream service only. Do not assume brochure run life. Aggregation: manufacturing inventory remains per 1 kg reference flow; downstream service burden is a separate account"
      unit: "kg; m2; impressions"
      frequency: "campaign and declared downstream jobs"
      temporal_coverage: "declared matching period"
      site_scope: "shop plus explicitly linked downstream job"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "driver causality; compatible job records; recovery receipts"
  calculation_rules:
    - id: normalize_campaign
      applies_to: "all inventory rows"
      rule: "inventory_amount = attributable campaign exchange / accepted campaign net plate kg. Retain numerator unit and divide all grade-matched records by the same positive denominator. Use one complete matched reporting-period pool for the same product, grade, route, site and reference state, including all attributable startup/shutdown, wholly failed or zero-output batches, rejects, work in progress and rework. Sum raw numerator totals before dividing once by the strictly positive accepted net output; count reworked product once only at final acceptance. Never average batch ratios or omit failed activity. A pool with no accepted output retains its absolute unnormalized inventory and requires review."
      inputs:
        - cp_mass
        - cp_material
        - cp_energy
        - cp_water
        - cp_waste
        - cp_effluent
        - cp_air
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: electricity_units
      applies_to: "electricity"
      rule: "electricity_MJ = measured_kWh * 3.6; preserve supply voltage and meter boundary. This unit conversion does not establish supplier technology or a steam enthalpy basis."
      inputs:
        - cp_energy
      output: "MJ electricity"
      source_ids: []
    - id: liquid_mass
      applies_to: "water; developer; replenisher; gum; wastewater"
      rule: "solution_kg = measured_solution_L * measured_density_kg_per_L at recorded temperature/grade. Apply composition fractions only in the species ledger; retain complete product/waste solution exchanges."
      inputs:
        - cp_material
        - cp_water
        - cp_waste
      output: "wet solution kg and separate constituent kg"
      source_ids: []
    - id: outfall_load
      applies_to: "aluminium_water; cod_water; ipa_water"
      rule: "load_kg = sum(concentration_mg_per_L * discharged_bulk_solution_m3) / 1000 over matched samples. Concentration and volume must describe the same whole liquid, not carrier-water volume. Preserve analyte definition and representative flow weighting; nondetect handling and uncertainty are explicit."
      inputs:
        - cp_effluent
      output: "actual chemical kg or COD oxygen-demand kg"
      source_ids:
        - epa-metals-2007-1994
    - id: species_balance
      applies_to: "ipa_air"
      rule: "air_release_kg = chemical_input_kg + opening_stock_kg - closing_stock_kg - product_retained_kg - exported_waste_constituent_kg - recovered_export_kg - actual_water_release_kg - other_evidenced_release_kg - evidenced_destroyed_kg. Every term is IPA constituent mass over the same perimeter; stock, retained, waste, recovery and medium terms are mutually exclusive. Internal reuse cancels; unexplained residual is not an assumed release."
      inputs:
        - cp_air
        - cp_material
        - cp_waste
      output: "IPA chemical kg to actual outdoor air"
      source_ids:
        - epa-printing-eiip-2002
    - id: plate_area_mass
      applies_to: "reference_plate; plate_blank"
      rule: "complete_plate_kg = measured_same_grade_area_m2 * measured_complete_kg_per_m2 at the same coating/gum/moisture state; or measured count * measured same-grade complete kg per plate. Derive factors from traceable weighed samples and area/count, with sampling uncertainty. Gauge times nominal metal density excludes coating/protective layers/water and is not a whole-plate conversion."
      inputs:
        - cp_mass
        - cp_material
      output: "complete plate kg, with dry-solids/water subaccounts"
      source_ids: []
    - id: carrier_water
      applies_to: "water_discharge"
      rule: "carrier_water_m3 = measured_bulk_solution_kg * measured_water_mass_fraction / water_density_kg_per_m3 at documented temperature. Use a supported water density and compatible composition method; bulk solution density is not automatically carrier-water density. Reconcile with separately inventoried constituents; whole solution volume remains the basis for concentration-derived analyte loads."
      inputs:
        - cp_water
        - cp_effluent
      output: "actual carrier water m3"
      source_ids: []
  data_quality_requirements:
    - id: quality_scope
      applies_to: "all inventory rows"
      requirement: "Match route, plate grade, campaign and acceptance state; no recipe, yield, area-to-mass or run-life default."
      evidence: "cp_mass; cp_material"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "A broad identity is conditional on physical inclusion and compatible provider/reference quantity. Blank UUIDs and source metadata conflicts remain disclosed and block unsupported linking."
      evidence: "current SDS; provider specification; direct identity/reference evidence"
    - id: quality_monitoring
      applies_to: "elementary outputs"
      requirement: "Record actual receiving compartment, flow-weighted measurements, species basis, blanks/recovery, detection limits, matrix interference and uncertainty. A sum indicator does not hide a toxic species."
      evidence: "cp_effluent; cp_air; epa-metals-2007-1994"
    - id: quality_balances
      applies_to: "all inventory rows"
      requirement: "Retain physical and allocated-burden accounts separately, justify residuals and conditional absence, and document temporal/site/technology representativeness and data gaps."
      evidence: "cp_water; cp_waste; cp_service"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_plate"
    rule: "Require the exact physical qualifiers, one accepted complete plate output, a compatible product identity and Mass/kg reference. Broad classification language does not establish an average mixed-media recipe or scientific approval."
    source_ids: []
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "All rows and stage aggregates use per 1 kg reference flow, divided by the same accepted complete net plate kg for the matching grade/campaign. Item count and surface area are diagnostic fields; neither substitutes for whole-product kg without measured same-grade conversion."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Reconcile physical aluminium, water including retained moisture and inlet/outlet humidity, coating/solvent carbon, packaging/returns, maintenance consumables, energy and stocks before any burden allocation. Unknown composition, missing flow identity, provider basis or unexplained material residual remains an explicit data-package gap; a successful UUID read alone cannot complete the dataset."
    source_ids: []
  - rule_id: validate_species
    applies_to: "elementary outputs"
    rule: "Check actual release point, CAS, medium and quantity basis. Aluminium is kg as Al, COD is kg oxygen demand, water discharge is liquid m3 and water vapour is kg to air. Keep individual solvent/species inventories and report COD/LCIA overlap; no VOC/PM/metal double count, wastewater-as-pure-water substitution or correction-flow identity."
    source_ids:
      - epa-metals-2007-1994
      - epa-printing-eiip-2002
  - rule_id: validate_applicability
    applies_to: "conditional rows"
    rule: "Require recorded absence or actual records for each conditional stream. Current supplier/SDS and stage records determine additional atomic exchanges. Historic plant factors, brochure bath capacities, exposure dose and press-run maxima are not universal foreground quantities."
    source_ids:
      - fuji-lh-ple-2019
published_dataset_profile:
  dataset_role: "Foreground platemaking dataset; explicit gate/physical boundary metadata"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Background for matching positive thermal aqueous-developed aluminium plate printing models after upstream verification"
  excluded_use: "Cylinder/stone/type/process-free/printed-goods methodology; unverified regeneration or mixed-media averages; default per-impression burdens"
  required_metadata: "aluminium alloy and whole-plate gauge; positive thermal coating grade and supplier; imaging system and acceptance; actual developer/replenisher concentration; rinse and gum/drying state; unbaked and unused state; complete net mass, retained moisture and plate area; declared press/run compatibility without assumed life; electricity delivery voltage/property basis; effluent route and waste receivers"
  required_quality_disclosure: "Campaign/site representativeness, UUID/provider-basis gaps, composition/species gaps, balance residuals, conditional-absence evidence, allocation/recycling convention and actual service account"
  update_trigger: "Changed plate/coating/development route, provider basis, outfall, receiver or energy-delivery conditions, or new reliable evidence"
data_sources:
