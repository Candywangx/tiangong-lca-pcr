    reference: "Official current product pages: https://www.ilfordphoto.com/multigrade-rc-deluxe-glossy-sheets ; https://www.ilfordphoto.com/multigrade-developer-product ; https://www.ilfordphoto.com/rapid-fixer-product ; https://www.ilfordphoto.com/1893870"
    used_for: "Currently advertised RC paper and three supplier products; confirm actual supplied batch documentation. Not proof a document-printing enterprise uses this route."
