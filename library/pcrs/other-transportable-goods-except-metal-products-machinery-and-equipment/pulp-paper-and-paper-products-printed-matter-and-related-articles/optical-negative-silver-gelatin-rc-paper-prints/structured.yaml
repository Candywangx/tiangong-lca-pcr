  classification_refs: "CPC 3.0 32550; narrower; scope and accepted decisions: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADRs"
  covered_products: "Accepted unmounted monochrome silver-image RC paper copies of specified hand-drawn plans or manuscripts produced by this optical-negative/manual-tray variant."
  excluded_products: "Original creation/services; carbon copying; digital outputs; FB/colour/toned/mounted/laminated/thermally dried products; other processing routes."
  representative_product: "One declared design/negative and purchased RC paper grade; physical print accepted at actual moisture and declared geometry/density/clarity."
  production_route: "Existing processed optical negative interface; enlarger exposure; MULTIGRADE/ILFOSTOP/non-hardening RAPID FIXER trays; fresh running-water wash; ambient air-dry; inspect and paper-wrap; external liquid treatment links."
  market_state: "Net accepted complete dry RC physical copies at imaging-unit gate; tool and packaging separately recorded."
functional_unit:
  what: "Provide a specified existing original image/text as a physically accepted monochrome silver-image RC reproduction; creative/design work is a separate function."
  how_much: "1 kg net accepted complete RC-copy mass, accompanied by actual sheet dimensions, copy count and image scale."
  how_well: "Declared geometric accuracy, polarity, crop/completeness, density/contrast or measured clarity and acceptance moisture; actual quality tests, no universal service equivalence by kg."
  how_long_or_cycle: "One production campaign to gate acceptance; no prescribed display or archival lifetime."
  reference_flow_link: "finished_print"
system_boundary:
  rules:
    - rule_id: route_complete
      applies_to: "rc_image"
      rule: "Include optical exposure, all three tray baths, print washing, surplus-water removal/air drying, acceptance, actual paper pack-out, water-only vessel cleaning and attributable room/auxiliary operations; link all actual external treatment. No missing required prior or ancillary stage."
      source_ids:
        - ilford-rc-2020
        - ilford-paper-developer
        - ilford-rapid-fixer
    - rule_id: master_interface
      applies_to: "master_input; master_return"
      rule: "Existing negative is a real measured tool interface. If prepared on-site, keep that actual precursor as a linked foreground unit rather than pretending it was externally purchased. Customer-supplied negatives/originals retain identity, custody and documented life-cycle allocation; no free preparation burden assumed."
      source_ids:
        - ilford-rc-2020
    - rule_id: liquid_destination
      applies_to: "spent_developer; spent_stop; spent_fixer; washwater; clean_rinse"
      rule: "Segregate actual outlets and link compatible external collection/treatment and transport. No on-site silver recovery, direct sewer/freshwater discharge or invented receiving compartment. If the actual site requires a different stage, model its complete actual inventory and reassess route compatibility."
      source_ids:
        - ilford-developer-sds
        - ilford-stop-sds
        - ilford-fixer-sds
    - rule_id: inventory_extension
      applies_to: "rc_image"
      rule: "Survey all real auxiliary chemicals, supply/dispatch packaging components, maintenance, pollution control and refrigerants. Add one atomic verified exchange for each actual additional item before dataset completion; non-applicability needs evidence, not omitted activity or an invented zero."
      source_ids:
        - ilford-rc-2020
    - rule_id: stage_transfer
      applies_to: "rc_image"
      rule: "One imaging foreground unit aggregates processing and wrapping while retaining separate stage measurements. Record exposed/wet/dry print and bath handovers equal on both sides in physical records; only accepted final copies are the reference product. Bath recirculation/returned working solution is internal, not repeated fresh purchase or external waste."
      source_ids:
        - ilford-rc-2020
    - rule_id: supply_package_boundary
      applies_to: "supply_bottle; supply_carton; supply_bag; used_bottle; used_carton; used_bag"
      rule: "Actual supply containers are individual physical custody exchanges. State whether each supplier background includes packaging; count its production burden once, in that supplied-product background or in a separately linked package process. Reconcile full input/return/stock/waste masses; closures and other real components need their own atomic rows, not addition to concentrate net mass."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual existing processed conventional B&W negative at an explicitly linked preparation-unit interface, and purchased complete unexposed RC sheets and supplied concentrates. No assertion that on-site prior work is purchased."
  starting_condition_role: "intermediate_product"
  product_classification_scope: "Only route-qualified physical photographic copies of the specified hand originals/texts, proposed narrower CPC32550."
  recursive_input_rule: "Any same-category prior print used as a copying original/rework is a documented upstream or tool input with its real previous burdens; not virgin RC stock, not an indefinitely repeated reference-output loop."
  upstream_dataset_requirement: "Link actual negative preparation and original/master custody and use, even if on-site; include original image capture/film base/silver emulsion/exposure/development/washing/energy and real residues in its actual process. Link paper-core/PE/silver-halide gelatin manufacture, each supplied concentrate/formulation and supply packaging, utilities, transport and actual external treatment. A matching UUID alone is insufficient."
  disclosure: "Identify the imaging-unit foreground boundary and all on-site linked precursor units, tool ownership, allocation cohort, treatment destinations, stock/return accounting and transport. Imaging-only foreground burdens are not a complete life cycle."
