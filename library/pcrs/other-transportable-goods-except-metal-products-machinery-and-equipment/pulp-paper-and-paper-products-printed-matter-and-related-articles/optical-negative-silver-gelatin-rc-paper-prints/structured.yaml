measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted complete RC copies at actual measured moisture, excluding packaging, negatives and rejects; collect using cp_finished. All inventory rows, collection aggregation and calculations use per 1 kg reference flow."
  - id: concentrate_basis
    applies_to: "developer; stop; fixer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh actual net supplied concentrate. If collected by volume, convert with measured batch density and recorded temperature. Preserve concentrate versus working solution and carrier-water ownership; do not add contained ingredients again."
  - id: electricity_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert metered kWh to MJ by multiplying by 3.6. This exact energy conversion does not assert combustion or change provider delivery voltage."
  - id: physical_ledgers
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass; actual reference property"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Maintain separate physical total/dry-solid/H2O/elemental-Ag and actual reaction-component ledgers and allocated environmental-load ledgers. Track opening/closing stocks, retained coating and real internal handovers; no assumed moisture, density or silver fraction."
  - id: silver_species
    applies_to: "spent_fixer; washwater; clean_rinse; tank_sediment; processed_reject; unprocessed_reject"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Total Ag assay is an elemental accounting measure. Obtain phase/speciation where needed for provider/LCI/LCIA; do not rename total Ag to Ag+ or metallic silver or infer pollutant species from COD/BOD. No direct liquid emission is selected."
