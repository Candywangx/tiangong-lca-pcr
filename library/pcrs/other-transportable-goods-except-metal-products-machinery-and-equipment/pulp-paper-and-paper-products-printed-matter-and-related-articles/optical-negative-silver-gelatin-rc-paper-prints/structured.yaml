allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "rc_image"
    rule: "Avoid allocation by separate meters/records and genuine process subdivision first. For actually shared operations use a supported causal physical basis; if another relationship is necessary, justify it with real evidence and uncertainty. No creative-value or product mass default for incompatible functions."
    source_ids: []
  - rule_id: master_service
    applies_to: "master_input; master_return; retired_negative"
    rule: "Keep full tool masses/receipts/returns/stocks in the physical ledger. Separately attribute the actual linked preparation and maintenance burdens across documented imaging uses using a justified measured service basis such as comparable exposed area or exposure time. Fractions sum to one across the stated actual-use cohort. Declare cohort closure, ownership, any unassigned stock and uncertainty; do not invent future lifetime/uses. Do not multiply the full upstream manufacture burden by every reused-tool receipt or subtract a return as an avoided-product credit. In the burden model, custody transfer records and the linked service-attributed load must remain distinct; software without this separation requires an explicit measured tool-owner/reuse unit, not repeated acquisition."
    source_ids: []
  - rule_id: shared_baths
    applies_to: "developer; stop; fixer; spent_developer; spent_stop; spent_fixer"
    rule: "Use actual bath identity, opening/closing composition, doses, reuse, processing history and service records to attribute shared campaign consumption/waste. Allocate measured loads, not full physical outlet mass; physical exports remain measured whole quantities. No supplier capacity or silver concentration default."
    source_ids:
      - ilford-rc-2020
  - rule_id: silver_destination
    applies_to: "spent_fixer; tank_sediment"
    rule: "Full liquid/sediment outputs retain measured water/chemistry/Ag. Off-site recovered silver belongs to actual treatment evidence and boundary; no assumed recovery, zero burden, monetary co-product or automatic avoided silver credit at the imaging gate. Retained image silver remains in copies and rejects."
    source_ids:
      - cci-photo-processing
dataset_production:
  collection_protocols:
    - protocol_id: cp_finished
      process_id: "rc_image"
      flow_role: "finished_print"
      record_type: "accepted-product records"
      raw_fields: "design/negative IDs; net accepted full-copy mass D; moisture method; sheet size/count; scale/crop/polarity; density/contrast/clarity tests; rejects"
      collection_method: "Calibrated net weighing after actual dry acceptance, excluding packaging/tools; actual moisture and dimensional/image acceptance tests. Accepted net mass and all quantities per 1 kg reference flow; preserve gross lot totals first."
      unit: "kg"
      frequency: "each accepted lot"
      temporal_coverage: "complete campaign"
      site_scope: "imaging and acceptance"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; acceptance records; sample/uncertainty"
    - protocol_id: cp_master
      process_id: "rc_image"
      flow_role: "master_input; master_return; retired_negative"
      record_type: "tool custody and linked precursor"
      raw_fields: "negative ID; polymer/support; full incoming/return/retained/retired mass; ownership; original custody; actual preparation process inputs/outputs and datasets; exposure area/time/use cohort"
      collection_method: "Weigh/count actual tools and reconcile custody; acquire actual precursor production/collection records even for on-site or customer-supplied masters; document supported use-cohort burden allocation separately. Physical transfer/stock amounts per 1 kg reference flow; allocated preparation load uses documented service fractions, never repeated full manufacture."
      unit: "kg"
      frequency: "each transfer/use/retirement"
      temporal_coverage: "actual documented use cohort"
      site_scope: "imaging and actual preparation-unit link"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tool register; precursor measurement/source links; causal allocation evidence"
    - protocol_id: cp_materials
      process_id: "rc_image"
      flow_role: "rc_stock"
      record_type: "material receipt/withdrawal"
      raw_fields: "supplier/grade/batch; full net RC sheet mass; dimensions/area; silver/gelatin/PE declarations; opening/closing stocks; unused returns; reject state"
      collection_method: "Weigh complete sheets and reconcile stores; supplier verified grade and layer evidence, no base-grammage shortcut. Actual attributable full-sheet amount per 1 kg reference flow; reconcile physical totals and stocks first."
      unit: "kg"
      frequency: "receipt and campaign"
      temporal_coverage: "complete campaign"
      site_scope: "stock and imaging"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier records; weighing; layer composition and uncertainty"
    - protocol_id: cp_baths
      process_id: "rc_image"
      flow_role: "developer; stop; fixer"
      record_type: "bath formulation and usage"
      raw_fields: "supplier/batch/actual SDS/formulation; concentrate net mass; bottle tare; added water; density/temperature if volume conversion; bath ID/volume/mass/pH/temperature; dose/carryover/reuse/stock changes; processed area"
      collection_method: "Weigh net supplied concentrate and doses; meter added water independently; measure actual bath control and opening/closing stock; trace supplier concentrate-versus-working-solution background. Actual attributable supplied concentrate per 1 kg reference flow; internal working-liquid recirculation is not fresh purchased input."
      unit: "kg"
      frequency: "each mix/dose/bath change"
      temporal_coverage: "complete campaign and shared-bath cohort"
      site_scope: "mixing and trays"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated measures; actual batch documents; bath logs"
    - protocol_id: cp_water
      process_id: "rc_image"
      flow_role: "water"
      record_type: "water flow and H2O ledger"
      raw_fields: "source/provider; stage inlet meters; kg or volume/density/temperature; concentrate-carrier water; print water retained; bath/cleaning outlets and stocks; actual drying loss"
      collection_method: "Meter stage inlets and verify actual density where needed; maintain complete H2O balance without treating all volatile mass loss as water. Record actual bath/print/gelatin carrier water, reaction-generated or consumed water where supported, and inlet/outlet ambient humidity on matching exhaust-volume/time/wet-dry/T/P bases. Ambient through-water is not newly generated foreground evaporation; liquid carried to another bath, a wet reject or external waste remains a physical transfer, not evaporation. Sum attributable additional supplied water per 1 kg reference flow; purchased-formulation water is already within concentrate mass."
      unit: "kg"
      frequency: "stage and campaign"
      temporal_coverage: "complete campaign"
      site_scope: "mixing/washing/cleaning"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters/density evidence; independent outlet/stock cross-check"
    - protocol_id: cp_energy
      process_id: "rc_image"
      flow_role: "electricity"
      record_type: "electricity meters"
      raw_fields: "user delivery below1kV; provider/location/year; stage kWh; lamp/safelight/ventilation/conditioning/auxiliary operation times; shared-operation allocation"
      collection_method: "Meter actual electricity separately or apply justified measured shared-use attribution; exact kWh-to-MJ conversion. Attributable measured MJ per 1 kg reference flow."
      unit: "MJ"
      frequency: "stage and campaign"
      temporal_coverage: "complete campaign"
      site_scope: "imaging room and auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; supply point and provider basis; 3.6 conversion"
    - protocol_id: cp_liquids
      process_id: "rc_image"
      flow_role: "spent_developer; spent_stop; spent_fixer; washwater; clean_rinse"
      record_type: "liquid collection and composition"
      raw_fields: "each bath/outlet ID; full mass; actual density if needed; water/solids; pH; total Ag and supported species; COD/BOD descriptors; actual receiver/transport; opening/closing stocks and carryover"
      collection_method: "Weigh or meter each segregated full liquid outlet, sample with traceable methods and detection limits, and obtain compatible receiver treatment records; identify any actual common mixture once. Full measured attributable liquid amount per 1 kg reference flow; individual constituents are descriptors, not duplicated full-liquid inventory."
      unit: "kg"
      frequency: "each collection/bath change and campaign"
      temporal_coverage: "complete campaign"
      site_scope: "collection gate and linked external provider"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "transfer notes; laboratory QA; actual treatment/transport links"
    - protocol_id: cp_solids
      process_id: "rc_image"
      flow_role: "unprocessed_reject; processed_reject; tank_sediment"
      record_type: "solid waste and silver ledger"
      raw_fields: "separate state; wet/dry mass/moisture; paper/PE/gelatin; image silver/unreduced halide/complexes where supported; receiver; physical stock changes"
      collection_method: "Weigh segregated actual residues; analyse dry solids and silver accounting/speciation, distinguish unprocessed and processed paper; verify receiver acceptance. Full measured attributable residue amount per 1 kg reference flow; no yield or recovery default."
      unit: "kg"
      frequency: "each waste removal and campaign"
      temporal_coverage: "complete campaign"
      site_scope: "imaging/cleaning and waste gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; lab/sample evidence; receiver and state"
    - protocol_id: cp_pack
      process_id: "rc_image"
      flow_role: "wrapper; delivered_wrapper; supply_bottle; supply_carton; supply_bag; used_bottle; used_carton; used_bag; paper_pack_waste"
      record_type: "packaging and supply-container records"
      raw_fields: "each material/component/grade; supplied/retained/delivered/rejected/returned masses; concentrate versus bottle tare; PE confirmation and residual chemistry; actual receiver"
      collection_method: "Weigh each real component separately; reconcile paper wrapping input/output/waste/stocks; verify any polyethylene chemical bottle; add other real polymers/closures/components separately. Measured component amounts per 1 kg reference flow, outside net RC body mass; supplier package boundary prevents duplicate input burdens."
      unit: "kg"
      frequency: "receipt/pack-out/collection"
      temporal_coverage: "complete campaign"
      site_scope: "supply and dispatch packaging"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare and material declarations; physical reconciliation; receiver"
    - protocol_id: cp_air
      process_id: "rc_image"
      flow_role: "water_vapour; acetic_air; phenoxy_air"
      record_type: "outdoor-air outlet/species survey"
      raw_fields: "actual emission outlet/phase/species/CAS; sampled concentration/flow/time/temperature/pressure; ventilation/H2O inlet-outlet balance; blank/detection limit/coverage; actual formulation"
      collection_method: "Measure real environmental air crossings with appropriate validated species and flow methods; screen recipe-supported species, then include positives only with evidence. Distinguish indoor exposure, water-vapour balance, liquid analysis and ambient background; add other actual species individually. Supported attributable species amount per 1 kg reference flow; integrate concentration with compatible measured flow/time, no assumed ingredient-to-emission fraction."
      unit: "kg"
      frequency: "representative actual operating intervals and campaign"
      temporal_coverage: "documented complete or qualified coverage"
      site_scope: "environmental air outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory/meter QA; physical scope; non-detect/uncertainty and coverage"
  calculation_rules:
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "Divide each actual attributable raw exchange total by D, the sum of accepted net complete-copy masses over the same complete campaign. For finished_print, D/D gives 1 kg reference flow. Preserve unallocated physical totals separately. Use one complete matched reporting-period pool for the same product, grade, route, site and reference state, including all attributable startup/shutdown, wholly failed or zero-output batches, rejects, work in progress and rework. Sum raw numerator totals before dividing once by the strictly positive accepted net output; count reworked product once only at final acceptance. Never average batch ratios or omit failed activity. A pool with no accepted output retains its absolute unnormalized inventory and requires review."
      inputs:
        - cp_finished
        - "applicable row protocol"
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: energy_units
      applies_to: "electricity"
      rule: "Measured attributable kWh multiplied by 3.6 gives MJ; divide by D for per 1 kg reference flow."
      inputs:
        - cp_energy
        - cp_finished
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: bath_balance
      applies_to: "developer; stop; fixer; spent_developer; spent_stop; spent_fixer"
      rule: "Opening bath stock plus supplied concentrate/added water/actual carry-in equals closing stock plus actual carry-out, exported liquid, other measured sinks and balance residual. Track internal recirculation on both ends without adding external purchases; no default dilution or evaporation."
      inputs:
        - cp_baths
        - cp_liquids
        - cp_water
        - cp_solids
        - cp_air
      output: "physical bath/component balances and attributable amounts per 1 kg reference flow"
      source_ids: []
    - id: silver_balance
      applies_to: "rc_stock; finished_print; unprocessed_reject; processed_reject; spent_fixer; washwater; clean_rinse; tank_sediment"
      rule: "Reconcile measured incoming/stock-change elemental Ag with Ag retained in accepted copies and rejects, dissolved bath/wash/cleaning exports, sediment and any actually demonstrated other sinks. Total Ag is not species inventory; no assumed retention or recovery rate."
      inputs:
        - cp_materials
        - cp_finished
        - cp_liquids
        - cp_solids
      output: "separate elemental Ag reconciliation and compatible physical amounts per 1 kg reference flow"
      source_ids:
        - cci-photo-processing
    - id: air_measurement
      applies_to: "water_vapour; acetic_air; phenoxy_air"
      rule: "Use compatible sampled species concentration integrated with measured environmental outlet flow/time and actual stage attribution; account for blanks/background and coverage. H2O uses independently supported moisture/ventilation balance; no chemical-composition-to-release multiplier. Divide attributable measured mass by D."
      inputs:
        - cp_air
        - cp_water
        - cp_finished
      output: "kg of identified species per 1 kg reference flow"
      source_ids: []
    - id: reaction_components
      applies_to: "rc_image"
      rule: "Trace actual silver-halide reduction, silver-complex transfer, developer oxidation and acid/base carryover using documented formulation, observed phase/speciation and measured component/stock balances. Retain actually relevant elemental Ag, halides, sulphur, carbon and O/H exchange across baths, paper/gelatin, liquids, sediments and measured gases. Changed molecular forms are not conserved unchanged ingredients; oxygen uptake or supported reaction-water changes are not an unexplained evaporation loss. No stoichiometric yield, default species, gas amount or ingredient-to-release factor is imposed. Additional demonstrated gas/species requires its own verified atomic row and medium."
      inputs:
        - cp_baths
        - cp_water
        - cp_liquids
        - cp_solids
        - cp_air
        - cp_finished
      output: "actual component/element balances and disclosed residuals"
      source_ids:
        - cci-photo-processing
  data_quality_requirements:
    - id: identity_provider
      applies_to: "all inventory rows"
      requirement: "Verify actual grade/route/CAS/phase and the declared reference property/unit group; link supplier background with matching quantity basis. Unresolved UUID and provider compatibility are separate gaps, disclosed before dataset use."
      evidence: "actual supplier records; direct identity; measurement basis"
    - id: product_quality
      applies_to: "finished_print"
      requirement: "Declare and measure image geometry/polarity/completeness/density or clarity, actual net mass and moisture; no kg equivalence of creative, design or reading function."
      evidence: "cp_finished; acceptance specification"
    - id: method_settings
      applies_to: "rc_image"
      requirement: "Use actual batch-compatible manufacturer control instructions and verified site settings. Full formulas require supplier/foreground evidence; SDS hazardous ingredients and old illustrative numerical tables are not universal recipe or quantity defaults."
      evidence: "batch documentation; ilford-rc-2020; SDS"
    - id: mass_water_silver
      applies_to: "rc_image"
      requirement: "Close total mass, dry-solids, H2O and elemental Ag with stocks and uncertainties; investigate residuals. Separate physical exports from allocated environmental loads, COD/BOD analytical indicators from species exchanges and indoor concentrations from outdoor releases."
      evidence: "cp_water; cp_liquids; cp_solids; cp_air"
    - id: auxiliary_coverage
      applies_to: "rc_image"
      requirement: "All real additional cleaners, absorbents, gloves, maintenance parts/lamps, closures, packaging, transport and pollution-control exchanges must be individually identified, measured and linked. Water-only cleaning/no-toner/no-thermal/no-treatment assumptions must match the actual selected variant."
      evidence: "actual operation/component survey; receiver links"
    - id: temporal_coverage
      applies_to: "all inventory rows"
      requirement: "Document site, period, sampling/meter coverage, detection limits, variability, calibration and actual allocated cohorts. An absence claim needs evidence; unresolved quantity is not zero. No complete factory LCI is implied by methodology."
      evidence: "protocol raw evidence and uncertainty"
validation_rules:
  - rule_id: reference_unique
    applies_to: "finished_print"
    rule: "Require exactly one accepted final reference product output of 1 kg; include retained full RC structure/silver and actual moisture. Do not reuse this reference UUID for intermediate wet prints or returned originals; those stages have equal internal physical records in the aggregated unit."
    source_ids: []
  - rule_id: actual_route
    applies_to: "rc_image"
    rule: "Check negative/enlarger/RC grade and manual non-hardening tray route against actual records; reject incompatible creation/carbon/digital/FB/colour/machine/toned/mounted routes under this configuration. Required original/master preparation and real treatment must remain linked."
    source_ids:
      - ilford-rc-2020
      - ilford-paper-developer
      - ilford-rapid-fixer
  - rule_id: basis_complete
    applies_to: "all inventory rows"
    rule: "EN/ZH reference quantity, inventory denominator, protocol aggregation and calculations all use per 1 kg reference flow. Concentrate, diluted bath, full liquid export, tool transfer and service-attributed burden are distinct quantities; no double counting."
    source_ids: []
  - rule_id: liquid_silver
    applies_to: "spent_fixer; washwater; clean_rinse; tank_sediment"
    rule: "Verify actual full liquid/residue and silver retention/export balances, receiver compatibility and actual treatment/transport. Reject treating total silver or COD/BOD as a specific elementary flow; no invented recovery or direct receiving medium."
    source_ids:
      - cci-photo-processing
  - rule_id: air_conditional
    applies_to: "water_vapour; acetic_air; phenoxy_air"
    rule: "A positive elementary exchange requires physical environmental crossing, phase/species/CAS, appropriate medium and measured/calculated-from-measurement amount. SDS composition alone is not evidence of release; unresolved or unsupported screening remains disclosed."
    source_ids: []
  - rule_id: complete_records
    applies_to: "rc_image"
    rule: "Require actual stages, all ancillary atomic exchanges, current supplier/batch instructions, stocks, allocation, sampling quality and uncertainty. Complete mechanical checks do not establish independent methodology approval or full-site data validation."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground manufacturing dataset of the declared optical-negative RC imaging variant"
  downstream_use: "secondary_dataset; background_dataset only when actual complete links, evidence and applicability are verified"
  allowed_use: "Physical product manufacturing burdens for the declared documentary-copy configuration and appropriately reviewed same-method reference configurations."
  excluded_use: "Creative/design service valuation, whole-CPC coverage, digital or other processing routes, archived/display permanence claims, unlinked imaging-only burdens presented as full life cycle."
  required_metadata: "original/negative identifier, support and ownership; actual upstream preparation process and tool-use allocation; conventional B&W negative and optical projection/geometry/polarity; actual RC paper grade/PE/gelatin/silver-halide composition and full-sheet quantity; tungsten/halogen enlarger and filter; each concentrate supplier/batch/formulation and mixing records; tray sequence/pH/temperature/control evidence; running-water source/quality and measured use; no optional toner/wetting/mounting; air-dry/ventilation; accepted net mass/moisture, size/count, scale, image quality; retained silver, bath/wash/sediment silver speciation; all actual residues, packaging and receiver/provider boundaries; utility basis; site/period, uncertainty and allocation."
  required_quality_disclosure: "Site/period and measured coverage; actual supplier/precursor/treatment links; tool/bath attribution and physical balances; unknown UUID/provider/quantity/species; source date/edition limits; no independent review implied."
  update_trigger: "Actual paper/chemistry/negative/exposure/finishing/treatment/provider or allocation basis changes; new composition or source-version evidence; changed product quality or identified additional exchange."
