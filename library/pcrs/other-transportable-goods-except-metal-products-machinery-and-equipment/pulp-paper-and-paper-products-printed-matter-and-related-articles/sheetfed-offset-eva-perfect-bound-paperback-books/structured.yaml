product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.pulp-paper-and-paper-products-printed-matter-and-related-articles.sheetfed-offset-eva-perfect-bound-paperback-books"
  classification_refs: "CPC 3.0 32210; 32220; 32230; 32291; 32292; 32299; 32520; 32620; narrower; scope and accepted decisions: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADRs"
  covered_products: "Educational, general reference, directory, professional/technical/scholarly, ordinary paper children’s, general-interest and printed music-score books, and same-construction commercial catalogues or trade-advertising booklets, made by the same sheetfed/uncoated/nonreactive-EVA/unlaminated paperback route."
  excluded_products: "Hardcover, sewn/stitched/spiral/PUR, board/pop-up/toy/electronic products; loose-sheet/folio score sets and non-printed handwritten originals; laminated/varnished/foiled/insertion-rich publications; heatset/web, saddle-stitched or loose/folded advertising sheets; alternative printing/drying routes, 3D/prototype printing, non-paper substrates, postal/licensing/performance services and integrated paper production."
  representative_product: "Complete uncoated-page bound paper publication with printed flexible paper cover and EVA milled-spine perfect binding, of one declared textual, pictorial or musical-notation design; an educational textbook remains an included example."
  production_route: "CTP process-free plate → conventional wet sheetfed offset → absorption/oxidative setting → fold/gather → mill/glue/cover → trim/inspect/dispatch."
  market_state: "Accepted complete bound paper publication at printer factory gate; dispatch packaging recorded separately."
functional_unit:
  what: "Provide accepted printed textual, pictorial, musical-notation or independently verified commercial-catalogue/trade-advertising content in the declared complete bound paper-publication construction."
  how_much: "1 kg net accepted complete bound paper publications of one declared design; count/page information accompanies mass."
  how_well: "Declared legibility/print specification, page completeness, cover and binding integrity with recorded acceptance tests; score books additionally declare notation readability and page-opening/turning acceptance for the actual design. No universal lifetime, lay-flat performance or paper grammage."
  how_long_or_cycle: "One manufacturing lot at factory gate. Reading/learning, musical-performance, advertising reach or sales-effect service life is not quantified and requires a separately declared service study."
  reference_flow_link: "finished_book"
system_boundary:
  rules:
    - rule_id: b_complete_route
      applies_to: "all datasets"
      rule: "Include CTP/prepress, make-ready, text and cover wet offset, setting/stacking, folding/gathering, spine milling, EVA spine/side gluing, cover attachment, three-side trimming, quality control, packing and attributable utilities/collection. Scope starts at dry purchased paper and finished process-free plates; no premade printed book block replaces printing."
      source_ids:
        - epa-eiip-2002
        - kodak-sonora-process-free
        - mm-antaro-perfect-binding
    - rule_id: b_structure_guard
      applies_to: "applicability"
      rule: "Require a flexible unlaminated paper cover and uncoated text sheets with non-reactive EVA perfect binding. Exclude hard cases, cloth, sewing, staples/spirals, PUR, board-page/three-dimensional/toy/electronic books, inserts, foil/varnish/film finishing, waterless/digital/gravure/flexographic, heatset/coldset web, UV/EB and integrated pulping/papermaking. Any actual excluded operation needs a separately assessed methodology before reuse.  Printed-score books must contain actual printed musical notation in a complete EVA-bound paper book; loose-sheet/folio sets, non-printed manuscripts, electronic text, postal/licensing/retail/performance services, non-paper substrates and3D prototypes remain excluded."
      source_ids:
        - mm-antaro-perfect-binding
        - epa-ctg-2006
        - walsworth-book-printing
        - unsd-cpc3-2025
        - songburd-music-print-options
    - rule_id: b_commercial_content_guard
      applies_to: "commercial catalogue or advertising booklet"
      rule: "Require independently verified commercial content/purpose and every same-construction sheetfed/uncoated/flexible-unlaminated-cover/nonreactive-EVA condition. Catalogue equipment capabilities are evidence of available routes, not proof of an actual job or a compatible supplier. No heatset/web, saddle stitch, loose/folded sheet or digital route inherits this method, and no advertising-response service is quantified."
      source_ids:
        - unsd-cpc3-2025
        - epa-eiip-2002
        - mm-antaro-perfect-binding
        - pgm-advertising-catalogues
    - rule_id: b_upstream
      applies_to: "supplied inputs"
      rule: "Link actual paper/pulp, plate coating/aluminium, formulated ink, chemical, formulated EVA adhesive and packaging production/delivery backgrounds. Pulp/chemical recovery, bleaching, mill fuel/steam and wastewater remain within the actual paper supplier model when included there. The paper BREF informs that upstream coverage; sawmill or plywood evidence does not substitute for papermaking. Do not re-add the same upstream component burdens to complete formulation backgrounds."
      source_ids:
        - jrc-paper-bref-2015
        - epa-ctg-2006
    - rule_id: b_physical_links
      applies_to: "internal stages"
      rule: "One aggregated manufacturing unit preserves independent stage meters and physical ledgers. Printed signatures, printed covers and gathered blocks pass between stages at identical outgoing/incoming physical quantities, including moisture and ink/glue state; they are not additional final-reference outputs. Internal rework is recorded as circulation rather than an external input/output or a second avoided burden."
      source_ids:
        - epa-eiip-2002
        - mm-antaro-perfect-binding
    - rule_id: b_emission_boundary
      applies_to: "outdoor releases and wastes"
      rule: "Count actual factory releases after capture/abatement, with species and media; indoor exposure, transferred wastes and collected dust are separate facts. Auxiliary gas heat is conditional and not conventional ink drying. Heatset solvent evaporation factors and UV/EB electricity cannot be assigned to this non-heatset route. Offsite waste treatment and supplied-electricity emissions are linked once as backgrounds."
      source_ids:
        - epa-ctg-2006
        - epa-gas-ap42-2026
        - epa-method18-2025
boundary_abstraction:
  declared_starting_condition: "Dry unprinted purchased paper sheets and finished process-free coated aluminium plates received at the print plant, with actual supplied ink/EVA and chemicals."
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "Route-qualified complete paperback books and same-construction commercial booklets across the declared content categories, including actual printed notation; each CPC coordinate covers only its matching physical subset; current acceptance is governed by the canonical mapping and its ADRs."
  recursive_input_rule: "Purchased complete same-category bound publications are not raw paper inputs. Declare any such rework/resale separately, trace its actual upstream production and prohibit duplicate final reference output or invented recursion cut-off."
  upstream_dataset_requirement: "Actual supplier paper/pulp, complete plate, formulated ink/EVA, chemicals, electricity and packaging with compatible quantity/state and production/delivery/treatment routes."
  disclosure: "Site/period/job designs, all included/excluded stages, suppliers, cure/heat distinction, outsourcing, flows without providers/UUIDs, physical balances and burden allocation; downstream reading, advertising distribution/response, use and disposal excluded."
