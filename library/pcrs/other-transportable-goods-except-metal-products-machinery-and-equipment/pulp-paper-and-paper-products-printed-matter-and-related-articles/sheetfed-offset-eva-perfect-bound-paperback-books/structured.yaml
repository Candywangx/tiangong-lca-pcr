product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.pulp-paper-and-paper-products-printed-matter-and-related-articles.sheetfed-offset-eva-perfect-bound-paperback-books"
  classification_refs: "CPC 3.0 32210; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "Complete printed educational textbooks primarily for students or teachers in formal study programmes, including workbooks, teachers’ manuals, resource and interactive materials only in the declared sheetfed/uncoated/nonreactive-EVA/unlaminated paperback form."
  excluded_products: "General reference books, directories, professional/technical/scholarly books, non-textbook children’s books, other general-interest books, printed music and trade-advertising/commercial catalogues are outside this PCR; shared manufacture does not confer textbook identity. Also excluded: hardcover, sewn/stitched/spiral/PUR, board/pop-up/toy/electronic products; loose-sheet/folio sets and non-printed handwritten originals; laminated/varnished/foiled/insertion-rich publications; heatset/web, saddle-stitched or loose/folded forms; alternative printing/drying routes, 3D/prototype printing, non-paper substrates, postal/licensing/performance services and integrated paper production."
  representative_product: "Complete educational textbook of one declared edition and student/teacher course design, with uncoated pages, printed flexible paper cover and EVA milled-spine perfect binding."
  production_route: "CTP process-free plate → conventional wet sheetfed offset → absorption/oxidative setting → fold/gather → mill/glue/cover → trim/inspect/dispatch."
  market_state: "Accepted complete educational textbook at printer factory gate; dispatch packaging recorded separately."
functional_unit:
  what: "Provide accepted printed educational text and any specified learning/practice/teacher material for a declared formal study programme in the complete bound textbook construction."
  how_much: "1 kg net accepted complete educational textbooks of one declared edition/design; count/page information accompanies mass."
  how_well: "Match the approved edition/job proof, legibility/print specification and course/learning sequence; verify complete correctly ordered text, summaries, exercises and answers where actually specified, plus cover and binding integrity with recorded acceptance tests. No universal lifetime, lay-flat performance, paper grammage, learning effect or national textbook standard."
  how_long_or_cycle: "One manufacturing lot at factory gate. Reading/learning service life or educational attainment is not quantified and requires a separately declared service study."
  reference_flow_link: "finished_book"
system_boundary:
  rules:
    - rule_id: b_complete_route
      applies_to: "all datasets"
      rule: "Include CTP/prepress, make-ready, text and cover wet offset, setting/stacking, folding/gathering, spine milling, EVA spine/side gluing, cover attachment, three-side trimming, quality control, packing and attributable utilities/collection. Scope starts at dry purchased paper and finished process-free plates; no premade printed book block replaces printing."
      source_ids:
        - epa-eiip-2002
        - kodak-sonora-process-free
        - mm-antaro-perfect-binding
    - rule_id: b_structure_guard
      applies_to: "applicability"
      rule: "Require a flexible unlaminated paper cover and uncoated text sheets with non-reactive EVA perfect binding. Exclude hard cases, cloth, sewing, staples/spirals, PUR, board-page/three-dimensional/toy/electronic books, inserts, foil/varnish/film finishing, waterless/digital/gravure/flexographic, heatset/coldset web, UV/EB and integrated pulping/papermaking. Any actual excluded operation needs a separately assessed methodology before reuse. Loose-sheet/folio sets, non-printed manuscripts, electronic text, postal/licensing/retail/performance services, non-paper substrates and 3D prototypes remain excluded."
      source_ids:
        - mm-antaro-perfect-binding
        - epa-ctg-2006
        - walsworth-book-printing
        - unsd-cpc3-2025
    - rule_id: b_educational_content_guard
      applies_to: "educational textbook applicability"
      rule: "Require documented primary educational use by students or teachers in a formal study programme and actual course/learning structure, in addition to every selected physical route condition. Check publisher/job specifications and actual contents, edition/revision and audience. Other book, directory, printed-music and commercial categories do not inherit applicability from shared construction; supplier capabilities and subject labels alone cannot qualify a textbook or an actual site route."
      source_ids:
        - unsd-cpc3-2025
        - epa-eiip-2002
        - mm-antaro-perfect-binding
    - rule_id: b_upstream
      applies_to: "supplied inputs"
      rule: "Link actual paper/pulp, plate coating/aluminium, formulated ink, chemical, formulated EVA adhesive and packaging production/delivery backgrounds. Pulp/chemical recovery, bleaching, mill fuel/steam and wastewater remain within the actual paper supplier model when included there. The paper BREF informs that upstream coverage; sawmill or plywood evidence does not substitute for papermaking. Do not re-add the same upstream component burdens to complete formulation backgrounds."
      source_ids:
        - jrc-paper-bref-2015
        - epa-ctg-2006
    - rule_id: b_physical_links
      applies_to: "internal stages"
      rule: "One aggregated manufacturing unit preserves independent stage meters and physical ledgers. Printed signatures, printed covers and gathered blocks pass between stages at identical outgoing/incoming physical quantities, including moisture and ink/glue state; they are not additional final-reference outputs. Internal rework is recorded as circulation rather than an external input/output or a second avoided burden."
      source_ids:
        - epa-eiip-2002
        - mm-antaro-perfect-binding
    - rule_id: b_emission_boundary
      applies_to: "outdoor releases and wastes"
      rule: "Count actual factory releases after capture/abatement, with species and media; indoor exposure, transferred wastes and collected dust are separate facts. Auxiliary gas heat is conditional and not conventional ink drying. Heatset solvent evaporation factors and UV/EB electricity cannot be assigned to this non-heatset route. Offsite waste treatment and supplied-electricity emissions are linked once as backgrounds."
      source_ids:
        - epa-ctg-2006
        - epa-gas-ap42-2026
        - epa-method18-2025
boundary_abstraction:
  declared_starting_condition: "Dry unprinted purchased paper sheets and finished process-free coated aluminium plates received at the print plant, with actual supplied ink/EVA and chemicals."
  starting_condition_role: "foreground_collection_gate"
  product_classification_scope: "Only the route-qualified complete printed educational-textbook subset of CPC 3.0 32210; verify primary formal-study purpose and actual course/learning structure. No other CPC category is included; this authoring scope does not establish accepted mapping or whole-leaf coverage."
  recursive_input_rule: "Purchased complete same-category bound publications are not raw paper inputs. Declare any such rework/resale separately, trace its actual upstream production and prohibit duplicate final reference output or invented recursion cut-off."
  upstream_dataset_requirement: "Actual supplier paper/pulp, complete plate, formulated ink/EVA, chemicals, electricity and packaging with compatible quantity/state and production/delivery/treatment routes."
  disclosure: "Site/period/job designs, all included/excluded stages, suppliers, cure/heat distinction, outsourcing, flows without providers/UUIDs, physical balances and burden allocation; downstream teaching/reading, distribution, use and disposal excluded."
