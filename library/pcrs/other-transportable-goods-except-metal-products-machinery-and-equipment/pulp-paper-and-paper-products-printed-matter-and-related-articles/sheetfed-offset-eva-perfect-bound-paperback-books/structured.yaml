          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `v_reference` | reference dataset | Verify the broad Printed Matter UUID only for the declared complete bound-paper-publication subset, with actual content category, physical qualifiers, accepted net mass, one final output and the same denominator in both languages. Ordinary books, printed music-score books and same-construction commercial catalogues/trade-advertising booklets share this reference extent only under the same manufacturing construction; do not substitute an educational-only identity for a non-educational book or score. Disclose source CPC32690 and unrelated 3D commentary and re-check provider scope; no printed-matter average, postal service, intermediate sheet or prototype is implied. | `unsd-cpc3-2025` |\n| `v_commercial_scope` | claimed commercial category | Confirm actual trade-advertising/commercial-catalogue content and purpose separately from bound appearance; verify the same complete physical reference, uncoated stock, wet sheetfed setting, process-free plate and milled-spine nonreactive EVA route from real job/equipment/supplier/acceptance records. Actual machine configuration, paper/ink/glue SKU, formulas and quantities remain required; supplier capability alone cannot complete the dataset. CPC32620 covers only the narrower physical subset; its accepted edge does not establish whole-leaf coverage or scientific methodology approval. | `unsd-cpc3-2025`; `epa-eiip-2002`; `mm-antaro-perfect-binding` |\n| `v_balance` | factory physical ledger | Reconcile beginning inventory plus purchases with accepted books, outgoing paper/dust/liquids/solvents/plates/glue, emissions and ending inventory at measured moisture and composition. Retained ink/glue/powder/carbon are included in complete bound publications. Record discrepancies and tolerances from calibration/measurement uncertainty, with no default yield or loss percentage. | `epa-eiip-2002`; `epa-ctg-2006` |\n| `v_voc_species` | organic material and air account | Reconcile each measured constituent entering ink/fount/wash/glue against product retention, liquid/cloth waste, stocks and outdoor release. Material SDS is a survey input, not an emission factor. TVOC as carbon or calibration-gas equivalent is QA evidence; convert with demonstrated response/composition before deriving species masses. Do not add the aggregate to its constituent sum or treat an uncharacterised remainder as a known elementary chemical. | `epa-method18-2025`; `epa-method25a-2017`; `wadden-voc-1995` |\n| `v_particles_carbon` | dust and combustion | Use disjoint PM2.5, PM2.5–10 and PM>10 masses after control; collected dust is not airborne mass. Document filterable/condensable definitions, NOx quantity basis and separate N2O. Distinguish mineral-distillate, vegetable-oil, paper and glue fossil/biogenic carbon; biogenic CO2 cannot be deleted and retained carbon is not released carbon. | `epa-gas-ap42-2026`; `heidelberg-powder-2010` |\n| `v_identity_and_gaps` | all exchanges | Verify actual constituent/grade, supplier route, flow type, direct-read reference property, unit group, medium and source metadata. Missing UUID, ingredient proportions, species mass, gas volume convention, NOx-equivalent basis or provider link remains an explicit gap; it is not zero, a neighbouring product, or a complete background. Separate measured absence from missing observation. |  |\n\n"
