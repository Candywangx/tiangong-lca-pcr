allocation_rules:
  - rule_id: a_separate_ledger
    applies_to: "all quantities"
    rule: "First retain unallocated physical paper/water/chemical/carbon balances and matched internal transfers. Allocate only the attributable environmental-load account. The accepted physical books and exported waste masses are not mechanically multiplied by a burden share."
    source_ids: []
  - rule_id: a_job_assignment
    applies_to: "multi-title operations"
    rule: "Use job-specific purchases/meters first. Separate setup/make-ready, printing, binding, cleaning and standby. Allocate remaining shared activities by measured causal drivers such as attributable press runtime, printed sheet area/passes or heat service, documenting numerator, complete denominator and consistency. Topic, selling price or printed page count alone is not evidence of equal production demand."
    source_ids:
      - epa-eiip-2002
  - rule_id: a_waste_receivers
    applies_to: "paper and plate recovery"
    rule: "Declare each stream composition, receiver and burden ownership. Sales of paper trim or plates do not automatically turn waste into a co-product or create an avoided virgin-material credit. Any justified recycling/substitution scenario is separately disclosed with the affected burden ledger and no duplicated treatment or credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_finished
      process_id: "book_manufacture"
      flow_role: "accepted bound paper publications"
      record_type: "future foreground measured record"
      raw_fields: "batch/publication design; actual content/category identity; independently verified commercial purpose and content where claimed; printed-notation and opening/page-turning acceptance for score designs; finished dimensions; page count; accepted copies; sampled/measured net publication masses; moisture; binding pull/handling result; packaging tare"
      collection_method: "Weigh accepted complete bound paper publications with calibrated scales after trimming; retain sampling design and lot reconciliation, exclude dispatch packaging. Count-to-mass uses same-design measured mean and accepted copies, checked against lot mass."
      unit: "kg; copies"
      frequency: "each production lot"
      temporal_coverage: "Declared reporting period and representative actual job/cycle coverage"
      site_scope: "Actual printer, referenced design and attributable outsourced stages only if declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs/invoices/assays, calibration, supplier specification, reconciliation and uncertainty"
    - protocol_id: cp_materials
      process_id: "book_manufacture"
      flow_role: "paper plates powder packaging"
      record_type: "future foreground measured record"
      raw_fields: "job and stage; supplier/grade; receipt/reissue; beginning/end stock; sheets/count; actual mass; grammage; dimensions; fibre/coating/polymer; moisture; receiver"
      collection_method: "Use calibrated weighing plus invoices and stage/job issue records; reconcile paper stock with printed-sheet, cover, bookblock and trimming ledgers; measure plate and packaging mass rather than generic count factors."
      unit: "kg"
      frequency: "each receipt and job; stock period closure"
      temporal_coverage: "Declared reporting period and representative actual job/cycle coverage"
      site_scope: "Actual printer, referenced design and attributable outsourced stages only if declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs/invoices/assays, calibration, supplier specification, reconciliation and uncertainty"
    - protocol_id: cp_formulations
      process_id: "book_manufacture"
      flow_role: "ink fount wash constituents"
      record_type: "future foreground measured record"
      raw_fields: "job/colour/material batch; supplied mass/volume; current SDS/CAS and technical formulation; active concentration; carrier water; solvent and vegetable-oil origin; density/temperature; retention in publications/waste; stock movements"
      collection_method: "Weigh purchases/issues/returns and containers; get complete supplier constituent/carbon-source records, including constituents omitted from public SDS. Use assays or documented measured composition. Track ink as complete supplied formulations and split fount chemical components with carrier water once; demonstrate full-formulation versus component background ownership."
      unit: "kg; m3"
      frequency: "each job/material change; inventory closure"
      temporal_coverage: "Declared reporting period and representative actual job/cycle coverage"
      site_scope: "Actual printer, referenced design and attributable outsourced stages only if declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs/invoices/assays, calibration, supplier specification, reconciliation and uncertainty"
    - protocol_id: cp_binding
      process_id: "book_manufacture"
      flow_role: "EVA adhesive"
      record_type: "future foreground measured record"
      raw_fields: "job; EVA spine and side glue grade/composition; issued/recovered/purged mass; glue-pot/startup temperature; heater meter; binder speed/setup; paper residue; accepted binding quality"
      collection_method: "Weigh actual supplied thermoplastic glue and segregated purges, log actual melt/standby cycle and energy; reconcile glue retained in accepted/rejected bound publications. No universal glue coat thickness, thermal setting or consumption."
      unit: "kg; MJ"
      frequency: "each job and melt-pot cleaning"
      temporal_coverage: "Declared reporting period and representative actual job/cycle coverage"
      site_scope: "Actual printer, referenced design and attributable outsourced stages only if declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs/invoices/assays, calibration, supplier specification, reconciliation and uncertainty"
    - protocol_id: cp_utilities
      process_id: "book_manufacture"
      flow_role: "electricity and conditional gas separately"
      record_type: "future foreground measured record"
      raw_fields: "stage/device/job; meter start/end; electric kWh/voltage; grid/year/provider; gas volume; temperature/pressure; composition/wet-dry/Z; calorific basis; burner/heating function; runtime and shared denominator"
      collection_method: "Use calibrated submetering and reconciled bills for all stages, including CTP, make-ready, compressors, cooling and glue melting/standby. Meter actual auxiliary gas heat separately. Prove supplier gas-volume compatibility and document causal shared-load assignment; no heatset or UV electricity assumed."
      unit: "MJ; kWh; m3"
      frequency: "metered by job/stage and reconciled each bill period"
      temporal_coverage: "Declared reporting period and representative actual job/cycle coverage"
      site_scope: "Actual printer, referenced design and attributable outsourced stages only if declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs/invoices/assays, calibration, supplier specification, reconciliation and uncertainty"
    - protocol_id: cp_water
      process_id: "book_manufacture"
      flow_role: "separately supplied water and actual water vapour"
      record_type: "future foreground measured record"
      raw_fields: "fountain and wash meter; water source/treatment; volume; density/temperature; carrier water; incoming paper moisture; inlet/outlet ambient humidity/airflow; condensate; combustion-water provenance; changes/bleeds; evaporation; product/waste water; stock"
      collection_method: "Meter added water and weigh/sample formulations and outgoing liquids. Reconcile carrier water against chemical inputs and prevent double counting in purchased aqueous formulations. Record water balance even when no direct abstraction/discharge occurs."
      unit: "kg; m3"
      frequency: "each filling/bleed and lot"
      temporal_coverage: "Declared reporting period and representative actual job/cycle coverage"
      site_scope: "Actual printer, referenced design and attributable outsourced stages only if declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs/invoices/assays, calibration, supplier specification, reconciliation and uncertainty"
    - protocol_id: cp_wastes
      process_id: "book_manufacture"
      flow_role: "each outgoing waste stream"
      record_type: "future foreground measured record"
      raw_fields: "bin/stream/stage/job; physical state; whole as-exported mass; liquid volume/density/temperature; water-specific fraction and independently verified solids; paper/ink/EVA/polymer/metal/solvent composition; measured tare/net mass; internal returns; dispatch/receiver; treatment and legal transfer record"
      collection_method: "Weigh each segregated actual stream at its transfer point and retain receiver acceptance. Close stocks and internal return records before summing dispatch; separate paper dust from paper trim and airborne release. Waste type is established by composition/state, not only by a database label."
      unit: "kg"
      frequency: "each collection/dispatch; inventory closure"
      temporal_coverage: "Declared reporting period and representative actual job/cycle coverage"
      site_scope: "Actual printer, referenced design and attributable outsourced stages only if declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs/invoices/assays, calibration, supplier specification, reconciliation and uncertainty"
    - protocol_id: cp_emissions
      process_id: "book_manufacture"
      flow_role: "each actual air species and particle bin"
      record_type: "future foreground measured record"
      raw_fields: "job/stage/source/outlet; supplier constituent survey; CAS; sampling interval; exhaust/inlet airflow; inlet and outlet concentration; T/P/humidity; dry/wet/normal basis; calibration gas/response/recovery; detection limit; PM cut/filterable-condensable basis; NOx definition; controls; fossil/biogenic carbon"
      collection_method: "Measure representative setup, steady operation, cleaning, storage and heat cycles. Use competent species analysis validated for the actual matrix, ventilation balance for fugitive outlets and separately measured combustion outlets. Include inlet ambient subtraction only with compatible inlet/outlet bases and airflow closure; document residuals/LOD instead of assigning missing species zero. Capture quality records and assign PM bins without overlap."
      unit: "kg; mg/m3; m3/time"
      frequency: "representative surveys across actual operating cycles and reporting period"
      temporal_coverage: "Declared reporting period and representative actual job/cycle coverage"
      site_scope: "Actual printer, referenced design and attributable outsourced stages only if declared"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original logs/invoices/assays, calibration, supplier specification, reconciliation and uncertainty"
  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "Normalized physical exchange = compatible unallocated measured period/lot exchange / accepted net publication mass in kg; retain raw amount before allocation."
      inputs:
        - "actual exchange"
        - "cp_finished accepted kg"
        - "causal burden assignment"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: copy_to_mass
      applies_to: "cp_finished"
      rule: "Accepted kg = accepted copy count × same-design calibrated measured mean net copy mass in kg; verify against lot weighing and moisture."
      inputs:
        - cp_finished
      output: "accepted net lot mass"
      source_ids: []
    - id: component_mass
      applies_to: "actual component rows"
      rule: "Component mass = actual supplied formulation mass × actual measured/verified mass fraction; convert volume only using the actual formulation density at recorded conditions. Carrier water and complete-background ownership are reconciled once."
      inputs:
        - cp_formulations
        - cp_water
      output: "actual component and carrier masses"
      source_ids:
        - epa-ctg-2006
    - id: vent_species_mass
      applies_to: "each measured species"
      rule: "Release species mass = integrated outlet flow × outlet species concentration minus integrated matched incoming species mass, converted to kg on consistent temperature/pressure/humidity bases. Sum distinct outlets and time windows only; retain recovery/response and ventilation-closure evidence."
      inputs:
        - cp_emissions
      output: "outdoor species kg before normalization"
      source_ids:
        - epa-method18-2025
        - wadden-voc-1995
    - id: constituent_balance
      applies_to: "each actual organic constituent"
      rule: "Beginning stock + supplied constituent = retained in accepted and rejected bound publications + transferred waste constituent + outdoor constituent release + ending stock, with measured process transformations explicitly reconciled. A residual is an uncertainty/gap, not an identified emission."
      inputs:
        - cp_formulations
        - cp_wastes
        - cp_emissions
      output: "physical constituent balance and discrepancy"
      source_ids:
        - epa-eiip-2002
        - epa-ctg-2006
  data_quality_requirements:
    - id: dq_construction
      applies_to: "reference product"
      requirement: "Verify actual paper/cover/binding/print construction, complete bound-publication state and textual/pictorial/music-notation/commercial content category; printed scores require actual notation and design-specific opening/page-turning acceptance. A music-themed prose book is not automatically printed music; catalog options are not site verification."
      evidence: "job specification, supplier and acceptance records"
    - id: dq_coverage
      applies_to: "all rows and stages"
      requirement: "No unobserved exchange is assigned zero. Reconcile all actual extra constituents, aids, treatment chemicals, utilities, waste and emission species as separate atomic rows before declaring a concrete dataset complete."
      evidence: "meter and constituent survey, physical balances and explicit gaps"
    - id: dq_source_scope
      applies_to: "external evidence"
      requirement: "Preserve historical/source-specific route and grade limitations. Classification, identity rows, eco claims, abstract-only studies and BREF BAT values are not generic manufacturing recipes or emission data."
      evidence: "original source locators, scope assessment and supplier evidence"
    - id: dq_ledgers
      applies_to: "physical and burden accounts"
      requirement: "Keep complete mass/water/carbon inventory, internal stage linkage and separately assigned burdens over one design/period. Record shared-load denominator and measurement uncertainty; separate source identity from provider/quantity compatibility."
      evidence: "calibrated originals, receiver records and allocation sensitivity"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference dataset"
    rule: "Verify the broad Printed Matter UUID only for the declared complete bound-paper-publication subset, with actual content category, physical qualifiers, accepted net mass, one final output and the same denominator in both languages. Ordinary books, printed music-score books and same-construction commercial catalogues/trade-advertising booklets share this reference extent only under the same manufacturing construction; do not substitute an educational-only identity for a non-educational book or score. Disclose source CPC32690 and unrelated 3D commentary and re-check provider scope; no printed-matter average, postal service, intermediate sheet or prototype is implied."
    source_ids:
      - unsd-cpc3-2025
  - rule_id: v_commercial_scope
    applies_to: "claimed commercial category"
    rule: "Confirm actual trade-advertising/commercial-catalogue content and purpose separately from bound appearance; verify the same complete physical reference, uncoated stock, wet sheetfed setting, process-free plate and milled-spine nonreactive EVA route from real job/equipment/supplier/acceptance records. Actual machine configuration, paper/ink/glue SKU, formulas and quantities remain required; supplier capability alone cannot complete the dataset. CPC32620 covers only the narrower physical subset; its accepted edge does not establish whole-leaf coverage or scientific methodology approval."
    source_ids:
      - unsd-cpc3-2025
      - epa-eiip-2002
      - mm-antaro-perfect-binding
  - rule_id: v_balance
    applies_to: "factory physical ledger"
    rule: "Reconcile beginning inventory plus purchases with accepted books, outgoing paper/dust/liquids/solvents/plates/glue, emissions and ending inventory at measured moisture and composition. Retained ink/glue/powder/carbon are included in complete bound publications. Record discrepancies and tolerances from calibration/measurement uncertainty, with no default yield or loss percentage."
    source_ids:
      - epa-eiip-2002
      - epa-ctg-2006
  - rule_id: v_voc_species
    applies_to: "organic material and air account"
    rule: "Reconcile each measured constituent entering ink/fount/wash/glue against product retention, liquid/cloth waste, stocks and outdoor release. Material SDS is a survey input, not an emission factor. TVOC as carbon or calibration-gas equivalent is QA evidence; convert with demonstrated response/composition before deriving species masses. Do not add the aggregate to its constituent sum or treat an uncharacterised remainder as a known elementary chemical."
    source_ids:
      - epa-method18-2025
      - epa-method25a-2017
      - wadden-voc-1995
  - rule_id: v_particles_carbon
    applies_to: "dust and combustion"
    rule: "Use disjoint PM2.5, PM2.5–10 and PM>10 masses after control; collected dust is not airborne mass. Document filterable/condensable definitions, NOx quantity basis and separate N2O. Distinguish mineral-distillate, vegetable-oil, paper and glue fossil/biogenic carbon; biogenic CO2 cannot be deleted and retained carbon is not released carbon."
    source_ids:
      - epa-gas-ap42-2026
      - heidelberg-powder-2010
  - rule_id: v_identity_and_gaps
    applies_to: "all exchanges"
    rule: "Verify actual constituent/grade, supplier route, flow type, direct-read reference property, unit group, medium and source metadata. Missing UUID, ingredient proportions, species mass, gas volume convention, NOx-equivalent basis or provider link remains an explicit gap; it is not zero, a neighbouring product, or a complete background. Separate measured absence from missing observation."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Route-specific book manufacture input in an explicitly compatible downstream model; completed production dataset only after actual data/bases/gaps review."
  allowed_use: "The declared complete paperback construction at factory gate, for the covered textual/pictorial/music-notation and verified same-construction commercial catalogue/trade-advertising categories, with actual compatible supplier backgrounds, complete foreground measurements and disclosed uncertainty. Each category retains its actual content identity and design-specific acceptance."
  excluded_use: "Universal printed-matter/book/children/toy/hardcover/music/advertising average; equal learning/reading/performance/advertising-effect service claim; 3D/prototype, postal/licensing/performance services, non-paper or loose-score forms, alternative printing/cure/binding routes; ready-to-use quantitative dataset inferred from UUIDs or historical examples."
  required_metadata: "All reference qualifiers, providers/geography/year, actual grade/formulations, study boundary, upstream/treatment ownership, allocation and collection period."
  required_quality_disclosure: "Measurement/sampling uncertainty, species/PM/media coverage, physical-balance residuals, unresolved UUIDs and provider bases, excluded scope and performed/skipped checks."
  update_trigger: "Change in cover/text stock, ink/wash/fount/EVA formulation, printing/drying/binding route, design/period/provider, capture/treatment, acceptance or identity evidence."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "PDF/printed pp.148–149,151 and152; book/content/use, printed music/folio/book/electronic/service and trade-advertising/commercial-catalogue labels only, not production routes."
  - id: "epa-ctg-2006"
    type: "official_guidance"
    reference: "EPA Control Techniques Guidelines for Offset Lithographic Printing and Letterpress Printing, EPA-453/R-06-002, September 2006; https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "Section IV.A, printed pp.6–8/PDF12–14 and comparative IV.B/source overview printed p.9/PDF15; ink, fountain, wash routes and separate source accounting. Historical retention/regulatory numbers are not default LCI values."
  - id: "epa-eiip-2002"
    type: "official_guidance"
    reference: "EPA EIIP Volume II Chapter 15, Preferred and Alternative Methods for Estimating Air Emissions from Printing, Packaging and Graphic Arts, May 2002; https://www.epa.gov/sites/default/files/2015-08/documents/ii15_may2002.pdf"
    used_for: "Section2.1.1/PDF14–15 and material-balance sections/PDF27,31; conventional sheetfed books/brochures process, original Figure15.2-1 and record accounting, not generic factors/speciation."
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "JRC Best Available Techniques Reference Document for the Production of Pulp, Paper and Board, 2015; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Sections7.1.4/PDF703 and7.1.10/PDF708, BAT49/50/PDF849 (printed811), including coating-effluent limits outside this uncoated-book method; upstream paper production/broke/cutting/effluent coverage only. Not a book-printing, VOC or spine-milling factor source."
  - id: "mm-antaro-perfect-binding"
    type: "literature"
    reference: "Müller Martini Antaro perfect binder official product documentation; https://mullermartini.com/en/product/antaro/"
    used_for: "Offset jobs and softcover brochures (official page paragraphs beginning “Combined with a gathering machine”, “The perfect binder features” and “Depending on its configuration”); gathering, spine milling, EVA/PO/PUR options and three-knife trimming; select only non-reactive EVA softcover, no catalogue speed/thickness default."
  - id: "henkel-eva-bookbinding"
    type: "literature"
    reference: "Henkel TECHNOMELT GA485D official product documentation; https://next.henkel-adhesives.com/us/en/products/industrial-adhesives/central-pdp.html/technomelt-ga-485d/SAP_IB-95677.html"
    used_for: "Softcover spine hotmelt compatibility example; no universal formulation, amount, heating temperature or claimed supplier match."
  - id: "kodak-sonora-process-free"
    type: "literature"
    reference: "Kodak SONORA Process Free Plates Sustainability datasheet; https://www.kodak.com/content/pdfs/print/KODAK-SONORA-Process-Free-Plates-Sustainability-datasheet-EN.pdf"
    used_for: "PDF1; no separate plate-processing chemicals/water for that route; plate manufacture, on-press coating fate and make-ready remain included."
  - id: "walsworth-book-printing"
    type: "literature"
    reference: "Walsworth Commercial Book Printing official capabilities; https://www.walsworth.com/book-printing"
    used_for: "Actual producer offers sheetfed, web/digital and binding/finish options across educational, juvenile and technical titles. Options do not prove a single factory recipe or that all titles follow this PCR."
  - id: "huber-conventional-ink"
    type: "literature"
    reference: "hubergroup RAPIDA ECO official product documentation; https://www.hubergroup.com/us/en/product-finder/product/rapida-eco"
    used_for: "Conventional sheetfed absorbent-substrate and mineral-oil-free/IPA-free alternatives. Neither claim establishes soybean feedstock, a complete recipe or zero emissions."
  - id: "wadden-voc-1995"
    type: "literature"
    reference: "Wadden et al., Determination of VOC Emission Rates and Compositions for Offset Printing, Journal of the Air & Waste Management Association45,547–555(1995); https://stacks.cdc.gov/view/cdc/202943/cdc_202943_DS1.pdf"
    used_for: "PDF2–3 and6; DOI10.1080/10473289.1995.10467386; three historical mixed-process shops. Ventilation/species methodology and survey candidates only, not modern universal recipes, rates, proportions or per-book burdens."
  - id: "intaglio-fountain-msds"
    type: "literature"
    reference: "Intaglio Printmaker Fountain Solution Material Safety Data Sheet; https://intaglioprintmaker.com/wp-content/uploads/2022/08/Fountain-Solution-MSDS.pdf"
    used_for: "PDF1, sections1–2; undated historic ready-to-use small-offset example, CAS107-21-1 with unavailable concentration. Not proof of industrial-machine grade or recipe."
  - id: "epa-method18-2025"
    type: "official_guidance"
    reference: "EPA Method18, Gaseous Organic Compound Emissions by Gas Chromatography, 1 April2025 web copy; https://www.epa.gov/system/files/documents/2025-04/m-18-04012025_0.pdf"
    used_for: "Sections1–2/PDF1–2; species identification, calibration and humidity correction with stated volatility/polymerisation limitations. Method design must be validated for the actual matrix; not proof of measured emissions here."
  - id: "epa-method25a-2017"
    type: "official_guidance"
    reference: "EPA Method25A, Total Gaseous Organic Concentration Using a Flame Ionization Analyzer, 3 August2017 web copy; https://www.epa.gov/sites/default/files/2017-08/documents/method_25a.pdf"
    used_for: "Sections1–2/PDF1; calibration-gas or carbon equivalents are distinct from species mass. No automatic universal response/conversion."
  - id: "epa-gas-ap42-2026"
    type: "official_guidance"
    reference: "EPA AP42 Section1.4 Natural Gas Combustion, October2026 corrected public copy; https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "Sections1.4.1–1.4.3/PDF1–3; actual auxiliary gas boilers/furnaces and equipment-dependent species. No boiler factor imported into print drying, no average fuel/calorific value or factor adopted."
  - id: "heidelberg-powder-2010"
    type: "literature"
    reference: "Heidelberg News270(2010), Small Grains that Have a Big Effect; https://www.heidelberg.com/global/media/en/global_media/company___publications/heidelberg_news/editorial/pdf_10/hn_270.pdf"
    used_for: "PDF/printed53; starch, sugar and calcium-carbonate alternatives and coated powder differences. Only actual declared starch component here; no particle distribution, application rate or airborne fraction taken as a default."
  - id: "buehnen-eva-decomposition"
    type: "literature"
    reference: "BÜHNEN Hotmelt Adhesives with product code A (Ethylenvinylacetate), SDS4 January2018 version2; https://www.buehnen.de/files/datenblaetter/Safety_Data_Sheet_EVA-A.pdf"
    used_for: "PDF4 section10.6; EVA-class decomposition can yield acetic acid and hydrocarbons, only a survey condition requiring actual grade/thermal history. Not proof of positive emissions from the selected bookbinding glue; no recipe/temperature/factor adopted."
  - id: "songburd-music-print-options"
    type: "literature"
    reference: "Songburd Music Print Options; https://songburdconnect.com/print-options/"
    used_for: "Actual score/parts, perfect-bound books, saddle-stitch, coil and folio options. Structural possibility only; does not prove that producer uses EVA/wet sheetfed offset, any recipe/quantity or lay-flat performance."
  - id: "pgm-advertising-catalogues"
    type: "literature"
    reference: "Poligrāfijas grupa Mūkusala, Advertising Materials and Catalogues; https://www.pgm.lv/en/services/advertising-materials-and-catalogues/"
    used_for: "First-party “Possibilities” and “Equipment” sections describe heatset/web advertising/catalogues with perfect-binder and saddle-stitch alternatives. Negative applicability context only: not proof of this sheetfed/nonreactive-EVA supplier route, job, paper/adhesive SKU or quantities; no advertised capacity/grammage/defaults adopted."
