review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  independent_methodology_review: "Prior independent full-source, atomic identity, bilingual family and native measurement-chain review completed after bounded repairs. This educational-textbook scope narrowing requires independent review; candidate authored methodology retained. Scientific publication approval and translation review remain pending. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; author checks do not accept an edge."
  reference_configuration:
    flow_uuid: "a07593ed-90ed-4236-b90d-7a41ec14871c"
    scope: "One 1 kg accepted complete printed educational textbook for students or teachers in formal study programmes, including every retained page/cover/ink/nonreactive-EVA/powder component, limited to the declared sheetfed/uncoated/unlaminated paperback construction."
    educational_scope_gate: "Verify primary educational purpose in a formal study programme, course/learning structure, edition/revision and student/teacher audience from publisher/job/content records. Verify text, summaries, exercises and answers only where actually specified. Other book, directory, music and advertising categories are excluded even with the same route."
    supplier_background_guard: "Identity only; actual complete-book route/grade/quantity and supplier backgrounds must independently match. No generic Printed Matter manufacturing average is approved."
  unresolved_flow_rows:
    - "plate"
    - "glycol_input"
    - "butoxyethanol_input"
    - "dpgme_input"
    - "sodium_hydroxide"
    - "gum_arabic"
    - "cleaner"
    - "box"
  flow_identity_conditions:
    plate: "Purchased finished photosensitive-coated aluminium plate, imaged by CTP and developed on press. A cut/grained aluminium substrate is not the finished plate. Capture plate count, measured mass, supplier coating/grade, make-ready sheets and coating fate; no developer bath or plate-rinse inputs in this selected route."
    ink_black: "One as-supplied black conventional paste-ink formulation used on the text or cover. Record each job/colour separately, supplier grade, SDS/CAS constituents, mineral distillate, soybean/linseed oil, resin/pigment/wax shares and carbon origin. A soy or mineral-oil-free claim is not a complete recipe or proof of zero VOC. Do not separately add ingredients already in a linked full-ink background. Applicable only if this colour is used."
    ink_cyan: "One as-supplied cyan conventional paste-ink formulation used on the text or cover. Record each job/colour separately, supplier grade, SDS/CAS constituents, mineral distillate, soybean/linseed oil, resin/pigment/wax shares and carbon origin. A soy or mineral-oil-free claim is not a complete recipe or proof of zero VOC. Do not separately add ingredients already in a linked full-ink background. Applicable only if this colour is used."
    ink_magenta: "One as-supplied magenta conventional paste-ink formulation used on the text or cover. Record each job/colour separately, supplier grade, SDS/CAS constituents, mineral distillate, soybean/linseed oil, resin/pigment/wax shares and carbon origin. A soy or mineral-oil-free claim is not a complete recipe or proof of zero VOC. Do not separately add ingredients already in a linked full-ink background. Applicable only if this colour is used."
    ink_yellow: "One as-supplied yellow conventional paste-ink formulation used on the text or cover. Record each job/colour separately, supplier grade, SDS/CAS constituents, mineral distillate, soybean/linseed oil, resin/pigment/wax shares and carbon origin. A soy or mineral-oil-free claim is not a complete recipe or proof of zero VOC. Do not separately add ingredients already in a linked full-ink background. Applicable only if this colour is used."
    butoxyethanol_input: "Conditional actual fountain/cleaning chemical component, CAS 111-76-2; require current supplier constituent disclosure, supplied quantity, concentration and purity. This row is active-component mass, not the entire aqueous preparation. Include its carrier water once and do not duplicate a full preparation background. These examples do not prescribe a fountain recipe; any other actual constituent needs its own specific row and identity/basis review."
    dpgme_input: "Conditional actual fountain/cleaning chemical component, CAS 34590-94-8; require current supplier constituent disclosure, supplied quantity, concentration and purity. This row is active-component mass, not the entire aqueous preparation. Include its carrier water once and do not duplicate a full preparation background. These examples do not prescribe a fountain recipe; any other actual constituent needs its own specific row and identity/basis review."
    phosphoric_acid: "Conditional actual fountain/cleaning chemical component, CAS 7664-38-2; require current supplier constituent disclosure, supplied quantity, concentration and purity. This row is active-component mass, not the entire aqueous preparation. Include its carrier water once and do not duplicate a full preparation background. These examples do not prescribe a fountain recipe; any other actual constituent needs its own specific row and identity/basis review."
    sodium_hydroxide: "Conditional actual fountain/cleaning chemical component, CAS 1310-73-2; require current supplier constituent disclosure, supplied quantity, concentration and purity. This row is active-component mass, not the entire aqueous preparation. Include its carrier water once and do not duplicate a full preparation background. These examples do not prescribe a fountain recipe; any other actual constituent needs its own specific row and identity/basis review."
    gum_arabic: "Conditional actual hydrophilic gum component in fountain solution; supplier dry solids determine mass. A solution UUID without a known concentration is not a dry-polymer input. Track actual buffer salts and biocides individually if present; this row does not stand for all fountain additives."
    cleaner: "Conditional actual supplied conventional-ink blanket/roller wash. Record supplier SDS, hydrocarbon UVCB/CAS and analytical species, aqueous/emulsifier content, distillation range and fossil/biogenic origin. A printhead cleaner or a heatset-only product is not this flow. If vegetable-esters are used, replace with a separately verified specific formulation and preserve upstream crop/ester production; no assumption that it shares the petroleum identity."
    box: "Conditional actual dispatch carton, with measured complete box mass, grade and virgin/recycled fractions. A folding carton or a box identity fixing a different fibre recipe is not interchangeable. Include supplier box manufacture once; shipping packaging is excluded from net book reference mass."
    aluminium_plate_waste: "Spent metal-backed offset plate, with actual coating/ink residue and receiving recycler route. Raw fabrication scrap, flexographic photopolymer plate and Bayer slag are different identities; no aluminium-only mass assumed for the whole plate."
    solvent_rag: "Actual outgoing wiping-cloth stream; record dry cloth and retained ink/solvent mass, sealed storage, evaporative loss before dispatch, laundering/disposal receiver and whether the cloth is reusable. No default solvent-retention factor."
    cleaner_waste: "Actual separately collected used wash with solvent, ink and any water; receiver identity and treatment are required. It is not used lubricating oil or ethyl-acetate concentrate. Do not duplicate ink segregated to the ink-waste stream."
    fountain_waste: "One outgoing liquid stream, measured with actual water, IPA/glycol, salts and ink contamination and receiver sewer/offsite route. It is not paper-mill wastewater, silicon-process aqueous output or manganese-slag washing wastewater. Transfer to treatment is a waste exchange, not direct freshwater emission."
    glue_waste: "Actual non-reactive EVA formulation purge or rejected glue, including actual paper/ink contamination. No substitution of cleaned waste PE, PUR residues or unspecified wafer hazardous waste. Internal returned glue remains inside the physical balance, not an external waste flow."
    pe_waste: "Conditional actual separate PE film trim/reject stream leaving for treatment; record polymer, dirt/ink contamination and receiver. A cleaned mechanically recycled PE record includes a different delivered state and is not used as this untreated waste identity."
    wipe_cloth: "Conditional actual supplied cotton wiping cloth for manual conventional-press cleaning. Weigh dry new/reissued cloth separately from retained ink/solvent and returned reusable cloth. Confirm fibre composition/grade; polyester or composite cloth needs its own verified material row. Output contaminated cloth includes only this material and its measured retained constituents, without counting the same material twice."
    powder_waste: "Conditional separately collected outgoing unmodified-starch spray-powder residue, with actual paper/ink contamination and receiver. Weigh independently from paper milling dust and powder retained on books; internal reuse is not outgoing waste and airborne residuals belong to the disjoint particulate rows. Do not substitute a starch product or a mixed chemically incompatible waste."
    fount_carrier_water: "Conditional water physically delivered within purchased fountain concentrate or its aqueous chemical preparations when the fountain inventory is modelled by components. Determine actual water mass and grade from complete supplier composition and delivery records; this is distinct from separately purchased tap water. Do not duplicate this water in a complete-concentrate background or in the tap-water meter row. If all fountain components arrive dry or water-free, retain documented absence rather than assume a quantity."
  provider_basis_debts:
    - "Every supplied product/waste needs actual grade, delivered state, supplier treatment and amount-compatible background; UUID identity is not a complete dataset."
    - "Natural gas m3 requires supplier T/P, wet/dry composition, compressibility and delivered volume compatibility."
    - "NOx Mass/kg does not establish NO2-equivalent mass; monitoring/exchange/LCIA basis remains pending for a real dataset."
    - "Ethylene glycol candidate has an explicit electrolyte-solvent name route. It is not adopted for the fountain component; pure-substance generalComment does not waive the hard use constraint."
  source_metadata_debts:
    - row_id: "pe_wrap"
      uuid: "e64eb06c-6dc9-45f1-b003-3dc6c44b27e2"
      issue: "Name/CAS9002-88-4/comment identify PE film but CPC29220 is misclassified. Physical identity conditionally retained; supplier/source classification clarification required."
    - row_id: "finished_book"
      uuid: "a07593ed-90ed-4236-b90d-7a41ec14871c"
      issue: "Source CPC32690 is inconsistent with several qualified book/music categories. Synonyms and route describe printed paper or other substrates, not a mandatory3D process; trailing Paper3D prototype sentence is unrelated/misplaced. Mailing-heavy general wording is not postal-service identity. Preserve these defects, require source/provider clarification, and never report full source-metadata verification or correct classification."
  rejected_identity_constraints:
    - "Generic Ink92ae1ece has English oil-ink versus Chinese water-based ink inconsistency; not selected."
    - "Planographic ink2a6023d7 is constrained to optical assembly. Broad solvent-flat ink38e48719 has positive offset/lithographic identity and no hard heatset name route; its generic heat-classification/glycol-ester examples are not transferred as a recipe or forced dryer. Actual conventional oil-based paste SKU/setting/formulation/provider compatibility remains required."
    - "Soy ink identity does not demonstrate the actual grade or oil composition of every conventional ink; not substituted by default."
    - "PS Plate3192f328 specifies thermoplastic processing; cut/grained aluminium substrate446def62/33052b77 lacks the finished photosensitive-coated plate state."
    - "Phosphoric acid74839d3b uses Volume and conflicts between anhydrous and85% solution wording; not used as active-component Mass."
    - "DPGME83d41fbd names waste disposal; sodium-hydroxide e0abcced fixes95–98% commercial purity, not an arbitrary active component."
    - "Printhead cleaners are not blanket washes; broad White-spirit5fb93398 has a conflicting Chinese baseName, not a complete wash formulation."
    - "Corrugated box4f197bec fixes16.6% primary/83.4% recycled fibre; no universal shipping recipe imported."
    - "Cleaned mechanical-recycling waste-PE7e78f0a8 is not untreated dispatch-film waste."
    - "Wastewater from paper mills, silicon processing, hatcheries or manganese-slag washing is not spent fountain solution."
    - "Sulfur oxides and cumulative PM10 do not replace sulfur dioxide or PM>10."
  quantity_policy: "Only reference normalization and exact unit conversions are fixed. No measured factory values, per-book mass, recipe fractions, yield, retention or emission factor are claimed."
  classification_review:
    status: "pending independent controller acceptance"
    proposed_relation: "narrower"
    reason: "Only CPC3.0:32210 is declared, and only its complete printed educational-textbook subset using this paper/printing/binding route is covered. Formal-study purpose is mandatory; the CPC also includes forms/routes outside this method. No whole-leaf or accepted-edge claim; controller must independently review and serially replace or return prior shared edges to pending."
  reference_identity_history_note: "Earlier educational-only reference was replaced by a separately searched/state100-read broad physical Printed Matter identity during prior family work. The same adopted UUID is retained here only for the newly narrowed complete educational-textbook subset; its broader name does not authorize other content categories."
  bounded_review_identity_limits:
    glycol_input: "No adopted UUID: electrolyte-solvent name route is incompatible with the unverified fountain component; active mass/actual recipe remain required."
    phosphoric_acid: "49c501ce explicit H3PO4 Product/Mass with no concentration/sector route; raw CAS/purity/state and component-vs-solution provider bases remain unreported and require actual evidence."
    wipe_cloth: "dd9f2248 positive cotton fabric/cloth names; raw-cotton CPC01921 and plant comment are source-quality debts, no water-treatment cloth or raw-cotton background."
    fount_carrier_water: "d8ad9111 generic process-water Product/Mass identifies only actual liquid formulation water; supplier grade/treatment and component-background ownership remain required. Not tap-water meter or elementary abstraction."
    "aluminium_plate_waste/solvent_rag/glue_waste/powder_waste": "851fd235 broad industrial solid waste restricted separately to each actual whole physically solid transfer; EVA purge must be cooled solid here. Full retained constituents, wet/dry quantity and receiver required; no pure-material recycling/hazard/treatment default."
    "cleaner_waste/fountain_waste": "bdfc32cf broad waste liquid restricted to each actual separately transferred whole liquid mixture, with compatible volume/density/temperature/water and independently measured solids/other constituents. No dry-solids-only transfer, generic hazard default or direct-water discharge."
    pe_waste: "1cc18dac broad plastic packaging waste is restricted to actual as-generated PE dispatch film, no hard cleaning or recycling route."
    paper_dust_collected: "2a6c9b60 captured industrial dust replaces broad waste-paper location; complete actual cellulose/ink/EVA/moisture and receiver compatibility required. Not an atmospheric release or paper-only dry quantity."
    eva_glue: "3ec33f9f thermoplastic solvent-free hotmelt identity requires actual nonreactive EVA formulation; CPC36270 rubber classification and generic non-toxic/pollution-free marketing remain source-quality debts, not zero-emission evidence."
    water_vapour: "Conditional net outdoor water vapour with ambient humidity/carrier correction, actual paper/formulation moisture, condensate and separately verified combustion-water origin; no all-water evaporation or pure-CH4 default."
  educational_scope_review:
    classification: "CPC3.0:32210 only; narrower physical subset; pending independent controller acceptance."
    content_condition: "Titles primarily for students and teachers in formal study programmes, verified through actual course/learning structure and publisher/job/content records. Workbooks, teachers manuals, resource or interactive materials qualify only as complete printed books within this physical route; no mandatory exercises/answers, learning-effect claim or national textbook standard."
    physical_condition: "Exactly the same uncoated pages, flexible unlaminated printed paper cover, conventional wet sheetfed absorption/oxidation, finished process-free plate and milled-spine nonreactive EVA perfect-bound construction; all existing excluded routes/forms remain excluded."
    source_basis: "Complete UNSD CPC3.0 32210 note, PDF/printed p.148, establishes formal-study purpose and the included material types; it does not prescribe printing, binding or quantities. Prior EPA/Antaro/plate/glue route evidence is retained within its original limits."
    negative_supplier_context: "Retained Songburd and PGM sources describe excluded music/commercial contexts; neither establishes textbook purpose, this supplier configuration, SKU, formula or quantities."
    quantity_and_approval: "Collect actual equipment/job/supplier/paper/ink/glue grade, complete composition, amounts and textbook acceptance. Identity and author checks do not establish factory data, accepted mapping, scientific approval or publication."
  classification_mapping_authority: "Current narrower classification acceptance is governed by classifications/mappings/cpc-3.0-to-pcr.yaml and docs/adr/0317-accept-eva-paperback-educational-textbooks.md. Historical author-stage mapping-status phrases do not override that decision. Independent scientific methodology, translation, provider and site-data approval remain separate and are not granted by this intake."
