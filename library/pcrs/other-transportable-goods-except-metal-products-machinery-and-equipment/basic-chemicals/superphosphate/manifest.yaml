      selected_flow: "Silica/phosphate-bearing SSP scrubber sludge"
      reason: "Search succeeded; generic sludge has a water-treatment-chemical route, while pure calcium-fluoride waste is not the mixed silica/phosphate solids. Specific compatible identity unresolved."
  source_metadata_caveats:
    - "Sulfuric-acid UUID has matching CAS, solution concentration and supply identity, but its explanatory comment wrongly calls SO3 oxidation a manufacture step. No chemical mechanism or quantity is inferred from that sentence."
    - "Broad Dust UUID is conditional physical collected-dust identity; source EN describes industrial dust, ZH comment is generic housekeeping text. Actual phosphate composition and receiver compatibility remain required."
  provider_basis_requirements:
    - "SSP broad identity includes ordinary/single superphosphate; actual powder grade, moisture, soluble/available/total P2O5 and provider product mass basis must be declared; identity comment grade is not adopted."
    - "Acid supply is 93–98% solution before dilution, not pure-acid mass; supplier dataset basis and lot concentration must match."
    - "Rock beneficiation, wet/dry basis and phosphate composition must match selected upstream dataset."
    - "Electrical-energy MJ uses native Net calorific value support. This UUID is CN grid-average 1–35 kV consumption mix to the user; actual geography, voltage and meter/loss boundary require proof. Other geographies require a separately verified compatible flow/provider."
    - "Tap water is m3 of treated production/supply at a water-treatment plant in Hong Kong (HK), conditional on compatible actual supply. Other geographies or treatment require separately verified flow/provider identity; no database screening-density default."
  site_data_requirements: "Actual production campaign, SKU, supplier, output acceptance, composition, mass/water/P/F/C balances, metering and emission speciation are future collection requirements. No site dataset or reviewed methodology is claimed."
