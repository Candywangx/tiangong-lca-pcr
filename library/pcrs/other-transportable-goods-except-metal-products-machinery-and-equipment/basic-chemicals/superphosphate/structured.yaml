          description: "Conditional actual process-attributable water vapour reaching outdoor air, unspecified subcompartment, from acidulation, curing or wet offgas controls after any actual capture/condensation. Reconcile outlet gaseous water with incoming carrier-air moisture on matched gas-quantity and T/P bases. Internal evaporation followed by recovery is not this external exchange. Keep recovered condensate, aqueous purge, product free/structural water and entrained liquid/aerosol water distinct; do not count the same water twice with particulate mass. No positive amount follows from the word evaporation, and zero requires actual absence or a supported net-water reconciliation; missing data remain unresolved. Use cp_water and the common complete-period normalization."
          amount:
            expression: "Collected exchange amount using cp_water, divided by concurrent accepted net SSP mass in kg, per 1 kg reference flow; no default quantity."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_water
              source_ids:
                - ec-lvic-aaf-2007
                - epa-ap42-ssp-1993
            ranges: []
allocation_rules:
  - rule_id: separate_recycle
    applies_to: "ssp_production"
    rule: "Retain internal dust/liquor recycle physically; it is not a co-product and does not duplicate upstream burdens. Disposed residues carry actual treatment burdens, without automatic substitution credits."
    source_ids:
      - ec-lvic-aaf-2007
      - epa-ap42-ssp-1993
  - rule_id: single_mixture
    applies_to: "ssp"
    rule: "Reference product is the complete SSP mixture; calcium sulfate, monocalcium phosphate and moisture are not separate co-products. No other sold product exists in this scope; do not allocate among nutrient components."
    source_ids:
      - ec-lvic-aaf-2007
  - rule_id: shared_utilities
    applies_to: "ssp_production"
    rule: "Prefer submetering/campaign segregation for shared electricity, water and controls; otherwise use documented causal drivers and disclose shared scope/uncertainty. No default revenue split; never scale physical product quantity by a burden share."
    source_ids:
      - agrophos-ssp-process
      - ec-lvic-aaf-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "ssp_production"
      flow_role: "ssp"
      record_type: "weighing/acceptance"
      raw_fields: "campaign; SKU; net dispatch; returns/reacceptance; opening/closing WIP and finished stock; production history and carried inventory burdens; rejects/recycle; moisture; P2O5 forms/bases; free acid; S/Ca; size; impurities/grade"
      collection_method: "Calibrated scales and stock reconciliation; paired laboratory samples and applicable-grade acceptance"
      unit: "kg"
      frequency: "each batch/dispatch"
      temporal_coverage: "same declared period including starts/abnormal operation and cross-period curing"
      site_scope: "declared scoped site, with stock/shared facilities identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; acceptance; detection limits; reconciliation; uncertainty"
    - protocol_id: cp_feed
      process_id: "ssp_production"
      flow_role: "rock; acid"
      record_type: "supply/feed records"
      raw_fields: "provider; lot; receipt/feed amount; stock; acid concentration/impurities; ore moisture/composition/carbon origin/size; dilution water"
      collection_method: "Calibrated weighing/mass meters, receipt assays and stock reconciliation; volume delivery needs measured density/temperature"
      unit: "kg"
      frequency: "each lot/feed"
      temporal_coverage: "same declared period including starts/abnormal operation and cross-period curing"
      site_scope: "declared scoped site, with stock/shared facilities identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; acceptance; detection limits; reconciliation; uncertainty"
    - protocol_id: cp_energy
      process_id: "ssp_production"
      flow_role: "electricity"
      record_type: "submeter records"
      raw_fields: "kWh; voltage; provider/grid period; meter boundary; stages; losses/shared drivers; abnormal operation"
      collection_method: "Stage electrical submeters and supply records; reconcile transformer/background loss boundaries"
      unit: "MJ"
      frequency: "continuous/campaign"
      temporal_coverage: "same declared period including starts/abnormal operation and cross-period curing"
      site_scope: "declared scoped site, with stock/shared facilities identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; acceptance; detection limits; reconciliation; uncertainty"
    - protocol_id: cp_water
      process_id: "ssp_production"
      flow_role: "water; water_vapour"
      record_type: "meter/recycle records"
      raw_fields: "new water m3; use; temperature/density; acid carrier water; stocks; recycle liquor; purge; inlet/outlet gas moisture and matched gas quantities/rates; T/P and wet/dry basis; actual condensate/capture records; separate gas-phase H2O kg; evaporation/product water; free versus structural water and test conditions; independently measured reaction/phase conversion and water formation/consumption"
      collection_method: "Meter new supplied liquid in m3 and reconcile uses; retain circulation separately without adding to supply. For water_vapour, use validated paired outlet gas-moisture/quantity measurements and inlet carrier-air moisture to determine process-attributable gaseous H2O kg after actual recovery. Keep liquid condensate/purge, entrained droplets, product free/structural water, independently evidenced reaction water and stocks separate. Use already integrated gas volume once, or integrate moisture concentration times volumetric flow rate over time. Do not infer evaporation from liquid supply volume or an unexplained balance residual; reconcile uncertainty and retain missing measurements as findings"
      unit: "m3; kg"
      frequency: "continuous/campaign"
      temporal_coverage: "same declared period including starts/abnormal operation and cross-period curing"
      site_scope: "declared scoped site, with stock/shared facilities identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; acceptance; detection limits; reconciliation; uncertainty"
    - protocol_id: cp_waste
      process_id: "ssp_production"
      flow_role: "scrubber_purge; scrubber_sludge; dust_waste"
      record_type: "outbound records/assays"
      raw_fields: "wet mass; dry solids; F/P; acidity; metals/contamination; internal reuse; stock; receiver/treatment route"
      collection_method: "Weigh outbound consignments and reconcile manifests; assay receiver conditions; generated internal amount is not external disposal"
      unit: "kg"
      frequency: "each consignment"
      temporal_coverage: "same declared period including starts/abnormal operation and cross-period curing"
      site_scope: "declared scoped site, with stock/shared facilities identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; acceptance; detection limits; reconciliation; uncertainty"
    - protocol_id: cp_air
      process_id: "ssp_production"
      flow_role: "hf; sif4; pm_fine; pm_mid; pm_coarse; methanethiol"
      record_type: "emission tests/survey"
      raw_fields: "species/compartment; total-F/molecular basis; size; concentration; dry/wet gas volume; T/P; moisture; operating hours; controls/bypass; fugitives; detection limits/uncertainty"
      collection_method: "Integrate post-control concentration with matching gas volume/time by source; quantify fugitives independently; validate species/size methods and use suitable alternatives for saturated wet gas"
      unit: "kg"
      frequency: "representative tests plus annual operating reconciliation"
      temporal_coverage: "same declared period including starts/abnormal operation and cross-period curing"
      site_scope: "declared scoped site, with stock/shared facilities identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; acceptance; detection limits; reconciliation; uncertainty"
    - protocol_id: cp_carbon
      process_id: "ssp_production"
      flow_role: "co2; co2_biogenic"
      record_type: "carbon balance/offgas"
      raw_fields: "ore/acid carbon; carbonate/organic carbon; origin split; retained carbon in product/waste/stocks; measured CO2/gas volume"
      collection_method: "Cross-check assays with gas volume/species measurements; unknown origin stays unresolved; origin labels do not replace measurement"
      unit: "kg"
      frequency: "each campaign assay/representative test"
      temporal_coverage: "same declared period including starts/abnormal operation and cross-period curing"
      site_scope: "declared scoped site, with stock/shared facilities identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; acceptance; detection limits; reconciliation; uncertainty"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Sum raw exchange quantities over the complete same route, as-is grade and declared period, including attributable failed/zero-output batches, starts/stops, cleaning and rework, then divide once by positive accepted net SSP mass in kg; ssp output = 1 kg. Do not average successful-batch ratios or divide pre-normalized per-kg amounts again. Reconcile returns/reacceptance, curing WIP and finished stocks with production history and carried burdens so acceptance is credited once and the attributed numerator covers the same output; burden adjustments do not erase raw physical exchanges. Internal recycle is not new accepted output. Do not divide whole-plant input by partial dispatch. If accepted output is zero, preserve raw totals and disclose no unit result rather than divide or omit burdens."
      inputs:
        - cp_product
        - cp_feed
        - cp_energy
        - cp_water
        - cp_waste
        - cp_air
        - cp_carbon
      output: "exchange amounts per 1 kg reference flow"
      source_ids:
        - ec-lvic-aaf-2007
        - agrophos-ssp-process
    - id: composition_reconciliation
      applies_to: "rock; acid; ssp; scrubber_purge; scrubber_sludge"
      rule: "Use measured composition to conserve total mass and actual elements, including P/F/C and relevant Ca/S/H/O: inputs plus opening stocks equal outputs plus closing stocks and disclosed uncertainty/residual. Keep MCP/calcium-sulfate formation, actual acid/carbonate/fluoride reactions and water/dry-component species accounts separate. Water inputs plus independently evidenced reaction formation equal outputs plus stock change and actual consumption; distinguish structural water from free water and do not count hydration/dehydration as new water molecules. Validate balanced actual reaction equations against independent reactant/product/phase measurements and uncertainty; do not import an ideal ore recipe, fit reaction water or dry matter to a residual, or use COD as carbon mass. Wet mass times (1 minus measured moisture fraction) is only method-defined dry mass: state which free/structural water or other volatiles the test removes; it is not automatically the mass of anhydrous phosphate/calcium-sulfate phases. Identify each P2O5 assay form and basis. Reaction checks do not supply ore composition, acid demand, yield or emissions."
      inputs:
        - cp_product
        - cp_feed
        - cp_water
        - cp_waste
        - cp_carbon
      output: "element/water balances and composition disclosure"
      source_ids:
        - ec-lvic-aaf-2007
    - id: fluorine_accounting
      applies_to: "hf; sif4"
      rule: "For species-resolved F-basis mass, convert to molecular mass using that assayed species molecular mass divided by the total mass of all F atoms in one molecule (conversion ratio M_species / (n_F × M_F), where n_F is 1 for HF and 4 for SiF4). Treat HF and SiF4 separately. Unspeciated total F cannot be arbitrarily split or added again to fluorine-bearing particle mass."
      inputs:
        - cp_air
        - cp_waste
      output: "molecular species releases and F balance"
      source_ids:
        - epa-ap42-ssp-1993
        - ec-lvic-aaf-2007
    - id: particle_partition
      applies_to: "pm_fine; pm_mid; pm_coarse"
      rule: "Paired compatible tests: middle fraction = PM10 minus PM2.5; coarse fraction = total filterable PM minus PM10. Preserve uncertainty and reject negative differences. Determine/report condensable PM separately and check overlap with species/size entries; do not force Method 201A onto wet-droplet conditions."
      inputs:
        - cp_air
      output: "nonoverlapping air-particle fractions and coverage disclosure"
      source_ids:
        - epa-method201a-2020
        - epa-ap42-ssp-1993
  data_quality_requirements:
    - id: identity_and_provider
      applies_to: "all inventory rows"
      requirement: "Establish UUID identity separately from provider amount/background compatibility; never replace unresolved UUIDs with adjacent species."
      evidence: "provider specification, lot, composition, dimension and background metadata"
    - id: coverage_and_time
      applies_to: "ssp_production"
      requirement: "Prove scoped operations and all boundary exchanges; disclose representativeness, annual/campaign coverage, missing/below-detection values and uncertainty."
      evidence: "process map, meter register, assays/control records and source-by-source survey"
    - id: no_defaults
      applies_to: "all inventory rows"
      requirement: "No 1993 factors, 2007 plant tables/BAT concentrations or commercial grade become positive-release, recipe or energy defaults; site_specific means future collection requirements."
      evidence: "actual collection and method applicability"
validation_rules:
  - rule_id: reference_unique
    applies_to: "ssp"
    rule: "Exactly one ssp reference output: 1 kg accepted as-is net mass. Internal transfers are not another reference output; both languages, inventory, collection and conversion share the denominator."
    source_ids:
      - agrophos-ssp-process
      - ec-lvic-aaf-2007
  - rule_id: scope_and_background
    applies_to: "ssp_production"
    rule: "Verify every scope condition, upstream completion and provider basis; missing/incompatible backgrounds, unresolved waste identity or unproven zero releases prohibit a complete-dataset claim."
    source_ids:
      - ec-lvic-aaf-2007
      - epa-ap42-ssp-1993
  - rule_id: balances
    applies_to: "ssp_production"
    rule: "Recheck physical mass/water/P/F/C and burden ledgers separately; investigate discrepancies, match internal link quantities, retain sulfate in SSP without a gypsum co-product, and use no invented reaction yield."
    source_ids:
      - ec-lvic-aaf-2007
  - rule_id: emission_completeness
    applies_to: "ssp_production"
    rule: "Verify HF/SiF4 molecular bases, nonoverlapping PM/condensable coverage and all actual species. Total F/VOC/odour is not a specific species; retain biogenic CO2 in LCI. Unmeasured or method-inapplicable releases remain unresolved."
    source_ids:
      - epa-ap42-ssp-1993
      - epa-method201a-2020
      - ec-lvic-aaf-2007
published_dataset_profile:
  dataset_role: "Production dataset after complete site collection/review; this record is methodology only"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Upstream modelling of compatible powdered SSP route/delivery, with actual grade and moisture disclosed"
  excluded_use: "TSP/granular/mixed-acid/PAPR/fortified fertilizer; pure monocalcium phosphate; field nutrient equivalence; generic complete background with missing upstream data"
  required_metadata: "All reference qualifiers, period/providers, map, stock/composition, units, upstream/waste links and compartments"
  required_quality_disclosure: "Collection coverage, detection limits, basis compatibility, unresolved identity/releases, uncertainty and scientific-review status"
  update_trigger: "Changed feed/acid origin or concentration, grade/size, route/delivery/controls, energy, release or background"
data_sources:
  - id: "ec-lvic-aaf-2007"
    type: "official_guidance"
    reference: "European Commission, LVIC-AAF BREF, August 2007, chapter 10, especially 10.1, 10.2, Figure 10.1 and 10.4.1–10.4.3; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf ; retrieved 2026-10-14"
    used_for: "Route/SSP mixture, sale after curing, dust/fluorine control; no historical plant quantity, BAT concentration/efficiency, grade or residence-time default"
  - id: "epa-ap42-ssp-1993"
    type: "official_guidance"
    reference: "US EPA AP-42 section 8.5.1 Normal Superphosphates, July 1993, reformatted January 1995, pp. 8.5.1-1–4; https://www.epa.gov/sites/default/files/2020-09/documents/8.5.1_normal_superphosphates.pdf ; retrieved 2026-10-14"
    used_for: "Acidulation/curing and source-specific fluorine/particles; E-rated historical factors not adopted; absent metal/organic factors do not establish zero releases"
  - id: "epa-ap42-tsp-1993"
    type: "official_guidance"
    reference: "US EPA AP-42 section 8.5.2 Triple Superphosphates, July 1993, reformatted January 1995, p. 8.5.2-1; https://www.epa.gov/sites/default/files/2020-09/documents/8.5.2_triple_superphosphates.pdf ; retrieved 2026-10-14"
    used_for: "Counterevidence/exclusion for phosphoric-acid TSP route; no imported TSP feed/yield"
  - id: "agrophos-ssp-process"
    type: "literature"
    reference: "Agro Phos India Limited, Manufacturing Process, section 1 Single Super Phosphate (SSP); https://www.agrophos.com/manufacturing-process/ ; retrieved 2026-10-14"
    used_for: "Producer purchased acid, powder/granular branches and assay acceptance; single-site bags/temperature/details not universal defaults; bagging branch not adopted"
  - id: "epa-method201a-2020"
    type: "method_factor"
    reference: "US EPA Method 201A, October 7 2020, sections 1.1–1.6; https://www.epa.gov/sites/default/files/2019-08/documents/method_201a_0.pdf ; retrieved 2026-10-14"
    used_for: "Stationary filterable PM2.5/PM10 and differences; unsuitable for saturated wet-droplet gas; condensables require suitable separate testing/overlap checks; no default coarse fraction"
