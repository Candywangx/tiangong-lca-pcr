measurement_rules:
  - id: reference_mass
    applies_to: "ssp"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "1 kg is delivered as-is net SSP mass excluding packaging; pair moisture with dry/as-is assay basis. Do not substitute pure phosphate or nutrient mass. Use cp_product."
  - id: solution_basis
    applies_to: "acid"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Input is delivered 93–98% solution mass; actual H2SO4 mass = solution mass times measured mass fraction. Carrier water is already included; added dilution water is separate."
  - id: nutrient_basis
    applies_to: "ssp"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Available P2O5 mass = as-is product mass times measured available-P2O5 fraction on the same basis. Distinguish total, available and water-soluble phosphorus; no nominal-label or historical-grade default conversion."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert metered kWh using 1 kWh = 3.6 MJ; verify supplier electrical-energy reference, voltage and loss boundary. Unit conversion does not prove background compatibility."
  - id: water_basis
    applies_to: "water"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Measure new supplied volume; mass water balance uses measured/traceable density and temperature, not the database secondary mass coefficient."
  - id: same_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "reference flow"
      uuid: ""
    required_unit: "1 kg"
    rule: "Divide exchange totals by concurrent accepted net SSP mass in kg; reconcile curing work-in-progress, recycle, stocks and rejects separately. Every stage uses the same denominator."
