system_boundary:
  rules:
    - rule_id: include_stages
      applies_to: "ssp_production"
      rule: "Include receiving/grinding, dilution, acidulation, curing, crushing, bulk handling, dust/scrubbing controls and rinsing. Meter stages separately then aggregate one foreground unit; internal SSP transfers are not another reference-product output."
      source_ids:
        - ec-lvic-aaf-2007
        - epa-ap42-ssp-1993
    - rule_id: retain_sulfate
      applies_to: "ssp_production"
      rule: "Calcium sulfate retained in SSP belongs to the product mixture; do not import wet-process phosphoric-acid filtration and invent a gypsum co-product."
      source_ids:
        - ec-lvic-aaf-2007
    - rule_id: scope_conditions
      applies_to: "ssp_production"
      rule: "Verify absence of combustion-driven equipment, supplied steam/fuel drying, bagging, granulation, ammoniation, saleable scrubber acid and direct liquid environmental release. If any occurs, extend separately reviewed exchanges/process rules; do not continue this scope by assigning missing items zero."
      source_ids:
        - ec-lvic-aaf-2007
        - epa-ap42-ssp-1993
    - rule_id: emission_survey
      applies_to: "ssp_production"
      rule: "Survey post-control, curing-building and fugitive releases. Screen rock-borne metals/radionuclides/organics and cleaning agents; add each actually present unlisted species/aid separately with identity and quantity verification. This table alone does not prove inventory completeness. Verify stormwater and wastewater routes."
      source_ids:
        - epa-ap42-ssp-1993
        - ec-lvic-aaf-2007
boundary_abstraction:
  declared_starting_condition: "Received beneficiated phosphate rock and purchased virgin contact-process 93–98% sulfuric acid solution; treated tap water and 1–35 kV power; traceable lots/providers"
  starting_condition_role: "foreground production"
  product_classification_scope: "Cured ungranulated bulk SSP subset of CPC 34621"
  recursive_input_rule: "Purchased SSP is not phosphate-rock feed; disclose any same-category input and reassess applicability. Internal recycle does not import another background production burden"
  upstream_dataset_requirement: "Use compatible upstream rock mining/beneficiation, acid manufacture, power, tap-water, inbound transport and off-site waste-treatment data; provider/composition/amount bases must match; missing backgrounds are not zero burdens"
  disclosure: "Disclose start, upstream completion, campaign stocks, supplied solution/as-is product, waste destinations and release coverage; methodology is not a completed dataset"
