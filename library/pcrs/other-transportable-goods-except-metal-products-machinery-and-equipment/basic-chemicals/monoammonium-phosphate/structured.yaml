system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "map_production"
      rule: "Include all actual stages from receipt to released gate product, their utilities, emission controls, cleaning, losses, starts/shutdowns and handling. Keep separate stage meters even within the integrated unit."
      source_ids:
        - eu-jrc-map-2007
    - rule_id: boundary_upstream
      applies_to: "external exchanges"
      rule: "Link acid, ammonia, actual sulfuric acid, water, fuels, electricity, steam, coating, packaging, equipment materials and separately modelled inbound freight to compatible backgrounds. Included on-site upstream production must add its full actual inventory; it cannot disappear at an artificial gate."
      source_ids:
        - eu-jrc-map-2007
        - jrc-ilcd-2010
    - rule_id: boundary_recycle
      applies_to: "internal transfers"
      rule: "Track full fines, crushed oversize, captured dust and recovered liquor at both sending/receiving stages, with matched quantities, stocks and composition. Count only external make-up and actual losses in the integrated LCI; no negative purchase or avoided-production credit for internal recycle."
      source_ids:
        - eu-jrc-map-2007
    - rule_id: boundary_fates
      applies_to: "exported residues and emissions"
      rule: "Identify every external fate. This template's aqueous purge is a waste sent for off-site treatment; an operated on-site treatment/final discharge requires its added atomic reagents, sludge and individual water/pollutant exchanges to the actual receiving medium. No wastewater transfer may also be counted as direct discharge."
      source_ids:
        - eu-jrc-map-2007
    - rule_id: boundary_extension
      applies_to: "actual site completeness"
      rule: "Conditional rows require applicability and measured positive amount or a documented true zero. Add one atomic row per actual unlisted ingredient, liner, fuel, treatment reagent, waste or emission. An absent UUID or monitoring result never justifies deletion or a fabricated zero."
      source_ids:
        - eu-jrc-map-2007
        - jrc-ilcd-2010
