measurement_rules:
  - id: reference_mass
    applies_to: "map_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "P = accepted net as-delivered MAP output kg in cp_output. Retain inherent moisture and coating; exclude packaging tare. All rows and protocols use per 1 kg reference flow."
  - id: product_nutrient_basis
    applies_to: "map_product; phosphoric_acid_input; ammonia_input"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep product mass, dry solids, contained MAP, N, elemental P and total/available P2O5 separate. For assays in percent divide by 100 before multiplication. Available P2O5 is a nutrient-test result, not total P for conservation. Declare analytical method and molecular-mass convention for P/P2O5/H3PO4 conversions; no default grade or reaction yield."
  - id: solution_carrier
    applies_to: "phosphoric_acid_input; sulfuric_acid_input; wastewater_output; sludge_output"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain whole wet stream, active solute and carrier water in the physical ledger. Match each supplier exchange to delivered solution or contained-chemical basis explicitly; water already inside a purchased solution is not another independent purchased supply."
  - id: gas_volume
    applies_to: "natural_gas_input"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Convert measured volume to supplier reference state using absolute pressure, temperature, composition, wet/dry correction and compressibility. Mass needs measured/traceable density, not a secondary flow coefficient. Record LHV/HHV and their own reference state."
  - id: steam_heat
    applies_to: "steam_input; condensate_return"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep supply and return kg separate. Net heat is the measured sum of mass times enthalpy entering minus leaving the supplier boundary, with steam quality and make-up/loss/return terms declared; match provider kg or net-MJ definition before linking. No assumed pressure, enthalpy, loss or return fraction."
  - id: energy_service
    applies_to: "electricity_input; road_transport_input; stainless_steel_input"
    required_property_ref:
      name: "Row-specific property"
      uuid: ""
    required_unit: "MJ; kg*km; kg"
    rule: "Electricity MJ = 3.6 × kWh; transport kg*km = 1000 × t*km. Capital kg-equivalent is a service-period burden allocation, never a claim that a whole installed machine is consumed each reporting period. Preserve original physical masses and service lives."
