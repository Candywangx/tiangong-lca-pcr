allocation_rules:
  - rule_id: allocation_physical
    applies_to: "map_production"
    rule: "Retain the complete unallocated physical ledger first. Internal fines, liquor and captured dust have full physical amounts and no co-product credit. Do not multiply product, residue or internal-transfer physical masses by an environmental-burden share."
    source_ids:
      - eu-jrc-map-2007
      - jrc-ilcd-2010
  - rule_id: allocation_campaign
    applies_to: "shared equipment and utilities"
    rule: "Subdivide by actual product, chemistry, market state and campaign first. Meter direct consumption; allocate truly shared burdens by a demonstrated causal driver such as actual load/runtime or measured heat duty. Preserve all starts, failed batches, cleaning, zero-output batches, rework and WIP attributable to that same product pool. Do not allocate all energy only to successful hours or divide by output twice."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_external
    applies_to: "actual co-products"
    rule: "No co-product split is presumed. Saleable downgraded product or recovered external outputs require measured quantity, usable quality, genuine destination and separate identity. First assess subdivision within the stated attributional model, then demonstrable physical causality; use documented gate market values only for remaining inseparable burdens, with period, prices and sensitivity. Burden shares must sum to one. No automatic waste/recycling substitution credits."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_capital
    applies_to: "capital and replacement parts"
    rule: "Keep full physical installed/replaced material and actual end-of-life fate separate from the service-period burden share. Use recorded life/throughput, utilisation and replacement dates to assign only the attributable service; do not book a whole machine each period, or discard infrastructure because it is not consumed with feedstock."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "map_production"
      flow_role: "accepted product denominator and stocks"
      record_type: "acceptance and stock ledger"
      raw_fields: "batch and pool ids; new accepted net weights; tare; moisture; coating; total N; total P; available P2O5; grain size; opening/closing stocks and WIP; shipments; losses; rework links"
      collection_method: "Calibrated net weighing and lot assays; reconcile production acceptance against movements without re-counting re-accepted rework; Period aggregation retained before final normalization: Preserve raw masses; P is newly accepted net output kg counted once; reference output = 1 kg; per 1 kg reference flow"
      unit: "kg; mass fraction"
      frequency: "Every batch and stock close"
      temporal_coverage: "Complete declared period, including zero-output/failed batches"
      site_scope: "Same site/product/state/route pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, certificates, acceptance IDs, stock bridge, WIP burden carryover"
    - protocol_id: cp_materials
      process_id: "map_production"
      flow_role: "fresh acid, NH3, actual additives, make-up water"
      record_type: "receipt, stock, charge and assay records"
      raw_fields: "batch; supplier; SKU; chemical/CAS; whole delivered mass; concentration; water; N/P/F/S/C; opening/closing inventory; returns; internal transfers; destinations; provider reference amount/property"
      collection_method: "Calibrated weighbridge/tank/meter and traceable density; laboratory assays; charge and stock reconciliation; full formulation sheet when supplied as a preparation; Period aggregation retained before final normalization: Retain full raw wet totals and solute/water quantities; fresh net consumption after stocks/returns; attribute to pool; divide once by P; per 1 kg reference flow"
      unit: "kg; m3; mass fraction"
      frequency: "Each receipt/charge and period close"
      temporal_coverage: "All operation in reporting pool"
      site_scope: "Same site/product/state/route pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier COA/SDS, density conditions, assays, calibrated meters, full wet/active reconciliation"
    - protocol_id: cp_utilities
      process_id: "map_production"
      flow_role: "electricity and on-site gas"
      record_type: "meter and operating log"
      raw_fields: "initial/final readings; stage; uptime; starts/failures; AC voltage/supply mix; gas T/absolute p/Z/wet-dry composition; LHV/HHV; supplier reference state; shared driver"
      collection_method: "Read calibrated sub-meters, retain invoice cross-checks and supplier definitions; separately measure shared demand and stage runtime; Period aggregation retained before final normalization: Preserve raw totals and conditions; reconcile site meters; allocate true shared burdens; convert reference units; divide once by P; per 1 kg reference flow"
      unit: "kWh; MJ; m3; K; Pa"
      frequency: "Time series plus each campaign and stock close"
      temporal_coverage: "Entire period including idle/start/failed operation attributed to pool"
      site_scope: "Actual stages at this site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibrations, gas analysis, supply contracts and causal-driver records"
    - protocol_id: cp_steam
      process_id: "map_production"
      flow_role: "purchased steam and returned condensate"
      record_type: "supply-return meter and enthalpy ledger"
      raw_fields: "external vs internal supply; kg; pressure; temperature; steam quality; return kg/T/p; make-up; losses; supplier reference kg or MJ and boundary; enthalpy method"
      collection_method: "Calibrated mass meters and T/p/quality measurements; traceable thermodynamic property method with actual state; match supply and return intervals and supplier definition; Period aggregation retained before final normalization: Retain supply and return mass independently; calculate measured net boundary heat; assign service demand; divide once by P; per 1 kg reference flow"
      unit: "kg; MJ; K; Pa"
      frequency: "Time series over each operating mode"
      temporal_coverage: "Whole reporting period including starts and purge"
      site_scope: "Actual supplier/site interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/thermometer certificates, enthalpy method, supplier amount and return-credit contract"
    - protocol_id: cp_air
      process_id: "map_production"
      flow_role: "individual air species and particle fractions"
      record_type: "stack/fugitive tests and species balance"
      raw_fields: "source; species/CAS; c; integrated V or flow rate; test interval; dry/wet/T/p; oxygen correction; uptime; detection limits; control bypass; size fractions; inlet moisture; carbon origin"
      collection_method: "Representative source tests at actual control outlets; match concentration and carrier conditions; integrate measured flow rates only over their intervals; assess handling fugitives, bypass and abnormal modes; Period aggregation retained before final normalization: Preserve raw results; integrate species masses without duplicate time multiplication; pool only compatible samples; attribute and divide once by P; per 1 kg reference flow"
      unit: "mg/m3; m3; m3/h; h; kg"
      frequency: "Each source/operating-mode survey and continuous records where available"
      temporal_coverage: "Whole period with documented test extrapolation and uncertainty"
      site_scope: "All actual site release points; exclude upstream stacks already in backgrounds"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Test method, accredited reports, flow/time basis, uncertainty, source coverage and actual compartment"
    - protocol_id: cp_residues
      process_id: "map_production"
      flow_role: "external purge, sludge and discarded MAP"
      record_type: "waste/transfer and assay records"
      raw_fields: "wet kg; dry fraction; dissolved/suspended material; N/P/F/S/C; stock; receiver; treatment; recycle route; legal waste classification"
      collection_method: "Weigh each physically separate external stream, sample representative composition and reconcile receiver manifests; distinguish on-site internal settling from exported waste; Period aggregation retained before final normalization: Keep full wet raw masses; do not duplicate separated solids in the same wastewater total; attribute and divide once by P; per 1 kg reference flow"
      unit: "kg; mass fraction"
      frequency: "Each removal and close"
      temporal_coverage: "Entire reporting period"
      site_scope: "All actual residual destinations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weigh slips, laboratory methods, receiver permits/receipts and material balance"
    - protocol_id: cp_packaging
      process_id: "map_production"
      flow_role: "PP sacks, packaging waste and attached packaging"
      record_type: "purchase, tare and packing records"
      raw_fields: "composition; SKU; individual empty mass; count; opening/closing stock; filled/damaged/returned count; spill mass; actual liner/stitching; destination"
      collection_method: "Weigh representative empty components on calibrated scales; count actual units and reconcile packing losses; keep fertilizer spill separate; Period aggregation retained before final normalization: Preserve counts and full physical packaging kg; packaging attached to product leaves with it but stays outside net P; attribute burden and divide once by P; per 1 kg reference flow"
      unit: "kg; items"
      frequency: "Each packing lot and close"
      temporal_coverage: "Whole reporting period"
      site_scope: "Actual delivery mode at this site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Empty-component weighing, BOM, supplier data, bag reconciliation and waste receipts"
    - protocol_id: cp_capital
      process_id: "map_production"
      flow_role: "stainless components and other actual equipment materials"
      record_type: "equipment and maintenance ledger"
      raw_fields: "installed physical kg by material/grade; replacements; commissioning/retirement; service life; throughput/runtime; shared driver; end-of-life fate; embodied dataset boundary"
      collection_method: "Trace equipment BOM or measured/traceable component masses, actual maintenance and operational capacity; inventory all other actual materials as separate rows; Period aggregation retained before final normalization: Preserve complete physical masses separately; assign recorded service-period burden-equivalent mass; divide once by P; per 1 kg reference flow"
      unit: "kg; years; h; kg throughput"
      frequency: "Each installation/replacement and annual service review"
      temporal_coverage: "Full service history supporting this period"
      site_scope: "Included production and control assets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Asset BOM, service-life evidence, replacement record and burden ledger avoiding double counting"
    - protocol_id: cp_transport
      process_id: "map_production"
      flow_role: "separately modelled inbound road freight"
      record_type: "consignment and route records"
      raw_fields: "actual mode/truck; shipment kg; leg distance; load; utilisation; empty returns; supplier delivery boundary"
      collection_method: "Actual carrier records and route distances; match 30-ton diesel-truck identity only when applicable; other modes separate; Period aggregation retained before final normalization: Preserve shipment totals; calculate service once per actual leg; attribute and divide once by P; per 1 kg reference flow"
      unit: "kg; km; kg*km"
      frequency: "Each consignment"
      temporal_coverage: "All inbound deliveries in pool"
      site_scope: "Actual upstream-to-gate legs absent from supplier background"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Consignment records, route evidence, supplier boundary comparison"
  calculation_rules:
    - id: period_normalisation
      applies_to: "all inventory rows"
      rule: "Keep A_period as the complete raw attributable reporting-period amount in the row's reference unit. After any explicit service/shared burden assignment and supplier-basis conversion, normalized exchange = A_period / P, once only. P must be positive. If P = 0 retain A_period without any normalized result. The fixed map_product row is 1 kg."
      inputs:
        - A_period
        - P
        - cp_output
        - "applicable protocol"
      output: "Exchange per 1 kg reference flow and retained raw total"
      source_ids:
        - jrc-ilcd-2010
    - id: output_reconciliation
      applies_to: "map_product"
      rule: "P is sum of newly accepted net product weights, excluding tare and duplicate rework acceptances. Independently reconcile with shipments plus closing less opening finished-product stock and measured post-acceptance losses/transfers. Reconcile WIP separately by stage and carry measured embodied burdens across periods. Explain discrepancies; do not apply both production and shipment stock adjustments to the same P."
      inputs:
        - cp_output
        - "acceptance ids"
        - "stock movements"
      output: "P and explicit stock/WIP bridge"
      source_ids:
        - eu-jrc-map-2007
        - jrc-ilcd-2010
    - id: composition_bridge
      applies_to: "phosphoric_acid_input; sulfuric_acid_input; ammonia_input; map_product; wastewater_output; sludge_output"
      rule: "Contained species kg = whole stream kg × measured species mass fraction. Water and all measured solutes/solids partition the whole stream on one compatible analytical basis. Keep total P separate from available P2O5. Convert chemical/element bases using declared molecular masses, assay definitions and provenance. No commodity grade is assumed to be pure MAP."
      inputs:
        - cp_materials
        - cp_output
        - cp_residues
        - "assay basis"
      output: "Wet, dry, active, elemental and water ledger"
      source_ids:
        - eu-jrc-map-2007
        - mosaic-map-spec-2024
    - id: supplier_quantity_bridge
      applies_to: "external exchanges"
      rule: "Retain period demand D in its actual kg/m3/MJ and the supplier reference amount s with property, concentration and state. Convert D into the supplier's declared quantity basis explicitly, then require D_converted / s provider units. Do not multiply period demand by supplier reference amount. Do not add carrier water or upstream formulation ingredients again when included in purchased whole-solution/preparation background. Unknown compatibility leaves the dataset link pending."
      inputs:
        - "applicable collection protocol"
        - "provider definition"
        - "measured composition/state"
      output: "Compatible provider demand and conversion evidence"
      source_ids:
        - jrc-ilcd-2010
    - id: air_integration
      applies_to: "ammonia_air; hydrogen_fluoride_air; silicon_tetrafluoride_air; pm_fine_air; pm_middle_air; pm_coarse_air; fossil_co2_air; nitric_oxide_air; nitrogen_dioxide_air; sulfur_dioxide_air; fossil_co_air; fossil_methane_air; nitrous_oxide_air; water_vapour_air; formaldehyde_air; benzene_air"
      rule: "Species kg = sum(c_mg_per_m3 × V_integrated_m3) / 1000000. If the input is flow rate rather than integrated volume, first integrate flow_rate_m3_per_h × interval_h. Never multiply an already integrated V by operating hours again. Align T/p/wet-dry/O2 reference and represented operating modes before summation; preserve detection limits and uncertainty."
      inputs:
        - cp_air
        - c
        - "V or flow_rate and interval"
      output: "Species kg over full period before normalisation"
      source_ids:
        - eu-jrc-map-2007
        - us-epa-ap42-gas-2026
    - id: conservative_balances
      applies_to: "map_production"
      rule: "Reconcile measured whole streams and independent N/P/F/S/C inventories, stock/WIP and documented air-carrier terms. Water balance includes inlet water, product/residue water, condensate, measured net vapour and evidence-backed chemical generation/consumption. NH3 + H3PO4 to NH4H2PO4 produces no stoichiometric water; combustion water requires actual fuel H/composition and supported reaction calculation. Track coating/fuel organic dry matter and all measured carbon destinations. COD or an unexplained residual cannot create water, evaporation, yield or a missing species. Explain residuals against declared measurement uncertainty."
      inputs:
        - cp_materials
        - cp_output
        - cp_air
        - cp_residues
        - cp_steam
        - "opening/closing stocks"
      output: "Full physical mass, water and element ledgers, residuals and uncertainty"
      source_ids:
        - eu-jrc-map-2007
        - us-epa-ap42-gas-2026
    - id: particulate_speciation
      applies_to: "pm_fine_air; pm_middle_air; pm_coarse_air; hydrogen_fluoride_air; silicon_tetrafluoride_air; nitric_oxide_air; nitrogen_dioxide_air"
      rule: "Only on compatible tests, PM2.5-10 = PM10 minus PM2.5, and PM>10 = total particulate minus PM10. Keep these three exclusive fractions; do not add nested totals again. HF/SiF4 must be measured or validly speciated from F; NO/NO2 from an NOx-as-NO2 result needs actual species fractions and molecular conversion. Keep particulate F/N/P content as composition of dust in the elemental ledger, not another copy of dust mass. Missing speciation stays pending, never an invented ratio."
      inputs:
        - cp_air
        - "species/size methods"
      output: "Mutually exclusive emissions with correct chemical bases"
      source_ids:
        - eu-jrc-map-2007
        - us-epa-ap42-map-1993
    - id: capital_service
      applies_to: "stainless_steel_input"
      rule: "Retain physical installed mass K and full actual replacements. Attribute only the service used in this pool using demonstrated lifetime output or lifetime operating service and recorded utilisation; document residual life, replacement timing and shared drivers. The assigned equivalent kg affects burden linking, not chemical physical balances. No default K, lifetime or allocation share."
      inputs:
        - cp_capital
        - "actual service records"
      output: "Physical asset ledger plus attributable burden equivalent before division by P"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every exchange"
      requirement: "Verify chemical/material identity, full name fields, CAS, route, physical state, type, compartment, reference property/unit and supplier quantity definition together. Generic product identity may be physically limited by this PCR only when no contradictory native field exists."
      evidence: "Direct identity records, suppliers, assays and conversion evidence"
    - id: dq_pool
      applies_to: "all inventory rows"
      requirement: "Retain full original period totals, zero-output/failed batches, starts, rework/WIP and causal shared allocation; positive accepted P normalizes once. Each protocol belongs only to map_production and its actual rows."
      evidence: "Signed period ledger, operating log, stock/WIP bridge and burden ledger"
    - id: dq_physical
      applies_to: "map_production"
      requirement: "Independent total mass, water and N/P/F/S/C checks include full physical outputs, stocks, purge destinations and documented reaction generation/consumption; uncertainty is stated and unexplained residuals remain findings."
      evidence: "Calibrations, lab records, physical process map and balances"
    - id: dq_monitoring
      applies_to: "direct releases"
      requirement: "Assess all source points and operating modes including fugitive and bypass releases; quantify coverage, detection limits, size/species uncertainty, time extrapolation and actual medium. Screen actual additional VOCs/trace pollutants and add each applicable species separately; this checklist is not a waiver for unlisted pollutants."
      evidence: "Sampling plan, permits, source tests and source-to-row matrix"
    - id: dq_background
      applies_to: "upstream and treatment links"
      requirement: "Supplier dataset technology/geography/time and kg/m3/MJ definitions, solution/active basis and embedded transport/returns must match. Missing values are future collection requirements; an unverified supplier conversion cannot be represented as a complete link."
      evidence: "Provider reference quantities and actual collection/conversion records"
    - id: dq_completeness
      applies_to: "complete dataset"
      requirement: "Review actual BOM, utilities, capital, emissions, packaging and waste destinations. Add each actual missing atomic exchange; document true zeros, measurement gaps and uncertainty. Report unresolved UUIDs honestly without removing rows."
      evidence: "Site survey, chemical register, manifests and completeness register"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference and all rows"
    rule: "Require the stated MAP reference identity/Mass/kg and one map_product reference output, correct actual chemistry and granular fertilizer state. Fail substitutions of DAP, triammonium salts, other NP/NPK products or an incompatible product grade/route."
    source_ids:
      - un-cpc3-2025
      - eu-jrc-map-2007
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Require positive measured accepted P and one complete same-product/state/route reporting pool. Include failed/zero-output batches, starts and rework/WIP; preserve raw totals and normalize exactly once. If the pool has P = 0 retain totals without a per-kg result."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_protocol
    applies_to: "collection protocols"
    rule: "Every protocol must belong to the actual single process map_production, match its inventory rows, define original units and period aggregation, and preserve supplier reference quantities independently from consumption."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_assay
    applies_to: "inputs and product"
    rule: "Fail conflation of whole wet product/solution with pure MAP, active acid, available phosphate or nutrient mass, or duplicate supply of embedded carrier/components. Require assay-specific total element and water balances."
    source_ids:
      - eu-jrc-map-2007
      - mosaic-map-spec-2024
  - rule_id: validate_energy
    applies_to: "utilities"
    rule: "Require native property units, actual gas reference conditions/density/heat basis, actual steam supply-return mass and enthalpy plus supplier definition, and actual electricity voltage/supply. Identity success alone does not prove quantity/background compatibility."
    source_ids:
      - eu-jrc-map-2007
      - us-epa-ap42-gas-2026
  - rule_id: validate_emissions
    applies_to: "air and any actual water/soil release"
    rule: "Require integrated concentration-volume or rate-time calculation, correct medium, physical species and carbon origin; no duplicate total/size fractions, NOx+NO+NO2 or fluoride aggregates+species. No missing monitoring is a zero. Actual treatment/direct discharges need their full extended inventory."
    source_ids:
      - eu-jrc-map-2007
      - us-epa-ap42-gas-2026
  - rule_id: validate_conservation
    applies_to: "map_production"
    rule: "Require independently checked mass/water/N/P/F/S/C and stock/WIP bridges, stated uncertainties and explained residuals. Do not fabricate reaction water, evaporation or product yield to force closure."
    source_ids:
      - eu-jrc-map-2007
      - us-epa-ap42-gas-2026
  - rule_id: validate_burdens
    applies_to: "co-products, wastes, equipment and shared services"
    rule: "Preserve full unallocated physical transfers/outputs and service masses; distinguish attributed burdens, verify shares and genuine destinations, retain replacement/service history and avoid automatic recycling credits or whole-machine-per-period demand."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_completeness
    applies_to: "dataset claims"
    rule: "Identify unresolved UUIDs, supplier compatibility and missing measurement/speciation explicitly. Add all actual omitted atomic exchanges and matching backgrounds before declaring a site dataset complete. Candidate methodology is not scientific approval or a licence to publish incomplete measured data."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "Foreground granular fertilizer-grade MAP manufacture, 1 kg net as-delivered accepted product at producer gate"
  downstream_use: "secondary_dataset; background_dataset after appropriate independent review and completion of the actual dataset"
  allowed_use: "Matching granular fertilizer supply chains with actual route, grade, moisture, coating, geography and provider quantities stated"
  excluded_use: "Technical/food crystals, liquid products, DAP/other NP/PK/NPK routes or dry blending; per-kg values from a zero-output pool; field-use fertilizer emissions or downstream delivery claims outside the boundary"
  required_metadata: "PCR id; product UUID; route/configuration; producer/site; reporting pool/period; actual assays and test methods; moisture/grain size/coating; gate and packaging; raw totals/P; stock/WIP/rework; supplier identities/reference quantities; energy conditions; monitoring and destinations; allocation/equipment service"
  required_quality_disclosure: "Physical versus burden ledgers; balance residuals/uncertainties; survey and monitoring coverage; zero/non-detect treatment; failed batches/WIP; unresolved identities, quantities and provider links; exclusions; source versions; scientific review pending until independently completed"
  update_trigger: "Product chemistry, assay/state, acid or NH3 source, reactor/dryer/control configuration, utility supply/basis, packing mode, waste fate, actual emissions, allocation/service life or flow-identity change"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Structure, 30 June 2025, row 34643. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv ; repository-retained official original consulted 2026-10-15."
    used_for: "Classification context only; no manufacturing default or identity duplication"
  - id: "eu-jrc-map-2007"
    type: "official_guidance"
    reference: "European Commission, LVIC-AAF BAT Reference Document, August 2007, §§7.2.1, 7.2.3–7.2.6, 7.2.8–7.2.9; printed pp.285,287–289 / PDF pp.313,315–317. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf ; retained original consulted 2026-10-15."
    used_for: "MAP/DAP reaction/granulation route and controls; distinguish nitrophosphate and dry blending. NPK case quantities, temperatures and utility examples are not MAP defaults"
  - id: "us-epa-ap42-map-1993"
    type: "official_guidance"
    reference: "US EPA, AP-42 §8.5.3 Ammonium Phosphate, July 1993, reformatted January 1995, §§8.5.3.1–3 and Figure 8.5.3-1, PDF pp.1–4. https://www.epa.gov/sites/default/files/2020-09/documents/8.5.3_ammonium_phosphate.pdf ; retrieved 2026-10-15."
    used_for: "Granulated phosphate scope; process and species checklist, recycle and conditioning context. Historical US plant concentrations, feed splits, efficiencies and factors are not recipes or defaults"
  - id: "mosaic-map-spec-2024"
    type: "literature"
    reference: "The Mosaic Company, Monoammonium Phosphate 11-52-0 Specification Sheet, ©2024, p.1 including limitation below table. https://mosaicco.com/fileLibrary/publicFiles/0-Monoammonium-Phosphate-11-52-0-Specification-Sheet.pdf ; retrieved 2026-10-15."
    used_for: "Producer evidence of commercial nutrient-guarantee basis and incomplete composition disclosure, not actual assay, pure-MAP content or a universal grade"
  - id: "us-epa-ap42-gas-2026"
    type: "official_guidance"
    reference: "US EPA, AP-42 §1.4 Natural Gas Combustion, retained October 2026 (header 10/26) original, pp.1–3, especially §1.4.3. https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf ; retained original consulted 2026-10-15."
    used_for: "Conditional gas combustion species and source-test checklist only; boiler/furnace factors and default fuel properties are not transferred to a MAP dryer"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General Guide for Life Cycle Assessment, Detailed Guidance, first edition March 2010, physical inventory/allocation context printed p.80 / PDF100, §7.9.3 printed p.257 / PDF277. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf ; retained original consulted 2026-10-15."
    used_for: "Attributional inventory, physical versus allocated burdens, physical causality and residual market-value allocation; collection/calculation protocols are explicit operational requirements of this PCR, not literature default quantities"
