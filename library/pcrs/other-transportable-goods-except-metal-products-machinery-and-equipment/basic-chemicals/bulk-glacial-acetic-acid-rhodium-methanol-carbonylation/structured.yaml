system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Aggregate reaction, flash, light/heavy-end distillation, guard-bed purification, tank/loading, assigned utility generation and onsite abatement into one foreground unit so intermediate acid is not a second reference output. Retain the site process drawing and stage meters: feed → reactor → flash → purification → tank → loading; flash catalyst liquid and recovered light ends return to the reactor; vent → absorption → actual recovery/oxidation/flare endpoint; aqueous purge → actual onsite or external treatment. Every internal link has identical mass/composition/time at its two ends. [celanese-carbonylation-2020; jrc-lvoc-2017]"
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Include start-up/shutdown, cleaning, purge, losses and actual onsite treatment over the declared period. Purchased steam excludes supplier generation emissions from this foreground; onsite fuel generation includes its fuel, water and measured stack releases. External wastewater transfer includes receiver burdens through a compatible dataset, without also counting raw wastewater as a direct water emission. Equipment construction/capital is excluded from routine operating exchange totals and disclosed; any study including it uses separately measured atomic material/service rows. Bulk dispatch uses reusable vessels. For every actual packing component, container, seal, liner, maintenance material and external return, collect the full physical quantity, composition, incoming/outgoing movement and opening/closing stock before any service or burden allocation. Preserve container tare separately from acid net mass. Record cleaning inputs and wastes atomically; document reuse cycles and measured service shares in a separate burden ledger. A reduced service share never replaces the whole physical amount or creates repeated fresh container consumption. No cut-off may silently remove hazardous iodide/metal/species streams. [jrc-cww-2016]"
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Received methanol, purified CO and actual catalyst/promoter supplies"
  starting_condition_role: "Independent chemical synthesis foreground; manufacturing from feedstocks"
