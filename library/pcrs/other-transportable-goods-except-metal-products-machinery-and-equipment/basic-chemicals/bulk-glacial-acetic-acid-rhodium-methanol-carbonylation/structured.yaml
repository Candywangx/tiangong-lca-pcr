allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First separate independently metered operations; retain unallocated physical mass/water/carbon/species accounts. Recovered internal solvent, catalyst, acid and condensate within the unit cancel as equal internal transfers. Only actual accepted external products with receiver/specification and positive documented economic or physical function are co-products; trace constituents and treatment wastes are not. Keep their full physical output masses before allocation."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "For inseparable joint operation, document the physical causal relationship and use measured causal allocation where defensible; otherwise use period-matched net sales values for economic allocation, disclosing prices, product quantities, market status and sensitivity. Shares sum to one. Allocate attributable environmental burdens and shared inputs, never multiply actual co-product physical outputs by the acid share. Do not use both an avoided-product credit and allocation for the same output. Waste treatment follows actual producer/receiver responsibility. Condensate return is a metered water/enthalpy transfer, not automatically a substitution credit. These are attributional modelling rules implemented through cp_allocation, following subdivision, physical causality and, when necessary, another supported relationship. For economic allocation, adjust observed sales values to the same joint-production gate by separately recording downstream purification, compression or packing costs; use a positive measured total value and disclose sensitivity. No preselected share or credit is provided. [ilcd-general-2010]"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "acid_manufacture"
      flow_role: "Reference output, accepted coproduct and return"
      record_type: "dispatch scale and assays"
      raw_fields: "SKU; CAS; net product kg; CH3COOH fraction x; water fraction w; impurity fractions; stock kg; rejects; temperature; destination"
      collection_method: "Calibrated tank/vehicle weighing excluding tare; batch assay using validated supplier method with traceable uncertainty; sum accepted lots and reconcile opening/closing stocks"
      unit: "kg; mass fractions"
      frequency: "Each batch/event; continuous utility/outfall records where applicable"
      temporal_coverage: "One declared representative consecutive operating year including start/stop, or complete measured shorter campaign with seasonality disclosure"
      site_scope: "Qualifying production unit and assigned services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; methods; uncertainty; stock and flow reconciliation; receiver and provider evidence"
    - protocol_id: cp_materials
      process_id: "acid_manufacture"
      flow_role: "Each supplied atomic material and physical container movement"
      record_type: "receipts; meters; laboratory; recipe"
      raw_fields: "row_id; SKU; CAS; supplier; route; actual chemical composition; received mass; water; hydrate; spent stock; recovery; carbon origin; full packaging/container/maintenance amounts; external returns; reuse cycles; service shares;"
      collection_method: "Weigh or meter each fresh exchange; cross-check delivery and assay; separate whole mixture from active component; use stock-adjusted consumption, excluding internal circulation  Preserve full physical quantities before separate service/burden allocation."
      unit: "kg"
      frequency: "Each batch/event; continuous utility/outfall records where applicable"
      temporal_coverage: "One declared representative consecutive operating year including start/stop, or complete measured shorter campaign with seasonality disclosure"
      site_scope: "Qualifying production unit and assigned services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; methods; uncertainty; stock and flow reconciliation; receiver and provider evidence"
    - protocol_id: cp_water
      process_id: "acid_manufacture"
      flow_role: "Each water intake and return"
      record_type: "water meter; sampling; drawing"
      raw_fields: "source; purpose; water mass or volume; temperature; density; return; evaporation; blowdown; carrier water; internal recycle"
      collection_method: "Meter fresh and discharged water separately; analyse density/quality where conversion is needed; map every inlet, recycle and outlet without counting cooling circulation as uptake"
      unit: "kg; m3"
      frequency: "Each batch/event; continuous utility/outfall records where applicable"
      temporal_coverage: "One declared representative consecutive operating year including start/stop, or complete measured shorter campaign with seasonality disclosure"
      site_scope: "Qualifying production unit and assigned services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; methods; uncertainty; stock and flow reconciliation; receiver and provider evidence"
    - protocol_id: cp_energy
      process_id: "acid_manufacture"
      flow_role: "Each delivered utility and onsite generation"
      record_type: "utility meters and enthalpy balance"
      raw_fields: "voltage; kWh; MJ; fuel volume; T; absolute P; dry/wet composition; Z; NCV/GCV; steam kg; supply P/T/dryness; condensate kg/T; supplier reference; meter loss; supply geography; exported energy; heat loss; energy stock changes; common enthalpy datum;"
      collection_method: "Use calibrated stage and facility meters; reconcile shared utilities causally; actual thermodynamic records establish steam enthalpy and matched return; match native property and upstream reference quantity before linking"
      unit: "MJ; m3; kg"
      frequency: "Each batch/event; continuous utility/outfall records where applicable"
      temporal_coverage: "One declared representative consecutive operating year including start/stop, or complete measured shorter campaign with seasonality disclosure"
      site_scope: "Qualifying production unit and assigned services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; methods; uncertainty; stock and flow reconciliation; receiver and provider evidence"
    - protocol_id: cp_wastes
      process_id: "acid_manufacture"
      flow_role: "Each external atomic waste mixture"
      record_type: "weighbridge; manifests; analysis"
      raw_fields: "row_id; wet mass; water; dry solids; acid; acetate; sodium; iodide; metals; organic carbon; physical state; receiver; treatment; fate"
      collection_method: "Weigh each actual removed stream and obtain representative composition and receiver receipt; distinguish catalyst, heavy bottoms, aqueous purge, primary and biological sludge and guard resin; do not repeat one split under two rows"
      unit: "kg"
      frequency: "Each batch/event; continuous utility/outfall records where applicable"
      temporal_coverage: "One declared representative consecutive operating year including start/stop, or complete measured shorter campaign with seasonality disclosure"
      site_scope: "Qualifying production unit and assigned services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; methods; uncertainty; stock and flow reconciliation; receiver and provider evidence"
    - protocol_id: cp_emissions
      process_id: "acid_manufacture"
      flow_role: "Each actual species/medium"
      record_type: "source inventory; direct measurement; lab"
      raw_fields: "species CAS; source; medium/submedium; exhaust or water flow; concentration; time; T/P; dry/wet; oxygen basis; pH/speciation; detector limits; control bypass; combustion carbon origin; size intervals; wet-air intake; humidity; O2/N2/other carrier components; gross outgoing carrier; inlet background; whole effluent and water fraction;"
      collection_method: "Measure final stack/outfall and fugitive sources over operations and abnormal events; use validated species analysis and synchronized flow; sample before/after treatment for fate reconciliation; retain detection limits and uncertainty; include all discovered substances"
      unit: "kg; m3; concentration"
      frequency: "Each batch/event; continuous utility/outfall records where applicable"
      temporal_coverage: "One declared representative consecutive operating year including start/stop, or complete measured shorter campaign with seasonality disclosure"
      site_scope: "Qualifying production unit and assigned services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; methods; uncertainty; stock and flow reconciliation; receiver and provider evidence"
    - protocol_id: cp_allocation
      process_id: "acid_manufacture"
      flow_role: "Physical joint production and burden allocation"
      record_type: "unit meters; contracts; period sales"
      raw_fields: "product mass; assay; causal relationship; independent unit inputs; receiver; same-period net price; burden share; sensitivity"
      collection_method: "Keep full physical outputs separately from allocated burden ledger; justify subdivisions and causal/economic shares using real records, no assumed price or zero-value co-product"
      unit: "kg; currency; share"
      frequency: "Each batch/event; continuous utility/outfall records where applicable"
      temporal_coverage: "One declared representative consecutive operating year including start/stop, or complete measured shorter campaign with seasonality disclosure"
      site_scope: "Qualifying production unit and assigned services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; methods; uncertainty; stock and flow reconciliation; receiver and provider evidence"
  calculation_rules:
    - id: period_normalisation
      applies_to: "all inventory rows"
      rule: "a_i = A_i / P; retain every full physical exchange before allocation; fixed reference output = 1 kg. Allocated burden b_i = B_i / P is a separate ledger, never a replacement for physical a_i."
      inputs:
        - A_i
        - B_i
        - P
        - cp_product
        - "applicable collection protocol"
      output: "a_i; b_i"
      source_ids:
        - ilcd-general-2010
    - id: product_components
      applies_to: "finished_acid"
      rule: "Contained acid = sum(p_b × x_b); product water = sum(p_b × w_b); measured impurities = sum(p_b × respective fraction); P = sum(p_b); fractions close with actual uncertainty. Active-acid-basis burden, when separately requested, uses total burden / contained acid and is explicitly labelled a separate result."
      inputs:
        - p_b
        - x_b
        - w_b
        - "impurity fractions"
        - cp_product
      output: "acid; water; impurities; P"
      source_ids:
        - celanese-acetic-2021
    - id: species_load
      applies_to: "elementary outputs"
      rule: "For mass-referenced species, released kg = sum(C_s × Vdot × delta_t), where C_s is species kg/m3, Vdot is m3 per unit time and delta_t uses that same time unit; alternatively use C_s × measured interval volume without multiplying by time again, or validated integrated mass measurement. Convert reported units and T/P/wet/dry/oxygen bases explicitly to matching actual concentration/flow bases before integration. water_fresh retains its native m3 reference and a separately documented water-component basis. Convert analytical carbon/acid/NOx equivalents only with documented species definition and molecular masses. No default destruction fraction."
      inputs:
        - concentration
        - flow
        - time
        - "measurement basis"
        - cp_emissions
      output: "species kg"
      source_ids:
        - jrc-cww-2016
    - id: steam_delivery
      applies_to: "steam; condensate_return"
      rule: "Q_net = sum(m_in × h_in) - sum(m_return × h_return), with a declared common enthalpy datum and measured phases. Deduct other measured exported enthalpy as required by actual supplier definition; never reuse paper-drying MJ/kg factors. Steam mass is retained as its own exchange basis."
      inputs:
        - "steam mass"
        - h_in
        - "return mass"
        - h_return
        - cp_energy
      output: "Q_net; delivered steam mass"
      source_ids:
        - jrc-cww-2016
    - id: physical_closure
      applies_to: "acid_manufacture"
      rule: "Inputs + opening stocks = physical outputs + closing stocks, with reacted species balances and measured uncertainty. Water ledger includes carrier water, steam/return, cleaning, cooling makeup/blowdown, product, residues, effluent and evaporation; reaction water generation/consumption is explicit. Carbon ledger includes feed, fuel, actual products/residues and all C-containing emissions; distinguish fossil/biogenic and internal gas combustion. Iodine/Rh balances include catalyst/promoter makeup, stocks, recoveries, guard resin, waste and released species. Measured neutralisation CH3COOH + NaOH → CH3COONa + H2O is reconciled, not imposed as perfect yield."
      inputs:
        - cp_materials
        - cp_water
        - cp_product
        - cp_wastes
        - cp_emissions
        - stocks
      output: "mass; water; carbon; species residuals and uncertainty"
      source_ids:
        - jrc-cww-2016
        - celanese-acetic-2021
    - id: joint_burdens
      applies_to: "shared operation"
      rule: "Causal measured shares, or f_j = (p_j × net_price_j) / sum(p_k × net_price_k) if no defensible physical relationship; use measured prices adjusted to the same gate and positive total value; shares sum to 1. Preserve all full physical exchanges separately. Disclose subdivisions, price period, additional processing costs and sensitivity."
      inputs:
        - cp_allocation
        - masses
        - prices
        - "causal evidence"
      output: "allocated burden ledger"
      source_ids:
        - ilcd-general-2010
  data_quality_requirements:
    - id: identity
      applies_to: "all rows"
      requirement: "Check species CAS, mixture composition, hard route/state restrictions, native property/unit group and exact localized display; match actual supply or receiver reference basis independently of UUID validity. No correction or nearby-species substitutes. Intended-use comments alone do not establish an exclusive manufacturing route or grade; enforce actual hard identity fields and measured supply compatibility."
      evidence: "cp_materials; cp_product; native identity chain"
    - id: coverage
      applies_to: "acid_manufacture"
      requirement: "Reconcile all feed and outputs over same declared period, stage and abnormal operation; sampling plans represent all actual sources, not only regulatory pollutants. Unknown amounts are missing, never zero."
      evidence: "cp_emissions; jrc-cww-2016"
    - id: balance
      applies_to: "acid_manufacture"
      requirement: "Report physical mass/water/carbon/Rh/iodine residuals and instrument/lab uncertainty; investigate imbalance rather than inventing compensating elementary flows."
      evidence: "cp_water; cp_wastes; cp_product"
    - id: supplier_link
      applies_to: "steam; gas; all purchased exchanges"
      requirement: "UUID identity alone does not approve provider, quantity, geography or burden compatibility. Demonstrate utility reference and matched net delivery; preserve concrete unresolved links until real supplier records are available."
      evidence: "cp_energy; supplier evidence"
validation_rules:
  - rule_id: reference_acceptance
    applies_to: "finished_acid"
    rule: "One final reference product output; 1 kg commercial net mass; actual assay >=99.8 wt%; all required qualifiers and route confirmed."
    source_ids:
      - celanese-acetic-2021
  - rule_id: stream_fates
    applies_to: "all inventory rows"
    rule: "Require actual occurrence/absence evidence, explicit flow direction, single exchange, collector, receiver/medium and per-1-kg basis. No duplicate wastewater transfer plus raw-water emission, internal recycle plus fresh input, or waste plus contained-metal emission."
    source_ids:
      - jrc-cww-2016
  - rule_id: species_completeness
    applies_to: "elementary outputs"
    rule: "Release inventory includes actual VOC species and carbon source, metals/iodide and disjoint PM; NOx basis/speciation verified, N2O separate, biogenic CO2 retained. Add actual missing species atomically; reporting aggregate TOC/COD/TSS checks are diagnostics, not extra organic-species mass."
    source_ids:
      - jrc-cww-2016
  - rule_id: physical_and_burden_accounts
    applies_to: "acid_manufacture"
    rule: "Physical outputs, stock changes, reaction/water/carbon/iodine/Rh balances and allocation burden ledger remain separately reviewable. Missing closure, utility/provider basis or unmeasured applicable exchanges prevent a complete production dataset, without fabricating PCR defaults."
    source_ids:
      - jrc-cww-2016
published_dataset_profile:
  dataset_role: "foreground_manufacturing; attributional inventory"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualifying route/SKU; transparent independent units or disclosed joint-operation allocation"
  excluded_use: "All other acids/derivatives; aqueous lower grades; bio/fermentation or oxidation routes; claimed industry-average recipe; methodology approval from a checker result"
  required_metadata: "Reference qualifiers; primary measurement periods; source and process drawing; native flow identities and compatible providers; physical balances; receiver routes; allocation and uncertainty"
  required_quality_disclosure: "Measured scope, uncertainty, all missing quantities/UUIDs/provider bases, zero/non-use evidence and unreviewed scope"
  update_trigger: "Changed route, catalyst, grade, source composition, utility basis, treatment, co-products or primary evidence"
data_sources:
  - id: "jrc-lvoc-2017"
    type: "official_guidance"
    reference: "European Commission JRC, LVOC BREF (2017), section 2.1.2.3.1 route C (printed 20 / PDF58), section 2.2.10 (printed56 / PDF94). https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf; retrieved 2026-10-13"
    used_for: "Qualitative carbonylation/purification boundary; generic gas/catalyst fate. Route A/B emission lists are excluded. No temperatures, pressures, ratios or factors used as defaults."
  - id: "celanese-acetic-2021"
    type: "handbook"
    reference: "Celanese, Glacial Acetic Acid Product Quality, Regulatory & Technical Information Package, status 11 October 2021, PDF1,4,9,10,18–20. https://www.celanese.com/-/media/cewebjssapp/project/documents/acetic-acid-product-dossier.pdf; retrieved 2026-10-13"
    used_for: "Primary technical product, rhodium methanol/CO manufacturing and distillation, bulk delivery, acid/water blending and distinct derivatives. Historical 99.85 wt% freezing-point sales specification example only, distinct from the PCR 99.8 wt% reference floor; actual SKU assay and current specification required, no universal recipe."
  - id: "jrc-cww-2016"
    type: "official_guidance"
    reference: "European Commission JRC, CWW BREF (2016), BAT2–5 printed543–544 / PDF573–574; treatment definitions PDF586. https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf; retrieved 2026-10-13"
    used_for: "Chemical-sector source/stream inventory, flow/species monitoring and treatment-fate collection. Method adapted to foreground LCI; no BAT-AEL or default efficiency represents actual emissions."
  - id: "celanese-carbonylation-2020"
    type: "literature"
    reference: "Celanese International Corp, US10807935B2, Process for continuous acetic acid production, grant 20 October 2020; Background; Reaction medium; Flash vessel; Purification/guard beds; Figure1. https://patents.google.com/patent/US10807935B2/en; retrieved 2026-10-13"
    used_for: "Primary patented topology and conditional component/impurity/guard-bed candidates. Patent embodiments, settings, concentrations and examples are not generic prescriptions; actual plant recipe and all additional species require measurement."
  - id: "ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, first edition March 2010, allocation discussion printed79–81 / PDF99–101. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf; retrieved 2026-10-13"
    used_for: "Attributional subdivision/allocation, physical causality and economic relationships; gate-adjusted observed market values and allocation limitations. No recipe, price, allocation share or provider quantity supplied."
