      record_type: "meter and provider data"
      raw_fields: "native electricity MJ/kWh; voltage; gas m3; T; absolute P; wet/dry composition; Z; heating value; meter/provider basis; support firing hours"
      collection_method: "Read calibrated stage meters and provider definitions, retain start-up/shutdown and reconcile site totals; do not equate gas secondary mass coefficient to density Aggregation detail: attributable measured exchange / Q from cp_product; per 1 kg reference flow"
      unit: "MJ; m3"
      frequency: "continuous/shift and abnormal events"
      temporal_coverage: "same complete campaign, including normal and abnormal states"
      site_scope: "actual acid plant and declared boundary"
