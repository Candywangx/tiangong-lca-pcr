      record_type: "delivery meter and enthalpy balance"
      raw_fields: "recipient; steam kg; pressure basis; T; dryness; feedwater; return condensate kg/T/P; losses; enthalpy source; useful heat acceptance"
      collection_method: "Use calibrated mass and state meters at actual delivery/return boundaries with a documented, verified IAPWS-IF97 property implementation/region and common enthalpy datum; reconcile kg and usable heat independently, without assuming a steam flow pressure Aggregation detail: attributable measured exchange / Q from cp_product; per 1 kg reference flow"
