allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Before using the allocation sequence, declare the ILCD modelling situation and the multifunctional functions. Sections6.5.4 and7.9.2 make allocation directly applicable to Situation C2 and conditionally applicable to A/B/C1 only under their stated feasibility/hierarchy conditions. Attributional modelling alone does not bypass the required assessment of system expansion/substitution: it can also apply in attributional situations A/C1, not only in consequential modelling. Record the applicable hierarchy, feasibility evidence and reasons for residual allocation; an unspecified decision context leaves the affected dataset incomplete. No automatic steam substitution credit follows from the existence of useful steam. Sources: jrc-ilcd-2010."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Keep an unallocated physical process graph and a separately labelled environmental-burden account. First assign separable operations using actual meters/records; disclose and justify any remaining joint-load allocation according to the declared study goal and the attributional multifunctionality conditions in ILCD sections6.5 and7.9.2–7.9.3 (jrc-ilcd-2010). A consequential substitution model requires independently justified displaced services and review. Determine physical causality where defensible; use economic allocation only for the residual flows that cannot be assigned by determining physical causality under the declared ILCD modelling situation. Use same-period actual quantities/prices at the point and condition where each co-function leaves this process; remove later conditioning, packaging and transport value, disclose missing price evidence and test sensitivity. No prescribed share applies. Steam export is counted only if useful delivery and recipient/return-condensate evidence exist; no automatic avoided-boiler credit. Conserved shares apply only to the joint environmental loads, not to finished-acid/steam physical mass or raw water/S balances. Record full co-product gas/salt quantities if actually produced; their existence requires separately applicable scope/identity. Waste never becomes a saleable co-product by changing a label; document hazard, value, acceptance and receiver. Sources: jrc-lvic-aaf-2007 section4.4.15 for useful heat export and jrc-ilcd-2010 sections6.5/7.9.2–7.9.3 for allocation conditions/conservation; no BREF export or energy-share example is a default."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "acid_manufacture"
      flow_role: "finished acid"
      record_type: "lot acceptance and stock records"
      raw_fields: "lot/SKU; net supplied solution kg Q; sampled H2SO4 fraction; water; impurities; sample method; tare; opening/closing stocks; specification; route"
      collection_method: "Calibrated scale or traceable tank/mass-flow reconciliation; measured density/temperature for volume conversions; representative assay and water analysis; reconcile same accepted lot Aggregation detail: accepted net solution mass Q; per 1 kg reference flow"
      unit: "kg"
      frequency: "each lot and campaign"
      temporal_coverage: "same complete campaign, including normal and abnormal states"
      site_scope: "actual acid plant and declared boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, originals, representativeness, composition/media and provider-basis evidence"
    - protocol_id: cp_material
      process_id: "acid_manufacture"
      flow_role: "sulfur; purchased acid; filter aid"
