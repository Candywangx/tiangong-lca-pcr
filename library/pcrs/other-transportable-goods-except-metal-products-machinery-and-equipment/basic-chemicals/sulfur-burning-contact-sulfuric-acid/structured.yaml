product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.basic-chemicals.sulfur-burning-contact-sulfuric-acid"
  classification_refs: "CPC3.0:34231; narrower sulfuric-acid route subset; no positive edge implied"
  covered_products: "93–98 mass-percent aqueous industrial sulfuric acid from elemental-sulfur dry DCDA manufacture"
  excluded_products: "Exclude phosphoric, nitric and sulphonitric acids, oleum/free-SO3 products, integrated oleum co-production, acid below93% or above98% under this identity, formulated mixed-acid preparations, metallurgical/sulfide-ore SO2 feeds, spent-acid/H2S regeneration, wet-catalysis acid and single-contact manufacture. Integrated chemical tail-gas scrubbing, electricity generation and on-site chemical water-treatment branches require additional reviewed atomic method coverage before this PCR alone can describe that configuration. Imported process-water treatment stays in compatible upstream datasets. Normal physical cooling/blowdown, actual washing and residue handling remain inside. No historical plant recipe, conversion, catalyst composition/lifetime, impurity limit, energy recovery or emission factor is imposed."
  representative_product: "One accepted bulk acid lot with actual measured assay, carrier water and impurity specification"
  production_route: "Sulfur receipt/melting/filtration; air drying; sulfur combustion; catalytic SO2 conversion and intermediate/final absorption; heat recovery; mist control; cooling/actual dilution; storage and bulk loading"
  market_state: "Complete bulk aqueous solution at factory gate; tanker/container tare excluded; actual loading included"
functional_unit:
  what: "Supply declared accepted industrial aqueous sulfuric acid"
  how_much: "1 kg reference flow"
  how_well: "Measured 93–98% H2SO4 mass fraction, water and actual impurity/SKU specification; no assumed assay"
  how_long_or_cycle: "Factory-gate supply during the declared complete production campaign/period, including start-up/shutdown and storage losses"
  reference_flow_link: "finished_acid"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Retain one aggregate foreground unit from receipt through bulk acceptance/loading, with separate stage data: receipt/melting/filtration → air drying and sulfur combustion/waste-heat boiler → first catalytic beds/intermediate absorption → later beds/final absorption/mist removal → acid cooling/actual water dilution/acceptance/storage/loading. Steam/condensate and acid-circulation links preserve identical sending/receiving mass and composition. Internal intermediate/final absorber acid is aggregated into one finished-acid output, avoiding duplicate reference UUID outputs. Retain sulfur/S, water/H/O and actual fossil/biogenic-carbon balances; measured residuals must be explained, never used to fabricate an emission. Sources: jrc-lvic-aaf-2007, epa-ap42-810-1993."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The cards are an atomic baseline, not permission to omit actual exchanges. Add a separately measured, chemically/physically specific row for every actual additional auxiliary, filter medium, coolant/refrigerant, packaging component, recovered salt/gas, waste, pollutant or outlet. Verify its identity/state/quantity and cite applicable original method evidence. Chemical scrubbing, on-site chemical water treatment, oleum and electricity co-production require expanded reviewed method scope; do not silently select this restricted PCR for them. Off-site acid-waste transfer is not an immediate water release; retained mist and filter dust are not external emissions. BREF wastewater case tables for TiO2/spent acid and smelters do not supply sulfur-burning defaults."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Maintain a complete physical ledger for wet inlet air, dry outlet carrier gas and outlet humidity as well as the listed burden-bearing exchanges. Measure air flow, temperature, absolute pressure, dry/wet convention, O2/N2 and actual other constituents; include dryer water transfer, excess oxygen and inert nitrogen in the total physical mass and H/O/N balances. Do not invent an air recipe or add O2/N2 environmental releases solely to force closure. When an actual air/oxygen supply is represented as an exchange, retain its own concrete atomic row, origin and verified identity; physical carrier-gas ledger coverage is required even where the LCI format omits those uncharacterised carriers."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Reconcile incoming whole streams plus opening stocks against outgoing whole streams plus closing stocks, with measured uncertainty and an explained residual. Nested component ledgers for S, H, O, actual C/N, catalyst V/Si/promoters and other measured elements must reconcile each whole stream without adding its components a second time to total mass. Record H2SO4, SO2, SO3, sulfate and retained water distinctly. The elemental-sulfur reaction sequence is S + O2 to SO2, SO2 + one-half O2 to SO3, then SO3 + H2O to H2SO4 (epa-ap42-810-1993); these are species transformations, not a default yield. Absorption consumes water chemically, while wet-air drying transfers water and actual fuel combustion may form water. A water-species formation/consumption term belongs only in the species ledger, never as a new total-mass source. Preserve free carrier water in acid, chemical solutions, wet cake/sludge, external condensate, steam and emissions. Dissolved pollutants already within a whole effluent are nested components, not extra whole-stream mass."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "External recipient condensate return crosses the foreground boundary: add a separate actual water-condensate input with measured full mass, composition, temperature/pressure and compatible identity, paired to the exported-steam interface. Internal condensate stays paired within the plant. Record steam-water opening/closing stocks, blowdown, vents and leaks. Keep delivered steam mass separate from useful heat. Derive ordinary-water enthalpy using measured absolute pressure/temperature/phase and a verified implementation of IAPWS-IF97 within its published regions (iapws-if97-2012); two-phase delivery also needs measured dryness and compatible saturated-phase properties. Use the same enthalpy datum for steam, returns, other measured boundary streams and stock changes. The useful-heat account must state recipient acceptance and the delivery boundary; subtract actual returns and account for losses only once at the boundary where they occur. No return is a documented boundary condition, never an assumed full or zero return. Imported steam and purchased heat are separate actual exchanges with their own physical or energy basis; do not count an on-site fuel and the heat it generates as two external purchases. Missing site state/quantity does not authorise a universal steam conversion."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Keep actual supported-catalyst charge, screening returns, losses and replacement; sulfur-filter aid and replaceable filter media; acid-mist filter elements; actual water-treatment auxiliaries; cleaning chemicals; container/pipeline/tanker maintenance and cleaning; returned acid and recovered sulfur inside the declared service and transfer ledgers. Add separate chemically/physically specific rows for each actual cross-boundary material, waste or service. Tare exclusion from product Q does not exclude container manufacture/reuse, cleaning or disposal burdens. Attribute long-life consumables and reusable containers using documented actual service intervals, cumulative accepted production/uses and stock/return records; reconcile full physical transactions separately from their attributed environmental loads and do not impose a lifetime or replacement recipe. Chemical product-purification or chemical water/tail-gas-treatment branches require their own reviewed method and atomic chemistry coverage; their actual inputs/products remain recorded when extending the model. Sources: jrc-lvic-aaf-2007, epa-ap42-810-1993, jrc-ilcd-2010, iapws-if97-2012."
      source_ids: []
