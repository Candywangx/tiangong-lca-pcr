      process_id: "acid_manufacture"
      flow_role: "product water and direct abstraction"
      record_type: "water-meter and source ledger"
      raw_fields: "supplier/basin/well; water source; gross m3/kg; temperature/density; cooling; absorption/dilution; boiler make-up; internal recycle; return"
      collection_method: "Meter each boundary/source/stage, distinguish outside receipts from recycle and abstraction; close actual water/product/steam/discharge balance Aggregation detail: attributable measured exchange / Q from cp_product; per 1 kg reference flow"
      unit: "kg; m3"
      frequency: "continuous/shift and campaign"
      temporal_coverage: "same complete campaign, including normal and abnormal states"
      site_scope: "actual acid plant and declared boundary"
      aggregation_rule: "per 1 kg reference flow"
