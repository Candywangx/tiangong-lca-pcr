      collection_method: "Weigh/invoice/meter receipts and reconcile consumption/stock changes, actual formulation and stage destination; preserve complete mixtures and real losses Aggregation detail: attributable measured exchange / Q from cp_product; per 1 kg reference flow"
      unit: "kg"
      frequency: "each receipt; continuous/shift totals"
      temporal_coverage: "same complete campaign, including normal and abnormal states"
