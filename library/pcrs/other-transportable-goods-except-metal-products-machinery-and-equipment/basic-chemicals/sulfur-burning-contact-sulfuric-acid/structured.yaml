  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Normalize each measured attributable exchange amount by Q from cp_product for the same campaign, preserving its native numerator unit. finished_acid is exactly 1 kg reference flow. Internal transfer quantities are recorded at both ends before aggregation, not added as new external rows."
      inputs:
        - "measured exchange"
        - Q
        - "native unit"
        - "same campaign"
      output: "native unit per 1 kg reference flow"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: component_ledger
      applies_to: "all inventory rows"
      rule: "Use measured mixture mass and measured constituent fractions for physical component amounts; reconcile sulfur, water and actual carbon stocks/inputs/outputs/losses without changing Q or assuming a recipe. Record uncertainty and explain closure residuals."
      inputs:
        - "supply mass"
        - "measured composition"
        - "stage stocks"
      output: "separate physical component ledger"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "1 kWh = 3.6 MJ; apply only to actual metered electricity, preserve the native Net calorific value reference property and the same campaign Q."
      inputs:
        - "meter kWh"
        - cp_energy
        - Q
      output: "MJ per 1 kg reference flow"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: steam_heat_balance
      applies_to: "steam_export"
      rule: "Retain full steam mass and separately compute useful delivered heat from measured delivered steam and actual return-condensate enthalpy/mass, losses and declared boundary. Require compatible pressure/temperature/dryness property method; never use a generic fuel calorific value as net steam delivery."
      inputs:
        - "cp_steam state and mass"
        - "documented enthalpy basis"
        - Q
      output: "physical kg and separately stated useful MJ per 1 kg reference flow"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: emission_integration
      applies_to: "sulfate_water, vanadium_water, so2_air, acid_mist, so3_air, no_air, no2_air, co2_air, co_air, ch4_air, n2o_air, evap_water, pm_fine, pm_middle, pm_coarse"
      rule: "Integrate measured species concentration times compatible actual outlet flow and covered time, preserving species mass and gas/water measurement bases; normalisation divides by Q. Combined Method8 or NOx-equivalent values stay unresolved until supported speciation/conversion, never duplicated."
      inputs:
        - "cp_air/cp_effluent"
        - species
        - "concentration/flow/time"
        - Q
      output: "species kg per 1 kg reference flow"
      source_ids:
        - epa-method8-2019
        - jrc-lvic-aaf-2007
    - id: dust_bins
      applies_to: "pm_fine, pm_middle, pm_coarse"
      rule: "Use three disjoint size bins; PM2.5–10 equals simultaneous compatible PM10 minus PM2.5; >10 equals compatible total dust minus PM10. Do not subtract across incompatible methods, periods or acid/non-acid fractions; retain collected dust separately."
      inputs:
        - "same-period non-overlapping dust measurement"
        - cp_air
        - Q
      output: "three separate residual dust amounts per 1 kg reference flow"
      source_ids:
        - jrc-lvic-aaf-2007
  data_quality_requirements:
    - id: identity_and_provider
      applies_to: "all inventory rows"
      requirement: "Verify one physical exchange, direct reference property/unit, lot/grade, supplier/receiver and route/media; an adopted identity alone never proves background or quantity compatibility. Blank UUID and missing quantity are not zero."
      evidence: "direct identity; source originals; actual supplier/receiver records"
    - id: complete_period
      applies_to: "all inventory rows"
      requirement: "Same accepted product campaign with representative normal, start-up/shutdown, cleaning, screening and abnormal loss coverage; report measured uncertainty and detections, never replace missing data with historic source examples."
      evidence: "calibration; sampling plan; coverage; source restrictions"
    - id: physical_closure
      applies_to: "all stage links"
      requirement: "Equal mass/composition at both internal endpoints; complete solution/steam/cake/sludge physically conserved before allocation; reconcile stock changes and water/S/carbon balances."
      evidence: "stage ledger and allocation account separately"
    - id: source_limits
      applies_to: "source-linked rules"
      requirement: "Apply each source only to its explicit route/species/method. BREF/AP42 historic cases are not universal recipes, operating performance, numerical defaults or legal-compliance claims."
      evidence: "source sections and site applicability decision"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Check finished_acid is the sole reference product output and its whole-solution amount is 1 kg; EN/ZH reference, denominator, protocols, row ids and calculation rules must agree. Require complete actual acid assay/route, supplier/property/quantity compatibility and direct emission media. Failure of mass/water/S balance, unsupported species/NOx or steam-net-enthalpy conversion, missing reference identity, unverified background linkage or uncovered actual branches leaves the affected dataset incomplete. Do not treat a PCR measurement/schema check as actual factory measurement or scientific approval. Document every not-applicable exchange with route evidence; missing values are pending. Check the three particulate bins and acid mist for overlap, the environmental versus off-site-waste boundary, and unallocated physical quantities versus allocated loads."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site/campaign-specific foreground manufacture dataset"
  downstream_use: "secondary_dataset; background_dataset after actual evidence completion and review"
  allowed_use: "Declared matching sulfur-burning DCDA bulk industrial acid with identical solution/assay and boundary bases"
  excluded_use: "Other acids or feed routes; oleum; unverified wet-scrubbing/co-production configurations; inferred legal compliance or universal process averages"
  required_metadata: "Elemental-sulfur origin/grade/assay; dry DCDA bed/absorber arrangement; actual lot/SKU; CAS7664-93-9; measured H2SO4 mass fraction/water/impurities and methods; complete net solution mass; no oleum; cooling/dilution/loading state; site/period; every utility provider/native reference basis; start-up/abnormal coverage; mist/SO3 and NO/NO2 speciation; water origin/outlet/receiver; actual waste composition/destination; steam pressure/temperature/dryness/return-condensate/enthalpy; allocation and unresolved interfaces"
  required_quality_disclosure: "Foreground coverage/uncertainty; unallocated balance; joint-burden allocation; quantity/provider/speciation/steam/UUID gaps; source scope limitations"
  update_trigger: "Change of sulfur origin, assay/SKU, bed/absorber arrangement, cooling/water/utility supplier basis, abatement, co-product receiver or monitoring/speciation method"
