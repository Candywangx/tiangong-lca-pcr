  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use 1 kg complete accepted net supplied solution, excluding tare. Q is accepted solution mass for the same campaign, measured by cp_product; neither pure H2SO4 mass nor total plant acid circulation is Q."
  - id: solution_basis
    applies_to: "sulfur_feed, makeup_acid, demin_water, cooling_water, supported_catalyst, filter_aid, finished_acid, steam_export, sulfur_filtercake, spent_catalyst, acid_effluent, water_sludge"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record supplied solution/mixture mass and separately measured component fractions. Active H2SO4 mass = solution mass times measured H2SO4 mass fraction; carrier water = separately determined water mass. Do not assume all non-acid mass is water when impurities exist. Preserve physical sulfur/water/component balances before allocation."
  - id: utility_basis
    applies_to: "natural_gas, electricity, steam_export, river_water, groundwater"
    required_property_ref:
      name: "Verified native property"
      uuid: ""
    required_unit: "native unit"
    rule: "Natural gas/abstraction use Volume/m3; electricity uses Net calorific value/MJ with exact kWh conversion. Gas T/P/wet-dry/composition/Z and supplier volume conditions must agree. Steam uses measured physical mass and separately balanced usable heat; an MJ property alone does not prove net delivery."
  - id: species_media
    applies_to: "all elementary outputs"
    required_property_ref:
      name: "Mass or verified Volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Quantities must match chemical species/element basis, phase and receiving medium. Combined acid-equivalent/NOx results require compatible speciation, never duplicate or substitute molecules. Keep resources, process products, off-site wastes and environmental releases distinct."
