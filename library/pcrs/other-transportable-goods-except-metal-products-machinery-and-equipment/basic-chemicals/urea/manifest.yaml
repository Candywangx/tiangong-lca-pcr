      issue: "No compatible process-condensate-to-treatment identity verified. Candidate silicon/manganese/textile/coal origins or discharge-to-water routes do not match."
  provider_basis_requirements:
    - "CO2 and compressed-air Volume/m3 definitions must match measured temperature, absolute pressure, wet/dry state, composition and compressibility. Identity alone supplies no gas density or provider."
    - "Broad Mass/kg steam identity is not pressure-specific supply evidence or net heat. Each header requires actual pressure, temperature, dryness, condensate return and supplier reference-basis compatibility; no 11.0 or 0.45 MPaG assumption."
    - "Electricity identity is 1-35 kV grid-average consumption mix; actual voltage, generation geography, period and loss boundary require matching provider evidence."
    - "Waste destinations, treated-water acceptance, atmospheric release descriptors and freshwater receiving body are future dataset facts. No default emissions, recipe, yield, purity or allocation share is assigned."
