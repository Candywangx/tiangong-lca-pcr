    type: "literature"
    reference: "Yara International, [Technical Urea](https://www.yara.com/industrial-nitrogen/base-chemicals/technical-urea/), sections “You can get Urea in two forms” and “How we produce Urea”, accessed 2026-10-13 UTC."
    used_for: "Producer confirmation of prill/granule and additive-free prill option, ammonia/CO2 manufacture, solid versus solution state. No SKU/quantity defaults."
  - id: "unsd-cpc3-urea"
    type: "official_guidance"
    reference: "UNSD, [CPC Version 3.0 subclass 34611 — Urea](https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/34611) and class 3461 breakdown, accessed 2026-10-13 UTC."
    used_for: "Classification location and distinction from subclass 34616 UAN; narrower scope recommendation, not proof of complete classification coverage."
