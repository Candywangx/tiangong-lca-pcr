measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use accepted net bulk product mass Q for the same period, corrected for stocks and returns; exclude transport vehicle tare. Report moisture and urea assay without changing the supplied-mass denominator."
  - id: gas_volume
    applies_to: "feed_co2, passivation_air"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Match actual and provider gas volume conventions using recorded absolute pressure, temperature, composition, wet/dry state and compressibility. Unknown compatibility makes that dataset link incomplete; no universal density or a secondary database mass coefficient is accepted."
  - id: steam_basis
    applies_to: "steam_hp, steam_mp, steam_lp, steam_export"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain each actual header separately and reconcile condensate return. Net usable heat comes from measured steam/condensate enthalpy and the supplier boundary, not from a steam UUID or a generic MJ property."
  - id: electricity_unit
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "The selected property uses the native label Net calorific value and energy unit MJ. Meter electrical energy and document kWh-to-MJ conversion, not a combustion heating-value assumption."
  - id: species_basis
    applies_to: "nh3_air, nh3_water, ammonium_water, urea_water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Distinguish molecular mass from kg N; preserve analysis definitions and molecular-mass conversion factors. NH3 and NH4+ must partition measured total ammoniacal nitrogen rather than each repeat it."
  - id: dust_bands
    applies_to: "pm_fine_air, pm_coarse_air, pm_over10_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use disjoint size-band masses. A cumulative PM10 result includes PM2.5; derive the coarse band only from measurements on a compatible sampling basis and retain uncertainties."
