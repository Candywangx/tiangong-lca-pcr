allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "These allocation rules are authored modelling requirements. The BREF supports the integrated material/energy context, not an ISO allocation hierarchy or market-price evidence."
    source_ids: []
  - rule_id: allocation_avoid
    applies_to: "urea_manufacture"
    rule: "First subdivide by actual meters and process origin; assign attributable feeds, utilities and emissions directly. Internal recycling is not a coproduct. The selected foreground reference is urea, not ammonia manufacture."
    source_ids:
      - ec-lvic-aaf-2007
  - rule_id: allocation_physical
    applies_to: "urea_manufacture"
    rule: "Keep all physical coproduct outputs, stage balances and internal links at measured full quantity. Allocation shares act on shared environmental burdens, not physical output mass, water or heat."
    source_ids:
      - ec-lvic-aaf-2007
  - rule_id: allocation_residual
    applies_to: "urea_manufacture"
    rule: "For genuinely inseparable shared burdens with usable exported steam or accepted recovered water, document the causal relationship, basis and denominator and test sensitivity. If no defensible physical relationship exists, disclose a chosen economic allocation using actual comparable-period net values; no default share or price is prescribed. Reject unsupported shares rather than forcing a single-product balance."
    source_ids:
      - ec-lvic-aaf-2007
  - rule_id: allocation_co2
    applies_to: "feed_co2"
    rule: "Disclose CO2 provider capture/purification/compression energy and upstream allocation. Do not award a capture credit and also deduct product-retained carbon as a negative emission. Downstream release is outside the factory-gate boundary; disclose carbon provenance and quantity for later modelling."
    source_ids:
      - ec-lvic-aaf-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "urea_manufacture"
      flow_role: "urea_finished"
      record_type: "weighing and assay"
      raw_fields: "net delivered mass; opening/closing finished stocks; returns; SKU; grade; urea assay; total N; water; biuret; free NH3; particle size; formulation"
      collection_method: "Calibrated bulk scales, stock reconciliation and documented representative sampling/analysis; verify actual additive-free formulation. Divide raw period totals by same-period Q using normalize_period and the aggregation basis below."
      unit: "kg; mass fractions"
      frequency: "each lot; period reconciliation"
      temporal_coverage: "same declared representative period including abnormal operation"
      site_scope: "same site and route; accepted bulk delivery"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; assay methods and certificates; acceptance and stock records"
    - protocol_id: cp_feed
      process_id: "urea_manufacture"
      flow_role: "feed_ammonia; feed_co2; passivation_air"
      record_type: "receipt, meter and composition records"
      raw_fields: "feed totals; stock changes; composition; purity; carbon origin; phase; T; absolute P; wet/dry basis; Z; supplier reference convention; air O2"
      collection_method: "Calibrated mass/volume meters and tank reconciliation; validate gas conversion using sample composition and compatible equation/state definition. Divide raw period totals by same-period Q using normalize_period and the aggregation basis below."
      unit: "kg; m3; composition; T; P"
      frequency: "continuous/batch; regular assay"
      temporal_coverage: "same period as Q"
      site_scope: "external feed interfaces and internal recycle meters distinguished"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; gas certificates; supplier basis; conversion calculation"
    - protocol_id: cp_energy
      process_id: "urea_manufacture"
      flow_role: "electricity; steam_hp; steam_mp; steam_lp; steam_export"
      record_type: "meter and enthalpy records"
      raw_fields: "electrical kWh; voltage; supplier/mix; each steam header mass, T, P, quality; condensate-return mass and enthalpy; stage duties; export user"
      collection_method: "Submeter compressors, synthesis/recovery, concentration, finishing/cooling, loading and controls. Use pressure/temperature/dryness and traceable steam properties for enthalpy balances; separate mass/heat and imports/exports. Divide raw period totals by same-period Q using normalize_period and the aggregation basis below."
      unit: "kWh; MJ; kg; T; P"
      frequency: "continuous or shift totals"
      temporal_coverage: "same period as Q"
      site_scope: "all included stages and each external utility header"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter checks; enthalpy method/version; provider reference boundary; separate condensate ledger"
    - protocol_id: cp_water
      process_id: "urea_manufacture"
      flow_role: "water_makeup; water_reuse_export; water_vapour"
      record_type: "water meter and stage balance"
      raw_fields: "make-up and circulation; independently evidenced net reaction-water formation/consumption; stage assays and reaction extents/model inputs; steam-derived water; stream density/composition and fraction bases; flush/seal/scrubber water; internal reuse; evaporation; condensate return; opening/closing liquid/WIP stocks; external receiver and quality"
      collection_method: "Meter external water interfaces and collect stage assays/state records for synthesis, included hydrolysis and other actual reactions. Determine reaction-water terms through assay_balance from independent actual reaction-extent evidence, not the residual needed to close this water ledger. Reconcile measured steam-derived/carrier water, liquid outputs, atmospheric losses and stock changes with uncertainty; record receiver acceptance. Retain raw complete-pool totals and apply normalize_period once."
      unit: "kg; m3; composition"
      frequency: "continuous/batch; period balance"
      temporal_coverage: "same period as Q"
      site_scope: "cooling, concentration and treatment circuits"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter checks; assay and reaction-model basis; physical water ledger; reaction-extent and measurement uncertainty"
    - protocol_id: cp_waste
      process_id: "urea_manufacture"
      flow_role: "waste_urea; wastewater_transfer"
      record_type: "dispatch and receiver records"
      raw_fields: "wet/dry mass; volume; water; urea; NH3/NH4; total N; COD; pH; solids; contaminants; receiver; treatment; transport"
      collection_method: "Weigh discarded solids and meter transferred condensate; representative composition analysis and receiver/treatment acceptance. No unverified generic waste UUID substitutes for origin/fate. Divide raw period totals by same-period Q using normalize_period and the aggregation basis below."
      unit: "kg; m3; mg/L; mass fractions"
      frequency: "each dispatch; representative samples"
      temporal_coverage: "same period as Q"
      site_scope: "each external waste-to-treatment interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge/meters; analytical QA; transfer receipts and destination contract"
    - protocol_id: cp_air
      process_id: "urea_manufacture"
      flow_role: "nh3_air; co2_fossil_air; co2_bio_air; pm_fine_air; pm_coarse_air; pm_over10_air; methane_air; co_air"
      record_type: "emission monitoring and vent balance"
      raw_fields: "source; post-control concentration; dry/wet gas flow; T/P; duration; particle cumulative/band definition; NH3 molecular basis; fossil/biogenic carbon evidence; impurities; control state; abnormal events"
      collection_method: "Measure each external atmospheric source after controls with matched concentration/flow conditions and duration; include fugitive and event inventories with justified methods. Size-band sampling and control inlet/outlet distinctions are retained; no historic factor copied as a default. Divide raw period totals by same-period Q using normalize_period and the aggregation basis below."
      unit: "kg; mg/m3; m3; time"
      frequency: "continuous or representative tests plus events"
      temporal_coverage: "same period as Q including startup/shutdown"
      site_scope: "synthesis/recovery, concentration, finishing, cooling, screening, storage/loading and controls"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test method/calibration; gas state conventions; source map; detection limits; control operation; uncertainty"
    - protocol_id: cp_effluent
      process_id: "urea_manufacture"
      flow_role: "nh3_water; ammonium_water; urea_water; liquid_water"
      record_type: "final discharge flow and speciation analysis"
      raw_fields: "direct discharge volume; receiving body; pH/T; NH3; NH4; urea; total N; COD; sampling; detection limits; treatment bypass"
      collection_method: "Flow-proportional representative sampling at the final natural-discharge interface after included treatment; establish molecular/species versus N basis and speciation without duplicating total ammonia. Wastewater-to-treatment uses cp_waste instead. Divide raw period totals by same-period Q using normalize_period and the aggregation basis below."
      unit: "m3; mg/L; kg; pH; T"
      frequency: "continuous flow; representative samples and bypass events"
      temporal_coverage: "same period as Q"
      site_scope: "direct freshwater discharge only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory methods; flow calibration; molecular factors/speciation; receiver and treatment boundary"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each non-reference exchange i, q_i = X_i / Q exactly once. X_i is the raw attributable stock-corrected exchange for the complete reporting pool defined above, before per-kg division; Q is accepted net supplied urea kg matched to that same site, route, grade/state and pool. Reconcile receipts, production/delivery, returns, opening/closing stocks and WIP with their attributable burdens; do not charge current loads to unmatched shipments or omit failed/zero-output/rework burdens. Prior-period stock requires its matched prior burdens or exclusion from Q. A zero-output subperiod retains its burdens in a justified complete pool with positive Q; if the complete pool has no positive Q, report the per-kg result unavailable, never zero burden or division by zero. Credit each final accepted net lot once after returns and reacceptance; internal rework is not additional product output. Keep urea_finished exactly 1 kg; allocation does not scale physical outputs or alter Q."
      inputs:
        - "period exchange"
        - Q
        - cp_product
        - "applicable row protocol"
      output: "exchange per 1 kg reference flow, or unavailable when no positive matched Q exists"
      source_ids:
        - ec-lvic-aaf-2007
    - id: assay_balance
      applies_to: "feed_ammonia, feed_co2, urea_finished, waste_urea, wastewater_transfer"
      rule: "For a physical mass measured in kg, species kg = physical kg times measured species mass fraction. For feed_co2 recorded in m3, first establish mass from measured gas composition, absolute P, T, wet/dry state, Z and a documented compatible conversion, or obtain species moles from the validated molar/volume-fraction basis and convert with documented molecular masses. Never multiply m3 directly by a mass fraction to obtain kg. Convert liquid volume using measured stream density/state before applying mass fractions; retain full solution mass, assayed constituents and carrier water separately. These component accounts do not replace the actual supplier reference quantity or supplied-product denominator. Conserve total mass and relevant C/N/H/O across all inputs, outputs and stage stocks. Separately establish actual net water formation/consumption and dry-species conversion from stage assays and an independently supported reaction-extent model, including urea synthesis, included hydrolysis and actual side reactions. Do not determine those terms by forcing water or dry-component residuals to close. Stoichiometry is a consistency test, not a yield, complete-conversion or actual-consumption default."
      inputs:
        - "assays and fraction bases"
        - "molecular masses"
        - "verified gas/liquid conversions"
        - "actual reaction-extent evidence"
        - "stage stocks"
        - cp_feed
        - cp_product
        - cp_water
        - cp_energy
        - cp_waste
        - cp_air
        - cp_effluent
      output: "species kg, conserved mass/element ledger and independently evidenced reaction-water terms with uncertainty"
      source_ids:
        - ec-lvic-aaf-2007
    - id: air_load
      applies_to: "nh3_air, co2_fossil_air, co2_bio_air, pm_fine_air, pm_coarse_air, pm_over10_air, methane_air, co_air"
      rule: "For compatible gas-state definitions, source load = sum of concentration times gas volume over matched intervals with explicit unit conversion. Reconcile controlled outlet, fugitives and events once; retain detection-limit treatment and uncertainty."
      inputs:
        - "source concentration"
        - volume
        - duration
        - cp_air
      output: "post-control species/band load"
      source_ids:
        - epa-ap42-urea-1993
        - ec-lvic-aaf-2007
    - id: effluent_load
      applies_to: "nh3_water, ammonium_water, urea_water"
      rule: "Species load = sum of species concentration times discharge volume for matched intervals. Convert mg/L with m3 to kg explicitly; convert kg N to molecular species only with supported assay/speciation and molecular-mass ratios."
      inputs:
        - volume
        - concentration
        - "assay basis"
        - "pH/T"
        - cp_effluent
      output: "direct freshwater species mass"
      source_ids:
        - ec-lvic-aaf-2007
    - id: energy_balance
      applies_to: "steam_hp, steam_mp, steam_lp, steam_export"
      rule: "Usable steam heat = incoming mass times incoming specific enthalpy minus actual condensate-return heat, with the measured system boundary and losses disclosed. Keep electrical energy separate; kWh times 3.6 gives MJ. Do not sum internal recovery and external supply twice."
      inputs:
        - "steam/condensate meters"
        - state
        - "enthalpy basis"
        - cp_energy
      output: "header mass/heat balance and metered electricity"
      source_ids:
        - ec-lvic-aaf-2007
    - id: allocation_ledger
      applies_to: "all inventory rows"
      rule: "Apply documented shares only to inseparable shared environmental burdens after direct attribution. Shares sum to one for their declared burden pool. Retain all physical coproduct quantities in an unallocated ledger; no fixed share is specified."
      inputs:
        - "direct attribution"
        - "causal/economic basis"
        - "burden pool"
        - "output quantities"
      output: "separate allocated burden ledger"
      source_ids:
        - ec-lvic-aaf-2007
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Verify physical species, phase, formulation, route, medium, primary property and units; a UUID is identity evidence only. Record unresolved waste identity and basis/provider gaps."
      evidence: "direct identities; supplier/receiver specification"
    - id: period
      applies_to: "all inventory rows"
      requirement: "Use one declared representative period and site/route; disclose production rate, startup/shutdown, seasonal finishing conditions and missing records. Never import one-factory historical consumption as a universal amount."
      evidence: "production/meter logs; assay and source scope"
    - id: closure
      applies_to: "urea_manufacture"
      requirement: "Reconcile physical mass, nitrogen, carbon, water and each steam header, including opening/closing stocks, reaction water, products, losses and all destinations; investigate residuals against measurement uncertainty, not an invented tolerance."
      evidence: "separate stage physical ledger; uncertainty budget"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Check actual formulation, passivation, cleaning, maintenance and gas/effluent impurities. Add each additional actual chemical, waste or emission as a separate verified atomic exchange; unknowns cannot be declared zero or complete."
      evidence: "site process map; procurement and source monitoring"
    - id: background
      applies_to: "product inputs; waste outputs"
      requirement: "Match background supply/treatment state, grade, reference quantity, geography/period and allocation. Unconfirmed gas/steam bases or receiving conditions make the dataset link incomplete."
      evidence: "provider metadata; meter and treatment compatibility"
validation_rules:
  - rule_id: validate_scope
    applies_to: "urea_manufacture"
    rule: "Reject supplied solutions, UAN, incompatible grades/routes and intentional coating/conditioning additives. Verify reference UUID/state, product qualifiers and one finished reference output."
    source_ids:
      - unsd-cpc3-urea
      - yara-technical-urea
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Reference amount, inventory normalization and linked protocol aggregation all use 1 kg accepted supplied urea and the same measured Q. Reject purity- or N-normalized values mislabeled as supplied-product mass."
    source_ids:
      - ec-lvic-aaf-2007
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Each row is one atomic exchange. Check UUID species/route/CAS, native property/unit and Chinese name; reject correction flows, near-name substitutes and incompatible media. Blank identity remains explicit; verified identity does not establish a complete provider link."
    source_ids:
      - ec-lvic-aaf-2007
  - rule_id: validate_balances
    applies_to: "urea_manufacture"
    rule: "Require physical mass/water/N/C/steam closure evidence and equal-quantity internal links. Verify allocation burdens separately; never multiply physical coproduct outputs by allocation shares."
    source_ids:
      - ec-lvic-aaf-2007
  - rule_id: validate_emissions
    applies_to: "urea_manufacture"
    rule: "Cover actual post-control vents, finishing and loading dust, leaks/events, evaporated water and final effluent/transfer fate. Use disjoint dust bands, molecular nitrogen species and fossil/biogenic carbon provenance; do not infer default positive emissions or delete measured biogenic CO2."
    source_ids:
      - ec-lvic-aaf-2007
      - epa-ap42-urea-1993
  - rule_id: validate_gaps
    applies_to: "all inventory rows"
    rule: "Before claiming dataset completeness, resolve all applicable waste UUIDs, actual SKU/assays, utility basis/provider matches, additional detected species and receiver conditions. Non-detect, measured zero, absent interface and unknown quantity remain distinct; undisclosed gaps fail completeness."
    source_ids:
      - ec-lvic-aaf-2007
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "upstream urea input with known grade and route"
  allowed_use: "actual declared additive-free solid urea, factory-gate boundary and quality limitations"
  excluded_use: "no end-use fertilisation/SCR service, UAN/supplied solutions, additive formulation, incompatible technology or unresolved basis links"
  required_metadata: "product qualifiers; route/site/period; physical reference basis; all applicable atomic flows; physical unallocated and allocated-burden ledgers; background/treatment interfaces"
  required_quality_disclosure: "measured/calculated/estimated distinction; representativeness, detection limits, uncertainty, missing items and basis-match state; future protocols are not existing measured data"
  update_trigger: "changes in SKU/formulation, purity/moisture, synthesis/finishing technology, headers/providers, controls or destination"
data_sources:
  - id: "ec-lvic-aaf-2007"
    type: "official_guidance"
    reference: "European Commission, LVIC-AAF BREF, August 2007. [Official full text](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf), §1.5.1 (printed 33/PDF 61), §8.2.1 and Figure 8.1 (324–326/PDF 352–354), Tables 8.5–8.10 (329–335/PDF 357–363), §8.4.12–8.4.13 (357–359/PDF 385–387), §8.5 (362/PDF 390)."
    used_for: "Historical synthesis/recovery/particle-formation and water-treatment boundary; separate utility/state and balance measurements. Cases/BAT levels do not supply universal amounts, yield, recipe or current legal thresholds."
  - id: "epa-ap42-urea-1993"
    type: "official_guidance"
    reference: "US EPA, AP-42 §8.2 Urea, July 1993, reformatted January 1995. [Official full text](https://www.epa.gov/sites/default/files/2020-09/documents/8.2_urea.pdf), §8.2.1–8.2.3, Figure 8.2-1, pp.8.2-1–8.2-3."
    used_for: "Independent historical process/source map; finishing dust, ammonia and conditioning distinction. Route-specific/controlled factors and old factory observations are not defaults."
