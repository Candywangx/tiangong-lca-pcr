  classification_refs: "CPC 3.0 34611 Urea; narrower scope; classification is not methodology identity"
  covered_products: "Accepted additive-free uncoated bulk solid urea prills or granules"
  excluded_products: "UAN, supplied solutions, coating/additive formulations, resins, melamine, specialised purification/recrystallisation routes"
  representative_product: "Bulk urea prills meeting the actual agricultural grade and declared purity/moisture/biuret requirements"
  production_route: "Liquid ammonia/CO2 high-pressure synthesis; total reactant recycle; concentration and particle formation; cooling/screening; declared gas/water treatment"
  market_state: "Bulk solid at factory gate, measured as net physical supplied mass; residual water and impurities analysed separately"
functional_unit:
  what: "Supply usable urea feedstock at factory gate, without substituting fertilisation or end-use service"
  how_much: "1 kg accepted bulk solid urea in its supplied state"
  how_well: "Actual SKU/grade acceptance; disclose urea, total N, moisture, biuret, free ammonia, particle size and additive-free confirmation"
  how_long_or_cycle: "One factory-gate delivery within the same declared representative collection period; no downstream service lifetime"
  reference_flow_link: "urea_finished"
system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "urea_manufacture"
      rule: "Include receiving, compression/pumping, synthesis, stripping/decomposition and recovery, concentration, selected particle formation, cooling/screening, storage/loading and their gas/water controls. Phase records remain separately measurable within one foreground unit."
      source_ids:
        - ec-lvic-aaf-2007
        - epa-ap42-urea-1993
    - rule_id: boundary_recycle
      applies_to: "urea_manufacture"
      rule: "Record internal flow endpoints in the same physical unit/state. Recovered material is neither new purchased feed nor avoided burden. Include external losses and treatment transfers once."
      source_ids:
        - ec-lvic-aaf-2007
    - rule_id: boundary_utilities
      applies_to: "urea_manufacture"
      rule: "Retain steam-header imports, recoveries, exports and condensate return separately. Source Table 8.19 excludes particle formation from its energy example; collected energy must also include actual finishing, cooling and controls."
      source_ids:
        - ec-lvic-aaf-2007
    - rule_id: boundary_water
      applies_to: "urea_manufacture"
      rule: "Separate internal process-water reuse, external reuse product, wastewater-to-treatment and direct natural discharge. Biological treatment and its chemicals/emissions require a separate treatment unit; no universal recipe is given."
      source_ids:
        - ec-lvic-aaf-2007
    - rule_id: boundary_scope
      applies_to: "urea_manufacture"
      rule: "Confirm additive-free route from procurement/formulation records; isolate incompatible variants. Atmospheric source inventories include detected feed impurities; any additional actual substance must be a separately identified atomic row, not silently omitted or represented by total VOC/total nitrogen."
      source_ids:
        - epa-ap42-urea-1993
        - ec-lvic-aaf-2007
        - yara-technical-urea
boundary_abstraction:
  declared_starting_condition: "Receipt of external liquid ammonia, CO2, treated process water and utilities; record opening stocks of recycle liquor/seeds/water/steam"
  starting_condition_role: "foreground_gate"
  product_classification_scope: "Additive-free bulk solid urea; a narrower part of CPC 34611"
  recursive_input_rule: "Keep internal recovered NH3/CO2/carbamate, urea fines, condensate and steam as equal-quantity internal links; purchased urea of the same category requires its upstream link without infinite recursion through this unit"
  upstream_dataset_requirement: "Link actual feedstock origin, quality, transport and supply energy, utilities and waste-treatment providers; unknown bases/missing providers are explicit dataset gaps"
  disclosure: "Disclose stages, chosen finishing route, meter boundaries, internal/external interfaces, controls, abnormal operation, utility sources and discharge/reuse destinations"
