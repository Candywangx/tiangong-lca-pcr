        - eu-lvics-2007
        - eu-ef-multifunctionality-2021
    - rule_id: b_emissions
      applies_to: "all elementary output rows"
      rule: "Include measured atmospheric and actual receiving-water releases after abatement, including start/stop events and leaks. Closed-loop or negligible historical emissions are not proof of zero; not-applicable/zero, missing measurement and nondetect remain distinct. Different receiving media require separately verified identities."
      source_ids:
        - eu-lvics-2007
    - rule_id: b_capital
      applies_to: "chlorate_production"
      rule: "Declare capital-equipment treatment under the study method; do not hide consumed electrode/filter replacements as capital. No default infrastructure, fuel boiler, packaging or refrigerated route is inserted. Any actual extension must have its own atomic rows, basis and applicable original evidence."
