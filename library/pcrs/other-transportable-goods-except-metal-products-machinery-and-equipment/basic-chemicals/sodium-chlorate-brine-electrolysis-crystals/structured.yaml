    - rule_id: b_route
      applies_to: "chlorate_production"
      rule: "Include brine making/purification, rectification/electrolysis/reaction, crystallization/washing/drying, hydrogen scrubbing, solid handling, actual effluent/waste management and represented consumable replacement. Retain stage meters even when modelled as one foreground unit."
