          description: "Conditional measured CO2 from actual acid contact with carbonate-bearing deposits. Establish source carbon origin and speciation and reconcile the inorganic-carbon ledger; this is not a boiler emission factor. The actual mineral-carbon origin and provider/characterization quantity convention must be established before linking this exchange; a fossil-carbon label alone is insufficient. No biogenic carbon is erased if actually present: add its separately verified atomic exchange with origin evidence."
          amount:
            expression: "Actual measured quantity per 1 kg reference flow, collected through the stated protocol and normalized from the same-period physical total as defined in section 8."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_air
              source_ids:
                - eu-lvics-2007
            ranges: []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The unallocated physical ledger contains the full measured chlorate crystal, useful hydrogen, recovered external heat, actual wastes and releases. Allocation operates on attributable environmental burdens; it never multiplies a co-product’s physical mass/heat by its own allocation share. This separation is essential to preserve material/element and energy closure. The generic hierarchy in eu-ef-multifunctionality-2021 Annex I §4.5 informs this PCR; no claim of a complete PEF study or sector-specific approval follows."
    source_ids: []
  - rule_id: a_physical
    applies_to: "chlorate_production"
    rule: "Preserve measured physical quantities for all outputs, internal reuse, stocks, wastes and releases before allocating. Sold hydrogen, vented H2 and internal gas movements are distinct; recovered internal heat is not an exported co-product."
    source_ids:
      - eu-lvics-2007
      - eu-ef-multifunctionality-2021
  - rule_id: a_hierarchy
    applies_to: "shared burdens"
    rule: "Investigate subdivision/system expansion first, then a relevant demonstrated physical relationship. Assign separable crystal-drying or hydrogen-conditioning activities to their actual outputs; do not infer a causal allocation from theoretical mass ratio or generic heating values. Record the rejected choices and justification."
    source_ids:
      - eu-ef-multifunctionality-2021
  - rule_id: a_economic
    applies_to: "non-separable joint burdens"
    rule: "If the earlier hierarchy cannot supply a defensible method, use actual period-matched accepted output gate values: crystal value, useful exported hydrogen value and useful exported recovered-heat value. Apply economic_share only to the remaining joint environmental burdens, retain sensitivity and actual prices, and leave unknown value/share unresolved."
    source_ids:
      - eu-ef-multifunctionality-2021
  - rule_id: a_wastes
    applies_to: "all waste output rows"
    rule: "Establish product versus waste from actual acceptance/use and the study’s applicable methodology, not merely a flow name or positive mass. Retain measured waste transport/treatment responsibilities. No routine sale, avoided burden or recycling credit is presumed."
    source_ids:
      - eu-lvics-2007
      - eu-ef-multifunctionality-2021
  - rule_id: a_substitution
    applies_to: "hydrogen_product, heat_export"
    rule: "Any separate system-expansion/substitution scenario needs an empirically established user, displaced product/service, compatible technology and quantity basis. Do not combine a substitution credit and allocation benefit for the same outlet. Report the expanded system and uncertainty explicitly."
    source_ids:
      - eu-ef-multifunctionality-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "chlorate_production"
      flow_role: "chlorate_product"
      record_type: "acceptance_and_stock_records"
      raw_fields: "batch; SKU; calibrated net accepted mass P; free moisture; NaClO3 assay and wet/dry basis; chloride/co-salts; total/valence-specific Cr; rejected/reworked mass; opening/closing stock"
      collection_method: "Weigh accepted bulk dry crystal, excluding container tare; sample representative lots for actual moisture/assay and impurities using a validated matrix-specific lab method. Reconcile production, dispatch and stock without recounting rework. Manufacturer solution titration is planning evidence, not a validated crystal default."
      unit: "kg; assay mass fraction"
      frequency: "each batch; stock at period bounds"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; assay basis and matrix recovery; moisture method"
    - protocol_id: cp_inputs
      process_id: "chlorate_production"
      flow_role: "chemical inputs, nitrogen and incoming_bag"
      record_type: "receipts_dosing_and_stock"
      raw_fields: "row_id; supplier/SKU/CAS; delivery grade/state/route; solution/hydrate formula; assay; free/bound/carrier water; weigh/dose records; opening/closing stock; return; actual incoming bag tare/liner and package stock; gas T/P/composition/Z"
      collection_method: "Reconcile delivered and consumed material per row using calibrated weighing/dosing and inventory changes. Keep each supplier solution/hydrate gross mass and components. Record incoming_bag empty mass separately from chemical net contents and bind actual package stocks/returns to the outgoing paper and retained-reagent ledgers. Gas volume needs the actual reference-condition conversion; assay/source differences require separate grade records."
      unit: "kg; gas conditions; mass fraction"
      frequency: "each receipt and dose; inventory at bounds"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier original; certificates; scale/doser calibration; physical/source compatibility"
    - protocol_id: cp_water
      process_id: "chlorate_production"
      flow_role: "process_water, water_air"
      record_type: "water_meter_and_phase_balance"
      raw_fields: "inlet meters by use; makeup; recycle-link ends; actual density/T; solution carrier water; hydrate bound water; steam/condensate physical water; product moisture; wet wastes; discharge; humidity; stock"
      collection_method: "Measure fresh supplied water by use and convert the Mass row with actual density. Reconcile water in purchased solutions, internal loops, steam/return, accepted product, wet wastes, final discharge and net vapour. Subtract inlet ambient humidity and do not count recycle throughput as withdrawal."
      unit: "kg; m3; temperature; humidity"
      frequency: "continuous meters; matched samples; events"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; density/sample conditions; phase closure and uncertainty"
    - protocol_id: cp_energy
      process_id: "chlorate_production"
      flow_role: "electricity"
      record_type: "energy_meter_records"
      raw_fields: "AC inlet kWh; voltage/grid/provider; stage meters; rectifier losses; DC cell measurement; meter boundary; idle/start-stop; shared auxiliaries"
      collection_method: "Read plant AC and stage meters, reconcile losses and shared loads; retain actual provider loss boundary. Convert kWh to MJ using 3.6 exactly; no source energy-use range substitutes for measured values."
      unit: "kWh; MJ; voltage"
      frequency: "continuous; aggregate matched period"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; provider reference-energy confirmation; AC/DC balance"
    - protocol_id: cp_steam
      process_id: "chlorate_production"
      flow_role: "steam_heat"
      record_type: "steam_heat_interface_measurement"
      raw_fields: "steam mass flow; absolute/gauge pressure definition; temperature; quality; provider inlet enthalpy; returned condensate mass/T/enthalpy; water losses; heat meter; vacuum/dryer stages"
      collection_method: "Measure the contractual steam/condensate interface and validate its enthalpy method with actual supplier conditions. Keep net delivered MJ and all physical water transfers. Unknown pressure or provider heat basis remains unresolved rather than being represented by a convenient steam UUID."
      unit: "kg; pressure; temperature; kJ/kg; MJ"
      frequency: "continuous flow/heat; matched condition samples"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "flowmeter/heatmeter calibration; supplier net-heat definition; enthalpy method and uncertainty"
    - protocol_id: cp_consumables
      process_id: "chlorate_production"
      flow_role: "anode, cathode, filter_cartridge"
      record_type: "replacement_campaign_records"
      raw_fields: "row_id; installed component SKU/material/coating; actual net mass; removal date; reuse/recoating; service life; represented campaign output; contamination; receiver"
      collection_method: "Weigh and record each actual replacement/component or verified recoating service. Attribute the consumed portion to the represented campaign using documented life/output, keeping return and new supply separate; no generic lifetime or assumed throughput default."
      unit: "kg; campaign output kg"
      frequency: "each replacement; campaign reconciliation"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component/supplier specification; weigh tickets; traceable campaign attribution"
    - protocol_id: cp_coproduct
      process_id: "chlorate_production"
      flow_role: "hydrogen_product, heat_export"
      record_type: "export_delivery_records"
      raw_fields: "hydrogen total gas; species fraction; residual Cl2/O2; T/P/Z/wet-dry; accepted/exported/vented/storage quantities; gas recipient; heat supply/return conditions and net delivered enthalpy; internal heat reuse"
      collection_method: "Measure actual useful external gas/heat acceptance and its purification/conditioning. Reconcile generated species against vent/export/storage using compatible gas bases. Track internal heat separately; do not assume theoretical hydrogen ratio or substitution benefit."
      unit: "kg hydrogen; gas conditions; MJ"
      frequency: "continuous; each delivery; period bounds"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "recipient acceptance; gas analyzer; meter calibration; heat interface basis"
    - protocol_id: cp_waste
      process_id: "chlorate_production"
      flow_role: "all waste output rows"
      record_type: "segregated_transfer_records"
      raw_fields: "row_id/outlet; wet mass; volume/density; dry solids; retained water; Na/Cl/ClO3/Ca/Mg/sulfate/Cr/total inorganic C; Cr valences and leachability; contaminated substrate; source stage; receiver/treatment"
      collection_method: "Weigh each separated outlet before aggregation, sample actual composition/hazard state and bind its accepting treatment. Keep primary brine cake, chromium cake, cartridges, electrodes, paper bags and liquid purge physically separate. Distinct outlet compositions or recipients cannot be collapsed into one selector row."
      unit: "kg wet; kg dry; m3; concentrations"
      frequency: "each shipment/outlet; representative matched samples"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; analysis; receiver acceptance; waste-water component reconciliation"
    - protocol_id: cp_air
      process_id: "chlorate_production"
      flow_role: "all atmospheric elementary output rows"
      record_type: "abatement_outlet_and_fugitive_measurement"
      raw_fields: "outlet/location; duration; wet/dry gas volume/T/P; background carrier air; H2/Cl2/HCl/O2/N2/water; CO2 carbon origin; NaClO3 dust species/size; residual PM bins; captured/recycled dust; events; detection limits"
      collection_method: "Measure after actual abatement and document fugitive estimates with actual sampling basis and uncertainty. Gas concentrations and volume must share conditions; subtract ambient carrier gas/humidity when reporting process-generated oxygen/nitrogen/water. Reconcile actual H2 and captured/recycled dust. Resolve non-overlapping species/size representation; nondetect is not zero and unmeasured is not not-applicable."
      unit: "kg species; gas volume; conditions; duration"
      frequency: "representative operation and each start/stop/upset"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling method/matrix validation; blanks/recoveries; size/species partition; uncertainty"
    - protocol_id: cp_effluent
      process_id: "chlorate_production"
      flow_role: "all freshwater elementary output rows"
      record_type: "final_outlet_monitoring"
      raw_fields: "receiver/outlet; matched discharge volume/time; density/T; filtered and unfiltered analysis; Cl−/Na+/ClO3−/sulfate/Ca/Mg; dissolved Cr(VI)/Cr(III), unfiltered total Cr; particulate Cr(VI)/Cr(III) and total particulate Cr; suspended-solid composition; species/salt units; dilution/recovery; preservation; non-detect"
      collection_method: "Monitor the actual final site freshwater outlet only. Sum time-matched concentration-times-volume with stated unit conversions and lab species basis. Validate high-chloride/sulfate matrix and valence stability; Method218.6 filtration is analytical selection, not removal of particulate chromium from the actual discharge. Establish dissolved and particulate Cr(VI)/Cr(III) by actual matrix-validated laboratory speciation, with total-Cr recovery and separate analytical fractions; no dissolved method establishes particulate valence. Other ions or suspended species observed at the outlet need their own verified atomic exchanges before completeness can be claimed."
      unit: "m3 water; kg species; concentration units"
      frequency: "matched flow-weighted samples; events"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "lab species definition; matrix spike/dilution; filtered/unfiltered reconciliation; receiving-medium verification"
    - protocol_id: cp_internal
      process_id: "chlorate_production"
      flow_role: "physical stage links"
      record_type: "stage_mass_component_energy_balance"
      raw_fields: "stage/link id; two-end time-matched mass/composition; recycle/stock; actual species formation/consumption and reaction extent; wet crystal/accepted product/reject; Na/Cl/Ca/Mg/S/Cr/inorganic C/H/O/N; water/free/bound/carrier fractions; gas species; heat; measurement uncertainty"
      collection_method: "Keep a complete unallocated physical register and balances at each stage and the integrated boundary, matching both ends of internal liquor/water/solid/gas/heat links. Retain whole mother-liquor, liquid/solid stocks, accepted and rejected product, full generated/exported/vented/stored hydrogen, steam/condensate transfers, incoming/returned/discarded containers and maintenance materials. Container tare excluded from P still belongs in this physical register; add each actual external packaging, return or maintenance exchange atomically and reconcile residues without counting their chemical mass twice. Account for actual net chemical water formation/consumption and its conversion into hydrogen/oxygen-bearing compounds through the actual species/element ledger. Quantify moisture, co-salts, losses, purge and inventory changes; investigate residuals against declared measurement uncertainty rather than filling an invented balancing flow."
      unit: "kg; component fractions; m3; MJ"
      frequency: "matched batch/campaign and period bounds"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated measurements; link agreement; component closure and residual investigation"
    - protocol_id: cp_allocation
      process_id: "chlorate_production"
      flow_role: "shared environmental burdens"
      record_type: "multifunctionality_decision_and_market_records"
      raw_fields: "decision hierarchy; directly attributable activity; shared burden; actual accepted output quantities; product-specific gate prices/currency/time; value of hydrogen/heat; system-expansion/substitution evidence; selected shares/sensitivity"
      collection_method: "Document why subdivision/system expansion can or cannot be used, then examine a relevant causal physical relationship. Use period-matched actual gate economic values only if earlier choices are inapplicable and justified. Retain allocation-free physical outputs and a separate attributed burden account; an unvalued outlet is not proof of zero value."
      unit: "row unit; kg; MJ; currency"
      frequency: "each study period; contracts/price updates"
      temporal_coverage: "matched represented period/batch/campaign"
      site_scope: "declared site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "decision evidence; invoices/contracts; actual useful output; value sensitivity"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "I_i = X_i / P; X_i is the actual row quantity over the matched represented period after any stated unit conversion; P is accepted net supplied crystal-product mass in kg. The reference row is 1 kg, all co-product physical outputs remain their full actual X_i/P. Allocation is a separate burden calculation."
      inputs:
        - X_i
        - P
        - cp_product
        - "row collection protocol"
      output: "row unit per 1 kg reference flow"
      source_ids:
        - eu-lvics-2007
    - id: supplied_components
      applies_to: "solution and hydrate input rows, wet wastes, chlorate_product"
      rule: "For a measured mass fraction w_j on the as-supplied basis, component mass C_j = supplied gross mass × w_j. Convert dry-basis assay only using the same sample’s measured moisture and declared basis. Reconcile component sum with gross physical mass; do not add its carrier/bound water again as a second external flow."
      inputs:
        - "gross mass"
        - "actual assay/moisture"
        - "hydration formula"
        - cp_inputs
        - cp_product
        - cp_waste
      output: "kg each component; gross-mass closure"
      source_ids:
        - eu-lvics-2007
        - nouryon-chlorate-manual
    - id: measured_species_discharge
      applies_to: "all air and freshwater species rows"
      rule: "Species mass = sum of time-matched flow volume × species concentration × documented unit conversion, with validated density/gas conditions/dilution if required. Subtract background carrier gas where the row represents net process-derived species. Use actual ionic/elemental reporting basis and investigate detection/uncertainty; no default factor."
      inputs:
        - "actual outlet flow/time"
        - "actual species analyses"
        - "reporting basis"
        - cp_air
        - cp_effluent
      output: "kg each emitted species"
      source_ids:
        - eu-lvics-2007
        - epa-crvi-218-6
        - epa-anions-300-1
    - id: effluent_water_component
      applies_to: "water_discharge"
      rule: "Determine gross discharged liquid mass G by calibrated weighing or actual gross volume and solution density. Determine water mass W = G − measured non-water component mass, using a complete non-overlapping composition ledger. Water-component equivalent volume = W / measured water density at the declared reference condition only if that convention matches the provider/characterization definition; preserve gross effluent volume independently. Unknown composition or volume convention remains pending, never approximated by pure-water gross mass plus duplicate solutes."
      inputs:
        - "actual gross effluent mass/volume/density"
        - "complete composition"
        - "water density/convention"
        - cp_effluent
        - cp_water
      output: "m3 H2O component on verified convention"
      source_ids:
        - eu-lvics-2007
        - epa-anions-300-1
    - id: steam_enthalpy
      applies_to: "steam_heat, heat_export"
      rule: "Net useful heat = sum of measured inlet mass × inlet specific enthalpy minus sum of contractual return mass × return specific enthalpy, converted to MJ on a consistent datum. Retain separate losses and water stocks/returns; supplier agreement and calibrated enthalpy method are prerequisites."
      inputs:
        - "actual mass/T/pressure/quality"
        - "provider interface"
        - cp_steam
        - cp_coproduct
      output: "MJ net delivered or exported heat"
      source_ids:
        - eu-lvics-2007
    - id: physical_closure
      applies_to: "all stage links and external material outputs"
      rule: "For whole physical mass and each conserved element, actual external input minus actual external output equals closing minus opening stock within stated measurement uncertainty. Molecular-species balances instead include actual formation and consumption: input + formation − output − consumption = stock change. Water, NaCl, NaClO3 and chromium valences are not individually conserved through reaction. Internal link quantities/composition agree at both ends and cancel at the integrated boundary. Preserve transformation of water into H2 and oxygen-bearing compounds; the reaction NaCl + 3 H2O → NaClO3 + 3 H2 constrains chemistry, never a plant yield or emissions amount. No invented balancing exchange."
      inputs:
        - "measured links/inputs/outputs/stocks"
        - composition
        - cp_internal
      output: "component/element residual and uncertainty"
      source_ids:
        - eu-lvics-2007
        - epa-chlorate-2022
    - id: economic_share
      applies_to: "non-separable joint environmental burdens"
      rule: "If justified by a_hierarchy, s_c = V_c / (V_c + V_h + V_e), where each V is the same-period actual accepted output gate value for crystal, useful exported H2 or useful exported recovered heat. Attributed crystal burden = directly assigned crystal burden + s_c × remaining joint burden. Use actual prices/quantities; no unknown-value-to-zero conversion; do not scale physical co-product outputs."
      inputs:
        - "actual gate values"
        - "separable/joint burdens"
        - cp_allocation
      output: "crystal environmental-burden share and sensitivity"
      source_ids:
        - eu-ef-multifunctionality-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Actual SKU/state/source/route and background reference quantity must match each conditional identity; a UUID is not a completed process dataset. Missing or contradictory fields remain pending."
      evidence: "Supplier originals, direct identity and reference property/unit verification, actual provider basis"
    - id: dq_product_basis
      applies_to: "chlorate_product"
      requirement: "One accepted net supplied crystal basis, with same sample wet/dry assay, free moisture, co-salts and chromium. No mother-liquor/wet-cake/solution substitution and no packaging tare."
      evidence: "cp_product; nouryon-chlorate-manual; epa-chlorate-2022"
    - id: dq_closed_ledger
      applies_to: "all stages and outputs"
      requirement: "Whole physical mass, phase water, Na/Cl/Ca/Mg/S/Cr/inorganic-carbon and gas/heat ledgers include all actual stocks, residues, purge, co-salts, carryover, emissions and recovery. Investigate uncertainty-resolved imbalance; no allocation of physical outputs to make it close."
      evidence: "cp_internal; cp_inputs; cp_water; cp_waste; cp_coproduct; eu-lvics-2007"
    - id: dq_water_speciation
      applies_to: "all freshwater outputs"
      requirement: "Laboratory filtration selects the dissolved analytical fraction only. Reconcile unfiltered total and dissolved/particulate species; unlisted sulfate/Ca/Mg/other ions or particulate chromium are additional atomic requirements when present, not losses erased by analytical filtration. Demonstrate industrial matrix applicability of the selected method."
      evidence: "cp_effluent; epa-crvi-218-6; epa-anions-300-1"
    - id: dq_air_partition
      applies_to: "all atmospheric outputs"
      requirement: "Cl2, HCl, H2, O2, N2, water and dust retain distinct species quantities. PM bins and NaClO3 dust do not overlap; preserve measured carbon origin if CO2 occurs. No biological CO2 omission by reporting convention."
      evidence: "cp_air; eu-lvics-2007"
    - id: dq_temporal
      applies_to: "all inventory rows"
      requirement: "Align period/site/route/grade and quantities including idle and start/stop events. Source historical European values or one producer’s observed supply data are not universal recipes, ranges or yields."
      evidence: "Actual synchronized records; eu-lvics-2007 scope limitations"
    - id: dq_gaps
      applies_to: "all inventory rows"
      requirement: "Distinguish unavailable UUID, unresolved provider basis, measurement gap, nondetect, zero and non-applicability. Keep uncertainty and residuals explicit; a range-free row requires actual collection, not an invented prior."
      evidence: "Declared gap register; measurement uncertainty; cp protocols"
validation_rules:
  - rule_id: v_reference
    applies_to: "chlorate_product"
    rule: "Require one final reference row with exactly 1 kg accepted net supplied dried crystal; verify chemical/route/state and all qualifiers. Same-salt internal links are not extra reference outputs."
    source_ids:
      - eu-lvics-2007
      - epa-chlorate-2022
      - nouryon-chlorate-manual
  - rule_id: v_denominator
    applies_to: "all inventory rows"
    rule: "Inventory basis, collection aggregation and normalization use the same P and per 1 kg reference flow. No active-mass, wet-cake, solution, hydrogen or packaging denominator substitution; both languages keep the same rule/row ids and formulas."
    source_ids:
      - eu-lvics-2007
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Verify actual source, species/CAS, route, grade, media, reference property/unit and provider background amount compatibility. Unresolved identities stay blank and block complete linked-dataset claims, not silently replaced by other products/elementary compartments."
    source_ids:
      - eu-lvics-2007
  - rule_id: v_phase_balance
    applies_to: "all physical links and outputs"
    rule: "Reconcile physical mass, water and component/element stocks across all actual outlets. Confirm paired internal links, full co-product physical output, mother liquor, retained water, crystalline/free water, co-salts, filtrate, sludge and gases without double counting. Unsupported relationships and unexplained residuals require review."
    source_ids:
      - eu-lvics-2007
      - epa-chlorate-2022
  - rule_id: v_release
    applies_to: "all elementary output rows"
    rule: "Require actual release outlet/receiver and valid species/unit/sampling basis after abatement. External waste transfer is not an environmental release; dissolved-only analytical filtration does not justify dropping particulate matter or other measured ions. Separate Cl2/HCl and non-overlapping dust/PM bins."
    source_ids:
      - eu-lvics-2007
      - epa-crvi-218-6
      - epa-anions-300-1
  - rule_id: v_utilities
    applies_to: "electricity, steam_heat, heat_export"
    rule: "Verify AC voltage/grid/loss interface and exact reference energy property; retain AC/DC meter reconciliation. Verify steam pressure/quality and contractual net heat/enthalpy/water interface before provider linkage; MJ alone is insufficient."
    source_ids:
      - eu-lvics-2007
  - rule_id: v_allocation
    applies_to: "shared environmental burdens"
    rule: "Validate the selected hierarchy, actual useful outputs and gate values, directly assigned versus joint burdens and sensitivity; never mechanically scale physical co-product output. Avoid simultaneous allocation and substitution benefits for the same output."
    source_ids:
      - eu-ef-multifunctionality-2021
  - rule_id: v_completeness
    applies_to: "all inventory rows"
    rule: "No completed dataset claim with missing actual quantities, provider bases, UUIDs required for linkage, unresolved measured species or incompatible evidence. Add actual grade/route/compound/service extensions as individual atomic exchanges with their own source and identity checks. Do not declare review/publication from mechanical checks."
    source_ids:
      - eu-lvics-2007
      - eu-ef-multifunctionality-2021
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset only after actual data collection, provider linkage and separate review"
  downstream_use: "Supply of the declared dried bulk sodium-chlorate crystal at its stated gate"
  allowed_use: "Declared route/state/grade and measured supplied-product mass; explicit conditional guidance until unresolved evidence is completed"
  excluded_use: "Other salts/oxidation states; solution or wet-cake/hydrate basis; packaged delivery or different process variants without actual extensions; unproved substitution credits; claims of scientific approval"
  required_metadata: "Reference qualifiers; site/period/route/grade; actual source and supplier bases; upstream/foreground interfaces; physical/component water and stock ledgers; gas/heat destinations; emission media; waste treatment; allocation choices; uncertainty and remaining gaps"
  required_quality_disclosure: "Actual coverage of collection/checks, measurement limitations, unknown UUID/provider links, source metadata classification debt, nondetect handling, uncertainty and independent scientific/translation review state"
  update_trigger: "Changed route/additive/grade/hydration/delivery form; different source or utility conditions; new measured species/outlet; changed treatment or hydrogen/heat use; updated representative field evidence or source clarification"
data_sources:
  - id: "eu-lvics-2007"
    type: "official_guidance"
    reference: "European Commission, Reference Document on Best Available Techniques for the Manufacture of Large Volume Inorganic Chemicals – Solids and Others Industry, August2007; §7.13, printed pp.513–527 / PDF pp.558–572; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic-s_bref_0907.pdf"
    used_for: "Route, Figure7.39 stage interfaces, brine impurities/auxiliaries, mother-liquor and water recovery, hydrogen/heat branches, species releases and segregated waste. 2007 European descriptive/BAT evidence only; no current permit, universal recipe or amount range."
  - id: "epa-chlorate-2022"
    type: "official_guidance"
    reference: "US EPA, Sodium Chlorate Supply Chain – Full Profile, EPA817-F-22-043, December2022, manufacturing section printed p.1 / PDF p.2; https://www.epa.gov/system/files/documents/2023-03/Sodium%20Chlorate%20Supply%20Chain%20Profile.pdf"
    used_for: "NaCl-brine electrolysis identity and balanced reaction; crystallization, washing/drying and hydrogen branch. Supply-chain context is not a yield, shelf-life or inventory default."
  - id: "nouryon-chlorate-manual"
    type: "handbook"
    reference: "Nouryon, Sodium chlorate Product information manual, undated producer manual as acquired 2026-10-13; physical form pp.5–6, analytical scope pp.16–18; https://www.nouryon.com/globalassets/inriver/resources/brochure-nouryon-sodiumchlorate-product-information-manual.pdf"
    used_for: "Crystal versus solution identity and solution assay planning. Formula, typical density, performance and solution-method concentration intervals are not adopted as general crystal or high-salt-matrix defaults; current SKU assay needs actual validated collection."
  - id: "epa-crvi-218-6"
    type: "official_guidance"
    reference: "US EPA, Method218.6, Revision3.3, May1994, §§1–2, PDF pp.3–4; https://www.epa.gov/sites/default/files/2015-08/documents/method_218-6_rev_3-3_1994.pdf"
    used_for: "Dissolved Cr(VI) analytical fraction, industrial-effluent scope, high-anion interference and valence preservation. Not total Cr, Cr(III), particulate Cr, a quantitative default or current regulatory holding-time advice."
  - id: "epa-anions-300-1"
    type: "official_guidance"
    reference: "US EPA, Method300.1, Revision1.0,1997, §§1–3, PDF pp.2–4; https://www.epa.gov/sites/production/files/2015-08/documents/method_300-1_1997.pdf"
    used_for: "Chloride/chlorate and other anion identity and QA principles. Source water/drinking-water scope; industrial brine/effluent matrix needs demonstrated applicability and actual validation, not automatic certification."
  - id: "eu-ef-multifunctionality-2021"
    type: "official_guidance"
    reference: "European Commission, C(2021)9332 final, Annexes1–2,16December2021, AnnexI §4.5, PDF/printed pp.63–64; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "General subdivision/system-expansion → meaningful physical → other/economic relation hierarchy and justification. No animal-specific factors, default share or price, unproved substitution benefit or complete PEF compliance claim."
