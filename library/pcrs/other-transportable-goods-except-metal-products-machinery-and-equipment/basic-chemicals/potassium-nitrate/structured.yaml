allocation_rules:
  - rule_id: allocate_status
    applies_to: "salt_coproduct, salt_waste"
    rule: "Determine actual saleable co-function from specification, receiver and market evidence. Split saleable and rejected salt physically; unsaleable salt receives treatment burdens and no product credit. Do not presume all stoichiometric NaCl is saleable."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocate_hierarchy
    applies_to: "kn_conversion"
    rule: "For the declared attributional LCI, first subdivide separable activities and assign exclusive finishing/packing directly. Allocate remaining shared burdens by demonstrated determining physical causality; chemical stoichiometry alone does not establish that relationship. If it cannot be demonstrated, use period-matched net realisable product revenue at the separation gate with price/quality sensitivity. State quantities, prices, system model and allocation sum explicitly; no default share."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocate_physical
    applies_to: "kn_conversion"
    rule: "Close the unallocated mass/water/element ledgers first. Apply allocation only to environmental burden contributions in a separate ledger; retain full real KNO3, salt, waste and emission quantities in the physical ledger and equal amounts across internal links. Do not multiply co-product physical outputs by allocation factors."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "kn_conversion"
      flow_role: "Product acceptance and output"
      record_type: "foreground_record"
      raw_fields: "SKU; lot; final accepted net kg; failed/zero-output batches; rework identity; opening/closing WIP and finished stock; dispatch; rejects; external returned mass/assay/inherited burden; moisture; size; Q"
      collection_method: "Reconcile calibrated weighing/traceable mass and release records of the same SKU; inventory opening/closing product; trace dispatch, returns and rework to unique lots."
      unit: "kg"
      frequency: "Each lot; campaign aggregation"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
    - protocol_id: cp_materials
      process_id: "kn_conversion"
      flow_role: "Feed and stock"
      record_type: "foreground_record"
      raw_fields: "supplier; delivery; issue; return; NaNO3/KCl/NaCl; water; sulfate; additives; opening/closing raw and loop stock; assay uncertainty"
      collection_method: "Weigh actual receipts and charges; assay components and wet/dry bases; stage-meter and reconcile raw stores and loop stocks; retain total feed and pure-component masses separately."
      unit: "kg"
      frequency: "Each batch, start/stop and stocktake"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
    - protocol_id: cp_water
      process_id: "kn_conversion"
      flow_role: "Water and loops"
      record_type: "foreground_record"
      raw_fields: "water source; purchased kg; meter volume; measured density/T; wash recycle; condensate; cooling circulation; evaporation; drift; moisture; opening/closing water"
      collection_method: "Use meters/weighing with measured temperature/density; match both ends of every circuit transfer; reconcile water destinations with humidity, condensate recovery and liquid-drift measurement."
      unit: "kg"
      frequency: "Continuous or each batch, including start/stop"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
    - protocol_id: cp_energy
      process_id: "kn_conversion"
      flow_role: "Steam, condensate and electricity"
      record_type: "foreground_record"
      raw_fields: "stage meters; kWh; steam kg; pressure absolute/gauge; T; dryness; condensate kg/T; vent kg; heat loss; supplier reference; enthalpy method"
      collection_method: "Reconcile calibrated stage, steam and return meters; derive enthalpies using a declared steam-property method and common reference state; distinguish steam mass, net heat and background reference."
      unit: "kg; kWh; MJ"
      frequency: "Continuous and supplier billing periods"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
    - protocol_id: cp_salt
      process_id: "kn_conversion"
      flow_role: "Separated salt destinations"
      record_type: "foreground_record"
      raw_fields: "wet salt kg; dry mass; NaCl; nitrate ion/N; K; Na; chloride; saleable/reject split; buyer; specification; receipt"
      collection_method: "Weigh and representatively sample separated salt; assay wet/dry bases and major ions; split product/waste by actual acceptance and receipts, not pure-salt assumptions."
      unit: "kg"
      frequency: "Each lot and transfer"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
    - protocol_id: cp_waste
      process_id: "kn_conversion"
      flow_role: "Waste and receivers"
      record_type: "foreground_record"
      raw_fields: "stream origin; wet kg; density; water; nitrate/N; K; Na; Cl; sulfate; dust composition; receiver; treatment route; transfer manifest"
      collection_method: "Individually weigh solids, dust and aqueous transfers, flow-proportionally sample/analyse; trace external treatment and transport; split differing receiver conditions."
      unit: "kg"
      frequency: "Each transfer; matched production interval"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
    - protocol_id: cp_pack
      process_id: "kn_conversion"
      flow_role: "Packaging"
      record_type: "foreground_record"
      raw_fields: "component resin; empty count and sampled net mass; PE liner; PP sack; closures; filled net kg; rejects; shipped kg; reuse records"
      collection_method: "Sample empty component masses with calibrated scales; reconcile purchases, use, loss and delivery; separately retain reuse life/cycles; bag capacity or filled mass cannot replace physical packaging mass."
      unit: "kg"
      frequency: "Each lot and packaging-specification change"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
    - protocol_id: cp_air
      process_id: "kn_conversion"
      flow_role: "Escaped dust"
      record_type: "foreground_record"
      raw_fields: "stage; outlet; fugitive source; gas flow; standard T/P; dry/wet gas basis; sample time; filter mass; size distribution; abatement; operating hours"
      collection_method: "Measure representative post-abatement outlet dust and size with suitable methods; record blanks, detection limits, gas basis and time; separately survey fugitives; retain unsized residual where size is unknown."
      unit: "kg"
      frequency: "Cover normal, abnormal and start/stop periods"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
    - protocol_id: cp_assets
      process_id: "kn_conversion"
      flow_role: "Capital and completeness"
      record_type: "foreground_record"
      raw_fields: "equipment id; installed physical kg; actual material/BOM; life; cumulative throughput; shared service; maintenance; cut-off evidence"
      collection_method: "Record installed physical mass and service life for each equipment; if included in burdens, calculate attributable service separately and add atomic equipment exchanges. Evidence inclusion/cut-off decisions for unlisted ancillary, treatment and logistics flows."
      unit: "kg; year"
      frequency: "Installation/replacement and annual review"
      temporal_coverage: "Complete declared period, including downtime and stock changes"
      site_scope: "Same site, route and SKU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable calibration, batch, analysis, transfer and stock records"
  calculation_rules:
    - id: calc_denominator
      applies_to: "kn_product"
      rule: "Q = actual accepted net output uniquely counted at final disposition for the complete same-scope period; reconcile acceptance, dispatch, external returns, opening/closing stocks and rework through cp_product, excluding packaging and rejected material. Returns, internal rework and WIP are not new free product; retain all failed/zero-output batches in the same total pool. If Q = 0 do not normalize."
      inputs:
        - cp_product
      output: "Q in kg"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_normalise
      applies_to: "all inventory rows"
      rule: "For Q > 0, normalized exchange = complete same-scope attributable period exchange total / Q, divided once; retain original stage totals, failed batches, stock changes and physical/burden carryovers for opening/closing WIP. Reference output is 1 kg; allocate environmental burdens only after physical reconciliation. Q = 0 has no normalized result."
      inputs:
        - "campaign quantities"
        - Q
      output: "exchange per 1 kg reference flow"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_components
      applies_to: "kn_conversion"
      rule: "Component mass = whole wet mass × measured component mass fraction on the declared wet basis. Where assay is dry-basis, multiply measured dry fraction first. Balance total mass and Na/K/N/Cl plus H/O and all material impurity elements from inputs + opening stocks = products + wastes + air losses + closing stocks. NaNO3 + KCl → KNO3 + NaCl is a molar conservation check, not an actual-yield assumption."
      inputs:
        - cp_materials
        - cp_salt
        - cp_product
        - cp_air
      output: "unallocated component ledger"
      source_ids:
        - cn-kn-conversion-2009
        - jrc-ilcd-2010
    - id: calc_water
      applies_to: "kn_conversion"
      rule: "For each process and cooling circuit: external molecular water + opening water = product/wet-salt water + aqueous transfers + external condensate return + vapour + liquid drift + closing water. Internal transfers cancel only after matching both endpoints; retain measured moisture in feeds/products and condensate recovered internally. This exchange reaction has no stoichiometric net water generation."
      inputs:
        - cp_water
        - cp_energy
        - cp_waste
      output: "molecular water ledger"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: calc_heat
      applies_to: "steam_import, condensate_return"
      rule: "Energy crossing the delivery boundary = sum(steam mass × supply specific enthalpy) − sum(external return mass × return specific enthalpy), with a common enthalpy datum; reconcile vent/condensation/cooling losses and stock/energy changes to obtain useful process heat. Use the verified provider reference convention; never count steam kg and derived heat MJ as two supplies."
      inputs:
        - cp_energy
      output: "kg steam and separate MJ heat ledger"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: calc_emissions
      applies_to: "pm_fine, pm_coarse, pm_large, pm_unsized"
      rule: "With a volume flow rate, emission mass = sum(dry concentration × compatible dry standard volume flow rate × interval duration). With already integrated gas volume, emission mass = sum(dry concentration × compatible dry standard volume), without another time multiplier. Preserve raw period emission totals, then divide once by Q. Split nested totals only by compatible measured differences; keep dry PM distinct from liquid/vapour water, with no default size distribution."
      inputs:
        - cp_air
      output: "actual dry released particle kg"
      source_ids:
        - jrc-cww-2016
    - id: calc_service
      applies_to: "pp_sack, pe_liner"
      rule: "Physical packaging = measured empty component mass × actual component count; retain physical issued/shipped/lost mass. Any reuse allocation is a separate burden service fraction from documented cycles. Capital service uses each measured installed equipment mass × attributable lifetime service fraction, with installed stock preserved separately."
      inputs:
        - cp_pack
        - cp_assets
      output: "physical and burden service ledgers"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Check complete native identity and provider quantity basis; blank UUID is not zero amount; classification labels cannot override physical chemistry."
      evidence: "cp_materials; cp_product"
    - id: quality_closure
      applies_to: "kn_conversion"
      requirement: "Preserve full physical ledger before burden ledger; explain residuals using meter/analysis uncertainty, without forced closure or a universal tolerance."
      evidence: "cp_materials; cp_water; cp_salt; cp_air"
    - id: quality_coverage
      applies_to: "kn_conversion"
      requirement: "Cover start/stop, releases, waste salt, cleaning, packaging and stocks; record included, not-applicable, unmeasured and actual cut-offs individually; external receipt does not erase burdens."
      evidence: "cp_waste; cp_pack; cp_assets"
    - id: quality_no_defaults
      applies_to: "kn_conversion"
      requirement: "No default recipe, yield, purity, water/heat/power consumption or emission factor is supplied."
      evidence: "primary site records; cn-kn-conversion-2009 limitations"
validation_rules:
  - rule_id: validate_reference
    applies_to: "kn_product"
    rule: "Require exactly one final KNO3 product output and all reference qualifiers, Q and common wet net kg denominator in both languages. Verify product/grade and reject use of an incompatible route or mixture identity."
    source_ids:
      - jrc-ilcd-2010
      - jrc-cww-2016
  - rule_id: validate_balance
    applies_to: "kn_conversion"
    rule: "Check raw physical total/element/water balances with stock changes before allocation; conserve internal transfer mass at both endpoints. Include Na/K/N/Cl in sold salt, waste salt, liquor and dust, as well as product; include moisture and uncondensed losses. Investigate residuals against measured uncertainty."
    source_ids:
      - jrc-ilcd-2010
      - jrc-cww-2016
  - rule_id: validate_utility
    applies_to: "steam_import, condensate_return, electricity"
    rule: "Verify native property/unit, supplier pressure/state/reference and actual quantity conversion separately. An identity UUID is not evidence of a compatible background. Unresolved steam enthalpy/provider data prevents a complete linked dataset, not an invented steam pressure."
    source_ids:
      - jrc-ilcd-2010
      - jrc-cww-2016
  - rule_id: validate_destinations
    applies_to: "salt_coproduct, salt_waste, brine_purge, collected_dust"
    rule: "Retain real sales/reject evidence and receiver links. Split chemical species analyses from whole wet-stream exchange mass; do not duplicate liquor as elemental emissions, or use a pure salt provider for a contaminated mixed co-product."
    source_ids:
      - jrc-ilcd-2010
      - jrc-cww-2016
  - rule_id: validate_particles
    applies_to: "pm_fine, pm_coarse, pm_large, pm_unsized, water_drift"
    rule: "Reconcile each escaped-dust parcel once in compatible disjoint size bins or unsized residual; disclose unknown size and medium precision. Captured/recycled dust is not emitted. Keep liquid drift water distinct from vapour and dry salt particles."
    source_ids:
      - jrc-ilcd-2010
      - jrc-cww-2016
  - rule_id: validate_completeness
    applies_to: "kn_conversion"
    rule: "Check all stage/material/utility/packaging/transport/treatment/capital decisions and actual extra exchanges; report unmeasured quantities, blank identities, provider gaps, checks skipped and remaining coverage. No claim of a complete inventory from a mechanical PCR check alone."
    source_ids:
      - jrc-ilcd-2010
      - jrc-cww-2016
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Plant-gate KNO3 input with compatible route, grade and delivery basis, retaining evidence and applicability qualifiers."
  allowed_use: "Selected solid fertilizer sodium-nitrate conversion route with actual site, period, SKU and providers."
  excluded_use: "Field efficacy or fertilizer-use emissions, other routes or formulated liquids, substitution of pure-active basis, default factory quantities."
