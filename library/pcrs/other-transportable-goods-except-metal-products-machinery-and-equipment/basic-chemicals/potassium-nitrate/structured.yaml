measurement_rules:
  - id: measure_product
    applies_to: "kn_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use 1 kg net accepted supplied product; Q is campaign accepted net product kg, excluding packaging, rejects and internal recycled crystals. Dry KNO3 content and N/K content are additional analyses, never alternate denominators."
  - id: measure_solution
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record whole wet-stream mass and measured dry/component fractions separately; never add carrier water a second time. Each reported amount uses per 1 kg reference flow."
  - id: measure_energy
    applies_to: "steam_import, electricity, condensate_return"
    required_property_ref:
      name: "Mass and Net calorific value"
      uuid: ""
    required_unit: "kg and MJ"
    rule: "Keep steam/condensate physical kg distinct from enthalpy service MJ. Calculate heat from measured steam and return states, vents/losses and supplier convention; an MJ property alone is not net delivered heat. Electricity: MJ = kWh × 3.6."
