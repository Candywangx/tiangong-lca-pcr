system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "kn_conversion"
      rule: "Keep stage logs for dissolution/conversion → hot salt separation/washing → crystallisation/centrifuging/washing → indirect drying → acceptance/dispatch within one foreground unit. The formal exchange equation NaNO3 + KCl → KNO3 + NaCl describes conserved species in phase separation, not a guaranteed one-pass conversion or feed recipe."
      source_ids:
        - cn-kn-conversion-2009
    - rule_id: boundary_loops
      applies_to: "kn_conversion"
      rule: "Record internal mother liquor, wash water, condensate and dust returns with both endpoints, time, mass and composition; match equal physical transfers and opening/closing stocks. Do not count internal transfers as new upstream purchases or product outputs."
      source_ids:
        - cn-kn-conversion-2009
        - jrc-lvic-aaf-2007
    - rule_id: boundary_complete
      applies_to: "kn_conversion"
      rule: "Include actual utility production upstream, feed and receiver transport, packaging and off-site waste treatment. Review capital goods and each actual ancillary chemical/maintenance stream with evidence-based cut-offs. Where capital is included, identify each physical equipment flow separately and preserve installed mass, useful life, throughput and attributable service; never substitute an annualised service mass for installed physical stock. Record additional observed atomic exchanges before claiming dataset completeness."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: boundary_environment
      applies_to: "kn_conversion"
      rule: "The waste-transfer boundary does not remove downstream treatment burden. Locate wastewater and air releases by stage, medium and receiver using the actual stream inventory. No positive emission is inferred from a candidate identity; missing measurement is not zero. On-site combustion requires its fuel and complete species/origin-specific emission inventory; it is not represented by purchased steam."
      source_ids:
        - jrc-cww-2016
boundary_abstraction:
  declared_starting_condition: "Purchased solid NaNO3 and specified granular KCl with traceable upstream datasets, actual startup salt, water, electricity and external steam"
  starting_condition_role: "Foreground manufacturing entry, not an upstream burden exemption"
  product_classification_scope: "Selected solid fertilizer conversion-route subset of CPC 3.0 34646"
  recursive_input_rule: "Recycle mother liquor, salt wash, wet crystals and recovered dust as internal equal-quantity links; purchased KNO3 cannot replace the claimed manufacturing route"
  upstream_dataset_requirement: "Providers for materials, utilities, packaging, transport and waste treatment matching composition, state, origin and quantitative basis; identity success is not provider compatibility"
  disclosure: "Disclose flowsheet, stocks, loops, outlets, off-site receivers, transport, capital assessment, cut-offs and allocation; keep physical and burden ledgers distinct"
