system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "foreground"
      rule: "Include receipt, grinding of carbide, nitridation, cooling, product grinding, extraction, indirect cooling if installed, waste transfer and bulk dispatch as one measured foreground unit. Keep stage meters and material balances."
      source_ids:
        - alzchem-route
        - jrc-cww-2016
    - rule_id: boundary_upstream
      applies_to: "carbide_in"
      rule: "Carbide manufacture is an upstream electrothermal process. BREF carbide figures are not nitridation defaults. Do not model upstream recovered CO as a nitridation product or add upstream CO2 again."
      source_ids:
        - jrc-lvic-s-2007
    - rule_id: boundary_complete
      applies_to: "foreground"
      rule: "Maintain a species/utility/residue screen. Additional actual fuel, chemical, packaging, pollutant or cooling additive requires its own atomic row and verified identity before a complete dataset is claimed; do not infer absence from this draft list."
      source_ids:
        - jrc-cww-2016
