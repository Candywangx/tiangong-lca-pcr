allocation_rules:
  - rule_id: allocation_physical
    applies_to: "nitridation"
    rule: "Keep the physical mass, nitrogen and carbon balances before burden allocation. Reaction carbon retained in powder is part of its composition; internal dust return is not a co-product. Do not multiply physical outputs by allocation shares."
    source_ids:
      - alzchem-route
      - jrc-cww-2016
  - rule_id: allocation_subdivide
    applies_to: "nitridation"
    rule: "Use stage meters and campaign-specific records to separate other production. No default co-product credit or allocation ratio is supplied. If an external co-product actually arises, document its identity, receiver, physical balance and reviewed allocation decision before modelling its burden."
    source_ids:
      - jrc-cww-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "nitridation"
      flow_role: "finished_powder"
      record_type: "weighing and assay"
      raw_fields: "lot; gross; tare; net powder; moisture; total N; cyanamide-N; nitrate/ammonium/urea N; residual CaC2; lime; carbon; particle size; opening/closing stock; unique new acceptance/return/rework lot links; failed/zero-output lots; opening/closing WIP mass/composition and carried burdens"
      collection_method: "Calibrated net acceptance weighing and representative lot analyses; count each newly accepted physical lot once after rework/withdrawals. Independently reconcile acceptance against dispatch, returns and opening/closing finished stock; retain WIP mass/composition and associated burdens across periods without omission or duplicate counting."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete declared campaign"
      site_scope: "same powder line and grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sampling method; assay uncertainty; stock ledger"
    - protocol_id: cp_material
      process_id: "nitridation"
      flow_role: "carbide_in; nitrogen_in"
      record_type: "foreground measurements"
      raw_fields: "input lot; grade; supplier; delivered and charged mass; stocks; gas state; assay"
      collection_method: "Calibrated scales and gas mass meters; reconcile charges, delivery and inventory. Record gas conversion and supplier conditions if volumetric."
      unit: "kg"
      frequency: "each lot or operating mode; continuous meters where available"
      temporal_coverage: "same complete campaign as cp_product"
      site_scope: "all attributable stages within selected foreground"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing tickets; calibration; supplier assays; gas basis"
    - protocol_id: cp_energy
      process_id: "nitridation"
      flow_role: "electricity_in"
      record_type: "foreground measurements"
      raw_fields: "meter start/end; stage; operating hours; grid voltage; geography; provider; shared loads"
      collection_method: "Read dedicated electricity meters; quantify justified shared loads and reconcile invoices. Preserve kWh and MJ conversion."
      unit: "kWh"
      frequency: "each lot or operating mode; continuous meters where available"
      temporal_coverage: "same complete campaign as cp_product"
      site_scope: "all attributable stages within selected foreground"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; load attribution; provider boundary"
    - protocol_id: cp_water
      process_id: "nitridation"
      flow_role: "cooling_water_in; cooling_purge"
      record_type: "foreground measurements"
      raw_fields: "makeup; purge volume; density; T; circuit; receiver; composition; additives"
      collection_method: "Meter makeup and actual off-site purge separately; weigh or measure density for water mass. Reconcile circulation, evaporation and stock; identify all added chemicals."
      unit: "kg; m3"
      frequency: "each lot or operating mode; continuous meters where available"
      temporal_coverage: "same complete campaign as cp_product"
      site_scope: "all attributable stages within selected foreground"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; circuit diagram; treatment contract; analyses"
    - protocol_id: cp_residue
      process_id: "nitridation"
      flow_role: "dust_out"
      record_type: "foreground measurements"
      raw_fields: "dust collection mass; internal return; external dispatch; composition; residual carbide; receiver"
      collection_method: "Weigh separately collected solid dust and retained stocks. Match external manifests and receiver acceptance; do not use total dust capture as atmospheric emissions."
      unit: "kg"
      frequency: "each lot or operating mode; continuous meters where available"
      temporal_coverage: "same complete campaign as cp_product"
      site_scope: "all attributable stages within selected foreground"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; transfer notes; composition and acceptance"
    - protocol_id: cp_air
      process_id: "nitridation"
      flow_role: "ammonia_air; acetylene_air; pm_fine_air; pm_coarse_air; pm_large_air"
      record_type: "foreground measurements"
      raw_fields: "source; species/CAS; control train; concentration; gas flow; T/P; wet/dry; test duration; operating mode; size fractions; detection limit"
      collection_method: "Use matched outlet concentration and gas-flow measurements after controls for each operating mode; characterize fugitives independently. Convert species and flow to common gas conditions; integrate loads over covered operating hours and preserve uncertainty. Integrate a measured volume flow rate over its matched interval; with already integrated gas volume, concentration times that compatible volume is the load and is never multiplied by operating hours again. Retain the raw period load before the single campaign normalization."
      unit: "kg"
      frequency: "each lot or operating mode; continuous meters where available"
      temporal_coverage: "same complete campaign as cp_product"
      site_scope: "all attributable stages within selected foreground"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test report; method; calibration; gas conditions; size method; operating coverage"
  calculation_rules:
    - id: campaign_basis
      applies_to: "all inventory rows"
      rule: "Define one complete same-site/product/grade/state/nitridation-route campaign pool. Retain raw period totals before burden assignment or division, including all attributable startup/shutdown, failed and zero-output batches, cleaning/losses, returns, rework and opening/closing WIP with carried burdens. Q is uniquely counted newly accepted net powder kg from cp_product; reconcile dispatch/stocks independently without a second stock correction. After numerator-unit conversion and justified burden assignment, divide each attributable total by the same positive Q once only; reference output is 1 kg. If Q = 0 preserve all raw totals and stock/fate records without per-kg results, invented output or excluded failed periods."
      inputs:
        - cp_product
        - cp_material
        - cp_energy
        - cp_water
        - cp_residue
        - cp_air
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: element_balance
      applies_to: "nitridation"
      rule: "Reconcile whole measured wet streams and independent N/Ca/C/H/O and actual impurity inventories, including stocks/WIP and actual gas/liquid destinations, before allocation. CaC2 + N2 -> CaCN2 + C is an identity, not a yield/recipe, and generates no stoichiometric water; distinguish residual carbide, free carbon/lime and bound cyanamide carbon. For the screened residual-carbide/moisture pathway only where it actually occurs, CaC2 + 2 H2O -> C2H2 + Ca(OH)2 constrains species masses; independently evidence the actual reacted amount, water consumption and formed dry components. Keep measured moisture/free water and dry-component formation/consumption separate. Do not infer water, evaporation, conversion, product yield or missing species from COD or an unexplained closure residual."
      inputs:
        - cp_material
        - cp_product
        - cp_residue
        - cp_air
      output: "physical element balance before allocation"
      source_ids:
        - alzchem-route
        - jrc-lvic-s-2007
        - jrc-cww-2016
        - icsc-cyanamide-2006
  data_quality_requirements:
    - id: quality_basis
      applies_to: "all inventory rows"
      requirement: "Preserve measured basis, supplier product identity and background quantity compatibility independently. A valid flow UUID does not establish a complete provider dataset."
      evidence: "cp_material; cp_energy; cp_water"
    - id: quality_unknown
      applies_to: "all inventory rows"
      requirement: "Unknown is not zero. Absence requires documented equipment/route and sampling evidence. Limits of detection are retained; no universal yield, moisture, density, composition or emission factor."
      evidence: "cp_air; cp_product"
    - id: quality_period
      applies_to: "nitridation"
      requirement: "Cover startup, shutdown, normal operation and credible upsets in the campaign; explain unmeasured periods and their uncertainty."
      evidence: "cp_air; cp_energy; cp_product"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_powder"
    rule: "Require one powder output at 1 kg, complete qualifiers and resolved product-mass reference identity before usable guidance/dataset acceptance. A measurement pass does not resolve identity."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "nitridation"
    rule: "Check physical mass/N/Ca/C and stock balances separately from allocated burdens; investigate residuals with uncertainty and detection limits. Internal transfers cancel at equal actual quantities."
    source_ids:
      - jrc-cww-2016
  - rule_id: validate_emissions
    applies_to: "nitridation"
    rule: "Verify post-control outdoor loads, molecular NH3/C2H2 bases and nonoverlapping particle bins. Do not add captured waste dust, cumulative PM10, or upstream carbide emissions again. Direct water discharge requires its own verified species and medium."
    source_ids:
      - jrc-cww-2016
      - icsc-cyanamide-2006
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Reject complete-dataset claims with unverified reference/carbide/waste identity, unsupported conversion, unmeasured material pathway or unqualified provider. Independent scientific review remains required."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Compatible bulk ground calcium cyanamide fertilizer input, after identity and quality acceptance."
  allowed_use: "Declared site/period/assay and purchased-carbide route only."
  excluded_use: "Whole CPC leaf; granulated/enriched blends; pure substance or kg N substitution; use-stage claims; treating this unfinished draft as an accepted dataset."
  required_metadata: "Reference qualifiers; boundary; provider links; stocks; collection protocols; identity resolution; operating coverage."
  required_quality_disclosure: "Uncertainty; actual completeness; unresolved identities; conditional utility/waste identity; allocations and exclusions."
  update_trigger: "Route, assay, supplier, utility, dust treatment or monitoring change; identity clarification or new independent evidence."
