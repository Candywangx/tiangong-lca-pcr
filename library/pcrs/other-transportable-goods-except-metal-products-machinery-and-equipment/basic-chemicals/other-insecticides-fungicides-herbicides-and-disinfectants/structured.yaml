    required_unit: "kg"
    rule: "Q0 is the sum of whole-product net mass first signed released in the same cohort; use calibrated gross weighing less measured component tare, excluding unreleased, duplicate returned and resale quantities. Neither package nor active-content mass replaces this denominator."
  - id: same_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass / Energy / transport service"
      uuid: ""
    required_unit: "kg; kWh; t·km"
    rule: "Preserve each numerator unit, per 1 kg reference flow; divide actual cohort-attributable quantities by Q0. Counts require measured tare of the same article specification; volume requires measured density for the same lot. Do not infer density from label volume or composition statements."
  - id: meter_energy
