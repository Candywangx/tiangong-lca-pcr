system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The data package must first name one explicit physical perimeter (producer/contractor sites and areas) and use it consistently for contents, each article pool and handoffs. Off-site locations enter S0/S1 only when explicitly inside that perimeter; owned articles already outside it remain in a separate ownership memorandum, not simultaneously in S1. D/U are dispatches across this perimeter; R is same-article re-entry linked to a prior dispatch across that same perimeter. Internal moves generate no D/U/R. Release can occur inside the perimeter, so record its status transition separately from physical boundary crossing."
      source_ids: []
    - rule_id: b_first_release
      applies_to: "whole product"
      rule: "Bind one original first-release gate to the actual producer and all outsourced packers: retain signed lot disposition, label edition, net weight and owner/custodian; retain handoff and receiver only when an actual transfer occurs. A master label, administrative transition or brand does not prove an actual release, common factory or equivalence between editions. Goods already first-released upstream cannot be counted as newly produced here."
      source_ids:
        - epa-trico-2026
        - epa-trico-2025
        - ecfr-release-152-3
    - rule_id: b_supplier
      applies_to: "upstream interfaces"
      rule: "Include the actual supplying producer as a qualified aggregate with complete embodied manufacture, primary packing, utilities, losses and waste-treatment coverage per measured kg net contents. Do not reconstruct confidential composition or operations. Verify its gate, article coverage, burden basis and geographic/time scope. Missing supplier inventory is a coverage gap, never zero impact. Consolidate internal handoffs and inherited stocks without recursive duplicate production."
      source_ids:
        - pef-accounting-2021
    - rule_id: b_pack_ledger
      applies_to: "each packaging article pool"
      rule: "For each distinct container, closure, label, carton and pallet keep S0 + P + F + R = D + U + W + S1 in consistent kg tare and article counts. S0/S1 include empty, fitted, loaded and held articles physically inside the declared perimeter; outside-owned assets are a separate memorandum. P is purchased receipt; F is first non-purchased external receipt with goods or separately borrowed/free-transferred irrespective of supplier coverage; R requires a trace to the very same article previously dispatched across this same declared perimeter. D is outward with contents, U other outward product articles, W discard. Internal fitting is not external receipt. Unknown provenance cannot be assigned R. Article stocks and every external movement must have a cohort/owner."
      source_ids:
        - pef-accounting-2021
    - rule_id: b_burden_once
      applies_to: "packaging and service burdens"
      rule: "Maintain a separate coverage ledger for each actual acquisition, transport, cleaning, repair and treatment burden and its owner/cohort. Physical P/F/R never substitutes for this ledger. Include inherited burdens of opening and first-received non-purchased articles; credit only exact provider-covered components, not an assumed complete BOM. A real return carries its existing history and actual new services; it does not create a new manufacture burden. Unknown coverage remains a hold. Retain subsequent cohort services against its fixed original Q0 without enlarging new-period production."
      source_ids:
        - pef-accounting-2021
    - rule_id: b_complete
      applies_to: "foreground completeness"
      rule: "Survey all actual utilities, articles, equipment services, residuals and emissions at each producer interface. The atomic cards are conditional collection slots, not evidence that a plant uses those articles. Add a separate chemically/physically specific card and protocol for each observed omitted exchange before study qualification. Identify emission substance, receiving compartment and treatment coverage independently; an unidentified residual is not a generic elementary flow. Unresolved coverage or balance residual blocks a complete dataset claim."
      source_ids:
        - pef-accounting-2021
boundary_abstraction:
  declared_starting_condition: "Actual supplier-completed whole product and actual packaging, not yet first-released, handed over within an evidenced producer/contractor release perimeter"
  starting_condition_role: "Foreground collection interface, not a burden-free origin; actual manufacture and primary-packing upstream aggregate remains included"
  product_classification_scope: "Scoped non-lethal ungulate repellent within CPC 3.0 34669; proposed narrower relation"
  recursive_input_rule: "Bind same-category upstream finished contents by identity, gate, time and burden coverage; cancel internal transfers without endless recursion or duplicate production"
  upstream_dataset_requirement: "Compatible complete aggregate for actual supplier manufacture, primary packing, utilities, losses and treatment; supplement only uncovered actual outer-packing and logistics services"
  disclosure: "Each producer site, handoff, original gate, period, stocks, physical/burden attribution, uncovered items and quality; unqualified upstream prevents a complete cradle-to-gate claim"
