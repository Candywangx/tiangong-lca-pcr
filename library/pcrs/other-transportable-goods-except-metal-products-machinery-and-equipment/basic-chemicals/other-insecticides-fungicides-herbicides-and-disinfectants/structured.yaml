allocation_rules:
  - rule_id: a_subdivide
    applies_to: "shared foreground demand"
    rule: "First subdivide by lot, meter and outsourced service. Where subdivision is unavailable, document why and use an evidenced causal physical driver h_i / sum(h_j) for the exact pool and period; shares must sum to one. Do not assume net product mass drives all cleaning, storage or transport. If no defensible driver is available, retain allocation unresolved; no arbitrary equal shares."
    source_ids:
      - pef-accounting-2021
  - rule_id: a_reuse
    applies_to: "reusable articles"
    rule: "If reuse actually occurs, divide the evidenced article manufacture and first-delivery burden over its evidenced total lifetime uses, including first use; preserve incomplete-life uncertainty. Charge actual return transport, cleaning, repair and end-of-life once to the relevant use/cohort. Neither R/(P+F+R) nor stock turnover is a lifetime reuse count. Without reliable lifetime data, retain the unamortized history and unresolved allocation rather than invent rotations or recycling credits."
    source_ids:
      - pef-accounting-2021
  - rule_id: a_outputs
    applies_to: "non-reference outputs"
    rule: "Packaging tare is delivered accompaniment, not co-product output earning an automatic credit. Retain burden-bearing reject, unreleased-transfer and closing-stock cohorts; normal rejects inherit actual production demand and treatment. A saleable co-product needs a separately evidenced function and justified allocation. Do not add avoided damage, pesticide substitution or field efficacy credits."
    source_ids:
      - pef-accounting-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "first_release"
      flow_role: "reference_product"
      record_type: "signed release and net-weight record"
      raw_fields: "registration; country; label edition; lot; original release date; producer; handoff; gross; component tare; unique net mass; held mass"
      collection_method: "reconcile calibrated weighing and signed lot ledger to original first release; deduplicate across contractors"
      unit: "kg"
      frequency: "each lot or movement"
      temporal_coverage: "same original release cohort with complete opening/closing periods"
      site_scope: "explicit physical perimeter of named producer/contractor areas; outside-owned stock separately memorandized"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; signed release; actual label; handoff originals"
    - protocol_id: cp_lot
      process_id: "first_release"
      flow_role: "unreleased_contents; unreleased_transfer"
      record_type: "supplier interface and contents-stock record"
      raw_fields: "lot; supplier gate; unreleased identity; opening; receipts; returns; first release; outward transfer; holds; discard; product constituent in effluent; closing; inherited burdens"
      collection_method: "independent weighing and handoff reconciliation; bind contractor original burden-coverage statement to same lot/gate"
      unit: "kg"
      frequency: "each lot or movement"
      temporal_coverage: "same original release cohort with complete opening/closing periods"
      site_scope: "explicit physical perimeter of named producer/contractor areas; outside-owned stock separately memorandized"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "net-mass ledger; supplier scope; original stock records"
    - protocol_id: cp_pack
      process_id: "first_release"
      flow_role: "container_in; container_out; closure_in; closure_out; label_in; label_out; carton_in; carton_out; pallet_in; pallet_out"
      record_type: "article-pool movement/stock and burden coverage"
      raw_fields: "article specification; article ID; measured tare; count; owner; location; S0/S1; P/F/R; same-article prior outward link; D/U/W; supplier coverage; actual acquisition/freight/services; lifetime uses; unamortized balance"
      collection_method: "weigh same-specification articles and reconcile movements/stocks; first external non-purchase receipt is F; independently verify true-return article and prior dispatch; audit provider burden by component"
      unit: "kg"
      frequency: "each lot or movement"
      temporal_coverage: "same original release cohort with complete opening/closing periods"
      site_scope: "explicit physical perimeter of named producer/contractor areas; outside-owned stock separately memorandized"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "physical receipts; off-site confirmations; tare; prior dispatch; provider coverage; service originals"
    - protocol_id: cp_utility
      process_id: "first_release"
      flow_role: "electricity; cleaning_water"
      record_type: "actual submeter and supplier record"
      raw_fields: "meter; start/end readings; period; voltage/water quality; supplier; duplicate exclusions; allocation driver; volume/density; native property/unit"
      collection_method: "reconcile calibrated submeters and invoices; audit metered energy separately from provider native property; measure same-lot density for volume-to-mass water conversion"
      unit: "kWh; kg"
      frequency: "each lot or movement"
      temporal_coverage: "same original release cohort with complete opening/closing periods"
      site_scope: "explicit physical perimeter of named producer/contractor areas; outside-owned stock separately memorandized"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoice; provider property/unit chain; density originals"
    - protocol_id: cp_transport
      process_id: "first_release"
      flow_role: "road_freight"
      record_type: "carrier handoff by leg"
      raw_fields: "leg; date; origin/destination; carrier; mode; payload tonnes including package; km; empty return; provider coverage; cohort"
      collection_method: "reconcile consignment and actual distance; exclude provider-covered legs; model empty returns with compatible service basis"
      unit: "t·km"
      frequency: "each lot or movement"
      temporal_coverage: "same original release cohort with complete opening/closing periods"
      site_scope: "explicit physical perimeter of named producer/contractor areas; outside-owned stock separately memorandized"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "consignment; distance; coverage evidence"
    - protocol_id: cp_residual
      process_id: "first_release"
      flow_role: "waste_contents; cleaning_effluent; container_waste; closure_waste; label_waste; carton_waste; pallet_waste"
      record_type: "individual waste-stream and emission-coverage survey"
      raw_fields: "lot; original cohort; U/G status; substance/article; mass; contamination class; product constituent in effluent; receiver; treatment gate; on-site emitted substance/compartment; native unit; coverage; uncertainty"
      collection_method: "reconcile weighing and transfer notes; survey on-site compartments; retain residual discrepancy, not difference-as-air-emission or missing-as-zero"
      unit: "kg"
      frequency: "each lot or movement"
      temporal_coverage: "same original release cohort with complete opening/closing periods"
      site_scope: "explicit physical perimeter of named producer/contractor areas; outside-owned stock separately memorandized"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; receiver notes; treatment scope; monitoring; substance balance"
    - protocol_id: cp_released_custody
      process_id: "first_release"
      flow_role: "returned_released_contents; received_released_contents; released_dispatch"
      record_type: "released custody and original-cohort record"
      raw_fields: "original lot; original producer and first-release Q0; prior outward; Rg/Ig/Dg; physical perimeter; G0/G1; subsequent regulatory production events; inherited burdens; actual new services"
      collection_method: "independently reconcile genuine return/first external receipt/later dispatch to original first release; relabeling and ownership moves create no Q0; hold unknown original cohorts separately"
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "original cohort lifecycle and actual period"
      site_scope: "explicit physical perimeter; outside ownership separately memorandized"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "prior-dispatch/return notes; original first release; measured net mass; inherited burdens; actual service originals"
  calculation_rules:
    - id: release_denominator
      applies_to: "reference_product"
      rule: "Q0 = sum(gross mass - measured component tare for each unique original first-release lot). Exclude unreleased transfers, resale and duplicate return releases; require Q0 > 0."
      inputs:
        - cp_release
        - cp_pack
      output: "Q0 kg"
      source_ids:
        - epa-trico-2026
        - pef-accounting-2021
    - id: cohort_normalization
      applies_to: "all inventory rows"
      rule: "x_norm = x_attributed / Q0; x_attributed is this row’s measured or evidenced allocated quantity for the original cohort, and x_norm is quantity per 1 kg reference flow. Preserve actual numerator units and burden coverage."
      inputs:
        - cp_release
        - cp_lot
        - cp_pack
        - cp_utility
        - cp_transport
        - cp_residual
      output: "x_norm"
      source_ids:
        - pef-accounting-2021
    - id: contents_balance
      applies_to: "unreleased_contents; reference_product; unreleased_transfer; returned_released_contents; received_released_contents; released_dispatch; waste_contents; cleaning_effluent"
      rule: "Use two status ledgers within one declared physical perimeter: U0 + Iu = Q0 + Du + Wu + Cu + Eu + U1; G0 + Q0 + Ig + Rg = Dg + Wg + Cg + Eg + G1. U is never-first-released contents including holds; G is already-first-released contents; 0/1 denote opening/closing. Iu contains only evidenced never-released external receipts and their returns; Ig is first external receipt of already-released goods; Rg is genuine return of released old goods, independently linked to original cohort and never entered into U. Du/Dg are outward product transfers in each status, excluding the disjoint W, C and E outlets. W is separately discarded contents, C product constituent in effluent, E measured substance-specific emissions. Q0 internally transfers between ledgers and cancels at the consolidated physical boundary; cancel internal handoffs and avoid duplicate effluent constituents. Keep discrepancies unresolved."
      inputs:
        - cp_lot
        - cp_release
        - cp_released_custody
        - cp_residual
      output: "contents closure in kg"
      source_ids:
        - pef-accounting-2021
    - id: article_balance
      applies_to: "each packaging article pool"
      rule: "For each article check S0 + P + F + R = D + U + W + S1; count times measured same-specification tare gives kg. Physical quantities are not automatic new manufacture demand; independently reconcile inherited burdens, coverage and lifetime uses."
      inputs:
        - cp_pack
        - cp_residual
      output: "article closure and burden coverage"
      source_ids:
        - pef-accounting-2021
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "E_MJ = 3.6 * E_kWh; convert metered energy only, never replace provider native-property verification with unit-group equivalence."
      inputs:
        - cp_utility
      output: "MJ; kWh"
      source_ids:
        - pef-accounting-2021
    - id: freight_basis
      applies_to: "road_freight"
      rule: "Loaded-leg service = actual transported gross tonnes * actual km, including package mass and excluding provider-covered legs. Handle empty returns by a compatible provider basis; never substitute Q0 net kg for actual payload."
      inputs:
        - cp_transport
      output: "t·km"
      source_ids:
        - pef-accounting-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference_product"
      requirement: "Align producer, registration edition, actual pack and lot net mass; same brand cannot merge editions"
      evidence: "actual label; signed first release; handoff"
    - id: dq_complete
      applies_to: "whole system"
      requirement: "Audit each producer black box, BOM, native properties/units, residuals and service coverage; retain gaps unresolved"
      evidence: "supplier coverage matrix; row-wise physical/burden ledgers"
    - id: dq_uncertainty
      applies_to: "measurement and allocation"
      requirement: "Disclose resolution, calibration, coverage period and article-pool allocation uncertainty; no invented quantitative ranges"
      evidence: "raw readings; uncertainty; driver evidence"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference product and classification"
    rule: "Require actual country/registration/edition/lot/producer and non-lethal ungulate-repellent purpose, not merely a pesticide label. Exclude CPC 34661 insecticides, 34662 fungicides, 34663 herbicides/anti-sprouting/growth regulators, 34664 disinfectants and 34666 hazardous pesticides. The latter is a specific HS grouping, not a warning pictogram test: confirm the actual product is outside HS 3808.52/.59 from authoritative classification evidence or competent supplier declaration, without inferring from undisclosed ingredients. Hold unresolved cases. This scoped 34669 association is a narrower inference, not an official TRICO customs ruling."
    source_ids:
      - unsd-cpc3-2025
      - unsd-cpc3-2026
      - cbp-repellent-2009
      - epa-trico-2026
  - rule_id: v_measure
    applies_to: "all inventory rows"
    rule: "Require Q0 > 0, unique first-release lot membership, calibrated net weighing, same cohort denominator in both languages, traceable activity numerators and compatible native provider units. Reject gross-package or active-content denominators, duplicate transfer output, default density and unsupported energy-property substitution."
    source_ids:
      - pef-accounting-2021
  - rule_id: v_balance
    applies_to: "each lot and article pool"
    rule: "Close contents and each packaging ledger including opening/closing stocks at all declared in-perimeter locations (outside-owned assets separately memorandized), every purchased/first non-purchased receipt, true return, loaded/unused dispatch, discard and held amount. Check same-article return links independently from burden coverage. Retain uncertainty in measured units and source-specific tolerances; no invented generic tolerance or discrepancy-as-emission closure."
    source_ids:
      - pef-accounting-2021
  - rule_id: v_coverage
    applies_to: "dataset readiness"
    rule: "Before complete environmental use require qualified upstream production, actual article BOM, all active atomic flows and properties/units, services, emissions, residual receiver/treatment, allocation and inherited burdens. A declared unresolved product UUID permits candidate authoring only; it does not establish producer equivalence or study qualification. Report performed/skipped checks and every unresolved coverage item."
    source_ids:
      - pef-accounting-2021
  - rule_id: v_release_event
    applies_to: "original release status and site physical stock"
    rule: "Independently reconcile earliest applicable release event and physical dispatch: qualifying unshipped mass can enter Q0 on commercial pack/label completion or shipment-area entry, while separated/marked unreleased goods stay held. Preserve released-awaiting-shipment closing physical stock without adding Q0 to the physical balance. Retain later regulatory production events without treating the same contents as new net production; continue all actual new environmental burdens against the original cohort."
    source_ids:
      - ecfr-release-152-3
      - epa-trico-2026
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Original first-release product-gate background only after actual data, upstream and native identities are qualified"
  allowed_use: "Environmental accounting at matching registration edition, state, boundary and provider coverage, with uncertainty"
  excluded_use: "Formulation/manufacturing instructions, application efficacy, toxicology, regulatory classification ruling, full PEF conformity, default field impacts or unqualified data substitution"
