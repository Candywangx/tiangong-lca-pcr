    applies_to: "out_formalin, in_methanol, w_aqueous"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure mass fractions on the actual supplied or discharged basis. For out_formalin determine industrial solution HCHO-equivalent mass fraction using iso-formalin-assay-1972 and cp_product; free-carbonyl analysis alone is not a full product assay. Report overall water/methanol composition separately from true free/bound species. Record sample state, dilution, recovery, impurities and propagated uncertainty. Raw methanol and dilute/contaminated wastes require their own compatible assays; do not transfer the commercial-solution procedure outside its matrix/concentration limits."
