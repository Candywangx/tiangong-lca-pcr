      rule: "Include collection/rework of cleaning, spill and contaminated condensate streams, pretreatment and any wastewater treatment actually inside the foreground. External treatment uses a composition/receiver-specific waste interface; final elementary releases occur only at the declared nature boundary. No normal-operation effluent assumption permits deleting episodic releases."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: b_ledger
      applies_to: "physical_ledger"
      rule: "Retain unallocated mass, water, carbon, hydrogen, oxygen and energy ledgers, with composition/quantity equality at both endpoints of every internal link. Include stocks, precipitation, catalysts, nitrogen/oxygen carriers, reaction water, collected residues and abnormal losses. Recovered solvent has its actual composition/state, not fresh feed identity by name alone."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: b_complete
      applies_to: "additional_exchanges"
      rule: "Inventory cards are a conditional minimum checklist. Add one atomic row for every additional actual reagent, filter, ion-exchange resin/regenerant, captured dust, sludge type, packaging component, transport, cooling chemical, fuel or pollutant. State documented absence rather than silent zero; missing identity/provider stays incomplete. For actual packed deliveries, add each container/closure component separately while excluding it from net product mass. Account for actual returnable containers/tankers, packing, maintenance replacements, cleaning, transport and return losses using evidenced service/cycle shares; do not assume disposable packaging or zero equipment burden. Preserve carried upstream burdens of purchased feed, rework and regenerated material without crediting the same recovery twice."
      source_ids:
        - jrc-lvoc-2017
