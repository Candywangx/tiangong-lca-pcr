allocation_rules:
  - rule_id: a_hierarchy
    applies_to: "formalin_train"
    rule: "First investigate stage subdivision and system expansion; report any expanded system as that system, not a silently credited single-product result. Use a demonstrated causal physical relationship for inseparable joint burdens where avoidance is impossible. If that cannot be established, justify economic allocation using actual same-period gate quantities and prices, disclose rejected alternatives and sensitivity. Do not assign a fixed share or infer allocation from formalin/steam mass ratios, sale labels or process-gas heating value."
    source_ids:
      - eu-ef-2021-allocation
  - rule_id: a_accounts
    applies_to: "physical_ledger, burden_account"
    rule: "Keep actual unallocated formalin, exported steam, catalyst waste and effluent quantities and their physical links unchanged. Only the environmental burden account is partitioned: retain each dedicated burden plus the evidenced share of each joint burden, normalized to accepted formalin supply mass. Record shares, included joint stages and evidence; shares sum to one for the joint pool. Never multiply co-product physical output by the allocation share."
    source_ids:
      - eu-ef-2021-allocation
      - jrc-lvoc-2017
  - rule_id: a_recovery
    applies_to: "formalin_train"
    rule: "Internal methanol/formalin/condensate returns are internal transfers, with no coproduct credit. Identify useful exported steam by actual receiver acceptance and measured net heat. Treat spent silver and paraformaldehyde deposits according to actual waste/product status and receiver; a recycling intention does not automatically make either a co-product or justify avoided virgin production. Do not combine allocation and substitution for the same burden."
    source_ids:
      - eu-ef-2021-allocation
      - jrc-lvoc-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "formalin_train"
      flow_role: "Accepted net formalin and composition"
      record_type: "Delivery and laboratory records"
      raw_fields: "SKU; lot; net loading mass; beginning/end stocks; acceptance; rejected/rework mass; HCHO-equivalent assay method; methanol; water; impurities; temperature"
      collection_method: "Calibrated net loading scale/mass meter and actual tare/stock reconciliation. ISO2227 Sections4–8: clear/slightly cloudy25–45% HCHO; prompt sealed sampling, no precipitate; fresh neutral sulphite, weighed sample/sample neutralisation, covered handling,2min mixing and standardised acid endpoint. w_HCHO = 30.03 × c × V / (1000 × m_sample), c mol/L, V mL, m_sample g, with actual dilution/titer and demonstrated blank. Breitkreuz Section2.4.3:0.2g sample+1g dry methanol, condition≥24h, volumetric KF repeated≥2, weighed dilution/reagent blank corrections; validate comparable impurity matrix/time response. w_MeOH = 1 - w_HCHO - w_water_overall - sum(w_distinct_impurities), using independently measured distinct impurities; propagate uncertainty. Check phase coverage, interfering carbonyl/acid/redox constituents, recovery and dilution consistency. Never borrow the study’s omitted acid or numerical errors; unknown impurities/interferences prevent closure. Overall composition is not free-species mass; whole product remains1kg."
      unit: "kg; mass fractions"
      frequency: "Each delivery/lot; stock census at period ends"
      temporal_coverage: "Same declared period, all relevant operating modes"
      site_scope: "Actual plant loading gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed acceptance, CoA/raw assay, stocks and mass closure"
    - protocol_id: cp_material
      process_id: "formalin_train"
      flow_role: "Fresh methanol reaction and stabiliser inputs"
      record_type: "Receipt, meter, stock and assay records"
      raw_fields: "Supplier route/carbon origin; grade; delivered mass; purity/water; stage dosing; stock changes; internal recovery"
      collection_method: "Calibrated weighing or matched density/temperature volume-to-mass conversion; separate fresh reaction and finishing additions from internal returns; distinguish whole industrial methanol supply mass from its CH3OH component mass and accompanying water/impurities; reconcile the provider reference with the supplied basis"
      unit: "kg"
      frequency: "Each receipt and dosing campaign; period-end reconciliation"
      temporal_coverage: "Same declared period"
      site_scope: "Methanol receipt, vaporiser and finishing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier certificate, meter/scale calibration, stage balance"
    - protocol_id: cp_catalyst
      process_id: "formalin_train"
      flow_role: "Fresh/regenerated silver charge"
      record_type: "Weighing and service records"
      raw_fields: "Crystalline grade; metal/contamination/water assay; installed/removed mass; stock; reclaimer return; service period"
      collection_method: "Calibrated charge/removal weighing and metal assays; link each actual regeneration shipment/return; distribute measured campaign use over production served without assuming lifetime or recovery"
      unit: "kg"
      frequency: "Each charge/change/return; period reconciliation"
      temporal_coverage: "Actual catalyst campaigns spanning the same declared production allocation"
      site_scope: "Actual catalyst bed and receiving service"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Charge log, assays, receiver/service receipts, stock closure"
    - protocol_id: cp_water
      process_id: "formalin_train"
      flow_role: "External demineralised make-up"
      record_type: "Water meter and quality records"
      raw_fields: "Source; treatment grade; density; absorption/dilution/cleaning/boiler meter readings; composition water; recycles"
      collection_method: "Calibrated purpose meters with actual density/temperature when mass conversion is needed; identify carrier/reaction water separately"
      unit: "kg"
      frequency: "Continuous or batch meters; period reconciliation"
      temporal_coverage: "Same declared period"
      site_scope: "Supply and purpose boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, water-quality results and unallocated water balance"
    - protocol_id: cp_energy
      process_id: "formalin_train"
      flow_role: "Electricity, imported/exported steam heat and natural gas"
      record_type: "Separate meter and utility records"
      raw_fields: "kWh; voltage/grid/location; gas m3/T/absolute P/wet-dry/composition/Z; heating basis; steam mass/P/T/dryness; condensate mass/enthalpy; own use; export; receiver basis"
      collection_method: "Separate calibrated electricity/fuel/steam/condensate meters with synchronised intervals. Collect actual absolute P (gauge plus measured ambient P), T, phase and wet quality x. Use IAPWS-IF97 valid regions for ordinary-water h(p,T), or h=(1-x)h_liquid+x h_vapour at saturation; P/T alone cannot establish x. Verify implementation against release test values/common datum and include state/meter uncertainty. For the actual mass-closed steam-to-condensate interface apply c_heat; unequal returns, non-returned condensate, make-up, drains, leaks, residual steam/storage require a complete mass/enthalpy-port account including material loss/work/kinetic/potential terms. Contaminated mixtures need separate thermodynamic qualification. Reconcile supplier/receiver accepted net heat with dedicated oxidiser/boiler; kg/state water and MJ service are different ledgers, counted once each, not NCV/GCV conversion."
      unit: "MJ; m3; steam kg as raw records"
      frequency: "Meter interval and each start-up/export; period reconciliation"
      temporal_coverage: "Same declared period including abnormal operation"
      site_scope: "Actual utility supply, reactor heat recovery and dedicated boiler"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, fuel certificate, steam state/receiver evidence, full heat balance"
    - protocol_id: cp_air
      process_id: "formalin_train"
      flow_role: "Fresh atmospheric resource input"
      record_type: "Air meter and composition records"
      raw_fields: "Fresh flow; recirculated flow; T/P/humidity/O2/N2; mass conversion; combustion air"
      collection_method: "Calibrated fresh-air flow and measured state/composition; retain recycled gas as internal link"
      unit: "kg"
      frequency: "Meter interval; representative mode-specific composition"
      temporal_coverage: "Same declared period"
      site_scope: "Fresh intake boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, gas state record and oxygen/carrier-gas balance"
    - protocol_id: cp_emission
      process_id: "formalin_train"
      flow_role: "Each outdoor-air species and size fraction"
      record_type: "Stack/fugitive sampling and operating records"
      raw_fields: "Outlet; species/CAS; concentration; flow; time; T/P; wet-dry/O2 corrections; detection limits; recovery; control modes; leak/load events; NOx definition; size bins"
      collection_method: "Species-specific validated sampling/analysis and compatible gas flow after final controls; integrate actual operating modes and measured handling/LDAR releases. Carbonyl sampling/analysis must demonstrate matrix recovery; occupational concentration alone is not a plant release inventory"
      unit: "kg; gas volume as raw record"
      frequency: "Representative tests for each operating mode plus continuous/event records where needed"
      temporal_coverage: "Same period; include starts/stops, loading, relief and maintenance"
      site_scope: "Final stack, loading vents and actual fugitives"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Laboratory QA blanks/spikes, flow calibration, sampling recovery, leak/event log, uncertainty"
    - protocol_id: cp_waste
      process_id: "formalin_train"
      flow_role: "Each external residual interface"
      record_type: "Weighbridge, assay and receiver records"
      raw_fields: "Stream/source; consignment; wet mass/volume/density; solids; Ag or organic fractions; actual pollutants; internal rework; recipient; treatment/product status"
      collection_method: "Calibrated weighing/volume measurement and representative composition tests; separate catalyst, paraformaldehyde deposits, aqueous waste and biological sludge; document receiver acceptance"
      unit: "kg; volume/density as raw records"
      frequency: "Every shipment or discharge; period reconciliation"
      temporal_coverage: "Same period including episodic cleaning"
      site_scope: "Actual external receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste transfer receipts, assay/solids basis, receiver and treatment evidence"
    - protocol_id: cp_effluent
      process_id: "formalin_train"
      flow_role: "Each final freshwater species and carrier water"
      record_type: "Outfall flow and analytical records"
      raw_fields: "Whole effluent volume/wet mass; measured carrier-water fraction/density/state; temperature; species/CAS; free/total HCHO definition; methanol; pH/formic acid/formate; COD/TOC; solids; treatment performance; recovery; detection limits"
      collection_method: "Calibrated final outfall flow with time-matched samples; matrix-validated free-carbonyl analysis, supplemented where needed for total HCHO-equivalent. Retain COD/TOC/salt diagnostics separately; track all measured additional species; preserve total effluent sampling volume separately from the verified water-constituent exchange"
      unit: "kg species; m3 water"
      frequency: "Flow interval, representative mode-specific composites and every episodic discharge"
      temporal_coverage: "Same declared period"
      site_scope: "Actual final surface-freshwater boundary only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Laboratory QA/recovery/speciation, calibrated flow, destination and treatment logs"
    - protocol_id: cp_allocation
      process_id: "formalin_train"
      flow_role: "Joint and dedicated environmental burdens"
      record_type: "Stage/receiver/market records"
      raw_fields: "Stage meters; dedicated/joint burden pools; accepted formalin; useful net steam; receiver function; physical relationship; actual prices/quantities; uncertainty"
      collection_method: "Investigate subdivision/expanded-system option first; verify causal relationship or gather comparable same-period gate revenue records; retain physical ledger separately"
      unit: "kg formalin; MJ useful heat; actual currency and unit prices"
      frequency: "Same-period records; update when outputs/markets change"
      temporal_coverage: "Same declared period"
      site_scope: "Declared joint stages and actual receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Stage causality, functional/price evidence, rejected alternatives and sensitivity"
  calculation_rules:
    - id: c_reference
      applies_to: "all inventory rows"
      rule: "B = accepted net formalin supply mass for the period in kg; each measured period boundary quantity is divided by B. The reference product amount is 1 kg; all stage internal links retain both endpoints and are not additional boundary outputs."
      inputs:
        - cp_product
        - "each row's linked protocol"
      output: "Physical inventory per 1 kg reference flow"
      source_ids:
        - jrc-lvoc-2017
        - hexion-formalin
    - id: c_composition
      applies_to: "out_formalin, in_methanol, w_aqueous"
      rule: "Constituent mass = measured supply/stream mass × measured mass fraction on the same basis. Report HCHO-equivalent, methanol, water and impurities separately; total HCHO-equivalent is not free gas mass or TOC. Use the measured overall water convention and derive methanol only after separately measured non-overlapping impurities; propagate all measurement uncertainty. This analytical ledger and true molecular-species ledger are alternatives, not additive physical outputs. No default assay or density."
      inputs:
        - cp_product
        - cp_material
        - cp_waste
      output: "Component ledger in kg, alongside full mixture mass"
      source_ids:
        - jrc-lvoc-2017
        - hexion-formalin
        - iso-formalin-assay-1972
        - breitkreuz-formalin-analysis-2023
    - id: c_release
      applies_to: "elementary outputs"
      rule: "Released species mass = sum over measured operating intervals of compatible species concentration × actual gas/liquid flow × time, after unit/state/recovery corrections; add independently measured event/fugitive releases without overlap. NOx and particle intervals must have verified compatible definitions. The whole sampled gas/liquid volume belongs to the concentration integration; its component water or air exchange is not another independent carrier mass."
      inputs:
        - cp_emission
        - cp_effluent
      output: "Actual released species kg; carrier water m3 separately"
      source_ids:
        - jrc-lvoc-2017
        - epa-carbonyl-8315a
    - id: c_heat
      applies_to: "in_steam, out_steam"
      rule: "For a mass-closed steam-to-condensate service interval, Q_net = m × (h_supply - h_condensate) / 1000, with m in kg, h from iapws-if97-2012 in kJ/kg and Q_net in MJ. Integrate actual intervals. For unequal returns, include every documented water/steam port and storage change on a common enthalpy reference; a mass imbalance cannot be hidden in this formula. Reconcile gross generation = actual own use + useful export + measured losses and inventory change, with imports separate. Do not use a mass-to-MJ constant or assume the provider reference is net heat."
      inputs:
        - cp_energy
      output: "Separate imported/exported useful heat in MJ"
      source_ids:
        - jrc-lvoc-2017
        - iapws-if97-2012
    - id: c_burden
      applies_to: "burden_account"
      rule: "For each evidenced joint pool, product-assigned burden = dedicated product burden + joint burden × justified product share; divide by B for product reporting. Keep actual coproduct physical outputs unchanged and show shares summing to one; an expanded-system model is disclosed separately."
      inputs:
        - cp_allocation
        - cp_product
        - "stage meters"
      output: "Allocated formalin environmental-burden account"
      source_ids:
        - eu-ef-2021-allocation
  data_quality_requirements:
    - id: q_identity
      applies_to: "all rows"
      requirement: "Verify name/CAS, route/state, origin, actual mixture composition, medium, reference property/unit and provider definition separately. A confirmed flow UUID is not a complete dataset; incompatible identity or quantity basis remains open."
      evidence: "Supplier/receiver declarations; direct identity and native property/unit chain; lab method"
    - id: q_closure
      applies_to: "physical_ledger"
      requirement: "Close mass, water, carbon, hydrogen, oxygen and heat using measured stocks/returns; disclose residual and uncertainty without an invented tolerance, conversion, yield or concentration. Include atmospheric carriers and reaction water in the unallocated physical ledger. Reconcile molecular hydrogen production, internal combustion/recycle, residual emissions and any actual external recovery separately; add verified sale rows if an actual recovery crosses the boundary. Do not suppress an actual product to fit the minimum checklist."
      evidence: "Stage meters, independent assays and reconciliation"
    - id: q_sources
      applies_to: "all source-based rules"
      requirement: "Retain each source's route and conditions. BREF historical/2013–2014 observations are not present-site values, universal ratios or default emissions. Hexion supports supply state only; EPA 8315A supports free-carbonyl analysis with matrix limits, not commercial total assay. ISO2227 supplies the industrial HCHO-equivalent procedure; the reactive-mixture study supplies overall-water analysis and composition convention; IAPWS supplies water/steam state properties. Their matrix, phase, time and validity limits remain binding, and reported research uncertainties are not universal acceptance thresholds."
      evidence: "Original locators and actual collection evidence"
    - id: q_coverage
      applies_to: "dataset"
      requirement: "Every conditional row is measured, demonstrated absent or explicitly unresolved. Unknown is not zero. Add actual exchanges outside the minimum checklist, including actual products and recovered streams, and retain treatment/site/provider completeness and operating-mode representativeness."
      evidence: "Site flow diagram, monitoring/stock/receiver records and omissions register"
validation_rules:
  - rule_id: v_reference
    applies_to: "dataset"
    rule: "Require one accepted out_formalin reference output at 1 kg full supply mixture; collect all qualifiers and actual assay/state. Internal same-solution staging is not another reference output. Reject a pure-HCHO, different mixture or excluded-route substitution."
    source_ids:
      - jrc-lvoc-2017
      - hexion-formalin
  - rule_id: v_measurement
    applies_to: "all inventory rows"
    rule: "Require the same per 1 kg supply-mass denominator in inventory, collection and calculation; verify all unit conversions, steam state/provider bases and gas volume conventions. A missing utility UUID/provider alone does not invalidate the defined mass/state/enthalpy method, but the actual dataset link remains incomplete until quantity compatibility is verified."
    source_ids:
      - jrc-lvoc-2017
      - iapws-if97-2012
  - rule_id: v_environment
    applies_to: "elementary outputs"
    rule: "Check exact final media/species/origin/phase, carbonyl assay coverage, NOx definition and disjoint particle intervals. Exclude correction flows and avoid untreated/final or aggregate/species duplication. Retain actual biogenic CO2 in LCI if present, with a separate origin row."
    source_ids:
      - jrc-lvoc-2017
      - epa-carbonyl-8315a
  - rule_id: v_balances
    applies_to: "physical_ledger, burden_account"
    rule: "Require unallocated physical closure, equal internal endpoints, separate external treatment interfaces and final nature releases, and transparent allocated joint pools. Physical coproduct outputs cannot be scaled by burden shares or netted away."
    source_ids:
      - jrc-lvoc-2017
      - eu-ef-2021-allocation
  - rule_id: v_gaps
    applies_to: "dataset"
    rule: "A blank UUID retains one specific exchange and a review gap; resolve its identity/provider before a complete usable dataset. Preserve unresolved assays, unsupported monitoring/quantity bases and missing streams as incomplete findings. Candidate methodology and structural checks do not establish independent scientific approval."
    source_ids:
      - jrc-lvoc-2017
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Composition- and route-compatible purchased formalin input, after complete foreground collection and independent review"
  allowed_use: "The declared actual aqueous methanol-stabilised grade, silver high-conversion route, bulk gate and dedicated thermal-oxidiser/heat-recovery configuration"
  excluded_use: "Section 1 exclusions; assuming 1 kg pure HCHO; other product concentrations/provider quantity bases; automatic steam displacement credits; claiming PEF compliance solely from the allocation hierarchy"
  required_metadata: "All reference qualifiers; geography/time; process map; component and internal link ledger; provider/receiver references; operating modes; allocation method and shares"
  required_quality_disclosure: "Measurement/assay/closure uncertainty; temporal and route representativeness; incomplete identity/provider links; additional/absent exchanges; historical source limitations; scientific and translation state"
  update_trigger: "Product grade/composition, methanol origin/provider, catalyst form, process/control configuration, utility pressure/reference, waste receiver, treatment or allocation/market change"
data_sources:
  - id: "jrc-lvoc-2017"
    type: "official_guidance"
    reference: "European Commission JRC, LVOC BREF 2017, JRC109279, DOI 10.2760/77304; [official original](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf), Chapter 6, printed pp.335–348 and 350–353 (PDF372–385,387,389–390), especially 6.2.2.1/Fig6.1, 6.3.1–6.3.5, 6.4.1.1.1, 6.4.1.3 and 6.4.2.1"
    used_for: "Silver-route decomposition, tail-gas control/heat recovery, solution/carrier-water distinction, measured final species, episodic wastewater/rework, catalyst/deposit streams and monitoring conditions. Other routes and historical plant quantities remain excluded from defaults."
  - id: "hexion-formalin"
    type: "literature"
    reference: "Hexion, [Formalin product original](https://www.hexion.com/products/formalin), “Confidence built into every delivery”, aqueous solution concentrations and tailored methanol inhibition; dated source snapshot 2026-10-13"
    used_for: "Producer evidence of aqueous supplied mixtures and actual grade diversity only; no process attribution or standard recipe."
  - id: "epa-carbonyl-8315a"
    type: "method_factor"
    reference: "US EPA, [Method 8315A, Revision1, December1996](https://www.epa.gov/sites/default/files/2015-07/documents/epa-8315a.pdf), Sections1–3, procedure1; aqueous/waste samples and Method0011 stack samples"
    used_for: "Free-carbonyl HPLC/derivatisation scope, unfamiliar-matrix confirmation, method recovery/interference requirements. It does not establish total commercial formalin assay or a universal emissions factor."
  - id: "eu-ef-2021-allocation"
    type: "official_guidance"
    reference: "European Commission, [Recommendation (EU)2021/2279 AnnexesI–II](https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf), AnnexI Section4.5, PDF/printed pp.63–64"
    used_for: "General multifunctionality hierarchy and justification of causal/economic allocation only. Sector-specific exceptions and recycling formulas are not imported; no full PEF compliance claim."
  - id: "iso-formalin-assay-1972"
    type: "method_factor"
    reference: "ISO2227:1972, Formaldehyde solutions for industrial use — Determination of formaldehyde content, Sections 1–9, printed pp.1–2; [publisher](https://www.iso.org/standard/7032.html), [complete method preview](https://cdn.standards.iteh.ai/samples/7032/c62779bef47d456f90f7fa483c8ad37e/ISO-2227-1972.pdf)"
    used_for: "Industrial solution HCHO-equivalent mass-fraction assay, weighed sampling, neutral sulphite/acid titration; clear/slightly cloudy 25–45% applicability, precipitation and prompt-sampling limits. No pure-gas denominator or default factory composition."
  - id: "breitkreuz-formalin-analysis-2023"
    type: "literature"
    reference: "Christian Frederik Breitkreuz, Thermodynamic Properties of Formaldehyde Solutions and Poly(oxymethylene) dimethyl ether (OME) Production, Scientific Report Series41, ISBN978-3-944433-34-9, 2023; [original](https://kluedo.ub.rptu.de/files/7238/_230413%2BOnline-Version-1.pdf), Sections2.3–2.4.3, AppendixA.1–A.2, printed pp.7–12,137–138"
    used_for: "Overall versus true-species convention, sulphite overall-HCHO assay, conditioned volumetric KF overall-water assay and ternary methanol closure. Phase, time, impurity and matrix limitations retained; no OME manufacture, equilibrium parameters, research uncertainty or ignored-acid assumption imported."
  - id: "iapws-if97-2012"
    type: "method_factor"
    reference: "IAPWS R7-97(2012), Revised Release on the IAPWS Industrial Formulation1997 for the Thermodynamic Properties of Water and Steam; [official original](https://iapws.org/technical-guidance/release/IF97-Rev.download), Sections2–3,5–9,12, including Tables3/12/31 and saturation equations"
    used_for: "Ordinary water/steam state enthalpy and validity/uncertainty reference for actual mass/state heat measurement. No utility pressure, dryness, provider quantity, calorific-value conversion or constant kg-to-MJ factor."
