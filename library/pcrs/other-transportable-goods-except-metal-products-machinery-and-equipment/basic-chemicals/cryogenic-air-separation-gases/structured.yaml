    - unit_id: "normative_42137"
      family: "allocation"
      span:
        start:
          offset: 42137
          line: 519
          column: 1
        end:
          offset: 45111
          line: 531
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nCryogenic distillation jointly produces separable species/state streams. Keep (a) an unallocated physical process graph and species/water/material balance and (b) a burden allocation ledger. `eiga-air-gases-pcf-2026` §4.6 supports allocation based on power required to produce each product, with no double counting; its PP33 example is not valid for all argon, pressures or purities and its coefficients are not adopted here.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_subdivide | asu | Apply only within boundary_applicability; retain its complete configuration and gate conditions in any allocated dataset. First assign independently metered product-specific compression, liquefaction, argon purification and loading activity directly to that product and state. Subtract it from the remaining shared pool; count every meter once. Subdivision must reflect real separable equipment, not an assumed split. | eiga-air-gases-pcf-2026; linde-air-separation-2019 |\n| allocation_power | shared_pool | For the remaining common pool use a documented site engineering power-requirement model for every actually saleable species/state i. Weight W_i = m_i × e_i, where m_i is accepted gate product mass and e_i is evidenced comparable specific power requirement in kWh/kg for the same scope, purity and pressure. Share a_i = W_i / sum(W_j). The sum covers all actual GOX/GAN/GAR/LOX/LIN/LAR; absent products need records. Positive weights and denominator are required. Do not use product heating value or an arbitrary equal mass split. | eiga-air-gases-pcf-2026 |\n| allocation_conservation | burden_ledger | For each eligible shared environmental exchange or burden vector C, allocated B_i = D_i + a_i × C; D_i is directly attributable activity. Sum(B_i) must equal sum(D_i) + C. The specific result is B_i / m_i. Store the model, calibration/engineering evidence, uncertainty, applicable period and every allocation decision; shared non-power exchanges need an evidenced causal assignment or independently reviewed justified extension. | eiga-air-gases-pcf-2026 |\n| allocation_physical | physical_ledger | Physical outputs remain m_i, or m_i / G in the GOX-normalized joint process, never a_i × m_i. Component balances include measured purity/impurities, stocks, rejection and loss; internal links cancel at equal mass. An allocated product dataset must not assert that all these joint co-products belong to that product alone. | eiga-air-gases-pcf-2026; linde-air-separation-2019 |\n| allocation_review | method_selection | If complete causal power evidence is missing, retain the complete joint inventory and flag product-specific burden results as pending; do not manufacture weights. Any economic or other alternative needs explicit independent methodological review and actual price/time evidence. No avoided-production credit or free burden assignment is automatic. | eiga-air-gases-pcf-2026 |\n\n"
