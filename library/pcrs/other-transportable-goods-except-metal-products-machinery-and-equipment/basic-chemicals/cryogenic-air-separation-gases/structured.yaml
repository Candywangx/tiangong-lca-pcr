allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Cryogenic distillation jointly produces separable species/state streams. Keep (a) an unallocated physical process graph and species/water/material balance and (b) a burden allocation ledger. eiga-air-gases-pcf-2026 §4.6 supports allocation based on power required to produce each product, with no double counting; its PP33 example is not valid for all argon, pressures or purities and its coefficients are not adopted here."
    source_ids: []
  - rule_id: allocation_subdivide
    applies_to: "asu"
    rule: "Apply only within boundary_applicability; retain its complete configuration and gate conditions in any allocated dataset. First assign independently metered product-specific compression, liquefaction, argon purification and loading activity directly to that product and state. Subtract it from the remaining shared pool; count every meter once. Subdivision must reflect real separable equipment, not an assumed split."
    source_ids:
      - eiga-air-gases-pcf-2026
      - linde-air-separation-2019
  - rule_id: allocation_power
    applies_to: "shared_pool"
    rule: "For the remaining common pool use a documented site engineering power-requirement model for every actually saleable species/state i. Weight W_i = m_i × e_i, where m_i is accepted gate product mass and e_i is evidenced comparable specific power requirement in kWh/kg for the same scope, purity and pressure. Share a_i = W_i / sum(W_j). The sum covers all actual GOX/GAN/GAR/LOX/LIN/LAR; absent products need records. Positive weights and denominator are required. Do not use product heating value or an arbitrary equal mass split."
    source_ids:
      - eiga-air-gases-pcf-2026
  - rule_id: allocation_conservation
    applies_to: "burden_ledger"
    rule: "For each eligible shared environmental exchange or burden vector C, allocated B_i = D_i + a_i × C; D_i is directly attributable activity. Sum(B_i) must equal sum(D_i) + C. The specific result is B_i / m_i. Store the model, calibration/engineering evidence, uncertainty, applicable period and every allocation decision; shared non-power exchanges need an evidenced causal assignment or independently reviewed justified extension."
    source_ids:
      - eiga-air-gases-pcf-2026
  - rule_id: allocation_physical
    applies_to: "physical_ledger"
    rule: "Physical outputs remain m_i, or m_i / G in the GOX-normalized joint process, never a_i × m_i. Component balances include measured purity/impurities, stocks, rejection and loss; internal links cancel at equal mass. An allocated product dataset must not assert that all these joint co-products belong to that product alone."
    source_ids:
      - eiga-air-gases-pcf-2026
      - linde-air-separation-2019
  - rule_id: allocation_review
    applies_to: "method_selection"
    rule: "If complete causal power evidence is missing, retain the complete joint inventory and flag product-specific burden results as pending; do not manufacture weights. Any economic or other alternative needs explicit independent methodological review and actual price/time evidence. No avoided-production credit or free burden assignment is automatic."
    source_ids:
      - eiga-air-gases-pcf-2026
dataset_production:
  collection_protocols:
    - protocol_id: cp_products
      process_id: "asu"
      flow_role: "Reference and co-product outputs"
      record_type: "Meter and custody records"
      raw_fields: "Species; phase; SKU/purity; impurity mass or mole fractions; moisture; mass/volume; absolute pressure; temperature; volume reference state; compressibility; rejects/losses; opening and closing stocks; accepted GOX mass G"
      collection_method: "Calibrated gas mass meter, or gas volume with traceable density/composition/T/P/Z conversion; liquid mass meter or tare/heel-corrected weighing. Reconcile tank balances, production and accepted custody transfers for each state separately."
      unit: "kg; native volume records retained"
      frequency: "Continuous meters; every custody transfer; monthly reconciliation"
      temporal_coverage: "Complete common operating year"
      site_scope: "One named plant/train and declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, density method, certificates of analysis, delivery/stock reconciliation and uncertainty"
    - protocol_id: cp_energy
      process_id: "asu"
      flow_role: "Electricity"
      record_type: "Meter hierarchy and bills"
      raw_fields: "Meter id and supply voltage; supply provider; kWh; common and product-specific stage meters; runtime/load; regeneration cycles; power-requirement model e_i; pool assignment"
      collection_method: "Calibrated electricity meter hierarchy reconciled to bills; record each stage independently. Record transformation and losses once; convert kWh to MJ. Validate the causal model against real equipment/power records at actual purity, pressure and output mix."
      unit: "kWh; MJ; kWh/kg for allocation evidence"
      frequency: "Continuous or shift totals; monthly meter/bill reconciliation"
      temporal_coverage: "Same operating year and equipment configuration as cp_products"
      site_scope: "Same ASU; named utilities and output states"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, bills, stage reconciliation, model validation and uncertainty"
    - protocol_id: cp_air
      process_id: "asu"
      flow_role: "Resource intake and atmospheric returns"
      record_type: "Gas measurement and physical balance"
      raw_fields: "Air/vent meter ids; stream positions; gas volumes; T/P/Z; wet/dry basis; N2/O2/Ar composition; humidity; CO2 and other actual ambient impurities; tailgas/purge/vent flows; product losses"
      collection_method: "Measure inlet and each actual outlet with calibrated gas meters and representative composition sampling, including startup/loading events; convert each component to kg with traceable density or composition calculations. Document gross ambient impurity returns and any actual species relocation/net generation separately."
      unit: "kg; original gas volume and T/P/composition"
      frequency: "Continuous flow; representative composition across operation; every loss event"
      temporal_coverage: "Same complete period as cp_products"
      site_scope: "Named inlet and every actual air-release point of the ASU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Gas-meter and analyser calibration, sampling locations, species balances, humidity correction and uncertainty"
    - protocol_id: cp_water
      process_id: "asu"
      flow_role: "Cooling make-up, condensate, bleed, evaporation and direct discharge"
      record_type: "Water balance, meters and analyses"
      raw_fields: "Flow/receiver ids; water volume and density/temperature; makeup; condensate; evaporation; bleed; direct discharge; oil, dissolved salts, metals, pH and other actually identified pollutants; stock changes"
      collection_method: "Calibrated water meters or weighing; paired flow/concentration sampling for each separate drain and actual receiver. Reconcile water mass including intake humidity and stocks. Evaporation is measured or derived by a closed measured balance, with residual uncertainty disclosed, not a fixed loss percentage."
      unit: "kg; m3; original laboratory units"
      frequency: "Continuous/shift flow; representative paired sampling; monthly balance"
      temporal_coverage: "Same complete period as cp_products"
      site_scope: "Named cooling system/drains and actual treatment or freshwater receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, density records, flow-sample synchronisation, wastewater acceptance and water-balance residuals"
    - protocol_id: cp_consumables
      process_id: "asu"
      flow_role: "Each adsorbent, filter and lubricant"
      record_type: "Receipts, stock and maintenance records"
      raw_fields: "Row and supplier SKU; dry/wet supplied mass; composition/binder/additives; water fraction; actual service interval and stock changes; equipment id"
      collection_method: "Weigh replacements or reconcile traceable receipts/issue/stock records by one material grade. Cover the actual replacement service period, allocate the serviced equipment and keep the interval evidence; do not treat a bed charge as consumed every operating cycle."
      unit: "kg"
      frequency: "Every receipt/replacement; monthly stock reconciliation"
      temporal_coverage: "Actual full service interval with explicit allocation to the collection year"
      site_scope: "Named equipment within the same ASU"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighing/stock trace, supplier SDS/specification, replacement/service logs and uncertainty"
    - protocol_id: cp_waste
      process_id: "asu"
      flow_role: "Each separate removed solid or oil waste"
      record_type: "Weighing and receiver manifests"
      raw_fields: "Row; actual material composition; moisture/oil contamination; removed mass; in/out stocks; receiver and acceptance route; cartridge/dust mass split"
      collection_method: "Weigh each segregated waste at its boundary, reconcile maintenance removal and authorised receiver records. Do not combine alumina, sieve, filters and oil; do not count removed dust twice or assume recycling credit."
      unit: "kg"
      frequency: "Every removal and shipment; monthly reconciliation"
      temporal_coverage: "Same collection year plus actual material service interval"
      site_scope: "Named waste generation and transfer points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration, waste manifests, contamination tests, receiver acceptance and stock reconciliation"
  calculation_rules:
    - id: joint_normalization
      applies_to: "all inventory rows"
      rule: "Joint normalized amount = measured boundary exchange amount / G; G = accepted final gaseous oxygen mass in kg in the same period. Keep original totals, each meter unit and measured unit conversions. GOX output is exactly 1 kg. This normalizes the joint inventory, not a product-specific allocated result."
      inputs:
        - cp_products
        - cp_energy
        - cp_air
        - cp_water
        - cp_consumables
        - cp_waste
      output: "Joint physical inventory per 1 kg reference flow"
      source_ids:
        - eiga-air-gases-pcf-2026
    - id: component_balance
      applies_to: "physical_ledger"
      rule: "For component k: inlet + opening stock = sum of measured product masses × their component-k mass fractions + external waste/air/water exits + closing stock. Show internal equal-mass links and residuals with their measurement uncertainty. No nominal atmospheric composition or purity default closes a balance."
      inputs:
        - cp_products
        - cp_air
        - cp_water
        - cp_consumables
        - cp_waste
      output: "Species/material/water balance with stated residual"
      source_ids:
        - linde-air-separation-2019
        - jrc-cww-bref-2016
    - id: gas_mass_conversion
      applies_to: "gas_volume_basis"
      rule: "Gas component mass = original measured gas volume × validated gas density at the same T/P/Z/wet-dry/composition basis × component mass fraction. A normal-volume meter uses its own declared reference T/P and moisture convention; pressure gauges are converted to absolute pressure with a measured ambient pressure record."
      inputs:
        - cp_products
        - cp_air
      output: "Traceable kg for the specified gas/component"
      source_ids:
        - eiga-air-gases-pcf-2026
    - id: liquid_mass_conversion
      applies_to: "liquid_basis"
      rule: "Liquid product mass = measured liquid volume × validated actual liquid density, or measured gross loaded mass − tare − retained heel where applicable. Keep the actual measurement boundary and opening/closing inventory correction explicit."
      inputs:
        - cp_products
      output: "Accepted liquid product kg"
      source_ids:
        - eiga-air-gases-pcf-2026
    - id: water_load
      applies_to: "cp_water"
      rule: "Actual pollutant load = sum of paired concentration × discharge volume for matching time intervals, with actual laboratory-unit conversion; identify the chemical species and receiver. An aggregate COD/TOC or total nitrogen test is not a substitute for a distinct species identity, and overlapping totals must not be added."
      inputs:
        - cp_water
      output: "Atomic species load and direct discharge volume"
      source_ids:
        - jrc-cww-bref-2016
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Electrical energy in MJ = measured kWh × 3.6; reconcile common plus directly assigned meters to the site boundary total before any allocation."
      inputs:
        - cp_energy
      output: "Joint and directly attributable electricity MJ"
      source_ids:
        - eiga-air-gases-pcf-2026
    - id: burden_allocation
      applies_to: "burden_ledger"
      rule: "Apply allocation_subdivide, allocation_power and allocation_conservation to real period totals. Store every m_i, e_i, W_i, a_i, directly assigned D_i and shared C. Report uncertainty/sensitivity and product-specific results separately from the joint inventory."
      inputs:
        - cp_products
        - cp_energy
      output: "Conserved product-specific burden ledger"
      source_ids:
        - eiga-air-gases-pcf-2026
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Every nonzero exchange must have one exact physical identity and compatible native unit/provider basis. A blank non-reference UUID is a disclosed identity gap, not permission to replace it with a nearby substance, treatment route or correction flow."
      evidence: "Direct identity records plus supplier/SDS/receiver evidence"
    - id: dq_scope
      applies_to: "asu"
      requirement: "Verify the actual reference configuration. A fired utility, chemical refrigerant, cooling-water dose, hydrogen catalyst, imported gas or new emitted species cannot be silently omitted. Check maintenance particulate releases by real size/collection evidence; mutually exclusive PM size fractions only, with captured dust separate from airborne releases."
      evidence: "Process flow sheet, equipment register, SDS/BOM, drain/vent survey and maintenance records; eiga-asu-environment-2025"
    - id: dq_period
      applies_to: "all collection protocols"
      requirement: "Align sites, periods and stocks. Retain an actual full replacement interval for consumables; preserve original receipts, totals and conversions before normalization. Missing records are pending, not observed zeros."
      evidence: "Calibration and raw-data audit; eiga-air-gases-pcf-2026"
    - id: dq_balance
      applies_to: "physical_ledger"
      requirement: "Reconcile whole-ASU mass, O2/N2/Ar, water and material balances with measured impurity/stock information. Determine allowable residuals from actual measurement uncertainty and investigate unexplained differences; never invent a numerical tolerance or force closure."
      evidence: "cp_products; cp_air; cp_water; cp_consumables; cp_waste"
    - id: dq_allocation
      applies_to: "burden_ledger"
      requirement: "Validate complete power-requirement evidence at actual states, pressures/purities and output mix; conserve shared burden and each raw meter. Flow-property coefficients and literature benchmarks are not foreground defaults."
      evidence: "cp_energy; cp_products; eiga-air-gases-pcf-2026"
validation_rules:
  - rule_id: validate_reference
    applies_to: "gox"
    rule: "Verify every boundary_applicability configuration and gate condition from actual equipment/supply records. Require one GOX reference output of 1 kg; verify net gate G > 0, cryogenic gas route, certified composition, full qualifiers and native Mass/kg. Reject an elementary oxygen identity or a liquid reference used for gas."
    source_ids:
      - eiga-air-gases-pcf-2026
  - rule_id: validate_joint_outputs
    applies_to: "asu"
    rule: "Verify all actual gaseous/liquid species outputs and their independent accepted masses, stock changes, off-spec losses and conditions. Missing unproduced outputs need evidence; physical co-product mass cannot be multiplied by allocation share or silently deleted."
    source_ids:
      - eiga-air-gases-pcf-2026
      - linde-air-separation-2019
  - rule_id: validate_ledger
    applies_to: "physical_ledger"
    rule: "Require the actual process graph, equal-amount internal links, whole-mass/component/water balances and uncertainty-based residual review; environmental O2/N2/Ar intake/returns cannot stand in for product sales. Ambient CO2 return is not recovered CO2 product or an invented removal credit."
    source_ids:
      - linde-air-separation-2019
      - eiga-asu-environment-2025
  - rule_id: validate_uuid_units
    applies_to: "all inventory rows"
    rule: "Verify each selected physical identity, phase, species/CAS where present, reference property and unit against original fields. Each used upstream/treatment provider must additionally meet quantity, composition and boundary compatibility; a successful identity lookup is insufficient. Explicitly retain unresolved exact non-reference identities."
    source_ids:
      - eiga-asu-environment-2025
  - rule_id: validate_allocation
    applies_to: "burden_ledger"
    rule: "Verify direct assignment/common pool separation, complete power-model inputs, positive weights, shares summing to one, conservation of every shared burden and distinct product-specific denominators. Missing causal evidence blocks allocated product results, not honest retention of joint physical records."
    source_ids:
      - eiga-air-gases-pcf-2026
  - rule_id: validate_emissions
    applies_to: "site_survey"
    rule: "Check vents, water receiver analyses and maintenance releases. Waste sent to treatment cannot also be a direct environmental discharge. Any actual newly identified chemical/refrigerant/fuel or emission is a separately evidenced atomic flow before dataset completion; retain real biogenic CO2 even when a greenhouse-gas indicator excludes it."
    source_ids:
      - eiga-asu-environment-2025
      - jrc-cww-bref-2016
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared plant-gate cryogenic-gas foreground data, with complete joint process data and separately evidenced allocated product results"
  allowed_use: "Match the actual species, phase, purity, pressure, moisture, gate, site/time and provider unit; use separately disclosed common and product-specific burden data"
  excluded_use: "All-industrial-gas proxy; hydrogen or CO2 recovery; PSA/membrane; chemical solutions or gas blends; cylinder/customer logistics; assigning unreviewed allocation or pretending incomplete identity/foreground evidence is complete"
  required_metadata: "PCR id/version; dataset reference product and unit; complete qualifiers; operating period/configuration; linked inventory/protocol/source ids; supplier and treatment boundaries; balances; allocation model and uncertainty"
  required_quality_disclosure: "Original measured totals and unit conversions; mass/water residuals; actual coverage and missing exact identities; declared absence/presence of every conditional stream; joint versus allocated representation; plant-gate/full-LCI departure from EIGA CFP scope"
  update_trigger: "Process/utility/adsorbent change; purity/pressure/state change; new output or receiver; meter/density/provider correction; new contaminants; allocation model/period update; relevant technical source revision"
data_sources:
  - id: "eiga-asu-environment-2025"
    type: "handbook"
    reference: "EIGA, Environmental Impacts of Air Separation Units, Doc 94/25, February 2025. https://www.eiga.eu/uploads/documents/DOC094.pdf"
    used_for: "§2.1 cryogenic scope; §4.3 environmental aspects, filtration, compression, cooling/drains, maintenance and waste; Appendix 2 process topology. Actual stream survey/collection, no illustrative energy/loss defaults."
  - id: "eiga-air-gases-pcf-2026"
    type: "handbook"
    reference: "EIGA, Methodology to Establish the Product Carbon Footprint of Air Gases, Doc 167/26, July 2026. https://www.eiga.eu/uploads/documents/DOC167.pdf"
    used_for: "§4.1 (printed5/PDF8) species/state scope and mass/pressure/purity declared unit; §4.3 annual data; §§4.5–4.6 (printed6–8/PDF9–11) inventory, power allocation/conservation and PP33 limitations. PCR gate/full-LCI departures explicitly disclosed."
  - id: "linde-air-separation-2019"
    type: "handbook"
    reference: "Linde Engineering, History and technological progress of air separation, 2019. https://assets.linde.com/-/media/global/engineering/engineering/home/products-and-services/process-plants/air-separation-plants/air-separation-plants-history-and-technological-progress-2019.pdf"
    used_for: "Printed/PDF pp10–11, illustrated compression, water cooling, regenerable sieve purification, turbine refrigeration, internal product pumping and O2/N2/Ar rectification/return links; producer example only, no fixed pressure/recipe/yield."
  - id: "jrc-cww-bref-2016"
    type: "official_guidance"
    reference: "European Commission JRC, Common Waste Water and Waste Gas Treatment/Management Systems in the Chemical Sector BREF, 2016. https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf"
    used_for: "BAT2 printed543/PDF573: source process/stream register and stream characteristics; BAT3/4 printed544/PDF574: flow/parameter monitoring and matching flow/concentration evidence. Adapted to physical separation; no automatic legal limits or frequency defaults."
