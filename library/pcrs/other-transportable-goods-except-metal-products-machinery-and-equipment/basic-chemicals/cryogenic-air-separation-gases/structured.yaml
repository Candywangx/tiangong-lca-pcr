system_boundary:
  rules:
    - rule_id: boundary_applicability
      applies_to: "asu"
      rule: "Only this cryogenic O2/N2/Ar reference configuration with nonzero GOX, electrically heated regeneration, undosed cooling, no combustion/steam/chemical refrigerant or hydrogen deoxygenation, no imported finished gas, and plant-gate bulk/pipeline supply is covered. Actual equipment and supply records must establish applicability before using the inventory or allocation rules."
      source_ids:
        - eiga-asu-environment-2025
        - linde-air-separation-2019
        - eiga-air-gases-pcf-2026
    - rule_id: boundary_complete
      applies_to: "asu"
      rule: "Include inlet filtration/compression, prepurification/regeneration, cold production, air and argon rectification, real product state/pressure conditioning, storage/loading and attributable operational maintenance. Retain independent stage measurement without inventing duplicate intermediate product exchanges."
      source_ids:
        - linde-air-separation-2019
        - eiga-asu-environment-2025
    - rule_id: boundary_internal
      applies_to: "physical_ledger"
      rule: "Record reflux, crude argon, return liquid oxygen and internal nitrogen cooling/purge as internal links of equal amount at both ends; they cancel in the aggregated ASU. Exported saleable product, discarded material and environmental return are distinct."
      source_ids:
        - linde-air-separation-2019
        - eiga-air-gases-pcf-2026
    - rule_id: boundary_emissions
      applies_to: "asu"
      rule: "Establish a source/receiver stream register. Airborne contaminants entering and then returning to the same atmosphere remain in a gross physical ledger; report any relocation, capture or net new emissions separately. Do not invent a fossil or biogenic CO2 origin for ambient CO2, a removal credit, or a commodity CO2 output. Any actual fossil/biogenic emissions stay in the LCI independent of CFP exclusions."
      source_ids:
        - eiga-asu-environment-2025
        - jrc-cww-bref-2016
    - rule_id: boundary_completeness
      applies_to: "site_survey"
      rule: "Check actual SDS/BOM, drains, vents and maintenance records. Additional actual atomic flows, including pollutant species, contaminated dust, sludge or insulation replacement, must be identified, quantified and linked before declaring a dataset complete; no aggregate chemical/energy/waste selector can replace them. Evidence of absent excluded configurations is required."
      source_ids:
        - eiga-asu-environment-2025
        - jrc-cww-bref-2016
    - rule_id: boundary_whole_mass
      applies_to: "physical_ledger"
      rule: "Reconcile the whole measured ASU mass as well as O2/N2/Ar components: ambient-air and supplied-water/material boundary receipts plus opening stocks equal all accepted products, final atmospheric returns, condensate, treatment-bound bleed or direct water discharge, separately removed solid/oil wastes and closing stocks. Keep humidity, ambient CO2, captured impurities and measured minor species in the gross physical ledger without assigning fictitious product or carbon-credit identities. Do not count product impurities again outside their product mass. Every residual needs uncertainty and investigation. Service-period averaging of consumable burdens belongs in the burden ledger, never fabricated physical receipts in a year without replacement. Retain separate whole wet-air, compressed-air and final vent stream measurements; O2/N2/Ar cards project their components and do not add another whole-air mass. Wet residue carriers include H2O and impurities; component analyses and energy cannot be added as extra carrier mass. Keep compressor/intercooler and prepurification drains, phase losses and stocks separately traceable. Any supplied/returned containers crossing the gate have a separate material/tare/custody/stock register; retain each actual atomic exchange and separate its service burden from physical movement."
      source_ids:
        - linde-air-separation-2019
        - eiga-asu-environment-2025
        - jrc-cww-bref-2016
    - rule_id: boundary_gate
      applies_to: "downstream"
      rule: "Exclude post-gate distribution, cylinder filling, customer storage/use and end of life. Upstream supplies and downstream waste treatment remain model links. Do not advertise a plant-gate dataset as cradle-to-customer or a full use-phase comparison."
      source_ids:
        - eiga-air-gases-pcf-2026
boundary_abstraction:
  declared_starting_condition: "Ambient air at the inlet and externally supplied electricity, tap water and actual consumables; no imported finished-gas stock"
  starting_condition_role: "environmental_resource_and_upstream_product_inputs"
  product_classification_scope: "The O2/N2/Ar cryogenic subset of CPC 34210 only"
  recursive_input_rule: "Do not invent a self-supply gas input for internal reflux, purge or cooling. Purchased same-category gas is outside this reference configuration and requires separately evidenced upstream dataset and identity review."
  upstream_dataset_requirement: "External utility/consumable suppliers and waste treatment must match actual product, grade, geography, time, native reference unit and boundary; flow identity alone is insufficient."
  disclosure: "Disclose gate, period, meter coverage, process configuration, all six state/species outputs, rejects, stocks, emissions, waste destinations and the unallocated/allocated ledgers; disclose plant-gate departure from EIGA customer-gate CFP."
