measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_products to determine accepted net supplied GOX mass G at the stated gate, excluding tanks, piping and packaging. All inventory and collection aggregations use per 1 kg reference flow. G must be positive."
  - id: gas_volume_basis
    applies_to: "gox, gan, gar, oxygen_intake, nitrogen_intake, argon_intake, oxygen_return, nitrogen_return, argon_return"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep original gas volume, absolute pressure, temperature, water content, composition, meter reference state and compressibility. Derive density from these measured/specification fields or a traceable validated conversion. Never infer operating density from a database coefficient. Reconcile supplier normal-volume conventions before any provider link."
  - id: liquid_basis
    applies_to: "lox, lin, lar"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use calibrated mass meters or weigh tanks/vehicles with tare and heel correction. Volume-to-mass conversion requires measured temperature, liquid composition and validated density. Gas normal volume is not liquid volume. Native coefficient metadata is not a density default."
  - id: purity_basis
    applies_to: "all product outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Separate product mass from pure-species mass. Convert mole/volume purity to mass fractions using actual composition and traceable molecular masses; no generic product/pure-species substitution. Product impurities enter component balances, not extra product rows."
  - id: water_units
    applies_to: "cooling_water, compressor_condensate, cooling_bleed, evaporated_water, direct_water"
    required_property_ref:
      name: "Mass or Volume as specified by the individual row"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Keep native direct_water Volume/m3. Water mass balances use measured density and temperature to reconcile volume records. Distinguish make-up, internal recirculation, condensed intake humidity, evaporation, bleed and discharge."
  - id: electricity_units
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "This is the native electricity reference-property label, not a fuel-burning assumption. Retain meter kWh and convert with 1 kWh = 3.6 MJ. State voltage, supply mix, transformation and losses; do not apply a fuel heat basis to electrical work."
