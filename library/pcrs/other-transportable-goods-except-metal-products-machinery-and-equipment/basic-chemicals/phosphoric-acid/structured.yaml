      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Determine delivered product mass by a calibrated mass record and determine H3PO4 mass fraction by the declared product test method; normalize as delivered mass multiplied by H3PO4 mass fraction. Do not treat P2O5 percentage as H3PO4 percentage without a documented conversion."
