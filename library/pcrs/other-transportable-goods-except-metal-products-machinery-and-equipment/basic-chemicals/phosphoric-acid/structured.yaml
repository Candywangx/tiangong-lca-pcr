system_boundary:
  rules:
    - rule_id: boundary_route_gate
      applies_to: "Foreground production chain"
      rule: "Include all operated unit processes from received route feedstocks through reaction, separation, concentration or hydration, route-specific purification, emission control, residue handling, storage, and loading to the declared producer-gate product."
      source_ids:
        - us-epa-phosphoric-acid-supply-chain-2023
        - us-epa-ap42-phosphoric-acid
        - eu-jrc-lvic-aaf-bref-2007
    - rule_id: boundary_wet_process
      applies_to: "Wet-process route"
      rule: "Include phosphate-rock preparation when on site, sulfuric-acid attack, digestion/crystallisation, filtration or solid-liquid separation, weak-acid handling, concentration, gas scrubbing, phosphogypsum handling, process-water recycle, and wastewater treatment when operated."
      source_ids:
        - us-epa-ap42-phosphoric-acid
        - eu-jrc-lvic-aaf-bref-2007
    - rule_id: boundary_thermal_process
      applies_to: "Thermal/furnace route"
      rule: "Include elemental-phosphorus handling, oxidation/combustion, hydration or absorption, cooling, off-gas control, and concentration or purification needed for the declared product. Upstream elemental-phosphorus production remains linked as an upstream dataset unless performed at the reporting site."
      source_ids:
        - us-epa-phosphoric-acid-supply-chain-2023
        - us-epa-ap42-phosphoric-acid
    - rule_id: boundary_no_silent_exclusion
      applies_to: "All routes"
      rule: "Justify and disclose every excluded material or emission stream; do not omit fluoride-bearing gas, particulate, process wastewater, phosphogypsum, spent treatment material, or off-spec acid merely because it is recycled, sold, or treated."
