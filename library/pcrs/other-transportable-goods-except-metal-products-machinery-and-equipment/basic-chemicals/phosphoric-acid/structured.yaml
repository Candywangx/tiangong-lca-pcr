allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "All multifunctional plant operations"
    rule: "Avoid allocation first by metering and subdividing reaction, separation, concentration, purification, utilities, emission control, and residue handling that are directly attributable to phosphoric acid or another output."
    source_ids:
      - eu-environmental-footprint-recommendation-2021
  - rule_id: allocation_phosphogypsum_status
    applies_to: "Phosphogypsum and recovered fluosilicic acid"
    rule: "Treat a stream as a co-product only when it leaves the site as a quality-controlled product with an evidenced market or beneficial use; otherwise model it as waste with the actual treatment, storage, or disposal burden. Disclose moisture and avoided-burden assumptions."
    source_ids:
      - eu-jrc-lvic-aaf-bref-2007
  - rule_id: allocation_physical_then_other
    applies_to: "Inseparable co-products"
    rule: "If subdivision or system expansion is not practicable, use a documented, quantifiable physical relationship relevant to the functions. If no defensible physical relationship exists, use another relationship such as site- and period-specific relative economic value and justify why the preceding hierarchy was rejected."
    source_ids:
      - eu-environmental-footprint-recommendation-2021
  - rule_id: allocation_recycle_no_double_count
    applies_to: "Internal recycled acid, scrubber liquid, water, and recovered materials"
    rule: "Treat internal recycle as an internal transfer; count only net purchased inputs and net outputs crossing the foreground boundary, while retaining gross recycle measurements for mass-balance QA. Do not award a co-product credit and avoid a treatment burden for the same quantity."
    source_ids:
      - eu-jrc-lvic-aaf-bref-2007
      - eu-environmental-footprint-recommendation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_wet_materials
      process_id: "wet_acidulation_separation"
      flow_role: "phosphate rock, sulfuric acid, recycled acid"
      record_type: "weighbridge, batch record, assay, inventory"
      raw_fields: "material_id; supplier; wet_mass; dry_mass; moisture; P2O5_assay; acid_assay; recycle_mass; timestamp"
      collection_method: "calibrated scales and laboratory certificates linked to batches"
      unit: "kg; mass %"
      frequency: "each receipt and batch; monthly reconciliation"
      temporal_coverage: "full declared reporting period"
      site_scope: "all wet-process lines in declared site scope"
      aggregation_rule: "sum net purchased and internal transfers separately; normalize to measured contained H3PO4 output"
      quality_evidence: "calibration, laboratory QA/QC, supplier certificate, stock reconciliation"
    - protocol_id: cp_thermal_materials
      process_id: "thermal_oxidation_hydration"
      flow_role: "elemental phosphorus, oxidant, hydration water"
      record_type: "batch meter, mass-flow meter, tank inventory, assay"
      raw_fields: "phosphorus_mass; phosphorus_purity; air_or_oxygen_flow; water_mass; recycle_mass; timestamp"
      collection_method: "calibrated tank/flow metering and laboratory assay"
      unit: "kg; Nm3"
      frequency: "continuous or batch; monthly reconciliation"
      temporal_coverage: "full declared reporting period"
      site_scope: "all thermal-process lines in declared site scope"
      aggregation_rule: "sum by carrier and convert only with documented density or composition"
      quality_evidence: "calibration, assay QA/QC, stock and gas-flow reconciliation"
    - protocol_id: cp_water_energy
      process_id: "all_applicable_processes"
      flow_role: "fresh/recycled water and each energy carrier"
      record_type: "utility meter, invoice, steam/fuel balance"
      raw_fields: "meter_id; opening; closing; carrier; energy_content; allocation_key; recycle_water; period"
      collection_method: "calibrated submeters preferred; invoices reconciled to plant total"
      unit: "kg; m3; kWh; MJ"
      frequency: "continuous/monthly"
      temporal_coverage: "full declared reporting period"
      site_scope: "each process line and shared utility system"
      aggregation_rule: "direct submeter first; documented allocation only for inseparable shared utilities"
      quality_evidence: "calibration, invoice, meter coverage and reconciliation"
    - protocol_id: cp_product_quality
      process_id: "all_product_output_processes"
      flow_role: "acid mass, H3PO4/P2O5 assay, grade and batch"
      record_type: "tank scale/flow meter, laboratory certificate, release record"
      raw_fields: "batch_id; product_mass; sample_id; H3PO4_fraction; P2O5_fraction; conversion_method; grade; route; impurity_results; release_time"
      collection_method: "calibrated mass measurement and validated product assay"
      unit: "kg; mass %"
      frequency: "each batch or tank; production-period weighted average"
      temporal_coverage: "full declared reporting period"
      site_scope: "all released product in declared dataset"
      aggregation_rule: "calculate contained H3PO4 by batch and sum; weight route or grade mixes by contained H3PO4"
      quality_evidence: "calibration, certified method, blanks/duplicates, release approval, mass balance"
    - protocol_id: cp_residues_emissions
      process_id: "all_applicable_processes"
      flow_role: "phosphogypsum, wastewater, air emissions, spills and residues"
      record_type: "scale, flow meter, stack/water monitoring, waste manifest"
      raw_fields: "stream_id; mass_or_flow; moisture; concentration; species; gas_volume; operating_time; destination; manifest_id"
      collection_method: "direct measurement and regulatory or equivalent monitoring"
      unit: "kg; m3; mg/Nm3; mg/L"
      frequency: "continuous/periodic as required; at least reporting-period reconciliation"
      temporal_coverage: "full declared reporting period"
      site_scope: "every discharge and residue destination in site scope"
      aggregation_rule: "concentration times measured carrier flow; sum by species and destination; report below-detection handling"
      quality_evidence: "calibration, laboratory QA/QC, detection limits, permits and manifests"
    - protocol_id: cp_purification
      process_id: "purification"
      flow_role: "purification materials, recovery, residues"
      record_type: "batch sheets, inventory, assay, waste manifest"
      raw_fields: "crude_acid_mass; crude_assay; material_mass; recovered_mass; product_assay; residue_mass; destination"
      collection_method: "batch reconciliation with laboratory assays"
      unit: "kg; mass %"
      frequency: "each batch; monthly reconciliation"
      temporal_coverage: "full declared reporting period"
      site_scope: "each purification train included"
      aggregation_rule: "contained-H3PO4 balance and net material consumption over inventory period"
      quality_evidence: "assay QA/QC, stock reconciliation, waste manifests"
  calculation_rules:
    - id: calc_contained_h3po4
      applies_to: "Every acid input and output"
      rule: "contained H3PO4 mass = measured as-delivered acid mass × measured H3PO4 mass fraction"
      inputs:
        - product_mass
        - H3PO4_fraction
      output: "kg contained H3PO4"
      source_ids: []
    - id: calc_p2o5_conversion
      applies_to: "Records reported as P2O5"
      rule: "Convert P2O5 assay to H3PO4 only with a documented stoichiometric factor and preserve both reported and converted values; prohibit treating the percentages as interchangeable"
      inputs:
        - P2O5_fraction
        - conversion_method
      output: "H3PO4_fraction with audit field"
      source_ids:
        - us-epa-ap42-phosphoric-acid
    - id: calc_reference_normalization
      applies_to: "All foreground rows"
      rule: "normalized amount = reporting-period net amount / reporting-period contained H3PO4 in qualified producer-gate output"
      inputs:
        - net_flow_amount
        - qualified_product_mass
        - H3PO4_fraction
      output: "amount per 1 kg contained H3PO4"
      source_ids: []
    - id: calc_route_mix
      applies_to: "Production-mix datasets"
      rule: "aggregate route inventories only after each route is normalized; route weight = route contained-H3PO4 output / total contained-H3PO4 output"
      inputs:
        - "route outputs and normalized inventories"
      output: "disclosed contained-H3PO4-weighted production mix"
      source_ids:
        - eu-environmental-footprint-recommendation-2021
    - id: calc_emission_mass
      applies_to: "Stack and wastewater species"
      rule: "emitted mass = measured concentration × measured carrier-gas or water volume, with temperature, pressure, moisture, unit conversion, non-detect treatment, and operating time documented"
      inputs:
        - concentration
        - carrier_flow
        - conditions
        - operating_time
      output: "kg species per reporting period"
      source_ids:
        - us-epa-ap42-phosphoric-acid
        - eu-jrc-lvic-aaf-bref-2007
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Product flow identity, CPC context, route, grade, physical state, H3PO4 assay basis, geography, and producer-gate condition must be complete and mutually consistent."
      evidence: "Tiangong UUID confirmation, product specification, batch release record"
    - id: dq_mass_balance
      applies_to: "Each route and reporting period"
      requirement: "Reconcile phosphorus-bearing inputs, contained-H3PO4 product and intermediates, recycle, phosphogypsum/residues, wastewater, emissions, inventory change, and documented loss; explain residuals."
      evidence: "signed material balance and assay records"
    - id: dq_temporal
      applies_to: "Foreground records"
      requirement: "Use one representative continuous 12-month period where available, or disclose shorter campaign coverage, shutdowns, start-ups, abnormal operation, and averaging method."
      evidence: "meter coverage, production calendar, batch list"
    - id: dq_representativeness
      applies_to: "Foreground and upstream datasets"
      requirement: "Assess technological, geographical, time representativeness, and precision; higher-quality site-specific data are required for major material, energy, product, residue, and direct-emission rows."
      evidence: "data-quality assessment and source metadata; eu-environmental-footprint-recommendation-2021"
    - id: dq_completeness
      applies_to: "All routes"
      requirement: "Cover all operated process-map stages and every material discharge, including recycled, marketed, stored, or treated streams; quantify data coverage and justify exclusions."
      evidence: "process map, meter register, permits, waste manifests, exclusion log"
    - id: dq_uncertainty
      applies_to: "Reasoned estimates and non-detects"
      requirement: "Flag every reasoned_estimate as provisional and replace it with foreground or reviewed external evidence before publication-critical use; state detection limits and non-detect substitution."
      evidence: "uncertainty register and review record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail if the product flow UUID, Mass property UUID, Units of mass UUID, CPC 34232 context, or reference unit kg is missing or inconsistent."
    source_ids: []
  - rule_id: validate_required_qualifiers
    applies_to: "Dataset metadata"
    rule: "Fail if delivered H3PO4 mass fraction, analytical basis, product grade, route, purification status, physical state, producer-gate condition, geography, or reporting period is missing."
    source_ids:
      - us-epa-phosphoric-acid-supply-chain-2023
  - rule_id: validate_route_structure
    applies_to: "Process map and inventory"
    rule: "Require either the complete applicable wet-process chain or thermal-process chain, plus applicable purification and required storage/loading; fail a production mix that does not disclose route weights."
    source_ids:
      - us-epa-ap42-phosphoric-acid
      - eu-jrc-lvic-aaf-bref-2007
  - rule_id: validate_h3po4_balance
    applies_to: "Product normalization"
    rule: "Recalculate contained H3PO4 from product mass and assay and require agreement with the 1 kg reference basis within the declared measurement uncertainty; fail an undocumented P2O5-to-H3PO4 conversion."
    source_ids: []
  - rule_id: validate_wet_streams
    applies_to: "Wet process"
    rule: "Require phosphate rock, sulfuric acid, process water, weak acid, phosphogypsum disposition, fluoride-bearing air emissions, wastewater, energy, and concentration utilities when applicable; any omission requires a documented zero or exclusion rationale."
    source_ids:
      - us-epa-ap42-phosphoric-acid
      - eu-jrc-lvic-aaf-bref-2007
  - rule_id: validate_thermal_streams
    applies_to: "Thermal process"
    rule: "Require elemental phosphorus, oxidant, hydration water, utilities, product assay, particulate/phosphorus-bearing air emissions, and net wastewater/residues; any omission requires a documented zero or exclusion rationale."
    source_ids:
      - us-epa-ap42-phosphoric-acid
      - us-epa-phosphoric-acid-supply-chain-2023
  - rule_id: validate_allocation
    applies_to: "Co-products and wastes"
    rule: "Fail if phosphogypsum, recovered fluosilicic acid, or another output is credited as a co-product without market/use evidence and a disclosed allocation hierarchy, or if internal recycle is double counted."
    source_ids:
      - eu-jrc-lvic-aaf-bref-2007
      - eu-environmental-footprint-recommendation-2021
  - rule_id: validate_source_and_estimate_status
    applies_to: "Ranges and rules"
    rule: "Require source ids for external ranges and method rules; require provisional labelling and an unresolved evidence note for every reasoned_estimate."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground phosphoric-acid production dataset normalized to 1 kg contained H3PO4 at producer gate"
  downstream_use: "secondary_dataset; background_dataset after review of route, concentration, geography, allocation, and data quality"
  allowed_use: "Route- and grade-matched LCA models, chemical and fertiliser supply chains, and disclosed production mixes whose required qualifiers match the dataset"
  excluded_use: "Silent substitution across wet and thermal routes, concentrations, grades, geographies, or purification states; weak-acid or slurry intermediates treated as finished acid; downstream use or distribution claims outside the boundary"
  required_metadata: "canonical PCR id; product flow UUID; CPC context; producer; geography; reporting period; route and route weights; delivered H3PO4 and P2O5 assay with conversion method; grade/specification; physical state; included purification; technology; allocation; residue destinations; upstream dataset identities"
  required_quality_disclosure: "meter and laboratory coverage; mass-balance residual; technological/geographical/temporal representativeness and precision; exclusions; non-detect handling; source versions; provisional reasoned_estimate rows; uncertainty and review status"
  update_trigger: "Change in route, concentration or grade, purification train, major supplier or energy mix, emission control, phosphogypsum disposition, allocation method, geography, reference-flow identity, or evidence that materially changes an important range or rule"
