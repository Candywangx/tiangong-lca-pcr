allocation_rules:
  - rule_id: a_prime
    applies_to: "as_production"
    rule: "The declared route makes ammonium sulphate as its prime product. Charge measured dedicated reaction, separation, drying and controls to accepted output; fine/coarse size grades of the same chemical are not invented coproduct species. Subdivide metered grade-specific finishing first and disclose actual production-weighted aggregation for a grade mixture."
    source_ids:
      - epa-as-ap42
  - rule_id: a_physical
    applies_to: "as_production"
    rule: "Keep actual recovered salt, liquid returns, wastes and emissions at their full physical quantities. Waste status requires composition and receiver evidence. No automatic substitution credit or negative waste burden; returned condensate/cooling water is not a saleable coproduct merely because it is listed as a product interface."
    source_ids:
      - epa-as-ap42
      - eu-cww
  - rule_id: a_shared
    applies_to: "as_production"
    rule: "Assign shared utilities using measured stage services and matched meter boundaries before aggregation. Document driver, totals and uncertainty; do not split physical quantities by an environmental allocation share. Caprolactam/coke or other recovered-product allocation requires a separate parent-production method and is outside this prime-product route."
    source_ids:
      - eu-lvic-aaf
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "as_production"
      flow_role: "reference_product"
      record_type: "acceptance_stock_assay"
      raw_fields: "batch/SKU; net product mass P; tare; salt assay wet/dry basis; free moisture/free acid; impurities; N/S; size; rejected/reworked product; traceable returns/reacceptance; opening/closing stocks and WIP with carried burdens"
      collection_method: "Calibrated net weighing and representative validated matrix-specific assay; reconcile production, dispatch and accepted-stock movement without recounting internal rework. Nutrient label alone is not salt assay."
      unit: "kg; mass fraction"
      frequency: "each batch/continuous meters; representative samples and events"
      temporal_coverage: "same represented period"
      site_scope: "declared compatible site/grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; laboratory QA/recovery; acceptance/stock reconciliation"
    - protocol_id: cp_inputs
      process_id: "as_production"
      flow_role: "ammonia_feed, acid_feed, external_seed, lubricant"
      record_type: "receipt_dosing_stock"
      raw_fields: "row_id; supplier/SKU/CAS; state/route; gross mass; assay; carrier water; additives; intake/return; stocks; batch dosing"
      collection_method: "Use calibrated receipts/dosing and stock changes for each atomic material. Retain both gross supplied mass and component fractions; require supplier/background mass-basis compatibility."
      unit: "kg; mass fraction"
      frequency: "each batch/continuous meters; representative samples and events"
      temporal_coverage: "same represented period"
      site_scope: "declared compatible site/grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier originals; scale/doser calibration; route/grade certificates"
    - protocol_id: cp_energy
      process_id: "as_production"
      flow_role: "power"
      record_type: "electricity_meter"
      raw_fields: "inlet kWh; country; voltage; provider; stage kWh; shared loads; idle/startstop; loss boundary"
      collection_method: "Read AC inlet and stage meters; allocate only shared burdens using observed service drivers; reconcile to inlet. Convert actual kWh to MJ."
      unit: "kWh; MJ"
      frequency: "each batch/continuous meters; representative samples and events"
      temporal_coverage: "same represented period"
      site_scope: "declared compatible site/grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; provider boundary; stage reconciliation"
    - protocol_id: cp_steam
      process_id: "as_production"
      flow_role: "steam, condensate"
      record_type: "steam_condensate_meter"
      raw_fields: "inlet/outlet mass; pressure gauge/absolute; T; steam quality; enthalpy method; recovered condensate purity/receiver; vacuum/dryer stage meters; heat losses"
      collection_method: "Meter incoming steam and outgoing condensate separately. Use validated pressure-temperature-quality enthalpies and measured return/loss conditions; retain physical water balance and separately inspect delivered heat against provider definition. No assumed steam pressure or boiler efficiency."
      unit: "kg; pressure; temperature; kJ/kg; MJ"
      frequency: "each batch/continuous meters; representative samples and events"
      temporal_coverage: "same represented period"
      site_scope: "declared compatible site/grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "flowmeter calibration; enthalpy/provider originals; interface and uncertainty"
    - protocol_id: cp_water
      process_id: "as_production"
      flow_role: "process_water, cooling_water, cooling_return, water_vapor, liquid_water"
      record_type: "water_phase_balance"
      raw_fields: "use-specific inlet; carrier water; actual density/T; two ends of internal loops; condensate; product moisture; wet waste; freshwater outlet; humidity; stocks"
      collection_method: "Meter liquid flows and actual density; reconcile carrier/free water, incoming steam, returns, net vapour and wet waste. Remove incoming humidity from vapour attribution; identify actual receiving water and temperature. Unknown phase/density remains incomplete."
      unit: "kg; m3; temperature; humidity"
      frequency: "each batch/continuous meters; representative samples and events"
      temporal_coverage: "same represented period"
      site_scope: "declared compatible site/grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; density conditions; phase closure and uncertainty"
    - protocol_id: cp_waste
      process_id: "as_production"
      flow_role: "mother_purge, scrubber_purge, cooling_blowdown, rejected_dust, waste_oil, washdown, rejected_crystals"
      record_type: "waste_transfer"
      raw_fields: "row_id; source; gross mass; water/dry solids; salt/acid/contaminants; recovered fraction; receiver/treatment; acceptance; shipment"
      collection_method: "Weigh/sample each segregated stream at transfer; document composition, actual recipient and downstream treatment. Distinguish recovered internal salt, waste transfer and environmental releases; never treat all discarded material as saleable product."
      unit: "kg; mass fraction"
      frequency: "each batch/continuous meters; representative samples and events"
      temporal_coverage: "same represented period"
      site_scope: "declared compatible site/grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/sample QA; manifests; receiver acceptance and provider linkage"
    - protocol_id: cp_air
      process_id: "as_production"
      flow_role: "nh3_air, acid_air, pm25_air, pm10_air, pmgt10_air"
      record_type: "outlet_monitoring"
      raw_fields: "outlet/source; gas volume flow rate F or already integrated gas volume V; matched intervals and T/P wet/dry basis; species mass concentrations; aerosol sizes; filterable/condensable basis; operating hours; bypass/upset; inlet blanks/humidity"
      collection_method: "Measure outlet flow and species/size-resolved concentrations after abatement using validated representative source sampling; integrate load over matched operation/events. Historical AP42 factors describe configurations but supply no default here. Avoid overlap between acid aerosol and salt PM."
      unit: "kg; gas volume; concentration; time"
      frequency: "each batch/continuous meters; representative samples and events"
      temporal_coverage: "same represented period"
      site_scope: "declared compatible site/grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling/calibration; limits of detection; size/species definitions; uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each non-reference row, divide its raw stock-reconciled matched-pool amount X_i by accepted net product mass P exactly once; X_i is not already per kg. Reconcile net dispatches, accepted-stock changes, returns/reacceptance and actual accepted production by lot so P is credited once, with the matched stock/WIP burdens defined above. Keep reference_product exactly 1 kg and numerator units unchanged. A non-positive complete-pool P gives no unit result. Electricity conversion and air-load integration prepare raw amounts for this same single normalization. All protocols retain raw unallocated totals for one complete matched site, route, grade, supplied state and representative production period, including attributable startup, shutdown, idle, upset, failed and zero-accepted-output operations, cleaning and rework. Reconcile raw-material, work-in-progress, rework and finished-product opening/closing stocks with their carried burdens; do not pair old-stock dispatches with current processing alone or lose failed-operation burdens. Establish unique positive accepted net product mass P from traceable production, returns, reacceptance, dispatch and stock records; internal rework is not new product output. Apply normalize_period exactly once to each reconciled raw exchange total. Inventory amount rules and protocol aggregation columns declare that final per 1 kg reference-flow basis, not additional divisions. If the complete pool has no positive P, retain totals for a justified matched wider period or report the unit result unavailable. This PCR requires future measured SKU/quantities; it supplies no real site dataset. Keep physical quantities, component balances and environmental attribution in separate ledgers."
      inputs:
        - X_i
        - P
        - cp_product
      output: "amount per 1 kg reference flow"
      source_ids:
        - eu-lvic-aaf
    - id: component_ledger
      applies_to: "ammonia_feed, acid_feed, external_seed, reference_product"
      rule: "Component mass = measured gross mass × measured component fraction on the same basis. For dry-basis assays first remove separately measured free water. Compare actual molar N/S inputs, accepted salt, purges, captured/recycled salt and emissions to 2NH3 + H2SO4 → (NH4)2SO4. The reaction produces no stoichiometric water. Carrier water, free acid, impurities, external seed and stock changes explain departures; never force a theoretical yield."
      inputs:
        - "gross mass"
        - assay
        - "wet/dry basis"
        - cp_inputs
        - cp_product
        - cp_waste
        - cp_air
      output: "physical component/N/S ledger"
      source_ids:
        - epa-as-ap42
        - eu-lvic-aaf
    - id: electricity_conversion
      applies_to: "power"
      rule: "Raw Energy_MJ = measured electricity_kWh × 3.6; reconcile and aggregate compatible meter boundaries before normalize_period. Do not divide by P in this conversion and again in normalize_period."
      inputs:
        - electricity_kWh
        - cp_energy
      output: "raw MJ before normalize_period"
      source_ids:
        - eu-lvic-aaf
    - id: steam_interface
      applies_to: "steam, condensate"
      rule: "Keep mass-based inventory quantities separately. Delivered heat is the measured inlet enthalpy flow minus outgoing condensate/other physical enthalpy flows and storage change across the declared interface, converted from kJ to MJ. Use pressure, temperature and quality from cp_steam and the actual provider definition; disclose losses. A heat diagnosis neither changes kg to MJ nor creates an avoided-heat credit."
      inputs:
        - "steam mass/conditions"
        - returns
        - cp_steam
      output: "mass inventory and independent heat diagnosis"
      source_ids:
        - eu-lvic-aaf
    - id: air_load
      applies_to: "nh3_air, acid_air, pm25_air, pm10_air, pmgt10_air"
      rule: "Obtain raw species mass from the time integral of matched species mass concentration C_i(t) and gas volume flow rate F(t), with explicit conversion to kg. For already integrated interval volume V_j, sum the compatible flow-weighted concentration C_i,j times V_j; do not multiply V_j by time again. Concentration times volume flow rate times interval duration is valid only for a justified constant or compatible interval-average basis. Preserve temperature, pressure, wet/dry state, blanks and event coverage, then apply normalize_period once. Size bins are PM≤2.5, PM2.5–10 and PM>10, using compatible simultaneous measurement bases; do not add cumulative PM10/total PM again."
      inputs:
        - "outlet concentration"
        - "defined gas rate or integrated volume"
        - "matched interval"
        - cp_air
      output: "raw kg before normalize_period"
      source_ids:
        - epa-as-ap42
        - eu-cww
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify every adopted UUID against species/CAS, state, hard route and geography; unresolved rows stay specific with no invented UUID. Keep physical identity distinct from provider/reference-quantity compatibility."
      evidence: "cp_product; cp_inputs; cp_energy; cp_steam; cp_water; cp_waste; cp_air; eu-lvic-aaf; eu-cww"
    - id: dq_balance
      applies_to: "all inventory rows"
      requirement: "Reconcile matched-period gross mass, phase water and N/S balances including stocks, actual assay, carrier water, purges, emissions and internal-loop equality. Retain measurement uncertainty and diagnose rather than force closure."
      evidence: "cp_product; cp_inputs; cp_energy; cp_steam; cp_water; cp_waste; cp_air; eu-lvic-aaf; eu-cww"
    - id: dq_evidence
      applies_to: "all inventory rows"
      requirement: "AP42 is historical US process/configuration evidence, LVIC-AAF supplies common integrated-site rules and CWW supplies stream/monitoring rules. No single-plant or supplier label becomes a general recipe, yield, range or emission factor."
      evidence: "cp_product; cp_inputs; cp_energy; cp_steam; cp_water; cp_waste; cp_air; eu-lvic-aaf; eu-cww"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Missing UUIDs, supplier bases, measurements and representative sampling remain explicit and prevent complete data-package claims. Report zero, nondetect, not-applicable and unmeasured separately; extend actual substances individually before downstream use."
      evidence: "cp_product; cp_inputs; cp_energy; cp_steam; cp_water; cp_waste; cp_air; eu-lvic-aaf; eu-cww"
validation_rules:
  - rule_id: v_reference
    applies_to: "as_production"
    rule: "Require exactly one external reference_product output, 1 kg accepted net bulk crystal; reject gross container, nutrient or dry-pure-salt denominator substitution. Require all qualifiers and the selected synthetic route."
    source_ids:
      - epa-as-ap42
      - eu-lvic-aaf
      - eu-cww
  - rule_id: v_inventory
    applies_to: "as_production"
    rule: "Every row is one atomic exchange with compatible property/unit and matched-period per-1-kg aggregation. All actual exchanges and service providers must be present; no unresolved identity/basis/measurement can be called a complete linked dataset."
    source_ids:
      - epa-as-ap42
      - eu-lvic-aaf
      - eu-cww
  - rule_id: v_physical
    applies_to: "as_production"
    rule: "Check internal-link equality, stock reconciliation and component/N/S/water closure with uncertainty, before environmental burden attribution. Preserve actual physical outputs and recovered quantities regardless of attribution shares."
    source_ids:
      - epa-as-ap42
      - eu-lvic-aaf
      - eu-cww
  - rule_id: v_emissions
    applies_to: "as_production"
    rule: "Require actual post-control species/medium and nonoverlapping particle-size quantities. Acid mist and salt PM require separation or explicit overlap reconciliation. Do not infer caprolactam VOC or fuel-boiler emissions for this route; actual extensions require source evidence and their own species rows."
    source_ids:
      - epa-as-ap42
      - eu-lvic-aaf
      - eu-cww
  - rule_id: v_provider
    applies_to: "as_production"
    rule: "Verify ammonia state, acid concentration, electricity country/voltage, steam pressure/quality/enthalpy/provider mass basis and condensate/cooling receiver definitions. A valid Mass or MJ property is insufficient to establish background compatibility."
    source_ids:
      - epa-as-ap42
      - eu-lvic-aaf
      - eu-cww
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset only after actual foreground data production and separate review"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared synthetic bulk-crystal supply with compatible providers and disclosed quality"
  excluded_use: "Recovered/byproduct manufacture; liquid/mixed/coated/compacted products; field application impacts; completed dataset claims with unresolved gaps"
  required_metadata: "site/time/route/grade; reference/product mass basis; assay/moisture; providers; boundary, stocks, recycles, treatments and attribution decisions"
  required_quality_disclosure: "measurement/sampling uncertainty; provider and identity gaps; coverage/exclusions; evidence applicability; scientific review state"
  update_trigger: "Changed route/grade/assay, supplier/basis, utility interface, abatement, treatment or new material evidence"
data_sources:
  - id: "epa-as-ap42"
    type: "official_guidance"
    reference: "US EPA AP-42 §8.4 Ammonium Sulfate, 7/93 (reformatted 1/95), pp.8.4-1–8.4-3, Fig.8.4-1; https://www.epa.gov/sites/default/files/2020-09/documents/8.4_ammonium_sulfate.pdf; retrieved 2026-10-13"
    used_for: "Synthetic route, crystal separation, steam-heated drying, salt recovery and particulate controls; historical factors/moisture/coating quantities not adopted"
  - id: "eu-lvic-aaf"
    type: "official_guidance"
    reference: "European Commission LVIC-AAF BREF, August 2007, §§1.3, 1.4.3, 1.5.1, printed pp.12–13,16,32–33; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-03/LVIC-AAF.pdf?download=1; retrieved 2026-10-13"
    used_for: "Common integrated-site energy/mass/steam/water balances and heat interfaces only; no AS-specific production BAT or quantity default"
  - id: "eu-cww"
    type: "official_guidance"
    reference: "European Commission CWW BREF, 2016, Chapter 4 BAT2–4 and water/treatment hierarchy, printed pp.543–548; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/CWW_Bref_2016_published.pdf; retrieved 2026-10-13"
    used_for: "Chemical-sector stream characterisation, monitoring and treatment interfaces; preserve actual matrix and receiving conditions"
  - id: "un-cpc3-as"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, 30 June 2025, subclass 34612; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/34612; retrieved 2026-10-13"
    used_for: "Classification identity/ancestry only; selected synthetic route is narrower"
  - id: "yara-as-product"
    type: "handbook"
    reference: "Yara United States Ammonium Sulfate product page, APF producer identified; https://www.yara.us/crop-nutrition/fertilizer-products/other-fertilizers/ammonium-sulfate/; retrieved 2026-10-13"
    used_for: "Market grades and one supplier nutrient label only; no synthetic-route proof or composition default"
