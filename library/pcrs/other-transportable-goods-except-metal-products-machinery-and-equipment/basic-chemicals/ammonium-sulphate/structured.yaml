system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "as_production"
      rule: "Include receipt/vaporisation, reaction/crystallisation, crystal separation, steam-heated drying, screening, enclosed bulk storage, vacuum/cooling and exhaust control with actual maintenance/waste handling. Keep stage meters even when modelled as one unit."
