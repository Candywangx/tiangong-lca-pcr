      applies_to: "as_production"
      rule: "Contaminated mother/scrubber/cooling purges and washdown go to characterised external treatment under this scope; preserve downstream treatment burdens. They are waste transfers, not site freshwater releases. Actual direct process-effluent treatment/discharge requires separately evidenced complete treatment/species exchanges."
