      applies_to: "as_production"
      rule: "Include actual startup/shutdown/idle/upset loads and residual releases after controls. Historical negligible emissions, closed loops and a found UUID do not prove zero. Actual packaging, coating, conditioning chemicals, filter/rag wastes, capital treatment and transport/treatment services must be disclosed; extensions need individual measured rows and evidence."
