allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "gate"
    rule: "Prefer measured direct attribution and subdivision; assess subdivision/system expansion before partitioning shared services by an empirically demonstrated physical relation. Specific energy/transport rules prevail. This PCR presumes neither co-products nor shares; cp_site records actual drivers and coverage. Activity is not an automatic allocation key."
    source_ids:
      - ef-allocation-2021
  - rule_id: allocation_physical_ledger
    applies_to: "gate"
    rule: "Retain unallocated physical mass, water and radionuclide ledgers separately from allocated burdens and provider allocation. Do not multiply measured product/waste output by burden shares. Internal links have equal quantities at both ends; returns, captured powder and waste shipment are not automatic co-products or avoided-burden credits."
    source_ids:
      - ef-allocation-2021
