      flow_role: "scope and attribution"
      record_type: "site ledger"
      raw_fields: "actual route/boundary map; internal paired links; first-acceptance Q; exchange-specific shared drivers; raw/WIP/finished opening/closing stock; inherited and current burden vectors; prior-cohort service; upstream coverage; no-flow evidence"
      collection_method: "Reconcile physical-before-allocation and burden-after-allocation ledgers; review actual causal drivers and provider coverage"
      unit: "kg; m3; MJ; kBq"
      frequency: "each period"
      temporal_coverage: "same reporting period"
