  - id: net_product
    applies_to: "reference_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is independently measured net whole-solid-product mass first accepted at this fixed gate during the reporting period: new dispatch plus newly accepted closing finished stock, each counted once. Exclude opening already accepted finished stock, returns, retests, relabeling and internal transfers from new Q. cp_reference_product records Q and unique first-acceptance lot/event links. Every card uses per 1 kg reference flow."
  - id: compound_element_activity
    applies_to: "reference_product, feed_tho2, waste_tho2, th232_air, th232_water"
    required_property_ref:
      name: "Mass; Radioactivity"
      uuid: ""
    required_unit: "kg; kBq"
    rule: "Whole-product mass includes measured impurities and moisture; free/structural water and assay denominator remain separate. A supply solution is not solid product; separate solute/carrier water and require distinct applicability review. Elemental thorium mass requires measured elemental assay with an explicit denominator. Product kg is not elemental kg or activity. Individual radionuclide activity requires sample fraction, date, unit, uncertainty and detection capability; do not assume daughter equilibrium. Divide Bq by 1000 for kBq."
  - id: energy_water
    applies_to: "electricity, clean_water, waste_water"
