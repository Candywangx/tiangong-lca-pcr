      quality_evidence: "original balances, provider definitions, actual time/quantities and monitoring scope"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Keep complete-period raw boundary exchanges, including actual failures, rejects, rework, standby, cleaning and zero-output intervals. Apply demonstrated exchange-specific shared drivers to burdens after conserving physical quantities. Reconcile raw/WIP/finished stocks and inherited vectors under acceptance_stock_vectors, then divide each burden assigned to the new accepted cohort by its positive Q once. The reference product is 1 kg. Collection and card division denote this same final reporting operation, not a second division."
      inputs:
        - "period records"
        - Q
        - cp_site
      output: "normalized exchange"
      source_ids:
        - merck-thoria-89170
        - ef-allocation-2021
        - jrc-ilcd-lci-2010
    - id: activity_reporting
      applies_to: "th232_air, th232_water"
      rule: "Actual radionuclide released activity [kBq] divided by Q [kg]; convert Bq by division by 1000 and preserve date/sample basis and uncertainty. Individual isotope and total activity cannot double-characterize the same radiological burden."
      inputs:
        - activity
        - "matched discharge quantity"
        - Q
      output: "kBq per kg reference flow"
      source_ids:
        - epa-marlap19-2004
    - id: acceptance_stock_vectors
      applies_to: "all inventory rows"
      rule: "Q equals independently measured newly accepted dispatch plus newly accepted closing finished stock; count each first-acceptance event once. Preserve separate opening and closing raw-material, work-in-progress and finished-product stocks with historical per-exchange burden vectors and original gate/product/route/state/cohort links. For each exchange e, reconcile opening inherited burden plus current attributable complete-period burden equals burden assigned to newly accepted output plus closing carried burden plus separately disclosed other-output or prior-cohort service burden. This is a burden identity, not a physical-output formula. Old finished-stock dispatch, returns, retests and internal transfers do not enlarge Q or reset inherited burden. Later storage/dispatch service for previously accepted output is attached to that original cohort and its original accepted Q; never divide it by new Q. Missing inherited vectors or unresolved cohort attribution keeps the normalized result incomplete. If Q is zero or not evidenced, retain raw totals and all stocks/vectors, hold unit results and do not borrow another denominator."
      inputs:
        - cp_reference_product
        - cp_site
        - "complete exchange totals and stock vectors"
      output: "once-only accepted cohort and conserved burden accounts"
      source_ids:
        - jrc-ilcd-lci-2010
    - id: species_balance
      applies_to: "feed_tho2, reference_product, waste_tho2, waste_water, th232_air, th232_water"
      rule: "Reconcile total material, water and elemental-thorium balances separately using measured composition and uncertainty. Do not treat thorium mass, compound mass and radionuclide activity as interchangeable. Any actual transformation outside the declared unchanged-species gate requires a separately reviewed production boundary with its actual species formation G_X and consumption C_X, supported by reaction stoichiometry and measured reaction extent; an element total or environmental allocation factor does not determine G or C. No such transformation is prescribed or assigned default quantities here."
      inputs:
        - "independent masses"
        - "measured assays"
        - cp_site
        - cp_th232_air
        - cp_th232_water
      output: "separate physical and activity reconciliations"
      source_ids:
        - epa-marlap19-2004
        - jrc-ilcd-lci-2010
    - id: acceptance_event_bridge
      applies_to: "all inventory rows"
      rule: "Lock Q to unique independently measured first-acceptance events. Use the two-term dispatch/closing-stock bridge only when L_new is zero; otherwise reconcile disjoint D_new, F_new_close and actual post-acceptance net exits L_new on the original acceptance basis. Retain original event Q for later losses/services and prevent internal/return/rework throughput duplication. Do not add Q as an extra external output. Unresolved event/stock evidence blocks complete normalization."
      inputs:
        - "original acceptance events"
        - "net parcel-state bridge"
        - "original cohort quantities"
      output: "auditable positive event Q and separate physical stock bridge"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "Species, CAS, composition, name, actual route and supply state agree; verify support references against actual property/unit chains. Identity does not establish background-basis compatibility."
      evidence: "merchant/lot originals, measured composition, provider definition and raw database metadata"
    - id: measurement_quality
      applies_to: "gate"
      requirement: "Q is independent and positive; preserve whole-compound mass, elemental quantities, isotope activity, container and moisture accounts separately. No universal purity, yield, consumption, clean-up efficiency, emission, activity or dose."
      evidence: "cp_reference_product; cp_site; epa-marlap19-2004"
    - id: coverage_quality
      applies_to: "gate"
      requirement: "Period/site/storage duration match all relevant receipts, dispatches, stocks and monitoring. Distinguish unmeasured, below-detection, absent flows and zero. Add separate rows for other actual isotopes, particulate fractions, cleaners and container wastes; do not add nested PM bins twice or remove actual biogenic CO2 for a GHG reporting convention."
      evidence: "cp_site; actual stream and monitoring register"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Confirm the native whole-product reference chain and exact solid-ThO2 qualifiers together; missing chemical identity cannot be replaced by another oxide, ore, element or radioactive elementary flow. A broader native identity cannot establish the required chemical or provider evidence by itself."
    source_ids:
      - merck-thoria-89170
  - rule_id: validate_balance
    applies_to: "gate"
    rule: "Both renderings use 1 kg; every row and collection aggregation uses the same Q; exactly one final product output. Reconcile physical mass/water/element ledgers within measurement uncertainty and disclose residuals. Measure feed, product, waste, environmental outputs and stocks separately, never derive product as feed minus assumed waste."
    source_ids:
      - epa-marlap19-2004
  - rule_id: validate_release
    applies_to: "th232_air, th232_water"
    rule: "Match isotope and compartment/subcompartment/time; use Radioactivity/kBq rather than Mass/kg. Wastewater sent to treatment is not an additional site freshwater release. Separate treatment release and retention; cross-identify PM mass and radionuclide activity ledgers to avoid duplicate radiological characterization. Missing/unknown measurements remain unresolved."
    source_ids:
      - epa-marlap19-2004
  - rule_id: validate_cohort
    applies_to: "gate"
    rule: "Check unique first-acceptance Q against independent raw acceptance records and both new dispatch and newly accepted closing finished stock. Require separate raw/WIP/finished physical stocks and conserved inherited/current per-exchange burden vectors; old stock dispatch and returns/retests cannot enlarge Q. Keep later service with original accepted cohort Q. Q zero/missing, missing raw data or missing inherited vectors blocks unit results while preserving raw totals and reviewable gaps."
    source_ids:
      - jrc-ilcd-lci-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified supplied-gate data only after independent complete dataset acceptance; methodology authorship does not establish scientific review or dataset qualification"
  allowed_use: "Bounded civilian solid-ThO2 supply LCA; disclose gate increment separately from results including upstream coverage"
  excluded_use: "Whole-CPC proxy; other chemical/physical states; purification/separation/enrichment/fuel or weapons manufacturing; dose/safety/compliance determinations; waste-disposal service as product supply"
  required_metadata: "Manufactured single-species solid ThO2 plus CAS 1314-20-1; actual SKU/lot plus supplier and origin; independently measured first-acceptance net whole-product Q plus cohort links; composition plus assay denominator plus free moisture and structural water; civilian intended use; original container/packaging plus tare; fixed receiving and manufacturer factory delivery gates plus first-acceptance criterion; native production mix at plant plus finished manufactured state; upstream manufacture/transport/packaging coverage; reporting period plus storage duration; electricity supply plus voltage; actual cleaning/incident scope; residue/waste receivers; radionuclide species plus activity unit plus sample basis plus reference date plus uncertainty and detection capability; no default purity or yield or recipe or energy intensity or activity"
  required_quality_disclosure: "identity gaps; upstream/site coverage; uncertainty/detection capability; attribution drivers; background property/quantity bases; physical and burden-ledger completeness"
  update_trigger: "Changed species/supply state/actual route, provider or background definition; additional actual streams/monitoring; reference-UUID resolution; source/boundary/attribution revision"
