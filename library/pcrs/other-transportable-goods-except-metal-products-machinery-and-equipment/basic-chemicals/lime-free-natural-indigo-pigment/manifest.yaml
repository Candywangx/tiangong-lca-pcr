  identity_assessment: "Full state-100 Indigo product record describes natural Indigofera indigo and indican hydrolysis/air oxidation; it imposes no purity, formulated carrier, physical-state or geographic restriction. CAS identifies the main colourant, not a pure-equivalent denominator. Selection is conditional on the actual washed, lime-free, carrier-free whole dry natural pigment specification. Crude broth, mineral-diluted preparations and synthetic-route dye are excluded."
  native_metadata_caveat: "The native Chinese generalComment mistranslates indican/indoxyl; official Chinese baseName 靛青 is retained while chemistry follows the English record and primary source. This is disclosed, not silently repaired in the database. The selected Paper bag record names the complete bag as 纸袋 in Chinese; inbound and outbound packaging must retain the same actual whole-bag state, compatible material and supplier boundary, not raw paper. Polyethylene-film candidate with contradictory luggage classification was not adopted; its UUID remains unresolved."
