process_map:
  - id: pet_resin
    name: "PTA esterification, PET melt polycondensation, recovery and amorphous chip finishing"
    inclusion: "required"
    inclusion_condition: "This method covers one nominal PET homopolyester grade made on site from virgin purified terephthalic acid (PTA) and monoethylene glycol (MEG): Sb2O3-fed polycondensation catalyst, cobalt acetate tetrahydrate colour correction, and triethylphosphonoacetate (TEPA) stabilization. The route is batch/cyclic direct esterification, vacuum melt polycondensation, glycol condensation/distillation and internal return, melt filtration, water quenching, strand cutting and mechanical surface-water removal. The terminal reference is newly accepted, bulk-supplied amorphous chips, released to a declared melt-stage customer specification; it is not a claim of bottle-grade or food-contact conformity. A plant that only produces these chips as internal feed to SSP has no supplied reference output at this gate."
    role: "integrated foreground manufacturing process"
    quantitative_reference: "pet_chips"
