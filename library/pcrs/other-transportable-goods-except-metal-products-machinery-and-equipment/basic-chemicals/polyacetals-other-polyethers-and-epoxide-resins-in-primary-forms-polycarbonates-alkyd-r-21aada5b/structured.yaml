allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "pet_resin"
    rule: "Retain independently metered operations and internal recovery once. Internal glycol reflux, heel and PET rework are not coproducts; do not award avoided-virgin-production or waste-treatment credits. Assign failed/unrecoverable output burdens to the matched actual production cohort."
    source_ids:
      - epa-ap42-pet-1991
      - ec-polymers-bref-2007
  - rule_id: actual_coproduct
    applies_to: "export_glycol"
    rule: "If a marketable recovered glycol output exists, disclose specification, quantities, prices, destination, separate purification duties and any shared burdens. Prefer justified subdivision. This single-main-product profile supplies no default economic/mass split: unresolved joint allocation blocks the concrete dataset, and requires a documented physically or otherwise justified study allocation and review before use. Do not hide that output in Q or silently treat it as waste."
    source_ids:
      - epa-ap42-pet-1991
      - ec-polymers-bref-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_feeds
      process_id: "pet_resin"
      flow_role: "external monomer receipts/charges"
      record_type: "foreground_record"
      raw_fields: "lot; supplier; route; net supplied mass; feed assay; free water; issue/return; opening/closing stock; timestamp"
      collection_method: "Owner: materials custodian and production accountant. Use calibrated receipt/charge weights and tank/silo reconciliation for the complete period; keep actual fresh feed and internal recovery/rework ledgers distinct. Preserve undivided raw kg and all failed-run feed; no A/Q here."
      unit: "kg"
      frequency: "each receipt/charge/return and period endpoints"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; receipt/issue tickets; monomer COA; tank reconciliation"
    - protocol_id: cp_additives
      process_id: "pet_resin"
      flow_role: "whole additive feeds and species subledgers"
      record_type: "foreground_record"
      raw_fields: "lot; whole feed mass; Sb2O3 assay; cobalt acetate hydration/free water; TEPA assay; carrier; onsite preparation batch; stock/returns; product/residue Sb/Co/P"
      collection_method: "Owner: dosing operator and analytical laboratory. Weigh each separately purchased compound and trace onsite solution ingredients to cp_feeds/cp_water without duplicate purchasing. Retain raw actual period kg, free/structural water, elemental and species assays, including dosing failures; no prescribed ppm or normalizing at collection. An externally purchased formulation needs its whole commercial flow, not replacement by these active-equivalent rows."
      unit: "kg"
      frequency: "each preparation/dose and release assay"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "balance calibration; full recipe; compound COA; preparation records; lab QA"
    - protocol_id: cp_output
      process_id: "pet_resin"
      flow_role: "accepted supplied chips and Q"
      record_type: "foreground_record"
      raw_fields: "unique batch/release ID; same route/grade; net supplied mass; tare; acceptance; IV/method; DSC; moisture; colour; DEG; AA; Sb/Co/P; stock/rework flags"
      collection_method: "Owner: quality release officer and weighbridge custodian. Weigh genuinely new accepted supplied chips once, excluding transport tare and prior finished stock; reconcile production, acceptance, stock transfers and shipment. Record failure/zero-output/rework runs and do not count intermediate chips feeding SSP. The supply gate is factory quality release of independently deliverable chips, not the shipment date: count newly accepted finished stock at this gate once even if dispatched later; old finished stock drawdown never creates Q. Released finished-stock silos are outside the manufacturing stock boundary; unreleased chips remain in the closing WIP/stock and burden ledger. Q is the unique positive accepted supplied net kg matching the complete numerator scope; record Q but do not divide here."
      unit: "kg"
      frequency: "each batch/release and period closure"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed acceptance; buyer specification; unique lot ledger; IV/DSC and chemical methods"
    - protocol_id: cp_carry
      process_id: "pet_resin"
      flow_role: "period and WIP burden ownership"
      record_type: "foreground_record"
      raw_fields: "every run; failure; zero output; heel; WIP lot; opening/closing physical stock; per-exchange opening/closing carried burdens; linkage to output Q; returns/rework lineage"
      collection_method: "Owner: production accountant. Retain the complete undivided raw period numerators, failed batches, startup/shutdown, cleaning and standing losses. Trace opening burdens into released material and closing recoverable WIP into the next period once, by each exchange; do not park failed unrecoverable burdens in closing WIP or reset rework history. This is a raw stock/burden reconciliation, not normalization."
      unit: "kg; MJ"
      frequency: "every run and period opening/closing"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "run completeness register; WIP physical count; per-exchange burden carry ledger"
    - protocol_id: cp_utilities
      process_id: "pet_resin"
      flow_role: "actual utilities"
      record_type: "foreground_record"
      raw_fields: "meter ID; opening/closing readings; timestamps; kWh; heat MJ; steam kg/P/T/quality; nitrogen mass/volume/P/T; integrated-volume flag; provider boundary"
      collection_method: "Owner: utilities engineer. Retain undivided actual meters for every included operation and failed/standby period. Convert supported raw units before reporting; retain dedicated or justified shared-meter allocation and losses. Already integrated volumes receive no second time factor; steam enthalpy does not create a second heat purchase."
      unit: "kg; MJ; kWh; m3"
      frequency: "continuous meters and each actual supply event"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; density/enthalpy evidence; provider/network statement; load allocation"
    - protocol_id: cp_water
      process_id: "pet_resin"
      flow_role: "physical and species water balance"
      record_type: "foreground_record"
      raw_fields: "fresh/free/hydrate/steam water; quench/reflux loops; condensate weights and assays; EG/DEG/AA; reaction conversion/end groups; independent water formation/consumption evidence; vapour; effluent; inventory"
      collection_method: "Owner: process chemist and water operator. Meter independent physical inputs and outlets as whole streams, sampling actual species. Independently substantiate water formation/consumption from actual reaction progress, feed/product end groups and validated chemical/species methods, separating catalyst preparation, hydrolysis and hydrate/free-water changes. Neither ideal 2 mol water per repeat unit, COD nor mass residual measures actual reaction water. Do not solve an unknown reaction-water term and an unknown outlet from the same closure residual."
      unit: "kg"
      frequency: "each batch/condensate transfer; representative time-resolved sampling; period closure"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated water/condensate meters; lab method and sampling QA; independent reaction evidence"
    - protocol_id: cp_recovery
      process_id: "pet_resin"
      flow_role: "glycol gross recovery, return, purge and export"
      record_type: "foreground_record"
      raw_fields: "condensate/column stream IDs; whole mass; EG/DEG/water/oligomer/additive assays; reflux; return; purge; external transfer; inventories; duties"
      collection_method: "Owner: recovery-unit operator. Preserve undivided raw stream totals and composition for the full matched campaign; reconcile all gross recovery/returns and opening/closing inventories. Only boundary transfers become inventory exchanges. Internal recirculation never becomes new monomer procurement or a sale credit. Exported glycol needs actual quality/destination and coproduct review."
      unit: "kg; MJ"
      frequency: "each transfer and column campaign; opening/closing"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "flow/scale calibration; column logs; sampled composition; transfer and destination evidence"
    - protocol_id: cp_solids
      process_id: "pet_resin"
      flow_role: "solid losses, rejected resin and packaging"
      record_type: "foreground_record"
      raw_fields: "separate stream ID; net/tare; PET; filter cake; additive/water assay; internal rework; actual packaging composition; upstream included flag; waste destination"
      collection_method: "Owner: finishing operator and waste custodian. Weigh each actual solid stream separately, retain moisture/composition and return/export disposition; use scale records and manifests rather than residual closure. Keep packaging components and product net mass distinct; preserve their raw period amounts including failed output."
      unit: "kg"
      frequency: "each cut/filter change/waste transfer and period endpoints"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale QA; component composition; scrap/rework ledger; waste manifests"
    - protocol_id: cp_air
      process_id: "pet_resin"
      flow_role: "individual final atmospheric releases"
      record_type: "foreground_record"
      raw_fields: "actual outlet/compartment; species; concentration; dry/wet basis; flow rate or integrated volume; duration; P/T/humidity; control status; batch/run; recovery"
      collection_method: "Owner: environmental monitoring lead. Sample representative startup, normal, failed, purge and shutdown conditions after actual controls. Retain raw concentration and gas throughput; rate times duration is allowed but integrated volume is not multiplied again. Speciate releases and independently assay water; total VOC and COD cannot apportion unknown species or close carbon/water balances. Actual unlisted species, such as additive-derived acetic acid or ethanol when demonstrated, require separate rows."
      unit: "kg; mg/m3; m3; h"
      frequency: "actual runs with representative/continuous sampling"
      temporal_coverage: "same actual matched campaign; include failed/zero-output/rework runs and opening/closing inventories"
      site_scope: "one stated site and recipe/route/state cohort; provider modules identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory and flow/humidity calibration; sampling plan; detection limits; control logs"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert raw masses and supported integrated volumes to the row unit before normalization; kWh * 3.6 = MJ. If a rate is recorded, integrate over actual time; an integrated volume receives no further duration factor. Use matched measured density and conditions, never a secondary native flow-property coefficient as density."
      inputs:
        - raw_readings
        - density
        - temperature
        - pressure
        - duration
      output: "raw_period_amount"
      source_ids:
        - epa-ap42-pet-1991
        - ec-polymers-bref-2007
    - id: burden_carry
      applies_to: "all inventory rows"
      rule: "A_i = raw_period_amount_i + opening_carried_burden_i - closing_recoverable_WIP_burden_i, after documented stock/return reconciliation and justified shared-meter attribution; maintain the same product/route/state cohort. Include failed, zero-output, startup, shutdown, rework and cleaning burdens. Prior released finished stock is excluded from both Q and its already assigned burden. Carry each WIP burden once; this rule does not divide by Q."
      inputs:
        - raw_period_amount_i
        - opening_carried_burden_i
        - closing_recoverable_WIP_burden_i
        - cp_carry
      output: "A_i"
      source_ids:
        - epa-ap42-pet-1991
        - ec-polymers-bref-2007
    - id: accepted_output
      applies_to: "pet_chips"
      rule: "Q = sum of unique newly accepted supplied net chip masses at factory quality release matching the numerator cohort, including newly accepted finished stock once irrespective of later dispatch; exclude transport tare, internal intermediates/loops, coproducts, failed output, old finished stock and repeated rework releases. Require Q > 0; a zero-output period retains its burdens for an evidenced disposition/carry, never division by zero or deletion."
      inputs:
        - accepted_release_mass
        - unique_lot_id
        - cp_output
        - cp_carry
      output: "Q"
      source_ids:
        - epa-ap42-pet-1991
        - ec-polymers-bref-2007
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "q_i = A_i / Q, once only, in row units per 1 kg reference flow. For pet_chips the reported amount is exactly 1 kg. Collection protocols retain undivided raw numerators; flow-card references and protocol aggregation labels describe this same single reporting operation and are not sequential divisions. Never average batch ratios or substitute theoretical yield/nameplate output for Q."
      inputs:
        - A_i
        - Q
        - cp_output
        - cp_carry
      output: "q_i"
      source_ids:
        - epa-ap42-pet-1991
        - ec-polymers-bref-2007
    - id: physical_and_species
      applies_to: "pet_resin"
      rule: "Reconcile physical mass: external input mass plus opening unreleased physical stocks equals all physical output masses crossing the declared quality-release/transfer gate plus closing unreleased stocks, with measured ambient carrier-air throughput separately reconciled. Then independently reconcile C/H/O/Sb/Co/P and actual species. Generated/consumed reaction water is an internal species transformation of already counted feed mass, not an added external input; free, hydrate, steam, retained and vapour water remain distinct. DEG incorporation, EG release, oligomers, acetaldehyde and additive chemistry require independent assay/reaction evidence. Do not fit unknown water or outlet species to the physical residual; report uncertainty and unresolved closure."
      inputs:
        - cp_feeds
        - cp_additives
        - cp_output
        - cp_water
        - cp_recovery
        - cp_solids
        - cp_air
        - cp_carry
      output: "physical_and_species_reconciliation"
      source_ids:
        - epa-ap42-pet-1991
        - ec-polymers-bref-2007
  data_quality_requirements:
    - id: identity_and_route
      applies_to: "pet_resin"
      requirement: "Require actual separately purchased compounds, batch recipe, synthesis logs, amorphous supplied state, IV/DSC methods and signed release; verify no recycled/co-monomer feed, deliberate crystallization or SSP inside the supplied gate. Any contrary route/grade is outside scope."
      evidence: "COA; full recipe; synthesis and IV/DSC records; acceptance"
    - id: period_completeness
      applies_to: "all inventory rows"
      requirement: "Reconcile every raw-period record, failed/zero-output/rework run, inventories and carried burdens with unique Q; do not drop bad runs or count recycled material again. Preserve uncertainty, detection limits and original units."
      evidence: "run census; calibrated meters; cp_carry; unique output ledger"
    - id: species_and_water
      applies_to: "pet_resin"
      requirement: "Independent physical mass, elemental and water/species evidence is mandatory; a mass closure residual, total VOC, COD, formula or ideal stoichiometry is insufficient to invent actual water, loss or yield. Hydrate water and retained moisture are not new purchases."
      evidence: "stream scales and assays; reaction/end-group evidence; analytical QA"
    - id: background_identity
      applies_to: "all inventory rows"
      requirement: "Verify native complete identity and exact property-unit chain plus actual provider/geography/route/state. UUID identity does not establish site activity or background quantities. Unresolved ordinary auxiliary IDs are disclosed linkage debts; unresolved measurements or final-reference incompatibility prevent use of the concrete dataset."
      evidence: "complete native records; exact support chain; provider/activity evidence"
validation_rules:
  - rule_id: reference_gate
    applies_to: "pet_chips"
    rule: "Require one terminal Product output linked by reference_flow_link to pet_chips with the same PET UUID and 1 kg basis in both languages. An intermediate or genuinely separate coproduct must retain its physical identity even if it shares a generic UUID; never rename or hide it to pass this check."
    source_ids: []
  - rule_id: single_normalization
    applies_to: "all inventory rows"
    rule: "Require complete matched raw records, Q > 0, explicit run/WIP/return burden ownership and one application of normalize_period after conversions. If no independent accepted supply exists, or balances/actual species remain unresolved, the concrete dataset is incomplete."
    source_ids:
      - epa-ap42-pet-1991
      - ec-polymers-bref-2007
  - rule_id: chemical_and_native
    applies_to: "all inventory rows"
    rule: "Reject true compound/CAS, grade, state, route, type, compartment or reference-property contradictions. Whole commercial formulations, onsite preparations and elemental/hydration subledgers must not be double procurement. Additional actual exchanges need atomic rows and complete protocol evidence."
    source_ids:
      - epa-ap42-pet-1991
      - ec-polymers-bref-2007
  - rule_id: evidence_limits
    applies_to: "pet_resin"
    rule: "Retain source-specific limitations: the patent is an illustrative batch case with later SSP and other recycled/copolymer examples; EPA is a historical US continuous-process description, not a site factor; BREF fibre/spinning operations are excluded here; UIF MTR is a different conditioning route. Scientific review, mapping acceptance and publication are separate decisions."
    source_ids:
      - epa-ap42-pet-1991
      - ec-polymers-bref-2007
      - futura-pet-homopolymer-2007
      - uif-pet-technology
published_dataset_profile:
  dataset_role: "Foreground PET manufacturing unit process with independently linked upstream and treatment modules"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified supply of this amorphous PTA-route PET grade as an input to later polymer processing"
  excluded_use: "Exclude DMT transesterification; deliberately added IPA, CHDM or other co-monomers; recycled flakes/BHET feed; purchased PET blending, remelting or compounding; PETG, PBT, other polyesters, polyacetals, polyethers, epoxy and alkyd resins; solutions, liquid prepolymers and formulated coating/curing systems; MTR-conditioned or crystallized/SSP pellets; fibres, film, bottles and cured articles. In-situ DEG units, oligomers and catalyst residues are measured constituents, not authority to assume an intentional co-monomer recipe."
  required_metadata: "Actual product and separately charged ingredients; full recipe; route; IV and DSC methods; grade specification; moisture and Sb/Co/P/DEG/acetaldehyde; site/geography; period and Q; WIP burden ownership; heat/steam/provider interfaces; recovery and outlets; source limitations"
  required_quality_disclosure: "Measurements versus calculated values; missing auxiliary identities/providers; actual balances and species/water evidence; failed/zero-output runs; raw burden carry and uncertainty; coproduct assessment if needed; no food-grade or science-approval claim"
  update_trigger: "Changed monomer/catalyst/additive identity, commercial formulation or supplier route, coproduct disposition, physical supplied state, crystallization/SSP gate, utilities, tests or measured loss/species behaviour"
data_sources:
  - id: "epa-ap42-pet-1991"
    type: "official_guidance"
    reference: "US EPA, AP-42 §6.6.2 Poly(ethylene Terephthalate), September 1991 (reformatted January 1995), pp. 6.6.2-1, 4, 6-7, 10-11. https://www.epa.gov/sites/default/files/2020-10/documents/c06s06-2.pdf"
    used_for: "TPA water versus DMT methanol; esterification/vacuum/glycol recovery and shipped-chip alternative; species/outlet inspection. Historical US continuous plants, unlike the selected batch/cyclic process; no plant quantities, emission factors, spray-condenser assumptions or default yield are adopted."
  - id: "ec-polymers-bref-2007"
    type: "official_guidance"
    reference: "European Commission, Reference Document on Best Available Techniques in the Production of Polymers, August 2007, §10.2.1-10.2.6, printed pp. 161-168. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf"
    used_for: "PET polymerization and recovery context; distinction from crystallization, SSP and spinning-chip drying. DMT catalyst discussion is not a PTA recipe, and fibre/bottle/co-monomer operations and historical European values are not transferred to this gate."
  - id: "futura-pet-homopolymer-2007"
    type: "literature"
    reference: "S. T. Kulkarni / Futura Polyesters Ltd., US7297721B2, Process for controlled polymerization of a mixed polymer, 2007-11-20, printed cols. 3-4, 7-8, Example 1. https://patents.google.com/patent/US7297721B2/en"
    used_for: "Primary patent Example 1: PTA/MEG homopolymer without recycled flakes, Sb2O3, cobalt acetate and TEPA; specification table identifies cobalt acetate tetrahydrate; amorphous strand/chip stage precedes SSP. Illustrative batch case, not an industrial recipe/actual yield or an independently supplied output measurement. No example dosage, quoted limits, SSP, IPA or recycled-flake example is adopted as a default."
  - id: "uif-pet-technology"
    type: "literature"
    reference: "Uhde Inventa-Fischer / thyssenkrupp, PET technology brochure, undated, pp. 3-4, official snapshot accessed 2026-10-16. https://ucpcdn.thyssenkrupp.com/_binary/UCPthyssenkruppUhde/bc07c4d7-2ab3-4cd6-bf79-e8f90568ec3a/brochure_pet.pdf"
    used_for: "Counterevidence limiting transfer: MTR bottle-resin process conditions pellets above glass transition, partly crystallizes and removes low boilers; it differs from quenched amorphous chips. Promotional energy claims, co-monomers, optional recycled-flake integration and SSP comparisons are not quantitative factors for this method."
