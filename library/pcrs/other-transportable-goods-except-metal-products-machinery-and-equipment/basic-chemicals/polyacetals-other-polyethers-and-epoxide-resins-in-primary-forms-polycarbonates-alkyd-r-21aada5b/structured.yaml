system_boundary:
  rules:
    - rule_id: manufacturing_gate
      applies_to: "pet_resin"
      rule: "Include receipt/storage/paste preparation, separate additive dosing, esterification, vacuum melt polycondensation, all condenser/distillation/reflux and purge duties, melt filtering, quench, cutting, surface dewatering, bulk storage and acceptance. Exclude deliberate crystallization, SSP and downstream fabrication."
