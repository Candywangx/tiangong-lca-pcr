allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "tar_distillation"
    rule: "Preserve the unallocated physical network and use measured subdivision/direct attribution first. For remaining joint burdens, test and justify determining physical causality (e.g. measured cut-specific separation/heating duty); mass alone is not proof of energy causality. If no defensible physical relationship is available, use coproduct economic values at the same distillation gate and condition, with comparable reporting-period net prices and sensitivity. No fixed fractions or automatic burden-free tar/pitch."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_ledgers
    applies_to: "all inventory rows"
    rule: "Let delivered pitch and all actual saleable cuts have physical quantities and stocks; retain them without multiplying by allocation shares. Attribute direct burdens to their causes. Economic share for product j is its same-gate production-equivalent net revenue divided by the sum for all eligible actual coproducts; reconcile stocks/deliveries and justify inferred intermediate prices. Allocate only the remaining joint environmental burdens. Shares at each stage must sum to one. Waste fees are not coproduct revenue."
    source_ids:
      - ilcd-detailed-2010
      - jrc-cww-bref-2016
  - rule_id: allocation_upstream
    applies_to: "tar_feed"
    rule: "Verify whether supplier tar burdens are already allocated at the coking/recovery stage. Preserve that upstream stage and never apply the distillery fraction a second time to the physical feed or coproduct masses. Confirm treatment responsibility for exported residuals; no avoided-product credit without an explicit compatible consequential method and displacement evidence."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "For a pitch-specific linked LCI, retain the complete physical ledger and construct a separate attribution view: B_pitch = B_direct_pitch + alpha_pitch * B_joint, using a justified stage-specific share and dividing by accepted pitch volume. Upstream supplier tar burdens already allocated at coking/recovery remain that provider input; the distillery may attribute its resulting joint environmental burden across its own fractions, without repeating the same stage share. Attributed supplier-input equivalents are burden-accounting entries, not changed feed masses or scaled physical coproduct outputs. Do not present the unallocated collection inventory alone as a fully attributed single-product dataset. ilcd-detailed-2010"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "tar_distillation"
      flow_role: "reference_pitch"
      record_type: "acceptance_record"
      raw_fields: "lot/SKU; origin; route; composition; water; ash/QI/TI; softening test and method; molten T/p; calibrated delivered net volume; net mass; density and density T; opening/closing inventory; rejects/returns; supplier convention"
      collection_method: "Calibrated liquid flowmeter or tank-volume method validated for hot pitch viscosity/state, excluding vessel and voids; independently reconcile traceable net weighing and same-lot density at the declared state. Assay actual acceptance properties with documented representative sampling, laboratory method, matrix/precision and grade criteria; no assumed density."
      unit: "m3"
      frequency: "each delivery/lot and stock closure"
      temporal_coverage: "whole common reporting period"
      site_scope: "actual receiving-to-delivery foreground"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; meter viscosity/T range; tank table or weigh tickets; density laboratory record; acceptance originals"
    - protocol_id: cp_material
      process_id: "tar_distillation"
      flow_role: "tar_feed; sodium_hydroxide; light_oil; naphthalene_oil; middle_oil; heavy_oil"
      record_type: "measured_material_record"
      raw_fields: "stage/lot; gross/tare net wet mass; cut interval/T/p; composition; water/active fraction; contamination; stocks; delivery/receiver; internal transfer pairs; actual source"
      collection_method: "Use calibrated mass readings or net weighing and representative sealed samples; record each actual fraction and supplied solution separately. Retain rejected/off-spec lots and water carried in mixtures. Record unchanged stock bases and matching internal interfaces."
      unit: "kg"
      frequency: "batch or continuous meter interval and inventory closure"
      temporal_coverage: "same whole reporting period as cp_product"
      site_scope: "receipt, cuts and accepted external transfers"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing calibration; assays and sample/method validity; stock records; supplier/recipient acceptance"
    - protocol_id: cp_utility
      process_id: "tar_distillation"
      flow_role: "electricity; gas; water; cooling_water; steam; condensate_return"
      record_type: "metered_utility_record"
      raw_fields: "meter/stage; voltage; kWh/MJ; gas volume/T/p/humidity/composition/Z; liquid water volume/density; steam supply mass/T/p/dryness; liquid return mass/T/p; direct injection; supplier quantity definition; heat-state method; period/stocks"
      collection_method: "Read calibrated utility meters and record supplier boundaries. Convert gas/liquid volume only on measured compatible state bases. Retain steam carrier and return enthalpy separately; heat interpretation requires a validated state-property method and complete measured supply/return/loss balance, not a database coefficient. Internal cooling circulation is retained for equipment balances."
      unit: "declared row unit"
      frequency: "meter intervals covering all operating modes"
      temporal_coverage: "same whole reporting period as cp_product"
      site_scope: "heater, distillation, storage, cooling and transfer"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and supplier originals; state/quality records; property-method validity; utilities reconciliation"
    - protocol_id: cp_waste
      process_id: "tar_distillation"
      flow_role: "wastewater; tar_sludge"
      record_type: "transfer_record"
      raw_fields: "actual source/receiver; wet mass; water/solids/oil; BOD/COD method; individual PAH; chloride/ammonium where present; hazard class; treatment acceptance; stock; sampling uncertainty"
      collection_method: "Weigh each segregated export and obtain documented receiver/treatment data; assay representative oily water/sludge with matrix-validated methods, distinguishing wastewater pollutant content from final receiving-environment release."
      unit: "kg"
      frequency: "each transfer and representative composition campaign"
      temporal_coverage: "same whole reporting period as cp_product"
      site_scope: "exact external treatment interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighed transfers; accredited/validated analyses; treatment/receiver records; stock closure"
    - protocol_id: cp_air
      process_id: "tar_distillation"
      flow_role: "all elementary rows"
      record_type: "measured_emission_record"
      raw_fields: "species/CAS; source/control; carrier-air inlet/outlet O2/N2/H2O/CO2; actual reaction and extent evidence; sample phase; dry/wet gas flow; T/p/O2; concentration basis; time; stack/fugitive mode; humidity; PM aerodynamic intervals/filterable-condensable basis; detection/recovery/uncertainty; actual operation hours"
      collection_method: "Measure controlled outlet species and gas flow on matched bases, covering actual heating, storage, transfer and upset modes; integrate concentration times flow over time. Use validated source-specific fugitive measurements or a disclosed substantiated engineering estimate with its uncertainty. Total-VOC/PAH or tar-fume screening is a completeness check, not one species exchange; bulk mass-balance residuals alone are not accurate emission measurements."
      unit: "kg"
      frequency: "representative operating-mode campaigns and monitored intervals"
      temporal_coverage: "same whole reporting period as cp_product, including upsets"
      site_scope: "all actual outdoor releases after control"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling train/phase recovery and matrix validation; flow meter/calibration; method/detection/uncertainty; mode coverage and actual hours"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide each same-period unallocated physical exchange by the same-period accepted molten pitch volume in m3 at the declared state; reference_pitch is fixed at 1 m3. Apply environmental attribution in a separate ledger, then divide attributed burdens by that same volume. Preserve all physical coproduct outputs and internal transfers. All protocols use one representative operating period including actual maintenance/start-up/shutdown and stock movements. Raw readings remain separated by stage, lot and operating mode before aggregation. The aggregation denominator is accepted net molten pitch volume at the single declared delivery state; missing temperature/density/provider conventions prevent a complete linked package. This method requires future actual SKU/site/supplier measurements and supplies no invented survey or plant data. ifc-coal-tar-2007; jrc-cww-bref-2016 Retain raw unnormalised interval amounts and sum the complete reporting-period numerator before one application of normalize_period; never average interval ratios or divide a pre-normalised amount again. Include failed and zero-output interval inputs, waste and releases in the same applicable period pool. Reconcile accepted deliveries, returns/cancellations, reacceptance and opening/closing stocks by lot; credit each net accepted volume once, and do not count internal rework passes as new output. Carry inventory burdens consistently so old-stock deliveries are not paired with current processing alone. If accepted net reference volume is zero, preserve the pool and disclose the unresolved unit result instead of dividing by zero or discarding the burdens. Protocol aggregation labels describe the final per-reference basis, not a second division."
      inputs:
        - cp_product
        - "relevant collection protocol"
      output: "physical exchange and separately attributed burden per reference flow"
      source_ids:
        - ilcd-detailed-2010
        - jrc-cww-bref-2016
  data_quality_requirements:
    - id: quality_physical
      applies_to: "all inventory rows"
      requirement: "Reconcile unallocated inputs plus opening stocks with all external products, waste, air releases and closing stocks using measured composition and equal-quantity internal links. Keep total-mass and elemental C/H/O/N/S conservation separate from reactive-species bookkeeping. Retain measured carrier-air inlet and outlet O2/N2/H2O/CO2 in the engineering combustion sub-balance, independently of the pollutant exchange list; reconcile net fossil CO2 and water-vapour releases with incoming carrier components and actually formed species without duplication. For water, opening H2O + incoming H2O + actual H2O formation equals closing H2O + outgoing H2O + actual H2O consumption; substantiate reaction terms from actual chemistry and measured reaction extent. Do not enforce water or dry matter as if each were an element conserved through reaction. Do not count mixture water twice, use COD as carbon, or fit reaction terms or emissions to a residual. Retain discrepancies against measured uncertainty, not an invented tolerance."
      evidence: "actual assays, carrier-air inlet/outlet composition, actual reaction evidence, stock closure and physical network; jrc-cww-bref-2016"
    - id: quality_energy
      applies_to: "utility and heater stages"
      requirement: "Retain electrical input, gas measured calorific basis, material/steam/return sensible and latent enthalpy, useful duties and evidenced losses on common reference states. Match actual heater and supplier conventions; do not duplicate steam-carrier and heat-service burdens. Distillation does not mean the feed carbon is completely combusted. Unproved state conversions cannot support a complete heat link."
      evidence: "stage meters, declared property methods, measured state/composition and supplier boundary"
    - id: quality_releases
      applies_to: "all elementary rows"
      requirement: "Screen all actual emitted species from feed/impurity/heater/control evidence; extend atomic rows for actual additional PAH/VOC, ammonia, sulfur or other species and any on-site final aqueous releases. Reconcile individual VOC/PAH to totals on identical mass conventions without representing both as duplicate elementary masses. PM2.5, PM2.5–10 and >PM10 are disjoint. When particle-bound PAH is included in measured PM, retain its species-specific emission but identify it as a PM constituent so its mass is counted once in the physical balance. Retained dust/aerosol and recovered tar are not outdoor emission."
      evidence: "source sampling, actual feed and operating/control map; ifc-coal-tar-2007"
    - id: quality_links
      applies_to: "all inventory rows"
      requirement: "UUID physical identity is separate from supplier/treatment dataset, geographic/voltage scope, quantity basis and amount. Resolve blank identities and verify actual provider conventions before making complete linked-data claims. Unavailable monitoring, site/SKU/grade or provider basis is disclosed rather than replaced by a database coefficient."
      evidence: "native identities and independently collected supplier/receiver and quantity records"
    - id: quality_carbon
      applies_to: "combustion and material stages"
      requirement: "Preserve carbon retained in pitch/cuts/residues versus emitted fossil species. If actual additional biogenic input is present, reassess scope and record biogenic carbon flows separately; do not delete biogenic CO2 because a GHG reporting convention omits it. Carbon-neutral or free-coproduct assumptions are not authorized."
      evidence: "composition-based physical carbon ledger, emission originals and supplier attribution"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_pitch"
    rule: "Require one finished reference output at 1 m3 homogeneous molten neat binder pitch and matching bilingual quantity/volume convention. Verify high-temperature coal origin, atmospheric route, grade, T/p, density measurement and provider volume basis. Reject petroleum/wood blends, cold bulk void volume and nominal 1 kg substitutions."
    source_ids:
      - ifc-coal-tar-2007
      - wco-hs-2022-ch27
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Check complete unallocated physical mass/water/elemental balances, stocks and same-quantity internal transfers independently from allocated burdens. Do not multiply coproduct output quantities by their allocation share. Missing measurements/species and unexplained residuals remain unresolved; an aggregate balance does not prove emission completeness."
    source_ids:
      - jrc-cww-bref-2016
      - ilcd-detailed-2010
  - rule_id: validate_allocation
    applies_to: "tar_feed; tar_distillation"
    rule: "Verify the upstream coking/recovery allocation status, non-overlapping interface, direct-attribution evidence, joint-burden criterion, same-gate cut quantities/prices and stage share sums. A nominal scaffold or classification leaf is no upstream methodology evidence."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: validate_inventory
    applies_to: "all inventory rows"
    rule: "Verify each atomic row's physical identity, CAS/route, official Chinese display, flow type, reference property/unit and receiving compartment. Require actual occurrence/absence, amount and provider compatibility independently. No correction flow, unrelated waste stream, or positive amount inferred merely from a successful identity search."
    source_ids:
      - jrc-cww-bref-2016
      - ifc-coal-tar-2007
  - rule_id: validate_emissions
    applies_to: "all elementary rows"
    rule: "Verify species mass versus analytical equivalents, non-overlapping PM fractions, phase recovery, sampling/flow state, normal and abnormal mode coverage, and all actual additional species. N2O is outside NOx and NO2-equivalent does not prove NO2 species. Statutory guideline concentrations are neither default emissions nor plant survey data."
    source_ids:
      - ifc-coal-tar-2007
      - jrc-cww-bref-2016
published_dataset_profile:
  dataset_role: "primary distillery foreground with separate physical and allocated-burden ledgers"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible hot bulk neat coal-tar binder-pitch supply with actual composition, state, quantity and linked upstream/treatment evidence"
  excluded_use: "Full CPC34540 coverage; oil/pitch-coke/electrode manufacture; other-origin or formulated pitch; default density/yield/energy/recipe; incomplete linked-data or methodology-approval claims"
  required_metadata: "all reference qualifiers; site/SKU/grade/period; actual process/control/treatment map; physical conservation and staged allocation; supplier interfaces; original methods"
  required_quality_disclosure: "actual measured and estimated fields; sampling/uncertainty and uncovered modes; pending identities and provider states; native metadata conflicts; incomplete quantity/species links"
  update_trigger: "Changed feed origin, atmospheric route/cut scheme, product modification/grade/delivery state, heater/control/treatment configuration, supplier definition, or allocation method"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "2025-06-30 original structure, LF1457–1458 (3454/34540); broad mixed leaf, narrower proposal only, not process evidence or accepted mapping."
  - id: "wco-hs-2022-ch27"
    type: "official_guidance"
    reference: "https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0527_2022e.pdf?la=en"
    used_for: "2022, PDF2 headings2706/2707/2708; classification context distinguishing crude tar, distillates and pitch/coke; no formal CPC-HS equivalence asserted."
  - id: "ifc-coal-tar-2007"
    type: "official_guidance"
    reference: "https://www.ifc.org/content/dam/ifc/doc/2000/2007-large-vol-inorganic-compounds-coaltar-ehs-guidelines-en.pdf"
    used_for: "2007-12-10; PDF/printed1,6–7,9–10,18,28–29, coal-tar paragraphs and general monitoring only. Qualitative route/coproduct/corrosion-control and release screening; no historical yield, concentration limit, industry capacity, single-plant quantity or other chemical benchmark adopted as recipe/factor."
  - id: "jrc-cww-bref-2016"
    type: "official_guidance"
    reference: "https://publications.jrc.ec.europa.eu/repository/handle/JRC103096"
    used_for: "2016, chemical-sector CWW BREF, section3.1.5.2.4 (PDF138–139/printed108–109) and BAT2–5 (PDF573–574/printed543–544). Inventory, stock, stream characterization and monitoring context; bulk balances insufficiently accurate alone for emissions. Generic methods, not pitch-specific numeric defaults."
  - id: "ilcd-detailed-2010"
