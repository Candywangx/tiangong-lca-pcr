system_boundary:
  rules:
    - rule_id: boundary_foreground
      applies_to: "tar_distillation"
      rule: "Include receipt, actual dehydration, atmospheric cuts, pitch storage/transfer, on-site heaters, cooling/cleaning and actual release control. Aggregate processing and bulk dispatch as one foreground unit while retaining stage meters and internal equal-quantity links; reference_pitch is the single finished output."
      source_ids:
        - ifc-coal-tar-2007
        - rain-pitch-products
    - rule_id: boundary_interfaces
      applies_to: "tar_distillation"
      rule: "Coal carbonisation/crude-tar recovery and downstream oil refining/electrode production stay in separate compatible provider processes. This profile exports contaminated water and sludge to independently modelled treatment interfaces; an on-site final-discharge WWTP requires explicit extension with measured treatment inputs, sludge and each final receiving-water species. Off-site transfer is not an elementary release."
      source_ids:
        - jrc-cww-bref-2016
        - wco-hs-2022-ch27
    - rule_id: boundary_completeness
      applies_to: "all inventory rows"
      rule: "Keep actual start-up, shutdown, upset, cleaning and stock changes in the collection period. Assess all actual fuels, alkalis, lubricants, adsorbents, packaging and release-control consumables; add one atomic row per additional occurrence. Internal condensate/tar recovery and gross circulating cooling water are not externally purchased anew. Unquantified releases and missing matches remain explicit, not zero."
      source_ids:
        - jrc-cww-bref-2016
        - ifc-coal-tar-2007
boundary_abstraction:
  declared_starting_condition: "Accepted recovered crude high-temperature coke-oven tar at the distillery receiving interface, with measured entrained water/solids and an upstream dataset"
  starting_condition_role: "supplied intermediate; coal carbonisation and crude-tar recovery are upstream"
  product_classification_scope: "A narrower binder-pitch subset of CPC 3.0 34540; other distillation products are coproducts, not additional reference identities"
  recursive_input_rule: "Record actual external same-category pitch input separately with its supplied state/provider and burden. Internal recovered pitch/tar recycle is an equal-quantity physical link, not a new purchased input. External pitch blending is outside this neat-bottom-product scope."
  upstream_dataset_requirement: "Use a compatible recovered crude-tar supplier inventory including upstream coking/recovery allocation; verify its ending interface and whether dewatering, storage, heaters or delivery overlap this foreground"
  disclosure: "Plant/period; source coke-oven route; wet feed and impurities; actual dehydration/cut map; heater/utilities/control configuration; hot delivery state; treatment/export interfaces; physical and burden ledgers and all gaps"
