      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report measured species mass and stated outdoor-air compartment; reconcile gas sampling volume, dry/wet basis, temperature/pressure and any oxygen correction before integrating. NO, NO2 and N2O are distinct; a reported NOx-as-NO2 quantity is not species mass. PM fractions are disjoint."
