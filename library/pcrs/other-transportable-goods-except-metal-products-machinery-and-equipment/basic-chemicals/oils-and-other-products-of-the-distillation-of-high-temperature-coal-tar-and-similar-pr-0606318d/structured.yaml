measurement_rules:
  - id: reference_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Collect accepted net molten volume using cp_product at one declared temperature/pressure state. Use a calibrated liquid meter/tank-volume method validated for actual viscosity and temperature, or traceable net weighing with independently measured same-lot liquid density at that state; retain both mass and volume. No universal density or expansion factor."
  - id: solution_basis
    applies_to: "sodium_hydroxide; tar_feed; wastewater; tar_sludge"
    required_property_ref:
      name: "Mass"
