    required_unit: "kg"
    rule: "Keep as-supplied wet carrier mass, dry/active/component mass and carrier water distinct. For an assayed solution, component mass equals solution mass times its measured mass fraction; water already in the solution is not a second input."
  - id: utility_basis
    applies_to: "gas; electricity; steam; condensate_return; cooling_water; water"
    required_property_ref:
      name: "actual declared reference property"
      uuid: ""
    required_unit: "actual declared reference unit"
    rule: "Preserve native gas Volume/m3 and electricity Net calorific value/MJ. Convert metered electricity kWh to MJ using 3.6, with actual supply level. Steam is delivered carrier mass with measured state; liquid return is separately metered. Do not equate kg of steam or an MJ property to net useful heat."
