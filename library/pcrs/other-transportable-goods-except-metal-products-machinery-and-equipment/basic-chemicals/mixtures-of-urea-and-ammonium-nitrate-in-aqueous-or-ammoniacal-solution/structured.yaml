      quality_evidence: "NH3 versus N basis; sampling and gas-state compatibility; recovery capture; completeness and detection-limit treatment"
  calculation_rules:
    - id: period_normalisation
      applies_to: "all inventory rows"
      rule: "For each non-reference exchange i, a_i = Q_i / P exactly once. Q_i is its raw stock-reconciled attributable amount for the complete matched pool above, before any per-kg division. P is unique accepted net supplied UAN kg for that pool, reconciled with production, returns/reacceptance, delivery and stocks and their matched burdens. Keep failed/zero-output/rework burdens and exclude internal returns as new external exchanges. P must be positive; if the complete pool has no positive P, retain totals for a justified matched wider pool or report the unit result unavailable, never zero burden or division by zero. Keep uan_product exactly 1 kg."
      inputs:
        - Q_i
        - P
        - "collection records"
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - eu-lvic-aaf-2007
        - efma-uan-2000
    - id: solution_components
      applies_to: "urea_solution; an_solution; nitric_adjustment; uan_product"
      rule: "Component mass = supplied solution mass times its measured component fraction. Carrier water is separately analysed or derived from a complete validated composition, not every unidentified non-active remainder. Component ledgers never add extra external feed exchanges."
      inputs:
        - "Supplied masses"
        - assays
        - "complete compositions"
      output: "Species and carrier-water ledgers"
      source_ids:
        - efma-uan-2000
    - id: nutrient_result
      applies_to: "uan_product"
      rule: "Nitrogen output = P times measured total-N mass fraction. An explicitly optional per-kg-N result divides the supplied-product inventory by the same measured fraction; keep urea-N, ammoniacal-N and nitrate-N analytical bases consistent. It does not replace the 1 kg solution reference."
      inputs:
        - P
        - "measured total-N"
        - "measured N forms"
      output: "Declared kg N and separately labelled nutrient result"
      source_ids:
        - yara-uan32
        - efma-uan-2000
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "MJ = measured kWh times 3.6; retain actual user voltage and provider definition."
      inputs:
        - "Metered kWh"
      output: "MJ electrical input"
      source_ids:
        - efma-uan-2000
    - id: air_integration
      applies_to: "ammonia_air"
      rule: "Integrate compatible NH3 species concentration times gas volume over measured modes; for mg/Nm3 times Nm3 divide by 1000000 for kg. Match T/P, wet/dry and N versus NH3 definitions and add separately assessed fugitives once."
      inputs:
        - Concentrations
        - "gas volumes"
        - "measured operating modes"
        - fugitives
      output: "External NH3 species mass"
      source_ids:
        - efma-uan-2000
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Reconcile feed inputs against full net accepted solution, external wastes, evaporated water, NH3 emissions and stock changes in total-mass, water, elemental-N and urea-carbon ledgers. pH neutralisation can change N speciation; measured recovery and compositions govern, not a fixed yield. Compare every internal link at both ends. Preserve residual and uncertainty."
      inputs:
        - "Feed/output/waste assays"
        - meters
        - "stock and recycle records"
      output: "Reconciled physical balance with uncertainty"
      source_ids:
        - eu-lvic-aaf-2007
        - efma-uan-2000
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Exact physical state, composition, route and recipient; blank UUID is a named identity gap. Match the reference aqueous subset and official flow names; inspect contrary CAS or hard route limits before use."
      evidence: "Lot/SKU evidence; retained flow identity support; un-cpc3-3461"
    - id: dq_provider
      applies_to: "all external inputs"
      requirement: "Match actual solution assay, supplied/dry/N denominator, electricity voltage, geography/time and waste receiver. Flow identity is separate from background quantitative compatibility."
      evidence: "Supplier declarations and reference-amount definitions"
    - id: dq_completeness
      applies_to: "uan_mixing"
      requirement: "Include same-period stocks, startup/shutdown, dosing, cooling, cleaning, recovery and non-recycled losses. No extrapolated recipe or blanket zero; extend inventories for confirmed unexpected species without duplicating nested PM categories."
      evidence: "Complete meters/assays and event records; efma-uan-2000"
    - id: dq_scope
      applies_to: "uan_mixing"
      requirement: "Prove additive absence and electric additive-free water-cooling configuration before applicability. Source examples and historical zero-emission potential do not prove the current site or set defaults."
      evidence: "Actual formulation, equipment and operating evidence; eu-lvic-aaf-2007; efma-uan-2000"
validation_rules:
  - rule_id: validate_reference
    applies_to: "uan_product"
    rule: "Require exactly one final product output linked as uan_product, 1 kg net supplied solution, with the same inventory, protocol and calculation denominator. Product mass includes water; internal transfers are not extra reference products."
    source_ids:
      - efma-uan-2000
  - rule_id: validate_applicability
    applies_to: "uan_mixing"
    rule: "Check aqueous solvent, continuous received-solution route, absent product additives, compatible corrosion protection, declared electric water cooling, composition/N forms and bulk acceptance. CPC title or similar fertilizer use cannot establish applicability."
    source_ids:
      - eu-lvic-aaf-2007
      - efma-uan-2000
      - un-cpc3-3461
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Reconcile mass/water/N/carbon and stocks, actual pH inputs, internal-return equality, external wastes/emissions and energy; report residuals/uncertainties. No hidden default quantity, near-match UUID or supplier-basis substitution."
    source_ids:
      - eu-lvic-aaf-2007
      - efma-uan-2000
  - rule_id: validate_losses
    applies_to: "uan_mixing"
    rule: "Independently verify loss/recovery evidence, no-release claims and receiver conditions. Unknown or below-detection losses retain their treatment and uncertainty. Elementary NH3 is outdoor-air species mass; water vapour is evaporated water, not circulated or drained liquid."
    source_ids:
      - efma-uan-2000
  - rule_id: validate_gaps
    applies_to: "all inventory rows"
    rule: "Exact missing flow identities and unmatched providers remain explicitly pending. A concrete dataset cannot claim complete identity linkage or full quantitative validation while an applicable row is unresolved. Any actual excluded utility/ingredient/operation needs evidence and a method extension before acceptance."
    source_ids:
      - eu-lvic-aaf-2007
      - efma-uan-2000
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after complete foreground collection and declared review"
  downstream_use: "Supply-chain models requiring the same aqueous UAN grade, route and factory-gate net solution basis"
  allowed_use: "Explicitly qualified product supply; optional separately labelled nutrient normalization with measured N fraction"
  excluded_use: "Universal fertilizer recipe; pure urea/AN substitutes; ammoniacal/additive mixtures; solid dissolution or integrated syntheses; equal crop performance; farm application emissions; packaged product"
  required_metadata: "Site/period/route; full supplied composition/N forms; acceptance; stock-adjusted denominator; feed origins/assays; corrosion and cooling configuration; reference property; providers and quantity definitions; transport and capital boundary"
  required_quality_disclosure: "Source age and dependence; inventory/measurement coverage; identity/provider gaps; balance residuals; uncertainty and detection limits; recovery/no-release evidence; independent review status"
  update_trigger: "Change in grade/solvent/additive, input state or origin, cooling/utility/process route, recovery/receiver, supplier quantity convention, monitoring evidence or material mass-balance failure"
data_sources:
