allocation_rules:
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Retain the full physical mass/water/N/carbon ledger, stocks and internal-return measurements before assigning burdens. Internal recovered UAN and water are not co-products, avoided-product credits or external exchanges. Waste remains waste unless its actual beneficial product identity and recipient are separately established."
    source_ids:
      - efma-uan-2000
  - rule_id: allocation_grade
    applies_to: "uan_mixing"
    rule: "Only one accepted product grade is represented by this dataset. Subdivide shared meters by measured line/grade activity and demonstrably causal pumping/cooling or cleaning demand; justify the key and uncertainty using site records. No generic mass fraction, energy demand or economic share is imposed. Never multiply physical product or waste output by an environmental allocation share."
    source_ids:
      - eu-lvic-aaf-2007
      - efma-uan-2000
  - rule_id: allocation_extension
    applies_to: "uan_mixing"
    rule: "A genuine exported usable heat stream or co-product falls outside this scoped single-product mixing method; establish functions, measurements and a justified allocation/subdivision rule before extension. No automatic negative burden for sump recovery, off-spec waste or hypothetical heat recovery."
    source_ids:
      - eu-lvic-aaf-2007
      - efma-uan-2000
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "uan_mixing"
      flow_role: "uan_product"
      record_type: "Dispatch and acceptance"
      raw_fields: "SKU; route; additives absence; equipment compatibility; net loaded mass; acceptance/return/reacceptance lot links; opening/closing stocks and WIP with carried burdens; urea/AN/free NH3/water/impurities; total-N and N forms; density/T; pH; receiver"
      collection_method: "Calibrated tank/loadout mass meter or calibrated truck gross/tare scales; lot sampling with traceable urea, nitrate, ammoniacal-N and total-N analyses; verify supplied mass and composition closure, reconcile stock-adjusted accepted output"
      unit: "kg"
      frequency: "Continuous metering and every accepted lot"
      temporal_coverage: "Same complete campaign/year"
      site_scope: "Same aqueous grade and site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; laboratory method and uncertainty; lot acceptance; stock reconciliation; actual formulation and corrosion-compatible equipment evidence"
    - protocol_id: cp_feed
      process_id: "uan_mixing"
      flow_role: "urea_solution; an_solution; ammonia_adjustment; nitric_adjustment"
      record_type: "Feed receipts and dosing"
      raw_fields: "Supplier/source; lot; net solution mass; actual assay and species basis; water; temperature/density; gas T/P and purity; stock change; dosing and pH"
      collection_method: "Calibrated mass flow meters and stock-corrected receipt/dosing records; representative lot analyses. Any volume-to-mass conversion requires measured same-temperature density; gas conversion requires actual T/P/composition/Z and supplier volumetric convention"
      unit: "kg"
      frequency: "Continuous feed/dose plus every incoming lot"
      temporal_coverage: "Same complete campaign/year"
      site_scope: "Same mixing-line boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Assay provenance; full supplied-mass versus active-component ledger; meter calibration; supplier interface and provider denominator"
    - protocol_id: cp_water
      process_id: "uan_mixing"
      flow_role: "process_water; cooling_makeup; water_vapour_air"
      record_type: "Water meters and balances"
      raw_fields: "Separate formulation/rinse/cooling inlet masses; circulating flow; stocks; retained product water; recovery; blowdown; evaporated mass; leakage; measurement uncertainty"
      collection_method: "Calibrated inlet meters; distinguish external make-up and internal recirculation; reconcile supplied-solution water, retained product, recovered liquid, measured blowdown and independently assessed evaporation; unclosed residual remains pending"
      unit: "kg"
      frequency: "Continuous meters and each cleaning/stock event"
      temporal_coverage: "Same complete campaign/year"
      site_scope: "Process and indirect cooler, separate sub-meters"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Water-balance residual; method for evaporation; recovered-liquid routing; additive-free cooling confirmation"
    - protocol_id: cp_energy
      process_id: "uan_mixing"
      flow_role: "electricity"
      record_type: "Electric meters"
      raw_fields: "kWh by pump/fan/actuator/control/loadout stage; <1 kV interface; meter coverage; shared grade activity; supply region/time"
      collection_method: "Calibrated user-side electric submeter totals; retain stage and operating-mode attribution and use 3.6 MJ/kWh; no imported steam or fuel inferred from an energy label"
      unit: "MJ"
      frequency: "Continuous meter and period reconciliation"
      temporal_coverage: "Same complete campaign/year"
      site_scope: "Same electric-drive mixing and cooler"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; causal sharing key and uncertainty; provider grid/voltage and quantity compatibility"
    - protocol_id: cp_waste
      process_id: "uan_mixing"
      flow_role: "rejected_solution; nitrogen_wastewater; cooling_blowdown"
      record_type: "Waste transfer and analyses"
      raw_fields: "Stream identity; net waste mass; urea/AN/N forms/free NH3/water/organic C; salts; temperature; contamination; internal-return split; receiver; acceptance; treatment"
      collection_method: "Separate calibrated weighing/volume and measured density, transfer tickets and representative analyses; reconcile all non-recycled external liquid transfers; verify receiving-treatment conditions. Do not count recycled material as an external waste"
      unit: "kg"
      frequency: "Every external transfer and representative stream sample"
      temporal_coverage: "Same complete campaign/year"
      site_scope: "Separate off-spec, cleaning effluent and cooling purge"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Receiver permit/acceptance evidence; composition and density; measured return routing; waste-versus-product decision"
    - protocol_id: cp_air
      process_id: "uan_mixing"
      flow_role: "ammonia_air"
      record_type: "Species-resolved vents and fugitives"
      raw_fields: "NH3 concentration definition; gas flow; normal T/P; wet/dry convention; operating duration; recovery; fugitive losses; uncertainty"
      collection_method: "Identify vent/storage/loadout points and actual release occurrence; integrate species-compatible concentration and gas volume, plus separately assessed fugitives after recovery. No emission requires verified closed operation/recycle evidence, not an assumed EFMA zero"
      unit: "kg"
      frequency: "Representative monitored modes including dosing and loadout"
      temporal_coverage: "Same complete campaign/year"
      site_scope: "Outdoor boundary of declared mixing/storage/loadout"
