    used_for: "Official classification boundary includes aqueous or ammoniacal mixtures; supports narrower proposal, not recipe or methodology approval"
  - id: "eu-lvic-aaf-2007"
    type: "official_guidance"
    reference: "[European Commission LVIC-AAF BREF, August2007](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf), §§8.1,8.2.2/Figure8.2,8.4.14,8.5; printed323,326,361–362; PDF351,354,389–390"
    used_for: "Received-solution continuous mixing/pH/cooling/storage; alternative integrated route exclusions. Urea finishing, consumption and treatment figures are not this route's defaults. BREF cites EFMA2000 and is not independent of that source"
  - id: "efma-uan-2000"
    type: "handbook"
    reference: "[EFMA Production of Urea and Urea Ammonium Nitrate, Booklet5,2000](https://www.fertilizerseurope.com/wp-content/uploads/2019/08/Booklet_5_final.pdf), §§9.1–9.5,9.8/Figures6–7; printed29–32; PDF31–34"
    used_for: "Actual mixing-route decomposition, conditional corrosion inhibition/equipment protection, pH reagents, utility/containment/recycle and process monitoring. Historical recipe/grade/utility data and achievable zero emissions are conditional observations, not universal values"
  - id: "yara-uan32"
    type: "handbook"
    reference: "[Yara UAN-32 SOLUTION](https://www.yara.us/crop-nutrition/fertilizer-products/other-fertilizers2/uan-32-solution/), product description and Nutrients, accessed2026-10-14"
    used_for: "Producer original confirms commercial liquid UAN and three N forms. One product; no route, absence of additives, universal formula, quantity or target-site claims"
