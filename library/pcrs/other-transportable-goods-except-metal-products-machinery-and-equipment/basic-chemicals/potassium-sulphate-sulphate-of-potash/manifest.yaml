review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  identity_boundary:
    product: "Uncoated bulk solid powdered K2SO4 fertilizer from fossil pipeline gas-fired Mannheim conversion with aqueous HCl recovery. No existing material same-product methodology found; retained unpublished scaffold promoted."
    classification_relation: "Proposed narrower: excludes natural sulfate/brine recovery, wet metathesis, double salts, mixtures, coated/granulated and liquid formulated products. Mapping acceptance belongs to independent controller review."
  unresolved_flow_uuids:
    - row_id: "acidic_purge"
      selected_flow: "Acidic chloride-sulfate aqueous purge"
      reason: "Bounded Waste-flow search returned high-concentration organic/NaCl saline wastewater with incompatible scope; no exact Mannheim acid purge identity confirmed. Collect actual composition, receiver and treatment acceptance; no substitute UUID."
    - row_id: "sop_dust"
      selected_flow: "Captured inorganic potassium-sulphate waste dust"
      reason: "Grinding/sieving dust has a feed-grade route; acid-mist, municipal and wood dust candidates do not establish this inorganic K2SO4 disposal identity. Confirm composition, contamination and receiver before adopting an exact Waste flow."
  provider_quantity_requirements:
    - row_id: "kcl"
      reason: "Confirmed solid KCl identity has Volume reference. Actual bulk/solid volume convention, packing, measured mass-volume relation and supplier background reference basis are future collection requirements; unknown basis prevents complete linkage."
    - row_id: "gas"
      reason: "Confirmed gaseous pipeline natural gas has Volume reference; actual T/P, moisture/composition/Z and supplier m3 reference definition required. Secondary Mass coefficient is not density."
    - row_id: "electricity"
      reason: "Adopted grid consumption-mix identity is 1–35 kV and Net calorific value/MJ. Verify actual interface/provider/losses; another voltage requires a separately verified identity."
    - row_id: "sulfuric"
      reason: "Selected industrial H2SO4 solution is 93–98% concentration. Measure actual solution assay and match supplier solution/active-acid denominator; no nominal concentration default."
    - row_id: "hcl_product"
      reason: "Broad aqueous-HCl Mass identity requires actual concentration, accepted grade, receiver/function and solution-basis price. It is not pure gas HCl."
  source_metadata_issues:
    - row_id: "sulfuric"
      flow_uuid: "7ee2e3c3-bee7-4520-92b7-3e23afbfcd6f"
      reason: "Name, CAS7664-93-9 and the 93–98% solution grade identify H2SO4. Native CPC34231 wording includes this inorganic acid and is not a demonstrated classification conflict. Its explanatory comment incorrectly describes SO3 oxidation as manufacture; no mechanism or quantity is inferred from that sentence. Actual supplier grade/quantity compatibility and source-comment clarification remain separate."
  measurement_requirements:
    - "Future site measurements, actual SKU/assays and supplier data are required before a complete foreground dataset; source and identity verification do not assert current industrial quantities."
    - "NO/NO2 speciation, matching NOx quantity definition, non-overlapping size fractions and aerosol chemical partition must be demonstrated; aggregate monitoring alone does not close the atomic amounts."
    - "Maintain unallocated K/Cl/S/water/fossil-carbon accounts and stage links separately from allocated burden. Conditional absence requires actual stream evidence; new relevant species/materials require atomic extensions."
  scientific_review: "Independent methodology and translation review not yet performed; no active, reviewed or published claim."
