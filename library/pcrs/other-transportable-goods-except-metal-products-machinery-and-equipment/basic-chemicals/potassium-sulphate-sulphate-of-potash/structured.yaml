allocation_rules:
  - rule_id: allocation_physical_ledger
    applies_to: "mannheim"
    rule: "Preserve unallocated measured KCl/acid/water/carbon balances, full SOP output P and full accepted HCl solution output H. Never multiply physical product/co-product masses, internal links or measured capture efficiency by a burden share. Residual waste has a documented receiver/treatment; neutralising acid for disposal does not turn it into a saleable co-product."
    source_ids:
      - mannheim-patent
      - ham-recovery
      - ilcd-allocation
  - rule_id: allocation_hierarchy
    applies_to: "mannheim"
    rule: "Declare attributional study goal, functions and treatment of multifunctionality. First subdivide or assign independently metered operations: SOP finishing to SOP, acid-only concentration/storage to acid, shared furnace and capture functions identified. Apply physical causal relationships to residual shared burdens only with evidence that the selected property determines those burdens; stoichiometry or wet acid mass alone is not that evidence. If these relationships cannot be justified, use the economic fallback for accepted positive-value co-products, with sensitivity. System expansion needs a separately justified goal, actual substitutable acid grade/provider and disclosed scenario; never combine substitution credits and allocation for the same coproduct."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_economic
    applies_to: "mannheim"
    rule: "For remaining inseparable shared burden B, use a_S = V_S/(V_S+V_H), V_S = P times p_S, V_H = H times p_H, and a_H = 1-a_S. P and H are accepted as-supplied physical quantities; net plant-gate prices p_S and p_H are per kg of those exact grades at the same market/time/currency, weighted over actual sales. Acid carrier water and concentration must match its quoted grade; artificial dilution must not alter value. Retain both allocated ledgers, reconcile their sum to B and disclose price sensitivity. Unknown prices, zero/negative total value or disposal/captive-use cases require explicit methodological review, not a default split or zero acid burden."
    source_ids:
      - ilcd-allocation
      - ham-recovery
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "mannheim"
      flow_role: "SOP and accepted HCl solution"
      record_type: "weighing and laboratory records"
      raw_fields: "accepted SOP net mass P; returns/reacceptance; opening/closing finished and WIP stocks; production history and carried inventory burdens; lot/SKU; moisture; assay basis; chloride/acidity/insolubles; HCl solution H and mass fraction; receiver acceptance"
      collection_method: "Calibrated scales or reconciled mass-flow meters, lot sampling and laboratory assay; track rejected stocks and internal transfers separately; reporting procedure: Divide campaign boundary quantities by P kg accepted SOP output; report per 1 kg reference flow; H remains full solution quantity before allocation"
      unit: "kg; mass fraction"
      frequency: "Each lot and transfer"
      temporal_coverage: "Full representative campaign, startup/shutdown and off-spec periods retained"
      site_scope: "Same plant and product route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; assay method/results; stock reconciliation; receiver acceptance"
    - protocol_id: cp_feed
      process_id: "mannheim"
      flow_role: "KCl and sulfuric solution"
      record_type: "receipt, dosing and laboratory records"
      raw_fields: "mass; measured volume; lot; supplier; assay; moisture; acid concentration; KCl bulk/solid-volume convention and packing; feed/recycle stocks"
      collection_method: "Calibrated weighing/dosing and paired volume measurements; representative composition sampling; reconcile actual consumed receipts/stocks with stage transfers; reporting procedure: Sum external feed consumed with stock reconciliation; convert only on measured compatible property basis; divide by P; per 1 kg reference flow"
      unit: "kg; m3; mass fraction"
      frequency: "Each receipt/batch; dosing logs continuous where available"
      temporal_coverage: "Same campaign as cp_output"
      site_scope: "Same plant feed receipt/dosing interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; density/packing method; certificate of analysis; supplier reference-basis confirmation"
    - protocol_id: cp_utilities
      process_id: "mannheim"
      flow_role: "gas and electricity"
      record_type: "submeter and supplier records"
      raw_fields: "actual meter readings; gas T/P/wet-dry/composition/Z; supplier reference state; NCV/GCV; voltage; loss boundary; stage loads; hours/startup"
      collection_method: "Calibrated stage submetering; supplier bills and actual gas composition/calorimetry; reconcile to plant master meters and attributable operating records; reporting procedure: Sum attributable supplied quantities once; convert to verified supplier basis; divide by P; per 1 kg reference flow"
      unit: "m3; kWh; MJ"
      frequency: "Continuous or shift readings and billing reconciliation"
      temporal_coverage: "Complete campaign including startup, shutdown and controls"
      site_scope: "Furnace, auxiliaries, acid recovery and powder stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; supplier specification; reconciliation and attribution evidence"
    - protocol_id: cp_water
      process_id: "mannheim"
      flow_role: "supplied water, cooling and air return"
      record_type: "meter and water/heat balance records"
      raw_fields: "inflow/makeup; circulation separately; return; purge; evaporation; leak; water incorporated in acid; inlet moisture; temperatures; density; water origin"
      collection_method: "Calibrated inlet/outlet meters and validated evaporation/heat-water balance; partition absorption and cooling, and combustion-generated water; reporting procedure: Sum net external supplies/returns by identity and origin; exclude internal circulation; divide by P; per 1 kg reference flow"
      unit: "kg; m3; temperature"
      frequency: "Shift/continuous plus each purge"
      temporal_coverage: "Full matched campaign"
      site_scope: "Absorbers, cooling, cleaning and their verified supply/discharge interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; density; balance residual and uncertainty; cooling design"
    - protocol_id: cp_air
      process_id: "mannheim"
      flow_role: "each emitted species and particle interval"
      record_type: "source testing, monitoring and loss records"
      raw_fields: "outlet/source; actual gas flow; concentrations; species/CAS; T/P; dry/wet; oxygen basis; time/load; HCl/H2SO4; NO/NO2 split; N2O; PM cumulative sizes and chemical partition; VOC speciation; fugitives"
      collection_method: "Compatible source tests/continuous monitors and documented representative campaigns; integrate concentrations and gas volumes on the same reference state; speciate aggregate reports before linking; reporting procedure: Sum each compatible pollutant load once after control; partition non-overlapping sizes/chemical mass; divide by P; per 1 kg reference flow"
      unit: "kg species; mg/m3; m3; time"
      frequency: "Continuous where installed; otherwise representative tests covering load, controls and abnormal periods"
      temporal_coverage: "Same campaign; include diffuse and startup/shutdown scope"
      site_scope: "Each reaction, absorption, combustion and powder outlet; outdoor releases"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original monitoring reports, methods/calibration, temporal representativeness, detection limits, conversion evidence"
    - protocol_id: cp_carbon
      process_id: "mannheim"
      flow_role: "fossil CO2 and carbon closure"
      record_type: "gas composition and carbon account"
      raw_fields: "carbon in gas; carbon in emitted CO2/CO/CH4/speciated VOC; stocks; unburned carbon; fossil/biogenic origins"
      collection_method: "Calibrated gas delivery with actual composition; independently reconcile measured combustion emissions and any other carbon-bearing input; reporting procedure: Reconcile carbon before burden allocation, derive compatible CO2 mass where necessary and divide by P; per 1 kg reference flow"
      unit: "kg C; kg species; m3"
      frequency: "Campaign with operating-period reconciliation"
      temporal_coverage: "Same campaign as cp_output"
      site_scope: "Actual fossil-gas boundary and any justified extension"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Gas analysis; measurement uncertainty; closure residual; no default oxidation fraction"
    - protocol_id: cp_waste
      process_id: "mannheim"
      flow_role: "acidic purge and captured SOP dust"
      record_type: "weighing, assay and transfer records"
      raw_fields: "actual amount; wet/dry; composition; pH; chloride/sulfate/acidity; contaminants; internal return; receiver; treatment route; waste acceptance"
      collection_method: "Weigh/sampling each dispatch; meter/assay liquids; reconcile recovered material against stocks and disposal receipts; reporting procedure: Sum actual exported waste once; exclude internal recovery; divide by P; per 1 kg reference flow"
      unit: "kg; mass fraction"
      frequency: "Each transfer"
      temporal_coverage: "Full campaign including maintenance and rejects"
      site_scope: "Actual plant waste outlets and named handlers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighbridge/handler receipt; composition; provider treatment scope; unresolved identity disclosure"
    - protocol_id: cp_discharge
      process_id: "mannheim"
      flow_role: "liquid water, chloride and sulfate to fresh water"
      record_type: "outfall metering and laboratory records"
      raw_fields: "outfall/receiver medium; liquid volume; temperature; density; chloride/sulfate concentrations; other actual constituents; treatment scope; discharge periods"
      collection_method: "Meter actual direct fresh-water return and obtain compatible flow-weighted laboratory samples; external waste transfers excluded; reporting procedure: Integrate each measured species and water volume at outfall; divide by P; per 1 kg reference flow"
      unit: "m3; mg/L; kg species"
      frequency: "Matched samples/flows, continuous flow where possible, each abnormal discharge"
      temporal_coverage: "Same representative campaign"
      site_scope: "Verified environmental outfall only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Receiving-medium evidence; original analysis; calibration; treatment boundary and completeness"
    - protocol_id: cp_allocation
      process_id: "mannheim"
      flow_role: "co-product burden attribution"
      record_type: "stage submeter, function and sales records"
      raw_fields: "accepted grades; P; H; prices by grade; period/currency; positive-value receipts; functions; independent stage burdens; causal evidence"
      collection_method: "Reconcile accepted products and stage meters to actual matched sales/captive functions; assess allocation hierarchy and justified alternatives; reporting procedure: Preserve physical per 1 kg reference flow ledger; assign only environmental burdens using declared hierarchy, exact-grade values and sensitivity"
      unit: "kg; currency/kg; actual burden units"
      frequency: "Each sale/lot and campaign aggregation"
      temporal_coverage: "Same physical campaign with declared market-price coverage"
      site_scope: "Same plant-gate grades and actual co-product receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Price receipts; functional acceptance; stage evidence; conservation of allocated burdens"
  calculation_rules:
    - id: normalization
      applies_to: "all inventory rows"
      rule: "a_j = X_j/P; sum raw boundary quantities X_j of each exchange over the complete same route, supplied grade and campaign, including attributable failed/zero-output intervals, startup/shutdown, cleaning and rework, then divide once. P must be positive accepted net SOP kg from cp_output, credited once after returns/reacceptance, finished-stock and WIP reconciliation. Preserve production history and carried stock/WIP burdens so attribution covers the same accepted output; burden adjustments do not erase raw physical exchanges or scale HCl output. Do not average successful-interval ratios or divide already normalized per-kg values again; protocol reporting steps state this final basis. If P is zero, retain totals and disclose no unit result rather than divide or omit burdens. Keep each verified numerator property/unit; sop output is 1 kg."
      inputs:
        - cp_output
        - "linked row protocol"
        - "actual quantities"
      output: "Per 1 kg reference flow inventory with original numerator unit"
      source_ids:
        - lvic-aaf
        - cww-bref
    - id: substance_accounts
      applies_to: "sulfuric; hcl_product; acidic_purge; kcl; sop"
      rule: "m_substance = m_solution_or_product times measured mass fraction on the same wet/dry basis; m_water is separately measured/derived with full composition reconciliation. Retain K, Cl and S balances: 2KCl + H2SO4 → K2SO4 + 2HCl is a reaction-account identity, not measured consumption/yield. Track impurities, unconverted KCl/KHSO4, free acid, stocks, dust and purge; require actual route-compatible elemental assays."
      inputs:
        - cp_feed
        - cp_output
        - cp_waste
        - cp_water
      output: "Unallocated physical material/element accounts and residual uncertainty"
      source_ids:
        - mannheim-patent
        - cww-bref
    - id: meter_conversion
      applies_to: "gas; kcl; electricity; process_water; cooling_water"
      rule: "Use compatible measured density for mass-volume conversions; gas V_ref = V_meter times (p_meter/p_ref) times (T_ref/T_meter) times (Z_ref/Z_meter), with absolute p and kelvin T and separately reconciled moisture/composition. Electricity MJ = 3.6 times measured kWh. A conversion is unavailable if its supplier reference convention is unknown."
      inputs:
        - cp_feed
        - cp_utilities
        - cp_water
        - "provider definitions"
      output: "Supplier-compatible exchange quantities and independent energy QA"
      source_ids:
        - lvic-aaf
    - id: air_loads
      applies_to: "hcl_air; h2so4_air; ch4_fossil; n2o_air; co_fossil; no_air; no2_air; so2_air; pm25_air; pm25_10_air; pmover10_air; benzene_air; formaldehyde_air"
      rule: "L_i = sum(C_i,k times V_k times 10^-6) for mg/m3 and matched m3. Correct gas T/P, wet/dry and oxygen reference consistently before integration. PM2.5–10 = compatible cumulative PM10 minus PM2.5; >PM10 = compatible total minus PM10. Subtract identified chemical-aerosol portions only within measured matching size bins; retain physical totals and partition uncertainty. Unknown speciation/size splits remain unresolved."
      inputs:
        - cp_air
      output: "kg of each non-duplicated species/particle interval"
      source_ids:
        - cww-bref
        - epa-gas
    - id: carbon_account
      applies_to: "co2_fossil"
      rule: "Reconciled emitted CO2 mass = accounted emitted fossil carbon in CO2 times molecular mass CO2/atomic mass C; deduct measured carbon in CO/CH4/other species and stocks from a fuel-carbon balance, or use a compatible direct CO2 measurement once. No boiler oxidation default."
      inputs:
        - cp_carbon
        - cp_air
      output: "Fossil CO2 and physical carbon closure"
      source_ids:
        - epa-gas
        - lvic-aaf
    - id: water_loads
      applies_to: "chloride_water; sulfate_water; water_liquid; water_vapor_air"
      rule: "Dissolved load kg = sum(concentration mg/L times matched discharge m3 times 10^-3). Liquid water is the measured returned volume; vapour is actual attributed net water return, with combustion-water origin retained. Keep exported wastewater and its treatment emissions in the receiving system once."
      inputs:
        - cp_discharge
        - cp_water
        - cp_waste
      output: "Water-return quantities and dissolved-ion loads with explicit receiver"
      source_ids:
        - cww-bref
        - ham-recovery
    - id: burden_allocation
      applies_to: "all inventory rows"
      rule: "Keep physical X_j and product outputs intact. For attributable burden after stage subdivision apply the evidenced physical share or economic share in allocation_economic; SOP burden = SOP-only burden + a_S times shared burden; acid ledger receives its own assigned burden plus a_H times shared burden. Reconcile both accounts to total and normalize the SOP account by P."
      inputs:
        - cp_allocation
        - cp_output
        - "stage burdens"
      output: "Allocated environmental-burden account distinct from the physical exchange ledger"
      source_ids:
        - ilcd-allocation
  data_quality_requirements:
    - id: dq_scope
      applies_to: "all inventory rows"
      requirement: "Verify actual route, material states, assayed grades and receivers; conditional absence requires site evidence. Record each additional actual species/material independently."
      evidence: "Plant diagram; SKU/assay; stream inventory and original source applicability"
    - id: dq_basis
      applies_to: "all inventory rows"
      requirement: "P, collection period and aggregation must match. Preserve actual supplier quantity conventions and distinguish verified identity from a compatible complete provider dataset."
      evidence: "Meter/scale calibration; stocks; original provider/reference-unit definition"
    - id: dq_balances
      applies_to: "mannheim"
      requirement: "Close unallocated K/Cl/S, water and fossil-carbon accounts with documented residuals, measurement uncertainty and recovery/stock terms; a deficit is investigated, not filled with invented yields."
      evidence: "cp_feed; cp_output; cp_water; cp_waste; cp_carbon"
    - id: dq_emissions
      applies_to: "all environmental outputs"
      requirement: "Actual compartment/species/size and monitoring coverage must be justified; aggregate NOx, VOC or PM evidence does not automatically identify exact atomic quantities. Below detection retains limit/method, not an unexplained zero."
      evidence: "cp_air; cp_discharge; cww-bref"
    - id: dq_sources
      applies_to: "all rules"
      requirement: "Preserve original evidence limitations. Historical plant cases, patent operating parameters and commercial grade properties are not universal factors or survey ranges."
      evidence: "Source edition/pages and scope; actual site collection protocols"
    - id: dq_links
      applies_to: "kcl; gas; sulfuric; acidic_purge; sop_dust"
      requirement: "Resolve KCl volume convention, gas reference state, acid-grade/provider concentration and source explanatory-comment defect, and compatible waste identity/treatment before claiming a complete linked data package."
      evidence: "Provider clarification; actual measurement; waste acceptance"
validation_rules:
  - rule_id: validate_reference
    applies_to: "sop"
    rule: "Require exactly one final reference output of 1 kg accepted as-supplied SOP, same identity and denominator in both languages; exclude packaging, off-spec stocks and internal transfers. Require all category qualifiers."
    source_ids:
      - tess-sop-grade
      - mannheim-patent
  - rule_id: validate_balances
    applies_to: "mannheim"
    rule: "Verify measured unallocated material, water and carbon balances and matching internal links before allocation; investigate residuals with uncertainty. Do not enforce ideal reaction yield, pure product, universal consumption or single-plant emission performance as a default."
    source_ids:
      - mannheim-patent
      - lvic-aaf
      - cww-bref
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Require one physical exchange per row, exact species/material/medium and verified property/unit chain for adopted UUIDs; no substituted feed-grade dust, organic saline wastewater, correction flow, overlapping particle ranges or duplicate ionic/speciated totals. Blank waste UUIDs are explicit unresolved identity gaps."
    source_ids:
      - cww-bref
  - rule_id: validate_quantity_links
    applies_to: "all inventory rows"
    rule: "Normalize physical quantities consistently by P; require supplier-basis compatibility for KCl volume, natural-gas state, electricity voltage/losses, acid concentration and water definitions. A name match or mass-to-volume factor without an actual compatible measurement/provider basis does not close the link."
    source_ids:
      - lvic-aaf
      - cww-bref
  - rule_id: validate_allocation
    applies_to: "mannheim"
    rule: "Separate physical outputs from allocated burden; justify hierarchy and exact-grade values/causality, conservation and sensitivity. No arbitrary mass split, fabricated price, negative-value fallback or duplicate substitution credit."
    source_ids:
      - ilcd-allocation
  - rule_id: validate_completeness
    applies_to: "mannheim"
    rule: "Disclose measurements performed, missing identities/providers/speciation, included/excluded scope, conditional absence and unresolved uncertainty. A complete dataset claim fails until every relevant exchange, fate and measurement is resolved; methodology authoring does not certify a collected industrial dataset."
    source_ids:
      - cww-bref
      - ilcd-allocation
published_dataset_profile:
  dataset_role: "Site-specific attributional foreground process dataset for specified Mannheim bulk powder, with separately retained physical and co-product burden accounts"
  downstream_use: "Link compatible SOP manufacture to upstream supply and declared downstream fertilizer use; use actual mass/assay, not a nutrient-only substitution"
  allowed_use: "Selected gas-fired solid-powder route and exact declared plant/grade/campaign, with transparent provider/identity completeness"
  excluded_use: "Natural sulfate recovery, wet metathesis, double salts, mixtures, coatings, granulation, liquid formulation, generic fertilizer efficacy or all-route SOP comparison without additional methodology"
  required_metadata: "All reference qualifiers; full stage map; supplier quantity bases; accepted HCl grade/function/amount; co-product allocation; emissions/receiver compartments; waste routes; time/geography; sources and calibration"
  required_quality_disclosure: "Actual measurement/estimate coverage; unresolved identities and providers; assay/stock/balance uncertainty; price/speciation sensitivity; environmental and technology cutoffs; reviewed methodology state separate from dataset quality"
  update_trigger: "Route/fuel, grade, coating/granulation, supplier quantity convention, gas state, utility voltage, acid recovery/use, controls/waste fate or monitoring changes"
data_sources:
  - id: "un-cpc-sop"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, code 34632, [official detail](https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/34632)"
    used_for: "Official product label/hierarchy only; no manufacturing route or PCR identity approval"
  - id: "mannheim-patent"
    type: "literature"
    reference: "Tessenderlo Group NV, EP3680217A1, 15 July 2020, pp. 1–5, paragraphs 0002, 0006–0013, 0030, 0045, 0053–0061; [original patent](https://patentimages.storage.googleapis.com/1e/0d/d5/f1696137d404f9/EP3680217A1.pdf)"
    used_for: "Reaction stages, separate combustion, HCl co-product, natural-gas example, NO/NO2 distinction; patent performance/recipe values excluded as defaults"
  - id: "tess-sop-grade"
    type: "literature"
    reference: "Tessenderlo Kerley, SoluPotasse sell sheet, ©2025, pp. 1–2, [producer original](https://www.tessenderlokerley.com/sites/tg_kerley/files/files/2025-04/solupotasse-sell-sheet-digital.pdf)"
    used_for: "Actual dry fine-powder commercial state and need to distinguish nutrient, product and loose/struck bulk-density bases; one SKU, no generic numerical properties adopted"
  - id: "ham-recovery"
    type: "literature"
    reference: "Alfa Laval, Efficient DIABON plate heat exchangers give Belgium fertilizer plant license to operate, historical Ham plant case (equipment since 2011; page retrieved 2026-10-14), sections A valuable by-product, DIABON plate heat exchangers and Mission accomplished; [supplier original](https://www.alfalaval.us/media/stories/fertilizers/efficient-diabon-plate-heat-exchangers-give-belgium-fertilizer-plant-license-to-operate/)"
    used_for: "Water absorption, aqueous acid cooling/product versus contaminated purge; case-specific equipment/zero-waste claims not transferred"
  - id: "lvic-aaf"
    type: "official_guidance"
    reference: "European Commission, LVIC–AAF BREF, August 2007, Scope and §§1.4.8, 1.5.1 (PDF pp. 27, 51, 61; printed xxv, 23, 33), [official original](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-03/LVIC-AAF.pdf?download=1)"
    used_for: "Common fertilizer-site energy audits and physical water/CO2 accounts; no ammonia/NPK recipe, boiler or steam quantity applied to SOP"
  - id: "cww-bref"
    type: "official_guidance"
    reference: "European Commission, Common Waste Water and Waste Gas Treatment/Management Systems in the Chemical Sector BREF, 2016, chapter 4 BAT 2–5, 7–11 (PDF pp. 573–574, 576–578; printed 543–544, 546–548), [official original](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/CWW_Bref_2016_published.pdf)"
    used_for: "Chemical stream inventories, actual species/concentration/flow, water interfaces, treatment and monitoring; no site emission default"
  - id: "epa-gas"
    type: "official_guidance"
    reference: "US EPA, AP-42 §1.4 Natural Gas Combustion, hosted PDF retrieved 2026-10-14 with page footers 10/26, disclaimer and §1.4.3, PDF pp. 1–3; [official original](https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf)"
    used_for: "Combustion species screening and source-testing limitations; boiler factors, fuel composition, heating value and oxidation assumptions are not Mannheim quantities"
  - id: "ilcd-allocation"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA, Detailed guidance, first edition March 2010, §7.9.3 (PDF pp. 277, 283, 286–287; printed 257, 263, 266–267), [official original](https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf)"
    used_for: "Declared-goal multifunctionality, subdivision, demonstrated physical causality and economic fallback; no default SOP/HCl burden split"
