system_boundary:
  rules:
    - rule_id: boundary_reaction
      applies_to: "mannheim"
      rule: "Include receipt/storage, feed preparation/dosing, the two chemical stages, separated combustion, actual cooling/powder finishing, capture/absorption of HCl, water-only gas treatment, bulk storage and all attributable utilities, startup/shutdown and maintenance losses. Common BAT and a patent design are scope evidence, not generic operating defaults."
      source_ids:
        - mannheim-patent
        - lvic-aaf
        - cww-bref
    - rule_id: boundary_internal
      applies_to: "mannheim"
      rule: "Keep reaction-gas/absorption, powder finishing and internal cooling in one foreground unit with separate stage meters. Retain same-quantity internal transfer endpoints and recycled dust/acid/water logs; only net boundary crossings are inventory exchanges. This avoids assigning the reference UUID to multiple intermediate outputs."
      source_ids:
        - mannheim-patent
        - ham-recovery
        - cww-bref
    - rule_id: boundary_waste_water
      applies_to: "mannheim"
      rule: "Distinguish accepted aqueous HCl, internal recovered liquid, exported acidic waste and actual environmental discharge. Include waste treatment links once. For direct discharge collect receiving medium, species loads, temperature and flow; external treatment is not immediate freshwater emission. A historical closed-cooler case does not prove no purge at another plant."
      source_ids:
        - ham-recovery
        - cww-bref
    - rule_id: boundary_complete
      applies_to: "mannheim"
      rule: "Maintain source-based waste-gas/water inventories; add each additional confirmed reagent, emitted species, packaging component or waste as its own verified atomic exchange. The listed conditional rows neither prescribe positive emissions nor establish exhaustive site completeness. Excluded capital equipment, downstream transport/use/end-of-life and any material cutoff must be disclosed with a study-specific relevance assessment; hazardous/material omissions are not justified by a fixed cutoff percentage."
      source_ids:
        - cww-bref
        - ilcd-allocation
