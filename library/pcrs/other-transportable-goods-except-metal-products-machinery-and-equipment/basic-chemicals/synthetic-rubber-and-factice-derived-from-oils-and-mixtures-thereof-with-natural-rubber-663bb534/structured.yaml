allocation_rules:
  - rule_id: allocation_recycle
    applies_to: "all inventory rows"
    rule: "Prefer subdivision and physical-causal metering. Internal monomer, mother liquor, latex and rework are not coproducts and receive no avoided-burden credit. Retain failed/zero-output, startup/shutdown, cleaning and rework burdens in the matched cohort; reacceptance after actual terminal release creates no new Q."
    source_ids:
      - epa-ap42-sbr
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_outputs
    applies_to: "all inventory rows"
    rule: "Externally sold recovered monomer or independently accepted secondary rubber needs separate true product rows, amounts, quality, destination and burden allocation. Avoid allocation where feasible; otherwise disclose the justified physical relation, or justify alternatives and sensitivity when physical relations are unsuitable. Waste rubber/water is not automatically a coproduct; a sale is not automatically a negative emission."
    source_ids:
      - epa-sbr-1996
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "esbr_line"
      flow_role: "product"
      record_type: "quality_release"
      raw_fields: "lot/bale ID; grade; route; first positive release date; net mass; packaging tare; assay; moisture; WIP opening/closing; finished-stock opening/closing; returns; burden carryover"
      collection_method: "Owner: quality manager with production accountant. Calibrated net-bale weighing and release certificates establish raw Q. Record all batches including failed and zero-output runs, withdrawals and rework; attach opening/closing WIP and finished-stock quantities/compositions and carried upstream burdens without normalization. Reconcile independent warehouse/dispatch movements; do not add closing finished stock to already counted Q."
      unit: "kg"
      frequency: "every lot and continuous interval"
      temporal_coverage: "same complete period and product/route/state cohort"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, ledgers, assays and stock/burden reconciliation"
    - protocol_id: cp_material
      process_id: "esbr_line"
      flow_role: "material"
      record_type: "receipt_and_stock"
      raw_fields: "stage; row_id; period; lot; supplied whole mass; purity/solids; species; carrier water; hydration; opening/closing stock; fresh receipt; recycle; spills; WIP carried inputs"
      collection_method: "Owner: materials accountant and stage operator. Collect un-divided raw receipts, weighings, stock movements and stage dosing; reconcile purchased whole formulation against constituent subledgers. Preserve all burdens for failed runs/rework and opening/closing WIP; no A/Q in collection. Actual additional chemicals and packaging get separate atomic rows."
      unit: "kg; m3"
      frequency: "every lot and continuous interval"
      temporal_coverage: "same complete period and product/route/state cohort"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, ledgers, assays and stock/burden reconciliation"
    - protocol_id: cp_utility
      process_id: "esbr_line"
      flow_role: "utility"
      record_type: "meter_and_operation"
      raw_fields: "stage; row_id; meter start/end; integrated volume; rate; duration; density; kWh; steam mass; pressure; temperature; enthalpy; condensate; fuel; carryover burden; storage/loading period"
      collection_method: "Owner: utilities engineer. Retain complete raw interval meters and stage logs for all production/recovery/drying/control/storage/loading including failures and standby; reconcile shared meters and carried burdens. Preserve raw integrated quantities and conversion evidence without dividing by Q. Track directly injected steam water and condensate separately from purchased heat."
      unit: "MJ; kWh; kg; m3"
      frequency: "every lot and continuous interval"
      temporal_coverage: "same complete period and product/route/state cohort"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, ledgers, assays and stock/burden reconciliation"
    - protocol_id: cp_output
      process_id: "esbr_line"
      flow_role: "waste"
      record_type: "weigh_and_analyse"
      raw_fields: "row_id; stream; stage; wet mass; moisture; species; Na/Cl/S; carbon; residual monomer; COD; treatment destination; rejects; recycled amount; opening/closing WIP"
      collection_method: "Owner: environment manager and waste custodian. Weigh each outgoing waste independently and retain analyses/manifests; record liquid whole mass and constituents separately. Retain untreated/treated interface and all failures, reject/rework movements and WIP burdens as raw period totals, without A/Q or residual-fitting."
      unit: "kg; m3; mg/L"
      frequency: "every lot and continuous interval"
      temporal_coverage: "same complete period and product/route/state cohort"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, ledgers, assays and stock/burden reconciliation"
    - protocol_id: cp_emission
      process_id: "esbr_line"
      flow_role: "emission"
      record_type: "monitor_and_speciate"
      raw_fields: "row_id; species; stage; air/water compartment; sample method; concentration; flow; integrated gas volume; duration; moisture; standard/actual state; capture/destruction; fossil/biogenic carbon; WIP burden"
      collection_method: "Owner: environmental measurement lead. Collect raw representative species-specific tests plus complete matched flow records for normal and abnormal operations. Reconcile captured/recycled/destroyed material and actual reaction evidence. Raw concentration times matched integrated volume requires no extra time multiplication; no normalization during collection. Additional actual NO, CO, SO2, particulate or reagent emissions require separate cards."
      unit: "kg; mg/m3; m3"
      frequency: "every lot and continuous interval"
      temporal_coverage: "same complete period and product/route/state cohort"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, ledgers, assays and stock/burden reconciliation"
  calculation_rules:
    - id: report_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q; A_i is the complete matched raw-period numerator after raw-unit conversion and cohort attribution, including opening WIP carried burdens less closing WIP carried burdens, failed/zero-output runs, rework, losses and actually included storage/packing/dispatch burdens. Reconcile finished-warehouse burdens and internal handoffs separately; never add closing finished stock already in Q as further production. Q is first positive released net mass from cp_release and must exceed zero. This is the sole division; cards and aggregation_rule point to this same reporting operation, never successive divisions. Reference output is 1 kg."
      inputs:
        - A_i
        - Q
        - cp_release
        - cp_material
        - cp_utility
        - cp_output
        - cp_emission
      output: "a_i"
      source_ids:
        - epa-ap42-sbr
        - epa-sbr-1996
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "Production cohort: opening WIP + actual external inputs + internal receipts = released Q + other real outlets + closing WIP + internal transfers out. Keep finished warehousing separate and cancel handoffs on consolidation. Reconcile whole physical mass independently, then audit elements by species composition; conversion of monomer into rubber is not water formation. Retain unexplained differences as uncertainty and investigation."
      inputs:
        - cp_release
        - cp_material
        - cp_output
        - cp_emission
      output: "physical_and_element_ledger"
      source_ids:
        - epa-ap42-sbr
        - epa-sbr-1996
    - id: raw_convert
      applies_to: "all inventory rows"
      rule: "Raw volume times measured density yields mass; interval concentration times integrated volume at matching conditions yields species mass after unit conversion; only rates receive duration multiplication. Water/active/carrier subledgers are not further purchases; retain steam mass, enthalpy and condensate without duplicate mass/heat procurement. Raw conversion precedes report_once and never divides by Q."
      inputs:
        - cp_material
        - cp_utility
        - cp_emission
      output: "converted_raw_numerators"
      source_ids:
        - epa-sbr-1996
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Retain complete native name components, CAS, route, state, geography/supply location, medium and property/unit; judge actual supplier/background compatibility independently. Reference identity fixes 23% styrene and emulsion route with disclosed 36220 classification debt; absent geography does not establish global applicability."
      evidence: "native identities; supplier certificates; actual grade assay"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Retain failed/zero-output runs, rework, WIP, finished stock and carried burdens; actual reagent/emission burdens cannot be deleted because unlisted or UUID-unmatched. Complete atomic expansion before producing quantitative data."
      evidence: "complete period and stage ledgers"
    - id: dq_reaction
      applies_to: "all inventory rows"
      requirement: "Actual reaction species and water formation/consumption require evidence independently of water/element closure; measure residual monomer, volatilization and wastewater. Historical sources check route only. No site data means no claim of a completed LCI."
      evidence: "assays; reaction evidence; independent measurements"
validation_rules:
  - rule_id: validate_reference
    applies_to: "product"
    rule: "Only product is the terminal reference Product output and its UUID must match the reference. Require 23% bound styrene, emulsion route, dry form, non-oil extension, uncured state and production release gate consistently; intermediates/coproducts sharing a UUID or reacceptance cannot create output."
    source_ids:
      - epa-ap42-sbr
  - rule_id: validate_period
    applies_to: "all inventory rows"
    rule: "Reconcile all raw-period numerators, stock and WIP carryover; Q > 0 with cohort deduplication. Release and net delivery quantities remain independent; forbid Q plus same-cohort closing finished stock. Retain actual storage/packing/dispatch/rework burdens, cancel consolidated handoffs and execute report_once once."
    source_ids:
      - epa-ap42-sbr
  - rule_id: validate_species
    applies_to: "all inventory rows"
    rule: "Check physical mass and relevant elements, whole supply/subledgers and nonduplicate water/steam. Require independent actual-species/reaction-water evidence rather than COD, residual or theoretical yield. Disclose and resolve unknown actual recipe/species rather than invent values."
    source_ids:
      - epa-sbr-1996
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Matching grade/form E-SBR as downstream rubber-compounding feedstock"
  allowed_use: "Site-evidenced 23% bound-styrene E-SBR dry-rubber production data; candidate methodology requires review"
  excluded_use: "Latex, other elastomers/routes, factice, waste plastics, compounded/vulcanized products or unverified 23.5%-grade substitution"
  required_metadata: "All reference qualifiers, protocol owners, raw-period numerators, first release Q, WIP/stock and carried burdens, species and actual supply backgrounds"
  required_quality_disclosure: "Historical-source limits, native classification debt, unresolved auxiliary UUID/backgrounds, measured coverage, unexplained differences and uncertainty"
  update_trigger: "Changes to grade/styrene content, recipe, hot/cold regime, form, reference gate, recovery, pollution control or energy supply"
data_sources:
  - id: "epa-ap42-sbr"
    type: "official_guidance"
    reference: "US EPA. AP-42 §6.10 Synthetic Rubber, August 1982, reformatted January 1995. https://www.epa.gov/sites/default/files/2020-10/documents/c06s10.pdf"
    used_for: "pp.6.10-1–6.10-3 and Fig.6.10-1: monomers, recovery, acid/brine coagulation, rinsing/dewatering/drying and bale weighing; historical generic US process only, no default temperature/conversion/emission/control efficiency."
  - id: "epa-sbr-1996"
    type: "official_guidance"
    reference: "US EPA. Locating and Estimating Air Emissions from Sources of 1,3-Butadiene, EPA-454/R-96-008, November 1996. https://www.epa.gov/sites/default/files/2020-11/documents/butadien.pdf"
    used_for: "pp.5-1–5-5, Table5-1: emulsion/solution and latex/solid distinctions, material roles, recovery, washing/drying and emission sources; main information predates 1986. Typical recipe proportions/historical emissions are not site quantities or proof of 23% finished composition."
  - id: "wo-shortstop-2014"
    type: "literature"
    reference: "WO2014052212A1. Alkyl hydroxylamine compounds and their use for shortstopping free radical polymerizations, 2014-04-03. https://patents.google.com/patent/WO2014052212A1/en"
    used_for: "Background: DEHA shortstop and stripping/recycle carryover; role/destination evidence only, not patented alternatives, dose, efficiency or actual purchase."
  - id: "us-stabilizer-2010"
    type: "literature"
    reference: "US7691927B2. Self-emulsifying liquid stabilizers, 2010-04-06. https://patents.google.com/patent/US7691927B2/en"
    used_for: "Description: phenolic antioxidants including styrenated phenol and addition before coagulation; no adoption of patented blend ratios/performance or proof of site grade, supplied composition or quantity."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, first edition March2010, §7.9.3, printed257–258/PDF277–278; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional virtual subdivision, determining physical causality and a justified alternative relationship for remaining burdens support allocation choices. No E-SBR recipe, universal product/waste share, recovery yield, substitution credit, temperature or plant quantity is supplied."
