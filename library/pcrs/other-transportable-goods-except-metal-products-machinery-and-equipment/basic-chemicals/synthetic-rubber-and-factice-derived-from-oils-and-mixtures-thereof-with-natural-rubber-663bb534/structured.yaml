measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is unique positive net dry-rubber mass first quality-released for the matched product/route/state cohort, including actual retained water/stabilizer and excluding packaging. Deduplicate bale/lot IDs; reacceptance creates no new Q. Q is neither shipment mass nor pure-polymer mass."
  - id: release_stock
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Production output already includes released Q: do not add closing finished stock of that same Q as another production output. Keep a separate warehouse/dispatch ledger: opening finished stock + release receipts + actual returns = deliveries + closing stock + actual losses. Cancel release handoffs on consolidation and carry lot burdens. Retain included storage, packaging, handling and dispatch burdens with attribution periods; never impose deliveries = Q. Changing to a net-delivery gate requires rebuilding denominator and opening/closing finished-stock burden carryover before reporting."
  - id: wet_formulation
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Purchase each whole external solution/formulation once; active, solvent, carrier water and hydration water are composition subledgers. Onsite preparation records separately acquired components, preparation energy and loss without another purchase of the prepared formulation. Convert intermediate latex and dry rubber using actual solids/moisture measurements."
  - id: unit_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass / Energy / Volume"
      uuid: ""
    required_unit: "kg; MJ; m3"
    rule: "Convert tonnes to kg by 1000 and kWh to MJ by 3.6. Convert liquid volume with measured-condition density. Rate times actual duration is valid; integrated volume receives no further duration factor. Keep steam mass, enthalpy and condensate separate; a secondary-property coefficient is not density."
  - id: species_water
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Check physical total mass and C/H/O/S/Na/Cl plus elements of the actual initiator system separately. Do not impose condensation water on addition polymerization. Any water formation/consumption in soap acidification, redox, inhibition, combustion or treatment requires independent species/reaction and measurement evidence; evaporation, hydration, free water and condensation are distinct transfers. Never fit unknown reaction water and an unknown outlet to one residual, or use COD/theoretical yield instead."
