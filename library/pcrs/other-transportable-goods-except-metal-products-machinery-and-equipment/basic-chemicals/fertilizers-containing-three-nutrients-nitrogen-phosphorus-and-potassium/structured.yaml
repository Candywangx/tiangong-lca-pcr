allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "A normal declared blend has one commercial output and no default co-product allocation. Keep the unallocated physical mass/water/N/P/K ledger distinct from any allocated environmental-burden ledger. First separate grade campaigns and dedicated equipment by measured records. Shared electricity uses submetering or measured equipment duty and campaign attribution; disclose unresolved attribution and test its sensitivity. Do not allocate input ingredient mass by nutrient percentages, mechanically reduce physical product by an allocation share, or credit internal rework. If an actual separately sold fertilizer-dust co-product exists, record its identity, quantity, quality, receiver and function, revise the waste row and review allocation independently before use."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_net
      process_id: "blend"
      flow_role: "npk_product"
      record_type: "foreground_record"
      raw_fields: "SKU; grade; gross; tare; accepted net kg; moisture; N/P2O5/K2O assays; solubility; rejected lots; starting/ending stocks"
      collection_method: "Calibrated product weighing and representative batch sampling; compare stored and delivered quality"
      unit: "kg"
      frequency: "Each batch and stage; air tests linked to represented operating periods"
      temporal_coverage: "One complete declared campaign, including starts, stops, cleaning and storage"
      site_scope: "Selected site and actual grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, certificates, raw totals and reconciliation"
    - protocol_id: cp_feed
      process_id: "blend"
      flow_role: "feed_urea; feed_map; feed_kcl"
      record_type: "foreground_record"
      raw_fields: "supplier; lot; grade; recipe; feed kg; stocks; assays; moisture; sieve analysis; compatibility evidence"
      collection_method: "Calibrated feed scales and stock reconciliation; retain actual supplier certificates and physical tests"
      unit: "kg"
      frequency: "Each batch and stage; air tests linked to represented operating periods"
      temporal_coverage: "One complete declared campaign, including starts, stops, cleaning and storage"
      site_scope: "Selected site and actual grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, certificates, raw totals and reconciliation"
    - protocol_id: cp_energy
      process_id: "blend"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "stage; meter; kWh; time; voltage; supplier; region; campaign; shared loads"
      collection_method: "Read calibrated stage meters including fans and packing; reconcile bills and duty attribution"
      unit: "MJ"
      frequency: "Each batch and stage; air tests linked to represented operating periods"
      temporal_coverage: "One complete declared campaign, including starts, stops, cleaning and storage"
      site_scope: "Selected site and actual grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, certificates, raw totals and reconciliation"
    - protocol_id: cp_pack
      process_id: "blend"
      flow_role: "bag_pp; liner_pe"
      record_type: "foreground_record"
      raw_fields: "supplier; polymer; grade; actual empty component kg; delivered package count; composite boundary; damaged kg"
      collection_method: "Weigh PP and PE independently and reconcile issue, retained stock and damaged material"
      unit: "kg"
      frequency: "Each batch and stage; air tests linked to represented operating periods"
      temporal_coverage: "One complete declared campaign, including starts, stops, cleaning and storage"
      site_scope: "Selected site and actual grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, certificates, raw totals and reconciliation"
    - protocol_id: cp_waste
      process_id: "blend"
      flow_role: "discard_fines; waste_pp; waste_pe"
      record_type: "foreground_record"
      raw_fields: "origin; composition; contamination; kg; moisture; internal recovery; receiver; treatment; manifest"
      collection_method: "Weigh each separated external stream and internal returns; retain receiver acceptance and transfer records"
      unit: "kg"
      frequency: "Each batch and stage; air tests linked to represented operating periods"
      temporal_coverage: "One complete declared campaign, including starts, stops, cleaning and storage"
      site_scope: "Selected site and actual grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, certificates, raw totals and reconciliation"
    - protocol_id: cp_air
      process_id: "blend"
      flow_role: "pm25; pm2510; pm10plus"
      record_type: "foreground_record"
      raw_fields: "source; stack/fugitive; size fractions; concentration; dry/wet and actual/normal gas basis; gas flow; operating time; controls; detection limits"
      collection_method: "Measure actual residual releases after dry control with documented sampling coverage and fugitive method; no emission factor default"
      unit: "kg"
      frequency: "Each batch and stage; air tests linked to represented operating periods"
      temporal_coverage: "One complete declared campaign, including starts, stops, cleaning and storage"
      site_scope: "Selected site and actual grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, certificates, raw totals and reconciliation"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "For every non-reference exchange, retain its attributable raw campaign total X in the stated numerator unit; apply x = X / Q exactly once here, after conversions and load calculations. Use the complete matched site/route/SKU-state campaign pool, including failed and zero-output batches, starts/stops, rejects, cleaning, storage and rework with their actual input, energy, waste and emission burdens. Reconcile opening/closing feed, work-in-progress and product stocks with carried production burdens, receipts, withdrawals and returns. Q is the unique positive accepted as-delivered net product kg attributable to that pool after stock and return reconciliation; a returned and reaccepted net batch is confirmed only once and internal rework is not added output. If Q <= 0 or the pool and carried burdens cannot be matched, keep raw records and leave the normalized result unavailable. Reference product is exactly 1 kg; retain the unallocated physical ledger separately from burden attribution."
      inputs:
        - cp_net
        - cp_feed
        - cp_energy
        - cp_pack
        - cp_waste
        - cp_air
      output: "Normalized exchanges plus retained raw totals"
      source_ids:
        - efba-solid-blending-2016
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "E_MJ = metered campaign E_kWh × 3.6; apply measured campaign attribution and retain the resulting raw campaign MJ total. Only campaign_normalization divides by Q."
      inputs:
        - cp_energy
        - cp_net
      output: "E_MJ; raw campaign total"
      source_ids:
        - efba-solid-blending-2016
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "On the unallocated campaign ledger reconcile received feeds plus opening fertilizer stocks with accepted product, closing stocks, actual discarded fertilizer and actual size-resolved emitted dust; record rejected product and signed moisture exchange separately. Retained packaging is a separate material ledger. Measure loss composition; do not infer a constant yield or force residuals into a pollution row."
      inputs:
        - cp_feed
        - cp_net
        - cp_pack
        - cp_waste
        - cp_air
      output: "Mass, water and measured N/P/K component balances with residuals"
      source_ids:
        - efba-solid-blending-2016
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify actual grade, state, formulation, supplier and reference property independently of identity UUID lookup. No absent provider or route mismatch is a zero burden."
      evidence: "cp_feed; cp_net; cp_pack"
    - id: quality_blend
      applies_to: "npk_product"
      requirement: "Retain representative nutrient analysis, water content, particle-size compatibility and segregation tests through storage/delivery; measured feed recipe alone is insufficient if screening or losses change composition."
      evidence: "efba-solid-blending-2016"
    - id: quality_coverage
      applies_to: "all inventory rows"
      requirement: "Cover complete campaign and all operated stages; distinguish conditional absence, measured zero, below detection, missing measurement and unresolved identity. Add atomic rows for real uncovered flows before use."
      evidence: "cp_net; cp_air; cp_waste"
validation_rules:
