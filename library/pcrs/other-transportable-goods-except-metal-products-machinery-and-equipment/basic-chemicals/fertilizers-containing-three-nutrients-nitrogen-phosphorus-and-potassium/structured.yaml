    rule: "Require the actual finished dry-blend SKU, three-feed route, complete Section 3 qualifiers and supplier-compatible Mass/kg basis. The broader reference UUID does not establish source-case formulation, a matching plant-gate provider or permission to inherit an upstream cutoff; unresolved actual compatibility prevents a complete site dataset. A measurement check alone is not scientific approval."
