  identity_limitations:
    - "Finished NK UUID is a broad manufactured product identity: optional pesticide wording is not a mandatory ingredient. This method covers only binderless dry AS/KCl composite granules without intentional P, KNO3 or pesticide; supplier formulation, moisture and granule acceptance remain required."
    - "Selected electricity is explicitly CN, <1 kV, grid-average consumption mix to user. Other locations, voltage or generation routes require compatible identity and provider before a completed dataset."
    - "Broad AS finished-product UUID does not prescribe synthesis/by-product route or geography. Selected KCl has Volume/m3 and a mistranslated Chinese raw-mineral term in its comment; CAS/name/classification agree on KCl. Its provider solid/bulk volume, packing, moisture and independently measured density must be matched; no default conversion."
    - "Hydraulic fluid reference is Volume/m3 without geography or route limit; native lubricant classification is under >=70% petroleum-oil preparations, while comment also mentions synthetic base oils. Use only a supplier-composition-compatible whole formulation, not water-glycol or synthetic-ester fluids by assumption. Grade, additives, supplier volume temperature/density and background boundary remain required."
    - "Ordinary missing reject/cleaning-effluent/atmospheric-moisture identities do not remove measured exchanges or imply zero. No compatible mass-basis atmospheric-moisture uptake UUID was established; resource water volume alone supplies no kg conversion."
    - "Native Japanese patent text is available; this host PDF renderer shows missing Japanese glyphs. Manufacturing paragraphs were read as extracted Japanese text and cross-checked with acquired original-language HTML and its English translation; no full visual glyph verification claimed. Patent examples are not general defaults."
  mapping_recommendation: "narrower candidate only: binderless dry roller-compacted AS/KCl composite granules; independent controller acceptance required. Existing dry-blend, MAP/APP and KNO3 routes do not cover this compaction method."
