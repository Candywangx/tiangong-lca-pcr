allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "compact"
    rule: "Subdivide by actual SKU/state/route and stage meters before allocation. Share common electricity/maintenance by documented measured causation or service duty; retain complete failed and idle burden pools and justify any residual allocation. No default economic/mass fraction."
    source_ids:
      - toray-nk-compaction-2019
      - sahut-compaction-1999
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Keep the complete unallocated physical mass/water/element and internal-transfer ledger separate from the attributed environmental-burden ledger. Never multiply physical product outlets or paired internal transfers by an allocation fraction. Internal returns carry their existing burdens and extra processing energy; no avoided-feed credit."
    source_ids:
      - toray-nk-compaction-2019
      - sahut-compaction-1999
  - rule_id: allocation_outputs
    applies_to: "reject_nk; captured_dust; waste_oil"
    rule: "No routine co-product is presumed. Classify each actual external output once by function, legal/receiver status and composition. A sold off-grade fertilizer or recovered oil product needs separately reviewed identity and allocation; do not silently call it waste or automatically assign substitution credit."
    source_ids:
      - toray-nk-compaction-2019
      - sahut-compaction-1999
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "compact"
      flow_role: "nk_product"
      record_type: "foreground_record"
      raw_fields: "SKU; one-time release event; gross/tare/net B; N forms and total N; K/K2O; S/Cl; moisture; free acidity; feed/product sieves; crush strength/attrition; homogeneity; start/end feed/WIP; finished-stock ledger; carried burdens"
      collection_method: "Calibrated final net scale and representative lot assays, sieve/strength/storage checks; retain agreed test method, sampling, scale uncertainty and rejected lots"
      unit: "kg"
      frequency: "Every batch/stage and associated representative monitoring"
      temporal_coverage: "Complete period including start/stop, failed/zero-output, rework, storage and WIP"
      site_scope: "Actual same-SKU/state/route site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, assays/sampling, paired transfer/stock reconciliation and supplier/receiver evidence"
    - protocol_id: cp_feed
      process_id: "compact"
      flow_role: "feed_as; feed_kcl"
      record_type: "foreground_record"
      raw_fields: "Supplier; grade/route; complete supplied kg; component/coating/water assay; KCl m3 convention, packing, moisture, temperature and independently measured density; stock/charge/returns; particle sizes; roller settings; pass counts"
      collection_method: "Calibrated receipt/feed weighing, metered charges and supplier-compatible volume/density tests; reconcile stocks and measured internal transfers; inspect actual granulation route"
      unit: "kg; m3"
      frequency: "Every batch/stage and associated representative monitoring"
      temporal_coverage: "Complete period including start/stop, failed/zero-output, rework, storage and WIP"
      site_scope: "Actual same-SKU/state/route site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, assays/sampling, paired transfer/stock reconciliation and supplier/receiver evidence"
    - protocol_id: cp_energy
      process_id: "compact"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "Stage kWh; meter; site/time; CN delivery; voltage; supplier quantity; press/force-feed/crusher/screen/fan/load duty; failed/idle/start/stop energy; common load attribution"
      collection_method: "Calibrated stage meters and bills, all repeat processing passes; measure common loads separately and preserve conversion and attribution records"
      unit: "MJ"
      frequency: "Every batch/stage and associated representative monitoring"
      temporal_coverage: "Complete period including start/stop, failed/zero-output, rework, storage and WIP"
      site_scope: "Actual same-SKU/state/route site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, assays/sampling, paired transfer/stock reconciliation and supplier/receiver evidence"
    - protocol_id: cp_maintenance
      process_id: "compact"
      flow_role: "hydraulic_oil; waste_oil"
      record_type: "foreground_record"
      raw_fields: "Complete oil formulation; supplier volume/temperature; grade; density; top-up/replacement; opening/closing hydraulic stock; waste wet kg and additives/water; spill/capture; receiver"
      collection_method: "Meter whole purchased fluid volume; independently measure compatible density for mass; weigh spent oil and reconcile circuit stocks; retain supplier/maintenance/receiver evidence"
      unit: "m3; kg"
      frequency: "Every batch/stage and associated representative monitoring"
      temporal_coverage: "Complete period including start/stop, failed/zero-output, rework, storage and WIP"
      site_scope: "Actual same-SKU/state/route site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, assays/sampling, paired transfer/stock reconciliation and supplier/receiver evidence"
    - protocol_id: cp_waste
      process_id: "compact"
      flow_role: "reject_nk; captured_dust"
      record_type: "foreground_record"
      raw_fields: "Origin; actual full mass; moisture; dry matter; N/K/S/Cl; contamination; each internal return and external waste; receiver/function/treatment; transfer receipt"
      collection_method: "Weigh each separated dust/reject stream and both ends of every return; independently verify waste status, destination and composition"
      unit: "kg"
      frequency: "Every batch/stage and associated representative monitoring"
      temporal_coverage: "Complete period including start/stop, failed/zero-output, rework, storage and WIP"
      site_scope: "Actual same-SKU/state/route site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, assays/sampling, paired transfer/stock reconciliation and supplier/receiver evidence"
    - protocol_id: cp_water
      process_id: "compact"
      flow_role: "cleaning_water; cleaning_effluent; humidity_uptake"
      record_type: "foreground_record"
      raw_fields: "Complete cleaning cycles; supplied and effluent wet kg or metered m3 with measured density; dissolved ions and suspended solids; feed/product/stock moisture; air humidity, temperature and independent uptake/evaporation observations"
      collection_method: "Meter full contained cleaning events; representative independent liquid/solid/air sampling and moisture tests; distinguish phase exchange from evidenced reaction water; preserve unexplained residual"
      unit: "kg"
      frequency: "Every batch/stage and associated representative monitoring"
      temporal_coverage: "Complete period including start/stop, failed/zero-output, rework, storage and WIP"
      site_scope: "Actual same-SKU/state/route site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, assays/sampling, paired transfer/stock reconciliation and supplier/receiver evidence"
    - protocol_id: cp_air
      process_id: "compact"
      flow_role: "pm25; pm2510; pm10plus; ammonia_air; water_vapour"
      record_type: "foreground_record"
      raw_fields: "Species/source/location/height; outdoor compartment; non-overlapping size fractions; concentration; integrated gas volume or volume flow/time; pressure; temperature; wet/dry and normal/actual; controls/fugitives; detection limit; represented hours"
      collection_method: "Measure residual stack and fugitive releases over representative full operating states; match sampling and gas-volume basis, distinguish integrated volume from flow rate; no generic factor or forced balance"
      unit: "kg"
      frequency: "Every batch/stage and associated representative monitoring"
      temporal_coverage: "Complete period including start/stop, failed/zero-output, rework, storage and WIP"
      site_scope: "Actual same-SKU/state/route site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, assays/sampling, paired transfer/stock reconciliation and supplier/receiver evidence"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Preserve raw matched full-period totals and stock/WIP burden transfers. After compatible raw unit conversion and documented burden attribution, divide each attributable exchange once by positive B. Reference output is exactly 1 kg; B=0 retains totals without a unit inventory."
      inputs:
        - cp_product
        - cp_feed
        - cp_energy
        - cp_maintenance
        - cp_waste
        - cp_water
        - cp_air
      output: "Exchanges per 1 kg reference flow, original totals and carried-burden ledger"
      source_ids:
        - toray-nk-compaction-2019
        - sahut-compaction-1999
    - id: provider_conversion
      applies_to: "feed_kcl; hydraulic_oil; cleaning_water"
      rule: "Keep physical kg and provider-native m3 separately. Use independently measured corresponding mass/volume density for the identical material, packing, moisture and temperature definition; do not use a database secondary coefficient or an unrelated patent density. Resolve unknown provider basis before claiming a complete background link."
      inputs:
        - cp_feed
        - cp_maintenance
        - cp_water
      output: "Compatible period kg and m3 before normalization"
      source_ids:
        - toray-nk-compaction-2019
        - sahut-compaction-1999
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Convert measured kWh using exactly 3.6 MJ/kWh once; retain native Net calorific value property. Include all repeat press/crush/classification passes and actual common loads, then normalize by B once."
      inputs:
        - cp_energy
        - cp_product
      output: "MJ per 1 kg reference flow"
      source_ids:
        - toray-nk-compaction-2019
        - sahut-compaction-1999
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "On matched complete period boundaries, complete measured production charges plus opening post-charge stock/WIP and independently measured environmental uptake equal accepted product plus actual discarded solids, contained effluent, actual releases and closing post-charge stock/WIP. Reconcile uncharged feed stocks separately through the receipt ledger. Exclude already released B from closing process stocks; completed-goods warehouse stocks have a separate ledger. Equal internal return transfers cancel only in the aggregate. Balance whole wet mass, dry solids, N/K/S/Cl and actual oil/additive carbon separately; no theoretical recipe or residual-assigned loss."
      inputs:
        - cp_product
        - cp_feed
        - cp_maintenance
        - cp_waste
        - cp_water
        - cp_air
      output: "Complete unallocated physical and elemental ledgers"
      source_ids:
        - toray-nk-compaction-2019
        - sahut-compaction-1999
    - id: water_species
      applies_to: "all inventory rows"
      rule: "Separate whole wet inputs from constituent/carrier-water subledgers. Dry compression itself establishes no net chemical water formation or consumption. Measure free-water phase exchange and any structural/bound-water change independently. Evidence of real reaction requires species/stoichiometry and separate generation/consumption evidence and scope review; never fit unknown reaction water and an unknown outlet to one residual, or use COD as dry matter/reaction water."
      inputs:
        - cp_feed
        - cp_water
        - cp_air
        - cp_product
      output: "Water/species ledgers and disclosed residuals"
      source_ids:
        - toray-nk-compaction-2019
        - sahut-compaction-1999
    - id: air_mass
      applies_to: "pm25; pm2510; pm10plus; ammonia_air; water_vapour"
      rule: "Multiply compatible concentration by already integrated gas volume, or integrate concentration times volume flow rate over time. Preserve each represented operating state, wet/dry and pressure/temperature bases. Convert nitrogen-reported NH3 with documented molar mass basis only. Keep PM bins disjoint, captured solids separate, and normalize full attributable mass by B once."
      inputs:
        - cp_air
        - cp_product
      output: "Species kg per 1 kg reference flow"
      source_ids:
        - toray-nk-compaction-2019
        - sahut-compaction-1999
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify full native name components, route/state/grade, geography where declared, CAS, type/medium and exact reference property/unit version chain. Keep unknowns distinct from contradictions; broad identity does not prove supplier amount, recipe or background suitability."
      evidence: "cp_product; cp_feed; cp_energy; cp_maintenance"
    - id: quality_measurement
      applies_to: "all inventory rows"
      requirement: "Preserve original calibrated measurements, assay methods, sampling coverage, uncertainty and detection limits. Missing UUID or monitoring is not measured zero; retain actual exchanges and unresolved links. No borrowed patent or maker yield/pressure/recipe/energy/density default."
      evidence: "cp_product; cp_water; cp_air"
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "Use complete same-SKU/state/route pools including failed/zero-output batches and rework. Trace opening/closing WIP embodied burdens in a separate carryover ledger so incoming WIP is not free and failed burdens are not discarded. Unresolved carryover allocation remains incomplete dataset evidence."
      evidence: "cp_product; cp_feed; cp_energy; cp_maintenance"
validation_rules:
  - rule_id: validate_reference
    applies_to: "nk_product"
    rule: "Require exactly one final product reference row with compatible broad NK identity and Mass/kg. Verify actual AS/KCl composite-granule state/route, no KNO3 or intentional P/pesticide, positive unique B and all qualifiers. Native broad identity is not universal methodology coverage."
    source_ids:
      - un-cpc-3-2025
      - toray-nk-compaction-2019
  - rule_id: validate_period
    applies_to: "all inventory rows"
    rule: "Check raw totals, failed/zero-output coverage, stock/WIP and burden carryover, internal return equality and one normalization. B=0 cannot yield a normalized inventory. Every collection protocol belongs to compact and covers its actual linked rows."
    source_ids:
      - toray-nk-compaction-2019
      - sahut-compaction-1999
  - rule_id: validate_physics
    applies_to: "all inventory rows"
    rule: "Reconcile complete physical wet/dry mass, molecular/structural/free water, actual species, N/K/S/Cl and oil/additive carbon independently of allocated burdens. No balance-residual emissions, reaction water or hidden assumed outlet. Reject incompatible real reactions or additional routes until reviewed."
    source_ids:
      - toray-nk-compaction-2019
  - rule_id: validate_links
    applies_to: "feed_kcl; hydraulic_oil; electricity; cleaning_water; reject_nk; cleaning_effluent; humidity_uptake"
    rule: "Verify provider-native quantities and complete treatment/transport links separately from identities. Explicit electricity CN/user-mix/voltage limits apply only to that record. An ordinary auxiliary identity gap requires disclosure and dataset repair, not deletion or automatic methodology demotion."
    source_ids:
      - sahut-compaction-1999
  - rule_id: validate_air
    applies_to: "pm25; pm2510; pm10plus; ammonia_air; water_vapour"
    rule: "Verify actual outdoor species/subcompartment, sampling/volume bases and non-overlapping bins. Total PM is a check, not an added fourth exchange. Separate captured dust, indoor exposure and environmental releases. A maker pollution assertion does not establish measured absence."
    source_ids:
      - sahut-compaction-1999
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Verified plant-gate supply inventory for the defined dry AS/KCl compacted NK subtype"
  allowed_use: "Actual matched bulk supply with complete collected quantities, upstream/treatment links and disclosed review requirements"
  excluded_use: "Universal NK/NPK coverage, potassium nitrate, nutrient-equivalent agronomic comparison, field emissions, wet/binder/coated/liquid routes or invented quantities"
  required_metadata: "All reference qualifiers; actual native name/location/property restrictions; raw totals and B; sampling, stock/WIP and carryover; provider references; allocation, capital and transport boundaries"
  required_quality_disclosure: "Scientific review pending; unresolved auxiliary UUIDs; provider-volume compatibility; measurement uncertainty, detection and completeness; patent/manufacturer evidence limitations"
  update_trigger: "Changed recipe/feed/conditioning, actual reaction, binder/water/coating/thermal route, package/delivery, grid/geography, provider basis, output function or measurement method"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, p.166. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification only: 34647 excludes potassium nitrate; optional listed substances are not a required recipe or accepted mapping."
  - id: "eu-jrc-lvic-aaf-2007"
    type: "official_guidance"
    reference: "European Commission/JRC, LVIC-AAF BREF, August 2007, §7.1 and §7.2.1, printed pp.283/285, PDF pp.311/313. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-03/LVIC-AAF.pdf?download=1"
    used_for: "Nutrient reporting and separation of mechanical blending/compaction from acid and Odda routes; Figure 7.1 does not describe the dry route. No plant or emission/consumption default."
  - id: "toray-nk-compaction-2019"
    type: "literature"
    reference: "Toray Industries, JP2019043797A, published 22 March 2019, claims 6–14; detailed description on PDF pp.7–10 and examples from p.13. https://patents.google.com/patent/JP2019043797A/en"
    used_for: "Primary patent evidence for AS/KCl dry mixing, roller briquetting, crushing, sizing, classification, fines return and measured quality attributes. Japanese text is primary; English is machine translation. Claimed/experimental recipe, moisture, density, size, pressure, speed, strength and yields are case limits, not universal defaults; future site acceptance and collection are mandatory."
  - id: "sahut-compaction-1999"
    type: "literature"
    reference: "F.Dehont, Sahut-Conreur, Compaction-granulation of Fertilizer: An Economical Process for a la carte Formulations, Powder Handling & Processing 11(3), July/September 1999, PDF pp.1–3. https://d20854696ijsuu.cloudfront.net/files/22081/download/686683/1-3.pdf"
    used_for: "Equipment-maker original: dry pressure agglomeration, stages, fines/oversize circulation and dust control; historical qualitative support. Figure includes optional humidification/coating, excluded here; no productivity, yield, density, energy or zero-effluent assertion becomes a default or demonstrated absence."
