measurement_rules:
  - id: net_product
    applies_to: "nk_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "B is the unique net newly completed accepted bulk product crossing the final release gate during the period. Weigh gross/tare with calibrated scales; exclude already completed opening-stock resale, internal return passes, discarded off-grade and any containers. Count each finally accepted lot once. Record actual moisture, not a hypothetical dry fertilizer."
  - id: period_pool
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Consistent native property"
      uuid: ""
    required_unit: "per 1 kg reference flow"
    rule: "Retain the complete same SKU/state/route raw production pool including start/stop, failed/zero-output batches, cleaning, rework, feed/WIP/stock changes and carried burdens. Convert raw units then attribute burdens and divide once by positive B. If total B=0, retain totals without a normalized result."
  - id: feed_basis
    applies_to: "feed_as; feed_kcl; nk_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Whole supplied material is the exchange; N, K, K2O, S, Cl, moisture and conditioning are measured subledgers. K2O is a reporting equivalent, not an actual oxide reagent. Preserve elemental and oxide bases with documented molar conversion; do not count constituent water or active salts twice."
  - id: provider_basis
    applies_to: "feed_kcl; hydraulic_oil; electricity; cleaning_water"
    required_property_ref:
      name: "Native reference property"
      uuid: ""
    required_unit: "native unit"
    rule: "Separate physical identity from supplier background quantity. For Volume/m3 define solid/bulk/liquid basis, packing, temperature, moisture and measured compatible density; native secondary property ratios supply no density. Match electricity CN/<1kV/user mix; other supplies need compatible verified links."
  - id: air_basis
    applies_to: "pm25; pm2510; pm10plus; ammonia_air; water_vapour"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use compatible concentration times already integrated gas volume, or integrate concentration times gas-flow rate over time. Never multiply integrated volume by time again. Preserve wet/dry, normal/actual, temperature, pressure and detection basis; no overlapping PM total and bins."
