allocation_rules:
  - rule_id: allocation_physical_ledger
    applies_to: "physical mass/water/carbon balances"
    rule: "Retain full measured physical inputs, product/co-product outputs, wastes, emissions and inventory changes before environmental allocation. Never multiply physical co-product or internal-link quantities by the allocation share."
    source_ids:
      - ec-jrc-ofc-bref-2006
      - ec-jrc-ilcd-handbook-2010
  - rule_id: allocation_avoidance
    applies_to: "shared plant resources and co-products"
    rule: "First subdivide using stage meters and directly assigned batch records. Where multifunctionality remains, document a study-consistent determining physical relationship; use economic allocation only for the unresolved share with contemporaneous quality-specific receiver values and sensitivity. No universal mass allocation or zero-burden co-product default."
    source_ids:
      - ec-jrc-ilcd-handbook-2010
  - rule_id: allocation_recovery
    applies_to: "recycled/recovered acid and off-spec oil"
    rule: "Internal recycle retains its load within the process and receives no avoided-product credit. A marketable external recovered acid needs acceptance, composition and allocation; discarded acid or off-spec oil is waste, not an invented sale. Keep allocated environmental accounts separate and disclose any study-level substitution."
    source_ids:
      - ec-jrc-ilcd-handbook-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "epoxidation_workup"
      flow_role: "finished_oil"
      record_type: "Measured foreground records"
      raw_fields: "grade; batch; tare/gross/net dispatch mass; beginning/end accepted-product and off-spec/rework stocks; inter-period and external transfers; accepted net production P; failed/zero-output batch identifiers; oxirane oxygen; iodine/acid values; moisture; peroxide; actual product composition and assay uncertainty"
      collection_method: "Use calibrated net scales/tank reconciliation and traceable lot acceptance tests. Determine raw accepted net production P for one documented grade and complete reporting pool by reconciling production, dispatch, stocks and transfers; do not treat dispatch from opening accepted stock as new production or count internal rework twice. Keep failed and zero-output batches in the matched pool. Retain raw kg totals; normalize only through normalize_period."
      unit: "kg"
      frequency: "Each batch/transfer; representative full emission profile"
      temporal_coverage: "Same declared complete production period"
      site_scope: "One site, one declared route/grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, certificates, timestamps, raw tests and reconciliation; record missing data"
    - protocol_id: cp_materials
      process_id: "epoxidation_workup"
      flow_role: "reagent and water input"
      record_type: "Measured foreground records"
      raw_fields: "lot; supplier; native reference basis; commercial solution mass; active assay; carrier water; density/temperature; external receipt and charge; stage; recycle/rework transfers; beginning/end stocks; residual reagent species and reaction-extent evidence; steam pressure/temperature/quality"
      collection_method: "Use calibrated weighing/meters, analytical assays, supplier certificates and complete stage records. Retain stock-reconciled raw attributable material totals for the same production pool as P, including failed batches, zero-output batches, cleaning and rework. Keep commercial solution mass, active amount and carrier water separately; internal transfers remain equal ledger links. Do not divide totals in this protocol; apply normalize_period once."
      unit: "kg"
      frequency: "Each batch/transfer; representative full emission profile"
      temporal_coverage: "Same declared complete production period"
      site_scope: "One site, one declared route/grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, certificates, timestamps, raw tests and reconciliation; record missing data"
    - protocol_id: cp_energy
      process_id: "epoxidation_workup"
      flow_role: "electricity and heat"
      record_type: "Measured foreground records"
      raw_fields: "meter; stage; interval; voltage; supplier; supply/return flow and enthalpy; heat losses; shared loads; energy reference basis"
      collection_method: "Use calibrated electricity and net-heat meters covering the same complete production pool as P, including failed/zero-output batches, rework, cleaning and changeovers. Retain raw totals and documented causal load apportionment; preserve supplier reference quantities and supply/return heat states. Convert kWh to MJ once using 3.6 MJ/kWh, then apply normalize_period once; do not divide in this protocol."
      unit: "MJ"
      frequency: "Each batch/transfer; representative full emission profile"
      temporal_coverage: "Same declared complete production period"
      site_scope: "One site, one declared route/grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, certificates, timestamps, raw tests and reconciliation; record missing data"
    - protocol_id: cp_residues
      process_id: "epoxidation_workup"
      flow_role: "co-product and segregated waste"
      record_type: "Measured foreground records"
      raw_fields: "origin stage; receiver; net wet mass; density; moisture; individual acid/peroxide/oil/salt composition and assay uncertainty; residual H2O2/peracid; organic material and calcium/sulfur species; cloth/cake separation; COD/TOC as aggregate indicators; pH; beginning/end stocks; transfers and actual reaction/side-product evidence"
      collection_method: "Use calibrated transfer weighing, representative species/composition sampling and actual treatment/sales acceptance for the same complete production pool as P; follow failed batches, rework and waste manifests. Retain raw co-product and segregated waste totals with stock changes, full physical amounts before allocation and separate internal transfers. Do not divide in this protocol; apply normalize_period once."
      unit: "kg"
      frequency: "Each batch/transfer; representative full emission profile"
      temporal_coverage: "Same declared complete production period"
      site_scope: "One site, one declared route/grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, certificates, timestamps, raw tests and reconciliation; record missing data"
    - protocol_id: cp_emissions
      process_id: "epoxidation_workup"
      flow_role: "outdoor species emissions"
      record_type: "Measured foreground records"
      raw_fields: "species/CAS; point/fugitive source; stage; species mass concentration or verified conversion; gas volume flow rate or already integrated gas volume; interval boundaries and duration; temperature/pressure; wet/dry basis; incoming species background where relevant; control capture; condensate; uncertainty; absent/present/unmeasured status"
      collection_method: "Use species-resolved interval sampling and matched gas-volume monitoring over the same complete production pool as P, including failed/zero-output batches, rework, reaction, transfers, recovery, drying and cleaning. Include separately evidenced fugitives and independently supported water/peroxide species balances. Apply species_integration to obtain raw external species mass once; captured material and incoming ambient background are not process releases. Retain raw species totals and measurement gaps; normalize only through normalize_period."
      unit: "kg"
      frequency: "Each batch/transfer; representative full emission profile"
      temporal_coverage: "Same declared complete production period"
      site_scope: "One site, one declared route/grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, certificates, timestamps, raw tests and reconciliation; record missing data"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each non-reference exchange i, q_i = Q_i / P exactly once. Q_i is its raw stock-reconciled attributable amount for the complete reporting pool, before any per-kg division; P is accepted net production in kg for that same grade and pool from cp_product. Include all matched failed/zero-output batches, off-spec production, rework, cleaning and starts/stops in the attributable totals; do not select only successful batches. Internal transfers are not new external exchanges. If P is zero, the per-kg result is undefined: retain the totals for a justified matched pool with positive accepted output or report unavailable; never report zero burden or divide by zero. Keep finished_oil exactly 1 kg. Preserve full physical co-product/waste quantities; environmental allocation is a separate account after reconciliation. Each protocol retains raw period totals. The aggregation column declares the final per 1 kg reference-flow basis; it does not direct another division. Apply normalization once, only through normalize_period, to the stock-reconciled complete matched pool. Carry burdens with the corresponding raw-material, work-in-progress, rework and finished-product stocks across periods; do not pair old-stock dispatches with current processing alone."
      inputs:
        - cp_product
        - cp_materials
        - cp_energy
        - cp_residues
        - cp_emissions
      output: "exchange per 1 kg reference flow, or explicitly unavailable when P is zero"
      source_ids:
        - ec-jrc-ilcd-handbook-2010
    - id: assay_accounting
      applies_to: "hydrogen_peroxide, acetic_acid, sulfuric_acid, recovered_acid"
      rule: "Active mass = measured commercial solution mass × measured active mass fraction; carrier water is reconciled separately. Use active normalization for H2O2 only with a supplier active-kg interface; otherwise retain pending linkage."
      inputs:
        - cp_materials
        - cp_residues
      output: "separate solution/active/water amounts"
      source_ids:
        - ec-jrc-ofc-bref-2006
    - id: species_integration
      applies_to: "acetic_air, peracetic_air, oxygen_air, water_vapour"
      rule: "Obtain raw species mass from the time integral of matched species mass concentration C_i(t) and gas volume flow rate Q(t). For measured interval gas volumes V_j, use the sum of flow-weighted C_i,j times V_j after explicit unit conversion; V_j already includes duration and must not be multiplied by time again. Use concentration times flow rate times interval duration only when a representative constant or compatible interval-average basis is established. Match temperature, pressure and wet/dry basis, and separate process-generated oxygen/water from independently established incoming background. Add separately evidenced fugitives once; captured material is not emitted. Carbon concentration is not species mass without verified speciation/conversion."
      inputs:
        - cp_emissions
      output: "raw attributable external species mass before normalize_period"
      source_ids:
        - ec-jrc-ofc-bref-2006
    - id: physical_reconciliation
      applies_to: "unallocated ledger"
      rule: "On the unallocated physical ledger, opening stock plus all external physical inputs equals closing stock plus all external physical outputs, with uncertainty; total mass and each relevant element are conserved. For each reactive species separately, opening stock plus external input plus actual formation equals closing stock plus external output plus actual consumption. Independently establish peroxide/peracid reaction and decomposition, epoxide oxygen retained in oil, water formation/consumption, acid regeneration/neutralisation and organic side-product formation/consumption from actual site assays/speciation and an independently supported reaction-extent model or direct measurement. Keep commercial carrier water, internal recycle, co-products, waste and vapour distinct. Do not infer formation/consumption from a closure residual, COD/TOC alone, assumed complete conversion, default decomposition/yield or a fixed product/feed ratio; unresolved species balances remain unresolved."
      inputs:
        - cp_product
        - cp_materials
        - cp_residues
        - cp_emissions
      output: "distinct total-mass/element and reactive-species balances, evidence and residual uncertainty"
      source_ids:
        - ec-jrc-ofc-bref-2006
        - fraunhofer-igb-epoxidation
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all interfaces"
      requirement: "Verify actual lot/SKU, assay, native field restrictions, CAS, composition, reference property/unit and supplier/receiver compatibility. A flow UUID proves no foreground amount or compatible background by itself."
      evidence: "cp_materials; cp_product; cp_residues"
    - id: dq_completeness
      applies_to: "whole period and process"
      requirement: "Retain off-spec production, cleaning, starts/stops, recovery and stock changes. Missing emissions/assays are unmeasured, not zero; add every actually occurring omitted atomic flow before releasing a dataset."
      evidence: "cp_product; cp_emissions"
    - id: dq_balance
      applies_to: "physical and environmental accounts"
      requirement: "Keep measured balances and allocated environmental loads separately; disclose measurement uncertainty and unresolved balance residuals without forcing closure."
      evidence: "cp_materials; cp_residues; cp_energy"
validation_rules:
  - rule_id: validate_reference
    applies_to: "dataset reference"
    rule: "Require exactly one finished_oil product output of 1 kg and complete product/route qualifiers; the broad name cannot expand this PCR to mixed preparations or excluded modified oils."
    source_ids:
      - unsd-cpc-3-2025
      - fraunhofer-igb-epoxidation
  - rule_id: validate_interfaces
    applies_to: "inventory"
    rule: "Reject unsupported assays, pure/solution conversion, grade/route/CAS/compartment contradictions and unverified supplier quantity bases. Blank UUIDs and unmeasured emissions remain explicit review items; no nearby product or wrong environmental medium substitution."
    source_ids:
      - ec-jrc-ilcd-handbook-2010
  - rule_id: validate_accounting
    applies_to: "balance and allocation"
    rule: "Check equal internal transfers; full physical product/co-product/waste masses and stocks before allocation; one complete production pool including failed/zero-output/rework burdens; raw Q_i and accepted P normalized exactly once; no duration multiplier on already integrated gas volume; separate conserved total mass/elements from independently evidenced reactive formation/consumption; commercial carrier water and bilingual denominators. Missing quantity or species evidence remains unavailable/review-required, without borrowed recipe, yield, energy or emission defaults."
    source_ids:
      - ec-jrc-ofc-bref-2006
      - ec-jrc-ilcd-handbook-2010
published_dataset_profile:
  dataset_role: "foreground process dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Covered site/grade/route with complete supplier interfaces and actual measurements; review-required candidate guidance"
  excluded_use: "Whole CPC 34550 coverage; food equivalence; whole commercial H2O2 solution inferred from chemical UUID; alternative reaction route; cradle-to-grave or comparative assertion from this unit alone"
  required_metadata: "Reference qualifiers; actual plant route; assay and net mass bases; source period; native providers; full physical balances; allocation and extension boundary"
  required_quality_disclosure: "Missing UUIDs, pending provider quantities, detection limits, measurements, balance residuals, temporal coverage, review and translation maturity"
  update_trigger: "Changed oil source, catalyst, acid route, formulation, assay, heat interface, treatment, receiver or new authoritative evidence"
data_sources:
  - id: "unsd-cpc-3-2025"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 Structure, 30 June 2025, subclass 34550. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Classification wording and named exclusions; narrower mapping is a candidate interpretation"
  - id: "fraunhofer-igb-epoxidation"
    type: "official_guidance"
    reference: "Fraunhofer IGB, Preparation of triglyceride and fatty acid epoxides. https://www.igb.fraunhofer.de/en/research/chemical-and-biotechnological-processes/industrial-biotechnology/bioprocess-engineering/establishment-and-scale-up-of-technical-enzyme-processes/preparation-of-triglyceride-and-fatty-acid-epoxides.html"
    used_for: "Conventional peracid chemistry, side reactions, salt burden and product characterization; no process quantities"
  - id: "ashland-peracetic-epoxidation-1967"
    type: "literature"
    reference: "W. H. French / Ashland Oil & Refining Company, US3360531A, 26 December 1967, columns 9–10 Table I solvent-free cases and conventional Run 1; workup discussed at column 8–9. https://patents.google.com/patent/US3360531A/en"
    used_for: "Original historical physical route/recycle/workup evidence only; example recipes and performance are not defaults or operating instructions"
  - id: "ec-jrc-ofc-bref-2006"
    type: "official_guidance"
    reference: "European Commission, Organic Fine Chemicals BREF, August 2006, §4.3.1.4 printed 183 / PDF 213; §§5.2.1.1.2–5.2.1.1.5 printed 380–382 / PDF 410–412. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/ofc_bref_0806.pdf"
    used_for: "General chemical plant physical balances and waste/emission measurements; no factory-specific recipe or numerical emission defaults"
  - id: "ec-jrc-ilcd-handbook-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, March 2010, §7.9.3 printed 257–258 / PDF 277–278. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Subdivision, determining physical causality and remaining economic allocation; retain study context"
  - id: "arkema-bulk-epoxidized-soybean-oil-2020"
    type: "literature"
    reference: "Arkema USA, 23 April 2020, Vikoflex/Vikolox distribution and bulk delivery announcement. https://www.arkema.com/usa/en/media/news/non-global/countries/americas/20200423-brenntag-distribu/"
    used_for: "Independent producer confirmation of bulk epoxidized soybean oil identity/delivery only; does not prove its plant recipe"
  - id: "hairma-esbo-epd-2022"
    type: "literature"
    reference: "Hairma (Nantong) Technology, EPD S-P-06253, 17 May 2022, PDF pages 3, 5–8 / printed pages 2, 4–7. https://www.environdec.com/library/epd6253"
    used_for: "Counterevidence: formic-acid route, plant-specific inventories and different classification label; not transferred to this peracetic method"
