    rule: "allocation_physical_ledger: Retain measured physical inputs, full prill output, exported steam, purge, solid rejects, emissions and opening/closing stocks before allocating environmental burdens. Internal recovered solution and fines are neither co-products nor avoided-production credits. Never multiply actual co-product mass or steam delivery by an allocation fraction [eu-lvic-aaf-2007, ec-pef-2021]."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_hierarchy: Attribute separately measured feed handling, prilling, conditioning and waste treatment directly to their functions wherever subdivision is feasible. For genuinely shared neutralisation/steam-recovery burdens, investigate subdivision or an explicitly expanded system first. If neither is feasible, document a causally relevant measured physical relationship; kilograms of fertilizer and kilograms of steam are not automatically a causal key. If that relationship cannot be established, justify an economic key from contemporaneous AN and usable-steam values at the same transfer boundary. No fixed share is prescribed [ec-pef-2021, Annex I 4.5]."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_no_double_credit: Use one declared treatment of steam export. An attributional product dataset reports allocated burdens and full measured exports; it cannot also subtract hypothetical avoided boiler production. Any separately presented expanded-system result requires demonstrated recipient function and compatible displaced supply, is labelled as an expanded-system result, and is not silently merged with the 1 kg AN product result [ec-pef-2021]."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "an_prilling"
      flow_role: "finished_prills"
      record_type: "Weighing and grade acceptance"
      raw_fields: "lot; gross/tare/net mass; AN assay; moisture; total-N; nitrate-N; ammoniacal-N; particle size; density method; recipe; stock changes"
      collection_method: "Calibrated bulk scales and retained lot assays; reconcile production, loading and product stocks; exclude packaging"
      unit: "kg"
      frequency: "Every lot and dispatch"
      temporal_coverage: "Same representative operating year or complete campaign"
      site_scope: "Declared AN line and grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, assay methods, acceptance and stock reconciliation"
    - protocol_id: cp_feed
      process_id: "an_prilling"
      flow_role: "ammonia_feed; nitric_acid_feed"
      record_type: "Feed metering and assays"
      raw_fields: "source; delivered mass; NH3 purity/state; HNO3 mass fraction; acid grade; carrier water; reactor/scrubber split; loss; feed stock changes"
      collection_method: "Calibrated mass meters and supplier primary records plus representative assays; volume-derived mass uses measured density and temperature"
      unit: "kg"
      frequency: "Each delivery and stage meter interval"
      temporal_coverage: "Same product period"
      site_scope: "Feed storage, vaporisation, reactor and acid scrubbers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, assays, provider specification and compatible quantity basis"
    - protocol_id: cp_utilities
      process_id: "an_prilling"
      flow_role: "electricity"
      record_type: "Meter record"
      raw_fields: "kWh; voltage; utility boundary; stage; operating time; grid region; allocation evidence"
      collection_method: "Calibrated purchased/stage submeters; subtract only documented unrelated loads; reconcile with invoices"
      unit: "MJ"
      frequency: "Meter interval and monthly reconciliation"
      temporal_coverage: "Same product period"
      site_scope: "AN production, recovery and bulk handling"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/invoice match and voltage/provider energy-property compatibility"
    - protocol_id: cp_water
      process_id: "an_prilling"
      flow_role: "demineralised_water; cooling_makeup; water_vapour_air"
      record_type: "Water balance"
      raw_fields: "supplied water grade; metered mass/volume; density/temperature; acid/additive carrier water; condensate; make-up; blowdown; evaporated water; opening/closing stocks"
      collection_method: "Calibrated feed/cooling meters and validated stage water balance; identify each return loop and actual atmospheric evaporation"
      unit: "kg"
      frequency: "Meter interval and balance period"
      temporal_coverage: "Same product period"
      site_scope: "AN unit and cooling/recovery services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Balance closure and instrument/density evidence, no automatic 1000 kg/m3 assumption"
    - protocol_id: cp_steam
      process_id: "an_prilling"
      flow_role: "imported_steam; exported_steam"
      record_type: "Steam and enthalpy balance"
      raw_fields: "direction; recipient/provider; steam mass; pressure and gauge/absolute basis; temperature; dryness; condensate mass/state; internal recovery; heat basis"
      collection_method: "Calibrated steam meters and steam-table enthalpy determination from measured state; reconcile supply, condensate return, internal recovery and export"
      unit: "kg"
      frequency: "Stage meter interval"
      temporal_coverage: "Same product period"
      site_scope: "Actual AN utility transfer boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, measured state, supplier mass/heat reference definition and receiver evidence"
    - protocol_id: cp_additives
      process_id: "an_prilling"
      flow_role: "magnesium_nitrate; kaolin_coating"
      record_type: "Recipe and dose record"
      raw_fields: "lot; individual chemical/mineral identity; CAS where applicable; hydration; purity; moisture; carrier water; weighed mass; loss; stock changes"
      collection_method: "Weighed batch dosing and supplier grade certificates; audit each constituent and separate carrier water without duplicate input"
      unit: "kg"
      frequency: "Every lot"
      temporal_coverage: "Same product period"
      site_scope: "Actual conditioner/coating dosing points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Recipe approval, scale calibration and supplier composition; no historic formula default"
    - protocol_id: cp_waste
      process_id: "an_prilling"
      flow_role: "purge_wastewater; rejected_prills"
      record_type: "Waste transfer and characterisation"
      raw_fields: "stream; wet mass; density if needed; AN assay; NH4-N; NO3-N; coating/organic contamination; destination; stock; internal reuse"
      collection_method: "Calibrated waste weighing/flowmeters, representative chemical analyses and receiver tickets; distinguish water-phase purge from solid rejects"
      unit: "kg"
      frequency: "Each transfer and representative sampling"
      temporal_coverage: "Same product period"
      site_scope: "AN unit to external treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Recipient acceptance, composition, hazardous handling and provider requirements"
    - protocol_id: cp_air
      process_id: "an_prilling"
      flow_role: "ammonia_air; nitric_acid_air; pm25_air; pm25_10_air; pm_over10_air"
      record_type: "Post-abatement monitoring"
      raw_fields: "source/stage; species; gas flow; concentration; temperature/pressure; wet/dry basis; hours; control uptime; size bins; fugitives; detection limit"
      collection_method: "Validated species-resolved stack testing/monitoring after controls, size-resolved particulate sampling and justified fugitive measurement; account for condensable AN fume and acid-mist overlap"
      unit: "kg"
      frequency: "Continuous where available or representative tests for each operating mode"
      temporal_coverage: "Same product period, including nonroutine operation"
      site_scope: "All actual AN vents, cooling, screens, coating and loading"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling method, instrument calibration, control/bypass coverage and detection-limit treatment"
    - protocol_id: cp_allocation
      process_id: "an_prilling"
      flow_role: "Shared AN/usable steam burdens"
      record_type: "Engineering and commercial allocation evidence"
      raw_fields: "direct burdens; shared burdens; AN output; steam output; useful heat; causal relationship; contemporaneous prices; chosen shares"
      collection_method: "Evaluate the hierarchy using actual stage meters and recipient utility records; justify any economic fallback and sensitivity"
      unit: "kg; MJ; currency"
      frequency: "Annual or complete campaign assessment"
      temporal_coverage: "Same product and steam period"
      site_scope: "Same AN and steam transfer boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Written rationale, measured utility function, price dates and sensitivity"
  calculation_rules:
    - id: period_normalisation
      applies_to: "all inventory rows"
      rule: "a_i = Q_i / P; Q_i is the measured external exchange in the declared period, P is accepted net prill mass in kg. finished_prills is 1 kg. Keep internal loops out of Q_i. Use one representative complete operating year or a justified complete campaign for the same route, supplied state and grade, with matching lot and meter coverage. Retain raw, unallocated period totals, including all attributable start-up, shutdown, idle, recovery, cleaning, off-spec, failed and zero-accepted-output batches and rework; do not select only successful batches. Reconcile opening/closing work in progress and finished stocks with their accumulated inventory burdens, documenting carry-in/carry-out attribution without lost or duplicated burdens. P is strictly positive final accepted net product produced for that pool, reconciled with production, loading and stocks; exclude final rejects and count returned, reworked and reaccepted material only once. Apply period_normalisation to each reconciled raw exchange total once; row, protocol and calculation descriptions denote that same division. A complete period with P <= 0 requires a justified wider representative period or an incomplete result. Disclose omitted periods and their effect on representativeness. Future producers collect these records; this PCR supplies no fabricated site survey or activity quantities."
      inputs:
        - Q_i
        - P
        - "collection records"
      output: "Exchange amount per 1 kg reference flow"
      source_ids:
        - eu-lvic-aaf-2007
    - id: active_component
      applies_to: "nitric_acid_feed, ammonia_feed, magnesium_nitrate"
      rule: "Active-component mass = delivered mass times measured active mass fraction; carrier-water mass is measured separately or obtained from a verified complete composition, not automatically all non-active mass. Preserve delivered-solution provider basis."
      inputs:
        - "delivered mass"
        - assay
        - "complete composition"
      output: "Active species and carrier-water reconciliation"
      source_ids:
        - eu-lvic-aaf-2007
    - id: nutrient_conversion
      applies_to: "finished_prills"
      rule: "Nitrogen output = P times measured total-N fraction. An inventory per kg N equals the product-based inventory divided by that measured fraction; it is an additional nutrient result, not a replacement reference output. Keep nitrogen-form balances."
      inputs:
        - P
        - total-N
        - nitrate-N
        - ammoniacal-N
      output: "Declared kg-N output and optional nutrient normalization"
      source_ids:
        - yara-prilled-n
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Electrical energy in MJ = metered kWh times 3.6; preserve the selected property and provider quantity convention."
      inputs:
        - "metered kWh"
      output: "MJ electricity"
      source_ids:
        - eu-lvic-aaf-2007
    - id: steam_balance
      applies_to: "imported_steam, exported_steam"
      rule: "Evaluate delivered enthalpy against all measured steam and condensate-return mass/state streams at the same boundary. Retain internal reaction-heat recovery separately. Do not infer net heat from a unit label, kg mass alone, or an assumed condensate return."
      inputs:
        - "measured masses"
        - "measured states"
        - "supplier enthalpy convention"
      output: "Reconciled external mass and net delivered heat with compatible provider basis"
      source_ids:
        - eu-lvic-aaf-2007
    - id: emission_integration
      applies_to: "ammonia_air, nitric_acid_air, pm25_air, pm25_10_air, pm_over10_air"
      rule: "Integrate measured concentration times compatible gas volume over operating modes. For mg/Nm3 and Nm3, divide the product by 1000000 for kg. Use compatible temperature, pressure, dry/wet and pollutant definitions; add independently assessed fugitives once."
      inputs:
        - concentrations
        - "gas volumes"
        - "mode coverage"
        - fugitives
      output: "Species-resolved emitted kg"
      source_ids:
        - epa-an-ap42-1993
    - id: particulate_partition
      applies_to: "pm25_air, pm25_10_air, pm_over10_air"
      rule: "With compatible measured cumulative masses, PM2.5–10 = PM10 minus PM2.5; PM>10 = total particulate minus PM10. Never also sum cumulative total/PM10 with the bins. Missing size information remains unresolved."
      inputs:
        - "compatible measured total"
        - PM10
        - PM2.5
      output: "Non-overlapping fractions"
      source_ids:
        - epa-an-ap42-1993
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Reconcile inputs minus final product, external usable steam, external wastes, emitted species and change in stock on total mass, water and elemental-N ledgers. Track each internal link at both ends with equal quantity. Active AN is not fixed at theoretical yield; use measured recovery and losses."
      inputs:
        - "feed/product assays"
        - water
        - waste
        - emissions
        - "stock and recycle logs"
      output: "Declared residuals, uncertainties and reconciliation"
      source_ids:
        - eu-lvic-aaf-2007
    - id: burden_allocation
      applies_to: "all inventory rows"
      rule: "For shared burden B and justified share alpha, AN burden is alpha times B; directly attributable AN burdens are added separately. Shares across co-functions sum to one. Retain full physical output masses and report the allocated burden separately."
      inputs:
        - "direct/shared burdens"
        - "measured allocation key"
      output: "AN burden per 1 kg reference flow; separate physical ledger"
      source_ids:
        - ec-pef-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "All supplied product inputs and final output"
      requirement: "Confirm chemistry, grade, feed concentration, additive hydration, prill density/state and supplier quantity reference; UUID identity does not establish provider compatibility"
      evidence: "Primary certificates, assays and provider definitions"
    - id: dq_balance
      applies_to: "Mass, nitrogen, water and energy"
      requirement: "Retain both physical and allocated ledgers; review residuals against stated measurement uncertainty and a site-justified tolerance; no generic closure tolerance or yield is imposed"
      evidence: "Stage balance, stocks, recovery and calibration"
    - id: dq_emissions
      applies_to: "All applicable air sources"
      requirement: "Check abatement, bypasses, condensable fume, species mass and non-overlapping size intervals. AP-42 historical factors and low-density/uncontrolled distributions are not dense-prill defaults"
      evidence: "Actual monitoring and control logs; epa-an-ap42-1993"
    - id: dq_resolution
      applies_to: "Every applicable row"
      requirement: "Resolve missing identity/provider linkage before producing a complete dataset. Keep a measured but unidentified exchange visible; do not replace it with a correction flow or zero"
      evidence: "Actual flow and support definitions; receiver conditions"
    - id: dq_representation
      applies_to: "Production period and category"
      requirement: "Do not transfer a single factory recipe or energy/emission level as a category average; disclose production mode, grade coverage, region and temporal representativeness"
      evidence: "Actual period records; eu-lvic-aaf-2007"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validate_reference: Require exactly one final reference output finished_prills, 1 kg net supplied product, with the same denominator in inventories, protocols and calculations. Do not also inventory an intermediate AN product with this UUID as another final reference."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validate_route: Verify the dense fertilizer prilling route and exclusions, physical state and complete grade qualifiers. A formulation or granulation dataset cannot be accepted by a matching classification label alone [eu-lvic-aaf-2007, un-cpc3-2025]."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validate_quantity: Require actual quantities and traceable assays/densities/state conversions; reconcile mass, water, nitrogen, steam and inventory stock changes. Internal links must agree at both ends. Neither source stoichiometry nor a supplier reference property supplies actual yield, purity or heat demand."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validate_emissions: Verify species, outdoor-air subcompartment and sampling basis; the present UUIDs represent outdoor air unspecified only. Site evidence for a more specific compartment requires that corresponding verified identity. No cumulative PM10/total-plus-bin sum or acid-mist overlap is permitted; unknown size/monitor coverage is pending, not a pass [epa-an-ap42-1993]."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "validate_waste: Keep waste transfers distinct from elementary emissions and link external treatment once; show recovery, non-recycled rejects, impurity constraints and receiver acceptance. Direct final liquid discharge or onsite biological treatment requires a method/inventory extension before conformity [eu-lvic-aaf-2007]."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "validate_allocation: Verify subdivision/physical/economic rationale, recipient steam function, shared-burden shares and sensitivity. Actual material output and transferred steam remain full quantities in the physical ledger. Reject simultaneous allocated burdens and avoided-steam credit [ec-pef-2021]."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "validate_completeness: Missing actual ingredient, waste, identity, measurement, provider basis or incompatible source leaves the concrete dataset incomplete; no default zeros, proxy flows or classification coverage claim can repair it. Scientific review is distinct from these modelling checks."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site/grade-specific foreground dense AN fertilizer prilling production dataset"
  downstream_use: "secondary_dataset; background_dataset after actual data and provider review"
  allowed_use: "Cradle-to-gate modelling of the declared bulk straight AN grade using compatible upstream supplies and treatment"
  excluded_use: "Granulation; porous explosive prills; AN solutions; CAN/ASN/UAN/dual salts; explosives; fertilizer-use performance; unsupported generic fertilizer market averages"
  required_metadata: "Site; period; assays and carrier water; prill size/density method; conditioning; net mass; utilities and steam return; controls; recovery; waste recipients; upstream providers; allocation method"
  required_quality_disclosure: "Coverage and uncertainties; balances; missing identities and provider-basis debt; representativeness; cutoffs/extensions; allocation sensitivity; sampling and particle-bin limitations"
  update_trigger: "Route, assay, additive, treatment, utility, control or allocation changes; new original evidence; incompatible supplier basis; revised sampling/identity"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Structure, 30 June 2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "34613 classification identity and adjacent 34614/34615/34616 exclusions; classification is not a manufacturing recipe"
  - id: "eu-lvic-aaf-2007"
    type: "official_guidance"
    reference: "European Commission, LVIC-AAF BREF, August 2007; chapter 9 sections 9.2.1–9.2.7, 9.4.6, 9.5; printed pp.365–369,383–385 (PDF pp.393–397,411–413); https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf"
    used_for: "Neutralisation, concentration, prilling, heat/condensate recovery, conditioning, abatement and residual effluent boundary. AN provisions only; no CAN recipe, numeric emission threshold or historic plant consumption default"
  - id: "epa-an-ap42-1993"
    type: "official_guidance"
    reference: "US EPA AP-42 section 8.3, July 1993, reformatted January 1995; pp.8.3-1–3,8.3-6–7 and Figure 8.3-1; https://www.epa.gov/sites/default/files/2020-09/documents/8.3_ammonium_nitrate.pdf"
    used_for: "Dense versus porous prills, process map, actual additive/coating conditions, NH3/HNO3/particulate sources, recovery. Historical factors and uncontrolled low-density size distributions are not adopted as numeric defaults"
  - id: "yara-prilled-n"
    type: "handbook"
    reference: "Yara UK, PRILLED N product page, accessed 2026-10-14; https://www.yara.co.uk/crop-nutrition/fertiliser/other/prilled-n/"
    used_for: "Producer market-state and nitrogen-form example only; not site recipe, additive composition, dense-prill density measurement or default nutrient conversion"
  - id: "ec-pef-2021"
    type: "official_guidance"
    reference: "European Commission, C(2021) 9332 final, Annexes 1–2; Annex I section 4.5, PDF pp.63–64; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "General multifunctionality hierarchy and justification of physical/economic allocation; no fertilizer-specific fixed shares or claim of complete PEF conformity"
