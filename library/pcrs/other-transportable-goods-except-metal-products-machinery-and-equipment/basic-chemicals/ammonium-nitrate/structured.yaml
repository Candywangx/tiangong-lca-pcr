system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "boundary_route: Include feed storage/preheating/vaporisation, neutralisation, concentration, prilling, cooling, screens, conditioning actually used, product storage/loading, recovery and control equipment. Combine stages into one foreground unit while retaining stage meters and physical links with equal quantities at both ends [eu-lvic-aaf-2007, epa-an-ap42-1993]."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "boundary_utilities: Internally generated steam/condensate and recirculated cooling water are physical loops, neither new purchased inputs nor automatic credits. External steam production is an upstream unit; an onsite boiler requires a separate fuel, water and combustion inventory and source-specific method before inclusion. No boiler emissions are inferred from the AN process sources [eu-lvic-aaf-2007]."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "boundary_wastes: Include residual purge and non-recycled solids sent to declared external treatment. This boundary requires offsite final wastewater treatment and excludes direct final liquid discharge; onsite biological treatment or direct discharge needs additional specific inventories including water, nitrogen species, treatment chemicals, sludge and applicable gaseous emissions. A burdenless wastewater cutoff is not conforming [eu-lvic-aaf-2007]."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "boundary_complete: Quantify transport services, maintenance consumables and packaging when included in a concrete study using separate actual-material/service rows and compatible providers. This reference ends at bulk loading and excludes bagged delivery, fertilizer application, capital construction and end use; disclose each study-specific extension or justified exclusion. Do not omit an actual ingredient, fuel, lubricant or waste because its row is unresolved."
      source_ids: []
