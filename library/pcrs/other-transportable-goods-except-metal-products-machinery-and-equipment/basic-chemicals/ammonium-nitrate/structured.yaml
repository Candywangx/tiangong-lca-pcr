    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record delivered aqueous acid mass and measured HNO3 mass fraction separately. Distinguish active acid and carrier water; a 60% identity does not describe another concentration."
  - id: nutrient_basis
    applies_to: "finished_prills"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Product mass is not nitrogen mass. Convert only with measured lot-specific total-N mass fraction; keep ammoniacal-N and nitrate-N separately. Do not impose a commercial example as a default. Nitrogen in conditioning additives belongs in total N; do not infer AN assay from total N or assume an equal nitrogen-form split when such additives occur."
