        - dupont-irc120-na-2024
    - rule_id: actual_atomic_exchanges
      applies_to: "p_resin"
      rule: "Each physical product/waste transfer and each environmental species/compartment has one atomic row. Add actual filters, cooling make-up, neutralizers, fuels, packaging components and emissions separately when present. Whole mixed effluent is one waste stream with constituent subledgers; do not duplicate it as direct species emissions."
