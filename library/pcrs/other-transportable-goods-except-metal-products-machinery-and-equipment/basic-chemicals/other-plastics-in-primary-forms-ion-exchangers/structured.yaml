      rule: "Include every actual receipt, swelling, reagent blending, sulfonation, separation, agent recovery, hydration, sodium conversion, wash, screening, drainage, testing, abatement and utility duty through actual dispatch. Storage, packaging, handling/loading and rework loads remain included, whether or not product leaves in the release period."
