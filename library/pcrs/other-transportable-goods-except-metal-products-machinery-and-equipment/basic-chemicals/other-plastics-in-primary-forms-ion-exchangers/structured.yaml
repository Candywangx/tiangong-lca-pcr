allocation_rules:
  - rule_id: physical_tracking
    applies_to: "p_resin"
    rule: "Prefer direct grade/batch meters; subdivide shared utility, recovery, cleaning, warehouse and loading duties by evidenced run time, measured duty, mass handled or storage occupancy, retaining causality and uncertainty. Do not allocate by exchange capacity or compare grades solely by eq/L."
    source_ids:
      - rohm-haas-so3-sulphonation-1980
      - dupont-irc120-na-2024
  - rule_id: recovery_no_credit
    applies_to: "p_resin"
    rule: "Internal recovered SO3/DCE, condensate and reworked beads retain paired mass/composition/burden transfers and cancel on consolidation. Waste/resin fines are not automatically co-products. If a real saleable recovered product exits, add its actual row and separately justified allocation before reporting; no default displacement or avoided-treatment credit."
    source_ids:
      - rohm-haas-so3-sulphonation-1980
dataset_production:
  collection_protocols:
    - protocol_id: cp_feeds
      process_id: "p_resin"
      flow_role: "whole acquired chemical and precursor inputs"
      record_type: "foreground_records"
      raw_fields: "row_id; lot; timestamp; gross and tare; net raw mass; assay; carrier water; purity; precursor gel/crosslink/size; delivery unit; receipt/issue and raw-stock movements"
      collection_method: "Materials owner records raw weighed receipts, issued whole feeds and opening/closing raw stocks; reconcile actual process consumption, spills, recovery returns and assay subledgers. Do not divide by output. Preserve failed charges, rework and source COA."
      unit: "kg"
      frequency: "each batch and meter interval"
      temporal_coverage: "full matched period including failed/zero-output runs"
      site_scope: "actual resin site and declared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weights, invoices, issue logs and COA"
    - protocol_id: cp_utilities
      process_id: "p_resin"
      flow_role: "electricity heat steam gas and condensate"
      record_type: "foreground_records"
      raw_fields: "meter start/end; energy; integrated gas volume or rate/time; composition; temperature; pressure; steam enthalpy; condensate; operation time; shared-duty driver"
      collection_method: "Utility owner preserves raw interval totals for all manufacturing and actual recovery, failed runs, storage, handling and loading; record each carrier separately and its generation-module boundary. Integrate rates only; already integrated volumes receive no extra duration factor. No A/Q at collection."
      unit: "kg; MJ; kWh; m3"
      frequency: "each batch and meter interval"
      temporal_coverage: "full matched period including failed/zero-output runs"
      site_scope: "actual resin site and declared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, utility invoices, state/density evidence and allocation measurements"
    - protocol_id: cp_delivery
      process_id: "p_resin"
      flow_role: "acceptance drainage wet state and actual dispatch Q"
      record_type: "foreground_records"
      raw_fields: "unique lot/cohort; grade; new release R; gross/tare net dispatched wet mass; returned/reversed and re-delivered mass; moisture/drainage method; free liquid; functional groups; Na fraction; residual DCE/acid/salt; capacity test and bed volume"
      collection_method: "Quality and dispatch owner signs actual lot COA, repeatable equilibration/drainage procedure, calibrated fill mass and delivery notes. Record R separately from actual net external dispatch. Match returns/reversals to original deliveries and burden cohorts; a returned/reaccepted or re-delivered bead is never an additional new production. Do not dry the reporting denominator or infer mass from capacity. No normalization in this protocol."
      unit: "kg; mass fraction; eq/L; meq/g"
      frequency: "each batch and meter interval"
      temporal_coverage: "full matched period including failed/zero-output runs"
      site_scope: "actual resin site and declared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "COA, native-identity qualifiers, delivery/return receipts, sample and drainage records"
    - protocol_id: cp_pack
      process_id: "p_resin"
      flow_role: "actual packaging warehouse handling and dispatch materials"
      record_type: "foreground_records"
      raw_fields: "component row_id; composition; mass; tare; rejects; reusable turns; lot; warehouse occupancy; loading movements"
      collection_method: "Packing/logistics owner records undivided actual material quantities and physical handling records for all attributable cohorts, including rejects, returns and held stock. Energy is metered in cp_utilities with operation tags so the same burden is not added twice. Declare gate and dispatch/loading interface."
      unit: "kg"
      frequency: "each batch and meter interval"
      temporal_coverage: "full matched period including failed/zero-output runs"
      site_scope: "actual resin site and declared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "packing bills, tare checks, stock and handling logs"
    - protocol_id: cp_outlets
      process_id: "p_resin"
      flow_role: "waste and actual environmental species"
      record_type: "foreground_records"
      raw_fields: "stream row_id; phase; destination/medium; gross mass; composition; integrated exhaust or rate/time; sampling conditions; SO3/H2SO4 distinction; nitrogen; water; DCE; filter capture; recovered mass"
      collection_method: "Environmental owner weighs actual separate waste streams and samples real emitted species after control; preserve independent wet/dry gas basis, detection limits and measured treatment/recovery performance. Whole outsourced waste treatment is linked once. Never derive unknown water and unknown outlet from one residual, or turn a failed assay into zero. No division by Q."
      unit: "kg; m3"
      frequency: "each batch and meter interval"
      temporal_coverage: "full matched period including failed/zero-output runs"
      site_scope: "actual resin site and declared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets, treatment manifests, sample analyses and monitoring limits"
    - protocol_id: cp_carry
      process_id: "p_resin"
      flow_role: "WIP finished stocks internal loops and carried burdens"
      record_type: "foreground_records"
      raw_fields: "opening/closing raw WIP and finished masses; species/state; lot genealogy; carried burden vector by row_id; current process burdens; newly released R; dispatch Q; recovery/rework returns; failed/zero-output batches; warehouse and dispatch burdens"
      collection_method: "Production-accounting owner preserves raw masses and unnormalized burdens of opening/closing WIP and finished stocks, including earlier-period burdens and all failed/zero-output/rework activity. Reconcile manufacturing release and finished-store/dispatch ledgers separately; preserve internal transfer mass and carried burden until consolidation. Same-cohort returns cancel the prior dispatch before one re-delivery entry, with added rework burden retained; cross-period corrections identify the original cohort and prior report. Never assume R=Q or divide at collection."
      unit: "kg; row-native burden units"
      frequency: "each batch and meter interval"
      temporal_coverage: "full matched period including failed/zero-output runs"
      site_scope: "actual resin site and declared interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "inventory reconciliation, cost/physical burden ledger, genealogy and return documents"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert raw weighed units to kg; kWh to MJ using 3.6 MJ/kWh. For actual gas/liquid volume use independently supported density at matching composition/temperature/pressure. Rate times duration is an integrated volume; already integrated volume receives no second time factor. No normalization here."
      inputs:
        - cp_feeds
        - cp_utilities
        - cp_pack
        - cp_outlets
      output: "converted_raw"
      source_ids:
        - rohm-haas-so3-sulphonation-1980
    - id: species_ledger
      applies_to: "all material rows"
      rule: "Conserve complete physical mass and C/H/O/S/Na/Cl separately from measured chemical species and water state. Ideal aryl-H + SO3 → aryl-SO3H forms no net water; bound acid + NaOH → bound sodium sulfonate + H2O forms water only to independently measured conversion extent. Residual SO3 hydration consumes water; actual free-acid neutralization has its own assayed species/extent. These are balanced interpretation equations, not default reaction extents or proof of side-reaction absence. Distinguish chemical water, retained bead moisture, swelling/phase redistribution, carrier water, drainage and evaporation. Verify independent sulfur/Na/Cl and functional-group/speciation assays; never fit reaction water and outlet water to the same mass residual or use COD as a species balance."
      inputs:
        - converted_raw
        - cp_feeds
        - cp_delivery
        - cp_outlets
        - cp_carry
      output: "species_balance"
      source_ids:
        - rohm-haas-so3-sulphonation-1980
        - dupont-irc120-na-2024
    - id: cohort_ledger
      applies_to: "all inventory rows"
      rule: "Maintain raw manufacturing and finished-store ledgers by identical grade/route/Na/wet-state cohort. Manufacturing burden vector B_release = B_open_WIP + B_current_process - B_close_WIP, retaining failed/zero-output and unrecovered loss/rework burdens; no automatic scrap credit. Transfer the actual newly released R and B_release to the finished ledger once. Delivered burden A_i = B_open_FG_i + B_release_i + B_storage_dispatch_i - B_close_FG_i, with separately evidenced other exits/allocations and return corrections disclosed. Match opening stock embodied burdens, actual period storage/packing/loading and closing stock burdens to each lot. Internal release/store transfer cancels on consolidation. Finished closing stock is not added as a second production output of the same R; unshipped stock and its burdens remain carried, outside Q. Physical mass reconciliation uses stocks as stocks, not duplicate external exchanges. Q comes only from cp_delivery. Missing carried burdens or nonpositive Q prevents a per-kg delivered report."
      inputs:
        - converted_raw
        - species_balance
        - cp_carry
        - cp_delivery
        - cp_pack
        - cp_utilities
        - cp_outlets
      output: "A_i; Q"
      source_ids:
        - rohm-haas-so3-sulphonation-1980
        - dupont-irc120-na-2024
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q once, after raw conversions and complete cohort burden assignment; A_i is the full matched delivered-cohort raw numerator in the row native unit; Q is actual net delivered accepted wet resin kg, not R. Reference output is exactly 1 kg. Flow-card formulas and protocol aggregation name this single reporting operation, never a second A/Q."
      inputs:
        - A_i
        - Q
        - cp_delivery
        - cp_carry
      output: "a_i"
      source_ids:
        - rohm-haas-so3-sulphonation-1980
        - dupont-irc120-na-2024
  data_quality_requirements:
    - id: identity_and_state
      applies_to: "p_resin"
      requirement: "Verify nonfunctional gel precursor and distinct functionalized final identity, whole formulations, actual ionic conversion and wet drainage test; native generic identity cannot establish actual grade/provider suitability."
      evidence: "COA, functional-group and ionic assays, full native fields and supplier evidence"
    - id: period_completeness
      applies_to: "all inventory rows"
      requirement: "Account for all actual raw-period feeds, burdens, failed/zero-output operation, rework, returns, WIP/finished stocks and carry. Declare any missing field as uncertainty or unavailable result, never as zero."
      evidence: "raw logs, stock/burden reconciliations and signed owner reviews"
    - id: species_independence
      applies_to: "p_resin"
      requirement: "Independent mass/element, species and water-state evidence must all hold within documented analytical uncertainty; retain measured side reactions and residuals, not inferred exact closure."
      evidence: "independent analyses, sampling design, detection limits and uncertainty budget"
validation_rules:
  - rule_id: reference_gate
    applies_to: "p_resin"
    rule: "Require one terminal Product row supplied_resin with the declared UUID, 1 kg net actual delivered Na-form wet gel state and complete qualifiers; do not substitute unfunctionalized polymer, capacity, dry kg, H form or release R."
    source_ids:
      - rohm-haas-so3-sulphonation-1980
      - dupont-irc120-na-2024
  - rule_id: complete_period_and_unit
    applies_to: "all inventory rows"
    rule: "Require raw conversions, positive matched Q, WIP and finished-stock burden carry, all failed/rework/return records, one normalization and separate species/water balances; unresolved source fields, medium or conversions remain explicit findings."
    source_ids:
      - rohm-haas-so3-sulphonation-1980
      - dupont-irc120-na-2024
  - rule_id: native_limits_and_routes
    applies_to: "p_resin"
    rule: "Preserve all native name components, comments, missing CAS/geography, production-mix/type/property limits and classification debts in both languages. Native generic cation-resin medical use is not grade approval; actual contradictory chemistry/grade/route cannot be adopted. Check actual route against solvent-free counterevidence."
    source_ids:
      - rohm-haas-so3-sulphonation-1980
      - dupont-irc120-na-2024
      - lanxess-s1567-2020
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacture and actual supply of the stated new wet Na-form resin; combine with separately modelled resin use/regeneration only under its own function and gate."
  allowed_use: "Route/grade/state/period-qualified supplier inventories and equivalent-boundary comparisons with declared uncertainty."
  excluded_use: "Universal CPC coverage, any ion exchanger, dry-polymer equivalence, softening service/capacity/lifetime claims, medical/food/potable certification or a supplier recipe inferred from a generic UUID."
  required_metadata: "actual site and supply geography; matched cohort and reporting period; virgin gel precursor and crosslink metric; DCE/SO3 route and full commercial feed compositions; functional sulfonate and Na fraction; actual grade acceptance and residual DCE/free acid/salt; drainage and equilibrated moisture method; wet net delivered Q and inventory burden carry; dry-mass/capacity/bed-volume test conditions; actual utilities packaging treatment and dispatch interfaces"
  required_quality_disclosure: "Actual data coverage; Q versus R and stock carry; native contextual/coarse-classification limits; missing auxiliary UUIDs/providers; source age and example inconsistencies; species/conversion uncertainty."
  update_trigger: "Changes to matrix/crosslink/function/ionic state, sulfonating route/solvent, drainage/moisture, acceptance, site/provider, stock gate, recovery/treatment or primary evidence."
data_sources:
  - id: "rohm-haas-so3-sulphonation-1980"
    type: "literature"
    reference: "Rohm and Haas, US4209592A (1980-06-24), PDF pp.2–3, printed cols.1–4, Examples 1–3. https://patents.google.com/patent/US4209592A/en"
    used_for: "SO3/DCE gel sulfonation; separate disclosed hydration/NaOH conversion/washing and recovery operations. Historical lab cases only: Example 3 prose six hours versus Table 2 16 hours, no adopted time, dose, yield, moisture or default capacity; MR Example 1 is not a gel-grade result."
  - id: "dupont-irc120-na-2024"
    type: "handbook"
    reference: "DuPont, AmberLite IRC120 Na, 45-D01246-en Rev.5 (June 2024), pp.1–3. https://www.dupont.com/content/dam/water/amer/us/en/water/public/documents/en/IER-AmberLite-IRC120-Na-PDS-45-D01246-en.pdf"
    used_for: "Real styrene-DVB gel, sulfonic-acid functional group, shipped Na form and wet-state descriptors; swelling, capacity and particle/shipping densities are distinct measurements. Typical properties not universal acceptance or kg conversion; no claim that this SKU uses the selected process."
  - id: "lanxess-s1567-2020"
    type: "handbook"
    reference: "LANXESS, Lewatit S1567 flyer, 10365-EN 02/2020, Status 01/2020, pp.1–2. https://lanxess.com/-/media/project/lanxess/corporate-internet/products-and-solutions/brands/lewatit/service-center-product-literature/flyer_lewatit_s1567_en.pdf"
    used_for: "Independent manufacturer counterevidence: commercial monodisperse softening resin uses solvent-free production/sulfonation. Excludes that route from this DCE method; promotional performance and comparative charts are not transferred as factors or grade specifications."
