  production_route: "Purchased gel precursor → DCE swelling and SO3/DCE sulfonation → separation/recovery → hydration → aqueous NaOH conversion → washing/screening/drainage → net delivered wet resin."
  market_state: "Sodium-form swollen gel beads at the producer dispatch gate, reproducibly drained, no separately pooled shipping water, no transport tare in product mass."
functional_unit:
  what: "Supply new Na-form strong-acid gel cation exchanger for subsequent industrial use."
  how_much: "1 kg actual net delivered accepted wet resin of one grade, ionic form, route and drainage state."
  how_well: "Verify matrix, gel structure, sulfonate groups, Na-form conversion, bead integrity/size, moisture and actual residual solvent/acid/salt against declared COA limits and methods; no manufacturer typical values are universal limits."
  how_long_or_cycle: "One complete matched production/storage/delivery period; no treatment capacity or service-life functional equivalence."
  reference_flow_link: "supplied_resin"
system_boundary:
