        - rohm-haas-so3-sulphonation-1980
    - rule_id: route_separation
      applies_to: "p_resin"
      rule: "Solvent-free sulfuric-acid production is a real separate route and cannot inherit this DCE/SO3 inventory. No named commercial grade is assigned this process without site evidence; no food, drinking-water or pharmaceutical conformity follows from the reference."
