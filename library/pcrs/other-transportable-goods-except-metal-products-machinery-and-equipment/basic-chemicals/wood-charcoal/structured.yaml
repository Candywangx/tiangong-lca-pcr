allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "retort_unit"
    rule: "Accepted charcoal is the only commercial product in this route; assign attributable external burdens to charcoal without avoided-product credit for internal gas heat recovery. Preserve all actual physical outputs and losses."
    source_ids:
      - jrc-ilcd-2010
      - fao-industrial-charcoal-1985
  - rule_id: allocation_physical_ledger
    applies_to: "physical_balance"
    rule: "Do not multiply physical wood, water, carbon or heat balances by allocation shares; internal loops are neither new feed nor free outputs. Do not treat wood vinegar as pure acid or tar as a pure constituent, or derive co-product yields from potential components."
    source_ids:
      - fao-industrial-charcoal-1985
  - rule_id: allocation_scope_change
    applies_to: "commercial_cooutputs"
    rule: "Commercial chemicals, fines or net heat exports require a reassessed route and separately metered subdivision; inseparable processes need a goal/scope-compatible justified physical-causality or subsequent appropriate criterion with sensitivity disclosure. This PCR provides no default mass shares or prices."
    source_ids:
      - jrc-ilcd-2010
      - profagus-retort-biochemicals
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "retort_unit"
      flow_role: "charcoal_output"
      record_type: "Foreground measured records"
      raw_fields: "Lot, calibrated net weighing, measured tare, delivery moisture, size, ash/volatiles/fixed carbon and bases, opening/closing stock, rejects"
      collection_method: "Calibrated loading scale; paired laboratory moisture and quality tests"
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Declared complete representative campaign with start/end dates"
      site_scope: "Actual site and declared-route equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, lot links, stock reconciliation, gaps and uncertainty"
    - protocol_id: cp_wood
      process_id: "retort_unit"
      flow_role: "wood_input"
      record_type: "Foreground measured records"
      raw_fields: "Species/treatment, supplier, received net mass/moisture, charge/external-firing wood/returns, opening/closing stock, transport records"
      collection_method: "Calibrated receipt/charge weighing; representative moisture samples; material lot tracking"
      unit: "kg"
      frequency: "Each receipt and carbonization cycle"
      temporal_coverage: "Declared complete representative campaign with start/end dates"
      site_scope: "Actual site and declared-route equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, lot links, stock reconciliation, gaps and uncertainty"
    - protocol_id: cp_utilities
      process_id: "retort_unit"
      flow_role: "electricity_input; gas_input"
      record_type: "Foreground measured records"
      raw_fields: "Electric/gas meter readings, stage/equipment/time, supply voltage/provider/grid year, gas temperature/pressure/wet-dry/composition/compressibility and heating-value basis"
      collection_method: "Calibrated equipment metering reconciled to bills/provider background definitions; separate start-up/shutdown"
      unit: "MJ; m3"
      frequency: "Continuous with cycle totals"
      temporal_coverage: "Declared complete representative campaign with start/end dates"
      site_scope: "Actual site and declared-route equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, lot links, stock reconciliation, gaps and uncertainty"
    - protocol_id: cp_water
      process_id: "retort_unit"
      flow_role: "water_input; wastewater_output"
      record_type: "Foreground measured records"
      raw_fields: "Inlet mass or volume/density, makeup, circulation, cooling/cleaning, wastewater mass/composition/concentrations, receiver"
      collection_method: "Calibrated water meter/tank weighing and laboratory samples; distinguish circulation, offsite wastewater and condensate"
      unit: "kg"
      frequency: "Continuous and each wastewater shipment"
      temporal_coverage: "Declared complete representative campaign with start/end dates"
      site_scope: "Actual site and declared-route equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, lot links, stock reconciliation, gaps and uncertainty"
    - protocol_id: cp_residues
      process_id: "retort_unit"
      flow_role: "charcoal_fines_waste; condensate_waste; wood_ash_waste"
      record_type: "Foreground measured records"
      raw_fields: "Per-stream net mass/tare/moisture/composition, internal returns, transfer notes, waste status and receiving treatment"
      collection_method: "Separately weigh fines/condensate/heating ash; matched samples and receiver documents"
      unit: "kg"
      frequency: "Each generation and shipment"
      temporal_coverage: "Declared complete representative campaign with start/end dates"
      site_scope: "Actual site and declared-route equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, lot links, stock reconciliation, gaps and uncertainty"
    - protocol_id: cp_air
      process_id: "retort_unit"
      flow_role: "elementary outputs"
      record_type: "Foreground measured records"
      raw_fields: "Species/CAS/origin, outlet/leak point, species mass concentration or verified conversion, gas volume flow rate F (m3/time) or already integrated volume V (m3), interval/time/start-up/failures, matched temperature/pressure/wet-dry basis, size/condensables, detection limits, NO/NO2 speciation, fuel carbon"
      collection_method: "Representative full-cycle outlet and diffuse monitoring, including abnormal events; obtain raw period species masses through emission_integration with actual species/source apportionment, then apply campaign_normalization once. Do not multiply already integrated gas volume by time or zero-fill from historical AP42 factors"
      unit: "kg"
      frequency: "Representative complete cycles and each abnormal event"
      temporal_coverage: "Declared complete representative campaign with start/end dates"
      site_scope: "Actual site and declared-route equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling, lot links, stock reconciliation, gaps and uncertainty"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "For each non-reference external flow i, reconcile the raw attributable period amount X_i, stocks, WIP and returns over the complete matched pool defined above; q_i = X_i / Q exactly once. X_i has not already been divided by Q. Keep all matched failed/zero-output/rework burdens; internal transfers are not new external exchanges. Keep charcoal_output exactly 1 kg. If Q is not positive, the per-kg result is unavailable; do not discard failed runs or report zero burden. All external rows use one complete matched reporting pool for the same site, route and product state/grade, including failed and zero-output runs, rework, starts/stops and cleaning. Retain unnormalized period totals, stage transfers, opening/closing stocks and work in progress (WIP), with their attributable burdens. The common denominator Q is accepted loaded net charcoal kg with stock, WIP, rejects and fines reconciled separately. Exclude opening stock produced outside the pool from Q, or carry its matched prior-production burdens; never divide current-period loads by unmatched shipment mass or omit failed-run burdens. Zero-output subperiods retain their burdens in a justified matched pool with positive Q; if the complete pool has no positive Q, report per-kg results unavailable rather than zero or dividing by zero. Pair measured moisture with each weighed lot. Every protocol retains raw totals; its aggregation-rule column states the final per-1-kg output basis. Reconcile physical totals and stage attribution, then apply campaign_normalization exactly once. Credit each accepted net lot once after returns and reacceptance; internal rework is not new product output."
      inputs:
        - cp_product
        - cp_wood
        - cp_utilities
        - cp_water
        - cp_residues
        - cp_air
      output: "Normalized inventory from raw matched-pool totals, or unavailable if Q is not positive"
      source_ids:
        - fao-industrial-charcoal-1985
    - id: dry_yield
      applies_to: "wood_input; charcoal_output"
      rule: "For each lot m_dry = m_wet × (1 − w_wet_basis). Report dry-charge yield and total dry wood consumed including external wood firing separately; keep unconverted returns distinct without duplicate consumption."
      inputs:
        - cp_wood
        - cp_product
      output: "Dry-basis diagnostics; reference denominator unchanged"
      source_ids:
        - fao-industrial-charcoal-1985
    - id: emission_integration
      applies_to: "all elementary outputs"
      rule: "Calculate raw period species mass as the time integral E_i = integral C_i(t) F(t) dt, where C_i is species mass concentration and F is gas volume flow rate. For interval gas volumes V_j already integrated over time, sum flow-weighted interval concentrations C_i,j times V_j; do not multiply V_j by duration again. C_i times a volume flow rate times interval duration is valid only for a justified constant or compatible interval-average basis. Match concentration/flow temperature-pressure and wet-dry bases and convert units explicitly to kg. Match operating phases and source origins; disclose detection-limit treatment and unresolved species."
      inputs:
        - cp_air
        - cp_utilities
        - cp_product
      output: "Raw actual campaign emission mass; apply campaign_normalization afterward exactly once"
      source_ids:
        - jrc-wgc-2023
        - epa-charcoal-1995
    - id: physical_balances
      applies_to: "retort_unit"
      rule: "Retain wet-mass, dry-wood, total-carbon, water and heat ledgers; record combustion air/flue-gas throughput, reaction water, product/residue carbon, CO2/CO/CH4 and other carbon species, opening/closing stock and unmeasured residuals. Internal gas/condensate links have equal quantities at both ends and are not also external fuel inputs or air emissions."
      inputs:
        - cp_wood
        - cp_product
        - cp_utilities
        - cp_water
        - cp_residues
        - cp_air
      output: "Unallocated physical balances and residual explanation"
      source_ids:
        - fao-industrial-charcoal-1985
  data_quality_requirements:
    - id: actual_identity
      applies_to: "all inventory rows"
      requirement: "Declare actual species/route/supply state; successful UUID identity does not establish a complete background dataset."
      evidence: "Supplier primary records, direct identity and quantity-basis checks"
    - id: completeness
      applies_to: "retort_unit"
      requirement: "Screen all external exchanges and additional measured species; disclose missing measurements, unresolved speciation/UUIDs and incompatible backgrounds individually, without claiming zero or complete validation."
      evidence: "Process map, full-cycle monitoring, physical balances and receiver records"
    - id: representativeness
      applies_to: "retort_unit"
      requirement: "Document site, equipment, lot weights, season, moisture and start-up loads; single-plant and historical FAO/EPA data are not industry quantity defaults."
      evidence: "cp_product; cp_wood; cp_utilities; cp_air"
validation_rules:
  - rule_id: validation_reference
    applies_to: "charcoal_output"
    rule: "Exactly one reference product output: 1 kg net delivered charcoal; every row and collection protocol uses the same reference denominator with lot moisture qualifiers, excluding packaging tare and fixed-carbon-only mass."
    source_ids:
      - fao-industrial-charcoal-1985
  - rule_id: validation_boundary
    applies_to: "retort_unit"
    rule: "Check route exclusions and actual equipment; each waste/emission is one atomic exchange with compatible medium/origin/provider basis. Expose unresolved identity/quantity instead of substituting a neighbouring industry candidate."
    source_ids:
      - fao-industrial-charcoal-1985
      - jrc-wgc-2023
  - rule_id: validation_emissions
    applies_to: "elementary outputs"
    rule: "The three particle intervals are disjoint; cumulative PM10/total PM are reconciliation totals, not additional summed exchanges. Aggregate NOx needs NO/NO2 speciation, excluding N2O; total VOC/POM cannot replace actual species. Do not delete biogenic CO2 or duplicate captured and released material."
    source_ids:
      - epa-charcoal-1995
      - jrc-wgc-2023
  - rule_id: validation_balances
    applies_to: "retort_unit"
    rule: "Preserve the unallocated stock, phase, water, independent C/H/O and gross heat ledgers specified in Section 5, equal internal return links and residuals; missing concentration/flow, unmatched gas volumes, unspecified waste receiver or unresolved source origin makes data-package validation incomplete."
    source_ids:
      - fao-industrial-charcoal-1985
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Production inventory for charcoal within the declared scope; complete quantity compatibility before background linkage"
  allowed_use: "Charcoal input with matched species/route/moisture/grade"
  excluded_use: "Activated-carbon performance, briquette recipes, soil carbon-storage credits, pure-carbon substitution, other routes and direct liquid discharge"
  required_metadata: "Reference qualifiers, site/campaign, single-product status, emission media/origins, provider quantity bases and all waste destinations"
  required_quality_disclosure: "Measured coverage, physical-balance residuals, identity/speciation/background gaps, representativeness and uncertainty; unmeasured is not zero"
  update_trigger: "Changes in feed/route, co-products/heat exports, grade/moisture, voltage/providers, controls/emissions or waste receivers"
data_sources:
  - id: "un-cpc-34510"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, subclass 34510 — Wood charcoal. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/34510"
    used_for: "Classification label only; no process, purity or quantity rule."
  - id: "fao-industrial-charcoal-1985"
    type: "handbook"
    reference: "FAO Forestry Paper 63, Industrial charcoal making (1985), chapters 2 and 3. https://www.fao.org/4/X5555E/x5555e03.htm ; https://www.fao.org/4/X5555E/x5555e04.htm"
    used_for: "2.3 yield/measurement; 2.4–2.8 carbonization/heat recovery; 2.9.1 quality/composition/gross calorific bases; 2.9.2 aqueous and separate tar phases; 3.2–3.4 retorts. Historical examples establish physical methods only, not default temperatures, yields, recipes or energy."
  - id: "epa-charcoal-1995"
    type: "official_guidance"
    reference: "US EPA AP-42, Section 10.7 Charcoal, September 1995. https://www.epa.gov/sites/default/files/2020-10/documents/c10s07.pdf"
    used_for: "10.7.1 manufacture and 10.7.2 emissions; printed 10.7-1, 10.7-5 and 10.7-6. Species/control screening only. Tables 10.7-1/2 are historical uncontrolled rating-E factors, not default emissions for this retort; briquette quantities excluded."
  - id: "jrc-wgc-2023"
