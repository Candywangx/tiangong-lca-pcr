    reference: "European Commission JRC, WGC BREF (2023), Scope and BAT 2, 3, 8. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2023-01/WGC_BREF_2023_for_publishing%20ISSN%201831-9424_final_1_revised.pdf"
    used_for: "Printed xx–xxii and 267–274 (PDF 26–28 and 295–302); waste-gas inventory, abnormal operation and matched monitoring design after chemical-sector applicability assessment. No automatic legal applicability, limit values, CO2 accounting exclusions or frequencies as LCI defaults."
  - id: "profagus-retort-biochemicals"
    type: "literature"
    reference: "proFagus, Biochemicals — Products for industry, producer primary webpage. https://profagus.de/en/biochemicals/"
    used_for: "Plant primary evidence of wood retorts and chemical recovery, identifying a commercial co-product route requiring exclusion or reassessment; environmental marketing is not measured zero-emission or generic-yield evidence."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "JRC ILCD Handbook, General guide for LCA — Detailed guidance, first edition March 2010, 7.9.3. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Printed 257/PDF 277; physical-causality and subsequent market-value criteria for inseparable multifunctionality, constrained by goal/scope. This single-product route does not create co-product credits from internal gas."
