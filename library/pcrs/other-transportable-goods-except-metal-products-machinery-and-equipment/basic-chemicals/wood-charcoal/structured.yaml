      uuid: ""
    required_unit: "kg"
    rule: "Align concentration, flow and time on temperature/pressure, wet/dry and sampling bases before integration; report actual species mass. NOx equivalents are not NO or NO2 mass; source-split CO2/CO/CH4 without duplicating totals and fractions."
