system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "retort_unit"
      rule: "Include wood preparation, drying, retort, gas heat recovery/treatment, cooling, screening and onsite loading in one foreground unit with separate stage measurements. Internal links have equal quantities at both ends."
      source_ids:
        - fao-industrial-charcoal-1985
    - rule_id: boundary_emissions
      applies_to: "retort_unit"
      rule: "Account for post-treatment release, diffuse leaks, start-up/shutdown and failures; captured liquids/dust and internal gas are not also emitted. WGC BAT 2, 3 and 8 inform conditional monitoring design; the CPC chemical label does not establish EU legal applicability or permit BAT limits to replace measurement."
      source_ids:
        - epa-charcoal-1995
        - jrc-wgc-2023
    - rule_id: boundary_exclusions
      applies_to: "applicability"
      rule: "Use only the declared single-product internal heat-recovery route. Commercial chemical recovery, fines sales, heat exports, purchased steam, other fuels or direct liquid discharge require new applicability assessment, separate measurement and specific methods."
      source_ids:
        - fao-industrial-charcoal-1985
        - profagus-retort-biochemicals
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Keep unallocated opening/closing stocks and stage transfers for received wood, drying/retort charge, accepted and rejected charcoal, fines, aqueous condensate, dissolved and separated tar, non-condensable retort gas, auxiliary fuels, cooling water and captured residues. Record actual combustion air and its moisture, flue-gas throughput/composition and water-vapour discharge on compatible time and temperature/pressure bases. An internal transfer appears equally at sender and receiver; only an actual external exchange enters the normalized inventory. Tar retained in charcoal, dissolved in condensate, decanted, burned or emitted has distinct destinations; never infer their quantities from chemical-recovery examples. A separately transferred tar waste or any additional actual product needs its own concrete exchange and applicability assessment; do not hide it in the aqueous-condensate row (fao-industrial-charcoal-1985, 2.4–2.6 and 2.9.2)."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "For each lot retain measured moisture, ash, volatiles and their wet/dry test bases; fixed carbon by proximate difference is not an elemental-carbon measurement. Use documented representative elemental analysis of dry wood, charcoal, tar and residues and measured gas composition for independent C, H and O conservation checks, including water, combustion oxygen and stock changes. The water ledger distinguishes feed/air moisture and cooling makeup from reaction-generated water and reconciles measured water in product, condensate, wastewater and vapour. Attribute pyrolysis and combustion water with the stage measurements and H/O conservation; report unresolved attribution and residual uncertainty rather than forcing closure, assuming all condensate is feed moisture, or imposing a universal wood formula or reaction-water yield. Record the laboratory method, sampling, calibration, recovery and uncertainty for each matrix (fao-industrial-charcoal-1985, 2.3–2.6 and 2.9.1)."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Retain a gross heat ledger before allocation: document measured gross calorific values and moisture bases for actual wood, charcoal, retort gas and tar/condensate fuels; reconcile auxiliary heat and electricity, internal heat recovery, sensible/latent heat, reaction heat, retained product energy, stock changes and losses on one declared convention. Disclose calorimetry or metered-heat methods and any conversion between gross and net calorific bases. Electricity's database property name does not make it a combustible fuel; FAO's example calorific values and energy diagrams are not defaults. Internal recovered heat is a transfer, not an avoided-product credit (fao-industrial-charcoal-1985, 2.6 and 2.9.1)."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Select documented sampling and analytical methods for the actual post-treatment gas, leaks and captured phases. WGC BAT 8 provides a conditional EN/equivalent-quality method framework, not a universal retort speciation method. Require demonstrated analyte/matrix coverage, sampling location and duration, recovery/blanks, calibration, detection limits and uncertainty. Total organic carbon cannot be assigned as methanol, ethanol, acetone or acetic-acid mass; NOx-equivalent readings cannot establish separate NO/NO2 masses. Document separate vapour, aerosol and condensable fractions and disjoint particle-size measurements; EPA's briquetting controls and uncontrolled kiln factors cannot supply retort size shares or capture efficiencies. Measure captured and released fractions separately, reconcile phase overlap and retain additional detected species as atomic exchanges. Unsupported analytical coverage makes the data package incomplete (epa-charcoal-1995, 10.7.2; jrc-wgc-2023, BAT 2, 3 and 8)."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Untreated non-coniferous roundwood delivered at gate and actual electricity/gas/water supplies"
  starting_condition_role: "Foreground receipt point; not zero upstream burden"
  product_classification_scope: "Declared retort unbriquetted wood-charcoal subset of CPC 34510"
  recursive_input_rule: "Record internal fines/wood/off-gas returns in the physical ledger without another external reference output; purchased-charcoal processing is outside this roundwood route"
  upstream_dataset_requirement: "Compatible forestry/harvest/roadside and inbound transport, geographic/year-specific grid, pipeline gas and water backgrounds; disclose each gap"
  disclosure: "Equipment, carbonization/firing fuels, controls, water destination, internal links, single-product status, foreground/background responsibilities and abnormal operation"
