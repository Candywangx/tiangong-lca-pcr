    required_unit: "kg"
    rule: "cp_wood and cp_product measure wet-basis moisture w separately; diagnostic dry mass m_dry = m_wet × (1 − w). Report dry-basis yield separately without changing the delivered-mass denominator; no historical volume, stacking or yield coefficients (fao-industrial-charcoal-1985, 2.3 and 2.9.1)."
