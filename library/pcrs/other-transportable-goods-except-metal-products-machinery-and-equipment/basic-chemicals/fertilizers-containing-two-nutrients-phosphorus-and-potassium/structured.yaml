measurement_rules:
  - id: reference_mass
    applies_to: "pk_product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "B is the sum of net newly completed fertilizer of this exact SKU/state/route crossing the final acceptance/release gate during the declared period, counted once and excluding packaging, resale of already completed opening stock and sold off-grade output. Weigh gross and tare independently; retain moisture and all raw totals."
  - id: period_coverage
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Consistent exchange property"
      uuid: ""
    required_unit: "per 1 kg reference flow"
    rule: "Preserve the complete same-product/state/route period, including start-up, shutdown, failed/zero-output batches, cleaning, rework and work in progress. Attribute its full resource/emission pool, then normalize once by positive B. If the whole pool has B = 0, retain totals and do not invent a normalized result."
  - id: material_basis
    applies_to: "feed_tsp; feed_kcl; limestone_filler; pk_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Supplied fertilizer mass is not nutrient-equivalent mass or pure active-component mass. Record water, coating and impurities within supplied mass; component assays are parallel balances, not repeated purchased exchanges. Retain both P versus P2O5 and K versus K2O conventions and use documented molar conversion only when needed."
  - id: provider_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Native reference property"
      uuid: ""
    required_unit: "native reference unit"
    rule: "Store supplier reference quantity separately from period demand. Verify state, grade, actual kg/m3/MJ definitions and any density, pressure, temperature, wet/dry or normal/actual volume conditions. Identity lookup alone proves no provider compatibility."
  - id: package_basis
    applies_to: "bag_pp; liner_pe; waste_pp; waste_pe"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh each actual empty component and retain counts/capacity as separate checks. Do not infer package mass from fertilizer capacity or impose a default number of bags."
  - id: emission_basis
    applies_to: "pm25; pm2510; pm10plus; carbonate_co2"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Concentration times an already integrated compatible gas volume gives mass; multiply by time only when integrating a volume flow rate. Retain pressure/temperature, moisture, normal/actual volume, operating coverage and detection limits; no repeated time multiplier."
