          description: "Conditional observed mineral-carbon release if free acid and carbonate filler actually react. Measure the species, mineral carbon origin, quantity and receiving air compartment, reconcile consumed carbonate and resulting water, and reopen the no-reaction applicability decision. Atmospheric resource CO2 and delayed-emission correction records are rejected. No positive emission, zero emission, carbonate conversion or reaction yield is assumed."
          amount:
            expression: "Use cp_air for actual attributable period quantity; retain raw totals and report per 1 kg reference flow only when B is positive. No default amount."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_air
              source_ids:
                - origin-pk-sds-2016
            ranges: []
allocation_rules:
  - rule_id: physical_ledger
    applies_to: "all inventory rows"
    rule: "Preserve the full unallocated material/water/P/K/Cl/mineral-carbon and packaging ledger, with opening/closing stocks, all failed lots and paired equal internal returns. Do not multiply physical outputs by an allocation share or credit internal recycling."
    source_ids:
      - efba-solid-blending-2016
  - rule_id: burden_attribution
    applies_to: "blend"
    rule: "First separate grade campaigns and directly measured operations. Attribute common electricity, cleaning and dust control by measured causal duty; retain all same-route zero-output events in the attributable pool. Keep environmental-burden allocation in a separate ledger. If a genuine off-grade nutrient co-product is sold, document function/quality and first seek subdivision; any remaining allocation needs a justified method, sum-to-one shares and sensitivity before completed use."
    source_ids:
      - efba-solid-blending-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "blend"
      flow_role: "pk_product"
      record_type: "foreground_record"
      raw_fields: "SKU; gross; tare; accepted net mass B; P/P2O5 and K/K2O assays; solubility; moisture; sieve results; start/end pre-acceptance stocks/WIP; separate completed-goods warehouse ledger; one-time release event; failed lots; WIP embodied-burden carryover"
      collection_method: "Calibrated final net weighing and representative composition/segregation sampling at receipt, storage and dispatch"
      unit: "kg"
      frequency: "Each batch/stage and linked representative monitoring period"
      temporal_coverage: "Complete declared period including start/stop, failed/zero-output events, rework, storage and WIP"
      site_scope: "Actual selected site, SKU/state/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, certificates, sampling scope, stock/transfer reconciliation and receiver/provider records"
    - protocol_id: cp_material
      process_id: "blend"
      flow_role: "feed_tsp; feed_kcl; limestone_filler"
      record_type: "foreground_record"
      raw_fields: "lot; supplier; complete supplied mass; KCl measured m3, packing convention, moisture and independently measured bulk density; opening/closing feed stock; metered charge; full formulation; nutrient and impurity assay; coating; moisture; free acidity; compatibility; internal returns"
      collection_method: "Calibrated receipt/feed scales, compatible KCl volume/bulk-density measurement and stock reconciliation; retain grade certificates, real physical tests and supplied quantity definition"
      unit: "kg; m3"
      frequency: "Each batch/stage and linked representative monitoring period"
      temporal_coverage: "Complete declared period including start/stop, failed/zero-output events, rework, storage and WIP"
      site_scope: "Actual selected site, SKU/state/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, certificates, sampling scope, stock/transfer reconciliation and receiver/provider records"
    - protocol_id: cp_energy
      process_id: "blend"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "stage; kWh; meter; voltage; period; start/stop/idle consumption; shared loads; equipment duty; supplier reference amount; provider region/year"
      collection_method: "Read calibrated stage meters including fans and packing; reconcile site bills and measured common-load attribution"
      unit: "MJ"
      frequency: "Each batch/stage and linked representative monitoring period"
      temporal_coverage: "Complete declared period including start/stop, failed/zero-output events, rework, storage and WIP"
      site_scope: "Actual selected site, SKU/state/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, certificates, sampling scope, stock/transfer reconciliation and receiver/provider records"
    - protocol_id: cp_pack
      process_id: "blend"
      flow_role: "bag_pp; liner_pe"
      record_type: "foreground_record"
      raw_fields: "supplier; actual sack and liner grade; total issue; empty component mass; package counts; capacity; stock change; shipped mass; damaged mass"
      collection_method: "Weigh actual empty components separately; reconcile purchased, issued, shipped, retained and discarded packaging without conflating capacity and material mass"
      unit: "kg"
      frequency: "Each batch/stage and linked representative monitoring period"
      temporal_coverage: "Complete declared period including start/stop, failed/zero-output events, rework, storage and WIP"
      site_scope: "Actual selected site, SKU/state/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, certificates, sampling scope, stock/transfer reconciliation and receiver/provider records"
    - protocol_id: cp_waste
      process_id: "blend"
      flow_role: "offgrade_product; reject_fertilizer; captured_dust; waste_pp; waste_pe"
      record_type: "foreground_record"
      raw_fields: "origin; actual full wet mass; dry matter; P/K/Cl/mineral carbon; polymer; contamination; internal return quantity; offgrade sale; receiver; treatment; transfer receipts"
      collection_method: "Weigh separate physical streams and internal transfers; verify sale/function or waste status and destination, never assign both statuses to the same material"
      unit: "kg"
      frequency: "Each batch/stage and linked representative monitoring period"
      temporal_coverage: "Complete declared period including start/stop, failed/zero-output events, rework, storage and WIP"
      site_scope: "Actual selected site, SKU/state/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, certificates, sampling scope, stock/transfer reconciliation and receiver/provider records"
    - protocol_id: cp_water
      process_id: "blend"
      flow_role: "cleaning_water; humidity_uptake; cleaning_effluent; water_vapour"
      record_type: "foreground_record"
      raw_fields: "cleaning cycle; measured supply mass or m3; density/temperature; wet effluent; dissolved/suspended material; raw/product/stock moisture; ambient humidity; independently measured evaporation/uptake; destination"
      collection_method: "Meter complete cleaning periods, sample water and solids separately and measure moisture exchange independently; retain unexplained residual, no COD-based water generation"
      unit: "kg"
      frequency: "Each batch/stage and linked representative monitoring period"
      temporal_coverage: "Complete declared period including start/stop, failed/zero-output events, rework, storage and WIP"
      site_scope: "Actual selected site, SKU/state/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, certificates, sampling scope, stock/transfer reconciliation and receiver/provider records"
    - protocol_id: cp_air
      process_id: "blend"
      flow_role: "pm25; pm2510; pm10plus; carbonate_co2"
      record_type: "foreground_record"
      raw_fields: "source; species; mineral carbon origin; size bins; concentration; integrated gas volume or flow rate/time; actual/normal and wet/dry bases; pressure; temperature; controls; fugitives; represented hours; detection limits"
      collection_method: "Measure residual stack and fugitive releases under represented operating states; match concentration and volume basis, distinguish integrated volume from volume rate; verify mineral-carbon source if CO2 occurs"
      unit: "kg"
      frequency: "Each batch/stage and linked representative monitoring period"
      temporal_coverage: "Complete declared period including start/stop, failed/zero-output events, rework, storage and WIP"
      site_scope: "Actual selected site, SKU/state/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, certificates, sampling scope, stock/transfer reconciliation and receiver/provider records"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Divide each full attributable period exchange by positive accepted net B once; retain raw totals. Target reference output is exactly 1 kg. If B = 0, report the period totals and unresolved normalization, not a fabricated unit inventory."
      inputs:
        - cp_product
        - cp_material
        - cp_energy
        - cp_pack
        - cp_waste
        - cp_water
        - cp_air
      output: "Exchanges per 1 kg reference flow and preserved raw totals"
      source_ids:
        - efba-solid-blending-2016
    - id: energy_conversion
      applies_to: "electricity"
      rule: "Convert metered kWh to MJ using 3.6, once; preserve provider reference quantity separately. The native flow property is Net calorific value, not a renamed generic electricity property."
      inputs:
        - cp_energy
        - cp_product
      output: "MJ per 1 kg reference flow"
      source_ids:
        - efba-solid-blending-2016
    - id: kcl_volume_basis
      applies_to: "feed_kcl"
      rule: "Preserve measured supplied kg for mass/P/K/Cl balances; use measured compatible m3, or supplied kg divided by measured density for the identical supplier volume/packing/moisture definition. Keep supplier reference m3 separate from campaign m3 demand, then divide once by positive B. Undefined solid/bulk volume convention is unresolved, never a default conversion."
      inputs:
        - cp_material
        - cp_product
      output: "m3 per 1 kg reference flow and parallel kg ledger"
      source_ids:
        - efba-solid-blending-2016
    - id: material_balance
      applies_to: "all inventory rows"
      rule: "Received supplied materials plus opening in-process stock and measured environmental uptake equal accepted product, sold off-grade, discarded fertilizer/dust, actual releases and closing in-process stock/WIP (excluding the already counted released target output), on matching wet and dry bases. Keep internal returns equal on both sides and cancel only in the aggregate. Balance P, K and Cl from measured composition across each outlet; solubility assays do not equal total elemental content. Packaging has a separate stock/ship/waste ledger. Preserve residuals and measurement uncertainty; never tune yield, losses or emissions to force closure."
      inputs:
        - cp_product
        - cp_material
        - cp_waste
        - cp_water
        - cp_air
        - cp_pack
      output: "Full unallocated physical and element ledgers"
      source_ids:
        - efba-solid-blending-2016
    - id: water_carbon_balance
      applies_to: "all inventory rows"
      rule: "Balance molecular water and measured mineral/organic carbon independently of wet total mass. Distinguish material moisture, contained cleaning liquid, real vapour exchange and any evidenced reaction generation/consumption. A measured carbonate reaction needs stoichiometric/species and route review; no residual or COD value establishes reaction water, evaporated water or CO2. Packaging/coating carbon retained in product or waste is not a direct air emission."
      inputs:
        - cp_material
        - cp_water
        - cp_air
        - cp_waste
        - cp_pack
      output: "Water and carbon ledgers with explained and unexplained differences"
      source_ids:
        - origin-pk-sds-2016
    - id: air_mass
      applies_to: "pm25; pm2510; pm10plus; carbonate_co2"
      rule: "Multiply compatible concentration by integrated gas volume; or integrate concentration times volume flow rate over time. Never multiply an already integrated volume by time again. Retain residual post-control emissions separately from collected solids and non-overlapping particle bins."
      inputs:
        - cp_air
      output: "Measured campaign mass then one normalization"
      source_ids:
        - efba-solid-blending-2016
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Confirm whole supplied identity, grade, CAS where relevant, native property and provider quantity basis. Blank UUIDs are explicit gaps, never zero exchanges; chemical components do not substitute for complete preparations."
      evidence: "cp_material; cp_pack; cp_product"
    - id: quality_representative
      applies_to: "pk_product"
      requirement: "Demonstrate actual accepted PK composition and no intentional N source; retain sampling, compatibility, storage and segregation results. Do not transplant a supplier example or SDS minimum as a recipe or universal grade."
      evidence: "bartholomews-pk-blends; origin-pk-sds-2016; efba-solid-blending-2016"
    - id: quality_completeness
      applies_to: "all inventory rows"
      requirement: "Distinguish demonstrated absence, measured zero, below detection, missing measurement and unresolved identity. Include complete period stocks/WIP and every real outlet. An incomplete upstream/treatment link or measurement relationship remains disclosed."
      evidence: "cp_product; cp_waste; cp_air; cp_water"
validation_rules:
  - rule_id: validate_reference
    applies_to: "pk_product"
    rule: "Require one compatible whole finished-blend reference identity with Mass/kg, matching route and delivery state. Verify the conditional generic identity against the actual whole PK product and provider basis with source-context debts disclosed. Mechanical checks alone do not establish physical or provider compatibility."
    source_ids:
      - eu-jrc-lvic-aaf-2007
  - rule_id: validate_period
    applies_to: "all inventory rows"
    rule: "Verify bilingual denominator/aggregation equality, all original totals and exactly one division by positive B. No discarded failed batches or fabricated zero-output normalization. Each protocol belongs to blend and covers its linked rows."
    source_ids:
      - efba-solid-blending-2016
  - rule_id: validate_physics
    applies_to: "all inventory rows"
    rule: "Check unallocated wet/dry mass, water, P, K, Cl, carbon, packaging and stock/return ledgers separately from allocated burdens. Investigate residuals and reaction indications; no default recipe, assay, loss, water generation or emission factor."
    source_ids:
      - origin-pk-sds-2016
      - efba-solid-blending-2016
  - rule_id: validate_air
    applies_to: "pm25; pm2510; pm10plus; carbonate_co2; water_vapour"
    rule: "Verify species/origin, outdoor-air medium, native reference property, compatible sampling/volume basis and non-overlapping particulate bins. Correction/resource flows do not replace emissions; captured dust is not emitted again."
    source_ids:
      - efba-solid-blending-2016
  - rule_id: validate_scope
    applies_to: "blend"
    rule: "Verify actual dry physical route and complete supplied coating/ingredient coverage. Real additional process or exchange requires atomic inventory and source-supported method extension, not silent omission or a scope change to satisfy checks."
    source_ids:
      - eu-jrc-lvic-aaf-2007
      - bartholomews-pk-blends
published_dataset_profile:
  dataset_role: "Candidate foreground production methodology for the declared physical PK subtype; scientific approval pending"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Future verified plant-gate supply inventory for the defined TSP/MOP PK blend"
  excluded_use: "Unverified product/provider links, universal PK coverage, pure potassium phosphate, other nutrient combinations, field fertilization emissions or agronomic equivalence"
  required_metadata: "All reference qualifiers; full raw period totals and positive B; actual upstream quantity links; site/route; sampling and balance ledgers; allocation and capital scope"
  required_quality_disclosure: "Conditional generic reference and source-context debts; withdrawn limestone CAS conflict; package/waste/atmospheric-uptake/mineral-CO2 gaps; native metadata conflicts; provider and measurement uncertainties; independent scientific review pending"
  update_trigger: "Verified finished reference available, different ingredients/coating/route/voltage, changed grade, waste/treatment fate, provider quantity basis or monitoring methods"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, p.166. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context only; the leaf does not prescribe a route or canonical identity"
  - id: "eu-jrc-lvic-aaf-2007"
    type: "official_guidance"
    reference: "European Commission, LVIC-AAF BREF, August 2007, §§7.1 and 7.2.1, printed pp.283/285, PDF pp.311/313. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-03/LVIC-AAF.pdf?download=1"
    used_for: "PK nutrient reporting and distinction of mechanical blending from reacted routes; no plant size, recipe or consumption defaults"
  - id: "bartholomews-pk-blends"
    type: "literature"
    reference: "Bartholomews, Bespoke Fertiliser Blends, PK subsection, web snapshot 15 October 2026. https://www.bartholomews.co.uk/blends"
    used_for: "Producer corroboration of TSP/MOP PK blends; supplier examples and coated TSP do not establish a universal recipe, particle size or coating composition"
  - id: "origin-pk-sds-2016"
    type: "literature"
    reference: "Origin Fertilisers (UK), Group 9 nitrogen-free P and PK SDS, Revision B, 17 June 2016, §§1,3,6–10. https://originsoilnutrition.co.uk/wp-content/uploads/2021/01/1.-Origin-SDS-Group-9.pdf"
    used_for: "Historical product-family identity, possible limestone, moisture/compatibility and containment; not a complete formulation, current legal instruction or normal-operation emission factor"
  - id: "efba-solid-blending-2016"
    type: "handbook"
    reference: "EFBA, Handbook of Solid Fertiliser Blending, Code of Good Practice for Quality, third edition 2016, March 2017 file, §§2–5,7–9. https://fertiliser-society.org/wp-content/uploads/2019/11/Blender-Handbook-2017-efba.pdf"
    used_for: "Dry-blend definition, weighing/calibration, material compatibility, segregation and sampling; no table examples or historical legal provisions become defaults"
  - id: "pubchem-lanthanum-carbonate-168924"
    type: "dataset"
    reference: "NCBI PubChem, CID168924 molecular formula and IUPAC name, CAS-name query 587-26-8, retained 15 October 2026. https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/name/587-26-8/property/MolecularFormula,IUPACName/JSON"
    used_for: "Chemical-identity counterevidence only: CAS587-26-8 resolves to lanthanum carbonate (C3La2O9), supporting rejection of the contradictory limestone record; no limestone grade, recipe, exchange amount or conversion factor follows"
