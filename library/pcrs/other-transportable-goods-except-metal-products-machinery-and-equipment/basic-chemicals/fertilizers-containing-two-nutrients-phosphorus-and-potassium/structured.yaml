        - efba-solid-blending-2016
    - rule_id: boundary_actual
      applies_to: "all inventory rows"
      rule: "Conditional absence requires evidence. Retain every actual observed exchange and its origin/destination; additional carriers, reagents, releases, transport and treatment require separate atomic rows and methods before use. A no-output operation is not omitted."
      source_ids:
        - efba-solid-blending-2016
        - origin-pk-sds-2016
    - rule_id: boundary_capital
      applies_to: "blend"
      rule: "Declare actual assets and capital scope. If equipment burdens are included, retain physical asset quantity/materials, service period, productive capacity and measured allocation separately from period service equivalents, with individually identified exchanges. No fictitious per-kg equipment mass or default lifetime; any exclusion needs a documented scope decision and sensitivity."
      source_ids:
        - efba-solid-blending-2016
