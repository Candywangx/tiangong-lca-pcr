allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "sc_formulation"
    rule: "One accepted supplied SC is the sole useful output; waste, samples and internal rework are not co-products. Assign the complete attributable campaign burden, including failed/zero-output operation, to that product cohort; do not credit avoided pesticide, wastewater or packaging production."
    source_ids:
      - sinochem-imidacloprid-sc-2015
  - rule_id: allocation_shared
    applies_to: "shared utilities and cleaning"
    rule: "Prefer dedicated meters and batch/stage submetering. For genuinely shared service, document a measured causal driver and partition each raw burden once across products and closing WIP; retain totals and allocation evidence. Unresolved allocation stays a data gap, never an unreported zero."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "sc_formulation"
      flow_role: "accepted supplied product"
      record_type: "release_and_weighing"
      raw_fields: "site; SKU; route; period start/end; stage; owner; batch; instrument; unit; raw value; opening/closing WIP; return/rework IDs; burden cohort; unique lot/acceptance ID; net wet mass; gross/tare; fresh manufacture flag; shipment/finished-stock reconciliation; rejected and recovered mass; g/kg assay; g/L assay; density and temperature; particle size and release tests"
      collection_method: "Owner: quality release lead and weighing custodian. Use calibrated net weighing and signed release records. Establish Q only from newly accepted supplied formulation of the same product/route/state. Old finished stock, returned already-accepted product, rework transfers and rejected material do not add another Q; reconcile dispatch and opening/closing finished stock separately. Retain unnormalized period records and the compatible attributable raw numerator without division, with cohort and WIP burden transfers documented. After verified raw-unit conversion and attribution, normalize_period alone divides by the unique positive accepted wet SC mass Q. Card amount formulas and aggregation_rule describe this same final reporting operation, not a second division. No duplicated returned or reworked output; Q=0 retains the complete pool without a normalized result."
      unit: "kg; g/kg; g/L; kg/L"
      frequency: "Each batch/stage and full period closure"
      temporal_coverage: "Complete actual matched period, including failed and zero-output runs and associated start-up/idle/cleaning"
      site_scope: "One declared site, actual supply country, SKU and aqueous milling route; no cross-formulation average"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ticket; signed reconciliation; raw unsuccessful runs; uncertainty and gaps"
    - protocol_id: cp_materials
      process_id: "sc_formulation"
      flow_role: "each acquired ingredient"
      record_type: "issue_and_assay"
      raw_fields: "site; SKU; route; period start/end; stage; owner; batch; instrument; unit; raw value; opening/closing WIP; return/rework IDs; burden cohort; ingredient SKU; complete supplied mass; supplier; assay; moisture; solvent/carrier identity and fraction; unopened returns; spills; constituent ledger"
      collection_method: "Owner: materials custodian and laboratory analyst. Weigh batch issues and unconsumed returns; retain certificates and independent assay where needed. Record complete supplied JM, wetting agent, hydrogel and antifoam once; active/polymer/water are subledgers. Internal slurry and first-rinse recovery retain originating burdens, not a new external purchase. Retain unnormalized period records and the compatible attributable raw numerator without division, with cohort and WIP burden transfers documented. After verified raw-unit conversion and attribution, normalize_period alone divides by the unique positive accepted wet SC mass Q. Card amount formulas and aggregation_rule describe this same final reporting operation, not a second division. No duplicated returned or reworked output; Q=0 retains the complete pool without a normalized result."
      unit: "kg; fraction"
      frequency: "Each batch/stage and full period closure"
      temporal_coverage: "Complete actual matched period, including failed and zero-output runs and associated start-up/idle/cleaning"
      site_scope: "One declared site, actual supply country, SKU and aqueous milling route; no cross-formulation average"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ticket; signed reconciliation; raw unsuccessful runs; uncertainty and gaps"
    - protocol_id: cp_power
      process_id: "sc_formulation"
      flow_role: "electricity"
      record_type: "submeter"
      raw_fields: "site; SKU; route; period start/end; stage; owner; batch; instrument; unit; raw value; opening/closing WIP; return/rework IDs; burden cohort; start/end meter; time; rated versus measured power; line allocation; failed/idle energy; cooling pump/filler readings"
      collection_method: "Owner: electrical metering custodian. Use net meter differences. Integrate measured power over duration only when no cumulative energy total exists; do not use nameplate power as a measured consumption. Retain shearing/milling/auxiliary stage totals independently. Retain unnormalized period records and the compatible attributable raw numerator without division, with cohort and WIP burden transfers documented. After verified raw-unit conversion and attribution, normalize_period alone divides by the unique positive accepted wet SC mass Q. Card amount formulas and aggregation_rule describe this same final reporting operation, not a second division. No duplicated returned or reworked output; Q=0 retains the complete pool without a normalized result."
      unit: "kWh"
      frequency: "Each batch/stage and full period closure"
      temporal_coverage: "Complete actual matched period, including failed and zero-output runs and associated start-up/idle/cleaning"
      site_scope: "One declared site, actual supply country, SKU and aqueous milling route; no cross-formulation average"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ticket; signed reconciliation; raw unsuccessful runs; uncertainty and gaps"
    - protocol_id: cp_water
      process_id: "sc_formulation"
      flow_role: "separate formulation and cleaning water"
      record_type: "meter_and_transfer"
      raw_fields: "site; SKU; route; period start/end; stage; owner; batch; instrument; unit; raw value; opening/closing WIP; return/rework IDs; burden cohort; source; water treatment; integrated volume or rate/duration flag; density/temperature; fresh issue; hydrogel/JM-carried water subledger; rinse destination; cooling makeup"
      collection_method: "Owner: water-meter custodian and batch operator. Use calibrated mass or cumulative volume with supported density. Distinguish formulation charge, cleaning, makeup, recovered transfers and discharge. No extra duration on integrated volume, no circulation counted as consumption, and no duplicated supplied carrier water. Retain unnormalized period records and the compatible attributable raw numerator without division, with cohort and WIP burden transfers documented. After verified raw-unit conversion and attribution, normalize_period alone divides by the unique positive accepted wet SC mass Q. Card amount formulas and aggregation_rule describe this same final reporting operation, not a second division. No duplicated returned or reworked output; Q=0 retains the complete pool without a normalized result."
      unit: "kg; L; kg/L"
      frequency: "Each batch/stage and full period closure"
      temporal_coverage: "Complete actual matched period, including failed and zero-output runs and associated start-up/idle/cleaning"
      site_scope: "One declared site, actual supply country, SKU and aqueous milling route; no cross-formulation average"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ticket; signed reconciliation; raw unsuccessful runs; uncertainty and gaps"
    - protocol_id: cp_packaging
      process_id: "sc_formulation"
      flow_role: "each actual packaging component"
      record_type: "component_issue"
      raw_fields: "site; SKU; route; period start/end; stage; owner; batch; instrument; unit; raw value; opening/closing WIP; return/rework IDs; burden cohort; component material/grade; unit count and measured component mass; rejects; returnable cycles; net/gross fill; other components"
      collection_method: "Owner: packaging custodian and filling lead. Verify actual BOM and weigh each component; use count times measured component mass when required, before normalization. Keep bottle, closure, liner, label and carton distinct. Actual extra components require individual rows, and absent listed components need documented non-applicability. Retain unnormalized period records and the compatible attributable raw numerator without division, with cohort and WIP burden transfers documented. After verified raw-unit conversion and attribution, normalize_period alone divides by the unique positive accepted wet SC mass Q. Card amount formulas and aggregation_rule describe this same final reporting operation, not a second division. No duplicated returned or reworked output; Q=0 retains the complete pool without a normalized result."
      unit: "kg; item; kg/item"
      frequency: "Each batch/stage and full period closure"
      temporal_coverage: "Complete actual matched period, including failed and zero-output runs and associated start-up/idle/cleaning"
      site_scope: "One declared site, actual supply country, SKU and aqueous milling route; no cross-formulation average"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ticket; signed reconciliation; raw unsuccessful runs; uncertainty and gaps"
    - protocol_id: cp_waste
      process_id: "sc_formulation"
      flow_role: "each external wastewater or solid waste"
      record_type: "transfer_and_assay"
      raw_fields: "site; SKU; route; period start/end; stage; owner; batch; instrument; unit; raw value; opening/closing WIP; return/rework IDs; burden cohort; waste ID; wet/dry mass; active/water/glycol assay; receiver; treatment route; internal recovery; abandoned-run burdens"
      collection_method: "Owner: environmental waste custodian. Weigh outgoing streams and assay relevant constituents; trace each to one receiver and actual treatment boundary. External wastewater is a waste exchange; do not also invent an elementary discharge of its entire content at this gate. If onsite treatment occurs, add its actual separate inputs and species outlets with independent evidence. Retain unnormalized period records and the compatible attributable raw numerator without division, with cohort and WIP burden transfers documented. After verified raw-unit conversion and attribution, normalize_period alone divides by the unique positive accepted wet SC mass Q. Card amount formulas and aggregation_rule describe this same final reporting operation, not a second division. No duplicated returned or reworked output; Q=0 retains the complete pool without a normalized result."
      unit: "kg; fraction"
      frequency: "Each batch/stage and full period closure"
      temporal_coverage: "Complete actual matched period, including failed and zero-output runs and associated start-up/idle/cleaning"
      site_scope: "One declared site, actual supply country, SKU and aqueous milling route; no cross-formulation average"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ticket; signed reconciliation; raw unsuccessful runs; uncertainty and gaps"
    - protocol_id: cp_air
      process_id: "sc_formulation"
      flow_role: "each actual direct species release"
      record_type: "post_control_measurement"
      raw_fields: "site; SKU; route; period start/end; stage; owner; batch; instrument; unit; raw value; opening/closing WIP; return/rework IDs; burden cohort; species; medium/subcompartment; post-control sampling point; integrated volume or measured rate/time; concentration; detection limit; vapour loss measurement; temperature/pressure"
      collection_method: "Owner: environmental monitoring lead. Quantify actual releases at the declared final boundary by matched sampling/metering. A concentration times integrated gas volume is already a period mass; rate times duration is integrated only once. Report below-detection and unmeasured quantities explicitly. Add an atomic row for each other actual solvent/species, never infer speciation from COD or a balance residual. Retain unnormalized period records and the compatible attributable raw numerator without division, with cohort and WIP burden transfers documented. After verified raw-unit conversion and attribution, normalize_period alone divides by the unique positive accepted wet SC mass Q. Card amount formulas and aggregation_rule describe this same final reporting operation, not a second division. No duplicated returned or reworked output; Q=0 retains the complete pool without a normalized result."
      unit: "kg; concentration; gas volume"
      frequency: "Each batch/stage and full period closure"
      temporal_coverage: "Complete actual matched period, including failed and zero-output runs and associated start-up/idle/cleaning"
      site_scope: "One declared site, actual supply country, SKU and aqueous milling route; no cross-formulation average"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ticket; signed reconciliation; raw unsuccessful runs; uncertainty and gaps"
    - protocol_id: cp_balance
      process_id: "sc_formulation"
      flow_role: "complete raw period and WIP burdens"
      record_type: "cohort_mass_and_burden_ledger"
      raw_fields: "site; SKU; route; period start/end; stage; owner; batch; instrument; unit; raw value; opening/closing WIP; return/rework IDs; burden cohort; opening/closing physical WIP; opening/closing burden vector by exchange; failed/zero-output runs; rework/return lineage; accepted lot IDs; raw input/output mass; constituent composition; transfers and allocation"
      collection_method: "Owner: production accountant, stage owners and environmental lead jointly. Close a physical mass/element ledger separately from a burden ledger. Carry opening WIP mass and all embodied burdens into the matching accepted cohort; retain closing WIP and burdens for the next period. Account for zero-output runs, abandoned batches and external returned products without dropping their burdens or accepting their mass twice. Sign each transfer so current charges plus opening burdens equal accepted-cohort burden plus closing/transferred burdens. Retain unnormalized period records and the compatible attributable raw numerator without division, with cohort and WIP burden transfers documented. After verified raw-unit conversion and attribution, normalize_period alone divides by the unique positive accepted wet SC mass Q. Card amount formulas and aggregation_rule describe this same final reporting operation, not a second division. No duplicated returned or reworked output; Q=0 retains the complete pool without a normalized result."
      unit: "kg; original burden units"
      frequency: "Each batch/stage and full period closure"
      temporal_coverage: "Complete actual matched period, including failed and zero-output runs and associated start-up/idle/cleaning"
      site_scope: "One declared site, actual supply country, SKU and aqueous milling route; no cross-formulation average"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ticket; signed reconciliation; raw unsuccessful runs; uncertainty and gaps"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Convert raw quantities to their declared numerator units, retain complete actual period burdens including failures and opening WIP, remove only documented burdens carried into closing WIP or transferred to another cohort, and divide the matched accepted-cohort burden by unique positive Q once. Finished SC is 1 kg. Zero Q permits no ratio; retain and carry or explicitly dispose the complete burdens."
      inputs:
        - raw_period_quantity
        - opening_burden
        - closing_burden
        - transfer_ledger
        - Q
        - cp_acceptance
        - cp_balance
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: composition_subledgers
      applies_to: "technical_imidacloprid; jm_dispersant; sdbs; xanthan_hydrogel; silicone_antifoam; finished_sc"
      rule: "Constituent mass = whole supplied mass × independently measured mass fraction. For assay C in g/L and density rho in kg/L at matching temperature, g/kg = C / rho. Constituent totals reconcile to whole mass but do not add procurement rows."
      inputs:
        - whole_supplied_mass
        - measured_fraction
        - C
        - rho
        - cp_materials
        - cp_acceptance
      output: "active/water/solvent/carrier subledgers"
      source_ids:
        - sinochem-imidacloprid-sc-2015
    - id: physical_balance
      applies_to: "sc_formulation"
      rule: "Reconcile complete physical input + opening WIP = accepted output + measured external waste + independently measured direct releases + closing WIP + documented transfers, with packaging accounted separately. Close relevant elements using actual compositions independently. Mechanical mixing/milling creates no reaction water; phase change and entrained/free water are recorded separately. COD or a closure residual proves neither species nor reaction water. Investigate and disclose residuals without fitting two unknown outlets to one residual."
      inputs:
        - raw_input_mass
        - opening_WIP
        - accepted_mass
        - waste_mass
        - measured_species
        - closing_WIP
        - composition
        - cp_balance
      output: "separate physical and species reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference and ingredients"
      requirement: "Require actual composition, technical grade, aqueous SC state, nominal and measured concentration, supplier conditions, release criteria, site and country. Broad pesticide identity cannot supply an unstated geography or recipe; disclose native classification debt."
      evidence: "Supplier certificates; actual product specification; signed release; native limitation disclosure"
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "Complete matched raw numerator and unique fresh accepted output are mandatory, including unsuccessful operation, returns/rework, opening/closing WIP and carried burdens. Retain unnormalized originals and uncertainty; no silent exclusion of zero-output runs."
      evidence: "cp_acceptance; cp_balance"
    - id: quality_sources
      applies_to: "method and performance"
      requirement: "Patent ingredient identities and unit operations are one case, not an industry average or guaranteed SKU. No formula amounts, efficacy, application rate, emission factor, field release fraction or density are defaults. Verify site/SKU measurements before creating quantitative datasets. FAO scope requires assessed manufacturer/equivalence; this PCR claims no certification."
      evidence: "sinochem-imidacloprid-sc-2015; fao-imidacloprid-2013"
    - id: quality_completeness
      applies_to: "optional rows and emissions"
      requirement: "Demonstrate non-applicability of each absent physical exchange. Every additional real material, fuel, refrigerant, cleaning chemical, package, waste and emitted species needs a separate atomic row with records and provider/medium. Unknown is disclosed, never encoded as measured zero."
      evidence: "cp_materials; cp_power; cp_water; cp_packaging; cp_waste; cp_air"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Reject aggregate insecticide output, a pure-active kilogram as a wet-SC kilogram, another physical formulation or nominal concentration, undocumented JM supply composition, missing qualifiers, or unreviewed HS-note substance applicability. Generic UUID availability does not waive actual recipe and provider evidence."
    source_ids:
      - unstats-cpc3-2025
      - wco-hs38-2022
      - sinochem-imidacloprid-sc-2015
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Require Q > 0, unique fresh acceptance IDs, correct net wet mass, matched route/SKU/period, full raw burdens and documented WIP/return/rework transfers. Reject omitted failed/zero-output runs, double normalization, repeated acceptance, extra time factors on integrated volume and density inferred from patent labels."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "material and emission reconciliation"
    rule: "Require separate whole-mass/element and actual-species evidence, including all supplied carrier water/solvents and independently quantified water loss. Reject duplicate constituent purchases, COD-derived species, residual-fitted emissions, unsupported reaction water and onsite synthesis added to the formulation route."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "data package"
    rule: "Report performed checks, skipped scopes, limits, providers and unmeasured exchanges. Incomplete actual emission/allocation/composition evidence remains inconclusive; methodological rules and a valid projection alone do not validate a future dataset or approve methodology."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site/SKU-specific foreground formulation dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacture of the same qualified aqueous SC; background supply to separately modelled pesticide use"
  excluded_use: "Generic all-insecticide mix; active synthesis inventory; efficacy comparison; kg-active substitution without assay; field emissions or regulatory approval"
  required_metadata: "Actual formulation and complete supplied-input states; nominal/measured concentration and density; site/country/provider; SKU/period/cohort; packaging and net mass; WIP and burden transfer ledger; treatment and allocation boundaries; protocol owners; native identity limits/classification debt"
  required_quality_disclosure: "Raw-period completeness; failed runs; uncertainty; unmeasured species; missing auxiliary UUID/provider matches; patent/FAO applicability limits and actual release evidence"
  update_trigger: "Change in active/grade, formulation type/concentration, JM/other supplied additive, solvent/carrier, milling route, hydrogel make/buy state, packaging, site/provider, release specification or waste treatment"
data_sources:
  - id: "unstats-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed p.167, entries 34661/34666/34669. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Official titles and separation of classification leaves only; those explanatory entries have no additional text. A classification leaf neither creates a PCR identity nor establishes the full scope of this narrow formulation."
  - id: "wco-hs38-2022"
    type: "official_guidance"
    reference: "WCO, HS Nomenclature 2022, Chapter 38, Subheading Notes 1–2 and heading 38.08. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0638_2022e.pdf"
    used_for: "Check listed substances versus other insecticidal preparations: imidacloprid is absent from both lists. Does not approve a CPC edge; actual complete composition and product purpose still require classification assessment."
  - id: "sinochem-imidacloprid-sc-2015"
    type: "literature"
    reference: "中化化工科学技术研究总院、北京广源益农化学有限责任公司, 一种吡虫啉悬浮剂及其制备方法, CN105028457A, 2015-11-11, description [0006], [0011] Example 2, PDF pp.4–5; pp.3,6–7 limitations/context. https://patents.google.com/patent/CN105028457A/zh"
    used_for: "Primary patent facsimile supports technical powder, JM solution, sodium dodecylbenzenesulfonate, preformed 4% xanthan hydrogel, magnesium aluminium silicate, silicone antifoam, ethylene glycol, water and shear/sand-mill/post-mill sequence. Laboratory recipe is not a default quantity, density, field efficacy or factory intensity. JM synthesis solvent is unspecified; require actual supplied composition and upstream data. Upstream polymerisation is not the selected foreground."
  - id: "fao-imidacloprid-2013"
    type: "standard"
    reference: "FAO, Specifications and Evaluations for Agricultural Pesticides: Imidacloprid, May 2013, 582/SC, printed pp.11–13; introduction p.1 and evaluations 582/2004, 582/2012. https://www.fao.org/fileadmin/templates/agphome/documents/Pests_Pesticides/Specs/Imidacloprid_2013_01.pdf"
    used_for: "Independent physical description of aqueous technical-particle suspension and concentration/density distinction. Applies to evaluated manufacturers/technical materials and equivalence scope, not nominally similar unassessed suppliers/routes; no endorsement, warranty of efficacy or automatic compliance. Its 2013 SC tolerance table stops at 500 g/kg or g/L; no tolerance is extrapolated to 600 g/L. No formulation recipe or use/emission factor adopted."
  - id: "changqing-imidacloprid-sc-2014"
    type: "literature"
    reference: "江苏长青农化股份有限公司, 吡虫啉悬浮剂的制备方法, CN104126600A, 2014-11-05, claims 1–2 and description [0005]–[0019], PDF pp.2–4. https://patents.google.com/patent/CN104126600A/zh"
    used_for: "Independent counterexample: nominal 350 g/L water-phase sulfonated-calix[5]arene route. Not the selected 600 g/L JM formulation; its ratios and suspensibility cannot transfer to the selected route or establish generic insecticide performance."
