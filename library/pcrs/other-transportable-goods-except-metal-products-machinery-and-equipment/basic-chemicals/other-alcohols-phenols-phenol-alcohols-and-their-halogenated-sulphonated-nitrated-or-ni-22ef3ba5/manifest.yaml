    - "Two independent primary/biological sludge rows conditionally use 725c8f6e-7975-4155-a250-1f95ef70c508, Waste flow, generic semi-solid sludge mass identity. Its water-treatment use label is not a phenol-specific grade/provider; actual wet mass, solids, composition, phase, receiver and treatment remain separate obligations."
