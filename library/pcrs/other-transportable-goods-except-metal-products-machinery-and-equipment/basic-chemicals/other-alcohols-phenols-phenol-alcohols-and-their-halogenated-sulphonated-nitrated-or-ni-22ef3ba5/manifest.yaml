    - "Activated-carbon native treatment says absorption while its comment describes adsorption. Conditional chemical identity is retained; actual adsorbent grade/use and background provider require evidence. Neither wording is silently rewritten or adopted as process chemistry."
    - "The selected generic phenol record has no hard route/concentration field. More specific phenol uses/grades must not override the PCR cumene route or measured supply basis. Acid identity retains its 93-98% industrial chemical-synthesis constraint; a refinery provider is not a chemical-synthesis default."
    - "The sulfuric-acid record comment describes oxidation of sulfur trioxide imprecisely. CAS 7664-93-9, H2SO4 identity and supplied 93–98% grade are used conditionally; the comment is not adopted as a manufacturing chemistry rule."
    - "The electricity record declares CN supply. Its UUID is restricted to actual Chinese 1–35 kV user supply; other geographies require another verified flow."
