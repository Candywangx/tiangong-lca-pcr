  mapping_review: "Proposed narrower CPC 3.0:34139 only for separated industrial phenol from the stated cumene route; all other subcategories remain uncovered."
  background_compatibility: "Every actual SKU, concentration, provider and reference-quantity definition must be matched. Physical steam kg and return condensate are distinct from net-enthalpy MJ. Actual supplier quantity/pressure and gas m3 compatibility remain dataset-production obligations, not quantity defaults."
