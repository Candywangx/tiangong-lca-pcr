measurement_rules:
  - id: m_mass
    applies_to: "reference_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use 1 kg accepted net undiluted phenol product as supplied, including measured residual water/impurities. Disclose phenol mass fraction and active phenol mass separately; never silently switch the denominator."
  - id: m_solution
    applies_to: "in_acid, in_caustic"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use actual supply solution mass, assay and carrier water. Active chemical mass = solution mass × measured mass fraction; water already in the supply is not additional process-water input. Match background solution concentration and reference quantity."
  - id: m_electricity
    applies_to: "in_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve the record reference property label; convert actual meter kWh to MJ using 1 kWh = 3.6 MJ. This energy identity does not supply grid mix or loss factors."
  - id: m_steam
    applies_to: "in_steam"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect supplied steam mass and returned condensate mass separately. Derive energy using actual absolute pressure, temperature, dryness and enthalpy from iapws-if97-2012 within its validity range. Preserve supplier net/gross heat and return conventions; an MJ label or pressure-independent latent heat is insufficient."
  - id: m_gas
    applies_to: "in_gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Convert meter volume only with recorded temperature, absolute pressure, wet/dry composition and compressibility consistent with supplier m3 reference. Retain measured heating-value basis separately; never infer density from database secondary mass coefficients."
  - id: m_commercial
    applies_to: "chemical_and_material_rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For every actual catalyst, inhibitor, cleaning agent, maintenance consumable and packing material, record its specific commercial identity, grade, delivered mass and composition; active ingredient, solution carrier and disposable/returnable ownership remain distinct. Do not substitute refinery or unrelated recipe datasets for chemical-synthesis providers."
  - id: m_emissions
    applies_to: "elementary_rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Integrate species concentration with compatible gas/liquid flow and actual operating time; report wet/dry/standard-state corrections, detection limits, sampling recovery and uncertainty. Keep total indicators distinct from physical species mass."
