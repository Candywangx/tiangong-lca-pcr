system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "phenol_train"
      rule: "Include receiving fresh cumene, compressed-air dry oxidation, CHP concentration, sulfuric-acid cleavage, NaOH neutralisation, fractionation/phenol purification, phenol recovery from aqueous streams, measured internal recycling, heated bulk storage and loading. Record the actual flow diagram and each stage meter."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: b_utilities
      applies_to: "utilities"
      rule: "Include attributable electricity, steam/heat supply, air compression, cooling/makeup, vacuum, condensate return and environmental controls. Imported utilities need upstream providers; on-site fuel and emissions are foreground. Do not count internally produced steam as an additional purchased heat input."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: b_treatment
      applies_to: "recovery_treatment"
      rule: "Track oxidation peroxide pretreatment separately from fractionation phenol/solvent recovery, neutralisation salts, final treatment and sludge handling. Include abnormal operations, starts/stops, maintenance, vacuum losses, regeneration, storage and fugitives within the period."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: b_interface
      applies_to: "physical_ledger"
      rule: "Retain unallocated total physical mass, water-species, actual elemental and energy ledgers before allocation. Every internal transfer has equal mass/composition at both endpoints; recovery does not remove treatment energy or residual losses. Declare changes in inventories and off-spec rework; prevent supplier/site or waste-provider duplication."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: b_extensions
      applies_to: "additional_exchanges"
      rule: "Inventory cards are a minimum conditional checklist, not a fixed recipe or exhaustive site census. Before a usable dataset, add a separate atomic row for every actual additional reagent, resin, inhibitor, refrigerant loss, filter, ash, fuel, packaging, pollutant or transport service. Bulk tanker containers are returnable equipment, not assumed disposable packaging. No silent zero or cut-off is allowed for an unidentified material exchange. Added rows do not extend the stated route to excluded production methods."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: b_carriers
      applies_to: "physical_ledger"
      rule: "Measure wet ambient-air intake, humidity, N2/Ar, oxygen and complete vent-gas carrier separately from pollutant species. Gross air and the net consumed-O2 exchange are alternative accounting views, not additive inputs. Total vent mass includes species; never add pollutant rows twice. Track oxygen consumed and chemically bound, residual O2, water and other actual species in oxidation, combustion and treatment."
      source_ids:
        - jrc-lvoc-2017
    - rule_id: b_assets
      applies_to: "physical_and_burden_ledgers"
      rule: "Record actual packing, maintenance consumables, asset/container ownership, opening/closing stocks, returnable-container returns and decommissioning destinations. Add each actual material/service as an atomic exchange. Reconcile actual acquisitions, returns, replacement waste and disposals physically, separately from lifetime-amortised infrastructure/container burdens. State lifetime, throughput, ownership and service boundary; burden fractions never replace physical items or mass."
      source_ids:
        - ilcd-detailed-2010
        - jrc-lvoc-2017
