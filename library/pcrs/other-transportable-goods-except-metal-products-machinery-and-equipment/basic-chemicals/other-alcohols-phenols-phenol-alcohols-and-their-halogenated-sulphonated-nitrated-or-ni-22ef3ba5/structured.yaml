allocation_rules:
  - rule_id: a_products
    applies_to: "multifunctionality"
    rule: "Keep phenol, acetone and actually isolated saleable AMS/acetophenone/exported cumene in the full physical output ledger, with actual mass, purity and recipient. Heavy ends, wastewater and spent carbon remain wastes unless documented positive product function and acceptance justify a different role."
    source_ids:
      - jrc-lvoc-2017
      - ilcd-detailed-2010
  - rule_id: a_hierarchy
    applies_to: "environmental_burdens"
    rule: "For a declared attributional dataset, first subdivide independently measured purification, storage and treatment services; allocate only the remaining inseparable burdens. Demonstrate a determining physical causal relationship where available; reaction stoichiometry or product masses alone do not establish that relationship. If unavailable, disclose justified economic allocation using actual grade-specific net quantities and consistent representative prices/time/geography, with sensitivity analysis. No universal fraction is supplied."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_accounting
    applies_to: "physical_and_allocated_ledgers"
    rule: "Preserve the unallocated process diagram and mass/water/carbon balances separately from the allocated burden account. Apply fractions to attributable environmental burdens only; never multiply physical co-product outputs or internal transfers by phenol allocation fractions. Shares must sum to one over the declared co-functions."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: a_recovery
    applies_to: "recovery_and_waste"
    rule: "Internal cumene/phenol/acetone return is an internal loop, never avoided-product credit. Do not combine system-expansion credits with an allocated attributional burden. Document external waste treatment and any externally exported recovery consistently with the selected model; actual energy recovery cannot also retain the same tar as an external waste output."
    source_ids:
      - ilcd-detailed-2010
      - jrc-lvoc-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "phenol_train"
      flow_role: "accepted and coproduct output"
      record_type: "acceptance and batch records"
      raw_fields: "lot; SKU; CAS; route; net mass; tare; phenol/water/impurity assay; phase; grade; receiver; opening/closing stocks"
      collection_method: "Calibrated load-cell/scale or traceable tank mass with measured density/temperature; reconcile acceptance certificates and separate grades"
      unit: "kg"
      frequency: "each lot; reconcile period"
      temporal_coverage: "Representative production period including actual abnormal modes"
      site_scope: "Same phenol train and attributable utilities/treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original records, calibration, acceptance/recovery/blanks/detection limits and uncertainty evidence"
    - protocol_id: cp_material
      process_id: "phenol_train"
      flow_role: "fresh chemical and adsorbent input"
      record_type: "receipts and consumption ledger"
      raw_fields: "material identity; supply grade; concentration; carrier water; origin; net receipts; stock change; supplier; internal returns"
      collection_method: "Weigh receipts and reconcile purchases, stores, actual consumption and supplier assay; meter separate fresh/recycled streams"
      unit: "kg"
      frequency: "each delivery and campaign"
      temporal_coverage: "Representative production period including actual abnormal modes"
      site_scope: "Same phenol train and attributable utilities/treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original records, calibration, acceptance/recovery/blanks/detection limits and uncertainty evidence"
    - protocol_id: cp_energy
      process_id: "phenol_train"
      flow_role: "electricity steam fuel"
      record_type: "meter and utility balance"
      raw_fields: "meter; interval; kWh; steam mass; pressure; temperature; dryness; enthalpy; condensate; fuel m3; T; absolute P; moisture; composition; Z; heating value; provider basis"
      collection_method: "Read calibrated stage meters; reconcile compressed air, vacuum, cooling, distillation, heated storage, boiler and abatement loads; close supplier/site boundary"
      unit: "kg; MJ; m3"
      frequency: "continuous readings and period reconciliation"
      temporal_coverage: "Representative production period including actual abnormal modes"
      site_scope: "Same phenol train and attributable utilities/treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original records, calibration, acceptance/recovery/blanks/detection limits and uncertainty evidence"
    - protocol_id: cp_air
      process_id: "phenol_train"
      flow_role: "final species releases"
      record_type: "monitoring and fugitive survey"
      raw_fields: "source; compound; CAS; concentration; wet/dry basis; flow; T; P; operating hours; recovery; blanks; detection limits; carbon origin; PM size; NO/NO2 definition; events"
      collection_method: "Use compound/matrix-validated stack sampling and GC where Method 18 applies, with low-volatility/condensation limitations checked; validated alternative for peroxides; LDAR/storage/loading survey and actual operating logs; validated source-specific combustion tests"
      unit: "kg"
      frequency: "representative operating modes plus abnormal events"
      temporal_coverage: "Representative production period including actual abnormal modes"
      site_scope: "Same phenol train and attributable utilities/treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original records, calibration, acceptance/recovery/blanks/detection limits and uncertainty evidence"
    - protocol_id: cp_water
      process_id: "phenol_train"
      flow_role: "water supply effluent and solutes"
      record_type: "water balance and laboratory analysis"
      raw_fields: "source; recipient; flow; density; separate phase; concentration by species; phenol; CHP; MHP; sulfate; sodium; COD; recovery; preservation; blank; detection limit; treatment path"
      collection_method: "Calibrated flow and flow-proportional representative samples; validate Method 604 or equivalent for phenol in actual matrix, with independent confirmation for unfamiliar samples; validate other species separately; record before/after treatment and off-site transfers"
      unit: "kg; m3; mg/L"
      frequency: "matched flow/sample intervals; cover regeneration and abnormal loads"
      temporal_coverage: "Representative production period including actual abnormal modes"
      site_scope: "Same phenol train and attributable utilities/treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original records, calibration, acceptance/recovery/blanks/detection limits and uncertainty evidence"
    - protocol_id: cp_waste
      process_id: "phenol_train"
      flow_role: "external residual export"
      record_type: "waste manifests"
      raw_fields: "stream; wet mass; moisture; dry solids; composition; carbon source; hazardous class; receiver; treatment; reuse; weigh ticket"
      collection_method: "Calibrated weighing and representative moisture/composition samples; receiver acceptance and treatment records; separate sludge types and spent carbon"
      unit: "kg"
      frequency: "each shipment and period"
      temporal_coverage: "Representative production period including actual abnormal modes"
      site_scope: "Same phenol train and attributable utilities/treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original records, calibration, acceptance/recovery/blanks/detection limits and uncertainty evidence"
    - protocol_id: cp_balance
      process_id: "phenol_train"
      flow_role: "physical balances and allocation evidence"
      record_type: "stage and burden accounts"
      raw_fields: "stage; total physical mass; composition; water formation/consumption; C/H/O/N/S/Na; wet air; vent carrier; O2 consumption; energy/enthalpy; stocks; internal transfers; heads/tars; independent phenol and acetone quantities; asset/container ownership/returns; price; period; uncertainty"
      collection_method: "Reconcile each actual stage and equal-endpoint transfers; measure oxygen net consumption from air/vent composition; preserve unallocated balances and a separate justified allocation worksheet"
      unit: "kg; MJ; price/kg"
      frequency: "each campaign and representative period"
      temporal_coverage: "Representative production period including actual abnormal modes"
      site_scope: "Same phenol train and attributable utilities/treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original records, calibration, acceptance/recovery/blanks/detection limits and uncertainty evidence"
  calculation_rules:
    - id: c_normalise
      applies_to: "all inventory rows"
      rule: "Each attributable measured period exchange quantity / accepted net phenol kg for that same period; result per 1 kg reference flow. Reference-product output is exactly 1 kg; retain full physical coproduct ratios, with allocated burdens in a separate account."
      inputs:
        - cp_product
        - "linked row protocol"
      output: "per 1 kg reference flow"
      source_ids:
        - jrc-lvoc-2017
        - ilcd-detailed-2010
    - id: c_composition
      applies_to: "reference_product, in_acid, in_caustic"
      rule: "Component mass = actual supply mass × measured mass fraction; components and carrier water/impurities close to the same net supply mass; active phenol never replaces the reference denominator."
      inputs:
        - cp_product
        - cp_material
      output: "component masses"
      source_ids:
        - ineos-phenol-product
    - id: c_electricity
      applies_to: "in_electricity"
      rule: "Actual meter kWh × 3.6 gives MJ; divide by accepted phenol kg for the same period; preserve the original Net calorific value property."
      inputs:
        - cp_energy
        - cp_product
      output: "MJ per 1 kg reference flow"
      source_ids:
        - jrc-lvoc-2017
    - id: c_species
      applies_to: "elementary_rows"
      rule: "Integrate actual species concentration × compatible flow × matched time to kg, then divide by accepted net phenol kg; liquid mg/L × L × 10^-6 gives kg. For gas, reconcile moisture, temperature/pressure, oxygen corrections and instrument species/equivalent basis first."
      inputs:
        - cp_air
        - cp_water
        - cp_product
      output: "kg species per 1 kg reference flow"
      source_ids:
        - epa-method18-2025
        - epa-method604-1984
    - id: c_balances
      applies_to: "physical_ledger"
      rule: "For each stage, total physical mass inputs + opening stocks = total physical mass outputs + closing stocks. Close C/H/O/N/S/Na and other actual elements using composition. Water-species inputs + opening stocks + internal chemical formation = water-species outputs + closing stocks + chemical consumption. Reaction-generated H2O is internal species conversion, never a total-mass source/sink. Cumene C9H12 + O2 → CHP C9H12O2 → phenol C6H6O + acetone C3H6O is the main reaction identity, not a recovered-product yield ratio; DMBA dehydration can form AMS and H2O. Internal transfers agree at both endpoints. Retain measured residuals and uncertainty without fictional balancing flows."
      inputs:
        - cp_balance
        - "all collection protocols"
      output: "unallocated stage balances"
      source_ids:
        - jrc-lvoc-2017
    - id: c_energy_balance
      applies_to: "physical_ledger"
      rule: "Reconcile electricity/work, actual fuel composition/heating-value basis, steam/condensate enthalpy, reaction energy, cooling/rejected and exported heat, and stock changes independently of mass. Use one consistent enthalpy convention; never add reaction heat twice to chemical enthalpy. For an equal-mass closed steam/condensate circuit, useful heat is mass × (supply enthalpy − exit-condensate enthalpy), with enthalpy in kJ/kg; divide kJ by 1000 for MJ. If masses/endpoints differ, retain all streams and a complete consistent enthalpy balance instead of that shortcut. Provider net heat follows its own qualified supply/return boundary."
      inputs:
        - cp_energy
        - cp_balance
      output: "unallocated energy ledger"
      source_ids:
        - iapws-if97-2012
        - jrc-lvoc-2017
  data_quality_requirements:
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "For each row disclose measured, condition not applicable or unresolved; non-detects retain detection limits rather than implying no release. Cover normal/abnormal modes and storage/loading in the same period."
      evidence: "cp_air; cp_water; site logs"
    - id: dq_bases
      applies_to: "all inventory rows"
      requirement: "No single-plant literature recipe, yield, purity, purification or energy default is transferred; actual records confirm each SKU, concentration and provider basis."
      evidence: "cp_product; cp_material; cp_energy"
    - id: dq_complete
      applies_to: "foreground_dataset"
      requirement: "Identify all additional atomic exchanges and close provider/treatment boundaries before a usable dataset; retain physical and allocated accounts and uncertainty."
      evidence: "cp_balance; source and receiver evidence"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference_product"
    rule: "Require cumene-route evidence, CAS 108-95-2, actual SKU, net mass, measured phenol/water/impurity fractions, acceptance specification and molten/solid gate state. Reject crude mixtures, deliberately aqueous solutions and excluded routes as this reference product."
    source_ids:
      - jrc-lvoc-2017
      - ineos-phenol-product
  - rule_id: v_quantity
    applies_to: "all_inventory_rows"
    rule: "Require one quantitative-reference phenol output while retaining every actual co-product, including independently measured acetone, and the same per-1-kg net accepted supply basis in every inventory card, collection aggregation and calculation in both languages. Reject active-phenol/solution-mass substitution, gross-tare mass and unmatched sampling periods."
    source_ids:
      - ineos-phenol-product
  - rule_id: v_balance
    applies_to: "physical_ledger"
    rule: "Check total physical mass, water-species, all actual elements and energy balances before allocation with actual compositions, wet-air/vent carriers, bound oxygen, heads/tars, stocks, equal-endpoint recovery and off-spec losses; reaction water is never a total-mass balancing plug and carrier/species mass must not be duplicated; document site uncertainty and reconciliation tolerance without a PCR default. Distinguish product, by-product, waste transfer and final emissions."
    source_ids:
      - jrc-lvoc-2017
  - rule_id: v_emission
    applies_to: "elementary_rows"
    rule: "Validate actual species, CAS where available, medium, source, fossil/biogenic origin, property and unit. Use post-abatement final releases; keep treatment influent and externally treated load out of final foreground discharge. TVOC as C, COD, total phenols and total peroxides are QA metrics, not substitute molecular emissions."
    source_ids:
      - jrc-lvoc-2017
      - epa-method18-2025
      - epa-method604-1984
  - rule_id: v_size_nox
    applies_to: "air_rows"
    rule: "Use disjoint PM2.5, >2.5–10 and >10 micrometre fractions; do not add cumulative PM10 or collected dust. Separate actual NO and NO2 molecular masses; total NOx as NO2 equivalent requires documented composition/conversion and must not duplicate the species rows. N2O is separate. Retain any actual biogenic CO2 in LCI."
    source_ids:
      - jrc-lvoc-2017
  - rule_id: v_providers
    applies_to: "technosphere_links"
    rule: "A UUID establishes physical identity only. Verify actual provider, grade, concentration, geography, voltage, steam pressure/net heat and gas volume conventions separately. Missing UUID/provider or unidentified exchanges remain explicit unresolved boundaries; do not claim a complete usable background dataset until they are resolved."
    source_ids:
      - jrc-lvoc-2017
  - rule_id: v_evidence
    applies_to: "foreground_dataset"
    rule: "Require original site logs, calibrated meters/scales, analytical recovery, blanks, detection limits, representative coverage and abnormal-operation records. No historical single-plant reaction/distillation values, BREF plant ranges, manufacturer purity claims or database comments become quantity defaults. Report missing fields and uncertainty honestly."
    source_ids:
      - jrc-lvoc-2017
      - epa-method18-2025
      - epa-method604-1984
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Phenol feedstock LCI after actual collection, complete links and independent review; methodology state alone does not establish dataset completeness"
  allowed_use: "Reuse only for matching route, supply mass, water/purity, geography/period and allocation conditions"
  excluded_use: "Whole 34139, denatured ethanol, other alcohols/phenols, formulated aqueous solutions, excluded routes, default recipes/yields/energy or automatic background substitution when data are incomplete"
  required_metadata: "Actual SKU/CAS, route, supply/active basis, residual water/impurities, phase, site/period, coproduct/recovery and treatment boundaries, provider reference quantities, allocation and original collection evidence"
  required_quality_disclosure: "Missing/unresolved flows/providers, analytical/sampling coverage, uncertainty, abnormal modes, balance residuals, economic/physical allocation sensitivity and excluded subclasses"
  update_trigger: "Changes to feed/route, purification, supply water/grade, recovery/coproduct destinations, abatement, utilities, provider measurement or market-price period"
data_sources:
  - id: "jrc-lvoc-2017"
    type: "official_guidance"
    reference: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf"
    used_for: "European Commission JRC, 2017 LVOC BAT Reference Document, Chapter 8: 8.2.1–8.2.2.4 route; Figure 8.4; 8.3.1–8.3.3 emissions/water/recovery; 8.3.4–8.3.6 utilities, water and residues; printed pp. 396–411. Scope is this cumene route; plant examples/ranges are not quantity defaults."
  - id: "ineos-phenol-product"
    type: "literature"
    reference: "https://www.ineos.com/businesses/ineos-phenol/products/phenol/"
    used_for: "INEOS Phenol original product page, accessed 2026-10-13; undiluted and aqueous supply grades and product state. Producer-grade examples, not universal purity or density defaults."
  - id: "epa-method18-2025"
    type: "official_guidance"
    reference: "https://www.epa.gov/system/files/documents/2025-04/m-18-04012025_0.pdf"
    used_for: "US EPA Method 18, 04/01/2025, Sections 1–2 and 4: species-resolved industrial gaseous organics GC, moisture/condensation and applicability limitations. Not applicable to low-volatility/polymerising compounds without an appropriate validated alternative; no emission factor."
  - id: "epa-method604-1984"
    type: "official_guidance"
    reference: "https://www.epa.gov/sites/default/files/2015-08/documents/method_604_1984.pdf"
    used_for: "US EPA Method 604, promulgated 1984, Sections 1–3: industrial wastewater phenol GC analysis, unfamiliar-sample confirmation and matrix interference. Only phenol and listed phenols; not acetone/cumene/total peroxide analysis or a current-jurisdiction compliance claim."
  - id: "ilcd-detailed-2010"
    type: "official_guidance"
    reference: "https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "JRC ILCD Detailed Guidance, first edition 2010, Sections 7.9.3 and 14.4; attributional multifunctionality/physical causality and economic allocation, recovery roles. Apply to the declared goal; no phenol coproduct share is supplied."
  - id: "iapws-if97-2012"
    type: "official_guidance"
    reference: "https://iapws.org/technical-guidance/release/IF97-Rev.download"
    used_for: "IAPWS R7-97(2012), Sections 1–2, 5–9 and 12: actual-state water/steam enthalpy, applicability regions and uncertainty; no supplier heat convention, pressure or yield default."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:7b6378bd2653e9d56132435696c6fe5c0784c11276ba70d31721fca9e73cf4b5"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6055"
      family: "system_boundary"
      span:
        start:
          offset: 6055
          line: 64
          column: 1
        end:
          offset: 10164
          line: 87
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Accepted fresh fossil cumene at plant receipt, with recorded supply composition |\n| starting_condition_role | External chemical-feed input, not previously produced phenol |\n| product_classification_scope | Only the stated cumene-route undiluted separated phenol subset of CPC 3.0:34139 |\n| recursive_input_rule | Retain equal-endpoint internal cumene/phenol/acetone returns; purchased same-category inputs retain distinct upstream providers rather than recursively becoming zero burden |\n| upstream_dataset_requirement | Cumene, chemical and utility providers compatible with actual composition, purity, energy property/measurement and geography; external waste-treatment receivers |\n| disclosure | Actual route, stage measurements, all recovery/coproduct destinations, treatment inside/outside boundary, stocks, abnormal modes, missing identity/providers and uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | phenol_train | Include receiving fresh cumene, compressed-air dry oxidation, CHP concentration, sulfuric-acid cleavage, NaOH neutralisation, fractionation/phenol purification, phenol recovery from aqueous streams, measured internal recycling, heated bulk storage and loading. Record the actual flow diagram and each stage meter. | jrc-lvoc-2017 |\n| b_utilities | utilities | Include attributable electricity, steam/heat supply, air compression, cooling/makeup, vacuum, condensate return and environmental controls. Imported utilities need upstream providers; on-site fuel and emissions are foreground. Do not count internally produced steam as an additional purchased heat input. | jrc-lvoc-2017 |\n| b_treatment | recovery_treatment | Track oxidation peroxide pretreatment separately from fractionation phenol/solvent recovery, neutralisation salts, final treatment and sludge handling. Include abnormal operations, starts/stops, maintenance, vacuum losses, regeneration, storage and fugitives within the period. | jrc-lvoc-2017 |\n| b_interface | physical_ledger | Retain unallocated total physical mass, water-species, actual elemental and energy ledgers before allocation. Every internal transfer has equal mass/composition at both endpoints; recovery does not remove treatment energy or residual losses. Declare changes in inventories and off-spec rework; prevent supplier/site or waste-provider duplication. | jrc-lvoc-2017 |\n| b_extensions | additional_exchanges | Inventory cards are a minimum conditional checklist, not a fixed recipe or exhaustive site census. Before a usable dataset, add a separate atomic row for every actual additional reagent, resin, inhibitor, refrigerant loss, filter, ash, fuel, packaging, pollutant or transport service. Bulk tanker containers are returnable equipment, not assumed disposable packaging. No silent zero or cut-off is allowed for an unidentified material exchange. Added rows do not extend the stated route to excluded production methods. | jrc-lvoc-2017 |\n| b_carriers | physical_ledger | Measure wet ambient-air intake, humidity, N2/Ar, oxygen and complete vent-gas carrier separately from pollutant species. Gross air and the net consumed-O2 exchange are alternative accounting views, not additive inputs. Total vent mass includes species; never add pollutant rows twice. Track oxygen consumed and chemically bound, residual O2, water and other actual species in oxidation, combustion and treatment. | jrc-lvoc-2017 |\n| b_assets | physical_and_burden_ledgers | Record actual packing, maintenance consumables, asset/container ownership, opening/closing stocks, returnable-container returns and decommissioning destinations. Add each actual material/service as an atomic exchange. Reconcile actual acquisitions, returns, replacement waste and disposals physically, separately from lifetime-amortised infrastructure/container burdens. State lifetime, throughput, ownership and service boundary; burden fractions never replace physical items or mass. | ilcd-detailed-2010, jrc-lvoc-2017 |\n\n"
