  unresolved_identity_details:
    hydrogen_in: "Purchased reagent hydrogen: retain actual purity, impurities and supply route; recycled hydrogen is internal. No general UUID verified; the coal-methanol-to-ethylene record is not a generic supply identity."
    oxygen_in: "Only actual oxygen or oxygen-enrichment supply. Record purity and gas reference conditions; do not use an elementary resource as a purchased product."
    steam_in: "Meter delivered steam mass and condensate returns with pressure, gauge/absolute convention, temperature and phase/quality. Separately calculate net delivered heat using supplier-compatible enthalpy boundaries. No pressure-specific or MJ-only identity is assumed."
    quinone_in: "Only this measured carrier when actually used. Other alkylanthraquinones require their own rows; record gross circulation, replenishment, stock change and degradation independently."
    phosphate_in: "Only this actual polar solvent. Tributyl phosphate and bis(2-ethylhexyl) phosphoric acid are different substances and cannot replace it."
    catalyst_in: "Actual formulated catalyst, including its measured carrier and palladium loading; do not report catalyst mass as pure palladium. Separate fresh purchases, external regenerated returns and internal recovery."
    alumina_in: "Only actual solid reversion agent. Ordinary alumina with uncertain activation or contradictory CAS is not accepted. Other reversion agents need separate identities."
    caustic_in: "Only documented alkaline reversion, cleaning or treatment. Weigh complete supplied solution and assay NaOH; dry 95–98% caustic is not this solution."
    nitric_in: "Only documented nitric-acid use. Record actual solution concentration and purpose; neither the 40% candidate nor general commercial concentrations supply a default."
    resin_cation_in: "Only actual cation resin; declare polymer, functional group, ionic form and moisture. A therapeutic resin description does not verify industrial purification identity."
    resin_anion_in: "Only actual anion resin; retain polymer, ionic form and particle grade. A 50-micrometre chromatography record is not a generic industrial resin."
    filter_in: "Only this actual consumable cartridge design. Weigh the complete cartridge and verify bill of materials; stainless-steel-core designs need a distinct row. No replacement frequency is prescribed."
    wastewater_out: "Only wastewater exported to external treatment, including actual phase, water content and peroxide/organic load; do not label untreated wastewater as a direct freshwater emission."
    tar_out: "Only actual separated alkaline organic residue; determine water, solvent, degraded quinone and inorganic contents and receiver. It is neither kraft black liquor nor a recovered saleable solvent."
    alumina_out: "Actual spent agent with retained solvent and quinone, measured as complete wet material; retain receiver acceptance and metal/mineral composition. Cement use is not automatically a co-product credit."
    catalyst_out: "External catalyst regeneration/recovery transfer, including measured support and contamination; track metal recovery and returned catalyst separately, without an assumed recovery yield."
    resin_cation_out: "Actual exported spent cation resin; declare ionic form, moisture, peroxide and organic contamination and receiver. Do not assume general non-hazardous waste."
    resin_anion_out: "Actual exported spent anion resin; keep it separate from spent cation resin with its own composition, wet/dry basis and receiver acceptance."
    filter_out: "Only the used matching cartridge, with entrained catalyst/working solution and receiving treatment; filter residue alone is not the complete cartridge."
  reference_flow_metadata_issue: "Native b21960ac-f3c4-4f00-ba92-527ca1dd5d12 primary Mass=1.0, CAS and 30% aqueous name support the physical identity. CPC34140 is misplaced. Its general comment gives 150.2 C, while the manufacturer salt-free 30% table gives 106 C at 1013 mbar; this PCR adopts neither as operating conditions. Textile bleaching is a use example, not an exclusive grade or process. Actual CoA, whole-versus-active quantity convention and producer route remain required; provider metadata clarification is pending."
  provider_quantity_compatibility: "Actual lot CoA and measured whole-solution/active-provider interface are mandatory. The 30% native Mass=1.0 identity is retained, while generic peroxide and 50% textile-mill/CN records are not substituted. Match each actual source route, geography, phase/grade and quantity. Steam stays kg until valid state enthalpy and full utility/provider heat boundary are proved; GCV/NCV labels alone are insufficient."
  mapping_review: "Suggest narrower CPC3.0:34280 for the AO peroxide subset only; other compounds excluded. Serial controller owns mappings, aliases and derived artifacts."
  native_identity_qualifications:
    nitrogen_in: "Broad nitrogen product has Mass/kg, but no native CAS, phase, purity or producer route. Gaseous N2 supplier composition/state remains a dataset qualification; bottling-line-specific records are not general substitutes."
    oxygen_air: "Immediate emissions to outdoor unspecified air; official Chinese baseName is 氧. Quantify actual O2 with same-period gas/lab/Q evidence; preserve physical oxygen regardless of impact characterization."
    electricity_in: "Native locationOfSupply CN, 1–35 kV, grid-average consumption mix to user. Other geography/voltage/source needs a distinct compatible identity."
    water_in: "Native product route is ion exchange or reverse osmosis, pure substance. General distillation use text does not override that route."
  method_basis: "Whole accepted aqueous mass Q, stock/service-adjusted input attribution, distinct conserved-mass/element and forming/consuming species ledgers, goal-dependent allocation and ordinary-water state enthalpy have explicit bilingual collection methods and public method sources. Future site quantities and actual recipe/producer compatibility remain to be collected; no numerical defaults or scientific acceptance are inferred."
  native_metadata_issues:
    - "methane_air: primary fossil methane name, CAS74-82-8, Mass and immediate-air compartment agree, but the native synonym list contains unrelated carbon/chemical entries. Retain the primary identity with actual methane source/speciation evidence; do not derive identity or origin from polluted synonyms."
    - "carbon_in: native broad activated-carbon identity does not specify actual feedstock or grade; its absorption-reaction route text does not establish a manufacturing recipe. Actual adsorbent and provider qualification remain required."
