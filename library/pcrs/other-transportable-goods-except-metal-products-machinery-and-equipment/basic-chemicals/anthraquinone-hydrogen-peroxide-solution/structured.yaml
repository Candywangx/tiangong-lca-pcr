            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_effluent
              source_ids:
                - jrc-lvoc-hydrogen-peroxide-2017
                - evonik-hydrogen-peroxide-brochure
            ranges: []
allocation_rules:
  - rule_id: al_physical
    applies_to: "p_ao"
    rule: "Retain unallocated physical material, water, hydrogen/oxygen and solvent-component balances independently of allocated environmental burdens. Internal recycle is not a saleable co-product. Never multiply measured physical outputs by an allocation share."
    source_ids:
      - jrc-lvoc-hydrogen-peroxide-2017
  - rule_id: al_shared
    applies_to: "p_ao"
    rule: "Use measured stage/campaign consumption and subdivision to avoid allocation of shared utility and treatment burdens where possible. Any remaining allocation must follow the declared study goal and modelling framework, demonstrate determining physical causality where available, document other justified criteria when it is unavailable, measured shares summing to one and sensitivity. A generic mass, sales-price or stoichiometric share is not supplied by this PCR. Physical amounts remain unallocated."
    source_ids:
      - jrc-ilcd-general-guide-2010
  - rule_id: al_recovery
    applies_to: "p_ao"
    rule: "A saleable recovered solvent, catalyst metal or exported useful heat needs measured quality, receiver demand and a compatible treatment boundary. Resolve multifunctionality under the declared goal and modelling framework, with subdivision first where applicable; allocation and system expansion are not free interchangeable choices. Demonstrate actual substitution and uncertainty when system expansion is justified. Do not combine a recovered-material credit with a second avoided-treatment credit for the same operation. Waste destinations alone establish no credit."
    source_ids:
      - jrc-ilcd-general-guide-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "p_ao"
      flow_role: "peroxide_product"
      record_type: "batch dispatch and laboratory acceptance"
      raw_fields: "lot_id; gross/tare/net solution mass; w; additive/impurity fraction a; SKU; acceptance specification; opening/closing product stocks; timestamp"
      collection_method: "Calibrated mass meter/weighbridge and lot-specific validated peroxide assay; independently measure declared additives and impurities. Reconcile production, dispatch, rework and stock change."
      unit: "kg; mass fraction"
      frequency: "Each lot and reporting-period stock count"
      temporal_coverage: "Same declared period including relevant operating and replacement cycles"
      site_scope: "Same producer control volume; supplier/receiver boundaries stated"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; method QA; timestamps; balance residual and uncertainty; actual specification"
    - protocol_id: cp_materials
      process_id: "p_ao"
      flow_role: "material inputs"
      record_type: "receipts, stage issues and stock/component balance"
      raw_fields: "row_id; CAS/formula/grade; producer and route; whole supplied mass; assay/moisture; fresh/recovered origin; store and in-use opening/closing stocks; unused exports/returns; stage issues; degradation; replacement dates; actual service totals and reporting-period share; upstream convention"
      collection_method: "Weigh receipts and stage issues with calibrated instruments and actual supplier CoA. Reconcile store opening + receipts + unused returns = store closing + stage issues + unused exports, retaining documented other transfers. Keep in-use charges and physical loss/transformation balances separately. Attribute short-lived consumed inputs to the matched production period; for catalyst/adsorbent/filter charges serving several periods, document the actual usage/service relationship and allocate the charge across its evidenced service totals, with all period shares summing to one. An uncompleted service life remains an explicit estimate with evidence and sensitivity. Do not alter full physical receipts/stocks/emissions by these attribution shares, or confuse them with co-product burden allocation."
      unit: "kg; mass fraction"
      frequency: "Each receipt/issue and replacement; period stock count"
      temporal_coverage: "Matched production period; actual service coverage disclosed"
      site_scope: "Same producer control volume; supplier interfaces retained"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; actual CoA; stock and service logs; uncertainty; jrc-ilcd-general-guide-2010"
    - protocol_id: cp_gases
      process_id: "p_ao"
      flow_role: "gas inputs and air resources"
      record_type: "gas meters and composition measurements"
      raw_fields: "row_id; source; T; absolute P; humidity; composition; compressibility; supplier reference conditions; volume/mass; stage; period"
      collection_method: "Calibrated matched-basis gas metering with actual composition and supplier conditions; ambient-air intake O2/N2 resources use the same intake record, while purchased gas uses its own provider dataset."
      unit: "kg; m3; gas state"
      frequency: "Continuous totals plus representative composition samples"
      temporal_coverage: "Same declared period including relevant operating and replacement cycles"
      site_scope: "Same producer control volume; supplier/receiver boundaries stated"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; method QA; timestamps; balance residual and uncertainty; actual specification"
    - protocol_id: cp_energy
      process_id: "p_ao"
      flow_role: "electricity_in; steam_in"
      record_type: "submeters, steam state and supplier boundary"
      raw_fields: "stage; electricity kWh; steam kg; absolute/gauge P and atmospheric reference; T; phase/dryness; each condensate/vent/drain/export; stocks; enthalpy source/version/region; provider gross/net heat convention; losses; shaft work; kinetic/potential terms; timestamps"
      collection_method: "Use calibrated electricity, steam and all outlet meters with matched timestamps. Verify ordinary-water state enthalpy through IAPWS-IF97 or traceable supplier state-property measurement; wet steam needs actual dryness. Close the declared energy balance including non-return condensate, stocks, losses and work before linking provider heat. A generic MJ, GCV/NCV label or steam pressure alone is insufficient; keep any unclosed heat interface incomplete."
      unit: "kWh; MJ; kg; kJ/kg"
      frequency: "Continuous metering and each state change"
      temporal_coverage: "Same matched production period"
      site_scope: "Declared utility control volume and provider boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "iapws-if97-2012; original meters and provider evidence"
    - protocol_id: cp_water
      process_id: "p_ao"
      flow_role: "water exchanges"
      record_type: "water control volumes"
      raw_fields: "source/destination; volume/mass; temperature/density evidence; extraction/dilution/cooling/cleaning use; internal recirculation; evaporation; solution-retained water; stocks; period"
      collection_method: "Calibrated intake/return/use meters and traceable density for mass-volume conversion; calculate evaporation only from a closed measured water balance with uncertainty and distinguish blowdown from vapour."
      unit: "kg; m3"
      frequency: "Continuous totals and stock reconciliation"
      temporal_coverage: "Same declared period including relevant operating and replacement cycles"
      site_scope: "Same producer control volume; supplier/receiver boundaries stated"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; method QA; timestamps; balance residual and uncertainty; actual specification"
    - protocol_id: cp_waste
      process_id: "p_ao"
      flow_role: "waste outputs"
      record_type: "transfer and receiving acceptance"
      raw_fields: "row_id; wet mass; dry fraction; solvent/peroxide/metal composition; receiver; treatment/recovery route; shipment; paired regenerated return; timestamp"
      collection_method: "Weigh and characterize each separate external waste shipment; verify receiver acceptance, actual treatment and regeneration records. Do not combine resin types or catalyst and residue masses."
      unit: "kg; mass fraction"
      frequency: "Each transfer and regeneration cycle"
      temporal_coverage: "Same declared period including relevant operating and replacement cycles"
      site_scope: "Same producer control volume; supplier/receiver boundaries stated"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; method QA; timestamps; balance residual and uncertainty; actual specification"
    - protocol_id: cp_air
      process_id: "p_ao"
      flow_role: "air emissions"
      record_type: "channelled and fugitive species monitoring"
      raw_fields: "outlet/species; concentration; mass or carbon basis; gas flow and T/P/wet-dry basis; duration; adsorption cycle; start-up/shutdown; fugitive survey; origin; uncertainty"
      collection_method: "Representative species analysis and compatible gas-flow measurements integrated over full adsorption/regeneration and operating cycles; FID total carbon is a screening record until separately speciated. Retain measurements below detection with method/limits, not fabricated zeros."
      unit: "kg; species concentration; m3; time"
      frequency: "Continuous or representative sampled full cycles, plus event/fugitive records"
      temporal_coverage: "Same declared period including relevant operating and replacement cycles"
      site_scope: "Same producer control volume; supplier/receiver boundaries stated"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; method QA; timestamps; balance residual and uncertainty; actual specification"
    - protocol_id: cp_effluent
      process_id: "p_ao"
      flow_role: "freshwater species outputs"
      record_type: "final discharge and treatment performance"
      raw_fields: "outlet; receiving body; final flow; species concentrations; peroxide destruction; separate COD/TOC/TSS; organic phase recovery; treatment inputs/residues; sample dates"
      collection_method: "Flow-weighted final-discharge sampling with species-specific validated analysis and actual treatment measurements; untreated export data stays in the external waste transfer record."
      unit: "kg; species concentration; m3"
      frequency: "Flow-weighted sampling across the complete period and process events"
      temporal_coverage: "Same declared period including relevant operating and replacement cycles"
      site_scope: "Same producer control volume; supplier/receiver boundaries stated"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; method QA; timestamps; balance residual and uncertainty; actual specification"
    - protocol_id: cp_balance
      process_id: "p_ao"
      flow_role: "molecular species and conserved elements"
      record_type: "linked whole-phase and component accounts"
      raw_fields: "stage/link; whole wet phase mass; species/CAS/formula; assays; dissolved gases; stocks; formation/consumption; net formed/consumed water; recovered organic/aqueous/rag fractions; purge; actual receiver; carbon origin; timestamps"
      collection_method: "Match physical sending/receiving quantities, representative gas/liquid/solid assays and stock counts by stage and period. Retain measured or evidence-based reaction extents and uncertainties; unresolved speciation is an explicit residual, never an invented balancing exchange. Link oxygen laboratory results to the gas numerator and accepted whole-product Q of the same period."
      unit: "kg; species mol; elemental kg"
      frequency: "Matched period, sampling cycles and events"
      temporal_coverage: "Same production and stock period"
      site_scope: "Same physical producer boundary and actual receiving fates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Actual lab methods, formulas/CoA, stock/transfer records; jrc-lvoc-hydrogen-peroxide-2017; jrc-ilcd-general-guide-2010"
  calculation_rules:
    - id: calc_normalise
      applies_to: "all inventory rows"
      rule: "inventory amount = matched-period protocol numerator / Q; Q is the accepted complete solution mass in kg from cp_product. Inputs use protocol stock/service attribution where applicable, while external output/resource quantities retain the matched physical boundary. Reference product output = 1 kg. Use row numerator units unchanged and retain the unallocated physical ledger."
      inputs:
        - cp_product
        - "row collection protocol"
      output: "row unit per 1 kg reference flow"
      source_ids:
        - jrc-ilcd-general-guide-2010
        - evonik-hydrogen-peroxide-brochure
    - id: calc_composition
      applies_to: "peroxide_product"
      rule: "A = sum(m_lot × w_lot); W = sum(m_lot × (1 − w_lot − a_lot)); additives/impurities = sum(m_lot × a_lot). Check their sum against complete solution mass before allocation. Concentration-weighted active-normalised supplementary burdens use A, explicitly separated from the mandatory Q-based inventory."
      inputs:
        - cp_product
      output: "separate active/water/additive physical accounts"
      source_ids:
        - evonik-hydrogen-peroxide-brochure
    - id: calc_component_balance
      applies_to: "quinone_in; xylene_in; phosphate_in; catalyst_in"
      rule: "opening component stock + external receipts + actual formation = closing component stock + external transfers + measured emissions + measured conversion/destruction; internal transfers cancel at the aggregated boundary. Record gross circulation separately. Replenishment alone is not total solvent emissions."
      inputs:
        - cp_materials
        - cp_waste
        - cp_air
        - cp_effluent
      output: "component residual and documented uncertainty"
      source_ids:
        - jrc-lvoc-hydrogen-peroxide-2017
    - id: calc_energy
      applies_to: "electricity_in; steam_in"
      rule: "Electrical energy (MJ) = measured kWh × 3.6. Only for a mass-matched indirect circuit with no stock change, other outlets or work, delivered heat (MJ) = sum(m × (h_steam − h_condensate)) / 1000 minus measured boundary heat loss, with kg and kJ/kg. Otherwise close the full measured energy balance with all inlet/outlet enthalpy, energy stocks, work and relevant kinetic/potential terms before deriving heat. Actual wet-steam enthalpy = (1 − dryness) × saturated-liquid enthalpy + dryness × saturated-vapour enthalpy at the measured saturation state. No fixed steam-to-MJ factor or GCV/NCV equivalence is provided."
      inputs:
        - cp_energy
      output: "separate electricity MJ, steam kg and verified delivered heat MJ"
      source_ids:
        - iapws-if97-2012
        - jrc-lvoc-hydrogen-peroxide-2017
    - id: calc_emission
      applies_to: "air and freshwater outputs"
      rule: "Species mass = sum(compatible species concentration × matched volumetric flow rate × interval duration), with concentration converted to kg/m3 and flow/time in compatible units and the same wet/dry and temperature/pressure basis. Use sufficiently resolved time integration when concentration or flow varies. Equivalently use the interval flow-weighted concentration × measured interval volume, without multiplying duration again. Reconcile point sources, fugitive sources and treatment residuals without duplicating captured/reused material or total-C indicators."
      inputs:
        - cp_air
        - cp_effluent
      output: "kg per species and receiving compartment"
      source_ids:
        - jrc-lvoc-hydrogen-peroxide-2017
    - id: calc_species_elements
      applies_to: "p_ao"
      rule: "For species i: opening + external input + actual formation = closing + external output + actual consumption; internal transfers cancel. For a conserved element e: opening elemental mass + external elemental input = closing elemental mass + external elemental output, using verified formula fractions and measured mixture composition. Total physical mass has no reaction generation/destruction term. Track peroxide synthesis, degradation, decomposition and net water formation/consumption explicitly; stoichiometry describes an evidenced reaction extent, never an assumed plant yield or destruction fraction."
      inputs:
        - cp_balance
        - cp_product
        - cp_materials
        - cp_gases
        - cp_water
        - cp_waste
        - cp_air
        - cp_effluent
      output: "separate molecular, elemental and whole-mass residuals with uncertainty"
      source_ids:
        - jrc-lvoc-hydrogen-peroxide-2017
        - evonik-hydrogen-peroxide-brochure
        - jrc-ilcd-general-guide-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify name, CAS where relevant, full qualifiers, route, reference property and provider quantity separately. Blank UUID means pending identity; a successful search does not establish background dataset compatibility."
      evidence: "actual direct record and supplier metadata"
    - id: dq_mass
      applies_to: "p_ao"
      requirement: "Reconcile solution composition, water, H/O and each actual solvent/carrier component; retain unexplained residual with uncertainty and investigated causes, not a balancing fabricated exchange."
      evidence: "cp_product; cp_materials; cp_gases; cp_water"
    - id: dq_completeness
      applies_to: "p_ao"
      requirement: "A conditional row may be absent only with actual route evidence. Missing stabiliser, treatment reagent/sludge, other working-liquid species or event emissions requires atomic extensions and blocks a complete dataset."
      evidence: "actual recipe/CoA, process graph and monitoring coverage"
    - id: dq_time
      applies_to: "all inventory rows"
      requirement: "Match production, utilities, material replacement, waste and emission records; document period/service-life attribution, analytical detection limits, missing data and uncertainty. No historic BREF amount is a gap-filling default."
      evidence: "original collected records and uncertainty report"
validation_rules:
  - rule_id: val_reference
    applies_to: "peroxide_product"
    rule: "Require exactly one linked reference-product output, full solution mass, nominal 30% grade and actual assay/acceptance. Active-only mass or unverified route/grade identity fails applicability."
    source_ids:
      - evonik-hydrogen-peroxide-brochure
  - rule_id: val_denominator
    applies_to: "all inventory rows"
    rule: "Require positive Q and per 1 kg reference flow in inventory, protocol aggregation and bilingual rules. Any supplemental per-active-kg result must disclose A and is not the mandatory reference inventory."
    source_ids:
      - evonik-hydrogen-peroxide-brochure
  - rule_id: val_balance
    applies_to: "p_ao"
    rule: "Check unallocated physical balances and same-quantity internal transfers before burden allocation; retain losses, water retained in solution, degradation and actual emissions. Do not assume theoretical stoichiometry is measured yield."
    source_ids:
      - jrc-lvoc-hydrogen-peroxide-2017
  - rule_id: val_species
    applies_to: "p_ao"
    rule: "Check elementary species, origin, medium/submedium and mass definition. Outdoor unspecified air identities are not indoor or long-term flows; freshwater discharge is not water extraction. Retain biogenic CO2/CH4 if present with separate origin-specific rows regardless of a chosen GHG reporting convention. Do not combine nested particulate fractions or total/component emissions."
    source_ids:
      - jrc-lvoc-hydrogen-peroxide-2017
  - rule_id: val_readiness
    applies_to: "all inventory rows"
    rule: "Unresolved identity, provider quantity, recipe, steam enthalpy or treatment/monitoring coverage is explicit incompleteness for the affected dataset. This authored method does not establish scientific approval or approve substituting incompatible UUIDs."
    source_ids:
      - jrc-lvoc-hydrogen-peroxide-2017
      - evonik-hydrogen-peroxide-brochure
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Verified industrial AO peroxide solution supply at declared producer gate"
  allowed_use: "Same route, concentration/solution quantity and stated grade when all required qualifiers and missing links are resolved"
  excluded_use: "Other CPC34280 compounds, excluded manufacturing routes, active-only or concentration-incompatible backgrounds, and unproved specialty certifications"
  required_metadata: "AO process graph; site/year; supplier route; actual assay/additives; full-solution reference; physical and allocated accounts; treatment/receiving media; all protocol IDs"
  required_quality_disclosure: "Actual measurement methods, representativeness, detection limits, missing identities and provider compatibility, balance residuals, allocation and uncertainty"
  update_trigger: "Changed working-liquid composition, peroxide grade, route, supplier utility basis, recovery/treatment, emission evidence or production period"
data_sources:
  - id: "jrc-lvoc-hydrogen-peroxide-2017"
    type: "official_guidance"
    reference: "European Commission JRC109279, LVOC BREF (2017), DOI 10.2760/77304. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/JRC109279_LVOC_Bref.pdf"
    used_for: "Sections 12.2, 12.3.1–12.3.6 and 13.11; printed pp.549–564 and 627–628 (PDF586–601 and664–665): AO boundaries, actual solvent/catalyst options, water/air/waste and heat-recovery measurement needs. Scope/application limitations retained; historical values, operating parameters, BAT-AELs and single-site values are not inventory defaults."
  - id: "evonik-hydrogen-peroxide-brochure"
    type: "handbook"
    reference: "Evonik, Hydrogen Peroxide — Applications and attributes for a sustainable, versatile chemical, undated acquired brochure. https://products.evonik.com/assets/95/41/Evonik_Hydrogen_Peroxide_Brochure_EN_Asset_2439541.pdf"
    used_for: "PDF pp.14–19,21: producer AO process, aqueous solution versus pure species, grades/concentration and dispatch state. Manufacturer-specific grade claims are not universal acceptance specifications; salt-free solution property tables do not establish actual density or energy."
  - id: "jrc-ilcd-general-guide-2010"
    type: "official_guidance"
    reference: "European Commission JRC48157, EUR24708EN, DOI 10.2788/38479, ILCD Handbook: General guide for Life Cycle Assessment – Detailed guidance, first edition (2010). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Sections 7.4.2.5–7.4.2.11 (printed pp.197–214, PDF217–234) and 7.9.1–7.9.3 (printed pp.254–265, PDF274–285): stock/composition and operation-cycle records, matched raw-data/reference scaling, quality checks, goal-dependent multifunctionality, subdivision, physical causality and service attribution. Supports accounting methods, not this producer's recipe, measured quantities or scientific approval."
  - id: "iapws-if97-2012"
    type: "official_guidance"
    reference: "IAPWS R7-97(2012), Revised Release on the IAPWS Industrial Formulation 1997 for the Thermodynamic Properties of Water and Steam. https://iapws.org/technical-guidance/release/IF97-Rev.download"
    used_for: "Sections 1–3, 5–8 and 12 (PDF pp.3–35,46–48): ordinary-water state enthalpy, liquid/vapour/saturation regions, reference convention and uncertainty. Use only valid measured states and dryness with a verified implementation; does not establish actual steam conditions, supplier heat convention or a universal kg-to-MJ factor."
