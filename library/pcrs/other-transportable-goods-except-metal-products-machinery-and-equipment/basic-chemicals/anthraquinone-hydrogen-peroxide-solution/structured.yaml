measurement_rules:
  - id: mu_solution
    applies_to: "peroxide_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Define Q as the sum of measured net masses of accepted complete solution lots produced over the matched period, counting each accepted lot once. Reconcile production, dispatches, opening/closing finished-product stocks, rejection and rework; exclude purchased same-category material from new synthesis and avoid counting reworked lots twice. Every inventory row uses per 1 kg reference flow. Active mass A = sum(lot solution mass × lot w); carrier water W = sum(lot mass × (1 − w − a)). Verify non-overlapping measured fractions and their mass closure. A and W are composition accounts, not additional reference-product outputs."
  - id: mu_solution_inputs
    applies_to: "aqueous chemical inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record full supplied solution and its measured assay separately; convert active-only supplier data only with declared concentration, water and background boundary. Do not add carrier water twice."
  - id: mu_circulation
    applies_to: "working solution and catalyst"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep opening/closing component stocks, receipts, external recovered returns, exports, degradation, internal circulation and measured losses separately. Internal recovery does not create a negative external input or eliminate actual losses."
  - id: mu_gases
    applies_to: "gas exchanges"
    required_property_ref:
      name: "Mass / Volume"
      uuid: ""
    required_unit: "kg / m3"
    rule: "Gas volume needs stated T, absolute P, humidity, composition and compressibility plus provider reference conditions; derive mass from measured or supplier-verified conditions. No database secondary coefficient is assumed to be density."
  - id: mu_energy
    applies_to: "electricity_in; steam_in"
    required_property_ref:
      name: "Net calorific value / Mass"
      uuid: ""
    required_unit: "MJ / kg"
    rule: "Electricity: measured kWh × 3.6 = MJ in the verified energy unit group; the native NCV label does not describe combustion of electricity. Steam kg, state enthalpy and provider heat reference remain separate. Derive ordinary-water enthalpies from measured absolute P, T and phase/dryness with a traceable IAPWS-IF97 implementation inside its validity domain. Saturation P/T alone does not establish wet-steam dryness. Account for every condensate/vent/drain/export and energy stock change; agree the heat-control boundary and losses. Neither NCV nor GCV in a native energy property proves net delivered steam heat. [iapws-if97-2012]"
  - id: mu_emissions
    applies_to: "air/water species"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Integrate species concentration × compatible gas/liquid flow × duration across matched periods. FID mg C is not kg of any specific solvent without speciation and an explicit carbon-to-species conversion. COD/TOC are treatment indicators, not automatically species emissions; avoid duplicate total/component loads."
  - id: mu_input_attribution
    applies_to: "product inputs"
    required_property_ref:
      name: "Mass / Volume / Energy"
      uuid: ""
    required_unit: "row unit"
    rule: "Use the named protocol to reconcile physical receipts, store and in-use stocks, stage issues and unused returns before deriving the matched-period input numerator. Record actual service-life attribution for catalyst, adsorbent, filter, reusable container and maintenance supplies separately from full physical quantities and from co-product burden allocation. Do not divide an unadjusted purchase invoice by Q. [jrc-ilcd-general-guide-2010]"
  - id: mu_species_balance
    applies_to: "p_ao"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Maintain whole-phase mass and each molecular species ledger separately. Species can form or be consumed; H2O2 is not conserved through synthesis or decomposition. Reconcile conserved elemental C/H/N/O and other actual elements from verified molecular formulas and measured mixture fractions. Account for H2, O2, N2, carrier water, dissolved gas, steam/condensate, net reaction-formed or consumed water and all physical fates. No default yield, excess-air fraction, peroxide destruction fraction or decomposition rate is supplied. [jrc-lvoc-hydrogen-peroxide-2017; evonik-hydrogen-peroxide-brochure; jrc-ilcd-general-guide-2010]"
