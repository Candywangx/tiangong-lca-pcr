system_boundary:
  rules:
    - rule_id: sb_ao
      applies_to: "p_ao"
      rule: "Include the actual hydrogenation/oxidation/extraction loop, working-solution drying/reversion, catalyst recovery, purification, any concentration/dilution and stabilisation, storage/dispatch, cooling and emission control. Stage meters and physical transfers must remain available even with the combined foreground unit."
      source_ids:
        - jrc-lvoc-hydrogen-peroxide-2017
        - evonik-hydrogen-peroxide-brochure
    - rule_id: sb_utilities
      applies_to: "p_ao"
      rule: "Purchased water, compressed air and steam link to upstream supply; site generation requires separate real inputs and emissions. This implementation assumes externally supplied steam and no on-site combustion. A combustion route needs a separately evidenced utility module, each fuel and every relevant elementary emission before dataset completion."
      source_ids:
        - jrc-lvoc-hydrogen-peroxide-2017
    - rule_id: sb_destination
      applies_to: "p_ao"
      rule: "Separate external waste transfers from direct emissions after included treatment. Record phase separation, recovered organic phases, water reuse and actual residual discharge. Extend the treatment unit with its own atomic reagents, energy, sludge and emissions when treatment is on site; do not hide it inside a removal-efficiency assumption."
      source_ids:
        - jrc-lvoc-hydrogen-peroxide-2017
    - rule_id: sb_actual_recipe
      applies_to: "p_ao"
      rule: "The listed quinone, solvent and treatment-agent alternatives are conditional accounting examples, not a prescribed working-liquid formulation. Before completeness, add one atomic row for each actual stabiliser, additional carrier/solvent, catalyst support supply, cooling chemical, cleaning chemical, packaging component, waste and emitted species not represented here. Verify their physical identities and amount bases. Bulk dispatch excludes container tare from product mass; packaging and transport are added if inside the declared boundary."
      source_ids:
        - jrc-lvoc-hydrogen-peroxide-2017
        - evonik-hydrogen-peroxide-brochure
