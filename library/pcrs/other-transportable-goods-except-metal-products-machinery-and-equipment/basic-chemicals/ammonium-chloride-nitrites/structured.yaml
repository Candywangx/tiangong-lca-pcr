allocation_rules:
  - rule_id: allocation_single
    applies_to: "nh4cl_manufacture"
    rule: "One chemical product is defined; directly assign separable operations/utilities and packing. Internal liquor/dust/rework and rejected crystals are not co-products; shipped packaging has physical mass but no independent co-function."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_shared
    applies_to: "nh4cl_manufacture"
    rule: "Subdivide measured exclusive activities first; residual shared burdens use demonstrated determining physical causality. If not demonstrable, use process-gate market-value allocation with matched quantities/prices and sensitivity. No default share or waste credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_ledgers
    applies_to: "nh4cl_manufacture"
    rule: "Preserve full unallocated physical mass/element/water/stock ledgers separately from environmental burden allocation. Never multiply physical product, waste, emission or internal transfer by allocation factors."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "nh4cl_manufacture"
      flow_role: "Product acceptance and Q"
      record_type: "foreground_record"
      raw_fields: "lot; SKU; net crystal kg; assay; moisture; acidity; impurities; size; rejection; dispatch; returns; opening/closing accepted stock/WIP; inherited burdens; Q"
      collection_method: "Calibrated net weighing excluding packaging and representative sampling; reconcile unique accepted lots and all stock/dispatch/rework records."
      unit: "kg"
      frequency: "Each batch and continuous meters; start/stop and stocktake"
      temporal_coverage: "Complete matched period including failures and downtime"
      site_scope: "Same site, direct route, state and product pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, method uncertainty, samples, batch/stock and transfer records"
    - protocol_id: cp_materials
      process_id: "nh4cl_manufacture"
      flow_role: "Feed and loop chemistry"
      record_type: "foreground_record"
      raw_fields: "supplier; whole solution kg; NH3/HCl assays; water; impurities; liquid NH3; stage charges; opening/closing feed/mother liquor; returns; reaction evidence"
      collection_method: "Calibrated weighing/meters and actual assays; retain whole procurement and component subledgers, density/T and paired internal transfers."
      unit: "kg"
      frequency: "Each batch and continuous meters; start/stop and stocktake"
      temporal_coverage: "Complete matched period including failures and downtime"
      site_scope: "Same site, direct route, state and product pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, method uncertainty, samples, batch/stock and transfer records"
    - protocol_id: cp_water
      process_id: "nh4cl_manufacture"
      flow_role: "Water and phase balance"
      record_type: "foreground_record"
      raw_fields: "source; meter volume; density/T; acid carrier water; wash/scrub loop; condensate; humidity; evaporation; moisture; opening/closing liquid"
      collection_method: "Independently measure water/condensate/air-moisture routes; convert integrated volume with measured density once; distinguish free, crystal-retained and vapour water."
      unit: "kg"
      frequency: "Each batch and continuous meters; start/stop and stocktake"
      temporal_coverage: "Complete matched period including failures and downtime"
      site_scope: "Same site, direct route, state and product pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, method uncertainty, samples, batch/stock and transfer records"
    - protocol_id: cp_energy
      process_id: "nh4cl_manufacture"
      flow_role: "Steam, return and electricity"
      record_type: "foreground_record"
      raw_fields: "stage/total kWh; vaporiser; fans/pumps; steam kg; pressure absolute/gauge; T; dryness; condensate kg/T; heat losses; supplier reference"
      collection_method: "Calibrated stage and supply/return meters, common-reference steam enthalpy method and bills; reconcile energy without equating mass to heat."
      unit: "kg; kWh; MJ"
      frequency: "Each batch and continuous meters; start/stop and stocktake"
      temporal_coverage: "Complete matched period including failures and downtime"
      site_scope: "Same site, direct route, state and product pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, method uncertainty, samples, batch/stock and transfer records"
    - protocol_id: cp_pack
      process_id: "nh4cl_manufacture"
      flow_role: "Packaging ledgers"
      record_type: "foreground_record"
      raw_fields: "polymer; empty component kg; count; capacity; closure; reuse cycles; issues; shipped; rejects; opening/closing stocks"
      collection_method: "Weigh each actual component and count issues/shipped/rejected units; retain full physical mass; reuse service fractions affect burden ledger only."
      unit: "kg; items"
      frequency: "Each batch and continuous meters; start/stop and stocktake"
      temporal_coverage: "Complete matched period including failures and downtime"
      site_scope: "Same site, direct route, state and product pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, method uncertainty, samples, batch/stock and transfer records"
    - protocol_id: cp_waste
      process_id: "nh4cl_manufacture"
      flow_role: "Waste and receiver"
      record_type: "foreground_record"
      raw_fields: "stream ID; wet kg; dry solids; water; NH4/NH3-N; Cl; acidity; impurities; dust; internal return; receiver/treatment; manifests; stocks"
      collection_method: "Weigh/sample each external stream separately; document actual state, receiver/treatment and stock changes; no residual-derived waste quantity."
      unit: "kg"
      frequency: "Each batch and continuous meters; start/stop and stocktake"
      temporal_coverage: "Complete matched period including failures and downtime"
      site_scope: "Same site, direct route, state and product pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, method uncertainty, samples, batch/stock and transfer records"
    - protocol_id: cp_air
      process_id: "nh4cl_manufacture"
      flow_role: "Post-control releases"
      record_type: "foreground_record"
      raw_fields: "source; species; dry/wet basis; actual/standard volume; T/P; integrated volume or flow rate/duration; NH3; HCl; particle bins/composition; water vapour; abatement; detection limits"
      collection_method: "Representative stack/fugitive monitoring of normal, failed and transient operation; match concentration/volume T/P/dry-wet basis; independently measure partition, not infer all loss as one species."
      unit: "kg; mg/m3; m3; m3/h; h"
      frequency: "Each batch and continuous meters; start/stop and stocktake"
      temporal_coverage: "Complete matched period including failures and downtime"
      site_scope: "Same site, direct route, state and product pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, method uncertainty, samples, batch/stock and transfer records"
    - protocol_id: cp_assets
      process_id: "nh4cl_manufacture"
      flow_role: "Transport/capital screening"
      record_type: "foreground_record"
      raw_fields: "shipment mass/distance/mode; equipment bill; installed mass; lifetime; throughput; shared service; maintenance; cut-offs"
      collection_method: "Verify supplier/receiver routes and equipment service records; add each included transport/asset/material atomically with explicit cut-off rationale."
      unit: "kg; km; t*km; years"
      frequency: "Each batch and continuous meters; start/stop and stocktake"
      temporal_coverage: "Complete matched period including failures and downtime"
      site_scope: "Same site, direct route, state and product pool"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, method uncertainty, samples, batch/stock and transfer records"
  calculation_rules:
    - id: calc_period
      applies_to: "all inventory rows"
      rule: "Convert raw units first; assemble complete matched-pool quantities and carried burdens, then divide once by unique positive Q. Retain raw totals and inherited/closing-stock burdens traceably; Q=0 has no normalized result."
      inputs:
        - cp_product
        - cp_materials
        - cp_water
        - cp_energy
        - cp_pack
        - cp_waste
        - cp_air
      output: "Atomic exchanges per 1 kg reference flow"
      source_ids:
        - jrc-cww-2016
    - id: calc_chemical
      applies_to: "feed_ammonia, feed_hcl, nh4cl_product"
      rule: "NH3 + HCl -> NH4Cl gives no net molecular water. Independent feed/product assays, actual reaction evidence, N/H/Cl balances and measured phase transfers determine conversion/losses. Track carrier/free/crystal-retained water separately; never fit unknown reaction water and unknown outlet to one residual or use COD for mass closure."
      inputs:
        - cp_materials
        - cp_product
        - cp_water
        - cp_waste
        - cp_air
      output: "Raw physical mass/element/water ledgers"
      source_ids:
        - unido-nh4cl-study
        - jrc-cww-2016
    - id: calc_load
      applies_to: "air_nh3, air_hcl, air_pm25, air_pm10, air_pmover10, air_pm_unsized"
      rule: "At matched gas conditions, emitted kg = sum(C_mg_per_m3 × integrated_V_m3) / 1000000. Integrate flow rate over time for volume; never multiply integrated volume by time again. Resolve NH3 versus N and dry particles versus wet droplets explicitly."
      inputs:
        - cp_air
      output: "Species/particle raw-period kg"
      source_ids:
        - jrc-cww-2016
    - id: calc_utilities
      applies_to: "electricity, steam_import, condensate_return"
      rule: "Electricity MJ = metered kWh × 3.6. Net steam enthalpy uses imported mass × supplied specific enthalpy minus matched return/vent enthalpy and declared interface terms; retain losses and verify provider conventions without double charging mass and heat."
      inputs:
        - cp_energy
      output: "Period electricity and separate steam mass/enthalpy ledger"
      source_ids:
        - jrc-cww-2016
    - id: calc_pack
      applies_to: "pp_sack, pe_liner, delivered_pp, delivered_pe"
      rule: "Physical packaging kg = measured empty component kg × actual count; reconcile issues, stocks, delivery and waste. Reuse allocation changes service burdens only, never physical output."
      inputs:
        - cp_pack
      output: "Physical packaging and separate service burden"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: quality_closure
      applies_to: "nh4cl_manufacture"
      requirement: "Close full unallocated mass and N/H/Cl/O plus actual impurity/packaging C ledgers using independent measurements and chemistry. Separate reaction/phase water and dry matter; no unexplained residual fitting or universal tolerance."
      evidence: "cp_materials; cp_water; cp_pack; cp_waste; cp_air"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Check complete native names/CAS/form/route/geography/medium and exact property-unit chain; identity is separate from provider quantity compatibility. Disclose broad-reference and source-classification limitations."
      evidence: "cp_product; cp_materials; cp_energy"
    - id: quality_completeness
      applies_to: "nh4cl_manufacture"
      requirement: "Retain included/not-applicable/unmeasured/cut-off decisions, detection limits and uncertainty for each stage/source. Blank UUID is not zero; add actual extra chemicals, closures, cooling/treatment, liquid drift, transport and assets atomically."
      evidence: "cp_air; cp_assets; cp_waste"
    - id: quality_no_defaults
      applies_to: "nh4cl_manufacture"
      requirement: "Actual grade, recipe, assay, yield, heat/power and monitoring records are required. Old report economics and producer examples supply no site/quantity defaults."
      evidence: "unido-nh4cl-study; basf-nh4cl-grades"
validation_rules:
  - rule_id: validate_reference
    applies_to: "nh4cl_product"
    rule: "Require one final chemical reference output, 1 kg net supplied crystals, all qualifiers and unique positive Q; reject nitrites, nutrient-only basis and incompatible route/form."
    source_ids:
      - unsd-cpc3-2025
      - unido-nh4cl-study
  - rule_id: validate_pool
    applies_to: "nh4cl_manufacture"
    rule: "Reconcile full inputs/burdens including start/stop, failures, zero-output, returns/rework, stock/WIP and inherited burdens; normalize once after conversion. Q=0 gives no normalized values."
    source_ids:
      - jrc-cww-2016
  - rule_id: validate_physics
    applies_to: "nh4cl_manufacture"
    rule: "Require independent physical mass/element/water closure and reaction evidence; no net water from NH3+HCl. Wet procurement differs from constituent assays; physical and allocated ledgers remain separate."
    source_ids:
      - unido-nh4cl-study
      - jrc-ilcd-2010
      - jrc-cww-2016
  - rule_id: validate_air
    applies_to: "air_nh3, air_hcl, air_pm25, air_pm10, air_pmover10, air_pm_unsized, air_water"
    rule: "Verify species, medium, reference volume and post-control loads. Use disjoint particle bins or non-overlapping unsized remainder; captured/recycled dust is not release. Distinguish vapour, droplets and dry salt."
    source_ids:
      - jrc-cww-2016
  - rule_id: validate_interfaces
    applies_to: "all inventory rows"
    rule: "Verify CN/voltage limits, steam mass/enthalpy/provider convention and every receiver/treatment/transport link. Report unmeasured data, blank UUIDs and checks skipped; PCR checks are neither completed site inventory nor scientific approval."
    source_ids:
      - jrc-cww-2016
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Delivered crystalline NH4Cl input with compatible composition/state and direct-route scope"
  allowed_use: "Declared additive-free aqueous direct route with actual site, period, SKU and providers"
  excluded_use: "Other routes/salts/nitrites, pure-active/nutrient substitutions, default factory quantities, use-phase emissions or regulatory approval"
  required_metadata: "Qualifiers; stages/flowsheet; complete Q/pool/stock/WIP and physical/burden ledgers; assays; utilities; pack design; providers/receivers/transports; treatment/capital/cut-offs; allocation; version"
  required_quality_disclosure: "Methods, uncertainty, coverage; broad reference restriction; native location/voltage/source-metadata debts; blank identities/provider/receiver gaps; actual extensions and review scope"
  update_trigger: "Route/feed/product/grade/additive, utility/abatement, supplier/receiver/packaging/stock/allocation evidence changes"
data_sources:
  - id: "unido-nh4cl-study"
    type: "official_guidance"
    reference: "UNIDO, Development of a portfolio of industrial opportunity studies for existing industries in Ethiopia, Final Report, scan17160, Ammonium Chloride study, VI.A.1.d, printed P17/PDF1172; undated historical scan. https://downloads.unido.org/ot/48/19/4819516/15001-20000_17160.pdf"
    used_for: "Historical direct-neutralisation sequence: recycled aqueous liquor, concentration, cooling crystallisation, filtration, drying and moisture-proof packing. The report selects a different sulfate/salt route; none of its selected-route recipes, economics, old market restrictions or performance values becomes a default."
  - id: "jrc-cww-2016"
    type: "official_guidance"
    reference: "European Commission JRC, CWW BREF,2016, BAT2–4, printed543–544/PDF573–574. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/CWW_Bref_2016_published.pdf"
    used_for: "Chemical-sector reaction/side-product and waste-stream inventories, flow and pollutant-load characterisation and representative monitoring. No NH4Cl recipe, abatement design, emission factor or compliance claim; collect actual controls and samples."
  - id: "basf-nh4cl-grades"
    type: "literature"
    reference: "BASF, Inorganic Chemicals, Ammonium chloride product table, Untreated U Grade; publisher-page snapshot2026-10-16. https://chemicals.basf.com/global/en/Monomers/inorganic-chemicals"
    used_for: "Producer evidence for marketed additive-free crystalline technical NH4Cl; other grades contain anti-caking additives. Grade assays and packaging sizes are examples only, not universal specifications, actual-site proof or manufacturing-route evidence."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for LCA, Detailed guidance, first edition March2010, section7.9.3, printed257–258/PDF277–278. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Virtual subdivision and determining physical causality for attributional shared burdens; remaining burdens use process-gate market value with sensitivity. No fixed allocation share, avoided-production credit or default value."
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0 Structure,30June2025, CSV line1493,34653. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Classification boundary only: ammonium chloride and nitrites. Direct-route crystalline NH4Cl is a narrower subset; classification proves neither manufacture nor single-species identity."
