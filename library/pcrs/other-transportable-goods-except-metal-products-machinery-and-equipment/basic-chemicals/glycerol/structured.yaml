  classification_refs: "CPC 3.0:34570; narrower"
  covered_products: "Accepted bulk refined glycerol from fat-splitting crude feed"
  excluded_products: "Other feed routes, ion exchange, residue recovery, formulations, retail packs and marketed technical co-products"
  representative_product: "One actual measured refined-glycerine SKU; KLK refined-glycerin family is commercial existence evidence, not a mandatory SKU or site claim"
  production_route: "Crude receipt → optional NaOH conditioning → vacuum/foots distillation and internal recovery → stripping → carbon bleaching → filtration/cooling → bulk loading"
  market_state: "Liquid at measured loading conditions; net commercial mass with actual residual water and impurities"
functional_unit:
  what: "Supply a qualified refined glycerol chemical feedstock"
  how_much: "1 kg accepted net bulk product"
  how_well: "Actual SKU acceptance: glycerol assay and its wet/dry basis, water, MONG, ash/salts, acidity, colour and relevant contaminants"
  how_long_or_cycle: "One declared representative production and dispatch period, including startup, shutdown, rework and stock changes; no service life"
  reference_flow_link: "refined_glycerol"
system_boundary:
  rules:
    - rule_id: b_gate
      applies_to: "refining"
      rule: "Include receipt, conditioning if used, distillation/foots recovery, stripping, bleaching, polishing, cooling, storage/loading, recovery/scrubbing, startup/shutdown, cleaning and maintenance consumption attributable to this product. Segregate stage meters and keep internal transfers equal at both ends."
      source_ids:
        - cpm-glycerin-refining-2024
        - ifc-oleochemicals-2007
    - rule_id: b_upstream
      applies_to: "crude_glycerine"
      rule: "Crude glycerine is not burden-free waste by name or biological origin. Preserve the upstream joint-production allocation and concentration/pretreatment inventory once; a fatty-acid sweet-water dataset alone does not establish the received concentrated feed."
      source_ids:
        - efisc-oilseed-refining-v3-1
        - eu-pef-multifunctionality-2021
    - rule_id: b_emissions
      applies_to: "refining"
      rule: "Establish an actual stream map and species inventory for condenser/vacuum/vent, cleaning and waste outlets. Exported effluent is a waste transfer; treatment emissions belong to the linked treatment boundary. If any direct outfall or on-site combustion/treatment exists, extend the inventory with exact receiving media, each actual species and unambiguous quantities."
      source_ids:
        - jrc-cww-bref-2016
        - ifc-oleochemicals-2007
    - rule_id: b_carbon
      applies_to: "all inventory rows"
      rule: "Keep measured biological/fossil carbon in feed, carbon medium, product, residues and actual emissions with origin evidence. Do not remove any actual biogenic CO2 from LCI because a GHG reporting convention gives it different treatment. Captured carbon, organic carbon and CO2 mass are distinct; no assumed conversion or neutrality."
      source_ids:
        - jrc-cww-bref-2016
boundary_abstraction:
  declared_starting_condition: "Received pretreated concentrated fat-splitting crude glycerine and external utilities"
  starting_condition_role: "foreground_gate_input"
  product_classification_scope: "CPC 34570 fat-splitting vacuum-refined subset; no whole-leaf claim"
  recursive_input_rule: "Same-category rework is internal if inside this gate; externally purchased glycerol remains one input with its own compatible upstream dataset and actual state; do not substitute it for crude feed"
  upstream_dataset_requirement: "Compatible feed dataset includes natural oil/fat supply, joint hydrolysis allocation, sweet-water concentration and pretreatment, with supplier geography/period and wet-mixture reference basis; utilities and exported wastes need compatible provider/receiver datasets"
  disclosure: "Starting state, omitted upstream stages, supplier links, stage meters, internal transfers, treatment gate, actual atmosphere/water destinations, energy/stock reconciliations and exclusions"
