    type: "official_guidance"
    reference: "[JRC103096 CWW BREF 2016, BAT 2–3, printed pp. 543–544 / PDF pp. 573–574](https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf)"
    used_for: "Chemical-sector stream inventory, relevant species and flow/concentration monitoring; BAT limits are not LCI factors"
