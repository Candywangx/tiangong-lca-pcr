allocation_rules:
  - rule_id: a_single
    applies_to: "refining"
    rule: "The base profile has one saleable refined product; attribute refining burdens to it. Rework, captured light fractions, recycled foots and closing inventory are not fictional saleable co-products; count their processing and stock changes. Externally returned steam condensate is a utility return with a reconciled provider boundary, not an automatic credit."
    source_ids:
      - cpm-glycerin-refining-2024
      - eu-pef-multifunctionality-2021
  - rule_id: a_joint
    applies_to: "crude_glycerine"
    rule: "For upstream hydrolysis and any reviewed multi-output extension, investigate subdivision/system expansion, then justified physical relationships, then another justified relationship such as actual gate economic value. Document the chosen goal/method, reasons, measured output bases, prices and sensitivity; no generic glycerol share or free by-product assumption."
    source_ids:
      - eu-pef-multifunctionality-2021
  - rule_id: a_ledgers
    applies_to: "all inventory rows"
    rule: "Keep each full measured physical output and equal internal transfers in the unallocated process map/mass/water/carbon ledger. Allocate only the attributable environmental burden pools in a separately linked ledger; do not multiply co-product physical mass by an allocation share. Waste treatment is linked once to actual composition/disposition; no assumed substitution credit."
    source_ids:
      - eu-pef-multifunctionality-2021
