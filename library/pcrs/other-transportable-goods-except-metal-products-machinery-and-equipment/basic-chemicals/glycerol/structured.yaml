    reference: "[EFISC sector reference document for oilseed crushing/vegetable oil refining v3.1, p. 8 entries 13.8.1–13.8.2](https://food.ec.europa.eu/system/files/2020-08/animal-feed_fh_good-practice_eu-guide_oilseed-crushing_veg-oil-refining_v3-1.pdf)"
    used_for: "Distinguish whole crude glycerine from refined glycerin; oil splitting/sweet-water concentration route; catalogue dry-matter criterion is not a wet chemical default"
