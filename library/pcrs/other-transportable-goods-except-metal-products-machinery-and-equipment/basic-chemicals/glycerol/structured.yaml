      raw_fields: "SKU; quantity; concentration/water; polymer/grade; carbon feedstock; bed charge; replacement; returns; stocks; actual destination; actual reaction pathways and independently measured reactant/product quantities for neutralisation or other observed conversion"
      collection_method: "Weigh or reconcile stock/invoice records by one material; solution active mass is calculated separately; assign replacement life across the actual monitored production, not an assumed lifetime"
      unit: "kg"
      frequency: "Each batch or replacement"
      temporal_coverage: "Full declared period including startup/shutdown, cleaning, rework and stocks"
      site_scope: "Same site, route and meter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; provider evidence; balance reconciliation; uncertainty"
    - protocol_id: cp_utilities
      process_id: "refining"
      flow_role: "electricity; makeup_water"
      record_type: "stage meter records"
      raw_fields: "Meter ID; voltage; provider geography/losses; kWh/MJ; water kg/volume/density/temperature; destination; clock; operating state"
      collection_method: "Calibrated synchronized meter totals for vacuum, pumps, cooling, cleaning and loading; separate fresh water from recirculation; reconcile facility and stage totals without double counting"
      unit: "MJ; kg"
      frequency: "Continuous and period close"
      temporal_coverage: "Full declared period including startup/shutdown, cleaning, rework and stocks"
      site_scope: "Same site, route and meter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; provider evidence; balance reconciliation; uncertainty"
    - protocol_id: cp_steam
      process_id: "refining"
      flow_role: "heating_steam; stripping_steam; returned_condensate"
      record_type: "supplier and stage metering records"
      raw_fields: "Separate supply/injection/return masses; absolute pressure; temperature; phase/dryness; supplier enthalpy and datum; state method; flash/losses; contract reference basis"
      collection_method: "Calibrated mass meters and traced supplier state/enthalpy records; reconcile indirect heater return versus direct stripping destination. Withhold heat-based provider link if state or net delivered-heat definition is unknown"
      unit: "kg; kJ/kg"
      frequency: "Continuous and supplier settlement"
      temporal_coverage: "Full declared period including startup/shutdown, cleaning, rework and stocks"
      site_scope: "Same site, route and meter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; provider evidence; balance reconciliation; uncertainty"
    - protocol_id: cp_wastes
      process_id: "refining"
      flow_role: "still_residue; spent_carbon; discarded_glycerine; spent_filter"
      record_type: "weighing, composition and receiver records"
      raw_fields: "Stream ID; wet/dry mass; glycerol/water/salts/carbon/polymer composition; lot; origin; receiver; treatment; waste status; rework; stocks"
      collection_method: "Weigh separate waste outlets, sample composition and reconcile transfer notes with internal recovery. Track no-export intervals and actual routing; absence needs evidence"
      unit: "kg"
      frequency: "Each export and representative sampling"
      temporal_coverage: "Full declared period including startup/shutdown, cleaning, rework and stocks"
      site_scope: "Same site, route and meter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; provider evidence; balance reconciliation; uncertainty"
    - protocol_id: cp_effluent
      process_id: "refining"
      flow_role: "offsite_effluent"
      record_type: "flow-proportional sample and export records"
      raw_fields: "Substream ID; mass/volume/density; flow; pH; temperature; glycerol/fatty profile; salts; COD/TOC and analytical bases; receiver; recovery; sampling interval"
      collection_method: "Matched flow/representative concentration samples for condensers, vacuum/scrubbers and cleaning; convert volume to mass with measured density; pollutant analytical loads explain this waste, not a second direct discharge"
      unit: "kg; m3; mg/L"
      frequency: "Continuous flow and representative operation/cleaning samples"
      temporal_coverage: "Full declared period including startup/shutdown, cleaning, rework and stocks"
      site_scope: "Same site, route and meter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; provider evidence; balance reconciliation; uncertainty"
    - protocol_id: cp_air
      process_id: "refining"
      flow_role: "glycerol_air; acrolein_air; water_vapour_air"
      record_type: "compound-specific exhaust monitoring"
      raw_fields: "Outlet; outdoor subcompartment; gas flow; T/P; wet/dry basis; compound concentration; mist/vapour capture; moisture; runtime; detection limits; control performance"
      collection_method: "Measure each relevant post-control vent and fugitive release with validated species-specific sampling; match flow/concentration/time bases; retained indoor exposure or captured liquid is not outdoor emission; water balance verifies vapour"
      unit: "kg; m3; mg/m3"
      frequency: "Representative steady, startup/shutdown and cleaning periods"
      temporal_coverage: "Full declared period including startup/shutdown, cleaning, rework and stocks"
      site_scope: "Same site, route and meter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; provider evidence; balance reconciliation; uncertainty"
  calculation_rules:
    - id: calc_normalized
      applies_to: "all inventory rows"
      rule: "N = sum(Q) / B; sum raw physical exchange quantities over the same complete declared route/state/SKU period, including attributable failed or zero-output intervals, startup/shutdown, cleaning and rework, then divide once. Do not average successful-interval ratios or renormalize per-kg values. B must be positive and is accepted net bulk glycerol kg from cp_release, credited once after reconciling returns, reacceptance, finished stocks and work in progress. Internal rework passes are not new accepted output. Retain raw physical totals and separately reconcile carried inventory burdens to the same accepted output; do not drop physical exchanges when adjusting burden attribution. If B is zero, preserve totals and disclose no unit result rather than divide or omit burdens."
      inputs:
        - Q
        - B
        - cp_release
      output: "exchange quantity per 1 kg reference flow"
      source_ids:
        - jrc-cww-bref-2016
    - id: calc_composition
      applies_to: "crude_glycerine; caustic_solution; refined_glycerol"
      rule: "component_mass = supplied_mass × measured_wet_fraction; dry_glycerol_fraction × (1 − measured_water_fraction) gives wet glycerol fraction only when both analyses share the same representative sample basis. Water, MONG, salt and active ledgers do not add extra exchanges to the parent mass."
      inputs:
        - supplied_mass
        - measured_wet_fraction
        - dry_glycerol_fraction
        - measured_water_fraction
      output: "component and water ledgers"
      source_ids:
        - efisc-oilseed-refining-v3-1
    - id: calc_air_load
      applies_to: "glycerol_air; acrolein_air"
      rule: "load_kg = sum(C_mg_per_m3 × gas_volume_m3 × 0.000001) for matched species and wet/dry T/P measurement conditions. Gas_volume is time-integrated flow over the same operating interval; no capture efficiency or missing pollutant is assumed."
      inputs:
        - concentration
        - gas_volume
        - conditions
        - cp_air
      output: "actual post-control species load"
      source_ids:
        - jrc-cww-bref-2016
    - id: calc_ledgers
      applies_to: "all inventory rows"
      rule: "For each complete matched period conserve whole mass and actual elements: physical input + opening stock = physical output + closing stock + disclosed residual. Count actual external losses among outputs and do not count stock accumulation twice. Use measured composition to reconcile C/H/O and relevant alkali/salt elements; preserve biological/fossil carbon origins. Water, glycerol and dry components are species/material ledgers, not automatically conserved quantities: add actual reaction formation to inputs and actual consumption to outputs, including neutralisation or any evidenced conversion. Bound reaction terms using actual equations and independently measured reactant/product quantities with uncertainty; do not fit unknown reaction water or dry matter to a residual, use COD as carbon mass, or assume a transesterification/hydrolysis recipe inside this refining gate. A water-balance estimate of vapour is available only when the other water terms are independently bounded. Internal transfers cancel only at the aggregate gate and remain equal in stage logs; retain uncertainty rather than forcing a zero residual."
      inputs:
        - "stage records"
        - composition
        - stocks
        - "actual reaction evidence"
        - "actual emissions"
        - cp_feed
        - cp_materials
        - cp_release
      output: "unallocated physical balances"
      source_ids:
        - jrc-cww-bref-2016
        - cpm-glycerin-refining-2024
    - id: calc_steam
      applies_to: "heating_steam; returned_condensate"
      rule: "For matched steady indirect heating only, with complete measured return and negligible documented work/storage/other losses: heat_MJ = steam_mass × (h_supply − h_return) / 1000, using supplier-traced h in kJ/kg with one datum and validated state method. Otherwise require the full measured energy balance including flash, leaks, return, accumulation and losses. Never apply this shortcut to direct stripping; preserve the physical mass rows and reconcile provider net/gross/return convention before linking."
      inputs:
        - steam_mass
        - "traced enthalpies"
        - "same datum"
        - state_method
        - complete_boundary
        - cp_steam
      output: "conditional heat supplement ledger"
      source_ids:
        - ifc-oleochemicals-2007
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Recheck actual species/CAS, mixture state, route, grade, source carbon, receiving medium and reference property/unit; a valid UUID is not a provider dataset or a recipe. Blank UUIDs remain explicit linkage gaps."
      evidence: "Supplier documents and identity records"
    - id: dq_complete
      applies_to: "refining"
      requirement: "Use complete representative operating/cleaning periods and reconcile plant/stage totals. Missing amounts, unknown receiver, unsupported unit or unexplained balance residual remains unresolved; not_applicable requires actual absence evidence."
      evidence: "Meter, stock and sample records"
    - id: dq_extend
      applies_to: "refining"
      requirement: "Species survey must add each additional actual VOC, carbon emission, particle fraction, refrigerant, cleaning chemical and treatment flow separately. PM size bins must be disjoint; chemical components inside a measured total cannot be summed twice. No correction-flow substitution."
      evidence: "jrc-cww-bref-2016"
    - id: dq_language
      applies_to: "all inventory rows"
      requirement: "Bilingual row identities, sources, formula definitions, reference amount and normalized basis must agree; use official Chinese database baseName where available."
      evidence: "Bilingual alignment"
validation_rules:
  - rule_id: v_scope
    applies_to: "refining"
    rule: "Check declared fat-splitting feed history, concentration/pretreatment upstream coverage, vacuum/bleaching route and actual grade. Other routes or externally marketed technical glycerine do not conform without a reviewed extension."
    source_ids:
      - ifc-oleochemicals-2007
      - efisc-oilseed-refining-v3-1
  - rule_id: v_reference
    applies_to: "refined_glycerol"
    rule: "Require one reference output of 1 kg accepted net bulk commercial material and all qualifiers. Inventory denominator, aggregation and conversion must refer to the same accepted period/basis; dry assay or pure active mass cannot replace whole supplied mass."
    source_ids:
      - efisc-oilseed-refining-v3-1
  - rule_id: v_balances
    applies_to: "all inventory rows"
    rule: "Verify full unallocated mass/water/carbon and energy balances, equal internal transfers, separate indirect/direct steam, no duplicated reference product, species or particulate bins, and distinct physical versus burden ledgers."
    source_ids:
      - cpm-glycerin-refining-2024
      - jrc-cww-bref-2016
      - eu-pef-multifunctionality-2021
  - rule_id: v_evidence
    applies_to: "all inventory rows"
    rule: "Every actual exchange needs traceable measurement and compatible provider/receiver definition. Unknown UUIDs, assay/density, steam state/heat basis, pollution speciation or incomplete sampling remain explicit data-package gaps. Passing a finite measurement/projection check does not approve scientific methodology or resolve these gaps."
    source_ids:
      - jrc-cww-bref-2016
published_dataset_profile:
  dataset_role: "foreground process dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified bulk refined glycerol procurement for this route and composition after real collection, upstream linkage, receiver/provider checks and scientific review"
  excluded_use: "Other routes, unspecified mixture/pure active substitution, zero-burden crude, universal purity/yield defaults, full CPC coverage or methodology approval from tool checks"
  required_metadata: "All reference qualifiers; process/stage map; raw/normalized physical ledger; provider/receiver pins; sampling/calibration; balance and allocation boundaries"
  required_quality_disclosure: "Unknown identities/quantities, steam and background compatibility, source-carbon uncertainty, assay basis, residual balances, excluded operations, coverage and review status"
  update_trigger: "Feed origin/pretreatment, supplier/SKU/assay, process/utility state, waste destination, monitoring coverage, source data identity or allocation change"
