    type: "handbook"
    reference: "[KLK OLEO Personal Care Ingredients, May 2025 URL edition, PDF p. 1 Refined Glycerine table](https://www.klkoleo.com/wp-content/uploads/2025/05/English-KLK-OLEO-Personal-Care-Ingredients.pdf)"
    used_for: "Commercial refined-glycerin product family and CAS; not proof of any current site SKU, process or assay"
  - id: "eu-pef-multifunctionality-2021"
    type: "official_guidance"
    reference: "[Commission Recommendation C(2021) 9332 final, Annex I §4.5, PDF pp. 63–64](https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf)"
    used_for: "General subdivision/system expansion, physical and other justified allocation hierarchy; exclude animal-specific factors and automated credits"
