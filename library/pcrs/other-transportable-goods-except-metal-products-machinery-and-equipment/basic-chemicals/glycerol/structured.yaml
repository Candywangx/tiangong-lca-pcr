    type: "handbook"
    reference: "[CPM Crown Glycerin Refining, July 2024 brochure, pp. 1–2](https://e1.nmcdn.io/assets/cpm/wp-content/uploads/2024/07/Liquids_Processing_Glycerin_Refining_2_pager_July_2024-1.pdf)"
    used_for: "Vacuum crude/foots stills, internal return, steam stripping, condensation, bleaching/filtering and residues; no equipment-specific yield or schedule defaults"
