review_metadata:
  scientific_review: "pending"
  independent_review: "pending_controller_review"
  mapping_decision: "narrower_candidate_only_pending_controller_acceptance"
  semantic_scope:
    decision: "Promote the matching unpublished glycerol scaffold for fat-splitting crude-feed refining only; retain one semantic product identity."
    overlap: "Existing industrial-monocarboxylic-fatty-acids-acid-oils-from-refining explicitly excludes glycerine concentration/refining and outputs aqueous sweet water. This PCR starts after upstream concentration/pretreatment and retains those burdens through a compatible provider. Biodiesel is scaffold/pending in controller queue."
    reference_identity: "32d6a3cd-fb89-4a48-9594-bb240083042e: product glycerol CAS 56-81-5, Mass/kg, no contrary route; declared subset remains actual commercially supplied refined material, not pure-active mass."
    excluded_routes: "Biodiesel/transesterification, soap-lye, synthetic propylene glycerol, ion-exchange-only, residue-reclamation, marketed technical-grade co-products, formulations and retail packaging."
  evidence_limitations:
    - "IFC sector guidance and CWW BAT inventory/monitoring are methodology evidence, not legal-compliance findings or site quantities."
    - "EFISC feed catalogue dry-matter purity wording does not establish a wet-basis chemical purity default."
    - "CPM process diagram establishes feasible unit operations, not universal feed purity, yield, pressure, dose or reprocessing schedule."
    - "KLK catalogue establishes commercial glycerin CAS/product-family identity; actual supplier, SKU, route and acceptance require future foreground evidence."
    - "Raw Tiangong search hits and direct reads establish only bounded physical identity; provider compatibility remains separate."
  provider_review:
    status: "required_for_each_concrete_data_package"
    issues:
      - "Electricity flow is 1–35 kV grid-average consumption; actual geography, losses and provider reference basis must match."
      - "Activated-carbon absorption route label conflicts with adsorption description; actual grade, source carbon, moisture, regeneration and source/provider clarification are pending."
      - "Process-steam UUID is direct stripping/deodorisation Mass/kg, not indirect heating or net heat. Actual pressure, temperature, dryness and supplier background remain required."
      - "Product glycerol broad physical identity is separate from actual assay basis, residual water, feed route and background attribution."
  unresolved_flow_ids:
    - "crude_glycerine"
    - "caustic_solution"
    - "heating_steam"
    - "filter_medium"
    - "returned_condensate"
    - "still_residue"
    - "offsite_effluent"
    - "discarded_glycerine"
    - "spent_filter"
  unresolved_flow_details:
    - row_id: "crude_glycerine"
      selected_flow: "Pretreated concentrated crude glycerine from fat splitting"
      reason: "Receive the whole aqueous crude mixture after upstream sweet-water concentration and pretreatment. Record glycerol, water, salts, soaps, fatty acids, residual glycerides and matter organic non-glycerol separately as analyses, not duplicate exchanges. Pure glycerol does not identify the whole feed. Upstream concentration/pretreatment burdens must accompany this actual starting state."
    - row_id: "caustic_solution"
      selected_flow: "Aqueous sodium hydroxide solution for feed neutralisation"
      reason: "Conditional actual neutralisation or cleaning addition. Weigh the complete supplied solution and measure its NaOH mass fraction and carrier water. No 30%, 50%, pharmaceutical distilled-water route or solid-caustic default is prescribed; none of those restricted records establishes the unspecified actual solution."
    - row_id: "heating_steam"
      selected_flow: "Steam delivered to indirect glycerol-refining heaters"
      reason: "Record actual delivered steam mass, absolute pressure, temperature, phase/dryness and supplier state definition. Fixed 11.0 MPaG or 0.45 MPaG flows cannot establish the unmeasured supply; generic MJ heat cannot establish net delivered heat. Separate this indirectly condensed steam from direct stripping steam."
    - row_id: "filter_medium"
      selected_flow: "Polypropylene liquid-polishing filter medium"
      reason: "Conditional only where the actual polishing bag/filter is confirmed polypropylene. Weigh replacement media excluding housings; retain SKU, polymer and service records. A woven packaging sack is not a liquid filter. Other actual polymers are separate reviewed atomic rows, not silently covered here."
    - row_id: "returned_condensate"
      selected_flow: "Condensate returned to the external steam supplier"
      reason: "Only actual external return from indirect heating; record mass and return enthalpy/state, destination and supplier contract. Internal condensate reuse remains internal. Do not use evaporated-milk water, purchased water or a different steam identity to represent the return, and do not count it as wastewater simultaneously."
    - row_id: "still_residue"
      selected_flow: "Waste heavy residue from glycerol foots distillation"
      reason: "Final discarded residue after actual glycerol recovery; measure wet mass, retained glycerol/water, salts, soaps, fatty material and receiving treatment. Internal foots recycling is excluded. An isobutyl-acetate distillation residue has a contrary composition and is rejected."
    - row_id: "offsite_effluent"
      selected_flow: "Glycerol-refining wastewater exported for treatment"
      reason: "Actual combined exported effluent from condensers, scrubbers, vacuum systems and cleaning, after documented internal recovery. Substreams retain separate measurements and treatment needs even when mixed before export. Measure water, glycerol, fatty substances, salts, pH, temperature, COD/TOC and receiver acceptance. This is a waste transfer, not a freshwater emission or pure-water flow; manganese-slag and silicon-wafer wastewater identities are incompatible."
    - row_id: "discarded_glycerine"
      selected_flow: "Discarded off-specification glycerine mixture"
      reason: "Conditional final discarded off-spec material, measured by lot and actual disposition. Reprocessed off-spec inventory stays inside the aggregated unit and closing stocks are recorded. Selling a technical glycerine co-product is outside this single-product profile and requires a reviewed multi-output extension, not hiding a second known glycerol output."
    - row_id: "spent_filter"
      selected_flow: "Spent polypropylene liquid-polishing filter medium"
      reason: "Conditional exported filter medium from filter_medium, with measured retained glycerol/carbon fines and moisture. Keep it distinct from loose carbon and still residue. Record polymer, receiving facility and disposal/regeneration conditions; packaging waste or unrelated filtration residue does not prove this identity."
  shared_integration:
