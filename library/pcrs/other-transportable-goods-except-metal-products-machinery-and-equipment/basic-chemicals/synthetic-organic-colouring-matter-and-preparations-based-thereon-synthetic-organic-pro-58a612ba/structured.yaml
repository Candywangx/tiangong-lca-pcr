allocation_rules:
  - rule_id: allocation_no_coproduct_default
    applies_to: "foreground_burden_allocation"
    rule: "The declared route has one intended saleable dye. Do not promote residual NaCl, mixed mother liquor or waste to a co-product by assumption. Assign attributable foreground burdens to accepted dye, including rejected batches and waste handling; if an actual independently saleable recovered output exists, retain its concrete output row and apply allocation_physical_ledger."
    source_ids:
      - jrc-ilcd-2010
      - jrc-ofc-2006
  - rule_id: allocation_physical_ledger
    applies_to: "foreground_burden_allocation"
    rule: "Keep unallocated total wet mass, water, organic carbon, Na, N, S and Cl ledgers separate from allocated environmental burdens. For an actual independently saleable recovered output, first investigate measured subdivision or a justified expanded system. Where neither is possible, document a relevant causal physical relationship; if another relationship is necessary, justify it and test sensitivity. Record shares that sum to one on the declared burden basis. Never multiply physical co-product mass by burden shares; output masses and internal endpoints stay measured."
    source_ids:
      - jrc-ilcd-2010
      - jrc-ofc-2006
  - rule_id: allocation_campaigns
    applies_to: "foreground_burden_allocation"
    rule: "Use stage meters and validated run times/loads for shared campaigns. Do not allocate merely by different commercial dye strengths, trade names or an unrelated historical plant mix. Record shutdown/cleaning and losses once."
    source_ids:
      - jrc-ilcd-2010
      - jrc-ofc-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "p_dye"
      flow_role: "out_dye"
      record_type: "foreground_record"
      raw_fields: "lot; SKU; CAS; counterion; net mass Q; returns/reacceptance; opening/closing finished stocks and work in progress; carried inventory burdens; moisture; dye assay/basis and species definition; residual salt; Na/N/S/Cl and organic carbon; acceptance"
      collection_method: "Calibrated net weighing; representative lot samples with traceable analytical method and certificate; exclude packaging and rejected product"
      unit: "kg; mass fraction"
      frequency: "Each batch/load; utility and emission profiles throughout operation"
      temporal_coverage: "One declared complete representative campaign including cleaning, rejects and stock changes; report dates and coverage gaps"
      site_scope: "Declared foreground route and shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; analytical method; source records; uncertainty; reconciliation"
    - protocol_id: cp_material
      process_id: "p_dye"
      flow_role: "reagents; clarifying aid"
      record_type: "foreground_record"
      raw_fields: "chemical; CAS; grade; supplier; stage; gross/tare/net kg; solution assay; carrier water; purity; stock change"
      collection_method: "Weigh each supply and stage charge; reconcile received stock, consumption, returns and internal recovery; test concentrations"
      unit: "kg; mass fraction"
      frequency: "Each batch/load; utility and emission profiles throughout operation"
      temporal_coverage: "One declared complete representative campaign including cleaning, rejects and stock changes; report dates and coverage gaps"
      site_scope: "Declared foreground route and shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; analytical method; source records; uncertainty; reconciliation"
    - protocol_id: cp_water
      process_id: "p_dye"
      flow_role: "in_water; air_water"
      record_type: "foreground_record"
      raw_fields: "stage; water supply kg; ice kg; solution water; wet cake; product moisture; condensate; vent water; stock change"
      collection_method: "Calibrated meters/weighing; measured density for volume conversion; measure condensate and vent humidity/airflow or use a bounded water-balance residual with propagated uncertainty only when all other water inputs, outputs, stocks and reaction formation/consumption terms have independent evidence; never fit unknown reaction water and vent water to the same residual"
      unit: "kg"
      frequency: "Each batch/load; utility and emission profiles throughout operation"
      temporal_coverage: "One declared complete representative campaign including cleaning, rejects and stock changes; report dates and coverage gaps"
      site_scope: "Declared foreground route and shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; analytical method; source records; uncertainty; reconciliation"
    - protocol_id: cp_energy
      process_id: "p_dye"
      flow_role: "in_electricity; in_steam"
      record_type: "foreground_record"
      raw_fields: "stage; meter kWh; steam kg; absolute pressure; temperature; dryness; inlet enthalpy; condensate mass/enthalpy; indirect-heating circuit; cooling diagram and make-up/purge/leak/additive records; supply geography; supplier baseline"
      collection_method: "Stage-meter full runs and cleaning; calculate net steam heat from measured mass/enthalpy; disclose missing return or supply reference and do not link incompatible backgrounds"
      unit: "kWh; MJ; kg"
      frequency: "Each batch/load; utility and emission profiles throughout operation"
      temporal_coverage: "One declared complete representative campaign including cleaning, rejects and stock changes; report dates and coverage gaps"
      site_scope: "Declared foreground route and shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; analytical method; source records; uncertainty; reconciliation"
    - protocol_id: cp_pack
      process_id: "p_dye"
      flow_role: "in_pe; in_sack"
      record_type: "foreground_record"
      raw_fields: "component; supplier; polymer/paper grade; thickness; tare mass; units; rejects; lot"
      collection_method: "Weigh actual separate components and reconcile package count, losses and supplier specification"
      unit: "kg"
      frequency: "Each batch/load; utility and emission profiles throughout operation"
      temporal_coverage: "One declared complete representative campaign including cleaning, rejects and stock changes; report dates and coverage gaps"
      site_scope: "Declared foreground route and shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; analytical method; source records; uncertainty; reconciliation"
    - protocol_id: cp_waste
      process_id: "p_dye"
      flow_role: "w_mother; w_wash; w_scrub; w_carbon; w_reject; w_dust"
      record_type: "foreground_record"
      raw_fields: "stream; stage; transfer kg; measured density; water/dry solids; AO7; sulfanilic acid; 2-naphthol; chloride; sodium; nitrite; total N; total S and sulphate; COD and TOC with analytical bases; pH; receiver; treatment; recovery"
      collection_method: "Meter/weigh segregated transfers and sample each stream/load; reconcile mother/wash/scrubber mixing. Retain waste manifests and receiver acceptance. Extend analysis for observed contaminants, toxicity and treatment inhibition"
      unit: "kg; mg/L; mass fraction"
      frequency: "Each batch/load; utility and emission profiles throughout operation"
      temporal_coverage: "One declared complete representative campaign including cleaning, rejects and stock changes; report dates and coverage gaps"
      site_scope: "Declared foreground route and shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; analytical method; source records; uncertainty; reconciliation"
    - protocol_id: cp_air
      process_id: "p_dye"
      flow_role: "air_hcl; air_no; air_no2; air_pm25; air_pm10; air_pmover10"
      record_type: "foreground_record"
      raw_fields: "source/stage; operating cycle; species; molecular basis; concentration; dry/wet reference; T/P; exhaust volume/time; abatement; fugitive estimate; diameter fractions; uncertainty; detection limit"
      collection_method: "Sample full charging/reaction/drying/finishing/packing cycles and cleaning, including bypasses. Use species-resolved validated sampling; compute exhaust load from matched concentration and gas volume; source screening determines conditional NO/NO2 presence"
      unit: "kg; mg/m3; m3"
      frequency: "Each batch/load; utility and emission profiles throughout operation"
      temporal_coverage: "One declared complete representative campaign including cleaning, rejects and stock changes; report dates and coverage gaps"
      site_scope: "Declared foreground route and shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; analytical method; source records; uncertainty; reconciliation"
  calculation_rules:
    - id: campaign_denominator
      applies_to: "all inventory rows"
      rule: "x = raw campaign exchange total / Q; Q is the same positive accepted supplied net powder kg measured by cp_product. Sum raw amounts over the complete compatible route/state/grade campaign, including failed or zero-output batches, cleaning and rework, then divide once; do not average batch ratios or renormalize per-kg values. Reconcile returns, reacceptance, finished stocks and work in progress with their carried burdens so Q is credited once and the attributed burden numerator covers the same output. Internal rework is not new accepted output. If Q is zero, retain the totals and disclose no unit result rather than divide or omit burdens. Keep numerator units. Product output is 1 kg."
      inputs:
        - cp_product
        - "applicable row protocol"
      output: "x"
      source_ids:
        - jrc-ofc-2006
    - id: composition_ledger
      applies_to: "all chemical product inputs and out_dye"
      rule: "Active mass = supplied mass × measured as-supplied active mass fraction; carrier water and residual salt are separate balance components, not duplicate technosphere inputs. Convert dry assay only with matched moisture measurement. Assay reporting as free acid, sodium salt, dry solids or colour strength must be identified; only a validated analytical species conversion can yield sodium-dye mass. The salt species includes its bound Na and S; residual NaCl contains additional Na and Cl. Do not assign the entire unassayed remainder to NaCl or water."
      inputs:
        - cp_material
        - cp_product
      output: "active mass; water; residual salt"
      source_ids:
        - thermo-orangeii-spec
    - id: physical_balances
      applies_to: "p_dye"
      rule: "For total wet mass and conserved elements: unallocated external inputs + opening stocks = external products + transferred wastes + actual releases + closing stocks + disclosed residual. Record total wet mass, Na, N, S, Cl and organic carbon separately. Include reagent and dye-bound Na, sulfanilic/dye S, nitrite and organic N, purchased salt and acid Cl. Organic-carbon changes require species transformation and any transfer to inorganic carbon; COD is an oxygen-demand indicator, not carbon mass. For water or dye species add internal reaction formation and subtract consumption on the relevant ledger: water from diazotisation/neutralisation and dye formation are not extra purchased flows. Internal NaCl formation is not purchased salting salt. Preserve chemical-species and elemental bases, density, uncertainty and stock changes; no assumed yield or fixed reaction-water quantity. Reconcile same-stream internal endpoints and the utility steam/condensate loop separately."
      inputs:
        - cp_material
        - cp_product
        - cp_water
        - cp_waste
        - cp_air
      output: "balance residual and uncertainty"
      source_ids:
        - jrc-ofc-2006
    - id: delivered_steam_heat
      applies_to: "in_steam"
      rule: "Net delivered heat = sum(inlet steam mass × inlet specific enthalpy) − sum(return condensate mass × return specific enthalpy), with a declared common enthalpy reference and supplier return convention. Keep mass and heat records separately."
      inputs:
        - cp_energy
      output: "MJ and steam kg, separately"
      source_ids:
        - jrc-ofc-2006
    - id: air_loads
      applies_to: "elementary air outputs"
      rule: "Integrate matched species concentration × exhaust volume across each operating cycle, plus supported fugitives. For nonoverlapping PM fractions subtract cumulative masses only on identical source, time, moisture and sampling bases."
      inputs:
        - cp_air
      output: "kg per species or exclusive PM class"
      source_ids:
        - jrc-ofc-2006
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all flows"
      requirement: "Verify full identity metadata, CAS, route, medium, property and unit; investigate contradictions. UUID confirmation and provider-baseline compatibility are separate checks."
      evidence: "supplier specification; native identity records"
    - id: quality_amount
      applies_to: "all quantities"
      requirement: "Use traceable actual measurements, assay, water balance and energy meters; disclose detection limits, missing stages and unclosed balances. No transplanted patent/site numbers."
      evidence: "cp_product; cp_material; cp_water; cp_energy; cp_waste; cp_air"
    - id: quality_completeness
      applies_to: "p_dye"
      requirement: "Screen actual additives, packaging, cleaning agents, direct releases and accidental/bypass conditions; add specific atomic rows with verified identity before claiming a complete dataset. Neither a missing measurement nor missing UUID means zero."
      evidence: "jrc-ofc-2006"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one product output is out_dye, with the stated 1 kg net supplied powder basis. Require verified reference UUID/property/unit group and declared sodium counterion, route and lot assay; a free-acid/amine-salt record cannot be substituted."
    source_ids:
      - thermo-orangeii-spec
      - basf-us4560745-1985
  - rule_id: validate_amounts
    applies_to: "foreground_dataset_conformance"
    rule: "Reference, all row denominators, collection aggregation and calculations use identical accepted net powder Q in both languages. Assess measured yield, active fraction, salts, water and net steam heat without invented values."
    source_ids:
      - jrc-ofc-2006
  - rule_id: validate_releases
    applies_to: "foreground_dataset_conformance"
    rule: "Prevent duplicate transferred wastewater versus direct water release, captured dust versus airborne PM, and nested PM intervals. Molecular NO/NO2 and NO2-equivalent totals are distinct; never infer N2O from NOx. Preserve any actual biogenic CO2 if an expanded route generates it, independently of climate-reporting conventions."
    source_ids:
      - jrc-ofc-2006
  - rule_id: validate_ledgers
    applies_to: "foreground_dataset_conformance"
    rule: "Require independent unallocated total-wet, water, organic-carbon, Na, N, S and Cl reconciliation, with reaction formation/consumption for species and measured external endpoints. Keep allocation shares outside these physical ledgers. Missing chemistry or an unbounded water-balance residual requires review, not a zero or stoichiometric default."
    source_ids:
      - jrc-ofc-2006
      - thermo-orangeii-spec
  - rule_id: validate_readiness
    applies_to: "foreground_dataset_conformance"
    rule: "Missing identities, contradictory metadata, incompatible provider bases and unresolved measurement prevent a complete dataset. Scientific review and mapping acceptance remain separate from completed methodology authoring."
    source_ids:
      - thermo-orangeii-spec
      - jrc-ofc-2006
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only after identity and quantity verification: declared sodium-powder route at stated dye strength and gate"
  excluded_use: "Full CPC leaf coverage; equivalence between hues/strengths; other salts, fluid formulations, lakes and purchase-only formulation"
  required_metadata: "Site; campaign; lot/SKU; CAS/counterion; supplied assay/moisture/salts; route; utilities; receiver; reference identity"
  required_quality_disclosure: "UUID and background compatibility status; source/measurement coverage; balance residual; allocation; uncertainty; missing exchanges; candidate status"
  update_trigger: "Route, counterion, strength/formulation, recovery, utility baseline, receiver or emission change"
data_sources:
  - id: "jrc-ofc-2006"
    type: "official_guidance"
    reference: "[JRC OFC BREF, August 2006](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/ofc_bref_0806.pdf)"
    used_for: "Sections 2.5.4 (printed 43–44/PDF 73–74), 4.3.2.4 (198/PDF 228), 5.2.1 (380–381/PDF 410–411): route archetype, distinct waste streams and operation-sensitive measurement. Historical examples and BAT levels are not inventory defaults."
  - id: "basf-us4560745-1985"
    type: "literature"
    reference: "[BASF US4560745A, 1985, original patent](https://patentimages.storage.googleapis.com/0b/5f/8f/4afae7653438da/US4560745.pdf)"
    used_for: "Example 2, column 4/PDF 3: sulfanilic-acid/2-naphthol coupling. Subsequent diethanolamine-salt extraction is excluded; no case recipe or recovery transferred."
  - id: "thermo-orangeii-spec"
    type: "handbook"
    reference: "[Thermo Scientific Orange II product specification, catalog 416561000](https://assets.thermofisher.com/chem-specs-pdf/retrievePdf?countryCode=cn&erp_type=CN_E1_LCD&rootSku=41656&sku=416561000)"
    used_for: "Original PDF page 1 printed 14 October 2026: CAS 633-96-5, sodium identity, powder market state and SKU-specific dye-content test. No universal composition or route inferred."
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "[UNSD CPC 3.0 explanatory notes, 30 June 2025](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "Printed/PDF page 162, subclass 34310: broad classification context only. Supports narrower proposal, not method identity or recipe."
  - id: "bcho-orangeii-2015"
    type: "official_guidance"
    reference: "[23rd Baltic Chemistry Olympiad practical examination, April 2015](https://www.eko.ut.ee/pdf/bcho/bcho2015e.en.pdf)"
    used_for: "Problem 2, PDF/printed pages 9–12: actual sulfanilic acid/NaNO2/HCl/NaOH/2-naphthol synthesis, NaCl salt-out, filtration, water washing and drying. Laboratory method evidence only; no industrial recipe, yield, cooling configuration or heat factor transferred."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "[JRC ILCD Handbook, General guide for LCA, detailed guidance, 2010](https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf)"
    used_for: "Section 6.5.3.2, printed 74–80/PDF 94–100: subdivision, justified system expansion and causal physical allocation before other relationships. Method reference only; no fixed dye allocation share or compliance claim."
