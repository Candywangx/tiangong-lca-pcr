  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  boundary_decision: "One monoammonium glyphosate SG acquired-ingredient wet-extrusion/fluid-bed-drying/screening method, bounded by EP0582561A1 Example 1. Promote this retained unpublished scaffold in place; not the whole CPC leaf. Distinct from the in-progress 600 g/L imidacloprid aqueous SC shear/sand-mill method (34661) and 70% mancozeb WP dry-blending/jet-milling draft (34662) by active, salt, physical state and route; neither is reused as this method."
  reference_identity_decision: "Verified query hit plus complete state-100 exact direct read of Product flow 80d8c492-83e7-4ba8-9cf5-0dbac200513b Pesticide / 农药. It permits weed-control substances/mixtures and has no fixed CAS, grade, form, route, mix or supply geography. PCR qualifiers bind one actual SG; broad identity is not an aggregate or provider. All properties: Mass only, reference ID 0, factor 1; exact Mass to unit-group chain gives kg. Native 35499 classification is disclosed debt requiring source stewardship."
  rejected_identity_decision: "Glyphosate acid a61e5da7-6e39-47e9-afe4-12f6e46f7c51 carries CAS 1071-83-6 and chemical-reaction route, incompatible with dry monoammonium salt input and supplied formulated SG. Other queried Glyphosate records lack salt/formulation qualifiers, so are not adopted as that exact input/output. Herbicide c1370404-9e2b-4ed6-ba96-c094f74e0f2d has to-consumer delivery beyond the selected gate; regional-storehouse, aggregate and fixed high-active alternatives are not selected."
  unresolved_inventory_uuids:
    - "dry_salt, surfactant and peg8000: match actual whole supplied monoammonium salt, Ethomeen T/25 and PEG 8000 grades; acid or upstream monomer hits are not substitutes."
    - "Remaining individually named utilities, internal transfers, packaging, wastes and medium-specific releases require exact dataset-time identity/provider matching; no plural proxy or invented UUID."
  data_production_pending:
    - "Actual site/country/SKU, complete commercial supply composition, release tests, positive unique accepted output, full raw-period inputs/failures/returns/rework/WIP and carried burdens are collected at data production, not fabricated here."
    - "Dryer energy carrier is not specified by the patent. The conditional external heat-service row is not an assertion of steam/fuel use; actual steam, fuel, condensate or additional species require explicit atomic extension and evidence before dataset use."
    - "Aerosol mixture needs actual composition and medium-specific resolution for chemical characterization; native reference classification debt remains open."
  source_limitations: "Patent Example 1 is laboratory evidence without recovered final mass or industrial intensity. FAO 2014 SG context has manufacturer/evaluation and current-version limitations and does not approve this recipe. Classification sources do not accept a mapping."
  scientific_review: "pending root independent scientific review; authored status is not approval"
  mapping_review: "pending root composition and semantic acceptance; no mapping, index, alias or ADR edited"
  publication_review: "pending root; no publication performed"
