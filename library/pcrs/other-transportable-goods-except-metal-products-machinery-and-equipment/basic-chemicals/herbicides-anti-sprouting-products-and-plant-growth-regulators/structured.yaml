allocation_rules:
  - rule_id: a_primary
    applies_to: "the selected SG"
    rule: "No saleable co-product is established by the selected sources. Retain full matched burdens of failures, waste and rework with the accepted SG cohort. Internal recycle is neither co-product nor an avoided-product credit."
    source_ids: []
  - rule_id: a_shared
    applies_to: "shared services or actual co-products"
    rule: "Separate physical submetering first. If shared services remain, document an actual causal allocation basis and reconcile all shares to the original total. A real saleable co-product requires explicit identity, quantity, allocation method and sensitivity review; do not assume mass/economic shares or delete it."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_blend
      process_id: "p_blend"
      flow_role: "ingredients, electricity and wet-blend transfer"
      record_type: "batch_ledger"
      raw_fields: "batch and transfer IDs; owner; whole supplied masses; assay/counterion; water/carrier fractions; scale tare; electricity meter start/end; rate or integrated-volume flag; temperature; opening/closing WIP quantity and carried burdens; failed runs; internal returns"
      collection_method: "Owner: blending operator with site metering lead. Calibrated scales and submeters, supplied-product certificates and batch/transfer reconciliation; independently assay relevant composition. Aggregation and burden assignment: Retain raw totals and all internal transfer IDs; assign opening burdens and closing carry-forward to the matched accepted cohort; send raw numerator components to calc_period before one normalization."
      unit: "kg; kWh; original meter units"
      frequency: "Every batch and meter interval"
      temporal_coverage: "Same complete reporting period including startup, failure, cleaning and closure"
      site_scope: "One actual formulation line and its assigned shared auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale and meter calibration; full supplier composition; timestamped batch failures and WIP/burden ledger"
    - protocol_id: cp_granulate
      process_id: "p_granulate"
      flow_role: "extrusion, dryer, screen, rejects and releases"
      record_type: "unit_operation_ledger"
      raw_fields: "wet_blend transfer ID and mass; moisture/salt assays; dry screened output; fines/oversize/recycle IDs; electricity; delivered heat and return state; water exhaust/condensate; dust capture and emitted species; zero-output operation; opening/closing WIP and inherited burdens"
      collection_method: "Owner: granulation/dryer operator and environmental measurement lead. Independently weigh transfers/rejects, meter each energy carrier and measure moisture and actual outlet composition/medium with uncertainty. Aggregation and burden assignment: Pair internal transfers without procurement duplication; retain full failure burdens and inventory changes. Keep mass, elements, actual species and water ledgers separate; forward raw assigned burdens once to calc_period."
      unit: "kg; kWh; MJ; original gas/liquid units"
      frequency: "Every batch, recycle and meter/emission interval"
      temporal_coverage: "Complete matched period including failed/zero-output and reprocessed campaigns"
      site_scope: "One actual extrusion/dryer/screen train and assigned controls"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Moisture/assay methods and uncertainties; exhaust/condensate measurements; heat meters; recycle and waste custody records"
    - protocol_id: cp_finish
      process_id: "p_finish"
      flow_role: "screened transfers, packaging, cleaning and rejects"
      record_type: "finishing_ledger"
      raw_fields: "screened_sg transfer ID; supplier/SKU/package BOM; net/gross/tare; measured component masses; electricity; cleaning-water and whole-effluent quantity/composition; release failures; returned sold material; rework routing; stock and carried burdens"
      collection_method: "Owner: filling supervisor with environmental lead. Weigh actual supplied components and rejected product, submeter electricity/water and sample effluent. Reconcile transfer and external-return identities. Aggregation and burden assignment: Retain all raw inputs/burdens, unreleased output and returned-product inherited burdens. Count packaging outside net Q; transfer assigned burdens to calc_period without a second product normalization."
      unit: "kg; kWh; count with measured tare"
      frequency: "Every lot and every cleaning or return event"
      temporal_coverage: "Complete matched manufacturing/acceptance period and stock reconciliation"
      site_scope: "One finishing line and assigned site services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Package BOM and tare samples; calibrated scales/meters; waste manifests; returns/rework and stock/burden audit"
    - protocol_id: cp_acceptance
      process_id: "p_finish"
      flow_role: "unique terminal accepted output Q and quality"
      record_type: "acceptance_ledger"
      raw_fields: "unique acceptance ID; product/SKU/salt/form/route; gross/tare/net mass; moisture; acid-equivalent and salt assay basis; relevant impurity/quality tests; batch lineage; dispatch and opening/closing accepted stock; returns; repeated release flags"
      collection_method: "Owner: independent site quality-release officer with stock accountant. Calibrated net weighing and actual release specification tests, reconciled to dispatch and stock; do not infer acceptance from screen passage or sales invoice alone. Aggregation and burden assignment: Q is unique newly accepted net supplied output; exclude repeated acceptance, internal recycle and resale of previously accepted returns. Reconcile opening accepted stock + new acceptance + external returns - dispatch - closing stock - treatment/transfers = 0 with signed movements. For a reworked return, retain its prior burdens and credit history; count only genuinely new accepted mass once. Q must be positive for normalization; Q=0 retains raw burdens for later assignment."
      unit: "kg net supplied product; g/kg assay"
      frequency: "Every acceptance and reversal event"
      temporal_coverage: "Same matched period and documented cross-period cohort lineage"
      site_scope: "Same actual SG product, route, salt and supplied state at one site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Release officer sign-off; full qualifier/test records; unique ID and dispatch/stock/return reconciliation"
  calculation_rules:
    - id: calc_period
      applies_to: "all raw-period inventory numerators"
      rule: "For each exchange retain raw measured quantities, convert units, then assign R to the accepted cohort by batch/transfer lineage: include opening WIP and returned-material inherited burdens, current inputs and all failed/zero-output/rework burdens; carry closing WIP/unreleased burdens forward explicitly. Reconcile period totals = assigned-to-Q + closing-carried burdens + separately justified destinations. Negative corrections require linked original IDs. Do not discard failed runs or count internal recycle twice. Then q = R / Q exactly once for positive Q from cp_acceptance; Q=0 prohibits normalized output and retains the raw ledger."
      inputs:
        - cp_blend
        - cp_granulate
        - cp_finish
        - cp_acceptance
      output: "per 1 kg reference flow quantities and explicit carried-burden ledger"
      source_ids: []
    - id: calc_mass
      applies_to: "ingredients, intermediate transfers, granules and all outlets"
      rule: "At raw-period level reconcile physical mass and independently assayed glyphosate acid-equivalent, ammonium/counterion and relevant elemental ledgers across supplied inputs, product, waste, releases and WIP. Whole purchased formulations include their carrier/water once; component subledgers are not additional procurement. Match internal transfer pairs and prevent duplicate upstream burden. Do not combine kg acid-equivalent with kg salt as if identical."
      inputs:
        - cp_blend
        - cp_granulate
        - cp_finish
        - cp_acceptance
      output: "separate mass/active/counterion/element closure and uncertainty"
      source_ids: []
    - id: calc_water
      applies_to: "physical water and actual species"
      rule: "Measure supplied free/structural water, added water, remaining product/WIP water, effluent, condensate and vapour independently where applicable. This bounded route is formulation and evaporation, not glyphosate synthesis or neutralisation; no reaction water is presumed. Any actual chemical transformation requires independently supported species/extent and reaction-water evidence and scope reassessment. Do not fit unknown vapour and unknown waste to one closure residual or use COD as a species balance."
      inputs:
        - cp_blend
        - cp_granulate
        - cp_finish
      output: "independent physical-water and species account, not a fitted emission factor"
      source_ids: []
    - id: calc_units
      applies_to: "meters, packaging and assay conversions"
      rule: "Integrate actual rate over its measured interval once; keep integrated volumes unchanged before density conversion. Net package content = gross - measured tare. Component count × measured representative component mass may determine packaging mass with uncertainty. Acid-equivalent or salt mass = assayed fraction on its explicitly stated wet/dry basis × corresponding measured physical mass; use independently documented salt identity/speciation for any molar conversion. No nominal patent ratio, efficacy dose or density inferred from a concentration label is a conversion basis."
      inputs:
        - cp_blend
        - cp_granulate
        - cp_finish
        - cp_acceptance
      output: "converted raw quantities before one normalization"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "all exchanges and providers"
      requirement: "Qualify the exact active/salt/form/route and whole supplied grade; query/direct-read identity is not provider compatibility. Preserve all native name, CAS, comment, geography, medium and property restrictions. Blank auxiliary UUIDs require matching at dataset production, not fabricated identities."
      evidence: "Supplier certificates, full composition, native direct records and actual provider scope"
    - id: q_complete
      applies_to: "period and cohort"
      requirement: "Retain measured raw numerators, unique positive accepted denominator, failures, returns, rework and opening/closing WIP with carried burdens. Report omissions, detection limits and uncertainty; do not set unknown emissions or inactive rows to zero without evidence."
      evidence: "Signed ledgers, calibrated measurements and mass/species/water reconciliations"
    - id: q_release
      applies_to: "accepted SG"
      requirement: "Use actual registered/supplier release criteria and methods for assay, dissolution, dustiness, flowability, relevant impurities, moisture and storage quality. FAO 2014 context carries manufacturer/version limits and is not certification of this recipe."
      evidence: "Actual quality specification, methods, test results and acceptance officer record"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference and terminal product"
    rule: "finished_sg is the unique selected terminal Product output and has the declared reference UUID, 1 kg net supplied basis and all qualifiers. Internal wet_blend and screened_sg transfers cannot be silently renamed as final output."
    source_ids: []
  - rule_id: v_period
    applies_to: "inventory and calculation"
    rule: "Require all three process-owner protocols plus cp_acceptance, complete raw-period/burden and WIP/return/rework ledgers, positive unique Q and one normalization. With Q=0 or unresolved cohort assignment, retain raw records and do not report a normalized production dataset."
    source_ids: []
  - rule_id: v_balance
    applies_to: "physical and chemical accounting"
    rule: "Check complete supplied-input mass, independent active/counterion/element and physical-water accounts, internal-transfer pairing, energy units and real outlet destinations. No COD/residual-fitted reaction water, duplicate component procurement, missing failures or invented emission fractions. Add each actual unlisted material, packaging component, pollutant species or utility as an atomic row with its process owner and evidence before dataset use."
    source_ids: []
  - rule_id: v_source
    applies_to: "evidence and applicability"
    rule: "Keep patent-laboratory and FAO manufacturer/version limits and native generic classification debt visible. A future site/SKU/provider match, product registration, scientific review or CPC acceptance is not established by this methodology or by format validation."
    source_ids:
      - monsanto-glyphosate-sg-1994
      - fao-glyphosate-sg-2014
      - unsd-cpc3-2025
      - wco-hs38-2022
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supplier-specific upstream SG formulation for a separately modelled agricultural or other authorized use"
  allowed_use: "Only the qualified monoammonium glyphosate soluble-granule route and supplied state, with complete data-production evidence"
  excluded_use: "No universal herbicide mix, active synthesis, other salts/forms/routes, efficacy comparison, dose conversion, field release or automatic supplier/geographic proxy"
  required_metadata: "All reference qualifiers; actual provider/location/technology; raw period and stock/cohort lineage; complete packaging and ingredient composition; heat architecture; allocation; evidence and methods"
  required_quality_disclosure: "Measurement and representativeness uncertainty; missing auxiliary UUID/provider matches; emission/species resolution; source edition/manufacturer limits; native generic 35499 classification debt; no implied approval"
  update_trigger: "Change of active, salt, form, supplier grade/formulant, route, utility, packaging, site, release specification, source edition or material evidence"
