functional_unit:
  what: "Manufacture and supply of the declared monoammonium glyphosate SG"
  how_much: "1 kg net accepted supplied granules"
  how_well: "Actual release specification for active/counterion identity, acid-equivalent and salt assay, moisture, dissolution, dustiness, flowability, relevant impurities and storage quality; no efficacy equivalence claim"
