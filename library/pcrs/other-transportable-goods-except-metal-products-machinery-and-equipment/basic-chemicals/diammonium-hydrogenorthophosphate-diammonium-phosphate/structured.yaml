allocation_rules:
  - rule_id: physical_and_burden_ledgers
    applies_to: "foreground_burden_allocation"
    rule: "Keep the unallocated physical ledger (fresh feeds, recycled loops, products, wastes, emissions and stocks) separate from environmental burden attribution. Every internal link has equal donor/recipient quantity on the same state basis. Allocation never reduces real product or waste mass."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_hierarchy
    applies_to: "foreground_burden_allocation"
    rule: "For attributional data, subdivide campaigns/shared operations first. Where impossible, document causal physical attribution and any justified alternative with sensitivity; no default nutrient, mass or economic allocation fraction. Recycle is not a co-product credit. A saleable second grade/exported nutrient stream requires measured output and a distinct classification/destination assessment before attribution."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "dap_unit"
      flow_role: "accepted net fertilizer"
      record_type: "calibrated scales; dispatch; stocks; assay"
      raw_fields: "lot; period; final accepted quantity Q; start/stop; failed and zero-output lots; rework; WIP; opening/closing stocks; net/gross/tare masses; moisture; total N/P/S/F; nutrient tests; off-grade quantities"
      collection_method: "Use calibrated final-acceptance weighing to count each product quantity once; independently reconcile dispatch and finished stocks, purchased product and WIP. Retain all period totals including failed/zero-output lots and rework; sample the same lots and separate assay bases. Aggregation detail: Q kg at final acceptance counted once; divide complete period records by positive Q once per 1 kg reference flow; Q=0 retains totals with no normalised result."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "one representative production period"
      site_scope: "DAP unit including finishing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; stock reconciliation; analytical methods and uncertainty"
    - protocol_id: cp_feed
      process_id: "dap_unit"
      flow_role: "fresh feed and coating"
      record_type: "meter/weighing and supplier assay"
      raw_fields: "row_id; amount; purity; concentration; wet/dry state; liquor water; total N/P/S/F/C; acid origin; coating formulation and full supplied preparation wet mass; component and carrier-water fractions; supplier quantity basis; stocks"
      collection_method: "Use calibrated flow meters or weighed receipts with density/state corrections and stock reconciliation; keep whole solution and component ledgers. Aggregation detail: external consumed mass / accepted net product mass, per 1 kg reference flow."
      unit: "kg"
      frequency: "each lot or continuous integration"
      temporal_coverage: "same period as cp_product"
      site_scope: "unit external inputs; internal loops separately"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specification and reference-quantity definition; lab tests; calibration"
    - protocol_id: cp_utilities
      process_id: "dap_unit"
      flow_role: "electricity, gas and steam measured separately"
      record_type: "submeter and enthalpy records"
      raw_fields: "row_id; substage; meter readings; kWh; gas m3; pressure; temperature; dry/wet; composition; compressibility; steam kg; inlet/condensate states; provider basis"
      collection_method: "Read calibrated meters; derive only documented corrections and measured steam enthalpy differences. Subdivide shared supply using auditable measurements; retain its attribution ledger. Aggregation detail: each attributable native quantity / accepted net product mass, per 1 kg reference flow."
      unit: "MJ; m3; kg separately"
      frequency: "continuous integration"
      temporal_coverage: "same period as cp_product"
      site_scope: "reaction, finishing, controls and attributable utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; actual supply voltage; gas supplier definition; steam tables and states; no assumed efficiencies"
    - protocol_id: cp_packaging
      process_id: "dap_unit"
      flow_role: "actual packaging components"
      record_type: "tared component weighing and use count"
      raw_fields: "row_id; SKU; polymer; capacity; mass per piece; consumed count; damaged/rejected packaging; reuse cycles if any"
      collection_method: "Weigh actual empty components; reconcile material use and counts. Keep physical number/mass separate from any justified service-cycle burden. Aggregation detail: consumed component mass / accepted net fertilizer mass, per 1 kg reference flow."
      unit: "kg"
      frequency: "each SKU and campaign"
      temporal_coverage: "same period as cp_product"
      site_scope: "actual delivery configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; bill of materials; supplier evidence; no assumed bag mass or life"
    - protocol_id: cp_waste
      process_id: "dap_unit"
      flow_role: "external purge, sludge and discarded DAP separately"
      record_type: "weighing, assays and transfer records"
      raw_fields: "row_id; wet mass; water; dry solids; total N/P/S/F/C; receiver; treatment; internal return; stock changes"
      collection_method: "Measure each actual stream crossing the unit boundary; reconcile linked treatment and receiving records; distinguish direct environmental release from waste transfer. Aggregation detail: external wet mass / accepted net product mass, per 1 kg reference flow."
      unit: "kg"
      frequency: "each removal or continuous purge"
      temporal_coverage: "same period as cp_product"
      site_scope: "unit outlet and named receiver interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge tickets; samples; receiver acceptance; residual nutrient and water balance"
    - protocol_id: cp_air
      process_id: "dap_unit"
      flow_role: "each species/particle interval separately"
      record_type: "stack/fugitive measurements and documented equipment model"
      raw_fields: "row_id; source; CAS/species; origin; interval; C; gas volume; time; T/P; wet/dry; reference O2; capture; recovery; F/N/NOx basis; detection limit; uncertainty; inlet air humidity"
      collection_method: "Integrate compatible concentration and actual normalized gas volume; correct matching wet/dry and reference O2 conventions. Include captured-stack and fugitive releases after controls. Retain unmeasured channels as pending, not zero. For combustion, use only a documented applicable equipment model when measurements cannot establish the channel. Aggregation detail: each emitted species mass / accepted net product mass, per 1 kg reference flow."
      unit: "kg"
      frequency: "representative operating modes including start/stop"
      temporal_coverage: "same period as cp_product"
      site_scope: "reaction, dryer, cooling, screening, transfers, storage and actual combustion"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring method and calibration; gas-flow integration; operating coverage; species and PM reconciliation"
  calculation_rules:
    - id: normalise_period
      applies_to: "all inventory rows"
      rule: "For every actual external exchange retain the complete same-product/state/route period total, including start/stop, failed or zero-output lots and rework, with WIP changes disclosed. Divide its attributable total by the same positive accepted net DAP Q kg from cp_product once. Keep unallocated physical totals and burden shares separately. Q=0 has no normalised result. Reference output is 1 kg. Keep original totals for the complete same-product, same-state and same-route reporting period, including start-up, shutdown, failed or zero-output lots, rework, rejects and work in progress (WIP). Define Q as accepted net DAP crossing the final acceptance plane once in that period. Reconcile Q against dispatch, finished-product stock changes and separately identified purchased product; do not add stock adjustments to an already counted acceptance quantity. Track WIP changes and their carried physical quantities and burdens explicitly. Divide each period exchange total by positive Q once, after any justified burden attribution; never average only successful batches or normalise an already normalised record. When Q is zero, retain the complete physical and burden pools and mark the normalised dataset unavailable. No invented divisor or zero inventory is permitted."
      inputs:
        - cp_product
        - cp_feed
        - cp_utilities
        - cp_packaging
        - cp_waste
        - cp_air
      output: "native-unit amount per 1 kg reference flow"
      source_ids:
        - ilcd-attributional-2010
    - id: material_reconciliation
      applies_to: "dap_unit"
      rule: "For water and each element N/P/S/F/C, inputs minus external outputs minus stock increase equals the explicitly explained residual. Internal recycle cancels across the complete unit, but donor/recipient substage logs remain equal. Total P uses total-P assay, not available phosphate. Account for fuel carbon, combustion water and inlet-air moisture separately. Do not close the ledger by changing yield or deleting emissions."
      inputs:
        - cp_feed
        - cp_product
        - cp_utilities
        - cp_waste
        - cp_air
      output: "physical residual and uncertainty per period, before allocation"
      source_ids:
        - eu-lvic-aaf-2007
    - id: speciation_reconciliation
      applies_to: "all elementary outputs"
      rule: "Use species mass fractions from documented molecular masses and actual speciation to reconcile F, NH3-N and NOx equivalents. For concentration C in kg/m3 and an already integrated compatible volume V in m3, emitted mass is the sum of C times V, with no extra duration multiplier. Only a volume flow rate in m3/time is integrated with time. Match concentration and flow measurement conditions; total PM equals the disjoint intervals only when sampling bases and condensable coverage agree. Unsupported splits remain pending."
      inputs:
        - cp_air
      output: "verified emitted species kg and unresolved channels"
      source_ids:
        - epa-ammonium-phosphate-1993
        - epa-gas-combustion
  data_quality_requirements:
    - id: identity_and_provider
      applies_to: "all inventory rows"
      requirement: "Check names, CAS, comments, route, medium, reference property and supplier quantity definition together. An identity UUID does not establish provider geography, technology or concentration compatibility. Missing ordinary auxiliary/waste identity is disclosed; reference-product uncertainty blocks a usable method."
      evidence: "cp_feed; cp_product; cp_utilities"
    - id: coverage_and_uncertainty
      applies_to: "dap_unit"
      requirement: "Retain complete period coverage and atypical operating modes. Explain detection limits, missing speciation, stock differences and allocation uncertainty; no universal recipe or process-amount default is supplied. Historical EPA controlled-plant factors and BREF cases are not transferable site values."
      evidence: "cp_air; cp_product; cp_waste"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require one accepted DAP net-product reference, all qualifiers, compatible native property and a verified physically compatible product identity with disclosed metadata debts before accepting a data package. High-purity crystals or diluted reagent records do not establish fertilizer-grade product identity."
    source_ids:
      - mosaic-dap-spec-2024
      - mosaic-dap-sds-2020
  - rule_id: validate_physical_ledgers
    applies_to: "foreground_dataset_conformance"
    rule: "Check unallocated water and elemental balances, recycle equality, each external waste/product destination, all identified air channels and separate burden allocation. No double counting of captured dust, scrubber recirculation, nested PM, N/P equivalents or internally supplied heat."
    source_ids:
      - eu-lvic-aaf-2007
      - ilcd-attributional-2010
  - rule_id: validate_pending
    applies_to: "foreground_dataset_conformance"
    rule: "Do not translate unavailable measurement, unsupported speciation, unverified provider basis or infrastructure failure into zero exchange or a successful check. A concrete dataset requires resolved applicable measurement and reference identity gaps."
    source_ids:
      - epa-ammonium-phosphate-1993
published_dataset_profile:
  dataset_role: "foreground production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "DAP supply modelling after applicability, identity and foreground-data acceptance"
  excluded_use: "Agronomic yield equivalence; fertilizer application emissions; reagent-purity DAP; MAP/NPK or nitrophosphate substitution"
  required_metadata: "All reference qualifiers, boundary, unit, period, actual suppliers, packaging, treatment receivers and allocation rationale"
  required_quality_disclosure: "Reference/provider gaps; native metadata defects; mass/element residuals; monitoring coverage; uncertainty; exclusions"
  update_trigger: "Changed acid/ammonia route, assays, formulation, utility provider, control equipment, measurement basis or reference identity"
