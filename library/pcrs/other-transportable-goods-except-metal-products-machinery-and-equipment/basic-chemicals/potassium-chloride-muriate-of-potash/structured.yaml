    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep product, dry solids, KCl, elemental K and K2O-equivalent quantities separately. Use measured moisture/assay on a stated basis; nutrient equivalents are calculations, not new physical product or emitted K2O. [ks-kalimop-grade]"
