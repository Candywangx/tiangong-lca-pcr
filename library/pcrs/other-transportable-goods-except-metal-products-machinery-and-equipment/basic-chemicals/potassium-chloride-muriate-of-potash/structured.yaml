allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "hot_leach_kcl"
    rule: "For this attributional inventory, first separately collect dedicated KCl finishing burdens and any physically separable salt recovery. Apply virtual subdivision only with an evidenced causal relationship. Allocate only the remaining inseparable environmental burdens, first by determining physical causality; where that does not establish a relationship, use documented market value at the separation point and matched-period prices, with sensitivity. No universal mass share or revenue price is supplied."
    source_ids:
      - eu-ilcd-2010
  - rule_id: allocation_physical_ledger
    applies_to: "hot_leach_kcl"
    rule: "Preserve actual ore, product, recovered salt, waste and emissions in the unallocated physical mass/water/K/Na/Cl/carbon ledger. Multiply environmental burden accounts by allocation shares, never mechanically multiply co-product physical outputs. Report physical and allocated accounts separately; recovered salt is not an avoided-production credit by default. Waste disposal remains attributed consistently to its originating process."
    source_ids:
      - eu-ilcd-2010
      - eu-mwei-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "hot_leach_kcl"
      flow_role: "kcl_product"
      record_type: "accepted product ledger"
      raw_fields: "lot; net accepted mass Q; granule sizes; as-delivered moisture; KCl; K2O-equivalent; NaCl; Mg; insolubles; assay basis; site; date; failed/zero-output and rework/return links; opening/closing product and work-in-progress stocks with carried burdens"
      collection_method: "Calibrated net weighing and representative composite sample/traceable laboratory assay; exclude packaging, rejected lots and internal recycles from Q while retaining their actual production burdens in the matched pool. Reconcile net accepted production, stocks and returns by lot under normalize_period; a returned/reaccepted net batch is confirmed only once and internal rework is not added output; final reference output per 1 kg reference flow"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "one declared representative period including startup/shutdown and stock changes"
      site_scope: "same site and product scope; shared units assigned transparently"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; coverage; reconciliation; detection limits; traceable records"
    - protocol_id: cp_mineral
      process_id: "hot_leach_kcl"
      flow_role: "ore; makeup_salt; halite_product"
      record_type: "weighing and mineral assay"
      raw_fields: "stream; lot; incoming/outgoing mass; moisture; KCl/NaCl/Mg salts/insolubles; origin/receiver; initial/final stocks; makeup-salt purity"
      collection_method: "Calibrated scales, representative solid/liquid sampling and assay with standards, lab method and uncertainty; reconcile dry components and entrained liquid; retain raw period stream totals and opening/closing stock/composition records for normalize_period; no division during collection"
      unit: "kg"
      frequency: "each lot and stock reconciliation"
      temporal_coverage: "one declared representative period including startup/shutdown and stock changes"
      site_scope: "same site and product scope; shared units assigned transparently"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; coverage; reconciliation; detection limits; traceable records"
    - protocol_id: cp_energy
      process_id: "hot_leach_kcl"
      flow_role: "electricity; gas"
      record_type: "meter and supplier record"
      raw_fields: "meter; stage; kWh; gas m3; temperature; absolute pressure; wet/dry basis; Z; composition; LHV/HHV basis; supplier volume definition; steam supply/return conditions"
      collection_method: "Calibrated delivery meters and phase submeters; invoices and supplier definitions; heat audit including boiler losses, condensate return, recovery and actual steam enthalpy; retain raw attributable period delivered-energy/volume totals for normalize_period; no division during collection"
      unit: "MJ; m3"
      frequency: "continuous, reconciled each accounting period"
      temporal_coverage: "one declared representative period including startup/shutdown and stock changes"
      site_scope: "same site and product scope; shared units assigned transparently"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; coverage; reconciliation; detection limits; traceable records"
    - protocol_id: cp_residue
      process_id: "hot_leach_kcl"
      flow_role: "tailings; sludge; dust_waste"
      record_type: "residue stock and disposal record"
      raw_fields: "stream; actual wet mass; dry fractions; entrained liquid; contamination; internal recycle; shipment/onsite stock; receiver; salinity acceptance; long-term facility scenario"
      collection_method: "Separate calibrated weighing, representative moisture/composition assay and waste-receiver documentation; reconcile capture with recovered/rejected dust; retain raw actual outbound period stream totals for normalize_period, with onsite deposition stocks separately; no division during collection"
      unit: "kg"
      frequency: "each disposal or stock event"
      temporal_coverage: "one declared representative period including startup/shutdown and stock changes"
      site_scope: "same site and product scope; shared units assigned transparently"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; coverage; reconciliation; detection limits; traceable records"
    - protocol_id: cp_purge
      process_id: "hot_leach_kcl"
      flow_role: "purge"
      record_type: "external liquid-waste record"
      raw_fields: "purge mass/volume; density; water/salt fractions; destination; recycled amount; initial/final brine stocks"
      collection_method: "Meter/weigh external liquid shipment and sample composition; reconcile internal treatment and recirculation separately; retain raw external purge period mass totals for normalize_period; no division during collection"
      unit: "kg"
      frequency: "each shipment and period balance"
      temporal_coverage: "one declared representative period including startup/shutdown and stock changes"
      site_scope: "same site and product scope; shared units assigned transparently"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; coverage; reconciliation; detection limits; traceable records"
    - protocol_id: cp_air
      process_id: "hot_leach_kcl"
      flow_role: "co2; co; ch4; n2o; no; no2; so2; hcl; formaldehyde; benzene; pm25; pm10; pm_over10; water_air"
      record_type: "species and dust measurement"
      raw_fields: "source/stage; species; size interval; stack/fugitive flow; concentration; temperature/pressure; wet/dry/O2-reference basis; hours; detection limit; control status; sampling definition; condensable fraction"
      collection_method: "Representative outlet stack/species tests with matched exhaust volume and operating coverage; documented fugitive assessment; droplet interference and filterable/condensable definitions; carbon/water reconciliation where valid; retain raw species-specific actual period emitted-mass totals for normalize_period; disjoint size intervals; no division during collection"
      unit: "kg"
      frequency: "representative operating modes and period hours"
      temporal_coverage: "one declared representative period including startup/shutdown and stock changes"
      site_scope: "same site and product scope; shared units assigned transparently"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; coverage; reconciliation; detection limits; traceable records"
    - protocol_id: cp_water
      process_id: "hot_leach_kcl"
      flow_role: "water; water_out; chloride; potassium; sodium"
      record_type: "water and outfall balance"
      raw_fields: "purchased water mass; recycle/condensate; effluent volume/density/water fraction; temperature; Cl-/K+/Na+ concentration; freshwater receptor; rainfall/runoff; stocks; closure scenario"
      collection_method: "Calibrated meters, representative flow-weighted outfall samples and ion-specific analysis; state density/temperature and uncertainty; monitor saline residue facilities and attributable long-term releases; retain raw actual period water/ion totals and original physical effluent records for normalize_period; no division during collection; do not duplicate an offsite purge as direct discharge"
      unit: "kg; m3"
      frequency: "continuous flows and representative sampling; stock periods"
      temporal_coverage: "one declared representative period including startup/shutdown and stock changes"
      site_scope: "same site and product scope; shared units assigned transparently"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; assays; coverage; reconciliation; detection limits; traceable records"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each non-reference exchange, collect X as the raw period total in its stated numerator unit and apply x = X / Q exactly once here; protocols, conversions and load calculations do not divide by Q. Use the complete matched site/route/product-state production pool, including startup/shutdown, failed and zero-output runs, rejects and internal rework, with their actual material, energy, emission and waste burdens. Reconcile opening/closing raw-material, mother-brine, work-in-progress and product stocks together with their carried production burdens; match withdrawals, receipts and returns so prior or carried burdens are neither omitted nor counted twice. Q is the unique positive accepted as-delivered net product mass attributable to that pool after stock and return reconciliation; count a returned and reaccepted net batch only once, and internal rework is not new output. If Q <= 0 or the pool/burden match cannot be demonstrated, retain the raw records and leave the normalized result unavailable. Final reference output is 1 kg; preserve the unallocated physical ledger and apply any burden allocation only to the separate environmental-burden account."
      inputs:
        - X
        - Q
        - cp_product
      output: "exchange per 1 kg reference flow"
      source_ids:
        - eu-lvic-aaf-2007
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "E_MJ = 3.6 * E_kWh"
      inputs:
        - E_kWh
        - cp_energy
      output: "E_MJ"
      source_ids:
        - eu-lvic-aaf-2007
    - id: assay_conversion
      applies_to: "kcl_product"
      rule: "m_dry = m_product * (1 - w); m_KCl = m_dry * f_KCl_dry only for a dry-basis assay. Elemental K in KCl = m_KCl * molar_mass(K) / molar_mass(KCl); K2O-equivalent = m_K * molar_mass(K2O) / (2 * molar_mass(K)). Use actual declared assay if other K-bearing impurities exist; no nominal-grade substitution."
      inputs:
        - m_product
        - w
        - f_KCl_dry
        - cp_product
      output: "m_dry; m_KCl; m_K; K2O-equivalent"
      source_ids:
        - ks-kalimop-grade
    - id: ion_load
      applies_to: "chloride; potassium; sodium"
      rule: "For each ion, emitted mass = sum of representative concentration (kg/m3 of actual effluent) times matched discharged effluent volume (m3), with compatible dissolved/total definition. Reconcile rainfall, runoff and stocks."
      inputs:
        - concentration
        - "discharge volume"
        - cp_water
      output: "ion mass"
      source_ids:
        - eu-mwei-2018
    - id: water_volume
      applies_to: "water_out"
      rule: "water-component mass = effluent volume * measured effluent density * water mass fraction; water reference volume = water-component mass / justified water density at the declared temperature. Preserve the original total effluent measurement."
      inputs:
        - "effluent volume"
        - "effluent density"
        - "water fraction"
        - "water density"
        - cp_water
      output: "water volume"
      source_ids:
        - eu-mwei-2018
    - id: mineral_balance
      applies_to: "hot_leach_kcl"
      rule: "For K, Na and Cl individually: incoming measured component mass + opening stock = product + recovered salt + residues + direct releases + closing stock, with actual impurity speciation and measurement uncertainty. Keep mass/water balances before environmental burden allocation."
      inputs:
        - cp_mineral
        - cp_product
        - cp_residue
        - cp_purge
        - cp_air
        - cp_water
      output: "component reconciliation"
      source_ids:
        - eu-mwei-2018
        - eu-lvic-aaf-2007
    - id: allocation_account
      applies_to: "hot_leach_kcl"
      rule: "Assigned KCl burden = measured KCl-specific burden + justified KCl share * inseparable shared burden; shares sum to one. Physical co-product quantities remain their measured values; dividing burdens by Q does not rescale their mass."
      inputs:
        - "specific/shared burden"
        - "causal or price records"
        - Q
      output: "allocated KCl burden"
      source_ids:
        - eu-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify physical name/CAS/route/state, constituent mixture and stream destination; UUID identity and provider quantitative basis are separate checks. Unresolved links require a specific named physical stream, assay and later resolution; do not replace ore or wastes with convenient adjacent products."
      evidence: "cp_mineral; cp_residue; cp_purge"
    - id: dq_scope
      applies_to: "hot_leach_kcl"
      requirement: "Retain actual SKU/site/period and operating modes, initial/final brine stocks and phase submetering. A missing measurement, unsupported emission split or unmatched supplier dataset is pending, not zero or a complete dataset."
      evidence: "cp_product; cp_energy"
    - id: dq_air
      applies_to: "cp_air"
      requirement: "Distinguish actual species, non-overlapping particle fractions and sampling/condensable definitions; nondetects need detection limits and treatment of uncertainty. Screening excludes sources only with a documented physical/measurement basis."
      evidence: "eccc-potash-2017; epa-ap42-gas"
    - id: dq_source_limits
      applies_to: "hot_leach_kcl"
      requirement: "K+S diagrams and Canadian practices support physical methods only; do not import their temperatures, sector emission percentages, purity, yield or energy as generic values. LVIC-AAF common audits are used without importing ammonia/NPK recipes. AP42 boiler data require actual combustor applicability and cannot default the direct salt dryer."
      evidence: "ks-thermal-2023; eccc-potash-2017; eu-lvic-aaf-2007; epa-ap42-gas"
validation_rules:
  - rule_id: validate_product
    applies_to: "kcl_product"
    rule: "Require exactly one reference-linked accepted output and all Section 3 qualifiers, measured ≥60% K2O-equivalent on the declared grade basis, net mass, moisture and granular bulk identity; other physical routes/states cannot be auto-selected."
    source_ids:
      - ks-kalimop-grade
      - un-cpc3-2025
  - rule_id: validate_balance
    applies_to: "hot_leach_kcl"
    rule: "Check period/Q alignment, phase handoff equality, K/Na/Cl/water/fuel-carbon reconciliation, stock changes, no duplicate recycle/steam/wastewater or particle outputs, and separate physical versus allocated accounts. Unexplained residuals beyond declared measurement uncertainty are findings, not balancing filler flows."
    source_ids:
      - eu-mwei-2018
      - eu-lvic-aaf-2007
      - eu-ilcd-2010
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Require primary collection, actual supplier/receiver compatibility and conditional applicability evidence for each used exchange. Unresolved UUID, natural-gas volume convention, total-NOx-only data, missing particle speciation, unknown brine composition or omitted long-term residue burdens remain explicit incomplete coverage. No source factor or claimed identity converts these into a passing site dataset."
    source_ids:
      - eccc-potash-2017
      - eu-mwei-2018
      - epa-ap42-gas
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared granular KCl supply inventory within this route/grade/site basis after data completeness review"
  excluded_use: "Other mineral/chemical products, agricultural-use impact factors, automatic classification-wide coverage, food/pharma purity or supplier substitution without verification"
  required_metadata: "reference qualifiers; boundary and period; measured assays/stocks; allocation decision; source scope; supplier and receiver records; actual units/conversions"
  required_quality_disclosure: "unresolved identities/backgrounds; measurement coverage and detection limits; physical balance residuals; long-term scenarios; allocation sensitivity and exclusions"
  update_trigger: "feed mineralogy/grade, purification or additive route, product grade/state, utility basis, residue destination, monitoring or supplier change"
