  semantic_boundary: "Retained scaffold promoted for uncoated bulk granular fertilizer-grade KCl from sylvinite thermal dissolution and cooling crystallisation, with measured K2O-equivalent >=60% and selected China plant-gate identity. Other grades, states and extraction or synthesis routes are excluded. CPC34631 is broader; only narrower mapping is proposed."
