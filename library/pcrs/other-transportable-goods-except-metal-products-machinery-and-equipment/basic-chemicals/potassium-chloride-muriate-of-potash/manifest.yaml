  unresolved_uuid_reason: "Bounded successful searches did not provide exact untreated sylvinite, mixed recovered halite, or the four physically specified residual streams. These are database linkage gaps, not evidence of absent physical flows or network failure. Future assays and receiver/source records define composition; adjacent products and unrelated wastes were rejected."
  provider_basis_requirements:
    - "Selected KCl identity is Mass/kg, granular fertilizer grade >=60% K2O-equivalent, China at plant. The former nominal-grade agricultural Process does not supply actual target assay or a manufacturing dataset. Actual grade and site require collection."
    - "Electricity is grid-average consumer supply at 1-35kV, Net calorific value/MJ. Actual voltage, region, year and delivery-loss boundary must match its provider. Korea soil-remediation-specific generic Electricity was rejected."
    - "Pipeline gaseous natural gas is Volume/m3, not Mass. Its native full name/route describe processed pipeline supply, but CAS74-82-8 identifies methane: retain this source identity-review debt, not an assumed pure-methane composition. Use the link only with documented compatible actual pipeline-gas identity and supplier Volume/m3 basis; otherwise keep input linkage pending. Temperature, absolute pressure, wet-dry composition, compressibility and provider volume convention require verification; no density is inferred from secondary mass coefficients."
    - "Liquid freshwater emission is Volume/m3 for the water component; actual saline effluent density, water fraction and water-density conversion are required. Ions are Mass/kg, individually specified; whole effluent and separated constituents are not mechanically summed."
    - "NO and NO2 are separate physical species; total NOx-as-NO2 alone remains insufficient to establish species amounts. N2O is separate. Particle intervals are disjoint; no cumulative totals added again."
  source_metadata_debts:
    - "Optional purchased NaCl a413ea86-0887-42c8-be77-3bee86d5863b has matching NaCl name, CAS7647-14-5 and purity >=99.5%, but its source CPC34231 conflicts with salt classification16200. Physical identity is conditional on actual purity and supplier; source classification clarification is outstanding. It cannot identify mixed recovered halite."
  source_limits:
    - "Producer process diagrams, Canadian potash practice and historical BAT documents support scoped physical methods, not generic yield, purity, recipe, energy or emission-factor defaults. KALIMOP grade information proves product existence, not actual target supply or route."
    - "LVIC-AAF common energy audits and balances apply as general management guidance; ammonia-acid-NPK-specific recipes and emission limits are not transferred. AP42 stationary boiler scope is not automatically a direct salt-dryer factor."
    - "Attributional ILCD C2 subdivision and allocation are used within their decision context; co-product physical quantities are never reduced by environmental allocation shares."
