allocation_rules:
  - rule_id: allocation_physical
    applies_to: "aq_absorption"
    rule: "Preserve whole physical input/output and internal-loop masses before allocating environmental burdens. Recovered internal NH3/water is not a co-product or avoided purchase credit. Wet waste keeps whole physical mass."
    source_ids:
      - lvic-balance-2007
  - rule_id: allocation_shared
    applies_to: "aq_absorption"
    rule: "Prefer dedicated submetering and physical assignment. Where utilities are shared, document measured causal drivers and shares summing to one; retain unallocated totals and assign failed-run/stock burdens to the matched pool. No mass multiplier is applied to physical co-product output."
    source_ids:
      - lvic-balance-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "aq_absorption"
      flow_role: "aq_product"
      record_type: "lot and stock ledger"
      raw_fields: "lot IDs; accepted net kg; NH3 fraction; water; impurities; temperature; density; acceptance; dispatch; returns; opening/closing stock and WIP; carried burdens"
      collection_method: "Calibrated scales/tank meters, temperature-matched density, retained-sample assay, supplier CoA/site QC and unique lot acceptance ledger; Raw aggregation rule: Reconcile Q and each burden movement; a parcel is accepted once after rework, not once per pass"
      unit: "kg; kg/kg; deg C"
      frequency: "each batch and stock close"
      temporal_coverage: "Complete declared period including failures and zero-output runs"
      site_scope: "Same site grade state route pool and actual utility/waste boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, timestamps, chain of custody, original logs, inventory reconciliation and uncertainty"
    - protocol_id: cp_materials
      process_id: "aq_absorption"
      flow_role: "nh3_feed; di_water"
      record_type: "custody transfer and consumption"
      raw_fields: "delivery mass; volume; density; T/P; NH3 assay; water and impurity fractions; source route; provider; opening/closing feed stocks; stage water meters"
      collection_method: "Calibrated transfer masses, compatible density/temperature and supplier assays; separate actual ingredient and cleaning-water meters; Raw aggregation rule: Reconcile complete external consumption and stocks, retain component subledgers without extra exchanges"
      unit: "kg; m3; kg/m3; deg C; kPa; kg/kg"
      frequency: "each delivery and batch"
      temporal_coverage: "Complete declared period including failures and zero-output runs"
      site_scope: "Same site grade state route pool and actual utility/waste boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, timestamps, chain of custody, original logs, inventory reconciliation and uncertainty"
    - protocol_id: cp_electricity
      process_id: "aq_absorption"
      flow_role: "electricity"
      record_type: "meter and utility assignment"
      raw_fields: "meter start/end; kWh; voltage; grid region; delivered mix; utility boundaries; submeter shares; failed-run and standby usage"
      collection_method: "Calibratable submeters and bills; separate service-embedded energy from this unit electricity; Raw aggregation rule: Sum complete period meter differences before 3.6 conversion and pool assignment"
      unit: "kWh; MJ"
      frequency: "continuous totals and period close"
      temporal_coverage: "Complete declared period including failures and zero-output runs"
      site_scope: "Same site grade state route pool and actual utility/waste boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, timestamps, chain of custody, original logs, inventory reconciliation and uncertainty"
    - protocol_id: cp_cooling
      process_id: "aq_absorption"
      flow_role: "cooling_service"
      record_type: "service receipt and enthalpy measurements"
      raw_fields: "provider; service reference; integrated coolant mass; flow rates and duration when used; supply/return T/P; composition; heat capacity/enthalpy method; losses; boundary"
      collection_method: "Calibrated heat meter and supply/return enthalpy with supplier service definition; NCV label is insufficient; Raw aggregation rule: Integrate rates only; sum net delivered duty, not both service and its embedded resources"
      unit: "kg; kg/s; s; deg C; kPa; kJ/kg; MJ"
      frequency: "continuous and period close"
      temporal_coverage: "Complete declared period including failures and zero-output runs"
      site_scope: "Same site grade state route pool and actual utility/waste boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, timestamps, chain of custody, original logs, inventory reconciliation and uncertainty"
    - protocol_id: cp_waste
      process_id: "aq_absorption"
      flow_role: "ammoniacal_liquor"
      record_type: "waste manifest and assay"
      raw_fields: "wet kg; NH3 equivalent; total N; water; impurity species; sample time; compatible receiver; destination; return/recovery; stock"
      collection_method: "Weigh whole exported liquor, independently assay and retain transfer and treatment acceptance records; Raw aggregation rule: Sum exported wet kg once; internal recovery cancels; reconcile components and carried burdens"
      unit: "kg; kg/kg"
      frequency: "each removal and stock close"
      temporal_coverage: "Complete declared period including failures and zero-output runs"
      site_scope: "Same site grade state route pool and actual utility/waste boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, timestamps, chain of custody, original logs, inventory reconciliation and uncertainty"
    - protocol_id: cp_emissions
      process_id: "aq_absorption"
      flow_role: "nh3_air; water_air"
      record_type: "source test and event log"
      raw_fields: "outlet; NH3 concentration; humidity in/out; gas flow rate/duration or integrated volume; T/P; wet/dry basis; controls; loading/relief/maintenance events; species convention; uncertainty"
      collection_method: "Calibrated source/fugitive and humidity methods covering vents, storage/loading and nonroutine events; retain nondetect handling; Raw aggregation rule: Sum nonoverlapping species/outlet/event amounts on compatible bases; no unexplained residual emission factor"
      unit: "kg; mg/m3; m3; m3/s; s; deg C; kPa"
      frequency: "test campaign plus complete operating/event log"
      temporal_coverage: "Complete declared period including failures and zero-output runs"
      site_scope: "Same site grade state route pool and actual utility/waste boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, timestamps, chain of custody, original logs, inventory reconciliation and uncertainty"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For Q > 0: x_i = B_i / Q. B_i is the matched attributable raw period total after unit conversion and opening/closing burden transfers. For Q = 0, no x_i. aq_product = 1 kg/kg."
      inputs:
        - B_i
        - Q
      output: "normalized exchange"
      source_ids:
        - lvic-balance-2007
    - id: calc_components
      applies_to: "nh3_feed, aq_product, ammoniacal_liquor"
      rule: "m_NH3eq = m_whole × measured w_NH3eq. N mass uses the declared stoichiometric N/NH3 molecular-mass ratio or independently measured N. Water = whole mass × independently measured water fraction, not an unmeasured balance remainder."
      inputs:
        - m_whole
        - w_NH3eq
        - "measured water fraction"
        - "molecular mass convention"
      output: "component subledgers"
      source_ids:
        - hill-process-2021
        - hill-spec-2020
    - id: calc_balances
      applies_to: "aq_absorption"
      rule: "For total physical mass and each element: external material input + all opening physical stocks = actual accepted net plant-gate supply + exported waste + environmental emissions + all closing physical stocks + documented residual. Q excludes retained finished stock. Electricity and indirect cooling services have separate energy ledgers; coolant circulation outside the process material boundary is not raw material input. Internal loops cancel. Retain NH3-equivalent, total N, H, O and water ledgers; investigate residuals against uncertainty without forcing closure."
      inputs:
        - "all external mass"
        - "opening stock"
        - "closing stock"
        - assays
        - "emission records"
      output: "physical balance residuals"
      source_ids:
        - lvic-balance-2007
    - id: calc_water_species
      applies_to: "aq_absorption"
      rule: "Aqueous acid-base speciation is not procurement of pure NH4OH or proof of net reaction-water production. Track actual dissolved NH3/NH4+ convention, evaporation/condensation and water phase separately. Do not invent reaction water, dry-organic generation or COD-derived water. Any additional reaction needs an independently measured/reaction-supported extent and balanced species ledger."
      inputs:
        - "species convention"
        - assays
        - "phase measurements"
        - "reaction evidence if applicable"
      output: "independent water and species ledgers"
      source_ids:
        - lvic-balance-2007
        - yara-solution
    - id: calc_gas
      applies_to: "nh3_air, water_air"
      rule: "m = concentration × integrated compatible gas volume with stated unit conversion; if only gas rate exists, V = integral(rate dt). Water uses net outgoing minus incoming humidity. Never multiply integrated volume by time again or double-count measured and modelled outlets."
      inputs:
        - concentration
        - "integrated volume"
        - "gas rate if used"
        - "duration if used"
        - humidity
        - "T/P"
        - "wet/dry basis"
      output: "raw species kg"
      source_ids:
        - lvic-balance-2007
    - id: calc_cooling
      applies_to: "cooling_service"
      rule: "H_MJ = sum[m_coolant × (h_return - h_supply)] / 1000 for h in kJ/kg, net of boundary-consistent corrections. This duty is distinct from electricity input and an NCV label. No unmeasured COP converts it to electricity."
      inputs:
        - "integrated coolant mass"
        - "supply enthalpy"
        - "return enthalpy"
        - "boundary corrections"
      output: "raw delivered cooling MJ"
      source_ids:
        - lvic-balance-2007
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify complete native identity, CAS when declared, all name components, medium, route, grade, geography and exact property/unit basis. A valid UUID does not establish background dataset compatibility."
      evidence: "Direct native records; provider declarations"
    - id: quality_pool
      applies_to: "all inventory rows"
      requirement: "Complete matched period and stock/burden trail, retained failures, duplicate-free Q and unit conversions before one normalization are mandatory."
      evidence: "Original pool and stock reconciliation"
    - id: quality_ranges
      applies_to: "all inventory rows"
      requirement: "No generic recipe, yield, energy, density or emission ranges are established. Collect site values and uncertainty; unresolved empirical range needs remain explicit, not fabricated priors."
      evidence: "Source scope and actual collection records"
    - id: quality_completeness
      applies_to: "aq_absorption"
      requirement: "Verify the no-additive bulk route and conditional utility/emission/waste applicability, including nonroutine events. Ordinary auxiliary identity gaps require an explicit provider/flow resolution before the corresponding dataset link is complete."
      evidence: "Flow diagram; test reports; utility and receiver evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "aq_product"
    rule: "Require exactly one reference product output linked to aq_product, 1 kg whole accepted solution, measured grade/concentration and positive unique Q for normalization. Active NH3 and N remain analyses."
    source_ids:
      - lvic-balance-2007
  - rule_id: validate_pool
    applies_to: "all inventory rows"
    rule: "Check complete failed/zero-output/rework/WIP coverage, opening/closing burden transfers and once-only normalization; no Q = 0 per-kg result."
    source_ids:
      - lvic-balance-2007
  - rule_id: validate_balances
    applies_to: "aq_absorption"
    rule: "Check independently supported whole mass, N/H/O, component and phase-water ledgers before allocation. Investigate uncertainty/residuals; no unknown outlet and reaction water fitted together."
    source_ids:
      - lvic-balance-2007
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Recheck each exact native identity/property/unit and regional, grade, route, mix and receiving-medium limitation. Unresolved auxiliary links are explicit incompleteness, not silently matched substitutes."
    source_ids:
      - lvic-balance-2007
