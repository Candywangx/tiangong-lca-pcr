  calculation_rules:
    - id: period_attribution
      applies_to: "all inventory rows"
      rule: "Retain raw full-period totals, all startup/failed/zero-output/rework activity and opening/closing WIP, resin and recovered-monomer stocks with carried burdens. Attribute each unique burden to its output cohort once; subtract only burdens carried to another cohort and add inherited burdens actually released to this cohort. Do not subtract failures or double-count returned acceptance. Q is independently weighed newly accepted supplied net resin of this exact product/grade/route/state, counted once; no purchased resale, slurry water or intermediate cake."
      inputs:
        - raw_activity
        - stock_ledger
        - wip_ledger
        - accepted_lot_ledger
      output: "A; Q"
      source_ids:
        - jrc-polymers-2007
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert recorded raw amounts to each row unit before normalization. For a measured rate use its actual duration integral; for an already integrated gas/liquid volume use that volume once with actual pressure/temperature/composition/density and dry/wet basis. kWh is retained for electricity. Steam is actual kg with condition and return boundary; no extra MJ purchase of the same service. No secondary flow-property coefficient is a density measurement."
      inputs:
        - raw_meters
        - calibration
        - state_assay
        - supplier_basis
      output: "converted raw totals"
      source_ids:
        - jrc-polymers-2007
    - id: formulation_subledger
      applies_to: "ehp_formulation; pva_granules; poly_water"
      rule: "Whole supplied mass is the commercial input. Constituent mass = supplied mass times independently evidenced lot mass fraction; distinguish active peroxide, stabiliser/emulsifier, carrier water and other actual components. Onsite PVA solution = actual separately charged granules plus measured water less measured losses. These constituent/solution balances do not create duplicate purchased exchanges."
      inputs:
        - supplied_lot_mass
        - lot_mass_fractions
        - measured_dilution_water
        - measured_losses
      output: "constituent ledger"
      source_ids:
        - nouryon-ehp-w40s-2022
        - kuraray-spvc-poval-2025
    - id: normalise_period
      applies_to: "all inventory rows"
      rule: "For each non-reference exchange report q = A / Q once, after raw conversions and cohort attribution; A is that exchange numerator in its declared unit and Q is positive accepted net resin kg. final_resin is 1 kg. Card amount expressions and protocol aggregation columns denote this same final reporting operation, not sequential divisions; collection_method never executes A/Q. If Q is zero retain the absolute inventory pending review."
      inputs:
        - A
        - Q
        - cp_accepted
      output: "q per 1 kg reference flow"
      source_ids:
        - jrc-polymers-2007
    - id: independent_species_balance
      applies_to: "all inventory rows"
      rule: "Independently measure product quantity, residual VCM, water/volatiles and actual species. Check complete physical and elemental ledgers across paired transfers; ideal VCM repeat-unit addition conserves C2H3Cl without water coproduct. The EHP sheet names CO2 and 2-ethylhexanol as decomposition products but provides no actual site yields or fate. Never infer both chemical water and an unknown output from closure, or infer species from COD. Retain measured phase/free-water changes separately."
      inputs:
        - measured_species
        - measured_product
        - phase_water
        - paired_transfers
        - stock_ledger
      output: "physical and species reconciliation"
      source_ids:
        - jrc-polymers-2007
        - nouryon-ehp-w40s-2022
  data_quality_requirements:
    - id: quality_grade
      applies_to: "reference product"
      requirement: "Independent acceptance and retained samples: actual homopolymer grade, suspension powder morphology, viscosity/K test method, particle/porosity evidence, residual VCM and water/volatile methods; no generic native UUID substitutes these facts."
      evidence: "Certificates and primary tests with detection limits and sample dates"
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "One reconciled product/grade/route/state period, unique acceptance and all failed activity. Opening/closing WIP and recovered stocks have both mass and inherited-burden receipts. Unknown carryover blocks the cohort calculation."
      evidence: "Signed production/stock/WIP reconciliation and allocation evidence"
    - id: quality_identity
      applies_to: "UUID-bearing rows"
      requirement: "S-PVC native has only a broad basename, Product/Mass and classification; detailed grade/form, CAS, comment, geography and route/mix are absent and compliance Not defined. VCM native CAS 75-01-4 specifies factory production mix/VCM production, no geography/purity/provider. Preserve these limits, use exact reference-property/unit versions in evidence and independently verify actual supplier compatibility."
      evidence: "Full native name/medium/properties audit plus actual supplier dossier"
    - id: quality_species
      applies_to: "physical inventory"
      requirement: "Independent assayed physical species/phase ledgers and measured product mass. Quantified uncertainty and analytical limits; no COD/total-VOC or undetermined reaction-water/output residual fitting."
      evidence: "Calibrations, sample chain and mass/element/phase reconciliation"
validation_rules:
  - rule_id: validate_identity
    applies_to: "all relevant operations"
    rule: "Verify full native identity plus actual grade/form/route evidence. CAS similarity cannot convert PVC into PVDC, PTFE or compounds. Native unspecified fields stay unspecified; identity compatibility never proves supplier quantity or LCA background applicability."
    source_ids:
      - jrc-polymers-2007
  - rule_id: validate_denominator
    applies_to: "all relevant operations"
    rule: "Require Q > 0 and the same product, route, grade, physical state and accepted cohort in every numerator. Deduplicate acceptance, retain rejected/zero-output runs and period stock/WIP burden transfers. If no positive matched output exists, retain absolute burdens and issue no fabricated normalized dataset."
    source_ids:
      - jrc-polymers-2007
  - rule_id: validate_closure
    applies_to: "all relevant operations"
    rule: "Reconcile whole physical mass, C, H, Cl and water across process and utility boundaries using measured feeds, outlets and stocks. Ideal VCM addition polymerisation has no net H2O coproduct. Initiator decomposition, any side reaction, dissolved species, residual VCM, water phase change and any chemical H2O formation/consumption need independent evidence; never fit unknown reaction water and unknown resin output to one residual. COD is not a carbon/species mass balance."
    source_ids:
      - jrc-polymers-2007
      - nouryon-ehp-w40s-2022
  - rule_id: validate_emissions
    applies_to: "all relevant operations"
    rule: "Keep captured/recycled monomer, residual monomer in resin, stripped effluent load, final routed air releases and equipment leaks separate. Link every final species to its medium and actual control boundary. Do not treat total VOC, old uncontrolled AP-42 factors or apparent closure as measured species removal."
    source_ids:
      - jrc-polymers-2007
      - epa-ap42-pvc-1995
      - nouryon-ehp-w40s-2022
  - rule_id: validate_limits
    applies_to: "all relevant operations"
    rule: "Document calibration, censored analytical limits, missing periods and method uncertainty. A nondetect is not measured zero. Expand every additional actual exchange rather than silently omitting it; unresolved provider/auxiliary UUIDs are explicit dataset matching work, while a genuinely missing reference or reaction/conversion method blocks use."
    source_ids:
      - jrc-polymers-2007
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual evidence and independent methodological review"
  downstream_use: "Input resin to the manufacture of declared compatible PVC goods"
  allowed_use: "Same polymer, grade family, powder state, suspension route and declared factory boundary with transparent upstream linkage"
  excluded_use: "PVDC, PTFE/other fluoropolymers, E-PVC paste, B-PVC, compounds, recycled resin, finished articles or a verified supplier-specific SKU inferred from generic identity"
  required_metadata: "PVC homopolymer identity; aqueous batch suspension route; primary powder state; actual grade and K-value or viscosity method; particle-size/porosity basis; water and volatile content with test method; residual VCM with test method; actual initiator formulation and PVA grade; supplied gate state; site and period; feedstock route and upstream boundary; native identity limitations"
  required_quality_disclosure: "Source geography/age, actual foreground period, completeness and stock burdens, censored emissions, whole formulations, native missing fields and all remaining provider/UUID matches; no scientific approval or mapping inferred"
  update_trigger: "Different grade/recipe, feedstock or initiator form, reactor route, recovery/control, dryer heat source, treatment boundary, supplier/location, measured denominator or stock attribution change"
data_sources:
  - id: "jrc-polymers-2007"
    type: "official_guidance"
    reference: "European Commission, Reference Document on BAT in the Production of Polymers, August 2007, Chapter 2 §2.3.1 pp.23–24 and Chapter 5 §§5.2.1–5.2.8, pp.94–100, Figure 5.1, and §5.3. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf"
    used_for: "Chain-growth double-bond addition, initiator-residue fate, suspension route, stripping, solid-liquid separation, drying, VCM/water recovery and emission interfaces. Ideal no-water repeat-unit stoichiometry is an atom-conserving inference, not measured side-reaction water. Historical European industry/plant observations; no universal conversion, recipe, energy range, current legal limit or site emission factor is adopted. Inventory, attribution and normalization are this PCR operational method, not a claim of prescribed BREF LCA allocation."
  - id: "nouryon-ehp-w40s-2022"
    type: "literature"
    reference: "Nouryon, Trigonox EHP-W40S Product Data Sheet, 2022-6-30, pp.1–4. https://www.nouryon.com/globalassets/inriver/resources/pds-trigonox-ehp-w40s-polymer-production-glo-en.pdf"
    used_for: "Producer primary evidence for one supplied frozen water-emulsion initiator, CAS, suspension use, storage/dilution and named decomposition products. Nominal 40% is formulation identity, not actual lot assay; bulk density is not liquid density. No recipe dosage, site reaction yield, storage electricity or emitted fraction is provided. Suitability requires producer/customer testing; not a complete recipe or safety operating procedure."
  - id: "kuraray-spvc-poval-2025"
    type: "literature"
    reference: "Kuraray, KURARAY POVAL for Suspension PVC Technical Data Sheet, 2025/04/15, pp.1–4. https://www.kuraray-poval.com/fileadmin/user_upload/KURARAY_POVAL/technical_information/grades_by_region/grades_for_s_pvc/TDS_KURARAY_POVAL_grades_for_S-PVC_English.pdf"
    used_for: "Fine-granule supply, primary/secondary PVA grades and grade-dependent onsite dissolution/dispersion. L-10 is a representative identity, not proof of the future supplier, formula dose, universal hydrolysis grade, plant temperature/energy use or joint EHP recipe. Lot and actual formulation compatibility still required."
  - id: "epa-ap42-pvc-1995"
    type: "official_guidance"
    reference: "US EPA, AP-42 §6.6.1 Polyvinyl Chloride, 9/91 reformatted 1/95, pp.1–2. https://www.epa.gov/sites/default/files/2020-10/documents/c06s06-1.pdf"
    used_for: "Independent historical source for monomer/particulate releases and recovery-control distinction. It is broad plastics prose and uncontrolled factor rating E with 1969–1970 evidence; neither generic alkyd examples nor old numerical factors are used to specify S-PVC chemistry, controlled emissions or modern legal compliance."
