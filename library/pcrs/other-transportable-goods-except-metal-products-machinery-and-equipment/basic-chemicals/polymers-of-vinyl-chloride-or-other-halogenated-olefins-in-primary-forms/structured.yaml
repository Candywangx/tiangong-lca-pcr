allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all relevant operations"
    rule: "First separate unit operations and meter their actual loads. Where shared utilities remain, use a documented causal meter/engineering driver for the complete period; disclose driver units and amounts before allocating. Do not use product price as an unexplained default."
    source_ids:
      - jrc-polymers-2007
  - rule_id: allocation_recycle
    applies_to: "all relevant operations"
    rule: "Recovered VCM returned internally creates neither a saleable co-product nor virgin-substitution credit. Retain capture/recompression burdens and opening/closing stocks; only an actual separately sold output with receiver/specification evidence can trigger a justified co-product allocation."
    source_ids:
      - jrc-polymers-2007
  - rule_id: allocation_offgrade
    applies_to: "all relevant operations"
    rule: "Measure actual lower-grade resin separately from waste. The reference denominator includes only unique newly accepted output of the declared product/route/state. Failed, zero-output, returned and reworked activity and its inherited burdens remain attributable; no duplicate acceptance after rework."
    source_ids:
      - jrc-polymers-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_poly_material
      process_id: "polymerise"
      flow_role: "fresh_vcm; recycle_vcm_in; poly_water; ehp_formulation; pva_granules; initiator_carton"
      record_type: "primary meters, batch and assay receipts"
      raw_fields: "batch/lot/supplier; whole delivered and charged kg; stock changes; assay and carrier water; PVA grade/solids; dilution/wash water by purpose; recovered-VCM transfer key and impurities; storage/dosing losses; failed batches; WIP mass and burdens"
      collection_method: "Collect original whole-lot purchase, charge, assay and water-meter records for the full actual period, including failures and stock/WIP carried burdens. Retain constituent subledgers and internal recycle keys; do not normalize or duplicate procurement."
      unit: "kg; m3 with measured state/assay as applicable"
      frequency: "each batch, meter and transfer"
      temporal_coverage: "same complete actual production/acceptance period including failures, zero-output and opening/closing carryover"
      site_scope: "owned process and explicitly matched cohort; shared drivers disclosed"
      aggregation_rule: "per 1 kg reference flow"
