      collection_method: "Calibrated gas monitoring and representative moisture/species analyses; reconcile gross physical TotalMass and all actual elements, then derive net environmental exchanges without double-counting gas carriers. Distinguish precursor mineral carbon from each fuel or other carbon source; no ideal yield, invented density or calorific coefficient replaces measurements"
