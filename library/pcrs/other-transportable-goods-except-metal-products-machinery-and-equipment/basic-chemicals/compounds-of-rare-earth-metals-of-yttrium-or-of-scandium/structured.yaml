  calculation_rules:
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "For each exchange divide the measured attributable campaign quantity by the accepted net powder output in kg of the same grade and period. Output is the exchange per 1 kg reference flow; retain unallocated totals and stock reconciliation. Retain raw unallocated campaign totals before normalization. Use one matched route, supplied state, grade and representative period, including all attributable startup, shutdown, idle, failed, off-specification, zero-accepted-output and rework operations. Reconcile opening/closing work in progress and finished stocks with their accumulated inventory burdens, using documented carry-in/carry-out attribution without lost or duplicated burdens. Define strictly positive D as final accepted net supplied powder produced for that pool, reconciled with acceptance, dispatch and stocks; exclude final rejects and do not count returned, reworked and reaccepted powder twice. Divide each reconciled raw exchange total by D once under calc_reference. A complete period with D <= 0 requires a justified wider representative period or an incomplete result. Conditional exchanges require evidence of applicability or documented absence; no positive demand or zero emission is supplied by this PCR."
      inputs:
        - "campaign exchange"
        - "accepted powder kg"
        - cp_product
      output: "native numerator unit per kg"
      source_ids: []
    - id: calc_assay
      applies_to: "in_carbonate, out_ceria"
      rule: "Keep accepted supplied powder kg as the reference. For each material, free-moisture-excluded mass = supplied mass × (1 − measured free-moisture fraction); this does not remove structural hydrate water. Apply each assay only to its declared wet/dry or oxide-equivalent denominator. Precursor elemental Ce mass is measured Ce fraction × the matching assayed mass; any reported CeO2 equivalent is a bookkeeping equivalent, not actual oxide in carbonate. For verified product CeO2, Ce mass = contained CeO2 mass × A(Ce)/(A(Ce)+2A(O)), with documented atomic-weight edition; add measured Ce in any other actual species separately. Neither composition conversion defines yield or changes the reference denominator."
      inputs:
        - "supplied mass"
        - "measured moisture/speciation and assay denominator"
        - "atomic weights"
        - cp_feed
        - cp_product
      output: "free-moisture-excluded mass and separate elemental Ce"
      source_ids:
        - thermo-carbonate-spec
    - id: calc_balances
      applies_to: "physical_ledger"
      rule: "Before allocation, reconcile gross physical TotalMass and each actual element C/H/O/Ce/impurity across all inputs, products, gas/particles, liquids, externally transferred solids, packaging/carriers and stock changes. Include wet inlet/outlet air, auxiliary water and maintenance consumption; keep net oxygen/water LCI exchanges distinct from gross carrier balances. Count internal returns at matching endpoints once; keep electricity/heat balance separate. Require measured chemical forms and hydration; ideal stoichiometry alone neither defines actual emissions nor plant yield."
      inputs:
        - cp_feed
        - cp_product
        - cp_solids
        - cp_air
        - cp_energy
        - cp_balance
        - cp_pm
      output: "physical and energy residuals with uncertainty"
      source_ids: []
    - id: calc_pm
      applies_to: "out_pm25, out_pm2510, out_pmover10"
      rule: "Use exclusive filterable aerodynamic intervals: filterable PM2.5; filterable PM10 − filterable PM2.5; total compatible filterable PM − filterable PM10. Retain method uncertainty and require compatible simultaneous bases; a negative difference requires investigation. Keep separately quantified condensable PM outside these subtraction inputs; when applying Method201A §3.1, add it once to PM2.5 under that explicit convention. Disclose method scope. Do not add inclusive PM10, captured dust or condensable PM a second time."
      inputs:
        - cp_pm
      output: "exclusive emitted particle masses"
      source_ids:
        - epa-pm201a-2020
    - id: calc_allocation
      applies_to: "shared_burden"
      rule: "Allocated burden = dedicated measured burden + documented target share × inseparable shared burden. If an economic fallback is justified, target share = target net revenue / total net revenue of all actual coproducts in the same period. Preserve the full physical outputs; require sensitivity and treatment of non-positive revenue before calculation."
      inputs:
        - cp_burden
      output: "allocated environmental burdens only"
      source_ids: []
  data_quality_requirements:
    - id: quality_primary
      applies_to: "all inventory rows"
      requirement: "Use actual primary measurements, grades and supplier-route data; disclose missing flow UUIDs, volume/provider bases and mineral-carbon identity. Record full-year representativeness limitations rather than claiming a survey not performed."
      evidence: "cp_product; cp_feed; cp_energy; cp_air; cp_solids; cp_balance; cp_pm"
    - id: quality_balance
      applies_to: "physical_ledger"
      requirement: "Set TotalMass and all actual C/H/O/Ce/impurity-element and energy closure criteria from instrument and assay uncertainty; no invented universal tolerance. Explain discrepancies before completeness claims."
      evidence: "cp_balance; cp_burden"
    - id: quality_sources
      applies_to: "method_rules"
      requirement: "Retain source-specific applicability: general SIC unit operations, producer patent case route, supplier catalogue basis and dry-stack PM measurement are different evidence roles; none supplies a generic recipe."
      evidence: "nissan-ceria-2008; jrc-sic-2007; thermo-carbonate-spec; epa-pm201a-2020; epa-ree-2012"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_flow"
    rule: "Confirm dry single-species CeO2, actual carbonate-hydrate/electric/dry route, grade assays and all qualifiers. A broad flow UUID does not validate supplier dataset quantity or energy basis."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require one completed 1 kg product output and a common per-1-kg reference denominator in both languages, protocols and calculations. Keep water, impurity, oxide-contained mass, elemental Ce and packaging distinct."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "inventory"
    rule: "Reconcile all stages, idle/rework losses, dust controls, stock changes and actual extra exchanges. Each additional chemical, solvent, packaging, waste or emission is a separate row with a collection protocol. Unresolved UUID, provider basis or unmeasured fraction prevents complete dataset validation, not an assumed zero."
    source_ids: []
  - rule_id: validate_particles
    applies_to: "out_pm25, out_pm2510, out_pmover10"
    rule: "Require non-overlapping fractions and explicit filterable/condensable/fugitive coverage. Water-droplet or unmatched total-PM sampling does not establish Method201A size fractions. Review uncertainty rather than forcing negative differences to zero."
    source_ids:
      - epa-pm201a-2020
  - rule_id: validate_upstream
    applies_to: "supplier_link"
    rule: "Verify actual mine and separation chain and provider reference quantity, with separate physical and burden ledgers. Shared rare-earth averages or historical flow-sheet product labels are not evidence of a specific Ce product."
    source_ids:
      - epa-ree-2012
published_dataset_profile:
  dataset_role: "Site-specific foreground conversion process"
  downstream_use: "secondary_dataset; background_dataset only after data completeness and applicable review"
  allowed_use: "Declared carbonate-hydrate/electric/dry CeO2 route and grade; upstream linked only after provider-basis verification"
  excluded_use: "Generic rare-earth/yttrium/scandium averages, fuel-fired or wet routes, mixed oxides, abrasive performance comparisons and slurry kg equivalence"
  required_metadata: "CeO2/Ce(III) distinction; dry supplied net powder mass; residual moisture; CeO2 assay and impurity basis; carbonate-hydrate speciation and carbon origin; actual mineral source and separation supplier; furnace/electricity voltage/atmosphere; lot, temperature-time history; particle size and surface-area acceptance; receiving use; packaging and dispatch gate; upstream provider quantity and allocation basis"
  required_quality_disclosure: "Actual campaign/site/grade, measured yield and assays, supplier and carbon-origin traceability, unresolved identities/provider bases, source limitations, balances, allocation and completeness"
  update_trigger: "Changed precursor/source, hydration or assay basis, furnace/electricity/atmosphere, product grade, finishing, abatement, packaging, supplier or allocation"
data_sources:
  - id: "nissan-ceria-2008"
    type: "literature"
    reference: "Nissan Chemical Industries, US7431758B2, 2008-10-07, original PDF page 7, columns 11–12, Examples 1–2; https://patents.google.com/patent/US7431758B2/en"
    used_for: "Producer original confirms carbonate-hydrate/electric-furnace CeO2 powder route and distinguishes partially converted material. No example recipe, furnace schedule, yield, particle size or energy default is transferred. Slurry preparation is excluded."
  - id: "jrc-sic-2007"
    type: "official_guidance"
    reference: "European Commission, SIC BREF August 2007, §§2.2.4 and 2.2.7.1, printed pp9/11, PDF pp39/41; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/sic_bref_0907.pdf"
    used_for: "General calcination and dry grinding, energy and dust interfaces only; pigment-specific BAT limits, chemistry and factors are not transferred to ceria."
  - id: "epa-pm201a-2020"
    type: "method_factor"
    reference: "US EPA Method201A, October 7 2020 publication, §§1.1–1.6, 2 and 3, PDF pp1–3; https://www.epa.gov/sites/default/files/2019-08/documents/method_201a_0.pdf"
    used_for: "Stationary dry-source filterable PM sizing and limitations. Requires compatible total-PM method for >10 micrometres and separate condensable/fugitive coverage; no emission factors. Not a legal compliance declaration."
  - id: "epa-ree-2012"
    type: "official_guidance"
    reference: "US EPA/600/R-12/572, December 2012 Revised, §§4.2–4.3 and Appendix C Figure C-1 continuation; https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P100EUBC.TXT"
    used_for: "Historical evidence of mineral/separation diversity and variable coproduct chemical forms; supports supplier traceability need, not a modern universal recipe, plant inventory or allocation fraction."
  - id: "thermo-carbonate-spec"
    type: "literature"
    reference: "ThermoFisher Scientific product specification, Cerium(III) carbonate hydrate 379402500, print 2026-10-14, PDF p1; https://assets.thermofisher.com/chem-specs-pdf/retrievePdf?countryCode=kr&erp_type=KR_E1_LCD&rootSku=37940&sku=379402500"
    used_for: "Confirms hydrate name/CAS and that trace-metal purity has a separate denominator. This catalogue grade is not assumed to be a factory input or total dry chemical purity; measure actual lot hydration, assay and water."
