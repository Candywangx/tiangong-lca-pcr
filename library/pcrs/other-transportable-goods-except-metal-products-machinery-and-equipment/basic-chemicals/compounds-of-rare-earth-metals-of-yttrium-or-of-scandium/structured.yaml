allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "environmental_burdens"
    rule: "Use dedicated stage and campaign meters first. Separate other grades, non-ceria products and shared utilities by measured attributable use under cp_burden. Dedicated ceria conversion has no assumed coproduct."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "inseparable_burdens"
    rule: "For genuinely inseparable upstream shared burdens, retain the provider allocation method and collection evidence. Use a demonstrated physical causal relationship where available; if none is defensible, disclose economic shares calculated from actual same-period net revenues and sensitivity, without a universal mass or price factor."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "physical_ledger"
    rule: "Allocation shares apply only to shared environmental burdens. Never multiply physical coproduct outputs, internal transfers, tailings, mother liquor or recovered solvent by the target-product share. Waste treatment is linked to actual receiver and status; no automatic avoided-product credit."
    source_ids:
      - epa-ree-2012
