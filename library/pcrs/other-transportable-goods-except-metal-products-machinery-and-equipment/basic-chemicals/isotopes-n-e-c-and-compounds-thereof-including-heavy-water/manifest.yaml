  blocking:
    - "No actual lot-level evidence links never-before-released chemically finished powder to a first quality release, responsible manufacturer/releasing party and actual outsourced handover. A catalogue and independent purchase observation cannot establish this gate."
    - "Packaging body, closure and actual outer packaging identities, component masses and supplier environmental coverage are unknown. No packaging-material quantities or zero burdens are assumed; complete inventory requires atomic component cards after identification."
    - "No compatible closed-box supplier upstream environmental dataset or actual quality-service/transport envelope is acquired. Sensitive internal preparation remains outside this authoring task."
  remaining_collection_requirements:
    - "Actual lot CoA, chemical assay basis and uncertainty; atom fraction and method separately; applicable dated SDS and lawful civil use. No class-wide 99 percent chemical assay is inferred."
    - "Two adjacent chemical mass ledgers, cohort/period first-release Q, waste/retained samples, uncertainty, and once-only historical burden transfers."
    - "Complete utility, external analysis-service, transport, packaging, waste and environmental-stream applicability audit; expand atomic cards for actual exchanges. Empty sections are unassessed, not zero."
    - "If a physical packaging pool actually exists, identify its entity boundary, each external first receipt, genuine return and remaining burden. No pool is assumed; absence has not been established."
