  source_limitations:
    - "UNSD June 2025 PDF p161 fixes the coordinate; October 2026 CPC3 row1429 adds HS2022 2845 context without changing frozen classification sources."
    - "Sigma492027 specifies labelled solid and on-demand bulk packing; Naviaux2019 independently confirms actual purchase, not first release or manufacture."
    - "CIL CLM-7564 SDS v3.0 (2017) identifies another corresponding labelled single substance, not classified in that edition. Its unlabelled CAS fields do not replace labelled-product identity; no common factory, second source of the purchased lot or production route is inferred."
    - "Sigma March2016 general statement distinguishes analytical-compliance quality release from later retest; it is historical, not an actual lot first-release record. CIL July2025 policy concerns retest/expiry, not actual batch release. IAEA610 is a natural-range carbonate counterexample, not a substitute reference product."
    - "Core module files are scaffolds; PEF candidate module consulted for context only. Corrected EU2021/2279 provides general reference/boundary/allocation principles, not isotope-specific inventory or PEF conformity."
