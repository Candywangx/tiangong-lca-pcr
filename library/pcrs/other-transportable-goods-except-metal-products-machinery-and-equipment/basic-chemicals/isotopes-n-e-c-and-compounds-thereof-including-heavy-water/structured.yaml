system_boundary:
  rules:
    - rule_id: boundary_release
      applies_to: "all datasets"
      rule: "Require original lot release history and responsible release authority; trace outsourced quality work and its actual handover. Receipt, on-demand packing and post-release retest do not create production. A batch certificate alone needs history corroboration. Preserve the historical distinction between quality release and retest; trace whether the source supplier already released the lot earlier, rather than assuming the current seller certificate date is first release."
      source_ids:
        - sigma-carbonate-492027
        - sigma-product-dating-2016
        - cil-retest-2025
    - rule_id: boundary_blackbox
      applies_to: "all datasets"
      rule: "Retain inherited supplier burdens once and local activities separately. Use closed-box supply without acquiring internal preparation instructions; reject a whole-product footprint when upstream coverage is unknown."
      source_ids:
        - eu-pef-2021-corrected
    - rule_id: boundary_physical
      applies_to: "all datasets"
      rule: "Use two adjacent chemical ledgers and one declared entity boundary per physical packaging pool if present. Actual location controls physical stocks: an offsite owned object cannot be both dispatched and inside closing stock. Reconcile all incoming, outgoing and stored mass without treating imbalance as an emission."
      source_ids:
        - eu-pef-2021-corrected
    - rule_id: boundary_packaging
      applies_to: "all datasets"
      rule: "Identify each actual body, closure and outer packaging component separately before inventory completion; do not infer material, mass or burden from a catalogue pack size. For each component distinguish purchase, first non-purchase external receipt and the proven return of the same object previously dispatched from this site. Include actual incurred procurement, transport and service burdens once even if supplier coverage is absent."
      source_ids:
        - sigma-carbonate-492027
        - eu-pef-2021-corrected
    - rule_id: boundary_completeness
      applies_to: "all datasets"
      rule: "Audit actual quality services, inbound logistics, storage, utilities, samples, packaging, waste and environmental releases. Add one atomic card for each evidenced exchange absent below; no unspecified collection card or invented default. Empty sections mean unassessed coverage until a justified absence record exists."
      source_ids:
        - eu-pef-2021-corrected
