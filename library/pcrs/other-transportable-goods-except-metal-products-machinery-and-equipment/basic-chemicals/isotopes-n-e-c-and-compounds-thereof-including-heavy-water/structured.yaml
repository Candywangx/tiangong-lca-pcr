allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "first_release"
    rule: "Separate cohorts, supplier envelopes and locally metered activities before allocation. For genuinely shared quality/storage/transport activities document the causal driver; use subdivision first, then a justified physical relationship, then another justified relationship with sensitivity. Do not invent economic fractions or allocate by isotope atom fraction."
    source_ids:
      - eu-pef-2021-corrected
  - rule_id: allocation_history
    applies_to: "all datasets"
    rule: "Reconcile historical environmental burden separately from physical mass: opening carryover plus external incoming remaining incurred share plus genuinely new burden equals current attribution plus closing carryover plus mutually exclusive external transfer/other attribution. Apply per original object, lot cohort and exchange; a return brings back only its remaining share, never a second full manufacturing burden."
    source_ids:
      - eu-pef-2021-corrected
  - rule_id: allocation_packaging
    applies_to: "all datasets"
    rule: "For each actual packaging component keep physical ownership/location, receipt, reuse and remaining burden distinct. Purchase and first non-purchase receipt are not a genuine return; missing supplier coverage requires investigation. Count each incurred purchase, transport or service once; do not divide physical movements by reuse count. Any life-sharing rule must be justified by actual service evidence; the PEF reuse example supplies no default rotation rate."
    source_ids:
      - eu-pef-2021-corrected
  - rule_id: allocation_losses
    applies_to: "all datasets"
    rule: "Failed-lot assessment, non-recoverable losses and sample/waste treatment stay attributable under a justified cohort rule. Never assign them automatically to a fictional co-product, create an avoided-carbonate credit or transfer a burden both with returned powder and to Q. Q remains a physical net mass independent of allocation."
    source_ids:
      - eu-pef-2021-corrected
dataset_production:
  collection_protocols:
    - protocol_id: cp_identity
      process_id: "first_release"
      flow_role: "identity and first release"
      record_type: "original lot history and certificates"
      raw_fields: "supplier/manufacturer; SKU; source/child lot genealogy; prior release status; original first release time/authority; CoA/retest/expiry; separate assay and isotope basis/method/uncertainty; SDS; outsourced service party and handover"
      collection_method: "Match original certificate, genealogy and first-release register to actual handover; investigate whether bulk was previously released. Keep chemical assay distinct from isotope abundance. A downstream purchase paper cannot establish manufacture."
      unit: "documentary"
      frequency: "each lot and release decision"
      temporal_coverage: "same cohort/period as cp_mass"
      site_scope: "actual supplier and named releasing location"
      aggregation_rule: "retain evidence by lot; no pooling of unlike specifications"
      quality_evidence: "originals, responsible-party confirmation and independent applicability review"
    - protocol_id: cp_mass
      process_id: "first_release"
      flow_role: "received, first released, returned and discarded chemical"
      record_type: "two adjacent physical ledgers"
      raw_fields: "cohort; time; gross; component tare; net kg; uncertainty; pre-release opening/receipts/closing; first release Q; samples retained/transferred/consumed; unreleased returns; waste; post-release opening/returns/closing/shipments/other disposal"
      collection_method: "Use calibrated balances and traceable lot mass records; reconcile pre- and post-release ledgers with the same Q and mutually exclusive destinations. Investigate discrepancies without inferring emissions or re-releasing old stock."
      unit: "kg"
      frequency: "every physical movement and release; close each period"
      temporal_coverage: "declared complete period and lot cohort"
      site_scope: "declared physical boundary including identified external service custody"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, tare provenance, stocktake, release evidence, transfer tickets and reconciliation uncertainty"
    - protocol_id: cp_activity
      process_id: "first_release"
      flow_role: "actual utilities and external services"
      record_type: "meter/invoice/service coverage"
      raw_fields: "meter id; readings; dates; kWh; supplier/voltage/geography; service identity; actual handover/sample endpoint; transport legs/distance/load; boundary; supplier dataset inclusions; allocation driver; missing fields"
      collection_method: "Read actual utility and quality-service records; reconcile supplier-inclusive and local activities without overlap. Identify each missing atomic exchange before completion. No operational isotope preparation data requested."
      unit: "kWh and each actual service unit separately"
      frequency: "each record; aggregate by cohort and period"
      temporal_coverage: "same complete period as cp_mass"
      site_scope: "actual local and outsourced quality boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices; service declarations; supplier envelope and causal allocation evidence"
    - protocol_id: cp_packaging
      process_id: "first_release"
      flow_role: "each actual packaging component"
      record_type: "component-level physical and burden ledgers"
      raw_fields: "body/closure/outer component identity; material; object id; unit mass; owner; location; opening; purchase; first non-purchase external receipt; genuine return tied to prior dispatch; outgoing; disposal; closing; supplier coverage; incurred procurement/transport/service and remaining burden"
      collection_method: "Inspect actual components and weigh or use traceable component records. Each first external receipt counts regardless of purchase or supplier inclusion. A genuine return needs same-object prior outward proof. Reconcile one entity perimeter and separate cards for each identified material/component; do not invent a pool."
      unit: "kg and count separately with measured component mass"
      frequency: "every relevant movement and stocktake"
      temporal_coverage: "matched period, including provenance of opening stock"
      site_scope: "declared physical site/pool perimeter; offsite custody separate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component specifications, weights, linked movement records, custody, invoices and supplier inclusions/exclusions"
    - protocol_id: cp_burdens
      process_id: "first_release"
      flow_role: "inherited and new environmental burden"
      record_type: "exchange-specific remaining-burden account"
      raw_fields: "original object/lot; supplier dataset/reference quantity/gate; opening carry; incoming remaining incurred share; newly incurred burden; current attribution; closing carry; exclusive external/other attribution; uncertainty; allocation evidence"
      collection_method: "Trace each original burden once through receipt, storage, release, return, waste and transfer. Separate included from additional packaging, transport, analysis and utility burdens. Do not charge an entire opening stock purchase again or treat first non-purchase receipt as burden-free."
      unit: "each original exchange unit retained"
      frequency: "each burden event; period close"
      temporal_coverage: "same cohorts and all relevant carried history"
      site_scope: "same chemical/component boundaries with explicit external transfers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier dataset provenance and compatibility, burden-transfer ledger, completeness and double-count review"
    - protocol_id: cp_samples
      process_id: "first_release"
      flow_role: "actual external samples and same-site retains"
      record_type: "sample custody ledger"
      raw_fields: "original lot/cohort; pre/post-release status; dispatch/return id and times; custodian/site boundary; external net mass; retained-stock location; actual analytical endpoint; service-included waste/burden"
      collection_method: "Distinguish onsite retention from external transfer; weigh each actual outward/return movement. Unreleased return is a separate subgroup of I; unchanged released return is G. At external consumption use the documented service endpoint; no onsite transformation or invented loss."
      unit: "kg"
      frequency: "each actual sample movement and stocktake"
      temporal_coverage: "original cohort through actual endpoint"
      site_scope: "physical site perimeter, external service custody separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "custody tickets; calibration; lot history; service endpoint and inclusion proof"
    - protocol_id: cp_released
      process_id: "released_stock"
      flow_role: "G, J, D and actual released sample removal"
      record_type: "original-cohort post-release physical and burden ledger"
      raw_fields: "lot and original release Q_origin; R0; internal current Q; G and prior outward proof; J and outside provenance; R1; D; actual L endpoint; component tare; uncertainty; inherited remaining burden"
      collection_method: "Reconcile each gross physical movement and stock; never infer Q from G/J/D. Retained samples stay R1. Keep J separate by its outside original cohort and preserve burden history. Record raw quantities if current Q is zero."
      unit: "kg"
      frequency: "every actual post-release movement and period close"
      temporal_coverage: "original cohort, including later zero-release periods"
      site_scope: "same declared perimeter as chemical stocks; external custody explicit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original release genealogy; inventory; linked return/outward tickets; burden-transfer receipts"
    - protocol_id: cp_released_activity
      process_id: "released_stock"
      flow_role: "actual subsequent utilities and services"
      record_type: "original-cohort incremental service account"
      raw_fields: "original cohort; actual kWh; meter/readings/dates; electricity supplier; actual service/transport/packaging exchanges; causal attribution; upstream inclusions; current Q; original Q_origin; missing fields"
      collection_method: "Measure later-service increments separately from release-stage and supplier-inclusive activities. Assign each incurred exchange once to the original cohort; do not treat lack of current release as zero activity. Keep a separate service result if original denominator is unavailable."
      unit: "kWh and each actual service unit separately"
      frequency: "each record and period close"
      temporal_coverage: "later periods tied to original release cohort"
      site_scope: "actual downstream stock/service site and identified external envelopes"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter and invoice evidence; causal attribution; original denominator and double-count audit"
  calculation_rules:
    - id: normalize_release
      applies_to: "all inventory rows"
      rule: "For positive eligible first-release Q, divide only its attributable release-cohort exchanges by Q kg; preserve numerator units and the 1 kg reference denominator. G/J/D and later-service exchanges do not enter a new production account. With current Q zero or missing, retain actual unnormalized mass and burden records, never divide by Q and never discard incremental services. Link later increments to their original cohort; normalization is permitted only against that cohort’s verified positive original release mass Q_origin, kept separate by cohort. If Q_origin is unavailable, disclose a separate unnormalized service result and unresolved denominator; no completed normalized dataset."
      inputs:
        - cp_mass
        - cp_activity
        - cp_burdens
        - cp_released
        - cp_released_activity
      output: "exchange per 1 kg reference flow"
      source_ids:
        - eu-pef-2021-corrected
    - id: prerelease_balance
      applies_to: "all datasets"
      rule: "U0 + I = Q + U1 + S + W + T. U0/U1 include all inside-perimeter pre-release chemical stock, including same-site retained samples; internal moves do not change them. I is gross actual external never-prior-released receipt, with unreleased sample returns in a separately identified subgroup; S is gross actual external sample transfer, not onsite retention or consumption. W is actual other outward chemical waste/loss; T is unreleased external product transfer. Record each external sample endpoint in cp_samples; do not count service waste in both S and W. Investigate residual against measurement uncertainty."
      inputs:
        - cp_mass
        - cp_identity
        - cp_samples
      output: "pre-release physical closure"
      source_ids: []
    - id: postrelease_balance
      applies_to: "all datasets"
      rule: "R0 + Q + G + J = R1 + D + L. R0/R1 are released opening/closing stocks; G is genuine old released-product return; J is other external already-released receipt; D is actual outward shipment/transfer; L is other actual documented outward released-material removal, including external samples, with each endpoint separate from D. Same-site retained released samples remain in R1; no onsite transformation is assumed. Q leaves the pre-account and enters this post-account identically and cancels when combined. R0, G, J and D never create Q."
      inputs:
        - cp_mass
        - cp_identity
        - cp_released
        - cp_samples
      output: "post-release and combined physical closure"
      source_ids: []
    - id: component_balance
      applies_to: "actual packaging components"
      rule: "For each component, opening + purchased first receipt + first non-purchase external receipt + proven same-object return = closing inside the declared perimeter + actual outward movement + disposal + other documented removal. Internal moves cancel; classify each external receipt once. Counts convert to mass only using the measured same-component unit mass. Reusable offsite objects are outside inside-stock counts."
      inputs:
        - cp_packaging
      output: "component physical closure without invented quantities"
      source_ids:
        - eu-pef-2021-corrected
    - id: burden_balance
      applies_to: "all datasets"
      rule: "Opening carry + external incoming remaining incurred share + genuinely new burden = current attribution + closing carry + mutually exclusive external transfer/other attribution. Reconcile in each original exchange unit, per original object and cohort. Preserve chemical and packaging history separately; no repeated full background burden on return, retest or repacking."
      inputs:
        - cp_burdens
        - cp_packaging
      output: "once-only environmental burden closure"
      source_ids:
        - eu-pef-2021-corrected
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference_product"
      requirement: "Require exact labelled product flow and verified native property/unit chain before actual linking; ordinary carbonate is not equivalent. Keep lot composition and atom fraction separately."
      evidence: "Original supplier lot records and direct flow read; sigma-carbonate-492027; cil-carbonate-sds-2017"
    - id: dq_gate
      applies_to: "first_release"
      requirement: "Prove never-prior-released status, actual first release responsibility and outsourced handover. Do not infer an eligible site or production route from sale or retest policy."
      evidence: "cp_identity; original release genealogy"
    - id: dq_inventory
      applies_to: "all datasets"
      requirement: "Resolve packaging components, service envelopes and every actual environmental exchange; distinguish missing, justified absence and measured zero. No inferred emission factors, operating conditions, yields or quantitative ranges."
      evidence: "cp_activity; cp_packaging; cp_burdens; supplier dataset audit"
    - id: dq_services
      applies_to: "released_stock"
      requirement: "Retain raw G/J/D/L, stocks and incremental services at zero current Q; attribute only to the original cohort and a verified positive Q_origin or disclose an unnormalized service result. Conditional card exclusion needs actual absence evidence, not a guessed zero."
      evidence: "cp_released; cp_released_activity; cp_samples"
    - id: dq_time
      applies_to: "all datasets"
      requirement: "Declare actual period/geography/technology, meter and mass uncertainty and sampling/retention status; a historical SDS or support XML is not a current platform/lot observation."
      evidence: "cp_identity; cp_mass; source editions and supplier compatibility assessment"
validation_rules:
  - rule_id: validation_identity
    applies_to: "all datasets"
    rule: "Reject labelled-product modelling with ordinary carbonate/calcite identity or natural-range reference carbonate. Verify one exact reference output, native property/unit support and all required qualifiers; missing product UUID remains a linking gap."
    source_ids:
      - wco-hs2022-ch28
      - sigma-carbonate-492027
      - iaea-610
  - rule_id: validation_gate
    applies_to: "all datasets"
    rule: "Reject first-release applicability if actual lot history cannot establish Q or shows already released bulk. Packing on demand, a new vial, purchase, resale or re-test cannot renew Q or upstream manufacturing burden. Require responsible-party and actual outsourced-handover evidence."
    source_ids:
      - sigma-carbonate-492027
      - cil-retest-2025
  - rule_id: validation_mass
    applies_to: "all datasets"
    rule: "Require Q greater than zero and both chemical ledgers to close within documented uncertainty; cancel Q across accounts. Keep retained samples, returned chemical, waste and released stock mutually exclusive. An unclosed difference is a finding, not an emission or new product."
    source_ids: []
  - rule_id: validation_packaging
    applies_to: "all datasets"
    rule: "Require actual component identities, atomic cards, physical stocks/movements and inherited/new burden coverage. Distinguish purchase, first non-purchase receipt and proven genuine return regardless of supplier inclusion. Missing supplier evidence blocks completeness rather than erasing the exchange."
    source_ids:
      - eu-pef-2021-corrected
  - rule_id: validation_burdens
    applies_to: "all datasets"
    rule: "Require product-compatible closed-box upstream coverage and separate once-only chemical/packaging history balances; reconcile local and outsourced activities. No full-footprint, usable background or zero-burden claim while coverage gaps persist. Numeric closure does not establish allocation validity or scientific approval."
    source_ids:
      - eu-pef-2021-corrected
  - rule_id: validation_services
    applies_to: "all datasets"
    rule: "Require gross G/J/D and external sample interfaces when they occur; preserve same-site retained sample stocks. Reject current-period division at zero Q, lost incremental services, cohort mixing or renewed full background burdens on old returned/retested stock. A separate downstream service account never creates Q."
    source_ids:
      - cil-retest-2025
      - eu-pef-2021-corrected
  - rule_id: validation_units
    applies_to: "all datasets"
    rule: "Reject isotope atom percent as whole-product mass fraction and unverified supplier-energy property inference. Check kilogram conversion, net mass/tare, actual Q and each numerator's unit independently."
    source_ids:
      - sigma-carbonate-492027
published_dataset_profile:
  dataset_role: "Conditional prospective foreground methodology; a completed independently reviewed dataset may serve as secondary_dataset or background_dataset only for its declared gate"
  downstream_use: "Exact labelled-carbonate supply modelling after first-release applicability, UUID, upstream and inventory completeness are independently established"
  allowed_use: "Prepare collection and review evidence; subsequently link only the exact compatible product/gate and disclose remaining uncertainty"
  excluded_use: "Current incomplete inventories as completed backgrounds; classification-wide manufacture; retail splitting as new production; internal isotope preparation instructions; radioactive/nuclear use; ordinary-carbonate substitution; automatic PEF conformity"
  required_metadata: "All reference qualifiers; lot genealogy and responsible release; Q; boundaries and two stock ledgers; native flow/property/units; supplier and service envelopes; component/burden ledgers; period/geography; allocation and uncertainty"
  required_quality_disclosure: "Separate structural checks, unresolved flow/packaging/supplier/gate evidence, scientific review and empirical qualification. Authored rules and source identities are not observed factory data or methodology approval."
  update_trigger: "Verified lot release/certificate or actual gate changes; direct flow identities; supplier/component/service coverage; route/specification or period/geography changes; independent review"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3 explanatory notes, 30 June 2025, PDF p161; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Frozen 34260 title and neighbours 34240 / 34250 / 3427; no product process or quantity."
  - id: "unsd-cpc3-2026"
    type: "official_guidance"
    reference: "UNSD CPC3 explanatory notes, 23 October 2026, CPC3 row 1429 A:D; https://unsdsna.azure-api.net/files/pages/cpc/CPC_Ver3_Exp_Notes_2026-10-23_for_Website.xlsx"
    used_for: "Same 34260 title and HS 2022 heading 2845 linkage. Supplemental classification context only; no frozen-source mutation."
  - id: "wco-hs2022-ch28"
    type: "official_guidance"
    reference: "WCO HS 2022 chapter 28, Note 6 final paragraph, heading 28.45; https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0628_2022e.pdf?la=en"
    used_for: "Tariff identity distinction for modified isotopic composition; no isotope preparation or process data."
  - id: "sigma-carbonate-492027"
    type: "handbook"
    reference: "Sigma-Aldrich calcium carbonate-13C, product 492027, product page accessed 22 November 2026; https://www.sigmaaldrich.com/US/en/product/aldrich/492027"
    used_for: "Labelled chemical identity, solid state and catalogue 99 atom-percent specification; product-specific Packaging section allows on-demand packing from bulk. No actual lot, chemical assay, first release, container material or manufacturing burden."
  - id: "naviaux-calcite-2019"
    type: "literature"
    reference: "Naviaux et al. (2019), Temperature dependence of calcite dissolution kinetics in seawater, Methods §2, PDF p3; https://par.nsf.gov/servlets/purl/10123239"
    used_for: "Independent actual purchase of labelled powder SKU 492027. Only this purchase observation is used; postpurchase laboratory sample preparation/dissolution is outside the release boundary. No first-release, manufacturing inventory or second-supplier evidence."
  - id: "cil-carbonate-sds-2017"
    type: "handbook"
    reference: "CIL CALCIUM CARBONATE (13C, 99%), CLM-7564 SDS, v3.0, 23 May 2017, §§1–3 and physical-state fields §9; https://isotope.com/product/attachment/CLM-7564-1/SDS%20-%20CLM-7564.pdf"
    used_for: "Corresponding labelled single substance and solid powder; not classified under the stated systems in this edition. Unlabelled CAS/EC entries are expressly qualified in the original. No lot certificate, current universal hazard assurance, chemical purity assay, first release or environmental inventory."
  - id: "sigma-product-dating-2016"
    type: "handbook"
    reference: "Sigma-Aldrich, Product Dating Information Statement, 9 March 2016, p1 introductory paragraph and Recommended Retest Dated Products; https://www.sigmaaldrich.com/deepweb/assets/sigmaaldrich/marketing/global/documents/178/822/product-dating-information-statement.pdf"
    used_for: "Historical general quality-date definitions: quality release follows analytical compliance review; later retest dates may change. Distinguishes events, not an actual 492027 batch certificate, original manufacturer first release, current universal policy or environmental inventory; source-supplier prior release remains to be traced."
  - id: "cil-retest-2025"
    type: "handbook"
    reference: "Jeffrey Drew, CIL North America ISO Quality Manager, Implementation of Retest and Expiration Dates on Certificates of Analysis, 15 July 2025, p1; https://isotope.com/content/files/images/retest%20and%20expiration%20dates%20on%20coas%20july%202025.pdf"
    used_for: "Distinguishes retest and expiry dates for unopened correctly stored material; post-2023 CoA policy is not a specific batch history, actual expiry, new production or environmental dataset."
  - id: "iaea-610"
    type: "official_guidance"
    reference: "IAEA-610 carbonate reference material, product description and stable-isotope reference information; https://analytical-reference-materials.iaea.org/iaea-610"
    used_for: "Natural-range isotope-calibration carbonate counterexample: metrological status or delta value alone does not identify a deliberately labelled compound. Not a substitute flow."
  - id: "eu-pef-2021-corrected"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, consolidated corrected 23 May 2022, Annex I §§3.2.1–3.2.2,4.2,4.3,4.4.9,4.5 (reference PDF p33; reuse p79; allocation p87); https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02021H2279-20211230"
    used_for: "General reference/boundary/completeness/allocation/reuse principles only. The two chemical ledgers and object/cohort burden ledger are this PCR's declared accounting requirements, not quoted EU formulas. No product-specific inventory, rotation count, burden factor or PEF approval is inferred."
