    applies_to: "recipe and assay"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "kg/kg"
    rule: "Use component mass = solution mass × measured mass fraction; verify complete water/solute closure. ABV/proof and GC area-percent are not mass fraction without a validated conversion/calibration for this denatured matrix. Historical absolute-ethanol recipe denominators are not final mixture volume."
  - id: energy_basis
