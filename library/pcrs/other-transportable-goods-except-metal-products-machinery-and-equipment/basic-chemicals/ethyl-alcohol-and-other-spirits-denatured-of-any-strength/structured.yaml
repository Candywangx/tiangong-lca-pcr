    rule: "Directly attribute batch ingredients and separable stage utilities first. For unavoidable shared services use a measured causal physical driver; retain driver, totals, exclusions and sensitivity. Economic allocation requires documented failure of physical causality and actual consistent prices/period. No universal allocation percentage is prescribed."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_physical
    applies_to: "blend"
    rule: "Keep the unallocated total physical mass, C/H/O/N and every actual element, water and process-link ledger distinct from allocated environmental burdens. Record opening/closing stocks, product retained in equipment, adsorbate/moisture, internal paired batches, returns, maintenance removals/replacements and full packing/container physical observations separately. Amortized equipment/container service burdens and allocated environmental inventories cannot replace these gross physical observations or be used to force mass closure. Never multiply physical reference/co-product outputs by burden shares. Internal recovery is not a co-product credit; discarded liquid remains waste. Exported saleable recovered solvent requires separately evidenced identity, quality, buyer/function and allocation boundary before extending this PCR."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "blend"
      flow_role: "accepted product"
      record_type: "foreground_record"
      raw_fields: "SKU; lot; gross/tare/net mass; acceptance; actual assay basis; ethanol/IPA/MEK/denatonium/water; density; temperature; method; uncertainty; tank stock"
      collection_method: "Calibrated net weighing or mass meter; batch release composition and traceable laboratory calibration. Verify density of this actual mixture at measured temperature. Determine ethanol by matrix-qualified CLEN143 GC-FID, denatonium benzoate by CLEN280 HPLC-UV and water independently by ketone-compatible Karl Fischer with reagent blank/drift, standards and recovery validation for this matrix. TM207 supports IPA/MEK only within its demonstrated matrix/range, not denatonium, water or ethanol mass fraction. Retain method-specific calibration, dilution, duplicate/QC acceptance, recovery, interferences and detection/quantitation limits. CLEN280 yields mg/L solution; convert to kg/kg only with actual same-solution density and temperature. CLEN143 requires measured sample and calibration-standard density at 20 °C for its mass/volume conversion; binary alcohol tables are not a whole-mixture assay. Ketone side reactions invalidate an unqualified standard methanolic KF result. Neither assay standards, method performance ranges nor reference temperatures establish the actual lot purity or recipe."
      unit: "kg"
      frequency: "Each lot/event; stage meters over reporting period"
      temporal_coverage: "Declared complete reporting period, stock opening/closing and abnormal events"
      site_scope: "Same site, SKU and configuration; segregate actual recipe campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, representative sampling, source coverage, uncertainty and reconciliation records"
    - protocol_id: cp_material
      process_id: "blend"
      flow_role: "each recipe input"
      record_type: "foreground_record"
      raw_fields: "receipt and dosing; supplier/SKU/CAS; solution/active/carrier basis; actual purity; density/temperature; stock; ethanol route; elemental composition including C/H/O/N and actual other elements; carbon content and fossil/biogenic origin of every carbon-bearing ingredient"
      collection_method: "Reconcile calibrated weighed additions, invoices, lot CoA/SDS and stock changes. Weigh solid microdoses on a validated scale; account on-site carrier using the already measured inputs. Obtain supplier route and origin records; do not infer bio-origin from a generic ethanol name."
      unit: "kg"
      frequency: "Each lot/event; stage meters over reporting period"
      temporal_coverage: "Declared complete reporting period, stock opening/closing and abnormal events"
      site_scope: "Same site, SKU and configuration; segregate actual recipe campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, representative sampling, source coverage, uncertainty and reconciliation records"
    - protocol_id: cp_cleaning
      process_id: "blend"
      flow_role: "cleaning water"
      record_type: "foreground_record"
      raw_fields: "water meter; cleaning event; water quality; rinse volume/mass; destination; coverage"
      collection_method: "Separate calibrated water-only cleaning meters from ingredient addition; reconcile the resulting liquid waste and retained tank inventory."
      unit: "kg"
      frequency: "Each lot/event; stage meters over reporting period"
      temporal_coverage: "Declared complete reporting period, stock opening/closing and abnormal events"
      site_scope: "Same site, SKU and configuration; segregate actual recipe campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, representative sampling, source coverage, uncertainty and reconciliation records"
    - protocol_id: cp_energy
      process_id: "blend"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "stage meter kWh; voltage; supplier/country/year; losses boundary; reporting period; shared loads"
      collection_method: "Read calibrated stage meters; include QA and controls; reconcile site total and attribution driver; retain native kWh and exact MJ conversion."
      unit: "MJ"
      frequency: "Each lot/event; stage meters over reporting period"
      temporal_coverage: "Declared complete reporting period, stock opening/closing and abnormal events"
      site_scope: "Same site, SKU and configuration; segregate actual recipe campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, representative sampling, source coverage, uncertainty and reconciliation records"
    - protocol_id: cp_utility
      process_id: "blend"
      flow_role: "nitrogen and activated carbon, separately"
      record_type: "foreground_record"
      raw_fields: "utility identity; each delivery/meter; nitrogen state/purity/pressure; carbon grade/origin/moisture; charge/change; supplier baseline"
      collection_method: "Collect one record per atomic utility. Validate nitrogen gas conversion and activated-carbon grade; no borrowed pressure, adsorption capacity or efficiency."
      unit: "kg"
      frequency: "Each lot/event; stage meters over reporting period"
      temporal_coverage: "Declared complete reporting period, stock opening/closing and abnormal events"
      site_scope: "Same site, SKU and configuration; segregate actual recipe campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, representative sampling, source coverage, uncertainty and reconciliation records"
    - protocol_id: cp_waste
      process_id: "blend"
      flow_role: "each external liquid or spent-carbon stream"
      record_type: "foreground_record"
      raw_fields: "separate lot; full wet mass; water; ethanol/IPA/MEK/denatonium; COD; dry carbon/adsorbate; waste status; receiver; treatment and receipt"
      collection_method: "Weigh each exported waste lot and sample actual chemistry; preserve destination and provider acceptance records. Off-spec solvent, aqueous rinse and spent adsorbent must not be collapsed."
      unit: "kg"
      frequency: "Each lot/event; stage meters over reporting period"
      temporal_coverage: "Declared complete reporting period, stock opening/closing and abnormal events"
      site_scope: "Same site, SKU and configuration; segregate actual recipe campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, representative sampling, source coverage, uncertainty and reconciliation records"
    - protocol_id: cp_air
      process_id: "blend"
      flow_role: "each emitted species"
      record_type: "foreground_record"
      raw_fields: "source/vent; species/CAS; subcompartment; concentration and sampling method; exhaust flow and gas-state basis; operating time; capture/return; fugitives; detection limits; carbon source; powder size; inlet/outlet humidity and wet/dry gas flow; net uptake/release; residual NMVOC basis/overlap"
      collection_method: "Quantify actual site-exit species with validated monitoring or a site-calibrated storage/transfer mass-balance model, including fugitives and each control path. Integrate compatible species concentration and gas volume over operating time; validate models with measurements. TM207 is a liquid denaturant assay, not an exhaust-air test. Record non-detect limits/coverage, not an assumed zero."
      unit: "kg"
      frequency: "Each lot/event; stage meters over reporting period"
      temporal_coverage: "Declared complete reporting period, stock opening/closing and abnormal events"
      site_scope: "Same site, SKU and configuration; segregate actual recipe campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, representative sampling, source coverage, uncertainty and reconciliation records"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "a_j = A_j / P; A_j is attributable measured exchange j for the reporting period; P is accepted net kg of the full supplied mixture from cp_product. Retain each native numerator unit; output exchange per 1 kg reference flow."
      inputs:
        - A_j
        - P
        - cp_product
      output: "a_j"
      source_ids: []
    - id: solution_mass
      applies_to: "all inventory rows"
      rule: "m = rho(T) × V(T), after harmonizing volume and density units for the actual same solution; use calibrated mass directly when available."
      inputs:
        - cp_product
        - cp_material
        - cp_waste
      output: "m"
      source_ids:
        - merck-denatured-103771
    - id: component_balance
      applies_to: "all inventory rows"
      rule: "For each physical component k: opening stock_k + external input_k = accepted output_k + external waste_k + site-exit emission_k + closing stock_k + documented residual_k. Compute each solution contribution from measured mass fractions, retain signed residual with uncertainty, and cancel equal internal transfers. Apply the ledger to total physical mass, each constituent and C/H/O/N plus every actual other element, including dissolved or hydration water, impurities, gas uptake/release, retained adsorbent, full containers and maintenance observations. Preserve fossil/biogenic carbon separately for every carbon-bearing ingredient and emitted species. Use actual salt/hydrate formula and assay; do not equate denatonium cation to complete benzoate salt or invent purity. No invented yield, element destruction or loss closure."
      inputs:
        - cp_product
        - cp_material
        - cp_cleaning
        - cp_utility
        - cp_waste
        - cp_air
      output: "Unallocated physical ledger"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Electrical energy in MJ = measured electrical energy in kWh × 3.6; retain supplier quantity boundary."
      inputs:
        - cp_energy
      output: "MJ"
      source_ids: []
  data_quality_requirements:
    - id: quality_composition
      applies_to: "reference"
      requirement: "Require actual whole-mixture recipe and assay, water/impurities, density/temperature, measured net acceptance and intended grade; a legal label and ethanol-only assay do not define the mixture. Use the independently qualified ethanol, volatile-denaturant, denatonium and ketone-compatible water methods; declare analytical versus industrial grade from actual specifications."
      evidence: "cp_product; ttb-tm207-2018; clen-ethanol-2023; clen-denatonium-2024; mettler-kf-2012; merck-denatured-103771"
    - id: quality_provider
      applies_to: "all inventory rows"
      requirement: "Verify flow identity separately from dataset amount/reference compatibility. An unresolved non-reference UUID or provider gap stays explicit and prevents a complete background-inclusive claim for that scope."
      evidence: "cp_material; cp_utility; cp_waste"
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "Use the same accepted product denominator and period in both languages and every row. Retain stock, rejected batches, abnormal spills, attribution and uncertainty; do not impose historical/single-plant ratios as defaults."
      evidence: "cp_product; cp_material; cp_energy; cp_waste; cp_air"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference"
    rule: "Reject undenatured or fuel ethanol as the final mixture; require actual supported constituent set, route and every reference qualifier. Exactly one final product row must equal 1 kg reference flow."
    source_ids:
      - ttb-denatured
      - merck-denatured-103771
  - rule_id: validate_balance
    applies_to: "blend"
    rule: "Reconcile complete physical mass, water, C/H/O/N and all actual element ledgers and equal internal links before burden allocation; disclose residuals, uncertainty and absent supplier origin. Biological CO2 in linked upstream LCI must not be deleted merely because a climate-reporting convention separates it. This noncombustive formulation does not invent a CO2 source."
    source_ids: []
  - rule_id: validate_emissions
    applies_to: "blend"
    rule: "Check actual medium/submedium, CAS, species mass and source coverage. Keep waste mixtures separate from elementary species, measured emissions separate from captured/internal material, and speciated VOC separate from duplicate totals while retaining any measured, nonoverlapping NMVOC residual on a verified common basis. Net H2O and atmospheric pass-through require separate inlet/outlet observations; wet exhaust is not one chemical species. Particle-size bins/chemical fractions must not overlap in summed elementary exchanges."
    source_ids:
      - jrc-efs-2006
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Unresolved identities, provider bases, unmeasured applicable sources or excluded additional plant activities must be reported as incomplete scope. Identity lookup is not methodology approval, chemical/legal suitability or complete dataset validation."
    source_ids:
      - ttb-denatured
      - jrc-efs-2006
published_dataset_profile:
  dataset_role: "Site/SKU-specific foreground formulation dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Use only for the declared supplied mixture, composition and bulk boundary; background-inclusive use needs compatible upstream/transport/treatment links."
  excluded_use: "Pure ethanol equivalent; arbitrary legal denaturing recipe; fuel/beverage use; unsupported whole upstream plant; universal default inventory"
  required_metadata: "All reference qualifiers; flow/provider bases; full physical ledger; stage collection; allocation; stock; site/year; source limitations"
  required_quality_disclosure: "UUID gaps, supplier/background gaps, measurement coverage, residuals/uncertainty and configuration exclusions; independent methodology approval remains pending"
  update_trigger: "Change of recipe/component, upstream source/carbon origin, water/assay basis, supply/utility/control configuration, legal specification or measured balance"
data_sources:
  - id: "ttb-denatured"
    type: "official_guidance"
    reference: "[TTB Denatured Alcohol](https://www.ttb.gov/regulated-commodities/industrial-alcohol/industrial-alcohol-denatured-alcohol)"
    used_for: "SDA/CDA nonbeverage distinctions; no recipe or use approval is inferred."
  - id: "eu-denaturing-2017"
    type: "official_guidance"
    reference: "[Commission Implementing Regulation (EU) 2017/1112, Annex](https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32017R1112)"
    used_for: "Historical original act establishes IPA/MEK/denatonium identities and absolute-ethanol basis distinction. Not a current worldwide legal mandate or amount default."
  - id: "merck-denatured-103771"
    type: "literature"
    reference: "[Merck/Supelco product 103771, Properties and General description](https://www.sigmaaldrich.com/US/en/product/mm/103771)"
    used_for: "Producer original product page read: concrete compound set, distinct assay and density/temperature declarations. Single SKU only; no concentrations, impurity limits, density or packaged form transferred as defaults."
  - id: "jrc-efs-2006"
    type: "official_guidance"
    reference: "[JRC Emissions from Storage BREF, July 2006](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-03/efs_bref_0706_0.pdf), §§4.1.2.2.3, 4.1.3.15.2, 5.1.1.1 and 5.2.2.2; printed pp.119, 145–146, 259–260, 271 / PDF pp.147, 173–174, 287–288, 299"
    used_for: "Horizontal liquid storage/transfer and monitoring/control conditions; significance and measurement frequency are case-specific, large-facility conditions retained. No ethanol recipe, universal loss or energy factor."
  - id: "ttb-tm207-2018"
    type: "official_guidance"
    reference: "[TTB SSD:TM:207 Rev.1, issued 23 January 2018](https://www.ttb.gov/media/72467/download?inline=), pp.1–8, Scope, limitations, sample preparation, QC, calculations and reporting"
    used_for: "Primary HS-GC-MSD volatile-denaturant method, including IPA/MEK; original courtesy copy, not automatically updated. Require actual matrix/range/limit validation; not nonvolatile denatonium, water, ethanol mass-fraction or exhaust-air method."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "[GHG Protocol Product Life Cycle Accounting and Reporting Standard, 2011](https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf), Tables 9.1–9.2 printed p.63 / PDF p.65"
    used_for: "Subdivision and causal physical allocation hierarchy; no fixed allocation share; the separate physical ledger is a declared foreground collection requirement."
  - id: "hmrc-denaturing-2025"
    type: "official_guidance"
    reference: "[HMRC Excise Notice 473, updated 18 November 2025](https://www.gov.uk/government/publications/excise-notice-473-production-distribution-and-use-of-denatured-alcohol/excise-notice-473-production-distribution-and-use-of-denatured-alcohol), §§3.1, 3.6, 5.3, 13–14 and 20.2"
    used_for: "Primary separate-receipt/mixing, water-addition and stock-record example. UK-specific and time-specific; no worldwide legal rule, prescribed dose or site-approval claim."
  - id: "clen-ethanol-2023"
    type: "official_guidance"
    reference: "[CLEN ILIADe 143:2023, version 25 July 2023](https://taxation-customs.ec.europa.eu/system/files/2023-09/ILIADe143_Ethanol_v25July2023_CLENmethod.pdf), §§1–8 and Annex, PDF pp.1–7"
    used_for: "Primary GC-FID ethanol assay separates IPA/MEK; preserve calibration, sample density/20 °C and mass/volume distinction. Original reagent CAS entry is inconsistent with the ethanol identity; verify the actual reagent rather than copying that entry. No lot purity default."
  - id: "clen-denatonium-2024"
    type: "official_guidance"
    reference: "[CLEN ILIADe 280:2024, version 13 February 2024](https://taxation-customs.ec.europa.eu/system/files/2023-09/ILIADe280_DenatoniumB_v25July2023_CLENmethod.pdf), §§1–8 and Annex, PDF pp.1–6"
    used_for: "Primary HPLC-UV denatonium benzoate assay in denatured alcohol; retain working range, interference separation, calibration, QC and solution mg/L basis. Regulatory absolute-ethanol conversion is separate from whole-mixture mass."
  - id: "mettler-kf-2012"
    type: "literature"
    reference: "[Mettler-Toledo KF Guide 1, August 2012](https://www.mt.com/dam/MT-NA/KarlFischerHelpPage/KF_Guide_1.pdf), §§1.3, 2.1.4–2.1.5 and 2.2.5, printed pp.9–10, 13, 18 / PDF pp.9–10, 13, 18"
    used_for: "Primary instrument-method guidance on ketone side reactions and special KF reagents. Require actual-matrix blank/recovery and technique qualification; no denatured-lot water value or universal reagent suitability."
