      name: "Mass and composition"
      uuid: ""
    required_unit: "kg"
    rule: "Convert volume to mass only using measured density of that actual whole solution at its stated temperature: m = rho(T) × V(T), with consistent units. Never use pure-ethanol density for the mixture or sum additive liquid volumes. Retain mass and volume assay bases distinctly."
