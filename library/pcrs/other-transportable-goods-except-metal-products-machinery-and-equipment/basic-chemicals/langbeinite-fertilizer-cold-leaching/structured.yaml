system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "cold_leach"
      rule: "Include ore receipt/crushing, selective impurity washing, debrining, drying, screening, storage/loadout and actual pollution controls. Aggregate these into one foreground unit to preserve one final product exchange; retain separate stage meters and physical handoffs with equal amounts on both ends and reconciled composition/stock changes. No KCl reaction, MgCl2 coproduct or flotation recipe is assumed."
      source_ids:
        - epa-mineral-1975
    - rule_id: boundary_streams
      applies_to: "cold_leach"
      rule: "Inventory all actual wastewater/waste gas origins, water flow and salt/species loads, residues, fugitive dust, startup/shutdown and control failures. CWW BAT2/3 inventory/monitoring concepts are used as transferable recording methods; chemical-sector legal scope, biological treatment assumptions and BAT emission limits/frequencies are not applied to this mineral route."
      source_ids:
        - jrc-cww-2016
        - eccc-potash-2017
    - rule_id: boundary_receivers
      applies_to: "cold_leach"
      rule: "Contain leach/control wastewater for external verified salt-compatible treatment, separately from wet clay tailings and collected dry dust. Receiver acceptance, composition, transport, final fate and long-term salt/water releases are required. An actual direct outfall, seepage or onsite evaporation pond lies outside this inventory variant and requires atomic water/species/medium rows and treatment expansion before use. A legal no-discharge description is not proof of actual zero release."
      source_ids:
        - epa-mineral-1975
        - jrc-cww-2016
    - rule_id: boundary_downstream
      applies_to: "cold_leach"
      rule: "Exclude agricultural use, nutrient substitution credit, crop yield, distribution after plant gate and packaging from the bulk reference. Retain burdens through waste management. Other actual consumed materials or releases cannot be omitted as an exclusion; reassess applicability and add atomic exchanges."
      source_ids:
        - un-cpc3-2025
boundary_abstraction:
  declared_starting_condition: "Natural mined langbeinite-bearing ore delivered to aboveground cold-leach processing, with actual mineral/impurity/moisture composition and upstream extraction/transport burden"
  starting_condition_role: "background_dataset"
  product_classification_scope: "CPC 3.0 34639; narrower natural langbeinite fertilizer and cold-leach route only"
  recursive_input_rule: "A same-category finished fertilizer input is not untreated mined ore. Purchased refined langbeinite requires a finishing-only boundary with its prior burdens and separate applicability review; do not recurse or silently replace the ore route."
  upstream_dataset_requirement: "Actual ore mining/transport; treated water supply; grid electricity; fossil pipeline gas at compatible volume basis; verified waste receiver transport/treatment including relevant long-term salt releases and closure/aftercare. Missing background coverage is incomplete, not zero."
  disclosure: "Declare outsourced mining and waste services, site boundary, internal recycle/stocks, utilities and control equipment, full accounting period, allocation, capital/maintenance exclusions and their significance, and receiver release scenario/time horizon."
