allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "cold_leach"
    rule: "For the declared single-grade campaign, attribute attributable processing burdens to accepted langbeinite output; retain rejects, mineral losses and waste-management burdens. No automatic credit for NaCl, MgCl2, soluble nutrients or fine dust. A verified sale of another grade or external mineral concentrate requires explicit coproduct accounting."
    source_ids:
      - epa-mineral-1975
  - rule_id: allocation_shared
    applies_to: "cold_leach"
    rule: "First subdivide stage meters and campaigns using physical causation. If genuine joint saleable outputs remain inseparable, declare a justified physical allocation basis; where that cannot represent causation, use documented representative revenue allocation and sensitivity. Record prices/grade/period and uncertainty. Never apply an allocation fraction to physical outputs or material balances: allocate only environmental burdens after recording actual whole streams."
    source_ids:
      - jrc-cww-2016
      - epa-mineral-1975
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "The hierarchy in allocation_shared is this PCR's transparent modelling convention; these sources support physical process/stream distinctions, not a mandated economic allocation factor. Offsite conversion of sold fines to K2SO4 is a separate process; internal returning fines are no coproduct. The physical process graph, whole mass/water/K/Mg/S/Na/Cl balance, and allocated burden ledger remain separate and reconcilable."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "cold_leach"
      flow_role: "langbeinite_product"
      record_type: "acceptance and assay"
      raw_fields: "producer/site/SKU; net accepted mass Q; mineral phase; moisture; K/Mg/S; NaCl/insolubles; particle size; wet/dry basis; stocks/rejects"
      collection_method: "Calibrated net weighing and traceable representative lot mineral/chemical/moisture tests; verify natural ore and cold-leach route against process records; aggregation calculation: Sum accepted as-delivered net output Q; inventory numerator for each row divided by Q kg, per 1 kg reference flow"
      unit: "kg; mass fractions"
      frequency: "Each accepted lot and period reconciliation"
      temporal_coverage: "Complete declared period including startup/shutdown; state dates and coverage, normally annual or justified full campaign"
      site_scope: "Same grade/site/boundary as inventories"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration, tare/loadout records, assay methods/sampling, grade acceptance, stock reconciliation"
    - protocol_id: cp_material
      process_id: "cold_leach"
      flow_role: "ore"
      record_type: "receiving and assays"
      raw_fields: "received net ore; opening/closing stocks; mine origin; langbeinite/NaCl/KCl/clay/gangue/water assay; upstream mining/transport"
      collection_method: "Weigh received ore, reconcile stocks and actual processing charge; analyze representative mineral/element/water composition, with method uncertainty; aggregation calculation: Net processed external ore / Q kg accepted output, per 1 kg reference flow"
      unit: "kg; mass fractions"
      frequency: "Each receipt/charge and accounting period"
      temporal_coverage: "Same complete period as Q"
      site_scope: "Actual ore supply and cold-leach plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighbridge, sampling/mineral tests, mine/supplier records, upstream data scope"
    - protocol_id: cp_utilities
      process_id: "cold_leach"
      flow_role: "water; electricity; gas"
      record_type: "meters and provider definitions"
      raw_fields: "each external meter; branch/stage readings; recycle; water treatment/salts; gas T/P/dry basis/composition/Z/provider m3 definition; electricity region/year/voltage/losses"
      collection_method: "Calibrated input/submeters and supplier primary records; reconcile shared utilities by causal allocation; verify water treatment, gas reference-volume conversion and consumer electricity boundary; aggregation calculation: Each attributable external utility numerator / Q kg accepted output, per 1 kg reference flow; internal circulations excluded"
      unit: "kg; m3; kWh; MJ"
      frequency: "Continuous/shift records and invoices with period reconciliation"
      temporal_coverage: "Same complete period as Q including downtime and controls"
      site_scope: "Plant and each utility provider"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration/coverage, provider basis/analysis, stage reconciliation, documented shared allocation"
    - protocol_id: cp_residues
      process_id: "cold_leach"
      flow_role: "leach_brine; clay_tailings; captured_dust"
      record_type: "waste transfer and characterization"
      raw_fields: "separate stream mass; volume/density when used; water/solids/salts/mineral composition; stock changes; recycled fraction; receiver acceptance/transport/fate"
      collection_method: "Calibrated transfer weighing or metered volume with measured matched density; representative chemical/mineral/moisture tests; confirm receiver and treatment including long-term releases; aggregation calculation: Each actual whole external waste stream / Q kg accepted output, per 1 kg reference flow; reconcile inventory and recycle separately"
      unit: "kg; m3; mass fractions"
      frequency: "Each transfer and representative tests after changes, reconciled each period"
      temporal_coverage: "Same complete period as Q; declare receiver scenario horizon"
      site_scope: "Each distinct site exit and external receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Shipment/receiver records, compatible treatment dataset, samples/density, salinity conditions, closure/aftercare assumptions"
    - protocol_id: cp_air
      process_id: "cold_leach"
      flow_role: "individual elementary outputs"
      record_type: "source monitoring and balances"
      raw_fields: "source/stack/fugitive path; actual species; particle interval/filterable-condensable basis; flow/concentration/hours; T/P/wet-dry/O2 corrections; operating state; water/fuel carbon; non-detect limits"
      collection_method: "Representative calibrated source-specific testing and continuous operating/flow records; integrate concentration times matched gas flow and duration, or documented physically valid species/carbon/water balance; no transplanted boiler factors; aggregation calculation: Sum each nonduplicated species/particle release / Q kg accepted output, per 1 kg reference flow"
      unit: "kg; concentration; gas volume/time"
      frequency: "Representative tests at changed conditions with continuous operating-time records"
      temporal_coverage: "Same complete period as Q including startups/upsets; disclose unmeasured states"
      site_scope: "Dryer, crusher, screens, handling, dust controls and gas leaks separately"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling/QA, detection limits, gas-basis/speciation compatibility, fugitive coverage, balance closure, uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each row j, x_j = A_j / Q; A_j is the attributable measured or justified calculated external exchange over the common period in its declared numerator unit; Q is accepted net product kg from cp_product; x_j is exchange per 1 kg reference flow. Product output equals 1 kg. Use Q > 0; keep shared allocation only on burdens. Retain raw, unallocated external totals for the same route, supplied state, grade and complete period, including attributable failed and zero-accepted-output batches, downtime, starts/stops, returns and rework. Reconcile opening/closing work in progress and finished stocks with accumulated inventory burdens, documenting carry-in/carry-out attribution without lost or duplicated burdens. Q counts final accepted as-delivered production once, reconciled with loadout and stocks; exclude final rejects and do not recount returned, reworked and reaccepted material. Apply normalize_period once to each reconciled raw numerator; protocol aggregation and row/calculation descriptions denote that same division. Preserve the existing Q > 0 requirement; a wholly zero-output period needs a justified wider representative period or an incomplete result."
      inputs:
        - A_j
        - Q
        - cp_product
        - "row-linked protocol"
      output: "Normalized inventory in each row's declared unit per 1 kg reference flow"
      source_ids:
        - epa-mineral-1975
        - jrc-cww-2016
    - id: composition_balance
      applies_to: "ore; langbeinite_product; leach_brine; clay_tailings; captured_dust"
      rule: "For each measured physical stream, component mass = whole stream mass × measured component mass fraction on the same wet/dry basis. Dry solids = wet mass × (1 − measured water fraction). Reconcile K, Mg, S, Na, Cl and mineral losses with stock change and internal returns. Analytical K2O equivalent is only a separately declared nutrient reporting calculation, not physical K2O output."
      inputs:
        - "whole masses"
        - "water/assays"
        - stocks
        - "internal returns"
      output: "Whole material/component balance and measured recovery, without default yield"
      source_ids:
        - epa-mineral-1975
        - imc-kmag-sds-2026
        - imc-kmag-standard-2026
    - id: air_load
      applies_to: "individual elementary outputs"
      rule: "Integrate matched species concentration × actual gas flow × operating time, with all recorded sampling/standard/wet-dry corrections and unit conversions; measured non-detects retain bounds. For water, reconcile process evaporation and fuel-generated water separately from ambient humidity. Retain any unmeasured species or NOx speciation as pending; no total-VOC proxy for a species and no duplicated cumulative PM."
      inputs:
        - "matched source tests"
        - flow
        - hours
        - "gas basis"
        - "carbon/water balance"
        - cp_air
      output: "Species/interval mass released over period, then normalize_period"
      source_ids:
        - jrc-cww-2016
        - eccc-potash-2017
        - epa-gas-ap42
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product; ore"
      requirement: "Verify natural double-sulfate mineral and cold-leach impurity removal; assay real SKU/grade and mineral loss; avoid KCl/K2SO4/synthetic/blended substitutes. Broad flow identity does not prove provider inventory."
      evidence: "Mineral/assay/route/producer records; imc-kmag-sds-2026; epa-mineral-1975"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Resolve missing flow identities/backgrounds, characterize each residue and air source, retain uncertainties, absent-flow evidence and unmeasured scope. Check different waste streams/added chemicals and all identified gas species before claiming completeness."
      evidence: "Row-linked protocols, original records and full physical stream map"
    - id: dq_balance
      applies_to: "cold_leach"
      requirement: "Keep separate whole-stream mass, mineral/element, water, fuel carbon and energy balances, with measured tolerances/uncertainties justified by calibration and sample variability; no invented tolerance, recovery, density or energy norm. Physical internal links have equal quantities at both ends."
      evidence: "Weighing, assays, meters, source tests, stocks, allocation ledger"
    - id: dq_sources
      applies_to: "sources and providers"
      requirement: "Historical/single-producer material supports only its stated physical/method scope. No universal recipe, assay, density, emission factor, efficiency or disposal claim. Require actual utility/receiver dataset boundaries and study-year/geographic representativeness."
      evidence: "Source limits, actual provider definitions, uncertainty/sensitivity"
validation_rules:
  - rule_id: validate_identity
    applies_to: "langbeinite_product"
    rule: "Confirm all required qualifiers, physical mass denominator, natural mineral and actual cold-leach/utility/waste route before use. There is exactly one final reference output; an identity link or methodology candidate is not independent scientific approval."
    source_ids:
      - epa-mineral-1975
      - imc-kmag-sds-2026
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require Q > 0, one common period/denominator, declared numerator units, calibration and traceable aggregation; both languages must agree. Gas volume/provider or NO/NO2 monitor-basis incompatibility remains pending, not converted by assumption."
    source_ids:
      - jrc-cww-2016
  - rule_id: validate_environment
    applies_to: "individual elementary outputs; residues"
    rule: "No PM interval overlap, no NOx/species duplication, no waste/air double counting and no omitted mineral loss or offsite receiver burden. If biogenic fuel is introduced, retain its biogenic CO2 in LCI under new atomic rows; no greenhouse-gas reporting convention deletes physical releases. Direct outfalls/seepage require expanded atomic receiving-medium exchanges."
    source_ids:
      - eccc-potash-2017
      - epa-gas-ap42
      - jrc-cww-2016
  - rule_id: validate_uncertainty
    applies_to: "cold_leach"
    rule: "Missing UUID, unknown amount, provider mismatch, unmeasured emission or excluded actual route prevents a concrete inventory completeness claim. Report accepted inputs, performed/skipped checks and remaining findings; no unresolved state is presented as zero or scientifically reviewed."
    source_ids:
      - jrc-cww-2016
published_dataset_profile:
  dataset_role: "Attributional cradle-to-gate natural langbeinite fertilizer production dataset once required records/backgrounds are complete"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared natural langbeinite grade and cold-leach route at matching plant-gate physical mass basis; separately assess any nutrient reporting"
  excluded_use: "Full CPC34639 coverage, alternative minerals/routes, synthesized sulfate/NPK mixtures, liquid or additive-granulated supply, crop-yield equivalence, direct-outfall variant or generic provider substitution"
  required_metadata: "Producer/site/SKU, ore origin/mineral/assay/water and grade, route/utility/control/waste receiver configuration, period/Q, allocation, upstream coverage and field data methods"
  required_quality_disclosure: "Conditional broad reference identity, unresolved identities, background/quantity compatibility, measured coverage and uncertainty, source applicability limits, exclusions and long-term receiver scenarios"
  update_trigger: "Change in mine/grade/assay, process/utility/control/waste route, provider basis, study year or new identity/source evidence; reassess applicability before reuse"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Structure, 30 June 2025, rows 34631/34632/34639; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Classification scope only; not PCR identity, production chemistry or approved mapping"
  - id: "epa-mineral-1975"
    type: "official_guidance"
    reference: "US EPA 440/1-75/059b, Mineral Mining and Processing, Vol II, October 1975; printed pp80–81 (PDF85–86), contrast Figure19 printed83/PDF88; https://www.epa.gov/sites/default/files/2020-02/documents/mineral-mining_dd_vol-2_1975.pdf"
    used_for: "Historical retained-langbeinite cold leach/wash/debrine/dry/size route; distinguish excluded conversion to K2SO4. No facility quantities, waste loads, historical regulatory limits or industry defaults"
  - id: "imc-kmag-sds-2026"
    type: "handbook"
    reference: "International Minerals Carlsbad, K-Mag all grades SDS IMC260001, 1 March 2026, §§1/3/9/15, PDF1/3/5; https://www.kmag.com/wp-content/uploads/2026/03/SDS-Kmag.pdf"
    used_for: "Real natural double-sulfate CAS14977-37-8, commercial solid state, incidental NaCl and dust hazard; single producer limits, no composition/density defaults or cold-leach attribution"
  - id: "imc-kmag-standard-2026"
    type: "handbook"
    reference: "IMC, K-Mag Standard specification, revised03/26, one page incl. disclaimer; https://www.kmag.com/wp-content/uploads/2026/03/2026-K-Mag-Standard-Spec-Sheet.pdf"
    used_for: "Distinguish product mass, K2O equivalent, Mg/S, chloride, moisture and particle grade; actual assay required, no transferred guarantee/typical-value defaults"
  - id: "imc-heavy-media"
    type: "handbook"
    reference: "IMC About, History and plant description, dated web snapshot 14 October 2026; https://www.kmag.com/about/"
    used_for: "Counterevidence: current producer uses heavy media; do not claim all langbeinite is cold-leached or that its current plant is represented here"
  - id: "jrc-cww-2016"
    type: "official_guidance"
    reference: "JRC CWW BREF2016, scope PDF29, BAT2/3/4 printed543–544/PDF573–574; https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf"
    used_for: "Transferable wastewater/gas-origin and stream-parameter recording/monitoring methods only; no chemical-sector legal coverage, biological treatment default, BAT levels or monitoring frequency imposed on mineral beneficiation"
  - id: "eccc-potash-2017"
    type: "official_guidance"
    reference: "ECCC, Code of Practice for Management of PM2.5 Emissions in the Potash Sector, September2017, §§2.1.2.5–.9, Table3-2, R11/12; PDF15/20/27; https://www.canada.ca/content/dam/eccc/documents/pdf/cepa/20250707-eng.pdf"
    used_for: "Potash debrining/dryer/screening/dust-control mechanisms and sources; conditional configuration only, no KCl chemistry, quantities, intensity or universal recipe"
  - id: "epa-gas-ap42"
    type: "official_guidance"
    reference: "US EPA AP42 §1.4 Natural Gas Combustion, original header10/26, PDF1–3/§§1.4.1–1.4.3 and disclaimer; https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "Boiler/furnace combustion species screen and source-test preference only. No boiler factors, fuel composition, temperature, efficiency or default emissions imported into direct-contact mineral drying"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:dd768c1dee5097c6bfbf6e93ef06fcbe1b2e9e7864a0d0c5471e93b67c4b8e28"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8170"
      family: "system_boundary"
      span:
        start:
          offset: 8170
          line: 65
          column: 1
        end:
          offset: 11380
          line: 85
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Natural mined langbeinite-bearing ore delivered to aboveground cold-leach processing, with actual mineral/impurity/moisture composition and upstream extraction/transport burden |\n| starting_condition_role | background_dataset |\n| product_classification_scope | CPC 3.0 34639; narrower natural langbeinite fertilizer and cold-leach route only |\n| recursive_input_rule | A same-category finished fertilizer input is not untreated mined ore. Purchased refined langbeinite requires a finishing-only boundary with its prior burdens and separate applicability review; do not recurse or silently replace the ore route. |\n| upstream_dataset_requirement | Actual ore mining/transport; treated water supply; grid electricity; fossil pipeline gas at compatible volume basis; verified waste receiver transport/treatment including relevant long-term salt releases and closure/aftercare. Missing background coverage is incomplete, not zero. |\n| disclosure | Declare outsourced mining and waste services, site boundary, internal recycle/stocks, utilities and control equipment, full accounting period, allocation, capital/maintenance exclusions and their significance, and receiver release scenario/time horizon. |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | cold_leach | Include ore receipt/crushing, selective impurity washing, debrining, drying, screening, storage/loadout and actual pollution controls. Aggregate these into one foreground unit to preserve one final product exchange; retain separate stage meters and physical handoffs with equal amounts on both ends and reconciled composition/stock changes. No KCl reaction, MgCl2 coproduct or flotation recipe is assumed. | epa-mineral-1975 |\n| boundary_streams | cold_leach | Inventory all actual wastewater/waste gas origins, water flow and salt/species loads, residues, fugitive dust, startup/shutdown and control failures. CWW BAT2/3 inventory/monitoring concepts are used as transferable recording methods; chemical-sector legal scope, biological treatment assumptions and BAT emission limits/frequencies are not applied to this mineral route. | jrc-cww-2016; eccc-potash-2017 |\n| boundary_receivers | cold_leach | Contain leach/control wastewater for external verified salt-compatible treatment, separately from wet clay tailings and collected dry dust. Receiver acceptance, composition, transport, final fate and long-term salt/water releases are required. An actual direct outfall, seepage or onsite evaporation pond lies outside this inventory variant and requires atomic water/species/medium rows and treatment expansion before use. A legal no-discharge description is not proof of actual zero release. | epa-mineral-1975; jrc-cww-2016 |\n| boundary_downstream | cold_leach | Exclude agricultural use, nutrient substitution credit, crop yield, distribution after plant gate and packaging from the bulk reference. Retain burdens through waste management. Other actual consumed materials or releases cannot be omitted as an exclusion; reassess applicability and add atomic exchanges. | un-cpc3-2025 |\n\n"
