  - id: mineral_nutrient_basis
    applies_to: "langbeinite_product; ore; leach_brine; clay_tailings; captured_dust"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep whole product/ore, dry solids, langbeinite mineral, elemental K/Mg/S, Na/Cl and analytical K2O-equivalent quantities separate. Measure water and assay bases; nutrient equivalents are not emitted K2O or additional physical products. No single-producer percentage is a default. [imc-kmag-sds-2026; imc-kmag-standard-2026]"
  - id: gas_volume
    applies_to: "gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Meter actual fossil pipeline gaseous fuel. Record temperature, absolute pressure, wet/dry basis, composition, compressibility and provider m3 definition; reconcile the meter conversion to that provider. Background compatibility remains pending until these agree. Secondary database mass factors are not density. Do not also count internally generated dryer heat as a purchased heat input."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve the verified electrical reference property Net calorific value/MJ. Meter kWh and convert with 3.6 MJ/kWh; retain actual region, year, 1–35 kV consumer supply and loss boundary. This property name does not imply a fuel heating-value measurement."
  - id: nitrogen_species
    applies_to: "no_air; no2_air; n2o_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record actual NO, NO2 and N2O separately. Total NOx or NO2-equivalent reporting alone does not quantify either species; obtain speciation and reconcile monitor/LCI/LCIA definitions before converting. Never assume all NOx is NO2; N2O is excluded from NOx, and total NOx is not added again. [jrc-cww-2016; epa-gas-ap42]"
  - id: particulate_intervals
    applies_to: "pm25_air; pm25_10_air; pmover10_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use mutually exclusive particle intervals on the same source/time/method basis. If comparable cumulative measurements exist, PM2.5–10 is PM10 minus PM2.5 and >PM10 is total suspended PM minus PM10. Do not add total PM/PM10 again; retain filterable/condensable definitions and unsupported fractions as pending. Captured dust is a separate waste shipment, not an air release. [eccc-potash-2017]"
