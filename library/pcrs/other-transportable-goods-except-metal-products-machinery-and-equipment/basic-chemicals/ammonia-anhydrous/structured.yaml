allocation_rules:
  - rule_id: subdivision_first
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide route steps and meter dedicated inputs before allocating shared utilities or emissions; internal recycle is not a co-product and must not receive burden."
    source_ids:
      - eu-cbam-2023-1773
  - rule_id: oxygen_coproduct
    applies_to: "electrolysis_or_air_separation"
    rule: "If oxygen is vented, assign no avoided-product credit. If oxygen is sold or used outside the modelled step, report its amount and apply the declared method consistently without assuming zero-burden hydrogen or nitrogen."
    source_ids:
      - eu-cbam-2023-1773
  - rule_id: energy_export
    applies_to: "purge_gas_and_energy_recovery"
    rule: "Prefer system subdivision for purge-gas recovery and steam or electricity export; if allocation remains necessary, use a documented physical relationship before economic allocation and report sensitivity to the selected basis."
    source_ids:
      - us-epa-ap42-ammonia
  - rule_id: carbon_dioxide_coproduct
    applies_to: "separated_carbon_dioxide"
    rule: "Report generated, separated, vented, used, exported, and stored CO2 before any credit or deduction. A sale or utilization credit must follow the selected study method and cannot be represented as permanent storage without permanence evidence."
    source_ids:
      - us-epa-ghgrp-ammonia-tsd-2009
      - eu-cbam-2023-1773
  - rule_id: allocation_closure
    applies_to: "all_multi_output_processes"
    rule: "Report unallocated totals, allocation keys, recipients, allocated results, and a closure check; do not use an allocation rule to conceal route, capture, or energy data gaps."
    source_ids:
      - eu-cbam-2023-1773
dataset_production:
  collection_protocols:
    - protocol_id: cp_route_materials
      process_id: "hydrogen_syngas_supply"
      flow_role: "route feedstock and supplied hydrogen"
      record_type: "meter, invoice, supplier certificate, composition test"
      raw_fields: "material id; source; mass; energy content; carbon content; hydrogen content; route; opening and closing stock"
      collection_method: "calibrated custody-transfer meter or reconciled inventory"
      unit: "kg, m3, or MJ with conversion basis"
      frequency: "batch and monthly"
      temporal_coverage: "same reporting period as product output"
      site_scope: "all route-defining supply to the declared plant"
      aggregation_rule: "sum receipts plus opening stock minus closing stock, segregated by source and energetic or non-energetic use"
      quality_evidence: "calibration, invoice, laboratory certificate, and reconciliation record"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "electricity, fuels, steam, cooling, and exported energy"
      record_type: "meter, fuel ticket, invoice, utility balance"
      raw_fields: "carrier; meter id; quantity; unit; conversion factor; import; export; process assignment"
      collection_method: "calibrated meter and energy balance"
      unit: "kWh or MJ"
      frequency: "hourly to monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included plant units"
      aggregation_rule: "sum by carrier and process; report gross imports and exports before net result"
      quality_evidence: "meter calibration, invoices, and energy-balance closure"
    - protocol_id: cp_upstream_methane
      process_id: "hydrogen_syngas_supply"
      flow_role: "hydrocarbon upstream methane"
      record_type: "supplier inventory or route model"
      raw_fields: "feedstock source; geography; period; quantity; methane stages; emission factor or measured loss; uncertainty"
      collection_method: "supplier-specific data preferred; otherwise traceable route model"
      unit: "kg CH4 and kg feedstock or MJ"
      frequency: "supplier period, at least annual"
      temporal_coverage: "period aligned or temporally adjusted"
      site_scope: "all hydrocarbon feedstock suppliers"
      aggregation_rule: "quantity-weighted supplier result; do not mix measured and modelled results without disclosure"
      quality_evidence: "supplier assurance, model version, source citation, and uncertainty"
    - protocol_id: cp_syngas_transfer
      process_id: "hydrogen_syngas_supply_gas_conditioning"
      flow_role: "hydrogen, raw syngas, nitrogen, and conditioned syngas"
      record_type: "flow meter and composition analysis"
      raw_fields: "dry and wet flow; H2; N2; CO; CO2; CH4; water; pressure; temperature"
      collection_method: "calibrated flow measurement and gas analysis"
      unit: "kg or Nm3 with reference conditions"
      frequency: "continuous or shift"
      temporal_coverage: "representative operating campaign and annual reconciliation"
      site_scope: "all transfer points between route steps"
      aggregation_rule: "convert to a common dry-gas basis and reconcile H, N, and C balances"
      quality_evidence: "analyzer calibration, reference conditions, and balance closure"
    - protocol_id: cp_synthesis_operations
      process_id: "ammonia_synthesis"
      flow_role: "make-up gas, recycle, purge, and ammonia production"
      record_type: "distributed control system and production log"
      raw_fields: "make-up flow; recycle flow; purge flow; composition; pressure; temperature; catalyst period; condensed NH3"
      collection_method: "continuous process instrumentation"
      unit: "kg, Nm3, deg C, and pressure with basis"
      frequency: "continuous"
      temporal_coverage: "complete reporting period with outages disclosed"
      site_scope: "synthesis loop and associated refrigeration"
      aggregation_rule: "external input excludes internal recycle; aggregate production-weighted operating periods"
      quality_evidence: "instrument calibration, outage log, and synthesis-loop balance"
    - protocol_id: cp_product_quality
      process_id: "ammonia_synthesis_product_conditioning_storage"
      flow_role: "NH3 purity and water content"
      record_type: "representative product sample and laboratory result"
      raw_fields: "sample id; lot or tank; sampling time; sampling method; NH3 fraction; water; oil or other grade parameters"
      collection_method: "declared safe sampling procedure and validated analytical method"
      unit: "mass fraction, mg/kg, or declared grade unit"
      frequency: "each lot, tank, or statistically justified campaign"
      temporal_coverage: "same lots and period as reported product"
      site_scope: "all saleable product represented by the dataset"
      aggregation_rule: "mass-weighted result; retain out-of-spec dispositions separately"
      quality_evidence: "chain of custody, method identifier, laboratory QA, and repeatability"
    - protocol_id: cp_product_output
      process_id: "product_conditioning_storage"
      flow_role: "net saleable product and inventory"
      record_type: "custody meter, weighbridge, tank gauge, and sales record"
      raw_fields: "gross product mass; deliveries; returns; opening and closing inventory; purity; temperature; pressure"
      collection_method: "calibrated mass measurement with inventory reconciliation"
      unit: "kg"
      frequency: "batch and monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all product tanks and loading points"
      aggregation_rule: "net saleable mass multiplied by measured NH3 mass fraction"
      quality_evidence: "calibration, sales reconciliation, and tank inventory closure"
    - protocol_id: cp_direct_emissions
      process_id: "all_processes"
      flow_role: "stack, vent, flare, fugitive, and wastewater emissions"
      record_type: "continuous monitor, stack test, leak survey, event log, or calculation"
      raw_fields: "source id; pollutant; concentration; flow; duration; event; recovery; flare efficiency; method"
      collection_method: "source-appropriate monitoring or documented mass balance"
      unit: "kg pollutant"
      frequency: "continuous, event, or test campaign"
      temporal_coverage: "complete reporting period including start-up and shutdown"
      site_scope: "every included emission point"
      aggregation_rule: "calculate by pollutant and source, then sum without double counting routed streams"
      quality_evidence: "monitor QA, test report, leak survey, event log, and calculation sheet"
    - protocol_id: cp_carbon_capture
      process_id: "gas_conditioning_carbon_handling"
      flow_role: "generated, separated, captured, used, transported, stored, and vented CO2"
      record_type: "meter, carbon balance, custody transfer, transport and injection record"
      raw_fields: "stream mass; carbon content; capture point; destination; transport loss; injected mass; leakage; permanence evidence"
      collection_method: "metering and chain-of-custody reconciliation"
      unit: "kg CO2"
      frequency: "continuous and shipment"
      temporal_coverage: "complete reporting period and applicable storage monitoring period"
      site_scope: "all CO2 streams connected to ammonia production"
      aggregation_rule: "generated equals emitted plus exported for use plus stored plus inventory change and documented losses"
      quality_evidence: "meter calibration, recipient record, injection verification, and balance closure"
    - protocol_id: cp_coproducts
      process_id: "all_multi_output_processes"
      flow_role: "oxygen, purge gas, hydrogen, steam, electricity, and CO2 co-products"
      record_type: "meter, invoice, and use record"
      raw_fields: "product; quantity; quality; energy content; destination; internal or external use; allocation key"
      collection_method: "calibrated measurement and transaction record"
      unit: "kg, MJ, or kWh"
      frequency: "batch and monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all material co-products and exports"
      aggregation_rule: "report gross quantities before allocation and reconcile internal use"
      quality_evidence: "meter calibration, invoice, destination evidence, and allocation worksheet"
    - protocol_id: cp_storage_operations
      process_id: "product_conditioning_storage"
      flow_role: "storage conditions, inventory change, loading, and releases"
      record_type: "tank gauge, temperature and pressure historian, loading log, relief and maintenance log"
      raw_fields: "tank id; opening and closing mass; temperature; pressure; pressure basis; receipts; deliveries; recovered boil-off; vents; relief events"
      collection_method: "calibrated tank instrumentation and event reconciliation"
      unit: "kg, deg C, and pressure with basis"
      frequency: "continuous and event"
      temporal_coverage: "complete reporting period"
      site_scope: "all ammonia storage and loading equipment"
      aggregation_rule: "mass balance by tank and total system; report routine and non-routine losses separately"
      quality_evidence: "gauge calibration, historian completeness, and signed event records"
    - protocol_id: cp_waste_records
      process_id: "all_processes"
      flow_role: "wastewater and solid or liquid waste"
      record_type: "discharge meter, manifest, laboratory analysis, and inventory"
      raw_fields: "waste id; mass or volume; composition; hazard status; destination; recovery or treatment"
      collection_method: "measured discharge or weighed shipment"
      unit: "kg or m3"
      frequency: "shipment and monthly"
      temporal_coverage: "complete reporting period"
      site_scope: "all included process areas"
      aggregation_rule: "sum by waste type and destination; reconcile stored waste inventory"
      quality_evidence: "manifest, analysis, treatment receipt, and inventory closure"
  calculation_rules:
    - id: calc_nh3_equivalent
      applies_to: "reference product"
      rule: "NH3-equivalent mass = net saleable gross mass x measured NH3 mass fraction. Do not apply this formula to aqueous ammonia as a way to include it in this PCR."
      inputs:
        - "gross saleable mass"
        - "NH3 mass fraction"
        - returns
        - "inventory change"
      output: "kg NH3 equivalent"
      source_ids:
        - iso-7103-1982
        - iso-7105-1985
    - id: calc_route_material_balance
      applies_to: "hydrogen and synthesis route"
      rule: "Reconcile feedstock, hydrogen, nitrogen, carbon, and ammonia across route steps on consistent dry or wet bases; internal recycle is excluded from external input totals."
      inputs:
        - "route-material records"
        - "syngas composition"
        - "synthesis records"
        - "product output"
      output: "route-specific material balance and closure"
      source_ids:
        - us-epa-ap42-ammonia
        - us-epa-ghgrp-ammonia-tsd-2009
    - id: calc_energy_by_role
      applies_to: "feedstock and energy"
      rule: "Convert each carrier with a declared factor and separately total non-energy feedstock, fuel, electricity, imported heat, and exported energy."
      inputs:
        - "energy meters"
        - "feedstock records"
        - "conversion factors"
        - exports
      output: "carrier-specific and role-specific energy inventory"
      source_ids:
        - us-epa-ghgrp-ammonia-tsd-2009
        - eu-cbam-2023-1773
    - id: calc_upstream_methane
      applies_to: "hydrocarbon supply"
      rule: "Upstream methane = sum over suppliers of feedstock activity multiplied by the supplier-specific measured loss or traceable model factor; preserve supplier, geography, period, and uncertainty."
      inputs:
        - "feedstock quantity"
        - "supplier methane result or model factor"
      output: "kg CH4 per reference flow"
      source_ids:
        - iea-ammonia-roadmap-2021
    - id: calc_direct_emissions
      applies_to: "direct plant emissions"
      rule: "Calculate each pollutant by monitored concentration and gas flow or by a documented carbon or mass balance; keep process and combustion CO2 distinguishable."
      inputs:
        - monitoring
        - "stack tests"
        - "fuel and feedstock carbon"
        - "event logs"
      output: "kg pollutant per reference flow"
      source_ids:
        - us-epa-ap42-ammonia
        - us-epa-ghgrp-ammonia-tsd-2009
    - id: calc_capture_balance
      applies_to: "carbon dioxide handling"
      rule: "Generated CO2 = vented or emitted CO2 + CO2 exported for use + CO2 delivered to verified storage + inventory change + documented handling losses. Separation alone is not storage."
      inputs:
        - generated
        - separated
        - exported
        - used
        - injected
        - leaked
        - vented
        - "and inventory records"
      output: "carbon-capture balance and disposition shares"
      source_ids:
        - us-epa-ghgrp-ammonia-tsd-2009
        - eu-cbam-2023-1773
    - id: calc_allocation_closure
      applies_to: "multi-output processes"
      rule: "Allocated burdens across ammonia and co-products must equal the unallocated process total for every inventory row after subdivision and internal-use reconciliation."
      inputs:
        - "unallocated inventory"
        - "co-product quantities"
        - "allocation keys"
      output: "allocated inventory and closure difference"
      source_ids:
        - eu-cbam-2023-1773
    - id: calc_storage_balance
      applies_to: "product conditioning and storage"
      rule: "Opening inventory + receipts + production = deliveries + closing inventory + recovered exports + measured releases + unexplained difference; investigate rather than silently allocate unexplained difference."
      inputs:
        - "tank inventory"
        - receipts
        - production
        - deliveries
        - recovery
        - "release logs"
      output: "storage mass balance and loss quantity"
      source_ids:
        - cdc-niosh-ammonia
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Demonstrate that the represented product is anhydrous ammonia and not aqueous ammonia; report grade, purity, water content, physical state, and test method."
      evidence: "product specification, representative sample, and laboratory result"
    - id: dq_route_identity
      applies_to: "whole dataset"
      requirement: "Identify the hydrogen and synthesis-gas production route, feedstock, technology, plant, geography, period, and whether route steps are on site or supplied."
      evidence: "process diagram, supplier records, and route declaration"
    - id: dq_temporal_representativeness
      applies_to: "all foreground records"
      requirement: "Use one coherent reporting period, disclose outages, start-up, shutdown, abnormal events, and material differences between supplier and plant periods."
      evidence: "production log, meter coverage, event log, and temporal adjustment record"
    - id: dq_completeness
      applies_to: "all included processes"
      requirement: "Demonstrate material, energy, nitrogen, carbon, capture, storage, waste, and emission balance closure; explain exclusions and unresolved differences."
      evidence: "signed balance worksheets and completeness review"
    - id: dq_upstream_methane
      applies_to: "hydrocarbon routes"
      requirement: "Disclose whether upstream methane is supplier-measured or modelled and report source, geography, year, stages, and uncertainty."
      evidence: "supplier assurance or traceable model documentation"
    - id: dq_capture_claim
      applies_to: "capture-related datasets"
      requirement: "A capture or low-carbon claim requires stream-level CO2 balance, capture point, disposition, transport, injection, storage, leakage, and permanence evidence appropriate to the selected method."
      evidence: "metering, custody transfer, injection verification, monitoring, and method statement"
    - id: dq_allocation
      applies_to: "multi-output processes"
      requirement: "Preserve pre-allocation totals, co-product quantities, allocation basis, recipients, sensitivity, and mathematical closure."
      evidence: "allocation worksheet and co-product records"
    - id: dq_storage_conditions
      applies_to: "final product"
      requirement: "Report time-weighted temperature and pressure, pressure basis, inventory change, routine loss, abnormal release, recovery, and loading condition."
      evidence: "tank historian, calibration, and event reconciliation"
validation_rules:
  - rule_id: validate_product_not_aqueous
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a data package that represents aqueous ammonia, ammonium hydroxide, or a solution merely normalized to NH3 content; the physical product must meet the declared anhydrous-ammonia specification."
    source_ids:
      - unsd-cpc-v3-2025
      - iso-7105-1985
  - rule_id: validate_reference_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Require the selected product flow UUID, Mass flow-property UUID, Units of mass unit-group UUID, kg reference unit, and 1 kg NH3-equivalent amount to match this PCR."
    source_ids:
      - unsd-cpc-v3-2025
  - rule_id: validate_required_qualifiers
    applies_to: "foreground_dataset_conformance"
    rule: "Reject an incomplete reference flow when any required qualifier for purity, route, hydrogen source, energy, upstream methane, capture, allocation, or storage condition is missing."
    source_ids:
      - iea-ammonia-roadmap-2021
      - cdc-niosh-ammonia
  - rule_id: validate_route_consistency
    applies_to: "foreground_dataset_conformance"
    rule: "Require all included processes, inputs, emissions, and upstream datasets to agree with the declared route; unused alternative routes must not be blended into a generic result."
    source_ids:
      - iea-ammonia-roadmap-2021
      - eu-cbam-2023-1773
  - rule_id: validate_mass_energy_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Require documented material, nitrogen, hydrogen, carbon, product-storage, and carrier-specific energy closure; internal recycle and energy export must not be double counted."
    source_ids:
      - us-epa-ap42-ammonia
      - us-epa-ghgrp-ammonia-tsd-2009
  - rule_id: validate_upstream_methane
    applies_to: "foreground_dataset_conformance"
    rule: "Hydrocarbon routes must include or link an upstream methane result with feedstock source, geography, period, method, and uncertainty."
    source_ids:
      - iea-ammonia-roadmap-2021
  - rule_id: validate_capture_disposition
    applies_to: "foreground_dataset_conformance"
    rule: "Require generated, separated, captured, vented, used, transported, injected, stored, leaked, and inventory-change CO2 fields to close; do not accept separation or sale alone as permanent storage."
    source_ids:
      - us-epa-ghgrp-ammonia-tsd-2009
      - eu-cbam-2023-1773
  - rule_id: validate_allocation_closure
    applies_to: "foreground_dataset_conformance"
    rule: "Require pre-allocation totals, co-product quantities, allocation keys, recipients, sensitivity where material, and zero unexplained allocation difference."
    source_ids:
      - eu-cbam-2023-1773
  - rule_id: validate_storage_conditions
    applies_to: "foreground_dataset_conformance"
    rule: "Require storage temperature, pressure, pressure basis, inventory change, loading loss, recovery, and abnormal-event treatment to be present and mutually consistent."
    source_ids:
      - cdc-niosh-ammonia
  - rule_id: validate_low_carbon_claim
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a low-carbon, renewable, blue, green, or equivalent claim unless the declared hydrogen, electricity, feedstock, methane, capture, allocation, and storage evidence supports the exact route represented."
    source_ids:
      - iea-ammonia-roadmap-2021
      - eu-cbam-2023-1773
published_dataset_profile:
  dataset_role: "Route-specific foreground production dataset for marketable anhydrous ammonia at the producing plant gate"
  downstream_use: "May be used as a secondary_dataset or background_dataset for fertilizer, chemical, refrigeration, fuel, hydrogen-carrier, process, or lifecyclemodel studies when qualifiers match"
  allowed_use: "Route-, geography-, period-, grade-, capture-, allocation-, and storage-matched plant-gate modelling; transparent scenario comparison after harmonizing boundaries"
  excluded_use: "Aqueous ammonia; universal ammonia average without route disclosure; automatic substitution among fossil, electrolysis, captured-carbon, or other routes; unsupported low-carbon claim; downstream transport or use without added processes"
  required_metadata: "canonical PCR id; product flow UUID; grade; purity; water content; route; hydrogen source; feedstock; plant; geography; period; technology; electricity and heat supply; upstream methane method; capture disposition; co-products; allocation; storage temperature and pressure; plant-gate condition"
  required_quality_disclosure: "primary-data share; meter and laboratory coverage; temporal and geographic representativeness; material, energy, nitrogen and carbon closure; uncertainty; missing data; supplier data quality; capture permanence evidence; abnormal-event treatment"
  update_trigger: "Change in product grade, route, hydrogen source, feedstock, major technology, energy supply, upstream methane data, capture disposition, allocation, storage regime, plant boundary, or reporting period"
data_sources:
