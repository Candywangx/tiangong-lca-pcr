system_boundary:
  rules:
    - rule_id: route_complete_boundary
      applies_to: "foreground_system_boundary"
      rule: "Include route-defining feedstock or hydrogen production, air or nitrogen supply, synthesis-gas purification where applicable, ammonia synthesis, condensation, refrigeration, storage, and plant-gate loading."
      source_ids:
        - iea-ammonia-roadmap-2021
        - us-epa-ap42-ammonia
    - rule_id: feedstock_energy_separation
      applies_to: "foreground_system_boundary"
      rule: "Distinguish feedstock used non-energetically from fuel, steam, and electricity used for process energy, while preserving complete energy and carbon balances."
      source_ids:
        - us-epa-ghgrp-ammonia-tsd-2009
        - eu-cbam-2023-1773
    - rule_id: upstream_methane_boundary
      applies_to: "hydrocarbon_supply"
      rule: "Include or explicitly link upstream methane supply-chain emissions for natural gas, biogas, or other methane-containing feedstocks; disclose data source, geography, period, and whether measured or modelled."
      source_ids:
        - iea-ammonia-roadmap-2021
    - rule_id: hydrogen_route_boundary
      applies_to: "hydrogen_supply"
      rule: "Identify whether hydrogen is produced on site or supplied separately and identify steam reforming, gasification, electrolysis, chlor-alkali, biomass, or other production route; separately supplied hydrogen carries its own upstream inventory."
      source_ids:
        - iea-ammonia-roadmap-2021
        - eu-cbam-2023-1773
    - rule_id: carbon_capture_boundary
      applies_to: "carbon_dioxide_handling"
      rule: "Report CO2 generated, separated, captured, vented, used, transported, injected, and demonstrably stored as separate quantities; do not treat separation, sale, utilization, or temporary binding as permanent storage without the corresponding boundary and evidence."
      source_ids:
        - us-epa-ghgrp-ammonia-tsd-2009
        - eu-cbam-2023-1773
    - rule_id: storage_loading_boundary
      applies_to: "product_conditioning_and_storage"
      rule: "Include refrigeration or compression, inventory change, storage losses, boil-off recovery, vents, flares, and loading operations up to the declared plant gate; downstream distribution and use are excluded unless added as a separate scenario."
      source_ids:
        - cdc-niosh-ammonia
boundary_abstraction:
  declared_starting_condition: "Extraction or production of route-defining feedstock, hydrogen, electricity, fuels, water, and other material inputs, represented by foreground records or traceable upstream datasets"
  starting_condition_role: "Cradle-to-plant-gate starting condition for route comparison and foreground package production"
  product_classification_scope: "CPC 3.0 code 34651 only; aqueous ammonia under CPC 34652 and downstream ammonia derivatives are outside scope"
  recursive_input_rule: "If anhydrous ammonia from the same category enters blending, conditioning, or storage, record it as a technosphere input with a separate upstream dataset and do not recreate its upstream production inside the receiving process."
  upstream_dataset_requirement: "Route-specific datasets must represent feedstock or hydrogen production, electricity and fuels, upstream methane where hydrocarbon supply is used, and carbon-capture transport and storage where a storage claim is made."
  disclosure: "Declare route, hydrogen source, energy supply, upstream methane treatment, capture boundary, allocation, and storage conditions; never label an undeclared or single-route result as generic anhydrous ammonia."
