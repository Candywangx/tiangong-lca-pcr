    quantitative_reference: "per 1 kg NH3-equivalent final product"
  - id: ammonia_synthesis
    name: "Ammonia synthesis loop"
    inclusion: "required"
    inclusion_condition: "Always included."
    role: "Compresses, reacts, circulates, condenses, and purges the nitrogen-hydrogen loop."
    quantitative_reference: "per 1 kg NH3-equivalent final product"
  - id: product_conditioning_storage
    name: "Product conditioning, storage, and loading"
    inclusion: "required"
    inclusion_condition: "Always included to the declared plant gate."
    role: "Delivers saleable anhydrous ammonia under declared purity, temperature, and pressure conditions."
    quantitative_reference: "per 1 kg NH3-equivalent final product"
  - id: carbon_handling
    name: "CO2 utilization, transport, and storage"
    inclusion: "conditional"
