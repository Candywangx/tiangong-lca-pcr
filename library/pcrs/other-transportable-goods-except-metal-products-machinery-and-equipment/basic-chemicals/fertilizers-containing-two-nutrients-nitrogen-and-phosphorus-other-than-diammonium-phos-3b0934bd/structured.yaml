          description: "Record the actual complete wet APP-mixture droplet release after controls to outdoor air unspecified: condensed and orthophosphate ammonium salts, carrier water and impurities, with measured total wet kg and constituent quantities. Do not use one polymer-component UUID for the complete wet droplets. Count retained droplet water in its liquid aerosol water ledger, not water_vapour. Keep this specific unresolved emission row until identity is verified. It is not acid-only mist, HF, total phosphorus or an arbitrary PM size bin. The phosphoric_acid_air row applies only to independently identified acid release outside this whole-mixture exchange. Preserve the whole-droplet physical account; chemical disaggregation for characterization requires measured constituents, separate verified species rows and an exact reconciliation that prevents adding both aggregate droplets and their constituent masses as independent releases. Missing speciation/characterization remains incomplete."
          amount:
            expression: "Measured external amount divided by accepted product mass; retain applicability and composition under cp_air"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_air
              source_ids:
                - us-epa-app-1981
                - eu-cww-2016
            ranges: []
allocation_rules:
  - rule_id: allocation_physical
    applies_to: "app_line"
    rule: "Preserve the complete unallocated physical balance, stocks, recovered liquor, product and waste quantities. Internal recovery is neither a coproduct nor an avoided virgin input credit. The same actual kg crosses both ends of every internal link."
    source_ids:
      - eu-cww-2016
      - jrc-ilcd-2010
  - rule_id: allocation_single
    applies_to: "app_product"
    rule: "The base line has one accepted APP product. Assign its attributable production, failed-batch, recovery and waste-treatment burdens to that product; N and P are constituents, not independently allocated coproducts. A sediment or purge does not become a coproduct without a real specification, receiver and demonstrated function."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_shared
    applies_to: "all inventory rows"
    rule: "Subdivide physically distinguishable operations and directly assign metered burdens first. For inseparable shared burdens use demonstrated physical causality; if unavailable, document a study-consistent economic allocation with contemporaneous net product quantities/prices and sensitivity. Preserve total burden and shares summing to one; no default share. Actual independently sold material or exported heat requires explicit additional product, function, receiver and burden treatment before dataset completion."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_two_ledgers
    applies_to: "app_line"
    rule: "Allocation changes the burden account only. Do not multiply physical product/waste/recycle kg by the allocation share, remove failed runs or claim both return credits and avoided-product credits for the same condensate/recovery. Keep supplier-defined technical returns distinct from independent coproducts."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "app_line"
      flow_role: "app_product"
      record_type: "Weighing and product acceptance"
      raw_fields: "lot/SKU; net accepted kg; rejected/rework kg; dispatch; opening/closing accepted stock and WIP; N/P assays and definitions; phosphate distribution; water/impurities; density/temperature; pH; stability; release decision"
      collection_method: "Calibrated scale or independently calibrated tank-volume/density method at recorded temperature; acceptance laboratory method validated for the actual matrix; link every lot and stock record"
      unit: "kg; mass fractions; declared assay units"
      frequency: "Each lot and stock boundary"
      temporal_coverage: "Complete common period including unsuccessful runs"
      site_scope: "One grade/state/route and its actual storage/loading line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; tare/density evidence; certificates; assay definitions; full lot register; stock reconciliation"
    - protocol_id: cp_feeds
      process_id: "app_line"
      flow_role: "spa_feed; ammonia_feed"
      record_type: "Receipt, feed meter and composition records"
      raw_fields: "supplier/SKU; total received kg; actual feed-to-line kg; opening/closing stocks; NH3 purity; acid total P and P2O5 equivalent; ortho/condensed distribution; free water; impurities including F/Si/metals; temperatures; NH3 split and vaporisation"
      collection_method: "Reconcile weighbridge/tank receipts, calibrated feed meters and stock movements; sample actual supplied mixture with validated supplier/laboratory methods; retain full mixtures and component ledgers separately"
      unit: "kg; mass fractions; temperature"
      frequency: "Each receipt/lot and operating mode"
      temporal_coverage: "Same complete period as P including failed batches"
      site_scope: "app_line feed receipt, storage and metered additions"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; supplier quantity basis; matrix-specific assays; feed/stock reconciliation; pipe/finishing feed split"
    - protocol_id: cp_water
      process_id: "app_line"
      flow_role: "process_water; cooling_water; cooling_return"
      record_type: "Water delivery and loop records"
      raw_fields: "separate use meters; inlet/outlet kg or volume/density; temperatures; loop topology; makeup; return; internal circulation; recovered water; evaporation; drift; stocks"
      collection_method: "Read calibrated boundary meters; convert volume only using documented actual density/temperature; reconcile external and internal loop quantities; measure returned water and receiver independently"
      unit: "kg; measured temperature; original volume retained"
      frequency: "Each meter interval and relevant mode"
      temporal_coverage: "Same complete period as P including cleaning/idle and failed runs"
      site_scope: "app_line water and actual utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; supplier water basis; loop diagram; water balance; thermal records"
    - protocol_id: cp_energy
      process_id: "app_line"
      flow_role: "electricity; steam_in; condensate_return"
      record_type: "Utility meters, supplier definitions and operating records"
      raw_fields: "original kWh; steam/condensate kg; absolute/gauge pressure; temperature; steam dryness; inlet/outlet states; enthalpy method; supplier unit/return convention; stocks; line and shared-utility meters; operating modes"
      collection_method: "Meter attributable electric use and delivered/returned steam mass; obtain supplier background reference definition; establish paired states with traceable steam/water property method; preserve shared totals before allocation"
      unit: "kWh and MJ; kg; pressure; temperature; enthalpy"
      frequency: "Each metering interval and mode"
      temporal_coverage: "Same complete period as P including startup/failure/idle"
      site_scope: "app_line including actual NH3 vaporisation, cooling and loading utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; voltage/provider evidence; state/enthalpy and return agreement; allocation records"
    - protocol_id: cp_wastes
      process_id: "app_line"
      flow_role: "np_purge; settled_solids; cooling_blowdown"
      record_type: "Waste weighing, composition and transfer records"
      raw_fields: "stream origin; wet kg; dry solids/water; N forms; total P; F/Si/metals as relevant; internal recycle kg; external receiver; treatment; opening/closing stocks; spills; rejected lots"
      collection_method: "Weigh each distinct external stream; representative matrix-validated sampling; retain transfer manifests and recipient acceptance; distinguish recycled liquor from dispatch and segregate incompatible receivers"
      unit: "Wet kg; dry kg; mass fractions; original measured volumes"
      frequency: "Each transfer and operating event"
      temporal_coverage: "Same complete period as P with failure/cleaning residues"
      site_scope: "app_line waste origin and dispatch interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; composition tests; receiver/treatment records; recycle and stock closure"
    - protocol_id: cp_air
      process_id: "app_line"
      flow_role: "ammonia_air; hf_air; sif4_air; water_vapour; phosphoric_acid_air; app_aerosol"
      record_type: "Vent monitoring, fugitives and species records"
      raw_fields: "species/CAS; mass versus as-N/as-P/as-F convention; concentration; gas volume or flow rate; integration period; T/P; wet/dry basis; control inlet/outlet; operating duration; fugitives; aerosol composition/water; detection limits"
      collection_method: "Use matrix/species-appropriate validated tests after controls and representative event coverage; match concentration to compatible gas-volume basis; assess separate fugitives; obtain actual species evidence rather than splitting total N/P/F by assumption"
      unit: "kg species; original concentration/volume or flow-rate units retained"
      frequency: "Representative mode measurements plus complete event/duration register"
      temporal_coverage: "Same complete period as P including startup, failures and storage/loadout"
      site_scope: "All app_line controlled outlets and fugitive paths; outdoor air unspecified only while no narrower medium is justified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Test methods/calibration; gas-state consistency; mode coverage; speciation; detection-limit handling; no duplicate size/constituent totals"
  calculation_rules:
    - id: period_normalisation
      applies_to: "all inventory rows"
      rule: "a_i = Q_i / P; Q_i is the complete actual attributable period exchange before normalization and P is accepted net supplied APP generated in the same period in kg. Preserve receipt/stock corrections and the raw numerator. app_product is 1 kg. P = 0 gives no normalized result."
      inputs:
        - Q_i
        - P
        - "full period records and stocks"
      output: "Exchange per 1 kg reference flow and retained original totals"
      source_ids:
        - eu-cww-2016
    - id: mixture_components
      applies_to: "spa_feed; ammonia_feed; app_product; np_purge; settled_solids"
      rule: "Constituent kg = actual complete wet/supplied kg times measured compatible constituent mass fraction. P2O5-equivalent is converted to elemental P by the declared atomic-mass ratio 2 A(P) / [2 A(P) + 5 A(O)]. It is not subtracted with N to infer carrier water. Document free water separately; uncharacterised remainder remains uncharacterised."
      inputs:
        - "Actual supplied masses"
        - "matrix-valid assays"
        - "declared atomic masses and analytical definitions"
      output: "Full-mixture and separate constituent ledgers"
      source_ids:
        - us-epa-app-1981
        - simplot-app-14090
    - id: reaction_water
      applies_to: "spa_feed; app_product; np_purge; water_vapour"
      rule: "Condensation and hydrolysis change molecular-water/species accounting. For illustration, 2 H3PO4 converts to H4P2O7 + H2O; the reverse consumes water. Derive net reaction-water terms only from validated complete composition/speciation and balanced reactions for the actual route; the illustration is not a recipe, a fixed yield or an assumed chain distribution. NH3 acid neutralisation alone does not justify invented water generation. COD and a mass-balance residual cannot supply reaction-water quantities."
      inputs:
        - "Measured acid/product/effluent compositions"
        - "actual phosphate species and reaction evidence"
      output: "Supported net reaction-water term with uncertainty, or explicit unresolved term"
      source_ids:
        - us-epa-app-1981
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "MJ = measured kWh times 3.6; retain actual voltage, user boundary and supply mix."
      inputs:
        - "Original metered kWh"
      output: "MJ electricity"
      source_ids:
        - eu-cww-2016
    - id: steam_enthalpy
      applies_to: "steam_in; condensate_return"
      rule: "Preserve delivered steam mass and returned condensate mass separately. Calculate net imported thermal enthalpy from the sum of imported mass times its state-specific enthalpy minus the sum of exported mass times its state-specific enthalpy, using one declared datum and accounting for measured leaks, stocks and other heat exchanges in the full energy balance. Match supplier kg or net-MJ definition before linkage; do not infer net heat from a flow-property label."
      inputs:
        - "Measured masses and states"
        - "validated property method"
        - "boundary and supplier definition"
      output: "Steam/return physical account and compatible separately calculated heat"
      source_ids:
        - eu-cww-2016
    - id: emission_integration
      applies_to: "ammonia_air; hf_air; sif4_air; phosphoric_acid_air; app_aerosol"
      rule: "Species load equals concentration times compatible integrated gas volume, or time integral of concentration times compatible volume flow rate. For mg per Nm3 and already integrated Nm3 divide their product by 1000000 to obtain kg; do not multiply by duration again. Convert as-N/P/F only after actual species identification; add separately assessed fugitives once."
      inputs:
        - "Compatible concentrations and gas volumes/rates"
        - "actual speciation"
        - "operating-event coverage"
      output: "Period species kg before normalization"
      source_ids:
        - eu-cww-2016
    - id: physical_reconciliation
      applies_to: "all inventory rows"
      rule: "At the whole-line receipt/dispatch boundary reconcile receipts = full dispatch + external wastes + releases + changes in feed, WIP and accepted-product stocks, with uncertainties. At the feed-to-line/accepted-production boundary use consumed feeds and P with only the corresponding WIP/other changes; never count accepted stock changes again after including them in P. Keep total mass and elemental N/P/F ledgers, supported water generation/consumption, free water, water vapour, retained waste liquid and actual impurity/carbon destinations. Chemical reaction changes species, not elemental mass. Keep unexplained residuals and uncertainty explicit; no forced evaporation, yield or emission."
      inputs:
        - "All raw meters"
        - assays
        - "stocks and internal-link records"
        - "reaction-water evidence"
      output: "Two reconciled physical representations and separate burden account"
      source_ids:
        - eu-cww-2016
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Match full native name, type, CAS if given, route, state, reference property and unit, and actual medium. Use official Chinese baseName exactly where provided. Empty UUID is a concrete identity gap; identity alone never establishes provider compatibility."
      evidence: "Actual material/SKU and recipient evidence; source/flow records"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Preserve original period totals and every relevant batch/mode, including failed/zero-output, startup/shutdown, rework/WIP and stocks. Normalize only once to positive P; a zero-output pool remains reported and unnormalized."
      evidence: "Full batch and stock register; meter timestamps; cp_product; cp_feeds"
    - id: dq_provider
      applies_to: "all external inputs"
      requirement: "Separate actual demand from supplier reference amount. Reconcile mixture versus active-component kg, delivered versus standard volume at stated T/P/wet-dry convention, electricity MJ and steam/return enthalpy. A provider mismatch blocks that concrete linkage, not evidence-based future collection."
      evidence: "Supplier declarations, referenced dataset amount/unit/state and measured foreground definitions"
    - id: dq_completeness
      applies_to: "app_line"
      requirement: "Check actual waste and impurity destinations, gas speciation, retained water, controls, handling/storage/loadout and service utilities. Non-applicable and zero values need affirmative evidence, not failed lookup or source silence. Extend actual extra additives/processes before completion."
      evidence: "Process flow sheets; eu-cww-2016 BAT2; operating/event records; recipient evidence"
    - id: dq_assets
      applies_to: "app_line"
      requirement: "Disclose the study's capital-equipment boundary and materiality. Where assets/returnable containers are included, preserve actual item/material quantities and demonstrated service life/lifetime production separately from their attributed per-kg service equivalents, with replacements and end-of-life consistent. No invented machine weight, lifetime or packaging amount; significant actual infrastructure is not silently removed."
      evidence: "Actual asset/maintenance register, physical bills, lifetime throughput and study scope decision"
    - id: dq_source
      applies_to: "app_line"
      requirement: "Historical EPA route settings and Simplot grade values are illustrative and not default inventory quantities. Demonstrate actual additive absence and the SPA pipe-reaction/bulk-liquid route. Mark scientific review separately from authored methodology."
      evidence: "us-epa-app-1981; simplot-app-14090; actual route/formulation records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "app_product"
    rule: "Exactly one final product matches the 1 kg reference; validate the aqueous APP subset and every qualifier. Reject DAP/MAP, solid APP and other excluded routes even if a broad classification or near name matches."
    source_ids:
      - un-cpc3-34644
      - us-epa-app-1981
  - rule_id: validate_quantities
    applies_to: "all inventory rows"
    rule: "Require common complete period, positive P before normalization, one division and preserved raw totals; compare EN/ZH bases and protocol ownership to app_line. Retain failed/zero-output operations and WIP burdens. Unknown relationships or missing provider basis remain explicit incomplete findings."
    source_ids:
      - eu-cww-2016
  - rule_id: validate_balances
    applies_to: "app_line"
    rule: "Reconcile full wet mass, species/nutrient definitions, N/P/F, water with supported condensation/hydrolysis and stocks; investigate unexplained residuals. No forced yields/water generation/evaporation; no duplicate carrier-water purchases or internal-return exchanges."
    source_ids:
      - eu-cww-2016
      - us-epa-app-1981
  - rule_id: validate_releases
    applies_to: "all emissions and wastes"
    rule: "Check actual species, outdoor-air medium and relevant recipients/controls. Do not sum total fluoride with HF/SiF4 constituents, total P with species, or overlapping PM bins with the same chemical aerosol mass. Direct discharge needs explicit receiving-water/pollutant rows; wastewater sent to treatment is not direct elementary emission."
    source_ids:
      - eu-cww-2016
  - rule_id: validate_allocation
    applies_to: "app_line"
    rule: "Retain complete physical quantities and unallocated totals plus a separately conserved burden account; justify shared assignments and any actual coproduct extension. Reject automatic waste, recovery or heat-substitution credits and fabricated asset/packaging service quantities."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "Manufacturing product dataset for the declared aqueous APP base fertilizer"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared bulk-liquid pipe-reactor APP supply with actual grade/state/route and compatible upstream/treatment data"
  excluded_use: "DAP/MAP, solid APP/flame retardants, nitrophosphate, finished-APP cold blending, fortified recipes, packaged supply, field application/yield comparison and universal kg-N or kg-P equivalence"
  required_metadata: "Reference qualifiers; actual site/period/route; whole supplied-mixture basis; raw period totals and positive-P reconciliation; stocks/rework; source and provider state/unit bases; cooling/steam topology; physical/burden accounts; recipient and asset boundary"
  required_quality_disclosure: "Missing UUID/provider/speciation; uncertainty and balance residuals; supplier definition gaps; failed/zero-output periods; source limitations; allocation/materiality; scientific review pending until separately established"
  update_trigger: "Change of product formulation/state, SPA source/condensation route, reactor/cooling/utility boundary, supplier reference basis, waste receiver, new material emission or asset-life evidence"
