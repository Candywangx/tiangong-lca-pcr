measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference is 1 kg net accepted supplied aqueous APP, including carrier water and dissolved species, excluding transport tare. Collect with cp_product. All inventory and collection bases are per 1 kg reference flow."
  - id: feed_solution_basis
    applies_to: "spa_feed; ammonia_feed; process_water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve complete supplied-mixture mass and actual assays. Acid P2O5-equivalent is not pure H3PO4 mass or whole-feed mass. Carrier water already in SPA is not another external water input."
  - id: nutrient_basis
    applies_to: "app_product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Product kg, elemental P kg, P2O5-equivalent kg and N kg are distinct. P2O5 is an analytical equivalent, not a molecule assumed present. Derive conversions from declared atomic masses and actual assay definitions; never set carrier water to one minus N minus P2O5."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the native reference property; MJ = metered kWh times 3.6. Verify actual 1–35 kV user supply and provider basis. This property name does not turn electric energy into a fuel calorific-value model."
  - id: steam_basis
    applies_to: "steam_in; condensate_return"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain delivered steam kg and measured state, returned kg/state, losses and supplier definition; usable heat is a separate enthalpy calculation, not a fixed MJ/kg. Unknown state/provider basis leaves a concrete dataset incomplete."
  - id: physical_ledgers
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve total mass, water and elemental N/P/F ledgers, stock changes, impurity destinations and reaction water. Reconcile H/O when condensation/hydrolysis changes water speciation. Keep physical exchange quantities distinct from allocated burdens."
