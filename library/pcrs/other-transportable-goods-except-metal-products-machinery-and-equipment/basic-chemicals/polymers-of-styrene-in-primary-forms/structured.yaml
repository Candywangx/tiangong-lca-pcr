        - epa-ap42-ps-1991
    - rule_id: boundary_complete
      applies_to: "all inventory rows"
      rule: "Cards are common atomic interfaces, not a fixed recipe. Before dataset completion, add separate atomic rows and collection links for every actual other aid (including whole antioxidant/initiator formulations), solvent, fuel, refrigerant, packaging, treatment chemical, sludge or release species. Only demonstrated absence permits not_applicable; missing measurement is not zero."
      source_ids:
        - styrenics-ps-2022
        - epa-ap42-ps-1991
    - rule_id: boundary_water
      applies_to: "p_gpps"
      rule: "Bulk GPPS is distinct from suspension/emulsion routes. Cooling-bath and seal-water loops are not aqueous reaction solvent. Record makeup, blowdown, entrainment, condensation, evaporation and stocks; distinguish wastewater transfers from post-treatment releases without duplicating whole wastewater and its constituents."
