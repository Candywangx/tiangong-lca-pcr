system_boundary:
  rules:
    - rule_id: boundary_operations
      applies_to: "p_gpps"
      rule: "Include receipt/storage, blending, reactor circulation, vacuum devolatilization, condensation/distillation recovery, extrusion/cooling/pelletizing, acceptance/rework/stocks and attributable cleaning/abatement. Retain internal-loop amounts/compositions without duplicating external exchanges; monomer backgrounds cannot replace onsite polymerization."
