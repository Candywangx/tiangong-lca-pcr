allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "p_gpps"
    rule: "First separate GPPS grades, HIPS/EPS changeovers and utilities by independent meters and work orders. Retain target-grade startup/shutdown, cleaning, failures and discard burdens; successful operating hours alone are not a completeness boundary."
    source_ids:
      - styrenics-ps-2022
      - epa-ap42-ps-1991
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_recovery
    applies_to: "p_gpps"
    rule: "Internal reuse is not a co-product and earns no substitution credit. Externally sold recovered styrene or bottoms fuel requires independent commodity quality/destination evidence and subdivision first; allocate inseparable burdens using a demonstrated causal physical relation. If unavailable, disclose and independently review an economic method and sensitivity, without default mass/price shares. Complete physical closure before allocation."
    source_ids:
      - styrenics-ps-2022
      - epa-ap42-ps-1991
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "p_gpps"
      flow_role: "out_gpps"
      record_type: "acceptance_and_stock_ledger"
      raw_fields: "lot ID; grade/SKU; thermal route; acceptance/rejection; net supplied mass; tare/free drainage; residual styrene/solvents/oligomers/moisture/additives; opening/closing finished stock; sales/returns/rework/WIP links"
      collection_method: "Owner: production QA and warehouse. Retain unnormalized calibrated lot weights, lab results, acceptance events and stock movements; reconcile production against dispatch and finished stocks. Do not divide by Q."
      unit: "kg; mass fraction; test conditions"
      frequency: "each lot and each stock movement"
      temporal_coverage: "one complete matched production period including failed/zero-output runs and adjacent-period carry links"
      site_scope: "actual line, grade and supplied state"
      aggregation_rule: "Q is unique positive newly accepted production of the same grade/route/state in the matched cohort, reconciled to dispatch plus closing minus opening accepted stock with returns/rework corrections; cp_output does not normalize exchanges. A reaccepted return is counted once only."
      quality_evidence: "calibration; signed acceptance; lot uniqueness; stock reconciliation"
    - protocol_id: cp_feed
      process_id: "p_gpps"
      flow_role: "in_styrene; in_ethylbenzene; in_toluene; in_white_oil"
      record_type: "receipts_tank_issue_and_assay"
      raw_fields: "purchase and issue lot IDs; full formulation mass; active fractions; water/inhibitor/impurity; opening/closing tank stock; internal recovered monomer/solvent; purge; stage; failed-run links"
      collection_method: "Owner: materials custodian and laboratory. Retain whole delivered formulation and raw tank/issue/assay records in original units, including offspec runs and corrections; separate external receipts from internal recovery. No per-kg division."
      unit: "kg; m3; density at actual conditions; mass fraction"
      frequency: "each delivery, issue and assay"
      temporal_coverage: "same full period as cp_output plus opening/closing WIP burden carry"
      site_scope: "actual supplier, tank, recipe and reactor train"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; weighbridge; calibrated tank; supplier COA; independent assay; formulation closure"
    - protocol_id: cp_utilities
      process_id: "p_gpps"
      flow_role: "in_electricity; in_steam_heat; in_nitrogen"
      record_type: "meter_and_delivery_records"
      raw_fields: "stage and timestamp; meter readings and multipliers; native units; voltage; heat delivery/return boundary; steam pressure/temperature/enthalpy; gas volume basis; integrated-vs-rate flag; shared-load allocation; failures; WIP links"
      collection_method: "Owner: site utilities engineer. Preserve raw start/end meters or rates with durations, integrated volumes, invoices and stage logs. Retain all target-related failed/zero-output operation, recovery, cleaning and abatement. Do not divide by production."
      unit: "kWh; MJ; kg; m3 with conditions; rates with duration"
      frequency: "continuous logs with period-end reconciliation"
      temporal_coverage: "same full period and carry links as cp_output"
      site_scope: "reaction, recovery, extrusion/cooling, storage and attributable common services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices; heat-state evidence; allocation rationale; downtime logs"
    - protocol_id: cp_water
      process_id: "p_gpps"
      flow_role: "in_water; out_wastewater; out_water_vapour"
      record_type: "water_balance_and_sampling"
      raw_fields: "source and quality; raw makeup; recirculation; seal/quench loops; drains; evaporation; condensate; wastewater wet mass; species concentrations; actual reaction-water evidence; opening/closing water stocks; destination"
      collection_method: "Owner: water/effluent engineer and laboratory. Retain independent raw intake/outlet meters, wet mass, temperature/density and representative sampling before normalization; no inferred outlet or reaction water from a common closure residual."
      unit: "kg; m3; mass fraction; concentration with units"
      frequency: "meters continuously; event-linked representative samples"
      temporal_coverage: "same complete period including cleaning, failures and WIP changes"
      site_scope: "declared external supply, direct contact and wastewater delivery boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; sample chain; moisture analyses; phase-change and reaction-water evidence"
    - protocol_id: cp_pack
      process_id: "p_gpps"
      flow_role: "in_bag"
      record_type: "packaging_issue_ledger"
      raw_fields: "PE bag identity; counts; measured unit masses; damaged/returned bags; opening/closing stocks; lot linkage; other packaging components"
      collection_method: "Owner: dispatch packaging custodian. Preserve raw counts and independently weighed bag masses, issues and losses with batch links; no output-normalized collection."
      unit: "count; kg per measured bag; kg"
      frequency: "each issue and representative lot weighing"
      temporal_coverage: "same matched period including losses and returns"
      site_scope: "actual supplied pellet packaging system"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing records; issue/return reconciliation; composition certificate"
    - protocol_id: cp_residues
      process_id: "p_gpps"
      flow_role: "out_bottoms; out_ps_reject"
      record_type: "waste_manifest_and_composition"
      raw_fields: "stream ID; raw wet mass; water; styrene/ethylbenzene/oligomer content; destination; recovered-vs-purged status; rework; rejected lots; stock changes"
      collection_method: "Owner: recovery supervisor and waste manager. Preserve unnormalized weighed purges, waste transfers and independent composition samples; retain failures and returned/reworked lots without calling them new product."
      unit: "kg; mass fraction"
      frequency: "each purge and transfer with representative samples"
      temporal_coverage: "same complete period with residue stocks and burden carry"
      site_scope: "actual recovery and external waste/recovery destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "waste tickets; destination receipts; sampling; recovery reconciliation"
    - protocol_id: cp_emissions
      process_id: "p_gpps"
      flow_role: "out_styrene_air; out_ethylbenzene_air; out_toluene_air"
      record_type: "post_control_species_and_fugitives"
      raw_fields: "species; CAS; control boundary; stack/fugitive source; air subcompartment; flow and concentration conditions; duration; integrated flag; sampling; capture/destruction; startup/failure periods"
      collection_method: "Owner: site environmental engineer and accredited sampling laboratory. Preserve raw post-control species concentrations, measured gas flow/time or integrated gas amount and fugitive evidence. Do not use COD or total VOC as a specific chemical mass and do not divide by Q."
      unit: "kg; mg/m3 with conditions; m3; time for rates only"
      frequency: "continuous where available plus event-representative tests"
      temporal_coverage: "complete same period including startups, failures, shutdowns and abnormal releases"
      site_scope: "storage, feed, reactor vents, vacuum/recovery and pellet handling to actual air compartment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test report; raw meter logs; detection limits; calibration; control status; fugitive method"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Before normalization only, convert native raw amounts: tonnes to kg; integrated liquid m3 times measured density at matched composition/temperature; integrate rates with corresponding duration, never multiply an integrated volume by time again; derive species mass from independent concentration and volume at consistent conditions; kWh times 3.6 gives MJ, while steam delivered heat needs independently supported actual enthalpy difference. Native property factors establish neither material density nor supplier amounts."
      inputs:
        - cp_feed
        - cp_utilities
        - cp_water
        - cp_pack
        - cp_residues
        - cp_emissions
      output: "converted raw-period amounts"
      source_ids:
        - styrenics-ps-2022
        - epa-ap42-ps-1991
    - id: match_period
      applies_to: "all inventory rows"
      rule: "Retain complete physical period balances and trace each exchange numerator A_e to the target newly accepted production using lots/stocks/work orders. Include related failures/zero-output runs, startup, losses, rework and opening-WIP carried burdens released this period; deduct only the same explicitly traced burdens carried into closing WIP/other products. Opening/closing WIP needs mass, conversion/composition and accumulated burden by exchange, not blind mass subtraction from energy. Pair internal recovery/rework without repeating first inputs or reaccepted returns as new production. Keep physical and attributable burden ledgers separately. Retain zero-Q periods with explicit subsequent attribution, without deletion or division by zero."
      inputs:
        - "converted raw-period amounts"
        - cp_output
        - "WIP burden ledger"
        - "lot genealogy"
      output: "A_e; Q; matched-period audit ledger"
      source_ids:
        - styrenics-ps-2022
        - epa-ap42-ps-1991
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Sole normalization owner: after convert_raw and match_period, divide each numerator A_e once by the same cohort positive accepted supplied output Q in kg, reporting exchanges per 1 kg reference flow. Cards and aggregation_rule point to that same result without another division; out_gpps is fixed at 1 kg. Q must be positive and includes measured supplied-state residuals/additives/moisture, excludes packaging/free drainage, and cannot be replaced by feed mass, dry polymer, sales stock release or unaccepted quantity."
      inputs:
        - A_e
        - Q
        - convert_raw
        - match_period
      output: "single per-reference exchange report"
      source_ids:
        - styrenics-ps-2022
        - epa-ap42-ps-1991
    - id: close_species
      applies_to: "p_gpps"
      rule: "Before allocation, independently close total physical mass and relevant C/H/O elements: external inputs plus opening stocks equal actual outputs plus closing stocks; internal loops cancel. Separately build an actual species/reaction ledger from feed composition, conversion/polymer and oligomers, residual monomer/solvent, purge and speciated releases. The main n C8H8 to (C8H8)n addition forms no chemical water; ideal atom correspondence is not a 1:1 actual yield or zero residual monomer. Any side-reaction/initiator/abatement water formation or consumption needs independent reactions, species and extent evidence; physical condensation/evaporation/structural or free-water changes remain separate. Never solve unknown reaction water and an unknown outlet from one closure residual. Retain discrepancies as uncertainty/investigation, not COD or residual-fitted species."
      inputs:
        - cp_feed
        - cp_output
        - cp_water
        - cp_residues
        - cp_emissions
        - "physical stock ledger"
      output: "independent physical elemental and actual species/water balances"
      source_ids:
        - styrenics-ps-2022
        - epa-ap42-ps-1991
  data_quality_requirements:
    - id: quality_identity
      applies_to: "out_gpps"
      requirement: "Trace actual grade, thermal route, pellet state and full acceptance criteria to the same lots; neither neighbouring plastic UUIDs nor absent native CAS establish them."
      evidence: "lot COA; route/recipe records; supply and acceptance signatures"
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "Include failures/zero-output runs, returns/rework, opening/closing WIP and carried burdens once and explain period mismatches."
      evidence: "physical and burden ledgers; work orders; stocks; unique normalize_period report"
    - id: quality_limits
      applies_to: "all inventory rows"
      requirement: "Match every native name component, geography, route, grade, medium, property and reference unit to measurements; UUIDs are not providers or quantities. Disclose toluene classification debt, unspecified geography/grade and unresolved UUID/background coverage."
      evidence: "complete native identity; provider/background comparison; sampling/calibration and uncertainty"
validation_rules:
  - rule_id: validate_scope
    applies_to: "out_gpps"
    rule: "Reject HIPS/EPS/copolymer/foamed-article substitution; the unique out_gpps terminal Product output must agree with the reference UUID. Preserve intermediates and real co-products without renaming to hide shared UUIDs."
    source_ids:
      - styrenics-ps-2022
      - epa-ap42-ps-1991
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Check raw periods, native conversions, complete WIP carry, unique positive Q and the sole normalize_period report. Collection must not execute A/Q; cards/aggregation cannot normalize again. Missing data, unexplained imbalance or unsupported conversion makes the concrete dataset incomplete."
    source_ids:
      - styrenics-ps-2022
      - epa-ap42-ps-1991
  - rule_id: validate_completeness
    applies_to: "p_gpps"
    rule: "Check all actual atomic exchanges and background coverage, whole formulations without duplicate procurement, independent physical/element and species/reaction-water ledgers, internal recycle versus external purge and pre/post-control boundaries; Schema or UUID checks do not establish scientific approval."
    source_ids:
      - styrenics-ps-2022
      - epa-ap42-ps-1991
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Upstream supply of GPPS pellets of the declared grade, route, state and geography"
  allowed_use: "LCA of compatible resin supply after applicability verification and complete upstream/treatment linking"
  excluded_use: "No foam/moulded functionality, HIPS/EPS/copolymer substitution or functional material ranking solely from per-kg resin results"
  required_metadata: "period; site; grade/recipe and route; supplied state/acceptance; reference UUID/unit; stocks/WIP/zero-output; all operation/supply/abatement boundaries; background versions/coverage; allocation and sources"
  required_quality_disclosure: "measured versus estimated data; native limits/classification debt; residual monomer/solvent/moisture; sampling representativeness; detection/meter uncertainty; physical/species imbalance; unmatched UUID/background and independent scientific review state"
  update_trigger: "change in grade/feed/initiation/solvent/supply or abatement boundary, equipment or acceptance; new residual/moisture evidence; identity/property/background revision"
data_sources:
  - id: "styrenics-ps-2022"
    type: "literature"
    reference: "Styrenics Circular Solutions/PlasticsEurope, General-Purpose Polystyrene (GPPS) and High-Impact Polystyrene (HIPS), November 2022, sections 2.1–2.3, PDF pp.9–10. https://www.styrenics.info/wp-content/uploads/2022/12/221107_Eco-profile_PS.pdf"
    used_for: "GPPS/HIPS physical distinction, primary granule delivery and continuous mass/devolatilization/recovery/pelletizing. Qualitative European-industry scope only; no average recipe, numerical factor, background, yield or energy default and no HIPS rubber passage applied to GPPS."
  - id: "epa-ap42-ps-1991"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 6.6.3 Polystyrene, September 1991, reformatted January 1995; 6.6.3.1–6.6.3.2.1 and Figure 6.6.3-2, PDF pp.1–5. https://www.epa.gov/sites/default/files/2020-10/documents/c06s06-3.pdf"
    used_for: "Thermal continuous mass route, monomer recovery/vents/oligomer purge and cooling/pelletizing; independent GPPS/HIPS/EPS boundary support. Historical US topology, not current site data; no emission factors, temperature, conversion or negligible-emission claims adopted."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, first edition March2010, §7.9.3, printed257–258/PDF277–278; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional virtual subdivision, determining physical causality and residual process-gate market value support the allocation-method choice. No GPPS recipe, fixed mass/price share, off-grade cut-off, recovered-material substitution credit or full PEF/CFF approval is adopted."
