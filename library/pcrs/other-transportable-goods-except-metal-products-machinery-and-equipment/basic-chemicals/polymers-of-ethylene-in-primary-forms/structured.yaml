allocation_rules:
  - rule_id: direct_attribution
    applies_to: "foreground_burden_allocation"
    rule: "First segregate by site, reactor route and accepted resin grade; directly attribute feed, utilities and treatment using matched meters and batch/campaign records. Shared burdens need measured physical drivers and a stated allocation rationale and sensitivity. Do not infer equal utility consumption or blend routes from a common generic flow identity. ec-polymers-bref-2007  ec-polymers-bref-2007"
    source_ids:
      - ec-polymers-bref-2007
      - jrc-ilcd-allocation-2010
  - rule_id: secondary_outputs
    applies_to: "foreground_burden_allocation"
    rule: "Wax, off-grade resin and actually exported steam are separately quantified outputs, never extra accepted reference output. Avoid allocation where subdivision is possible. If a sold output requires allocation, record actual quality/function and quantities, then identify and apply supported determining physical causal relationships to each exchange, including virtual subdivision where possible. Only remaining burdens that cannot be assigned this way may use documented market values for actual co-functions at the same process-exit condition; explain why physical assignment is unavailable, document matched-period quantities/prices, and report sensitivity. Waste is not silently promoted to coproduct. Recycle is not an avoided virgin purchase credit. Heat recovered and used internally reduces measured import only; no second export credit. ec-polymers-bref-2007 lyb-lupotech-2025  ec-polymers-bref-2007; lyb-lupotech-2025"
    source_ids:
      - ec-polymers-bref-2007
      - lyb-lupotech-2025
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed
      process_id: "p_primary"
      flow_role: "Individual fresh chemical, formulation and air supply"
      record_type: "delivery and stock ledger"
      raw_fields: "lot ID; material/formulation/CAS; supplier; assay and component/carrier fractions; receipt and return masses; tank openings/closings; dosing; gas conditions; impurities; each actual initiator/modifier identity"
      collection_method: "Owner: primary plant material custodian. Retain raw delivery, calibrated scale/tank and dosing records for the entire period, including failed and transition runs; keep externally purchased formulations and assayed components separate. Record gas volume or rate with its original unit/time basis. Do not divide by output here."
      unit: "Raw kg; m3 with stated conditions; kWh; MJ; concentrations in original laboratory units, by record type"
      frequency: "Each receipt, run, meter interval, analysis and stock boundary"
      temporal_coverage: "Complete matched reporting period including failed/zero-output operations and opening/closing WIP"
      site_scope: "Declared site and this protocol process owner; same grade/route/state; retain submeter/stream boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier certificates; calibration; component assay; opening/closing reconciliation; recipe and source route evidence"
    - protocol_id: cp_energy
      process_id: "p_primary"
      flow_role: "Each primary utility and fuel"
      record_type: "meter and utility balance"
      raw_fields: "meter ID and operation owner; interval readings; actual utility grade; voltage; pressure/temperature; integrated gas volume or flow rate and duration; gas composition; heating basis; steam enthalpy and condensate; internal recovery; export; downtime"
      collection_method: "Owner: primary plant energy engineer. Preserve raw meter differences and fuel records, including failed/zero-output operations, maintenance, recovery and pollution control. Distinguish purchased utilities from on-site generation; no raw-period output division. An integrated volume is already accumulated; rate records retain their measured duration."
      unit: "Raw kg; m3 with stated conditions; kWh; MJ; concentrations in original laboratory units, by record type"
      frequency: "Each receipt, run, meter interval, analysis and stock boundary"
      temporal_coverage: "Complete matched reporting period including failed/zero-output operations and opening/closing WIP"
      site_scope: "Declared site and this protocol process owner; same grade/route/state; retain submeter/stream boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrations; supplier/geography; energy allocation meter diagram; enthalpy/heat-value evidence; import/export receipts"
    - protocol_id: cp_production
      process_id: "p_primary"
      flow_role: "Internal and off-grade LDPE production"
      record_type: "batch and stock genealogy"
      raw_fields: "run ID; reactor and initiation route; grade; recipe; start/end; accepted internal output; off-grade; failed/zero-output runs; returned/reworked lot IDs; opening/closing WIP and silo mass; species fractions; incoming and outgoing carried burden vectors"
      collection_method: "Owner: production supervisor. Preserve original run, QC, weighing and inventory records for every included run; identify both physical stock mass and inherited burden by lot. No presumption that polymerisation feed equals accepted output, and no division by product quantity."
      unit: "Raw kg; m3 with stated conditions; kWh; MJ; concentrations in original laboratory units, by record type"
      frequency: "Each receipt, run, meter interval, analysis and stock boundary"
      temporal_coverage: "Complete matched reporting period including failed/zero-output operations and opening/closing WIP"
      site_scope: "Declared site and this protocol process owner; same grade/route/state; retain submeter/stream boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "reactor logs; COA; moisture/residual-monomer tests; WIP and rework reconciliation; failed-batch burden retention"
    - protocol_id: cp_recovery
      process_id: "p_primary"
      flow_role: "Each recovered species and purge destination"
      record_type: "recycle, purge and destination ledger"
      raw_fields: "loop/stream ID; route; gross circulation; fresh makeup; purge/export; wax and oil separation; species mass/composition including ethylene and every actual impurity; retained gas/liquid/polymer inventory; source/destination; sale or waste"
      collection_method: "Owner: recovery engineer. Retain raw flowmeters, actual gas/liquid analyses, oil/wax weighings and destination receipts. Record internal transfers without external purchase credits and distinguish true purification/abatement species changes. Preserve unknowns explicitly; do not divide by output."
      unit: "Raw kg; m3 with stated conditions; kWh; MJ; concentrations in original laboratory units, by record type"
      frequency: "Each receipt, run, meter interval, analysis and stock boundary"
      temporal_coverage: "Complete matched reporting period including failed/zero-output operations and opening/closing WIP"
      site_scope: "Declared site and this protocol process owner; same grade/route/state; retain submeter/stream boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stream diagram; GC and sampling; tank calibration; purifier/cracker transfer receipts; actual sale specification"
    - protocol_id: cp_environment
      process_id: "p_primary"
      flow_role: "Every waste and air substance"
      record_type: "source-resolved emission and waste record"
      raw_fields: "source ID; molecular/CAS identity; compartment; raw concentration and flow or mass; dry/wet and standard conditions; timestamps; uptime/downtime/emergency; capture/treatment efficiency; destination; molecular inventory; carbon source; uncertainty and detection limit"
      collection_method: "Owner: site environmental engineer. Preserve original species-resolved monitoring, sampling, leak/emergency logs, waste weigh tickets and treatment records for the full period. Keep pre-treatment capture and final discharge distinct, including failed/zero-output runs; never infer a molecular split from total VOC/COD or divide records by output."
      unit: "Raw kg; m3 with stated conditions; kWh; MJ; concentrations in original laboratory units, by record type"
      frequency: "Each receipt, run, meter interval, analysis and stock boundary"
      temporal_coverage: "Complete matched reporting period including failed/zero-output operations and opening/closing WIP"
      site_scope: "Declared site and this protocol process owner; same grade/route/state; retain submeter/stream boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling plan; laboratory species analysis; validated raw emission method; LDAR; waste receiver; balances and uncertainties"
    - protocol_id: cp_water
      process_id: "p_primary"
      flow_role: "Physical water and waterborne species"
      record_type: "water and speciation ledger"
      raw_fields: "each intake; recirculation; steam/condensate; feed moisture; evaporation; wastewater; actual final waterborne species; phase water; opening/closing stocks; independently supported water formation/consumption; concentration and integrated volume"
      collection_method: "Owner: site water-balance engineer. Keep original water meters, analyses, steam balances and moisture tests. Separate physical/elemental closure from supported chemical species and phase changes; no residual-derived reaction water. Raw period quantities remain unnormalised."
      unit: "Raw kg; m3 with stated conditions; kWh; MJ; concentrations in original laboratory units, by record type"
      frequency: "Each receipt, run, meter interval, analysis and stock boundary"
      temporal_coverage: "Complete matched reporting period including failed/zero-output operations and opening/closing WIP"
      site_scope: "Declared site and this protocol process owner; same grade/route/state; retain submeter/stream boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water-meter calibration; species analysis; receiving-water identity; independent reaction evidence; uncertainty"
    - protocol_id: cp_gate
      process_id: "p_bulk_gate"
      flow_role: "Unique accepted bulk supply and gate burdens"
      record_type: "loading, acceptance and stock genealogy"
      raw_fields: "transfer and lot IDs; grade/route/state; net accepted supplied mass; gross/tare; COA; receipt/return/rework; opening/closing silo stocks; loading electricity; spillage/dust; inherited burden vector; period start/end"
      collection_method: "Owner: bulk-gate quality and dispatch custodian. Preserve raw calibrated weighbridge/loading and gate energy records; reconcile lot-level acceptance and returns once, retain non-output losses and carried WIP burdens. Identify new positive acceptance of this exact grade/route/state; do not divide any exchange by output in collection."
      unit: "Raw kg; m3 with stated conditions; kWh; MJ; concentrations in original laboratory units, by record type"
      frequency: "Each receipt, run, meter interval, analysis and stock boundary"
      temporal_coverage: "Complete matched reporting period including failed/zero-output operations and opening/closing WIP"
      site_scope: "Declared site and this protocol process owner; same grade/route/state; retain submeter/stream boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge calibration; signed COA and release; lot genealogy; no duplicate acceptance; gate meter boundary"
  calculation_rules:
    - id: native_conversion
      applies_to: "all raw inventory records"
      rule: "Before reporting normalisation, convert each raw numerator to its declared card unit using traceable native units: t to kg and kWh to MJ only as appropriate; a rate is integrated over measured duration, while integrated volume is not multiplied by time again. Convert volume to mass only with actual temperature/pressure/composition and an independently valid density or gas relation. No default resin/solvent density, heating value or secondary property coefficient."
      inputs:
        - raw_records
        - unit_evidence
        - cp_feed
        - cp_energy
        - cp_environment
        - cp_water
        - cp_gate
      output: "converted_raw_period_amounts"
      source_ids: []
    - id: matched_period_ledger
      applies_to: "all raw inventory records"
      rule: "Preserve the complete chosen-period burden vector A_i by site/grade/route/state, including all failed and zero-output operation and actual treatment burdens. Reconcile opening WIP/rework inherited burdens into the completed lots and carry closing WIP burdens forward once; no discarded operation may be omitted, and no inherited vector may be charged twice. Match transfers and reverse only genuine paired internal transfers for whole-foreground aggregation. Keep physical stock mass and burden carry ledgers separate, with explicit allocation of each burden to supplied, retained, off-grade or waste lots. This rule does not divide by Q."
      inputs:
        - converted_raw_period_amounts
        - cp_production
        - cp_recovery
        - cp_gate
      output: "matched_A_i; stock_and_carry_reconciliation"
      source_ids: []
    - id: accepted_supply
      applies_to: "bulk_supplied_ldpe"
      rule: "Q is the sum of unique new positive accepted net supplied kg of this declared grade/route/state in the matched period, reconciled to gross minus tare, quality release, returns, rework and opening/closing finished stock. Intermediate transfer, sold off-grade, losses and repeated acceptance do not increase Q. No report normalisation exists when Q is zero."
      inputs:
        - cp_gate
        - cp_production
        - acceptance_and_stock_records
      output: "Q"
      source_ids:
        - lyb-lupolen-2420k-2026
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Sole reporting-normalisation owner: q_i = matched_A_i / Q, for common positive Q after native_conversion and matched_period_ledger. Each card and protocol aggregation describes this same reported result per 1 kg reference flow; neither performs a second division. The terminal output is 1 kg. Keep raw numerator, conversion, carry/allocation and common Q traceable."
      inputs:
        - matched_A_i
        - Q
      output: "reported_inventory_per_1_kg"
      source_ids: []
    - id: species_and_elements
      applies_to: "p_primary; p_bulk_gate"
      rule: "Reconcile physical mass and each applicable element (C, H, O, N, S and formulation-specific elements) from complete inputs plus opening stock to outputs plus closing stock. Independently track actual polymer, residual ethylene, every impurity/modifier/carrier/initiator, oil, wax and decomposition product in all gas/liquid/solid phases and inventories. Distinguish single-pass conversion, recycle recovery, fresh-feed utilisation and accepted yield; measure each needed relation rather than assuming 100%. DTBP may form acetone, methane and tert-butanol, but the source supplies no universal split. Species unknowns remain unknown and require investigation, not residual-fitting."
      inputs:
        - cp_feed
        - cp_production
        - cp_recovery
        - cp_environment
        - cp_gate
      output: "physical_element_and_species_reconciliation"
      source_ids:
        - ec-polymers-bref-2007
        - nouryon-trigonox-b-2025
    - id: independent_water
      applies_to: "p_primary; p_bulk_gate"
      rule: "Keep a distinct water ledger for supply/carrier/feed moisture, steam/condensate, evaporation, final effluent, retained/free water and stocks. Ethylene addition to the polyethylene repeat chain does not itself produce condensation water. Any water from actual side reaction, peroxide chemistry, fuel oxidation or purification requires independent molecular/pathway evidence and measured inputs; phase changes do not create water. Do not solve an unknown reaction-water term and another unknown outlet from the same closure residual; COD and carbon closure cannot supply either term."
      inputs:
        - cp_water
        - cp_feed
        - cp_energy
        - cp_environment
      output: "water_reconciliation_and_unresolved_terms"
      source_ids:
        - ec-polymers-bref-2007
        - nouryon-trigonox-b-2025
  data_quality_requirements:
    - id: grade_and_route
      applies_to: "reference and all lots"
      requirement: "Record real grade and monomer identity, reactor/initiator/carrier chemistry, non-additivated state, net delivery form and test conditions. The same native LDPE UUID is not grade equivalence; suppliers must demonstrate acceptance and route independently."
      evidence: "supplier COA; actual production logs; grade specification; reference qualifiers"
    - id: complete_period
      applies_to: "all inventory rows"
      requirement: "Use a complete common period across manufacturing and dispatch, including failures, shutdowns and zero-output operation. Retain boundaries, uncertainty, allocation, WIP/rework and inherited burden genealogy without dropping or recharging burdens."
      evidence: "meter/run/stock reconciliation and retained raw numerator ledger"
    - id: native_identity_limits
      applies_to: "UUID-bearing cards"
      requirement: "LDPE: generic Product granulate, no CAS/route/grade/geography/comment. Heptane: CAS142-82-5, production mix at plant, no geography/route; recovered quality/provider still needs checking. Process Water: treated industrial water without explicit geography/route/quality. Nitrogen: generic Mass identity without CAS/route/grade/geography. Each has only reference Mass coefficient1; no native density or calorific assumption. Use their full restrictions and separately measure quantity/provider compatibility."
      evidence: "complete native flow and exact reference-property/unit chain; provider records"
    - id: species_completeness
      applies_to: "material and environmental ledgers"
      requirement: "Track all actual purchased chemicals/formulations and all process/waste/emission species, not just carbon or the selected reference. Unidentified consequential species, unmeasured actual losses or contradictory reference/route must block the dataset claim and be reported; an auxiliary blank UUID alone does not invent such a method gap."
      evidence: "complete physical/element/species and independent water audits"
validation_rules:
  - rule_id: reference_identity
    applies_to: "foreground_dataset_conformance"
    rule: "Require one explicit terminal link to bulk_supplied_ldpe, a Product output matching the declared LDPE reference UUID and 1 kg net basis in both languages. Preserve the same native UUID on physically distinct internal and off-grade granulate rows where applicable; those rows do not become terminal references. Reject HDPE slurry/gas-phase, LLDPE, EVA, recycled, film or compound identities for this output."
    source_ids: []
  - rule_id: single_normalisation
    applies_to: "foreground_dataset_conformance"
    rule: "Verify a complete matched raw-period numerator and common positive accepted supply Q. Only normalize_period performs reporting division, after native conversions and burden carry reconciliation. Reject a second A/Q in collection, aggregation, cards or downstream calculation. Keep failed/zero-output operation, returns/rework, transition grades, opening/closing WIP and inherited burdens; no denominator if Q is zero."
    source_ids: []
  - rule_id: molecule_and_water_checks
    applies_to: "foreground_dataset_conformance"
    rule: "Check total physical mass and every applicable element independently from actual molecular reaction/recovery pathways and the separate water ledger. Track ethylene, polymer, each modifier/carrier/initiator and its decomposition products, retained volatiles and inventory changes; quantify actual contaminants and unexplained residuals. Ethylene addition polymerisation itself has no condensation-water stoichiometry. No residual, carbon-only closure or COD may invent species, water or 100% conversion/yield. ec-polymers-bref-2007 nouryon-trigonox-b-2025  ec-polymers-bref-2007; nouryon-trigonox-b-2025"
    source_ids:
      - ec-polymers-bref-2007
      - nouryon-trigonox-b-2025
  - rule_id: coverage_and_sources
    applies_to: "foreground_dataset_conformance"
    rule: "Disclose missing measurements, unidentified species and unverified provider links. Before a foreground dataset is usable, resolve its actual reference/route, all material species and consequential missing amounts; a PCR protocol does not fabricate those measurements. Preserve full native names, geography, medium and exact property-to-unit relations and source limitations. Schema or UUID equality alone is not scientific validation."
    source_ids: []
published_dataset_profile:
  dataset_role: "Primary foreground LDPE resin manufacture and bulk supply; explicitly gate-to-gate unless upstream links are included."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared-grade LDPE resin feedstock for separately modelled conversion, after applicability and evidence review."
  excluded_use: "Generic interchangeable polyethylene family, recycled resin, EVA/LLDPE/HDPE, additive compound, pipe/film/fibre conversion or full service-life claims."
  required_metadata: "Site/time; actual grade, route and species; accepted bulk Q and stock/carry reconciliation; reference UUID and property/unit; upstream source gates; utility geography; allocation and treatment scope."
  required_quality_disclosure: "Raw evidence and uncertainty, failures/zero-output inclusion, WIP/rework carried burdens, missing providers/UUIDs/measurements, native limitations and species/water balance residuals. Source examples are not supplier measurements."
  update_trigger: "Change in grade, reactor/initiation/recipe, carrier, supply origin/state, recovery/purge or abatement, energy source, accepted-output definition or material measurement evidence."
data_sources:
  - id: "ec-polymers-bref-2007"
    type: "official_guidance"
    reference: "European Commission, Production of Polymers BREF, August 2007, sections 3.2.1.1, 3.2.2, 3.3.1 and Table 3.9; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/pol_bref_0807.pdf"
    used_for: "Industrial route differences, incomplete single-pass conversion, compression/recycle/purge, wax separation, extrusion/degassing and environmental coverage. European historical description; 1999 survey aggregates are not present-site factors. Table 3.9 VOC/COD and primary-energy values cannot supply individual molecular flows or utility meters."
  - id: "lyb-lupotech-2025"
    type: "literature"
    reference: "LyondellBasell, Lupotech brochure 8735/25/08, pages 1–2 and Figures 1–2; https://www.lyondellbasell.com/globalassets/lyb/our-solutions/technologies/petrochemical/polyethylene/cta/Lupotech.pdf"
    used_for: "Distinct tubular T and autoclave A process sequences and heat recovery. No process solvent/catalyst describes the reaction medium, not absence of peroxide carriers, modifiers or compressor oil. Recovery marketing is not measured 100% recovery. No assignment of a reactor or recipe to a named SKU."
  - id: "nouryon-trigonox-b-2025"
    type: "literature"
    reference: "Nouryon, Trigonox B Product Data Sheet, 2025-12-4, pages 1–2; https://www.nouryon.com/globalassets/inriver/resources/pds-trigonox-b-polymer-production-glo-en.pdf"
    used_for: "Commercial DTBP initiator, CAS 110-05-4, usable in tubular/autoclave LDPE; assay, active oxygen and physical density are different quantities; acetone, methane and tert-butanol are major decomposition products. No recipe, emission split or universal dose. Chlorobenzene is a half-life test medium, not an inferred plant input."
  - id: "lyb-lupolen-2420k-2026"
    type: "literature"
    reference: "LyondellBasell, Lupolen 2420K Technical Data Sheet, locally acquired publication date 10/15/2026, pages 1–3; https://productsafety.lyondellbasell.com/DirectRequest?ProductGuid=79326e74-b73c-4977-9f56-b9e12367c004&ResponseTypeGuid=f1e32c20-d810-4db0-b25e-8e23a59f3733"
    used_for: "Real non-additivated LDPE pellet grade and bulk-container delivery example. Typical properties are not specification limits or bulk density; film test and conversion temperatures are downstream tests, not polymerisation conditions. Regional sales availability is not manufacturing geography. No medical/pharmaceutical use or SKU reactor/initiator claim."
  - id: "arkema-wo2025133548"
    type: "literature"
    reference: "Arkema France, WO2025133548A1, published 2025-06-26, French original printed page 22, Protocole expérimental; https://patents.google.com/patent/WO2025133548A1"
    used_for: "Specific heptane carrier and propionaldehyde chain-transfer-agent example in a laboratory batch stirred high-pressure autoclave. The tested peresters, laboratory scale and measured results are case-specific; no industrial recipe, DTBP amount, commercial grade identity, yield or scale-up factor is adopted."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, first edition March2010, §7.9.3, printed257–258/PDF277–278; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality method context: virtual subdivision and determining physical causality, then justified process-gate market value for remaining burdens. Supports allocation choices only; no LDPE recipe, universal mass/price share, recovered-material credit, heat substitution credit or full PEF/CFF claim."
