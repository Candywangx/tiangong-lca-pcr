  native_limitations: "Selected reference is generic LDPE granulate with Mass only and no CAS/route/grade/geography/comment. Selected heptane is CAS142-82-5 production mix at plant, no explicit route/geography; recovered-heptane provider/quality remains to verify. Selected Process Water is treated industrial water, no geography/route/quality. Selected nitrogen has Mass only, no CAS/route/grade/geography. Full native state100 evidence retained outside canonical content."
  source_limits: "Lupolen2420K is a real non-additivated pellet/bulk example, not an assignment to a reactor or recipe. BREF historical and vendor descriptions give methods, not default quantities. Patent carrier/modifier evidence is laboratory-specific. TrigonoxB product assay, active oxygen, density and half-life medium are distinct; no plant recipe/decomposition split inferred."
  data_production_requirements: "Future site/grade/provider/Q/recipe and measurements must satisfy the protocols; complete raw species and independent water ledgers; sole normalisation owner normalize_period; failures, zero-output, WIP and inherited burdens retained. Actual consequential unknowns block dataset claims until resolved."
