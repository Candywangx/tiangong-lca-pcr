allocation_rules:
  - rule_id: allocation_physical
    applies_to: "bcs_manufacture"
    rule: "Keep unallocated stage mass and Cr/S/Na/water balances separately from the attributed environmental-burden ledger. Never multiply physical outputs or internal transfer amounts by an allocation fraction."
    source_ids:
      - eu-sic-2007
      - eu-cww-2016
      - ilcd-lca-2010
  - rule_id: allocation_sulfate
    applies_to: "bcs_manufacture"
    rule: "Sodium sulfate retained in the sold powder is a constituent, not a separate coproduct. No automatic credit or allocation to retained salt. A separately recovered, sold sulfate stream needs a new measured product row and an explicit reviewed coproduct treatment before use."
    source_ids:
      - cn1099727a-route
  - rule_id: allocation_shared
    applies_to: "bcs_manufacture"
    rule: "Submeter shared utilities by stage and campaign; where impossible document the measured physical service driver, period and uncertainty, reconcile to the site total and disclose other products. No universal allocation percentage or economic price is assumed."
    source_ids:
      - eu-sic-2007
      - ilcd-lca-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "bcs_manufacture"
      flow_role: "reference_product"
      record_type: "foreground_record"
      raw_fields: "Calibrated net product mass; batch; grade; moisture; basicity; analytical procedure/version; original sample dissolution and insolubles; matched aliquot/dilution factors; standardized titrant concentrations and blank-corrected a/b titres; endpoints; replicates and uncertainty; total Cr and Cr(VI) method/LOQ; sodium sulfate; opening/closing stock; rework ; period/cohort and original movement IDs; R first production release; D_gross outward product before return netting; U actual received returns; M physical loss/rework removals; accepted net delivery P; opening/closing raw/WIP/FG masses and per-exchange original-unit carried burden vectors; return burden provenance/original reversal; failed/zero-output/idle/cleaning/rework records; row_id; current-activity basis (gross receipts or stock-reconciled issues/consumption); linked raw receipt/issue/return reconciliation IDs; raw-stock adjustment already applied flag; original-unit same-exchange vector/lot/stage provenance; physical return U versus original delivery/burden reversal IDs"
      collection_method: "Weigh net accepted same-grade product excluding packaging; reconcile production/dispatch and stocks; sample representative batches with matrix-validated assays Retain undivided delivery, return, release, stock and burden records for the complete matched period including failed/zero-output work. P is unique actual accepted net delivery, not R. No collection division; normalize_exchange alone reports the final per-kg result."
      unit: "kg"
      frequency: "Each batch/stage; representative outlet monitoring including events"
      temporal_coverage: "Same representative reporting period across all rows"
      site_scope: "Declared line, grade and treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling coverage; assay method/LOQ; supplier records; missing data and uncertainty disclosure"
    - protocol_id: cp_material
      process_id: "bcs_manufacture"
      flow_role: "chemical feeds"
      record_type: "foreground_record"
      raw_fields: "Delivered and used mass; assay; SKU; phase; concentration; salt/water fractions; supplier; stoichiometry; grade; stock changes"
      collection_method: "Weigh batches/tank stock changes with calibrated equipment; retain COA/SDS and measurements; gas conversion uses actual T/P/composition/Z; not theoretical dose"
      unit: "kg"
      frequency: "Each batch/stage; representative outlet monitoring including events"
      temporal_coverage: "Same representative reporting period across all rows"
      site_scope: "Declared line, grade and treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling coverage; assay method/LOQ; supplier records; missing data and uncertainty disclosure"
    - protocol_id: cp_water
      process_id: "bcs_manufacture"
      flow_role: "process_water"
      record_type: "foreground_record"
      raw_fields: "Stage inlet volumes; density; temperature; recycle/purge; cleaning periods; water quality"
      collection_method: "Use calibrated stage meters and actual density; reconcile new water, retained water, condensate, evaporated water and transfers without counting recycle twice"
      unit: "m3; kg"
      frequency: "Each batch/stage; representative outlet monitoring including events"
      temporal_coverage: "Same representative reporting period across all rows"
      site_scope: "Declared line, grade and treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling coverage; assay method/LOQ; supplier records; missing data and uncertainty disclosure"
    - protocol_id: cp_utility
      process_id: "bcs_manufacture"
      flow_role: "electricity; steam_import; condensate_return"
      record_type: "foreground_record"
      raw_fields: "Stage power kWh; steam kg; supply pressure/temperature/quality; condensate kg and enthalpy; losses; background definition"
      collection_method: "Submeter stages; match background supply geography/period and exact reference property; retain steam inlet/outlet enthalpy balance and physical condensate return"
      unit: "kWh; MJ; kg"
      frequency: "Each batch/stage; representative outlet monitoring including events"
      temporal_coverage: "Same representative reporting period across all rows"
      site_scope: "Declared line, grade and treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling coverage; assay method/LOQ; supplier records; missing data and uncertainty disclosure"
    - protocol_id: cp_pack
      process_id: "bcs_manufacture"
      flow_role: "paper_sack; pe_liner; paper_first_received; pe_first_received; paper_returned; pe_returned; paper_outward; pe_outward; paper_pack_waste; pe_pack_waste"
      record_type: "foreground_record"
      raw_fields: "Component mass; polymer grade; tare; item/lot and original outward IDs; B/E/T/O/W movements; opening/closing stock; ownership and supplier burden inclusion; services and inherited burden; number used; scrap; net contents"
      collection_method: "Weigh actual paper and PE components separately; reconcile used components and product shipped; add other real components independently"
      unit: "kg"
      frequency: "Each batch/stage; representative outlet monitoring including events"
      temporal_coverage: "Same representative reporting period across all rows"
      site_scope: "Declared line, grade and treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling coverage; assay method/LOQ; supplier records; missing data and uncertainty disclosure"
    - protocol_id: cp_waste
      process_id: "bcs_manufacture"
      flow_role: "solid waste and aqueous_purge"
      record_type: "foreground_record"
      raw_fields: "Outlet; wet mass; dry solids; density; Cr valences; salts; destination; receiver acceptance; stock/recovery"
      collection_method: "Weigh or meter each actual segregated outlet and validate composition; retain transfer manifests; subtract internal recovery from external loss ledger"
      unit: "kg"
      frequency: "Each batch/stage; representative outlet monitoring including events"
      temporal_coverage: "Same representative reporting period across all rows"
      site_scope: "Declared line, grade and treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling coverage; assay method/LOQ; supplier records; missing data and uncertainty disclosure"
    - protocol_id: cp_air
      process_id: "bcs_manufacture"
      flow_role: "air emissions"
      record_type: "foreground_record"
      raw_fields: "Outlet/fugitive point; flow; sampling interval; dry/wet basis; T/P/O2; species concentration; Cr valences; dust size; LOQ; control bypass"
      collection_method: "Sample actual final exhaust and fugitives; integrate simultaneous concentration and corrected gas flow over normal/start-stop/bypass operation; reconcile captured dust and recycle separately"
      unit: "kg"
      frequency: "Each batch/stage; representative outlet monitoring including events"
      temporal_coverage: "Same representative reporting period across all rows"
      site_scope: "Declared line, grade and treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling coverage; assay method/LOQ; supplier records; missing data and uncertainty disclosure"
    - protocol_id: cp_effluent
      process_id: "bcs_manufacture"
      flow_role: "freshwater emissions"
      record_type: "foreground_record"
      raw_fields: "Direct outlet; receiving water; flow; density; dissolved/suspended solids; sodium; sulfate; total Cr and valences; method; LOQ"
      collection_method: "Sample actual post-treatment direct outlet with matched time-weighted/flow-weighted chemistry and water flow; external transfer outlets excluded; preserve valence stability"
      unit: "kg; m3"
      frequency: "Each batch/stage; representative outlet monitoring including events"
      temporal_coverage: "Same representative reporting period across all rows"
      site_scope: "Declared line, grade and treatment outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sampling coverage; assay method/LOQ; supplier records; missing data and uncertainty disclosure"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "P is unique positive actual accepted net factory-gate delivery kg of the same supplied powder, not newly released R. Retain the complete matched site/grade/route/state period, including failed/zero-output, startup/shutdown, idle, cleaning, rejects, rework and treatment. Keep physical production/WIP separate from FG: F0 + R + U = D_gross + F1 + M, with actual received returns U, pre-return-netting outward product D_gross excluding tare and independently recorded losses/rework removals M. Derive net accepted P from unique deliveries and original return corrections; never add U and subtract an already return-netted P in that physical balance. Each undivided burden numerator A_i keeps its exchange unit: the once-reconciled current-activity contribution plus separately evidenced opening WIP/FG carry and traced net return carry after original reversal, minus evidenced closing WIP/FG carry and justified other-cofunction assignments. Burden vectors are not physical kg subtracted from energy. Retain full unallocated physical outputs; burden allocation never scales their masses. normalize_exchange alone reports A_i / P after conversion and carry attribution; physical outlet rows retain their full matched physical numerator / P. The reference is1kg; card/protocol/other per-kg result labels mean this same reporting operation, never further division. For P<=0 or unresolved cohort/carry attribution preserve all raw burdens/stocks and report no unit result; do not discard failed campaigns or borrow another cohort denominator. For each material/feed row affected by raw stocks, record whether current activity is gross external receipts at the chosen raw-material gate or an already stock-reconciled issued/charged/consumed quantity under its linked protocol. Reconcile receipts, external returns and opening/closing raw stock exactly once. If current activity is already that reconciled issue/consumption, do not again add opening raw-stock carry or subtract closing raw-stock carry; attach the original source/lot burden represented by that issue once rather than creating another purchase. If a row instead starts from gross receipts, use its raw-stock reconciliation once to derive the issued contribution, and do not also treat the resulting issues as another addition. Apply the separately evidenced WIP/FG cohort bridge at the unchanged declared product gate only after this raw-material step. Complete carried vectors contain each original exchange in its own unit and lot/stage provenance, not physical stock kg or an impact score. Physical return receipt U and its inherited stock vector are distinct from the signed correction of the original delivery and original burden vector: identify both events and apply each once; do not reverse again if already included in the reported net correction. Unresolved activity basis, stock/transfer linkage or original return vector makes the normalized result incomplete; retain raw records without a finite unit result. Other metered inputs and physical outputs retain their own verified raw measurement basis; do not invent raw-stock adjustments for them."
      inputs:
        - P
        - cp_product
        - "applicable row protocol"
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - eu-sic-2007
        - jrc-ilcd-lci-2010
    - id: chemistry_ledger
      applies_to: "chemical feeds and product"
      rule: "Use measured supplied mass and component mass fractions to reconcile Cr, sulfur, sodium and water; correct hydrated salt, Cr2O3 assay equivalent and carrier water on explicitly declared molecular bases. The ideal reaction is a reconciliation aid, never a recipe/yield/emission default."
      inputs:
        - cp_material
        - cp_product
        - cp_waste
        - cp_air
        - cp_effluent
      output: "Unallocated species and water ledger"
      source_ids:
        - atsdr-chromium-2012
        - cn1099727a-route
    - id: emission_load
      applies_to: "air and freshwater emission rows"
      rule: "Integrate matched concentration times corrected gas/liquid flow over measured time; convert stated compound or elemental bases and units before division by P. Non-detects retain interval and LOQ; not zero."
      inputs:
        - cp_air
        - cp_effluent
        - cp_product
      output: "Species load per 1 kg reference flow"
      source_ids:
        - eu-cww-2016
    - id: water_component
      applies_to: "water_discharge"
      rule: "Determine H2O mass from gross effluent mass less measured dissolved and suspended non-water components; retain the component in kg; volume conversion is auxiliary or requires an explicitly compatible provider convention. Retain gross solution volume as auxiliary monitoring data, not a second water exchange."
      inputs:
        - cp_effluent
      output: "Water component per 1 kg reference flow"
      source_ids:
        - eu-cww-2016
    - id: electricity_units
      applies_to: "electricity"
      rule: "Convert metered kWh to MJ using 3.6 MJ/kWh only if the verified provider reference requires MJ; otherwise retain kWh. Confirm the native property and provider quantity independently; no fuel heating-value assumption follows."
      inputs:
        - cp_utility
      output: "kWh, or compatible converted MJ, per 1 kg reference flow"
      source_ids:
        - eu-sic-2007
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all flows"
      requirement: "Confirm physical name, CAS, route, state, compartment, reference property/unit and provider quantity independently; wrong route/species cannot be cured with qualifiers."
      evidence: "Native identity chain and primary supplier records"
    - id: quality_period
      applies_to: "whole unit"
      requirement: "Same-period reporting includes representative campaigns, cleaning, start/stop, bypass and rejects; identify missing outlets before complete data."
      evidence: "cp_product; cp_air; cp_effluent"
    - id: quality_numerics
      applies_to: "all amounts"
      requirement: "No imported default yield, purity, recipe, energy, abatement efficiency or range from historical/single-producer cases. Derive actual values from protocols and retain uncertainty."
      evidence: "atsdr-chromium-2012; cn1099727a-route; chrompik-bcs-tds"
validation_rules:
  - rule_id: validate_reference
    applies_to: "bcs_manufacture"
    rule: "Require exactly one final product output linked by reference_product and a verified compatible product/property/unit-group identity chain; unresolved identity remains incomplete and cannot imply coverage."
    source_ids:
      - chrompik-bcs-tds
  - rule_id: validate_balance
    applies_to: "bcs_manufacture"
    rule: "Reconcile physical product, retained salts/water, inventory change, internal recycling, external wastes and species losses before assigning burdens. Do not sum PM2.5, PM10 and total dust as disjoint fractions, or chemical constituent and carrier mass as separate physical losses."
    source_ids:
      - eu-cww-2016
  - rule_id: validate_transfer
    applies_to: "bcs_manufacture"
    rule: "Check every outlet destination: direct air/freshwater emissions are elementary; external-treatment liquid/sludge transfers are waste. Preserve residual Cr(VI), LOQ and actual receiving water; no generic correction flow or unrelated wastewater substitute."
    source_ids:
      - eu-sic-2007
      - eu-cww-2016
  - rule_id: validate_dataset
    applies_to: "bcs_manufacture"
    rule: "Require matched bilingual amounts/denominators, finite unit conversion, actual route, supplier quantity compatibility and complete atomic inventory including conditional extensions before dataset completeness. Authored or validated data never substitutes for independent methodology review."
    source_ids:
      - eu-sic-2007
published_dataset_profile:
  dataset_role: "Prospective foreground manufacturing gate profile; candidate requires independent review and dataset-specific completion"
  downstream_use: "Upstream input to actual chrome tanning only after identity and data completion"
  allowed_use: "The defined purchased-SO2 reduction and powder delivery route, grade and period"
  excluded_use: "Liquid product; pure compound mass; tannin/syntan/enzyme; tannery recovery; organic reduction; on-site sulfur burner; compliance approval"
  required_metadata: "Reference qualifiers; physical route; chemical composition; primary metering; upstream providers; allocation driver; treatment destinations"
  required_quality_disclosure: "Unresolved flow identities; data/sampling coverage; component balance; provider compatibility; uncertainty; non-detect limits; added atomic rows"
  update_trigger: "Change of supplier grade, CAS/mixture, state, reductant, heat route, abatement, coproduct separation or classification decision"
