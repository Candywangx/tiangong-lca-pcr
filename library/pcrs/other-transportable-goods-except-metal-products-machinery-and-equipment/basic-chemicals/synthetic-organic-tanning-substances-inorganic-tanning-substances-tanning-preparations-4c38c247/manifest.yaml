  analytical_applicability: "Basicity uses a complete historical basic-chromium-sulfate analytical procedure or validated equivalent with corrected matched titres. Actual lab method/version and powder sampling must be qualified. Aqueous 7199, elemental 6010D and combustion-source 0061 do not establish powder/dryer valence applicability; independently matrix-validated valence analysis is required, never inferred from total chromium. No universal analytical acceptance limit or manufacturing recipe imposed."
