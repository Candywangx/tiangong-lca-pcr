  - rule_id: v_completeness
    applies_to: "data package"
    rule: "Every active exchange needs measurement evidence, identity decision, provider/receiver and unit basis. Any omitted actual exchange, blank required identity, missing sample, unsupported conversion or unknown quantity remains explicit and prevents a complete-data claim. Method authorship is not scientific approval or dataset verification."
