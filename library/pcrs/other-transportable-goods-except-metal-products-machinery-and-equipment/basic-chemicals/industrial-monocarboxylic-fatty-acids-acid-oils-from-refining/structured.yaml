allocation_rules:
  - rule_id: al_physical
    applies_to: "all physical flows"
    rule: "Keep actual oil, water, acid, sweet-water, heavy-fraction, waste and emission quantities in an unallocated physical mass/water/carbon balance. Never multiply the physical co-product output by an allocation share. Record stock changes and internal transfers explicitly."
    source_ids:
      - jrc-cww-bref-2016
      - ifc-oleochemicals-2007
  - rule_id: al_hierarchy
    applies_to: "shared burdens"
    rule: "First subdivide direct product-specific measurements or consider justified system expansion for an expanded system. For the product dataset, shared burdens require a demonstrated causal physical relationship; equal wet-mass shares are not automatic, especially for dilute sweet water. If this cannot be established, justify a period- and gate-matched economic relationship. No universal allocation fraction or glycerine yield."
    source_ids:
      - eu-pef-multifunctionality-2021
  - rule_id: al_receivers
    applies_to: "sweetwater; sweetwater_waste; heavy_coproduct; heavy_waste; light_coproduct; light_ends"
    rule: "Use actual specifications, contracts and legal receiver status to establish each co-product; zero price alone does not prove waste. Preserve each actual product, waste and internal-return portion of sweet water, heads and heavies; each portion is assigned once and the portions reconcile to their physical stream total. Glycerine refining belongs downstream. Waste treatment remains linked to its generating route. No assumed sale, suppressed co-product or artificial zero credit."
    source_ids:
      - ifc-oleochemicals-2007
      - eu-pef-multifunctionality-2021
  - rule_id: al_ledger
    applies_to: "reported product burdens"
    rule: "Maintain a separate environmental-burden ledger with direct assignments, shared pools, allocation factors, sum checks and sensitivity. Internal recovery alone earns no avoided-product credit. Product-normalized burden quantities are not substituted for the physical balances."
    source_ids:
      - eu-pef-multifunctionality-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "fatty_acid_unit"
      flow_role: "reference product"
      record_type: "measured_record"
      raw_fields: "SKU; lot; net mass; tare; composition; water; free acids; glycerides; unsaponifiables; carbon source; method/uncertainty; acceptance; opening/closing accepted stock; dispatch; rejects; returns"
      collection_method: "Calibrated net bulk weighing or calibrated tank/mass-meter balance with measured density/temperature. Derive accepted production for the same activity period by reconciling dispatch, accepted stock changes, returns and rejects; do not divide current production inputs by unmatched shipments from earlier stocks. Use representative lot sampling and validated analytical methods; preserve chromatographic species/mass basis and test-method limits."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
    - protocol_id: cp_material
      process_id: "fatty_acid_unit"
      flow_role: "feed, solution, carbon and sweet water"
      record_type: "measured_record"
      raw_fields: "flow identity; lot; wet mass; concentration; water; contaminants; supplier; carbon origin; receiver; opening/closing stocks"
      collection_method: "Calibrated receiving/dispatch measurements and representative paired samples; reconcile invoices, inventories and composition assays. Keep sweet-water wet output and glycerol component separately."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
    - protocol_id: cp_water
      process_id: "fatty_acid_unit"
      flow_role: "water inputs"
      record_type: "measured_record"
      raw_fields: "meter; inlet/outlet; net makeup; internal circulation/recovery; water quality; density; temperature; solution-carried water"
      collection_method: "Meter distinct supply headers; document density for mass conversion; separate net purchases, internal circulation, steam-derived condensate and chemical carrier water."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
    - protocol_id: cp_energy
      process_id: "fatty_acid_unit"
      flow_role: "electricity"
      record_type: "measured_record"
      raw_fields: "stage meters; kWh; voltage; supplier; country/region; grid mix; losses; operating hours; shared allocation"
      collection_method: "Calibrated electricity meters; retain stage readings and measured shared-service assignment; verify CN geography and 1–35 kV consumption supply compatibility or select another verified physical identity."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
    - protocol_id: cp_steam
      process_id: "fatty_acid_unit"
      flow_role: "individual steam headers"
      record_type: "measured_record"
      raw_fields: "delivered mass; pressure absolute/gauge; temperature; dryness; inlet/return enthalpy; condensate mass; makeup; losses; supplier MJ convention"
      collection_method: "Meter each header and condensate return over matched intervals; use traceable steam-property calculations from actual state; verify supplier steam quantity/heat boundary before background conversion. Unknown pressure, state or MJ convention blocks that link."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
    - protocol_id: cp_residual
      process_id: "fatty_acid_unit"
      flow_role: "heavy fraction, light ends and distinct residuals"
      record_type: "measured_record"
      raw_fields: "origin; wet mass; dry solids; water; acid/glyceride fraction; carbon; contaminants; receiver; product/waste status; internal returns"
      collection_method: "Weigh and sample each physically distinct stream, including primary and biological sludge separately; reconcile dispatch manifests and internal return meters; document legal receiver and specification."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
    - protocol_id: cp_effluent
      process_id: "fatty_acid_unit"
      flow_role: "wastewater and direct water outputs"
      record_type: "measured_record"
      raw_fields: "origin; mixing point; sewer/direct receiver; flow time series; density; pH; COD; BOD; TOC; TSS; oil/grease; specific substances; laboratory method; detection limit"
      collection_method: "Matched outfall flow and representative samples, including non-routine events; monitor influent and treated outlet separately. Keep sewer-transfer composition in its waste record; direct releases occur only at the environmental outfall."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
    - protocol_id: cp_air
      process_id: "fatty_acid_unit"
      flow_role: "vent species and evaporation"
      record_type: "measured_record"
      raw_fields: "source; post-control gas volume; temperature/pressure; wet/dry basis; chemical species/CAS; concentration; capture; operating time; detection limits; water loss"
      collection_method: "Representative species-specific post-control vent measurements and documented fugitive sampling/mass balances. No total VOC-to-species factor; test actual fatty acids, aldehydes and other degradation products."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
    - protocol_id: cp_carbon
      process_id: "fatty_acid_unit"
      flow_role: "carbon partition and treatment gases"
      record_type: "measured_record"
      raw_fields: "biogenic/fossil input carbon; product/residual carbon; gas species; generated/captured/destroyed/leaked CH4; CO2; stock changes; carbon-content analysis"
      collection_method: "Separate biological/fossil carbon balances using supplier origin and measured material/gas carbon; on-site treatment gas monitoring and captured-gas meters. Do not infer CO2 from COD or unknown acid chain length."
      unit: "row-declared units"
      frequency: "each lot and continuous/representative operating intervals"
      temporal_coverage: "one declared representative period including cleaning/upsets"
      site_scope: "all included stages and gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sample representativeness; lab method; stock/receiver reconciliation; uncertainty"
  calculation_rules:
    - id: calc_normalized
      applies_to: "all inventory rows"
      rule: "N = sum(Q) / B; Q is a measured exchange total and B is accepted net bulk mixed-acid kg from cp_release for the same period; retain Q and B and separate internal amounts."
      inputs:
        - Q
        - B
        - cp_release
      output: "exchange quantity per 1 kg reference flow"
      source_ids:
        - jrc-cww-bref-2016
    - id: calc_component
      applies_to: "cleaning_naoh; sweetwater; mixed_acid"
      rule: "component_mass = wet_mass × measured_mass_fraction; water_mass = wet_mass × measured_water_fraction. Components explain the parent wet flow and must not be added to it as extra exchanges."
      inputs:
        - wet_mass
        - measured_mass_fraction
        - measured_water_fraction
      output: "component and water ledgers"
      source_ids:
        - ifc-oleochemicals-2007
    - id: calc_load
      applies_to: "cod_fresh; tss_fresh"
      rule: "load_kg = sum(C_mg_per_L × V_m3 × 0.001) for matched sampling intervals; retain pollutant analytical quantity definition. COD is kg oxygen demand, TSS is kg dry suspended material."
      inputs:
        - concentration
        - outfall_volume
        - cp_effluent
      output: "measured direct outfall loads"
      source_ids:
        - jrc-cww-bref-2016
    - id: calc_steam
      applies_to: "splitting_steam; distillation_steam; returned_condensate"
      rule: "Keep steam mass as the exchange basis. For an indirect heater, matched steady operation with all incoming steam recovered as the measured return and negligible documented work, storage and other heat losses permits heat_MJ = sum(m × (h_in − h_return)) / 1000. Use one enthalpy datum and actual absolute pressure, temperature and phase/dryness with traceable IAPWS-IF97 calculations (h in kJ/kg, m in kg) within their validity regions. Otherwise require a complete boundary-specific energy balance including flash, leakage, blowdown, stocks and losses once; this simplified formula cannot be applied to direct injection or unmatched return mass. Reconcile the provider reference definition before an energy link; never equate GCV with delivered heat."
      inputs:
        - matched_mass
        - actual_states
        - return_mass
        - actual_enthalpies
        - boundary_evidence
        - cp_steam
      output: "conditional heat supplement; physical steam and condensate remain separate"
      source_ids:
        - iapws-if97-2012
        - ifc-oleochemicals-2007
    - id: calc_burden
      applies_to: "allocated environmental burdens"
      rule: "For product j, burden_j = directly_attributed_j + share_j × shared_pool; shares sum to one for each pool. If justified economic allocation is selected, share_j = measured_output_j × gate_price_j / sum(measured_output_k × gate_price_k), using priced wet or active quantity exactly as contracted. Keep physical outputs unscaled."
      inputs:
        - shared_pool
        - direct_attribution
        - measured_outputs
        - prices
        - justified_relationship
      output: "separate allocated burden ledger and sensitivity"
      source_ids:
        - eu-pef-multifunctionality-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flows"
      requirement: "Physical identity, property/unit and actual quantity/provider compatibility are separate checks; disclose every blank UUID and open provider, no substitute pure-acid or route-incompatible dataset."
      evidence: "primary specifications, raw assays and provider reference definitions"
    - id: dq_balances
      applies_to: "fatty_acid_unit"
      requirement: "Close stage and aggregated wet-mass, water, biological-carbon and fossil-carbon balances including stock changes, all actual co-products, residues and direct releases; report residual imbalance with measurement uncertainty, no invented tolerance. Retain species and C/H/O accounts separately using actual acid/glyceride profiles and analytically supported molecular bases. Hydrolysis consumes water into products; no universal acid molecular weight, glycerol yield or measured-species inventory follows from a generic fatty-acid identity."
      evidence: "flow diagram, paired transfer totals, measured profiles, carbon and composition assays"
    - id: dq_operations
      applies_to: "maintenance, stocks and bulk containers"
      requirement: "Cover non-routine cleaning and maintenance, each actual lubricant, replacement/filter material, loading loss and container service at the declared gate. Reconcile reuse cycles, container stocks, delivered contents and tare; add each actual exchange with its own identity and measured amount before claiming full coverage. Excluding retail packaging is not evidence that bulk handling has no burden."
      evidence: "maintenance orders, chemical invoices/assays, container ownership/reuse/cleaning records and stock ledger"
    - id: dq_coverage
      applies_to: "all active rows"
      requirement: "Cover a representative complete period; report gaps and detection limits. Missing data is unknown, not zero. Any additional actual species/auxiliary requires an atomic row before a complete dataset claim."
      evidence: "stream register and monitoring plan"
    - id: dq_sources
      applies_to: "source applicability"
      requirement: "Use IFC sector guidance and CWW chemical-sector monitoring for their declared scope. Historical EPA and producer/technology pages support distinctions only; their numerical cases, limits, recipes and source pressures are not defaults."
      evidence: "source sections and actual local applicability assessment"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and inputs"
    rule: "Require refined coconut oil, hydrolysis/distillation and measured mixed free-acid product, with no excluded route. A broad industrial hydrolysis identity requires the actual nonhydrogenated coconut profile and whole commercial-mass basis; native hydrogenation, different feedstock, pure-acid, ester or conflicting grade restrictions cannot be waived with qualifiers. Broad classifications are not proof of composition."
    source_ids:
      - ifc-oleochemicals-2007
      - klk-palmera-fatty-acids
  - rule_id: v_reference
    applies_to: "mixed_acid"
    rule: "Exactly one completed reference product output: 1 kg net mixture; all inventory denominators and collection aggregations match it in both languages. Stage handovers are internal."
    source_ids:
      - jrc-cww-bref-2016
  - rule_id: v_supply
    applies_to: "steam; electricity; solutions"
    rule: "Require actual voltage, steam pressure/state/return and supply reference basis, and solution wet/active/water reconciliation. Unresolved provider quantity conventions prevent claiming a complete background link."
    source_ids:
      - ifc-oleochemicals-2007
  - rule_id: v_physical
    applies_to: "mass and allocation ledgers"
    rule: "Require mass/water/carbon balance closure evidence with every actual output; internal endpoints equal; heavy-product/waste dispositions nonoverlapping. Allocation may change burden shares, never erase physical co-products or emissions."
    source_ids:
      - jrc-cww-bref-2016
      - eu-pef-multifunctionality-2021
  - rule_id: v_emissions
    applies_to: "all environmental releases"
    rule: "Separate true substance, carbon origin, current/delayed timing and receiving medium. COD, TOC and species inventories must not produce duplicated impact; no generic VOC substitution. PM size classes, if present, must be nonoverlapping; captured dust/condensate is waste or recovery, not another emitted mass. Retain actual biogenic CO2 in LCI."
