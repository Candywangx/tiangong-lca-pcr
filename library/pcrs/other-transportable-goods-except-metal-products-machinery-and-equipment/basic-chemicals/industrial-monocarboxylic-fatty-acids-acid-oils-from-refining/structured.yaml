published_dataset_profile:
  dataset_role: "foreground production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared catalyst-free nonhydrogenated refined-coconut-oil splitting/distillation bulk grade, after actual data and applicability checks"
  excluded_use: "Whole-CPC average; acidulation oil; pure single acid; esters; other feedstocks; hydrogenation; unmeasured supplier/default recipes"
  required_metadata: "SKU/composition/state; net gate mass; supplier/reference conventions; carbon origin; process map; period/site; receivers; allocation; evidence and uncertainty"
  required_quality_disclosure: "UUID gaps, provider/measurement gaps, carbon and water balances, omitted scope, monitoring/detection coverage and independent-review status"
  update_trigger: "Feedstock, supplier, composition, hydrogenation/esterification, distillation cut, utilities, receivers, measurement basis or allocation changes"
data_sources:
  - id: "ifc-oleochemicals-2007"
    type: "official_guidance"
    reference: "[World Bank Group/IFC, EHS Guidelines for Oleochemicals Manufacturing, 30 April 2007](https://www.ifc.org/content/dam/ifc/doc/2000/2007-oleochemicals-manufacturing-ehs-guidelines-en.pdf)"
    used_for: "pp. 1–5, 10, 13–14: sector applicability, water/air/residues, representative monitoring, splitting/distillation and sweet-water separation. Source numeric examples and Table 3 are not inventory defaults."
  - id: "jrc-cww-bref-2016"
    type: "official_guidance"
    reference: "[JRC, CWW BREF, 2016, JRC103096](https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf)"
    used_for: "Scope p. xxiii (PDF29), BAT2–4 pp.543–544 (PDF573–574): chemical-sector stream register, process sheets and matched flow/load monitoring. No BAT-AEL-to-inventory conversion or legal-conformance claim."
  - id: "klk-palmera-fatty-acids"
    type: "handbook"
    reference: "[KLK OLEO, PALMERA Fatty Acids, publisher product page](https://www.klkoleo.com/brand/palmera-fatty-acids/)"
    used_for: "Description and Distilled Fatty Acids → Coconut Fatty Acid family: actual marketed vegetable mixed-acid route distinct from fractionated acid grades. Product family only; no universal composition, grade purity or plant recipe."
  - id: "desmet-oleochemicals"
    type: "handbook"
    reference: "[Desmet, Oleochemicals, publisher technology page](https://www.desmet.com/en/biofuel/oleochemicals)"
    used_for: "How does it work; Raw materials: triglyceride/water splitting, two main products, distillation and coconut-oil applicability. Equipment/route evidence only, not performance or recipe defaults."
  - id: "epa-soap-fat-splitting-1974"
    type: "official_guidance"
    reference: "[US EPA, Soap and Detergent Manufacturing Development Document, EPA-440/1-74-018-a, April 1974](https://www.epa.gov/sites/default/files/2016-08/documents/soap-detergent-mfg_dd_1974.pdf)"
    used_for: "pp.24–26 (PDF39–41): historical fat splitting, glycerine separation, subsequent acid distillation and soap neutralisation distinctions. Historical catalytic examples, pressures, yields and soap recipes do not apply as defaults to the catalyst-free route."
  - id: "eu-pef-multifunctionality-2021"
    type: "official_guidance"
    reference: "[European Commission, Recommendation (EU) 2021/2279, Annex I §4.5, pp.63–64](https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf)"
    used_for: "Subdivision/system expansion, causal physical relationship and justified alternative/economic allocation hierarchy only; no assertion that this PCR or future dataset is fully PEF compliant."
  - id: "epo-soapstock-separation-1985"
    type: "literature"
    reference: "[EP0160326A1, Process for obtaining fatty acid product from glyceride oil soapstock, 6 November 1985](https://patents.google.com/patent/EP0160326A1/en)"
    used_for: "Background of the invention: alkaline refining soapstock, mineral-acid acidulation and separate aqueous/emulsified/fatty-acid layers; exclusion boundary only. Patent process disclosure is not proof of a universal deployed route or recipe; its numeric composition and examples are not defaults."
  - id: "iapws-if97-2012"
    type: "official_guidance"
    reference: "[IAPWS R7-97(2012), Revised Release on the Industrial Formulation 1997 for Water and Steam](https://iapws.org/technical-guidance/release/IF97-Rev)"
    used_for: "§§1–4 and region property equations: traceable actual-state steam/water enthalpy, phase and validity checks. Thermophysical properties do not establish process duty, provider reference quantity or a universal steam amount."
  - id: "desmet-distillation"
    type: "handbook"
    reference: "[Desmet, Distillation & Fractionation, publisher technology page](https://www.desmet.com/en/biofuel/oleochemicals/distillation-fractionation)"
    used_for: "Tailor-made reboiler, steam/condenser and heat-recovery options establish why actual heat-delivery configuration must be verified. No plant recipe, performance default or universal steam-heated reboiler is established."
