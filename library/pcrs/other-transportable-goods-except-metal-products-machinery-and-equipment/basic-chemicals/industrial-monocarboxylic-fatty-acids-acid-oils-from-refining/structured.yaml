product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.basic-chemicals.industrial-monocarboxylic-fatty-acids-acid-oils-from-refining"
  classification_refs: "CPC 3.0 34120; proposed narrower scope, accepted mapping is a separate decision"
  covered_products: "Nonhydrogenated distilled mixed free fatty acids made by catalyst-free hydrolysis of refined coconut oil"
  excluded_products: "Acid oils, deodorizer distillates, other feedstock origins, esters/salts, hydrogenated products, purified single acids and formulated solutions"
  representative_product: "One measured coconut-derived distilled-acid SKU in the producer distilled coconut product family; no universal SKU specification"
  production_route: "Refined oil receipt → hydrolysis → sweet-water separation → flash/dehydration → vacuum distillation → storage → bulk loading"
  market_state: "Net bulk mixture at factory gate with declared water and residual components; no added carrier solution or package in reference mass"
functional_unit:
  what: "Industrial supply of the specified coconut-derived free-fatty-acid mixture"
  how_much: "1 kg net accepted bulk mixture"
  how_well: "Measured lot specification: full acid composition, water, free-acid fraction, residual glycerides/unsaponifiables, acid/saponification/iodine values where specified, contaminants and acceptance"
  how_long_or_cycle: "One release at the gate; declared representative production period, no lifetime service assertion"
  reference_flow_link: "mixed_acid"
system_boundary:
  rules:
    - rule_id: sb_route
      applies_to: "fatty_acid_unit"
      rule: "Include receipt, storage, splitting, sweet-water separation, flash/dehydration, vacuum distillation, recovery, loading, cleaning and actual on-site environmental controls. Preserve stage-specific measurements within the aggregated unit."
      source_ids:
        - ifc-oleochemicals-2007
        - desmet-oleochemicals
    - rule_id: sb_upstream
      applies_to: "external inputs"
      rule: "Attach origin-, state-, technology-, geography- and quantity-compatible upstream datasets to oil, water, electricity, chemicals and steam. This gate is not a zero-burden raw-material boundary."
      source_ids:
        - eu-pef-multifunctionality-2021
    - rule_id: sb_internal
      applies_to: "internal transfers"
      rule: "Retain a physical flow diagram and matched amounts at both ends of every internal transfer, including recirculated acid residue, recovered fat, water and condensate. Do not turn internal returns into external products, wastes or avoided-product credits."
      source_ids:
        - ifc-oleochemicals-2007
        - jrc-cww-bref-2016
    - rule_id: sb_environment
      applies_to: "outfalls and vents"
      rule: "Use a stream register to distinguish sewer exports, direct freshwater releases, captured organics, post-control vents and sludge. Monitor normal operation, startups, shutdowns, cleaning and upset conditions; do not inventory upstream supply emissions again."
      source_ids:
        - jrc-cww-bref-2016
        - ifc-oleochemicals-2007
    - rule_id: sb_refinement
      applies_to: "oil receipt and site operations"
      rule: "Prior coconut-oil refining belongs in the refined-oil upstream dataset and is not repeated inside this gate. Include any actual additional filtration, pretreatment, maintenance, cleaning or loading operation, with each real auxiliary, replacement material, lubricant, container service and resulting waste separately recorded. Bulk delivery excludes container tare from reference mass, not actual container manufacture, reuse, cleaning or disposal burdens within the declared boundary."
      source_ids:
        - ifc-oleochemicals-2007
        - jrc-cww-bref-2016
boundary_abstraction:
  declared_starting_condition: "Received refined coconut triglyceride oil and externally supplied utilities at the selected manufacturing gate"
  starting_condition_role: "Measured foreground receiving condition, not virgin raw-material creation or burden-free residue recovery"
  product_classification_scope: "CPC 3.0 34120 distilled coconut hydrolysis-acid subset only"
  recursive_input_rule: "Internal same-category returns stay internal and balanced. External recovered fatty-acid input requires explicit identity, origin and upstream burden; it is outside this base coconut-oil recipe until reviewed."
  upstream_dataset_requirement: "Verified physical identity plus matching supplier reference quantity, grade, moisture/composition, technology, location, period and boundary; an unresolved provider is an open boundary, not zero"
  disclosure: "Stage flow diagram, physical mass/water/biological-carbon/fossil-carbon balances, net exchange register, all receivers, separate allocated-burden ledger and unmeasured scope"
