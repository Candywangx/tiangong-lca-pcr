measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reference amount is 1 kg accepted net as-delivered bulk mixture. Preserve water and residuals; exclude transport-container tare."
  - id: mixture_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Row-declared property"
      uuid: ""
    required_unit: "Row-declared unit"
    rule: "Normalize every exchange to per 1 kg reference flow using the same period and accepted net mixed-acid denominator B. Separately preserve physical totals, including all co-product outputs."
  - id: solution_basis
    applies_to: "cleaning_naoh; sweetwater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record wet supplied mass and measured solute/water fractions. Active-mass calculations are supplementary; they do not replace wet mass or add a second water input."
  - id: steam_basis
    applies_to: "splitting_steam; distillation_steam"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain actual steam mass and thermodynamic state; net delivered heat requires supply/return enthalpies and a matching provider definition. MJ or GCV alone is insufficient."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "The recorded property is Net calorific value; meter electricity in kWh and convert by 1 kWh = 3.6 MJ, preserving voltage and supply boundary. It is electrical energy, not a fuel heating-value estimate."
  - id: composition_basis
    applies_to: "mixed_acid; oil; sweetwater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure species distribution, glycerides, unsaponifiables and water on stated analytical bases. Acid value is not free-acid mass without measured mixture composition/molar-mass basis; GC ester derivatization does not change product into esters. No assumed chain length."
  - id: carrier_basis
    applies_to: "water_fresh; water_vapour; offsite_effluent"
    required_property_ref:
      name: "Row-declared property"
      uuid: ""
    required_unit: "Row-declared unit"
    rule: "Keep whole effluent and wet-gas carrier totals in the physical ledger. Water-species quantities and pollutant/species loads are separate analytical accounts, not quantities to add again to the whole stream. Outfall volume does not by itself establish water-species volume."
