review_metadata:
  scientific_review: "pending"
  semantic_boundary_decision: "Promote retained unpublished scaffold for one bounded agricultural-use subset: solid cattle excreta with declared existing straw bedding, scrape collection, solid storage and bulk dispatch. No active composting, digestion, forced drying, pellets or fuel preparation. Existing husbandry/manure output interfaces and application machinery do not supply this collection/storage product methodology; adjacent mineral-fertilizer intake methods do not overlap. Suggested narrower mapping requires controller acceptance; no shared mapping changed."
  unresolved_flow_rows:
    - row_id: "leachate"
      reason: "No exact captured manure-leachate waste identity confirmed; unrelated fresh manure/sludge rejected."
    - row_id: "screenings"
      reason: "No exact plastic foreign-matter screenings contaminated with cattle manure identity confirmed."
    - row_id: "rejected_manure"
      reason: "Exact rejected aged/contaminated solid manure disposal identity and receiver remain site-specific; raw fresh cattle-manure waste does not prove rejected-state equivalence."
  background_compatibility:
    - "Reference farmyard manure is a broad composition-unspecified mixture: actual cattle/straw/urine and supplied wet-mass composition are required; no fixed nutrient content inferred."
    - "Input cattle manure is Waste flow, technology-specific at farm; document residue/product status and inherited upstream burdens rather than automatic cut-off."
    - "Electricity UUID is CN <1 kV consumption mix to user, grid-average supply, Net calorific value/MJ. Different supplies require separately verified identities."
    - "Tap water selected is geography-unspecified mass-reference production/supply; rejected HK volume-reference candidate is not adopted."
    - "Diesel grade/formulation/refinery/provider/geography unspecified. Background supplier and quantity conversion require actual records."
    - "NOx native mass property does not establish NO2 equivalent. Speciation or monitoring/LCI/LCIA quantity compatibility is required before numerical use."
    - "Unresolved auxiliary identities and future site measurements do not imply absent exchanges; completed datasets require actual identity/provider and all applicable atomic additions."
