allocation_rules:
  - rule_id: allocation_single
    applies_to: "manure_unit"
    rule: "The scoped unit has one intended saleable output. Assign its attributable preparation burdens to accepted manure; rejected manure and leachate remain waste treatment obligations, not presumed co-products. Investigate metered subdivision or system expansion first, and document why a higher-priority option cannot represent the actual functions before selecting allocation. If a separate saleable product or treatment service exists, document functionality and a justified physical causal relationship; if unavailable justify economic allocation with period-matched prices and sensitivity. Do not use a universal nutrient/energy share. At the incoming gate record actual residual/co-product/waste status, farm-gate price or economic-value evidence, the applicable upstream allocation method and inherited burdens. A no-upstream-burden result requires that method and evidence; it never removes receiving, collection or storage burdens within manure_unit. The cited cattle-farm example supplies conditional context, not a universal dairy allocation default."
    source_ids:
      - ec-pef-allocation-2021
  - rule_id: allocation_ledgers
    applies_to: "all inventory rows"
    rule: "Maintain complete unallocated physical mass/water/C/N/P/K and separate allocated burden accounts. Never multiply physical co-product quantities by burden shares. Document the incoming manure burden interface and excluded/retained upstream management so no stage is lost or counted twice."
    source_ids:
      - ipcc-manure-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "manure_unit"
      flow_role: "Incoming/output mass and product composition"
      record_type: "weighing_and_assay"
      raw_fields: "lot; cattle source; bedding and urine; gross tare net wet mass; TS VS C N TAN P K assays and bases; accept/reject status; dispatch/return IDs; opening/closing WIP and stock mass and burdens; receiver"
      collection_method: "Calibrated weighbridge or scales at intake/dispatch and separate waste weighing. Representative multi-location/depth composite samples across first/middle/last discharge portions; preserve actual moisture and sample storage. Laboratory TS, VS, C/N, TAN, P/K with method and uncertainty; sampling adapted from PM1558 to supply gate. Do not substitute top-only samples or annual book composition."
      unit: "kg; kg/kg; %"
      frequency: "Each load; each homogeneous lot and material/storage change"
      temporal_coverage: "Complete matched period and route/state/product pool including starts stops failed and zero-output runs, returns and rework, opening/closing WIP and stocks with carried burdens"
      site_scope: "Same cattle-manure collection/storage facility and declared gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, weighing tickets, lot sampling plan, laboratory report and traceable stock/burden ledger"
    - protocol_id: cp_utilities
      process_id: "manure_unit"
      flow_role: "Electricity diesel and cleaning tap water"
      record_type: "meter_and_fuel_records"
      raw_fields: "start/end meter; voltage geography provider; kWh; diesel purchases tank stocks transfers kg or litres temperature density fossil fraction C S LHV; engine power duty hours; cleaning-water volume density; shared-load drivers"
      collection_method: "Use submeter differences and reconciled fuel-tank records; measure density if converting volume. Allocate shared machinery by metered actual work; include idling and failed runs. Record equipment emission control and avoid upstream/directed combustion overlap."
      unit: "MJ; kWh; kg; litre; m3; h"
      frequency: "Each shift and campaign; opening/closing stock readings"
      temporal_coverage: "Complete matched period and route/state/product pool including starts stops failed and zero-output runs, returns and rework, opening/closing WIP and stocks with carried burdens"
      site_scope: "Metered equipment serving manure_unit only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, invoices, fuel assay, work logs and supplier dataset basis"
    - protocol_id: cp_emissions
      process_id: "manure_unit"
      flow_role: "Actual emitted species and particle fractions"
      record_type: "measurement_or_documented_model"
      raw_fields: "storage age temperature cover TS VS N TAN; emission interval; species concentration; background; integrated exhaust or rate; temperature pressure dry/wet basis; engine model year tier load aftertreatment C S fuel; PM cut size; detection limits"
      collection_method: "Measure representative storage and handling fluxes using calibrated capture/chamber/dispersion methods with site boundary, background and temporal coverage. Engine emissions use actual duty-compatible testing or an explicitly justified model. IPCC methods require actual species/system/climate/VS/N applicability and review of factors; use of a model is disclosed, not represented as measurement. No residual-based gas species or generic positive amounts."
      unit: "kg species; kg N; mg/m3; m3; m3/h; h"
      frequency: "Representative operating/storage intervals and seasons, including abnormal operation"
      temporal_coverage: "Complete matched period and route/state/product pool including starts stops failed and zero-output runs, returns and rework, opening/closing WIP and stocks with carried burdens"
      site_scope: "Outdoor emissions across manure_unit boundary; separate manure and engine origins"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling design, calibration, model version/factors/applicability, species bases and uncertainty"
    - protocol_id: cp_balance
      process_id: "manure_unit"
      flow_role: "Physical mass water and elements"
      record_type: "balance_with_independent_measurements"
      raw_fields: "all stream wet/dry masses and C H O N P K; oxygen uptake; rainfall exposed area; vapour; organic decomposition; independently measured reaction water; start/end stocks; inlet/outlet or upwind/downwind humidity; matched integrated dry-air/gas amount or flow-rate/time with T/P and wet/dry basis; condensation/deposition; independently measured evaporation method and coverage"
      collection_method: "Reconcile measured streams, oxygen consumption, weather and independently justified biochemical/combustion stoichiometry with explicit uncertainty. Distinguish free-water evaporation, water formed/consumed, dry-organic-matter transformation and dissolved solids. COD/VS are not species-resolved mass closure. Unexplained residuals remain findings. Determine net vapour from matched incoming and outgoing H2O carried by measured integrated dry-air/gas quantities and humidity, or a validated independent evaporation/condensation measurement covering the same open or enclosed boundary. Retain gross atmospheric H2O inflow/outflow in the physical water ledger and only their net transfer in the vapour exchange; do not assume ambient inflow is zero or infer unknown vapour and reaction water from one residual. Rain is a separate actual water input, not ambient humidity."
      unit: "kg; kg element; kg water; mm; m2; kg dry air; kg water/kg dry air; m3; m3/h; h; degC; Pa"
      frequency: "Each pool period with matched stock and emission coverage"
      temporal_coverage: "Complete matched period and route/state/product pool including starts stops failed and zero-output runs, returns and rework, opening/closing WIP and stocks with carried burdens"
      site_scope: "Physical manure_unit before burden allocation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Independent assays/gas and water evidence; residual and uncertainty report"
  calculation_rules:
    - id: pool_account
      applies_to: "all inventory rows"
      rule: "Reconcile raw period inputs and burdens plus opening WIP/stock carried burdens minus closing WIP/stock carried burdens and separately identified outward obligations. Return/rework transfers retain their physical identity and burden history; internal cycles cancel, not count as new output. Q is unique accepted supplied wet mass with returned/cancelled deliveries removed; all failed/zero-output loads of the same pool remain. Each resulting attributable exchange total is divided by Q once only when Q > 0."
      inputs:
        - cp_mass
        - cp_utilities
        - cp_emissions
        - cp_balance
      output: "Inventory per 1 kg accepted wet output"
      source_ids: []
    - id: species_conversion
      applies_to: "ammonia, n2o, no, nox"
      rule: "Convert explicitly documented element-as-N masses to molecular NH3 by 17/14, N2O by 44/28 or NO by 30/14 only for the matching species. NOx aggregate conversion requires separately documented quantity definition compatible with the inventory and impact method; N2O is excluded. Never convert total N loss to NH3 alone."
      inputs:
        - cp_emissions
      output: "Raw period molecular-species masses before pool accounting"
      source_ids:
        - ipcc-manure-2019
    - id: element_balance
      applies_to: "manure_unit"
      rule: "Opening element stock + measured element inputs = closing element stock + accepted manure + waste/reject transfers + measured species releases on the same raw-period element basis. Keep carbon, nitrogen, phosphorus and potassium separate. Include oxygen from air and net biological transformations in total mass/water accounting with independently supported reaction-water terms; do not create a balancing output or omit biogenic CO2."
      inputs:
        - cp_mass
        - cp_balance
        - cp_emissions
      output: "Unallocated physical balance and disclosed residuals"
      source_ids:
        - ipcc-manure-2019
  data_quality_requirements:
    - id: quality_complete
      applies_to: "all inventory rows"
      requirement: "Require complete matched production pool and positive accepted denominator, native identity/state/medium and exact property/unit compatibility. Include actual maintenance inputs/wastes, other contaminants and any uncontrolled runoff/leaching as additional specific rows when material; unknowns are not zero."
      evidence: "cp_mass; cp_utilities; cp_emissions; cp_balance"
    - id: quality_sampling
      applies_to: "finished_manure"
      requirement: "Dispatch sampling must represent supplied composition after storage losses; no assumed fixed feed/bedding formula or nutrients. Declare sampling adaptation, laboratory method, detection limits, uncertainty, actual sanitation/legal acceptance and intended recipient; this PCR does not certify fertiliser safety."
      evidence: "epa-manure-sampling; cp_mass"
    - id: quality_background
      applies_to: "all inventory rows"
      requirement: "Link actual provider datasets with geography, time, route, composition and wet/dry/energy reference basis. Flow UUID verification does not validate provider quantities or upstream process completeness. Disclose gaps without substituting an incompatible supplier."
      evidence: "cp_utilities; cp_mass"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_manure"
    rule: "Exactly one accepted product reference row, 1 kg net wet mass, same denominator throughout both languages and protocols. Zero total accepted supply forbids normalization; unresolved final reference identity or unsupported measurement relationship blocks dataset use."
    source_ids: []
  - rule_id: validation_balance
    applies_to: "manure_unit"
    rule: "Check complete raw-period mass/water/C/N/P/K balances before allocation, matched inventory burdens, unique acceptance, no duplicate internal flows, no invented reaction water or gas residual. Quantify residuals against declared measurement uncertainty and investigate unexplained differences."
    source_ids:
      - ipcc-manure-2019
  - rule_id: validation_emissions
    applies_to: "all inventory rows"
    rule: "Confirm each actual species/CAS, biogenic or fossil origin, outdoor air or resource medium and property-unit chain. Require molecular/element and NOx/NMVOC basis compatibility. PM fractions must be mutually exclusive; no source/destination or dust-collection double counting. Methods/factors are not measured results, and absent identity is not evidence of absent emission."
    source_ids:
      - ipcc-manure-2019
      - epa-nonroad-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply-stage manure material input for agriculture, after applicability and provider review"
  allowed_use: "Declared bulk solid cattle agricultural route and its measured wet-mass basis"
  excluded_use: "Generic all-excreta or nutrient-equivalent fertiliser; fuel, compost, digestate or field application datasets; safety or methodology approval claim"
  required_metadata: "Reference qualifiers; gates; geographic/time coverage; raw pool and stock/burden ledger; assays; all actual identities/providers; allocation and methods"
  required_quality_disclosure: "Sampling representativeness, uncertainty, missing auxiliary identities, provider compatibility and omitted stages; no claim of generic emission ranges"
  update_trigger: "Animal source/bedding/route/moisture/storage change, new contamination or receiver, altered supply/geography, new measurement or methodological evidence"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 structure, 30 June 2025, row 34654; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Classification scope only; not proof that every excreta route is one process or that an accepted mapping exists."
  - id: "epa-manure-practices"
    type: "official_guidance"
    reference: "US EPA AgSTAR, Practices to Reduce Methane Emissions from Livestock Manure Management, Solid Storage and comparison with Composting/Manure Drying/Solid Separation; snapshot 2026-10-16; https://www.epa.gov/agstar/practices-reduce-methane-emissions-livestock-manure-management"
    used_for: "Route separation, handling/storage and runoff/emission screening. Qualitative only; no national illustrative reduction percentages, default residence or performance transferred."
  - id: "epa-manure-sampling"
    type: "extension_guidance"
    reference: "US EPA NPDES Permit Writers Manual for CAFOs Appendix O, PM1558 revised November 2003, PDF pp117–120 / printed O-115–O-118; https://www.epa.gov/sites/default/files/2015-08/documents/cafo_permitmanual_appendixo.pdf"
    used_for: "Representative solid-manure and composite sampling; adapted from application/storage sampling to earlier supply gate. Not current regulation, generic formula, sanitation proof or a fixed number of samples for all sites."
  - id: "ipcc-manure-2019"
    type: "method_factor"
    reference: "IPCC 2019 Refinement Volume 4 Chapter 10, §§10.4,10.5,10.5.4 and equations10.23,10.25; printed/PDF pp50,64,74–77,94–95; https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf"
    used_for: "CH4/VS and nitrogen species pathways, molecular conversion and management/soil/fuel boundary. National inventory method requires site/animal/system/climate evidence; no default factors or recipes imported. Keep measured biogenic CO2 in LCI; prevent double characterization of indirect N2O."
  - id: "epa-nonroad-2021"
    type: "official_guidance"
    reference: "US EPA EPA-420-R-21-021 September2021, Exhaust and Crankcase Emission Factors for Nonroad Compression-Ignition Engines in MOVES3.0.2, Introduction and §§3,9,11; publisher HTML/TXT https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P1013KWQ.TXT"
    used_for: "Diesel equipment pollutant coverage and activity/technology dependence; publisher text rendering, not a locally acquired PDF. No US fleet factor, PM split, sulfur content, engine tier or HC-to-NMVOC conversion adopted as generic. Actual engine/fuel/duty/species evidence remains mandatory."
  - id: "ec-pef-allocation-2021"
    type: "official_guidance"
    reference: "European Commission, C(2021)9332 final, Annex I, Product Environmental Footprint method, 16 December 2021, §§4.5 and4.5.1.2, PDF pp63–64; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "General multifunctionality hierarchy and conditional cattle-farm manure status/value and upstream burden context. Actual upstream method, price/status and gate coverage must be established; do not transplant dairy/IDF defaults, circular-footprint formulas or an automatic residual zero-burden rule. Collection/storage obligations at this unit remain included."
