measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use 1 kg net as-supplied accepted wet manure; calibrated gross minus tare excludes transport equipment and packaging. Do not replace wet product mass with dry matter or nutrient mass."
  - id: wet_dry
    applies_to: "raw_manure, finished_manure, leachate, rejected_manure"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure whole wet stream once; dry matter = wet mass × total-solids mass fraction; water = wet mass − dry matter. Volatile solids are measured on stated dry basis and are not identical to elemental carbon or COD. Straw and urine constituents already in raw manure are subledgers, not additional purchases."
  - id: raw_conversions
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass or Net calorific value"
      uuid: ""
    required_unit: "kg or MJ"
    rule: "Convert raw units before normalization: kg from measured integrated liquid volume × matching density, and kg species from concentration × integrated exhaust/liquid volume. Integrate a flow rate over time only if the original is a rate. Align gas temperature pressure moisture and concentration basis; no second time factor for cumulative volume."
  - id: nutrient_basis
    applies_to: "raw_manure, finished_manure, leachate"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "TAN means total ammoniacal nitrogen, NH3-N plus NH4-N, on an explicitly stated wet or dry assay basis; TAN is not emitted molecular ammonia. Report P and K as elements; oxide-basis laboratory results require an explicit documented stoichiometric conversion. Do not infer plant availability from total nutrient content."
