review_metadata:
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  semantic_boundary_review:
    outcome: "promote_legacy_narrower"
    explanation: "Actual CPC source defines a broad synthetic/reconstructed unworked gemstone leaf. Producer originals support Verneuil colorless single-crystal sapphire from alumina, gaseous H2/O2, with actual stabilization and gem-grade acceptance. This PCR excludes reconstructed mixtures, colored/doped crystals, spinel, diamond, alternative crystal-growth routes, technical remelt feed as reference, natural stones and worked jewels. Existing material natural-stone, alumina and watch-jewel methods do not cover this transformation; artificial-corundum 37960 is still a scaffold in controller queue. Suggest narrower 34560 only, subject to independent mapping/identity review."
  unresolved:
    inventory_flow_uuids:
      - row_id: "hydrogen_supply"
        reason_code: "no_compatible_exact_identity"
        explanation: "Meter supplied H2 separately from O2; measure purity, delivered mass and stocks. Cylinder tare or gas volume conversion must be traceable; no hydrogenated oil, raw gas or peroxide substitutes."
      - row_id: "alumina_pedestal"
        reason_code: "no_compatible_exact_identity"
        explanation: "Conditional on actual alumina-ceramic pedestal use; identify ceramic composition, grade, replacement mass and service life. Ceramic pieces are not purchased alumina powder or a crucible. Add other actual furnace refractory compositions separately."
      - row_id: "corrugated_box"
        reason_code: "no_compatible_exact_identity"
        explanation: "Conditional on this actual packaging; weigh boxes and obtain measured supplier fibre/adhesive/coating composition. Do not adopt the searched box record with a fixed 16.6% virgin/83.4% recycled mix unless actual SKU evidence agrees; folding paper boxes are a different construction."
      - row_id: "remelt_coproduct"
        reason_code: "no_compatible_exact_identity"
        explanation: "Conditional on actual sale for another growth route. Record its actual physical mass, grade, sale contract and receiver; keep separate from gemstone-grade reference output. No distinct exact flow identity was verified; do not conceal it or assign the gemstone UUID solely to satisfy a checker. Resolve before completing a joint-output dataset."
      - row_id: "rejected_crystal"
        reason_code: "no_compatible_exact_identity"
        explanation: "Only material actually discarded across the boundary; record composition, measured dry mass and receiving route. Internal rework is not a waste export; saleable remelt feed belongs in remelt_coproduct, not both rows."
      - row_id: "spent_alumina_pedestal"
        reason_code: "no_compatible_exact_identity"
        explanation: "Conditional on replacement; preserve actual ceramic composition, mass, contamination and receiver. Reject the searched refractory waste flow restricted to aluminium production."
      - row_id: "cooling_bleed"
        reason_code: "no_compatible_exact_identity"
        explanation: "Conditional on an actual exported bleed; collect mass, volume, temperature, suspended solids and each actual additive/pollutant. The candidate is restricted to secondary/tertiary treatment and cannot identify untreated bleed. No direct receiving-water emission is represented by this row."
      - row_id: "waste_pe_film"
        reason_code: "no_compatible_exact_identity"
        explanation: "Conditional on generated film waste; measure mass, polymer and contamination and record receiver. Do not use a flow already cleaned at a recycling plant for this untreated plant-gate waste."
    provider_and_quantity_compatibility:
      - row_id: "oxygen_supply"
        explanation: "Industrial separated gaseous O2 physical identity verified, Volume/m3 normal-condition reference does not state complete normal T/P/wet/dry/compressibility conventions. 1.429 kg/Nm3 is recorded source metadata, not an operating density or PCR default. Actual supply/background basis must be obtained before dataset link."
      - row_id: "pe_film"
        explanation: "Physical name/CAS/comment match PE film but source CPC 29220 points to luggage; supplier and source classification clarification remains due."
      - row_id: "electricity"
        explanation: "Selected identity only CN 1–35 kV grid-average consumer supply; actual site geography, voltage and provider require verification or a replacement verified identity."
    range_evidence_needs:
      - range_id: "verneuil-site-consumption-release-ranges"
        row_ids:
          - "alumina_feed"
          - "hydrogen_supply"
          - "oxygen_supply"
          - "electricity"
          - "cooling_makeup"
          - "seed_crystal"
          - "alumina_pedestal"
          - "pe_film"
          - "corrugated_box"
          - "remelt_coproduct"
          - "rejected_crystal"
          - "captured_alumina_dust"
          - "spent_alumina_pedestal"
          - "cooling_bleed"
          - "waste_pe_film"
          - "waste_cardboard"
          - "pm25_air"
          - "pm25_10_air"
          - "pmover10_air"
          - "water_vapour_air"
          - "hydrogen_air"
          - "nitric_oxide_air"
          - "nitrogen_dioxide_air"
        explanation: "No compatible multi-source empirical numeric ranges were verified for this declared colorless gem-grade, purchased-gas route. Actual site/grade, purity, supply basis, yield, energy, consumables, waste and emissions are future collection requirements; no generic recipe, single-producer observation, expert packaging ratio or database secondary coefficient is adopted as a default. Target-check missing-range warnings are preserved."
  independent_review_required: true
  shared_integration_note: "Author does not edit aliases, accepted mapping, material index, coverage or catalog. Controller must independently accept boundary and rebuild/check derivatives; no publication or scientific review asserted."
  source_applicability_note: "SIC BREF provides generic physical handling/integration/measurement/waste accounting only; sapphire is not an illustrative family and physical crystallization does not establish chemical-processing regulatory applicability. EPA201A is historical method scope/limitations evidence, not current legal compliance; its wet/droplet/condensable restrictions remain explicit. GIA and producer originals support route/market-state distinctions, not current site quantities."
