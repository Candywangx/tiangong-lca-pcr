allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "foreground_burden_allocation"
    rule: "Declare a product-specific attributional inventory goal. First directly attribute specific operations by measured stage/campaign or virtual subdivision, and assess whether system expansion is applicable. Only where these options are inappropriate or infeasible and allocation is needed, apply demonstrable determining physical causality separately to inseparable shared burdens; allocate residual burdens lacking such a relationship by verified same-period market values at the common-process exit in their actual delivered condition. Remove subsequent processing/packing/transport differences and disclose prices, physical mass, allocation scope and sensitivity. No default share or universal consequential-study allocation claim."
    source_ids:
      - jrc-ilcd-allocation-2010
      - stettler-verneuil
  - rule_id: physical_before_burden
    applies_to: "physical_balance"
    rule: "Preserve actual physical outputs, wastes, releases and internal links without multiplying by burden allocation shares. Keep a separate allocated environmental-burden ledger; apply chosen shares only to joint burdens, summing to one and avoiding repeat allocation."
    source_ids:
      - jrc-sic-bref-2007
  - rule_id: waste_recovery
    applies_to: "waste_classification"
    rule: "Record disposal, recovery or actual sale status and receiver; saleable remelt material is neither a negative emission nor a free by-product. No default substitution credit; a substitution scenario separately declares displaced product, quality and burden boundary."
    source_ids:
      - jrc-ilcd-allocation-2010
      - stettler-verneuil
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "verneuil_production"
      flow_role: "accepted crystals; coproduct"
      record_type: "weighing_acceptance"
      raw_fields: "SKU; lot; net dry mass; Al2O3 assay; color; defects; gem-grade acceptance; remelt sale/fate; opening/closing stocks"
      collection_method: "Calibrated weighing and traceable lot acceptance, distinct gem-grade/remelt/waste records"
      unit: "kg"
      frequency: "every lot"
      temporal_coverage: "same complete representative production period including normal operation, start/stop and rework"
      site_scope: "declared foreground site/equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, coverage, balance reconciliation and uncertainty records"
    - protocol_id: cp_materials
      process_id: "verneuil_production"
      flow_role: "each solid input"
      record_type: "purchase_weighing"
      raw_fields: "row_id; SKU; supplier; composition; purity; moisture; delivered/consumed mass; opening/closing stocks; pedestal replacement/life; packaging type"
      collection_method: "Separate calibrated weighing and supplier certificates for each material; reconcile purchases, stocks and consumption"
      unit: "kg"
      frequency: "every lot/change"
      temporal_coverage: "same complete representative production period including normal operation, start/stop and rework"
      site_scope: "declared foreground site/equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, coverage, balance reconciliation and uncertainty records"
    - protocol_id: cp_gases
      process_id: "verneuil_production"
      flow_role: "each purchased gas"
      record_type: "gas_metering"
      raw_fields: "species; purity; mass/volume; temperature; absolute pressure; wet/dry basis; compressibility; supply route; meter; stocks; purge/leak; provider reference conditions"
      collection_method: "Calibrated independent gas meters or traceable cylinder tare/net records; reconcile measured conversion with provider"
      unit: "kg H2; m3 O2"
      frequency: "continuous and every delivery"
      temporal_coverage: "same complete representative production period including normal operation, start/stop and rework"
      site_scope: "declared foreground site/equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, coverage, balance reconciliation and uncertainty records"
    - protocol_id: cp_power
      process_id: "verneuil_production"
      flow_role: "stage electricity"
      record_type: "metering"
      raw_fields: "stage; kWh; supply country; voltage; provider; stabilization program; run/idle hours; shared loads"
      collection_method: "Stage submetering and reconciled invoices; convert kWh to MJ with 3.6; attribute measured shared load explicitly"
      unit: "MJ"
      frequency: "continuous"
      temporal_coverage: "same complete representative production period including normal operation, start/stop and rework"
      site_scope: "declared foreground site/equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, coverage, balance reconciliation and uncertainty records"
    - protocol_id: cp_water
      process_id: "verneuil_production"
      flow_role: "makeup and bleed"
      record_type: "metering_sampling"
      raw_fields: "row_id; supplied/bleed volume; temperature; density; composition; treatment receiver; circulation; evaporation; condensate; additive identities"
      collection_method: "Meter actual boundary entry/exit and measure density for mass reference; assay actual contamination; internal circulation separately"
      unit: "kg"
      frequency: "continuous and every bleed"
      temporal_coverage: "same complete representative production period including normal operation, start/stop and rework"
      site_scope: "declared foreground site/equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, coverage, balance reconciliation and uncertainty records"
    - protocol_id: cp_waste
      process_id: "verneuil_production"
      flow_role: "each solid waste"
      record_type: "weighing_transfer"
      raw_fields: "row_id; composition; contamination; dry/wet mass; moisture; retained/returned dust; waste/sale status; receiver"
      collection_method: "Separate calibrated weighing and waste transfer records by actual stream; reconcile internal recovery without double export"
      unit: "kg"
      frequency: "every transfer"
      temporal_coverage: "same complete representative production period including normal operation, start/stop and rework"
      site_scope: "declared foreground site/equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, coverage, balance reconciliation and uncertainty records"
    - protocol_id: cp_air
      process_id: "verneuil_production"
      flow_role: "each outdoor air species/fraction"
      record_type: "monitoring_balance"
      raw_fields: "source; species/CAS; fraction; sample time; concentration; gas volume; T/P/moisture; operating time; detection limit; capture/condensate; uncertainty; nitrogen ingress; species definition"
      collection_method: "Measure released mass for each source/species/fraction or use an explicitly reconciled measured physical balance; apply stack method only within its limitations and assess fugitives separately"
      unit: "kg"
      frequency: "representative campaigns and continuous records where available"
      temporal_coverage: "same complete representative production period including normal operation, start/stop and rework"
      site_scope: "declared foreground site/equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, assays, coverage, balance reconciliation and uncertainty records"
  calculation_rules:
    - id: normalize_inventory
      applies_to: "all inventory rows"
      rule: "Keep measured physical totals for every row first; normalized amount = attributable same-period exchange total for that row / Q; Q is accepted gem-grade dry net crystal mass in kg from cp_product. Reference output = 1 kg. Joint burdens are attributed with the declared allocation before normalization, without altering physical balances. Keep raw unallocated totals for one matched route, supplied state, gem-grade acceptance specification and representative period, including attributable failed and zero-accepted-output batches as well as start/stop, idle and rework operations. Reconcile opening/closing work in progress and finished stocks with their accumulated inventory burdens, using documented carry-in/carry-out attribution without lost or duplicated burdens. Q counts final accepted crystal production once, reconciled with dispatch and stocks; returned, reworked and reaccepted material is not counted again, and final rejects are excluded. Apply normalize_inventory to each reconciled raw period total once; row, protocol and calculation descriptions denote that same division. A complete period with Q <= 0 cannot produce a per-kg dataset; justify a wider representative period or report an incomplete result."
      inputs:
        - cp_product
        - cp_materials
        - cp_gases
        - cp_power
        - cp_water
        - cp_waste
        - cp_air
      output: "exchange per 1 kg reference flow"
      source_ids:
        - jrc-sic-bref-2007
    - id: particulate_partition
      applies_to: "pm25_air; pm25_10_air; pmover10_air"
      rule: "Partition exclusive fractions only from same-basis contemporaneous measurements; PM2.5–10 = compatible PM10 minus PM2.5; >10 requires compatible total particulate and sizing evidence. Assess condensable contribution separately where relevant without duplication; filterable-only results do not establish complete total release."
      inputs:
        - cp_air
      output: "exclusive particle masses and completeness statement"
      source_ids:
        - epa-201a-2020
  data_quality_requirements:
    - id: identity_quality
      applies_to: "reference product; every input"
      requirement: "Obtain actual SKU, lot, provider originals and assays confirming unworked gem-grade colorless undoped single crystal and route; classification labels or UUIDs alone do not establish site identity."
      evidence: "stettler-verneuil; un-cpc-3-2025; cp_product"
    - id: balances
      applies_to: "all inventory rows"
      requirement: "Reconcile same-period alumina/crystal physical masses and separate H/O/water balance across feed, seed, product, off-grade material, wastes, dust and stocks. Retain original residuals, explanations and measurement uncertainty; no default yield or forced closure."
      evidence: "jrc-sic-bref-2007; cp_materials; cp_gases; cp_water; cp_air"
    - id: monitoring_applicability
      applies_to: "cp_air"
      requirement: "EPA201A applies only to compatible stationary-source filterable fractions, preserving original droplet/temperature limits; wet oxyhydrogen exhaust needs a validated alternative if unsuitable. Fugitives, condensable contribution and gas species each require valid methods. Unknown species/fractions, aggregate-only NOx or incompatible gas basis cannot be reported complete."
      evidence: "epa-201a-2020; cp_air; cp_gases"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Require exactly one accepted gem-grade reference output consistent with 1 kg dry net mass, the same Q and every bilingual denominator. Qualify the broad unworked identity to the declared subset; exclude remelt feed, packaging, water and other gems."
    source_ids:
      - un-cpc-3-2025
      - stettler-verneuil
  - rule_id: validate_exchanges
    applies_to: "all inventory rows"
    rule: "Each row is one atomic flow; check adopted names, CAS where present, route, reference property, unit and compartment, with separate quantity/provider compatibility. Blank UUIDs are unresolved; no complete dataset claim until each applicable row is resolved."
    source_ids:
      - jrc-sic-bref-2007
  - rule_id: validate_ledger
    applies_to: "physical_and_burden_ledgers"
    rule: "Separate physical and allocated-burden ledgers; equal physical amounts on both internal-link ends; three exclusive PM fractions, no captured/emitted dust double count and no NO/NO2 plus NOx aggregate duplication. Do not omit start/stop, leaks, stocks or reuse without evidence."
    source_ids:
      - jrc-sic-bref-2007
      - epa-201a-2020
  - rule_id: validate_route
    applies_to: "method_applicability"
    rule: "Intentional doping, on-site gas production, another growth route or worked gems are outside method scope. Stabilization energy source, purification, cooling and each actual material need compatible inventory; report gaps rather than zero or a neighboring product."
    source_ids:
      - stettler-verneuil
      - orbray-sapphire-production
      - sebal-sapphire
published_dataset_profile:
  dataset_role: "product-specific attributional foreground production inventory"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Production input for unworked colorless flame-fusion sapphire satisfying every qualifier"
  excluded_use: "Whole-leaf 34560 coverage; other crystals/reconstructed products; technical remelt feed as reference; substitutes for alumina refining or worked jewelry; completeness claims with identity/basis gaps"
  required_metadata: "all reference qualifiers; actual site/time/provider; upstream boundary; SKU/quality acceptance; stabilization/cooling/abatement; measurement/balances; co-products/allocation"
  required_quality_disclosure: "per-row identity and quantity/background compatibility; actual applicability/absence evidence; scope/gaps; uncertainty and physical balance residuals; PM/gas-species completeness; no numeric defaults"
  update_trigger: "change in provider, SKU, recipe/doping, growth/stabilization route, gas basis, yield, abatement, background or classification acceptance"
