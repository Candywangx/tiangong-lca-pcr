  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  scope_decision: "One surface-disinfectant purchased-reagent physical blending route; peroxide, propylene glycol, orthophosphoric acid, SLES, maleic acid, benzotriazole and separate treated water. Net bulk liquid supply, not active kg or a disinfection service. No upstream peroxide synthesis, agricultural fungicide, handrub, chlorine or peracetic-acid route."
  source_limitations: "CN113491268A primary patent establishes example ingredients/sequence only: reagent assay, SLES ethoxylation, grade, commercial operating data and factory burdens are unspecified. No recipe quantity, concentration, speed, time, temperature, shelf-life, efficacy, toxicological safety or zero-emission default is adopted. NHC2020 is historical product-temperature qualification guidance, not present regulatory approval. Solvay FN1167/01 is incoming aqueous-peroxide guidance within its stated scope/interferences; final organic-matrix selective assay must be independently validated. Actual future formulation/assay/label/period/provider records are required before use of any concrete dataset."
  reference_identity: "93328a0a-7cd1-4f63-831b-e9ac5398506e: state100 exact native query/direct read. Disinfectant / 消毒剂, production mix at plant, Product/Mass; inert-surface meaning fits selected product. No specified CAS, geography, grade, concentration or recipe. Generic 99.999% efficacy comment is explicitly not accepted as product performance; identity does not establish background provider. Exact Mass/property-unit chain verified externally."
  conditional_water_identity: "5b3acbab-2518-4406-8736-d21f222d757a: state100 exact query/direct, Deionised water / 去离子水, CAS7732-18-5, plant production mix, pure substance, ion exchange or reverse osmosis; geography unspecified. Comment also mentions distillation/consumption but narrow name governs. Patent does not specify water grade; supplier grade and method must be verified, not assumed."
  unbound_auxiliary_identities:
    - "peroxide_solution: complete supplied aqueous reagent basis not established by pure-active identity; generic c566e036 native CAS7722-84-1 is chemically consistent but its organic CPC34140 classification is erroneous and whole-solution mass basis unspecified. No chemical identity contradiction is invented. A fixed-strength candidate is conditional on actual assay, not a recipe default."
    - "propylene_glycol: name and CAS searches returned other species/mixtures, none verified for this ingredient; retain specific unbound row."
    - "phosphoric_solution: queried candidates fix wet/thermal route, nutrient or 85% supply basis; actual reagent assay/route unspecified, so no unsupported binding."
    - "sles: query candidate sodium dodecyl sulfate lacks ethoxy groups; not interchangeable."
    - "maleic_acid: maleic anhydride candidate is a different input and would introduce water/chemistry; not substituted."
    - "benzotriazole: candidate4b88c02e has CN supply, consumption mix to consumer, water-soluble benzotriazole and no CAS/comment or assay. Source role in copper passivation is not a contrary chemical route; supplied form/carrier and actual CN delivery compatibility remain unproved. Deferred, not declared chemically incompatible."
    - "electricity: original fetch failure retained, later query succeeded; candidate grid voltage/geography not selected without actual supply evidence. Failure is not no-match."
    - "Waste and elementary emissions: individual concrete rows retained; receiving treatment, phase, composition and native identities require actual site evidence before dataset use."
  methodological_review: "Author methodology only; scientific review remains root pending. No accepted mapping edge, publication or product regulatory/efficacy approval. Future site/SKU/provider counts are not method evidence. Missing concrete data prevent use of that dataset; ordinary auxiliary UUID and foreground measurement obligations do not alone invalidate this authored conditional route."
