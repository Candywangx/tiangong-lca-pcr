allocation_rules:
  - rule_id: allocation_direct
    applies_to: "blend"
    rule: "Attribute directly to the actual formulation campaign first. Allocate shared utilities, cleaning, laboratory and storage by measured causal service drivers with reconciliation; no mass-only split across different recipes without justification. No saleable co-product is presumed; actual recoveries and co-products require independent output identity and allocation evidence."
    source_ids: []
  - rule_id: allocation_returns
    applies_to: "all inventory rows"
    rule: "Retain failed/zero-output burdens, returns and rework; transfer WIP material and its embodied burdens together across period boundaries. An internal rework stream carries its original burden and is not a new purchase or a second accepted product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "blend"
      flow_role: "Ingredient charges and water"
      record_type: "batch_material_records"
      raw_fields: "owner: production material custodian; period; batch; SKU; supplier; route; location; lot; grade; chemical/isomer identity; supplied form; gross and tare; net mass; assay basis; uncertainty; component water and salts; independent density and temperature if volume measured; opening and closing stocks; return and rework IDs"
      collection_method: "Reconcile calibrated scales, goods receipt, actual charge tickets and supplier certificates; qualify a matrix-selective assay with laboratory owner; independently verify each solution procurement basis. Keep receipts, uncharged feed stores, actual production charges and unchanged returns as reconciled separate views of procurement, not additive purchases. Whole supplied liquids and constituent subledgers remain distinct. Retain the compatible attributable raw numerator without division, with complete-period and stock/WIP burden links. After verified raw-unit conversion and attribution, period_normalization alone divides by positive Q. Card amount formulas and aggregation_rule describe that same final reporting operation, not another division. Q=0 retains the complete raw and burden pool without a normalized result."
      unit: "kg; mass fraction; L and kg/L only with measured conditions"
      frequency: "Each delivery and charge"
      temporal_coverage: "Full actual reporting period and linked opening/closing lots"
      site_scope: "Same site line product route and supplied state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; original charge tickets; certificates; full composition and assay validation"
    - protocol_id: cp_utilities
      process_id: "blend"
      flow_role: "Electricity and shared services"
      record_type: "meter_and_service_records"
      raw_fields: "owner: utilities engineer; meter IDs; readings; interval; batch equipment; voltage; geography; ventilation and laboratory service records; zero-output runs; allocation drivers; opening and closing WIP burden"
      collection_method: "Use calibrated submeter differences or a reconciled engineering allocation supported by actual service records, including start-up, failed batches, cleaning and holding. Preserve every attributable raw energy interval, including failed/zero-output, cleaning, holding and carried service shares. Retain the compatible attributable raw numerator without division, with complete-period and stock/WIP burden links. After verified raw-unit conversion and attribution, period_normalization alone divides by positive Q. Card amount formulas and aggregation_rule describe that same final reporting operation, not another division. Q=0 retains the complete raw and burden pool without a normalized result."
      unit: "kWh"
      frequency: "Each interval and batch campaign"
      temporal_coverage: "Same complete actual period with carried-burden links"
      site_scope: "Same site line product route and supplied state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration and shared-service allocation reconciliation"
    - protocol_id: cp_release
      process_id: "blend"
      flow_role: "Accepted supplied liquid and WIP"
      record_type: "mass_and_release_records"
      raw_fields: "owner: independent quality release officer; complete period; formulation revision; actual assays; selective assay recovery and interference; qualified label/state; batch net mass; release decision; temperature; unique lot IDs; opening/closing WIP mass and carried inventory burdens; internal transfers; failed lots; rework; returns; newly accepted supplied mass"
      collection_method: "Weigh net liquid excluding tank/container mass, reconcile tank withdrawals with batch release; independently assay supplied formulation and maintain traceable WIP genealogy. Product-specific low-temperature/efficacy qualification is separate from LCI mass acceptance. Define Q as net newly completed product counted once at its declared final production-acceptance gate, with unique lot/event history. Dispatch or withdrawal of old finished stock, reshipment, internal rework and reinspection/reacceptance of an already counted lot do not create another Q. Reconcile released finished-stock and actual handover records in a separate warehouse ledger; retain the attributable holding/transfer burdens for the matching accepted cohort. Closing unreleased stock/WIP and its carried burdens remain separate from accepted output. Retain the compatible attributable raw numerator without division, with complete-period and stock/WIP burden links. After verified raw-unit conversion and attribution, period_normalization alone divides by positive Q. Card amount formulas and aggregation_rule describe that same final reporting operation, not another division. Q=0 retains the complete raw and burden pool without a normalized result."
      unit: "kg"
      frequency: "Each batch release and period cut-off"
      temporal_coverage: "Full actual matched period, with earlier and later lot genealogy"
      site_scope: "Same site line product route and supplied state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Release certificates; scale/tank calibration; genealogy; independent label tests and selective assays"
    - protocol_id: cp_losses
      process_id: "blend"
      flow_role: "Waste and individual emissions"
      record_type: "weighing_speciation_and_monitoring"
      raw_fields: "owner: environmental metrology officer; full period; waste net mass; composition; treatment recipient; retained samples; rejected mass; gas or liquid integrated volume; conditions; flow rate and duration only for rate records; measured species concentration; detection limit; captured and released fractions; water and elemental inventories; opening/closing retention"
      collection_method: "Reconcile disposal weighing, calibrated monitoring and independent species measurements; investigate missing mass. Validate reaction identity before assigning reaction water or oxygen; never fit unknown outlets with closure residuals. Preserve complete unnormalized waste and separately measured species totals and their stock/cohort attribution. Already integrated volumes receive no extra time multiplier. Retain the compatible attributable raw numerator without division, with complete-period and stock/WIP burden links. After verified raw-unit conversion and attribution, period_normalization alone divides by positive Q. Card amount formulas and aggregation_rule describe that same final reporting operation, not another division. Q=0 retains the complete raw and burden pool without a normalized result."
      unit: "kg; m3 with declared conditions; kg/m3; h only for rate integration"
      frequency: "Each waste shipment and emission interval"
      temporal_coverage: "All normal, failed, zero-output, cleaning and holding operations in matched period"
      site_scope: "Same site line product route and supplied state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Manifests; treatment interface; laboratory selectivity/recovery; monitors; physical and elemental closure investigation"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "For each exchange, convert the complete raw-period numerator to its declared unit, then divide the compatible attributable quantity once by positive Q as defined by unique first production acceptance in cp_release. Attribute opening carried burdens plus current burdens minus only documented burdens carried in closing unreleased material/WIP or transferred out of that cohort; retain failed/zero-output runs and all rework/return burdens without counting internal transfers twice. Released finished goods and subsequent warehouse/dispatch are separately reconciled and do not create another Q or closing production-WIP subtraction; retain their matched actual holding/transfer burdens. Do not renormalize a previously normalized factor. Q=0 retains raw quantities and the complete burden pool without a normalized result."
      inputs:
        - cp_material
        - cp_utilities
        - cp_release
        - cp_losses
      output: "Exchange amount per 1 kg reference flow"
      source_ids: []
    - id: solution_subledger
      applies_to: "peroxide_solution; phosphoric_solution; sles; propylene_glycol; benzotriazole"
      rule: "Active constituent mass = complete supplied reagent mass times independently assayed mass fraction. Water and other constituents use their own measured fractions. Fractions must be on compatible bases; v/v is not w/w. These are subledgers within the one procurement row, not additional inputs."
      inputs:
        - cp_material
        - cp_release
      output: "Non-additive constituent mass ledger"
      source_ids:
        - solvay-peroxide-assay-2019
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Use calibrated mass directly or volume times independently evidenced density at matched concentration and temperature. Rate times duration integrates a rate; an already integrated gas or liquid volume is multiplied by species concentration or independently verified density only, never duration again. No native secondary factor is a density measurement."
      inputs:
        - cp_material
        - cp_losses
        - cp_utilities
      output: "Converted raw quantity before normalization"
      source_ids: []
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Close physical mass and elemental inventories separately from assays. For the production pool, actual complete charges plus opening unreleased material/WIP equal unique first-accepted output plus closing unreleased material/WIP, actual waste/releases and documented net transfers. Reconcile uncharged feed stores through a separate receipt/issue ledger; do not add receipts and production charges as two external inputs. Already accepted output is not closing production stock again. Keep released finished goods and subsequent bulk handovers in a separate warehouse ledger, retaining their matched material and embodied burdens. Internal recirculation cancels. Count whole liquids once, water in every carrier separately, and investigated uncertainty. Do not use COD, a single closure residual or peroxide disappearance to solve unknown reaction water and another unknown outlet. Any reaction/species and its water formation or consumption require independent evidence; mixing itself establishes no synthesis yield or reaction water."
      inputs:
        - cp_material
        - cp_release
        - cp_losses
      output: "Independent mass elemental water and species balances"
      source_ids:
