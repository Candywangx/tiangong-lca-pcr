measurement_rules:
  - id: measure_reference
    applies_to: "finished_product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh released commercial product net of package tare using calibrated scales; reconcile accepted lots and opening/closing product stocks for one campaign. No per-bag denominator."
  - id: measure_material
    applies_to: "ore; serpentine; quartz; lime; electrode; refractory; oil; diesel; film; thread; waste outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record actual external mass, state, moisture and composition; distinguish wet parent mass, dry/active component and carrier water in explanatory ledgers without adding them twice."
  - id: measure_electricity
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "The verified electric-flow property is named Net calorific value with an energy basis. Convert metered kWh to MJ by 3.6; collect actual supplier voltage/geography/mix/delivery and loss boundary separately."
  - id: measure_gas
    applies_to: "gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Meter and convert only to the provider-compatible gas volume at measured T/P, wet/dry composition and compressibility. Native secondary mass values do not establish density. Unknown conventions prevent a complete link."
  - id: measure_sacks
    applies_to: "bag"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "Item(s)"
    rule: "Count actual compatible sacks and defects; the flow is limited to 25 kg-format sacks. Separately weigh tare/material and measured fill for the mass ledger; never assume 25 kg fill or a generic sack mass."
  - id: measure_road
    applies_to: "transport"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: ""
    required_unit: "t*km"
    rule: "Sum actual loaded shipment tonnes times route kilometres, with provider load/backhaul boundaries; avoid fuel/transport or supplier-leg duplication."
  - id: measure_water_out
    applies_to: "water_fresh"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use matched outfall volume; convert to water mass only with measured/traceable actual density/state and composition, not by confusing purchased water with emitted liquid."
  - id: measure_species
    applies_to: "elementary outputs except water_fresh"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Match actual species, phase, origin and medium; retain dry/wet gas T/P/O2 reference conditions and compatible sampling flow. Resolve lump indicators before claiming species quantities."
