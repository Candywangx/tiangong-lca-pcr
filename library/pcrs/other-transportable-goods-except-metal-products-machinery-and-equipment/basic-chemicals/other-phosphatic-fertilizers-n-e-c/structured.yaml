    rule: "Preserve unallocated actual product, residue, water, gas and stock quantities and equal internal link endpoints. Product and co-product physical outputs are never multiplied by an allocation share."
    source_ids:
      - jrc-lvic-aaf-2007
      - jrc-cww-2016
  - rule_id: allocation_single
    applies_to: "normal single-product unit"
    rule: "With one commercial fertilizer output, assign its attributable measured production and controls to that product; do not create fictional slag, nutrient coproducts or ash credits. Returned dust/glass/water has no external product function by itself."
    source_ids:
      - epa-lca-principles-2006
  - rule_id: allocation_multi
    applies_to: "actual additional valuable output"
    rule: "Establish actual product/waste status, specification, receiver and function. If a commercial coproduct exists, add its separate measured physical output before modelling: first use subdivision or justified system expansion; otherwise a demonstrated causal physical relationship, or justified matched-period economic relation where physical causality is unavailable. No automatic wet-mass/equal share or avoided-product credit."
    source_ids:
      - epa-lca-principles-2006
  - rule_id: allocation_ledger
    applies_to: "product burden reporting"
    rule: "Keep direct assignments, shared pools, factors summing to unity and sensitivity in a burden ledger separate from physical balances. Waste treatment stays attributed to its generating route; any credit requires explicit system/receiver evidence and absence of duplicate credit."
    source_ids:
      - epa-lca-principles-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "fused_powder_unit"
      flow_role: "net released product"
      record_type: "measured_record"
      raw_fields: "batch/SKU; gross/tare/net; accepted/rejected lots; stocks; commercial water; P2O5 total and declared extractant-soluble fraction; Ca/Mg/Si/F; trace elements; glass matrix; fineness; acceptance"
      collection_method: "Calibrated dispatch scales and lot-representative laboratory assays with specified extraction/test methods; reconcile stocks and actual supply state, retain unallocated release mass Q."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_material
      process_id: "fused_powder_unit"
      flow_role: "individual feeds and treatment reagent"
      record_type: "measured_record"
      raw_fields: "row/lot; supplier; received/charged/stocks; wet/dry/active fractions; mineral phases; P/Ca/Mg/Si/F; carbonate carbon; trace metals; particle size; fibrous minerals; receiver"
      collection_method: "Calibrated weights and representative feed/reagent assays, not literature burden ratios. Track structural water released from minerals separately from free feed moisture and purchased carrier water."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_energy
      process_id: "fused_powder_unit"
      flow_role: "electricity and on-site diesel"
      record_type: "measured_record"
      raw_fields: "stage meter/time; kWh; delivered voltage; actual supply mix/geography; loss boundary; load; diesel mass; volume/density/T; shared-service cause"
      collection_method: "Integrate calibrated stage meters; weigh actual diesel or convert measured litres using batch-compatible density. Assign shared services from measured drivers and retain stage measurements."
      unit: "MJ; kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_gas
      process_id: "fused_powder_unit"
      flow_role: "finishing pipeline gas"
      record_type: "measured_record"
      raw_fields: "metered volume; T/P absolute; humidity; gas composition; compressibility; supplier reference T/P/wet-dry; actual NCV/GCV; dryer/auxiliary duty"
      collection_method: "Meter actual headers and record volume-reference conventions and traceable equation of state. Measure heat duty and fuel quality separately; an MJ unit or secondary mass coefficient is not a delivery-basis proof."
      unit: "m3; MJ"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_water
      process_id: "fused_powder_unit"
      flow_role: "external makeup and internal water ledger"
      record_type: "measured_record"
      raw_fields: "supply header; makeup; internal quench/cooling/scrubber circulation; water in feeds/reagents/product/sludge; structural water; evaporation; blowdown; density/T; condensate; stock changes"
      collection_method: "Meter net external supply and all actual loop exits. Record origin and treatment in suppliers; structural/combustion water is a formation term, not another bought-water exchange."
      unit: "kg; m3"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_maintenance
      process_id: "fused_powder_unit"
      flow_role: "electrode lining and formulated lubricant"
      record_type: "measured_record"
      raw_fields: "actual grade/composition; installed/withdrawn/stocks; service campaign and output; graphite fossil carbon; lining wear; lubricant additives; receiver"
      collection_method: "Weigh actual replacements, withdrawals and stock changes over the served campaign; separate oxidation, wear into product and removed residuals; record the complete lubricant specification."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_pack
      process_id: "fused_powder_unit"
      flow_role: "each actual sack liner and sewing thread"
      record_type: "measured_record"
      raw_fields: "supplier included components; sack format; Item(s); damaged units; actual fill/tare; PP/PE/PET grade and finish; wet/material mass; actual discarded material; reuse/receiver"
      collection_method: "Count bags and weigh representative tare/components and actual fill, separating each purchased component once. Reconcile damaged sacks, liner and thread cuttings in additional atomic waste rows where produced."
      unit: "Item(s); kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_transport
      process_id: "fused_powder_unit"
      flow_role: "incoming road legs"
      record_type: "measured_record"
      raw_fields: "shipment tonnes; actual route kilometres; vehicle type; payload; backhaul; mode; supplying dataset transport boundary"
      collection_method: "Actual weighbridge/invoices and route records; sum tonnes × kilometres for each road leg once and demonstrate compatibility with the service provider. Other actual modes require separately defined rows."
      unit: "t*km"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_waste
      process_id: "fused_powder_unit"
      flow_role: "each physically distinct external residual"
      record_type: "measured_record"
      raw_fields: "stream origin; wet mass; dry solids; water; F/P/C/metals; oil/graphite/lining composition; hazard status; receiver/specification; actual treatment; recycle/stocks"
      collection_method: "Weigh and sample each residual at its real exit and retain signed receiver/treatment evidence. Unmixed origins remain separate; internal returns are excluded from external totals."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_air
      process_id: "fused_powder_unit"
      flow_role: "each gas and particle release"
      record_type: "measured_record"
      raw_fields: "source/outlet/control; flow and sampling intervals; T/P/O2 wet-dry bases; species concentrations; PM2.5/PM10/total comparable tests; F species; NO/NO2/N2O; carbon origin; trace-metal speciation; limits; diffuse emissions"
      collection_method: "Matched outlet flow and representative laboratory monitoring of relevant species after actual controls, covering normal and start/stop states. Retain dry feed-handling/milling/packing diffuse dust and collected solids separately; no inferred zero from electric heating."
      unit: "kg; m3; concentration; time"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_effluent
      process_id: "fused_powder_unit"
      flow_role: "each liquid gate and outfall species"
      record_type: "measured_record"
      raw_fields: "source; sewer/direct split; receiving medium; inlet/outlet volume and density; pH/T; TSS; F species; total/dissolved/particulate P and phosphate speciation; metals/COD where relevant; samples/limits; sludge water"
      collection_method: "Measure paired liquid flows and representative samples at pre/final treatment and real outfalls. Link the receiving environment or external operator; do not turn transferred wastewater into a direct elementary release. Add relevant actual species individually."
      unit: "kg; m3; concentration; time"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
    - protocol_id: cp_stage
      process_id: "fused_powder_unit"
      flow_role: "unallocated balances and burden accounting"
      record_type: "measured_record"
      raw_fields: "stage IDs; matched transfers; stocks; external feed/output; P/Ca/Mg/Si/F and trace impurities; H/O water ledger; fossil/geogenic/biogenic carbon; furnace/dryer heat; shared allocation cause; actual coproduct price/status"
      collection_method: "Preserve measured physical stage balances and equal link endpoints before allocating burdens. Measure losses, product assay, carbonate decomposition, electrode oxidation, internal reuse and heat recovery. Document actual causal/economic relations and uncertainty; never close balances by invented yield."
      unit: "kg; MJ"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared representative campaign including starts/stops, cleaning and stock reconciliation"
      site_scope: "same foreground unit and actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; test/speciation/detection limits; receipts; samples; timestamps; coverage and uncertainty"
  calculation_rules:
    - id: normalize_campaign
      applies_to: "all inventory rows"
      rule: "N = campaign external exchange in its declared unit / Q; Q is the same-campaign accepted net commercial powder mass in kg from cp_product. Preserve numerator, Q, stocks and stage measurements. Retain raw unallocated totals for one matched route, supplied state, grade and representative campaign, including all attributable failed and zero-accepted-output batches, start/stop, cleaning, idle, returns and rework. Reconcile opening/closing work in progress and finished stocks with accumulated inventory burdens, documenting carry-in/carry-out attribution without lost or duplicated burdens. Q is strictly positive final accepted net commercial production reconciled with release, dispatch and stocks; exclude final rejects and do not recount returned, reworked and reaccepted material. Apply normalize_campaign once to each reconciled raw exchange total. Row-specific conversion and calculation descriptions, including the Q division in road_service, denote that same normalization rather than another division. A complete campaign with Q <= 0 requires a justified wider representative period or an incomplete result."
      inputs:
        - cp_product
        - "row-specific protocol"
      output: "quantity per 1 kg reference flow"
      source_ids:
        - jrc-cww-2016
    - id: material_components
      applies_to: "wet feeds; lime; product; sludge"
      rule: "Component mass = measured wet parent mass × measured mass fraction. Dry/active matter, free carrier water and relevant structural water are explanatory parts, not extra purchased parent exchanges."
      inputs:
        - cp_material
        - cp_water
        - cp_product
        - cp_waste
      output: "physical component ledger"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "MJ = measured kWh × 3.6; this defined unit conversion is not a furnace or dryer consumption default."
      inputs:
        - cp_energy
      output: "compatible energy per reference kg"
      source_ids: []
    - id: load_species
      applies_to: "air and direct freshwater species"
      rule: "Retain raw period species mass before normalization. With compatible concentration and gas/liquid flow rate, integrate concentration × flow rate × the matched interval duration using explicit units. If the gas/liquid quantity is already an integrated volume, sum concentration × matched volume and do not multiply by duration again. Apply normalize_campaign once to the resulting raw period load. For element versus compound reporting, use measured speciation and the declared molar-mass ratio; total NOx or total F/P alone does not prove individual species."
      inputs:
        - cp_air
        - cp_effluent
      output: "raw period species mass before normalize_campaign"
      source_ids:
        - jrc-cww-2016
    - id: particle_bins
      applies_to: "pm25; pm10; pmover10"
      rule: "Fine = PM2.5; middle = comparable PM10 − PM2.5; large = comparable total PM − PM10. Independently tested disjoint bins may replace differences. Negative/incomparable differences require review, not clipping; do not add nested totals."
      inputs:
        - cp_air
      output: "disjoint particle mass ledger"
      source_ids:
        - jrc-cww-2016
    - id: gas_volume
      applies_to: "gas"
      rule: "Provider-compatible volume is calculated from metered volume using the recorded actual and provider T/P absolute, wet/dry composition and compressibility convention with a traceable equation of state. No fixed density, NCV or default correction factor."
      inputs:
        - cp_gas
      output: "provider volume ledger and normalized m3"
      source_ids: []
    - id: carbon_balance
      applies_to: "co2; geogenic_co2; co; methane; electrode"
      rule: "For each carbon origin: measured inputs = carbon in products/residuals + carbon in actual emitted species + stock change, with stated uncertainty. Oxidised fossil electrode carbon converted to CO2 uses 44/12 only for the CO2-assigned carbon; use corresponding molar ratios for CO/CH4. Mineral carbonate carbon and any real biogenic carbon stay separate and are not deleted from LCI."
      inputs:
        - cp_material
        - cp_maintenance
        - cp_air
        - cp_stage
      output: "origin-specific unallocated carbon ledger"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: phosphorus_basis
      applies_to: "ore; finished_product; phosphate"
      rule: "P2O5 assay is an analytical expression, not a pure oxide addition. Record total and extractant-soluble fractions and wet/dry denominator separately. PO4 mass from a measured phosphate-as-P load uses molar mass PO4 / molar mass P only after confirming that phosphate fraction; do not treat all total P as PO4."
      inputs:
        - cp_material
        - cp_product
        - cp_effluent
      output: "analytical P ledger and speciated load"
      source_ids:
        - zennoh-fused-phosphate
    - id: water_energy_balance
      applies_to: "stage links; water; water_air; water_fresh"
      rule: "Reconcile external free water, feed/reagent water, structural water release and combustion water with retained product/sludge moisture, vapour, liquid exits and stocks; reconcile furnace/finishing electricity/fuel with measured useful duty, cooling/quench heat and losses. Report residuals without invented yield, evaporation or steam credit. For actual neutralisation, precipitation or other reactions, retain independently evidenced water formation/consumption and dry-species formation/consumption terms from measured chemical forms and reaction extents. Complete-boundary total mass and elements conserve; individual water or dry species need not. Do not infer those reaction terms by forcing a residual, COD or assumed formula to close."
      inputs:
        - cp_water
        - cp_gas
        - cp_energy
        - cp_stage
      output: "physical water/H/O and energy ledgers"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: road_service
      applies_to: "transport"
      rule: "Road service = sum(shipped kg / 1000 × actual leg km), before dividing by Q; demonstrate actual load/backhaul provider basis and keep included upstream legs from being counted again."
      inputs:
        - cp_transport
        - cp_product
      output: "t*km per reference kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and feeds"
      requirement: "Require measured unfortified glassy powder and virgin-rock/serpentine electric route; neither a category label nor a broad fertilizer UUID establishes composition or nutrient basis. Resolve contrary CAS/route fields before linking."
      evidence: "actual SKU, mineralogy, assays and process diagram"
    - id: dq_measurement
      applies_to: "all rows"
      requirement: "Calibrated units, compatible supplier/receiver basis, matched campaign Q and representative time coverage; record uncertainty and independent stage readings. No borrowed purity, recipe, energy, yield or default emission rate."
      evidence: "cp_product; cp_stage; row protocols"
    - id: dq_balances
      applies_to: "physical streams"
      requirement: "Keep unallocated mass, water/H/O, P/Ca/Mg/Si/F, trace-element, carbon-origin and energy ledgers, including dust capture, electrode oxidation, lining wear, coproducts, liquid transfers and stocks. Report residuals with uncertainty rather than inventing closure."
      evidence: "cp_stage; jrc-lvic-aaf-2007"
    - id: dq_completeness
      applies_to: "active actual exchanges"
      requirement: "Capture normal/start/stop, cleaning, maintenance, diffuse dust and every relevant species; add actual extra chemicals, packaging wastes/filter media, transport or controls individually. Missing measurements or identities remain unknown, not zero."
      evidence: "stream register; cp_air; cp_effluent"
    - id: dq_source_scope
      applies_to: "all sources"
      requirement: "IFA is a historical industry synthesis, Zennoh a distributor handbook and Yoorin a producer family; they do not establish universal quantities. JRC general balance/monitoring rules apply only in their stated scope, not other fertilizer chapters or legal limits. EPA is general historical LCA guidance, not a current standards-compliance claim."
      evidence: "source sections and actual applicability"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference and feeds"
    rule: "Demonstrate the stated virgin-rock/serpentine electric fusion and unfortified glassy powder scope; excluded feeds/routes cannot be waived with a broad fertilizer name. Declare whole commercial kg separately from analytical P/P2O5."
    source_ids:
      - ifa-fertilizer-china-2009
      - zennoh-fused-phosphate
  - rule_id: validate_reference
    applies_to: "finished_product"
    rule: "Exactly one completed final reference product output; denominator and collection aggregation are per 1 kg net commercial release in both languages. Equal internal handovers remain physical stage records."
    source_ids:
      - jrc-lvic-aaf-2007
  - rule_id: validate_supply
    applies_to: "utilities and components"
    rule: "Verify actual energy/volume/count properties, gas conditions, electricity provider, package inclusions and wet/active/water bases. Missing supplier conventions prevent a complete background link even with a valid flow identity."
    source_ids:
      - jrc-cww-2016
  - rule_id: validate_species
    applies_to: "elementary releases"
    rule: "Require true species, carbon origin and air/freshwater medium. Do not substitute F2 for HF/fluoride, total NOx for NO or NO2, N2O for NOx, dissolved solids for suspended solids, or correction flows for real emissions. Keep PM bins and captured/emitted mass disjoint; real biogenic CO2 remains in LCI."
    source_ids:
      - jrc-cww-2016
  - rule_id: validate_physical
    applies_to: "balances and allocation"
    rule: "Reconcile physical outputs and equal internal links before burden allocation; no reduced physical coproduct output, disappearing water, invented carbonate conversion or duplicate dust/wastewater burden."
    source_ids:
      - jrc-lvic-aaf-2007
      - epa-lca-principles-2006
  - rule_id: validate_completeness
    applies_to: "concrete dataset"
    rule: "Every active actual row needs quantity evidence, identity decision, property/unit, state, provider/receiver and route applicability. Unresolved identity, lump-only species assay, unknown quantity or unsupported conversion prevents a complete dataset claim; method authorship is not scientific approval or site verification."
    source_ids:
      - jrc-cww-2016
published_dataset_profile:
  dataset_role: "Foreground production dataset for the specified unfortified electric-fused powder"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual compatible powder supply to an explicitly assessed product system, with measured commercial and nutrient bases"
  excluded_use: "Generic all-phosphatic-fertilizer average; kg nutrient without explicit assay conversion; excluded fusion/acidulation/secondary-feed routes; direct field-use impacts or crop/climate-credit claims"
  required_metadata: "SKU, feed origins/assays, route, glass matrix, moisture/fineness, acceptance, Q/campaign, providers, utility conventions, packages, treatment/outfalls, stocks, coproduct/waste status, allocation and system gate"
  required_quality_disclosure: "Actual measurements and uncertainty; source applicability; unknown or missing quantities/identities; background compatibility; closures and residuals; scientific-review state"
  update_trigger: "Feed/route/grade/utility/packaging/control/receiver change, new primary evidence, confirmed identity correction, or failed quantity/physical compatibility"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "[UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "pp./PDF165–166: phosphatic/superphosphate and multi-nutrient hierarchy. Classification context only; the residual label is not a recipe or whole-leaf method identity."
  - id: "ifa-fertilizer-china-2009"
    type: "handbook"
    reference: "[IFA, The Chemical Fertilizer Industry in China: A Review and its Outlook, May 2009](https://www.fertilizer.org/wp-content/uploads/2023/01/2009_ifa_fertilizerindustrychina.pdf)"
    used_for: "Chapter3.2.1.2, p39/PDF57 and translation disclaimer PDF4: mineral-flux electric fusion, water quench and finishing. Historical national/plant quantities and performance, ore thresholds and other furnace routes are not defaults."
  - id: "zennoh-fused-phosphate"
    type: "handbook"
    reference: "[Zennoh, Fertilizer Q&A Chapter2: Fused phosphate (ようりん), publisher handbook](https://www.zennoh.or.jp/operation/hiryou/pdf/02_yourin.pdf)"
    used_for: "pp76–78/PDF1–3, Figures1–2: fusion/quench/finishing and glass-network identity; distinguishes nutrient-enriched grades. Does not make mineral-slag feed interchangeable with virgin serpentine or impose handbook grade guarantees."
  - id: "yoorin-phosphate-products"
    type: "handbook"
    reference: "[Yoorin, phosphate products, producer page](https://www.yoorin.com.br/pt/nossas-solucoes/fosfatados-yoorin)"
    used_for: "Product-family electrofusion statement and listed Mg/Master/S/B-Mag variants support a marketed physical family and exclusions. Promotional agronomic/climate claims and product recipes are not defaults or credits; actual SKU required."
  - id: "jrc-lvic-aaf-2007"
    type: "official_guidance"
    reference: "[European Commission JRC, LVIC-AAF BREF, August 2007](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf)"
    used_for: "Sections1.5.1–1.5.2 pp33–34/PDF61–62: general fertilizer-site mass/water/carbon/energy balance and measurement. Does not supply a thermal-fusion recipe or apply acidulation-specific chapters/limits."
  - id: "jrc-cww-2016"
    type: "official_guidance"
    reference: "[European Commission JRC, Common Waste Water and Waste Gas Treatment/Management Systems in the Chemical Sector, 2016, JRC103096](https://publications.jrc.ec.europa.eu/repository/bitstream/JRC103096/jrc103096_cww_bref_10_2016.pdf)"
    used_for: "BAT2–4 pp543–544/PDF573–574: chemical-plant stream register and relevant outlet/load monitoring. Actual relevant species determine the sampling plan; no BAT-AEL conversion to LCI or legal compliance claim."
  - id: "epa-lca-principles-2006"
    type: "official_guidance"
    reference: "[US EPA, Life Cycle Assessment: Principles and Practice, EPA/600/R-06/060, May 2006](https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P1000L86.TXT)"
    used_for: "Chapter3, allocation, pp28–29: general industrial subdivision/expansion, physical and alternative/economic relationship hierarchy. Historical method guidance only; no generic fraction, plant recipe or assertion of current ISO compliance."
