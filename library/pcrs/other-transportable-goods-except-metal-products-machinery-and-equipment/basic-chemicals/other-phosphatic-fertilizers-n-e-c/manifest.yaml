review_metadata:
  scientific_review: "pending independent methodological review; no publication or acceptance asserted"
  semantic_boundary: "Virgin phosphate rock and serpentine, conditional quartz, electric fusion/water quench/dewatering/drying/milling/screening; unfortified powder. Excludes acidulation, ground rock, basic slag, secondary ash/slag feed, added N/K/S/micronutrients and binder granulation. Proposed CPC 3.0 34629 narrower; shared mapping decision belongs to controller."
  reference_identity: "Broad mass-basis commercial phosphate fertiliser 9c196b01-6aad-4252-a6e8-f853853a830c includes this physically constrained subset without contrary route. No concentration or source-paper formula is used; actual product/provider basis is required. Exact-name 143413d6-f1b7-4b0a-a12e-0e7e1d788b28 rejected for explicit lead/zinc-mining route."
  unresolved_inventory_flows:
    - row_id: "serpentine"
      reason: "One actual serpentine rock flux, not isolated chrysotile asbestos or a manufactured serpentine electrical element. Require mineralogical and chemical acceptance, fibrous-mineral screening, moisture and measured charge mass."
    - row_id: "oil"
      reason: "Conditional actual maintenance lubricant including its declared additives, grade and contamination control. Pure mineral oil and PAO-specific records do not establish the identity of the complete formulated oil. Record net consumption and stock change."
    - row_id: "thread"
      reason: "Conditional purchased polyester sewing thread measured separately only when not included in the sack supplier boundary. Declare polymer, construction, finish and measured mass; filament, cloth and yarn records that exclude sewing thread cannot stand in for it."
    - row_id: "dust_waste"
      reason: "Measure one physically collected mineral-dust waste sent to a declared receiver, with origin, composition, moisture and hazard classification. Dust returned internally is retained only in the internal ledger; feed-grade dust and airborne emissions are different exchanges."
    - row_id: "sludge"
      reason: "One physically combined inorganic treatment-sludge stream only if actually mixed. Weigh wet output, dry solids, fluoride/phosphate/metals and receiver acceptance. Keep separate unmixed sludge origins as separate dataset rows; biological or oil sludge is not this flow."
    - row_id: "refractory_waste"
      reason: "Conditional removed MgO-brick lining with actual contamination and receiver. Reconcile removed mass, wear into product, dust and remaining lining; aluminium-process refractories or magnesium smelting slag are not interchangeable."
    - row_id: "effluent"
      reason: "Conditional liquid wastewater transferred to an external treatment operator, in measured wet mass and declared composition. It is an alternative gate to the direct-outfall water/pollutant rows for the same liquid; emissions subsequently released by the receiver belong in its treatment dataset."
    - row_id: "offspec"
      reason: "Conditional discarded fused fertilizer glass, with measured composition, moisture and receiver status. Internal remelt is an internal return, not waste leaving the gate or a second reference product. Float-glass cullet is a different material."
    - row_id: "spent_electrode"
      reason: "Conditional physically removed electrode graphite, with contamination and receiver. Separate it from oxidised carbon and internal electrode stocks. Battery-recycling graphite does not match this origin."
    - row_id: "geogenic_co2"
      reason: "Conditional mineral-carbonate decomposition CO2 from actual feed assay and carbon/species balance; no fossil-fuel or biogenic correction flow is assumed to identify it. This row has no default amount and uses outdoor air, subcompartment unspecified."
    - row_id: "tss"
      reason: "Actual undissolved solid mass at the direct outfall; dissolved solids and a water-unspecified identity do not establish the requested freshwater suspended-solid match. These direct releases and an off-site wastewater transfer cannot both represent the same liquid. Quantities are collected only where applicable."
  provider_basis_requirements:
    - "Actual supply electricity voltage/mix/geography/delivery losses required; unspecified energy-basis identity is not a background dataset."
    - "Natural gas native Volume/m3 needs actual T/P/wet-dry/composition/Z and provider volume convention; secondary mass coefficient is not density."
    - "PP sack UUID uses Number of items/Item(s) and 25 kg-format restriction; actual fill and tare measured separately, other formats need verified identities."
    - "Feed assays, commercial moisture, actual glass matrix, net release, fuel carbon source and air/water species quantities remain future foreground collection requirements, not defaults."
  metadata_caveats:
    - row_id: "film"
      uuid: "e64eb06c-6dc9-45f1-b003-3dc6c44b27e2"
      issue: "Physical PE film name/CAS9002-88-4/comment agree, but native CPC29220 class is misplaced. Retain conditionally for actual PE film; disclose provider/source-classification clarification debt."
