system_boundary:
  rules:
    - rule_id: boundary_line
      applies_to: "foreground_system_boundary"
      rule: "Include receipt, melting, muffle vaporisation, external oxidation, cooling/filter collection, internal powder handling, packaging, control systems and actual maintenance/water treatment within one aggregate foreground unit. Record raw stage measurements and paired internal transfer quantities; only finished is the reference output."
      source_ids:
        - jrc-lvic-s-2007
    - rule_id: boundary_interfaces
      applies_to: "foreground_system_boundary"
      rule: "Keep refinery/ore processing upstream of received primary zinc, never omit their burden. Separately disclose receipt transport and prevent double inclusion with delivered backgrounds. Require an atomic measured row for any actual additional chemical, side salt, separated filter residue, dust shipment or release; distinguish product, co-product, waste and environmental release. No wet-route salt or sludge default."
      source_ids:
        - jrc-lvic-s-2007
    - rule_id: boundary_air
      applies_to: "foreground_system_boundary"
      rule: "Preserve oxidation/filter exhaust, combustion gases and handling fugitive dust by source, including startup, shutdown and baghouse upset/emergency operation. Unchanged inlet/outlet air carriers and humidity remain in a separate physical gas ledger. Do not claim BAT targets or historical zero water/soil values as actual site observations."
      source_ids:
        - jrc-lvic-s-2007
