  - id: element_basis
    applies_to: "zn_air; pb_air; cd_air; zn_water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Elemental analytical masses and oxide masses are different. Require chemical speciation, lab basis and provider/characterization compatibility before conversion or use."
  - id: physical_mass_ledger
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep the unallocated mass ledger separate from the inventory quantity-property and energy ledgers. Convert actual gas/liquid volumes to kg only with measured density or a documented composition/T/P/compressibility determination at the same state; no database non-reference mass coefficient is a density. Count full powder and accompanying paper-sack, pallet and actual film dispatch masses, rejected material and all residues/releases, with stock changes and paired internal links. The 1 kg reference remains net powder; accompanying packaging is part of its supply function, not a separately credited co-product. Preserve full packaging receipts, dispatch and returns, and loose and installed filter/refractory stocks, actual installation/removal, wear and adhering material. Service-life burden attribution stays in a separate ledger and never changes the actual physical exchange or creates a zero maintenance burden solely because no replacement occurred during the measured period."
