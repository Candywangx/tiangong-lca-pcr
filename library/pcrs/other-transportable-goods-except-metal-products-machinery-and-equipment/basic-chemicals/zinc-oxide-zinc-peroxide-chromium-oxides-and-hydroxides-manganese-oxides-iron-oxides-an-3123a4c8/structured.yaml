    applies_to: "reference product and zinc_feed"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record water fraction separately from ignited-basis assay and other ignition losses. Convert to delivered elemental/pure-species mass only with a documented lab basis reconciliation; drying loss is not automatically water and database grade values are not assay."
  - id: gas_volume
    applies_to: "gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
