allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "foreground_burden_allocation"
    rule: "Maintain a complete unallocated physical ledger first. Test subdivision and system expansion, then a demonstrable physical relationship, then another justified relationship such as measured relative market value. Document why earlier choices are unavailable; expanded-system results describe the expanded system. No automatic allocation or recycling credit based on the historic dross table."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_ledgers
    applies_to: "foreground_burden_allocation"
    rule: "Classify exported skimmings/off-grade material using composition, legal status, receiver function and actual sale records. Record full physical quantities and equal internal links; allocation shares partition burdens, not the existence or measured mass of product/co-product outputs. Retain nonallocated and allocated burden ledgers separately. For economic allocation use same-period gate prices and quantities, disclose sensitivity, and never assume free recycling or replacement of primary zinc."
    source_ids:
      - ec-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "muffle_line"
      flow_role: "finished"
      record_type: "Acceptance/weighing/lab"
      raw_fields: "lot/SKU; gross/tare/net accepted kg; water assay; ZnO assay with dry/ignited basis; all ignition losses; crystalline phase; particle size; impurities; reject/rework; period"
      collection_method: "Use calibrated sack/lot weighing and traceable lab methods; reconcile acceptance/shipment and stock. Declare actual XRD or equivalent phase evidence and sampling coverage; no supplier nominal substituted for lot result. Sum accepted net kg for A in declared period; all results per 1 kg reference flow"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "Same declared period; include startup/shutdown and maintenance"
      site_scope: "One declared line and its attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; lab reports; COA; stock reconciliation"
    - protocol_id: cp_inputs
      process_id: "muffle_line"
      flow_role: "zinc_feed; gas; electricity_mv; paper_bag; pallet; pe_wrap; filter_bag; refractory"
      record_type: "Meter/invoice/stock"
      raw_fields: "row_id; source; opening/purchases/closing; net use; lot purity/CAS; material recipe; zinc primary refining provenance; gas T/P/wetness/composition/Z; actual electricity voltage/mix; package construction/liners; full receipts/dispatch/returns; reuse service records; loose/installed filter and refractory opening/closing stocks; actual installed/removed/worn masses; replacement/service period"
      collection_method: "Calibrated source/stage meters and weighed receipts; reconcile supplier definitions and attributable stock consumption; account standby/emergency energy; separate electricity and gas. Sum each attributable exchange / A; per 1 kg reference flow"
      unit: "kg; m3; MJ"
      frequency: "each lot; continuous meters"
      temporal_coverage: "Same declared period; include startup/shutdown and maintenance"
      site_scope: "One declared line and its attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; supplier primary records; unit conversion"
    - protocol_id: cp_air
      process_id: "muffle_line"
      flow_role: "oxygen; nitrogen_in; oxygen_out; nitrogen_air; co2; co; nox; so2; ch4; n2o; pm25; pm10; pmover10; pm_unsized; pm_condensable; zn_air; pb_air; cd_air; water_air"
      record_type: "Stack/air/leak monitoring"
      raw_fields: "row_id; source; operating mode/hours; air/exhaust flow; T/P/humidity; dry/wet and oxygen-reference convention; gas species concentration; PM bins/condensable limits; analytical metals/speciation; fuel C/H/O/N/S and water composition; combustion/oxidation/cooling inlet flows and humidity; argon and other actual carriers; reaction water; gross/net source masses; detection limits; NOx quantity definition"
      collection_method: "Collect source-specific actual monitoring with compatible volume/concentration bases, source operating-time logs and laboratory speciation. Use Method201A only for suitable stationary filterable dry PM; retain its droplet, temperature and isokinetic restrictions, and separately resolve condensable/unsized PM. Unknown emissions remain pending, never zero. Sum nonoverlapping source masses / A; per 1 kg reference flow; retain inlet/outlet carrier balance"
      unit: "kg"
      frequency: "continuous or representative measured modes plus complete hours"
      temporal_coverage: "Same declared period; include startup/shutdown and maintenance"
      site_scope: "One declared line and its attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "method reports; calibration/blanks; detection limits; hours; provider definition"
    - protocol_id: cp_residue
      process_id: "muffle_line"
      flow_role: "dross; offspec; spent_filter; spent_refractory; sludge"
      record_type: "Weighbridge/lab/receiver"
      raw_fields: "row_id; mass; dry matter/water; Zn metal/ZnO and Pb/Cd; adhering powder; legal status; receiver and function; sale/treatment record; internal reuse; shipment date"
      collection_method: "Weigh each distinct shipment including actual removed filter/refractory material and adhering powder; record separated dust separately, sample composition and confirm receiver acceptance; match stock/rework and distinguish co-product sale from waste. No assumed complete recycling. Sum actual external quantities / A; per 1 kg reference flow; internal returns recorded separately"
      unit: "kg"
      frequency: "each shipment/replacement"
      temporal_coverage: "Same declared period; include startup/shutdown and maintenance"
      site_scope: "One declared line and its attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale ticket; lab; signed receiver records"
    - protocol_id: cp_water
      process_id: "muffle_line"
      flow_role: "cooling_water; wastewater; sludge; water_fresh; zn_water"
      record_type: "Water meter/lab/transfer"
      raw_fields: "source; purchased makeup; cleaning and cooling demand; circulation; evaporation; whole effluent volume/mass; water-carrier volume; density and dissolved/suspended fractions; dissolved/particulate Zn; sludge water; endpoint; permit; time"
      collection_method: "Use calibrated meters and paired laboratory samples; reconcile actual water balance and receiver. Distinguish offsite untreated wastewater, onsite sludge and direct final freshwater effluent; supplement each actual pollutant individually. Each purchased/discharged exchange / A; per 1 kg reference flow; internal circulation excluded from new intake"
      unit: "kg; m3"
      frequency: "meter interval and each discharge/cleaning"
      temporal_coverage: "Same declared period; include startup/shutdown and maintenance"
      site_scope: "One declared line and its attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; lab; endpoint and treatment evidence"
    - protocol_id: cp_stage
      process_id: "muffle_line"
      flow_role: "all inventory rows"
      record_type: "Stage material/energy ledger"
      raw_fields: "stage IDs; paired transfers; feed metal mass; vapour/captured powder; accepted/rejected/reused quantities; Zn/O/H/C/N/S and other measured elemental fractions; water generation/consumption; complete gas carriers; loose/installed stores; all residual outputs; furnace energy meters, declared energy/enthalpy basis, reaction and stored energy, exported heat, losses and internal heat recovery; accompanying package dispatch masses and handoff; gas/liquid density at recorded state with basis"
      collection_method: "Retain melting/vaporisation/oxidation/filter/packing measurements, pair link ends at identical physical amount and reconcile elemental and gas/water balances before allocating burdens. Period physical totals and balances / A; per 1 kg reference flow; retain unnormalised ledger"
      unit: "kg; m3; MJ"
      frequency: "each batch plus period stock reconciliation"
      temporal_coverage: "Same declared period; include startup/shutdown and maintenance"
      site_scope: "One declared line and its attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired stage logs; elemental assay; stock and energy reconciliation"
    - protocol_id: cp_allocation
      process_id: "muffle_line"
      flow_role: "all inventory rows"
      record_type: "Function/price/burden records"
      raw_fields: "actual outputs/receivers; directly attributable meters; allocation decision; physical relation; same-period price and quantity; burden shares; sensitivity; recycling handoff"
      collection_method: "Document hierarchy and each actual function; retain physical outflows and separately partition shared burdens. Credit requires representative substantiation and compatible study method. Attributable burden / A; per 1 kg reference flow; physical output quantities stay complete"
      unit: "kg; currency; share"
      frequency: "declared study period"
      temporal_coverage: "Same declared period; include startup/shutdown and maintenance"
      site_scope: "One declared line and its attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receiver/price evidence; alternatives; share sum and sensitivity"
  calculation_rules:
    - id: period_normalisation
      applies_to: "all inventory rows"
      rule: "A = accepted net as-delivered product kg in the period; exchange per kg = attributable measured period exchange / A. Preserve full physical outputs; allocate only the burden ledger where justified."
      inputs:
        - cp_reference
        - cp_inputs
        - cp_air
        - cp_residue
        - cp_water
        - cp_allocation
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - ec-pef-2021
    - id: source_release
      applies_to: "co2; co; nox; so2; ch4; n2o; pm25; pm10; pmover10; pm_unsized; pm_condensable; zn_air; pb_air; cd_air; water_air; zn_water"
      rule: "Integrate matching concentration × source flow × time after reconciling unit, T/P, moisture, oxygen correction, speciation and sampling mode. Nonoverlapping sources are summed; unknown quantity definitions cannot be converted."
      inputs:
        - cp_air
        - cp_water
      output: "Measured period release to named medium before division by A"
      source_ids:
        - jrc-lvic-s-2007
        - epa-201a-2020
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "First reconcile total period mass, full powder and packaging dispatch/returns, residues/releases and stock changes using measured same-state density or a documented state conversion. For each actual element, including Zn, O, H, C, N and S: measured elemental input + opening elemental stock = elemental outputs + closing elemental stock. Include Pb/Cd and other measured retained constituents as applicable. Water-species accounting includes input water and inlet humidity plus combustion/reaction-generated water, minus consumed water, with all liquid/vapour/product water and stocks; water is not a conserved element. Pure Zn oxidation 2 Zn + O2 → 2 ZnO produces no water; fuel water formation requires actual fuel composition and conversion evidence, not a pure-methane or complete-combustion default. Keep the complete inlet/outlet air carrier ledger, including measured argon and other constituents; distinguish oxidation, combustion and cooling air and gross exhaust from net process releases. Internal links cancel only after matching both ends. Stoichiometry checks reaction consistency, not yield, purity or thermal efficiency. Separately reconcile supplied chemical/electrical energy, reaction energy and opening stored energy against output/stored energy, measured exported heat and losses on a declared thermodynamic basis; count internal heat recovery once. Never count the same fuel reaction energy both as calorific input and as additional reaction heat. Unmeasured quantities and discrepancies stay explicit."
      inputs:
        - cp_reference
        - cp_stage
        - cp_air
        - cp_water
        - cp_residue
      output: "Unallocated physical ledger and discrepancy with uncertainty"
      source_ids:
        - jrc-lvic-s-2007
    - id: disjoint_pm
      applies_to: "pm25; pm10; pmover10"
      rule: "On the same source/time and filterable basis: PM2.5–10 = measured PM10 minus measured PM2.5; PM>10 = measured total filterable PM minus measured PM10 when that total is independently valid. Never invent size fractions; unknown or negative differences require investigation. Preserve condensable and metal-overlap annotations separately."
      inputs:
        - cp_air
      output: "Three nonoverlapping bins; condensable scope disclosed"
      source_ids:
        - epa-201a-2020
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Actual CAS/phase/grade/route, material state, medium and provider quantity basis must match. Unknown UUID stays a named atomic flow with unresolved metadata, never a near-match substitution."
      evidence: "cp_reference; cp_inputs; cp_air; cp_residue; cp_water"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Collect a disclosed representative period and all attributable modes; quantify measurement uncertainty and unknown/conditional flows. No positive quantity or zero is inferred from a database identity, BAT limit or historical mean."
      evidence: "cp_stage; cp_air"
    - id: balance
      applies_to: "all inventory rows"
      requirement: "Reconcile unallocated total mass, elemental Zn/O/H/C/N/S and other measured constituents, water generation/consumption, gas carriers, installed/loose stock and energy; assign any unexplained difference for review. Do not force closure by an invented unmeasured loss."
      evidence: "cp_stage"
    - id: source_scope
      applies_to: "all inventory rows"
      requirement: "Retain supplier lot results and method applicability; producer grade tables and BREF historic quantities cannot become universal defaults. Separate chemical species from analytical elemental basis and PM from its overlapping constituents."
      evidence: "zochem-102-2023; jrc-lvic-s-2007; epa-201a-2020"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Require primary SHG zinc and gas-fired muffle route evidence, actual untreated ZnO SKU/CAS/phase, lab assay basis and no formulation. Different metal/route/state/treated variant fails applicability; using CPC34220 label alone fails scope."
    source_ids: []
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one reference output, finished, is 1 kg net as-delivered powder. Each inventory amount and collection aggregation uses accepted net period kg A and the same denominator in both languages. No purity/dry/element conversion silently changes the reference."
    source_ids: []
  - rule_id: validate_streams
    applies_to: "foreground_dataset_conformance"
    rule: "Verify each atomic UUID, type, species, medium, property/unit and provider compatibility, all unresolved gaps and measured side streams. Apply conditional absence only with evidence. Reconcile paired internal links and unallocated physical totals before allocated burdens; avoid nested PM and metal-mass double counting."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Unknown utility definitions, NOx mass basis, unresolved emission/speciation, missing amount/purity or unsupported water endpoint make the foreground package incomplete. Scientific review, accepted classification mapping and complete background coverage are separate from mechanical target checks."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared primary-SHG gas-muffle uncoated ZnO powder supply after completing measured inventory and compatible background links"
  excluded_use: "Whole CPC34220 coverage; other oxides/routes; generic nanoparticle or treated-product claims; default purity/recipe/emissions; unsupported comparative or compliance claims"
  required_metadata: "Required qualifiers; source/period/route/stage map; reference denominator; supplier backgrounds and quantities; waste endpoints; monitoring methods; allocation decisions"
  required_quality_disclosure: "Unresolved identities/provider bases; missing measurements/coverage; balance differences; uncertainty; source-specific restrictions and independent review state"
  update_trigger: "Changed feed provenance, furnace/fuel, phase/grade/coating, utility supply, residue receiver, air/water endpoint or new measured source evidence"
