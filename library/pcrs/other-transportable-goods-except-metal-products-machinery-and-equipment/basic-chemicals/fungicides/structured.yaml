allocation_rules:
  - rule_id: allocation_direct
    applies_to: "release"
    rule: "First isolate directly attributable loads; examine subdivision or justified system expansion before allocation. For inseparable shared loads justify a causal measured physical driver; if unavailable, explain the rejection and any other relationship, disclose sensitivity and retain review. No default mass or revenue split."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_once
    applies_to: "all inventory rows"
    rule: "A product receipt, stock transfer, true return, reinspection or resale creates no co-product credit and no second production event. Retain unsuccessful release, rework-related environmental services and their losses in the matched reporting pool."
    source_ids: []
  - rule_id: allocation_pack
    applies_to: "primary_bag_in, carton_in, pallet_in"
    rule: "Assign manufacture, procurement, transport, cleaning, repair and pool-service burdens by actual provenance and coverage once. Traceable R carries the same article's remaining burden, not a new article manufacture. First N is not burden-free merely because unpurchased or absent from supplier inventories. Supplier coverage unknown means pending investigation, not zero. No unsupported lifetime/rotation assumption or avoided-production credit."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "release"
      flow_role: "finished_wp"
      record_type: "first-release and stock ledger"
      raw_fields: "QA owner; registration; holder; manufacturer; product form; batch ID; site; period dates; release decision/date; conformity certificate; manufacturer/entrusted-site permission; production date; sales/dispatch date; calibrated gross/tare/net kg; previous release; opening/closing unreleased and released stocks; failed lots; returns; burden transfers"
      collection_method: "Quality owner reconciles unique first final acceptance with net weighing and lot genealogy across supplier/site. B is newly first-qualified whole-product net kg in the matched pool. Do not substitute shipments, design capacity or sales. Exclude previous final releases, transfers and reinspection from B; retain failures and zero-output periods in the burden pool. Allocate opening carried burdens in and closing carried burdens out once. Do not normalize if B is nonpositive or unresolved"
      unit: "kg"
      frequency: "each event and period close"
      temporal_coverage: "whole matched reporting period"
      site_scope: "declared release site and actual manufacturer interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed release; calibration; stock balance; supplier handoff; carried-burden reconciliation"
    - protocol_id: cp_product
      process_id: "release"
      flow_role: "received_wp, returned_released_wp, returned_wp"
      record_type: "whole-product custody ledger"
      raw_fields: "procurement owner; manufacturer; supplier lot; registration; net kg; previous release status; custody dates; returns; rejected/discarded kg; provider identity and environmental coverage; freight coverage"
      collection_method: "Reconcile each external whole-product receipt and supplier return to cp_output genealogy, calibrated mass and matched stock bridge. Keep per-lot, per-exchange external carried-in environmental vectors, their source/destination, acquisition time, remaining unassigned share and one-time entry/settlement keys; opening/closing and outward transferred shares, distinct from newly incurred burdens. Supplier coverage links each exchange to exactly one provenance entry. Preserve all environmental upstream burdens without internal recipe disclosure; coverage gaps block a complete dataset"
      unit: "kg"
      frequency: "each handoff"
      temporal_coverage: "same pool as cp_output"
      site_scope: "actual supplier and site boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; delivery and return receipts; compatible upstream provider; nonduplicate coverage matrix"
    - protocol_id: cp_pack
      process_id: "release"
      flow_role: "primary_bag_in, carton_in, pallet_in, primary_bag_out, carton_out, pallet_out"
      record_type: "article-type physical and burden ledgers"
      raw_fields: "packaging owner; article identity/type; construction; kg per item; count; opening/closing stock; P; N; R; prior same-site dispatch; ownership; attached-to-load receipts; separately borrowed/free transfers; outward destinations; discard; unresolved loss; supplier coverage; manufacture/freight/service records; cohort per-exchange external carried-in remaining vector; entry/settlement key; historical assigned share; new-burden flag; carried burden"
      collection_method: "For each type independently weigh or convert count using measured article mass. Record all first external N, including unlisted incoming-load packaging and separate loans/transfers; R requires identity linkage to an earlier site dispatch. Reconcile all incoming/outgoing/stock changes with pack_balance; record each transfer counterparty/pool and its paired outward/inward settlement so only the remaining vector re-enters. Audit supplier coverage independently of receipt origin. Reconcile burden assignment by cohort and actual service use with pack_burden, retaining true returns in their original cohort and verifying only the remaining unassigned share, never assuming all manufacture returns or is zero; missing supplier data remains pending"
      unit: "kg"
      frequency: "each movement and period close"
      temporal_coverage: "same pool as cp_output, with opening cohorts"
      site_scope: "site pool including borrowed and supplier-owned articles"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "item trace; measured article mass; ownership/handoff; invoices; return receipts; pool stock count; coverage matrix"
    - protocol_id: cp_utilities
      process_id: "release"
      flow_role: "electricity, tap_water"
      record_type: "meter and coverage ledger"
      raw_fields: "utility owner; meter ID; start/end; multiplier; unit; dates; site boundary; submeter/shared driver; already integrated flag; supply provider; native property if selected; cleaning-water mass or measured conversion; supplier-service coverage"
      collection_method: "Read calibrated meter deltas for included receipt, packaging, holding and qualification support. Subdivide measured loads where possible; retain failed/zero-output loads and stock burdens. Reconcile shared driver and provider coverage; a service including electricity cannot be charged again. Retain electrical kWh separately from supplier-native identity"
      unit: "kWh; kg"
      frequency: "each meter interval and period close"
      temporal_coverage: "same pool as cp_output"
      site_scope: "included site and support services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meters; bills; measured driver; property/unit chain; coverage reconciliation"
    - protocol_id: cp_waste
      process_id: "release"
      flow_role: "discarded_wp, spent_bag, discarded_carton, discarded_pallet, zone_wastewater"
      record_type: "individual waste transfer ledger"
      raw_fields: "environment owner; stream identity; net kg; article/component subledger; dates; batch; on-site stock; destination; treatment provider and utility coverage; measured emissions if any; missing coverage"
      collection_method: "Weigh each actual stream separately and bind it to source stock. Whole waste mass and composition subledgers cannot both be additional outputs. Exclude true returns and internal movements from waste exports. Document actual transport and treatment once; each actual direct emission requires independent identity, medium and measurement, never a fitted mass-balance residual"
      unit: "kg"
      frequency: "each event and period close"
      temporal_coverage: "same pool as cp_output"
      site_scope: "site waste handling and actual external interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weigh tickets; transfer manifest; destination and treatment evidence; environmental coverage assessment"
  calculation_rules:
    - id: period_normalize
      applies_to: "all inventory rows"
      rule: "q_i = attributable converted raw amount_i / B; B is unique newly first-qualified whole-product net kg from cp_output. finished_wp remains 1 kg. Do not divide an already normalized amount again. Carry opening burdens in and closing burdens out exactly once; retain failed and zero-output loads without assigning them to unrelated output. Unresolved B or burden attribution blocks normalized values."
      inputs:
        - "raw amount_i"
        - B
        - cp_output
        - "matched stock/burden pool"
      output: "q_i per 1 kg reference flow"
      source_ids: []
    - id: product_balance
      applies_to: "received_wp, returned_released_wp, finished_wp, returned_wp, discarded_wp"
      rule: "On the raw-period custody ledger: opening whole-product mass + external receipts including previously released customer returns = closing whole-product mass + physical product dispatch + supplier returns + waste exports + separately supported losses. First release changes stock status, not mass; bridge finished_wp to dispatch using released stock. Include adhering product in the waste composition ledger once. No unknown emission or internal constituent is inferred from a residual."
      inputs:
        - "custody and stock kg"
        - "first-release status"
        - "supported waste/loss kg"
      output: "whole-product reconciliation"
      source_ids: []
    - id: pack_balance
      applies_to: "primary_bag_in, carton_in, pallet_in, primary_bag_out, carton_out, pallet_out"
      rule: "For each article type: S_open + P + N + R = S_close + O + W + L, on the same measured mass basis. O is every outward non-waste destination, W actual discard, L independently evidenced loss; internal moves cancel. Investigate any residual rather than invent L. P, first N and true R are mutually exclusive, regardless of supplier coverage. Return lacking prior same-site article trace cannot be R."
      inputs:
        - "type-specific raw kg"
        - "item IDs"
        - "all stock and movement records"
      output: "physical article reconciliation"
      source_ids: []
    - id: pack_burden
      applies_to: "primary_bag_in, carton_in, pallet_in"
      rule: "For each article cohort and exchange vector: opening carried burden + actual external carried-in remaining burden + verified newly incurred burden = burden attributed to this pool + closing carried burden + burden transferred to another documented pool. External carried-in includes previously incurred, still-unassigned vectors received mid-period with P, first N or R. Record source, timestamp, original cohort, prior assigned share and remaining vector; carried-in and newly incurred entries are mutually exclusive for the same exchange. Use a one-time provenance entry/settlement key across invoice, provider, transport and service records to prevent dual entry. Physical R retains its original cohort; neither all original manufacture nor zero is assumed to return. Supplier-covered vectors link once, not as both carried-in and new burden. Physical R does not add manufacture. Each P and first N needs an independently checked coverage decision. Count actual purchase/transport/service burdens borne by the study once; verify any missing upstream manufacture separately. Unknown supplier coverage remains pending. Verified use/rotation allocation may distribute carried burden but cannot erase physical stock or create assumed reuse."
      inputs:
        - provenance
        - "per-exchange external remaining vectors"
        - "entry/settlement keys"
        - "previous assignment"
        - "coverage decisions"
        - "actual new burdens"
        - "measured use"
        - "stock transfers"
      output: "nonduplicate attributable packaging burden"
      source_ids:
        - eu-pef-2021
    - id: product_burden
      applies_to: "received_wp, returned_released_wp, finished_wp, returned_wp, discarded_wp"
      rule: "For each whole-product lot and environmental exchange: opening carried vector + verified external carried-in remaining vector + newly incurred vector = vector assigned to this reporting pool + closing carried vector + vector transferred to another documented pool. Separate incoming supplier coverage from current site additions with one-time source/entry/settlement keys; the same exchange cannot be both carried-in and new. Prior release status controls B, not whether inherited environmental burden exists. Retain actual remaining burdens on supplier returns, product stock and waste without duplicate treatment/provider coverage. Pair every external transfer with the sending pool and its outward/inward settlement; recognize only the remaining vector, including on a genuine return. No unsupported vector or zero-fill."
      inputs:
        - "lot genealogy"
        - "actual handoff vectors"
        - "opening/closing shares"
        - "once-only keys"
        - cp_product
        - cp_output
        - cp_waste
      output: "whole-product burden reconciliation"
      source_ids: []
    - id: energy_conversion
      applies_to: "electricity"
      rule: "E_MJ = 3.6 × E_kWh after reading the meter delta and multiplier once. Keep original kWh; conversion never validates a supplier flow or changes its native reference property."
      inputs:
        - "electrical meter delta"
        - multiplier
        - "verified energy unit chain"
      output: "compatible metered electrical energy"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "received_wp, finished_wp"
      requirement: "Same whole product, form, actual handoff and first release in both languages; no active UUID substitution or native-classification override."
      evidence: "registration header; study-specific permission and batch genealogy"
    - id: dq_denominator
      applies_to: "all inventory rows"
      requirement: "Same positive B and reporting pool for inventory, protocols and calculations; no output invented from capacity or sales; failures, opening/closing stocks and carried burdens retained."
      evidence: "cp_output; cp_product; period_normalize"
    - id: dq_pack
      applies_to: "primary_bag_in, carton_in, pallet_in"
      requirement: "Reconcile each P/N/R origin and every stock/destination separately from burden coverage; first free receipt is not return or zero burden."
      evidence: "cp_pack; pack_balance; pack_burden"
    - id: dq_complete
      applies_to: "release"
      requirement: "Actual upstream, transport, external qualification, waste treatment, additional utilities and emissions are assessed. Missing evidence is reported as incomplete, not presumed absent."
      evidence: "provider coverage matrix; cp_utilities; cp_waste"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_wp"
    rule: "Require the unique terminal product output linked by reference_flow_link, 1 kg whole net product, matching first-release identity and compatible support/property chain. An unresolved whole-product UUID does not authorize provider substitution."
    source_ids:
      - icama-pd20091282
  - rule_id: validate_release
    applies_to: "release"
    rule: "Verify actual manufacturer, entrusted-site permission where applicable, prior release status, supplier handoff, signed first acceptance/certificate and quantity/batch/quality/date stock bridge. Resale, returns or reinspection do not increase B. Missing records prevent a usable production dataset."
    source_ids:
      - cn-pesticide-regulation-2022
  - rule_id: validate_pack
    applies_to: "primary_bag_in, carton_in, pallet_in"
    rule: "Test each physical balance including first non-purchase receipt regardless of supplier list, same-article return trace, waste/destination split and the independent once-only burden ledger. Missing provider coverage stays explicit."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "all inventory rows"
    rule: "Verify single normalization, no negative/invented residuals, actual environmental coverage, provider boundaries and EN/ZH agreement. Conditional non-applicability needs evidence. No zero-fill for unidentified emissions, packaging, utilities or upstream manufacture."
    source_ids:
      - eu-pef-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A qualified whole-product supply model only after independently verified upstream and foreground completeness"
  allowed_use: "Bounded collection design for received finished formulation, external packaging and first release; eventual procurement modelling only with compatible providers"
  excluded_use: "Complete manufacturing or PEF claim from this gate alone; technical material; already released resale as new production; field use, efficacy and fate; cross-jurisdiction authorization"
  required_metadata: "Registration/holder; actual manufacturer/handoff; net product and batch first release; site/time; specification edition; packaging origins/pools; raw and burden stocks; utilities; transport and provider coverage"
  required_quality_disclosure: "Product and exchange identity gaps; upstream black-box coverage; supplier/packaging uncertainty; conditional applicability; environmental measurements and missing scope; independent review state"
  update_trigger: "Changed registered product/form, release responsibility, supplier/gate/provider, packaging/pool, utilities, standards or jurisdictional applicability"
