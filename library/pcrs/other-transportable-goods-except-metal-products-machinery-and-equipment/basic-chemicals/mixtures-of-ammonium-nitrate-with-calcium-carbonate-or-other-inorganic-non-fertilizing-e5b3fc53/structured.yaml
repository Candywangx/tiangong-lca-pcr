allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_physical: Safe recycle, scrubber recovery and screen fines within the unit are physical loops, not co-products. Preserve pre-allocation physical mass, water, N and inorganic-carbon balances. Never multiply co-product physical outputs or internal transfers by a burden share."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_shared: Separate CAN campaigns, grades and other fertilizer production through measured submetering and process subdivision first. Attribute common electric drives and controls using a documented causal service measure, such as actual operating time with measured loads; report the chosen basis and uncertainty. Do not apply a neighbouring plant's energy quantity."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_coproduct: This baseline has one saleable output and gives no waste or steam credit. Actual exported recovered material or energy requires separate physical identity, recipient and usable-output evidence, then a documented study-specific co-product method. Preserve physical quantities; apply allocation only to eligible shared burdens, ensuring burden shares sum to one. Unresolved co-product scope prevents claiming a complete dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "can_granulation"
      flow_role: "finished_granules"
      record_type: "acceptance and stock ledger"
      raw_fields: "lot; SKU; gross/tare/net mass; product stocks; AN; water; carbonate; conditioning; total N; ammoniacal-N; nitrate-N; size; reject status"
      collection_method: "Calibrated net loadout weighing reconciled to accepted production and finished-stock change; assay representative lot samples"
      unit: "kg"
      frequency: "each lot and period reconciliation"
      temporal_coverage: "representative declared continuous period, normally one full year; justify shorter coverage"
      site_scope: "one site and compatible grade/route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; acceptance; assays; stock reconciliation"
    - protocol_id: cp_feed
      process_id: "can_granulation"
      flow_role: "an_solution, limestone, scrubber_acid, coating_oil"
      record_type: "receipt, dosing and assay records"
      raw_fields: "supplier; lot; delivered and consumed mass; stocks; concentration; moisture; carbonate purity; coating components; temperature; particle size; supplier dataset basis"
      collection_method: "Calibrated weighing/mass flow, certificates and representative independent assay; reconcile withdrawals and storage changes; separately identify each actual ingredient"
      unit: "kg"
      frequency: "receipt and dosing batch"
      temporal_coverage: "same period as cp_product including starts/stops and cleaning"
      site_scope: "supplier interfaces and dosing stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; assay method; sampling coverage; grade/provider compatibility"
    - protocol_id: cp_power
      process_id: "can_granulation"
      flow_role: "electricity"
      record_type: "interval meters"
      raw_fields: "kWh; meter; voltage; supplier; operating states; common-service load; calibration; campaign output"
      collection_method: "Meter stages and controls; reconcile bills and assign common services by measured causal use; retain kWh to MJ conversion"
      unit: "kWh; MJ"
      frequency: "interval and period closure"
      temporal_coverage: "same period as cp_product"
      site_scope: "entire finishing unit and actual auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter logs; bill closure; allocation evidence"
    - protocol_id: cp_heat
      process_id: "can_granulation"
      flow_role: "steam_heat"
      record_type: "utility interface metering and enthalpy records"
      raw_fields: "steam/return mass; absolute/gauge pressure; temperature; dryness; supply/return enthalpy; flash; losses; supplier usable-heat definition"
      collection_method: "Meter matched steam/condensate interfaces; determine phase and enthalpy with a traceable property method; reconcile delivered heat with the provider definition and actual drying duty"
      unit: "kg; kJ/kg; MJ"
      frequency: "matched intervals and campaign closure"
      temporal_coverage: "same period as cp_product"
      site_scope: "upstream utility/foreground indirect exchanger interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; thermodynamic basis; return/loss closure; provider-boundary agreement"
    - protocol_id: cp_water
      process_id: "can_granulation"
      flow_role: "process_water, water_vapour_air"
      record_type: "water meters and process balance"
      raw_fields: "makeup; AN/acid/carrier solution water; cooling circuit; recovered condensate; inlet-air humidity; retained moisture; wastewater; stocks/WIP; actual net reaction-water formation/consumption; stage assays and independently supported reaction-extent/model evidence; uncertainty"
      collection_method: "Meter purchased makeup and sample moisture; measure or independently validate net process evaporation. Establish actual net reaction-water terms through the reaction evidence in physical_balances before reconciling water destinations; do not fit them to a closure residual. Keep closed heat-carrier water, carrier solution water and phase transfers separate, with stock/WIP uncertainty."
      unit: "kg"
      frequency: "batch/interval and period closure"
      temporal_coverage: "same period as cp_product"
      site_scope: "process water and cooling makeup, without recirculation double count"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; moisture/chemical methods; independent reaction-extent evidence; water ledger and uncertainty"
    - protocol_id: cp_air
      process_id: "can_granulation"
      flow_role: "ammonia_air, nitric_acid_air, an_condensable_air"
      record_type: "stack/fugitive sampling and outlet-time records"
      raw_fields: "outlet; wet/dry gas flow; T/P; moisture; load; operating hours; NH3; acid phase; nitrate/ammonium assay; filterable/condensable split; blanks; method; limit of quantification"
      collection_method: "Source-specific representative sampling after actual abatement; follow EFMA wet/dry sample conditioning; establish molecular basis and integrated concentration-times-flow; chemically verify any separate AN condensable fraction"
      unit: "mg/m3; m3/h; h; kg"
      frequency: "repeated representative load/start/stop campaigns and period integration"
      temporal_coverage: "same period as cp_product, record measured and extrapolated intervals"
      site_scope: "all actual outdoor-air outlets and assessed fugitives"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test reports; blank/artifact correction; speciation; gas-basis consistency; extrapolation uncertainty"
    - protocol_id: cp_pm
      process_id: "can_granulation"
      flow_role: "pm25_air, pm25_10_air, pm_over10_air"
      record_type: "particle sampling and source register"
      raw_fields: "outlet; dust source; aerodynamic cuts; total filterable PM; cumulative PM10/PM2.5; condensables; water droplets; gas T/P/flow; hours; blanks; uncertainty"
      collection_method: "Compatible isokinetic source sampling; EPA 201A addresses filterable size fractions only under its scope. Water-droplet exhaust cannot use its size split; establish a validated suitable method. Method 5 total mass alone does not establish all three fractions. Quantify condensable coverage separately without assumed partition"
      unit: "kg; mg/m3; m3/h; h"
      frequency: "representative campaigns and whenever route/control changes"
      temporal_coverage: "same period as cp_product with disclosed unmeasured source intervals"
      site_scope: "filler handling/milling, granulator, actual dryer, screens, cooler, loadout and relevant fugitives"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling validation; moisture/phase check; matched cumulative results; repeat tests; completeness statement"
    - protocol_id: cp_waste
      process_id: "can_granulation"
      flow_role: "waste_offspec, waste_liquor, waste_sludge"
      record_type: "receiver manifests, meters and analyses"
      raw_fields: "waste source; wet/dry mass; liquid volume/density; AN/N/carbonate/water; pH; oil contamination; receiver; treatment; transport; returned stocks"
      collection_method: "Weigh each separately transferred waste; for liquid use measured volume and density; assay representative composition; reconcile internal recycling and prevent liquid/sludge overlap"
      unit: "kg"
      frequency: "each transfer and period closure"
      temporal_coverage: "same period as cp_product including cleaning/purges"
      site_scope: "factory-to-external-treatment interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated measurement; receiver proof; analyses; compatible treatment provider"
    - protocol_id: cp_maintenance
      process_id: "can_granulation"
      flow_role: "lubricant, waste_oil"
      record_type: "maintenance purchase/use/removal ledger"
      raw_fields: "grade; chemistry; quantity; installed stock; retained oil; spent mass; contamination; receiver; treatment; machine allocation"
      collection_method: "Weigh actual consumed and collected oil, reconcile equipment inventory and records; assign shared maintenance to actual service; separate lubricant from product coating"
      unit: "kg"
      frequency: "maintenance event and period closure"
      temporal_coverage: "same period as cp_product"
      site_scope: "equipment serving the unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "service records; chemistry/SDS; mass reconciliation; receiver evidence"
    - protocol_id: cp_carbon
      process_id: "can_granulation"
      flow_role: "carbonate_co2_air"
      record_type: "carbonate assays, carbon balance and gas testing"
      raw_fields: "inorganic-carbon feed; product carbonate; stocks; sludge/liquid/solid carbonate; gas CO2; origin; reaction evidence; uncertainty"
      collection_method: "Combine representative inorganic-carbon analyses with independent actual gas evidence; investigate any residual before attributing it to emitted CO2; distinguish organic/coating carbon and mineral carbonate"
      unit: "kg C; kg CO2"
      frequency: "batch/campaign and period closure"
      temporal_coverage: "same period as cp_product"
      site_scope: "carbonate paths within the finishing unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "assays; carbon closure; gas confirmation; origin and characterization convention"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each non-reference external exchange, q_i = Q_i / P exactly once. Q_i is the raw attributable stock-corrected period quantity, after any unit conversion but before per-product division. All protocols and intermediate calculations retain raw totals for one complete matched site/route/grade/state pool, including failed/zero-output runs, rework, starts/stops, cleaning and opening/closing WIP with its burdens. P is that pool's accepted net supplied product kg, reconciled to production, dispatch, stocks and returns; prior-period stock requires matched prior burdens or exclusion from P. Count a returned/reaccepted net lot only once; internal rework is not additional accepted output or a new external exchange. Zero-output intervals retain their burdens in a justified positive-P pool; if no positive matched P exists, report per-kg results unavailable, not zero or division by zero. The aggregation basis is the final inventory basis; do not divide an already normalized result again. Keep finished_granules exactly1kg and physical output quantities independent of burden allocation."
      inputs:
        - Q_i
        - P
        - "linked collection protocol"
      output: "q_i in the native row unit per kg reference flow; unavailable if no positive matched P exists"
      source_ids: []
    - id: solution_components
      applies_to: "an_solution, scrubber_acid"
      rule: "active mass = received solution mass × measured active mass fraction; carrier water = solution mass × measured water fraction. Retain total supplied mass for a total-solution provider; these are composition subledgers, not duplicate supply rows."
      inputs:
        - "solution mass"
        - assay
        - cp_feed
      output: "active and carrier-water subledgers"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Raw period electrical energy in MJ = recorded kWh ×3.6. Retain the attributable raw period total; apply normalize_period once afterward, without dividing here."
      inputs:
        - kWh
        - cp_power
      output: "raw attributable period MJ before normalize_period"
      source_ids:
        - efma-an-can-2000
    - id: delivered_heat
      applies_to: "steam_heat"
      rule: "Raw period interface heat in MJ = (sum incoming steam mass × incoming enthalpy - sum actual outgoing condensate/flash mass × outgoing enthalpy - separately measured interface losses) /1000 for kg and kJ/kg. Match the provider boundary and avoid subtracting losses twice. No unmeasured heat term is assumed. Retain the raw attributable period MJ, then apply normalize_period once; do not divide here."
      inputs:
        - "interface masses"
        - enthalpies
        - losses
        - cp_heat
      output: "raw attributable period net MJ before normalize_period"
      source_ids: []
    - id: emission_integration
      applies_to: "ammonia_air, nitric_acid_air, an_condensable_air, pm25_air, pm25_10_air, pm_over10_air"
      rule: "Raw period emitted mass in kg = sum of compatible concentration in mg/m3 × outlet volume flow rate in m3/h × actual interval operating h /1000000; use consistent wet/dry and T/P bases and separate fugitives. Preserve this correct rate-times-duration calculation and disclose extrapolation/censored values. Retain raw period species/fraction loads and apply normalize_period once afterward; do not divide by P here."
      inputs:
        - sampling
        - "outlet flow"
        - hours
        - cp_air
        - cp_pm
      output: "raw period species or fraction kg before normalize_period"
      source_ids:
        - efma-an-can-2000
    - id: particle_partition
      applies_to: "pm25_air, pm25_10_air, pm_over10_air"
      rule: "fine = measured filterable PM2.5; coarse = compatible filterable PM10 - PM2.5; large = compatible total filterable PM - PM10. Reject negative/incompatible differences; cumulative totals are not additive exchanges. Keep chemically identified condensable AN and acid phase disjoint."
      inputs:
        - "matched particle tests"
        - cp_pm
      output: "disjoint fraction masses"
      source_ids:
        - epa-pm-201a-2020
    - id: physical_balances
      applies_to: "all inventory rows"
      rule: "On the unallocated physical ledger, conserve total material mass and relevant elements, including N, carbon and H/O: external inputs plus opening stocks equal external outputs plus closing stocks, with residual uncertainty. For molecular water, AN, carbonate, acid and other reactive components separately record inputs + opening stocks + actual formation = outputs + closing stocks + actual consumption. Establish actual reaction occurrence and net extents independently from stage assays, a supported chemical model and measured gas/species evidence; include any actual carbonate/acid/free-ammonia reactions without assuming they occur or fully convert. Do not infer reaction water or dry-component changes from the residual needed to close water/dry-mass accounts. Retain independent CO2 gas confirmation under cp_carbon, measured moisture/carrier water, phase transfers and equal internal links; never invent emission, yield or correction flows."
      inputs:
        - cp_product
        - cp_feed
        - cp_water
        - cp_air
        - cp_pm
        - cp_waste
        - cp_maintenance
        - cp_carbon
      output: "unallocated conserved mass/element and reactive-species ledgers, independent evidence and residual uncertainty"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all exchanges"
      requirement: "Exact material/mixture state, chemistry/CAS and any hard route limitations must match; broad identity never proves provider quantity compatibility. Blank UUIDs prevent automatic linkage but never justify omitted exchange amounts."
      evidence: "raw flow record; actual supplier/SDS/assay; receiver"
    - id: period
      applies_to: "all inventory rows"
      requirement: "Same declared site, grade, route and period; record seasonal loads, starts/stops, cleaning, stock changes and any extrapolation. Avoid silent averaging of different recipes."
      evidence: "synchronized logs and uncertainty"
    - id: sampling
      applies_to: "air and material assays"
      requirement: "Choose validated methods for actual matrix, gas moisture and phases; retain calibration, blanks, repeat tests, quantification limits and measured versus inferred intervals. No literature performance default."
      evidence: "eu-lvic-aaf-2007; efma-an-can-2000; epa-pm-201a-2020; actual reports"
    - id: completeness
      applies_to: "foreground package"
      requirement: "Include each actual externally purchased conditioning material, separately acquired onsite ingredient and maintenance/control consumable as its own exchange; retain constituents of a whole purchased formulation in composition subledgers without duplicate procurement. Prove non-occurrence and retain unknown heat/waste/emission identity, provider basis and particle-partition gaps explicitly until resolved."
      evidence: "ingredient/service register; flow and provider checks"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validate_identity: Verify carbonate-mixture identity, one finished_granules reference output, natural limestone and declared granulation route. Reject calcium-nitrate double salts, straight AN and substitute filler routes [un-cpc3-2025; yara-mineral-fertilizers]."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validate_basis: All inventory rows and linked aggregation use per 1 kg accepted net supplied reference flow. Check product water/additives, AN solution/acid composition, nutrient fractions, utility provider definitions and measured heat balance; no empirical default is imposed."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validate_balance: Inspect the unallocated physical and internal-transfer ledgers before burden allocation. Require documented residual uncertainty and equal internal transfers; do not mechanically scale physical co-product mass by an allocation share."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validate_emissions: Require correct species, outdoor-air subcompartment, phase and disjoint particles. Wet-stack limitations and condensable uncertainty remain explicit; a test reporting only total PM cannot establish resolved size fractions [efma-an-can-2000; epa-pm-201a-2020]."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "validate_linkage: Resolve applicable blank identities and compatible background/receiver datasets before declaring a complete LCI. Actual additional ingredients, fuel, waste or emissions need individual evidence-backed rows. Unknown data are not zero; preserve biogenic CO2 separately if an actual added biogenic ingredient emits it."
    source_ids: []
published_dataset_profile:
  dataset_role: "Declared-site limestone CAN granulation manufacturing dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible carbonate-filled bulk CAN manufacturing supply with matching recipe, route, utility and provider bases"
  excluded_use: "Fertilizer application equivalence; calcium nitrate double salts; generic CPC 34615 coverage; prilling; other filler routes; unverified solution or heat basis"
  required_metadata: "Site and period; SKU/grade; actual recipe and water; AN solution supplier interface; natural limestone grade/milling; N forms; granulation/drying/cooling/conditioning; utilities; emission controls; waste receivers; allocation"
  required_quality_disclosure: "Measured and extrapolated coverage; unresolved identities/providers; particle/condensable uncertainty; balance residuals; exclusions; study-specific allocation; no generic quantity defaults"
  update_trigger: "Recipe, moisture, filler/AN supplier, technology, utilities, controls, treatment, sampling or provider-basis change"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF p.165; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Distinguish 34613 AN, 34614 nitrate double salts, 34615 carbonate mixtures and 34616 UAN; classification only"
  - id: "eu-lvic-aaf-2007"
    type: "official_guidance"
    reference: "European Commission, LVIC-AAF BREF, August 2007, §§9.2.2–9.2.7 and 9.4.6, printed pp.365,367–369,383 / PDF pp.393,395–397,411; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic_aaf.pdf"
    used_for: "AN solution upstream interface; carbonate mixing/granulation, actual drying/cooling/conditioning and controls; plant quantities and emission limits are not defaults"
  - id: "efma-an-can-2000"
    type: "handbook"
    reference: "EFMA, BAT Booklet 6, Production of Ammonium Nitrate and Calcium Ammonium Nitrate, 2000, §§2.3–2.6 Appendix 1 and Units, printed pp.13–15,29–31 / PDF pp.15–17,31–33; https://www.fertilizerseurope.com/wp-content/uploads/2019/08/Booklet_6_final.pdf"
    used_for: "Finishing/recycle/conditioning, electricity unit conversion and AN/CAN gas measurement; no universal recipe, safe operating specification or emission factor"
  - id: "yara-mineral-fertilizers"
    type: "handbook"
    reference: "Yara Guide to Mineral Fertilizers, glossary printed p.26 / PDF p.27 ; https://www.yara.co.uk/siteassets/crop-nutrition/media/uk/uk-agronomy/yara-guide-to-mineral-fertilizers.pdf/"
    used_for: "Producer carbonate CAN identity distinct from calcium nitrate; commercial nutrient figures are examples"
  - id: "nynas-fertilizer-coatings"
    type: "handbook"
    reference: "Nynas, Fertile formulations, main article and Coatings Checklist; https://www.nynas.com/en/products/process-oils/knowledge-tank/fertile-formulations/"
    used_for: "Neat or formulated mineral-oil conditioning; separate actual constituents; NPK laboratory reductions are excluded as CAN defaults"
  - id: "epa-pm-201a-2020"
    type: "official_guidance"
    reference: "US EPA, Method 201A, October 7 2020, §§1–2, PDF pp.1–2; https://www.epa.gov/sites/default/files/2019-08/documents/method_201a_0.pdf"
    used_for: "Filterable size fractions, droplet limitations and distinct condensable scope; use the actual validated site method, no emission factors"
