review_metadata:
  scientific_review: "pending_independent_review"
  classification_decision: "proposed_narrower_34615_limestone_CAN_granulation_only"
  scope_disclosure: "Received concentrated AN solution, ground natural limestone, granulation and bulk delivery. No nitrate double salt, prilling, dolomite-dominant filler or integrated nitrophosphate co-production."
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  unresolved:
    - row_id: "steam_heat"
      issue: "Exact net steam-heat-service UUID and provider usable-enthalpy basis unresolved. Candidate heat rows have specific unrelated paper/rendering routes, wrong properties or hard pressure limits."
    - row_id: "scrubber_acid"
      issue: "Actual aqueous HNO3 grade is a collection requirement; retrieved 40/50/60 percent records cannot supply a default concentration. Keep specific blank solution UUID."
    - row_id: "waste_offspec"
      issue: "No exact non-recycled limestone CAN waste identity in bounded successful search; actual composition, receiver and treatment must be collected."
    - row_id: "waste_liquor"
      issue: "No exact AN-bearing scrubber purge identity in bounded successful search. Molecular nitrogen-index flows and manganese washing wastewater are incompatible."
    - row_id: "waste_sludge"
      issue: "Exact carbonate-bearing scrubber settlement sludge identity and actual moisture/composition/receiver unresolved; generic biological or paper sludge is not substituted."
    - row_id: "carbonate_co2_air"
      issue: "Exact non-biogenic mineral-carbon air identity/characterization convention unresolved. Actual occurrence requires independent gas confirmation, no full-limestone-decomposition default."
  provider_basis_requirements:
    - "Broad AN UUID is a physical identity only; actual received solution concentration/carrier water, supplier route and background reference quantity must match before dataset linkage."
    - "Broad limestone UUID has composition and grade unspecified; actual natural limestone assay, moisture, particle size, extraction/milling and supplier must be verified."
    - "Electricity UUID 3d76981f-964a-4865-b588-0e067a2a1163 has native locationOfSupply CN (China), grid-average user-side 1-35 kV and NCV reference property in MJ. Verify the actual CN supply interface, voltage, provider/reference period and measured electrical basis. Non-CN supply requires a separately verified matching electricity flow and provider before linkage."
    - "Mineral oil CAS 8012-95-1 applies to actually procured neat oil or a separately acquired onsite blending ingredient. A whole purchased coating requires its qualified whole commercial input and formulation-production burdens; constituents remain composition subledgers, not duplicate external purchases."
    - "Lubricant UUID is petroleum-fraction oil on Mass/kg, not fully synthetic or solvent/wax coating. Its metadata heating value is not a PCR quantity."
    - "Waste oil UUID identifies spent contaminated lubricant mass; actual contaminants, receiver/treatment and background remain required."
  rejected_metadata:
    - "Limestone powder a3317ee0-aae8-4d22-b720-fe24bc73d3c4 has CAS 587-26-8 contrary to carbonate mineral identity and hard 200-600 mesh metadata. Not adopted."
  source_limitations:
    - "BREF 2007 and EFMA 2000 describe method scope; historical plant energy and emission values are not defaults or current performance claims."
    - "Yara commercial nutrient figures are product examples. Nynas NPK laboratory reductions and particular oil test properties are not CAN recipe or emission factors."
    - "EPA 201A excludes droplet-laden exhaust for size partition and addresses filterable particles; wet-stack and condensable protocols need actual validated measurements."
  dataset_completeness_debts:
    - "Future actual SKU, recipe/assays, quantities, heat basis, particle partition, condensable speciation, waste receiver and compatible background datasets must be collected; no complete foreground dataset is asserted."
    - "Any actual additionally purchased wax, amine, carrier, control medium, fuel, consumable or external emission requires its own atomic evidence-backed exchange. Constituents inside a whole purchased formulation remain composition subledgers rather than duplicate external component inputs."
