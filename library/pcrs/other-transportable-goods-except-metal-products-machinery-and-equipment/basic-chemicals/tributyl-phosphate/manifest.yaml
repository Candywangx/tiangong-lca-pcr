review_metadata:
  scientific_review: "pending"
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  semantic_boundary:
    decision: "new_semantic_candidate"
    rationale: "CPC34180 is unmapped and combines incompatible ester/salt/derivative families; the broad retained scaffold remains an existing legacy alias locator. New single-species TBP manufacturing method is narrower. Local seed, main material manifests, controller queue and shared material originals checked; no duplicate complete TBP manufacturing method identified. Phosphoric acid, phosphate mineral/fertilizer, additive preparation and organophosphorus extractant application are different product/foreground gates."
  public_identity_metadata_review:
    - row_id: "phosphorus_oxychloride"
      issue: "Public name/CAS10025-87-3 and preparation route identify POCl3; CPC34240 salt classification conflicts with that chemistry. Identity is conditional on actual supplier assay; the classification defect is retained for source clarification, not interpreted as a phosphate-salt feed."
    - row_id: "butanol_fermentation"
      issue: "Native full name explicitly requires fermentation and purity>99.5%, while general commentary describes typical oxo production and classification is CPC35499. The actual supplier must confirm the explicit selected fermentation/grade; generic commentary cannot relabel an oxo lot or establish biogenic carbon share."
    - row_id: "sludge"
      issue: "Native Waste flow and general comment include water/wastewater sludge; route text says water treatment chemical and classification is sewage sludge. Treat only as conditional physical sludge identity, not a purchased treatment reagent or proof of chemical composition/receiver compatibility; source wording needs clarification."
    - row_id: "sludge_bio"
      issue: "The same conditional broad sludge identity does not establish biomass origin, moisture or treatment and must represent a separate actually collected stream; source route/classification limitations remain as for sludge."
    - row_id: "finished_tbp"
      issue: "Public state100 record names Tributyl phosphate, CAS126-73-8 and n-butanol ester in its comment, without contrary manufacturing route, but carries isolated CPC34231 classification. Physical identity adopted conditionally; source classification defect requires source/producer clarification. No claim that all metadata is verified."
    - row_id: "effluent_offsite"
      issue: "Record physical name/comment describe high-salinity organic/NaCl aqueous waste, while source classification says waste organic solvents. Conditional physical identity only for actual high-salinity stream; clarify source classification and receiver scope; its bioenergy wording does not prove biogenic chemical carbon."
  unresolved_flow_identities:
    - row_id: "butanol_oxo"
      selected_flow: "Oxo-route n-butanol"
      reason: "Use only actual oxo-route n-butanol receipts; determine assay, water and fossil/biogenic carbon provenance. The available fermentation-restricted identity is excluded from this row."
    - row_id: "naoh_other_solution"
      selected_flow: "Sodium hydroxide solution"
      reason: "Alternative to the nominal 30% identity for actual other solution grades; collect supplier concentration, solution mass, active NaOH and carrier water. No known grade is silently relabelled."
    - row_id: "hdpe_drum"
      selected_flow: "Empty HDPE drum"
      reason: "Conditional packaged delivery; weigh the purchased complete drum SKU with its supplied closure, exclude product contents, and retain reuse cycles/cleaning records. Resin and generic packing are not the converted drum. Bulk delivery records absence."
    - row_id: "recovered_butanol"
      selected_flow: "Recovered n-butanol distillate"
      reason: "Only an actual externally delivered, accepted recovered distillate with measured water/HCl/xylene and buyer specification. Internal recycle is recorded in the stage ledger, not another exchange. The fermentation/purity-restricted feed identity is not suitable."
    - row_id: "distillation_bottoms"
      selected_flow: "TBP distillation bottoms"
      reason: "One sampled organic residue stream from TBP purification; measure TBP, acid phosphate species, water and other organics, classification, receiver and treatment. Isobutyl-acetate residue and phosphorous-acid waste are rejected identities."
    - row_id: "contaminated_drum"
      selected_flow: "Contaminated discarded HDPE drum"
      reason: "Conditional failed/retired plant drum; weigh polymer and retained chemical separately in the physical ledger and identify receiver. Do not assume hazardous-waste incineration or link virgin polymer resin."
    - row_id: "monobutyl_water"
      selected_flow: "Butyl dihydrogen phosphate to fresh water"
      reason: "Only when analytical speciation confirms this particular monoester in final discharge. Inorganic sodium/calcium phosphates and an unspecified butyl-phosphate record are not substitutes. Quantify its phosphorus separately."
    - row_id: "tap_water"
      selected_flow: "Treated tap water"
      reason: "Actual supplied water is retained in m3; the previously selected native supply is explicitly Hong Kong. No actual site/supplier evidence establishes that restriction. Match actual geography, treatment, provider and volume-reference basis before assigning a UUID."
    - row_id: "returned_tbp"
      selected_flow: "Returned unformulated TBP liquid"
      reason: "Preserve actual external returns with whole returned mass, composition, contamination, original lot and upstream treatment. Generic finished-product identity does not establish returned grade or contamination; internal rejects/rework are separate equal-quantity stage links and repeat acceptance is excluded from Q."
  quantity_background_compatibility_pending:
    - row_id: "nitrogen_input"
      issue: "Gaseous N2 plant inerting/headspace identity has verified primary Mass1.0/kg. Bottling-use language does not prove exclusive manufacture/grade. Actual air-separation supplier origin, phase/grade, gross fresh external mass, stage links, vent/retention and provider convention are required; no make-up/vent fraction or density follows from native text."
    - row_id: "sodium_hydroxide"
      issue: "Explicit nominal30% solution-mass identity is used only for actual matching receipts. Actual NaOH assay, carrier water, residual constituents and provider whole-solution convention must be collected; no default dose or water fraction."
    - row_id: "electricity"
      issue: "Native identity restricts China CN, grid-average medium-voltage1–35kV user supply. Actual site/geography, provider mix and voltage must match; another supply needs a separately verified identity."
    - row_id: "steam"
      issue: "Only verified physical identity at0.45MPaG; actual temperature/dryness/enthalpy/feedwater/condensate and provider convention must be collected before linkage."
    - row_id: "natural_gas"
      issue: "Volume/m3 identity verified, but actual T/P, dry/wet composition, Z and provider volume basis required."
    - row_id: "nox_air"
      issue: "Mass/kg does not prove NO2-equivalent; monitor/LCI/LCIA basis compatibility must be confirmed."
    - row_id: "total_p_water"
      issue: "Measured totalP must be reconciled to named P species and residual composition; no double-counting or unreviewed residual LCIA linkage."
  evidence_limitations:
    - "No actual site inventory amounts, recipe, yield, energy or emission factor is supplied by this PCR. Required future collection protocols do not assert that such measurements already exist."
    - "WHO1991 and US3079419A1963 support chemical identity and route existence only; patent example conditions, solvent ratio and yield are not transferable defaults."
    - "Sector BREF principles constrain monitoring/boundary records; BAT levels and case plants are not TBP amount defaults or a current site legal compliance conclusion."
    - "ILCD2010 supports composition/element/energy quality checks and attributional allocation principles with their modelling-context conditions; no site allocation share, empirical TBP quantity or physical closure tolerance is established."
    - "Adopted flow identities require complete public state100 records, actual query membership and native reference-property/unit-group evidence. Identity does not establish factory quantities, exclusive manufacturing from intended use, provider completeness or current site compatibility."
    - "Shared catalog/material and coverage indexes must be rebuilt by serial controller integration; author does not mutate them."
