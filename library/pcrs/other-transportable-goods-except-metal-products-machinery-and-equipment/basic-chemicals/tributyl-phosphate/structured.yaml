    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep supplied chemical/solution mass, measured active mass and embedded water separate in the physical ledger. Product active TBP = product net mass times measured mass fraction; do not substitute this active mass for Q."
  - id: utility_basis
    applies_to: "steam, natural_gas, nitrogen_input, tap_water, electricity"
    required_property_ref:
      name: "Native verified reference property"
      uuid: ""
    required_unit: "native unit"
    rule: "Preserve each native unit/property. Match meter, phase/grade and provider reference basis; conversions require traceable density, gas T/P/composition/Z or steam enthalpy with condensate basis. Unknown compatibility stays pending."
