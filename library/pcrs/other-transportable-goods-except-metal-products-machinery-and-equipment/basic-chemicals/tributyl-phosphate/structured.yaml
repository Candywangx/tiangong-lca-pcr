published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after actual data completion and review"
  downstream_use: "Factory-gate upstream TBP input with matched unformulated grade, route, assay and quantity basis"
  allowed_use: "Documented POCl3/n-butanol direct-esterification TBP manufacture; declared site/period/grade and compatible utility/receiver scenarios"
  excluded_use: "Formulated product inventories; extraction service; pure-active-mass substitution without conversion; other esters/salts or incompatible routes; default recipe/yield/energy/emissions"
  required_metadata: "Product/reference qualifiers; supplier/receiver/provider links; foreground starting condition; complete stage flow sheet; site/period; grade/assay; Q; stocks/loops; total-mass/C/H/O/N/P/Cl/Na stocks and separate molecular-water/energy balances; allocation; method/version"
  required_quality_disclosure: "Measurement and analytical method/uncertainty; data coverage; open UUID/provider/quantity bases; actual cut-offs; fossil/biogenic origin; alternative/conditional rows; review scope"
  update_trigger: "Changed SKU/assay/feed source/route, utilities/pressure/provider, purification/neutralisation, abatement/receiver, co-product status, measured performance or new verified identities/evidence"
data_sources:
  - id: "who-tbp-1991"
    type: "official_guidance"
    reference: "WHO/IPCS Environmental Health Criteria112, Tributyl phosphate, 1991, sections2.1,2.4,3.1. https://www.inchem.org/documents/ehc/ehc/ehc112.htm"
    used_for: "Species and conventional feed route; analytical method/blank considerations. Historical compilation; no present recipe, survey, purity/yield/density/dose default."
  - id: "lanxess-tbp-product"
    type: "literature"
    reference: "LANXESS Tributyl phosphate product information; CAS126-73-8, formula C12H27O4P, product identity. https://lanxess.com/en/products/products/t/tributyl-phosphate"
    used_for: "Producer corroboration of commercial species identity only; protected SDS/TDS not acquired and no grade purity or delivery solvent default is claimed."
  - id: "stauffer-trialkyl-1963"
    type: "literature"
    reference: "Stauffer Chemical Co., US3079419A, Process for the manufacture of trialkyl phosphates, 1963-02-26; figure1, description, example3 and claim8 (PDF1–3). https://patents.google.com/patent/US3079419A/en"
    used_for: "Original historical POCl3/alcohol/HCl and xylene recovery configuration. Case quantities, temperatures, ratios, apparatus and yields are not modern industry defaults."
  - id: "jrc-ofc-2006"
    type: "official_guidance"
    reference: "European Commission, Organic Fine Chemicals BREF, August2006; sections5.1.2.1,5.1.2.5,5.2.1/Table5.1, printed375/378/380–381, PDF405/408/410–411. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/ofc_bref_0806.pdf"
    used_for: "Chemical-sector recovery, salt-containing wash streams, physical balances and operation-resolved emissions; no TBP recipe or factor. Applicability of techniques varies by scale/configuration."
  - id: "jrc-cww-2016"
    type: "official_guidance"
    reference: "European Commission, CWW BREF,2016; BAT2–5, printed543–544, PDF573–574. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/CWW_Bref_2016_published.pdf"
    used_for: "Chemical reaction/stream inventories, salt/P/specific-organic characterisation and matched monitoring at treatment/final outlets; qualifiers and footnotes retained; no quantity default or current site compliance claim."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, first edition 2010; sections7.4.2 (printed197/205; PDF217/225) and7.9.2–7.9.3 (printed255–264; PDF275–284). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Primary attributional-method guidance for composition/element/energy checks, subdivision and physical-causality then economic allocation; applied only after identifying actual co-functions and declaring the LCI modelling context. No TBP amount, default share, recipe or quantitative closure tolerance."
