  classification_refs: "CPC3.0:34180; proposed narrower scope, acceptance by controller"
  covered_products: "Unformulated technical-grade tri-n-butyl phosphate from POCl3 and n-butanol"
  excluded_products: "Salts, other ester species, formulated preparations and incompatible feed/recovery routes as defined in section1"
  representative_product: "Accepted liquid TBP CAS126-73-8 with measured assay/water/impurities; no assumed purity"
  production_route: "POCl3 direct esterification with n-butanol; actual HCl separation, alcohol/solvent recovery, purification, finishing and abatement"
  market_state: "Liquid chemical at factory gate, bulk or measured complete HDPE-drum delivery; downstream use outside boundary"
functional_unit:
  what: "Supply unformulated technical-grade liquid TBP of the declared lot specification"
  how_much: "1 kg reference flow"
  how_well: "Actual lot acceptance for TBP identity, assay, residual water/alcohol/solvent, acid value and customer specification"
  how_long_or_cycle: "Factory-gate supply; declared campaign/production period, with storage losses measured"
  reference_flow_link: "finished_tbp"
system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "tbp_manufacture"
      rule: "Retain receipt, reaction, actual HCl recovery, neutralisation/washing, phase separation, alcohol/xylene recovery, purification, storage/filling, cooling/vacuum and waste/gas/water treatment in the process record. Record the actual order and measured stage flows; no historical recipe/temperature/yield is imposed."
      source_ids:
        - stauffer-trialkyl-1963
        - jrc-ofc-2006
    - rule_id: boundary_loops
      applies_to: "all stage links"
      rule: "Keep unallocated total mass, C/H/O/N/P/Cl/Na elemental stocks and a separate molecular-water stage ledger. Each internal transfer has identical sending/receiving mass and composition; count external make-up, bleed and losses once."
      source_ids:
        - jrc-ofc-2006
        - jrc-cww-2016
    - rule_id: boundary_treatment
      applies_to: "all emissions and wastes"
      rule: "Separate recovered product, off-site waste and direct residual release. A liquor sent off-site carries its measured waste composition and receiver treatment burdens, not an immediate freshwater elementary release. Include plant boiler/oxidiser/biological-treatment emissions when present, without duplicating purchased utility generation."
      source_ids:
        - jrc-ofc-2006
        - jrc-cww-2016
    - rule_id: boundary_completeness
      applies_to: "all inventory rows"
      rule: "The cards are an atomic baseline, not permission to omit actual exchanges. Extend the dataset with a separately named, measured and verified row for every additional actual auxiliary, coolant/refrigerant, packaging component, salt, organic species, waste, emission or destination; an unresolved identity is not zero. Document absence and cut-offs with measured relevance."
      source_ids:
        - jrc-cww-2016
boundary_abstraction:
  declared_starting_condition: "Traceable delivered POCl3/n-butanol/actual auxiliaries and utilities at plant receipt, with opening inventories and supplier origins/assays recorded"
  starting_condition_role: "Foreground collection starts at received chemicals; their production/transport remain linked upstream burdens"
  product_classification_scope: "TBP subset of CPC34180 only; no applicability by source database classification or similar phosphate names"
  recursive_input_rule: "Same-category purchased TBP or externally reprocessed returns require explicit supplier identity/state and nonzero upstream dataset; internal recycle remains an equal-quantity stage link, not a new reference output"
  upstream_dataset_requirement: "Every external product/waste/service interface needs a compatible supplier/receiver dataset and quantity basis; record open linkage when unavailable"
  disclosure: "Disclose actual chemistry, utilities, abatement, starting stocks, campaign coverage, formula/assay, loops, receivers, allocation, exclusions and gaps"
