    required_unit: "kg"
    rule: "Use 1 kg accepted net as-supplied unformulated TBP, excluding packaging. Q is the measured accepted net product mass of the same campaign, collected by cp_product; assay is a qualifier, not a change of denominator. Q includes the accepted residual water, alcohol, solvent and other measured constituents; count each accepted factory-gate production lot once, reconcile dispatches and finished stocks, and exclude repeated internal reacceptance of the same returned material."
