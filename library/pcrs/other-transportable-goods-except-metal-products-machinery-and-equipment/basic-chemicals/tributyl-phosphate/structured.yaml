allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Declare the study goal and attributional modelling context before using the following shared-burden rules. System expansion/substitution requires a separately justified scenario consistent with the study goal; it is not interchangeable with allocation or an automatic recovered-product credit (jrc-ilcd-2010)."
    source_ids: []
  - rule_id: allocation_subdivide
    applies_to: "environmental burdens"
    rule: "Avoid shared-burden allocation through measured stage subdivision where feasible; retain separate common utilities and treatment records. Identify actual independently accepted HCl/recovered alcohol co-products before any allocation."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_basis
    applies_to: "remaining shared burdens"
    rule: "Use a documented physical causal relationship where supported; otherwise declare a justified alternative such as contemporaneous net-sales economic shares with source, period and sensitivity. Do not apply a fixed default share or assume every byproduct sale."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_physical
    applies_to: "all physical outputs"
    rule: "Allocation changes attributed burdens, never measured product, co-product, waste or emission quantities in the unallocated process/total-mass/C/H/O/N/P/Cl/Na/water ledger. Keep physical and attributed-burden accounts separately reconciled. Avoid crediting internal recycle or waste twice; any substitution must disclose its expanded-system basis and remain an explicit separate scenario."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "tbp_manufacture"
      flow_role: "reference output and accepted co-products"
      record_type: "acceptance and weighing records"
      raw_fields: "lot/SKU; route; tare/gross/net mass; accepted TBP Q; assay method; water; n-butanol/xylene; acidity; rejection/return stocks; HCl/co-product mass and assay; buyer"
      collection_method: "Use calibrated tank/scale receipts and lot acceptance; quantify TBP and residual organic species with a validated matrix-specific GC method and water/acidity tests. WHO environmental GC methods inform analyte identity/blank control, not a product purity limit. Aggregation detail: Sum whole accepted commercial net TBP Q without packaging, including measured allowed residual constituents; count production acceptance once and reconcile dispatch/finished stocks/returns; record co-product masses unallocated; normalize exchanges per 1 kg reference flow"
      unit: "kg"
      frequency: "every lot and each dispatch"
      temporal_coverage: "complete declared campaign with representative starts/stops"
      site_scope: "same site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; lab validation/blanks/recovery; buyer acceptance"
    - protocol_id: cp_material
      process_id: "tbp_manufacture"
      flow_role: "atomic external feed and packaging"
      record_type: "receipt, assay and stock records"
      raw_fields: "supplier/grade/CAS; source route/carbon origin; solution mass; active assay; water; solvent/isomers; inventory changes; drum SKU/net mass; returns"
      collection_method: "Weigh each actual material lot and reconcile opening/closing tanks; use supplier certificates verified by site sampling where material; retain supplied solution and active/carrier ledgers separately. Aggregation detail: External charged amount corrected for stocks/returns per 1 kg reference flow; internal circulation separately logged"
      unit: "kg"
      frequency: "each receipt/charge and stock reconciliation"
      temporal_coverage: "same campaign as cp_product"
      site_scope: "same site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase/assay; calibrated meters; lot traceability"
    - protocol_id: cp_utilities
      process_id: "tbp_manufacture"
      flow_role: "one atomic utility at a time"
      record_type: "meter and supplier records"
      raw_fields: "stage/time; kWh/MJ; water m3/density; gas m3/T/P/Z/dry-wet composition; nitrogen mass; steam kg/0.45MPaG/T/dryness; condensate kg/T; feedwater and provider basis"
      collection_method: "Read calibrated meters at receipt and stage boundaries; reconcile common-meter allocation with timed operation. Record native reference bases and independently establish each provider/conversion compatibility. Aggregation detail: Measured attributable utility in its native unit per 1 kg reference flow"
      unit: "native unit"
      frequency: "continuous or each batch/meter interval"
      temporal_coverage: "complete same campaign including idle/start-up and treatment"
      site_scope: "same site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; logs; supplier basis; gas analysis; enthalpy records"
    - protocol_id: cp_waste
      process_id: "tbp_manufacture"
      flow_role: "one actual waste stream and receiver"
      record_type: "weighing, composition and consignment"
      raw_fields: "stream/origin; wet mass; dry mass/moisture; TBP/acid ester/solvent/Cl/Na/P/C; contaminants; receiver; treatment; return"
      collection_method: "Sample each separately collected waste, weigh transfers and confirm receiving acceptance/treatment; distinguish chemical sludge, biological sludge, spent carbon and organic bottoms; trace captured material and disposal. Aggregation detail: Net external waste amount per 1 kg reference flow; retain unallocated physical composition"
      unit: "kg"
      frequency: "each transfer and representative composition samples"
      temporal_coverage: "same campaign with waste storage stocks"
      site_scope: "same site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "manifest/receiver receipt; representative tests; calibration"
    - protocol_id: cp_air
      process_id: "tbp_manufacture"
      flow_role: "one emitted species or disjoint particle size"
      record_type: "outlet monitoring and leak records"
      raw_fields: "species/CAS/carbon origin; source/outlet; concentration; gas flow; T/P/O2/wet-dry basis; time; abatement; leak survey; PM sizes; detection limits; NOx convention"
      collection_method: "Capture batch emission profiles and starts/stops, including vents and diffuse losses; pair flow and analyte measurements on the same reference conditions, using matrix-validated methods. Verify fuel/oxidiser records separately; do not transfer BREF levels or patent values as factors. Aggregation detail: Integrated actual net species/particle-class load per 1 kg reference flow; no cumulative size or species-sum duplication"
      unit: "kg"
      frequency: "time-resolved across operations plus periodic validated leak survey"
      temporal_coverage: "complete campaign and operational states"
      site_scope: "same site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "lab method/blanks; flow calibration; matched time series; uncertainty"
    - protocol_id: cp_water
      process_id: "tbp_manufacture"
      flow_role: "each final direct water release and analyte"
      record_type: "discharge flow and laboratory records"
      raw_fields: "outlet/destination; flow; water content/density; pH/T/conductivity; Cl-/Na+; totalP; specific TBP/mono-/diester/alcohol/solvent; TOC/COD; solids; detection limits"
      collection_method: "Identify final outlet and pretreatment nodes; collect flow-proportional samples representative of batch peaks. Validate specific organic, ion and total-P analyses with digestion/speciation definitions and blanks; wastewater sent off-site stays a separate waste interface. Aggregation detail: Actual final species load and liquid-water quantity per 1 kg reference flow; totalP analytical ledger reconciled separately"
      unit: "kg or verified m3"
      frequency: "each discharge interval and representative batch composite"
      temporal_coverage: "same campaign; temporal sampling reflects variable emissions"
      site_scope: "same site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "methods/standards; blanks/recoveries; flow meter; receiver/outlet coordinates"
    - protocol_id: cp_balance
      process_id: "tbp_manufacture"
      flow_role: "stage and whole-plant physical balance"
      record_type: "stage flow-sheet and elemental/water reconciliation"
      raw_fields: "reaction/stage; inputs/outputs; assay; internal-link IDs; C/H/O/N/P/Cl/Na fractions; molecular water; inlet wet air and humidity; blanketing/purge gas; combustion oxygen and vent carrier; opening/closing stocks; recovery; salt/residual alkali; energy/enthalpy records; uncertainties"
      collection_method: "Measure stage streams, stocks and external interfaces; use actual composition and reaction/speciation to reconcile total mass and C by origin, H, O, N, P, Cl and Na stocks separately from molecular-water formation/consumption; include measured wet-air inputs, humidity, purge/vent carrier and combustion oxygen at the same stage boundary, recording each actual exchange atomically in the dataset; reconcile energy separately using measured electrical work, fuel energy, reaction/sensible/latent enthalpy, steam/condensate, heat removal, losses and energy-stock change; reconcile both ends of every internal link before any environmental burden allocation. Aggregation detail: Unallocated physical ledger and residuals, plus attributable exchanges per 1 kg reference flow"
      unit: "kg"
      frequency: "each batch and reconciled period"
      temporal_coverage: "same complete campaign"
      site_scope: "same site and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "flow sheet; calibrated stock measures; composition; uncertainty and unexplained residual register"
  calculation_rules:
    - id: campaign_basis
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q; A_i is the measured stock-corrected external exchange for the declared campaign in its native unit; Q is accepted net as-supplied TBP mass in kg. Reference output is 1 kg."
      inputs:
        - A_i
        - Q
        - cp_product
        - "relevant row protocol"
      output: "a_i"
      source_ids: []
    - id: assay_ledger
      applies_to: "solution and product composition"
      rule: "Active mass = supplied net mass × measured active mass fraction; carrier water and other constituents come from actual composition. Sum constituent masses without adding them as additional duplicate purchased exchanges."
      inputs:
        - cp_material
        - cp_product
        - "measured fractions"
      output: "active/carrier composition ledger"
      source_ids: []
    - id: reaction_ledger
      applies_to: "reaction and neutralisation"
      rule: "Ideal substitution identity: POCl3 + 3 C4H10O -> C12H27O4P + 3 HCl. It produces no esterification water. Actual neutralisation HCl + NaOH -> NaCl + H2O generates water; POCl3/ester hydrolysis consumes water and must follow measured species. These equations check atom accounting, not actual feed ratios/yields; record residual alkali, acid, salts and incomplete esters."
      inputs:
        - cp_balance
        - cp_material
        - cp_product
        - "actual speciation"
      output: "reaction/neutralisation P/C/water/Cl/Na ledger"
      source_ids:
        - who-tbp-1991
        - stauffer-trialkyl-1963
    - id: physical_balance
      applies_to: "each stage and plant"
      rule: "For mass and each conserved element E: opening stock + external input + internal received = closing stock + external output + internal sent + documented residual. Internal sent/received cancel only when both ends match. Only the molecular-water species ledger adds actual reaction formation and subtracts consumption; total mass and conserved elements have no reaction-generation term. Include water in solutions/steam, inlet humidity, wet air, condensate, product/waste moisture and outlet vapour, and include measured purge/vent carrier and combustion oxygen. Reconcile energy with electrical work, fuel calorific basis, reaction/sensible/latent enthalpy, steam/condensate, cooling, losses and stock changes in a separate energy ledger; kg and MJ are not additive. No guessed closure factor."
      inputs:
        - cp_balance
        - "all actual composition/stock records"
      output: "unallocated total-mass/C/H/O/N/P/Cl/Na and separate molecular-water/energy residuals"
      source_ids:
        - jrc-ofc-2006
        - jrc-cww-2016
        - jrc-ilcd-2010
    - id: emission_load
      applies_to: "all elementary outputs"
      rule: "Load = sum of paired concentration × compatible gas/water flow × duration, converted with recorded units; apply actual inlet correction where appropriate. Distinguish wet/dry and reference T/P/O2; non-detects keep bounds and cannot become automatic zero. Independently reconcile diffuse losses."
      inputs:
        - cp_air
        - cp_water
        - "calibration and time series"
      output: "actual net species load"
      source_ids:
        - jrc-ofc-2006
        - jrc-cww-2016
    - id: phosphorus_partition
      applies_to: "total_p_water and named P species"
      rule: "Keep totalP as an analytical closure value. Residual P = measured totalP minus P equivalents of individually quantified species in the same outlet/time window. Use actual stoichiometric composition for equivalents; forbid negative residuals or duplicate totalP/species loads. Residual composition/LCIA basis remains pending until substantiated."
      inputs:
        - cp_water
        - "actual species composition"
      output: "disjoint named-P and residual-P accounting"
      source_ids:
        - jrc-cww-2016
    - id: yield_recovery
      applies_to: "reaction and separation"
      rule: "Derive actual yield from accepted TBP assay mass and actual limiting-reactant/speciation records, accounting for recycle stocks and co-products; derive recovery from measured sent/recovered/bleed quantities. No patent laboratory yield or solvent ratio is imported."
      inputs:
        - cp_material
        - cp_product
        - cp_balance
      output: "site-specific yield and recovery checks"
      source_ids: []
    - id: burden_account
      applies_to: "allocated environmental burdens"
      rule: "Apply the justified allocation shares only to the remaining shared burdens after subdivision. Preserve all physical outputs and emissions in the unallocated ledger and retain the separate attributed accounts and reconciliation."
      inputs:
        - "measured stages"
        - "justified shares"
        - "physical ledger"
      output: "attributed burden accounts"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_trace
      applies_to: "all inventory rows"
      requirement: "Trace each row identity, measurement, unit/basis, supplier/receiver and required qualifiers; preserve every open linkage"
      evidence: "row records and original calibration/analysis"
    - id: dq_coverage
      applies_to: "tbp_manufacture"
      requirement: "Same period/product mix; cover starts/stops, downtime, returns, waste stocks and material peaks, and disclose representativeness gaps"
      evidence: "production/meter time series"
    - id: dq_uncertainty
      applies_to: "balances and emissions"
      requirement: "Review residuals using actual method detection limits, sampling error, calibration and composition uncertainty; no invented survey coverage, universal tolerance or unmeasured zero emissions"
      evidence: "uncertainty and residual investigation"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Require actual TBP CAS126-73-8, direct POCl3/n-butanol route, unformulated market state and complete lot qualifiers. Similar phosphate/salt labels and source classification do not establish identity."
    source_ids:
      - who-tbp-1991
      - lanxess-tbp-product
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require one finished reference output at 1 kg, the same Q denominator in inventory and collection, and native reference-property/unit compatibility. Missing gas/steam/concentration/provider basis remains explicitly incomplete."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "all stages"
    rule: "Reconcile total mass, C by origin, H, O, N, P, Cl and Na stocks, molecular-water formation/consumption, wet-air/purge/vent carriers, neutralisation salts/residuals and stock changes before allocation; reconcile energy separately. Investigate residuals against measured uncertainty; no universal tolerance, invented yield or balancing emission."
    source_ids:
      - jrc-ofc-2006
      - jrc-cww-2016
      - jrc-ilcd-2010
  - rule_id: validate_emissions
    applies_to: "elementary outputs"
    rule: "Match species/CAS, medium/submedium and native unit, carbon origin and monitoring/LCIA definitions; NOx excludes N2O. Disjoint PM fractions, individual VOCs and named-P/residualP must not duplicate cumulative sums. Keep actual biogenic CO2."
    source_ids:
      - jrc-cww-2016
