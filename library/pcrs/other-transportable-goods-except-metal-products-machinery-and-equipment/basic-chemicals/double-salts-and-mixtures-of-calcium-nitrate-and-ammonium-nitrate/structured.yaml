system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "double_salt_manufacture"
      rule: "Include receiving/melting, ammonia vaporisation where needed, neutralisation, evaporation, prilling, screening, product acceptance, packing, recovery and ventilation within one foreground unit. Keep stages separately metered in cp_stage. jrc-lvic-aaf-2007 §§7.4.4/7.4.8."
      source_ids:
        - jrc-lvic-aaf-2007
    - rule_id: boundary_utilities
      applies_to: "double_salt_manufacture"
      rule: "Link external electricity, industrial-boiler steam heat, water and waste treatment to their actual providers once. On-site combustion or biological/chemical effluent treatment requires separately evidenced operations and atomic fuel/reagent/emission rows before completeness can be claimed; it is not hidden in a heat or waste quantity."
      source_ids:
        - jrc-lvic-aaf-2007
        - jrc-cww-2016
    - rule_id: boundary_recycle
      applies_to: "double_salt_manufacture"
      rule: "Record fines, oversize, scrubbed nitrate liquor and condensate internally with equal mass on each sending/receiving stage link and measured inventories. Only net external exchanges appear below. If material leaves the plant for a receiver, retain its real output identity and quantity."
      source_ids:
        - jrc-lvic-aaf-2007
        - jrc-cww-2016
