allocation_rules:
  - rule_id: allocation_separation
    applies_to: "double_salt_manufacture"
    rule: "Use an explicitly declared attributional LCI context, following jrc-ilcd-2010 §§7.9.2–7.9.3. Consequential questions need a separate goal/scope decision and cannot inherit this hierarchy automatically. Retain a physical unit/stage ledger before allocation. Separate shared-site utilities and upstream CNTH/NPK co-production using measured causal/subdivision evidence first. Receiving a separated CNTH stream never establishes zero upstream burden. Allocation convention and provider denominator must accompany its upstream dataset."
    source_ids:
      - jrc-ilcd-2010
      - jrc-lvic-aaf-2007
  - rule_id: allocation_burden
    applies_to: "double_salt_manufacture"
    rule: "If subdivision fails, document the selected defensible physical relation; if none exists, disclose actual dated economic data and sensitivity. Calculate burden shares summing to one in a separate ledger. Never multiply real co-product output masses, elemental balances or internal link quantities by those shares. This is an attributional hierarchy based on jrc-ilcd-2010, not a BAT-prescribed allocation formula. Economic values must reflect the actual condition and gate where co-products leave co-production, not downstream packed/transported prices without adjustment."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_recovery
    applies_to: "double_salt_manufacture"
    rule: "Internal recovered salts/condensate are circulation, without extra product output or avoided-production credit. Discarded salt, sludge and wastewater retain actual receiver treatment. A genuinely sold recovered product requires demonstrated acceptance, composition and a separate verified identity before applying any allocation."
    source_ids:
      - jrc-ilcd-2010
      - jrc-lvic-aaf-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "double_salt_manufacture"
      flow_role: "reference product"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "lot SKU; route; gross/tare/net accepted mass P; nitrate-N; ammonium-N; Ca; crystal/free water; free acid; insolubles; size; returns/reacceptance; opening/closing finished and work-in-progress stocks; production history and carried inventory burdens"
      collection_method: "Calibrated scales and acceptance records; validated lot-specific chemical/moisture analysis. Count accepted output once and reconcile dispatch plus opening/closing stocks."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_material
      process_id: "double_salt_manufacture"
      flow_role: "CNTH ammonia lubricant"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "separate receipt IDs; wet mass; crystal/solution phase; liquor/free acid; assay; NH3 phase/purity; lubricant origin/grade; stock changes; supplier basis"
      collection_method: "Weigh or calibrated mass meter each material; measure actual composition and reconcile net use from stocks and receipts. Preserve delivered quantity and component ledgers independently; vaporisation/recovery are measured stage operations."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_energy
      process_id: "double_salt_manufacture"
      flow_role: "electricity and dissipated heat"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "stage meter IDs; kWh; actual voltage; electricity provider; energy/enthalpy balance; starts/stops; time; output P"
      collection_method: "Submeter and integrate actual electricity, fan/compressor and mechanical load. Determine dissipated heat with explicit reference temperature, sensible/latent terms and recovery; no fuel emission copied from imported heat."
      unit: "MJ"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_heat
      process_id: "double_salt_manufacture"
      flow_role: "external industrial-boiler steam heat"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "supplier reference GCV/MJ definition; pressure; temperature; dryness; inlet steam/return mass; inlet/return enthalpy; agreed datum; supplier conversion; background boundary"
      collection_method: "Measure steam and return streams; calculate net delivered enthalpy independently, then use an evidenced supplier conversion to the linked GCV reference. Maintain conversion as pending when undefined; do not infer it from MJ."
      unit: "MJ"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_water
      process_id: "double_salt_manufacture"
      flow_role: "make-up evaporation condensate"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "external make-up mass/volume; density/temperature; treatment; condensate return; humidity; stock; water in CNTH and accepted prills"
      collection_method: "Meter make-up separately from circulation; reconcile water carried in wet inputs, crystal/free water in output, condensation, evaporation and purge. Record losses and uncertainty instead of assigning a balance residual as an invented species."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_pack
      process_id: "double_salt_manufacture"
      flow_role: "individual packaging components"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "sack count/mass; PE liner mass; thickness/resin; pallet net mass/treatment; rotations; supplier IDs; scraps"
      collection_method: "Weigh components separately and reconcile use/scrap and accepted product. Record actual rotations and measured supplier conversion where units differ; no packaging mass in P."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_waste
      process_id: "double_salt_manufacture"
      flow_role: "individual external wastes"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "row waste ID; wet/dry mass; composition/contamination; nitrate/ammonium/Ca; receiver; acceptance and treatment route; time"
      collection_method: "Separate weighed wastes and chain-of-custody receipts; distinguish mechanical-PP recycling from disposal and residues from internal recovery. Analyse liquid/solid partition and link receiver burdens once."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_air
      process_id: "double_salt_manufacture"
      flow_role: "NH3 and each non-overlapping PM fraction"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "outlet ID; gas flow; concentration; wet/dry and normal T/P; operating hours; NH3 versus N; PM2.5/PM10/total; aerosol moisture/chemistry; recovery; detection limits"
      collection_method: "Validated paired flow/concentration tests after abatement, plus time-representative diffuse assessment; integrate each physical species/fraction once. Retain start/stop periods, uncertainty and censored values. Unspecified dust remains unpartitioned pending size evidence."
      unit: "kg"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_effluent
      process_id: "double_salt_manufacture"
      flow_role: "direct freshwater outlet species/water"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "outlet and recipient; discharge flow; sampling times; NO3-N or NO3; NH4-N or NH4; dissolved NH3; Ca; pH/temperature; suspended solids; water fraction; carrier-water density/temperature and separate carrier-water volume; lab method"
      collection_method: "Only actual direct discharge: paired calibrated flow and representative laboratory analysis at final outlet; preserve species and original units. External-treatment transfer is recorded in cp_waste instead; do not duplicate its loads here."
      unit: "kg; m3"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
    - protocol_id: cp_stage
      process_id: "double_salt_manufacture"
      flow_role: "internal physical links and allocation"
      record_type: "calibrated measurements and traceable records"
      raw_fields: "stage IDs; sending/receiving amounts; recycle solids/liquor; condensate; stocks; heat recovery; upstream/shared-site partition; independent burden ledger"
      collection_method: "Preserve measured stage diagrams, mass/water/N/Ca balance and equal link quantities before allocating burdens. Use measured utility causes/subdivision; document any physical/economic relation and sensitivity."
      unit: "kg; MJ"
      frequency: "each lot/transfer; continuous meters integrated; representative outlet campaigns"
      temporal_coverage: "complete declared campaign including starts/stops and stock reconciliation"
      site_scope: "same foreground unit; actual supplier/receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lab method/speciation, receipts, timestamps, coverage and uncertainty"
  calculation_rules:
    - id: normalise_campaign
      applies_to: "all inventory rows"
      rule: "Exchange per reference kg = raw net campaign exchange total / accepted net product mass P, divided once. Sum raw quantities over the complete same route, hydration/specification and campaign, including attributable failed/zero-output intervals, starts/stops, cleaning and rework; do not average successful-interval ratios or divide a per-kg value again. P must be positive and is credited once after reconciling returns/reacceptance, finished stocks and work in progress. Preserve their production history and carried burdens so attribution covers the same accepted output; burden adjustments do not erase raw physical exchanges. Internal recycle remains outside the external numerator and is not a new accepted output. If P is zero, retain totals and disclose no unit result rather than divide or omit burdens."
      inputs:
        - cp_product
        - "row-specific protocol"
      output: "row amount per 1 kg reference flow"
      source_ids:
        - jrc-cww-2016
    - id: components_and_water
      applies_to: "cnth_feed, finished_product"
      rule: "Component mass = measured delivered mass × measured component mass fraction. Maintain disjoint dry salt, crystal water, free water and adhering-liquor terms; no manufacturer assay transplanted."
      inputs:
        - cp_material
        - cp_product
        - cp_water
      output: "physical component/water ledger"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: electricity_conversion
      applies_to: "electricity_input"
      rule: "MJ = measured kWh × 3.6; the definition 1 kWh = 3.6 MJ is a unit conversion, not a technology consumption value."
      inputs:
        - cp_energy
      output: "provider-compatible MJ per reference kg"
      source_ids: []
    - id: emission_load
      applies_to: "ammonia_air, nitrate_water, ammonium_water, calcium_water"
      rule: "Species mass = sum over measured intervals of concentration × compatible gas/water flow × interval duration × explicit unit/species conversion. For mass-as-N multiply by molar mass of measured species / molar mass of N after confirming speciation."
      inputs:
        - cp_air
        - cp_effluent
      output: "physical species load then per-reference amount"
      source_ids:
        - jrc-cww-2016
    - id: particle_partition
      applies_to: "pm_fine, pm_coarse, pm_large"
      rule: "Disjoint bins: fine = measured PM2.5; middle = compatible PM10 − PM2.5; large = compatible total PM − PM10. Independent disjoint tests may replace differences. Incompatible tests or negative differences require review, not clipping to zero."
      inputs:
        - cp_air
      output: "non-overlapping physical particle loads"
      source_ids:
        - jrc-cww-2016
    - id: heat_reconciliation
      applies_to: "heat_input"
      rule: "Net delivered heat = measured inlet steam mass × inlet enthalpy − measured return mass × return enthalpy, using one explicit datum and appropriate pressure/temperature/dryness; reconcile other outlet/loss terms. The supplier GCV conversion is separate measured/declared evidence; no default GCV-to-net factor."
      inputs:
        - cp_heat
        - cp_stage
      output: "separate physical heat and provider reference ledgers"
      source_ids:
        - jrc-lvic-aaf-2007
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Verify actual species/state, route, medium, property/unit and provider definition. Empty UUID or pending compatibility remains explicit; identity verification alone is not a complete background dataset."
      evidence: "supplier specifications, flow evidence, receiver criteria"
    - id: balances
      applies_to: "double_salt_manufacture"
      requirement: "Reconcile unallocated mass, water, N and Ca, impurities/stock changes and stage links; state uncertainties and unresolved residuals. Never invent yield, purity, hydration or zero emissions to close balances."
      evidence: "cp_product; cp_material; cp_water; cp_stage"
    - id: coverage
      applies_to: "double_salt_manufacture"
      requirement: "Capture normal and start/stop production, cleaning, leaks, recovery and each real waste/emission. Additional actual reagents, pollutants or utilities must be separate scoped rows with evidence; absent or unquantified rows cannot imply completeness."
      evidence: "jrc-cww-2016; cp_stage"
    - id: sources
      applies_to: "double_salt_manufacture"
      requirement: "Historic BAT/CALCINIT case values do not define universal recipes, water removal, energy, emission factors or quality thresholds. Require current lot tests and supplier evidence; disclose modelling choices separately from external facts."
      evidence: "un-cpc-2025; jrc-lvic-aaf-2007; jrc-cww-2016; yara-calcinit-2023"
validation_rules:
  - rule_id: validate_product
    applies_to: "reference product"
    rule: "Confirm both nitrate salts, solid hydration and the declared CNTH route; exactly one final reference output is 1 kg of net accepted product. Packaging, off-spec waste and internal intermediates do not add another reference output."
    source_ids:
      - un-cpc-2025
      - jrc-lvic-aaf-2007
      - yara-calcinit-2023
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "All rows and collection aggregation use the same accepted net P and campaign; source/property/unit conversions and upstream CNTH allocation must be explicit. Undefined steam GCV/enthalpy conversion, missing quantities, uncertain speciation or missing exact identity remain findings and block complete dataset validation."
    source_ids:
      - jrc-cww-2016
      - jrc-ilcd-2010
  - rule_id: validate_no_overlap
    applies_to: "double_salt_manufacture"
    rule: "Check equal internal links, stock changes, physical balances versus burden allocation, disjoint PM bins and total-N reconciliation. A transferred wastewater stream and its direct elementary pollutant load are mutually exclusive at this boundary; source case “no discharge” is not proof of actual absence."
    source_ids:
      - jrc-cww-2016
      - jrc-lvic-aaf-2007
published_dataset_profile:
  dataset_role: "Foreground industrial double-salt manufacture; optional cradle-to-gate integration"
  downstream_use: "Mass-based supplied fertilizer/chemical input with declared composition and hydration"
  allowed_use: "Only qualified CNTH/ammonia/evaporation/prilling solid route; compatible provider bases"
  excluded_use: "Other CAN identities/routes, solution reference, field-use efficacy or universal fertilizer recipe"
  required_metadata: "Reference qualifiers; complete campaign P; provider and receiver identities/bases; stages and inventories; assays; allocation; emission compartments and methods"
  required_quality_disclosure: "Actual measured versus modelled data; coverage/uncertainty; unresolved UUIDs and steam compatibility; upstream CNTH burden completeness; metadata debts"
  update_trigger: "Change of CNTH origin, process route, hydration/assay, additive/coating, provider basis, abatement, waste receiver or shared-site allocation"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "[UNSD CPC Version3.0 Structure, 30Jun2025](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv)"
    used_for: "Rows34613/34614/34615. Official category separation only; no manufacture recipe."
