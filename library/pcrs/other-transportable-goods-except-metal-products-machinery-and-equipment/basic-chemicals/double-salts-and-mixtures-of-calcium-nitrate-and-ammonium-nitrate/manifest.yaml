review_metadata:
  scientific_review: pending
  methodology_approval: not_granted
  semantic_boundary_decision: Promote matching unpublished scaffold for hydrated calcium-nitrate/ammonium-nitrate
    prills from nitrophosphate CNTH melt neutralisation with anhydrous ammonia, evaporation
    and prilling. Exclude nitrate-carbonate CAN, pure ammonium nitrate, ammonia-free
    calcium nitrate, supplied solutions, dry blending, limestone/lime neutralisation,
    pan granulation and additive/coated grades. Narrower mapping proposed, not accepted.
  reuse_assessment: 'Local material manifest and controller queue checked. 34613 ammonium
    nitrate is independently in progress; 34615 carbonate-filled ammonium nitrate
    pending. Neither includes CNTH crystal-water/acid carryover and calcium nitrate
    double-salt conversion. No same-boundary material PCR found; do not edit neighbouring
    methods. Durable reviewed aqueous-nitric-acid PCR was also read: it excludes fertilizer
    production and is an upstream method, not duplicate double-salt identity.'
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
  - row_id: cnth_feed
    name: Calcium nitrate tetrahydrate crystals with adhering mother liquor
    reason: No exact solid CNTH record in three successful bounded searches (physical
      name, combined formula, CAS query); aqueous water-treatment calcium nitrate,
      final double salt, lime and ammonium nitrate are different states/species. Retain
      wet CNTH crystals with separately measured mother liquor.
  - row_id: pp_bag
    name: Woven polypropylene fertilizer sack
    reason: Only woven-PP candidate is explicitly a 25 kg seed bag at farm gate with
      a per-seed model; do not extend that hard use/quantity definition to fertilizer
      bags. Retain actual weighed woven polypropylene fertilizer sack. Additional
      broader bag search returned recycling plastic containers, milk-packing bags,
      paper bags and crates rather than the target woven fertilizer sack.
  - row_id: nitrate_wastewater
    name: Calcium-nitrate/ammonium-nitrate condensate purge wastewater
    reason: Search returned ammonium chloride, analytical nitrogen indicators and
      wastewater specifically from electrolytic manganese-residue washing; none establishes
      this condensate/scrubber-purge waste identity.
  - row_id: nitrate_sludge
    name: Wet insoluble residue from CNTH melt filtration
    reason: Filtration residue and sludge candidates do not establish this CNTH insoluble
      residue composition or receiving conditions; no generic sludge identity is adopted.
  - row_id: nitrate_reject
    name: Discarded hydrated calcium-nitrate/ammonium-nitrate double salt
    reason: Ammonium chloride, thiocyanate, manure and analytical nitrogen indicators
      do not identify rejected hydrated nitrate double salt.
  - row_id: water_freshwater
    name: Liquid water released to freshwater
    reason: Supplemental state100 direct read confirms a liquid Water emission-to-freshwater
      candidate with Volume/m3, but that UUID was absent from all bounded task search
      responses, including a50-candidate request returning40 records. The required
      search-membership audit is incomplete, not proof that the physical flow is absent.
      Do not use resource water, water-vapour-to-water or cooling/turbine-specific
      water as substitutes; retain blank UUID pending a qualifying search receipt.
  - row_id: heat_air
    name: Waste heat dissipated to outdoor air
    reason: Waste-heat candidate has reference-property shortDescription Radioactivity
      while its linked canonical property is Net calorific value. Do not silently
      certify that inconsistent record or assume calorific value equals dissipated
      sensible/latent heat; exact quantity-compatible identity pending.
  quantity_compatibility_pending:
  - row_id: heat_input
    reason: Verified physical industrial-boiler steam-heat identity has Gross calorific
      value/MJ, not a declared net-delivered-enthalpy convention. Later data producer
      must obtain supplier basis and reconcile actual pressure/temperature/dryness/mass/return
      enthalpy; do not assert complete background link if unknown.
  source_metadata_debts:
  - row_id: pe_liner
    uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
    issue: Explicit PE film name/CAS9002-88-4/comment consistent; isolated CPC29220
      classification misplacement disclosed. Conditional physical adoption requires
      actual supplier film grade and source classification clarification.
