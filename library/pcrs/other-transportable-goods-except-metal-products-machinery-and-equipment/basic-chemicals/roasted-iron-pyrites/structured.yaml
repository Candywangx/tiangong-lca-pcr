allocation_rules:
  - rule_id: separate_physical_accounts
    applies_to: "roasting"
    rule: "Keep a reconciled unallocated process ledger containing all actual calcine, cleaned gas and exported steam. D is accepted calcine dry output before allocation. Preserve full co-product output quantities and identical internal links; allocation never scales the physical gas or steam to an invented output."
    source_ids:
      - jrc-lvic-aaf-2007
      - metso-roasting-2022
      - ilcd-allocation-2010
  - rule_id: joint_burdens
    applies_to: "roasting"
    rule: "Declare an attributional modelling goal. First subdivide dedicated calcine cooling/loading, gas cleaning and heat-delivery auxiliaries where physically separable. For genuinely joint roasting burdens, use a demonstrated causal physical relation if supported; otherwise use documented economic allocation at the actual separation gate and condition. For economic allocation, share_i = revenue_i / sum(revenue of all useful co-products); revenue uses measured output and representative matched-period gate price. An internal gas stream needs a defensible transfer value adjusted for downstream acid conversion/conditioning costs; final acid revenue is not an unadjusted gas price. Missing/zero/negative prices do not justify silently assigning zero burden; justify another method and sensitivity. Avoid adding steam credits to already allocated joint burdens."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: product_waste_state
    applies_to: "calcine, dust_waste, sludge, process_gas, steam"
    rule: "Determine useful product versus disposal obligation from actual specification, receiver and fate. Only accepted supplied calcine enters D. Waste/nonmarketable gas requires its actual treatment; it is not a positive co-product merely because a label says by-product. No default allocation percentage, yield, oxide purity, recipe or energy recovery is specified."
    source_ids:
      - ilcd-allocation-2010
      - jrc-lvic-aaf-2007
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "roasting"
      flow_role: "calcine reference"
      record_type: "Weighing and laboratory lot records"
      raw_fields: "gross/tare/net mass; accepted/rejected lots; opening/closing stock; wet-basis free water; Fe/S/phase/gangue/metals; size; temperature; destination"
      collection_method: "Calibrated scales and traceable lot acceptance; representative sealed-lot moisture and mineral phase/chemical assays with validated methods, corrections and uncertainty"
      unit: "kg; mass fraction; degC"
      frequency: "Each accepted lot; stock at period boundaries"
      temporal_coverage: "Matched year or justified campaign"
      site_scope: "Same grade, route and site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration, certificates, sampling preservation, laboratory QA and receiver specification"
    - protocol_id: cp_solids
      process_id: "roasting"
      flow_role: "feed, lime, lining_in"
      record_type: "Receipt, dosing and service-life records"
      raw_fields: "Individual commercial material mass; composition/purity/free water; delivered gate; supplier; internal returns; installation and life"
      collection_method: "Weigh each atomic material; supplier assay/phase verification; campaign-attributable refractory replacement records"
      unit: "kg; mass fraction"
      frequency: "Each receipt/batch; each replacement"
      temporal_coverage: "Same production period and measured refractory service coverage"
      site_scope: "Feed preparation, neutralisation and roaster"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighing checks, supplier/reference-basis match, solids and Fe/S balances"
    - protocol_id: cp_utilities
      process_id: "roasting"
      flow_role: "electricity"
      record_type: "Meter records"
      raw_fields: "Purchase, on-site generation, internal use and export; equipment submeters; voltage; geography/year"
      collection_method: "Calibrated incoming and stage electricity meters; reconcile bills and meter coverage"
      unit: "kWh; MJ"
      frequency: "Interval or daily; billing reconciliation"
      temporal_coverage: "Same production period including downtime"
      site_scope: "All included stages; exclude separately allocated acid-only stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, missing interval estimation, generation/export reconciliation"
    - protocol_id: cp_gas
      process_id: "roasting"
      flow_role: "gas, air, process_gas"
      record_type: "Flow metering and analysis"
      raw_fields: "Separate stream volume; absolute pressure; temperature; moisture; composition; compressibility; standard-state definition; gas supplier; transferred gas mass"
      collection_method: "Calibrated gas meters with matched state/composition analysis; density/state conversion trace; matched sending/receiving readings"
      unit: "m3; kg; K; Pa; mass or mole fraction"
      frequency: "Interval and composition-change sampling"
      temporal_coverage: "Same production period, including start/stop"
      site_scope: "Gas inlet, fan outlet and cleaned-gas handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter QA, state and supplier-background agreement, independent sulfur balance"
    - protocol_id: cp_water
      process_id: "roasting"
      flow_role: "water, river_water, wastewater, boiler_blowdown; separate actual external water returns/losses"
      record_type: "Intake, transfer and balance records"
      raw_fields: "Separate source/intake/return/evaporation/effluent volumes; density/temperature; basin; supplier; wastewater receiver and composition"
      collection_method: "Calibrated meters or weighing; matched intake and wastewater transfer; isolate internal recirculation"
      unit: "m3; kg; degC"
      frequency: "Daily/interval and transfer batch"
      temporal_coverage: "Same production period"
      site_scope: "Boiler/cooling/scrubbing and effluent system"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter QA, basin/fate evidence, actual density conversion and water balance"
    - protocol_id: cp_heat
      process_id: "roasting"
      flow_role: "exported steam"
      record_type: "State, mass and energy balance"
      raw_fields: "Gross generated, internally used, exported and vented steam; pressure absolute; temperature; quality; condensate/feedwater mass and state; heat boundary"
      collection_method: "Calibrated mass/state meters at agreed interfaces; use IAPWS-IF97 in valid regions for ordinary water/steam; account for all actual returns"
      unit: "kg; K; Pa; kJ/kg; MJ"
      frequency: "Interval; reconcile monthly"
      temporal_coverage: "Same production period"
      site_scope: "Waste-heat boiler, internal users and export/return interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, quality evidence, state/return reconciliation, separate usable heat calculation and receiving provider match"
    - protocol_id: cp_waste
      process_id: "roasting"
      flow_role: "dust_waste, sludge, lining"
      record_type: "Weighbridge and laboratory/fate records"
      raw_fields: "Separate wet/dry mass; free water; metals/sulfate/composition; collector returns; receiver and treatment"
      collection_method: "Weigh each waste stream independently; representative compositional assays; transfer and acceptance manifests"
      unit: "kg; mass fraction"
      frequency: "Each batch/shipment and replacement"
      temporal_coverage: "Same production period with lifetime attribution for lining"
      site_scope: "Collectors, effluent treatment and roaster"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Moisture QA, receiver compatibility, internal-return cancellation and contamination evidence"
    - protocol_id: cp_air
      process_id: "roasting"
      flow_role: "Individual gaseous, metal and particulate emissions"
      record_type: "Stack/fugitive monitoring and source mass balance"
      raw_fields: "Species concentration, exhaust volume, dry/wet/temperature/pressure/O2 reference, duration, detection limits, carbon provenance, particle-size fractions, startup and fugitives"
      collection_method: "Calibrated species-specific monitoring or validated source balance; SO2 instrumental scope per EPA6C with all applicable referenced methods; metals per EPA29 or documented equivalent with applicable dependencies; validated size-selective PM and separate fugitive surveys; no vendor factor"
      unit: "kg; mg/m3; m3; h"
      frequency: "Matched intervals; validated representative tests with coverage of operating modes"
      temporal_coverage: "Same production period"
      site_scope: "Actual outdoor releases after control, across all included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, blanks/recovery, interferences, compatible exhaust basis, speciation, source coverage and uncertainty; nondetects are bounded, not assumed zero"
    - protocol_id: cp_effluent
      process_id: "roasting"
      flow_role: "as_water, iron_water, sulfate_water, water_discharge"
      record_type: "Paired final-discharge laboratory and volume records"
      raw_fields: "Actual receiving freshwater; volume; representative concentrations; total/dissolved basis; species versus element; detection limits; bypasses"
      collection_method: "Flow-proportional composite samples or justified equivalent; calibrated volume and validated laboratory methods; final discharge only"
      unit: "m3; mg/L; kg"
      frequency: "Paired volume and representative samples, including nonroutine release"
      temporal_coverage: "Same production period"
      site_scope: "Only on-site treatment final freshwater boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Laboratory blanks, recovery, speciation basis, recipient/fate verification and treatment/transfer de-duplication"
  calculation_rules:
    - id: period_normalisation
      applies_to: "all inventory rows"
      rule: "Divide each physically measured, stock-corrected period exchange by the same positive dry accepted calcine D. Reference product is exactly 1 kg. Retain raw unallocated physical totals separately from allocation of joint burdens. Each protocol retains raw, unallocated period records and the row total before normalisation. Include all attributable accepted, rejected, failed and zero-accepted-output batches, startup, shutdown, outages and rework within the same representative period; do not remove their inputs, wastes or releases because an individual batch has no accepted output. Reconcile applicable stocks and internal returns and attribute lining to its real service period. cp_product independently establishes positive D from unique accepted calcine output lots, reconciling production, dispatch and stocks without counting returned or reaccepted material twice. Apply period_normalisation exactly once to each reconciled period total; the protocol aggregation and calculation rule describe that same division, not successive divisions. A complete period with D <= 0 cannot produce a per-kg dataset and requires an explicitly justified wider representative period or an incomplete result. Machine or furnace-batch counts are not the denominator."
      inputs:
        - "Row records"
        - D
        - stocks
        - "applicable collection protocol"
      output: "Quantity per 1 kg reference flow"
      source_ids:
        - ilcd-allocation-2010
    - id: effluent_load
      applies_to: "as_water, iron_water, sulfate_water"
      rule: "For paired samples, mass kg = sum(concentration mg/L * corresponding water volume m3) / 1000. Concentration and volume cover the same outfall/time; retain whether species or elemental mass."
      inputs:
        - "Paired concentrations/volumes and QA"
        - cp_effluent
      output: "Species mass before normalisation"
      source_ids:
        - jrc-lvic-aaf-2007
    - id: air_load
      applies_to: "so2, co2, co2_mineral, co2_bio, co, no, no2, pm25, pm2510, pm10, as_air, hg_air, pb_air, hcl, hf"
      rule: "Mass kg = sum(concentration mg/m3 * corresponding exhaust volume m3) / 1000000. Undo any O2 reporting correction consistently and align dry/wet state, pressure/temperature before multiplying. Fugitive releases are separately measured/validated and added once."
      inputs:
        - "Species-specific concentrations and exhaust volume"
        - "duration/state"
        - cp_air
      output: "Species mass before normalisation"
      source_ids:
        - epa-so2-6c-2017
        - epa-metals-29-2017
    - id: nonoverlap_particles
      applies_to: "pm25, pm2510, pm10"
      rule: "Use matched filterable PM2.5, PM10 and total filterable particulate measurements: interval 2.5-10 = PM10 - PM2.5; above10 = total - PM10. Require nonnegative fractions within uncertainty; never fabricate a split from a single total or add cumulative fractions to their component intervals."
      inputs:
        - "Matched size-selective measurements"
        - cp_air
      output: "Non-overlapping particulate masses"
      source_ids:
        - epa-pm-201a-2020
  data_quality_requirements:
    - id: physical_identity
      applies_to: "all inventory rows"
      requirement: "Verify complete native flow name, CAS where present, route, classification/comment conflicts, reference property/mean, unit group and actual physical stream. Generic identity does not verify provider or quantities. Unresolved identity remains explicit; never substitute nearby product/waste/species."
      evidence: "Native identity, supplier/lot/assay and state documentation"
    - id: mass_sulfur_carbon
      applies_to: "roasting"
      requirement: "Retain process diagram and independent Fe/S/dry-solids/water/carbon balances before environmental-burden allocation. Reconcile oxidation oxygen, gas sulfur, material moisture, dust returns, stock and observed releases; flag closure outside measured uncertainty without inventing a correction flow."
      evidence: "cp_product, cp_solids, cp_gas, cp_water, cp_waste, cp_air, cp_effluent"
    - id: quantitative_scope
      applies_to: "all inventory rows"
      requirement: "Require site measurements and documented uncertainty. Source acid-denominator ratios, vendor temperature/capacity, gas percentages and single-plant energy examples are not per-calcine defaults. No numerical recipe, yield, purity or allocation share is transferred here."
      evidence: "Actual sampling and meters; jrc-lvic-aaf-2007, metso-roasting-2022"
    - id: completeness
      applies_to: "roasting"
      requirement: "Screen real feed/lining composition and operating conditions for every additional metal, gas species, wastewater constituent, reagent, fuel or packaging component; add atomic rows as required. PM and metal mass components may describe the same physical particulate for chemistry but must not be summed as independent total solids."
      evidence: "Source diagram, laboratory screening and inventories"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a data package with undefined/nonpositive D, incompatible dry/wet quantities, absent product/route qualification, missing physical balance or hidden joint-product allocation. Require one final reference output; any inter-stage product transfers must cancel with identical quantities."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
