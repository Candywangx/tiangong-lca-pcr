system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include upstream delivered feed and actual consumption burdens, air fans, startup and shutdown, roaster, waste-heat system, dry solids collection/cooling/handling, gas cleaning, wastewater treatment and bulk loading. Include incoming transport to the gate exactly once through measured shipment data and compatible upstream transport models; do not assume delivered-product UUIDs already include freight. Account for attributable infrastructure/refractory over real service life and document broader equipment-data cutoffs. Sources: jrc-lvic-aaf-2007, metso-roasting-2022."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Gas cleaning may be subdivided internally, but identical transfers must cancel. SO2-rich gas is a mixture supplied to acid production, with composition and burden handoff specified. Downstream conversion, absorption, acid conditioning and its emissions belong to the receiving model. If acid operations cannot be separated from shared site burdens, expand the joint model and document it before using calcine guidance; do not omit acid-site common services or charge all acid-only operations to calcine. Residual site releases, water treatment and transferred waste retain actual fate; no zero-burden assumption for a marketable by-product."
      source_ids: []
