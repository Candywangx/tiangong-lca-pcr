measurement_rules:
  - id: reference_mass
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "D is positive net dry accepted calcine produced in the matched collection period, reconciled with opening/closing stocks, rejects and dispatch; exclude packaging. Weigh net product with calibrated scales; measure representative sealed-lot free water with a matrix-validated laboratory method that preserves mineral phase and avoids confusing oxidation/volatile loss with water. D = sum(net accepted wet mass * (1 - measured wet-basis free-water fraction)). Record method, temperature, moisture basis, sampling and uncertainty. Do not infer moisture from total loss on ignition or assume zero. Every row and protocol uses per 1 kg reference flow."
  - id: reference_properties
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Native reference property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Use each row native reference unit: Volume/m3 for natural gas, direct river abstraction and liquid discharge; the specific unresolved wastewater/blowdown rows are also collected in m3; electricity is collected in MJ, with the compatible native energy property pending identity resolution. Other rows use Mass/kg, including purchased deionised water. 1 kWh = 3.6 MJ; 1 t = 1000 kg. Other mass-volume conversion requires measured state-dependent density, gas composition, absolute pressure, temperature, dry/wet state and compressibility with supplier reference-basis compatibility. Native secondary flow-property factors are not densities or heating values."
  - id: physical_balances
    applies_to: "roasting"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep unallocated physical ledgers for wet mass, dry solids, Fe, S, carbon provenance, relevant trace elements and water. The illustrative pure-pyrite oxidation equation 4 FeS2 + 11 O2 -> 2 Fe2O3 + 8 SO2 establishes elemental accounting only; actual oxide phases, incomplete conversion, gangue, feed assay and gas composition control quantities. Include absorbed oxygen and split S among calcine, transferred gas, captured solids/liquor, stock and actual environmental release. No theoretical yield substitutes for measurements."
  - id: steam_state
    applies_to: "steam"
    required_property_ref:
      name: "Mass and usable net heat"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Record steam mass and state, matched return condensate/feedwater and agreed heat-transfer boundary. Compute each stream enthalpy from measured absolute pressure/temperature/quality using a valid IAPWS-IF97 region; Qnet = (sum outgoing mass*enthalpy - sum returning mass*enthalpy)/1000 when enthalpy is kJ/kg, with any unmatched water/steam explicitly balanced. For an export without condensate return, use the explicitly agreed replacement-water/feedwater reference state in the complete boundary enthalpy balance; missing reference state makes usable net heat unresolved, not zero. Distinguish net heat from gross boiler production and count steam export/internal electricity once. Identity/support property alone does not establish usable heat."
