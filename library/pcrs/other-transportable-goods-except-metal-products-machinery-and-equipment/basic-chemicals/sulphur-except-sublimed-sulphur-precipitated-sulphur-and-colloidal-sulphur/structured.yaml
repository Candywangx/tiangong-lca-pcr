published_dataset_profile:
  dataset_role: "site-specific recovery production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Explicitly qualified refinery Claus bulk molten sulfur at declared gate; only after applicable foreground collection and background linkage are complete"
  excluded_use: "Full CPC-leaf proxy; mined sulfur; solid formed sulfur; rubber formulation; unspecified sulfur production mix; regulatory or BAT compliance declaration"
  required_metadata: "all section 3 qualifiers; period; site; gate; input and supplier definitions; measured quantities; upstream and co-product decisions"
  required_quality_disclosure: "coverage, unresolved identities/provider bases, blank quantities, detection limits, uncertainty, balances, allocation sensitivity and limitations"
  update_trigger: "feed origin/composition, catalyst/Claus stages, tailgas control, degassing, market state, utility pressure or upstream allocation changes"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, PDF p.163; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "34520 label and explicit exclusions; classification does not prescribe production method"
  - id: "ec-ref-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Refining of Mineral Oil and Gas BREF (2015), §4.23.5.2.1, pp.482–485 and §4.23.5.2.4 p.496; Figure 4.53; https://eippcb.jrc.ec.europa.eu/sites/default/files/2019-11/REF_BREF_2015.pdf"
    used_for: "Claus process, sulfur pit, side species, utility/waste interfaces and stored-sulfur degassing need with oxidation/additive alternatives; no specific additive-free stripping protocol or numerical examples adopted"
  - id: "epa-ap42-sulfur-2015"
    type: "official_guidance"
    reference: "US EPA, AP-42 §8.13 Sulfur Recovery, April 2015, §§8.13.1–8.13.4, Figure 8.13-1 and Tables 8.13-1/2 footnotes; https://www.epa.gov/sites/default/files/2020-09/documents/8.13_sulfur_recovery.pdf"
    used_for: "Reaction and process map, sulfur species, oxidative controls and limitations of SO2/NOx/THC factors; no generic factor adopted"
  - id: "ec-pef-2021"
    type: "official_guidance"
    reference: "European Commission C(2021) 9332 final, Annexes 1 to 2, Annex I §4.5 pp.63–64; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Multifunctionality hierarchy and justification; methodological reference, no claim of complete PEF conformity"
  - id: "epa-method-15-2017"
    type: "official_guidance"
    reference: "US EPA, Method 15, 2 August 2017, §§1–4, 6–8, 10–13; https://www.epa.gov/sites/default/files/2017-08/documents/method_15.pdf"
    used_for: "H2S/COS/CS2 GC/FPD sampling, calibration, line loss and matrix interference; excludes SO2 and elemental sulfur vapor measurement; technical method reference, not regulatory acceptance"
  - id: "epa-method-6-2017"
    type: "official_guidance"
    reference: "US EPA, Method 6, 3 August 2017, §§1–4, 6–12; https://www.epa.gov/sites/default/files/2017-08/documents/method_6.pdf"
    used_for: "Separated SO2 absorption/titration and interference controls; not total sulfur, vapor sulfur or sulfuric-acid-mist mass; technical method reference, not regulatory acceptance"
  - id: "sulphur-degassing-1994"
    type: "literature"
    reference: "Liquid Sulphur Degassing, Sulphur No.233, July–August 1994, pp.38, 40 and 44–45, publisher-authorized AMETEK reprint; https://www.ametekpi.com/-/media/ametekpi/files/products/western-research/model-881/liquid-sulfur-degassing.pdf"
    used_for: "Additive-free air stripping with steam ejector/preheater utilities; closed weighed samples and liquid-sulfur FTIR for separate dissolved H2S/H2Sx; no copied operating defaults, purity/moisture assay or zinc-absorption chemistry"
  - id: "jrc-ilcd-lci-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance, first edition March2010, sections7.4.2.6–7 and7.4.2.9, printed pp.200–204 / PDF pp.220–224. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Complete operational/service cycle and matching-period reference scaling only. Historical stock/cohort burden vectors, once-only raw-stock reconciliation and nonpositive-output hold are this PCR consistency implementation, not a literal handbook ledger or formula. No site quantity, recipe, emission factor, gate choice or default allocation."
  - id: "tesoro-molten-sulfur-2018"
    type: "literature"
    reference: "Tesoro Refining & Marketing Co., Sulfur, Molten SDS 888100004468, revision 2.02, 24 July 2018, §1 p.1; https://www.marathonpetroleum.com/content/documents/Operations/Tesoro_SDS/Sulfur__Molten_SDS_Tesoro.pdf"
    used_for: "Producer product/state identity as refining byproduct only; no site quantities, universal assay, acceptance threshold or actual receiver link"
  - id: "mmlp-sulfur-services-2025"
    type: "literature"
    reference: "Martin Midstream Partners L.P., 2025 Form 10-K, Sulfur Services Segment pp.9–10 and revenue recognition; https://www.sec.gov/Archives/edgar/data/1176334/000117633426000012/mmlp-20251231.htm"
    used_for: "Independent receiving-operator context: refinery molten collection, transport/storage service contracts and separate formed states. Boundary implementation requires actual site handoff and supplier coverage; no operating defaults or producer/receiver link inferred"
