allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "foreground_burden_allocation"
    rule: "Keep recovery-stage direct burdens separate from shared refinery services; first investigate subdivision or system expansion, then a justified relevant physical relationship, finally another justified relationship such as period-specific economic value. Record rejected alternatives, function/basis and sensitivity. Do not use sulfur/steam mass ratio as an unexamined physical relationship."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_ledger
    applies_to: "foreground_burden_allocation"
    rule: "Preserve physical outputs at their measured amounts. Allocate only shared environmental burdens in a separate ledger; fractions close to one within declared precision. Do not multiply physical sulfur/steam/waste outputs by shares, or both allocate and subtract the same steam substitution credit. No credit for hypothetical avoided sulfur emissions or assumed refinery desulfurisation service."
    source_ids:
      - ec-pef-2021
      - ec-ref-bref-2015
  - rule_id: allocation_upstream
    applies_to: "foreground_burden_allocation"
    rule: "An acid gas by-product or waste designation alone never establishes zero upstream burden. State the refinery boundary and inherited allocation decision; retain treatment responsibility and background consistency. Export steam requires a real receiver and compatible useful-energy definition before claiming a function."
    source_ids:
      - ec-pef-2021
      - ec-ref-bref-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "sru"
      flow_role: "accepted product"
      record_type: "measured_record"
      raw_fields: "SKU; lot; delivery temperature; gross/tare; accepted net product mass; dry elemental-S assay and method; moisture and method; dissolved H2S and hydrogen polysulfides separately; sample point/time; seal and sample mass; elapsed time to analysis; inventory opening/closing; rejected lots ; matched route/grade/state period and unique lot history; first production release R; outward molten product D_gross before return netting; actual received returns U; original dispatch/burden reversal; unique accepted net delivery Q; opening/closing raw/WIP/FG mass and original-unit per-exchange carried burden vectors; failed/zero-output/idle/cleaning/rework records; row_id; current-activity basis (gross receipts or stock-reconciled issues/consumption); linked raw receipt/issue/return reconciliation IDs; raw-stock adjustment already applied flag; original-unit same-exchange vector/lot/stage provenance; physical return U versus original delivery/burden reversal IDs; refiner and physical receiver; first accepted handoff location/time/meter; outsourced pre-gate supplier scope, stocks, heat, loss and covered service exchanges"
      collection_method: "Use calibrated loading mass meters or traceable calibrated weighbridge records and lot acceptance tests; reconcile tanks, dispatch and stock change. For dissolved H2S/H2Sx use promptly sealed, weighed sulfur samples and separately calibrated liquid-sulfur FTIR responses described in sulphur-degassing-1994, p.44; preserve raw spectra and sampling/analysis delay. This is not an elemental-S purity or moisture assay, nor a gas-space H2S measurement. Supply the applicable matrix-specific elemental-S and moisture procedures before asserting analytical completeness. Preserve all raw mass/acceptance/carried-burden records undivided, distinguish actual accepted net delivery Q from first release R and retain complete failed/zero-output campaign records. period_normalization owns the sole reporting division."
      unit: "kg"
      frequency: "each delivery and lot"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; laboratory method; acceptance and dispatch records; first release and physical handoff; outsourced supplier coverage and once-only burden ledger"
    - protocol_id: cp_feed
      process_id: "sru"
      flow_role: "acid gas mixture"
      record_type: "measured_record"
      raw_fields: "volume; T/P; Z; wet/dry composition; H2S; CO2; H2O; N2; identified hydrocarbons and other gases; composition closure; molecular basis; analytical method and calibration; density; period; refinery origin"
      collection_method: "Continuously meter inlet gas and sample actual composition with a validated gas analysis; convert to mixture mass from measured state/composition, preserving separate component masses. Establish an actual analytical procedure for the complete inlet matrix, including H2O and N2; reduced-sulfur GC alone does not establish complete feed composition."
      unit: "kg"
      frequency: "continuous plus representative composition sampling"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; sampling plan; gas chromatograms; upstream allocation statement"
    - protocol_id: cp_utilities
      process_id: "sru"
      flow_role: "electricity and each fuel separately"
      record_type: "measured_record"
      raw_fields: "meter id; stage; electricity kWh; gas actual and standard m3; T/P; Z; composition; NCV/GCV; supplier reference basis; stock and leaks"
      collection_method: "Use calibrated submetering and delivery reconciliation; keep each fuel separate and preserve supplier unit/conversion definitions; reconcile shared utilities with a documented attribution."
      unit: "MJ; m3; kg"
      frequency: "continuous meter totals and each delivery"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; supplier basis; conversion and attribution records"
    - protocol_id: cp_water
      process_id: "sru"
      flow_role: "each supply and return separately"
      record_type: "measured_record"
      raw_fields: "source; supply quality; mass; volume; density; temperature; return; purge; inventory"
      collection_method: "Meter each boundary inlet and return separately; reconcile water inventory and steam ledger. Circulation flow and makeup are distinct; classify receiving utility versus environmental release."
      unit: "kg"
      frequency: "continuous totals and sample campaigns"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; water analysis; utility receiving record"
    - protocol_id: cp_steam
      process_id: "sru"
      flow_role: "imported and exported steam separately"
      record_type: "measured_record"
      raw_fields: "mass; P; T; dryness; enthalpy; inlet/return conditions; condensate mass; external receiver; internal use; vents"
      collection_method: "Meter both directions independently; derive enthalpy from traceable actual state and reconcile condensate return. Declare receiver-compatible net delivered heat; unknown states remain missing."
      unit: "kg"
      frequency: "continuous totals and operating-state records"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; actual state; receiver and property basis"
    - protocol_id: cp_catalyst
      process_id: "sru"
      flow_role: "activated-alumina catalyst"
      record_type: "measured_record"
      raw_fields: "manufacturer; SKU; formulation; support; binder; charge; replacement; operating campaign; grade; stage"
      collection_method: "Weigh actual new charges and removed material; prorate campaign replacement against the documented sulfur production covered by that campaign, rather than a recipe default."
      unit: "kg"
      frequency: "each charge/replacement"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase; grade certificate; replacement and campaign attribution"
    - protocol_id: cp_air
      process_id: "sru"
      flow_role: "atmospheric air"
      record_type: "measured_record"
      raw_fields: "blower flow; P; T; humidity; composition; density; degassing air; period"
      collection_method: "Meter ambient air at actual state and convert volume to mass with actual density, including process and degassing air; retain carrier N2/O2 in the physical gas balance."
      unit: "kg"
      frequency: "continuous/representative operating measurements"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "blower meter; actual state and conversion"
    - protocol_id: cp_waste
      process_id: "sru"
      flow_role: "each waste separately"
      record_type: "measured_record"
      raw_fields: "waste id; wet mass; dry solids; sulfur; water; contamination; hazardous status; receiver; treatment; campaign"
      collection_method: "Weigh each segregated shipment and sample actual composition; reconcile stock changes and campaign waste; do not duplicate constituents as shipments or assume generic treatment."
      unit: "kg"
      frequency: "each shipment and representative sampling"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; analysis; waste transfer and treatment evidence"
    - protocol_id: cp_emissions
      process_id: "sru"
      flow_role: "each atmospheric species separately"
      record_type: "measured_record"
      raw_fields: "release point; species/CAS; phase; size fraction; concentration; detection limit; dry/wet gas flow; T/P; O2 correction; duration; bypass; uncertainty"
      collection_method: "For final stack H2S/COS/CS2 use EPA Method 15 GC/FPD with its sample-line recovery, CO/CO2 interference, moisture and calibration checks; for SO2 use Method 6 separated absorption/titration with its interference controls or a documented matrix-validated equivalent. These methods do not quantify elemental sulfur vapor or prove gas/particle separation. Use actual validated stack/fugitive measurements with matched gas-flow basis and operating coverage; document a separate applicable method for each remaining species and release point. Convert species concentration and flow to actual mass; preserve raw total NOx/THC data without pretending they resolve species. Include startup, shutdown and bypass."
      unit: "kg"
      frequency: "continuous SO2/gas-flow where available; representative tests and fugitive assessment"
      temporal_coverage: "declared representative period and same product coverage"
      site_scope: "recovery unit and declared utility interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "method; instrument calibration; sampling coverage; detection limits; speciation and uncertainty"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Q is unique positive actual accepted net molten-product delivery kg at the declared recovery-unit gate, excluding tare; first production release R is a separate record. Use the complete matched route/grade/state period, including failed/zero-output, startup/shutdown, idle, turnaround, rejected, cleaning and rework activity. Reconcile physical molten/WIP/FG stocks, outward dispatch D_gross before return netting, actual received returns U and losses/removals separately; derive net accepted Q once without double returns. Construct each original-unit attributable burden numerator from the once-reconciled current-activity contribution plus separately evidenced opening WIP/FG carried vectors and traced return carry after original reversal, minus independently evidenced closing WIP/FG carry and justified other-cofunction assignments. Preserve full physical sulfur/steam/waste/gas outputs independently of burden shares; physical stock kg is not an energy/burden vector. period_normalization alone reports numerator / Q after conversion/carry attribution; all cards/protocol aggregation labels denote that same operation, never collection division. For Q<=0 or unresolved cohort/carry attribution retain all raw burdens/stocks and report no unit result; do not erase failed campaigns or borrow another cohort denominator. This accounting clarification supplies none of the still-missing product-assay, inlet-mixture or vapor/particle analytical methods. For each material/feed row affected by raw stocks, record whether current activity is gross external receipts at the chosen raw-material gate or an already stock-reconciled issued/charged/consumed quantity under its linked protocol. Reconcile receipts, external returns and opening/closing raw stock exactly once. If current activity is already that reconciled issue/consumption, do not again add opening raw-stock carry or subtract closing raw-stock carry; attach the original source/lot burden represented by that issue once rather than creating another purchase. If a row instead starts from gross receipts, use its raw-stock reconciliation once to derive the issued contribution, and do not also treat the resulting issues as another addition. Apply the separately evidenced WIP/FG cohort bridge at the unchanged declared product gate only after this raw-material step. Complete carried vectors contain each original exchange in its own unit and lot/stage provenance, not physical stock kg or an impact score. Physical return receipt U and its inherited stock vector are distinct from the signed correction of the original delivery and original burden vector: identify both events and apply each once; do not reverse again if already included in the reported net correction. Unresolved activity basis, stock/transfer linkage or original return vector makes the normalized result incomplete; retain raw records without a finite unit result. Other metered inputs and physical outputs retain their own verified raw measurement basis; do not invent raw-stock adjustments for them."
      inputs:
        - "period exchange totals"
        - "accepted net sulfur-product mass"
      output: "row amount per 1 kg reference flow"
      source_ids:
        - ec-ref-bref-2015
        - jrc-ilcd-lci-2010
    - id: physical_balances
      applies_to: "sru"
      rule: "For gross mass and each elemental S/C/H/O/N ledger, inputs minus outputs minus closing-minus-opening stock equal the closure residual. Convert each identified component to element mass using its actual chemical formula and measured component mass; whole-product mass is not elemental-S mass. Retain reaction water in the H/O and water ledgers; include feed CO2/H2O/N2, fuel composition, all air components, final N2/O2 and other carriers, sulfur vapor, particles, dissolved sulfur species, waste moisture and catalyst stock. Keep component attributes separate from whole-mixture exchanges to prevent duplicate mass. Report every fate, measurement uncertainty and unresolved component; do not force closure or assume recovery yield."
      inputs:
        - cp_feed
        - cp_product
        - cp_steam
        - cp_water
        - cp_waste
        - cp_emissions
        - cp_air
        - cp_utilities
      output: "unallocated physical ledger and residual"
      source_ids:
        - epa-ap42-sulfur-2015
        - ec-ref-bref-2015
    - id: usable_steam
      applies_to: "steam_import; steam_export"
      rule: "Compute actual usable heat from delivered steam mass and actual supply/receiver/return enthalpy with explicit reference conditions; disclose vents, condensate and loss. Missing state/provider definitions block a heat claim."
      inputs:
        - cp_steam
        - cp_water
      output: "separate actual heat ledger"
      source_ids:
        - ec-ref-bref-2015
    - id: energy_stock_ledger
      applies_to: "sru"
      rule: "Reconcile electricity, each fuel on its measured NCV/GCV basis, material and steam/condensate enthalpy inflows/outflows, chemical conversion energy, rejected heat and changes in stored material/thermal energy on explicit common reference states. Keep gross imports/exports and losses separately; internal heat recovery is not another external energy output. Missing thermodynamic/composition evidence remains unresolved; never use a fixed heat-recovery credit or steam enthalpy."
      inputs:
        - cp_utilities
        - cp_feed
        - cp_product
        - cp_steam
        - cp_water
        - cp_emissions
        - cp_waste
      output: "unallocated energy/stock ledger and residual"
      source_ids:
        - ec-ref-bref-2015
        - epa-ap42-sulfur-2015
    - id: species_release
      applies_to: "sru"
      rule: "Integrate measured species concentration times matching actual gas flow over represented operation; undo reporting oxygen correction and reconcile dry/wet conditions explicitly before mass conversion. Do not replace species by total NOx, THC or SOx observations."
      inputs:
        - cp_emissions
      output: "actual species mass and uncertainty"
      source_ids:
        - epa-ap42-sulfur-2015
  data_quality_requirements:
    - id: q_identity
      applies_to: "all inventory rows"
      requirement: "Verify physical identity separately from supplier/background quantity basis; blank UUID or unknown pressure/composition cannot establish a complete linked dataset."
      evidence: "specification; provider definition"
    - id: q_period
      applies_to: "sru"
      requirement: "Use a documented representative period covering steady operation, startup, shutdown, turnaround and exceptional releases; align product, waste and utility attribution, disclose missing modes."
      evidence: "operating log; meter coverage"
    - id: q_no_defaults
      applies_to: "sru"
      requirement: "BREF illustrative utility/yield/CO2 cases, EPA recovery/emission tables and producer market statements are not this site’s activity quantities or default factors; retain real tests, uncertainty and detection limits."
      evidence: "original method limits and actual collection"
validation_rules:
