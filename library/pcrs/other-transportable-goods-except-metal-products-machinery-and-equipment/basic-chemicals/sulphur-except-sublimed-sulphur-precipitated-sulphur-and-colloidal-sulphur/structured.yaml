      rule: "| boundary_first_release | Fix the reference gate at the first externally accepted bulk molten refinery-product handoff after the declared recovery, degassing, heated holding and loading stages. Record first saleable production release R separately from accepted net gate delivery Q. Internal tank movements, trading, title transfers and resale are not new production. Identify the actual refiner, recovery operator, outsourced degassing/storage/loading provider and physical receiver, their locations, timestamps, meters and responsibility cutoffs. Include pre-gate provider heat, losses, stocks, transport and services once, reconciling any supplier dataset already covering them. Post-gate receiving terminal storage, transport and forming are outside this product gate. Public producer and receiver documents do not establish a trading link between them. Unknown handoff, service scope or supplier coverage prevents a complete unit result. | tesoro-molten-sulfur-2018; mmlp-sulfur-services-2025 | | boundary_bulk_equipment | Bulk molten delivery uses no disposable product packaging or pallet pool. Tanker tare is excluded from product kg; attributable equipment/transport service burdens within the gate remain included once. If the actual system uses drums, bags or pallets, this bulk-only inventory is insufficient: define each component as an atomic exchange and reconcile purchases, first non-purchased external receipts (including incoming goods, loans and free transfers regardless of supplier coverage), genuine returns traced to the same item previously dispatched from this site, outward movements and opening/closing stock. Assign each physical movement and each actually incurred purchase/transport/service burden once; absent supplier coverage stays unresolved. | mmlp-sulfur-services-2025; jrc-ilcd-lci-2010 |"
