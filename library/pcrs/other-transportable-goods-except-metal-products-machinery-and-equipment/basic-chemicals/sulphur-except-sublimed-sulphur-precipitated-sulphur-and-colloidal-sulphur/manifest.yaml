  background_basis_requirements:
    - Natural gas supplier m3 state/composition/Z and provider basis must be
      collected; secondary mass coefficient is not density.
    - Actual steam pressure/temperature/dryness and receiver/condensate return
      enthalpy must be collected; generic mass UUID is not proof of
      useful-energy delivery.
    - Refinery acid-gas upstream burden and product specification require actual
      foreground/provider records.
    - Actual electricity voltage/geography/supplier identity and native property
      require direct verification; meter Energy is not proof of supplier net
      calorific value.
    - First saleable release, physical refinery gate handoff and outsourced
      pre-gate service coverage require actual records; public sources do not
      establish a specific refinery-to-receiver transaction.
  classification_decision: Accepted narrower scope under docs/adr/2026-11-21-accept-cpc-34520-bulk-molten-refinery-recovered-sulfur.md.
  scientific_review: Scientific approval and formal translation review remain pending.
    This record retains its candidate lifecycle.
  unresolved_methodology:
    - blocker_id: analytical-product-assay
      reason: The cited closed-sample/FTIR procedure establishes dissolved H2S/H2Sx
        analysis, not a source-backed complete molten-lot elemental-S purity and
        moisture assay. Representative sampling and matrix-specific assay
        procedures remain unestablished.
    - blocker_id: analytical-sulfur-phase
      reason: No retrieved original method establishes quantitative
        separation/recovery of emitted elemental sulfur vapor from
        sulfur-bearing particulate at the declared final release points. EPA
        Method 15 treats elemental sulfur condensation as an interference;
        Method 6 removes particulates and measures SO2. The existing
        sulfur_vapour_air and pm_air exchanges remain concrete and unsuppressed.
    - blocker_id: analytical-inlet-mixture
      reason: Complete wet/dry H2S/CO2/H2O/N2 acid-gas composition is required, but
        the source set does not yet establish an inlet-matrix
        analytical/sampling procedure for all components. Reduced-sulfur GC
        alone and an H2S component-mass UUID do not establish whole-mixture
        identity or quantity.
  native_identity_cautions:
    - row_id: natural_gas
      reason: Pinned original of historical UUID is Natural gas, high pressure with
        Mass/kg, not the historical volume interface. Actual supplier
        mixture/state and compatible volume identity remain unresolved.
    - row_id: sulfur_vapour_air
      reason: Pinned original identifies elemental sulfur, emission to air unspecified
        and Mass/kg; vapor phase is a required measured qualifier, not
        established by this generic name.
