        - ec-lvic-aaf-2007
        - epa-ap42-nitric-1998
    - rule_id: boundary_external
      applies_to: "foreground boundary"
      rule: "Purchased utility generation and external waste treatment are linked provider units; do not also import their emissions as direct acid-plant exchanges. A separately expanded onsite boiler or wastewater plant needs its own complete measured inventory."
      source_ids:
        - ec-lvic-aaf-2007
        - epa-ap42-nitric-1998
    - rule_id: boundary_actual
      applies_to: "foreground boundary"
      rule: "Report actual normal operation, startup, shutdown, bypass and catalyst ageing; assumed BAT installation or efficiency cannot substitute for observation. A missing applicable exchange is unresolved, not zero."
      source_ids:
        - ec-lvic-aaf-2007
