    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reference amount is whole accepted solution net mass; use cp_product. Determine active HNO3 and carrier-water masses from measured mass fractions, retaining impurities separately."
