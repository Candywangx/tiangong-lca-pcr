allocation_rules:
  - rule_id: allocation_physical
    applies_to: "foreground boundary"
    rule: "Keep the full physical process graph and conservation ledger separate from the allocated environmental-burden ledger. Allocation never multiplies the actual acid or steam outputs or internal transfer quantities by a burden share."
    source_ids:
      - ec-ilcd-allocation-2010
  - rule_id: allocation_hierarchy
    applies_to: "foreground boundary"
    rule: "First assign separately metered operations to their functions and document subdivision; for remaining shared burdens justify a determining physical causal relationship per exchange. If that relationship cannot be established, use documented gate economic values with quantity and price for each actual useful co-product over one consistent period. Retain sensitivity, price source, transfer-price treatment and zero/negative-price justification."
    source_ids:
      - ec-ilcd-allocation-2010
  - rule_id: allocation_exports
    applies_to: "foreground boundary"
    rule: "Exported steam needs a real user, compatible quality and measured net useful delivery; atmospheric venting is an emission, not a co-product. Report gross imports and exports, never presume a substitution credit. A system-expansion study requires separately evidenced displaced function and dataset and must not be combined with allocation for the same credit. Waste handling remains a treatment obligation unless a separately justified co-function exists."
    source_ids:
      - ec-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "nitric_manufacture"
      flow_role: "accepted acid"
      record_type: "batch assay/weighing"
      raw_fields: "lot; grade; net solution mass; HNO3 fraction w; carrier-water fraction; impurity fractions; stock; accepted/rejected quantities"
      collection_method: "Calibrated net weighing or mass flowmeter; representative traceable validated HNO3/water/impurity assay and customer acceptance; reconcile production, loading and inventory"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_material
      process_id: "nitric_manufacture"
      flow_role: "external material"
      record_type: "meter/purchase/assay"
      raw_fields: "row_id; stage; material identity; whole supplied mass; concentration; composition; meter; receipts; stock"
      collection_method: "Calibrated weighing/metering and receipts; reconcile opening stock plus purchases minus closing stock and returns; keep each material separate"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_volume
      process_id: "nitric_manufacture"
      flow_role: "gas supply"
      record_type: "volume meter and gas assay"
      raw_fields: "row_id; volume; T; absolute P; wet/dry basis; composition; compressibility; provider m3 definition"
      collection_method: "Record corrected-volume meter calibration and supplier definition; retain an evidenced conversion with original and converted quantities"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_air
      process_id: "nitric_manufacture"
      flow_role: "ambient air"
      record_type: "intake meter/gas balance"
      raw_fields: "primary/secondary air volumes; T; P; humidity; composition; gas analysis; internal recycle"
      collection_method: "Calibrated intake metering or validated gas balance; distinguish fresh air from recycled gas and include measured humidity"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_energy
      process_id: "nitric_manufacture"
      flow_role: "purchased electricity"
      record_type: "submeter and invoice"
      raw_fields: "kWh; voltage; stage; grid/provider; losses boundary; turbine work; dates"
      collection_method: "Calibrated purchased-electricity meter and disjoint submeters; reconcile invoice and internal work without netting export credits"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_steam
      process_id: "nitric_manufacture"
      flow_role: "steam/water transfers"
      record_type: "flow and thermodynamic measurements"
      raw_fields: "row_id; sender/receiver; steam mass; T; gauge/absolute P; quality; enthalpy; return mass/enthalpy; provider heat basis"
      collection_method: "Calibrated flowmeter and state measurements; validated IAPWS-IF97 water/steam thermodynamic method within its applicable domain, with absolute pressure, reference state, h in kJ/kg, unreturned-water endpoints and disjoint losses; match physical endpoints, heat delivered and actual return"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_catalyst
      process_id: "nitric_manufacture"
      flow_role: "one catalyst formulation"
      record_type: "replacement and life record"
      raw_fields: "row_id; supplier grade; composition; metal assay; installed/replaced mass; dates; useful-life acid output; recovery"
      collection_method: "Weigh each actual supplied formulation and gross return/removal separately; reconcile stored and in-service mass, installation/replacement and metal losses; retain gross physical transfers for the collection period and attribute upstream lifetime burdens separately across evidenced useful-life output"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_waste
      process_id: "nitric_manufacture"
      flow_role: "one waste stream"
      record_type: "transfer note and assay"
      raw_fields: "row_id; wet mass; dry solids; chemical/metal composition; stock; receiver; destination; treatment"
      collection_method: "Calibrated weighing/metering with representative chemical assay and signed transfer; record whole waste separately from its constituent masses"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_emission
      process_id: "nitric_manufacture"
      flow_role: "one air species"
      record_type: "speciated monitoring and gas-flow record"
      raw_fields: "row_id; CAS/species; source/stack; concentration; actual/standard gas volume; T/P; moisture; duration; detection limit; calibration; bypass; carbon origin"
      collection_method: "Validated species-specific monitoring with matched gas-flow basis and time integration; include startup/shutdown; separate after-treatment releases from before-treatment diagnostics"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_balance
      process_id: "nitric_manufacture"
      flow_role: "physical stage transfers"
      record_type: "stage and tank balance"
      raw_fields: "time; sender/receiver; whole wet stream mass; component composition; elemental N/O/H/C; N2/H2O reaction terms; stored/in-service stock; air; utilities; disjoint endpoints"
      collection_method: "Match both ends of each internal link; close total mass and elemental N/O/H and relevant C with stock changes; reconcile N2/H2O species using reaction terms; keep whole streams and nested composition totals distinct from additive exchanges and burden allocation"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
    - protocol_id: cp_allocation
      process_id: "nitric_manufacture"
      flow_role: "useful coproduct function"
      record_type: "submeter, sale and causal study"
      raw_fields: "function; direct burden; shared burden; quantities; useful heat; gate prices; period; physical-causality model; uncertainty"
      collection_method: "Retain physical ledger plus subdivided burden assignments; demonstrate causal relation or gate values and sensitivity before computing shares"
      unit: "kg; m3; MJ; measured fraction as applicable"
      frequency: "Each batch/transfer; continuously for operating meters"
      temporal_coverage: "Representative complete catalyst campaign including all operating states"
      site_scope: "One declared train/site and matched upstream/receiver boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; originals; assay QA; coverage and uncertainty; reconciled stocks"
  calculation_rules:
    - id: campaign_basis
      applies_to: "all inventory rows"
      rule: "Divide each measured physical campaign boundary exchange by the same measured accepted net solution output in kg; preserve original quantities, stock adjustments and units. gate_acid is 1 kg."
      inputs:
        - cp_product
        - "all row protocols"
      output: "Each exchange per 1 kg reference flow"
      source_ids: []
    - id: solution_components
      applies_to: "gate_acid"
      rule: "For each lot: active HNO3 mass = whole solution mass × measured HNO3 mass fraction; carrier water = whole solution mass × measured water fraction; record impurities separately. Sum lot component masses before taking a weighted fraction; do not add components as extra product outputs."
      inputs:
        - cp_product
      output: "Component ledger for the same accepted solution"
      source_ids: []
    - id: mass_concentration
      applies_to: "all elementary air output rows"
      rule: "When concentration is mg/m3 on the same gas basis as volume: species kg = sum(concentration × gas volume) / 1000000. For ppmv use a documented molecular/volume conversion at measured T/P/moisture; no unverified normal-volume constant. Normalize only after integration."
      inputs:
        - cp_emission
        - cp_product
      output: "Species kg per 1 kg reference flow"
      source_ids: []
    - id: steam_enthalpy
      applies_to: "steam_import; steam_export; condensate_return; condensate_received"
      rule: "For each matched supply/user pair, delivered useful heat in MJ = [steam kg × supply h − returned-condensate kg × return h − unreturned-water kg × evidenced endpoint h] / 1000 − losses in MJ outside the metered endpoints. h is kJ/kg from measured absolute pressure, temperature and steam quality using a validated IAPWS-IF97 implementation within its water-state domain. Retain all other physical outlets and stock changes, with their energy terms; do not assume equal return mass. Declare each endpoint/reference state and exclude losses already reflected in endpoint measurements. Keep gross physical kg rows, useful heat and compatible provider energy reference separate; unknown state or provider basis blocks that heat/link calculation."
      inputs:
        - cp_steam
        - cp_product
      output: "Measured net heat ledger; compatible provider linkage"
      source_ids:
        - iapws-if97-2012
    - id: economic_share
      applies_to: "shared environmental burdens"
      rule: "Only residual burdens without demonstrated physical causality: value_i = delivered quantity_i × gate price_i; share_i = value_i / sum(value_j); apply share_i to those burdens only, never physical output. Require positive total value and documented treatment of zero/negative values."
      inputs:
        - cp_allocation
      output: "Allocated burden ledger and sensitivity"
      source_ids:
        - ec-ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve actual CAS, mixture composition, route, state, medium and reference property; empty UUID is explicit debt, not proof of absence"
      evidence: "Supplier original and exact identity read"
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "Document applicable/absent/unmeasured separately; add actual omitted atomic exchanges before using a complete dataset claim"
      evidence: "cp_balance; equipment and procurement ledger"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Align mass/energy/emission numerator and solution denominator across production, catalyst replacement, downtime and stocks"
      evidence: "Traceable originals; campaign coverage"
    - id: dq_limits
      applies_to: "all source-derived statements"
      requirement: "Preserve original pressure/concentration/unit/basis and historic/case limits; no universal recipe, yield or emission factor imported"
      evidence: "Source locators and foreground protocols"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground boundary"
    rule: "Require one gate_acid quantitative reference, whole-solution kg and compatible measured 60% grade; verify native property/unit chain. No same-UUID intermediate output duplicates."
    source_ids:
      - ec-lvic-aaf-2007
      - epa-ap42-nitric-1998
  - rule_id: validate_balance
    applies_to: "foreground boundary"
    rule: "Check internal-link equality, total physical mass and elemental N/O/H and relevant C conservation before allocation, including air pass-through, waste and stored/in-service stock. N2/H2O species balances include formation/consumption reaction terms; whole wet streams and nested constituent totals must not be added twice. Investigate residuals within measured uncertainty; no fixed closure tolerance invented."
    source_ids:
      - ec-lvic-aaf-2007
      - epa-ap42-nitric-1998
  - rule_id: validate_species
    applies_to: "foreground boundary"
    rule: "NO, NO2 and N2O are independent masses; do not add NOx aggregate to NO/NO2 or use assumed NO2-equivalent speciation. Unknown basis remains pending. HNO3 mist is specific HNO3 mass, not automatically PM; nested particulate intervals cannot be cumulatively added."
    source_ids:
      - ec-lvic-aaf-2007
      - epa-ap42-nitric-1998
  - rule_id: validate_utilities
    applies_to: "foreground boundary"
    rule: "Verify gas m3 conditions and provider reference, actual steam pressure/enthalpy/return and grid voltage; UUID identity alone cannot establish an upstream dataset amount basis."
    source_ids:
      - ec-lvic-aaf-2007
      - epa-ap42-nitric-1998
  - rule_id: validate_configuration
    applies_to: "foreground boundary"
    rule: "Reject a complete-inventory claim when an actual reagent, catalyst, filter waste, direct liquid emission or packaged component lacks its individual account. Record real abatement, bypass and all waste receivers; successful identity retrieval is not a complete plant dataset."
    source_ids:
      - ec-lvic-aaf-2007
      - epa-ap42-nitric-1998
  - rule_id: validate_allocation
    applies_to: "foreground boundary"
    rule: "Keep co-product physical quantities unchanged; verify allocated burdens reconcile to the full burden total and exclude duplicate export/substitution credit. Resolve scientific applicability independently before approval."
    source_ids:
      - ec-ilcd-allocation-2010
