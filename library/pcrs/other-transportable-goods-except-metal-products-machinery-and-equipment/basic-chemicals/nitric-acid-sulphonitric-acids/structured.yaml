system_boundary:
  rules:
    - rule_id: boundary_train
      applies_to: "foreground boundary"
      rule: "Include actual evaporation, filtration, compression, oxidation, heat recovery, condensation, absorption, bleaching, tailgas treatment, storage and bulk loading within one foreground unit; the stage ledger remains independently measured."
