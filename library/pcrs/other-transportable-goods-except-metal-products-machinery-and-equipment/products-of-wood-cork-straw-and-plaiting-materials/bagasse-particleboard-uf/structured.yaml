measurement_rules:
  - id: reference_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Net solid board volume after trimming at declared gate moisture, not stacked/bulk volume. cp_output measures length × width × thickness for each accepted grade, excludes gaps, rejected boards and packaging."
  - id: moisture_basis
    applies_to: "bagasse_input; bagasse_fuel; raw_fines; trim"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record both wet-basis water fraction w and dry-basis ratio u with explicit methods. Dry solids = wet mass × (1 − w); u = w/(1 − w). Never apply literature moisture or density to site lots."
  - id: gas_volume
    applies_to: "gas"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Convert metered gas to supplier reference T/P and wet/dry basis with documented composition/compressibility. Unknown background m3 definition prevents quantitative linking."
  - id: electricity_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "The verified electricity property uses MJ; 1 kWh = 3.6 MJ. This is electrical energy, not a combustion heat default."
