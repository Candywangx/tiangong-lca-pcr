allocation_rules:
  - rule_id: allocation_supplier
    applies_to: "bagasse_input; bagasse_fuel"
    rule: "Investigate subdivision or system expansion first. This single-board attributional result retains a declared scope without unproven substitution credit. Where allocation remains at sugar/ethanol extraction, use a defensible physical causal relationship before documented economic allocation; justify rejected options and remain consistent with the supplying study. Record all co-product quantities, prices, time window and rationale. Do not derive zero from the word residue or from carbon neutrality."
    source_ids:
      - ec-ef-allocation-2021
      - epa-bagasse-combustion-1996
  - rule_id: allocation_foreground
    applies_to: "manufacturing"
    rule: "Separate useful exported pith fuel from discarded raw fines and cured resin waste. Subdivide meters when possible; remaining shared environmental burdens use documented causal allocation or otherwise economic shares from net delivered quantities × consistent prices. Present sensitivity where residue status/prices change."
    source_ids:
      - ec-ef-allocation-2021
      - epa-bagasse-combustion-1996
  - rule_id: allocation_physical
    applies_to: "manufacturing"
    rule: "Keep unallocated physical process graph and material/water/carbon balances alongside the allocated environmental burden account. Never multiply co-product physical output or internal transfer mass by an allocation fraction; no internal recycle credit or double burden."
    source_ids:
      - brito-bagasse-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "manufacturing"
      flow_role: "finished_board"
      record_type: "Measured primary records"
      raw_fields: "Grade; batch; accepted quantity; length; width; thickness; moisture; density; tests; packaging tare"
      collection_method: "Calibrated dimension and mass measurements after conditioning; lot acceptance and test records. Compute accepted net board volume; separate grades and rejected boards."
      unit: "m3"
      frequency: "Every accepted lot"
      temporal_coverage: "Same complete declared period"
      site_scope: "Same site and declared recipe/grade"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; traceability; matched stocks and accepted volume; uncertainty"
    - protocol_id: cp_inputs
      process_id: "manufacturing"
      flow_role: "bagasse_input; film"
      record_type: "Measured primary records"
      raw_fields: "Receipt and stock quantities; supplier/location/year; moisture; extraction route; transport mode/distance/load; contract/value; film grade/mass"
      collection_method: "Calibrated weighing and matched invoices, receipts, stock reconciliation and supplier inventory. Include inbound transport in each supplied material background or a separately verified transport exchange, once."
      unit: "kg"
      frequency: "Every receipt and stock close"
      temporal_coverage: "Same complete declared period"
      site_scope: "Same site and declared recipe/grade"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; traceability; matched stocks and accepted volume; uncertainty"
    - protocol_id: cp_recipe
      process_id: "manufacturing"
      flow_role: "uf_resin; hardener; wax"
      record_type: "Measured primary records"
      raw_fields: "Delivered and dosed mass; solids fraction; formulation; purity; free formaldehyde; water fraction; losses; supplier reference basis"
      collection_method: "Batch dosing records, calibrated scales, formulation/SDS and supplier primary records. Verify solids analytically; reconcile received/dosed/stock/lost mass. Record every additional constituent separately."
      unit: "kg"
      frequency: "Every batch"
      temporal_coverage: "Same complete declared period"
      site_scope: "Same site and declared recipe/grade"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; traceability; matched stocks and accepted volume; uncertainty"
    - protocol_id: cp_stage
      process_id: "manufacturing"
      flow_role: "internal transfers"
      record_type: "Measured primary records"
      raw_fields: "Stage id; linked source/destination; wet and dry mass; moisture method; water; carbon fraction; rejects; storage duration; particle grade; press temperature/pressure/time"
      collection_method: "Weigh and sample at receipt, depithing, dryer inlet/outlet, blending, press exit, conditioning and trim. Record internal recycle/boiler transfers at equal endpoints. Maintain separate raw and resin-bearing residues."
      unit: "kg"
      frequency: "Each stage/batch and period stock close"
      temporal_coverage: "Same complete declared period"
      site_scope: "Same site and declared recipe/grade"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; traceability; matched stocks and accepted volume; uncertainty"
    - protocol_id: cp_energy
      process_id: "manufacturing"
      flow_role: "electricity; gas; bagasse_fuel"
      record_type: "Measured primary records"
      raw_fields: "Delivery voltage; stage meters; kWh; gas m3/T/P/composition/Z; fuel wet mass/moisture/LHV or HHV; boiler type/load/control; steam supply/return mass, T/P/enthalpy; losses"
      collection_method: "Reconcile plant and stage meters with bills and fuel stocks; measure drying and press cycles independently. Steam heat is mass × supply-minus-return enthalpy with condensate/blowdown/loss reconciliation, not fuel energy or gross steam enthalpy."
      unit: "MJ; m3; kg"
      frequency: "Continuous meters and every fuel lot"
      temporal_coverage: "Same complete declared period"
      site_scope: "Same site and declared recipe/grade"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; traceability; matched stocks and accepted volume; uncertainty"
    - protocol_id: cp_residues
      process_id: "manufacturing"
      flow_role: "pith_coproduct; pith_waste; raw_fines; trim; cured_dust; ash_bottom; ash_fly"
      record_type: "Measured primary records"
      raw_fields: "Stage; actual mass/moisture; resin content; raw/cured state; internal recycle; export destination; treatment; contract/revenue"
      collection_method: "Calibrated bins/scales and dispatch/treatment receipts. Identify bottom and fly ash streams and sum only compatible ash records. Separate sold pith from discarded fines and on-site transfers."
      unit: "kg"
      frequency: "Each discharge/dispatch"
      temporal_coverage: "Same complete declared period"
      site_scope: "Same site and declared recipe/grade"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; traceability; matched stocks and accepted volume; uncertainty"
    - protocol_id: cp_water
      process_id: "manufacturing"
      flow_role: "water; wastewater; water_vapour"
      record_type: "Measured primary records"
      raw_fields: "Stage water supply; emulsion/resin water; bagasse moisture; product water; wastewater volume/density/composition; evaporation; boiler combustion water; stocks; recycle"
      collection_method: "Meter external water and effluent; sample densities/concentrations; close stage water balance after measured retained water and stocks. Derive evaporation only with bounded uncertainty; report unexplained residual, do not force closure."
      unit: "kg"
      frequency: "Continuous meters; stage/batch sampling"
      temporal_coverage: "Same complete declared period"
      site_scope: "Same site and declared recipe/grade"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; traceability; matched stocks and accepted volume; uncertainty"
    - protocol_id: cp_air
      process_id: "manufacturing"
      flow_role: "elementary emissions"
      record_type: "Measured primary records"
      raw_fields: "Physical stage/source; species; biogenic/fossil origin; outdoor subcompartment; exhaust flow; temperature/pressure; dry/wet basis; concentration; test duration; production; control; starts/stops; PM fractions"
      collection_method: "Representative source testing and activity logs after controls, including fugitive emissions. Sum concentration × compatible exhaust volume for each stage/species. Document uncertainty and speciation; chamber grades and aggregate VOC/NOx cannot substitute for species. Carbon balance may estimate origin-specific CO2 only after other carbon outputs/stocks are measured."
      unit: "kg"
      frequency: "Representative operating modes plus continuous logs"
      temporal_coverage: "Same complete declared period"
      site_scope: "Same site and declared recipe/grade"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; traceability; matched stocks and accepted volume; uncertainty"
  calculation_rules:
    - id: volume_normalization
      applies_to: "all inventory rows"
      rule: "For each stage-tagged exchange, normalized amount = attributable period quantity / Q_vol; Q_vol = sum of accepted net board dimensions converted to m3 in the same period and grade. Retain gross measured stage totals before environmental allocation. Reference output = 1 m3."
      inputs:
        - cp_output
        - cp_inputs
        - cp_recipe
        - cp_energy
        - cp_residues
        - cp_water
        - cp_air
      output: "Exchange per reference flow"
      source_ids:
        - brito-bagasse-2021
    - id: physical_balance
      applies_to: "manufacturing"
      rule: "Before burden allocation, reconcile whole-stream mass and elemental carbon separately: opening stock + inputs = closing stock + outputs + reported residual, using actual composition and all relevant boundary crossings. Chemical reactions do not generate or consume total elemental carbon. Separately reconcile molecular H2O and reactive wood/resin components using opening stock + inputs + evidenced formation = closing stock + outputs + evidenced consumption + reported residual. Quantify only actual cure/thermal/oxidation pathways and extent; phase changes are transfers, not reactions. A zero reaction term requires evidence of absence; unknown extent remains unresolved, with no assumed full cure, generic yield or balancing emission. Track retained binder/additives and wood versus fossil carbon separately. Internal transfers cancel only with matched endpoints; measured outputs containing reaction products are counted once. Keep uncertainty explicit and do not apply burden shares to physical outputs. Keep boiler fuel, combustion air/oxygen and combustion products in a separate stage ledger; fuel oxidation is not unexplained furnish loss."
      inputs:
        - cp_stage
        - cp_recipe
        - cp_water
        - cp_residues
        - cp_air
      output: "Unallocated stage and whole-site balances with residual uncertainty"
      source_ids:
        - brito-bagasse-2021
    - id: burden_allocation
      applies_to: "manufacturing"
      rule: "Environmental burden for board = directly attributable burden + justified share × shared burden. Economic share, when needed, = board revenue / total useful-output revenue on matched net quantities/prices; include pith only when economically useful. Divide the assigned burden by Q_vol, retaining physical exports unchanged."
      inputs:
        - cp_inputs
        - cp_output
        - cp_residues
        - "supplier allocation"
      output: "Allocated burden per reference flow plus sensitivity"
      source_ids:
        - ec-ef-allocation-2021
  data_quality_requirements:
    - id: quality_route
      applies_to: "manufacturing"
      requirement: "Same sole-bagasse furnish, binder/hardener/wax route and declared market grade; test failures remain visible."
      evidence: "cp_recipe; cp_output"
    - id: quality_period
      applies_to: "manufacturing"
      requirement: "Synchronize production, recipe, meters, emissions and stock periods; segregate grade and season; disclose missing modes."
      evidence: "cp_stage; cp_energy; cp_air"
    - id: quality_background
      applies_to: "all supplied flows"
      requirement: "UUID identity success is not a complete background match. Confirm supplier geography/time, route, moisture/concentration, quantity and transport boundary before linking."
      evidence: "cp_inputs; cp_recipe; cp_energy"
validation_rules:
  - rule_id: validate_identity
    applies_to: "finished_board"
    rule: "Require one reference output of 1 m3 net board and all qualifiers; reject wood/fibre-faced, flax, bamboo and mixed-furnish substitution or grade conformity inferred from a laboratory study."
    source_ids:
      - brito-bagasse-2021
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Every row is one atomic flow with verified property/unit and physical stage. UUID gaps require explicit review; no nearby product, correction flow or wrong medium is acceptable. Additional site exchanges must be declared separately."
    source_ids:
      - brito-bagasse-2021
  - rule_id: validate_balance
    applies_to: "manufacturing"
    rule: "Require matched internal transfer endpoints and finite unallocated dry-solids/water/carbon balances with uncertainty, and a separate allocated burden ledger. Internal residues cannot appear as both new fuel purchase and recycled transfer."
    source_ids:
      - brito-bagasse-2021
  - rule_id: validate_emissions
    applies_to: "elementary emissions"
    rule: "Use outdoor-air unspecified flows only while finer outdoor location is uncharacterized, disclosed as a limitation; finer known subcompartment requires verified replacement. Keep PM2.5, 2.5–10 and >10 as mutually exclusive intervals; never add nested PM10/TSP again. Require actual NO/NO2 speciation, species mass and carbon origin. Retain biogenic CO2 in LCI; missing measurements or factors remain gaps."
    source_ids:
      - epa-bagasse-combustion-1996
      - epa-gas-combustion-2026
  - rule_id: validate_supply
    applies_to: "gas; uf_resin; bagasse_input; wax"
    rule: "Block quantitative use where gas reference m3, resin/emulsion concentration or bagasse moisture/upstream economic status is unknown. Do not claim zero burden, generic density, net heat from an MJ label, or a species emission from a reporting equivalent."
    source_ids:
      - epa-bagasse-combustion-1996
      - epa-gas-combustion-2026
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input to an interior product model after applicability review; candidate methodology does not approve a dataset"
  allowed_use: "Declared pure-bagasse UF board, same factory-gate state and verified quantity/grade"
  excluded_use: "All 31433 products as one identity; wood/ bamboo plywood proxy; automatic lifetime/end-of-life credit; compliance claims from laboratory tests"
  required_metadata: "Site/period/grade/route; all reference qualifiers; supplier/status/allocation; verified backgrounds and transport; original unallocated stage ledgers; normalization volume"
  required_quality_disclosure: "Coverage and exclusions; missing UUIDs/quantities; measurement uncertainty; outdoor compartment limitation; allocation sensitivity; scientific and translation review state"
  update_trigger: "Feedstock origin/economic status, binder/formulation, pretreatment, fuel/utility/controls, specification or temporal coverage changes"
data_sources:
  - id: "ec-ef-allocation-2021"
    type: "official_guidance"
    reference: "European Commission, C(2021) 9332 final, Annex I §4.5, printed pp.63–64. [Official annex original](https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf)."
    used_for: "General multifunctionality hierarchy and relative-market-value allocation basis only; no claim of full PEF conformity, sector factors or circular-footprint defaults."
  - id: "brito-bagasse-2021"
    type: "literature"
    reference: "Brito, Bortoletto Júnior and Surdi (2021), Properties of particleboards made from sugarcane bagasse particles, Rev. Bras. Cienc. Agrar. 16(1), e8783. DOI:10.5039/agraria.v16i1a8783. [Publisher original](https://www.agraria.pro.br/ojs32/index.php/RBCA/article/download/v16i1a8783/158/715), pp.1–3, 6."
    used_for: "Original pure-bagasse laboratory route with untreated and hot-water-treated arms; UF/ammonium sulfate/paraffin, drying, pressing and measured conditioning. P2 failure preserved; no dose, moisture, density or press defaults."
  - id: "usda-nonwood-review-1994"
    type: "official_guidance"
    reference: "Youngquist et al., July 1994, Literature review on use of nonwood plant fibers for building materials and panels, FPL-GTR-80, printed p.7, entries 31–34. [Forest Service original report](https://research.fs.usda.gov/download/treesearch/9668.pdf)."
    used_for: "Historical literature-review distinctions and depithing/drying/adhesive/hot-press prompts only. Summarized Hesch trials not acquired; no industrial values or standards adopted."
  - id: "epa-bagasse-combustion-1996"
    type: "official_guidance"
