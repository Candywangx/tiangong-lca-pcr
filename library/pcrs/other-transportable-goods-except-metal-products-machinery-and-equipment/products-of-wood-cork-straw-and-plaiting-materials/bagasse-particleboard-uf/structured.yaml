  classification_refs: "CPC 3.0 31433; narrower"
  covered_products: "Uncoated pure-bagasse UF-bonded flat particleboard"
  excluded_products: "Wood particleboard; flax/bamboo boards; bamboo veneer/strip laminates; wood-faced and mixed-furnish boards; MDF; binderless and other binder routes; coated panels"
  representative_product: "One declared bagasse board grade and thickness with verified site recipe"
  production_route: "Receipt/storage → depithing/grading → drying → UF blending → mat forming/hot pressing → cooling/conditioning → trimming/sanding → packing"
  market_state: "Accepted uncoated board at factory gate, packaging excluded from net board quantity"
functional_unit:
  what: "Provide uncoated board substrate for the declared non-structural interior application"
  how_much: "1 m3 net accepted board volume"
  how_well: "Declared thickness, density at measured moisture, particle grading, UF formulation and verified grade; no inferred P2 conformity"
  how_long_or_cycle: "One factory-gate delivery; no service lifetime asserted"
  reference_flow_link: "finished_board"
system_boundary:
  rules:
    - rule_id: boundary_upstream
      applies_to: "bagasse_input; bagasse_fuel"
      rule: "Do not default bagasse to zero upstream burden. Determine sale price/revenue, contractual status, useful fuel or other demand and supplier process purpose. Valuable co-products require the supplier allocation model; genuine discarded waste may use a justified cut-off, while collection/preparation/transport still remain. Disclose displaced boiler fuel in an attributional sensitivity, not an automatic substitution credit."
      source_ids:
        - epa-bagasse-combustion-1996
    - rule_id: boundary_stages
      applies_to: "manufacturing"
      rule: "Include storage losses, particle preparation, actual drying, all recipe constituents, hot pressing, cooling/conditioning, trimming/sanding, packaging, emission control and wastewater/residue treatment. Identify exact emitting equipment. No wood-panel regional average may replace site bagasse parameters."
      source_ids:
        - brito-bagasse-2021
        - usda-nonwood-review-1994
    - rule_id: boundary_utilities
      applies_to: "manufacturing"
      rule: "On-site heat production belongs to the foreground. Keep gas and bagasse combustion separately metered; match boiler type/control to evidence. Internal steam is measured by supply/return enthalpy and condensate balance, not purchased as a second fuel or represented by an unverified MJ steam UUID. Exclude externally purchased heat and on-site firing of cured UF board until route-specific review."
      source_ids:
        - epa-bagasse-combustion-1996
        - epa-gas-combustion-2026
    - rule_id: boundary_extension
      applies_to: "manufacturing"
      rule: "Additional observed components, consumables, packaging or pollutants require separate specific atomic exchanges and current identity verification. Absence must be demonstrated; neither blank UUID nor missing measurement is a zero."
      source_ids:
        - brito-bagasse-2021
boundary_abstraction:
  declared_starting_condition: "Bagasse separated by juice extraction at its actual sugar/ethanol supplier, delivered at measured moisture and economic status; supplied chemicals and utilities"
  starting_condition_role: "Foreground receipt boundary, not an automatic upstream cut-off"
  product_classification_scope: "CPC 3.0 31433; narrower"
  recursive_input_rule: "Same-category purchased boards retain their linked upstream dataset; internal rework remains in physical ledger. No infinite expansion and no erased upstream burden."
  upstream_dataset_requirement: "Verified bagasse supply reflecting sugarcane production/extraction and actual allocation or justified waste cut-off; transport, resin, hardener, emulsion, water, electricity and fuels matched to supply bases"
  disclosure: "Supplier region/year, competing uses and economic status; allocation rationale; all stage energy/material/emission boundaries and exclusions"
