  methodology_review: "Not independently scientifically reviewed; candidate for controller acceptance."
  mapping_review: "Proposed narrower 31433 bagasse-only UF route; no accepted edge authored. Retained broad 31433 scaffold is not promoted because its multi-material identity is not equivalent."
  reference_identity: "Broad 58b62091 record explicitly includes other lignocellulosic particle furnish. Its separate wood-fibre-faced variant is excluded here; identity is not a quantitative background dataset."
  unresolved_flow_identities:
    - row_id: "wax"
      selected_flow: "Paraffin wax aqueous emulsion"
      reason: "No aqueous paraffin emulsion candidate: neat petroleum fraction 17bff97f is not the purchased formulation; 25a8346c has waste-plastic recycling route, also not compatible. Its energy metadata is not a PCR amount."
    - row_id: "pith_coproduct"
      selected_flow: "Unresinated bagasse pith sold as fuel"
      reason: "Separated pith sold fuel is not whole unsorted Bagasse; no exact separated-pith Product flow identified."
    - row_id: "raw_fines"
      selected_flow: "Discarded unresinated bagasse fines"
      reason: "No exact raw unresinated bagasse fines Waste flow; unrelated residues rejected."
    - row_id: "trim"
      selected_flow: "UF-bonded bagasse board trimming waste"
      reason: "Wood waste/offcut and landfill of wood products are not exact bagasse UF offcuts; treatment-service identity is not material."
    - row_id: "ash_bottom"
      selected_flow: "Bagasse boiler bottom ash"
      reason: "No exact bagasse bottom ash Waste flow; metal, coal and generic ash rejected."
    - row_id: "wastewater"
      selected_flow: "Untreated UF blending and cleaning wastewater"
      reason: "d2d44ce1 route is washing of manganese-slag materials; paper-mill untreated wastewater not UF blending/cleaning. Generic without direct state/route confirmation not adopted."
    - row_id: "pith_waste"
      selected_flow: "Discarded unresinated bagasse pith"
      reason: "No specific discarded bagasse pith Waste flow; generic residue, biogas residue and unrelated wastes rejected."
    - row_id: "cured_dust"
      selected_flow: "UF-bonded bagasse board sanding dust"
      reason: "No exact UF-bonded bagasse sanding dust Waste flow; wood/sawdust/ash substitutes rejected."
    - row_id: "ash_fly"
      selected_flow: "Bagasse boiler fly ash"
      reason: "No exact bagasse fly ash Waste flow; metallurgy dust removal ash not compatible."
  quantity_background_compatibility:
    - "gas: supplier and meter m3 definitions must be matched; no density inferred from secondary mass coefficient."
    - "uf_resin: as-delivered concentration and supplier/background mass basis must match."
    - "bagasse: measured moisture and economic status must match supplier inventory."
    - "All amounts are future foreground collection requirements, not measured factory values."
  source_limitations:
    - "Brito 2021 laboratory study: untreated and hot-water-treated bagasse arms; P2 failure, no modern factory recipe/drying/press parameter default."
    - "Youngquist et al. 1994 is a bibliography; original experiments summarized there were not acquired."
    - "AP-42 1.8 sugar-mill boilers; no transfer of its as-fired fuel or steam factor bases to board volume."
    - "AP-42 1.4 acquired document bears 10/26 header; no factor default."
    - "CORRIM North American wood board and 2025 softwood surveys are not bagasse parameter evidence."
