    rule: "D is the measured net mass of bodies first accepted during the stated period/configuration, including newly accepted closing finished stock; exclude packaging, opening accepted stock, returns and repeated inspection. Calibrated net weighing and unique acceptance-event records establish D. Count and dimensions are cross-checks, never the denominator."
