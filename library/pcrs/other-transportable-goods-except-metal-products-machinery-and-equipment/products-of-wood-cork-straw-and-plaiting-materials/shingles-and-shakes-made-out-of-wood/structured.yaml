    type: "official_guidance"
    reference: "[USDA FPL-GTR-201 (2011)](https://research.fs.usda.gov/download/treesearch/39747.pdf)"
    used_for: "Printed pp. 1-5, Table 1: sawn/split product distinction, grade/species and coverage/exposure context; no universal dimensions, installation or lifetime adopted"
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "[USDA Wood Handbook, FPL-GTR-282 (2021)](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf)"
    used_for: "Ch. 4 pp. 4-1, 4-11; Ch. 13 p. 13-2: dry-basis moisture, density state and oven method; no species density or moisture default"
  - id: "epa-sawmill-pte-2014"
    type: "official_guidance"
    reference: "[EPA Region 10 sawmill particulate PTE memorandum (2014)](https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf)"
    used_for: "Memo p. 1, attachment p. 1: non-boiler mechanical activity and nested filterable PM definitions; PNW Indian Country PTE factors are not actual shingle emissions"
  - id: "corrim-northern-lumber-2025"
    type: "literature"
    reference: "[CORRIM Northern softwood lumber LCA, July 22 2025](https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Northern-Lumber-Report-07222025.pdf)"
    used_for: "Sections 3.2.4, 3.2.6, 3.3, 4.6-4.7: balance, direct/shared allocation and emission screening method analogy only; northern-US lumber survey parameters are not cedar-shingle defaults"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:cd63a6686b843650a0d9d790a2cb0c3dfedadb7383be43fe194615a60f06cd08"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5523"
      family: "system_boundary"
      span:
        start:
          offset: 5523
          line: 62
          column: 1
        end:
          offset: 7107
          line: 77
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Untreated western redcedar roundwood at mill receipt, or prepared debarked bolts replacing it |\n| starting_condition_role | Purchased precursor; not a finished-shingle recursive input |\n| product_classification_scope | CPC 3.0 31624; narrower |\n| recursive_input_rule | In-house returned shingles/rework circulate inside mill; count net external exchanges once. Purchased finished shingles are excluded from this manufacturing route |\n| upstream_dataset_requirement | Compatible wood procurement/forestry, any bolt preparation, transport and electricity/material datasets required; disclose species, geography, moisture and allocation. UUID is not dataset evidence |\n| disclosure | Foreground gate-to-gate; upstream links expand to cradle-to-gate. External treatment tracked without importing combustion into foreground. Installation, use, maintenance and end-of-life excluded |\n\nOne aggregated mill process covers preparation, sawing, grading, handling and packaging. Keep separate stage meters and physical transfer records: each internal link has identical quantity and state at both ends, and cancels from the external inventory. No second finished-shingle output is created for a packaging handoff. Include residue chipping when actually performed, auxiliary electricity, maintenance consumables, packaging losses and actual releases. Missing applicable chemical/waste/emission species require another atomic card and compatible identity before dataset completion.\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 326
              line: 11
              column: 1
            end:
              offset: 382
              line: 11
              column: 57
          text: "# Untreated western redcedar sawn shingles, at mill gate"
          depth: 1
        - kind: "heading"
          span:
            start:
