    applies_to: "roundwood_in; bolt_in; shingle_out; chip_out; sawdust_out; bark_out"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use cp_wood and cp_output matched samples; dry-basis u = water mass / oven-dry wood mass. Do not use a wet-basis percentage in the same equation. Source: usda-wood-handbook-2021."
  - id: area_basis
    applies_to: "shingle_out"
    required_property_ref:
      name: "Mass and area"
      uuid: ""
    required_unit: "kg; m2"
    rule: "Measure kg/m2 for the same grade, moisture and layout using cp_area. Separate summed full piece-face area, overlapped material area and unique installed coverage. Manufacturing mass is not an installed-service functional unit."
