allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The CSSB preliminary summary reports cedar wood-chip and sawdust coproduct outlets, alongside mixed hog fuel, for its named shake/shingle products. This supports looking for separate saleable residues, not a universal waste percentage or interchangeable shake/shingle yield. Keep any actual mixed hog fuel separate from the pure bark/chip/sawdust rows. Source: cssb-cedar-lca-2007."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "First assign separable operations directly: dedicated packaging belongs to shingles; dedicated chip processing belongs to chips. Partition genuinely shared burdens by measured oven-dry mass of saleable outputs at that stage; disclose the decision and test economic allocation sensitivity if prices or function indicate a materially different result. This adapts a documented lumber-study mass-allocation method, not its surveyed shares. Waste is not made a coproduct merely to reduce shingle burdens. Source: corrim-northern-lumber-2025."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Keep two ledgers. The physical process graph and mass/water/carbon balance retain full actual inputs, products, coproducts, wastes and releases. The allocated environmental burden ledger partitions eligible shared upstream burdens, energy and emissions. Do not multiply coproduct physical outputs or internal transfers by an allocation fraction. An allocated single-product dataset must bind the unallocated balance and its partition reconciliation; inventory cards describe the unallocated exchanges before that projection. No avoided-burden credit is automatic."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "mill"
      flow_role: "shingle_out"
      record_type: "Matched records and measurements"
      raw_fields: "lot; species; grade; grain; lengths; widths; taper; rejected mass; net accepted mass P; dispatch moisture; packaging tare"
      collection_method: "Calibrated scale with tare; immediate representative wood sampling for oven-dry mass stability, preserving volatile-extractive bias and species-calibrated meter limits."
      unit: "kg"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_wood
      process_id: "mill"
      flow_role: "roundwood_in; bolt_in"
      record_type: "Matched records and measurements"
      raw_fields: "wood origin; species; starting state; delivery mass; bark; moisture samples; stock changes; transport; bolt preparation"
      collection_method: "Weigh receipts and reconcile opening/closing stock to the same accepted lot; do not double count internally prepared bolts. Sample wood and bark separately."
      unit: "kg"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_energy
      process_id: "mill"
      flow_role: "electricity_in"
      record_type: "Matched records and measurements"
      raw_fields: "meter readings; stage hours; voltage; region/year; extraction and handling; supply reference"
      collection_method: "Submeter stages; reconcile main meter and shared service attribution. Convert metered kWh to MJ; retain meter and supplier definitions."
      unit: "kWh; MJ"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_material
      process_id: "mill"
      flow_role: "oil_in; oil_waste"
      record_type: "Matched records and measurements"
      raw_fields: "product certificate; petroleum route; calorific qualifier; receipts; machinery stock; used-oil waste; loss; receiver"
      collection_method: "Reconcile weighed material additions and stock; weigh each waste separately; verify supplier/background compatibility without adopting calorific metadata as a default."
      unit: "kg"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_pack
      process_id: "mill"
      flow_role: "film_in; paper_in; strap_in; film_waste; paper_waste; strap_waste"
      record_type: "Matched records and measurements"
      raw_fields: "component polymer/paper grade; coating/adhesive; receipts; stocks; shipped packaging; each scrap mass"
      collection_method: "Weigh each component and each scrap separately; reconcile consumed material = shipped packaging + on-site scraps + stock correction."
      unit: "kg"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_residue
      process_id: "mill"
      flow_role: "chip_out; sawdust_out; bark_out; offcut_waste; bark_waste; sawdust_waste"
      record_type: "Matched records and measurements"
      raw_fields: "stream; source stage; sale/waste destination; wet and dry mass; moisture; chip volume; packing; measured density; receiver reference"
      collection_method: "Separate and weigh each outlet; track collected dust once. Measure chip volume and mass in the same state, document solid/bulk convention with supplier, and weigh dry samples for allocation."
      unit: "kg; m3"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_air
      process_id: "mill"
      flow_role: "pm_fine; pm_middle; pm_coarse; methanol_air; formaldehyde_air; pinene_air"
      record_type: "Matched records and measurements"
      raw_fields: "species/CAS; outlet and fugitives; control state; test method; size cut; air flow; concentration; operating hours; detection limit; uncertainty"
      collection_method: "Use matched outlet sampling and validated fugitive estimates for actual operations; speciate VOCs. Integrate each species separately. Absent or below-detection results retain method and limit; unmeasured is unknown."
      unit: "kg"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_balance
      process_id: "mill"
      flow_role: "water_vapour"
      record_type: "Matched records and measurements"
      raw_fields: "incoming/outgoing wood and bark water; residues; moisture; inventory; residence; volatile losses"
      collection_method: "Reconcile measured moisture and stocks over the matched lot; investigate closure before attributing unexplained mass loss to water."
      unit: "kg"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_carbon
      process_id: "mill"
      flow_role: "biogenic_co2; biogenic_ch4"
      record_type: "Matched records and measurements"
      raw_fields: "dry stream masses; measured carbon fractions; biological loss evidence; residence; CO2 and CH4 species; stocks"
      collection_method: "Maintain a dry-wood carbon balance and measure/document actual biological releases or demonstrated absence; no combustion or carbon-neutrality assumption."
      unit: "kg"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
    - protocol_id: cp_area
      process_id: "mill"
      flow_role: "shingle_out"
      record_type: "Matched records and measurements"
      raw_fields: "matched lot mass; moisture; grade; per-piece face dimensions; exposure; gaps; courses; starter/ridge cuts; installed coverage; overlap; layout"
      collection_method: "Weigh and measure matched pieces and a documented test/specification layout; measure unique roof/wall plane coverage separately from summed full faces. Retain raw measurements and uncertainty."
      unit: "kg; m2"
      frequency: "Each lot; emission tests cover each operating mode"
      temporal_coverage: "Declared production period with all grade lots, stocks and shutdowns"
      site_scope: "Same mill, species and route; no pooled shake route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceability; sampling plan; balance and uncertainty"
  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "x = X / P; X is the measured external exchange for the matched lot, P is its accepted net dispatched shingle mass in kg; shingle_out = 1 kg. Physical outputs remain unallocated."
      inputs:
        - X
        - P
        - "matched protocol"
        - cp_output
      output: "x"
      source_ids:
        - usda-wood-handbook-2021
    - id: dry_wood
      applies_to: "all wood streams"
      rule: "m_dry = m_wet / (1 + u); u = (m_wet - m_dry) / m_dry. Use matched state and a fraction, not percent."
      inputs:
        - m_wet
        - u
        - cp_wood
        - cp_output
        - cp_residue
      output: "m_dry"
      source_ids:
        - usda-wood-handbook-2021
    - id: meter_mj
      applies_to: "electricity_in"
      rule: "MJ = kWh * 3.6 for metered electrical delivery; no calorific fuel factor or boiler efficiency."
      inputs:
        - kWh
        - cp_energy
      output: "MJ"
      source_ids:
        - corrim-northern-lumber-2025
    - id: coverage_conversion
      applies_to: "shingle_out"
      rule: "r_cover = m_layout / A_cover; r_face = m_layout / A_face; A_face is the sum of full piece faces, A_cover is unique covered plane area after overlap. A_overlap is reported separately; gaps and starter/ridge/cut allowances stay in the layout ledger. For a downstream declared coverage A, required shingle mass = r_cover * A, at the matched moisture and grade. Measure, never assume r_cover from density or nominal exposure alone."
      inputs:
        - m_layout
        - A_cover
        - A_face
        - A_overlap
        - cp_area
      output: "r_cover; r_face"
      source_ids:
        - usda-shingle-roofs-2011
    - id: pm_partition
      applies_to: "pm_fine; pm_middle; pm_coarse"
      rule: "fine = PM2.5; middle = PM10 - PM2.5; coarse = PM_total - PM10, only for matched nested measurements. Each result must be nonnegative; do not add PM_total or PM10 again."
      inputs:
        - PM_total
        - PM10
        - PM2.5
        - cp_air
      output: "fine; middle; coarse"
      source_ids:
        - epa-sawmill-pte-2014
    - id: shared_burdens
      applies_to: "shared environmental burdens only"
      rule: "a_j = D_j / sum(D_j); D_j is measured oven-dry mass of eligible saleable output j of the shared stage. B_j = a_j * B_shared + B_direct,j. Apply to burdens, never physical coproduct flows."
      inputs:
        - D_j
        - "stage ledger"
        - cp_residue
        - cp_output
      output: "a_j; B_j"
      source_ids:
        - corrim-northern-lumber-2025
    - id: balance_closure
      applies_to: "mill"
      rule: "Dry wood input + opening stock = dry products + dry coproducts + dry wastes + wood-derived airborne matter + closing stock + documented degradation; reconcile water and measured carbon fractions separately. Captured dust stays in residue outlets. Carbon in CO2/CH4 uses species stoichiometry, not gas mass as carbon mass. Report residual and uncertainty; do not silently balance by adding a default emission."
      inputs:
        - cp_wood
        - cp_output
        - cp_residue
        - cp_balance
        - cp_air
        - cp_carbon
      output: "dry mass; water; carbon closure"
      source_ids:
        - corrim-northern-lumber-2025
        - usda-wood-handbook-2021
  data_quality_requirements:
    - id: identity
      applies_to: "all rows"
      requirement: "Verify full material/route, flow type, medium, reference property and unit; blank identities remain pending. A UUID alone does not establish a compatible background dataset."
      evidence: "Supplier/test definitions and identity records"
    - id: representativity
      applies_to: "mill"
      requirement: "Declare geographic/year and period coverage, species and grade mix; weight lots by accepted net mass. Never transfer northern lumber survey yields/emissions to cedar shingles."
      evidence: "corrim-northern-lumber-2025"
    - id: missing_data
      applies_to: "all rows"
      requirement: "Record absent, measured zero, below detection, estimated and missing distinctly; no implicit zero. Actual additional exchanges need atomic cards and matched identities."
      evidence: "Collection package and limits"
    - id: balance
      applies_to: "mill"
      requirement: "Keep physical and allocated ledgers separate and investigate unmatched closure beyond stated measurement uncertainty; show residue sale/waste split without duplication."
      evidence: "Mass/water/carbon ledgers"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Require exactly one finished reference output and 1 kg net basis; all external amounts and collection aggregation use the same P and lot scope. Verify species, route, grade, moisture, area layout and treatment qualifiers. Reject lumber substituted for shingles, duplicate external internal transfers, duplicate residue sales/wastes, nested additive PM, assumed generic density and unverified chip-volume/background conventions. Validate the unallocated physical balance and the separate partitioned burden sum. Each applicable blank identity, missing amount, unsupported background basis or unspeciated release is a data-package incompleteness, not scientific approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground sawn-shingle production process; compatible upstream-expanded dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified matching untreated Thuja plicata manufacturing and explicitly measured mass-to-coverage conversion"
  excluded_use: "Whole CPC equivalence; treated/dried or split shake proxy; installed weatherproof-service claims; automatic carbon credits"
  required_metadata: "All reference qualifiers; upstream boundary; stage/lot balance; coproduct/waste decision; allocation and area basis; measured quantities; compatible datasets"
  required_quality_disclosure: "Actual data period, sampling/uncertainty, blank identities, conditional absences, volume/property compatibility and missing emissions"
  update_trigger: "Species/grade, moisture or delivery state, route, treatment, electricity, residue outlets, allocation or installed layout changes"
data_sources:
  - id: "cssb-cedar-lca-2007"
    type: "literature"
    reference: "[CSSB preliminary cedar-shake/shingle LCA summary (03/07)](https://www.cedarbureau.org/cms-assets/documents/41211-337868.life-cycle.pdf)"
    used_for: "Page 1: named 2007 study products and cedar coproduct categories only; preliminary promotional summary, no case quantitative or superiority claims adopted"
