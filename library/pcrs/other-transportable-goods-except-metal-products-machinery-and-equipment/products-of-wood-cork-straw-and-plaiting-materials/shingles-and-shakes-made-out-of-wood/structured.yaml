measurement_rules:
  - id: net_basis
    applies_to: "shingle_out"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh net accepted wood at dispatch with cp_output; keep dry-basis moisture, gross shipment and packaging mass distinct. Every inventory row is per 1 kg reference flow."
