review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_uuids:
  - row_id: core_barecore
    flow: Dried edge-jointed Falcata solid-strip barecore
    reason: Native search returns finished lumber-core plywood or veneer; neither
      is an unveneered barecore. Supplier core adhesive and wood/water/binder constituents
      require actual compatible upstream evidence.
  - row_id: hardener
    flow: Dry ammonium chloride hardener
    reason: Direct mass candidate is in absorption tower; at-plant candidate has reference
      Volume. Neither establishes supplied dry hardener Mass/kg compatibility.
  - row_id: heat
    flow: Purchased net hot-water heat delivered to press circuit
    reason: Generic net-calorific heat has no actual delivery/circuit definition;
      steam-or-hot-water candidate has gross-calorific property. No source confirms
      the provider net-delivery boundary; retain unresolved pending compatible supplier/background
      definition.
  - row_id: bonded_trim
    flow: UF-bonded blockboard trimming waste
    reason: No compatible actual resin-bonded panel-to-treatment flow confirmed; unrelated
      elementary chemical search results and untreated wood waste are rejected.
  - row_id: sanding_dust
    flow: UF-contaminated blockboard sanding dust waste
    reason: No compatible bonded-panel collected dust waste confirmed. Collected dust
      is distinct from emitted elementary PM.
  - row_id: glue_wastewater
    flow: UF adhesive equipment-wash wastewater to off-site treatment
    reason: Urea elementary and water-body flows do not establish adhesive-wash wastewater-to-treatment
      identity.
  - row_id: glue_residue
    flow: Uncured UF resin-mix residue waste
    reason: No compatible whole uncured UF mix residue waste identified; pure urea
      and generic pressure-sensitive glue residue are not substitutes.
  - row_id: abrasive
    flow: Actual specified sanding abrasive consumable
    reason: Specific actual consumable or complete waste identity/provider remains
      unresolved; collect actual composition and route, no substitute UUID assigned.
  - row_id: spent_abrasive
    flow: Spent specified sanding abrasive waste
    reason: Specific actual consumable or complete waste identity/provider remains
      unresolved; collect actual composition and route, no substitute UUID assigned.
  - row_id: pe_film_waste
    flow: PE-LD film trimming waste
    reason: Specific actual consumable or complete waste identity/provider remains
      unresolved; collect actual composition and route, no substitute UUID assigned.
  reference_flow_applicability:
    flow_uuid: 00345bd0-3519-4462-bfd5-ea0dcb0fcfde
    physical_evidence: Whole manufactured at-plant Product flow, Mass/kg; complete
      native description requires more than two veneer sheets, tropical outer ply
      and crossed grain in the residual other-plywood/veneered-panel branch, without
      solely-sheets or conifer-faced restriction. Actual declared panel has four Meranti
      veneer sheets and one solid Falcata strip core, crossed axes and proven tropical
      outer-ply family.
    limits: Native category does not establish actual botanical/provenance, UF chemistry,
      barecore supplier, moisture, performance or narrower mapping acceptance. Require
      actual layer-specific supplier evidence and independently compatible whole lumber-core
      provider. All-veneer providers and component inputs cannot replace the whole
      output.
  supplier_compatibility_review:
  - Tropical veneer native identity supports unbonded sheets <=6 mm and Mass/kg only;
    actual Meranti group, botanical identity, drying state, source provenance, layer
    role and compatible upstream provider must be supplied.
  - Generic UF resin identity does not verify a supplier's dry resin purity, formulation,
    additives or cure extent. Actual supplier specifications and matched analyses
    are required.
  unresolved_range_evidence:
  - No independent boundary-compatible empirical inventory range adopted. Collect
    real yields, recipe, utilities, packaging, residues and emissions; do not transfer
    all-veneer or coniferous blockboard survey coefficients.
  classification_review:
  - Narrower31422 only for verified tropical Meranti outer plies and four veneer sheets
    around one solid Falcata strip core. Complete official3141/31411/31412/31413 blockboard
    examples versus solely-sheets title tension is disclosed, alongside3142/31422
    positive residual title and four crossed-veneer conditions. CBP2011 proves physical
    construction only, not CPC correspondence, glue recipe or current tariff. Acceptance
    evidence is separate from scientific/publication authority.
  methodology_review:
  - UF route is a declared technical option, not established for the CBP sample. Current
    supplier recipe/bond acceptance, reaction water generation/consumption, dry-species
    conversion and actual net heat delivery require foreground evidence. No universal
    dosage or complete cure is assumed.
  - Independent scientific expert approval, normal-use lifecycle promotion, actual
    study qualification and publication remain pending. Primary-controller scoped
    method/native/source consistency and bilingual alignment review are recorded separately;
    mapping acceptance remains subject to batch validation and serial landing.
  controller_repairs:
  - Independent review added actual sanding consumable, spent abrasive and PE film
    offcut exchanges with stock/service/dust ownership protocols; no material recipe
    or UUID invented.
