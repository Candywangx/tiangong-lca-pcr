allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "manufacturing"
    rule: "First subdivide by stage, lot and exclusive service. PF supply/pressing, finished-panel trim/sanding/testing, rework and packing belong to the relevant panel cohort; do not assign these burdens to green bark or peeler cores. Separate sold green/dry residues and their actual stage histories."
    source_ids:
      - epa-plywood-2002
      - corrim-western-2025
  - rule_id: allocation_cause
    applies_to: "shared stages"
    rule: "For an inseparable shared operation, document a physical driver with evidence that it explains the burden: measured delivered heat, actual machine service or measured dry-wood throughput where applicable. Calculate shares over real participating products once; waste, repeated redrying/rework and repeated shipment are not new allocation products. No default dry-mass, economic share or avoided-product credit. Unsupported causation remains specifically pending."
    source_ids:
      - corrim-western-2025
  - rule_id: allocation_two_ledgers
    applies_to: "all inventory rows"
    rule: "Keep unallocated gross material/water/carbon and energy balances intact. Apply shares only to the corresponding burden ledger, preserve direct burdens, and normalize both ledgers once after cohort reconciliation. Never multiply physical co-product, waste, packaging tare or elementary mass-balance entries by an allocation share to obtain apparent closure."
    source_ids:
      - corrim-western-2025
  - rule_id: allocation_pack_return
    applies_to: "pp_strap_in; runner_in; pp_strap_out; runner_out"
    rule: "Packing is attributable to plywood, not wood co-products. Record gross dispatch/return movements and ownership separately from supply/repair services. Reusable-runner service uses verified completed trips and losses; no default cycle count, new runner each trip or second upstream production for a returned runner."
    source_ids:
      - corrim-western-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacturing"
      flow_role: "reference panel; cohort and stock bridge"
      record_type: "quality/geometry/lot ledger"
      raw_fields: "face/back botanical species; inner species/origin; ply construction; PF formulation and cure record; structural/bond method and result; unique lot and first-release time; actual count/net area/thickness/holes; paired net mass; moisture/temperature; Q; removed test pieces; raw/WIP/rework/finished opening/closing stocks; shipments/returns"
      collection_method: "Verify each outer ply independently; measure cooled finished panel geometry with calibrated instruments and same-state net weighing. Record first successful release once per lot and all failed attempts. Trace opening WIP into release and closing WIP forward, with actual stage activity carried across periods; trace released stock into later packing/shipment without another output. Mark unsupported activity bridges pending."
      unit: "m3; kg; dimensions; moisture fraction"
      frequency: "every lot/first release and period stock count"
      temporal_coverage: "continuous declared production period plus traceable earlier/later cohort activity"
      site_scope: "same mill/layup/grade/formulation; no incompatible pooling"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "species/layup certificates; grade tests; calibration; lot genealogy; stock counts; release/dispatch reconciliation"
    - protocol_id: cp_wood
      process_id: "manufacturing"
      flow_role: "coniferous logs and veneer stages"
      record_type: "receiving/scale/moisture/stage records"
      raw_fields: "botanical species; harvest/supply location; bark inclusion; receipts/returns; log scale convention; wet/dry mass; green/dry veneer thickness; pitch/surface defects; conditioning; dryer/redryer inlet/outlet moisture; opening/closing logs/veneer/WIP"
      collection_method: "Weigh and sample each species/lot. For unglued veneer take representative within-sheet positions, immediately weigh and oven-dry to constant mass under the validated method; calibrate online readings to species/temperature and note volatile-extractive bias. Track good veneer, clip losses, redrying and PF entry by stage; keep merchantable log scales separate from measured geometry."
      unit: "kg; m3; percent dry basis"
      frequency: "every incoming lot and drying/peeling campaign"
      temporal_coverage: "same cp_release cohort with period bridges"
      site_scope: "same actual conifer species and integrated route"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "weighbridge/calibration; moisture samples; dryer sheets; measured species/stock/transfer reconciliation"
    - protocol_id: cp_glue
      process_id: "manufacturing"
      flow_role: "whole PF glue and uncured glue waste"
      record_type: "supplier/BOM/batch/press records"
      raw_fields: "ready-glue supplier/batch; composition including fillers/alkali/water/free phenol/formaldehyde; delivered/dosed/returned/recovered mass; solids fraction; open/close glue stocks; spread area; assembly delay; temperature/pressure/time/cure and bond results; expired glue/cleanup"
      collection_method: "Measure purchased whole formulated glue once. Reconcile spread mass with actual glue lines and veneer area, returned unused glue, internal recovery, remaining stock, uncured waste, effluent, cured retention and emissions. Obtain supplier chemistry for cure reaction/volatile losses; constituent masses are subledgers, not added supply exchanges."
      unit: "kg; fraction; m2; time; temperature; pressure"
      frequency: "every glue/layup batch and formulation change"
      temporal_coverage: "same cp_release cohort including startup/failed press/rework and cleanup"
      site_scope: "actual ready-to-spread aqueous resole PF and coniferous layup"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "supplier formulation/solids tests; tank/scale calibration; spread and press logs; bond acceptance; waste manifests"
    - protocol_id: cp_energy
      process_id: "manufacturing"
      flow_role: "electricity; gas; internal steam"
      record_type: "meter/fuel/thermal balance"
      raw_fields: "site/meter/stage; opening/closing electricity; voltage/provider; charging and transformer losses; pipeline gas volume/absolute T/P/dry-wet/composition/Z/heating value and HHV/LHV; gas supplier interface; each steam supply and condensate return mass/T/P/specific enthalpy; common boundary/period and enthalpy datum; makeup/leak/blowdown masses and enthalpies; storage-energy change; network/boiler heat losses; run/idle/start/stop; abatement gas"
      collection_method: "Read dedicated stage electricity/gas meters and reconcile bills. Independently meter steam supply and return mass/enthalpy legs at conditioning, dryer/redryer and press on the same boundary/period and enthalpy datum. Use a common mass times enthalpy difference only after mass matching is verified; otherwise retain distinct legs and actual makeup, leak, blowdown, storage and heat-loss terms in the balance. Reconcile boiler fuel input, network balance and actual delivered stage heat before using heat as an allocation driver; no assumed efficiency. Indirect dryer has no boiler flue-gas inlet. Match gas volume to provider conditions; supply and foreground combustion are counted once."
      unit: "kWh; MJ; m3; kg; T/P"
      frequency: "continuous meters, campaign reconciliation"
      temporal_coverage: "same cp_release cohort including failed/idle/start/stop and actual stock bridges"
      site_scope: "same boiler and utility network; electric handling"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "calibrated meters; supplier gas specification/conversion; steam/condensate records; stage heat balance; operating logs"
    - protocol_id: cp_water
      process_id: "manufacturing"
      flow_role: "water supply; combined effluent; water vapour"
      record_type: "meters/sampling/water balance"
      raw_fields: "external tap receipts; wood/glue water; boiler makeup/blowdown; condensate/recirculation; cleanup; moisture retained in panels/residues/stocks; effluent mass/solids/phenol/formaldehyde/COD; actual receiver; evaporation; inlet-air humidity; reaction water"
      collection_method: "Meter added water and actual combined external effluent; sample composition and use measured density for volume-to-mass conversion. Keep whole wet effluent as one external waste and constituents as subledgers. Measure net evaporation with inlet/exhaust humidity and actual cure/combustion chemistry; unexplained mass loss is not water. Separate treatment routes if the actual plant has separate exports."
      unit: "kg; m3; concentration; fraction"
      frequency: "continuously where metered; each transfer and representative sample"
      temporal_coverage: "same cp_release cohort including cleanup/boiler startup and stock bridges"
      site_scope: "same water network; external treatment; no direct abstraction/discharge"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "meter/lab calibration; water sampling; measured density; treatment receipt; water-balance residual and uncertainty"
    - protocol_id: cp_consumables
      process_id: "manufacturing"
      flow_role: "each knife, belt, oil and spent stream"
      record_type: "maintenance/issues/service ledger"
      raw_fields: "precise material/grade/alloy; whole item mass; receipts/returns; installed/removed times; stock; sharpening/reuse; period service; oil replenishment/leak/recovery; belt dust; waste destination; other actual equipment consumables"
      collection_method: "Weigh whole actual items and reconcile purchases, installation, remaining service and waste. Attribute consumed knife/belt service with recorded machine hours or throughput; retain gross physical retirement separately. Screen grease, release agent, boiler chemicals, filters and sharpening swarf; add separate actual exchanges where present, never a generic consumable total or assumed default life."
      unit: "kg; service hours; throughput"
      frequency: "every issue/maintenance/retirement and stock count"
      temporal_coverage: "same cp_release cohort and actual service history"
      site_scope: "machines and controls in declared route"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "supplier specs; inventory/service logs; maintenance work orders; waste receipts; uncertainty on service attribution"
    - protocol_id: cp_pack
      process_id: "manufacturing"
      flow_role: "PP strap and wood runner; gross returns/scrap"
      record_type: "receipt/ownership/dispatch BOM"
      raw_fields: "material/species/moisture; component/item and event IDs; supplier and original per-exchange provider vector; P purchase including whole-price components; N_ext first nonpurchase loan/rental/entrusted/accompanying receipt; ER same-item return with prior outward evidence; EO outward return; date/leg/receipt and gross mass; original owner/custodian/cohort; mutually exclusive raw/WIP/FG packing stocks at opening/closing; fitted dispatch tare; waste; actual transport legs; measured trips/repair/loss; linked first-release lot and shipment"
      collection_method: "Weigh each component and retain gross P, N_ext, ER, dispatch, EO and waste legs without netting; ER requires the same item's earlier outward record. Reconcile opening plus external intake plus paired internal_in against closing plus dispatch/EO/waste plus paired internal_out; assign each item to one raw/WIP/FG stock only, with packed tare separate from panel net volume. Internal transfers cancel on consolidation and inherit original owner/cohort and each exchange's provider vector. Preserve actual transport for every leg. Link whole-package supply or its covered component providers once, not both; N_ext needs actual supply/service coverage, never assumed zero or a fresh manufacture merely on return. Match actual packing service to its original first-release cohort, including earlier/later dates and old FG; incremental repacking/return service does not automatically divide by new Q. Missing future packing of released stock remains a disclosed completion gap, not zero or a second Q."
      unit: "kg; trips; m3 cohort linkage"
      frequency: "every packing/dispatch/return and stock count"
      temporal_coverage: "matched cp_release cohort; retain non-cohort dispatch separately"
      site_scope: "same mill packing/ownership boundary"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "supplier/BOM/ownership records; tare weighing; trip/return evidence; finished/packing stock reconciliation"
    - protocol_id: cp_residues
      process_id: "manufacturing"
      flow_role: "each product residue, reject and waste"
      record_type: "scale/composition/destination ledger"
      raw_fields: "source stage/lot; green/dry; unglued/PF-bonded; wet/dry mass; water/resin/carbon; test specimens; coproduct sale/waste fate; internal reuse; opening/closing residues/rework"
      collection_method: "Weigh each stream before allocation and reconcile generation, internal reuse, exports and closing stock. Separate green chips, dry chips, unglued sawdust, cured trim, sanding dust, rejected panels and bark sale/waste by actual fate; no on-site wood combustion in this route. Samples removed from Q retain their material fate."
      unit: "kg; composition fraction; volume where actually measured"
      frequency: "every transfer and representative composition sample"
      temporal_coverage: "same cp_release cohort plus actual stock bridges"
      site_scope: "same stages and documented external receiver"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "calibrated scales; composition tests; sales/waste receipts; matched internal transfer ledger"
    - protocol_id: cp_air
      process_id: "manufacturing"
      flow_role: "each individual elementary air output"
      record_type: "source/outlet/fugitive tests"
      raw_fields: "source/control/outlet ID; species and CAS; carbon origin; gas flow and concentration; standard T/P and dry/wet basis; O2 correction; operating/start/stop hours; particle sizes/filterable/condensable method; detection limit; controls and bypass"
      collection_method: "Test relevant conditioning/dryer, press, boiler, final control outlet and fugitives under representative species/recipe/load. Multiply compatible species mass concentration, gas flow and hours; retain raw tests and unit conversions. Shared stack and pre/post-control measurements count once. Check total VOC/NOx/PM only as reconciliation; unknown species/size/carbon fractions remain gaps. Survey gas leaks and actual additional organic species."
      unit: "kg; concentration; gas flow; hours"
      frequency: "representative campaign and every species/recipe/equipment/control change"
      temporal_coverage: "same cp_release cohort including idle/startup/shutdown and failures"
      site_scope: "actual final air outlets and fugitives; outdoor air unspecified identities only"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "accredited/raw test reports; calibrations; hours; method and detection limits; speciation/size/carbon evidence"
  calculation_rules:
    - id: release_volume
      applies_to: "finished_panel"
      rule: "Q = sum(net material area * final measured thickness) over unique newly first-released lots in the declared cohort. Deduct through-holes/removed specimens; exclude packing, rejects, stack air and repeated reinspection/shipment. Paired release-state density = net panel mass / measured volume; no regional density or nominal-thickness conversion."
      inputs:
        - cp_release
        - "net area"
        - thickness
        - "first-release identifiers"
        - "paired net mass"
      output: "Q in m3; paired release-state density"
      source_ids:
        - wood-handbook-2021
        - corrim-western-2025
    - id: cohort_bridge
      applies_to: "all inventory rows"
      rule: "Retain raw period receipts/returns/exports and opening/closing raw, WIP, rework, residue, packing and finished stocks. Use stage/lot genealogy to add actual pre-period activity belonging to the release cohort and remove post-period WIP activity belonging to later cohorts; match actual later packing to already released lots without new Q. Do not apply both a stock-adjusted consumption and the same stock change again. Unsupported bridges, future packing and Q=0 cohorts remain explicit incomplete records; no invented equivalent-output or smoothing factor."
      inputs:
        - cp_release
        - "all row protocols"
        - "stage activity"
        - "stock and genealogy records"
      output: "reconciled gross physical ledger; matched cohort activity; specific pending bridges"
      source_ids:
        - corrim-western-2025
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q>0 only, physical intensity_i = matched gross physical amount_i / Q; burden intensity_i = attributable cohort burden_i / Q. Establish gross physical records, measured cohort bridges, direct assignment and any evidenced allocation before this single division; finished_panel is 1 m3. Q is first release, never a sum of passes, shipping and rework."
      inputs:
        - Q
        - cp_release
        - cohort_bridge
        - allocation_share
        - "actual row amount"
      output: "physical intensity_i; burden intensity_i; completion flags"
      source_ids:
        - corrim-western-2025
    - id: wood_moisture
      applies_to: "conifer_logs; bark_product; peeler_core; green_chips; dry_chips; sawdust"
      rule: "MC_db = 100 * (wet mass - oven-dry mass) / oven-dry mass; dry mass = wet mass / (1 + MC_db / 100). Apply only to measured unglued wood/bark samples. For bonded panels/residues separately determine resin and volatile bias with the validated matrix-specific method."
      inputs:
        - cp_wood
        - cp_residues
        - "measured wet/dry mass"
      output: "dry wood/bark mass; water content; uncertainty"
      source_ids:
        - wood-handbook-2021
    - id: glue_components
      applies_to: "pf_glue; glue_waste"
      rule: "Delivered component mass_j = delivered whole-glue mass * measured/supplier component fraction_j. Reconcile actual dose/recovery/stock, cure formation/consumption, retained resin, effluent and emissions. Component supply is not added again when whole formulated glue provider is used; provider coverage must match that formulation."
      inputs:
        - cp_glue
        - cp_water
        - "supplier formulation"
        - "actual cure/loss evidence"
      output: "component and retained-solids/water subledgers; provider match"
      source_ids:
        - corrim-western-2025
    - id: heat_balance
      applies_to: "natural_gas; electricity"
      rule: "Metered electricity MJ = kWh * 3.6. Actual gas energy = matched volume * measured heating value on the same T/P/dry-wet and HHV/LHV basis. Only for measured mass-matched supply/return on the same boundary/period and enthalpy datum, internal net steam heat = sum(m * (h_s - h_r)). Otherwise keep sum(m_s * h_s) and sum(m_r * h_r) as independent supply/return legs, with actual other inlet/outlet enthalpy legs (including makeup, leaks and blowdown), storage-energy change and heat losses reconciled at that boundary before identifying delivered stage heat or an allocation driver. Network losses are not silently useful stage heat; do not invent efficiency or another purchased heat input."
      inputs:
        - cp_energy
        - "matched meter/provider conditions"
      output: "external carrier inputs and internal stage heat balance"
      source_ids:
        - epa-plywood-2002
        - epa-gas-2026
    - id: allocation_share
      applies_to: "shared stages"
      rule: "After allocation_cause is evidenced, share_j = driver_j / sum(driver_k) for actual participating products and burden_j = direct_j + shared_burden * share_j. Preserve full physical outputs; shares sum to one for that shared burden only. Do not apply a whole-plant share to glue, panel-only finishing or packing."
      inputs:
        - cp_energy
        - cp_residues
        - cp_release
        - "evidenced driver"
      output: "separately allocated burden ledger"
      source_ids:
        - corrim-western-2025
    - id: physical_closure
      applies_to: "manufacturing"
      rule: "For each conserved element or explicitly defined material/species ledger in common units, stage s obeys O_s + R_s + T_in_s + F_s = C_s + X_s + T_out_s + D_s + epsilon_s. O/C are opening/closing stocks; R/X are actual external receipts/exports; T_in/T_out are same-state internal transfers matched at both ends. F/D are evidenced chemical species formation/consumption only, never receipts or transfers; for conserved elements F=D=0. The consolidated whole-factory equation is sum(O_s) + sum(R_s) + sum(F_s) = sum(C_s) + sum(X_s) + sum(D_s) + sum(epsilon_s), because sum(T_in_s)=sum(T_out_s). Include all raw, WIP, rework, residue, packing and finished stocks. First release into finished stock is an internal transfer: Q is not added to external shipment X again. Keep wood/PF/water and fossil/biogenic carbon subledgers; reaction species formation/consumption must be paired by actual chemistry and conserve elements. Include actual inlet-air humidity and combustion oxygen where required; unknown terms remain unknown. Physical V, attributable burden A and unchanged provider vectors remain separate; no allocation-scaled closure or balancing emission."
      inputs:
        - "all row protocols"
        - "raw period stocks and exchanges"
        - "actual chemical composition"
      output: "gross stage and consolidated balance residuals and uncertainty"
      source_ids:
        - wood-handbook-2021
        - corrim-western-2025
    - id: air_species
      applies_to: "all elementary output rows"
      rule: "Species mass = sum(compatible mass concentration * gas volume flow * operating time) with explicit unit conversions, plus independently supported fugitives. PM2.5–10 = cumulative PM10 minus PM2.5 and PM>10 = total minus PM10 only for same method/outlet/period and nonnegative compatible differences; retain condensables without duplicate totals. NOx-as-NO2 requires actual NO/NO2 speciation and molecular-mass conversion."
      inputs:
        - cp_air
        - "actual raw tests"
        - "carbon/source partition"
      output: "individual species and disjoint particle masses; unresolved tests"
      source_ids:
        - epa-plywood-2002
        - epa-gas-2026
    - id: packaging_ownership
      applies_to: "pp_strap_in; runner_in; pp_strap_out; runner_out; pp_scrap; runner_waste"
      rule: "By component, original owner and cohort, distinguish P first purchase (whole supply price including components remains P), N_ext first nonpurchase external receipt, ER history-proven same-item return and EO return outward. Keep gross receipts, dispatch, recovery, waste and actual transport; no net-return substitution. Opening + P + N_ext + ER + internal_in = closing + dispatch + EO + waste + internal_out + residual in compatible physical units; raw/WIP/FG stocks are mutually exclusive and paired internal legs cancel. Preserve each exchange's original provider vector through all movements. Link a whole-package provider or covered component providers once, with actual supply/repair/rental coverage and losses, verified trips and no default lifetime; ER is not new production. Keep physical V separate from attributable A; match service to its original first-release product cohort, including old FG/returns, without creating Q or automatically assigning incremental service to new Q. Missing history, provider or cohort evidence remains specifically pending."
      inputs:
        - cp_pack
        - ownership
        - "measured trips"
        - "matched cohort"
      output: "gross packaging balance; separate once-linked supply/service burden"
      source_ids:
        - corrim-western-2025
  data_quality_requirements:
    - id: outer_ply_identity
      applies_to: "finished_panel"
      requirement: "Independently prove both coniferous outer plies and full-sheet core. A trade name, one softwood face or an ambiguous flow record cannot establish this."
      evidence: "cp_release species/layup records; cpc3-31411"
    - id: grade_and_process
      applies_to: "cp_glue; cp_release"
      requirement: "Retain actual species/veneer-moisture/PF/cure/grade tests. Missing acceptance is neither a successful release nor a licence to alter the product boundary."
      evidence: "batch/bond/structural tests; supplier glue specification"
    - id: common_cohort
      applies_to: "all inventory rows"
      requirement: "Capture failed/idle/cleanup/rework activity, opening/closing WIP and finished/packing stocks. Unknown is not zero; Q=0 and unsupported timing bridges remain explicit."
      evidence: "cp_release and all row protocols; reconciled genealogy"
    - id: identity_and_provider
      applies_to: "all inventory rows"
      requirement: "Check flow type, species/form/phase/route/CAS/medium, native reference property→unit group→unit and provider coverage. Blank UUIDs are specific identity gaps; a core reference mismatch blocks that reference assignment, while an auxiliary gap does not invalidate every other verified row."
      evidence: "original native records; provider interface and composition; manifest review metadata"
    - id: source_limits
      applies_to: "dataset"
      requirement: "No regional density, glue recipe, moisture target, yield, energy, emission factor or allocation share is transferred. Technical literature informs questions; actual foreground quantity requires records or an explicitly bounded evidenced calculation."
      evidence: "cited source pages and row protocols"
    - id: bilingual_fidelity
      applies_to: "all inventory rows"
      requirement: "Preserve row/rule/protocol/source IDs and complete amount objects; official Chinese names follow verified UUIDs. Scientific and translation review remain independent tasks."
      evidence: "English/Chinese field audit; generated projection; original native names"
validation_rules:
  - rule_id: validate_outer_ply
    applies_to: "reference product"
    rule: "Verify face and back separately as coniferous and all layers as sheets; confirm the represented all-coniferous/PF/full-sheet/gas-indirect-steam configuration. Reject a non-coniferous outer ply or another core and mark an unassessed route inapplicable/incomplete."
    source_ids:
      - cpc3-31411
  - rule_id: validate_release
    applies_to: "finished_panel"
    rule: "Verify cured/cooled/trimmed/grade-finished test acceptance, unique first-release lot, actual net geometry and paired state. Exactly one finished_panel reference output. No shipment/reinspection/rework duplication; missing grade proof does not enter Q."
    source_ids:
      - wood-handbook-2021
      - corrim-western-2025
  - rule_id: validate_cohort
    applies_to: "all inventory rows"
    rule: "Require the same Q denominator, complete raw/WIP/rework/reject/finished/pack stock bridges, failed/idle/start/stop and cleanup activity. Reconcile upstream activity and later packing by lot; Q=0 means no normalized result. Unsupported bridges must be disclosed, not inferred."
    source_ids:
      - corrim-western-2025
  - rule_id: validate_no_double_count
    applies_to: "manufacturing"
    rule: "Check one actual formulated-glue supply, single external electricity/gas/water/consumable/packing providers, internal heat/loop cancellation and external treatment once. Constituents, whole items, service returns and repeated stage throughput cannot create extra supplies or reference output."
    source_ids:
      - corrim-western-2025
  - rule_id: validate_balance_allocation
    applies_to: "manufacturing"
    rule: "Check full physical wood/water/PF/carbon/packing ledgers and real residuals before a separate burden allocation. Confirm stage causation, participating products, direct burdens and one final normalization. No share-scaled physical closure or unsupported avoided-product credit."
    source_ids:
      - corrim-western-2025
      - wood-handbook-2021
  - rule_id: validate_air_water
    applies_to: "all elementary output rows"
    rule: "Verify final outlet/species/CAS/medium/carbon origin, compatible concentration/flow/time and particle tests; avoid shared-stack and captured/emitted duplication. Retain actual biogenic emissions, gas leakage and water reaction/air terms; unknown speciation or effluent destination stays incomplete."
    source_ids:
      - epa-plywood-2002
      - epa-gas-2026
  - rule_id: validate_reference_provider
    applies_to: "finished_panel"
    rule: "Verify the selected Plywood locator's positive crossed wood-veneer/gluing/pressing/at-plant semi-finished identity and native Volume→unit group→m3 chain against the actual whole cured/cooled/finished panel. Retain its conflicting CPC31450 bamboo classification as unresolved source debt, not proof of the panel's species or a corrected classification. Independently verify every layer's species, whole-panel grade acceptance, PF formulation/retained water, first-release state and net geometry/hole convention; broad names or missing exclusion words alone are insufficient. Actual provider gate/stage, region/year and measurement compatibility require separate evidence; unknown gates, bamboo/mixed cores, uncured material and packing/stack or nominal volume cannot use this assignment."
    source_ids:
      - cpc3-31411
      - epa-plywood-2002
      - corrim-western-2025
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Report accepted input, checks performed/skipped, findings and completeness separately. Method/projection checks do not establish factory accuracy, scientific review, translation approval, mapping acceptance or complete upstream coverage. Preserve specific identity/provider/measurement gaps."
    source_ids:
      - corrim-western-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Matching coniferous-face-and-back all-sheet plywood manufacturing input after identity, plant records and upstream linkage are verified"
  allowed_use: "Site/cohort/grade-specific represented PF all-coniferous route at 1 m3 first quality release, with separately matched actual packing service and disclosed stock/cohort bridges"
  excluded_use: "Whole-leaf all-technology proxy; non-coniferous outer plies; alternative cores/adhesives/heat routes; uncured/rejected output; unsupported functional comparison, whole-life result, default carbon credit or regulatory compliance claim"
  required_metadata: "All reference qualifiers; Q and first-release/geometry/grade evidence; native identity/property/unit and provider compatibility; stage activity/stock/WIP/rework and packing ownership; gross physical and allocated burden ledgers; tests, controls, waste destinations and upstream scope"
  required_quality_disclosure: "Measured/calculated/missing quantities; specific identity/provider/route gaps; cohort and future-packing completion; uncertainty/residuals; source limitations; performed/skipped checks; independent scientific/translation status"
  update_trigger: "Outer/inner species, veneer layup, glue formulation, curing/grade criteria, indirect-heat system, utility/provider, controls/effluent, service/packing ownership or production-cohort definition changes"
data_sources:
  - id: "cpc3-31411"
    type: "official_guidance"
    reference: "United Nations Statistics Division, Central Product Classification Version 3.0, explanatory notes, subclass 31411 and adjacent panel headings (2025 publication)."
    used_for: "Product/classification boundary only; title/paragraph core-language tension explicitly disclosed; no quantitative or plant evidence."
  - id: "epa-plywood-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 10.5 Plywood Manufacturing (January 2002), pp. 10.5-1–10.5-4, Figure 10.5-1. https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Qualitative integrated veneer/PF process and indirect/direct dryer distinction; emission sources; no numerical conditions or factors adopted."
  - id: "corrim-western-2025"
    type: "literature"
    reference: "M. Puettmann, Life Cycle Assessment of Softwood Plywood Production – Western Region, edited July 22, 2025, 2022/2023 facility survey; §§3.2.3–3.2.6 (PDF14–16), §§4.3–4.8 (PDF20–22), §5.2/Table6 (PDF23), §§5.4/Table8 (PDF24–25), Tables10–13 (PDF27–29). https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Western-Plywood-Report-Final-07222025.pdf"
    used_for: "Regional primary survey informs inventory/stage, whole-glue composition, full physical versus allocated ledger and packing questions. Broader purchased-veneer/wood-fuel and other output scope is excluded; no numeric transfer or independent approval."
  - id: "wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021), Chapter 13 pp. 13-1–13-2 (PDF323–324), Chapter 4 p. 4-11 (PDF105). https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Measured wood moisture, representative veneer sampling, dry-basis formula, volatile-extractive/matrix cautions and density-state distinction; no product density or cure/recipe default."
  - id: "epa-gas-2026"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 1.4 Natural Gas Combustion, header 10/26, pp. 1.4-1–1.4-4. https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "Gas-boiler source testing, actual combustion species/controls and operating-condition questions; no default gas composition, heating value, sulfur level, emission factor or control efficiency adopted."
