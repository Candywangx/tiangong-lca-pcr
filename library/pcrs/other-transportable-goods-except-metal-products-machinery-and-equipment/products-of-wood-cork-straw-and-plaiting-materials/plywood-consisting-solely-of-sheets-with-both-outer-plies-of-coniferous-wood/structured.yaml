system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "manufacturing"
      rule: "Include conditioning/peeling/clipping, drying and redrying, glue spread/layup, cure/cooling, trim/grade finishing, testing/reject/rework, packing, gas boiler, water cleanup and actual emission controls. Site heat is fuel plus conversion/emissions once; internal steam transfers do not add a second provider."
      source_ids:
        - epa-plywood-2002
    - rule_id: boundary_species
      applies_to: "reference product"
      rule: "Face and back each require coniferous proof; representative core requires coniferous veneers. Different outer species classes, non-sheet cores and unsupported technologies cannot enter this output by a shared process label."
      source_ids:
        - cpc3-31411
    - rule_id: boundary_cohort
      applies_to: "manufacturing"
      rule: "Include all period startup, shutdown, idle, redrying, failed batches, cleanup and rework activity. Bridge opening/closing WIP and finished stocks to the first-release cohort with stage records; do not discard burdens or inflate Q with repeated throughput."
      source_ids:
        - corrim-western-2025
    - rule_id: boundary_outlets
      applies_to: "manufacturing"
      rule: "Distinguish boiler stack, indirect dryer/conditioning outlet, PF press/fugitives and controls; indirect steam contains no boiler combustion gas. Count a shared final stack once. Wastewater leaves for external treatment, with no invented on-site removal or direct-discharge elementary outputs."
      source_ids:
        - epa-plywood-2002
        - epa-gas-2026
    - rule_id: boundary_extensions
      applies_to: "dataset"
      rule: "Include upstream production and inbound transport for cradle-to-gate use. Downstream fabrication/installation/use/end-of-life, chemical treatment, wood combustion, direct-fired drying, purchased heat and on-site wastewater treatment need explicit extensions rather than hidden proxies. No stored-carbon credit or carbon-neutrality claim follows from this factory unit."
      source_ids:
        - corrim-western-2025
