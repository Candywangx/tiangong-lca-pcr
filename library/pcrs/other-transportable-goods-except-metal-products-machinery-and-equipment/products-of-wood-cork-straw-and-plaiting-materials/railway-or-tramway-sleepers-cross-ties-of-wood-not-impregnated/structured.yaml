  calculation_rules:
    - id: campaign_mass
      applies_to: "all inventory rows"
      rule: "B is new accepted final sleeper mass counted once from calibrated net batch weighing or sum(M_i); distinguish dispatch, old/purchased stocks and returns/reacceptance, with documented WIP/stock physical and burden carryover. For each exchange, x = attributable complete raw-period Q / the same positive terminal B once in its native unit, including failed/zero-output events; counts only cross-check. B=0 retains totals without normalization."
      inputs:
        - Q
        - N
        - M_i
        - cp_mass
      output: "x"
      source_ids:
        - usda-wood-handbook-2021
    - id: dry_wood
      applies_to: "wood streams"
      rule: "u = (wet specimen mass − oven-dry specimen mass) / oven-dry specimen mass; dry mass = wet mass / (1+u)."
      inputs:
        - "wet mass"
        - "dry mass"
        - cp_material_receiving
        - cp_material_machining
        - cp_material_drying
        - cp_material_finishing
        - cp_material_boiler
      output: "u; dry wood mass"
      source_ids:
        - usda-wood-handbook-2021
    - id: particle_bins
      applies_to: "PM rows"
      rule: "Use cumulative tests only for the same source, period, controls and filterable basis: fine = PM2.5; middle = PM10 − PM2.5; coarse = total filterable PM − PM10. Never add PM10 or total again. Preserve condensable PM separately; missing fractions remain unknown, not zero."
      inputs:
        - cp_emission_receiving
        - cp_emission_machining
        - cp_emission_drying
        - cp_emission_boiler
      output: "three disjoint PM bins"
      source_ids:
        - epa-sawmill-pm-2014
    - id: joint_burden
      applies_to: "joint machining burdens"
      rule: "a_j = dry product mass j / sum of measured dry product masses of the primary sleeper material and actual saleable coproducts at the same joint step; assigned burden j = a_j × joint burden. These equations do not change physical outputs or internal handoffs."
      inputs:
        - cp_material_machining
        - "joint burdens"
      output: "assigned LCI"
      source_ids:
        - corrim-northern-lumber-2025
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all"
      requirement: "Same species/geometry/grade/moisture and campaign denominator in both languages and all linked records; no invented M, yield, moisture target or lifetime."
      evidence: "cp_mass; cp_material_receiving; cp_material_machining; cp_material_drying; cp_material_finishing; cp_material_boiler"
    - id: quality_completeness
      applies_to: "all"
      requirement: "Screen all actual chemicals, fuels, packaging, emissions and wastes; add individual exact rows for identified missing exchanges. Absent operations require records; unknown is not zero. Blank UUIDs preclude claims of fully resolved LCI."
      evidence: "route records; cp_emission_receiving; cp_emission_machining; cp_emission_drying; cp_emission_boiler"
    - id: quality_balance
      applies_to: "all"
      requirement: "Close original dry matter, water and carbon balances with uncertainty before burden allocation; retain stock/rework and carbon stored in product, residue, emissions and ash. Use measured carbon fractions, not generic carbon neutrality. Keep total-mass/conserved-carbon accounts separate from molecular-water and dry-component accounts: actual volatile losses and fuel consumption change dry species, and independently measured water/actual reaction evidence is required for any formation or consumption. A closure residual or COD does not establish species carbon, reaction water or evaporation."
      evidence: "raw balance and allocated burden ledgers"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validate_identity: Reject impregnated/coated/reclaimed or engineered composite inputs/outputs under this scope; confirm sawn sleeper geometry and buyer acceptance. No automatic CPC mapping acceptance."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validate_mass: Require measured M for any count-to-mass conversion, same-state B and 1 kg terminal output; inspect bilingual denominator, raw count/weight records and scale calibration."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validate_inventory: Each row is one exchange with verified flow type, species, carbon origin, medium, property and unit. Resolve applicable blank identities and screen additional species before claiming complete dataset quality. No correction flow substitutes."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validate_ledgers: Equal internal handoff amounts, unchanged physical coproduct outputs and separate burden allocation must reconcile. Check disjoint PM intervals, retained biogenic CO2, supplier/transport/heat duplication and actual drying/preservation evidence. No arbitrary balance tolerance or invented factor."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_production"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "State/specification-matched gate-to-gate inventory; cradle-to-gate only with explicit verified upstream links"
  excluded_use: "Whole-track service comparison; presumed untreated durability; CPC 31320 substitution; EPD approval; fully resolved LCI without actual quantity/provider/basis and finite-check qualification"
  required_metadata: "Site/campaign, configuration, measured M/B/moisture, raw graph, starting gate, actual drying/heat/transport, unallocated balances and separate burden shares, unresolved identities and downstream exclusions"
  required_quality_disclosure: "Measurement uncertainty, site representativeness, estimated species, absent versus unknown operations, upstream gaps and unreviewed adaptations"
  update_trigger: "Changed wood/geometry/grade/moisture, treatment status, drying/fuel/control route, supplier boundaries or flow identities"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA FPL, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021), Ch.4 pp.4-1/4-11; Ch.6 pp.6-20–6-22; Ch.13 pp.13-2/13-5–13-7; Ch.15 p.15-15. [ Original ](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf)"
    used_for: "Species/geometry, moisture and density measurement, drying/adzing/boring, durability limitations; no default density, sleeper mass or lifetime."
  - id: "corrim-northern-lumber-2025"
    type: "literature"
    reference: "CORRIM, Life Cycle Assessment of Softwood Lumber Production—Northern Region, revised July 22 2025, §§3.2.4,3.2.6,3.3,4.6–4.7. [ Original ](https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Northern-Lumber-Report-07222025.pdf)"
    used_for: "Regional softwood process/allocation and emission-screening precedent only; no numerical survey transfer to all timber or hardwood sleepers."
  - id: "epa-sawmill-pm-2014"
    type: "official_guidance"
    reference: "US EPA Region10, Particulate Matter Potential to Emit Emission Factors for Activities at Sawmills, Excluding Boilers, Located in Pacific Northwest Indian Country (May8 2014), cover and activity table. [ Original ](https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf)"
    used_for: "Activity/particle-definition screening only; nested PM and control conditions. PTE maximum capacity is not actual LCA emissions; boiler factors excluded."
  - id: "epa-ap42-wood-boilers-2022"
    type: "official_guidance"
    reference: "US EPA AP-42 §1.6, Wood Residue Combustion In Boilers (March2022), §§1.6.1–1.6.4 and Table1.6-1 footnotes. [ Original ](https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf)"
    used_for: "Actual wood-fired boiler route/species and control screening; retain biogenic CO2 LCI despite statistical convention. No numeric boiler factor adopted."
