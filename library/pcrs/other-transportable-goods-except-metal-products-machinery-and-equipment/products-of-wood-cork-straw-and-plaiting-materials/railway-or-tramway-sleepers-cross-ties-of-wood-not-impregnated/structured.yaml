measurement_rules:
  - id: net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use accepted net wood mass at measured dispatch moisture; packaging is separate."
  - id: count_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "M is the measured net mass of one sleeper of the same species, geometry, grade, machining and dispatch-moisture configuration. Weigh each accepted sleeper with a calibrated scale and identify its record using cp_mass. The primary collection basis is calibrated accepted batch net mass B kg, directly weighed or summed from the individually weighed accepted masses M_i; N is a configuration/quantity check and cannot establish B. A downstream count-based conversion would require measured same-configuration M and convert a per-sleeper amount a to a / M per kg; this is not a supported primary collection path in this edition and requires measurement-contract applicability review. No universal sleeper mass or assumed density is permitted. All inventory below uses measured B kg, never a count denominator."
  - id: wood_state
    applies_to: "all wood streams"
    required_property_ref:
      name: "Mass and volume"
      uuid: ""
    required_unit: "kg"
    rule: "Dry-basis moisture u = water mass / oven-dry wood mass; dry mass = wet mass / (1+u). Record percent versus fraction. Solid volume and density must share species, moisture and geometry; bulk chips need their own measured bulk density. Do not replace solid volume with stack volume. [usda-wood-handbook-2021]"
  - id: utility_units
    applies_to: "energy and gas rows"
    required_property_ref:
      name: "Energy; volume"
      uuid: ""
    required_unit: "MJ; m3"
    rule: "Preserve verified reference units. Electricity kWh × 3.6 = MJ. For steam, Gross calorific value/MJ in the referenced flow establishes an energy-property/unit identity only; it does not establish received net heat, fuel HHV or boiler gross thermal output. Before adopting the steam exchange, require supplier and linked background-process documentation of the same supply/delivery boundary, steam state, condensate reference enthalpy, return/makeup handling and transmission losses as cp_energy_drying and cp_energy_boiler. Measure the applicable enthalpy difference at that matched boundary; a boiler gross-output meter cannot substitute for receiver-net heat without a verified reconciliation. Unknown boundary or reference enthalpy leaves both heat rows pending methodological compatibility, even though their UUID is known. Gas volume requires actual reference temperature, pressure and compressibility; convert to mass only with traceable density at those conditions."
