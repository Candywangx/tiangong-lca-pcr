allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_separate: Avoid allocation through subdivision and dedicated measurements first. Packaging and final sleeper-only inspection burdens go entirely to the sleeper. For unavoidable joint machining burdens with saleable untreated sawdust/offcuts, use measured oven-dry product mass shares across the primary machined sleeper material and every actual saleable wood coproduct of that joint step, excluding internal duplicate links and discarded waste, when dry mass represents the physical relationship; disclose a justified alternative and sensitivity where it does not. CORRIM is a regional softwood precedent, not a universal sleeper allocation factor. [corrim-northern-lumber-2025]"
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_physical: Apply burden shares only to environmental burdens of the relevant joint step. Do not multiply physical coproduct output or internal transfer quantity by a share. Waste gets no saleable-product allocation share. Internal fuel use is a matched handoff with actual boiler emissions; do not also claim exported fuel or avoided-product credit. [corrim-northern-lumber-2025]"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "finishing"
      flow_role: "Accepted sleeper mass"
      record_type: "foreground_record"
      raw_fields: "species; configuration; campaign; batch net B; item id and net M_i where individually weighed; moisture; count check; packaging tare; calibration; one new final acceptance event; accepted production separate from dispatch/returns/reacceptance; opening/closing WIP/finished stocks and carried quantities/burdens"
      collection_method: "Weigh the accepted batch net mass B on a calibrated scale excluding packaging, or sum individual accepted net weighings M_i; match configuration, moisture and acceptance records. Count alone is not a mass measurement; do not infer M from a generic density. Retain raw period totals and the compatible attributable numerator for this process without division; document attribution of physical quantities and burdens to common final B through stocks/handoffs. After verified native-unit conversion, campaign_mass is the sole normalization step using positive B. Card formulas and aggregation_rule describe this same final reporting operation, not another division. No stage-output denominator or success-only average is allowed; B=0 retains the full pool without a normalized result."
      unit: "kg"
      frequency: "Each campaign and route change"
      temporal_coverage: "Same complete reporting period and final acceptance cohort as positive B, including failed/zero-output events and matched WIP/stock burdens"
      site_scope: "One declared site and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, signed logs, reconciliation and uncertainty retained"
