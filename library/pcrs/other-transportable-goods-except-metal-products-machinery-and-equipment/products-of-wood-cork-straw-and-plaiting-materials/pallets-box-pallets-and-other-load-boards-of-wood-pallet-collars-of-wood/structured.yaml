system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with receipt of dried, debarked solid coniferous timber and purchased steel nails, and ends with acceptance and unwrapped factory-gate release. Aggregate wood preparation, assembly and acceptance into one foreground unit, while keeping stage meters and mass records separate. Internal wood/component transfers are not extra exchanges; both ends of an internal physical link, if a dataset decomposes stages, must carry the same quantity and state. Reject rework stays inside until accepted or segregated as material waste. Source: usda-pallet-2020."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Use linked upstream supply models for forestry, sawmilling, kiln drying, any claimed HT, nail manufacture, grid electricity, maintenance oil and actual inbound deliveries. No default delivery distance or vehicle load is permitted. A background mill-gate timber model needs a separately evidenced inbound transport model; a delivered model must not duplicate it. Foreground onsite thermal energy is absent only for the selected route. Upstream combustion emissions, including biogenic CO2, remain in the LCI; a climate-reporting convention cannot delete them. Store wood carbon only as a measured material balance, not as an assumed negative elementary exchange or reuse benefit."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Where HT is claimed, link the supplier treatment batch, energy/emission boundary and conformity records to received parts. ISPM 15 Annex 1 allows treatment before assembly; a conventional HT claim requires the entire wood profile, including core, to reach at least 56 °C for 30 continuous minutes. This treatment condition supplies no energy amount or drying endpoint. Do not default to steam heat: a heat purchase would need supplier net-delivered enthalpy evidence and a separately verified exchange. Changes requiring onsite HT or untreated green timber invalidate this route. Source: ippc-ispm15-2018."
      source_ids: []
