    applies_to: "foreground_dataset_conformance"
    rule: "Reject a pressed-wood, recovered-parts or repair/pool dataset under this PCR. Reject missing upstream drying/claimed HT/inbound transport, duplicated grid losses or residue destinations, allocated physical outputs, nested dust double counting, or invented mass, density, load rating or trip credit. Claimed HT needs supplier batch/conformity evidence; measurements for a different species/geometry cannot prove it. Identity gaps and unknown emissions are unresolved rather than zero. These authoring rules do not claim semantic TIDAS approval or an independently approved methodology."
    source_ids: []
