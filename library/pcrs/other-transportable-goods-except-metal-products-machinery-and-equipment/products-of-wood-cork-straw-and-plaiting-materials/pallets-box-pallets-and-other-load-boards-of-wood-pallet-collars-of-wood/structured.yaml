  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "For each row, normalized amount = attributable period exchange / accepted net batch mass Q. Product output = Q / Q = 1 kg. Q must be positive and from cp_accept; retain each numerator unit."
      inputs:
        - "period exchange"
        - Q
        - cp_accept
      output: "row amount per 1 kg reference flow"
      source_ids: []
    - id: moisture_wood
      applies_to: "timber; pallet; sawdust_sale; offcut_sale; sawdust_waste; offcut_waste"
      rule: "Dry-basis moisture fraction u = (wet wood mass - oven-dry wood mass) / oven-dry wood mass; dry wood mass = wet wood mass / (1 + u). For pallets remove measured installed steel mass before applying wood moisture. No constant u or density."
      inputs:
        - "wood mass"
        - "measured u"
        - cp_material
        - cp_residue
      output: "dry wood and retained water"
      source_ids:
        - usda-wood-handbook-2021
    - id: electric_conversion
      applies_to: "electricity"
      rule: "Electrical work in MJ = metered kWh × 3.6; retain stage totals, apply the allocation rule to joint preparation only, then normalize_batch."
      inputs:
        - "metered kWh"
        - cp_energy
      output: "attributable MJ per reference flow"
      source_ids: []
    - id: joint_wood_share
      applies_to: "timber; electricity; oil"
      rule: "Pallet share = oven-dry mass of pallet wood components at split / (that mass + oven-dry mass of eligible sold wood co-products at split). Use only on joint preparation and associated upstream burdens; exclusive downstream burdens remain full. Physical row masses remain unchanged."
      inputs:
        - "stage meters"
        - cp_residue
        - "dry mass at split"
      output: "burden allocation share"
      source_ids:
        - usda-pallet-2020
    - id: dust_partition
      applies_to: "pm25; pm_coarse; pm_over10"
      rule: "For identical source, period and measurement definition: fine = PM2.5; middle = PM10 - PM2.5; coarse = total PM - PM10. Require total PM ≥ PM10 ≥ PM2.5 ≥ 0. Incompatible or missing measurements stay pending; never assume a particle fraction."
      inputs:
        - "compatible nested emissions"
        - cp_air
      output: "three disjoint emitted masses"
      source_ids:
        - epa-sawmill-dust-2014
  data_quality_requirements:
    - id: config_trace
      applies_to: "all inventory rows"
      requirement: "Same species/configuration, moisture and treatment state, gate and reporting period; a database flow identity alone is not a compatible background dataset."
