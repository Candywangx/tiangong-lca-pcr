allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Maintain an unallocated physical ledger for wet/dry wood, water, nails and measured carbon, including receipts, gate product, residue destinations and stock changes. Separately maintain the environmental burden ledger. Subdivide and meter wood preparation separately from nailing/acceptance where co-products are sold. Only joint wood-preparation burdens are allocated by actual oven-dry mass of pallet wood components and eligible sold wood co-products at the split; wastes are excluded from the co-product denominator. Apply the pallet share to joint upstream timber and preparation burdens. Nailing, inspection and product-specific downstream energy belong wholly to pallets. Do not multiply co-product physical outputs or internal link quantities by the pallet allocation share. Source: usda-pallet-2020, §1.4 (stage distinction); usda-wood-handbook-2021 (dry basis)."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Evidence of sale, customer-accepted product specification, lawful product/co-product status and continuing actual use distinguishes a co-product from waste; revenue alone establishes neither product status nor a reason to allocate burdens to a residue. Each residue mass follows exactly one sale/waste path. With no co-product the pallet share is one. Unknown mass, unresolved actual product status/use, incompatible receiver/provider quantity or moisture basis, or inseparable stage meters must remain explicit gaps in a production dataset. Assign waste handling to its generating activity and disclose the chosen offsite background boundary. No default avoided fuel/material burden, recycling credit, lifetime extension or system expansion is included."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_accept
      process_id: "pallet_manufacture"
      flow_role: "pallet"
      record_type: "acceptance and weighing"
      raw_fields: "lot; configuration; species; dimensions; block/stringer; nail specification; accepted count; tare; accepted net batch mass Q; moisture; rejects; gate"
      collection_method: "Calibrated scale weighing of accepted complete pallets without wrapping or cargo; reconcile order and reject records. Keep measured piece weights only as supplementary actual records."
      unit: "kg"
      frequency: "every lot"
      temporal_coverage: "same reporting period and accepted configuration"
      site_scope: "actual line/site and suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable original records; sampling coverage; reconciliation"
    - protocol_id: cp_material
      process_id: "pallet_manufacture"
      flow_role: "timber; nails"
      record_type: "receipts, stock and issues"
      raw_fields: "supplier; species; grade; dimensions; wood moisture; wet and oven-dry sample masses; nail type/coating/count; mass; opening/closing stock; returns; supplier kiln/HT batches; inlet transport"
      collection_method: "Weigh net materials by lot, reconcile supplier and stock records. Oven-dry representative species/lot wood samples to constant mass under a documented method; calibrated moisture meters require species and temperature correction evidence. Verify supplier treatment and delivery boundaries."
      unit: "kg; kg/kg"
      frequency: "every lot and stock close"
      temporal_coverage: "same reporting period and accepted configuration"
      site_scope: "actual line/site and suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable original records; sampling coverage; reconciliation"
    - protocol_id: cp_energy
      process_id: "pallet_manufacture"
      flow_role: "electricity"
      record_type: "stage meter readings"
      raw_fields: "meter; voltage; supply geography; timestamps; readings; preparation/nailing/extraction/handling/branding subtotals; allocation driver; reporting lot"
      collection_method: "Use calibrated interval meters; reconcile line totals and invoices. Separate preparation from downstream assembly and acceptance; meter electric compressor and handling, including idle demand attributable to production."
      unit: "kWh; MJ"
      frequency: "continuous, close each reporting period"
      temporal_coverage: "same reporting period and accepted configuration"
