    - protocol_id: cp_residue
      process_id: "pallet_manufacture"
      flow_role: "sawdust_sale; offcut_sale; sawdust_waste; offcut_waste; steel_waste"
      record_type: "segregated weigh tickets and destinations"
      raw_fields: "source stage; residue type; wet/dry mass; moisture; sale or waste; particle/solid form and dimensions; treatment state; receiver; accepted product specification; lawful status/use evidence; provider/downstream reference quantity and moisture basis; invoice/manifest; recovered nails; internal return; stock; measured carbon fraction if used"
      collection_method: "Weigh separate bins and document destination, sale/use and treatment. Verify actual customer specification, lawful product/co-product status and continuing use before treating a sold stream as product; verify receiver/provider native mass-moisture and boundary compatibility separately from the broad UUID. Sample wood moisture using the same dry-basis method. Separate wood and steel from rejects; count internal rework once and reconcile unallocated physical balances before allocating burdens."
      unit: "kg; kg/kg"
      frequency: "each bin/dispatch and period close"
      temporal_coverage: "same reporting period and accepted configuration"
