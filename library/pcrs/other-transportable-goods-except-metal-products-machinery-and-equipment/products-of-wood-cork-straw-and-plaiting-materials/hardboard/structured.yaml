allocation_rules:
  - rule_id: separate_ledgers
    applies_to: "wet_mill"
    rule: "Retain the unallocated physical process graph, whole-stream mass and elemental balances, and separate water/reactive-component ledgers independently of allocated environmental burdens. Internal link quantities and actual co-product masses are never multiplied by allocation shares. Record off-spec board sale versus waste status."
    source_ids: []
  - rule_id: subdivide_first
    applies_to: "wet_mill"
    rule: "Separate products by binder, thickness and heat/oil state and meter attributable operations before allocating shared burdens. Prefer demonstrated causal allocation with measured drivers; when no defensible physical relationship exists, use documented economic shares with period prices and sensitivity, not an invented universal percentage."
    source_ids: []
  - rule_id: recovery_allocation
    applies_to: "wood_reject; wood_fuel; wastewater"
    rule: "Internal recovered fibre receives no avoided-virgin-product credit. Internal fuel combustion retains actual carbon emissions. External waste receives compatible treatment once; saleable co-products require a declared allocation or expanded-system model without mixing both. Recovered-fibre losses and stock changes remain in physical balances."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "wet_mill"
      flow_role: "finished_board"
      record_type: "dispatch acceptance"
      raw_fields: "lot; net accepted mass Q; packaging tare; rejects/returns; specimen mass; dry mass; length/width/thickness; density; moisture basis; conditioning T/RH; surface grade; binder and oil/heat state"
      collection_method: "Calibrated net weighing with paired specimen dimensional and constant-mass moisture tests; record method/version and volatile bias; reconcile shipment and production stocks"
      unit: "kg; m; kg/m3; moisture fraction"
      frequency: "each lot and each declared state"
      temporal_coverage: "Representative declared production period with startup, shutdown and seasonal coverage disclosed"
      site_scope: "One named mill, declared route and treatment state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, primary records, analytical QC and coverage/uncertainty report"
    - protocol_id: cp_material
      process_id: "wet_mill"
      flow_role: "inputs"
      record_type: "receipt/dosing record"
      raw_fields: "row_id; delivery lot; formulation; purity; water/solids fraction; receipt volume and solid/bulk packing; wet/dry mass; species; dose; losses; opening/closing stock; oil applied and retained; stage inlet/outlet water and component masses; actual binder formulation and cure extent; evidence for wood/heat and oil-treatment transformations and any oxygen uptake"
      collection_method: "Calibrated scales/flow meters, supplier declarations and stage dosing logs; sample chip moisture and measured mass/volume conversion; retain analytical emulsion components without duplicate purchased carriers; pair stage samples and formulation/cure records with water-specific assays and component analyses that distinguish moisture, reaction products and other volatiles; an oven-loss result alone is not reaction water"
      unit: "kg; m3"
      frequency: "each delivery and shift"
      temporal_coverage: "Representative declared production period with startup, shutdown and seasonal coverage disclosed"
      site_scope: "One named mill, declared route and treatment state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, primary records, analytical QC and coverage/uncertainty report"
    - protocol_id: cp_energy
      process_id: "wet_mill"
      flow_role: "utilities"
      record_type: "meter/fuel record"
      raw_fields: "stage; supply voltage; kWh; fuel volume; T; absolute P; wet/dry composition; Z; fuel wet mass; heating value; steam mass/P/T/dryness; condensate mass/T/P; losses; supplier reference basis; actual fuel elemental composition and moisture; combustion/oxidation air amount, composition and humidity; operating state and measured reaction products/unburned residues"
      collection_method: "Meter each stage and onsite generator; supplier basis confirmation with calibrated meters and steam-table enthalpy at measured state; separate purchased from internally generated steam and startup/idle loads; reconcile fuel, air, stack and residue endpoints for actual onsite combustion/oxidation only, using source-specific measurements or a documented stoichiometric model with evidenced conversion and uncertainty, not assumed complete combustion"
      unit: "kWh; MJ; m3; kg"
      frequency: "continuous meters, interval/shift totals"
      temporal_coverage: "Representative declared production period with startup, shutdown and seasonal coverage disclosed"
      site_scope: "One named mill, declared route and treatment state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, primary records, analytical QC and coverage/uncertainty report"
    - protocol_id: cp_water
      process_id: "wet_mill"
      flow_role: "forming/treatment"
      record_type: "hydraulic and analysis record"
      raw_fields: "makeup; white-water circulation; recovery inlet/outlet consistency; recovered dry fibre; purge; treatment transfer; direct discharge/bypass interval volume; COD/BOD5/TSS/phenol/formaldehyde concentration; receptor; method/version; sample preservation/holding; detection limit; blank/recovery; uncertainty; filtered/whole sample; stage inlet/outlet H2O and reactive-species amounts; actual onsite treatment reagents, reaction products and formation/consumption evidence"
      collection_method: "Meter matched streams, flow-proportional sampling by operating state and bypass events; use the analytical methods below or demonstrated equivalent methods with full QC. Measure both recovery links; no assumed recovery efficiency. Keep measured aqueous whole-stream mass distinct from H2O mass and dissolved/suspended components; pair treatment inlet, outlet, gas and sludge measurements and evidence the actual reactions, without treating removed COD/BOD as conserved material mass"
      unit: "kg; m3; mg/L; mg O2/L; kg dry fibre"
      frequency: "continuous flow; representative interval samples; each bypass"
      temporal_coverage: "Representative declared production period with startup, shutdown and seasonal coverage disclosed"
      site_scope: "One named mill, declared route and treatment state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, primary records, analytical QC and coverage/uncertainty report"
    - protocol_id: cp_air
      process_id: "wet_mill"
      flow_role: "emissions"
      record_type: "stack/fugitive record"
      raw_fields: "source; fuel/wood/resin carbon origin; control; operating hours; stack flow T/P/humidity; concentration; species CAS; analyte mass vs carbon equivalent; NOx monitoring/LCI/LCIA mass definition and compatibility (NO2-equivalent or actual NO+NO2; excludes N2O); aerodynamic size; filterable/condensable basis; detection limit; methods/version; carbon/water balance; oil treatment; stage-specific reaction-water evidence; inlet/outlet humidity and vapour; cure and combustion/oxidation extent"
      collection_method: "Representative after-control stack and fugitive testing with calibrated volume/concentration bases, startup and bypass coverage. Speciate organics by validated sampling/chromatography; aggregate VOC-as-carbon cannot become a named species. Water vapour requires a reconciled stage H2O balance including evidenced reaction formation/consumption; distinguish process evaporation, utility combustion/oxidation, oil-treatment reactions and inlet humidity without duplicating outlet vapour. Verify NOx monitoring/LCI/LCIA mass correspondence without invented component fractions; unknown correspondence keeps its quantity and characterization pending"
      unit: "kg; mg/m3; m3"
      frequency: "representative operating states and treatment recipes; continuous hours"
      temporal_coverage: "Representative declared production period with startup, shutdown and seasonal coverage disclosed"
      site_scope: "One named mill, declared route and treatment state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, primary records, analytical QC and coverage/uncertainty report"
    - protocol_id: cp_residue
      process_id: "wet_mill"
      flow_role: "residues"
      record_type: "destination/weight record"
      raw_fields: "row_id; material state; binder/oil content; wet mass; dry solids; unburned carbon; recovery/internal fuel/export; destination; waste/sale status; stocks"
      collection_method: "Calibrated weighing, solids testing and receiver documents; separate each physical residue, internal transfers and exported waste; do not merge captured dust with emitted particulate matter"
      unit: "kg"
      frequency: "each removal and shift"
      temporal_coverage: "Representative declared production period with startup, shutdown and seasonal coverage disclosed"
      site_scope: "One named mill, declared route and treatment state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, primary records, analytical QC and coverage/uncertainty report"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "q_i = X_i / Q; X_i is the attributable exchange amount over the same declared production period; Q is kg net accepted board at dispatch moisture. Reference output equals 1 kg. This is period mass normalization, not a per-board-count or per-machine conversion."
      inputs:
        - X_i
        - Q
        - cp_product
      output: "q_i"
      source_ids: []
    - id: moisture_conversion
      applies_to: "wood_chip; wood_fuel; finished_board; sludge"
      rule: "For wet-basis fraction w: dry mass = wet mass × (1 − w). For dry-basis ratio u: dry mass = wet mass / (1 + u); w = u / (1 + u). Percent values first divide by 100. Density uses mass and specimen volume at the same conditioning state."
      inputs:
        - "wet mass"
        - "dry mass"
        - w
        - u
        - dimensions
      output: "dry-solids ledger and declared density"
      source_ids: []
    - id: water_load
      applies_to: "cod; bod; tss; phenol_water; formaldehyde_water"
      rule: "L_i = sum(C_i,j × V_j) × 0.001; concentration in mg/L and paired interval volume in m3 yield kg analyte, dried residue or oxygen equivalent. Then divide L_i by Q. Use direct-outfall intervals only; no transferred wastewater loads. Do not sum COD+BOD5+species as a physical pollutant mass."
      inputs:
        - C_i
        - j
        - V_j
        - Q
        - cp_water
      output: "kg / kg reference flow"
      source_ids:
        - epa-cod-4104-1993
        - epa-bod-4051
        - epa-tss-1602
    - id: steam_enthalpy
      applies_to: "steam"
      rule: "Net delivered heat = sum(m_steam × h_supply − m_condensate_return × h_return), with defined common enthalpy datum, measured steam quality and losses across the declared delivery/return boundary. Mass input remains separately recorded. Supplier heat-reference boundary must match; unknown correspondence is unresolved, not inferred from an MJ property."
      inputs:
        - "steam and condensate masses"
        - "measured states"
        - "supplier basis"
      output: "kg steam and MJ net heat"
      source_ids: []
    - id: physical_balance
      applies_to: "wet_mill"
      rule: "Keep conserved whole-stream mass and elemental balances (including C by biogenic/fossil origin, H and O) separate from H2O and reactive dry-component ledgers. For conserved mass/elements: opening stock + inputs = closing stock + outputs; include actual fuel, air/oxygen, moisture, product, liquid/gas releases and residues crossing the selected boundary. For each reactive component i: opening stock_i + inputs_i + evidenced formation_i = closing stock_i + outputs_i + evidenced consumption_i. Dry wood/resin/oil solids are measured states, not conserved species through reaction. Apply formation/consumption only to actual PF cure, wood/heat or oil-treatment transformations, onsite fuel/VOC oxidation, and onsite wastewater reactions within their own stage boundaries. Evidence reaction terms with actual formulation, cure/conversion extent, fuel/air composition, paired stage measurements or an applicable source-specific stoichiometric model and uncertainty; no universal yield, assumed complete conversion or residual-derived reaction term. Nonreactive transfers have zero reaction terms only with evidence; internal links cancel at matched measured endpoints. Retain all actual exchanges and carbon in product, reject, sludge, ash and gas; no automatic sequestration credit. Quantify unexplained residual separately and compare it with documented measurement uncertainty, without invented tolerance or treating it as measured loss/reaction water. Unresolved terms make reconciliation inconclusive."
      inputs:
        - cp_material
        - cp_product
        - cp_energy
        - cp_water
        - cp_air
        - cp_residue
        - "evidenced stage reaction terms"
      output: "unallocated conserved-mass/element and reactive-component ledgers"
      source_ids:
        - epa-hardboard-2002
        - usda-wood-handbook-2021
        - epa-wood-boiler-2022
  data_quality_requirements:
    - id: route_identity
      applies_to: "wet_mill"
      requirement: "Document hydraulic formation and wet pressing, batch/state segregation, recovery equipment and binder/oil recipe; a product name or legal density class is insufficient."
      evidence: "Process diagram and site records"
    - id: measurement_quality
      applies_to: "all inventory rows"
      requirement: "Same Q, period and route in both physical and burden ledgers; calibration, representative sampling and uncertainty. No silent zero for missing UUID, unmeasured emission, detection-limit result or unresolved reaction term. Distinguish measured moisture/solids from reaction transformation and disclose stage evidence and residual uncertainty."
      evidence: "Protocols and conserved-mass/element and reactive-component balances"
    - id: identity_background
      applies_to: "all inventory rows"
      requirement: "Verify exact flow type, medium/submedium, origin, species and reference property/unit. A verified broad physical identity still needs supplier dataset and basis compatibility. Unknown identity/basis prevents complete dataset acceptance; document each actual additional atomic chemical, fuel, package, transport and emission."
      evidence: "Supplier data and explicit completeness disclosure"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_board"
    rule: "Exactly one net accepted board reference output is linked; reference amount, denominator, declared moisture/grade/treatment and conversion agree."
    source_ids: []
  - rule_id: validate_route
    applies_to: "wet_mill"
    rule: "Reject dry MDF/HDF, dry pressing of pre-dried wet mats, other fibreboards and unresolved route/product identity. Record actual density, moisture, thickness and post-press state; do not substitute statutory limits."
    source_ids:
      - epa-hardboard-2002
      - usda-wood-handbook-2021
  - rule_id: validate_balance
    applies_to: "wet_mill"
    rule: "Physical internal links balance at paired stage endpoints before allocation; reference outputs/co-products remain actual masses. Check conserved whole-stream mass and elemental C/H/O separately from H2O and reactive dry-component formation/consumption. Require evidence for the actual formulation, cure/oxidation/treatment extent and stage boundary; boiler water cannot be assigned to nonreactive finishing/profiling, and purchased-utility combustion is upstream. Retain actual exchanges, prevent duplicate reaction water and separate unexplained residual from measured loss. No default yield, assumed zero reaction or residual-derived chemistry; incomplete measurements or unresolved reaction terms are inconclusive."
    source_ids:
      - epa-hardboard-2002
      - usda-wood-handbook-2021
      - epa-wood-boiler-2022
  - rule_id: validate_discharge
    applies_to: "wastewater; cod; bod; tss; phenol_water; formaldehyde_water"
    rule: "External treatment transfer and direct release are exclusive for the same water fraction. Analytical unit, method/version, sampling boundary, receiver, dilution and detection status are mandatory. COD/BOD indicators and chemical species are distinct, with no unsupported summed toxicity/oxygen impact."
    source_ids:
      - epa-cod-4104-1993
      - epa-bod-4051
      - epa-tss-1602
      - epa-phenol-8270e-2018
      - epa-carbonyl-8315a-1996
  - rule_id: validate_air
    applies_to: "co2_bio; co2_fossil; co_bio; co_fossil; ch4_bio; ch4_fossil; nox; pm_fine; pm_mid; pm_coarse"
    rule: "Keep biogenic/fossil origins and outdoor media correct; retain biogenic CO2 in LCI. Use disjoint particle bins, account for filterable versus condensable methods and reject indoor/correction/long-term substitutes. No double emissions from purchased heat and onsite fuels. For NOx, monitoring, LCI and LCIA must use compatible NO2-equivalent or actual NO+NO2 mass definitions; exclude N2O, prevent overlap with single NO/NO2 rows and retain quantity/characterization pending when compatibility is unknown."
    source_ids:
      - epa-hardboard-2002
      - epa-wood-boiler-2022
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Every applicable actual flow needs one atomic row, protocol, quantity and compatible background/treatment link. Not-applicable requires evidence; unresolved identity or steam/chip/gas basis is explicit. Complete dataset approval is withheld while these remain."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_process_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Wet-pressed wood hardboard supply matching the declared formulation, moisture and treatment state after completeness checks"
  excluded_use: "MDF/HDF dry-route proxy; wet/dry hardboard proxy; legal conformity certification; service-life equivalence; generic universal emission factors"
  required_metadata: "Site/time; route diagram; Q; density/moisture/thickness; recipe and treatment state; carbon origin; internal links; transport; energy/steam bases; waste/discharge routes; allocation"
  required_quality_disclosure: "Sampling and uncertainty; unallocated physical versus allocated burden ledgers; sources/basis compatibility; skipped/missing flows; unresolved UUIDs; actual geographical/temporal scope; analytical methods and detection treatment"
  update_trigger: "Route, feed/binder/oil, moisture/thickness, utility, recovery, emissions control or wastewater routing change"
data_sources:
  - id: "epa-hardboard-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 10.6.4, September 2002, pp.10.6.4-1, -5–-6, -8–-9; https://www.epa.gov/sites/default/files/2020-10/documents/c10s0604.pdf"
    used_for: "Historical wet-route decomposition, press-water recycling and air source distinctions; no modern site recipe, setting or factor adoption"
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, FPL-GTR-282, March 2021, chapter11 pp.11-13–11-15 and glossary p.G-12, Polymer; https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Wet/dry product distinctions; some binder-free boards; hydraulic forming; conditional heat, oil tempering and humidification; recycling capability; qualitative polycondensation/water-loss distinction, not an actual PF cure extent, reaction-water yield or mill yield"
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "US EPA, AP-42 1.6, March 2022, pp.1.6-1–1.6-3; https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf"
    used_for: "Conditional onsite wood-residue boiler boundary and pollutants; no boiler factor copied from sawmill-dust studies; preserve physical biogenic carbon"
  - id: "epa-cod-4104-1993"
    type: "official_guidance"
    reference: "US EPA Method410.4, rev2.0, August1993, sections1–2,4,8–9; https://www.epa.gov/sites/default/files/2015-08/documents/method_410-4_1993.pdf"
    used_for: "COD analytical basis and quality controls, not discharge limits"
  - id: "epa-bod-4051"
    type: "official_guidance"
    reference: "US EPA Method405.1, issued1971, editorial revision1974, p.405.1-1 (official archive PDF page34); https://semspub.epa.gov/work/03/130972.pdf"
    used_for: "BOD five-day analytical definition; archived method only, no archive-site measurements transferred"
  - id: "epa-tss-1602"
    type: "official_guidance"
    reference: "US EPA Method160.2, p.160.2-1 (official archive PDF page351; edition not asserted); https://semspub.epa.gov/work/03/160260.pdf"
    used_for: "Filter-retained dried residue definition and interferences; no landfill-site parameters transferred"
  - id: "epa-phenol-8270e-2018"
    type: "official_guidance"
    reference: "US EPA Method8270E, rev6, June2018, sections1–2 and phenol analyte table; https://www.epa.gov/sites/default/files/2019-01/documents/8270e_revised_6_june_2018.pdf"
    used_for: "Compound-specific phenol GC/MS with aqueous matrix validation"
  - id: "epa-carbonyl-8315a-1996"
    type: "official_guidance"
    reference: "US EPA Method8315A, rev1, December1996, sections1–3, procedure1; https://www.epa.gov/sites/default/files/2015-12/documents/8315a.pdf"
    used_for: "Aqueous free-formaldehyde DNPH/HPLC basis, artifacts and phase definition"
  - id: "epa-hardboard-wasteload-1979"
    type: "official_guidance"
    reference: "US EPA, Raw Wasteload Characteristics of the Hardboard Industry, EPA-600/2-79-008, January1979, printed pp.13 and15 (PDF25/27), Broke Dilution Water and White Water Recycle; https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9101B18N.TXT"
    used_for: "Historical wet broke return to stock chest and white-water reuse/saveall possibilities; only qualitative process descriptions, no survey/experiment numbers or universal recovery rate adopted"
