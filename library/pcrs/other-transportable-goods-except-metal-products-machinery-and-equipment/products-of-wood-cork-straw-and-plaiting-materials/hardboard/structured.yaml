product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.products-of-wood-cork-straw-and-plaiting-materials.hardboard"
  classification_refs: "CPC 3.0 31442; narrower"
  covered_products: "Wet-formed, wet-hot-pressed wood hardboard, with recipe-specific binder and declared treatment state"
  excluded_products: "Dry-process MDF/HDF; wet/dry hardboard; other low-density fibreboard; non-wood feedstock; coated/laminated assemblies"
  representative_product: "Uncoated wet-pressed wood hardboard, trimmed and conditioned, at mill dispatch"
  production_route: "Purchased wood chips → washing/cooking/refining → stock preparation → hydraulic forming and white-water/fibre recovery → wet hot pressing → conditional heat/oil treatment → conditioning → finishing and packing"
  market_state: "Net accepted board at recorded dispatch moisture; packaging separately inventoried"
functional_unit:
  what: "Supply declared wet-process wood hardboard; no service equivalence implied"
  how_much: "1 kg net accepted board"
  how_well: "Declared density, thickness, moisture basis, surface grade, binder formulation and heat/oil treatment state; site acceptance records"
  how_long_or_cycle: "One mill dispatch event; service life is outside this supply reference"
  reference_flow_link: "finished_board"
system_boundary:
  rules:
    - rule_id: mill_boundary
      applies_to: "wet_mill"
      rule: "Include received-chip handling, washing/cooking/refining, hydraulic forming, fibre recovery, wet pressing, actual post-press treatment, conditioning, finishing, packaging and onsite utilities/control/treatment. Stage subledgers remain separate inside one aggregated foreground unit."
      source_ids:
        - epa-hardboard-2002
        - usda-wood-handbook-2021
    - rule_id: upstream_transport
      applies_to: "purchased inputs"
      rule: "Link inputs to route-compatible upstream production and measured inbound transport; do not infer forestry or sawmill burdens from chip mass. Extend the same inventory with one verified atomic transport-service row per actual mode. Capital equipment, use and end of life are excluded by default with disclosure."
      source_ids: []
    - rule_id: internal_recovery
      applies_to: "wet_mill"
      rule: "Measure white-water flow, consistency and recovered dry fibre from screens/save-all, pressing and edge trim. The source supports recovery possibilities, not a universal recovery technology or rate. Link both ends at equal physical amounts; circulating fibre/water is neither new purchased input nor exported waste."
      source_ids:
        - epa-hardboard-2002
        - usda-wood-handbook-2021
        - epa-hardboard-wasteload-1979
    - rule_id: treatment_boundary
      applies_to: "wastewater; cod; bod; tss; phenol_water; formaldehyde_water"
      rule: "Choose onsite treatment plus actual final receiving-water emissions, or external wastewater transfer plus compatible treatment dataset. For split routes use measured fractions. Never attach influent pollutant loads as direct emissions to a transferred wastewater stream; bypass loads remain direct."
      source_ids: []
    - rule_id: utility_boundary
      applies_to: "wet_mill"
      rule: "Keep externally purchased steam separate from onsite fuel conversion. Onsite steam/heat is a physical internal link, with generator fuels, emissions, ash and losses once; no second background steam burden. Include actual boiler and oxidizer auxiliaries; no boiler estimate from sawmill-dust PTE."
      source_ids:
        - epa-hardboard-2002
        - epa-wood-boiler-2022
boundary_abstraction:
  declared_starting_condition: "Clean purchased wood chips received at the mill, with origin, moisture and receipt condition declared"
  starting_condition_role: "foreground_starting_condition"
  product_classification_scope: "CPC 3.0 31442; wet-process subset"
  recursive_input_rule: "Externally purchased hardboard used as feed remains a separate same-category input with an upstream dataset; it is outside the clean-chip route and requires explicit scope extension. Internal wet trim recovery is not recursion."
  upstream_dataset_requirement: "Route, material state, quantity basis, geography/time, supplier and transport compatible evidence; unresolved UUIDs never become automatic background links"
  disclosure: "Scope extensions, actual recovery equipment, exclusions, transport, utility boundary, wastewater route, carbon origins and completeness"
