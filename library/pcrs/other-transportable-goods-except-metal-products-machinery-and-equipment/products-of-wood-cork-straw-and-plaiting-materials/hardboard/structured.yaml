measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The reference is 1 kg net accepted board at measured dispatch moisture. Collect Q as the period total in cp_product, excluding packaging, returns and rejects. All inventory uses per 1 kg reference flow."
  - id: state_measurement
    applies_to: "finished_board"
    required_property_ref:
      name: "Mass; Volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Measure specimen net mass and length/width/thickness under documented conditioning; density equals mass/volume at that same moisture. Determine oven-dry mass with a documented constant-mass method and validate oil/resin volatile bias. Declare dry-basis moisture u or wet-basis fraction w; never mix them."
  - id: flow_basis
    applies_to: "wood_chip; gas; steam"
    required_property_ref:
      name: "Volume; Mass"
      uuid: ""
    required_unit: "m3; kg"
    rule: "Chip solid/bulk volume and gas reference T/P/composition/Z must match supplier reference amounts. Steam mass and net delivered enthalpy are separate; MJ identity alone does not prove the enthalpy boundary. Unknown bases block supplier linkage."
  - id: analytical_basis
    applies_to: "cod; bod; tss; phenol_water; formaldehyde_water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "COD and BOD5 use kg oxygen equivalent, TSS kg dried filter residue, phenol kg CAS108-95-2 and formaldehyde kg CAS50-00-0. Concentrations and hydraulic volume must share the interval and sample boundary. Total phenolics, TOC, COD and species are not interchangeable mass measures."
