review_metadata:
  source_flow_classification_review:
  - flow_uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
    row_ids:
    - pack_pe
    reported_classification: CPC 29220 luggage and handbags
    physical_identity_evidence: Concordant polyethylene-film names, CAS 9002-88-4 and physical-film comment.
    qualification: Actual polyethylene-film material/state and grade, supplier and provider boundaries must match;
      no generic packaging background is implied.
    review_state: Source classification inconsistency unresolved; source/provider clarification required. No fully
      verified classification or background compatibility claim.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  independent_scientific_review: pending
  classification_mapping:
    recommended_relation: narrower
    reason: Method covers wet-formed wet-pressed wood hardboard only; CPC Hardboard
      also permits dry and wet/dry routes. Controller acceptance required; no
      accepted edge authored.
  unresolved_flow_uuids:
    - row_id: steam
      reason: Bounded direct reads show incompatible high-pressure or stripping steam;
        supplier mass/enthalpy and background definition remain unconfirmed.
    - row_id: tung_oil
      reason: Only seed returned by bounded search; oil identity unconfirmed.
    - row_id: wastewater
      reason: Direct reads restrict candidates to direct-water discharge or
        paper/manganese production; no compatible wet-hardboard
        treatment-transfer identity confirmed.
    - row_id: sludge
      reason: Paper/municipal sludge or ambiguous water-treatment chemical candidates
        do not establish dewatered wet-hardboard treatment-sludge identity.
  quantity_background_compatibility:
    wood_chip: Volume/m3 identity confirmed. Solid/bulk convention, packing,
      moisture and supplier reference basis require foreground confirmation.
    gas: Volume/m3 identity confirmed. T/P, dry/wet composition, Z and supplier
      volume basis require foreground confirmation.
    steam: Saturated mass delivery recorded separately from net enthalpy; both
      identity and supplier basis unresolved. MJ property alone cannot prove
      compatibility.
    electricity: Selected flow is 35–330 kV grid consumption mix only; other
      voltage/routes require verified replacement.
    formulations: PF resin, petroleum wax, aluminium sulfate powder and tempering
      oils retain actual grade/recipe/solids/carriers; no database recipe or
      energy values adopted.
    nox: Identity Mass/kg confirmed; NOx monitoring/LCI/LCIA mass definitions
      (NO2-equivalent or actual NO+NO2) require compatibility confirmation.
      Unknown correspondence leaves quantity and characterization pending. No
      invented component/split factors; excludes N2O and duplication with single
      NO/NO2.
  reactive_component_reconciliation:
    rule: Keep conserved whole-stream mass and elemental C/H/O balances separate
      from H2O and reactive dry-component ledgers; include evidenced actual
      formation/consumption within paired stage boundaries before allocation.
    dataset_evidence_pending: Actual formulation and cure/oxidation/treatment
      extent, carrier moisture, fuel/air composition and humidity, paired stage
      measurements or applicable source-specific stoichiometry and uncertainty
      are required. No universal yields or reaction terms inferred from residuals.
    scope: Actual PF cure, wood/heat and oil-treatment transformations, onsite
      fuel/VOC oxidation and onsite wastewater reactions only. Nonreactive
      finishing/profiling cannot inherit boiler water; purchased-utility
      combustion remains upstream.
    review_state: Independent scientific review remains pending; engineering
      reconciliation repair does not approve methodology or translation.
  coverage_limitations: This is authored route methodology, not a complete
    foreground dataset. All applicable unresolved flows/bases and
    receiver-specific substitutions must be resolved for dataset acceptance.
  source_limitations: EPA 2002 supports historical route only; USDA supports
    technology distinctions, not a mill recipe/recovery yield. No CORRIM
    softwood survey, sawmill dust PTE, legal density limit or default emission
    factor transferred. EPA-600/2-79-008 (January1979) adds visually verified
    wet broke return/white-water reuse descriptions only; no old mill/experiment
    water, recovery or pollutant parameters generalized.
  quantity_pending:
    - row_id: nox
      reason: Identity Mass/kg confirmed; NOx monitoring/LCI/LCIA mass definitions
        (NO2-equivalent or actual NO+NO2) require compatibility confirmation.
        Unknown correspondence leaves quantity and characterization pending. No
        invented component/split factors; excludes N2O and duplication with
        single NO/NO2.
