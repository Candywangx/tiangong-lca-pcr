    - rule_id: boundary_route
      applies_to: "manufacturing"
      rule: "Include all declared log preparation, rotary veneer production, drying/redrying, species/face-core sorting, PF preparation/spreading, layup/press/cure/cooling, finishing, tests/rejects, packing and clean-chip steam generation/controls. Keep stage measurements within this one aggregated foreground process."
