        - itto-tropical-plywood-2014
    - rule_id: boundary_transfers
      applies_to: "manufacturing"
      rule: "Internal chips and steam are not external products, purchased fuel or heat. Pair both ends of every transfer and retain boiler losses/emissions. External waste treatment is linked once; downstream fabrication, installation, use and end-of-life are outside this manufacturing unit."
