      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_subdivide | manufacturing | First meter and subdivide veneer, drying, PF/press/finishing, packing, boiler and controls; directly assign product-specific work. Only irreducibly shared burdens may enter an allocation calculation after a documented causal driver is justified. | epa-plywood-2002 |\n| allocation_causation | shared burdens | For each shared burden identify the physical relation to dry-wood throughput, actual thermal demand or machine time using cp_energy/cp_wood records. Use s_j=D_j/sum(D_j), with exhaustive shares summing to one, only where that relation is evidenced. No default mass or economic fraction. A missing cause requires review, not an arbitrary allocation. | itto-tropical-plywood-2014 |\n| allocation_ledgers | all inventory rows | Preserve full physical generation, internal transfers, co-products, wastes, packaging and emissions in the gross ledger. Apply shares to the relevant burden ledger once; do not multiply sold bark, cores, chips or waste physical mass by a burden share. Packaging is a direct panel burden, not a co-product allocation destination. | itto-tropical-plywood-2014 |\n| allocation_loops | manufacturing | Internal chips, rework and steam earn no substitution credit or duplicate input/output burden. Retain combustion, rejects, repeated processing and startup energy. First-release Q excludes repeated loop passes and re-release of already accepted panels. | epa-plywood-2002; epa-wood-boiler-2022 |\n\n"
