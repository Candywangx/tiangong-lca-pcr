        - epa-plywood-2002
        - epa-wood-boiler-2022
    - rule_id: boundary_inventory
      applies_to: "manufacturing"
      rule: "Survey ancillary water treatment chemicals, boiler additives, oils, hydraulic fluids, abrasives, filters, knives, cleaning agents and control consumables. Establish supported absence or add each actual atomic input and spent stream before claiming dataset completeness; no silent mass/energy cutoff."
