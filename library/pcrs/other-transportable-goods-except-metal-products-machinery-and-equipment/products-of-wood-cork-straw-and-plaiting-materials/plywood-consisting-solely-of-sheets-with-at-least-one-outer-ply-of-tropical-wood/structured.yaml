          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_tropical_boundary | reference product | Verify at least one actual tropical outer ply, full veneer crossed construction, stated PF and untreated/uncoated gate, botanical/origin evidence, surface/moisture and grade tests. The representative route never implies full-leaf or all-species/adhesive approval. | unsd-cpc3-2025; wood-handbook-2021 |\n| validate_release | all inventory rows | Require calibrated net mass and one finished_panel manufacturing output per 1 kg reference flow using only its new lot's first-release Q, including closing FG once. Opening accepted FG, same-panel returns and rework/re-release add no Q. Verify original Qc and full exchange-indexed V/A/U_p inheritance for accepted old cohorts, distinct from unreleased prior-WIP carryover; later services/losses stay on that cohort in separate service/continued views, never on unrelated current Q or a repeated manufacturing output. Exclude packing/tests/rejects from Q; reconcile opening/closing raw/WIP/FG, gross dispatch/returns, vector splits/merges and Q=0/idle/failed/cleanup records without inventing missing inheritance. | epa-plywood-2002 |\n| validate_physical | manufacturing | Check unallocated wood, cured-glue, water and carbon balances including clean-chip boiler, ash/capture, stocks and loops; preserve unknown chemistry/air corrections and uncertainty. Keep full physical exports apart from the separately attributed/allocated burden ledger. | wood-handbook-2021; epa-wood-boiler-2022 |\n| validate_emissions | all elementary output rows | Verify actual species/CAS/air medium, post-control outlets, carbon origins and non-overlapping particle intervals. Add observed fossil glue gases or other species as separate verified exchanges. Missing or unspeciated measurements cannot pass by assuming zero. | epa-plywood-2002; epa-wood-boiler-2022 |\n| validate_packaging | manufacturing | For each atomic component verify mutually exclusive P (also bundled purchases), first external nonpurchase N_ext, and ER with same-item prior outward evidence; verify separate EO and owner/custodian/cohort/full inherited V/A/U_p. Reconcile disjoint empty/raw-attached/WIP-attached/new-FG-attached/old-FG-attached/reusable O/C, paired internal legs, all gross dispatch/service/repair/return/waste legs and actual transport. No net offset may hide a real movement or service. Whole supply and included component manufacture count once; actual washing/repair/transport/loss/replacement increment once on the original cohort/Qc when serving old FG. Missing invoices, free entry or unknown prior burdens cannot mean zero; disclose unknowns, ownership and actual cycles without a default lifetime/credit, extra panel Q or repeated provider charge. | itto-tropical-plywood-2014 |\n| validate_links | dataset | Recheck primary log/PF/reference identities and full native property/unit chains, actual supplier boundaries, chip solid/bulk quantity and waste treatment. Report accepted input, checks performed/skipped, findings and completeness. An unresolved core input or material physical conflict blocks completed-dataset claims; auxiliary gaps are scoped individually. | itto-tropical-plywood-2014 |\n\n"
