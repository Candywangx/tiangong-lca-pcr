allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "manufacturing"
    rule: "First meter and subdivide veneer, drying, PF/press/finishing, packing, boiler and controls; directly assign product-specific work. Only irreducibly shared burdens may enter an allocation calculation after a documented causal driver is justified."
    source_ids:
      - epa-plywood-2002
  - rule_id: allocation_causation
    applies_to: "shared burdens"
    rule: "For each shared burden identify the physical relation to dry-wood throughput, actual thermal demand or machine time using cp_energy/cp_wood records. Use s_j=D_j/sum(D_j), with exhaustive shares summing to one, only where that relation is evidenced. No default mass or economic fraction. A missing cause requires review, not an arbitrary allocation."
    source_ids:
      - itto-tropical-plywood-2014
  - rule_id: allocation_ledgers
    applies_to: "all inventory rows"
    rule: "Preserve full physical generation, internal transfers, co-products, wastes, packaging and emissions in the gross ledger. Apply shares to the relevant burden ledger once; do not multiply sold bark, cores, chips or waste physical mass by a burden share. Packaging is a direct panel burden, not a co-product allocation destination."
    source_ids:
      - itto-tropical-plywood-2014
  - rule_id: allocation_loops
    applies_to: "manufacturing"
    rule: "Internal chips, rework and steam earn no substitution credit or duplicate input/output burden. Retain combustion, rejects, repeated processing and startup energy. First-release Q excludes repeated loop passes and re-release of already accepted panels."
    source_ids:
      - epa-plywood-2002
      - epa-wood-boiler-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacturing"
      flow_role: "accepted panel and period ledger"
      record_type: "scales/grade/lot/stocks"
      raw_fields: "lot identity; each ply botanical species/tropical proof/origin/grain/thickness; face/back/core grade; glue batch; cure/cool/trim/sand logs; bond/shear/wood-failure or delamination tests; test specimen fate; first-release net mass Q and original accepted-cohort Qc; dimensions/volume/moisture/temperature; opening/closing raw/WIP/new FG/old FG; rework/release/dispatch/same-panel returns; full exchange-indexed V/A/U_p with flow/property/unit/provider/gate/phase/medium/period; actual later service and loss events"
      collection_method: "Calibrated net weighing after the declared finishing/acceptance gate, packaging excluded; retain paired dimensions and grade tests for the actual tropical layup. Count each newly accepted lot once, including its closing FG. Trace unreleased prior-WIP and its carried burdens separately from already accepted FG and same-panel returns/rework, whose original Qc and complete vectors persist. Match gross physical events and incremental service to the original cohort; audit stock and dispatch independently. Failed/rejected mass stays physical, outside Q. Unknown inherited vectors remain explicit gaps, not zero or a generic prior value."
      unit: "kg; m; m3; moisture; time"
      frequency: "each lot/release and period stocktake"
      temporal_coverage: "continuous representative period, startup/shutdown and reject campaigns included; retain original release and later-service periods"
      site_scope: "one site and compatible declared configuration/grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/dimensional calibration; species certificates; test reports; dated stock/lot reconciliation; original release and full vector lineage; later-service records"
    - protocol_id: cp_wood
      process_id: "manufacturing"
      flow_role: "tropical log and veneer stages"
      record_type: "receipts/stage scales/moisture/lot"
      raw_fields: "botanical species/harvest origin; bark state; receipt/return mass; opening/closing logs and green/dry veneer WIP; peeling geometry/lathe checks/loose side; face/core sorting; patch mass; wet/oven-dry samples; inlet/outlet moisture; redry passes; clean chips to boiler; bark/cores/clippings"
      collection_method: "Weigh receipts and each stage transfer. Promptly sample unglued wood and determine constant oven-dry mass with species/extractive limitations; calibrate online moisture readings. Match lot/species and both ends of internal transfers; retain defective veneer and redrying, without default recovery or tropical density."
      unit: "kg; moisture dry basis; dimensions; m3"
      frequency: "each species/lot and drying run"
      temporal_coverage: "same cp_release period plus identified opening WIP lineage"
      site_scope: "site tropical raw/veneer cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/oven calibration; sampling chain; defect/surface records; forestry/supplier records"
    - protocol_id: cp_glue
      process_id: "manufacturing"
      flow_role: "whole aqueous PF and constituent ledgers"
      record_type: "supplier BOM/batch/stock/spread"
      raw_fields: "actual resole/formulation/state; botanical layup; receipts/unused returns; opening/closing glue; wet solids/water/free phenol/formaldehyde; batch spread/patch/return; cure schedule; liquid waste/wash losses; retained cured solids; reaction/volatile terms"
      collection_method: "Weigh the purchased whole adhesive once and reconcile all batches/cleanup. Obtain supplier formulation and lab solids/water/monomer tests; distinguish purchased formulation ingredients from any separate site addition. Verify cure/bond results for the actual tropical surfaces; no UF/MF recipe transfer or equation of received solids with retained cured mass."
      unit: "kg; fraction; temperature/pressure/time; area"
      frequency: "each receipt/formulation and production batch"
      temporal_coverage: "same cp_release period, all cleanup and failed batches included"
      site_scope: "one PF formulation/configuration at site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier primary specifications; batch-scale/lab calibration; cure and bond tests; cleanup/waste receipts"
    - protocol_id: cp_energy
      process_id: "manufacturing"
      flow_role: "grid power and internal wood/steam"
      record_type: "submeters/steam/fuel/operating logs"
      raw_fields: "country/voltage/provider/year; meter start/end; stage run/idle/start; clean internal chip mass/moisture/LHV/HHV/carbon/ash; steam mass/T/P/enthalpy; condensate return; blowdown/losses; shared drivers; opening/closing fuel WIP"
      collection_method: "Meter lathe, dryer/redryer fans, press, sanding, handling, controls and boiler separately. Weigh/characterize clean internal chips and meter useful steam minus condensate enthalpy; reconcile boiler and distribution losses. Audit absence of fossil ignition/backup and cogeneration for this route; if present extend inventory. No purchased steam/heat or second purchased chip burden for the internal supply."
      unit: "kWh; MJ; kg; steam conditions"
      frequency: "continuous meters; each campaign/stocktake"
      temporal_coverage: "same cp_release period including startup/idle/shutdown and fail-only runs"
      site_scope: "same site boiler and steam network"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices/single-provider boundaries; fuel lab; steam balance; causal-driver evidence"
    - protocol_id: cp_water
      process_id: "manufacturing"
      flow_role: "water, effluent and net vapour"
      record_type: "meters/samples/stock/chemistry"
      raw_fields: "liquid receipts; log wash; boiler makeup/blowdown/condensate; cleaning; glue/log retained water; opening/closing water in all WIP/FG/waste/packing; effluent mass/phenol/formaldehyde/solids; inlet/outlet air humidity; cure/combustion reaction water"
      collection_method: "Meter external supply and actual external wastewater transfer; sample concentrations and check actual treatment acceptance. Separate recirculation and whole-stream constituent ledgers. Use measured density for volume conversion; establish chemical water formation/consumption and inlet-air correction from actual chemistry/tests. Do not assign unresolved water imbalance to vapour."
      unit: "kg; m3; concentration; humidity"
      frequency: "each discharge and representative campaign"
      temporal_coverage: "same cp_release period including washing/cleanup/boiler starts"
      site_scope: "site water/steam circuits and external effluent gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter/sample calibration; lab results; wastewater manifests; water/air balance uncertainty"
    - protocol_id: cp_residue
      process_id: "manufacturing"
      flow_role: "each named co-product/waste"
      record_type: "scales/stocks/destination"
      raw_fields: "stream identity; clean/PF-bonded/cured state; wet/dry mass; resin/water/carbon/ash; generation/internal use/export/stock; chip solid/bulk volumes and receiver basis; waste treatment ownership"
      collection_method: "Weigh each separate stream and stock at origin and destination; verify product-versus-waste status, actual treatment and no duplicate internal transfer. Chip k=V_s/V_b is measured on the same batch/moisture/packing state; no generic conversion. Keep ash and captured dust distinct from air emissions."
      unit: "kg; m3; fraction"
      frequency: "each transfer and period stocktake"
      temporal_coverage: "same cp_release period and linked opening stock cohorts"
      site_scope: "same site and actual external receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/lab calibration; sale/waste receipts; paired chip measurements and receiver convention"
    - protocol_id: cp_pack
      process_id: "manufacturing"
      flow_role: "each strap/runner and its fate"
      record_type: "receipts/issue/ownership/tare/stock"
      raw_fields: "atomic component identity/material/route/species/moisture/property/unit; measured mass/count conversion; P/N_ext/ER and EO event IDs/dates; owner/custodian and original panel/service cohort; same-item prior outward proof; full inherited V/A/U_p with gate/phase/medium/period; disjoint opening/closing empty/raw-attached/WIP-attached/new-FG-attached/old-FG-attached/reusable stocks; paired internal attachment/detachment/reuse legs; gross accompanying new/old-FG dispatch; empty/service/repair outward; external waste; actual washing/repair/transport/loss/replacement"
      collection_method: "Weigh each steel strap and wood runner separately; apply the P/N_ext/ER definitions above and record EO independently. First nonpurchase entry retains actual inherited manufacture/service burdens or their explicit unknown scope; no invoice is not zero. Keep one compatible whole supply/provider vector, without adding component manufacture already included in it or recharging returned items. Carry documented vectors across custody, stocks and same-item returns; collect each actual incremental service/replacement once and attribute it to the original panel/service cohort under normalize_period, without invented lifetime/cycles. Apply the component stock balance in stock_cohort to all gross legs; preserve transport direction, load, distance and provider evidence separately, with no net dispatch/return/waste offset. Net plywood Q excludes all packaging. Survey actual extra film/labels/protectors and split each before completeness."
      unit: "kg; count; cycles; transport activity"
      frequency: "each packing specification/lot/transfer and stocktake"
      temporal_coverage: "same cp_release period and original-cohort FG/reusable carryover plus actual service periods"
      site_scope: "site packing and external custody/return/service boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "packing BOM and bundled purchase evidence; calibrated tare/count conversion; same-item prior outward and ER/EO/waste receipts; owner/custodian records; complete inherited vectors and actual service/provider records"
    - protocol_id: cp_air
      process_id: "manufacturing"
      flow_role: "each individual air species/particle interval"
      record_type: "outlet/fugitive tests/operation"
      raw_fields: "stage/stack/control/outlet ID; species/CAS; biogenic/fossil carbon source; dry/wet standard gas flow and concentration; filter/test temperatures; particle intervals/condensables; operation/start/shutdown hours; detection/speciation limits"
      collection_method: "Test relevant peeling/dryer/redryer/press/finishing/boiler/control outlets and fugitives. Use compatible concentration/flow/time, count shared stacks once and sample after capture. Investigate all observed additional species, including fossil glue-derived gases; split actual extra emissions before claiming completeness. Product emission tests do not replace factory exhaust measurements."
      unit: "kg; concentration; standard gas flow; hours"
      frequency: "representative tests and each species/recipe/control/route change"
      temporal_coverage: "same cp_release period with transition operating hours"
      site_scope: "site actual outdoor air outlets, unspecified subcompartment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original test/calibration reports; detection limits; outlet/time map; carbon-source evidence"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For new manufacture only, x_i=X_i/Q is the cohort's full physical exchange per 1 kg reference flow and a_i=A_i/Q its separate attributed burden after subdivision/justified allocation; finished_panel=1 kg. Q is that new lot's cp_release first-release net accepted kg, including closing FG once. X_i is gross physical exchange, never an allocation share; A_i is separately attributed activity/burden in its declared unit. Reconcile carried prior-WIP vectors before this first release, without repeating their earlier receipts. Already accepted cohort c instead retains original Qc and complete inherited V_c_i/A_c_i/U_p vectors with every exchange's flow/property/unit/provider/gate/phase/medium/period. Actual later inspection/repacking/rework/transport/cleaning/loss adds only measured incremental vectors dV_c_i and dA_c_i to that original cohort. When reported, service-only views are dV_c_i/Qc and dA_c_i/Qc; continued-cohort views are (V_c_i+dV_c_i)/Qc and (A_c_i+dA_c_i)/Qc, clearly distinguished so the service is not added twice. Keep all raw gross legs alongside these views; an inherited V is not a current physical receipt. Never create another Q, repeat original manufacture/provider or divide old services by unrelated new Q. Preserve original U_p and gate once; whole formulated/packaged supply and included constituent/component burdens are not additive. New Q=0 forbids new-manufacture division but does not erase valid original-Qc service views. Keep all idle/failed/startup/cleanup, stocks, waste and energy records; unknown Qc, inherited vectors or attribution require review and must not be zeroed or spread arbitrarily."
      inputs:
        - A_i
        - Q
        - X_i
        - Qc
        - V_c_i
        - A_c_i
        - dV_c_i
        - dA_c_i
        - U_p
        - cp_release
        - "relevant row protocol"
      output: "separate new-manufacture, service-only and continued-cohort views with complete original evidence and gross ledgers"
      source_ids:
        - epa-plywood-2002
    - id: stage_physical
      applies_to: "manufacturing"
      rule: "For each stage s and constituent k on one declared state/unit basis: O_s,k + E_in_s,k + T_in_s,k + R_form_s,k = C_s,k + E_out_s,k + T_out_s,k + R_cons_s,k + residual_s,k. O/C are opening/closing stocks; E are external crossings only; T are internal legs. Match every T_out_s,k to one equal T_in_t,k at identical transfer state/unit/time/lot; a wet-to-dry change occurs inside a stage, not by equating unlike legs. R_form/R_cons are evidenced chemical-species formation/consumption, never internal transfers or repeated receipts. Conserved elemental accounts have no invented reaction formation. Sum stages only after leg matching: sum(T_in)=sum(T_out) cancels, leaving the whole-unit external/stock/reaction balance. Retain measured residual and uncertainty, never use allocation A or provider U to close X."
      inputs:
        - cp_wood
        - cp_glue
        - cp_water
        - cp_residue
        - cp_release
        - "stage and transfer IDs"
      output: "executable gross stage and consolidated constituent balances"
      source_ids:
        - wood-handbook-2021
    - id: stock_cohort
      applies_to: "manufacturing"
      rule: "Apply stage_physical separately to every raw/WIP stock account, retaining its explicit internal legs; consolidate only by their cancellation. For the accepted FG account in kg: O_FG + Q + R_accepted + T_rework_return = S_dispatch + L_postrelease + C_FG + T_rework_issue. O/C are opening/closing accepted FG; R is accepted external return; S is external dispatch; L is recorded post-release loss. Q is only the new lot's first quality-release transfer into FG, not external receipt or chemical formation. T_rework_issue/return are matched transfers to/from the rework account for previously released panels; their return is never Q again. Carry prior-WIP burdens with documented lineage, or extend the measurement cohort before its first release. Separately preserve each already accepted cohort's original Qc and complete exchange-indexed V/A/U_p through opening/closing raw/WIP/FG, actual returns, rework and custody changes. Trace measured splits/merges and retain vector ownership without duplicating history across stock accounts; FG mass, a single prior-value scalar or a provider label alone cannot reconstruct inheritance. Unknown carryover remains unknown. For each packaging component on one compatible physical basis: O + P + N_ext + ER + T_in = C + G_dispatch + G_service + EO + W_ext + T_out + residual. O/C are disjoint empty, raw-attached, WIP-attached, new-FG-attached, old-FG-attached and reusable stocks, each item counted once. G_dispatch is every gross accompanying new/old-FG dispatch; G_service is other empty/service/repair outward; EO is supplier/owner outward return; W_ext is external waste. Outward classes are mutually exclusive, retain all actual legs, and ER requires a documented same-item prior outward. Pair internal attachment/detachment/reuse T legs and cancel only on consolidation; internal runner forming retains its real source/consumption without another external receipt. Never net returns against gross outward, waste or transport activity. Physical movements and inherited/attributed vectors remain separate. Do not add the same stock adjustment twice to consumption."
      inputs:
        - cp_release
        - cp_wood
        - cp_glue
        - cp_pack
        - cp_residue
      output: "complete cohort/vector lineage and gross raw/WIP/FG/component stock balances"
      source_ids:
        - itto-tropical-plywood-2014
    - id: wood_moisture
      applies_to: "tropical_log; bark_sale; core_sale; chip_export"
      rule: "MC_db=100*(m_wet-m_od)/m_od; m_od=m_wet/(1+MC_db/100), for measured unglued wood only. Product and bonded residues require separate cured adhesive/non-water volatile/water measurements."
      inputs:
        - cp_wood
        - cp_residue
        - m_wet
        - m_od
      output: "dry wood and water constituent masses"
      source_ids:
        - wood-handbook-2021
    - id: glue_balance
      applies_to: "pf_glue; bonded_trim; bonded_dust; pf_liquid_waste; wastewater"
      rule: "Ingredient solids=whole adhesive mass*measured ingredient fraction. Reconcile retained cured solids, reaction formation/consumption, free monomers/volatiles, liquid waste, cleanup and WIP stocks. Ingredient water is not another tap-water purchase, nor does all delivered solids mass necessarily remain cured."
      inputs:
        - cp_glue
        - cp_water
        - cp_residue
        - "supplier chemistry"
      output: "PF solids/water/monomer balance and unexplained residual"
      source_ids:
        - wood-handbook-2021
        - epa-plywood-2002
    - id: heat_balance
      applies_to: "electricity; boiler"
      rule: "Electric MJ = kWh × 3.6; fuel input energy = measured chip mass × same-state measured heating value. For each declared thermal boundary, integrate each actual supplied steam mass × its inlet specific enthalpy and subtract each independently measured return mass × its actual return specific enthalpy. Reconcile make-up, unreturned condensate, leakage/blowdown, other carrier legs, boiler/distribution losses and thermal stock changes on that boundary/time basis before attributing useful heat. A missing mass or state leaves thermal closure unresolved. Use steam mass × (inlet enthalpy - return enthalpy) only for proven equal-mass matched supply/return legs. External electricity is not also an internal heat purchase."
      inputs:
        - cp_energy
        - actual_supply_mass
        - actual_return_mass
        - actual_carrier_state
        - other_mass_heat_legs
        - thermal_stock_change
      output: "gross site fuel/power/thermal ledger and causal attribution"
      source_ids:
        - epa-wood-boiler-2022
    - id: chip_interface
      applies_to: "chip_export"
      rule: "k=V_s/V_b from paired same-state measured volumes. Select V_s or V_b according to the actual receiver convention and verify moisture/packing compatibility. Unknown basis or k leaves the specific quantity link unresolved; use raw kg for physical balance without inventing conversion."
      inputs:
        - cp_residue
        - V_s
        - V_b
        - "actual receiver basis"
      output: "verified chip volume or pending linkage"
      source_ids:
        - wood-handbook-2021
    - id: air_mass
      applies_to: "all elementary output rows"
      rule: "Species mass=sum(compatible mass concentration*standard gas flow*operating hours), with explicit unit conversions and dry/wet T/P basis. Keep each outlet once. PM2.5–10=PM10-PM2.5 and PM>10=total-PM10 only for compatible tests and nonnegative differences; never add cumulative totals again or duplicate condensables."
      inputs:
        - cp_air
        - concentrations
        - "gas flows"
        - hours
      output: "individual molecular emissions and disjoint particle masses"
      source_ids:
        - epa-plywood-2002
        - epa-wood-boiler-2022
    - id: water_balance
      applies_to: "water_vapour; wastewater; tap_water"
      rule: "Water receipts + incoming material water + opening water stocks + verified reaction formation = retained/exported liquid or vapour water + closing stocks + verified reaction consumption, with matched inlet-air humidity correction. Whole wastewater and its constituents are one transfer with subledgers; unknown chemistry, carrier air or material water leaves closure incomplete, not a fabricated evaporation amount."
      inputs:
        - cp_water
        - cp_glue
        - cp_wood
        - cp_air
      output: "net water transfers, stock changes and uncertainty"
      source_ids:
        - wood-handbook-2021
    - id: carbon_balance
      applies_to: "manufacturing"
      rule: "Input wood/glue/other-material carbon + opening carbon stocks = retained panel/packing + full coproduct/waste/air carbon + external unused returns + closing carbon stocks. Record source fractions and any reaction/carrier-air terms independently; C/H/O atom balances are distinct from water-species balances. Unallocated physical quantities close the ledger; allocated burdens do not."
      inputs:
        - cp_wood
        - cp_glue
        - cp_air
        - cp_pack
        - cp_residue
      output: "separate biogenic/fossil/unknown carbon ledgers and residuals"
      source_ids:
        - epa-wood-boiler-2022
  data_quality_requirements:
    - id: tropical_surface
      applies_to: "reference product"
      requirement: "Actual tropical outer-ply species and origin, face/core mapping, surface/lathe-check/moisture history and tested PF bond grade are required; trade-name, core-only tropical content or generic plywood identity alone is insufficient."
      evidence: "cp_release; cp_wood; cp_glue; wood-handbook-2021"
    - id: no_recipe_transfer
      applies_to: "pf_glue; cp_energy; cp_air"
      requirement: "Collect matching PF/site data. ITTO UF/MF examples and aggregate inventories, manufacturer nominal values, generic emission factors and assumed density are not PCR defaults."
      evidence: "itto-tropical-plywood-2014; asia-plywood-pf; actual site records"
    - id: complete_period
      applies_to: "all inventory rows"
      requirement: "Keep site/configuration/cohort and its own denominator explicit: new first-release Q versus original accepted Qc for separately labelled later services. Include full inherited exchange/provider vectors, all stocks, WIP, rejected/idle/startup/cleanup and actual incremental service/loss operations, plus additional actual chemicals/consumables. Reconcile each packaging component's disjoint P/N_ext/ER and outward/stock classes with gross transport/service legs; neither free custody nor absence of a separate invoice waives burdens. New Q=0 preserves old-Qc service evidence and all raw records; unknown carryover/Qc, unsupported attribution/allocation or missing emissions remain explicit incompleteness."
      evidence: "all collection protocols; stock_cohort; normalize_period"
    - id: native_identity
      applies_to: "all inventory rows"
      requirement: "Match one flow's full type/form/route/CAS/species/phase/use and reference property/unit chain; official Chinese names preserved. Blank UUIDs are named identity gaps, not database absence, observed zero or automatic rejection of every other draft rule."
      evidence: "native records and supplier specifications"
    - id: uncertainty
      applies_to: "dataset"
      requirement: "Disclose calibration, sampling/site-period coverage, detection limits, species/carbon/particle speciation, stock residuals and provider gaps. Unknown totals cannot be silently dropped, distributed arbitrarily or tuned to close a balance."
      evidence: "original measurements and lab reports; cp_air; cp_residue"
validation_rules:
  - rule_id: validate_tropical_boundary
    applies_to: "reference product"
    rule: "Verify at least one actual tropical outer ply, full veneer crossed construction, stated PF and untreated/uncoated gate, botanical/origin evidence, surface/moisture and grade tests. The representative route never implies full-leaf or all-species/adhesive approval."
    source_ids:
      - unsd-cpc3-2025
      - wood-handbook-2021
  - rule_id: validate_release
    applies_to: "all inventory rows"
    rule: "Require calibrated net mass and one finished_panel manufacturing output per 1 kg reference flow using only its new lot's first-release Q, including closing FG once. Opening accepted FG, same-panel returns and rework/re-release add no Q. Verify original Qc and full exchange-indexed V/A/U_p inheritance for accepted old cohorts, distinct from unreleased prior-WIP carryover; later services/losses stay on that cohort in separate service/continued views, never on unrelated current Q or a repeated manufacturing output. Exclude packing/tests/rejects from Q; reconcile opening/closing raw/WIP/FG, gross dispatch/returns, vector splits/merges and Q=0/idle/failed/cleanup records without inventing missing inheritance."
    source_ids:
      - epa-plywood-2002
  - rule_id: validate_physical
    applies_to: "manufacturing"
    rule: "Check unallocated wood, cured-glue, water and carbon balances including clean-chip boiler, ash/capture, stocks and loops; preserve unknown chemistry/air corrections and uncertainty. Keep full physical exports apart from the separately attributed/allocated burden ledger."
    source_ids:
      - wood-handbook-2021
      - epa-wood-boiler-2022
  - rule_id: validate_emissions
    applies_to: "all elementary output rows"
    rule: "Verify actual species/CAS/air medium, post-control outlets, carbon origins and non-overlapping particle intervals. Add observed fossil glue gases or other species as separate verified exchanges. Missing or unspeciated measurements cannot pass by assuming zero."
    source_ids:
      - epa-plywood-2002
      - epa-wood-boiler-2022
  - rule_id: validate_packaging
    applies_to: "manufacturing"
    rule: "For each atomic component verify mutually exclusive P (also bundled purchases), first external nonpurchase N_ext, and ER with same-item prior outward evidence; verify separate EO and owner/custodian/cohort/full inherited V/A/U_p. Reconcile disjoint empty/raw-attached/WIP-attached/new-FG-attached/old-FG-attached/reusable O/C, paired internal legs, all gross dispatch/service/repair/return/waste legs and actual transport. No net offset may hide a real movement or service. Whole supply and included component manufacture count once; actual washing/repair/transport/loss/replacement increment once on the original cohort/Qc when serving old FG. Missing invoices, free entry or unknown prior burdens cannot mean zero; disclose unknowns, ownership and actual cycles without a default lifetime/credit, extra panel Q or repeated provider charge."
    source_ids:
      - itto-tropical-plywood-2014
  - rule_id: validate_links
    applies_to: "dataset"
    rule: "Recheck primary log/PF/reference identities and full native property/unit chains, actual supplier boundaries, chip solid/bulk quantity and waste treatment. Report accepted input, checks performed/skipped, findings and completeness. An unresolved core input or material physical conflict blocks completed-dataset claims; auxiliary gaps are scoped individually."
    source_ids:
      - itto-tropical-plywood-2014
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Source-specific manufacture of the stated tropical-faced all-veneer PF panel; foreground-only records labelled separately"
  allowed_use: "Only matching actual species/layup/grade/route and net-release kg after provider, quantity, stock, treatment and quality checks"
  excluded_use: "Full classification coverage; generic wood/other glue/core proxy; assumed density/recipe/emission factors; marine/structural certification or carbon-neutrality claims without evidence; whole-life comparison"
  required_metadata: "All reference qualifiers; measured first-release Q and raw physical/allocated ledgers; botanical face/core and origin proof; PF chemistry/cure/grade; site/period/stock lineage; power/steam/water/controls; packing ownership; native identities/measurement interfaces; forestry/transport/treatment/provider coverage; unresolved gaps"
  required_quality_disclosure: "Distinguish measurements, calculations and pending collection/identity; range and sampling limitations, missing species/chemistry, residual uncertainty, skipped checks and incomplete backgrounds; author check is not independent scientific review"
  update_trigger: "Outer/inner species, origin, layup/grade, glue formulation, dryer/press/boiler/control changes, heat/fuel/effluent route, packaging/provider or quantity conventions"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, Central Product Classification Version 3.0, Explanatory Notes, subclass 31412, printed p.139; retained official PDF and text."
    used_for: "Tropical outer-ply category boundary and explanatory core-construction tension only; no quantity evidence"
  - id: "itto-tropical-plywood-2014"
    type: "official_guidance"
    reference: "Gan K.S. and M.Y. Massijaya, Life Cycle Assessment for Environmental Product Declaration of Tropical Plywood Production in Malaysia and Indonesia, ITTO, March 2014; PDF pp.5–8,11–20,22–23 (printed pp.4–7,10–19,21–22). https://www.itto.int/files/user/pdf/EPD-LCA%20MERANTI%20PLYWOOD-FINAL%20REPORT.pdf"
    used_for: "Tropical face/core and qualitative manufacturing/record questions; survey limitations and contrary UF/MF examples; no numerical recipe, inventory, assumed emissions, cutoff or default mass-allocation transfer"
  - id: "epa-plywood-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 10.5 Plywood Manufacturing, January 2002, pp.10.5–1 to 10.5–4, Figure 10.5–1. https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Veneer/indirect drying, exterior hardwood PF pressing/finishing and separate emission-source/method coverage; no numerical factors or settings adopted"
  - id: "wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood Handbook—Wood as an Engineering Material, FPL-GTR-282 (2021), Ch.4 p.4–1, Ch.10 pp.10–3/10–4; PDF pp.95,255–256. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Unglued wood moisture definition and tropical extractive/surface/bond risks; no species density, target moisture or universal PF acceptance"
