      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Untreated tropical veneer logs, purchased formulated PF and utilities/materials received at the plywood site; dry-yard/wash and whole steam boiler included |\n| starting_condition_role | Foreground receiving gate; upstream burdens remain required |\n| product_classification_scope | Only the stated all-veneer PF subset with at least one tropical outer ply in CPC 3.0:31412 |\n| recursive_input_rule | Internal veneer, chips, steam, condensate and rework are matched internal transfers. Externally purchased plywood/rework or veneer is outside this route, not zero-burden recursion. |\n| upstream_dataset_requirement | Match forestry/harvest, log transport, PF manufacture/formulation, electricity, water, packaging and actual waste treatment to state, geography, period and quantity interface; count each real supplier once |\n| disclosure | Report foreground and linked upstream coverage separately; no forest carbon, land-use, biodiversity or transport burden is inferred from tropical origin or chain-of-custody labels |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | manufacturing | Include all declared log preparation, rotary veneer production, drying/redrying, species/face-core sorting, PF preparation/spreading, layup/press/cure/cooling, finishing, tests/rejects, packing and clean-chip steam generation/controls. Keep stage measurements within this one aggregated foreground process. | epa-plywood-2002; itto-tropical-plywood-2014 |\n| boundary_transfers | manufacturing | Internal chips and steam are not external products, purchased fuel or heat. Pair both ends of every transfer and retain boiler losses/emissions. External waste treatment is linked once; downstream fabrication, installation, use and end-of-life are outside this manufacturing unit. | epa-plywood-2002; epa-wood-boiler-2022 |\n| boundary_inventory | manufacturing | Survey ancillary water treatment chemicals, boiler additives, oils, hydraulic fluids, abrasives, filters, knives, cleaning agents and control consumables. Establish supported absence or add each actual atomic input and spent stream before claiming dataset completeness; no silent mass/energy cutoff. | epa-plywood-2002; epa-wood-boiler-2022 |\n| boundary_provider | dataset | Flow identity is not a provider approval. Match actual process gate, tropical construction, PF delivery state, forestry origin, supply year/location, energy interface, transport and treatment; disclose unresolved or overlapping provider coverage. | itto-tropical-plywood-2014 |\n\n"
