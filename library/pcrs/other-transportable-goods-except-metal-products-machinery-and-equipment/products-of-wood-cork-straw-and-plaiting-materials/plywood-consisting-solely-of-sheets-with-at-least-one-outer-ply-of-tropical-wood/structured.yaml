measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "cp_release weighs accepted finished net panels on a calibrated scale at recorded release state. New manufacture is per 1 kg reference flow using only that new lot's first-release net mass Q, including newly released panels still in closing FG. Already accepted opening FG, same-panel returns and rework never create Q. Preserve each accepted cohort's original first-release Qc for separately reported later services under normalize_period; never divide those services by unrelated current Q. Retain gross physical records before allocating burdens."
  - id: wood_water_basis
    applies_to: "tropical_log; chip_export; bark_sale; core_sale"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "cp_wood measures wet and oven-dry unglued wood mass; MC_db = 100*(m_wet-m_od)/m_od. Species/extractive bias requires a verified method; panel resin/volatile loss is not automatically water."
  - id: energy_unit
    applies_to: "electricity; boiler"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "cp_energy preserves kWh and converts using 1 kWh = 3.6 MJ. Fuel heat is measured mass times same-state measured heating value, labelled LHV/HHV; internal delivered steam heat uses inlet-minus-return enthalpy, not another external heat purchase."
  - id: chip_volume
    applies_to: "chip_export"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "cp_residue retains paired wet/dry mass, solid/bulk volume, packing/moisture state and receiver basis. Native m3 does not establish solid versus bulk; only a measured matched conversion may support the actual provider/receiver interface."
