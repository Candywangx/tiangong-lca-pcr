    applies_to: "foreground_burden_allocation"
    rule: "First submeter separable veneer/co-product-specific burdens by equipment/stage. For inseparable common wood-conversion burdens only, use measured oven-dry wood masses at the same physical node and period: a_v=D_v/(D_v+sum(D_c)). This is this method’s reviewable physical-allocation choice; CORRIM supplies a softwood-plywood mass-allocation precedent, not hardwood veneer shares, density or yield. Test physical causality and disclose sensitivity to alternative allocation."
    source_ids:
      - corrim-western-plywood-2025
      - usda-wood-handbook-2021
  - rule_id: allocation_ledgers
    applies_to: "foreground_burden_allocation"
    rule: "Allocation acts on common environmental burdens, not on physical log, delivered veneer, co-product, waste, water or carbon balances. Internally burned residues are not simultaneously sold co-products in the allocation denominator; preserve identical physical transfers. Sale, internal use, waste and stock portions are disjoint. Define economic co-product/waste status and destination; no automatic substitution credit."
    source_ids:
      - corrim-western-plywood-2025
  - rule_id: allocation_specific
    applies_to: "foreground_burden_allocation"
    rule: "If drying serves veneer alone, drying energy/emissions, redrying and final packaging belong wholly to veneer; cores/bark that bypass the dryer receive none of that stage. Split shared boiler/site-service burdens by metered delivered heat/respective service before attributing actual served stages."
    source_ids:
      - epa-plywood-2002
      - corrim-western-plywood-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "veneer_mill"
      flow_role: "veneer_delivery"
      record_type: "weighing/acceptance"
      raw_fields: "lot; species; route; thickness; dimensions; grade; wet net mass; packaging tare; delivery moisture; stock; rejects"
      collection_method: "Weigh accepted net sheets with calibrated scales, paired with cp_balance moisture tests, grade and buyer acceptance; record final delivery gate and reconcile beginning/end stock."
      unit: "kg; dry-basis fraction"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
    - protocol_id: cp_materials
      process_id: "veneer_mill"
      flow_role: "veneer_logs; tap_water; pao_lubricant"
      record_type: "purchase/receipt/meter"
      raw_fields: "lot; species; inlet state; mass; moisture; stock; supplier; water meter; PAO specification"
      collection_method: "Use calibrated weighing/meters and invoices with supplier/interface records; separate stage uses and recycle loops. Record actual chemicals individually if present."
      unit: "kg"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
    - protocol_id: cp_energy
      process_id: "veneer_mill"
      flow_role: "electricity_lv; electricity_mv; natural_gas; external_woodchips; diesel; purchased_steam_heat"
      record_type: "meter/fuel/enthalpy"
      raw_fields: "stage; technology; meter; MJ/kWh; fuel mass/volume; T/P; moisture; Z; composition; packing; steam/condensate state; supplier definition"
      collection_method: "Submeter each stage and utility inlet, including redrying/idle operation and abatement. Measure density/state/enthalpy as applicable; reconcile purchased and internally generated heat portions without overlap."
      unit: "MJ; kg; m3"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
    - protocol_id: cp_packaging
      process_id: "veneer_mill"
      flow_role: "pe_film; pp_strap"
      record_type: "weighing/issue"
      raw_fields: "component; specification; mass issued; stock; returns; net used mass; accepted output"
      collection_method: "Weigh each actual component and reconcile issue/return/stock, excluding all packaging from cp_output net veneer mass."
      unit: "kg"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
    - protocol_id: cp_transport
      process_id: "veneer_mill"
      flow_role: "inbound_truck"
      record_type: "route/activity"
      raw_fields: "log mass; route; loaded km; empty return; vehicle/fuel/load; upstream transport inclusion"
      collection_method: "Use weighbridge, delivery and route logs; derive actual freight work and check supply dataset gates. Yard handling diesel is distinct from included road transport service."
      unit: "t km"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
    - protocol_id: cp_residues
      process_id: "veneer_mill"
      flow_role: "bark; cores; offcuts; chips; sawdust"
      record_type: "weighing/dispatch/balance"
      raw_fields: "stage; species; wet mass; dry mass; moisture; volume; packing; sold/internal/waste/stock split; value; destination"
      collection_method: "Weigh each residue stream at its source and each sale/transfer; use measured moisture and volume convention. Reconcile both ends of internal transfers before burden allocation."
      unit: "kg; m3"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
    - protocol_id: cp_wastes
      process_id: "veneer_mill"
      flow_role: "conditioning_wastewater; bottom_ash; fly_ash; spent_pao"
      record_type: "meter/test/waste-transfer"
      raw_fields: "waste species; quantity; density; solids; residual carbon; contamination; handler; treatment route"
      collection_method: "Meter/weigh each waste independently and retain treatment manifests and wastewater tests. Distinguish off-site treatment from actual on-site discharge."
      unit: "kg"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
    - protocol_id: cp_emissions
      process_id: "veneer_mill"
      flow_role: "outdoor air substance/size rows"
      record_type: "stack/fugitive sampling"
      raw_fields: "source; stage; operating time; flow rate; concentration; species; fossil/biogenic share; particle bin; sampling train; controls; detection limit; test uncertainty"
      collection_method: "Use source-resolved accredited or validated stack/fugitive testing representative of operating modes, startup and abatement. Specify dry/wet gas and standard state; preserve unmeasured/BDL scope and uncertain speciation. Do not scale softwood surveys to hardwood."
      unit: "kg"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
    - protocol_id: cp_balance
      process_id: "veneer_mill"
      flow_role: "all wood/water/carbon states; vapour"
      record_type: "paired moisture and balance"
      raw_fields: "stage; species; sample location; wet mass; oven-dry constant mass; moisture; water/steam; condensate; fuel C; ash C; veneer C; transfers; stock; uncertainty"
      collection_method: "Immediately weigh representative veneer samples spanning sheet locations/lots; oven-dry to constant mass at 101–105 °C using validated laboratory protocol and weighing intervals. Calibrate electrical moisture instruments by species against oven-dry tests. Measure retained wood/fuel/ash carbon; keep wood evaporation separate from combustion-generated water."
      unit: "kg; fraction"
      frequency: "each lot/shift; emissions by representative operating mode"
      temporal_coverage: "same complete production period including stock, startup/shutdown and redrying"
      site_scope: "declared mill and included equipment/interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw records, sample coverage, supplier definition and uncertainty"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "q_i = sum(Q_i)/W; Q_i is the actual row exchange in the same period; W is accepted net delivered veneer kg after packaging and stock correction. Reference output is fixed at 1 kg. Preserve actual physical quantities separately from burden allocation."
      inputs:
        - Q_i
        - W
        - cp_output
        - "linked row protocol"
      output: "q_i"
      source_ids: []
    - id: moisture_balance
      applies_to: "wood, residues and fuel"
      rule: "u=(m_wet−m_dry)/m_dry; m_dry=m_wet/(1+u); m_water=m_wet−m_dry. Measure u for each state; divide percentages by 100 first. Reconcile dry wood in/out and stock change; water ledger separates conditioning uptake, evaporation and return."
      inputs:
        - m_wet
        - m_dry
        - cp_balance
        - cp_residues
      output: "dry wood and water accounts"
      source_ids:
        - usda-wood-handbook-2021
    - id: wood_volume
      applies_to: "same-state veneer and chips"
      rule: "Use only measured same-state net volume V, mass m and moisture: rho=m/V; veneer V=sum(area×thickness), chip V requires solid/bulk and packing convention. Different states cannot share a density."
      inputs:
        - V
        - m
        - cp_balance
        - cp_residues
      output: "state-specific conversion"
      source_ids:
        - usda-wood-handbook-2021
    - id: emission_load
      applies_to: "each air emission row"
      rule: "For each substance L=sum(c×gas_flow×operating_time)+measured fugitive release, after compatible concentration/gas-state unit conversion. Separate combustion carbon origins from actual fuel-carbon accounts; never infer zero from missing measurement. Retain actual releases before allocation beside allocated loads."
      inputs:
        - c
        - gas_flow
        - operating_time
        - cp_emissions
        - cp_balance
      output: "species mass load"
      source_ids:
        - epa-plywood-2002
        - epa-wood-boiler-2022
    - id: pm_partition
      applies_to: "pm25, pm_between, pm_coarse"
      rule: "If one comparable test supplies cumulative PM2.5, PM10 and total PM: fine=PM2.5, middle=PM10−PM2.5, coarse=total PM−PM10. All must be nonnegative with identical test/filterable/condensable boundaries. If incompatible or unknown, retain the gap without invented size fractions."
      inputs:
        - "matched test totals"
        - cp_emissions
      output: "disjoint PM masses"
      source_ids:
        - epa-plywood-2002
    - id: heat_balance
      applies_to: "purchased_steam_heat"
      rule: "Q_net=m_s×h_s−m_return×h_return−undelivered losses within the declared boundary; supplier definition, boundary and enthalpy states must correspond. This does not turn a gross-calorific property into net delivered heat or add site fuel for the same portion."
      inputs:
        - "steam and return states"
        - "supplier definition"
        - cp_energy
      output: "compatible net delivered heat"
      source_ids: []
    - id: physical_carbon
      applies_to: "all wood and combustion accounts"
      rule: "Multiply state dry mass by measured carbon fraction; reconcile inlet, delivery, sales, internal fuel, ash residual carbon, CO2/CO/CH4 carbon and stock; equal internal transfers cancel. Convert actual CO2 carbon to CO2 mass by stoichiometric 44/12, using each other substance’s own molecular mass. Unmeasured carbon/organics do not establish closure; report residual and uncertainty."
      inputs:
        - "measured carbon"
        - masses
        - cp_balance
        - cp_emissions
      output: "physical carbon account"
      source_ids:
        - epa-wood-boiler-2022
    - id: burden_allocation
      applies_to: "common burden ledger"
      rule: "B_v=B_common×a_v+B_veneer_specific; a_v uses the stated measured dry masses at the same node; do not mechanically multiply physical q_i by a_v. Retain stage selection, co-product shares, pre/post allocation burdens and sensitivity."
      inputs:
        - "dry masses"
        - "stage burdens"
        - cp_residues
        - cp_energy
      output: "allocated veneer burdens"
      source_ids:
        - corrim-western-plywood-2025
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Check substance/state/type/compartment/reference property/unit for each row; retain blank UUIDs and unknown quantity compatibility explicitly."
      evidence: "supplier and direct identity records"
    - id: dq_representative
      applies_to: "veneer_mill"
      requirement: "Cover species, route, grade, season, redrying, downtime, fuels and abatement; regional softwood surveys are not hardwood industry parameters."
      evidence: "stratified raw records and uncertainty"
    - id: dq_balance
      applies_to: "physical ledgers"
      requirement: "Reconcile stage dry wood, water, carbon and internal transfers, reporting residual; pre/post allocation accounts traceable, without invented universal tolerance."
      evidence: "calibrations; balance residuals; buyer tolerances"
    - id: dq_completeness
      applies_to: "all flows"
      requirement: "Add and verify actual additional atomic materials/water/fuels/wastes/emissions; disclose unmeasured scope, detection limits, equipment/infrastructure exclusions and background differences."
      evidence: "complete site flow register and coverage review"
validation_rules:
  - rule_id: validation_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one product output matches veneer_delivery/reference UUID; net amount is 1 kg, all inventory/collection denominators agree, and moisture/species/thickness/delivery gate are explicit. No second reference output or species UUID selector."
    source_ids: []
  - rule_id: validation_routes
    applies_to: "foreground_dataset_conformance"
    rule: "Veneer must be adhesive-free/unbacked; document actual conditioning, knife cutting, clipping, drying, redrying, cooling, matching and packing. No duplicate heat portions, upstream log freight or internal fuel transfers. Thin sawn sheets or bonded products cannot pass this gate."
    source_ids:
      - epa-plywood-2002
      - usda-wood-handbook-2021
  - rule_id: validation_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Check dry wood/water/carbon, disjoint co-product destinations and stock; allocation does not shrink physical quantities. PM bins do not overlap; VOC constituents are not added to their total; biogenic CO2 remains in LCI; captured material is not also emitted."
    source_ids:
      - epa-plywood-2002
      - epa-wood-boiler-2022
  - rule_id: validation_gaps
    applies_to: "foreground_dataset_conformance"
    rule: "Blank UUIDs, unverified supplier volume/steam enthalpy/NOx convention, unmeasured physical flows/emissions, unknown moisture or allocation causality remain explicitly incomplete, never completed/zero. Method measurement-declaration checks do not establish a complete site package or scientific approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground log-to-unbonded-dried-veneer production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Input to later veneering/core production only when species, knife-cut route, delivery state and measurement basis match; disclose review and gaps"
  excluded_use: "Complete structural-panel functional comparisons; thin sawn sheets; automatic coniferous/tropical substitution; plywood/LVL products; green sale; generic factors without basis"
  required_metadata: "All reference qualifiers; period; equipment/heat sources; sampling/moisture; supply gates; stock/physical balances; pre/post allocation ledgers; method sources"
  required_quality_disclosure: "Measured/calculated distinction; uncertainty, unmeasured scope, detection limits, blank UUIDs, supplier-basis compatibility, geography/species representativeness and independent-review state"
  update_trigger: "Changes to species, cutting/drying/heat supply, delivery moisture/grade/gate; added adhesive/backing; new flow identity/evidence; changed basis/allocation/emissions"
data_sources:
  - id: "un-cpc-3"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Ver.3.0, 30 June 2025 structure; subclasses 31511–31513. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Leaf scope includes knife-cut and longitudinally sawn thin sheets; species classification does not establish separate methodology"
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021), printed 10–3 to 10–4 and 13–1 to 13–2; PDF pp.255–256,323–324. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Knife/saw distinctions, pre-bonding veneer, wood moisture and constant-mass oven drying; no generic yield/density/drying target adoption"
  - id: "epa-plywood-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 §10.5 Plywood Manufacturing (January 2002), printed 10.5–1 to 10.5–4, Figure10.5-1. https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Conditioning, peeling/slicing, clipping, drying/redrying, composing/bonding gates and dryer/combustion emission distinction; no geography/species factor adoption"
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "US EPA, AP-42 §1.6 Wood Residue Combustion in Boilers (March 2022), pp.1.6–1 to 1.6–3. https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf"
    used_for: "Actual wood-fuel boiler scope, PM, combustion gases and carbon origin; greenhouse-gas reporting does not delete biogenic LCI CO2; no efficiency/carbon-conversion/emission factor transfer"
  - id: "corrim-western-plywood-2025"
    type: "literature"
    reference: "CORRIM, Life Cycle Assessment of Softwood Plywood Production – Western Region, edited July22,2025; 2022/2023 primary survey; PDF p.16, §3.2.6. https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Western-Plywood-Report-Final-07222025.pdf"
    used_for: "Mass-allocation and dedicated packaging method precedent; US Western softwood-plywood survey is not quantitative hardwood/tropical-veneer evidence"
