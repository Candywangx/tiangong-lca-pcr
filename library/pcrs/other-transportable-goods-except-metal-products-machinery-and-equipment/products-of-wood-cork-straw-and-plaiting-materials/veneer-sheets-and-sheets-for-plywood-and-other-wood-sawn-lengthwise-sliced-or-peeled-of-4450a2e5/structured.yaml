system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "foreground_system_boundary"
      rule: "Aggregate debarking, bucking/flitch preparation, actual water/steam conditioning, peeling or slicing, clipping, drying/redrying, cooling, grading, adhesive-free matching and packing into one veneer_mill foreground unit, retaining separate stage meters. Veneer acceptance/delivery precedes adhesive layup/hot pressing."
      source_ids:
        - epa-plywood-2002
        - usda-wood-handbook-2021
    - rule_id: boundary_heat
      applies_to: "foreground_system_boundary"
      rule: "Distinguish purchased steam, on-site boilers and direct firing. On-site combustion includes fuel, operation/abatement, ash and actual emissions; purchased steam retains supplier upstream production without invented site combustion. Attribute each heat portion once."
      source_ids:
        - epa-plywood-2002
        - epa-wood-boiler-2022
    - rule_id: boundary_completeness
      applies_to: "foreground_system_boundary"
      rule: "Separate physical process topology from allocated burden accounts. Both ends of an internal fuel transfer use identical wet mass, moisture and dry mass; no external exchange is added for the aggregated unit. Add and verify every other actual atomic flow. Any cut-off/equipment exclusion needs boundary, quantitative relevance and sensitivity, without an unsupported default threshold."
      source_ids:
        - epa-plywood-2002
