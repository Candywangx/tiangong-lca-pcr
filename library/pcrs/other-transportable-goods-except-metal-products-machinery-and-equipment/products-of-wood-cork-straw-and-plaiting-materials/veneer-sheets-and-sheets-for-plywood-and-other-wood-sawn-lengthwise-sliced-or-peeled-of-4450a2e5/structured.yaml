measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference quantity and all inventory denominators are 1 kg reference flow. Use calibrated weighing of net veneer at the same accepted delivery moisture, excluding packaging; oven-dry mass, area or volume cannot replace it directly. cp_output retains complete-period accepted production and stock correction."
  - id: wood_moisture
    applies_to: "all physical wood ledgers"
    required_property_ref:
      name: "Mass / moisture"
      uuid: ""
    required_unit: "kg"
    rule: "Dry-basis moisture fraction u=(wet mass−oven-dry mass)/oven-dry mass; wet-basis w=(wet mass−oven-dry mass)/wet mass; u=w/(1−w). Sample and oven-dry to constant mass using cp_balance; do not mix percentages and fractions. Each state uses its own moisture."
  - id: volume_compatibility
    applies_to: "natural_gas, external_woodchips, sold_woodchips"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Gas T/P/composition/wet-dry basis and compressibility, and chip solid/bulk/packing convention must agree with supplier reference. Unknown compatibility leaves quantity linkage incomplete; a database secondary mass coefficient is not density."
  - id: steam_basis
