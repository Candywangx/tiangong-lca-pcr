    required_property_ref:
      name: "Net delivered heat"
      uuid: ""
    required_unit: "MJ"
    rule: "Supplier background definition must correspond to the measured steam-inlet minus return/loss enthalpy boundary; MJ or calorific value alone does not establish this basis. Unknown compatibility remains unresolved."
