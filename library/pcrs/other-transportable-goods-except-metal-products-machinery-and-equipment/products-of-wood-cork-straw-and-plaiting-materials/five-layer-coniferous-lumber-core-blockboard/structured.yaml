measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "B = total accepted net panel mass in kg over the same lot/site/period, excluding all packaging; collect using cp_output. Normalize each external exchange by B. Retain measured final moisture; do not replace B with oven-dry wood mass."
  - id: wood_moisture
    applies_to: "wood material ledger"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "u = (m_wet - m_od) / m_od; m_od = m_wet / (1 + u). Determine oven-dry moisture by representative sealed samples and oven weighing, cp_materials; keep dry-basis u distinct from wet-basis fraction. Source: usda-wood-handbook-2021."
  - id: adhesive_solids
    applies_to: "PVAc/UF glue ledgers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "m_s = m_supplied * s; m_ns = m_supplied * (1 - s). Measure s and actual H2O content separately for PVAc glue and UF powder, cp_recipe; m_ns is the non-solids remainder, not automatically water. Separate resin, hardener, filler and added water; report test conditions and non-water volatiles. Supplied solids are not conserved cured-resin mass; no universal solids fraction or cure yield."
  - id: utilities
    applies_to: "electricity and purchased heat"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "E_MJ = 3.6 * E_kWh. H_net = sum(m_hotwater * (h_supply - h_return)) with m_hotwater in kg, h_supply and h_return in MJ/kg and H_net in MJ; if supplier h is in kJ/kg, divide that sum by 1000. Preserve the same actual supplier enthalpy reference basis and net-delivery boundary, using each supply/return stream's measured temperature/pressure state, cp_heat. Do not multiply MJ heat by fuel LHV/HHV or assume steam mass equals useful heat."
