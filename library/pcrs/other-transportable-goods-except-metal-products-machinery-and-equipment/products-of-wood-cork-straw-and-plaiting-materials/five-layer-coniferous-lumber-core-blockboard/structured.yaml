allocation_rules:
  - rule_id: a_physical
    applies_to: "blockboard_manufacture"
    rule: "Keep unallocated total-mass and elemental C/H/O ledgers for all stages, with fossil/biogenic carbon origin retained; reactions have zero net elemental generation. Track H2O, dry wood and adhesive species separately with measured or supported formation/consumption terms, not assumed conserved species. Internal transfers cancel only at aggregated boundary. Physical panel/waste quantities are never multiplied by environmental allocation shares."
    source_ids:
      - usda-wood-handbook-2021
      - frihart-wood-joining-2023
  - rule_id: a_waste
    applies_to: "blockboard_manufacture"
    rule: "Base route has one saleable panel product and exported treatment wastes: assign production burdens to accepted panels and include waste-treatment burdens without avoided-product credit. Internal rework remains within the same ledger. If residues become saleable co-products, their product identities and measured physical outputs must be added before choosing a documented causal allocation or an explicitly justified alternative; keep that burden ledger separate from mass balance. Do not relabel waste UUIDs as products."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "blockboard_manufacture"
      flow_role: "finished_panel"
      record_type: "foreground_record"
      raw_fields: "lot; species/layer construction; final moisture; net accepted mass B; rejected mass; package tare"
      collection_method: "Calibrated weighing after conditioning; reconcile grading/acceptance and packing records for same lot."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_materials
      process_id: "blockboard_manufacture"
      flow_role: "core_lumber; face_veneer; cross_veneer"
      record_type: "foreground_record"
      raw_fields: "lot/species/grade; wet mass; sample wet/oven-dry mass; layer dimensions; axis; scrap; supplier start state"
      collection_method: "Weigh received inputs and stage usage; seal representative moisture samples, oven-dry/weigh to constant mass under documented method, reconcile stock and stage transfers."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_recipe
      process_id: "blockboard_manufacture"
      flow_role: "pvac_glue; uf_resin; hardener; wood_flour"
      record_type: "foreground_record"
      raw_fields: "component identity; weighed charge; batch number; solids/purity and test conditions; measured H2O/non-water volatiles; supplier formulation; same-lot pre/post-cure composition and reaction extent; G_H2O; C_H2O; uncertainty; glue area; wet/dry spread; core clamp; layup delay; platen/glueline temperature; pressure; dwell; bond test"
      collection_method: "Calibrated batch scales, supplier formulation/certificates and sampled solids/H2O tests; separate core edge glue from each of four veneer interfaces. Quantify actual foreground UF water formation/consumption by validated matched-lot chemical analysis or documented supplier-supported reaction stoichiometry applied to measured same-lot reaction extent under the recorded cure conditions. Separate upstream resin synthesis from foreground cure and evaporation; a generic reaction diagram, solids-loss test or total exhaust water alone does not establish reaction extent. Keep missing terms unknown; no default amount, complete-cure assumption or residual-derived yield. Record press cycles and accepted glue bond."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_water
      process_id: "blockboard_manufacture"
      flow_role: "water; glue_wastewater"
      record_type: "foreground_record"
      raw_fields: "fresh/returned water mass; meter volume; density; wastewater quantity; water/solids; COD; formaldehyde; destination"
      collection_method: "Meter fresh mixing/washing branches; collect wastewater discharge and analysis, reconcile tank stocks and internal recycling."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_energy
      process_id: "blockboard_manufacture"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "circuit; kWh/MJ; voltage; bill; hours; stage; shared-meter apportionment"
      collection_method: "Read calibrated meters by non-overlapping circuit and reconcile total electricity with supplier bill."
      unit: "MJ"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_heat
      process_id: "blockboard_manufacture"
      flow_role: "heat"
      record_type: "foreground_record"
      raw_fields: "hot-water mass; supply/return temperature/pressure; enthalpy reference/state and h units (MJ/kg or kJ/kg); net MJ; supplier losses; background boundary"
      collection_method: "Calibrated heat meter or mass-flow/enthalpy integration at supply/return; preserve actual supplier h units/reference/state, convert kJ to MJ explicitly and verify supplier/background net-delivery compatibility before use."
      unit: "MJ"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_pack
      process_id: "blockboard_manufacture"
      flow_role: "pe_film; steel_strap"
      record_type: "foreground_record"
      raw_fields: "material; lot; packaging mass; reuse; scrap; package tare; steel-band supplier composition (99% Fe, 1% C); mechanical decomposition/melting recycling route"
      collection_method: "Weigh each packaging material separately, reconcile issue/return records with accepted panel lots; verify the selected steel-band composition/route with supplier certificates; unmatched or unknown supply requires unresolved/alternative identity."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_waste
      process_id: "blockboard_manufacture"
      flow_role: "clean_sawdust; clean_offcut; bonded_trim; sanding_dust; glue_residue; pvac_residue"
      record_type: "foreground_record"
      raw_fields: "stream; wet/dry mass; moisture/solids; resin content; recovered versus emitted; stock; sales status; treatment destination"
      collection_method: "Dedicated bins and scales per atomic stream; waste consignment and analysis records; subtract same-period internal returns only, never off-site treatment."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
    - protocol_id: cp_emissions
      process_id: "blockboard_manufacture"
      flow_role: "formaldehyde; methanol; pm25; pm_between; pm_over10; water_vapour; co2_bio; co2_fossil"
      record_type: "foreground_record"
      raw_fields: "species/source; outlet; normal flow; concentration; humidity; sampling conditions; hours; control device; fugitives; PM cut fractions; non-detect limit; carbon origin; inlet/outlet air humidity and flow; condensate; retained/exported H2O; matched-lot G_H2O/C_H2O from cp_recipe; water-specific method and uncertainty"
      collection_method: "Representative outlet/fugitive sampling and time integration after controls; preserve species and disjoint particle cuts. Quantify net process vapour with matched inlet/outlet humidity-flow and condensate records, then reconcile the reaction-aware H2O ledger including actual UF water formation/consumption from cp_recipe; avoid duplicate carrier water or reaction water. Total mass loss includes non-water volatiles and is not an H2O assay. Record missing terms/species as unknown rather than forcing closure. Demonstrated absent oxidation requires operating/carbon evidence."
      unit: "kg"
      frequency: "Every lot; continuous utility logs; representative emission campaign"
      temporal_coverage: "Same declared representative production period"
      site_scope: "One declared plant and matched route/lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; primary records; sampling/analysis; supplier definitions; stock/acceptance reconciliation"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all external exchanges"
      rule: "x_norm = sum(q_lot) / B; B = sum(accepted net panel mass); B > 0"
      inputs:
        - q_lot
        - B
        - cp_output
      output: "x_norm"
      source_ids: []
    - id: dry_wood
      applies_to: "wood mass ledger"
      rule: "m_od = m_wet / (1 + u); m_water = m_wet - m_od"
      inputs:
        - m_wet
        - u
        - cp_materials
      output: "m_od; m_water"
      source_ids:
        - usda-wood-handbook-2021
    - id: glue_solids
      applies_to: "adhesive ledger"
      rule: "m_s = m_supplied * s; m_ns = m_supplied * (1 - s); m_H2O = m_supplied * w_H2O, where w_H2O is measured or verified supplier water mass fraction, not automatically 1 - s. Record method/conditions and non-water volatile fraction; m_s is supplied tested solids, not cured-resin mass."
      inputs:
        - m_supplied
        - s
        - w_H2O
        - cp_recipe
      output: "m_s; m_ns; m_H2O"
      source_ids: []
    - id: electricity_units
      applies_to: "electricity"
      rule: "E_MJ = 3.6 * E_kWh"
      inputs:
        - E_kWh
        - cp_energy
      output: "E_MJ"
      source_ids: []
    - id: net_heat
      applies_to: "heat"
      rule: "H_net = sum(m_hotwater * (h_supply - h_return)); m_hotwater in kg, both h in MJ/kg, H_net in MJ. For supplier h in kJ/kg use H_net = sum(m_hotwater * (h_supply - h_return)) / 1000. Supply/return use the same actual supplier enthalpy reference basis and net-delivery boundary, with each stream's measured temperature/pressure state."
      inputs:
        - m_hotwater
        - h_supply
        - h_return
        - cp_heat
      output: "H_net"
      source_ids: []
    - id: emission_mass
      applies_to: "individual emitted species"
      rule: "m_i = sum(c_i * V_normal * dt) + m_fugitive_i; convert reported concentration and time units explicitly"
      inputs:
        - c_i
        - V_normal
        - dt
        - m_fugitive_i
        - cp_emissions
      output: "m_i"
      source_ids: []
    - id: pm_fractions
      applies_to: "pm25; pm_between; pm_over10"
      rule: "m_pm_between = m_PM10 - m_PM2.5; m_pm_over10 = m_totalPM - m_PM10; same-basis cumulative measurements only; negative differences require review"
      inputs:
        - m_PM2.5
        - m_PM10
        - m_totalPM
        - cp_emissions
      output: "m_pm_between; m_pm_over10"
      source_ids: []
    - id: physical_balances
      applies_to: "unaltered process ledgers"
      rule: "For total mass and elemental C/H/O separately: opening stock + all material boundary intake = closing stock + panel + exported residues + material emissions; include evidenced atmospheric uptake and packaging transfers, retain fossil/biogenic C origin, and set net chemical generation of conserved elements to zero. Report signed residuals and uncertainty; never adjust measured quantities or invent a closure tolerance."
      inputs:
        - cp_materials
        - cp_recipe
        - cp_water
        - cp_pack
        - cp_waste
        - cp_emissions
        - cp_output
      output: "total-mass/elemental-C/H/O residuals"
      source_ids:
        - frihart-wood-joining-2023
    - id: reactive_species
      applies_to: "H2O and dry-material species ledgers"
      rule: "For each species X: opening X + external X intake + G_X = closing X + panel X + exported X + emitted X + C_X; G_X/C_X are actual foreground formation/consumption in kg, measured or supported by same-lot reaction extent, cp_recipe. For H2O include actual UF cure reaction water, wood moisture, glue carrier water, added water, air humidity and retained/liquid/vapour outputs on the same boundary. For dry wood/adhesive species track chemical conversion and non-water volatile losses separately from H2O. Elemental C/H/O redistribution is not net elemental generation; upstream resin-production water is not foreground generation. Report residual/uncertainty without default G_X/C_X, yield or assumed complete cure; missing reaction terms make closure inconclusive."
      inputs:
        - cp_materials
        - cp_recipe
        - cp_water
        - cp_waste
        - cp_emissions
        - cp_output
      output: "reaction-aware H2O/dry-species residuals"
      source_ids:
        - frihart-wood-joining-2023
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Verify material/species/state/route/property/unit/medium; blank UUID is an unresolved identity, not permission to substitute an adjacent product."
      evidence: "Supplier specification and verified direct record"
    - id: dq_recipe
      applies_to: "core and skin glue"
      requirement: "Current supplier-defined whole-adhesive formulation, actual solids/H2O/purity and bond acceptance; historical literature supports route only. Verify foreground UF G_H2O/C_H2O and dry-species conversion using matched-lot measurements or supported stoichiometry with measured same-lot reaction extent; no inferred universal yield."
      evidence: "unido-panel-adhesives-1977; frihart-wood-joining-2023; supplier/analytical records"
    - id: dq_scope
      applies_to: "period/site/basis"
      requirement: "All raw quantities share period and accepted B; report missing meters/tests, non-detect limits, seasonal/species/configuration changes and survey exclusions. No empirical range is imposed from another manufacturing route."
      evidence: "Primary records and boundary disclosure"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_panel"
    rule: "Exactly one product output matches the reference row/UUID; 1 kg net panel output, all required qualifiers and measured moisture are present. Intermediate same-product transfers stay inside the aggregate."
    source_ids:
      - fao-farm-structures-1986
  - rule_id: v_route
    applies_to: "blockboard_manufacture"
    rule: "Reject incompatible core, grain directions, glue route or integrated combustion/drying boundary. Confirm four veneer interfaces, core edge glue and actual press sequence, recipe/solids and acceptance records. Classification label alone cannot establish applicability."
    source_ids:
      - fao-farm-structures-1986
      - unido-panel-adhesives-1977
  - rule_id: v_measurement
    applies_to: "blockboard_manufacture"
    rule: "Normalize actual external quantities by the same B; retain unallocated total-mass/elemental C/H/O and reaction-aware species ledgers separately from burdens. Verify actual UF H2O formation/consumption and dry-species conversion evidence; never treat water or supplied dry solids as independently conserved through cure. Missing reaction extent/analytical evidence is inconclusive, not zero water generation or a forced vapour residual. Confirm supplier/background net-delivery heat basis, h units/reference/state and any kJ-to-MJ conversion; unsupported relationships and unresolved identities remain inconclusive."
    source_ids:
      - usda-wood-handbook-2021
      - frihart-wood-joining-2023
  - rule_id: v_emissions
    applies_to: "blockboard_manufacture"
    rule: "Verify individual species, outdoor-air medium and disjoint PM fractions; do not sum cumulative cuts or count collected dust as air emissions. Reconcile net water vapour against inlet/outlet humidity, condensate, retained/exported H2O and supported foreground reaction water, without double counting. Retain evidenced biogenic CO2; absence/test gaps and cut-offs must be supported explicitly."
    source_ids:
      - frihart-wood-joining-2023
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared interior five-layer coniferous strip-core PVAc/UF route with matched upstream inputs and all unresolved identities/measurements closed"
  excluded_use: "Full CPC3142 coverage, mixed cores/adhesives, structural/lifetime comparisons, marine/exterior use, all-veneer datasets or numerical defaults from other sectors"
  required_metadata: "Plant/time/route/species/layers/recipe, net B/moisture, suppliers, utility definitions with h units/reference/state, actual UF reaction extent and G_H2O/C_H2O evidence, reference flow, allocation and all exclusions"
  required_quality_disclosure: "Sampling/meter calibration, identity gaps, unsupported net heat, total-mass/elemental and reactive-species balance residuals, missing reaction measurements, co-product status, emission coverage and limits; foreground-only versus linked upstream completeness"
  update_trigger: "Core/species, adhesive formulation/solids, press/conditioning, utility source/basis, waste destination, supplier or emission measurement changes"
