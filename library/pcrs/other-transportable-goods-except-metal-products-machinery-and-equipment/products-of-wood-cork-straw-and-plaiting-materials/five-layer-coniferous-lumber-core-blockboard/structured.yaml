system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "blockboard_manufacture"
      rule: "Include receipt/conditioning, core ripping and PVAc edge gluing, UF preparation, five-layer layup, both hot-press skin-bonding passes where used, cooling/conditioning, trimming, sanding, grading, packaging and pollution controls. Maintain stage meters within one foreground unit."
      source_ids:
        - fao-farm-structures-1986
        - unido-panel-adhesives-1977
    - rule_id: b_upstream
      applies_to: "blockboard_manufacture"
      rule: "Attach upstream delivered-input datasets or explicitly disclose missing coverage. No on-site fuel boiler, raw-log conversion or green-lumber kiln drying is inferred; a site with these operations needs expanded atomic inventories and source assessment."
      source_ids:
        - usda-wood-handbook-2021
    - rule_id: b_emissions
      applies_to: "blockboard_manufacture"
      rule: "Treat exported waste as technosphere transfer and residual outdoor emissions as elementary exchanges. Include evidenced biogenic CO2 in LCI regardless of LCIA accounting; imported heat/electricity emissions stay upstream. Direct wastewater discharge is outside this waste-to-treatment route and needs explicit species/medium rows."
      source_ids: []
