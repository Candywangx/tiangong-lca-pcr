      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Untreated logs and purchased materials received at plant; include conditioning, veneer manufacture, boiler and controls |\n| starting_condition_role | Foreground receiving cutoff, not zero upstream burden |\n| product_classification_scope | Matching integrated PF all-veneer subset of CPC 31413 only; at least one non-tropical non-coniferous outer ply and no tropical wood in any ply; actual inner species and acceptance tests required; no full-leaf claim |\n| recursive_input_rule | External plywood/rework needs a separate incoming state, upstream dataset and method extension; it is not accepted by default. Internal rework, fuel chips and recirculated water stay in the physical ledger. |\n| upstream_dataset_requirement | Link upstream production and inbound transport matching each input origin/time/location/state; link external treatment for each waste and avoid duplicate on-site combustion. |\n| disclosure | Disclose receiving/shipment boundaries, site stages, supplier gaps, controls, allocation and transfers; foreground activity alone is not a complete cradle-to-gate dataset. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_stages | manufacturing | Include actual conditioning, peeling/slicing, drying/redrying, PF glue/layup/hot pressing/curing, cooling, trim/grade-dependent sand, acceptance, packing, controls and on-site heat; keep stage meters rather than infer stage heat from a site total. | epa-plywood-2002 |\n| boundary_single_reference | manufacturing | Aggregate manufacture through shipment packing as one foreground unit; movement of the same panel through press/trim/pack is not another external finished output. Retain stage and loop transfers with equal quantities at both ends in the physical map. | corrim-western-plywood-2025 |\n| boundary_emissions | manufacturing | Include actual boiler, direct-fired dryer, press, engine and control air outlets; count shared outlets once and distinguish captured from emitted particles. Do not repeat external wastewater treatment on site. | epa-plywood-2002; epa-wood-boiler-2022 |\n| boundary_downstream | dataset | This manufacturing unit excludes downstream fabrication, installation, use and end-of-life and does not import CORRIM whole-life scenarios; disclose and link actual scenarios for extensions. | corrim-western-plywood-2025; corrim-southern-plywood-2025 |\n| boundary_provider_volume | wood_fuel; chips; natural_gas | Verified UUID and Volume property do not complete background measurement linkage. Retain actual A definitions and paired measurements/conversions. Unknown solid/bulk basis, k, moisture, gas conditions or A state are specific pending gaps; retain identity without claiming an unknown conversion complete. | fao-ubet-volume |\n\n"
