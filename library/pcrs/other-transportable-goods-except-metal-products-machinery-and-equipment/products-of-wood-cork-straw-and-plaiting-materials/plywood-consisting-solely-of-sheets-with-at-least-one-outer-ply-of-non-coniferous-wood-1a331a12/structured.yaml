measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Using cp_product measure accepted net geometric volume V_net, paired net mass P_net and delivery state; all inventory is per 1 m3 reference flow. Preserve weighing records; mass is not the denominator. No nominal dimensions, bulk air gaps, packaging or oven-dry wood substitution"
  - id: wood_moisture
    applies_to: "roundwood; wood_fuel; bark; chips; sawdust"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For unglued wood, cp_wood/cp_residue determines wet and oven-dry mass; moisture percent uses oven-dry wood as denominator; calibrate electrical tests to species and temperature. Record volatile extractive bias in oven-drying, particularly for actual tropical/pitchy lots; correct only with a verified moisture-specific method. Panel resin/volatiles are not all water."
  - id: energy_basis
    applies_to: "electricity; natural_gas; wood_fuel"
    required_property_ref:
      name: "Energy/Volume"
      uuid: ""
    required_unit: "MJ; m3"
    rule: "Convert electric meter readings using 1 kWh = 3.6 MJ; retain gas temperature/pressure and chip moisture/bulk volume, label HHV/LHV. Steam is an internal transfer; meter the enthalpy difference; an MJ property does not establish net delivered heat."
  - id: source_partition
    applies_to: "co2_bio; co2_fossil; ch4_bio; ch4_fossil; co; co_bio"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile the documented carbon origin of each wood, flour, resin/ingredient and fuel component separately. PF chemistry or a wood/species label alone does not establish every carbon origin; retain unknown biogenic/fossil fractions for review rather than assigning them arbitrarily."
  - id: provider_volume_match
    applies_to: "wood_fuel; chips; natural_gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "UUID establishes identity only. Match actual supplier/background A volume, delivery and moisture state; measure chip solid/bulk k in a paired cohort, and obtain supplier gas T/P, dry/wet, composition/Z and meter-basis conversion. Unknown conditions leave linkage incomplete; generic factors or property values cannot replace evidence."
