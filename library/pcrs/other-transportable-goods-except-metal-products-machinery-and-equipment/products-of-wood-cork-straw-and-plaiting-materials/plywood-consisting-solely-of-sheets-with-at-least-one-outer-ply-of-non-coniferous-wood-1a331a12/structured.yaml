allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "manufacturing"
    rule: "First directly meter separable stages and product-specific burdens: PF preparation/press, final trim/sand and packing go to the corresponding plywood. Use submetering and measured causation for shared veneer/conditioning/heat; avoid a blanket whole-facility share."
    source_ids:
      - corrim-western-plywood-2025
      - epa-plywood-2002
  - rule_id: allocation_physical
    applies_to: "shared operations"
    rule: "For inseparable operations use evidenced physical causation: relate burdens to dry wood throughput, measured heat demand or processing time. Dry-wood mass allocation applies only to shared veneer burdens for which that relationship holds. Include real co-products in its denominator, exclude wastes and duplicate loop throughput. Leave unproven relationships for review rather than default to economics or dry mass."
    source_ids:
      - corrim-western-plywood-2025
  - rule_id: allocation_physical_ledger
    applies_to: "all inventory rows"
    rule: "Preserve full physical quantities in the process map and wood/water/carbon balances before allocation. Burden shares act only on the relevant environmental burden ledger; do not multiply physical co-product outputs by shares. Retain unallocated activity, allocation basis/share and allocated burdens so both ledgers can be reconstructed."
    source_ids:
      - corrim-western-plywood-2025
  - rule_id: allocation_internal_fuel
    applies_to: "wood_fuel; chips; bark; sawdust"
    rule: "Internal chip fuel does not cross the external boundary, earn substitution credit or become another purchased input. Record heat generation and combustion emissions, match internal transfer quantities, and keep separate internal/purchased origins. Do not remove elementary CO2 on a carbon-neutrality claim."
    source_ids:
      - epa-wood-boiler-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "manufacturing"
      flow_role: "finished plywood"
      record_type: "acceptance/dimensions/weighing"
      raw_fields: "lot; each ply species/harvest and supply origin; separate face/back species and class; actual inner species; crossed all-veneer layup/layer thickness; PF complete recipe; bond/strength grade and test results; cure/cooling/trim/sanding/acceptance gate; paired P_net; actual length/width/thickness/net area/through-holes; V_net; delivery moisture/temperature; coating/treatment absence; provider gate/volume convention ; unique first external dispatch ID; production cohort; opening/closing raw-WIP-unshipped-FG vectors per exchange; original outward/return IDs; later service and waste; allocation history"
      collection_method: "Measure accepted net panel dimensions with calibrated instruments after curing/cooling/finishing at recorded delivery state; reconcile count and actual net material area times final thickness, excluding holes/cutouts, packaging, air gaps, rejects and unshipped stocks. Weigh the same lots excluding packaging; inspect ply-by-ply species/layup and actual bond acceptance; confirm at least one non-tropical non-coniferous outer ply and no tropical wood in any ply, with no tropical wood permitted in either outer or inner veneers; use resin-appropriate moisture tests with extractive/volatile limitations. Verify provider gate and quantity convention independently. Require V_net>0 for the accepted cohort, with paired same-state P_net and recorded uncertainty; exclude removed test specimens from shipped accepted volume and retain their actual material/waste fate.  Establish unique first-dispatch membership and complete shipment_cohort_vectors before normalization. V_net>0 is required only for a unit result; zero/unknown shipment retains absolute operations and carrying vectors without division."
      unit: "kg; m3; moisture fraction; dimensions"
      frequency: "each batch and acceptance shipment"
      temporal_coverage: "continuous representative period including rejects/startup/rework"
      site_scope: "same site and declared product configuration; no pooled incompatible layups/grades"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "instrument/scale calibration; dimensional/hole records; batch acceptance and species/recipe/grade certificates"
    - protocol_id: cp_wood
      process_id: "manufacturing"
      flow_role: "raw logs/veneer"
      record_type: "scale/laboratory/stage ledger"
      raw_fields: "each ply species/harvest and supply origin; conditioning and surface/extractive history; wet mass; oven dry mass; bark; volume; veneer thickness; inlet/outlet moisture; peeling/slicing; dryer/redryer route"
      collection_method: "Representative unglued wood samples weighed promptly and oven-dried to constant mass; calibrate in-line moisture tests to species and verify veneer sampling; meter stage volume/mass transfers."
      unit: "kg; m3; percent dry basis"
      frequency: "each lot and dryer/press campaign"
      temporal_coverage: "same production period as cp_product"
      site_scope: "site species/route/lot"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "sample IDs; scale/oven calibration; stock and internal transfer reconciliation"
    - protocol_id: cp_recipe
      process_id: "manufacturing"
      flow_role: "PF and each recipe ingredient"
      record_type: "supplier/recipe/batch"
      raw_fields: "ingredient identity and state; resin batch; received and dosed mass; liquid solids/water; free formaldehyde/phenol; fillers; alkali; mixing losses; cure time/temperature/pressure"
      collection_method: "Weigh each chemical separately; reconcile supplier formulation, mixing batch, veneer spread and retained cured solids; record actual species/layup-specific hot-press cure/cooling schedule and bond-test acceptance, not a borrowed regional recipe. Record actual cure-related reaction formation/consumption and volatile losses from supplier chemistry and measured stage balances; delivered solids are not automatically identical to retained cured resin mass."
      unit: "kg; fraction; time; temperature; pressure"
      frequency: "each formulation and batch"
      temporal_coverage: "same cp_product period; include recipe changes"
      site_scope: "same PF panel configuration"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "supplier certificate; lab solids; batch scales; pressing logs"
    - protocol_id: cp_energy
      process_id: "manufacturing"
      flow_role: "each fuel/electricity/stage heat"
      record_type: "submeters/fuel and thermal balance"
      raw_fields: "meter opening/closing; stage; run/idle; fuel mass/volume; gas pressure/temperature; chip moisture/bulk density; HHV/LHV; carbon; steam flow/pressure/temperature/condensate; boiler efficiency  supplier/background A ID and gate; solid/bulk volume definition; matched V_s/V_b/k; absolute gas T/P; dry/wet gas; composition/Z; meter standard and supplier-certified conversion;"
      collection_method: "Read distinct meters for conditioning, cutting, dryer/redryer, press, finish, packing and controls; reconcile gas/fuel invoices/stocks; meter steam enthalpy difference to condensate and losses within the facility; no delivered-heat UUID inferred.  Link m3 only after matching actual A volume basis and documented conversion; unknown provider conditions remain unresolved; no inferred mass-volume density from flow-property values."
      unit: "MJ; kWh; m3; kg"
      frequency: "metered continuously; reconcile each campaign"
      temporal_coverage: "same cp_product period including startup/idle"
      site_scope: "same site and thermal network"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "meter calibration; invoices; fuel tests; stage/boiler balances"
    - protocol_id: cp_water
      process_id: "manufacturing"
      flow_role: "tap water/evaporation/effluent"
      record_type: "meters/samples/water balance"
      raw_fields: "tap makeup; resin water; inlet/outlet wood moisture; recirculation; condensate; wastewater mass; evaporation; effluent composition/destination"
      collection_method: "Meter external makeup and wastewater transfers; reconcile moisture and storage; use supplier/measured water density for volume conversion; sample effluent solids, phenol/formaldehyde and carbon; keep recirculation internal. Record actual reaction-generated/consumed H2O during PF cure and combustion, matched incoming/exhaust air moisture, and water retained in all product, residue, ash and packing stocks. Whole wet wastewater and its H2O/contaminants are one external stream plus constituent subledgers; unknown reaction/path terms remain unresolved, not balancing adjustments."
      unit: "kg; m3; concentration"
      frequency: "each campaign and discharge transfer"
      temporal_coverage: "same cp_product period"
      site_scope: "same site water circuits and external treatment boundary"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "meter/sample calibration; manifests; external treatment contract; water closure"
    - protocol_id: cp_material
      process_id: "manufacturing"
      flow_role: "lubricant"
      record_type: "purchase/stocks"
      raw_fields: "oil chemistry/route; issue and return mass; recovered mass; opening/closing stocks"
      collection_method: "Reconcile measured replenishment and stocks against recovery; only actual matching synthetic oil uses the selected UUID. Screen other actual attributable lubricants/greases, hydraulic fluids, press release agents, knives/abrasives/filters and cleaning consumables using service/issue/return records; document supported absence or add separately measured atomic inputs and spent streams before declaring completeness. No generic per-panel consumable quantity."
      unit: "kg"
      frequency: "each issue and stock check"
      temporal_coverage: "same cp_product period"
      site_scope: "site machinery in scope"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "oil certificate; stock and recovery record"
    - protocol_id: cp_pack
      process_id: "manufacturing"
      flow_role: "each packaging component"
      record_type: "shipment BOM/weighing"
      raw_fields: "component polymer or metal; received/issued/shipped whole mass and packing stocks/scraps/returns; reused wood moisture/species; recycled content; cycles; accepted shipment V_net and paired P_net"
      collection_method: "Weigh each component independently and reconcile shipping BOM; exclude packaging from reference volume and paired net mass and distinguish purchased from internal material. Independently reconcile packing receipts plus opening stocks to measured accompanying shipment tare, external scraps/unused returns and closing stocks, outside V_net and P_net; actual unlisted packing losses require characterized atomic streams, never hidden panel yield losses."
      unit: "kg; cycles"
      frequency: "each shipment specification/batch"
      temporal_coverage: "same cp_product period"
      site_scope: "same site shipment boundary"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "packaging invoices/specifications; scale; shipment record"
    - protocol_id: cp_residue
      process_id: "manufacturing"
      flow_role: "each coproduct/waste"
      record_type: "weighing/destination/sampling"
      raw_fields: "stream identity; unglued/PF-bonded; wet/dry mass; bulk volume/density; resin/water/carbon/ash; sale or waste destination; internal fuel; stocks  matched V_s/V_b/k and receiving/background A basis;"
      collection_method: "Weigh and sample each stream separately; verify product vs waste status and external manifests; reconcile full material generation, internal use, export and stocks before allocation."
      unit: "kg; m3; fraction"
      frequency: "each transfer and representative lot"
      temporal_coverage: "same cp_product period"
      site_scope: "same site and actual external destination"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "scale/lab calibration; sales/waste receipt; balanced transfer ledger"
    - protocol_id: cp_air
      process_id: "manufacturing"
      flow_role: "each elementary air emission"
      record_type: "outlet/fugitive tests"
      raw_fields: "stack/control ID; species; dry/wet standard gas flow; concentration; test temperature/filter; particle interval; filterable/condensable fraction; run/startup hours; fuel source; detection limit"
      collection_method: "Test each relevant outlet/fugitive source during representative operation; multiply compatible gas flow, species mass concentration and hours; reconcile shared stacks and carbon sources; preserve measured totals and unknown speciation as gaps, not zero."
      unit: "kg; concentration; gas flow; hours"
      frequency: "each route/species/recipe change and representative campaign"
      temporal_coverage: "same cp_product period including startup/shutdown"
      site_scope: "same site dryer/press/boiler/engines/controls"
      aggregation_rule: "per 1 m3 reference flow"
      quality_evidence: "test reports; flow/concentration calibration; operating hours; detection/speciation limits"
  calculation_rules:
    - id: normalize_campaign
      applies_to: "all inventory rows"
      rule: "After shipment_cohort_vectors is complete, a_i = Q_i / V_net for the selected first-dispatch cohort. Here Q_i is the compatible extensive physical-provenance numerator traced to those panels, including prior-period history; it is not an unmatched current-period receipt, meter total or purchase. Keep the separately attributed burden numerator A_i and its A_i/V_net model view distinct from gross physical ledgers; never shrink actual co-product/waste movements by burden shares. V_net remains the measured accepted net geometric panel volume in m3 at the existing shipment gate, with paired same-state P_net; finished_panel is 1 m3. Preserve all original records, closing carrying vectors and actual losses/services. No normalized result when V_net is zero or unknown, or required history is missing; a zero numerator is used only when evidenced for an otherwise valid cohort."
      inputs:
        - Q_i
        - V_net
        - P_net
        - cp_product
        - "respective row protocol"
        - shipment_cohort_vectors
        - inherited_physical_and_burden_vectors
        - A_i
      output: "a_i"
      source_ids:
        - corrim-western-plywood-2025
    - id: shipment_cohort_vectors
      applies_to: "all inventory rows"
      rule: "Keep the existing accepted factory-shipment gate. V_net is measured net geometric volume of panels making their unique first external dispatch in the selected delivery cohort and recorded delivery state; newly first-dispatched opening FG is included with its inherited history, but unshipped closing FG and previously dispatched returns/re-dispatch never create additional manufacturing V_net. Identify each panel/batch, production cohort, first-release and first-dispatch events, original returned-item outward record and actual state. Carry complete exchange-by-exchange extensive physical-provenance and separately attributed burden/provider vectors through raw stocks, all WIP stages and unshipped FG, including prior periods and actual failed/startup/rework activity assigned to its production cohort. For each compatible vector reconcile opening history + actual new activity + evidenced incoming transfers = vectors assigned to the selected first-dispatched panels + closing raw/WIP/unshipped-FG history + separately justified other-cohort/function transfers. Released but unshipped FG remains a carrying stock for this shipment-gate method; ordinary rejects, samples, waste or sales do not automatically export their causing/treatment burdens. Correct raw receipts for stocks once only. Allocation/splitting requires actual cohort/configuration evidence, never an automatic current-shipment fraction or a missing-history zero. Preserve source process, carrier, unit, state, provider and earlier allocation so inherited upstream loads are neither relabelled direct factory emissions nor added to a provider already owning them. Keep full current-period physical gate quantities separately from cohort attribution. Same-item returns retain their original manufacturing cohort and first-dispatch history; subsequent storage, handling, repair/re-dispatch and actual failed/unauthorized work are separately measured incremental services with their explicitly declared original cohort/service basis, never a second manufacturing output. Any actual missing return/service/waste exchange requires its concrete card and protocol before dataset completeness. If V_net is zero or unknown, retain absolute operations and all unassigned vectors without division or omission; do not fabricate production. An incomplete history or unresolved cohort assignment prevents a complete normalized result."
      inputs:
        - cp_product
        - "respective row protocol"
        - original_cohort_records
        - opening_history
        - closing_history
        - actual_activity
        - traceable_transfers
        - original_dispatch_returns
        - service_records
      output: "compatible_shipment_numerators_and_preserved_stock_vectors"
      source_ids:
        - wood-handbook-2021
        - corrim-western-plywood-2025
    - id: wood_dry_basis
      applies_to: "roundwood; wood_fuel; bark; chips; sawdust"
      rule: "MC_db = 100 * (m_wet - m_od) / m_od; m_od = m_wet / (1 + MC_db / 100), using measured unglued wood moisture. Reconcile water, cured resin and non-water volatiles separately for panels/bonded residues; dry panel mass is not oven-dry wood mass."
      inputs:
        - m_wet
        - m_od
        - cp_wood
        - cp_residue
      output: "dry wood mass and moisture"
      source_ids:
        - wood-handbook-2021
    - id: volume_and_density
      applies_to: "finished_panel; chips; wood_fuel"
      rule: "Panel V_net = sum(actual net material area * actual final thickness) at accepted delivery state; subtract through-holes/cutouts, not microscopic porosity. Panel rho_state = P_net / V_net from paired same-lot/state measurements; mass required for 1 m3 = rho_state * 1 m3. Retain existing per-kg quantities as raw evidence; only for the identical measured cohort a_i_volume = a_i_mass * rho_state. Chips/fuel retain separately measured solid/bulk/packing definitions; no panel density or regional density substitution."
      inputs:
        - cp_product
        - cp_wood
        - cp_residue
        - cp_energy
        - P_net
        - V_net
      output: "measured state density; actual reference volume and required net mass"
      source_ids:
        - wood-handbook-2021
    - id: recipe_solids
      applies_to: "pf_resin; wheat_flour; sodium_carbonate; sodium_hydroxide"
      rule: "Ingredient dry solids = received net mass * measured solids fraction; glue water = actual water in liquid ingredients + added mixing water. Count actual external ingredients once; resin-contained water is not additional tap_water input. Reconcile cure losses with effluent, emissions and rework."
      inputs:
        - cp_recipe
        - cp_water
      output: "recipe dry solids and water ledger"
      source_ids:
        - corrim-western-plywood-2025
    - id: physical_balances
      applies_to: "manufacturing"
      rule: "For each layup configuration reconcile dry wood, water, resin solids and biogenic/fossil carbon separately: receipts/transfers + opening stocks = retained product + accompanying packing + full coproduct/waste/emission exports + external unused-material returns + closing stocks. Use receipts and stock changes consistently; do not combine stock-adjusted consumption with the same stocks again. Retained wood/PF/water are constituents of measured panel mass, not additional product outputs. H2O species balances include verified chemical formation/consumption; elemental C/H/O balances redistribute atoms through cure/combustion without inventing yields. Where whole combustion-gas mass is compared, include actual inlet-air/exhaust basis and oxygen/humidity terms rather than equating fuel mass alone to gas output. Unknown composition, reaction and carrier-air terms retain an explicit incomplete balance. Equal internal transfers cancel; report residuals and measurement uncertainty separately; allocated burdens do not close mass."
      inputs:
        - cp_product
        - cp_wood
        - cp_recipe
        - cp_residue
        - cp_air
        - cp_water
      output: "physical balance residuals"
      source_ids:
        - wood-handbook-2021
        - corrim-western-plywood-2025
    - id: stage_heat
      applies_to: "natural_gas; wood_fuel; electricity"
      rule: "Fuel input energy = fuel quantity × measured heating value at the same state. At each stage boundary integrate supplied steam mass × inlet specific enthalpy separately from returned condensate mass × actual return specific enthalpy. Reconcile each actual make-up/unreturned-condensate/blowdown/leak leg, other heat exports, losses and thermal storage on the same boundary and interval before determining stage useful heat; unknown mass or enthalpy prevents a complete result. The single steam-mass × enthalpy-difference shortcut requires demonstrated equal supply/return masses. Heat remains an internal balance/allocation record; count external fuels/electricity and emissions once."
      inputs:
        - cp_energy
        - actual_supply_mass
        - actual_return_mass
        - actual_carrier_state
        - other_mass_heat_legs
        - thermal_stock_change
      output: "stage thermal and fuel balance"
      source_ids:
        - epa-plywood-2002
        - epa-wood-boiler-2022
    - id: air_test_mass
      applies_to: "all elementary output rows"
      rule: "Species emission mass = sum compatible mass concentration * standard gas flow * operating hours for each outlet, with explicit unit conversion; retain dry/wet conditions, temperature/pressure and startup/shutdown. PM2.5–10 = cumulative PM10 - cumulative PM2.5 and PM>10 = same-method total - PM10 only when outlet/time/test method match and differences are nonnegative; avoid duplicate condensables."
      inputs:
        - cp_air
      output: "individual species and disjoint particle masses"
      source_ids:
        - epa-plywood-2002
        - epa-wood-boiler-2022
    - id: causal_allocation
      applies_to: "shared operations"
      rule: "Only where allocation_physical establishes causation, s_j = D_j / sum(D_k), with shares summing to 1; B_j = B_shared * s_j + B_direct_j. D is the justified physical driver and B the relevant burden; do not multiply sold physical flow by s. Packaging and product-specific burdens go directly to the product."
      inputs:
        - cp_energy
        - cp_residue
        - cp_product
        - "documented physical driver"
      output: "separate allocated burden ledger"
      source_ids:
        - corrim-western-plywood-2025
    - id: chip_provider_conversion
      applies_to: "wood_fuel; chips"
      rule: "V_s = k * V_b; k = measured V_s / measured V_b for the same cohort, moisture and packing state. If A uses solid volume, use V_s; if A uses bulk volume, use V_b matched to A state, with measured state conversions where needed. Unknown A, k or state leaves linkage incomplete. Internal chips use physical mass/heat ledgers without another external supply input."
      inputs:
        - cp_energy
        - cp_residue
        - "matched V_s"
        - "matched V_b"
        - "actual A definition"
      output: "provider-matched volume with pending status where unknown"
      source_ids:
        - fao-ubet-volume
    - id: gas_provider_conversion
      applies_to: "natural_gas"
      rule: "Preserve site V_site and T/P, dry/wet state, composition/Z; use a supplier-certified same-state conversion to obtain V_A. V_A / V_net enters background linkage only after A and conversion bases are verified. Otherwise retain measured site quantity and pending linkage; do not infer density or universal standard m3 from 1.0 property values."
      inputs:
        - cp_energy
        - "actual A"
        - "site gas record"
        - "supplier-certified conversion"
      output: "provider-matched gas volume or unresolved link"
      source_ids: []
  data_quality_requirements:
    - id: representative_records
      applies_to: "all inventory rows"
      requirement: "Use the same period/site/configuration, covering production and startup/shutdown; unknown is not zero; absent records remain pending collection, not an observed dataset."
      evidence: "cp_product; all row protocols"
    - id: recipe_completeness
      applies_to: "cp_recipe"
      requirement: "Name, split and verify every recipe component; flour/soda ash/NaOH are conditional on actual formulation, not a default recipe; other adhesives are outside scope."
      evidence: "supplier BOM; cp_recipe"
    - id: no_factor_transfer
      applies_to: "cp_air; cp_energy"
      requirement: "Regional softwood averages, tropical or other-adhesive data are not site factors; any future factor needs original test range, species/resin/equipment, controls, year, denominator and uncertainty."
      evidence: "epa-plywood-2002; both CORRIM cases"
    - id: unspeciated_results
      applies_to: "cp_air"
      requirement: "NOx/VOC/total PM are monitoring/quality checks; quantities lacking species or disjoint-size evidence remain unresolved, without broad/correction substitutions or dropping unknown emissions."
      evidence: "cp_air original reports"
    - id: identity_localization
      applies_to: "all inventory rows"
      requirement: "Selected identities must match state/route/medium/source/property/unit and official Chinese names; blank UUIDs retain specific atomic names; do not claim complete identity coverage before resolution."
      evidence: "direct flow evidence; declared inventory contract"
validation_rules:
  - rule_id: validate_product_boundary
    applies_to: "reference product"
    rule: "Verify cp_product actual ply-by-ply species/origin and crossed all-veneer layup; require at least one non-tropical non-coniferous outer ply and no tropical wood in any ply, exclude both-coniferous outer plies, and retain actual inner species and exclude tropical wood from every ply. Verify complete aqueous resole PF recipe, no coating/chemical treatment and species/layup-specific bond acceptance. Final output must be cured/cooled/trimmed, sanded where grade requires and accepted at shipment gate. Other cores/adhesives, uncured wet layups or missing gate/grade proof are inapplicable/inconclusive."
    source_ids:
      - wood-handbook-2021
      - epa-plywood-2002
      - fao-tropical-timber
      - unsd-cpc3-2025
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Reference 1 m3, all denominators and aggregation/calculation use the same measured accepted V_net at delivery state. Exactly one finished_panel reference output; no duplicate intermediate reference UUID. Check actual dimensions/hole convention and paired P_net/rho_state; exclude packaging/stack air/nominal dimensions/rejects. No invented density or per-panel weight."
    source_ids:
      - corrim-western-plywood-2025
      - wood-handbook-2021
  - rule_id: validate_balance_allocation
    applies_to: "manufacturing"
    rule: "Check unallocated wood/water/resin/carbon balances, equal internal transfers, full physical co-products and the separate allocated burden ledger; insufficient causation or closure residuals cannot be hidden by balancing adjustments."
    source_ids:
      - wood-handbook-2021
      - corrim-western-plywood-2025
  - rule_id: validate_air
    applies_to: "all elementary output rows"
    rule: "Check species/medium/biogenic-fossil attribution and test conditions, duplicate pre/post-control/shared stacks, filterable/condensable particles and disjoint sizes; retain biogenic CO2. Missing measurement or unspeciated/unresolved sizes cannot pass."
    source_ids:
      - epa-plywood-2002
      - epa-wood-boiler-2022
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Report accepted inputs, checks performed/skipped, findings and completeness; blank UUIDs, provider gaps, unknown recipe/emissions or foreground-only data do not establish complete cradle-to-gate coverage or scientific approval."
    source_ids:
      - corrim-western-plywood-2025
  - rule_id: validate_provider_volume
    applies_to: "wood_fuel; chips; natural_gas"
    rule: "Verify actual A, supplier volume interface, chip matched V_s/V_b/k and moisture, and gas T/P, dry/wet, composition/Z and conversion; any unknown leaves the specific link incomplete. A verified UUID does not prove a complete background dataset."
    source_ids:
      - fao-ubet-volume
  - rule_id: validate_panel_provider
    applies_to: "finished_panel"
    rule: "Flow identity does not verify an actual provider dataset. Verify same crossed all-veneer/PF/uncoated material with at least one non-tropical non-coniferous outer ply and no tropical wood in any ply, actual inner species, cure/cooling/trim/grade gate, delivery moisture and actual net geometric m3 convention, species/region/year/recipe and linked stage coverage. A wet/uncured press intermediate or missing provider definition is not a compatible shipment background. Disclose unresolved source classification separately."
    source_ids:
      - epa-plywood-2002
      - fao-plywood-manufacture
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing input for plywood matching declared species/adhesive/state/route; label foreground-only packages"
  allowed_use: "Source-specific manufacture of the declared PF all-veneer species/layup/grade with at least one non-tropical non-coniferous outer ply and no tropical wood in any ply at 1 m3 actual net geometric shipment volume after gate, identity, provider-state/quantity and treatment verification; no pooled species equivalence"
  excluded_use: "Both-coniferous outer plies or tropical wood in any ply; default proxy for the full CPC31413 leaf, other adhesives/cores/routes, wet uncured or unaccepted panels; generic species density/recipe or tropical-emission inference; unsupported comparison, whole-life/carbon-neutrality claims"
  required_metadata: "Reference identity/native Volume/m3; all qualifiers; ply-by-ply species/origin and bond tests; site/period/layup/recipe; V_net/dimensions/hole convention/delivery state and paired P_net/rho_state; atomic flows; provider gate/volume/geography/year/formulation compatibility, transport/treatment; controls/methods/uncertainty; full physical and separately allocated burden ledgers"
  required_quality_disclosure: "Separate measured/calculated/missing values; unresolved identities/species; boundary/omissions; causal allocation; errors/test range; literature cases are not site surveys"
  update_trigger: "Changes in species, layup, recipe, origin, heat, dryer/press/schedule, controls/tests/wastewater, packaging or suppliers"
data_sources:
  - id: "wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021), Ch. 4 pp. 4–1, 4–11; Ch. 10 pp. 10–3/10–4 (PDF255/256); Ch. 11 pp. 11–6/11–7 (PDF282/283); Ch. 13 p. 13–2 (PDF324). https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Construction/adhesive distinctions; unglued wood moisture/density methods; no recipe or species constants"
  - id: "epa-plywood-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 10.5 Plywood Manufacturing, January 2002, pp. 10.5–1 to 10.5–4, Figure 10.5–1. https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Common softwood/hardwood veneer operations, PF exterior hot pressing and emission/method distinctions; no numeric ranges/factors adopted"
  - id: "corrim-western-plywood-2025"
    type: "literature"
    reference: "Puettmann, Life Cycle Assessment of Softwood Plywood Production – Western Region, submitted March 6, revised April 2/May 6, edited July 22, 2025; 2022/2023 survey; §§3.2.3–3.2.6, 4.6–4.8, 5.2, 5.4; Tables 6, 8, 10, 11, 13 (PDF pp. 23,25,27–29; table numbering differs from contents). https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Western-Plywood-Report-Final-07222025.pdf"
    used_for: "Regional softwood case informs separate recipe/stage/physical ledger/allocation/packing checks; no density/glue/energy/emission or use/end-of-life transfer"
  - id: "corrim-southern-plywood-2025"
    type: "literature"
    reference: "Puettmann, Life Cycle Assessment of Softwood Plywood Production – Southern Region, submitted March 6, revised April 2/May 6, edited July 22, 2025; 2022/2023 survey; §§3.2.3–3.2.6, 5.2, 5.4; Table 11, PDF pp. 29–30. https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Southern-Plywood-Report-Final-07222025.pdf"
    used_for: "Second regional softwood case checks input/stage coverage and regional differences; same author/program as Western, not independent methodology validation; no numeric transfer"
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 1.6 Wood Residue Combustion in Boilers, March 2022, §§1.6.1–1.6.4, Table 1.6–1 footnotes, PDF pp. 1–3,6. https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf"
    used_for: "Wood-boiler fuel/control/test applicability, separate ash/emissions and CO2/CH4/N2O checks; no default factors or greenhouse-reporting omissions imported into LCI"
  - id: "fao-ubet-volume"
    type: "official_guidance"
    reference: "FAO, Unified Bioenergy Terminology (UBET), Section 5.1.1 and 5.1.3, online original. https://www.fao.org/4/j4504e/j4504e08.htm"
    used_for: "Moisture and solid/bulk volume concepts only; no tabulated generic conversion, density or heating values, and no replacement of actual supplier definitions."
  - id: "fao-plywood-manufacture"
    type: "official_guidance"
    reference: "FAO Forestry Paper 93, Energy conservation in the mechanical forest industries, §1.3.1–1.3.6, original publication web page. https://www.fao.org/4/t0269e/t0269e03.htm"
    used_for: "Qualitative conditioning/peeling/drying/glue/hot-cure/trim/sand sequence; historical generic process, no numeric conditions, dimensions, recipe or heat factors adopted"
  - id: "fao-tropical-timber"
    type: "literature"
    reference: "K.F.S. King, The utilization of low-quality tropical timber, FAO Unasylva 118, Wood-based panels section; publication states adapted from a 1977 address. https://www.fao.org/4/l2015e/l2015e04.htm"
    used_for: "Historical qualitative evidence for actual tropical veneer defects, uneven moisture/redrying and chemical bonding interference; no all-species PF approval, coatings/alternate adhesives or numerical defaults"
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, printed p.139 (PDF page 139), class 3141 and subclass 31413; read with the adjacent outer-ply categories. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Official hierarchy, outer-ply distinction and alternate-grain description; wider core examples are not adopted. Sole target is the integrated all-veneer PF subset, not full-leaf methodology approval."
