system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "manufacturing"
      rule: "Include actual conditioning, peeling/slicing, drying/redrying, PF glue/layup/hot pressing/curing, cooling, trim/grade-dependent sand, acceptance, packing, controls and on-site heat; keep stage meters rather than infer stage heat from a site total."
      source_ids:
        - epa-plywood-2002
    - rule_id: boundary_single_reference
      applies_to: "manufacturing"
      rule: "Aggregate manufacture through shipment packing as one foreground unit; movement of the same panel through press/trim/pack is not another external finished output. Retain stage and loop transfers with equal quantities at both ends in the physical map."
      source_ids:
        - corrim-western-plywood-2025
    - rule_id: boundary_emissions
      applies_to: "manufacturing"
      rule: "Include actual boiler, direct-fired dryer, press, engine and control air outlets; count shared outlets once and distinguish captured from emitted particles. Do not repeat external wastewater treatment on site."
      source_ids:
        - epa-plywood-2002
        - epa-wood-boiler-2022
    - rule_id: boundary_downstream
      applies_to: "dataset"
      rule: "This manufacturing unit excludes downstream fabrication, installation, use and end-of-life and does not import CORRIM whole-life scenarios; disclose and link actual scenarios for extensions."
      source_ids:
        - corrim-western-plywood-2025
        - corrim-southern-plywood-2025
    - rule_id: boundary_provider_volume
      applies_to: "wood_fuel; chips; natural_gas"
      rule: "Verified UUID and Volume property do not complete background measurement linkage. Retain actual A definitions and paired measurements/conversions. Unknown solid/bulk basis, k, moisture, gas conditions or A state are specific pending gaps; retain identity without claiming an unknown conversion complete."
      source_ids:
        - fao-ubet-volume
