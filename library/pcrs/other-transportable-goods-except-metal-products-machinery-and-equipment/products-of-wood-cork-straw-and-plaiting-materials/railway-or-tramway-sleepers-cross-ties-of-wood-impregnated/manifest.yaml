    - row_id: "offcuts_out"
      reason: "Full acc22294 Waste/Mass native definition and wood synonyms positively include woodworking offcuts; its broad examples do not mean every exchange is a mixed-material waste. However its formal class describes agglomerated waste while this row is segregated solid sawn offcut. Resolve this native coherence and actual receiver/state before binding; neither taxonomy alone nor the Chinese basename settles it."
