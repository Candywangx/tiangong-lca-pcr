system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include incoming material handling, attributable site conditioning/machining, pumps/compressors, treatment/liquid tanks, final vacuum, drip pads, contained storage, pollution-control operation and dispatch packaging. Retain upstream transport coverage through delivered inputs; if missing, add a verified transport service in a reviewed extension. Do not count shipping packaging in product mass. Reusable cars, retorts and buildings are excluded from this operating unit and disclosed separately. Actual uncontained leaks require measured component-specific receiving-medium exchanges and review; a capture requirement does not prove zero emissions."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Map the actual forest/harvest source → sawmill sawing to solid sleeper stock → actual seasoning/kiln drying, sizing/adzing/boring/incising → actual hot-oil conditioning → selected pressure cycle → liquid return, condensation and vacuum → contained draining/storage → testing/release → finished custody and actual railway receiver. Declare site, ownership, period and material state per stage. Inherit supplier-completed forestry/sawing/drying/machining and transport once through the state-matched blank provider and its exchange-by-exchange vector. Collect only remaining onsite operations. A complete blank provider must not also receive a second roundwood-manufacture burden. Missing upstream coverage remains an explicit stage gap, not zero and not a complete lifecycle inferred from purchasing finished articles and packaging. [usda-wood-handbook-2021 Ch.6/13/15; wegland-sleepers]"
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Keep unallocated physical V independently of burden account A. For each stage or stock account and each source/form/phase/unit, opening + external_in + internal_in + actual_formation = closing + external_out + internal_out + actual_consumption. external_in/external_out cross the foreground unit boundary; internal_in/internal_out are the paired receiving/sending ends within that unit. Same-state store or stage transfers use internal_in/internal_out, not formation. Match both ends and vectors of every internal handoff; in whole-unit aggregation these paired internal transfers cancel. Track dry wood, water, whole preservative and independent constituent analyses, installed metal, each package, energy and each emission species separately. Each raw, WIP, new/old FG and reusable stock carries its original provider and exchange-by-exchange inherited burden vector b; a single carbon-footprint scalar is insufficient. Allocation fractions in A never multiply physical wood/water/preservative/coproduced mass or internal handoffs. actual_formation and actual_consumption pair a real change of tracked state with the corresponding withdrawal from the preceding state, never creation of conserved material mass or an extra addition on top of receipts. Do not also record that same state-conversion event as an internal transfer; when consolidating states, cancel its paired formation/consumption only on the independently reconciled conserved-material basis, retaining actual external losses and nonconserved species changes. Independently close dry wood, water, whole preservative and measured constituent partitions; machining and first acceptance create no wood mass."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "B is first-accepted new net sleeper kg (firstQ) of the same species/configuration/state/route over the complete period, including new closing FG once. grossDispatch is actual external dispatch and is not firstQ: distinguish opening old FG, new production, purchased FG, same-article returns, scrapping and closing FG. Original Qc service and rework of the same article create no new B or second wood provider; carry the prior vector and add only newly measured service burdens. True external return needs the same item's previous outward event. Subdivide cohorts before attribution. Preserve failed Q0, idle, startup/shutdown, cleanup and storage quantities and burdens. Inseparable burdens remain an explicitly reviewed pool, not a success-only mean. For B=0 retain the pool without division or zero intensity."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Whole wood, whole commercial preservative and each wet mixed waste stream each connect once to their provider/receiving interface. Dry wood/water, preservative constituents and wet-waste solid/liquid analyses are partitions of the same physical flow, never additional input totals. Keep raw external preservative receipts and supplier-return legs separately from the net-use diagnostic opening tank + additions - returns - closing tank. Pumping, returned drips and reused bath throughput are internal circulation, not fresh manufacture. Independently measure retained loading, water, air species/phase, waste composition and heat. One residual cannot determine several unknowns. Unknown is not zero."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "For every actual component retain material, form/type, single-use/reusable role, direction, original amount/unit, receipt, owner/custodian, same-item id and prior exchange vector. P is actual purchased receipt, including bulk purchases without a separate package invoice. N_ext is true first external nonpurchase, including verified loan/rental, entrusted or nonpurchased accompanying packaging. ER is true same-item external return with a previous outward event. These entrances are exclusive. Internal reuse is none of them. An existing X explicitly defining a real new entrance may remain; changing letters or deleting duplicate OTHER creates no new receipt interface."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "For each component/source/unit: opening_empty/raw/WIP/FG/reusable + P + N_ext + ER = closing_empty/raw/WIP/FG/reusable + each_actual_external_outward + waste. The listed stock states are disjoint physical custody locations; classify each item once at each instant. A reusable item already on raw/WIP/FG is not also counted in free reusable stock. Match internal issues/store returns at both ends. Retain incoming raw-material packaging, first external dunnage and dispatch packaging, not only issue losses. Every dispatch-with-goods, owner-return and waste leg has its own receiver, direction, quantity and prior vector, with receipt time, origin and cohort. Reconcile grossDispatch packaging tare separately from sleeper mass. Preserve gross transport on incoming, dispatch and return legs; never net return transport against outward transport. Where a reviewed extension requires tkm, convert the actual carried kg to tonnes once by dividing by 1,000, then multiply by that leg's actual km; reuse no invented distance or empty-leg mass. Manufacturing provider occurs once for the actual acquired/newly produced share; a whole supplied container/component must not also receive duplicate constituent manufacture. Loans and returns retain real prior vectors and new handling/cleaning burdens; no zero burden for missing invoices, new Q, infinite reuse count or avoided-production credit. Add one specific card for every actual additional film, paper, pallet or contaminated package; the conditional cards here do not proxy them."
      source_ids: []
boundary_abstraction:
