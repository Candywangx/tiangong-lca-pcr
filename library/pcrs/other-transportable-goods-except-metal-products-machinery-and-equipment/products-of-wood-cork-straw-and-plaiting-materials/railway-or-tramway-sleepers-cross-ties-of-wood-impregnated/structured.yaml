published_dataset_profile:
  dataset_role: "foreground_unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "After exact identity and completeness checks: manufacturing inventory of the declared coal-tar creosote sleeper route; link compatible upstream and downstream systems"
  excluded_use: "Service life prediction; railway transport function equivalence; all-preservative or all-wood industry averages; installation/use/end-of-life without separate study; unknown formulation or unverified final identity"
  required_metadata: "Product/wood/formulation lot; exact net kg state; volume and retention assay basis; treatment/conditioning route; heat supply; site/period; stock/recovery balance; upstream and waste destination"
  required_quality_disclosure: "Foreground coverage, missing identities/species, assay limitations, measured-vs-modelled amounts, detection limits, allocation, uncertainty and excluded routes"
  update_trigger: "Changed species/specification/formulation, treatment route, utilities, capture/recovery, stock basis, assay method, source evidence or exact flow identity"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Service, Forest Products Laboratory. Wood handbook—wood as an engineering material. FPL-GTR-282 (2021). [Official original](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf). Chapters 4, 6, 13 and 15; pp. 4–1, 6–19–23, 13–2–6, 15–8, 15–15–17, 15–22–23."
    used_for: "Untreated moisture definition; variable coal-tar mixture composition; pressure treatment/recovery; species, penetration and retention distinctions. No numerical recipe, retention target, service life, generic density or industry range adopted."
  - id: "epa-wood-preserving-1999"
    type: "official_guidance"
    reference: "US EPA. AP-42 Section 10.8, Wood Preserving (August 1999). [Official original](https://www.epa.gov/sites/default/files/2020-10/documents/c10s08.pdf). §§10.8.1–10.8.3, Figs.10.8–1/2, Table10.8–1 and footnotes, pp.10.8–1–9."
    used_for: "Conditioning, pressure route, tanks/vacuum/treated-charge emission points and individually identified organic species screening. Table factors are uncontrolled empty-cell, E-rated, wood-volume based; VOC as propane. No default factor adopted; PAH list is not a full mixture composition."
  - id: "railexim-sleepers"
    type: "literature"
    reference: "RailExim. Wooden Sleepers. [Industrial primary page](https://www.railexim.hu/wooden-sleepers), observed 2026-10-27."
    used_for: "Whole sleeper form, beech/oak examples, single Type C creosote and autoclave route; no transferred dimensions/retention/lifetime/recipe."
  - id: "impregnacia-sleepers"
    type: "literature"
    reference: "Impregnatsiya 2000. Impregnated wooden sleepers. [Industrial primary page](https://impregnacia2000.com/en/products/impregnated-wooden-sleepers/), observed 2026-10-27."
    used_for: "Actual Rüping/Lowry route and end metal clamps, railway receiver function; not this factory configuration/numbers/allocation approval."
  - id: "wegland-sleepers"
    type: "literature"
    reference: "Wegland Alpin. Railway sleepers. [Industrial primary page](https://www.weglandalpin.ro/en/sleepers.php), observed 2026-10-27."
    used_for: "Actual named-log to sawn/processed/impregnated/plated/grouped/stored product example, distinct from garden use; no yield/recipe transfer."
