allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "This bounded unit normally has one accepted product and separately handled wastes. Preserve original units and integrate actual rates over their measured time/scope once before conversion or attribution. Subdivide unrelated production and trace actual lots first; allocate shared utilities by metered causal use (retort cycle, measured heating duty or machine operation), with the physical basis recorded for each exchange. Waste handling is attributable to the producing lot; no avoided-disposal or energy credit is assumed. Internal recovered preservative is not a coproduct and earns no replacement credit."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Keep the unallocated physical process ledger intact: received wood, product, offcuts, rejects, moisture, retained preservative, stocks and internal transfers. Environmental burdens may be allocated only in a separate account after subdivision. Never multiply physical coproduct output mass or both sides of an internal link by a burden allocation fraction. If saleable clean wood coproducts or mixed product campaigns occur, revise flow classification and separately review the causal/economic allocation and sensitivity; do not silently relabel a waste or impose a default fraction. Economic allocation may address only the evidenced inseparable residual shared by the same coproduct family after actual subdivision and exchange-specific causal attribution, using contemporaneous measured quantities and actual prices/revenues on the same basis. Record that residual, prices, period and sensitivity; unknown prices or causal scope remain unresolved. Carry inherited exchange vectors and new attributed burdens into A for the same cohort, then divide by its B once. Original Qc service, rework and re-delivery inherit their prior vector and acquire only actual new service burdens, without a second product denominator. These are foreground collection rules, not transferred lumber-survey yields or allocation percentages."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "treatment"
      flow_role: "accepted product"
      record_type: "foreground_record"
      raw_fields: "lot_id; species; grade; count; measured dimensions; pretreatment and final solid volume; gross_mass; packaging_tare; accepted_net_mass; weighing time; draining/storage hours; retention assay/analyte/zone; residual water"
      collection_method: "Calibrated gross-minus-tare weighing after specified drain/storage; traceable dimensions and penetration/retention assay. Record each measured volume state and water method; same accepted lot throughout."
      unit: "kg; m3; h"
      frequency: "each accepted lot"
      temporal_coverage: "Same declared production/inventory period including storage and downtime"
      site_scope: "Declared treating plant and accepted lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; supplier/lot records; QA tests; balances; uncertainty; coverage"
    - protocol_id: cp_wood
      process_id: "treatment"
      flow_role: "received blank"
      record_type: "foreground_record"
      raw_fields: "lot_id; species; blank_mass; blank_volume_state; moisture_dry_basis; oven_dry_wood_mass; upstream machining/drying; rejects/offcuts"
      collection_method: "Weigh received manufactured blanks; measure dimensions/moisture before impregnation by a validated untreated-wood method; identify matching upstream supplied state."
      unit: "kg; m3"
      frequency: "each received/processed lot"
      temporal_coverage: "Same declared production/inventory period including storage and downtime"
      site_scope: "Declared treating plant and accepted lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; supplier/lot records; QA tests; balances; uncertainty; coverage"
    - protocol_id: cp_solution
      process_id: "treatment"
      flow_role: "actual mixture and circulating stock"
      record_type: "foreground_record"
      raw_fields: "trade_grade; supplier; lot; SDS; constituent assay; composition completeness; density_temperature; opening_stock; closing_stock; fresh_added; supplier_return; tank_to_retort; retort_return; captured_drips; recovered_reuse; waste_liquid; sludge_load; retained_load; emitted_species"
      collection_method: "Calibrated weighing or tank levels with actual density at recorded temperature. Follow charge and recovery tank logs; independently reconcile inventory-adjusted net consumption, retention assays and waste/emission loads. Audit the real mixture identity against supplier grade and pressure process."
      unit: "kg; m3; degC"
      frequency: "every charge and inventory-period boundary"
      temporal_coverage: "Same declared production/inventory period including storage and downtime"
      site_scope: "Declared treating plant and accepted lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; supplier/lot records; QA tests; balances; uncertainty; coverage"
    - protocol_id: cp_utilities
      process_id: "treatment"
      flow_role: "electricity, water, carbon and strap records kept separately"
      record_type: "foreground_record"
      raw_fields: "lot_id; stage; utility/material identity; meter_start/end; delivered_voltage; fresh_quantity; inventory_start/end; purchase; issued_mass; recovered/reused; calibration; supplier grade"
      collection_method: "Meter electricity and water separately; weigh adsorbent and packaging independently. Reconcile stocks and attributable stages; distinguish internal recirculation from purchased resources."
      unit: "MJ; kg"
      frequency: "each lot or attributable period"
      temporal_coverage: "Same declared production/inventory period including storage and downtime"
      site_scope: "Declared treating plant and accepted lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; supplier/lot records; QA tests; balances; uncertainty; coverage"
    - protocol_id: cp_heat
      process_id: "treatment"
      flow_role: "external hot-water heat"
      record_type: "foreground_record"
      raw_fields: "supplier_boundary; matched_background; heat_meter; supply_return_mass; temperatures; pressures; enthalpies; losses_included; lot_id"
      collection_method: "Use calibrated net heat meter or water mass and supply/return enthalpies; obtain supplier definition of net energy delivery and included losses. Unknown basis remains unresolved."
      unit: "MJ; kg; degC"
      frequency: "each lot or attributable period"
      temporal_coverage: "Same declared production/inventory period including storage and downtime"
      site_scope: "Declared treating plant and accepted lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; supplier/lot records; QA tests; balances; uncertainty; coverage"
    - protocol_id: cp_waste
      process_id: "treatment"
      flow_role: "each segregated waste stream"
      record_type: "foreground_record"
      raw_fields: "stream_id; lot_id; wet_mass; dry_solids; water; mixture/constituent_loading; before_after_treatment_state; internal_rework; receiver; destination; manifest"
      collection_method: "Weigh each segregated consignment and sample moisture/contaminant loading; reconcile waste liquid, sludge, treated rejects and spent carbon separately against stocks and captured mass."
      unit: "kg"
      frequency: "each consignment and lot attribution"
      temporal_coverage: "Same declared production/inventory period including storage and downtime"
      site_scope: "Declared treating plant and accepted lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; supplier/lot records; QA tests; balances; uncertainty; coverage"
    - protocol_id: cp_air
      process_id: "treatment"
      flow_role: "each emission species and size interval"
      record_type: "foreground_record"
      raw_fields: "species; CAS; source; stage; sample_phase; gas_flow; concentration; test_duration; operation_hours; capture_fraction; outlet_mass; detection_limit; non_detects; size_interval; outdoor_medium"
      collection_method: "Source-specific residual-outlet and fugitive measurements for conditioning, vacuum/tank vents, unloading and storage; use representative operating logs with qualified laboratory species/size methods. Include vapour/aerosol phases as applicable; avoid overlapping sources and total VOC. Record uncertainty and uncovered sources, not assumed zeros."
      unit: "kg; concentration; gas volume; h"
      frequency: "representative tests plus each lot operating logs"
      temporal_coverage: "Same declared production/inventory period including storage and downtime"
      site_scope: "Declared treating plant and accepted lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; supplier/lot records; QA tests; balances; uncertainty; coverage"
    - protocol_id: cp_stock
      process_id: "treatment"
      flow_role: "Per-atomic-row source/stock vectors"
      record_type: "foreground_record"
      raw_fields: "period;lot;SKU;stage;row_id;flow_type;original_amount/unit/form/phase;receipt/outward_time;provider_and_exchange_b;opening/closing_raw/WIP/newFG/oldFG/reusable;firstQ;grossDispatch;original_Qc;Q0;return_prior_outward;idle;cleanup;A_attribution_pool"
      collection_method: "Trace calibrated measurements and receipt/custody/operation/acceptance records per cohort; inventory stocks and carry original provider exchange vectors to the next period. Internal ends have equal amounts/vectors. Keep V and A separate; unknown is not zero."
      unit: "original row units;kg;MJ"
      frequency: "each exchange and opening/closing/first acceptance"
      temporal_coverage: "Complete same period including failure/idle/cleanup/storage"
      site_scope: "Same species/configuration/state/route and supply chain"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, receipts, counts, original provider vectors, event chain and attribution evidence"
    - protocol_id: cp_packaging
      process_id: "treatment"
      flow_role: "Each specific package receipt and every outward leg"
      record_type: "foreground_record"
      raw_fields: "material/form/type;single-use/reusable;direction;item_id;original_amount/unit;receipt;owner/custodian;priorvector;P;N_ext;ER;prior_outward;opening/closing_empty/raw/WIP/FG/reusable;issue/store_return;grossdispatch;externaloutward;waste;contamination;receiver"
      collection_method: "Weigh each component; reconcile actual purchase/loan/rental/entrusted/accompanying receipts and custody. Separately prove first nonpurchase receipts and same-item returns; close each leg vector and stock counts without invented cycles or credits."
      unit: "kg;count is a check only"
      frequency: "each receipt/internal transfer/outward/count"
      temporal_coverage: "Complete same period including unpacking/failure/storage/cleanup"
      site_scope: "Receiving yard/store/process/FG and external owners"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Receipts, same-item outward/return, scales, ownership/custody, prior vector and physical closure"
    - protocol_id: cp_components
      process_id: "treatment"
      flow_role: "Actual anti-splitting clamp and separate scrap"
      record_type: "foreground_record"
      raw_fields: "steel_grade;component_form;supplier_receipt;weighed_mass;opening;closing;installed;trimmed/damaged_scrap;lot;priorvector;installation_stage"
      collection_method: "Weigh individual components and reconcile installation logs. Installed mass enters product net mass; scrap has an independent destination. Whole-component provider occurs once. Actual absence needs evidence."
      unit: "kg"
      frequency: "each receipt/installation/waste consignment/count"
      temporal_coverage: "Same new-production period"
      site_scope: "Actual sleeper and installation stage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Installation bill, supplier, scales and outward receipts"
  calculation_rules:
    - id: net_output
      applies_to: "sleepers_out"
      rule: "B = complete-period first-accepted new whole-sleeper gross mass - measured transport packaging tare, including water/retained preservative/installed components. cp_stock excludes original Qc/purchased FG/same-item repeated acceptance and includes closing_new_FG once. Normalize only for B>0; retain pools for B=0."
      inputs:
        - cp_product
      output: "B"
      source_ids:
        - usda-wood-handbook-2021
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "Normalized exchange = attributable measured lot total / B; B is accepted net impregnated sleeper kg of the same lot. Final product output = B / B = 1 kg. Do not normalize by untreated dry kg, total produced rejects, count or assay-zone volume."
      inputs:
        - cp_product
        - cp_wood
        - cp_solution
        - cp_utilities
        - cp_heat
        - cp_waste
        - cp_air
      output: "exchange unit per kg reference flow"
      source_ids:
        - usda-wood-handbook-2021
    - id: solution_balance
      applies_to: "creosote_in"
      rule: "Net-use diagnostic = opening circulating stock + actual external additions - actual supplier returns - closing circulating stock; preserve raw receipt/return legs and prior vectors separately; the diagnostic is not a second inventory input. Reconcile with mixture retained in accepted wood, treated rejects, exported spent liquid, sludge and adsorbent load, individual emissions and unexplained difference. Retort returns and reused drips cancel internally; do not add total pumping to fresh consumption. Match the same stock period and accepted lots."
      inputs:
        - cp_solution
        - cp_product
        - cp_waste
        - cp_air
      output: "actual mixture kg per kg reference flow"
      source_ids:
        - usda-wood-handbook-2021
        - epa-wood-preserving-1999
    - id: retention_conversion
      applies_to: "creosote_in; sleepers_out"
      rule: "For whole-product total-mixture retention only: retained_mixture_kg = R_pre × V_pre or R_post × V_post, using the corresponding measured solid wood volume before or after treatment in m3 and retention in mixture kg/m3. Normalize retained_mixture_kg / B. A named active/analyte mass uses its own measured mass fraction and stated dry/wet wood basis; sampled-zone retention cannot be extrapolated to the whole tie without independently justified representative-volume and composition conversion."
      inputs:
        - cp_solution
        - cp_product
      output: "retained mixture or named analyte kg per kg reference flow"
      source_ids:
        - usda-wood-handbook-2021
    - id: heat_balance
      applies_to: "heat_in"
      rule: "At the declared supplier interface, determine net thermal service from separately integrated delivered hot-water mass times supply specific enthalpy minus separately integrated returned-water mass times return specific enthalpy, in consistent units. Reconcile every actual other carrier-water inlet/outlet, leakage, loss and thermal storage change on that same boundary and time interval before calling the result delivered net heat; unresolved carrier balance or enthalpy leaves the result unresolved. The shortcut delivered mass × (supply enthalpy - return enthalpy) is valid only when equal delivered and returned masses are demonstrated on that boundary/interval. Divide the supported net heat by B once. Metered electricity MJ = kWh × 3.6; no duplicate purchased heat for electric heating."
      inputs:
        - cp_heat
        - cp_utilities
        - cp_product
        - actual_supply_mass
        - actual_return_mass
        - actual_carrier_state
        - other_mass_heat_legs
        - thermal_stock_change
      output: "MJ per kg reference flow"
      source_ids:
        - epa-wood-preserving-1999
    - id: emission_species
      applies_to: "all elementary output rows"
      rule: "Residual species mass = integral of c_out(t) × gas_volume_rate(t) over the actual operating time, with matched concentration/flow reference conditions and units. Integrate each duration once; a measured mass total is not multiplied by hours again. c_out is after control, so do not apply capture efficiency to it a second time; an inlet-derived estimate needs independently measured capture and disclosure of its different basis. Attribute each source/cohort using cp_stock, then divide by B once. Keep each CAS, phase and source distinct. PAH/VOC aggregate screens are diagnostic only, not extra inventory exchanges. PM2.5, PM2.5–10 and PM>10 are exclusive; derive interval differences from compatible cumulative measurements, never sum total PM10 with PM2.5."
      inputs:
        - cp_air
        - cp_stock
        - cp_product
      output: "individual species or size-interval kg per kg reference flow"
      source_ids:
        - epa-wood-preserving-1999
    - id: physical_balance
      applies_to: "treatment"
      rule: "Reconcile oven-dry wood, water and preservative independently across input stocks, accepted product, rejects, separated wastes and emissions; include inventory changes and internal transfers once. Wood-derived carbon and coal-tar preservative fossil carbon remain separate; no carbon-storage credit or species-independent carbon fraction is assumed. If a route extension includes combustion, retain physical biogenic CO2 in LCI regardless of impact-category accounting."
      inputs:
        - cp_wood
        - cp_solution
        - cp_product
        - cp_waste
        - cp_air
      output: "unallocated physical balances; residuals"
      source_ids:
        - usda-wood-handbook-2021
    - id: stock_vectors
      applies_to: "all inventory rows"
      rule: "Per stage or stock account and source/form/phase/unit V: opening+external_in+internal_in+actual_formation=closing+external_out+internal_out+actual_consumption. external_in/external_out cross the foreground unit boundary; internal_in/internal_out pair equal amounts/vectors within it, including same-state transfers, which are not formation. Whole-unit aggregation cancels matched internal transfers. Pair actual_formation/actual_consumption for real state conversion with withdrawal from the preceding state, without creating conserved mass, adding again to receipts or recording the same conversion also as an internal transfer; cancel these state terms only on the independently reconciled conserved-material basis, retaining actual external losses and nonconserved species changes. Inherited b and new measured burdens form A; A does not rewrite V. firstQ includes closing_new_FG once, separate from grossDispatch/Qc. Unresolved cohorts/pools are not success-only means."
      inputs:
        - cp_stock
        - cp_product
      output: "Exchange physical/burden dual accounts"
      source_ids:
        - usda-wood-handbook-2021
    - id: packaging_balance
      applies_to: "strap_in;strap_out;strap_waste_out;dunnage_in;dunnage_out;dunnage_waste_out"
      rule: "Per component/source: opening_empty/raw/WIP/FG/reusable+P+N_ext+ER=closing_empty/raw/WIP/FG/reusable+each actual externaloutward+waste; match internal issue/store_return. ER needs same-item previous outward; P is actual purchase, N_ext first external nonpurchase. Carry each leg vector, manufacture once, with no new Q/zero burden/credit."
      inputs:
        - cp_packaging
        - cp_stock
      output: "Package original amounts and every leg vector"
      source_ids:
        - usda-wood-handbook-2021
    - id: components
      applies_to: "end_clamp_in;end_clamp_scrap_out;sleepers_out"
      rule: "opening+actual receipt=closing+installed+external scrap; installed enters B once; whole-component provider does not also take a steel provider."
      inputs:
        - cp_components
        - cp_stock
        - cp_product
      output: "Installed and scrap kg"
      source_ids:
        - impregnacia-sleepers
  data_quality_requirements:
    - id: identity
      applies_to: "treatment"
      requirement: "Verify actual product/mixture routes and individual chemical identity/medium/property/unit. Missing exact identities remain unresolved. Species-specific discharge cannot use correction flows, total PAH or neighbouring species."
      evidence: "cp_product; cp_solution; cp_air"
    - id: retention
      applies_to: "sleepers_out"
      requirement: "Document solid-volume before/after state, sample zone, mixture/active/analyte basis, dry/wet wood basis and kg normalization. Full SDS alone may not expose all constituents; disclose missing composition evidence."
      evidence: "cp_solution; cp_product"
    - id: coverage
      applies_to: "treatment"
      requirement: "No default yields, retention, service duration or emission factors. Historic E-rated EPA factors and northern-softwood survey quantities are not industry defaults for sleepers. Document non-detect handling, extra actual species, stock mismatch and uncertainty."
      evidence: "cp_air; cp_solution"
    - id: physical_and_burden
      applies_to: "treatment"
      requirement: "Balance physical mass, water and carbon before burden allocation; equal internal link ends; no multiplication of coproduct physical mass by allocation shares."
      evidence: "cp_wood; cp_solution; cp_waste"
    - id: bilingual
      applies_to: "treatment"
      requirement: "Both languages have the same rows, reference quantity, denominator, collection aggregation, formulas and source IDs. Official Chinese selected names preserve verified UUID identity."
      evidence: "cp_product"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Require positive accepted net output mass, a single final product row linked by sleepers_out, declared product/blank state and species, verified exact reference identity, and all required qualifiers. Check the same kg denominator for every card and protocol in both languages. Reject circular fresh consumption from pumped throughput, undefined retention volume/mass bases, untreated identity for impregnated wood, and unqualified post-treatment oven-loss-as-water conversion."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile all tank and recovery stocks with retained mixture and measured waste/emission loads; flag unexplained differences and missing assay representation. Check phase/species/receiving medium and non-overlapping sources. Do not sum aggregate VOC or PAH with species exchanges, stack inlet with outlet, or captured contamination with residual air release. PM intervals are exclusive. Unknown heat supplier basis, unavailable flow identity or unmeasured relevant source remains incomplete, not zero or passing. Changed actual chemicals, supply grades, direct emissions to water/soil or out-of-scope fuel/steam routes require individually verified extensions before application."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
