measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use accepted net mass after declared draining/storage. Weigh on calibrated scales and subtract measured packaging tare. Maintain separate untreated wood, residual water and retained preservative estimates; do not convert from count using an invented mass."
  - id: denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "accepted net product mass"
      uuid: ""
    required_unit: "kg"
    rule: "Every exchange uses per 1 kg reference flow; collection totals for the same accepted lot are divided by its measured net output mass in kg. Count and wood volume are ancillary, not alternative inventory denominators."
  - id: retention_basis
    applies_to: "creosote_in; sleepers_out"
    required_property_ref:
      name: "mixture mass; analyte mass; sampled wood volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Identify whether retention is gross solution uptake, net solution retention, total creosote mass or a named analyte in a specified assay zone. Record density/temperature and volume basis. Tank uptake cannot be equated to assay-zone kg/m3 or whole-product loading without measured conversion."
  - id: moisture_basis
    applies_to: "wood_in; sleepers_out"
    required_property_ref:
      name: "wood water mass; oven-dry wood mass"
      uuid: ""
    required_unit: "kg"
    rule: "For untreated blanks only, use validated dry-basis moisture measurements. After oil impregnation, oven mass loss can include preservative volatiles; use a validated matrix-specific water assay and separate preservative measurement, never call all oven loss water."
  - id: energy_interface
    applies_to: "electricity_in; heat_in"
    required_property_ref:
      name: "delivered electrical/thermal energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert metered kWh to MJ using 3.6. The selected electricity database property is named Net calorific value but is its MJ energy interface, not combustion of electricity. Purchased hot-water heat requires the supplier boundary and measured supply/return enthalpy; do not infer net delivery from an MJ property alone."
