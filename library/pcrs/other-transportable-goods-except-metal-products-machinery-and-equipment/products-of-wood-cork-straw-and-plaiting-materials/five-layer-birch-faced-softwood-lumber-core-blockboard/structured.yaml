measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference output is 1 kg. Define Q as net accepted panel mass for the same completion cohort from cp_accept; every period exchange q is converted by normalize_reference: q_ref = q / Q. Q must be positive and measured; zero or missing Q leaves absolute amounts unnormalized and validation inconclusive."
  - id: moisture_basis
    applies_to: "unbonded timber and veneers"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record wet mass m and dry-basis moisture u using sampled oven-dry mass; dry wood d = m / (1 + u); water w = m - d. Percentage dry-basis moisture is divided by 100 before use. Do not use a wet-basis fraction in this formula; adhesive-bearing panels/residues need a matrix-valid water method, not automatic oven-loss-as-water. Sources: usda-wood-handbook-2021."
  - id: energy_conversion
    applies_to: "electricity and press heat"
    required_property_ref:
      name: "Net calorific value for the selected electricity identity; heat property remains unresolved"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert electricity 1 kWh = 3.6 MJ; retain the native selected energy property. Heat requires verified delivered enthalpy and compatible property/unit support; never convert gross heat into delivered net heat by relabelling."
  - id: count_volume
    applies_to: "weighed panel lots"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Sum individually measured net masses. Counts or cubic metres are descriptors unless same-lot density at the same moisture and geometry is measured; no manufacturer density range or nominal thickness substitutes for Q."
