              source_ids:
                - usda-wood-handbook-2021
                - unido-panel-adhesives-1977
            ranges: []
allocation_rules:
  - rule_id: a_single_product
    applies_to: "scoped route"
    rule: "The base process has one accepted panel output and exported wastes. Assign its production burdens and required waste treatment to that panel cohort. Waste sale price alone does not prove a co-product. Retain physical residue masses unallocated and apply no avoided-product credit."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: a_multifunction
    applies_to: "genuinely joint production"
    rule: "First subdivide by measured stage/circuit/lot records and isolate panel-specific adhesives and packaging. If a saleable residue is an actual co-product, add its correct product identity, output amount, function and provider/market evidence, then justify causal allocation for only inseparable shared burdens; disclose alternatives and sensitivity. A regional softwood-plywood mass allocation is contextual evidence, not a mandatory rule for this purchased-dry-input hardwood-faced route."
    source_ids:
      - ilcd-handbook-2010
      - corrim-western-plywood-2025
  - rule_id: a_ledgers
    applies_to: "all mass, species and burden accounts"
    rule: "Physical conservation and environmental burden partition are different ledgers. Never multiply panel, water, adhesive or waste physical masses by burden shares. Internal rework retains all earlier material and service burdens, adds actual new service only, and cannot generate extra first-acceptance output."
    source_ids:
      - ilcd-handbook-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_accept
      process_id: "birch_blockboard_manufacture"
      flow_role: "panel and cohort stocks"
      record_type: "foreground_record"
      raw_fields: "panel ID; lot; first acceptance ID/time; net mass; package tare; construction/species; grade; moisture method; new accepted dispatch D; new accepted closing FG F; opening accepted FG; returns/retests/reacceptance; raw/WIP/FG location; original accepted cohort mass"
      collection_method: "Calibrated net weighing after conditioning and grade/bond acceptance; reconcile unique IDs to dispatch and storage, separating newly accepted from previously accepted stock"
      unit: "kg"
      frequency: "Each accepted panel/lot and stock boundary"
      temporal_coverage: "Completion period plus original stock/cohort periods"
      site_scope: "One factory and exact route/configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighing calibration, acceptance tests, species records and ID deduplication"
    - protocol_id: cp_wood
      process_id: "birch_blockboard_manufacture"
      flow_role: "core_timber; face_birch; cross_birch"
      record_type: "foreground_record"
      raw_fields: "supplier and botanical species; harvest origin; treatment and dry state; wet and oven-dry sample masses; dimensions/grain axes; receipts/use/returns; opening/closing raw and WIP stocks; dry wood and water constituents; inherited burden vectors"
      collection_method: "Weigh lot withdrawals and stage transfers; sample unbonded wood separately by species and ply role for validated moisture analysis; trace each sheet to layup"
      unit: "kg"
      frequency: "Every lot and opening/closing stock"
      temporal_coverage: "Same completion period with retained incoming stock history"
      site_scope: "Same plant and lots as cp_accept"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier certificates, sampling method, scales, kiln/start-state evidence and layup records"
    - protocol_id: cp_glue
      process_id: "birch_blockboard_manufacture"
      flow_role: "pvac; uf_mix; pvac_waste; uf_waste"
      record_type: "foreground_record"
      raw_fields: "supplied wet mass; formulation; PVAc versus UF; water/non-water components; actual hardener/filler; batch losses; opening/closing tank/WIP states; interface spread; clamp/press times/temperature/pressure; cure extent; supported water generation G and consumption C; original burdens"
      collection_method: "Weigh whole supplied mixtures separately, reconcile applied/returned/residue masses; supplier composition plus matrix-valid water/volatile analysis. Establish actual same-lot foreground cure G/C by supported stoichiometry with measured reaction extent or validated matched analysis; retain unknown when evidence is absent"
      unit: "kg"
      frequency: "Each glue batch and press lot"
      temporal_coverage: "Completion period plus inherited adhesive/WIP history"
      site_scope: "Same factory and product lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Formulation/SDS, composition analysis, scales, process logs, bond tests and actual cure evidence"
    - protocol_id: cp_energy
      process_id: "birch_blockboard_manufacture"
      flow_role: "electricity; heat; later services on old accepted stock"
      record_type: "foreground_record"
      raw_fields: "circuit/meter; voltage; kWh/MJ; supply/return mass and enthalpy; operating/idle hours; lot/stage; shared services attribution; actual service period; original accepted cohort and original Q; inherited opening/current/closing burden vectors"
      collection_method: "Read non-overlapping meters and reconcile invoices; measure net delivered press heat at named interface. Trace later storage/repacking/rework service to its original accepted cohort, never use current first-acceptance Q for an old cohort"
      unit: "MJ"
      frequency: "Continuous meters; each period and service event"
      temporal_coverage: "Completion period plus service events and original cohort periods"
      site_scope: "Matching plant/interface/supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, time-matched invoices, enthalpy method, voltage and provider compatibility"
    - protocol_id: cp_water
      process_id: "birch_blockboard_manufacture"
      flow_role: "wash_water; wash_effluent"
      record_type: "foreground_record"
      raw_fields: "fresh water mass/volume and density; recycle transfers; wastewater mass; dissolved/solid components; tank opening/closing stocks; destination; embedded adhesive water ownership"
      collection_method: "Meter external water and wastewater, weigh/convert only with measured density; collect compositional analysis and reconcile tanks; exclude internal recirculation from external totals"
      unit: "kg"
      frequency: "Each washing event and period boundary"
      temporal_coverage: "Same lots/period and tank carryover"
      site_scope: "Same plant with named offsite treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters, density/laboratory records and treatment consignment"
    - protocol_id: cp_residue
      process_id: "birch_blockboard_manufacture"
      flow_role: "clean_shavings; bonded_trim; sanding_dust"
      record_type: "foreground_record"
      raw_fields: "stage; wet mass; species; adhesive state; water/dry constituents; captured dust; internal transfers; opening/closing bin stocks; recipient/treatment; original burden history"
      collection_method: "Separate and weigh unglued shavings, bonded trim and collected sanding dust; determine matrix-specific water and dry constituents; reconcile internal rework and offsite manifests"
      unit: "kg"
      frequency: "Each removal/return plus boundary stocks"
      temporal_coverage: "Same completion lots and carryover"
      site_scope: "Same plant and actual waste recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scales, compositional analysis, physical segregation and waste tickets"
    - protocol_id: cp_pack
      process_id: "birch_blockboard_manufacture"
      flow_role: "pe_wrap; abrasive; film_waste; spent_abrasive"
      record_type: "foreground_record"
      raw_fields: "polymer/backing specification; receipt/use/closing stocks; net package tare; replaced abrasive mass; adhered dust; waste route; acceptance cohort; later repacking event"
      collection_method: "Weigh each actual consumable and its losses independently; reconcile rolls/paper stocks; remove adhered-dust overlap; connect packaging placed on old FG to original accepted cohort"
      unit: "kg"
      frequency: "Each lot, changeover and service event"
      temporal_coverage: "Completion and original accepted-cohort periods"
      site_scope: "Exact plant/line and dispatch cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare/weighing records, material specification and waste manifests"
    - protocol_id: cp_emission
      process_id: "birch_blockboard_manufacture"
      flow_role: "formaldehyde_air; methanol_air; dust_air; water_vapour"
      record_type: "foreground_record"
      raw_fields: "emission species/compartment; stack flow; inlet/outlet concentrations; time; capture efficiency; fugitive method; detection limit; condensation/retained mass; water-specific method; actual cure G/C; operating state"
      collection_method: "Integrate measured post-control concentration times matched gas volume and operating time, add non-overlapping fugitive mass and retain uncertainty. Resolve water separately from non-water volatiles and adhesive reactions; no generic VOC, chamber-test or softwood survey factor substitutes"
      unit: "kg"
      frequency: "Representative campaign covering actual steady/startup/idle states, reconciled to complete period"
      temporal_coverage: "Same completion lots and stocks"
      site_scope: "Factory air releases; treatment external"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Accredited method, full test conditions, detection limits, operating coverage and reconciliation"
  calculation_rules:
    - id: unique_acceptance
      applies_to: "panel"
      rule: "Q = D + F, counting each newly accepted panel once at first acceptance; D is newly accepted dispatched mass and F is newly accepted closing finished-goods mass. Previously accepted opening FG, its dispatch, returns, retests, reacceptance and rejected/unaccepted WIP do not enter Q. D and F must be disjoint sets of unique first-acceptance IDs; a dispatch followed by return cannot count in both. A return does not create a new acceptance. Retain the original net accepted mass on that ID. Reconcile to unique net weighed first-acceptance IDs, not sales or all warehouse movements."
      inputs:
        - D
        - F
        - cp_accept
      output: "Q in kg"
      source_ids:
        - ilcd-handbook-2010
    - id: normalize_reference
      applies_to: "every current-cohort exchange"
      rule: "q_ref = q / Q; q is the actual exchange amount attributed to the same completed accepted cohort after stock and service reconciliation. Q is measured by cp_accept; Q > 0 is required. Retain kg/kg or MJ/kg as applicable; missing/zero Q leaves q absolute and result inconclusive."
      inputs:
        - q
        - Q
        - cp_accept
        - "linked collection protocol"
      output: "q_ref per 1 kg reference panel"
      source_ids:
        - ilcd-handbook-2010
    - id: old_cohort_service
      applies_to: "later services on previously accepted FG"
      rule: "s_ref,c = s_c / Q_c_original; s_c is measured later service assigned only to original accepted cohort c. Preserve the original accepted mass Q_c_original and earlier burdens even if only some stock is dispatched now. Never divide by current Q, remaining stock or dispatch mass. If original Q is missing/zero, retain unnormalized service and block completeness."
      inputs:
        - s_c
        - Q_c_original
        - cp_accept
        - cp_energy
        - cp_pack
      output: "Original-cohort added service vector"
      source_ids:
        - ilcd-handbook-2010
    - id: stock_conservation
      applies_to: "each stage and factory boundary"
      rule: "Opening physical mass + external receipts + internal receipts = external outputs + internal transfers + closing mass, with all outputs including panel, residues and emissions. Internal transfers cancel once on factory aggregation. Maintain dry wood by species, adhesive constituents, H2O, fossil/biogenic C and measured uncertainty; internal reactions conserve total mass/elements, not necessarily individual species. Never force an unknown residual into emissions."
      inputs:
        - cp_wood
        - cp_glue
        - cp_water
        - cp_residue
        - cp_emission
        - cp_accept
      output: "Auditable unallocated physical and elemental ledgers"
      source_ids:
        - usda-wood-handbook-2021
    - id: water_species
      applies_to: "actual H2O balance"
      rule: "H2O_open + H2O_external_in + G_H2O = H2O_external_out + H2O_close + C_H2O at aggregated boundary. Include timber/veneer/adhesive/product/waste water and actual evaporation; G/C are actual foreground reaction terms supported by cp_glue, not assumed zero, complete cure or generic resin synthesis. Upstream adhesive synthesis is not a second foreground term. Missing G/C or matrix-valid water data leaves this check inconclusive."
      inputs:
        - cp_glue
        - cp_wood
        - cp_water
        - cp_emission
        - cp_residue
      output: "Water balance and explicit unresolved terms"
      source_ids:
        - unido-panel-adhesives-1977
        - usda-wood-handbook-2021
    - id: inherited_vectors
      applies_to: "raw/WIP/FG and services"
      rule: "B_open + B_receipts + B_current_services = B_transferred + B_exported + B_close separately for each original material/service component. Carry prior embodied burdens through WIP and FG; add actual current services only once. Distinguish sold old FG from newly accepted current FG; unaccepted closing WIP retains its burdens instead of loading all current expense into Q."
      inputs:
        - "All protocols"
        - "stage/cohort transfer records"
      output: "Reconciled environmental burden vector"
      source_ids:
        - ilcd-handbook-2010
    - id: electricity_units
      applies_to: "electricity"
      rule: "MJ = 3.6 × kWh, then attribute by actual circuit/cohort and apply normalize_reference or old_cohort_service as appropriate."
      inputs:
        - cp_energy
        - "Q or Q_c_original"
      output: "MJ/kg for correct cohort"
      source_ids:
        - ilcd-handbook-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and inputs"
      requirement: "Prove each outer/crossband botanical species and origin, strip-core construction, axes and actual adhesive state. Common names, generic database labels and manufacturers' example variants do not prove a supplier lot."
      evidence: "cp_wood; cp_glue; cp_accept; jrc-european-birch-2016; paged-blockboard-2026"
    - id: dq_coverage
      applies_to: "quantities and period"
      requirement: "Use a declared contiguous period representative of the actual route with beginning/end stocks and linked older cohorts; justify coverage and uncertainty rather than impose an invented year/volume threshold. Missing data, zero, non-detect and evidence-backed not-applicable states remain distinct."
      evidence: "Every protocol and primary source records"
    - id: dq_chemistry
      applies_to: "physical/species checks"
      requirement: "Preserve supplied wet mixtures, separate physical mass from burden allocation, measure relevant water/volatile constituents and actual UF cure terms. A measured total loss or generic resin reaction cannot close an individual-species account."
      evidence: "cp_glue; cp_emission; cp_residue"
    - id: dq_linkage
      applies_to: "upstream and treatment"
      requirement: "Flow identity does not prove provider compatibility. Verify actual property, reference unit/group, geography, date, moisture, voltage, supplied-mixture composition, waste adhesive state and recipient; keep unavailable bindings unresolved."
      evidence: "Complete native records plus supplier/treatment evidence"
validation_rules:
  - rule_id: v_scope
    applies_to: "target product"
    rule: "Reject incompatible layer count, core, veneer species, tropical/unknown faces, adhesive formulation route or heat boundary; require all reference qualifiers. A manufacturer's generic birch variant is insufficient proof of botanical lot identity."
    source_ids:
      - paged-blockboard-2026
      - jrc-european-birch-2016
  - rule_id: v_basis
    applies_to: "all exchanges"
    rule: "Require measured unique-first-acceptance Q and consistent q/Q for the current cohort; check old-service/Q_c_original separately. Q=0, unknown Q or unknown original Q gives unnormalized records and inconclusive completeness, never zero impacts. Opening accepted FG, returns and retests must not increase Q."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: v_balance
    applies_to: "mass, water and burdens"
    rule: "Check physical total/elemental and species balances separately, including raw/WIP/FG and inherited service vectors. Account for actual cure G/C and measurement uncertainty; do not repair missing chemistry by guessed water emissions or erase prior-period burdens."
    source_ids:
      - usda-wood-handbook-2021
      - unido-panel-adhesives-1977
  - rule_id: v_inventory
    applies_to: "each native exchange"
    rule: "Require one atomic exchange per card; check actual Product/Waste/Elementary type, native reference property and complete unit-group conversion, supplier state and environmental compartment. Resolve missing reference/other UUIDs and providers before operational dataset use; report checks performed, skipped and unresolved separately."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: v_release_scope
    applies_to: "interpretation"
    rule: "Factory process data and foreground check results do not establish scientific approval, structural compliance, an EPD, acceptable indoor-air performance or whole-life environmental superiority. No independent review or publication status is implied by a projection/check pass."
    source_ids:
      - paged-blockboard-2026
      - epa-plywood-2002
published_dataset_profile:
  dataset_role: "Foreground manufacturing unit-process dataset for the specifically qualified unfinished five-layer birch-faced strip-core panel."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Assemble an explicitly scoped supplier-compatible cradle-to-gate model using matched upstream material/energy and treatment datasets; downstream furniture/joinery models retain this gate/state."
  excluded_use: "Whole-leaf classification coverage, conifer/tropical-faced or all-veneer substitution, structural claims, use-phase/chamber emissions, whole-life comparisons and universal density/recipe/factor defaults."
  required_metadata: "All reference qualifiers; stage/cohort/stock lineage; native flow/property/unit and provider identities; method boundary; actual test/measurement evidence; allocation and normalization equations; missing terms."
  required_quality_disclosure: "Foreground-only versus assembled boundary; unknown reference/other UUIDs or providers; actual coverage/uncertainty/detection limits; botanical/chemistry gaps; scientific and translation review status."
  update_trigger: "Changes in botanical supply, core/ply geometry, supplied adhesive formulation, voltage/heat source, measurement/stock/cohort basis, waste destination, native identity or new relevant evidence."
data_sources:
  - id: "paged-blockboard-2026"
    type: "literature"
    reference: "PAGED Plywood S.A., Paged Blockboard technical data sheet, 1 April 2026, pp.1–3; https://pagedplywood.com/wp-content/uploads/2026/04/20260401_TDS_Paged-Blockboard_EN.pdf"
    used_for: "Actual solid-softwood-strip core with two birch/alder or pine veneer layers each side, unfinished non-structural product. Only birch subset used; no numeric performance, botanical supplier identity, recipe or factory inventory transferred."
  - id: "paged-blockboard-2020"
    type: "literature"
    reference: "PAGED, Paged Blockboard product specification sheet, February 2020; https://www.pagedplywood.com/wp-content/uploads/2020/08/Paged_Blockboard_ProductSpecificationSheet_022020.pdf"
    used_for: "Historical manufacturer corroboration of five-layer solid core and birch outer variant; same manufacturer is not an independent second source. No species/recipe/factor inference."
  - id: "jrc-european-birch-2016"
    type: "official_guidance"
    reference: "Beck, Caudullo, de Rigo and Tinner, European Atlas of Forest Tree Species, 2016, pp.70–73, Betula pendula, Betula pubescens and other birches in Europe; https://forest.jrc.ec.europa.eu/media/atlas/Betula_spp.pdf"
    used_for: "Botanical broadleaved European birch context; lot identity and harvest origin still need supplier evidence. No tree-to-panel quantity transfer."
  - id: "unido-panel-adhesives-1977"
    type: "official_guidance"
    reference: "UNIDO ID/WG.248/9, Industrial application and formulation of synthetic resin adhesives in the wood based panel industry, 10 October 1977, section2.2 printed p.15 and section3.1; https://downloads.unido.org/ot/47/90/4790807/00001-10000_07656.pdf"
    used_for: "Historical PVAc strip-edge gluing versus thermosetting skin bonding context; not proof of current supplier formulation, use rate, cure extent or performance."
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282, 2021, chapters4,10,11; https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Unbonded-wood moisture basis and composite/adhesive/ply context; composite oven loss is not universally water, and no density/yield/cure factor is adopted."
  - id: "epa-plywood-2002"
    type: "official_guidance"
    reference: "US EPA AP-42 section10.5 Plywood Manufacturing, January2002, pp.10.5-1–4; https://www.epa.gov/sites/default/files/2020-10/documents/c10s05.pdf"
    used_for: "Qualitative UF interior bonding, pressing, finishing, extraction and emission-source questions. Broader plywood process includes upstream routes outside this dry-input boundary; no numerical recipe, press setting or emission factor adopted."
  - id: "ilcd-handbook-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for Life Cycle Assessment—Detailed guidance, first edition March2010, section7.9; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and transparent multifunctionality; foreground stock/cohort protocols implement auditable physical and burden accounting, not an official factory default."
  - id: "corrim-western-plywood-2025"
    type: "literature"
    reference: "CORRIM, Life Cycle Assessment of Softwood Plywood Production—Western Region, edited22July2025, section3.2.6; https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Western-Plywood-Report-Final-07222025.pdf"
    used_for: "Counterexample of regional softwood integrated-route mass allocation and product-specific packaging; not direct evidence for this route's factors, density, yields, adhesive recipe or mandatory allocation."
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version3.0, 30June2025 explanatory notes and current subclass31423/parent3142; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/31423"
    used_for: "Classification title and contradictory solely-veneer explanatory wording; preserves bounded classification uncertainty, no official correction inferred."
