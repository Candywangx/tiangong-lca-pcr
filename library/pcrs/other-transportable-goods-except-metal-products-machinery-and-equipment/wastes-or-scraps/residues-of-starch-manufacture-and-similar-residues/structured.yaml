system_boundary:
  rules:
    - rule_id: boundary_start
      applies_to: "declared starting condition"
      rule: "Start at a measured separated-potato-pulp handover. Cultivation, potato receiving/washing/rasping and starch-component separation belong to the supplying system. Link its real dataset and boundary, joint-product allocation, separation state and residual burden vector once. Do not repeat the whole starch process or silently cut it off."
      source_ids:
        - efisc-starch-processing-2014
        - ilcd-allocation-2010
        - alfa-laval-starch
        - oecd-potato-2020
    - rule_id: boundary_scope
      applies_to: "qualifying route and actual exceptions"
      rule: "Use single-origin potato starch pulp supplied fresh after verified mechanical dewatering. Exclude ensiled/fermented pulp, dried pellets, blended feed, added molasses/condensed juice, peels, puree, whole potatoes, gluten and fermentation dregs from qualifying Q. If an excluded operation actually occurred, retain every physical flow and burden and fail the qualifying-route claim; do not erase it by a scope label."
      source_ids:
        - akv-pulp-datasheet-2024
        - efisc-starch-processing-2014
    - rule_id: boundary_complete
      applies_to: "all included operations"
      rule: "Include real receipt, transfer, screening where present, dewatering where required, weighing, sampling, temporary storage, covering, loading, actual delivery, cleaning, rework, maintenance material and residual management. Record start/stop, idle, failed trials, zero-output campaigns, spills and unauthorised work that occurred. Add each newly identified actual material, carrier, waste and chemical emission as an individual flow before claiming completeness."
      source_ids:
        - efisc-starch-processing-2014
    - rule_id: boundary_physical_gates
      applies_to: "manufacturing and FG gates"
      rule: "Keep grossV physical crossings, inherited environment vector A, genuine co-function allocation and sole Q separate. Complete manufacturing, FG-service and combined physical gates with opening/closing WIP and FG. Cancel internal transfers only with paired endpoints of the same material state and lot; carry both physical quantities and inherited vectors. Economic or service shares never scale actual product, water, waste or emission masses."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_liquid
      applies_to: "dewatering and return interface"
      rule: "Measure each actual liquid outlet with water, suspended solids, solubles and recoverable starch evidence. Whole liquid and constituent assays are non-additive. Separate actual recovery from losses. A paired water return to starch manufacture is not new intake or wastewater. Do not fit both unknown moisture loss and unknown solids loss using one residual, and do not declare all water difference evaporation."
      source_ids:
        - efisc-starch-processing-2014
        - akv-pulp-datasheet-2024
    - rule_id: boundary_energy
      applies_to: "energy and thermal interfaces"
      rule: "Keep each energy carrier separate. Wet mechanical dewatering does not establish drying combustion, a boiler, steam or heat demand. If actual hot water, steam or other thermal service exists, add its real supply mass, pressure/temperature/phase, enthalpy basis, supply energy and external condensate/return-water agreement as one consistent carrier ledger. Do not duplicate heat MJ and boiler fuel; do not invent a water return."
      source_ids:
        - efisc-starch-processing-2014
    - rule_id: boundary_delivery
      applies_to: "first release and delivery"
      rule: "Q is the first quality-release quantity, not net sales or dispatch. Conforming closing FG is already included in Q. Preserve all actual subsequent storage, covering, handling and delivery in a separate lot service ledger. Opening FG keeps its historical burden; returns reverse the original delivery and preserve original release status. Add real incremental rework F; subtract X only for proved same-side duplicate entries."
      source_ids:
        - ilcd-allocation-2010
        - akv-pulp-datasheet-2024
    - rule_id: boundary_article
      applies_to: "each packaging or reusable article"
      rule: "For each actual cover or packaging article reconcile opening empty stock plus attached WIP/FG stock plus purchases plus external returns received = closing empty/attached stock plus sheets leaving with gross physical shipments plus external returns sent plus waste. Internal reuse cancels. Keep article and adhered-product masses separately and do not put packaging in Q or assign a default coproduct credit."
      source_ids:
        - akv-pulp-datasheet-2024
        - ilcd-allocation-2010
boundary_abstraction:
  declared_starting_condition: "Whole pulp stream from an actual potato starch line at the separated-wet-pulp handover; distinguish already dewatered from unde-watered state and inherit burdens up to that point"
  starting_condition_role: "Material and burden interface into residual-product foreground; not a zero-burden cut-off for cultivation or starch manufacture"
  product_classification_scope: "This fresh wet mechanically dewatered potato pulp within 39130; not all starch residues"
  recursive_input_rule: "Purchased same-category dewatered pulp is one upstream product and burden input; include only real additional conditioning without repeating the starch route; internal returns cancel only at paired endpoints"
  upstream_dataset_requirement: "Real supplier cultivation and joint starch-process dataset, period/geography/technology, cofunctions, actual allocation and handover state; missing information remains unresolved rather than zero"
  disclosure: "Declare starting condition, separate manufacturing and FG gates, Q, every required qualifier, actual receiver and service gates, burden vintages, stocks/allocation, unbound identities and background compatibility"
