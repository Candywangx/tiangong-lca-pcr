  calculation_rules:
    - id: wet_solids
      applies_to: "each material assay"
      rule: "DM_s = wet_s × dm_fraction_s; water_s = wet_s × moisture_fraction_s; independently verify measurements and solids destinations; main and assay ledgers are non-additive."
      inputs:
        - wet_s
        - dm_fraction_s
        - moisture_fraction_s
        - cp_pulp_recovery
        - cp_pulp_dewatering
        - cp_pulp_release
        - cp_liquid_dewatering
        - cp_liquid_cleaning
      output: "DM_s; water_s"
      source_ids:
        - efisc-starch-processing-2014
        - akv-pulp-datasheet-2024
    - id: first_release_q
      applies_to: "sole production gate"
      rule: "Q = Σ newly_first_released_net_wet_lot_mass; use historical flags and count first release of each whole lot once; include qualifying closing FG and exclude opening already released FG, duplicates and packaging."
      inputs:
        - newly_first_released_net_wet_lot_mass
        - cp_release
        - cp_fg
      output: "Q"
      source_ids:
        - akv-pulp-datasheet-2024
        - ilcd-allocation-2010
    - id: physical_gate
      applies_to: "manufacturing and FG physical gates"
      rule: "opening_physical_stock + actual_physical_in = closing_physical_stock + actual_physical_out; independently reconcile whole streams, dry solids, water and relevant elements with actual reactions and gas transfers; combine only after paired internal flows cancel."
      inputs:
        - opening_physical_stock
        - actual_physical_in
        - closing_physical_stock
        - actual_physical_out
        - cp_pulp_recovery
        - cp_pulp_dewatering
        - cp_pulp_release
        - cp_fg
        - cp_liquid_dewatering
        - cp_liquid_cleaning
        - cp_emission_cleaning
        - cp_emission_delivery
      output: "grossV_ledger"
      source_ids:
        - efisc-starch-processing-2014
    - id: assemble_numerator
      applies_to: "each environmental exchange numerator"
      rule: "A_j = opening_unreleased_WIP_vector_j + actual_new_attributed_load_j + genuine_incremental_F_j - closing_unreleased_WIP_vector_j - proved_same_side_duplicate_X_j; first convert actual units, assign dedicated loads and apply evidenced common-process allocation; preserve failed/cleanup loads. actual_new_attributed_load_j excludes rework already entered separately as F_j, so each incremental burden is entered once. This manufacturing numerator subtracts only closing unreleased WIP/hold burdens; never subtract newly released closing FG because its first release is already in Q. Roll older released FG and its actual delivery services in the separate vintage ledger; only current-release-cohort services enter the corresponding numerator."
      inputs:
        - opening_unreleased_WIP_vector_j
        - actual_new_attributed_load_j
        - genuine_incremental_F_j
        - closing_unreleased_WIP_vector_j
        - proved_same_side_duplicate_X_j
        - cp_fg
        - cp_pulp_recovery
        - cp_pulp_dewatering
        - cp_pulp_release
      output: "A_j"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_once
      applies_to: "all inventory results"
      rule: "result_j = numerator_j / Q; execute once only; numerator_j is tagged either grossV physical numerator or A_j environmental numerator and these ledgers are non-additive. Output per1 kg reference flow only for Q>0; for Q=0 retain stocks, loads and inherited attribution without a per-unit result. H is not another denominator; cards and protocols only reference this result."
      inputs:
        - numerator_j
        - Q
        - cp_release
      output: "result_j"
      source_ids:
        - ilcd-allocation-2010
    - id: service_stock
      applies_to: "FG services and returns"
      rule: "opening_FG + current_first_release + external_returns_received = closing_FG + gross_dispatch + actual_FG_discards + other_verified_external_out; reconcile original-delivery reversals, water loss and actual reactions by vintage; attribute services separately without adding Q."
      inputs:
        - opening_FG
        - current_first_release
        - external_returns_received
        - closing_FG
        - gross_dispatch
        - actual_FG_discards
        - other_verified_external_out
        - cp_fg
      output: "FG_service_ledger"
      source_ids:
        - ilcd-allocation-2010
        - akv-pulp-datasheet-2024
    - id: cover_stock
      applies_to: "each cover article"
      rule: "opening_empty_and_attached + purchases + external_returns_received = closing_empty_and_attached + gross_shipped_articles + external_returns_sent + waste_articles; internal reuse cancels, adhering pulp uses a non-additive bridge; never enter Q."
      inputs:
        - opening_empty_and_attached
        - purchases
        - external_returns_received
        - closing_empty_and_attached
        - gross_shipped_articles
        - external_returns_sent
        - waste_articles
        - cp_packaging
      output: "cover_ledger"
      source_ids:
        - akv-pulp-datasheet-2024
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: source_identity
      applies_to: "source and route"
      requirement: "Primary product originals and independent process/method evidence support each claim; distinguish original acquisition from current reuse/extraction; retain complete page context and counterexamples, never present abstracts as full text."
      evidence: "original version; page locator; scope of use"
    - id: batch_quality
      applies_to: "qualifying wet endpoint"
      requirement: "Trace lot net wet mass, dry matter or moisture, foreign matter, hygiene, storage/transport time and receiving criteria; ordinary future quantity collection is distinct from absence of a core product."
      evidence: "real lot and receiver records"
    - id: inventory_integrity
      applies_to: "physical and burden ledgers"
      requirement: "Independent per-gate per-flow reconciliation, unit conversions, shares and uncertainty are evidenced; physical stock and inherited vector roll separately; residuals never replace species evidence."
      evidence: "measurements; stocks; burden vintages; allocation mechanisms"
    - id: native_provider
      applies_to: "native flow and provider"
      requirement: "Review native hard identity, reference property/unit support and background provider compatibility separately; never insert an unverified UUID; distinguish genuine no-match from actual query failure."
      evidence: "complete native object and exact chain; unresolved list"
    - id: scientific
      applies_to: "evidence and approval"
      requirement: "Industrial sources do not establish LCA allocation; preserve every endpoint or methodological gap without inferring approval."
      evidence: "independent method evidence and applicability limits"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference lot"
    rule: "Verify potato botanical origin, starch-manufacturing separation, actual mechanical-dewatering state, fresh wet supply, nonfermentation, nonblending and declared cattle-feed receiving use. Reject a flow selected only by name or classification; inspect every native basename, synonym/comment, CAS, route, state, source, media, geography and property before UUID adoption. Missing native evidence remains explicit and no adjacent product substitutes for it."
    source_ids:
      - un-cpc-2025
      - akv-pulp-datasheet-2024
      - efisc-starch-processing-2014
  - rule_id: validation_release
    applies_to: "Q and quality"
    rule: "Require net wet weighing with tare and calibrated scale records, batch dry-matter/moisture and foreign-matter results, applicable hygiene and receiver time/storage acceptance. Q counts each whole lot first release once including qualifying closing FG; exclude opening released FG, repeat inspection, internal transfer and all packaging. No numerical moisture, safety, storage-time or nutrient threshold is invented."
    source_ids:
      - efisc-starch-processing-2014
      - ilcd-allocation-2010
  - rule_id: validation_completeness
    applies_to: "all physical gates"
    rule: "Independently close whole wet-mass, dry-solids, water and relevant elemental accounts at manufacturing, FG and combined gates within documented measurement uncertainty. Preserve reaction water versus free water and actual gas phase changes where reactions occur. Do not use one residual to solve two unknowns, water density for another material, or aggregate pollution indicators as named molecular masses."
    source_ids:
      - efisc-starch-processing-2014
      - ilcd-allocation-2010
  - rule_id: validation_burdens
    applies_to: "numerator and stocks"
    rule: "Retain each lot physical stock separately from its inherited environmental vector. Reconcile actual new F, documented same-side duplicates X, failed/idle/cleanup loads, opening/closing WIP and FG, returns and real incremental rework. Missing historical burdens or common-process attribution are unresolved, not zero. Physical and environmental ledgers are never added together."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validation_once
    applies_to: "normalization"
    rule: "Collection protocols retain unnormalized raw observations and convert their real units or rates before allocation and the single calculation-stage division by Q. H is only the observation interval. Already integrated gas/liquid volumes are not multiplied by duration again. Q=0 preserves loads and stocks without a per-unit result; state subsequent inheritance explicitly."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validation_interface
    applies_to: "cross-system and native evidence"
    rule: "Require declared supplier/site/time/technology and compatibility for every background provider separately from flow identity. Verify each selected flow against a complete authoritative record and its reference-property, unit-group and reference-unit chain. Archived support records establish only their retained identities and units, not current platform availability or product/provider compatibility. Keep dataset versions in supporting evidence, not PCR UUIDs. Unverified UUIDs remain absent."
    source_ids:
      - efisc-starch-processing-2014
      - ilcd-allocation-2010
  - rule_id: validation_report
    applies_to: "data package disclosure"
    rule: "Report checks performed, skipped and unresolved separately; preserve full native restrictions and all required qualifiers in usable metadata and flow descriptions. A schema or finite measurement pass is not scientific, translation, mapping or publication approval. A real route, terminal or methodological evidence gap prevents a qualified dataset claim."
    source_ids:
      - efisc-starch-processing-2014
      - ilcd-allocation-2010
  - rule_id: validation_service_scope
    applies_to: "manufacture versus receiver gate"
    rule: "Report the first-release manufacturing result separately from storage/delivery service increments by release cohort. Closing released stock counts in Q but does not establish completed delivery. Disclose unfinished delivery coverage and its outstanding burdens; do not claim a complete receiver-gate result until the corresponding cohort services are reconciled. Never add old-cohort services to current manufacturing Q."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Fresh wet potato starch-pulp supply data only when identity/state and receiving use fit; future supplier/site data still require collection"
  allowed_use: "Actual supply of the same route/state; transparent upstream interface and separate delivery-service ledger; evidenced non-additive dry-basis reporting"
  excluded_use: "Dry-feed or nutrient-function substitution; ensiling/drying/blending routes; replacement for starch/gluten manufacture; automatic zero burden or recovery credit; unrestricted generic-residue data"
  required_metadata: "potato species and single botanical feedstock; named starch manufacturer and site; separation and handover gate; actual received and supplied dewatering state; mechanical technique and whether already upstream; fresh wet and unfermented status; absence of molasses or juice or feed blending; declared cattle-feed receiving use and contract; product or Waste status and real destination; lot net wet mass and tare; lot dry matter or moisture; foreign matter and applicable hygiene acceptance; actual maximum holding and transport time; storage and covering conditions; first whole-lot quality release gate and history; reference period H and Q; opening and closing WIP and FG; gross delivery and return identities; packaging and reusable-stock basis; upstream vector and joint-process allocation interface; geography and technology and supplier compatibility; native flow identity and property support gaps"
  required_quality_disclosure: "raw measurement/sampling; supplier compatibility; physical stock and burden vintages; allocation rationale/sensitivity; missing UUID/property support; unresolved data and methodological limitations"
  update_trigger: "Changes in botanical/manufacturing origin, mechanical technique, wet/dry state, blending/fermentation, receiving use, hygiene/time limits, common-process allocation, supplier, packaging or native flow"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "UN Statistics Division. CPC Version 3.0 structure and Explanatory Notes, 30 June 2025, pp.103–104 and199–200. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context: 39130 versus cereal-milling residues 39120; starch/gluten 23220; prepared feed 23319; brewing/distilling residues39160. Classification is not product approval."
  - id: "akv-pulp-datasheet-2024"
    type: "literature"
    reference: "AKV. AKV KARTOFFELPULP DATABLAD–2024, 27 March2024, complete single page. https://www.akv.dk/media/pppmhwpc/datablad-pulp-2024.pdf"
    used_for: "Primary mechanically dewatered potato-starch pulp identity; fresh cattle-feed use; covering and seasonal variability; ensiling counterexample. Typical composition and feeding values are not defaults or functional equivalences."
  - id: "akv-pulp-investment-2024"
    type: "literature"
    reference: "AKV. AKV-NYT No.1 2024, Kampagnen og nye investeringer, PDFp.2/printedp.1. https://www.akv.dk/media/4rgnoath/akv-nyt-marts-2024.pdf"
    used_for: "Primary commercial-specification and pulp-decanter context; low-solids and water-use variation. Announced investment is not proof of completed installation; humus dewatering is distinct."
  - id: "efisc-starch-processing-2014"
    type: "official_guidance"
    reference: "Starch Europe/EFISC. European Guide to good practice, sector reference document on safe feed materials from starch processing, v3.1, November2014, PDFpp.8–10,13–17,46. https://food.ec.europa.eu/document/download/18f5bf7d-217f-459b-9751-2ecffe8808f4_en"
    used_for: "Independent sector identity and process diagrams: pulp after separation, mechanical dewatering, distinct drying/protein/juice branches; bulk storage/load-out hazards. Diagrams are examples, not standardized plant designs; no allocation factor or site performance is inferred."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, §§7.9.2–7.9.3, printedpp.255–265/PDFpp.275–285. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and virtual subdivision; exchange-specific determining physical causality; remaining common-process allocation using actual same-gate state and market value. Not industrial pulp identity, feed safety, composition or a numerical allocation factor."
  - id: "alfa-laval-starch"
    type: "literature"
    reference: "Alfa Laval. The all-round choice for starch equipment: solutions for processing starch, PDF p.10, Starch from tubers. https://www.alfalaval.nl/globalassets/documents/industries/food-dairy-and-beverage/starch-and-sweetener/solutions-for-processing-starch.pdf"
    used_for: "Primary equipment-maker process context separates fibre pulp, starch and fruit water; dewatered pulp livestock-feed pathway. No machine configuration, quantities, installation or present-day sector performance inferred."
  - id: "oecd-potato-2020"
    type: "official_guidance"
    reference: "OECD. Revised Consensus Document on Compositional Considerations for New Varieties of Potato, ENV/JM/MONO(2020)37, Figure 3 and paragraph 18, p.19. https://one.oecd.org/document/ENV/JM/MONO%282020%2937/en/pdf"
    used_for: "Institutional process context distinguishes pulp dewatering from recovery of coagulated fruit-water protein. Does not establish this supplier, batch safety, composition or numerical inventory."
