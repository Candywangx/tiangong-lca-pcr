allocation_rules:
  - rule_id: allocation_direct
    applies_to: "attributional model"
    rule: "Declare an attributional inventory with no assumed substitution or avoided-feed credit. Identify each dedicated pulp operation and use real or virtual subdivision to assign its own materials, energy and residual-treatment burden directly. A cheap feed coproduct is not automatically burden-free."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "remaining genuinely common exchanges"
    rule: "For each still-common exchange test the determining physical causal relationship to starch, pulp, protein, solubles and any other actual function. Record the mechanism, independently measured variables, scope and why the relationship determines this exchange. A mass, dry-matter, protein or energy fraction by itself is not causality; different exchanges may require different drivers."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "only unresolved common process burden"
    rule: "Only for the genuine remainder after subdivision and exchange-specific causality, use contemporaneous representative market values of actual cofunctions at the common process gate in their actual state and quantity. Derive comparable gate values by removing product-specific downstream transport, packaging and conditioning when required. Preserve real price evidence, time variation, uncertainty and sensitivity. Do not prescribe a fixed pulp share or freely choose physical versus economic allocation."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_upstream
    applies_to: "supplier handover"
    rule: "Receive one transparent upstream burden vector for each pulp lot, including cultivation and the actual common starch process and its reviewed allocation scope. Reuse a compatible supplying starch-method dataset as the interface rather than repeat its manufacture. If allocation information is missing, retain an unresolved dataset gap and do not substitute zero; do not reallocate already allocated upstream pulp burdens in the foreground."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_status
    applies_to: "product versus Waste"
    rule: "Determine usable coproduct versus discarded Waste using actual specification, receiver contract, intended and actual use, applicable legal status, disposal obligation and supplier allocation method. A price, feed destination or the word waste alone is insufficient. Keep rejected lots and wastewater in the physical ledger and use their real treatment interfaces; no default recovery, disposal or substitution credit."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_services
    applies_to: "FG and delivery services"
    rule: "Attribute storage, handling and transport to the actual serviced lots and capacity constraints using meters and demonstrated service causality. Preserve old/new and returned-lot burden vintages. Product cofunction allocation acts on common environmental burden only, never on gross wet mass, packaging counts, physical stocks or gross transport service."
    source_ids:
      - ilcd-allocation-2010
