  scope_decision: Source-traced Seattle single-family residential residual garbage to first accepted delivery at
    North Transfer Station tipping floor; narrower than CPC39910. Whole mixture is not source-separated paper/metals,
    incinerator ash, collection service or landfill treatment.
  deduplication: 'Current accepted cpc-3.0-to-pcr mapping and material pcr-index inspected at baseline ac917d4bfb426fd3ae9b638d64fe34d343ff67ed:
    no municipal-waste id or accepted 39910 edge. Adjacent paper/metal scrap, sewage/clinical/chemical wastes and
    recovery products have distinct origins and material states; no accepted id reused.'
  core_holds:
  - No compatible native Product reference for the declared whole household material at North first acceptance.
    Native municipal candidates are Waste flows or landfill routes; Mixed domestic refuse additionally specifies
    employee amenities at collection handover. Reference identity and study qualification remain unresolved.
  classification_decision: Accepted narrower association under docs/adr/2026-11-22-accept-cpc-39910-single-family-residual-garbage-at-north-station-receipt.md.
  unresolved_reference_product_flow:
    row_id: finished_garbage
    identity: Mixed Seattle single-family residential residual garbage at North Transfer Station receipt
    reason: Native Product material identity remains unresolved; leave reference UUID and output UUID blank.
  native_identity_limits: 'Public native versions independently read: Diesel fuel 01.01.003, Polyethylene bag 01.01.002,
    particulate matter 01.00.001, adopted ILCD elementary flows 03.00.004. Exact official Chinese baseName matched.
    Conditional material/species identity only, no provider, technology or numeric factor adoption.'
  foreground_requirements: Collect actual original formation and approved sign/value responsibility method, every
    raw quantity and stock vector, source qualification and acceptance. These are concrete-data completeness requirements,
    not invented site measurements. Core reference hold is distinct from ordinary auxiliary/provider gaps.
  normalization: Raw quantities undivided; actual conversion and allocation form A; c_normalize performs A/Q once.
    First accepted Q includes closingFG; later services keep original Qc and measured H, no new Q.
  physical_receipts: P is true purchased first physical receipt. N_ext includes every first non-purchased supplier-accompanying/entrusted/borrowed/rented
    receipt. ER requires real original external shipment. Each actual event has specific material/form/type/direction
    and measured atomic row/interface; missing actual interface is incomplete data. Ownership, cohort, vector and
    genuine incremental service are separate. Complete same-component same-gate closure includes P+N_ext+ER in all
    normative groups.
