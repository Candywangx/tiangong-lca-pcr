    applies_to: "all numerator rows"
    required_property_ref:
      name: "actual row property"
      uuid: ""
    required_unit: "row native unit"
    rule: "Retain raw units and measured state; convert before allocation and A/Q. Count × measured empty-unit mass is allowed only for the same actual bag/cart configuration. No default density or per-item kg."
