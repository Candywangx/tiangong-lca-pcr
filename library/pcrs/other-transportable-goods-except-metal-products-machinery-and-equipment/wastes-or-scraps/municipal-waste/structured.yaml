    required_unit: "kg"
    rule: "Q is unique first accepted net as-received garbage. For each trip reconcile weighing times, actual loading/unloading, acceptance and documented vehicle fuel/water/non-cargo changes. Paired gross_in minus gross_out already cancels the vehicle and containers or rejected material remaining aboard at both weighings. Correct documented non-cargo changes, then deduct only actually unloaded operational containment and actually unloaded non-target/rejected net masses already included in the difference, each once. Never deduct retained return loads again. Original discarded constituent packaging stays in the mixture. Closing released FG is already in Q."
