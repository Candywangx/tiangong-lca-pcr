allocation_rules:
  - rule_id: a_goal
    applies_to: "allocation requiring attributional studies"
    rule: "This method is attributional only where the study goal requires allocation. Declare signed actual market status, responsibilities and the receiving function at each handover. The city tariff shows a treatment fee context but is not proof of the signed value of a particular lot. The native reference flow type and legal waste status are separate facts."
    source_ids:
      - spu-rates
      - ilcd-2010
  - rule_id: a_history
    applies_to: "original generation and waste handovers"
    rule: "Obtain the original formation and the approved burden/responsibility method with exchange-specific inherited vectors. Annex14.4 distinguishes positive-value coproducts from negative-value waste and the actual step producing a valuable secondary good. Do not assign the whole preceding household-product history, assume all history zero, erase the first system responsibility, apply indefinite recycling formulas to mixed refuse, or invent a secondary product at this reception gate. Retain carried and responsibility-only vectors with their owners once; unresolved core responsibility prevents a usable unit result."
    source_ids:
      - ilcd-2010
  - rule_id: a_subdivide
    applies_to: "shared collection and receiving"
    rule: "First directly meter dedicated routes/operations and subdivide identifiable subprocesses, including receiving versus later treatment and recycling-building streams. Use documented virtual subdivision for exclusively attributable exchanges. Original whole mixed garbage remains one mixture; analytical partitions are not coproducts."
    source_ids:
      - ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For each genuinely remaining exchange determine and substantiate its determining physical causality separately. Route fuel, compaction work, space-time storage and actual reception can have different drivers. Record actual loaded mass, route distance, stop/operating time, occupied capacity and control state as relevant; never apply one arbitrary physical or economic key across all exchanges."
    source_ids:
      - ilcd-2010
  - rule_id: a_residual
    applies_to: "only unresolved residual common process"
    rule: "Only if specific physical causality cannot determine the remaining exchange use documented contemporaneous market values at the same actual process gate and condition, excluding later transport/packing/treatment. For the applicable negative-value crossing case use Annex14.4 sign/absolute-fee logic at the real crossing process, not a negative allocation factor, a current city tariff or assumed composition value. Require coherent denominators, sensitivity and review; no fixed percentages, substitution or avoided-disposal credit."
    source_ids:
      - ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_lot
      process_id: "supply"
      flow_role: "whole garbage and first accepted output"
      record_type: "weighbridge and origin records"
      raw_fields: "event_id; household_source; catchment; route; cohort; generation_time; collection_time; arrival_time; inspection; acceptance_time; gross_in; gross_out; unit; containment_tare; net_garbage; rejected_mass; opening_WIP; closing_WIP; opening_FG; closing_FG"
      collection_method: "Match calibrated inbound/outbound scale tickets to the same vehicle/load and observed unloading and acceptance; remove separately added operational containment tare. Collect whole discard/handover and every rejection independently. Preserve undivided raw mass and units."
      unit: "Reconcile calibrated inbound/outbound tickets, their times, actual loaded/unloaded and reloaded masses and acceptance for the same trip/cohort. Record non-cargo vehicle changes; deduct only actually unloaded operational containment and unloaded non-target/rejected mass included in the paired difference, once. Retained return containers/rejections already cancel. Collect whole-discard handover and each rejection independently as undivided raw quantities in original units."
      frequency: "each handover and truckload"
      temporal_coverage: "complete declared campaign including overnight/failed loads"
      site_scope: "households; collection route; North Transfer Station receiving floor"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; ticket pairs; load inspection; original-holder trace"
    - protocol_id: cp_exchange
      process_id: "supply"
      flow_role: "specific supplied or removed exchange"
      record_type: "meter stock and supplier record"
      raw_fields: "row_id; event_id; material_form; direction; quantity_raw; unit_raw; temperature; pressure; moisture; density_measured; density_method; opening; received; closing; external_out; loss; vehicle; operation; provider; included_scope"
      collection_method: "Independently meter/weigh each named utility, formulation or liquid; retain original units, all start/idle/cleanup/failure periods and measured state. For volume-to-mass use that substance/state density; no water density for oil or leachate. Collect raw undivided values."
      unit: "kg; MJ; original metered unit"
      frequency: "every receipt/use/removal and meter interval"
      temporal_coverage: "same complete campaign including failures and Q0"
      site_scope: "actual household/vehicle/receiving meter point"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; stock reconciliation; supplier scope; formulation/SDS"
    - protocol_id: cp_components
      process_id: "supply"
      flow_role: "one specific bag/cart/component and event direction"
      record_type: "component custody ledger"
      raw_fields: "component_id; row_id; event_id; material; form; supplied_type; direction; ownership; original_cohort; purchase_flag; first_external_receipt_flag; P; N_ext; ER; prior_outward_id; grossS; EO; W; empty_open; attached_WIP_open; attached_FG_open; reusable_open; empty_close; attached_WIP_close; attached_FG_close; reusable_close; measured_mass; measured_count; empty_unit_mass_method; provider_included_scope; inherited_exchange_vector; incremental_service"
      collection_method: "Weigh each actual component/event separately or use measured count and measured empty mass of the same configuration. Verify procurement P, first nonpurchase N_ext or true ER against physical custody and prior external dispatch. Cover supplier-accompanying and first entrusted/borrowed/rented goods. Preserve separate atomic receipt interfaces; missing actual material/form/type/direction is incomplete data, never fill by cloning the whole lot. Collect undivided mass."
      unit: "kg; measured count for supporting reconciliation"
      frequency: "every physical custody event and stock boundary"
      temporal_coverage: "whole campaign and opening/closing cohort history"
      site_scope: "same component and physical custody gate across households/contractor/receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed custody receipt; scale/count records; original shipment; ownership; full BOM; provider-scope reconciliation"
    - protocol_id: cp_species
      process_id: "supply"
      flow_role: "one actual species and destination"
      record_type: "species-resolved measurement"
      raw_fields: "row_id; source_id; molecule; CAS; carbon_origin; direction; medium; subcompartment; measured_mass; concentration; concentration_basis; gas_liquid_volume; volume_is_integrated; rate; interval; temperature; pressure; humidity; control_state; detection_limit; uncertainty; actual_absence_evidence; provider_included_scope"
      collection_method: "Measure each species and its own destination before the receiving gate, using calibrated species analysis plus integrated carrier volume or an integrated rate where appropriate. Keep instrument concentration basis/state and detection limits. Odour, COD and NOx-equivalent remain indicators. No invented decay, stoichiometry or generic default factor. Raw quantities remain undivided."
      unit: "kg; original concentration/volume/rate units"
      frequency: "each real event and representative operating state"
      temporal_coverage: "full storage/collection/receiving campaign including idle and cleanup"
      site_scope: "actual exhaust/fugitive/drainage measurement point"
      aggregation_rule: "per reference flow"
      quality_evidence: "instrument QA; analysis; state conversion; independent mass/element closure; uncertainty"
    - protocol_id: cp_history
      process_id: "supply"
      flow_role: "original formation and stock burdens"
      record_type: "genealogy and inherited vector"
      raw_fields: "cohort; source_formation; approved_method; signed_market_status; responsibility_owner; exchange_id; inherited_vector; supplier_included_scope; opening_WIP_mass; opening_WIP_vector; closing_WIP_mass; closing_WIP_vector; opening_FG_mass; opening_FG_vector; closing_FG_mass; closing_FG_vector; original_Qc; reverse_delivery; rework_increment; evidence_id"
      collection_method: "Trace actual discard origin and approved waste-responsibility handover, each exchange’s carried vector and each stock cohort. Preserve responsibility-only accounts separately from the material burden. Do not presume whole original consumer-product burdens or zero burdens. Raw vectors and masses are not normalized again."
      unit: "kg; each inherited exchange original unit"
      frequency: "every cohort and period boundary"
      temporal_coverage: "history needed to reconcile current period plus all current activity"
      site_scope: "original holder through declared receiving gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "approved method record; signed status/value; source trace; stock and inherited-vector ledger"
    - protocol_id: cp_service
      process_id: "supply"
      flow_role: "original-cohort incremental service"
      record_type: "cohort service event"
      raw_fields: "event_id; original_Qc; cohort; H; operation; physical_gate; physical_component; P; N_ext; ER; prior_outward_id; inherited_vector; actual_increment; supplier_scope; internal_transfer"
      collection_method: "Collect real post-release storage/handling/rental/return/washing/repair activity as undivided service totals against the original Qc. H describes actual duration, never the production denominator. Component receipts still need their atomic physical event and cp_components closure; internal transfer is eliminated on consolidation."
      unit: "h; original exchange unit; kg Qc"
      frequency: "each service event"
      temporal_coverage: "actual original-cohort service life"
      site_scope: "actual responsible contractor or owner"
      aggregation_rule: "per reference flow"
      quality_evidence: "service log; original release; custody and scope reconciliation"
    - protocol_id: cp_allocation
      process_id: "supply"
      flow_role: "remaining common exchange"
      record_type: "allocation evidence"
      raw_fields: "exchange_id; dedicated_operation; subdivision; virtual_subdivision; physical_causal_driver; measured_driver; shared_total; assigned_total; residual; common_gate; condition; contemporaneous_value; sign; justified_key; sensitivity"
      collection_method: "Identify dedicated operations first, then determine each remaining exchange’s physical cause. Only genuine residual uses same-gate same-condition actual value after documented justification. Retain original totals and assigned vectors without division by Q."
      unit: "each exchange native unit and documented driver"
      frequency: "each allocation period and changed route"
      temporal_coverage: "same campaign and matching market period"
      site_scope: "actual common process gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter split; causal model; price/status records; sensitivity; independent review"
  calculation_rules:
    - id: c_q
      applies_to: "finished_garbage"
      rule: "For each trip t, D_t is gross_in_t minus gross_out_t corrected for documented non-cargo vehicle changes between weighings. Q = sum_t(D_t - C_unloaded_t - R_unloaded_t) for unique first-accepted lots. C_unloaded is operational containment actually unloaded and already in D; R_unloaded is actual unloaded non-target/rejected mass already in D. Deduct each mass once. Retained/returned-on-vehicle containers or rejected material already cancel from D; never deduct again. Reconcile unloading, any reloading, physical handover and acceptance against both tickets and times. Previously accepted redeliveries and reinspection create no new Q; closing accepted FG is already in Q."
      inputs:
        - cp_lot
        - cp_components
        - cp_history
      output: "Q"
      source_ids:
        - epa-transfer-2002
        - spu-features
        - spu-rates
    - id: c_units
      applies_to: "all measured exchanges"
      rule: "Convert original measured units first. Confirm the recorded unit: 1 US short ton = 2,000 lb av = 907.18474 kg, 1 lb av = 0.45359237 kg, and 1 metric tonne = 1,000 kg. Verify any unspecified ton. Integrate only rates; integrated volume remains volume. For a specific liquid mass = integrated volume × independently measured density at that liquid state. For electricity kWh to MJ uses the exact factor 3.6; this does not define supply geography or energy technology."
      inputs:
        - cp_exchange
        - cp_species
        - cp_lot
        - cp_components
      output: "converted raw exchange amounts"
      source_ids:
        - epa-transfer-2002
    - id: c_attributable
      applies_to: "each inventory numerator"
      rule: "A_e = B_WIP_open_e + assigned_new_e + assigned_increment_e - B_WIP_close_e, in exchange e’s own unit. B denotes the verified inherited per-exchange vector attached to that WIP cohort; assigned_new and assigned_increment are converted and actually allocated undivided activity with supplier-included scope removed only when genuinely duplicated. Form A for each exchange from verified converted raw activity, actual dedicated/shared allocation and applicable opening/closing WIP inherited vectors; retain all failures, rejects, Q0, idle and cleanup. Keep physical gross material closure independent from this burden equation. Carry already accepted FG by original cohort without charging its manufacture again; post-release service uses its actual original Qc account."
      inputs:
        - "converted raw exchange amounts"
        - cp_history
        - cp_allocation
        - cp_service
      output: "A"
      source_ids:
        - ilcd-2010
    - id: c_normalize
      applies_to: "all inventory numerator rows"
      rule: "For Q > 0: a = A / Q once. A is the attributable undivided exchange amount in its own unit; Q is uniquely first-accepted net garbage in kg. a is that exchange unit per 1 kg reference flow. Collection protocols and inventory cards reuse this one result; no second division. With Q = 0 preserve A and report no unit value. Original-cohort services first use their original Qc; consolidate transfers without creating Q."
      inputs:
        - A
        - Q
        - cp_history
        - cp_service
      output: "a"
      source_ids:
        - ilcd-2010
    - id: c_component_balance
      applies_to: "each operational component at the same physical gate"
      rule: "opening_k + P_k + N_ext_k + ER_k = closing_k + grossS_k + EO_k + W_k. Opening/closing cover empty, attached WIP, attached FG and reusable stocks. P is actual purchased first receipt; N_ext is actual non-purchased first external receipt; ER is true return with prior outward history. Internal warehouse/WIP/FG issues/reuse cancel. Verify each real event’s specific material/form/type/direction interface and measured mass before closure; an unknown is not zero."
      inputs:
        - cp_components
        - cp_service
      output: "component physical closure and missing-interface findings"
      source_ids:
        - epa-transfer-2002
        - ilcd-2010
    - id: c_mass_species
      applies_to: "whole material and physical outlets"
      rule: "Independently reconcile opening garbage + actual new discard/receipts + measured additions = closing garbage + gross external garbage movement + separated actual liquid/solid/species outlets. Treat new operational containment on its own component balance; never add analytical composition partitions to whole garbage. Account actual air uptake and water/species transfers where evidenced; reject a fitted residual used for multiple unknowns."
      inputs:
        - cp_lot
        - cp_exchange
        - cp_species
        - cp_components
      output: "physical mass and independent element closure"
      source_ids:
        - epa-transfer-2002
        - ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "whole lot and each auxiliary"
      requirement: "Trace household origin, catchment, actual route, receiver specification and native identity restrictions; do not generalise this subset to all CPC39910 or all Seattle station material."
      evidence: "original-holder and receiver records; full native identity"
    - id: dq_measurement
      applies_to: "all physical events"
      requirement: "Calibrated mass/energy/species records and state-specific conversions; preserve units, detection limits and uncertainty; sampling partitions reconcile without addition to whole mass."
      evidence: "calibration; tickets; samples; independent mass/element balances"
    - id: dq_completeness
      applies_to: "entire campaign"
      requirement: "Keep failures/rejects/Q0/startstop/idle/cleanup/rework, all stock changes and full component P/N_ext/ER interfaces. Missing actual component receipt or species path remains incomplete, never a future selector, cloned lot or assumed zero."
      evidence: "event and stock registers; missing-interface report"
    - id: dq_burden
      applies_to: "each inherited exchange and service"
      requirement: "Keep original source method, sign/value responsibility, owner/cohort vectors and supplier-included scopes; test duplicate charges. Service H and original Qc stay distinct."
      evidence: "approved responsibility method; inherited vector; allocation and provider audit"
    - id: dq_time
      applies_to: "all source and foreground records"
      requirement: "Match actual campaign, current receiver rules and supply geography; disclose generic versus site-specific evidence and actual measurement gaps. Design capacities and fees are not default quantities."
      evidence: "dated operations and source register"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and native identities"
    rule: "Require actual source, complete native formal name/type/route/form/CAS/geography/grade/comments and all flow-property restrictions. Accept no Waste or collection/incineration/landfill service as a Product material reference. A classification label alone cannot establish compatibility. An unresolved core reference is a genuine hold; ordinary auxiliary/provider gaps stay specific."
    source_ids:
      - un-cpc3-2025
      - epa-transfer-2002
      - ilcd-2010
  - rule_id: v_basis
    applies_to: "Q and inventory"
    rule: "Require exactly one first receiving acceptance per physical cohort; Q is net accepted as-received garbage excluding operational containment. Closing accepted FG already belongs to Q and is not added again to output. Reconcile all opening/closing WIP and FG with exchange-specific inherited vectors; gross physical movement is not A burden or new Q. With Q=0 retain all real loads and no per-unit result."
    source_ids:
      - epa-transfer-2002
      - ilcd-2010
  - rule_id: v_normalization
    applies_to: "all numerator rows"
    rule: "Raw protocols collect undivided amounts; convert original units/states and allocate before forming attributable A. Calculation c_normalize performs A/Q once. Cards and protocol aggregation only reference that same result, never divide it again. Reject duplicate provider/foreground combustion and duplicate whole-mixture/constituent burdens."
    source_ids:
      - ilcd-2010
  - rule_id: v_component_events
    applies_to: "each bag/container/attachment"
    rule: "Require every actual P, N_ext and ER event to have one specific atomic material/form/type/direction row or complete measurement interface and measured quantity; P/N_ext/ER mutually exclusive. Verify prior outward history for ER. At the same component/gate verify opening+P+N_ext+ER=closing+grossS+EO+W, including empty/attached-WIP/attached-FG/reusable stocks. Internal issues/reuse cancel. Missing real interfaces make the concrete data package incomplete; no purchase UUID on waste or invented return, copied whole lot, ownership waiver or zero-burden shortcut."
    source_ids:
      - epa-transfer-2002
      - ilcd-2010
  - rule_id: v_vectors
    applies_to: "contract and cohort services"
    rule: "For each physical event independently reconcile owner, original cohort, supplier-included scope, per-exchange inherited vector and actual incremental rental/return/washing/repair service. Apply the same event/balance rules to own and contracted operations. Opening inventories never substitute current first physical receipts; retain one burden charge and the original Qc for services, not H or new Q."
    source_ids:
      - ilcd-2010
  - rule_id: v_physics
    applies_to: "physical mass and species"
    rule: "Independently close garbage, packaging, liquids, fuel/combustion and relevant C/H/O/N/S/metal balances with measured state and uncertainty. Separate free/inherent/evaporated/reaction water, actual species and outlets; no biochemical conversion without evidence. Integrated volumes are not multiplied by time again; only rates are integrated. Density is substance/state-specific. COD, NOx-equivalent and odour are not chemical masses; one residual cannot determine two unknowns."
    source_ids:
      - epa-transfer-2002
      - ilcd-2010
  - rule_id: v_acceptance
    applies_to: "concrete data completeness"
    rule: "Check actual receiver inspection, excluded-material routing and origin segregation rather than infer legal/nonhazardous acceptance. Preserve failures, missing measurements, true zeros and all Q0/idle/cleanup activity. No known-composition or safe-acceptance assertion from a national mixture or UUID comment."
    source_ids:
      - epa-transfer-2002
      - spu-garbage
      - spu-north
      - spu-rates
  - rule_id: v_sources
    applies_to: "evidence and use"
    rule: "Preserve full source scope, original conditions, adjacent counterexamples and uncertainties. Official route evidence does not establish a measured lot; native identity evidence is not a method factor. No methodology, translation or publication approval follows from mechanical checks."
    source_ids:
      - spu-composition-2020
      - spu-plan-2022
      - spu-feis-2025
      - epa-transfer-2002
      - ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Only a qualified whole mixed household-garbage material handover at the same receiving gate and responsibility convention"
  allowed_use: "Origin/gate-compatible material linkage after actual data completeness, core reference resolution and independent methodological review"
  excluded_use: "Collection/treatment-service equivalence; incineration/landfill factors; source-separated material supply; national-average composition; safe/legal acceptance; zero burden or recycling-credit default"
  required_metadata: "All reference qualifiers; physical lot and receipt-gate identity; responsibility method; native restrictions; original cohort stock/vector ledgers; provider scope; atomic P/N_ext/ER interfaces"
  required_quality_disclosure: "Generic-source versus site evidence; actual campaign coverage; uncertainty; missing atomic exchanges; core holds; no implied scientific/translation approval"
  update_trigger: "Changed source catchment, diversion, receiver gate/criteria, signed value/responsibility, truck/fuel, container/supply scope or native identity"
data_sources:
  - id: "un-cpc3-2025"
