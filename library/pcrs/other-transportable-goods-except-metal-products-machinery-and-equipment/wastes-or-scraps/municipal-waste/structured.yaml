system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "all routes"
      rule: "Use only source-traced Seattle single-family residential residual garbage, with actual catchment, household origin, route and lot records. Exclude commercial, multifamily, self-haul, street-sweeping and construction/demolition loads; exclude clinical/pharmaceutical waste, hazardous/chemical specialist waste, industrial feed, sewage sludge, source-separated paper/plastic/glass/metal/food/yard streams, incinerator ash and treatment-service references. Mixed or uncertain origin requires actual acceptance evidence, not a blanket non-hazardous claim."
      source_ids:
        - un-cpc3-2025
        - un-cpc3-2026
        - wco-hs38-2022
        - epa-transfer-2002
        - spu-garbage
        - spu-north
    - rule_id: b_chain
      applies_to: "supply chain"
      rule: "Trace original discard formation and history; include household set-aside/storage, operational containment, actual collection/lifting and on-board compaction, route travel and attributable return/empty movement, weighing, queueing, inspection, tipping and first receiving acceptance at North Transfer Station. Include actual losses, leaks, rejects, failures, starts/stops, idle, cleanup and rework. This is a transparent synthesis of official source and general engineering guidance, not a measured Seattle SKU or factory inventory."
      source_ids:
        - epa-transfer-2002
        - spu-garbage
        - spu-north
        - spu-features
        - spu-trucks
        - spu-rates
    - rule_id: b_gate
      applies_to: "receiving gate"
      rule: "The selected terminal is first accepted delivery on the North Transfer Station tipping floor at 1350 N34th St, Seattle, after inspection and reconciled weighbridge records. Do not extend the terminal into station consolidation, outbound transfer, rail haul, landfill, incineration or biological treatment. Any necessary intermediate operation before this gate remains included. Shared station intake services are subdivided from downstream treatment."
      source_ids:
        - spu-plan-2022
        - spu-feis-2025
        - epa-transfer-2002
        - spu-north
        - spu-features
        - spu-rates
    - rule_id: b_atomic
      applies_to: "all exchanges"
      rule: "Each real exchange requires its own specific material/form/type/direction row and measured quantity or validated source-specific measurement interface before a concrete data package is complete. The named conditional rows do not assert occurrence. Add every other actual fuel, formulation, detergent, container, attachment, replacement component, refrigerant, waste outlet and emitted species atomically. An absent interface is a specific incomplete-data finding; symbols, generic families, copied entire lots and fictitious purchases/returns cannot fill it."
      source_ids:
        - epa-transfer-2002
    - rule_id: b_components
      applies_to: "each operational packaging/container component"
      rule: "For each actual component k at one physical custody gate collect opening empty/attached-WIP/attached-FG/reusable stocks, purchased first receipts P_k, non-purchased first external receipts N_ext_k and true return receipts ER_k. Close opening_k + P_k + N_ext_k + ER_k = closing_k + grossS_k + EO_k + W_k. P, N_ext and ER are mutually exclusive. N_ext includes supplier accompanying goods and first entrusted/borrowed/rented receipts. ER requires prior external dispatch history; opening stock cannot replace current receipts. Internal warehouse/WIP/FG issues and internal reuse cancel. Count newly added physical sources only once on the same side; never duplicate an existing term."
      source_ids:
        - epa-transfer-2002
        - ilcd-2010
    - rule_id: b_custody_burden
      applies_to: "components and contract services"
      rule: "Physical receipts do not decide ownership or environmental burden. Keep owner, original cohort, actual supplier-included scope and the inherited vector for each exchange separately. First non-purchased receipt is not a new purchase or a return and does not imply free burden. Genuine return retains its original burden; actual incremental rental, return transport, washing or repair services are separate and charged once to the serviced cohort. No new Q, automatic credit or second manufacture. Contracted collection and plant supply use the same physical-receipt interfaces and closure as own operations."
      source_ids:
        - ilcd-2010
    - rule_id: b_premix
      applies_to: "whole garbage"
      rule: "Whole premix mass and origin/composition partitions are non-additive. Original discarded consumer packaging belongs to the garbage mixture; newly added operational bag/cart mass is separately tared and accounted. Do not repurchase constituent paper/plastic/glass/food or charge a whole provider plus the same included constituent providers. No national-average composition, density, moisture, DOC, methane yield, recycling rate or avoided credit is supplied."
      source_ids:
        - epa-transfer-2002
        - spu-garbage
        - ilcd-2010
    - rule_id: b_services
      applies_to: "released cohorts"
      rule: "Post-gate services are a separately disclosed extension, excluded from the first-receipt product result. Keep all real storage/handling/dispatch/reinspection/return/rework services after first release in the original accepted cohort Qc ledger. H is measured service duration, not a new production denominator. Transfer service burdens to the same cohort once; a consolidated study cancels internal reference quantities and transfers. Re-delivery and reinspection never manufacture Q again."
      source_ids:
        - ilcd-2010
