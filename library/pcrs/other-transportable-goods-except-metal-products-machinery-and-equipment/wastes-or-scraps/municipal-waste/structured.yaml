          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_identity | reference and native identities | Require actual source, complete native formal name/type/route/form/CAS/geography/grade/comments and all flow-property restrictions. Accept no Waste or collection/incineration/landfill service as a Product material reference. A classification label alone cannot establish compatibility. An unresolved core reference is a genuine hold; ordinary auxiliary/provider gaps stay specific. | un-cpc3-2025; epa-transfer-2002; ilcd-2010 |\n| v_basis | Q and inventory | Require exactly one first receiving acceptance per physical cohort; Q is net accepted as-received garbage excluding operational containment. Closing accepted FG already belongs to Q and is not added again to output. Reconcile all opening/closing WIP and FG with exchange-specific inherited vectors; gross physical movement is not A burden or new Q. With Q=0 retain all real loads and no per-unit result. | epa-transfer-2002; ilcd-2010 |\n| v_normalization | all numerator rows | Raw protocols collect undivided amounts; convert original units/states and allocate before forming attributable A. Calculation c_normalize performs A/Q once. Cards and protocol aggregation only reference that same result, never divide it again. Reject duplicate provider/foreground combustion and duplicate whole-mixture/constituent burdens. | ilcd-2010 |\n| v_component_events | each bag/container/attachment | Require every actual P, N_ext and ER event to have one specific atomic material/form/type/direction row or complete measurement interface and measured quantity; P/N_ext/ER mutually exclusive. Verify prior outward history for ER. At the same component/gate verify opening+P+N_ext+ER=closing+grossS+EO+W, including empty/attached-WIP/attached-FG/reusable stocks. Internal issues/reuse cancel. Missing real interfaces make the concrete data package incomplete; no purchase UUID on waste or invented return, copied whole lot, ownership waiver or zero-burden shortcut. | epa-transfer-2002; ilcd-2010 |\n| v_vectors | contract and cohort services | For each physical event independently reconcile owner, original cohort, supplier-included scope, per-exchange inherited vector and actual incremental rental/return/washing/repair service. Apply the same event/balance rules to own and contracted operations. Opening inventories never substitute current first physical receipts; retain one burden charge and the original Qc for services, not H or new Q. | ilcd-2010 |\n| v_physics | physical mass and species | Independently close garbage, packaging, liquids, fuel/combustion and relevant C/H/O/N/S/metal balances with measured state and uncertainty. Separate free/inherent/evaporated/reaction water, actual species and outlets; no biochemical conversion without evidence. Integrated volumes are not multiplied by time again; only rates are integrated. Density is substance/state-specific. COD, NOx-equivalent and odour are not chemical masses; one residual cannot determine two unknowns. | epa-transfer-2002; ilcd-2010 |\n| v_acceptance | concrete data completeness | Check actual receiver inspection, excluded-material routing and origin segregation rather than infer legal/nonhazardous acceptance. Preserve failures, missing measurements, true zeros and all Q0/idle/cleanup activity. No known-composition or safe-acceptance assertion from a national mixture or UUID comment. | epa-transfer-2002; spu-garbage; spu-north; spu-rates |\n| v_sources | evidence and use | Preserve full source scope, original conditions, adjacent counterexamples and uncertainties. Official route evidence does not establish a measured lot; native identity evidence is not a method factor. No methodology, translation or publication approval follows from mechanical checks. | spu-composition-2020; spu-plan-2022; spu-feis-2025; epa-transfer-2002; ilcd-2010 |\n\n"
