          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_goal | allocation requiring attributional studies | This method is attributional only where the study goal requires allocation. Declare signed actual market status, responsibilities and the receiving function at each handover. The city tariff shows a treatment fee context but is not proof of the signed value of a particular lot. The native reference flow type and legal waste status are separate facts. | spu-rates; ilcd-2010 |\n| a_history | original generation and waste handovers | Obtain the original formation and the approved burden/responsibility method with exchange-specific inherited vectors. Annex14.4 distinguishes positive-value coproducts from negative-value waste and the actual step producing a valuable secondary good. Do not assign the whole preceding household-product history, assume all history zero, erase the first system responsibility, apply indefinite recycling formulas to mixed refuse, or invent a secondary product at this reception gate. Retain carried and responsibility-only vectors with their owners once; unresolved core responsibility prevents a usable unit result. | ilcd-2010 |\n| a_subdivide | shared collection and receiving | First directly meter dedicated routes/operations and subdivide identifiable subprocesses, including receiving versus later treatment and recycling-building streams. Use documented virtual subdivision for exclusively attributable exchanges. Original whole mixed garbage remains one mixture; analytical partitions are not coproducts. | ilcd-2010 |\n| a_causality | remaining shared exchanges | For each genuinely remaining exchange determine and substantiate its determining physical causality separately. Route fuel, compaction work, space-time storage and actual reception can have different drivers. Record actual loaded mass, route distance, stop/operating time, occupied capacity and control state as relevant; never apply one arbitrary physical or economic key across all exchanges. | ilcd-2010 |\n| a_residual | only unresolved residual common process | Only if specific physical causality cannot determine the remaining exchange use documented contemporaneous market values at the same actual process gate and condition, excluding later transport/packing/treatment. For the applicable negative-value crossing case use Annex14.4 sign/absolute-fee logic at the real crossing process, not a negative allocation factor, a current city tariff or assumed composition value. Require coherent denominators, sensitivity and review; no fixed percentages, substitution or avoided-disposal credit. | ilcd-2010 |\n\n"
