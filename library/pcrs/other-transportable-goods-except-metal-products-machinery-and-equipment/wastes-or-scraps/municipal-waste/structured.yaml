          offset: 14055
          line: 95
          column: 1
      markdown: "## 5. System Boundary\n\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual mixed household residual discard at its original formation/handover; retain source burden/responsibility and storage history |\n| starting_condition_role | Declared physical entry and historical responsibility interface, not a zero-burden cutoff |\n| product_classification_scope | Narrow household residual subset of CPC39910, not sewage sludge or waste-treatment services |\n| recursive_input_rule | Same whole-garbage inputs retain actual lot/cohort and per-exchange history; internal recirculation cancels; no automatic new purchase or Q |\n| upstream_dataset_requirement | One compatible source/history vector with actual provider-included scope; constituent assays are non-additive; independently justify allocation and signed responsibility |\n| disclosure | Source catchment, original formation, actual gate, exclusions, all physical and burden ledgers, failed/Q0 activity, uncertainty and concrete incomplete interfaces |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_scope | all routes | Use only source-traced Seattle single-family residential residual garbage, with actual catchment, household origin, route and lot records. Exclude commercial, multifamily, self-haul, street-sweeping and construction/demolition loads; exclude clinical/pharmaceutical waste, hazardous/chemical specialist waste, industrial feed, sewage sludge, source-separated paper/plastic/glass/metal/food/yard streams, incinerator ash and treatment-service references. Mixed or uncertain origin requires actual acceptance evidence, not a blanket non-hazardous claim. | un-cpc3-2025; un-cpc3-2026; wco-hs38-2022; epa-transfer-2002; spu-garbage; spu-north |\n| b_chain | supply chain | Trace original discard formation and history; include household set-aside/storage, operational containment, actual collection/lifting and on-board compaction, route travel and attributable return/empty movement, weighing, queueing, inspection, tipping and first receiving acceptance at North Transfer Station. Include actual losses, leaks, rejects, failures, starts/stops, idle, cleanup and rework. This is a transparent synthesis of official source and general engineering guidance, not a measured Seattle SKU or factory inventory. | epa-transfer-2002; spu-garbage; spu-north; spu-features; spu-trucks; spu-rates |\n| b_gate | receiving gate | The selected terminal is first accepted delivery on the North Transfer Station tipping floor at 1350 N34th St, Seattle, after inspection and reconciled weighbridge records. Do not extend the terminal into station consolidation, outbound transfer, rail haul, landfill, incineration or biological treatment. Any necessary intermediate operation before this gate remains included. Shared station intake services are subdivided from downstream treatment. | spu-plan-2022; spu-feis-2025; epa-transfer-2002; spu-north; spu-features; spu-rates |\n| b_atomic | all exchanges | Each real exchange requires its own specific material/form/type/direction row and measured quantity or validated source-specific measurement interface before a concrete data package is complete. The named conditional rows do not assert occurrence. Add every other actual fuel, formulation, detergent, container, attachment, replacement component, refrigerant, waste outlet and emitted species atomically. An absent interface is a specific incomplete-data finding; symbols, generic families, copied entire lots and fictitious purchases/returns cannot fill it. | epa-transfer-2002 |\n| b_components | each operational packaging/container component | For each actual component k at one physical custody gate collect opening empty/attached-WIP/attached-FG/reusable stocks, purchased first receipts P_k, non-purchased first external receipts N_ext_k and true return receipts ER_k. Close opening_k + P_k + N_ext_k + ER_k = closing_k + grossS_k + EO_k + W_k. P, N_ext and ER are mutually exclusive. N_ext includes supplier accompanying goods and first entrusted/borrowed/rented receipts. ER requires prior external dispatch history; opening stock cannot replace current receipts. Internal warehouse/WIP/FG issues and internal reuse cancel. Count newly added physical sources only once on the same side; never duplicate an existing term. | epa-transfer-2002; ilcd-2010 |\n| b_custody_burden | components and contract services | Physical receipts do not decide ownership or environmental burden. Keep owner, original cohort, actual supplier-included scope and the inherited vector for each exchange separately. First non-purchased receipt is not a new purchase or a return and does not imply free burden. Genuine return retains its original burden; actual incremental rental, return transport, washing or repair services are separate and charged once to the serviced cohort. No new Q, automatic credit or second manufacture. Contracted collection and plant supply use the same physical-receipt interfaces and closure as own operations. | ilcd-2010 |\n| b_premix | whole garbage | Whole premix mass and origin/composition partitions are non-additive. Original discarded consumer packaging belongs to the garbage mixture; newly added operational bag/cart mass is separately tared and accounted. Do not repurchase constituent paper/plastic/glass/food or charge a whole provider plus the same included constituent providers. No national-average composition, density, moisture, DOC, methane yield, recycling rate or avoided credit is supplied. | epa-transfer-2002; spu-garbage; ilcd-2010 |\n| b_services | released cohorts | Post-gate services are a separately disclosed extension, excluded from the first-receipt product result. Keep all real storage/handling/dispatch/reinspection/return/rework services after first release in the original accepted cohort Qc ledger. H is measured service duration, not a new production denominator. Transfer service burdens to the same cohort once; a consolidated study cancels internal reference quantities and transfers. Re-delivery and reinspection never manufacture Q again. | ilcd-2010 |\n\n"
