              kind: "calculated_from_collection"
              collection_protocol_id: cp_air
              source_ids:
                - jrc-ferrous-bref-2022
                - jrc-ilcd-2010
            ranges: []
        - row_id: heat_air
          role: "Actual dissipated heat"
          name: "Dissipated heat to air"
          flow_type: "elementary"
          property_unit: "Energy / MJ"
          description: "Where quantified, record measured/reconciled dissipated heat at actual thermal state in MJ, separately from purchased fuel energy and sensible heat carried by material/water. No export heat coproduct is assumed."
          amount:
            expression: "Use the single a_j result or disjoint cohort-service s_jc from §8; retain undivided raw records and gross V."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_air
              source_ids:
                - jrc-ferrous-bref-2022
