  classification_refs: "CPC 3.0:39310; this moist coarse mill-scale subset is narrower than the complete slag/dross/scalings leaf"
  covered_products: "One segregated non-alloy hot-strip source; gravity-separated and mechanically drained coarse oxide scale, released as loose moist sinter iron feed"
  excluded_products: "Blast-furnace/steelmaking slags; dross; alloy/stainless/caster/pickling scale; oily fine sludge; collected dry filter dust; mixed recovered steel; metal turnings; briquettes/pellets; pure FeO/Fe2O3/Fe3O4/metallic iron; waste-treatment service references"
  representative_product: "Loose drained coarse hot-rolling oxide scale accepted for sinter iron feed"
  production_route: "Received burdened continuously cast non-alloy slab → actual natural-gas reheating → continuous hot-strip rolling and hydraulic descaling → source-segregated scale-pit/gravity separation → physical drainage → first feed-quality acceptance → separately accounted cohort services"
  market_state: "Moist coarse mixed-oxide feed at declared first receiver-quality acceptance; measured as-released net mass, container tare excluded"
functional_unit:
  what: "Supply recovered oxide-bearing iron feed to the declared sinter receiver"
  how_much: "1 kg reference flow"
  how_well: "Actual agreed coarse-scale feed quality at first acceptance, with independent moisture/oil/composition and particle tests; no universal numerical grade is set"
  how_long_or_cycle: "One traceable first-release reporting cohort; no lifetime, sinter yield or substitution performance assumed"
  reference_flow_link: "finished_scale"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "route and product"
      rule: "Include actual receipt/transport, slab heating, steel oxidation, continuous hot-strip rolling, descaling, segregated scale collection, gravity settling/skimming, drainage, testing and the first feed-quality gate. Keep the source steel co-output and all separately collected fates. This is a transparent technical synthesis of compatible unit operations, not evidence for one SKU or plant recipe."
      source_ids:
        - jrc-ferrous-bref-2022
        - algoma-mill-scale-sds-2022
        - jrc-ilcd-2010
        - doe-steel-roadmap-2001
    - rule_id: b_terminal
      applies_to: "scope exclusions"
      rule: "Use only feed accepted in its actual moist coarse state by the declared sinter receiver, with actual technical and legal status. The BREF examples do not create a universal acceptance threshold. Fine/oily sludge needing de-oiling, thermal drying, washing/flotation, briquetting/pelletising, blending or a different source route needs separate methodology review. A treatment-service Waste reference cannot stand in for this Product feed."
      source_ids:
        - jrc-ferrous-bref-2022
        - algoma-mill-scale-sds-2022
        - jrc-ilcd-2010
        - doe-steel-roadmap-2001
        - harsco-briquetting-case
    - rule_id: b_q
      applies_to: "first release cohort"
      rule: "Q is the net as-released scale mass newly passing the first agreed feed-quality acceptance in the reporting cohort, excluding containers and all previous releases. Closing FG from this same cohort already belongs to Q; never add it again as production output. Dispatch, storage and repeat testing do not create output. Reversal removes only that lot with its whole vector and original release link; a corrected repeat release restores only previously reversed eligible mass to its original cohort. Restoration of an earlier cohort is not new first production in the current cohort."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_stock
      applies_to: "cohort burdens"
      rule: "Retain all failed/zero-output lots, start/stop, idle, cleanup and real rework in raw records. Opening and closing WIP retain stage, quantity, composition and a complete inherited vector for every input, emission, residue and outsourced service; transfer that vector with its lot. Manufacturing A includes current allocated loads plus opening-WIP vectors minus closing-WIP vectors, without shifting failure loads to a fictitious later output. FG is handled by release cohort and its existing vector, not deducted from new-release manufacturing a second time."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_services
      applies_to: "after release"
      rule: "Storage, testing after release, handling, actual packaging/cleaning/repair and dispatch remain in a separate service ledger keyed to each original cohort Q_c, including old FG and returns. H is the actual service load vector, never a production denominator. Attach H/Q_c once to that serviced cohort; cancel internal first-release transfers in the consolidated product ledger. Do not divide old-cohort services by the current new Q or silently drop them."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_extend
      applies_to: "completeness"
      rule: "Minimum cards are not zero/default selectors. Add a concrete atomic row for every actual unlisted purchased formulation/material/fuel, packaging part, refrigerant, service, waste mixture and emitted chemical species before reporting. Prove an optional absence; unknown is not zero. Imported steam, boilers, condensate, chemical de-oiling or thermal scale drying are not presumed. Keep one real provider for a whole external mixture or service and do not duplicate its components/emissions."
      source_ids:
        - jrc-ferrous-bref-2022
        - jrc-ilcd-2010
boundary_abstraction:
  declared_starting_condition: "Source-identified non-alloy continuously cast slab received before actual reheating; compatible upstream steel formation burden attached"
  starting_condition_role: "Physical and burden handover; no automatic waste cut-off"
  product_classification_scope: "Only segregated moist coarse hot-strip mill scale in CPC 3.0:39310"
  recursive_input_rule: "This route forms scale from steel; buying finished scale for repacking is outside scope. Any real same-category external return retains source/state and full inherited vector once; internal circulation cancels and never creates Q"
  upstream_dataset_requirement: "Actual slab provider covers the real iron/steel route, refining, alloy additions where any and continuous casting to received state. A BF-BOF or EAF route is declared and linked, not invented here; do not repeat embedded operations. Record actual receipt transport and every outsourced service once with its real provider"
  disclosure: "Scope/state and receiver status; full steel co-output; physical Fe/O/water/oil balances; allocation and inherited vectors; first Q versus gross shipments; services and uncertainty"
