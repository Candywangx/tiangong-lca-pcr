allocation_rules:
  - rule_id: a_context
    applies_to: "attributional decision"
    rule: "Use this hierarchy only for an attributional study for which allocation is actually required. Document why that decision context applies. Industrial manufacturing or reuse evidence does not itself justify an allocation key, free waste input or avoided-product credit. If source scale is a discarded/negative-value waste or the transfer status changes, retain its actual origin and management burdens and obtain an explicit compatible waste/recycling convention on both sides; do not apply a positive-product economic key or zero burden automatically."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_subdivide
    applies_to: "all exchanges"
    rule: "First identify dedicated operations and real subdivision, then virtual subdivision with quantified causal ownership: actual steel-only finishing, scale-only drainage/quality release and separately measured handling are assigned to the function that determines them. Separate source-steel transformation from scale preparation rather than assign all furnace/rolling loads to scale or omit its formation. Retain a row-by-row allocation record and conservation across every co-function."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining exchange"
    rule: "For each remaining exchange independently identify the determining physical causal relation and show how changing a co-function changes that exchange. Steel/Fe, oxide oxygen, specific furnace and pump services can require different relations. The mere existence of mass, Fe content, price, or a shared meter is not causality; no blanket mass split or optional physical/economic selection is allowed. Gross physical mass balances never use allocation fractions."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "genuinely residual exchanges"
    rule: "Only after justified absence/infeasibility of determining physical causality use contemporaneous representative market values for actual co-functions in their real condition at the same common process gate. Remove later scale drainage/packaging/transport or steel finishing costs if prices are quoted downstream. Keep signed price, quantity, currency, period, adjustments and sensitivity; unavailable, zero/negative or incompatible prices require explicit review, not invented fractions or absolute-value shortcuts. Sum allocated vectors back to the original complete inventory."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_credits
    applies_to: "receiver and recycling"
    rule: "Record actual recovery/disposal routes and internal returns. No fixed steel-to-scale burden fraction, replacement iron-ore mass, recycled-content credit, avoided landfill, exported-heat credit or downstream sinter performance is prescribed. The output feed, treatment service and true steel co-output must not claim the same burden or credit twice."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_origin
      process_id: "mill_scale_recovery"
      flow_role: "steel origin"
      record_type: "supplier and receipt records"
      raw_fields: "heat/lot; steel assay; slab mass; receipt temperature; upstream route; supplier/provider; transport mode/distance/load; inherited exchange vector"
      collection_method: "Reconcile calibrated receipt weights and supplier route/steelmaking/casting records to one actual lot; retain full upstream coverage and transport inventory or actual outsourced provider without repeating embedded utilities"
      unit: "kg; actual service unit"
      frequency: "each lot and transfer"
      temporal_coverage: "complete reporting period and opening lots"
      site_scope: "source supplier to declared CN mill"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; supplier coverage; chain of custody; burden transfer"
    - protocol_id: cp_energy
      process_id: "mill_scale_recovery"
      flow_role: "electricity and furnace gas"
      record_type: "meter and invoice records"
      raw_fields: "meter start/end; raw kWh; raw gas volume/mass; meter temperature/pressure; actual HHV; independent gas density/composition; production/service/idle partitions; provider/grid/voltage"
      collection_method: "Read actual calibrated meters and supplier energy certificates; retain time profiles and included idle/failure/cleanup. Distinguish integrated volume from a rate and actual electrical energy from furnace fuel/heat"
      unit: "kWh; MJ HHV; actual m3/kg"
      frequency: "continuous meters and each supplier lot"
      temporal_coverage: "whole period including stops and Q-zero"
      site_scope: "all selected production and service equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; meter topology; certificates; operating logs"
    - protocol_id: cp_materials
      process_id: "mill_scale_recovery"
      flow_role: "water and supplied formulations"
      record_type: "purchase and stock records"
      raw_fields: "supplier/product; actual supplied formulation; receipt/use/return; water and oil tank stocks; gross circulation; internal transfer pairs; density/state; external return temperature/enthalpy"
      collection_method: "Weigh/meter every actual external water or formulation supply and its stocks. Record raw units and supplier composition without adding assay constituents as purchases. Meter actual mixing and return services separately"
      unit: "kg; measured m3"
      frequency: "each supply/use event and stock boundary"
      temporal_coverage: "complete period plus opening stock history"
      site_scope: "actual tanks and process/return interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "certificates; calibrated meters; independent density; transfer pairs"
    - protocol_id: cp_air
      process_id: "mill_scale_recovery"
      flow_role: "individual molecular/particulate/heat exchanges"
      record_type: "species measurements and state records"
      raw_fields: "species and provenance; air intake composition/state; stack gas composition/state; cumulative gas volume or true rate/time; pollutant concentration; particle size/composition; capture/non-air fates; humidity; reaction-water evidence; heat state"
      collection_method: "Retain species-specific calibrated measurements and independent material/reaction evidence. Convert each raw volume/concentration to molecular mass at its measured state. NOx/COD/VOC totals remain indicators until actual speciation is available; do not infer multiple unknowns from one residual"
      unit: "kg; raw m3; actual concentration; MJ"
      frequency: "representative continuous/event measurements across all operating modes"
      temporal_coverage: "whole period including start-stop and cleanup"
      site_scope: "each real intake/stack/vent and treatment interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; speciation; wet/dry basis; sampling; independent reaction evidence"
    - protocol_id: cp_release
      process_id: "mill_scale_recovery"
      flow_role: "first accepted scale"
      record_type: "weighing and quality-release records"
      raw_fields: "lot/cohort; first gate/time; net released mass; container tare; independent free-water/oil/oxide/element assays; particle distribution; receiver specification/legal acceptance; original release/reversal link; Q; Q_c"
      collection_method: "Weigh the same whole released lot on calibrated scales excluding packaging; test the actual receiver-quality specification and independently determine moisture/oil/Fe/O without an assumed oxide ratio. Deduplicate first releases and attach signed reversals to the original lot"
      unit: "kg"
      frequency: "each first release and signed reversal"
      temporal_coverage: "complete new-release cohort and historical links"
      site_scope: "one agreed gate before downstream sintering"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weights; sampling; actual acceptance; legal transfer basis"
    - protocol_id: cp_balances
      process_id: "mill_scale_recovery"
      flow_role: "stage and cohort mass/burden"
      record_type: "stock and lot genealogy records"
      raw_fields: "stage; gross V by exchange; steel co-output; Fe/O/C/H and relevant elements; free/phase/structural/reaction water; oil; opening/closing WIP and FG quantities; inherited exchange vectors; failed lots; returns; rework; internal transfer pairs"
      collection_method: "Independently weigh/sample all streams/stocks at formation, separation/drainage and finished-store gates and carry each complete per-exchange vector with the lot. Keep manufacturing, FG and consolidated physical ledgers consistent; investigate discrepancies against independently determined uncertainty"
      unit: "kg; original exchange units"
      frequency: "each batch/transfer and period boundary"
      temporal_coverage: "full period and inherited history"
      site_scope: "all source/recovery/FG gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "independent scales/assays; stock sheets; complete vectors; audit trail"
    - protocol_id: cp_residues
      process_id: "mill_scale_recovery"
      flow_role: "each distinct residue and receiver"
      record_type: "weighing and destination records"
      raw_fields: "stream/lot; whole mass; free water/oil/Fe/other analysis; product/waste status; receiver; internal returns; retained stocks; transport/treatment provider; price at actual gate"
      collection_method: "Weigh each actual segregated residue and retain receiver/treatment records. Mixture whole mass and composition subaccounts are non-additive; separate captured material, environmental emissions and provider-owned later treatment"
      unit: "kg; measured raw volume"
      frequency: "each transfer and stock boundary"
      temporal_coverage: "whole period including rejected/Q-zero lots"
      site_scope: "each real residue interface and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; assay; legal receiver; actual fate/provider"
    - protocol_id: cp_packaging
      process_id: "mill_scale_recovery"
      flow_role: "one physical packaging type per ledger"
      record_type: "tare and disjoint container movement records"
      raw_fields: "individual type/configuration; opening empty/WIP/FG/reusable; P; F first non-purchase receipt; ER proven same-item return; closing empty/WIP/FG/reusable; S gross dispatch; EO external return out; W waste; internal reuse pairs; measured tare; manufacture/repair/service history"
      collection_method: "Independently count/weigh each actual packaging component and keep the complete opening + purchase + first non-purchase external receipt + proven same-item external return received = closing + gross physical dispatch out + external return out + waste identity for that same type. Measure tare by configuration; internal reuse cancels and never enters product Q"
      unit: "kg; actual item counts"
      frequency: "each move and inventory boundary"
      temporal_coverage: "full period with service history"
      site_scope: "empty and attached containers at all WIP/FG/service locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare measurements; movement log; complete disjoint movement balance; service life"
    - protocol_id: cp_services
      process_id: "mill_scale_recovery"
      flow_role: "post-release services"
      record_type: "cohort service and allocation records"
      raw_fields: "original Q_c; serviced cohort; current/raw H_j; service dates; old FG; gross shipments; incremental rework/cleaning; inherited vectors; allocation adjustments; upstream/provider interface"
      collection_method: "Attach actual raw storage/handling/packaging/dispatch services to the original serviced cohort, preserving old-cohort burdens and actual return/reversal links. Use the real outsourced provider once or collect its individual atomic exchanges, without double counting embodied energy"
      unit: "original exchange units"
      frequency: "each service event"
      temporal_coverage: "current events plus original cohort history"
      site_scope: "all post-release operations and receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "cohort link; raw invoices/meters; allocation proof; no new production"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert each measured raw quantity to its declared row unit before allocation: kWh × 3.6 → MJ; tonnes × 1000 → kg; litres × 0.001 → m3. Integrated volume is already a quantity; integrate only a true rate over its actual time. For gas HHV multiply actual volume/mass by independently determined compatible HHV; for any mass/volume conversion use independent substance-specific density at the same temperature/pressure/composition. No use of a secondary native conversion as measured density."
      inputs:
        - "raw records"
        - "actual state"
        - "independent HHV/density"
      output: "U_j"
      source_ids:
        - jrc-ilcd-2010
    - id: attribute_exchange
      applies_to: "all inventory rows"
      rule: "Preserve gross physical V_j independently. Apply §7 to each converted U_j and its inherited vector, recording dedicated assignment, virtual subdivision and determining causality before only the genuinely residual market-value allocation. Assign current production loads R_j to the actual scale function and reconcile all co-functions back to the unsplit vector. No fixed fraction is supplied."
      inputs:
        - U_j
        - "actual co-functions"
        - "inherited vectors"
        - "allocation evidence"
      output: "R_j"
      source_ids:
        - jrc-ilcd-2010
    - id: carry_wip
      applies_to: "manufacturing exchanges"
      rule: "A_j = R_j + B_open_WIP_j - B_close_WIP_j. Each B is the inherited amount in the same exchange unit, stage and lot belonging to this first-production cohort. R_j includes all attributable failures/start-stop/idle/cleanup and incremental rework. Old-FG returns retain their original production vector and use the original-cohort incremental rework/service ledger; neither their original vector nor restored mass is inserted into current new-production R_j/Q. No FG subtraction is made merely because released goods remain in stock. Keep signed original-release reversals and inherited vectors in the cohort ledger."
      inputs:
        - R_j
        - B_open_WIP_j
        - B_close_WIP_j
        - cp_balances
      output: "A_j"
      source_ids:
        - jrc-ilcd-2010
    - id: normalize_exchange
      applies_to: "manufacturing exchanges"
      rule: "a_j = A_j / Q, once only for Q > 0. Q is the net first-release quantity under cp_release. Inventory burden quantities use this same a_j without another division; collection protocols never pre-divide raw quantities. Where a functional co-output or return/container transfer is reported as physical context, the same single normalization step reports v_j = V_j / Q from its own undivided converted gross quantity; v_j is never fed into A_j or divided again. For an old-cohort physical service/return/dispatch leg use its own V_jc / Q_c in that same step; never divide a mixed old/new shipment by current Q. The steel co-output quantity is physical context and not an avoided-product credit or a second allocated product yield. Q = 0 retains the complete raw physical and burden vectors and produces no unit result."
      inputs:
        - A_j
        - Q
        - cp_release
      output: "a_j"
      source_ids:
        - jrc-ilcd-2010
    - id: attach_services
      applies_to: "post-release services"
      rule: "s_jc = H_jc / Q_c, once for the original positive first-release cohort Q_c only. H_jc is current raw service load attributed to that cohort; the declared delivered/cohort record combines its original production a_jc with s_jc once. H is never a production denominator; current Q does not normalize old FG services. If Q_c is unknown/zero, retain raw services and require review."
      inputs:
        - H_jc
        - Q_c
        - cp_services
      output: "s_jc"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_gates
      applies_to: "formation separation finished-store and consolidated gates"
      rule: "For every whole material and independently for relevant Fe/O/C/H/other elements: opening physical stocks + external receipts + gross internal receipts = closing physical stocks + gross internal issues + all actual external products/residues/chemical emissions, with chemically supported reaction transformations. Cancel identical internal receipts/issues on consolidation. For the raw FG ledger use O_FG + G + ER_FG = C_FG + S_FG + RV_FG + D_FG. G is positive eligible first-release/restoration entries; RV_FG is actual release-reversed mass withdrawn to WIP; D_FG is only other destruction/reclassification/transfer not already in RV_FG. All are disjoint physical legs with original-cohort links. The cohort net-release ledger is Q = G - RV_FG; substituting it gives O_FG + Q + ER_FG = C_FG + S_FG + D_FG, with no second RV_FG term. Keep cohorts separate: older restored releases update only their original Q_c, never current new-production Q. Q is already contained in the FG/dispatch partition, not an extra output added to it. Mass uses gross V, never allocated A. An unknown balance is not a passed balance."
      inputs:
        - "gross V"
        - "independent assays"
        - "all stocks/transfers"
        - "reaction evidence"
        - cp_balances
      output: "stage and consolidated physical reconciliations"
      source_ids:
        - jrc-ferrous-bref-2022
        - algoma-mill-scale-sds-2022
        - jrc-ilcd-2010
    - id: water_oil_oxide
      applies_to: "whole scale and all wet fates"
      rule: "Whole scale mass and whole wet residue mass each contain their measured water/oil/mineral fractions; elemental Fe and oxygen and FeO/Fe2O3/Fe3O4/metallic-Fe analysis are non-additive subaccounts of the same whole. Independently measure free/structural/phase/reaction-water distinctions and actual changes, with a validated method separating oil from water/minerals. No SDS hazard maxima, default Fe ratio, fixed density or single residual may determine two unknowns. A measured mixture cannot also be emitted as its separate water/iron/oil components at the same boundary."
      inputs:
        - "whole weights"
        - "independent phase/element/water/oil tests"
        - cp_balances
      output: "non-additive component and element reconciliation"
      source_ids:
        - jrc-ferrous-bref-2022
        - algoma-mill-scale-sds-2022
        - jrc-ilcd-2010
    - id: packaging_balance
      applies_to: "each individual packaging type"
      rule: "For each same packaging type: opening empty + opening attached WIP + opening attached FG + opening reusable + P + F + ER = closing empty + closing attached WIP + closing attached FG + closing reusable + S + EO + W. These are disjoint states; a reusable item is not also counted as empty/attached. P is actual purchase; F is first non-purchase external receipt, with material or separately borrowed/free-transferred, regardless of supplier inventory coverage; ER is a genuine return of the same identified item previously dispatched from this site; S tare with gross physical dispatch; EO separate external return out; W actual waste. Internal reuse cancels. P/F/ER are disjoint; actual procurement, transport and service burdens are assigned once, with missing supplier coverage explicitly unresolved. Apply this independently to every actual component; no net-Q substitute, repeat purchase or automatic coproduct."
      inputs:
        - "opening/closing by type"
        - P
        - F
        - ER
        - S
        - EO
        - W
        - cp_packaging
      output: "complete individual packaging balance"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Actual flow type/route/form/grade/geography/media and every native restriction must match. Generic identity does not certify provider or product status. The reference feed needs its own compatible Product UUID before operational use."
      evidence: "full direct identity; real supply/receiver records"
    - id: dq_measurement
      applies_to: "raw records and stocks"
      requirement: "Retain independent weights/assays/densities and actual meter states, complete operating modes, full WIP/FG vectors and uncertainty. Unknown values stay unknown; quantitative factory data are later collected, not invented."
      evidence: "cp_origin; cp_energy; cp_materials; cp_air; cp_balances"
    - id: dq_acceptance
      applies_to: "reference feed and receiver"
      requirement: "Trace first acceptance, state/quality, actual technical and legal receiver basis. Primary industrial documents support route synthesis; they are not site certificates, current sales contracts, default assays or LCA allocation evidence."
      evidence: "cp_release; actual receiver tests and documents"
    - id: dq_complete
      applies_to: "dataset coverage"
      requirement: "Include every actual atomic flow and fate or disclose unresolved coverage and withhold a complete result. Keep whole mixtures disjoint from analysis partitions, actual providers once, and each packaging balance complete. Scientific review and translation review remain separate decisions."
      evidence: "inventory reconciliation; allocation dossier; cohort/service audit"
validation_rules:
  - rule_id: v_scope
    applies_to: "applicability"
    rule: "Verify this exact non-alloy hot-strip source, segregated moist coarse state and declared sinter receiver. Reject slag, metallic scrap, pure oxide, fine oily sludge, agglomerated products and other scale sources from this scope; do not claim full CPC-leaf coverage."
    source_ids:
      - jrc-ferrous-bref-2022
      - algoma-mill-scale-sds-2022
      - jrc-ilcd-2010
  - rule_id: v_native
    applies_to: "every bound identity"
    rule: "Check actual Product/Waste/Elementary type, all native names/comments/CAS where present, route/form/grade/geography/compartment and all properties. Use the exact reference-property/unit-group chain and actual reference unit; no inferred density or item mass. A Waste scale UUID cannot identify finished Product feed; genuine identity gaps remain unavailable until resolved."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_q
    applies_to: "reference and cohorts"
    rule: "Verify 1 kg net as-released feed, one first Q, complete deduplicated reversals and old-cohort links. Closing FG has not been added twice, gross dispatch is not Q, services use original Q_c and H is never a denominator. Q-zero retains raw burdens without a unit result."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_physical
    applies_to: "all physical gates"
    rule: "Reconcile gross whole-material balances and independent relevant elements at formation, separation/drainage, FG and consolidated gates. Verify actual oxygen/water/oil partition, reaction/species evidence, internal cancellation, each receiver and all individual packaging legs. One residual cannot fit multiple unknowns; a missing assay or unresolved gas species prevents a claimed complete balance."
    source_ids:
      - jrc-ferrous-bref-2022
      - algoma-mill-scale-sds-2022
      - jrc-ilcd-2010
  - rule_id: v_attribution
    applies_to: "burden vectors"
    rule: "Independently reconstruct every raw-to-converted-to-assigned-to-stock-carried numerator before its single normalization. Review subdivision and exchange-specific causality, justified residual common-gate prices and full conservation; do not infer scientific approval from engineering checks or a reusable source receipt."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_reporting
    applies_to: "completeness and claims"
    rule: "Disclose all unmeasured fields, identity/provider gaps, applicability limits and uncertainty. Mechanical projection/measurement checks establish declared consistency only, not real factory mass balance, legal status, scientific approval, mapping acceptance or publication. Report the scoped mapping decision separately from the suitability of an actual study."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "Attributional recovered iron-feed production; actual steel co-function and service cohorts disclosed"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only actual matching coarse-scale sinter feed with compatible status and complete burden handover"
  excluded_use: "Waste-treatment functional unit; slag/cement feed proxy; pure iron oxide/metallic iron; briquettes; downstream substitution claims; unqualified full-leaf coverage"
  required_metadata: "source steel heat/lot and non-alloy composition; slab steelmaking/continuous-casting provider and upstream burden; actual reheating/continuous hot-strip/descaling route; one segregated collection circuit and site in China; whole-scale oxide/metallic-Fe and other-element assay; independent oxygen and water/oil determination; measured particle-size distribution; receiver/agreed feed grade and acceptance tests; actual moisture/oil/foreign-material limits and legal Product transfer basis; first-release Q and reporting/cohort identifiers; gross physical mass V distinct from attributed exchange vector A; opening/closing WIP and FG quantities and inherited per-exchange burdens; failed lots and Q-zero loads; returns/reversals and actual incremental rework; actual utility states/voltage/provider/geography; individual packaging ledger and post-release services"
  required_quality_disclosure: "Native identity and provider limits; source/receiver status; actual route; measured composition/state; raw physical/element reconciliations; per-exchange allocation and inherited vectors; Q/Q_c/services and all unresolved completeness"
  update_trigger: "Change in steel source/route, segregation, oil/moisture/particle state, receiver status/specification, treatment or packaging, provider/interface, burden convention or new material evidence"
data_sources:
  - id: "jrc-ferrous-bref-2022"
    type: "official_guidance"
    reference: "Best available techniques reference document for the ferrous metals processing industry (2022), JRC131649; https://publications.jrc.ec.europa.eu/repository/handle/JRC131649 ; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2022-12/FMP%20BREF_Final%20Version.pdf"
    used_for: "§2.2 hot-strip heating/rolling/descaling and water circuits; §2.4.11.2 gravity separation and coarse/fine/oil fates; §8.11.1.2–1.3 coarse-scale reuse versus oily-sludge counterroutes. Qualitative technical synthesis only, not a factory recipe, universal numerical grade, allocation rule or legal receiver approval."
  - id: "algoma-mill-scale-sds-2022"
    type: "literature"
    reference: "Algoma Steel Inc., Mill Scale Safety Data Sheet, version 1.0, revision 2022-11-23; https://www.algoma.com/wp-content/uploads/2025/03/SDS-Mill-Scale.pdf"
    used_for: "§1/3 whole mill-scale identity and reheating/hot-rolling/water removal/gravity recovery, CAS 65996-74-9, multi-oxide/trace-element character; §9/16 physical-property limits and supplier-specific disclaimer. Hazard-determination maxima are not a summable lot assay, iron fraction, moisture/oil specification, density or receiver certificate."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition March 2010; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "§7.9.2–7.9.3, printed pp255–272: attributional decision limits; real/virtual subdivision, exchange-specific determining physical causality, residual market values in actual condition/common gate, conservation and separate waste/recycling cases. Supports declared method and foreground collection requirements; does not provide a steel/scale fraction, measured plant data or automatic credit."
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, Central Product Classification Version 3.0, explanatory notes, 30 June 2025, p.203; https://unstats.un.org/unsd/classifications/Econ/cpc"
    used_for: "Classification and neighboring category limits only; not flow status, feed acceptance or allocation."
  - id: "doe-steel-roadmap-2001"
    type: "official_guidance"
    reference: "Steel Industry Technology Roadmap, Chapter 3, §3.1.3, printed pp.68–70; https://www1.eere.energy.gov/manufacturing/resources/steel/pdfs/roadmap_chap3.pdf"
    used_for: "Independent qualitative route support: scale-pit settling, coarse scale for sinter feed, oil/grease limitations; historical US descriptions do not establish current CN yields, grades or universal oil limits."
  - id: "harsco-briquetting-case"
    type: "literature"
    reference: "Harsco Environmental, Briquetting: An Innovative Triumph, Background; https://www.harsco-environmental.com/case-study/briquetting-innovative-triumph/"
    used_for: "Operator counterroute: clean scale versus oily sludge; its briquetting/thermal-treatment case is excluded. No case quantity, oil fraction or energy value is transferred."
  - id: "unsd-cpc3-2026-supplement"
