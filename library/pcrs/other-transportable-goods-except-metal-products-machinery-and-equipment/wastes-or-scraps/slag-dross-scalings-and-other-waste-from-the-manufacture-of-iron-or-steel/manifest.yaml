  blocking_issues:
  - Core finished_scale Product UUID remains unverified. Real direct state-100 mill-scale candidates are Waste flows;
    no Waste-to-Product reinterpretation or blast-furnace-slag/pure-oxide proxy is accepted. Reference Product name
    and finished row intentionally carry no UUID; candidate remains authored_methodology with explicit unresolved reference identity pending compatible study data.
  ordinary_foreground_requirements:
  - Actual CN non-alloy slab lot, steelmaking/casting provider and full burden handover; source segregation and
    actual natural-gas furnace/continuous strip/descaling operations.
  - Independent actual scale/steel/residue/air elemental Fe/O/C/H, oxide-phase, free-water/oil measurements and
    receiver-specific coarse-feed acceptance/status. No factory numeric values, grade thresholds, default density
    or allocation fractions are invented.
  - Ordinary non-reference identity/provider gaps remain concrete atomic rows; every actual additional material/fuel/package/species
    requires its own verified row. These alone are not the reason for draft maturity.
  - Per-exchange raw-to-assigned/WIP vectors; first-release and old-FG/service/reversal genealogies; individual
    packaging ledgers; actual receiver/treatment records.
  native_identity_decisions:
    source_slab: CN production-mix continuously cast intermediate slab for flat rolling only; actual non-alloy assay
      and complete provider needed.
    electricity: Metered electrical Energy/MJ is distinct from the inspected generic 1–35 kV supply native
      Net calorific value. No UUID bound without actual supplier/property adapter; shared unit group is insufficient.
      Technical Energy and Units of energy MJ/kWh chain verified in public ILCD archive, not a current platform property read.
    captured_scale_dust: Dry-basis captured hot-working gas-cleaning Waste only, before treatment; not wet scale or air emission.
    natural_gas: GLO production mix at plant; burned in industrial furnace; Gross calorific value reference MJ.
      Actual CN supplier and measured compatible HHV needed.
    process_water: Treated industrial water Product with Mass/kg; generic identity is not a source, grade or provider.
      Secondary density is not measured density.
    scale_reject: CN hot-rolling flume-water separated mill scale, Waste flow only; cannot bind the finished Product.
    used_oil: Waste stream at generation; actual petroleum/synthetic used lubricant and unspecified treatment until
      receiver evidence; not oily scale sludge.
    elementary_flows: Adopted outgoing CO2/CO/CH4 are fossil species; NO, SO2, H2O vapour and N2 are species-specific
      emissions to unspecified air. Incoming O2 is a renewable air resource. All use exact Mass/kg reference chains;
      source partitions never add to whole species.
    rejected_candidates: Hot rolled strip steel 984781e6 has explicit pickled/cold-roll commentary conflicting with
      selected unpickled hot strip. Composite oxide 9ddfe80e is catalyst/energy composite, d97d7ed5 slag is fused/vitrified
      GGBFS, 78279a0e natural gas is a coating-oven assumption, ec205030 water is reaction/solution medium, 9bfaad07
      bag is a 25-kg seed package, and b6d54639 hot-rolling oil fixes NAS7/petroleum-cracking with no actual matching
      grade evidence; none is bound here.
  classification_source_versions:
  - UNSD CPC 3.0 explanatory notes 2025-06-30 p203; retained repository coordinate.
  - Published UNSD supplement 2026-10-23 CPC3!A1910:D1910; HS 2022 2618 and 2619; granulated slag excluded.
