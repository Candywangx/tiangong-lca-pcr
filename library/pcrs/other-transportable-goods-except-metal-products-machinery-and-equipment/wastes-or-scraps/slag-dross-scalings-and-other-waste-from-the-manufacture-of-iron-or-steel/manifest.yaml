  scope_decision: Retain this original identity for segregated moist coarse non-alloy hot-strip mill scale only.
    Steel reference methodologies do not supply this terminal feed function. Slag/GBFS, metallic scrap, briquettes
    and fine oily sludge are excluded. The mapping decision applies only to the described first-release product.
