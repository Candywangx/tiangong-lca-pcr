    - protocol_id: cp_water
      process_id: "cast_origin"
      flow_role: "water; cooling_blowdown; water_vapour"
      record_type: "water_state"
      raw_fields: "row_id; purpose; actual inlet/outlet mass; integrated volume or true flow rate; T/P; density; constituents; moisture; enthalpy; loop inventory; supplier convention; discharge receiver"
      collection_method: "Measure actual makeup, cooling/cleaning and each real return/loss independently. Use actual loop/thermal records and water assays; no assumed steam or reaction water. External Product return is separate from waste discharge and requires its own card."
      unit: "kg; m3; m3/h; h; C; Pa; MJ"
      frequency: "each event/lot and representative operating state"
