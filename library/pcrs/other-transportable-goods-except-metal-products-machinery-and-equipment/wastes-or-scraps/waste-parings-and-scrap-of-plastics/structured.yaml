system_boundary:
  rules:
    - rule_id: b_origin
      applies_to: "source manufacturing"
      rule: "Complete actual LDPE pellet-to-cast-film manufacture through edge cutting, source capture, segregation and necessary cold-bale supply. Link original resin upstream production once; do not purchase a finished bale or charge the same history again at trim handover. Dedicated roll winding/core increments remain separately attributable to the roll."
      source_ids:
        - lyb-film-extrusion
        - ilcd-handbook-2010
    - rule_id: b_gate
      applies_to: "first release"
      rule: "Q is net material newly first-quality-released after required preparation and receiver-specific acceptance. Same-cohort closing FG is inside Q already. Reinspection, shipment and linked old returns add no new Q. A genuine release reversal reverses that unique lot once with its whole vector; restoring it cannot create more original output. Preserve real incremental rework."
      source_ids:
        - boa-plastic-baling
        - greenview-ldpe-scrap
        - ilcd-handbook-2010
    - rule_id: b_complete
      applies_to: "all stages and states"
      rule: "Retain receiving, actual handling/conveying, heating/cooling, negative sorting, compression, tying, inspection, maintenance and waste transfer with startup, stop, idle, failures, cleanup, rework and Q=0 periods. Conditional absence needs evidence. Add every actual cleaner, formulated aid, fuel, refrigerant, packaging article, residue and emission species as its own atomic card; no other-material zero or hidden bundle."
      source_ids:
        - lyb-film-extrusion
        - boa-plastic-baling
        - greenview-ldpe-scrap
        - ilcd-handbook-2010
    - rule_id: b_cooling
      applies_to: "actual water/energy interface"
      rule: "The chosen casting branch uses real chill-roll cooling and measured on-site circulation/chilling; circulation is not fresh supply. If cooling crosses an external Product boundary, add distinct actual inlet and Product-return cards with constituent mass, temperature/pressure, inlet/outlet enthalpy and supplier water/energy/net-service convention. Do not double-count water production or cooling energy. No assumed steam, condensate or boiler. Additional route evidence is needed for an actual different supply."
      source_ids:
        - lyb-film-extrusion
    - rule_id: b_history
      applies_to: "stocks and recursive inputs"
      rule: "Carry opening/closing raw/WIP and every intermediate or returned lot with full inherited per-flow vectors. Same-category external trim needs actual source condition/history and justified allocation before handover; no recursive PCR copy or automatic waste cut-off. Internal transfers cancel physically and financially without destroying inherited burden."
      source_ids:
        - ilcd-handbook-2010
    - rule_id: b_service
      applies_to: "postrelease original cohorts"
      rule: "After first release retain actual warehouse storage, packaging repair, handling, loading, return and rework increments by original cohort. Qc is that cohort original first-release mass; handling count H and gross outward V are service/physical observations, never a new production denominator. Old FG is not attributed using current new Q; closing FG has its original production vector and actual service increment."
      source_ids:
        - ilcd-handbook-2010
