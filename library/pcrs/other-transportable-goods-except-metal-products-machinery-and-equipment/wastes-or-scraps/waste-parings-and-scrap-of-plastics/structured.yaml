    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "fg_receipt; gross_shipment; fg_loss; service_power; service_tie; service_tag"
      record_type: "cohort_service"
      raw_fields: "original cohort; Qc; complete production vector; opening/closing FG; gross V; returned lot/original dispatch/reversal; real rework; service date/cutoff; integrated power; added wire/tag; component stocks; P/N/ER_in/ER_out; earlier outward crossing and outstanding return links; H; causal allocation evidence; asset history/D/u/prior shares"
      collection_method: "Custodian links every service and physical movement to the original released cohort including old FG and closing stock. Keep original production history separate from real new increments; no use of current new Q for old cohorts. Record service and physical mass unnormalised; preserve full packaging and reusable asset histories as cp_pack, including first non-purchased external receipts and the prior outward link for every ER_in."
      unit: "kg; kWh; MJ; actual service unit"
      frequency: "each event/lot and representative operating state"
      temporal_coverage: "complete manufacture and later original-Qc service periods"
      site_scope: "actual origin through supply and original-cohort services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw records; tests; calibration; supplier/receiver evidence; complete historical vectors"
  calculation_rules:
    - id: raw_convert
      applies_to: "all inventory rows"
      rule: "Convert actual raw units and independently justified states first. E_MJ = 3.6 × E_kWh; V_m3 = 0.001 × V_litre; mass = measured V × independently measured same-fluid rho. Integrate only a true rate. Species mass = sum(c × integrated V) on a matched basis or integral(c × flow_rate × dt); do not combine both."
      inputs:
        - "raw readings"
        - "compatible units"
        - "T/P"
        - "independently measured density"
        - speciation
      output: "converted raw ledger"
      source_ids: []
    - id: attributed_vector
      applies_to: "all inventory rows"
      rule: "For each source-cohort exchange i retain its full inherited opening-WIP vector plus actual period increments less the supported vector remaining in closing WIP and independent exclusive other-beneficiary work. Apply a_subdivide then exchange-specific a_physical and only residual a_residual. Transfer history once. A_i is the resulting undivided attributable numerator in the row unit; never a scalar LCIA score or arbitrary shared fraction. Released closing FG stays in completed production and is not subtracted."
      inputs:
        - cp_material_cast
        - cp_material_supply
        - cp_release
        - cp_energy_cast
        - cp_energy_supply
        - cp_water
        - cp_species_cast
        - cp_species_supply
        - cp_pack_cast
        - cp_pack_supply
        - cp_fg
      output: "A_i"
      source_ids:
        - ilcd-handbook-2010
    - id: physical_gates
      applies_to: "raw manufacture; supply; FG; combined"
      rule: "Independently close whole mass and relevant C/H/O and actual contaminant/metal elements on measured composition bases. Origin opening raw/WIP/in-use auxiliary and packaging stocks + real external materials + real rework in = matching closing stocks + actual net conforming film + its outward attached core/packaging + trim transfer + waste/species + actual external Product returns. Supply opening WIP/in-use auxiliary and empty/attached/reusable packaging stocks + trim receipt + actual external materials/returns = matching closing stocks excluding new-release FG + new net Q + packaging attached to that new FG + actual rejected/lost outlets and external returns sent. Packaging attached to new FG appears here once only and is excluded from the matching closing-stock term; the component ledger and consolidated stocks still retain its full physical mass. Same-cohort closing FG is already part of Q; never add it again as production. FG opening net film + new Q receipt + linked external returns + real rework receipt = closing net film + gross outward V + losses + transfers to rework. Add each complete packaging/service material subledger for full physical FG closure. Combined gate cancels all internal trim/Q/rework/attached-package transfers. Keep physical gates independent of A_i and burden shares."
      inputs:
        - cp_material_cast
        - cp_material_supply
        - cp_release
        - cp_water
        - cp_species_cast
        - cp_species_supply
        - cp_pack_cast
        - cp_pack_supply
        - cp_fg
      output: "independent raw physical gates"
      source_ids:
        - lyb-film-extrusion
        - ilcd-handbook-2010
    - id: pack_balance
      applies_to: "each packaging component"
      rule: "For each core, wire, tag and actual added component independently: opening empty + opening attached WIP/FG + opening reusable + actual purchases P + first external non-purchased receipts N + external returns received ER_in = closing empty + closing attached WIP/FG + closing reusable + component with gross outward physical shipments + external returns sent ER_out + waste. P, N and ER_in are mutually exclusive physical receipt classes; first loaned, customer-owned or freely supplied components are N, not assumed purchases or returns. Record each crossing once only, including outward shipment versus ER_out. Each ER_in must link the same component's earlier evidenced external outward crossing, including a pre-period crossing where applicable. Each return quantity must not exceed the unmatched outward quantity immediately before that return; cumulative returns must not exceed the original matched outward quantity. Preserve original manufacture/provider history through N and returns; a missing purchase price never means zero burden or a new provider charge. Internal reuse/reattachment cancels; it is not new procurement, net product Q or an automatic coproduct. Whole component masses and source partitions are non-additive with one provider."
      inputs:
        - cp_pack_cast
        - cp_pack_supply
        - cp_fg
      output: "complete component ledgers"
      source_ids:
        - ilcd-handbook-2010
    - id: fg_cohort
      applies_to: "fg_service"
      rule: "Maintain original Qc, complete production vector and physical gross V separately from actual incremental service vector A_service. Assign actual services exclusively first then apply the same hierarchy for genuine common service exchanges. H may evidence service causality but never replaces Qc as final production normalization. Old FG/returns keep original history and linked delivery reversals; add only real rework. Current-period new Q does not absorb an old cohort. Service supplements carry an explicit cutoff and never recreate inherited manufacture."
      inputs:
        - cp_fg
        - cp_pack_cast
        - cp_pack_supply
        - "original Qc"
        - "original production vector"
      output: "original-cohort service increment"
      source_ids:
        - ilcd-handbook-2010
    - id: asset_share
      applies_to: "included asset manufacture attribution"
      rule: "For one original manufacture vector B attribute f × B only after the persistent ledger verifies f = matched use u / evidenced whole installed service D and prior shares + all new shares <= 1. D/history unknown leaves final manufacture attribution unavailable. Original physical mass and stock crossings remain full; actual repairs/replacements have separate real increments and identities. Perform this attribution before the single report_once normalization."
      inputs:
        - cp_pack_cast
        - cp_pack_supply
        - cp_fg
        - B
        - u
        - D
        - "all prior shares"
      output: "conserved manufacture attribution"
      source_ids:
        - ilcd-handbook-2010
    - id: report_once
      applies_to: "all non-reference exchanges"
      rule: "x_i = A_i / Q; A_i is the complete undivided attributable numerator in the declared row unit; Q is original first-quality-released net feedstock kg of that target cohort. Execute this division once only after raw conversion and actual attribution; cards and aggregation reference that same result. Service-only results use original cohort Qc in place of Q and keep incremental A_service separate from inherited production; H, gross V and current-period unrelated Q are never that denominator. Preserve all real burdens when Q = 0 and issue no unit result."
      inputs:
        - A_i
        - Q
        - cp_release
        - cp_fg
      output: "x_i"
      source_ids:
        - ilcd-handbook-2010
  data_quality_requirements:
    - id: dq_raw
      applies_to: "all exchanges"
      requirement: "Require actual site/lot/state records, complete startup/idle/failure/cleanup coverage, calibrated units, matched periods and uncertainty; no factory or grade numbers are invented."
      evidence: "raw records; calibrated meters; full operations"
    - id: dq_identity
      applies_to: "all selected identities"
      requirement: "Review full native basename/synonyms/comments, CAS, grade, route, form, geography, medium, type and every property plus exact referenced chain. Unknown provider/grade and missing auxiliary UUID remain specific requirements, not automatic core failure. A real core contradiction remains unresolved."
      evidence: "full native records; exact support chain; supplier specification"
    - id: dq_species
      applies_to: "all real outlets"
      requirement: "A complete species/water/composition survey is required for a numerical package. Conditional aldehydes and dust cards are examples, not a closed list or permission for zeros. COD/VOC indicators never replace chemical mass; captured waste and emitted species must not overlap."
      evidence: "lab methods; blanks; recovery; limits; actual receiver records"
    - id: dq_history
      applies_to: "stocks and services"
      requirement: "Keep every per-flow WIP/FG inherited vector, original Qc, linked returns/reversals and full component/asset histories across periods. Report production and service completeness separately; later service supplement does not revise physical production twice."
      evidence: "cohort histories; gate reconciliation; complete component ledgers"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference"
    rule: "Verify actual single LDPE formulation, cast-film source and unprocessed flexible-strip cold-bale state, actual acceptance/legal handover and unique first release. Do not generalise to all CPC39270 or use postcommercial Grade A proof."
    source_ids:
      - lyb-film-extrusion
      - boa-plastic-baling
      - greenview-ldpe-scrap
      - rema-plastics-2026
  - rule_id: v_native
    applies_to: "each exchange"
    rule: "A UUID requires complete compatible native identity and exact property/unit chain. An unresolved edge-strip/reference commodity must not borrow the generic raw-material Polyethylene identity; independently verify formed scrap state, formulation, receiver function and actual provider. A broad basename or taxonomy alone is insufficient. It cannot borrow <=5 mm debris, cleaned waste-mixture, optical-assembly or regenerated PE. Preserve all adopted limits in the consumed row context and actual provider matching."
    source_ids:
      - lyb-film-extrusion
      - boa-plastic-baling
      - greenview-ldpe-scrap
      - ilcd-handbook-2010
  - rule_id: v_balances
    applies_to: "all gates"
    rule: "Check independent whole mass and relevant elements/species/water, actual source partitions and inherited WIP vectors, full FG and each packaging component gate. Internal handovers cancel. Released closing FG is already in Q; full gross V remains physical and not multiplied by allocation shares. A residual cannot identify two unknown species or fabricate reaction water."
    source_ids:
      - lyb-film-extrusion
      - ilcd-handbook-2010
  - rule_id: v_normalization
    applies_to: "all records"
    rule: "Audit raw unit/rate conversions and actual attribution before the single A_i/Q calculation. Raw collection never divides. Q0 preserves real burdens with no unit result. Old-cohort services use original Qc, never H/current Q/dispatch, and do not add inherited production again."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: v_evidence
    applies_to: "applicability and completeness"
    rule: "Source scope and actual foreground evidence must support the route, exclusions and any quantitative claim. Industrial manufacturing evidence does not justify allocation by itself. Unknown native core, actual emissions or physical conversions are disclosed rather than passed; a finite engineering result is not scientific, translation, mapping or publication approval."
    source_ids:
      - lyb-film-extrusion
      - boa-plastic-baling
      - greenview-ldpe-scrap
      - ilcd-handbook-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input to later physical recovery at compatible acceptance state with actual composition and burden handover"
  allowed_use: "Specified-origin LDPE trim supply after core identity, actual values, provider and method are verified"
  excluded_use: "Whole-leaf coverage; new-film/recycled-pellet substitution; unproven zero history; automatic credit; methodology or translation approval"
  required_metadata: "known LDPE grade and complete supplied formulation; actual additive and contaminant assays; single-layer noncellular unreinforced unsupported uncoated unprinted film origin; electric flat-die chill-roll casting route; pre-consumer edge-cutting origin and source lot; unwashed unground unagglomerated unpelletised flexible-strip state; no free liquid and measured retained moisture; segregated natural colour and actual receiver cleanliness limits; exact cold-bale and tie specification; legal transfer status and receiver acceptance; source manufacturing allocation and inherited per-flow vector; unique first release and reversal link; geography and period; actual supply voltage and provider boundary; cooling circuit and actual water states; raw/WIP/FG opening and closing stocks; each packaging component and reuse history; gross outward mass and separate original-cohort services"
  required_quality_disclosure: "Unresolved exact reference-commodity identity and pending independent review; unresolved auxiliary/waste identities; actual value/species coverage; source applicability/counterevidence; allocation sensitivity; WIP/FG and service cutoff"
  update_trigger: "Polymer/formulation, origin route, particle form, washing/grinding/pelletising, contamination/moisture, acceptance/legal state, energy/provider, Q gate or allocation evidence change"
data_sources:
  - id: "lyb-film-extrusion"
    type: "handbook"
    reference: "LyondellBasell. A Guide to Polyolefin Film Extrusion. Printed identifier 6047/1004; PDF metadata 2015. https://www.lyondellbasell.com/globalassets/lyb/our-solutions/products/documents/polymers-technical-literature/A_Guide_to_Polyolefin_Film_Extrusion.pdf"
    used_for: "Printed pp. 9-13 and 20-30: pellet handling; distinct cast/blown and multilayer routes; flat-die/chill-roll formation; edge-cutting capture; start/stop and cleaning. No default quantities or recycling allocation."
  - id: "greenview-ldpe-scrap"
    type: "literature"
    reference: "Greenview Waste Management. Sell Scrap LDPE Film and Polythene. Publisher HTML, accessed 2026-11-21. https://www.greenview-wm.co.uk/materials/sell-ldpe-scrap"
    used_for: "Production scrap and preparation sections: clean extrusion/conversion edge trim is distinct from startup dollies; separated consistent grades; covered storage and real buyer/transfer interface. Ratios advertised for other grades are not adopted."
  - id: "boa-plastic-baling"
    type: "literature"
    reference: "BOA Recycling. Efficient Processing of Plastic Waste. Publisher HTML, accessed 2026-11-21. https://www.boarecycling.com/en/solutions/plastic-waste/"
    used_for: "Production-film scrap and trim; horizontal compression and external processor handoff; configuration depends on actual feed. Whole-roll cutting and PET perforation are adjacent excluded branches."
  - id: "rema-plastics-2026"
    type: "standard"
    reference: "ReMA. ISRI Specifications, January 2026. Plastic Scrap P-2025, printed pp. 39-40 and 45-46. https://www.isrispecs.org/wp-content/uploads/2026/01/2026-January-ReMA_ISRI_Specifications.pdf"
    used_for: "Baled versus densified/flake definitions; dry condition; tying/integrity and documented contract variation. Grade A/B is explicitly post-use commercial film and does not certify this pre-consumer stream; its density and contamination numbers are not transferred."
  - id: "ilcd-handbook-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance. First edition March 2010. Sections 7.9.2–7.9.3, printed pp. 255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional cases requiring partitioning: subdivision/virtual subdivision; exchange-specific determining physical causality; residual economic value at common process gate and actual state. Not a universal allocation/substitution choice."
  - id: "unsd-cpc3"
    type: "official_guidance"
    reference: "UNSD. CPC Version 3.0 explanatory notes, 30 June 2025, PDF p.202; 23 October 2026 explanation table CPC3!A1901:D1901. https://unstats.un.org/unsd/econstats/classifications/cpc"
    used_for: "39270 classification and later HS3915 linkage; no change to frozen denominator."
  - id: "wco-hs39-2022"
    type: "official_guidance"
    reference: "WCO. HS 2022 Chapter 39, notes 6–7, 3915.10. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0739_2022e.pdf"
    used_for: "Primary-form exclusion; ethylene-polymer scrap classification. No lot acceptance or default quality limits."
  - id: "3g-scrap-interface"
    type: "literature"
    reference: "3G Plastics. Products/services and FAQ, accessed 2026-11-21. https://www.3gplastics.com/"
    used_for: "Actual recycler distinguishes purchased postindustrial trim/baled film from customer-owned toll reprocessing and resulting pellets; no proof of the selected casting lot."
  - id: "rpi-scrap-interface"
    type: "literature"
    reference: "Recovering Polymers Inc. Plastics We Buy, accessed 2026-11-21. https://recovering-polymers.com/plastics-we-buy-and-sell.php"
    used_for: "Edge/roll trim purchasing and sample-specific acceptance. Also lists LDPE/nylon and laminates: PE label does not prove monolayer LDPE. No universal fractions or quantities."
