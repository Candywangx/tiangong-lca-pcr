      collection_method: "Competent lab surveys actual resin, thermal handling, maintenance and baling outlets and representative startup/idle/failure states before deciding absence. Add every real species and captured-residue outlet atomically; retain uncaptured paths. Integrated volume is not a rate; COD/VOC is not a named chemical."
      unit: "kg; kg/m3; m3; m3/h; h"
