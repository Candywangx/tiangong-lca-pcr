allocation_rules:
  - rule_id: a_context
    applies_to: "all multifunctionality"
    rule: "Restrict these provisions to attributional cases requiring partitioning consistent with the declared goal/context. Determine actual waste/by-product and economic/legal states; a recyclable destination or positive/negative price alone does not choose a convention. No free choice of allocation versus substitution and no avoided-resin or avoided-disposal credit."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: a_subdivide
    applies_to: "cast source and later preparation"
    rule: "First separate actually exclusive operations and inventories, including roll winding/cores and trim capture/compaction. Use justified virtual subdivision where full subdivision cannot be done. The incoming resin/material history and real source losses must be assigned once, not set to zero merely because trim is residual. Do not burden trim with exclusive finished-roll services or erase shared source manufacturing."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: a_physical
    applies_to: "each remaining common exchange"
    rule: "For every remaining exchange test the determining physical causal relationship independently using real process/measurement evidence. Polymer/material partition uses measured source composition and actual fate; it is not a universal rule for heaters, chillers or overhead. Keep full physical outflows/stock gates independent from burden fractions. Reconcile all assigned co-output/beneficiary vectors back to the whole pre-allocation inventory with real losses retained; no unassigned or double-assigned source burden."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: a_residual
    applies_to: "genuinely inseparable remainder"
    rule: "Only genuinely remaining indivisible inventory uses justified economic allocation. Measure contemporaneous representative market values at the common source-process gate and each actual state. Back-calculate later baled/shipped prices by removing actual later handling, preparation, packaging and transport costs consistently for all outputs. Preserve volumes, time, market, negative/zero prices, uncertainty and sensitivity; no fixed ratio or arbitrary physical/economic selection."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: a_recycling_state
    applies_to: "source co-production versus waste recovery"
    rule: "Do not infer a recycling allocation from the feedstock label. Independently identify the actual source co-production and any true joint process; this gate alone does not prove a full multi-cycle recycling system. If the incoming waste has negative market value, identify actual initial treatment and the point/state where the first valuable function is formed before applying the ILCD recycling-specific provisions; do not force the same simple source-gate price split. A nonnegative price alone does not waive inherent-property/cycle information needed for a broader recycling claim. Unknown route/status or necessary recycling evidence leaves that quantitative interpretation unavailable, without erasing actual manufacturing and preparation burdens."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: a_assets
    applies_to: "included reusable manufacture"
    rule: "Where manufacture of an already included asset or reusable article is attributed across uses, retain one persistent same-asset original burden vector B and whole installed-service denominator D covering all realised historical and supported remaining service. Match beneficiary use u to D units; all prior plus new shares u/D must total at most one. Period output, remaining-only capacity and bare asset mass are not D. Custody, period or provider changes never restart the ledger. Unknown D/history means the attributed result remains unavailable; actual repair/replacement/service increments remain real and separate. Full physical mass and stock movements are never amortised."
    source_ids:
      - ilcd-handbook-2010
