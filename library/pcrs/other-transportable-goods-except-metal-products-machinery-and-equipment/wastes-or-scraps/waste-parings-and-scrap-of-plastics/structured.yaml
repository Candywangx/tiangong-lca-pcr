      collection_method: "Meter source manufacture, cooling/chilling and trim preparation separately where feasible. Collect untouched readings and validated coverage with startup/idle/failure; no division by throughput or Q in collection."
      unit: "kWh; kW; h; MJ"
      frequency: "each event/lot and representative operating state"
      temporal_coverage: "complete manufacture and later original-Qc service periods"
      site_scope: "actual origin through supply and original-cohort services"
