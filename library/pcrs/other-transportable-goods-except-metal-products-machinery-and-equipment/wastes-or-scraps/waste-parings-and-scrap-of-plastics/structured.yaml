      collection_method: "Independently weigh each component and preserve full empty/attached/reusable stocks and every external crossing, distinguishing P, N and ER_in/ER_out as pack_balance requires. Match every return received to its earlier external outward movement and outstanding quantity; retain the original provider/manufacture history for non-purchased receipts and returns. Internal reattachments/reuse cancel. For included manufacture across uses retain same-asset full physical mass/acquisition/retirement plus original vector and all beneficiaries; unknown history remains unresolved."
      unit: "kg; actual matched service unit"
      frequency: "each event/lot and representative operating state"
      temporal_coverage: "complete manufacture and later original-Qc service periods"
      site_scope: "actual origin through supply and original-cohort services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "raw records; tests; calibration; supplier/receiver evidence; complete historical vectors"
