  identity_decision: Retain original semantic id and directory. Narrow single-source monolayer LDPE cast-film production
    edge strips; dry segregated unprocessed cold bales for first receiver handover. The generic Polyethylene raw-material
    record does not establish formed scrap or recycling acceptance. Reference UUID remains unresolved; no accepted
    mapping edge is created.
  blocking_issues:
  - Exact formed edge-trim commodity UUID and compatible provider are unresolved. Candidate authored methodology
    only; independent scientific, translation and mapping review remain pending. Numerical production requires actual
    site/lot evidence and complete balances.
  ordinary_data_requirements:
  - Actual grade/formulation, additives, contamination, moisture, receiver limits/legal state, site/year and measured
    amounts remain foreground requirements; none is invented.
  - Ordinary auxiliary/waste UUID and provider gaps remain specific row requirements, not a global methodology hold.
    Authored candidate maturity is retained pending independent scientific/readiness review; no numerical dataset
    is approved.
  - Complete species survey, exact actual cooling interface, per-flow WIP/FG history, source allocation and full
    component/asset histories are required before numerical use.
  coverage_claim: Candidate authored method. The narrower mapping is accepted. Scientific approval, formal translation review and publication are pending.
