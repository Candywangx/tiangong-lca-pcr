product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.pharmaceutical-waste"
  classification_refs: "CPC 3.0:39931, Pharmaceutical waste; accepted narrower relation under docs/adr/2026-11-22-accept-cpc-39931-expired-pharmacy-owned-paracetamol-tablets.md"
  covered_products: "Expired pharmacy-owned paracetamol-only whole tablets, one finished formulation and original lot per cohort, first documented internal destruction-stream transfer"
  excluded_products: "Other drugs/forms; patient returns; manufacturing rejects; saleable/quarantined stock without demonstrated unfitness and discard; biological/infectious/hazardous waste; API; empty packs; solvents; sludge; disposal services"
  representative_product: "One actual expired paracetamol-only tablet lot with a documented stock-to-destruction-stream transfer; no public qualifying sample or quantity is asserted"
  production_route: "Trace original procurement and stock history; verify expiry and discard decision; record stock removal, net-mass determination and first internal segregation handover; separately link any subsequent custody work"
  market_state: "Waste whole tablets in their recorded original containment, withheld from medicinal supply; no deblistering or reformulation is presumed"
functional_unit:
  what: "Traceable expired paracetamol-only tablet material first handed from pharmacy stock into its segregated destruction stream"
  how_much: "1 kg net whole-tablet mass excluding all packaging and containers"
  how_well: "Same finished formulation identity/lot, expiry and discard decision, actual internal handover, lawful non-biological/non-infectious non-hazardous determination for the actual site and period; no therapeutic equivalence"
  how_long_or_cycle: "One unique first recorded waste handover; later custody uses the original cohort rather than creating new production"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: b_origin
      applies_to: "segregation"
      rule: "Establish own-stock origin, expiry, unfitness, discard and actual recorded internal receipt separately. A receiving custodian and designated area suffice for the internal gate only when recorded. No factory rejection record or consumer-return study proves this route."
      source_ids:
        - psi-medicine-disposal
        - oleary-pharmacy-audit-2026
        - wco-hs30-2022
    - rule_id: b_operations
      applies_to: "segregation"
      rule: "Include actual stock verification, segregation, weighing, handling, necessary containment, attributable lighting/HVAC, cleaning, failed/zero-release operations and standby within the declared gate. Preserve real stage records. No deblistering, grinding, drying, chemical conversion, pathogen treatment or active-substance recovery is part of this route."
      source_ids:
        - psi-medicine-disposal
        - ilcd-lca-detailed-2010
    - rule_id: b_release
      applies_to: "reference_product"
      rule: "Count Q once at first qualified internal handover. Pre-release stock plus incoming stock equals closing pre-release stock plus Q plus disjoint other outflows. Segregated stock plus Q and actual returns equals closing segregated stock plus gross dispatch and disjoint other outflows. Cancel internal Q when combining gates; neither closing stock nor external dispatch is new Q."
      source_ids:
        - psi-medicine-disposal
        - ilcd-lca-detailed-2010
    - rule_id: b_pack
      applies_to: "all inventory rows"
      rule: "For EACH actual pack/container/pallet component at one physical gate, opening + P + N_ext + ER = closing + grossS + EO + W. Include empty, attached pre-release, attached segregated and reusable stocks. P is true purchase including articles included in a whole purchase price; N_ext is first external non-purchased receipt, including accompanying, borrowed, rented or free-transfer articles whether or not supplier data cover them; ER requires a traceable earlier outward dispatch of the same item. Classes are mutually exclusive; internal issues/reuse cancel."
      source_ids:
        - ilcd-lca-detailed-2010
    - rule_id: b_interfaces
      applies_to: "all inventory rows"
      rule: "The conditional cards are not a complete site BOM. Determine each actual original medicine-pack component and any specialised bin body, lid, liner, closure or pallet separately; install its concrete atomic receipt/output or stock interface and measured quantity before dataset completeness. A PE bag is neither evidence of a compliant bin nor a substitute for one. Missing original packaging cannot be hidden inside net Q, a generic collection row or a symbolic balance."
      source_ids:
        - psi-medicine-disposal
        - ilcd-lca-detailed-2010
    - rule_id: b_custody
      applies_to: "all inventory rows"
      rule: "Link physical receipts, ownership, original item/cohort and exchange-level carried burdens. Assign actual purchase, transport, rental or other services once; absent supplier inclusion evidence is a gap. A return/first non-purchased receipt is not automatically virgin manufacture, zero burden or a credit. Gross throughput and the environmental supply-demand vector are different accounts."
      source_ids:
        - ilcd-lca-detailed-2010
    - rule_id: b_destination
      applies_to: "segregation"
      rule: "Base scope ends at internal segregation. An explicitly declared later storage/packing/dispatch extension retains original cohort mass Qc and adds only actual incremental work; H is service activity, never production. Collection, treatment and final disposal remain separately linked downstream services, not demonstrated by internal designation. Do not presume destruction performance, off-site receipt or an avoided-product credit."
      source_ids:
        - psi-medicine-disposal
        - ilcd-lca-detailed-2010
boundary_abstraction:
  declared_starting_condition: "Own-stock expired finished tablets at recorded discard decision, with procurement, stock and packaging history linked"
  starting_condition_role: "foreground_gate_input"
