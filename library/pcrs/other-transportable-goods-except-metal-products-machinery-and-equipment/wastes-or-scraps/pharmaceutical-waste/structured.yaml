measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is net same-lot whole-tablet mass at the first documented qualified internal waste handover. Use cp_release calibrated gross minus independently evidenced component tares, or count times independently measured same-lot finished-tablet unit mass. Record method, uncertainty and representativeness without opening waste solely for this model. Nominal active strength, cost, pack count or a mixed-bin weight is not net medicine mass."
  - id: raw_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual declared property"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Collect raw totals and event records. Convert original units before attribution and the sole division by Q. Volume-to-mass needs independently measured state-specific density; integrate actual rates once and never multiply an integrated total by time again."
  - id: electricity_unit
    applies_to: "electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Collect metered kWh and use 1 kWh = 3.6 MJ. Energy is the metering property; the actual supplier flow, its native reference property and provider remain independently unbound until verified. Sharing an energy unit group does not prove net calorific value."
  - id: composition
    applies_to: "expired_tablets_in; tablet_fragments; tablet_washwater"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Full tablet mass includes excipients and actual moisture. Assayed active mass is a non-additive subledger. Do not infer formulation, degradation, density or a named emission from label strength, COD/BOD, total dust or an unexplained balance residual."
