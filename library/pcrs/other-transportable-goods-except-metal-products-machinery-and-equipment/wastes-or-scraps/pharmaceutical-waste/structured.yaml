allocation_rules:
  - rule_id: a_scope
    applies_to: "all inventory rows"
    rule: "Apply attributional foreground accounting. There is no intended co-product here; packaging movements and custody are not new tablet production. Original purchase price or an accounting write-off does not determine environmental burden allocation."
    source_ids:
      - ilcd-lca-detailed-2010
  - rule_id: a_separate
    applies_to: "segregation"
    rule: "Assign dedicated records and subdivide physically or virtually first. For remaining shared exchanges demonstrate their determining physical causality to actual co-functions. Only a genuinely unresolved remainder uses contemporaneous market values at the same process gate and physical state. Common mass/revenue alone is not causality; no free choice of allocation ratio."
    source_ids:
      - ilcd-lca-detailed-2010
  - rule_id: a_history
    applies_to: "expired_tablets_in"
    rule: "Retain original medicine and packaging production/procurement burdens under their declared upstream system model. Expiry and discard do not establish either automatic full burden transfer or zero burden. Bind every carried exchange vector once; missing upstream history or allocation basis is explicit uncertainty, not new ingredient buying."
    source_ids:
      - ilcd-lca-detailed-2010
  - rule_id: a_cohorts
    applies_to: "all inventory rows"
    rule: "Preserve opening/closing pre-release and segregated-stock vectors and every failed, zero-release, idle and cleanup record. Later services/returns use original Qc, not new Q. A Q=0 cohort retains its raw loads without a per-kg result; do not shift them to unrelated successful cohorts."
    source_ids:
      - ilcd-lca-detailed-2010
  - rule_id: a_services
    applies_to: "all inventory rows"
    rule: "P/N_ext/ER classify physical receipts independently from environmental burdens. Retain owner, provider scope and original cohort; count actual procurement, transport, cleaning, rental and other incremental services once. No-invoice receipt and supplier omissions both require investigation. Do not multiply gross packaging reuse by a new-article provider or duplicate supplier-included services."
    source_ids:
      - ilcd-lca-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_history
      process_id: "segregation"
      flow_role: "expired_tablets_in"
      record_type: "stock_history"
      raw_fields: "product; finished_formulation_identity; authorisation_or_specification_id; upstream_dataset_ref; existing_safety_documents; labelled_strength; tablet_form; original_lot; supplier; ownership; original_receipt; expiry; discard_decision; patient_return_exclusion; opening_stock; closing_stock; inherited_vector_i; provider_scope_i"
      collection_method: "Obtain original procurement/stock and pharmacist disposition records, preserving original packaging, finished formulation identity and exchange-level upstream provenance. Verify brand, authorisation/specification identifier, sole active substance and dosage form against existing records and compatible upstream data; do not require quantitative manufacturing proportions. Raw totals for per 1 kg reference flow; no division here."
      unit: "kg"
      frequency: "each lot and movement"
      temporal_coverage: "procurement history through reporting close"
      site_scope: "actual pharmacy and original supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; actual site/period waste determination; linked upstream system model"
    - protocol_id: cp_release
      process_id: "segregation"
      flow_role: "reference_product"
      record_type: "internal_handover_weighing"
      raw_fields: "lot; expiry; discard; stock_removal; receiving_custodian; designated_location; event_time; first_event_id; gross; each_component_tare; count_if_used; same_lot_finished_unit_mass_if_used; net; Q; Qc; opening_stock; closing_stock; grossS; actual_return; prior_dispatch; calibration; uncertainty"
      collection_method: "Reconcile actual stock removal and internal receipt with a calibrated non-destructive net-mass record. Alternatively use count times independently measured same-lot finished-tablet mass with representative sampling and uncertainty. Do not derive mass from active strength/cost/bin gross. Raw totals for per 1 kg reference flow; no division here."
      unit: "kg"
      frequency: "each first handover and custody event"
      temporal_coverage: "opening through close including zero-release periods"
      site_scope: "actual pharmacy stock and segregated receiving gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "internal event record; pharmacist discard decision; expiry; calibrated gross/tare or same-lot finished-mass basis; actual qualification"
    - protocol_id: cp_pack
      process_id: "segregation"
      flow_role: "individual component interfaces"
      record_type: "component_custody"
      raw_fields: "component_id; material; form; direction; event; owner; lot; opening_empty; opening_attached_pre_release; opening_attached_segregated; opening_reusable; P; N_ext; ER; prior_outward_dispatch; closing; grossS; EO; W; measured_mass; supplier_scope_i; inherited_vector_i; incremental_service_i"
      collection_method: "Determine actual original pack and every containment component individually. Reconcile calibrated weights or traceable measured BOM with all receipts, including first non-purchases irrespective of supplier coverage and same-item returns. Install every actual atomic interface. Raw totals for per 1 kg reference flow; internal issues/reuse cancel; no division here."
      unit: "kg"
      frequency: "each receipt, movement, discard and stock count"
      temporal_coverage: "opening through close; full original item lineage for returns"
      site_scope: "same component-specific physical gate and any declared custody extension"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "measured BOM; receipts; ownership and invoices/whole-price scope; prior dispatch; supplier inclusion and missing-data disclosure"
    - protocol_id: cp_utilities
      process_id: "segregation"
      flow_role: "electricity; tap_water"
      record_type: "metered_activity"
      raw_fields: "stage; lot; meter_start; meter_end; raw_unit; rate_time_if_used; density_if_needed; provider; voltage; geography; included_scope; standby; failed_operations; cleanup; service_H; original_Qc"
      collection_method: "Record actual meters, supplier activity and justified dedicated/shared-stage assignment. Distinguish metered Energy from supplier-native flow property. No rated-power or generic density substitution. Raw totals for per 1 kg reference flow; no division here."
      unit: "kWh; kg"
      frequency: "each stage and meter interval"
      temporal_coverage: "full campaign and any declared custody extension"
      site_scope: "actual pharmacy and supply gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; supplier/context compatibility; allocation evidence; actual measured density if needed"
    - protocol_id: cp_residuals
      process_id: "segregation"
      flow_role: "tablet_fragments; tablet_washwater"
      record_type: "residual_transfer"
      raw_fields: "material; lot; event; whole_mass; measured_water; actual_assay_and_basis; contamination; receiver; treatment_boundary; sample_mass; inherited_vector_i"
      collection_method: "Independently weigh every actual residual and identify its real receiver; reconcile non-additive whole-material and analysed-component views. COD/BOD or dust alone is not a named chemical emission. Raw totals for per 1 kg reference flow; no division here."
      unit: "kg"
      frequency: "each actual residual transfer"
      temporal_coverage: "all relevant operations and cleanup through close"
      site_scope: "actual source and residual receiving gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; analysis method/basis; transfer documentation; destination and completeness evidence"
    - protocol_id: cp_services
      process_id: "segregation"
      flow_role: "later custody"
      record_type: "cohort_service"
      raw_fields: "original_first_event; Qc; H; raw_exchange_i; prior_dispatch; actual_return; opening_stock_i; closing_stock_i; inherited_vector_i; included_scope_i"
      collection_method: "Only for an explicitly declared extension: retain original cohort and actual incremental storage, handling, dispatch or return work. An inherited supply is not a second purchase. Raw totals for per 1 kg reference flow of original Qc; no division here."
      unit: "actual service unit; kg"
      frequency: "each actual service event"
      temporal_coverage: "first internal handover through declared custody close"
      site_scope: "actual custodian and declared extension"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "first-event lineage; real service records; provider inclusion; incremental measurements"
  calculation_rules:
    - id: c_raw
      applies_to: "all inventory rows"
      rule: "Convert original units; 1 kWh = 3.6 MJ. Integrate true rates once. Volume-to-mass requires independently measured density for that actual state. Preserve raw totals and uncertainty."
      inputs:
        - raw_records
        - unit_chain
        - density_if_used
      output: "raw_totals_i"
      source_ids:
        - ilcd-lca-detailed-2010
    - id: c_mass
      applies_to: "reference_product"
      rule: "For each first qualified event, q_event = gross minus all independently measured component tares, OR count times independently measured same-lot finished-tablet unit mass; record the chosen method, never add the two estimates. Q is the sum of unique first-event net masses for the defined same-product cohort. Neither nominal strength nor costs convert counts to medicine kg."
      inputs:
        - cp_release
        - cp_pack
      output: "Q"
      source_ids:
        - psi-medicine-disposal
    - id: c_tablets
      applies_to: "expired_tablets_in; reference_product"
      rule: "Pre-release gate: opening_pre + incoming_stock = closing_pre + Q + other_pre_out. Segregated custody gate: opening_seg + Q + true_return = closing_seg + grossS + other_seg_out. Other outflows are disjoint actual residuals with their compositions measured. Q cancels on combination. Previously released returns and reinspection create no new Q; preserve original cohort and all physical mass."
      inputs:
        - cp_history
        - cp_release
        - cp_residuals
        - cp_services
      output: "medicine_reconciliation"
      source_ids:
        - ilcd-lca-detailed-2010
    - id: c_components
      applies_to: "all inventory rows"
      rule: "For EACH component: opening + P + N_ext + ER = closing + grossS + EO + W, including empty/attached/reusable stocks. Receipt classes and destination classes are mutually exclusive; ER requires prior same-item outward dispatch. Internal issues/reuse cancel. Missing real interface/quantity is incomplete; no balancing plug or omitted non-purchased article."
      inputs:
        - cp_pack
        - cp_release
        - cp_services
      output: "component_reconciliation"
      source_ids:
        - ilcd-lca-detailed-2010
    - id: c_vectors
      applies_to: "all inventory rows"
      rule: "For each original cohort and exchange i: opening carried vector + actual carried-in vector + genuinely new attributable vector = closing vector + assigned reference vector A_i + identified other-destination vector. Deduplicate provider-included scope once. Apply dedicated/subdivided records, then determining physical causality, then only unresolved same-gate/state/time market-value remainder. Physical throughput is not automatically new procurement burden."
      inputs:
        - cp_history
        - cp_pack
        - cp_utilities
        - cp_residuals
        - cp_services
      output: "A_i"
      source_ids:
        - ilcd-lca-detailed-2010
    - id: c_normalize
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q for Q>0, once after raw conversion, attribution and reconciliation. The reference output is 1 kg. Q=0 retains raw burdens with no unit result. A later custody profile uses original Qc, with actual increments added before this sole division or reported once as a separate increment; H is never production. For a physical interface numerator use its measured raw G_i in place of A_i in this same normalisation step, retaining g_i = G_i / Q separately from environmental demand a_i. Never add these two views or attach virgin supply to gross throughput; never divide already-normalised values again."
      inputs:
        - A_i
        - G_i
        - Q
        - Qc
        - cp_release
        - cp_services
      output: "a_i; g_i"
      source_ids:
        - ilcd-lca-detailed-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference_product"
      requirement: "Require the actual single-product/lot expiry, discard and own-stock-to-segregated-stream intersection. Broad audit categories are not proof that this medicine met it."
      evidence: "Original procurement, expiry and internal custody records; oleary-pharmacy-audit-2026 limitations"
    - id: dq_gate
      applies_to: "reference_product"
      requirement: "Require site/period-specific lawful waste and non-hazardous qualification; no hazard/safety approval follows from CPC, non-biological naming or a finite measurement check. Internal receipt is not external collection."
      evidence: "Actual competent determination and recorded internal gate; psi-medicine-disposal; wco-hs30-2022"
    - id: dq_mass
      applies_to: "reference_product"
      requirement: "Calibrated net whole-tablet mass or independently supported same-lot finished-mass conversion; all packaging excluded and uncertainty retained. No public kilogram case is supplied."
      evidence: "cp_release raw records; oleary-pharmacy-audit-2026 quantity limits"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Every actual original package, specialised containment, utility, cleaning preparation, residual and real species requires its own atomic interface or explicit measured stock account. The initial map is not a cut-off."
      evidence: "Actual full BOM and event inventory; component and material closure"
    - id: dq_lineage
      applies_to: "all inventory rows"
      requirement: "Carry original stock/item/provider burdens through all gates and actual returns. Keep genuine incremental services, failures, standby and cleanup without double procurement."
      evidence: "Exchange-vector and original-dispatch lineage; ilcd-lca-detailed-2010"
    - id: dq_native
      applies_to: "all inventory rows"
      requirement: "Verify actual type, physical state, supply context, property and unit chain; exact native Chinese names where available. Metering identity does not fix a supplier's native reference property."
      evidence: "Original native identities and independent supplier context"
validation_rules:
  - rule_id: v_applicability
    applies_to: "reference_product"
    rule: "Require the same-product expired own-stock cohort, actual discard, internal segregation receipt and site/period qualification. Unused, near-expiry, quality-hold or uncollected status alone cannot pass. Excluded origins and biological/infectious/hazardous material cannot use this method."
    source_ids:
      - psi-medicine-disposal
      - wco-hs30-2022
      - oleary-pharmacy-audit-2026
  - rule_id: v_reference
    applies_to: "reference_product"
    rule: "Require one linked Product output at 1 kg net whole-tablet mass with a unique first-event denominator. Resolve its precise native identity before a completed dataset claim; clinical waste, generic waste and an API elementary emission are not substitutes. Verify the same-lot mass basis for any count conversion."
    source_ids:
      - wco-hs30-2022
      - oleary-pharmacy-audit-2026
  - rule_id: v_stock
    applies_to: "all inventory rows"
    rule: "Check pre-release, segregated and combined physical gates with Q cancelling internally. Closing stock and gross dispatch are not extra production; return/reinspection retains original cohort and no new Q. Check analysed constituents independently, without fitting several unknowns to one residual."
    source_ids:
      - ilcd-lca-detailed-2010
  - rule_id: v_pack
    applies_to: "all inventory rows"
    rule: "Check EACH original pack/container/pallet component and concrete atomic interfaces, including P, first N_ext whether covered by supplier data or not, and same-item traceable ER. Enforce opening+P+N_ext+ER=closing+grossS+EO+W with empty/attached/reusable stocks and cancelling internal transfers. Missing quantities/interfaces cannot pass by symbols."
    source_ids:
      - psi-medicine-disposal
      - ilcd-lca-detailed-2010
  - rule_id: v_burden
    applies_to: "all inventory rows"
    rule: "Verify provider scope, inherited vectors and real incremental procurement/transport/service burdens exactly once. No automatic zero burden, virgin manufacture on gross throughput, or credit. Check subdivision, determining physical causality and only residual same-gate/state/time economic allocation."
    source_ids:
      - ilcd-lca-detailed-2010
  - rule_id: v_calculation
    applies_to: "all inventory rows"
    rule: "Require raw collection, unit/rate/density conversion and attribution before sole A_i/Q division. Q=0 retains loads; service extensions use original Qc and never H as production. Check native property/unit compatibility separately from electricity metering."
    source_ids:
      - ilcd-lca-detailed-2010
  - rule_id: v_destination
    applies_to: "all inventory rows"
    rule: "Keep internal gate, off-site dispatch and downstream treatment distinct. Reconcile whole effluent versus constituent analyses as non-additive and one provider per actual exchange. Real residuals/releases need actual destinations/species/compartments; no disposal effectiveness or default emission is inferred."
    source_ids:
      - psi-medicine-disposal
      - ilcd-lca-detailed-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset only after all applicability, native-identity and evidence requirements are met"
  allowed_use: "Same-product expired own-stock tablets at documented first internal destruction-stream handover, with original burden model and declared incremental scope"
  excluded_use: "Other medicines/forms/origins; therapeutic use; safe/legal handling certification; biological/infectious/hazardous waste; treatment/disposal or active-substance recovery service; automatic zero-burden or avoided-product credits"
  required_metadata: "Finished formulation identity/authorisation or specification/lot and expiry, corresponding upstream data and existing classification documentation, without manufacturing proportions; stock origin and discard; internal custodian/location/time; actual qualification; net-mass method and uncertainty; full packaging/BOM and custody; Q and any later original Qc; raw/normalised separation; site/period/provider and upstream allocation provenance"
  required_quality_disclosure: "Public evidence does not establish this product-specific subgroup or net kg; reference Product UUID and actual site data unresolved; conditional component identities do not establish occurrence; original packaging and real services need full coverage; candidate guidance does not imply scientific/translation approval"
  update_trigger: "New original subgroup/lot/mass/pack or custody evidence; changed waste determination, site/period or supplier; corrected native identities/property chains; new actual exchange or revised upstream system model"
data_sources:
  - id: "unsd-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Ver.3.0 Explanatory Notes, 30 June 2025, p.205; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Frozen 39931 identity and neighbouring categories; name-only entry does not establish hazard status"
  - id: "unsd-cpc3-notes-2026"
    type: "official_guidance"
    reference: "UNSD, CPC explanatory notes, 23 October 2026, CPC3!A1940:D1940; https://unsdsna.azure-api.net/files/pages/cpc/CPC_Ver3_Exp_Notes_2026-10-23_for_Website.xlsx"
    used_for: "Latest original 39931 correspondence to HS2022 3006.92; classification corroboration only, no change to frozen coordinate"
  - id: "wco-hs30-2022"
    type: "official_guidance"
    reference: "WCO, HS2022 Chapter 30, Note 4(k), PDF p.2, and 3006.92, p.4; https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0630_2022e.pdf"
    used_for: "Unfitness for original purpose, including expiry, distinguishes waste pharmaceuticals from medicinal goods; not a hazard or actual-discard determination"
  - id: "psi-medicine-disposal"
    type: "official_guidance"
    reference: "Pharmaceutical Society of Ireland, Guidelines on the Disposal of Medicinal Products for a Retail Pharmacy Business, introduction and §§3.1.3–3.1.5; https://www.psi.ie/practice-supports/guidance-and-guidelines-pharmacists-and-pharmacies/guidelines-disposal-medicinal"
    used_for: "Qualitative pharmacy stock segregation, designated custody and assessment context; basis for a derived documented internal gate, not proof of an actual transfer or an LCA mass factor; verify actual applicable place/date obligations"
  - id: "oleary-pharmacy-audit-2026"
    type: "literature"
    reference: "O'Leary et al., Unused and expired medicines waste in Ireland – an audit of medicines returned to and generated in community pharmacies, Irish Journal of Medical Science 195, 2853–2864, 2026, Methods, Results and Figs. 3 and 4; https://doi.org/10.1007/s11845-026-04436-6"
    used_for: "Original April/May 2025 audit separates own-stock waste/expiry from returns and documents on-site designation; does not identify this product-specific intersection, finished-tablet mass or a completed kilogram dataset; costs and unit counts are not LCA factors"
  - id: "ilcd-lca-detailed-2010"
    type: "handbook"
    reference: "European Commission JRC, ILCD Handbook, General guide for LCA, Detailed guidance, March 2010, §§7.9.2–7.9.3, printed pp.255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "General attributional subdivision, determining-physical-causality and residual same-gate/state economic hierarchy; balances/protocols are explicit method derivations here, not reported pharmacy factors or a waste exemption"
  - id: "waghmare-expired-tablets-2026"
    type: "literature"
    reference: "Waghmare Rohit and Bharatee Chaudhari, Comparative Evaluation Test of Fresh & Expired Pharmaceutical Tablets, Asian Journal of Pharmaceutical Research and Development 14(5), 8–13, 2026, publisher abstract; https://doi.org/10.22270/ajprd.v14i5.1860"
    used_for: "Independent original evidence for the expired paracetamol-tablet physical state only; not specific finished formulation identity, same pharmacy/lot/strength, own-stock discard or disposal proof; no test conditions, clinical conclusions, residual recovery or use advice adopted"
