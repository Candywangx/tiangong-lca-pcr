  verified_native_identity_limits: "Public direct reads: Polyethylene bag10647902-9822-4b06-bc95-f1f30f10c261 Product/Mass/聚乙烯袋; Paper label6e3bea7a-9e89-4f50-a065-79feaac682db Product/Mass/GLO printed sticker/纸质标签; Tap waterd1e0e36c-07f0-4a75-bdcb-efb5d9e2ac36 Product/Mass/自来水, not purified water and secondary Volume is not site density. Conditional identities only, not actual pharmacy occurrence or provider bindings. Exact versions and originals retained outside canonical content."
  source_applicability: "UNSD frozen/current and WCO establish classification only. PSI supports designated pharmacy segregation. OLeary2026 original audit supports own-stock expiry and on-site designation, not the paracetamol subgroup or kg; no quantitative factors adopted. ILCD2010 supports attributional hierarchy, not observed pharmacy accounts. Native XML archive supports units only. Scientific and independent translation reviews remain pending."
  independent_physical_state_evidence: "Waghmare and Chaudhari2026 publisher abstract DOI10.22270/ajprd.v14i5.1860 explicitly includes expired paracetamol tablets. Physical-state corroboration only; not same pharmacy, batch, strength, specific finished formulation identity, own-stock discard or disposal as the Irish audit. No experiment conditions, clinical judgments or active recovery adopted."
  finished_identity_requirement: "Verify finished formulation identity using brand, authorisation or specification identifier, sole active substance, dosage form, measured finished mass, corresponding upstream data and existing safety classification documents. Quantitative manufacturing recipe or ingredient proportions are not required at this handover gate. Unverified product or native-flow applicability remains unresolved."
