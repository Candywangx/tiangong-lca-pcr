    - "No public source establishes the intersection of paracetamol-only tablets, expiry, pharmacy-own stock, actual recorded internal handover and same-lot net kg. Obtain actual pharmacy records before a completed foreground dataset claim. Audit route evidence is not subgroup proof."
    - "Exact reference Product flow UUID unresolved. Candidate authored-methodology exception keeps the sole declared output explicit, without a false binding; not publishable."
