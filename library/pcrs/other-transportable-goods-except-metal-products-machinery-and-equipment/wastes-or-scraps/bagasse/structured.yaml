allocation_rules:
  - rule_id: allocation_scenario
    applies_to: "supplier; release; delivery"
    rule: "Declare an attributional case in which allocation remains necessary. First separate exclusive operations by real or virtual subdivision; then identify determining physical causality for each remaining exchange. Document why each cannot be assigned directly."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "common_process"
    rule: "Only genuinely unresolved common burdens use relative market value at the same common-process exit, actual state and period. Correct prices for later conditioning, packaging and freight. Document status, quantities, prices and sensitivity; no arbitrary physical/economic choice or fixed share."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_status
    applies_to: "bagasse_in; residues"
    rule: "Low price, biological origin, residue terminology and the CPC waste parent do not establish zero upstream burden. Require actual recipient use, specification, legal/market status and supplier responsibility. Distinguish valuable Product from discarded Waste; uncertain status requires review."
    source_ids:
      - ilcd-allocation-2010
      - epa-sugar-1997
  - rule_id: allocation_ledgers
    applies_to: "all inventory rows"
    rule: "Shares affect environmental burden A only. Gross physical vector V, product/waste/emission masses, water changes, internal transfers and historical stock ownership remain unscaled. No automatic substitution, recycling or carbon credit."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "bagasse_release"
      record_type: "Measured primary records"
      raw_fields: "Lot identity; first-release timestamp; measured gross and tare masses; net wet mass; conformity results; opening and closing unreleased/WIP and released FG; repeat-release flag"
      collection_method: "Calibrated net weighing and receiver-specification sampling; reconcile unique whole-lot first release with stock status. Keep moisture, residual sugar, fibre/pith, foreign matter and decay methods/results with uncertainty."
      unit: "kg"
      frequency: "Each lot/movement and synchronized meter/stock close"
      temporal_coverage: "Same complete declared campaign; preserve origin periods"
      site_scope: "Named supply and receiving gates; stage/cohort scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; lot traceability; original records; uncertainty; absence evidence"
