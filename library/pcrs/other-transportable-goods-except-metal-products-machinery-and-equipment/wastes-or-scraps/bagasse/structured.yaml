measurement_rules:
  - id: reference_wet_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is net wet mass of this period's first complete conforming release. Exclude packaging, opening already-released FG, internal moves and repeat releases. Include conforming closing FG once. Delivery, dry solids, sugar content and heat are not Q."
  - id: wet_dry_bridge
    applies_to: "bagasse_in; bagasse_release"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure moisture with method and sampling basis. Dry matter = wet mass × (1 - measured wet-basis water fraction); retain a non-additive constituent ledger. Do not infer pith, residual sugar, density or yield."
  - id: raw_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Exchange-specific property"
      uuid: ""
    required_unit: "Original unit then declared row unit"
    rule: "Retain original raw units. Convert actual rate integrals, masses and measured densities first. An integrated volume is not multiplied by time again; density must match the material and state. Convert electricity kWh to MJ using 3.6 only. H is an observation window and is not another denominator."
