    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Physical exchange x = V / Q and environmental result e = A / Q are separate outputs of this one rule. V is the cohort gross physical numerator after original-unit conversion, never multiplied by burden shares. A is its independently attributed environmental-burden vector after upstream/stock responsibility and justified allocation. Each account divides its raw numerator once; neither output is fed back as a numerator. For historical delivery services use the original cohort Q, not current-period production."
      inputs:
        - V
        - A
        - Q
        - cp_release
        - cp_stock_release
        - cp_stock_delivery
      output: "x physical; e environmental"
      source_ids:
        - ilcd-allocation-2010
    - id: release_quantity
      applies_to: "bagasse_release"
      rule: "Q = sum of uniquely first-released conforming net wet lot masses in the declared period; include closing conforming FG once and exclude opening released FG, repeat release and internal movement. Q=0 retains all actual loads and stock responsibility without a unit result."
      inputs:
        - cp_release
        - cp_stock_release
        - cp_stock_delivery
      output: "Q"
      source_ids:
        - tnpl-bagasse-2025
    - id: gross_physical
      applies_to: "release; delivery"
      rule: "For each stage and the combined boundary retain gross V: opening stock + actual external inputs = closing stock + actual external outputs + explicit residual. Keep whole wet material as the main account, with non-additive dry matter/water/C/H/N/S/ash bridges as relevant. Internal Q cancels only at matched endpoints; do not add closing FG again as production. No allocation share scales V."
      inputs:
        - cp_supplier
        - cp_stock_release
        - cp_stock_delivery
        - cp_water_release
        - cp_water_delivery
        - cp_air_release
        - cp_air_delivery
        - cp_residue_release
        - cp_residue_delivery
      output: "Unallocated physical reconciliation"
      source_ids: []
    - id: water_species
      applies_to: "release; delivery"
      rule: "For molecular H2O retain opening + input + evidenced formation = closing + output + evidenced consumption + residual. Separate free/sorbed water, inlet humidity, evaporation and reaction water. Independently reconcile total physical mass and relevant elements; one residual cannot identify two unknowns. Unverified pathways or extent remain unknown."
      inputs:
        - cp_water_release
        - cp_water_delivery
        - cp_air_release
        - cp_air_delivery
        - cp_stock_release
        - cp_stock_delivery
      output: "Molecular-water and element ledgers"
      source_ids: []
    - id: burden_cohorts
      applies_to: "release; delivery"
      rule: "A carries upstream and opening-stock per-flow vectors once, plus genuine new F, minus only verified same-side duplicate X, with closing-stock carryout and actual coproduct responsibility traced. X never removes new repair water/material. Post-release storage, loading, dispatch, returns and rework use a separate cohort service ledger normalized only against the original release Q by normalize_exchange; they do not create new production or divide by time."
      inputs:
        - cp_stock_release
        - cp_stock_delivery
        - cp_activity_release
        - cp_activity_delivery
        - cp_dispatch
        - cp_pack
        - cp_release
      output: "Attributed raw A and stock carryover vectors"
      source_ids:
        - ilcd-allocation-2010
    - id: package_balance
      applies_to: "delivery"
      rule: "For each separate article apply the full cp_pack equality by ownership, stock state and movement purpose. Attached articles follow gross physical dispatch including rejected/returned loads; article production burden follows genuine purchase and cohort service attribution once."
      inputs:
        - cp_pack
        - cp_dispatch
        - cp_stock_release
        - cp_stock_delivery
      output: "Separate physical article and burden ledgers"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Native flow identity and provider compatibility are separate. Before adopting a UUID require actual query membership, complete public state100 direct object, all names/comments/CAS/route/form/state/geography/media/type/properties, and the exact property-version → unitgroup-version → reference-unit chain. A near name or an MJ label is insufficient."
      evidence: "Supplier/state records and independent identity review"
    - id: dq_coverage
      applies_to: "release; delivery"
      requirement: "Use a complete declared crushing campaign with dates and all modes; prefer a full representative season/year. Disclose shortened coverage, missing quantities and supplier gaps. Ordinary future site measurements do not fabricate an identity, and an unknown core identity does not become approved through a finite check."
      evidence: "cp_release; cp_activity_release; cp_activity_delivery; cp_stock_release; cp_stock_delivery"
    - id: dq_trace
      applies_to: "all inventory rows"
      requirement: "Retain original units, calibration, sample representativeness, detection limits, uncertainty and raw stock/burden vectors. Zero requires evidence of absence; missing values stay unknown. Every actual unlisted flow is added atomically."
      evidence: "cp_supplier; cp_water_release; cp_water_delivery; cp_air_release; cp_air_delivery; cp_residue_release; cp_residue_delivery"
validation_rules:
  - rule_id: validate_reference
    applies_to: "bagasse_release"
    rule: "Require the same wet whole-bagasse state and first-release Q in both languages, unique row link, all qualifiers and industrial receiving use. Unresolved reference identity and exact unit chain prevent complete quantitative use."
    source_ids:
      - tnpl-bagasse-2025
      - mpm-bagasse-1999
  - rule_id: validate_physical
    applies_to: "release; delivery"
    rule: "Require complete unallocated stage and combined physical ledgers, independent water/element evidence and explained residuals; retain failures, incidents, Q0, WIP/FG, stocks and historical vectors. Do not use environmental burden fractions to close mass."
    source_ids: []
  - rule_id: validate_normalization
    applies_to: "all inventory rows"
    rule: "Collection protocols contain unnormalized raw totals. Amount cards reference normalize_exchange once; its V/Q and A/Q belong to distinct physical and environmental accounts. Aggregation and downstream calculations must not divide the normalized result by Q or H again."
    source_ids: []
  - rule_id: validate_background
    applies_to: "bagasse_in; freight"
    rule: "Verify supplier status, responsibility and route before quantitative linking; do not allocate the sugar mill twice or double count the same transport leg. No default fuel export, avoided product or credit."
    source_ids:
      - ilcd-allocation-2010
      - epa-sugar-1997
  - rule_id: validate_conditional
    applies_to: "all inventory rows"
    rule: "No conditional card prescribes a positive amount or permits deletion of an actual occurrence. Document true absence; unresolved measurements remain gaps. Species, size bins, packaging, returned loads and treatment remain atomic and traceable."
    source_ids:
      - tnpl-bagasse-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input at a declared industrial lignocellulosic receiving gate before depithing/conversion, after dataset applicability review"
  allowed_use: "Only the declared untreated undepithed whole wet industrial-material state and measured wet quantity"
  excluded_use: "Fuel functionality; net heat MJ; dry mass by assumption; pulp or board m3; zero-burden waste; all sugar wastes; automatic substitution credits"
  required_metadata: "All reference qualifiers; original Q and cohort service link; supplier burden vector; full physical/stock/article ledgers; route-specific actual exchanges and provider compatibility"
  required_quality_disclosure: "Source scope and period; scientific review state; actual identity/measurement gaps; unknown emissions and stock burdens; allocation sensitivity; coverage limitations"
  update_trigger: "Changed extraction/pretreatment/state, receiver specification, supply status, allocation, utilities, storage, packaging, transport or gate"
data_sources:
  - id: "unsd-cpc3-bagasse-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, explanatory notes 30 June 2025, p.199, subclasses 39141 and 39149; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/39141"
    used_for: "Sugarcane extraction-fibre identity and neighbouring sugar-waste exclusion only; no moisture, grade, allocation or industrial route prescribed."
  - id: "tnpl-bagasse-2025"
    type: "official_guidance"
    reference: "Tamil Nadu Newsprint and Papers Limited, Tender 252613004185, 12 September 2025, pp.1,4,6–8,10–15; https://tnpl.com/wp-content/uploads/2025/09/252613004185.pdf"
    used_for: "Primary industrial procurement conditions for undepithed loose bagasse, rejection, weighing and transport-article controls. A tender is not evidence of executed delivery; no default composition, losses or loading rates."
  - id: "mpm-bagasse-1999"
    type: "literature"
    reference: "Hadli M.S., Bagasse Utilisation For Pulp Making in MPM, IPPTA Vol.11 No.2, June 1999, printed pp.5–8 and final flowsheet; https://ippta.co/wp-content/uploads/2021/01/IPPTA-112-5-9-Bagasse-Utilisation-for.pdf"
    used_for: "Mill-authored Karnataka industrial case: fresh whole wet transfer before moist depithing; separate pith, depithed/slurry and pulping states. Table 1 and flowsheet are not transferable composition/yield/energy defaults."
  - id: "epa-sugar-1997"
    type: "official_guidance"
    reference: "US EPA, AP-42 Section 9.10.1.1 Sugarcane Processing, June 1997, §§9.10.1.1.1–2 and Figure 9.10.1.1-1, pp.1–3; https://www.epa.gov/sites/default/files/2020-10/documents/c9s10-1a.pdf"
    used_for: "Qualitative sugar-mill extraction/common-output topology and potential material uses. No bagasse-specific allocation, current factory inventory or boiler emission factor adopted."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General Guide for LCA — Detailed Guidance, first edition March 2010, §7.9.2–3, printed pp.255–268 (PDF pp.275–288); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional cases requiring allocation: subdivision, exchange-specific determining physical causality, then residual common-gate market value. Not sugar-mill engineering evidence, a fixed allocation factor or full ILCD conformity claim."
