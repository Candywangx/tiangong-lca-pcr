product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.bagasse"
  classification_refs: "CPC 3.0:39141 Bagasse; narrower scope under the maintained classification decision"
  covered_products: "Whole loose wet bagasse separated after sugarcane juice extraction and supplied as industrial lignocellulosic raw material before depithing"
  excluded_products: "CPC 39149 beet pulp and other sugar wastes; cane leaves and tops; molasses and juice; isolated pith; dried or depithed bagasse; chemically treated furnish; pulp; bonded board; pellets and briquettes; boiler ash; generic biomass; fuel supply as reference function"
  representative_product: "Undepithed untreated wet sugarcane bagasse"
  production_route: "Separated mill-wet residue → collection/conveying → necessary foreign-matter removal → actual holding → first quality release → storage/loading/dispatch to declared industrial receiving gate"
  market_state: "Untreated whole wet loose material for a demonstrated industrial recipient; exact site values and receiving specification are collected, not inferred from a paper or boiler example"
functional_unit:
  what: "Provide a conforming raw whole wet bagasse lot for the named industrial material receiver"
  how_much: "1 kg net wet bagasse at first whole-lot quality release; subsequent delivery services are assigned to that original cohort"
  how_well: "Measured receiver-specific wet-state quality with moisture, dry matter, residual sugar, fibre/pith, foreign matter and storage condition; no universal limits invented"
  how_long_or_cycle: "One uniquely first-released lot within the declared complete campaign; storage and delivery dates retained separately"
  reference_flow_link: "bagasse_release"
system_boundary:
  rules:
    - rule_id: boundary_state
      applies_to: "bagasse_supply"
      rule: "Retain the declared wet whole state through the terminal gate. Do not import downstream depithing, pulping, UF-board recipes, drying or fuel conversion. Industrial suitability is a documented recipient requirement."
      source_ids:
        - mpm-bagasse-1999
        - tnpl-bagasse-2025
    - rule_id: boundary_complete
      applies_to: "release; delivery"
      rule: "Include every actual collection, conveyance, cleaning, temporary storage, quality test, loading, return, failed batch, repair, idle/start-stop and cleanup operation through the receiving gate. Add each actual unlisted input, waste, species and medium as an individual row; an unapproved operation still has a physical inventory."
      source_ids:
        - tnpl-bagasse-2025
    - rule_id: boundary_supplier
      applies_to: "bagasse_in"
      rule: "The upstream sugar mill is not assumed dedicated to bagasse. Retain its original cane/juice/bagasse/water and other common-output ledgers and the explained division between exclusive and joint stages. Inherited allocation is not repeated at receipt. Missing supplier burden provenance blocks a complete quantitative dataset."
      source_ids:
        - epa-sugar-1997
        - ilcd-allocation-2010
    - rule_id: boundary_internal
      applies_to: "release; delivery"
      rule: "Cancel first-release transfers only at matched endpoints inside the combined release/delivery boundary. Boiler diversion remains a crossing of this foreground and cancels only in a wider supplying-mill ledger that includes its actual receiving endpoint. Do not count internal bagasse as purchased fuel, saleable Q or avoided electricity/coal/wood. Preserve gross crossings and true external transfers."
      source_ids:
        - epa-sugar-1997
    - rule_id: boundary_evidence
      applies_to: "delivery"
      rule: "TNPL is a procurement-control example, not proof of executed deliveries. Its title and unloading examples do not override its more specific cover restrictions. Verify the actual signed specification for each ancillary article. Do not transfer commercial shortage tolerances as physical loss factors."
      source_ids:
        - tnpl-bagasse-2025
boundary_abstraction:
  declared_starting_condition: "Already separated whole wet bagasse at the named last-extraction outlet, before bagasse-specific collection and conditioning"
  starting_condition_role: "Burden-bearing upstream co-product input; not a zero-burden free natural resource"
  product_classification_scope: "The narrower raw wet industrial-material state within CPC 39141 only"
  recursive_input_rule: "Resolve any externally purchased same-state bagasse once against its upstream inventory. Internal release and return movements carry cohort vectors; do not recreate sugar manufacture recursively"
  upstream_dataset_requirement: "Require traceable cane cultivation and transport plus extraction/sugar-mill common-process responsibility through the supplied residue. Verify utility/material/service provider state and boundary before quantitative use"
  disclosure: "Name supplier, receiving mill, season, exact gates, common outputs, internal boiler diversion, losses, stocks, attribution, transport and treatment. A foreground starting with cane would require another complete integrated inventory and applicability review"
