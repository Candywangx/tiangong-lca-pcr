  ordinary_data_collection_requirements:
    - Actual sheet and alloy certificate; receiver operative order and Tier 1
      audit; site-specific meter/scale/assay data; exact material supply and
      treatment providers; opening/closing WIP and FG vectors; actual service
      and packaging accounts including all P/N_ext/true-ER physical receipts,
      owners, original cohorts, inherited vectors and supplier-included scopes.
      These are future foreground dataset requirements rather than fabricated
      factory values.
  method_evidence_scope: Transparent synthesis of primary sheet/forming/baling
    evidence, project-participant closed-loop evidence and receiver
    specification. No same-factory or same-SKU claim. No default
    recipe/density/yield/energy/recovery credit.
  approval_limits: Candidate authored methodology; scientific review pending;
    Chinese aligned. Publication and complete factory dataset qualification are pending.
