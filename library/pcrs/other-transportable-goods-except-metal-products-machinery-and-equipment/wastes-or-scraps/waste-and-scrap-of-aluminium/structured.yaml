allocation_rules:
  - rule_id: a_framework
    applies_to: "all processes"
    rule: "Use this hierarchy only for declared attributional multifunctional production. First establish whether scrap is a supplied secondary material co-function or a waste-treatment service using actual obligations, acceptance and economic context. Waste status alone does not establish zero upstream burden; marketability alone does not determine allocation. A Waste-treatment flow cannot silently replace the Product supply reference."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_subdivide
    applies_to: "source_fabrication; segregation_baling"
    rule: "First assign genuinely dedicated operations and exchanges to their own output; use real or justified virtual subdivision as far as feasible. Separate sheet fabrication shared by panel and clips from dedicated clip collection, preparation and baling. Keep measured physical mass partitions independent of burden assignment."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_causality
    applies_to: "each remaining shared exchange"
    rule: "For each residual exchange identify and quantify its determining physical causal relationship to each function, including upstream sheet and each utility. Demonstrate why a mass, duration or other driver actually determines that exchange. Do not assign one mass fraction to every exchange or equate metal content with causal allocation."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_residual_value
    applies_to: "unresolved common-process exchanges"
    rule: "Only the portion not resolved above may use co-function market values at the same physical separation gate, actual state and contemporary period. Derive a gate value from downstream quotations by removing actual further conditioning, baling, storage and transport differences. Do not compare a finished bale delivered to a remelter with an unfinished panel at the press. Document price basis, yields, sensitivity and unresolved cases; no fixed allocation percentage is prescribed."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_no_credit
    applies_to: "all outputs"
    rule: "Retain the upstream burden assigned by that analysis and actual dedicated preparation/treatment loads. Do not assume burden-free scrap, avoided primary aluminium, recovery yield, remelting credit or negative burden for packaging returns. Preserve the mother-product and scrap inventory-vector reconciliation."
    source_ids:
      - ilcd-2010-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_source
      process_id: "source_fabrication"
      flow_role: "sheet and parent output"
      record_type: "Measured lot records"
      raw_fields: "supplier; sheet lot; AA grade certificate; O temper; gauge; supplied film; gross/tare/substrate mass; parent panels; tool article and replacement; extra lubricant whole formulation; failures; opening/closing WIP; inherited vector"
      collection_method: "Weigh and link actual sheet-to-panel/clip production tickets; retain supplier documents and all failed cycles."
      unit: "kg"
      frequency: "each receipt and production event"
      temporal_coverage: "complete declared cohort and opening-stock history"
      site_scope: "source press shop and identified upstream suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; certificates; tool-life records; event tickets"
    - protocol_id: cp_clips
      process_id: "segregation_baling"
      flow_role: "clip transfers and preparation"
      record_type: "Measured event records"
      raw_fields: "source lot; outgoing/incoming internal ticket; gross V; oil; free water; foreign material; size; alloy; baler; rejects; tool blade; WIP states; inherited vector"
      collection_method: "Weigh segregated pieces and transfers; independently sample contamination and composition; reconcile actual bales and rejection routes."
      unit: "kg"
      frequency: "each transfer and bale"
      temporal_coverage: "complete cohort including all rejected/zero-output work"
      site_scope: "source segregation and preparing facility"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "matched transfer tickets; sampling protocol; balance evidence"
    - protocol_id: cp_utilities
      process_id: "utilities_residues"
      flow_role: "each utility and hydraulic formulation"
      record_type: "Meter and stock records"
      raw_fields: "exchange identity; equipment; meter readings; raw unit; pressure; temperature; humidity; interval; tank opening/closing; makeup; leaks; operator event; actual H"
      collection_method: "Meter actual electricity and volumes; weigh water where mass is needed; measure density independently for any conversion; log startups and idle states."
      unit: "original meter unit retained"
      frequency: "each meter interval and change event"
      temporal_coverage: "complete cohort and actual service intervals"
      site_scope: "actual production and utility boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; conditions; provider agreement; density evidence"
    - protocol_id: cp_residues
      process_id: "utilities_residues"
      flow_role: "each whole residue"
      record_type: "Weighed outlet records"
      raw_fields: "outlet lot; whole mass; source partitions; oil; water; measured species; provider; treatment; stocks; timestamps"
      collection_method: "Weigh each separate residue at its actual provider gate; keep constituent subledgers and source partitions non-additive."
      unit: "kg"
      frequency: "each outlet and stock count"
      temporal_coverage: "complete cohort including cleanup"
      site_scope: "one actual provider per whole outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; analysis; treatment receipts"
    - protocol_id: cp_emissions
      process_id: "utilities_residues"
      flow_role: "each chemical species and compartment"
      record_type: "Species-resolved monitoring"
      raw_fields: "species; CAS; phase; size; compartment; concentration; actual flow rate or integrated volume; conditions; sample interval; moisture; blank; detection limit"
      collection_method: "Use validated species-resolved measurements; integrate a genuine rate only over measured time; an already integrated volume is used once. Quantify moisture/phase independently and retain detection limits."
      unit: "kg after documented conversion"
      frequency: "each representative event and monitoring interval"
      temporal_coverage: "production plus all abnormal and service periods"
      site_scope: "actual release points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring method; calibration; speciation and phase evidence"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "each packaging article"
      record_type: "Material and stock records"
      raw_fields: "article j; specification; actual purchased receipt P; first non-purchase receipt N_ext; true return ER with original outward history; event id; ownership; original cohort; inherited exchange vector; supplier-included scope; incremental rental/return service; opening/closing empty; opening/closing attached WIP; opening/closing attached FG; opening/closing reusable; gross shipment S; outward return EO; waste W; internal reuse"
      collection_method: "Weigh each material by mutually exclusive stock state; measure each named article receipt interface and keep P/N_ext/ER mutually exclusive; reconcile all first physical receipts including supplier-with-goods and attached components with gross shipment/return tickets; measure configuration-specific article mass for counts."
      unit: "kg"
      frequency: "each receipt dispatch return and stock closure"
      temporal_coverage: "whole manufacturing cohort and original FG service history including every external first receipt and true return"
      site_scope: "incoming sheet and outgoing article boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "material register; tare measurements; external return receipts"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "unique first accepted clipping mass"
      record_type: "Quality release records"
      raw_fields: "unique lot; alloy; source; specification revision; buyer acceptance; current Tier 1 audit; dimensions; contamination; gross; tare; oil; free water; net Q; timestamp; rejected status"
      collection_method: "Use calibrated weighing with independent contamination measurements and receiver-specific quality evidence; mark the unique first release once."
      unit: "kg"
      frequency: "each first release or rejection"
      temporal_coverage: "complete manufacturing cohort"
      site_scope: "one declared release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "release register; buyer approval; calibration; duplicate-ticket check"
    - protocol_id: cp_service
      process_id: "storage_dispatch"
      flow_role: "original-cohort service"
      record_type: "Physical stock and event records"
      raw_fields: "original Q_c; cohort; opening/closing FG; gross V received/dispatched; shipment id; external returns; original reversal; actual H; storage; repack; rework; incremental exchange vector"
      collection_method: "Reconcile physical FG separately from first production; log actual service and return/rework loads to the original cohort; preserve original manufacturing burden."
      unit: "original unit and kg"
      frequency: "each service interval shipment and return"
      temporal_coverage: "from original first release through declared service interval"
      site_scope: "actual storage loading and dispatch boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "FG tickets; dispatch/return trail; event meters"
    - protocol_id: cp_allocation
      process_id: "source_fabrication"
      flow_role: "shared exchange burden attribution"
      record_type: "Causal and value records"
      raw_fields: "exchange x; dedicated driver; subdivision evidence; physical causality; residual share; same separation gate; actual output state; contemporary price; downstream deductions; sensitivity"
      collection_method: "Test dedicated and virtual subdivision then exchange-specific determining physical causality; collect same-gate values only for the genuinely unresolved remainder."
      unit: "original exchange unit and value basis"
      frequency: "each route and allocation-period change"
      temporal_coverage: "same cohort and contemporary value period"
      site_scope: "common source-process gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "causality evidence; matched values; independent reviewer decision"
  calculation_rules:
    - id: c_raw_units
      applies_to: "all inventory rows"
      rule: "U_x = measured original amount converted once to the declared numerator unit. Integrate an actual rate over its observed interval; do not multiply an integrated meter volume by time. Density belongs to the same substance and measured state."
      inputs:
        - raw_amount
        - raw_unit
        - observed_interval
        - conversion_evidence
      output: "U_x"
      source_ids:
        - novelis-scrap-rev11
    - id: c_attributed_vector
      applies_to: "all inventory rows"
      rule: "For burden-bearing exchanges A_x = inherited opening-WIP burden realised in this cohort + actual dedicated current burden + causally assigned current shared burden + justified residual-value share + assigned incremental rework burden. Carry unrealised closing-WIP vectors forward; reconcile each exchange with mother-product and other actual destinations."
      inputs:
        - U_x
        - opening_WIP_vector
        - closing_WIP_vector
        - subdivision_evidence
        - causal_evidence
        - residual_gate_values
        - rework_vector
      output: "A_x"
      source_ids:
        - ilcd-2010-allocation
    - id: c_unique_q
      applies_to: "released_clips"
      rule: "Q = sum of unique first accepted net dry whole-AA5754-clipping release weights. No dispatch or repeated inspection is added. If Q = 0 retain every actual burden and issue no unit result."
      inputs:
        - first_release_tickets
        - net_whole_alloy_mass
        - unique_lot_ids
      output: "Q"
      source_ids:
        - novelis-scrap-rev11
    - id: c_normalize_once
      applies_to: "all inventory rows"
      rule: "For Q > 0 use I_x = A_x / Q once for 1 kg reference flow. For physical bookkeeping substitute the unallocated whole physical numerator N_x in this same operation and keep its results distinct from burden I_x. For later service substitute only A_service,x and original Q_c in this same operation. All card amount and protocol target-basis fields refer to this result; neither is an additional division. H is an observed service driver and never a production denominator."
      inputs:
        - A_x
        - N_x
        - Q
        - A_service_x
        - Q_c
      output: "I_x"
      source_ids:
        - ilcd-2010-allocation
    - id: c_physical_gates
      applies_to: "all processes"
      rule: "For each declared physical control volume: opening physical stock + actual external inputs + external returns = closing physical stock + every external Product/Waste outlet + real elementary releases. In the manufacturing gate newly released gross V and mother panels leave to FG/service; at the service gate the same V is an input. Cancel only matching internal transfers on consolidation. If another external exchange X exists add it on its true side; deduplicate an OTHER component only for that exact same-side physical entry."
      inputs:
        - physical_stocks
        - whole_external_inputs
        - whole_external_outputs
        - gross_V
        - matched_internal_tickets
        - elementary_releases
      output: "physical_balance"
      source_ids:
        - novelis-scrap-rev11
    - id: c_gross_and_elements
      applies_to: "all metal-bearing rows"
      rule: "V = net dry whole-alloy substrate + separately measured free water + oil + removable foreign matter for the same physical lot. Element e = sum of measured constituent mass times its measured e fraction, including actual chemical species. Preserve natural oxide with its actual phase; do not convert all substrate into pure Al or equate assay with chemical mass. A single balance residual cannot estimate two unknown water/oil/species quantities."
      inputs:
        - whole_lot_mass
        - independent_water
        - independent_oil
        - independent_foreign_matter
        - independent_speciation
        - element_assay
      output: "gross_V_and_element_balances"
      source_ids:
        - novelis-scrap-rev11
    - id: c_fg_service
      applies_to: "storage_dispatch"
      rule: "Opening FG gross V + newly released gross V + external return received = closing FG gross V + gross dispatched V + other actual external material outlets. Closing FG includes the newly produced Q cohort. Preserve original shipment reversal and inherited manufacturing vector on returns; apply only actual incremental service burden to original Q_c."
      inputs:
        - opening_FG
        - newly_released_V
        - returned_V
        - closing_FG
        - dispatched_V
        - external_outlets
        - original_shipment_id
        - cohort_vector
      output: "FG_service_balance"
      source_ids:
        - novelis-scrap-rev11
    - id: c_pack_balance
      applies_to: "packaging"
      rule: "Apply b_pack independently to each article j in kg. Count S_j on every gross physical dispatch; reconcile all P, N_ext and true ER events at this same physical gate. Never classify a first non-purchase receipt as ER, use opening stock for a current receipt or omit attached components. Internal stock/WIP/FG issues cancel. Preserve ownership, original cohort and inherited exchange vectors, supplier-included scope and actual incremental rental/return service independently; no zero-burden, new-Q or credit inference. The whole article receipt includes its supplied components once."
      inputs:
        - opening_packaging_states
        - P_j
        - N_ext_j
        - ER_j
        - closing_packaging_states
        - S_j
        - EO_j
        - W_j
      output: "per_article_packaging_balance"
      source_ids:
        - novelis-scrap-rev11
  data_quality_requirements:
    - id: dq_scope
      applies_to: "all processes"
      requirement: "Trace one alloy/source/sheet state through real manufacture to first supply release; no purchased-scrap-only boundary."
      evidence: "supplier lot certificate and linked process tickets"
    - id: dq_native
      applies_to: "all bound rows"
      requirement: "Verify all native conditions and actual provider compatibility; unavailable identity is distinct from a measured zero."
      evidence: "full native records and supplier compatibility evidence"
    - id: dq_measurement
      applies_to: "all rows"
      requirement: "Retain calibration, uncertainty, detection limits, original units, actual time/conditions and independent oil/water/species measurements."
      evidence: "meter and analytical records"
    - id: dq_history
      applies_to: "WIP and FG"
      requirement: "Retain opening and closing material states plus every inherited exchange vector and original return/dispatch trail."
      evidence: "lot ledger and vector reconciliation"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Retain abnormal/zero-output work; identify and add every actual exchange. Unknown applicability or history blocks a complete dataset rather than being silently zero."
      evidence: "signed completeness register with unresolved cases"
    - id: dq_evidence
      applies_to: "method interpretation"
      requirement: "This is a transparent technical synthesis across supplier sheet identity, generic aluminium forming, a historical closed-loop case and a receiver specification. It is not a same-SKU factory measurement or scientific approval."
      evidence: "source-specific scope and independent review"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference product"
    rule: "Require one complete reference object, explicit released_clips link and all ordered qualifiers. The verified Product supply identity must match unmelted baled single-grade clips; no Waste, ingot, hydrometallurgical product, rod/profile or post-consumer substitution."
    source_ids:
      - rema-tooth-2026
      - novelis-scrap-rev11
  - rule_id: v_gate
    applies_to: "release"
    rule: "Check actual alloy, dimensions, contamination, independent free water/oil, operative receiver approval and Tier 1 conditions. A search hit, source case or fixed specification range is not a released factory lot."
    source_ids:
      - novelis-scrap-rev11
  - rule_id: v_balance
    applies_to: "all processes"
    rule: "Close manufacturing, FG/service and consolidated physical gates; independently close relevant elemental and species ledgers and every packaging account using opening + P + N_ext + ER = closing + gross S + EO + W for each exact article and physical gate. Check named atomic receipt interfaces and measured direction/amount for purchased, supplier-with-goods, first entrusted/borrowed/rented and true-return events; missing actual interfaces or receipt history block dataset completeness. Neither allocation nor Q can repair missing physical matter. Unknown mass/speciation relationships remain unresolved."
    source_ids:
      - eaa-cutting-2002
      - ilcd-2010-allocation
  - rule_id: v_normalization
    applies_to: "all inventory rows"
    rule: "Verify raw original-unit conversion and burden attribution before the single A_x/Q operation; Q and service Q_c stay identical across all fields and languages. Q = 0 has no unit result. Closing FG is not added to first-release Q."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: v_allocation
    applies_to: "shared exchanges"
    rule: "Require evidence for dedicated/subdivision and exchange-specific causality before residual same-gate economic allocation; retain sensitivity and mother-product vector reconciliation. No automatic zero scrap burden or recycling credit."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: v_inventory
    applies_to: "all inventory rows"
    rule: "Confirm one atomic exchange per row, whole supplied formulation once, one provider per whole mixed outlet, exact property/unit chain and full native restrictions in consumer context. Add actual unlisted materials/species; an auxiliary UUID gap remains explicit."
    source_ids:
      - eaa-forming-2002
      - tower-aluminium-lubrication
  - rule_id: v_history
    applies_to: "WIP and FG"
    rule: "Reject a complete inventory claim when inherited WIP vectors, FG history, return reversal, actual H or complete purchased/non-purchase/true-return physical receipt and gross-shipment packaging records are missing. Preserve P/N_ext/ER exclusivity, original outward history for ER, owner and original cohort, inherited per-exchange vectors, supplier-included scope and actual incremental rental/return service with one burden assignment. Reinspection and rework of released material do not create new production."
    source_ids:
      - novelis-scrap-rev11
      - ilcd-2010-allocation
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Single-grade unmelted aluminium feed input to a real downstream recovery process subject to applicability review"
  allowed_use: "Use only with fully verified boundary/native identity/grade/receiver gate/burden attribution"
  excluded_use: "All-aluminium-scrap average; primary metal or ingot substitution; recovery/savings guarantee; replacement of Product supply by Waste treatment"
  required_metadata: "All §3 qualifiers; original bases and providers; same-gate allocation; WIP/FG histories; Q and actual H; every packaging account"
  required_quality_disclosure: "Measured/calculated/unknown distinctions; native restrictions; gaps; uncertainty; Q0; no scientific-approval claim"
  update_trigger: "Grade/supplied-state change; process/receiver-specification change; native/provider change; allocation or measurement-basis change"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division CPC 3.0 explanatory notes 30 June 2025 pp203–205 https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context only. The aluminium scrap leaf does not establish grade or a production method."
  - id: "eaa-cutting-2002"
    type: "handbook"
    reference: "European Aluminium Association Aluminium Automotive Manual Manufacturing Cutting version 2002 §§2.3.1–2.3.5 pp26–35 https://european-aluminium.eu/wp-content/uploads/2022/11/aam-manufacturing-2-cutting.pdf"
    used_for: "Cold sheet blanking/trimming/piercing and sliver formation. The 6016 trimming image and extrusion example are countercontexts rather than AA5754 measurements. No numeric settings adopted."
  - id: "eaa-forming-2002"
    type: "handbook"
    reference: "European Aluminium Association Aluminium Automotive Manual Manufacturing Forming version 2002 §3.2 pp3 and 16–32 https://european-aluminium.eu/wp-content/uploads/2022/11/aam-manufacturing-3-forming.pdf"
    used_for: "Aluminium sheet forming with suitable tooling and lubrication; actual handling and interruptions. Tool coating options and lubricant graphs do not specify this plant or an LCA allocation."
  - id: "tk-5754-sheet"
    type: "handbook"
    reference: "thyssenkrupp Materials UK Information on Aluminium 5754 https://www.thyssenkrupp-materials.co.uk/aluminium-5754.html"
    used_for: "EN AW-5754 sheet and O temper identity. Retain separate rod/tube tables and guidance-only physical properties; do not adopt density or composition as a measured lot recipe."
  - id: "novelis-realcar-2020"
    type: "extension_guidance"
    reference: "Novelis Jaguar Land Rover case study 14 April 2020 https://novelis.com/case-studies/jaguar-land-rover/"
    used_for: "Primary supplier evidence of 5754 RC automotive sheet and stamping scrap return. Recycled shares and savings remain case claims rather than foreground factors."
  - id: "innoval-realcar-2016"
    type: "extension_guidance"
    reference: "Innoval Technology Geoff Scamans REALCAR 17 February 2016 https://www.innovaltec.com/realcar-blog/"
    used_for: "Project-participant evidence of pressing and alloy-family segregation with return to Novelis Latchford. A family-separated case does not prove a particular single-AA5754 lot; no price or scrap percentage transferred."
  - id: "rema-tooth-2026"
    type: "standard"
    reference: "ReMA ISRI Specifications January 2026 Nonferrous Scrap Tooth and adjacent entries printed p10 PDF p14 https://www.isrispecs.org/wp-content/uploads/2026/01/2026-January-ReMA_ISRI_Specifications.pdf"
    used_for: "Tooth defines single specified alloy new clippings; distinguish mixed Tough and cast/extruded Tread and dross Thirl. Contractual specification gates only."
  - id: "novelis-scrap-rev11"
    type: "standard"
    reference: "Novelis Scrap Quality Specification Revision 11 26 September 2019 §§2–5 including Tier 1 bale §5.2 and non-Tier 1 §5.3 https://b2b.mps.novelis.com/_assets/content/ScrapQualitySpecificationsRev11-092619.pdf"
    used_for: "Receiver-specific contamination/identification and bale acceptance. Verify the operative purchase order and current Tier 1 audit; this edition is not universal contemporary acceptance."
  - id: "bronneberg-aluminium-baling"
    type: "extension_guidance"
    reference: "Bronneberg Aluminium Recycling https://www.bronneberg-recycling.co.uk/solutions/aluminium-recycling/"
    used_for: "Homogeneous aluminium scrap baling and electric equipment as technical route evidence. Installed power is not measured energy or proof of a particular factory installation."
  - id: "tower-aluminium-lubrication"
    type: "extension_guidance"
    reference: "Tower Metalworking Fluids Lubrication Advice for Forming Aluminum https://www.towermwf.com/lubrication-advice/"
    used_for: "Actual 5754 forming case and incompatible lubricant alternatives; collect the whole supplied formulation and actual constituents. No universal dilution or VOC species inferred."
  - id: "ilcd-2010-allocation"
    type: "official_guidance"
    reference: "European Commission JRC ILCD Handbook General guide Detailed guidance first edition March 2010 §§7.9.2–7.9.3 printed pp255–272 PDF pp275–292 https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctional-process hierarchy with dedicated/virtual subdivision then exchange-specific determining physical causality then residual same-gate economic value. Industrial documents do not supply this allocation rule."
