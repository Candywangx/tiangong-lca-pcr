system_boundary:
  rules:
    - rule_id: b_source
      applies_to: "source_fabrication"
      rule: "Begin with one supplied prelubricated AA5754-O sheet lot. Include actual blanking/stamping/trimming/piercing, source collection, necessary dry mechanical preparation, baling, quality acceptance and their utilities, maintenance and rejects. Match the upstream sheet state; do not start with purchased already-formed scrap."
      source_ids:
        - eaa-cutting-2002
        - eaa-forming-2002
        - tk-5754-sheet
    - rule_id: b_grade
      applies_to: "all processes"
      rule: "Keep only one AA5754 grade and source state. Do not combine RC5754 case material, other 5xxx grades, 6xxx grades, old cans, foil laminates, cast scrap, dross, ash or remelt ingot. A family-separated historical case supports process existence but not single-grade batch identity."
      source_ids:
        - innoval-realcar-2016
        - novelis-realcar-2020
        - un-cpc3-2025
    - rule_id: b_tooth
      applies_to: "release"
      rule: "For the selected Tooth-like new-clipping route require one specified alloy; clean uncoated/unpainted solids; original specification thickness .015 inch (.38 mm) minimum; no hair wire/wire screen/dirt/non-metal items; oil plus grease no more than 1%; no punchings below 1/2 inch (1.27 cm). Measure and segregate undersize slugs. These are acceptance limits rather than default actual thickness or oil content."
      source_ids:
        - rema-tooth-2026
    - rule_id: b_receiver
      applies_to: "release"
      rule: "Representative receiver is Novelis Oswego under an operative buyer-approved Tier 1 bale arrangement. Revision 11 §§2–5 is the explicit evidence baseline, not a current order. Verify the current order, actual single-alloy approval and current contamination/moisture audit. Reject water-trapping forms, wet or broken bales, dross, fines, unknown powders, salts/oxidizers, closed containers, aluminium-lithium alloy, radioactive/PCB contamination and other listed foreign/unsafe materials. No painted/lacquered/coated scrap; process oil limited to 1% of scrap weight. Labels must agree with heat number, alloy and gross/tare/net weights."
      source_ids:
        - novelis-scrap-rev11
    - rule_id: b_bale
      applies_to: "segregation_baling; release"
      rule: "For that Tier 1 route apply §5.2: bale dimensions 24×24×48 to 48×48×60 inch; bulk density greater than 20 lb/ft3; fiber or steel banding accepted for the actual alloy; no skids or visually obstructing wraps; individual bale maximum 6000 lb; roof clearance at least 6 inch; Oswego stack less than 11500 lb. Dump-truck delivery needs explicit purchase-order arrangements. Mark each bale weight and alloy. Confirm the original receiver document and buyer interpretation of dimension ranges. Do not substitute briquette §5.1 or non-Tier 1 §5.3 density/approval conditions; those are distinct routes and the document cross-reference wording needs receiver clarification."
      source_ids:
        - novelis-scrap-rev11
    - rule_id: b_no_thermal
      applies_to: "all processes"
      rule: "No remelting, refining, decoating, chemical washing or wet scrap cleaning is included in this selected dry route. If contamination cannot pass as prepared, retain a rejected outlet; a materially different treatment route needs separate reviewed applicability and all actual inputs/outputs. Downstream recovery and substitution are outside the foreground supply gate."
      source_ids:
        - eaa-cutting-2002
        - novelis-scrap-rev11
    - rule_id: b_q
      applies_to: "release; storage_dispatch"
      rule: "Q is the sum of unique first released net dry whole-alloy clipping weights for the manufacturing cohort. Closing FG already contains newly released Q. Dispatch, reweighing, acceptance recheck and return/rework never create Q again. Keep a separate service account with original Q_c and actual H."
      source_ids:
        - novelis-scrap-rev11
    - rule_id: b_all_events
      applies_to: "all processes"
      rule: "Include failed batches, zero-output attempts, start/stop, idle, cleanup, tests, rework and all opening/closing WIP. Carry each inherited exchange vector by lot and state. Missing history is unresolved, not zero burden. Track upstream stock already embodied in rework without rebuying it."
      source_ids:
        - ilcd-2010-allocation
    - rule_id: b_atomic
      applies_to: "all processes"
      rule: "Each card is one actual exchange. Conditional means evidence-based applicability rather than presumed zero. Before dataset completion add every actual material/formulation, gas, fuel, coolant, sharpening consumable, label-printing consumable, waste and species not enumerated here as its own named row. One mixed physical outlet has one whole amount and one provider; source/composition subledgers do not add another outlet."
      source_ids:
        - eaa-forming-2002
        - tower-aluminium-lubrication
    - rule_id: b_pack
      applies_to: "packaging; storage_dispatch"
      rule: "For each packaging material j enforce O_empty,j + O_WIP,j + O_FG,j + O_reusable,j + P_j + N_ext,j + ER_j = C_empty,j + C_WIP,j + C_FG,j + C_reusable,j + S_j + EO_j + W_j. Categories are mutually exclusive stocks. S_j is packaging on gross physical shipments including redispatch, not net Q. P is actual purchase, N_ext is first non-purchase external physical receipt including supplier-with-goods and first entrusted/borrowed/rented articles, and ER is a true return with original outward history. These are mutually exclusive event classes. Measure every article using its named material/form/type/direction receipt interface; a missing actual interface blocks dataset completeness. Opening stock cannot replace current receipts; internal stock/WIP/FG issues cancel. EO is actual outward return. Track ownership, original cohort, each inherited exchange vector, supplier-included scope and incremental rental/return service independently and assign burden once. No packaging is added to Q, repurchased on reuse, or automatically treated as coproduct."
      source_ids:
        - novelis-scrap-rev11
    - rule_id: b_native
      applies_to: "all inventory rows"
      rule: "Before binding any flow/provider verify actual Product/Waste/Elementary function, supplied state, grade, route, geography, voltage, compartment and exact property/unit chain. All flow UUIDs remain unresolved; a generic name or matching mass property cannot establish identity or provider compatibility."
      source_ids:
        - ilcd-2010-allocation
