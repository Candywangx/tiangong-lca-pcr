allocation_rules:
  - rule_id: allocation_subdivide_chemistry_route
    applies_to: "Mixed chemistries, routes, and operating lines"
    rule: "First subdivide records by chemistry, configuration, safety route, preparation state, and recovery technology whenever metering or batch records permit."
    source_ids:
      - iso-14044-2006
      - eu-waste-battery-recycling-2025-606
  - rule_id: allocation_preserve_direct_measurement
    applies_to: "Separately measured inputs and outputs"
    rule: "Assign directly measured batch inputs, outputs, emissions, residues, and storage changes to that batch before allocating shared burdens."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_operations
    applies_to: "Shared collection, storage, utilities, and pollution control"
    rule: "When subdivision is not feasible, use a documented physical relationship that reflects causality; mass may be used only when it is a reasonable proxy, and the chosen basis and sensitivity must be disclosed."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_output_status
    applies_to: "Black mass, metals, salts, plastics, and residues"
    rule: "Do not treat an intermediate fraction as a final co-product merely because it has market value. Apply product or co-product treatment only after its gate, specification, destination, and waste or end-of-waste status are documented."
    source_ids:
      - eu-batteries-reg-2023-1542
      - eu-waste-battery-recycling-2025-606
  - rule_id: allocation_no_automatic_credit
    applies_to: "Recycling benefits and recovered-material substitution"
    rule: "Do not embed avoided virgin-material production, recycled-content credit, or downstream battery-manufacturing credit in the foreground inventory by default. Any substitution, system expansion, or circular-footprint method belongs to the declared downstream study and must avoid double counting."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_negative_value_waste
    applies_to: "Fees, negative-value wastes, and paid treatment"
    rule: "Price sign does not determine physical flow type or burden allocation. Record waste-management service, material flow, and any recovered outputs separately, then disclose the study-specific allocation convention."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_collection_route
      process_id: "collection_and_transport"
      flow_role: "collected and delivered battery mass; route service"
      record_type: "weighbridge or calibrated scale records; route logs; load manifests"
      raw_fields: "load_id; origin; destination; battery chemistry; safety status; loaded_mass_kg; delivered_mass_kg; vehicle_or_mode; distance_km; packaging; incident_or_loss"
      collection_method: "Link each load manifest to weighing and route evidence; calculate each leg separately"
      unit: "kg; km; tkm"
      frequency: "every load and route leg"
      temporal_coverage: "entire declared collection period"
      site_scope: "all controlled collection points and vehicles"
      aggregation_rule: "Sum mass by lot and tkm by mode; report losses and rejected loads separately"
      quality_evidence: "scale calibration; route record; chain-of-custody manifest; incident log"
    - protocol_id: cp_receipt_batch
      process_id: "receipt_characterization"
      flow_role: "received, accepted, segregated, and rejected fractions"
      record_type: "receipt log; scale record; inspection and sorting record"
      raw_fields: "lot_id; receipt_time; supplier; origin; gross_mass_kg; net_battery_mass_kg; chemistry; configuration; state_of_charge_or_safe_state; damage; leakage; temperature_event; accepted_mass_kg; reject_mass_kg; destination"
      collection_method: "Weigh at receipt, inspect before mixing, and retain chemistry and safety routing decisions by sub-lot"
      unit: "kg; mass fraction; descriptive state"
      frequency: "every received lot"
      temporal_coverage: "entire declared reporting period"
      site_scope: "every receiving and storage area in scope"
      aggregation_rule: "Reconcile received mass to accepted sub-lots, rejects, and measured storage change"
      quality_evidence: "calibration certificate; photographs or inspection record; chemistry evidence; waste manifest; storage ledger"
    - protocol_id: cp_preparation_batch
      process_id: "preparation_for_recycling"
      flow_role: "prepared battery fraction; removals; preparation energy"
      record_type: "batch traveler; scale records; meter and purchase records; safety log"
      raw_fields: "batch_id; input_mass_kg; chemistry; initial_safe_state; discharge_or_conditioning_method; dismantling_steps; output_mass_kg; removal_type; removal_mass_kg; electricity; fuel; incident; storage_change"
      collection_method: "Record every preparation operation and weigh the input, prepared output, and separated removals"
      unit: "kg; kWh; fuel unit; descriptive state"
      frequency: "every batch, with meters read at batch or justified campaign level"
      temporal_coverage: "entire declared preparation campaign"
      site_scope: "all preparation equipment and controlled storage in scope"
      aggregation_rule: "Allocate campaign utilities after subdivision using the disclosed physical driver; preserve direct batch measurements"
      quality_evidence: "scale and meter calibration; batch traveler; safety authorization; removal destination record"
    - protocol_id: cp_mechanical_balance
      process_id: "mechanical_preprocessing"
      flow_role: "mechanical feed, operating inputs, product fractions, and waste fractions"
      record_type: "batch production record; scales; meters; laboratory analysis; dispatch record"
      raw_fields: "batch_id; chemistry; feed_mass_kg; feed_moisture; safe_state; electricity; auxiliary_input; output_fraction_id; output_mass_kg; moisture; composition; status; destination; storage_change"
      collection_method: "Weigh all feeds and outputs and link representative composition and moisture samples to the same batch"
      unit: "kg; kWh; auxiliary unit; mass fraction"
      frequency: "every batch; continuous meter totals reconciled at least per campaign"
      temporal_coverage: "entire declared mechanical-processing campaign"
      site_scope: "all shredding, crushing, separation, dust-control, and storage units in scope"
      aggregation_rule: "Report each output fraction separately; reconcile input, additions, outputs, captured residues, direct releases, and storage change"
      quality_evidence: "scale and meter calibration; sampling plan; laboratory QA; dispatch or acceptance document"
    - protocol_id: cp_mechanical_emissions
      process_id: "mechanical_preprocessing"
      flow_role: "direct particulate and volatile releases"
      record_type: "stack or workplace exhaust monitoring; flow-meter records; analytical reports"
      raw_fields: "source_id; substance; compartment; concentration; carrier_flow; duration; control_device; captured_mass; detection_limit"
      collection_method: "Calculate emitted mass from paired concentration and carrier-flow records or use direct validated mass monitoring"
      unit: "kg substance; concentration; volume"
      frequency: "each compliance test and continuous period where available"
      temporal_coverage: "representative of the declared campaign and operating state"
      site_scope: "every direct environmental release point in scope"
      aggregation_rule: "Integrate by operating time; report non-detect treatment and captured mass separately"
      quality_evidence: "accredited analysis; instrument calibration; sampling conditions; control-device log"
    - protocol_id: cp_recovery_balance
      process_id: "material_recovery"
      flow_role: "recovery feed, reagents, energy, recovered products, residues, and storage"
      record_type: "batch records; scales; tank measurements; meters; purchase and dispatch records; laboratory analysis"
      raw_fields: "batch_id; route; chemistry; feed_mass_wet; feed_mass_dry; moisture; reagent; reagent_amount; energy; water; output_id; output_mass; composition; purity; waste_or_product_status; destination; storage_change"
      collection_method: "Link all input and output records to the declared recovery batch and preserve elemental or compound analyses used in recovery calculations"
      unit: "kg; kg dry matter; kWh; m3; mass fraction"
      frequency: "every batch; continuous meters reconciled at least per campaign"
      temporal_coverage: "entire declared recovery campaign"
      site_scope: "all controlled recovery, purification, refining, and storage units in scope"
      aggregation_rule: "Reconcile wet and dry bases separately; do not count added reagents as battery-derived recovered material"
      quality_evidence: "calibration; laboratory QA; material acceptance; dispatch record; inventory reconciliation"
    - protocol_id: cp_recovery_emissions
      process_id: "material_recovery"
      flow_role: "direct air, water, and soil releases"
      record_type: "stack, effluent, and other environmental monitoring records"
      raw_fields: "source_id; substance; compartment; concentration; carrier_flow; duration; control_device; captured_mass; detection_limit"
      collection_method: "Calculate released mass from validated concentration and carrier-flow records or direct mass monitoring"
      unit: "kg substance; concentration; volume"
      frequency: "each compliance test and continuous period where available"
      temporal_coverage: "representative of the declared route and operating state"
      site_scope: "every direct environmental release point in scope"
      aggregation_rule: "Integrate by operating time and separate captured material from environmental releases"
      quality_evidence: "accredited analysis; instrument calibration; sampling conditions; treatment-system log"
  calculation_rules:
    - id: calc_collection_tkm
      applies_to: "Each collection route leg"
      rule: "tonne-kilometre = delivered battery mass in tonnes multiplied by measured one-way distance in kilometres; empty return travel is a separate declared assumption or record"
      inputs:
        - delivered_mass_kg
        - distance_km
        - "route leg"
        - "vehicle or mode"
      output: "tkm by route leg and mode"
      source_ids: []
    - id: calc_net_battery_mass
      applies_to: "Receipt and preparation"
      rule: "net battery mass = measured gross lot mass minus separately measured transport packaging, unrelated equipment, and other declared non-battery attachments; do not remove battery casing or electrolyte unless the chosen basis explicitly requires it"
      inputs:
        - gross_mass_kg
        - "excluded_component_mass_kg by component"
      output: "net_battery_mass_kg with inclusion list"
      source_ids:
        - eu-waste-battery-recycling-2025-606
    - id: calc_chemistry_share
      applies_to: "Mixed received lot"
      rule: "chemistry mass fraction = measured or sampled mass assigned to a chemistry divided by total classified battery mass; retain unclassified mass as its own share"
      inputs:
        - chemistry_mass_kg
        - classified_battery_mass_kg
        - unclassified_mass_kg
      output: "chemistry shares and unclassified share"
      source_ids:
        - eu-waste-battery-recycling-2025-606
    - id: calc_process_mass_balance
      applies_to: "Each foreground process and campaign"
      rule: "reconcile measured inputs plus opening inventory with measured outputs plus closing inventory and recorded direct releases; report the signed unresolved difference without forcing it to zero"
      inputs:
        - "input masses"
        - "output masses"
        - "captured wastes"
        - "direct releases"
        - "opening and closing inventory"
      output: "mass-balance statement and unresolved difference"
      source_ids:
        - eu-waste-battery-recycling-2025-606
    - id: calc_battery_derived_output
      applies_to: "Recovery claims"
      rule: "quantify only the element or compound mass demonstrably derived from battery input; added reagents, atmospheric oxygen, water, and non-battery impurities remain separately identified according to the applicable method"
      inputs:
        - "dry input composition"
        - "output mass and composition"
        - "reagent additions"
        - "impurity and moisture records"
      output: "battery-derived recovered mass by element or compound"
      source_ids:
        - eu-waste-battery-recycling-2025-606
    - id: calc_route_intensity
      applies_to: "Process energy, water, reagent, emission, and residue rows"
      rule: "normalized amount = measured or calculated campaign amount divided by the mass basis declared for that process; preserve the original measurement and basis conversion"
      inputs:
        - "campaign amount"
        - "process input or output mass"
        - "time and storage reconciliation"
      output: "amount per declared process basis"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Every reference lot and sub-lot"
      requirement: "Preserve supplier or holder, collection origin, waste-status basis, chemistry evidence, configuration, preparation state, and unique lot linkage."
      evidence: "Waste manifest, chain-of-custody record, inspection record, label or analytical evidence"
    - id: dq_safety_state
      applies_to: "Batteries before transport, storage, dismantling, or shredding"
      requirement: "Document state of charge or verified safe state, damage and leakage condition, terminal protection, isolation, thermal-event history, and routing decision; do not infer safety from chemistry name alone."
      evidence: "Safety inspection, voltage or state-of-charge measurement, incident record, packaging record"
    - id: dq_mass_traceability
      applies_to: "All foreground processes"
      requirement: "Retain calibrated mass records for inputs, outputs, rejects, residues, transfers, and inventory changes; disclose every unresolved mass-balance difference rather than reallocating it."
      evidence: "Calibration certificates, batch balances, storage ledger, dispatch records"
    - id: dq_chemistry_representativeness
      applies_to: "Mixed lots and sampled composition"
      requirement: "State sorting coverage, sampling design, laboratory method, detection limits, sample dates, and unclassified share; do not use a chemistry-specific inventory as a generic category average."
      evidence: "Sorting log, sampling plan, laboratory QA report, representativeness assessment"
    - id: dq_output_status
      applies_to: "Black mass and all recovered or residual fractions"
      requirement: "Retain composition, moisture, specification, destination, acceptance documentation, and waste, intermediate, product, or end-of-waste status at the declared gate."
      evidence: "Laboratory certificate, sales or acceptance specification, waste transfer note, regulatory determination where applicable"
    - id: dq_temporal_technology_scope
      applies_to: "Site and route dataset"
      requirement: "Report actual operating period, throughput, technology configuration, control equipment, downtime, abnormal events, and whether records are batch, campaign, or annual; no minimum coverage is assumed silently."
      evidence: "Operating log, production report, maintenance and incident records"
    - id: dq_source_and_method_currency
      applies_to: "Legal, safety, recycling-efficiency, and recovery claims"
      requirement: "Identify the jurisdiction, method edition, applicability date, and calculation scope used; a PCR source supports modelling structure but does not by itself prove regulatory compliance."
      evidence: "Applicable legal text or method, dated compliance assessment, calculation workbook"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "Reference flow"
    rule: "Fail conformance if waste status, chemistry or mix, configuration, charge or safe state, condition, included mass components, collection origin, preparation state, or intended route is missing."
    source_ids:
      - unsd-cpc-3-2025
      - us-epa-used-lib-safety
  - rule_id: validation_flow_type_status
    applies_to: "Incoming and outgoing technosphere flows"
    rule: "Verify Tiangong flow type and UUID independently from waste, product, intermediate, or end-of-waste status; require documentary status evidence for every outgoing secondary material."
    source_ids:
      - eu-batteries-reg-2023-1542
      - eu-waste-battery-recycling-2025-606
  - rule_id: validation_chemistry_route
    applies_to: "Process inventory"
    rule: "Reject undisclosed averaging across materially different chemistries, configurations, charge states, or recovery routes; retain an unclassified share when evidence is incomplete."
    source_ids:
      - eu-waste-battery-recycling-2025-606
  - rule_id: validation_collection_safety
    applies_to: "Collection, transport, receipt, and storage"
    rule: "Require lot-level safety assessment and documented protection or isolation before handling; lithium-ion batteries must not be modelled as ordinary municipal recycling."
    source_ids:
      - us-epa-used-lib-safety
  - rule_id: validation_preparation_recycling_split
    applies_to: "Process boundary"
    rule: "Verify that collection, sorting, storage, handling, dismantling, and other preparation steps are not silently merged with recycling when the applicable calculation method distinguishes them."
    source_ids:
      - eu-batteries-reg-2023-1542
      - eu-waste-battery-recycling-2025-606
  - rule_id: validation_mass_balance
    applies_to: "Each foreground process"
    rule: "Require measured input, output, inventory-change, residue, and direct-release records and report the unresolved mass-balance difference; do not force closure by assigning the difference to a saleable product."
    source_ids:
      - eu-waste-battery-recycling-2025-606
  - rule_id: validation_black_mass_status
    applies_to: "Black mass and crushed battery powder"
    rule: "Reject a default product classification or default UUID when chemistry, moisture, composition, preparation state, destination, and waste or secondary-material status are not documented."
    source_ids:
      - us-epa-lib-recycling
      - eu-waste-battery-recycling-2025-606
  - rule_id: validation_battery_derived_recovery
    applies_to: "Recovered-material claim"
    rule: "Exclude added reagents, water, atmospheric inputs, non-battery impurities, and energy recovery from battery-derived material recovery unless the applicable official method explicitly provides otherwise and the calculation shows it."
    source_ids:
      - eu-waste-battery-recycling-2025-606
  - rule_id: validation_allocation
    applies_to: "Shared burdens and recycling benefits"
    rule: "Require subdivision decision, allocation basis, sensitivity where material, and a check that recycling or substitution benefits are not double counted."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_excluded_systems
    applies_to: "Scope claim"
    rule: "Fail a generic CPC 39380 claim if the default boundary includes new battery manufacture, battery use, generic WEEE or vehicle treatment before battery identification, or downstream manufacture of new batteries without explicit system expansion."
    source_ids:
      - unsd-cpc-3-2025
published_dataset_profile:
  dataset_role: "Foreground data package for one declared waste-battery collection, receipt, preparation, preprocessing, or recovery route; combined routes must preserve stage- and chemistry-resolved records"
  downstream_use: "secondary_dataset and background_dataset for LCA process or lifecyclemodel construction when reference-flow qualifiers and gate coverage match the study"
  allowed_use: "Stage-specific waste-battery management and recycling inventories; chemistry-specific comparisons with matched boundaries; measured mass-flow and recovery calculations under the declared method"
  excluded_use: "New-battery manufacturing inventory; generic electronic-waste treatment; substitution across unmatched chemistries or routes; claims that black mass is automatically a product; regulatory compliance, recycling-efficiency, or recovery-target claims without the applicable official calculation and verification method"
  required_metadata: "PCR id; lot and site identifiers; geography and period; waste-status basis; battery family, chemistry, configuration, charge or safe state, and condition; gross and net mass basis; collection and preparation state; technology route and gates; flow UUID decisions; output composition, moisture, status, and destination; allocation method"
  required_quality_disclosure: "Data coverage and sampling; scale, meter, and laboratory QA; mass-balance difference; unclassified chemistry share; storage change; abnormal events; missing UUIDs; secondary-data substitutions; legal and method editions; limitations on representativeness"
  update_trigger: "Change in chemistry mix, battery configuration, collection system, safety-conditioning practice, preparation or recovery technology, output specification or status, allocation method, applicable legal method, site controls, or evidence that materially changes mass, energy, emission, residue, or recovery results"
