system_boundary:
  rules:
    - rule_id: boundary_waste_identity
      applies_to: "Incoming battery lots"
      rule: "Begin with a lot whose waste or spent status, holder, collection origin, and applicable legal or contractual basis are declared; a Tiangong Product-flow type must not be interpreted as proof that the lot has ceased to be waste."
      source_ids:
        - unsd-cpc-3-2025
        - eu-batteries-reg-2023-1542
    - rule_id: boundary_controlled_collection
      applies_to: "Collection and transport"
      rule: "Include collection, consolidation, route transport, and associated packaging when controlled by the reporting organization; otherwise link the delivered lot to a separate upstream collection dataset and declare the receiving gate."
      source_ids:
        - eu-batteries-reg-2023-1542
        - us-epa-used-lib-safety
    - rule_id: boundary_safe_receipt
      applies_to: "Receipt and storage"
      rule: "Include identification, weighing, inspection, chemistry segregation, state-of-charge or safe-state assessment, terminal protection, damaged-battery isolation, spill or leakage handling, and controlled storage that occur within the foreground."
      source_ids:
        - us-epa-used-lib-safety
    - rule_id: boundary_preparation
      applies_to: "Preparation for recycling"
      rule: "Keep sorting, storage, handling, pack dismantling, removal of non-battery fractions, and other preparation activities distinct from the subsequent recycling process."
      source_ids:
        - eu-batteries-reg-2023-1542
        - eu-waste-battery-recycling-2025-606
    - rule_id: boundary_route_specific_recycling
      applies_to: "Recycling operations"
      rule: "Include only the declared mechanical, thermal, hydrometallurgical, pyrometallurgical, direct-recycling, purification, or refining steps actually controlled by the foreground site; route-specific processes must not be generalized across chemistries."
      source_ids:
        - us-epa-lib-recycling
        - eu-waste-battery-recycling-2025-606
    - rule_id: boundary_output_gate
      applies_to: "Outgoing fractions"
      rule: "End each foreground branch at a measured outgoing fraction. Distinguish intermediate fractions sent for further treatment from final output fractions, and preserve waste, product, or end-of-waste status at that gate."
      source_ids:
        - eu-waste-battery-recycling-2025-606
        - us-epa-lib-recycling
    - rule_id: boundary_exclusions
      applies_to: "Default category boundary"
      rule: "Exclude new battery production, use-phase electricity or service, generic WEEE or vehicle treatment before battery identification, unrelated electronic scrap, downstream manufacture of new cathodes or batteries, and avoided-primary-material credits unless the study explicitly expands the boundary and documents the method."
      source_ids:
        - unsd-cpc-3-2025
        - iso-14044-2006
