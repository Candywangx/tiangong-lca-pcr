  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert each raw measurement into its reporting numerator unit before attribution. Use 1 kWh = 3.6 MJ; kg remains kg. The permits report pounds: verify the actual weighing/laboratory unit and whether the quantity is whole waste or constituent mass. For a confirmed avoirdupois pound use 1 lb av = 0.45359237 kg (and 1 t = 1000 kg where actually reported); do not infer an instrument unit from the permit heading alone. For actual liquid volume L use measured density in kg/L at the same composition/temperature to obtain kg. A measured integrated volume needs no time multiplier; integrate a true rate over its actual interval. Counts require measured configuration-specific component mass. No assumed solvent/water density, dry/wet factor or per-drum mass."
      inputs:
        - raw_reading
        - raw_unit
        - actual_state
        - measured_density
        - cp_utilities
        - cp_preparation
        - cp_packaging
      output: "absolute_converted_amount"
      source_ids:
        - epa-frp-1991
        - adeq-ranger-2022
    - id: shipment_component
      applies_to: "whole waste and composition subaccounts"
      rule: "For each actually represented shipment population j and constituent i, m_ij = W_j * w_ij, with W_j the net whole wet waste mass in kg and w_ij the independently measured representative mass fraction in kg/kg. Convert an assay reported in percent to mass fraction by dividing by 100 once. A pooled sample may be applied only to its justified mass-weighted population; do not invent individual lot fractions. Sum component masses only across compatible populations/periods. Keep incoming pollutant I_i, awaiting-shipment stock, dispatch W_j and receiving-accepted Q distinct. m_ij is a non-additive subaccount of W_j, not another whole flow, product Q, measured air emission or avoided burden. Do not infer releases from incoming-minus-dispatched pollutant without independent stock, other outlets and transformation evidence."
      inputs:
        - cp_shipment_assay
        - cp_release
        - cp_formation
        - cp_emissions_clean
        - cp_emissions_prepare
        - cp_emissions_delivery
      output: "measured_component_subaccount"
      source_ids:
        - adeq-ranger-2020
        - adeq-ranger-2022
    - id: whole_mass
      applies_to: "all physical gates"
      rule: "For each pre-release physical gate, opening WIP plus actual external receipts plus matched internal inflows equals closing WIP plus matched internal outflows plus first release Q at the receiving gate plus actual external rejected/waste/sample exits and species emissions/losses. Q occurs only at the delivery receiving gate, not at formation or preparation. The dirty/ready haul stays an internal matched movement within the composite boundary. At the receiver, keep a separate cohort-tagged accepted-stock ledger for the same period: O_FG + Q + R_old = C_FG + D_after + X_FG. O_FG is opening accepted stock; R_old is actual external return of already released material; D_after is actual subsequent withdrawal/dispatch from accepted stock; X_FG is other mutually exclusive actual outflow, including losses. The upstream waybill to the receiver is not D_after. Current Q excludes opening/returned previously released stock and older-cohort closing stock; only this period's first-accepted cohort contributes once, including its retained closing part. Never add C_FG to Q. In the combined gate cancel dirty/ready transfers and the internal first-release Q handover to FG; retain opening/closing WIP and FG, actual external receipts/returns and all actual external whole-liquid/solid exits, samples and species losses exactly once. Same-batch returns within this boundary cancel instead of becoming an external receipt. Whole wet flow and assays are non-additive; relevant element/acetone balances remain independent."
      inputs:
        - cp_formation
        - cp_preparation
        - cp_release
        - cp_delivery
        - cp_emissions_clean
        - cp_emissions_prepare
        - cp_emissions_delivery
        - cp_history_clean
        - cp_history_prepare
        - cp_history_delivery
        - cp_history_packaging
      output: "gate_residuals"
      source_ids:
        - epa-frp-1991
    - id: component_closure
      applies_to: "packaging"
      rule: "For every material/type/component k in one physical gate: O_k + P_k + N_ext_k + ER_k = C_k + S_k + EO_k + W_k. O/C include empty, attached WIP/FG and reusable stock. P is new procurement; N_ext is first external non-procurement physical receipt; ER has matched prior outward dispatch. All three are mutually exclusive. S is carried on gross outward dispatch and EO is separate outward return. Internal issues/reuse cancel. Reconcile every measured event and each inherited vector; an additional real X requires its own actual row and exact same-side duplicate evidence before removal."
      inputs:
        - cp_packaging
        - cp_history_clean
        - cp_history_prepare
        - cp_history_delivery
        - cp_history_packaging
        - cp_service_packaging
        - cp_service_delivery
      output: "component_residuals"
      source_ids:
        - ilcd-attributional-2010
        - epa-frp-1991
    - id: assign_vector
      applies_to: "all exchanges"
      rule: "For each exchange retain its original cohort vector. Add measured incremental quantities converted by raw_units and allocate dedicated/subdivided portions first, then only justified determining physical causality, and only the actual remaining common-process residual at contemporaneous same-state gate value. Opening/closing WIP and output shares preserve each exchange plus its complementary assignments. A is the absolute assigned numerator for the selected reference cohort; gross physical quantity is not automatically its burden. No division by Q in this step."
      inputs:
        - absolute_converted_amount
        - cp_allocation_clean
        - cp_allocation_prepare
        - cp_allocation_delivery
        - cp_allocation_packaging
        - cp_history_clean
        - cp_history_prepare
        - cp_history_delivery
        - cp_history_packaging
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: release_total
      applies_to: "accepted_feed"
      rule: "Q = sum of this cohort's net whole-liquid batch masses first quality-released during the declared period at the actual receiving gate. Exclude packaging, opening carried-over FG, previously released returns, older-cohort closing stock, repeats, returned/retested masses, rejected feed and samples. Pending never-accepted stock is WIP. Only the retained closing part of this period's first-accepted cohort has already entered Q once; never add it again."
      inputs:
        - cp_release
        - cp_history_clean
        - cp_history_prepare
        - cp_history_delivery
        - cp_history_packaging
      output: "Q"
      source_ids:
        - epa-frp-1991
        - adeq-ranger-2020
    - id: normalise_once
      applies_to: "all inventory rows"
      rule: "For Q > 0 the reported exchange result is A / Q per 1 kg reference flow, exactly once after raw-unit conversion and actual attribution. Reference output is 1 kg. Inventory cards and protocol aggregation labels name this same reporting basis and do not perform another division. Raw collection stores absolute measurements only. Preserve A and history for Q = 0 without a unit result; retain all failed/idle/cleanup burdens."
      inputs:
        - A
        - Q
        - cp_release
        - cp_history_clean
        - cp_history_prepare
        - cp_history_delivery
        - cp_history_packaging
      output: "reported_exchange"
      source_ids:
        - ilcd-attributional-2010
    - id: service_original_cohort
      applies_to: "incremental services"
      rule: "Attach actual incremental service burden to its original cohort and its original accepted Qc; any revised cohort result includes that increment through the same single division by Qc. Keep H only as an actually measured causal service-allocation driver. Do not divide services by new production Q or by H, reset acquisition, duplicate supplier-included service, or count a new release. Qc = 0 retains burden without a unit result."
      inputs:
        - cp_service_packaging
        - cp_service_delivery
        - cp_history_clean
        - cp_history_prepare
        - cp_history_delivery
        - cp_history_packaging
        - cp_allocation_clean
        - cp_allocation_prepare
        - cp_allocation_delivery
        - cp_allocation_packaging
      output: "original_cohort_service_result"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Record actual supplier, formal physical identity, grade/form/route, whole formulation and scope; native support is identity only and not a quantity or permit. No missing actual row may be hidden in other."
      evidence: "Supplier records; full assay; native identity restrictions; actual event completeness"
    - id: dq_measurement
      applies_to: "all measurements"
      requirement: "Keep calibrated weighing/metering, method/state/unit, sample representativeness, raw readings, detection limits and uncertainty. No invented plant data, moisture, density, yield, fire threshold or recovery credit."
      evidence: "Calibration certificates; laboratory results; gross/tare records; independent conversions"
    - id: dq_time
      applies_to: "entire cohort and period"
      requirement: "Cover all campaigns, failures, idle and cleaning, opening/closing WIP/FG, actual route and original history. Distinguish the historical public sources from current site observations."
      evidence: "Dated batch ledgers; stocktake; chain of custody; actual receiver decision"
    - id: dq_vectors
      applies_to: "allocation and component flows"
      requirement: "Reconcile exchange-specific inherited/assigned/complementary vectors, P/N_ext/ER physical mutual exclusivity, ownership and supplier-included scope independently. A generic symbol alone is not a receipt interface."
      evidence: "Component event IDs and measurements; original dispatch; supplier scope; causal/value evidence"
    - id: dq_applicability
      applies_to: "source synthesis"
      requirement: "The EPA industrial guide supports physical route/context; the Arkansas historical permit corroborates real off-site waste-acetone recycling in boat fabrication. Neither is this dataset supplier, contemporary permit, universal concentration or yield. The ILCD attributional guidance supports only the declared allocation hierarchy and status/history decisions, without importing its illustrative infinite-recycling factors."
      evidence: "Complete source context; adjacent safety/route counterexamples; receiver/site records"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference; native identities"
    rule: "Confirm source cleaning operation, liquid state, principal acetone assay, resin/water/oil/solid contamination and exclusion of clinical/pharmaceutical, chemical sludge, air VOC, pure virgin/regenerated solvent and distillation service. Match complete native formal name, route, grade/purity, CAS, geography, type, comments, reference-property/unit-group versions and unit. An unverified core Product identity stays unavailable; a Waste/Elementary flow cannot be promoted to Product by renaming."
    source_ids:
      - un-cpc3-2025
      - epa-frp-1991
  - rule_id: v_reception
    applies_to: "accepted_feed"
    rule: "Require actual receiver authorisation and stream-specific acceptance/rejection records with batch chain of custody, gross/tare/net mass, sample representativeness and agreed contamination/compatibility specification. Measure ignition/flash and reactivity properties by applicable methods on this real waste where acceptance/safety requires them. Historical guide concentrations and neat-solvent data are not present waste thresholds. Unknown receiving permission or unsafe/reactive rejected feed cannot be counted in Q."
    source_ids:
      - epa-frp-1991
      - adeq-ranger-2020
  - rule_id: v_release
    applies_to: "production and service ledgers"
    rule: "Recompute Q only from this cohort's net masses first accepted during the declared period, not gross dispatch V, container count, service duration H, retests or returns. Exclude opening carried-over FG, previously released returns and older-cohort closing stock. The part of this period's first-accepted cohort retained in closing FG has already entered Q once; do not add it again or equate all closing FG with Q. Stock never yet accepted remains WIP; previously released stock remains FG. Preserve failure/Q=0 and all physical movements, original Qc and incremental post-release services. No unit result exists when its own original Q or Qc is zero."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_physical
    applies_to: "each physical gate"
    rule: "Close whole physical mass for formation, preparation and the combined gate with opening/closing WIP, actual external receipts, gross shipments, returns, samples, separated residues, losses and each actual emitted species/medium. Independently close relevant element/acetone balances using real compositions/reactions; do not fit two unknowns with one residual. Assay constituents are subaccounts of a whole wet flow. Distinguish actual water, including free water and any phase/reaction/structural water when demonstrated; a dry-residue test or COD/VOC index is not a named chemical mass."
    source_ids:
      - epa-frp-1991
  - rule_id: v_packaging
    applies_to: "each component and physical gate"
    rule: "For each component k verify O_k + P_k + N_ext_k + ER_k = C_k + S_k + EO_k + W_k in the same material/type/unit/physical gate. O/C include empty, WIP-attached, FG-attached and reusable stocks; S is gross outward carried quantity, EO is separate outward return, W is actual waste. Require actual atomic receipt records for all three mutually exclusive inlet classes, prior dispatch for ER, actual measurements and event identity. Internal reuse cancels; neither ownership nor opening stock substitutes for receipts. Reconcile acquisition/inherited vectors and supplier-included scope once across owned, entrusted, rental and return-service operations."
    source_ids:
      - ilcd-attributional-2010
      - epa-frp-1991
  - rule_id: v_normalization
    applies_to: "all reported amounts"
    rule: "Retain unnormalised raw readings. Convert actual raw units/rates, resolve exchange-specific allocation and inherited vectors, then divide the assigned absolute numerator by its unique Q exactly once in §8. Cards and collection reporting basis refer to that same result. Do not divide again in aggregation, provider linking or component assays. Measured integrated volume is not multiplied by time; only real rates are integrated. Solvent density is independently measured at its composition and temperature, never borrowed from water or a secondary property coefficient."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_missing
    applies_to: "concrete data package"
    rule: "Check every actual atomic exchange, supplier coverage, baseline/closing inventories, assay, safety condition and inherited history. A missing realised receipt or emission interface is incomplete data; ordinary auxiliary/provider UUID gaps stay specifically unbound and do not by themselves invalidate the entire generic method. Core product/terminal/method evidence gaps remain explicit. Quantities, concentrations, densities, yields and credits must not be fabricated."
    source_ids:
      - epa-frp-1991
      - ilcd-attributional-2010
  - rule_id: v_shipment_assay
    applies_to: "shipment and receiving records"
    rule: "Reconcile whole net waste and its independent component masses with the actual composite-sample population and laboratory method. A pooled monthly result is not a per-lot assay; pollutant mass is not whole waste mass. Pending dispatch is stock, dispatched mass is not necessarily received/accepted mass, and only unique receiving acceptance contributes Q. Verify non-halogenated segregation and actual contractor/handover records. Do not derive LCA releases or substitution credit from a regulatory credit or a biennial report."
    source_ids:
      - adeq-ranger-2020
      - adeq-ranger-2022
      - epa-biennial-report
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Only the declared wet source-specific regeneration-feed inlet at the actual acceptance gate"
  allowed_use: "Source-compatible attributional modelling with verified core identity, actual receiving evidence, complete physical/vector history and disclosed method uncertainty"
  excluded_use: "Pure virgin/regenerated acetone; other solvents; distillation service; universal recycling yield/credit; clinical waste; blanket coverage of CPC39940"
  required_metadata: "All §3 qualifiers, original cohort/gates, source assay, receiver authorisation/acceptance, provider scope, exact evidence references, measured quantities and P/N_ext/ER events"
  required_quality_disclosure: "Measurement and allocation uncertainty, unbound core/auxiliary identities, historical-source limits, completeness of actual receipt/emission interfaces and Q0/service treatment"
  update_trigger: "Change of principal solvent, source use/resin, composition/state, actual receiving route/permission/specification, package type or provider scope, allocation goal/evidence or native identity restriction"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division. CPC Version 3.0 Explanatory Notes, 30 June 2025, p205; adjacent pp204-206. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification identity and adjacent 39950/clinical exclusions only; no composition or acceptance threshold"
  - id: "epa-frp-1991"
    type: "official_guidance"
    reference: "US EPA. Guides to Pollution Prevention: The Fiberglass-Reinforced and Composite Plastics Industry, EPA/625/7-91/014, October 1991; printed pp6-11 and 14-15, Appendix A. https://archive.epa.gov/airquality/community/web/pdf/01058.pdf"
    used_for: "Real acetone tool-cleaning formation, uncured resin contamination, segregation/storage, actual conditional separation and off-site recovery route; adjacent solvent/still/reactivity alternatives retained; no default quantitative factors or LCA allocation"
  - id: "adeq-ranger-2020"
    type: "official_guidance"
    reference: "Arkansas DEQ. White River Marine Group LLC d/b/a Ranger Boats Fiberglass, Permit 0979-AOP-R11, 14 September 2020; printed p6 (PDF p9), condition 37 printed pp42-43 (PDF pp45-46). https://adeq.state.ar.us/downloads/WebDatabases/PermitsOnline/Air/0979-AOP-R11.pdf"
    used_for: "Historical off-site waste-acetone route; separate whole waste, incoming pollutant, composite-laboratory composition, shipped pollutant and awaiting-shipment records. No current receiver permission, per-lot assay, LCA credit or measured release"
  - id: "adeq-ranger-2022"
    type: "official_guidance"
    reference: "Arkansas DEQ. White River Marine Group LLC - Ranger Boats Manufacturing Facility, Permit 0979-AOP-R13, 9 November 2022; printed p6 (PDF p9), condition 37 printed pp42-43 (PDF pp45-46). https://adeq.state.ar.us/downloads/WebDatabases/PermitsOnline/Air/0979-AOP-R13.pdf"
    used_for: "Later evidence at the same facility of off-site recycling and distinct whole-waste/composition/shipment-stock accounts; not an independent plant, current receiver approval or LCA emissions credit"
  - id: "adeq-ranger-r4"
    type: "official_guidance"
    reference: "Arkansas DEQ. Ranger Boats/Wood Manufacturing Co. Inc., Permit 979-AOP-R4, Renewal 1; printed pp7 and32 (PDF pp13 and38). https://adeq.state.ar.us/downloads/WebDatabases/PermitsOnline/Air/0979-AOP-R4.pdf"
    used_for: "Earlier same-facility on-site acetone recovery/reuse is a different route/period; exclude its still and recovered-product output from the selected off-site-feed boundary"
  - id: "epa-frp-1990"
    type: "official_guidance"
    reference: "US EPA. Assessment of VOC Emissions from Fiberglass Boat Manufacturing, EPA-600/2-90-019, May 1990, printed pp33-35 and model-plant context pp36-39. https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9102344M.TXT"
    used_for: "Distinguish cleaning loss, on-site batch reclamation and off-site waste reclamation; historical general estimates and model plants do not measure this lot or supply a waste fraction, recovery yield or emissions factor"
  - id: "epa-biennial-report"
    type: "official_guidance"
    reference: "US EPA. Biennial Hazardous Waste Report. https://www.epa.gov/hwgenerators/biennial-hazardous-waste-report"
    used_for: "Reporting-year generator, waste nature/quantity and disposition corroboration only; not shipment weight, chemical assay, receiving acceptance or methodology approval"
  - id: "un-cpc3-2026"
    type: "official_guidance"
    reference: "UNSD. CPC Version 3 explanatory notes, 23 October 2026, CPC3 worksheet A1943:D1943; adjacent rows 1940-1941 and1945. https://unsdsna.azure-api.net/files/pages/cpc/CPC_Ver3_Exp_Notes_2026-10-23_for_Website.xlsx"
    used_for: "39940 explanation links HS2022 3825.41/.49; adjacent clinical/pharmaceutical and chemical-industry waste are separate. Corroborates classification family only, preserving the frozen June2025 coordinate"
  - id: "ilcd-attributional-2010"
    type: "handbook"
    reference: "European Commission JRC. ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance, First edition March 2010; §§7.9.2-7.9.3 and Annex14.4, especially printed pp255-268 and350-351. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional goal, dedicated/virtual subdivision, exchange-specific determining physical causality, residual contemporaneous common-gate value, waste/material status and true prior material history; not industrial solvent chemistry or illustrative infinite recycling factors"
