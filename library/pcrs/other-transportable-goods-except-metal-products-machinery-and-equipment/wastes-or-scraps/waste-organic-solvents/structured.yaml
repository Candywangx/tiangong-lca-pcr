allocation_rules:
  - rule_id: a_goal
    applies_to: "attributional inventory"
    rule: "Declare an attributional study and the material/waste status at each real gate. Identify the true common process and technically comparable solvent quality rather than allocating the whole boat factory merely because waste originated there. Industrial process evidence does not establish LCA allocation. No arbitrary physical/economic switch, fixed share, avoided virgin-solvent credit or recovery yield is permitted. Consequential substitution requires another declared method."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_dedication
    applies_to: "each exchange"
    rule: "First isolate exclusively measured operations and virtual subdivisions. Retain the complete physical cleaning/formation ledger while assigning only the documented share of historical solvent production and prior use to this feed. Record the complement on its actual other function, and test conservation of every inherited exchange vector. Do not assign all previous cleaning to waste by default or discard it because waste has no purchase invoice."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "remaining joint exchanges"
    rule: "For each genuinely inseparable exchange establish a determining physical causal relation between that exchange and the actual functions. Document tests, mechanism, quantities and the selected driver; mass alone is not causality for every chemical, energy or service. Shared transport and storage need the real capacity constraint and time/distance where causally relevant. Dedicated flow assignments precede this step."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual_value
    applies_to: "only unresolved common-process residual"
    rule: "Only after dedication/subdivision and determining physical causality leave a real residual, use documented contemporaneous market values at the same common gate, condition, quality and bulk state for the remaining actual co-functions. Separate negative treatment fees and paid waste-management service from positive material value. A downstream purified acetone price is not the wet-feed gate price. Record uncertainty and sensitivity; a missing causal/value basis remains unresolved, never an invented factor."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_once
    applies_to: "whole solvent; packaging; services; returns"
    rule: "Keep non-additive origin shares of the same whole solvent output, not parallel providers for its constituent assays. Each historical burden vector enters once; actual rework and return/rental services add only incremental exchanges on the original cohort. Packaging P/N_ext/ER quantities remain physical and mutually exclusive independently of who owns or pays. Return of an article is not a new purchase or co-product and yields no automatic credit."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "delivery"
      flow_role: "First release and receiver acceptance"
      record_type: "raw event record"
      raw_fields: "batch; source line; first release ID; receiver; authorisation scope; gross mass; tare; net whole-liquid mass; assay; sample; Q; original Qc; acceptance; rejection; closing released FG; first_acceptance_date; cohort_id; reporting_period; O_FG; C_FG; R_old; D_after; X_FG;"
      collection_method: "Calibrated paired gross/tare weighing at actual receiver and batch-specific sampling/acceptance. Record this cohort's raw net mass once only if its first acceptance falls in the declared period, with first-acceptance date and original cohort ID. Record opening/closing FG, previously released returns and subsequent accepted-stock withdrawals separately; these do not add current Q. No division. Retain authorisation and specification without assuming the historical permit remains current."
      unit: "kg"
      frequency: "Every batch and receiving decision"
      temporal_coverage: "Full declared period plus actual opening/closing and original-cohort history; include failures and Q0"
      site_scope: "Identified source, actual preparation/packaging sites, hauler and receiving gate as applicable"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated original records, material identity, representative samples, dated reconciliation, full provider scope and uncertainty"
    - protocol_id: cp_shipment_assay
      process_id: "delivery"
      flow_role: "Whole dispatch and independent component assay"
      record_type: "raw event record"
      raw_fields: "consignment_id; batch_ids; container_ids; sample_population; sampling_plan; composite_method; sample_time; laboratory; assay_method; mass_fraction_w_ij; whole_net_waste_W_j; incoming_pollutant_I_i; pollutant_shipped_m_ij; awaiting_shipment_stock; dispatch_time; receiver_handover; received_net_mass; acceptance_id; contractor_site; provider_scope; uncertainty"
      collection_method: "Weigh whole net waste separately from packaging and incoming pollutant purchases. Link each laboratory result to the exact shipped population, documented mixing/stratification and mass-weighted composite method; a calendar-month composite cannot establish every lot's concentration. Collect receiving weighing and acceptance independently from dispatch. Retain the regulatory record only as corroboration of its own period/scope; raw fields remain absolute."
      unit: "kg; kg/kg"
      frequency: "Every consignment, sample population and receiving decision"
      temporal_coverage: "Actual dispatch and sampling intervals with opening/closing stocks and the independently identified acceptance date"
      site_scope: "Actual generator, preparation contractor, carrier, laboratory and receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Gross/tare calibration; sampling plan; chain of custody; independent laboratory report; manifest/waybill; signed receiving decision"
    - protocol_id: cp_formation
      process_id: "clean"
      flow_role: "Solvent use and dirty-liquid formation"
      record_type: "raw event record"
      raw_fields: "supplier formulation; net supplied mass; prior origin; resin residue mass; tool/line; cleaning use; circulating solvent; opening/closing solvent; opening/closing resin; dirty transfer; phase; water; acetone; styrene; actual oil; solids; inherited exchange vector"
      collection_method: "Weigh actual solvent/residue and matched dirty-liquid transfer; reconcile source use, samples and calibrated inventories with assay. Preserve whole formulation and constituents as non-additive subaccounts. Collect all raw totals without division; additional actual chemical identities are individually measured."
      unit: "kg"
      frequency: "Every receipt, cleaning campaign and stock boundary"
      temporal_coverage: "Full declared period plus actual opening/closing and original-cohort history; include failures and Q0"
      site_scope: "Identified source, actual preparation/packaging sites, hauler and receiving gate as applicable"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated original records, material identity, representative samples, dated reconciliation, full provider scope and uncertainty"
    - protocol_id: cp_preparation
      process_id: "prepare"
      flow_role: "Separation, samples and wet contamination"
      record_type: "raw event record"
      raw_fields: "batch; operation actually performed; wet inlet; wet feed; resin outlet; filter clean tare; filter wet discard; samples; effluent; phase; water; acetone; styrene; oil species; dry residue; test method; volume; temperature; independently measured density; WIP opening/closing"
      collection_method: "Weigh each actual whole wet outlet separately with matched samples. Determine composition, free-water/phase state and dry residue using applicable laboratory methods; test reactivity/flash properties required by the receiver. Record wet/dry definitions and uncertainty. Collect integrated volume as volume and rate/time separately; never infer solvent density from water or use one mass residual for two unknowns. No division of raw totals."
      unit: "kg"
      frequency: "Each operation, outlet, sample and stock boundary"
      temporal_coverage: "Full declared period plus actual opening/closing and original-cohort history; include failures and Q0"
      site_scope: "Identified source, actual preparation/packaging sites, hauler and receiving gate as applicable"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated original records, material identity, representative samples, dated reconciliation, full provider scope and uncertainty"
    - protocol_id: cp_utilities
      process_id: "prepare"
      flow_role: "Actual electricity and cleanup-water readings"
      record_type: "raw event record"
      raw_fields: "meter; start/end reading; unit; voltage; location; supplier; water quality; actual mass or volume and independent density; operating/idle/startstop/cleaning; supplier included scope"
      collection_method: "Collect unnormalised metered totals and actual process attribution, with kWh and mass/volume preserved. Trace any mass conversion independently at the actual state. No assumed steam, boiler, condensate return, cooling-water circuit or heat supply. If any occurs, collect its own atomic exchange, return state and provider energy/water scope before completing the package."
      unit: "kWh; kg; m3"
      frequency: "Each meter interval and campaign including idle"
      temporal_coverage: "Full declared period plus actual opening/closing and original-cohort history; include failures and Q0"
      site_scope: "Identified source, actual preparation/packaging sites, hauler and receiving gate as applicable"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated original records, material identity, representative samples, dated reconciliation, full provider scope and uncertainty"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "Every atomic packaging receipt and movement"
      record_type: "raw event record"
      raw_fields: "event ID; material; form; type; component; direction; measured clean mass; count; measured mass per article; owner; supplier; price-included scope; P; N_ext; ER; original dispatch; O_empty; O_WIP; O_FG; O_reusable; C_empty; C_WIP; C_FG; C_reusable; S; EO; W; adhering contents; cohort; inherited per-exchange vector; incremental services"
      collection_method: "Weigh/trace supplier mass for every actual component and event including first non-purchase receipt. Disaggregate only with real component evidence, subtract clean tare from wet content once. Reconcile counts with measured configuration-specific mass, never guessed kg/article. P/N_ext/ER are mutually exclusive and independently evidenced; ER needs the previous dispatch. Record stocks across empty/WIP/FG/reusable states and cancel internal issues. No division of raw measurements."
      unit: "kg; item"
      frequency: "Every receipt, dispatch, return, discard and stock boundary"
      temporal_coverage: "Full declared period plus actual opening/closing and original-cohort history; include failures and Q0"
      site_scope: "Identified source, actual preparation/packaging sites, hauler and receiving gate as applicable"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated original records, material identity, representative samples, dated reconciliation, full provider scope and uncertainty"
    - protocol_id: cp_delivery
      process_id: "delivery"
      flow_role: "Real receiving route and all reverse movements"
      record_type: "raw event record"
      raw_fields: "batch; hauler; vehicle; receiver; route; distance; gross content; packaging; net accepted; rejected; returned; WIP; physical V; provider coverage; inherited vector"
      collection_method: "Match waybills, actual route records, weighings and receiver decisions. Retain absolute tkm from actual carried gross mass and distance; distinguish content and container. Reconcile matched internal handovers without new purchase or Q. Collect rejection/return and external treatment provider data; no division."
      unit: "kg; km; tkm"
      frequency: "Every consignment and movement"
      temporal_coverage: "Full declared period plus actual opening/closing and original-cohort history; include failures and Q0"
      site_scope: "Identified source, actual preparation/packaging sites, hauler and receiving gate as applicable"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated original records, material identity, representative samples, dated reconciliation, full provider scope and uncertainty"
    - protocol_id: cp_emissions_clean
      process_id: "clean"
      flow_role: "Actual species and discharge medium"
      record_type: "raw event record"
      raw_fields: "stage; species; CAS; discharge medium; source; measured concentration; actual gas flow rate; duration; integrated gas volume; temperature; pressure; calibration; acetone mass; styrene mass; liquid losses; sampling uncertainty"
      collection_method: "Use speciated measurements at actual discharge conditions or independently justified substance balances with measured inventories. Distinguish integrated volume from rates; retain conversions and media. Capture/reuse is internal until actually crossing an outlet. Total VOC/COD cannot replace molecular species. Retain failures/leaks without default evaporation/reaction fractions; raw totals remain unnormalised."
      unit: "kg; m3; s"
      frequency: "Each stage and actual emission interval"
      temporal_coverage: "Full declared period plus actual opening/closing and original-cohort history; include failures and Q0"
      site_scope: "Identified source, actual preparation/packaging sites, hauler and receiving gate as applicable"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated original records, material identity, representative samples, dated reconciliation, full provider scope and uncertainty"
    - protocol_id: cp_emissions_prepare
      process_id: "prepare"
