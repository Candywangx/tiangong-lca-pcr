system_boundary:
  rules:
    - rule_id: b_single_route
      applies_to: "all processes"
      rule: "Model only segregated liquid spent acetone from cleaning uncured styrene-containing unsaturated-polyester resin from hand tools in one identified open-mould FRP production operation. Record the source line and cleaning campaign. Acetone CAS67-64-1 identifies the principal solvent constituent, not the whole contaminated supply. Establish its predominance by batch assay; do not mix solvent families or select another principal solvent within this record."
      source_ids:
        - un-cpc3-2025
        - epa-frp-1991
        - adeq-ranger-2020
    - rule_id: b_formation_history
      applies_to: "clean; prepare"
      rule: "Start with the actual supplied acetone entering its identified cleaning use and the actual uncured resin residue transferred from tools. Describe that use before calling the liquid waste. Record gross physical amounts separately from the attributed burden. Link solvent manufacture/supply and the already incurred use history through one exchange-specific vector and cohort; neither an internal dirty-solvent transfer nor withdrawal from stores is a new purchase. Do not charge a purchased resin formulation again as separate polyester and styrene inputs."
      source_ids:
        - epa-frp-1991
        - ilcd-attributional-2010
    - rule_id: b_actual_preparation
      applies_to: "prepare; delivery"
      rule: "Include closed collection, actual settling/decanting or filtration only where performed, protected storage, sampling, analysis, filling, labelling, weighing, loading and actual transport to the identified authorised solvent-regeneration receiver. Keep each separation loss and receiving rejection. No evaporation-to-disposal, solvent substitution, resin curing, distillation or regenerated-solvent production is assumed inside this gate. Source descriptions establish a feasible technical route, not a present factory inventory or a receiver permit."
      source_ids:
        - epa-frp-1991
        - adeq-ranger-2020
    - rule_id: b_release_gate
      applies_to: "accepted_feed"
      rule: "Q is the sum of this cohort's net whole-liquid mass first quality-released as regeneration feed during the declared period at the actual receiver acceptance gate. Identify every batch and first-acceptance date once. Producer ready stock still awaiting that first receiving acceptance remains WIP. Only the part of this period's first-accepted cohort remaining in closing FG has already contributed to Q once and must not be added again. Opening carried-over FG, previously released returns and closing stock from older cohorts never enter current Q. Shipment, retesting, reacceptance, ownership change and return create no new Q. V is generator-to-receiver gross dispatch, not the receiver's subsequent D_after; reverse movements are also physical ledgers separate from Q. A concrete dataset needs actual receiver identity, authorisation for this stream, preacceptance specification, weighbridge and acceptance/rejection records."
      source_ids:
        - epa-frp-1991
        - adeq-ranger-2020
    - rule_id: b_all_events
      applies_to: "all processes"
      rule: "Retain start-up, shutdown, idle storage, failed campaigns, spills, sampling, cleaning and rework including Q=0 periods. Record opening/closing solvent, residue and WIP by composition and inherited exchange vector. Cancel internal transfers in the combined physical gate and transfer the same burden once. Post-release warehouse, handling and dispatch services remain on their original cohort Qc; record actual duration H as an allocation driver, never as the production denominator."
      source_ids:
        - epa-frp-1991
        - ilcd-attributional-2010
    - rule_id: b_component_receipts
      applies_to: "packaging; attached components"
      rule: "For each actual packaging/container/attached component collect every external first physical receipt in a material/form/type/direction-specific atomic row: P is new procurement, N_ext is first non-procurement receipt including supplier-accompanied, entrusted, borrowed or leased articles, and ER is a true external return with prior outward dispatch. They are mutually exclusive. A component included in the whole purchased consignment price is procurement P even without a separate invoice. Opening stock cannot replace current receipts; internal stores/WIP/FG issues and reuse cancel. A missing actual receipt interface or measured quantity makes the concrete package incomplete; a symbol or copied purchase UUID is insufficient."
      source_ids:
        - epa-frp-1991
        - ilcd-attributional-2010
    - rule_id: b_owner_scope
      applies_to: "packaging; contract manufacturing; services"
      rule: "Independently record ownership, original cohort, inherited per-exchange vector, supplier-included manufacture/transport/cleaning scope and actual incremental rental/return service. First non-purchased receipt never implies zero burden, a fresh product Q, ownership transfer or credit. Assign acquisition or inherited component burdens once, then only real incremental services, across contract manufacturing and service interfaces as well as owned operations. Add a new component X only for an actual additional material; same-side duplication is removed by exact event identity, not by subtracting unrelated receipts."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_atomic_completeness
      applies_to: "all exchanges"
      rule: "Cards are concrete candidate interfaces, conditional on actual occurrence. Add a separate specific card, measured amount and provider/scope for every additional actual ingredient, oil, glass fibre, chemical, fuel, heat source, packaging part, waste or emitted species/medium; never hide them in other, total VOC or a zero bundle. Missing actual interfaces are incompleteness, not not_applicable. Whole wet solvent and its acetone/water/resin assay subaccounts are non-additive. One exchange has one actual provider; imported supplier burdens must not duplicate explicit foreground operations."
      source_ids:
        - epa-frp-1991
    - rule_id: b_evidence_route
      applies_to: "clean; prepare; delivery"
      rule: "Separate the actual source use, whole contaminated waste, receiving feed and downstream recovered solvent/service. EPA's off-site reclamation discussion establishes a possible route, not this lot's recovery yield, solvent fraction or air release. R11/R13 condition 37 distinguishes incoming pollutant, waste dispatched, measured composition and waste awaiting shipment; its rolling regulatory emissions credit is neither an LCA substitution credit nor a speciated measured air emission. Verify non-halogenated segregation and receiver compatibility."
      source_ids:
        - epa-frp-1990
        - epa-frp-1991
        - adeq-ranger-2020
        - adeq-ranger-2022
    - rule_id: b_actual_handover
      applies_to: "outsourced preparation; receiving release"
      rule: "Identify the actual site and contractor performing each preparation, packaging and receiving step, with measured handover and provider-included scope. Contracting, invoicing, stock transfer, resale or a repeated receiving test does not manufacture a new feed cohort. This method's reporting output is the unique first receiving acceptance of the specified waste; it is not manufacture of fresh or regenerated solvent. Annual waste reports can corroborate generator, reporting-year quantity and management destination, but cannot replace consignment weighing, batch composition or actual acceptance."
      source_ids:
        - adeq-ranger-2022
        - epa-biennial-report
