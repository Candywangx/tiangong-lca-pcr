      record_type: "raw event record"
      raw_fields: "stage; species; CAS; discharge medium; source; measured concentration; actual gas flow rate; duration; integrated gas volume; temperature; pressure; calibration; acetone mass; styrene mass; liquid losses; sampling uncertainty"
      collection_method: "Use speciated measurements at actual discharge conditions or independently justified substance balances with measured inventories. Distinguish integrated volume from rates; retain conversions and media. Capture/reuse is internal until actually crossing an outlet. Total VOC/COD cannot replace molecular species. Retain failures/leaks without default evaporation/reaction fractions; raw totals remain unnormalised."
      unit: "kg; m3; s"
      frequency: "Each stage and actual emission interval"
      temporal_coverage: "Full declared period plus actual opening/closing and original-cohort history; include failures and Q0"
      site_scope: "Identified source, actual preparation/packaging sites, hauler and receiving gate as applicable"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated original records, material identity, representative samples, dated reconciliation, full provider scope and uncertainty"
