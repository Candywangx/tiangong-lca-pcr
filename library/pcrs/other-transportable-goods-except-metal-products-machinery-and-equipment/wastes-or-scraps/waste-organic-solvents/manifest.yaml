  scope_decision:
    boundary: "Source-segregated non-halogenated acetone-dominant liquid from uncured polyester FRP hand-tool cleaning, through actual preparation and first acceptance at an identified off-site regeneration receiver, before distillation."
    classification: "Accepted narrower relation to frozen CPC 3.0 39940 under docs/adr/2026-11-22-accept-cpc-39940-segregated-spent-acetone-at-offsite-regeneration-reception.md. The October 2026 UNSD HS2022 explanation corroborates the solvent-waste family, not composition, actual acceptance or whole-leaf coverage. Scientific and translation review remain pending."
    reuse: "The accepted CPC 34139 cumene phenol/acetone method concerns newly produced chemicals; accepted CPC 39950 ilmenite-sulphate mother liquor concerns an inorganic chemical residue. Neither covers this spent cleaning solvent. Retain the original waste-organic-solvents identity."
  reference_flow_identity:
    status: "unresolved"
    unresolved_support_fields:
