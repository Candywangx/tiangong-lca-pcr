    reference_row_id: "accepted_feed"
    reason: "A chemically specific whole spent-acetone feed is declared, but no compatible native Product flow is verified. Mass, its Units of mass group and kg are independently supported; this does not establish the product UUID or an actual provider."
  measurement_support_limits:
    - "Metered electrical Energy is distinct from the conditional electricity record's native Net calorific value property. The actual site provider and voltage/geography match remain collection obligations."
    - "Technical Energy support is archival, not a claim of current public-platform visibility. Its energy-unit chain does not establish another supplier flow's native property."
  release_accounting:
    denominator: "Only the selected cohort's net mass first accepted during the declared period contributes current Q. Its retained closing portion is already counted once. Opening accepted stock, previously released returns and older-cohort closing stock are excluded."
    receiver_ledger: "O_FG + Q + R_old = C_FG + D_after + X_FG; all terms are cohort-tagged, and subsequent receiver withdrawals D_after differ from generator-to-receiver dispatch."
