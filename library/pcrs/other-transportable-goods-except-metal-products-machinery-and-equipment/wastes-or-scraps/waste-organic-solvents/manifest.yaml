      selected_flow: "Resin-contaminated spent acetone liquid from FRP tool cleaning"
      reason: "Pure acetone, ethyl-acetate Waste flows and acetone elementary emissions do not identify this whole contaminated reference feed. Keep its single declared reference output unbound pending compatible original evidence."
  unresolved_collection:
    - "Actual source campaign, complete supply formulation, wet composition and non-halogenated segregation evidence."
    - "Shipment-specific net waste mass and representative laboratory composition, including the exact population covered by a composite sample."
    - "Actual receiving facility and stream-specific authorisation, acceptance specification, dated handover, accepted and rejected masses."
    - "Complete raw utility, emissions, stock and packaging P/N_ext/ER records, including first non-purchased external receipts irrespective of supplier inventory coverage."
    - "Exchange-specific prior-use allocation, supplier-included scope and original-cohort incremental services, with no assumed quantitative shares."
