product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.cocoa-shells-husks-skins-and-other-cocoa-waste-coffee-husks-and-skins"
  classification_refs: "CPC 3.0:39150; narrower"
  covered_products: "One complete preheated cocoa-bean shell separation fraction for useful material handover to one declared biomass boiler, including evidenced same-site use; actual package acceptance and legal/provider compatibility must be verified."
  excluded_products: "Pod husk; coffee residues; cocoa main products; whole-bean-roasted shells under this state; extracted or carbonised shells; activated carbon; mixed biomass recipes; food/feed and other receiver functions."
  representative_product: "Preheated cocoa bean shells for biomass boiler supply"
  production_route: "Fermented dried bean supply -> cleaning -> microniser preheating -> winnowing and shell take-off before nib alkalising/roasting -> dedicated collection and actual conditioning -> measured first quality release to boiler-feedstock supply."
  market_state: "Whole preheated shell fraction as supplied; actual moisture, nib/germ carryover, impurities, receiving limits and physical handling state declared. No fixed dry-matter, energy or bulk-density equivalence."
functional_unit:
  what: "One qualifying whole shell supply for one declared biomass boiler receiver."
  how_much: "1 kg"
  how_well: "Matches the declared receiving specification and actual supplied wet-mass state; lot traceability, moisture, nib/germ, contaminants and legal/method status disclosed."
  how_long_or_cycle: "One complete first quality release during H; no assumed shelf-life or repeated service. Storage and later handling are separately attributed services."
  reference_flow_link: "finished_shell"
system_boundary:
  rules:
    - rule_id: boundary_chain
      applies_to: "upstream and receiving gate"
      rule: "The default foreground begins at the shell take-off with a traceable upstream shell dataset that already carries bean production and joint cleaning/preheating/winnowing burdens once. When dry beans are the actual foreground start, activate joint and keep the complete beans-to-nib/shell physical ledger. Never combine both as new purchases for the same lot."
      source_ids:
        - jb-foods-2012
    - rule_id: boundary_upstream
      applies_to: "agriculture and cocoa main products"
      rule: "Cultivation, pod harvest/opening, fermentation and bean drying are upstream to dry-bean supply. Bean-shell and pod-husk flows are distinct. After shell separation, nib-specific alkalising, roasting, grinding and subsequent liquor, butter and powder operations remain outside the shell supply burden except a separately evidenced real service supplied back to it."
      source_ids:
        - jb-foods-2012
        - icco-cocoa-processing
    - rule_id: boundary_complete
      applies_to: "actual operations and omissions"
      rule: "Include dedicated collection, conveyance, actual screening, holding, weighing, failed lots, all startup/shutdown/idle/cleanup/rework and gate-side handling. Additional drying, sterilisation, milling, wetting or chemical treatment that actually occurred remains in the inventory and triggers state/applicability review; a scope condition never deletes a physical flow. Add every actually present atomic input or exit absent from the cards."
      source_ids:
        - jb-foods-2012
    - rule_id: boundary_gate
      applies_to: "Q and boiler boundary"
      rule: "Q is first quality release of the complete qualifying shell fraction to the declared boiler-feedstock supply gate, including same-site useful handover; it includes qualifying closing FG and excludes opening already released FG, repeated inspection, internal transfers, packaging and failed lots. Combustion and generation of steam/electricity are downstream and are not the reference function. If actual boiler heat returns to the upstream microniser/preheater, explicitly couple and solve that feedback in the wider linked model with actual paired internal material/heat quantities and one environmental burden accounting. Do not assume such a loop from boiler use alone, make shell free fuel, repurchase an internal transfer, or claim duplicate energy or avoided-fuel credits."
      source_ids:
        - jb-foods-2012
        - ilcd-allocation-2010
    - rule_id: boundary_status
      applies_to: "product versus waste"
      rule: "The source-supported useful same-site boiler-material handover permits this conditional method branch without an exact SKU or external-sale certificate. Each actual data package must establish receiver specification, intended useful function, acceptance/disposal, lawful state and provider method. Unknown is not accepted; genuine discard/nonfunctionality or legally incompatible material requires a separately compatible Waste/treatment branch. Preserve rejects and actual treatment loads."
      source_ids:
        - un-cpc3-2025
        - jb-foods-2012
        - ilcd-allocation-2010
