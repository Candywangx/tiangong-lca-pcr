      record_type: "engineering allocation workpaper"
      raw_fields: "joint exit; co-function; complete joint quantity; dedicated amount; subdivision; causal relation; causal evidence; remaining exchange; gate price; price date; market; currency; downstream adjustments; sensitivity"
      collection_method: "First meter or virtually subdivide dedicated operations. Justify determining causality exchange by exchange. Only then document market value for the unresolved joint remainder in its actual exit state, including meaningful low/negative price and missing-value limits. Raw collection remains unnormalised; the aggregation field declares only the output presentation basis produced by the sole section 8 rule, not another collection-stage division."
      unit: "kg; MJ; currency"
      frequency: "each route and representative pricing period"
      temporal_coverage: "same H or justified temporally matched period"
      site_scope: "one common separation exit and real co-functions"
