allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "joint and shell-specific operations"
    rule: "Use attributional modelling only. Isolate dedicated shell operations and real or virtual subdivision before allocating a remaining joint operation. Preserve the full original joint inventory and explain any inseparable remainder. Nib-only downstream processes are assigned to nibs."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "each remaining common environmental exchange"
    rule: "Identify the determining physical cause for that exchange and quantify it using evidence appropriate to its service or embodied material. A correlation with mass, heating value, protein or sales is not by itself determining causality; do not apply one blanket physical ratio to all exchanges. Directly attributable burden stays with its recipient."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "only truly residual joint burden"
    rule: "Where subdivision and exchange-specific determining causality cannot resolve a joint remainder, use documented contemporaneous co-function market values at the same joint exit and physical/quality condition. Remove downstream transport, packing, conditioning and processing costs when deriving that gate value. Record quantities and prices for every real co-function and test uncertainty; missing price is unknown, not zero or permission to select another arbitrary key. No fixed share is prescribed. A negative price or treatment fee requires an explicit compatible waste/treatment system-boundary decision before allocation; never insert a negative co-product share or extrapolate a useful-product formula across that boundary."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_ledgers
    applies_to: "grossV A and Q"
    rule: "Keep grossV as complete actual physical transfers without economic or service shares. Maintain inherited environmental burden vectors A independently for each lot and stock. Assign new dedicated burden and justified residual common burden to A; allocate each environmental exchange once. Resolve supplier-allocated shell burdens once at receipt, without allocating the cocoa main product again. Divide A by the sole matching Q only under inventory_once."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_no_credit
    applies_to: "residues energy and packaging"
    rule: "No default displaced wood, fossil fuel, feed, soil amendment, avoided disposal or carbon-storage credit. Packaging service, returned pallets and recovered dust are not automatic co-products. Any real treatment burden is represented according to actual status and provider method; fuel/heat recovery requires its own explicit wider model."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "shell"
      flow_role: "finished shell and FG"
      record_type: "weighing and release genealogy"
      raw_fields: "lot id; gross mass; tare; net shell mass; first release id; first release time; receiver; specification; opening FG; closing FG; shipments; returns; failed/rework state"
      collection_method: "Calibrated scales and signed whole-lot receiving/release records; match the complete supply state and lot identity. Separate original production release from dispatch or repeat inspection. Raw collection remains unnormalised; the aggregation field declares only the output presentation basis produced by the sole section 8 rule, not another collection-stage division."
      unit: "kg"
      frequency: "each lot and each stock boundary"
      temporal_coverage: "Complete H and boundary stocks; all zero-output intervals"
      site_scope: "one declared supply gate and its boiler receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; tare samples; release authorisation; receiver specification; return links"
    - protocol_id: cp_joint_inventory
      process_id: "joint"
      flow_role: "every atomic inventory row and its burden vector"
      record_type: "lot stock meter and destination ledger"
      raw_fields: "row_id; lot; process; date; raw amount; raw unit; actual rate duration; state; density evidence; grossV; inherited A vector; opening raw/WIP; closing raw/WIP; failed lot; new rework additions; matched duplicate-entry audit; meter; destination; uncertainty"
      collection_method: "Reconcile calibrated mass/carrier meters and receipts to equipment logs, stocktakes and destination records. Keep full raw unallocated quantities and each inherited vector. For heat retain supply/return mass, state, enthalpy, provider water convention and actual boiler loop linkage. For emissions retain actual device and species-specific source records. Raw collection remains unnormalised; the aggregation field declares only the output presentation basis produced by the sole section 8 rule, not another collection-stage division."
      unit: "kg; MJ; m3; h"
      frequency: "each batch and metering interval"
      temporal_coverage: "Full H including failure idle cleanup startup shutdown and maintenance"
      site_scope: "all controlled joint and shell supply operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; batch trace; stocktakes; treatment tickets; actual monitoring; uncertainty"
    - protocol_id: cp_shell_inventory
      process_id: "shell"
      flow_role: "every atomic inventory row and its burden vector"
      record_type: "lot stock meter and destination ledger"
      raw_fields: "row_id; lot; process; date; raw amount; raw unit; actual rate duration; state; density evidence; grossV; inherited A vector; opening raw/WIP; closing raw/WIP; failed lot; new rework additions; matched duplicate-entry audit; meter; destination; uncertainty"
      collection_method: "Reconcile calibrated mass/carrier meters and receipts to equipment logs, stocktakes and destination records. Keep full raw unallocated quantities and each inherited vector. For heat retain supply/return mass, state, enthalpy, provider water convention and actual boiler loop linkage. For emissions retain actual device and species-specific source records. Raw collection remains unnormalised; the aggregation field declares only the output presentation basis produced by the sole section 8 rule, not another collection-stage division."
      unit: "kg; MJ; m3; h"
      frequency: "each batch and metering interval"
      temporal_coverage: "Full H including failure idle cleanup startup shutdown and maintenance"
      site_scope: "all controlled joint and shell supply operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; batch trace; stocktakes; treatment tickets; actual monitoring; uncertainty"
    - protocol_id: cp_joint_composition
      process_id: "joint"
      flow_role: "whole shell state and independent balances"
      record_type: "representative sampling and laboratory records"
      raw_fields: "sample lot; moisture wet basis; dry matter; adherent nib; germ; foreign matter; lipid; ash; relevant element; measurement method; temperature; phase; water addition; water exit; uncertainty"
      collection_method: "Sample the complete supplied fraction and independently analyse relevant water, solids and elements. Do not infer assay from a generic industry range or infer two unknowns from one mass deficit. Lower heating value and state are measured only for a separately declared non-additive fuel-quality bridge. Raw collection remains unnormalised; the aggregation field declares only the output presentation basis produced by the sole section 8 rule, not another collection-stage division."
