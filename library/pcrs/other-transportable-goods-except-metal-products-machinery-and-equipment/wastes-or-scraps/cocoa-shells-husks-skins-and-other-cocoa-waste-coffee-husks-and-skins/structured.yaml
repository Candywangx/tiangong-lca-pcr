      quality_evidence: "subdivision diagram; meter data; causal assessment; gate invoices; price adjustments; sensitivity"
    - protocol_id: cp_packaging
      process_id: "shell"
      flow_role: "each physical packaging material and crossing class"
      record_type: "article physical and burden ledger"
      raw_fields: "article/material; configuration; measured tare; raw count; gross kg; purchase invoice; first non-purchase receipt; accompanying-material or independent loan/free receipt; owner; source; prior outward article/pool id and document; proven return receipt; upstream burden coverage and vector; opening/closing empty; attached WIP; attached FG; reusable stock; gross shipments; independent return-to-owner; waste; actual transport cleaning repair; service cohort"
      collection_method: "Reconcile procurement invoices and all external receipt/dispatch documents with article identity, ownership and stocktakes. Purchase, first non-purchase receipt and proven return are mutually exclusive inbound classes for each crossing. Return requires the same physical article previously sent out by this site; a pool total alone does not establish this link; unknown history is not return. Include first non-purchase receipts physically even if upstream material includes their burden. Check inherited coverage before adding production burden; unknown remains unresolved. Weigh each material/article separately; item-to-kg conversion requires measured article mass and configuration."
      unit: "kg; item"
      frequency: "each receipt dispatch return and stocktake"
      temporal_coverage: "complete H with opening/closing attached stocks"
      site_scope: "actual packaging configuration and release/service cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; incoming material packaging list; loan/free-transfer document; owner and article/pool ledger; paired outward/return slips; measured tare; stocktake; upstream burden coverage; service/repair records"
  calculation_rules:
    - id: release_q
      applies_to: "finished_shell"
      rule: "Q = sum of measured net mass of qualifying complete lots first released in H. Count one release identifier once; retain qualifying closing FG inside Q. Opening released FG, repeat release, sales of that opening FG, internal transfer, failed lots, packaging and composition subaccounts do not create Q."
      inputs:
        - "net lot mass"
        - "first release identifier"
        - cp_release
      output: "Q"
      source_ids:
        - jb-foods-2012
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "For each material gate: opening raw material/WIP + actual external receipts + true new additions = closing raw material/WIP + complete physical outputs + independently constrained species/water changes. Reconcile released-FG storage separately using opening FG + Q + actual external returns = closing FG + gross shipments + real rejects + measured losses, with return and rework genealogy. Paired internal transfers cancel only in a combined gate. Shares never reduce grossV."
      inputs:
        - cp_joint_inventory
        - cp_shell_inventory
        - cp_release
        - cp_joint_composition
        - cp_shell_composition
      output: "grossV balance"
      source_ids:
        - jb-foods-2012
    - id: water_elements
      applies_to: "all inventory rows"
      rule: "Close total physical mass and water and relevant element balances independently using measured composition and state. Whole wet shell mass is the main ledger; moisture, dry matter, nib, germ, lipid, protein and ash are non-additive subaccounts. Never solve two unknowns from one residual. Reaction/free/bound/structural water and phase changes require actual evidence; COD, TOC or total dust are not molecular masses."
      inputs:
        - cp_joint_composition
        - cp_shell_composition
        - cp_joint_inventory
        - cp_shell_inventory
      output: "independent physical closure"
      source_ids:
        - jb-foods-2012
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert raw units before attribution. Integrate only true measured rates over their actual duration; integrated volume is not multiplied by time again. Use measured substance/state density for mass-volume conversion. For heat, use measured delivered/returned enthalpy and carrier mass under one consistent provider water/energy convention; a mass coefficient is not density and an MJ label alone does not prove useful heat. H is the observation period and is never an additional denominator."
      inputs:
        - cp_joint_inventory
        - cp_shell_inventory
        - cp_joint_composition
        - cp_shell_composition
      output: "converted raw quantities"
      source_ids:
        - ilcd-allocation-2010
    - id: burden_inventory
      applies_to: "all inventory rows"
      rule: "For each environmental exchange j, A_j = inherited burden released from tracked raw/WIP stocks + new directly attributable burden + justified common burden assigned once to the current first-release cohort. Maintain separate opening/closing raw, WIP, failed-lot and FG burden vectors. Previously released opening FG keeps its historical production burden; post-release storage/packing/handling services have separate cohort accounts. Retain new rework burdens and remove only a demonstrated duplicate entry with a matched audit trail."
      inputs:
        - cp_joint_inventory
        - cp_shell_inventory
        - cp_joint_allocation
        - cp_shell_allocation
        - cp_release
      output: "A_j"
      source_ids:
        - ilcd-allocation-2010
    - id: inventory_once
      applies_to: "all inventory rows"
      rule: "r_j = A_j / Q; apply once only after raw conversion and real attribution. Cards and collection aggregation reference this same result and do not divide again. For finished_shell report the declared reference amount 1 kg when Q is positive; preserve raw Q separately. Q = 0 retains all gross flows and burden stocks with documented future cohort/treatment disposition and yields no per-unit result."
      inputs:
        - A_j
        - Q
        - cp_joint_inventory
        - cp_shell_inventory
        - cp_release
      output: "r_j"
      source_ids:
        - ilcd-allocation-2010
    - id: packaging_balance
      applies_to: "pp_sack_in; paper_sack_in; pallet_in; pp_sack_first_receipt; paper_sack_first_receipt; pallet_first_receipt; pp_sack_received_return; paper_sack_received_return; pallet_received_return; attached_pp_sack; attached_paper_sack; pallet_out; pp_sack_out_to_owner; paper_sack_out_to_owner; pp_sack_waste; paper_sack_waste; pallet_waste"
      rule: "For each article/material separately: opening empty + opening attached WIP/FG + opening reusable stock + actual purchases + first non-purchase external receipts + proven returns received = closing empty + closing attached WIP/FG + closing reusable stock + packaging on gross physical shipments + independent return-to-owner + waste. The three inbound classes are mutually exclusive; evidence of a previous outward crossing by this site of the same physical article is required for return; a pool total alone is insufficient. Include with-material, borrowed and free first receipts regardless of upstream burden inclusion. Each exit belongs to exactly one destination; owner returns accompanying shipments must not be added again as independent returns. Cancel only paired internal movements. Opening and closing stock buckets must be mutually exclusive physical states: do not count a reusable article both as empty and again as reusable stock. Physical closure uses raw kg, not Q or economic shares. For the burden ledger inherit covered production/service vectors once, add evidenced uncovered and actual transport/cleaning/repair burdens, track closing stock, and assign only the matching cohort contribution to A_j/Q once. A receipt, loan, free transfer or return alone creates no zero-burden, replacement purchase or co-product assumption."
      inputs:
        - cp_packaging
        - cp_release
      output: "per-article physical and service balances"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and starting shell"
      requirement: "For each actual data package, verify bean versus pod origin, preheater trace, removal before nib alkalising/roasting, complete fraction and sole useful boiler-feedstock endpoint, including same-site handover. Verify real receiver limits/acceptance, first release, lawful disposition and Product/Waste modelling/provider compatibility before quantitative use; unknown is incomplete. The method branch does not certify any batch, legal status or external sale. No food/feed or nutritional-equivalence claim."
      evidence: "supplier process diagram; receiver specification; legal/method decision; lot certificates"
    - id: dq_complete
      applies_to: "all operations and all periods"
      requirement: "Include true failed, zero-output, startup/shutdown, idle, cleaning, repair and rework loads. Record every actual input/output separately and track opening/closing raw, WIP, FG and burden vectors. Unknown is not zero and a failed identity does not delete physical activity."
      evidence: "full campaign ledger; stocktakes; maintenance logs; reconciliation"
    - id: dq_sources
      applies_to: "method quantity and provider"
      requirement: "Historical industrial observations support their described route only. Obtain representative current quantities, state, geography, technology and provider methods separately; report uncertainty and incompatible cases. No numeric yield, moisture, recipe, heating value, emission factor, price or substitution factor is prescribed."
      evidence: "primary original; measured raw records; provider boundary; independent method"
    - id: dq_uuid
      applies_to: "each adopted identity and unit"
      requirement: "Before adopting any UUID, verify the complete direct identity record, physical meaning and restrictions, plus its referenced property, unit group and reference unit. A generic identity never establishes a suitable provider. Unconfirmed UUIDs remain absent; kg or MJ labels do not establish these chains."
      evidence: "direct native identity evidence; exact property/unitgroup chain; provider assessment"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product and gate"
    rule: "Check each actual data package for the same complete shell fraction/state and trace, one actual useful biomass-boiler receiving use/specification, first release, documented lawful disposition and compatible provider/background year/geography and scientific method, all required qualifiers and verified reference identity. Unknowns fail completeness; native Product is not legal, scientific or batch certification. Source-supported same-site handover needs no exact SKU or external-sale prerequisite. Genuine discard or incompatible legal state stays in a compatible Waste/treatment branch. A name-only match is insufficient; preheated-before-nib-roasting and whole-bean-roasted states are not interchangeable."
    source_ids:
      - jb-foods-2012
      - icco-cocoa-processing
      - un-cpc3-2025
  - rule_id: validate_physical
    applies_to: "joint shell and combined gates"
    rule: "Close full physical mass, moisture and relevant elements independently; keep nibs, shells, germ, stones, ferrous contamination, dust, water and actual species distinct. Never use an environmental allocation share to reduce physical mass. A residual alone cannot identify two unknown exits."
    source_ids:
      - jb-foods-2012
  - rule_id: validate_denominator
    applies_to: "all inventory and release records"
    rule: "Confirm same physical state and gate in both languages, Q from first complete release only, closing FG already within Q, correct inherited stocks and separate post-release services. Check raw conversion and allocation precede exactly one A/Q. No units result at Q = 0; no hidden time, sales, dry-matter or heating-value denominator."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_allocation
    applies_to: "each environmental exchange"
    rule: "Check dedicated/virtual subdivision, determining physical causality per exchange and only then residual same-gate contemporaneous economic value. Reconcile complete joint and co-function ledgers, provider-allocated shells once, missing/negative values and sensitivity. Reject blanket ratios and automatic credits."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_packaging_emissions
    applies_to: "packaging and environmental exits"
    rule: "Reconcile every packaging material with purchases, first non-purchase receipts and proven returns kept distinct; require a prior same-physical-article outward record for return. Confirm physical receipts regardless of upstream burden inclusion and no doubled inherited burden. Check mutually exclusive exit destinations, attached stocks and separate service-cohort burdens; exclude packaging from Q. Separate collected dust from air release, wastewater from environmental release and indicators from molecules. Enumerate all actually present atomic exchanges before claiming completeness."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Conditional same-state complete shell material supply for one declared useful biomass-boiler receiving function, including source-supported same-site handover; each actual package must separately verify acceptance, lawful status, provider/background and scientific method. No qualified external sale or completed batch is implied."
  excluded_use: "Automatic fuel substitution; useful heat/steam/electricity output; waste treatment service; food/feed/nutrition equivalence; pod or coffee residues; extracted/carbonised shell; unsupported same-name provider."
  required_metadata: "botanical identity Theobroma cacao and bean-shell origin; dry-bean supplier and lot genealogy; actual preheater and separation route; shell removed before nib alkalising and roasting; whole supplied fraction including measured nib and germ carryover; moisture and dry matter with measurement method and wet basis; foreign material and contamination acceptance criteria; no extraction or carbonisation or undeclared chemical treatment; actual additional drying or grinding and resulting state if present; one biomass boiler receiver and its material specification; legal status and attributional provider method for Product or Waste; first whole-lot release gate Q and release identifier; net supplied mass excluding packaging tare; site geography technology reference period H; storage condition and residence time; upstream dataset boundary and inherited per-flow burden vectors; opening and closing raw material WIP failed lots and FG; packaging and reusable return configuration"
  required_quality_disclosure: "Receiver qualification and status evidence; actual route and provider limits; primary versus inferred evidence; missing identities; full physical/stock closure; allocation sensitivity; actual period; unmeasured quantities and Q=0 handling."
  update_trigger: "Changed source, preheat/removal order, supplied state, receiver function/specification, legal/provider method, packaging, heat-return configuration or material allocation evidence."
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division. CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF pp. 199–200; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full 39150 inclusion and exclusion context; category scope only, not LCA waste status."
  - id: "jb-foods-2012"
    type: "literature"
    reference: "JB Foods Limited, Final Prospectus, 13 July 2012, printed pp. 67, 93–95 / PDF pp. 71, 97–99; https://jbcocoa.com/wp-content/uploads/2019/04/5894007451JB-Foods-Limited_Final-Prospectus_13July2012.pdf"
    used_for: "Manufacturer dry-bean cleaning, microniser preheating and winnowing before nib alkalising/roasting; collected shells used in biomass boilers; low/no-value waste counterevidence. Historical industrial observation, not a qualified current Product specification, yield, shell assay or universal fuel/utility inventory."
  - id: "icco-cocoa-processing"
    type: "official_guidance"
    reference: "International Cocoa Organization, Processing Cocoa, undated official industry overview; https://www.icco.org/processing-cocoa/"
    used_for: "Roasting whole beans versus nibs and shell/nib separation distinguish alternative states. No shell specification, destination or quantity is inferred from bean drying or cocoa main-product values."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission Joint Research Centre. ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition March 2010, §7.9.2–7.9.3, printed pp. 255–272 / PDF pp. 275–292; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Independent attributional hierarchy: real/virtual subdivision, exchange-specific determining physical causality and residual common-process gate market value. This PCR imposes explicit raw/stock/normalisation protocols as modelling requirements, not measured factory facts or a source-given default shell allocation share."
