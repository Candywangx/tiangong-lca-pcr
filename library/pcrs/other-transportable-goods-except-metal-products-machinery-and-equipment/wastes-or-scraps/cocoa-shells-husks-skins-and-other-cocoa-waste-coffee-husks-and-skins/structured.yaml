      raw_fields: "sample lot; moisture wet basis; dry matter; adherent nib; germ; foreign matter; lipid; ash; relevant element; measurement method; temperature; phase; water addition; water exit; uncertainty"
      collection_method: "Sample the complete supplied fraction and independently analyse relevant water, solids and elements. Do not infer assay from a generic industry range or infer two unknowns from one mass deficit. Lower heating value and state are measured only for a separately declared non-additive fuel-quality bridge. Raw collection remains unnormalised; the aggregation field declares only the output presentation basis produced by the sole section 8 rule, not another collection-stage division."
      unit: "kg; %; MJ/kg"
