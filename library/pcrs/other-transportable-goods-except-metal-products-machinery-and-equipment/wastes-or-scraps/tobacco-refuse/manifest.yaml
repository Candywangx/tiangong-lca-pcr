      Candidate only; actual supplier first-release and receiving specification
      must be collected."
  ordinary_foreground_requirements:
    - Actual supplier hand-off and burden dataset;
      crop/curing/redrying/conditioning history; industrial receiver
      specification and acceptance; wet mass and moisture; lamina/fines/foreign
      matter; legal/disposition status; actual
      utilities/maintenance/cleaning/packaging/emissions; complete
      stocks/returns and attributable load vectors. No factory quantities or
      provider approval is claimed.
  source_scope: Current frozen June 2025 CPC and October 2026 original comparison;
    primary commercial supply, historic producer filing and CBP material-state
    counterevidence; independently reread ILCD allocation guidance. No factory
    quantities are asserted. Scientific review and publication are pending.
  classification_decision: Accepted narrower association under docs/adr/2026-11-22-accept-cpc-39180-redried-flue-cured-virginia-long-midribs.md.
  identity_review: Public native flow direct reads retain compatible conditional
    tap water and ordinary air water vapour; official Chinese names audited.
    Mass/kg and technical Energy/MJ-kWh support independently verified in fixed
    public ILCD archive a55b302e1ca1bf190e4c412c74e046e2d54d32f6; archive is not
    a present-day platform read. Electricity supplier native reference property
    remains unresolved.
