system_boundary:
  rules:
    - rule_id: boundary_material
      applies_to: "applicability"
      rule: "This methodology addresses one separately supplied material: clean, unblended, unformed long midrib stems from flue-cured Virginia (FCV) tobacco after GLT separation, redrying and conditioning. The material is a residual industrial feedstock for a declared reconstitution receiver; it is not reconstituted sheet itself. Long-stem supply, redrying/conditioning and industrial uses are documented by the manufacturer/merchant; GLTCL separately offers stems and scrap and separately describes cut rolled expanded stem. Those commercial descriptions support a narrow technical synthesis, not a claim that one factory, SKU or current order has been audited. No numerical moisture, nicotine, stem yield, price, density, heating value or allocation share is prescribed."
      source_ids:
        - stalwart-stem-supply
        - gltcl-stem-portfolio
        - unsd-cpc3-2025
        - cbp-stems-961890
        - cbp-cigar-midribs-n026926
        - unsd-cpc3-2026
        - hmrc-tobacco-scope
    - rule_id: boundary_handoff
      applies_to: "upstream and foreground"
      rule: "Start at an identified hand-off of loose, already separated/redried/conditioned stems before the reporting operator's final collection, necessary impurity removal, grading, weighing and first quality release. Include the actual holding, packing, handling and dispatch service for that material. The supplier carries cultivation, curing, leaf conditioning, threshing/separation and stem redrying burdens once into the hand-off dataset. Do not purchase parent leaf again or rebuild an entire threshing or cigarette plant. This starting condition is a declared modelling option supported by the supply chain; the data producer must establish the actual hand-off and supplier boundary."
      source_ids:
        - stalwart-stem-supply
        - jrc-ilcd-2010-allocation
        - dimon-processing-2004
    - rule_id: boundary_real_operations
      applies_to: "complete foreground"
      rule: "Include start/stop, idle, trials, failures, contaminated/rejected lots, cleanup, actual repair inputs, maintenance replacements and rework. Unsupported or unauthorised operations still retain their actual physical flows and burdens; they may require route extension rather than zero quantities. Add an individual card for every actual missing fuel, heat carrier, chemical formulation, package, waste or measured substance."
      source_ids:
        - stalwart-stem-supply
        - gltcl-stem-portfolio
    - rule_id: boundary_product_waste
      applies_to: "material status"
      rule: "Establish Product versus discarded Waste from specification, documented receiver use/acceptance, actual legal/disposition status and provider method. The label refuse, low price or sale alone proves neither zero upstream burden nor harmlessness. A contaminated or disposal lot cannot inherit the qualified reference identity automatically."
      source_ids:
        - stalwart-stem-supply
        - jrc-ilcd-2010-allocation
    - rule_id: boundary_exclusions
      applies_to: "route contrasts"
      rule: "Exclude green or whole cured leaves, stemmed lamina, a separate dust/fines or leaf-fragment product, deliberate blends, flavoured/cased or cut filler, rolled/expanded stems, reconstituted or homogenized sheet, extracted residues, nicotine/extracts, pressed fuel pellets, cigarettes and used filters. Ordinary export-carton packing does not establish pelletisation; declare any compaction and confirm that it is reversible containment rather than a newly formed article. If actual additional drying, wet treatment, expansion, extraction, blending or forming occurs, keep all physical flows and burdens and explicitly extend/review the route; never omit the operation to make the material qualify. Downstream extraction/reconstitution/combustion and substitution credits are outside this foreground."
      source_ids:
        - stalwart-stem-supply
        - gltcl-stem-portfolio
        - unsd-cpc3-2025
        - cbp-puffed-stems-h185715
        - hmrc-tobacco-scope
boundary_abstraction:
  declared_starting_condition: "Start at an identified hand-off of loose, already separated/redried/conditioned stems before the reporting operator's final collection, necessary impurity removal, grading, weighing and first quality release. Include the actual holding, packing, handling and dispatch service for that material. The supplier carries cultivation, curing, leaf conditioning, threshing/separation and stem redrying burdens once into the hand-off dataset. Do not purchase parent leaf again or rebuild an entire threshing or cigarette plant. This starting condition is a declared modelling option supported by the supply chain; the data producer must establish the actual hand-off and supplier boundary."
  starting_condition_role: "Supplier-to-foreground hand-off; the supplier owns all pre-handoff leaf separation/redrying burdens once."
  product_classification_scope: "CPC tobacco refuse context narrowed to the single unmanufactured long-stem supply state; no broader residual mixture."
  recursive_input_rule: "Record same-category incoming stems once with their actual upstream provider and burden vector. A returned released batch retains its original Qc and load lineage and is not a second fresh purchase."
  upstream_dataset_requirement: "Require actual supplier cultivation/curing/separation/stem-redrying boundary and allocation evidence; retain transport when it actually occurs. Link each fresh utility/material and each treatment owner once; a flow identity is not a provider dataset."
  disclosure: "Declare receiving use/specification, legal and disposition status, geographic and temporal scope, every real operation, supplier burden coverage, physical stock/return ledgers, allocation evidence, source limitations and unresolved identity."
