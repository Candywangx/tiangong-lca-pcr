measurement_rules:
  - id: net_release
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is net mass of the complete material first passing the declared release gate during H; count each batch once, include qualifying closing FG, and exclude opening already-released FG, dispatch, reinspection and repeated release. Moisture and physical state must match the reference."
  - id: separate_ledgers
    applies_to: "all exchanges and stocks"
    required_property_ref:
      name: "native measured property"
      uuid: ""
    required_unit: "native"
    rule: "Keep grossV physical movements, inventory/environmental load vectors A and production quantity Q separately. Physical mass is never reduced by an economic or service share. Opening and closing raw material/WIP/FG have both physical quantity and inherited load vectors."
  - id: moisture_bridge
    applies_to: "tobacco material and inventories"
    required_property_ref:
      name: "Mass and water mass fraction"
      uuid: ""
    required_unit: "kg"
    rule: "Retain measured wet mass, moisture method and basis; dry matter = wet mass × (1 - measured wet-basis water fraction). The bridge is non-additive. Nicotine and fibre are component subledgers, not additional purchased inputs or denominators."
  - id: units_before_assignment
    applies_to: "raw numerators"
    required_property_ref:
      name: "native measured property"
      uuid: ""
    required_unit: "native"
    rule: "Convert original units and integrate genuine rates before attribution; an already integrated gas/liquid volume is not multiplied by time. Density must be independently established for that substance, temperature and pressure; no default water density for a suspension, carton or stem. Preserve electricity kWh; 1 kWh = 3.6 MJ is an energy conversion, not a heat-supply claim."
  - id: cohort_basis
    applies_to: "current and historical service cohorts"
    required_property_ref:
      name: "native measured property"
      uuid: ""
    required_unit: "native"
    rule: "Whole-H physical balances keep every gross crossing. For unit reporting, identify each actual release cohort first: current production uses its sole first-release Q; historical FG and returned-lot service uses original Qc in a separate historical cohort report, never current Q. Preserve the original full physical ledger alongside cohort-tagged events without economic scaling. A mixed or untraceable cohort cannot be normalised as if wholly current production."
  - id: water_species
    applies_to: "mass and relevant element balances"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep actual free, phase-change, structural and reaction water distinct where supported by evidence. Do not invent a reaction or assign an unidentified water/element residual to nicotine, nitrogen gas or another species. Resolve important unidentified atmospheric/aqueous exits with independent sampling before declaring closure."
