allocation_rules:
  - rule_id: allocation_owner
    applies_to: "pre-handoff supplier"
    rule: "Require the supplier to identify the actual joint leaf/stem separation process and the single upstream owner. Preserve its substantiated attributional allocation once. Collection/grading/dispatch dedicated to stems belongs to stems; later lamina/cigarette-only operations do not. If separation is actually inside the foreground, extend it with the complete parent leaf, lamina, stems, dust, water/steam, other actual residues and losses rather than importing already allocated stems too."
    source_ids:
      - stalwart-stem-supply
      - jrc-ilcd-2010-allocation
  - rule_id: allocation_hierarchy
    applies_to: "genuinely joint environmental loads"
    rule: "For attributional studies only: first direct assignment and actual or virtual subdivision; next establish an exchange-specific determining physical causal relationship. Only genuinely remaining loads may use contemporaneous market values of all co-functions at the same joint-process gate in their actual state. Derive gate-equivalent values from later sales by removing documented dedicated handling/conditioning/packing/transport. Do not choose mass/economic allocation freely or impose fixed shares; test sensitivity and preserve the 100 percent load reconciliation."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: allocation_physical
    applies_to: "grossV and residual outputs"
    rule: "Allocation partitions environmental A only. Keep all actual physical products, waste, captured solids and emissions unscaled in grossV. Composition subledgers do not duplicate the complete material. Reuse/sale/refuse status creates no automatic zero burden, recovery fraction or substitution credit."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: allocation_stock
    applies_to: "stocks and returns"
    rule: "Carry physical raw/WIP/FG stocks and each inherited A vector separately by lot. Assign current-batch post-release services to their first-release Q once; opening previously released FG and returns retain original Qc and history. Keep real fresh incremental work F; X may remove only a proven duplicate within OTHER on the same ledger side. Q = 0 retains all actual flows and load ownership and yields no unit result. H is an observation window, not another divisor."
    source_ids:
      - jrc-ilcd-2010-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "stem_preparation"
      flow_role: "stem hand-off and separated lamina"
      record_type: "raw_record"
      raw_fields: "event ID; material identity; supplier; crop/origin; curing/redrying/conditioning; actual operation; gross/tare/net wet mass; measured moisture/basis; long-stem size; lamina/fines/foreign matter; Product/Waste status; upstream provider; inherited A; raw/WIP opening/closing mass and A"
      collection_method: "Calibrated weighment and representative laboratory/sieve tests plus supplier boundary and receiving-use documents. Collect original unnormalised event records, including rejected receipts; separate components without adding them to the whole."
      unit: "kg"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; sampling/test reports; chain of custody; allocation file"
    - protocol_id: cp_release
      process_id: "stem_preparation"
      flow_role: "sole first-release Q"
      record_type: "raw_record"
      raw_fields: "lot ID; first-release time and gate; gross/tare/net mass; measured release moisture; receiver specification/result; prior release ID; original Qc; opening/closing WIP and FG; failure/rework/repeat flags"
      collection_method: "Weigh the complete accepted material on a calibrated scale excluding packaging, test its moisture/grade and reconcile unique first releases to WIP and FG. Include conforming closing FG; collect raw release masses before any division."
      unit: "kg"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Acceptance certificates; scale/tare records; unique batch/release registry"
    - protocol_id: cp_water
      process_id: "stem_preparation"
      flow_role: "tap water; wastewater; atmospheric H2O"
      record_type: "raw_record"
      raw_fields: "separate stream ID/direction; substance/phase; native meter units; integrated volume versus rate; temperature/pressure; independent density; humidity and air volume; timing; wet mass/moisture stocks; wastewater composition/destination; actual identified species"
      collection_method: "Collect raw water/aqueous weighments or independent actual-state volume-density measurements and upstream/downstream humidity with gas volume. Keep measured species separate from COD/TOC/total nitrogen and PM indicators. Check independent water/solids/element balances; one residual cannot determine two unknown transfers."
      unit: "kg"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter and sampling calibration; laboratory reports; actual-state density and balance uncertainty"
    - protocol_id: cp_maintenance
      process_id: "stem_preparation"
      flow_role: "each replacement sieve"
      record_type: "raw_record"
      raw_fields: "new article ID/grade/form; gross/tare/net kg; old screen ID/kg; service and failure date; downtime; attached tobacco; extra real repair water/material/energy F; provider and treatment owner"
      collection_method: "Use actual purchase/issue/retirement and repair records; weigh each supplied replacement and retired article; add individually identified fresh repair exchanges rather than subtracting them as X."
      unit: "kg"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Purchase/issue records; service report; weighment; waste destination"
    - protocol_id: cp_residuals
      process_id: "stem_preparation"
      flow_role: "each solid residual at actual destination"
      record_type: "raw_record"
      raw_fields: "event/lot; single material; gross/tare/net mass; moisture; cause; captured versus emitted; return/rework; receiver/treatment owner; original Qc; attached component analyses"
      collection_method: "Weigh each segregated container and record failed, contaminated and zero-output periods; retain dust as collected solids and record actual species/medium separately if environmental release is established."
      unit: "kg"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Container tickets; sampling; operating logs; receiving/treatment records"
    - protocol_id: cp_service
      process_id: "supply_services"
      flow_role: "FG movements and service load lineage"
      record_type: "raw_record"
      raw_fields: "lot; paired transfer ID; first release Q; original Qc; opening/closing FG wet mass/moisture and A; gross external shipments S; returned receipts R; original delivery reversal; reinspection; failed storage lot; real new work F; OTHER same-side duplicate X; single burden owner"
      collection_method: "Reconcile every stock movement and shipment/return document with the original release and A vector. Preserve all raw service events before normalisation; current and historical cohorts stay distinguishable. Delivery and reinspection do not create Q."
      unit: "kg"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "FG register; dispatch and return documents; paired transfer proof; inherited-burden ledger"
    - protocol_id: cp_packaging
      process_id: "supply_services"
      flow_role: "one material per packaging ledger"
      record_type: "raw_record"
      raw_fields: "single article composition/grade; unit tare or measured mass; empty opening stock; attached opening WIP/FG; reusable opening stock; fresh purchases; first non-purchased external receipts (arriving with material, borrowed or freely transferred); traceable same-article returns received; corresponding closing stocks; gross physical dispatch-out; external return-out; waste; internal reuse; actual provider; inherited A"
      collection_method: "Reconcile each packaging article independently across empty, attached and reusable stocks. Weigh actual supplied articles or traceable count × independently measured unit tare; do not infer mass from C48 naming or source net tobacco pack weights. Keep internal reuse paired and purchases counted once."
      unit: "kg"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "BOM; actual unit-mass checks; stock/return/dispatch/waste tickets; provider records"
    - protocol_id: cp_energy_preparation
      process_id: "stem_preparation"
      flow_role: "each process electricity"
      record_type: "raw_record"
      raw_fields: "meter IDs; start/end kWh; timestamp; voltage; supplier/geography; process; equipment states; idle/start/stop/cleanup; raw shared load; subdivision/causal driver; per-lot A; service original Qc"
      collection_method: "Collect meter differences and traceable equipment records in original units; retain shared gross readings before assigning attributable loads. Record actual new energy inputs separately and never infer a boiler from an electricity record."
      unit: "kWh"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter certificates; invoices; complete operating-state and assignment logs"
    - protocol_id: cp_energy_service
      process_id: "supply_services"
      flow_role: "each process electricity"
      record_type: "raw_record"
      raw_fields: "meter IDs; start/end kWh; timestamp; voltage; supplier/geography; process; equipment states; idle/start/stop/cleanup; raw shared load; subdivision/causal driver; per-lot A; service original Qc"
      collection_method: "Collect meter differences and traceable equipment records in original units; retain shared gross readings before assigning attributable loads. Record actual new energy inputs separately and never infer a boiler from an electricity record."
      unit: "kWh"
      frequency: "Each event/lot; reconcile the complete H"
      temporal_coverage: "One coherent full reporting window H including all operating states"
      site_scope: "Every included boundary and its supporting equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter certificates; invoices; complete operating-state and assignment logs"
  calculation_rules:
    - id: calc_unit_prepare
      applies_to: "raw numerators"
      rule: "Convert only documented original units; rate integration uses its actual interval once; keep cumulative volumes unchanged; measured mass = volume × independently measured same-substance actual-state density."
      inputs:
        - "raw value"
        - "raw unit"
        - "rate interval"
        - "independent density/state"
        - "conversion evidence"
      output: "grossV in declared native reporting units"
      source_ids:
        - jrc-ilcd-2010-allocation
    - id: calc_assignment
      applies_to: "environmental inventory vectors"
      rule: "A = inherited attributable opening/upstream load + attributable real fresh F + assigned joint-process load - attributable closing load - documented transferred/reversed load - proven same-side duplicate X; follow Section 7. Do not apply this partition to grossV. Keep original Qc/H and each exchange vector; provider/treatment owner once."
      inputs:
        - "opening A"
        - "upstream A"
        - F
        - "joint-load drivers"
        - "closing A"
        - "transfer/reversal A"
        - "OTHER duplicate X"
      output: "A"
      source_ids:
        - jrc-ilcd-2010-allocation
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "After actual cohort selection (current first-release Q or original historical Qc), for the selected Q > 0 only: physical unit record = grossV / Q; environmental unit record = A / Q. These are parallel ledgers, never consecutive divisions; each numerator is divided once. The reference output is 1 kg. Q = 0 retains real raw flows/load ownership without a unit result. H, Qc, moisture, nicotine and dry matter are not extra divisors."
      inputs:
        - grossV
        - A
        - Q
        - "original Qc"
        - "cohort identity"
      output: "parallel unit physical and environmental records"
      source_ids:
        - jrc-ilcd-2010-allocation
    - id: calc_manufacturing_balance
      applies_to: "manufacturing material gate"
      rule: "Opening raw/WIP + all physical receipts + actual uptake/additions = closing raw/WIP + first-release Q + separately measured material outputs/losses. Reconcile wet total mass, independent water/dry matter and relevant elements with actual species/state evidence; do not multiply any physical term by allocation shares."
      inputs:
        - "opening raw/WIP"
        - receipts
        - "uptake/additions"
        - "closing raw/WIP"
        - Q
        - "atomic outputs/losses"
      output: "manufacturing closure and uncertainty"
      source_ids:
        - stalwart-stem-supply
    - id: calc_fg_balance
      applies_to: "FG service gate and consolidation"
      rule: "Opening FG + paired current-release transfer + external returns received + actual additions = closing FG + gross external shipments + externally discarded material + other real physical exits. Q already contains current conforming closing FG. On consolidation cancel paired internal Q endpoints; do not add closing FG to Q again. Keep return reversals and original Qc/A independent from current first production."
      inputs:
        - "opening FG"
        - "paired Q transfer"
        - returns
        - additions
        - "closing FG"
        - "gross shipments"
        - "atomic exits"
      output: "FG and consolidated physical closure"
      source_ids:
        - stalwart-stem-supply
        - jrc-ilcd-2010-allocation
    - id: calc_package_balance
      applies_to: "each packaging article"
      rule: "Opening empty + opening attached WIP/FG + opening reusable + fresh purchases + first non-purchased external receipts + traceable same-article returns received = corresponding closing stocks + packaging with gross physical dispatch + external return-out + waste. Internal reuse cancels; packaging is excluded from product Q, repeated purchases and automatic co-product credits."
      inputs:
        - "opening packaging stocks"
        - purchases
        - "external receipts"
        - "closing stocks"
        - "dispatch packaging"
        - "external returns"
        - waste
      output: "per-article physical closure"
      source_ids:
        - stalwart-stem-supply
        - gltcl-stem-portfolio
  data_quality_requirements:
    - id: dq_identity
      applies_to: "material and receiver"
      requirement: "Establish every reference qualifier and actual industrial acceptance. A native family may support the narrow use only with positive whole-object compatibility, including curing, stem versus leaf/dust, processing state and supply/receiver function. No adjacent UUID may substitute for missing core identity."
      evidence: "Actual supplier and receiver records; native-object audit"
    - id: dq_sources
      applies_to: "external evidence"
      requirement: "Sources are qualitative commercial descriptions plus independent allocation guidance. Stalwart FCV long-stem state is not a GLTCL factory batch. Do not transfer lamina, cut-rag, CRES, dust or historical specification numbers to this material."
      evidence: "Source-specific scope/state/scale/period review"
    - id: dq_completeness
      applies_to: "all foreground records"
      requirement: "Use complete coherent H and all operating states; each applicable atomic exchange has original-unit records, burden owner and inclusion decision. Unmeasured core physical/chemical transfers remain unknown, not zero; measure independent quantities before declaring a balance closed."
      evidence: "Raw logs; uncertainty; stock and species/element closures"
    - id: dq_provider
      applies_to: "background and treatment links"
      requirement: "Verify each actual regional/technology provider separately from flow identity. Ordinary missing provider, packaging grade or auxiliary UUID requires collection/review and does not by itself disprove the stem material; a true core identity or route contradiction blocks finalisation."
      evidence: "Supplier datasets; treatment documents; explicit gap register"
validation_rules:
  - rule_id: validate_core_identity
    applies_to: "reference product and transfer rows"
    rule: "Require a verified compatible Product identity for the whole unmanufactured long-stem material before finalisation. Green/whole/stripped leaf, formulated tobacco, reconstituted/extracted residue, cellulose, wood, cigarette and dust Waste identities do not qualify. A successful read or CPC code alone does not establish applicability."
    source_ids:
      - unsd-cpc3-2025
      - stalwart-stem-supply
      - gltcl-stem-portfolio
  - rule_id: validate_reference
    applies_to: "sole Q and normalisation"
    rule: "Require the linked first-release row to be 1 kg at the same measured moisture/state in both languages. Reject shipment/closing-FG double production, repeat releases, dry-matter/component denominators and more than one division by Q. Retain Q = 0 loads without a unit result."
    source_ids:
      - stalwart-stem-supply
      - jrc-ilcd-2010-allocation
  - rule_id: validate_ledgers
    applies_to: "manufacturing, FG and combined gates"
    rule: "Require complete grossV, water/dry-matter and relevant-element reconciliation independently of attributed A. Keep physical and load stocks distinct, pair internal transfer endpoints, retain historical FG/return Qc/A, and document real F and only same-side OTHER duplicate X. Do not fit missing water and solids/species to one residual."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: validate_atomicity
    applies_to: "all actual operations"
    rule: "Reject collective selected flows and omitted actual utilities/materials/emissions. One complete purchased formulation/article is purchased once; carrier water and assays are non-additive subledgers. On-site mixing adds each purchased input and actual energy/loss separately. Captured dust is not atmospheric nicotine; COD/TOC/total nitrogen and PM indicators do not identify molecular species."
    source_ids:
      - stalwart-stem-supply
      - gltcl-stem-portfolio
  - rule_id: validate_packaging
    applies_to: "each actual package"
    rule: "Require the complete empty/attached/reusable opening/closing ledger plus purchases, first non-purchased external receipts and traceable same-article return receipts, gross dispatch-out, external return-out and waste. Verify actual article composition and tare; internal reuse cancels and cannot inflate Q or purchases."
    source_ids:
      - stalwart-stem-supply
      - gltcl-stem-portfolio
  - rule_id: validate_allocation
    applies_to: "supplier and common-process loads"
    rule: "Require Section 7 attributional hierarchy, substantiated single upstream carry-in, exchange-specific causal tests and common-gate actual-state market evidence for residual allocation only. Dedicated downstream leaf/cigarette operations and default avoided-fuel/extraction credits are rejected."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: validate_route_and_quality
    applies_to: "applicability and uncertainty"
    rule: "Any actual unlisted operation, unidentified important emission, missing core hand-off/terminal evidence or unresolved mass/species relationship requires explicit review/extension. Ordinary foreground measurements remain collection requirements; engineering checks establish neither scientific approval nor translation approval."
    source_ids:
      - stalwart-stem-supply
      - jrc-ilcd-2010-allocation
published_dataset_profile:
  dataset_role: "Attributional foreground unit-process guidance for one qualified long-stem residual supply."
  downstream_use: "A matching industrial receiver may link the complete material once as a secondary/background input after core identity and provider review."
  allowed_use: "Declared separated/redried/conditioned FCV long-stem state, receiver specification, first-release Q and documented hand-off."
  excluded_use: "Universal tobacco-refuse coverage; leaf/dust blends; extracted/expanded/formed products; downstream yield, nicotine concentration, fuel function or automatic substitution credit."
  required_metadata: "FCV tobacco type and botanical identity; origin and crop year; flue-curing location and history; supplier and separation hand-off; redrying and conditioning history; long-stem midrib form and size specification; no deliberate lamina/dust blending; expansion/flavouring/extraction/agglomeration status; measured moisture and test basis; net supplied mass and dry-matter bridge; lamina and fines content; foreign matter and contamination acceptance; declared industrial receiver use and acceptance specification; Product/Waste decision and treatment owner; package composition and tare; first-release lot identity and gate; reporting period and facility geography; upstream burden owner and allocation evidence; opening/closing WIP and FG with inherited load vectors; return lineage and original Qc"
  required_quality_disclosure: "Native identity/provider compatibility; raw physical and inherited-load ledgers; uncertainty and missing measurements; allocation; actual route extensions; source scope and unreviewed methodological/translation state."
  update_trigger: "Change of curing/redrying state, raw tobacco type, stem/leaf/fines boundary, processing route, receiving use/specification, supplier burden coverage, package, stock/return accounting or allocation evidence."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "UNSD, CPC Ver. 3.0 explanatory notes (30 June 2025), pp. 116 and 199–200; CPC 01970, 25010/25020/25091/25092 and 39180 context. Classification labels do not specify stem manufacture or prove native flow applicability."
  - id: "stalwart-stem-supply"
    type: "literature"
    reference: "https://stalwarttobacco.com/"
    used_for: "Manufacturer/merchant product and operations page, undated snapshot: GLT separation/redrying, FCV long versus short midribs, buyer-specific moisture/foreign matter and C48 supply; fines, cut-rag and lamina contrasts. Qualitative supply evidence, not an audited lot or universal numeric specification."
  - id: "gltcl-stem-portfolio"
    type: "literature"
    reference: "https://gltcbd.com/our_products"
    used_for: "GLTCL Product Portfolio, complete undated page: separately graded stems/scrap, industrial export application, and separate CRES/lamina/cut-rag/cigarette product states. Do not transfer listed net pack weights, blend ratios, chemistry or filling values to this method."
  - id: "jrc-ilcd-2010-allocation"
    type: "official_guidance"
    reference: "https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "JRC ILCD Handbook, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–272 (PDF275–292): attributional subdivision/virtual subdivision, exchange-specific determining physical causality, residual economic values at actual joint-process state/gate and 100 percent load reconciliation. No industrial tobacco specification, numeric yield or default recovery credit."
  - id: "unsd-cpc3-2026"
    type: "official_guidance"
    reference: "https://unsdsna.azure-api.net/files/pages/cpc/CPC_Ver3_Exp_Notes_2026-10-23_for_Website.xlsx"
    used_for: "October 2026 CPC3 row 1876, HS 2022 2401.30; classification only; frozen coordinate unchanged."
  - id: "cbp-stems-961890"
    type: "official_guidance"
    reference: "https://rulings.cbp.gov/ruling/961890"
    used_for: "HQ 961890, 17 September 1998, material distinction for flue-cured uncut/unground/unpulverised stems; no current tariff/use claim."
  - id: "cbp-puffed-stems-h185715"
    type: "official_guidance"
    reference: "https://rulings.cbp.gov/ruling/H185715"
    used_for: "HQ H185715, 13 April 2012, puffing route counterexample and limits of processing contrasts; not evidence that all rolled stems leave 2401."
  - id: "hmrc-tobacco-scope"
    type: "official_guidance"
    reference: "https://www.gov.uk/guidance/classifying-tobacco"
    used_for: "Raw/unmanufactured tobacco section, updated 7 August 2023; midribs/stems and smoking-preparation contrast only."
  - id: "dimon-processing-2004"
    type: "literature"
    reference: "https://www.sec.gov/Archives/edgar/data/939930/000093993004000026/f10k2004.htm"
    used_for: "DIMON 2004 filing, ITEM 1 BUSINESS, Processing: historical industrial redrying and separate stem packing; multiple tobaccos/formats, no same-lot quantitative transfer."
  - id: "cbp-cigar-midribs-n026926"
    type: "official_guidance"
    reference: "https://rulings.cbp.gov/ruling/N026926"
    used_for: "NY N026926, 12 May 2008, actual dried cigar-leaf midrib samples, not purposefully cut/ground/pulverised. State/form countercheck only; cigar variety, sample lengths, downstream use and duty treatment do not establish FCV specifications."
