allocation_rules:
  - rule_id: al_context
    applies_to: "method context"
    rule: "Use this method only within an explicitly attributional study requiring allocation. Document study context and the actual recycling chain/ownership. Industrial tube/receiver publications supply no LCA allocation factors. Consequential substitution requires a separately justified method."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_subdivide
    applies_to: "each joint exchange"
    rule: "First isolate dedicated work, meters and material records by real or virtual subdivision. Assign each embodied part of the whole tube and dedicated scrap preparation to its actual function. Keep the useful-length tube gate and scrap gate separate. Cutting geometry needed by useful tube does not automatically imply that all cutting energy follows scrap mass."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange identify and test its determining physical causality. Material embodiment, cutting duty, handling time and occupied space can govern different exchanges; none is a universal allocation key. Preserve source-specific coefficients and justification, with the sum of attributed burdens equal to the original total."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_residual
    applies_to: "genuinely unresolved shared burden"
    rule: "Only after subdivision and exchange-specific determining physical causality leave a remainder may actual contemporaneous market values at the same process gate, physical state and period allocate that remainder. Reverse downstream transport/preparation/packaging differences to reconstruct that gate. Keep unknown values unresolved; no fixed share, free choice of physical/economic methods or use of retail/refined-metal prices for raw offcuts."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_recycling
    applies_to: "tube history and next recovery system"
    rule: "Identify the true joint process and actual inherited burden, value sign and change in inherent properties consistently with ILCD 7.9.3 VI and the selected study method. Do not treat material embodiment alone as allocation of every loss or processing load. Positive/negative waste value and finite recycling cycles need evidence; no universal cutoff, recycling fraction or avoided-primary credit. Missing chain history stays a declared unresolved contribution, not zero. No duplicate upstream provider or automatic credit at a waste outlet."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_accounts
    applies_to: "physical and attributed quantities"
    rule: "Preserve gross physical V_i for balances and attributed burden A_i as separate tags. Joint useful tubes, offcuts and waste are physical outputs with nonoverlapping quantities; origin partitions of one mixed outlet are subaccounts, not another whole outlet/provider. Do not use attributed fractions as measured physical weights."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_tube
      process_id: "manufacture"
      flow_role: "source tube and useful joint tubes"
      record_type: "lot weigh/stock and supplier records"
      raw_fields: "lot; chemistry and assay basis; grade; coating; tube dimensions; temper; supplier; whole receipt; opening and closing raw/WIP; issued mass; useful output; reusable remnants; each inherited exchange vector; uncertainty"
      collection_method: "Weigh whole source lots and useful tube lengths on calibrated scales; reconcile layout and measured residuals with paired internal transfers and stock. Keep raw quantities undivided and Cu assays as nonadditive subaccounts. Preserve provider history; repeated references to one upstream tube dataset do not add a second provider."
      unit: "kg"
      frequency: "each receipt/cutting lot and period close"
      temporal_coverage: "entire lot plus opening/closing history including failed periods"
      site_scope: "same declared source and cutting site"
      aggregation_rule: "per reference flow"
      quality_evidence: "certificates; calibrated weighing; stock bridge; supplier boundary; raw-to-useful/offcut layout"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "unique first accepted tubular offcuts"
      record_type: "calibrated net weight and first-release agreement"
      raw_fields: "lot; unique first-release id and timestamp; gross and tare; net whole mass Q; actual moisture and dry assay basis; solid tubular form; grade and impurities; coating/contamination inspection; receiver criteria and agreement; released closing FG"
      collection_method: "Weigh each first-accepted lot with calibrated gross/tare or direct net weighing. Check source chemistry and actual recycler specification. Sum net newly accepted mass once; keep rejected/unreleased stock separate. Preserve actual measured basis without assuming dry purity. Store undivided Q; closing released FG is already included."
      unit: "kg"
      frequency: "each unique release and reporting close"
      temporal_coverage: "all release events including Q0 and rejected lots"
      site_scope: "source and specified receiver-feed interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "release signatures; scale calibration; photos/assays; real receiver requirements; duplicate-id audit"
    - protocol_id: cp_energy_m
      process_id: "manufacture"
      flow_role: "electricity by actual duty"
      record_type: "meter and supplier record"
      raw_fields: "meter ids; opening/closing readings; original kWh or integrated MJ; rate timestamps if actual power rate; duty; country; voltage; supply mix; failed/start-stop/idle/cleanup/rework load; original cohort id; allocation"
      collection_method: "Read actual duty and facility meters; reconcile nonoverlapping duties without adding the facility total again. Convert kWh to MJ once, integrate genuine power rates only. Retain raw undivided load; check native country, voltage and consumption supply against the real provider. Assign original-cohort services separately."
      unit: "MJ"
      frequency: "each duty and reporting period"
      temporal_coverage: "full same manufacturing period or actual cohort service H"
      site_scope: "actual meters and country/voltage boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; bills; duty bridge; actual provider and allocation records"
    - protocol_id: cp_energy_s
      process_id: "cohort_service"
      flow_role: "electricity by actual duty"
      record_type: "meter and supplier record"
      raw_fields: "meter ids; opening/closing readings; original kWh or integrated MJ; rate timestamps if actual power rate; duty; country; voltage; supply mix; failed/start-stop/idle/cleanup/rework load; original cohort id; allocation"
      collection_method: "Read actual duty and facility meters; reconcile nonoverlapping duties without adding the facility total again. Convert kWh to MJ once, integrate genuine power rates only. Retain raw undivided load; check native country, voltage and consumption supply against the real provider. Assign original-cohort services separately."
      unit: "MJ"
      frequency: "each duty and reporting period"
      temporal_coverage: "full same manufacturing period or actual cohort service H"
      site_scope: "actual meters and country/voltage boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; bills; duty bridge; actual provider and allocation records"
    - protocol_id: cp_tools
      process_id: "manufacture"
      flow_role: "steel wheels reamers and their actual waste"
      record_type: "supplier and stock/wear/disposal record"
      raw_fields: "specific article; whole composition; measured article mass; opening/closing tools; acquisitions; external returns; measured wear; remaining-use history; disposal mass and contamination; duty; destination"
      collection_method: "Record each steel tool separately using actual whole article identity and measured mass. Keep supply once and stock/use/waste histories; no fixed lifetime or guessed kg/item. Reconcile detached material and actual destination; an unresolved identity never permits grouping unlike tools. Retain raw undivided records."
      unit: "kg"
      frequency: "each acquisition/renewal/disposal and period close"
      temporal_coverage: "full tool history serving the cohort"
      site_scope: "actual tool and cutting site"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier composition; article weighing; issue/return/wear logs; waste ticket"
    - protocol_id: cp_pack_m
      process_id: "manufacture"
      flow_role: "one steel drum pool and waste"
      record_type: "whole article supplier and disjoint physical-receipt packaging ledger"
      raw_fields: "article/material; measured whole mass; owner/provider; opening empty/WIP/FG/reusable; external purchase P; first external nonpurchase receipt N; external return received ER; corresponding closing C; shipment-attached S on gross movements; external return EO; waste W; internal reuse; exact OTHER duplicate X; original cohort; each receiving-side material/form/type/direction; original quantity/unit and conversion scope; receipt id/time/origin; custody; inherited vector; ER prior outward article id/event; supplier-included scope; actual rental/return/repair loads"
      collection_method: "Measure gross/tare or weigh actual articles, preserving whole supplied composition and real owner. Keep each pool and material separate under sb_packages; manufacturing/service receipts are disjoint. Internal reuse cancels. Keep all raw undivided legs and inherited vectors; no new purchase burden on mere return or movement. Record measured wear/retirement and actual empty-return transport. Separately recover each actual P/N/ER inward leg on the matching steel-drum input interface: bundled purchased components remain P without separate invoices; first borrowed/leased/entrusted/genuinely nonpurchase accompanied articles are N, never fabricated ER or opening stock. ER must match the same article's prior outward record. Physical receipts and procurement/burden ownership are separate accounts; carry real vectors and one provider scope including actual incremental services, with unknown history retained rather than zero. Do not manufacture a whole container and its already-included components twice."
      unit: "kg"
      frequency: "each receipt/packing/shipment/return/disposal and stock close"
      temporal_coverage: "complete pool including attached and reusable opening/closing stocks"
      site_scope: "same article pool and actual supplier/receiver network"
      aggregation_rule: "per reference flow"
      quality_evidence: "article measurements; invoices; pool bridge; dispatch and return tickets; waste record; provider ownership; first-receipt/custody agreement; prior-outward linkage; inherited-vector and service-scope evidence"
    - protocol_id: cp_pack_s
      process_id: "cohort_service"
      flow_role: "one steel drum pool and waste"
      record_type: "whole article supplier and disjoint physical-receipt packaging ledger"
      raw_fields: "article/material; measured whole mass; owner/provider; opening empty/WIP/FG/reusable; external purchase P; first external nonpurchase receipt N; external return received ER; corresponding closing C; shipment-attached S on gross movements; external return EO; waste W; internal reuse; exact OTHER duplicate X; original cohort; each receiving-side material/form/type/direction; original quantity/unit and conversion scope; receipt id/time/origin; custody; inherited vector; ER prior outward article id/event; supplier-included scope; actual rental/return/repair loads"
      collection_method: "Measure gross/tare or weigh actual articles, preserving whole supplied composition and real owner. Keep each pool and material separate under sb_packages; manufacturing/service receipts are disjoint. Internal reuse cancels. Keep all raw undivided legs and inherited vectors; no new purchase burden on mere return or movement. Record measured wear/retirement and actual empty-return transport. Separately recover each actual P/N/ER inward leg on the matching steel-drum input interface: bundled purchased components remain P without separate invoices; first borrowed/leased/entrusted/genuinely nonpurchase accompanied articles are N, never fabricated ER or opening stock. ER must match the same article's prior outward record. Physical receipts and procurement/burden ownership are separate accounts; carry real vectors and one provider scope including actual incremental services, with unknown history retained rather than zero. Do not manufacture a whole container and its already-included components twice."
      unit: "kg"
      frequency: "each receipt/packing/shipment/return/disposal and stock close"
      temporal_coverage: "complete pool including attached and reusable opening/closing stocks"
      site_scope: "same article pool and actual supplier/receiver network"
      aggregation_rule: "per reference flow"
      quality_evidence: "article measurements; invoices; pool bridge; dispatch and return tickets; waste record; provider ownership; first-receipt/custody agreement; prior-outward linkage; inherited-vector and service-scope evidence"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "distinct copper chips and rejected tubular pieces"
      record_type: "segregated weigh and destination records"
      raw_fields: "one stream identity; source lot; species and contamination; wet/dry basis; separately weighed quantity; opening/closing waste/WIP; measured whole and Cu; treatment destination; actual owner"
      collection_method: "Weigh each real stream independently before transfer. Preserve chips versus tube shape and actual contamination. Non-valued losses still retain their burdens; no inferred recovery credit or mass-balance-fitted species. Keep collected chips separate from airborne loss and keep raw undivided quantities."
      unit: "kg"
      frequency: "each event and period close"
      temporal_coverage: "all normal/failed/cleanup events and stock carryover"
      site_scope: "actual source and treatment transfer gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated tickets; sample analysis; transfer documents; destination and stock bridge"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "actual metallic Cu to air"
      record_type: "species-resolved emission measurement"
      raw_fields: "source and medium; sampled metallic Cu species and particle class; actual air state; measured mass or concentration and independently measured volume/rate; timestamps; capture fraction independently observed; uncertainty"
      collection_method: "Use independent species/particle evidence and measured uncaptured mass for the actual air compartment. Convert original units and integrate genuine rates once; integrated volume is not multiplied by duration. Do not infer Cu from total PM, copper oxide or one balance residual. Retain unknown loss explicitly; no fabricated zero. Store raw undivided emission."
      unit: "kg"
      frequency: "each representative actual emission duty/event"
      temporal_coverage: "full matched period including failed/cleanup duties"
      site_scope: "actual emission outlet and receiving air medium"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling QA; species identification; flow/state calibration; capture/emission partition"
    - protocol_id: cp_service
      process_id: "cohort_service"
      flow_role: "postrelease history and actual reject stream"
      record_type: "cohort FG movement and incremental service record"
      raw_fields: "original release id; original Q_c; observed H; opening/closing FG vectors; gross shipment; receiver receipt; returns; reverse original delivery link; rejected copper tube mass/state; actual incremental rework/handling; all actual new flows"
      collection_method: "Reconcile opening FG plus first-release transfer and returns with closing FG, gross dispatch and actual rejects/loss. Preserve original manufacture and service history; reverse original shipment as a movement, then assign only real additional loads. Do not create a second Q by receiving/releasing the same lot. H controls observed duty only. Keep raw undivided quantities and all unresolved contributions."
      unit: "kg"
      frequency: "each movement/service/rejection and stock close"
      temporal_coverage: "original cohort to actual receipt/returns and measured H"
      site_scope: "real source warehouse, carrier and specified receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "release/dispatch/receiver tickets; return/rework linkage; stock history; incremental meters"
    - protocol_id: cp_freight
      process_id: "cohort_service"
      flow_role: "one purchased road-freight service"
      record_type: "carrier activity and consignment record"
      raw_fields: "original cohort; carrier; actual road vehicle and load; route and distance; gross product-plus-packaging payload; actual returns; load limiting factor; supplier boundary; t*km"
      collection_method: "Use actual gross payload mass and distance once and record the original mass and km separately; retain loading/empty-return allocation. Keep raw undivided service with one provider. No double counting a provider-inclusive truck, fuel or emission; own-fleet operation needs explicit replacement exchanges."
      unit: "t*km"
      frequency: "each journey"
      temporal_coverage: "all actual cohort delivery and return journeys"
      site_scope: "actual source-to-receiver road route"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge and consignment; route/distance evidence; carrier model boundary; loading allocation"
  calculation_rules:
    - id: calc_numerator
      applies_to: "all inventory rows"
      rule: "Convert raw records to each actual extensive unit before exchange-specific attribution. For exchange i/cohort c form A_i_c from current attributable manufacture plus inherited opening WIP/unused input vector minus closing unfinished/unused unassigned vector, with disjoint stock corrections once. Do not subtract already-released FG manufacture. Keep all failed/Q0/start-stop/idle/cleanup/rework load. B_i_c is separate actual postrelease service, with original Q_c; V_i is independent gross physical amount."
      inputs:
        - cp_tube
        - cp_energy_m
        - cp_tools
        - cp_pack_m
        - cp_waste
        - cp_air
        - cp_service
        - cp_energy_s
        - cp_pack_s
        - cp_freight
      output: "A_i_c; B_i_c; V_i"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_gates
      applies_to: "all physical gates"
      rule: "Raw store: opening + external receipts = closing + issue + actual losses. Manufacture: opening WIP + issued whole tube and actual other physical inputs = closing WIP + first-released Q + joint useful tube + distinct chips/rejects and other actual physical outputs/transformations. Q already includes released closing FG. FG: opening FG + first-release transfer + actual returns = closing FG + gross dispatch + actual rejects/loss. Consolidation cancels matched internal transfers; do not add origins to a whole mixed outlet. Independently reconcile Cu/other elements and identified species; packaging pools follow sb_packages."
      inputs:
        - cp_tube
        - cp_release
        - cp_waste
        - cp_air
        - cp_tools
        - cp_service
        - cp_pack_m
        - cp_pack_s
      output: "physical and elemental residuals; V_i"
      source_ids:
        - swagelok-tube-preparation
        - jrc-ilcd-2010
    - id: calc_single_quotient
      applies_to: "all inventory rows"
      rule: "For Q>0 execute x_i = A_i / Q once for the attributed manufacturing account and v_i = V_i / Q once for the separate physical-audit account. Actual original-cohort service uses s_i_c = B_i_c / Q_c once, with original Q_c>0. These are parallel tagged views, never sequential divisions or two upstream providers. Cards/aggregation only consume the respective result. Reference product is 1 kg; other physical outputs are audit quantities, not additional credits or a second allocation of already-attributed x_i. With Q=0 retain all real loads and inherited vectors without a unit result."
      inputs:
        - A_i_c
        - B_i_c
        - V_i
        - cp_release
        - cp_service
      output: "x_i; v_i; s_i_c"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_source
      applies_to: "tube and receiver"
      requirement: "Verify actual new unalloyed uncoated tube lot and sole receiver feed requirement; retain contrary product states and uncertainties. No same-factory claim from technical synthesis."
      evidence: "supplier chemistry/form; receiver agreement; independent primary context"
    - id: dq_units
      applies_to: "each atomic exchange"
      requirement: "Keep original unit, measured basis/state and exact native property/unit chain; no default density, purity, yield or item mass."
      evidence: "calibrated raw records; exact property/unit references"
    - id: dq_history
      applies_to: "all loads and stocks"
      requirement: "Retain each inherited exchange vector and all failed/Q0/start-stop/idle/cleanup/rework loads; no missing stock or history replaced by zero."
      evidence: "raw/WIP/FG bridges; original release and period; incremental service history"
    - id: dq_allocation
      applies_to: "each shared exchange"
      requirement: "Record subdivision, determining causality and only genuine residual common-gate market values; document actual true joint/recycling history and unresolved terms."
      evidence: "attribution matrix; common gate/state/period; inventory conservation"
    - id: dq_completeness
      applies_to: "source projection and bilingual rules"
      requirement: "Audit every table cell and card field, complete descriptions/qualifiers/ancestors, calculation inputs/outputs and all four source fields; distinguish schema/finite checks from science and translation approval."
      evidence: "full raw-to-typed comparison; current source/content hashes; bilingual review"
validation_rules:
  - rule_id: val_identity
    applies_to: "reference and all native bindings"
    rule: "Require complete source/route/form/chemistry/grade/coating/contamination/type/geography/property compatibility. Recheck all formal name fields, synonyms and comments, not a classification label alone. A broader Product material identity requires independent actual source/state/function/receiver evidence and an exact property/unit-group/real-unit chain; a generic material placeholder is insufficient. Do not waive fixed CAS, chemistry, grade, shape, route, use or type restrictions. A candidate with conflicting type, pressed form, hydrometallurgical route or fixed assay cannot identify this unpressed material feed. Unresolved core output identity prevents treating the method as complete."
    source_ids:
      - rema-specs-2026
      - midland-copper-reception
      - midland-manufacturing-reception
  - rule_id: val_q
    applies_to: "all first-release cohorts"
    rule: "Check unique Q against first release and whole net weighing. Do not add closing released FG to Q, re-count dispatch/reinspection or make H a production denominator. Keep all failed/Q0 burdens without a unit result. Reconcile manufacturing, FG and consolidated physical gates."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: val_once
    applies_to: "inventory and collection"
    rule: "Verify original extensive units/reference states and attribution before the sole section 8 quotient. Collection stores raw undivided records; cards and aggregation consume the same result once. Separate burden quantities from physical audit quantities and services from production."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: val_balance
    applies_to: "whole mass elements and species"
    rule: "Reconcile full tube mass, useful tubes, tubular offcuts, chips, all losses and WIP independently of Cu/other-element balances; packaging is separate. Actual species/phase/free water/chemical transformation require independent evidence. Do not invent evaporation, oxygen, reaction water, copper density or a loss amount to close a residual."
    source_ids:
      - swagelok-tube-preparation
      - jrc-ilcd-2010
  - rule_id: val_packs
    applies_to: "each packaging material and pool"
