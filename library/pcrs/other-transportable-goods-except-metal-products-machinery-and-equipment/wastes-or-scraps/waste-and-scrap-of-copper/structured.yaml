system_boundary:
  rules:
    - rule_id: sb_chain
      applies_to: "manufacturing and receiving chain"
      rule: "Include real whole-tube receipt, layout/cutting into useful lengths and tubular residuals, actual reaming, source segregation, manual removal of detached foreign material, weighing and first acceptance to the specified recovery-feed conditions. Include actual storage/packing/handling and delivery through documented receiver receipt as original-cohort services. No already-finished-scrap packing shortcut."
      source_ids:
        - swagelok-tube-preparation
        - midland-copper-reception
    - rule_id: sb_upstream
      applies_to: "each supplied whole input"
      rule: "Inherit actual copper tube history once. Refining, alloy/grade preparation and forming already in the chosen upstream dataset are not new foreground steps. Assay/active ingredient/carrier-water subaccounts never repeat a whole purchase. A real onsite formulation instead needs separate purchased ingredients, mixing loads and losses. Match one provider per exchange; disclose boundary and recycling ownership."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_quality
      applies_to: "first acceptance"
      rule: "Retain solid clean unalloyed uncoated tubular offcuts separately from wire, nodules, chips, brass, old pipe with fittings and residues. ReMA Candy supports a clean-tubing trade description, not a universal copper percentage or acceptance for a specific lot. Oils/fuels/hazardous substances violate the cited receiver conditions. Contaminated material needs another evidenced route and actual outputs."
      source_ids:
        - rema-specs-2026
        - midland-copper-reception
    - rule_id: sb_q
      applies_to: "manufacturing and FG gates"
      rule: "Q is the whole net mass newly released once for the specified recycler feed. Closing released FG is already included in Q and cannot be added beside Q as another manufacturing output. Keep the FG physical gate: opening FG + first-release transfer + actual received returns = closing FG + gross dispatch + actual rejects/losses. Cancel first-release internal transfers in the consolidated gate. Delivery or re-inspection never creates another Q."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_history
      applies_to: "each exchange and stock"
      rule: "Record each opening/closing raw stock, WIP, unused input and FG quantity with its inherited exchange-burden vector and allocation state. Complete numerator history includes all failed lots, Q0 periods, start/stop, idle, cleanup, sampling and real rework. Carry unfinished attributable vectors forward exactly once; do not subtract released closing FG manufacture from manufacturing burden. Retain unassigned uncertainty."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_service
      applies_to: "postrelease cohort"
      rule: "Store actual duration H and original Q_c for storage/packing/handling/transport through receiver receipt. Services use original Q_c; H is an observation/allocation driver, never a production denominator. Actual returns retain original manufacture and only incremental service/rework burdens; internal cohort handovers cancel. Correct a voided release in the original ledger with an audit trail, never manufacture the same batch twice."
      source_ids:
        - jrc-ilcd-2010
        - midland-copper-reception
    - rule_id: sb_packages
      applies_to: "every physical packaging article"
      rule: "For each article/material separately, opening empty + opening attached WIP + opening attached FG + opening reusable pool + external purchases P + first external nonpurchase receipts N + external return received ER = corresponding closing stocks C + packaging accompanying gross physical shipments S + external empty/other returns EO + packaging waste W. Keep ownership and provider history. Internal reuse cancels; it is not another purchase, product Q or automatic coproduct. If an exact shipment term X is already in same-side OTHER, remove X from that OTHER entry only; do not remove an independent leg or both sides. Include original tube packaging and later offcut packaging if actually present. P includes components acquired with a purchased whole consignment even without a separate invoice. N is the actual first inward borrowed, leased, entrusted or genuinely nonpurchase supplier-accompanied article, distinct from P and ER; ER requires the same article's documented prior outward movement. Record each actual receiving-side atomic material/form/type/direction, original measured quantity/unit and scope, receipt id/time/origin, ownership/custody, cohort, inherited vector and provider boundary. Unknown history remains unknown, not zero. Reuse the matching whole-steel-drum input card for disjoint P/N physical interfaces, retaining each recoverable raw leg separately; a different actual article/material requires its own atomic exchange. Physical ingress does not itself assign a procurement burden: inherit the actual owner vector and count manufacture, included delivery and actual incremental rental/return/repair services once, without duplicating whole articles and their components."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_complete
      applies_to: "every actual route-dependent exchange"
      rule: "Every real additional supplied preparation, fuel, water stream, packaging component, maintenance item, waste and emitted species requires a separate atomic exchange/protocol before use. No other/zero bundle can hide it. The dry hand route does not prove zero auxiliary electricity or cleanup load. No boiler/steam/condensate is presumed; a real external return must keep its Product role, actual thermal state/enthalpy and supply agreement."
      source_ids:
        - swagelok-tube-preparation
        - jrc-ilcd-2010
