published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified source-segregated new-tube offcut supply to the specified copper-recovery interface, with original-cohort services and inherited history"
  allowed_use: "Declared matching attributional source/route/form/acceptance state and compatible provider boundaries"
  excluded_use: "Whole CPC coverage; alloy/old pipe/cable/slag/ingot equivalence; waste-treatment service; recycled-copper ingot or cathode substitution; invented recovery credit"
  required_metadata: "All reference qualifiers; raw lot/stock/meter/transport/receiver records; every native restriction; source edition/context; unique gate and allocation history"
  required_quality_disclosure: "Measured and unknown quantities separated; whole/elemental/species accounts; all failed/Q0 and stock burdens; provider/recycling uncertainty; no scientific or translation approval implied"
  update_trigger: "Different feed source/grade/coating/shape; powered/wet/chemical/thermal route; receiver requirement or supply role change; new native identity/property or provider; changed recycling ownership/history"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025, pp.203–204, 393/3936/39361 and neighbouring categories; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only; no manufacturing, acceptance or mapping approval"
  - id: "swagelok-tube-preparation"
    type: "extension_guidance"
    reference: "Southern Alberta Fluid System Technologies / Swagelok, Best Practice: Tube End Preparation, undated publisher page; https://safst.swagelok.com/en/resources/weekly-column/tube-preparation"
    used_for: "Wheel displacement versus sawing, measuring/cutting and distinct reaming burrs; qualitative mechanism only, no kerf/yield factor"
  - id: "rema-specs-2026"
    type: "standard"
    reference: "ReMA ISRI Specifications, January 2026, Red Metals printed pp.4–5 / PDF pp.8–9, Candy with adjacent Cliff/Berry/Clove/Drove; https://www.isrispecs.org/wp-content/uploads/2026/01/2026-January-ReMA_ISRI_Specifications.pdf"
    used_for: "Clean unalloyed uncoated tube-feed trade distinction; wire/nodules/alloy/residue counterexamples; buyer agreement; no copied purity number"
  - id: "midland-copper-reception"
    type: "extension_guidance"
    reference: "Midland Metals Limited, Trades, publisher page; https://midlandmetalsrecycling.co.uk/trades/"
    used_for: "Receiver accepts clean copper-tube lengths/offcuts; distinguishes used pipe with fittings and brass; weigh ticket and oil/fuel/hazard exclusions; no same-order acceptance proof"
  - id: "midland-manufacturing-reception"
    type: "extension_guidance"
    reference: "Midland Metals Limited, Manufacturing Scrap, undated publisher page; https://midlandmetalsrecycling.co.uk/manufacturing-scrap-2/"
    used_for: "Manufacturing copper scrap, loose forms/metal cuttings and calibrated weighing/traceability; same receiver as Trades, not independent lot confirmation; no tube-specific drum, composition, supply-role approval or inventory factor"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA – Detailed guidance, first edition March 2010, §§7.9.2–7.9.3 printed pp.255–272 / PDF pp.275–292, including VI recycling limitations; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision, exchange-specific determining causality, residual common-gate values, recycling history and inventory conservation; no industrial quantities or automatic credit"
