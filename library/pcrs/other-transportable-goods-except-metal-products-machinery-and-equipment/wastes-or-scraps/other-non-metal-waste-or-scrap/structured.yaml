allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared burdens"
    rule: "Subdivide scrap-only sorting/loading burdens (fully to scrap) and sheet-only operations first. Allocate common burdens by demonstrated physical causality; only otherwise use actual economic values at the same allocation point, state and period with independent review. Neither the scrap label nor mass alone establishes a zero or automatic mass allocation."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_economic
    applies_to: "residual shared burdens"
    rule: "At each common fabrication split g, measure contemporaneous generated scrap G_g and useful sheet S_g, including material retained in stock. For every actual valuable co-product j generated at that split, V_jg=m_jg*p_jg; alpha_scrap,g=V_scrap,g/sum(V_jg). Never substitute cross-period dispatched Q for generated G_g or pair Q with current-period sheet output. Use net prices at the common allocation point, removing only subsequent processing, packaging and freight. Retain price, period, currency and sensitivity. Require sum(V_j)>0 and nonnegative values; otherwise review another method instead of applying this formula."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_no_credit
    applies_to: "scrap and returns"
    rule: "At each split g and for each exchange k, B_scrap,g,k=B_scrap-only,g,k+alpha_scrap,g*B_shared,g,k; B_sheet,g,k=B_sheet-only,g,k+alpha_sheet,g*B_shared,g,k. Sheet-only inputs never enter scrap burden. Shares of every common exchange sum to its original quantity. Keep each generated lot’s vector through stock and release; subsequent scrap-only handling is assigned once to the relevant lot. Internal loops, avoided disposal and downstream substitution earn no credit in this dataset; retain actual waste-treatment burdens."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "workshop"
      flow_role: "sheet and mica mass"
      record_type: "weighing and acceptance"
      raw_fields: "F,S,Q,R,C,A; opening/closing WIP; gross,tare; lot; moisture; rejects; receiver; origin"
      collection_method: "Batch weighing, lot tracing, paired moisture sampling and buyer acceptance; opening/closing stocktaking ;  Sum same boundary/period; deduplicate handovers, track internal loops separately; normalize by Q"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "one declared representative period"
      site_scope: "generating workshop and outsourced fabrication"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, specification, source records, mass balance, buyer receipt"
    - protocol_id: cp_utilities
      process_id: "workshop"
      flow_role: "electricity; blade; inbound freight"
      record_type: "meter and stock records"
      raw_fields: "E,B,W,T; multiplier; blade stocks; payload; km; supplier boundary; dedicated/shared split"
      collection_method: "Submeter readings, tool stocks/weighing, inbound freight payload/distance; check supplier overlap ;  Sum each quantity separately then divide by Q; never add unlike units"
      unit: "kWh; kg; t km"
      frequency: "meter interval and each shipment"
      temporal_coverage: "same declared period"
      site_scope: "same workshop and provider boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter multiplier, stock records, freight notes, supplier scope, allocation evidence"
    - protocol_id: cp_air
      process_id: "workshop"
      flow_role: "uncaptured mica particulate"
      record_type: "emission measurement"
      raw_fields: "concentration; gas volume; run time; background; size; medium; dust capture; uncertainty"
      collection_method: "Measured mass concentration times matching gas volume, or a fully validated mass balance; never label an unexplained material difference as an emission ;  A=sum(c_i*V_i) after unit conversion; deduplicate stack/fugitive sources; A/Q"
      unit: "kg"
      frequency: "each representative operating condition"
      temporal_coverage: "same declared period"
      site_scope: "actual release points and fugitive sources"
      aggregation_rule: "per reference flow"
      quality_evidence: "method, size fraction, detection limit, sampling coverage, uncertainty"
    - protocol_id: cp_allocation
      process_id: "workshop"
      flow_role: "shared burden split"
      record_type: "allocation records"
      raw_fields: "dedicated burdens; common burdens; G_g,S_g; net prices; currencies; split point; lot; H_open,k; B_scrap,g,k; B_handling,k; H_release,k; H_close,k; H_loss,k; H_transfer,k"
      collection_method: "Process subdivision, causal evidence and common-point price records; independent review ;  Retain pre/post allocation totals; sum of shares=1"
      unit: "kg; currency; activity units"
      frequency: "each reporting period"
      temporal_coverage: "same declared period"
      site_scope: "all coproducts at common point"
      aggregation_rule: "per reference flow"
      quality_evidence: "original accounts, method, sensitivity and review"
  calculation_rules:
    - id: calc_normalize
      applies_to: "inventory"
      rule: "When Q>0, audit x=X/Q for each measured physical total X; Q is accepted first-handover net scrap in the period, never sheet input or sum of all output. These audit amounts are not allocated model exchanges. When Q=0 retain raw X, stocks and destinations without any division."
      inputs:
        - X
        - Q
      output: "per 1 kg accepted scrap"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "mica mass"
      rule: "F+O=Q+S+R+C+A+K, with O/K opening/closing mica WIP and awaiting-handover stocks in the same boundary. Record free-water changes separately and cross-check paired dry mass. Explain residual and uncertainty; neither zero it nor automatically assign it to emissions."
      inputs:
        - F
        - O
        - Q
        - S
        - R
        - C
        - A
        - K
        - w
      output: "mass closure and discrepancy"
      source_ids: []
    - id: calc_burden
      applies_to: "allocated inventory"
      rule: "For each exchange k, H_open,k+sum(B_scrap,g,k)+B_handling,k=H_release,k+H_close,k+H_loss,k+H_transfer,k. Here H covers only post-split scrap WIP and awaiting-handover lots. Carry their original allocated values and add only actual new work. Before the common split, maintain a separate unallocated WIP vector U_open,k+U_new,k=U_to_split,k+U_close,k+U_loss,k+U_transfer,k; only U_to_split enters the relevant generation-point allocation once. Never put pre-split WIP into H_open or charge U_to_split again as a fresh purchase. Retain closing stock vectors for later periods. Document loss/reject and transfer vectors with destinations; they cannot disappear or become credits. Model exchange i_k=H_release,k/Q only for Q>0, exactly once. Physical audit X/Q must never be used as an unallocated model input or divided again. Preserve electricity, material, freight and treatment components separately with identity, unit, provider, period, allocation and lot binding; do not sum unlike units or only carry an impact score."
      inputs:
        - cp_allocation
        - Q
      output: "allocated burden per kg"
      source_ids:
        - ilcd-allocation-2010
    - id: calc_zero_release
      applies_to: "zero dispatch and carryover"
      rule: "When Q=0, calculate neither X/Q nor H_release/Q; preserve raw physical amounts, generation lots, every exchange burden, closing stock, losses and destinations. Example: t1 generates G1>0 but Q1=0; put B_scrap,1 and dedicated handling into closing stock. With no new cutting in t2, H_open,2=H_close,1; release carries prior allocated sheet, electricity and all other exchanges, adds actual t2 dedicated work and retains t2 closing/loss/transfer vectors. Normalize once only against actual Q2>0. No cutting in t2 does not mean zero burden. For partial release use actual lot tracing or a disclosed consistent inventory method and retain the remaining share."
      inputs:
        - cp_allocation
        - lots
        - Q
      output: "raw stock ledger and released vector"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_acceptance
      applies_to: "scrap"
      requirement: "Require actual buyer contamination/size-state specifications and lot results; no universal purity, yield or energy defaults"
      evidence: "lot acceptance and sampling"
    - id: dq_origin
      applies_to: "source"
      requirement: "Trace fabrication origin and unbonded state; mineral name or colour cannot prove provenance or absence of contamination"
      evidence: "sheet records and inspection"
    - id: dq_unknown
      applies_to: "all exchanges"
      requirement: "Distinguish unknown, measured zero and not applicable; verify actual supplier native property, medium and unit chain; unavailable empirical ranges remain collection needs"
      evidence: "original records and uncertainty"
validation_rules:
  - rule_id: validate_gate
    applies_to: "reference product"
    rule: "Reject non-fabrication origin, ground, bonded or mixed mine scrap, missing buyer acceptance or duplicate first release. Q must be positive and traceable net mass."
    source_ids:
      - wco-mica-2022
      - usgs-muscovite-1950
  - rule_id: validate_inventory
    applies_to: "inventory and calculations"
    rule: "Check atomic cards, protocols, per-kg denominator, mass/burden closure, moisture basis, supplier overlap, outsourcing, releases and actual handover. Unit support cannot establish commodity identity."
    source_ids: []
  - rule_id: validate_readiness
    applies_to: "dataset"
    rule: "Missing actual exchange UUIDs, essential quantities, acceptance, allocation or release evidence prevents the dataset being released as fully verified background data; structural methodology checks are not scientific approval."
    source_ids: []
  - rule_id: validate_carry
    applies_to: "lots and burden vectors"
    rule: "Verify per-exchange generation-point allocation and opening+new=released+closing+loss+transfer. Retain lost/rejected lots’ historic burdens and treatment in explicit destination accounts; reassignment to surviving goods needs separate reviewed policy, never an exemption by stock subtraction. Check the zero-dispatch/next-period-no-production example. Reject audit X/Q entering the model, sheet-only inputs charged to scrap, or repeated division by Q."
    source_ids:
      - ilcd-allocation-2010
