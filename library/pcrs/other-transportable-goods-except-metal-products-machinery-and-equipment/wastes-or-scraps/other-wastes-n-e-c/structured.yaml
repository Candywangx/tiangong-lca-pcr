allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "This is an attributional supply dataset with an explicit allocation partition. Document why subdivision cannot remove joint production and why substitution/system expansion does not answer this dataset goal; consequential recovery-credit claims require a separate model. The general allocation hierarchy is supported by ILCD, not by the oil-processing chapter. [jrc-ilcd-2010]"
    source_ids: []
  - rule_id: allocation_upstream
    applies_to: "release"
    rule: "Residual-product or waste tariff language does not prove burden-free supply. First subdivide refinery operations and directly assign dedicated recovery burdens. For inseparable joint production, document causal physical allocation; if not defensible, document economic allocation over the same period with masses, prices, currencies and sensitivity. Do not prescribe a numerical share or import an oil dataset already carrying all burdens plus a second full utility inventory."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_release
    applies_to: "release"
    rule: "Directly assign lot-specific holding, heating, cleaning and rejection burdens. Shared tank time or metered use requires documented allocation across all serviced lots, retaining burdens for failed lots. Do not shift all failure burden to disposal or divide by gross intake. Retain physical outgoing condensate without unverified substitution credits."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_crude_intake
      process_id: "release"
      flow_role: "crude_intake"
      record_type: "New whole-crude receipt"
      raw_fields: "source lot; receiving tank; gross/tare; transfer meter; opening/closing unreleased WIP; original exchange burden vector; moisture; sampling temperature"
      collection_method: "Weigh new as-received crude net of equipment tare, or calibrated mass-meter transfer from the named single scrubber. Do not add opening heel to new receipts; carry it in the WIP ledger with its inherited upstream burden."
      unit: "kg"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/mass-meter calibration; source formation records; WIP burden ledger"
    - protocol_id: cp_release_electricity
      process_id: "release"
      flow_role: "release_electricity"
      record_type: "Tank electricity meter readings"
      raw_fields: "meter id; voltage; supplier; location; start/end kWh; tracing/pumping runtime; allocation to lot; supplier included-scope"
      collection_method: "Read calibrated electrical meter differences in kWh for actual pumping/tracing and shared idle periods. Record exact supplier gate and property independently; no net-calorific-value property is presumed. Remove overlap with crude-provider electricity."
      unit: "kWh"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration and wiring coverage; supplier scope; allocation logs"
    - protocol_id: cp_release_steam
      process_id: "release"
      flow_role: "release_steam"
      record_type: "Steam delivery record"
      raw_fields: "steam meter; delivered kg; pressure; temperature; dryness; supplier gate; heat/mass billing convention; return condensate agreement; lot heat time"
      collection_method: "Meter delivered steam mass for actual indirect tank heating; retain thermal state and actual supplier coverage. If billed in heat units, collect supplier enthalpy convention and condensate-return basis before conversion; do not assume a fixed MJ/kg."
      unit: "kg"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Steam-meter calibration; supplier enthalpy/billing statement; heating and return logs"
    - protocol_id: cp_cleaning_water
      process_id: "release"
      flow_role: "cleaning_water"
      record_type: "Cleaning water meter record"
      raw_fields: "cleaning event; water meter; delivered kg or volume; density and temperature if volumetric; tank; lot service allocation; supplier gate"
      collection_method: "Meter actual external tank-cleaning water separately from condensate and formulated cleaner water. Convert volume only using compatible measured density; record returned or discharged destination."
      unit: "kg"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Water-meter calibration; density measurement; cleaning work order"
    - protocol_id: cp_cleaning_naoh
      process_id: "release"
      flow_role: "cleaning_naoh"
      record_type: "Cleaning solution receipt and use"
      raw_fields: "supplier; formulation; batch; NaOH mass fraction; gross/tare; used solution kg; opening/closing stock; purchased premix or on-site dilution"
      collection_method: "Weigh the actual sodium hydroxide aqueous formulation consumed, preserving supplied concentration. Active NaOH assay is a non-additive subledger, not a second purchase. Record dilution water separately only when supplied separately, avoiding premix water duplication."
      unit: "kg"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Formulation certificate; scales; stock/use reconciliation; cleaning record"
    - protocol_id: cp_reference_product
      process_id: "release"
      flow_role: "reference_product"
      record_type: "First quality-release weigh record"
      raw_fields: "unique original lot; quality-release timestamp; gross/tare; net as-received kg; moisture assay; temperature/state; receiver acceptance; released FG; actual dispatch timestamp"
      collection_method: "Use calibrated scale or mass-meter records for first accepted whole-product mass, excluding equipment tare. Distinguish first release from dispatch; include newly released closing FG in Q once and exclude historical FG, reinspection, resale and previously released returns."
      unit: "kg"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated weighing; signed quality/receiver release; unique lot FG history"
    - protocol_id: cp_offspec_distillate
      process_id: "release"
      flow_role: "offspec_distillate"
      record_type: "Rejected crude removal ticket"
      raw_fields: "lot; rejection stage; reason; net wet kg; destination; internal rework or external removal; inherited exchange vector"
      collection_method: "Weigh off-spec whole crude separately at its actual external removal gate. Internal rework cancels within its original lot and is not an external waste input/output; carry inherited burdens and all actual added service."
      unit: "kg"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Rejection certificate; calibrated net weights; treatment or rework receipt"
    - protocol_id: cp_cleaning_liquor
      process_id: "release"
      flow_role: "cleaning_liquor"
      record_type: "Spent alkaline liquor removal ticket"
      raw_fields: "cleaning event; whole liquor wet kg; NaOH/oil content; volume and measured density if used; tank; treatment receiver; external gate"
      collection_method: "Weigh or meter the actual spent alkaline cleaning liquor and measure density when converting volume. Preserve whole wet mass and separately assay contaminants; do not add pollutant assays again to waste mass or call retained liquor an elementary emission."
      unit: "kg"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated weights/meters; density and composition test; treatment receipt"
    - protocol_id: cp_steam_condensate
      process_id: "release"
      flow_role: "steam_condensate"
      record_type: "External condensate return record"
      raw_fields: "return meter; net kg; temperature; pressure; supplier return gate; actual return enthalpy and credit convention"
      collection_method: "Meter condensate actually returned across the supplier gate, with thermal state and return-credit convention. Internal recirculation is not this exchange. Reconcile returned mass with steam supply and actual losses without imposing equality."
      unit: "kg"
      frequency: "Each lot and each event"
      temporal_coverage: "Complete declared release cohort"
      site_scope: "Same refinery and actual contractor interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Condensate-meter calibration; thermal state; supplier billing reconciliation"
  calculation_rules:
    - id: cohort_denominator
      applies_to: "reference_product"
      rule: "Q = sum of net kg first accepted original releases in the cohort, including newly released product still in closing finished stock, excluding tare, rejected quantities, historical released opening stock and re-releases. Record internal rework without a new external intake."
      inputs:
        - cp_reference_product
      output: "Q"
      source_ids:
        - aocs-deodorization
    - id: cohort_inventory
      applies_to: "all inventory rows"
      rule: "Divide each attributable cohort amount by the same Q; input crude includes allocated opening stock and excludes closing stock retained for later cohorts. Reconcile whole material separately from water, steam condensate and cleaning."
      inputs:
        - Q
        - "collection records"
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - aocs-deodorization
    - id: stock_closure
      applies_to: "crude_intake; reference_product; offspec_distillate"
      rule: "Unreleased gate: opening unreleased crude + new crude receipt = Q + closing unreleased crude + rejected or sampled removal + measured losses. Finished-stock gate: opening released stock + Q + genuine previously released external returns = closing released stock + all dispatch + finished-stock waste or loss. Keep internal rework inside its original gate; Q cancels when gates combine, so closing finished stock is not added again as production. Investigate residual error using measured uncertainty, not a fabricated tolerance."
      inputs:
        - "stock and weigh records"
      output: "closure evidence"
      source_ids:
        - aocs-deodorization
  data_quality_requirements:
    - id: quality_lot
      applies_to: "release"
      requirement: "Measure moisture, fatty acids, tocopherols and sterols on a declared basis with sampling and analytical uncertainty. Literature sample values are not plant defaults, yield factors or acceptance limits."
      evidence: "Lot certificate; pmc-soybean-2020"
    - id: quality_burden
      applies_to: "release"
      requirement: "Obtain exact supplier gate and utilities coverage, documented allocation, hazard/transport assessment and signed receiver acceptance before complete LCI use. Unknown amounts stay unknown."
      evidence: "Supplier records; signed lot release"
validation_rules:
  - rule_id: validation_identity
    applies_to: "release"
    rule: "Require exact route, whole condensate state and lot origin. Reject physical-refining Waste-flow bindings, isolated compounds and source-oil substitutions."
    source_ids:
      - unsd-cpc3-2026
      - cafc-adm-2009
      - pmc-soybean-2020
  - rule_id: validation_quantity
    applies_to: "release"
    rule: "Require Q > 0, first-release uniqueness, net mass and stock closure; normalize all rows to the same 1 kg reference flow. Do not use recovered vitamin mass, dry mass or truck gross mass as Q."
    source_ids:
      - unsd-cpc3-2026
      - cafc-adm-2009
      - pmc-soybean-2020
  - rule_id: validation_completeness
    applies_to: "release"
    rule: "Unresolved flow identities, empirical amounts, supplier burdens or safety evidence prevent complete study qualification. Record all actual atomic exchanges and conditional absences. Mechanical PCR checks do not approve methodology or factory data."
    source_ids:
      - unsd-cpc3-2026
      - cafc-adm-2009
      - pmc-soybean-2020
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Incoming whole crude feedstock for separately modelled recovery"
  allowed_use: "Only compatible crude chemical-refining soybean lots with matching gate and disclosed allocation"
  excluded_use: "Physical-refining fatty acid distillates; selective hot/cold scrubber fractions; isolated tocopherols, sterols and commercial fatty acids; soapstock; feed preparations; edible soybean oil; municipal waste, sewage sludge, waste solvents and chemical wastes under other HS branches; brewery wastewater; downstream recovery services."
  required_metadata: "All reference qualifiers, cohort Q, actual native flow/property/unit identities, upstream source coverage"
  required_quality_disclosure: "Measured coverage, unresolved identities, allocation sensitivity, uncertainty and safety acceptance"
  update_trigger: "Change of source oil, refining mode, scrubber arrangement, state, gate, receiver specification or supplier coverage"
data_sources:
  - id: "unsd-cpc3-2026"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 explanatory notes, 23 October 2026, CPC3 row 1947; June 2025 frozen structure: https://unstats.un.org/unsd/econstats/classifications/cpc"
    used_for: "HS 2022 3825.90 link and adjacent exclusions; the case-specific mapping decision is recorded separately"
  - id: "cafc-adm-2009"
    type: "official_guidance"
    reference: "ADM v United States, 2008-1342, majority opinion, 26 March 2009: https://www.cafc.uscourts.gov/opinions-orders/08-1342.pdf"
    used_for: "Whole residual product identity; lower 3824.90 judgment reversed; no plant quantities"
  - id: "cbp-n079775"
    type: "official_guidance"
    reference: "US CBP NY N079775, 30 October 2009: https://rulings.cbp.gov/ruling/N079775"
    used_for: "Separate soybean distillate recovery-feedstock ruling; historical import only"
  - id: "aocs-deodorization"
    type: "handbook"
    reference: "AOCS Lipid Library, Deodorization, revised 23 July 2019: https://www.aocs.org/resource/deodorization/"
    used_for: "Condensation, chemical/physical route distinction and dedicated release inventory design; no default operating values or allocation share"
  - id: "pmc-soybean-2020"
    type: "literature"
    reference: "Processing impact on tocopherols and triglycerides composition of soybean oil and its deodorizer distillate evaluated by high-performance liquid chromatography: https://pmc.ncbi.nlm.nih.gov/articles/PMC7763106/"
    used_for: "Original plant samples justify lot analysis and variability disclosure; not customs-lot or plant yield evidence"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for LCA, Detailed guidance (2010), section 7.9; https://publications.jrc.ec.europa.eu/repository/handle/JRC48157"
    used_for: "General multifunctionality, subdivision and allocation hierarchy; PCR-specific partition and empirical shares require study evidence"
