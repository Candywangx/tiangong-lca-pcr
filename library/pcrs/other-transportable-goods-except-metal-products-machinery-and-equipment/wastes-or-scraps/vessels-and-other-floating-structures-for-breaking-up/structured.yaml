measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: raw_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual row numerator property"
      uuid: ""
    required_unit: "Declared row unit"
    rule: "Preserve native numerator units. Convert kWh to MJ using1kWh=3.6MJ; a metric tonne t is1000kg, while long-ton displacement records require their own verified unit conversion. No assumed density, vessel weight, grade or per-item mass. A future Number of items reference must retain Item(s)/item with factor1 and independently measured mass for any kg bridge."
  - id: first_gate
    applies_to: "whole_vessel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is newly first-qualified net whole-vessel mass at the recycling reception gate: for the one declared vessel Q equals its measured accepted net mass if the unique event occurs, otherwise Q=0. Prior release, a second inspection, redelivery or custody change does not create new Q. Closing FG already includes any first-released vessel still held and is not added to Q again. Storage, care, mooring, handling, gross shipment and genuine incremental return/rework services retain the original cohort Qc. H records such service activity only and is not a production denominator."
process_map:
  - id: withdrawal
    name: "Withdraw and identify the original retired vessel"
    inclusion: "required"
    inclusion_condition: "Establish the original hull, cessation of service, actual configuration/tank inventory and burdened transfer or stock interface; never buy a complete new ship for this route."
    role: "foreground"
    quantitative_reference: "Internal original-vessel cohort; cancel combined transfers"
  - id: prepare
    name: "Ship-specific inspection, necessary preparation and containment"
    inclusion: "required"
    inclusion_condition: "Perform actual surveys and necessary securing, liquid/loose-store removal and containment before the agreed gate, retaining all residual hazards and actual rejected/failed work. Each optional material applies only if used. Cutting is excluded."
    role: "foreground"
    quantitative_reference: "Internal original-vessel cohort; cancel combined transfers"
  - id: support
    name: "Measured utilities, care, owned movement and direct releases"
    inclusion: "required"
    inclusion_condition: "Bound cross-cutting actual preparation/care/own-vessel final-movement operations, with metered supplies, original tank draws and actual direct emissions. Allocate by actual suboperation/cohort. Exclude supplier-contained work already in contracted services."
    role: "foreground"
    quantitative_reference: "Internal original-vessel cohort; cancel combined transfers"
  - id: handover
    name: "Transfer and first qualified whole-vessel reception"
    inclusion: "required"
    inclusion_condition: "Actual self-movement and/or separately contracted tow, safe placement, arrival walk-through and documented qualified acceptance before cutting. Self-movement fuel/emissions are in support once. Failed arrival and redelivery remain original cohort services."
    role: "foreground"
    quantitative_reference: "whole_vessel"
