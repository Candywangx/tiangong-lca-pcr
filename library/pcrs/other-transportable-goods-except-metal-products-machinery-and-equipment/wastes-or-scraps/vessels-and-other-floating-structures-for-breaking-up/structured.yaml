allocation_rules:
  - rule_id: allocation_exclusive
    applies_to: "all_processes"
    rule: "Use measured dedicated operations and actual or virtual subdivision first, including the retirement vessel, each removed physical stream and each service cohort. Assign an embodied input only to its actual destination. Do not allocate all flows using a single blanket mass or revenue share."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causal
    applies_to: "remaining_shared_exchanges"
    rule: "For each remaining shared exchange demonstrate the determining physical causal relationship and measure its driver for all served outputs/services. Mooring occupation, pump work and delivery support can have different drivers; duration alone, mass alone or hull value alone is not automatically causal. Reconcile assigned quantities to each raw parent total."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "irreducible_common_process"
    rule: "Only the genuinely irreducible remainder uses actual contemporaneous market values of actual functions in their actual condition at one common process gate, after all dedicated/causal assignments. Retain amounts, values, currency/time, receiver conditions and signs; missing or ill-defined values require method review. This is not arbitrary physical-versus-economic choice and provides no fixed ratio."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_history
    applies_to: "withdrawal; handover"
    rule: "The general allocation hierarchy is not an end-of-life cutoff rule. Declare the governing original construction/service-to-retirement transfer method and inherited exchange vector once, separately from incremental preparation burdens. A removed fuel, used oil or equipment output does not automatically earn avoided-primary production credit. Unresolved historical scope is explicit and cannot be called a complete life cycle result."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_components
    applies_to: "drum_p; drum_next; drum_er"
    rule: "Apply the complete component physical-receipt ledger and separate ownership/cohort/burden/service accounts in boundary_receipts. First entrusted/borrowed/rented receipt is N_ext, never fabricated purchase or ER. Preserve original component burden once and charge only real incremental preparation/rental/return work under the same allocation hierarchy; no automatic free component, coproduct, new Q or credit."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "handover"
      flow_role: "Actual accepted net vessel mass"
      record_type: "Measured original event and stock records"
      raw_fields: "IMO number; hull identity; configuration; accepted net mass M; current survey reference; draught/freeboard observations; seawater density and temperature; hydrostatics revision; tank soundings; contents density; changes since survey; exclusions; calibration; uncertainty"
      collection_method: "Use traceable acceptance records for the accepted complete unit of the same configuration."
      unit: "kg"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "accepted net mass per unit"
      quality_evidence: "Vessel-specific controlled survey and signed corrected mass acceptance; calibrated instruments; complete tank/configuration change records; nma-lightship-2020"
    - protocol_id: cp_origin
      process_id: "withdrawal"
      flow_role: "Original burdened whole vessel and history"
      record_type: "Measured original event and stock records"
      raw_fields: "IMO identity; original hull/configuration; steel construction record; service-withdrawal time; owner/custodian; opening physical stock; actual first purchased receipts; actual nonpurchase first receipts; prior dispatch matched returns; tank/component inventories; upstream boundary; source provider; inherited exchange vector; unresolved history"
      collection_method: "Reconcile original service/maintenance documents, actual withdrawal survey and custody/ownership records with physical stocks and transfer events. Keep purchasing and asset-stage transfer separate."
      unit: "kg"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Signed withdrawal and transfer/stock ledger; original configuration history; explicit study method and burden provenance"
    - protocol_id: cp_release
      process_id: "handover"
      flow_role: "Unique first qualified whole-vessel release"
      record_type: "Measured original event and stock records"
      raw_fields: "IMO identity; receiver legal identity; vessel-specific recycling plan; IHM parts/version/change; receiver capability and actual applicable authorizations; arrival/placement; inspection findings; unique first qualified release time; accepted mass; original Qc; opening/closing FG; actual refusal/redelivery"
      collection_method: "Match arrival walk-through and resolved acceptance conditions to this original hull, current IHM and receiver evidence; identify the one first release and preserve prior release history."
      unit: "kg"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Signed ship-specific reception, actual permits/restrictions where applicable and mass record; a contract/certificate alone is insufficient"
    - protocol_id: cp_liquids
      process_id: "prepare"
      flow_role: "Supplied cleaning liquid and tank stocks"
      record_type: "Measured original event and stock records"
      raw_fields: "Actual water provider; meter opening/closing; actual receipt event; purchased/nonpurchase first receipt split; tank identity; supplied state; volume or mass; substance-specific density; temperature; retained/removed/evaporated quantities; actual cleaning activity"
      collection_method: "Meter actual transfers and independently reconcile tank soundings and actual losses; use actual density for a mass bridge. No assumed washing demand."
      unit: "kg"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Calibrated meter/tank table; actual density/temperature test and transfer tickets"
    - protocol_id: cp_materials
      process_id: "prepare"
      flow_role: "Actual supplied pads and purge gas"
      record_type: "Measured original event and stock records"
      raw_fields: "Individual exact material/form/grade; whole supplied formulation; provider; actual purchase and nonpurchase first receipts; stock; actual use; cylinder tare separately; gas species purity; pressure/temperature; integrated volume or true rate/time; density; actual loss and fate"
      collection_method: "Weigh exact supplied articles and meter gas under documented state; reconcile real use and loss. Split each actual additional material and all real cylinder/component interfaces before claiming completeness."
      unit: "kg"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Supply documents; specification; scale/gas-meter calibration; actual procedure and custody events"
    - protocol_id: cp_components
      process_id: "prepare"
      flow_role: "Exact HDPE drum and all actual component event ledgers"
      record_type: "Measured original event and stock records"
      raw_fields: "Exact material/form/type; component ID and actual tare; event ID/time/direction; owner; original cohort; opening empty/attached WIP/FG/reusable stock; P actual purchased first receipt; N_ext actual nonpurchase first receipt including accompanying/entrusted/borrowed/rented; ER and original prior outward dispatch; closing stock; grossS; EO; W; internal issues/reuse; inherited exchange vector; supplier-included scope; genuine incremental rental/return service; measurement uncertainty"
      collection_method: "Weigh each actual component type/event and audit mutually exclusive P, N_ext and genuine ER with outward history. Close opening+P+N_ext+ER=closing+grossS+EO+W at the same physical gate; cancel internal stock issues and do not substitute opening stock for current receipts."
      unit: "kg"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Atomic measured receipts and dispatches; actual tare; custody and original-cohort proof; no missing real interface"
    - protocol_id: cp_residues
      process_id: "prepare"
      flow_role: "Each actual removed stream and receiver"
      record_type: "Measured original event and stock records"
      raw_fields: "Stream ID; material/species/physical state; source tank/location; original vessel and history; actual gross/tare/net; oil/water/solids or relevant assay; recovered versus unusable status; retained onboard quantity; receiver; transport; treatment provider boundary; actual component events; actual releases"
      collection_method: "Measure each distinct complete wet stream at transfer; verify representative assay and actual fate. Stream partitions sum to the whole without additive duplication. Keep IHM location and post-removal update matched to the same ship."
      unit: "kg"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Scale/calibration; transfer and receiver tickets; actual composition and tank/IHM change records"
    - protocol_id: cp_utilities
      process_id: "support"
      flow_role: "Each actual fuel, lubricant and electricity supply/use"
      record_type: "Measured original event and stock records"
      raw_fields: "Meter/tank ID; exact fuel or complete lubricant; geography and voltage; provider/version/contained scope; actual purchased/nonpurchase first receipts; original inherited tank stock; opening/closing stock; retained/removal amounts; raw mass or energy; integrated volume or true rate/time; measured density/state; actual carbon/sulfur; operations; failed/idle/start/stop/cleanup/rework work; allocation driver"
      collection_method: "Collect raw fuel draws/makeup and meter differences by suboperation; convert actual units before allocation. Preserve inherited tank vectors and subtract only documented stock changes or provider-contained duplicate scope."
      unit: "kg; MJ"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Calibrated meters/tank tables; actual formulation/density; invoices and nonpurchase receipt evidence; raw totals and causal allocation audit"
    - protocol_id: cp_species
      process_id: "support"
      flow_role: "Each molecular release and oxygen uptake"
      record_type: "Measured original event and stock records"
      raw_fields: "Actual species and CAS; emitting operation; medium/location; sampling method; gas temperature/pressure/moisture; measured concentration; actual integrated gas volume or rate/time; background/inlet concentrations; actual fuel assay; independent water/element balances; retained and transferred quantities; provider-contained emissions; detection limits; uncertainty"
      collection_method: "Integrate measured species concentration with compatible gas flow, or use independently evidenced substance balance without fitting unknowns. Preserve raw indicator text and unsupported speciation as unresolved; do not turn nondetection into proven zero."
      unit: "kg"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Original lab/stack/engine records and calibration; independent mass and elemental closure; explicit species and compartment limits"
    - protocol_id: cp_water
      process_id: "support"
      flow_role: "Actual sea intake and return"
      record_type: "Measured original event and stock records"
      raw_fields: "Inlet/outlet location and time; source/receiving medium; meter; integrated volume or true rate/time; salinity; density; temperature/thermal state; retained ballast/tank changes; actual contaminants and treatment; original source cohort"
      collection_method: "Meter intake/return and reconcile separate original ballast, retained water, evaporation and transfer to external treatment; measure actual density only when mass is needed."
      unit: "m3"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Calibrated liquid-flow meter; actual salinity/density and thermal-state evidence; relevant actual discharge conditions"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "Actual transfer/tow and original-cohort services"
      record_type: "Measured original event and stock records"
      raw_fields: "Original IMO identity and Qc; mode; tug/provider; actual route endpoints; departure/arrival/placement; completed trip; actual hours H; provider fuel/utility/emission boundary; owner supplies; waiting/refusal/redelivery; service allocation driver; actual component receipt/dispatch events"
      collection_method: "Match actual navigation/tow logs and service receipt to the specific original ship and receiver; separate self-movement raw utilities from complete contracted services. Do not convert a trip into cargo transport or create new Q from H."
      unit: "h"
      frequency: "Each event and opening/closing period"
      temporal_coverage: "Withdrawal through acceptance; retain all failures and later original-cohort services"
      site_scope: "Named actual vessel, preparation sites, route and receiver gate"
      aggregation_rule: "per one accepted finished unit"
      quality_evidence: "Signed trip/tow records; provider-contained scope; actual reception; original cohort and incremental service evidence"
  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "q_ref = q_item / M; q_item = exchange amount per one accepted finished unit; q_ref = exchange amount per 1 kg reference flow."
      inputs:
        - q_item
        - M
        - cp_mass
      output: "q_ref"
      source_ids:
        - nma-lightship-2020
    - id: raw_conversion
      applies_to: "all_processes"
      rule: "Convert raw measurements to the declared numerator unit before attribution:1kWh=3.6MJ; actual tonnes=1000kg. Integrate only genuine rates; measured integrated volume is already a total. Mass from liquid/gas volume requires independently measured substance-specific density at matching conditions. Preserve original raw values and all conversion evidence."
      inputs:
        - raw_meter
        - raw_volume
        - raw_rate
        - elapsed_time
        - measured_density
        - state
      output: "raw_numerator"
      source_ids: []
    - id: raw_attribution
      applies_to: "all_processes"
      rule: "Reconcile exclusive and virtually subdivided quantities, then each exchange-specific determining physical driver, then any true common-process remainder at actual-state contemporaneous market value. Assigned amounts across all actual functions equal the raw parent total. Add the explicitly transferred inherited exchange vector once; no second supplier burden."
      inputs:
        - raw_parent
        - dedicated_records
        - causal_driver
        - residual_values
        - inherited_vector
      output: "attributable_raw_total"
      source_ids:
        - ilcd-allocation-2010
    - id: first_release
      applies_to: "whole_vessel"
      rule: "Identify the unique first qualified reception event and its measured net vessel mass. Keep original Qc for storage/handling/redelivery; service H has no production denominator. Closing FG already contains first-released held output. With no qualified event retain raw burdens/stocks but no unit result."
      inputs:
        - unique_release_event
        - accepted_net_mass
        - original_cohort
        - fg_stocks
      output: "first_qualified_output"
      source_ids:
        - imo-srp-2011
    - id: component_closure
      applies_to: "drum_p; drum_next; drum_er; drum_s; drum_eo; drum_w"
      rule: "For each exact component/physical gate use mutually exclusive real P, N_ext and prior-dispatch ER. Reconcile opening+P+N_ext+ER=closing+grossS+EO+W; sum empty/attached WIP/FG/reusable stocks consistently and cancel internal issues/reuse. Keep measured event interfaces, ownership, original cohort, inherited vector, supplier containment and incremental rental/return service independently; never fill a missing real receipt with a symbol."
      inputs:
        - opening_component
        - P
        - N_ext
        - ER
        - closing_component
        - grossS
        - EO
        - W
        - event_history
      output: "component_reconciliation"
      source_ids: []
    - id: physical_closure
      applies_to: "all_processes"
      rule: "Close physical mass independently of burden attribution: opening vessel/WIP/FG and tank stocks plus real incoming matter equal closing stocks plus whole outward vessel, separately removed streams and measured releases within declared uncertainty. Gross whole-vessel movement and its source partitions are nonadditive views; the partition sum equals the whole and one provider boundary supplies each exchange. Keep each relevant elemental balance (especially carbon, sulfur, refrigerant and water) independent of total mass. Measure free water, actual combustion/evaporation water and retained system liquids separately. COD, TOC and VOC metrics are not masses of an invented chemical. Dry-air/stack and carrier-gas ledgers reconcile measured gas exchange without inventing oxygen or nitrogen from a residual; one residual cannot fit two unknowns."
      inputs:
        - opening_physical_stocks
        - actual_receipts
        - closing_physical_stocks
        - gross_outward_vessel
        - removed_streams
        - actual_species
        - uncertainty
      output: "independent_mass_and_element_reconciliation"
      source_ids:
        - basel-ships-2002
  data_quality_requirements:
    - id: dq_identity
      applies_to: "whole_vessel"
      requirement: "Prove the same original steel container hull and retained configuration from withdrawal to first reception; no name/classification-only reference binding. A native Product record must fit retired whole shape, actual gate, all comments/properties and compatible unit chain."
      evidence: "Construction/configuration records; withdrawal survey; direct flow/property/unit evidence; actual reception"
    - id: dq_mass
      applies_to: "cp_mass"
      requirement: "At acceptance, M is the declared dry net mass of the remaining hull, fixed outfit, coatings and retained permanent equipment. Exclude cargo, people and effects, every separately inventoried liquid including tank oils and retained technical operating fluids, ballast, bunker fuel, free bilge water, consumable stores, detached spares and temporary containers/rigging. This is this method's explicit measurement convention, not an assertion of statutory or contractual LDT. A reported lightweight or LDT is usable only after proving its actual definition and reconciling every inclusion/exclusion to this dry configuration; disclose the bridge and measurement uncertainty. Their actual physical quantities still enter the independent gross-vessel/tank ledger and the relevant departure, retention or waste interface. Use a current vessel-specific survey and a complete change ledger from its reference configuration, with measured additions/removals and actual tank corrections; do not use gross tonnage, deadweight or a generic ship density as net mass."
      evidence: "Current survey, calibrated draught/density instruments, hydrostatics, measured tank contents and signed change ledger; nma-lightship-2020"
    - id: dq_hazards
      applies_to: "prepare; handover"
      requirement: "Preserve each actual hazard species/material, location, retained/removed state and uncertainty. IHM is not an emission factor or proof of zero residual hazard. Different regulator/flag/site permissions require actual applicability checks without importing historical numerical thresholds."
      evidence: "Actual IHM and changes; receiver capability and applicable permits; ship-specific survey, work plan and reception; imo-srp-2011"
    - id: dq_raw
      applies_to: "all_processes"
      requirement: "Protocols collect undivided raw records. First convert actual meter differences or integrate a genuine rate over its recorded time; already integrated gas/liquid volume is never multiplied by time again. A volume-to-mass bridge requires the actual substance or mixture density at measured temperature/pressure/composition, never water density for oil or a catalogue ship weight. Resolve supplier boundaries and allocate the raw numerator by the hierarchy in Section7 before normalization. For one accepted configured vessel, q_item is that attributable raw exchange total, including failures, startup, shutdown, idle, cleanup and rework; normalize_mass divides by its actual net mass once. Cards and aggregations reference that single operation and do not divide again. With Q=0 keep all raw burdens and physical stocks but issue no unit result."
      evidence: "Original measurements, conversion records, independent raw allocation and denominator audit"
    - id: dq_components
      applies_to: "cp_components"
      requirement: "Each actual event requires an atomic receipt row or explicit interface with specific material/form/type/direction and measured quantity. The HDPE drum interfaces below retain purchase and true-return meanings and add the distinct nonpurchase interface. They are conditional examples, not an assertion that the vessel needs drums. For a real additional mooring rope, steel cylinder, seal, pallet or other component, add that actual concrete component and its relevant P/N_ext/ER and outward/waste interfaces. Missing real interfaces make that particular data package incomplete; symbols alone, a purchase UUID reused for nonpurchase identity, fabricated purchases/returns or copied batch quantities cannot fill it. Historical hull and outfit are within the original vessel, not repurchased components."
      evidence: "All actual atomic event rows with measured tare/quantity and actual owner/cohort/dispatch history; component_closure"
    - id: dq_burdens
      applies_to: "all_processes"
      requirement: "Retain every inherited vector, stock age/configuration and supplier-contained boundary. Technical examples supply qualitative route evidence only; missing factory/provider quantities remain concrete package gaps, never fabricated ranges or a historical zero-burden assumption."
      evidence: "Original provider/asset records; explicit study transfer method; raw parent reconciliation; unresolved scope disclosure"
    - id: dq_evidence
      applies_to: "all_processes"
      requirement: "The 2002 guidance and 2016 owner reportage do not establish current legal status, universal safe preparation or receiver approval. Preserve adjacent contrary cases and actual report limitations; each concrete package must verify its own present receiver and actual preparation work."
      evidence: "Complete primary source context; actual ship/receiver documents; maersk-container-recycling-2016; imo-srp-2011"
validation_rules:
  - rule_id: validate_reference
    applies_to: "whole_vessel"
    rule: "Require the original whole retired steel container hull and first qualified pre-cut reception. Verify functional-unit link, net mass, actual configuration and complete compatible Product flow/property/unit identity before a native data package is considered complete; new-vessel/Waste/CTUe/plate/scrap/service substitutions fail."
    source_ids:
      - un-cpc3-2025
      - imo-srp-2011
  - rule_id: validate_receiver
    applies_to: "handover"
    rule: "Missing ship-specific acceptance, actual residual inventory, receiver identity/capability or actually applicable permission evidence is unresolved, not an automatic pass from IHM/certification or a historic case. Preserve actual refusal and corrective work."
    source_ids:
      - imo-srp-2011
      - maersk-container-recycling-2016
  - rule_id: validate_once
    applies_to: "all_processes"
    rule: "Audit raw units and genuine rate integration, raw attribution and inherited vectors before normalize_mass. Each raw numerator is divided once only; protocol collection and aggregation remain undivided. Retain all failures, startup/stop/idle/cleanup/rework and Q=0 burdens. No new Q from redelivery, service H or closing FG."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "all_processes"
    rule: "Close physical mass independently of burden attribution: opening vessel/WIP/FG and tank stocks plus real incoming matter equal closing stocks plus whole outward vessel, separately removed streams and measured releases within declared uncertainty. Gross whole-vessel movement and its source partitions are nonadditive views; the partition sum equals the whole and one provider boundary supplies each exchange. Keep each relevant elemental balance (especially carbon, sulfur, refrigerant and water) independent of total mass. Measure free water, actual combustion/evaporation water and retained system liquids separately. COD, TOC and VOC metrics are not masses of an invented chemical. Dry-air/stack and carrier-gas ledgers reconcile measured gas exchange without inventing oxygen or nitrogen from a residual; one residual cannot fit two unknowns."
    source_ids:
      - basel-ships-2002
  - rule_id: validate_components
    applies_to: "cp_components"
    rule: "For each actual packaging type, container and attached auxiliary component, record opening empty stock, attached WIP/FG and reusable stock separately. P means genuine purchased first external physical receipts; N_ext means all nonpurchase first external physical receipts, including supplier accompanying items and first entrusted, borrowed or rented items. ER is only a true return of a prior outward dispatch proved by its event history. P, N_ext and ER are mutually exclusive. Record every first physical receipt whether or not the supplier inventory covers its embodied burden; absent supplier data remains a disclosed collection gap, never zero. At the same component and physical gate close opening+P+N_ext+ER=closing+grossS+EO+W. grossS is every actual outward shipment with its attached component, EO is a distinct external return-out and W is actual waste. Internal warehouse/WIP/FG issues, internal reuse and transfers cancel; opening stock cannot replace current receipts. Ownership, original cohort, each inherited exchange vector, supplier-included scope and genuine incremental rental/return services are independent ledgers. A component receives its embodied burden once; custody and reuse do not imply zero burden, new Q or credit."
    source_ids: []
  - rule_id: validate_interfaces
    applies_to: "all_processes"
    rule: "Each actual event requires an atomic receipt row or explicit interface with specific material/form/type/direction and measured quantity. The HDPE drum interfaces below retain purchase and true-return meanings and add the distinct nonpurchase interface. They are conditional examples, not an assertion that the vessel needs drums. For a real additional mooring rope, steel cylinder, seal, pallet or other component, add that actual concrete component and its relevant P/N_ext/ER and outward/waste interfaces. Missing real interfaces make that particular data package incomplete; symbols alone, a purchase UUID reused for nonpurchase identity, fabricated purchases/returns or copied batch quantities cannot fill it. Historical hull and outfit are within the original vessel, not repurchased components."
    source_ids: []
  - rule_id: validate_supplier
    applies_to: "support; handover"
    rule: "Verify each actual provider boundary and exact whole formulation; remove only proven duplicate contained scope. Keep nonpurchase first physical receipts, original ownership/cohort/burden and incremental rental/return services separate. No orphan service total or missing real material can be covered by a generic family binding."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_allocation
    applies_to: "all_processes"
    rule: "Require exclusive/virtual subdivision then exchange-specific determining physical causality before any true residual common-process market-value allocation. Reconcile all actual functions to each parent; no fixed shares, automatic historical cutoff or avoided-production credit. Missing history or allocation evidence stays explicit and limits the result."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_stocks
    applies_to: "all_processes"
    rule: "Reconcile opening/closing WIP and FG by original hull/cohort and per-exchange inherited vector. Internal stage and warehouse issues cancel. A genuine external return requires its prior outward record; first borrowed/entrusted/rented physical entry is never a return. Keep gross physical vessel movement separate from net Q and attributed burden A."
    source_ids: []
  - rule_id: validate_species
    applies_to: "support; prepare"
    rule: "Do not invent gas species from NOx/VOC/COD/TOC indicators, assume full fuel-to-CO2/SO2 conversion, infer a leak from missing recovery, or force two unknowns from one mass residual. Compare measured stream totals and nonadditive assays, actual heat/water states, retained fluids and all actual external destinations. Unmeasured is not zero."
    source_ids:
      - basel-ships-2002
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset after completed compatible package and review"
  downstream_use: "Input to explicitly bounded ship-recycling receiving and dismantling models for this original whole retired steel container vessel"
  allowed_use: "Disclosed incremental preparation/supply module; expansion only with compatible historical transfer and actual utility/tow/treatment providers"
  excluded_use: "New ship manufacture; freight tonne-km; loose scrap or recovered steel production; complete cradle-to-grave claims from foreground-only additions; current legal/permit or safety certification; automatic recycling credit"
  required_metadata: "All Section3 qualifiers; actual source versions and inherited vectors; each provider boundary; Qc and gross physical records; original units and actual mass corrections; all specific unresolved rows"
  required_quality_disclosure: "Ship/configuration, time and geography; receiver applicability; original history limits; measured/estimated/missing quantities; species/compartment and provider gaps; allocation and stock uncertainty; a measurement check does not approve methodology or identity"
  update_trigger: "Changed vessel state or gate, retained equipment/tanks/hazards, receiver permission/capability, actual preparation or fuel/transport route, provider scope, transfer/allocation method or native identity restrictions"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025, pp.203-205; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf; accessed 2026-11-21"
    used_for: "Whole vessels for breaking up distinguished from separated metal scrap; classification only, no preparation recipe."
  - id: "imo-srp-2011"
    type: "official_guidance"
    reference: "IMO Resolution MEPC.196(62), adopted 15 July 2011, Annex §§3-5 and Appendix, PDF pp.4-8; https://wwwcdn.imo.org/localresources/en/KnowledgeCentre/IndexofIMOResolutions/MEPCDocuments/MEPC.196%2862%29.pdf; accessed 2026-11-21"
    used_for: "Ship-specific information, IHM changes, receiver capabilities, preparatory-work scope, arrival inspection and conditional authorization evidence; guidance edition is not a current legal determination."
  - id: "basel-ships-2002"
    type: "official_guidance"
    reference: "Basel Convention, Technical guidelines for the environmentally sound management of the full and partial dismantling of ships, COP.6 December 2002, Figure1, §4.1 Table6, §§4.2.2-4.2.3; https://www.basel.int/Portals/4/download.aspx?d=UNEP-CHW-WAST-GUID-ShipDismantling.English.pdf; accessed 2026-11-21"
    used_for: "Retirement/preparation distinct from cutting and sorting; actual liquid removal, containment, bilge/ballast and residual hazards. Historical legal and numerical statements are not adopted as present requirements or defaults."
  - id: "maersk-container-recycling-2016"
    type: "literature"
    reference: "A.P. Moller-Maersk, Maersk Post November2016, pp.32-37, reportage on Maersk Wyoming and Maersk Georgia at Shree Ram plot78; https://www.maersk.com.cn/~/media_sc9/maersk/corporate/press/publications/files/2016-november-maersk-post-full-issue.pdf; accessed 2026-11-21"
    used_for: "Owner primary historical container-vessel supply/recycling case and adjacent contrary sale/charter cases; no inference of current receiver permission, complete hazard removal, actual ship mass or universal energy factor."
  - id: "nma-lightship-2020"
    type: "official_guidance"
    reference: "Norwegian Maritime Authority KS-0179-1E, Rev.07.01.2020, §§1-3.4, pp.3-7; https://www.sdir.no/siteassets/skjema/ks-0179-1-procedure-for-inclining-test-and-determination-of-lightship-displace-eng.pdf; accessed 2026-11-21"
    used_for: "Traceable survey, configuration, actual tank contents/density, draught/hydrostatics and correction discipline used as technical mass-measurement guidance; Norwegian approval rules are not applied to other flags."
  - id: "ilcd-allocation-2010"
    type: "handbook"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, §§7.9.2–7.9.3, printed pp.255-264; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf; accessed 2026-11-21"
    used_for: "Attributional exclusive/virtual subdivision, exchange-specific determining physical causality, then remaining common-process allocation at actual-state contemporaneous market value. This section does not establish a recycling cutoff or historical ship-burden fraction."
  - id: "un-cpc3-2026"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, explanatory workbook dated 23 October 2026, CPC3!A1931:D1931; https://unstats.un.org/unsd/econstats/classifications/cpc; accessed 2026-11-21"
    used_for: "39370 is defined through HS 2022 heading 8908; classification context only, no change to the frozen June 2025 coordinate."
  - id: "imo-hkc-current"
    type: "official_guidance"
    reference: "IMO, Recycling of ships and the Hong Kong Convention; https://www.imo.org/en/mediacentre/hottopics/pages/recycling-of-ships-and-hong-kong-convention.aspx; accessed 2026-11-21"
    used_for: "Entry into force and ship/facility-specific documentary interfaces; no retrospective approval or measured inventory."
  - id: "bimco-recyclecon-2026"
    type: "official_guidance"
    reference: "BIMCO, We have updated RECYCLECON, 21 October 2026; https://www.bimco.org/news-insights/bimco-news/2026/10/21-recyclecon-2026/; accessed 2026-11-21"
    used_for: "Delivery condition/location and model-contract timing only; does not establish any actual owner contract or light-displacement quantity."
