product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.vessels-and-other-floating-structures-for-breaking-up"
  classification_refs: "CPC:3.0:39370, accepted narrower association under docs/adr/2026-11-21-accept-cpc-39370-intact-retired-steel-container-vessel.md"
  covered_products: "This method covers one identified retired steel-hulled commercial container vessel from evidenced withdrawal from commercial service, condition and hazardous-material inventory, actual necessary preparation and securing, through its first qualified whole-vessel acceptance at a named ship-recycling facility before structural cutting. Keep the IMO/hull identity and one actual configuration throughout. The supplied object remains a whole vessel intended for breaking up. It is not loose steel scrap, a recovered component, a new ship or a transport-service reference. The relation to CPC3.0 39370 is narrower."
  excluded_products: "Exclude tankers and their special cargo-tank conditions, passenger/ro-ro/general-cargo/fishing/naval ships, offshore platforms and other floating structures, sunk wreck salvage, cutting into blocks before the reference gate, downstream demolition, sorting, steel remelting/refining and sale of recovered equipment. An actual different principal vessel type or cutting route needs its own applicability evidence. Removing measured loose stores or necessary liquids does not authorize hidden hull cutting. Commercial freight service before withdrawal and downstream recycling are separate stages with explicit interfaces."
  representative_product: "One original retired steel commercial container vessel at its declared first whole-ship recycling reception before cutting"
  production_route: "Service withdrawal and original-state inventory; actual ship-specific preparation/securing; necessary liquid/loose-store removal; actual final movement/tow and qualified reception"
  market_state: "Whole retired hull and remaining fixed outfit for breaking up; retained hazards and technical fluids declared; mobile contents separately inventoried"
functional_unit:
  what: "Supply the identified retired steel container vessel whole to a qualified recycling reception gate"
  how_much: "1 kg accepted net whole-vessel mass, derived from measured M kg of the same one accepted complete unit"
  how_well: "Actual vessel-specific acceptance of configuration, residual hazards and receiver capability/restrictions before cutting; no universal steel grade or performance promise"
  how_long_or_cycle: "One evidenced retirement/preparation/whole-vessel supply cycle; no new service life or commercial transport function"
  reference_flow_link: "whole_vessel"
system_boundary:
  rules:
    - rule_id: boundary_whole
      applies_to: "whole_vessel"
      rule: "Keep the selected retired steel container vessel whole until first qualified recycling-yard receipt. Downstream cutting, sorting, scrap conditioning and recovery products are outside this output. Actual pre-delivery preparation locations and scope follow the ship-specific agreement and receiver capability; no universally complete pre-cleaning is assumed."
      source_ids:
        - un-cpc3-2025
        - imo-srp-2011
        - basel-ships-2002
    - rule_id: boundary_historical
      applies_to: "withdrawal"
      rule: "Record original construction, maintenance and commercial-service history, actual withdrawal and custody/ownership interfaces, and an exchange-specific inherited burden vector under the declared consistent study method. Physical possession or positive/negative sale price establishes no historical burden fraction. Do not automatically transfer all construction/service burdens here or set them to zero. If history is unavailable, disclose the specific unresolved vector and restrict results to evidenced foreground additions."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_receiver
      applies_to: "handover"
      rule: "Verify the actual named receiver against the specific ship and residual hazards, its current applicable permissions, capacity and restrictions, the agreed ship recycling plan and arrival walk-through. IHM identifies type/quantity/location and updates, not a claim that all substances are absent. Apply only actually applicable legal/permit conditions; the tanker-specific safe-entry/hot-work arrival example is not imposed on this container vessel. The 2016 owner case and certificates do not establish current authorization."
      source_ids:
        - imo-srp-2011
        - maersk-container-recycling-2016
    - rule_id: boundary_real_operations
      applies_to: "all_processes"
      rule: "Include all actual decommissioning inspections, sampling, ventilation/securing, pumping, necessary cleaning/removal, waiting, care, spill response, transfer/voyage/tow, rejected acceptance and corrective work through the selected gate. No bulk removal, cutting, repainting, boiler or steam system is invented. Every additional real input/output requires its own specific card or explicit measured interface before completeness is claimed."
      source_ids:
        - imo-srp-2011
        - basel-ships-2002
    - rule_id: boundary_receipts
      applies_to: "drum_p; drum_next; drum_er"
      rule: "For each actual packaging type, container and attached auxiliary component, record opening empty stock, attached WIP/FG and reusable stock separately. P means genuine purchased first external physical receipts; N_ext means all nonpurchase first external physical receipts, including supplier accompanying items and first entrusted, borrowed or rented items. ER is only a true return of a prior outward dispatch proved by its event history. P, N_ext and ER are mutually exclusive. Record every first physical receipt whether or not the supplier inventory covers its embodied burden; absent supplier data remains a disclosed collection gap, never zero. At the same component and physical gate close opening+P+N_ext+ER=closing+grossS+EO+W. grossS is every actual outward shipment with its attached component, EO is a distinct external return-out and W is actual waste. Internal warehouse/WIP/FG issues, internal reuse and transfers cancel; opening stock cannot replace current receipts. Ownership, original cohort, each inherited exchange vector, supplier-included scope and genuine incremental rental/return services are independent ledgers. A component receives its embodied burden once; custody and reuse do not imply zero burden, new Q or credit."
      source_ids: []
    - rule_id: boundary_interfaces
      applies_to: "all_processes"
      rule: "Each actual event requires an atomic receipt row or explicit interface with specific material/form/type/direction and measured quantity. The HDPE drum interfaces below retain purchase and true-return meanings and add the distinct nonpurchase interface. They are conditional examples, not an assertion that the vessel needs drums. For a real additional mooring rope, steel cylinder, seal, pallet or other component, add that actual concrete component and its relevant P/N_ext/ER and outward/waste interfaces. Missing real interfaces make that particular data package incomplete; symbols alone, a purchase UUID reused for nonpurchase identity, fabricated purchases/returns or copied batch quantities cannot fill it. Historical hull and outfit are within the original vessel, not repurchased components."
      source_ids: []
    - rule_id: boundary_provider
      applies_to: "support; handover"
      rule: "Keep one actual provider for a supplied whole formulation or service; component assay is a nonadditive subledger. A tug/contract-preparation provider module replaces only its documented contained fuel, electricity, water, chemicals and emissions, while actual owner-supplied matter remains visible. Independently measure genuine incremental rental/return services. No duplicate provider module and foreground utility purchase for the same work. Original hull/outfit/tank contents and their separately displayed internal draws are nonadditive source partitions; cancel matching phase transfers in combined mass and inherited-vector accounts. They are never bought again as new steel, components or fuel."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_stocks
      applies_to: "all_processes"
      rule: "Track original cohort and exchange vectors in opening/closing WIP and FG, rejected ships, residues, fluids and genuine external returns. Internal stage transfers cancel in a combined system. First release Q is distinct from gross physical movement and from service H; preserve all Q=0 work and do not make a redelivery into a newly prepared ship."
      source_ids: []
    - rule_id: boundary_physical
      applies_to: "all_processes"
      rule: "Close physical mass independently of burden attribution: opening vessel/WIP/FG and tank stocks plus real incoming matter equal closing stocks plus whole outward vessel, separately removed streams and measured releases within declared uncertainty. Gross whole-vessel movement and its source partitions are nonadditive views; the partition sum equals the whole and one provider boundary supplies each exchange. Keep each relevant elemental balance (especially carbon, sulfur, refrigerant and water) independent of total mass. Measure free water, actual combustion/evaporation water and retained system liquids separately. COD, TOC and VOC metrics are not masses of an invented chemical. Dry-air/stack and carrier-gas ledgers reconcile measured gas exchange without inventing oxygen or nitrogen from a residual; one residual cannot fit two unknowns."
      source_ids:
        - basel-ships-2002
boundary_abstraction:
  declared_starting_condition: "The identified original steel container vessel at actual withdrawal, with actual hull/outfit/tank condition and an explicit inherited construction/service/maintenance vector. Preparation is performed rather than merely buying a finished prepared ship."
  starting_condition_role: "foreground_retirement_and_supply_module"
  product_classification_scope: "This method covers one identified retired steel-hulled commercial container vessel from evidenced withdrawal from commercial service, condition and hazardous-material inventory, actual necessary preparation and securing, through its first qualified whole-vessel acceptance at a named ship-recycling facility before structural cutting. Keep the IMO/hull identity and one actual configuration throughout. The supplied object remains a whole vessel intended for breaking up. It is not loose steel scrap, a recovered component, a new ship or a transport-service reference. The relation to CPC3.0 39370 is narrower."
  recursive_input_rule: "Same-category prepared vessel cannot recursively represent the original hull and its preparation a second time. Keep one source-state vessel interface; internal phase transfers cancel and only actual incremental work remains."
  upstream_dataset_requirement: "Compatible original vessel history and explicit transfer method plus actual utilities/materials/tow/treatment providers, geography, period, versions and contained boundaries; without them report only evidenced module scope."
  disclosure: "IMO number and hull identity; steel hull construction and retained equipment configuration; service-withdrawal decision and time; owner and custody chain without presumed purchase; original construction and service burden boundary and exchange-specific inherited vector; actual starting vessel and tank inventory with provenance; IHM version parts and changes plus residual locations and uncertainties; actual work orders sites preparation/removal and supplier-included scope; first qualified receiver gate and release event; receiver identity capability restrictions and actual applicable approvals; accepted dry net vessel mass, declared liquid exclusions and current survey corrections; gross delivered onboard liquids ballast and consumables distinct from net mass; actual voyage/tow provider boundaries endpoints and times; component-specific first physical receipts and real dispatch-return history; period opening/closing WIP and FG with original cohorts and burdens; each waste stream and elementary species actual fate medium and measurement"
