review_metadata:
  classification_decision: Accepted narrower association under docs/adr/2026-11-21-accept-cpc-39215-garnetted-single-jersey-cotton-cuttings.md.
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  true_holds:
  - No confirmed native Product flow for mechanically garnetted 100% cotton fibre.
    Reference and released-fibre row UUIDs remain unresolved. Dataset qualification requires
    compatibility evidence.
  ordinary_gaps:
  - Future lot records must verify 100% cotton single-jersey cuttings, dye/finish
    chemistry and prior processing, receiver acceptance and legal/product status;
    no plant quantities are invented.
  - Atomic input-cutting, polypropylene-strap, captured cotton dust, short-fibre,
    steel accessory, rejected cutting, mineral-oil and packaging-waste identities
    remain unresolved. Conditional physical flows require supplier/receiver records
    before UUID binding.
  - Actual electricity provider flow and native reference property, supplied tap-water
    identity and particulate emission identity remain unverified; technical Energy
    and Mass collection interfaces do not settle native supplier property.
  - Each actual packaging material needs separate purchases, first non-purchase external
    receipts, proven same-item external returns, stock and outbound/waste records;
    actual inherited, transport and service burdens and provider coverage remain to
    be collected.
  boundary_decision: Separate mechanical fabric-to-garnetted-fibre supply. Excludes
    non-garnetted comber noil, linters, wool/hair/silk, yarn/fabric manufacture and
    chemical dissolution. Complete supplied input burden is represented once; no assumed
    cut-off or credit.
  source_limitations:
  - Heliyon2022 identifies navy-blue 100% cotton knit cut clips and separately illustrated
    recovered fibres, but also studies mixed pre-consumer and post-consumer sources
    and later virgin-cotton blending. Qualitative technology synthesis only; neither
    mixed-case quality nor water/throughput values are category factors.
  - Manufacturer equipment options do not establish plant-wide material use or LCA
    allocation.
  - ILCD attributional allocation context is reused and independently applied only
    to allocation-requiring attributional studies; source fragment product/route/state
    mismatches and blocked numeric reuse do not establish an automatic cotton-specific
    method.
  - PrecisionTex establishes a commercial postindustrial colour-sorted cotton-to-loose-fibre
    route only; neither lot-level navy single-jersey applicability nor claimed environmental
    savings are adopted.
  - UNSD full explanatory notes PDF pp200–201 provides titles without further 39215
    inclusion/exclusion text. The independent review accepted the narrower relation for the specified
    mechanically opened cotton fibre.
  - UUID identity/support checks use historical public ILCD originals, not contemporary
    platform observations. PE film archive classification is Materials production
    / Plastics; historical claims of a CPC29220 anomaly are not adopted. Water vapour
    has no archived Chinese basename; retain its canonical English display with an
    explanatory translation. Core modules are scaffold context only, not substantive
    reviewed methods.
  - Heliyon §2.2 reports unsuccessful HVI characterization of dyed recovered fibres
    with hard lumps; actual lot quality tests need a compatible declared method, not
    a presumed virgin-grey-cotton HVI result.
