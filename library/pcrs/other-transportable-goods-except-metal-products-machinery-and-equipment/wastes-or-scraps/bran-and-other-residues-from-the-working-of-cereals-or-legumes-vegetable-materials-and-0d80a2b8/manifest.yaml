  source_applicability: UNSD complete notes PDF pages 102-104 and 199-200 confirm narrower classification scope. Modern Mills original prospectus sections 4.9.2.4 and 4.9.3.2.1 supports joint milling, bran finishing and bulk/bag terminal; independent Engelke mill page confirms loose feed bran; Cefetra Rev4 Aug2025 confirms dry-milling feed material and meal/pellet distinction but all example composition values are noncontractual and not reused. NZFMA and UK Flour Millers support qualitative separation only. KAHL supports excluded pelleting route. ILCD supports conditional attributional allocation only, not a site ratio.
  source_review:
    history: ae3d06f8077ce6830bc1e64eea8f7bce6d697f53; extracted only this PCR four-file candidate; refreshed evidence and corrected unsupported native claims.
    neighbour_methods: Existing wheat-other 01112 and wheat-and-meslin-flour 23110 describe grain and food flour respectively, not this feed-bran terminal; their default values and product UUIDs are not reused.
    modules: Core references are scaffold contracts only; candidate PEF module has no scientific approval and is not adopted as a binding feed method. Allocation evidence comes directly from ILCD.
    quantitative_limits: No transferable source range confirmed; yield, moisture, energy, density, prices, packaging composition and mass remain collected site quantities, not defaults.
