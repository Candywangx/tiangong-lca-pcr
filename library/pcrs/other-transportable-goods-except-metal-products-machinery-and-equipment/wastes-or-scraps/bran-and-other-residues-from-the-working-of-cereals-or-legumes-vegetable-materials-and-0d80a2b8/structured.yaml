allocation_rules:
  - rule_id: a_scope
    applies_to: "attributional studies requiring allocation"
    rule: "Use this hierarchy only when attributional modelling actually requires allocation. Independently assign dedicated bran collection/finishing/packing operations and physically or virtually subdivide the joint mill and residual finisher wherever evidence permits. Upstream supplier allocation is inspected and carried once, not silently repeated or accepted without its gate and assumptions."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_causality
    applies_to: "each remaining exchange"
    rule: "For each non-functional exchange separately determine whether a physical causal relationship actually determines its quantity for a co-function. Document physical embodiment, equipment function, measured material/state relation and evidence; use distinct causal drivers when reality differs. Bran or flour mass, dry matter, protein, calories or sales value are not freely interchangeable choices and no universal physical ratio is prescribed."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_residual
    applies_to: "genuinely unresolved common process flows"
    rule: "Only the actual remainder after subdivision and determining physical causality may use contemporaneous market values of the real coproducts in their actual condition at the common process gate. Match period, geography, currency and gate; remove downstream services from price comparisons. Explain missing or distorted prices and sensitivity. Do not substitute a fixed price, cheap-bran zero burden, generic mass split or automatic physical/economic selector."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_conservation
    applies_to: "all coproduct and stock ledgers"
    rule: "Reconcile the complete burden vector across all real coproducts, retained WIP/FG and actual loss/service destinations. Economic assignment changes attributed A, never gross V, Q, waste, water or elemental closure. Internal transfers preserve inherited vectors. Failed/Q0 work and real rework inputs remain; no substitution credit, waste-label exemption or animal-nutrition functional equivalence is supplied by this method."
    source_ids:
      - ilcd-2010-allocation
      - modern-mills-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "bran_finishing"
      flow_role: "released_bran"
      record_type: "lot weighing and feed release"
      raw_fields: "wheat species; raw lot; finished lot; first-release timestamp; net wet mass; tare; moisture fraction; independent dry matter; particle-size distribution; foreign matter; feed status; closing accepted FG"
      collection_method: "Weigh net released bran on calibrated equipment and retain representative sampling, moisture method and independent dry-matter/quality observations. Aggregate unique first releases only. Aggregation semantics: retain raw undivided lot masses; section 8 alone normalizes."
      unit: "kg"
      frequency: "each lot and first release"
      temporal_coverage: "entire declared cohort including held and failed batches"
      site_scope: "one declared finishing site and wheat supply state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; tare; samples; release signature; quality results"
    - protocol_id: cp_upstream
      process_id: "bran_finishing"
      flow_role: "raw_bran_fraction"
      record_type: "supplier handoff and stock register"
      raw_fields: "upstream cohort; grain species; received wheat; cleaning and tempering steps; water; joint mill outputs; original Qc; intermediate wet mass; composition bridge; allocation rationale; inherited exchange vector; opening and closing raw/WIP"
      collection_method: "Independently weigh the actual sifter-to-finisher stream. Obtain supplier joint physical balance, linked wheat supply and transport, original denominator and complete allocation records. Separate physical stock mass from inherited environmental vectors; carry the upstream vector once. Aggregation semantics: retain raw observations and supplier vectors undivided."
      unit: "kg"
      frequency: "each handoff and stock close"
      temporal_coverage: "whole upstream cohort and foreground cohort with history"
      site_scope: "upstream whole mill and precise finishing handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; flow diagram; supplier inventory; stock and allocation reconciliation"
    - protocol_id: cp_utilities
      process_id: "bran_finishing"
      flow_role: "individual utility"
      record_type: "meter and supply record"
      raw_fields: "meter id; provider; voltage; gas composition; pressure; temperature; density evidence; integrated quantity or actual rate; idle and cleanup time; thermal mass and enthalpy; real returns"
      collection_method: "Use calibrated differences for actual electricity/water/air or added utility. Keep original kWh or raw mass/volume before conversion; integrate only a true rate once. Independently measure the same-substance same-state density if needed. Heat extensions retain one MJ account and non-additive carrier bridge. Aggregation semantics: raw sums and real allocation drivers are undivided; section 8 normalizes once."
      unit: "kWh; kg; MJ"
      frequency: "each meter interval and real event"
      temporal_coverage: "all real work including failed Q0 idle and cleanup"
      site_scope: "exact metered supply and receiving gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; state and supply convention"
    - protocol_id: cp_maintenance
      process_id: "bran_finishing"
      flow_role: "individual material replacement"
      record_type: "material receipt and repair record"
      raw_fields: "article or whole formulation; supplier; grade; mass; part boundary; retained stock; real replacement event; failed repair; removed destination; inherited vector"
      collection_method: "Weigh each separately supplied material or article, preserve whole-formulation/component inclusions and actual repair chronology. Do not infer alloy quantities or purchase embedded constituents again. Aggregation semantics: retain real raw purchases and stocks undivided."
      unit: "kg"
      frequency: "each receipt repair and inventory close"
      temporal_coverage: "whole cohort and actual failed work"
      site_scope: "actual finishing equipment and supplier gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier composition; weighing; work orders; waste receipt"
    - protocol_id: cp_products
      process_id: "bran_finishing"
      flow_role: "recovered_flour"
      record_type: "coproduct weighing and quality"
      raw_fields: "actual flour lot; net wet mass; moisture; recipient; quality; original common gate; allocation driver; first release; opening and closing stock"
      collection_method: "Independently weigh the actual recovered flour Product and verify usability and destination. Keep its raw gross physical quantity and full share of inherited/new burdens; no fixed powder split or deduction from bran physical waste. Aggregation semantics: retain undivided coproduct quantities and vectors."
      unit: "kg"
      frequency: "each actual recovery lot"
      temporal_coverage: "same common process period and stock history"
      site_scope: "actual finisher recovery gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; quality; recipient and reconciliation"
    - protocol_id: cp_waste
      process_id: "bran_finishing"
      flow_role: "each actual waste stream"
      record_type: "waste transfer record"
      raw_fields: "origin-W; whole stream; wet mass; contamination; component partitions; phase; recipient; treatment boundary; opening and closing custody; original cohort"
      collection_method: "Weigh every actual waste output independently and retain one real recipient/provider per event. Distinguish discarded captured dust from Product recovery and air release. Whole waste or measured origin-W partitions are non-additive alternatives; do not infer molecular mass from pollution indicators. Aggregation semantics: preserve raw gross waste V undivided."
      unit: "kg"
      frequency: "each real waste event"
      temporal_coverage: "all failure cleanup repair and stock history"
      site_scope: "actual waste and treatment handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; analysis; recipient receipt"
    - protocol_id: cp_species
      process_id: "bran_finishing"
      flow_role: "individual actual environmental exchange"
      record_type: "independent measurement and balance"
      raw_fields: "species or defined particulate mixture; source; CAS where meaningful; phase; receiving medium; mass; concentration; volume or true rate; state; independent moisture data; gross uptake and release"
      collection_method: "Use actual source-specific sampling with sufficiently independent observations to reconcile mass and species. Retain whole-dust/size-fraction and whole-effluent/species bridges without addition; distinguish free/phase/structural/reaction water only with evidence. Aggregation semantics: retain undivided gross V and original units; no Q division in collection."
      unit: "kg"
      frequency: "each actual discharge or uptake interval"
      temporal_coverage: "complete actual finishing cohort"
      site_scope: "actual source and receiving environmental compartment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling; calibration; independent states and assays"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "original-cohort custody and real service"
      record_type: "lot custody service and reversal record"
      raw_fields: "original lot Qc; opening and closing FG; original burden vector; internal Q; gross dispatch; external returns; original delivery reversal; actual new water energy and material F; waste; species; H"
      collection_method: "Trace each real service and physical transfer to original lot Qc including historical opening FG. Weigh actual returns, samples, losses and new inputs; preserve original burden and reversal without manufacturing new product. Actual service effluent/species require independent measurements. Aggregation semantics: retain raw gross events and inherited vectors; section 8 uses original Qc once; H is observation only."
      unit: "kg; kWh"
      frequency: "each transfer service and stock close"
      temporal_coverage: "declared H and all relevant original cohort history"
      site_scope: "actual bins storage bagging and loadout gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "lot ledger; original release; reverse transactions; service meters"
    - protocol_id: cp_packaging
      process_id: "packaging_pool"
      flow_role: "each actual packaging article"
      record_type: "article custody and stock record"
      raw_fields: "article id; supplier composition; verified unit mass; opening empty stock; opening attached WIP/FG; reusable stock; new purchases; external returns received; closing stocks; gross-shipment outflow; external returns sent; waste; internal reuse"
      collection_method: "Weigh each actual package/closure separately or use a verified same-article count/length bridge. Keep attached and reusable states and each recipient distinct. Internal reuse cancels; no package mass contributes to bran Q. Aggregation semantics: collect the complete raw undivided physical article ledger; section 8 normalizes once."
      unit: "kg"
      frequency: "each receipt shipment return and stock close"
      temporal_coverage: "cohort production and all service H"
      site_scope: "actual packaging custody"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specification; weighing; stock ledger; gross shipment receipt"
  calculation_rules:
    - id: release_total
      applies_to: "released_bran"
      rule: "Q = sum(q_lot) for unique first feed-grade releases measured net as-released wet mass. Include accepted closing FG once. Dispatch, reinspection, historical opening FG, returns and redelivery add no new Q. Rejected unreleased material is not Q."
      inputs:
        - q_lot
        - "unique release registry"
        - cp_release
      output: "Q"
      source_ids:
        - modern-mills-2023
    - id: moisture_bridge
      applies_to: "released_bran; raw_bran_fraction; recovered_flour"
      rule: "For an independently measured wet-basis water mass fraction w, dry mass = wet mass times (1-w). Keep independent dry-matter results and sampling uncertainty as a reconciliation check. Whole moist flow is primary; water/nutrient assays are non-additive. No fixed moisture, density or composition is supplied."
      inputs:
        - "wet mass"
        - "independent w"
        - "independent dry matter"
        - cp_release
        - cp_upstream
      output: "non-additive dry matter bridge"
      source_ids:
        - modern-mills-2023
        - nzfma-milling
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert actual raw observations to each row unit before allocation: electricity kWh to MJ by 3.6; direct weighed mass or matching substance/state density times measured volume. Integrate only an actual rate once; do not multiply an integrated volume by time. A complete purchased formulation enters once and assays remain subledgers."
      inputs:
        - "raw observations"
        - "conversion evidence"
        - cp_utilities
        - cp_species
      output: "native raw V_i"
      source_ids:
        - modern-mills-2023
    - id: upstream_handoff
      applies_to: "raw_bran_fraction"
      rule: "Retain supplier raw whole-mill physical events and original upstream denominator Qc. Link the bran-bound inherited exchange vector once after the evidenced allocation hierarchy. Do not repeat wheat cultivation, grain conditioning water or mill power inside finishing, and do not discard any real upstream loss or coproduct burden. Supplier normalized burdens are converted back to the actual received lot vector before foreground accounting."
      inputs:
        - "supplier whole-mill balance"
        - "original Qc"
        - "received lot mass"
        - "supplier burden vector"
        - cp_upstream
      output: "received inherited vector and upstream gross audit"
      source_ids:
        - ilcd-2010-allocation
        - modern-mills-2023
    - id: physical_manufacture
      applies_to: "bran_finishing"
      rule: "Opening raw and WIP mass + actual external F + actual incoming physical transfers + real environmental uptake = closing raw and WIP mass + first-released Q + actual recovered flour + other actual external returns/Product transfers + gross waste + actual elementary releases. Exclude energy units from mass. Retain all whole moist flows and separate relevant dry-matter/element/species balances; internal recycle cancels."
      inputs:
        - "opening and closing raw/WIP"
        - F
        - transfers
        - Q
        - "recovered flour"
        - "gross waste and species"
      output: "unallocated manufacturing physical closure"
      source_ids:
        - modern-mills-2023
        - nzfma-milling
    - id: inherited_vectors
      applies_to: "all inventory rows"
      rule: "For each exchange retain opening WIP inherited vector plus actual new converted and attributed events minus closing WIP inherited vector, and reconcile all coproduct and actual destination vectors. Apply subdivision then exchange-specific determining physical causality and only genuine residual common-gate market values. Physical stocks and gross V remain separate. Failed/idle/cleanup/rework and Q0 loads persist; Q0 yields no unit result."
      inputs:
        - "opening inherited vectors"
        - "actual new events"
        - "closing inherited vectors"
        - "allocation evidence"
      output: "attributable A_i and retained history"
      source_ids:
        - ilcd-2010-allocation
    - id: physical_fg
      applies_to: "fg_service"
      rule: "Opening FG + internal Q + actual gross external returned bran + new repair/rework material or water F + real uptake = closing FG + gross physical dispatch + actual separate external returns sent + service waste + service elementary release. Preserve original delivery reversal and per-lot inherited vectors. Retesting does not create mass or first release."
      inputs:
        - "FG stocks"
        - "internal Q"
        - "gross transfers"
        - "new F"
        - "service waste and species"
        - cp_fg
      output: "unallocated FG physical closure"
      source_ids:
        - modern-mills-2023
    - id: combined_gate
      applies_to: "bran_finishing; fg_service"
      rule: "Add manufacturing and FG physical gates then cancel the identical internal Q and any other matched internal transfer. Accepted closing FG remains on the stock side. Preserve gross waste, water, replacements and species regardless of economic assignment, historical burden ownership or net sales."
      inputs:
        - "manufacturing closure"
        - "FG closure"
        - "matched internal transfers"
      output: "combined physical closure"
      source_ids:
        - modern-mills-2023
    - id: duplicate_guard
      applies_to: "all inventory rows"
      rule: "F is an actual new external event. X removes only a proved duplicate representation of that identical event on the same side of the same account. Genuine new repair, cleaning water, energy and replacements are F rather than X. Whole wet material/formulation and constituent assays use one principal account and a non-additive bridge."
      inputs:
        - "event ids"
        - "receipt evidence"
        - "same-side duplicate proof"
      output: "deduplicated raw events"
      source_ids:
        - ilcd-2010-allocation
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For a positive actual cohort denominator, the only normalization is n_i = A_i / Q for the attributed inventory and g_i = V_i / Q for the separate non-additive gross physical view. Original-cohort services use their original Qc in this same operation; original supplier gross audits retain original supplier Qc. Convert units and form genuine allocation/inherited A_i first. Cards and protocol aggregation reuse this result without another division. H is not a divisor; Q0 retains events and yields no unit result."
      inputs:
        - A_i
        - V_i
        - Q
        - "original Qc"
      output: "n_i; g_i"
      source_ids:
        - ilcd-2010-allocation
    - id: package_balance
      applies_to: "packaging_pool"
      rule: "For each article separately: opening empty + opening attached WIP/FG + opening reusable + new purchases + external returns received = all closing stocks + attached gross-shipment outflow + external returns sent + waste. Internal reuse cancels. Packaging never contributes to net bran Q. Keep burden attribution and physical custody non-additive and normalize once by proper original cohort Q/Qc."
      inputs:
        - "article-specific raw stocks and transfers"
        - cp_packaging
      output: "individual package closure"
      source_ids:
        - modern-mills-2023
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all processes"
      requirement: "Lock real wheat species/lot, raw handoff, final feed status, dry roller route and unpelleted unmixed unfermented state. Source technical synthesis is not a claim that the sources describe one SKU or one factory inventory."
      evidence: "supplier records; process map; actual lot quality"
    - id: dq_native
      applies_to: "UUID-bearing bran rows"
      requirement: "Preserve native names/comments, Product type, ILCD classification and exact property/unit chain. The generic original supplies no feed-grade or site-provider qualification; verify actual lot compatibility independently. No CAS or nutritional equivalence is inferred. Intermediate, waste and packaging UUID gaps remain explicit; do not borrow the finished binding."
      evidence: "historical public native object; linked property and unit objects; actual lot quality evidence"
    - id: dq_measurement
      applies_to: "reference lot and physical gates"
      requirement: "Independently measured wet mass, moisture/dry matter, size and foreign matter with calibrated sampling/measurement support Q and mass reconciliation. No fixed yield, composition, density, energy, price, ingredient recipe or per-bag mass is prescribed."
      evidence: "scale and sampling calibration; laboratory methods"
    - id: dq_history
      applies_to: "all ledgers"
      requirement: "Separate physical raw/WIP/FG stocks from per-exchange inherited environmental vectors. Preserve complete upstream handoff, first-release registry, failed Q0 operations, actual services and gross packaging movements by cohort."
      evidence: "raw events; stock/lot ledgers; burden reconciliation"
    - id: dq_gaps
      applies_to: "all dataset uses"
      requirement: "Unknown activity/provider or an auxiliary UUID gap is not zero and does not automatically invalidate the product method. Actual core product/terminal mismatch, missing upstream joint burdens, unsupported causal allocation or unresolved material balance holds the affected dataset. Disclose measured versus unknown and do not call a draft covered."
      evidence: "gap register; supplier and physical evidence"
    - id: dq_sources
      applies_to: "all method evidence"
      requirement: "Original manufacturing sources support qualitative process/terminal facts; ILCD supports only the applicable conditional attributional allocation method. Keep source-specific scope and preserve contrary pelleting/compound-feed examples; do not transfer factory observations or noncontractual product composition into default values."
      evidence: "source applicability; independent originals; review metadata"
validation_rules:
  - rule_id: v_product
    applies_to: "released_bran"
    rule: "Verify feed-grade wheat bran with actual unpelleted dry roller-milling origin and complete finishing-to-release terminal. Exclude food-only retail bran, whole grain, starch wet residue, compound feed, fermentation and pellets. Match the generic Product identity and all independently evidenced required qualifiers to the same real lot."
    source_ids:
      - modern-mills-2023
      - un-cpc3-2025
      - kahl-bran-pelleting
  - rule_id: v_handoff
    applies_to: "raw_bran_fraction"
    rule: "Require the real upstream wheat/cleaning/conditioning/joint-milling mass and attributed-burden handoff once. Retain main flour and every real coproduct/waste destination and original upstream denominator. Missing upstream burdens are a genuine core dataset hold, not a zero-burden residue convention."
    source_ids:
      - modern-mills-2023
      - ilcd-2010-allocation
  - rule_id: v_q
    applies_to: "all processes"
    rule: "The explicit reference link selects released_bran only. First release Q includes accepted closing FG once. Internal custody/dispatch rows never create Q. Preserve historical opening FG burden and original delivery reversals. Q0 prevents a unit result while retaining real events."
    source_ids:
      - modern-mills-2023
  - rule_id: v_balance
    applies_to: "all physical gates"
    rule: "Verify upstream handoff, manufacturing, FG and combined gross physical gates plus separate packaging-article balances. Cancel internal Q and actual recycles exactly. Independently check dry matter, relevant elements and real species; no economic shrinking of waste/water/physical flows or multiple-unknown residual fitting."
    source_ids:
      - modern-mills-2023
      - nzfma-milling
  - rule_id: v_normalize
    applies_to: "all inventory rows"
    rule: "Raw collection remains undivided. Native conversion, justified exchange-specific allocation and inherited-vector reconciliation precede the single A/Q operation; cards reuse that result. Gross V/Q is separate and non-additive. Original services/audits use actual original Qc; H is never another divisor."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: v_atomic
    applies_to: "all processes"
    rule: "Every actual supply, whole formulation, individual package, replacement, energy carrier, waste stream and environmental species is atomic and source/medium bound. Unsupported UUIDs stay absent with specific names; generic collections and hidden other/zero flows are rejected. Check every native restriction in typed consumable context."
    source_ids:
      - modern-mills-2023
  - rule_id: v_allocation
    applies_to: "multifunctional stages"
    rule: "Independently inspect dedicated/subdivided operations, exchange-specific determining physical causality and only real residual common-gate actual-state contemporaneous market value. Reconcile the complete burden vector and disclose sensitivity. Do not award cheap/waste-labelled bran zero burden or displaced feed credit."
    source_ids:
      - ilcd-2010-allocation
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared unpelleted feed-grade wheat bran supply with disclosed upstream and finishing gate"
  allowed_use: "Compatible species/lot and feed condition with verified raw handoff and complete burden/physical history"
  excluded_use: "Automatic coverage of all CPC39120; food retail or compound feed inventory; animal nutrition equivalence; wet starch/distillery residues; pellet manufacture; zero-burden or substitution defaults"
  required_metadata: "All reference qualifiers; raw sifter-to-finisher handoff; upstream joint physical/burden evidence; Q/Qc/H; native restrictions; individual packages and actual waste/species destinations"
  required_quality_disclosure: "Actual measurements versus unknown activity; auxiliary/provider gaps; true core holds; allocation and stock assumptions; scientific and translation review status"
  update_trigger: "Wheat/route/state change; pelleting fermentation or formulation; changed raw handoff; provider/native changes; actual process extension; Q gate or cohort history change"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD. CPC Ver.3.0 Explanatory Notes, 30 June 2025, complete PDF pp102/104/199–200. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "39120 and adjacent flour/compound-feed/starch/sugar/brewing classification titles only; no LCA waste or manufacturing assumption"
  - id: "modern-mills-2023"
    type: "literature"
    reference: "Modern Mills Company. Prospectus dated 31 December 2023; PDF pp129–135, printed76–82; sections4.9.2.3–4.9.3.2.1. https://www.saudiexchange.sa/Resources/IPO/PDF/IPO_ENG_2024-02-12_10-59-00_1.pdf"
    used_for: "Primary wheat supply and joint flour-milling sequence; bran finisher/bins and bulk/bag feed-bran terminal; separate downstream feed recipes and pellets as counterexamples; no default quantities or LCA allocation"
  - id: "nzfma-milling"
    type: "extension_guidance"
    reference: "New Zealand Flour Millers Association. Flour Milling Process, undated publisher page and linked process diagram. https://flourinfo.co.nz/learn/flour-milling-process"
    used_for: "Cleaning conditioning roller/sifter sequence and distinct bran/germ/flour/pollard outputs; industry explanation only; no universal machine count or quantity"
  - id: "ukfm-milling"
    type: "extension_guidance"
    reference: "UK Flour Millers. The milling process, undated publisher page and linked simplified diagram. https://www.ukflourmillers.org/flour-milling/the-milling-process"
    used_for: "Joint separation of endosperm/bran/germ and contrasting reconstituted wholemeal; qualitative process diagram; not a bran packing specification or a watched video"
  - id: "kahl-bran-pelleting"
    type: "literature"
    reference: "AMANDUS KAHL. Bran & husk, undated publisher technical page. https://www.akahl.com/en/industries/by-products-processing/bran-husk/"
    used_for: "Separate added bran-compaction/pelleting route and changed physical form; counterevidence against assuming all bran is supplied as pellets"
  - id: "ilcd-2010-allocation"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, sections7.9.2–7.9.3; complete original PDF. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Conditional attributional subdivision/virtual subdivision; exchange-specific determining physical causality; actual residual common-gate market value and burden reconciliation; no fixed ratio or automatic feed credit"
  - id: "engelke-feed-bran"
    type: "literature"
    reference: "Gebr. Engelke. Animal feed, undated mill page. https://www.gebr-engelke.de/en/animal-feed/"
    used_for: "Independent primary example of flour-sieved wheat bran sold loose for animal feed; also mentions food use, so lot-specific feed status is required; no site activity or composition default"
  - id: "cefetra-wheat-bran-2025"
    type: "literature"
    reference: "Cefetra Ltd. R7-04A Product Data Sheet – Animal Feeds, Wheat Bran, Rev4 effective Aug2025, pp1–2. https://cefetra.co.uk/wp-content/uploads/2025/08/Wheat-Bran-Africa-MSDS-Rev-4-Aug-2025.pdf"
    used_for: "Dry-milling feed-material origin; meal/pellet state distinction and bulk supply; explicitly noncontractual example composition not reused; no universal legal, safety or disposal prescription"
