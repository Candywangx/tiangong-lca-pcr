system_boundary:
  rules:
    - rule_id: b_handoff
      applies_to: "raw_bran_fraction; bran_finishing"
      rule: "Begin at the physically documented separated raw-bran handoff before finishing. Include actual finer rolls/bran finisher, necessary screens or contaminant removal, bins, weighing, sampling and first feed release. Carry wheat supply, cleaning, tempering, all actual joint milling and separation upstream once with a reconciled mass and burden handoff. A mere finished-product purchase and repacking dataset does not meet this route."
      source_ids:
        - modern-mills-2023
        - nzfma-milling
    - rule_id: b_upstream
      applies_to: "cp_upstream"
      rule: "Require the supplier whole-mill physical gate: opening grain/WIP plus actual received wheat and water and real additional materials equals closing grain/WIP plus flour, separated bran, any actual germ/pollard/semolina, screenings, returns, waste and measured moisture/species exchanges. Distinguish mutually exclusive streams and internal recycles. Retain actual farm/grain-supply and transport burdens and original upstream cohort denominator; the bran fraction cannot arrive burden-free because it is cheap or called waste."
      source_ids:
        - modern-mills-2023
        - ukfm-milling
        - ilcd-2010-allocation
    - rule_id: b_q
      applies_to: "released_bran; fg_service"
      rule: "Q is the measured net moist mass of unique newly first-released feed-grade bran lots. Accepted closing FG is already in Q and is not added again as production output. Trace all subsequent storage, packing, handling, dispatch, retesting, returns and real rework to original cohort Qc in a separate service ledger through H. At the combined gate cancel the internal Q transfer."
      source_ids:
        - modern-mills-2023
    - rule_id: b_actual
      applies_to: "all processes"
      rule: "Retain every failed batch, zero-output event, startup, shutdown, idle interval, trial, cleanup and actual rejected or unauthorized rework. An eligibility decision never erases physical flows. Before issuing a dataset add each actual omitted chemical formulation, energy carrier, fuel, material, replacement, package, waste stream and real emission species as an individual exchange; never hide them in zero or an other bundle."
      source_ids:
        - modern-mills-2023
    - rule_id: b_physics
      applies_to: "all physical gates"
      rule: "Reconcile gross physical wet mass separately from dry matter, relevant elements and actual species. Whole moist bran is the primary mass account; moisture, nutrient assays and solids are non-additive bridges. Use independent observations for moisture uptake and release, contaminants and reaction/free/phase/structural water where relevant. Do not fit two unknowns to one residual. COD/TOC/total nitrogen and total dust do not establish one molecular mass."
      source_ids:
        - modern-mills-2023
        - nzfma-milling
    - rule_id: b_utilities
      applies_to: "actual utility extensions"
      rule: "Do not assume every mill has a boiler, dryer, pelletizer, pneumatic transport or gaseous reaction. Where real purchased heat or steam exists, retain measured MJ and actual carrier mass, pressure/temperature, enthalpy and supply/return convention. Record real external condensate or heat-transfer-water return as a separate Product return. Use one principal energy account with a non-additive carrier bridge; do not invent boiler fuel or a nonexistent return."
      source_ids:
        - modern-mills-2023
        - kahl-bran-pelleting
    - rule_id: b_package
      applies_to: "packaging_pool"
      rule: "For every actual package separately, reconcile opening empty plus attached WIP/FG plus reusable stock plus purchases plus external returns received against all closing stocks plus packages leaving with gross shipments plus external returns sent plus waste. Internal reuse cancels and does not create product Q, another purchase or an automatic coproduct. Bag material and closing method are verified site facts, not primary-source defaults."
      source_ids:
        - modern-mills-2023
    - rule_id: b_feed_state
      applies_to: "released_bran"
      rule: "Confirm a loose or meal unpelleted feed-material lot against its actual receiving-party specification and release test results. Food use mentioned by a mill is not proof of feed suitability for every lot. Do not transfer Cefetra example composition values, listed legal references or disposal advice into universal PCR limits or actual waste destinations."
      source_ids:
        - engelke-feed-bran
        - cefetra-wheat-bran-2025
    - rule_id: b_scope
      applies_to: "all processes"
      rule: "This is a narrower unpelleted dry wheat-bran method within CPC39120, not all feed residues. Exclude edible retail bran, whole grain, compound recipes, wet starch residues39130, sugar residues39141/39149, cocoa/coffee waste39150, brewing/distilling residues39160, fermented bran and wood pellets. Pelleting is an additional evidenced route, not a harmless change of package. Classification does not decide LCA Product/Waste status."
      source_ids:
        - un-cpc3-2025
        - modern-mills-2023
        - kahl-bran-pelleting
