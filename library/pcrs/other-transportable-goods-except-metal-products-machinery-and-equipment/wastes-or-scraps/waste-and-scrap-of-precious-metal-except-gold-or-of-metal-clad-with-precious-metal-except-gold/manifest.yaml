  ordinary_gaps:
    - "Full Ag/Cu/other-element assay, solder/coating absence, sheet grade, temper, thickness, cold-shear equipment, actual manufacturer and outsourced gates require lot records; STG-925 marketing does not identify complete chemistry or recycled origin."
    - "Actual quantities, first release, receiver acceptance and physical custody/ownership handoff, per-exchange allocation and compatible background providers require foreground evidence. No measured factory results or universal factors are supplied."
