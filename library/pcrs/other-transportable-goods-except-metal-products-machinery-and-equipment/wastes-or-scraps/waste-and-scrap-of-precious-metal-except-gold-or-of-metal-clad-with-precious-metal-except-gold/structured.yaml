system_boundary:
  rules:
    - rule_id: sb_origin
      applies_to: "whole manufacturing chain"
      rule: "Include receipt and storage of one identified uncoated Ag-Cu sheet lot with inherited upstream sheet burdens; layout and actual cold mechanical cutting into jewellery blanks and offcuts; segregation of this solid offcut stream; actual foreign-object removal; weighing/assay/identity checks and first acceptance to the specified refinery-feed requirements. Retain all real utilities, tooling, failures, start/stop, idle, cleanup, samples and rework. A purchased ready-to-refine scrap lot merely packed does not fulfil this manufacturing scope. Use actual shearing records; the manufacturer documents guillotine-cut sheet, not a universal punch/die route."
      source_ids:
        - mw-scrap
        - brepohl-scrap
        - jrc-ilcd-2010
        - mw-plate
        - mw-alloys
        - mw-terms
    - rule_id: sb_upstream
      applies_to: "each purchased whole material"
      rule: "Use one compatible upstream owner for sheet mining/recycled-feed recovery, refining, alloying, rolling and actual supply transport. Purchase the whole alloy once; Ag/Cu assay fractions are analytical subaccounts, not second purchases. Same rule applies to each supplied can or lubricant preparation. Actual onsite mixing instead records each purchased ingredient, mixing energy and losses separately. No zero historical burden because a material is called scrap."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_gate
      applies_to: "manufacturing and finished stock"
      rule: "Record actual manufacturer, any outsourced cutter, dispatch/receipt documents and custodian/beneficial owner at each handoff; material-owner transfers and resale never generate a new Q. Receiver delivery acceptance and legal settlement are distinct events, and no later refined-metal output enters Q.  Q is net whole accepted offcut mass first released for the specified receiver, excluding all containers and removed foreign objects. Record unique release ids. Closing FG already released is included in Q; never add closing FG beside Q as another manufacturing output or deduct its manufacturing burden. Internal release handover cancels in consolidation. Reinspection, shipment, return and rework do not produce a second Q. Rejected or unaccepted offcuts remain WIP/waste with their complete history."
      source_ids:
        - mw-scrap
        - brepohl-scrap
        - jrc-ilcd-2010
        - mw-terms
    - rule_id: sb_service
      applies_to: "post-release cohort"
      rule: "Keep actual storage, handling, packing, dispatch and permitted further work in a distinct original-cohort service account with original Q_c and observed horizon H; H is never a production denominator. Do not subtract performed services for closing FG. Retain full historical manufacturing vectors for opening/closing FG and returned lots. No assumed transport distance, machine life, holding time or repair success. Net-delivery normalization is outside this first-release basis."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_stocks
      applies_to: "each exchange and cohort"
      rule: "Preserve opening/closing raw stock, WIP and unused/unassigned charges in each original extensive unit and their inherited per-exchange burden vectors. A recorded consumption already corrected for stock is not stock-corrected twice. Include every failed and zero-output event; Q=0 retains loads and produces no unit result. Internal reuse transfers both physical quantity and historical vector, cancels internal legs and retains real reprocessing energy/loss."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_physical
      applies_to: "cutting preparation FG and consolidated gates"
      rule: "Keep full unallocated gross physical V distinct from attributed burden A. Close total physical mass and Ag/Cu/each relevant other element independently over the same gates; one residual cannot determine two unknowns. Whole alloy, dust and mixed outlets are counted once; assayed components partition those wholes without being added again. Distinguish metallic particles, real oxides/ions and free/sorbed/reaction water using independent evidence. PM, COD or total metal indicators are not molecular masses. X_in/X_out may remove only a demonstrably identical OTHER same-side term; never remove stocks or an opposite-side leg."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_packs
      applies_to: "each packaging pool"
      rule: "For each can and each additional actual packaging component: opening empty + attached WIP + attached FG + reusable stocks + purchases P + first non-purchase external ingress I + external returns received ER = corresponding closing stocks + packaging on gross shipments S + external returns sent EO + waste W. Record independently measured material/water changes separately; internal reuse cancels. S follows gross physical shipment, not net Q or an economic share. Give each ingress one upstream owner. If source pools share one mixed outlet, their disjoint partitions sum to one whole outlet with one provider; do not add partitions to the whole.  I covers every first non-purchase external receipt, whether attached to incoming goods, separately borrowed or transferred without payment, irrespective of supplier inventory coverage. ER requires traceability to the same can previously sent out from this site; otherwise classify first receipt as I, not ER. Every physical ingress has an owner; separately tag actual purchase, transport and service burdens once, including borrower-paid freight. Missing supplier coverage remains a data gap, never zero. EO and S are disjoint gross outward legs; a returned borrowed can is not also a shipment can."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: sb_atoms
      applies_to: "actual exchange coverage"
      rule: "Each real added material, chemical formulation, energy carrier, fuel, packaging component, maintenance part, waste outlet and emitted species needs its own named atomic card and actual conditions. Missing data are not zero. No assumed thermal washing, steam or boiler in this dry route. If actual external steam/cooling carriers exist, independently record complete supplied and returned water kg, actual state/enthalpy and MJ under one provider convention; returned condensate is Product return. A different route needs evidence and scope review."
      source_ids:
        - jrc-ilcd-2010
