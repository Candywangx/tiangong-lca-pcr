    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–265; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation only where justified: subdivision, exchange-specific determining physical causality and residual same-state process-gate economic value; stock-vector equations are declared PCR collection methodology"
  - id: "mw-plate"
    type: "extension_guidance"
    reference: "Morris and Watson, Plate & Sheet; https://morrisandwatson.com/fabrication/plate-sheet"
    used_for: "Sterling sheet supply and guillotine shearing; no batch assay, universal dimensions or measured BOM"
