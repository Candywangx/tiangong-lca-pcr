allocation_rules:
  - rule_id: al_framework
    applies_to: "all burden attribution"
    rule: "Apply only attributional modelling where allocation is justified. First identify the actual joint cutting gate, co-produced blank and offcut states, periods and complete inputs/losses; do not convert classification, monetary value or a refinery payout into a zero-history cutoff or recovery credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_subdivide
    applies_to: "dedicated operations and identifiable exchanges"
    rule: "Separate physically dedicated offcut segregation, inspection and handling; virtually subdivide exclusively related exchanges when justified by process records. Assign blank-only finishing to blanks rather than forcing it into the offcut product. Do not allocate a gross material balance."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_causality
    applies_to: "each remaining shared exchange"
    rule: "For each remaining shared exchange independently identify and quantify its determining physical causal relationship to outputs, including direct material content and actual limiting service/time factors as applicable. Sheet material embodied in offcuts keeps its related upstream vector; account for losses before choosing shares. Cutting geometry alone does not prove the same allocation for sheet, tooling, lighting and storage. No arbitrary choice of mass versus price."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: al_residual
    applies_to: "only genuinely unresolved shared burdens"
    rule: "Only residual flows for which subdivision and determining physical causality cannot resolve attribution may use justified economic allocation at the same common process gate, actual material state and contemporaneous period. Derive comparable gate values excluding downstream refining, transport and conditioning; disclose prices, uncertainty and sensitivity. No fixed percentage, automatic economic allocation or later refined-silver value as scrap-gate price. Reconcile shares and conservation for every original exchange."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "cut"
      flow_role: "whole sheet / blanks / actual lubricant"
      record_type: "supplier and event record"
      raw_fields: "lot; supplier; form; full assay; as-received mass; opening/closing raw and WIP; whole formulation; blank gross mass; cutting method and equipment; all failed/rework events; inherited exchange vector"
      collection_method: "Weigh whole materials and each physical output separately using calibrated scales; reconcile lot issues/returns and actual cold cutting records. Assay subaccounts do not duplicate whole purchases. Keep raw undivided totals and inherited vectors; stock-correct once; no division by Q here."
      unit: "kg"
      frequency: "each lot and event"
      temporal_coverage: "complete declared cohort including Q0"
      site_scope: "actual receiving cutting and contractor gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing certificates; supplier certificate; lot mass ledger; tool configuration"
    - protocol_id: cp_energy_cut
      process_id: "cut"
      flow_role: "electricity by duty"
      record_type: "meter and supplier record"
      raw_fields: "meter ids; opening/closing reading; kWh or integrated MJ; power-rate timestamps if rate; country; voltage; supply mix; duty and all failed/idle/cleanup loads; allocations"
      collection_method: "Read actual duty/submeters and main meter; reconcile disjoint duties without adding the main total again. Integrate genuine rates only; already integrated readings are not multiplied by time. Retain undivided converted energy; kWh to MJ once; justify per-exchange attribution before calc_quotient."
      unit: "MJ"
      frequency: "each duty and reporting period"
      temporal_coverage: "full matching cohort"
      site_scope: "actual meters and same site"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; bills; duty bridge; allocation record"
    - protocol_id: cp_energy_prepare
      process_id: "prepare"
      flow_role: "electricity by duty"
      record_type: "meter and supplier record"
      raw_fields: "meter ids; opening/closing reading; kWh or integrated MJ; power-rate timestamps if rate; country; voltage; supply mix; duty and all failed/idle/cleanup loads; allocations"
      collection_method: "Read actual duty/submeters and main meter; reconcile disjoint duties without adding the main total again. Integrate genuine rates only; already integrated readings are not multiplied by time. Retain undivided converted energy; kWh to MJ once; justify per-exchange attribution before calc_quotient."
      unit: "MJ"
      frequency: "each duty and reporting period"
      temporal_coverage: "full matching cohort"
      site_scope: "actual meters and same site"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; bills; duty bridge; allocation record"
    - protocol_id: cp_assets
      process_id: "cut"
      flow_role: "shear blade service and physical stocks"
      record_type: "maintenance record"
      raw_fields: "asset and blade identity; acquisition; installed/unused opening/closing; real service hours; repair; retirement; inherited burden; supplier"
      collection_method: "Record actual blade purchases and fulfilled service independently; derive service consumption from justified actual capacity/use and stock history without a fixed life. Keep raw physical stocks and burden-service allocation separate and undivided."
      unit: "kg; h"
      frequency: "each acquisition repair service and retirement"
      temporal_coverage: "actual observed period"
      site_scope: "actual cutting equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "maintenance and service logs; purchase records"
    - protocol_id: cp_release
      process_id: "prepare"
      flow_role: "Q first accepted solid offcuts"
      record_type: "release and assay record"
      raw_fields: "unique release id; source sheet lot; assay; absence of intentional gold/PGM/coating; solid form; removed foreign mass; net lot kg; receiver specification and acceptance; manufacturer and outsourced cutter; handoff/custody and ownership records; unreleased opening/closing WIP; release time"
      collection_method: "Calibrated tare-corrected net weighing of each uniquely accepted lot; tie origin and composition to actual refinery-feed approval. Provider requirements are actual records, not inferred from a public service page. Sum uniquely first-released net whole offcuts as Q; retain closing FG already in Q; no Ag-equivalent denominator."
      unit: "kg"
      frequency: "each first-release lot"
      temporal_coverage: "declared first-release cohort"
      site_scope: "actual preparation gate and named receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale certificate; release register; receiver specification; representative assay"
    - protocol_id: cp_waste_cut
      process_id: "cut"
      flow_role: "each rejected stream and steel fragment"
      record_type: "weighing and destination record"
      raw_fields: "stream id; whole mass; wet/dry basis; assay/species; destination; treatment provider; inherited vector; samples; internal recirculation"
      collection_method: "Weigh each distinct real outlet and separately determine relevant elements; track WIP/internal recirculation separately from external waste. Keep undivided whole-outlet totals; source partitions sum to a single mixed outlet without adding twice."
      unit: "kg"
      frequency: "each actual outlet"
      temporal_coverage: "full cohort including failed and Q0 events"
      site_scope: "actual cutting and preparation gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste receipts; assay; stock reconciliation"
    - protocol_id: cp_waste_prepare
      process_id: "prepare"
      flow_role: "each rejected stream and steel fragment"
      record_type: "weighing and destination record"
      raw_fields: "stream id; whole mass; wet/dry basis; assay/species; destination; treatment provider; inherited vector; samples; internal recirculation"
      collection_method: "Weigh each distinct real outlet and separately determine relevant elements; track WIP/internal recirculation separately from external waste. Keep undivided whole-outlet totals; source partitions sum to a single mixed outlet without adding twice."
      unit: "kg"
      frequency: "each actual outlet"
      temporal_coverage: "full cohort including failed and Q0 events"
      site_scope: "actual cutting and preparation gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "waste receipts; assay; stock reconciliation"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "cohort storage handling and freight"
      record_type: "event and logistics record"
      raw_fields: "original cohort; Q_c; observed H; full opening/closing FG and vectors; gross dispatch; actual returns; performed energy/service; kg and km for freight; load constraint; provider"
      collection_method: "Assign actual post-release service to original cohorts with measured duty and actual provider/load basis; do not use H as new output. Keep raw service totals undivided; retain original Q_c for the single quotient; performed services are not subtracted for closing stock."
      unit: "MJ; kg*km; kg; h"
      frequency: "each actual event"
      temporal_coverage: "observed H for each original cohort"
      site_scope: "actual warehouse and logistics gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch/return bridge; original release ids; service meters; freight contract"
    - protocol_id: cp_packaging
      process_id: "pack"
      flow_role: "steel-can complete pool"
      record_type: "stock and event record"
      raw_fields: "can id and composition; tare; opening/closing empty attached WIP attached FG reusable stocks; P; I; ER; S; EO; W; actual natural mass changes; upstream owner"
      collection_method: "Weigh each full can pool and all real directions independently; relate S to gross dispatch and keep contents separate. Additional labels/liners use separate pools. Retain raw complete six-leg events and stocks; internal reuse cancels; full physical V and tagged burden A remain distinct.  I covers every first non-purchase external receipt, whether attached to incoming goods, separately borrowed or transferred without payment, irrespective of supplier inventory coverage. ER requires traceability to the same can previously sent out from this site; otherwise classify first receipt as I, not ER. Every physical ingress has an owner; separately tag actual purchase, transport and service burdens once, including borrower-paid freight. Missing supplier coverage remains a data gap, never zero. EO and S are disjoint gross outward legs; a returned borrowed can is not also a shipment can."
      unit: "kg"
      frequency: "each pool event and stocktake"
      temporal_coverage: "full manufacturing and actual service horizon"
      site_scope: "actual can storage preparation and dispatch"
      aggregation_rule: "per reference flow"
      quality_evidence: "pool balance; purchase/return/dispatch/waste records; tare evidence"
    - protocol_id: cp_emission
      process_id: "prepare"
      flow_role: "each actual air species"
      record_type: "sampling and speciation record"
      raw_fields: "outlet and compartment; rate versus integrated sample volume; independent sampled gas state and density where needed; species and particulate structure; Ag or Cu elemental content; duration only for true rate; uncertainty; control efficiency measured"
      collection_method: "Measure actual individual species or defensibly element-based releases; do not infer oxide/ion mass from total-metal or PM residual. Integrated volume is not multiplied by time. Air unspecified UUID only if that compartment is justified. Retain undivided species totals and physical/burden vectors; no assumed release or factor."
      unit: "kg"
      frequency: "each real emitting duty"
      temporal_coverage: "actual full cohort including control failures"
      site_scope: "actual emission point"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling records; independent speciation; LCIA compatibility; analytical uncertainty"
  calculation_rules:
    - id: calc_numerator
      applies_to: "all inventory rows"
      rule: "Convert raw records into each actual extensive unit first. For original exchange i/cohort c after subdivision and exchange-specific attribution form A_i_c as current attributable load plus inherited opening WIP/unused-charge vector minus closing unfinished/unused unassigned vector, with disjoint terms and one stock correction. Never subtract released-FG manufacturing vector from manufacturing A. Retain actual sample/failure/treatment burdens. Performed service load is separately B_i_c with original Q_c."
      inputs:
        - cp_material
        - cp_energy_cut
        - cp_energy_prepare
        - cp_assets
        - cp_waste_cut
        - cp_waste_prepare
        - cp_service
        - cp_packaging
        - cp_emission
      output: "A_i_c; B_i_c"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_physical
      applies_to: "manufacturing preparation FG consolidated and packaging gates"
      rule: "At each gate retain undivided full physical opening + gross external inputs = closing + gross external outputs + actual independently measured transformations; matched internal transfers cancel. Manufacturing outputs contain unique Q, joint blanks and actual waste, without adding closing FG beside Q. FG gate: opening FG + first-release transfer + actual returns = closing FG + gross dispatch + actual waste/loss. Independently reconcile Ag/Cu and every relevant element; content subaccounts never add to wholes. Each packaging pool follows sb_packs; X removes only exact same-side OTHER duplication."
      inputs:
        - cp_material
        - cp_release
        - cp_waste_cut
        - cp_waste_prepare
        - cp_packaging
        - cp_service
      output: "V_i; physical and elemental residuals"
      source_ids:
        - jrc-ilcd-2010
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "Only for Q>0 execute the sole x_i = A_i / Q and physical-audit v_i = V_i / Q for the same cohort; service uses only original-cohort s_i_c = B_i_c / Q_c. These are distinct tagged accounts, not sequential divisions or duplicate providers. Cards and aggregation reference these results only. Q=0 retains complete loads without a unit result."
      inputs:
        - A_i_c
        - B_i_c
        - V_i
        - cp_release
        - cp_service
      output: "x_i; v_i; s_i_c"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "sheet and feed"
      requirement: "Match actual single-source sheet, complete assay, form, cold-cutting configuration and specified receiver approval per lot. A refining service catalogue cannot approve another source; pure foil is not alloy sheet."
      evidence: "supplier lot certificate; receiver specification; configuration record"
    - id: dq_history
      applies_to: "all gates and cohorts"
      requirement: "Independently close total mass/elements; include all raw/WIP/FG/packaging stocks, per-flow inherited vectors, failures/Q0/idle/cleanup, real rework and samples. Incomplete evidence stays uncertain, not zero."
      evidence: "raw ledgers; calibration; assay; vector bridge"
    - id: dq_provider
      applies_to: "each bound and unbound exchange"
      requirement: "UUID establishes identity only; apply complete native form/type/compartment/route/geography/property limits. Separately verify provider compatibility and temporal/geographic representativeness. Verify each unbound specific flow without collection substitutes."
      evidence: "complete native record; provider evidence; uncertainty disclosure"
    - id: dq_evidence
      applies_to: "rules and results"
      requirement: "Industrial sources support physical route only; ILCD supports justified attributional method only. Actual values use foreground collection, without copied prices/fineness/recovery yields or historical case factors. Service H remains separate from production Q."
      evidence: "original context; method justification; coverage and uncertainty"
validation_rules:
  - rule_id: vr_scope
    applies_to: "reference feed"
    rule: "Verify single Ag-Cu sheet-fabrication solid offcuts, no intentional gold/coating, exclusion of ash/filings/sweeps, actual cold-cut origin, receiver requirements and first acceptance per lot; a mismatch cannot use this reference. Verify the fixed grade, complete assay, temper, thickness and original shear configuration independently; supplier marketing cannot settle batch applicability or receiver acceptance."
    source_ids:
      - un-cpc3-2025
      - mw-scrap
      - brepohl-scrap
      - mw-plate
      - mw-alloys
      - mw-terms
  - rule_id: vr_measure
    applies_to: "all amounts and stocks"
    rule: "Check unique Q, original row units, actual conversions, single A/Q, original-Q_c service and Q0 retention; independently close manufacturing/FG/consolidated total mass, every relevant element and each packaging pool. Reject duplicate closing-FG production, components added to whole, duplicate provider or multi-unknown residual fitting."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: vr_allocation
    applies_to: "burden attribution"
    rule: "Check dedicated/virtual subdivision then determining physical causality for every exchange; same-gate same-state contemporaneous economic value only for genuine residuals. Insufficient evidence requires review; engineering checks are not scientific acceptance. No fixed shares, zero history or substitution credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: vr_native
    applies_to: "inventory exchanges"
    rule: "Check atomic identity, official Chinese display, complete native restrictions and actual provider/version-property-unit chain. Each actual added substance needs its own card. Air element flows cannot replace captured dust or unknown species/compartment; prefer species-specific flows where LCIA distinguishes them."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Unrefined feed background with matching origin/composition/form/acceptance gate; not methodology approval"
  allowed_use: "Actual single-source solid Ag-Cu sheet offcuts with complete attributional history satisfying every qualifier"
  excluded_use: "Whole-leaf coverage; gold/ash/sweeps/filings/refined ingots; fixed recovery/substitution credit; zero historical burden; net-delivery denominator"
  required_metadata: "all reference qualifiers; actual gates and cohort; complete raw protocol records; sole quotient; provider ownership; allocation justification and sensitivity"
  required_quality_disclosure: "native identity/provider limits; unresolved core/auxiliary items; historical-vector coverage; measured versus inferred evidence; scientific and translation approval state"
  update_trigger: "change of origin/composition/form/manufacturing route/receiver specification; provider or native restriction changes; allocation or measurement evidence change"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Ver.3.0 Explanatory Notes, 30 June 2025, PDF p.203; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Non-gold precious-metal scrap scope versus gold scrap 39331 and ash 39333; no LCA allocation rule"
  - id: "mw-scrap"
    type: "extension_guidance"
    reference: "Morris and Watson, Scrap; https://morrisandwatson.com/refining/scrap"
    used_for: "Refinery-feed terminal for identifiable solid clean alloy scrap including plate offcuts; stated Morris and Watson origin is a source limitation, not approval of another supplier"
  - id: "mw-separation"
    type: "extension_guidance"
    reference: "Morris and Watson, Refining Tips; https://morrisandwatson.com/refining/precious-metal-refining-tips"
    used_for: "Silver separation, removal of large foreign metal objects, scrap versus sweeps and stated shipment identity; sludge/PGM branches excluded"
  - id: "brepohl-scrap"
    type: "handbook"
    reference: "Erhard Brepohl, Precious Metal Refining, updated 11 December 2016, The Theory and Practice of Goldsmithing extract; https://www.ganoksin.com/article/precious-metal-refining/"
    used_for: "Treatment at the Refinery and Scrap: sheet-fabrication origin, segregation, alloy identity, weighing and rigid container; neighbouring filings/sweeps/acid-refining cases are not adopted"
