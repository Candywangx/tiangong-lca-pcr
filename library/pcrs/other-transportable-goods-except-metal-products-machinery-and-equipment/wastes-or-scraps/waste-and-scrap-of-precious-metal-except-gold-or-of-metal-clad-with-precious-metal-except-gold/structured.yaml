    used_for: "STG-925 grade identity, separate Pd-bearing sterling and batch assay policy; not proof of complete Ag-Cu composition or recycled fraction"
  - id: "mw-terms"
    type: "extension_guidance"
    reference: "Morris and Watson Ltd (NZ), Refining Terms and Conditions v2 July 2023; https://morrisandwatson.com/pdf/MWNZ-Refining-Terms-v2.pdf"
    used_for: "July 2023 v2 §§2,4–6: acceptance discretion, origin/description, delivery/settlement distinction and potential outsourced assay; no universal minimum LCA lot"
