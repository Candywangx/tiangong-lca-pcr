allocation_rules:
  - rule_id: allocation_scope
    applies_to: "whole_supply"
    rule: "Document actual source-tyre history, prior use and economic/legal state and the study-specific inherited-burden/reuse convention. A low price, waste label or title transfer does not establish a zero burden or avoided new-tyre/rubber/landfill credit."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_subdivision
    applies_to: "whole_supply"
    rule: "First exclusively attribute and subdivide inspection, rejects, disposal and post-release services. Retain failed visits, zero-output periods and causal rework. Services performed for other functions and owner-retained rejects have explicit activity owners; do not erase common inspection effort."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_physical
    applies_to: "whole_supply"
    rule: "For each remaining shared exchange demonstrate its determining physical cause. Measured inspection time may support equipment allocation; crew route and visit purpose govern travel. Do not use casing mass, count or price as a universal key. Retain supplier inclusions and reconcile all shares."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "whole_supply"
    rule: "Only if subdivision and determining physical causality cannot resolve genuine joint burdens use documented contemporaneous same-gate actual-condition market values for residual economic allocation. Remove later transport/retreading margins and distinguish disposal fees from positive product values. Missing coherent values remain unresolved."
    source_ids:
      - jrc-ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "whole_supply"
      flow_role: "Custody/quality/mass"
      record_type: "Weigh and acceptance ledger"
      raw_fields: "lot/item; prior use; owner; size; gross/tare; free water/soil/articles; net kg; count; custody time; tread/sidewall/bead/internal results; inspector; decision/spec; payment/title; first release; rejects; returns; opening/closing WIP/FG and burden vectors"
      collection_method: "Calibrated paired weighing; independent contaminant weights; signed individual inspection and commercial/custody reconciliation; no assumed kg/tyre"
      unit: "kg; item"
      frequency: "each custody and decision"
      temporal_coverage: "full cohort including failed lots and carryover"
      site_scope: "actual seller and inspection sites"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; paired tickets; source history; specifications; signatures; payment/title receipts; full stock balance"
    - protocol_id: cp_energy
      process_id: "whole_supply"
      flow_role: "site_electricity"
      record_type: "Meter/provider records"
      raw_fields: "meter start/end; kWh; time; site; voltage; supplier; stage; idle; cleanup; losses; provider inclusions; allocation key"
      collection_method: "Read calibrated meter difference and reconcile billed/site load; identify the actual native supplier property separately"
      unit: "kWh; MJ"
      frequency: "each interval"
      temporal_coverage: "full same cohort period"
      site_scope: "actual inspection site/provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration and primary supply records; overlap reconciliation"
    - protocol_id: cp_services
      process_id: "whole_supply"
      flow_role: "Inspection and crew travel"
      record_type: "Provider/activity logs"
      raw_fields: "provider; actual lot; inspection event; equipment/time; service inventory boundary; origin/destination; vehicle; distance; unsuccessful visits; return legs; other functions; payment; inclusions"
      collection_method: "Match supplier primary inventory to signed physical service and route records; unbundle only verified inclusions"
      unit: "inspection event; vehicle*km"
      frequency: "each visit and service"
      temporal_coverage: "all matched successes/failures and returns"
      site_scope: "actual source and providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed inspection records; provider inventories; route logs; justified allocation and no-overlap proof"
  calculation_rules:
    - id: acceptance_q
      applies_to: "released_whole_tyres"
      rule: "Q = sum of unique first-accepted net casing kg with matched inspection/payment/title evidence. A later resale, transfer, reinspection or return adds no Q. Closing accepted FG is already in Q; opening accepted FG belongs to its historical cohort."
      inputs:
        - cp_mass
      output: "Q"
      source_ids:
        - jrc-ilcd-attributional-2010
        - cash-casing-terms
    - id: raw_attribution
      applies_to: "all inventory rows"
      rule: "Convert raw records to row units, then assign exclusive and justified shared burdens. A_j = attributed current raw load + opening WIP inherited burden vector - closing WIP inherited burden vector. Reconcile rejects/rework and supplied casing history separately; stocks carry every exchange burden, not just casing kg. No Q division here."
      inputs:
        - cp_mass
        - cp_energy
        - cp_services
      output: "A_j"
      source_ids:
        - jrc-ilcd-attributional-2010
        - cash-casing-terms
    - id: single_intensity
      applies_to: "all inventory rows"
      rule: "I_j = A_j / Q for Q > 0, once only, in the row numerator unit per 1 kg reference flow. Cards and aggregation consume this same result. Q=0 retains all burdens and provides no unit intensity; the reference output is 1 kg."
      inputs:
        - A_j
        - Q
      output: "I_j"
      source_ids:
        - jrc-ilcd-attributional-2010
        - cash-casing-terms
    - id: physical_balance
      applies_to: "whole_supply"
      rule: "For one custody control surface: opening physical stocks + actual external receipts = closing stocks + actual external departures + separately measured losses. Unreceived presentations are neither receipt nor departure. First acceptance transfers pre-release stock to FG internally; it is not an extra external departure. Contaminants and constituents are separate non-additive subaccounts. No invented residual output."
      inputs:
        - cp_mass
      output: "physical balance"
      source_ids:
        - jrc-ilcd-attributional-2010
        - cash-casing-terms
    - id: post_release_service
      applies_to: "whole_supply"
      rule: "Keep original cohort Qc fixed; link later storage/loading/transport/returns and opening/closing FG service-burden vectors. Assign actual incremental service to that cohort. A delivered-casing dataset needs its own actual shipment/stock reconciliation. Combine linked raw burdens and cancel internal handoffs; never divide an existing I_j by Q or serviced mass again."
      inputs:
        - cp_mass
        - cp_services
        - cp_energy
      output: "cohort service ledger"
      source_ids:
        - jrc-ilcd-attributional-2010
        - cash-casing-terms
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify native flow type, bilingual name, physical state, geography, property/reference coefficient and exact unit support. A name or unit-group match is insufficient. Missing product UUID prevents final identity qualification."
      evidence: "Direct native records and actual lot/provider compatibility"
    - id: dq_grade
      applies_to: "released_whole_tyres"
      requirement: "Keep individual retreadability observations and acceptance specification; no universal tread-depth, age, mass, composition or life default. Commercial purchase does not prove future retreader pass or road safety. General waste-only web wording is not lot-specific grading evidence."
      evidence: "Signed inspection, actual purchase/custody and local legal documentation"
    - id: dq_complete
      applies_to: "whole_supply"
      requirement: "Distinguish missing data from verified absence; include failed/idle effort, carryovers and all actual physical flows. Resolve material losses or add separately named exchanges before claiming complete LCI."
      evidence: "Full-period balances, provider reconciliation and uncertainty register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "released_whole_tyres"
    rule: "Require all qualifiers, one first-acceptance link, actual retreadable grade, payment/title/custody evidence and compatible native Product identity. Do not use definite scrap or a finished retread as the reference."
    source_ids:
      - cash-casing-terms
      - cash-casing-faq
      - wco-hs2022-rubber
  - rule_id: validate_balance
    applies_to: "whole_supply"
    rule: "Reconcile raw mass/custody, WIP/FG burden vectors, actual suppliers, failed visits, rejected lots and all returns. No duplicate Q, provider load, packaging or constituent burden. Missing data prohibit a complete unit result."
    source_ids:
      - jrc-ilcd-attributional-2010
      - cash-casing-terms
  - rule_id: validate_normalization
    applies_to: "all inventory rows"
    rule: "Check raw conversion and attribution before one A_j/Q division. Schema/projection and finite measurement checks do not establish physical balance, source applicability, native supplier compatibility, scientific/safety approval or translation review."
    source_ids:
      - jrc-ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified incoming retreadable casing at source purchase gate, with later delivery/retreading modelled separately"
  allowed_use: "Only matching truck casing grade, dry loose route, source acceptance gate, source burden convention and independently reviewed completed dataset"
  excluded_use: "Finished retread manufacture; tyre driving life/safety claim; material-recovery scrap; automatic reuse credit; repeated resale as production; whole CPC leaf coverage"
  required_metadata: "Section 3 qualifiers, raw protocols, cohort/Q and custody links, providers, allocation keys and unresolved identities"
  required_quality_disclosure: "Missing versus verified zero; inherited burden and stocks; pending native identities; source limits; actual legal/quality evidence and uncertainty"
  update_trigger: "Changed tyre grade/specification, route/gate, actual packaging, source legal/economic state, provider identity or material evidence"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 structure and complete explanatory notes, 30 June 2025, PDF p.202 (39250/39260); current registry https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/39260"
    used_for: "Current category and adjacent scrap heading; notes provide titles only, not an explicit retreadability threshold. Narrower casing scope is methodological interpretation, not quoted CPC text."
  - id: "wco-hs2022-rubber"
    type: "official_guidance"
    reference: "World Customs Organization, HS Nomenclature 2022, Chapter 40 note 6 and headings 40.04/40.12 (4012.20). https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0740_2022e.pdf?la=en"
    used_for: "Independent boundary counterevidence: definitely unusable rubber articles are scrap even without cutting. HS2022 is distinct from CPC3; no automatic cross-edition mapping."
  - id: "cash-casing-terms"
    type: "extension_guidance"
    reference: "Cash’s Tire Recycling, Terms of Service §§4.4, 5.1–5.6, 6 and 7. https://cashstirerecycling.com/terms"
    used_for: "First-party on-site inspection, purchase/payment/title handoff and rejected-casing alternatives. Separate commercial acceptance from later transport/retreading. Texas practice and general waste wording are not local legal authorization, a measured inventory or universal quality specification."
  - id: "cash-casing-faq"
    type: "extension_guidance"
    reference: "Cash’s Tire Recycling, FAQ, Used Commercial Tires & Casings. https://cashstirerecycling.com/faq"
    used_for: "Actual commercial truck retreadable-casing market and visual/structural inspection dimensions. Same operator as terms, not an independent second source; sizes are examples, not default mass or guaranteed stock."
  - id: "jrc-ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Conditional attributional subdivision, determining physical causality and residual same-gate actual-condition market values. Ledger/formula implementation is this PCR synthesis; no automatic tyre cut-off, credit, numeric default or full ILCD conformance."
