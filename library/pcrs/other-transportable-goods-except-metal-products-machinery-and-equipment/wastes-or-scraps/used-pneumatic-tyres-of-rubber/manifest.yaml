review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: Pending independent review; author self-check does not approve methodology, safety, translation,
    mapping or publication.
  classification_decision: Accepted narrower association under docs/adr/2026-11-21-accept-cpc-39260-first-purchase-of-retreadable-truck-casings.md.
  semantic_scope: Previously used whole rim-free commercial truck pneumatic rubber casings, dry on-site inspection
    and grading through first acceptance/payment/title handoff at the seller location, before retreading. Accepted
    39260 narrower scope; excludes definitively unusable rubber scrap, finished retreads and downstream delivered-product
    services. Preserves original scaffold id; accepted 36120 finished-retread method has a distinct product and
    gate.
  reference_flow_identity:
    status: unresolved
    unresolved_support_fields:
    - reference_product_flow_uuid
    reason: No verified compatible native Product record for the retreadable casing grade. Fixed public XML for
      Waste Tire is typed Product flow, unlike the historical draft claim, but its waste-named pyrolysis/Utah description
      does not establish retreadable casing quality.
  unresolved_flow_identities:
  - row_id: offered_casing
    reason: Grade-unassessed used commercial truck casing Product identity and actual custody/legal state require
      verification.
  - row_id: site_electricity
    reason: Actual voltage/geography/mix and native supplier Product/property remain unverified; Energy unit chain
      supports metered quantity only.
  - row_id: inspection_service
    reason: Actual outsourced casing-inspection service identity and provider boundary require verification.
  - row_id: crew_visit
    reason: Actual road inspection-crew visit service identity and vehicle-km support require verification; generic
      freight is not crew travel.
  - row_id: released_whole_tyres
    reason: Unique declared reference Product row; no compatible verified native Product UUID.
  - row_id: returned_casing
    reason: Non-purchased still-reusable casing returned to owner requires native Product identity and custody proof.
  - row_id: scrap_casing
    reason: Whole definitively non-retreadable scrap tyre Waste identity requires verified record and actual custody/disposal
      evidence.
  collection_requirements: Paired gross/tare and separate contaminants, individual inspection decisions, payment/title
    and custody timestamps, raw full-period energy/crew/provider records, stock and return links, actual supplier
    burden, allocation causality and legal state. No measured lot or universal tyre mass, yield, life, rejection
    fraction or factor is asserted.
  native_support: Mass and Technical flow property Energy, including exact referenced kg and MJ/kWh groups, checked
    from fixed public ILCD originals. These are archived support records, not contemporary platform readings. All
    historical exchange UUIDs removed. Waste Tire f24cbd06-38a5-47ec-8f7a-748a52bf9a88 has English/Chinese names
    Waste Tire / 废旧轮胎, Product flow type, Mass coefficient 1 in that fixed XML; its generic waste/pyrolysis/Utah
    description establishes neither inspected retreadability nor actual source grade. Historical draft Waste-flow
    typing is not reused. Historical China electricity and generic freight do not establish the actual supplier
    or crew visit; equal energy units never establish Net calorific value.
  module_applicability: 'Retained core module references are scaffold guidance, not scientific evidence. Candidate
    PEF/EF3.1 module is not adopted: no PEF study context or full-method conformance claimed.'
  evidence_limitations: UNSD current full notes p202 contain the headings only. WCO HS2022 note6 is independent
    scrap-boundary counterevidence, not a substitute CPC3 note. Cash terms5 and FAQ are first-party commercial practice,
    not test records or universal retreadability thresholds; general waste-only wording in terms7 must not override
    actual lot-specific casing qualification. ILCD allocation original is reused only for conditional methodological
    hierarchy; no numeric transfer.
