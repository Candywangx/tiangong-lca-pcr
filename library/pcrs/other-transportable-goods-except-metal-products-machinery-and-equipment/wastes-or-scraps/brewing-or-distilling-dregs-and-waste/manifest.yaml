    status: unresolved
    unresolved_support_fields:
    - reference_product_flow_uuid
    reason: The historical generic by-product UUID does not establish this narrower whole wet grain identity. Mass property
      and kg unit group independently verified against retained public ILCD XML; no current platform-read claim.
