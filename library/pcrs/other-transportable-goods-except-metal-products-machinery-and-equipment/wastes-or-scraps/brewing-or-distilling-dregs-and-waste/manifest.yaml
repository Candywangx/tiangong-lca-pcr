  scientific_review: pending
  translation_review: pending
  scope_statement: One narrower whole wet malt-barley brewing spent-grain single cattle-feed ingredient; original canonical
    identity retained for the accepted narrower association.
  source_synthesis: 'Current original verification: UNSD complete notes pp199–200; KW moist-feed datasheet; Brewers Association
    brewing section; Ponndorf wet conveyor; VetterTec route alternatives; ILCD attributional hierarchy; Beer PEF footnote17
    limiting counterevidence. No source typical quantity or nutritional substitution adopted.'
  site_collection_requirements:
  - Actual recipe and cereal adjunct origin/share; no assumed barley percent.
  - Actual supplier joint-process physical ledger and compatible grain inherited burden once; no Beer PEF zero-export inference.
  - Actual press and soluble carryover state; independent water/dry matter; lot-specific receiving specification and feed-quality
    evidence.
  - Actual providers, native utility hard faces, quantities, stocks, original Qc and service/return history.
  dataset_hold_conditions:
  - Actual wet brewing-grain core identity or single-feed receiving terminal mismatch.
  - Missing material upstream joint-process burden or incompatible uncorrected zero-export interface.
  - Unsupported shared-burden allocation or unresolved material/water/dry-matter/species closure.
  approval_limits: The scoped CPC mapping is accepted. Independent scientific approval, translation review and publication remain pending. Study qualification requires the listed evidence.
