          description: "Conditional discarded article of one actual whole HDPE bin with documented fittings/composition, excluding the grain contents; the queried recycled-PE/PP container route is not evidence for every virgin or unknown actual bin. Maintain this article separately: opening empty/attached WIP/FG/reusable stocks plus new purchases and external returns received equal all closing stocks plus attached gross-shipment outflow, external returns sent and waste. Internal reuse cancels; do not repurchase a returning article, add it to wet-grain Q or call it automatic coproduct. Weigh it or verify the actual same-article count-to-mass bridge; no standard article mass or trip count. This card records only its named direction and state."
          amount:
            expression: "Use the single section 8 normalization result for this atomic exchange; physical g_i and linked environmental n_i are non-additive; keep raw records and make no further division."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_packaging
              source_ids:
                - kw-brewers-grains-2026
                - ba-solid-2024
                - ilcd-2010-allocation
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following hierarchy applies only where the study is attributional and allocation is appropriate. These conditions bind every rule below; physical gross inventories are never allocation shares."
    source_ids: []
  - rule_id: a_framework
    applies_to: "multifunctional upstream and foreground"
    rule: "This is attributional accounting where allocation is appropriate after the study-goal/framework decision; do not treat ILCD allocation guidance as a consequential substitution waiver. First independently meter dedicated grain recovery/pressing/delivery and subdivide common operations, including virtual subdivision where physically supported. Grain-exclusive treatment belongs to grain, never zero by a beer convention."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_causality
    applies_to: "remaining genuinely joint exchanges"
    rule: "Identify determining physical causality separately for each environmental exchange and co-function at the actual common process/gate. A mass, dry matter, energy or time property is not causal merely because measurable. Preserve actual constituent embodiment, water origin and service function; record reasoning and independent measurements, not a single arbitrary allocation key."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_residual
    applies_to: "unresolved common environmental burden"
    rule: "Only a genuine residual after subdivision/causality uses contemporaneous actual-state common-gate market values, with quantities, prices, period, units and sensitivity; adjust downstream conditioning/transport from prices only with evidence to return to that gate. No fixed share. Allocation changes environmental burden A, never physical gross V, actual waste, moisture, flow quantities or the wet Q denominator."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: a_beer_pef
    applies_to: "upstream brewery provider"
    rule: "Beer PEFCR Table21 and footnote17 apply its no-allocation-to-feed convention only to that beer study and explicitly do not authorise zero environmental impact for grain leaving the brewery. Require the actual supplier method and already allocated process/gate and reconcile it to this grain attributional method; an unresolved interface holds that dataset. Never extend a verified upstream convention to grain-specific pressing or delivery, or award zero whole-life burden. Annex4.2 is old sensitivity evidence with assumed beer dry matter and ration-specific substitutes, not transferable shares or credits."
    source_ids:
      - brewers-europe-beer-pefcr-2025
      - ilcd-2010-allocation
  - rule_id: a_status
    applies_to: "products wastes and services"
    rule: "Product/Waste classification uses actual specification, receiving use, legal/disposal state and the supplier method; low price, the word dregs, a waste taxonomy or a feed marketing claim alone settles neither burden nor nutritional function. No automatic avoided-feed, recovered-water, heat or recycling credit; separately model any authorised scenario without altering the primary physical inventory."
    source_ids:
      - kw-brewers-grains-2026
      - ba-solid-2024
      - ilcd-2010-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_upstream
      process_id: "grain_recovery"
      flow_role: "actual supplier handoff"
      record_type: "supplier production and burden record"
      raw_fields: "brewery; lot; actual malt source; each cereal adjunct species and quantity; milling; mash water; wort and grain wet mass; independent dry matter; liquor and impurities; upstream losses; opening and closing WIP; original Qc; allocation method and gate; exchange-specific inherited vector; actual provider"
      collection_method: "Reconcile the complete real joint wort/grain process and supplier physical balance independently, not from a beer output factor. Convert a supplier per-unit burden back to the actual received lot vector once. Document the actual method and its compatibility; preserve failures and unknowns. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg; native burden units"
      frequency: "each received batch and supplier reconciliation"
      temporal_coverage: "declared H plus all original upstream cohorts"
      site_scope: "actual brewery separation handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier original records; scales; recipe; allocation worksheet; mass and vector closure"
    - protocol_id: cp_mass
      process_id: "grain_recovery"
      flow_role: "physical wet material and transfers"
      record_type: "scales stock and separation log"
      raw_fields: "lot; gate; incoming and outgoing gross wet mass; water and dry matter tests; press state; soluble and suspended solids; raw and WIP stocks; genuine new F; paired internal transfer ids; return; waste destination; event owner; original Qc"
      collection_method: "Independently weigh every whole physical stream at matching gates; sample water/dry matter and actual recipe/foreign matter. Reconcile collection, pressing and screening without fitting two unknown streams to one residual. Preserve all failed and idle events. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg"
      frequency: "each batch movement and stock close"
      temporal_coverage: "same H and all affected cohorts"
      site_scope: "actual recovery and rework gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scales; matched transfer tickets; independent assays; balance residual with uncertainty"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "first qualified wet output Q"
      record_type: "quality-release registry and laboratory report"
      raw_fields: "lot; net wet mass; tare; dry matter; moisture; species and adjunct trace; soluble carryover; pressing; foreign matter; actual feed specification; tests; receiver/use; release time and unique first-release id; qualified closing FG; failed mass; samples; prior release and rework flags; storage temperature time and hygiene"
      collection_method: "Weigh same-state net product on calibrated scales and sample with stated analytical methods. Match first acceptable feed-quality release to the same lot and named use; retain failures, samples, pending stock and old releases separately. No site feed certification is inferred from a source leaflet. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg"
      frequency: "each sampling and first release"
      temporal_coverage: "same H and original release history"
      site_scope: "actual first feed-quality release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; assay method; release approval; receiving specification; unique lot registry"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "original-cohort stock and supply services"
      record_type: "custody shipment return and service ledger"
      raw_fields: "original Qc; opening FG and inherited vector; internal Q receipt; closing FG; gross shipment; customer returns; original delivery reversal; real rework; new water material and energy F; spoilage; samples; actual species; service owner; H"
      collection_method: "Trace every actual storage, handling and bulk supply event to its original release cohort, including historical opening FG. Weigh actual returns and losses and collect true incremental rework inputs; preserve original burden/reversal. Storage or retesting does not manufacture grain. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg; native service units"
      frequency: "each movement service and stock close"
      temporal_coverage: "H plus original cohort history"
      site_scope: "actual bins and loading custody gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge tickets; original release; return/reversal proof; service meters; stock ledger"
    - protocol_id: cp_utilities
      process_id: "support"
      flow_role: "each actual water electrical fuel and carrier exchange"
      record_type: "meter fuel invoice and heat-carrier log"
      raw_fields: "stage and cohort; meter start/end; actual energy or water; kWh; fuel mass; actual formulation carbon sulfur LHV; gas composition pressure temperature; integrated volume or rate and interval; independently measured substance/state density; steam mass dryness pressure temperature enthalpy; hot-water supply and return; provider water/heat convention; condensate return; idle and Q0 load; original Qc"
      collection_method: "Collect raw unit-specific meters and actual supply documents. Integrate only true rates; distinguish integrated volumes. Independently measure conversion inputs and allocate shared services only after subdivision and causal review; record whole carrier supply/return before heat calculation. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg; kWh; MJ; m3"
      frequency: "each metered interval and operating event"
      temporal_coverage: "same H including nonproducing periods"
      site_scope: "each actual meter and provider boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; meter map; invoices; density/enthalpy evidence; same-period allocation data"
    - protocol_id: cp_liquid
      process_id: "support"
      flow_role: "each separate wort liquor wastewater outlet"
      record_type: "liquid meter sampling and treatment transfer"
      raw_fields: "origin gate; actual receiver and status; volume; wet mass; independent density; water fraction; extract; dry matter; dissolved and suspended solids; measured species; pH; COD TOC total nitrogen indicator basis; treatment owner; matched return endpoints"
      collection_method: "Independently meter and analyse every real liquid split and its actual accepted-use/treatment gate. Indicators characterise the whole stream and are not additive molecular masses. Treatment is represented by its real owner once; main-line return requires a paired receipt. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg; m3; actual assay units"
      frequency: "each split batch and representative sample"
      temporal_coverage: "same batch H and service cohort"
      site_scope: "actual recovery cleaning and treatment gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling method; liquid calibration; independent solids/water results; recipient acceptance"
    - protocol_id: cp_maintenance
      process_id: "support"
      flow_role: "each whole chemical lubricant replacement and waste"
      record_type: "purchase issue repair and removal records"
      raw_fields: "specific article/substance; whole supplied formulation; active fraction as assay; supplier; concentration; stock opening closing; new F; dilution water energy; leaks; removed part; drained oil; actual waste handler; contact-control evidence; affected stage and Qc"
      collection_method: "Reconcile every actual complete purchase, issue, repair and removed object. Do not buy formulation components again; in-house preparation measures each genuine purchase and loss. Failed or unauthorized work still appears in raw ledgers. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg"
      frequency: "each receipt repair and stock close"
      temporal_coverage: "same H and affected cohorts"
      site_scope: "actual equipment cleaning and repair boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier formulation; scale; issue ledger; repair records; waste receipt"
    - protocol_id: cp_species
      process_id: "support"
      flow_role: "each actual environmental species and particulate"
      record_type: "species-specific measurement and event balance"
      raw_fields: "actual chemical species or explicit particulate mixture; origin; fossil/biogenic carbon; medium; concentration; measured integrated gas/liquid volume; rate if actually rate; time; pressure temperature moisture; independent density; gas generation capture return and release; reaction/water evidence; retained C N S; uncertainty"
      collection_method: "Use representative species measurements or a validated event-specific mass/element method with independently measured inputs. Avoid applying time twice to an integrated volume. Distinguish collected waste from escaped environmental mass and measured total indicators from individual species. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg; actual concentration and flow units"
      frequency: "each actual emitting event and representative interval"
      temporal_coverage: "same H including failures Q0 and services"
      site_scope: "actual emitting operation and final medium"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "instrument calibration; sampling; fuel/element closure; species split; origin attribution"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "each actual article custody"
      record_type: "article stock issue shipment and return ledger"
      raw_fields: "article id and composition; actual provider; verified same-article mass; opening empty; opening attached WIP/FG; opening reusable; new purchase; external returns received; all closing states; gross-shipment outflow; external returns sent; waste; internal reuse; original Qc"
      collection_method: "Independently weigh each actual protective sheet/bin and separate fittings when separately supplied; a verified same-article count/length bridge is allowed. Preserve all empty/attached/reusable states and actual external transfers; internal reuse cancels. Aggregation semantics: collect undivided raw quantities and inherited vectors; section8 normalize_once computes the sole final result and aggregation only references it."
      unit: "kg"
      frequency: "each article movement and stock close"
      temporal_coverage: "all production and original-cohort service periods"
      site_scope: "actual bulk-load protective article custody"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier material specification; weighing; stock register; gross shipment and return tickets"
  calculation_rules:
    - id: release_total
      applies_to: "released_wet_grain"
      rule: "Q = sum(q_lot) over unique first feed-quality releases in H, measured net wet mass at the same state; include qualified closing FG once. Exclude opening already-released FG, repeat inspections, returns, internal custody and redelivery from new Q."
      inputs:
        - q_lot
        - "unique first-release registry"
        - cp_release
      output: "Q"
      source_ids:
        - kw-brewers-grains-2026
    - id: wet_dry_bridge
      applies_to: "raw_wet_grain; grain_to_release; released_wet_grain; press_liquor"
      rule: "For independently measured wet-basis water fraction w, dry mass = wet mass times (1-w). Independently test dry matter and soluble/suspended material at the same gate; reconcile uncertainty rather than solve multiple unknowns with one residual. Whole wet material is primary and component views do not add physical exchanges."
      inputs:
        - "wet mass"
        - w
        - "independent dry matter"
        - "actual sample state"
        - cp_mass
        - cp_liquid
      output: "non-additive dry and water bridge"
      source_ids:
        - kw-brewers-grains-2026
        - ponndorf-wet-conveyors
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw observations to the named row unit before allocation: kWh times 3.6 = MJ; measured mass or independently established substance/state density times measured volume gives kg. Integrate actual rates once; never multiply an integrated volume by time. Whole purchased formulation is counted once; assay components are subledgers."
      inputs:
        - "raw meter/scale observations"
        - "actual conversion evidence"
        - cp_utilities
        - cp_species
      output: "raw V_i in the declared native unit"
      source_ids:
        - ilcd-2010-allocation
    - id: upstream_handoff
      applies_to: "raw_wet_grain"
      rule: "Preserve the supplier whole joint-process gross physical ledger and original Qc; convert supplied normalized environmental data to the actual received lot vector exactly once, retaining its method/gate and prior allocation. Require a compatible attributed grain vector; do not apply another joint-process share to an already allocated vector or repurchase its embodied malt/water/energy."
      inputs:
        - "supplier raw balance"
        - "original Qc"
        - "received mass"
        - "source method/gate"
        - "inherited vectors"
        - cp_upstream
      output: "received lot inherited vector and separate supplier gross audit"
      source_ids:
        - ilcd-2010-allocation
        - brewers-europe-beer-pefcr-2025
    - id: physical_manufacture
      applies_to: "grain_recovery; release; support"
      rule: "For each actual mass gate: opening raw/WIP + genuine new external F + incoming transfers + actual environmental uptake = closing raw/WIP + first-release Q + gross returned wort/external Products + gross waste + actual elementary mass. Cancel matched internal transfers/rework only when combining gates. Energy MJ is not mass. Check total wet mass, independently measured water/dry matter and relevant actual C/N/S and species without shrinking gross V by any burden share."
      inputs:
        - "raw/WIP stocks"
        - F
        - "paired transfers"
        - Q
        - "independent streams and species"
        - cp_mass
      output: "unallocated manufacturing physical closure"
      source_ids:
        - ba-solid-2024
        - ponndorf-wet-conveyors
        - ilcd-2010-allocation
    - id: inherited_vectors
      applies_to: "all inventory rows"
      rule: "For each environmental exchange, retain opening WIP inherited A plus real new converted and attributed load minus closing WIP inherited A, reconciling every real coproduct/waste/destination vector. Dedicated burdens remain direct; only genuine remaining joint burdens follow the section7 hierarchy. Failed/start-stop/idle/cleanup/rework/Q0 loads remain with actual cohorts. Physical stocks and A are independent ledgers."
      inputs:
        - "opening/closing inherited A"
        - "actual new loads"
        - "allocation evidence"
        - "all destination vectors"
      output: "attributable A_i with complete history"
      source_ids:
        - ilcd-2010-allocation
    - id: physical_fg
      applies_to: "fg_service"
      rule: "Opening FG + internal first-release Q + gross actual customer returns + true new repair/rework material or water F + actual uptake = closing FG + gross physical dispatch + other external returns sent + service wastes + actual service environmental mass. Preserve historical burden and original delivery reversal; retest adds no mass or Q."
      inputs:
        - "FG stocks"
        - "internal Q"
        - "gross returns/dispatch"
        - "true new F"
        - "losses/species"
        - "original delivery"
        - cp_fg
      output: "unallocated FG custody physical closure"
      source_ids:
        - kw-brewers-grains-2026
        - ilcd-2010-allocation
    - id: combined_gate
      applies_to: "grain_recovery; release; fg_service; support"
      rule: "Add manufacturing and FG physical gates and cancel identical internal Q and all other matched internal endpoints once. Qualified closing FG remains on the stock side and is not added again to production. Preserve all gross water, wet grain, waste, replacements, carrier returns and real species regardless of economic allocation, net sales or burden ownership."
      inputs:
        - "manufacturing closure"
        - "FG closure"
        - "matched transfer ids"
      output: "combined gross physical closure"
      source_ids:
        - ilcd-2010-allocation
    - id: heat_carriers
      applies_to: "steam_supply; steam_condensate_return; hot_water_supply; heat_water_return"
      rule: "Compute actual net delivered heat from measured carrier mass and supply/return enthalpy at the documented provider boundary, including real carrier losses/make-up once under its water-energy convention. Carrier mass, its water and MJ are non-additive views. No assumed saturated state, return fraction, boiler efficiency or boiler fuel."
      inputs:
        - "supply/return mass and state"
        - "enthalpy evidence"
        - "provider convention"
        - cp_utilities
      output: "net heat plus separate carrier mass closure"
      source_ids:
        - ilcd-2010-allocation
    - id: duplicate_guard
      applies_to: "all inventory rows"
      rule: "F denotes a genuinely new event. X removes only a proved duplicate representation of that same event on the same side of the same account. New rework/repair water, material, energy and real replacements are F and cannot be deducted as X. Whole wet material and components have one principal account with non-additive bridges."
      inputs:
        - "event identity"
        - "same-side duplication proof"
        - "actual new receipt"
      output: "deduplicated raw ledgers"
      source_ids:
        - ilcd-2010-allocation
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For positive actual Q, the sole normalization is g_i = V_i / Q for physical exchange quantity and n_i = A_i / Q for the separate linked environmental vector. V_i is actual gross physical quantity and is never multiplied by burden shares; form converted/allocated/inherited A_i first. Original-cohort services use their original Qc in this same operation; supplier gross audits keep their own Qc. Cards and aggregation reuse the one result without further division; H is not a divisor. Q0 retains raw V and A with ownership but yields no unit result."
      inputs:
        - V_i
        - A_i
        - Q
        - "original Qc"
      output: "g_i; n_i"
      source_ids:
        - ilcd-2010-allocation
    - id: package_balance
      applies_to: "packaging"
      rule: "For each article separately: opening empty + opening attached WIP/FG + opening reusable + new purchases + external returns received = all closing stocks + attached gross-shipment outflow + external returns sent + waste. Internal reuse cancels and never constitutes repurchase, wet-grain Q or automatic coproduct. Separate article physical mass from attributed manufacture/washing/service burden and use original cohort Q/Qc once."
      inputs:
        - "individual article stocks and gross transfers"
        - "actual unit bridge"
        - cp_packaging
      output: "individual article closure and separate burden ledger"
      source_ids:
        - kw-brewers-grains-2026
        - ilcd-2010-allocation
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all processes"
      requirement: "Verify actual brewing malt-barley/adjunct origin, separation route, press state, whole wet residue and single feed-use specification. Source synthesis does not establish same-factory quantities, every recipe percentage or actual feed certification."
      evidence: "supplier trace; recipe; process map; lot acceptance"
    - id: dq_native
      applies_to: "UUID-bearing rows"
      requirement: "Audit every full native restriction and exact reference-property/unit chain in consumable descriptions. No generic by-product family certifies this narrower terminal. Require matching physical identity and provider fit before selecting a UUID."
      evidence: "matching original identity evidence; exact support rows"
    - id: dq_measured
      applies_to: "all physical gates"
      requirement: "Use independent calibrated wet mass, dry matter/moisture and real liquid/solid/species measurements with uncertainty; no source typical composition, shelf life, density, yield or allocation share is a site default."
      evidence: "calibration; sampling; independent analyses; residual review"
    - id: dq_history
      applies_to: "all ledgers"
      requirement: "Keep physical stocks and inherited environmental vectors separately by batch and original Qc. Reconcile upstream handoff, raw/WIP, first-release registry, FG/returns/rework, Q0 and individual packaging without dropping actual flows."
      evidence: "raw event ledger; burden vectors; gross balances"
    - id: dq_gap
      applies_to: "all dataset uses"
      requirement: "Ordinary actual provider, quantity or auxiliary UUID gaps require collection and disclosure, not automatically draft core methodology. A real core wet-grain identity/terminal failure, missing joint upstream burden, unsupported allocation or unresolved material closure holds the affected dataset; no missing value is zero or covered."
      evidence: "explicit gap register; supplier and physical evidence"
    - id: dq_source
      applies_to: "all source evidence"
      requirement: "Industry originals constrain actual product/route alternatives only; ILCD supports conditional attributional method; Beer PEF footnote17 is a limiting counterexample. Source applicability and the intended study framework must be documented independently."
      evidence: "source-specific applicability; original pages; review metadata"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Failure of actual core identity, upstream burden or physical closure holds the affected dataset; an auxiliary identity/provider gap must remain explicit without deleting real exchanges. Check all following rules with their complete source context."
    source_ids: []
  - rule_id: v_terminal
    applies_to: "released_wet_grain"
    rule: "Require one whole wet brewing grain from actual malt-barley wort separation, with adjunct trace, pressing state, no yeast/trub/hop blending or dry/pellet/preserved/ensiled identity, and actual single cattle-feed receiving specification. Never silently substitute DDGS, bran, starch residue, wort or beer."
    source_ids:
      - kw-brewers-grains-2026
      - ba-solid-2024
      - ponndorf-wet-conveyors
      - vettertec-brewery
      - un-cpc3-2025
  - rule_id: v_handoff
    applies_to: "raw_wet_grain"
    rule: "Verify the actual complete upstream joint process and grain-bound burden vector once, including supplier system/gate and original Qc. A Beer PEF no-feed-allocation record alone is insufficient for exported grain; unresolved interface remains a dataset hold, never zero."
    source_ids:
      - ilcd-2010-allocation
      - brewers-europe-beer-pefcr-2025
  - rule_id: v_reference
    applies_to: "released_wet_grain; fg_service"
    rule: "Explicit reference link selects released_wet_grain only. Q counts first conforming net wet release including qualified closing FG once; original released opening FG, returns and redelivery retain original Qc and burden without manufacturing new Q."
    source_ids:
      - kw-brewers-grains-2026
      - ilcd-2010-allocation
  - rule_id: v_balance
    applies_to: "all physical gates"
    rule: "Independently reconcile upstream, manufacturing, FG and combined gross physical gates plus each packaging article. Cancel only measured matched internal endpoints including Q; never economic-scale gross V or double-add closing FG. Water/dry matter/elements and real species need independent evidence, not multiple-unknown residual fitting."
    source_ids:
      - ponndorf-wet-conveyors
      - ilcd-2010-allocation
  - rule_id: v_once
    applies_to: "all inventory rows"
    rule: "Check raw collection is undivided, actual units/rates converted once and legitimate attribution/inherited A formed before the sole normalize_once operation. Physical V/Q and linked A/Q are non-additive; use original Qc for original services, never another division by H. Q0 retains real events and no unit result."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: v_atomic
    applies_to: "all inventory rows"
    rule: "Require every real atomic ingredient, whole formulation, utility, carrier return, package, replacement, waste and environmental species with complete descriptions and source ids. Missing auxiliary UUID is disclosed without deleting the flow; native hard mismatches cannot be waived by name."
    source_ids:
      - ba-solid-2024
      - ilcd-2010-allocation
  - rule_id: v_allocation
    applies_to: "joint burden gates"
    rule: "Check dedicated/virtual subdivision first, exchange-specific determining physical causality second and only genuine residual contemporaneous actual-state common-gate market values; reconcile complete burden vectors and sensitivity. No automatic physical/economic share or feed substitution credit."
    source_ids:
      - ilcd-2010-allocation
      - brewers-europe-beer-pefcr-2025
  - rule_id: v_actuality
    applies_to: "all processes"
    rule: "Unlisted or unauthorised but real operations, failure/idle/cleanup/rework, spoiled stock and each actual environmental release remain in physical/burden records even if terminal qualification fails. Real treatment owner and final medium prevent duplication; no imaginary steam boiler, dryer exhaust or molecular conversion from aggregate indicators."
    source_ids:
      - ba-solid-2024
      - ponndorf-wet-conveyors
      - ilcd-2010-allocation
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "One declared whole wet malt-barley brewing spent-grain single feed ingredient with complete upstream and recovery burden interface"
  allowed_use: "Compatible actual recipe, wet/press state, feed receiving use and measured first-release basis; separate original-cohort supply services"
  excluded_use: "Whole CPC39160 coverage; DDGS/stillage; yeast blends; compound feed; dry/pellet/ensiled material; 1kg wet to 1kg dry/protein/energy equivalence; zero-burden or substitution defaults"
  required_metadata: "All required qualifiers; actual supplier method/gate; Q and original Qc/H; raw/WIP/FG stocks and inherited vectors; each package; each real treatment owner; native restrictions"
  required_quality_disclosure: "Primary-source synthesis scope; independent measurements; provider and UUID gaps; upstream allocation compatibility; failed/Q0/return history; uncertainty and unresolved holds"
  update_trigger: "Actual recipe or adjunct change; separation/pressing/preservation or feed-use change; upstream method/gate; stock ownership; provider/utility or packaging change"
data_sources:
  - id: "kw-brewers-grains-2026"
    type: "handbook"
    reference: "KW Alternative Feeds. Brewers’ Grains, product datasheet 16 January 2026. https://kwfeeds.co.uk/wp-content/uploads/2026/01/Brewers-Grains-16.01.26.pdf"
    used_for: "Complete four-page original: malted-barley starch extraction residue; moist single feed and bulk-tipped supply; actual feed uses; quality/disclaimer and fresh versus clamped/blended alternatives. Typical analysis, density, feeding rates and storage durations are source-specific, not adopted defaults."
  - id: "ba-solid-2024"
    type: "handbook"
    reference: "Brewers Association. Solid Waste Management Manual, 2024, section3.3 pp15–17 and brewery cases pp36–37. https://cdn.brewersassociation.org/wp-content/uploads/2024/12/12094233/BAtech24-Sustainability-Solid-Waste-Management-Manual.pdf"
    used_for: "Mashing/lautering grain origin, separate yeast/filter media/trub, collection and actual feed reuse; adjacent alternative food/compost/fuel outlets. Industry guidance is not feed certification, recipe or LCA allocation."
  - id: "ponndorf-wet-conveyors"
    type: "handbook"
    reference: "Ponndorf Anlagenbau. Conveyors for wet spent grains – also with attached hopper, complete manufacturer page, accessed 2026-11-20. https://ponndorf-gmbh.de/plants/conveyors-silos/conveyors-for-wet-spent-grains-also-with-attached-hopper/?lang=en"
    used_for: "Actual lauter-tub/mash-filter to silo conveying, whole wet grain, drainage/cleaning and optional mechanical pressing sieve. Equipment capacities are not process quantities or mandatory stages."
  - id: "vettertec-brewery"
    type: "handbook"
    reference: "VetterTec. Brewery Industries, complete two-page manufacturer brochure with 2015/2016 artwork labels. https://www.vettertec.com/files/Medien/Content-Done/Broschueren/Technologies/Brewery%20Equipment/vt_BreweryIndustries.pdf"
    used_for: "Collection/conveying/dewatering/silo/loading route; explicit dry-grain, mixed-yeast drying and pelleting counterexamples. No actual dryer, steam supply, protein composition or energy quantity is assumed for this wet terminal."
  - id: "ilcd-2010-allocation"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for LCA — Detailed guidance, first edition March2010, sections7.9.1–7.9.3 pp255–268 (PDF275–288). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Conditional attributional framework, subdivision/virtual subdivision, exchange-specific determining physical causality and only residual market value at actual state/common exit gate; no grain-specific default or consequential substitution waiver."
  - id: "brewers-europe-beer-pefcr-2025"
    type: "standard"
    reference: "The Brewers of Europe. Revised PEFCR for Beer, 2025 revised draft approved by review panel, section5.7 Table21 footnote17 p55 and Annex4.2 pp93–98. https://brewersofeurope.eu/wp-content/uploads/2025/05/FINAL-Revised-draft-updated-PEFCR-as-approved-by-review-panel.pdf"
    used_for: "Limiting counterevidence: beer-study no-feed-allocation cannot be exported as grain zero environmental burden; historical sensitivity has assumed beer dry matter and Dutch dairy-ration substitution. No numeric allocation/substitution values adopted."
  - id: "un-cpc3-2025"
    type: "standard"
    reference: "United Nations Statistics Division. CPC Version 3.0, 30 June 2025, normalized structure and complete Explanatory Notes, PDF pp199–200: 39120/39130/39141/39149/39150/39160/39170. The 39160 entry has a heading only, without additional inclusions or exclusions. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification identity and adjacent boundaries only; broad leaf does not establish one canonical method, legal waste status, exact mapping or zero burden."
