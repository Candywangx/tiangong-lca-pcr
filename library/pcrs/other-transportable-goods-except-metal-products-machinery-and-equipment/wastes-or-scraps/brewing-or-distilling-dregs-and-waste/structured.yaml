system_boundary:
  rules:
    - rule_id: b_upstream
      applies_to: "raw_wet_grain"
      rule: "Require the actual supplier joint malt/adjunct supply, milling, mashing and wort/grain separation interface and inherited burden once. Declare each genuine input and output, water/dry matter, losses and stocks, allocation gate and supplier original Qc. No repeated parent-grain purchase or beer-line recreation. Missing material upstream burden is a dataset hold, not a free residue."
