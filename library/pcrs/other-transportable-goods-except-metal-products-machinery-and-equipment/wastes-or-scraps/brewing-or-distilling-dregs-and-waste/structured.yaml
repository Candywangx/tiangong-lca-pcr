        - kw-brewers-grains-2026
        - ba-solid-2024
        - ponndorf-wet-conveyors
        - vettertec-brewery
    - rule_id: b_internal
      applies_to: "liquid and grain transfers"
      rule: "Cancel only matched internal transfers at both measured endpoints, retaining upstream burden once. Return wort/liquor is not both fresh water and wastewater. Record real press liquor and recovered wort separately with independent mass/water/dry matter/solubles; actual external Products, Waste transfers and environment outlets have distinct owners/gates."
      source_ids:
        - ponndorf-wet-conveyors
        - vettertec-brewery
        - ilcd-2010-allocation
    - rule_id: b_release
      applies_to: "released_wet_grain; fg_service"
      rule: "First-quality-release Q includes first-qualified closing FG once. After release retain storage/loading/packaging service by original Qc, including historical opening FG, actual customer returns and original delivery reversal, true incremental rework F and inherited vectors. Internal Q cancels in the combined physical gate; do not add closing FG again as production."
      source_ids:
        - kw-brewers-grains-2026
        - ilcd-2010-allocation
    - rule_id: b_atomic
      applies_to: "all inventory rows"
      rule: "Keep every actually present exchange atomic; add unlisted real inputs, whole supplied formulations, each fuel/chemical/package/replacement/waste and real environmental species individually. Conditional absence needs operating evidence, never a zero default. Wastewater and dust remain physical mixtures, not invented molecules; COD/TOC/total N/NOx are non-additive indicators unless a real species split is measured."
      source_ids:
        - ba-solid-2024
        - ilcd-2010-allocation
    - rule_id: b_native
      applies_to: "UUID-bearing rows"
      rule: "Use complete native identity, route, form, composition, CAS where present, geography, supply mix, media, Product/Waste type and exact reference-property/unit chain. The semantic wet-grain candidate must meet all reference qualifiers; a generic by-product name does not establish identity. Actual provider/burden compatibility remains separate from flow identity."
