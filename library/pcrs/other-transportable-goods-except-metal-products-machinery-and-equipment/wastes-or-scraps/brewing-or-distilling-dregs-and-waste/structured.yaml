        - ba-solid-2024
        - ilcd-2010-allocation
        - brewers-europe-beer-pefcr-2025
    - rule_id: b_operations
      applies_to: "all processes"
      rule: "Include all real collection, mechanical pressing, screening, conveyors, storage, scales, sampling, cleaning, repairs, utilities, failed/start-stop/idle/Q0/rework and unauthorized operations. A declared narrow qualification never deletes an actual operation or flow. Actual drying, preservation or mixing is disclosed and prevents using the narrow reference identity until resolved."
