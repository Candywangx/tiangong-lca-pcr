product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.wastes-from-chemical-or-allied-industries"
  classification_refs: "CPC 3.0 39950; narrower; current accepted association and decision: classifications/mappings/cpc-3.0-to-pcr.yaml and its referenced ADR; no whole-leaf or scientific/translation approval implied"
  covered_products: "One unneutralised inorganic strong-acid hydrolysis mother-liquor stream from the declared ilmenite route for acid reconcentration feed"
  excluded_products: "Exclude sewage sludge, municipal and clinical/pharmaceutical waste, organic-solvent waste, oil-rich fluids, metal pickling liquor, iron/steel slag, metal/precious-metal recovery residues, copperas or gypsum as the reference, pigment/hydrate products, slag-route or mixed-source liquors, post-wash weak effluent, neutralised sludges, regenerated/concentrated acid and historic mixed storage dumps. No universal acid strength, composition, density, yield, reaction emission, danger classification, legal threshold, receiver grade or recovery credit is supplied."
  representative_product: "Unneutralised hydrolysis mother liquor from ilmenite sulphate titanium dioxide manufacture"
  production_route: "Whole source feeds → grinding/digestion → iron reduction → clarification/copperas crystallisation → hydrolysis → first filtration → actual cooling/necessary polishing → first reconcentration-feed quality release"
  market_state: "Whole as-released acidic liquid with measured dissolved/suspended phases and thermal state; signed value/fee, ownership and legal status declared independently"
functional_unit:
  what: "Supply one specified whole mother-liquor lot for the named reconcentration feed function"
  how_much: "1 kg net whole liquid at first quality release; use measured Q for the complete new-production cohort"
  how_well: "Receiver-confirmed suitability at the actual inlet based on measured free acid, salts, suspended solids, water and temperature; no default acceptance threshold"
  how_long_or_cycle: "One declared source production/release cohort and period; later service retains original cohort Q_c"
  reference_flow_link: "released_acid"
system_boundary:
  rules:
    - rule_id: b_chain
      applies_to: "source_formation; acid_release"
      rule: "Include whole source receipts and their upstream burden, preparation/grinding, digestion, iron reduction, clarification and actual aid use, copperas crystallisation, liquor concentration where actually before hydrolysis, hydrate precipitation, initial filtration, actual mother-liquor cooling/necessary polishing, sampling, storage, handling and delivery to the specified regeneration-feed inlet. This is a qualitative technical synthesis of one route, not a measured same-factory recipe. Supplied dry ilmenite, imported steam and external waste treatment define this configuration. Wet-ore combustion drying, slag blends, on-site boilers, on-site neutralisation, calcination/finishing and acid reconcentration are not hidden inside it; actual such operations require explicit additional scope and atomic records."
      source_ids:
        - jrc-lvic-s-2007
    - rule_id: b_reference_gate
      applies_to: "released_acid"
      rule: "Q is the summed net whole-liquid mass of uniquely identified newly formed mother-liquor lots at their first documented quality release to a named reconcentration-feed specification. State the actual inlet/tank and receiver; qualification is not an invented market grade or legal clearance. Exclude packaging, circulating inventory, off-spec/sampled losses, historical opening FG, reinspection, re-delivery and already released returns. A first-release lot still in closing FG is already in Q. Do not add closing FG again as new output. A merely planned receiver with no actual feed-compatibility evidence leaves the concrete package incomplete."
      source_ids:
        - jrc-lvic-s-2007
    - rule_id: b_history
      applies_to: "all inventory rows"
      rule: "Retain opening/closing raw stock, WIP and FG by physical lot and every exchange-specific inherited burden vector, original supplier included scope and parent allocation decision. Carry original forming inputs into residual/hydrate/copperas destinations once. Real internal source/release transfers and own seed/acid/water reuse cancel in the combined boundary without erasing their history; external returned regenerated acid needs its real prior-cohort/provider boundary and measured new service, not a new fresh-acid purchase. No waste label, ownership transfer or missing assay implies zero inherited load."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_physical_gates
      applies_to: "source_formation; acid_release"
      rule: "Before allocation, close each measured physical gate: source opening raw stock and WIP plus whole external feeds including direct steam and any actual reactant-gas receipts equals closing raw stock and WIP plus gross mother-liquor transfer plus hydrate/copperas/residue/effluent and actual species losses. The release gate uses opening unreleased liquid plus the one internal mother transfer plus actual added liquid equals closing unreleased liquid plus Q plus rejected/sampled/cleaning losses. The FG/service gate uses opening released FG plus Q plus genuine returned original lots equals closing FG plus gross outward dispatch plus external returns-out plus FG wastes. Combining gates cancels the internal transfer and the release-to-FG Q; it never counts Q and closing FG as two final production outputs. Preserve separate physical mass and relevant Fe/Ti/S and water/phase evidence, without allocation scaling of gross quantities. Reaction/phase-water transformation stays within its independently evidenced subledger and is never added as new mass to the whole physical gate."
      source_ids:
        - jrc-lvic-s-2007
        - jrc-ilcd-2010
    - rule_id: b_composition
      applies_to: "all material rows"
      rule: "Measure whole solutions/formulations once at the actual supply state. Free acidity is not a pure-H2SO4 purchase; dissolved iron/sulfate, water and impurity assays are non-additive subledgers. Use representative mixing/settling-aware sampling, validated matrix-specific free-acid and elemental/species tests, separate suspended solids and independent free/structural/reaction-water evidence. Do not assume all non-acid mass is water, all iron is FeSO4, or one hydrate formula. No universal reaction equation, concentration, yield, density, toxicity or permit threshold is prescribed. A balance residual cannot determine two unknown species or reaction-water terms."
      source_ids:
        - jrc-lvic-s-2007
    - rule_id: b_species
      applies_to: "emission and waste rows"
      rule: "Keep actual final H2, SO2, SO3, H2SO4, H2O and escaped particulate identities and destinations separate. Carrier-air inlet/outlet mass is recorded for the gas physical ledger and unchanged carrier mass cancels; it is not invented reaction gas. Pre-abatement gas, captured material and final release are distinct gates. Retained liquid/solid waste is not an elementary emission. COD, acidity, total SOx or total solids do not establish an individual chemical mass. Actual additional species, liquid outlets and treatment reagents require their own rows and measurements before completeness."
      source_ids:
        - jrc-lvic-s-2007
    - rule_id: b_utilities
      applies_to: "utility rows"
      rule: "Split actual utility supply by substance and gate. Preserve imported direct and indirect steam mass, thermal state and supplier water/energy convention; actual condensate and external cooling-water return are independent Product interfaces with their own quantities and enthalpy. Internal loops cancel; neither a return nor a boiler is presumed. Meter allocation covers failed batches, zero-output periods, startup/shutdown, idle, cleanup, leaks and rework; none disappear solely because Q is zero or the stream is called waste."
      source_ids:
        - jrc-lvic-s-2007
        - jrc-ilcd-2010
    - rule_id: b_atomic_receipts
      applies_to: "packaging and attached components"
      rule: "For every actual packaging/container/attached component, establish material, form, flow type, direction and an atomic measured receipt interface. Purchase cards below collect P only. The separate N_ext interfaces collect first external non-purchase receipts, including supplier-accompanied, first entrusted, borrowed or rented items. ER is only a genuine return with an earlier outward dispatch record. P, N_ext and ER are mutually exclusive; a component already paid in the whole supply price is P even without a separate invoice. Opening stock is not current receipt. Actual missing components/interfaces/quantities make that concrete package incomplete; symbols and a copied purchase UUID do not repair it."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_pack_balance
      applies_to: "each component physical gate"
      rule: "For each individual component and the same gate/period, opening empty plus attached-WIP/FG plus reusable stock + P + N_ext + ER = closing empty plus attached-WIP/FG plus reusable stock + grossS + EO + W. grossS is all actual outward physical dispatch, including attachments on failed/replacement/returned-lot movements; it is not net acid Q. EO is genuine outward return; W is actual discard. Internal warehouse/WIP/FG issues and reuse cancel. Component production/fabrication F and incorporation X may be added only for an evidenced exact non-overlapping same-side event: add F only if not already in P/N_ext and X only if not already in closing attachment or grossS; no generic OTHER plug closes a missing receipt."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_pack_burden
      applies_to: "each packaging event"
      rule: "Independently retain ownership, original component/cohort identity, each inherited exchange vector, real purchase burden, supplier already-included scope and actual incremental rental/return/cleaning/repair service. Assign each real burden once under section7. Physical non-purchase is not zero burden, and ER is not a new purchase, new Q or credit. Allocate jointly carried mother-liquid/material burdens once, not as full mixture plus full constituent partitions or several providers for the same supplied component."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_later_service
      applies_to: "released cohorts"
      rule: "After first release, preserve actual storage, packaging, handling, dispatch, original-delivery reverse movements and additional measured rework/cleaning/rental-return service in the original released cohort account. Keep original Q_c and inherited vector; measure service exposure H separately, never as a production denominator. Reinspection/re-delivery/return does not create new Q. Resolve historical FG burden and actual returned-lot provenance, even when production uses first release rather than net delivery. Service records require specific material/utility/waste interfaces; do not relabel a service as the reference Product."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_classification
      applies_to: "scope and receiver"
      rule: "The narrower CPC3.0 39950 association applies only to the specified inorganic chemical-manufacturing liquid residue supplied for acid reconcentration. UN gives a heading, not an explicit TiO2 mother-liquor example. The official CPC2.1–HS2017 relation links 3825.69 to 39950 historically; HS2022 retains the inorganic other-chemical-waste branch and separate solvent/sewage/clinical categories. This is a reasoned scope interpretation, not a current crosswalk or customs ruling. Acceptance of the classification association does not approve scientific methodology, translation or actual providers. Exclude a material supplied for metal/precious-metal recovery or manufacture of metal compounds under the chapter26 exclusion, regardless of the generating industry. If actual receiver purpose or physical classification fails this scope, stop applicability rather than filling coverage."
      source_ids:
        - un-cpc3-2025
        - un-cpc21-hs2017
        - wco-hs2022-38
        - wco-hs2022-26
    - rule_id: b_pack_interfaces
      applies_to: "each actual component interface"
      rule: "Each row below is a required concrete event interface only when that event actually occurs; it is not a surrogate purchase. Record raw measured kg before any division, event date/ID, exact material/form, counterparty, ownership, original cohort, inherited exchange vector, provider included scope and new service. P is collected by its purchase card and W by its waste card. Components already attached to incoming materials are included at their real external receipt. Add the same complete interfaces for every additional real component; a missing interface is an incomplete data package."
      source_ids:
        - jrc-ilcd-2010
