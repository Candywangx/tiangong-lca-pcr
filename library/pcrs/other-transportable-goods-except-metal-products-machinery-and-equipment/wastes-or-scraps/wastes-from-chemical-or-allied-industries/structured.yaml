allocation_rules:
  - rule_id: a_scope
    applies_to: "source_formation; acid_release"
    rule: "Use an explicitly declared attributional allocation-required study. First assign dedicated acid-transfer/testing/polishing activities directly and physically subdivide measured source operations wherever possible; then perform justified virtual subdivision. Downstream hydrate/copperas finishing is dedicated to those outputs and does not become acid conditioning."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining individual exchanges"
    rule: "For each remaining exchange identify the determining physical causal relationship: demonstrate how a change in each delivered function changes that exchange, separating product-contained atoms from process-related utilities/emissions. An Fe/Ti/S balance constrains physical fate but does not automatically allocate electricity, water or every upstream burden by one mass ratio. Retain the actual derivation, counterfactual scope and measurement evidence."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "genuinely unresolved common-process exchanges"
    rule: "Only the demonstrated residual after those steps may use justified actual contemporaneous market values of the co-functions at one common process gate in their actual wet state. Record quantities, price basis, currency, geography/period, costs included and fee/service interpretation. Do not combine future finished-pigment or recovered-acid prices with unfinished hydrate/mother liquor, choose arbitrarily between physical/economic shares, prescribe a fixed ratio or clamp a signed waste fee into zero. Nonpositive/ambiguous values require an explicit reviewed treatment of the remaining multifunctionality; until then that concrete package is incomplete."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_once
    applies_to: "all inventory and physical co-outputs"
    rule: "Allocate each upstream/current inherited exchange vector exactly once among actual functions; retain totals and closure. Whole physical gross quantities V remain separate from attributable inventory amounts A. Hydrate/copperas co-output cards retain physical diagnostics and their assigned histories: in an allocated acid dataset they are not additive avoided-product exchanges or extra full-burden providers. A joint source dataset may retain them with explicit allocation metadata; never publish both representations additively. Internal transfers cancel without a second allocation or full provider."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_no_automatic_credit
    applies_to: "residual, returns and services"
    rule: "Waste status, ownership, a non-purchase first receipt, internal reuse, true return, a gate fee or intended recovery gives no automatic zero burden, displacement credit or negative purchase. Keep original cohort loads and actual incremental service separately; any later recovery benefits belong to an explicitly scoped separate study and cannot be inserted here."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_source
      process_id: "source_formation"
      flow_role: "source inputs"
      record_type: "supplier_batch_and_meter"
      raw_fields: "lot_id; material_form; supplier; supplied_whole_mass; moisture; assay_method; mineral_phase; Ti; Fe; S; impurities; inherited_vector; included_scope"
      collection_method: "Weigh each whole input with calibrated instruments and trace actual digestion/reduction/crystallisation/hydrolysis logs; sample the actual supplied mixture and independently measured component/phase data. per reference flow; collect unnormalised raw totals, preserve histories, then refer to normalize_once without another division."
      unit: "kg"
      frequency: "each receipt and batch"
      temporal_coverage: "complete campaign including failures and Q zero"
      site_scope: "declared source site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; supplier certificate; whole-mixture trace; assay uncertainty"
    - protocol_id: cp_balance
      process_id: "source_formation"
      flow_role: "gross physical gates and inherited vector"
      record_type: "lot_stock_and_transfer"
      raw_fields: "gate_id; event_id; opening_raw; closing_raw; opening_WIP; closing_WIP; gross_V; mother_transfer_id; hydrate_mass; copperas_mass; water_phases; Fe; Ti; S; inherited_vector; allocation_decision"
      collection_method: "Match counter-events and stocks by lot; independently weigh wet output and test liquid/solid phases; retain full original and destination exchange vectors before allocation. per reference flow; keep gross V unscaled for physical_gates and assign A before the one normalize_once result."
      unit: "kg"
      frequency: "each transfer and stock cutoff"
      temporal_coverage: "same source/release period with historical bridge"
      site_scope: "source and release gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale logs; paired events; independent phase assays; vector closure"
    - protocol_id: cp_utilities_source
      process_id: "source_formation"
      flow_role: "utility input and real returns"
      record_type: "meter_and_supplier_contract"
      raw_fields: "meter_id; stage; raw_unit; raw_total; rate_interval; voltage; geography; supply_route; steam_mass; pressure; temperature; dryness; enthalpy_in; enthalpy_out; return_mass; return_state; density_method; supplier_included_scope"
      collection_method: "Read stage/parent meters and actual contracts; partition without overlapping meters. Measure direct/indirect steam and actual condensate/cooling returns independently; retain actual thermal states and supplier water-energy convention. This protocol owns only source_formation events; reconcile the other stage without overlapping its quantities. per reference flow; collect unnormalised readings, convert in raw_to_inventory, assign A and reuse normalize_once."
      unit: "kg; kWh; MJ"
      frequency: "continuous meters and campaign reconciliation"
      temporal_coverage: "full operating and nonproducing period"
      site_scope: "actual site supply gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; invoices; return contract; thermal evidence"
    - protocol_id: cp_utilities_release
      process_id: "acid_release"
      flow_role: "utility input and real returns"
      record_type: "meter_and_supplier_contract"
      raw_fields: "meter_id; stage; raw_unit; raw_total; rate_interval; voltage; geography; supply_route; steam_mass; pressure; temperature; dryness; enthalpy_in; enthalpy_out; return_mass; return_state; density_method; supplier_included_scope"
      collection_method: "Read stage/parent meters and actual contracts; partition without overlapping meters. Measure direct/indirect steam and actual condensate/cooling returns independently; retain actual thermal states and supplier water-energy convention. This protocol owns only acid_release events; reconcile the other stage without overlapping its quantities. per reference flow; collect unnormalised readings, convert in raw_to_inventory, assign A and reuse normalize_once."
      unit: "kg; kWh; MJ"
      frequency: "continuous meters and campaign reconciliation"
      temporal_coverage: "full operating and nonproducing period"
      site_scope: "actual site supply gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; invoices; return contract; thermal evidence"
    - protocol_id: cp_emissions
      process_id: "source_formation"
      flow_role: "final species emission"
      record_type: "species_stack_and_fugitive_test"
      raw_fields: "species; CAS_if_known; medium; stage; concentration; wet_dry_basis; gas_state; integrated_volume; true_rate; interval; carrier_in; carrier_out; capture_mass; aerosol_water; particle_partition; uncertainty"
      collection_method: "Measure representative final emissions including cyclic digestion peaks and reduction vents; pair concentration with actual gas state/volume and collect carrier air/capture separately. Preserve species identity and detection limits without treating nondetect as exact zero. per reference flow; raw mass/rate conversion precedes assignment, then use normalize_once once."
      unit: "kg; mg/m3; m3"
      frequency: "source-specific sampling plus full event coverage"
      temporal_coverage: "all campaigns including startup cleanup and failures"
      site_scope: "final air boundaries and separate capture gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling plan; species method; gas-state evidence; uncertainty"
    - protocol_id: cp_release
      process_id: "acid_release"
      flow_role: "reference whole liquid"
      record_type: "weighing_and_receiver_acceptance"
      raw_fields: "source_lot; cohort_id; first_release_id; release_time; receiver_inlet; net_liquid_mass; free_acid; salt_assays; suspended_solids; water; temperature; density_if_used; original_Qc; opening_FG; closing_FG; gross_dispatch; true_returns; original_delivery_reverse"
      collection_method: "Use calibrated net weighing or a traceable mass-flow total; representative homogenisation/settling-aware samples and validated free-acid/elemental/phase methods. Match receiver specification and signed feed decision to each unique first release; independently trace returned original lots. per reference flow; collect Q as unnormalised unique net first-release mass and refer only to normalize_once."
      unit: "kg"
      frequency: "each first release and stock cutoff"
      temporal_coverage: "declared release cohort and historical FG bridge"
      site_scope: "named source and receiving inlet"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; sample plan; receiver test; signed decision; FG history"
    - protocol_id: cp_waste_source
      process_id: "source_formation"
      flow_role: "specific whole waste"
      record_type: "transfer_and_treatment"
      raw_fields: "event_id; stage; lot; whole_wet_mass; material_form; free_acid; salts; solids; water; attached_substrate; destination; provider_scope; original_cohort; inherited_vector"
      collection_method: "Weigh whole individual waste and independently sample constituents; trace actual receiving treatment and partition overlapping attached liquids/solids. No untreated-transfer amount is renamed an environmental emission. This protocol owns only source_formation events; reconcile the other stage without overlapping its quantities. per reference flow; raw gross V and assigned A stay separate, then reuse normalize_once."
      unit: "kg"
      frequency: "each removal and transfer"
      temporal_coverage: "full period including cleanup failures and Q zero"
      site_scope: "specific waste transfer gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh tickets; transfer receipts; composition; treatment scope"
    - protocol_id: cp_waste_release
      process_id: "acid_release"
      flow_role: "specific whole waste"
      record_type: "transfer_and_treatment"
      raw_fields: "event_id; stage; lot; whole_wet_mass; material_form; free_acid; salts; solids; water; attached_substrate; destination; provider_scope; original_cohort; inherited_vector"
      collection_method: "Weigh whole individual waste and independently sample constituents; trace actual receiving treatment and partition overlapping attached liquids/solids. No untreated-transfer amount is renamed an environmental emission. This protocol owns only acid_release events; reconcile the other stage without overlapping its quantities. per reference flow; raw gross V and assigned A stay separate, then reuse normalize_once."
      unit: "kg"
      frequency: "each removal and transfer"
      temporal_coverage: "full period including cleanup failures and Q zero"
      site_scope: "specific waste transfer gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh tickets; transfer receipts; composition; treatment scope"
    - protocol_id: cp_pack
      process_id: "acid_release"
      flow_role: "each packaging component interface"
      record_type: "component_event_ledger"
      raw_fields: "component_material; form; type; direction; event_id; opening_empty; opening_attached_WIP_FG; opening_reusable; purchase_P; first_nonpurchase_N_ext; return_ER; closing_empty; closing_attached_WIP_FG; closing_reusable; grossS; return_out_EO; waste_W; owner; original_cohort; earlier_dispatch; inherited_vector; provider_included_scope; new_service"
      collection_method: "Weigh every actual component and event, including first supplier-accompanied/entrusted/borrowed/rented receipts. Prove price coverage and prior dispatch separately; use the explicit individual interfaces and matched component physical gate. per reference flow; keep raw component ledger before division, perform pack_ledger and reuse the one normalize_once result."
      unit: "kg"
      frequency: "each receipt dispatch return discard and stock cutoff"
      temporal_coverage: "same component gate/period plus original history"
      site_scope: "source and release packaging boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "scales; priced-scope evidence; custody/dispatch links; component ledger closure"
    - protocol_id: cp_service
      process_id: "acid_release"
      flow_role: "original cohort post-release service"
      record_type: "cohort_service_records"
      raw_fields: "original_cohort; original_Qc; inherited_vector; opening_FG; closing_FG; gross_dispatch; actual_return; original_delivery_reverse; H; actual_incremental_material; actual_electricity; actual_water; actual_waste; rental_return_scope; provider_included_scope"
      collection_method: "Trace each actual storage/handling/return/rework/cleanup/rental-return event to its original release. Create specific measured utility/material/waste interfaces for actual service events and preserve real reverse-delivery amounts, rather than repeating the production inventory. per reference flow; collect unnormalised service totals, keep original Q_c and use normalize_once once for a separate service result."
      unit: "kg; kWh; MJ; h"
      frequency: "each real service event"
      temporal_coverage: "original released cohort lifetime in declared service period"
      site_scope: "actual cohort storage and dispatch gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "cohort provenance; service meters; actual return and custody receipts"
  calculation_rules:
    - id: raw_to_inventory
      applies_to: "all inventory rows"
      rule: "Convert actual raw units and only genuine rates to unnormalised row units. Integrated liquid/gas totals are not multiplied by time again. Use independently measured same-substance/state density for volume-to-mass, native kWh-to-MJ factor 3.6 for electricity, and measured steam mass plus separate enthalpy-state evidence. Keep free-acid/salt/water assays as subledgers; no double purchase or invented reaction-water closure."
      inputs:
        - cp_source
        - cp_utilities_source
        - cp_utilities_release
        - cp_emissions
        - cp_waste_source
        - cp_waste_release
      output: "unnormalised_V"
      source_ids:
        - jrc-lvic-s-2007
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "Apply b_physical_gates to whole gross V before allocation, preserving independent Fe/Ti/S and water-phase evidence and actual carrier-gas inlet/outlet cancellation. Pair raw_mother_liquor with mother_liquor_in. Keep Q release and FG/service movement ledgers distinct, then cancel their internal interfaces in the combined physical gate."
      inputs:
        - unnormalised_V
        - cp_balance
        - cp_release
        - cp_service
      output: "physical_closure"
      source_ids:
        - jrc-lvic-s-2007
        - jrc-ilcd-2010
    - id: inherit_and_assign
      applies_to: "all inventory rows"
      rule: "Reconcile opening/closing lots and each inherited/current exchange vector; cancel internal events once. Execute section7 dedicated/subdivision, determining-causality and only justified residual common-gate value assignment. Produce unnormalised A_i attributable to the new first-release cohort. Keep physical companion diagnostics V separate, with explicit joint-versus-allocated representation and no avoided output credit. Retain all failed/Q-zero burdens and original service vectors."
      inputs:
        - unnormalised_V
        - cp_balance
        - cp_source
        - cp_release
        - cp_pack
        - cp_service
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: pack_ledger
      applies_to: "all packaging component interfaces"
      rule: "For each specific component and same physical gate apply opening + P + N_ext + ER = closing + grossS + EO + W, where opening/closing each include empty, attached WIP/FG and reusable stocks. P is real new purchase; N_ext is first external non-purchase outside the paid supply scope; ER needs earlier dispatch. Events are mutually exclusive; internal issues/reuse cancel. Apply b_pack_balance to any evidenced non-overlapping F/X event, and b_pack_burden to each original/current vector and real incremental service. Missing actual interfaces or quantities remain incomplete, never a balancing plug."
      inputs:
        - cp_pack
        - cp_service
      output: "component_physical_and_burden_ledger"
      source_ids:
        - jrc-ilcd-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q for Q > 0; A_i is the unnormalised attributable row amount after raw_to_inventory, stock/inherited-vector reconciliation and section7 assignment; Q is the unique whole-liquid first-release net mass from cp_release. This is the only normalisation division. Cards and protocol aggregation refer to this same result. For a separate later-service result use original Q_c as that same denominator, never H or a newly invented production quantity. Q = 0 retains all raw inherited/current loads and produces no unit result. The reference output is 1 kg by definition."
      inputs:
        - A_i
        - Q
        - Q_c
        - cp_release
        - cp_service
      output: "a_i"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Retain one actual physical identity/type and complete native restrictions per bound row; distinguish source synthesis, identity evidence and future factory measurements."
      evidence: "supplier specification; full native records; actual configuration"
    - id: dq_measurement
      applies_to: "all gates"
      requirement: "Record calibration, sampling coverage, phase separation, actual state-dependent density where used, true rate/integrated-volume distinction, uncertainty and detection limits. No fabricated factory values."
      evidence: "meter/scale log; laboratory method and uncertainty; representative samples"
    - id: dq_history
      applies_to: "stocks and services"
      requirement: "Keep raw/WIP/FG and component event histories plus each inherited exchange vector across cutoffs; retain failures, idle, cleanup and actual original-cohort service."
      evidence: "lot ledger; allocation derivation; ownership/provider scope; event bridge"
    - id: dq_completeness
      applies_to: "atomic receipts and outlets"
      requirement: "No actual chemical, utility, species, packaging receipt or outlet may remain in a collective placeholder. A missing measured interface or unverified receiver/core identity is explicit incompleteness; ordinary auxiliary identity gaps stay specific."
      evidence: "atomic row/interface inventory; source/receiver comparison; unresolved register"
    - id: dq_relevance
      applies_to: "sources and assignment"
      requirement: "Qualitative historic industrial evidence supports route structure only; contemporaneous measurements and common-gate market evidence support concrete quantities/allocation. Do not reuse pigment-site averages per kg mother liquor."
      evidence: "source context; time/geography/technology match; sensitivity and gaps"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference and source"
    rule: "Fail applicability if source is not the declared ilmenite sulphate hydrolysis route, liquid mother-liquor state/receiver purpose is unproven, or excluded sewage/solvent/clinical/metal-recovery scope is selected. Verify the bound Product as this actual source-qualified spent acid-leach-liquor subset with its whole composition and first reconcentration-feed gate. Do not substitute a physically pre-hydrolysis TiOSO4 feed, Waste, service, fresh concentrated acid, recovered acid or pigment. A generic Product identity alone cannot establish source, state or receiving function."
    source_ids:
      - un-cpc3-2025
      - wco-hs2022-38
      - wco-hs2022-26
      - jrc-lvic-s-2007
  - rule_id: v_qualifiers
    applies_to: "released_acid"
    rule: "Require every reference qualifier and actual first-release receiver test/decision, lot trace, net weighing and stated liquid thermal/composition condition. Source averages, an invoice label or a signed transport receipt alone do not establish accepted regeneration-feed compatibility."
    source_ids:
      - jrc-lvic-s-2007
  - rule_id: v_balance
    applies_to: "physical gates"
    rule: "Check each source/release/FG/component gate on unallocated gross V, separate elemental and water evidence, and explicit uncertainty. Fail on missing streams, unresolved two-unknown residual fitting, duplicated internal transfers or missing opening/closing WIP/FG histories. Do not invent a tolerance or use allocation to force physical closure."
    source_ids:
      - jrc-lvic-s-2007
      - jrc-ilcd-2010
  - rule_id: v_single_denominator
    applies_to: "all inventory rows"
    rule: "Reference output is 1 kg whole wet liquid. Collect raw totals before division; perform raw unit/rate conversion and evidenced allocation/stock reconciliation first, then normalize_once only. Cards and collection aggregation reuse that one result. Q zero retains all raw current and inherited burdens without a unit result. Closing FG is not added to Q and service H is never the production divisor."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_native
    applies_to: "every bound UUID"
    rule: "Require complete native name, type, route/form, CAS, geography/grade, all comments/synonyms and every flow property, plus the exact referenced property-to-unit-group/reference-unit chain. All native restrictions in the card apply before provider selection; a broad name or classification label cannot waive a hard physical contradiction. Keep unresolved ordinary auxiliary and internal-transfer identities specific in metadata; each actual exchange still requires compatible identity/provider evidence."
    source_ids:
      - jrc-lvic-s-2007
  - rule_id: v_pack_receipts
    applies_to: "each actual component"
    rule: "Require actual atomic P, first non-purchase N_ext and true ER quantities/interfaces with mutually exclusive events, plus closing/dispatch/EO/W quantities at the same gate. Non-purchase includes first entrusted/borrowed/rented and supplier-accompanied components outside a real purchase price. ER needs earlier dispatch. Missing actual interface or measurement fails completeness; an old P+ER-only equation, opening stock substitution, copied purchase UUID or invented return cannot pass."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_burden_once
    applies_to: "all parent and component histories"
    rule: "Require original ownership/cohort, each inherited exchange vector, supplier included scope, one provider per non-overlapping supplied object and actual incremental service. Check mixture-versus-constituent and parent-versus-residual representation for duplication. No missing burden is silently set zero, including Q zero or non-purchase receipts."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_methods
    applies_to: "allocation and evidence"
    rule: "Require dedicated/subdivision and exchange-specific causal analysis before any justified residual common-gate value allocation, with actual market state/period and fees disclosed. Industrial process evidence is not allocation evidence. Reject fixed mass ratios, cherry-picked current/future price mixtures and unreviewed signed-value handling."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_species_utility
    applies_to: "material, energy and outlet records"
    rule: "Check actual species/outlet type and native medium; actual mass-versus-rate conversion; independently measured density at the substance state; aerosol/condensate/structural water separation; steam supplier convention and actual return quantities. Integrated volumes are not multiplied by time again. An assay indicator is not a chemical exchange. Missing additional real reagents/outlets/containers requires explicit atomic extension before completeness."
    source_ids:
      - jrc-lvic-s-2007
  - rule_id: v_services
    applies_to: "original released cohorts"
    rule: "Check retained post-release storage/handling/dispatch/reverse-delivery and real rework/cleanup/rental-return records against original Q_c and inherited history. Count only evidenced incremental service once. Never replace original burden with current production, invent new first release from a return or divide by exposure H."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Input to a specified mother-liquor reconcentration process before its treatment; use one verified joint or allocated representation with explicit original-cohort service links"
  allowed_use: "Source- and receiver-qualified attributional feed inventory after the stated identity, completeness and review requirements are satisfied"
  excluded_use: "Generic chemical-waste selector; pure/recovered sulfuric acid; wastewater treatment service; legal/hazard declaration; metal recovery feed; automatic credit or burden-free waste input"
  required_metadata: "All section3 qualifiers; source/receiving physical gates; supplied state and actual type; stock/cohort vectors; upstream included scope; allocation and package interfaces; actual service and return topology"
  required_quality_disclosure: "Measured versus assigned loads; whole V versus attributable A; method evidence versus factory records; source-qualified Product applicability and remaining ordinary auxiliary/internal-transfer identities; assay and density uncertainty; market/fee applicability; excluded operations and Q-zero handling"
  update_trigger: "Changed ore/route, salt/phase or receiver specification, conditioning operation, native identity restrictions, actual package/custody topology, supplier included scope, allocation evidence or emission treatment"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Ver.3.0 Structure CSV and complete Explanatory Notes, 30 June 2025, pp203–205; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv ; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "39950 heading and neighbouring 39920/39940/393 exclusions; no named mother-liquor example or accepted mapping."
  - id: "un-cpc21-hs2017"
    type: "official_guidance"
    reference: "UNSD, CPC2.1–HS2017 official correspondence CSV, online snapshot 27 October 2026; https://unstats.un.org/unsd/classifications/Econ/tables/CPC/CPCv21_HS2017/CPC21-HS2017.csv"
    used_for: "Historical 3825.69/39950 association only; not represented as a CPC3.0–HS2022 crosswalk."
  - id: "wco-hs2022-38"
    type: "official_guidance"
    reference: "WCO, HS Nomenclature 2022, Chapter38 notes1(d),4–6 and subheading note4, heading3825 pp7–8; https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0638_2022e.pdf?la=en"
    used_for: "Inorganic chemical-industry waste reasoning; distinct sewage/solvent/clinical categories and metal-residue exclusion."
  - id: "wco-hs2022-26"
    type: "official_guidance"
    reference: "WCO, HS Nomenclature 2022, Chapter26 note3 and exclusions; https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/0526_2022e.pdf?la=en"
    used_for: "Exclude residues supplied for metal extraction or manufacture of metal compounds and precious-metal recovery; receiver purpose is required."
  - id: "jrc-lvic-s-2007"
    type: "official_guidance"
    reference: "European Commission, LVIC-S BREF, August2007, §3.3.2–3.3.3, printed pp142–160, figures3.4/3.5, PDF pp187–205; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/lvic-s_bref_0907.pdf"
    used_for: "Qualitative ilmenite digestion/reduction/crystallisation/hydrolysis/filtration and acid-recovery feed interface; companion and emission separation; historic case figures and broad averages are not defaults or allocation evidence."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA—Detailed guidance, first edition March2010, §7.9 especially pp257–268 and Annex14; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision, exchange-specific determining physical causality and justified residual market-value allocation; stock/cohort and service interpretation; no automatic waste cut-off or credit."
