      raw_fields: "event ID; row ID; operation; cohort; provider; source and destination; original unit; raw amount or rate; interval; opening and closing stock; inherited exchange vector; actual F; proven OTHER duplicate X; Qc"
      collection_method: "Disjoint postrelease events in H retain original Qc. Reconcile invoices, scales, meters and custody logs without predivision; retain missing-data and uncertainty flags."
      unit: "original unit"
      frequency: "Each event and close"
      temporal_coverage: "Complete H and opening/closing inherited history"
