system_boundary:
  rules:
    - rule_id: boundary_scope
      applies_to: "all processes"
      rule: "Use the actual collection-to-gate route. Initial cleaning may remove loose contamination but must not conceal thermal rendering, chemical degreasing, hydrolysis, demineralisation, drying to bone chips, grinding to meal or shape cutting. If such a conversion occurred, preserve its actual burden and classify the changed terminal separately; it is not conforming raw bone."
      source_ids:
        - un-cpc3-2025
        - un-cpc3-2026
        - mla-bone-disposition
        - ilcd-allocation-2010
    - rule_id: boundary_origin
      applies_to: "raw_bone"
      rule: "Require a traceable bovine lot and documented nonfood destination. Preserve actual live-animal/meat-system burdens and allocation at separation. Zero price, waste wording, a handling fee or recovered status cannot set a zero provider or create avoided-production credit. A true discarded Waste cannot replace the raw Product input/output UUID."
      source_ids:
        - ec-animal-by-products
        - ilcd-allocation-2010
    - rule_id: boundary_q
      applies_to: "released_bone"
      rule: "Q sums only NEW net wet mass at the first whole-batch quality release. Conforming closing FG is already part of Q: never add it again as production. Receipt, packaging, storage, shipment, return and retest do not create Q. For current manufacture Qc=Q; subsequent services use each original cohort Qc. At Qc=0 retain real burdens, stocks and history with no unit result."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_stocks
      applies_to: "all inventory rows"
      rule: "Keep physical opening/closing raw material, WIP, rejected stock, equipment charge and FG separate from inherited per-exchange environmental vectors. F is genuine newly occurring burden; X cancels only a proven OTHER same-side duplicate event. New cleaning water, repair, replacement, leakage and rework are F, never X. Transfer each physical quantity and vector once; do not equate stored kg with environmental burden."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_fg
      applies_to: "fg_service"
      rule: "Retain opening/closing FG, gross dispatch and actual external returns by original release cohort. Reverse an original delivery once in the custody ledger for a genuine return, while retaining its historic manufacturing burden. New cleaning/repacking/cooling/rework adds actual F to original Qc. Combine preparation and FG gates only by cancelling their paired internal release transfer and vector. Report unobserved future service beyond H."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_gross
      applies_to: "all inventory rows"
      rule: "Physical gross V and environmental attribution A are separate channels. All real waste, emissions, repair/replacement and carrier returns keep V/Qc against their actual originating cohort; economic/service shares cannot shrink their mass. Origin partitions must be non-overlapping and sum to observed total V. Whole wet mixture and its components are alternative or bridged non-additive representations with one actual provider."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_pack
      applies_to: "fg_service"
      rule: "For EACH PE liner and HDPE crate use disjoint empty, attached WIP/FG and reusable stock accounts: opening + purchases + first non-purchase external receipts + true returns received = closing + gross shipments + other external exits + waste. First receipts include packaging with incoming bone, separately borrowed or freely transferred, whether or not a supplier inventory covers it. True returns require the SAME article linked to an earlier dispatch from THIS site; unlinked receipts remain first receipts. Internal reuse cancels. Record ownership, prior service and supplier coverage; actual purchase, transport and service burdens occur once, with unavailable provider data explicitly pending."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_actual
      applies_to: "all processes"
      rule: "Include all actual failed/zero-output runs, start-stop, idle cooling, trials, cleanup, rework, inspection and rejected/unauthorized activity. A quality or veterinary gate controls saleable output and destination only. Declare each additional actual purchased formulation, component, fuel, heat carrier, refrigerant, waste and gas species as its own atomic card and collection event before claiming completeness."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_water
      applies_to: "all processes"
      rule: "Close wet material, total physical mass and relevant C/N/P/Ca/S balances independently; record free, tissue-bound, phase-change and mineral structural water without assuming a reaction. Water meters provide integrated volume unless explicitly rate meters; density requires independent substance-specific state measurement. Refrigeration condensate is not boiler condensate. Any real external heat-carrier Product return retains actual mass, enthalpy, state and supplier water/energy agreement."
      source_ids:
        - ilcd-allocation-2010
