      raw_fields: "species; CAS; physical phase; carbon origin; source operation; receiving medium; emission point; concentration basis; true gas rate or integrated volume; temperature; pressure; humidity; interval; independent uptake; uncertainty"
      collection_method: "Use species-specific measurement and actual dry/wet reference-state conversion; integrate rate once or use accumulated volume directly. Keep gross and net labels and independent total/element closure; no invented emissions from aggregate indicators."
      unit: "kg"
      frequency: "Each event and close"
      temporal_coverage: "Complete H and opening/closing inherited history"
      site_scope: "Actual site and provider interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; custody genealogy; gaps and uncertainty"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "FG custody service and returns by original cohort"
      record_type: "foreground_record"
      raw_fields: "original Qc; first-release link; opening and closing FG kg; inherited per-exchange vector; gross dispatch; return; original delivery reversal; spoilage; water change; reinspection; real service F; H"
      collection_method: "Reconcile custody by lot and time. Keep services and burden vectors separate from physical stock; cancellation applies only to paired internal release."
      unit: "kg"
      frequency: "Each event and close"
      temporal_coverage: "Complete H and opening/closing inherited history"
      site_scope: "Actual site and provider interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; custody genealogy; gaps and uncertainty"
    - protocol_id: cp_pack
      process_id: "fg_service"
      flow_role: "Every packaging article and external return"
