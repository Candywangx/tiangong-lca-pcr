      collection_method: "Disjoint postrelease events in H retain original Qc. Submeter where possible, reconcile to complete site totals and actual jobs; distinguish electricity from supplied heat and its carrier."
      unit: "original energy unit"
      frequency: "Each event and close"
      temporal_coverage: "Complete H and opening/closing inherited history"
