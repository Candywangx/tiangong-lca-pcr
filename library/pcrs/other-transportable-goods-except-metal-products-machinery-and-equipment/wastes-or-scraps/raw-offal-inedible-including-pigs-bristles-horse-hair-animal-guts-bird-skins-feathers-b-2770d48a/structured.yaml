allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all processes"
    rule: "Use this hierarchy only for attributional situations requiring allocation. Industrial source descriptions do not establish LCA allocation or a default economic share. Describe the actual animal/meat/bone functions and their common interface before allocating upstream burdens."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_subdivide
    applies_to: "all inventory rows"
    rule: "First directly assign dedicated collection, species-specific sorting, cooling and cleaning using actual submeter/job records and physical or virtual subdivision. Keep the complete common process inventory; retain residual and Q0 activity explicitly rather than selecting only successful shifts."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "all inventory rows"
    rule: "For each remaining exchange identify and evidence the determining physical causal relationship with each co-function. Cooling heat load and duration may jointly determine one service; cleaning event/soiling may determine another. Mass, time, protein, energy or animal count is not automatically causal merely because available. One criterion need not apply to all exchanges."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only genuinely unresolved common-process burden proceeds to market-value allocation. Use contemporaneous values of the actual co-functions at the SAME common process gate and actual state; document quantity, price, period, treatment of paid services and sensitivity. Do not combine raw bone prices with downstream meat/gelatine prices at different gates. If the basis is unavailable or unsuitable, preserve an explicit unresolved allocation rather than inventing a ratio or zero."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_no_credit
    applies_to: "all processes"
    rule: "Internal raw-bone transfers, returned packaging and recirculated water cancel only within their physical interfaces. They do not create extra production, substitute products, avoided disposal credits or a second upstream provider. Waste treatment is linked to the actual treatment provider and mass once; retained bone carbon is not an automatic negative emission."
    source_ids:
      - ilcd-allocation-2010
