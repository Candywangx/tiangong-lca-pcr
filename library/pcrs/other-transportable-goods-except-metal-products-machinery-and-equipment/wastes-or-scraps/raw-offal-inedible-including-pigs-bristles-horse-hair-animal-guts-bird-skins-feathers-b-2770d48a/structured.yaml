      collection_method: "Count and independently weigh each actual article lot. Reconcile the complete boundary_pack equation; no assumed item mass or packaging per net dispatch shortcut."
      unit: "kg"
      frequency: "Each event and close"
      temporal_coverage: "Complete H and opening/closing inherited history"
      site_scope: "Actual site and provider interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; custody genealogy; gaps and uncertainty"
    - protocol_id: cp_fg_raw
