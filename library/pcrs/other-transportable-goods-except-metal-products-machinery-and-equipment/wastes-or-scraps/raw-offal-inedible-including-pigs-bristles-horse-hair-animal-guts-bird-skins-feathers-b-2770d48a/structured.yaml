  calculation_rules:
    - id: release_cohort
      applies_to: "released_bone"
      rule: "Sum measured NEW first-release wet net kg after duplicate-release exclusion to form Q. Assign original cohort Qc=Q; accepted closingFG is included once, never added a second time. Previously released returns or receipts retain their original Qc."
      inputs:
        - cp_release
        - cp_bone
        - cp_fg
      output: "Q; Qc"
      source_ids:
        - ilcd-allocation-2010
    - id: raw_numerator
      applies_to: "all inventory rows"
      rule: "Convert original units and integrate actual rates once. Reconcile physical V and inherited vectors independently; determine attributed environmental A using section7. N selects the labelled V or A channel with provenance; physical waste/emissions/repair/replacement/returns always retain full V. Add actual F and cancel only proven OTHER same-side X."
      inputs:
        - cp_raw
        - cp_bone
        - cp_energy
        - cp_water
        - cp_formulations
        - cp_transport
        - cp_refrigerant
        - cp_maintenance
        - cp_waste
        - cp_wastewater
        - cp_species
        - cp_fg
        - cp_pack
        - cp_fg_raw
        - cp_fg_energy
        - cp_fg_water
        - cp_fg_refrigerant
        - cp_fg_wastewater
        - cp_fg_species
      output: "N"
      source_ids:
        - ilcd-allocation-2010
    - id: report_once
      applies_to: "all inventory rows"
      rule: "r = N / Qc for Qc > 0, once for each row/cohort/channel. For new preparation Qc=Q; postrelease services retain original Qc. Physical channels use gross V; environmental channels use attributed A with inherited vectors. At Qc=0 retain all actual activity and stock but produce no unit result. For released_bone only N=Qc of newly first-released physical kg, giving exactly1kg. Cards and collection aggregation labels reference this result without dividing again; never divide by H."
      inputs:
        - N
        - Qc
        - cp_raw
        - cp_release
        - cp_fg
        - cp_fg_raw
      output: "r"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "At preparation, FG and combined gates separately close opening + genuine external inputs + internal receipts = closing + genuine external exits + internal transfers. Cancel paired internal transfers only in the combined ledger. Independently close relevant elements and water phases; residuals remain uncertainty, not invented reaction water or gases."
      inputs:
        - cp_bone
        - cp_water
        - cp_waste
        - cp_wastewater
        - cp_species
        - cp_fg
        - cp_pack
        - cp_fg_water
        - cp_fg_wastewater
        - cp_fg_species
      output: "physical_balance"
      source_ids:
        - ilcd-allocation-2010
    - id: package_closure
      applies_to: "all inventory rows"
      rule: "Apply boundary_pack separately to each article and original cohort. Record internal reuse as a paired transfer only; gross package shipment, true outside returns and actual waste remain. Link service burdens to actual original Qc without reducing measured article kg."
      inputs:
        - cp_pack
        - cp_fg
      output: "package_balance"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Match whole native identity including every name/comment/synonym, CAS, route, grade, geography, medium, type and all properties. Ambiguous or incompatible candidates stay unbound; concrete exchanges remain."
      evidence: "Direct identity evidence; exact support chain; actual supplier specification"
    - id: dq_origin
      applies_to: "raw_bone"
      requirement: "Keep actual bovine source, nonfood destination, separation state and upstream provider allocation; an animal-fit certificate does not by itself establish nonfood use."
      evidence: "Lot origin and custody evidence; veterinary/destination record; provider boundary"
    - id: dq_complete
      applies_to: "all processes"
      requirement: "Retain failures, idle, trials, start-stop, cleanup, rework, Q0 and all raw/WIP/FG physical and inherited stocks. Missing measurements and unobserved later service remain visible; a blank UUID is not a zero exchange."
      evidence: "Full event logs; stock balance; missing-data register"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Document calibration, sample representativeness, actual unit/state conversion and uncertainty; no fixed bone composition, density, yield, temperature, lifetime or emission factor."
      evidence: "Scale and meter certificates; test methods; raw readings"
    - id: dq_sources
      applies_to: "all processes"
      requirement: "Use UN for classification, MLA for Australian bone-market distinctions, Akiolis for collection and food-material counterevidence, and ILCD for allocation. Conditional inventory and closure requirements are this PCR’s methodological synthesis, not measured industry defaults. Do not infer one factory or current statutory conformance from this synthesis."
      evidence: "Source-specific scope and date assessment; original context"
validation_rules:
  - rule_id: validate_reference
    applies_to: "released_bone"
    rule: "Exactly one linked first-release Product output defines1kg wet reference; its core UUID, property, unit, bovine nonfood scope and both languages agree. A true discarded Waste cannot be its substitute."
    source_ids:
      - un-cpc3-2025
      - ec-animal-by-products
  - rule_id: validate_boundary
    applies_to: "all processes"
    rule: "Verify raw terminal and actual handover before accepting the method; preserve upstream animal/meat burdens and exclude deep conversion. Permission failures affect qualified destination/Q, not actual load retention."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_accounting
    applies_to: "all inventory rows"
    rule: "Check unique Q, original Qc, Q0, unnormalized collection, single N/Qc, full raw/WIP/FG inheritance and all three physical gates. No shrinking gross wastes or emissions by allocation, no second H divisor, no hidden actual F deducted as X."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Require a specific atomic identity, native unit and linked protocol/source context for every actual exchange including new inputs not in the initial list. Do not hide actual inputs, emissions or residues in other/zero/aggregate cards; alternatives need a documented non-additive bridge."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_pack_species
    applies_to: "all inventory rows"
    rule: "Verify each packaging equation and actual molecular species/media independently from total wet mass and element balances. Never convert COD/TN/TOC directly to a molecule or fit two unknowns from one residual."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_missing
    applies_to: "all processes"
    rule: "Disclose unavailable provider/auxiliary identities and future site quantities as ordinary data requirements. A genuine unproven core terminal or unresolved method relationship remains a substantive hold; engineering checks do not approve science, translation, mapping or publication."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared raw-bone supply to a compatible permitted nonfood industrial process before conversion"
  allowed_use: "Only the documented bovine raw state, wet mass, provider interface, first-release cohort and service horizon"
  excluded_use: "Whole39110 coverage; food/soup bone; rendered or chemically converted products; automatic zero-burden waste; fixed composition or avoided credits; veterinary permission"
  required_metadata: "All reference qualifiers, each atomic native restriction, provider boundary, source/protocol/calculation links, Q/Qc/H, physical V and attributed A, raw/WIP/FG inherited vectors"
  required_quality_disclosure: "Actual measurement coverage, uncertainty, ordinary UUID/provider gaps, unresolved true holds, evidence synthesis and unobserved later service"
  update_trigger: "Species/source/destination change; deep-processing change; core identity or provider change; release/stock boundary change; new actual exchange or measured method evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division. CPC Ver.3.0 Explanatory Notes, 30 June 2025, pp.33–36,64,69–72,88–91,198–199. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "39110 includes unworked or simply prepared bones; distinguish edible offal, raw hides, rendered fats and meal. This method is a narrower subset; it excludes powder even where the full classification includes it."
  - id: "ec-animal-by-products"
    type: "official_guidance"
    reference: "Regulation (EC) 1069/2009, Articles 8–10, especially 10(a). https://eur-lex.europa.eu/eli/reg/2009/1069/oj/eng"
    used_for: "Risk categories and material not intended for human consumption, including commercially redirected parts initially fit for food. Category and slaughter eligibility do not prove a bone lot, nonfood destination or local permission; no transfer of EU requirements to other sites."
  - id: "akiolis-category3"
    type: "literature"
    reference: "Akiolis. Collection from the meat industry. https://www.akiolis.com/en/sourcing/collection-meat-industry"
    used_for: "First-party collection of meat-industry bones and by-products. Bones for gelatine are explicitly described as food material: commercial bone availability alone cannot establish this nonfood route. No site quantities or supplier eligibility are inferred."
  - id: "ilcd-allocation-2010"
    type: "handbook"
    reference: "European Commission JRC. ILCD Handbook, General guide for LCA—Detailed guidance, first edition March2010, section7.9.3, printed257–258/PDF277–278. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional cases needing allocation: virtual subdivision, exchange-specific determining physical causality, then residual market value at the actual common gate/state. No fixed share, arbitrary choice, avoided-production credit or recycling formula is imported."
  - id: "mla-bone-disposition"
    type: "literature"
    reference: "Coleby Process Consulting for Meat & Livestock Australia. Beef Bone Disposition, Australia 2024, V.RMH.2402, PDF pages 2–3 (printed 2–3). https://www.mla.com.au/globalassets/mla-corporate/research-and-development/documents/v.rmh.2402-mla-beef-bone-disposition-memo-0125.pdf"
    used_for: "Distinguishes slaughter-floor and boning-room bone and downstream rendering, degreased chips and marrow markets. Supports an industrial raw-bone interface, not an actual batch, nonfood eligibility or a site-specific yield. National estimates and carcass weights are not foreground measurements; conversion remains excluded."
  - id: "un-cpc3-2026"
    type: "official_guidance"
    reference: "UNSD. CPC Ver.3.0 explanatory notes, 23 October 2026 workbook, CPC3!A1861:D1861. https://unstats.un.org/unsd/econstats/classifications/cpc"
    used_for: "Corroborates the frozen 2025 raw-bone inclusion and neighbouring exclusions; does not change the frozen classification inventory or approve the narrower method."
