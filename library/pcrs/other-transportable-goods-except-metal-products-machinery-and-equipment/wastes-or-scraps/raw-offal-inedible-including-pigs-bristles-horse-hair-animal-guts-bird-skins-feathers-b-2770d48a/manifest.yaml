  native_binding_notes:
    core: Official broad raw-offal Product family expressly includes unworked/simple
      bones. Only an actual bovine-bone stream is selected; no interchangeable
      mixture or Waste.
    electricity: Direct-read CN below-1kV consumption-mix Product independently
      declares Net calorific value. Metered Energy and its MJ/kWh support are
      distinct; another supplier cannot inherit this property by unit-group
      match.
    water: Mass primary. Secondary0.001m3/kg is not a measured site density.
    crate: Product/Mass Plastic crate; bags taxonomy conflicts with article name.
      Conditional actual documented HDPE crate only; no native polymer, grade or
      geography assumption.
    cleaner: Whole50% NaOH solution, not active mass or arbitrary cleaner.
    transport: Exact mass*distance version27.00.000 and unitgroup29.00.000 give
      kg*km. Source illustrative200km not adopted.
    rejected_auxiliary: Incompatible aluminium-content raw bone Waste, PAO/mineral
      lubricant conflict, offshore-vessel waste oil, unclear hypochlorite
      whole-solution basis and overinclusive molecular aliases remain unbound.
      Concrete flows retained.
    used_oil: Direct-read compatible Waste at point of generation with unspecified
      treatment; actual used petroleum-based or synthetic lubricant only. Other
      versions differ in definition.
    oxygen: CAS7782-44-7 oxygen resource from air, Mass/kg; only actual molecular O2
      uptake. Broad liquid/reagent/ion aliases do not widen resource medium.
