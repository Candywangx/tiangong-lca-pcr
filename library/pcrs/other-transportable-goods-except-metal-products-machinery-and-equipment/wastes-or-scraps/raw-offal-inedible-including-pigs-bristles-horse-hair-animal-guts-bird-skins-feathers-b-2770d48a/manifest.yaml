  classification_decision: Accepted narrower association under docs/adr/2026-11-22-accept-cpc-39110-raw-inedible-bovine-bone-at-first-release.md.
  translation_review: pending; zh-CN aligned, not reviewed
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scope_decision: Promotes the retained 39110 canonical identity only. One raw
    inedible bovine-bone supply stream before thermal or chemical deep
    processing; not full-leaf coverage. Actual slaughter/cutting upstream
    provider and allocation remain required.
  core_evidence_status: Frozen UNSD 2025 pages 198–199 and 2026 CPC3 row 1861
    agree on raw/simple bone. MLA Australian industry report and Akiolis
    collection page support a real collection interface, with food-material
    counterevidence. EC 1069/2009 Article 10(a) distinguishes nonfood intent
    from initial food eligibility. ILCD section 7.9.3 supports attributional
    allocation; collection and closure rules are PCR synthesis, not factory
    measurements.
  core_holds: []
  ordinary_data_requirements:
    - Actual traceable bovine bone lot, nonfood designation, permitted receiving
      destination, real first-release gate and outsourced providers must be
      documented before applicability is accepted.
    - Collect all actual unnormalized quantities, physical stocks, inherited
      exchange vectors, moisture/state, measured tare, H, original Qc, provider
      inclusion, causal allocation drivers and contemporaneous same-gate values.
      No numeric defaults are supplied.
    - First non-purchase packaging receipts include incoming attached, borrowed
      and free transfers independently of supplier coverage. Same-article prior
      site dispatch is required for true returns; supplier coverage and any
      missing burdens remain explicit.
    - Historical BREF and EIC leads could not be completely reacquired in this
      author session and are not relied on as verified current evidence. No
      legal permission or numerical thresholds are inferred.
  unresolved_flow_uuids:
    - row_id: hypochlorite_solution
      selected_flow: Sodium hypochlorite aqueous disinfectant solution
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional hygiene input only when actually used. Record the complete
        supplier formulation and solution mass once; available-chlorine assay is
        a non-additive subaccount, not a second input or a universal
        concentration. The searched native candidate does not unambiguously
        establish whole supplied solution versus active-substance mass and is
        not bound.
    - row_id: sorting_table_replacement
      selected_flow: Manufactured stainless-steel sorting table
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional actual replacement article with measured mass,
        alloy/composition, assembly provider and installed/retired dates. Steel
        stock alone is not the manufactured table. Retain actual replacement
        physical V and lifetime/service burden ledger without assuming life or
        fixed mass; enumerate each other actual equipment/component separately.
    - row_id: lubricating_oil
      selected_flow: Mineral lubricating oil
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional complete purchased oil formulation, not base oil plus
        duplicated additives. Record actual oil type and mass, spent oil and
        leaks separately. A queried candidate fixes PAO total synthesis while
        its comment describes mineral oil; that inconsistent identity is not
        bound here.
    - row_id: rejected_bone
      selected_flow: Discarded raw bovine bone
      classification: ordinary_auxiliary_identity_gap
      reason: Actual rejected/spoiled bone sent to its permitted treatment, measured
        as the whole wet stream with residual tissue; no Product substitution or
        credit. The native mixed bone-and-trimming Waste candidate has an
        incompatible aluminium-content reference property, so is not used.
    - row_id: flesh_residue
      selected_flow: Inedible bovine flesh residue
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional separately collected actual tissue removed in initial
        sorting; record wet mass, attached fat and moisture as non-additive
        composition. It is not the residual tissue already included in the whole
        bone or the suspended fraction already in gross wastewater. If no
        independent stream exists, retain its mass only in its actual parent
        stream.
    - row_id: bone_fines
      selected_flow: Raw bovine bone fines
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional loose fines physically captured during collection/handling,
        not manufactured bone meal. Weigh wet material with documented state; do
        not duplicate fines in effluent or rejected bone. Actual grinding is
        outside this raw route.
    - row_id: organic_wastewater
      selected_flow: Bovine-bone collection wash wastewater
      classification: ordinary_auxiliary_identity_gap
      reason: One actual gross wet wastewater stream sent to one documented provider.
        Retain measured flow, independent density, dissolved/suspended matter
        and COD/TOC/TN as distinct indicators. Do not add constituent water,
        suspended flesh or pollutant molecular masses again to the whole-waste
        mass. On-site treatment, if actual, needs its full own atomic inventory
        and actual species, never a hidden zero.
    - row_id: refrigeration_condensate
      selected_flow: Refrigeration condensate wastewater
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional actual condensate or defrost water sent separately to drain;
        identify atmospheric moisture, product moisture and added water origins
        independently. If joined into organic_wastewater before the chosen
        boundary, use a non-additive subaccount there instead of a second gross
        waste. This is not evaporation-process or steam-return condensate.
    - row_id: spent_ammonia
      selected_flow: Spent anhydrous ammonia refrigerant
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional actual discarded refrigerant leaving for authorized
        treatment. Distinguish recovered Product return, actual molecular
        leakage and remaining charge; do not select ammonia-N or chemically
        unrelated amine waste. Each external Product return requires its own
        actual identity and gross mass.
    - row_id: retired_table
      selected_flow: Discarded stainless-steel sorting table
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional complete retired article; retain gross mass, actual
        alloy/components and destination. Do not silently use a316/430 external
        scrap identity when grade and retirement route do not agree. Any
        dismantled separate components require non-overlapping measured
        partitions.
    - row_id: ammonia_leak
      selected_flow: Ammonia to air
      classification: ordinary_auxiliary_identity_gap
      reason: Conditional, measured at the actual receiving air compartment and
        release time. Actual NH3 CAS7664-41-7 leakage only; do not sum both
        charge-balance loss and the same leak meter. Retain gross molecular V
        and source partition; do not infer occurrence from a candidate flow.
        Queried reference records have overinclusive or conflicting
        synonym/phase aliases; no UUID is adopted without an unambiguous
        identity decision.
    - row_id: ammonia_decomposition
