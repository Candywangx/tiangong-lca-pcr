      collection_method: "Perform the hierarchy in section7 for each exchange. Retain the original gross source ledger, physical causal study and only genuinely remaining common-gate market-value calculation. Do not infer a fixed yield, economic ratio or burden-free state from the word waste."
      unit: "native units; currency"
      frequency: "each cohort and changed source/value period"
      temporal_coverage: "Complete declared period including all failure/Q0/start-stop/idle/cleanup/rework events"
      site_scope: "Named actual site and the single specified process/cohort"
