measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of net cut masses at their first documented quality release, excluding every packaging article. Use cp_acceptance. Same-cohort closing FG is already inside Q; do not add it again."
  - id: moisture_mass
    applies_to: "all fibre gates"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep as-weighed wet mass and independently measured wet-basis moisture, inherited oil and dry wool matter. Dry wool mass excludes free water, oil and non-wool matter using independent assays. There is no chemical conversion, reaction water or fixed regain assumption."
  - id: energy_units
    applies_to: "electricity rows"
    required_property_ref:
      name: "Energy"
      uuid: "f6811440-ee37-11de-8a39-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert raw kWh to MJ using 3.6 before attribution and normalize_once. This is metered technical energy, linked to Units of energy 93a60a57-a3c8-11da-a746-0800200c9a66, not a claim about an unresolved supplier flow's native property. Verify that property independently before linkage; shared unit groups do not prove net calorific value. Do not infer electricity mass."
  - id: air_volume
    applies_to: "splicing_air"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Use integrated meter volume once at its measured pressure/temperature/moisture state. Integrate only an actual rate over time. Any state conversion needs measured absolute pressure, temperature and gas-specific compressibility; volume-to-mass needs independent air density at that state, never water density or an unrelated secondary property."
  - id: emission_quantity
    applies_to: "external_pm; water_vapour_release"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Concentration times already integrated outlet volume gives mass; do not multiply by time again. Only concentration times volume rate is integrated over operating time. Keep independent species, particle fraction, blank corrections and moisture evidence."
  - id: packaging_mass
    applies_to: "packaging articles"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure each empty article configuration and count on calibrated scales. Count-to-mass conversion uses that article measurement; no nominal fill capacity or guessed per-item mass. Keep every bobbin, cone and sack ledger separately."
  - id: one_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "The final basis is per 1 kg reference flow. Protocols collect unnormalised raw records. Compute attributed A_j before the single division A_j/Q in normalize_once; cards and aggregation reference the same result. H is residence exposure for service attribution, never another denominator."
