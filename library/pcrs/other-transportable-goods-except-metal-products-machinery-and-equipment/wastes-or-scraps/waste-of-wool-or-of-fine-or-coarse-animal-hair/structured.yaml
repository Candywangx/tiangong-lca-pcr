system_boundary:
  rules:
    - rule_id: boundary_source
      applies_to: "joint_winding"
      rule: "Include receipt, bobbin handling, winding, sensing, actual clearing cuts, rejoining, suction and source segregation. Preserve the full main-yarn/cuts/reject output ledger even when only a small share of burdens is attributed to cuts."
      source_ids:
        - woolmark-spinning-2020
    - rule_id: boundary_acceptance
      applies_to: "cut_acceptance"
      rule: "Include dedicated collection, identified closed-container transfer, manual sorting, contamination tests, net weighing and first-release decision against a named receiver specification. A market description alone is not proof of legal or technical acceptance."
      source_ids:
        - woolmark-spinning-2020
        - nfc-hard-waste
    - rule_id: boundary_service
      applies_to: "release_service"
      rule: "Retain all actual packing, storage, handling, dispatch, external returns and incremental rework. Attribute these to original released cohorts using Q_c; do not rename dispatch or reinspection as manufacture."
      source_ids: []
    - rule_id: boundary_utilities
      applies_to: "all processes"
      rule: "This selected route has upstream steam-relaxed feed, no new steam setting, no dyeing/washing/waxing and no garnetting. Retain existing grease/oil and moisture in the feed. Actual in-boundary steam, fuel, humidification, coolant, cleaning formulation, compressor or additional material requires an explicit process extension with each purchased preparation, utility, waste and emission species; preserve its real load while reporting uncovered scope. Never copy an assumed boiler or silently zero a real operation."
      source_ids:
        - woolmark-spinning-2020
    - rule_id: boundary_inheritance
      applies_to: "raw and intermediate stocks"
      rule: "Retain failed lots, Q0 periods, starts/stops, idle/cleanup, rework and all opening/closing WIP and unused non-WIP material. Each physical transfer carries its own inherited exchange vector. Document whether raw records are gross or already net; do not deduct stock a second time. No Q0 inventory is erased or converted into a fabricated per-kg value."
      source_ids: []
    - rule_id: boundary_gates
      applies_to: "manufacturing; FG; combined system"
      rule: "Q is an internal first-release transfer from manufacture to FG, not a second external production term. Reconcile manufacture through Q and closing WIP, FG through openingFG+Q+returns and closingFG+gross shipments+real losses, then cancel internal Q/transfers at the combined physical gate. Production, FG and combined gates use identical moisture/tare/cohort definitions."
      source_ids: []
    - rule_id: boundary_legal
      applies_to: "dataset function and receiver"
      rule: "Declare the recovered-material supply function separately from any waste-treatment service. Verify the actual legal waste/product state, receiver permissions, acceptance tests, contract, ownership and common-gate value. Do not assume exemption, end-of-waste status, a positive price, an eligible treatment service or an avoided virgin-wool credit. Negative-value treatment routes require their own functional boundary before use."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_atomic
      applies_to: "inventory and upstream interfaces"
      rule: "Each row is one actual supplied article/preparation/material or one waste/emission. Whole purchased preparations are acquired once; constituent, moisture and oil assays are non-additive subledgers. Add a separate card for every real unlisted input/output. A mixed-output total and its source partitions cannot be overlapping additional providers."
      source_ids: []
    - rule_id: boundary_handover
      applies_to: "cut_acceptance; release_service"
      rule: "Verify source-site manufacture, contractor identity/processes and actual first-release/receiver handovers. First release and handover retain spun-yarn offcuts; garnetting, mixed fibre and recovered articles are excluded. Transfers, resale and reinspection cannot create Q."
      source_ids:
        - unido-hard-waste
