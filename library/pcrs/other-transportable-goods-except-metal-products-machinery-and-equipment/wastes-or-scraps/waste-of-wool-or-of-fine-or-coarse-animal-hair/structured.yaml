allocation_rules:
  - rule_id: allocation_applicability
    applies_to: "attributional multi-output winding"
    rule: "Use this hierarchy only where attributional multifunctionality genuinely requires allocation. First establish the functions, physical source operation and recovery/treatment status; the shared waste category or existence of a buyer alone does not decide allocation. Keep full gross V_j separately from attributed A_j."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_subdivision
    applies_to: "all exchanges"
    rule: "First use actual subdivision and independent metering, then defensible virtual subdivision. Dedicated cut collection/sorting goes to cuts; main-yarn-only cones and finishing go to main yarn. For each remaining exchange test the determining physical causal relationship to each function, including actual machine time, tension/control or other evidenced drivers; mass fraction by itself is not proof."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "only remaining common-process exchanges"
    rule: "Only genuinely remaining exchanges use a justified second criterion: contemporaneous market values for every real co-function in the exact state and at the same common-process exit/entry gate. Remove downstream sorting/packing/transport value added; document derivation when that gate has no traded price. For residual exchange j only, a_cuts,j = gate_value_cuts / sum(gate_value_functions). Keep currencies, period, quantities, negative-value cases, representativeness and sensitivity; do not select physical or economic allocation arbitrarily or apply a single universal share to causally distinct exchanges."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_upstream
    applies_to: "feed and inherited activity"
    rule: "Apply the evidenced per-exchange attribution once to the received yarn supplier vector and included common-stage activities; do not acquire cut feed a second time or repeat the supplier spinning/relaxation process. Preserve shares summing to one across the real functions, direct burdens, generating-stage waste treatment and gross physical yields. Existing allocated supplier burdens are not allocated again as if newly unallocated data."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_services
    applies_to: "released cohorts"
    rule: "Assign exclusive service events directly to their original released cohort; shared services require the same exchange-specific causality hierarchy. Actual residence exposure H may inform storage allocation but normalization still uses original Q_c. No re-release or returned shipment creates Q. Do not credit avoided wool, energy or waste treatment without a separately justified model outside this PCR."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_joint
      process_id: "joint_winding"
      flow_role: "feed; main yarn; unaccepted cuts; captured fly"
      record_type: "lot weighing and source records"
      raw_fields: "lot; machine; supplier; yarn count/twist; sheep species/composition; undyed/unwaxed flags; prior steam-relaxation record; inherited oil; gross feed and tare; main-yarn net mass; clearing-cut net mass; fly mass; rejection reasons; opening/closing WIP; unused-yarn stocks; all failures/Q0; raw gross/net basis"
      collection_method: "Calibrated scales at receipt and physical separation; trace the cleared fault to its machine/lot and weigh each actual destination independently. Pair before/after moisture and oil tests; reconcile the entire source operation, not merely its waste bin."
      unit: "kg"
      frequency: "each lot and all shifts"
      temporal_coverage: "Complete declared period including all failure/Q0/start-stop/idle/cleanup/rework events"
      site_scope: "Named actual site and the single specified process/cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; supplier state/chain; clearers logs; independent masses; closed inventory ledger"
    - protocol_id: cp_acceptance
      process_id: "cut_acceptance"
      flow_role: "internal cuts; accepted Q; rejected cuts"
      record_type: "segregation and first-release weighing"
      raw_fields: "source lot; sealed container; receipt; tare; first-release timestamp; unique physical lot IDs; Q mass; moisture; oil; wool assay; contamination; cut length; receiver specification and acceptance; rework; rejects and destination; opening/closing WIP; legal state"
      collection_method: "Segregate source winding cuts and manually inspect/sort against the receiver contract. Weigh net mass once at first release; retain negative/failed acceptance and independent reject weights. Confirm sheep wool and no prohibited treatment; do not relabel noils or loosen yarn by garnetting."
      unit: "kg"
      frequency: "each collection and release decision"
