      quality_evidence: "Causal evidence; source gate ledger; price derivation; shares and sensitivity"
  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert each raw record to its selected native property/unit first. Use energy_units, air_volume and emission_quantity; integrated volumes are not rates. Preserve original values, units and conversion provenance."
      inputs:
        - raw_values
        - raw_unit_labels
        - meter_state
        - cp_joint
        - cp_acceptance
        - cp_winding_energy
        - cp_sort_energy
        - cp_service_energy
        - cp_air
        - cp_maintenance
        - cp_bobbin
        - cp_cone
        - cp_pack
        - cp_emissions
        - cp_moisture
        - cp_service
        - cp_allocation
      output: "converted unnormalised physical records"
      source_ids: []
    - id: inventory_carry
      applies_to: "all inventory rows"
      rule: "For each physical lot and exchange-vector component j retain opening WIP/unused stock burden + new acquisitions/activity − closing WIP/unused stock burden; transfer the resulting vector with the actual material. Use stock terms only once: a verified net-consumption record already incorporating that stock movement is not deducted again. Preserve gross and net definitions at each gate."
      inputs:
        - opening_WIP_vector
        - opening_unused_vector
        - new_acquisitions_activity_vector
        - closing_WIP_vector
        - closing_unused_vector
        - raw_net_gross_flag
        - cp_joint
        - cp_acceptance
        - cp_winding_energy
        - cp_sort_energy
        - cp_service_energy
        - cp_air
        - cp_maintenance
        - cp_bobbin
        - cp_cone
        - cp_pack
        - cp_emissions
        - cp_moisture
        - cp_service
        - cp_allocation
      output: "inherited and current unnormalised exchange vectors"
      source_ids: []
    - id: allocation_gate
      applies_to: "all inventory rows"
      rule: "Derive A_j from the converted and stock-reconciled vector using dedicated/virtual subdivision, exchange-specific determining physical causality and only remaining common-gate values under section7. Keep physical V_j unchanged and retain existing supplier allocation. Service A_j is assigned to original cohort c."
      inputs:
        - converted_stock_reconciled_vector
        - causal_drivers
        - residual_common_gate_values
        - cp_joint
        - cp_acceptance
        - cp_winding_energy
        - cp_sort_energy
        - cp_service_energy
        - cp_air
        - cp_maintenance
        - cp_bobbin
        - cp_cone
        - cp_pack
        - cp_emissions
        - cp_moisture
        - cp_service
        - cp_allocation
      output: "A_j before normalization; gross V_j in separate ledger"
      source_ids:
        - ilcd-allocation-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q>0 compute the attributed exchange once as q_j = A_j / Q. For a diagnostic physical row only, the same rule may compute V_j / Q while retaining raw V_j and forbidding an extra provider/credit. The reference_cuts output is exactly 1 kg. Services use the original Q_c in place of Q; H never replaces Q_c. Cards/aggregation only reference this stored result and never divide it again. Q0 keeps actual raw burdens with no unit result until a justified cohort assignment exists."
      inputs:
        - A_j
        - Q
        - Q_c
        - V_j
        - cp_joint
        - cp_acceptance
        - cp_winding_energy
        - cp_sort_energy
        - cp_service_energy
        - cp_air
        - cp_maintenance
        - cp_bobbin
        - cp_cone
        - cp_pack
        - cp_emissions
        - cp_moisture
        - cp_service
        - cp_allocation
      output: "single normalized result with physical/attributed role flag"
      source_ids: []
    - id: physical_ledger
      applies_to: "all inventory rows"
      rule: "Keep gross V_j for feed, main yarn, cuts, rejects, captures, emissions and all stocks independent of allocation. Reconcile whole physical mass and separately dry wool, water, oil and measured foreign matter at manufacturing, FG and combined gates. For any claimed element balance use independent assays and actual species; no fixed keratin formula or invented reaction water, no COD/VOC-to-chemical-mass substitution. Diagnostic V_j and partitions are not overlapping providers."
      inputs:
        - V_j
        - gross_stocks
        - water_oil_component_assays
        - actual_species
        - cp_joint
        - cp_acceptance
        - cp_winding_energy
        - cp_sort_energy
        - cp_service_energy
        - cp_air
        - cp_maintenance
        - cp_bobbin
        - cp_cone
        - cp_pack
        - cp_emissions
        - cp_moisture
        - cp_service
        - cp_allocation
      output: "independent physical mass/component balances and explained uncertainty"
      source_ids: []
    - id: fg_cohort_balance
      applies_to: "reference_cuts; released_cuts_in; returned_cuts_in; dispatched_cuts"
      rule: "For each cohort reconcile O_FG + new Q + receiver returns R = C_FG + gross shipments S + actual losses D, including documented cross-gate transfers separately. First-release Q includes its closing FG once. Return R reverses the original delivery assignment and inherits history; only real incremental work is new. Cancel Q and internal transfers when joining manufacturing to FG; never add Q and same-batch closing FG as two outputs."
      inputs:
        - O_FG
        - Q
        - R
        - C_FG
        - S
        - D
        - cohort_history
        - cp_acceptance
        - cp_service
      output: "cohort FG reconciliation; Q unchanged by services"
      source_ids: []
    - id: packaging_balance
      applies_to: "bobbin_purchase; bobbin_external_return; paper_cone_nonpurchase; paper_cone_external_return; paper_cone_returned_out; paper_cone_waste; pp_sack_nonpurchase; bobbin_receipt; bobbin_return; damaged_bobbin; paper_cone_input; paper_cone_out; pp_sack_purchase; pp_sack_external_return; pp_sack_shipped; pp_sack_returned_out; pp_sack_waste"
      rule: "For each actual article/configuration separately: I0_empty + I0_attachedWIP + I0_attachedFG + I0_reusable + P + N + ER = I1_empty + I1_attachedWIP + I1_attachedFG + I1_reusable + S + EO + W. P is purchased acquisition; N is first non-purchased external receipt, including with feed, loans and free transfers regardless of supplier inventory coverage; ER is only a real return traceable to the same article previously sent out by this site; S tare accompanying gross physical shipment; EO external return out; W actual waste. Internal reuse cancels. All nonzero physical terms need individual exchange cards; stock terms are not new flows. Assign burdens by ownership/actual wear/service; no repeated purchase, product-Q addition or automatic co-product credit."
      inputs:
        - I0_empty
        - I0_attachedWIP
        - I0_attachedFG
        - I0_reusable
        - P
        - N
        - ER
        - I1_empty
        - I1_attachedWIP
        - I1_attachedFG
        - I1_reusable
        - S
        - EO
        - W
        - cp_bobbin
        - cp_cone
        - cp_pack
      output: "per-article physical balances and independent burden assignment"
      source_ids: []
  data_quality_requirements:
    - id: dq_source
      applies_to: "feed and cuts"
      requirement: "Confirm lot species/purity, yarn form, prior steam relaxation, undyed/unwaxed state, oil/moisture and exact winding origin. Industry synthesis is not a claim of one SKU; missing essential identity is an unresolved dataset finding."
      evidence: "Supplier declarations; tests; source-machine and clearing records"
    - id: dq_receiver
      applies_to: "reference_cuts"
      requirement: "Obtain the receiver specification, independent acceptance record, intended recovery, actual legal classification/permissions and functional status. Reject generic claims of recycling approval or waste exemption."
      evidence: "Contract; acceptance; authorised transfer evidence"
    - id: dq_fullperiod
      applies_to: "all processes"
      requirement: "Cover complete declared shifts/campaigns including failures, Q0, idle, startup/shutdown, cleanup and rework. Disclose sampling, missing periods, uncertainty, stock-vector inheritance and raw net/gross status. Absence requires evidence; unknown is not zero."
      evidence: "Meter/scale records; all lot events; gap register"
    - id: dq_balance
      applies_to: "physical and attributed ledgers"
      requirement: "Keep independently measured masses, water/oil and relevant element assays; no residual-fitting of two unknowns. Retain V_j and A_j and avoid duplicate source partitions/providers. Historic burdens, current incremental loads and packaging tare remain distinct."
      evidence: "Independent gate balances; assays; cohort vectors; unit conversions"
    - id: dq_method
      applies_to: "allocation and utilities"
      requirement: "Verify native hard facets and exact reference-property/unit chain; supplier selection remains site-specific. Retain per-exchange causal evidence and common-gate price derivation; no universal factor, range, yield, moisture or avoided-product credit."
      evidence: "Full native record; provider boundary; causal/value evidence; sensitivity"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Require every reference qualifier and the single sheep-wool winding-cut boundary. Noils, carding-only waste, spinning fly, garnetting, other species/blends or excluded treatments are uncovered. Preserve actual unapproved process loads instead of omitting them."
    source_ids:
      - un-cpc3-notes-2025
      - woolmark-spinning-2020
      - nfc-hard-waste
  - rule_id: validate_reference
    applies_to: "reference_cuts"
    rule: "Use one linked product output at1 kg; Q is the measured first-release net mass with matching EN/ZH definitions and no packaging. ClosingFG, reinspection, dispatch and returns cannot inflate Q. An unresolved core native identity cannot be reported as verified coverage."
    source_ids: []
  - rule_id: validate_normalization
    applies_to: "all inventory rows"
    rule: "Require complete unnormalised raw units and stock/causal attribution before the sole normalization. Check every card/protocol/calculation agrees; no second A/Q, no H denominator and no per-unit Q0 result."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "manufacturing; FG; combined gates"
    rule: "Reconcile independent whole mass, dry wool, free water, oil and actual contaminants; inspect actual relevant elements/species if claimed. Manufacturing Q and FG transfer cancel on consolidation. Never solve both moisture and dust with one residual or equate particulate/COD/VOC indicators with an invented chemical species."
    source_ids: []
  - rule_id: validate_stocks
    applies_to: "all lots"
    rule: "Inspect inherited vectors for every opening/closing WIP and unused non-WIP stock, gross/net flags and original FG/returned cohorts. Keep failed, cleanup and idle burdens; reverse original delivery assignment before actual return/rework attribution."
    source_ids: []
  - rule_id: validate_packaging
    applies_to: "each real packaging article"
    rule: "Require the complete I/P/N/ER/S/EO/W balance, same-article return provenance and supplier-burden reconciliation for bobbins, cones and sacks separately. Add exact real missing components and outgoing flows; no component/tare enters product Q or becomes an automatic credit or duplicate acquisition."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "each attributed exchange"
    rule: "Verify attributional applicability, actual/virtual subdivision, exchange-specific determining physical causality and only remaining common-gate values at actual state/time. Reject arbitrary mass/economic shares, double supplier allocation or a missing real co-function."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_interfaces
    applies_to: "native identities and datasets"
    rule: "Match all basename, route/form, species, CAS, geography, medium, type and property restrictions; a query or direct-read success alone is insufficient. Check supply/treatment functions and utility boundaries independently; physical diagnostic outputs and source partitions must not create duplicate providers."
    source_ids: []
published_dataset_profile:
  dataset_role: "Attributional supply of one specified non-garnetted wool yarn-cut feedstock; not a generic waste-treatment service"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Only the verified sheep-wool winding-cut state and authorised receiver recovery route with complete inherited upstream burden and original first-release basis"
  excluded_use: "Noils26140, garnetted stock39213, loose fly, other fibres, legal exemption, certification, zero-burden recycling, avoided virgin-wool claims or automatic full39212 coverage"
  required_metadata: "Lot/source machine; input treatment/grease/moisture; first-release Q and original cohorts; native/provider chains; physical and attributed ledgers; stock/return history; receiver/legal acceptance; packaging; causal and residual-value evidence"
  required_quality_disclosure: "Core/auxiliary identity gaps; actual coverage/omissions; measurement and stock uncertainty; scientific review state; allocation sensitivity; monitoring and LCIA coverage; source-specific limits"
  update_trigger: "Change of source route/species, yarn treatment, receiver specification/legal status, technology/utility boundary, packaging, stocks/return practice, allocation evidence or native identity"
data_sources:
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD. CPC Ver.3.0 Explanatory Notes,30June2025. PDF pp117 and199–201. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification titles and adjacent26140/39213 distinction only;39212 has no further note body; no manufacturing or legal approval"
  - id: "woolmark-spinning-2020"
    type: "handbook"
    reference: "The Woolmark Company. Worsted and woollen spinning — Facilitator Guide,2020. PDF/printed pp230–239, Module9 post-spinning operations. https://www.woolmarklearningcentre.com/globalassets/woolmark-learning-centre/10-resources/facilitator-guides/gd2891-worsted-woollen-spinning-facilitator-guide_2020_final.pdf"
    used_for: "Qualitative source winding/clearing/cut formation and prior steam relaxation; contaminant and pneumatic alternatives; no numerical process settings, purity, yields, allocations or current-factory claim"
  - id: "nfc-hard-waste"
    type: "literature"
    reference: "The Natural Fibre Company. Recycling Our Waste and By-Products, undated mill page; retrieved 2026-11-21. https://www.thenaturalfibre.co.uk/our-services/recycling-our-waste-materials/"
    used_for: "First-party market-form distinction: hard waste is small spun-yarn pieces, separately listed from noils/card/raw/bobbin waste; not a100% sheep-wool SKU or authorised industrial recovery specification"
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
