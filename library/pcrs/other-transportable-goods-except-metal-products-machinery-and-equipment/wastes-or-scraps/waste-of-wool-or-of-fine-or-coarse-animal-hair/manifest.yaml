  ordinary_gaps:
  - No factory-specific numerical yield, moisture, oil fraction, utility use, waste/emission amount, packaging mass
    or allocation factor is invented. Foreground collection and actual provider/configuration checks remain required.
  - Mineral-base oil is not represented by PAO total-synthesis native oil. No fixed25kg seed sack, assumed item
    mass or unspecified recycling destination is imposed.
  - Actual waste/product legal state, authorised receiver acceptance and function are data requirements, not an
    assumed exemption or automatic treatment-service label.
  - Historical yarn, electricity, compressed-air and particulate flow UUIDs were not found in the checked public
    archive; their undocumented identity claims are withdrawn. Metered electricity uses technical Energy, not assumed
    supplier net calorific value. Verified archived water-vapour original has no Chinese baseName; canonical display
    retained with explicit note.
  - For bobbins, cones and sacks obtain P purchases, first non-purchased external receipts N, same-article outbound/return
    proof ER, all stock and outward movements, and actual supplier-burden inclusion; no unknown receipt or supplier
    burden is zero.
  unresolved_range_evidence:
