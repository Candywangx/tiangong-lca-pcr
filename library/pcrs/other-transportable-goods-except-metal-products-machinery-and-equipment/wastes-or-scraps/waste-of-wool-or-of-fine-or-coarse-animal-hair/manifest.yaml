    limitations: Technical synthesis for one undyed unwaxed 100% sheep-wool winding/clearing hard-yarn-cut route
      only. Native product/provider identities, foreground data, receiver/legal functional review and independent
      scientific approval remain pending. Publication requires a separate decision.
  semantic_decision: 'Retain original semantic identity for undyed unwaxed sheep-wool spun-yarn clearing cuts. Current
    normalized CPC 39212 and official notes distinguish noils 26140 and garnetted stock 39213. Inspected dry-combed-wool-noils
    and accepted garnetted-stock method: their outputs differ from this still-spun cut supply. The independent review
    accepted the narrower association for the specified spun-yarn cuts.'
