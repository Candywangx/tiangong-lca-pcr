  calculation_rules:
    - id: norm_once
      applies_to: "all inventory rows"
      rule: "x_ic = A_ic / Q_c, executed once only when Q_c > 0; retain each result and its original numerator/unit lineage. Q_c = 0 carries actual burdens with no unit result. Reference output is 1 kg."
      inputs:
        - A_ic
        - Q_c
        - cp_release
      output: "x_ic"
      source_ids:
        - ilcd-attributional-2010
    - id: attribute_raw
      applies_to: "raw numerator before norm_once"
      rule: "For each exchange convert actual raw units, add inherited opening-WIP burden and actual newly attributable effort, subtract only the burden actually transferred into closing WIP or a different cohort/function, and preserve all real losses. Reconcile direct assignment and approved residual allocation to the complete pre-allocation numerator."
      inputs:
        - "raw records"
        - "inherited vectors"
        - "actual allocation"
        - cp_wip_source_fabrication
        - cp_wip_feed_preparation
        - cp_source
      output: "A_ic"
      source_ids:
        - ilcd-attributional-2010
    - id: physical_gates
      applies_to: "each material process and consolidated boundary"
      rule: "Opening WIP + external incoming V + internal incoming V = closing WIP + external outgoing V + internal outgoing V + independently quantified physical losses. Apply total mass and separate actual Zn Cu Ti Al balances; account for independently observed oxidation oxygen and water only when real. Cancel matching internal V at consolidation; never use an allocation share to close a physical balance."
      inputs:
        - "gross raw masses"
        - "independent constituent analyses"
        - cp_source
        - cp_wip_source_fabrication
        - cp_wip_feed_preparation
        - cp_loss_source_fabrication
        - cp_loss_feed_preparation
      output: "physical reconciliation"
      source_ids:
        - basel-r4-2004
        - ilcd-attributional-2010
    - id: fg_balance
      applies_to: "each original cohort"
      rule: "Opening FG + new Q_c + external returned bare feed = closing FG + gross dispatched bare feed + actual post-release rejected/lost feed. All FG terms use the same tare-free and free-moisture-corrected feed-mass basis as first release; retain a separate whole gross V ledger and observed water/contamination changes for physical transport and closure. No second addition of same-cohort closing FG to Q_c. Carry original vector for each stock and reverse matched deliveries; H remains only a service driver."
      inputs:
        - cp_fg
        - Q_c
        - "actual service records"
      output: "cohort FG reconciliation"
      source_ids:
        - ilcd-attributional-2010
    - id: pack_balance
      applies_to: "each package material and article separately"
      rule: "Opening empty + raw/unused + attached WIP + attached FG + reusable stock + new purchases P + first nonpurchase external receipts N_ext + external returns received ER = closing empty + raw/unused + attached WIP + attached FG + reusable stock + attached gross dispatch S + external returns sent EO + actual waste W. P includes whole-consignment purchased components without separate invoices. N_ext is independently measured first borrowed, leased, entrusted or genuinely nonpurchased supplier-attached receipt; ER requires the same identified article's prior outward dispatch. Preserve receipt id/time/origin, owner/custody, cohort, original vector, burden owner and provider scope for each physical input partition, independently of procurement and burden attribution. Internal issue/reuse cancels with its original vector retained. Incoming supplier packaging is identified within external receipts without a second manufacturing provider; whole articles and their component subaccounts are not added together. Unknown history is not zero. Retain actual rental/return/handling/repair services once. Do not put packaging into Q_c or assign automatic coproduct credit."
      inputs:
        - cp_pack
        - "measured individual article mass"
        - "whole receipt and destination records"
      output: "separate packaging reconciliation"
      source_ids:
        - rheinzink-classic-2024
        - ilcd-attributional-2010
    - id: transport_raw
      applies_to: "road_transport"
      rule: "Freight activity = sum of actual carried payload in t times actual km for each leg, with observed load/empty-return convention and representative provider; allocate services by actual determining constraints before norm_once. Do not use first-release Q_c or burden A as gross payload."
      inputs:
        - cp_service
        - "actual gross payload"
        - "actual route"
      output: "raw transport activity"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "whole material and terminal"
      requirement: "Prove single source and alloy-state compatibility, all required qualifiers and a real Product identity before claiming complete guidance. Unbound companion/auxiliary identities are specific gaps."
      evidence: "Supplier documents independent assays native records and receiver agreement"
    - id: dq_quantity
      applies_to: "all numerators and denominators"
      requirement: "Collect raw finite values with original units and calibrations, complete failure/idle/cleanup history and per-exchange stock inheritance; no default zero or repeated normalization."
      evidence: "Raw ledger conversion log allocation workpaper and one normalized result"
    - id: dq_species
      applies_to: "composition mass and emissions"
      requirement: "Whole alloy and whole supplied formulations are purchased once. Elements/species/water are independent non-additive subaccounts. Total mass residual cannot establish a chemical species or two missing quantities."
      evidence: "Sampling method detection limits assay closure physical gates and uncertainty"
    - id: dq_context
      applies_to: "all providers and services"
      requirement: "Confirm technology geography time voltage vehicle form and all native restrictions; preserve unresolved data. Historical EPD/basel observations are not present legal findings or plant defaults."
      evidence: "Actual dated primary records and explicit representativeness rationale"
validation_rules:
  - rule_id: validate_applicability
    applies_to: "reference and source"
    rule: "Reject pooled/unknown alloy sources, missing qualifiers and false pure-zinc Screen claims. Verify one specific product identity and its property/unit chain; unresolved product UUIDs do not establish completed exchange-identity validation. Require actual cold fabrication, whole-alloy supply and dated receiver evidence."
    source_ids:
      - rheinzink-classic-2024
      - rheinzink-fabrication-2024
      - basel-r4-2004
      - rema-zinc-2026
  - rule_id: validate_measurement
    applies_to: "all inventory"
    rule: "Check finite same-reference bases in both languages, exact native property/unit support, every raw quantity, the one A_ic / Q_c execution, Q_c > 0, source/FG/consolidated physical and element balances, and complete stock-vector inheritance. Q_c = 0 is retained but has no unit result. Missing measurements remain unknown."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_services_pack
    applies_to: "FG and packaging"
    rule: "Check original cohort reversals, all first-release and delivery events, every separate package balance including empty/WIP/FG/reusable opening and closing states, and physical gross payload. Reject second Q_c from closing FG, handling H, delivery or retest; reject doubled package purchase and internal-reuse credit. Verify disjoint P/N_ext/ER physical receipt quantities and each specific input interface with receipt id/time/origin, owner/custody, cohort, inherited vector, burden owner and provider scope; ER needs the same article's prior outward record. Check raw/unused opening/closing stock as well. Reject a false purchase/return for first nonpurchase receipt, unknown history set to zero, or duplicate whole/component manufacture and services."
    source_ids:
      - rheinzink-classic-2024
      - ilcd-attributional-2010
  - rule_id: validate_allocation
    applies_to: "each attributed load"
    rule: "Require documented dedicated assignment/subdivision, exchange-specific determining physical causality, and justified residual common-gate contemporary value when necessary. The complete assigned vectors sum to pre-allocation load; no arbitrary physical/economic switch, fixed share, invented upstream zero or automatic recycling credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_actual_species
    applies_to: "conditional/additional flows"
    rule: "Check each real atomic formulation, waste and emission with its actual species/medium/destination. Lack of measurement is not absence. If real cleaning, combustion, hydraulic processing or other excluded route is introduced, add the actual complete inventory and review scope before use; do not hide any input/outlet in an unlisted zero or collection label."
    source_ids:
      - rheinzink-fabrication-2024
      - basel-r4-2004
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Source-specific feed burden for the actual compatible zinc remelter; supply services retain original cohort"
  allowed_use: "Only the proved bare single-alloy cold-sheet route with complete actual identity, measurements, allocation and receiver data"
  excluded_use: "No whole-leaf coverage; no legal status certification; no pure-metal/alloy substitution; no automatic primary-zinc displacement or recycling-rate model"
  required_metadata: "All Section 3 qualifiers and evidence of each applicable native restriction and one provider per whole exchange"
  required_quality_disclosure: "All specific exchange UUIDs unresolved; actual alloy and receiver conditions, raw data coverage, allocation uncertainty, omitted operations, provider applicability and packaging history"
  update_trigger: "Change in source alloy or surface, mother fabrication, preparation, receiver, package, geography, energy supply or material evidence"
data_sources:
  - id: "rheinzink-classic-2024"
    type: "dataset"
    reference: "RHEINZINK / IBU, EPD-RHE-20230365-IBA1-EN, RHEINZINK-CLASSIC bright-rolled, issued 2024-01-02, §§2.1–2.9 and 2.14; https://www.rheinzink.com/fileadmin/redaktion/RHEINZINK_GLOBAL/Downloads/Technical-Documents/epd_rheinzink-classic_bright-rolled_2024-2029.pdf"
    used_for: "Actual whole alloy/rolled-sheet supply and original manufacture, including pre-alloy melting, mixing, solidification and rolling; dry handling; separate real packaging and cuttings to secondary melting plants. Qualitative route evidence only: no recipe/density/efficiency/Module D credit adopted."
  - id: "rheinzink-fabrication-2024"
    type: "handbook"
    reference: "RHEINZINK America, Standing Seam Metal Roofing Panels, Section 07 61 13, September 2024, printed pp6–9 (full downloaded technical binder PDF pp48–51); https://www.rheinzink.us/fileadmin/redaktion/RHEINZINK_US/Downloads/Technical-Documents/Division_7_binder_Volume_10_Chapter_3_Standing_Seam_Roof_09_2024.pdf"
    used_for: "Primary cold smooth-blade shearing/snips and rounded-notching fabrication, collection of drop-offs; separate adjacent installation, sealant, solder and coating alternatives. Not one measured same-factory order."
  - id: "basel-r4-2004"
    type: "official_guidance"
    reference: "Secretariat of Basel Convention, Technical guidelines R4, adopted decision VII/14 October 2004, printed November 2010 UNEP/SBC/2010/21, §§17–26 and 63–67; https://www.doe.gov.my/wp-content/uploads/2021/07/Technical-guidelines-on-the-environmentally-sound-recycling-or-reclamation-of-metals-and-metal-compounds-R4-1.pdf"
    used_for: "Independent known-composition prompt-scrap generation, segregation and specification-driven direct remelting; distinguish zinc sheet clippings from ash/dross, coated steel and dust. Historical technical context only; no current legal threshold or authorisation."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March 2010, §§7.9.2–7.9.3 pp255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision, exchange-specific determining physical causality, genuine residual common-gate market value and 100% conservation; note recycling-specific true-joint-process limits. No numerical allocation factor adopted."
  - id: "rema-zinc-2026"
    type: "standard"
    reference: "ReMA ISRI Specifications, January 2026, Nonferrous Zinc, printed p12 and adjacent pp11–13; https://www.isrispecs.org/wp-content/uploads/2026/01/2026-January-ReMA_ISRI_Specifications.pdf"
    used_for: "Counterevidence: Screen is new pure-zinc sheet/stamping scrap; alloy-specific receiver acceptance cannot be inferred. Distinguish old-zinc, die-cast, dross and mixed grades; no acceptance numeric adopted."
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, PDF pp203–204, code39365; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification meaning only; no PCR identity, methodology approval or positive mapping."
  - id: "rheinzink-material"
    type: "handbook"
    reference: "RHEINZINK, Titanium zinc, https://www.rheinzink.com/products/materials-surfaces/titanium-zinc/"
    used_for: "Confirms zinc base with added Cu/Ti for architectural alloy; base-metal purity is not finished-alloy purity. No web composition fraction, density or recycling-performance default adopted."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:fcccf846038e0b460cdea873d876901d20219440d18476d60521984ee5029da8"
