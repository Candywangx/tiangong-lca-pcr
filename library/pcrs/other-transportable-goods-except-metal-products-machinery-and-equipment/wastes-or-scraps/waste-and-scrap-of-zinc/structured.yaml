allocation_rules:
  - rule_id: allocation_goal
    applies_to: "all modelling"
    rule: "Use attributional accounting only. Keep original sheet/manufacturing burden once and identify actual functional outputs, value status and the true common process gate. A positive scrap value is not proof of zero history or a substitution credit. Industrial manufacturing/recycling evidence is not an allocation prescription; no EPD fixed percentage or Module D credit is imported."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_hierarchy
    applies_to: "each exchange"
    rule: "First directly assign dedicated functions and use feasible real/virtual subdivision. Then determine exchange-specific physical causality: embodied sheet metal follows the actual element/mass partition, whereas cutting energy is not automatically allocated by offcut mass merely because trim exists. Evaluate actual determining mechanisms for each load, including shared equipment, stock and loss treatment, with evidence. Avoid a blanket physical/economic choice or fixed allocation share."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "genuinely remaining common burdens"
    rule: "Only after documenting why the preceding steps cannot resolve the remaining load, use actual contemporary market values of actual co-functions at the same common process gate and in their actual condition. Remove downstream packing/transport/conditioning differences from later prices; do not use delivered scrap price against an unprocessed mother product. Reconcile all output shares and loss attribution to 100% of each pre-allocation exchange. Missing values remain unresolved, never invented."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_history
    applies_to: "material loops and returns"
    rule: "Document the modelling context and inherited upstream provider convention. This finite foreground method does not implement an infinite recycling-loop factor or assume future collection/processing efficiencies. Any whole-life recycled-allocation claim needs the actual true-joint-process and inherent-property/quality evidence required by ILCD §7.9.3 VI and annex 14.4; keep it outside the present finite result until established. Internal reuse of metal or packaging is a transfer, never a new purchase, free coproduct or automatic avoided-primary credit."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_source
      process_id: "source_fabrication"
      flow_role: "whole sheet and joint panel output"
      record_type: "lot ledger and calibrated weighing"
      raw_fields: "sheet receipts; supplier burden; whole composition; surface oil and moisture; dimensions; mother blanks; usable remnants; failed lots; raw masses"
      collection_method: "Trace the same lot from receipt through actual smooth-shear/notch operations and weigh every physical outlet; independently sample actual assay and contamination. Keep supplier included packaging and transport scope."
      unit: "kg"
      frequency: "each lot and reconciliation period"
      temporal_coverage: "Complete reporting period including opening/closing history and all failures"
      site_scope: "Named actual site and cohort c"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable original records calibrated instruments and reconciliation; unknowns explicit"
    - protocol_id: cp_wip_feed_preparation
      process_id: "feed_preparation"
      flow_role: "internal material and WIP"
      record_type: "physical stock and vector ledger"
      raw_fields: "opening WIP; new receipts; internal transfer; closing WIP; rework; loss; one inherited numerator vector per lot"
      collection_method: "Weigh and identify every internal transfer and opening/closing stock; reconcile both process sides and carry every original burden component with the same material."
      unit: "kg"
      frequency: "each transfer and period close"
      temporal_coverage: "Complete reporting period including opening/closing history and all failures"
      site_scope: "Named actual site and cohort c"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable original records calibrated instruments and reconciliation; unknowns explicit"
    - protocol_id: cp_wip_source_fabrication
      process_id: "source_fabrication"
      flow_role: "internal material and WIP"
