      rule: "Maintain a separate gross physical V ledger and an attributable exchange-burden vector for each lot and opening/closing WIP at every gate. Transfer each vector without re-purchasing, dilution by fresh-only averaging or hidden cancellation of losses. Cancel only matching internal transfers when consolidating gates; do not cancel external waste/emissions or internal rework effort."
