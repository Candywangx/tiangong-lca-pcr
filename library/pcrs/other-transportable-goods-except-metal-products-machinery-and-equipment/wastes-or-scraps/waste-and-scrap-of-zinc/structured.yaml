      rule: "Include supplied-sheet receipt, original cold fabrication, segregated preparation, quality release, actual storage/packing/handling, inbound and outward/return transport through the declared zinc-remelter receiving gate. Keep failed and zero-output batches, start/stop, idle, cleanup and incremental rework. Included supplier history is never reset at scrap creation."
