      applies_to: "conditional and additional operations"
      rule: "No furnace, steam, purchased heat, process gas or chemical wash is inherent in this selected dry cold route. Demonstrate actual absence instead of setting unknowns to zero. Add and query each real unlisted input, tool replacement, complete purchased formulation, fuel, refrigerant, cleaning chemical, water, wastewater, solid waste and chemical emission separately before using a package with those operations. Actual mixing from purchased ingredients requires separate purchased materials and real mixing energy/losses. Do not use “other” bundles."
