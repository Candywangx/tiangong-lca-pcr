      applies_to: "release and supply services"
      rule: "Q_c is first release, not net dispatch. Closing FG already contains the same batch first-release material and must not be added to Q_c. Keep opening/closing FG, every gross shipment and external return with its original cohort and burden. H (handled/delivered mass) is a service driver only. Packing or receiver retest adds no production. Reverse a returned original delivery and add actual incremental services/rework without manufacturing new historical burden or erasing the old one."
