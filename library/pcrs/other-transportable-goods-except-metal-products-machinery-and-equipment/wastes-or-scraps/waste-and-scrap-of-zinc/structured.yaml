          markdown: "---\n"
    - unit_id: "normative_55179"
      family: "allocation"
      span:
        start:
          offset: 55179
          line: 739
          column: 1
        end:
          offset: 57537
          line: 748
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_goal` | all modelling | Use attributional accounting only. Keep original sheet/manufacturing burden once and identify actual functional outputs, value status and the true common process gate. A positive scrap value is not proof of zero history or a substitution credit. Industrial manufacturing/recycling evidence is not an allocation prescription; no EPD fixed percentage or Module D credit is imported. | `ilcd-attributional-2010` |\n| `allocation_hierarchy` | each exchange | First directly assign dedicated functions and use feasible real/virtual subdivision. Then determine exchange-specific physical causality: embodied sheet metal follows the actual element/mass partition, whereas cutting energy is not automatically allocated by offcut mass merely because trim exists. Evaluate actual determining mechanisms for each load, including shared equipment, stock and loss treatment, with evidence. Avoid a blanket physical/economic choice or fixed allocation share. | `ilcd-attributional-2010` |\n| `allocation_residual` | genuinely remaining common burdens | Only after documenting why the preceding steps cannot resolve the remaining load, use actual contemporary market values of actual co-functions at the same common process gate and in their actual condition. Remove downstream packing/transport/conditioning differences from later prices; do not use delivered scrap price against an unprocessed mother product. Reconcile all output shares and loss attribution to 100% of each pre-allocation exchange. Missing values remain unresolved, never invented. | `ilcd-attributional-2010` |\n| `allocation_history` | material loops and returns | Document the modelling context and inherited upstream provider convention. This finite foreground method does not implement an infinite recycling-loop factor or assume future collection/processing efficiencies. Any whole-life recycled-allocation claim needs the actual true-joint-process and inherent-property/quality evidence required by ILCD §7.9.3 VI and annex 14.4; keep it outside the present finite result until established. Internal reuse of metal or packaging is a transfer, never a new purchase, free coproduct or automatic avoided-primary credit. | `ilcd-attributional-2010` |\n\n"
