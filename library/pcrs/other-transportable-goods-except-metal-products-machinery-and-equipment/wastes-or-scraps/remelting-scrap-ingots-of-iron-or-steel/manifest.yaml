      explicitly pending.
  evidence_scope: UNSD 2025-06-30 full notes PDF p.203 separates 39350, 39340 and
    39310. Algerian Customs February 2025 compendium PDF p.74 / printed p.68
    RTC067 establishes the real rough-cast alloy-steel remelting-scrap-ingot
    route from fine turnings or grinding fines with unspecified exact chemistry
    for steelmaking addition; this PCR selects fine turnings only. CBP NY
    N351850 is independent billet counterevidence. JRC EAF chapter gives
    conditional adjacent operation prompts, not proof of furnace technology or
    quantities. ILCD supports limited attributional hierarchy, not a recycling
    formula. USITC HTSUS Revision 23 (2026) Chapter72 Note1(g)/(ij), dated
    publisher snapshot, independently supplies the full physical conjunction and
    semifinished exclusion.
  deduplication_decision: Current canonical material index and accepted CPC3
    mapping inspected. The authoring baseline had no accepted CPC 39350 edge or assigned
    target conflict. Accepted 39340 HC340LA cold-stamping offcut
    bales exclude remelted ingots; steel primary/semifinished forms are excluded
    here. The accepted association retains the original semantic directory and id.
  native_adoption_limits: Direct native flow reads verified reference Product flow
    (Mass/kg, manufactured, production mix at plant; no fixed chemistry or
    furnace) and electricity Product flow (CN, 1–35 kV user-side consumption
    mix, native Net calorific value/MJ). Electricity remains conditional on real
    site/provider matching; classification case supplies no site geography.
    Meter Energy is distinct from native provider property despite common energy
    group. Supporting property/unit XMLs independently checked in fixed public
    archive, not represented as live platform observations.
  approval_scope: Candidate authored methodology; scientific review pending;
    Chinese aligned. Formal translation review, study-specific qualification
    and publication remain outstanding.
