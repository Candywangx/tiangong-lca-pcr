    required_unit: "kg"
    rule: "Q is the first-release dry net mass of the accepted rough-cast remelting feed. Include inseparable inherent product phases, not pure iron assay alone; exclude free water, detachable residue and packaging. Collect with cp_release. Reference row released_ingot is 1 kg."
  - id: raw_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared physical property"
      uuid: ""
    required_unit: "kg or MJ"
    rule: "Preserve raw mass, cumulative volume, concentration and energy units. Convert cumulative values once; integrate only actual rates over their measured time. Use independently measured substance density, gas composition, temperature, absolute pressure and wet/dry state. Never use water density for oil or gas, or infer density from a secondary flow-property coefficient."
  - id: single_division
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared physical property"
      uuid: ""
    required_unit: "per reference flow"
    rule: "Collection stores raw values without division. Establish the allocated numerator A in its row unit with calc_raw and calc_assign; calc_once performs A / Q exactly once. Cards and aggregation reference that same result. Q=0 retains the actual load and produces no unit result."
  - id: energy_state
    applies_to: "electricity and heat"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "For the selected electricity, use its energy group 93a60a57-a3c8-11da-a746-0800200c9a66 and reference MJ; the group contains kWh with factor 3.6. For metered electrical work, the independent Energy property is f6811440-ee37-11de-8a39-0800200c9a66 with the same group; never infer a provider native property from that shared group. Preserve fuel mass and its independently documented lower heating value. Keep thermal enthalpy, latent heat, losses and any real exported heat separate; an energy property does not establish electricity as a fuel."
