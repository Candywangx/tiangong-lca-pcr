system_boundary:
  rules:
    - rule_id: sb_identity
      applies_to: "reference product"
      rule: "Apply only to one segregated alloy-steel-source rough-cast ingot/pig accepted as feed for another melting operation. Require original product and route evidence satisfying the declared physical conjunction. A familiar EAF recipe, a CPC label or generic flow name does not establish this terminal."
      source_ids:
        - un-cpc3-2025
        - dz-customs-rtc067-2024
        - cbp-n351850-2025
        - usitc-ch72-2026
    - rule_id: sb_complete_route
      applies_to: "whole foreground"
      rule: "Include received-source verification, sorting, actual de-oiling/preparation, real melting, slag separation, any actual ladle treatment, rough mould casting, cooling, demoulding, inspection and first release; also actual emissions capture, residue handling, maintenance, cleaning, failed heats, startup/shutdown and idle operation. Each actual fuel, chemical, refractory, gas, packaging article, waste outlet and elementary species must have an atomic row; extend this finite candidate list when site evidence requires it. Do not silently substitute continuous casting, refined billet production or finished-ingot purchasing."
      source_ids:
        - jrc-iron-steel-2013
        - dz-customs-rtc067-2024
        - cbp-n351850-2025
        - usitc-ch72-2026
    - rule_id: sb_upstream
      applies_to: "supplied scrap and other inputs"
      rule: "Trace the parent steel and actual scrap-generating operation, source segregation, preparation, transport and prior burden allocation through a compatible provider. State the real waste/product transfer condition and the separately justified recycling method. A recycled label creates neither zero burden nor avoided-primary-production credit. Missing prior burden or waste-transfer method blocks a quantified inventory; do not manufacture a loop count, recovery factor or market-value sign."
      source_ids:
        - ilcd-general-2010
    - rule_id: sb_gates
      applies_to: "release and cohort services"
      rule: "Q counts a unique physical cohort only at first acceptance. Closing FG already contains its released Q and is never added again as production. Track storage, packing, handling and shipment after release in a separate service account attributed to the original fixed Qc; H is actual service duration and never a production denominator. Relay goods with their historical burden, do not remake them. In a combined view cancel internal release transfers. Identify the actual manufacturer, outsourced melt/cast provider, first quality release and physical handovers. Count outsourced production once through its verified provider or collected foreground operations, with explicit gap/overlap reconciliation. Mere transfer or resale is not new production. Gross shipment V, physical returns and reinspection are not new Q. Reverse the original delivery transaction when returned; retain original production history and charge only real incremental rework."
      source_ids:
        - ilcd-general-2010
    - rule_id: sb_physical
      applies_to: "metal oxygen water and heat"
      rule: "Close gross physical V separately from allocated exchange vector A. Track total mass and each relevant element including Fe/C/O and real alloying or contaminant elements, with independent metal, oxide, oil and water assays. Separate free/structural/reaction water and phase changes. Reconcile electricity, actual fuel heat, sensible/latent heat, chemical heat, cooling-water enthalpy, real exported heat and losses using measured states. One residual cannot fit two unknown species; no balancing reaction water, assumed oxidation yield or invented heat export is allowed."
      source_ids:
        - jrc-iron-steel-2013
