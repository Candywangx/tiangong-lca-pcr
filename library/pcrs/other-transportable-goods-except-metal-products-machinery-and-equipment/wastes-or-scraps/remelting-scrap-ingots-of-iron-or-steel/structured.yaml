allocation_rules:
  - rule_id: al_hierarchy
    applies_to: "each attributed exchange"
    rule: "For attributional cases where allocation is justified, first assign dedicated records and subdivide or virtually subdivide separable functions. For each remaining exchange demonstrate the determining physical causality that quantitatively links that exchange to the functions; do not choose a single mass or economic key for the whole plant. Only genuinely residual common-process loads use contemporaneous market values at the same actual gate, quantity, quality and state with disclosed adjustments. Preserve the full vector sum across functions."
    source_ids:
      - ilcd-general-2010
  - rule_id: al_residues
    applies_to: "scrap slag dust and services"
    rule: "Classify each actual outlet as product, waste or a separate treatment service using documented transfer and market state before allocation. A useful slag or dust does not automatically earn a coproduct share or credit. Waste/recycling system boundaries and cross-life allocation need their own supported method; the generic multifunctional-process hierarchy is not a complete recycling formula. Never infer positive value, fixed shares, avoided emissions or free upstream steel."
    source_ids:
      - ilcd-general-2010
  - rule_id: al_inheritance
    applies_to: "raw stocks WIP FG rework and internal metal"
    rule: "Carry opening and closing raw-material stocks, WIP and FG by lot/cohort and every inherited exchange in its own unit, with provider, historical amount, price basis and prior allocation linkage. Issue only the actual consumed raw-stock vector to WIP; receipts left in raw stock do not become current production consumption. Keep already released FG production history separate from incremental services and never add its historical vector to new production. Internal prepared charge, molten metal, returns and remelt loops have matching sender/receiver physical records and inherited vectors and cancel on consolidation. Count external purchases once. Keep all Q0, idle, cleaning and start/stop loads with their actual cohort or a disclosed unresolved burden account, never discard them to improve yield. Correct only demonstrated same-side duplicate entries against original records; no arbitrary balance plug."
    source_ids:
      - ilcd-general-2010
  - rule_id: al_packaging
    applies_to: "each packaging article"
    rule: "For each band and pallet separately require opening empty + opening attached WIP/FG + opening reusable + first external receipts N + external returns received ER = closing empty/attached/reusable + packaging accompanying gross shipments S + external returns out EO + waste W. N = P_received + NP_received: separately record actual purchased receipts P_received and first non-purchase external receipts NP_received, including packaging arriving with feed, separately borrowed/hired or freely transferred, whether or not supplier inventory covers it. Purchase invoices P are reconciled to P_received, not added to N again. Reconcile every physical movement and stock location independently from burden coverage. Count actual purchase, transport and service burdens once; if already carried in the supplied feed/provider vector, do not add them again. Missing supplier coverage is an explicit pending investigation, never zero. Every ER must link to an earlier outward transaction of that same article, including verified prior-period history; preserve event order and gross movements instead of netting returns into purchases or shipments. Internal reuse cancels. Attribute metering, real return transport and measured service wear to the serviced cohort and preserve its original Qc; attach the article's provider/lifetime burden once. No packaging enters metal Q, becomes a repurchase on reuse, or earns automatic coproduct credit."
    source_ids:
      - ilcd-general-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "scrap_ingot_route"
      flow_role: "release and stocks"
      record_type: "primary_record"
      raw_fields: "cohort id; parent heat; gross scale ticket; tare; measured free water; detachable residue; net first-release mass Q; first-release timestamp; acceptance tests; photographs; source-to-heat-to-casting-to-release lot links; actual producer and any outsourced melting/casting supplier; actual handover tickets, gate and burden coverage; named first receiving melt shop; receiving feed specification and linked acceptance/use evidence; opening and closing WIP/FG; gross shipments V; returned lot and original delivery id; Qc"
      collection_method: "Use calibrated weighing and independent moisture/residue sampling; reconcile unique acceptance and physical stock transitions. Reinspection is a linked event, not another first release. Preserve the first receiver evidence separately from the production gate: later dispatch or receiving acceptance does not create a second Q."
      unit: "kg"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_charge
      process_id: "scrap_ingot_route"
      flow_role: "source scrap"
      record_type: "primary_record"
      raw_fields: "supplier; parent steel provider and process; machining source; legal transfer state; upstream burden vector; scrap form; lot mass; moisture; oil; metal/oxide assays; relevant elemental composition; sorting rejects; internal transfers"
      collection_method: "Receive traceable delivery records and matched primary composition tests; inspect the actual physical form. Match the supplied stream and source operation to the provider boundary, including its separately justified recycling allocation."
      unit: "kg"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_material
      process_id: "scrap_ingot_route"
      flow_role: "each supplied material"
      record_type: "primary_record"
      raw_fields: "row id; supplier; whole formulation; grade; unit; raw receipt; opening stock; closing stock; use; return; loss; assay; equipment lifetime use; measured wear; raw exchange vector by cohort"
      collection_method: "Use purchasing, stores and calibrated consumption records for each atomic supply; identify real mixing and repair records. Durable mould and lining records retain lifetime and actual service wear."
      unit: "kg"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_energy
      process_id: "scrap_ingot_route"
      flow_role: "electricity and each actual fuel"
      record_type: "primary_record"
      raw_fields: "row id; meter opening; meter closing; raw kWh; raw fuel mass or volume; fuel state and independent density; calorific value; voltage; provider; operation and idle intervals; cohort; allocation drivers"
      collection_method: "Use calibrated main and submeters, invoices, tank stocks and equipment logs. Reconcile main/submeter totals, including extraction, cooling, start/stop, failed and cleaning loads; no repeated counting of a shared meter."
      unit: "raw kWh; kg; m3"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_gas
      process_id: "scrap_ingot_route"
      flow_role: "each gas and actual air species"
      record_type: "primary_record"
      raw_fields: "row id; bought or ambient; composition; cumulative volume or rate; rate unit; time interval; temperature; absolute pressure; moisture; independent density or equation basis; mass; discharge fate"
      collection_method: "Use calibrated gas meters, delivered mass records and actual composition/state measurements. Establish actual rate integration and consistent wet/dry standardisation before calculating mass; retain conversion uncertainty."
      unit: "raw m3; kg; measured rate"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_water
      process_id: "scrap_ingot_route"
      flow_role: "water and coolant"
      record_type: "primary_record"
      raw_fields: "circuit and row id; purchased whole formulation; raw water mass or cumulative volume; independent liquid density; temperature and pressure; enthalpy basis; opening and closing stocks; makeup; evaporation; blowdown; return; reaction water evidence; supplier water/energy convention"
      collection_method: "Meter each external boundary and sample the real liquid. Record free, structural and reaction water separately and establish phase/enthalpy with actual states. Do not re-purchase internal circulation or double-count solution water and whole solution."
      unit: "kg; raw m3; MJ"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_residue
      process_id: "scrap_ingot_route"
      flow_role: "each residue outlet"
      record_type: "primary_record"
      raw_fields: "row and outlet id; whole mass; moisture; composition and phase; captured or emitted; origin partitions; destination; legal transfer; one provider; inherited vector; internal recovery transactions"
      collection_method: "Weigh each real outlet and retain independent water/metal/phase assays, transfer notes and actual treatment or receiver records. Whole outlet and non-additive source partitions reconcile to the same physical mass."
      unit: "kg"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_emission
      process_id: "scrap_ingot_route"
      flow_role: "each elementary species"
      record_type: "primary_record"
      raw_fields: "species; CAS where applicable; final medium; stack and fugitive source; concentration; wet/dry basis; oxygen correction; gas flow; cumulative or rate; interval; temperature; pressure; capture; chemical phase; particle size; detection limit; uncertainty"
      collection_method: "Use actual source measurements and phase-specific tests; align concentration, flow, time and oxygen-reference conditions. Keep indicator equivalents separate from true species; below detection is a censored record, not measured zero."
      unit: "raw concentration; flow; kg"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_pack
      process_id: "scrap_ingot_route"
      flow_role: "each packaging article"
      record_type: "primary_record"
      raw_fields: "article id; cohort; opening empty; opening attached WIP; opening attached FG; opening reusable; first external receipts N split into P_received purchased and NP_received non-purchase (with incoming feed, borrowed/hired or free transfer regardless of supplier coverage); purchase invoices P reconciled to P_received; supplier embedded burden coverage and missing-data inquiry; external returns received ER with earlier outward transaction ids and timestamps; closing empty/attached/reusable; gross shipment packaging S; external returns out EO; waste W; internal reuse; provider; lifetime burden; serviced cohort original Qc; meter and return-service assignment"
      collection_method: "Independently count and weigh each article type across all stock locations and actual external movements. Link returns, repairs, service wear and delivery ids; reconcile al_packaging in article units and mass without assumed piece weights."
      unit: "kg; actual article count"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
    - protocol_id: cp_vector
      process_id: "scrap_ingot_route"
      flow_role: "raw attribution and services"
      record_type: "primary_record"
      raw_fields: "cohort and exchange id; original raw unit; gross physical V; opening and closing raw-stock vectors; actual external receipt vectors; actual issue vectors; each provider, historical quantity, price and prior allocation; opening WIP vector; current operation exchanges; dedicated assignment; virtual subdivision; causal drivers; residual gate prices and dates; closing WIP vector; opening and closing FG historical vectors; incremental FG service vectors; non-cohort transfers; Q; original Qc; service H; service raw load; return/reversal ids; actual incremental rework; Q0 hold account"
      collection_method: "Reconcile raw transactions and each inherited exchange over the full reporting period, including failed, idle and cleanup intervals. Freeze original first-release Qc for services; allocate each raw service burden to its real cohort before calc_once. Preserve all unknown relationships as unresolved, never as a passing balance."
      unit: "row-native raw units"
      frequency: "Each transaction/heat and continuous meter interval; stocktake at period boundaries"
      temporal_coverage: "Full declared reporting period including failed/Q0/idle/cleanup intervals and cohort histories"
      site_scope: "One declared site/source and separately identified suppliers and cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original tickets; matched stock and provider evidence; uncertainty; source limitations"
  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw observation to the declared row unit using supported exact unit factors or separately measured state/composition/density; integrate only rates. Do not divide by production. Keep whole supplied formulations once and assays as non-additive subledgers."
      inputs:
        - raw_observation
        - state
        - conversion_evidence
      output: "converted_raw_exchange"
      source_ids:
        - jrc-iron-steel-2013
    - id: calc_assign
      applies_to: "all inventory rows"
      rule: "First reconcile opening raw-stock vector plus actual external receipt vectors less closing raw-stock vector and documented external removals to obtain actual issues, retaining each original provider, quantity, price and prior allocation. Transfer those issue vectors to WIP once; never also charge the receipts as consumption. For each exchange f and cohort c, obtain numerator A_f,c from opening inherited WIP plus actual dedicated/allocated issues and current operation exchanges and actual returned inherited vectors, less closing inherited WIP and documented transfers to other cohorts. FG retains its existing first-release production vector; assign only incremental FG services to original Qc, never copy the historical FG vector into current production. Assign actual incremental rework separately; matched internal transactions cancel. Preserve residual common-process allocation and Q0 balances explicitly. Keep gross physical V independent of this attributed vector."
      inputs:
        - converted_raw_exchange
        - opening_raw_vector
        - closing_raw_vector
        - opening_WIP_vector
        - closing_WIP_vector
        - FG_vector
        - assignment_records
        - returns
      output: "A"
      source_ids:
        - ilcd-general-2010
    - id: calc_once
      applies_to: "all inventory rows"
      rule: "a = A / Q for a positive first-release cohort Q in kg; use original Qc as Q for the same cohort service extension. This is the sole production division; amount cards and collection aggregation only reference a. For Q=0 retain A with its unresolved or failed cohort and do not calculate a. The released_ingot reference row is 1 kg, not a second calculation."
      inputs:
        - A
        - Q
        - Qc
        - cp_release
        - cp_vector
      output: "a"
      source_ids:
        - ilcd-general-2010
    - id: calc_pack
      applies_to: "steel_band; wood_pallet; band_return_in; pallet_return_in; band_on_ship; pallet_on_ship; band_return_out; pallet_return_out; band_waste; pallet_waste"
      rule: "For each article apply al_packaging using raw stock and actual first external receipts N, not purchase invoices P as a proxy for receipts. Reconcile ER to its earlier outward article transaction before aggregation. Cancel internal reuse; separately retain lifetime/provider burden and real return services. Reconcile mass and article count using actual weighed article configurations; this rule does not divide by Q."
      inputs:
        - packaging_stocks
        - N
        - P
        - ER
        - S
        - EO
        - W
        - cp_pack
      output: "packaging_balance"
      source_ids:
        - ilcd-general-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and raw_turnings"
      requirement: "Provide source-specific primary evidence for the actual alloy-steel scrap source, furnace, rough mould route, first feed-quality release and full physical product identity. Link the original source lot, heat, casting, unique release and named first receiving melt shop with its actual remelting-feed specification and acceptance/use records. Generic factory capability or a trade definition alone leaves the source-specific method gap."
      evidence: "Source records; photographs; assays; accepted receiving specification"
    - id: dq_completeness
      applies_to: "each exchange and period"
      requirement: "Retain every row, unit, raw field, zero-output load, stock carry, origin partition, whole outlet and provider relation. Extend actual absent-from-template exchanges atomically. A not-applicable observation requires evidence of absence, never a silent zero."
      evidence: "Raw ledgers; detector limits; calibrated meters; balance reports"
    - id: dq_allocation
      applies_to: "all functions"
      requirement: "Document goal-consistent upstream recycling and current-process allocation methods separately. Keep evidence for real transfer state, subdivision, causal drivers and residual comparable gate prices. Report unresolved basis and sensitivity without substituting a convenient fraction."
      evidence: "Provider inventories; actual contracts; assignment calculations"
    - id: dq_scope
      applies_to: "dataset metadata"
      requirement: "Declare geography, reporting dates, source and technology representativeness, configuration, uncertainty and all exclusions. Future factory quantities are collection obligations, not PCR defaults; mechanical checks cannot certify scientific or translation approval."
      evidence: "Quality statement; measurement records; source limitations"
validation_rules:
  - rule_id: v_terminal
    applies_to: "reference and product evidence"
    rule: "Require all declared qualifiers and the full physical conjunction before accepting this specialised terminal. Evidence for generic EAF steel, slabs, billets, unmelted scrap or beneficiation slag is insufficient. Reject a physically contradictory native candidate even when its name or classification matches."
    source_ids:
      - un-cpc3-2025
      - dz-customs-rtc067-2024
      - cbp-n351850-2025
      - usitc-ch72-2026
  - rule_id: v_native
    applies_to: "selected flows and providers"
    rule: "Inspect full native identity, dataset type, route, grade, phase, form, CAS where present, medium, geography, all comments and properties; reference property and real unit must agree. Distinguish explicit identity restrictions from generic taxonomy or descriptive comments, which do not create an unstated hard grade. Positively establish the actual supplied state and function before binding; a generic name alone is insufficient. Generic reference flow identity does not qualify a specific alloy-steel source or actual furnace. Selected electricity has formal supply location CN and is only the stated 1–35 kV user-side consumption mix. Unbound raw-material and auxiliary rows stay specific row obligations; an ordinary unresolved UUID alone is not a global methodology hold and cannot be replaced with a family label."
    source_ids:
      - dz-customs-rtc067-2024
      - cbp-n351850-2025
      - usitc-ch72-2026
  - rule_id: v_balances
    applies_to: "whole period and every cohort"
    rule: "Require independent gross mass/element/species/water/heat closures, all raw-unit conversions, first-release Q and its FG relation, opening/closing WIP vectors, failed/Q0 loads, actual returns and incremental rework, and separate packaging and service ledgers. Do not count mixed-outlet whole mass and its origin partitions twice, or attach two providers to one outlet. Reject incomplete species evidence rather than balancing it with COD/VOC/NOx/total dust."
    source_ids:
      - jrc-iron-steel-2013
      - ilcd-general-2010
  - rule_id: v_no_defaults
    applies_to: "quantified dataset"
    rule: "No default grade, recipe, furnace, yield, oil/water content, energy intensity, density, emission factor, allocation ratio, recycling credit or production quantity is supplied. Unknown core product/route, source burden or physical species is a substantive hold; missing future site values and ordinary compatible-provider gaps require collection and disclosure. Mechanical projection/measurement checks do not establish scientific applicability or translation approval."
    source_ids:
      - ilcd-general-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply only the declared compatible remelting-feed function after its product, route and burden evidence is complete"
  allowed_use: "Source-, state- and route-matched remelting-feed modelling with explicit uncertainty and provider linkage"
  excluded_use: "Billet/slab or ordinary steel substitution; unidentified scrap sources; universal steel average; zero-burden or recycling-credit claims; automatic classification or methodology approval"
  required_metadata: "All reference qualifiers; primary terminal and route evidence; complete raw/attributed vectors; actual recycling and allocation method; source, site, period, provider and physical states"
  required_quality_disclosure: "Core evidence holds; unbound identities; collection gaps; provider limits; balance and species uncertainty; Q0 and stocks; no numerical defaults"
  update_trigger: "Change in source, grade, physical form, casting/furnace route, acceptance gate, provider, species, legal transfer/recycling method or supported evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, pp.202–204, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Separate 39350 identity from 39340 unmelted ferrous scrap and 39310 steelmaking residues. The notes do not supply a detailed manufacture recipe."
  - id: "jrc-iron-steel-2013"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for Iron and Steel Production, 2013, Chapter 8 §§8.1–8.2.1, printed pp.419–429, https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/IS_Adopted_03_2012.pdf"
    used_for: "Adjacent industrial EAF operations, atomic supply/emission candidates and collection needs only. Does not prove specialised rough scrap-ingot production. Table8.1 is per liquid steel across surveyed EU routes; no numerical reuse, fixed steam route or automatic AOD/VOD."
  - id: "ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for Life Cycle Assessment — Detailed guidance, First edition March 2010, §§7.9.2–7.9.3, printed pp.255–272, https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional dedicated assignment/subdivision, exchange-specific determining physical causality, residual same-gate/state market values and inventory conservation. No automatic recycling formula, free scrap, infinite loop, fixed recovery rate or avoided-production credit; upstream recycling still needs separately applicable evidence."
  - id: "dz-customs-rtc067-2024"
    type: "official_guidance"
    reference: "Direction Générale des Douanes, Recueil de Décisions de Classement Tarifaire 2025, February 2025, RTC 067/DGD of 5 November 2024, PDF p.74 / printed p.68, https://www.douane.gov.dz/IMG/pdf/recueil_des_decisions_de_classement_tarifaire_2025_.pdf"
    used_for: "Real rough-cast alloy-steel scrap ingot made from remelted fine turnings or grinding fines, rough irregular surface, no exact chemistry, for steelmaking addition; 7204.50.00.00. This method selects fine turnings only. No furnace, recipe, site inventory or quantitative default."
  - id: "cbp-n351850-2025"
    type: "official_guidance"
    reference: "US CBP, NY N351850, 12 August 2025, pp.1–3, https://rulings.cbp.gov/api/getdoc/ny/2025/N351850.pdf"
    used_for: "Counterexample: billets intended for foundry steelmaking remain semifinished stock. Remelt intention alone is insufficient; inspect physical form, casting/working history and composition. No tariff rate or generic lot approval is adopted."
  - id: "usitc-ch72-2026"
    type: "official_guidance"
    reference: "USITC, HTSUS Revision 23 (2026), Chapter 72 Notes 1(g) and 1(ij), printed p.72-2 / PDF p.6, publisher snapshot retrieved 21 November 2026, https://hts.usitc.gov/reststop/file?release=currentRelease&filename=Chapter%2072"
    used_for: "Rough cast form, surface faults, no feeder-heads/hot tops for ingots and exclusion of pig iron/spiegeleisen/ferroalloy composition; distinct semifinished definition. Retained dated edition, no tariff-rate or lot-qualification claim."
