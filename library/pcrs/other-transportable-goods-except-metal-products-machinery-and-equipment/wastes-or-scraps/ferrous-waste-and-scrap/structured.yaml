product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.wastes-or-scraps.ferrous-waste-and-scrap"
  classification_refs: "CPC 3.0:39340, segregated HC340LA sheet offcut bales under the maintained narrower classification decision"
  covered_products: "One segregated uncoated HC340LA cold-stamping offcut stream; mechanically sheared when necessary and hydraulically baled; accepted as low-alloy steel feed"
  excluded_products: "Mixed ferrous families; stainless/cast iron; coated/electrical sheet; oily sludge or contaminated scrap; turnings/borings and their briquettes; oxide scale/slag; remelted ingots; loose scrap delivery; purchased finished bales repacking; treatment-service reference"
  representative_product: "One declared HC340LA stamping-offcut bale specification; no universal bale density or impurity limit"
  production_route: "Burdened whole sheet receipt → cold blanking/piercing/forming and co-output separation → segregated collection/inspection → necessary mechanical shear → hydraulic baling → first receiver-grade release → cohort-linked storage/handling/road supply and actual steelworks receipt"
  market_state: "Unmelted metallic HC340LA offcuts in declared bales; measured net as-released mass with actual accepted surface state, excluding strapping/seals/containers"
functional_unit:
  what: "Supply segregated metallic bales qualified for the declared steelworks with attributable supply services"
  how_much: "1 kg first-released net feed with cohort-linked services to receiving gate; not a net-delivered-kg equivalence"
  how_well: "Actual HC340LA origin and agreed bale/contamination/receiver tests passed"
  how_long_or_cycle: "One traceable first-release cohort and disclosed supply-service history; no assumed melting yield/lifetime"
  reference_flow_link: "finished_bale"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "complete scoped route"
      rule: "Include source sheet receipt and upstream steel formation burden, original cold-stamping formation and full co-output, segregated collection, necessary shear/baling, QA and all attributable supply services through the steelworks receiving gate. The named sources support compatible unit operations; this is a transparent technical synthesis, not a claim that one SKU/factory/order demonstrates every operation. AHSS sources supply qualitative recording/lubrication concepts only; their loads/settings do not transfer to this conventional HSLA grade."
      source_ids:
        - voestalpine-hsla-2024
        - was-quality-control
        - was-lubrication
        - rema-ferrous-2026
        - jrc-ilcd-2010
    - rule_id: b_grade
      applies_to: "whole product and receiver"
      rule: "Use one actually certified HC340LA heat stream and agreed receiver specification. Source-sheet chemical maxima/minima are not the lot assay or fractions to add as purchases. No automatic ReMA 207/208/234/235 certification: alloy-free clauses and consumer-specific dimensions differ. Independently observe oil/moisture/rust, other metals, non-metal inclusions and hazardous contamination before acceptance. Thermal cutting, de-oiling, chemical washing of scrap, melting, blending with other grades or turnings requires a reviewed different route."
      source_ids:
        - voestalpine-hsla-2024
        - rema-ferrous-2026
    - rule_id: b_first_q
      applies_to: "finished_bale"
      rule: "Fix the first receiver-grade quality-release gate at the preparation facility. Q_c is newly first-released net qualifying steel-feed mass in cohort c, excluding every package and previous release. Accepted closing FG from c already belongs to Q_c; never add it again. Storage, dispatch, steelworks reception and repeat tests create no production. Reverse an invalid first release only with that lot and its whole vector; a corrected repeat release restores previously reversed eligible mass to its original cohort, never new current Q."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_wip
      applies_to: "all inventory rows"
      rule: "Retain failed and zero-output batches, start/stop, idle, cleanup and real rework. Every opening/closing WIP lot carries physical quantity/state and a complete per-exchange inherited vector covering materials, utilities, emissions, waste and services. Transfer the vector with the lot. A_jc is current allocated raw load plus opening-WIP vectors entering c minus closing-WIP vectors retained, with failure loads conserved. Do not deduct closing accepted FG production burden again. Old accepted FG sent to rework transfers its original vector in and out once; assign only real incremental rework to its original cohort."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_services
      applies_to: "cohort services to steelworks gate"
      rule: "Keep post-release storage, packaging/repacking, handling, dispatch, actual transport, reception tests, external returns and incremental rework in disjoint H_jc ledgers linked to original Q_c. H is a service load, never a production denominator. Record gross shipments, steelworks accepted mass, rejects and return/reversal of original deliveries. Customer return reverses its original delivery leg with history retained; it does not erase original production or manufacture new Q. Unserved FG and unfinished cohort services remain disclosed; a partial service history is not complete delivered-gate evidence."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_physical
      applies_to: "manufacturing FG and consolidated gates"
      rule: "Use the same physical interfaces in all balances. Manufacturing: opening raw/fluid/empty-package stores and WIP + external inputs + old FG sent to rework = closing corresponding stores/WIP + V_new + V_old returned to FG + external rejects/waste/emissions. V_new contains Q_c and actual attached packages; Q_c is not another output. FG: opening gross FG + V_new + external accepted returns + V_old returned + service packaging issued + measured moisture uptake = closing gross FG + gross dispatch + old FG to rework + external losses. Cancel all internal transfers at consolidation, retaining all external physical legs. Gross V and burden A are different ledgers."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_packages
      applies_to: "each packaging component"
      rule: "For each individual material: opening empty + opening attached WIP + opening attached FG + opening reusable stock + external purchases/first receipts P + external returns received ER = closing empty + closing attached WIP + closing attached FG + closing reusable stock + material on gross physical shipments S + external returns out EO + waste W. Include original sheet-supply straps, solid-wood supports and PE film from first external receipt. In this component ledger attached WIP includes packages still attached to received raw sheet awaiting issue; count those components once and keep raw-steel stores net of them in the manufacturing mass balance. Avoid a second upstream burden if embedded in the sheet provider. Internal reuse cancels and is not procurement, Q, coproduct or credit. Do not use net sales in S."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_extend
      applies_to: "all actual exchanges"
      rule: "Add a physically specific atomic row for every actual unlisted material, purchased formulation, fuel, refrigerant, water stream, package, service, waste mixture and identified emitted species before reporting. Unknown is not absent or zero. This selected route uses electrical mechanical handling/shearing/hydraulic baling and outsourced road freight; onsite combustion is not presumed. If onsite fuel equipment actually exists, add that fuel and each measured combustion species with proper air/resource interfaces and review scope. No boiler, steam, condensate or heat-exchanger-water return is presumed; any real external return requires its own Product return with mass, temperature/enthalpy and supplier water/energy agreement."
      source_ids:
        - was-quality-control
        - was-lubrication
        - jrc-ilcd-2010
    - rule_id: b_receiver
      applies_to: "receiver-grade release"
      rule: "Use actual bale-form and heat-specific buyer agreement, sample the interior where required, retain nonconformity/rejection and receiving records. Loose busheling acceptance does not establish hydraulic-bale acceptance; neither cited site establishes an HC340LA receiver or a universal impurity/density limit."
      source_ids:
        - sdi-scrap-2023
        - sdi-roanoke-2026
boundary_abstraction:
  declared_starting_condition: "Received uncoated HC340LA cold-rolled sheet at least 600 mm wide before source cold stamping; complete actual upstream steel and supplier oil/packaging history retained"
  starting_condition_role: "Physical upstream handover with inherited burden, not a waste cut-off or purchased-bale packing gate"
  product_classification_scope: "Only segregated metallic-sheet HC340LA cold-stamping bales within CPC 39340; oxide scale and remelting ingots excluded"
  recursive_input_rule: "Do not receive finished scrap bales as raw sheet for this manufacture. Real external returns preserve original cohort, physical state and burden vector; internal circulation cancels without new production"
  upstream_dataset_requirement: "One actual compatible sheet provider covers declared iron/steel route, refining/microalloy additions, rolling/annealing and real mill-oil/packaging boundary. Import its allocated burden once; do not reauthor embedded steelmaking or assume BF-BOF/EAF route, virgin fraction or recycled credit. Actual upstream road legs are included exactly once"
  disclosure: "All qualifiers; first Q_c gate separate from final steelworks receiving service gate; allocation; stock vectors; complete co-outputs; physical and package balances; uncertainties and incomplete services"
