allocation_rules:
  - rule_id: a_context
    applies_to: "whole route"
    rule: "Use only an attributional study context in which allocation is required. Do not mix substitution/system expansion or automatic end-of-waste/zero-burden conventions with this inventory. Waste labels and sale prices alone decide neither burdens nor technical Product status."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_separate
    applies_to: "each exchange"
    rule: "First separately meter dedicated scrap collection, shear, baling and supply operations and perform feasible real or virtual subdivision. Retain the original stamped-blank co-output and all source-steel quantities. Dedicated co-output finishing belongs to that co-output. Assign physically embodied HC340LA sheet and its inherited supplier burden by independently traced material content; do not purchase Fe/C/Mn/Si/Nb/Ti again as additional ingredients."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_physical
    applies_to: "remaining multifunctional exchanges"
    rule: "For each still shared exchange establish the determining physical causal relation with functions using process evidence; different electricity, lubrication, transport and emission exchanges may need different criteria. Mass share is not a universal shortcut for press work or idle load. State equation, observations and uncertainty and conserve every raw numerator across functions."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "genuinely residual common process"
    rule: "Only for exchanges unresolved after the preceding steps use co-function market values at the same common process gate, actual state and contemporaneous period. Reconcile downstream baling/conditioning/packaging/transport costs to that gate before deriving prices. State currencies, quantities and sensitivity; missing/zero/negative or incomparable values require methodological resolution, not an invented ratio. No fixed allocation share or arbitrary choice between physical and economic allocation."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_no_credit
    applies_to: "recycling and external wastes"
    rule: "Scrap supply is not a substitute for virgin steel or a credited recycling service. Link each externally treated whole waste mixture to one real provider and retain source partitions as a non-additive analysis ledger. Avoid counting both a mixture and its contained metals/oil/water as separate exports or duplicating a provider’s included emissions."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_origin
      process_id: "steel_feed_supply"
      flow_role: "origin steel and stamped co-output"
      record_type: "material_records"
      raw_fields: "heat; coil; supplier; grade; width; thickness; gross/tare/net kg; whole assay; mill oil; packaging; supplier boundary; stamped blank V; source scrap V"
      collection_method: "Receive traceable heat certificates and weigh sheet and full co-outputs; sample the alloy and attached oil/water independently; retain original raw quantities and provider burden before attribution."
      unit: "kg; mass fraction; mm"
      frequency: "each receipt and stamping lot"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "certificates; scale calibration; sampling; provider boundaries"
    - protocol_id: cp_release
      process_id: "steel_feed_supply"
      flow_role: "first quality release and receiver receipts"
      record_type: "quality_records"
      raw_fields: "cohort; first event ID; gross kg; tare kg; net Q_c; bale dimensions; actual contamination results; spec; test date; receipt; rejection; original delivery; reversal"
      collection_method: "Calibrated weighing excluding each package; independent moisture/oil/metal/hazard sampling and actual agreed tests. Record first release once, stock and gross delivery/reception/return separately; no prior division."
      unit: "kg; mm; mass fraction"
      frequency: "each release and receipt/return"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed release and steelworks receipt; raw lab results"
    - protocol_id: cp_energy
      process_id: "steel_feed_supply"
      flow_role: "electrical load"
      record_type: "meter_records"
      raw_fields: "meter; voltage; provider; raw kWh/MJ; timestamps; equipment/stage; idle/start-stop/cleanup; cohort partition"
      collection_method: "Read cumulative meters or integrate actual power rates over measured time; subtract paired internal meters only where boundaries overlap. Preserve raw records by production and cohort service; apply unit conversion before allocation."
      unit: "kWh; MJ"
      frequency: "each run and zero-output period"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; coverage and equipment ledger"
    - protocol_id: cp_materials
      process_id: "steel_feed_supply"
      flow_role: "each atomic material"
      record_type: "material_records"
      raw_fields: "row_id; batch; whole supplied mass/volume; formulation; density state; external receipt; opening/closing store/circuit; recovery; loss; stage/cohort"
      collection_method: "Weigh or meter each specific whole supply; retain supplier/SDS composition as non-additive subledger. Measure formulation-specific density when conversion is needed and record internal mixing energy/ingredients separately when actually performed. Keep raw numerator undivided."
      unit: "kg; m3; kg/m3"
      frequency: "each receipt/issue and stock boundary"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoice; SDS; calibration; density measurement"
    - protocol_id: cp_outputs
      process_id: "steel_feed_supply"
      flow_role: "each separate external waste"
      record_type: "waste_records"
      raw_fields: "whole waste kg; constituent assay; origin partitions; receiver; hazard/state; storage; physical fate; provider coverage"
      collection_method: "Weigh each whole separate mixture with representative sampling and one actual receiver/provider. Retain origin partitions summing to the whole; they are not additional exports. Do not use a total residual to invent oil and water separately."
      unit: "kg; mass fraction"
      frequency: "each withdrawal and failure lot"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "transfer tickets; laboratory records; provider boundary"
    - protocol_id: cp_species
      process_id: "steel_feed_supply"
      flow_role: "actual elementary species"
      record_type: "emission_records"
      raw_fields: "chemical; CAS; phase; medium; location; concentration; measured gas/liquid state; integrated volume or true rate; time; background; uncertainty"
      collection_method: "Use actual species-resolved measurement or independent stoichiometric evidence with measured reaction extent. Distinguish vapour/liquid entrainment and ambient humidity. Integrated volume is not multiplied by duration again; true rate is integrated once. COD/VOC totals remain indicators until actual molecular speciation exists."
      unit: "kg; actual raw concentration/volume/rate units"
      frequency: "each actual emission interval"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling calibration; detection limits; speciation and medium"
    - protocol_id: cp_packaging
      process_id: "steel_feed_supply"
      flow_role: "each package and reusable item"
      record_type: "packaging_records"
      raw_fields: "component; material; actual supply/provider; opening/closing empty/WIP/FG/reusable; first receipts P; ER; gross shipment S; EO; waste W; actual item mass"
      collection_method: "Weigh each separate band/seal/wood support/film/bin from first external receipt. Track attached stock and all gross external legs; paired internal reuse cancels. If recorded as counts, weigh actual configuration; no default kg/item. Preserve raw mass and embodied-provider flags without prior normalization."
      unit: "kg; actual count with weighed mass"
      frequency: "each receipt/issue/shipment/return and period end"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stocktake; tare and calibration; external return receipts"
    - protocol_id: cp_transport
      process_id: "steel_feed_supply"
      flow_role: "road freight workload"
      record_type: "transport_records"
      raw_fields: "actual leg; supplier; route km; gross cargo/package kg; vehicle; loaded/empty return; service boundary; production/cohort ID"
      collection_method: "Retain each leg distance and carried mass plus provider coverage and shared-function allocation evidence. Calculate actual workload before attribution and distinguish original receipt/dispatch/return legs; do not manufacture tonne-km from net reference Q alone."
      unit: "kg; km; t*km; kg*km"
      frequency: "each physical leg"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; carrier records; route and empty-leg evidence"
    - protocol_id: cp_stock
      process_id: "steel_feed_supply"
      flow_role: "WIP/FG and inherited vectors"
      record_type: "stock_records"
      raw_fields: "lot; stage; cohort; raw/finished status; opening/closing physical state; each historical exchange vector; failure/rework; source and correction links"
      collection_method: "Reconcile physical stocktake with batch history and every input/emission/waste/service inherited amount. Preserve old FG vector on paired rework transfers; segregate new incremental service. Retain Q-zero load and unserved FG history."
      unit: "kg; each exchange unit"
      frequency: "each stock boundary and transfer"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed stocktake; immutable lot/vector reconciliation"
    - protocol_id: cp_allocation
      process_id: "steel_feed_supply"
      flow_role: "exclusive and shared raw loads"
      record_type: "allocation_records"
      raw_fields: "exchange; function; dedicated meter; embodied material; determining physical relation; residual; common gate; actual state; price period/currency; adjusted cost; uncertainty"
      collection_method: "Collect raw function-specific records before any ratio. Document real/virtual subdivision and independent causal evidence; only genuinely residual exchange values use same-gate contemporary market evidence after downstream adjustments. Keep all function shares and sensitivity; no preset fraction."
      unit: "actual exchange units; actual currency"
      frequency: "each route/period change and cohort"
      temporal_coverage: "complete period and cross-period cohorts including zero-output periods"
      site_scope: "actual source/preparation sites through declared steelworks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter traces; causal reasoning evidence; market/cost records"
  calculation_rules:
    - id: c_units
      applies_to: "all inventory rows"
      rule: "Reconcile receipts with opening/closing raw stores to obtain actual issued/consumed supplies before attribution; retain receipts as separate physical legs. Convert raw units before attribution; 1 kWh = 3.6 MJ and 1 t*km = 1000 kg*km. Mass from volume uses independently measured material-specific density at its actual state; whole supplied formulations remain one purchase."
      inputs:
        - "raw records"
        - "independent density"
        - cp_materials
        - cp_energy
        - cp_transport
      output: "converted raw records"
      source_ids:
        - jrc-ilcd-2010
    - id: c_q
      applies_to: "finished_bale"
      rule: "Q_c = sum of newly first-released qualifying net bale mass in cohort c after documented original-cohort corrections; exclude all packages and prior releases. Closing accepted FG is already included."
      inputs:
        - cp_release
        - cp_stock
      output: "Q_c"
      source_ids:
        - jrc-ilcd-2010
    - id: c_attribution
      applies_to: "all inventory rows"
      rule: "For each j conserve raw exchange quantity across functions after dedicated/virtual subdivision; determine exchange-specific physical causality and allocate only genuinely residual shared load by actual common-gate market value. Keep gross V unchanged by burden shares."
      inputs:
        - "converted raw records"
        - cp_allocation
        - cp_origin
      output: "allocated raw load B_jc"
      source_ids:
        - jrc-ilcd-2010
    - id: c_inheritance
      applies_to: "all inventory rows"
      rule: "A_jc = B_jc + historical opening-WIP exchange vector transferred into c - closing-WIP vector retained outside release. Preserve failure/idle/cleanup and actual loss burdens. Do not subtract accepted closing FG again; old-FG rework transfers its inherited vector in/out and only its increment enters H_jc."
      inputs:
        - B_jc
        - cp_stock
        - cp_outputs
      output: "A_jc"
      source_ids:
        - jrc-ilcd-2010
    - id: c_service
      applies_to: "all inventory rows"
      rule: "H_jc is the disjoint actual post-release service/incremental-rework vector for original cohort c, including actual gross delivery/return legs and terminal receiver testing. Maintain unfinished service scope explicitly. H is never an output denominator."
      inputs:
        - cp_stock
        - cp_transport
        - cp_packaging
        - cp_release
      output: "H_jc"
      source_ids:
        - jrc-ilcd-2010
    - id: c_normalize_once
      applies_to: "all inventory rows"
      rule: "For Q_c > 0 perform the only normalization: a_jc=A_jc/Q_c and s_jc=H_jc/Q_c; final exchange per reference is a_jc+s_jc for disjoint production/service components. Gross physical context v_jc=V_jc/Q_c is a separate non-burden view of complete co-output/return/shipment quantities. Cards and aggregation tags reference these same results once. For Q_c=0 retain all real loads/stock and report no unit result; neither H nor current-period Q can replace original Q_c."
      inputs:
        - A_jc
        - H_jc
        - V_jc
        - Q_c
      output: "a_jc; s_jc; v_jc"
      source_ids:
        - jrc-ilcd-2010
    - id: c_physical
      applies_to: "all material interfaces"
      rule: "Reconcile manufacturing and FG equations in b_physical and consolidated external V independently for whole physical mass, alloy metal, oil, water and measured relevant elements. Element assays are non-additive analyses of whole alloy/mixtures. Source chemistry limits do not close a balance; a single residual cannot solve two unknowns. No chemical reaction/oxygen uptake or structural water is presumed."
      inputs:
        - cp_origin
        - cp_materials
        - cp_stock
        - cp_outputs
        - cp_species
      output: "physical mass and element reconciliations"
      source_ids:
        - jrc-ilcd-2010
    - id: c_packages
      applies_to: "each separate package"
      rule: "Apply the complete opening+P+ER=closing+S+EO+W ledger in b_packages to each material across empty/attached WIP/attached FG/reusable stocks. S follows gross physical shipments; cancel internal reuse and retain all first external receipts."
      inputs:
        - cp_packaging
        - cp_stock
        - cp_release
      output: "each package reconciliation"
      source_ids:
        - jrc-ilcd-2010
    - id: c_residual
      applies_to: "physical diagnostics"
      rule: "Report F as the difference of the fixed-side physical ledger. Adding newly identified X adjusts only an exact duplicate already in OTHER on the same side by the same amount; do not fit X to F or erase unexplained uncertainty. Whole external waste and origin partitions sum once with one provider."
      inputs:
        - cp_outputs
        - cp_stock
        - cp_species
      output: "diagnostic residual and evidence gap"
      source_ids:
        - jrc-ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each supply and output"
      requirement: "Actual grade/form/route/native type/geography/provider matched independently; Product reference cannot be established by a Waste identity or family basename."
      evidence: "full native records; heat certificates; signed receiver specification"
    - id: dq_raw
      applies_to: "all records"
      requirement: "Retain meter/weighbridge originals, detection limits, sampling design and uncertainty; no literature factory recipe or fabricated grade/amount/density."
      evidence: "calibration; laboratory records; raw ledgers"
    - id: dq_stock
      applies_to: "all cohorts"
      requirement: "Complete physical and inherited per-exchange vectors, failures, Q-zero, stock/rework and receiver services; unfinished service coverage remains explicit."
      evidence: "cohort genealogy; c_physical; c_packages"
    - id: dq_sources
      applies_to: "method and science"
      requirement: "Separate classification, manufacturer technical scope, industry preparation guidance and attributional allocation guidance; source examples are not a same-site recipe or scientific/translation approval."
      evidence: "source context and independent applicability assessment"
validation_rules:
  - rule_id: v_scope
    applies_to: "whole route"
    rule: "Check the complete source-to-receiver supply route and exclusions; confirm one certified HC340LA stream and actual receiver agreement without automatic ReMA grade or virgin-steel substitution."
    source_ids:
      - un-cpc-2025
      - voestalpine-hsla-2024
      - rema-ferrous-2026
  - rule_id: v_identity
    applies_to: "every UUID and provider"
    rule: "Use only compatible native flow type/route/form/CAS/geography and all property/unit restrictions. Core Product identity unresolved means unavailable final native binding; auxiliary gaps remain specific named exchanges. Generic identity does not certify a provider."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_quantity
    applies_to: "all cards and cohorts"
    rule: "Enforce one new first-release Q_c, complete WIP inheritance and disjoint service H_jc at original Q_c. Verify raw records are undivided and c_normalize_once is performed once; Q-zero produces no unit result."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_conservation
    applies_to: "all physical interfaces"
    rule: "Independently close whole mass and relevant-element/oil/water ledgers with measured evidence, matched gates and every individual package from first receipt. Retain unexplained residuals; no two-unknown fit, mixture-origin duplication or internal transfer output."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_complete
    applies_to: "all actual burdens"
    rule: "Verify dedicated/virtual subdivision, exchange-specific causality and only residual same-gate market allocation; conserve raw loads including failures. Confirm all observed chemicals/energy/packages/wastes/species and outsourced boundaries; unknowns never pass as zero."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared prepared metallic steel-feed supply after actual identity/provider and completeness checks"
  allowed_use: "One explicitly qualified HC340LA bale supply with first-release denominator and complete cohort services; expose actual steelworks received mass/yield separately"
  excluded_use: "Universal ferrous scrap; net-delivered-kg equivalence; treatment-service substitution; scale/ingots/stainless/cast-iron; automatic credit or zero upstream burden"
  required_metadata: "All required qualifiers and each selected card restriction; source and provider boundaries; real terminal receiving records; distinct Q_c/V/A/H ledgers"
  required_quality_disclosure: "Data/site/period representativeness; measured contamination and uncertainties; all unserved FG/returns; native identity and provider gaps; calculation and service completeness"
  update_trigger: "Different grade/coating/origin, physical form or prep route; receiver specification/legal role; native identity/provider revision; source/technology/period or stock-service boundary change"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "UN CPC Version 3.0 explanatory notes, 30 June 2025, printed p.203; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "39340 scrap distinguished from 39310 scale and 39350 remelting ingots"
  - id: "voestalpine-hsla-2024"
    type: "handbook"
    reference: "voestalpine Micro-alloyed steels data sheet, 11/2024, pp.1–4; https://www.voestalpine.com/stahl/content/download/4681/file/Data-sheet-micro-alloyed-steels-voestalpine-EN-030225.pdf?inLanguage=eng-GB"
    used_for: "HC340LA and uncoated supply identity; heat-analysis and coating counterexamples; no lot assay or footprint transfer"
  - id: "was-quality-control"
    type: "handbook"
    reference: "WorldAutoSteel AHSS Guidelines, Quality Control, publisher HTML accessed 2026-11-20; https://ahssinsights.org/forming/quality-control/quality-control/"
    used_for: "Qualitative stamping input/trim-scrap and recording concepts; AHSS loads and settings do not transfer to conventional HSLA"
  - id: "was-lubrication"
    type: "handbook"
    reference: "WorldAutoSteel AHSS Guidelines, Lubrication, publisher HTML accessed 2026-11-20; https://ahssinsights.org/forming/tooling/lubrication/"
    used_for: "Qualitative distinction between mill oil, whole supplied press lubricant and application; no AHSS numeric transfer"
  - id: "rema-ferrous-2026"
    type: "standard"
    reference: "ReMA ISRI Specifications January 2026, FS-2023, printed pp.20–23; https://www.isrispecs.org/wp-content/uploads/2026/01/2026-January-ReMA_ISRI_Specifications.pdf"
    used_for: "Actual buyer agreement, cleanliness, sheet clippings/bundles versus turnings/mill-scale/cast-iron distinctions; no automatic trade-grade or density assignment"
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "JRC ILCD Handbook General guide for LCA—Detailed guidance, first edition March 2010, §§7.9.2–7.9.3; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality hierarchy and exchange-specific allocation; foreground stock/protocol requirements are explicit method implementation, not industrial observations"
  - id: "sdi-scrap-2023"
    type: "handbook"
    reference: "Steel Dynamics Structural & Rail Division, Iron & Steel Scrap Manual, 1400-020-001 Rev.0, 18 December 2023, pp.5–10; https://www.steeldynamics.com/wp-content/uploads/2024/01/1400-020-001-STEEL-SCRAP-IRON-AND-STEEL-SCRAP-MANUAL-V.0-12-18-2023.pdf"
    used_for: "Columbia City inspection and separate #1 Busheling/#1 Bundles forms; site-specific counterexample only, no automatic numerical transfer or HC340LA acceptance"
  - id: "sdi-roanoke-2026"
    type: "handbook"
    reference: "Steel Dynamics Roanoke Bar Division, Inspection of Scrap AP019 Rev.2, 29 April 2026, pp.1–2,7–8; https://lpg.steeldynamics.com/pdf/Roanoke/Documentation/Op-Procedure-Receiving-Inspection-Scrap.pdf"
    used_for: "Separate receiving-site inspection, chemistry and bundle interior controls; same corporate group as Columbia City, no industry-wide acceptance or verified HC340LA receiver"
