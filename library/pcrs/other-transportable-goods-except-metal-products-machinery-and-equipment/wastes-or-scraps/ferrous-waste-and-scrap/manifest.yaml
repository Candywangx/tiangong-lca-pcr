  evidence_limits:
    - No actual receiver approval for HC340LA bales has been demonstrated; buyer-specific chemistry, dimensions, interior cleanliness and legal supply status require collection.
    - Classification titles support narrower category placement only. Manufacturer, AHSS and receiver documents do not establish a same-site production recipe, numeric yield, density, oil use or emissions.
    - Generic alloy identity does not establish this unmelted scrap bale. Retained auxiliary UUIDs and support properties were checked in public ILCD originals; they do not establish present-day platform status or provider eligibility.
    - Core module references are scaffold conventions, not independent material evidence or scientific approval.
  ordinary_data_requirements:
    - Collect actual heat assay, calibrated net release masses, complete sheet and stamped-blank co-output, WIP vectors, package ledgers, allocation evidence and original-cohort delivery and return records.
