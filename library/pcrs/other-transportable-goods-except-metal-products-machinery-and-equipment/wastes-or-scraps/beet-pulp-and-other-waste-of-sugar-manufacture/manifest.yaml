    with reference kg were independently read from the public TianGong-LCA-Data
    archive. Actual flow identities and their exact property/unit chains require
    verification where unbound. Energy/kWh on unbound electricity cards is a
    physical collection basis, not a verified native reference property.
  ordinary_foreground_gaps:
    - Actual supplier and lot-specific composition/press-aid data; metered
      activity and loss data; specification and feasible time window; stocks and
      inherited vectors; real utilities and packaging; actual
      background-provider compatibility. These do not by themselves establish
      absence of the physical product family.
  source_limitations:
    - Manufacturer families and EPA historical joint route are technical
      synthesis, not one SKU/factory dataset.
    - No universal dry matter, moisture, residual sugar, yield, price, heat
      value, energy consumption, emission factor or allocation proportion
      adopted.
    - VDZ 2005 is historical contamination/process context, not present legal
      approval. ILCD is attributional method guidance only.
  measurement_review: Raw numerators, first-release wet-mass Q, WIP and FG
    cohorts, physical V and burden A remain distinct; current finite measurement
    check required after deterministic sync.
