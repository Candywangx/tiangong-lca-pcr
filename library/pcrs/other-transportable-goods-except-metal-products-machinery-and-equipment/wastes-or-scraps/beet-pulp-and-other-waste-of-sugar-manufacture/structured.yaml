  calculation_rules:
    - id: cr_q
      applies_to: "reference_pressed_pulp"
      rule: "Q = sum of measured first-complete-release net wet masses during H for the declared eligible state; each whole lot once. Closing eligible FG is already included in Q; opening FG and repeat release are excluded. For Q = 0 retain physical and burden ledgers without a unit result."
      inputs:
        - first_release_wet_mass
        - eligible_state
        - cp_release
      output: "Q"
      source_ids:
        - sudz-pressed-pulp
        - vdz-beet-pulp-2005
    - id: cr_physical
      applies_to: "all physical streams"
      rule: "For each process: opening physical stock + gross actual boundary inflows = closing physical stock + gross actual boundary outflows + independently evidenced transformation. Match internal endpoints before combined aggregation. Do not multiply either side by any burden share; wet-mass water/solids and relevant element balances are additional independent checks."
      inputs:
        - opening_physical_stock
        - gross_inflows
        - closing_physical_stock
        - gross_outflows
        - transformation
        - cp_pulp_pressing
        - cp_pulp_release_handoff
        - cp_water_pressing
        - cp_water_release_handoff
        - cp_fg
      output: "physical_balance"
      source_ids:
        - epa-ap42-beet-1997
    - id: cr_dry_bridge
      applies_to: "each measured wet stream"
      rule: "D = W × d; retained water = W × (1 − d). W is the primary physical ledger; D and water partitions are not added again. Independently sample dissolved solids in press liquor and residues."
      inputs:
        - W
        - d
        - cp_pulp_pressing
        - cp_pulp_release_handoff
        - cp_water_pressing
        - cp_water_release_handoff
      output: "D and water partition"
      source_ids:
        - epa-ap42-beet-1997
    - id: cr_burden
      applies_to: "each environmental exchange vector"
      rule: "A = F + opening WIP inherited vector − closing WIP inherited vector + attributable upstream vector + dedicated burden + residual common burden share − X. F is genuine new activity; exclude upstream/dedicated components already contained in F. X is only a proved same-side duplicate of the same exchange, never new repair water, material, failed production or a credit. Reconcile inventory vector by lot; post-release FG and services retain their own historical/current attribution."
      inputs:
        - F
        - opening_WIP_vector
        - closing_WIP_vector
        - upstream_vector
        - dedicated_vector
        - common_vector
        - X
        - cp_allocation_pressing
        - cp_allocation_release_handoff
        - cp_allocation_gate_service
      output: "A"
      source_ids:
        - ilcd-allocation-2010
    - id: cr_inventory_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q for Q > 0, once only. Convert raw units and attribute real burdens before this division. For physical exchanges use the full reconciled physical numerator V_i / Q without environmental co-product shares. Cards and collection aggregation refer to this same result; never divide an already normalized card by Q or H again. Internal transfer pairs cancel only in the combined model."
      inputs:
        - A_i
        - V_i
        - Q
        - cp_release
        - cp_allocation_pressing
        - cp_allocation_release_handoff
        - cp_allocation_gate_service
      output: "a_i"
      source_ids:
        - ilcd-allocation-2010
    - id: cr_fg
      applies_to: "gate_service"
      rule: "Opening released FG + current first-release physical inflow + external return received = closing released FG + gross dispatch + actual loss + other individually identified external exits. Current Q is already that inflow, not a second closing-FG addition. Preserve original delivery burden reversals and actual new service/rework separately; a re-delivery or retest never becomes new Q."
      inputs:
        - opening_FG
        - current_first_release
        - external_return
        - closing_FG
        - gross_dispatch
        - loss
        - cp_fg
      output: "FG and service ledger"
      source_ids:
        - sudz-pressed-pulp
        - ilcd-allocation-2010
    - id: cr_pack
      applies_to: "each packaging material"
      rule: "Opening empty + opening attached WIP/FG + opening reusable + procurement + external return received = closing empty + closing attached WIP/FG + closing reusable + material accompanying gross outward dispatch + external return outward + waste. Internal reuse cancels; attached package mass is excluded from Q and physical pulp mass."
      inputs:
        - opening_packaging
        - procurement
        - external_return_received
        - closing_packaging
        - gross_shipped_packaging
        - external_return_outward
        - packaging_waste
        - cp_pack
      output: "packaging_balance"
      source_ids:
        - sudz-pressed-pulp
        - ilcd-allocation-2010
    - id: cr_market
      applies_to: "residual joint vector only"
      rule: "Residual burden share for co-product k = contemporaneous common-gate value of k / sum of contemporaneous common-gate values of all actual co-products, only after al_context and al_causality. Report measured state quantities and values and sensitivity; apply only to the residual burden vector, never to V or Q."
      inputs:
        - common_gate_values
        - residual_common_vector
        - cp_allocation_pressing
        - cp_allocation_release_handoff
        - cp_allocation_gate_service
      output: "residual_burden_shares"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product and supplier"
      requirement: "Retain actual original product declaration and press/diffusion history; prove unmolassed fresh state and effective feed receiver independently of a generic family name."
      evidence: "Specification; traceable supplier hand-off; batch quality release"
    - id: dq_temporal
      applies_to: "campaign and stock vectors"
      requirement: "Cover the complete period including starts, stops, idle, failure, cleanup, returns and Q = 0; preserve original manufacture dates and burden vectors in opening stocks."
      evidence: "Meter coverage; mass/FG/WIP roll-forward; old/new lot links"
    - id: dq_measurement
      applies_to: "each raw numerator"
      requirement: "Retain calibration, sampling, uncertainty, physical state and independent conversion evidence; distinguish totals and rates, bulk wet mass and non-additive composition."
      evidence: "Scale and meter tickets; laboratory methods; raw files"
    - id: dq_sources
      applies_to: "evidence and gaps"
      requirement: "Manufacturer route/state families support scope, not a same-factory inventory or universal composition; historical EPA/VDZ evidence does not approve present chemicals or legal feed status. ILCD supports allocation method, not industrial technology. Disclose local missing data without inventing numbers."
      evidence: "Source-specific applicability; dated originals; gap register"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Evaluate these rules with complete section and ancestor context. Unknown core evidence is a hold, not a pass; mechanical checks do not approve methodology, translation or mapping."
    source_ids: []
  - rule_id: vr_identity
    applies_to: "eligible state"
    rule: "Require the complete qualifier set and original product/route evidence. A supplier name, classification, UUID name, successful download or schema alone does not establish fresh unmolassed pressed-pulp applicability. Keep a true identity gap unresolved."
    source_ids:
      - sudz-pressed-pulp
      - sudz-feed-route
      - sudz-bisz-pressed
  - rule_id: vr_uuid
    applies_to: "every proposed UUID"
    rule: "Before binding any UUID verify the complete original record, using a current direct read or an explicitly pinned public original, its native family/state/route/chemical constraints and its referenced property → unit group → reference unit chain, including declared versions where available. A pinned historical original is not a current platform readback. Separate physical flow identity from actual supplier/background compatibility. Unverified bindings remain absent."
    source_ids: []
  - rule_id: vr_quantity
    applies_to: "reference and stocks"
    rule: "Q has one first-release gate and wet-state basis in both languages. Check all failed/zero-output periods, WIP/FG roll-forward and old/new burden vectors. Gross dispatch, dry matter, sugar mass, nutrient content and heat value cannot substitute for Q."
    source_ids:
      - sudz-pressed-pulp
      - ilcd-allocation-2010
  - rule_id: vr_conservation
    applies_to: "process and combined balances"
    rule: "Reconcile wet physical mass, independently measured water and dry matter plus relevant elements; identify real species and compartments separately. No arbitrary reaction water, water-density substitution, two-unknown residual fit or COD/VOC-as-molecule shortcut."
    source_ids:
      - epa-ap42-beet-1997
  - rule_id: vr_scope
    applies_to: "conditional exchanges"
    rule: "Actual drying, molassing, pelleting or ensiling is a scope conflict, not a reason to delete its activity. Ordinary missing local quantity, auxiliary UUID or provider detail is a foreground collection gap; missing core product state or allocation basis remains a true hold."
    source_ids:
      - sudz-pressed-pulp
      - sudz-feed-route
      - vdz-beet-pulp-2005
      - ilcd-allocation-2010
  - rule_id: vr_once
    applies_to: "normalization and allocation"
    rule: "Reconcile raw unit conversion, dedicated attribution, common residual shares and inherited vectors before a single A/Q. Shares must sum to one for the residual common vector; never shrink physical wet pulp, water, waste or emission mass by an environmental share. Record sensitivity and uncertainty."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: vr_quality
    applies_to: "feed release and actual losses"
    rule: "Verify supplier-specific feed specification, residual sugar, foreign matter, hygiene and feasible fresh storage/transport window. Dated manufacturer examples are not universal limits or legal clearance. Record deteriorated or returned material and any actual environmental release rather than discarding the observations."
    source_ids:
      - sudz-pressed-pulp
      - sudz-bisz-pressed
      - vdz-beet-pulp-2005
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Eligible single feed-material supply to a declared receiver; link actual transport and use separately"
  allowed_use: "Only this pressed fresh unmolassed wet state with verified upstream hand-off, first-release Q and documented gate services"
  excluded_use: "Whole-leaf coverage; dry pellets; molassed pulp; silage; unpressed wet pulp; avoided feed credit; nutritional equivalence; feed safety certification"
  required_metadata: "All required qualifiers; provider state; exact boundaries; raw units; Q and H; WIP/FG and return history; dedicated/joint burden method; actual packaging and service attribution"
  required_quality_disclosure: "Identity evidence and unresolved UUIDs; original source limitations; actual sampling and meter coverage; upstream/provider applicability; uncertainty and price sensitivity; Q = 0 periods"
  update_trigger: "Changed extraction or pressing state; molasses addition; drying/pelleting/ensiling; new supplier or specification; changed common gate or prices; quality failure; new material or actual emission; verified UUID availability"
data_sources:
  - id: "sudz-pressed-pulp"
    type: "literature"
    reference: "Südzucker, Pressed Sugar Beet Pulp, publisher HTML, accessed 2026-11-20. https://www.suedzucker.com/product/pressed-sugar-beet-pulp/"
    used_for: "Primary product family: extracted then pressed wet feed material; fresh bulk supply and supplier-specific short storage window. No universal moisture, yield or allocation factor adopted."
  - id: "sudz-feed-route"
    type: "literature"
    reference: "Südzucker, Animal Feed Products from sugar beet, publisher HTML, accessed 2026-11-20. https://www.suedzucker.com/products/animal-feed/"
    used_for: "Primary route from cleaned beet through extraction and fresh pressing; further molassing/drying/pelleting is a distinct route."
  - id: "nord-beet-pulp"
    type: "literature"
    reference: "Nordzucker, Sugar beet pulp, publisher HTML, accessed 2026-11-20. https://www.nordzucker.com/en/sugar-expertise-products/animal-feed/sugar-beet-pulp"
    used_for: "Independent manufacturer family comparison of pressed, dried and molassed pulp; its variable dry-substance examples are not reference defaults. Dry-pellet storage advice is not wet-pulp guidance."
  - id: "sudz-bisz-pressed"
    type: "literature"
    reference: "Südzucker BISZ, Pressschnitzel, publisher HTML, accessed 2026-11-20. https://bisz.suedzucker.de/futtermittel/pressschnitzel/"
    used_for: "Single feed material from de-sugared pressed sugar beet; fresh versus ensiled state, product analysis and footnotes. Product-specific values do not establish nutritional equivalence or a universal specification."
  - id: "epa-ap42-beet-1997"
    type: "official_guidance"
    reference: "US EPA, AP-42 §9.10.1.2 Sugarbeet Processing, March 1997, pp.1–5 and Figures 9.10.1.2-1/2. https://www.epa.gov/sites/default/files/2020-10/documents/c9s10-1b.pdf"
    used_for: "Independent extraction/pressing process and press-water return; adjacent molassed dried route as counterexample. No dryer emission factor, fixed moisture or present chemical-use assumption imported."
  - id: "vdz-beet-pulp-2005"
    type: "handbook"
    reference: "Verein der Zuckerindustrie, Concept Animal Constituents in Sugar Beet Pulps, October 2005; English printed pp.23–28 and process annex pp.34–36. https://www.zuckerverbaende.de/wp-content/uploads/2021/08/vdz-konzept_tierische_bestandteile_2005.pdf"
    used_for: "Historical straight-feed pressing/fresh-use distinction and contamination-control process context; dried/molassed pulp and tops/tails are distinct. No current legal approval or universal zero-contamination claim."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA — Detailed guidance, first edition March 2010, §7.9.2–7.9.3, printed pp.255–265. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision, exchange-specific determining physical causality and only residual actual-state common-gate economic value; independent method evidence, not a beet-factory inventory or fixed allocation share."
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Explanatory Notes, 30 June 2025, pp.104 and 199. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "39149 includes beet-pulp and other sugar-manufacture waste and explicitly excludes cane bagasse 39141; adjacent 39130 starch residues and 23319 prepared feed are distinct. Classification does not prove process state or methodology approval."
