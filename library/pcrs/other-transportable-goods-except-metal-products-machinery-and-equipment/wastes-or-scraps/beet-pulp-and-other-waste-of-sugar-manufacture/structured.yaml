measurement_rules:
  - id: mu_reference
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use 1 kg net wet pressed pulp at first complete feed-quality release. Q is the measured sum of first releases of this exact state during H; dry matter is not Q. Packaging and free drainage separately removed before the defined scale point are excluded."
  - id: mu_dry_bridge
    applies_to: "each wet pulp stream"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record wet mass W and independently sampled dry fraction d at the same state; dry mass D = W × d and retained water = W × (1 − d) are non-additive subledgers. Never add D to W or infer W from an assumed moisture percentage."
  - id: mu_raw_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared numerator property"
      uuid: ""
    required_unit: "kg or kWh or MJ"
    rule: "Preserve each raw meter unit. Convert tonnes to kg by 1000 and kWh to MJ by 3.6 only where needed; retain the actual property. Integrate actual rates over recorded intervals once; a metered total volume is already integrated. Volume-to-mass requires independent density for that substance and measured state."
  - id: mu_press_water
    applies_to: "press liquor and retained water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure wet input and pressed output plus press liquor with its dissolved solids. Maintain water and dry-solids balances independently; press liquor returned to diffusion is a paired transfer or explicit external Product return. It is neither new water consumption nor simultaneous wastewater. One residual cannot determine two missing quantities."
  - id: mu_energy
    applies_to: "heat and electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ or kWh"
    rule: "Meter electricity separately. Imported steam, if actually used for cleaning, requires mass, pressure, temperature, dryness, enthalpy, condensate return and supplier water/energy convention. The heat energy and carrier mass are linked views; do not duplicate supplied heat or invent boiler fuel."
  - id: mu_once
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared numerator property"
      uuid: ""
    required_unit: "per 1 kg reference flow"
    rule: "Keep gross physical crossings V distinct from attributed inherited burdens A. Collection captures raw F and stock vectors; section 8 computes A/Q once for Q > 0. H is only the observation period. Q = 0 retains all real loads and stock attribution but has no unit result."
