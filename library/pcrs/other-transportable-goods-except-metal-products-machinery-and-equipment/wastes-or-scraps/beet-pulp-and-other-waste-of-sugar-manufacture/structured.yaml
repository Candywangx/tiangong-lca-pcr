system_boundary:
  rules:
    - rule_id: sb_scope
      applies_to: "route"
      rule: "Include real receipt, pressing when required, conveying, short holding, weighing, sampling, feed-quality release, cleaning and actual gate services. Stop at the declared factory-gate hand-off; link upstream supply once and disclose excluded downstream transport, storage, feeding and silage."
      source_ids:
        - sudz-pressed-pulp
        - sudz-feed-route
        - epa-ap42-beet-1997
        - vdz-beet-pulp-2005
    - rule_id: sb_state
      applies_to: "eligible reference state"
      rule: "Prove sugar-beet extraction origin, pressing, no added molasses, no drying/pelleting and no ensiling/deliberate fermentation. Sugar manufacture or a generic waste name alone is insufficient. Any actual excluded operation remains in real activity accounts and triggers a separate scope decision; do not erase its loads."
      source_ids:
        - sudz-pressed-pulp
        - sudz-feed-route
        - nord-beet-pulp
        - sudz-bisz-pressed
        - vdz-beet-pulp-2005
    - rule_id: sb_joint
      applies_to: "supplier hand-off"
      rule: "Separate product eligibility from legal disposition and allocation. Wet state, low price, a feed buyer or the word waste never establishes zero inherited load. Do not move sugar-specific crystallisation/drying or carbonatation lime into a fictitious pulp-only process; supplier evidence must delimit common and dedicated stages."
      source_ids:
        - epa-ap42-beet-1997
        - ilcd-allocation-2010
    - rule_id: sb_loops
      applies_to: "press water and internal transfers"
      rule: "Only matching endpoints cancel internal transfers. Press water returned to an external diffuser has a measured hand-off and agreed solids/water/burden convention; do not also count it as external fresh-water intake, wastewater, second product revenue or automatic credit. Actual discharged press liquor uses the separate waste route."
      source_ids:
        - epa-ap42-beet-1997
        - ilcd-allocation-2010
    - rule_id: sb_physical
      applies_to: "stocks and all material exits"
      rule: "Maintain manufacturing, FG service and combined physical balances in the same wet state. Include opening/closing WIP, pending tests, failures, start/stop, idle, cleanup, rework, samples, spoilage, soil/sand, actual drains and evaporation. Physical masses never receive environmental allocation shares."
      source_ids:
        - epa-ap42-beet-1997
        - vdz-beet-pulp-2005
        - ilcd-allocation-2010
    - rule_id: sb_expansion
      applies_to: "additional actual exchanges"
      rule: "Conditional cards are identity-specific possibilities, not claims of site use. Add each actual unlisted reagent, purchased formulation, carrier, spare part, package, residue and environmental species as its own measured exchange before model completion; no other or zero bundle can hide it. Purchased formulations are one whole-product procurement; assay and carrier water are non-additive subaccounts."
      source_ids:
        - epa-ap42-beet-1997
        - vdz-beet-pulp-2005
    - rule_id: sb_classification
      applies_to: "classification scope"
      rule: "Keep cane bagasse in 39141 and starch-manufacture residues in 39130; molasses and unprocessed beet root remain separate products. This record does not claim every residual in 39149 or any mixed-feed formulation."
      source_ids:
        - un-cpc3-notes-2025
boundary_abstraction:
  declared_starting_condition: "Either freshly extracted unpressed sugar-beet pulp at the diffuser hand-off or already pressed eligible pulp at supplier hand-off; declare exactly which. Upstream sugar-beet cultivation/supply, washing, slicing and diffusion plus shared sugar/pulp/molasses burdens are transferred once."
  starting_condition_role: "Verified intermediate manufacturing hand-off; physical state and upstream burdens are explicit"
  product_classification_scope: "Narrower eligible pressed fresh feed-material endpoint within CPC 3.0:39149; other residues in that leaf remain outside"
  recursive_input_rule: "Received already pressed pulp and genuine returns carry their original lot and inherited vector once; do not reapply nonexistent pressing, duplicate upstream supply or count a repeated release as new Q."
  upstream_dataset_requirement: "Obtain one actual supplier hand-off with product state, batch, upstream process inventory, subdivision/allocation method, common-gate quantities and burden vector. Link cultivation and each genuine utility/material supplier. A flow name alone does not qualify a background provider."
  disclosure: "Disclose all physical gates, inherited vectors, first-release Q, stock movements, actual post-release services, losses, failed lots, returns, quality windows, source limitations and unbound identities."
