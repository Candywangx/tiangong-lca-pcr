allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following rules apply only to attributional multifunctionality requiring allocation. They partition environmental burdens after technical separation; they never change the physical ledger. Real product/waste status and return endpoints require their own evidence."
    source_ids: []
  - rule_id: al_context
    applies_to: "attributional joint burdens"
    rule: "Use this hierarchy only for declared attributional modelling where allocation is required. First subdivide measured dedicated processes; then use technically justified virtual subdivision. Dedicated pulp pressing, conveying and eligible supply are assigned to pulp once; sugar-only or molasses-only finishing is excluded from that dedicated account."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: al_causality
    applies_to: "each remaining shared exchange"
    rule: "Identify an exchange-specific determining physical causal relationship and justify how changing each co-function changes that exchange. Physical presence, wet mass, dry matter, energy content or a generic physical preference is not by itself that causal proof. Keep evidence and sensitivity for unresolved relationships."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: al_residual
    applies_to: "genuinely unresolved common burdens"
    rule: "Only for the residual not resolved above use contemporaneous market values at the same common-process gate and actual state for all true co-products. Remove later dedicated transport/conditioning costs from downstream prices; disclose quantities, price period, currency, gate reconstruction and sensitivity. No default ratio is prescribed."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: al_vectors
    applies_to: "physical V and inherited A"
    rule: "Apply burden shares only to the joint environmental inventory vector. Preserve full physical sugar/pulp/molasses/press-water outputs and physical conservation independently. Supplier allocated burden is inherited once with its method; do not allocate it again at pulp receipt or scale wet product mass by the burden fraction."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: al_status
    applies_to: "co-product or return or waste"
    rule: "Determine status from actual specification, effective receiver, processing history and applicable disposition evidence plus the supplier method. Preserve truly discarded material and treatment attribution; negative or zero price alone does not erase production. Internal returns are not co-products. No assumed avoided concentrate-feed, fertilizer, fuel, recycling or substitution credit is permitted."
    source_ids:
      - sudz-pressed-pulp
      - epa-ap42-beet-1997
      - ilcd-allocation-2010
