  classification_decision: Accepted narrower association under docs/adr/2026-11-21-accept-cpc-39217-worn-cotton-jersey-shirts-for-rewear.md.
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  blocking_issues:
    - Core direct-rewear worn cotton T-shirt Product identity is not confirmed;
      a compatible native identity and scientific review remain outstanding.
  ordinary_data_requirements:
    - Actual source/receiver and lot cotton/trim/soil/moisture identity,
      cleaning and repair needs, first-release mass and complete
      WIP/FG/packaging/service records are foreground collection requirements,
      not fabricated factory observations.
    - Actual historical attribution/status/value trajectory and true-joint gate
      must be established without default zero burden; no numerical allocation
      or lifespan is preapproved.
    - Auxiliary thread/lint/reject/effluent/sack-waste UUIDs and actual provider
      compatibility remain explicit; they do not by themselves mandate draft
      maturity.
  scope_note: Authored technical synthesis for adult single-layer short-sleeved
    round-neck cotton-knit worn shirts, direct rewear in LDPE sacks. The narrower
    association was accepted after independent review. Actual knit/cotton/trim,
    wear, recipient, grade, cleaning/repair and packaging remain foreground
    requirements. Structural checks confer no scientific approval.
