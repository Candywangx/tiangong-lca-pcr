allocation_rules:
  - rule_id: a_scope
    applies_to: "all allocation"
    rule: "Use only attributional inventory accounting in an allocation-requiring situation consistent with the study goal. This is not a consequential substitution model; no avoided new clothing, avoided landfill or automatic recycling credit."
    source_ids:
      - ilcd-2010
  - rule_id: a_subdivide
    applies_to: "all shared processes"
    rule: "First assign dedicated collection/preparation work and embodied inputs by measured subdivision or technically demonstrated virtual subdivision. Assess each remaining exchange’s determining physical causality, including duration with limiting volume/mass for transport or storage; a single mass split for every load is not justified."
    source_ids:
      - ilcd-2010
  - rule_id: a_residual
    applies_to: "remaining shared inventory"
    rule: "Only genuinely unresolved residual common-process loads may use contemporaneous market value for each output/service in its actual state and amount at the same process gate. Document why subdivision and exchange-specific physical causality fail; remove later transport, washing, packing or retail margins from downstream prices. Reconcile shares to the full unallocated vector."
    source_ids:
      - ilcd-2010
  - rule_id: a_history
    applies_to: "source_shirts; historical vector"
    rule: "Retain each article’s manufacture, prior wearing/maintenance and recovery history without assigning the same historical exchange twice. Identify the technically equivalent true joint article-production gate and actual value/status trajectory; ordinary use-phase laundry belongs to the wearing service that caused it, not automatically to current reuse preparation. For a positive/nonnegative-valued article with limited inherent change, assess supported cycles/quality and physical attribution under ILCD §§7.9.3VI and14.4; if needed data cannot be obtained or approximated, justify the permitted value-based fallback and its uncertainty. Do not infer an infinite lifetime or recycling rate from a garment’s weight."
    source_ids:
      - ilcd-2010
  - rule_id: a_waste_transition
    applies_to: "negative-value intake"
    rule: "Where intake has negative market value, locate the actual step creating the first valuable reused article. Keep earlier waste-management responsibility with the first system; identify the true joint process and apply ILCD’s additional transition-step allocation rather than burden-free intake. Gate fees use their actual status and absolute value only in that specified transition allocation. Donated/zero-priced transfer alone does not establish a waste status or zero environmental history. Missing status, transition or history is unresolved, not a default cutoff."
    source_ids:
      - ilcd-2010
  - rule_id: a_rejects
    applies_to: "rejects and reusable packaging"
    rule: "Value and intended route determine whether a rejected cotton shirt is an actual co-product or waste requiring treatment. Record each separated physical fraction and real destination; no automatic scrap sale or credit. Reusable sacks retain their own measured lifetime/usage attribution; internal reuse is not fresh procurement or garment Q."
    source_ids:
      - ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_source
      process_id: "p_collect"
      flow_role: "Whole source article and inherited vector"
      record_type: "handover and history ledger"
      raw_fields: "source owner; article/lot; date; gross/tare/net mass; main fabric; trim/soil/moisture fractions; prior use and maintenance; gate status/value; historical raw exchange vector; history attribution decision"
      collection_method: "Calibrated net weighing plus provenance and composition checks; reconstruct attributed historical manufacture/use/recovery with documented true-joint gate; do not invent an absent record"
      unit: "kg; native exchange units"
      frequency: "Each source lot and history revision"
      temporal_coverage: "Declared reporting window plus complete original-cohort history and post-release events"
      site_scope: "Actual named source/collection/preparation/storage sites; identify outsourced boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Dated original records; calibrated measurement; custody/provider scope; uncertainty; reconciled totals and retained gaps"
