measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of unique new positive first-release net masses in cp_release after all necessary cleaning/repair, garment acceptance and sack packing. Measure whole as-accepted shirts including actual moisture and retained trims; exclude sacks. Reinspection, each wear, resale, old-lot returns and dispatch do not add Q."
  - id: raw_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Original measured property"
      uuid: ""
    required_unit: "kg; MJ; kg*km"
    rule: "Convert raw quantities before attribution. kWh × 3.6 gives MJ once. Actual rates require integration over the recorded interval; already integrated quantities do not get another time factor. Volume-to-mass requires independent material-specific density at the measured temperature/pressure. No generic density or kg per garment is supplied."
  - id: whole_supply
    applies_to: "source_shirts; wash_detergent; repair_thread"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record each whole supplied garment or purchased formulation once. Cotton content, original trims, detergent active matter and carrier water are constituent subledgers, not additional purchases. On-site mixing instead requires each actual separately purchased ingredient and real mixing energy/loss as individual exchanges."
  - id: phase_mass
    applies_to: "physical ledgers"
    required_property_ref:
      name: "Mass and composition"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile total physical mass separately from water, cotton solids and each relevant trim/soil/formulation constituent. Washing and drying do not imply polymer conversion or reaction water. Free liquid, retained moisture and vapour differ from chemically bound water. COD/TOC are indicators, not a named chemical mass. One balance residual cannot solve two unknown outlets."
