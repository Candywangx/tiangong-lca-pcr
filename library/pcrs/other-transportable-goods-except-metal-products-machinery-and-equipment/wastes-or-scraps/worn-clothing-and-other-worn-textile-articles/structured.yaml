system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "p_collect; p_prepare"
      rule: "Include source handover, real pickup/transport, receiving/unpacking, individual sorting and condition assessment, necessary actual cleaning/drying and minor repair, inspection and bulk sack packing. Preserve rejected fractions. Do not substitute a charity collection total or purchased finished-shirt packaging inventory."
      source_ids:
        - jrc-textile-2025
        - austria-reuse-2019
    - rule_id: b_identity
      applies_to: "reference product"
      rule: "The chosen article remains an adult cotton-knit T-shirt for wearing. Verify appreciable prior wear and bulk sack presentation independently from direct-rewear suitability. New/unworn articles and material suitable only for rags or fibres are outside. UN CPC gives the category title only; the trade-condition basis here is WCO Chapter63 Note3."
      source_ids:
        - unsd-cpc-2025
        - wco-hs63-2022
    - rule_id: b_cleaning
      applies_to: "p_prepare"
      rule: "Choose actual item/cohort cleaning needs and fibre/care-compatible procedures; no universal wash temperature, dose, hygiene claim, repair rate or drying energy is supplied. The representative aqueous route uses whole laundry liquid and electric drying when needed. Dry cleaning, hazardous contamination, medical/protective decontamination or substantial reconstruction require another review and complete atomic inventory."
      source_ids:
        - austria-reuse-2019
        - jrc-textile-2025
    - rule_id: b_completeness
      applies_to: "all processes"
      rule: "Keep failed runs, Q0 cohorts, startup/shutdown, idle, cleanup, repeat washing and real rework. Add every actual omitted single formulation, fuel, utility, packaging component, separated waste and emitted species before asserting completeness. No other-material bucket or unsupported zero substitutes for a real exchange."
      source_ids: []
    - rule_id: b_utilities
      applies_to: "electricity; heat; water"
      rule: "The selected branch has electric washing/drying and handling. Do not copy a nonexistent boiler/steam/combustion inventory. If another actual heat route occurs, add each fuel, combustion gas species, steam or heat input and external condensate/heat-exchanger-water Product return separately, with actual state/enthalpy and supplier water/energy conventions; cancel internal circuits."
      source_ids: []
    - rule_id: b_stocks
      applies_to: "Q; FG; V"
      rule: "At first release, Q already includes released garments still in closing FG. Maintain opening FG + Q + external returns received = closing FG + gross physical dispatch V + real FG losses/transfers. Do not add closing FG to Q. Preserve original-dispatch reversal and old-cohort burdens on returns; extra cleaning/repair is incremental load, not new garment production."
      source_ids: []
    - rule_id: b_services
      applies_to: "p_service"
      rule: "Store raw post-release storage/handling/repacking loads H_i against original released cohort c. Join them into that cohort’s numerator before calc_normalize; do not put old-FG services onto unrelated current Q. Gross dispatch V and returned shipments remain physical diagnostics. Combine gates by cancelling internal T and Q transfers."
      source_ids: []
    - rule_id: b_provider
      applies_to: "all provider and outlet rows"
      rule: "Separate whole-outlet totals from source partitions: collect either measured partition amounts or a total with exhaustive non-overlapping shares, never both added. Match each stream to one provider/treatment boundary. An outsourced freight/treatment dataset already including fuel, emissions or losses must not be duplicated with direct rows."
      source_ids: []
    - rule_id: b_native
      applies_to: "UUID-bearing and unbound rows"
      rule: "All native restrictions in each card are mandatory product context. The worn-shirt core is unbound: manufactured-shirt, generic cloth and unusable-production-waste candidates do not establish a reusable worn garment. No surrogate UUID or inferred database-wide absence is asserted. Method use requires resolution of this core identity and actual-gate compatibility."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Whole post-use cotton T-shirts at source-owner handover, before collection/sorting/preparation; include assigned upstream garment history separately from current preparation activities"
  starting_condition_role: "Post-use whole-article input; a finished reused-shirt purchase/repacking gate is not the starting point"
  product_classification_scope: "One direct-clothing-reuse branch within CPC 3.0:39217; rags and recycling-only materials excluded"
  recursive_input_rule: "Internal T transfers and unaccepted rework retain inherited vectors and cancel on combination. Previously released returned garments retain original cohort identity; they are not a new source purchase or new Q. External prepared garments require separate applicability review."
  upstream_dataset_requirement: "Use one compatible provider for each actual purchase/service; retain route, geography, time and included transport/packaging. Carry the documented historical garment exchange vector exactly once, including the attributed manufacture, past maintenance/use and recovery steps; never assume donated means burden-free."
  disclosure: "Report separate collection, preparation/first-release, FG-service and combined gates; raw physical balances, mixed collection partitions, history attribution and unresolved identity remain explicit"
