      record_type: "service event and meter ledger"
      raw_fields: "original cohort; event/time; occupied space/duration; meter/raw exchange; idle/cleanup; storage/handling/repacking task; causal driver; stock return attribution"
      collection_method: "Collect undivided real raw loads by original released cohort; cross-reference cp_pack/cp_fg and apply demonstrated allocation before joining H into that cohort numerator"
      unit: "kWh; MJ; kg"
      frequency: "Every service event and meter interval"
