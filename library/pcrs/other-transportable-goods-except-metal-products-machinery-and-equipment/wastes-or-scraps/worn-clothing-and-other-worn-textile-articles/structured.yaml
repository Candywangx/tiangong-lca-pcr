  calculation_rules:
    - id: calc_convert
      applies_to: "all inventory rows"
      rule: "Convert each undivided raw observation into its exchange unit before attribution; electricity_MJ = measured_kWh * 3.6; freight_kgkm = sum(payload_kg * distance_km) for matched actual legs. Use independently supported density/state for any volume conversion and integrate only genuine rates."
      inputs:
        - raw_observations
        - measured_kWh
        - payload_kg
        - distance_km
        - density_state
      output: "converted_raw_observations"
      source_ids: []
    - id: calc_attribute
      applies_to: "all inventory rows"
      rule: "Build raw per-exchange A_i by source/cohort after applicable §7 history and shared-process attribution: opening WIP inherited vector + attributed current additions + original-cohort raw H_i - closing WIP inherited vector - explicit transfers assigned to other cohorts. Reconcile each destination vector to its physical quantity. Preserve failed/Q0/idle/cleanup loads and unresolved assignments; do not discard them or silently spread them over unrelated Q. F_i is only genuinely new unrecorded same-direction load; X_i is only an exactly proven duplicate on that same side (including an upstream-contained exchange). F_i and X_i cannot balance unknown losses or remove a necessary opposite-side return."
      inputs:
        - converted_raw_observations
        - inherited_vectors
        - allocation_decisions
        - H_i
        - F_i
        - X_i
      output: "A_i"
      source_ids:
        - ilcd-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_i = A_i / Q for Q > 0, once, on the matched first-release cohort; Q = sum of unique accepted net release masses in cp_release. Reference production is 1 kg; T/Q, V/Q and packaging-attached diagnostics express gate ratios and are not additional external supplies. At Q = 0 retain raw inventory and unresolved cohort assignments and issue no unit result. Cards and protocol aggregation only reference this calculation; never divide an already normalized q_i again."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "q_i"
      source_ids: []
    - id: calc_physical
      applies_to: "physical ledgers"
      rule: "For each physical process/cohort: opening WIP + all real material receipts = closing WIP + all distinct physical material outlets. Preparation production output is Q + actual rejects/lint/effluent/vapour, not Q + closing FG. FG gate: opening FG + Q + external returns received = closing FG + V + actual FG losses/transfers. Combined collection/preparation/FG balance cancels internal T and Q transfers, retains opening/closing WIP and FG, all external material legs and actual water/species states. Balance physical mass and relevant components independently of allocation shares."
      inputs:
        - cp_source
        - cp_transfer
        - cp_release
        - cp_outlet
        - cp_water
        - cp_fg
      output: "physical_reconciliation"
      source_ids: []
    - id: calc_packaging
      applies_to: "all packaging rows"
      rule: "For each component and the same physical pool: opening(empty + WIP-attached + FG-attached + reusable) + all purchased packaging receipts + first non-purchase external receipts + proven same-item external returns received = closing(empty + WIP-attached + FG-attached + reusable) + attached packaging on gross physical dispatch V + external empty returns sent + waste. Purchased receipts include standalone and bundled purchases. First non-purchase receipts include sacks arriving with garments and separate loans/free transfers, even when omitted from a supplier inventory. A true return must trace the same physical sack to its prior dispatch from this site; an untraced incoming sack is not a return. Assign each physical receipt once. Record actual procurement, freight and service burdens once, net of proven provider inclusions only; missing supplier data is pending, never zero. Internal attachment/detachment/reuse cancels; source packaging retains its real inherited burden without manufacturing it again. No packaging mass enters garment Q."
      inputs:
        - cp_pack
        - V
        - packaging_stock_states
      output: "packaging_reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all garments and native references"
      requirement: "Resolve the worn-shirt core before methodology acceptance; verify whole native record and its actual supplier/route/form/type/property chain. All §3 qualifiers and every native restriction must remain in consumable product context. Unreadable composition/unknown old-clothing origin is not a passed identity check."
      evidence: "Source custody and composition evidence; exact direct/support records; applicability decision"
    - id: dq_measure
      applies_to: "all raw fields"
      requirement: "Keep calibration, tare and moisture methods, complete failed/idle/Q0 records, original units, independent density when required, time intervals, uncertainty and any reconciliation discrepancy; missing is not zero."
      evidence: "Calibration and batch/meter logs; independent samples and balance residuals"
    - id: dq_history
      applies_to: "source history and shared allocation"
      requirement: "Keep raw historical/current/service vectors separately, explicit status/value trajectory, true joint gate, subdivision/physical-causality decisions, residual same-gate values and sensitivity. A zero price is no history waiver."
      evidence: "Traceable upstream studies and history/transition decision; complete share reconciliation"
    - id: dq_completeness
      applies_to: "whole physical gates"
      requirement: "Record source partitions exhaustively without overlap and one provider per exchange. Inspect all actual materials, utilities, wastes and emitted species; add omitted atomic rows. Check independent whole/component and complete packaging balances with WIP/FG inheritance."
      evidence: "Custody manifests; raw balance and provider-boundary audit"
    - id: dq_time
      applies_to: "all collection protocols"
      requirement: "Use one declared site/reporting window plus original-cohort history and actual post-release service periods. Disclose older evidence, geographical transfer, operator-selected grades, unknowns and uncertainty; synthesis is not one observed order or factory."
      evidence: "Dated source and site records; condition-specific applicability review"
validation_rules:
  - rule_id: v_scope
    applies_to: "applicability"
    rule: "Verify adult cotton-knit T-shirt identity, appreciable wear, bulk presentation, actual reuse market and safe functional acceptance independently. Neither a cotton label nor a collection sack alone proves direct rewear. Reject new clothes and recycling-only rags from Q."
    source_ids:
      - unsd-cpc-2025
      - wco-hs63-2022
      - austria-reuse-2019
  - rule_id: v_uuid
    applies_to: "native identity"
    rule: "Reject mismatched route/form/grade/media/type/CAS, even with a similar basename or classification. Verify exact reference property and unit-group versions outside canonical text, and actual reference unit. Ordinary provider/auxiliary UUID gaps remain explicit; the unresolved core prevents a complete usable identity."
    source_ids: []
  - rule_id: v_basis
    applies_to: "Q; A_i; H_i"
    rule: "Check one first-release denominator and exactly one calc_normalize application after raw conversion and attribution. Reject duplicate first-release IDs, dispatch/return/each-wear production, closing-FG duplication, hidden Q0 loads, lost WIP/FG vectors or an extra division."
    source_ids: []
  - rule_id: v_mass
    applies_to: "all physical gates"
    rule: "Check collection/preparation/FG and combined physical balances independently of allocation, with distinct actual species/water phases, complete packaging complete and source-partition reconciliation. Multiple unresolved outlets cannot be fitted from one residual; unresolved discrepancies are findings."
    source_ids: []
  - rule_id: v_allocation
    applies_to: "history and shared processes"
    rule: "Check documented history/status/value and true joint process, then subdivision, exchange-specific determining physical causality and only remaining same-gate economic residuals. No free choice of mass/economic share, default zero-history input, fixed reuse proportion or avoided-new-clothing credit."
    source_ids:
      - ilcd-2010
  - rule_id: v_complete
    applies_to: "dataset and claim"
    rule: "Report performed/skipped checks, findings, missing evidence and scope completeness. Structural/projection/measurement checks do not establish scientific, translation, supplier or legal approval. Missing core identity or actual route/history evidence remains unresolved; do not advertise full coverage or a unit result for Q0."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Attributed supply of this specified prepared worn garment at the declared first-release gate, with cohort-bound post-release services"
  allowed_use: "Use only after core identity, route and history applicability are resolved and required foreground data are collected; disclose candidate methodology and uncertainty"
  excluded_use: "New garment manufacturing; per-wear functional comparisons; automatic substitution/credit; mixed collection or fibre-recycling dataset; unknown-endpoint exports"
  required_metadata: "All §3 qualifiers; source/receiver and custody; first-release gate/cohort; raw Q and A vectors; native restrictions; provider boundaries; historical allocation and stock/service links"
  required_quality_disclosure: "Core and auxiliary identity gaps; actual electricity provider/native property gap; operator-specific acceptance and cleaning; historical uncertainties; geographic/temporal transfer; actual measurement completeness and mass/packaging discrepancies"
  update_trigger: "Changed garment family, reuse market/grade, waste status, cleaning/repair/heat route, provider, native identity, reference gate or material evidence"
data_sources:
  - id: "unsd-cpc-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 explanatory notes, 30June2025, PDF pp200–201; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Complete notes, PDF pp200–201: 39217 has a title but no further inclusion text; 39214–39216 fibre wastes and 39218 rags are excluded from this intact clothing branch"
  - id: "wco-hs63-2022"
    type: "official_guidance"
    reference: "WCO HS2022 Chapter63 Note3; https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/1163_2022e.pdf"
    used_for: "Appreciable-wear and bulk/bale/sack presentation as separate trade-state conditions; not a lifecycle burden rule"
  - id: "jrc-textile-2025"
    type: "literature"
    reference: "Bakowska et al., Fate and Composition of Textile Waste from Italy, the Czech Republic and Romania, JRC141441 (2025), Annex 3, printed pp69–73 (PDF pp73–77); https://doi.org/10.2760/3332076"
    used_for: "Observed sorting context, operator/market-specific reuse selection, T-shirt category and wiper/recycling counterexamples; technical synthesis only, no transfer of study yields or default garment mass"
  - id: "austria-reuse-2019"
    type: "official_guidance"
    reference: "Meissner et al., Guide to determining the end-of-waste status in the preparation for reuse, November2019, §§1–2 and5.1; https://www.umweltberatung.at/download/?id=Prep-for-Re-Use_end-of-waste-guide_Austria_2019.pdf"
    used_for: "General garment assessment sheet: checking, actual necessary cleaning/repair, function/safety and documentation; Austrian guidance is methodological evidence, not universal legal clearance or a wash recipe"
  - id: "ilcd-2010"
    type: "handbook"
    reference: "European Commission JRC, ILCD Handbook General guide — Detailed guidance, First editionMarch2010, §§7.9.2–7.9.3 and14.4; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation hierarchy and explicit reuse/history/status/true-joint-process conditions; no product-specific shares or fixed lifespan"
  - id: "pacific-sorting"
    type: "literature"
    reference: "Pacific Clothing Recyclers, Product Process; https://pacificclothing.ca/product-process/"
    used_for: "First-party sorting and men’s short-sleeved cotton round-neck shirt grade, knit/woven distinction, individual reinspection and packing; no transferred yield, bag material or wash/repair assumptions"
  - id: "eu-textile-2025"
    type: "official_guidance"
    reference: "Directive (EU) 2025/1892, recital 23 and Article 22d sorting/direct-reuse provisions; https://eur-lex.europa.eu/eli/dir/2025/1892/oj/eng"
    used_for: "Legal-status and destination-relevant reuse evidence distinction, only within applicable jurisdiction; not CPC identity or universal clearance"
