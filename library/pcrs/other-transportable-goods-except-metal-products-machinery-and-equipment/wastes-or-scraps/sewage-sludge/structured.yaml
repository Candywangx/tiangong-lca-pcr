system_boundary:
  rules:
    - rule_id: bound_handover
      applies_to: "handover"
      rule: "End at first measured accepted bulk handover before receiver treatment or mixing. Local sludge, later thermal hydrolysis, digestion, dewatering and land application are excluded. Record first source release and receiving acceptance separately; transfers, resale and returns do not create new production."
      source_ids:
        - leigh-permit-2024
    - rule_id: bound_provider
      applies_to: "all inventory rows"
      rule: "Source provider owns separation, storage and loading before dispatch; haul provider owns actual road transport and its fuel/emissions. Verify unloading inclusion at the chosen interface. No duplicate site energy, diesel or emissions from an already complete provider. Missing provider data is unknown, not zero."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: bound_bulk
      applies_to: "handover"
      rule: "Bulk sludge excludes transport tank and vehicle tare; neither is purchased packaging. No bag/pallet pool is assumed. If actual packaging crosses the boundary, extend the method with one atomic row per component/event: purchases, first external nonpurchase receipts even supplier-accompanying/borrowed, and true returns traced to prior dispatch. Reconcile all stocks, dispatches and waste; charge actual procurement/transport/service once."
