allocation_rules:
  - rule_id: alloc_history
    applies_to: "raw_sludge"
    rule: "Declare the study waste boundary. Trace the source burden vector and subdivide separation/loading from wastewater treatment where feasible; apply evidenced causal allocation to remaining multifunctional exchanges. Do not silently assume zero history. A waste treatment fee is not positive sludge co-product revenue; do not apply fertilizer value, nutrient substitution or avoided-disposal credits. Unresolved allocation blocks a complete upstream result."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: alloc_haul
    applies_to: "tanker_transport"
    rule: "Use actual provider payload and route records; segregate other consignments. Allocate shared haul by justified physical causality and disclose empty return treatment. Do not split the sludge mixture into additional water and solids products."
    source_ids:
      - jrc-ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "handover"
      flow_role: "Sludge lot and provenance"
      record_type: "Weigh tickets and acceptance ledger"
      raw_fields: "gross; tare; retained tank heel; original source-entry wet mass; dispatch attempt ID; parcel lineage; first valid acceptance ID/date; accepted net mass; rejection event; actual return event; terminal destination; free liquid; measured volume/density/state/sample IDs if used; opening/closing unaccepted source and transit stocks; losses; source ID; receiver; date; original release; ownership"
      collection_method: "Calibrated matched before/after weighing at actual transfer; verify retained heel and acceptance. Preserve lot links, source raw-state proof and actual acceptance test specification."
      unit: "kg"
      frequency: "Each lot"
      temporal_coverage: "Entire reporting period with spanning cohorts"
      site_scope: "Source dispatch to pre-mixing receiver gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration, signed receiver record, stock and loss reconciliation"
    - protocol_id: cp_solids
      process_id: "handover"
      flow_role: "Matched dry solids"
      record_type: "Representative laboratory record"
      raw_fields: "lot; dish; wet dish; dried dish; method edition; sampling; free liquid; uncertainty"
      collection_method: "Representative same-lot sample, homogenization, actual validated gravimetric method and QC. EPA draft example is not required UK compliance."
      unit: "kg; %"
      frequency: "Each qualified lot"
      temporal_coverage: "Same handover period"
      site_scope: "Same lot before mixing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Chain of custody, method scope, lab QC"
    - protocol_id: cp_haul
      process_id: "handover"
      flow_role: "Tanker freight"
      record_type: "Provider trip ledger"
      raw_fields: "lot/parcel ID; leg ID/date; dispatch attempt; wet payload; loaded km; mode; provider; loaded return; empty return; cleaning; included scopes; original source vector; opening absolute vector; new actual increments; accepted/carry/terminal/unresolved disposition; allocation"
      collection_method: "Match measured consignment payload with actual trip distance and supplier scope; record burden history separately."
      unit: "kg; km"
      frequency: "Each trip"
      temporal_coverage: "Whole period including failed deliveries"
      site_scope: "Actual source/receiver route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Trip records, provider inventory and overlap audit"
  calculation_rules:
    - id: accepted_mass
      applies_to: "reference_product"
      rule: "Q = sum of net wet parcel masses at their first valid receiver acceptance in this period, in kg, with original lot/parcel lineage and acceptance ID/date. A pre-acceptance rejection and return contribute no Q; a returned unaccepted parcel may contribute Q once when first validly accepted later. Redispatch, repeat acceptance and returns after an already valid acceptance create no new Q. Keep post-acceptance return/service events in a separate gross ledger linked to the original accepted cohort. For Q = 0 retain itemized absolute accounts without a per-kg result."
      inputs:
        - cp_mass
      output: "Q"
      source_ids:
        - leigh-permit-2024
    - id: solids_mass
      applies_to: "reference_product"
      rule: "f_DS = (dried_dish - dish) / (wet_dish - dish); DS_lot = wet_lot * f_DS. Sum lot solids masses; do not average percentages unweighted. Complementary loss on drying is operational, not pure free-water identity."
      inputs:
        - cp_solids
        - cp_mass
      output: "f_DS; DS_lot"
      source_ids:
        - epa-solids-1684-draft-2001
    - id: transport_work
      applies_to: "tanker_transport"
      rule: "T = sum(payload_kg * loaded_km / 1000), in t km, over actual uniquely identified legs. Payload is wet sludge excluding tank/vehicle. A loaded return and a later redispatch are separate actual legs, not cancellations or new source production. Assign each leg to its lot and accepted, carried, terminal or unresolved absolute account; a carry transfer adds no new t km. Incorporate actual provider empty-return burdens once without inventing loaded work for an empty leg."
      inputs:
        - cp_haul
      output: "T"
      source_ids:
        - jrc-ilcd-2010
    - id: normalize_inventory
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q exactly once for Q > 0. A_i includes only the absolute exchange vector settled to this period first-valid-accepted parcels after evidenced conversion/allocation, including their brought-forward source history and prior actual haul plus current increments. Exclude closing unsettled, terminal-rejected/lost and unresolved cohort vectors from this numerator; report them separately, not spread over current Q. Never divide an already normalized provider result again. Later attributable services after valid acceptance attach only to their original accepted cohort quantity Qc, as separately dated increments, not to unrelated current Q; no new source vector or Q. For Q = 0 retain all absolute subaccounts and carry links."
      inputs:
        - cp_mass
        - cp_haul
        - A_i
        - Q
      output: "a_i"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "Reconcile two physical ledgers per period in wet kg: O_transit + D_gross = E + R + J_transit + L_transit + C_transit; O_source + N + R = D_gross + J_source + L_source + C_source. O/C are opening/closing unaccepted stocks; source stock includes returns eligible for redispatch, and transit stock includes receiver-held material not yet accepted. N is original source material entering this chain once; D_gross is each actual dispatch, R actual return to source, E first valid acceptance, J material transferred to separate terminal-rejection management, and L measured loss. J, R, E, L and closing transit outcomes are mutually exclusive; a rejection event is not an extra mass term. Returned material awaiting redispatch counts as R and source stock, not J; splits require separately weighed parcel identities. Consolidation cancels D_gross and R: O_source + O_transit + N = E + J_source + J_transit + L_source + L_transit + C_source + C_transit. Later returns of already accepted material use the separate gross ledger in accepted_mass, not this first-acceptance ledger."
      inputs:
        - cp_mass
      output: "wet_mass_ledgers"
      source_ids:
        - jrc-ilcd-2010
    - id: cohort_accounts
      applies_to: "all inventory rows"
      rule: "Record an absolute per-exchange vector H for each original lot and traceable parcel: H_open + H_new = H_accepted + H_carry + H_terminal + H_unresolved, separately for every exchange. This balance covers the chain up to first valid acceptance or terminal disposition; post-acceptance service increments use the separately dated original-cohort ledger in normalize_inventory, outside this balance. H_new contains only original source history entered once and newly incurred actual haul/services; return and redispatch move the same history, adding only real new legs/services. H_accepted belongs to this period first-valid-accepted parcels; H_carry belongs to unaccepted source/transit stocks and transfers exactly per exchange into next-period opening; H_terminal separately retains terminal rejection/loss handling. Unknown attribution remains H_unresolved, never a balancing plug or a charge to accepted parcels. Split parcels require measured mass and evidenced causal vector partition; shared processes need evidenced allocation first, otherwise remain unresolved. Close wet kg, individual exchanges and t km separately, never as substitutes for each other. Retain all absolute subaccounts when Q = 0."
      inputs:
        - cp_mass
        - cp_haul
      output: "absolute_cohort_vectors"
      source_ids:
        - jrc-ilcd-2010
    - id: cohort_example
      applies_to: "all inventory rows"
      rule: "This is a constructed ledger check, not Glazebury/Leigh measurements, parameters or quantity ranges; assume no losses, dilution or other loaded legs. Period 1 enters A=600 kg, B=300 kg and C=100 kg once, each travelling 10 loaded km. A is first validly accepted; B is rejected and travels 10 loaded km back to source for later redispatch; C remains in transit. The physical ledger is 1000 = 600 + 300 + 100; consolidated source/transit closure is 1000 = 600 + 300 (source closing) + 100 (transit closing). Q1=600 kg. Loaded work is 6 + 3 + 1 + 3 (B return) =13 t km: accepted A receives 6, while B carries 6 and C carries 1, totalling 7 t km. Source vectors S_A, S_B and S_C enter once each; only S_A settles to this period accepted account. Period 2 has no new source production. B travels 20 loaded km on redispatch, adding 6 t km, and is then first validly accepted; C travels another 10 loaded km, adding 1 t km, and is terminally rejected to separate management, without an additional source-return entry. Opening wet mass 400 = first accepted 300 + terminal exit 100; Q2=300 kg. Opening carried work 7 + new work 7 = accepted B 12 + terminal C 2 =14 t km; both periods actual loaded work 13+7=20= A 6+B 12+C 2. S_B moves from carry to accepted only once and S_C stays terminal; B transport is 12/300=0.04 t km/kg, not all period haul or C terminal burden divided by Q2. Original formation mass closes as 1000=600+300+100 even though gross dispatches total 1300 kg across the two periods. Missing acceptance, terminal, carry or attribution evidence remains unresolved."
      inputs:
        - physical_closure
        - cohort_accounts
      output: "constructed_ledger_check"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "dataset"
      requirement: "Verify source, receiver, raw state, reporting year and exact provider gates; permit is an example, not a shipment measurement."
      evidence: "Actual permits, transfer/acceptance records"
    - id: dq_closure
      applies_to: "all inventory rows"
      requirement: "Use physical_closure with mutually exclusive physical endpoints per dispatch attempt. Rejection is an event: a rejected parcel actually returned is counted only as a physical return, not also as terminal rejection. Rejected material awaiting a decision remains closing unaccepted stock. Preserve parcel lineage through source stock, transit and redispatch; reconcile measured differences without inferring missing water or gas. Use cohort_accounts for separate absolute burdens."
      evidence: "Matched lot ledger and uncertainty"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "No native flow or supplier quantity is implied by a classification title; missing identities and histories remain visible."
      evidence: "Original records, native property/type/unit verification"
validation_rules:
  - rule_id: val_scope
    applies_to: "dataset"
    rule: "Verify urban 19 08 05 provenance and untreated state at actual receiver gate; reject fertilizer-suitable stabilized sludge and every section 1 exclusion. Check latest actual permissions independently."
    source_ids:
      - wco-hs38-2022
      - leigh-permit-2024
  - rule_id: val_mass
    applies_to: "all inventory rows"
    rule: "Verify the same wet kg reference in both languages, linked output, matched solids, actual measured volume times matching sampled density if used, and physical_closure without counting a rejection event twice. Verify cohort_accounts, first-valid-acceptance Q and exactly one A_i/Q normalization using only settled accepted vectors. Check the cross-period example arithmetic, not as operating data. Free water, operational solids and transport work cannot replace wet net Q."
    source_ids:
      - epa-solids-1684-draft-2001
      - jrc-ilcd-2010
  - rule_id: val_provider
    applies_to: "all inventory rows"
    rule: "Verify source first release, actual outsourcing/handover, retained burden history, allocation and haul overlap. No presumed zero burdens, service-fee revenues or credits. Missing native reference identity blocks native binding; missing measurements block completeness."
    source_ids:
      - jrc-ilcd-2010
