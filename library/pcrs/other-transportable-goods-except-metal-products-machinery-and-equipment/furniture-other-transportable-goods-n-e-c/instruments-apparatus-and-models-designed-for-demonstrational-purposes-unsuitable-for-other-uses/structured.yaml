measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "M = accepted net mass of one complete unit of the same configuration in kg; collect using cp_mass."
  - id: release_basis
    applies_to: "released_model"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of measured net masses of unique newly first-released complete models. It includes released closing FG. Delivery, reinspection, returns and repair do not add production."
  - id: electric_energy
    applies_to: "assembly_electricity; service_electricity"
    required_property_ref:
      name: "Energy"
      uuid: "f6811440-ee37-11de-8a39-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain metered kWh and convert once using 1 kWh = 3.6 MJ. Rated equipment power is not measured energy. Energy is the physical meter-quantity property, not an asserted native property of an unresolved supply flow. Verify the actual provider flow and all native properties independently; if its compatible accounting convention differs, document the bridge and unit equivalence separately. Net calorific value is not a meter reading."
  - id: supplied_article
    applies_to: "component inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh each supplied article in its received condition. A supplied subassembly includes embedded hardware, coatings and adhesive once; decomposition is a non-additive composition bridge. Count needs the same article’s measured mass, never a natural-bone count or catalogue weight."
  - id: fluid_state
    applies_to: "water; service_water; cleaning_effluent; water_to_air"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Mass requires weighing or independent substance-specific density at the measured state. Already integrated liquid/gas volume is not multiplied by time; integrate only a genuine rate. Do not infer density from a secondary flow property or use water density for another substance."
