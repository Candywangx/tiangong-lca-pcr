        end:
          offset: 16442
          line: 95
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Burden-bearing finished synthetic replica subassemblies and specified connecting/support articles received at the assembly plant |\n| starting_condition_role | Observed foreground input gate; upstream material extraction, forming and finishing remain linked once |\n| product_classification_scope | Narrow complete teaching-model subset of CPC38996 |\n| recursive_input_rule | Do not buy a complete model and call it new manufacture. Supplied subassemblies replace their embedded constituent purchases and local completed operations. Match internal transfer identities and cancel them. |\n| upstream_dataset_requirement | Actual synthetic material, forming/finish, subassembly contents, supply gate, geography and period; no unverified polymer substitution or recycled content |\n| disclosure | Factory, cohort, make/buy map, Q, stock/inherited vectors, separate service H, actual packaging and gross physical balances; all deviations and missing providers |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_complete | all processes | Carry the actual supplied component boundary through manual joint fitting, pole/base mounting, complete-model function inspection and first quality release. Include actual receipt/storage/handling, failures, start/stop, idle, test, cleanup and rework. Do not assume a boiler, steam system, wet process or chemical emission. Any actual omitted exchange requires a new physically specific card. | 3b-stan; 3b-assembly |\n| b_supply | component inputs | Only separately supplied components cross the purchase boundary. For a complete supplied skull, already inserted teeth, jaw fittings and magnets are not bought again. For a supplied wheeled base, embedded casters and coatings are not bought again. Do not combine distinct purchased articles into an unspecified hardware bundle. Customer setup diagrams establish alternatives, not mandatory duplicate fittings. | 3b-assembly; 3b-base; 3b-stan |\n| b_release | released_model; fg_service | The unique Q gate is first whole quality release. An accepted unit held in closing FG already belongs to Q. Preserve subsequent storage, packing, handling, dispatch, reinspection and actual repair in a separate original-cohort service ledger. Its internal incoming Q cancels the manufacturing Q output at the combined physical gate. Never add closing FG to Q again. | 3b-stan; 3b-assembly |\n| b_conservation | physical ledgers | Independently reconcile whole physical mass and any relevant element/species. Use measured gross events V, not economically allocated burdens. Distinguish real free, adsorbed, structural and reaction water; this dry assembly route implies no reaction water. Never fit two unknown moisture flows to one residual. COD, TOC and total VOC are indicators, not a named molecular mass. Retain unresolved balances as data holds. | 3b-stan; 3b-assembly |\n| b_actual_work | all processes | Route eligibility and authorization are quality decisions only. All actually performed rejected, trial, failed, off-route or unauthorized repair work remains in physical and environmental records, including removed components and cleanup. Extend the inventory with each actual formulation, energy carrier, external service, waste stream and emission species before issuing a dataset. | 3b-stan; 3b-assembly |\n| b_heat | actual utility extensions | If purchased heat or steam actually occurs, retain its measured MJ with the actual carrier mass, temperature/pressure, enthalpy and supplier water/energy boundary. Record external condensate or heat-transfer-water return separately as Product return when applicable. Use one energy account and non-additive carrier bridge; invent neither boiler fuel nor a nonexistent return. | 3b-stan; 3b-assembly |\n| b_package | packaging_pool | For each package separately, opening empty plus attached-WIP/FG plus reusable stock plus purchases plus external returns received equals closing stocks plus packages leaving with gross shipments plus external returns sent plus waste. Internal reuse cancels and creates neither another purchase nor product Q nor an automatic coproduct. Record physical gross shipments even if net product delivery is smaller. | 3b-safety |\n| b_classification | all processes | UN38996 defines demonstration-only articles unsuitable for other uses; the selected complete synthetic skeleton teaching model is a narrower subset. Distinguish38963 natural collections,38991 festive articles,38999 ordinary display articles and39110 natural bone material. Classification supplies neither a resin recipe nor manufacturing proof. | un-cpc3; 3b-safety |\n\n| b_custody | packaging_pool | For each actual packaging article, separate purchase, first non-purchase external receipt and true return matched to this site’s earlier outbound article. Include receipts attached to goods, loans and free transfers regardless of supplier inventory coverage. Assign every physical receipt, dispatch, return, waste and stock to one account. Charge actual procurement, transport and service burdens once to the responsible event/cohort; a non-purchase receipt is not evidence of zero upstream burden. Verify supplier inclusions and retain missing data explicitly. Add a separate atomic card for every actual pallet or additional package; do not presume their use. | ilcd-2010 |\n| b_provider | model_assembly; fg_service | Identify actual subcontractor, operations, site, custody gate, first-release location and handover record. Assembly evidence does not prove outsourcing. If supplier already releases the complete finished model, this site’s transfer, inspection, repacking or resale cannot create another first production Q. Link actual supplier production and transport once; separate service increments without erasing supplier burdens. | 3b-stan; 3b-assembly; ilcd-2010 |\n\n| b_configuration_states | model_assembly; fg_service | Distinguish the complete first-release configuration, protective disassembled packing configuration and teaching-site setup configuration. A model already first-released as complete does not become new production when limbs or support are removed for shipping and refitted by the recipient. Customer setup is outside factory manufacture. Verify actual order, release record and custody handover to establish who fits the pole, base and casters and whether they are delivered in the complete set. Catalogue accessories and setup drawings alone do not prove the supplier’s manufacturing gate. Apply this supplied-component manufacturing route only when actual records demonstrate component inputs and pre-first-release factory assembly; otherwise retain the gap and do not label recipient setup as factory production. | 3b-stan; 3b-assembly; 3b-base; 3b-pole |\n\n"
