allocation_rules:
  - rule_id: a_dedicated
    applies_to: "all processes"
    rule: "Use attributional modelling only when that framing and allocation need are justified. First assign dedicated articles and operations to their actual model/cohort; use physical or virtual subdivision for separately identifiable functions. Manufacturer assembly evidence does not prescribe LCA allocation."
    source_ids:
      - ilcd-2010
  - rule_id: a_causal
    applies_to: "all processes"
    rule: "For any genuinely inseparable remainder, determine exchange-specific physical causality: how the particular input/output changes with each function. Document the determining relation, actual driver, occupied capacity and duration where relevant. Do not use one mass, time or economic ratio indiscriminately for every exchange."
    source_ids:
      - ilcd-2010
  - rule_id: a_residual
    applies_to: "all processes"
    rule: "Only the remaining unresolved joint-process burdens use actual contemporaneous market values at the common process gate in the actual supplied state and quantity. Remove later product-specific transport, conditioning and packaging from unlike market-price observations; document price period and sensitivity. Do not apply retail prices or fixed allocation percentages. Shares and allocated vectors must sum to the pre-allocation burden."
    source_ids:
      - ilcd-2010
  - rule_id: a_no_credit
    applies_to: "all processes"
    rule: "No automatic recycling, reuse or displacement credit is granted. Internal component/model transfers cancel; a return, failed sample, unused carton or reusable cover is not automatically a co-product. Keep waste management with one real provider; further recycling claims need their own system-boundary method. The present method is not QFD allocation among teaching functions or a general recycling formula."
    source_ids:
      - ilcd-2010
  - rule_id: a_physical
    applies_to: "all processes"
    rule: "Allocation changes attributed environmental vectors, not what physically happened. Preserve each gross waste, molecular release, return, replacement and utility-carrier movement V with the true cohort denominator Q or original Qc. Do not shrink the physical register by economic shares, FG stock attribution, net dispatch or a service allocation. Report gross and allocated views without adding them twice."
    source_ids:
      - ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "model_assembly"
      flow_role: "complete reference model"
      record_type: "weighing and release record"
      raw_fields: "model; configuration; serial; first release time; release/packing/teaching-site configurations; actual assembler and support delivery scope; accepted net mass M; component bridge; opening and closing accepted FG"
      collection_method: "Weigh the accepted complete unit on a calibrated scale excluding transport packaging; reconcile same configuration and acceptance record. Include pole/base, fitted hardware and configured cover/accessories. Verify Q from unique serials, never count a repaired or dispatched model twice. Aggregation semantics: Retain raw net masses and unique release registry; section 8 alone produces the per 1 kg reference flow values."
      unit: "kg"
      frequency: "each whole first release"
      temporal_coverage: "whole declared production cohort"
      site_scope: "selected assembly plant and configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; tare; signed inspection and serial records"
    - protocol_id: cp_components
      process_id: "model_assembly"
      flow_role: "individual supplied articles"
      record_type: "receipt stock and issue register"
      raw_fields: "part id; side; supplier; composition; finish; make/buy boundary; received mass; opening/closing raw and WIP mass; inherited per-exchange vector; issues; rejects; returns"
      collection_method: "Weigh each actual article or use its verified same-specification count/mass bridge; reconcile supplied subassembly inclusions, invoices, stage custody and shortages. Never infer a BOM from natural anatomy. Retain failed and zero-output work. Aggregation semantics: Raw article quantities and inherited vectors remain undivided; reference normalization occurs once in section 8."
      unit: "kg"
      frequency: "each receipt issue and stock close"
      temporal_coverage: "entire cohort including opening WIP history"
      site_scope: "assembly plant plus identified upstream providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier declarations; weighing; BOM reconciliation; stock ledger"
    - protocol_id: cp_utilities
      process_id: "model_assembly"
      flow_role: "individual electricity and water"
      record_type: "meter record"
      raw_fields: "meter id; provider; voltage; geography; water state; raw readings; true rate or integrated quantity; idle/test/cleanup intervals; allocation driver"
      collection_method: "Use calibrated submeter differences and actual stage logs. Retain kWh before energy conversion and actual water mass or independently measured density conversion. Record every actual fuel, compressed air or heat supply separately if used. Aggregation semantics: Retain raw sums and real physical driver shares without division by Q; section 8 normalizes once."
      unit: "kWh; kg"
      frequency: "continuous meter or each actual event"
      temporal_coverage: "all actual production time including failure and idle"
      site_scope: "metered plant boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices; voltage/provider proof; state measurement"
    - protocol_id: cp_waste
      process_id: "model_assembly"
      flow_role: "each physical waste stream"
      record_type: "weighing and destination record"
      raw_fields: "stream composition; wet mass; origin event; phase; contamination; recipient; whole-versus-partition bridge; WIP/FG history"
      collection_method: "Weigh each real outgoing stream; distinguish whole failed model from dismantled component outputs. One actual treatment provider owns each received stream; count treatment service or its elementary outputs with explicit boundary and no double count. Aggregation semantics: Preserve gross waste V undivided and origin partitions; section 8 reports V/Q once."
      unit: "kg"
      frequency: "each waste transfer"
      temporal_coverage: "full cohort including failures and cleanup"
      site_scope: "actual waste gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; recipient receipt; contamination analysis"
    - protocol_id: cp_species
      process_id: "model_assembly"
      flow_role: "each actual elementary species"
      record_type: "measurement and independent balance"
      raw_fields: "species; CAS where relevant; origin; phase; medium; concentration; integrated volume or actual rate; state-specific density; gross uptake and release"
      collection_method: "Measure independently or use an evidenced species balance with enough observations. Keep moisture, free/structural/reaction water separate. Actual additional emission species get their own atomic rows. Do not use VOC/COD as a molecule or solve two unknowns with one residual. Aggregation semantics: Retain gross species V before normalization; use the unique V/Q result in section 8."
      unit: "kg"
      frequency: "each actual emission interval"
      temporal_coverage: "all applicable real operations"
      site_scope: "declared receiving environmental medium"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "instrument calibration; species assay; independent state and mass evidence"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "original-cohort stocks and services"
      record_type: "serial custody and service register"
      raw_fields: "cohort Qc; original mass and burden vector; opening/closing FG; internal Q; gross dispatch; external returns; other external finished-model receipts; original dispatch reversal; new repair parts/water/energy; removed waste; H"
      collection_method: "Trace every article and actual service to original Qc. Preserve new replacement material, all actual failed/unauthorized work and resulting waste/species. Historical opening FG keeps its original burden and is not a current purchase. Weigh changed configurations and reconcile added/removed parts. Aggregation semantics: Keep raw service events and inherited vectors; apply section 8 once using original Qc. H is never an additional divisor."
      unit: "kg; kWh"
      frequency: "each transfer or service plus stock close"
      temporal_coverage: "declared H with explicit historical cohort linkage"
      site_scope: "finished-goods custody and actual service locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "serial ledger; original release; reverse transaction; repair/stock records"
    - protocol_id: cp_packaging
      process_id: "packaging_pool"
      flow_role: "each actual package separately"
      record_type: "package stock and transfer register"
      raw_fields: "package id; composition; opening empty/attached/reusable stocks; purchases; first non-purchase external receipts; matched true returns received; supplier coverage; payer; original outbound article id; closing stocks; gross shipped packages; returns sent; waste; internal reuse"
      collection_method: "Weigh each packaging article or use a verified same-specification piece/length bridge; reconcile every stock and destination including attached WIP/FG. Do not confuse the functional dust cover with shipping packaging. Aggregation semantics: Raw gross article ledger remains undivided; section 8 alone yields cohort-normalized packaging quantities."
      unit: "kg"
      frequency: "each receipt dispatch return and inventory close"
      temporal_coverage: "production and declared service H"
      site_scope: "actual packaging custody gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; package specification; gross dispatch and reuse ledger"
  calculation_rules:
    - id: release_total
      applies_to: "released_model"
      rule: "Q = sum(M_j) over unique first-released whole model serials. Count only actual accepted complete configurations. Released closing FG is included; rejected unreleased models, dispatch and repaired returns add no Q."
      inputs:
        - M_j
        - "unique first-release registry"
        - cp_mass
      output: "Q"
      source_ids:
        - 3b-stan
        - 3b-assembly
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw observations to the native row unit before allocation: metered kWh to MJ by 3.6; actual mass from direct weighing or independent state-specific density times measured volume. Integrate a rate once only. Composition assays of a supplied whole article/formulation are non-additive."
      inputs:
        - "raw meter or mass observations"
        - "conversion evidence"
        - cp_utilities
        - cp_species
      output: "native raw V_i"
      source_ids:
        - 3b-stan
    - id: physical_manufacture
      applies_to: "model_assembly"
      rule: "Opening raw and WIP mass + actual external F + actual physical incoming transfers = closing raw and WIP mass + Q + actual outgoing waste + actual elementary release + external returns and transfers. Use compatible wet/whole bases; exclude energy/service units from mass. Internal stage transfers cancel. Independently check elements and each actual species."
      inputs:
        - "opening raw/WIP"
        - F
        - "internal transfers"
        - "closing raw/WIP"
        - Q
        - "gross outputs"
      output: "unallocated manufacturing mass and species closure"
      source_ids:
        - 3b-assembly
    - id: inherited_vectors
      applies_to: "model_assembly"
      rule: "For each exchange independently retain opening WIP burden vector plus actual assigned new burden minus closing WIP inherited burden. Track components consumed, rejected and retained by cohort; physical stock mass is not its burden vector. Carry all failed/idle/cleanup/rework events. Q=0 retains real burdens and stocks without a unit result."
      inputs:
        - "opening inherited vector"
        - "new assigned events"
        - "closing inherited vector"
        - cp_components
      output: "attributable vector A_i and retained history"
      source_ids:
        - ilcd-2010
    - id: physical_fg
      applies_to: "fg_service"
      rule: "Opening FG + internal Q + gross external returned model mass + other external finished-model receipts + new repair material F + real elementary uptake = closing FG + gross physical dispatch + external model/component returns sent + service waste + service elementary releases. Keep whole-versus-component returns non-additive and original dispatch reversal explicit. Retesting is not new mass."
      inputs:
        - "opening/closing FG"
        - Q
        - "actual return and repair events"
        - cp_fg
      output: "unallocated finished-goods physical closure"
      source_ids:
        - 3b-assembly
    - id: combined_gate
      applies_to: "model_assembly; fg_service"
      rule: "Add manufacturing and FG physical balances then cancel identical internal Q and any other matched internal transfers. Closing FG stays on the stock side only. Preserve gross external waste, emissions, water and replacements; neither historical burden assignment nor reduced net sales shrinks these facts."
      inputs:
        - "manufacturing closure"
        - "FG closure"
        - "matched internal transfers"
      output: "combined physical closure"
      source_ids:
        - 3b-assembly
    - id: duplicate_guard
      applies_to: "all inventory rows"
      rule: "F is an actual new external event. X may remove only a proved duplicate representation of that same event on the same side and within the same account. New repair parts, water, cleaning or energy are F, not X. Whole wet material and its constituents use one primary account with a non-additive composition bridge."
      inputs:
        - "event identifiers"
        - "source receipts"
        - "same-side duplicate proof"
      output: "deduplicated event ledger"
      source_ids:
        - ilcd-2010
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For positive cohort Q, the sole normalization is n_i = A_i / Q for attributed inventory and g_i = V_i / Q for the separately retained gross physical register. Original-cohort services use Qc in this same operation. A_i is formed after native-unit conversion, justified allocation and inherited-vector reconciliation; V_i retains actual gross physical events. Cards and protocol aggregation reference this result, never divide again. Q=0 yields no unit result."
      inputs:
        - A_i
        - V_i
        - Q
        - Qc
      output: "n_i; g_i"
      source_ids:
        - ilcd-2010
    - id: package_balance
      applies_to: "packaging_pool"
      rule: "For every article separately: opening empty + opening attached WIP/FG + opening reusable + purchases + first non-purchase external receipts + matched true returns received = all closing stocks + attached gross-shipment outflow + external returns sent + other external transfers sent (including empty loans/free transfers) + waste. First non-purchase receipts include packaging arriving with incoming goods, separately borrowed or freely transferred, whether or not covered in supplier inventory. True returns require proof of the same article previously sent outside this site. Unmatched incoming articles remain first receipts pending provenance, never disappear. Internal reuse cancels. The model dust cover in functional M is not also packaging. Normalize the attributable purchase/use and gross article views once with the proper cohort Q or Qc."
      inputs:
        - "article-specific packaging stocks and events"
        - cp_packaging
      output: "package closure and non-additive normalized views"
      source_ids:
        - 3b-safety
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all processes"
      requirement: "Every complete model and supplied article has a stable configuration/side/material/supply-state identity; no resin, steel alloy or component quantities inferred from images."
      evidence: "supplier declarations; drawings; actual receipts"
    - id: dq_native
      applies_to: "all processes"
      requirement: "For each bound UUID preserve native type, all names/comments, route, form, media, geography and every property; resolve the exact referenced property and unit-group versions. A classification match alone never establishes applicability."
      evidence: "full native object and exact support chain"
    - id: dq_mass
      applies_to: "all processes"
      requirement: "M and Q require calibrated actual complete-configuration weighing; component sums are reconciliation evidence. Catalogue height/weight, life-size wording and natural bone counts are not conversions."
      evidence: "calibration; tare; configuration bridge"
    - id: dq_history
      applies_to: "all processes"
      requirement: "Keep opening/closing raw, WIP and FG separately, with per-exchange inherited environmental vectors and gross physical custody. Include failures, Q0 and every real service in H."
      evidence: "cohort and event ledgers"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Unobserved composition, species, activity or provider is unknown, not zero. Add actual auxiliary flows and one treatment/service provider per event. Report gaps and their effect; hold a dataset when a core terminal, native identity or mass relation is unresolved."
      evidence: "gap register; provider and physical closure evidence"
    - id: dq_sources
      applies_to: "all processes"
      requirement: "Keep primary source facts, technical synthesis and future factory collection separate. Same-publisher documents are not independent sources. Manufacturer marketing and engineering checks do not establish scientific review, translation review or publication."
      evidence: "source applicability assessment; review metadata"
validation_rules:
  - rule_id: v_terminal
    applies_to: "all processes"
    rule: "Verify one complete synthetic full-body teaching model with actual connections, support base/pole and configured accessories; exclude a single joint, natural bone, ordinary stand, clinical device or toy. Selected native finished demonstration-only identity and measured M must match the same object."
    source_ids:
      - 3b-stan
      - 3b-assembly
      - 3b-safety
  - rule_id: v_reference
    applies_to: "all processes"
    rule: "The explicit reference link selects released_model only. Q counts unique first releases and includes released closing FG once. Reinspection, dispatch and repairs cannot create Q; Q0 prevents a normalized unit result while retaining all real events."
    source_ids:
      - 3b-stan
      - 3b-assembly
      - 3b-safety
  - rule_id: v_physics
    applies_to: "all processes"
    rule: "Check manufacturing, FG and combined gross physical gates plus each packaging article balance. Cancel internal Q exactly. Independently check species/elements when relevant; no residual fitting of multiple unknowns or economic shrinking of physical outputs."
    source_ids:
      - 3b-stan
      - 3b-assembly
      - 3b-safety
  - rule_id: v_once
    applies_to: "all processes"
    rule: "Verify raw collection remains undivided, conversions and justified allocation precede the sole A/Q operation, and cards reuse that result. Keep gross V/Q separate and non-additive with the burden view. Original services use original Qc and H is not a divisor."
    source_ids:
      - ilcd-2010
  - rule_id: v_atomic
    applies_to: "all processes"
    rule: "Every actual raw material, complete purchased formulation, article, energy carrier, external service, waste and molecular emission must be individually identified. Embedded constituents are non-additive. Native restrictions and unresolved UUID/provider gaps remain consumable context; missing entries cannot be hidden in other or zero."
    source_ids:
      - 3b-stan
      - 3b-assembly
      - 3b-safety
  - rule_id: v_boundaries
    applies_to: "all processes"
    rule: "Factory moulding, coating or chemical repair actually performed outside the selected dry assembly route requires source-backed method extension and complete factual inventory. No quality gate deletes unauthorized or unsuccessful physical work. Preserve actual provider/carrier returns and every original-cohort service."
    source_ids:
      - 3b-stan
      - 3b-assembly
      - 3b-safety
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing inventory for the declared complete demonstration-only model configuration"
  allowed_use: "Compatible material/supply/assembly route and gate with disclosed Q, stock history and service scope"
  excluded_use: "Clinical use; natural tissue; generic resin or stand inventories; automatic equivalence across configurations; lifetime or clinical accuracy claims"
  required_metadata: "All reference qualifiers; supplier and native restrictions; units and M bridge; first-release cohort; raw/inherited vectors; allocation rationale; sources"
  required_quality_disclosure: "Measured versus unknown activity; ordinary auxiliary/provider gaps; true terminal or method holds; source applicability; physical closure; review status"
  update_trigger: "Configuration or material change; changed component make/buy state; local forming/coating route; native/provider change; Q gate or service horizon change"
data_sources:
  - id: "3b-stan"
    type: "literature"
    reference: "3B Scientific. Human Skeleton Model Stan A10 / 1020171. https://www.3bscientific.com/us/human-skeleton-model-stan-1020171-a10-3b-scientific,p_164_6.html"
    used_for: "Synthetic complete model, final hand assembly, detachable limbs, included cover; no universal material recipe or unit mass"
  - id: "3b-assembly"
    type: "handbook"
    reference: "3B Scientific. Assembly instruction A10/A11/A12/A13/A15, document 5002047, copyright 2018. https://www.3bscientific.com/product-manual/3B-Scientific-assembly-instruction_A10_A11_A12_A13_A15_A15.pdf"
    used_for: "Page1 A10 components and mountings; page2 different ligament/muscle variants as counterexamples; consumer setup not factory make/buy proof"
  - id: "3b-safety"
    type: "handbook"
    reference: "3B Scientific. Safety and warning information for anatomical models, undated. https://www.3bscientific.com/product-manual/1020171.pdf"
    used_for: "Educational/demonstration-only, nonmedical use and fragile-parts limitation; care and storage context not factory consumption data"
  - id: "3b-base"
    type: "literature"
    reference: "3B Scientific. Metal base with 5 casters XA031 / 1013911. https://www.3bscientific.com/gb/metal-base-with-5-casters-1013911-xa031-3b-scientific-1013911,p_171_23595.html"
    used_for: "Metal finished base and compatible supplied caster assembly; no adopted mass or generic count"
  - id: "3b-pole"
    type: "literature"
    reference: "3B Scientific. Spare Metal Pole for Pelvic Mounted Skeletons XA004 / 1020636. https://www.3bscientific.com/us/spare-metal-pole-for-pelvic-mounted-skeletons-1020636-xa004-3b-scientific,p_171_7585.html"
    used_for: "Finished metal pole compatibility with A10; no alloy or measured factory mass"
  - id: "un-cpc3"
    type: "official_guidance"
    reference: "UNSD. CPC Ver.3.0 Explanatory Notes, 30 June 2025, pp197–198. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "38996 title and neighbouring collector/festive/other-article/natural-bone boundaries; no manufacturing or whole-leaf methodology claim"
  - id: "ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for LCA Detailed guidance, first edition March 2010, sections7.9.2–7.9.3. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Conditional attributional subdivision, exchange-specific determining physical causality, residual common-gate market value and full burden reconciliation; no fixed factor or automatic recycling credit"
  - id: "somso-qs10"
    type: "literature"
    reference: "SOMSO. Artificial Human Skeleton QS 10/E. https://www.somso.de/en/anatomy/general-anatomy/bone-models/male-skeleton/artificial-human-skeleton-qs-10-e"
    used_for: "Independent model-form corroboration and counterexample to material, weight and component transfer; no factory inventory"
