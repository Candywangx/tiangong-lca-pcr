          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_dedicated | all processes | Use attributional modelling only when that framing and allocation need are justified. First assign dedicated articles and operations to their actual model/cohort; use physical or virtual subdivision for separately identifiable functions. Manufacturer assembly evidence does not prescribe LCA allocation. | ilcd-2010 |\n| a_causal | all processes | For any genuinely inseparable remainder, determine exchange-specific physical causality: how the particular input/output changes with each function. Document the determining relation, actual driver, occupied capacity and duration where relevant. Do not use one mass, time or economic ratio indiscriminately for every exchange. | ilcd-2010 |\n| a_residual | all processes | Only the remaining unresolved joint-process burdens use actual contemporaneous market values at the common process gate in the actual supplied state and quantity. Remove later product-specific transport, conditioning and packaging from unlike market-price observations; document price period and sensitivity. Do not apply retail prices or fixed allocation percentages. Shares and allocated vectors must sum to the pre-allocation burden. | ilcd-2010 |\n| a_no_credit | all processes | No automatic recycling, reuse or displacement credit is granted. Internal component/model transfers cancel; a return, failed sample, unused carton or reusable cover is not automatically a co-product. Keep waste management with one real provider; further recycling claims need their own system-boundary method. The present method is not QFD allocation among teaching functions or a general recycling formula. | ilcd-2010 |\n| a_physical | all processes | Allocation changes attributed environmental vectors, not what physically happened. Preserve each gross waste, molecular release, return, replacement and utility-carrier movement V with the true cohort denominator Q or original Qc. Do not shrink the physical register by economic shares, FG stock attribution, net dispatch or a service allocation. Report gross and allocated views without adding them twice. | ilcd-2010 |\n\n"
