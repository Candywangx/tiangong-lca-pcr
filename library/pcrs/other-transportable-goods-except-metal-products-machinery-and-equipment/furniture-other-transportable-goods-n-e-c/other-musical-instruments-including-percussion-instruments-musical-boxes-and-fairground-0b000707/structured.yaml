system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The following full rules apply together to the declared first-release boundary and actual conditions; conditional absence requires evidence, never an invented zero. Gross physical ledgers and burden vectors are distinct dimensions."
      source_ids: []
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Begin with actual supplied flexible maple plywood, laminating preparation and components; cut sheets, apply actual glue, circular airbag mould, dry, trim, sand/coat/cure/buff, machine bearing edges and snare beds, drill and vent, assemble whole heads/hardware/wire/strainer and tune/inspect. Actual site order may differ and must be recorded. Local microwave and UV operations require their measured electricity; do not create a boiler or steam demand."
      source_ids:
        - yamaha-shell
        - yamaha-finish
        - yamaha-assembly
    - rule_id: boundary_make_buy
      applies_to: "shell_bought; maple_plywood"
      rule: "Externally laminated whole bare shell is an explicit alternative, owned upstream once with supplier proof. Replace only those demonstrated outsourced operations, retaining actual local machining/finishing/assembly/test. Internal same-product handoffs cancel at consolidation; no second product procurement or second Q. Raw-log/veneer preparation is upstream of the demonstrated supplied plywood, not invented onsite. If actual onsite veneer preparation occurs, add its individual wood, glue, energy and loss exchanges before use."
      source_ids:
        - yamaha-shell
    - rule_id: boundary_components
      applies_to: "all supplied components"
      rule: "Heads include supplied film/coating/retaining rim, plated metal components include supplier plating and supplied screws, and snare kits include their supplied end plates/anchors. Procure each whole delivered preparation/article once. Record supplier composition nonadditively; separate only truly additional purchases or onsite manufacture with individual materials, operations and losses."
      source_ids:
        - yamaha-components
        - remo-head
    - rule_id: boundary_first_release
      applies_to: "finished"
      rule: "Q is sum of actual unwrapped net complete snare mass at its first new quality release in one declared configuration/cohort and time window. Released closing FG is already in Q and its manufacturing burden: never subtract it as unreleased inventory or add it as a second output. Opening released FG, reinspection, dispatch and returns do not create Q. No net-delivery denominator is used."
      source_ids:
        - yamaha-assembly
    - rule_id: boundary_burden_stock
      applies_to: "all burden-bearing rows"
      rule: "Maintain each exchange inherited burden vector separately from physical stock. For manufacturing numerator use original raw numerator after unit conversion and actual allocation, plus inherited opening raw/WIP/unassigned non-WIP stores, less only closing raw/WIP/unassigned non-WIP burden not yet assigned to release. Never subtract already assigned released FG or already-net consumption stocks again. A legitimate transfer requires identified other cohort/function and justified allocation/handover once; ordinary rejects, samples, sold or exported waste retain manufacture and treatment burden."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_all_actual_work
      applies_to: "all processes"
      rule: "Include all actual rejected/zero-output batches, trials, start/stop, idle, cleaning and rework. Q=0 retains measured load and stock vectors without a unit result. Unknown actual quantity is not zero. Permission and posttests/acceptance control authorisation and continued conformance, never whether already performed activity is recorded."
      source_ids:
        - ilcd-2010
        - yamaha-assembly
    - rule_id: boundary_service
      applies_to: "service; assets; packaging"
      rule: "Keep actual postrelease storage/handling/packaging/service increments with original cohort first-release mass Qc and observed horizon H; closing FG does not remove performed original-cohort service. Only unused/unassigned service or charge may carry forward. Future unknown service is disclosed and not imputed. Consolidating manufacturing and service cancels internal Q handoff and counts one reference output."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_rework
      applies_to: "service"
      rule: "Actual postrelease rework requires manufacturer/specification permission plus postwork tests, acceptance and disposition to assert continued conformance. Unapproved, failed or nonconforming work still retains all actual materials, water, energy, old/new parts, original cohort and hold/waste disposition. Do not presume damaged shell/head recovery. Natural storage humidity uptake or evaporation is not a repair and needs no fictional permission."
      source_ids:
        - yamaha-assembly
        - ilcd-2010
    - rule_id: boundary_physical_gates
      applies_to: "all physical legs"
      rule: "Reconcile manufacturing, FG/service and consolidated physical gates before any burden share. Complete gross legs and full wet opening/closing mass stay intact; all repair-material/water and packaging X_in/X_out terms only remove duplicated OTHER same-side incoming/outgoing terms. A real influx retained in closing stock remains both influx and full closing mass. Internal reuse cancels within the consolidated gate, not as new procurement or production."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_packaging
      applies_to: "packaging"
      rule: "For each actual carton/PE bag/paper pad/PET strap/wood pallet pool collect six separate physical events P/I/ER/S/EO/W: opening empty plus attached WIP/FG plus reusable stock + P + I + ER = closing same full stock + gross shipped S + external owner return EO + waste W, with actual repair/humidity input/output and other genuine transformations added disjointly. P and I are mutually exclusive ownership of receipt; first non-purchased external ingress I is still real physical ingress with one upstream owner. Whole wet P/I once, disjoint article/component bridge."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_waste_outlet
      applies_to: "all waste rows"
      rule: "Six pool directions are measured even when wastes share one outlet. If W sources physically co-collect, retain each source W measurement as a nonadditive subaccount of the one actual mixed Waste exchange; never sum mixed total plus components or book treatment twice. Only genuinely separate outlets use separate external Waste exchanges. Sale/export is not automatic allocation relief or substitution credit."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_assets
      applies_to: "assets"
      rule: "Separate complete new/used physical assets and replacement parts/fluids from current service burden. Record gross acquisition, returns, retirement, opening/closing installed assets/charge, transfers, real maintenance and disposal. Measure actual production/maintenance burden and observed service allocation independently; no default lifetime, kg-per-item factor or one machine per kg. Asset gross movements never shrink by service/economic share."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_heat_water
      applies_to: "heat; thermal_water_in; thermal_water_return"
      rule: "Only actual supplied heat is counted. Heat MJ and actual liquid heat-carrier kg/stock/return are separate; record state, inlet/outlet temperature/enthalpy and one supplier water-energy convention to avoid double purchasing whole heat provider and its carrier energy. A genuine returned carrier is Product return, not waste; no invented steam, condensate, boiler or heat circuit."
      source_ids:
        - ilcd-2010
    - rule_id: boundary_additions
      applies_to: "all processes"
      rule: "Before modelling any additional actually used wood species, veneer, adhesive, formulation component separately bought, gas, liquid phase, packaging pool, maintenance item, treatment or freight, add its own atomic card, precise measurement and supplier/identity review. Do not hide real flows in other, zero or an aggregate; split onsite manufacture into real independent raw inputs/energy/loss and cancel internal handoffs."
      source_ids:
        - ilcd-2010
        - yamaha-shell
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-2010
