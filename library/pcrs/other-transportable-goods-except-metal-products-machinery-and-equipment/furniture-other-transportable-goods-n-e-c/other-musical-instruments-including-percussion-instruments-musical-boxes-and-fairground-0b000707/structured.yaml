    - id: dq_complete
      applies_to: "all gates"
      requirement: "All actual failed/Q0 and performed operations, full gross wet stocks and source subaccounts; absence demonstrated."
      evidence: "Stock reconciliation; raw/WIP inherited vectors; outlet and maintenance records"
    - id: dq_temporal
      applies_to: "service and manufacture"
      requirement: "Separate manufacture window from each original-cohort observed service horizon and unknown future."
      evidence: "Cohort/date/horizon; original serial delivery and return links"
    - id: dq_allocation
      applies_to: "burden vectors"
      requirement: "Exclusive subdivision then per-exchange determining physical causality; residual market value only justified common-gate actual state."
      evidence: "Dedicated meters; drivers; actual prices; sensitivity; transfer ownership"
