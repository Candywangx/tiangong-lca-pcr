      applies_to: "method and quantitative evidence"
      requirement: "Full source context and contrary alternatives, independence by publication not registration count; no industrial page as allocation evidence and no identity result as performance proof."
      evidence: "Source sections; supplier data; limitations; actual approval/disposition"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "These checks cover the full declared method together with complete section context; an unknown or unsupported real relationship remains explicit review. A mechanical check cannot close physical or scientific uncertainty."
    source_ids: []
  - rule_id: validation_core
    applies_to: "finished"
    rule: "Require the full whole acoustic snare terminal, exact Product reference chain and primary-qualified material/route/components; a part, raw wood or wrong sound-producing family cannot stand for the drum. Broader but physically compatible manufactured percussion family is allowed with the complete restrictions. Missing real core identity or route is a true hold, draft/unusable and unmapped."
    source_ids:
      - yamaha-components
      - yamaha-assembly
  - rule_id: validation_first_release
    applies_to: "all collection"
    rule: "Check actual first release, configuration/net mass and one Q; released closing FG included once, original return/delivery links retained, no reinspection or dispatch production. Unknown future quantities are open collection duties and cannot be reported as zero."
    source_ids:
      - yamaha-assembly
  - rule_id: validation_full_load
    applies_to: "all burden-bearing rows"
    rule: "Verify failed/Q0/start/stop/idle/cleanup/rework load, per-exchange inheritance and only legitimate unassigned closing raw/WIP/non-WIP burden carryover. Do not stock-correct already-net consumption or subtract performed service for held FG."
    source_ids:
      - ilcd-2010
  - rule_id: validation_atom_native
    applies_to: "all rows"
    rule: "Every row is one actual material/formulation/article/species/event with correct native extensive property/unit and full restrictions, not a collection. Blank auxiliary identity is disclosed pending matching; no invented UUID, CAS, phase, grade, provider or conversion. Include official Chinese basename where supplied; disclose native identity defects."
    source_ids:
      - ilcd-2010
  - rule_id: validation_species_balance
    applies_to: "all physical gates"
    rule: "Independently reconcile total wet physical mass and relevant carbon/nitrogen or other evidenced elements with true species/reaction/free/phase/structural-water evidence. Never fit two unknown quantities using one residual; COD/VOC/NOx/total dust/element readings do not determine a molecule. Gas gross/pass-through/net, integrated volume and actual rate are distinct. Unclosed balance remains review, not a pass."
    source_ids:
      - ilcd-2010
  - rule_id: validation_gross
    applies_to: "packaging; assets; service"
    rule: "Audit each six-leg packaging card and each asset/repair/water gross event, full wet stock, same-side-only X terms, one provider owner and one real mixed Waste outlet. No gross leg is scaled by a burden/economic fraction. Raw collection is unnormalised, sole quotient once, no duplicate total/components."
    source_ids:
      - ilcd-2010
  - rule_id: validation_acceptance
    applies_to: "manufacture; service"
    rule: "Retain dimensional/finish/assembly, head seating/tension balance, snare engagement/release and acoustic-response inspection to actual specification with inspector/date/disposition. No fixed tension, pitch, holes, life or certification is invented. Rework conformance additionally requires real manufacturer/spec permission and posttests; failed/unapproved work remains in data."
    source_ids:
      - yamaha-assembly
      - yamaha-tuning
      - yamaha-sound
  - rule_id: validation_completeness
    applies_to: "dataset"
    rule: "Check every raw field, numerator route, unit conversion, protocol, source applicability, normative context, uncertainty and exclusions. Mechanical projection/finite measurement checks do not approve scientific methodology, translation, supplier or classification mapping."
    source_ids:
      - ilcd-2010
