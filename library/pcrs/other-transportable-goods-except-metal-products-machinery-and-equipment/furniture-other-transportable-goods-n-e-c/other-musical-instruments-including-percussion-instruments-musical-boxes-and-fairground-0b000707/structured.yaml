allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The hierarchy below applies only within the stated attributional scenario and after separating actual dedicated work. Instrument manufacture evidence supports the route, not allocation coefficients."
    source_ids: []
  - rule_id: allocation_context
    applies_to: "all burden-bearing exchanges"
    rule: "This is attributional modelling when allocation is necessary. First isolate exclusive operations and virtual subdivisions; then determine the physical causality that controls each remaining exchange. Only a demonstrated residual lacking such causality may use actual contemporaneous market value at the common process gate and actual state/quality. Document the residual and sensitivity; never choose physical/economic freely or impose a fixed percentage."
    source_ids:
      - ilcd-2010
  - rule_id: allocation_service
    applies_to: "service and capital burden"
    rule: "For shared service consider the actual limiting relation and observed duration jointly where appropriate: airbag/microwave/UV machine work by real measured operating relationship; storage/transport by occupied volume/area or limiting mass and time. Collect independent determinants and traceable service burden, rather than assuming one driver fits every exchange. Already performed original-cohort service is not deferred because the drum remains in FG."
    source_ids:
      - ilcd-2010
  - rule_id: allocation_no_credit
    applies_to: "waste; rejects; samples; internal reuse"
    rule: "Ordinary waste, failed drums, samples and sold residues remain with manufacture/treatment. Only a real different function/cohort plus justified allocation/handover permits one burden-vector transfer, while gross physical masses stay complete. Internal reuse is neither second procurement nor automatic co-product/avoided production."
    source_ids:
      - ilcd-2010
  - rule_id: allocation_gross
    applies_to: "all physical disclosure cards"
    rule: "Gross cards use A = actual complete gross V and the sole quotient for disclosure scale only. They are not upstream purchases, credits, economic shares or a second allocation. Attribute any actual procurement/treatment/service burden once to its actual owner separately. Packaging P/I is one owner, ER/reuse no automatic virgin purchase; export W one actual outlet/provider."
    source_ids:
      - ilcd-2010
