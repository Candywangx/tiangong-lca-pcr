      markdown: "## 7. Allocation and Co-product Handling\n\nThe hierarchy below applies only within the stated attributional scenario and after separating actual dedicated work. Instrument manufacture evidence supports the route, not allocation coefficients.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_context | all burden-bearing exchanges | This is attributional modelling when allocation is necessary. First isolate exclusive operations and virtual subdivisions; then determine the physical causality that controls each remaining exchange. Only a demonstrated residual lacking such causality may use actual contemporaneous market value at the common process gate and actual state/quality. Document the residual and sensitivity; never choose physical/economic freely or impose a fixed percentage. | `ilcd-2010` |\n| allocation_service | service and capital burden | For shared service consider the actual limiting relation and observed duration jointly where appropriate: airbag/microwave/UV machine work by real measured operating relationship; storage/transport by occupied volume/area or limiting mass and time. Collect independent determinants and traceable service burden, rather than assuming one driver fits every exchange. Already performed original-cohort service is not deferred because the drum remains in FG. | `ilcd-2010` |\n| allocation_no_credit | waste; rejects; samples; internal reuse | Ordinary waste, failed drums, samples and sold residues remain with manufacture/treatment. Only a real different function/cohort plus justified allocation/handover permits one burden-vector transfer, while gross physical masses stay complete. Internal reuse is neither second procurement nor automatic co-product/avoided production. | `ilcd-2010` |\n| allocation_gross | all physical disclosure cards | Gross cards use A = actual complete gross V and the sole quotient for disclosure scale only. They are not upstream purchases, credits, economic shares or a second allocation. Attribute any actual procurement/treatment/service burden once to its actual owner separately. Packaging P/I is one owner, ER/reuse no automatic virgin purchase; export W one actual outlet/provider. | `ilcd-2010` |\n\n"
