          column: 1
      markdown: "## 9. Validation Rules\n\nThese checks cover the full declared method together with complete section context; an unknown or unsupported real relationship remains explicit review. A mechanical check cannot close physical or scientific uncertainty.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validation_core | finished | Require the full whole acoustic snare terminal, exact Product reference chain and primary-qualified material/route/components; a part, raw wood or wrong sound-producing family cannot stand for the drum. Broader but physically compatible manufactured percussion family is allowed with the complete restrictions. Missing real core identity or route is a true hold, draft/unusable and unmapped. | `yamaha-components`; `yamaha-assembly` |\n| validation_first_release | all collection | Check actual first release, configuration/net mass and one Q; released closing FG included once, original return/delivery links retained, no reinspection or dispatch production. Unknown future quantities are open collection duties and cannot be reported as zero. | `yamaha-assembly` |\n| validation_full_load | all burden-bearing rows | Verify failed/Q0/start/stop/idle/cleanup/rework load, per-exchange inheritance and only legitimate unassigned closing raw/WIP/non-WIP burden carryover. Do not stock-correct already-net consumption or subtract performed service for held FG. | `ilcd-2010` |\n| validation_atom_native | all rows | Every row is one actual material/formulation/article/species/event with correct native extensive property/unit and full restrictions, not a collection. Blank auxiliary identity is disclosed pending matching; no invented UUID, CAS, phase, grade, provider or conversion. Include official Chinese basename where supplied; disclose native identity defects. | `ilcd-2010` |\n| validation_species_balance | all physical gates | Independently reconcile total wet physical mass and relevant carbon/nitrogen or other evidenced elements with true species/reaction/free/phase/structural-water evidence. Never fit two unknown quantities using one residual; COD/VOC/NOx/total dust/element readings do not determine a molecule. Gas gross/pass-through/net, integrated volume and actual rate are distinct. Unclosed balance remains review, not a pass. | `ilcd-2010` |\n| validation_gross | packaging; assets; service | Audit each six-leg packaging card and each asset/repair/water gross event, full wet stock, same-side-only X terms, one provider owner and one real mixed Waste outlet. No gross leg is scaled by a burden/economic fraction. Raw collection is unnormalised, sole quotient once, no duplicate total/components. | `ilcd-2010` |\n| validation_acceptance | manufacture; service | Retain dimensional/finish/assembly, head seating/tension balance, snare engagement/release and acoustic-response inspection to actual specification with inspector/date/disposition. No fixed tension, pitch, holes, life or certification is invented. Rework conformance additionally requires real manufacturer/spec permission and posttests; failed/unapproved work remains in data. | `yamaha-assembly`; `yamaha-tuning`; `yamaha-sound` |\n| validation_completeness | dataset | Check every raw field, numerator route, unit conversion, protocol, source applicability, normative context, uncertainty and exclusions. Mechanical projection/finite measurement checks do not approve scientific methodology, translation, supplier or classification mapping. | `ilcd-2010` |\n\n"
