  calculation_rules:
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "x = A / Q. First convert original raw observations to the row native unit; apply real burden allocation only to burden dimensions. For manufacturing A is original attributable raw numerator plus inherited opening raw/WIP/unassigned non-WIP burden minus only unassigned closing raw/WIP/non-WIP burden and once-justified true other-cohort/function handover. Already-net raw consumption gets no second stock correction; assigned released closing FG is never subtracted. For actual performed service A is original-cohort observed increment after only legitimate unused/unassigned service/charge carryover, using that cohort first-release mass Qc and horizon H. For every gross disclosure A equals complete actual gross leg V, with no stock correction or economic share and no new procurement/provider/credit. Q is corresponding actual first-release kg (Qc for original-cohort service); Q=0 retains raw/load without x. x is applied once; reference finished output is exactly 1 kg."
      inputs:
        - raw
        - native_unit
        - actual_allocation
        - inherited_vectors
        - V
        - Q
        - Qc
        - H
      output: "x"
      source_ids:
        - ilcd-2010
    - id: physical_balance
      applies_to: "all physical gates"
      rule: "opening wet mass + complete actual gross ingress = closing wet mass + complete actual gross egress, with evidenced internal chemical transformations and each true water/species bridge. X terms remove only duplicated OTHER same-side flows; retained new repair material or water remains influx plus full closing wet stock. Reconcile related elements independently; never solve two unknowns from one residual."
      inputs:
        - opening_wet
        - incoming_gross
        - outgoing_gross
        - closing_wet
        - species
        - same_side_overlap
      output: "physical_reconciliation"
      source_ids:
        - ilcd-2010
    - id: packaging_balance
      applies_to: "packaging"
      rule: "For each actual packaging pool separately: opening full empty/attached-WIP-FG/reusable stock + P + I + ER + independent actual repair/water ingress = closing full wet same stock + gross S + EO + W + independent real repair/water egress. P/I whole article once; component bridge disjoint; internal reuse cancels. Each W source in one mixed outlet remains a nonadditive subaccount, not another waste/treatment."
      inputs:
        - opening_pool
        - P
        - I
        - ER
        - S
        - EO
        - W
        - repair_in
        - repair_out
        - moisture_in
        - moisture_out
        - closing_pool
      output: "packaging_reconciliation"
      source_ids:
        - ilcd-2010
    - id: unit_preparation
      applies_to: "raw numerators"
      rule: "Use exact dimensional conversion for recorded units; measured kWh times 3.6 gives MJ. True rates are integrated over their actual interval once; already integrated gas/liquid volumes are not multiplied by time. Volume-to-mass uses independently measured density for that material/state; count-to-mass uses actual calibrated same-configuration batch mass. No provider/energy duplication or invented density."
      inputs:
        - original_value
        - original_unit
        - measured_density
        - actual_state
        - calibrated_batch_mass
        - interval
      output: "native_unit_raw"
      source_ids:
        - ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Whole drum/component/formulation/species identity and real supplier condition; every adopted UUID limited by complete native card context."
