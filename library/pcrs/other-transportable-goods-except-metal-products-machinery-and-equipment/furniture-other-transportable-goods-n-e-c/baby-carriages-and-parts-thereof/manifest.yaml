    support_basis: Mass property and its referenced kg unit group independently checked in public ILCD originals; no current platform read or product identity is claimed.
  upstream_provider_gaps: Actual component supply completeness, composition, compatible upstream inventories, geography, utilities, transport and treatment links require site records.
  source_limitations: Manufacturer product and full manual describe product configuration, not a factory BOM. Natraj is independent qualitative process evidence, not a Bugaboo supplier assertion. ILCD supports attributional allocation, not stroller-specific coefficients or the detailed cohort bookkeeping implementation. No numerical consumption ranges are verified.
  collection_gaps: Actual release net masses Q, configured item masses M, raw/WIP/FG records, observed service horizon H, packaging legs and every exchange quantity remain to be collected. No nominal mass or zero is supplied.
  classification_review: Official 38992 title checked against normalized leaf and UNSD full notes; 38510 dolls-carriage and 49922 invalid-carriage neighbours excluded. Narrower scope accepted under docs/adr/2026-11-20-accept-cpc-38992-folding-stroller-assembly.md.
  deduplication: Current material catalog and accepted mappings inspected for stroller, wheelchair and child-toy neighbours; this retained identity is not reused from another accepted CPC edge.
  qualification: Candidate authored methodology with aligned Chinese only. Target structural and finite measurement checks do not establish scientific, independent translation, study or publication approval. Whole-repository validation belongs to serial integration.
