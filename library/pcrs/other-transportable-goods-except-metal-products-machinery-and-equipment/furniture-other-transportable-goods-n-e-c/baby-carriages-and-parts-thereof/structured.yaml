          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Finished folding chassis, manufactured wheel articles, seat structure and sewn soft goods/restraint plus actual separate articles; actual disjoint supply completeness |\n| starting_condition_role | foreground_final_assembly |\n| product_classification_scope | Accepted narrower complete-stroller assembly subset within CPC 38992 |\n| recursive_input_rule | A finished stroller is not feedstock for its own manufacture; cancel internal whole-set and repair transfers; original-cohort return creates no new Q |\n| upstream_dataset_requirement | Each actual component material/form/route/state/completeness/geographic provider and transport burden once; identity is not upstream inventory |\n| disclosure | manufacturer/model and approved drawing revision; single-seat hand-push folding purpose; exact chassis alloy and polymer composition; supplied frame finish and joint/lock/brake/handlebar completeness; each wheel tyre hub bearing and suspension supply state; seat frame backrest board legrest and hardware; polyester/polyamide sewn seat and canopy with finish; polyester/PU laminated inlay; complete five-point harness buckle straps and anchorage; canopy wires/clamps and basket composition; wrist/carry straps and matching rain cover included once; optional accessories excluded; actual supplier versus onsite operations; dry/wet mass moisture retained fluids and tyre state; calibrated net complete-set M and packaging tare; first-release Q with unique serial/cohort; actual configured safety and release results; failures tests rework and disposition; all raw/WIP stores and inherited vectors; historical FG returns and original Qc; actual service H and original-dispatch reversal; each packaging pool and gross legs; actual utility geography voltage state and provider; physical species/media and independent measurements; exchange-specific allocation and unresolved data |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_whole_supply | manufacture | Receive each complete supplied article once and keep its contained aluminium/plastic/foam/textile/finish/grease/water only as non-purchased composition subaccounts. A supplied assembled module replaces its separately listed contained cards; record a disjoint make-or-buy map before use. Retain supplier metal processing, moulding, sewing, joining and finishing upstream, with transport and one provider per delivered input. Do not replace assembly by finished-stroller purchase. | bugaboo-butterfly2-product; natraj-stroller-manufacture |\n| b_route_release | manufacture and finished | Include actual receipt and compatibility checks, frame/wheel/seat/soft-goods/harness fitting, all configured fastenings, adjustment, folding/open-lock and brake verification, restraint anchorage and buckle checks, dimensional/functional checks and every real destructive/sample test before first complete release. Apply the actual approved release plan, not invented torque/load/age/standard thresholds. All failed, unapproved, reworked, idle, startup/shutdown and cleanup activity retains its real exchanges and disposition. The user manual alone is not proof of factory safety qualification. | bugaboo-butterfly2-manual; natraj-stroller-manufacture |\n| b_q | finished | Q is the sum of actual measured net kg of complete same-configuration strollers uniquely first quality-released in the cohort, including all defined integral and accompanying items once. Weigh each whole configuration as M with a calibrated scale and real packaging tare; record moisture/fluids/tyre state and separate rain-cover mass. Closing first-released FG already belongs to Q; do not add it as another output or subtract it as manufacturing WIP. Dispatch, reinspection, returns and repair do not create new Q. No catalogue mass, load rating or secondary property supplies kg/item. | bugaboo-butterfly2-product; bugaboo-butterfly2-manual |\n| b_new_flows | all actual operations | Cards are a bounded route checklist, not permission to erase an actual unlisted exchange. Add each actual packaging article with all six gross legs, material, supplied formulation, fuel, heat carrier, utility, replaced asset/part, waste stream and measured chemical species separately with its collection and identity before claiming dataset completeness. A whole bought formulation is purchased once; only actual in-house mixing buys each separate ingredient and records mixing energy/loss. No presumed boiler, steam, combustion, solvent, shielding gas or compressed-air purchase is created for mechanical assembly. | natraj-stroller-manufacture |\n| b_stocks | manufacture | For each exchange j and real supply vintage, record disjoint opening/closing raw and auxiliary stocks, component stores, in-process fluids/charge and WIP with physical amounts, composition, moisture and every inherited exchange vector. U_j is current manufacturing expenditure after one justified non-WIP unused/unassigned stock correction. Combine U_j with opening WIP vectors and carry forward only evidenced closing WIP vectors. Already stock-corrected consumption is not corrected again. Closing FG never enters the manufacturing subtraction. Failed parts, waste, samples and sold scrap retain their manufacturing/treatment burdens unless a genuinely other cohort/function and justified allocation/handover transfer that vector once. Internal handoffs conserve physical quantities/vectors and cancel at the combined gate. | ilcd-allocation-2010 |\n| b_service | service | Trace actual storage, packing, handling, dispatch, returns, reinspection and incremental post-release work to original cohort Qc and observed horizon H. Keep opening/closing FG and repair WIP physical mass and manufacturing/service vectors. Reverse original dispatch assignment only from its real evidence D_rev; returned physical mass may differ through missing parts, additions, contamination or water. New and old replacement parts and removed reusable/waste parts have their own measured stores/vectors. Already performed original-cohort service is not removed because FG stays in store; only unused/unassigned service or charge carries forward. Manufacturer/specification permission plus postwork tests and acceptance govern continued qualification, while all unauthorized/failed actual work and actual disposition remain. Repair/reinspection/dispatch never creates new Q. | ilcd-allocation-2010 |\n| b_gross_physical | all gross disclosure rows | A gross event row uses full real event quantity V before allocation; its single quotient never takes a manufacturing/service burden vector, Bopen+U-Bclose, revenue share or net stock consumption as the numerator. Gross rows disclose physical legs and must not attach another purchase/provider/credit. Their independent attributable upstream or service burden dimension A_j is recorded once with original ownership and vintage. Physical gross mass is never reduced by a burden share. The eventual foreground data package must expose both the gross reconciliation view and the assigned-inventory view and must not sum those different views as extra exchanges. | ilcd-allocation-2010 |\n| b_pack_pool | packaging | For each carton, film, pallet, tape, leaflet  separately: opening empty+opening attached WIP/FG+opening reusable pool+P+I+ER = closing empty+closing attached WIP/FG+closing reusable pool+gross shipment S+outward external return EO+W. P/I must be disjoint for the same inbound whole wet article; I preserves actual physical ingress and its one upstream owner. ER includes actual packaging attached to returned strollers. Internal reuse cancels; packaging is excluded from net stroller Q, a second purchase and automatic coproduct status. Each six-leg card has its own actual direction and protocol. If only one mixed waste outlet exists, its one external Waste card/treatment owns the total, while each pool W remains an independently measured origin subaccount and is not re-added. | ilcd-allocation-2010 |\n| b_water | all processes | Reconcile whole wet articles/preparations and their water subaccounts without overlap. Actual natural atmospheric uptake/release in ordinary storage and handling is included without inventing a repair. New liquid water and repair materials remain real inflows even when retained in full wet closing stock. X_in/X_out removes only another same-direction flow term that already contains the same material/water, never stock, a reverse card or a repair permission condition. Distinguish ordinary absorbed/free water, vapour, liquid, genuinely evidenced chemical/structural water and species. This assembly route implies no default reaction water. Independent density/state and physical mass/element balances do not establish molecular speciation or solve two unknowns from one residual. | ilcd-allocation-2010 |\n| b_physical_gates | manufacture; service; consolidated gate | Manufacturing physical gate: opening raw/auxiliary/non-WIP stores + opening WIP + actual receipts and disjoint water uptake = first-release Q + matching closing stores/WIP + every actual waste/loss/return. FG/service gate: opening FG + first-release transfer + actual returned strollers + disjoint issued repair parts/water + opening repair WIP = closing FG + gross dispatch + discarded whole strollers + removed components and real water/loss outputs + closing repair WIP. Independently reconcile unused repair-part stores, packaging pools and durable assets; issued repair parts are internal transfers from those stores. Cancel internal release/part/repair transfers in the combined gate. Whole and constituent water are not added twice; retained water remains in wet closing mass. Check total mass and relevant metal/C/H/O balances from actual composition without fictional gas species or forced symmetric outlets. | ilcd-allocation-2010 |\n| b_assets_utilities | assets; utilities | Physical asset acquisition/return/retirement and installed fluid inventories are separate from current service burden. Retain actual new/used repair parts, moisture and fluids by individual physical identity. Meter each real electricity, water, compressed air, heat, fuel and identified elementary species if present; add a specific card and protocol for an actual missing exchange before dataset use. No boiler, steam, fuel combustion, shielding gas, compressed-air purchase or heat recovery is presumed for this receiving assembly route. If an external thermal carrier actually exists, record its real Product supply/return mass and thermal states/enthalpy and supplier water/energy convention once; never both a whole provider and duplicated contained mass/MJ nor an invented boiler credit. | ilcd-allocation-2010 |\n| b_thermal | actual external heat carriers | If a real external steam/hot-water/other carrier is present, add its specific Product supply and actual condensate or carrier Product return separately; measure mass and inlet/outlet phase, temperature, pressure and enthalpy. Select one supplier energy/water boundary and one MJ-versus-whole-carrier main inventory with non-additive linked subaccounts. Do not invent a return, boiler fuel, water consumption, recovery credit or duplicate the provider. | ilcd-allocation-2010 |\n| b_species | physical composition and emissions | Independently reconcile total mass and relevant Al/Fe/C/H/O or other elements from actual compositions. Measure free/absorbed water, liquid/vapour phases and any genuinely evidenced reaction/structural water separately. Mechanical assembly implies no reaction water. COD, VOC or total dust are aggregate indicators, not a named molecular mass; establish species, medium, origin and actual gross/net convention independently. One residual cannot determine two unknowns, and inventory balancing must not fabricate a gas species or density. F is real new influx; X removes only another same-direction term already containing the identical mass, never wet closing stock, repair input or a reverse-direction card. | ilcd-allocation-2010 |\n\n"
