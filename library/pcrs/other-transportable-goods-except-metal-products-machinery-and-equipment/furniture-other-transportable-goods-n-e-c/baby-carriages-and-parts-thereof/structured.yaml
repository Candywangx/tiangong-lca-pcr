  calculation_rules:
    - id: raw_conversion
      applies_to: "all raw records"
      rule: "Convert original raw totals to their actual native extensive unit before allocation. Integrate a true rate over its measured intervals once; keep already integrated amounts intact. Mass from volume requires independently measured substance-specific density and state. Electricity kWh to MJ uses exact factor3.6; transport uses real gross payload and distance with declared empty-return convention."
      inputs:
        - "raw totals"
        - "actual units"
        - state
        - density
        - "measured intervals"
      output: "converted raw totals"
      source_ids:
        - ilcd-allocation-2010
    - id: stock_vectors
      applies_to: "manufacturing burden dimensions"
      rule: "For each exchange j: U_j = U_direct_j + B_open_store_j + R_store_j - B_close_store_j. U_direct is directly consumed nonstored expenditure or an already consumption-net record; R_store includes only receipts into the disjoint unused/unassigned non-WIP store. No receipt or vector can be in both U_direct and R_store. Apply the store correction once only to that store partition, excluding WIP, FG, packaging and separately assigned asset service. Do not correct an already consumption-net record again. A_j = opening WIP vector_j + U_j - closing WIP vector_j - legitimate T_other_j. T_other exists only for genuinely other cohort/function with justified transfer once, never ordinary waste/scrap sale alone. Closing FG is absent from the subtraction. Physical gross receipts remain full in their separate reconciliation view."
      inputs:
        - "disjoint raw/WIP and non-WIP vectors"
        - "actual consumption status"
        - "transfer evidence"
      output: "attributable manufacturing numerator A_j"
      source_ids:
        - ilcd-allocation-2010
    - id: service_vectors
      applies_to: "original-cohort service and asset burden dimensions"
      rule: "Determine actual performed service and evidenced asset-use burden by original cohort c and horizon H with the original Qc. Preserve historical vectors and D_rev from the actual original dispatch without assuming equal current return mass. Add true incremental replacement/repair/testing/treatment burdens once. Carry forward only evidenced unused/unassigned service or charge; no subtraction for performed service merely retained in closing FG."
      inputs:
        - "original cohort Qc"
        - H
        - "asset/service histories"
        - receipts
        - D_rev
      output: "attributable service numerator A_cj"
      source_ids:
        - ilcd-allocation-2010
    - id: gross_legs
      applies_to: "every gross disclosure row"
      rule: "Select numerator V as the complete actual physical event leg in its actual extensive unit. Keep V unscaled by economic shares, burden allocation or stock-vector subtraction. Pair its independent upstream/service burden only with its original owner once. P/I overlap and X_in/X_out deduplicate other same-direction flow terms only; full new influx and full wet closing stocks coexist. A mixed-outlet origin does not create a second external row/quantity/provider."
      inputs:
        - "actual measured gross leg V"
        - "event/direction"
        - "original owner"
        - "same-direction counterpart"
      output: "complete gross numerator V"
      source_ids:
        - ilcd-allocation-2010
    - id: single_quotient
      applies_to: "all normalized accounting results"
      rule: "normalized_exchange = A / D exactly once after raw conversion and justified reconciliation/allocation. For manufacturing choose A=A_j and D=Q; for original-cohort service/treatment choose A=A_cj and D=Qc; for a physical gross disclosure choose A=full V and D=its declared original first-release Q or Qc. Those are separate non-additive dimensions. When D is zero or unknown retain real raw quantities and loads and issue no unit result. Save the result with dimension/cohort identity; cards and protocol aggregation retrieve that same result without another division."
      inputs:
        - A
        - D
        - dimension
        - "original cohort"
        - "saved numerator evidence"
      output: "normalized_exchange"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_terminal
      applies_to: "finished"
      requirement: "Preserve complete single-seat hand-pushed seat-stroller terminal, real component versions and all restrictions; no other-model BOM/parameters."
      evidence: "manufacturer originals; actual approved BOM/configuration"
    - id: dq_completeness
      applies_to: "all actual events"
      requirement: "Retain failures/Q0/start-stop/idle/cleanup/tests/unapproved work and disposition; ordinary gaps are never zero."
      evidence: "raw records; meters; disposition receipts"
    - id: dq_gates
      applies_to: "stocks and physical gates"
      requirement: "Manufacturing/FG/combined gates agree; each package six legs, origin/phase/species and vector is separate and nonduplicated; original Qc/H is not replaced by new Q."
      evidence: "original stock/composition/vector/handover ledgers"
    - id: dq_identity
      applies_to: "bindings and providers"
      requirement: "Check complete native identity/type/property/unit and restrictions; preserve ordinary auxiliary UUID/provider/future-quantity gaps."
      evidence: "actual query/direct and exact unit chains; provider scope"
    - id: dq_review
      applies_to: "dataset"
      requirement: "Actual missing core terminal/method evidence requires draft or hold; engineering checks do not imply science/translation approval, mapping or publication."
      evidence: "evidence limitations and unresolved matters"
validation_rules:
  - rule_id: v_complete
    applies_to: "finished; all rows"
    rule: "Verify the complete compatible stroller terminal, all native hard restrictions and configured actual release/weighing. Reject a part-only/toy/car-seat/motorized output; keep ordinary auxiliary gaps explicit without inventing a core failure."
    source_ids:
      - bugaboo-butterfly2-product
      - bugaboo-butterfly2-manual
  - rule_id: v_quantity
    applies_to: "all inventory rows"
    rule: "Require raw conversion, disjoint stock/WIP/FG inherited vectors, full gross V and real original denominator, one single_quotient and Q0 retention. Do not subtract first-released closing FG, shrink physical quantities by burden share, or add non-additive composition/mixed-waste views."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_boundary
    applies_to: "all actual operations"
    rule: "Check every actual supply, manufacturing, test, service, packaging, waste, asset and thermal-carrier boundary. Add an actual missing atomic exchange before completeness; unknown input/species/quantity remains unknown. Verify per-package pool balances, gross and net water/species and one provider/treatment ownership."
    source_ids:
      - natraj-stroller-manufacture
      - ilcd-allocation-2010
  - rule_id: v_review
    applies_to: "methodology and actual dataset"
    rule: "Keep the source-specific limitations, all failed attempts and scope exclusions visible. Scientific review remains pending and translation aligned only; schema/fingerprint/finite checks do not approve the method, safety, translation, mapping or publication."
    source_ids:
      - bugaboo-butterfly2-manual
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "configured attributional first-release manufacture with separate observed original-cohort service"
  allowed_use: "compatible complete single-seat hand-pushed folding seat stroller only with evidenced supply/manufacturing gates and upstream coverage"
  excluded_use: "Exclude motorized or assisted strollers, doubles, running/jogging variants, bassinet-only or car-seat travel systems, newborn nests, separately optional bumper bars and riding boards, bicycle trailers, wheelchairs, toys, detached parts as reference output, repair/remanufacturing as new production and downstream occupied travel/use/end of life. Actual post-release storage, packaging, handling, returns and permitted or unpermitted incremental factory work within observed horizon H remain in original-cohort service accounts. This foreground is a manufacturing method; only verified compatible upstream coverage makes a complete cradle-to-gate dataset."
  required_metadata: "manufacturer/model and approved drawing revision; single-seat hand-push folding purpose; exact chassis alloy and polymer composition; supplied frame finish and joint/lock/brake/handlebar completeness; each wheel tyre hub bearing and suspension supply state; seat frame backrest board legrest and hardware; polyester/polyamide sewn seat and canopy with finish; polyester/PU laminated inlay; complete five-point harness buckle straps and anchorage; canopy wires/clamps and basket composition; wrist/carry straps and matching rain cover included once; optional accessories excluded; actual supplier versus onsite operations; dry/wet mass moisture retained fluids and tyre state; calibrated net complete-set M and packaging tare; first-release Q with unique serial/cohort; actual configured safety and release results; failures tests rework and disposition; all raw/WIP stores and inherited vectors; historical FG returns and original Qc; actual service H and original-dispatch reversal; each packaging pool and gross legs; actual utility geography voltage state and provider; physical species/media and independent measurements; exchange-specific allocation and unresolved data"
  required_quality_disclosure: "original applicability/conflicts, actual measurements, UUID/provider gaps, inherited/gross accounts, actual allocation, H, science/translation not approved"
  update_trigger: "actual model/component/route/release gate/provider/native identity/allocation/service H change requires review in this same identity"
