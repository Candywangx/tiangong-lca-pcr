      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_complete | finished; all rows | Verify the complete compatible stroller terminal, all native hard restrictions and configured actual release/weighing. Reject a part-only/toy/car-seat/motorized output; keep ordinary auxiliary gaps explicit without inventing a core failure. | bugaboo-butterfly2-product; bugaboo-butterfly2-manual |\n| v_quantity | all inventory rows | Require raw conversion, disjoint stock/WIP/FG inherited vectors, full gross V and real original denominator, one single_quotient and Q0 retention. Do not subtract first-released closing FG, shrink physical quantities by burden share, or add non-additive composition/mixed-waste views. | ilcd-allocation-2010 |\n| v_boundary | all actual operations | Check every actual supply, manufacturing, test, service, packaging, waste, asset and thermal-carrier boundary. Add an actual missing atomic exchange before completeness; unknown input/species/quantity remains unknown. Verify per-package pool balances, gross and net water/species and one provider/treatment ownership. | natraj-stroller-manufacture; ilcd-allocation-2010 |\n| v_review | methodology and actual dataset | Keep the source-specific limitations, all failed attempts and scope exclusions visible. Scientific review remains pending and translation aligned only; schema/fingerprint/finite checks do not approve the method, safety, translation, mapping or publication. | bugaboo-butterfly2-manual; ilcd-allocation-2010 |\n\n"
