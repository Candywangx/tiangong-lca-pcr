    reference: "JRC ILCD Handbook General guide for LCA—Detailed guidance (March 2010), attributional §§7.9.2–7.9.3, printed pp255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision, exchange-specific determining physical causality and residual common-process-gate actual-state market value; burden/physical/stock/service accounting design"
  - id: "un-cpc-bedroom-2025"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 structure (30 June 2025) and code38170; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/38170"
    used_for: "Classification context only; does not establish methodology, UUID compatibility or accepted mapping"
