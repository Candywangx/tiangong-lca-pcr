    reference: "USDA Forest Products Laboratory; Wood handbook—wood as an engineering material; FPL-GTR-282 (2021); chapters 4, 8, 10, 13; https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Dry-basis wood moisture and independent sampling/calibration; free/sorbed water, fastening and adhesive conditions; no generic density or performance default"
  - id: "ilcd-attributional-2010"
