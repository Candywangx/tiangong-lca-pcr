system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "classification and complete kit scope"
      rule: "CPC38170 establishes bedroom wooden-furniture context only. The complete untreated pine kit boundary excludes the adjacent coated/hardwood/storage/adjustable/outdoor and mattress alternatives; no whole-leaf coverage or accepted mapping follows from the coordinate."
