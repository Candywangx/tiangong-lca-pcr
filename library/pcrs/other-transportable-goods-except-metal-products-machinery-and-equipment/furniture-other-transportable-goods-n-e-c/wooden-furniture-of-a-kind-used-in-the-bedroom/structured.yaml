    - rule_id: b_route
      applies_to: "whole manufacturing route"
      rule: "Include actual receiving/selection, cutting, remaining planing, mortise/tenon/hole machining, dry sanding, actual permitted permanent-subassembly bonding, complete kit fitting/sample assembly, configuration checks and unique first release. Preserve real failures, test pieces, start/stop, idle, cleanup, dust controls and subcontract operations. Whole supplied articles/preparations are bought once; actual constituents are disjoint subaccounts. Excluded principal routes require a fresh applicability assessment before use."
      source_ids:
        - glb-untreated-london
        - glb-component-machining
        - glb-hardware-kit
        - glb-solid-slats
        - kleiberit-pvac-303
    - rule_id: b_q
      applies_to: "manufacturing and original-cohort service"
      rule: "Q is net kg of unique complete kits at first quality release. Closing first-released FG already belongs to Q; never subtract it as manufacturing B_close or count it beside Q as a second production output. Manufacturing B_close covers raw/WIP and unused/unassigned non-WIP stores/charges only. Keep raw/WIP inherited vector per exchange/cohort. If raw activity already represents stock-corrected consumption, reconcile once without correcting twice."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_service
      applies_to: "actual service horizon H"
      rule: "Keep original release identity/Q_H and actually observed H for packaging, storage, handling, dispatch, returns and actual post-release work. Preserve performed original-cohort service even for held FG; carry forward only unused/unassigned service/charge. Opening/closing FG historical manufacturing vectors and full gross G/R remain separate from current increments. Dispatch/retest/release-after-return is no new Q. A net-delivery denominator is outside this method and would need original delivered quantity/reversal D_rev and historical burdens, not returned mass guessed equal to original delivery. Original Q_H stays fixed at unique first release and H is an observed horizon, never an additional divisor. Close full actual FG custody as O_FG+T_new+R_ext+F_in-X_in=C_FG+G_ext+W_actual+F_out-X_out. T_new is the matched internal first-release handoff already in Q, cancelling on consolidation. Actual R/G retain independently measured present-state gross mass and original cohort. F is true added/removed matter/water; X only proved same-side OTHER-flow duplication. All unauthorized/failed/held actual work remains even when qualification fails."
      source_ids:
        - ilcd-attributional-2010
        - glb-kit-delivery
    - rule_id: b_physical
      applies_to: "manufacturing FG and consolidated gates"
      rule: "Keep full wet opening/closing raw, WIP, FG, residue, reusable packaging and installed assets, with every actual gross external inlet/outlet. First release is an internal manufacturing-to-FG transfer; cancel its matched physical handover on consolidation, not add Q beside FG and G/R. Gross quantities never follow burden shares. Actual new material/water retained in closing stock remains both real influx and full closing mass; F records true additions/removals. X removes only a proved duplicate same-side OTHER actual flow, never stocks, opposite-side flows or card presence."
      source_ids:
        - ilcd-attributional-2010
        - usda-wood-handbook-2021
    - rule_id: b_pack
      applies_to: "each actual packaging article"
      rule: "For each actual whole packaging pool close O+P+I+ER+F_in-X_in=C+S+EO+W+F_out-X_out. O/C are disjoint full wet empty, attached-WIP, attached-FG and reusable stocks. F_in/F_out are independently measured real material or liquid/atmospheric-water additions/removals, never fitted residuals. X subtracts only proved duplicate SAME-side OTHER actual-flow terms linked by event IDs; never stocks, opposite-side flows, card presence or true newly retained influx. Whole supplied articles and constituents are nonadditive; separately supplied onsite components need disjoint receipts or a measured component-to-assembly bridge and paired internal transfers cancelling on consolidation. Natural moisture exchange needs no invented repair or permission. S follows actual gross dispatch, not Q. For one actual mixed outlet use its whole total OR independently measured origin-W partitions, not total plus children or duplicate providers. Actual separate W outlets require actual separate evidence. Actual unknown/damaged Product/Waste states remain recorded with their compatible identity pending, never forced reusable Product."
      source_ids:
        - ilcd-attributional-2010
        - kleiberit-pvac-303
    - rule_id: b_water_carbon
      applies_to: "wood preparations air and water"
      rule: "Independently constrain whole physical mass, relevant elements, dry wood, biogenic wood carbon, fossil formulation/plastic carbon and ambient carbon. Forestry uptake remains with its upstream owner, not a foreground credit. Natural humidity sorption/desorption is real even during ordinary storage/handling; it requires no invented repair permission. Keep free/cell-wall sorbed, liquid/vapour, carrier, chemically structural and independently evidenced reaction water distinct. Glue drying is not automatically a chemical reaction. COD/VOC/PM/TOC and wood dust are not molecular species; one residual cannot determine two unknowns. Distinguish local free atmospheric Resource from gas/water already inside supplied timber, a whole preparation, equipment or purchased gas Product. Contained constituents have that single upstream owner and nonadditive subaccounts, not another free Resource intake. A real separately purchased compressed-air/gas Product needs its own atomic card, state/pressure/native-property interface and one provider; internal air handoffs cancel while all real compression/ventilation energy and release remains. Gross molecular transfer and true net environmental change are different."
      source_ids:
        - usda-wood-handbook-2021
        - ilcd-attributional-2010
    - rule_id: b_rework
      applies_to: "actual tests repairs and dispositions"
      rule: "Actual post-release work and continued conformity need manufacturer/specification permission, postwork tests, acceptance and disposition. Permission is an acceptance gate, never a deletion gate: unauthorized, failed or held actual work retains all occurred flows/load and its original cohort with actual hold/waste outcome. Do not assume broken wood joints or missing kit parts recover. Ordinary waste, failure, sample, sale or external dispatch is not T_other; only a true other cohort/function with justified one-time allocation/handover receives a burden vector."
      source_ids:
        - ilcd-attributional-2010
        - glb-untreated-london
    - rule_id: b_assets
      applies_to: "equipment and actual added atoms"
      rule: "Separate full machine/tool/fluid custody from fulfilled service and one actual embodied/maintenance provider vector. Retain real new/used parts, repairs, worn material, fluid and every water phase; no fixed life or one-machine-per-kg replacement. Only unused/unassigned service/charge carries forward. Add each actual unlisted supply preparation, package, fastener, fuel, heat carrier, refrigerant, water phase, waste and real species individually before using a concrete dataset. Unknown presence is never zero or not_applicable. Real heat/steam needs carrier mass, heat MJ, supply/return and thermal/enthalpy/supplier-water-energy conventions; never invent a boiler. For each actual machine/tool/part/fluid pool close O+R_in+F_in-X_in=C+R_out+F_out-X_out in its reconciled physical unit. R are real external whole-article receipts/removals including actual Waste retirement; F are true measured component/water additions/removals. X only subtracts paired proved duplicate SAME-side OTHER actual flows, never stocks/opposite legs or true retained influx. Keep whole/component supplies disjoint or use a measured assembly bridge with cancelling internal handoffs. One actual mixed outlet total OR independently measured origin partitions has one provider. No replacement, repair, return or moisture event is invented."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-attributional-2010
