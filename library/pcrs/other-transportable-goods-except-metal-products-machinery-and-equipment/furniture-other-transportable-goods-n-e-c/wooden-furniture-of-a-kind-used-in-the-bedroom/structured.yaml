  - id: "cashmores-kd-pine"
    type: "handbook"
    reference: "Cashmores — Scandinavian redwood PSE product information; https://www.cashmores-timber.co.uk/webshop/planed-timber/45mm-thick-pse/145-x-45mm-6x2-scandinavian-redwood-pse/"
    used_for: "Independent real kiln-dried untreated planed pine supply-form example; no proven common order, dimension, species or quantity default"
  - id: "kleiberit-pvac-303"
    type: "handbook"
    reference: "KLEIBERIT 303.0 TDS; version 08:05:2026; https://www.kleiberit.com/fileadmin/Content_new/Produktinformationen/303.0/dbe3030_KSE.pdf"
    used_for: "Conditional whole ready-to-use 1K PVAc joint adhesive, actual qualification and cleanup; adjacent 2K/hot pressing alternatives excluded; no numerical recipe"
