  calculation_rules:
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "Convert undivided original extensive units to the row native unit once before attribution: MJ=3.6×kWh for electrical energy; kg*km=1000×t*km. Integrate only a true measured rate over its real interval/state. A cumulative volume is already integrated. Density is independent for that actual substance/state; no secondary-property coefficient supplies kg/item or density."
      inputs:
        - raw_i
        - unit_i
        - measured_state
        - conversion_evidence
      output: "U_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_manufacturing
      applies_to: "all inventory rows"
      rule: "For the burden dimension only: A_m_i = B_open_i + U_attributed_i - B_close_i - T_other_i. B vectors are exchange/cohort-specific inherited raw/WIP and unused/unassigned charges. B_close excludes already first-released FG. Ordinary rejects/waste/samples/sales and treatment are not T_other; that transfer requires a real other cohort/function and justified single handover. Already stock-corrected consumption is not stock-corrected again. Never apply this rule to gross V."
      inputs:
        - B_open_i
        - U_attributed_i
        - B_close_i
        - T_other_i
        - cohort
      output: "A_m_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "all inventory rows"
      rule: "A_s_i is actually performed original-cohort service over H plus assigned prior vector actually used, after justified sharing and one provider ownership. Original Q_H remains its denominator. Closing FG does not reverse performed service; only unused/unassigned charge/service is carried forward. Keep historical manufacturing burdens and gross physical custody separately. Unauthorized/failed occurred work retains its real increments and hold/waste outcome."
      inputs:
        - original_cohort
        - Q_H
        - H
        - actual_service
        - assigned_prior_vector
        - unused_charge
        - allocation_evidence
      output: "A_s_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_asset_service
      applies_to: "all inventory rows"
      rule: "Derive actual fulfilled h and one embodied/maintenance provider vector from observed use/capacity and exchange-specific justified attribution. Physical whole-machine/parts/fluid stock remains separate. No fixed lifetime, full-machine purchase per kg or guessed capacity/provider factor; missing conversion prevents dependent numerical results. Keep unused/unassigned service/charge only as carryover."
      inputs:
        - fulfilled_h
        - actual_capacity
        - provider_vector
        - cohort
        - driver
      output: "A_asset_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_gross
      applies_to: "all inventory rows"
      rule: "For each gross card N_i = V_i, its actual complete physical leg in the row extensive unit. V_i is never B_open+U-B_close, attributed manufacturing/service burden or an economic share. Real influx remains even in full closing stock. X removes only proved duplicate same-side OTHER actual-flow terms, never stocks, opposite-side flows or card presence. Gross disclosure creates no second purchase/provider burden/treatment or credit; assign any true burden separately once."
      inputs:
        - V_i
        - event_id
        - actual_state
        - disjoint_bridge
        - cohort
      output: "N_gross_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_numerator
      applies_to: "all inventory rows"
      rule: "Select one applicable numerator dimension per ledger cell: manufacturing burden A_m_i; original-cohort service/charge A_s_i; actual asset service A_asset_i; gross disclosure complete V_i. Do not add gross disclosure into burden totals or apply burden allocation/stock correction to V. Split different actual cohorts/functions with their own original denominator, not a blended mass."
      inputs:
        - A_m_i
        - A_s_i
        - A_asset_i
        - V_i
        - dimension
        - cohort
      output: "N_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_denominator
      applies_to: "all inventory rows"
      rule: "Q = sum of calibrated measured net complete-kit kg uniquely first quality-released in the configuration/cohort. Q_c is Q for manufacturing or original Q_H for actual service/gross/asset account over H. Keep closing first-released FG in Q. If Q_c=0 retain all actual numerator and physical records without a unit result. H describes observation coverage only and is never a normalization divisor."
      inputs:
        - net_complete_kit_kg
        - unique_release_id
        - original_Q_H
        - H
      output: "Q_c"
      source_ids:
        - glb-untreated-london
        - ilcd-attributional-2010
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "x_i = N_i / Q_c. This is the only division by the first-release denominator, after raw-unit conversion and one applicable numerator attribution or complete gross V_i. Each card and aggregation references this already-calculated x_i without dividing again. Reference output is exactly 1 kg. Q_c=0 has no unit x_i and retains real load."
      inputs:
        - N_i
        - Q_c
      output: "x_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_pack_balance
      applies_to: "all inventory rows"
      rule: "For each actual whole packaging pool close O+P+I+ER+F_in-X_in=C+S+EO+W+F_out-X_out. O/C are disjoint full wet empty, attached-WIP, attached-FG and reusable stocks. F_in/F_out are independently measured real material or liquid/atmospheric-water additions/removals, never fitted residuals. X subtracts only proved duplicate SAME-side OTHER actual-flow terms linked by event IDs; never stocks, opposite-side flows, card presence or true newly retained influx. Whole supplied articles and constituents are nonadditive; separately supplied onsite components need disjoint receipts or a measured component-to-assembly bridge and paired internal transfers cancelling on consolidation. Natural moisture exchange needs no invented repair or permission. S follows actual gross dispatch, not Q. For one actual mixed outlet use its whole total OR independently measured origin-W partitions, not total plus children or duplicate providers. Actual separate W outlets require actual separate evidence. Actual unknown/damaged Product/Waste states remain recorded with their compatible identity pending, never forced reusable Product."
      inputs:
        - O
        - P
        - I
        - ER
        - C
        - S
        - EO
        - W
        - F_in
        - F_out
        - X_in
        - X_out
        - paired_event_ids
        - disjoint_source_pools
      output: "independent_packaging_reconciliation"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "At manufacturing, FG-service and consolidated gates: full opening wet stock plus all true external inflows equals full closing wet stock plus all true external outflows with only independently evidenced transformations/measurement uncertainty. Cancel matched internal first-release transfer; keep external G/R and complete FG once. Wood-only u=(wet-dry)/dry and dry=wet/(1+u); exclude metal/adhesive/packaging fractions before this wood relation. Relevant element, origin-specific carbon and water-phase closures need independent constraints; no two-unknown residual fit."
      inputs:
        - full_O
        - gross_in
        - full_C
        - gross_out
        - independent_phases
        - independent_elements
        - carbon_origin
      output: "independent_physical_reconciliation"
      source_ids:
        - usda-wood-handbook-2021
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "whole kit and all rows"
      requirement: "Match actual whole manufactured terminal and every native CAS/material/form/route/grade/geography/medium/type/property. Broad compatible family is narrowed by complete row context, not classification or SKU name alone; no hard conflict waiver."
      evidence: "exact native records and chain; actual BOM/supplier/specification"
    - id: dq_primary
      applies_to: "source synthesis"
      requirement: "Distinguish whole-product manufacturer, component operation, actual supply form, formulation and attributional method. No common SKU/order/factory or quantitative defaults are implied. Retain adjacent coated/hardwood/adjustable/storage/mattress alternatives and current applicability limitations."
      evidence: "complete primary originals and context; actual qualification"
    - id: dq_measurement
      applies_to: "Q and every raw event"
      requirement: "Measure calibrated net whole-kit mass and independent moisture by configuration; actual extensive units and phase-specific state/density; representative sampling/uncertainty. No future site amount, geometry, load, formaldehyde limit, yield, energy or lifetime is invented."
      evidence: "raw weights/meters; calibration; sample method; actual tests"
    - id: dq_completeness
      applies_to: "full period upstream and cohorts"
      requirement: "Include zero/failed/startstop/idle/cleanup/rework; each raw/WIP/FG inherited exchange vector; supplier-included packaging and one actual upstream owner. Actual event absence needs evidence; an unknown identity/provider/quantity is not zero."
      evidence: "complete stock/event/cohort ledger; provider boundary; explicit gaps"
    - id: dq_gross
      applies_to: "each physical gate packaging and asset"
      requirement: "Keep complete gross legs independent of burden allocation; all actual six directions and stock/repair/water phases. New influx remains with full closing stock; whole/component bridges disjoint and each true mixed outlet counted once."
      evidence: "independent wet-mass/element/water and six-leg closures"
    - id: dq_service
      applies_to: "original-cohort work and claims"
      requirement: "Keep original Q_H/H, matched gross G/R, original manufacturing history and actual new increments; no closing-FG removal of performed service. Permission/posttests support acceptance, not deletion of failed occurred work. Engineering checks do not approve methodology, translation, mapping or publication."
      evidence: "release/history; actual work/tests/disposition; review state"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "These requirements apply before a concrete dataset is used. Unknown data remain unknown; engineering inspection checks declared relationships and source fidelity, not actual site measurements or scientific approval."
    source_ids: []
  - rule_id: v_whole
    applies_to: "reference kit and every exchange"
    rule: "Require complete same-configuration kit BOM, instructions, allowed supply/machining/joint route, actual test/first-release records and physically compatible manufactured Product reference. No wrong CAS, form, grade, route, medium, type, component substitute or versionless identity guess; preserve all native limitations in the selected row. Missing auxiliary/provider evidence remains explicit and blocks only dependent numerical use; a missing whole core identity is a genuine core hold."
    source_ids:
      - glb-untreated-london
      - glb-kit-delivery
      - ilcd-attributional-2010
  - rule_id: v_measurement
    applies_to: "Q raw records and sole quotient"
    rule: "Q is sum of actual measured net complete-kit mass first released once, with calibration/configuration/moisture and no packaging. All protocols collect undivided raw readings. Convert units and attribute once before x_i=N_i/Q_c; gross cards use full actual V_i. Collection aggregation and card use reference this same quotient without redivision. Q_c=0 retains actual numerators/flows and produces no unit result. Future unknown quantities cannot be declared measured or passing."
    source_ids:
      - usda-wood-handbook-2021
      - ilcd-attributional-2010
  - rule_id: v_closure
    applies_to: "manufacturing service packaging and assets"
    rule: "Independently reconcile all gross wet physical mass and relevant elements/carbon/water at manufacturing, FG-service and consolidated gates; full opening/closing stocks and all six actual packaging legs are retained. New/repair/water inflows remain even if at closing; X only removes duplicate other inlet/outlet. Whole articles and their components never overlap; one mixed outlet is not added beside its component pools. Never infer two unknowns from one residual."
    source_ids:
      - usda-wood-handbook-2021
      - ilcd-attributional-2010
  - rule_id: v_history
    applies_to: "burdens cohorts and actual work"
