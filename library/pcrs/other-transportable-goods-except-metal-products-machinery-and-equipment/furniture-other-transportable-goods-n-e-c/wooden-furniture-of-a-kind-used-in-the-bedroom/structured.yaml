allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Industrial manufacturing sources do not establish allocation. The following applies only to the declared attributional multifunctional-process situation. Physical gross exchanges remain complete independently of allocation."
    source_ids: []
  - rule_id: a_framework
    applies_to: "attributional multifunctionality"
    rule: "Use this hierarchy only for a declared attributional study whose multifunctionality is legitimately solved by allocation. First directly assign dedicated operations and flows; then actual or virtual subdivision to separate the required function and disjoint other functions. Document feasibility and distortion of any unsplit remainder. Do not freely choose physical/economic allocation or consequential substitution."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "each remaining burden exchange"
    rule: "For each remaining exchange identify the determining physical causal relationship of that exchange with the actual function: cutting/working duty, actual part content, limiting load/volume with duration, actual storage space-time or measured shared service as appropriate. Different exchanges may need different drivers. Demonstrate it causes the amount; a convenient mass/output or economic ratio is not causality. Apply drivers only to burden vectors, never shrink physical gross V."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "genuinely unresolved residual multifunctional-process burden"
    rule: "Only after the previous steps leave a real remainder use contemporaneous actual market values of co-functions in their real state at the same common process gate. Remove downstream finishing, packaging, storage and transport differences to that gate; document negative/zero/nontraded values and unresolved uncertainty rather than fabricate a price or fixed split. This process allocation is distinct from multifunctional-product service equivalence."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_waste
    applies_to: "ordinary production wastes returns and treatment"
    rule: "Selling offcuts, residue, failed kits, samples or packaging is not automatic coproduct creation, manufacturing/handling/treatment debit, avoided-product credit or a T_other transfer. Retain real gross flow and occurred load. A true distinct other function/cohort with a justified allocation/handover receives a vector once; document actual receiver/treatment boundary and uncertainty. Return/reinspection never procures a new whole bed or creates new production."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_bed_kit"
      record_type: "measurement and release register"
      raw_fields: "cohort; configuration; drawing revision; complete BOM; each physical component; net kit kg; wood moisture; calibration; test method and result; acceptance; disposition; unique release time; original Q_H"
      collection_method: "Weigh the complete same-configuration unassembled kit on calibrated scales, summing all its actual parts and included functional articles net of all transport packaging. Independently sample wood moisture. Link complete component/hardware/instruction checks, actual fit/sample-assembly and specification tests with unique first release. Record raw net masses and release flags only; sum Q once without any exchange quotient."
      unit: "kg; item; actual test unit"
      frequency: "each configuration and first release"
      temporal_coverage: "complete cohort including zero release"
      site_scope: "manufacturing gate and all first-released stock"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw records; calibrated instruments; actual material/specification; complete cohort/stock/event bridge; uncertainty; actual provider/permission/test/disposition"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "pine_stock; wood_screw; bed_bolt; barrel_nut; instruction_leaflet; pvac_glue; abrasive_paper"
      record_type: "receiving issue and stock record"
      raw_fields: "row_id; lot; supplier; whole wet mass; species; grade; treatment; original units; receipt; issue; opening raw/WIP; closing raw/WIP; inherited vector by exchange; owner; actual permanent joint and glue specification; whole preparation assay subledger; loss; stock-correction status"
      collection_method: "Weigh whole actual supply receipts/issues and full wet raw/WIP stock; reconcile source/route and unique owner. Count whole preparations/articles once; components and carrier water are disjoint subaccounts. Real onsite joint glue and added water are separate purchased inputs only if actually used. Retain already stock-corrected status. Collect undivided raw only, before unit conversion and attribution; never divide by Q here."
      unit: "kg; original extensive units"
      frequency: "every lot issue and opening/closing"
      temporal_coverage: "complete period and stock history"
      site_scope: "actual receiving machining assembly and stores"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw records; calibrated instruments; actual material/specification; complete cohort/stock/event bridge; uncertainty; actual provider/permission/test/disposition"
    - protocol_id: cp_energy_m
      process_id: "manufacture"
      flow_role: "electricity_m"
      record_type: "meter and duty record"
      raw_fields: "row_id; meter; initial/final reading; original unit; cumulative or rate; real interval; voltage; grid and geography; provider; circuit; operation; idle; failure; startstop; cleanup; cohort; H; allocation driver"
      collection_method: "Retain original cumulative kWh and real rate-time records separately; no integration of cumulative readings again. Convert raw energy once before allocation; assign circuits and actual manufacturing/service duties without overlap. Match real voltage/grid/site/time/provider. Capture all zero-output and failed/idle/cleanup periods. No quotient in collection. The selected native AC flow is CN/China, below1kV, grid-average consumption mix to user. Use it only for an actual matching geography/voltage/supply boundary; other actual supply requires another identity. The UK manufacturing example does not establish applicability of Chinese electricity."
      unit: "kWh; MJ; actual rate units"
      frequency: "every interval and event"
      temporal_coverage: "whole cohort and observed H"
      site_scope: "actual meters circuits and service gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw records; calibrated instruments; actual material/specification; complete cohort/stock/event bridge; uncertainty; actual provider/permission/test/disposition"
