          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_interest | finished_kit | Check specimen-to-original-label-to-kit traceability, evidence and confidence for locality, acquisition and collection rationale; a nine-position hardness sequence alone cannot pass the applicability gate. | unsd-cpc3-2025; michmin-collecting; italmineral-provenance |\n| v_reference | finished_kit | Require a complete fixed nine-position kit, actual identification/condition records and all qualifiers; verify the declared complete-kit output is the sole quantitative reference; its flow UUID remains unresolved. Incomplete kits, substitutes, replicas, ordinary ore and antiques cannot silently share this Q. | geology-mohs-kit; rockman-boxed |\n| v_basis | all inventory rows | Verify current reference Mass/kg, exactly one first-release Q, matching internal transfer and all true numerator units. Every raw value remains undivided until the single calc_normalize operation; per-card and aggregate values reference that result. Q0 forbids a unit result. | ilcd-attributional-2010 |\n| v_stock | manufacture custody combined | Reconcile independent physical and inherited-vector ledgers, whole-wet/bridge exclusivity, all stock categories, gross G/R, F counterpart legs, same-side OTHER-only X and internal cancellation. Closing released FG is never extra production. Preserve unknown water/species as unresolved and do not claim closure from a fitted residual. | nps-geology-2005; ilcd-attributional-2010 |\n| v_service_pack | p_service | Check actual observed H, original Q_c, every gross packaging leg and one provider per external waste. Returned kits cannot restart production; physical destruction is not undone by accounting. Record actual unauthorized work rather than delete its burdens when approval is absent. | ilcd-attributional-2010; nps-geology-2005 |\n| v_allocation | burden vectors | Inspect actual subdivision, exchange-specific causal evidence, any residual same-gate contemporaneous market prices, total reconciliation and zero-output retention. Generic success checks do not prove supplier applicability, scientific approval, translations reviewed, mapping acceptance or publication. | ilcd-attributional-2010 |\n\n"
