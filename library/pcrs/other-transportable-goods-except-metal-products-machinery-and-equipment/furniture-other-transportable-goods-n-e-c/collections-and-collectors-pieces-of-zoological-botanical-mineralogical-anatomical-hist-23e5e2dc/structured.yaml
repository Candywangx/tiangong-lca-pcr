      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Receive burden-bearing individual specimens and supplied articles; reconcile identity/condition, clean only where necessary and permitted, record/label, assemble complete roster and container, inspect/weigh and first release; account separately for subsequent actual custody/dispatch. |\n| starting_condition_role | Purchased discrete natural specimens retain real upstream recovery, preparation and transport burdens. |\n| product_classification_scope | Only the declared fixed mineralogical collection subset. |\n| recursive_input_rule | Do not purchase an already complete kit as new manufacturing feed. Internal kits, recovered specimens and burden vectors transfer once and cancel on combination. Prior collections remain historical stock; never reset provenance or burden to zero. |\n| upstream_dataset_requirement | Compatible provider for every supplied specimen, article, utility and actual transport/treatment/service. Identify completed upstream operations and data gaps without inventing local mining, antique manufacture or avoided disposal. |\n| disclosure | specimen-specific persistent identifier, photograph, verified species/variety, documented locality with confidence and explicit gaps, acquisition chain and retained original labels; evidence of mineralogical collectors interest beyond hardness-test use; fixed nine-specimen roster and feldspar mineral variety; natural origin and real prior preparation; mineral identity and matrix inclusion; absence or disclosure of coatings and repairs; specimen-specific cleaning permission and actual work; complete kit configuration and count; net whole-kit mass and moisture state; functional box tray labels and key versus transport packaging; first-release cohort Q_c and observed service horizon H; site year and supplier interface; each raw/WIP/nonWIP entity and inherited exchange vector; first-release and gross shipment/return ledgers; each transport packaging six physical legs; species phase and independently measured water; single provider ownership and allocation evidence; uncertainty and unresolved identities |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_interest | finished_kit | Verify natural specimen identities, linked provenance records and identifiable mineralogical collectors interest before admission to Q_c; unresolved locality detail is disclosed rather than invented. Hold admission if natural identity or collectors interest is unsupported. | unsd-cpc3-2025; michmin-collecting; italmineral-provenance |\n| b_route | p_make | Implement actual receipt/identity checks, necessary compatible gentle cleaning, identification records/labels, nine-position completeness, functional tray/box assembly, final verification and calibrated whole-kit first-release weighing. Literature is a transparent synthesis of kit supply and specimen care, not a single plant recipe. No default cleaning dose, specimen weight, density, lifetime or route distance. | geology-mohs-kit; rockman-specimens; nps-geology-2005 |\n| b_care | all specimen work | Need and mineral condition determine care. Do not wet-clean gypsum or water-sensitive specimens; do not assume dry dusting is safe for fragile crystals. Record actual protection and seek specialist treatment for damage; no routine coating or invented cleaning formulation. Actual failed or unauthorized treatment, tests and losses remain in the ledger even when output cannot qualify. | nps-geology-2005 |\n| b_configuration | finished_kit | Nine roster positions are required for this configuration. Record actual feldspar variety, matrix and treatments rather than infer species from colour. A supplier substitution, beryl for topaz, missing label or separate specimen sale is a distinct configuration/function and is not interchangeable Q. Record and separately assign real out-of-scope outputs. | geology-mohs-kit; rockman-boxed; rockman-specimens |\n| b_q_gate | p_make; p_service | Q_c is new first release, not net delivery. p_make finished_kit and p_service custody_receipt represent the same internal Q and cancel exactly on combination. Released closing FG already belongs to Q. Track gross outward G and returned R by original cohort; return/reinspection/redelivery creates no Q. Actual holding, packaging, handling, dispatch and postrelease work have separate incremental service account S_c,H over observed H divided only by original Q_c. | ilcd-attributional-2010 |\n| b_completeness | all exchanges | Retain startup/shutdown, idle, cleanup, unsuccessful identification, destructive samples, zero-output periods, breakage and all rework. Required unknowns are not zero. Add a distinct atomic row for every additional real supplied formulation, chemical, gas species, waste destination, packaging article, asset or heat carrier; actual mixing lists each external input and real losses. An absent auxiliary UUID does not permit a grouped exchange. | nps-geology-2005; ilcd-attributional-2010 |\n| b_physical | all ledgers | Maintain manufacturing, custody and combined whole-wet mass gates plus independent relevant element/species checks. Whole-wet entities and mutually exclusive measured dry/individual-water bridges are alternatives, never additive. Distinguish free/adsorbed/structural water and any actual reaction water with independent evidence; do not fit two unknowns to one residual. No chemical identity inferred from COD/VOC, mineral-name formula or total dust. Preserve real positive/negative mass changes F with evidence; ambient humidity is not a repair or new production. | nps-geology-2005 |\n| b_thermal | all utilities | No steam, boiler, fuel, thermal condensate or solvent is presumed. If actually used, add each external Product supply/return separately with measured mass, heat state/enthalpy and supplier water/energy convention; do not duplicate a whole provider. Preserve actual transport legs and shared asset/service use with documented duration and allocation; no default distance or life. | ilcd-attributional-2010 |\n\n"
