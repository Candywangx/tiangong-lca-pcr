          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_scope | all burdens | Use attributional modelling only in a declared allocation-required study context. First assign dedicated purchases and measured operations, then subdivide or virtually subdivide; kit components and rejected work retain their real causes. Do not apportion nine specimens by their collectible prices or call aesthetic value environmental functional equivalence. | ilcd-attributional-2010 |\n| a_causality | remaining shared exchanges | For each remaining exchange identify the determining physical causal relationship and test it against actual operations. Lighting/inspection, storage and transport may have different drivers. Time alone needs demonstrated comparable intensity; actual mass/volume/area/count and duration are chosen by causality, not convenience. Record each driver, evidence and uncertainty. | ilcd-attributional-2010 |\n| a_residual | true residual multifunctional process | Only genuinely unresolved common-process residuals may use contemporaneous market value at the same real process gate and physical state; document failed subdivision/causal explanations and remove later product-specific packing/transport value. Reconcile fractions to the unallocated total. No fixed share, free physical/economic choice, historical appraisal or automatic disposal/recycling credit. | ilcd-attributional-2010 |\n| a_stock | raw WIP nonWIP and service vectors | Keep physical entity stocks separate from inherited exchange vectors. Stock transfers do not create new purchases. Assign net raw use and actual WIP-to-release vectors once; never correct an already net field again. Closing FG manufacturing burden stays with its original released Q. Service after release adds only measured incremental S_c,H; reverse an original delivery posting only when reversing that same posting, not as negative manufacturing or replacement production. | ilcd-attributional-2010 |\n| a_waste | mixed waste and recovered articles | One actual collected mixed solid waste total W has one external treatment provider. Measured origin portions sum to W; they are nonadditive diagnostics and not additional whole W purchases/treatment. Segregated streams get their own atomic rows/providers. Return/reuse is not a new purchase or automatic coproduct; a waste sale alone proves neither credit nor recovery. | ilcd-attributional-2010 |\n\n"
