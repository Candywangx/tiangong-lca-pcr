measurement_rules:
  - id: reference_mass
    applies_to: "finished_kit"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q_c is the sum of measured net whole complete kits newly first released in cohort c, including functional box/tray/labels/key and documented as-released moisture; exclude detachable transport packaging, incomplete kits and rejects. Closing released FG is already in Q_c."
  - id: native_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual native extensive property"
      uuid: ""
    required_unit: "kg; MJ; m3; Item(s)"
    rule: "Keep each physical numerator in its true extensive unit. kWh converts to MJ by 3.6. Integrate only true rates; cumulative gas/liquid volume is already integrated. Independently measure density for that material and state. A support-row secondary volume coefficient is not a measured density."
  - id: count_bridge
    applies_to: "finished_kit"
    required_property_ref:
      name: "Mass; Number of items"
      uuid: ""
    required_unit: "kg; Item(s)"
    rule: "Count complete kits and each roster position independently. When a mass/count conversion is needed, M is calibrated net whole-kit mass divided by counted complete kits of the same configuration and moisture scope; record distribution and uncertainty. Never assume one specimen equals one kit or a fixed kg/item. Item(s) and item have factor 1 only as count units."
  - id: whole_supply
    applies_to: "all material rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Purchase each supplied specimen/article/preparation once at whole delivered mass including matrix and declared moisture. Composition, active fraction and carried water are nonadditive subaccounts. Do not replace a natural specimen with pure stoichiometric mineral mass or purchase its constituents again."
