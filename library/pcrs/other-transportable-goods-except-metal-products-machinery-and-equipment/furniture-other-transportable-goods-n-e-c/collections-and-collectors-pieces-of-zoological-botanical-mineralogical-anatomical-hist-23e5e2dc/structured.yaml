  excluded_products: "Solely classroom/test apparatus without documented collectors interest; decorative articles without such interest;  Commodity ore or reagent; manufactured hardness picks; synthetic replica; gemstones cut/polished for jewellery; mixed zoological/botanical/numismatic/antique kits; restoration of existing collections; resale or repacking of a complete kit."
