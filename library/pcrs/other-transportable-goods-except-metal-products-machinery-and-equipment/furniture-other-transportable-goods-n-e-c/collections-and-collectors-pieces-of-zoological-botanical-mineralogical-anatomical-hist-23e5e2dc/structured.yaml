  production_route: "Receive burden-bearing individual specimens and supplied articles; reconcile identity/condition, clean only where necessary and permitted, record/label, assemble complete roster and container, inspect/weigh and first release; account separately for subsequent actual custody/dispatch."
  market_state: "Complete identified mineralogical collection with documented collectors interest first released at assembly site. No claimed antiquity, historical ownership, universal durability or same-factory evidence synthesis."
