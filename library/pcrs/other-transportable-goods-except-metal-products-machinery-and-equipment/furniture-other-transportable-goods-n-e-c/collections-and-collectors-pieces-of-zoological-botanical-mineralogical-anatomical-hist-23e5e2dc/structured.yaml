allocation_rules:
  - rule_id: a_scope
    applies_to: "all burdens"
    rule: "Use attributional modelling only in a declared allocation-required study context. First assign dedicated purchases and measured operations, then subdivide or virtually subdivide; kit components and rejected work retain their real causes. Do not apportion nine specimens by their collectible prices or call aesthetic value environmental functional equivalence."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange identify the determining physical causal relationship and test it against actual operations. Lighting/inspection, storage and transport may have different drivers. Time alone needs demonstrated comparable intensity; actual mass/volume/area/count and duration are chosen by causality, not convenience. Record each driver, evidence and uncertainty."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "true residual multifunctional process"
    rule: "Only genuinely unresolved common-process residuals may use contemporaneous market value at the same real process gate and physical state; document failed subdivision/causal explanations and remove later product-specific packing/transport value. Reconcile fractions to the unallocated total. No fixed share, free physical/economic choice, historical appraisal or automatic disposal/recycling credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_stock
    applies_to: "raw WIP nonWIP and service vectors"
    rule: "Keep physical entity stocks separate from inherited exchange vectors. Stock transfers do not create new purchases. Assign net raw use and actual WIP-to-release vectors once; never correct an already net field again. Closing FG manufacturing burden stays with its original released Q. Service after release adds only measured incremental S_c,H; reverse an original delivery posting only when reversing that same posting, not as negative manufacturing or replacement production."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_waste
    applies_to: "mixed waste and recovered articles"
    rule: "One actual collected mixed solid waste total W has one external treatment provider. Measured origin portions sum to W; they are nonadditive diagnostics and not additional whole W purchases/treatment. Segregated streams get their own atomic rows/providers. Return/reuse is not a new purchase or automatic coproduct; a waste sale alone proves neither credit nor recovery."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_make"
      flow_role: "finished_kit"
      record_type: "release and weighing records"
      raw_fields: "cohort; configuration; nine position identities; specimen identifiers; photographs; original labels; locality evidence and confidence; acquisition chain; natural identity and collectors-interest decision; count; release timestamp; gross whole kit; transport tare; net mass; moisture state; calibration; rejected and held status"
      collection_method: "Weigh every complete accepted kit or a justified traceable same-configuration batch on calibrated scales; reconcile specimen identifiers and functional versus transport contents. Preserve every raw weighing and failed/held decision. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "kg; Item(s)"
      frequency: "each release"
      temporal_coverage: "actual cohort c"
      site_scope: "actual assembly site"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale certificate; raw tickets; roster reconciliation; acceptance"
    - protocol_id: cp_make
      process_id: "p_make"
      flow_role: "individual physical inputs and outputs"
      record_type: "receipt meter test and stock records"
      raw_fields: "row id; event id; unit; quantity or true rate; interval; supplier and lot; material state; source/destination; raw/WIP/nonWIP entity; opening closing quantities; inherited vector; failed work; gross/net flag; allocation driver"
      collection_method: "Read each actual receipt/meter, weigh individual material stock movements and all losses; independently document mixture/species and moisture. Assign each transaction to one row and retain the unmodified raw amount before conversions/attribution. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "row-native kg; MJ; actual volume/count"
      frequency: "each event and meter interval"
      temporal_coverage: "full production period including Q_c=0"
      site_scope: "actual assembly and stock locations"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices; exact provider scope; raw logs; stock ids and vector genealogy; counterevidence"
    - protocol_id: cp_service
      process_id: "p_service"
      flow_role: "custody returns dispatch utilities waste"
      record_type: "cohort-linked service ledger"
      raw_fields: "original cohort Q_c; horizon H; observation date; opening closing FG; internal Q receipt; G; R; F_plus; F_minus; rejects; whole-kit condition; incremental service; inherited vector; actual work and disposition"
      collection_method: "Link gross each-direction custody events to original cohort and prior dispatch. Measure actual service increments and physical changes; preserve unauthorized work and post-tests. Identify independently added/removed components as F with matching physical supply/waste legs. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "kg; MJ; observed time"
      frequency: "each event"
      temporal_coverage: "observed H only"
      site_scope: "actual custody/service site"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch/return links; condition photographs; meters; work and approval records"
    - protocol_id: cp_pack
      process_id: "p_service"
      flow_role: "each transport packaging article"
      record_type: "separate material stock ledger"
      raw_fields: "packaging id and composition; opening empty/WIP/FG/reusable; purchased; external return received; closing empty/WIP/FG/reusable; gross shipment outward; external return outward; waste; internal reuse; whole-wet state"
      collection_method: "Weigh each physical article leg and its empty/attached stocks separately. Reconcile carton, paper cushioning and tape independently; additional actual packaging gets its own ledger and cards. Whole supplied article includes constituents once. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "kg; measured article count"
      frequency: "each movement and inventory boundary"
      temporal_coverage: "same H and cohort scope"
      site_scope: "actual packaging stores and dispatch"
      aggregation_rule: "per reference flow"
      quality_evidence: "purchase/return/delivery tickets; wet tare and stock audit; waste provider ownership"
    - protocol_id: cp_inbound_pack
      process_id: "p_make"
      flow_role: "each incoming specimen packaging article"
      record_type: "separate material stock ledger"
      raw_fields: "packaging id and composition; opening empty/WIP/FG/reusable; purchased; external return received; closing empty/WIP/FG/reusable; gross shipment outward; external return outward; waste; internal reuse; whole-wet state"
      collection_method: "Weigh each physical article leg and its empty/attached stocks separately. Reconcile carton, paper cushioning and tape independently; additional actual packaging gets its own ledger and cards. Whole supplied article includes constituents once. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "kg; measured article count"
      frequency: "each movement and inventory boundary"
      temporal_coverage: "same H and cohort scope"
      site_scope: "actual packaging stores and dispatch"
      aggregation_rule: "per reference flow"
      quality_evidence: "purchase/return/delivery tickets; wet tare and stock audit; waste provider ownership"
    - protocol_id: cp_physical
      process_id: "p_make"
      flow_role: "mass element species and water"
      record_type: "independent measurement reconciliation"
      raw_fields: "whole-wet masses; exclusive dry and individual water fractions; element assay; mineral phase; gaseous and liquid species; actual reaction evidence; sampling uncertainty; F real additions/removals; other-flow X ownership"
      collection_method: "Measure independently using suitable balances, sampling and documented analysis. Compare whole mass and relevant element accounts separately; resolve each water and gas unknown independently. X marks only an OTHER flow already counted on the same side of the same gate, never stocks, opposite sides or mere card existence."
      unit: "kg; actual assay units"
      frequency: "each material state and reconciliation period"
      temporal_coverage: "manufacture plus observed H"
      site_scope: "matching physical gates"
      aggregation_rule: "Keep raw unnormalized facts; apply calc_mass_gate; no residual fitting or duplicate whole/dry/water sum."
      quality_evidence: "independent analyses; phase evidence; raw measured uncertainties; closure investigation"
    - protocol_id: cp_physical_service
      process_id: "p_service"
      flow_role: "mass element species and water"
      record_type: "independent measurement reconciliation"
      raw_fields: "whole-wet masses; exclusive dry and individual water fractions; element assay; mineral phase; gaseous and liquid species; actual reaction evidence; sampling uncertainty; F real additions/removals; other-flow X ownership"
      collection_method: "Measure independently using suitable balances, sampling and documented analysis. Compare whole mass and relevant element accounts separately; resolve each water and gas unknown independently. X marks only an OTHER flow already counted on the same side of the same gate, never stocks, opposite sides or mere card existence."
      unit: "kg; actual assay units"
      frequency: "each material state and reconciliation period"
      temporal_coverage: "manufacture plus observed H"
      site_scope: "matching physical gates"
      aggregation_rule: "Keep raw unnormalized facts; apply calc_mass_gate; no residual fitting or duplicate whole/dry/water sum."
      quality_evidence: "independent analyses; phase evidence; raw measured uncertainties; closure investigation"
  calculation_rules:
    - id: calc_release
      applies_to: "finished_kit"
      rule: "Q_c = sum of newly first-released complete-kit net masses in cohort c. Each release counted once; current closing FG is already included. Count and functional configuration are independent checks, not a substitute mass denominator."
      inputs:
        - cp_release
      output: "Q_c"
      source_ids:
        - geology-mohs-kit
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert each un-divided raw reading to its actual extensive row unit; sum integrated amounts once, integrate only rates, preserve signed correction with original record. Define V_r as the complete gross physical amount of that row/direction/event after unit conversion only. V_r is not stock-corrected or multiplied by an economic fraction."
      inputs:
        - cp_make
        - cp_service
        - cp_pack
      output: "V_r"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_vectors
      applies_to: "manufacturing and service burden ledgers"
      rule: "A_cr = attributable undivided manufacture exchange vector after direct assignment and actual residual allocation plus inherited opening raw/WIP vectors minus the corresponding closing raw/WIP vectors and separately assigned real other functions. NonWIP tools carry their documented service share, not a second whole purchase. Keep stock vectors distinct from entity masses; never re-correct already net quantities. S_cHr contains only actual incremental postrelease service for original c during observed H, no fresh burden for internal or returned existing kits. All rejected/test/idle/cleanup/Q0 work remains attributed or explicitly carried, never erased."
      inputs:
        - cp_make
        - cp_service
        - cp_pack
      output: "A_cr; S_cHr"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "For Q_c > 0 calculate q_Vr = V_r / Q_c exactly once for physical disclosure, and separately q_Ar = A_cr / Q_c and q_Sr = S_cHr / Q_c exactly once for burden vectors. These are distinct coordinates, not additive alternative purchases. Finished first-release row is Q_c / Q_c = 1 kg. Cards and collection aggregation only reuse these results, never divide them again. When Q_c = 0 retain every raw physical and burden quantity with disposition; issue no unit result."
      inputs:
        - V_r
        - A_cr
        - S_cHr
        - Q_c
        - cp_release
      output: "q_Vr; q_Ar; q_Sr"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_fg
      applies_to: "p_service"
      rule: "O_FG + Q_c + R + F_plus + U_water = C_FG + G + J + F_minus + E_water. O/C include all actual custody locations of already first-released kits, including subsequent quality holds, on the same whole-kit mass basis; never-released held kits remain WIP; J is the separately measured rejected/retired complete-kit exit, not additionally counted again inside W. F_plus/F_minus are actual postrelease component additions/removals with matched supply/waste or stock movement, not natural moisture relabelled as repair. U_water/E_water are separately measured passive moisture exchange and have their own air-input/output rows; they are not F repair additions/removals. Full kit disassembly transfers its entire state/vector to named components and closes that kit entity."
      inputs:
        - cp_service
        - cp_physical
        - cp_physical_service
      output: "reconciled FG ledger"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_pack_balance
      applies_to: "each packaging article"
      rule: "Opening empty/attached-WIP/attached-FG/reusable stock + external purchases + external returns received = closing of those same stocks + packaging on gross physical shipments + separate external returns outward + actual waste. Internal reuse cancels. Do not substitute net kit Q, treat an external return as a purchase, or include functional tray/box twice. Wet packaging and retained liquid use one whole-wet basis or a mutually exclusive measured bridge."
      inputs:
        - cp_pack
        - cp_inbound_pack
        - cp_physical
        - cp_physical_service
      output: "each balanced packaging ledger"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_mass_gate
      applies_to: "p_make; p_service; combined"
      rule: "At each physical gate opening raw/WIP/nonWIP entities + gross actual mass inputs = closing entities + gross mass outputs on one whole-wet basis. Exclude energy from mass. Include independent solids/water/gas measurements and retained residues. At the combined gate cancel internal Q and internal collected-waste transfer exactly; do not add closing FG to Q. In the FG subledger F additions/removals have matching counterpart legs and cancel as internal transformations on combination. An OTHER subtotal uses X solely to remove the identical OTHER flow already on the same side; X never subtracts stock, opposite-side flow or a row merely because a card exists. Check relevant elements independently; do not fit closure by inventing species or water."
      inputs:
        - cp_make
        - cp_service
        - cp_physical
        - cp_physical_service
        - cp_pack
      output: "manufacture custody and combined mass checks"
      source_ids:
        - nps-geology-2005
    - id: calc_waste
      applies_to: "mixed_waste_external"
      rule: "One measured external W reconciles opening collected waste plus make_waste_transfer plus actual service-generated waste minus closing collected waste. W_make and W_service are measured nonadditive origin portions whose sum is W; never add W to its portions. J or F_minus included in this total is a linked subaccount, not an extra physical exit. Use exactly one provider per actual external stream and separately attributable service/manufacturing burden once."
      inputs:
        - cp_make
        - cp_service
        - cp_physical
        - cp_physical_service
      output: "W and nonadditive origins"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flows"
      requirement: "Verify whole supplied-state identity and native hard restrictions including every basename, synonym/comment, CAS, route, grade, form, geography, media, type and all properties. Do not bind from name/classification alone; keep unresolved atomic identities explicit."
      evidence: "provider specification; actual direct-record context; identification record"
    - id: dq_measure
      applies_to: "all amounts"
      requirement: "Calibrated raw data with real units, timestamps, location, moisture/configuration, uncertainty and rejected/zero-output periods. Missing mandatory quantities remain unresolved; no invented yield, density, unit weight or cleaning formula."
      evidence: "raw measurements and sampling plan"
    - id: dq_sources
      applies_to: "method and supplier evidence"
      requirement: "Keep complete source context and adjacent exclusions. Kit-market, individual specimen and museum-care sources jointly support a technical synthesis; none proves a common SKU/site. Generic ILCD allocation guidance is separately assessed, not inferred from industrial evidence or a successful fragment read."
      evidence: "retained originals; locators; applicability assessment; adverse evidence"
    - id: dq_genealogy
      applies_to: "stocks and service"
      requirement: "Each raw/WIP/nonWIP/FG entity has a unique history and inherited per-exchange vector; no scalar stock mass used as a burden vector. Service observations identify original cohort and H. Whole purchases, returned articles and internal transfers have one owner without duplication."
      evidence: "stock/vector genealogy and original dispatch records"
validation_rules:
  - rule_id: v_interest
    applies_to: "finished_kit"
    rule: "Check specimen-to-original-label-to-kit traceability, evidence and confidence for locality, acquisition and collection rationale; a nine-position hardness sequence alone cannot pass the applicability gate."
    source_ids:
      - unsd-cpc3-2025
      - michmin-collecting
      - italmineral-provenance
  - rule_id: v_reference
    applies_to: "finished_kit"
    rule: "Require a complete fixed nine-position kit, actual identification/condition records and all qualifiers; verify the declared complete-kit output is the sole quantitative reference; its flow UUID remains unresolved. Incomplete kits, substitutes, replicas, ordinary ore and antiques cannot silently share this Q."
    source_ids:
      - geology-mohs-kit
      - rockman-boxed
  - rule_id: v_basis
    applies_to: "all inventory rows"
    rule: "Verify current reference Mass/kg, exactly one first-release Q, matching internal transfer and all true numerator units. Every raw value remains undivided until the single calc_normalize operation; per-card and aggregate values reference that result. Q0 forbids a unit result."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_stock
    applies_to: "manufacture custody combined"
    rule: "Reconcile independent physical and inherited-vector ledgers, whole-wet/bridge exclusivity, all stock categories, gross G/R, F counterpart legs, same-side OTHER-only X and internal cancellation. Closing released FG is never extra production. Preserve unknown water/species as unresolved and do not claim closure from a fitted residual."
    source_ids:
      - nps-geology-2005
      - ilcd-attributional-2010
  - rule_id: v_service_pack
    applies_to: "p_service"
    rule: "Check actual observed H, original Q_c, every gross packaging leg and one provider per external waste. Returned kits cannot restart production; physical destruction is not undone by accounting. Record actual unauthorized work rather than delete its burdens when approval is absent."
    source_ids:
      - ilcd-attributional-2010
      - nps-geology-2005
  - rule_id: v_allocation
    applies_to: "burden vectors"
    rule: "Inspect actual subdivision, exchange-specific causal evidence, any residual same-gate contemporaneous market prices, total reconciliation and zero-output retention. Generic success checks do not prove supplier applicability, scientific approval, translations reviewed, mapping acceptance or publication."
    source_ids:
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply inventory for the same documented complete mineral collection configuration and first-release basis; service is separately bounded by observed H."
  allowed_use: "Attributional modelling using real upstream providers, documented identity and quantities, original-cohort service and explicit uncertainty."
  excluded_use: "Antique authentication, historical value, general biodiversity/numismatic collections, commodity ore, synthetic replicas, automatic credits, indefinite lifetime or aesthetic functional equivalence."
  required_metadata: "specimen-specific persistent identifier, photograph, verified species/variety, documented locality with confidence and explicit gaps, acquisition chain and retained original labels; evidence of mineralogical collectors interest beyond hardness-test use; fixed nine-specimen roster and feldspar mineral variety; natural origin and real prior preparation; mineral identity and matrix inclusion; absence or disclosure of coatings and repairs; specimen-specific cleaning permission and actual work; complete kit configuration and count; net whole-kit mass and moisture state; functional box tray labels and key versus transport packaging; first-release cohort Q_c and observed service horizon H; site year and supplier interface; each raw/WIP/nonWIP entity and inherited exchange vector; first-release and gross shipment/return ledgers; each transport packaging six physical legs; species phase and independently measured water; single provider ownership and allocation evidence; uncertainty and unresolved identities"
  required_quality_disclosure: "Measured versus required-but-unknown quantities, auxiliary identities/provider compatibility, complete stocks and vectors, source limits, allocation, Q0 and observed service coverage."
  update_trigger: "Changed roster/variety, supplier preparation, cleaning or repair route, functional container, boundary, exchange identity, observed service or evidence."
data_sources:
  - id: "geology-mohs-kit"
    type: "handbook"
    reference: "https://geology.com/store/collections/mineral-kit.shtml"
    used_for: "Seller listing for nine Mohs specimens, box and plastic tray; explicitly marketed for hardness testing. Roster evidence only: collectors interest and specimen provenance require independent admission evidence. No factory quantities supplied."
  - id: "rockman-specimens"
    type: "handbook"
    reference: "https://www.rocksandminerals.com/rocks/minerals.htm"
    used_for: "Individual or bagged supplied hand-broken mineral specimens and contrasting varieties; not evidence of the same SKU or factory as the reference kit."
  - id: "rockman-boxed"
    type: "handbook"
    reference: "https://www.rocksandminerals.com/boxed/boxed.htm"
    used_for: "Boxed collection market state and explicit substitution counterexample including beryl-topaz wording; substitutions require a separate configuration."
  - id: "nps-geology-2005"
    type: "official_guidance"
    reference: "https://www.nps.gov/subjects/museums/upload/MHI_AppU_PaleontologyColl.pdf — Museum Handbook Part I Appendix U (2005), Section II, printed U:28–43"
    used_for: "Mineral-specific preventive handling and care limitations; actual PDF context includes fragile specimens, gypsum water exclusion and specialist repair. No LCA allocation or life/recipe is transferred."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf — first edition March 2010, §§7.9.2–7.9.3, printed 255–272"
    used_for: "Attributional subdivision, exchange-specific determining physical causality and only residual same-gate market-value allocation; excludes automatic substitution credits and aesthetic functional equivalence."
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/38963 — CPC 3.0 complete explanatory notes, 30 June 2025, PDF pp.197–198"
    used_for: "Mineralogical collectors-interest scope and adjacent art, stamp and demonstrational-model boundaries; no detailed 38963 subclass explanation is supplied."
  - id: "michmin-collecting"
    type: "handbook"
    reference: "https://www.michmin.org/how-to-collect"
    used_for: "Michigan Mineralogical Society: specimen identifiers, locality, acquisition records and retaining labels; collector practice, not proof of this kit or a production inventory."
  - id: "italmineral-provenance"
    type: "handbook"
    reference: "https://www.italmineral.com/pages/faq — Minerals & Collecting; Authenticity & Quality"
    used_for: "Dealer original: natural status, species, locality, original tag checks and disclosed treatment; limited to its own practice, no common supplier/buyer established."
  - id: "britishfossils-collection"
    type: "handbook"
    reference: "https://britishfossils.co.uk/product/mineral-collection-kit/"
    used_for: "Producer original for a boxed fifteen-genuine-specimen collection with information card; independent market-form evidence, not the nine-specimen roster or shared factory."
