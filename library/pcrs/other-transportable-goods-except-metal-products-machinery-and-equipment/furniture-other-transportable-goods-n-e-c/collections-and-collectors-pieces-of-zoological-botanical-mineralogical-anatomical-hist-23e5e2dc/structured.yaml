system_boundary:
  rules:
    - rule_id: b_interest
      applies_to: "finished_kit"
      rule: "Verify natural specimen identities, linked provenance records and identifiable mineralogical collectors interest before admission to Q_c; unresolved locality detail is disclosed rather than invented. Hold admission if natural identity or collectors interest is unsupported."
      source_ids:
        - unsd-cpc3-2025
        - michmin-collecting
        - italmineral-provenance
    - rule_id: b_route
      applies_to: "p_make"
      rule: "Implement actual receipt/identity checks, necessary compatible gentle cleaning, identification records/labels, nine-position completeness, functional tray/box assembly, final verification and calibrated whole-kit first-release weighing. Literature is a transparent synthesis of kit supply and specimen care, not a single plant recipe. No default cleaning dose, specimen weight, density, lifetime or route distance."
      source_ids:
        - geology-mohs-kit
        - rockman-specimens
        - nps-geology-2005
    - rule_id: b_care
      applies_to: "all specimen work"
      rule: "Need and mineral condition determine care. Do not wet-clean gypsum or water-sensitive specimens; do not assume dry dusting is safe for fragile crystals. Record actual protection and seek specialist treatment for damage; no routine coating or invented cleaning formulation. Actual failed or unauthorized treatment, tests and losses remain in the ledger even when output cannot qualify."
      source_ids:
        - nps-geology-2005
    - rule_id: b_configuration
      applies_to: "finished_kit"
      rule: "Nine roster positions are required for this configuration. Record actual feldspar variety, matrix and treatments rather than infer species from colour. A supplier substitution, beryl for topaz, missing label or separate specimen sale is a distinct configuration/function and is not interchangeable Q. Record and separately assign real out-of-scope outputs."
      source_ids:
        - geology-mohs-kit
        - rockman-boxed
        - rockman-specimens
    - rule_id: b_q_gate
      applies_to: "p_make; p_service"
      rule: "Q_c is new first release, not net delivery. p_make finished_kit and p_service custody_receipt represent the same internal Q and cancel exactly on combination. Released closing FG already belongs to Q. Track gross outward G and returned R by original cohort; return/reinspection/redelivery creates no Q. Actual holding, packaging, handling, dispatch and postrelease work have separate incremental service account S_c,H over observed H divided only by original Q_c."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_completeness
      applies_to: "all exchanges"
      rule: "Retain startup/shutdown, idle, cleanup, unsuccessful identification, destructive samples, zero-output periods, breakage and all rework. Required unknowns are not zero. Add a distinct atomic row for every additional real supplied formulation, chemical, gas species, waste destination, packaging article, asset or heat carrier; actual mixing lists each external input and real losses. An absent auxiliary UUID does not permit a grouped exchange."
      source_ids:
        - nps-geology-2005
        - ilcd-attributional-2010
    - rule_id: b_physical
      applies_to: "all ledgers"
      rule: "Maintain manufacturing, custody and combined whole-wet mass gates plus independent relevant element/species checks. Whole-wet entities and mutually exclusive measured dry/individual-water bridges are alternatives, never additive. Distinguish free/adsorbed/structural water and any actual reaction water with independent evidence; do not fit two unknowns to one residual. No chemical identity inferred from COD/VOC, mineral-name formula or total dust. Preserve real positive/negative mass changes F with evidence; ambient humidity is not a repair or new production."
      source_ids:
        - nps-geology-2005
    - rule_id: b_thermal
      applies_to: "all utilities"
      rule: "No steam, boiler, fuel, thermal condensate or solvent is presumed. If actually used, add each external Product supply/return separately with measured mass, heat state/enthalpy and supplier water/energy convention; do not duplicate a whole provider. Preserve actual transport legs and shared asset/service use with documented duration and allocation; no default distance or life."
      source_ids:
        - ilcd-attributional-2010
