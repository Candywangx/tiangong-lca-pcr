  ordinary_gaps:
  - Actual nine-specimen collector order, natural origin, mineral identities, specimen-to-label provenance and collectors
    interest must pass the declared admission gate; no buyer or common facility is established.
  - Every supplied-state exchange UUID remains unresolved; no historical database identity is treated as a present
    platform observation.
  - Site quantities, supplier recovery/preparation, article composition, utilities, allocation drivers, moisture
    and observed service duration require foreground collection; no numerical inventory is inferred from catalogues.
  core_holds: []
  evidence_synthesis: Nine-position supplier roster plus independent genuine boxed collection example, collector
    provenance practice, NPS mineral care and ILCD attributional hierarchy; bounded technical synthesis, not factory
    observation or independent scientific approval.
