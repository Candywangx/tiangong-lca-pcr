  identity_metadata_notes:
    - row_id: "first_release"
      uuid: "ae0f7c63-1a1a-434f-8040-b28cc8c1da8c"
      issue: "Product; production mix at plant; broad manufactured metal-furniture family. Native synonyms include brass beds and tables plus iron bakers racks and metal curio cabinets; the comment includes indoor and outdoor furnishings and gives general durability assertions. These are examples and marketing context, not a brass-only material requirement, certification or lifetime. No CAS, supply geography, steel grade, dimensions, count, mass or numerical performance is fixed. Only Area is native. Restrict to the complete non-electrical all-steel bed kit and whole assembled-configuration projection defined here; exclude raw stock, a single frame/leg, separate mattress support and mattress. No supplier or performance equivalence follows from this family."
    - row_id: "round_tube"
      uuid: "370d14a6-55f3-4fdd-90b2-84751125ff00"
      issue: "Product; at-plant production mix; native piercing/welding route and welded-pipe/tubing synonyms. Comment describes plate/skelp forming and longitudinal seam welding and also MIG/TIG pipe joining; it does not mandate those joining methods at the bed factory or a large diameter. Select one actual uncoated welded low-carbon round steel tube from cold-rolled strip with traceable mill route, seam, grade and dimensions. No CAS, fixed geography, grade, thickness or density is given. Mass is the only native property. Exclude seamless, stainless, plated or already finished bed assemblies."
    - row_id: "rect_tube"
      uuid: "5b36ddd4-adb1-41da-9456-33e69e0f141c"
      issue: "Product; manufactured finished non-circular welded steel tube at plant; no native CAS, synonyms, fixed grade, geography, surface treatment or dimensions. Only Mass. Select actual uncoated low-carbon rectangular welded tube of documented cold-rolled supply for rails, crossmembers or slats as the drawing specifies; not round/seamless tube, solid strip, stainless or a finished bed part. A different purchased support form needs its own atomic card and upstream route."
    - row_id: "connector_sheet"
      uuid: "13082a6a-e820-45ec-89f5-3c2c3650495b"
      issue: "Product; sheet steel/steel plate; at-plant production mix; iron with minor C/Mn/S/P/Si; comment permits hot or cold rolling. No CAS, fixed grade, dimensions, geography or density. Select actual uncoated cold-rolled low-carbon sheet for documented connector plates only. Native alloy/further-worked taxonomy is inconsistent with its otherwise coherent sheet identity and is disclosed as a taxonomy defect, not a permission to use stainless, coated sheet or prefinished bed parts. Only Mass."
    - row_id: "screw"
      uuid: "895204f6-6425-4814-afc5-cb97e530e892"
      issue: "Product; steel screw assembly auxiliary; GLO at-plant production mix; screw/steel-fastener synonyms. No CAS, fixed alloy, coating, geometry, supplier or numerical amount. Only Mass. Restrict to one actual screw specification with included finish; do not bind bolts, nuts, washers or the whole hardware kit to this screw. Actual individually purchased fasteners remain separate."
    - row_id: "powder_coating"
      uuid: "6e3010f9-fbd3-48f6-95fc-c1b38d2800d2"
      issue: "Product; whole free-flowing formulated polymer coating powder including flow/levelling additives; electrostatic application with heat or UV curing in native comment. No CAS, fixed resin, grade, geography or provider. Only Mass. This method selects one documented purchased thermosetting powder SKU and actual thermal cure; UV-only, liquid paint and neat resin are excluded. Assay, curative, pigment and included additives are composition subaccounts of the single purchase; separate only true extra purchases. No solvent-free or zero-emission assumption."
    - row_id: "alkaline_cleaner"
      uuid: "a0f63f93-1a65-4485-a2cf-36adab2762ce"
      issue: "Product; at-plant alkaline compound detergent; native pH above7 and NaOH/sodium-carbonate examples, not a fixed recipe. No CAS, concentration, supply physical state, geography or supplier. Surfactant taxonomy does not establish a particular formulation. Only Mass. Use one compatible whole supplied alkaline degreasing preparation, including its actual carrier water once. Separate purchased NaOH or dilution water only if outside that preparation; never substitute a pure compound or optical-solvent cleaner."
    - row_id: "phosphate_preparation"
      uuid: "fbf49587-4fb7-4264-83f1-24a662469072"
      issue: "Product; at-plant phosphating solution for ferrous conversion pretreatment; comment describes immersion in dilute solution and iron/zinc/manganese phosphate crystals. No fixed CAS, concentration, metal chemistry, supplier or geography. Only Mass. Conditional card applies only to one real whole supplied immersion iron-phosphating preparation confirmed by SDS/process records; not an assumed universal bed treatment. Spray/nonphosphate treatment needs its actual different named card. Not pure acid, dry salt, spent bath or a default zinc formula."
    - row_id: "cutting_fluid"
      uuid: "576d250f-4f36-4385-939d-0f03b8f95a10"
      issue: "Product; cutting/metalworking coolant and lubricant; native description spans oil, emulsion, paste, gel, aerosol and gases and gives mixing oil/water/emulsifier as an example. No CAS, fixed composition, concentration, geography, mix or route. Only Mass. Select one actual supplied liquid metalworking preparation for cutting/forming, with full SDS and wet supply mass. Its included oils/water/emulsifier are subaccounts; true onsite dilution and losses are separate. Do not use this identity for generic air, dry abrasives or whole equipment."
    - row_id: "fabrication_electricity; finish_electricity; release_electricity; services_electricity"
      uuid: "3d76981f-964a-4865-b588-0e067a2a1163"
      issue: "Product; AC; CN 1–35kV medium-voltage grid-average consumption mix to user, including generation/transmission to customer. Only native Net calorific value in MJ. Verify purchased meter voltage, geography, period, upstream losses and supplier boundary; convert actual kWh by3.6 once before attribution. Low-voltage submeter readings do not prove low-voltage purchase. No particular generation recipe or methodology approval follows from the native compliance wording. Other voltage/geography requires another identity."
    - row_id: "process_water; cooling_water_in; service_water_in"
      uuid: "d1e0e36c-07f0-4a75-bdcb-efb5d9e2ac36"
      issue: "Product; municipal/city/potable/public-supply treated water; at-plant water production/supply to consumer. Native comment permits location-specific filtration/sedimentation/disinfection; no fixed geography, CAS, quality or supplier. Reference Mass/kg; secondary Volume coefficient is not an independently measured density. Match actual potable treatment/provider; not untreated abstraction, DI water, steam, recovered effluent or condensate return. Convert measured volume only with independent density at actual state."
    - row_id: "pack_film_p; pack_film_i; pack_film_er; pack_film_s; pack_film_eo"
      uuid: "e64eb06c-6dc9-45f1-b003-3dc6c44b27e2"
      issue: "Product; PE film/sheet/poly-film CAS9002-88-4; at-plant production mix. No fixed branching grade, gauge, geography, supplier or recycled content. Only Mass. Native luggage classification is an isolated taxonomy defect; all physical descriptions identify PE film. The comment describes PET as a competing polymer, not as this PE. Restrict to one actual PE wrapping-film SKU with supply/composition/finish verified, not resin pellets, PET strap or PE foam."
    - row_id: "pack_pallet_p; pack_pallet_i; pack_pallet_er; pack_pallet_s; pack_pallet_eo"
      uuid: "e882bdf4-1cf6-4f51-93e9-c6b91855ba02"
      issue: "Product; whole wooden board/slat pallet; lumber-mill production mix; only Mass; no CAS, species, dimensions, geography, moisture, treatment, provider or reuse life fixed. Native electrical-energy taxonomy is an isolated defect; its preserved source classification identifies wooden packaging. Verify actual whole pallet and wet condition. Included boards/nails are composition subaccounts; a separately supplied repair board is not a whole pallet. Not steel/plastic pallet or fixed EURO geometry."
    - row_id: "steel_offcuts"
      uuid: "c143745d-be4f-4d8f-b403-2dcbfe685349"
      issue: "Waste; GLO at-plant production mix; unprocessed post-industrial steel scrap from mechanical-part machining/forming, leaving without further treatment. Only Mass; no CAS, fixed alloy, contamination or recovery yield. Restrict to segregated actual uncoated tube/sheet fabrication offcuts with actual oil contamination and destination disclosed; coated rejected beds, mixed sludge and postconsumer scrap require other cards. Sale does not remove manufacture/treatment burdens or establish avoided-production credit."
    - row_id: "spent_powder"
      uuid: "9aa53a82-5462-400e-9096-efab7718201f"
      issue: "Waste; CN at-plant overspray powder collected as solid waste; no quantified waste rate, resin, contamination, provider or disposal method. Only Mass; no CAS. Use solely for actual separately discharged unreusable dry coating overspray in China. Reclaimed powder reused internally is not this external waste; cured chips, wastewater sludge and mixed cleanup residue are different exchanges. Record full gross discharge and actual treatment once; no automatic credit."
    - row_id: "argon_supply"
      uuid: "f83a939c-a58f-44de-a593-d9c9ffb584e4"
      issue: "Product gaseous argon, Mass/kg, with no fixed native CAS, purity, pressure, geography or production route. Qualify the actual separately supplied gaseous argon and supplier pressure/state/assay and preparation boundary; not liquid argon, a premixed shielding gas or free atmospheric resource. Include compression and supplier burdens once; no default gas fraction. Its other-goods taxonomy does not change its gaseous molecular identity."
    - row_id: "nitrogen_supply"
      uuid: "2a55ed5c-77cf-4048-af90-12a5c548a50b"
      issue: "Product gaseous nitrogen at plant, Mass/kg; no native fixed purity, pressure, geography or preparation route. Actual supplier state, assay and upstream boundary must qualify this one gaseous supply, not liquid nitrogen or free atmospheric intake. The steam/hot-water classification contradicts the clear gaseous-nitrogen name and is retained as taxonomy debt; it is not permission to model steam or invent gas preparation."
    - row_id: "phosphoric_acid"
      uuid: "9396269a-cf0d-4b38-ae6d-ab6b91e1dc87"
      issue: "Manufactured finished phosphoric-acid Product, Mass/kg, without native fixed concentration, grade, phase, route, CAS or geography. Conditional use is one documented orthophosphoric-acid/water supply with actual assay and full wet mass; included water is counted once. Not an opaque multi-active phosphating blend, dry phosphate salt or a fixed-concentration default. Qualify actual supply state and provider before use."
    - row_id: "purchased_heat"
      uuid: "e7543af8-5dd2-4066-ad1e-3e2a5b563405"
      issue: "Manufacturing-heat Product at plant, GLO, native Net calorific value/MJ with heat source and carrier unspecified. Use only actual externally supplied heat at the documented delivery boundary and measured energy. This does not identify a boiler, steam loop, temperature, efficiency or carrier density. Record real carrier mass, state, enthalpy and any actual Product return separately where present; add required actual atomic cards before dataset completion. One provider owns the delivered heat; do not also charge its included gas or electricity as foreground heat generation."
    - row_id: "manual"
      uuid: "a07593ed-90ed-4236-b90d-7a41ec14871c"
      issue: "Finished manufactured printed-matter Product at plant, Mass/kg. The broad paper/other-substrate and mailing/printing examples support one actual finished printed-paper assembly booklet; they do not prescribe its paper, ink, binding, format or mass. Included paper, printing and binding have one whole-article owner; not blank paper, plastic-only labels or a three-dimensional printed prototype. No toy insert percentage is adopted."
    - row_id: "sawblade_in"
      uuid: "970801c9-08c1-4d9c-999d-4b66609430be"
      issue: "Finished steel saw-blade or shear-knife Product, GLO at plant, Mass/kg, for cutting blank preparation. Select only one actual supplied complete steel saw blade with documented tool specification and included preparation; not a shear knife purchase, raw steel, bonded abrasive disc, whole cutting machine or spent-tool Waste. No native mass per blade, wear rate or lifetime is given."
    - row_id: "bolt; nut; washer"
      uuid: "691b2092-38f6-4125-bfb4-cab3d86af41f"
      issue: "Finished steel-fastener Product at plant in China, Mass/kg; broad bolts/screws/nuts/rivets and washer classification, no fixed alloy, coating, dimensions or amount. This card is solely its stated actual individually specified bolt, nut or washer with actual finish and compatible Chinese supplier boundary; it does not create a whole hardware-kit purchase. Whole-kit included fasteners are nonadditive components or require a measured disjoint bridge. No assumed bill-of-material percentage."
    - row_id: "pack_foam_p; pack_foam_i; pack_foam_er; pack_foam_s; pack_foam_eo"
      uuid: "3a86ddd1-28f8-45ba-9255-74a405e09f03"
      issue: "Manufactured whole foamed-plastic article Product, Mass/kg. Its cellular-resin/cushioning body supports the actual finished expanded-PE protective foam with documented polymer, state and supplier preparation; the noncellular-sheet classification is contradictory taxonomy debt. Not resin pellets, unfoamed PE film, polyurethane foam or an assumed expansion recipe. Whole wet article and included components are counted once; this Product identity never identifies its discarded Waste."
    - row_id: "pack_powder_bag_p; pack_powder_bag_i; pack_powder_bag_er; pack_powder_bag_s; pack_powder_bag_eo"
      uuid: "0a8faf13-9861-4805-bcee-a212c6dceb04"
      issue: "Manufactured whole paper-bag Product, Mass/kg, generally kraft virgin/recycled paper, open-mouth or valve forms; no mandatory fibre recipe, coating or dimensions. Qualify one actual whole kraft powder bag, including its documented integral PE liner, thread and glue once with nonadditive components or a measured article bridge. No fabricated liner fraction or virgin/recycled ratio. Not a fruit bag, neat paper or a separately supplied liner; discarded bag remains a distinct Waste identity."
    - row_id: "asset_oven_in; asset_oven_transfer_out"
      uuid: "b7fbf2da-6bb0-4f10-b78b-fdf2207373d2"
      issue: "Manufactured whole industrial/laboratory oven Product at plant, Mass/kg. Full English name, bilingual body and classification exclude non-electric bakery ovens specifically; the shortened official Chinese basename omits bakery and mistranslates dielectric, a retained translation defect. Restrict to one actual complete non-bakery industrial coating-curing oven of verified configuration, controls, included fluids and supply route, not a bare heater or installed building. Measure full asset kg; native coefficient one is not one oven equals one kg. Service hours, capital burden shares and actual energy supply remain separate, without invented life or heating route. Usable transfer is this Product; discarded equipment is a distinct Waste."
