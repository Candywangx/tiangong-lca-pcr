  scientific_review: "pending independent scientific review; technical candidate reassessment does not establish scientific approval"
  translation_review: "author-aligned Chinese; no independent translation approval"
  mapping_review: "Current narrower CPC 38149 acceptance is governed by classifications/mappings/cpc-3.0-to-pcr.yaml and docs/adr/cpc3-additional34-20261029-38149.md. Original author-stage mapping comments are historical; they do not override this decision. No independent scientific/translation approval, actual site inventory or publication is granted."
  core_reference_identity: "Whole manufactured metal-furniture Product with Area only; the complete all-steel bed kit is physically qualified by primary terminal evidence and controlled net single-face assembled projection. Whole-kit kg and count remain independently measured; no Area-to-mass conversion or core identity hold identified."
  measurement_basis: "1 m2 net single-face assembled-configuration orthogonal plan-projection union of complete kit; subtract voids and count overlaps once; unique first release Q; independently measured configuration mass/count; no guessed size or mass conversion Loose included manuals/tools/spares keep their actual mass and burden without arbitrary laid-out projected area; only actual installed configuration contributes projection. Observed service horizon is recorded separately, never a second divisor."
  method_scope: "Manufacture a complete new non-electrical single-level steel bed kit with steel headboard and footboard, both side rails, all actual crossmembers/centre beams/support legs, the entire steel slat system, joining hardware, fitted caps/pads and actual included assembly instructions. Begin with real supplied uncoated cold-rolled low-carbon welded steel tube and conditional sheet plus complete actual purchased parts/formulations. Include cutting, tube bending, punching/drilling/pressing where real, joint preparation and actual welding/bolted connections, dressing, complete real pretreatment/rinsing/drying, whole thermosetting powder application/reclaim and thermal cure, final fitting/sample assembly, configuration-specific QC and complete-kit first quality release. The terminal is an unassembled kit across all its cartons; it is not a single bare welded frame or support component. Supplier-prefabricated pieces retain their complete upstream fabrication/finishing and replace only real onsite steps. Original-cohort storage/packaging/handling/dispatch and actual later work remain separate incremental services through the stated factory gate."
  source_limitations: "The method is a qualitative technical synthesis. Zehao establishes a complete all-carbon-steel bed terminal with head/foot boards and continuous steel slats plus in-house cutting/welding/powder coating and flat-pack hardware/manual. Its two images show different slat profiles; neither fixes a universal drawing or recipe. SUNSGOODS supplies a broader manufacturing sequence and contrary wood/aluminium/liquid-paint variants; its cup-fed spray-gun image does not verify electrostatic powder coating. TIGER independently supports formulation-specific thermal-cure/suitability and packaging handling context, not proof that either bed maker uses its product. Medex is an explicit wood-slat counterexample despite a steel outer frame. These are not the same SKU, factory or contemporary order. No source size, thickness, bed mass, load/drop threshold, formulation, film thickness, oven temperature/time, yield, energy intensity, certification or life is a default. UN38149 is residual classification context, not permission to treat every remaining leaf as a canonical product."
