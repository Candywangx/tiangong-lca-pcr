product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.other-furniture-n-e-c-not-made-of-wood"
  classification_refs: "CPC 3.0 38149; narrower; current accepted association: classifications/mappings/cpc-3.0-to-pcr.yaml and docs/adr/cpc3-additional34-20261029-38149.md; complete method scope/exclusions apply, not full-leaf or scientific/translation approval"
  covered_products: "Manufacture a complete new non-electrical single-level steel bed kit with steel headboard and footboard, both side rails, all actual crossmembers/centre beams/support legs, the entire steel slat system, joining hardware, fitted caps/pads and actual included assembly instructions. Begin with real supplied uncoated cold-rolled low-carbon welded steel tube and conditional sheet plus complete actual purchased parts/formulations. Include cutting, tube bending, punching/drilling/pressing where real, joint preparation and actual welding/bolted connections, dressing, complete real pretreatment/rinsing/drying, whole thermosetting powder application/reclaim and thermal cure, final fitting/sample assembly, configuration-specific QC and complete-kit first quality release. The terminal is an unassembled kit across all its cartons; it is not a single bare welded frame or support component. Supplier-prefabricated pieces retain their complete upstream fabrication/finishing and replace only real onsite steps. Original-cohort storage/packaging/handling/dispatch and actual later work remain separate incremental services through the stated factory gate."
  excluded_products: "Exclude mattresses, separate mattress supports/box springs, loose slat bases or furniture parts, bought-finished-bed repacking, wooden/wood-slat or aluminium/brass principal structures, upholstery, bunk/loft/child/medical beds, electrical/adjustable/folding/storage mechanisms, onsite steelmaking and onsite polymer/powder synthesis. Liquid paint, galvanizing, cataphoresis and UV-only curing require a different applicability assessment. Customer assembly, transport beyond the declared gate, use, in-use repair and end of life are outside this manufacture reference."
  representative_product: "One complete unassembled all-steel slat bed kit of a controlled configuration; all cartons form one product"
  production_route: "Supplied welded steel tube and actual parts/preparations → cut/bend/punch/drill/join/dress → pretreat/rinse/dry → whole thermoset powder/thermal cure → fit/sample assemble/QC/complete kit first release"
  market_state: "New complete unassembled flat-pack kit, without mattress and removable transport packaging"
functional_unit:
  what: "Manufacture and first quality release of the complete specified steel bed kit"
  how_much: "1 m2 of net single-face assembled-configuration orthogonal plan projection of complete newly first-released kits; only an accounting declared unit"
  how_well: "Actual controlled BOM/drawing and complete-kit/fit/joint/finish/dimension/load acceptance specification; no numerical threshold or certification"
  how_long_or_cycle: "One complete manufacture to unique first release; separate actual original-cohort service horizon; no use life"
  reference_flow_link: "first_release"
system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "all inventory rows"
      rule: "Include the defined complete-bed terminal from real steel supply through complete manufacture, surface preparation, whole powder/thermal cure, real fitting/sample assembly and unique release. Every real head/foot/side/cross/centre/support/slat/hardware/cap/pad/instruction component is inside the complete BOM. A supplied subassembly must include its actual fabrication and finish upstream exactly once; no finished-bed purchase may replace this raw-to-kit route. Complete subcontract fabrication/coating/preparation and its included material/energy loads have one owner: retain real physical disclosures but never charge the whole provider plus the same included foreground burdens again. Add any actual additional atomic material, chemical, gas, utility, packaging, waste, treatment or component before dataset use. Unknown is a gap, never a fabricated zero or other bundle."
      source_ids:
        - suns-metal-bed-route
        - zehao-mdb27-complete
        - tiger-processing-1213
    - rule_id: boundary_release
      applies_to: "first_release"
      rule: "Q is the sum of the net single-face assembled-configuration projected areas of unique newly first-quality-released complete kits in the homogeneous cohort. Released closing FG is already in Q; do not add closing FG as another output or deduct its manufacture burden. Manufacturing B_close contains only traced raw/WIP and genuinely unused/unassigned stores, not released FG. Returns, delivery, reinspection and postrelease work never create new Q. Net delivery is a different method requiring full historical FG burdens, gross G/R, original-delivery reversal D_rev and actual incremental rework/water/loss; do not silently substitute that denominator."
      source_ids:
        - zehao-mdb27-complete
        - suns-metal-bed-route
        - ilcd-allocation-2010
    - rule_id: boundary_vectors
      applies_to: "all inventory rows"
      rule: "Keep each inherited exchange burden vector of opening/closing raw, WIP and unused/unassigned charge separately from physical stock mass. Retain all ordinary failed production, rejects, destructive samples, scrap, start/stop, idle, cleanup and treatment in the original manufacture cohort. Waste disposal, outside shipment or sales alone never justifies T_other. Only a real independent cohort/function with a justified allocation/handover and receiving vector may receive one burden transfer. Stock-corrected consumption is never corrected a second time."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_physical
      applies_to: "all inventory rows"
      rule: "Before burden allocation close each manufacturing, FG/service and combined gate using complete physical gross legs, wet stocks and relevant Fe/C/H/O/P/Na plus actual other elements. No economic/burden share may shrink physical material, asset, packaging, gas or water gross legs. Internal same-product WIP and first-release transfers pair and cancel at consolidation without external procurement or another Q; do not add Q plus closing FG. Independently establish real molecules, reaction extent and free/reaction/structural/phase water; one residual cannot solve two unknowns. VOC, COD, total metal/boron/carbon or particle-size indicators are not molecular masses."
      source_ids:
        - suns-metal-bed-route
        - tiger-processing-1213
        - ilcd-allocation-2010
    - rule_id: boundary_packaging
      applies_to: "packaging"
      rule: "For each real material/SKU: opening empty plus attached WIP/FG plus reusable wet stock + P + I + ER + F_in - X_in = full closing corresponding wet stock + gross S + EO + W + F_out - X_out. Each six-leg card is one direction/physical event and uses complete gross V in single_quotient; never use B_open+U-B_close or a service/manufacture/economic share for those cards. New P/I influx remains even if retained in closing stock; whole wet P/I once and full closing wet mass both remain. F_in/F_out are independently measured real repair-material, liquid or atmospheric-moisture additions/removals, not balancing residuals. X_in/X_out subtract only a proved OTHER same-event flow on the SAME side: incoming against incoming and outgoing against outgoing, never stocks, opposite flows or mere card presence. Pair internal component-to-article handoffs and cancel them on consolidation. Internal reuse cancels; it is not new procurement/Q or an automatic coproduct. first non-purchased external ingress keeps physical material and one upstream owner. Weigh each whole wet article once, with included substrate, liner, thread, adhesive, hardware and retained water as nonadditive composition subaccounts. Separately supplied onsite components are disjoint receipts or explicit measured component-to-article bridges, never duplicate whole-provider/input charges. Natural moisture uptake/drying/drainage is a measured physical event, not invented repair water. A real mixed-waste outlet uses either one compatible mixed total with independently measured nonadditive origin W subaccounts OR disjoint measured origin exchanges summing to that total; one actual treatment provider only. Never add both representations. Add each actually occurring missing material, phase, return state, species or outlet as a compatible atomic card/protocol/provider boundary before dataset completeness; do not invent a hypothetical outlet or set unknown to zero."
      source_ids:
        - suns-metal-bed-route
        - tiger-processing-1213
        - ilcd-allocation-2010
    - rule_id: boundary_services
      applies_to: "services; assets"
      rule: "Actual performed postrelease service stays with original cohort Q_c and observed horizon h even when FG remains stored or current dispatch is zero. Only unused/unassigned service or charge may carry forward; do not deduct already performed work. For actual rework require manufacturer/specification permission, postwork tests, acceptance and disposition for continued conformity. Permission is not a data-existence filter: unauthorized, failed or rejected actual work and all incremental parts/water/energy/loss remain recorded with the original cohort and actual hold/waste disposition. Natural storage/handling humidity uptake/loss is also a real atomic flow and needs no invented work permission. Repair/water X_in/X_out deduplicate only a proved OTHER same-event flow on the SAME side (in against in, out against out), never stocks, opposite flows or mere card presence."
      source_ids:
        - tiger-processing-1213
        - ilcd-allocation-2010
    - rule_id: boundary_assets_utilities
      applies_to: "assets; finish"
      rule: "Track each machine/oven/tool/new or used repair part/installed fluid physical stock separately from the attributable service burden. No fixed life, default machine mass or whole-machine-per-area charge. Whole equipment/service providers include their evidenced contents once; actual separate replacements and utilities are named separately. Fuel/heat carrier mass and thermal MJ/enthalpy are separate linked dimensions with one upstream owner. Genuine steam/condensate or heat-exchange-water return, if present, needs actual state, enthalpy, supply/return contract and individual Product return card; never invent a boiler or omit a real carrier/return. Whole air/provider and its species/components cannot be charged twice."
      source_ids:
        - tiger-processing-1213
        - ilcd-allocation-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-allocation-2010
