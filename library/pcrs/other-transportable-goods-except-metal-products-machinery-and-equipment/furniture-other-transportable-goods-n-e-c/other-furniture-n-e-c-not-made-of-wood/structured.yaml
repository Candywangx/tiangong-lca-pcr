      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Real delivered welded low-carbon cold-rolled steel tubes and conditional sheet, each whole supplied part/preparation and actual complete opening raw/WIP genealogy |\n| starting_condition_role | foreground_receipt |\n| product_classification_scope | Narrow complete steel-slat-bed-kit subset of CPC3.0:38149; not full subclass coverage or accepted mapping |\n| recursive_input_rule | A bought complete bed kit cannot stand in for raw manufacture. Real same-product internal handoffs cancel; actual returns carry original cohort identity/burden and create neither a new purchase nor Q |\n| upstream_dataset_requirement | Match complete supplied steel/component/formulation/packaging, real utilities, fabrication/finish and treatment providers by state/route/grade/geography/period/property and included contents once |\n| disclosure | model and controlled complete BOM/drawing revision; complete steel headboard and footboard; both side rails and every real crossmember and centre beam and support leg; entire steel slat/support system and its actual section/spacing/joints; all joining hardware and caps and pads and included instructions/tools; complete unassembled kit across all cartons with mattress and detachable packaging excluded; steel grade and welded cold-rolled supply and each actual form/gauge; onsite versus supplier-prefabricated component boundary; actual cutting/bending/punching/drilling/welding/bolted route; each whole supplied pretreatment and coating preparation plus actual independent makeup; actual thermal cure instructions and records and reclaim compatibility; configuration-specific complete-kit and sample-assembly and weld/fit/finish/load acceptance; unique first release identity and no production at repeat inspection or delivery; assembled projection plane and actual net single-face union geometry with holes and overlaps; calibrated dimensions and traceable CAD/drawing or measured geometry for each released configuration; independently measured whole net configuration mass and moisture and counts; first-release projected-area Q in m2 and original cohort service horizon; all failed and zero-output runs and start/stop and idle and cleanup and rework; opening/closing raw and WIP and unused unassigned charge with each inherited exchange vector; released FG stocks and gross shipment/return genealogy; actual utility voltage/geography/period and extensive native units; each gas species and water phase and destination with independent state conversions; each packaging SKU six gross P/I/ER/S/EO/W legs and wet stock and one upstream owner; physical new/used assets and parts and installed fluid separate from performed service burden; actual postrelease-work permission and posttests and acceptance and disposition; all actual work retained even if unauthorized or failed and natural humidity exchange; exchange-specific allocation and supplier/treatment scope and all native limitations; all actual unknowns and uncertainty and absent-exchange evidence |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_complete | all inventory rows | Include the defined complete-bed terminal from real steel supply through complete manufacture, surface preparation, whole powder/thermal cure, real fitting/sample assembly and unique release. Every real head/foot/side/cross/centre/support/slat/hardware/cap/pad/instruction component is inside the complete BOM. A supplied subassembly must include its actual fabrication and finish upstream exactly once; no finished-bed purchase may replace this raw-to-kit route. Complete subcontract fabrication/coating/preparation and its included material/energy loads have one owner: retain real physical disclosures but never charge the whole provider plus the same included foreground burdens again. Add any actual additional atomic material, chemical, gas, utility, packaging, waste, treatment or component before dataset use. Unknown is a gap, never a fabricated zero or other bundle. | `suns-metal-bed-route`; `zehao-mdb27-complete`; `tiger-processing-1213` |\n| boundary_release | first_release | Q is the sum of the net single-face assembled-configuration projected areas of unique newly first-quality-released complete kits in the homogeneous cohort. Released closing FG is already in Q; do not add closing FG as another output or deduct its manufacture burden. Manufacturing B_close contains only traced raw/WIP and genuinely unused/unassigned stores, not released FG. Returns, delivery, reinspection and postrelease work never create new Q. Net delivery is a different method requiring full historical FG burdens, gross G/R, original-delivery reversal D_rev and actual incremental rework/water/loss; do not silently substitute that denominator. | `zehao-mdb27-complete`; `suns-metal-bed-route`; `ilcd-allocation-2010` |\n| boundary_vectors | all inventory rows | Keep each inherited exchange burden vector of opening/closing raw, WIP and unused/unassigned charge separately from physical stock mass. Retain all ordinary failed production, rejects, destructive samples, scrap, start/stop, idle, cleanup and treatment in the original manufacture cohort. Waste disposal, outside shipment or sales alone never justifies T_other. Only a real independent cohort/function with a justified allocation/handover and receiving vector may receive one burden transfer. Stock-corrected consumption is never corrected a second time. | `ilcd-allocation-2010` |\n| boundary_physical | all inventory rows | Before burden allocation close each manufacturing, FG/service and combined gate using complete physical gross legs, wet stocks and relevant Fe/C/H/O/P/Na plus actual other elements. No economic/burden share may shrink physical material, asset, packaging, gas or water gross legs. Internal same-product WIP and first-release transfers pair and cancel at consolidation without external procurement or another Q; do not add Q plus closing FG. Independently establish real molecules, reaction extent and free/reaction/structural/phase water; one residual cannot solve two unknowns. VOC, COD, total metal/boron/carbon or particle-size indicators are not molecular masses. | `suns-metal-bed-route`; `tiger-processing-1213`; `ilcd-allocation-2010` |\n| boundary_packaging | packaging | For each real material/SKU: opening empty plus attached WIP/FG plus reusable wet stock + P + I + ER + F_in - X_in = full closing corresponding wet stock + gross S + EO + W + F_out - X_out. Each six-leg card is one direction/physical event and uses complete gross V in single_quotient; never use B_open+U-B_close or a service/manufacture/economic share for those cards. New P/I influx remains even if retained in closing stock; whole wet P/I once and full closing wet mass both remain. F_in/F_out are independently measured real repair-material, liquid or atmospheric-moisture additions/removals, not balancing residuals. X_in/X_out subtract only a proved OTHER same-event flow on the SAME side: incoming against incoming and outgoing against outgoing, never stocks, opposite flows or mere card presence. Pair internal component-to-article handoffs and cancel them on consolidation. Internal reuse cancels; it is not new procurement/Q or an automatic coproduct. first non-purchased external ingress keeps physical material and one upstream owner. Weigh each whole wet article once, with included substrate, liner, thread, adhesive, hardware and retained water as nonadditive composition subaccounts. Separately supplied onsite components are disjoint receipts or explicit measured component-to-article bridges, never duplicate whole-provider/input charges. Natural moisture uptake/drying/drainage is a measured physical event, not invented repair water. A real mixed-waste outlet uses either one compatible mixed total with independently measured nonadditive origin W subaccounts OR disjoint measured origin exchanges summing to that total; one actual treatment provider only. Never add both representations. Add each actually occurring missing material, phase, return state, species or outlet as a compatible atomic card/protocol/provider boundary before dataset completeness; do not invent a hypothetical outlet or set unknown to zero. | `suns-metal-bed-route`; `tiger-processing-1213`; `ilcd-allocation-2010` |\n| boundary_services | services; assets | Actual performed postrelease service stays with original cohort Q_c and observed horizon h even when FG remains stored or current dispatch is zero. Only unused/unassigned service or charge may carry forward; do not deduct already performed work. For actual rework require manufacturer/specification permission, postwork tests, acceptance and disposition for continued conformity. Permission is not a data-existence filter: unauthorized, failed or rejected actual work and all incremental parts/water/energy/loss remain recorded with the original cohort and actual hold/waste disposition. Natural storage/handling humidity uptake/loss is also a real atomic flow and needs no invented work permission. Repair/water X_in/X_out deduplicate only a proved OTHER same-event flow on the SAME side (in against in, out against out), never stocks, opposite flows or mere card presence. | `tiger-processing-1213`; `ilcd-allocation-2010` |\n| boundary_assets_utilities | assets; finish | Track each machine/oven/tool/new or used repair part/installed fluid physical stock separately from the attributable service burden. No fixed life, default machine mass or whole-machine-per-area charge. Whole equipment/service providers include their evidenced contents once; actual separate replacements and utilities are named separately. Fuel/heat carrier mass and thermal MJ/enthalpy are separate linked dimensions with one upstream owner. Genuine steam/condensate or heat-exchange-water return, if present, needs actual state, enthalpy, supply/return contract and individual Product return card; never invent a boiler or omit a real carrier/return. Whole air/provider and its species/components cannot be charged twice. | `tiger-processing-1213`; `ilcd-allocation-2010` |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | ilcd-allocation-2010 |\n\n"
