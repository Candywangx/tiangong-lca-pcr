allocation_rules:
  - rule_id: allocation_context
    applies_to: "all inventory rows"
    rule: "This is attributional manufacture where allocation rather than substitution is justified by the study goal. Assess actual multifunctional processes, not arbitrary division of the bed functions. No free choice of physical/economic allocation, fixed percentage, avoided-production credit or scrap sales deduction. Recycling/reuse beyond the declared waste handover needs its own evidenced method and actual state; no ILCD conformity or recycling formula is asserted here."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_subdivide
    applies_to: "all inventory rows"
    rule: "First identify dedicated processes and independently metered flows. Use actual subdivision then virtual subdivision of the exact exchange portions that exclusively serve a real product/cohort/function; record process map, meter/BOM links and the receiving vector. Prefer partial separation when full separation is infeasible and document distortion. Do not move ordinary bed failures/wastes/treatment out as another function merely because sold or shipped."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "all inventory rows"
    rule: "For each genuinely inseparable remaining exchange identify the determining physical causal relationship from process technology and response to changed functions. It is exchange-specific: embodied members, real joining/cure intensity, constrained rack/oven capacity and time or storage occupied volume/area with duration may differ, and are candidates only when measured/justified. Projected product-area Q is a reporting denominator, not an automatic coated-surface or energy allocation key. Keep gross physical legs unscaled whatever the burden key."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only after documenting why subdivision/virtual subdivision and a determining physical relationship fail for the actual residual, use contemporaneous representative market values at the same real common-process gate and actual condition/quality/quantity. Correct values for later finishing, packing and transport; absent valid prices remain unresolved with sensitivity, never a default equal split. Sum allocated vectors plus documented transfers to the original inventory, with every exclusive portion assigned once. Do not apply this price rule to full gross packaging/asset/water/species disclosures."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "whole complete kit and geometry"
      record_type: "release and calibrated geometry/weighing record"
      raw_fields: "unique first-release ID; model; complete BOM/drawing revision; all kit members; sample assembly; actual acceptance; measured net projection regions and voids/overlaps; net complete-kit mass and moisture; counts; opening/closing released FG; original cohort Q"
      collection_method: "Collect undivided measured geometry and calibrated dimensions or traceable drawing/CAD with sample-assembly verification for the actual configuration. Compute the one-sided net orthogonal plan-projection union with void/overlap checks; rectangular LxW only for proven actual rectangles. Weigh each actual complete configured kit on calibrated scales excluding removable packaging/mattress/test weights; retain mass/moisture separately, never infer area or kg per item from a catalogue. Reconcile all cartons and first-release permission, QC and unique identity. Under this declared area convention, project only physical parts in their specified assembled-bed positions, including actual installed caps/pads/hardware. Included loose instructions, tools or spare pieces remain inside complete-kit mass and all burdens, but have no invented laid-out position or extra projected area. Area Q in m2 is never a kg flow: use independently weighed complete-kit masses for physical release/FG handoffs and mass closure, cancelling those internal kg handoffs once while Q remains the separate area denominator."
      unit: "m2; kg; item"
      frequency: "each actual configuration and release"
      temporal_coverage: "complete manufacturing cohort including zero output"
      site_scope: "actual manufacture and subcontract gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; drawings; full kit and acceptance trace; uncertainty"
    - protocol_id: cp_raw_fabrication
      process_id: "fabrication"
      flow_role: "each single material/preparation/article"
      record_type: "raw purchase and stock genealogy"
      raw_fields: "row ID; complete supply/SDS/assay/state; invoice; actual wet gross ingress; batch; grade/form/route; opening/closing raw/WIP/unused charge; each inherited exchange vector; scrap/loss; exclusive ownership; supplier-included package ID"
      collection_method: "Retain original undivided units and all physical gross incoming/outgoing legs without economic scaling, plus full wet closing stocks. Weigh/metre each actual supply and stock; audit whole preparations/parts once and disjoint component assays. Actual onsite mixing includes each true purchase, real utilities and losses. Separate supplier-prefabricated and onsite steps. Record all failures/start-stop/idle/cleanup and WIP work-completed vectors; no double stock correction."
      unit: "kg; native unit"
      frequency: "each lot and stock event"
      temporal_coverage: "full cohort and opening history"
      site_scope: "all real supplier and foreground steps"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices; SDS; scales; stock/BOM/route reconciliation; inherited vectors"
