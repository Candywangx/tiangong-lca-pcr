      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_core | first_release | Confirm whole steel bed kit BOM, terminal, all cartons, actual steel slats and head/foot/rails/cross/support members and actual complete-kit acceptance. Reject raw tube/single leg/bare frame, separate mattress support, mattress or different wood/medical/bunk/electrical structure as this core. Each required qualifier and full native restriction must be present. | `zehao-mdb27-complete`; `suns-metal-bed-route`; `un-cpc3-furniture-2025`; `medex-romantik-counterexample` |\n| validate_measurement | all inventory rows | Verify true net single-face projection geometry with voids/overlaps, original unique Q, calibrated complete configuration and no default LxW/mass/count/density. Retain raw units then convert/attribute/select numerator and apply single_quotient once. Every gross card must use full V, not burden A, net stock or economic share. Q=0 gives no unit result. | `zehao-mdb27-complete`; `suns-metal-bed-route`; `ilcd-allocation-2010` |\n| validate_route | all inventory rows | Verify actual full raw-steel-to-complete-kit route, supply/subcontract boundaries, whole formulations once, pretreatment and actual thermal cure to supplier instructions, real sample assembly and acceptance. No source photo certifies a powder route. Add every actual atomic missing material/gas/water/waste/treatment. Reinspection/delivery never creates new product Q. | `suns-metal-bed-route`; `zehao-mdb27-complete`; `tiger-processing-1213` |\n| validate_balances | all inventory rows | Check manufacturing, FG/service and combined gross physical/element/species/water gates independently. Closing released FG is already in Q/manufacture burden; performed service stays attributed. Each true package has six atomic event cards plus stock/owner bridge. Keep full actual repair/new water influx and full closing wet stock; deduplicate only a proved OTHER same-event flow on the SAME side, never stocks, opposite flows or mere card presence. One physically mixed waste outlet and its pool W subaccounts cannot both be added. All failed/unauthorized real work stays with actual hold/waste disposition. | `ilcd-allocation-2010`; `tiger-processing-1213` |\n| validate_readiness | all inventory rows | Require complete finite measurement and schema/fingerprint verification for the authored files while preserving actual unknowns and review-required scope. Missing actual core reference identity or method remains a hold; no engineering success makes it authored/covered automatically. Scientific review remains independent; Chinese alignment is not translation review; no accepted mapping or publication follows. | `ilcd-allocation-2010` |\n\n"
