    reference: "Tianjin Zehao Furniture. Heavy-Duty Metal Double Bed MDB-27. Complete manufacturer product HTML and two product images. https://www.zehao-world.com/en/product/metal-double-bed-mdb-27"
    used_for: "Whole all-steel terminal including head/foot/slats/hardware/manual and cutting/welding/powder/flat-pack context. Two photos vary slat profile. No adopted mass/size/load/certification/recipe."
  - id: "suns-metal-bed-route"
    type: "handbook"
    reference: "SUNSGOODS. Metal Bed Frame. Complete manufacturer HTML including specifications, production stages, QC and variant context. https://sunsgoods.com/bed-manufacturer/metal-bed-frame/"
    used_for: "Qualitative supplied-metal-to-bed-kit cut/bend/join/dress/pretreat/coat/fit/QC/pack sequence. Wood/aluminium/liquid-paint variants are exclusions/counterevidence. Cup-fed spray photo is not proof of powder application; no numerical defaults."
  - id: "tiger-processing-1213"
    type: "handbook"
    reference: "TIGER Coatings. Processing instructions Data sheet1213 Version06-25. Complete four-page primary PDF. https://www.tiger-coatings.com/fileadmin/user_upload/PDS_verarbeitungshinweise_1213_en.pdf"
    used_for: "Product-specific cure/suitability, formulation compatibility, cooling before packing, moisture and touch-up qualification. Not proof of bed maker powder SKU; facade/metallic/two-coat numerical prescriptions and reclaim ratios not adopted."
