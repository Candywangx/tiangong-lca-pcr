    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual selected extensive property"
      uuid: ""
    required_unit: "each row native unit"
    rule: "Preserve mass/kg, energy/MJ, real volume/m3, service time/h or actual count separately. No Required Mass/kg rule for energy/volume/time. Actual electricity kWh times3.6 once; integrated volume is not a rate. A true rate is integrated once; volume-to-mass needs independently measured density of the same substance and actual composition/temperature/pressure."
  - id: single_report
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual unnormalised numerator"
      uuid: ""
    required_unit: "row native unit per reference flow"
    rule: "Raw protocols do not divide. After original-unit conversions and real burden attribution choose A for a burden/service dimension, or complete unscaled V for every gross physical-event card. single_quotient divides that selected numerator by its original cohort projected-area Q exactly once. Cards and aggregation point to that same report. Q=0 retains all real loads and produces no unit result."
