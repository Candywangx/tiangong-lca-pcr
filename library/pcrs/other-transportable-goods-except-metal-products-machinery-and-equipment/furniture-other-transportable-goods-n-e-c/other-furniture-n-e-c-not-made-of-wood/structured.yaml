    - protocol_id: cp_service
      process_id: "services"
      flow_role: "original-cohort gross custody and increments"
      record_type: "raw FG/custody/service history"
      raw_fields: "original release cohort and Q_c; observed horizon h; opening/closing FG; gross dispatch and return; original shipment link; missing/damaged parts; actual performed increment; unused unassigned charge; work permission; posttests; acceptance; hold/waste disposition"
      collection_method: "Record actual gross custody legs in undivided native units and each real service increment separately; original Q_c is retained. No delivery/reinspection/returned mass creates production. Performed service stays with the cohort even if FG remains. Permission and successful posttests are required for continued conformity, but all actual unauthorized/failed work is still collected with true disposition and incremental inputs/outlets."
      unit: "kg; native units; horizon"
      frequency: "each custody and work event"
      temporal_coverage: "actual horizon for original cohort only"
      site_scope: "real postrelease factory gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "cohort and shipment genealogy; tests/permission; measured increments and disposition"
    - protocol_id: cp_pack
      process_id: "packaging"
      flow_role: "each packaging SKU six directions"
      record_type: "raw physical packaging and ownership ledger"
      raw_fields: "SKU and composition; opening empty/attached WIPFG/reusable wet stock; P; I; ER; gross S; EO; W; full closing wet stock; supplier included owner; internal reuse pairs; repair wood/nail/water X_in and X_out; one mixed-outlet bridge if real; independently measured F_in/F_out; paired SAME-side OTHER-event duplicate proof X; measured nonadditive per-origin W and total-OR-partitions; onsite component-to-article bridge; actual natural humidity ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID"
      collection_method: "Weigh every actual leg undivided; each card numerator is complete gross V, not a stock-corrected consumption or economic/load share. Reconcile opening wet stock+P+I+ER+F_in-X_in=full closing wet stock+gross S+EO+W+F_out-X_out per material, with independently measured actual additions/removals and the same-side OTHER-flow duplicate constraint. Whole wet P/I and actual repair/water influx stay even when new matter remains in closing stock. Deduplicate only a proved OTHER same-event flow on the SAME side (in against in, out against out), never stocks, opposite flows or mere card presence. Whole articles and components form disjoint bridges. Cancel internal reuse; one upstream owner and one treatment. One real mixed-waste total with independently measured nonadditive origin W subaccounts OR disjoint measured origin exchanges is used, never both, with one actual treatment/provider. Natural moisture is separately measured without inventing repair work.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
      unit: "kg; item with independent actual mass"
      frequency: "every actual P/I/ER/S/EO/W and repair event"
      temporal_coverage: "full cohort plus original service horizon"
      site_scope: "supplier/onsite/external custody gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; package SKU; one-owner link; each six-leg card; wet-stock closure"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "each actual machine/part/fluid and service"
      record_type: "raw asset stocks/events and service burden"
      raw_fields: "serial ID; new/used state; incoming/outgoing gross V; installed fluids; opening/closing full physical stock; new and old repair parts; real capacity/utilization/time; unused/unassigned service; actual supplier burden boundary; original cohort and horizon"
      collection_method: "Keep full physical movements/stocks unscaled and report each gross card V separately from service burden. Measure real h/capacity and a justified burden/service conversion; no invented life, per-bed whole machine or machine mass. Actual new/old replacement parts/fluids/water stay atomic, deduplicating only proved OTHER same-event overlap on the SAME side with an included whole article/actual flow, never stocks, opposite flows or mere card presence. Performed service does not carry merely because FG remains; unused/unassigned service only may carry. Avoid provider utilities/maintenance duplication."
      unit: "kg; h; actual fluid units"
      frequency: "each stock/work event and service interval"
      temporal_coverage: "real history and cohort/horizon"
      site_scope: "actual installation and service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; measured capacity/service; maintenance and fluid records; provider scope"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert original units first: actual tonne to kg; independently measured actual article count and same-configuration net mass; actual kWh times3.6 to MJ; actual material volume with independently measured same-state density. Integrate a true rate once and never multiply an already integrated volume by time. Preserve carrier mass/heat and species/component bridges disjoint with one owner."
      inputs:
        - cp_raw_fabrication
        - cp_raw_finish
        - cp_raw_release
        - cp_utilities_fabrication
        - cp_utilities_finish
        - cp_utilities_release
        - cp_utilities_services
        - cp_release
        - cp_species_fabrication
        - cp_species_finish
        - cp_species_services
        - cp_water_assets
        - cp_water_finish
        - cp_water_services
        - cp_pack
        - cp_assets
      output: "converted raw extensive values"
      source_ids:
        - suns-metal-bed-route
        - tiger-processing-1213
        - ilcd-allocation-2010
    - id: match_manufacture
      applies_to: "all inventory rows"
      rule: "For each burden dimension e after conversion and legitimate exclusive/causal/residual attribution: A_e = B_open,e + U_e - B_close,e - T_other,e. B is an inherited exchange vector in raw/WIP/unused unassigned charge, never a wet mass subtracted from energy. B_close excludes already released FG. Ordinary failure/scrap/waste/samples/treatment remain; T_other only for an independently real other cohort/function and justified one-time handover with receiving vector. No second correction to stock-corrected consumption."
      inputs:
        - convert_raw
        - cp_raw_fabrication
        - cp_raw_finish
        - cp_raw_release
        - cp_release
        - cp_waste_fabrication
        - cp_waste_finish
        - cp_waste_release
        - cp_assets
      output: "manufacturing A_e bound to unique release cohort"
      source_ids:
        - ilcd-allocation-2010
    - id: match_service
      applies_to: "all inventory rows"
      rule: "For actual postrelease service burden e,c: A_e,c = opening unused/unassigned service vector + actual incremental service - closing unused/unassigned vector - justified one-time independent handover. Keep original Q_c and observed h, including zero dispatch and closing FG. Already performed services are not removed for FG retention. All actual rework inputs/outlets remain whether permission/tests succeed or not; actual acceptance/hold/waste disposition stays explicit."
      inputs:
        - convert_raw
        - cp_service
        - cp_assets
        - cp_water_assets
        - cp_water_finish
        - cp_water_services
      output: "service A_e,c bound to original Q_c and h"
      source_ids:
        - tiger-processing-1213
        - ilcd-allocation-2010
    - id: select_gross
      applies_to: "all inventory rows"
      rule: "For every physical gross-event card select exactly the full measured converted V_e of that real incoming/outgoing leg. Includes six packaging legs, real assets/parts/water, custody, waste and gas species. Never use manufacture/service A, B_open+U-B_close, net stock consumption, an economic share or the current burden vector as its numerator. Actual ingress remains together with full closing wet stock. This gross disclosure creates no new purchase/upstream burden/treatment/credit; link any real burden to one separate owner/dimension once."
      inputs:
        - convert_raw
        - cp_pack
        - cp_assets
        - cp_water_assets
        - cp_water_finish
        - cp_water_services
        - cp_species_fabrication
        - cp_species_finish
        - cp_species_services
        - cp_service
        - cp_waste_fabrication
        - cp_waste_finish
        - cp_waste_release
      output: "complete unscaled physical V_e"
      source_ids:
        - ilcd-allocation-2010
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "The sole normalization is reported quantity = selected numerator / Q_c once. Select match_manufacture A_e for a manufacture burden dimension, match_service A_e,c for a service burden dimension or select_gross full V_e for every gross-event card. Q_c is original unique first-release net single-face assembled projected area in m2, not bought mass, dispatch, current FG or another cohort. first_release remains exactly1m2. All cards and aggregation use this same report without further division. Record observed service horizon h separately; it is not an additional divisor. Genuine rate integration in convert_raw remains unchanged. Q_c=0 retains all real loads and genealogy for explicit later attribution and produces no unit result."
      inputs:
        - match_manufacture
        - match_service
        - select_gross
        - cp_release
      output: "one per reference flow report with separate gross and burden dimensions"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "At each real gate reconcile opening full wet physical stocks + actual external inflows = full closing stocks + actual external outflows before burden shares. Pair internal manufacturing/WIP/first-release/FG moves and cancel in the combined gate; no added Q plus closing FG. Packaging six-leg stock bridge and repair/water X deduplicate only a proved OTHER same-event flow on the SAME side (in against in, out against out), never stocks, opposite flows or mere card presence. Independently reconcile relevant elements, real molecular species and free/reaction/structural/phase water; no one-residual/two-unknown solution."
      inputs:
        - cp_raw_fabrication
        - cp_raw_finish
        - cp_raw_release
        - cp_release
        - cp_species_fabrication
        - cp_species_finish
        - cp_species_services
        - cp_water_assets
        - cp_water_finish
        - cp_water_services
        - cp_waste_fabrication
        - cp_waste_finish
        - cp_waste_release
        - cp_pack
        - cp_assets
        - cp_service
      output: "separate manufacturing and FG/service and combined physical closures"
      source_ids:
        - suns-metal-bed-route
        - tiger-processing-1213
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_native
      applies_to: "all inventory rows"
      requirement: "Check every native basename, synonym/comment, CAS, physical form/phase, grade/route, geography, medium, dataset type and all properties against the real exchange. Adopt only the exact reference property support chain; versions stay external, canonical UUIDs unversioned. Preserve full compatible-family restrictions on each consumed card. Hard molecular/route/form conflicts require another identity; taxonomy-only defects are disclosed individually, not an exemption."
      evidence: "complete native records and supplier/route evidence"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Actual quantities, suppliers, formulation chemistry, geometry/mass, cure, acceptance, utilities, losses/species/treatments and service capacity need real foreground collection. No source/example number is a default. Ordinary auxiliary/provider UUID or future site quantity gaps stay explicit without invented identities; missing true core terminal/route or required real data blocks that affected dataset."
      evidence: "BOM/route and raw-to-report completeness audit"
    - id: dq_reproducibility
      applies_to: "all inventory rows"
      requirement: "Keep calibrated original records, ownership and process/source locators, all negative/failed/zero-output periods, original and reused source scope/time, uncertainty/detection limits, stock and allocation sensitivity. Engineering checks do not approve science, translation, mapping, certification or publication."
      evidence: "raw provenance and full-context bilingual review"
validation_rules:
  - rule_id: validate_core
    applies_to: "first_release"
    rule: "Confirm whole steel bed kit BOM, terminal, all cartons, actual steel slats and head/foot/rails/cross/support members and actual complete-kit acceptance. Reject raw tube/single leg/bare frame, separate mattress support, mattress or different wood/medical/bunk/electrical structure as this core. Each required qualifier and full native restriction must be present."
    source_ids:
      - zehao-mdb27-complete
      - suns-metal-bed-route
      - un-cpc3-furniture-2025
      - medex-romantik-counterexample
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Verify true net single-face projection geometry with voids/overlaps, original unique Q, calibrated complete configuration and no default LxW/mass/count/density. Retain raw units then convert/attribute/select numerator and apply single_quotient once. Every gross card must use full V, not burden A, net stock or economic share. Q=0 gives no unit result."
    source_ids:
      - zehao-mdb27-complete
      - suns-metal-bed-route
      - ilcd-allocation-2010
  - rule_id: validate_route
    applies_to: "all inventory rows"
    rule: "Verify actual full raw-steel-to-complete-kit route, supply/subcontract boundaries, whole formulations once, pretreatment and actual thermal cure to supplier instructions, real sample assembly and acceptance. No source photo certifies a powder route. Add every actual atomic missing material/gas/water/waste/treatment. Reinspection/delivery never creates new product Q."
    source_ids:
      - suns-metal-bed-route
      - zehao-mdb27-complete
      - tiger-processing-1213
  - rule_id: validate_balances
    applies_to: "all inventory rows"
    rule: "Check manufacturing, FG/service and combined gross physical/element/species/water gates independently. Closing released FG is already in Q/manufacture burden; performed service stays attributed. Each true package has six atomic event cards plus stock/owner bridge. Keep full actual repair/new water influx and full closing wet stock; deduplicate only a proved OTHER same-event flow on the SAME side, never stocks, opposite flows or mere card presence. One physically mixed waste outlet and its pool W subaccounts cannot both be added. All failed/unauthorized real work stays with actual hold/waste disposition."
    source_ids:
      - ilcd-allocation-2010
      - tiger-processing-1213
  - rule_id: validate_readiness
    applies_to: "all inventory rows"
    rule: "Require complete finite measurement and schema/fingerprint verification for the authored files while preserving actual unknowns and review-required scope. Missing actual core reference identity or method remains a hold; no engineering success makes it authored/covered automatically. Scientific review remains independent; Chinese alignment is not translation review; no accepted mapping or publication follows."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual complete configured steel-slat-bed-kit manufacture with separate original-cohort factory service packets for the observed horizon"
  allowed_use: "Matched complete kit supply after verifying whole geometry, route, BOM, actual acceptance and all native restrictions; m2 alone is not equal sleeping service"
  excluded_use: "Exclude mattresses, separate mattress supports/box springs, loose slat bases or furniture parts, bought-finished-bed repacking, wooden/wood-slat or aluminium/brass principal structures, upholstery, bunk/loft/child/medical beds, electrical/adjustable/folding/storage mechanisms, onsite steelmaking and onsite polymer/powder synthesis. Liquid paint, galvanizing, cataphoresis and UV-only curing require a different applicability assessment. Customer assembly, transport beyond the declared gate, use, in-use repair and end of life are outside this manufacture reference."
  required_metadata: "model and controlled complete BOM/drawing revision; complete steel headboard and footboard; both side rails and every real crossmember and centre beam and support leg; entire steel slat/support system and its actual section/spacing/joints; all joining hardware and caps and pads and included instructions/tools; complete unassembled kit across all cartons with mattress and detachable packaging excluded; steel grade and welded cold-rolled supply and each actual form/gauge; onsite versus supplier-prefabricated component boundary; actual cutting/bending/punching/drilling/welding/bolted route; each whole supplied pretreatment and coating preparation plus actual independent makeup; actual thermal cure instructions and records and reclaim compatibility; configuration-specific complete-kit and sample-assembly and weld/fit/finish/load acceptance; unique first release identity and no production at repeat inspection or delivery; assembled projection plane and actual net single-face union geometry with holes and overlaps; calibrated dimensions and traceable CAD/drawing or measured geometry for each released configuration; independently measured whole net configuration mass and moisture and counts; first-release projected-area Q in m2 and original cohort service horizon; all failed and zero-output runs and start/stop and idle and cleanup and rework; opening/closing raw and WIP and unused unassigned charge with each inherited exchange vector; released FG stocks and gross shipment/return genealogy; actual utility voltage/geography/period and extensive native units; each gas species and water phase and destination with independent state conversions; each packaging SKU six gross P/I/ER/S/EO/W legs and wet stock and one upstream owner; physical new/used assets and parts and installed fluid separate from performed service burden; actual postrelease-work permission and posttests and acceptance and disposition; all actual work retained even if unauthorized or failed and natural humidity exchange; exchange-specific allocation and supplier/treatment scope and all native limitations; all actual unknowns and uncertainty and absent-exchange evidence"
  required_quality_disclosure: "Actual measured scope/completeness and all gaps; full gross versus burden ledgers; original cohort/horizon; native and source restrictions; uncertainty/detection limits; actual allocation; no scientific/translation/certification/coverage approval from engineering checks"
  update_trigger: "Changed complete bed terminal/configuration/slat geometry, steel supply, joining/pretreatment/powder/cure/acceptance, supplier boundary, utility/waste/packaging/native restrictions or observed service horizon"
