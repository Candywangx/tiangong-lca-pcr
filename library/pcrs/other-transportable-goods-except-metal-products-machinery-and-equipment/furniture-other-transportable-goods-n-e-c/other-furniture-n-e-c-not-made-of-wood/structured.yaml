      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_context | all inventory rows | This is attributional manufacture where allocation rather than substitution is justified by the study goal. Assess actual multifunctional processes, not arbitrary division of the bed functions. No free choice of physical/economic allocation, fixed percentage, avoided-production credit or scrap sales deduction. Recycling/reuse beyond the declared waste handover needs its own evidenced method and actual state; no ILCD conformity or recycling formula is asserted here. | `ilcd-allocation-2010` |\n| allocation_subdivide | all inventory rows | First identify dedicated processes and independently metered flows. Use actual subdivision then virtual subdivision of the exact exchange portions that exclusively serve a real product/cohort/function; record process map, meter/BOM links and the receiving vector. Prefer partial separation when full separation is infeasible and document distortion. Do not move ordinary bed failures/wastes/treatment out as another function merely because sold or shipped. | `ilcd-allocation-2010` |\n| allocation_causality | all inventory rows | For each genuinely inseparable remaining exchange identify the determining physical causal relationship from process technology and response to changed functions. It is exchange-specific: embodied members, real joining/cure intensity, constrained rack/oven capacity and time or storage occupied volume/area with duration may differ, and are candidates only when measured/justified. Projected product-area Q is a reporting denominator, not an automatic coated-surface or energy allocation key. Keep gross physical legs unscaled whatever the burden key. | `ilcd-allocation-2010` |\n| allocation_residual | all inventory rows | Only after documenting why subdivision/virtual subdivision and a determining physical relationship fail for the actual residual, use contemporaneous representative market values at the same real common-process gate and actual condition/quality/quantity. Correct values for later finishing, packing and transport; absent valid prices remain unresolved with sensitivity, never a default equal split. Sum allocated vectors plus documented transfers to the original inventory, with every exclusive portion assigned once. Do not apply this price rule to full gross packaging/asset/water/species disclosures. | `ilcd-allocation-2010` |\n\n"
