    - Actual order BOM, lace textile formation, seam thread, fixed accessory specifications,
      raw-hair source/preparation and washing formulation require supplier and foreground records.
      Public documents support a bounded route synthesis, not one demonstrated factory SKU.
    - All activity amounts, per-item net masses, acceptance limits, wastewater destination and
      emissions require collection; no quantitative defaults.
    - Separate later bespoke repair/restyling services from first release. Preserve WIP exchange
      vectors, original cohort Qc, external returns and packaging custody. Unmeasured later services
      remain disclosed.
