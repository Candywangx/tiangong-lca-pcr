      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_scope | all processes | This is an attributional manufacturing method for situations requiring allocation. ILCD section 7.9 applies under its stated attributional conditions; its multifunctional-product QFD example is not a fixed split for a wig and its recycling-loop formulas are not adopted as automatic credits. Industrial manufacturing pages support operations, not an LCA allocation rule. | ilcd-allocation-2010 |\n| allocation_exclusive | all inventory rows | First separately meter dedicated products/operations; use real or virtual subdivision where actual process knowledge uniquely assigns an input or service. Hair and cap parts embodied in one wig are assigned there; actual short hair sold separately and other wig styles remain separate functions. Mere physical contact or mass fraction does not establish determining causality. | ilcd-allocation-2010 |\n| allocation_causal | all inventory rows | For genuine remaining shared exchanges establish exchange-specific determining physical causality from how changes in outputs cause changes in that input/output. Sewing duration and actual intensity, wet-batch treatment demand or occupied space-time require evidence, not default shares. Do not apply one mass/time key to all exchanges; distinguish goods embodied from service provision. | ilcd-allocation-2010 |\n| allocation_residual | all inventory rows | Only genuinely unresolved residual shared burdens may use documented contemporaneous market values of actual co-products at the SAME common process gate and actual state/quality/quantity. Remove downstream extra processing, packing, transport and retail services from price comparators; no arbitrary choice of physical versus economic, fixed ratio or value-based deletion of waste/emission gross mass. Document zero/negative/nontraded cases as unresolved if no valid basis exists. | ilcd-allocation-2010 |\n| allocation_closure | all processes | Retain 100 percent closure of each allocated exchange across co-functions with original numerators and chosen criteria. Waste treatment remains assigned to the causing activity unless a separately evidenced legitimate joint process applies. Reuse or sale of hair/offcuts/packaging is not automatic avoided-production credit. Maintain gross physical V alongside attributed A; both retain failures, cleanup, loss and original cohort history. | ilcd-allocation-2010 |\n\n\n"
