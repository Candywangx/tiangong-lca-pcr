system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all processes"
      rule: "Include actual receipt/storage, sorting/alignment and removal of short/damaged hairs, washing/rinsing, sun-drying, lace inspection/cutting and cap sewing, seam reinforcement, hand knotting, actual finishing and overall QC. Retain every failed lot, trial, startup, shutdown, idle, cleaning, maintenance and rework event, including unauthorized operations. No bleach, dye, perm, adhesive, disinfectant, steam generator or fuel boiler is presumed; when actually used add each precise material/species and review route applicability."
      source_ids:
        - adorable-wig-factory
        - daniel-wig-manufacture
        - allure-hair-process
    - rule_id: boundary_q
      applies_to: "released_wig"
      rule: "Q is NEW first overall accepted complete net wig kg, each serial/lot counted once. Closing FG from this cohort is already included in Q; do not add it again as production output. Delivery, retest, storage, repair and redelivery create no new Q. Never substitute purchased raw-hair kg or hair-only mass for complete-wig Q."
      source_ids:
        - adorable-wig-factory
        - daniel-wig-manufacture
    - rule_id: boundary_stocks
      applies_to: "all inventory rows"
      rule: "Reconcile raw hair, wet/dry hair WIP, cap panels, partly ventilated wigs, failed material, chemical baths, equipment charges and FG separately by lot/location/state. Physical opening + real receipts/transfers = closing + real consumption/exports/losses. For EVERY exchange carry the opening inherited burden vector, add actual current increments, transfer internal vectors once and retain closing vectors with original Qc. Do not equate stored mass with stored environmental burden. Failed and Q0 campaigns remain linked to their production history, never disappear."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_fg
      applies_to: "fg_service"
      rule: "Keep opening/closing FG, gross outward delivery, actual external return, disposal and repair by original cohort. Reverse the original delivery event once in the delivery ledger for a genuine return; never cancel original manufacture or add return kg to Q. Charge NEW repair/rewash/repack inputs to the original cohort Qc, not new output. Keep original inherited vectors and observed service horizon; missing later service is disclosed. Combine gates by cancelling only the internal first-release transfer Q and its vector; retain all external physical flows."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_gross
      applies_to: "all inventory rows"
      rule: "Maintain unallocated gross physical V by exchange/origin/destination independently of attributed environmental A. Report actual waste, emissions, replacement parts and heat-carrier returns as V/Qc for their actual cohort, never reduced by economic allocation, service allocation or WIP burden deferral. F is genuinely new activity. X can remove only an identified OTHER same-side duplicate with event evidence, never new repair, fresh water, loss or failure. Combined origin partitions must sum to measured gross V without overlap."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_physical
      applies_to: "all processes"
      rule: "Close total physical mass and relevant elemental balances separately from evidence for actual species. Whole wet hair/liquor and their water/solid constituents are either one ledger or explicitly non-additive bridges. Distinguish free/phase water, actual reaction water and structural water; do not invent a reaction or fit two unknowns with one residual. COD, TOC and VOC totals are indicators, not masses of a guessed molecule. Retain individual actual gas species, phase, origin, recipient medium, and measured gross versus net quantities."
      source_ids:
        - daniel-wig-manufacture
    - rule_id: boundary_heat
      applies_to: "all processes"
      rule: "Sun drying does not create a purchased heat exchange. Meter actual electric drying/styling if present. If liquid hot water or another external carrier truly supplies heat, retain its actual mass, composition, pressure, temperature, phase/enthalpy and external Product return; use one primary energy supply account and the supplier water/energy agreement. Mass/enthalpy bridge rows are not an additional purchase of the same energy. Do not manufacture boiler fuel, steam, condensate or cooling flows from an assumed route."
      source_ids:
        - adorable-wig-factory
        - daniel-wig-manufacture
    - rule_id: boundary_pack
      applies_to: "fg_service"
      rule: "For EACH package article reconcile opening empty + opening attached to WIP/FG + opening reusable + external purchases + first non-purchase external receipts (attached to incoming supplies, free transfers or borrowing) + genuine external returns linked to an earlier outward movement of the same packaging = corresponding closing stocks + outward packaging attached to GROSS physical shipments + external package returns + waste. These receipt classes are mutually exclusive per event; a first non-purchase receipt is not a return without evidence of that same packaging previously leaving this site. All physical receipt masses enter V regardless of price or ownership. Assign only the supply burden actually borne by this system, once; where already included in an incoming-material supplier inventory, retain the packaging mass bridge without adding that supply burden again. Record ownership, provider, prior movement link and supply-burden coverage. Internal reuse cancels and is not a new purchase. Packing is excluded from net wig Q, is not an automatic co-product/credit, and is never allocated by net dispatch alone. Retain each material and each genuine provider separately."
      source_ids:
        - adorable-wig-factory
        - ilcd-allocation-2010
