allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all processes"
    rule: "This is an attributional manufacturing method for situations requiring allocation. ILCD section 7.9 applies under its stated attributional conditions; its multifunctional-product QFD example is not a fixed split for a wig and its recycling-loop formulas are not adopted as automatic credits. Industrial manufacturing pages support operations, not an LCA allocation rule."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_exclusive
    applies_to: "all inventory rows"
    rule: "First separately meter dedicated products/operations; use real or virtual subdivision where actual process knowledge uniquely assigns an input or service. Hair and cap parts embodied in one wig are assigned there; actual short hair sold separately and other wig styles remain separate functions. Mere physical contact or mass fraction does not establish determining causality."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causal
    applies_to: "all inventory rows"
    rule: "For genuine remaining shared exchanges establish exchange-specific determining physical causality from how changes in outputs cause changes in that input/output. Sewing duration and actual intensity, wet-batch treatment demand or occupied space-time require evidence, not default shares. Do not apply one mass/time key to all exchanges; distinguish goods embodied from service provision."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only genuinely unresolved residual shared burdens may use documented contemporaneous market values of actual co-products at the SAME common process gate and actual state/quality/quantity. Remove downstream extra processing, packing, transport and retail services from price comparators; no arbitrary choice of physical versus economic, fixed ratio or value-based deletion of waste/emission gross mass. Document zero/negative/nontraded cases as unresolved if no valid basis exists."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_closure
    applies_to: "all processes"
    rule: "Retain 100 percent closure of each allocated exchange across co-functions with original numerators and chosen criteria. Waste treatment remains assigned to the causing activity unless a separately evidenced legitimate joint process applies. Reuse or sale of hair/offcuts/packaging is not automatic avoided-production credit. Maintain gross physical V alongside attributed A; both retain failures, cleanup, loss and original cohort history."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_raw
      process_id: "wig_manufacture"
      flow_role: "All manufacturing exchanges and stock vectors"
      record_type: "foreground_record"
      raw_fields: "event ID; row ID; lot/cohort; operation; timestamp; original unit; raw amount/rate; integration interval; physical origin/destination; Qc; opening/closing mass; opening/closing inherited vector per exchange; F; OTHER duplicate event X; allocation evidence; uncertainty"
      collection_method: "Reconcile scales, meters, purchase/issue records and operation/WIP handovers. Retain all actual failed, idle, start-stop, cleanup, trial and rework events. Match only proven duplicate same-side events for X; never infer absent loads."
      unit: "original unit"
      frequency: "Each event and period close"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Actual site and outsourced operation interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; event provenance; stock reconciliation; allocation rationale; missing-data log"
    - protocol_id: cp_hair
      process_id: "wig_manufacture"
      flow_role: "Raw human hair and preparation"
      record_type: "foreground_record"
      raw_fields: "supplier lot; human identity; raw/washed state; gross received mass; tare; moisture; dry hair mass; root-tip orientation; length grading; short/damaged removal; wet/dry WIP; supplier preparation; operation losses"
      collection_method: "Verify human hair with supplier traceability and appropriate material inspection; weigh incoming/outgoing material and moisture samples independently. Hair-only mass never supplies whole-wig Q."
      unit: "kg"
      frequency: "Each receipt and preparation batch"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Receipt and sort/wash/dry stations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier declaration; weighing tickets; moisture method; reject disposition"
    - protocol_id: cp_cap
      process_id: "wig_manufacture"
      flow_role: "Cap construction and fixed accessories"
      record_type: "foreground_record"
      raw_fields: "cloth supplier and fibre composition; mesh; finish; panel dimensions; thread identity; strap and clip configuration; received/issued/installed/offcut mass; count; seam and knot map; cap WIP"
      collection_method: "Inspect supplied fabric; weigh material by specification; record cutting patterns, sewing reinforcement and actual hand-knotting. Compare complete bill of materials with installed components; no assumed fibre family."
      unit: "kg"
      frequency: "Each configuration and lot"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Cap cutting/sewing and ventilation"
      aggregation_rule: "per reference flow"
      quality_evidence: "Material specifications; BOM; seam inspection; handover and loss records"
    - protocol_id: cp_wet
      process_id: "wig_manufacture"
      flow_role: "Whole formulations and water"
      record_type: "foreground_record"
      raw_fields: "formulation ID; SDS; supplier; whole wet mass; assay and carrier water; actual onsite recipe; each purchased ingredient; dilution water; bath stocks; water meter; independent density and temperature; retained moisture; rinse-out; wastewater destination"
      collection_method: "Weigh whole supply and use; separate purchased formulation from onsite mixing. Use mass measurement or independently measured substance-specific density for volume. Match each actual bath discharge/evaporation/retention; unknown chemistry cannot be reconstructed from COD."
      unit: "kg"
      frequency: "Each wet batch and tank close"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Hair washing/rinsing and actual cleanup"
      aggregation_rule: "per reference flow"
      quality_evidence: "Recipe/SDS; tank balances; meters; density test; effluent transfer"
    - protocol_id: cp_energy
      process_id: "wig_manufacture"
      flow_role: "Electricity by operation"
      record_type: "foreground_record"
      raw_fields: "meter ID; provider; geography; voltage; start/end reading; kWh or power rate; actual run/idle duration; drying/styling equipment; operation allocation criterion"
      collection_method: "Read calibrated submeters and reconcile site bills; integrate power only when it is a rate. Keep sun-drying duration separate from purchased energy; include actual lighting and machine idle."
      unit: "MJ"
      frequency: "Each meter interval and H"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Manufacturing user-side supply"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; bill; operation log; 3.6 conversion audit"
    - protocol_id: cp_maintenance
      process_id: "wig_manufacture"
      flow_role: "Replacement needles lubricant and wiping cloth"
      record_type: "foreground_record"
      raw_fields: "tool type and material; replacement count and mass; oil formulation; opening charge; additions; drainage; leaks; closing charge; cloth supply/reuse/washing/discard; destination"
      collection_method: "Inspect actual maintenance records and weigh replacement/discarded parts. Track each material independently; allocate shared equipment service from proven use while preserving gross physical replacement and wastes."
      unit: "kg"
      frequency: "Each maintenance and charge event"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Sewing/ventilation equipment and cleanup"
      aggregation_rule: "per reference flow"
      quality_evidence: "Work orders; scales; lubricant specification; charge closure"
    - protocol_id: cp_heat
      process_id: "wig_manufacture"
      flow_role: "Conditional external heat and water carrier"
      record_type: "foreground_record"
      raw_fields: "supplier; agreed water/energy boundary; net heat meter MJ; supply/return mass; supply/return temperature pressure phase and enthalpy; density; makeup; loss; cohort"
      collection_method: "Measure only real supply and external return. Reconcile enthalpy difference and heat meter with water balance; one primary supply account, no duplicate heat/carrier provider or fictitious boiler."
      unit: "MJ; kg"
      frequency: "Each actual supply interval"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Actual supplier/site heat interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supply contract; meter; state measurements; water return tickets"
    - protocol_id: cp_release
      process_id: "wig_manufacture"
      flow_role: "Unique first complete-wig release"
      record_type: "foreground_record"
      raw_fields: "serial/lot ID; full cap/hair/accessory configuration; first-release flag; accepted count; calibrated complete net mass kg; tare; moisture/conditioning; cap fit; seam integrity; hair direction/length/density; shedding; cleanliness; pass/fail; WIP and FG cohort"
      collection_method: "Weigh complete accepted wigs on calibrated scales excluding all removable packaging; compare serial/lot to previous releases to prevent duplicates. Count and actual item mass are paired independently; retain rejects and retests without new Q."
      unit: "kg"
      frequency: "Every first release and period close"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Complete-wig acceptance gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; serial register; acceptance criteria/results; complete BOM"
    - protocol_id: cp_waste
      process_id: "wig_manufacture"
      flow_role: "Atomic waste by origin and destination"
      record_type: "foreground_record"
      raw_fields: "row and origin ID; whole wet mass; independent moisture/solids; species tests; collection route; handler; gross removal; sample/test losses; actual returns; non-additive partition IDs"
      collection_method: "Weigh each waste stream; use actual handler receipts and destination. A mixed rejected wig or liquor is a whole waste stream or measured non-overlapping partitions, not both. Actual treatment inputs and species emissions require added atomic rows when onsite."
      unit: "kg"
      frequency: "Each removal and reconciled batch"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Manufacturing waste handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbridge; handler; laboratory; mass and elemental closure"
    - protocol_id: cp_species
      process_id: "wig_manufacture"
      flow_role: "Actual water vapour and additional actual species"
      record_type: "foreground_record"
      raw_fields: "species; CAS; phase; source; recipient medium; gross and net mass; air volume or rate; temperature/pressure; humidity; wet/dry matter; independent losses; concentration basis; uncertainty"
      collection_method: "Measure vapour by a supported independent water balance or airflow/humidity method with appropriate blank/ambient corrections and independent other exits. For other actual emissions add named species and measured compartment-specific rows; never infer molecule mass from COD/VOC or assume an emission factor."
      unit: "kg"
      frequency: "Each emitting operation and H"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Real environmental interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "Lab method; instrument calibration; independent water exits; uncertainty"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "FG cohort custody and service numerators"
      record_type: "foreground_record"
      raw_fields: "original cohort Qc; original release ID; opening/closing FG mass and full inherited vectors; gross shipments; return link and original delivery reversal; real new repair F; OTHER duplicate X; service meters; idle/cleanup; disposal; H"
      collection_method: "Reconcile custody by original cohort, not net shipments. Record real return/rework service and each new material/water/energy exchange separately, including cross-period history. Retain failure and gross emissions/wastes independently of service allocation."
      unit: "original unit"
      frequency: "Each service/custody event and period close"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "FG stores and actual return/dispatch operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Release register; return authorization and physical proof; original delivery; meters"
    - protocol_id: cp_pack
      process_id: "fg_service"
      flow_role: "One ledger per packaging article"
      record_type: "foreground_record"
      raw_fields: "article ID and material; supplier; ownership and receiving event ID; purchase mass; first non-purchase mass attached to incoming supplies; first free-transfer or borrowed receipt mass; genuine external return mass and same-article prior outward event link; supply-burden responsibility and amount already included in incoming supplier inventory; non-additive bridge ID; opening/closing empty stock; attached WIP stock; attached FG stock; reusable stock; internal reuse; gross shipment attached mass; external package returns; waste; cohort"
      collection_method: "Weigh each actual package article including bag/box/wrap/net separately; reconcile full boundary_pack equation with mutually exclusive receipt classes. Inspect incoming supply packaging, transfer/loan records and matched prior outward events; free or borrowed receipts are not zero physical input. Keep all masses in V and verify that any supply burden actually borne is represented once across the packaging and incoming-material provider inventories. Distinguish retail box from shipping carton and fixed wig cap from removable net; add any actual outer carton, tape or label as its own article."
      unit: "kg"
      frequency: "Each issue/return/shipment and close"
      temporal_coverage: "Complete H and opening/closing history"
      site_scope: "Packaging external receipts and all custody locations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier composition and inventory coverage; incoming receipt and loan/transfer records; matched original outward event; tare measurements; physical stock counts; dispatch manifests"
  calculation_rules:
    - id: release_sum
      applies_to: "released_wig"
      rule: "Q = sum of uniquely identified newly first-accepted complete net wig kg from cp_release; a closing FG unit is already in this sum and no retest or delivery creates a second term."
      inputs:
        - cp_release
      output: "Q"
      source_ids:
        - adorable-wig-factory
        - daniel-wig-manufacture
    - id: raw_to_numerator
      applies_to: "all inventory rows"
      rule: "Convert measured original units/rates, reconcile actual physical V and separate inherited environmental vectors, then perform justified subdivision/allocation for A. Preserve dedicated actual gross waste/emission/return V in the physical channel. N selects the declared physical V or attributed A channel with provenance; never subtract F as X or silently substitute A for V."
      inputs:
        - cp_raw
        - cp_fg
        - cp_hair
        - cp_cap
        - cp_wet
        - cp_energy
        - cp_maintenance
        - cp_heat
        - cp_release
        - cp_waste
        - cp_species
        - cp_pack
      output: "N"
      source_ids:
        - ilcd-allocation-2010
    - id: report_once
      applies_to: "all inventory rows"
      rule: "r = N / Qc for Qc > 0, once for each declared row/cohort/channel. For new manufacturing Qc=Q; postrelease services and returns use original cohort Qc. Physical waste/emission/replacement/heat-return channels use gross V, not allocated A. Qc=0 keeps raw load and stock history but has no unit result. The released_wig reference is 1 kg. No second division in cards, collection aggregation or by H."
      inputs:
        - N
        - Qc
        - cp_raw
        - cp_fg
        - cp_release
      output: "r"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "At each manufacturing/FG/combined gate reconcile physical opening + genuine external inputs + nonduplicated internal receipts = closing + genuine external outputs + nonduplicated internal transfers. Cancel internal movements in the combined gate, including first-release Q. Use actual reaction and moisture/species evidence; an unexplained residual remains uncertainty, not an invented exit."
      inputs:
        - cp_raw
        - cp_fg
        - cp_hair
        - cp_cap
        - cp_wet
        - cp_waste
        - cp_species
        - cp_heat
        - cp_pack
      output: "physical_balance"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Exact material/form/route/state and provider/medium compatibility. Native family labels cannot override hard restrictions; blanks remain explicit identity gaps. Full descriptions and source context travel with rows."
      evidence: "Specifications; complete native records; raw_hair and complete-wig distinction"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Calibrated raw measurements and unit/state basis; no borrowed density, per-item mass, recipe, emissions factor, yield or marketing performance default."
      evidence: "Calibration; independent density/moisture tests; meter integration records"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Every actual operation/input/output and actual species is captured, including Q0, failures, trials, unauthorized deviations, cleaning, idle and repairs; absence requires evidence and unknown is not zero."
      evidence: "Full operation log; purchasing reconciliation; missing-data register"
    - id: dq_history
      applies_to: "all processes"
      requirement: "Every stock lot retains physical location/state and inherited vector for every exchange with original Qc; manufactured and FG services do not silently mix histories."
      evidence: "Opening/closing inventory and burden vectors; serial release and return links"
    - id: dq_sources
      applies_to: "all processes"
      requirement: "Qualitative manufacturer routes are not factory measurements or universal ranges. Disclose technical synthesis, counter-route exclusions, geographic/time mismatch and unmeasured later services."
      evidence: "Primary documents; actual supplier/foreground records; uncertainty and applicability assessment"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "released_wig"
    rule: "Verify a complete human-hair lace-cap wig with actual fixed accessories and unique first-release Q; raw hair, loose bundles, cap alone or synthetic/animal hair cannot pass as the terminal. Check all qualifiers, net weighing, actual route and same cohort across languages."
    source_ids:
      - adorable-wig-factory
      - daniel-wig-manufacture
      - un-cpc3-2025
  - rule_id: validate_once
    applies_to: "all inventory rows"
    rule: "Trace every raw numerator through unit/rate conversion, stock-vector handling and actual attribution to one report_once operation. Validate Qc and both gross physical and environmental channels; no second division, no lost Q0/failure and no new Q from reinspection/delivery."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_physical
    applies_to: "all processes"
    rule: "Independently close total mass, relevant elements, actual species/water and every packaging custody equation at manufacturing, FG and combined gates. Distinguish whole versus child accounts, integrated volume versus rate, gross versus net, true new F versus only duplicate X, and one provider per supply. No residual fitting of two unknowns."
    source_ids:
      - ilcd-allocation-2010
      - daniel-wig-manufacture
  - rule_id: validate_allocation
    applies_to: "all processes"
    rule: "Demonstrate dedicated/virtual subdivision first, then exchange-specific determining causality, then only genuine residual common-gate contemporaneous value; reconcile 100 percent. Preserve gross physical emissions/waste/return regardless of allocation and keep rejected routes as actual recorded deviations."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_gaps
    applies_to: "all processes"
    rule: "A missing actual input, unknown critical terminal or unsupported route is an explicit incompleteness/applicability hold. An ordinary unresolved auxiliary UUID or future site amount alone does not prove absence or methodological failure. No engineering check establishes scientific approval, translation review, mapping or publication."
    source_ids:
      - adorable-wig-factory
      - daniel-wig-manufacture
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supplier-specific cradle-to-gate linking after actual foreground completion and review"
  allowed_use: "Same human-hair lace-wig configuration and declared natural-colour hand-knotted route with compatible inputs/services"
  excluded_use: "Whole 38972 coverage; raw-hair production; synthetic/animal hair; other wig routes; use-life or comparative performance assertions"
  required_metadata: "All section3 qualifiers; source and provider links; exact boundary; original cohort Qc; single-normalization provenance"
  required_quality_disclosure: "Actual measurement coverage; unbound identities; uncertainty; physical and environmental channels; allocation evidence; unmeasured future FG services"
  update_trigger: "Changed hair source/state; fabric or cap configuration; knotting route; chemical/thermal processing; supplier/medium; quality gate; new evidence or material data gap"
