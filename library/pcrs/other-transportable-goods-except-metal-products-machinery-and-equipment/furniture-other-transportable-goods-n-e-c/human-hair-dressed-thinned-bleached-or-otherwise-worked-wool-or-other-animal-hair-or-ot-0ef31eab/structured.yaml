      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Unworked cut human hair and supplied lace fabric at actual site receipt; each whole auxiliary and fixed accessory in its actual supply state |\n| starting_condition_role | foreground_gate_to_gate |\n| product_classification_scope | Narrow complete natural-colour human-hair wig subset of 38972; 38971 remains upstream raw-hair context |\n| recursive_input_rule | Purchased finished wigs or worked wefts do not substitute for raw hair; returns retain original identity and burden history; internal hair/cap/WIP transfers cancel |\n| upstream_dataset_requirement | Link actual raw-hair preparation, fabric/thread/accessory supplies, each whole formulation, utility supply, packaging supply and actual waste treatment exactly once with compatible geography/state |\n| disclosure | Report manufacturing, postrelease FG-service and combined physical gates separately; disclose missing inputs and unresolved providers rather than treating them as zero |\n\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | all processes | Include actual receipt/storage, sorting/alignment and removal of short/damaged hairs, washing/rinsing, sun-drying, lace inspection/cutting and cap sewing, seam reinforcement, hand knotting, actual finishing and overall QC. Retain every failed lot, trial, startup, shutdown, idle, cleaning, maintenance and rework event, including unauthorized operations. No bleach, dye, perm, adhesive, disinfectant, steam generator or fuel boiler is presumed; when actually used add each precise material/species and review route applicability. | adorable-wig-factory; daniel-wig-manufacture; allure-hair-process |\n| boundary_q | released_wig | Q is NEW first overall accepted complete net wig kg, each serial/lot counted once. Closing FG from this cohort is already included in Q; do not add it again as production output. Delivery, retest, storage, repair and redelivery create no new Q. Never substitute purchased raw-hair kg or hair-only mass for complete-wig Q. | adorable-wig-factory; daniel-wig-manufacture |\n| boundary_stocks | all inventory rows | Reconcile raw hair, wet/dry hair WIP, cap panels, partly ventilated wigs, failed material, chemical baths, equipment charges and FG separately by lot/location/state. Physical opening + real receipts/transfers = closing + real consumption/exports/losses. For EVERY exchange carry the opening inherited burden vector, add actual current increments, transfer internal vectors once and retain closing vectors with original Qc. Do not equate stored mass with stored environmental burden. Failed and Q0 campaigns remain linked to their production history, never disappear. | ilcd-allocation-2010 |\n| boundary_fg | fg_service | Keep opening/closing FG, gross outward delivery, actual external return, disposal and repair by original cohort. Reverse the original delivery event once in the delivery ledger for a genuine return; never cancel original manufacture or add return kg to Q. Charge NEW repair/rewash/repack inputs to the original cohort Qc, not new output. Keep original inherited vectors and observed service horizon; missing later service is disclosed. Combine gates by cancelling only the internal first-release transfer Q and its vector; retain all external physical flows. | ilcd-allocation-2010 |\n| boundary_gross | all inventory rows | Maintain unallocated gross physical V by exchange/origin/destination independently of attributed environmental A. Report actual waste, emissions, replacement parts and heat-carrier returns as V/Qc for their actual cohort, never reduced by economic allocation, service allocation or WIP burden deferral. F is genuinely new activity. X can remove only an identified OTHER same-side duplicate with event evidence, never new repair, fresh water, loss or failure. Combined origin partitions must sum to measured gross V without overlap. | ilcd-allocation-2010 |\n| boundary_physical | all processes | Close total physical mass and relevant elemental balances separately from evidence for actual species. Whole wet hair/liquor and their water/solid constituents are either one ledger or explicitly non-additive bridges. Distinguish free/phase water, actual reaction water and structural water; do not invent a reaction or fit two unknowns with one residual. COD, TOC and VOC totals are indicators, not masses of a guessed molecule. Retain individual actual gas species, phase, origin, recipient medium, and measured gross versus net quantities. | daniel-wig-manufacture |\n| boundary_heat | all processes | Sun drying does not create a purchased heat exchange. Meter actual electric drying/styling if present. If liquid hot water or another external carrier truly supplies heat, retain its actual mass, composition, pressure, temperature, phase/enthalpy and external Product return; use one primary energy supply account and the supplier water/energy agreement. Mass/enthalpy bridge rows are not an additional purchase of the same energy. Do not manufacture boiler fuel, steam, condensate or cooling flows from an assumed route. | adorable-wig-factory; daniel-wig-manufacture |\n| boundary_pack | fg_service | For EACH package article reconcile opening empty + opening attached to WIP/FG + opening reusable + external purchases + first non-purchase external receipts (attached to incoming supplies, free transfers or borrowing) + genuine external returns linked to an earlier outward movement of the same packaging = corresponding closing stocks + outward packaging attached to GROSS physical shipments + external package returns + waste. These receipt classes are mutually exclusive per event; a first non-purchase receipt is not a return without evidence of that same packaging previously leaving this site. All physical receipt masses enter V regardless of price or ownership. Assign only the supply burden actually borne by this system, once; where already included in an incoming-material supplier inventory, retain the packaging mass bridge without adding that supply burden again. Record ownership, provider, prior movement link and supply-burden coverage. Internal reuse cancels and is not a new purchase. Packing is excluded from net wig Q, is not an automatic co-product/credit, and is never allocated by net dispatch alone. Retain each material and each genuine provider separately. | adorable-wig-factory; ilcd-allocation-2010 |\n\n\n"
