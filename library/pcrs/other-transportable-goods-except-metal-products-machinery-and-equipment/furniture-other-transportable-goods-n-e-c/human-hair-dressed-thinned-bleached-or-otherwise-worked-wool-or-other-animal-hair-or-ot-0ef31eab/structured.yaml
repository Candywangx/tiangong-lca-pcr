    type: "literature"
    reference: "Banbury Postiche. Wig Questions and Answers, bespoke and repair sections. https://www.banburypostiche.co.uk/wigQuestionsAndAnswers"
    used_for: "Independent hand-knotted complete real-hair wig and base specification; distinguish later repair/restyling services; no lifetime, recipe or quantitative default"
  - id: "banbury-hair-state"
    type: "literature"
    reference: "Banbury Postiche. Ethical Materials Supply Statement, cut/combed hair and European preparation sections. https://www.banburypostiche.co.uk/EthicalPolicy"
    used_for: "Cut root-tip-aligned raw supply and preparation state; supplier statement, not independent certification or a universal zero-burden assumption"
