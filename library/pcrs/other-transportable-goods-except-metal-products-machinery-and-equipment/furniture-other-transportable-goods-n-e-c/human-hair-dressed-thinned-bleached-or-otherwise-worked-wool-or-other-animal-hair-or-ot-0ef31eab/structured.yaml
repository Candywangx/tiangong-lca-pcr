    type: "literature"
    reference: "Daniel Alain. How to Make a Luxury Human Hair Wig. https://www.danielalain.com/pages/how-to-make-a-luxury-human-hair-wig"
    used_for: "Independent complete cap cutting/sewing/ventilation/finish/QC context; coloured/bleached route retained as counter-route; no recipe or fixed numerical defaults"
