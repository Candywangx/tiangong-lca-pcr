          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validate_terminal | released_wig | Verify a complete human-hair lace-cap wig with actual fixed accessories and unique first-release Q; raw hair, loose bundles, cap alone or synthetic/animal hair cannot pass as the terminal. Check all qualifiers, net weighing, actual route and same cohort across languages. | adorable-wig-factory; daniel-wig-manufacture; un-cpc3-2025 |\n| validate_once | all inventory rows | Trace every raw numerator through unit/rate conversion, stock-vector handling and actual attribution to one report_once operation. Validate Qc and both gross physical and environmental channels; no second division, no lost Q0/failure and no new Q from reinspection/delivery. | ilcd-allocation-2010 |\n| validate_physical | all processes | Independently close total mass, relevant elements, actual species/water and every packaging custody equation at manufacturing, FG and combined gates. Distinguish whole versus child accounts, integrated volume versus rate, gross versus net, true new F versus only duplicate X, and one provider per supply. No residual fitting of two unknowns. | ilcd-allocation-2010; daniel-wig-manufacture |\n| validate_allocation | all processes | Demonstrate dedicated/virtual subdivision first, then exchange-specific determining causality, then only genuine residual common-gate contemporaneous value; reconcile 100 percent. Preserve gross physical emissions/waste/return regardless of allocation and keep rejected routes as actual recorded deviations. | ilcd-allocation-2010 |\n| validate_gaps | all processes | A missing actual input, unknown critical terminal or unsupported route is an explicit incompleteness/applicability hold. An ordinary unresolved auxiliary UUID or future site amount alone does not prove absence or methodological failure. No engineering check establishes scientific approval, translation review, mapping or publication. | adorable-wig-factory; daniel-wig-manufacture |\n\n\n"
