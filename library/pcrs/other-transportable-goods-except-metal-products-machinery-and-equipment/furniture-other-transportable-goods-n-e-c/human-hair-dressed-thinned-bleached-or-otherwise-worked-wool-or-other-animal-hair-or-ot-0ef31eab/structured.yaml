    type: "literature"
    reference: "Banbury Postiche. Wig Nets, Gauze and Liners, WN2625/400. https://www.banburypostiche.co.uk/wig_nets_gauze_and_liners"
    used_for: "Uncoated polyamide 6.6 Swiss-lace tulle material example; no evidence of a particular wig BOM or assumed consumption"
