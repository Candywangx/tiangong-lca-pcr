    type: "literature"
    reference: "ALLURE HAIR PRODUCTS PVT. LTD. Process. https://www.bulkhairexporter.com/process.html"
    used_for: "Contrary worked-hair route with onsite shampoo formulation and glued/steamed wefts; no automatic adoption for hand-knotted wigs"
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for LCA Detailed guidance. First edition March2010, sections7.9.2–7.9.3, printed255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and exchange-specific determining causality; residual common-gate actual-state market value and 100 percent closure; not a wig recipe or automatic recycling credit"
