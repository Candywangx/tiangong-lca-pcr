product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.seats-primarily-with-metal-frames"
  classification_refs: "CPC 3.0 38111; narrower; current accepted association: classifications/mappings/cpc-3.0-to-pcr.yaml and docs/adr/cpc3-additional34-20261029-38111.md; complete method scope/exclusions apply, not full-leaf or scientific/translation approval"
  covered_products: "Manufacture of a new complete non-upholstered fixed four-leg chair with formed sheet/strip steel legs and stretchers, a stamped steel seat and steel back/support, resistance spot-welded and hot-riveted joints, thermoset epoxy powder finish and fitted rubber feet. Begin with real purchased sheet/strip, rivets, whole preparations and supplied rubber feet; include cutting, bending, punching, stamping, spot welding, hot riveting, actual degreasing/drying/sanding, powder application and actual heat cure, final fitting and one unique first quality release. Contract finishing is an included foreground stage with its own actual records, not permission to replace manufacture with purchase of a finished chair."
  excluded_products: "Exclude bare frames, seat/back components sold separately, stools without backs, tubular-frame/PP-shell and wood-seat variants, bought-finished-chair packing, swivel/caster/reclining/folding mechanisms, upholstery, sofa beds, vehicle seats, wheelchairs and medical or child-specific safety products. Outdoor cataphoresis, galvanizing, liquid paint and UV-only cure are different routes requiring a new applicability assessment. Installation, use, lifetime seating service and end of life are outside this manufacturing reference."
  representative_product: "One complete accepted unupholstered four-leg stamped sheet/strip steel chair with steel seat/back, spot welds, hot rivets, heat-cured epoxy finish and rubber feet; Nicolle metal chair is illustrative, not a compulsory design."
  production_route: "Steel shaping and joining; Preparation, powder application and heat cure; Final fitting and unique first quality release; Utilities, physical assets and maintenance; Original-cohort postrelease handling and dispatch; Separate gross packaging events"
  market_state: "New complete accepted chair at unique first quality release after actual final fitting; defined net manufactured product with separately accounted real postrelease services."
functional_unit:
  what: "Manufacture and first quality release of the complete specified steel chair."
  how_much: "1 kg net accepted complete-chair manufacturing output, from actual calibrated Q kg first-release cohort."
  how_well: "Actual configuration-specific drawings/BOM and applicable joint, finish, fitted-feet, stability and other acceptance requirements; record tests and authorization. No universal strength or certification."
  how_long_or_cycle: "One manufacturing/first-release cycle; no assumed seating-service lifetime."
  reference_flow_link: "first_release_chair"
system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "all processes"
      rule: "The whole chair is the reference: seat, back/support, all legs/stretchers, joining and actual feet/finish. Make-or-buy records determine which raw fabrication, chemical, powder and component upstream operations are already inside a supplied article. Never charge whole bought preparations or parts and their contained ingredients again. A real extra on-site ingredient, utility, molecular species, captured dust, lubricant, abrasive, packaging article or treatment exchange absent from the cards must be added as its own atomic card before dataset completion, not hidden under zero/other."
      source_ids:
        - nicolle-manufacturing
        - nicolle-secrets
    - rule_id: boundary_release
      applies_to: "first_release_chair"
      rule: "Q is calibrated net kg at one first quality release after complete fitting/acceptance, not gross shipment or packed mass. Unique serial/batch records prevent second production at delivery, reinspection or actual rework including unauthorized/failed/rejected work. Same-cohort closing released FG is already in Q and never B_close. Keep warehousing/packing/handling/dispatch service for original Q_c and real observed h; performed services are not deducted merely because FG remains stored."
      source_ids:
        - nicolle-manufacturing
    - rule_id: boundary_finish
      applies_to: "finish; services"
      rule: "Retain real degreasing, drying, sanding, spray/reclaim, cure and cleanup; actual suppliers and baths, formulations, water phases and utilities must be disclosed. Public oven examples, recyclable-powder and no-discharge marketing are not a setpoint, guaranteed recovery or zero-emission inventory. Separate outdoor e-coat/liquid-paint routes remain excluded. The documented outsourced coating operation remains inside the declared manufacturing foreground. Assign one load owner to each actual contractor material, utility, emission, loss and treatment exchange. When a whole coating-service/provider inventory already contains an exchange, its detailed physical records are non-additive subledgers; when that exchange is separately modelled here, remove its overlapping burden from the service/provider inventory. Never add a whole coating-provider burden and the same foreground powder, bath, energy or treatment loads. Preserve all actual gross physical records for closure independently of invoicing or this burden partition; payment alone is not a material or energy exchange."
      source_ids:
        - nicolle-manufacturing
        - nicolle-secrets
        - tiger-processing-1213
    - rule_id: boundary_rework
      applies_to: "services"
      rule: "Authorization and continued qualification after postrelease work require manufacturer/spec permission for that actual configuration and failure, original-part compatibility where relevant and complete postwork tests/acceptance; every actual operation is collected regardless, with its real disposition. No presumed restoration of broken or unsafe products. New parts/water, old removed parts, energy, losses and changed state stay atomic and original-cohort-bound. Returns and current returned mass never establish new Q or equal an old shipment by assumption. All actually occurred work, including unauthorized, failed or rejected work, and every actual flow/load are collected in full. Permission, configuration-specific postwork tests and acceptance govern authorization, continued qualifying stock and actual hold/waste/disposition, never deletion of an incurred load. Ordinary storage/handling moisture uptake or evaporation needs no invented repair permission. Keep repair custody disjoint: a chair/material is in released/held FG or repair WIP once; actual new/old parts and water remain, without presumed restoration."
      source_ids:
        - tiger-processing-1213
    - rule_id: boundary_physical
      applies_to: "all processes"
      rule: "Keep complete physical gross gates separately from attributional load vectors. Never scale a material/packaging/asset/repair-water/air species gross leg by an economic or service-burden share. Whole supplied wet P/I and full closing wet stock both remain; X_in/X_out deduplicates only the same measured event already counted in another same-side flow term, never a stock, opposite-side flow or merely present card. Internal same-product transfers cancel across matched gates, without a new external purchase or Q."
      source_ids: []
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-2010
