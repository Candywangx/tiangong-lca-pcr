  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Convert raw original units/state before attribution. Cumulative meter differences already integrate time; integrate only genuine rates over their measured intervals. MJ=3.6*metered_kWh. Volume-to-mass needs independent density for the same substance and actual state; preserve gas P/T/compressibility/humidity and independent measured rivet solid volume and mass. Reference native secondary coefficients never establish unmeasured density, chair mass or heating value."
      inputs:
        - raw_units
        - actual_state
        - independent_measurements
      output: "converted_raw"
      source_ids: []
    - id: manufacture_vector
      applies_to: "burden-dimension exchanges"
      rule: "A_i = B_open_i + U_i + T_in_i - B_close_i - T_out_i. Same-unit inherited vectors after dedicated assignment/subdivision/justified exchange-specific allocation; U includes actual whole supplies and incurred service/failure/test/cleanup/treatment once. B_close is unreleased raw/WIP or genuinely unused/unassigned supply/service charges, never released FG. Do not stock-correct an already stock-corrected consumption again. T_out requires a real other cohort/function and justified one-time handover, never ordinary waste/sales."
      inputs:
        - B_open_i
        - U_i
        - T_in_i
        - B_close_i
        - T_out_i
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: cohort_service
      applies_to: "services"
      rule: "A_service_i_c_h includes actual incremental performed service/work/treatment for original cohort c during observed h with justified inherited charges. Only unused/unassigned service charges carry forward; performed service remains even if FG closes in stock. Preserve original manufacture vector and original Q_c. Record real new parts/water, removed parts, losses, permission/posttests/acceptance/disposition; no new production from return/work. All actually occurred work, including unauthorized, failed or rejected work, and every actual flow/load are collected in full. Permission, configuration-specific postwork tests and acceptance govern authorization, continued qualifying stock and actual hold/waste/disposition, never deletion of an incurred load. Ordinary storage/handling moisture uptake or evaporation needs no invented repair permission. Keep repair custody disjoint: a chair/material is in released/held FG or repair WIP once; actual new/old parts and water remain, without presumed restoration."
      inputs:
        - original_cohort
        - Q_c
        - observed_h
        - performed_service
        - unused_charges
      output: "A_service_i_c_h"
      source_ids:
        - jrc-ilcd-2010
        - tiger-processing-1213
    - id: gross_legs
      applies_to: "gross-dimension cards"
      rule: "V_i is the actual complete physical incoming/outgoing event for the exact card, in its declared unit after real unit/state conversion. Package P/I/ER/S/EO/W, assets, X_in/X_out, carrier returns, atmospheric gross species, external chair returns and gross G use V_i directly. No B_open+U-B_close, allocation fraction, manufacture vector or service vector changes V_i. The separately linked genuine load dimension is assigned once without another purchase, provider load or credit."
      inputs:
        - complete_gross_event
        - unit_state_conversion
        - single_load_owner
      output: "V_i"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "u_i = N_i / D; u_i is the exchange amount per 1 kg reference flow. For manufacturing burden N=A_i and D=Q; for separate original-cohort service N=A_service_i_c_h and D=Q_c; for a physical gross card N=actual full V_i and D=its original cohort Q_c (or Q for the manufacturing cohort); internal Q transfers carry the matched quantity only. D must be positive. At zero D retain loads and gross events without a unit result. This is the only product-denominator division; cards and aggregation labels read this same u_i. first_release_chair is exactly1kg net accepted complete chair."
      inputs:
        - N_i
        - D
        - A_i
        - A_service_i_c_h
        - V_i
        - Q
        - Q_c
        - cp_first_release_chair
      output: "u_i"
      source_ids:
        - jrc-ilcd-2010
    - id: manufacture_mass_gate
      applies_to: "fabrication; finish; release; support"
      rule: "Opening raw/WIP/supplies/assets/installed fluids + every real external manufacture/asset ingress + original FG withdrawn for any actual work F_to = complete closing unreleased/in-place wet stocks + unique net first release Q + attached packaging transfer P_Q + original material returned after work F_back + all external solid/liquid/gas exits. All terms are actual full physical mass, not burden shares; retain new material/water even if held in closing wet stock. Cancel internal WIP/reclaim once. F_to/F_back disclose every actual custody movement, including unauthorized/failed work, with disjoint repair WIP and FG stocks; permission does not erase a real transfer."
      inputs:
        - opening_manufacture
        - external_ingress
        - F_to
        - closing_manufacture
        - Q
        - P_Q
        - F_back
        - exits
      output: "manufacture_mass_balance"
      source_ids: []
    - id: fg_service_mass_gate
      applies_to: "services; packaging"
      rule: "Opening released FG and attached packaging + Q + P_Q + actual external returns R + F_back + every real service-material/water/packaging ingress = complete closing FG/returns/service wet stocks + gross G with packaging + F_to + all real service exits. R is current measured material, not assumed old shipment mass. Deduplicate X/P/I only against another actual inlet/outlet term; retain new influx and full closing wet mass."
      inputs:
        - opening_FG
        - Q
        - P_Q
        - R
        - F_back
        - service_ingress
        - closing_FG
        - G
        - F_to
        - service_exits
      output: "service_mass_balance"
      source_ids: []
    - id: combined_mass_gate
      applies_to: "all processes"
      rule: "Cancel matched internal Q/P_Q and F_to/F_back, WIP and internal reuse at combination: opening combined wet stocks + all real external ingress + actual external returns = full closing combined wet stocks + gross shipments + every other external solid/liquid/gas exit. Never add Q and closing released FG as two production outputs. Include real new/old assets, parts and installed fluids; electricity/heat remain independent energy accounts."
      inputs:
        - opening_combined
        - external_ingress
        - actual_returns
        - closing_combined
        - gross_shipments
        - other_exits
      output: "combined_mass_balance"
      source_ids: []
    - id: packaging_gate
      applies_to: "each actual package"
      rule: "Opening + P + I + ER + X_in = Closing + S + EO + W + X_out, separately for each actual whole article/material. All empty, attached WIP/FG and reusable stocks; S follows gross real shipments. P/I includes the supplied whole wet article once; moisture/adhesive subledgers and whole assemblies overlap only once. Internal reuse cancels. Neither a closing stock nor a load fraction cancels real new influx; procurement/supplier-included burden has exactly one owner. X_in/X_out are actual independent added/removed material and liquid/vapour water events, deduplicated only against another measured same-side flow term for the same event, never stocks, an opposite flow, or mere existence of a card. Retain actual ingress AND full wet closing stock. One collected mixed Waste outlet uses pack_mixed_waste; component W are conserving non-additive origins, not additional outlets/treatments. Whole wet article P/I/ER receipts include integral components and retained water once. Actual on-site added or removed components/water must be disjoint from those receipts or reconciled through a measured whole-article/component bridge and paired internal handoff; do not add an assembled article mass and the same component masses twice. Unknown occurrence or composition remains unresolved, not zero. For one real mixed outlet, independently measured origin W must sum to the independently measured whole mixed wet total; report that single total OR its disjoint partition, never both as additive exchanges, with one actual treatment/provider owner."
      inputs:
        - Opening
        - P
        - I
        - ER
        - Closing
        - S
        - EO
        - W
        - X_in
        - X_out
        - actual_mixed_stream_origins
      output: "package_balance"
      source_ids: []
    - id: species_phase_energy
      applies_to: "all processes"
      rule: "Independently reconcile total physical mass and relevant Fe/C/N/O/H/other real elements with real molecular/solid species and free/phase/structural or reaction water only where evidence supports it. One closure residual cannot determine two unknowns. COD/VOC/NOx/total metal/particle-size totals stay analytical metrics until real species evidence; no assumed oxidation, reaction water or fixed gas composition. Separate fuel carrier mass from actual heating value/heat, purchased steam/hot-water mass/enthalpy/returns and one provider boundary."
      inputs:
        - independent_mass
        - element_assays
        - species
        - water_phases
        - gas_state
        - enthalpy
        - supplier_boundary
      output: "independent_balances"
      source_ids: []
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "complete chair"
      requirement: "Trace actual complete BOM and released drawings, net masses, same configuration release authorization and proper native limits; no catalogue mass conversion or certification default."
      evidence: "Drawing/BOM; material certificates; calibrated scale/tare; acceptance log"
    - id: dq_coverage
      applies_to: "all processes"
      requirement: "Continuous defined period including all shifts, failures, zero output, startup/shutdown, idle, cleanup, tests and all measured stage/subcontract utilities. Missing actual data is unknown, not zero or a successful test."
      evidence: "Raw logs/meters/invoices; allocation and uncertainty; stage/subcontract scope"
    - id: dq_stocks
      applies_to: "all cohorts and gross events"
      requirement: "Per-exchange inherited vectors and full wet stock, actual positive influx and original-cohort performed service preserved. Each physical leg and one genuine burden owner separately identifiable."
      evidence: "Stock/dispatch/return ledgers; package six-leg register; asset/part/fluid records"
    - id: dq_sources
      applies_to: "external evidence"
      requirement: "Nicolle pages are one manufacturer with conflicting oven temperatures; no default bath chemistry or reclaim/zero-emission assumption. TIGER context is product-specific and independent; exclude facade/metallic numeric limits, multi-coat and maintenance schedules. ILCD applies only to justified attributional allocation."
      evidence: "Complete originals/context; separate original acquisition and present extraction/applicability; measurement and methodological review"
validation_rules:
  - rule_id: valid_identity
    applies_to: "reference product"
    rule: "Confirm a complete accepted fixed steel chair and actual manufacturing route, exact native identity/property/unit, all required qualifiers and one explicit first_release_chair link. A frame, tube, resin, wood-seat or partial assembly is not this endpoint. Core final-product identity unresolved or primary terminal/method evidence absent blocks usable authored guidance. Ordinary auxiliary/provider or future foreground measurements remain disclosed gaps rather than automatic draft status."
    source_ids:
      - nicolle-manufacturing
      - un-cpc3-2025
  - rule_id: valid_units
    applies_to: "all inventory rows"
    rule: "Check every native extensive property/unit separately. Do not force MJ, m3 or other real numerator into Mass/kg; rivet reference volume needs an actual configuration-specific measurement and independent physical kg. Preserve raw conversions, unique Q>0 or original Q_c and the single normalize_once operation; zero Q retains real load with no unit result."
    source_ids: []
  - rule_id: valid_stocks
    applies_to: "all processes"
    rule: "Reconcile complete manufacture, FG/service and combined physical gates, gross package/asset/repair-water events, inherited raw/WIP vectors and single burden ownership. Closing released FG is not a manufacture deduction; performed original-cohort service remains. Ordinary waste/sales cannot masquerade as T_out. Preserve positive influx even in closing wet stocks."
    source_ids: []
  - rule_id: valid_chemistry
    applies_to: "all material and emission exchanges"
    rule: "Each selected flow is one actual article/preparation/chemical/species with real state and destination. Check all native basenames/synonyms/comments/CAS/form/route/geography/media/type/properties against actual use; isolate taxonomy defects from real physical conflicts. No species assignment from totals, one residual fitting two unknowns, duplicate formulation components, air aggregate plus its species or assumed water density."
    source_ids: []
  - rule_id: valid_rework_quality
    applies_to: "finish; release; services"
    rule: "Retain actual configuration-specific acceptance, sample/destructive failure and postrelease manufacturer/spec permission/posttests/disposition. Coating instructions concern actual product/system suitability; no automatic restoration, approved lifetime/strength or certification from an engineering check."
    source_ids:
      - tiger-processing-1213
      - nicolle-manufacturing
  - rule_id: valid_evidence
    applies_to: "all sources and rules"
    rule: "Keep original-context scope and limitations, actual source ownership and open upstream/site measurements explicit. Route/manufacturer evidence does not support LCA allocation; ILCD allocation does not identify industrial chemistry or numerical factory inputs. Pending scientific review and aligned Chinese are not publication, translation review or accepted CPC mapping."
    source_ids:
      - jrc-ilcd-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Compatible complete stamped-steel chair manufacturing input with verified providers and separately declared original-cohort service horizon."
  allowed_use: "Declared route/configuration and first-release net mass basis; one original manufacturing owner and actual additional service."
  excluded_use: "Exclude bare frames, seat/back components sold separately, stools without backs, tubular-frame/PP-shell and wood-seat variants, bought-finished-chair packing, swivel/caster/reclining/folding mechanisms, upholstery, sofa beds, vehicle seats, wheelchairs and medical or child-specific safety products. Outdoor cataphoresis, galvanizing, liquid paint and UV-only cure are different routes requiring a new applicability assessment. Installation, use, lifetime seating service and end of life are outside this manufacturing reference."
  required_metadata: "site and period; manufacturer and subcontract finishing boundary; model and released drawing/BOM revision; complete fixed four-leg architecture; sheet and strip grade/heat / rolling state / thickness / actual widths and part geometry; seat / back/support / legs / stretchers / each rivet and installed rubber-foot specification; spot-weld and hot-rivet joining; actual cutting assist gas and forming lubrication; actual degreasing chemistry and supplied concentration/water; paid standalone or bundled bath ingredients; whole epoxy powder SKU/batch/SDS and make-or-buy; actual reclaim and cure records; actual electric / fuel or purchased-heat source and carrier state; actual water circuits; configured conformity/acceptance specification / joint/finish/stability checks and authorized first release; calibrated net complete-chair weighing excluding all packaging / detached spares and test masses; unique first-release Q in kg; counts and independently measured configuration masses; no catalogue conversion; failures / zero-output runs / startup/shutdown / idle / cleanup / sample tests and actual rework including unauthorized/failed/rejected work; opening/closing raw and WIP quantities with every inherited exchange vector; released FG opening/closing / original cohort Q_c / gross shipment/return identity and observed service horizon h; manufacturer/spec permission / postwork tests / acceptance and disposition for actual postrelease work; each package P/I/ER/S/EO/W and empty/attached/reusable stock; single upstream owner; actual new/old assets and maintenance parts with installed fluids and performed-service attribution; species-specific air/water/solid balances / moisture and independent conversions/uncertainty; native flow limitations / exact supplier compatibility / upstream and treatment gaps"
  required_quality_disclosure: "All unknown/unresolved auxiliary UUIDs, native restrictions, provider/treatment gaps, actual data period/coverage/uncertainty, allocation justification, stock/gross balances and pending scientific/translation review. No fabricated quantitative defaults or completed review."
  update_trigger: "Material, architecture, joining/finish, make-or-buy, specification, supplier/native identity, utility interface, release gate or evidence changes; reassess route before reuse."
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 Explanatory Notes,30June2025, pp186–188; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "38111 scope and neighbouring seats/other furniture/parts; no manufacturing route or method approval."
  - id: "nicolle-manufacturing"
    type: "handbook"
    reference: "Chaises Nicolle, How are Nicolle Chairs made?, complete official manufacturing page; https://chaises-nicolle.com/us/manufacturing/ ; retrieved2026-10-20"
    used_for: "Complete steel chair process/configuration example, foot fitting, checks and packaging. Actual supplied preparation, chemistry and utilities require foreground records. Outdoor cataphoresis is a separate excluded route; no zero-emission/cure/yield default."
  - id: "nicolle-secrets"
    type: "handbook"
    reference: "Chaises Nicolle, The secrets of building a Chaise NICOLLE chair; https://chaises-nicolle.com/en/the-secrets-of-building-a-chaise-nicolle-chair/ ; retrieved2026-10-20"
    used_for: "Same-manufacturer corroborating joining and preparation context; not an independent plant or source. Oven-temperature difference remains; no prescribed setpoint."
  - id: "tiger-processing-1213"
    type: "handbook"
    reference: "TIGER Coatings, Processing instructions, data sheet1213 Version06-25, complete4pp; https://www.tiger-coatings.com/fileadmin/user_upload/PDS_verarbeitungshinweise_1213_en.pdf ; retrieved2026-10-20"
    used_for: "Actual-system cure/compatibility, cleaning, packaging and conditional postwork suitability. Not a Nicolle formulation or certification; facade thickness, metallic reclaim ratios and maintenance/film time examples are not chair defaults."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA—Detailed guidance,first editionMarch2010,§§7.9.2–7.9.3,printedpp255–272/PDFpp275–292; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision, determining exchange-specific physical causality and genuine residual common-process-gate market value. Distinguish QFD multifunctional products; no industrial chemistry or emission factor inferred."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:dc997ca2d41690fe43538f05023e6df989df5b4ef46034749527cae89800895f"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8898"
      family: "system_boundary"
      span:
        start:
          offset: 8898
          line: 60
          column: 1
        end:
          offset: 17415
          line: 82
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Received real steel sheet/strip, rivets, whole formulations, supplied rubber feet and utilities at the actual manufacturer and declared subcontract finishing gates. |\n| starting_condition_role | foreground_start |\n| product_classification_scope | Narrower stamped-steel complete-chair manufacturing subset of CPC3.0:38111; no accepted mapping or whole-subclass claim. |\n| recursive_input_rule | A purchased complete chair is not raw stock. Supplied articles/formulations contain their documented upstream materials/processes once. Internal WIP and released-Q transfers are matched and cancel at combination. |\n| upstream_dataset_requirement | Compatible actual stock, formulation, component, utility and treatment providers with form/route/state/unit/boundary verified; no automatic cradle-to-gate completeness. |\n| disclosure | site and period; manufacturer and subcontract finishing boundary; model and released drawing/BOM revision; complete fixed four-leg architecture; sheet and strip grade/heat / rolling state / thickness / actual widths and part geometry; seat / back/support / legs / stretchers / each rivet and installed rubber-foot specification; spot-weld and hot-rivet joining; actual cutting assist gas and forming lubrication; actual degreasing chemistry and supplied concentration/water; paid standalone or bundled bath ingredients; whole epoxy powder SKU/batch/SDS and make-or-buy; actual reclaim and cure records; actual electric / fuel or purchased-heat source and carrier state; actual water circuits; configured conformity/acceptance specification / joint/finish/stability checks and authorized first release; calibrated net complete-chair weighing excluding all packaging / detached spares and test masses; unique first-release Q in kg; counts and independently measured configuration masses; no catalogue conversion; failures / zero-output runs / startup/shutdown / idle / cleanup / sample tests and actual rework including unauthorized/failed/rejected work; opening/closing raw and WIP quantities with every inherited exchange vector; released FG opening/closing / original cohort Q_c / gross shipment/return identity and observed service horizon h; manufacturer/spec permission / postwork tests / acceptance and disposition for actual postrelease work; each package P/I/ER/S/EO/W and empty/attached/reusable stock; single upstream owner; actual new/old assets and maintenance parts with installed fluids and performed-service attribution; species-specific air/water/solid balances / moisture and independent conversions/uncertainty; native flow limitations / exact supplier compatibility / upstream and treatment gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_complete | all processes | The whole chair is the reference: seat, back/support, all legs/stretchers, joining and actual feet/finish. Make-or-buy records determine which raw fabrication, chemical, powder and component upstream operations are already inside a supplied article. Never charge whole bought preparations or parts and their contained ingredients again. A real extra on-site ingredient, utility, molecular species, captured dust, lubricant, abrasive, packaging article or treatment exchange absent from the cards must be added as its own atomic card before dataset completion, not hidden under zero/other. | `nicolle-manufacturing`; `nicolle-secrets` |\n| boundary_release | first_release_chair | Q is calibrated net kg at one first quality release after complete fitting/acceptance, not gross shipment or packed mass. Unique serial/batch records prevent second production at delivery, reinspection or actual rework including unauthorized/failed/rejected work. Same-cohort closing released FG is already in Q and never B_close. Keep warehousing/packing/handling/dispatch service for original Q_c and real observed h; performed services are not deducted merely because FG remains stored. | `nicolle-manufacturing` |\n| boundary_finish | finish; services | Retain real degreasing, drying, sanding, spray/reclaim, cure and cleanup; actual suppliers and baths, formulations, water phases and utilities must be disclosed. Public oven examples, recyclable-powder and no-discharge marketing are not a setpoint, guaranteed recovery or zero-emission inventory. Separate outdoor e-coat/liquid-paint routes remain excluded. The documented outsourced coating operation remains inside the declared manufacturing foreground. Assign one load owner to each actual contractor material, utility, emission, loss and treatment exchange. When a whole coating-service/provider inventory already contains an exchange, its detailed physical records are non-additive subledgers; when that exchange is separately modelled here, remove its overlapping burden from the service/provider inventory. Never add a whole coating-provider burden and the same foreground powder, bath, energy or treatment loads. Preserve all actual gross physical records for closure independently of invoicing or this burden partition; payment alone is not a material or energy exchange. | `nicolle-manufacturing`; `nicolle-secrets`; `tiger-processing-1213` |\n| boundary_rework | services | Authorization and continued qualification after postrelease work require manufacturer/spec permission for that actual configuration and failure, original-part compatibility where relevant and complete postwork tests/acceptance; every actual operation is collected regardless, with its real disposition. No presumed restoration of broken or unsafe products. New parts/water, old removed parts, energy, losses and changed state stay atomic and original-cohort-bound. Returns and current returned mass never establish new Q or equal an old shipment by assumption. All actually occurred work, including unauthorized, failed or rejected work, and every actual flow/load are collected in full. Permission, configuration-specific postwork tests and acceptance govern authorization, continued qualifying stock and actual hold/waste/disposition, never deletion of an incurred load. Ordinary storage/handling moisture uptake or evaporation needs no invented repair permission. Keep repair custody disjoint: a chair/material is in released/held FG or repair WIP once; actual new/old parts and water remain, without presumed restoration. | `tiger-processing-1213` |\n| boundary_physical | all processes | Keep complete physical gross gates separately from attributional load vectors. Never scale a material/packaging/asset/repair-water/air species gross leg by an economic or service-burden share. Whole supplied wet P/I and full closing wet stock both remain; X_in/X_out deduplicates only the same measured event already counted in another same-side flow term, never a stock, opposite-side flow or merely present card. Internal same-product transfers cancel across matched gates, without a new external purchase or Q. |  |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | jrc-ilcd-2010 |\n\n"
