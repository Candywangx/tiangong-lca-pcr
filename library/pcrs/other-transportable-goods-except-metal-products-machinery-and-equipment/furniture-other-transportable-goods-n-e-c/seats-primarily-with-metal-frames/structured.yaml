    rule: "This is attributional manufacturing guidance only where allocation is the justified way to address multifunctionality. Substitution and avoided-product credits are not automatic. First use dedicated records, then actual or virtual subdivision; keep each chair configuration, finishing batch, sample and service cohort traceable."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_causality
    applies_to: "remaining common exchanges"
    rule: "For every remaining exchange identify the determining physical causal relationship with the relevant functions and document why it determines that exchange. Common units, material embodiment, time or energy may support different exchange-specific relationships; they are not a freely selectable universal mass/time key."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_residual
    applies_to: "genuinely unresolved common-process residual"
    rule: "Only genuine remaining common-process residual uses contemporaneous market value of each actual cofunction at the same process gate, state and quality. Reconstruct that point from later prices by excluding downstream finishing, transport and packing; retain prices, period, quantities, uncertainty and sensitivity. Do not treat a chair as a QFD multifunctional appliance or apply fixed fractions."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_failures
    applies_to: "manufacturing; treatment; services"
    rule: "All real failed/zero-output/start-stop/idle/cleanup/sample/rework and treatment loads remain with their proper cohort. Ordinary waste, rejected goods, samples or offsite sales are not T_out deductions. Transfer a vector only once for a real independent other cohort/function with a justified allocation/handover decision, while physical gross legs remain complete. Retain actual loads at Q=0 without a unit result."
    source_ids:
      - jrc-ilcd-2010
