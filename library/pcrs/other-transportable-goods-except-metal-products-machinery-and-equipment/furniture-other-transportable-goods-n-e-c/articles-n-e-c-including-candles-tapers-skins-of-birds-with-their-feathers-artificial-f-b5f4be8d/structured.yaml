allocation_rules:
  - rule_id: allocation_dedicated
    applies_to: "environmental burden columns"
    rule: "Apply only to attributional situations where allocation is required. Assign exclusive operations and embodied material to their actual recipient first, then subdivide actually or by justified virtual subdivision. Record inaccessible data and potential distortion; allocation and substitution are not freely interchangeable choices."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: allocation_causal
    applies_to: "remaining environmental exchanges"
    rule: "Determine the physical causality separately for each remaining exchange. Dedicated wax/dye/wick stay with their recipient; heating, cooling, mould occupation, lighting and storage may have different determining drivers. Time alone or shared product mass is not automatically causal. Preserve failures, tests and losses in the responsible cohort."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: allocation_residual
    applies_to: "genuinely joint residual inventory"
    rule: "Only after the preceding steps, allocate genuine residual joint burdens by contemporaneous actual market value of actual co-functions at one common process gate in their real state and amount. Remove later transport/conditioning/packing from downstream prices. Document prices, state and period; no fixed share, energy-value proxy for candle function or QFD burn-performance split. Reconcile allocated plus retained vectors to the original total."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: allocation_physical
    applies_to: "all gross physical V"
    rule: "Do not scale down actual inputs, waste, gas emissions, repairs, replacements or heat-carrier returns by economic/service/stock environmental shares. Gross V retains its actual gate and true Q or original Qc. Internal wax reuse has no avoided-production credit. Waste price is not proof of coproduct status; each real treatment has one provider, with whole mixed waste and measured origin partitions non-additive."
    source_ids:
      - ilcd-attributional-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_make"
      flow_role: "finished_candle"
      record_type: "weighing_and_first_release"
      raw_fields: "cohort c; unique first-release ID; full wax/wick/part configuration; net mass; package tare; conditioning; accepted/rejected; destructive trial status; opening/closing FG links"
      collection_method: "Weigh complete candles on a calibrated scale and reconcile each unique first-release record with actual dimension/appearance/wick-position and burn-trial acceptance. Keep raw masses, failed attempts and test specimens; do not infer weight from count or dimensions. Retain only un-divided raw observations; aggregation references the sole calculated result."
      unit: "kg"
      frequency: "Every first-release decision and failed trial"
      temporal_coverage: "Complete manufacturing cohort including Q=0"
      site_scope: "Whole candle at first release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; drawing; actual tests; unique release register"
    - protocol_id: cp_raw
      process_id: "p_make"
      flow_role: "each atomic exchange"
      record_type: "raw_measurement"
      raw_fields: "row_id; time; cohort; origin; quantity; original unit; rate/integral flag; temperature; pressure; humidity; independent density; full formulation; actual new F; proven duplicate X; counterparty; capture and destination"
      collection_method: "Weigh/meter actual material issues and gross exits; retain batch logs, invoices, calibrated meters and actual heat/cooling/cleanup/idle/remelt/test events. Inspect installed operations and add each missing physical exchange. Never discard an actual load because it is not eligible for the selected profile. Retain only un-divided raw observations; aggregation references the sole calculated result."
      unit: "kg; MJ; m3; h"
      frequency: "Each issue, exit and meter interval"
      temporal_coverage: "Whole observation H including failed and zero-output periods"
      site_scope: "Actual operations and original repair cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; invoices; meter state; failure and repair logs"
    - protocol_id: cp_stocks
      process_id: "p_make"
      flow_role: "raw WIP and FG vectors"
      record_type: "stock_and_history"
      raw_fields: "material/state; opening/closing physical raw and WIP stock; work stage; embedded wax/wick/dye/water; exchange-specific B_open/B_close; original Qc; paired transfers; FG release; gross shipment; return/reversal; actual repair additions"
      collection_method: "Independent stock counts/weights and analyses reconcile against complete prior exchange vectors and actual current records. Preserve unknown historical burdens as unresolved; a current average cannot invent them. Separate first-release FG from WIP and keep actual service histories. Retain only un-divided raw observations; aggregation references the sole calculated result."
      unit: "kg; native exchange units"
      frequency: "Opening, closing and every transfer"
      temporal_coverage: "Current and linked earlier cohorts"
      site_scope: "Raw store, WIP, first-release FG and return areas"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Stock sheets; supplier records; inherited vectors; linked original deliveries"
    - protocol_id: cp_species
      process_id: "p_make"
      flow_role: "each species and physical gate"
      record_type: "independent_analysis"
      raw_fields: "species; CAS; source; phase; medium; inlet/outlet gross; net generated; concentration basis; measured gas volume or rate; time; particle size; wax/wick carbon and hydrogen; free/reaction water; capture; analytical uncertainty"
      collection_method: "Use independent material assays, species measurements and gas/water balances. Integrate actual rates once; already integrated volumes need no time factor. Reconcile full mass and relevant elements separately from reaction/species evidence; no residual fitting of two unknowns and no VOC/COD-to-molecule substitution. Retain only un-divided raw observations; aggregation references the sole calculated result."
      unit: "kg; m3; measured concentration units"
      frequency: "Each actual trial or release event and representative operation interval"
      temporal_coverage: "Full operation including actual burn tests and cleanup"
      site_scope: "Manufacturing, exhaust capture and actual receiving medium"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Analytical methods; inlet/outlet meters; carbon origin; uncertainty"
    - protocol_id: cp_packaging
      process_id: "p_service"
      flow_role: "each packaging article"
      record_type: "gross_packaging_stock"
      raw_fields: "article; composition; empty/attached/reusable; opening; purchases; first non-purchase external receipts; proven same-article return received and prior dispatch ID; supplier coverage and actual incurred transport/service; closing; gross shipment; external return out; waste; internal reuse; origin Qc; provider coverage"
      collection_method: "Count and weigh each carton, PE film, paper label and wooden pallet independently in all states. Reconcile the complete boundary_packaging equation; add any actually used extra packaging article as its own row and ledger. Retain only un-divided raw observations; aggregation references the sole calculated result."
      unit: "kg"
      frequency: "Each movement and opening/closing"
      temporal_coverage: "All current and original cohorts including closing FG"
      site_scope: "All packaging stores and attached WIP/FG"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Packaging weights; gross dispatch; return receipts; waste tickets"
    - protocol_id: cp_allocation
      process_id: "p_make"
      flow_role: "environmental exchanges"
      record_type: "causal_and_market_evidence"
