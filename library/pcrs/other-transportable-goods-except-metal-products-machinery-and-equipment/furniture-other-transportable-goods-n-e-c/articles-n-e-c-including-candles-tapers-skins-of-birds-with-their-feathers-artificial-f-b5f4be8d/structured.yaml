          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased petroleum paraffin in actual received form, complete cotton wick and one identified whole colour formulation; no purchased finished-candle shortcut |\n| starting_condition_role | Foreground receipt/issue gate; supplier wax refining and wick manufacture remain upstream once |\n| product_classification_scope | Complete unscented mould-poured cylindrical paraffin pillar only |\n| recursive_input_rule | Purchased complete or returned candles retain upstream/original burdens; reinspection, remelting and redelivery never create a second first release |\n| upstream_dataset_requirement | One compatible provider for each actual wax, supplied wick, dye formulation, utility, article and treatment; supplier component production is not repurchased in foreground |\n| disclosure | Actual process and extensions; failures, trial burns, remelts, startup/idle/cleanup; raw/WIP/FG stocks, origin vectors, separate services and uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_complete | p_make | Include receipt through first complete-candle release for the narrow scope in §1. Keep actual melting control, wick positioning, pouring/cooling/demoulding/trimming, checks and burn trials. Fragrance, plant-wax blending, dipping/extrusion or container production require an evidenced extension; actual off-route work and loads remain recorded. | stillwater-unscented-pillars; yide-pillar-production; igi-candle-waxes |\n| boundary_handoff | p_make; p_service | Record who actually performs each manufacture step and first quality release, its site/cohort and physical handoff. Link outsourced work to one supplier boundary and retain actual material custody and transport. Transfer or resale of already released candles is not new manufacture or a new Q; disclose unverified contractor coverage. |  |\n| boundary_q | finished_candle | Q counts first whole-unit quality release once, including qualified closing FG. No second output is added for that closing FG. Trial specimens destroyed before release are excluded from Q but their wax, wick, heating and emissions remain manufacturing loads. Post-release tests and repairs use original Qc; reinspection or delivery creates no Q. |  |\n| boundary_stocks | p_make; p_service | For every raw material reconcile opening + purchases + external returns received = closing + actual issues + supplier returns + losses. Record WIP by constituent/state and work stage with each inherited exchange vector. Physical stock and environmental history are separate. In manufacturing count release Q as output; downstream FG obeys opening FG + Q + returns + actual added repair material = closing FG + gross shipment + external scrap/removal, with actual changes reconciled. Cancel matching internal transfers at combined gate. |  |\n| boundary_services | p_service | Keep storage, packing, handling and dispatch preparation for opening/closing FG in the separate service ledger. Link returns to original shipment reversal and original cohort burden. Actual remelt/repair work uses p_make cards tagged to original Qc; its real additions F and displaced material exits remain. Old cohort or zero-output loads cannot be moved to a convenient positive current Q. |  |\n| boundary_packaging | p_service | For each packaging article independently: opening empty + opening WIP/FG-attached + opening reusable + purchases + first non-purchase external receipts + proven same-article returns received = all closing states + packaging leaving with gross physical shipments + external returns out + waste. First non-purchase receipts include packaging accompanying raw supplies, external loans and free transfers regardless of provider coverage. Only a return linked to the same article previously dispatched by this site is a return. Assign every physical movement and stock state; record incurred purchase, transport and service once, with unknown supplier coverage unresolved. Internal reuse cancels; no repurchase, net-Q contribution, coproduct or automatic credit. Whole supplied film/carton/label/pallet is purchased once; internal coatings/adhesives are non-additive unless separately applied. |  |\n| boundary_phases | all inventory rows | Paraffin melting/cooling alone creates neither CO2 nor reaction water. Retain actual test combustion, spills, evaporation, airborne wax droplets, collected soot, cleaning and maintenance. Separate fossil wax/dye carbon from cotton or other evidenced biogenic carbon without defaults; consumer combustion and upstream carbon uptake are not factory emissions. Record every actual species, phase, source and receiving medium independently. |  |\n| boundary_exhaust | p_make | Use one measured whole gas physical balance or a non-additive species bridge. Oxygen consumption and inlet/outlet nitrogen, argon, water and background CO2 remain explicit; no fixed air composition is imposed. Report gross inlet/outlet and net generated release separately. Thermal-carrier return is an external Product return when real; record mass, temperature/enthalpy, pressure and supply water/energy contract. One provider energy account prevents double purchase of heat plus its carrier energy. |  |\n\n"
