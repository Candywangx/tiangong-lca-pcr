system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "p_make"
      rule: "Include receipt through first complete-candle release for the narrow scope in §1. Keep actual melting control, wick positioning, pouring/cooling/demoulding/trimming, checks and burn trials. Fragrance, plant-wax blending, dipping/extrusion or container production require an evidenced extension; actual off-route work and loads remain recorded."
      source_ids:
        - stillwater-unscented-pillars
        - yide-pillar-production
        - igi-candle-waxes
    - rule_id: boundary_handoff
      applies_to: "p_make; p_service"
      rule: "Record who actually performs each manufacture step and first quality release, its site/cohort and physical handoff. Link outsourced work to one supplier boundary and retain actual material custody and transport. Transfer or resale of already released candles is not new manufacture or a new Q; disclose unverified contractor coverage."
      source_ids: []
    - rule_id: boundary_q
      applies_to: "finished_candle"
      rule: "Q counts first whole-unit quality release once, including qualified closing FG. No second output is added for that closing FG. Trial specimens destroyed before release are excluded from Q but their wax, wick, heating and emissions remain manufacturing loads. Post-release tests and repairs use original Qc; reinspection or delivery creates no Q."
      source_ids: []
    - rule_id: boundary_stocks
      applies_to: "p_make; p_service"
      rule: "For every raw material reconcile opening + purchases + external returns received = closing + actual issues + supplier returns + losses. Record WIP by constituent/state and work stage with each inherited exchange vector. Physical stock and environmental history are separate. In manufacturing count release Q as output; downstream FG obeys opening FG + Q + returns + actual added repair material = closing FG + gross shipment + external scrap/removal, with actual changes reconciled. Cancel matching internal transfers at combined gate."
      source_ids: []
    - rule_id: boundary_services
      applies_to: "p_service"
      rule: "Keep storage, packing, handling and dispatch preparation for opening/closing FG in the separate service ledger. Link returns to original shipment reversal and original cohort burden. Actual remelt/repair work uses p_make cards tagged to original Qc; its real additions F and displaced material exits remain. Old cohort or zero-output loads cannot be moved to a convenient positive current Q."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "p_service"
      rule: "For each packaging article independently: opening empty + opening WIP/FG-attached + opening reusable + purchases + first non-purchase external receipts + proven same-article returns received = all closing states + packaging leaving with gross physical shipments + external returns out + waste. First non-purchase receipts include packaging accompanying raw supplies, external loans and free transfers regardless of provider coverage. Only a return linked to the same article previously dispatched by this site is a return. Assign every physical movement and stock state; record incurred purchase, transport and service once, with unknown supplier coverage unresolved. Internal reuse cancels; no repurchase, net-Q contribution, coproduct or automatic credit. Whole supplied film/carton/label/pallet is purchased once; internal coatings/adhesives are non-additive unless separately applied."
      source_ids: []
    - rule_id: boundary_phases
      applies_to: "all inventory rows"
      rule: "Paraffin melting/cooling alone creates neither CO2 nor reaction water. Retain actual test combustion, spills, evaporation, airborne wax droplets, collected soot, cleaning and maintenance. Separate fossil wax/dye carbon from cotton or other evidenced biogenic carbon without defaults; consumer combustion and upstream carbon uptake are not factory emissions. Record every actual species, phase, source and receiving medium independently."
      source_ids: []
    - rule_id: boundary_exhaust
      applies_to: "p_make"
      rule: "Use one measured whole gas physical balance or a non-additive species bridge. Oxygen consumption and inlet/outlet nitrogen, argon, water and background CO2 remain explicit; no fixed air composition is imposed. Report gross inlet/outlet and net generated release separately. Thermal-carrier return is an external Product return when real; record mass, temperature/enthalpy, pressure and supply water/energy contract. One provider energy account prevents double purchase of heat plus its carrier energy."
      source_ids: []
