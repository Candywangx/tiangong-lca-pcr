measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q = sum of calibrated net masses of whole candles first passing the declared quality gate in cohort c. Include their wax, wick and necessary installed parts; exclude removable logistics packaging. Destructive prerelease trial specimens are not Q. Counts, catalogue dimensions or nominal wax fill do not establish net mass. cp_release records every whole-unit mass and configuration."
  - id: single_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual numerator property"
      uuid: ""
    required_unit: "kg; MJ; m3; h"
    rule: "Collect un-divided raw quantities; convert original units and integrate only rates before attribution. normalize_once is the only A/Qc calculation. Card amounts and aggregation reference that same result. H is an observation period, never a second divisor. Qc=0 retains all raw loads and produces no unit result."
  - id: electricity_units
    applies_to: "make_electricity; service_electricity"
    required_property_ref:
      name: "Energy"
      uuid: "f6811440-ee37-11de-8a39-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert metered electrical kWh to MJ by 3.6 before normalization. Energy is the metered technical quantity; its verified unit group has MJ=1 and kWh=3.6. Supplier flow and native property remain unbound. A common energy unit group does not establish a net-calorific-value property or a particular grid geography."
  - id: fluids_heat
    applies_to: "make_water; make_air; heat_carrier_in; heat_carrier_return; supplied_heat; service_water"
    required_property_ref:
      name: "Measured fluid property"
      uuid: ""
    required_unit: "kg; m3; MJ"
    rule: "Record actual pressure, temperature, humidity and meter reference state. An integrated volume is not multiplied by time again. Determine density independently for the actual substance/state; native secondary properties are not measured density. Heat energy and carrier mass/enthalpy/return form one provider energy account with a non-additive physical bridge; no assumed steam or boiler."
  - id: whole_species
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep whole supplied wax, wick and dye formulation separate from their non-additive assays/carriers. Melting/solidification is physical phase change, not combustion/polymerisation or reaction-water generation. Actual burn trials require independent C/H/O, species and water evidence; one residual cannot determine two unknowns. COD/VOC and particulate totals are not masses of a guessed molecule."
