              column: 1
          markdown: "# Unscented cast paraffin pillar candles: complete manufacture and first release\n\nThis method covers only complete unscented cylindrical paraffin candles with cotton wicks and actual colour formulation, formed by mould pouring. All rules inherit that scope, the first-release gate, source limitations and actual-cohort accounting. Glitter/adhesive-coated decorative pillars marked not for burning are excluded. Numeric operating or performance defaults are not supplied.\n\n"
    - unit_id: "normative_79595"
      family: "allocation"
