  calculation_rules:
    - id: raw_attribution
      applies_to: "all inventory rows"
      rule: "Before division construct A by row and actual origin cohort: its physical coordinate is gross actual V. Its environmental coordinate is B_open + B_current - B_close + F - X, with dedicated/subdivided/causal/residual attribution from section 7. B_current excludes separately recorded genuine new F. X removes only the proven identical same-side event duplicated in an OTHER subtotal; it never removes real added repair, water, waste or emissions. Raw stock and WIP historical vectors are conserved separately. Cancel only matched internal transfers; unknown origins remain unresolved."
      inputs:
        - V
        - B_open
        - B_current
        - B_close
        - F
        - X
        - cp_raw
        - cp_service
        - cp_stocks
        - cp_service_stocks
        - cp_allocation
        - cp_service_allocation
      output: "A"
      source_ids:
        - ilcd-attributional-allocation
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "q = A / Qc. Apply once to each unnormalised coordinate, retaining physical V and environmental B separately. Qc is positive first-release net mass of the true origin cohort; current manufacture uses Qc=Q. All cards and aggregation reuse q without further division. Qc=0 keeps raw loads and yields no unit result."
      inputs:
        - A
        - Qc
        - cp_release
        - cp_stocks
        - cp_service_stocks
      output: "q"
      source_ids: []
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "On consistent physical states reconcile opening + external receipts = closing + gross external exits + evidenced losses at manufacture, FG/service and combined gates. At manufacture first-release Q is output; downstream qualified closing FG is not another Q output. At FG include original returns, real additions and removals. Cancel internal transfer pairs. Full mass, relevant elements, phases and each actual species have independent evidence; whole supplied wet mass and component bridge are non-additive."
      inputs:
        - cp_raw
        - cp_service
        - cp_release
        - cp_stocks
        - cp_service_stocks
        - cp_species
        - cp_packaging
      output: "reconciled physical gates"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Confirm actual chemical/article, supplied state, type, all names/comments, CAS, grade/route/form/geography/media, every native property and provider boundary. Missing UUID is not permission for a collective exchange; preserve specific atomic identity."
      evidence: "Native complete objects; actual supplier specifications and receipts"
    - id: dq_coverage
      applies_to: "all operations"
      requirement: "Retain all failure, start/stop, idle, cleanup, rework, destructive trials, zero-output and origin-linked service periods. Distinguish measured zero, absent, unknown and unmeasured."
      evidence: "Signed operation logs; complete observation coverage"
    - id: dq_carbon_water
      applies_to: "species and phase ledgers"
      requirement: "Independently determine wax/dye/wick carbon origins, free water, actual reaction water, moisture and gas states. Do not count all finished wax carbon as factory CO2 or repeat upstream biogenic uptake. One balance residual cannot fit two unknown quantities."
      evidence: "Material assays; independent species measurements; carbon-origin and uncertainty evidence"
    - id: dq_sources
      applies_to: "product and method"
      requirement: "Primary product and process sources support the declared narrow construction and a technical synthesis, not one factory BOM, site parameters or performance certification. Preserve differing routes and unreported raw grades as limitations."
      evidence: "Full original context and declared evidence role"
    - id: dq_provider
      applies_to: "upstream and treatment links"
      requirement: "One actual provider representation per physical exchange. Services containing material use a non-additive physical bridge. Ordinary auxiliary/provider and future-site measurement gaps require disclosure; a truly missing whole-product terminal or method cannot be declared complete."
      evidence: "Provider coverage matrix and stock-origin records"
validation_rules:
  - rule_id: validate_whole
    applies_to: "finished_candle"
    rule: "Require complete unscented paraffin body, actual cotton wick and all installed functional parts after casting/finishing and actual declared inspection. Do not substitute bulk wax, wax/soy blend, flame-free product or purchased finished candle plus packaging for the selected manufacture. Check every qualifier and actual source limitation, including the manufacturer's explicit exclusion of glitter/adhesive decorative variants from burning."
    source_ids:
      - stillwater-unscented-pillars
      - yide-pillar-production
      - igi-candle-waxes
  - rule_id: validate_q
    applies_to: "all inventory rows"
    rule: "Check unique first-release Q, inclusion of qualified closing FG once, excluded destructive prerelease specimens, measured whole mass, original Qc and Q=0 treatment. Verify raw collection has no division, and normalization occurs once only. Returns, reinspection and delivery create no new Q."
    source_ids: []
  - rule_id: validate_gates
    applies_to: "physical and environmental ledgers"
    rule: "Require independent manufacturing/FG/combined balances, raw/WIP inherited vectors, each packaging equation, every species/source/phase/medium and relevant element check. Retain gross waste/emissions/repair/carrier returns independently from environmental allocation. Actual new F cannot be deducted as X. Unknown history or unmeasured required species remains an unresolved finding."
    source_ids: []
  - rule_id: validate_native
    applies_to: "UUID-bearing exchanges"
    rule: "Recheck whole native record and exact property-to-unit chain, official Chinese basename and every card restriction. A correct family identity never waives material, route, grade, media, geography or supplier compatibility. Broad ancillary aliases are not evidence for pure chemical, isotope, default density or different state."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "environmental attribution"
    rule: "Check exclusive assignment/subdivision, exchange-specific determining causality, then genuine residual common-gate contemporaneous market value and vector conservation. No arbitrary physical/economic choice or automatic recycling credit. Engineering syntax checks do not approve the scientific method, translation, classification mapping or publication."
    source_ids:
      - ilcd-attributional-allocation
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified whole unscented cast paraffin candle manufacturing and separately identified original-cohort FG services"
  allowed_use: "Actual compatible wax/wick/colour configuration and casting route with complete first-release and provider evidence"
  excluded_use: "Whole CPC 38999 coverage; consumer combustion; burn-time comparison; scented/container/LED products; default yields or credits"
  required_metadata: "All reference qualifiers; raw/WIP/FG history; cohort Qc; actual utilities; complete packaging and service boundaries"
  required_quality_disclosure: "Uncertainty; actual omissions and measurement gaps; identity/provider limitations; source role; review state"
  update_trigger: "Changed wax or wick material; formulation; product configuration; route; gate; actual utilities/providers; tests; evidence"
data_sources:
  - id: "stillwater-unscented-pillars"
    type: "handbook"
    reference: "Still Water Candles: Slate Blue Gray Rustic Textured Unscented Pillar Candle, 3x4 inch single-wick variant; homepage decorative-only exclusions https://www.stillwatercandles.com/ . Product page https://www.stillwatercandles.com/shop/p/slate-blue-gray-rustic-textured-unscented-pillar-candle-farmhouse-home-decor-large-decorative-handmade-blue-candle"
    used_for: "Manufacturer whole hand-poured unscented paraffin/cotton/dye product and no-bottom-tab construction; its adjacent glitter/adhesive decorative-only variants are not burnable and are excluded; actual compatible variants only, no default dimensions, wick counts, raw grade, performance or shared supplier claim."
  - id: "yide-pillar-production"
    type: "handbook"
    reference: "Dongguan Yide Machinery: Pillar & Taper Candle Production Guide (2026-09-27). https://www.yidecandlemachine.com/pillar-taper-candle-production-guide.html"
    used_for: "Equipment-maker casting stages, cooling/demoulding/finishing and actual acceptance/burn trials; adjacent dipping/extrusion and timings are not transferred as the selected route or defaults. No Still Water factory association."
  - id: "igi-candle-waxes"
    type: "handbook"
    reference: "The International Group: Waxes for Candles. https://igiwax.com/application/candles/"
    used_for: "Manufacturer distinguishes pillar paraffin building blocks, supplied formulations and container/soy blends; material-supply boundary and counterexamples only, no adopted grade, composition, temperature or recipe."
  - id: "ilcd-attributional-allocation"
    type: "official_guidance"
    reference: "European Commission JRC: ILCD Handbook, General guide for Life Cycle Assessment, Detailed guidance (2010), sections 7.9.2–7.9.3, printed pp.255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation-required cases: subdivision, exchange-specific determining physical causality and residual actual common-gate market values. Preserve the downstream-price counterexample; no prescribed candle quantities, QFD fractions or automatic credits."
