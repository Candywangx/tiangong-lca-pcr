      collection_method: "Independent stock counts/weights and analyses reconcile against complete prior exchange vectors and actual current records. Preserve unknown historical burdens as unresolved; a current average cannot invent them. Separate first-release FG from WIP and keep actual service histories. Retain only un-divided raw observations; aggregation references the sole calculated result."
