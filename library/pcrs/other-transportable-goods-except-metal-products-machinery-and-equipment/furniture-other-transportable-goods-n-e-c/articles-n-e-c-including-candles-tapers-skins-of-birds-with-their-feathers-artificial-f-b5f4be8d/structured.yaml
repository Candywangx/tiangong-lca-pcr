        end:
          offset: 81605
          line: 969
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_dedicated | environmental burden columns | Apply only to attributional situations where allocation is required. Assign exclusive operations and embodied material to their actual recipient first, then subdivide actually or by justified virtual subdivision. Record inaccessible data and potential distortion; allocation and substitution are not freely interchangeable choices. | ilcd-attributional-allocation |\n| allocation_causal | remaining environmental exchanges | Determine the physical causality separately for each remaining exchange. Dedicated wax/dye/wick stay with their recipient; heating, cooling, mould occupation, lighting and storage may have different determining drivers. Time alone or shared product mass is not automatically causal. Preserve failures, tests and losses in the responsible cohort. | ilcd-attributional-allocation |\n| allocation_residual | genuinely joint residual inventory | Only after the preceding steps, allocate genuine residual joint burdens by contemporaneous actual market value of actual co-functions at one common process gate in their real state and amount. Remove later transport/conditioning/packing from downstream prices. Document prices, state and period; no fixed share, energy-value proxy for candle function or QFD burn-performance split. Reconcile allocated plus retained vectors to the original total. | ilcd-attributional-allocation |\n| allocation_physical | all gross physical V | Do not scale down actual inputs, waste, gas emissions, repairs, replacements or heat-carrier returns by economic/service/stock environmental shares. Gross V retains its actual gate and true Q or original Qc. Internal wax reuse has no avoided-production credit. Waste price is not proof of coproduct status; each real treatment has one provider, with whole mixed waste and measured origin partitions non-additive. | ilcd-attributional-allocation |\n\n"
