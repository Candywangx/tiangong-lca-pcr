allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following is attributional process allocation only; industrial sources provide no allocation factors."
    source_ids: []
  - rule_id: a_framework
    applies_to: "all inventory rows"
    rule: "Use this method only for attributional manufacturing/process multifunctionality. First collect exclusive operations directly and subdivide or virtually subdivide known dedicated materials and services, including their waste and treatment consequences. Separate different desk configurations and production/service cohorts where feasible. Factory process descriptions alone do not establish allocation or a price factor."
    source_ids:
      - ilcd-general-2010
  - rule_id: a_causality
    applies_to: "all inventory rows"
    rule: "For each still shared exchange independently establish the determining physical causal relationship, including actual machining time/intensity, cutting geometry, extraction load, heat duty or occupied service area/time as appropriate. Embodied material is directly assigned; this is not automatically mass allocation of all losses. A common convenient kg, item count or machine hour is not sufficient evidence; justify the actual driver and retain numerator and total."
    source_ids:
      - ilcd-general-2010
  - rule_id: a_residual
    applies_to: "all inventory rows"
    rule: "Only genuinely residual process exchanges after subdivision and exchange-specific physical causality may use contemporaneous representative market values of all real co-functions at the same common process gate, actual quality/state and quantity. Remove downstream transport/conditioning/packing value consistently if deriving gate prices. No fixed share, free physical/economic choice, dispatch price surrogate or denominator limited to the target desk. Preserve sum-to-total of allocated exchange vectors and sensitivity; insufficient causality/value evidence remains unresolved."
    source_ids:
      - ilcd-general-2010
  - rule_id: a_waste
    applies_to: "manufacture; services; packaging"
    rule: "Ordinary offcuts, captured sawdust, rejects, samples and waste handling remain assigned to the manufacturing/service cohort that caused them. Sale or offsite treatment is not avoided primary wood, resin, heat or electricity. If a genuinely separate recovered function is modelled, identify the true joint process, waste/economic state and real treatment/handover boundary first, then justify the one allocation/transfer without dropping physical gross flows or inventing automatic substitution credits."
    source_ids:
      - ilcd-general-2010
  - rule_id: a_package_service
    applies_to: "packaging; services"
    rule: "Physical P/I/ER/S/EO/W and air/return/repair gross disclosures never receive economic or other burden fractions. Separately identify one upstream owner per actual supply and allocate only that actual owned burden dimension once, preserving original-cohort service Q and observed horizon. Internal reuse or a return does not acquire a second article. Already fulfilled service is not carried out of the cohort with closing FG."
    source_ids:
      - ilcd-general-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "released_kit"
      record_type: "Raw measurement and history record"
      raw_fields: "kit serial/lot; BOM/drawing revision; configuration; first-release date; acceptance tests and signoff; all component/loose hardware net masses; complete net mass M; unique cohort Q; calibration; moisture; original delivery and FG/WIP status"
