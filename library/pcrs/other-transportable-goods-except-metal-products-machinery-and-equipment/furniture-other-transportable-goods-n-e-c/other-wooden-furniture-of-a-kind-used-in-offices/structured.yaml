product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.other-wooden-furniture-of-a-kind-used-in-offices"
  classification_refs: "CPC 3.0 38122; narrower; current accepted association: classifications/mappings/cpc-3.0-to-pcr.yaml and docs/adr/cpc3-additional34-20261029-38122.md; complete method scope/exclusions apply, not full-leaf or scientific/translation approval"
  covered_products: "Complete manufacture from externally supplied melamine-faced wood particleboard through actual cutting, nonreactive EVA-based hot-melt application of ABS edge strips, trimming/buffing, connector drilling and specified routing, hardware fitting/sample assembly, final kit completeness and surface/dimensional/joint QC, to first-quality release of one complete unassembled flat-pack panel-end office desk kit. The kit contains one top, its two panel-end legs and modesty panel, the entire specified fastening/connection system, floor-contact/levelling feet, included accessories/tools and assembly instructions. All cartons together supply the kit; carton count is not desk count. No numerical board density, kit mass, dimension, life, strength, formaldehyde limit, recipe, adhesive rate, temperature, energy or yield is prescribed."
  excluded_products: "Exclude seats, kitchen/storage cabinets, loose furniture components or bare tabletops, metal-frame or powered/sit-stand desks, connected multi-desk systems, substrate or resin/facing-paper manufacture onsite, onsite face lamination, MDF/OSB/plywood, reactive PUR/laser edging, spray-painted/veneered routes, purchased finished-desk repacking, assembled-desk market state, customer assembly, use and end of life. Actual in-route optional parts/processes are individually recorded; a changed principal terminal/substrate/edging route requires a fresh applicability assessment."
  representative_product: "One complete unassembled panel-end office desk kit of one controlled configuration"
  production_route: "Supplied faced board → cutting → ABS/nonreactive EVA edging and trim → drilling/routing → hardware/sample assembly → complete kit QC and first release"
  market_state: "Complete unassembled flat-pack kit across all cartons; assembled desk and bare top are different terminals"
functional_unit:
  what: "Manufacture and first release the complete flat-pack panel-end office desk kit"
  how_much: "1 kg accepted net kit mass; a normalized portion of a complete measured kit; packaging separate"
  how_well: "Actual controlled specification for completeness, fit, joints, surfaces, dimensions and release tests; no universal threshold"
  how_long_or_cycle: "First release over the complete production cohort; actual original-cohort service horizon separate, no lifetime"
  reference_flow_link: "released_kit"
system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Begin with complete qualified MFC board, actual edge strip and whole glue preparation, finished hardware, real utilities and tools at receipt. Include every in-scope machining/fitting/QC operation, dust collection, failure, sample, cleanup, startup/shutdown and idle load, plus actual toll operations with owner boundaries. Board resin/paper pressing/facing is supplied upstream once; do not buy included resin/paper again or reclassify it as onsite manufacture. Supplier-included packaging remains a real incoming physical leg with one upstream owner."
      source_ids:
        - via-desk-manufacturing
        - egger-eurodekor-2017
    - rule_id: b_first_release
      applies_to: "released_kit"
      rule: "Q equals the sum of calibrated actual net masses of unique complete kits first released in the manufacturing cohort. Count no dispatch, reinspection, internal handover, return or re-release as new manufacture. Closing FG of those kits is already in Q; manufacturing Bclose contains only raw/WIP and unused/unassigned non-WIP stores/charges, not finished goods. Physical Q is an internal transfer to services and cancels on combination; it is not added beside closing FG and gross shipment."
      source_ids:
        - ilcd-general-2010
        - via-desk-manufacturing
    - rule_id: b_history
      applies_to: "all inventory rows"
      rule: "Retain opening/closing raw material, WIP, FG, residue, reusable package and installed asset/fluid physical stocks plus a separate inherited vector for each real exchange and cohort. Stock-correct manufacturing assignment once, with no second subtraction of already stock-corrected consumption. Keep failed/zero-output cohorts and actual treatment burdens. Ordinary rejects/samples/waste/scrap sales or removal are not Tother; only a true different cohort/function with a justified allocation/handover can transfer one burden vector once. No physical gross leg is reduced by the burden fraction."
      source_ids:
        - ilcd-general-2010
    - rule_id: b_services
      applies_to: "services"
      rule: "Observe packing/storage/handling/dispatch and all work actually performed by original first-Q cohort over its stated horizon, including unauthorized, unsuccessful, aborted, repeated and failed work and its real inputs, outputs, emissions and treatment. Permission and postwork acceptance control conforming disposition, never whether an actual event enters the inventory. Preserve opening-FG historical burdens and original Q_c, actual gross shipment G and external return R, original-delivery identity, removed/new parts and water, mass changes, incremental tests/rework/treatment and disposition. Already performed service stays with its original cohort even if FG remains stored; only unused/unassigned service/charge may carry forward. Sum actual service burden observed within H and divide once by that original Q_c, with no additional divisor H or revised shipment denominator. This first-release method is not a net-delivery denominator; any net-delivery study needs a separately reviewed full G/R/original delivery reversal D_rev and historical burden bridge."
      source_ids:
        - ilcd-general-2010
        - via-desk-manufacturing
    - rule_id: b_packages
      applies_to: "packaging"
      rule: "For each actual packaging article separately retain all six full wet gross legs P/I/ER/S/EO/W and empty, attached-WIP/FG and reusable opening/closing stocks. In addition record actual separate repair-component/water additions Z_in and removals Z_out, plus independently observed natural moisture uptake N_in and loss N_out; natural humidity is not invented repair water. The complete article balance is opening + P + I + ER + Z_in + N_in = closing + S + EO + W + Z_out + N_out. Internal transfers/reuse cancel. Resolve each whole wet article into independently measured material/water component subaccounts; use whole total OR its exhaustive component partition at a physical gate, never both additively. X_in/X_out can remove only proven duplicates from OTHER actual same-side incoming/outgoing flow terms for the identical component/event; no deduction from P/I/ER/S/EO/W, full stocks, an opposite side, an unmatched balance or merely because another card exists. Real additions remain even when fully retained in closing wet stock. Keep one upstream owner and separate actual service burden; ER/S/EO/W do not create procurement or automatic credit."
      source_ids:
        - ilcd-general-2010
        - via-desk-manufacturing
    - rule_id: b_mass_carbon_water
      applies_to: "all inventory rows"
      rule: "Independently close whole wet physical mass and relevant wood/resin/ABS/metal/adhesive components and C/N/other relevant elements at manufacture, FG services and combined gates. Keep wood biogenic carbon, fossil resin/plastic/adhesive carbon and ambient carbon separate; upstream uptake is not automatically copied onsite. Actual free, bound/structural, adsorbed, carrier, condensate, liquid and gas water are separate subaccounts; this physical machining/nonreactive glue route supplies no invented curing reaction water. Emissions require real species and phase evidence; total VOC/NOx/COD/total carbon/total dust is not a molecular inventory. One residual cannot solve two unknown losses/species/water quantities."
      source_ids:
        - ilcd-general-2010
        - egger-eurodekor-2017
    - rule_id: b_assets
      applies_to: "all inventory rows"
      rule: "Separate physical machine/tool/fluid stocks from actual fulfilled equipment service burden. Retain full new/used acquisitions, repairs, installed fluids, wear, replaced cores and actual water X_in/X_out; neither closing retention nor internal recirculation erases true influx. New saw/router/drill or dust-collector machinery is not one whole machine consumed per kg; derive actual period/cohort service with measured utilization and justified allocation, no fixed lifetime or replacement mass. Expand actual extra fuel, heat carrier, refrigerant, repair material, detergent ingredient, package or emission into a separate atomic card before calculation. Unknown presence is not not_applicable."
      source_ids:
        - ilcd-general-2010
        - via-desk-manufacturing
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-general-2010
