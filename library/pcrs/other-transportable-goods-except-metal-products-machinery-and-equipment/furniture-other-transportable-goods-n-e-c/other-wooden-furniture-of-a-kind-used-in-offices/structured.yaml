      raw_fields: "single identified species/physical composite; CAS when chemical; carbon origin; phase; destination; concentration and actual gas/water flow; rate or integrated amount; duration; sample method; uncertainty; moisture and particle size; all operating modes"
      collection_method: "Use substance-specific calibrated measurement and independent composition/flow evidence. Convert concentration times measured corresponding total carrier amount or integrate true rates once. Reconcile species and relevant elemental mass independently of total physical closure; no VOC/NOx/COD surrogate for a chemical. Aggregation method: collect and sum undivided raw quantities, perform actual conversions/history/assignment first; physical-only cards retain complete V without burden fractions. Only calc_reference produces the per-reference result; aggregation_rule declares that same final basis and performs no second division."
