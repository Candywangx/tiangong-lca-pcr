      quality_evidence: "Calibration, raw logs, composition/state, genealogy, independent physical/burden reconciliation and uncertainty"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "one material and one of P/I/ER/S/EO/W"
      record_type: "Raw measurement and history record"
      raw_fields: "one exact package article; exhaustive actual material/water component bridge; full wet tare; empty/attachedWIP/attachedFG/reusable opening/closing; P; I; ER; gross S; EO; W; internal reuse; real separate repair material/water Z_in/Z_out; independently observed natural moisture N_in/N_out; actual same-side OTHER duplicate-event evidence X_in/X_out; original cohort Q_c; upstream owner and every inherited vector; service horizon ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID"
      collection_method: "Independently weigh every physical article leg and retained wet stock, first non-purchased external ingress and external returns. Measure actual separate repair additions/removals and natural humidity exchange independently; no invented repair, moisture residual or default component fraction. Reconcile whole article OR its exhaustive measured component partition, not both additively. Each X requires the identical event/component in an actual OTHER same-side flow term; keep complete article legs/stocks unchanged and do not infer duplicate counting from card presence. P/I whole supply has one upstream owner, actual owned burden assigned once independently from full V. Collect undivided raw amounts and preserve all actual work whether permitted or not; only calc_reference normalizes each distinct physical/burden dimension once.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
      unit: "kg; actual counts with independent tare"
      frequency: "Each event/lot plus period reconciliation"
      temporal_coverage: "Complete production period plus separately declared original-cohort service horizon, all operating modes"
      site_scope: "Each actual site/line/provider gate/stock and service cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, raw logs, composition/state, genealogy, independent physical/burden reconciliation and uncertainty"
  calculation_rules:
    - id: calc_raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert actual raw extensive quantities to each row native unit once; kWh x 3.6 = MJ. Integrate actual rates once over measured duration; already integrated quantities receive no second time factor. Volume-to-mass needs that substance at its independently measured actual state; exact drawing-specific geometry only; no secondary-property density or guessed unit mass."
      inputs:
        - raw_amount
        - raw_unit
        - actual_state
        - actual_duration
        - independent_conversion
      output: "converted undivided raw quantities"
      source_ids:
        - ilcd-general-2010
    - id: calc_history
      applies_to: "manufacture"
      rule: "For each exchange vector retain Bopen + U - Bclose - Tother as the attributable manufacturing numerator before the one quotient; Bclose includes raw/WIP and unused/unassigned non-WIP charges only, never first-released FG. U includes all actual loads in every operating mode and ordinary failure/waste/treatment. Tother requires a genuine other cohort/function and a justified single handover/allocation, never sale/removal alone. Already stock-corrected consumption is not subtracted again. This equation never replaces physical V or shrinks gross legs."
      inputs:
        - Bopen
        - U
        - Bclose
        - Tother
        - inherited_vector
        - allocation_evidence
      output: "assigned manufacturing exchange vector"
      source_ids:
        - ilcd-general-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "Independently reconcile manufacturing opening raw/WIP/asset/fluid stocks plus full real external incoming legs against closing corresponding unreleased/installed stocks, internal first-release Q, real waste, external material/water returns and actual species outflows. Preserve independent measured V_i/native-unit ledgers and wet-mass bridges alongside every inherited exchange vector. FG services reconcile opening FG plus Q plus actual external kit returns and service/repair/package influx against full closing FG, gross kit shipments, package returns/waste and actual removed matter/emissions. Include actual Z repair/component and N natural-moisture exchanges under calc_packaging; X cancels only a proven duplicate OTHER same-side flow term, never stock or an opposite side. Whole wet articles and their exhaustive component views are alternatives, not additive flows. Combined gates cancel Q and matched internal pairs once. If one actually collected mixed waste exists, measure one complete wet total and one provider transaction; disclose its independently measured origin-W subaccounts only as a partition summing to that total, or report the total alone. Do not fabricate material partitions, add origin-W again, or multiply treatment providers; add the actual atomic mixed-waste card before a dataset is complete. Component, C/N, water-phase and installed-stock balances remain independent; one residual cannot solve multiple unknowns."
      inputs:
        - cp_material
        - cp_release
        - cp_assets
        - cp_residue
        - cp_water
        - cp_species
        - cp_air
        - cp_service
        - cp_packaging
      output: "independent physical closure ledgers"
      source_ids:
        - ilcd-general-2010
    - id: calc_packaging
      applies_to: "packaging"
      rule: "For each article: opening + P + I + ER + Z_in + N_in = closing + S + EO + W + Z_out + N_out. All article legs/stocks are full wet quantities. Z denotes independently recorded actual separate repair material/water influx or removal; N denotes real natural moisture exchange, never assumed repair. Independently reconcile the whole article with its exhaustive material/water component bridge. At an overall gate use the whole article OR that component partition, not their sum. X_in/X_out remove only a documented duplicate from OTHER actual SAME-SIDE incoming/outgoing component/event terms already included in the article/repair/moisture account; never reduce article gross legs or stocks, net against the opposite side, infer duplication from card presence, or erase an actual retained influx. Gross-card A_i equals full actual V_i. Owned upstream/service burden is a separate vector with one owner and original-cohort horizon, not a new burden on every movement."
      inputs:
        - cp_packaging
        - P
        - I
        - ER
        - S
        - EO
        - W
        - Z_in
        - Z_out
        - N_in
        - N_out
        - X_in
        - X_out
        - complete_component_bridge
        - actual_other_same_side_flow
        - wet_stocks
        - original_cohort
        - upstream_owner
      output: "gross physical V and separate assigned owned burden vector"
      source_ids:
        - ilcd-general-2010
    - id: calc_services
      applies_to: "services"
      rule: "Preserve each original first-release cohort Q_c and inherited manufacturing vector separately from all actual incremental service burden observed within H, including unauthorized, unsuccessful, aborted, repeated and failed operations. Permission, defect assessment, postwork tests, acceptance and disposition are independent quality facts; none excludes actual work. Retain performed service despite held FG and carry only unused/unassigned charge. Sum actual H-period service once and normalize by original Q_c once, never by H or a shipment/re-release denominator. Gross G/R and new/removed parts, water and waste retain full physical V_i in their native units and V_i/Q_c independently from burden A_i/Q_c. Trace original deliveries without blind R=D_rev or new Q; a net-delivery method requires a separately reviewed full historic bridge."
      inputs:
        - cp_service
        - original_Q
        - original_FG_vector
        - gross_G
        - gross_R
        - original_delivery
        - actual_incremental_service
      output: "matched-cohort incremental service numerator and gross physical legs"
      source_ids:
        - ilcd-general-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q. Q is the positive unique first-release net kit mass Q_c of the relevant original manufacturing/service cohort. For ordinary assigned LCI dimensions A_i is the converted history-reconciled actually allocated exchange numerator. Independently retain the same actual gross V_i in its native extensive unit and physical disclosure v_i = V_i/Q_c; this is a parallel physical view, not another purchase/provider, characterization or credit. For a marked physical-only gross card A_i already equals complete actual V_i without stock correction or burden/economic fraction, so its x_i and v_i describe the same one physical quotient and are not additive. This single normalization stage divides each distinct dimension by original Q_c once; cards and aggregation consume the result and never divide again or divide by H. Q=0 retains all real raw V_i and exchange vectors without any unit result."
      inputs:
        - A_i
        - Q
        - original_cohort
        - raw_quantity
        - history_assignment
        - allocation_evidence
        - gross_V_if_physical
      output: "x_i per reference flow"
      source_ids:
        - ilcd-general-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "released_kit"
      requirement: "Complete declared kit and accepted drawing/BOM, actual faced particleboard and nonreactive edge method, correct supplied state and official localized native names; no inferred class/certification/life."
      evidence: "Controlled product records; supplier declarations; complete native identity context"
    - id: dq_raw
      applies_to: "all inventory rows"
      requirement: "Full undivided raw records, calibration/state/unit evidence, independent moisture/density/species measurements, uncertainty and measured zero versus unknown; no fabricated quantities or one residual fitting multiple unknowns."
      evidence: "Raw logs; calibration; test methods; uncertainty"
    - id: dq_history
      applies_to: "all inventory rows"
      requirement: "Full period includes startup/shutdown, failed lots, zero-output, idle, samples, rework and cleanup; each inherited vector and physical stock is reconciled independently."
      evidence: "Opening/closing stock and vector ledgers; production genealogy"
    - id: dq_packages
      applies_to: "packaging"
      requirement: "Each actual package has separate six gross-direction cards and one upstream owner; supplier-included influx, real repairs and wet stock retained; no fractional gross mass or automatic credit."
      evidence: "P/I/ER/S/EO/W raw records; ownership and physical closure"
    - id: dq_services
      applies_to: "services"
      requirement: "Original cohort and original Q, full observed service horizon, actual G/R and original delivery identity, historic burden and real incremental work with permission/tests/disposition."
      evidence: "Matched cohort/horizon; manufacturer permission; postwork test records"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Keep every source_id/type/reference/used_for and actual rule source list, source scope/counterexamples and unknown numeric applicability; UUID evidence proves identity only."
      evidence: "Complete originals or honestly identified full tool text; applicability and gap assessment"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "All checks require actual evidence; engineering checks establish neither scientific/translation approval nor accepted mapping."
    source_ids: []
  - rule_id: v_identity
    applies_to: "released_kit"
    rule: "Verify complete kit BOM/state and unique first-release genealogy, correct reference UUID/native property/unit and positive measured Q. Missing core reference identity or incomplete whole terminal blocks usable methodology; no passing engineering result substitutes for applicability. Check all required qualifiers and actual per-configuration measured M without inferred density/item mass."
    source_ids:
      - ilcd-general-2010
      - via-desk-manufacturing
  - rule_id: v_raw
    applies_to: "all inventory rows"
    rule: "Independently trace every actual numerator from undivided raw amount/state/unit/rate through one real conversion and justified history/allocation to one x_i quotient. Gross-card numerator is full V, not a burden vector. Collection, amount cards and protocol aggregation reference the same quotient and never each divide again. For Q=0 retain all actual loads/physical flows but report no unit result."
    source_ids:
      - ilcd-general-2010
      - via-desk-manufacturing
  - rule_id: v_closure
    applies_to: "all inventory rows"
    rule: "Independently close manufacture/FG-service/combined physical gates, wet mass/components/relevant elements, moisture phases, installed stocks and all six package legs. Internal Q and transfer pairs cancel, no FG double count or burden-fraction physical mass. Record independent measurements and uncertainty; no balancing residual can determine multiple unknowns."
    source_ids:
      - ilcd-general-2010
      - via-desk-manufacturing
  - rule_id: v_history
    applies_to: "all inventory rows"
    rule: "Check opening/closing WIP vectors, raw and unused/unassigned tool/fluid carryover once, all failure/startup/idle/cleanup burdens, ordinary manufacturing/treatment wastes retained, and only justified true other-function/cohort transfers. Check opening-FG original histories, gross G/R identity and actual additional parts/water/treatment with repair permissions/tests; no reinspection or dispatch creates Q."
    source_ids:
      - ilcd-general-2010
      - via-desk-manufacturing
  - rule_id: v_atomic
    applies_to: "all inventory rows"
    rule: "Each actual supplied formulation/article, material, utility, fuel, packaging direction, waste and species/destination requires one atomic exchange with correct extensive property and all native restrictions. Assays and gross physical subaccounts do not become duplicate purchases or characterized emissions. Add any actual missing atom, distinguish measured zero, proven absence and unknown, and preserve unresolved auxiliary UUID/provider gaps explicitly."
    source_ids:
      - ilcd-general-2010
      - via-desk-manufacturing
  - rule_id: v_quality
    applies_to: "all inventory rows"
    rule: "Check actual controlled acceptance/test records, calibrated measurements, complete period/cohort/service horizon coverage and upstream provider boundaries; no borrowed SKU recipe, numerical performance class, wood-waste credit, emissions factor or declaration of reviewed science/translation. Failed fetches/read mismatch and uncovered evidence are not no-hit or covered."
    source_ids:
      - ilcd-general-2010
      - via-desk-manufacturing
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Attributional manufacture inventory for the declared complete flat-pack office desk kit and matching original-cohort services"
  allowed_use: "Actual matching configuration/material/route/state/gate/native restrictions with all quality and unresolved disclosures"
  excluded_use: "Assembled desk or bare-top substitution; service-life/performance equivalence; whole-leaf coverage; automatic recycling credit or approval claims"
  required_metadata: "desk model and controlled drawing/BOM revision; complete single top plus two panel legs and modesty panel scope; wood-particle substrate and supplied melamine faces with upstream owner; actual board dimensions and geometry; moisture and wet/dry convention; core/facing binder and wood/fossil carbon composition; actual ABS edge profile and whole EVA hot-melt grade/SDS; all finished hardware alloys/coatings and plastic parts; actual included feet/pads/accessories/tools/instructions; hole and routing geometry and excluded options; unassembled complete flat-pack state across all cartons; manufacturer-controlled fit/joint/surface/dimension/completeness acceptance and relevant tests; uniquely measured net first-release Q and calibrated per-configuration M; site geography and period; actual utility voltage/mix/carrier state; raw/WIP/FG and installed stock histories with each inherited vector; each package P/I/ER/S/EO/W gross ledger and one upstream owner; original-cohort service horizon and repair permissions/tests/disposition; actual waste species and treatment; allocation evidence and all unresolved identities"
  required_quality_disclosure: "Raw quantities/state, calibration, uncertainty, inherited vectors, independent physical gates, package six legs and ownership, service horizon, source/UUID/provider gaps"
  update_trigger: "Reassess actual changes in terminal/substrate/glue/edging/configuration/provider/gate/unit/rules/evidence"
data_sources:
  - id: "un-cpc-38122"
    type: "official_guidance"
    reference: "UNSD CPC3.0 subclass38122 — https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/38122"
    used_for: "Classification meaning and surrounding seat/metal-office/kitchen/parts distinctions only; no manufacturing rule or accepted mapping."
  - id: "via-desk-manufacturing"
    type: "handbook"
    reference: "Via Furniture, Office Desk Manufacturing — https://viaspacefurn.com/office-furniture-manufacturing/"
    used_for: "Complete source qualitative panel-office-desk process through cutting, nonreactive hot-melt edging, drilling/routing, hardware/preassembly, QC and complete flat-pack export. Alternative substrates, edge materials, PUR/laser routes are excluded here. No recipe, rate, certification, factory inventory or threshold is adopted."
  - id: "egger-eurodekor-2017"
    type: "handbook"
    reference: "EGGER Eurodekor Technical data sheet TD ED EN, Revision09, approved2017-11-13 — https://downloads.egger.com/static/uk/TD_EGGER_Eurodekor_en.pdf"
    used_for: "Qualitative supplied melamine-faced board identity; chipboard versus MDF/OSB alternatives; total thickness includes facing, substrate-specific formaldehyde information, incoming handling/conditioning and limitations. No numerical table value adopted."
  - id: "dvo-treko-technical"
    type: "handbook"
    reference: "DVO DV805 Treko Technical Data Sheet, DESKS and adjacent alternatives — https://www.dvo.it/ContentsFiles/DV805_CT_023LEVEL3.pdf"
    used_for: "The qualitative DESKS technical description corroborates whole panel-end desk top/legs/modesty panel, ABS edging/spacers/levelling feet and distinct metal-column/cabinet variants; no numeric dimension or common factory/SKU claim. Primary manufacturing route remains independently supported by Via."
  - id: "ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, First edition March2010, §§7.9.2–7.9.3 pp255–272 — https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional process multifunctionality only: subdivision/virtual subdivision, exchange-specific determining physical causality and genuinely residual common-process gate/state market value. Foreground history and physical ledgers are declared collection requirements; industrial descriptions do not establish allocation. No consequential credit or recycled-content factor adopted."
