          column: 1
      markdown: "## 9. Validation Rules\n\nAll checks require actual evidence; engineering checks establish neither scientific/translation approval nor accepted mapping.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_identity | released_kit | Verify complete kit BOM/state and unique first-release genealogy, correct reference UUID/native property/unit and positive measured Q. Missing core reference identity or incomplete whole terminal blocks usable methodology; no passing engineering result substitutes for applicability. Check all required qualifiers and actual per-configuration measured M without inferred density/item mass. | `ilcd-general-2010`; `via-desk-manufacturing` |\n| v_raw | all inventory rows | Independently trace every actual numerator from undivided raw amount/state/unit/rate through one real conversion and justified history/allocation to one x_i quotient. Gross-card numerator is full V, not a burden vector. Collection, amount cards and protocol aggregation reference the same quotient and never each divide again. For Q=0 retain all actual loads/physical flows but report no unit result. | `ilcd-general-2010`; `via-desk-manufacturing` |\n| v_closure | all inventory rows | Independently close manufacture/FG-service/combined physical gates, wet mass/components/relevant elements, moisture phases, installed stocks and all six package legs. Internal Q and transfer pairs cancel, no FG double count or burden-fraction physical mass. Record independent measurements and uncertainty; no balancing residual can determine multiple unknowns. | `ilcd-general-2010`; `via-desk-manufacturing` |\n| v_history | all inventory rows | Check opening/closing WIP vectors, raw and unused/unassigned tool/fluid carryover once, all failure/startup/idle/cleanup burdens, ordinary manufacturing/treatment wastes retained, and only justified true other-function/cohort transfers. Check opening-FG original histories, gross G/R identity and actual additional parts/water/treatment with repair permissions/tests; no reinspection or dispatch creates Q. | `ilcd-general-2010`; `via-desk-manufacturing` |\n| v_atomic | all inventory rows | Each actual supplied formulation/article, material, utility, fuel, packaging direction, waste and species/destination requires one atomic exchange with correct extensive property and all native restrictions. Assays and gross physical subaccounts do not become duplicate purchases or characterized emissions. Add any actual missing atom, distinguish measured zero, proven absence and unknown, and preserve unresolved auxiliary UUID/provider gaps explicitly. | `ilcd-general-2010`; `via-desk-manufacturing` |\n| v_quality | all inventory rows | Check actual controlled acceptance/test records, calibrated measurements, complete period/cohort/service horizon coverage and upstream provider boundaries; no borrowed SKU recipe, numerical performance class, wood-waste credit, emissions factor or declaration of reviewed science/translation. Failed fetches/read mismatch and uncovered evidence are not no-hit or covered. | `ilcd-general-2010`; `via-desk-manufacturing` |\n\n"
