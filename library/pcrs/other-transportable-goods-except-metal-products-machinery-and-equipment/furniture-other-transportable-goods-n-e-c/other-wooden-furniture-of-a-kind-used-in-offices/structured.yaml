          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nThe following is attributional process allocation only; industrial sources provide no allocation factors.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_framework | all inventory rows | Use this method only for attributional manufacturing/process multifunctionality. First collect exclusive operations directly and subdivide or virtually subdivide known dedicated materials and services, including their waste and treatment consequences. Separate different desk configurations and production/service cohorts where feasible. Factory process descriptions alone do not establish allocation or a price factor. | `ilcd-general-2010` |\n| a_causality | all inventory rows | For each still shared exchange independently establish the determining physical causal relationship, including actual machining time/intensity, cutting geometry, extraction load, heat duty or occupied service area/time as appropriate. Embodied material is directly assigned; this is not automatically mass allocation of all losses. A common convenient kg, item count or machine hour is not sufficient evidence; justify the actual driver and retain numerator and total. | `ilcd-general-2010` |\n| a_residual | all inventory rows | Only genuinely residual process exchanges after subdivision and exchange-specific physical causality may use contemporaneous representative market values of all real co-functions at the same common process gate, actual quality/state and quantity. Remove downstream transport/conditioning/packing value consistently if deriving gate prices. No fixed share, free physical/economic choice, dispatch price surrogate or denominator limited to the target desk. Preserve sum-to-total of allocated exchange vectors and sensitivity; insufficient causality/value evidence remains unresolved. | `ilcd-general-2010` |\n| a_waste | manufacture; services; packaging | Ordinary offcuts, captured sawdust, rejects, samples and waste handling remain assigned to the manufacturing/service cohort that caused them. Sale or offsite treatment is not avoided primary wood, resin, heat or electricity. If a genuinely separate recovered function is modelled, identify the true joint process, waste/economic state and real treatment/handover boundary first, then justify the one allocation/transfer without dropping physical gross flows or inventing automatic substitution credits. | `ilcd-general-2010` |\n| a_package_service | packaging; services | Physical P/I/ER/S/EO/W and air/return/repair gross disclosures never receive economic or other burden fractions. Separately identify one upstream owner per actual supply and allocate only that actual owned burden dimension once, preserving original-cohort service Q and observed horizon. Internal reuse or a return does not acquire a second article. Already fulfilled service is not carried out of the cohort with closing FG. | `ilcd-general-2010` |\n\n"
