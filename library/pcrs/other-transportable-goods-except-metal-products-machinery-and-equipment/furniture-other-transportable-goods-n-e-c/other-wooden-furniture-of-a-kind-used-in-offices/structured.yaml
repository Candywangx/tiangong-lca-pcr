    - protocol_id: cp_service
      process_id: "services"
      flow_role: "each actual original-cohort service or repair leg"
      record_type: "Raw measurement and history record"
      raw_fields: "original first-release cohort and Q; original inherited FG vector; observation start/end; actual electricity/water/new/removed parts; permission and defect assessment; work/posttests/acceptance/disposition; gross G/R and original delivery; original versus returned mass and moisture; opening/closing FG and unused/unassigned charge"
      collection_method: "Collect every actually performed incremental packing/storage/movement/rework operation within H by original cohort, including unauthorized, unsuccessful, aborted and repeated work, waiting/failed operations and real new/removed parts and water. Independently record permission, defect assessment, postwork tests, acceptance and disposition as quality facts; missing permission never removes an event. Preserve historic manufacture and original Q_c, never replace original delivery by return mass or add new Q. Collect undivided raw quantities, convert/history-reconcile/assign first; physical V and burden A remain independent. Only calc_reference supplies their final per-original-Q_c results; no second division by Q_c or H."
      unit: "MJ; kg; original service units"
      frequency: "Each event/lot plus period reconciliation"
      temporal_coverage: "Complete production period plus separately declared original-cohort service horizon, all operating modes"
      site_scope: "Each actual site/line/provider gate/stock and service cohort"
