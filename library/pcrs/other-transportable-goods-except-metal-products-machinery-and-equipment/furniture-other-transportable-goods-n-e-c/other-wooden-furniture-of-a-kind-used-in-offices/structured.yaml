      record_type: "Raw measurement and history record"
      raw_fields: "single air substance and origin; actual intake/exhaust/compressed-air location; temperature/pressure/humidity; actual gas volume/mass and composition; dry/wet basis; corresponding aggregate-air subaccount; pollutants and condensate"
      collection_method: "Determine actual gross air components and state independently. Whole supplied air and constituents are alternative total/subaccount views, never additional purchases/emissions. Include actual ambient carbon and water without claiming new biogenic fixation. Aggregation method: collect and sum undivided raw quantities, perform actual conversions/history/assignment first; physical-only cards retain complete V without burden fractions. Only calc_reference produces the per-reference result; aggregation_rule declares that same final basis and performs no second division."
      unit: "kg; original actual gas-volume units"
