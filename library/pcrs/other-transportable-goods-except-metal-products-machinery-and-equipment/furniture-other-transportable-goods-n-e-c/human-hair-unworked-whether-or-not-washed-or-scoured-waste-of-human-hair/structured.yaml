allocation_rules:
  - rule_id: allocation_services
    applies_to: "intake"
    rule: "Prefer subdivision and direct measurement; allocate shared weighing, storage and transport using measured attributable drivers with time, load and complete denominators. Do not use sale proceeds or a zero donation price as environmental burden drivers."
    source_ids: []
  - rule_id: allocation_haircut
    applies_to: "supplier"
    rule: "Subdivide common hair-material and haircut-service burdens first; attribute actual collection-specific services and evidenced shared portions with causal justification. Unjustified allocation remains unknown; do not assign an entire haircut or zero burden automatically."
    source_ids: []
  - rule_id: allocation_returns
    applies_to: "intake"
    rule: "No saleable coproduct is presumed. Rejected returns, discarded hair, packaging and waste create neither additional Q nor avoided-disposal credit. Keep attributable collection, inspection and handling burdens of failures and returns in the same-cohort numerators. A real saleable coproduct requires further allocation and boundary review."
    source_ids: []
  - rule_id: allocation_inherited_returns
    applies_to: "raw_hair; returned_hair"
    rule: "Physical arrival does not prove acquisition. Do not load another purchased-hair provider for unacquired temporarily held hair returned to its owner. For acquired hair subsequently returned, transfer its inherited upstream exchange vector with that physical return instead of also retaining it in the accepted-hair numerator. Actual intake, failed inspection and return-service burdens remain attributable by evidenced drivers. Keep the full physical ledger without avoided-disposal credits."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_hair
      process_id: "intake"
      flow_role: "raw hair; accepted hair; returns; discarded hair"
      record_type: "weighing"
      raw_fields: "lot; purchase/donation; seller; colour/history; root direction; lengths; moisture; gross/tare; incoming, Q, returns, discarded hair and opening/closing unreleased stocks"
      collection_method: "Calibrated net weighing per lot; verify first securing/cutting event, source authorization/compliance evidence, supplier lot and burden vectors against first release; detect previous equivalent release and quarantine resale lots; sign period carryover of quantities/vectors through release or return; no drawing or dressing"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete cohort through return closure"
      site_scope: "collector and receiver separately"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "acceptance forms, scale calibration, moisture conditions, stock records"
    - protocol_id: cp_exchange
      process_id: "intake"
      flow_role: "electricity and shared services"
      record_type: "meter and activity ledger"
      raw_fields: "submeter electricity; opening/closing readings; drivers and complete served populations; supplier/transport interfaces"
      collection_method: "Prefer direct meters; attribute shared portions by evidenced drivers; retain failures and zero-output periods"
      unit: "kWh"
      frequency: "each cohort and meter period"
      temporal_coverage: "complete matched cohort/period"
      site_scope: "actual supplier and receiving sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters, time logs, supplier interfaces and attribution basis"
    - protocol_id: cp_pack
      process_id: "intake"
      flow_role: "each packaging article and its waste"
      record_type: "article ledger"
      raw_fields: "mass per packaging material; purchases; incoming attached quantities; stocks; dispatch; external returns and waste destinations"
      collection_method: "Weigh each object/material; record owner, first-receipt class (new purchase, supplier-included, nonpurchase or loan), actual same-object return links, period empty/attached/borrowed stocks and ultimate dispatch/return/discard; reconcile mutually exclusive boundary_packaging_interfaces ledger; verify each inherited burden against hair-provider inclusion without duplication"
      unit: "kg"
      frequency: "each lot and closing stock"
      temporal_coverage: "same cohort including later packaging horizon"
      site_scope: "receiving and dispatch sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "material declarations, invoices, stocks, treatment receipts"
  calculation_rules:
    - id: inventory_normalization
      applies_to: "all inventory rows"
      rule: "For each same-cohort exchange divide its attributable total by positive first-release net Q to obtain the amount per 1 kg reference flow; do not multiply by bundle count or divide by length again. If Q is zero retain totals without a unit result."
      inputs:
        - cp_hair
        - cp_exchange
        - cp_pack
        - Q
      output: "each exchange per 1 kg reference flow"
      source_ids: []
    - id: hair_balance
      applies_to: "intake"
      rule: "Opening unreleased hair + arrivals = first-release Q + returned hair + discarded hair + closing unreleased hair + independently evidenced net moisture/foreign-matter losses. Q includes this cohort closing released stock; later dispatch is not new Q. Measure composition independently; do not use one residual to infer both moisture and unknown hair loss."
      inputs:
        - cp_hair
      output: "physical ledger closure and explicit discrepancies"
      source_ids: []
    - id: supplier_interface
      applies_to: "raw_hair"
      rule: "Incoming physical hair carries inherited supplier services. Record actual supplier water, cleaner, drying energy and transport individually with their collection bases and conversion to this delivered lot; presume no recipe or values. Receiver does not count the same upstream burdens again."
      inputs:
        - cp_hair
        - cp_exchange
        - "supplier data"
      output: "traceable supplier boundary and gaps"
      source_ids:
        - lpt-donation-2025
  data_quality_requirements:
    - id: quality_intake
      applies_to: "intake"
      requirement: "Verify natural untreated colour, preserved roots, clean/dry state and actual intake criteria per lot. Merchant minimum 14 inches and charity minimum 10 inches with encouragement to reach 12 inches are distinct institutional terms, not a universal threshold or one lot specification."
      evidence: "banbury-selling; banbury-ethical; lpt-donation-2025"
    - id: quality_numbers
      applies_to: "all inventory rows"
      requirement: "Use collection where no defensible general range exists; do not supply yields, energy/water use, regain or wig lifetimes. Sources provide qualitative conditions rather than this lot measurements."
      evidence: "cp_hair; cp_exchange; cp_pack"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify each UUID, actual provider, packaging material and treatment route; unresolved identities do not establish a completed database match."
      evidence: "verifiable original data and supplier records"
validation_rules:
  - rule_id: validate_scope
    applies_to: "intake"
    rule: "Verify actual unworked incoming history; 38972 prepared hair/articles and donation data substituted for purchased-lot evidence fail applicability."
    source_ids:
      - un-cpc-3-2025
      - lpt-donation-2025
  - rule_id: validate_reference
    applies_to: "reference_product"
    rule: "Link the unique product output reference_product at 1 kg; Q must be positive and include only first-accepted physical hair, excluding rejects and packaging."
    source_ids: []
  - rule_id: validate_completeness
