system_boundary:
  rules:
    - rule_id: boundary_unworked
      applies_to: "intake"
      rule: "Allow receiving inspection, weighing and securing preserved root direction only. Washing alone does not exclude 38971, but no receiver rewash is presumed here. Exclude subsequent dressing, thinning, turning mixed-root hair, bleaching, dyeing, pattern matching, wefting and wig making."
      source_ids:
        - un-cpc-3-2025
        - banbury-ethical
    - rule_id: boundary_acceptance
      applies_to: "intake"
      rule: "Retain every arriving lot and disposition. Only physical hair meeting actual buyer specifications with documented release enters Q; posting or payment is not acceptance. Record rejected returns separately."
      source_ids:
        - banbury-selling
    - rule_id: boundary_upstream
      applies_to: "intake"
      rule: "Document actual supplier cleaning, drying, cutting and transport services and attributable burdens; do not model human growth, assign an entire personal haircut, or default upstream burdens to zero. Clean/dry instructions do not provide energy or water quantities."
      source_ids:
        - banbury-selling
        - lpt-donation-2025
    - rule_id: boundary_complete
      applies_to: "intake"
      rule: "A conditional flow is inapplicable only with evidence of physical absence; missing data or UUID never means zero. Add an atomic card for each actual additional substance, cleaner, water, drying carrier, waste and emission and reassess route applicability. Retain all burdens of failed lots and zero-output periods."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "intake"
      rule: "Apply the complete receipt/return ledger in boundary_packaging_interfaces separately to each band, envelope and container. Record physical quantities separately from burden inclusion; never omit first attached or loan receipts. Packaging does not enter Q, internal reuse creates no new purchase, and production burdens already inside the hair provider are not loaded again."
      source_ids: []
    - rule_id: boundary_origin_gate
      applies_to: "intake"
      rule: "Link first securing/cutting records to source acquisition/voluntary authorization and applicable compliance evidence, seller lot, preserved root direction, cleaning/drying/cutting/transport burdens and the first accepted raw-material release event. Hair already previously released by a buyer as equivalent accepted raw material cannot generate new Q through reinspection, resale, repacking or repeated stock receipt. Quarantine lots without demonstrated first-gate provenance outside Q; do not disclose personal identities."
      source_ids:
        - banbury-selling
        - banbury-ethical
    - rule_id: boundary_unreleased_carry
      applies_to: "intake"
      rule: "Carry unreleased cohorts across periods with net hair quantity, moisture state and itemized inherited upstream and incurred foreground exchange vectors into next-period opening stock. Do not discard burdens or enter Q early. Attribute carried and additional burdens on eventual first release; on return transfer inherited vectors under allocation_inherited_returns while retaining attributable actual failed services. Closing unresolved stock is not allocated as produced output."
      source_ids: []
    - rule_id: boundary_packaging_interfaces
      applies_to: "intake"
      rule: "For each article separately: opening empty/attached/borrowed stocks + new purchase receipts + first supplier-included receipts + first nonpurchase/loan receipts + genuine receipts of the same previously dispatched objects = closing stocks + accepted-hair dispatch + refused-hair returns + loan returns + other external dispatch + waste. Events are mutually exclusive and linked by object ID or evidenced lot correspondence; internal transfers cancel. At each interface record whether inherited burden is inside the hair provider, independently acquired or a loan service; load it once. Unknown material/ownership/burden interfaces remain unresolved, not zero-filled."
      source_ids: []
