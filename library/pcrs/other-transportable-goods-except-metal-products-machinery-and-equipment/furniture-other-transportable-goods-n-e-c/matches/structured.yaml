measurement_rules:
  - id: complete_retail_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use cp_release_mass to measure W, the complete intact retail-product mass of Q uniquely first-released boxes from the same declared lot scope. Never open a box to establish its contents. Separate transport-packaging tare using independently traceable packaging records; unresolved tare prevents conversion."
  - id: count_bridge
    applies_to: "box-count observations"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Box count Q is a companion observation, not the denominator. W is the sum of actual eligible cohort masses; W/Q is descriptive only for that scope. Never replace actual contents tally by marked count or derive W from a catalogue box count. No default per-box mass or count is supplied."
  - id: energy_meter
    applies_to: "electricity"
    required_property_ref:
      name: "Energy"
      uuid: "f6811440-ee37-11de-8a39-0800200c9a66"
    required_unit: "MJ"
    rule: "Keep meter kWh separate from the selected supplier flow’s native property. The verified Energy property points to Units of energy 93a60a57-a3c8-11da-a746-0800200c9a66; 1 kWh = 3.6 MJ. This is a unit conversion only, not evidence that the unresolved supplier flow uses net calorific value."
  - id: no_default_amount
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Row-specific measured property"
      uuid: ""
    required_unit: "as declared"
    rule: "Use the cohort-attributed amount per 1 kg reference flow. Keep gross physical ledgers, residual embodied environmental burden and new purchases/services as separate linked quantities; unknown is not zero and a physical return is not a new purchase."
  - id: later_service_basis
    applies_to: "released_custody and actual post-release packaging services"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Current W may be zero. Preserve all period raw service, utility and packaging quantities by original release cohort. Normalize a separately declared later-stage intensity only using independently verified positive W_original, the complete-retail mass first released for that original cohort, not current W or a fabricated replacement. Unknown original mass leaves intensity unresolved."
  - id: transport_units
    applies_to: "road_freight_pre; road_freight_post"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: "838aaa20-0117-11db-92e3-0800200c9a66"
    required_unit: "t*km"
    rule: "The verified property points to Units of mass*length 838aaa21-0117-11db-92e3-0800200c9a66, with t*km as reference; 1 kg*km = 0.001 t*km. This supports dimensional conversion only. Actual carrier flow, vehicle/load, route boundary, allocation and empty-running convention remain independently unresolved until documented."
