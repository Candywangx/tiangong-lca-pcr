product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.matches"
  classification_refs: "CPC 3.0 38998 Matches, accepted narrower scope for the complete household retail box under docs/adr/2026-11-22-accept-cpc-38998-original-filled-household-safety-match-box.md. HS 2022 3605 supplies the classification context."
  covered_products: "Original closed household safety-match retail box, including its functional factory box, with documented original-manufacturer first release."
  excluded_products: "Loose or opened matches; pocket/long/candle/premium-cylinder or promotional variants; matchbooks; empty boxes; separately supplied contents; already-released purchased goods as new production; lighters and their parts (38994/38995), demonstration models (38996), jewellery (38997), candles and other ignition articles (38999), and waste (section 39). Neighbour titles do not make every listed exclusion a separately adjudicated mapping."
  representative_product: "Solstickan Hushållsask household box category; actual SKU, presentation, date, lot and first release must be collected."
  production_route: "Opaque original manufacture, including contracted supply where actually documented, to one manufacturer first-release event; closed-product environmental accounting only."
  market_state: "Factory-filled, complete, closed, original unchanged retail box; individual seal not assumed; outer logistics packaging separate."
functional_unit:
  what: "Declared manufacturing-stage supply of complete original household retail boxes, not an ignition-performance functional unit."
  how_much: "1 kg of complete closed retail boxes at first release, including contents and functional inner/outer retail box; excluding multipack film, shipping carton and pallet."
  how_well: "Documented unchanged SKU/lot and manufacturer release acceptance; no performance equivalence, test procedure or new certification inferred."
  how_long_or_cycle: "One original first-release event per physical box; no service lifetime or reuse of the retail product is assumed."
  reference_flow_link: "reference_product_closed_box"
system_boundary:
  rules:
    - rule_id: b_original_gate
      applies_to: "factory_release"
      rule: "Q counts only the first eligible finished-release event of this original manufacturer’s cohort. Verify actual original manufacture and contracted-provider handover. Already-released purchased goods plus secondary boxing, relabelling or resale are outside production qualification."
      source_ids:
        - smi-environment-2021
    - rule_id: b_opaque_coverage
      applies_to: "factory_release"
      rule: "Keep provider production and internal product inputs opaque. Obtain verified aggregate LCI coverage and reconcile overlaps/exclusions; do not substitute an unsupported product factor or environmental zero. Check physical ordinary-packaging movements and actual metered utility use regardless of provider coverage. Add separate environmental burdens only for the attributable shares outside the verified provider boundary."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_two_ledgers
      applies_to: "factory_release; released_custody"
      rule: "Keep adjacent pre-release and released-product physical ledgers in the same count/mass perimeter. The identical Q/W transfer leaves the first and enters the second and cancels in consolidation. Opening released stock, external already-released receipts, genuine returns and later dispatches do not create Q. Retained samples still on site and registration changes are not fictitious movements."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_pack_pool
      applies_to: "carton; film; pallet"
      rule: "For each actually present packaging article keep opening/closing stock, purchases, first non-purchase external receipts (with goods, borrowed or freely transferred, whether supplier coverage is known or not), and genuine returns traced to the same article previously dispatched from this site. These receipt classes are mutually exclusive. Outward transfers, dispatch and waste are gross; internal reuse cancels. An off-site owned article is an outward movement, not simultaneous in-perimeter stock."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_embodied_burden
      applies_to: "all cohorts and article pools"
      rule: "For each original article, cohort and exchange close: opening carried burden + remaining previously incurred burden brought in externally + genuinely new burden = current attribution + closing carried burden + mutually exclusive external/other attribution. Retain inherited finished-product and packaging burden on true returns and first external receipts; never recharge the same manufacture, purchase, freight or service. Unknown supplier coverage remains a gap."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_nonoperational
      applies_to: "all processes"
      rule: "The gate is documentary and environmental. Do not open products or supply recipes, internal constituents, ignition materials, parameters, manufacture, testing or use steps. External reject/disposal cards represent only intact identified articles with documented authorised receiver; other actual damage/loss follows b_actual_anomalies. No disposal method is prescribed."
      source_ids:
        - smi-solstickan-family-2006
    - rule_id: b_zero_release_period
      applies_to: "released_custody; all article pools"
      rule: "A period with current W = 0 may still have real service electricity, freight, storage or added exterior packaging for previously released boxes. Preserve raw amounts by period, article and original release cohort, including physical stocks/movements and remaining/new burdens. Do not divide by current zero W, discard them, create Q or roll them into new manufacture. A later-stage cohort service intensity is available only when a positive measured W_original for that original release cohort is independently verified; otherwise keep raw records and an unresolved intensity."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_return_once
      applies_to: "all original articles and cohorts"
      rule: "Match each re-entry to its prior outward burden entry. Restore the verified remaining share exactly once: either reverse the matching outward attribution or record its return carry-in, never both. If a transferred share has already been netted/reversed, do not add it again. Previously fully attributed shares are not new procurement or manufacture."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_actual_anomalies
      applies_to: "pre-release, released and packaging ledgers"
      rule: "Documented breakage or loss that does not satisfy intact-article external handover is not D and is not an inferred emission. Keep its evidence in a separate anomaly/reclassification account, with original article, quantity/unit, location, status and burden responsibility; an on-site reclassification is paired within the perimeter. Report an unresolved residual when quantity, destination or remaining burden is not established. Never silently erase stock, force a balance, invent a waste identity or prescribe handling steps."
      source_ids:
        - ilcd-allocation-2010
boundary_abstraction:
  declared_starting_condition: "Original manufacturing cohort with no previous finished-product release, or a documented contracted original-provider transfer still before that release; internal production remains opaque."
  starting_condition_role: "First-release environmental accounting gate; upstream burden retained through compatible opaque provider inventory, not shifted to downstream repacking."
  product_classification_scope: "CPC 3.0 38998, narrower household-box state and gate; official leaf and HS correspondence are not manufacturing evidence."
  recursive_input_rule: "A same-category external input keeps its actual origin, release status and included environmental coverage. Already-released purchases/returns enter the post-release ledger with inherited burden; they never create Q. Opaque original manufacturing supply before release includes completed upstream coverage once."
  upstream_dataset_requirement: "Identify and pin the actual provider dataset, reference quantity, date, geography, site, technology and covered stages; reconcile original production, functional retail box, rejects, transport, utilities and provider exclusions without disclosing internal manufacture. An undifferentiated corporate footprint is insufficient."
  disclosure: "Disclose physical perimeter, original and contracted manufacturer responsibilities, title/custody, transfer and first-release evidence, reporting period, both stock ledgers, provider coverage, ordinary packaging pools and all unresolved quantities/identities. Off-site ownership is not on-site stock."
