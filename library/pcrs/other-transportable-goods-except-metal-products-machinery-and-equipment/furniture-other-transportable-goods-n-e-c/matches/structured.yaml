allocation_rules:
  - rule_id: a_direct
    applies_to: "all processes"
    rule: "Use direct cohort measurement and provider subdivision first. Distinguish original manufacturing from post-release storage/handling. Attribute dedicated inputs/losses to their actual cohort; do not shift unrelated products or old stock into W."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_residual
    applies_to: "shared environmental burdens"
    rule: "For genuinely inseparable residuals use documented determining physical causality; justify meter/time/mass drivers with actual records. Where no such relationship is established, require independent review of same-gate, same-condition economic values and sensitivity before adoption. No universal mass split, donation-receipt driver, blanket proxy or unreviewed factor."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_article_history
    applies_to: "product and packaging cohorts"
    rule: "Use the burden carry-forward identity b_embodied_burden independently for each article/cohort/exchange. Returnable articles retain remaining documented shares; newly borne freight/service is charged once even if the article was borrowed or received free. Obtain supplier coverage or retain the gap. Physical inward mass is not automatically new procurement burden."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_no_credit
    applies_to: "all outputs"
    rule: "The functional retail box is part of the reference product, not a co-product. Supplemental first-release transfers and outward packaging/product ledger movements have no second product credit. Waste treatment remains with its actual provider; no avoided virgin production or recycling credit is assumed."
    source_ids:
      - ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release_mass
      process_id: "factory_release"
      flow_role: "reference_product_closed_box"
      record_type: "release register and intact weighing"
      raw_fields: "SKU; form; lot; site; period; unique first-release event; Q; individual intact-box mass or direct whole-cohort mass; external transport tare; W; scale calibration; original-condition evidence; individual-seal evidence/status; sample stock status"
      collection_method: "Reconcile external SKU/lot labels and original manufacturer release records; weigh closed unchanged retail articles on a calibrated scale or use traceable intact-product mass records. No opening or operational testing. If outside packaging cannot be separated by verified records, leave W unresolved."
      unit: "kg; box"
      frequency: "each actual first-release lot"
      temporal_coverage: "same period and original-manufacturer cohort"
      site_scope: "declared original manufacturing/first-release perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original release register; scale certificate; intact-product mass records; packaging tare evidence; no duplicated event"
    - protocol_id: cp_provider
      process_id: "factory_release"
      flow_role: "opaque original manufacture"
      record_type: "provider environmental coverage"
      raw_fields: "provider ID/version/hash; SKU/lot/site/date; reference basis; first-release responsibility; original/contracted handover; included stages/exchanges; excluded burdens; transport and packaging coverage; review identity"
      collection_method: "Read only the provider environmental inventory and external handover/release evidence; reconcile total coverage and overlaps without internal manufacture disclosure. Corporate averages or a closed-box purchase invoice alone cannot establish original production coverage."
      unit: "provider reference basis"
      frequency: "each provider version and cohort"
      temporal_coverage: "matched environmental period"
      site_scope: "actual original/contracted manufacturer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Fixed provider evidence; independent methodological review; coverage matrix"
    - protocol_id: cp_pre_ledger
      process_id: "factory_release"
      flow_role: "pre_external_box_in; pre_external_box_out; pre_box_reject"
      record_type: "pre-release physical ledger"
      raw_fields: "opening/closing unreleased intact stock; internal original complete cohort additions F; first contracted external delivery I; genuine unreleased return R; mutually exclusive provider-return/external-transfer T; authorised intact reject D; Q/W; custody; event ID; sample location; cohort/remaining burden"
      collection_method: "Reconcile actual documentary movements, closed-article mass and counts. Match a return to the same previous external transfer; keep subcontractor release responsibility explicit. No hypothetical onsite manufacturing steps are collected."
      unit: "kg; box"
      frequency: "every actual movement and period close"
      temporal_coverage: "common start/end cut-off"
      site_scope: "same pre-release physical perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Movement documents; pre-release status; same-article genealogy; intact authorised handover"
    - protocol_id: cp_post_ledger
      process_id: "released_custody"
      flow_role: "released_external_first_in; released_true_return; released_dispatch; released_box_disposal"
      record_type: "released-product physical ledger"
      raw_fields: "opening/closing released stock; Q/W transferred from pre-ledger; first outside released receipt J and purchase/loan/free subtype; same-article true return R; actual outward dispatch/return/transfer S subtype; authorised disposal D; prior release event; old/current cohort; remaining/new burden"
      collection_method: "Reconcile closed-product count/mass and actual external handovers; disjoint receipt and exit classes. Preserve original first release on returns. Changes in registry state and still-on-site samples are not physical inward/outward flows."
      unit: "kg; box"
      frequency: "every actual movement and period close"
      temporal_coverage: "same period as pre-release ledger"
      site_scope: "same released-stock perimeter with adjacent Q/W gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original release and dispatch/return records; cohort burden carry-forward"
    - protocol_id: cp_pack_pool
      process_id: "factory_release"
      flow_role: "carton_in; carton_out; carton_waste; film_in; film_out; film_waste; pallet_in; pallet_out; pallet_waste"
      record_type: "one ledger per physical article type"
      raw_fields: "pre/post-release stage; material/form; article/cohort ID; opening/closing count and mass; purchase P; first non-purchase N with inbound/loan/free subtype even when supplier coverage unknown; genuine same-article return R; outward S; waste D; actual freight/service; owner/custody/location; provider coverage; remaining burden and prior allocations"
      collection_method: "Use actual packaging BOM, incoming/outgoing documents, calibrated mass records and pool genealogy. Verify PE for the film card; do not assume film from a photograph or treat it as a single-box seal. Register each additional actual material as a separate atomic row before adoption. No default turns or service life."
      unit: "kg; article"
      frequency: "each receipt/issue and stock close"
      temporal_coverage: "common site period"
      site_scope: "declared physical pool, not global ownership"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "BOM; purchase and non-purchase receipts; same-article return link; provider/freight coverage; stock and burden reconciliation"
    - protocol_id: cp_electricity
      process_id: "factory_release"
      flow_role: "electricity"
      record_type: "meter and supplier environmental record"
      raw_fields: "meter ID; start/end kWh; period; voltage; grid/geography; supplier identity and native property; provider inclusion/exclusion; measured attribution driver; uncertainty"
      collection_method: "Read environmental meter records, not operating settings. Reconcile billed and metered supply and allocate only the separately attributable uncovered increment. Retain kWh observation and MJ conversion separately; verify native supplier property before binding a flow UUID."
      unit: "kWh; MJ"
      frequency: "each meter interval and reporting period"
      temporal_coverage: "matched production-environment interval"
      site_scope: "actual meter and original manufacturing perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; bills; provider overlap matrix; attribution review"
    - protocol_id: cp_transport
      process_id: "factory_release_released_custody"
      flow_role: "road_freight_pre; road_freight_post"
      record_type: "actual road freight activity"
      raw_fields: "shipment/leg ID; pre/post-release stage; actual carrier and vehicle/load specification; original product or packaging article/cohort; measured transported tonnes; actual loaded distance; documented empty return if borne; supplier coverage; freight invoice/service responsibility; native transport property/unit"
      collection_method: "Use actual shipment mass and leg distance with carrier evidence; calculate tonne-kilometres only for that convention. Reconcile included supplier transport and actual separately borne services once; cost alone is not transport activity. Do not assume a vehicle, load factor, distance or empty return."
      unit: "t*km"
      frequency: "each actual shipment leg"
      temporal_coverage: "same declared stage/period/cohort"
      site_scope: "actual supplier and physical handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Carrier documents; masses/distances; stage and provider-coverage review"
    - protocol_id: cp_post_electricity
      process_id: "released_custody"
      flow_role: "post_release_electricity"
      record_type: "post-release meter record"
      raw_fields: "reporting period; current W including zero; meter/start/end kWh; measured service attribution; original release cohort; verified W_original or gap; supplier/native property; prior supplier coverage; raw MJ/kWh; carried and new burden"
      collection_method: "Read actual nonoperational service meter and supplier records; keep raw period quantities for old stock even without current manufacture. Only when a positive original cohort release mass is verified may a separate service intensity be expressed on the same 1 kg original reference basis; otherwise leave intensity unresolved. Do not divide by zero current W or attach it to new production."
      unit: "kWh; MJ"
      frequency: "actual service interval"
      temporal_coverage: "period and original cohort tagged independently"
      site_scope: "actual post-release stock-service perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter evidence; service attribution; original positive cohort mass; raw and normalized records kept distinct"
    - protocol_id: cp_anomaly
      process_id: "factory_release_released_custody"
      flow_role: "pre_box_reject; released_box_disposal; packaging pools"
      record_type: "anomaly and reclassification register"
      raw_fields: "actual event ID/date; original article/cohort; prior release/status; observed damaged/lost count/mass and uncertainty; actual location/custody; intact-handover test; source and receiving stock class; matched reclassification; residual; original remaining burden and reviewer decision"
      collection_method: "Use only actual stocktake, movement and documentary evidence; no handling, opening or treatment procedure. Distinguish intact external D from damaged on-site stock, documented loss, paired internal reclassification and unresolved discrepancy. Report known quantity without assigning an unverified waste identity, emission or zero burden. Do not fabricate an exception to close an equation."
      unit: "kg; box; article"
      frequency: "each actual anomaly and period close"
      temporal_coverage: "actual event and stock period"
      site_scope: "same physical product or packaging perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Stocktake/incident evidence; paired accounts; remaining burden; unresolved residual review"
  calculation_rules:
    - id: release_mass
      applies_to: "reference_product_closed_box"
      rule: "W = sum of eligible intact first-release cohort masses in kg; Q = count of their unique first-release boxes. W > 0 is required to construct a new first-release manufacturing intensity; W = 0 does not remove the duty to keep actual stocks and later-service raw records. Separate independently verified transport tare. No actual W or Q is prescribed."
      inputs:
        - cp_release_mass
      output: "W; Q"
      source_ids:
        - smi-environment-2021
    - id: normalize_cohort
      applies_to: "factory_release pre-release inventory rows"
      rule: "y_i = a_i / W, where a_i is the actual exchange amount attributed once to this original first-release cohort and W is its measured complete-retail mass. Keep other cohorts and supplementary gross movements separate; this division applies only to first-release manufacturing with positive W, never to post-release service in a zero-release period. A missing a_i or W is unresolved, not zero."
      inputs:
        - a_i
        - W
        - cp_provider
      output: "y_i per 1 kg reference flow"
      source_ids:
        - ilcd-allocation-2010
    - id: pre_balance
      applies_to: "factory_release"
      rule: "U0 + F + I + R = W + T + D + U1, in kg, with the same separately reconciled box-count identity using Q. U0/U1 are pre-release stock; F opaque internal original complete-article additions; I first external contracted unreleased delivery; R genuine unreleased return; T exclusive provider-return/transfer; D actual intact disposal. Track stock changes or documented mass discrepancies explicitly, not as manufactured Q."
      inputs:
        - cp_pre_ledger
        - cp_release_mass
      output: "pre-release ledger residual"
      source_ids:
        - ilcd-allocation-2010
    - id: post_balance
      applies_to: "released_custody"
      rule: "L0 + W + J + R = S + D + L1, in kg, with a separate identical count ledger. L0/L1 are released stock; J first external receipt of already-released goods; R genuine prior-site-dispatch return; S exclusive later shipment/provider-return/transfer; D actual intact disposal. W and Q are the same cross-ledger transfer and cancel on consolidation; no J, R, L0 or S creates Q."
      inputs:
        - cp_post_ledger
        - cp_release_mass
      output: "released ledger residual"
      source_ids:
        - ilcd-allocation-2010
    - id: pack_balance
      applies_to: "carton_in; film_in; pallet_in"
      rule: "K0 + P + N + R = S + D + K1, separately by packaging article, count and kg. P purchase, N first non-purchase external receipt and R true same-article return are exclusive; actual outward S and waste D are exclusive. Supplier coverage never controls physical inclusion. Internal reuse cancels and off-site owned articles are excluded from K1."
      inputs:
        - cp_pack_pool
      output: "article stock residual"
      source_ids:
        - ilcd-allocation-2010
    - id: burden_balance
      applies_to: "all cohorts and article pools"
      rule: "H0 + H_in_remaining + H_new = H_current + H1 + H_external_other. Each term is an environmental inventory vector with identical method and units. H_external_other consists of mutually exclusive destinations/other cohorts. Match every burden to original article/cohort/exchange and coverage; do not add prior fully attributed shares or duplicate purchase/freight/service. Missing origin shares block completeness."
      inputs:
        - cp_provider
        - cp_pre_ledger
        - cp_post_ledger
        - cp_pack_pool
      output: "burden residual by exchange"
      source_ids:
        - ilcd-allocation-2010
    - id: electricity_units
      applies_to: "electricity; post_release_electricity"
      rule: "E_MJ = 3.6 × E_kWh for the verified Energy/Units of energy support chain only; actual cohort allocation and provider-native property must be verified independently."
      inputs:
        - cp_electricity
        - cp_post_electricity
      output: "MJ; original kWh retained"
      source_ids:
        - ilcd-allocation-2010
    - id: freight_activity
      applies_to: "road_freight_pre; road_freight_post"
      rule: "A_tkm = sum of actual transported mass in tonnes × actual loaded distance in km by shipment leg; identify any separately borne empty-leg service from its actual provider convention without inventing a loaded tonne-kilometre. Keep pre/post-release assignments disjoint: before-release activity uses verified positive W; later service uses verified positive W_original only, and otherwise stays as raw period activity with unresolved intensity."
      inputs:
        - cp_transport
        - W
        - W_original
      output: "t*km per 1 kg reference flow"
      source_ids:
        - ilcd-allocation-2010
    - id: later_service_intensity
      applies_to: "released_custody; actual post-release packaging"
      rule: "Keep raw a_period,original for every actual period/cohort service even when current W = 0. Only if W_original > 0 is independently verified may z_service = a_period,original / W_original be expressed for the separate later stage. Otherwise z_service is unresolved. No new Q, manufacturing reference or current-zero division; retain original and new burden portions once."
      inputs:
        - cp_post_electricity
        - cp_post_ledger
        - cp_pack_pool
        - cp_transport
        - W_original
      output: "raw period amount; later service intensity or unresolved"
      source_ids:
        - ilcd-allocation-2010
    - id: actual_anomaly_reconciliation
      applies_to: "pre_balance; post_balance; pack_balance"
      rule: "The displayed movement equalities describe ordinary intact-article movements. Where an actual separately evidenced anomaly/reclassification exists, reconcile the signed documented account alongside those identities, paired to its actual stock class and burden account; do not relabel it D. A quantity/destination/burden not established remains an explicit unclosed residual. Retained damaged stock still exists in the perimeter; loss does not establish an emission or disposal process."
      inputs:
        - cp_anomaly
        - cp_pre_ledger
        - cp_post_ledger
        - cp_pack_pool
      output: "documented anomaly/reclassification and residual"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_original
      applies_to: "factory_release"
      requirement: "Original household-box identity, actual manufacturer and first release must be established separately from publicity or product-family evidence."
      evidence: "SKU/lot; external label; original release and contract/handover records"
    - id: dq_complete
      applies_to: "all processes"
      requirement: "Preserve actual uncertainty, coverage/exclusion decisions and stock/burden residuals; do not force balances with invented zeroes, losses or coefficients. Different physical and environmental units never share a false mass balance."
      evidence: "Closed-article weights; complete movement and provider-coverage ledgers; unresolved values"
    - id: dq_native
      applies_to: "all applicable rows"
      requirement: "Only select a native UUID after exact type/state/property/unit and supplier compatibility review. Historical support XML does not establish current data availability; actual selected-flow Chinese names must follow the same verified record."
      evidence: "Fixed direct-read identity and support chain; actual supplier/receiver specification"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference_product_closed_box"
    rule: "Verify actual original household-box SKU, unchanged closed state, manufacturer, date/lot and first-release evidence. Independent product-category evidence is not a measured lot or permission to treat a multipack as an individually sealed box."
    source_ids:
      - smi-solstickan-family-2006
      - solstickan-household-receipts
  - rule_id: v_quantity
    applies_to: "all inventory rows"
    rule: "For a new manufacturing intensity require positive W, Q, intact mass/tare evidence and the same denominator in every row and language. Raw zero-release periods and separate later services follow later_service_basis without inventing current manufacture. Do not use marked contents count, company average footprint or shipping-case count as a lot measurement. Unresolved conversion prevents a qualified dataset."
    source_ids:
      - smi-packaging-count-faq
      - smi-environment-2021
  - rule_id: v_coverage
    applies_to: "factory_release"
    rule: "Verify compatible opaque original-provider environmental coverage and no double counting with external utility/packaging additions. Missing original manufacturing burden, supplier handover or first release blocks qualification even when the box is physically documented."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_ledgers
    applies_to: "factory_release; released_custody"
    rule: "Close both physical ledgers with matching Q/W gate; account for actual pre-release returns/transfers, first outside already-released receipts, genuine returns and disposals with exclusive subtypes and matching cards/protocols. Retained samples and status-only changes do not create physical flows."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_pool_history
    applies_to: "all article/cohort pools"
    rule: "Close physical and historical environmental-burden identities independently; record every actual purchase, first non-purchase receipt and traceable true return. Count actual procurement, freight and service once even when supplier coverage is missing. Off-site ownership cannot be both issued and inside stock. Unknown remaining shares are pending review."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_atomic_identity
    applies_to: "all inventory rows"
    rule: "Each applicable row is one atomic exchange. Confirm native flow type, state, supplier route, property/unit and Chinese baseName before adopting any UUID. Fixed historical support rows establish Mass/kg, Energy/MJ/kWh and Goods transport/t*km/kg*km only, not present product identity, native net calorific value or current platform observation."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_no_defaults
    applies_to: "all processes"
    rule: "Do not invent actual amounts, UUIDs, quantitative ranges, site conclusions or applicability. A conditional absent flow needs evidence; an unknown flow remains unresolved. Add other actually identified ordinary packaging/utility exchanges as separate bilingual atomic cards before completion; do not silently omit them or expand into internal manufacturing."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_zero_release_service
    applies_to: "released_custody; all article pools"
    rule: "For a current-zero-release period retain actual raw service electricity, freight, packaging and stock records with period/original-cohort tags; do not normalize by W = 0 or erase them. Accept later-stage intensity only with independently verified positive W_original and separate attribution. Return burden already netted against an outward entry cannot be added a second time."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_anomaly
    applies_to: "all physical and burden ledgers"
    rule: "Any actual damage/loss outside intact D must have an evidenced anomaly/reclassification or explicit unclosed residual, never silent stock disappearance or inferred waste/emission. Keep the original remaining burden responsibility until evidenced attribution; no handling steps follow from this record."
    source_ids:
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after independent source and study qualification"
  downstream_use: "Original manufacturer first-release supply of the same complete household box; later logistics modelled separately with inherited burden"
  allowed_use: "Matched closed-product environmental accounting at the verified original production gate and actual SKU/lot/site/period"
  excluded_use: "Instructions for making, opening, testing or using matches; full-leaf coverage; performance equivalence; individual seal claims; repacking purchased released goods as new production; current lot/certification claims from historic photos, donation totals or corporate averages"
  required_metadata: "All required qualifiers; W/Q; two physical ledgers; each actual packaging pool; original and contracted provider pins/coverage; actual native exchanges and units; burden carry-forward and allocation; study method/geography/time"
  required_quality_disclosure: "Provider/identity gaps, unsupported lot continuity, scale/tare/count uncertainty, stock/burden residuals, conditional absence evidence and independent methodological/translation review state"
  update_trigger: "Change in SKU/form, original manufacturer, first-release gate, physical perimeter, packaging material/pool, provider coverage/native identity, allocation basis or evidence"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, explanatory notes, 30 June 2025, PDF p.198. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Frozen classification: 38998 Matches and adjacent subclasses; classification only, no production or quantitative evidence."
  - id: "unsd-cpc3-2026"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3 explanatory notes, 23 October 2026, CPC3!A1856:D1856. https://unsdsna.azure-api.net/files/pages/cpc/CPC_Ver3_Exp_Notes_2026-10-23_for_Website.xlsx"
    used_for: "Confirms 38998 and HS 2022 heading 3605; adjacent rows 1853–1857 bound exclusions. Does not change the frozen June classification denominator."
  - id: "smi-solstickan-family-2006"
    type: "literature"
    reference: "Swedish Match, Inside 3/2006, Swedish edition, p.8, labelled Solstickan product-family photograph. https://www.swedishmatch.com/globalassets/documents/inside-magazine/2006_inside3_sv.pdf#page=8"
    used_for: "Historical manufacturer evidence distinguishes Hushållsask from Bruksask, longer presentations and other articles. Photograph only: no present SKU/lot continuity, mass, item tally, individual seal or environmental input follows."
  - id: "solstickan-household-receipts"
    type: "literature"
    reference: "Stiftelsen Solstickan, Ören blir miljoner, Hushållsask line. https://www.stiftelsensolstickan.se/om-stiftelsen/oren-blir-miljoner"
    used_for: "Independent beneficiary identifies the commercial household box separately from other presentations and articles; monetary receipts are not environmental exchanges or factory first-release counts."
  - id: "smi-packaging-count-faq"
    type: "literature"
    reference: "Swedish Match Industries, FAQ, packaging-material and stated-quantity questions only. https://www.st-ab.se/about-us/faq"
    used_for: "Producer identifies recycled paperboard for inner/outer boxes and acknowledges count variation. Neither statement supplies a lot BOM, packaging mass or actual contents tally; other FAQ subjects are outside this method."
  - id: "smi-environment-2021"
    type: "literature"
    reference: "Swedish Match, Sustainability reporting 2021, printed p.57 (PDF p.24), production-unit footnote and environmental tables. https://www.swedishmatch.com/globalassets/documents/sustainability/sustainability-reporting-archive/2021_sustainability_swedish-match-annual-report_en.pdf"
    used_for: "Supports a match-box production accounting unit only. Product-family and cross-segment aggregates cannot populate the particular household-box LCI or its incremental footprint."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide—Detailed guidance, first edition March 2010, §§7.9.2–7.9.3, printed pp.255–265 (PDF pp.275–285). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Conditional allocation-required attributional accounting: subdivision, physical causality and residual same-gate economic values. Not a matchbox measurement, universal coefficient or claim of full ILCD/PEF conformity."
