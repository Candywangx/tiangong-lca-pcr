  unresolved_collection:
    - "Actual original Hushållsask SKU/presentation/date/lot, original manufacturer/contractor first release and handover, W/Q and transport tare are not supplied by public category evidence."
    - "Obtain compatible opaque original manufacturing environmental inventory and reconcile all covered/excluded upstream and site exchanges; no surrogate footprint or zero burden."
    - "Actual complete-retail and packaging BOM/mass, production and later-service meter data, physical ledgers, inherited remaining burden by article/cohort/exchange, true returns and mutually exclusive attribution require collection; no quantitative ranges are invented. Zero-release periods retain raw later-service quantities; positive W_original and actual anomaly/reclassification evidence remain required before related intensities or reconciliations are qualified."
    - "Individual-box seal is unverified and not required to infer closure; multipack wrapping is not seal evidence. Any actual packaging/utility not represented requires a separate atomic bilingual card before dataset completion."
