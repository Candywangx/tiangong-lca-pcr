      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_scope | attributional manufacturing | Use this allocation hierarchy only for attributional manufacturing scenarios requiring allocation; it is not a free choice between attributional and consequential modelling. Manufacturer process descriptions authorize no allocation factor. | ilcd-allocation-2010 |\n| a_hierarchy | attributional manufacturing | First separate dedicated activities and use actual or virtual subdivision. For each remaining exchange demonstrate its determining physical causality to real co-functions; different exchanges can require different causal bases. Only a genuinely residual common process uses contemporaneous market values at the same process gate and actual supplied state, with downstream transport/packing/processing removed where necessary. Document justification, uncertainty, sensitivity and conservation across all co-functions; never arbitrarily select mass/economic shares or a fixed ratio. | ilcd-allocation-2010 |\n| a_scrap | attributional manufacturing | Internal rework metal and returned client substrates are internal flows. Scrap sales alone do not establish a joint function, reduce physical waste, remove burdens or grant substitution credit. Record true waste ownership, treatment and the actual joint process before any justified multifunctionality attribution. No automatic avoided virgin metal or precious-metal credit is allowed. | ilcd-allocation-2010 |\n\n"
