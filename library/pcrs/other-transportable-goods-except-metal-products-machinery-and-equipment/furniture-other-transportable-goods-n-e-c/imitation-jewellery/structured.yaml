      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_terminal | finished | Require the unique complete-necklace reference row and net first-release Q; reject bare parts, precious-metal substrate, incomplete assembly or duplicate released FG. | zhefan-heart |\n| v_atomic | all flows | Every exchange has one physical identity, direction, property, unit, protocol and actual condition; actual unlisted flows must be added. No unidentified group or a zero conceals chemistry or losses. | zhefan-heart; zhefan-qc |\n| v_balance | all physical gates | Check manufacture, provider custody, FG/service and consolidated gates, packaging pools and relevant element/species evidence independently. Preserve full gross physical legs apart from burden vectors and avoid whole/component overlaps. | ilcd-allocation-2010 |\n| v_quantity | all results | Raw protocols never divide; single_quotient runs once after real unit conversion and attribution. Q0 or unknown denominator gives no unit result; H is never a second divisor. | ilcd-allocation-2010 |\n| v_uncertainty | dataset | Record incomplete provider chemistry, unresolved UUIDs and measurement uncertainty as limitations. Ordinary auxiliary/provider gaps do not by themselves invalidate the evidenced terminal, but a real missing complete-product or manufacturing basis prevents a claim of usable complete methodology. Engineering checks do not approve scientific choices or translation. | zhefan-heart; ilcd-allocation-2010 |\n\n"
