  calculation_rules:
    - id: raw_conversion
      applies_to: "all raw records"
      rule: "Convert each original total to its actual extensive unit before attribution. Integrate a genuine measured rate over its recorded interval once; never multiply an already accumulated gas/liquid volume by time. Use independent substance-specific measured density and state for volume-to-mass. Electricity kWh times 3.6 gives MJ once."
      inputs:
        - "raw totals"
        - "raw units"
        - state
        - density
        - intervals
      output: "converted raw totals"
      source_ids:
        - ilcd-allocation-2010
    - id: stock_vectors
      applies_to: "manufacturing burden dimensions"
      rule: "U_j = U_direct_j + B_open_store_j + R_store_j - B_close_store_j for disjoint non-WIP stock partitions. U_direct is directly consumed expenditure or already consumption-net data; R_store contains only receipts into the unused stock partition. Never put a receipt in both. A_j = B_open_WIP_j + U_j - B_close_WIP_j - T_other_j, where T_other is an evidenced transfer to a genuine other cohort/function, not waste sale alone. Closing FG is not subtracted. Apply exchange-specific allocation only to the actual residual shared burden and preserve all failure loads."
      inputs:
        - "disjoint stock vectors"
        - "actual consumption status"
        - "cohort transfers"
        - "allocation evidence"
      output: "manufacturing numerator A_j"
      source_ids:
        - ilcd-allocation-2010
    - id: service_vectors
      applies_to: "original-cohort service burden dimensions"
      rule: "A_cj carries actual performed service plus true incremental F and attributable asset use for original cohort Qc during observed H, preserving historical vectors and evidenced original-dispatch reversal D_rev. Transfer only unused/unassigned charge or service once. H is an observation horizon and is never another divisor. New repair parts/water stay in F even when retained in closing stock; reinspection creates no output."
      inputs:
        - Qc
        - H
        - "historical vectors"
        - F
        - "actual service"
        - D_rev
      output: "service numerator A_cj"
      source_ids:
        - ilcd-allocation-2010
    - id: gross_legs
      applies_to: "all gross physical rows"
      rule: "V is the full measured event amount before allocation, stock consumption correction or burden transfer. X removes only an identified identical-content duplicate in OTHER on the same side. One whole-wet account or a non-additive constituent bridge is used. Each real outlet has one provider; mixed-waste origin-W subaccounts do not add another outlet."
      inputs:
        - "raw gross V"
        - "event direction"
        - "original ownership"
        - "same-side duplicate evidence"
      output: "full physical numerator V"
      source_ids:
        - ilcd-allocation-2010
    - id: single_quotient
      applies_to: "all normalized results"
      rule: "normalized_exchange = A / D once. Manufacturing uses A_j and Q; performed original-cohort service uses A_cj and Qc; gross physical disclosure uses full V and its genuine Q or original Qc. These are non-additive dimensions. Q is first-release net kg and includes released closing FG. If D is zero or unknown retain raw quantities and burden without a unit result. Save this single result; every card and aggregation retrieves it without another division."
      inputs:
        - A
        - D
        - dimension
        - "original cohort"
        - "numerator evidence"
      output: "normalized_exchange"
      source_ids:
        - ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_terminal
      applies_to: "finished"
      requirement: "Verify the actual complete non-precious-base necklace BOM and release; no silent alloy, chain, plating or SKU substitution."
      evidence: "approved BOM and component lots; master sample; release record"
    - id: dq_partner
      applies_to: "surface_treatment"
      requirement: "Obtain real partner layer stack, chemistry inventory, component custody and returned mass; mark missing provider data explicitly."
      evidence: "provider route and batch inventory; sent/returned weights; layer assay"
    - id: dq_complete
      applies_to: "all events"
      requirement: "Keep failures, zero output, cleaning, idle, rework, physical stocks and inherited vectors; unknown is neither zero nor passed."
      evidence: "full meters and operating logs; stock histories; disposition"
    - id: dq_units
      applies_to: "all quantities"
      requirement: "Preserve raw units, independent state/density, original Qc and unique single quotient; no catalogue weight or emission default."
      evidence: "calibration; measurement uncertainty; raw-to-result lineage"
    - id: dq_native
      applies_to: "UUID-bearing rows"
      requirement: "Apply the complete native identity and provider conditions preserved in the card description; a UUID does not prove upstream coverage."
      evidence: "flow identity; actual supply state and provider inventory"
validation_rules:
  - rule_id: v_terminal
    applies_to: "finished"
    rule: "Require the unique complete-necklace reference row and net first-release Q; reject bare parts, precious-metal substrate, incomplete assembly or duplicate released FG."
    source_ids:
      - zhefan-heart
  - rule_id: v_atomic
    applies_to: "all flows"
    rule: "Every exchange has one physical identity, direction, property, unit, protocol and actual condition; actual unlisted flows must be added. No unidentified group or a zero conceals chemistry or losses."
    source_ids:
      - zhefan-heart
      - zhefan-qc
  - rule_id: v_balance
    applies_to: "all physical gates"
    rule: "Check manufacture, provider custody, FG/service and consolidated gates, packaging pools and relevant element/species evidence independently. Preserve full gross physical legs apart from burden vectors and avoid whole/component overlaps."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_quantity
    applies_to: "all results"
    rule: "Raw protocols never divide; single_quotient runs once after real unit conversion and attribution. Q0 or unknown denominator gives no unit result; H is never a second divisor."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: v_uncertainty
    applies_to: "dataset"
    rule: "Record incomplete provider chemistry, unresolved UUIDs and measurement uncertainty as limitations. Ordinary auxiliary/provider gaps do not by themselves invalidate the evidenced terminal, but a real missing complete-product or manufacturing basis prevents a claim of usable complete methodology. Engineering checks do not approve scientific choices or translation."
    source_ids:
      - zhefan-heart
      - ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual compatible complete necklace manufacturing dataset after independent review of its upstream coverage"
  allowed_use: "Declared complete non-precious-base plated brass necklace configuration and supply route only"
  excluded_use: "Exclude precious-metal-base or precious-metal-clad jewellery, vermeil on silver, loose chains/pendants as the reference output, uncompleted castings, toy ornaments, stone-set variants, other base-metal routes, retail repacking of bought finished necklaces and repair sold as new manufacture. Decorative electrodeposited gold over brass does not make the brass substrate precious-metal jewellery. Actual operations outside the selected route remain in physical/burden records and require additional evidence before an expanded dataset is claimed complete. Post-release storage, packaging, dispatch, returns and incremental repair are retained as original-cohort service over observed H; neither dispatch nor reinspection creates new product output. Use and consumer end of life are outside the manufacturing terminal."
  required_metadata: "manufacturer model and approved revision; complete layered brass heart plus supplied O-link chain; each heart layer and actual mobility configuration; chain clasp jump ring bail extender tag and solder separately specified; actual alloy grade and supplied shape for each component; disjoint make-or-buy BOM and included subcomponents; 18K gold decorative plating with actual underlayers and coating chemistry; engraving method sequence and exposed base-metal condition; surface treatment provider site and transported custody; raw material to casting upstream inventory coverage; whole-necklace connection clasp movement and finish acceptance; calibrated complete net mass and actual packaging tare; unique first-release cohort Q including released closing FG; failed sample startup idle cleanup and rework events; opening and closing raw/WIP physical stocks and inherited vectors; historical FG original cohort Qc returns and dispatch reversals; each packaging pool and gross external leg; actual utility voltage geography state and provider; species phase medium origin and independent measurements; exchange-specific attribution and unresolved data"
  required_quality_disclosure: "Actual provider coverage and gaps; measurement uncertainty; scope and cohort; residual allocation; unresolved identities; no fabricated quantities or approval"
  update_trigger: "Changed alloy/component/chain/clasp, coating provider/stack, engraving, manufacture-versus-buy boundary, release plan or inventory period"
data_sources:
  - id: "zhefan-heart"
    type: "literature"
    reference: "Zhefan, Engraved Layer Chain Heart Necklace - Brass, JWP0940A. https://www.zhefanjewelry.com/product/engraved-layer-chain-heart-necklace-brass/"
    used_for: "Complete brass-heart/O-chain/18K plated product anchor; component-material limitations, engraving sequence, assembly inspection and changes; not a measured batch recipe."
  - id: "zhefan-qc"
    type: "literature"
    reference: "Zhefan, Quality Control, manufacturing and inspection, brass electroplating branches. https://www.zhefanjewelry.com/quality-control/"
    used_for: "Cast-base polishing/inspection, external plating responsibility and differing layer-stack counterexamples; no marketing thickness/life/test thresholds or same-order chemistry assumed."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for LCA — Detailed guidance, first edition March 2010, sections 7.9.2–7.9.3, printed pp.255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Subdivision, exchange-specific determining physical causality and residual common-process same-gate/state market value in applicable attributional scenarios; full inventory/gross/cohort accounting is this method’s explicit collection operationalization, not a claim that the handbook supplies each equation."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:6aa9e326b827761860e49a48728bb05de9d732ccc620f5080482b1b49dee86f6"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_9481"
      family: "system_boundary"
      span:
        start:
          offset: 9481
          line: 65
          column: 1
        end:
          offset: 19391
          line: 92
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Received cut-off unplated brass heart castings and actual separately supplied O-link chain/findings; forming and material history retained |\n| starting_condition_role | foreground_finishing_and_assembly |\n| product_classification_scope | Narrow complete plated brass-necklace subset within retained CPC38997 identity; not the whole leaf |\n| recursive_input_rule | A finished necklace is not raw input for its own new manufacture. Cancel internal transfers; returned original-cohort products create no new Q |\n| upstream_dataset_requirement | Real material/form/casting/chain/joining and external coating inventories with exactly one provider per supplied object/service; identity alone is not inventory |\n| disclosure | manufacturer model and approved revision; complete layered brass heart plus supplied O-link chain; each heart layer and actual mobility configuration; chain clasp jump ring bail extender tag and solder separately specified; actual alloy grade and supplied shape for each component; disjoint make-or-buy BOM and included subcomponents; 18K gold decorative plating with actual underlayers and coating chemistry; engraving method sequence and exposed base-metal condition; surface treatment provider site and transported custody; raw material to casting upstream inventory coverage; whole-necklace connection clasp movement and finish acceptance; calibrated complete net mass and actual packaging tare; unique first-release cohort Q including released closing FG; failed sample startup idle cleanup and rework events; opening and closing raw/WIP physical stocks and inherited vectors; historical FG original cohort Qc returns and dispatch reversals; each packaging pool and gross external leg; actual utility voltage geography state and provider; species phase medium origin and independent measurements; exchange-specific attribution and unresolved data |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_supply | manufacture | Receive each cast heart layer and each supplied chain/clasp/finding once. Composition, retained water and already supplied coatings are subaccounts, not extra purchases. A bought assembled module replaces its included component cards. Upstream casting, metal forming, joining and supplier surface preparation must be linked with their real material/route/provider inventory and transport; do not silently replace this with virgin metal alone. In-house casting/stamping/soldering or supplier work are assigned only where actually performed. | zhefan-heart; zhefan-qc |\n| b_partner | surface_treatment | Record client-owned components sent to and returned from the named plating provider as gross physical custody transfers. The single purchased surface-treatment service excludes purchasing the client substrate again; its provider dataset carries actual cleaning, individual salts or whole bath concentrates, anodes, each deposited metal, protective formulation, rinse water, energy, emissions, sludge and bath disposal. Do not duplicate those provider exchanges at the receiving plant. If the provider is explicitly expanded into the foreground, replace the service inventory with its actual atomic exchanges and cancel internal transfers. Retain coating mass added, substrate loss, treatment rejects and retained fluid in a non-additive composition bridge; surface area is no proof of deposition mass, thickness or density. | zhefan-heart; zhefan-qc |\n| b_complete_gate | finished | Q is measured net kg of complete necklaces uniquely first quality-released: all approved heart layers, chain, working clasp and actual integral findings/coating together, excluding packaging. Use calibrated whole-article weighing and measured tare; counts reconcile against actual configuration masses, not a fixed kg/item. First-released closing FG is already in Q and is never added a second time or subtracted as WIP. Assembly completeness, ring closure, joint integrity, clasp operation, layer movement, engraving and surface acceptance must pass the actual release plan without invented thresholds. | zhefan-heart |\n| b_actual_flows | all operations | Retain failed batches, destructive samples, unapproved work, start/stop, idle, cleaning, rejects and all actual rework. No eligibility or permission gate erases a real flow. Add every actual unlisted material, formulation, individual acid/alkali/metal salt, gas, fuel, heat carrier, packaging article, replaced asset, waste and measured species as its own card. Whole bought formulations are purchased once; assay, active ingredient and carrier water are non-additive subaccounts. Actual onsite mixing buys individual ingredients and retains mixing energy and losses. An absent UUID or unknown recipe is never zero. | zhefan-heart; zhefan-qc |\n| b_stocks | manufacture | Keep disjoint raw/auxiliary stores, component stores and opening/closing WIP physical quantities and inherited exchange vectors for every vintage. Correct unused non-WIP stock once, then add opening WIP burdens and carry forward only evidenced closing WIP burdens. Do not repeat a stock correction on consumption-net records. Retain failures/waste/test/rework burdens; only evidenced transfer to another real cohort or function changes attribution. Closing released FG never reduces manufacturing output or numerator. | ilcd-allocation-2010 |\n| b_service | service | Keep actual storage, packing, handling, gross dispatch/returns and incremental work in the original first-release cohort Qc over observed H. Opening/closing FG and repair WIP carry historical physical stocks and burden vectors. Reverse the original dispatch assignment only from its real record; present return mass can differ. Fresh replacement parts, cleaning water and rework are new inputs even when retained in closing stock. Transfer an unused part or unused service only once; already performed service is not subtracted because the product remains in FG. Reinspection and repair create no new Q. | ilcd-allocation-2010 |\n| b_gross | gross physical views | Each physical event keeps full gross V before economic allocation, burden attribution or stock corrections. Manufacturing burden A_j and service burden A_cj are separate non-additive views; never use them in place of physical V. Give each real exchange one provider/treatment owner. X_in and X_out remove only a separately recorded OTHER same-side duplicate of the identical physical content; no deduction for new F, new repair water, closing stock or an opposite-side transfer. | ilcd-allocation-2010 |\n| b_water_species | all physical gates | Choose a whole wet-material account or an explicitly non-additive component bridge. Distinguish free liquid water, vapour, coating solvent, hydration/structural water and actual reaction water; no default reaction is inferred for assembly. Total Cu/Zn/Au, total cyanide, COD, TOC or VOC indicators are not particular molecular emissions. Keep species, phase, medium, origin and gross versus net separate. Independently measured total mass and relevant element closure cannot establish speciation or solve two unknowns with one residual. | ilcd-allocation-2010 |\n| b_pack_pool | packaging | For each individual carton, display card, pouch and bag, and every added actual package: opening empty + opening attached WIP/FG + opening reusable + purchases P + other disjoint inward I + external return received ER = closing empty + closing attached WIP/FG + closing reusable + gross physical shipment S + external outward return EO + waste W. Internal reuse cancels. P and I cannot count the same incoming article. Attached packaging returned with jewellery is ER. Packaging stays outside necklace Q; it is neither a second purchase nor an automatic coproduct. Mixed waste uses one actual total outlet/provider with non-additive measured origin-W subaccounts. | ilcd-allocation-2010 |\n| b_physical_gates | manufacture; service; combined | Receiving-manufacturer physical gate: opening raw/component/WIP + actual disjoint external material receipts + full custody returns from the plating provider + disjoint moisture uptake = first-release Q + closing raw/component/WIP + full custody sent to the provider + actual local waste/loss/material returns. Do not also add coating mass at this receiving gate because it is already in full custody returns. Provider physical gate: opening client custody + sent components + actual added coating/process materials = closing client custody + returned components + actual provider wastes/losses and other physical outputs. Provider streams retain their real species and wet-material accounting. FG/service gate: opening FG + first release + actual returned jewellery + genuinely new issued repair inputs + opening repair WIP = closing FG + gross dispatch + discarded jewellery + removed components/losses + closing repair WIP; reconcile unused repair stores separately. In the combined gate cancel internal first-release and sent/returned custody transfers, retaining provider inputs/wastes and location-specific closing custody once. Assets and packaging have separate physical ledgers. | ilcd-allocation-2010 |\n| b_energy | utilities | Meter real electrical energy once; kWh converts to MJ with factor 3.6. Electricity supply must match actual geography, voltage and period; a supply name alone establishes no provider inventory. No boiler/steam/combustion is presumed. Where heat is actually purchased, add the specific carrier input and real condensate/heat-exchange-water Product return with measured mass, phase, temperature/pressure and enthalpy, and the supplier water/energy convention; energy and carrier accounting must not duplicate the same heat. Asset acquisition/replacement/retirement masses remain gross while current asset-use burdens follow actual service. | ilcd-allocation-2010 |\n\n"
