allocation_rules:
  - rule_id: a_scope
    applies_to: "attributional manufacturing"
    rule: "Use this allocation hierarchy only for attributional manufacturing scenarios requiring allocation; it is not a free choice between attributional and consequential modelling. Manufacturer process descriptions authorize no allocation factor."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_hierarchy
    applies_to: "attributional manufacturing"
    rule: "First separate dedicated activities and use actual or virtual subdivision. For each remaining exchange demonstrate its determining physical causality to real co-functions; different exchanges can require different causal bases. Only a genuinely residual common process uses contemporaneous market values at the same process gate and actual supplied state, with downstream transport/packing/processing removed where necessary. Document justification, uncertainty, sensitivity and conservation across all co-functions; never arbitrarily select mass/economic shares or a fixed ratio."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: a_scrap
    applies_to: "attributional manufacturing"
    rule: "Internal rework metal and returned client substrates are internal flows. Scrap sales alone do not establish a joint function, reduce physical waste, remove burdens or grant substitution credit. Record true waste ownership, treatment and the actual joint process before any justified multifunctionality attribution. No automatic avoided virgin metal or precious-metal credit is allowed."
    source_ids:
      - ilcd-allocation-2010
