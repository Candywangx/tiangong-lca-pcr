product_category_identity:
  canonical_pcr_id: "pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.furniture-other-transportable-goods-n-e-c.imitation-jewellery"
  classification_refs: "CPC3.0:38997; narrower"
  covered_products: "This methodology covers a complete non-precious-base-metal necklace with a cast brass layered heart pendant and its supplied O-link chain, connected and clasped as one wearable article. The product anchor is Zhefan JWP0940A in its 18K gold-plated brass option. It is a complete necklace, not a pendant sold alone, a bare casting or a jewellery-making component. The narrow foreground receives cut-off unplated brass heart castings and separately supplied chain/findings, performs dimensional correction, polishing, approved engraving and connection/assembly, obtains decorative surface treatment from the actual external plating provider, and inspects the whole necklace before first quality release. Ordering of engraving, plating and assembly follows the approved project, not a universal sequence. Casting and metal production are carried upstream with each supplied casting; this selected receiving route does not assert an onsite foundry."
  excluded_products: "Exclude precious-metal-base or precious-metal-clad jewellery, vermeil on silver, loose chains/pendants as the reference output, uncompleted castings, toy ornaments, stone-set variants, other base-metal routes, retail repacking of bought finished necklaces and repair sold as new manufacture. Decorative electrodeposited gold over brass does not make the brass substrate precious-metal jewellery. Actual operations outside the selected route remain in physical/burden records and require additional evidence before an expanded dataset is claimed complete. Post-release storage, packaging, dispatch, returns and incremental repair are retained as original-cohort service over observed H; neither dispatch nor reinspection creates new product output. Use and consumer end of life are outside the manufacturing terminal."
  representative_product: "JWP0940A brass layered heart necklace with O-link chain and 18K gold plating; actual approved component configuration"
  production_route: "Received cut-off cast brass layers and chain/findings → actual correction/polishing/engraving → external surface treatment → complete connection/assembly/inspection → unique first release"
  market_state: "New manufactured complete wearable base-metal necklace; packaging outside net product mass"
functional_unit:
  what: "Manufacture the defined complete plated brass heart necklace"
  how_much: "1 kg net complete first-released reference flow"
  how_well: "Actual complete approved configuration with connection/clasp/movement/engraving/surface acceptance; equal mass is not equal appearance or wear service"
  how_long_or_cycle: "One manufacturing first-release cycle; observed H only for actual original-cohort service; no prescribed life"
  reference_flow_link: "finished"
system_boundary:
  rules:
    - rule_id: b_supply
      applies_to: "manufacture"
      rule: "Receive each cast heart layer and each supplied chain/clasp/finding once. Composition, retained water and already supplied coatings are subaccounts, not extra purchases. A bought assembled module replaces its included component cards. Upstream casting, metal forming, joining and supplier surface preparation must be linked with their real material/route/provider inventory and transport; do not silently replace this with virgin metal alone. In-house casting/stamping/soldering or supplier work are assigned only where actually performed."
      source_ids:
        - zhefan-heart
        - zhefan-qc
    - rule_id: b_partner
      applies_to: "surface_treatment"
      rule: "Record client-owned components sent to and returned from the named plating provider as gross physical custody transfers. The single purchased surface-treatment service excludes purchasing the client substrate again; its provider dataset carries actual cleaning, individual salts or whole bath concentrates, anodes, each deposited metal, protective formulation, rinse water, energy, emissions, sludge and bath disposal. Do not duplicate those provider exchanges at the receiving plant. If the provider is explicitly expanded into the foreground, replace the service inventory with its actual atomic exchanges and cancel internal transfers. Retain coating mass added, substrate loss, treatment rejects and retained fluid in a non-additive composition bridge; surface area is no proof of deposition mass, thickness or density."
      source_ids:
        - zhefan-heart
        - zhefan-qc
    - rule_id: b_complete_gate
      applies_to: "finished"
      rule: "Q is measured net kg of complete necklaces uniquely first quality-released: all approved heart layers, chain, working clasp and actual integral findings/coating together, excluding packaging. Use calibrated whole-article weighing and measured tare; counts reconcile against actual configuration masses, not a fixed kg/item. First-released closing FG is already in Q and is never added a second time or subtracted as WIP. Assembly completeness, ring closure, joint integrity, clasp operation, layer movement, engraving and surface acceptance must pass the actual release plan without invented thresholds."
      source_ids:
        - zhefan-heart
    - rule_id: b_actual_flows
      applies_to: "all operations"
      rule: "Retain failed batches, destructive samples, unapproved work, start/stop, idle, cleaning, rejects and all actual rework. No eligibility or permission gate erases a real flow. Add every actual unlisted material, formulation, individual acid/alkali/metal salt, gas, fuel, heat carrier, packaging article, replaced asset, waste and measured species as its own card. Whole bought formulations are purchased once; assay, active ingredient and carrier water are non-additive subaccounts. Actual onsite mixing buys individual ingredients and retains mixing energy and losses. An absent UUID or unknown recipe is never zero."
      source_ids:
        - zhefan-heart
        - zhefan-qc
    - rule_id: b_stocks
      applies_to: "manufacture"
      rule: "Keep disjoint raw/auxiliary stores, component stores and opening/closing WIP physical quantities and inherited exchange vectors for every vintage. Correct unused non-WIP stock once, then add opening WIP burdens and carry forward only evidenced closing WIP burdens. Do not repeat a stock correction on consumption-net records. Retain failures/waste/test/rework burdens; only evidenced transfer to another real cohort or function changes attribution. Closing released FG never reduces manufacturing output or numerator."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_service
      applies_to: "service"
      rule: "Keep actual storage, packing, handling, gross dispatch/returns and incremental work in the original first-release cohort Qc over observed H. Opening/closing FG and repair WIP carry historical physical stocks and burden vectors. Reverse the original dispatch assignment only from its real record; present return mass can differ. Fresh replacement parts, cleaning water and rework are new inputs even when retained in closing stock. Transfer an unused part or unused service only once; already performed service is not subtracted because the product remains in FG. Reinspection and repair create no new Q."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_gross
      applies_to: "gross physical views"
      rule: "Each physical event keeps full gross V before economic allocation, burden attribution or stock corrections. Manufacturing burden A_j and service burden A_cj are separate non-additive views; never use them in place of physical V. Give each real exchange one provider/treatment owner. X_in and X_out remove only a separately recorded OTHER same-side duplicate of the identical physical content; no deduction for new F, new repair water, closing stock or an opposite-side transfer."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_water_species
      applies_to: "all physical gates"
      rule: "Choose a whole wet-material account or an explicitly non-additive component bridge. Distinguish free liquid water, vapour, coating solvent, hydration/structural water and actual reaction water; no default reaction is inferred for assembly. Total Cu/Zn/Au, total cyanide, COD, TOC or VOC indicators are not particular molecular emissions. Keep species, phase, medium, origin and gross versus net separate. Independently measured total mass and relevant element closure cannot establish speciation or solve two unknowns with one residual."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_pack_pool
      applies_to: "packaging"
      rule: "For each individual carton, display card, pouch and bag, and every added actual package: opening empty + opening attached WIP/FG + opening reusable + purchases P + other disjoint inward I + external return received ER = closing empty + closing attached WIP/FG + closing reusable + gross physical shipment S + external outward return EO + waste W. Internal reuse cancels. P and I cannot count the same incoming article. Attached packaging returned with jewellery is ER. Packaging stays outside necklace Q; it is neither a second purchase nor an automatic coproduct. Mixed waste uses one actual total outlet/provider with non-additive measured origin-W subaccounts."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_physical_gates
      applies_to: "manufacture; service; combined"
      rule: "Receiving-manufacturer physical gate: opening raw/component/WIP + actual disjoint external material receipts + full custody returns from the plating provider + disjoint moisture uptake = first-release Q + closing raw/component/WIP + full custody sent to the provider + actual local waste/loss/material returns. Do not also add coating mass at this receiving gate because it is already in full custody returns. Provider physical gate: opening client custody + sent components + actual added coating/process materials = closing client custody + returned components + actual provider wastes/losses and other physical outputs. Provider streams retain their real species and wet-material accounting. FG/service gate: opening FG + first release + actual returned jewellery + genuinely new issued repair inputs + opening repair WIP = closing FG + gross dispatch + discarded jewellery + removed components/losses + closing repair WIP; reconcile unused repair stores separately. In the combined gate cancel internal first-release and sent/returned custody transfers, retaining provider inputs/wastes and location-specific closing custody once. Assets and packaging have separate physical ledgers."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: b_energy
      applies_to: "utilities"
      rule: "Meter real electrical energy once; kWh converts to MJ with factor 3.6. Electricity supply must match actual geography, voltage and period; a supply name alone establishes no provider inventory. No boiler/steam/combustion is presumed. Where heat is actually purchased, add the specific carrier input and real condensate/heat-exchange-water Product return with measured mass, phase, temperature/pressure and enthalpy, and the supplier water/energy convention; energy and carrier accounting must not duplicate the same heat. Asset acquisition/replacement/retirement masses remain gross while current asset-use burdens follow actual service."
      source_ids:
        - ilcd-allocation-2010
