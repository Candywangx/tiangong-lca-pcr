  ordinary_gaps:
    - Actual full component BOM/alloy grades, component mass, batch quantities
      and release criteria remain foreground collection requirements.
    - External plating underlayers and protective formulation are not uniquely
      specified by the public pages; require actual partner inventory before
      quantitative completeness.
    - Source manufacturer method and product pages are related disclosures, not
      independent same-factory batch measurements.
    - Conditional cards do not assert actual use. Broaden same identity only
      with actual new route evidence; preserve actual out-of-scope operations.
    - No verified category-wide quantitative range is available; site-specific
      collection is mandatory. No provisional numerical guardrails were
      invented.
  native_identity_limits:
    - Only Mass and its kg unit-group binding are retained from public ILCD XML
      at TianGong-LCA-Data commit a55b302e1ca1bf190e4c412c74e046e2d54d32f6; this
      is archived support evidence, not a current platform reading.
    - No product, component, electricity or water UUID is asserted from
      historical prose. Actual supply geography, alloy grade, shape, utility
      state and provider remain required.
  uuid_rejections:
    - Historical generic brass bars/rods identity is not adopted for the
      received casting shape.
    - Historical product and utility UUID assertions are not carried forward
      without independent compatible direct-read evidence.
