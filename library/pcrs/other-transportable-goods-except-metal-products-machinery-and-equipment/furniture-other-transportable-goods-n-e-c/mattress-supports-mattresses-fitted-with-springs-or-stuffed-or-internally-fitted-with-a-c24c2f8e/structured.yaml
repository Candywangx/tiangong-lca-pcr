esive removability, lifetime, comfort, fire/durability threshold or certification. | `aj-foam-manufacturing`; `simalfa309-tds-sds-2022` |\n| validate_sources | all inventory rows | Disclose qualitative route/component synthesis and historical source limits; sources are not one site/SKU/order or numerical foreground inventory. ILCD is allocation evidence only within the applicable attributional context, not an industrial recipe or safety approval. Report science, translation, identity/provider and real-data gaps separately; machine checks do not accept mapping or methodology. | `magenta-mattress-prospectus-2024`; `aj-foam-manufacturing`; `simalfa309-tds-sds-2022`; `jrc-ilcd-allocation-2010` |\n\n"
