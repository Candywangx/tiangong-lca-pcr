system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all inventory rows"
      rule: "Collect purchased cured flexible PU blocks/sheets through real cutting/profiling, actual layer bonding/drying, complete cover cutting/quilting/sewing and fitting, whole-mattress tests and unique first release. Blocks are raw/intermediate feedstock; their verified upstream manufacture/logistics remains included. No finished mattress purchase substitutes this manufacture. Internal same-product transfers pair and cancel at consolidation without external procurement or another Q."
      source_ids:
        - magenta-mattress-prospectus-2024
        - aj-foam-manufacturing
    - rule_id: boundary_q
      applies_to: "all inventory rows"
      rule: "Q is newly first-released net whole-mattress mass in one actual configuration/cohort. Closing released FG is already in Q, neither an additional manufacturing output nor a deductible manufacturing burden stock. Carry closing raw/WIP and genuinely unused/unassigned non-WIP stores with complete inherited exchange vectors. Include failures, zero-output, startup/shutdown, idle, cleanup and rework. Q=0 retains all loads with no unit result."
      source_ids:
        - jrc-ilcd-allocation-2010
    - rule_id: boundary_service
      applies_to: "all inventory rows"
      rule: "Post-release storage/handling/compression/packing/gross shipment/return/retest/rework/disposal are actual original-cohort service packets with original Q_c and disclosed observation horizon. Performed service is not deducted for stored FG; only unused/unassigned service or charge carries forward. Redelivery/retest adds no Q. Manufacturer/spec permission, postwork tests, acceptance/disposition govern actual rework/continued qualification, not deletion of unauthorized or failed real work: retain all its material/energy/logistics and hold/waste route. Natural humidity exchange needs observation, not invented work permission. Original-cohort Q_c is fixed by the unique first release; H is the observed horizon only, never another divisor. Keep all actually performed service and every unauthorized/failed event even while FG is held; permission/tests govern qualification and disposition, never whether occurred facts are recorded. Close the actual FG custody gate as O_FG+T_new+R_ext+F_in-X_in=C_FG+G_ext+W_actual+F_out-X_out. T_new is the matched internal first-release handoff already counted in Q; it cancels on consolidation, not a second manufacture or external purchase. Actual external R/G retain their independently measured gross current-condition mass, original cohort and prior dispatch link. F is real added/removed matter/water, not a fitted residual; X only same-side OTHER duplicate flow terms. Unknown damaged/rejected/altered reusable-Product versus Waste status remains a collection gap, not forced qualification or restoration. All actual unauthorized/failed facts and performed services remain regardless of hold/acceptance."
      source_ids:
        - magenta-mattress-prospectus-2024
        - aj-foam-manufacturing
        - jrc-ilcd-allocation-2010
    - rule_id: boundary_whole
      applies_to: "all inventory rows"
      rule: "Buy each supplied whole adhesive/zipper/component once; assay/solids/water/component accounts are disjoint subledgers, not repeated purchases. No onsite PU foaming is included. Actual onsite mixing/reaction requires individually named bought materials, real energy/losses and independent species/reaction evidence before expanded-route use; no guessed polyol/isocyanate dose or process conditions."
      source_ids:
        - magenta-mattress-prospectus-2024
        - simalfa309-tds-sds-2022
    - rule_id: boundary_species
      applies_to: "all inventory rows"
      rule: "Close full physical gross mass and relevant C/H/O/N/Cl or other actual elements independently of real species and water evidence at manufacturing, FG-service and consolidated gates. Distinguish free, structural, reaction and phase-change water. Nonreactive waterborne glue drying is evaporation, not reaction water. Measure actual pore gas and carbon origin. VOC/COD/PM/total-isocyanate/total-carbon are metrics, not molecule identities; one residual cannot fit two unknowns. Add each real unlisted input/output as a named atomic exchange before completeness; unknown never means zero. These actual species/phase observations distinguish local free atmospheric Resource ingress from species already contained in a supplied foam block, whole adhesive, asset or gaseous Product. Contained pore gas/carrier water remains nonadditive whole-supply composition with that one upstream owner, never another free local Resource purchase. Actual separately purchased compressed air or another gas needs its own whole Product card, pressure/state/native-unit interface and one preparation/separation/compression provider before completion. Internal air handoffs cancel while every actual compressor/ventilation load and release remains. No standard air fraction, gas-assisted process, reaction, carbon origin, isotope, ion or liquid phase is inferred. Gross molecular transfer and true net environmental change are distinct."
      source_ids:
        - simalfa309-tds-sds-2022
        - jrc-ilcd-allocation-2010
    - rule_id: boundary_packaging
      applies_to: "all inventory rows"
      rule: "For every actual packaging pool close O+P+I+ER+F_in-X_in=C+S+EO+W+F_out-X_out, with disjoint full wet empty/attached-WIP/attached-FG/reusable stocks. F_in/F_out are independently measured real added/removed material or liquid/atmospheric water, never residuals or duplicate corrections. X subtracts only proved duplicate SAME-side OTHER actual flow terms with paired event IDs; never stocks, opposite-side flows, card presence, or true newly retained influx. Whole supplied wet article includes its original substrate/coating/liner/adhesive/hardware/water once. Separately supplied onsite components require disjoint receipts or a measured component-to-assembly bridge and paired internal handoffs cancelling on consolidation. Natural humidity uptake, desorption, evaporation or drainage requires no repair event or permission. One actual mixed outlet has one compatible whole-mixture Waste and one provider; independently measured per-origin W children conserve the total with uncertainty. Total OR partitions are nonadditive alternatives, not invented outlets or repeated provider charges. Product ER/EO cards apply only when actual continued reusable whole-article Product state is evidenced. Every actual Waste, damaged, rejected or unknown-state return remains in the independent full gross ledger with its real direction and requires its compatible state/type/identity before dataset completion; never force Product qualification, substitute an opposite-side leg, erase an occurred event or invent a return for symmetry."
      source_ids:
        - magenta-mattress-prospectus-2024
        - jrc-ilcd-allocation-2010
    - rule_id: boundary_assets
      applies_to: "all inventory rows"
      rule: "Separate full physical assets/spares/installed-fluid opening/receipts/closing/retirement and each new/old repair part from measured current service burden. No one whole machine per kg, fixed life or default wear. Keep each water phase and actual component added/lost; incoming supplier packaging has its six actual legs and one upstream owner. Only actual external Product returns/heat/steam carriers and real receiving thermal states are recorded, never duplicated provider wholes and their component masses. For each actual asset/tool/part/fluid pool close O+R_in+F_in-X_in=C+R_out+F_out-X_out in its reconciled physical unit. R_in/R_out are independently measured real external whole-article receipts/removals, including actual retirement or Waste; F are true measured additions/removals. X subtracts only paired proved duplicate SAME-side OTHER flow terms, never stocks, opposite flows or true newly retained influx. Whole supplied components/installed fluids/water belong once; disjoint onsite supplies or a measured component-to-assembly bridge with cancelling internal handoffs are required. Natural moisture needs no repair/permission, and no event is invented for symmetry. One actual mixed outlet and independently measured origin-W subaccounts are nonadditive total OR partitions with one provider."
      source_ids:
        - jrc-ilcd-allocation-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-allocation-2010
