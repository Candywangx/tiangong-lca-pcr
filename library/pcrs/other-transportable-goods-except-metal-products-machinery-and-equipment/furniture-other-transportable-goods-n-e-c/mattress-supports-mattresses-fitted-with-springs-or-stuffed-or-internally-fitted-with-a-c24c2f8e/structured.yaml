          line: 1835
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_context | attributable burden dimensions only; full physical gross V excluded | Use attributional partitioning only when the study decision context establishes its applicability. Identify true other functions/cohorts; no arbitrary physical/economic selection, automatic substitution credit or QFD product-use comparison. | `jrc-ilcd-allocation-2010` |\n| allocation_subdivide | attributable burden dimensions only; full physical gross V excluded | First assign dedicated materials/operations and independently collected exchanges directly. Apply actual or virtual subdivision to separate foam cutting, sewing, bonding, compression and storage services/configurations as records permit. Physical gross ledgers remain whole. | `jrc-ilcd-allocation-2010` |\n| allocation_causal | attributable burden dimensions only; full physical gross V excluded | For each remaining shared exchange establish determining physical causality, e.g. proven material embodiment, measured cut path/loading, sewing duty, actual compression or limiting storage space-time. Demonstrate actual condition and quantity relationship separately per exchange. Mass, pieces, foam volume or machine-hours is not a universal allocation key. | `jrc-ilcd-allocation-2010` |\n| allocation_residual | attributable burden dimensions only; full physical gross V excluded | Only real inseparable residual common process after direct/virtual subdivision and exchange-specific causality may use contemporaneous market value of genuine co-functions at the same actual common process gate/state. Exclude downstream finishing/packing/storage/transport value. Justify prior-step failure, quantities/prices/time and uncertainty; no fixed share, zero-price workaround or negative waste-fee credit. | `jrc-ilcd-allocation-2010` |\n| allocation_failures | attributable burden dimensions only; full physical gross V excluded | Ordinary failures, scraps, samples and their treatment remain with the manufacturing cohort even if sold or sent offsite. One burden-vector transfer requires a true independent other cohort/function and justified allocation/handover evidence; full physical gross always remains. No automatic T_other subtraction and no second deduction of stock-corrected consumption. | `jrc-ilcd-allocation-2010` |\n\n"
