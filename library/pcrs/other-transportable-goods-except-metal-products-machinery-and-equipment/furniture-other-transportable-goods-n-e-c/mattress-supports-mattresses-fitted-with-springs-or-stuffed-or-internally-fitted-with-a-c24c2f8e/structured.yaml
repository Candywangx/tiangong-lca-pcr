allocation_rules:
  - rule_id: allocation_context
    applies_to: "attributable burden dimensions only; full physical gross V excluded"
    rule: "Use attributional partitioning only when the study decision context establishes its applicability. Identify true other functions/cohorts; no arbitrary physical/economic selection, automatic substitution credit or QFD product-use comparison."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_subdivide
    applies_to: "attributable burden dimensions only; full physical gross V excluded"
    rule: "First assign dedicated materials/operations and independently collected exchanges directly. Apply actual or virtual subdivision to separate foam cutting, sewing, bonding, compression and storage services/configurations as records permit. Physical gross ledgers remain whole."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_causal
    applies_to: "attributable burden dimensions only; full physical gross V excluded"
    rule: "For each remaining shared exchange establish determining physical causality, e.g. proven material embodiment, measured cut path/loading, sewing duty, actual compression or limiting storage space-time. Demonstrate actual condition and quantity relationship separately per exchange. Mass, pieces, foam volume or machine-hours is not a universal allocation key."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "attributable burden dimensions only; full physical gross V excluded"
    rule: "Only real inseparable residual common process after direct/virtual subdivision and exchange-specific causality may use contemporaneous market value of genuine co-functions at the same actual common process gate/state. Exclude downstream finishing/packing/storage/transport value. Justify prior-step failure, quantities/prices/time and uncertainty; no fixed share, zero-price workaround or negative waste-fee credit."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_failures
    applies_to: "attributable burden dimensions only; full physical gross V excluded"
    rule: "Ordinary failures, scraps, samples and their treatment remain with the manufacturing cohort even if sold or sent offsite. One burden-vector transfer requires a true independent other cohort/function and justified allocation/handover evidence; full physical gross always remains. No automatic T_other subtraction and no second deduction of stock-corrected consumption."
    source_ids:
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_release"
      flow_role: "first-release mass and identity"
      record_type: "foreground_record"
      raw_fields: "serial; cohort; configuration; drawing; first-release event; calibrated net mass; moisture; tare; tests; hold; opening/closing FG"
      collection_method: "Weigh each complete accepted mattress on a calibrated scale excluding transport packaging; retain actual conditioning, net mass and configuration, specified acceptance and first-release record; audit duplicate serials and all failed samples. Q is summed newly first-released net mass by cohort; retain undivided raw release events"
      unit: "kg"
      frequency: "each event and complete period"
      temporal_coverage: "complete real production and original-cohort service horizon"
      site_scope: "actual factory/providers and linked operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/raw logs/lot records/independent tests/permission/disposition/gaps"
    - protocol_id: cp_material
      process_id: "p_core"
      flow_role: "material and inherited exchange burden"
      record_type: "foreground_record"
      raw_fields: "row; supplier; SKU; lot; whole received net mass; composition; moisture; opening; purchases; internal transfers; closing raw/WIP; inherited vectors; failures; waste destinations; actual_originating_process_id; actual_row_id; event_id; real_direction; physical_gate; manufacturing_cohort_Q_or_original_Q_c; observed_H_not_divisor"
      collection_method: "Weigh each whole supplied material/preparation/component separately, reconcile deliveries/stock/production and disjoint assay subledgers. Trace each foam/cover layer through real cutting, assembly, loss and failures; no bought-finished substitution. Retain undivided raw/burden numerators for the sole section8 result per reference flow; do not normalize here Shared-protocol scope is exactly p_core; p_cover; p_bond; p_release. The scalar process_id remains the template grouping locator only; every event keeps its actual originating process/row/direction/gate and manufacturing cohort Q or original service cohort Q_c with observed H. Do not reassign a manufacturing event to p_service, merge cohorts or change numerator/denominator because of the locator."
      unit: "kg"
      frequency: "each event and complete period"
      temporal_coverage: "complete real production and original-cohort service horizon"
      site_scope: "actual factory/providers and linked operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/raw logs/lot records/independent tests/permission/disposition/gaps"
    - protocol_id: cp_energy
      process_id: "p_service"
      flow_role: "native utilities and metered energy"
      record_type: "foreground_record"
      raw_fields: "row; meter; start; end; kWh; MJ; actual duty; idle; startup; failures; voltage; geography; supplier; loss boundary; service horizon; allocation evidence; actual_originating_process_id; actual_row_id; event_id; real_direction; physical_gate; manufacturing_cohort_Q_or_original_Q_c; observed_H_not_divisor"
      collection_method: "Calibrated meters or proven operation-specific duty cover complete real periods including compressor/ventilation/drying. Convert raw kWh to MJ once before attribution. Expanded heat/steam/fuel routes need individually named carriers with native property and mass/enthalpy/return agreements before use. Retain undivided raw energy/service numerators for the sole section8 result per reference flow; no second division Shared-protocol scope is exactly p_core; p_cover; p_bond; p_release; p_service; p_pack. The scalar process_id remains the template grouping locator only; every event keeps its actual originating process/row/direction/gate and manufacturing cohort Q or original service cohort Q_c with observed H. Do not reassign a manufacturing event to p_service, merge cohorts or change numerator/denominator because of the locator."
      unit: "MJ"
      frequency: "each event and complete period"
      temporal_coverage: "complete real production and original-cohort service horizon"
      site_scope: "actual factory/providers and linked operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/raw logs/lot records/independent tests/permission/disposition/gaps"
    - protocol_id: cp_water_species
      process_id: "p_service"
      flow_role: "real phases species humidity"
      record_type: "foreground_record"
      raw_fields: "row; phase; medium; direction; actual CAS; carbon origin; composition; cumulative volume or true rate; time for rates only; actual temperature pressure humidity; independent density; water; capture; opening/closing; uncertainty; tap_water per-event original m3; independently measured same-state kg/m3 density; native secondary-property applicability; sole Mass/kg provider quantity; whole-supply contained versus local ambient species; actual_originating_process_id; actual_row_id; event_id; real_direction; physical_gate; manufacturing_cohort_Q_or_original_Q_c; observed_H_not_divisor"
      collection_method: "Measure specific supply and every real air species inlet/outlet, natural storage moisture uptake/loss, drying, pore-gas compression and condensate. Species/phase evidence is independent of mass/element closure. Do not multiply integrated volume by time; integrate only actual rates. Density is independently measured for that substance/state, never a water default. Whole-glue carrier water is subledger only. Retain undivided full species/phase V and applicable burden numerators for sole section8 result per reference flow These actual species/phase observations distinguish local free atmospheric Resource ingress from species already contained in a supplied foam block, whole adhesive, asset or gaseous Product. Contained pore gas/carrier water remains nonadditive whole-supply composition with that one upstream owner, never another free local Resource purchase. Actual separately purchased compressed air or another gas needs its own whole Product card, pressure/state/native-unit interface and one preparation/separation/compression provider before completion. Internal air handoffs cancel while every actual compressor/ventilation load and release remains. No standard air fraction, gas-assisted process, reaction, carbon origin, isotope, ion or liquid phase is inferred. Gross molecular transfer and true net environmental change are distinct. Native treated potable/municipal Tap water Product, production mix at plant, fixes no geography or treatment recipe. Its reference property is Mass/kg; this card deliberately retains the supported SECONDARY Volume property and original physical m3 ledger. Exact Mass and Volume property references lead separately to the mass and volume unit groups, with true kg and m3. Measure each event at its actual temperature/composition/state and independently establish same-state density and applicability of the native property relationship before one native Mass/kg provider link. A native secondary coefficient is not a measured cohort density or a universal conversion. Volume and derived Mass are nonadditive views of one water supply, never two purchases. Missing density/property applicability leaves the provider interface an ordinary collection gap; no default density, silent relabelling or second normalization. Shared-protocol scope is exactly p_core; p_bond; p_service. The scalar process_id remains the template grouping locator only; every event keeps its actual originating process/row/direction/gate and manufacturing cohort Q or original service cohort Q_c with observed H. Do not reassign a manufacturing event to p_service, merge cohorts or change numerator/denominator because of the locator."
      unit: "kg; m3"
      frequency: "each event and complete period"
      temporal_coverage: "complete real production and original-cohort service horizon"
      site_scope: "actual factory/providers and linked operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/raw logs/lot records/independent tests/permission/disposition/gaps"
    - protocol_id: cp_gross
      process_id: "p_pack"
      flow_role: "six packaging gross legs and one owner"
      record_type: "foreground_record"
      raw_fields: "row; SKU; pool; leg; event; original cohort; opening empty; attached WIP/FG; reusable stock; P; I; ER; gross S; EO; W; X_in; X_out; full wet closing; disjoint components; owner; treatment/provider; F_in; F_out; same-side OTHER-flow duplicate X; paired event IDs; independent per-origin W; actual whole/component owner bridge ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID"
      collection_method: "Calibrated event weights, receipts/dispatch/returns and physical counts with measured matching-article mass, no nominal piece weight. Reconcile six real legs and genuine mixed-W alternative. Full V is separate from once-owned burden dimensions; new material/water influx persists alongside full wet closing stock. Retain undivided actual full leg V for sole section8 result per reference flow; no stock correction or economic share For every actual packaging pool close O+P+I+ER+F_in-X_in=C+S+EO+W+F_out-X_out, with disjoint full wet empty/attached-WIP/attached-FG/reusable stocks. F_in/F_out are independently measured real added/removed material or liquid/atmospheric water, never residuals or duplicate corrections. X subtracts only proved duplicate SAME-side OTHER actual flow terms with paired event IDs; never stocks, opposite-side flows, card presence, or true newly retained influx. Whole supplied wet article includes its original substrate/coating/liner/adhesive/hardware/water once. Separately supplied onsite components require disjoint receipts or a measured component-to-assembly bridge and paired internal handoffs cancelling on consolidation. Natural humidity uptake, desorption, evaporation or drainage requires no repair event or permission. One actual mixed outlet has one compatible whole-mixture Waste and one provider; independently measured per-origin W children conserve the total with uncertainty. Total OR partitions are nonadditive alternatives, not invented outlets or repeated provider charges. Product ER/EO cards apply only when actual continued reusable whole-article Product state is evidenced. Every actual Waste, damaged, rejected or unknown-state return remains in the independent full gross ledger with its real direction and requires its compatible state/type/identity before dataset completion; never force Product qualification, substitute an opposite-side leg, erase an occurred event or invent a return for symmetry.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
      unit: "kg"
      frequency: "each event and complete period"
      temporal_coverage: "complete real production and original-cohort service horizon"
      site_scope: "actual factory/providers and linked operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/raw logs/lot records/independent tests/permission/disposition/gaps"
    - protocol_id: cp_service
      process_id: "p_service"
      flow_role: "original-cohort actual service and returns"
      record_type: "foreground_record"
      raw_fields: "original Q_c; cohort; observed horizon; opening/closing FG; gross shipment; return; original outgoing mass; actual incoming wet mass; new water/soil; missing matter; actual work; permission; tests; acceptance; hold; disposal; performed and unused service"
      collection_method: "Trace events to original release, measure actual incremental work and matter/water changes even if unauthorized/failed. Retain manufacturer/spec permission, posttests/acceptance/disposition. Observe natural humidity without invented permission. Stored FG never deducts performed service. Retain undivided full V and original-cohort service numerator for sole section8 result per reference flow with original Q_c; no new Q Original-cohort Q_c is fixed by the unique first release; H is the observed horizon only, never another divisor. Keep all actually performed service and every unauthorized/failed event even while FG is held; permission/tests govern qualification and disposition, never whether occurred facts are recorded. Close the actual FG custody gate as O_FG+T_new+R_ext+F_in-X_in=C_FG+G_ext+W_actual+F_out-X_out. T_new is the matched internal first-release handoff already counted in Q; it cancels on consolidation, not a second manufacture or external purchase. Actual external R/G retain their independently measured gross current-condition mass, original cohort and prior dispatch link. F is real added/removed matter/water, not a fitted residual; X only same-side OTHER duplicate flow terms. Unknown damaged/rejected/altered reusable-Product versus Waste status remains a collection gap, not forced qualification or restoration. All actual unauthorized/failed facts and performed services remain regardless of hold/acceptance."
      unit: "kg; MJ"
      frequency: "each event and complete period"
      temporal_coverage: "complete real production and original-cohort service horizon"
      site_scope: "actual factory/providers and linked operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/raw logs/lot records/independent tests/permission/disposition/gaps"
    - protocol_id: cp_asset
      process_id: "p_service"
      flow_role: "assets tools parts and charges"
      record_type: "foreground_record"
      raw_fields: "asset; configuration; calibrated mass; new/old part; supplier included matter; opening; receipts; installed fluid; wear; repair F_in; repair F_out; full wet closing; retirement; duty; inherited service vector; unused charge; F_in; F_out; same-side OTHER-flow duplicate X; paired event IDs; independent per-origin W; actual whole/component owner bridge; actual_originating_process_id; actual_row_id; event_id; real_direction; physical_gate; manufacturing_cohort_Q_or_original_Q_c; observed_H_not_divisor"
      collection_method: "Weigh actual whole assets/tools and new/old repair parts; reconcile stocks with installed fluid and all real inflow/outflow. Full physical V differs from actual duty-based once-only service burden; no fixed life, invented item mass or whole-machine per-kg charge. Retain undivided physical V and separately attributable performed service numerator for sole section8 result per reference flow For each actual asset/tool/part/fluid pool close O+R_in+F_in-X_in=C+R_out+F_out-X_out in its reconciled physical unit. R_in/R_out are independently measured real external whole-article receipts/removals, including actual retirement or Waste; F are true measured additions/removals. X subtracts only paired proved duplicate SAME-side OTHER flow terms, never stocks, opposite flows or true newly retained influx. Whole supplied components/installed fluids/water belong once; disjoint onsite supplies or a measured component-to-assembly bridge with cancelling internal handoffs are required. Natural moisture needs no repair/permission, and no event is invented for symmetry. One actual mixed outlet and independently measured origin-W subaccounts are nonadditive total OR partitions with one provider. Shared-protocol scope is exactly p_core; p_cover; p_service. The scalar process_id remains the template grouping locator only; every event keeps its actual originating process/row/direction/gate and manufacturing cohort Q or original service cohort Q_c with observed H. Do not reassign a manufacturing event to p_service, merge cohorts or change numerator/denominator because of the locator."
      unit: "kg; actual service unit"
      frequency: "each event and complete period"
      temporal_coverage: "complete real production and original-cohort service horizon"
      site_scope: "actual factory/providers and linked operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/raw logs/lot records/independent tests/permission/disposition/gaps"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert each raw record to its own extensive unit before attribution: kWh×3.6 to MJ; mass by calibrated net weighing; cumulative m3 once; actual rates integrated over real time only. Independently measured substance/state density bridges volume/mass. Preserve conversion evidence; no mattress mass from foam density, catalog or native secondary coefficients."
      inputs:
        - raw_record
        - native_unit
        - measured_density
        - cp_energy
        - cp_water_species
      output: "converted_raw"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: manufacturing_numerator
      applies_to: "manufacturing burden dimensions only; full physical gross V excluded"
      rule: "For each manufacturing burden dimension A_m use opening raw/WIP inherited vectors plus actual converted external inputs/services, minus only closing raw/WIP or genuinely unused/unassigned non-WIP stores and one justified independent other-function handover. Do not deduct released closing FG, ordinary scrap/failures/samples, or stock-corrected consumption again. Gross physical flows remain separate; all zero-output loads remain."
      inputs:
        - opening_vectors
        - converted_raw
        - closing_unreleased_vectors
        - justified_handover
        - cp_material
      output: "A_m"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: service_numerator
      applies_to: "original-cohort performed service burden dimensions only; full physical gross V excluded"
      rule: "For original cohort c form actual incremental performed service A_s over the disclosed horizon, including actual unauthorized/failed work and treatment. Carry only unused/unassigned service/charge. Keep original Q_c and historical manufacture intact; one justified handover only. Gross returns and added/lost water/matter are independently observed, never inferred equal to original shipment."
      inputs:
        - service_raw
        - original_Q_c
        - unused_service
        - cp_service
        - cp_asset
      output: "A_s"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "When Q>0, each applicable manufacturing burden dimension is A_m/Q once; original-cohort service uses A_s/Q_c once with Q_c>0. Independently, each physical gross-event dimension uses full actual V/Q_c (or V/Q for that manufacturing cohort), never A_m, A_s, Bopen+U-Bclose or economic share instead of V. These are separate dimensions, not successive divisions. Cards and aggregation reuse only this final report, no further division, purchase/provider burden or credit. Zero denominator retains raw loads/events without a unit result. Original-cohort Q_c is fixed by the unique first release; H is the observed horizon only, never another divisor. Keep all actually performed service and every unauthorized/failed event even while FG is held; permission/tests govern qualification and disposition, never whether occurred facts are recorded. For tap_water, physical secondary Volume/m3 is not its native Mass reference. The native provider uses only the once-attributed Mass component from tap_water_native_provider in this sole quotient; do not charge a Volume purchase as well."
      inputs:
        - A_m
        - A_s
        - V
        - Q
        - Q_c
        - cp_release
      output: "one_final_report"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: physical_reconcile
      applies_to: "all inventory rows"
      rule: "At every gate full opening physical stocks + full actual external inflows = full closing physical stocks + full actual external outflows; pair/cancel internal transfers. Packaging uses explicit six legs with disjoint X terms. Independently reconcile actual species, phase water and relevant elements with uncertainty; no two-unknown residual fit or burden-share scaling of physical legs. For every actual packaging pool close O+P+I+ER+F_in-X_in=C+S+EO+W+F_out-X_out, with disjoint full wet empty/attached-WIP/attached-FG/reusable stocks. F_in/F_out are independently measured real added/removed material or liquid/atmospheric water, never residuals or duplicate corrections. X subtracts only proved duplicate SAME-side OTHER actual flow terms with paired event IDs; never stocks, opposite-side flows, card presence, or true newly retained influx. Whole supplied wet article includes its original substrate/coating/liner/adhesive/hardware/water once. Separately supplied onsite components require disjoint receipts or a measured component-to-assembly bridge and paired internal handoffs cancelling on consolidation. Natural humidity uptake, desorption, evaporation or drainage requires no repair event or permission. One actual mixed outlet has one compatible whole-mixture Waste and one provider; independently measured per-origin W children conserve the total with uncertainty. Total OR partitions are nonadditive alternatives, not invented outlets or repeated provider charges."
      inputs:
        - physical_opening
        - physical_in
        - physical_closing
        - physical_out
        - cp_gross
        - cp_water_species
      output: "physical_balance"
      source_ids:
        - jrc-ilcd-allocation-2010
    - id: tap_water_native_provider
      applies_to: "tap_water"
      rule: "For each unnormalized actual tap_water event e, m_e = rho_e * v_e, where v_e is original measured m3 and rho_e independently measured same-state kg/m3. Establish native property-relation applicability before using the derived Mass/kg reference interface; otherwise retain the collection/provider gap. Convert each actual event before stock/cohort attribution, assemble the one applicable once-owned water Mass burden vector with its full inherited stocks, and let single_quotient supply its only normalized native-provider quantity. Gross Volume and derived Mass remain nonadditive views of the same water; never two purchases, a native-coefficient density default, conversion of already-normalized volume followed by another division, or a second provider."
      inputs:
        - actual_event_volume_m3
        - independently_measured_same_state_density
        - native_property_relation_applicability
        - cp_water_species
        - single_quotient
      output: "native_mass_provider_interface"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify full native restrictions/provider compatibility and complete configured BOM per card; auxiliary missing UUID remains specific, never a bundle/proxy."
      evidence: "Full direct rows and actual supplier/BOM/drawing evidence"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Real calibration, mass/moisture, meter histories, species/state density cover full failed/zero-output periods; no invented energy/yield/density/mass/test default."
      evidence: "Calibration/raw logs/independent assay/uncertainty/gaps"
    - id: dq_stocks
      applies_to: "all inventory rows"
      requirement: "Raw/WIP/FG, assets and packaging retain physical/per-exchange burden genealogy, distinct cohorts and real horizons; every gross leg, supplier-included package, new/old repair and humidity change is traceable without overlapping whole/component totals."
      evidence: "Lot/serial ledgers, balances, service and ownership/handover records"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Sources are independent qualitative technical examples, not common-site measurements. ILCD allocation is conditional attributional context only; actual future quantities/species/provider/state remain collection requirements, not fabricated source-backed facts."
      evidence: "Complete originals/context, applicability and actual site/time evidence"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "all inventory rows"
    rule: "Verify complete mattress BOM and endpoint including every actual foam/cover/zipper/thread/trim; no bare block or chemical reference substitution. Match every adopted native restriction, material/form/route/geography/type/media/property chain and actual provider. Taxonomy never excuses a hard conflict."
    source_ids:
      - magenta-mattress-prospectus-2024
      - aj-foam-manufacturing
  - rule_id: validate_q
    applies_to: "all inventory rows"
    rule: "Reconcile calibrated whole net mass, actual conditioning/configuration, unique release and original cohort to cp_release/Q. Closing FG, repeat tests, returns and redelivery add no Q. Retain every manufacturing/original-service load; zero denominator yields no unit result."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: validate_numerators
    applies_to: "all inventory rows"
    rule: "Check raw-unit conversion and true attributable numerators before the sole section8 quotient. Protocols retain undivided raw values; cards/aggregation only reuse the same result. Gross cards use full actual V, not burden vectors/stock corrections/economic shares or duplicate supplier burdens. Check actual six-direction cards and disjoint mixed-W alternative."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: validate_physical
    applies_to: "all inventory rows"
    rule: "Verify independent gross/element/species/phase-water balances for all gates, with actual uncertainty, no two-unknown residual fit. Natural humidity, pore gas, wet waste and full wet stocks remain real terms. Missing species/measurement remains an explicit gap, never a zero or successful measurement."
    source_ids:
      - simalfa309-tds-sds-2022
      - jrc-ilcd-allocation-2010
  - rule_id: validate_work
    applies_to: "all inventory rows"
    rule: "Verify actual manufacturer/specification rework/compression permission, postwork tests, acceptance and disposition. Unauthorized/failed real work still has all actual loads and hold/waste route. No assumed recovery of wet/aged/compressed goods, dry adhesive removability, lifetime, comfort, fire/durability threshold or certification."
    source_ids:
      - aj-foam-manufacturing
      - simalfa309-tds-sds-2022
  - rule_id: validate_sources
    applies_to: "all inventory rows"
    rule: "Disclose qualitative route/component synthesis and historical source limits; sources are not one site/SKU/order or numerical foreground inventory. ILCD is allocation evidence only within the applicable attributional context, not an industrial recipe or safety approval. Report science, translation, identity/provider and real-data gaps separately; machine checks do not accept mapping or methodology."
    source_ids:
      - magenta-mattress-prospectus-2024
      - aj-foam-manufacturing
      - simalfa309-tds-sds-2022
      - jrc-ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Matched complete flexible PU mattress manufacture with separately disclosed actual original-cohort service packets"
  allowed_use: "Actual compatible configuration/route/whole mass/provider-state supply; no function equivalence from kg"
  excluded_use: "Mattress supports, spring/hybrid/latex/coir/inflatable/water mattresses, beds/frames, bare blocks as final product, toppers/cushions/quilts, bought-finished mattress repacking, onsite foam/rebond production, reactive/2K/solvent-adhesive and PVC-laminated tape-edge routes. No use-life service or downstream end of life beyond actual factory waste/return services. Actual onsite combustion or purchased heat/steam needs expanded route with each carrier/return/thermal-state/enthalpy/supplier-water-energy agreement, never an invented boiler."
  required_metadata: "complete non-spring flexible PU mattress; model configuration and drawing revision; each layer grade and cured block/sheet supply; full cover/zipper/thread/trim BOM; fabric construction finish and moisture; whole adhesive formulation and current supplier application/drying/cleanup instructions; actual cutting quilting sewing bonding route; calibrated whole net mass and conditioning/moisture state; actual dimensional bond stitch function safety test specification and acceptance; unique first quality release Q and cohort; opening/closing raw WIP FG and every inherited burden vector; all failed zero-output startstop idle cleanup rework periods; native utility property voltage geography provider boundary; packaging composition six actual gross legs and one upstream owner; original Q_c and observed service horizon; actual humidity cell gas chemical species and carbon origin; actual return condition rework permission tests and disposition; allocation decision and actual supplier compatibility"
  required_quality_disclosure: "Measured coverage and gaps; all native restrictions; actual source/route/provider limits; complete gross/element/species/water balances; first-release/original-service separation; failure disposition; allocation uncertainty; no science/translation/certification claim from engineering checks"
  update_trigger: "Changed foam/cover/formulation/route/test specification/provider/utility/package/waste treatment/native restrictions or service horizon"
data_sources:
  - id: "magenta-mattress-prospectus-2024"
    type: "handbook"
    reference: "Magenta Lifecare Limited, Prospectus May29 2024, full issuer primary document on CapitalMarket mirror; printed121–123 / PDF123–125. https://www.capitalmarket.com/pub/dp/dp92471.pdf"
    used_for: "Historical purchased-block conversion/cover stitching/packing branches, qualitative route only; not same factory/SKU or quantitative recipe/density/yield/energy/default or allocation proof"
  - id: "aj-foam-manufacturing"
    type: "handbook"
    reference: "AJ Foam Ltd, Manufacturing Capabilities, complete undated manufacturer page. https://www.ajfoamltd.co.uk/capabilities"
    used_for: "Independent profiling/complete foam-only mattress covering and incoming/in-process/outgoing QC example; adjacent latex/hybrid excluded; no performance/certification default"
  - id: "simalfa309-tds-sds-2022"
    type: "handbook"
    reference: "Alfa Adhesives, SIMALFA309 TDS/SDS May30 2022, complete26-page manufacturer file including English TDS1–3/SDS1–9. https://static.simalfa-kulkote.com/simalfa/sds/Simalfa_SDS_309.pdf"
    used_for: "Whole1K acrylic/CR water dispersion, nonreactive drying, water cleanup and nonremovable dry adhesive limitations; not same-site/SKU, no adopted solids/density/application/time/temperature/testing/zero-emission default"
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, First edition March2010, complete sections7.9.2–7.9.3 printed255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Applicable attributional context: subdivision/virtual subdivision, exchange-specific determining physical causality, then residual common-process-gate/state contemporaneous market value; not industrial recipe, fixed share, QFD comparison or automatic waste credit"
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD CPC Ver.3.0 Explanatory Notes30June2025, complete PDF187–189 context including38150. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification38150 contains supports and several mattresses; not collection-method canonical identity, accepted mapping or native/manufacturing physical evidence"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:ecdaeff5394efddde4aaee734fde2f41a7c185e25385afeb9d3763baced25260"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7279"
      family: "system_boundary"
      span:
        start:
          offset: 7279
          line: 60
          column: 1
        end:
          offset: 17756
          line: 84
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased cured non-mattress flexible PU blocks/sheets plus actual separately supplied cover materials/components/preparations |\n| starting_condition_role | raw_material_or_intermediate |\n| product_classification_scope | Non-spring flexible PU whole-mattress subset of38150, not the entire leaf |\n| recursive_input_rule | Bought finished mattresses are not this manufacturing feedstock; actual returned whole mattresses are original-cohort gross events with historical burden, no new procurement/Q |\n| upstream_dataset_requirement | Each real supplied foam/textile/whole preparation/component/utility/transport and asset service has actual compatible provider/state/boundary and one upstream owner |\n| disclosure | Whole BOM/route/release Q/original service horizon/raw-WIP-FG burden vectors/full gross packaging-assets-water-species and all gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | all inventory rows | Collect purchased cured flexible PU blocks/sheets through real cutting/profiling, actual layer bonding/drying, complete cover cutting/quilting/sewing and fitting, whole-mattress tests and unique first release. Blocks are raw/intermediate feedstock; their verified upstream manufacture/logistics remains included. No finished mattress purchase substitutes this manufacture. Internal same-product transfers pair and cancel at consolidation without external procurement or another Q. | `magenta-mattress-prospectus-2024`; `aj-foam-manufacturing` |\n| boundary_q | all inventory rows | Q is newly first-released net whole-mattress mass in one actual configuration/cohort. Closing released FG is already in Q, neither an additional manufacturing output nor a deductible manufacturing burden stock. Carry closing raw/WIP and genuinely unused/unassigned non-WIP stores with complete inherited exchange vectors. Include failures, zero-output, startup/shutdown, idle, cleanup and rework. Q=0 retains all loads with no unit result. | `jrc-ilcd-allocation-2010` |\n| boundary_service | all inventory rows | Post-release storage/handling/compression/packing/gross shipment/return/retest/rework/disposal are actual original-cohort service packets with original Q_c and disclosed observation horizon. Performed service is not deducted for stored FG; only unused/unassigned service or charge carries forward. Redelivery/retest adds no Q. Manufacturer/spec permission, postwork tests, acceptance/disposition govern actual rework/continued qualification, not deletion of unauthorized or failed real work: retain all its material/energy/logistics and hold/waste route. Natural humidity exchange needs observation, not invented work permission. Original-cohort Q_c is fixed by the unique first release; H is the observed horizon only, never another divisor. Keep all actually performed service and every unauthorized/failed event even while FG is held; permission/tests govern qualification and disposition, never whether occurred facts are recorded. Close the actual FG custody gate as O_FG+T_new+R_ext+F_in-X_in=C_FG+G_ext+W_actual+F_out-X_out. T_new is the matched internal first-release handoff already counted in Q; it cancels on consolidation, not a second manufacture or external purchase. Actual external R/G retain their independently measured gross current-condition mass, original cohort and prior dispatch link. F is real added/removed matter/water, not a fitted residual; X only same-side OTHER duplicate flow terms. Unknown damaged/rejected/altered reusable-Product versus Waste status remains a collection gap, not forced qualification or restoration. All actual unauthorized/failed facts and performed services remain regardless of hold/acceptance. | `magenta-mattress-prospectus-2024`; `aj-foam-manufacturing`; `jrc-ilcd-allocation-2010` |\n| boundary_whole | all inventory rows | Buy each supplied whole adhesive/zipper/component once; assay/solids/water/component accounts are disjoint subledgers, not repeated purchases. No onsite PU foaming is included. Actual onsite mixing/reaction requires individually named bought materials, real energy/losses and independent species/reaction evidence before expanded-route use; no guessed polyol/isocyanate dose or process conditions. | `magenta-mattress-prospectus-2024`; `simalfa309-tds-sds-2022` |\n| boundary_species | all inventory rows | Close full physical gross mass and relevant C/H/O/N/Cl or other actual elements independently of real species and water evidence at manufacturing, FG-service and consolidated gates. Distinguish free, structural, reaction and phase-change water. Nonreactive waterborne glue drying is evaporation, not reaction water. Measure actual pore gas and carbon origin. VOC/COD/PM/total-isocyanate/total-carbon are metrics, not molecule identities; one residual cannot fit two unknowns. Add each real unlisted input/output as a named atomic exchange before completeness; unknown never means zero. These actual species/phase observations distinguish local free atmospheric Resource ingress from species already contained in a supplied foam block, whole adhesive, asset or gaseous Product. Contained pore gas/carrier water remains nonadditive whole-supply composition with that one upstream owner, never another free local Resource purchase. Actual separately purchased compressed air or another gas needs its own whole Product card, pressure/state/native-unit interface and one preparation/separation/compression provider before completion. Internal air handoffs cancel while every actual compressor/ventilation load and release remains. No standard air fraction, gas-assisted process, reaction, carbon origin, isotope, ion or liquid phase is inferred. Gross molecular transfer and true net environmental change are distinct. | `simalfa309-tds-sds-2022`; `jrc-ilcd-allocation-2010` |\n| boundary_packaging | all inventory rows | For every actual packaging pool close O+P+I+ER+F_in-X_in=C+S+EO+W+F_out-X_out, with disjoint full wet empty/attached-WIP/attached-FG/reusable stocks. F_in/F_out are independently measured real added/removed material or liquid/atmospheric water, never residuals or duplicate corrections. X subtracts only proved duplicate SAME-side OTHER actual flow terms with paired event IDs; never stocks, opposite-side flows, card presence, or true newly retained influx. Whole supplied wet article includes its original substrate/coating/liner/adhesive/hardware/water once. Separately supplied onsite components require disjoint receipts or a measured component-to-assembly bridge and paired internal handoffs cancelling on consolidation. Natural humidity uptake, desorption, evaporation or drainage requires no repair event or permission. One actual mixed outlet has one compatible whole-mixture Waste and one provider; independently measured per-origin W children conserve the total with uncertainty. Total OR partitions are nonadditive alternatives, not invented outlets or repeated provider charges. Product ER/EO cards apply only when actual continued reusable whole-article Product state is evidenced. Every actual Waste, damaged, rejected or unknown-state return remains in the independent full gross ledger with its real direction and requires its compatible state/type/identity before dataset completion; never force Product qualification, substitute an opposite-side leg, erase an occurred event or invent a return for symmetry. | `magenta-mattress-prospectus-2024`; `jrc-ilcd-allocation-2010` |\n| boundary_assets | all inventory rows | Separate full physical assets/spares/installed-fluid opening/receipts/closing/retirement and each new/old repair part from measured current service burden. No one whole machine per kg, fixed life or default wear. Keep each water phase and actual component added/lost; incoming supplier packaging has its six actual legs and one upstream owner. Only actual external Product returns/heat/steam carriers and real receiving thermal states are recorded, never duplicated provider wholes and their component masses. For each actual asset/tool/part/fluid pool close O+R_in+F_in-X_in=C+R_out+F_out-X_out in its reconciled physical unit. R_in/R_out are independently measured real external whole-article receipts/removals, including actual retirement or Waste; F are true measured additions/removals. X subtracts only paired proved duplicate SAME-side OTHER flow terms, never stocks, opposite flows or true newly retained influx. Whole supplied components/installed fluids/water belong once; disjoint onsite supplies or a measured component-to-assembly bridge with cancelling internal handoffs are required. Natural moisture needs no repair/permission, and no event is invented for symmetry. One actual mixed outlet and independently measured origin-W subaccounts are nonadditive total OR partitions with one provider. | `jrc-ilcd-allocation-2010` |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | jrc-ilcd-allocation-2010 |\n\n"
