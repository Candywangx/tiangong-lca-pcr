          description: "Only actual ordinary H2O gas desorption from the separately balanced packaging pool to unspecified air, CAS 7732-18-5, Elementary Mass/kg; isotope/ice aliases are not adopted. Retain full wet closing mass and avoid duplicating fg_service water emission for the same event. Liquid drainage is a different actual outlet."
          amount:
            expression: "V_i / D; reference the same sole quotient result in section 8, this card N=complete actual gross leg V_i, not a burden vector or stock-corrected amount. Manufacturing cohort D=Q; original-cohort service and its gross legs D=original Q_H. No further division or economic scaling."
