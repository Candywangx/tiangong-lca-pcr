  calculation_rules:
    - id: calc_raw
      applies_to: "all observations"
      rule: "Convert raw rate/total units to the actual native extensive unit before attribution. Integrate only real rates over their observed interval; density and composition are independently evidenced for that substance/state. Measured electricity: E_MJ=3.6*E_kWh. No reference denominator is applied here."
      inputs:
        - raw_observation
        - raw_unit
        - interval
        - actual_state
        - density
        - composition
      output: "U_native"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_manufacture
      applies_to: "manufacturing burden dimensions"
      rule: "A_c=B_open+U_burden-B_close-T_other, elementwise after dedicated/subdivided and exchange-specific causality or justified true residual allocation. B_close excludes released FG already assigned to Q and already performed original-cohort service. T_other exists only for a true other-function/cohort justified handover once; ordinary waste/sales remain in A_c. Stock-corrected U_burden has no duplicate stock deduction. Physical gross V is independent. U_burden is the exchange-specific upstream and actual foreground burden vector assembled once from measured native observations and compatible provider boundaries; raw U_native and full gross physical V_i are not that vector."
      inputs:
        - B_open
        - U_burden
        - B_close
        - T_other
        - attribution_record
      output: "A_c"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "original-cohort service burden dimensions"
      rule: "A_H=C_open+U_H-C_unused_close-T_other_H after actual attribution. Historical manufacture is not another U_H purchase. Only genuinely unused/unassigned service charges carry; work already performed stays assigned despite closing FG. Keep all failures and unauthorised work plus observed H; D is original first-release Q_H."
      inputs:
        - C_open
        - U_H
        - C_unused_close
        - T_other_H
        - Q_H
        - H
      output: "A_H"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all gross physical card dimensions"
      rule: "V_i is the complete measured actual leg in that direction and native extensive unit. No B_open+U-B_close, economic share or burden vector replaces V_i; no stock correction or allocation is applied to a gross card. Deduplicate only genuinely overlapping same-side flow terms X. Keep new influx plus full wet closing stock. These physical disclosures create no second procurement/provider burden or credit; associated burden dimension is separately owned once in A_c/A_H."
      inputs:
        - gross_event
        - direction
        - native_unit
        - same_side_overlap
      output: "V_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "q=N/D. Execute this sole quotient once for each tagged dimension: physical cards N=V_i; burden result N=A_c or A_H separately. D=Q for first-release manufacture; D=original Q_H for H services and their physical legs. Reference output is 1 kg. Q and Q_H are measured first-accepted net whole-instrument kg, never delivered mass. D=0 retains raw real flows/burdens with no unit q. Cards and aggregation reference this exact result without another division. H selects the actually observed interval only; never divide its accrued load by H again. Observed held/returned FG keeps original Q_H without subtracting prior manufacture or performed service."
      inputs:
        - N
        - D
        - V_i
        - A_c
        - A_H
        - Q
        - Q_H
        - H
      output: "q"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all cards"
      requirement: "Record actual complete product/component/material/species identity and every native restriction, CAS, form, route, grade, phase, geography, receiver, reference property and actual provider coverage. Unknown is disclosed; replace incompatible bindings, never invent a matching supplier."
      evidence: "full native records; supplier specifications; configuration and acceptance"
    - id: dq_measurement
      applies_to: "all protocols"
      requirement: "Preserve raw calibrated observations, original units, rate versus total, configuration/cohort/site/horizon, each failure and uncertainty/detection limits. Verify the one reference output, denominator and sole quotient in both languages; a finite check is not verification of future plant data."
      evidence: "calibration; raw metering; serial acceptance; raw-to-result trace"
    - id: dq_completeness
      applies_to: "all gates"
      requirement: "Require complete raw/WIP/FG and per-flow inherited vectors, gross legs, actual packing six events, asset/part/fluid stocks and once-only providers. Do not conceal actual flows in zero or unspecified combined input collections; a single actual mixed waste outlet is explicitly supported by measured source subledgers."
      evidence: "physical/element/species balances; supply-owner matrix; waste receipts"
    - id: dq_evidence
      applies_to: "all sources"
      requirement: "Manufacturer originals support qualitative route/terminal and countercontext only. No universal composition, mass, dimensions, tolerance, dose, process settings, emission/yield/life factor is inferred. ILCD allocation is attributional; it is not trumpet chemistry. Report ordinary collection/provider gaps separately from any true core hold and pending independent methodology/translation review."
      evidence: "source scope and limitations; conflicting context; gap register"
validation_rules:
  - rule_id: validation_terminal
    applies_to: "reference and all cards"
    rule: "Verify one complete functioning lacquered piston-valve brass trumpet and its supplied configuration against positive primary and full native identity. Hard material/form/route/phase/type/media conflicts block the affected binding; a genuinely unconfirmed whole core identity leaves draft/unmapped/unusable. Ordinary auxiliary/provider collection gaps do not establish a core hold."
    source_ids:
      - yamaha-structure
      - yamaha-final
      - un-cpc3-notes
  - rule_id: validation_q
    applies_to: "first release and services"
    rule: "Count first accepted net mass once including closing FG; cancel paired internal Q/parts transfers. No delivery/reinspection/rework creates new production. Original service cohort denominator and observation horizon remain explicit. Q=0 gives no unit result; all failed/unauthorised actual work and losses remain."
    source_ids:
      - yamaha-final
      - ilcd-attributional-2010
  - rule_id: validation_inventory
    applies_to: "all inventory rows"
    rule: "Every card represents one atom/event, preserves all qualifiers, matching official localized UUID name, complete native restrictions and correct extensive property/unit. All collection records retain unnormalised raw units; one quotient calculates each physical V or independently attributed burden numerator exactly once. Cards and aggregation only reference that one result."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validation_balances
    applies_to: "manufacture FG and combined gates"
    rule: "Reconcile complete wet physical gates, relevant independent elements/species, opening/closing raw/WIP and per-flow burden vectors, packing six events, real assets/repairs/fluids, actual gas and thermal carriers. Keep new influx and full wet closing stocks together. No economic scaling of gross mass, two-unknown residual, indicator-to-molecule conversion or duplicate mixed-waste treatment."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validation_scope
    applies_to: "all claims"
    rule: "Keep native identity evidence distinct from manufacturing qualitative evidence and allocation methodology. No default BOM, alloy fraction, mass per instrument, density from secondary property, film thickness, tuning/leak tolerance, test value, heat/time/pressure recipe, life, yield, energy factor, emission factor or approval claim. Scientific/translation review and accepted mapping/publication are independent."
    source_ids:
      - yamaha-final
      - yamaha-finish
      - adams-eb
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Configuration/route-specific attributional first-release manufacture; actual original-cohort services as separate Q_H/H results"
  excluded_use: "Whole-38330 coverage, industry average, repacking as manufacture, other instruments/finishes, default factors, certification/approval or avoided credits"
  required_metadata: "complete acoustic trumpet configuration; piston valve system; actual tuning pitch and specification; bell lead main and valve slide configuration; actual alloys grades and supply forms; onsite versus purchased component work; lacquer formulation and application curing route; supplied mouthpiece and usable accessories scope; net mass excluding packing case and separate accessory bottles; calibrated weighing and unique first acceptance; production cohort Q and closing released FG; original service cohort Q_H and observed H; raw WIP and unassigned service inherited vectors; complete gross physical legs and packaging ownership; actual postwork permission tests and disposition; native limits and provider coverage"
  required_quality_disclosure: "Measured and unknown, all conditions, ordinary auxiliary/provider gaps versus true core holds, native restrictions, once-only attribution, gross/burden reconciliation, representativeness/uncertainty and unreviewed scope"
  update_trigger: "Terminal/configuration/alloy/supply form, finish route, native/provider, actual atom, Q gate, service cohort, allocation or evidence changes"
