allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared manufacturing and service"
    rule: "Use attributional modelling only where consistent with the study decision context. First dedicate or physically subdivide instrument configurations and service cohorts; then virtual subdivision assigns each exclusively caused exchange. Buying one complete valve block or preparation does not justify allocating its constituents a second time."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_causality
    applies_to: "remaining individual exchanges"
    rule: "For each remaining shared exchange identify and quantify determining physical causality; use measured machine demand/time, material embodiment, actual heating requirement or a supported service driver only where it determines that exchange. Do not freely choose mass/count/time/economics or a single universal key. Reconcile shares to observed totals and document limitations."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "true common residual process"
    rule: "Only demonstrably inseparable residual after subdivision and exchange-specific causality may use contemporaneous actual values of true co-functions at the same common process gate and actual condition/quantity. Derive any translated market value by removing downstream-only finishing/packing/transport. No fixed price or share; lack of reliable values is an unresolved allocation issue, not permission to assign arbitrary economics. Apply the residual key once to that residual vector, never to gross physical legs."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_history
    applies_to: "cohort vectors"
    rule: "Keep one owner per supply, inherited opening/closing vector and work increment. Only justified true other-function/cohort handover is T_other once; ordinary waste/sale is not. Performed original-cohort services and released-FG manufacturing are not unused stock. Capital equipment/jig physical stocks, repairs, actual new/old parts and installed fluids remain separate from service burdens and measured utilisation; no fixed asset lifetime or a whole machine per kg."
    source_ids:
      - ilcd-attributional-2010
