system_boundary:
  rules:
    - rule_id: boundary_chain
      applies_to: "manufacturing_system"
      rule: "Start at real received alloy sheet/tube/rod and component supply states. Include actual cutting, hammering/spinning, tube drawing/sizing/bending, removable filler recovery, valve machining/broaching/brazing/grinding when performed, solder assembly, cleaning/buffing, lacquer application and actual curing/drying, lubrication, adjustment and final function/appearance/play testing. Do not impose hydraulic forming, a kiln, every hand operation, a plating bath or a particular energy system on all plants."
      source_ids:
        - yamaha-bell
        - yamaha-casing
        - yamaha-piston
        - yamaha-mouthpipe
        - yamaha-final
    - rule_id: boundary_supply
      applies_to: "all inputs"
      rule: "One documented upstream interface per actual whole supply: the complete bought preparation or component is procured once; internal resin/solvent/water/alloy constituents are assay subledgers. Onsite preparation instead lists each real purchased ingredient, extra carrier, mixing energy and loss separately and does not also purchase its internal output. Purchased finished valve blocks, springs and bells include supplier manufacturing; remove only duplicated onsite work, never their upstream burden."
      source_ids:
        - yamaha-casing
        - yamaha-piston
        - yamaha-final
        - ilcd-attributional-2010
    - rule_id: boundary_q
      applies_to: "first release"
      rule: "Choose first quality release, not net delivery. Q is the sum of measured net mass of each complete configuration first released during the production cohort once. Closing released FG is already in Q: never add it as additional production or deduct its manufacturing burden. Failed, held and sample instruments lacking acceptance do not enter Q. Reinspection, return, authorised or unauthorised postrelease work and shipping create no new Q."
      source_ids:
        - yamaha-final
        - ilcd-attributional-2010
    - rule_id: boundary_history
      applies_to: "materials and WIP"
      rule: "Retain raw physical opening/closing quantities separately from every inherited exchange-specific burden vector. Manufacturing B_open/B_close includes raw stock, WIP and genuinely unused/unassigned non-WIP stores or service charges, excluding released FG manufacturing already assigned to Q. Stock-corrected consumption is not corrected twice. Internal component handoffs use matching identity/amount/history and cancel in consolidation; their BOM is not another external product or reference output."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_actual
      applies_to: "all processes"
      rule: "Collect all real failed batches, zero-output periods, start/stop, idle, cleanup, samples, repair, rework and losses. Q=0 keeps real raw quantities and burdens and yields no unit result. A missing UUID, provider or future factory amount is not zero or a cut-off. Add every actual unlisted single material, alloy, whole preparation, gas, fuel, tool, waste outlet and chemically identified emission before claiming site completeness."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_services
      applies_to: "fg_service"
      rule: "Storage, handling, packaging and dispatch remain actual separately attributed service ledgers H with original cohort Q_H and observed horizon. Original manufacturing history is carried for identity but never purchased again. Only unused/unassigned services/charges carry; performed original-cohort services remain assigned even when FG closes in stock. Actual rework needs manufacturer/specification permission and postwork test/acceptance/disposition for continued conformity; missing permission or failed tests never erase occurred flows or burdens. A damaged or dented piston must not simply be reinserted; preserve the manufacturer instruction to contact its dealer. Natural humidity exchange needs no invented work authorisation."
      source_ids:
        - yamaha-manual
        - ilcd-attributional-2010
    - rule_id: boundary_physical
      applies_to: "all physical gates"
      rule: "Reconcile manufacture, released-FG/service and combined physical gates from complete gross legs, independent opening/closing wet stocks and actual reaction/transfer terms. Gross physical legs never shrink by allocation or economic shares. Track each relevant alloy/element and independent H2O phases, dissolved/particle species and measured emissions; COD, VOC, NOx, total metal, ions-total and PM are indicators, not single molecules. No one residual may determine two unknowns; no invented oxidation, water formation, alloy loss or density."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_pack
      applies_to: "packaging_assets"
      rule: "For each actual packaging material retain opening empty/attached WIP/attached FG/reusable stocks and six event legs P/I/ER/S/EO/W separately, plus real disjoint repairs and water exchange. Closing is complete wet mass. Internal reuse cancels. Newly received material/water retained in closing still has real influx; X_in/X_out remove only overlaps with other same-side flow terms, never closing stocks or opposite direction. Supplier-included I has real mass and one upstream owner. Whole wet article and contents/tare bridge must be disjoint. Apply the complete cp_pack identity with real F_in/F_out and subtract only proved OTHER same-side X; no stock/opposite-side cancellation."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_waste
      applies_to: "all waste"
      rule: "Actual ordinary manufacturing waste, failed pieces, samples or scrap sold externally retain incurred manufacturing and treatment burdens. No automatic T_other subtraction, avoided product credit, yield allocation or recycling credit follows shipment/sale. One actual mixed waste outlet is one Waste exchange; measured source pools sum to its whole wet total without additive duplicate provider/treatment. Only a real separately functioning other cohort/product and justified allocation/handover permits one burden-vector transfer; physical gross remains complete. If independently measured origin-W partitions are used instead of the actual mixed total, they are a nonadditive representation of that same one outlet and one provider, not additional disposals. Actual collection gate and source-process handoffs must be explicit."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_energy
      applies_to: "utilities"
      rule: "Use actual native extensive energy units for electricity, heat and each fuel. Record any actual steam/hot-water carrier kg, external Product condensate/water return and thermal states/enthalpy separately from delivered MJ with one supplier water/energy boundary; no duplicated provider purchase, default steam/boiler or automatic return credit. Gas totals already integrated over an interval are not multiplied by time again; only measured rates are integrated."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: boundary_downstream
      applies_to: "dataset boundary"
      rule: "Declare cradle-to-first-release with linked upstream and production-waste treatment; distinguish measured gate-to-gate from incomplete supplier-linked coverage. Actual subsequent foreground services are separate original-cohort results. Downstream distribution, musician practice/use maintenance and end-of-life scenarios are outside this manufacturing result; owner manual handling guidance is not evidence of factory quantities, service life or certification."
      source_ids:
        - yamaha-manual
        - ilcd-attributional-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-attributional-2010
