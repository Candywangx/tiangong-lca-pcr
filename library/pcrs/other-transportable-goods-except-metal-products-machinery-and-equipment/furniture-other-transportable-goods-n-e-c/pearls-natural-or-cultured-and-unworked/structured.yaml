    - id: calc_units
      applies_to: "all inventory rows"
      rule: "U is unnormalized raw observation after one valid unit conversion. kWh*3.6=MJ. Cumulative gas/liquid volume is not multiplied by time again; integrate only a true rate. Independently measure the actual substance/phase/state density and calorific value if needed; no secondary-property density or theoretical count yield."
