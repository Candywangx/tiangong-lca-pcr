      collection_method: "For each actual packaging material or whole-article pool O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C includes full wet empty, attached-WIP, attached-FG and reusable stock; S is gross shipment, never Q or net delivery. P and I are mutually exclusive for the same physical incoming event, independent of burden shares. F_in/F_out are independently measured true material or water additions/removals from actual repair, cleaning or ordinary sorption/loss, with event identity, phase and destination; never residual-fitting terms. X_in/X_out subtracts only the exact event/material amount proved duplicated in another actual OTHER incoming/outgoing flow on the SAME side. Never subtract a stock, the opposite side, mere card presence or real ingress retained in C. Complete wet articles and a mutually exclusive component bridge are alternative ledgers; internal transfers/reuse cancel once. Real segregated waste departures use their own complete card; one actual mixed_packaging_waste outlet has one measured total and one receiver/treatment provider, with independently measured disjoint origin_W subaccounts that sum to that total and are not additional exported exchanges or treatment amounts. Unknown origins remain unresolved, no invented mixture. Whole bag/lining/thread and complete preparations are procured once; actual burden ownership and allocation stay separate from full gross V.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
