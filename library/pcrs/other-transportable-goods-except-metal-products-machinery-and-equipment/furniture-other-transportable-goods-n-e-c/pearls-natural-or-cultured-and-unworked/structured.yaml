    - id: calc_manufacturing
      applies_to: "all inventory rows"
      rule: "For burden dimensions only: A=B_open+U_attributed-B_close-T_other. Terms are exchange-specific inherited vectors. B_close contains raw/live-WIP/unreleased pearls and unused unassigned stores/charges only, never closing released pearl FG. T_other needs real other function/cohort plus justified recorded one-time handover; ordinary waste/reject/sample sales are not T_other. If U is already stock-corrected consumption, reconcile and eliminate overlapping stock terms once. Never apply this to gross cards."
      inputs:
        - B_open
        - U_attributed
        - B_close
        - T_other
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "all inventory rows"
      rule: "For performed postrelease service over observed H, A is actual service assigned to original cohort plus used prior service vector; Q denotes original Q_H. Closing FG never reverses performed service. Carry only unused/unassigned service/charges. Return/retest/rework adds only actual incremental service and no new manufacturing Q."
      inputs:
        - H
        - Q_H
        - "actual service"
        - "unused unassigned charge"
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_asset
      applies_to: "all inventory rows"
      rule: "Determine embodied service A from real deployment/use/intensity/capacity and evidenced service capability under subdivision/causality/residual allocation. Keep full whole-asset/part/fluid gross custody and wet installed stocks separately. No whole machine per kg, fixed life, duplicate provider purchase or automatic retirement credit. Only unused/unassigned vector carries; closing pearl FG does not remove performed service."
      inputs:
        - "asset vector"
        - "actual use"
        - capacity
        - cohort
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_gross
      applies_to: "all inventory rows"
      rule: "Every explicitly gross card uses A=V, its complete actual physical leg in native extensive units. No stock correction, B_open+U-B_close, economic share, burden vector or net delivery changes V. X_in/out eliminate only overlaps with other real inlet/outlet terms; retained additions remain influx plus full closing wet mass. Gross q is disclosure, never extra purchase/provider multiplier/credit; true burden owner is attributed once independently. X follows calc_pack: subtract only a proven same-event/material duplicate in another OTHER same-side flow. Real F increments and complete wet closing stock coexist; neither a stock nor a burden vector replaces a physical flow."
      inputs:
        - V
        - "actual direction"
        - "disjoint source pools"
      output: "A"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "q=A/Q. Execute this sole quotient once after raw conversion and the one applicable tagged burden/service/gross numerator rule. Manufacturing Q is unique first-accepted net pearl kg; service uses original Q_H over observed H. Reference output is 1 kg. Q=0 preserves every real load/physical leg with no unit q. Cards and aggregation reference this same operation and never divide q again."
      inputs:
        - A
        - Q
        - Q_H
        - H
      output: "q"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "At manufacture, released-FG and consolidated gates separately: full wet opening stock+all real gross inflows=full wet closing stock+all real gross outflows, with only independently evidenced transformations and uncertainty. Internal transfers cancel. Reconcile live animals/grafts/shell/tissue/bare pearls and independent C/Ca/N/P pools; no indicator-to-molecule guess or two-unknown fit from one residual. Free/structural/reaction water and actual phases remain distinct; no economic scaling of physical totals."
      inputs:
        - "full wet opening closing"
        - "all gross legs"
        - "independent phase and element observations"
      output: "physical reconciliation"
      source_ids:
        - fao-freshwater-pearl-1986
        - ilcd-attributional-2010
    - id: calc_pack
      applies_to: "all inventory rows"
      rule: "For each actual packaging material or whole-article pool O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C includes full wet empty, attached-WIP, attached-FG and reusable stock; S is gross shipment, never Q or net delivery. P and I are mutually exclusive for the same physical incoming event, independent of burden shares. F_in/F_out are independently measured true material or water additions/removals from actual repair, cleaning or ordinary sorption/loss, with event identity, phase and destination; never residual-fitting terms. X_in/X_out subtracts only the exact event/material amount proved duplicated in another actual OTHER incoming/outgoing flow on the SAME side. Never subtract a stock, the opposite side, mere card presence or real ingress retained in C. Complete wet articles and a mutually exclusive component bridge are alternative ledgers; internal transfers/reuse cancel once. Real segregated waste departures use their own complete card; one actual mixed_packaging_waste outlet has one measured total and one receiver/treatment provider, with independently measured disjoint origin_W subaccounts that sum to that total and are not additional exported exchanges or treatment amounts. Unknown origins remain unresolved, no invented mixture. Whole bag/lining/thread and complete preparations are procured once; actual burden ownership and allocation stay separate from full gross V."
      inputs:
        - O
        - P
        - I
        - ER
        - C
        - S
        - EO
        - W
        - F_in
        - F_out
        - X_in
        - X_out
        - same_side_OTHER_event
        - origin_W
        - single_receiver_provider
      output: "packaging reconciliation"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Whole unworked pearl Product identity is required; each auxiliary obeys its own material/CAS/form/route/type/phase/geography/media/property restrictions. Unknown auxiliary/provider is disclosed, not zero or another family."
      evidence: "supplier/native context; taxon; terminal tests"
    - id: dq_coverage
      applies_to: "cohorts and H"
      requirement: "Capture all life cohorts, raw/WIP, deaths/failures/zero harvest/idle/cleanup and inherited vectors; separate released FG and actual H. No theoretical pearl rate or timeline as output."
      evidence: "linked live/release/service registers"
    - id: dq_measurement
      applies_to: "each dimension"
      requirement: "Require calibration, representative sample range, original unit/state and uncertainty; totals/components/elements/indicators do not double count. Unknown actual amounts prevent complete site results."
      evidence: "raw meter/scale/sample records"
    - id: dq_allocation
      applies_to: "burden dimensions"
      requirement: "Retain raw/attributed vectors, causal justification, residual same-gate market evidence if needed, ownership and sensitivity. Conditional cards are not observed factory quantities."
      evidence: "allocation ledger and actual scope"
validation_rules:
  - rule_id: validation_terminal
    applies_to: "finished_pearl"
    rule: "Reject whole animal/shell/meat/gemstone/artificial/worked/mounted reference. Confirm actual bare unworked tissue-grafted freshwater state and compatible whole native Product. A real missing core identity or terminal prevents usable guidance."
    source_ids:
      - unsd-cpc3-2025
      - fao-freshwater-pearl-1986
      - fao-marine-pearl-1991
  - rule_id: validation_q
    applies_to: "all rows"
    rule: "Q includes closing released FG once, without extra FG production or burden deduction. H uses original Q_H; real unpermitted/failed work stays with actual hold/waste, not zero."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validation_measurement
    applies_to: "all inventory rows"
    rule: "Execute all finite declared-reference checks. Preserve complete atomic rows, native units and sole quotient. A method check verifies neither future activity amounts nor science; unsupported relationships remain review-required."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validation_balance
    applies_to: "all gates"
    rule: "Reconcile living cohorts, WIP/FG, full physical manufacture/FG/consolidated gates, packaging six legs, assets/repairs/water and independently relevant elements. No two-unknown residual, double provider, whole/component duplicate, ordinary waste burden subtraction or calcification CO2 credit."
    source_ids:
      - fao-freshwater-pearl-1986
      - ilcd-attributional-2010
  - rule_id: validation_evidence
    applies_to: "all rules and source use"
    rule: "Every source retains actual product/process/route/state/need and limits. Freshwater manual provides no universal dose/yield/time; marine polishing is excluded; ILCD supports allocation only. Report ordinary auxiliary/provider gaps separately from true core holds. Mechanical checks approve no mapping/science/translation/publication."
    source_ids:
      - fao-freshwater-pearl-1986
      - fao-marine-pearl-1991
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Route-specific attributional first-acceptance production plus separately identified actual original-cohort services; complete raw/gross and burden-owner bridge required."
  excluded_use: "Default factors, generic pearl industry average, natural/marine/worked extrapolation, certification, avoided credits or complete-site claims without actual measurements."
  required_metadata: "host and donor taxon; live-source provenance and provider boundary; freshwater site and route; tissue only and no added bead; cohort and opening/closing live stock; failures and mortality; harvest identity; bare whole unworked terminal; cleaning/drying history; measured moisture; net mass and count sampling range; actual grade/acceptance; first release gate and unique Q; WIP versus released FG; co-functions and allocation; actual packaging; service H and original Q_H; native and provider restrictions"
  required_quality_disclosure: "Measured/unknown, conditional exchanges, ordinary auxiliary/provider gaps, any true core hold, full gross/burden reconciliation, representativeness, uncertainty and unreviewed scope."
  update_trigger: "Terminal/treatment, species/route/provider, reference property, real extra atom, cohort gate, allocation or evidence changes."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025, p.189; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "38210 unworked terminal and adjacent 38220 worked pearls / 38240 jewellery; classification only, no recipe."
  - id: "fao-freshwater-pearl-1986"
    type: "handbook"
    reference: "R. Pagcatipunan, FAO TCP/BGD/4508, Technical Assistance on Pearl Culture in Bangladesh (1986), Appendix 1 sections 2–6.7 and Figures 1–7; https://www.fao.org/4/S2622E/S2622E05.htm"
    used_for: "Qualitative live source, donor mantle tissue-only route, recovery, pond care/mortality, harvest/drying; adjacent natural/artificial/gonadal routes as exclusions. No numerical recipe, universal yield/time or allocation."
  - id: "fao-marine-pearl-1991"
    type: "handbook"
    reference: "FAO/UNDP Regional Seafarming Development and Demonstration Project, Pearl Oyster Farming and Pearl Culture (1991), Chapter XIII 13.1–13.3; https://www.fao.org/4/ab726e/AB726E13.htm"
    used_for: "Counterevidence: marine bead implantation, chemical recovery and refined-salt polishing cannot be spliced into this freshwater tissue-only unworked route."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA – Detailed guidance, first edition March 2010, 7.9.2–7.9.3, printed pp.255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional applicability, subdivision, exchange-specific determining causality, residual same-gate/state market value and reconciliation; not pearl production quantities."
