allocation_rules:
  - rule_id: allocation_context
    applies_to: "all co-functions"
    rule: "Use only attributional modelling in the ILCD allocation-applicable context. Identify actual pearls, shells, tissue, other real co-functions and the common process gate. No free physical/economic choice, fixed ratio, free shells, avoided-product credit or ecosystem offset."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_subdivision
    applies_to: "each exchange"
    rule: "First isolate dedicated operations, batches, meters, materials/treatment and real or virtual subdivision. Exclusive grafting/pearl grading needs demonstrated exclusive function; do not assign all pond activity solely to pearls. Retain mortality/failure and ordinary treatment with the real cohort unless a justified distinct function/handover exists."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_causality
    applies_to: "each remaining burden dimension"
    rule: "Test the exchange-specific determining physical causal relationship: which function causes its type/amount and how does a quantified function change alter the exchange? Actual embodiment, intensity, occupied capacity and duration may matter, not arbitrary total output-mass share. Different exchanges may have different evidenced drivers; complete gross masses/volumes remain unchanged."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_residual
    applies_to: "true residual joint burden"
    rule: "Only for real residual after subdivision and determining causality use actual same-gate, same-state, same-quantity-basis, same-geography contemporaneous market values. Derive gate value transparently from later processed/packed/delivered prices by removing actual added services. Disclose dates/status/uncertainty/sensitivity. Waste or unsold status is not automatic zero, credit or a fixed ratio. Allocated vectors sum to the unallocated total."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_losses
    applies_to: "ordinary wastes and handover"
    rule: "Ordinary manufacturing waste/rejects/breakage/failed grafts/samples and their treatment are not T_other merely because exported or sold. Transfer a vector only for a real other cohort/function with justified allocation and recorded one-time handover; all gross legs stay complete. One physical outlet cannot simultaneously be both Product and Waste or receive automatic expansion credit."
    source_ids:
      - ilcd-attributional-2010
