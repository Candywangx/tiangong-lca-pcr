  calculation_rules:
    - id: prepare_numerators
      applies_to: "all inventory rows"
      rule: "Convert raw units and genuine rates first. Keep physical gross V from actual directional boundary crossings and separate stock accounts. Derive attributed A exchange by exchange through b_wip_vectors, b_services and section 7; preserve provider ownership and no second netting. For the release row Q is raw first-released net mass. This step performs no division."
      inputs:
        - cp_release
        - cp_materials
        - cp_water
        - cp_energy
        - cp_pack
        - cp_waste
        - cp_air
        - cp_history
        - cp_tools
      output: "V; A; Q; Qc with native units and provenance"
      source_ids:
        - ilcd-2010
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "For Q > 0 execute n_i / Q exactly once for the selected view: n_i = V_i for the full physical view or n_i = A_i for the separately attributed burden view. Services attached to cohort c use that same cohort Qc as Q; H is not a divisor. finished_painting has n_i = Q and equals 1 kg. Cards and protocol aggregation reference this result without dividing it again. Never add physical and burden views. Q = 0 retains raw records and no unit result."
      inputs:
        - V
        - A
        - Q
        - Qc
        - cp_release
        - cp_history
      output: "Distinct physical and attributed amounts per 1 kg reference flow"
      source_ids: []
    - id: check_physical
      applies_to: "all inventory rows"
      rule: "Independently reconcile manufacturing, FG and combined wet-mass gates under b_physical_gates, each packaging closure under b_pack and relevant elemental/species ledgers under b_species. Keep residuals and uncertainties without inventing a balancing flow. These are raw reconciliation diagnostics and perform no additional normalization."
      inputs:
        - cp_release
        - cp_materials
        - cp_water
        - cp_pack
        - cp_waste
        - cp_air
        - cp_history
      output: "Raw gate residuals and unresolved evidence"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each exchange"
      requirement: "Confirm all native names/synonyms/comments, CAS, type, geography, route/form and all properties against the real exchange. Keep provider compatibility separate. Named auxiliary UUID gaps do not erase the exchange; actual complete-core incompatibility blocks that dataset’s applicability."
      evidence: "Full specifications and identity/provider evidence"
    - id: dq_scope
      applies_to: "whole route"
      requirement: "Record actual input supply state, complete original-work configuration and all qualifiers. Manufacturer qualitative examples do not establish common SKU/artist/order, dimensions, recipe, emissions or current batch composition."
      evidence: "wn-canvas; wn-priming; gamblin-colors; gamblin-safflower-sds"
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "Same site, cohort, sampling scope and actual dates; retain calibration, raw readings, failed/Q0 runs, start/stop/idle and cleaning. Quantify meter/sample uncertainty and omitted periods. An unknown quantity or species is not zero."
      evidence: "Raw protocol records and coverage ledger"
    - id: dq_chemistry
      applies_to: "paint and drying"
      requirement: "Full purchased formulations and non-additive composition are separate from independent oxygen/water/species evidence. No oxidation rate, VOC fraction, metal species or density is inferred from a marketing statement, colour name or mass discrepancy."
      evidence: "gamblin-colors; gamblin-solventfree"
    - id: dq_services
      applies_to: "cohort c"
      requirement: "Disclose observation H and actual performed service attribution, original Qc and return reversals. Future service remains outside observed values; held work does not delete already performed service."
      evidence: "cp_history"
    - id: dq_handover
      applies_to: "finished_painting"
      requirement: "Retain real surface/support and handling tests with actual state and first-release event; no default cure duration, conservation/transport certification or artistic-value equivalence."
      evidence: "wn-drying"
validation_rules:
  - rule_id: v_scope
    applies_to: "finished_painting"
    rule: "Confirm complete newly hand-painted original on the declared purchased primed stretched cotton/wood support with the two supplied colours and actual unvarnished handover state. Reject unsupported alternative terminal/route and borrowed paint, cloth, frame, reproduction or digital identities."
    source_ids:
      - wn-canvas
      - wn-priming
      - gamblin-colors
  - rule_id: v_reference
    applies_to: "finished_painting"
    rule: "Require one linked Product reference output of 1 kg and Mass/kg. Whole-work measured net mass defines Q; actual count/area are descriptors. Match the reference definition to the sole finished_painting output and keep its unresolved identity explicit; no artistic-works mixture or kg-per-piece guess is permitted."
    source_ids: []
  - rule_id: v_release
    applies_to: "Q and history"
    rule: "Check unique first release, failed tests, opening/closing WIP vectors and no FG double deduction. Q0 blocks unit normalization but preserves loads. No extra Q on delivery, reinspection or return; only actual incremental services/repair."
    source_ids: []
  - rule_id: v_one_division
    applies_to: "all inventory rows"
    rule: "Raw protocols do not divide. Verify original-unit conversion and actual attribution before the sole normalize_exchange. Both languages use the same Q/Qc, units, IDs and qualifiers. H never divides, and aggregation/cards never divide the normalized result again. Physical V and burden A views remain distinct."
    source_ids: []
  - rule_id: v_gates
    applies_to: "physical ledgers"
    rule: "Check whole-wet or exclusive bridge, manufacturing/FG/combined state consistency, internal handoff cancellation and actualflow-ID/direction-only OTHER deduplication. Independent oxygen and water evidence is required for dependent closure. Preserve residuals and all actual exports; no stock/opposite-flow cancellation or fitted correction."
    source_ids: []
  - rule_id: v_packages
    applies_to: "all packaging"
    rule: "Check the full opening/purchase/return/closing/gross-dispatch/waste equation separately for every component, including attached and reusable stocks. Exclude packing from Q; internal reuse is not purchase or co-product. Complete upstream package burden is not charged twice."
    source_ids: []
  - rule_id: v_species
    applies_to: "each elementary exchange"
    rule: "Require real species, phase, media and net environmental crossing evidence. No total-VOC/COD/metal surrogate species; no false combustion, imported steam or borrowed isotope/particle identity. Additional real species need separate atomic rows and all adopted restrictions in consumed context."
    source_ids: []
  - rule_id: v_waste
    applies_to: "all waste rows"
    rule: "One physical mixed waste is one measured whole export/receiver; originW is non-additive. Segregated exports must not overlap contaminated cloth, free oil, liquid, containers or rejected work. Sale does not grant automatic credit."
    source_ids:
      - ilcd-2010
  - rule_id: v_completeness
    applies_to: "dataset use"
    rule: "Require actual quantities, all present auxiliary/tool/package exchanges, provider links, unit basis, inherited burdens, observation coverage and uncertainty before claiming a complete dataset. Ordinary supplier/quantity/auxiliary-identity gaps remain disclosed without falsely declaring the core method unavailable; true core/route incompatibility prevents its use."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared original-painting route/configuration and observed cohort/site/provider; one kg is an accounting basis for complete works"
  excluded_use: "Whole CPC coverage; art-value or lifetime equivalence; authentication; safety certification; restoration/auction/retail impacts; unobserved future storage/transport or lifecycle claims"
  required_metadata: "All qualifiers; first-release Q/Qc and physical configuration; actual upstream handoffs; native provider basis; separate V/A/stock ledgers; service H; additional atomic exchanges"
  required_quality_disclosure: "Scientific/translation review status separately governed; sampling uncertainty, failed/Q0 events, UUID/provider gaps, actual composition/species limits, non-additive views and unobserved services"
  update_trigger: "Changed complete support, colour/medium/finish, handover state, physical route, supply geography/voltage, provider or attribution evidence"
data_sources:
  - id: "wn-canvas"
    type: "handbook"
    reference: "Winsor & Newton, Understanding canvas options: Boards, Rolls, Sheets, and Papers. https://eu.winsornewton.com/blogs/guides/understanding-canvas-options-boards-rolls-sheets-and-papers"
    used_for: "Complete prepared support versus board/roll/paper alternatives; no onsite support fabrication claim"
  - id: "wn-priming"
    type: "handbook"
    reference: "Winsor & Newton, A guide to sizing and priming canvas. https://www.winsornewton.com/blogs/guides/sizing-and-priming-canvas-guide"
    used_for: "Purchased acrylic-primed cotton stretched canvas and optional preparation distinctions; no required extra ground"
  - id: "gamblin-colors"
    type: "handbook"
    reference: "Gamblin, Artist’s Oil Colors; Titanium White and Burnt Umber entries with adjacent alternatives. https://gamblincolors.com/oil-painting/color/artist-grade-oil-colors/"
    used_for: "Actual complete colour identity and vehicle; no recipe, proportion, thickness or paint quantity default"
  - id: "gamblin-solventfree"
    type: "handbook"
    reference: "Gamblin, Solvent-Free Painting. https://gamblincolors.com/solvent-free-painting/"
    used_for: "Direct solvent-free oil painting; oxidative drying; separate safflower/two-rag cleaning and limitations; no numeric or universal safety claim"
  - id: "gamblin-safflower-sds"
    type: "handbook"
    reference: "Gamblin, Safety Data Sheet: Safflower Oil, revised 2015-11-17, sections 1, 3, 7 and 13. https://www.gamblincolors.com/wp-content/uploads/2016/03/SDS-Safflower-Oil.pdf"
    used_for: "Refined linoleic safflower oil identity and CAS; changed waste composition requires actual receiver evidence; historical SDS is not a current batch assay or legal approval"
  - id: "wn-drying"
    type: "handbook"
    reference: "Winsor & Newton, What are the drying times for Winsor & Newton Oil colours? https://www.winsornewton.com/blogs/guides/understanding-drying-times-for-oil-colour"
    used_for: "Touch-dry versus actual state and different pigment/water-miscible/alkyd routes; examples are not timing/varnish/handling defaults for Gamblin"
  - id: "ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for LCA—Detailed guidance, first edition March 2010, sections 7.9.2–7.9.3, printed pp.255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision; exchange-specific determining physical causality; justified residual common-gate/state market values; not industrial manufacturing evidence"
