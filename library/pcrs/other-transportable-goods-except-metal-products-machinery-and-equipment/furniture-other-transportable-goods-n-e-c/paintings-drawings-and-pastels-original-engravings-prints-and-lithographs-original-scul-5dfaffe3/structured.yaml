      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Complete primed cotton/wood stretched support and complete artist colours received; prior manufacture remains linked upstream |\n| starting_condition_role | intermediate_product |\n| product_classification_scope | Only the original oil-painting physical variant within CPC 3.0:38961 |\n| recursive_input_rule | No bought finished artwork treated as blank support. Actual returned or unfinished works retain identity and inherited burden vectors; no recursive restart or new Q on reinspection |\n| upstream_dataset_requirement | Link actual complete support manufacture including timber/cotton/primer/sizing/fastenings; each formulated paint and cleaning oil; utilities; each tool and package; transport and compatible waste treatment once |\n| disclosure | Separate foreground operations from supplier manufacture and observed post-release services; declare actual geography/provider/period and all gaps. Identity is not a supply dataset |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_classification | finished_painting | Apply the original physical painting, reproduction, licence and service distinctions in section 1; document actual delivered object and contract deliverables. The accepted narrower association applies to the physical work under these conditions. | unsd-cpc3-2025 |\n| b_complete | painting | Include all receiving, dispensing, mixing, hand painting, trial/rejected attempts, start/stop/idle, drying, inspection, cleanup and real rework; retain stage meters inside one aggregated manufacturing unit. Purchased wood-frame construction, cotton weaving, sizing, priming and pigment/paint milling occur upstream unless actually performed onsite. No boiler, steam or forced thermal cure is presumed. | wn-canvas; wn-priming; gamblin-solventfree |\n| b_release | finished_painting | Release only the complete uniquely identified original after actual declared surface integrity, absence of transferable wet paint under the intended non-damaging handling test, support integrity and authorized acceptance have been recorded. Declare temperature/humidity, examination method, evidence and exceptions. Authorization cannot erase a real failed test. Neither source time ranges nor touch dryness prove full cure, safe transport under every condition or authentication. | wn-drying |\n| b_qgate | painting | Q is first release, not shipments. Opening/closing raw stock and WIP are separate physical accounts. Q includes closing FG. Rejects, trials and unproductive cleanup retain their loads with their causal cohort; Q=0 retains raw loads and cannot produce unit results. Retesting, storage or delivery never creates another first release. |  |\n| b_wip_vectors | painting | For every work and every exchange preserve opening/closing WIP stage and inherited vectors. Form attributable manufacturing A from the opening WIP burden brought into this cohort plus genuinely new measured loads, minus only closing unreleased WIP and correctly segregated non-WIP carryovers. Preserve failed/rework loads. A raw material already netted for stock/returns is not netted again. Closing released FG is never a manufacturing Bclose deduction. |  |\n| b_services | post-release services | Record actual packaging, storage, handling and dispatch services through observation H against original release cohort c and its Qc. Already performed services remain attributable even when works are held; H is a coverage end/time, never another divisor or a predicted lifetime. In a combined result add manufacturing and actual service numerators before the one division by Qc, or add their already normalized results once without dividing again. State the observation gap for future service. |  |\n| b_returns | returned works | Returned previously released work carries its original mass/state and burden identity. Reverse the original delivery/custody entry when appropriate and record only actual incremental repair/service with the original cohort; no second Q or fresh full manufacture. Physically changed mass, moisture and actual discarded work remain in their gates. Natural moisture drift is not fabricated repair. Genuine new replacement works require their own first-release identity and no deletion of the failed predecessor. |  |\n| b_physical_gates | painting and FG | Manufacturing closes opening raw/WIP plus actual external inflows and independently established oxygen/water ingress against closing raw/WIP, Q, measured wastes, external returns and real releases. FG closes opening FG plus internal Q and real external returned works plus actual post-release ingress against closing FG, gross dispatched works, FG wastes and actual releases. Use matched physical states; internal Q cancels in the combined gate. Whole wet works already contain their retained water and oxygen. Every OTHER term is an actualflow-ID/direction list, deduplicated only against the same-direction real crossings already counted; neither stocks, opposite-direction flows nor the mere presence of a card cancel an actual external flow. |  |\n| b_species | oxygen; water_vapour; actual extra species | Establish atmospheric oxygen uptake independently from emitted/retained water and actual organic species using suitable measurements, blanks and uncertainty. Only net chemical uptake is a resource exchange, not all ventilation air. Separate reaction water, free liquid, structural/bound water and phase changes where evidence shows them. Total VOC, COD, total metal and a mass residual are indicators, never a specific species or several fitted unknowns. No routine CO2 combustion flow follows merely from oxidation drying. Add each actually demonstrated species and its real recipient atomically. | gamblin-solventfree |\n| b_pack | each package | For each actual packaging component separately reconcile opening empty/attached-to-WIP/attached-to-FG/reusable stocks + purchases + external returns received = closing equivalents + packaging leaving with gross physical dispatch + external package returns + waste. Internal reuse cancels and is not another purchase. Packaging is outside net Q. Supply packaging burdens are included once through its complete supplied-product provider or a separate package provider; physical tare is still recorded. Detachable closure/insert/film actually separate in supply or disposal requires its own atomic row. |  |\n| b_tools | each durable tool | Record each actual brush, palette, easel and containment vessel in the tool-owner register with full physical acquisition/stock/retirement, measured use cohort and inherited manufacture/maintenance loads. Attribute documented service loads to painting cohorts without multiplying full manufacture by each reuse. Add individual atomic tool/service and retirement exchanges when the declared study boundary includes them; no invisible collective equipment input or assumed lifetime. No retained tool is part of artwork Q. |  |\n| b_waste | all waste rows | Record segregated real wastes by state and recipient. If residues are actually mixed, record one measured mixed stream and one receiving provider; origin-W fractions are measured non-additive subaccounts, not additional whole waste outputs. Selling waste creates no automatic co-product or avoided burden. Actual recovery or external returns need their own documented boundary; indoor exposure is not an environmental release. | gamblin-safflower-sds |\n| b_extend | actual additional exchanges | Survey every actual added colour, medium, soap, glove, supply wrapper, closure, packing insert/tape, utility, maintenance item and real species. Each physically present additional input/output needs a specific atomic row, measurement and compatible provider or disclosed identity gap before a complete dataset claim. Conditional absence requires evidence; do not turn unknown manufacturing or export into zero, an unnamed OTHER flow or an unobserved boiler/condensate. |  |\n\n"
