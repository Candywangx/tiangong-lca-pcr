allocation_rules:
  - rule_id: a_separate
    applies_to: "all activities"
    rule: "This is an attributional allocation-requiring context only. First dedicate records/meters and subdivide or virtually subdivide actual stages to identify each exclusive input/output. Assign whole support and each actual consumed colour to its own work; do not allocate these by artwork price."
    source_ids:
      - ilcd-2010
  - rule_id: a_causal
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange identify and quantify the determining physical causal relation to actual co-functions. Different exchanges may need different drivers. Demonstrate whether drying-space occupation/time, measured lighting or ventilation demand, cleanup events or other actual service intensity determines that exchange; mass/area/time alone is not automatically causal. Preserve direct assignment and share closure."
    source_ids:
      - ilcd-2010
  - rule_id: a_residual
    applies_to: "only justified residual shared load"
    rule: "Only when no determining physical relation can be established for a residual load, document why, then use contemporaneous market values at the same common process gate, actual state and quantities. Remove downstream framing/retail/auction/transport effects before deriving that value. Aesthetic reputation, auction estimates or a fixed price share are not defaults. Missing representative values leave this residual unresolved with sensitivity and uncertainty, not a chosen arbitrary ratio."
    source_ids:
      - ilcd-2010
  - rule_id: a_physical
    applies_to: "physical and burden ledgers"
    rule: "Never scale physical gross exchanges or co-product mass by environmental allocation shares. Keep gross V in native units, stock custody and the separately attributed exchange-load vector A with each provider basis. Report actual full physical V/Q and attributed A/Q as distinct non-additive views; a consumer unable to represent both must use an explicit linked process/service ledger, not add or conflate them."
    source_ids:
      - ilcd-2010
  - rule_id: a_waste
    applies_to: "waste and rejected works"
    rule: "Waste sales do not automatically change status or create credits. Preserve treatment burdens and failed-work history. Co-product status, actual receiver function and any recycling convention require evidence and a declared study boundary; no automatic substitution or fixed split in this attributional variant."
    source_ids:
      - ilcd-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "painting"
      flow_role: "finished_painting"
      record_type: "collected_record"
      raw_fields: "work ID; first release timestamp; complete configuration; net whole mass; actual moisture/state; count; measured contour/area; acceptance test; failed events; Q cohort"
      collection_method: "Calibrated net weighing of each whole accepted work at its documented release state; retain tare, uncertainty, matched configuration and authorized physical tests. Record failed tests and corrections without replacing originals."
      unit: "kg"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
      site_scope: "Declared studio and linked supplier/receiver/tool boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; supplier/receiver specifications; uncertainty and coverage"
    - protocol_id: cp_materials
      process_id: "painting"
      flow_role: "canvas; white; umber; safflower; cloth"
      record_type: "collected_record"
      raw_fields: "row_id; supplier/grade/batch; complete supplied mass; receipts/issues/returns; raw stocks; container tare; actual assays; support composition; reuse transfers; provider basis"
      collection_method: "Weigh each complete supplied input and reconcile stores, palette, cleaning jar and work history separately; record whether a reported amount is already net. Assays are constituent descriptors; do not add embedded oil/pigment/primer again."
      unit: "kg"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
      site_scope: "Declared studio and linked supplier/receiver/tool boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; supplier/receiver specifications; uncertainty and coverage"
    - protocol_id: cp_water
      process_id: "painting"
      flow_role: "water"
      record_type: "collected_record"
      raw_fields: "meter ID; supplied volume or mass; actual density/temperature; makeup use; water in formulations/support; stocks; collection and vapour evidence"
      collection_method: "Weigh or meter actual separate water supply and independently measure density for any volume conversion; identify external versus internal water and preserve raw counter readings."
      unit: "kg"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
      site_scope: "Declared studio and linked supplier/receiver/tool boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; supplier/receiver specifications; uncertainty and coverage"
    - protocol_id: cp_energy
      process_id: "painting"
      flow_role: "electricity"
      record_type: "collected_record"
      raw_fields: "meter interval; kWh; delivery voltage; supply geography; provider; each stage load; start/stop/idle; shared driver; cohort/H"
      collection_method: "Read real submeter or reconciled supply-meter intervals; attribute exclusive and shared measured demand by the declared hierarchy. Convert kWh to MJ before normalization, retaining both values; do not estimate from nameplate power without measured operation evidence."
      unit: "MJ"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
      site_scope: "Declared studio and linked supplier/receiver/tool boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; supplier/receiver specifications; uncertainty and coverage"
    - protocol_id: cp_pack
      process_id: "painting"
      flow_role: "carton; paper; white_tube; umber_tube; oil_bottle; carton_out; paper_out; waste_carton; waste_paper; white_tube_waste; umber_tube_waste; oil_bottle_waste"
