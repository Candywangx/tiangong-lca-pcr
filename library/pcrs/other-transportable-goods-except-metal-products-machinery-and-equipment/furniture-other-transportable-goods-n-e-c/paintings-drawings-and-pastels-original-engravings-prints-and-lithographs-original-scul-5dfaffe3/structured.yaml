      record_type: "collected_record"
      raw_fields: "tool ID/material/configuration; full acquired/retained/returned/retired mass; ownership; actual use dates/cohort; inherited manufacturing and maintenance vector; measured allocation driver"
      collection_method: "Maintain individual owner/custody and actual service-use records; add one exact atomic exchange for each included tool/service and retirement rather than a collective row. Allocate documented manufacture/maintenance over the observed supported cohort only; preserve unassigned stock and uncertainty, not assumed future lifetime."
      unit: "native units by tool/service"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
