      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_separate | all activities | This is an attributional allocation-requiring context only. First dedicate records/meters and subdivide or virtually subdivide actual stages to identify each exclusive input/output. Assign whole support and each actual consumed colour to its own work; do not allocate these by artwork price. | ilcd-2010 |\n| a_causal | remaining shared exchanges | For each remaining exchange identify and quantify the determining physical causal relation to actual co-functions. Different exchanges may need different drivers. Demonstrate whether drying-space occupation/time, measured lighting or ventilation demand, cleanup events or other actual service intensity determines that exchange; mass/area/time alone is not automatically causal. Preserve direct assignment and share closure. | ilcd-2010 |\n| a_residual | only justified residual shared load | Only when no determining physical relation can be established for a residual load, document why, then use contemporaneous market values at the same common process gate, actual state and quantities. Remove downstream framing/retail/auction/transport effects before deriving that value. Aesthetic reputation, auction estimates or a fixed price share are not defaults. Missing representative values leave this residual unresolved with sensitivity and uncertainty, not a chosen arbitrary ratio. | ilcd-2010 |\n| a_physical | physical and burden ledgers | Never scale physical gross exchanges or co-product mass by environmental allocation shares. Keep gross V in native units, stock custody and the separately attributed exchange-load vector A with each provider basis. Report actual full physical V/Q and attributed A/Q as distinct non-additive views; a consumer unable to represent both must use an explicit linked process/service ledger, not add or conflate them. | ilcd-2010 |\n| a_waste | waste and rejected works | Waste sales do not automatically change status or create credits. Preserve treatment burdens and failed-work history. Co-product status, actual receiver function and any recycling convention require evidence and a declared study boundary; no automatic substitution or fixed split in this attributional variant. | ilcd-2010 |\n\n"
