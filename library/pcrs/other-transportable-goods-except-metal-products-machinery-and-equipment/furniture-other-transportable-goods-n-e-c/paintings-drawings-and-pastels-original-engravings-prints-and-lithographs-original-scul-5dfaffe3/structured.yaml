measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference is 1 kg of net complete first-released paintings, a native mass accounting basis, never a cut portion of an artwork. cp_release weighs each complete work at its actual release state including retained support and moisture; exclude transport packaging. Count and measured contour/area are additional descriptors, not mass converters."
  - id: single_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of the measured net masses at unique first whole-work releases of the declared cohort. Closing FG already belongs to Q; never subtract it again from manufacturing burdens. All normalized records use per 1 kg reference flow. Raw collections remain undivided; normalize_exchange alone divides each qualified numerator by Q once."
  - id: native_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual native property"
      uuid: ""
    required_unit: "kg or MJ as declared"
    rule: "Preserve measured units; convert kWh to MJ by 3.6 before normalization. Weigh liquids directly or use independently measured substance-specific density at recorded temperature. Never infer density from a secondary native coefficient or apply water density to paint/oil. Integrate a true rate over time; an already integrated volume is not multiplied by time again."
  - id: complete_formulations
    applies_to: "white; umber; safflower"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Each purchased complete paint is counted once. Pigment, bound oil, additive and water assays are non-additive constituent subledgers. Independently added oil/medium/cleaner requires its own real purchase and process losses; unknown composition is not zero."
  - id: physical_mass
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use whole wet-work mass or a mutually exclusive dry-matter/water/retained-oxygen bridge, never both. Maintain unallocated total mass and relevant C/H/O/Ti/Fe/Mn ledgers independently of real species evidence. One residual cannot fit two unknowns such as oxygen uptake and water loss."
