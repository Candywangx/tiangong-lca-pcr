      raw_fields: "component ID/material; configuration; net tare; attached residue; opening/closing empty/WIP/FG/reusable stocks; purchases; external returns received; gross dispatch package mass; external returns sent; waste; provider ownership"
      collection_method: "Weigh each actual component and its attached contents independently, reconcile the full b_pack equation and match shipment custody. Preserve gross physical dispatch even for returned works; no net sales denominator or repeated procurement on reuse."
      unit: "kg"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
      site_scope: "Declared studio and linked supplier/receiver/tool boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; supplier/receiver specifications; uncertainty and coverage"
    - protocol_id: cp_waste
      process_id: "painting"
      flow_role: "rejected_work; oily_cloth; spent_oil; cleanup_liquid"
      record_type: "collected_record"
      raw_fields: "actualflow ID/direction; origin and stage; whole wet mass; water/solids; actual species/elemental assay; mixed-container ID; non-additive originW; waste stock; receiver/transport/treatment"
      collection_method: "Weigh actual segregated exports and obtain receiver acceptance and composition evidence. A mixed outlet is weighed once, with measured origin fractions only as subaccounts. Preserve actual treatment and residue burden even in zero-output or failed campaigns."
      unit: "kg"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
      site_scope: "Declared studio and linked supplier/receiver/tool boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; supplier/receiver specifications; uncertainty and coverage"
    - protocol_id: cp_air
      process_id: "painting"
      flow_role: "oxygen; moisture_in; water_vapour; actual added species"
      record_type: "collected_record"
      raw_fields: "species/CAS; resource/emission; medium; outlet/inlet; true rate or integrated volume; sampling period; temperature/pressure; background; moisture; oxygen uptake; independent assay; blanks/detection limits"
      collection_method: "Measure matched boundary flows with compatible species/phase sampling, humidity and oxygen evidence. Integrate concentration with true flow rate or multiply by already integrated compatible volume once; convert actual/standard and wet/dry gas conditions explicitly. Separate uptake, emitted species and retained/stock composition; no single-residual multi-unknown fit."
      unit: "kg"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
      site_scope: "Declared studio and linked supplier/receiver/tool boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; supplier/receiver specifications; uncertainty and coverage"
    - protocol_id: cp_history
      process_id: "painting"
      flow_role: "all inventory rows"
      record_type: "collected_record"
      raw_fields: "cohort/work/stage ID; opening/closing raw/WIP/FG; raw/non-WIP separation; inherited vector per exchange; already-net flag; rejected attempts; real rework; returns and original delivery reversal; actual incremental service; H"
      collection_method: "Reconcile immutable work-event histories and physical stocks with a separate exchange-load ledger. Carry opening/closing WIP vectors, retain failures, exclude closing FG from manufacturing carryover subtraction and attach performed services to original Qc. No invented repair for natural moisture drift."
      unit: "native units by exchange"
      frequency: "Each event and reconciled period"
      temporal_coverage: "Complete cohort including failed/Q0/start-stop/idle/cleanup; actual H for services"
      site_scope: "Declared studio and linked supplier/receiver/tool boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; original records; supplier/receiver specifications; uncertainty and coverage"
    - protocol_id: cp_tools
      process_id: "painting"
