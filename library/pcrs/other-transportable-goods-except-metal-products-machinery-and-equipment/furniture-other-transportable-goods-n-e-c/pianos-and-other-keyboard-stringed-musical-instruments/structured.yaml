          markdown: "# Wooden-rim acoustic grand piano manufacturing\n\nThis is a qualitative technical synthesis of one actual wooden-rim acoustic-grand manufacturing route, not a measured single factory/order, numerical recipe or approval. Subsequent raw quantities require real collection; unknown amounts are not zero.\n\n"
    - unit_id: "normative_224428"
      family: "allocation"
      span:
