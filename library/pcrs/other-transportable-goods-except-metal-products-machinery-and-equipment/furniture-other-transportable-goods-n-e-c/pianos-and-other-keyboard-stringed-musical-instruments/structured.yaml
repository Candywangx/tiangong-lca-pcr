allocation_rules:
  - rule_id: allocation_scope
    applies_to: "attributional modelling"
    rule: "Use this hierarchy only where the stated attributional goal and decision context justify allocation. It is not a free choice between substitution and allocation and does not approve a consequential study or multifunctional-product QFD comparison."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_subdivide
    applies_to: "each burden dimension"
    rule: "First collect separately for exclusive stages/cohorts and apply supported real or virtual subdivision. Each supplied component and its embodied input belongs once to the receiving instrument cohort. Separate genuine other functions from shared production with causal evidence and vector conservation."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_causal
    applies_to: "remaining shared exchanges"
    rule: "For each still-shared exchange establish the determining physical cause and its measured driver. A heat/conditioning burden may depend on actual treated load/state; equipment or storage service can depend on measured occupation and physical capacity. Demonstrate each relation; do not impose one mass/count/time factor on all exchanges."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_residual
    applies_to: "true residual common process"
    rule: "Only the true residual unresolved after subdivision and determining causality uses contemporaneous actual market values in the actual condition and at the same common process gate. Record quantities, prices, currency, period, conditioning/transport adjustments and residual-vector conservation. Missing value/causal evidence remains unresolved; no fixed shares or free economic/physical choice."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_failures
    applies_to: "waste samples rejects and returns"
    rule: "Ordinary manufacturing losses, samples, failed batches, waste and rejected work retain their production and treatment burdens even if sold or sent away. Transfer a vector once only for a genuine distinct cohort/function and justified allocation/handover. Physical gross flows are never scaled by that share. No automatic avoided-production credit, negative waste burden, recycling loop count or recovery factor."
    source_ids:
      - ilcd-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first release"
      record_type: "acceptance and calibrated weighing"
      raw_fields: "model; configuration; serial; actual full BOM; first complete acceptance; m_net_i; scale ID; calibration; net mass; packaging tare; moisture state; holds; prior release history"
      collection_method: "Weigh the accepted complete instrument on a calibrated scale in the same fully assembled configuration excluding transport packaging. Verify all actual supplied legs/casters/pedals/lid/desk and installed parts against the acceptance record; trace separate kit masses if later detached. Record moisture state and uncertainty; never infer mass from a catalogue count or density."
      unit: "kg"
      frequency: "each actual first release"
      temporal_coverage: "whole cohort period including failed work and WIP"
      site_scope: "specified site and complete configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; serial gate evidence; full BOM; actual test and hold records"
    - protocol_id: cp_mass
      process_id: "manufacture"
      flow_role: "material burden and companion gross"
      record_type: "purchase stock and stage log"
      raw_fields: "row_id; actual lot; raw amount; original unit; integrated or rate flag; density and state if needed; raw opening; raw closing; WIP opening; WIP closing; non-WIP unused store quantities; every inherited vector; purchases; supplier work; failures; startup; idle; cleanup; rework; actual driver; exclusive owner; already stock-corrected flag"
      collection_method: "Collect only undivided raw observations and inherited exchange vectors. Preserve every raw/WIP/non-WIP quantity plus vector; prepare the attributable numerator with real unit conversions and legitimate once-only stock/assignment in the calculation rules. Preserve a distinct unscaled gross physical ledger for all legs. An input remaining in wet closing stock is still real influx."
      unit: "actual row native extensive unit"
      frequency: "each receipt and event plus opening/closing"
      temporal_coverage: "complete manufacturing period and inherited history"
      site_scope: "actual supplier stage and site"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices; stage meters; calibration; WIP quantities and vectors; supplier BOM; absence evidence"
    - protocol_id: cp_gross
      process_id: "manufacture"
      flow_role: "gross physical exchange"
      record_type: "weighing metering and destination log"
      raw_fields: "row_id; leg; actual full gross V; original unit; phase; species; moisture; direction; opening full wet stock; closing full wet stock; matching handoff; same-side overlap X; owner; destination"
      collection_method: "Capture complete directional physical quantities without allocation or burden-stock correction; retain actual rejected/failed work, asset mass, installed fluids, repair material/water and real external returns. X removes another same-side duplicate only. No division is performed in collection."
      unit: "actual row native extensive unit"
      frequency: "each actual physical event"
      temporal_coverage: "complete period plus opening and closing"
      site_scope: "manufacturing physical gate and disjoint asset subgates"
      aggregation_rule: "per reference flow"
      quality_evidence: "gross tickets; state and destination evidence; component/whole disjoint mass reconciliation"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity and heat"
      record_type: "meter and service log"
      raw_fields: "row_id; raw meter reading; native unit; cumulative or rate flag; start; end; integration interval; actual meter coverage; supply geography; voltage; heat source; temperature; pressure; enthalpy; carrier kg; actual common driver; idle; failed work; cleanup; supplier energy water agreement"
      collection_method: "Collect raw electricity/heat meters before division. Convert true rates by recorded time only; an integrated kWh/MJ/m3 is not multiplied by time. Keep each actual fuel and thermal carrier mass distinct; measure relevant same-substance density and state independently. No default onsite boiler or steam."
      unit: "native energy unit or carrier mass as declared by row"
      frequency: "each meter interval and operating state"
      temporal_coverage: "complete manufacturing period"
      site_scope: "actual meter circuits and supplier boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; supply contracts; raw rate integrations; thermal state and provider ownership"
    - protocol_id: cp_service
      process_id: "handling"
      flow_role: "original cohort service"
      record_type: "custody meter and postwork log"
      raw_fields: "row_id; original serial; original Q_c; original net mass; H start; H end; opening FG; complete wet closing FG; gross shipment G; gross return R; return composition and added moisture; actual work; actual permit status; posttests; acceptance; hold; disposition; new parts; removed parts; actual water; raw service; unused future charge; prior performed service; each inherited vector"
      collection_method: "Record undivided real incremental service and physical legs for the original accepted cohort; retain all actual failed and unpermitted work. Distinguish ordinary passive humidity exchange. Preserve opening-FG history and all wet-mass changes; no new output, reverse delivery or guessed return mass. Keep already performed service assigned even if FG remains."
      unit: "actual row native extensive unit"
      frequency: "each event and H boundary"
      temporal_coverage: "original cohort history plus explicit service horizon H"
      site_scope: "actual original instrument custody and service site"
      aggregation_rule: "per reference flow"
      quality_evidence: "original acceptance; custody kit reconciliation; meters; permission/tests/disposition including failed events"
    - protocol_id: cp_pack
      process_id: "packaging"
      flow_role: "six packaging events"
      record_type: "article-pool gross stock ledger"
      raw_fields: "row_id; material pool; layer; actual article composition; whole wet state; original cohort Q_c; H; opening empty; opening attached WIP; opening attached FG; opening reusable; P; I; ER; S; EO; W; closing empty; closing attached WIP; closing attached FG; closing reusable; matching internal reuse; paired mixed-container receipt; full wet exit; upstream owner; treatment owner  F_in; F_out; X_in; X_out; matched OTHER same-side owner; collection opening/closing wet stocks; actual collection losses;; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID"
      collection_method: "Measure all six actual events for each material pool separately. P and I are disjoint whole-article ingress; preserve supplier-included physical packaging and its once-owned upstream burden. Closing wet stock never cancels new influx. W source cards pair to mixed-container receipts; only the measured mixed external exit is a provider/treatment demand. No economic scaling and no division in collection.  Apply boundary_packaging F/X identity and whole-wet ownership rules; reconcile non-additive origin W with collection stock/state changes and one measured external outlet. For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
      unit: "kg"
      frequency: "each paid procurement receipt shipment return waste and stock boundary"
      temporal_coverage: "complete original cohort service horizon plus opening/closing"
      site_scope: "all actual empty attached and reusable packaging pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "article receipts; gross shipment/return manifests; moisture; stocktakes; one mixed-waste ticket; sum-of-sources reconciliation"
    - protocol_id: cp_asset_service
      process_id: "manufacture"
      flow_role: "named equipment service"
      record_type: "asset register duty and used-service log"
      raw_fields: "row_id; actual asset; acquisition; full gross asset mass; installed fluids; actual component map; opening installed; closing installed; retirement; new repair part; old removed part; duty hours; actual capacity driver; service charge; unused future service; each inherited vector"
      collection_method: "Keep undivided actual used service exposure and the exclusive owned burden for each named asset. Separate gross asset legs from period service, and replace output type if the real retired article is a waste. Use actual life/repair/provider evidence; do not invent lifespan or one whole machine per kg."
      unit: "h"
      frequency: "each duty and maintenance event"
      temporal_coverage: "actual production period and service-life evidence window"
      site_scope: "named actual equipment and moulds"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; measured duty; real repair parts and fluids; provider invoice and life evidence"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "water species and airborne particles"
      record_type: "independent physical and compositional measurement"
      raw_fields: "row_id; actual molecular or particle identity; phase; inlet; outlet; gross V; dry gas and humidity; collection medium; temperature; pressure; actual density; capture; dissolved solids; free water; structural water; reaction water if proven; biogenic carbon; fossil carbon; ambient carbon; independent elemental observation"
      collection_method: "Measure actual species and media independently, including natural humidity gain/loss. VOC/COD/PM/total metals remain indicators until actual species are known. Add each real emitted molecule and direction as an atomic row before use; no default chemical emissions, air composition or reaction water. Never solve two unknown masses with one residual."
      unit: "actual row native extensive unit"
      frequency: "each representative actual event and state"
      temporal_coverage: "whole period including failures and ambient storage"
      site_scope: "actual inlet outlet and stock state"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling method; actual substance assay; independent moisture/density/state; mass and relevant element closure"
  calculation_rules:
    - id: calc_prepare
      applies_to: "all inventory rows"
      rule: "Convert each undivided raw observation to the row native extensive unit first. Integrate a true rate over its recorded interval once; never integrate an already accumulated quantity. Determine independent same-substance density/state for any volume-to-mass bridge; do not use secondary native coefficients as density evidence. Prepare attributable A_row with legitimate subdivision/allocation and opening/closing raw/WIP plus unused/unassigned non-WIP vectors once. For gross-disclosure cards prepare only complete actual V_row of that event; never substitute burden availability, stock correction or economic share."
      inputs:
        - raw_observation
        - raw_unit
        - actual_state
        - measured_density
        - inherited_vectors
        - actual_assignment
        - full_gross_V
      output: "prepared_numerator"
      source_ids:
        - ilcd-allocation
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "For each non-reference row apply exactly one quotient N_row / Q_basis to the prepared undivided numerator in the declared native unit. Burden rows: N_row=A_row; gross and internal-gross rows: N_row=full actual V_row; equipment service rows: actual used-service dimension with once-owned burden. Manufacture Q_basis=Q=sum of unique first-release m_net_i in kg. Original-cohort handling/packaging Q_basis=Q_c from that original cohort; no second production output. Q_basis=0 retains raw actual load/stocks and yields no unit result. Cards and protocol aggregation only reference this same division and never divide again. Physical V never creates another purchase/provider/credit; attribute its actual owned burden dimension once in A. H is the observation interval only; an accumulated service numerator is divided by original Q_c once, never again by H. Internal origin-W detail is excluded from additive external inventory/provider totals."
      inputs:
        - prepared_numerator
        - Q_basis
        - cp_release
        - cp_mass
        - cp_gross
        - cp_energy
        - cp_service
        - cp_pack
        - cp_asset_service
        - cp_species
      output: "normalized_exchange"
      source_ids:
        - ilcd-allocation
        - yamaha-release
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Actual configuration, serial/BOM and native restrictions agree; retain supplier component boundaries and complete original source context."
      evidence: "full BOM; direct native records; supplier declarations; complete sources"
    - id: dq_measurement
      applies_to: "all raw records"
      requirement: "Retain original units and calibrated observations with timestamps, state, uncertainty and coverage including idle/failed work; no numerical invention."
      evidence: "calibration; raw readings; state logs; full-period reconciliations"
    - id: dq_stocks
      applies_to: "all gates"
      requirement: "Every opening/closing raw/WIP/non-WIP/FG quantity has its inherited vector and origin; physical wet mass independent of economic value."
      evidence: "stocktake; cohort lineage; vector closure; gross balances"
    - id: dq_sources
      applies_to: "all rules"
      requirement: "Qualitative manufacturer synthesis is not one measured factory/order or an independent quantitative factor. Same-publisher pages are one evidence family."
      evidence: "complete primary originals; exact context; limitation records; independent Steinway corroboration"
    - id: dq_completeness
      applies_to: "all conditional rows"
      requirement: "Measure actual presence or support absence; add each real additional atom before use, including separate repair/packaging/spill/species/destination. Unresolved ordinary supplier/UUID data is disclosed and never silently zero."
      evidence: "conditional applicability register; new row list; one-owner ledger; gap record"
validation_rules:
  - rule_id: validate_core
    applies_to: "reference identity"
    rule: "Require one linked Product output with the verified whole manufactured piano identity and every complete acoustic-grand restriction in its card and reference qualifiers. Parts, wooden shell, iron plate, digital action and purchased-finished repacking cannot satisfy it."
    source_ids:
      - yamaha-parts
      - yamaha-release
      - yamaha-acoustic-digital
  - rule_id: validate_quantity
    applies_to: "all records"
    rule: "Audit serial uniqueness, first-release evidence, calibrated net full-configuration mass, Q and original-cohort Q_c, raw units, source coverage and the sole quotient. Q=0 retains actual loads/stocks/failed operations but yields no unit result. Unknown measurement is not a pass."
    source_ids:
      - yamaha-release
      - ilcd-allocation
  - rule_id: validate_complete
    applies_to: "all exchanges"
    rule: "Each actual material/energy/packaging/waste/species and service must have one physically specific row, correct unit and upstream/treatment ownership. Reconcile gross physical gates, every stock quantity and inherited vector, BOM whole/component disjointness, six packaging directions and one real mixed exit. Conditional absence needs evidence; no hidden other-input bucket or unmeasured zero."
    source_ids:
      - yamaha-body
      - yamaha-action
      - yamaha-release
      - ilcd-allocation
  - rule_id: validate_chemistry
    applies_to: "water mass elements emissions"
    rule: "Close full physical mass and relevant independent elemental accounts using actual species and preparation/wood composition. Distinguish free/structural/reaction/ambient water by evidence; no assumed cure water or oxidation. Biogenic wood carbon, fossil resin/coating carbon and ambient carbon stay distinct. Purchasing wood does not create a second foreground atmospheric uptake; upstream forestry owns that history once. VOC/COD/PM/total metal indicators cannot identify molecular mass. Do not fit two unknowns with one residual."
    source_ids:
      - yamaha-body
      - yamaha-action
      - ilcd-allocation
  - rule_id: validate_service
    applies_to: "FG custody and actual work"
    rule: "Reconcile opening FG history, all gross shipment/return and wet-mass changes, original accepted serial and complete dismantled transport kit. Continued-conformity permission/tests/disposition is assessed separately from complete recording of actual unpermitted/failed work. Do not apply a net-delivery denominator or reverse old manufacturing just because a return occurs."
    source_ids:
      - yamaha-release
      - ilcd-allocation
  - rule_id: validate_native
    applies_to: "native identities and data quality"
    rule: "Apply every native material/form/route/phase/media/type/geography/property restriction in the individual description; official Chinese basenames and bare UUIDs agree. Provider suitability and actual foreground quantities still need evidence; scientific and translation review are separate from mechanical inspection."
    source_ids:
      - ilcd-allocation
