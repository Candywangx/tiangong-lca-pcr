system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "whole manufacturing"
      rule: "Preserve the complete actual sequence and component procurement states in section2. Finished supplier assemblies carry their preparation once upstream. If soundboard, keyboard, action, plate, bridge or strings are made on site, expand every actual purchased atom, energy input, loss and internal handoff before use; do not claim a supplier assembly and its on-site raw manufacture together."
      source_ids:
        - yamaha-body
        - yamaha-action
        - yamaha-stringing
        - yamaha-resting
        - yamaha-release
    - rule_id: boundary_first_release
      applies_to: "manufacture and FG"
      rule: "Q is the sum of measured net masses m_net_i of unique newly first-released complete instruments in the cohort. Complete inspection follows actual regulation, tuning, voicing, pedal/leg fitting and surface inspection. Instruments already released and still in closing FG are included in Q; they are neither an additional production output nor a reason to subtract manufacturing burden. Deliveries and reinspection create no Q."
      source_ids:
        - yamaha-release
    - rule_id: boundary_stocks
      applies_to: "manufacture burden vectors"
      rule: "Carry actual opening/closing raw material, WIP and unused/unassigned non-WIP charge quantities with every inherited exchange vector and origin. Manufacturing vector availability is opening inherited vectors plus current owned input vectors minus closing inherited vectors in those stores, then actual legitimate assignment once. Closing released FG is outside that subtraction. Already stock-corrected consumption must not receive a second stock correction. Start/stop, idle, failed batches, samples, cleanup and real rework retain burden even when Q is zero."
      source_ids:
        - ilcd-allocation
        - yamaha-resting
        - yamaha-release
    - rule_id: boundary_physical
      applies_to: "manufacture FG and combined gates"
      rule: "Maintain three independent full gross physical balances. Manufacture: opening raw/WIP plus all external material/water/species inputs equals closing raw/WIP plus first-release complete-instrument transfer plus all actual waste/emission/return legs. FG/service: opening FG plus first-release transfer plus actual external returns and incremental material/moisture inputs equals closing complete wet FG plus gross shipments, true external returns, removed parts, waste and species outputs. Consolidation cancels the matched first-release/internal transfers once; never sum a whole piano plus its embedded BOM as separate outputs. Assets and packaging have disjoint subgates. X_in/X_out removes only overlap with other same-side flow terms, never the opposite direction or closing stock. Real added material/water influx and full wet closing article mass both remain."
      source_ids:
        - yamaha-release
        - ilcd-allocation
    - rule_id: boundary_service
      applies_to: "postrelease original cohorts"
      rule: "Keep actual packing, handling, storage conditioning and all postrelease work over H assigned to original cohort Q_c. Retain original accepted configuration/mass and custody of removed legs/supports with the complete shipment kit. They are still the original accepted instrument; leg removal or packing produces no new Q. Keep opening-FG history and original service vectors; performed service stays assigned when FG is held, only unused/unassigned future service/charge may carry."
      source_ids:
        - yamaha-release
        - ilcd-allocation
    - rule_id: boundary_postwork
      applies_to: "actual postrelease work and humidity"
      rule: "Actual postwork requires evidence of manufacturer/specification permission, subsequent functional/quality tests and acceptance or hold/waste disposition to establish continued conformity. Nonetheless every real attempted, unpermitted, failed or rejected operation and its gross materials/water/parts/energy/waste remains recorded for the original cohort. Do not assume a damaged soundboard, cast plate or instrument is restored. Passive ambient moisture gain/loss during ordinary storage/handling is separately recorded without inventing repair permission or operations."
      source_ids:
        - yamaha-release
        - yamaha-resting
        - ilcd-allocation
    - rule_id: boundary_preparations
      applies_to: "all purchased inputs"
      rule: "Purchase a whole supplied adhesive, coating, thinner, lubricant, impregnated paper, wound string, component or wet packing article once. Assay constituents, carrier water and embedded hardware are disjoint subledgers. Actual on-site additions each have their own exchange and actual energy/loss; do not make both whole input and composition into additive purchases."
      source_ids:
        - yamaha-body
        - yamaha-action
        - yamaha-stringing
    - rule_id: boundary_packaging
      applies_to: "each actual packaging pool"
      rule: "For each actual separate article/grade pool use full wet physical O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C include empty, WIP/FG-attached and reusable stocks. P is separate external purchase; I is first non-purchased external ingress with one upstream owner; ER is actual external return received; S accompanies gross physical shipment; EO is actual external return sent; W is actual waste disposition. F_in/F_out are independently measured real additional repair material, water/moisture ingress, removed material, drainage or evaporation not already owned in those article events; add each actual atom before use. X may remove only the proven identical mass duplicated in an OTHER actual term on the SAME side, with matched article/lot/event/species/unit/period and one owner. Card presence, retained closing wet stock, the opposite side and economic or burden-stock correction never justify X. Internal reuse cancels. Use either whole wet articles or an explicitly exhaustive mutually exclusive component bridge, never both additively."
      source_ids:
        - yamaha-release
        - ilcd-allocation
    - rule_id: boundary_mixed_waste
      applies_to: "packaging W source pools"
      rule: "When one real mixed packaging waste exit exists, each origin W is independently measured non-additive internal source-to-collection detail with paired receipt, no external provider or finished-Product binding. Reconcile collection opening stock plus actual origin W and disjoint added matter with closing full wet stock, the sole measured external exit and actual disjoint losses. Do not assume origin sum equals the period exit when stocks or moisture change. Cancel internal handoffs on consolidation and attach treatment once to the measured external mixed Waste total. Never infer several unknown origin masses from one total. Actual separate exits require actual separate atomic Waste rows and matching providers instead."
      source_ids:
        - yamaha-release
        - ilcd-allocation
    - rule_id: boundary_energy_assets
      applies_to: "actual utilities and equipment"
      rule: "Preserve each actual carrier/fuel, energy reference property and extensive unit. No default fuel, boiler, steam, refrigerant or air composition. Actual external heat carrier/condensate returns require phase/state/mass/enthalpy and one supplier water/energy contract. Whole asset acquisition/installed/retirement gross masses and new/old repair parts/fluids remain distinct from period used service burden; no fixed lifetime or full machine per kg. Add every actual omitted input/output as a specific atomic card before dataset use."
      source_ids:
        - ilcd-allocation
        - yamaha-body
        - yamaha-resting
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-allocation
