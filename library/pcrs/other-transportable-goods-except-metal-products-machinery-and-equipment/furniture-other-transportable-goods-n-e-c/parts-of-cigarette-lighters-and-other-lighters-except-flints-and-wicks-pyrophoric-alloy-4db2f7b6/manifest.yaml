  unresolved:
    - code: actual_cap_and_first_release
      detail: Obtain actual part drawing/model, material declaration, commissioned supplier lot and unique original first standalone release. N334329 identifies its historic cap, not a current factory lot. Already released supplier goods cannot be relabelled new production.
    - code: upstream_and_foreground_collection
      detail: Obtain opaque compatible supplier inventory, actual transport coverage, primary Q/stock/quality/electricity/packaging records and all actual missing exchanges. No polymer, route, yield, mass, quantitative range or operating procedure is inferred.
    - code: packaging_and_burden_coverage
      detail: Verify each actual packaging material; purchased, first non-purchase external and true-return channels; supplier coverage and remaining embodied burden. Close physical and burden ledgers including opening WIP/released stock, old returns and actual services.
    - code: native_support
      detail: Native supplier electricity property and actual road-freight service identity/provider remain unresolved. Goods transport (mass*distance) and t*km unit support were independently verified in the fixed archive. Meter Energy f6811440-ee37-11de-8a39-0800200c9a66 and energy unit group support do not resolve these supplier identities.
