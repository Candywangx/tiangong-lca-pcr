system_boundary:
  rules:
    - rule_id: boundary_first_release
      applies_to: "first_release"
      rule: "Verify original producer and actual standalone first release using commissioned-production/acceptance records. If the supplier already released the cap as a saleable standalone part, use that original gate and dataset; a later receipt, relabelling, inspection, transfer or resale does not create Q. Do not omit real intervening activities: disclose a separate service layer."
      source_ids:
        - cbp-n334329
    - rule_id: boundary_upstream
      applies_to: "unreleased_cap"
      rule: "Keep manufacture opaque but burdened: supplier inventory must identify the same cap/material/lot and actual included gate. Do not infer resin processing, numerical yields or internal emissions from the classification source. Missing upstream activity stays unresolved; it is not an empty zero inventory."
      source_ids:
        - eu-pef-2021
    - rule_id: boundary_perimeter
      applies_to: "all processes"
      rule: "Use one explicit physical site perimeter for stocks. Goods outside it are outbound and cannot simultaneously remain inside closing stock merely because the producer retains ownership. Keep off-site ownership as a separate memorandum and include actual transport/services once. Internal movements cancel on consolidation."
      source_ids: []
    - rule_id: boundary_completeness
      applies_to: "all processes"
      rule: "Include actual inspection, handling, packing, losses and waste treatment to first release, together with upstream provider inventories. Survey for additional utilities and direct emissions; add each actual species and compartment separately. Operational testing, ignition work and downstream appliance/use/end-of-life are outside this component dataset. Do not imply full-life-cycle PEF or component performance equivalence."
      source_ids:
        - eu-pef-2021
boundary_abstraction:
  declared_starting_condition: "A specified commissioned passive plastic cap received before its first standalone release; actual upstream fabrication and delivery are linked black boxes."
  starting_condition_role: "Foreground collection boundary, not a burden-free life-cycle start."
  product_classification_scope: "Only the dedicated passive replacement-cap subset of CPC 3.0 38995 / HS 9613.90."
  recursive_input_rule: "An already released cap is merchandise/return with original burdens, not new production. Retain original identity; do not recursively claim another first release. Unreleased supplier caps need one bounded upstream inventory."
  upstream_dataset_requirement: "One compatible inventory per actual supplier lot, including cap fabrication burdens, scrap treatment and declared upstream materials/energy. Require coverage of supplier packaging and transport or add uncovered activities once. No recipe or operational disassembly is required."
  disclosure: "Declare supplier, physical gate, first release, inherited stock burdens, excluded downstream function and each unresolved coverage field. Show manufacturing and post-release services separately."
