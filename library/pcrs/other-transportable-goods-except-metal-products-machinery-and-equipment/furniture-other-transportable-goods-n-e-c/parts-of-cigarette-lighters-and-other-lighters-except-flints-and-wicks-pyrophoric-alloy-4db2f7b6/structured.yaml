  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, corrected consolidated Annex I, §§3.2.1–3.2.2,4,4.2,4.4.2–4.4.3,4.5,4.6.1. https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:02021H2279-20211230"
    used_for: "General declared-unit, life-cycle completeness, primary-data, electricity/transport and allocation reasoning only. The explicit stock/cohort equations are this PCR collection protocol, not quoted Commission formulas or full-PEF certification."
