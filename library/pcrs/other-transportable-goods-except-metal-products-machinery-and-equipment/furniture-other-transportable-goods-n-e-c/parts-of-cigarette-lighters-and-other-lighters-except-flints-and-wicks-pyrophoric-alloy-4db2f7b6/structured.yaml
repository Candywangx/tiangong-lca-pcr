allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all processes"
    rule: "Subdivide by actual lot and activity before allocation. Do not invent co-products or avoided manufacture of a complete lighter. For shared burdens test subdivision/system expansion first; where infeasible use a justified underlying physical relationship, and only then another justified relationship. Document causal basis, all recipients, factors summing to one and sensitivity. Metered runtime/activity can support inspection electricity; cap mass alone does not prove causality."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_inherited
    applies_to: "all processes"
    rule: "For each physical original, cohort and exchange i, preserve B_open,i + B_external,i + B_new,i = B_current,i + B_close,i + B_transfer,i + B_other,i. B_external is only the remaining previously incurred share entering from outside, not a second original production. Closing, transfer and other destinations are mutually exclusive; each share is retired once. Maintain production and later-service layers separately and carry zero-output burdens forward with evidence."
    source_ids: []
  - rule_id: allocation_release_bridge
    applies_to: "first_release; post_gate; packaging"
    rule: "Apply the burden identity separately to unassigned pre-release burden and later released-item custody/service books. The production result is the burden assigned to the whole first-release cohort divided by Q, including its justified share of rejects and handling; closing newly released goods are already inside that Q. The same assigned vector is carried as an internal handover into released-item history, not charged a second time. Physical closing stock can contain already assigned embodied burdens: retain them as non-additive history, distinct from the still-unassigned B_close share. In the later book, dispatch transfers embodied history to its original cohort recipient, never to new Q. For packaging the same principle prevents charging full manufacture on first use and again as closing stock/return. Do not remove reject burdens merely because the physical waste leaves; attribute actual losses and treatment to their production cohort or retain an evidenced pending share when Q=0."
    source_ids: []
  - rule_id: allocation_packaging
    applies_to: "packaging"
    rule: "Physical receipt never proves a new environmental burden. For each carton/bag, including free or loaned receipts, document whether supplier coverage already includes production, delivery or service. Add each actually borne uncovered burden once; unknown supplier coverage is pending, not free. True returns keep their remaining original share, with only new transport/service added. No assumed reuse cycles, depreciation fractions or recycling credits; use actual service/cohort records and justify the allocation."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_returns
    applies_to: "post_gate"
    rule: "Original embodied production of opening released goods, returned goods and repeat dispatch belongs to original cohorts. Do not add it to current Q or re-charge it for each shipment. Any actual new storage/inspection/repacking and waste treatment is a separately measured service burden assigned to the appropriate cohort/recipient; it must not disappear or be charged twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "first_release"
      flow_role: "release mass"
      record_type: "site and supplier primary records"
      raw_fields: "lot; drawing revision; material declaration; first-release flag/time/site; net cap mass; tare; count; rejection; calibration"
      collection_method: "Weigh accepted bare caps with calibrated scale and reconcile unique release IDs to the original producer records. No ignition or operational test is needed. Sum unique newly released bare mass Q; derive all applicable quantities per 1 kg reference flow."
      unit: "kg"
      frequency: "each release"
      temporal_coverage: "declared complete observation period plus inherited history"
      site_scope: "actual manufacturer and declared physical perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; calibration; coverage reconciliation; residual explanation"
    - protocol_id: cp_supplier
      process_id: "first_release"
      flow_role: "cap receipt/reject and upstream coverage"
      record_type: "site and supplier primary records"
      raw_fields: "supplier lot; commissioned order; prior-release status; actual material declaration; incoming bare kg; rejects; returns to supplier; WIP; provider gate/coverage; inherited burden vector"
      collection_method: "Reconcile receiving and acceptance documents with the actual manufacturer. Obtain an opaque supplier inventory matching the lot; no internal composition or recipe is inferred. Retain all losses and destinations. Assign actual upstream and reject quantities to the released cohort per 1 kg reference flow using calc_reference after stock/burden closure."
      unit: "kg; native exchange units"
      frequency: "each receipt/disposition"
      temporal_coverage: "declared complete observation period plus inherited history"
      site_scope: "actual manufacturer and declared physical perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; calibration; coverage reconciliation; residual explanation"
    - protocol_id: cp_energy
      process_id: "first_release_post_gate"
      flow_role: "electricity"
      record_type: "site and supplier primary records"
      raw_fields: "meter start/end; multiplier; dates; idle use; actual task runtime; allocation recipients; supply identity; voltage; native property and unit; provider coverage"
      collection_method: "Read a traceable meter and reconcile invoices and task/site scope. Separate pre-release and later services; verify any supplier flow full native property/unit record before binding. Attribute actual metered energy to its cohort and service layer, then per 1 kg reference flow; never divide by output count or observation time."
      unit: "kWh"
      frequency: "each observation interval and task"
      temporal_coverage: "declared complete observation period plus inherited history"
      site_scope: "actual manufacturer and declared physical perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; calibration; coverage reconciliation; residual explanation"
    - protocol_id: cp_transport
      process_id: "first_release"
      flow_role: "actual road freight"
      record_type: "site and supplier primary records"
      raw_fields: "leg; from/to physical gate; loaded mass; distance; actual lorry/load; empty return; payer; upstream inclusion"
      collection_method: "Use consignment records and route evidence for uncovered real road legs. Identify all additional actual modes individually. Compute loaded tonne-km with compatible provider load/return convention, attribute once, then per 1 kg reference flow."
      unit: "t; km; tkm"
      frequency: "each actual leg"
      temporal_coverage: "declared complete observation period plus inherited history"
      site_scope: "actual manufacturer and declared physical perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; calibration; coverage reconciliation; residual explanation"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "one material at a time"
      record_type: "site and supplier primary records"
      raw_fields: "material/grade; item ID or homogeneous lot; count and measured tare mass; purchase; first non-purchase external receipt; same-item true return; opening/closing stock; outbound categories; waste; supplier burden coverage; remaining burden vector"
      collection_method: "Weigh and count each actual material separately. Match receipts, loan/free-transfer papers and prior outbound/return IDs, even for incoming supplier packaging. Inspect physical perimeter and disposition; audit coverage independently of payment. Close each material physical and burden ledger, distinguish manufacturing versus later services and other cohorts, then attribute per 1 kg reference flow."
      unit: "kg and item count separately"
      frequency: "each event plus stock counts at interval boundaries"
      temporal_coverage: "declared complete observation period plus inherited history"
      site_scope: "actual manufacturer and declared physical perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; calibration; coverage reconciliation; residual explanation"
    - protocol_id: cp_stock
      process_id: "post_gate"
      flow_role: "adjacent physical books"
      record_type: "site and supplier primary records"
      raw_fields: "cohort; original release ID; opening/closing unreleased kg; received unreleased kg; Q; unreleased waste/transfer; opening/closing released kg; original return kg; external released receipt kg; gross dispatch kg; released waste/transfer; inherited and new burden vectors"
      collection_method: "Use calibrated bare-mass records, cohort release history and physical stock counts. Link each old return to original dispatch; identify all mutually exclusive movements, including off-site goods. Close both books with the same Q; summarize attributable quantities per 1 kg reference flow only for their own cohort and service layer."
      unit: "kg; original exchange units"
      frequency: "each movement and period boundary"
      temporal_coverage: "declared complete observation period plus inherited history"
      site_scope: "actual manufacturer and declared physical perimeter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original records; calibration; coverage reconciliation; residual explanation"
  calculation_rules:
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "For Q>0, a_i = A_i / Q; A_i is the extensive exchange quantity attributable to this cohort after physical-stock and burden reconciliation. Keep all quantities in the card unit, keep production/service layers separate, and divide once. The unique reference output is 1 kg. Internal transfers cancel; do not add procurement, receipt, consumption and dispatch as if all were independent new burdens."
      inputs:
        - A_i
        - Q
        - cp_release
        - "applicable collection protocol"
      output: "a_i"
      source_ids:
        - eu-pef-2021
    - id: calc_later_service
      applies_to: "post_gate; packaging"
      rule: "For actual later services, s_i = S_i / Q_original only when Q_original>0 is independently documented for the same original cohort; otherwise keep S_i unnormalized and pending. This is an explicit service-only reporting branch, not a second application of calc_reference to current-period Q or a new production result. Link manufacturing embodied history without adding it again. Current-period physical Q remains the actually newly released mass, including zero."
      inputs:
        - S_i
        - Q_original
        - cp_stock
        - cp_packaging
        - cp_energy
      output: "s_i"
      source_ids: []
    - id: calc_cap_books
      applies_to: "first_release; post_gate"
      rule: "Before release: U0 + Iu = Q + U1 + Wu + Tu. After release: F0 + Q + Rold + If = Dgross + F1 + Wf. All symbols are bare kg for the same period/perimeter and mutually exclusive categories: U unreleased stock, Iu incoming unreleased caps, W waste, T other outbound transfer; F released stock, Rold real old returns, If other external already released receipts, Dgross all gross released-product outbound, including mutually exclusive other-transfer subcategories; no separate Tf. Internal rework stays inside U and is not a second receipt. In the sum, Q cancels. Q is measured first release, not net shipment; opening released goods and old returns never enlarge it."
      inputs:
        - cp_release
        - cp_supplier
        - cp_stock
      output: "two residuals and unique Q"
      source_ids: []
    - id: calc_packaging_books
      applies_to: "packaging"
      rule: "For each actual material j independently: S0,j + Pj + Ej + Rj = S1,j + Oj + Wj + Tj. P is purchased physical receipt; E is first non-purchase external receipt, including incoming packaging, loans and free transfers; R is the same item returning after a documented earlier site outbound. O is packaging accompanying goods, W actual waste, T other outbound including return to owner. Record counts and measured kg separately; no return is counted again as P or E. Internal packing/unpacking changes custody/status, not external stock. Reconcile supplier-covered burdens separately under allocation_packaging."
      inputs:
        - cp_packaging
      output: "material-specific physical closure"
      source_ids: []
    - id: calc_burden_books
      applies_to: "all processes"
      rule: "Apply allocation_inherited exchange by exchange, with original IDs and opening, external remaining, new, current, closing, exclusive transfer and other shares. When a same-item return follows a transfer recorded earlier in the same period, keep the gross physical events but reverse the earlier remaining-burden transfer on the same ID before reassignment; do not introduce it again as new B_external. An opening out-of-site item returning brings its remaining burden once. Prove supplier packaging, delivery and electricity coverage without duplicating a bundled inventory."
      inputs:
        - cp_supplier
        - cp_packaging
        - cp_stock
        - cp_energy
      output: "exchange burden residual and attribution"
      source_ids: []
    - id: calc_energy
      applies_to: "release_electricity; post_electricity"
      rule: "Recorded kWh = (meter_end - meter_start) × actual multiplier. Attribute to actual task/cohort using allocation_direct. If compatible provider amount is MJ, MJ = 3.6 × kWh; never apply both units as separate electricity inputs. Conversion does not verify the native supplier property."
      inputs:
        - cp_energy
      output: "attributed electrical energy"
      source_ids: []
    - id: calc_transport
      applies_to: "road_freight"
      rule: "Loaded tonne-km = measured payload kg / 1000 × actual km for that road leg. Match the provider load/empty-return convention and count an actual leg once; cost is not distance or transported mass."
      inputs:
        - cp_transport
      output: "t*km"
      source_ids:
        - eu-pef-2021
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference_product"
      requirement: "Confirm dedicated loose passive cap and actual supplier/model/material/lot. The historical ruling proves its described product, not the current plant route, polymer, mass or certification."
      evidence: "cp_release; cp_supplier; cbp-n334329"
    - id: quality_customs
      applies_to: "reference_product"
      requirement: "Retain contemporaneous same-lot accepted counts and calibrated net mass or a justified stratified sampling plan with uncertainty. HTS No. counts may include other parts; do not infer kg, actual import occurrence or first release from the ruling or tariff row."
      evidence: "cp_release; usitc-hts-2023-rev10; cbp-n334329"
    - id: quality_closure
      applies_to: "all processes"
      requirement: "Explain every stock and burden residual using calibrated measurement uncertainty and traceable corrections. No universal tolerance or unexplained balance plug. Record actual service and burden recipients, including zero-output periods."
      evidence: "cp_stock; cp_packaging; cp_release"
    - id: quality_provider
      applies_to: "all inventory rows"
      requirement: "Resolve selected UUID, native property/group/unit, flow type, state, medium and provider compatibility before completed dataset use. Mass/kg support alone is not cap or waste identity. Search candidates do not prove material suitability or upstream coverage."
      evidence: "cp_supplier; cp_energy; cp_transport"
    - id: quality_representativeness
      applies_to: "all processes"
      requirement: "Report observation period, geographic/technological scope, sample selection, measurement uncertainty, excluded or unmeasured activities and source limitations. No numerical ranges, yields or impacts are supplied without actual evidence."
      evidence: "cp_release; eu-pef-2021"
validation_rules:
  - rule_id: validation_scope
    applies_to: "reference_product"
    rule: "Reject complete empty lighters, sleeves, multipurpose cases, packing boxes and metal casings as this reference product. Verify the loose dedicated plastic cap and actual first-release evidence; a customs code or supplier listing alone does not establish dataset applicability."
    source_ids:
      - cbp-n334329
      - cbp-m82869
      - cbp-i88260
  - rule_id: validation_reference
    applies_to: "all inventory rows"
    rule: "Require unique reference_product output, Q>0, bare mass excluding packaging and a single per 1 kg reference flow denominator. Explain before/after stock residuals; Q cancels between adjacent books. Old returns, released opening stock and dispatch do not create Q."
    source_ids: []
  - rule_id: validation_packaging
    applies_to: "packaging"
    rule: "For each actual packaging material verify purchases, first non-purchase external receipts and same-item true returns independently, regardless of supplier inventory coverage. Close all physical destinations and stock. A missing supplier burden declaration is a data gap; actual borne transport, purchase and service burdens are counted once."
    source_ids: []
  - rule_id: validation_burdens
    applies_to: "all processes"
    rule: "Verify exchange-wise inherited/new burden closure and mutually exclusive recipients, reverse same-period return transfers once and preserve original cohorts. Do not combine manufacturing and subsequent service layers without explicit boundaries and removal of duplicate embodied production."
    source_ids: []
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "A named unresolved candidate is not a verified provider. Keep unresolved UUIDs and support fields explicit, preserve bilingual atomic names and verify supplier native electricity property separately from metering Energy. Incomplete actual inventories cannot be represented as complete or approved."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A documented component input to a downstream assembly model; separate service layers only with explicit original-cohort bindings."
  allowed_use: "The verified model/material/lot route and gate, with compatible upstream inventory and resolved flow identities; compare mass inventories only with function/quality limitations stated."
  excluded_use: "Whole CPC leaf coverage, complete lighter LCA, operating/ignition guidance, assumed service life, PEF qualification, avoided complete-product production or unverified polymer substitutions."
  required_metadata: "All reference qualifiers; supplier and original gate; Q and its unique cohort; observation period; native flow/provider bindings; separate manufacturing/service layers; packaging/physical/burden ledgers."
  required_quality_disclosure: "Measured versus unresolved exchanges; opaque upstream coverage; representativeness; uncertainty; allocation basis; actual missing flows; stock/burden residuals and supplier-coverage gaps."
  update_trigger: "Change of cap design/material/supplier, actual route or first-release gate, packaging, electricity provider/property, inventory coverage, observation period or applicable classification explanation."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC 3.0 explanatory notes, 30 June 2025, pp.197–198. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Frozen classification coordinate and adjacent mixed leaf titles only; no cap production data."
