measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the sum of calibrated net bare cap masses newly first released in this cohort under cp_release. Exclude packaging, opening released stock, returns and repeat dispatch. All applicable cards use the same per 1 kg reference flow basis."
  - id: mass_conversion
    applies_to: "mass inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use actual batch weighing and tare removal. Convert g to kg by 0.001. Counts support traceability only; count-based quantities need actual configuration-specific measured bare mass and reconciliation to the batch total, not a generic cap weight."
  - id: customs_count
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "USITC 2023 HTS Revision 10 lists No. (count), not kg, for 9613.90.80.00; the line is not exclusively this cap. Customs quantities are neither net cap kg nor manufacturer first release. Match contemporaneous documents to the same accepted cap lot; where direct total weighing is unavailable, use stratified configuration/material/lot count and representative calibrated bare-mass sampling, documented sample selection, uncertainty and batch reconciliation. N334329 describes proposed imports, not an observed shipment or plant measurement. usitc-hts-2023-rev10 cbp-n334329"
  - id: meter_energy
    applies_to: "release_electricity; post_electricity"
    required_property_ref:
      name: "Energy"
      uuid: "f6811440-ee37-11de-8a39-0800200c9a66"
    required_unit: "kWh"
    rule: "Metered electrical energy is measured Energy, not a declaration of a supplier flow native property. Verified Units of energy 93a60a57-a3c8-11da-a746-0800200c9a66 has MJ reference and kWh factor 3.6: convert only if the actual provider requires MJ. Verify its native flow/property separately; shared units do not imply Net calorific value."
  - id: transport_units
    applies_to: "road_freight"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: "838aaa20-0117-11db-92e3-0800200c9a66"
    required_unit: "t*km"
    rule: "Verified Units of mass*length 838aaa21-0117-11db-92e3-0800200c9a66 uses reference t*km with kg*km factor 0.001. This supports amount conversion only; the actual carrier, lorry, service-flow identity, loading and included empty-return convention remain independently required."
  - id: zero_output
    applies_to: "all inventory rows"
    required_property_ref:
      name: "raw extensive quantity"
      uuid: ""
    required_unit: "original unit"
    rule: "If Q=0, retain failures, idle use, stock and rework with cohort burdens in original units. Produce no normalized dataset and do not erase them or divide by dispatch mass."
  - id: service_denominator
    applies_to: "post_gate; packaging"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "A later interval can have current new-release Q=0 and still incur real services. Retain those extensive quantities in their original units. A separate later-service intensity is permitted only with a traceable positive original release mass Q_original for that original cohort. Do not substitute Q_original into the current-period physical books, assign old goods to a new production cohort or create another manufacturing reference."
