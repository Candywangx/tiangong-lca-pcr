    type: "official_guidance"
    reference: "USITC, 2023 Harmonized Tariff Schedule Revision 10 CSV, HTS Number 9613.90.80.00, Unit of Quantity field. https://www.usitc.gov/sites/default/files/tata/hts/hts_2023_revision_10_csv.csv"
