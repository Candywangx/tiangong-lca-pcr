  starting_condition_role: "Gate-to-gate conversion/assembly with required upstream manufacture; not a purchased-finished-hat packing model"
  product_classification_scope: "Narrow complete non-pyrotechnic festive-cone subset of38991; no whole-leaf coverage claim"
  recursive_input_rule: "Internal printed sheets/cones/first-release handoffs cancel at combined gates. Externally printed board is a supplier interface with printing coverage once. Previously released hats received for repair retain original Qc and historical burdens; no new Q."
  upstream_dataset_requirement: "Compatible board/furnish/coating, each whole formulation, cord and actual fasteners, imaged plates, packaging, utilities, tooling use, freight and each external waste treatment; disclose missing provider scopes without zeroing"
  disclosure: "All physical gates, sites/periods, supplier ownership and printing allocation, Q/Qc/H, stocks and inherited vectors, condition and moisture, package pools, actual receivers and unresolved evidence"
