allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Apply this hierarchy only to the declared attributional situation in which allocation is needed. Manufacturing descriptions do not authorize LCA allocation. Physical custody and total species balances remain unallocated; each burden numerator is assigned separately."
    source_ids: []
  - rule_id: allocation_dedicated
    applies_to: "shared operations"
    rule: "First isolate dedicated operations, orders, plate/ink issues, die/assembly tasks and measured utilities. Use actual or virtual subdivision to assign each exclusively caused exchange, including failed setups and cleaning. Document the reason if subdivision is infeasible."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_causality
    applies_to: "remaining individual exchanges"
    rule: "For each remaining exchange demonstrate its determining physical causality, with measured intensity, scope and period. Printed area may determine one ink demand while actual load-time may determine electricity; neither is universal. Packaging/FG services use the actual limiting capacity and observed duration where causal. Do not apply one physical key to every exchange."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_residual
    applies_to: "true unresolved joint burden"
    rule: "Only truly inseparable residual burdens may use contemporaneous market values at the same joint-process gate in the actual co-output state and quantity. Remove downstream processing/packing/transport value from the comparison; retain prices, quantities, uncertainties and sensitivity. No fixed split, arbitrary physical/economic choice, marketing value or automatic avoided-product credit."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_physical
    applies_to: "gross physical and stock ledgers"
    rule: "Do not scale gross actual inputs, hat/waste/species outputs, repair additions or package transfers by burden shares or closing-stock burden deductions. Keep full V_i and inherited vectors independently. Internal return loops cancel without hiding new work; sold trim does not automatically become a coproduct. Actual waste/product function and receiving status require evidence and compatible type."
    source_ids: []
  - rule_id: allocation_cohorts
    applies_to: "failed work and FG services"
    rule: "Keep Q0 and unsuccessful work with its actual causal cohort or an explicit unassigned burden. Post-release work uses original Qc and only actual new increments over H, including work on held or ultimately discarded goods. Neither dispatch volume nor H replaces Qc; no reuse count is invented."
    source_ids:
      - ilcd-detailed-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "hat_manufacture"
      flow_role: "first_complete_hat_release"
      record_type: "Unique release and conditioned weighing"
      raw_fields: "lot/configuration; gross and tare; net complete-hat mass; actual moisture/temperature/humidity; release time; accepted/rejected/held status; tests; prior release check; opening/closing WIP and FG; Q and original Qc"
      collection_method: "Use calibrated weighing after real setting and declared conditioning. Exclude all detachable packaging. Reconcile unique release IDs with seam, print, cord/fastener, fit and edge/apex checks. Record sampling/destruction losses. Count-to-mass needs measured complete same-configuration mass and representative sampling, never dimensions or default density."
      unit: "kg"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_materials
      process_id: "hat_manufacture"
      flow_role: "each_article"
      record_type: "Receipts issues and unused stock"
      raw_fields: "article/lot/supplier; board coating/furnish/moisture; complete cord/fastener composition; whole supplied mass; raw opening/closing; issued/returned; upstream scope; transport; each inherited vector"
      collection_method: "Weigh actual receipts and issues, reconcile invoices/batch specifications and non-overlapping supplied assemblies. Record printing ownership and transfer, not a second board purchase. Separate already-net consumption from gross receipts plus stock corrections."
      unit: "kg"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_formulations
      process_id: "hat_manufacture"
      flow_role: "each_complete_formula"
      record_type: "Whole wet supply and actual mixing"
      raw_fields: "SKU/colour; SDS/batch; wet mass; solids/vehicle/water assays; density/state if used; dilution/adjustment issues; returned unused formula; residuals; printing passes; setting route; mixing/cleanup losses"
      collection_method: "Record each CMYK ink, fountain concentrate, wash and seam emulsion independently. Weigh whole supplied formulation; keep constituent assays as non-additive balances. Onsite additions are separate actual purchases. Verify real ink setting and glue suitability; catalogue composition/solids/specific gravity is not field measurement."
      unit: "kg; native raw units"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_utilities
      process_id: "hat_manufacture"
      flow_role: "each_utility"
      record_type: "Meters and measured state"
      raw_fields: "meter/start/end/time; unit or true rate; equipment/load; actual voltage/geography/provider; water density/temperature if needed; supply/return mass and enthalpy if present; all idle/startstop/failed work"
      collection_method: "Use actual meter differences or properly integrated rates, reconcile boundary and convert once. Separate each fuel/heat carrier/return actually present and its supplier coverage. Electric cleanup-water heating remains inside the electricity measurement; no presumed boiler or steam."
      unit: "kg; kWh; MJ; native raw units"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_tools
      process_id: "hat_manufacture"
      flow_role: "each_tool_or_replacement"
      record_type: "Tool ownership service and retirement"
      raw_fields: "complete article; supplier; new/repair/retired mass; plate imaging scope; actual use cohort and counters; opening/closing reusable stock; each inherited vector; receiver"
      collection_method: "Record plates, cutting dies and printing blankets separately, including actual replacement support materials. Distinguish physical receipt/retirement from service-life attribution; do not divide by nominal capacity or invent a lifetime. Account onsite prepress details when actually performed."
      unit: "kg; actual use units"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_waste
      process_id: "hat_manufacture"
      flow_role: "each_real_waste"
      record_type: "Gross waste transfer and origin"
      raw_fields: "unique container/event; gross/tare/wet mass; actual solids/water/chemical species/phase; originW; segregated or mixed; raw stock; receiver/provider; samples and spills"
      collection_method: "Weigh and sample the complete real transfer with representative uncertainty. Segregated colours/materials remain separate; mixtures use one total and independently measured non-additive source contributions with one provider. Do not count retained contaminants again as liquid/species exports or substitute COD for molecule mass."
      unit: "kg; native raw units"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_species
      process_id: "hat_manufacture"
      flow_role: "each_species_and_water_partition"
      record_type: "Independent species and phase observations"
      raw_fields: "chemical/CAS; actual source/medium/phase; concentration and integrated volume or rate; state-specific density; inlet/outlet/background; retained species; wet mass; C/H/O; free/structural/reaction water; uncertainty"
      collection_method: "Use measured speciation and reaction/material evidence independently of whole-mass closure. Distinguish true oxygen consumption from air throughput, water uptake from evaporation and measured IPA from total VOC. Preserve gross source/medium flows; any net value requires its two observed sides. One residual cannot fit two unknowns."
      unit: "kg; native raw units"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_vectors
      process_id: "hat_manufacture"
      flow_role: "stocks_and_inherited_exchange_vectors"
      record_type: "Disjoint physical and burden histories"
      raw_fields: "entity/lot; raw/WIP/unused nonWIP/FG; opening/closing physical quantities; each historical exchange vector; new work; prior normalization flag; failed/Q0 work; causal assignment"
      collection_method: "Carry every inherited exchange in its own native unit across periods, not just total mass/cost. Avoid overlapping raw/WIP/non-WIP sets and do not deduct released closing FG from manufacturing burdens. Gross receipts and already-net consumption require different equivalent bridges, never simultaneous corrections."
      unit: "kg; each exchange native unit"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "original_cohort_services"
      record_type: "Gross custody and observed increments"
      raw_fields: "original Qc; H start/end; opening/closing FG; matched handoff; gross dispatch and external returns; previous dispatch reversal; historic vectors; actual new repair/cleanup inputs and all wastes/species; held/failed status"
      collection_method: "Match actual article/batch history. Retain manufacture once and observed post-release services for original Qc, even for held goods. Record added glue/cord/water and actual new outputs separately; no release/retest duplication. Humidity change is not automatically a repair or a new material purchase."
      unit: "kg; kWh; each exchange native unit"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
    - protocol_id: cp_packaging
      process_id: "packaging_pool"
      flow_role: "each_named_package"
      record_type: "Complete article-specific custody pool"
      raw_fields: "article identity/SKU/material; measured tare; purchase or first non-purchase receipt; accompanying-material or separate hire/loan/free-transfer origin; same-article prior site outbound event and evidence for ER; provider environmental-data availability; evidenced supply/service coverage and uncovered or unresolved burdens; original Qc/H; opening/closing empty and attached WIP/FG and reusable; P; I; ER; S_gross; EO; W; internal reuse; repair; contamination; each inherited vector"
      collection_method: "Weigh/count every actual carton, bag, tape, pallet and additional supplier container separately. Classify disjoint P/I/ER from acquisition and custody records: I includes all first non-purchased external receipts, whether accompanying materials or separately hired, borrowed or freely transferred; ER requires the same article and its evidenced prior dispatch from this site. Retain all gross incoming physical mass even without environmental data; disclose unresolved receipt history. Verify provider coverage independently, retain uncovered or unresolved supply/service burdens and do not charge evidenced coverage twice or equate missing data with zero. Use complete assembly or non-overlapping parts. Reconcile physical pools on gross movements including external returns; retain historical and service burdens without repurchasing internal reuse. Track actual tape/pallet outward records even where no separate purchase occurs."
      unit: "kg; item"
      frequency: "Each event/lot and measured interval"
      temporal_coverage: "Complete reporting period plus original-cohort H where relevant"
      site_scope: "Actual printer converter assembler and receiver interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations; raw records; method and detection limits; stock/vector reconciliation; uncertainty"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert raw units before attribution: kg from direct mass; m=rho_state*V_integrated only with independently measured density at the actual state; for true rate integrate rate over time first. E_MJ=3.6*E_kWh. Never multiply an already integrated V by duration. Whole wet formulation and its assays are alternative/non-additive representations."
      inputs:
        - raw_records
        - rho_state
        - V_integrated
        - rate
        - duration
        - E_kWh
      output: "native_numerator"
      source_ids: []
    - id: physical_closure
      applies_to: "manufacturing FG and combined gates"
      rule: "For each disjoint physical gate: opening stocks + true gross inputs including F = closing stocks + true gross outputs; count each same-side event once. X removes only actual same-side duplication in OTHER. For manufacturing, newly first-released Q is an outgoing transfer; for FG the identical Q is incoming; cancel on combination. Independently close relevant elements and species with measured state changes, not fitted unknowns."
      inputs:
        - cp_release
        - cp_materials
        - cp_waste
        - cp_species
        - cp_fg
        - F
        - X
      output: "gross_V_i"
      source_ids: []
    - id: production_vectors
      applies_to: "manufacturing burden vectors"
      rule: "On a gross-receipt basis for each exchange i: A_prod_i = B_openRaw_i + B_openWIP_i + B_openNonWIP_i + B_new_i - B_closeRaw_i - B_closeWIP_i - B_closeNonWIP_i, after dedicated/virtual subdivision and justified residual attribution. Sets are disjoint and each component keeps its own native unit. B_new retains all actual failures/startstop/idle/cleanup/Q0 work. Released closing FG is never a manufacturing Bclose. Already-net consumption uses its equivalent bridge without a second stock correction."
      inputs:
        - native_numerator
        - cp_vectors
        - allocation_evidence
      output: "A_prod_i"
      source_ids:
        - ilcd-detailed-2010
    - id: service_vectors
      applies_to: "fg_service and packaging_pool"
      rule: "A_service_i contains only actual new attributable service burdens observed in H for original Qc, including failed repair/held goods. Keep historical cohort vectors and all physical FG/package stocks separately without buying manufacture again. Packaging acquisition/use/retirement histories reconcile independently. Gross V_i is never multiplied by a burden share."
      inputs:
        - cp_fg
        - cp_packaging
        - historical_vectors
        - allocation_evidence
      output: "A_service_i"
      source_ids:
        - ilcd-detailed-2010
    - id: packaging_closure
      applies_to: "each packaging article"
      rule: "Opening_empty + Opening_attached + Opening_reusable + P + I + ER = Closing_empty + Closing_attached + Closing_reusable + S_gross + EO + W. Attached includes WIP and FG. Match internal reuse/attachment on both sides and cancel it; use gross dispatch, not net sales. Package stocks/burdens remain outside hat Q and do not automatically create a credit."
      inputs:
        - cp_packaging
        - P
        - I
        - ER
        - S_gross
        - EO
        - W
      output: "package_pool_closure"
      source_ids: []
    - id: single_normalization
      applies_to: "all inventory rows"
      rule: "result_i = N_i / D_c, once only. N_i is full native physical gross V_i for the physical view or separately identified A_prod_i/A_service_i for the burden view; do not add these views. D_c is measured first-release Q or original Qc for observed service/packaging cohorts. If D_c=0 retain actual raw quantities/vectors without a unit result. Keep cohort results separate before an explicit Q-weighted combination. released_hat is exactly1 kg; cards and aggregation labels reference this same result with no second division."
      inputs:
        - native_numerator
        - gross_V_i
        - A_prod_i
        - A_service_i
        - Q
        - original_Qc
      output: "result_i"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify supplied whole object, complete native UUID semantics, state and exact property/unit support; include all limitations in consumer context. Auxiliary gaps remain concrete, not zero."
      evidence: "Supplier specs; actual direct object and unit chain; compatibility decision"
    - id: dq_representative
      applies_to: "all protocols"
      requirement: "Cover complete actual periods, failed campaigns and all shifts with representative sampling, calibrations, detection limits and uncertainties. No catalogue average or marketing capacity becomes a site quantity."
      evidence: "Raw logs; meter scope; batch records; sampling plan"
    - id: dq_no_overlap
      applies_to: "supply stocks and mixtures"
      requirement: "Reconcile supplier-owned print, complete formulas, all disjoint stocks and inherited vectors, actual gross mixture transfers and packaging pools. No concurrent whole-mixture and component purchases or exports."
      evidence: "Interface map; weighed pool and species balances; actual receiver records"
    - id: dq_gaps
      applies_to: "dataset readiness"
      requirement: "Separate missing future plant quantities/providers from an unsupported product boundary or essential method. Unknown density/speciation/stock history prevents a complete concrete dataset; it is not evidence of zero or automatic approval."
      evidence: "Explicit unresolved list and affected result scope"
    - id: dq_bilingual
      applies_to: "all rules and fields"
      requirement: "Both languages preserve identical scope, Q/Qc/H, formulas, row/source IDs, full restrictions and scientific pending status; Chinese official flow names follow native records. Engineering checks do not review science or translation."
      evidence: "Complete raw-to-typed comparison and human semantic alignment"
validation_rules:
  - rule_id: validate_product
    applies_to: "released_hat"
    rule: "Require a complete assembled nonpyrotechnic paperboard party cone with cured seam and attached cord, product evidence and all qualifiers. Reject raw paper/packaging/ordinary headgear/candles/pyrotechnics or a flat unassembled kit as the reference."
    source_ids:
      - un-cpc3-2025
      - hercule-party-cone
      - m13-party-hat
  - rule_id: validate_route
    applies_to: "hat_manufacture"
    rule: "Verify actual conventional sheetfed offset, cut/punch, emulsion seam and real cord attachment. Unsupported printing/finish variants need completed extension. Track supplier print ownership without overlapping board or ink/energy/waste burdens. Actual deviations and failed/unauthorized operations remain factual inventory."
    source_ids:
      - m13-equipment
      - epa-offset-2006
      - fuller-side-seam
  - rule_id: validate_q
    applies_to: "release and FG"
    rule: "Check unique first release and measured conditioned net Q with closing accepted FG already included. No delivery/retest/return creates Q. Original Qc/H links actual increments; H is not a denominator. Q0 retains all real burdens and no unit result."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "all gates"
    rule: "Close independent whole-mass, relevant element and real species/phase balances with actual density and rate conventions. Preserve gross V regardless of economic/service/stock attribution. F is truly new; X requires identical same-side evidence. Internal Q and process transfers cancel exactly."
    source_ids: []
  - rule_id: validate_packaging
    applies_to: "packaging_pool"
    rule: "Verify each complete article pool including attached WIP/FG, reusable stocks, external-return receipts, gross outward shipments, separate returns and waste. No automatic repurchase/reuse credit or packaging in Q."
    source_ids: []
  - rule_id: validate_once
    applies_to: "collection and calculation"
    rule: "Protocols collect raw values. Convert native units and make genuine allocation before single_normalization exactly once. Audit every table cell, ten card fields, complete description, qualifier element, calculation Inputs/Output, source four fields and source lists; no supported-form shortcut may omit methodology."
    source_ids: []
  - rule_id: validate_sources
    applies_to: "all inventory rows"
    rule: "Every source must support the actual product/process/route/state and intended use. Product offerings, typical numbers and copied cache labels do not establish field measurements or regulatory conclusions. Require real species/formula/provider evidence before concrete result completeness."
    source_ids: []
  - rule_id: validate_unknown
    applies_to: "all results"
    rule: "Unresolved core boundary or essential method is a true hold; ordinary auxiliary UUID/provider and future measurement gaps remain explicit. Unknown facts or unsupported relationships must not be labelled pass, absent or covered. Publication and scientific/translation review are separate decisions."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified assembled festive-cone production for later measured supply-chain models"
  allowed_use: "Only compatible product configuration, actual route, supply boundary and normalized first-release basis with full context"
  excluded_use: "Whole38991 coverage; ordinary hats; toys/candles/pyrotechnics; flat kits; universal recipe or emission factors; safety or environmental performance certification"
  required_metadata: "All qualifiers; actual native units and provider limits; Q/Qc/H; full stocks and vectors; actual mixtures/species/receivers; packaging pools; allocation and uncertainty"
  required_quality_disclosure: "Primary-source synthesis and transfer limits; actual observation coverage; unresolved auxiliary/provider/measurement gaps; failed cases; no scientific or translation approval inferred"
  update_trigger: "Changed board/coating/ink/adhesive/cord/fastener, printing/assembly route, supplier gate, release basis, utilities, species, waste routing or material evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 Structure and Explanatory Notes30June2025; PDF pp. 133, 196–198. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "38991 title and adjacent ordinary headgear/38999 boundaries; classification scope evidence for the separately recorded narrower decision"
  - id: "hercule-party-cone"
    type: "literature"
    reference: "Hercule Industrial EVF99091 Custom Paperboard Party Hat, product construction and options. https://herculeindustrial.com/products/folding-cartons/engview/evf99091-custom-paperboard-party-hat"
    used_for: "Printed sector, cone seam, separate elastic, assembled nested versus flat delivery and master carton; engineering supplier source, no factory recipe"
  - id: "m13-party-hat"
    type: "literature"
    reference: "M13 Graphics Party Hat Printing, product details and production options. https://m13print.com/printing/party-hat-printing"
    used_for: "Actual coated-stock hat product, CMYK, diecut and separately attached barbed cord; optional foil/lamination excluded, sample sizes not defaults"
  - id: "m13-equipment"
    type: "literature"
    reference: "M13 Graphics Equipment Available. https://m13print.com/equipment"
    used_for: "Real prepress, offset/digital alternatives and cutting/gluing capability; not proof one specific order uses every machine"
  - id: "lion-party-hat"
    type: "literature"
    reference: "Lion Circle A20D Scalloped Party Hat with Elastic. https://www.lioncircle.com/products/product/scalloped-party-hat-with-elastic-a20d"
    used_for: "Independent paperboard/attached-elastic product; flat shipment is countercontext, not evidence of an assembled cone"
  - id: "fuller-side-seam"
    type: "literature"
    reference: "H.B. Fuller FULLABOND215 Technical Data Sheet Version1 printed01/03/17, complete one-page table and limitations. https://www.hbfuller.com.au/media/1367/fullabond_215_tds_nz.pdf"
    used_for: "Synthetic-polymer emulsion side-seam technology and wet warm-water cleanup; compatible-substrate synthesis only, no actual hat brand link or numerical default"
  - id: "epa-offset-2006"
    type: "official_guidance"
    reference: "US EPA EPA-453/R-06-002 September2006, Control Techniques Guidelines for Offset Lithographic Printing and Letterpress Printing, PDF12–16 with route alternatives. https://www3.epa.gov/airquality/ctg_act/200609_voc_epa453_r-06-002_litho_letterpress_printing.pdf"
    used_for: "Sheetfed printing/setting, whole inks, fountain and cleaning pathways versus heatset/UV/letterpress; no retention/emission fraction or present regulatory conclusion"
  - id: "ilcd-detailed-2010"
    type: "official_guidance"
    reference: "European Commission JRC ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, §§7.9.2–7.9.3 PDF275–285 including neighboring cases. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision, exchange-specific determining physical causality and truly residual common-gate/state market value; no fixed share or automatic recycling credit"
