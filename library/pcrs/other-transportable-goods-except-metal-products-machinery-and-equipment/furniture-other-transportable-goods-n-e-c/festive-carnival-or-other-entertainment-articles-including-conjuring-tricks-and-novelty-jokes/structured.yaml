culation Inputs/Output, source four fields and source lists; no supported-form shortcut may omit methodology. |  |\n| validate_sources | all inventory rows | Every source must support the actual product/process/route/state and intended use. Product offerings, typical numbers and copied cache labels do not establish field measurements or regulatory conclusions. Require real species/formula/provider evidence before concrete result completeness. |  |\n| validate_unknown | all results | Unresolved core boundary or essential method is a true hold; ordinary auxiliary UUID/provider and future measurement gaps remain explicit. Unknown facts or unsupported relationships must not be labelled pass, absent or covered. Publication and scientific/translation review are separate decisions. |  |\n\n"
