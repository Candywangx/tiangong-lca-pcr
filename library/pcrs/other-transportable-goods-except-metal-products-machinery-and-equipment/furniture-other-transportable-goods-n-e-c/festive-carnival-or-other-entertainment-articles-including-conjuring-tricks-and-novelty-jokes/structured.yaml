          offset: 96829
          line: 1224
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nApply this hierarchy only to the declared attributional situation in which allocation is needed. Manufacturing descriptions do not authorize LCA allocation. Physical custody and total species balances remain unallocated; each burden numerator is assigned separately.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_dedicated | shared operations | First isolate dedicated operations, orders, plate/ink issues, die/assembly tasks and measured utilities. Use actual or virtual subdivision to assign each exclusively caused exchange, including failed setups and cleaning. Document the reason if subdivision is infeasible. | ilcd-detailed-2010 |\n| allocation_causality | remaining individual exchanges | For each remaining exchange demonstrate its determining physical causality, with measured intensity, scope and period. Printed area may determine one ink demand while actual load-time may determine electricity; neither is universal. Packaging/FG services use the actual limiting capacity and observed duration where causal. Do not apply one physical key to every exchange. | ilcd-detailed-2010 |\n| allocation_residual | true unresolved joint burden | Only truly inseparable residual burdens may use contemporaneous market values at the same joint-process gate in the actual co-output state and quantity. Remove downstream processing/packing/transport value from the comparison; retain prices, quantities, uncertainties and sensitivity. No fixed split, arbitrary physical/economic choice, marketing value or automatic avoided-product credit. | ilcd-detailed-2010 |\n| allocation_physical | gross physical and stock ledgers | Do not scale gross actual inputs, hat/waste/species outputs, repair additions or package transfers by burden shares or closing-stock burden deductions. Keep full V_i and inherited vectors independently. Internal return loops cancel without hiding new work; sold trim does not automatically become a coproduct. Actual waste/product function and receiving status require evidence and compatible type. |  |\n| allocation_cohorts | failed work and FG services | Keep Q0 and unsuccessful work with its actual causal cohort or an explicit unassigned burden. Post-release work uses original Qc and only actual new increments over H, including work on held or ultimately discarded goods. Neither dispatch volume nor H replaces Qc; no reuse count is invented. | ilcd-detailed-2010 |\n\n"
