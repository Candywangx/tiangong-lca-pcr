system_boundary:
  rules:
    - rule_id: complete_route
      applies_to: "hat_manufacture"
      rule: "Include receipt, artwork/actual proofing and plate provision, actual print passes, setting, trim and holes, rolling/gluing, elastic attachment, tests, all cleaning, start/stop, idle, sampling, losses, failed work and pre-release rework. Include actual tool/blanket replacement and maintenance. The source printer has offset and digital alternatives; only the declared conventional offset route is selected."
      source_ids:
        - hercule-party-cone
        - m13-party-hat
        - m13-equipment
        - epa-offset-2006
    - rule_id: supply_once
      applies_to: "all purchased inputs"
      rule: "One purchase per complete supplied board/formulation/cord assembly. Embedded coating, ink pigment/vehicle, glue solids/water and supplied barbs are constituent subledgers, not additional purchases. If actual separate cord and fasteners are bought, replace the assembly by disjoint atomic components. Onsite mixing adds only actual independently purchased ingredients, utilities and losses."
      source_ids:
        - m13-party-hat
        - fuller-side-seam
        - epa-offset-2006
    - rule_id: printing_owner
      applies_to: "printing interface"
      rule: "Trace printing back to board receipt. For outsourced printing either include the actual supplier print foreground with matched sheet transfer or use one complete printed-board provider covering board/plates/ink/wash/energy/waste. Never also buy the same unprinted board and printer burdens. Include uncovered freight and failed sheets at their actual owner."
      source_ids:
        - m13-party-hat
        - m13-equipment
    - rule_id: release_stocks
      applies_to: "Q and stocks"
      rule: "First release Q includes accepted closing FG once. Keep raw, pre-release WIP, genuinely unused non-WIP tooling/formulation stocks and FG disjoint with each historical exchange vector. Manufacturing closing-burden deductions exclude already released FG. Failures and Q0 burdens remain assigned by actual causality or explicitly unassigned."
      source_ids: []
    - rule_id: fg_service
      applies_to: "fg_service"
      rule: "Retain storage, packing, handling, gross dispatch/returns, reinspection and actual incremental repair over H for original Qc, including held goods. Preserve historic manufacture once; delivery/retest is not new output. Natural humidity exchange is distinct from added glue/water in repair."
      source_ids: []
    - rule_id: physical_gate
      applies_to: "manufacturing FG and combined gates"
      rule: "Use whole wet objects or an exhaustive non-additive component bridge. Manufacturing has Q outgoing once plus actual other exits and closing pre-release stocks; FG has the same Q incoming plus opening FG/returns and gross dispatch/exits/closing FG. Cancel the identical internal Q when combined. F denotes real newly crossing material. X may remove only an identical same-side crossing already counted in OTHER; opposite-side events, repair water, uptake, stock or a label match are not duplicates."
      source_ids: []
    - rule_id: waste_species
      applies_to: "each actual outlet"
      rule: "Keep trim, failed printed sheets, glued-hat rejects, spent ink, wet glue, wash liquid, wipes and actual species distinct. If physically mixed use one measured total and one actual receiver/provider; measured originW partitions are non-additive. Actual unauthorized releases remain reported in their real medium. No default VOC species/factor, no COD-to-chemical conversion and no assumed onsite abatement."
      source_ids:
        - epa-offset-2006
        - fuller-side-seam
    - rule_id: water_heat
      applies_to: "water reactions and thermal interfaces"
      rule: "Reconcile wet mass and relevant C/H/O elements independently of actual molecular species. Distinguish free/carrier, retained/structural and reaction water; oxidation uptake and evaporation require independent evidence. Heating water electrically is within measured electricity, not another purchased heat input. If real supplied heat/steam exists add its energy and carrier mass/state/enthalpy and actual Product condensate or heat-exchange-water return with supplier water-energy coverage; never invent a boiler."
      source_ids:
        - epa-offset-2006
        - fuller-side-seam
    - rule_id: package_pools
      applies_to: "each packaging article"
      rule: "For each article: opening empty + attached WIP/FG + reusable stocks + external purchases P + first non-purchased external receipts I + evidenced returns of prior site dispatches ER = closing empty + attached WIP/FG + reusable stocks + quantity accompanying gross shipments S + separate outward returns EO + waste W. P, I and ER are mutually exclusive. I includes packaging accompanying incoming materials and separately delivered hired, borrowed or freely transferred articles. ER requires evidence identifying the same article and its prior outbound event from this site. Record every incoming physical mass regardless of environmental-data availability; missing receipt history remains explicit and never removes the mass. Separate evidenced material/transport/service provider coverage from uncovered or unresolved supply burdens; charge covered burdens once and never assume missing environmental data mean zero burden. Internal reuse cancels and neither increases Q nor purchases nor coproduct output. Whole supplied packages and their components cannot overlap."
      source_ids:
        - hercule-party-cone
    - rule_id: actual_extension
      applies_to: "all actual exchanges"
      rule: "Survey actual material, chemical, utility, maintenance, waste and emission records. Add each present unlisted atomic input/outlet, transport service or medium-specific species before a completeness claim. Inapplicability requires evidence of absence; unknown is not zero. Qualification/marketing limits cannot erase actual activities."
      source_ids: []
