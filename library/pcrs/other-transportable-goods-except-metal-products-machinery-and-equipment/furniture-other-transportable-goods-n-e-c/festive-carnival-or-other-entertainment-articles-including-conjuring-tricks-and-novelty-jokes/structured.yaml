          offset: 15065
          line: 89
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased coated printing board sheets; actual complete CMYK formulations; supplied seam emulsion; ready elastic cord/fasteners; imaged printing plates and utilities at actual printer/converter interfaces |\n| starting_condition_role | Gate-to-gate conversion/assembly with required upstream manufacture; not a purchased-finished-hat packing model |\n| product_classification_scope | Narrow complete non-pyrotechnic festive-cone subset of38991; no whole-leaf coverage claim |\n| recursive_input_rule | Internal printed sheets/cones/first-release handoffs cancel at combined gates. Externally printed board is a supplier interface with printing coverage once. Previously released hats received for repair retain original Qc and historical burdens; no new Q. |\n| upstream_dataset_requirement | Compatible board/furnish/coating, each whole formulation, cord and actual fasteners, imaged plates, packaging, utilities, tooling use, freight and each external waste treatment; disclose missing provider scopes without zeroing |\n| disclosure | All physical gates, sites/periods, supplier ownership and printing allocation, Q/Qc/H, stocks and inherited vectors, condition and moisture, package pools, actual receivers and unresolved evidence |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| complete_route | hat_manufacture | Include receipt, artwork/actual proofing and plate provision, actual print passes, setting, trim and holes, rolling/gluing, elastic attachment, tests, all cleaning, start/stop, idle, sampling, losses, failed work and pre-release rework. Include actual tool/blanket replacement and maintenance. The source printer has offset and digital alternatives; only the declared conventional offset route is selected. | hercule-party-cone; m13-party-hat; m13-equipment; epa-offset-2006 |\n| supply_once | all purchased inputs | One purchase per complete supplied board/formulation/cord assembly. Embedded coating, ink pigment/vehicle, glue solids/water and supplied barbs are constituent subledgers, not additional purchases. If actual separate cord and fasteners are bought, replace the assembly by disjoint atomic components. Onsite mixing adds only actual independently purchased ingredients, utilities and losses. | m13-party-hat; fuller-side-seam; epa-offset-2006 |\n| printing_owner | printing interface | Trace printing back to board receipt. For outsourced printing either include the actual supplier print foreground with matched sheet transfer or use one complete printed-board provider covering board/plates/ink/wash/energy/waste. Never also buy the same unprinted board and printer burdens. Include uncovered freight and failed sheets at their actual owner. | m13-party-hat; m13-equipment |\n| release_stocks | Q and stocks | First release Q includes accepted closing FG once. Keep raw, pre-release WIP, genuinely unused non-WIP tooling/formulation stocks and FG disjoint with each historical exchange vector. Manufacturing closing-burden deductions exclude already released FG. Failures and Q0 burdens remain assigned by actual causality or explicitly unassigned. |  |\n| fg_service | fg_service | Retain storage, packing, handling, gross dispatch/returns, reinspection and actual incremental repair over H for original Qc, including held goods. Preserve historic manufacture once; delivery/retest is not new output. Natural humidity exchange is distinct from added glue/water in repair. |  |\n| physical_gate | manufacturing FG and combined gates | Use whole wet objects or an exhaustive non-additive component bridge. Manufacturing has Q outgoing once plus actual other exits and closing pre-release stocks; FG has the same Q incoming plus opening FG/returns and gross dispatch/exits/closing FG. Cancel the identical internal Q when combined. F denotes real newly crossing material. X may remove only an identical same-side crossing already counted in OTHER; opposite-side events, repair water, uptake, stock or a label match are not duplicates. |  |\n| waste_species | each actual outlet | Keep trim, failed printed sheets, glued-hat rejects, spent ink, wet glue, wash liquid, wipes and actual species distinct. If physically mixed use one measured total and one actual receiver/provider; measured originW partitions are non-additive. Actual unauthorized releases remain reported in their real medium. No default VOC species/factor, no COD-to-chemical conversion and no assumed onsite abatement. | epa-offset-2006; fuller-side-seam |\n| water_heat | water reactions and thermal interfaces | Reconcile wet mass and relevant C/H/O elements independently of actual molecular species. Distinguish free/carrier, retained/structural and reaction water; oxidation uptake and evaporation require independent evidence. Heating water electrically is within measured electricity, not another purchased heat input. If real supplied heat/steam exists add its energy and carrier mass/state/enthalpy and actual Product condensate or heat-exchange-water return with supplier water-energy coverage; never invent a boiler. | epa-offset-2006; fuller-side-seam |\n| package_pools | each packaging article | For each article: opening empty + attached WIP/FG + reusable stocks + external purchases P + first non-purchased external receipts I + evidenced returns of prior site dispatches ER = closing empty + attached WIP/FG + reusable stocks + quantity accompanying gross shipments S + separate outward returns EO + waste W. P, I and ER are mutually exclusive. I includes packaging accompanying incoming materials and separately delivered hired, borrowed or freely transferred articles. ER requires evidence identifying the same article and its prior outbound event from this site. Record every incoming physical mass regardless of environmental-data availability; missing receipt history remains explicit and never removes the mass. Separate evidenced material/transport/service provider coverage from uncovered or unresolved supply burdens; charge covered burdens once and never assume missing environmental data mean zero burden. Internal reuse cancels and neither increases Q nor purchases nor coproduct output. Whole supplied packages and their components cannot overlap. | hercule-party-cone |\n| actual_extension | all actual exchanges | Survey actual material, chemical, utility, maintenance, waste and emission records. Add each present unlisted atomic input/outlet, transport service or medium-specific species before a completeness claim. Inapplicability requires evidence of absence; unknown is not zero. Qualification/marketing limits cannot erase actual activities. |  |\n\n"
