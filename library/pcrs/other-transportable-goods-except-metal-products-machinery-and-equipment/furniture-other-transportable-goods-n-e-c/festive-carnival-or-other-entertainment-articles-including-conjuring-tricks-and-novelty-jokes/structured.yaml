measurement_rules:
  - id: release_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is the measured net mass of unique newly first-released complete hats after actual glue/ink setting and declared conditioning. Exclude packaging, blanks, rejected pieces and previous releases. Closing FG from this cohort is already in Q."
  - id: native_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass; energy; actual native dimensions"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "Measure each supplied whole formulation once; carrier water and assay solids are non-additive component accounts. Use raw mass or independently measured state-specific density for liquid volume. Already integrated volume is not multiplied by time; integrate only a true rate. Convert kWh to MJ by3.6 once. Secondary flow coefficients do not establish field density."
  - id: physical_species
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep whole wet mass, relevant elemental balances and measured species/phase/source/medium separate. Independent water and oxidation evidence is required; one closure residual cannot solve oxygen uptake and evaporation. VOC/COD are indicators, not molecular species."
  - id: one_result
    applies_to: "all inventory rows"
    required_property_ref:
      name: "native exchange property"
      uuid: ""
    required_unit: "native unit"
    rule: "Raw protocols do not normalize. Section8 single_normalization alone divides the converted and genuinely assigned numerator by Q or original Qc once. Cards and aggregation labels reference that result. H is the observation interval, not another divisor. Q0 retains actual burdens without unit results."
