      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_subdivide | all burden coordinates | Declare an attributional product-manufacturing goal and determine whether multifunctionality actually requires allocation rather than substitution. Directly attribute dedicated lots/operations first; apply real or justified virtual subdivision of cutting, polishing, treatment and services. Industrial manufacturing evidence is not an LCA allocation authority. Retain the complete unallocated vector and every function. | ilcd-attributional-2010 |\n| a_causal | each genuinely inseparable exchange | For each remaining shared nonfunctional exchange identify and quantify its determining physical causal relation to each function at the real process state; prove the driver rather than choosing mass/count/time/energy arbitrarily. Different coordinates may have different causal drivers. Gross physical legs retain full real mass/energy/species and are never multiplied by burden shares. | ilcd-attributional-2010 |\n| a_residual | residual shared burden only | Only documented residual exchanges after subdivision and exchange-specific causality may use contemporaneous real market values of the cofunctions in their actual condition at the common process exit or relevant treatment input gate. Preserve quantities, gate-price adjustments, currency/period, all functions and sensitivity; no retail finished-jewellery value, fixed fraction, arbitrary physical/economic switch or automatic avoided-product credit. | ilcd-attributional-2010 |\n| a_ordinary_waste | failures and offcuts and samples and services | Ordinary manufacturing waste, failures, samples, broken gems and their treatment stay with original manufacturing/service even when externally removed or sold. T_legitimate is allowed only for a real distinct other function/cohort with justified allocation/handover and receipt, applied once to its vector. Keep all physical gross legs unscaled. Internal stone/water/tool/packaging reuse cancels matching transfers without new purchase, Q or credit. | ilcd-attributional-2010 |\n\n"
