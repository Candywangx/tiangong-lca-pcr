system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "all processes"
      rule: "Begin with burden-bearing identified natural amethyst whole rough or simply trimmed pieces; include real selection/color orientation, actual cobbing/trim sawing and rough shaping, dopping, water-fed coarse/fine faceting and prepolish, cerium-coated-film polishing of real pavilion/crown/table/girdle, transfer/removal, cleaning, grading/testing and first release. Keep actual water, tool wear, materials, emissions and pollution controls. Never replace manufacture with buying a finished stone and repacking."
      source_ids:
        - ultratec-v5-2015
        - gia-fourpeaks-2004
        - ultratec-ceralap
    - rule_id: b_treatment
      applies_to: "all material states"
      rule: "This unenhanced route excludes deliberate heat-lightening, irradiation, dyeing, fracture filling, synthetic growth and reconstruction as qualifying output. The Four Peaks source explicitly documents a heat-treated subset and fracture failures adjacent to the worked-product evidence. Do not infer all source stones untreated. Trace actual supplied-state treatment; already completed real upstream operations belong once to its provider. Actual outside-scope/unauthorized/failed operations and all flows remain recorded as held/reject/other legitimate function, not hidden zero; a changed route requires evidence and review before claiming this method. Damp-cloth protected local dop warming is recorded distinctly and does not license heating the gemstone."
      source_ids:
        - gia-fourpeaks-2004
        - ultratec-v5-2015
        - gia-amethyst-care
    - rule_id: b_first_release
      applies_to: "p_make; p_service"
      rule: "Q_c is the newly first-quality-released net whole-gem mass of original cohort c, not net delivery. Closing released FG is already in Q_c and cannot be added as production or deducted from manufacturing burden. p_make output and p_service internal receipt match exactly and cancel in the combined physical account. Actual G/R customer logistics, holding, packaging/handling/dispatch and postwork have separate service accounting by original Q_c and observed H. Reinspection/return/redelivery creates no new Q. Original Q_c is fixed at unique first release; H is observed coverage, never another divisor. Use one complete wet custody gate OR disjoint net-stone and moisture/component gates, never both additively. In a whole gate O_FG+T_new+R_ext+F_in-X_in=C_FG+G_ext+W_actual+F_out-X_out. T_new is the actual paired internal physical handoff; its accepted net-stone component is already Q_c, while separately measured accompanying water never enlarges Q. Pair and cancel every internal component transfer at consolidation. F are real measured matter/water changes; X only proved duplicate same-side OTHER flows. Keep all actual unauthorized/failed/held work and actual changed returns without assumed restoration or a second release."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_complete
      applies_to: "all exchanges"
      rule: "Record all actual startup/shutdown, idle, cleanup, zero-output, breakage, tests, failed/unauthorized work and rework plus opening/closing WIP and inherited per-flow vectors. An absent or unknown required exchange is never silently zero. Every additional real substance/formulation, species, heat carrier, fluid, packaging article or repair part gets its own atomic card and native property. Actual postrelease rework needs manufacturer/spec permission, posttests, acceptance or disposition; missing permission does not delete work already performed and broken gems are not assumed restored. For each actual packaging SKU/state pool close K_open+P+I+ER+F_in-X_in=K_close+gross_S+EO+W+F_out-X_out. F are independently measured real material/water additions/removals, including natural humidity, never residual corrections. X subtracts only a proved duplicate SAME-side OTHER actual-flow term linked by paired event IDs; never stocks, opposite-side flows, card presence or genuine newly retained influx. Keep full wet empty/attached-WIP/attached-FG/reusable stocks and actual new water/material simultaneously. Use the whole wet supplied article OR disjoint constituents linked by a measured component-to-assembly bridge; paired internal handoffs cancel. Natural humidity needs no invented repair or permission. One actual mixed outlet uses its whole total OR independently measured origin-W partitions, not total plus children or duplicate providers. Actual separate outlets require actual separate evidence; unknown/damaged Product/Waste status remains in the full gross ledger with compatible identity pending, never forced reusable Product. Reconcile each whole-article count gate separately as O_n+R_in_n=C_n+R_out_n. Reconcile its independently measured mass/component gate as O_m+R_in_m+F_in_m-X_in_m=C_m+R_out_m+F_out_m-X_out_m. Do not add kg of water or parts to Item(s), infer machine mass from count, or add whole and component views. F is real added/removed material/water; X only proved same-side OTHER duplicate flows, never stocks or opposite legs. Whole supplied installed fluids/parts belong once; actual separate supplies require disjoint receipts or an independently measured assembly bridge with cancelling internal transfers. One actual whole mixed retirement outlet OR independently measured origin partitions has one provider. Keep full physical stocks separately from fulfilled service and unused/unassigned charge."
      source_ids:
        - ultratec-v5-2015
        - gia-amethyst-care
    - rule_id: b_carriers
      applies_to: "all supplies"
      rule: "Do not invent steam, boiler, fuel, heat, thermal condensate return or a fixed cleaning temperature. If a real thermal carrier is introduced, separately preserve actual external Product supply/return masses, state/enthalpy and thermal MJ with supplier water/energy convention and no whole-provider duplication. Cumulative gas/liquid volume is not multiplied by time; integrate only actual rates. Local free atmospheric Resource ingress is distinct from gas/water already contained in whole rough, an adhesive/alcohol preparation, an asset or a separately purchased gas Product. Contained constituents remain nonadditive subaccounts with that single upstream owner. Actual separately purchased compressed air or gas requires its own atomic Product card and measured state/pressure/native-property interface; internal air handoffs cancel while real compression/ventilation loads and releases remain. Actual molecular gross transfer differs from net environmental change; no standard air fraction or assumed complete combustion."
      source_ids:
        - ultratec-v5-2015
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-attributional-2010
