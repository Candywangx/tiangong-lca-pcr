      flow_role: "manufacturing materials utilities losses"
      record_type: "raw manufacturing ledger"
      raw_fields: "each atomic row and process step; real supplier/SKU/whole preparation; raw unit and reading/rate/total flag; receipts and stocks; opening/closing WIP; failure/startstop/idle/cleanup; actual coolant/water phase; wet/dry chemical and mineral assay; each raw quantity and per-flow inherited vector; source/destination; owner; uncertainty; F_in; F_out; proved_same_side_OTHER_duplicate_X; paired_event_id; actual_originating_process_id; actual_row_id; real_direction; physical_gate; original_cohort_Q_c; observed_H_not_divisor"
      collection_method: "Collect un-divided meter/scale/process records by actual operation, supplied whole preparation and each physical outlet. Measure each species and moisture/solid pools independently; retain supplier-included packaging owner, actual additive ingredients only if separately supplied, tool wear and actual raw/WIP balances. Separate direct cohort physical consumption from environmental-burden allocation; never use nominal motor rating as electricity. This actual Waste or elementary-release quantity is the full gross V in its own native unit and actual direction/gate. Its single section8 quotient uses V/Q_c, never stock-corrected consumption, an allocated burden share or an additional provider purchase/credit. Preserve all actual failed/unauthorized events and measured whole/component ownership."
      unit: "row-native kg; MJ; m3; Item(s)"
      frequency: "every batch and continuous actual meter interval"
      temporal_coverage: "whole original manufacturing cohort including all failures and stocks"
      site_scope: "Actual declared site/provider/original cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; supplier specifications; original logs; phase/species measurements; stage totals"
    - protocol_id: cp_assets
      process_id: "p_make"
      flow_role: "tools and assets and repair fluids"
      record_type: "gross asset and service ledger"
      raw_fields: "each whole machine/tool/dop/bearing/oil; new/used; separately received net mass/count; opening and in-use and closing full wet stocks; actual influx/outflux; same-side duplicated terms X_in/X_out; repairs; retirement; lifetime service evidence; actual assigned charge; unused/unassigned charge; F_in; F_out; proved_same_side_OTHER_duplicate_X; paired_event_id; actual_originating_process_id; actual_row_id; real_direction; physical_gate; original_cohort_Q_c; observed_H_not_divisor"
      collection_method: "Measure gross physical event once, with disjoint whole-article/component and retained-fluid pools; never delete a real receipt retained in closing stock. Separately derive actual period service charge from documented technical use/lifetime evidence and uncertainty, not fixed lives or one machine per kg; attribute already performed service to original cohort. Reconcile each whole-article count gate separately as O_n+R_in_n=C_n+R_out_n. Reconcile its independently measured mass/component gate as O_m+R_in_m+F_in_m-X_in_m=C_m+R_out_m+F_out_m-X_out_m. Do not add kg of water or parts to Item(s), infer machine mass from count, or add whole and component views. F is real added/removed material/water; X only proved same-side OTHER duplicate flows, never stocks or opposite legs. Whole supplied installed fluids/parts belong once; actual separate supplies require disjoint receipts or an independently measured assembly bridge with cancelling internal transfers. One actual whole mixed retirement outlet OR independently measured origin partitions has one provider. Keep full physical stocks separately from fulfilled service and unused/unassigned charge."
      unit: "kg; Item(s); actual charge unit"
      frequency: "each receipt installation repair transfer and retirement"
      temporal_coverage: "opening through closing plus actual service horizon"
      site_scope: "Actual declared site/provider/original cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; mass/count and fluid measurements; work orders and service derivation"
    - protocol_id: cp_species
      process_id: "p_make"
      flow_role: "actual air and moisture species"
      record_type: "raw species and phase ledger"
      raw_fields: "actual named molecule/mineral phase and CAS if known; medium and location; gross intake/outlet; raw concentration; measured actual flow rate or integrated volume; temperature pressure wet/dry basis; independent density; species mass; detection uncertainty; captured/uncaptured fate; natural uptake/desorption; actual_originating_process_id; actual_row_id; event_id; real_direction; physical_gate; original_cohort_Q_c; observed_H_not_divisor; whole_supply_constituent_owner"
      collection_method: "Use actual measured flow/concentration and phase/species analysis with matched temporal/state basis; integrate real rates only. Preserve air whole-mixture versus component choice without overlap; no total SiO2/PM/VOC/COD/NOx to invented species conversion, no water density for solvent/gas and no single residual fitted to two unknowns. Local free atmospheric Resource ingress is distinct from gas/water already contained in whole rough, an adhesive/alcohol preparation, an asset or a separately purchased gas Product. Contained constituents remain nonadditive subaccounts with that single upstream owner. Actual separately purchased compressed air or gas requires its own atomic Product card and measured state/pressure/native-property interface; internal air handoffs cancel while real compression/ventilation loads and releases remain. Actual molecular gross transfer differs from net environmental change; no standard air fraction or assumed complete combustion. The exact shared-protocol consumer set is p_make and p_service. Scalar process_id=p_make is a template grouping locator only, not event provenance or exclusive applicability. Each event preserves its actual process,row,direction,gate,original cohort Q_c and H; the locator never moves manufacture/service events. String/Schema validity does not establish methodological applicability."
      unit: "kg; actual raw m3; kg per actual time"
      frequency: "actual matched sampling and operating interval"
      temporal_coverage: "all actual manufacture/service and natural humidity periods"
      site_scope: "Actual declared site/provider/original cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "analytical method; phase confirmation; raw calibration state and detection limit"
    - protocol_id: cp_fg
      process_id: "p_service"
      flow_role: "internal transfer returns and gross dispatch"
      record_type: "cohort custody and vector ledger"
      raw_fields: "original cohort c and Q_c; first-release IDs; opening/closing full FG net stone and separate moisture; matched internal Q; each gross dispatch G; actual return R; original delivery ID and vector reverse D_rev; newly added/lost water and material; rework permission/tests/acceptance or hold/waste; horizon H; F_in; F_out; proved_same_side_OTHER_duplicate_X; paired_event_id; actual_originating_process_id; actual_row_id; real_direction; physical_gate; original_cohort_Q_c; observed_H_not_divisor"
      collection_method: "Weigh/trace every physical custody leg and actual new service increment independently. Internal Q pair cancels; include whole opening/closing FG and inherited historical vectors. Customer-return vector reversal uses original delivery records, not assumed current returned mass; do not turn delivery/reinspection into first production or switch to a net-delivery denominator. Original Q_c is fixed at unique first release; H is observed coverage, never another divisor. Use one complete wet custody gate OR disjoint net-stone and moisture/component gates, never both additively. In a whole gate O_FG+T_new+R_ext+F_in-X_in=C_FG+G_ext+W_actual+F_out-X_out. T_new is the actual paired internal physical handoff; its accepted net-stone component is already Q_c, while separately measured accompanying water never enlarges Q. Pair and cancel every internal component transfer at consolidation. F are real measured matter/water changes; X only proved duplicate same-side OTHER flows. Keep all actual unauthorized/failed/held work and actual changed returns without assumed restoration or a second release."
      unit: "kg; Item(s)"
      frequency: "every movement and state change"
      temporal_coverage: "original first-release cohort over declared H including still-held FG"
      site_scope: "Actual declared site/provider/original cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "custody links; original delivery vectors; physical stock reconciliation and tests"
    - protocol_id: cp_pack
      process_id: "p_service"
      flow_role: "each packaging six legs and mixed W pools"
      record_type: "raw packaging event and stock ledger"
      raw_fields: "each carton/pouch/tissue physical SKU and whole/constituent scope; full wet empty/attached WIP/FG/reusable opening K_open and closing K_close; disjoint P/I/ER/GrossS/EO/W; supplier-included burden owner; actual source/component W in mixed outlet; same-side duplicate terms X_in/X_out; natural moisture and actual repair water/material; raw gross V for each event; F_in; F_out; proved_same_side_OTHER_duplicate_X; paired_event_id; actual_originating_process_id; actual_row_id; real_direction; physical_gate; original_cohort_Q_c; observed_H_not_divisor ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID"
      collection_method: "Collect every actual six-direction event and complete wet stock independently; only duplicate other incoming/outgoing terms are removed by same-side X. New material/water remains a real influx even if fully retained in closing stock. P/I whole wet article and its components are disjoint; reuse cancels. If one mixed Waste exit exists, one card carries it; independent W source pools reconcile each packaging balance without total-plus-parts addition. For each actual packaging SKU/state pool close K_open+P+I+ER+F_in-X_in=K_close+gross_S+EO+W+F_out-X_out. F are independently measured real material/water additions/removals, including natural humidity, never residual corrections. X subtracts only a proved duplicate SAME-side OTHER actual-flow term linked by paired event IDs; never stocks, opposite-side flows, card presence or genuine newly retained influx. Keep full wet empty/attached-WIP/attached-FG/reusable stocks and actual new water/material simultaneously. Use the whole wet supplied article OR disjoint constituents linked by a measured component-to-assembly bridge; paired internal handoffs cancel. Natural humidity needs no invented repair or permission. One actual mixed outlet uses its whole total OR independently measured origin-W partitions, not total plus children or duplicate providers. Actual separate outlets require actual separate evidence; unknown/damaged Product/Waste status remains in the full gross ledger with compatible identity pending, never forced reusable Product.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
      unit: "kg and measured water/constituent subaccounts"
      frequency: "each physical event plus opening and closing"
      temporal_coverage: "all packaging attached or empty across manufacture and service H"
      site_scope: "Actual declared site/provider/original cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; supplier-included ownership; every leg receipt; mixed outlet disjoint pools"
    - protocol_id: cp_service
      process_id: "p_service"
      flow_role: "actual incremental service burdens"
      record_type: "raw service and material ledger"
      raw_fields: "original c/Q_c; observed horizon H; raw meter records; actual work and unauthorized/failed work; actual material/water influx/outflux and full wet stocks; permission/tests/disposition; used/assigned versus unused/unassigned charge; original vector and genuine external handover; F_in; F_out; proved_same_side_OTHER_duplicate_X; paired_event_id; actual_originating_process_id; actual_row_id; real_direction; physical_gate; original_cohort_Q_c; observed_H_not_divisor"
      collection_method: "Collect un-divided true storage/packing/handling/dispatch/postwork increments, including failures, original cohort and actual horizon. Once stock-corrected consumption or performed service has been measured, do not subtract closing FG or closing stores a second time. Only unused/unassigned service/charge can carry; permissions govern acceptance, not existence of performed work. Original Q_c is fixed at unique first release; H is observed coverage, never another divisor. Use one complete wet custody gate OR disjoint net-stone and moisture/component gates, never both additively. In a whole gate O_FG+T_new+R_ext+F_in-X_in=C_FG+G_ext+W_actual+F_out-X_out. T_new is the actual paired internal physical handoff; its accepted net-stone component is already Q_c, while separately measured accompanying water never enlarges Q. Pair and cancel every internal component transfer at consolidation. F are real measured matter/water changes; X only proved duplicate same-side OTHER flows. Keep all actual unauthorized/failed/held work and actual changed returns without assumed restoration or a second release."
      unit: "row-native kg; MJ; m3; actual charge unit"
      frequency: "each real interval/event"
      temporal_coverage: "complete observed H with truncation and unobserved future disclosed"
      site_scope: "Actual declared site/provider/original cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "raw meters; work orders; allocation evidence; cohort links; actual stocks"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each un-divided raw reading to its row-native extensive unit before attribution. For actual cumulative volume use the measured volume once; for actual rates integrate only over the measured interval with matched concentration/state. Metric carat reporting is 0.0002 kg per metric carat; the mass unit group labels that unit kt as metric carat, not kilotonne; g is 0.001 kg. Electricity kWh is 3.6 MJ. Any volume/mass bridge uses independently measured substance-specific state/density, not secondary property coefficients."
      inputs:
        - raw_reading
        - raw_unit
        - raw_state
        - independent_density
        - cp_make
        - cp_species
        - cp_release
      output: "native_raw"
      source_ids:
        - ultratec-v5-2015
    - id: cohort_quantity
      applies_to: "finished_gem"
      rule: "Q_c = sum of newly first-accepted net whole-gem kg in original cohort c, including closing released FG once. Retain raw net mass and independent stone count and measured configuration-specific M bridge; do not infer one stone kg, density, yield or carat weight from geometry, literature example or secondary property. A zero Q_c preserves all actual burdens/physical records and produces no per-unit result."
      inputs:
        - cp_release
        - first_release_ids
        - net_mass
        - independent_count
      output: "Q_c"
      source_ids:
        - gia-fourpeaks-2004
    - id: manufacturing_vector
      applies_to: "p_make"
      rule: "A_make_c = B_open_c + U_make_c - B_close_c - T_legitimate_c. Every symbol is a complete per-exchange inherited burden vector in matching units. B_open/B_close cover raw inputs, WIP and unused/unassigned non-WIP stores/service charge only; closing released FG is excluded from B_close because already included in Q_c. Actual consumed input stock correction happens once. U includes actual failures, startup/shutdown, idle, cleanup, tests, tools/assets service and ordinary waste treatment; ordinary waste/sales do not establish T_legitimate. Preserve unscaled gross physical balances separately."
      inputs:
        - B_open_c
        - U_make_c
        - B_close_c
        - T_legitimate_c
        - cp_make
        - cp_assets
      output: "A_make_c"
      source_ids:
        - ilcd-attributional-2010
    - id: service_vector
      applies_to: "p_service"
      rule: "A_service_c_H = U_performed_c_H + B_unassigned_open_c_H - B_unassigned_close_c_H - T_legitimate_c_H. Include actual already-performed original-cohort services even when FG remains in storage; only unused/unassigned service/charge carries. Stock-corrected material consumption is not corrected twice. Original historical manufacturing/FG vectors are retained and not charged again as service. Customer-return D_rev refers to the original delivery vector; actual new postwork and changed water/material are measured increments, not a new Q or an assumed original-mass reversal."
      inputs:
        - U_performed_c_H
        - B_unassigned_open_c_H
        - B_unassigned_close_c_H
        - T_legitimate_c_H
        - D_rev
        - cp_fg
        - cp_service
      output: "A_service_c_H"
      source_ids:
        - ilcd-attributional-2010
    - id: physical_gross
      applies_to: "all gross-disclosure cards"
      rule: "N_gross_j_c_H = V_j_c_H, the complete actual gross physical direction/event in its own row-native unit. No stock correction, manufacturing/service vector, economic/causal burden fraction or new provider/credit is applied to V. For packaging use each actual P/I/ER/gross S/EO/W separately; for a genuinely mixed outlet use its whole V once and only disjoint source-component W subaccounts. Internal Q pair cancels on consolidation and never becomes external procurement. This actual Waste or elementary-release quantity is the full gross V in its own native unit and actual direction/gate. Its single section8 quotient uses V/Q_c, never stock-corrected consumption, an allocated burden share or an additional provider purchase/credit. Preserve all actual failed/unauthorized events and measured whole/component ownership."
      inputs:
        - V_j_c_H
        - cp_pack
        - cp_assets
        - cp_fg
        - cp_species
      output: "N_gross"
      source_ids:
        - ilcd-attributional-2010
    - id: packaging_balance
      applies_to: "cp_pack"
      rule: "For each actual packaging SKU/state pool close K_open+P+I+ER+F_in-X_in=K_close+gross_S+EO+W+F_out-X_out. F are independently measured real material/water additions/removals, including natural humidity, never residual corrections. X subtracts only a proved duplicate SAME-side OTHER actual-flow term linked by paired event IDs; never stocks, opposite-side flows, card presence or genuine newly retained influx. Keep full wet empty/attached-WIP/attached-FG/reusable stocks and actual new water/material simultaneously. Use the whole wet supplied article OR disjoint constituents linked by a measured component-to-assembly bridge; paired internal handoffs cancel. Natural humidity needs no invented repair or permission. One actual mixed outlet uses its whole total OR independently measured origin-W partitions, not total plus children or duplicate providers. Actual separate outlets require actual separate evidence; unknown/damaged Product/Waste status remains in the full gross ledger with compatible identity pending, never forced reusable Product."
      inputs:
        - cp_pack
        - K_open
        - P
        - I
        - ER
        - gross_S
        - EO
        - W
        - K_close
        - F_in
        - F_out
        - X_in
        - X_out
        - paired_event_ids
      output: "packaging_reconciliation"
      source_ids:
        - ilcd-attributional-2010
    - id: physical_balance
      applies_to: "all physical gates"
      rule: "Manufacturing whole mass and relevant elements reconcile independent actual whole rough/material/water/gas/asset influx, opening/closing raw/WIP and actual Q/other physical exits. Service whole FG reconciles opening_FG + internal_Q + actual_R + real_added_material_water = closing_FG + gross_G + actual_waste_loss + real_removed_material_water. Consolidation cancels internal_Q and every internal water/material transfer with its matching vector, not a second purchase or second Q. Gross mass is never multiplied by burden shares. Confirm each water phase/species independently; reaction water requires actual chemical evidence and is distinct from humidity/free/inclusion water. Original Q_c is fixed at unique first release; H is observed coverage, never another divisor. Use one complete wet custody gate OR disjoint net-stone and moisture/component gates, never both additively. In a whole gate O_FG+T_new+R_ext+F_in-X_in=C_FG+G_ext+W_actual+F_out-X_out. T_new is the actual paired internal physical handoff; its accepted net-stone component is already Q_c, while separately measured accompanying water never enlarges Q. Pair and cancel every internal component transfer at consolidation. F are real measured matter/water changes; X only proved duplicate same-side OTHER flows. Keep all actual unauthorized/failed/held work and actual changed returns without assumed restoration or a second release. Reconcile each whole-article count gate separately as O_n+R_in_n=C_n+R_out_n. Reconcile its independently measured mass/component gate as O_m+R_in_m+F_in_m-X_in_m=C_m+R_out_m+F_out_m-X_out_m. Do not add kg of water or parts to Item(s), infer machine mass from count, or add whole and component views. F is real added/removed material/water; X only proved same-side OTHER duplicate flows, never stocks or opposite legs. Whole supplied installed fluids/parts belong once; actual separate supplies require disjoint receipts or an independently measured assembly bridge with cancelling internal transfers. One actual whole mixed retirement outlet OR independently measured origin partitions has one provider. Keep full physical stocks separately from fulfilled service and unused/unassigned charge."
      inputs:
        - cp_make
        - cp_fg
        - cp_species
        - cp_assets
      output: "physical_reconciliation"
      source_ids:
        - ilcd-attributional-2010
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "For each original cohort and coordinate choose exactly one appropriate un-divided numerator: actual target-cohort physical consumption N_physical for ordinary consumed-material/energy rows; full actual V for gross-disclosure cards; or A_make/A_service for the separate environmental-burden coordinate. Execute result_j_c_H = numerator_j_c_H / Q_c exactly once. Card amounts and protocol aggregation are views of that same result, never another quotient; reference output is 1 kg. Physical amounts and burden vectors are different coordinates and are never added or used in place of each other. Q_c=0 retains raw load and has no unit result; distinct cohorts with their own Q/H are not silently mixed. H describes the observation horizon only and is never an additional normalization divisor."
      inputs:
        - N_physical
        - V_j_c_H
        - A_make_c
        - A_service_c_H
        - Q_c
        - cp_release
      output: "result_j_c_H"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_natural
      applies_to: "rough_feed; finished_gem"
      requirement: "Evidence for natural species/origin/actual treatment, whole terminal and complete real manufacture; name/CPC/SKU similarity cannot replace identity, while a physically compatible broad family is not rejected merely for breadth."
      evidence: "Supplier/gemological and actual operation/test records; complete applicable primary context"
    - id: dq_inventory
      applies_to: "all inventory rows"
      requirement: "Ten card fields, complete description/native restrictions, every table cell, qualifiers/Inputs/Output/source_ids/DQ align bilingually and project completely; each row has real substance/direction and no cloned incompatible identity."
      evidence: "Row-by-row raw→typed and semantic negative audit; exact native property/unit evidence"
    - id: dq_ledgers
      applies_to: "cp_make; cp_pack; cp_assets; cp_fg"
      requirement: "Complete failures/zero output/unauthorized work/opening-closing and inherited vectors; full gross V, traceable W pools and no whole-mixture-plus-constituent addition."
      evidence: "Calibrated measurements, directional receipts, independent same-side X and wet stock reconciliation, complete original cohort/H"
    - id: dq_unmeasured
      applies_to: "concrete foreground dataset"
      requirement: "Disclose unmeasured future-site quantities, actual provider compatibility/ordinary auxiliary UUIDs and unreviewed status; do not invent factors, output, certification, life or fixed process parameters."
      evidence: "Gap/uncertainty and actual collection plan; technical pass is not scientific approval"
validation_rules:
  - rule_id: v_core
    applies_to: "finished_gem"
    rule: "Confirm whole natural amethyst, actual finished polished faceted geometry, unmounted/unstrung/undrilled-for-stringing state, source and actual treatment status; mere rough or chemical silica cannot be the core product. Use a compatible complete Product identity with actual reference property and exact native restrictions. A truly unresolved core identity or unproved whole-product manufacture is an unusable draft hold, not coverage."
    source_ids:
      - ultratec-v5-2015
      - gia-fourpeaks-2004
  - rule_id: v_basis
    applies_to: "all rows"
    rule: "Both languages must use the same first-release Q_c and original-cohort H, one normalized result per row. All ten card fields, qualifiers, descriptions, collection raw fields/units/aggregation and calculation Inputs/Output/source_ids must remain fully consumable. Match reference row/UUID and reject absent inputs, unknown-to-zero substitutions, duplicated whole preparation/constituents and second quotient."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_balance
    applies_to: "physical and vector ledgers"
    rule: "Independently close whole physical mass, relevant elements, water phases, real species, raw/WIP/FG inherited vectors, each six-leg packaging pool and assets/fluid stocks within measured uncertainty. Keep same-side X deduplication separate from full closing wet stocks and genuine incoming/outgoing events. Audit actual outlets and mixture/constituent disjointness; unexplained residuals are gaps rather than invented species/density or two fitted unknowns."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_gap
    applies_to: "dataset completion"
    rule: "No default stone size/angles/facets, per-stone mass, yield, hardness/density, recipe, thermal conditions, energy/emission factors, certification or equipment lifetime. Future plant quantities, ordinary auxiliary/provider UUIDs and pending scientific/translation review remain explicit; technical checks neither approve methodology nor accept a mapping or publish a release."
    source_ids:
      - ultratec-v5-2015
      - gia-fourpeaks-2004
      - ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "Attributional original first-release cohort manufacturing inventory and separate actual service coordinates"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual natural unenhanced amethyst unmounted faceted loose gems with terminal/route/native restrictions and Q_c/H preserved"
  excluded_use: "Finished-jewellery/use-life comparison, whole CPC coverage, enhancement/synthetic/other species, automatic waste credit, unobserved future service or certified-factor claims"
  required_metadata: "natural quartz/amethyst origin and identification evidence; actual purple color zoning and inclusions; untreated versus every real prior treatment; whole unmounted faceted polished terminal without stringing holes; actual cut geometry and grading/acceptance tests; net mass and separately measured count/configuration; supplier rough state and completed upstream operations; site and year; actual dopping removal branch and stone protection; whole adhesive/alcohol/coated-disc composition and supplier limits; actual voltage/grid and water interface; first-release cohort Q and original-cohort service horizon H; opening/closing raw/WIP inherited vectors and complete FG ledger; each packaging six gross legs and wet stocks; real moisture/solid/gas species and destinations; asset/service boundary and actual lifetime evidence; failed/unauthorized/rework/zero-output loads; subdivision/causality/residual-gate evidence and uncertainty"
  required_quality_disclosure: "Measured site/year/method/uncertainty, original cohort/H, physical/burden dual ledgers and gaps; scientific and translation review remain separate"
  update_trigger: "Real species/treatment/terminal/supplied-state/process branch, native identity/reference unit, provider boundary or methodology evidence change"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 structure, 30 June 2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Original 38220 boundary and adjacent unworked/jewellery countercontext; not a manufacturing recipe or accepted mapping"
  - id: "gia-fourpeaks-2004"
    type: "literature"
    reference: "Lowell J.; Koivula J.I. Amethyst from Four Peaks, Arizona. Gems & Gemology 40(3), 230–238 (2004). DOI:10.5741/GEMS.40.3.230; https://www.gia.edu/doc/Amethyst-from-Four-Peaks-Arizona.pdf"
    used_for: "Whole natural-amethyst rough-to-faceted terminal, color/trim/grading and adjacent heat/fracture countercontext; no contemporary same-plant recipe/fixed yield"
  - id: "ultratec-v5-2015"
    type: "handbook"
    reference: "ULTRA TEC V5 Classic Faceting Machine Users Manual, 1607.5CDR Rev2-2015, §§2.1,5,6 and Appendix1; https://www.ultratec-facet.com/wp-content/uploads/2021/02/V5manual.pdf"
    used_for: "Quartz-compatible dopping, grinding/prepolish, transfer/removal/local lamp heat, wet cloth, cleaning, tools/water/electricity; example design/parameters and alternatives are not defaults"
  - id: "ultratec-ceralap"
    type: "handbook"
    reference: "ULTRA TEC Ultra Laps; https://www.ultratec-facet.com/product/ultra-laps/"
    used_for: "Whole cerium-coated Mylar article for quartz polishing, water-wet support and one coating/substrate purchase; adjacent oxide alternatives/rounding limits"
  - id: "gia-amethyst"
    type: "handbook"
    reference: "GIA Gem Encyclopedia, Amethyst; https://www.gia.edu/amethyst"
    used_for: "Natural purple quartz and finished cut/synthetic/treatment product context; no plant-quantity defaults"
  - id: "gia-amethyst-care"
    type: "handbook"
    reference: "GIA Amethyst Care and Cleaning Guide; https://www.gia.edu/amethyst-care-cleaning"
    used_for: "Actual cleaning/handling and thermal-shock/light/chemical/treatment limitations; no fixed process temperature/recipe"
  - id: "ilcd-attributional-2010"
