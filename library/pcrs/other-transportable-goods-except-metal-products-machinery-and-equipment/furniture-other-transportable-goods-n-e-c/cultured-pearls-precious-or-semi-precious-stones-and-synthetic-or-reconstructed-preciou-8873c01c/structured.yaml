allocation_rules:
  - rule_id: a_subdivide
    applies_to: "all burden coordinates"
    rule: "Declare an attributional product-manufacturing goal and determine whether multifunctionality actually requires allocation rather than substitution. Directly attribute dedicated lots/operations first; apply real or justified virtual subdivision of cutting, polishing, treatment and services. Industrial manufacturing evidence is not an LCA allocation authority. Retain the complete unallocated vector and every function."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causal
    applies_to: "each genuinely inseparable exchange"
    rule: "For each remaining shared nonfunctional exchange identify and quantify its determining physical causal relation to each function at the real process state; prove the driver rather than choosing mass/count/time/energy arbitrarily. Different coordinates may have different causal drivers. Gross physical legs retain full real mass/energy/species and are never multiplied by burden shares."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "residual shared burden only"
    rule: "Only documented residual exchanges after subdivision and exchange-specific causality may use contemporaneous real market values of the cofunctions in their actual condition at the common process exit or relevant treatment input gate. Preserve quantities, gate-price adjustments, currency/period, all functions and sensitivity; no retail finished-jewellery value, fixed fraction, arbitrary physical/economic switch or automatic avoided-product credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_ordinary_waste
    applies_to: "failures and offcuts and samples and services"
    rule: "Ordinary manufacturing waste, failures, samples, broken gems and their treatment stay with original manufacturing/service even when externally removed or sold. T_legitimate is allowed only for a real distinct other function/cohort with justified allocation/handover and receipt, applied once to its vector. Keep all physical gross legs unscaled. Internal stone/water/tool/packaging reuse cancels matching transfers without new purchase, Q or credit."
    source_ids:
      - ilcd-attributional-2010
