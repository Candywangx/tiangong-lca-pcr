      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_core | finished_gem | Confirm whole natural amethyst, actual finished polished faceted geometry, unmounted/unstrung/undrilled-for-stringing state, source and actual treatment status; mere rough or chemical silica cannot be the core product. Use a compatible complete Product identity with actual reference property and exact native restrictions. A truly unresolved core identity or unproved whole-product manufacture is an unusable draft hold, not coverage. | ultratec-v5-2015; gia-fourpeaks-2004 |\n| v_basis | all rows | Both languages must use the same first-release Q_c and original-cohort H, one normalized result per row. All ten card fields, qualifiers, descriptions, collection raw fields/units/aggregation and calculation Inputs/Output/source_ids must remain fully consumable. Match reference row/UUID and reject absent inputs, unknown-to-zero substitutions, duplicated whole preparation/constituents and second quotient. | ilcd-attributional-2010 |\n| v_balance | physical and vector ledgers | Independently close whole physical mass, relevant elements, water phases, real species, raw/WIP/FG inherited vectors, each six-leg packaging pool and assets/fluid stocks within measured uncertainty. Keep same-side X deduplication separate from full closing wet stocks and genuine incoming/outgoing events. Audit actual outlets and mixture/constituent disjointness; unexplained residuals are gaps rather than invented species/density or two fitted unknowns. | ilcd-attributional-2010 |\n| v_gap | dataset completion | No default stone size/angles/facets, per-stone mass, yield, hardness/density, recipe, thermal conditions, energy/emission factors, certification or equipment lifetime. Future plant quantities, ordinary auxiliary/provider UUIDs and pending scientific/translation review remain explicit; technical checks neither approve methodology nor accept a mapping or publish a release. | ultratec-v5-2015; gia-fourpeaks-2004; ilcd-attributional-2010 |\n\n"
