      collection_method: "Environmental measurement owner records actual unnormalised species and receptor/state evidence; independently verify H2O, dry gases and particles. Integrate only real rates, never multiply an integrated volume by time. Do not infer a molecule from VOC/COD/total-N/carbon/particle-size totals; keep detection limits and unavailable species unresolved. Natural absorption and evaporation are actual physical events without fictitious repair permission."
      unit: "m3; kg"
      frequency: "Each event and opening/closing endpoints"
      temporal_coverage: "Complete actual cohort and associated observed service H including failures Q0 startup idle cleanup rework"
      site_scope: "Actual plant/configuration and original cohort with full cross-period inherited vectors"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; state/composition; tests/disposition; upstream ownership; uncertainty"
    - protocol_id: cp_species_pack
      process_id: "pack"
      flow_role: "h2o_in_pack; h2o_out_pack"
      record_type: "raw_event_and_stock_record"
      raw_fields: "event_id; timestamp; actual operator and accountable owner; site; configuration; original cohort; operation; row_id; direction; material or species and actual state; raw amount and unit; instrument calibration; uncertainty; external or paired internal event; provider and upstream owner; opening and closing physical wet stocks; per-exchange inherited burden vectors; actual losses and destination; failure and hold disposition"
      collection_method: "Assigned site materials/production accountant retains undivided calibrated receipt/issue/return and full-period observations. Preserve whole supplied formulations/articles once; assay and water are non-additive subledgers. No normalisation in collection."
      unit: "m3; kg"
      frequency: "Each event and opening/closing endpoints"
      temporal_coverage: "Complete actual cohort and associated observed service H including failures Q0 startup idle cleanup rework"
      site_scope: "Actual plant/configuration and original cohort with full cross-period inherited vectors"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; state/composition; tests/disposition; upstream ownership; uncertainty"
  calculation_rules:
    - id: calc_raw
      applies_to: "all raw observations"
      rule: "Convert original units/rates to each actual native extensive numerator; integrate only rates. E_MJ=3.6*E_kWh once. Density/composition require independent actual substance/state evidence. No Q division here."
      inputs:
        - raw_observation
        - raw_unit
        - rate_or_total
        - interval
        - actual_state
        - density
        - composition
      output: "U_native"
      source_ids:
        - ilcd-allocation
    - id: calc_manufacture
      applies_to: "manufacturing burden dimensions"
      rule: "A_c=B_open+U_native-B_close-T_other after dedicated/subdivided/exchange-specific determining physical causality and only true residual gate-value allocation. B_close excludes already released FG and performed cohort service. T_other requires true independent function/cohort with justified transfer once; ordinary failures/waste/sales remain. Stock-corrected U has no second stock deduction. This is not gross V."
      inputs:
        - B_open
        - U_native
        - B_close
        - T_other
        - attribution_evidence
      output: "A_c"
      source_ids:
        - ilcd-allocation
    - id: calc_service
      applies_to: "original-cohort service burden dimensions"
      rule: "A_H=C_open+U_H-C_unused_close-T_other_H after actual attribution. Keep Q_H and observed H; historical manufacture is not U_H purchase. Performed service stays despite closingFG. Only unused/unassigned service carries; retain failures, work without permission and true incremental materials/water/energy/waste."
      inputs:
        - C_open
        - U_H
        - C_unused_close
        - T_other_H
        - original_cohort
        - Q_H
        - H
      output: "A_H"
      source_ids:
        - ilcd-allocation
    - id: calc_physical
      applies_to: "all physical gross card dimensions"
      rule: "V_i=complete actual measured gross leg in its direction and native extensive unit. Do not apply B_open+U-B_close or economic/service share to a physical card. Correct X only against OTHER overlapping same-side flow terms; retain new material/water influx and full wet closing stock. Cancel exact paired internal legs at consolidation. Physical disclosure creates no second purchase/provider burden or credit; associated burden is owned separately once in A_c or A_H."
      inputs:
        - gross_event
        - direction
        - native_unit
        - OTHER_same_side_overlap
        - internal_pair
      output: "V_i"
      source_ids:
        - ilcd-allocation
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "q=N/D. Execute this sole quotient once for each tagged dimension: physical cards N=complete gross V_i; separate burden results N=A_c or A_H. D=Q for first-release manufacture; D=original first-release Q_H for actual H services and their physical legs. Q and Q_H are independently measured whole-board net kg, including released closingFG. Reference output is 1 kg. If D=0 retain real raw activity and loads with no unit result. Cards and aggregation only reference this same result; no second division."
      inputs:
        - N
        - D
        - V_i
        - A_c
        - A_H
        - Q
        - Q_H
        - H
      output: "q"
      source_ids:
        - ilcd-allocation
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all cards"
      requirement: "Retain whole-product/part/material/species state and every native CAS/form/grade/route/geography/phase/type/media restriction, exact support-chain evidence and original supplier scope; official zh basename where provided. Supplier compatibility/assays are not established by a UUID."
      evidence: "full native records; actual supplier specifications; whole BOM"
    - id: dq_raw
      applies_to: "all protocols"
      requirement: "Keep complete calibrated raw period records and uncertainty/detection limits. No fabricated proportions, weights, dimensions, density, layer counts, cure times/temperatures, yields, absorption, performance, certification or service lifetime."
      evidence: "calibration; laboratory and acceptance records; raw event audit"
    - id: dq_vectors
      applies_to: "manufacture; service; assets"
      requirement: "Per-exchange inherited burden vectors and complete wet physical stocks are independent ledgers. Preserve failed/Q0/idle/startstop/cleanup/rework periods, releasedFG, actual original-cohort H, all gross legs, provider/capital ownership and actual incremental water."
      evidence: "stock and event ledgers; provider matrix; cohort reconciliation"
    - id: dq_sources
      applies_to: "all source claims"
      requirement: "Sources are a transparent qualitative technical synthesis across distinct manufacturers; no common SKU/order/factory. Full originals, extraction scope, independent context and counterexamples must support the actual rule. Industrial documents do not establish LCA allocation, and a materials read success/fragment status is not automatic applicability or numeric reuse."
      evidence: "source originals and source-specific applicability decisions"
    - id: dq_review
      applies_to: "whole candidate"
      requirement: "Scientific review is pending and Chinese is aligned, not reviewed. Distinguish ordinary auxiliary/provider/future factory collection gaps from genuine core terminal/identity/method holds; report any true hold honestly and do not count draft/unmapped/unusable content as coverage."
      evidence: "manifest; independent review; explicit gap evidence"
validation_rules:
  - rule_id: validation_core
    applies_to: "reference; out_board"
    rule: "Confirm a real complete finished rigid EPS/glass/epoxy board with supplied BOM and installed boxes/vent kit against primary evidence and full native Product identity. Hard CAS/form/route/grade/phase/type/media conflict blocks that binding. A genuinely unresolved whole reference identity leaves draft/unmapped/unusable; ordinary auxiliary/provider/quantity gaps do not alone create that core hold."
    source_ids:
      - nsp-dealer
      - greenlight-glass
      - greenlight-vent
      - roberts-ret
  - rule_id: validation_basis
    applies_to: "all inventory rows"
    rule: "Verify one Product output link and one first-release mass denominator in both languages; released closing FG is in Q once. No delivered mass, bounding-box area, assumed count-to-kg mass or secondary-property density substitution. Every card/protocol references the same sole quotient and no collection/aggregation performs another division. Q0 retains loads without a unit result."
    source_ids:
      - ilcd-allocation
  - rule_id: validation_atomic
    applies_to: "all cards"
    rule: "Check each atomic selected identity, actual event/direction, complete description, all native constraints, official Chinese basename when supplied, reference property/group/unit and each source/qualifier. Unknown remains specific and tracked, never replaced by an ensemble name. UUID identity is not evidence of a site quantity or provider fit."
    source_ids:
      - ilcd-allocation
      - greenlight-glass
  - rule_id: validation_gates
    applies_to: "manufacture; FG; combined gate"
    rule: "Reconcile full wet mass and independent relevant elements/species, raw/WIP/FG inventories and inherited vectors, packaging six legs, real asset/new-old part/fluid legs and actual water/gas/thermal states. Gross V is never burden-stock-corrected or economically scaled. X only deduplicates OTHER same-side terms; retain new influx plus full closing wet stock. Mixed outlet totals and source W are non-additive; treatment/provider once."
    source_ids:
      - ilcd-allocation
  - rule_id: validation_work
    applies_to: "all actual work"
    rule: "For actual postrelease rework retain manufacturer/spec permission, work record, postwork tests and acceptance/disposition. Failed/rejected/unauthorised actual work is fully recorded and held/disposed appropriately; no assumed restoration of broken composite. Natural storage moisture exchange requires no invented repair permission. Performed service keeps original Q_H/H."
    source_ids:
      - gong-rigid
      - greenlight-sand
      - ilcd-allocation
  - rule_id: validation_evidence
    applies_to: "concrete dataset"
    rule: "Require actual primary supplier/site measurement and uncertainty evidence for amounts, settings, formulation, acceptance and upstream coverage before claiming completeness. No brochure recipe/lifetime/performance/certification/yield or emission default. Structural/finite checks establish neither scientific review nor translation review, accepted classification mapping or publication."
    source_ids:
      - greenlight-guide
      - nsp-dealer
      - ilcd-allocation
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified complete board manufacture for declared mass/configuration and boundaries; actual original-cohort gate services separately tagged"
  allowed_use: "Only matched technology/state/BOM and verified current evidence with collection completeness and disclosed review status; preserve all native restrictions and full rule context"
  excluded_use: "Universal CPC38420 coverage; ski/sail/paddle/inflatable/toy/vessel/foam-only comparisons; marine use or service-life/performance claims; provider/identity mismatch; hidden core hold or invented zero"
  required_metadata: "All required qualifiers; whole supplier BOM/formulations; first-release Q; original Q_H/H; actual raw and wet-stock/vector records; provider and capital boundaries; uncertainty and all actual atoms"
  required_quality_disclosure: "Scientific pending; Chinese aligned not reviewed; quantitative factory data to be collected; auxiliary/provider gaps explicit; structural check is not mapping/publication or science approval"
  update_trigger: "Actual terminal/BOM/foam/glass/formulation/finish/route change; new native restrictions or provider scope; new measured evidence; changed Q/service boundary; independent review findings"
