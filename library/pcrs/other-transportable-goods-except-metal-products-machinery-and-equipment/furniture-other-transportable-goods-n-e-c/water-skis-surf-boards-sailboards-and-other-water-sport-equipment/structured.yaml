system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "shape; laminate; finish"
      rule: "Start with formed wood-stringered EPS blank and actual dry reinforcement, whole resin-side and hardener-side preparations and genuine bought inserts. Include only actual remaining blank shaping, box/plug installation, lamination/cure, lap trimming, epoxy sealcoat, actual sanding/resealing and complete-board inspection. Supplied blanks include upstream foam/stringer production once; do not replace this manufacturing boundary with bought finished-board packing."
      source_ids:
        - greenlight-guide
        - greenlight-shape
        - greenlight-glass
        - greenlight-sand
        - roberts-ret
    - rule_id: boundary_terminal
      applies_to: "out_board"
      rule: "Require full actual installed fin-box and combined vent/leash kit state and whole supplied BOM at unique first release. This selected sales configuration has no detachable fins or separately sold leash; record that explicitly instead of adding imaginary parts. A different actually included part requires its own material/article card and a disjoint whole-board bridge, counted in the whole board once."
      source_ids:
        - nsp-dealer
        - nsp-volume
        - greenlight-vent
        - greenlight-glass
    - rule_id: boundary_failures
      applies_to: "all processes"
      rule: "Include every actual failed/zero-output batch, start/stop, idle, cleanup, trial within the real production cohort, scrap and real rework. A failed or unauthorised performed activity is not absent. Ordinary losses, external waste shipment/sale or rejected samples do not remove production/treatment burdens; only a true other cohort/function and justified allocation/handover transfers a burden vector once."
      source_ids:
        - ilcd-allocation
        - greenlight-glass
        - greenlight-sand
    - rule_id: boundary_q
      applies_to: "cp_release; all processes"
      rule: "Q is the measured sum of net whole-board kg at each serial first quality release. Released closing FG is already in Q; never add it as a second output or subtract its manufacture from the first-release cohort. Manufacturing B_close contains only raw/WIP and actually unassigned non-WIP supplies or services. Preserve per-exchange inherited vectors at opening/closing WIP. Q=0 retains all physical activity and burdens and produces no unit result."
      source_ids:
        - ilcd-allocation
        - greenlight-sand
    - rule_id: boundary_service
      applies_to: "service; pack; assets"
      rule: "Actual storage/packing/handling/shipment and postrelease work keep their original cohort Q_H and observed horizon H, irrespective of held FG. Only unused/unassigned charges carry forward; performed service is not deducted because a board remains in stock. Historical manufacture is not a new service purchase, reinspection/dispatch is not new Q, and true returns retain original serial, historical burden and actual incremental work/water/loss. A net-delivery denominator is outside this first-release profile and requires a complete historical G/R/D_rev bridge."
      source_ids:
        - ilcd-allocation
        - gong-rigid
        - greenlight-vent
    - rule_id: boundary_physical
      applies_to: "all inventory rows"
      rule: "All physical gross legs use complete actual V in the native extensive unit, independently of burden vectors, stock correction and economic shares. At manufacture, FG/service and combined physical gates reconcile full wet opening stocks plus true external inflows to wet closing stocks plus true external outflows; cancel only matched internal transfers. Whole wet articles and disjoint components require an explicit non-additive bridge. New material/water influx remains even if retained in closing stock; X removes only other overlapping same-side flow terms. Material/article receipt V is the complete gross leg of the specified net contents, with transport packaging separately measured in I; when only a whole wet shipped unit is weighed use a disjoint contents/packaging bridge rather than adding full unit plus I. A kit includes its actually supplied contents once; unused sticks/putty and packaging are not installed board mass."
      source_ids:
        - ilcd-allocation
    - rule_id: boundary_pack
      applies_to: "pack; waste"
      rule: "For each actual packaging pool collect distinct P/I/ER/S/EO/W cards: opening empty plus attached WIP/FG plus reusable stock + P + I + ER = closing complete wet stock + S + EO + W, after only true other same-side overlap. P/I whole wet article supply is once; I is retained as physical ingress with its one upstream owner. S is packaging on gross physical dispatch, never Q. W internal transfers pair to handling reception and cancel; the actual final mixed or separate external Waste and treatment are counted once. Internal reuse adds neither purchase nor co-product credit."
      source_ids:
        - ilcd-allocation
    - rule_id: boundary_assets
      applies_to: "assets"
      rule: "Physical machines/racks/parts and installed fluids retain complete actual opening/closing wet inventories, new/old receipts/returns/retirement, separate repair materials and water phases. Do not scale gross machine or removed-part mass by service/economic share or assume lifetime/replacement interval. Separately attribute actual current asset/service burden once, with explicit provider/capital boundary and unused-service carry."
      source_ids:
        - ilcd-allocation
        - greenlight-guide
    - rule_id: boundary_species
      applies_to: "all processes"
      rule: "Reconcile whole physical mass and relevant elements independently of true species/reaction/phase evidence. No one residual fits two unknowns. Supplier formulations are whole purchases with non-additive assay/water/active child ledgers; onsite mixing has each real bought component and real energy/loss. Do not infer specific molecules from VOC/COD/total carbon/nitrogen/dust or invent reaction water from epoxy cure. Ordinary natural humidity uptake/loss is included without fictitious work permission."
      source_ids:
        - greenlight-glass
        - greenlight-vent
        - ilcd-allocation
    - rule_id: boundary_heat
      applies_to: "all processes"
      rule: "Measure actual electricity, water and every real thermal/fuel carrier separately. Integrated gas/liquid volumes are not multiplied by time again; only true rates are integrated. Substance/state-specific density and actual thermal state/enthalpy are independent evidence. If real external hot water/steam/condensate or other Product return exists add separate carrier kg and heat MJ rows with one supplier water/energy convention; do not assume a boiler or purchase electric heat twice."
      source_ids:
        - ilcd-allocation
        - greenlight-guide
    - rule_id: boundary_new_atoms
      applies_to: "all processes"
      rule: "Before consuming a concrete dataset, add every actual unlisted material, preparation, included component, carrier, elementary species and real waste destination as one physically specific card. Conditional absence requires real absence evidence, never unknown=0. A true extra coating, foam route, carbon/sandwich layer or propulsion changes principal-route applicability and cannot be hidden in other inputs."
      source_ids:
        - greenlight-guide
        - gong-rigid
        - nsp-dealer
