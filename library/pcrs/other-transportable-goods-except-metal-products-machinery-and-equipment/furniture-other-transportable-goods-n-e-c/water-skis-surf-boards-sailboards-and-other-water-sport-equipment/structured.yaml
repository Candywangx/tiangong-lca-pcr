allocation_rules:
  - rule_id: allocation_first
    applies_to: "all burdens"
    rule: "This is attributional accounting only where allocation is appropriate under the declared study situation. First use independent meters, work orders and dedicated/physical or virtual subdivision by board/configuration/cohort. Assign actual embodied inputs to their receiving object and keep failed/startup/cleanup burdens. Do not replace a consequential question by silently imposing attributional allocation."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_causal
    applies_to: "each remaining exchange"
    rule: "For each still-shared nonfunctional exchange demonstrate the determining physical causal relationship to functions; different exchanges can require different causes. Mass, cure occupancy or operating time is not selected merely for availability. Keep measured gross physical V unchanged while attributing the actual burden dimension."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_residual
    applies_to: "true common-process residual"
    rule: "Only the genuinely inseparable remainder after the preceding steps uses actual co-function market value in its real condition and at the same common process gate and time. Subtract downstream transport/conditioning/packing value if starting from later price; keep quantity-price basis and sensitivity. No universal economic split, fixed share or arbitrary choice between physical and economic allocation."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_no_credit
    applies_to: "internal loops; losses; waste"
    rule: "Internal transfers, resin reuse, packaging reuse and same-cohort rework have no automatic co-product/substitution credit. Ordinary waste, rejected/sampled/damaged boards and their treatment remain attributable even if sent away or sold. A true independent other function/cohort requires an explicit justified allocation/handover vector once; no unsupported avoided-burden claim."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_stock
    applies_to: "manufacture; original-cohort services"
    rule: "Manufacture tracks each opening/closing raw/WIP and unassigned-store burden vector; already stock-corrected use has no second correction. Released closing FG already belongs to Q. Performed original-cohort storage/handling/packing/work stays in A_H despite closing FG; only genuinely unused/unassigned charges carry. Capital service is distinct from gross asset purchases and each provider is counted once."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_q0
    applies_to: "Q; Q_H"
    rule: "Q and Q_H are original unique first-release net whole-board kg. All allocation and native-unit conversions precede the one calc_quotient. When the relevant denominator is zero retain actual raw physical and burden accounts without a unit result; never redistribute an orphan period merely to make a quotient."
    source_ids:
      - ilcd-allocation
