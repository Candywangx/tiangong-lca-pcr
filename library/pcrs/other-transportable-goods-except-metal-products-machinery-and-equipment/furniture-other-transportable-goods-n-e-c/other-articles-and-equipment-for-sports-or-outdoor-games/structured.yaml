        - pintech-route
        - psdf-route
        - sublime-craft
    - rule_id: b_whole
      applies_to: "skin; bladder; supplied preparations"
      rule: "The actual whole laminate contains supplier coating/backing/cushion/adhesive and the whole bladder contains its valve and balance material. Upstream production is retained once in compatible supplied-state datasets. Record actual onsite component manufacture as disjoint individual purchased atoms, real energy/losses and paired internal handoff before claiming applicability; do not purchase whole and self-contained ingredients together. No inferred layer count or resin/bladder recipe."
      source_ids:
        - pintech-factory
        - derby-bladder
        - fusheng-sheet
    - rule_id: b_release
      applies_to: "finished"
      rule: "Q is the calibrated net whole mass of uniquely newly first-released complete balls in one declared cohort/configuration and release-state pressure/temperature/moisture window. Include retained inflation gas and all actual retained ingredients once; exclude detachable packaging. Released closing FG is already in Q and bears its manufacturing burden: neither subtract it nor add it as a second output. Opening released FG, dispatch, return, reinspection and repair create no new Q."
      source_ids:
        - pintech-route
        - select-qc
    - rule_id: b_vectors
      applies_to: "all burden-bearing dimensions"
      rule: "Preserve every exchange inherited vector in opening/closing raw stock, WIP and unassigned non-WIP stores. Manufacturing A equals attributable converted raw load plus inherited unassigned opening vector minus only still-unassigned closing vector, with a once-justified other-function/cohort handover if real. Already-net consumption gets no second stock correction. Ordinary rejects, samples, sold/exported waste and treatment remain assigned; sale alone is no Tother transfer. Q=0 retains full loads without a unit result."
      source_ids:
        - ilcd-2010
    - rule_id: b_service
      applies_to: "service; assets"
      rule: "Actual postrelease storage, handling, deflation/reinflation, packaging, testing and work retain original-cohort Qc and observed horizon H. Performed service remains even for closing FG; only unused/unassigned service or charge carries forward. Future unknown service stays unknown. On consolidation internal reference handoff cancels and there is one finished reference output."
      source_ids:
        - ilcd-2010
        - pintech-route
    - rule_id: b_permission
      applies_to: "postrelease work"
      rule: "A claim of continued conformance after actual work needs manufacturer/specification permission, real postwork tests, acceptance and disposition. Unauthorised, failed or rejected work still retains every real material, gas, energy and waste exchange with original cohort and hold/waste disposition; permission is never a data-deletion switch. Natural humidity uptake/loss needs no invented repair event or permission."
      source_ids:
        - pintech-route
        - ilcd-2010
    - rule_id: b_gas
      applies_to: "inflation; all actual gas species"
      rule: "Measure gross intake composition, pressure/temperature/humidity, retained gas in released/held/shipped/returned balls, compressor losses, leak-test vents and real releases species by species. Atmospheric resource O2/N2/Ar are not industrial gas purchases. Whole-air total is a nonadditive control sum only; add actual other species before quantification. Separate water vapour, free liquid and ingredient/bound water; no fictitious reaction water, fixed air fractions or generic VOC/NOx/COD molecules."
