        end:
          offset: 17097
          line: 122
          column: 1
      markdown: "## 5. System Boundary\n\n\n### Boundary Abstraction\n\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual whole supplied PU-faced textile laminate and complete natural-latex bladder/valve; no bought-finished-ball packaging shortcut |\n| starting_condition_role | foreground manufacturing start; supplied-state upstream burden once |\n| product_classification_scope | this narrower complete-ball route within CPC 3.0:38440 context |\n| recursive_input_rule | Compatible upstream whole laminate/bladder/preparation manufacture once; pair and cancel same-product internal handoff; whole finished ball is not a raw-material substitute |\n| upstream_dataset_requirement | Match real whole supplied composition/form/route/geography/time/operation boundary; disclose auxiliary provider unknowns; identity flow is not a footprint |\n| disclosure | Declare real configuration, sources, supply layers, subcontracting/energy, first-release Q, original-cohort service Qc/H, gross physical gates, stock inheritance and unresolved quantities |\n\n\n\nApply the following rules with this section context. Conditional absence needs actual evidence; unknown is not zero. Physical ledgers and burden dimensions remain separate.\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | manufacture | Make the complete ball from supplied whole PU-faced textile laminate and formed natural-latex bladder/valve: receive/inspect, cut panels, print/actually dry, prepare/leak-test bladder, assemble/hand-stitch and close, inflate/round, test, wash as actually sequenced and first quality release. Capture failed, trial, idle, start/stop, cleanup and rework operations, including subcontract stitching and its transport/utilities. No purchased-finished-ball packaging shortcut. | `pintech-route`; `psdf-route`; `sublime-craft` |\n| b_whole | skin; bladder; supplied preparations | The actual whole laminate contains supplier coating/backing/cushion/adhesive and the whole bladder contains its valve and balance material. Upstream production is retained once in compatible supplied-state datasets. Record actual onsite component manufacture as disjoint individual purchased atoms, real energy/losses and paired internal handoff before claiming applicability; do not purchase whole and self-contained ingredients together. No inferred layer count or resin/bladder recipe. | `pintech-factory`; `derby-bladder`; `fusheng-sheet` |\n| b_release | finished | Q is the calibrated net whole mass of uniquely newly first-released complete balls in one declared cohort/configuration and release-state pressure/temperature/moisture window. Include retained inflation gas and all actual retained ingredients once; exclude detachable packaging. Released closing FG is already in Q and bears its manufacturing burden: neither subtract it nor add it as a second output. Opening released FG, dispatch, return, reinspection and repair create no new Q. | `pintech-route`; `select-qc` |\n| b_vectors | all burden-bearing dimensions | Preserve every exchange inherited vector in opening/closing raw stock, WIP and unassigned non-WIP stores. Manufacturing A equals attributable converted raw load plus inherited unassigned opening vector minus only still-unassigned closing vector, with a once-justified other-function/cohort handover if real. Already-net consumption gets no second stock correction. Ordinary rejects, samples, sold/exported waste and treatment remain assigned; sale alone is no Tother transfer. Q=0 retains full loads without a unit result. | `ilcd-2010` |\n| b_service | service; assets | Actual postrelease storage, handling, deflation/reinflation, packaging, testing and work retain original-cohort Qc and observed horizon H. Performed service remains even for closing FG; only unused/unassigned service or charge carries forward. Future unknown service stays unknown. On consolidation internal reference handoff cancels and there is one finished reference output. | `ilcd-2010`; `pintech-route` |\n| b_permission | postrelease work | A claim of continued conformance after actual work needs manufacturer/specification permission, real postwork tests, acceptance and disposition. Unauthorised, failed or rejected work still retains every real material, gas, energy and waste exchange with original cohort and hold/waste disposition; permission is never a data-deletion switch. Natural humidity uptake/loss needs no invented repair event or permission. | `pintech-route`; `ilcd-2010` |\n| b_gas | inflation; all actual gas species | Measure gross intake composition, pressure/temperature/humidity, retained gas in released/held/shipped/returned balls, compressor losses, leak-test vents and real releases species by species. Atmospheric resource O2/N2/Ar are not industrial gas purchases. Whole-air total is a nonadditive control sum only; add actual other species before quantification. Separate water vapour, free liquid and ingredient/bound water; no fictitious reaction water, fixed air fractions or generic VOC/NOx/COD molecules. | `sublime-craft`; `pintech-route` |\n| b_pack | each actual packaging pool | For each actual carton, PE bag, wood pallet and PP strap pool separately keep full wet O + P + I + ER + X_in = C + S + EO + W + X_out, with empty, attached-WIP, attached-FG and reusable O/C subpools. P/I whole supply includes constituents once; physical I is retained with exactly one upstream owner. S follows gross physical shipment, not Q or allocated sales. Internal reuse cancels; neither repeat purchase nor coproduct credit. Six event cards are conditional real legs; one actual mixed Waste outlet uses nonadditive pool-W origins and one treatment/provider, not duplicated Waste cards. | `ilcd-2010`; `pintech-route` |\n| b_repair_water | packaging; repair; humidity | X_in/X_out remove overlap with other same-side incoming/outgoing flow terms only, never stocks, opposite-side flows or mere card existence. True additional wood, nails or water remain influx even when retained in full wet closing stock. Natural moisture exchange in normal handling is real H2O input/output too. Whole wet supplied article and disjoint added components reconcile independently; never fit two unknowns with one mass residual. | `ilcd-2010` |\n| b_assets | assets; fluids | Keep full gross new/used asset and replacement-part receipts, handovers, retirement, installed fluid and O/C physical stocks separate from current service burden stock/utilisation. Whole supplied asset includes fitted components/charge once; actual later new/old parts and fluid additions/losses get separate atomic exchanges. No fixed lifetime, one machine per kg, invented opposite disposal, boiler, steam or fuel. Add any real extra carrier/fuel/thermal service before use; actual Product water return needs temperature/enthalpy and provider agreement without double buying carrier and heat. | `ilcd-2010`; `fmc-energy` |\n| b_dimensions | gross disclosures and attributable upstream burden | When constructing a scored inventory, treat gross-card V as physical disclosure only, never an additional purchase, upstream process demand or credit. For each real procurement, supplier-included package, asset service and waste treatment identify one actual upstream owner and separately retain its attributable burden vector with supply-state boundary, opening/closing unassigned charge and actual allocation. Project that burden dimension once to its cohort; gross P/I/ER/S/EO/W and actual asset/water legs remain complete independent physical events. A burden projection is not a second physical receipt. | `ilcd-2010` |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | ilcd-2010 |\n\n\n\n"
