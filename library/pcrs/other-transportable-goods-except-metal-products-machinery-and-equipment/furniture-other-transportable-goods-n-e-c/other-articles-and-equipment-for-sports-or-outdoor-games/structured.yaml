normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:0da44c89b95d412837dd63807c8df7b16811cce99c27d50b6bfdf7a5c5bd2c4d"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7986"
      family: "system_boundary"
      span:
        start:
          offset: 7986
