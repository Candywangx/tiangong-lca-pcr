  calculation_rules:
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "x = A / Q. This is the sole normalization, after original raw unit conversion and actual burden attribution. For manufacturing A is the attributable converted raw load plus unassigned inherited opening raw/WIP/non-WIP vectors minus only still-unassigned closing vectors and any once-justified true other-function/cohort handover; already-net consumption receives no second stock correction and released closing FG is not subtracted. For performed original-cohort service use its actual incremental A after only unused/unassigned service or charge carryover and use Q = Qc with observed H. For every gross event card A = V, the complete actual gross physical leg; no stock correction, burden vector, economic share, repeat procurement/provider or credit. Q is actual unique first-release kg for the corresponding cohort; Q=0 retains load without x. Finished reference is exactly 1 kg; all descriptions and aggregations refer to this same application, never a second quotient."
      inputs:
        - raw
        - native_unit
        - actual_allocation
        - inherited_vectors
        - V
        - Q
        - Qc
        - H
      output: "x"
      source_ids:
        - ilcd-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows"
      requirement: "Confirm actual supplied whole product/material/formulation, phase, route, grade, geography, native property/unit and every provider boundary; broad compatible family is narrowed by complete card context. Never use a names-only selection or silently substitute an unresolved atom."
      evidence: "native direct-read restrictions; supplier BOM and SDS; actual measured configuration"
    - id: dq_measure
      applies_to: "all protocols"
      requirement: "Keep original calibrated raw records, timestamps, independent density/geometry and measured whole release mass. Unknown future factory quantities remain unknown; zero or absence requires real evidence. State uncertainty and all measurement failures."
      evidence: "calibration and traceable meters or balances; actual test records"
    - id: dq_history
      applies_to: "manufacture; service"
      requirement: "Reconcile physical mass and each relevant element independently across manufacture, finished-goods and consolidated gates, while preserving separate burden-vector stocks and original cohorts. No one residual solves two unknowns or swaps a pollution index for a molecular mass."
      evidence: "full stock and cohort history; independent species/water measurements"
    - id: dq_source
      applies_to: "all cited constraints"
      requirement: "Retain actual complete primary context and alternative-route limitations. Manufacturer documents support their observed route/form only; they do not prove one common SKU/factory, recipe, industry yield, numeric factor, certification or LCA allocation."
      evidence: "primary manufacturer documents and original diagrams; ilcd-2010 for allocation only"
    - id: dq_gross
      applies_to: "packaging; assets; waste"
      requirement: "For every actual six-leg pool and gross card audit full V without economic scaling, supplier-included owner, wet O/C, same-side-only X and exactly one real mixed outlet/provider. Component origin totals and physical mixed total never add together."
      evidence: "individual leg records and nonadditive outlet-origin ledger"
    - id: dq_completeness
      applies_to: "all actual operations"
      requirement: "Include all actual failed/unapproved/rejected work, Q=0, startup, shutdown, idle, cleanup and rework. Before quantifying, add each real unlisted fuel/chemical/packaging/species/part as its own specific card with appropriate original unit and owner; do not hide it in zero or other."
      evidence: "actual work orders and incident/stock/waste logs including negative outcomes"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished"
    rule: "Require one uniquely linked Product first-release output consistent with reference UUID and Mass/kg in both languages, declared complete configuration and all qualifiers; actual acceptance evidence controls conformance. No core identity substitution with materials or accessories."
    source_ids:
      - ilcd-2010
      - pintech-route
  - rule_id: v_raw
    applies_to: "all inventory rows"
    rule: "Audit every raw-to-native conversion and actual attribution before the sole A/Q quotient. Gross numerator equals actual full V; service uses original Qc/H; manufacturing closes only unassigned raw/WIP/non-WIP vectors. Q=0 keeps load without unit result; no repeated division or released-FG burden deduction."
    source_ids:
      - ilcd-2010
      - pintech-route
  - rule_id: v_physical
    applies_to: "all physical gates"
    rule: "Independently reconcile real whole mass, relevant elements, constituent/whole nonoverlap, inflation species, phase/state water, packaging pools and asset/repair events. Use full wet closing mass and retained true influx together. Molecular data require real evidence, not COD/VOC/NOx indicators or fitted residuals."
    source_ids:
      - ilcd-2010
      - pintech-route
  - rule_id: v_outlet
    applies_to: "all Waste and postrelease events"
    rule: "Audit one actual mixed outlet with nonadditive separately measured origins and one treatment/provider; activate additional Waste cards only for true separate gates. Preserve all failed/unapproved performed work and hold/waste disposition; continued conformance needs actual permission/posttests/acceptance. No sale-only burden credit."
    source_ids:
      - ilcd-2010
      - pintech-route
  - rule_id: v_evidence
    applies_to: "all data packages"
    rule: "Disclose missing site measurements, unresolved auxiliary identities/providers and methodological uncertainty instead of inventing zeros or claiming certification/review. This candidate method alone establishes no science, translation, mapping, publication or coverage approval."
    source_ids:
      - ilcd-2010
      - pintech-route
