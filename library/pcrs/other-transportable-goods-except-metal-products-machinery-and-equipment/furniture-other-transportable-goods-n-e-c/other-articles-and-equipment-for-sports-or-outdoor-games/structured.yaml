        - sublime-craft
        - pintech-route
    - rule_id: b_pack
      applies_to: "each actual packaging pool"
      rule: "For each actual carton, PE bag, wood pallet and PP strap pool separately keep full wet O + P + I + ER + X_in = C + S + EO + W + X_out, with empty, attached-WIP, attached-FG and reusable O/C subpools. P/I whole supply includes constituents once; physical I is retained with exactly one upstream owner. S follows gross physical shipment, not Q or allocated sales. Internal reuse cancels; neither repeat purchase nor coproduct credit. Six event cards are conditional real legs; one actual mixed Waste outlet uses nonadditive pool-W origins and one treatment/provider, not duplicated Waste cards."
