    - rule_id: b_route
      applies_to: "manufacture"
      rule: "Make the complete ball from supplied whole PU-faced textile laminate and formed natural-latex bladder/valve: receive/inspect, cut panels, print/actually dry, prepare/leak-test bladder, assemble/hand-stitch and close, inflate/round, test, wash as actually sequenced and first quality release. Capture failed, trial, idle, start/stop, cleanup and rework operations, including subcontract stitching and its transport/utilities. No purchased-finished-ball packaging shortcut."
