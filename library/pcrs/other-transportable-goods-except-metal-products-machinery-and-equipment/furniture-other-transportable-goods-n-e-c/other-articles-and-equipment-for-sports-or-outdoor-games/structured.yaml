          description: "One actual wastewater outlet when these uses truly mix; measure full volume, density and true molecular/ionic analysis as needed. COD, VOC, total nitrogen/carbon and turbidity are indicators, not invented species. Treatment/provider once; split only real different outlets. This card references the same single_quotient application in section 8. The gross physical dimension uses full V; manufacturing burden and real original-cohort service burden are assigned separately once."
          amount:
            expression: "A / Q once; A = complete actual gross physical leg V; Q = original-cohort first-release kg; no stock correction or economic scaling; same section 8 quotient"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_wastewater
              source_ids:
                - sublime-craft
                - ilcd-2010
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: a_dedicated
    applies_to: "all burden-bearing exchanges"
    rule: "This is an attributional inventory only for cases where allocation is required. First directly assign dedicated work orders, materials and meters and physically subdivide; use justified virtual subdivision for separable exchange/function demands. Keep the complete ball as one combined functional product; do not allocate among skin, bladder, thread and gas delivered together."
    source_ids:
      - ilcd-2010
  - rule_id: a_causality
    applies_to: "remaining shared burden dimensions"
    rule: "For genuinely inseparable residual exchanges demonstrate the determining physical causal relation separately for each exchange/function. Empirically supported press load/time, compression/test demand or specific material use may differ; mass, area, count, elapsed time and revenue are not freely interchangeable universal drivers. Reconcile all allocated dimensions to raw totals and disclose uncertainty/sensitivity."
    source_ids:
      - ilcd-2010
  - rule_id: a_residual
    applies_to: "only residual multifunctional process"
    rule: "Only if preceding steps leave genuine residual shared multifunctional burdens and no determining physical relation can be supported, justify actual contemporaneous market values at the same process gate and true exit condition, excluding later packaging/transport margin unless adjusted to that gate. Identify real co-functions and all shares/negative-value conventions; no fixed split, substitution credit or arbitrary physical/economic choice."
    source_ids:
      - ilcd-2010
  - rule_id: a_gross
    applies_to: "gross physical event cards; waste"
    rule: "Gross physical mass/volume/events always use full actual V, never burden shares or stock-corrected consumption. Separately attributed burden dimensions have one owner once. Ordinary rejected samples, failed balls and exported/sold waste plus their treatment retain origin manufacturing burden; only a true identified other cohort/function and justified handover/allocation permits one vector transfer. Waste sale alone is not such evidence."
    source_ids:
      - ilcd-2010
