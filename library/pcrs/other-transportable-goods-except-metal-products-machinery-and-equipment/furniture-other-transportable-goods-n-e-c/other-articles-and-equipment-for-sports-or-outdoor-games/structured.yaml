    - rule_id: b_assets
      applies_to: "assets; fluids"
      rule: "Keep full gross new/used asset and replacement-part receipts, handovers, retirement, installed fluid and O/C physical stocks separate from current service burden stock/utilisation. Whole supplied asset includes fitted components/charge once; actual later new/old parts and fluid additions/losses get separate atomic exchanges. No fixed lifetime, one machine per kg, invented opposite disposal, boiler, steam or fuel. Add any real extra carrier/fuel/thermal service before use; actual Product water return needs temperature/enthalpy and provider agreement without double buying carrier and heat."
