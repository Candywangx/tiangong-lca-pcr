      markdown: "## 7. Allocation and Co-product Handling\n\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| a_dedicated | all burden-bearing exchanges | This is an attributional inventory only for cases where allocation is required. First directly assign dedicated work orders, materials and meters and physically subdivide; use justified virtual subdivision for separable exchange/function demands. Keep the complete ball as one combined functional product; do not allocate among skin, bladder, thread and gas delivered together. | `ilcd-2010` |\n| a_causality | remaining shared burden dimensions | For genuinely inseparable residual exchanges demonstrate the determining physical causal relation separately for each exchange/function. Empirically supported press load/time, compression/test demand or specific material use may differ; mass, area, count, elapsed time and revenue are not freely interchangeable universal drivers. Reconcile all allocated dimensions to raw totals and disclose uncertainty/sensitivity. | `ilcd-2010` |\n| a_residual | only residual multifunctional process | Only if preceding steps leave genuine residual shared multifunctional burdens and no determining physical relation can be supported, justify actual contemporaneous market values at the same process gate and true exit condition, excluding later packaging/transport margin unless adjusted to that gate. Identify real co-functions and all shares/negative-value conventions; no fixed split, substitution credit or arbitrary physical/economic choice. | `ilcd-2010` |\n| a_gross | gross physical event cards; waste | Gross physical mass/volume/events always use full actual V, never burden shares or stock-corrected consumption. Separately attributed burden dimensions have one owner once. Ordinary rejected samples, failed balls and exported/sold waste plus their treatment retain origin manufacturing burden; only a true identified other cohort/function and justified handover/allocation permits one vector transfer. Waste sale alone is not such evidence. | `ilcd-2010` |\n\n\n\n"
