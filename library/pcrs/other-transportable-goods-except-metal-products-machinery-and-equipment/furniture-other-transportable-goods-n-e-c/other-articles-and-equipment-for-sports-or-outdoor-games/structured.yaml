      markdown: "## 9. Validation Rules\n\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| v_reference | finished | Require one uniquely linked Product first-release output consistent with reference UUID and Mass/kg in both languages, declared complete configuration and all qualifiers; actual acceptance evidence controls conformance. No core identity substitution with materials or accessories. | `ilcd-2010`; `pintech-route` |\n| v_raw | all inventory rows | Audit every raw-to-native conversion and actual attribution before the sole A/Q quotient. Gross numerator equals actual full V; service uses original Qc/H; manufacturing closes only unassigned raw/WIP/non-WIP vectors. Q=0 keeps load without unit result; no repeated division or released-FG burden deduction. | `ilcd-2010`; `pintech-route` |\n| v_physical | all physical gates | Independently reconcile real whole mass, relevant elements, constituent/whole nonoverlap, inflation species, phase/state water, packaging pools and asset/repair events. Use full wet closing mass and retained true influx together. Molecular data require real evidence, not COD/VOC/NOx indicators or fitted residuals. | `ilcd-2010`; `pintech-route` |\n| v_outlet | all Waste and postrelease events | Audit one actual mixed outlet with nonadditive separately measured origins and one treatment/provider; activate additional Waste cards only for true separate gates. Preserve all failed/unapproved performed work and hold/waste disposition; continued conformance needs actual permission/posttests/acceptance. No sale-only burden credit. | `ilcd-2010`; `pintech-route` |\n| v_evidence | all data packages | Disclose missing site measurements, unresolved auxiliary identities/providers and methodological uncertainty instead of inventing zeros or claiming certification/review. This candidate method alone establishes no science, translation, mapping, publication or coverage approval. | `ilcd-2010`; `pintech-route` |\n\n\n\n"
