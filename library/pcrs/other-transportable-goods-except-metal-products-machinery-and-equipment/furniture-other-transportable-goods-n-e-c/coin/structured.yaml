allocation_rules:
  - rule_id: a_subdivide
    applies_to: "all burden coordinates"
    rule: "Use an attributional manufacturing goal and establish whether allocation is actually needed. Assign dedicated lots/tools/operations/services first; perform real or defensible virtual subdivision before sharing any remaining burden. Industrial minting descriptions do not themselves authorize an LCA allocation factor."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_causal
    applies_to: "each residual inseparable exchange"
    rule: "Identify and quantify the determining physical causal relation separately for each actual exchange and all cofunctions at the real process state; justify its driver and denominator. Do not choose mass/count/time/energy arbitrarily or apply one factor to every coordinate. Keep all real physical gross legs full and separate."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "genuinely remaining joint-process burdens"
    rule: "Only a documented remainder after subdivision and exchange-specific causality may use contemporaneous actual market values in the actual condition at the common process gate or relevant treatment-input gate. Preserve all cofunctions, price/gate adjustments/currency/period and sensitivity; face denomination, precious-metal value or retail coin value is not the environmental denominator or a default allocation key. No fixed recovery ratio or automatic avoided-primary-metal credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_waste
    applies_to: "ordinary failures and material/service losses"
    rule: "Ordinary manufacture waste, rejects, samples and their treatment remain assigned to original manufacturing/service even when exported or sold. A vector transfer T_other requires a real distinct other function/cohort plus justified allocation/handover and receipt, applied once; external departure alone is insufficient. Physical gross amounts remain full. Any broader recycling/system-model decision needs evidence beyond this manufacturing rule."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_mint"
      flow_role: "finished_coin"
      record_type: "release and weighing"
      raw_fields: "original cohort/configuration/alloy/surface state; raw gross/tare/net kg; calibration/uncertainty; complete coin count; first release/hold/failures/destructive samples; opening/closing released FG; dated authorized acceptance record; actual_originating_process_id; actual_row_id; event_id; real_direction; physical_gate; original_cohort_Q_c; observed_H_not_divisor; actual_F_in_F_out; OTHER_same_side_duplicate_X_in_X_out_evidence"
      collection_method: "Weigh same-configuration released complete net coins on calibrated scales with separately established packaging/free-liquid tare; reconcile counted pieces/surface/moisture/specification and unique first release; no assumed coin mass."
      unit: "kg; Item(s)"
      frequency: "each lot and first-release event"
      temporal_coverage: "complete manufacturing observation including failures and zero output"
      site_scope: "actual original matched configuration/cohort at this gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/weighing originals/specification and acceptance/cohort uniqueness/uncertainty"
    - protocol_id: cp_blank_receipt
      process_id: "p_mint"
      flow_role: "blank_receipt"
      record_type: "raw physical event and linked ownership"
      raw_fields: "event/original cohort/configuration/H; this card direction and physical event; undivided original amount/unit/rate-or-cumulative flag; complete gross V; phase/composition/medium/density evidence; opening/closing raw/WIP/non-WIP/FG/installed charge; per-flow inherited vector; one provider/treatment owner; failures/hold/rework/missingness; actual_originating_process_id; actual_row_id; event_id; real_direction; physical_gate; original_cohort_Q_c; observed_H_not_divisor; actual_F_in_F_out; OTHER_same_side_duplicate_X_in_X_out_evidence"
      collection_method: "Use calibrated scales/meters and original custody records for this specific real card event; independently verify composition/medium and rate integration/density state; never invent quantities, replace gaps by zero or repurchase. For each packaging pool collect independent P/I/ER/gross S/EO/W and empty/attached/reusable wet stocks, independently measured mixed total and nonadditive pool W, with disjoint actual whole-article/supplemental part-water bridges."
      unit: "kg"
      frequency: "each real event and opening/closing cutoff"
      temporal_coverage: "complete manufacture or original-cohort service H including all failures/idle/cleanup"
      site_scope: "same physical gate/direction/process as this card; disjoint cohorts and stores"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/supply and custody originals/SDS or species analysis/phase-medium/stocktake/treatment receipts/completeness and uncertainty"
    - protocol_id: cp_mint_power
      process_id: "p_mint"
