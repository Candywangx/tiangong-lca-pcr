system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "p_mint"
      rule: "Start at whole supplied copper-nickel blanks with completed upstream manufacture borne once. Record receipt/inspection, only actual remaining annealing/quenching, cleaning/drying, rimming, application, striking, quality sorting/testing and first release. No onsite casting/rolling/blanking, proof burnishing, plating or extra finishing is presumed; a truly different route needs full additional atomic inventory and applicability review."
      source_ids:
        - ram-coin-making-2015
        - ram-minting-process
        - usmint-coin-production-2021
    - rule_id: b_first_release
      applies_to: "p_mint; p_service"
      rule: "Q_c is first-release net full-coin kg, not net deliveries. Closing released FG belongs to Q_c already; do not add it as another output or remove its manufacturing burden. Internal released-coin handoff and vector match/cancel. Subsequent storage/pack/handling/dispatch/return/rework have separate actual incremental service by original Q_c and H; no new Q on reinspection or redelivery."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_complete
      applies_to: "all exchanges"
      rule: "Retain every actual failed/held/destructive-test/sample, zero-output, start-stop, idle, cleanup, unauthorized and rework event and its real flows/burdens. Work permission/posttests/acceptance/disposition govern legitimate postrelease work and continuing conformity; they do not erase work actually performed without permission or failed results. Natural humidity exchange is actual physics without fictional repair operations. Unknown is not zero."
      source_ids:
        - ram-minting-process
        - usmint-coin-production-2021
    - rule_id: b_whole
      applies_to: "every supplied article/preparation"
      rule: "Every real raw formulation, added chemical, tool, packaging material, water, fuel, energy, waste and species has its own atomic card. Buy whole preparations/articles once; assay/carrier/contained components are nested and disjoint. Actual site blending or added parts require specific separately purchased rows, energy and losses. Never conceal manufacturing inputs inside zero/other categories."
      source_ids:
        - ram-minting-process
        - usmint-coin-production-2021
    - rule_id: b_physical
      applies_to: "all gates"
      rule: "Manufacturing, FG and consolidated physical gates must agree with full gross materials/packaging/assets/parts/water/thermal carriers and each actual air species. No economic share scales physical legs. Internal same-product/water/recycle handoffs match and cancel; no second purchase, Q or credit. A real externally returned condensate/hot-water carrier is Product return with actual state/enthalpy and supplier convention."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - ilcd-attributional-2010
