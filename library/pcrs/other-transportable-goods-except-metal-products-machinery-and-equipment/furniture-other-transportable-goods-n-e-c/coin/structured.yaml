  calculation_rules:
    - id: raw_units
      applies_to: "all inventory rows"
      rule: "Preserve original readings before normalization. Convert actual g to kg by 0.001 and kWh to MJ by 3.6 only when these actual units apply; preserve each row native extensive property. Integrate true rates over measured time, never multiply already integrated liquid/gas volume by time. Volume-to-mass requires independently measured substance/state density, never a generic secondary-property coefficient."
      inputs:
        - raw_value
        - raw_unit
        - state
        - duration
        - density
      output: "U_j"
      source_ids:
        - ilcd-attributional-2010
    - id: physical_consumption
      applies_to: "ordinary consumed-material coordinates"
      rule: "For the same disjoint physical pool use N_j = O_j + U_j - C_j - H_j, with only legitimate documented non-target physical handoff H_j; include opening/closing raw/WIP and non-WIP stores exactly once. Already stock-corrected consumption is used directly, without a second O-C adjustment. This N is distinct from full gross-leg V and from environmental vectors; ordinary waste is not H_j and cannot erase its embodied consumption."
      inputs:
        - O_j
        - U_j
        - C_j
        - H_j
        - stock_basis
      output: "N_j"
      source_ids:
        - ilcd-attributional-2010
    - id: manufacturing_vectors
      applies_to: "p_mint burden coordinates"
      rule: "A_make_c = B_open_c + U_burden_c - B_close_c - T_other_c. B carries per-flow inherited vectors of raw/WIP and only unused/unassigned non-WIP material/service charges; exclude all released FG. U contains each compatible upstream provider and actual manufacturing/test/ordinary-waste-treatment loads once, including failures/idle/cleanup/rework/Q-zero. No production deduction for released FG still held. Match all internal vectors; T_other needs a real distinct function/cohort and justified receipt."
      inputs:
        - B_open_c
        - U_burden_c
        - B_close_c
        - T_other_c
      output: "A_make_c"
      source_ids:
        - ilcd-attributional-2010
    - id: service_vectors
      applies_to: "p_service burden coordinates"
      rule: "A_service_c_H = S_open_unused_c + U_service_c_H - S_close_unused_c - T_service_other_c_H. Keep real performed original-cohort service even when FG is still held; carry only unused/unassigned service/material charge, not performed work. Physical FG opening/closing/returns carry historical manufacture and service vectors for custody reconciliation without treating held released FG as new manufacture or subtracting its production. Record actual gross G/R and original delivery reversal bridge if an alternative net-delivery model is ever proposed; this PCR fixes first release, so that alternative is not silently substituted."
      inputs:
        - S_open_unused_c
        - U_service_c_H
        - S_close_unused_c
        - T_service_other_c_H
      output: "A_service_c_H"
      source_ids:
        - ilcd-attributional-2010
    - id: packaging_balance
      applies_to: "each physical packaging pool"
      rule: "For each PE bag/carton/wood pallet/steel drum independently use O_pack + P + I + ER + F_in - X_in = C_pack_wet + gross S + EO + W + F_out - X_out. O and C include complete empty, attached WIP/FG and reusable wet stocks once. F_in/F_out are independently measured real additional material/water/part contributions entering/leaving this pool outside its other gross terms. X_in/X_out remove ONLY the proved overlapping portion already in an OTHER same-side actual incoming/outgoing flow term; a stock, opposite-side flow, card presence or unmeasured assumption is never an X. Real added repair material/water retained at closing remains both actual influx and complete closing wet mass. Use whole wet articles OR a disjoint measured component/water decomposition, with explicit matching internal component-to-article bridges that cancel on consolidation. Do not add constituents to their whole or net gross receipt/dispatch by returns. For one actual mixed Waste outlet choose one independently weighed total OR its complete independently measured origin-W partitions with the same single provider and nonadditive composition ledger; never sum both or force unknown shares from a residual. Distinct actual segregated outlets remain distinct."
      inputs:
        - O_pack
        - P
        - I
        - ER
        - C_pack_wet
        - S
        - EO
        - W
        - F_in
        - F_out
        - X_in
        - X_out
      output: "physical_pool_closure"
      source_ids:
        - ilcd-attributional-2010
    - id: mass_species_closure
      applies_to: "manufacture and FG and consolidated gates"
      rule: "Independently reconcile full gross physical mass and relevant Cu/Ni/C/H/O/N/other actual elements using raw non-WIP/WIP/FG, assets/parts/fills, each wet package, thermal carriers and every actual incoming/outgoing gas/liquid/solid species. Keep free, reaction, phase and structural water separate, with reaction evidence for reaction water. Assay/total element/COD/VOC/PM are not molecular identities. Full wet stocks and real influx coexist; one residual cannot fit two unknowns. No aggregate air or whole waste plus additive species duplication. At each physical gate reconcile opening full entities + external gross inputs + matched internal inputs = closing full entities + external gross outputs + matched internal outputs, by each real mass coordinate, before internal cancellation. Net accepted-coin Q excludes packaging/free water while physical wet FG retains its separately measured attached water/contamination bridge. Asset receipts/retirements, installed parts/fills and each inherited exchange vector remain distinct from consumed N or assigned A."
      inputs:
        - gross_legs
        - wet_stocks
        - species
        - assays
        - state
        - independent_measurements
      output: "closure_residual_and_uncertainty"
      source_ids:
        - ilcd-attributional-2010
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "For original cohort c and observed horizon H choose exactly one undivided numerator per coordinate: full actual gross physical V_j_c_H for every gross-disclosure card; target N_j for its separately identified consumed-material coordinate; A_make_c or A_service_c_H for its separate environmental-burden coordinate. Execute result_j_c_H = numerator_j_c_H / Q_c exactly once. Card amounts and protocol aggregation reference this identical result, never re-stock-correct or economically allocate gross V, never divide twice and never add physical and burden coordinates. Reference output and matching internal transfer are 1 kg. Q_c=0 retains all actual raw loads and yields no per-unit result; cohorts/configurations and horizons remain separate. H only selects the actually observed service interval; never divide its accrued load by H again. Q_c remains the original first-release mass even for held, returned or subsequently failed coins."
      inputs:
        - V_j_c_H
        - N_j
        - A_make_c
        - A_service_c_H
        - Q_c
        - cp_release
      output: "result_j_c_H"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all bound/unresolved cards"
      requirement: "Preserve actual configuration/all native restrictions/official Chinese name and real provider compatibility; absent UUID retains concrete flow and applicability gap."
      evidence: "complete direct record/supplier specification/species analysis/permission and state evidence"
    - id: dq_time
      applies_to: "all cohorts and service"
      requirement: "Fix observation period/original Q_c/H; retain all failed/zero-output/unauthorized/rework loads and disposition. Performed service is not deducted for held FG."
      evidence: "event ledger/meters/original delivery-return/acceptance/stock vectors"
    - id: dq_balance
      applies_to: "physical and burden coordinates"
      requirement: "Full gross physical amounts unscaled economically; every package six legs/single mixed outlet exclusivity/real additions/removals F and OTHER same-side duplicate X/full wet stocks/tool assets and services separate, with per-flow vector closure; unknown residuals remain pending. Apply packaging_balance F/X definitions and whole-wet/component exclusivity; no stock or opposite-side cancellation."
      evidence: "independent measurements/stocktake/assay/custody and burden ownership/uncertainty"
    - id: dq_sources
      applies_to: "each modelling rule"
      requirement: "Distinguish original acquisition/reuse from current extraction/read/agent applicability, retaining failures; industrial sources are not LCA allocation authority; no factory quantities fabricated from nominal examples."
      evidence: "complete original/context/counterexamples/original-extraction hashes/applicability limits"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and each adopted flow"
    rule: "Verify whole manufactured monometal copper-nickel coin terminal and actual blank supply state, every native basename/synonym/comment/CAS/grade/route/form/geography/media/type/property restriction and official Chinese display. A classifier or name alone is insufficient; hard material/phase/route conflicts block that binding. No monetary denominator or secondary-mass-derived default M."
    source_ids:
      - ram-five-cents
      - ram-coin-making-2015
  - rule_id: v_complete
    applies_to: "all actual operations and rows"
    rule: "Require every real material/preparation/water/energy/tool/packaging/waste/species event and all raw fields/ten card fields/qualifiers/descriptions/protocols/calculation Inputs/Output/source_ids/quality evidence in both renderings and projection, including complete heading/ancestor applicability. Unknown relationships are review-required, never invented zero or a claimed pass."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_accounts
    applies_to: "all gates and coordinates"
