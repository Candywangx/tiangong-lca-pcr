  calculation_rules:
    - id: calc_raw
      applies_to: "raw extensive observations"
      rule: "Convert original observations to the actual extensive unit before allocation. Integrated volume is already cumulative; only true rates use sum(rate×interval). Electricity uses 1 kWh=3.6 MJ. Density is independently measured for that material/state; secondary coefficients and catalog per-item values do not establish kg conversion."
      inputs:
        - "raw observations"
        - state
        - "independent density"
        - "explicit units"
      output: "converted raw quantities"
      source_ids: []
    - id: calc_q
      applies_to: "finished_chair"
      rule: "Q = sum(unique newly first-quality-released complete-chair net kg), measured at the declared moisture/configuration. Closing FG is part of Q, not another output or manufacturing B_close. Q=0 retains real loads and yields no unit result."
      inputs:
        - cp_release
      output: "Q"
      source_ids:
        - a2s-chair-catalogue
    - id: calc_manufacturing
      applies_to: "manufacturing burden dimensions only"
      rule: "A = B_open + U_new - B_close - T_other, a same-exchange-unit vector after real allocation. B stores cover raw/WIP/unused-unassigned charges, never first-released FG. Include all failed/Q0/startstop/idle/cleanup/test/rework loads. T_other needs actual distinct function/cohort and justified one-time vector handover, not ordinary waste sale. Cancel internal handovers and never stock-correct an already stock-corrected consumption again."
      inputs:
        - "converted vectors"
        - "inherited raw/WIP stores"
        - "allocation evidence"
      output: "A"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_asset
      applies_to: "actual asset/tool/fluid burden dimension only"
      rule: "Attribute actual used service/consumable burden to manufacture or original service cohort using measured service, capacity/time and justified allocation; carry only unused/unassigned charge once. Gross new/old article influx/removal and full wet closing stock remain physical V, separately. Included oil/parts have one owner; wear exports and retained parts are reconciled without double counting. No fixed lifetime or full-machine-per-kg assumption."
      inputs:
        - cp_asset
        - "inherited charge"
        - "actual use"
        - "allocation decision"
      output: "actual asset burden within A or A_H; gross V separately"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_service
      applies_to: "actual original-cohort burden dimensions only"
      rule: "A_H = actual performed service vector assigned to original cohort H over its observed horizon with fixed original Q_H. Retain complete FG history, actual increments, losses and all actual postwork, including unapproved/failed/rejected work with actual tests/disposition. Deduct only unused/unassigned service once, never performed service because FG is still stored. All actually incurred work, including unauthorized/unapproved, failed or rejected operations, retains its real materials/water/energy/emissions/wastes/custody and burdens. Permission, configuration-specific posttests and acceptance control authorization, continued qualification and actual hold/rejection/disposition only; never erase actual events or imply restoration, new Q or a new route. Actual postrelease work uses the original Q_H and observed H, even while FG is held; unobserved future work remains unknown. Repair-held FG and repair WIP are disjoint custody states."
      inputs:
        - cp_service
        - cp_pack
        - "actual utility/asset increments"
      output: "A_H; Q_H"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_physical
      applies_to: "each physical material/species and packaging/asset event"
      rule: "Opening + external incoming = closing + external outgoing with independently evidenced physical transformations. Packaging separately by article: O+P+I+ER+F_in-X_in=C+S+EO+W+F_out-X_out. F_in/F_out are independently measured additional real material/water ingress and removal, including actual repair additions/removals and ordinary humidity uptake/release; they are separate atomic source-event records, not balancing residuals. X_in/X_out subtract only a proven duplicate quantity already represented by another incoming/outgoing FLOW term on that SAME side, with paired term/event IDs and independently measured overlap. They never subtract opening/closing stock, an opposite-side flow, stock-retained new ingress, or an amount merely because a card exists. If the same-side other-flow duplication is absent, X is zero. Preserve each gross card V unchanged and document reconciliation between alternative non-additive representations. Physical new incoming mass and full closing wet mass both remain. Each packaging/asset/air gross card numerator V_gross is its actual complete external leg. No economic scaling, burden-vector subtraction, repeated stock correction, new procurement/credit or second Q is caused by reporting gross V. Whole wet articles/formulations include original substrate, liner, coating, adhesive, hardware and water once as measured child accounts. True paid standalone or bundled onsite components have independent external receipts/owners only if disjoint from the whole supplied article, or reconciled through a measured component-to-assembly bridge with paired internal handoff cancellation. A filled incoming glue/paint pail is measured as filled gross receipt reconciled to its net whole preparation and actual wet container tare; do not add the filled assembly plus those same contents/container twice. Keep actual separate ingress AND full wet closing stock. For one actual physically collected mixed waste outlet, select one compatible whole-mixture Waste exchange and one real treatment/provider record. Independently measured per-origin W raw amounts conserve its total with documented uncertainty; whole total OR partition are non-additive alternatives. Origin Waste cards and their treatment companions then represent child source/burden partitions only, never invented separate outlets or repeated provider charges. Genuinely separate streams retain correct separate identities and treatment. Do not apply a pure sawdust or paint Waste identity to an incompatible mixture; add/reselect the actual specific mixture before dataset completion only if that outlet exists."
      inputs:
        - cp_material
        - cp_water
        - cp_waste
        - cp_pack
        - cp_asset
        - cp_emission
      output: "gross V; independent closure and residuals"
      source_ids: []
    - id: calc_quotient
      applies_to: "all inventory rows except fixed finished_chair"
      rule: "For manufacturing burden dimensions q=A/Q; for actual original-cohort service burden dimensions q_H=A_H/Q_H; for packaging/asset/air gross physical cards q_gross=V_gross/Q for manufacturing events or V_gross/Q_H for service events. V_gross is the complete actual measured external leg and is never a burden vector, stock-corrected use or economic share. Execute this sole division once after raw conversion and the appropriate numerator preparation. Cards and protocol aggregation reference this same calculation, not additional divisions. Q=0 or Q_H=0 retains raw loads/gross legs without unit results; consolidation cancels internal Q once and retains compatible manufacturing/service dimensions. Actual gross Waste legs and independently measured gate-service new/removed material and liquid/vapour-water physical events also use V_gross/Q_H (or manufacturing Q), not A/A_H, stock correction or an economic fraction. Their actual associated supplier/treatment/service burden has one separate owner; reporting a gross leg creates no extra purchase/provider or credit."
      inputs:
        - A
        - Q
        - A_H
        - Q_H
        - V_gross
        - "event/cohort direction"
      output: "q; q_H; q_gross"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every flow and provider"
      requirement: "Verify complete native family/type/form/route/CAS/geography/medium and every property/unit restriction plus actual supplied preparation/BOM. UUID identity alone does not approve a provider, grade or performance. Resolve ordinary auxiliary identities before using concrete dataset exchanges; core finished-chair identity or real route gaps cannot be papered over by checks."
      evidence: "full native; supplier specifications; route/BOM evidence"
    - id: dq_period
      applies_to: "manufacture and original cohort service"
      requirement: "Cover all failures/zero-output/test/startstop/idle/cleanup, raw/WIP and FG lineage, actual service horizon and return/postwork disposition. Keep unknown, unmeasured, nondetect and confirmed zero distinct; no invented amounts or source recipes."
      evidence: "full time series; inventory counts; release and service logs"
    - id: dq_evidence
      applies_to: "each rule and conversion"
      requirement: "Retain complete applicable primary context, adjacent alternatives, independent allocation method, units/state/calibration and sampling/uncertainty. Industry documents are qualitative route evidence; handbook finishing section does not supply a factory furniture-finishing recipe. Match bilingual qualifier/row/rule/source order and complete descriptions."
      evidence: "full original context; source applicability; calibration; complete paired audit"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Read every rule with its scope and full ancestor/source context, §§5/7 and the raw/calculation rules. These are future data-package requirements; unresolved physical or scientific questions cannot be reported as passing."
    source_ids: []
  - rule_id: validate_terminal
    applies_to: "reference object and finished_chair"
    rule: "Require complete new unupholstered beech-frame chair, declared formed seat/back and actual qualified glue/finish, complete BOM and manufacturer tests. A bare frame/panel, unfinished assembly, bought-chair repack or incompatible family does not pass. UUID/type/flow-property/unit chain and full native restrictions must match."
    source_ids:
      - a2s-chair-catalogue
      - konar-chair-joinery
  - rule_id: validate_q
    applies_to: "all measurement relationships"
    rule: "Require one finished_chair reference output of 1 kg and the same basis in both languages; verify measured first-release Q, complete moisture/configuration, no Q+closing-FG duplication and no performed-service deduction for held FG. Check each original numerator extensive unit, actual conversion and single quotient with zero-denominator handling."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_gross
    applies_to: "packaging air water and assets"
    rule: "Require each real packaging material to have six directional cards and full O/P/I/ER/C/S/EO/W closure; each gross card uses full V, not allocated/stock-corrected burdens. Verify first non-purchased external ingress and one owner, whole wet inflow plus full closing mass, atomic gases/phase/speciation, actual asset/repair/installed-fluid stock and distinct service charges. No residual-fit multiple unknowns."
    source_ids:
      - jrc-ilcd-attributional-2010
      - usda-wood-handbook-2021
  - rule_id: validate_allocation
    applies_to: "every allocation/other-function transfer"
    rule: "Verify actual dedicated/virtual subdivision first, exchange-specific determining causality next, only genuine residual same-gate/state contemporaneous market-value evidence last. Waste sale alone does not transfer burden. All functions sum to the real vector; physical gross legs remain unscaled."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: validate_postwork
    applies_to: "actual post-release work and returns"
    rule: "Require original-cohort lineage, manufacturer/specification permission, real added inputs/losses, postwork tests, acceptance and disposition. Reinspection/return is not new Q; a returned mass is not assumed equal to original delivery or sufficient for an original-burden reversal. Net delivery is outside this declared denominator."
    source_ids:
      - jrc-ilcd-attributional-2010
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared complete-chair manufacturing and separately identified actual original-cohort factory-gate services"
  excluded_use: "Universal furniture/seat equivalence; use lifetime; certified performance; unreviewed other routes; zero-burden supplied stock or automatic credits"
  required_metadata: "All §3 qualifiers, first-release cohort and actual horizon H, native/provider restrictions, original units and full upstream/stock/ownership lineage"
  required_quality_disclosure: "Sampling/uncertainty, gaps and unresolved auxiliaries/providers, tests/disposition, source synthesis limits, actual allocation, complete checks and skipped/unknown scope"
  update_trigger: "Changed product/BOM/species/supply gate/glue/finish route, actual new atom/provider, test/acceptance or stock/allocation evidence"
