allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Apply these rules only to actual attributional multifunctionality; source manufacturing facts do not establish an allocation method. Physical mass, each packaging leg and each air/asset gross event remain full independently of burden shares."
    source_ids: []
  - rule_id: allocate_subdivide
    applies_to: "actual shared burdens"
    rule: "Avoid allocation through independently metered dedicated processes or justified virtual subdivision first. Preserve exchange vectors, actual other functions/cohorts and matching process gates; do not impose one mass/economic split on all rows."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocate_causality
    applies_to: "remaining shared exchanges"
    rule: "For each remaining exchange identify and evidence its determining physical causal relationship. Actual capacity/time, wood removal, coating work and storage constraints are assessed per exchange; mere correlation, mass equality or convenient prices do not establish causality."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocate_residual
    applies_to: "genuinely residual common process"
    rule: "Only after subdivision and causality have actually been exhausted may a residual common-process burden use evidenced contemporaneous market values at the same gate and actual state. Disclose currency/time/quality, residual scope, sensitivity and conservation across all functions. No arbitrary choice of physical/economic allocation, fixed ratio or automatic avoided-product credit."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: allocate_waste
    applies_to: "wood residues rejects samples treatment"
    rule: "Ordinary offcuts/shavings/dust, failed chairs, samples and their treatment stay in manufacturing/service burdens even if exported or sold. T_other requires a genuine distinct function/cohort plus justified allocation and one documented vector handover. Gross outgoing mass is never reduced by that burden share. Internal reuse cancels and does not become a new external purchase."
    source_ids:
      - jrc-ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "Each supply preparation/component"
      record_type: "raw records and independent measurements"
      raw_fields: "receipt/issue/return; complete formulation/BOM; species/origin; wet mass; assay; moisture; raw/WIP opening/closing; inherited exchange vectors; failed runs; row_id; source_process/event/work order; actual original cohort Q_H/H; raw/WIP/non-WIP physical quantities AND each inherited exchange vector; already-net flag; acceptance/hold/rejection/disposition"
      collection_method: "Calibrated whole net/tare weighing and actual supplier/production records; sample wood moisture separately; keep polymer/carrier/solids as subaccounts, not duplicate purchases. All actually incurred work, including unauthorized/unapproved, failed or rejected operations, retains its real materials/water/energy/emissions/wastes/custody and burdens. Permission, configuration-specific posttests and acceptance control authorization, continued qualification and actual hold/rejection/disposition only; never erase actual events or imply restoration, new Q or a new route. Actual postrelease work uses the original Q_H and observed H, even while FG is held; unobserved future work remains unknown. Repair-held FG and repair WIP are disjoint custody states. Actual postrelease use of an already listed exact supply remains a separate real process/event and original Q_H/H record, not a new manufacture or duplicated receipt; any different actual material/operation needs its own atomic row before completion."
      unit: "kg; original assay units"
      frequency: "each batch/event; opening/closing counts; continuous meters when applicable"
      temporal_coverage: "complete manufacture period and actual original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort; original units and all relevant directions"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing calibration; BOM; supplier route/origin; stock reconciliation"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "Unique first-release Q"
      record_type: "raw records and independent measurements"
      raw_fields: "configuration; serial/lot; whole net kg; tare; moisture; joint/finish permission; dimensional/stability/strength/surface tests; first-release time; hold/reject/test sample; opening/closing FG lineage"
      collection_method: "Weigh each accepted same-configuration complete chair on a calibrated scale excluding transport packaging; reconcile first-release register and actual manufacturer/specification tests, never catalog per-item mass."
      unit: "kg net whole chair; test units"
      frequency: "each batch/event; opening/closing counts; continuous meters when applicable"
      temporal_coverage: "complete manufacture period and actual original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort; original units and all relevant directions"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; signed release; complete test method and acceptance/disposition"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "Electricity and inbound freight"
      record_type: "raw records and independent measurements"
      raw_fields: "stage/cohort; meter increments; cumulative/rate flag; time interval; kWh/MJ; voltage; origin/time; supply boundary; actual load/distance/empty return"
      collection_method: "Read calibrated cumulative meters or integrate real rates once; retain actual transport payload/distance and supplier-included ownership; collect no per-Q amount."
      unit: "kWh/MJ; t*km"
      frequency: "each batch/event; opening/closing counts; continuous meters when applicable"
      temporal_coverage: "complete manufacture period and actual original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort; original units and all relevant directions"
      aggregation_rule: "per reference flow"
      quality_evidence: "meters/time series; voltage and provider proof; transport tickets"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "Each water phase and carrier subaccount"
      record_type: "raw records and independent measurements"
      raw_fields: "liquid/vapour/sorbed/free/structural/reaction origin; mass/cumulative volume; independent density; temperature/pressure; X_in/X_out; whole wet opening/closing stock; return and treatment; provider enthalpy boundary if real; row_id; source_process/event/work order; actual original cohort Q_H/H; raw/WIP/non-WIP physical quantities AND each inherited exchange vector; already-net flag; acceptance/hold/rejection/disposition"
      collection_method: "Weigh or meter each actual phase; use independent substance-state density and speciation/stoichiometry evidence. Keep carrier water inside whole preparation once; real new water retained in closing stock remains influx and closing wet mass. No invented steam/boiler or heat-return convention. All actually incurred work, including unauthorized/unapproved, failed or rejected operations, retains its real materials/water/energy/emissions/wastes/custody and burdens. Permission, configuration-specific posttests and acceptance control authorization, continued qualification and actual hold/rejection/disposition only; never erase actual events or imply restoration, new Q or a new route. Actual postrelease work uses the original Q_H and observed H, even while FG is held; unobserved future work remains unknown. Repair-held FG and repair WIP are disjoint custody states. Actual postrelease use of an already listed exact supply remains a separate real process/event and original Q_H/H record, not a new manufacture or duplicated receipt; any different actual material/operation needs its own atomic row before completion."
      unit: "kg per phase; original volume/state units"
      frequency: "each batch/event; opening/closing counts; continuous meters when applicable"
      temporal_coverage: "complete manufacture period and actual original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort; original units and all relevant directions"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; independent sample/density/state; supplier/treatment agreement"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "Each actual waste/residue"
      record_type: "raw records and independent measurements"
      raw_fields: "stream source and actual material; wet gross mass; water/solids/binder; contamination; retained sample; waste status; destination; treatment vector; any justified distinct-function handover; row_id; actual collected outlet/provider ID; measured whole wet total and independent per-origin W raw quantities; non-additive total OR partition; whole article/component assembly and paired handoff IDs"
      collection_method: "Separate and weigh each actual stream; reconcile actual treatment/recipient records and wet totals versus child subaccounts; sale never automatically subtracts manufacturing/treatment burdens. Whole wet articles/formulations include original substrate, liner, coating, adhesive, hardware and water once as measured child accounts. True separately purchased onsite components have independent external receipts/owners only if disjoint from the whole supplied article, or reconciled through a measured component-to-assembly bridge with paired internal handoff cancellation. A filled incoming glue/paint pail is measured as filled gross receipt reconciled to its net whole preparation and actual wet container tare; do not add the filled assembly plus those same contents/container twice. Keep actual separate ingress AND full wet closing stock. For one actual physically collected mixed waste outlet, select one compatible whole-mixture Waste exchange and one real treatment/provider record. Independently measured per-origin W raw amounts conserve its total with documented uncertainty; whole total OR partition are non-additive alternatives. Origin Waste cards and their treatment companions then represent child source/burden partitions only, never invented separate outlets or repeated provider charges. Genuinely separate streams retain correct separate identities and treatment. Do not apply a pure sawdust or paint Waste identity to an incompatible mixture; add/reselect the actual specific mixture before dataset completion only if that outlet exists."
      unit: "kg wet; original assay units"
      frequency: "each batch/event; opening/closing counts; continuous meters when applicable"
      temporal_coverage: "complete manufacture period and actual original-cohort service horizon"
      site_scope: "actual site/provider/stage/cohort; original units and all relevant directions"
