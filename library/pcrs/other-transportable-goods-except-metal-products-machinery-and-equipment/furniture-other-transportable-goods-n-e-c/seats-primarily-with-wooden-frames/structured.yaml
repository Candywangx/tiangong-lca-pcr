    required_unit: "kg"
    rule: "Measure wet mass and independent dry-basis moisture u=(wet-dry)/dry; dry wood=wet/(1+u) only after excluding binder/coating/hardware. Carrier water, cell-wall sorbed/free water, chemically structural water and reaction water have distinct evidence; one residual cannot fit two unknowns."
