      uuid: ""
    required_unit: "kg"
    rule: "Each gross-event numerator is the actual complete external gross leg V, not B_open+U-B_close or a burden share. Preserve full wet stock and real new influx simultaneously; stock retention never cancels incoming physical mass. Burden ownership is a separate dimension."
