system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "complete product system"
      rule: "Include ordered manufacturing stages, real internal transports, rejects/tests/rework before release, start/stop/idle/cleanup, actual controls and service increments. Supplier-manufactured stock/components do not have zero forestry/drying/binder burden; no duplicated constituent procurement of whole supplied preparations."
      source_ids:
        - a2s-chair-catalogue
        - cegim-beech-production
        - kleiberit-pvac-303
        - adler-unistar-2965
    - rule_id: boundary_q
      applies_to: "manufacturing and FG service"
      rule: "Use first quality release Q; keep first-released closing FG within Q and outside manufacturing B_close. Manufacturing stores cover raw/WIP/unused-unassigned charges only. Preserve performed original-cohort service over horizon H with original Q_H, including held FG/returns. Shipment/reinspection/postwork do not create new production; post-release work needs manufacturer/specification permission, postwork tests, acceptance and actual disposition; do not assume broken chairs can recover. All actually incurred work, including unauthorized/unapproved, failed or rejected operations, retains its real materials/water/energy/emissions/wastes/custody and burdens. Permission, configuration-specific posttests and acceptance control authorization, continued qualification and actual hold/rejection/disposition only; never erase actual events or imply restoration, new Q or a new route. Actual postrelease work uses the original Q_H and observed H, even while FG is held; unobserved future work remains unknown. Repair-held FG and repair WIP are disjoint custody states."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: boundary_physical
      applies_to: "all physical gates"
      rule: "Reconcile complete manufacturing, FG-service and consolidated gross physical gates, independent of burden allocation. Keep opening/closing raw/WIP/FG, every wet stock and true external legs including repair water/parts; subtract overlap only from another incoming/outgoing term. Newly supplied material/water retained at closing remains both influx and full closing mass. Internal transfers cancel once. Add every real unlisted atom rather than using other/zero or a selector label. Every raw/WIP/non-WIP or unused material store preserves complete physical quantity and each inherited exchange vector separately, including the already-net-consumption flag; no second stock correction to either dimension."
      source_ids:
        - jrc-ilcd-attributional-2010
        - usda-wood-handbook-2021
    - rule_id: boundary_carbon_water
      applies_to: "wood/coating/air/water"
      rule: "Keep dry wood, glue/coating solids, biogenic wood carbon, fossil formulation carbon and ambient carbon independently measured/sourced. Forestry carbon uptake remains with its upstream owner, never a second foreground CO2 credit. Distinguish free/sorbed water, carrier water, chemical structural water and independently evidenced reaction water. Total VOC/COD/TOC/dust and carbon balances cannot invent molecular species or a stoichiometric reaction. Water balance and relevant elements must be independently constrained; no default oxidation or reaction water."
      source_ids:
        - usda-wood-handbook-2021
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-attributional-2010
