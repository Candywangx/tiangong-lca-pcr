  - id: "un-cpc3-38112"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 38112 — https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/38112"
    used_for: "Classification hierarchy/title only; no manufacturing or allocation rule"
  - id: "a2s-chair-catalogue"
    type: "handbook"
    reference: "A2S, Our products, complete English catalogue, PDF pp.28–29 (printed pp.26–27) — https://a2s.com/PDF%20Printmedien/Englisch_EN/A2S_EN_catalog_our_products.pdf"
    used_for: "Whole 7097 chair terminal and formed beech multiplex seat/back, solid frame, glued/dowelled/screwed joints and waterborne lacquer; adjacent upholstered/other-frame configurations excluded; no catalog mass or certified-performance default"
  - id: "cegim-beech-production"
    type: "literature"
    reference: "CEGIM manufacturer, solid beech furniture production — https://cegim.ro/en/"
    used_for: "Industrial dried beech, CNC/milling/sanding, press assembly and waterborne finishing sequence; mixed furniture/upholstery portfolio is not this whole-chair BOM or current factory dataset"
  - id: "konar-chair-joinery"
    type: "literature"
    reference: "KONAR manufacturer, Wooden chair frames — https://konar-meble.pl/en/wooden-chair-frames-manufacturer/"
    used_for: "Hardwood machining and glued mortise-tenon joints; complete wooden chair contrasted with bare upholstery frame; no attributional allocation evidence"
  - id: "kleiberit-pvac-303"
    type: "handbook"
    reference: "KLEIBERIT 303.0 technical data sheet, version 08:05:2026, complete 2 pp. — https://www.kleiberit.com/fileadmin/Content_new/Produktinformationen/303.0/dbe3030_KSE.pdf"
    used_for: "Whole ready-to-use PVAc dispersion, one-component hardwood/tenon cold-bonding option and water cleanup; 2K hardener alternative and material dependence retained; no spread/pressure/time/density or certification defaults"
  - id: "adler-unistar-2965"
    type: "handbook"
    reference: "ADLER Bluefin Unistar 2965, TDS 4-0 IMC 2965 09/26, complete 5 pp. — https://www.adler-lacke.com/Canto/tmb/bluefin-unistar_tmb_2965_en.pdf"
    used_for: "Whole waterborne clear furniture coating, industrial airless option, substrate preparation/intercoat sanding/drying/cleanup; normal-stress 1K versus high-stress 2K scope retained; no recipe, rate, energy, emission, time or test threshold default"
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA FPL, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021), ch.4, 10 and limitations in ch.16 — https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Dry-basis moisture definitions, wood/adhesive physical distinctions and supplier qualification; interior finishing section explicitly omits factory furniture finishing; no green-wood range or universal emission/density factor"
  - id: "jrc-ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD General guide—Detailed guidance, first ed. March 2010, §7.9.2–7.9.3, PDF pp.275–288 — https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision/virtual subdivision, exchange-specific determining physical causality and genuinely residual process-gate market values; service constraints; not a wooden-chair recipe or default burden transfer"
