  data_quality_requirements:
    - id: dq_terminal
      applies_to: "release"
      requirement: "Complete controlled BOM/terminal and single first-release genealogy, calibration/net weighing/test evidence; no complete-table proxy."
      evidence: "drawing/BOM; complete release record; calibration"
    - id: dq_native
      applies_to: "all inventory rows"
      requirement: "Actual species/material/form/provider gate and exact native identity/property/group/unit restrictions; each unresolved auxiliary tracked, never silently chosen."
      evidence: "native identity; supplier/SDS; measured state"
    - id: dq_completeness
      applies_to: "all operating modes"
      requirement: "Capture failed/zero output, startstop, idle, cleanup, specimens, actual rework and treatment with full cohort and inherited stocks; unknown is not zero/not_applicable."
      evidence: "raw journals; stock genealogy; mode meters"
    - id: dq_physical
      applies_to: "all physical gates"
      requirement: "Independent wet mass and relevant element/species/water-phase closure with uncertainty; complete packaging six-leg and asset/fluid/FG histories without scaling gross legs."
      evidence: "independent balances; assays; stocks; uncertainty"
    - id: dq_assignment
      applies_to: "burden dimensions"
      requirement: "Allocation hierarchy evidence, actual drivers and residual market gate/state/time; separate full gross disclosures from actual upstream/service/treatment ownership once."
      evidence: "exclusive records; causal driver; contemporaneous gate values"
    - id: dq_source
      applies_to: "all rules"
      requirement: "Sources are qualitative technical synthesis; preserve variant exclusions and no assumed numerical cure/recipe/yield/life/performance. Scientific and translation review remain pending."
      evidence: "primary full context; limitations; actual future foreground evidence"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Read full scope, each complete card description and raw observations with these checks; unknowns never pass automatically."
    source_ids: []
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Verify complete terminal/BOM, make-buy ownership and every adopted native name, CAS if present, form, route, geography, medium/type, all properties and exact unit chain; preserve all consuming-card restrictions. An unresolved auxiliary is not a zero; core reference mismatch would make this record draft and unusable."
    source_ids:
      - jrc-ilcd-attributional-2010
      - metaco-table-leg-route
  - rule_id: v_quantity
    applies_to: "all inventory rows"
    rule: "Require one coherent first-release Q and all raw-to-A or complete-V transformations before the sole A/Q (or service A/Q_c) quotient. Cards and protocol aggregation reference the same result once. No assumed item mass, density, bounding-box area, cure/recipe/energy/yield number or unperformed test. Keep actual native numerator units; unsupported conversions remain unresolved."
    source_ids:
      - jrc-ilcd-attributional-2010
      - metaco-table-leg-route
  - rule_id: v_balance
    applies_to: "all physical gates"
    rule: "Require independently observed raw/WIP/FG/asset/package/water stocks, complete gross legs, relevant elements/species and inherited vectors at manufacturing, FG services and combined gates. Never subtract first-released closing FG manufacturing burden or erase ingress retained in full wet closing stock. Resolve whole/component and mixed-outlet pool overlaps; a residual is a diagnostic, not proof of two unknown quantities."
    source_ids:
      - jrc-ilcd-attributional-2010
      - metaco-table-leg-route
  - rule_id: v_qualification
    applies_to: "release; services"
    rule: "Keep actual drawing/spec release criteria, test records, permissions, postwork acceptance/disposition and original-cohort chronology. Unknown/core holds or unauthorized/failed work cannot be labelled passed or silently discarded. Ordinary moisture exchanges remain measured. Scientific review, translation review, mapping acceptance and publication are separate from engineering checks."
    source_ids:
      - jrc-ilcd-attributional-2010
      - metaco-table-leg-route
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply dataset for an actual complete table-leg assembly; not a complete table or every nonwood part"
  allowed_use: "Only matching whole terminal, material, route, configuration/state and unit restrictions; manufacturing and original-Q_c service H explicit"
  excluded_use: "Exclude a complete table/chair/cabinet, tabletop, raw tube or blank, generic hinge/bolt hardware, machine/structural support, powered/sit-stand or caster bases, wood-capped/wood legs, cast-iron/aluminium/stainless variants, bought finished-part repacking, raw-steel/waxed/liquid-painted/electroplated/PVD/acid-blackened or UV-only finishes, onsite primary steel/tube/powder manufacture, customer tabletop fitting, use and end of life. An upstream supplier-completed weld, coating or included component remains wholly inside its provider gate; never recreate that work onsite. A different principal material, terminal or finishing route needs a fresh applicability assessment."
  required_metadata: "controlled leg model/drawing/BOM and complete part/paired-shipment distinction; integral mounting plate and actual holes/slots/joints with interface specification; tube weld seam route and actual steel grades/surface state/dimensions without assumed thickness; complete supplied insert/leveling foot/pad/fastener scope and disjoint make-buy ownership; actual filler and separately supplied shielding gases versus whole premix; whole cleaning/cutting-fluid/powder formulation and concentration/SDS with carrier-water subaccounts; actual surface preparation powder recovery cure state and permission for postwork; manufacturer/spec dimensional joint finish and functional acceptance tests and disposition; calibrated same-configuration complete net M and first-release Q excluding transport packaging; all raw/WIP/unassigned stores and per-exchange inherited burden vectors; released FG genealogy original Q_c and actual storage/dispatch/return horizon H; every packaging P/I/ER/gross S/EO/W and empty/attached/reusable wet stocks with one upstream owner; physical assets installed fluids maintenance new/old parts and measured causal service; site period geography electricity interface and actual gas/steam/heat carrier states; gross mass relevant elements real molecular species and independent water-phase evidence; allocation residual price gate/time/state and all unresolved identities/providers"
  required_quality_disclosure: "All gaps, actual measurements and boundary/time/geography, native restrictions, assignment/gross separation, real holds and check scope"
  update_trigger: "Changed material/supply state, complete BOM, route/cure, function/test gate, native restriction, provider or allocation evidence"
data_sources:
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "CPC3.0 30 June 2025 page188: nonwood parts and HS9401.99/9403.99; scope only, no manufacturing/coverage approval."
  - id: "metaco-table-leg-route"
    type: "extension_guidance"
    reference: "https://metacoind.com/table-leg-production-case-show"
    used_for: "Manufacturer whole tube-leg route, quality checkpoints and paired bubble/carton packing; example dimensions are not defaults."
  - id: "semiexact-furniture-manufacturing"
    type: "extension_guidance"
    reference: "https://mfg.semiexact.com/industries/furniture"
    used_for: "Independent steel furniture component cutting/forming/welding/coating capability; no recipe or LCA factor."
  - id: "econ-steel-leg-process"
    type: "extension_guidance"
    reference: "https://econtablelegs.com/how-our-metal-table-legs-are-made/"
    used_for: "Actual made-to-order leg design/cutting/layout/welding/grind/cleaning; raw/stainless/liquid/blackened finishes are counterexamples, no time or heat default."
  - id: "gelan-leg-manufacture"
    type: "extension_guidance"
    reference: "https://www.gelanfurnitureleg.com/metal-table-legs-round-metal-table-legs-product/"
    used_for: "Independent round metal-leg manufacturing, powder coating, mounting and inspection context; no thermal-cure or oven statement. Other geometries, finishes, materials, tests and dimensions are not universal."
  - id: "semiexact-steel-leg-product"
    type: "extension_guidance"
    reference: "https://semiexact.com/products/3-x-1-tube-steel-legs-clear-coat"
    used_for: "Independently supplied tube-leg terminal with mounting plate/insert, optional feet and excluded casters/raw finish; user installation is downstream."
  - id: "jrc-ilcd-attributional-2010"
    type: "official_guidance"
    reference: "https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "First edition March2010 sections7.9.2–7.9.3 pages255–272: attributional subdivision, determining physical causality, then actual residual market value. No stock equation, plant allocation share, process recipe, yield or emission factor is claimed from it."
  - id: "semiexact-powder-cure"
    type: "extension_guidance"
    reference: "https://mfg.semiexact.com/capabilities/powder-coating"
    used_for: "Independent first-party process capability: electrostatic powder deposition and oven cure, with actual cure conditions determined from powder supplier and foreground records; example temperature/time, phosphatizing alternative, weatherability and cost claims are not defaults or proof for another source SKU/plant."
