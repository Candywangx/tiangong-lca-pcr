system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Read the complete scope, qualifiers, real operating conditions and inherited quantities with every rule; unobserved does not mean absent."
      source_ids: []
    - rule_id: b_whole
      applies_to: "manufacture"
      rule: "Start with real received tube/plate and actual supplied articles/preparations, and include all real fabrication, specified forming/drilling, welding, preparation, spraying/reclaim, thermal cure, fitting, inspection, abatement and toll work until one complete part first passes its controlled specification. Include every failed/rejected/sample/zero-output/start-stop/idle/cleanup/rework run with its real flows and treatment. Actual extra material, fuel, package, maintenance item, waste or species requires its own specific atomic card before dataset completion; never hide it in zero or other."
      source_ids:
        - metaco-table-leg-route
        - econ-steel-leg-process
        - gelan-leg-manufacture
        - semiexact-powder-cure
    - rule_id: b_release
      applies_to: "released_part"
      rule: "Q is the sum of calibrated net complete-part masses uniquely first quality-released in one declared homogeneous manufacturing cohort. Closing FG from that cohort is already in Q; do not add it as another output or subtract its manufacturing vector. Manufacturing B_close is only raw/WIP and genuinely unused/unassigned non-WIP stores/charges, each with its full inherited exchange vector. Internal released-product handover is matched and cancelled when gates combine, never a second external purchase or Q."
      source_ids:
        - metaco-table-leg-route
    - rule_id: b_supplies
      applies_to: "all processes"
      rule: "A whole purchased article/preparation includes its complete upstream material/formulation/manufacturing gate once. Actual onsite compounding instead requires each separate bought substance, water, real energy and loss. Assay fractions and contained/carrier water are subaccounts, not extra procurement. Supplier-included packaging ingress remains actual gross material with one upstream owner. Verify actual article, grade, route, geography, physical state, provider boundary and native property; purchase of finished legs cannot stand in for this manufacturing route."
      source_ids:
        - semiexact-furniture-manufacturing
        - semiexact-steel-leg-product
    - rule_id: b_service
      applies_to: "services"
      rule: "Retain complete FG opening/closing histories, original first-release Q_c, gross shipment G, actual external returns R with original shipment identity, and observed service horizon H. Storage/packing/handling/dispatch and real work have only incremental original-cohort burdens. Performed service remains with that cohort even if FG stays in storage; only unused/unassigned service/charge carries forward. Delivery, inspection, return and postwork create no new manufacture. Net delivery is outside this denominator and needs a separate coherent historical-burden and G/R/original-delivery-reversal D_rev method."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: b_permission
      applies_to: "services"
      rule: "Manufacturer/spec permission for the actual configuration, compatible work/parts, postwork tests, acceptance and disposition determine continued qualification of a worked part. They are never a gate for deleting already occurred unauthorized, failed or unsafe work, which retains full flows, burdens and original-cohort hold/waste disposition. Never assume broken parts recover qualification. Ordinary environmental humidity uptake/loss is measured without fictitious repair permission."
      source_ids:
        - semiexact-steel-leg-product
    - rule_id: b_gross
      applies_to: "all physical events"
      rule: "For each separately identified packaging material or whole article, O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O and C include complete wet empty, attached-WIP, attached-FG and reusable stocks. P and I are mutually exclusive for the same ingress event. F_in/F_out are independently measured real additions/removals from repair or ordinary material/water exchange, with event identity, phase and destination; never residual-fitting quantities. X_in/X_out removes only the exact same event/material amount proven duplicated in another actual OTHER flow on the same input/output side. It never removes a stock, the opposite side, a merely present card, or genuine influx retained in C. Use complete wet articles or one mutually exclusive component bridge; internal transfers and reuse cancel once. W is each material origin departure: a genuinely segregated external waste outlet is its own full gross card; an actual co-collected outlet uses one pkg_mixed_waste total with independently measured disjoint origin_W subaccounts and one receiver/treatment provider. Those origin subaccounts are not additional exported wastes or treatment quantities. Unknown composition remains unresolved; no mixed outlet is invented. Every physical gross V is independent of upstream/service/treatment burden ownership and allocation, which is assigned once separately."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: b_species
      applies_to: "manufacture; services; combined gate"
      rule: "Close total wet physical mass and all relevant Fe/C/H/O/N and actual alloy/coating elements independently of real species and reaction evidence. Keep free/carrier/adsorbed/structural/reaction water, liquid/vapour changes, condensate and heat-transfer returns distinct. No prescribed powder reaction, stoichiometry, CO2 absorption or water loss. A single residual cannot fit two unknowns. NOx, VOC, COD, PM or total metal is not a molecule; actual extra species needs a named card. Air/whole-gas supplies and constituent subaccounts, fuel carrier mass/heat and steam mass/enthalpy are disjoint, not additive duplicate providers."
      source_ids:
        - metaco-table-leg-route
        - jrc-ilcd-attributional-2010
    - rule_id: b_assets
      applies_to: "assets"
      rule: "Physical machinery/tools, actual new/old maintenance parts and installed oil/water/other fluid stocks remain separate from measured fulfilled period/cohort equipment-service burdens. Retain complete real incoming/outgoing wet mass including additions left installed at closing. Use actual utilization, load and causality without a fixed service life, per-part equipment mass, default replacement rate or double stock correction. Any actual unlisted repair chemical, refrigerant or fluid becomes its own card with full state and destination."
      source_ids:
        - jrc-ilcd-attributional-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-attributional-2010
