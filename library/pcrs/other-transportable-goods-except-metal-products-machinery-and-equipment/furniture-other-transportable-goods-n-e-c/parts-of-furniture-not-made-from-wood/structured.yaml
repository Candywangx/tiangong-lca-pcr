    - id: calc_service
      applies_to: "services; assets"
      rule: "Keep original Q_c and actual observation horizon H. Service A_i is only actual incremental performed service assigned to that cohort, including all real failed/unauthorized work and disposal. Performed service is not deducted for closing FG; carry only unused/unassigned service or charge. Physical asset/part/fluid events retain complete V separately from actual causal equipment-service burden. Trace real returns to original delivery and changed moisture/removed parts; never assume R equals original-delivery reversal or create Q again."
