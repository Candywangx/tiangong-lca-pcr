allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following is attributional methodology; industrial manufacturing sources supply no allocation fractions. Complete gross flows and burden vectors remain distinct."
    source_ids: []
  - rule_id: a_framework
    applies_to: "burden dimensions"
    rule: "This method is only for attributional manufacturing cases where allocation is required, not an unrestricted choice between substitution, physical and economic allocation. First use dedicated records and feasible real/virtual subdivision for each actual material, operation and service, including their consequences. Industrial route documents do not establish an allocation factor."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: a_causal
    applies_to: "genuinely shared exchanges"
    rule: "Then establish the determining physical causal relationship for each remaining exchange separately, supported by actual load, operation geometry/time, heat duty, capacity or other measured determinant as relevant. Material embodiment is assigned to its actual recipient; no common convenient kg/item/hour key automatically applies to all other flows. Document totals, shares, driver evidence and uncertainty."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: a_residual
    applies_to: "true common-process residual"
    rule: "Only a genuine common-process residual left after subdivision and exchange-specific determining physical causality may use actual contemporaneous market values of every real cofunction in its actual quality/state at the same process gate. Reconstruct the common gate by removing downstream finish/transport/packaging value consistently. No fixed fractions or later retail-price shortcut; absent causal/value evidence remains unresolved, with sensitivity retained."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: a_failures
    applies_to: "manufacture; treatment; services"
    rule: "Ordinary scrap, failure, samples, rejects and waste retain their causative manufacturing/service and actual treatment burdens even when sold or externally transferred. They are not automatic T_other, avoided-product/energy credit or a deduction from Q. One burden-vector transfer requires a real independent other cohort/function, justified allocation/handover and matching receiving vector; all physical gross legs stay full. At Q=0 retain actual loads and report no per-unit result."
    source_ids:
      - jrc-ilcd-attributional-2010
  - rule_id: a_gross
    applies_to: "packaging; physical asset/water/species ledgers"
    rule: "Gross disclosure uses complete actual V, never an allocated burden vector or B_open+U-B_close. No economic/causal fraction scales its physical quantity and no repeated procurement/provider is generated by ER/S/EO/W or asset custody. Attribute each real owned upstream/treatment/service burden dimension once separately; retain already performed service with its original Q_c despite closing FG."
    source_ids:
      - jrc-ilcd-attributional-2010
