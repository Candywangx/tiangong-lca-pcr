  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert raw extensive amounts to each native row unit once; kWh x 3.6 = MJ. Integrate only actual rates over measured duration; never multiply already integrated volumes by time. Any volume-to-mass needs the same substance at independently measured actual temperature/pressure/moisture/composition. Actual geometry is measured or traceable drawing-specific; LxW or LxWxT only for proven rectangles/rectangular solids, no bounding boxes or secondary-property density."
      inputs:
        - raw_amount
        - raw_unit
        - measured_state
        - actual_rate_duration
        - independent_conversion
      output: "converted undivided raw numerator"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_history
      applies_to: "manufacturing burden dimensions"
      rule: "A_i is B_open + U - B_close - T_other after actual unit conversion and justified allocation for that exchange. B_close is unreleased raw/WIP plus genuinely unused/unassigned stores/charges only, never already first-released FG. U includes failures/samples/idle/startstop/cleanup/rework and ordinary waste/treatment. T_other needs a real independent other cohort/function and justified once-only handover/allocation, not sale or disposal alone. Do not subtract stock-corrected consumption twice; this burden vector never replaces a gross V."
      inputs:
        - B_open
        - U
        - B_close
        - T_other
        - inherited_vector
        - allocation_evidence
      output: "assigned manufacturing exchange numerator"
      source_ids:
        - jrc-ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all physical gates"
      rule: "Reconcile manufacturing opening raw/WIP/installed stocks plus complete external influx against closing unreleased/installed stocks, internal first-release Q, all actual waste/species and external returns. FG services reconcile opening released FG plus internal Q plus actual external part returns and real service/material/water/package influx against full closing FG, gross shipments, external returns sent, waste and species. Combined gate cancels internal Q and every matched internal leg exactly once. Close wet mass, relevant elements, water phases, assets and each package independently; do not fit two unknowns with one residual."
