    - id: calc_packaging
      applies_to: "packaging"
      rule: "For each separately identified packaging material or whole article, O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O and C include complete wet empty, attached-WIP, attached-FG and reusable stocks. P and I are mutually exclusive for the same ingress event. F_in/F_out are independently measured real additions/removals from repair or ordinary material/water exchange, with event identity, phase and destination; never residual-fitting quantities. X_in/X_out removes only the exact same event/material amount proven duplicated in another actual OTHER flow on the same input/output side. It never removes a stock, the opposite side, a merely present card, or genuine influx retained in C. Use complete wet articles or one mutually exclusive component bridge; internal transfers and reuse cancel once. W is each material origin departure: a genuinely segregated external waste outlet is its own full gross card; an actual co-collected outlet uses one pkg_mixed_waste total with independently measured disjoint origin_W subaccounts and one receiver/treatment provider. Those origin subaccounts are not additional exported wastes or treatment quantities. Unknown composition remains unresolved; no mixed outlet is invented. Every physical gross V is independent of upstream/service/treatment burden ownership and allocation, which is assigned once separately."
      inputs:
        - cp_pkg_carton_p
        - cp_pkg_carton_i
        - cp_pkg_carton_er
