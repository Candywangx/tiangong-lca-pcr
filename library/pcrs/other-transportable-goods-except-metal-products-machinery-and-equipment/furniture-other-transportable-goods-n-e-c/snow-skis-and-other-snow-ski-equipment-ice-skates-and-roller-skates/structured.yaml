allocation_rules:
  - rule_id: a_hierarchy
    applies_to: "each attributable exchange"
    rule: "Use attributional modelling where allocation is required. First separate dedicated operations or virtual subdivision and embodied components. For remaining each exchange demonstrate its determining physical causal relationship and actual driver; generic mass share, press-pair count or economic share is not automatic. Only genuinely unresolved residual common-process flows use justified contemporaneous market values at the real common process gate and actual exit state. Document price period, quantities, all cofunctions and conservation. No fixed percentages or substitution credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_waste
    applies_to: "failures samples residues and treatment"
    rule: "Ordinary manufacturing waste, rejects, samples, sale or off-site treatment does not remove manufacturing or actual treatment load. A burden transfer requires a real independent other cohort/function, justified allocation/handover and exactly one vector transfer. Full gross physical legs remain unchanged. Treatment of one real mixed outlet has one provider owner; disjoint source pools are not additional total/provider claims."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: a_service
    applies_to: "assets packaging and observed H"
    rule: "Use actual fulfilled service with the original cohort and causal duration/intensity. Physical asset/new/used part/fluid custody and full wet stocks are separate from capital/repair/service burdens; no assumed life or per-kg whole machine. Only unused/unassigned service/charge carries to closing, not service already performed for retained FG. Postrelease work requires manufacturer/spec permission and actual posttests/acceptance/disposition for continuing conformity; failure never deletes actual loads."
    source_ids:
      - ilcd-attributional-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "finish"
      flow_role: "finished_ski"
      record_type: "calibrated first-release record"
      raw_fields: "serial; model; complete_configuration; net_mass; gross_mass; tare; moisture; calibration; actual_spec; cure_record; base_edge_bevel_wax_checks; first_release_id; Q; original_Q_H; H"
      collection_method: "Calibrated net weighing of each complete unbound ski after actual finishing, exclude packaging and bindings; verify unique first release and actual specification acceptance. Q includes first-released closing FG once; unknown mass is not invented."
      unit: "kg"
      frequency: "each actual event/lot and meter interval"
      temporal_coverage: "full opening history through cohort and observed H"
      site_scope: "actual gate configuration and provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Raw evidence; calibration; actual identity/specification; full per-flow vector and wet stock bridge; uncertainty and disposition; aggregation reuses the sole calc_quotient result without dividing raw records"
