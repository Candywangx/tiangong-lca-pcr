system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "whole manufacture"
      rule: "Include preparation, layup/mixing, electric cure, finishing/inspection/wax, actual failed lots, zero-output operation, startup/shutdown, idle, cleaning, samples and rework. No assumed steam boiler, fuel, compressed-gas purchase or curing coefficient; add any real extra atomic input/output before numerical use."
      source_ids:
        - wagner-core
        - wagner-press
        - wagner-finish
    - rule_id: b_cohort
      applies_to: "stocks and gates"
      rule: "Each exchange has opening raw/WIP/non-WIP unassigned burden vectors and physical stocks, current addition and complete closing states. Manufacturing closing burden excludes already first-released FG; its historical manufacturing stays with original Q. Already-net consumption is never stock-corrected again. Product-gate transfers cancel only matched internal legs. Gross mass never shrinks by burden/economic share."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_service
      applies_to: "postrelease and dispatch"
      rule: "Retain actual storage, packaging, handling and shipment increments over observed H under original Q_H, including held FG. Mere delivery/retest does not make new Q; do not use net-delivery denominator. A future net-delivery study requires full opening/closing FG burden, gross G/R, actual original-delivery reversal and incremental rework bridge, without assuming returned mass equals original delivery."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_physical
      applies_to: "all gross stocks and species"
      rule: "Independently close wet mass, relevant elements, carbon origins and actual chemical/free/phase water at manufacture, FG-service and consolidated gates. All constituents, provider activity and carrier water count once. Record natural adsorption/desorption as well as actual added/removed repair water. No closure residual may fit two unknowns; VOC/NOx/COD/total dust are indicators, not invented molecules."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: b_pack
      applies_to: "packaging and assets"
      rule: "For each real packaging pool separately trace P + I + ER = C + gross S + EO + W with six event cards, full wet empty/attached WIP/FG/reusable stocks, supplier-included influx and one burden owner. Repair/water X_in/X_out removes only another same-side in/out overlap, never real retained influx or full closing mass. Whole wet article and separately added component bridge must be disjoint. Internal reuse cancels; packaging is excluded from ski Q."
      source_ids:
        - ilcd-attributional-2010
