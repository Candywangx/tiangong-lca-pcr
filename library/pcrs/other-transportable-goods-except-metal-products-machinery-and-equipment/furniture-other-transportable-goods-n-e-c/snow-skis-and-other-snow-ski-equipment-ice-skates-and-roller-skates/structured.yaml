  calculation_rules:
    - id: calc_q
      applies_to: "finished_ski"
      rule: "Q = sum of actual net masses of unique complete skis first quality-released in the cohort; first-released closing FG is included once, not a second product."
      inputs:
        - net_individual_masses
        - unique_release_ids
        - cp_release
      output: "Q"
      source_ids:
        - wagner-finish
        - wagner-custom
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert raw numerator quantities to their actual native extensive units before attribution, with original rate/integral and measured density/thermal state retained. 1 kWh = 3.6 MJ once; no gas/liquid integral multiplied by time. Store full gross V and physical stocks independently of load vectors."
      inputs:
        - raw_records
        - cp_utilities_prep
        - cp_utilities_laminate
        - cp_utilities_finish
        - cp_utilities_service
        - cp_physical_finish
        - cp_physical_service
        - cp_physical_assets
      output: "converted_raw"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_attribution
      applies_to: "maple_core_blank; base_sheet; sidewall_strip; steel_edge; glass_cloth; epoxy_a; hardener_b; nylon_topsheet; rubber_damping; soft_wax; running_wax; carbide_wear; saw_blade; abrasive_belt; grinding_stone; gummy_stone; diamond_stone; roto_brush; prep_electricity; prep_water; laminate_electricity; laminate_water; finish_electricity; finish_water; cleaner; coolant; core_shavings_treatment; uncured_resin_treatment; trim_waste_treatment; grinding_sludge_treatment; process_wastewater_treatment; rejected_ski_treatment; spent_abrasive_treatment"
      rule: "For each manufacturing load dimension, A_m_i = B_open_i + U_i - B_close_raw_WIP_unassigned_i - T_other_i after real conversion, dedicated subdivision, exchange-specific determining physical causality and only justified residual allocation. B_close excludes already first-released FG. Each historical vector and non-WIP unassigned store is explicit. Already stock-corrected U is not corrected again. T_other requires true other cohort/function and one justified handover; ordinary failures/waste/sales/treatment do not qualify automatically."
      inputs:
        - converted_raw
        - each_inherited_vector
        - raw_WIP_unassigned_stocks
        - actual_handover_decision
      output: "A_m_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "service_electricity; service_water; carton_charge; film_charge; pallet_charge; press_service; cassette_service; airbag_service; repair_plank_service; repair_nail_service; hydraulic_fill_service; grease_service; filter_service; carton_w_treatment; film_w_treatment; pallet_w_treatment; mixed_packaging_waste_treatment; press_removed_treatment; cassette_removed_treatment; airbag_removed_treatment; repair_plank_removed_treatment; repair_nail_removed_treatment; hydraulic_fill_removed_treatment; grease_removed_treatment; filter_removed_treatment; assets_water_out_treatment"
      rule: "For original cohort Q_H and observed H (Q_H equals manufacturing Q for service performed within that manufacturing cohort), A_h_i retains actual fulfilled storage/handling/packaging/asset/treatment/postwork increments and assigned unused opening charge; subtract only genuinely unused/unassigned closing service/charge and justified one-time true other-function transfer. Do not subtract performed service because FG is held. Historical manufacturing is not repurchased. Physical gross V is separate."
      inputs:
        - actual_service_records
        - original_Q_H
        - H
        - one_owner_vectors
        - unused_charge
      output: "A_h_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "x_i = N_i / Q_c once only. N_i is A_m_i for a manufacturing-load dimension, A_h_i for actual service load, or FULL actual gross leg V_i for physical-only disclosure. Q_c is manufacturing Q or original Q_H for that observed service/custody cohort. Never replace V_i with B_open+U-B_close or an economic share. Physical V creates no new procurement/provider/credit or new Q. Q_c=0 retains numerators and stocks without a unit result. Cards and aggregation reference the same x_i without further division."
      inputs:
        - A_m_i
        - A_h_i
        - full_gross_V_i
        - Q
        - original_Q_H
        - cp_release
      output: "x_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "For each manufacture/FG-service/consolidated gate independently reconcile full wet opening + actual gross external inflows = full wet closing + actual gross external outflows. Related element/carbon/chemical/free/phase-water constraints are independent. Packaging per pool P+I+ER=C+S+EO+W; internal reuse cancels. X_in/X_out only removes a duplicate OTHER same-side inflow/outflow term, never real retained influx or full wet closing mass. Whole article/independent additions/source-W pools are disjoint; only matched internal product handoffs cancel."
      inputs:
        - full_wet_stocks
        - full_gross_V_i
        - independent_species_constraints
        - disjoint_component_overlap_bridge
      output: "closure_findings"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Actual whole supplied material/article identity and all native CAS/material/form/phase/grade/route/geography/medium/type restrictions must agree. Official Chinese displays match each selected UUID; blank UUID is never zero or a collection flow."
      evidence: "Supplier BOM/specification and native originals"
    - id: dq_raw
      applies_to: "all raw records and Q"
      requirement: "Keep calibration, original units, moisture/thermal/density state, full event/stock/vector bridge, uncertainty and raw failures. Future site quantities remain collection requirements, never measured claims."
      evidence: "Raw weighing meter and batch logs"
    - id: dq_scope
      applies_to: "all sources and gates"
      requirement: "Complete primary context and contrary routes are retained. Qualitative technical synthesis is distinct from a measured factory BOM; auxiliary/provider gaps block dependent numerical use, while true missing core identity or route holds usable methodology."
      evidence: "Full sources and declared applicability"
    - id: dq_service
      applies_to: "assets packaging actual postwork"
      requirement: "Permission/tests/acceptance determine continuing conformity but never erase occurred failed or unauthorized flows/loads. Natural humidity exchange needs no invented repair permission. One mixed outlet has one total/provider; full six physical packaging legs remain atomic."
      evidence: "True service custody and disposition records"
validation_rules:
  - rule_id: v_terminal
    applies_to: "reference and first release"
    rule: "Require the complete declared unbound alpine-ski terminal and actual approved structure/supply states; no core/base/blank/footwear or wrong snowboard route substitutes. A verified physically compatible broad manufactured family can be narrowed with positive primary evidence; name/CPC/SKU similarity cannot override hard native conflicts. Core identity gaps are true holds; ordinary auxiliary/provider/measurement gaps are separately explicit."
    source_ids:
      - wagner-custom
      - wagner-materials
      - wagner-finish
  - rule_id: v_normalize
    applies_to: "every card and raw field"
    rule: "Check raw unit/rate conversion and real attribution before the sole x_i=N_i/Q_c. For gross cards N_i is FULL actual V_i, never stock-adjusted use, burden vector or economic fraction; its disclosure creates no second purchase/provider/credit. Q includes closing first-released FG once. Services retain original Q_H and actual H. Q0 keeps actual loads without unit results."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_balance
    applies_to: "physical and burden gates"
    rule: "Independently verify wet mass/elements/carbon/water/species, inherited raw/WIP/non-WIP vectors, FG histories, full packaging six legs, asset/new-used part/fluid custody and one mixed outlet/provider. Preserve retained real influx and full wet closing mass together; stock-corrected use is not corrected twice."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: v_truth
    applies_to: "projection native context and review"
    rule: "Check every source id/type/reference/use, rule source_ids, native reference-property/group/unit, all card fields/descriptions/qualifiers and normative ancestor context. Schema/current fingerprints/finite measurement checks do not prove scientific/translation approval, factory quantities, accepted mapping, whole classification coverage or publication. Real unsupported relationships remain review-required."
    source_ids:
      - ilcd-attributional-2010
      - wagner-press
      - wagner-finish
published_dataset_profile:
  dataset_role: "Foreground manufacture methodology; actual documented completed packages only"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching complete unbound wood-core glass/epoxy alpine-ski manufacture under first-release Q with separately observed original-cohort service H"
  excluded_use: "Whole CPC38410 coverage, different structures/routes, parts/sets/use-life, assumed factory coefficients, certification and unreviewed numerical defaults"
  required_metadata: "one complete unbound alpine ski and unique serial/cohort; laminated sugar-maple core supply and actual moisture; dry woven glass and actual whole resin/hardener preparations; sintered UHMWPE base and actual P-tex sidewall state; hardened steel edge profile and supplied component boundary; actual decorated nylon topsheet and conditional rubber strip; actual shape/camber/rocker and approved material configuration; actual cure/base/edge/bevel/wax release records; measured net individual ski mass with calibration and no bindings/packaging; first-release Q and all raw/WIP per-exchange inherited vectors; original released-FG cohort Q_H and actual observed horizon H; actual supplier geography/period and native flow restrictions; complete gross packaging six-leg and asset/part/fluid custody; independent wet mass/carbon/element/water/species evidence"
  required_quality_disclosure: "Actual source scope, technical synthesis versus measured factory records, every dependent identity/provider/quantity gap, full raw-vector/gross-stock completeness and uncertainty"
  update_trigger: "Changed product/supply/epoxy/laminate/cure/finish/gate/native identity, new evidence, observed omission or substantive review"
