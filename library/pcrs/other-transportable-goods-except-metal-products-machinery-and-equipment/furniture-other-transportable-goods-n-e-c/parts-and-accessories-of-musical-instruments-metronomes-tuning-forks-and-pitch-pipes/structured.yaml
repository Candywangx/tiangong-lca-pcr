      applies_to: "actual postrelease work"
      rule: "Record actual manufacturer/spec permission, posttests, acceptance/hold and final disposition for real postrelease work; do not assume damaged parts are repairable. These gates govern authorized work and continued conformity, not whether already performed material/energy/water/losses exist. Failed, unpermitted or nonconforming work retains original-cohort burden and actual hold/waste disposition. Passive environmental humidity exchange does not require a fictional repair permission."
