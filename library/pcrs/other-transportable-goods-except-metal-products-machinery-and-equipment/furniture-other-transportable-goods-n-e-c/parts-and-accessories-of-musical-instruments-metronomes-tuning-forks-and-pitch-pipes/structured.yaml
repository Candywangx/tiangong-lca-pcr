  calculation_rules:
    - id: calc_first_release
      applies_to: "finished_metronome"
      rule: "Q = sum of independently weighed net masses of newly first-released complete instruments; retain first-released closing FG in Q; keep actual rejected/held serials outside new output until real first acceptance."
      inputs:
        - cp_release
      output: "Q"
      source_ids: []
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "Convert each undivided raw observation into its row native extensive unit before attribution; use the exact electricity-group factor 3.6 MJ/kWh. Integrate only a true rate over its actual interval; preserve already integrated quantities. Independently measured same-substance state/density is required when volume and mass are bridged."
      inputs:
        - raw_quantity
        - original_unit
        - actual_state
        - independent_density
        - cp_energy
        - cp_water
        - cp_moisture
      output: "U_native"
      source_ids: []
    - id: calc_manufacture_vector
      applies_to: "all burden rows in manufacture"
      rule: "A_m = Bopen_m + U_m - Bclose_m - Tother_m; each symbol is one raw exchange-vector dimension after conversion and supported attribution. Bclose_m is raw/WIP or unassigned non-WIP/unused charge only; already released closing FG is excluded. If a recorded consumption is already net of stock use its reconciled attributable vector directly, without a second stock correction. Tother_m requires a real distinct cohort/function and legitimate once-only burden transfer; ordinary waste/sales/rejects/samples and treatment remain with manufacturing."
      inputs:
        - Bopen_m
        - U_m
        - Bclose_m
        - Tother_m
        - cp_components
        - cp_water
      output: "A_m"
      source_ids:
        - ilcd-allocation
    - id: calc_service_vector
      applies_to: "all burden rows in handling packaging assets"
      rule: "A_cH is actual performed incremental burden assigned to original cohort c over observed H plus legitimately used inherited charge; carry forward only unused/unassigned charge. Do not subtract performed service for held/closing FG. Preserve original Q_c and all actual failed/unpermitted work; no manufactured output is created. Assign each asset/service burden dimension once using the justified hierarchy; do not apply it to gross physical legs."
      inputs:
        - actual_performed_burden
        - inherited_used_charge
        - unused_charge
        - Q_c
        - H
        - cp_service
        - cp_packaging
        - cp_assets
      output: "A_cH"
      source_ids:
        - ilcd-allocation
    - id: calc_gross_event
      applies_to: "all gross physical cards"
      rule: "A_V = V_leg_actual_full; preserve the actual complete directional gross event in its own native unit and wet/phase state. No Bopen+U-Bclose substitution, economic share, procurement, supplier burden, credit or second production. The genuine burden dimension has one independent owner. Physical stock equations are reconciliations, not corrections to V."
      inputs:
        - V_leg_actual_full
        - cp_service
        - cp_packaging
        - cp_asset_gross
        - cp_moisture
        - cp_waste
      output: "A_V"
      source_ids: []
    - id: calc_single_quotient
      applies_to: "all inventory rows"
      rule: "a_row = A_row / Q_star exactly once for positive Q_star; A_row is A_m for manufacturing burden, A_cH for original-cohort service burden, and actual full V for gross disclosure. Q_star is manufacturing Q or original cohort Q_c as explicitly attached to that row/event; each is the same 1 kg reference mass convention. Reference output is exactly 1 kg. Q_star=0 retains all actual loads/stocks and yields no per-unit result. Cards and aggregation only reference this quotient; collection never divides."
      inputs:
        - A_row
        - Q_star
        - cp_release
        - cp_service
        - cp_packaging
        - cp_assets
      output: "a_row"
      source_ids: []
    - id: calc_pack_balance
      applies_to: "each actual carton and PE-film pool"
      rule: "Opening_full_wet + P + I + ER + real_H2O_in + other_disjoint_in - X_in = Closing_full_wet + gross_S + EO + Wraw + real_H2O_out + other_disjoint_out - X_out. Opening/closing include empty, WIP-attached, FG-attached and reusable states. Whole P/I already includes its supplied components/water once; disjoint bridges prevent overlap. X removes OTHER same-side duplicate flow terms only, never a retained real influx or full closing stock. Internal reuse cancels. Wraw in one mixed container is a source subledger, not an added external exchange."
      inputs:
        - Opening_full_wet
        - P
        - I
        - ER
        - gross_S
        - EO
        - Wraw
        - Closing_full_wet
        - real_H2O_in
        - real_H2O_out
        - X_in
        - X_out
        - cp_packaging
      output: "package_pool_residual"
      source_ids: []
    - id: calc_physical_gates
      applies_to: "manufacture handling packaging assets"
      rule: "Independently reconcile full actual incoming and outgoing masses and complete wet opening/closing stocks at each physical gate, with actual elemental/species balances where relevant. Preserve original Q/FG cohort bridge, G/R changes, real additions/removals and passive moisture; cancel paired internal handoffs only in the combined gate. Do not multiply gross legs by burden shares or fit two unknowns to one residual. Heat energy and carrier mass are independent; any real external return water has its own Product leg."
      inputs:
        - raw_gross_masses
        - wet_opening_stock
        - wet_closing_stock
        - Q
        - G
        - R
        - real_species_measurements
        - cp_components
        - cp_service
        - cp_packaging
        - cp_asset_gross
      output: "gate_residuals"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Retain exact physical identity, supply completeness, all native property/media/CAS/route/form/geography restrictions and official Chinese basename where present; core output must be a compatible complete metronome. Identity does not approve provider quality or copy quantitative coefficients."
      evidence: "complete native identity and primary product/BOM evidence"
    - id: dq_measurement
      applies_to: "all collected records"
      requirement: "No invented mass, density, spring material, gear tolerance, tempo range, precision, calibration threshold, life, recipe, output or generic loss percentage. Preserve calibration, state, uncertainty, independent raw observations and original units."
      evidence: "actual scales/timers/meters and raw specifications"
    - id: dq_completeness
      applies_to: "all real gates"
      requirement: "Retain actual failures/zero-output/startup/idle/cleanup/rework and all inherited raw/WIP/non-WIP vectors. Add each truly present unlisted input/output as a specific atomic card before claiming complete data; missing observations remain unknown rather than zero or other."
      evidence: "reconciliation of all activity and physical/burden ledgers"
    - id: dq_single_owner
      applies_to: "whole supplied articles and gross cards"
      requirement: "Keep one upstream owner per whole supplied works/article/formulation, and one treatment owner per real waste outlet. Gross disclosure cards cannot be imported as supplier-backed purchases or credits; preserve description and cohort dimension during consumption."
      evidence: "whole/component disjoint BOM and provider ownership bridge"
    - id: dq_service
      applies_to: "original cohort and observed H"
      requirement: "Retain original first-release mass/history and full current G/R configuration/water, actual postwork permission/tests/disposition and already performed service even for closing FG. Future horizon gaps remain explicit and cannot create new Q."
      evidence: "original release; custody; work/testing records; actual H"
    - id: dq_quality_scope
      applies_to: "source evidence and native families"
      requirement: "Manufacturer spare-parts/complete-product evidence supports the disclosed supply route; operating instructions support function/test setup only. The independent historical patent gives a factory-adjustment example, not proof of a current supplier design or universal threshold. Qualitative method synthesis supplies no measured factory quantity."
      evidence: "complete primary originals; source applicability and counterexamples"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_metronome"
    rule: "Require the compatible complete no-bell spring-driven plastic-cased instrument at first quality release, complete reference UUID and Mass/kg chain, explicit finished_metronome link and every required qualifier. A component, bare mechanism or electronic/clock/toy identity cannot close the reference gate."
    source_ids: []
  - rule_id: validate_calibration
    applies_to: "release records"
    rule: "Require an actual product specification, calibrated timing reference and raw observations including setting/level/state, repeatability/uncertainty, alternate half-cycle behaviour and actual acceptance/hold. A user manual or patent example does not establish manufacturer certification or numeric acceptance limits."
    source_ids:
      - wittner-manual
      - franz-metronome-patent
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Require matching raw collection and selected cohort, one positive Q_star for the single A/Q calculation, all finite measurement checks and complete bilingual agreement. No repeated division, guessed count-to-kg or Q=0 unit result. Gross cards must use complete V and have no new provider burden or credit."
    source_ids: []
  - rule_id: validate_stocks
    applies_to: "manufacture and service"
    rule: "Check every physical stock and inherited vector; manufacturing Bclose cannot include burden of already released FG, Q and closing FG are not two outputs, and stock-corrected records are not corrected again. Already performed original-cohort service cannot be removed because of held FG."
    source_ids: []
  - rule_id: validate_postwork
    applies_to: "actual real work"
    rule: "Check actual permission, posttests, acceptance/hold and disposition without erasing failed/unpermitted work quantities. Do not assume broken parts can recover; record real new/old parts and fluid/water flows. Passive environmental moisture has no invented repair permit."
    source_ids: []
  - rule_id: validate_packages
    applies_to: "each actual material pool"
    rule: "Check all six actual packaging directions with full empty/WIP/FG/reusable opening/closing states, whole P/I once, gross S, real H2O exchange and internal-reuse cancellation. Wraw joins a single mixed outlet without an extra duplicate W exchange; separate W cards require real separate outlets. X only deduplicates other same-side flow terms and cannot remove retained true influx/full closing wet mass."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "all real gates"
    rule: "Require independent full gross mass and relevant element/species balances across manufacturing, FG, packaging, assets and the combined gate. Whole supplied wet material and components must be disjoint; natural uptake/loss remains actual. No fabricated gas species from VOC/COD/elemental totals or a residual fitted to two unknowns; native extensive units stay distinct."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "each burden dimension"
    rule: "Check allocation need, exclusive/virtual subdivision, exchange-specific determining causality and only the true residual common-gate contemporaneous value evidence. Gross legs remain full; ordinary rejects/waste/sales/sample and treatment burdens cannot be deducted without a real other cohort/function and justified once-only transfer."
    source_ids:
      - ilcd-allocation
  - rule_id: validate_complete_context
    applies_to: "consumer data and unresolved identities"
    rule: "Consume every card description and the full normative chapter/ancestor context, not just UUID and amount. Core reference identity or terminal-method absence is a true hold; an unresolved auxiliary identity/provider or future site amount alone does not mean this complete methodology is missing. Concrete datasets with unresolved actual identities, unsupported conversions or missing core measurements remain incomplete; no guidance/engineering pass is scientific, translation, mapping or publication approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified complete mechanical-metronome manufacturing supply; actual original-cohort services as explicitly bounded supplements"
  allowed_use: "Actual matching no-bell plastic-cased spring instrument with verified provider/BOM and measured first-release data"
  excluded_use: "Unqualified comparative precision/lifetime claims; other instrument families; net-delivery production denominator; electronic/clock substitution; importing gross-disclosure rows as supplier purchases or credits"
  required_metadata: "All section3 qualifiers; site period; first-release mass; complete supply and installed component state; actual allocation; each row cohort/dimension; full normative context"
  required_quality_disclosure: "Actual unknowns and core versus auxiliary gaps; source-case limitations; provider compatibility; test calibration/uncertainty; stocks/failures; actual H and future horizon gaps; complete gross versus burden ledger bridge"
  update_trigger: "Different drive/bell/case/supply completeness; real onsite component fabrication; changed actual test or first-release gate; additional chemicals/emissions/thermal carriers; altered provider/native limitations or service horizon"
data_sources:
  - id: "wittner-parts"
    type: "handbook"
    reference: "https://wittner-gmbh.de/wittner_metronome_maelzel_spare_parts.html ; https://wittner-gmbh.de/pdf/ersatzteilliste.pdf"
    used_for: "Complete adjusted works and separate compatible cases/bottoms/covers/key/pendulum supply states; full four-page parts illustrations and adjacent incomplete-part counterexamples. This supports supplied-component assembly, not a measured contemporary factory/order or onsite gear/spring fabrication."
  - id: "wittner-plastic"
    type: "handbook"
    reference: "https://wittner-gmbh.de/wittner_metronome_maelzel_plastic_casing.html"
    used_for: "Actual complete plastic-cased mechanical battery-free products with/without bell; scope here chooses the no-bell subset only, without transferring unreported polymer grade or moulding process."
  - id: "wittner-manual"
    type: "handbook"
    reference: "https://wittner-gmbh.de/pdf/maelzel_gebrauchsanleitung.pdf"
    used_for: "Complete operating manual: musical beat function, winding key, horizontal placement, gentle start and movable weight/scale; informs test-condition collection only. Not a factory-manufacturing or calibration-threshold/certification source."
  - id: "franz-metronome-patent"
    type: "literature"
    reference: "US4012901A (1977-03-22), Damage-resistant mechanical metronome; https://patents.google.com/patent/US4012901A/en ; https://patentimages.storage.googleapis.com/69/ed/33/1c1b5dccc9749f/US4012901.pdf"
    used_for: "Complete patent description/claims and six figures: disclosed spring-driven escapement/pendulum construction and postassembly factory adjustment of alternating half-cycle asymmetry. Historical independent example only; no proof Wittner uses this design and no universal tolerance, material recipe or factory yield."
  - id: "ilcd-allocation"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA — Detailed guidance, first edition March 2010, sections7.9.1–7.9.3 (PDF275–288); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Qualitative attributional allocation context: subdivision/virtual subdivision, exchange-specific determining physical causality and true residual common-gate state-specific market value; QFD and incorrect-price-gate examples delimit use. No industrial manufacturing or numeric allocation evidence."
