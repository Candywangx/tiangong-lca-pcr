allocation_rules:
  - rule_id: allocation_scope
    applies_to: "attributional study"
    rule: "Apply this hierarchy only where the attributional goal and decision context require allocation. Separate multifunctional-process allocation from comparison of multifunctional products; no free substitution/allocation choice or QFD numerical share is adopted."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_subdivide
    applies_to: "each burden exchange"
    rule: "Assign dedicated components and stages first; use supported real or virtual subdivision before sharing. A complete supplied works/formulation carries its embodied components once, while a genuine separate component keeps its own owner and a paired internal handoff."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_causal
    applies_to: "remaining burden exchanges"
    rule: "For each still-shared exchange establish its determining physical causal relationship and measure the actual driver. Timing/test equipment burden may depend on measured occupation/capacity; a component input follows the instrument receiving it. Justify each exchange; a mass/time/count relation does not automatically govern all flows."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_residual
    applies_to: "true residual common process"
    rule: "Only a real unresolved residual after subdivision and determining causality uses contemporaneous market values for the actual quantity/quality/state at the same common process gate. Retain prices, period, currency and justified transport/conditioning adjustments; no fixed ratio, automatic credit or arbitrary physical/economic choice. Missing determining/value evidence remains unresolved."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_waste
    applies_to: "rejects samples waste and physical ledgers"
    rule: "Ordinary failed units, samples, manufacturing waste and their treatment burdens remain with their manufacturing cohort even when sold or exported. Transfer a vector once only for a real independent cohort/function and a justified allocation/handover. Every actual gross physical leg remains full and unscaled, and no waste sale creates a negative burden or avoided-production credit."
    source_ids:
      - ilcd-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first complete acceptance and mass"
      record_type: "test and calibrated weighing"
      raw_fields: "model; serial; full BOM; key and scale inclusion; spring-drive state; level and setup; actual tempo specification; timing instrument; calibration; measured beat intervals; alternate half-cycles; uncertainty; adjustment; pass or hold; prior release; net mass; moisture; packaging tare"
      collection_method: "Observe actual complete installed instrument against the real documented specification using a calibrated timing reference; record setup and independent repeated intervals and any permitted adjustment, uncertainty and disposition. Weigh accepted complete net configuration independently with a calibrated scale. Capture raw records only; no universal patent/manual threshold or catalogue mass."
      unit: "kg"
      frequency: "each first release and every failed/held test"
      temporal_coverage: "complete new-manufacturing cohort"
      site_scope: "actual complete configuration at first-release gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "timer/scale calibration; specification; raw intervals; signed acceptance and holds; full configuration"
    - protocol_id: cp_components
      process_id: "manufacture"
      flow_role: "individual supplied article/preparation"
      record_type: "purchase receiving issue and inherited-stock ledger"
      raw_fields: "row_id; lot; actual material and complete supply scope; gross V; original unit; all separate purchases; supplier included parts; opening raw; closing raw; opening WIP; closing WIP; non-WIP unassigned stores; every inherited exchange vector; losses; failures; startup; idle; cleanup; rework; internal handoff; legitimate other-cohort transfer; already stock-corrected flag"
      collection_method: "Reconcile complete works and case articles to actual supplier BOM and raw receipts/issues. Weigh each single article/preparation or traceably sampled matched lot; preserve both complete physical gross quantities and all inherited burden dimensions without division. Confirm no duplicate purchases for gears/spring/pendulum/oil within supplied works."
      unit: "actual native extensive unit"
      frequency: "every lot/event and opening/closing"
      temporal_coverage: "full production period and inherited pre-period history"
      site_scope: "actual suppliers and assembly site"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier BOM; receipts; stock count; scales; paired handoff; original vectors; failure logs"
    - protocol_id: cp_energy
