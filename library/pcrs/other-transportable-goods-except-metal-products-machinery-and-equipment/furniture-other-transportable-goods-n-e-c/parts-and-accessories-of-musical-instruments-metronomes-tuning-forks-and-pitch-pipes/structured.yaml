    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "single actual mixed outlet and actual separate liquid outlet"
      record_type: "container stock and disposal records"
      raw_fields: "row_id; unique outlet; whole wet container V; opening waste stock; closing waste stock; independently measured source Wraw; failed units; component samples; carton W; PE W; service residues; old fixture/screw; actual liquid composition; water/species tests; destination; treatment-provider owner; legitimate transfer justification"
      collection_method: "Weigh each actual outlet once. For one mixed container keep independently measured origin-pool Wraw and stock/composition subaccounts without adding them to its gross total; link actual treatment once. If genuine separate outlets exist retain separate specific cards/providers. No assumed wastewater or symmetrical gas/liquid outputs and no burden deduction simply for waste sale/disposal."
      unit: "kg for these actual whole-waste streams"
      frequency: "every waste stock/event and dispatch"
      temporal_coverage: "full matched production/service history"
      site_scope: "actual single external outlet with source pools retained"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated weights; source submetering; custody; composition; actual treatment tickets"
    - protocol_id: cp_service
      process_id: "handling"
      flow_role: "original-cohort actual service and gross FG events"
      record_type: "original release custody and postwork logs"
      raw_fields: "row_id; original serial; original Q_c; H start/end; opening FG physical/burden history; complete closing wet FG; G; R; actual added/removed key or component; actual water/material ingress/egress; permission status; posttests; acceptance/hold; failed/unpermitted work; disposition; raw incremental burden; unused/unassigned charge; each inherited vector; already stock-corrected flag"
      collection_method: "Trace every actual event to original release and complete net configuration. Weigh current gross G/R independently, including real wet/part differences; do not presume return mass equals original delivery or reverse manufacture. Capture all actual service and failed/unpermitted work raw; acceptance controls continued conformity, never erasure of performed flows. Retain already performed service with its cohort even for held FG."
      unit: "actual native extensive unit"
      frequency: "each custody/work event and H boundary"
      temporal_coverage: "original cohort history plus observed H only"
      site_scope: "actual custody/service gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "original acceptance; full BOM; current weights; permission/tests; dispositions; raw meters"
    - protocol_id: cp_packaging
      process_id: "packaging"
      flow_role: "each real material pool six legs and separate burden owner"
      record_type: "whole-article physical pool ledger"
      raw_fields: "row_id; actual folding carton or PE film; composition/layer; upstream owner; full wet state; opening empty/WIP/FG/reusable; P; I; ER; gross S; EO; Wraw; closing empty/WIP/FG/reusable; natural H2O in/out; other same-side X; actual separate outlet or mixed-container locator; internal reuse; original cohort Q_c; H; every inherited burden vector ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID"
      collection_method: "Measure six actual directional legs separately for each real pool without division; no implied zero for unmeasured events. Whole P/I ingress includes supplied water/components once and is disjoint. Retain full wet closing stock plus real new influx, internal-reuse cancellation and attached states. Wraw joins one mixed container as nonadditive composition/source subledger unless actually separately dispatched. Keep stock-corrected burden ownership independent from gross V.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
      unit: "kg whole actual article in measured wet state"
      frequency: "every real leg and opening/closing pool state"
      temporal_coverage: "actual original-cohort service H plus inherited stocks"
      site_scope: "each layer and physical destination; no generic packaging pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "material-specific weights; supplier included-pack BOM; six-leg tickets; gross shipments; mixed outlet bridge"
    - protocol_id: cp_assets
      process_id: "assets"
      flow_role: "actual asset/repair service burden"
      record_type: "installation maintenance stocks and real duty records"
      raw_fields: "row_id; actual fixture specification; new/used; complete physical opening/closing wet stock; raw receipts/returns/dispatch/discard; actual new screw; old screw; installed fluid/water opening/closing; every real addition/drainage; other same-side X; actual driver/capacity; original cohort; observed H; performed charge; unused/unassigned charge; each inherited vector; permission/tests/failure/disposition"
      collection_method: "Record complete physical events and all installed-fluid/repair material stocks without economic scaling. Prepare actual service burden independently by measured capacity/occupation evidence, with no fixed lifetime and no whole asset per kg. New material/water retained in closing stock still has real influx; X only deduplicates OTHER same-side flow terms. Retain all performed failures and actual disposition."
      unit: "actual native extensive unit"
      frequency: "each actual asset/repair event and stock boundary"
      temporal_coverage: "inherited asset history and actual service horizon"
      site_scope: "actual installed/test fixture and distinct parts/fluid pools"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; calibrated mass; maintenance tickets; actual duty/capacity; wet balance; vectors"
    - protocol_id: cp_asset_gross
      process_id: "assets"
      flow_role: "actual asset/repair physical event"
      record_type: "installation maintenance stocks and real duty records"
      raw_fields: "row_id; actual fixture specification; new/used; complete physical opening/closing wet stock; raw receipts/returns/dispatch/discard; actual new screw; old screw; installed fluid/water opening/closing; every real addition/drainage; other same-side X; actual driver/capacity; original cohort; observed H; performed charge; unused/unassigned charge; each inherited vector; permission/tests/failure/disposition"
      collection_method: "Record complete physical events and all installed-fluid/repair material stocks without economic scaling. Prepare actual service burden independently by measured capacity/occupation evidence, with no fixed lifetime and no whole asset per kg. New material/water retained in closing stock still has real influx; X only deduplicates OTHER same-side flow terms. Retain all performed failures and actual disposition."
      unit: "actual native extensive unit"
