      collection_method: "Independently establish ordinary H2O ingress and egress during work or natural storage with calibrated moisture/state/composition observations and matched water-substance density. Resource volume is actual H2O vapour volume, not bulk air; output is actual H2O vapour mass to air. Keep full wet stocks and no artificial permission for natural exchange. No forced two-unknown residual or second count of supplied article water."
      unit: "m3 H2O vapour input; kg H2O output and mass subledger"
