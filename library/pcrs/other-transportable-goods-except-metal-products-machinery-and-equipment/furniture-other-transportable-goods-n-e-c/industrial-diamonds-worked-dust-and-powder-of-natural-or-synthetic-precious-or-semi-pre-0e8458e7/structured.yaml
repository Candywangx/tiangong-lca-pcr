allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "These rules apply only to the stated attributional partitioning scenario after the complete route and cohort boundary in §5. Full physical mass is never an allocated burden share. A separated grade or sold residue is not automatically an independent cofunction."
    source_ids: []
  - rule_id: allocation_context
    applies_to: "shared manufacturing and service burdens"
    rule: "Use only attributional cases that require partitioning consistently with the declared study decision context. First separate dedicated operations and real or virtual subdivisions, including grade-specific finishing and exclusive reagent/tool service. Industrial process descriptions and a sale invoice do not authorize allocation."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_causal
    applies_to: "each remaining exchange"
    rule: "Establish the determining physical causal relationship for each exchange/function from actual measured technology: e.g. actual grade processing demand and equipment service where causally determining. Mass, duration, energy and value are not freely interchangeable keys; justify their determining role and all effects on linked flows. Keep full gross physical legs unscaled by that burden share."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_residual
    applies_to: "only the genuinely unresolved common-process residue"
    rule: "Only after those steps, allocate the true residual with contemporaneous values at the same common process gate and actual output state, quantity and quality. Back out later purification, packing and delivery costs from later prices with evidence. Distinct grades need independent actual outputs and cofunction decisions; do not impose yield, size-share or price ratios. Document no-causality justification, sensitivity, conservation across all functions and unresolved values."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_losses
    applies_to: "failures; samples; sludge; sold residues; recycling"
    rule: "Retain ordinary manufacturing failures, off-spec solids, samples and their treatment burdens in the causing cohort. Waste leaving, being sold or sent for recycling never automatically becomes T_other, a negative input or avoided-product credit. A one-time vector transfer requires a real independent other cohort/function and justified allocation/handover; retain full physical exit. Internal recirculation is not another purchase or product."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_pack
    applies_to: "each actual packaging pool"
    rule: "For each separately identified packaging material or whole-article pool, O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C retains complete wet empty, attached-WIP, attached-FG and reusable stocks; S follows gross physical shipments, not Q or net sales. P/I are mutually exclusive for the same physical ingress event and have one actual upstream owner, independent of burden shares. F_in/F_out are independently measured actual repair/material/water additions or removals, including ordinary humidity, with event, phase and destination; never fitted balancing residuals. X_in/X_out removes only the same event/material quantity proved duplicated in another actual OTHER flow on the SAME input/output side. It never removes a stock, opposite-side leg, mere card presence or real ingress retained in C. Use complete wet articles or one mutually exclusive component bridge; internal transfers/reuse cancel once. Physical V stays complete under the sole V/Q_c quotient and does not generate another provider or credit. One actual mixed_pack_w has one measured whole outlet and receiver/treatment provider. Independently measured disjoint origin-W subaccounts, including actual attached residue/water on a consistent basis, sum to the outlet and are not extra exported component cards or treatment amounts. Retain unknown origins explicitly; no mixture is invented. Burden ownership, used service and allocation are accounted once separately."
    source_ids:
      - ilcd-allocation
      - harmony-hpht
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "finished_powder"
      record_type: "weighing"
      raw_fields: "cohort; incoming origin/HPHT/single crystal; grade; release timestamp; accepted mass; free water; tare; rejects; withdrawals; repeat release flags"
      collection_method: "Calibrated weighing with independent moisture measurement and traceable grade acceptance. Sum only unique first-released net dry-equivalent whole powder; keep impurity/PSD evidence separately, no assumed purity correction. Aggregation instructions (raw quantities remain undivided): raw unique mass sum Q; calc_release; denominator only The aggregation_rule cell is an output-basis label referring to the same single section8 quotient; it is not another division."
      unit: "kg"
      frequency: "each lot and release"
      temporal_coverage: "whole production period including Q0 and failed lots"
      site_scope: "declared plant and target-grade cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; moisture method; PSD method; disposition; cohort deduplication"
    - protocol_id: cp_raw
      process_id: "manufacture"
      flow_role: "material and transport rows"
      record_type: "raw_records"
      raw_fields: "row; actual processing stage; event; source state; raw unit/quantity; rate or integral; timestamp; formulation and assay; upstream owner; V; raw/WIP/nonWIP opening/closing quantities; inherited per-exchange burden vectors; already-net flag; F_in; F_out; same_side_OTHER_event"
      collection_method: "Measure each whole supply separately using calibrated scale/meter/invoice and actual delivery records. Record actual acid system; component assays and carrier water are nonadditive. Keep full gross physical V and stock quantities separate from each original-unit burden vector. Aggregation instructions (raw quantities remain undivided): raw undivided records only; for per reference flow use calc_raw then calc_burden and calc_quotient once The aggregation_rule cell is an output-basis label referring to the same single section8 quotient; it is not another division. True F_in/F_out and complete wet closing stock coexist; X removes only a proven same-event/material duplicate in another actual OTHER same-side flow, never a stock, opposite side, card presence or retained real influx."
      unit: "row native unit"
      frequency: "each receipt transfer and stock census"
      temporal_coverage: "complete period and opening history"
      site_scope: "plant receipt and all actual processing stages"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale/meters; batch genealogy; supplier composition; background reference basis; stock reconciliation"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "each electricity row"
      record_type: "metering"
      raw_fields: "stage; meter opening/closing; kWh; timestamp; voltage; geography; year; provider; start/idle/failure/cleanup; submeter reconciliation"
      collection_method: "Read cumulative energy differences once; retain actual rate integrations only where power is a rate. Reconcile common feeders against submeters without summing both. Preserve CN below1kV restriction and all real operating modes. Aggregation instructions (raw quantities remain undivided): raw undivided meter totals; per reference flow uses the same calc_quotient after calc_raw and allocation The aggregation_rule cell is an output-basis label referring to the same single section8 quotient; it is not another division."
      unit: "kWh; MJ"
      frequency: "meter interval and each batch"
      temporal_coverage: "complete period including zero-output operation"
      site_scope: "actual mill wet-line dryer and controls"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; time alignment; mains reconciliation; supply contract"
    - protocol_id: cp_assets
      process_id: "manufacture"
      flow_role: "each asset and replacement part"
      record_type: "asset_records"
      raw_fields: "serial/configuration; new/used; whole wet mass; fills; O/P/C/retirement; remaining service; actual hours; overhaul; new/old parts; X_in/X_out same-side overlap; burden owner; F_in; F_out; same_side_OTHER_event"
      collection_method: "Measure gross whole assets/parts and installed wet stocks independently of service. Derive actual used service from engineering life/capacity records with uncertainty, not a default life; retain unused unassigned charge separately. Do not turn hours into kg using a secondary coefficient. Aggregation instructions (raw quantities remain undivided): raw physical V and service records; per reference flow use calc_burden only for used service and calc_quotient once; physical rows use V The aggregation_rule cell is an output-basis label referring to the same single section8 quotient; it is not another division. True F_in/F_out and complete wet closing stock coexist; X removes only a proven same-event/material duplicate in another actual OTHER same-side flow, never a stock, opposite side, card presence or retained real influx."
      unit: "kg; h"
      frequency: "each change and usage interval"
      temporal_coverage: "complete asset history needed for current service"
      site_scope: "actual plant equipment and maintenance"
      aggregation_rule: "per reference flow"
      quality_evidence: "serial register; installed-stock survey; maintenance; service-capacity support; ownership"
    - protocol_id: cp_outputs
      process_id: "manufacture"
      flow_role: "other grade and each waste/liquid output"
      record_type: "weighing_sampling"
      raw_fields: "outlet; grade/cohort; physical wet mass; dry component; actual species; impurity; destination; treatment owner; stock; common versus separate outlet"
      collection_method: "Independently weigh actual whole outlets and sample composition; identify actual separately accepted grades and true cofunctions. Sludge/liquor components and whole totals are nonadditive. One real combined outlet uses one external exchange and provider with source subaccounts. Aggregation instructions (raw quantities remain undivided): raw undivided physical outputs and burden assignments; per reference flow uses calc_quotient once with row mode The aggregation_rule cell is an output-basis label referring to the same single section8 quotient; it is not another division."
      unit: "kg"
      frequency: "each outlet and representative sample"
      temporal_coverage: "complete period and retained stocks"
      site_scope: "same manufacturing boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; wet/dry assays; manifests; sale versus cofunction decision; provider treatment basis"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each elementary species and humidity row"
      record_type: "species_measurements"
      raw_fields: "species identity; CAS; crystal/particle/phase; actual receiving medium; gross inlet/outlet; pass-through/net; rate/integral flag; temperature; pressure; humidity; independent analytical method; detection limit; wet full stocks; F_in; F_out; same_side_OTHER_event"
      collection_method: "Measure at actual external exit after capture and independently at required ingress. Use true species and particle composition; preserve total PM/NOx/SOx/COD/VOC indicators only as nonadditive measured indicators, not molecules. Independently distinguish water sorption, evaporation, reaction and structural water; never solve two missing species from one residual. Aggregation instructions (raw quantities remain undivided): raw undivided species records; per reference flow uses calc_raw and the same calc_quotient; gross modes retain full V The aggregation_rule cell is an output-basis label referring to the same single section8 quotient; it is not another division. True F_in/F_out and complete wet closing stock coexist; X removes only a proven same-event/material duplicate in another actual OTHER same-side flow, never a stock, opposite side, card presence or retained real influx."
      unit: "kg; original meter unit"
      frequency: "each relevant run and actual event"
      temporal_coverage: "all operating states and ordinary storage"
      site_scope: "actual external gate and air/water compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "analytical QA; calibrated rates; phase and compartment evidence; independent balances"
    - protocol_id: cp_service
      process_id: "handling"
      flow_role: "original-cohort handling and FG movements"
      record_type: "cohort_service_records"
      raw_fields: "original cohort c; fixed original Q_c; horizon H; opening/closing whole wet FG; original shipment links; gross G/R; absorbed/released water; actual incremental materials/energy; performed versus unused service; permission; posttests; acceptance; hold/waste disposition; F_in; F_out; same_side_OTHER_event"
      collection_method: "Trace all actual work and physical movements to original first-release history including older FG. Meter new increments separately; do not reassign old manufacture or treat reacceptance as Q. Natural humidity needs no permit. Unauthorized/failed work remains collected and its real disposition retained. Aggregation instructions (raw quantities remain undivided): raw undivided records; per reference flow use fixed Q_c in calc_quotient once; physical legs retain V The aggregation_rule cell is an output-basis label referring to the same single section8 quotient; it is not another division. True F_in/F_out and complete wet closing stock coexist; X removes only a proven same-event/material duplicate in another actual OTHER same-side flow, never a stock, opposite side, card presence or retained real influx."
      unit: "row native unit"
      frequency: "each movement/work interval"
      temporal_coverage: "observed H including opening FG history"
      site_scope: "original cohort and actual storage/packing gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "cohort genealogy; dispatch/return weights; humidity/phase checks; permission/tests; meter reconciliation"
    - protocol_id: cp_pack
      process_id: "handling"
      flow_role: "each material and each of six physical directions"
      record_type: "packaging_six_legs"
      raw_fields: "material/whole article; pool; empty/attached WIP/FG/reusable O and C; P; supplier-included I; ER; gross S; EO; W; internal reuse; full wet mass; X overlap with other same-side terms; disjoint component bridge; one upstream owner; actual used burden vector; F_in; F_out; X_in; X_out; same_side_OTHER_event; independently_measured_origin_W; one_receiver_provider"
      collection_method: "For each separately identified packaging material or whole-article pool, O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C retains complete wet empty, attached-WIP, attached-FG and reusable stocks; S follows gross physical shipments, not Q or net sales. P/I are mutually exclusive for the same physical ingress event and have one actual upstream owner, independent of burden shares. F_in/F_out are independently measured actual repair/material/water additions or removals, including ordinary humidity, with event, phase and destination; never fitted balancing residuals. X_in/X_out removes only the same event/material quantity proved duplicated in another actual OTHER flow on the SAME input/output side. It never removes a stock, opposite-side leg, mere card presence or real ingress retained in C. Use complete wet articles or one mutually exclusive component bridge; internal transfers/reuse cancel once. Physical V stays complete under the sole V/Q_c quotient and does not generate another provider or credit. One actual mixed_pack_w has one measured whole outlet and receiver/treatment provider. Independently measured disjoint origin-W subaccounts, including actual attached residue/water on a consistent basis, sum to the outlet and are not extra exported component cards or treatment amounts. Retain unknown origins explicitly; no mixture is invented. Burden ownership, used service and allocation are accounted once separately. Raw quantities remain undivided; aggregation_rule only references the same calc_quotient output basis and does not divide again."
      unit: "kg"
      frequency: "each physical leg and stock count"
      temporal_coverage: "whole H including attached beginning/ending stocks"
      site_scope: "actual material pool and receiving/shipping/waste point"
      aggregation_rule: "per reference flow"
      quality_evidence: "scales; supply-included ownership; stock locations; gross shipment links; component disjointness; one waste manifest/provider"
  calculation_rules:
    - id: calc_raw
      applies_to: "raw observations"
      rule: "Convert raw readings to each row native extensive unit before stock/inheritance and allocation. Energy kWh ×3.6 = MJ. A measured metric carat (native kt) ×0.0002 = kg; no single-grain weight is inferred. Use independent substance density at actual temperature/pressure for genuine volume/mass conversion. Integrate actual rates once; a total metered volume is already integrated."
      inputs:
        - "raw quantity"
        - "original unit"
        - "actual state"
        - "independently measured density"
      output: "native extensive raw quantity"
      source_ids: []
    - id: calc_release
      applies_to: "finished_powder"
      rule: "Q = sum(unique newly first-released target-grade whole dry-equivalent net kg). Subtract independently measured free water from wet powder mass; do not correct solids to hypothetical pure diamond. Q includes the cohort closing FG once, not another output. Q=0 preserves burdens and returns no unit result."
      inputs:
        - cp_release
      output: "Q"
      source_ids: []
    - id: calc_burden
      applies_to: "manufacturing burden dimension only"
      rule: "A = B_open + U - B_close - T_other, separately for every original-unit exchange vector after calc_raw and actual allocation. B_open/B_close contain raw/WIP and unused unassigned non-WIP stores, never first-released FG. U retains failures/Q0/startstop/idle/cleanup and used asset service. Already stock-corrected consumption is not corrected again. T_other requires a real other cohort/function and justified one-time transfer; ordinary waste/sale is insufficient. This formula never applies to a gross physical card V."
      inputs:
        - cp_raw
        - cp_energy
        - cp_assets
        - cp_outputs
        - "allocation decisions"
      output: "A"
      source_ids:
        - ilcd-allocation
    - id: calc_service
      applies_to: "original cohort c within H"
      rule: "A_H is actual performed incremental service burden allocated once to original cohort c over observed H, with fixed original Q_c. Keep original manufacturing history; no manufacturing reversal or new Q. Deduct only genuinely unused/unassigned service/charge once, not performed service on closing FG. Actual failed or unauthorized work retains burdens and disposition."
      inputs:
        - cp_service
        - cp_pack
        - cp_assets
      output: "A_H; Q_c"
      source_ids:
        - ilcd-allocation
    - id: calc_quotient
      applies_to: "all inventory rows except fixed finished_powder"
      rule: "For a burden-mode manufacture row q = A_row / Q. For a burden-mode original-cohort service row q_c = A_H,row / Q_c. For EVERY gross-mode physical card q_V = V_row / Q_basis where Q_basis is Q for manufacture or original Q_c for handling. V_row is that complete actual gross physical leg, never A, B_open+U-B_close, economic share or stock-adjusted burden. Physical disclosures create no added procurement/provider burden or credit; separately carry the one actual burden-owner dimension once. Apply this division once after calc_raw and appropriate burden steps; cards/aggregation reference this same result, never divide it again. Q_basis=0 retains raw V and burden and emits no unit value."
      inputs:
        - A
        - Q
        - A_H
        - Q_c
        - V_row
        - "row mode"
        - cp_release
      output: "q; q_c; q_V"
      source_ids: []
    - id: calc_physical
      applies_to: "all physical gates"
      rule: "For each independently identified material/species opening + external incoming + evidenced transformation = closing + external outgoing. Never scale V by burden shares.  X_in/out only removes other same-side flow duplication; actual retained influx and full wet closing mass remain. Cancel matched internal transfers and the internal first-release handover when consolidating, leaving one Q. Never add wet totals and their component assays twice or use one residual for multiple unknowns. For each separately identified packaging material or whole-article pool, O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C retains complete wet empty, attached-WIP, attached-FG and reusable stocks; S follows gross physical shipments, not Q or net sales. P/I are mutually exclusive for the same physical ingress event and have one actual upstream owner, independent of burden shares. F_in/F_out are independently measured actual repair/material/water additions or removals, including ordinary humidity, with event, phase and destination; never fitted balancing residuals. X_in/X_out removes only the same event/material quantity proved duplicated in another actual OTHER flow on the SAME input/output side. It never removes a stock, opposite-side leg, mere card presence or real ingress retained in C. Use complete wet articles or one mutually exclusive component bridge; internal transfers/reuse cancel once. Physical V stays complete under the sole V/Q_c quotient and does not generate another provider or credit. One actual mixed_pack_w has one measured whole outlet and receiver/treatment provider. Independently measured disjoint origin-W subaccounts, including actual attached residue/water on a consistent basis, sum to the outlet and are not extra exported component cards or treatment amounts. Retain unknown origins explicitly; no mixture is invented. Burden ownership, used service and allocation are accounted once separately."
      inputs:
        - cp_raw
        - cp_assets
        - cp_outputs
        - cp_species
        - cp_pack
        - cp_service
        - F_in
        - F_out
        - X_in
        - X_out
        - same_side_OTHER_event
        - independent_origin_W
      output: "independent closures and explicit unresolved residuals"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each row and reference"
      requirement: "Verify whole product identity and every native restriction including all names/synonyms/comments, CAS, crystal/particle phase, route, form, geography, medium, type and all property/unit links. Generic family compatibility requires positive terminal evidence; identity alone supplies no provider dataset, assay or quantities."
      evidence: "native original; supplier specification; full route evidence"
    - id: dq_full_period
      applies_to: "all inventories"
      requirement: "Cover complete period, failed and Q0 lots, starts, idle, cleanup, rework, stock inheritance and older FG services. Retain actual raw measurements, uncertainty, non-detect bounds, sampling limits and representativeness; future collection is not claimed observation."
      evidence: "raw logs; inventories; cohort history; laboratory QA"
    - id: dq_primary
      applies_to: "sources and constraints"
      requirement: "Primary process sources are technical synthesis, not a universal SKU recipe or one facility measurement. Do not copy PSD, purity, dosage, yield, reactor settings or performance thresholds into defaults. Product comparisons require actual equivalent grade and service."
      evidence: "full original and adjacent countercontext; actual foreground evidence"
    - id: dq_allocation
      applies_to: "burden dimensions and physical views"
      requirement: "Keep allocation evidence and 100% burden conservation separate from independent full gross physical closure. All denominators and one-time unit conversions are traceable; no service or stock quantity is corrected twice."
      evidence: "subdivision records; technical causality; common-gate prices; physical ledger"
    - id: dq_language
      applies_to: "complete PCR and data package"
      requirement: "Match English and Chinese ordered row/rule/source identities, actual qualifier elements, description restrictions and formulas. Distinguish unresolved ordinary identities from core terminal holds, engineering source fidelity from scientific and translation review."
      evidence: "complete paired raw-to-typed audit; native originals"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Apply every rule with the entire §5/§7 premises and §8 protocols/formulas. Unknown future measurements are unmeasured rather than passes; unsupported relationships remain explicit."
    source_ids: []
  - rule_id: validate_core
    applies_to: "whole data package"
    rule: "Require one independently identified whole uncoated HPHT single-crystal manufactured powder after the complete declared route and grade acceptance. Bind the broad finished Product family only under all §3 and card restrictions; no graphite/carbon-black/Resource/rough-press material/tool substitution. A hard native material, crystal form, phase, route or type conflict is a core hold, even with a mechanically passing projection."
    source_ids:
      - grish-terminal
      - egrind-types
      - harmony-hpht
  - rule_id: validate_q
    applies_to: "all rows and calculations"
    rule: "Require positive independent first-release Q, unique finished_powder Product output, same native Mass/kg basis and aligned languages. Q0 retains all raw loads and no unit result. Q is not closing-FG-plus-release, shipment or repeat qualification. No unknown conversion passes and no raw aggregation divides before the single quotient."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "manufacture; service; combined gates"
    rule: "Require complete gross legs and independent wet mass/element/species balances, all stock vectors and packaging six-direction events. Keep actual retained influx plus full closing wet mass. One residual cannot identify multiple species; NOx, SOx, total PM, VOC, COD and total carbon remain indicators unless actual speciation exists. Integrated volume never gets an extra time multiplier or borrowed water density."
    source_ids: []
  - rule_id: validate_work
    applies_to: "actual postrelease work and all losses"
    rule: "Record manufacturer/specification permission, postwork tests, acceptance and disposition for actual rework or continued qualification; never assume broken or contaminated product is restored. These are qualification gates, not permission to delete flows: unauthorized, failed or rejected work actually done retains all materials, energy, original cohort and hold/waste disposition. Natural humidity exchange needs no invented work permit."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "all providers and measured inventories"
    rule: "Verify each actual purchased preparation, wear part, utility, asset service, waste outlet and species has a specific atomic identity and collection basis. Match supplier dataset incoming state, reference property, unit, year and geography before numerical use. Unresolved auxiliaries/providers or future values are ordinary data-completion gaps; unknown core route/terminal identity is different and cannot be hidden by declared_unresolved."
    source_ids: []
  - rule_id: validate_claims
    applies_to: "reported result"
    rule: "Report performed, skipped, unknown and failed checks with evidence. Source fingerprint/Schema/arithmetic checks do not grant scientific review, translation review, accepted mapping, product certification or publication; this method contains collection requirements rather than fabricated factory observations."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Compatible declared-grade abrasive powder input to subsequent tool/slurry manufacture or industrial finishing"
  allowed_use: "Only a complete compatible route/grade/site/period inventory with positive first-release Q and disclosed service horizon"
  excluded_use: "No equal performance/lifetime claim across grades; no natural/CVD/polycrystalline/coated substitution; no publication or scientific approval from this profile"
  required_metadata: "HPHT synthetic origin and purchased coarse-grit custody; single-crystal diamond structure; uncoated surface and actual acid-cleaned state; one accepted particle-size grade and measured PSD method; actual metallic and non-diamond impurities; free-water measurement and dry-equivalent whole powder mass; first-release Q and unique cohort; actual finished manufactured at-plant product; actual incoming purification and surface state; actual milling medium and wear; actual separately supplied whole reagent formulations and assays; wet-classification route and reprocessing; electric drying and final acceptance; native reference Mass and kg; CN below-1-kV grid supply only for adopted electricity identity; DI water ion-exchange or reverse-osmosis supply; PE-bag material and whole supplied state; ordinary H2O vapour to unspecified air only for adopted emission identity; site and reporting period; original cohort Q_c and service horizon H; opening and closing raw WIP FG and unused service vectors; all actual failures and Q0 periods; packaging material and six-direction ledger; gross physical versus attributed-burden basis; actual species phase receiving medium and provider; subdivision and exchange-specific allocation evidence; actual other-grade cofunctions and waste fate; permission posttests acceptance and disposition for actual postrelease work"
  required_quality_disclosure: "actual measured data; provider and ordinary UUID gaps; source applicability; allocation; wet/gross versus burden views; unmeasured checks; uncertainty"
  update_trigger: "Change of incoming state, crystal/route, grade/surface, chemical supply, processing, provider, electricity, gate, allocation or service horizon"
