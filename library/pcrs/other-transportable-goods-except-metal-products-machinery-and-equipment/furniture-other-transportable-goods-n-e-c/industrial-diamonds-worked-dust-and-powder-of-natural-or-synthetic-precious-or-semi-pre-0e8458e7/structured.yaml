system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Include actual receipt, crushing/shaping, acid cleaning with separately supplied identified reagents, rinsing/ultrasound, aqueous sedimentation or centrifugal grading, separation, actual grade-specific acid cleaning/rinsing after classification, electric drying, grade testing and first release. Retain actual controls and waste treatment. This is technical synthesis of compatible primary processes, not a measured recipe or one supplier SKU; neither HPHT synthesis at this plant nor a final-powder repacking-only route is implied."
      source_ids:
        - egrind-route
        - egrind-types
        - egrind-grading
        - grish-terminal
        - harmony-hpht
    - rule_id: boundary_upstream
      applies_to: "purchased_inputs"
      rule: "Carry complete mining/synthesis, recovery and actual supplier purification burdens exactly once at the incoming supply state. A recovered coarse grit is not automatically identical to the as-produced HPHT press-output flow. Whole purchased aqueous preparations include carrier water and active constituents once; assay subaccounts are nonadditive. If actually blended on site collect each purchased ingredient, separate added water, electricity and losses; do not also purchase a finished blend."
      source_ids:
        - egrind-types
        - harmony-hpht
        - diamtech-cleaning
    - rule_id: boundary_q
      applies_to: "manufacture; handling"
      rule: "Q counts unique newly first-released target-grade net dry-equivalent whole powder once. Closing FG already belongs to that Q: never subtract its manufacturing burden or add Q and closing FG as two products. Manufacturing B_close covers only raw/WIP and genuinely unused/unassigned non-WIP stores. Keep opening inherited raw/WIP and every exchange vector; do not stock-correct already net consumption twice. Grade inspection, repeat acceptance and dispatch of an old cohort do not create new production."
      source_ids: []
    - rule_id: boundary_service
      applies_to: "handling"
      rule: "Packing, storage, humidity exchange, handling and actual postrelease work retain a separate incremental service ledger for original cohort c with its original Q_c and observed horizon H. Performed service remains attributable even if FG stays stored. Only genuinely unused/unassigned service/charge can carry forward. Full FG history, gross dispatch/returns, changing moisture and losses remain physical facts; this first-release method never substitutes a net-delivery denominator or blindly reverses manufacturing from return weight."
      source_ids:
        - ilcd-allocation
    - rule_id: boundary_actual
      applies_to: "all actual exchanges"
      rule: "Conditional rows require evidence of presence/absence; unknown is not zero. Add a separate concrete atomic card, native extensive property, protocol and source for any actual unlisted chemical, fuel, gas, refrigerant, wear material, treatment or external liquid return. The selected route uses electric drying; an actual fuel-fired/steam/fluoride/flotation/coating route needs a complete separately evidenced boundary and species inventory before claiming compatibility. No boiler, steam supply, avoided heat or default reaction is invented."
      source_ids:
        - egrind-route
        - diamtech-cleaning
    - rule_id: boundary_physical
      applies_to: "manufacturing; FG service; consolidated gate"
      rule: "Keep unscaled gross physical V, stock quantities and attributed burden vectors separately at identical gates. Reconcile full wet physical mass, diamond/non-diamond carbon, relevant metals and actual reactive elements with independent substance/phase measurements. Free, reaction-generated and structural water are distinct; do not assume reaction stoichiometry, pure diamond or fit two unknown species from one carbon residual. Wet waste/whole-article totals and their component assays never add twice."
      source_ids: []
    - rule_id: boundary_assets
      applies_to: "equipment; repairs; utilities"
      rule: "Separate whole physical asset receipt/installed/retirement inventories from used service burden. Record actual new/old parts, installed fluids, wear, refurbishment, lifetime evidence and unused charges, never a whole machine per kg. X_in and X_out remove only overlap with other same-side flow terms, not closing stock or opposite legs. Retain real new material/water influx AND full wet closing mass. Any real external condensate/heat-carrier return requires its own liquid/thermal state, enthalpy and one provider agreement on water/energy; internal circulation cancels. True F_in/F_out and complete wet closing stock coexist; X removes only a proven same-event/material duplicate in another actual OTHER same-side flow, never a stock, opposite side, card presence or retained real influx."
      source_ids:
        - ilcd-allocation
