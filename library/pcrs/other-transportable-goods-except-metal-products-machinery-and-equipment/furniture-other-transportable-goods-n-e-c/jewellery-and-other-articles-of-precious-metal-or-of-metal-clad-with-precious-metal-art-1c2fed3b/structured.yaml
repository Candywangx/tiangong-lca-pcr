  collection_protocols:
    - protocol_id: cp_release
      process_id: "finish"
      flow_role: "finished_ring"
      record_type: "calibrated weighing and unique release register"
      raw_fields: "configuration; drawing revision; complete article; alloy assay; finish; dry/wet condition; unique release id; calibrated net mass; inspection method; results; disposition; Q; original Q_H; H"
      collection_method: "Weigh each complete ring net of all packaging on a calibrated suitable balance, link the same configuration/condition and first release exactly once, and preserve raw resolution/calibration and uncertainty. Counts never imply weight; if count conversion is needed, independently measure net mass of same configured complete pieces, without geometry/density inference."
      unit: "kg; item"
      frequency: "each release and configuration change"
      temporal_coverage: "complete cohort including Q0"
      site_scope: "actual manufacturing acceptance gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "release register; balance calibration; specification; test result"
    - protocol_id: cp_material_model
