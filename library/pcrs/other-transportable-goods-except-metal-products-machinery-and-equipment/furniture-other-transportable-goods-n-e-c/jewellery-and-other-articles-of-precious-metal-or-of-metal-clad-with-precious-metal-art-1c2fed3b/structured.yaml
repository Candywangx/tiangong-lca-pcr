allocation_rules:
  - rule_id: al_context
    applies_to: "actual attributional multifunctionality"
    rule: "The following rules apply to actual attributional multifunctionality, not an arbitrary choice of favourable results."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: al_hierarchy
    applies_to: "attributional studies requiring allocation"
    rule: "Limit this hierarchy to the declared attributional situations in which allocation is methodologically required. First separately meter dedicated steps, then use justified real/virtual subdivision. For each remaining exchange independently establish its determining physical causal relationship and quantify it. Do not arbitrarily choose mass, item count, fine-silver content, time or economic value. Only genuinely residual shared process burdens use representative contemporaneous market values at the same actual common process gate, state, grade and condition; remove later refining, packing and freight costs if deriving that gate value. Report keys, limitations, sensitivity and conservation of each exchange across functions."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: al_scrap
    applies_to: "sprues scrap dust rejects and treatment"
    rule: "Internal alloy/wax returns pair and cancel at the combined gate while preserving energy, loss, pollution and inherited vectors. Precious-metal value does not exempt scrap production/treatment burdens. Ordinary failed/rejected/sample/sold waste or offsite treatment is not an automatic T_other deduction or recycling credit. Transfer one burden vector only to a true other cohort/function under a justified allocation/handover. If external recovery/recycling is modelled, identify the actual joint process, secondary material condition and applicable study recycling model first; no default recycled content, recovery, price share, avoided virgin metal or avoided disposal credit. Keep all physical masses gross regardless of burden allocation."
    source_ids:
      - goldsmith-casting
      - ilcd-attributional-2010
  - rule_id: al_service
    applies_to: "shared services and assets"
    rule: "Service allocation is exchange-specific: actual fulfilled duty, duration/capacity and physically determining constraint require evidence. Keep manufacturing, original-cohort FG service and physical-only ledgers distinct; performed service remains with its original cohort even for unsold closing FG. Asset mass is not fulfilled service hours or MJ. Packaging procurement and supplier-included ownership occur once; gross S/ER/EO/W never generate new procurement, second provider or automatic coproduct credit."
    source_ids:
      - ilcd-attributional-2010
