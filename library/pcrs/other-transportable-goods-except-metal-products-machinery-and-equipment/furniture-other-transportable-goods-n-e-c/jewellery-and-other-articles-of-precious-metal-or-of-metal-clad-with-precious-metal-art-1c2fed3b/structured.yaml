      record_type: "physical stock and measured utilization history"
      raw_fields: "asset id; new or used; dry body kg; separately included installed fluid; attached water; opening installed and spare stocks; actual receipt; actual external return; actual retirement; closing full wet stock; new repair part; old part; each water phase; fulfilled hours; observed capacity; provider vector; original cohort; unused unassigned charge; same_side_X"
      collection_method: "Keep full physical asset/part/fluid stocks and events independent of fulfilled service burden. Match dry body plus disjoint installed fluids/water to whole wet article without double tare. Real replacement-material/water influx remains even in full wet closing stock; X removes only identical other incoming/outgoing terms. Derive service burden from real utilization/capacity and one provider, never assumed life or whole-machine-per-kg replacement."
      unit: "kg for physical mass; h for actual service; each original native unit"
      frequency: "each asset stock receipt repair return retirement and service event"
      temporal_coverage: "actual historical and current service period"
      site_scope: "actual equipment and provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset log; part identity; service meter; observed utilization; provider boundary"
    - protocol_id: cp_pack
      process_id: "pack"
      flow_role: "each named packaging pool and six disjoint physical events"
      record_type: "six-leg event cards and complete stock reconciliation"
      raw_fields: "pool; actual material; whole wet article; disjoint components; event direction; P; I; ER; gross S; EO; W; opening empty; opening attached WIP; opening attached FG; opening reusable; closing empty; closing attached WIP; closing attached FG; closing reusable; internal reuse; natural water uptake; desorption; component addition; X_in; X_out; other_same_side_overlap_id; mixed outlet id; one upstream owner; actual service charge; cohort; Q_H; H"
      collection_method: "Weigh every real P/I/ER/S/EO/W direction for each individual pool; P and supplier-included I are disjoint. Full opening plus P+I+ER equals full closing plus gross S+EO+W with separately measured natural material/water changes and disjoint X bridges. Preserve new influx retained in closing stock and whole wet mass once. Mixed W source pools sum to one outlet; W cards activate only for segregated outlets. Gross numerator is actual complete V, not burden stock correction or economic allocation. Attribute actual procurement/treatment/service burden in one separate tagged vector; internal reuse creates no purchase, Q or credit."
      unit: "kg; actual original package count with measured same-article wet mass"
      frequency: "every real event and stock close"
      temporal_coverage: "complete cohort and observed original-cohort H"
      site_scope: "packaging manufacturing FG and consolidated gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "event ledger; full wet weighing; component bridge; mixed W pool sum; upstream ownership"
    - protocol_id: cp_cooling
      process_id: "cast"
      flow_role: "actual external cooling carrier and net cooling service"
      record_type: "mass state and service records"
      raw_fields: "event; provider; contract; full supply kg; inlet temperature; inlet pressure; inlet phase; measured inlet enthalpy; full return kg; actual return state; measured return enthalpy; net cooling MJ; actual loss; makeup overlap; onsite cooling electricity; cohort; one provider vector"
      collection_method: "Meter only actual external supply and return carrier masses, their independently measured liquid states and enthalpies, and the actual cooling duty under one supply-return provider convention. No equal-return or fixed enthalpy assumption. Onsite closed-loop circulation cancels internally; its actual makeup, electricity and real losses remain individually recorded."
      unit: "kg; MJ; actual measured state"
      frequency: "each real supply-return and duty interval"
      temporal_coverage: "actual complete manufacturing and service horizon"
      site_scope: "actual cooling provider gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "carrier meters; state and enthalpy evidence; contract; one provider vector"
  calculation_rules:
    - id: calc_raw_units
      applies_to: "all inventory rows"
      rule: "Convert original extensive units to the actual row unit once before attribution. MJ=3.6*kWh for measured electrical energy; kg*km=1000*t*km. Only true rates integrate over actual time/state; already integrated volume does not. Count-to-mass needs independent calibrated same-configuration complete-ring mass, never a guessed per-ring weight or secondary property/density."
      inputs:
        - raw_i
        - native_unit
        - measured_state
        - conversion_evidence
      output: "U_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_manufacturing
      applies_to: "manufacturing burden dimension only"
      rule: "A_m_i = B_open_i + U_m_i - B_close_i - T_other_i. B_close contains raw/WIP and only unused/unassigned non-WIP stores or charges; never first-released closing FG. Preserve every inherited exchange vector and actual physical stock. Already stock-corrected consumption enters once without another subtraction. T_other requires a true other cohort/function and justified once-only handover; ordinary manufacturing waste, rejects, samples, sale or external treatment is not T_other."
      inputs:
        - B_open_i
        - U_m_i
        - B_close_i
        - T_other_i
        - allocation_evidence
      output: "A_m_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_service
      applies_to: "original-cohort service burden dimension only"
      rule: "A_s_i = C_open_i + U_s_i - C_close_unused_i - T_other_s_i. Include all performed storage/handling/packing/work increments for original Q_H over H, even unauthorised/failed work. Carry only unused/unassigned charge; do not deduct performed service for closing FG. Retain original manufacturing vector without repurchase."
      inputs:
        - C_open_i
        - U_s_i
        - C_close_unused_i
        - T_other_s_i
        - original_cohort
        - H
      output: "A_s_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_asset_service
      applies_to: "actual fulfilled asset service burden only"
      rule: "A_asset_i is actual fulfilled service with observed utilization/capacity and justified exchange-specific attribution of one compatible provider. Physical acquisition/installed stock, new/used repair parts, wet material and retirement remain separate full gross events. Unknown capacity/provider conversion stays unknown; no invented lifetime or full-machine-per-kg factor."
      inputs:
        - fulfilled_hours
        - observed_capacity
        - provider_vector
        - allocation_evidence
        - cohort
      output: "A_asset_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_gross
      applies_to: "each physical-only gross event card"
      rule: "N_gross_i = V_i, the actual complete physical leg in its own unit. Do not apply B_open+U-B_close, service/asset stock correction or economic share to V. Keep all actual influx and full wet closing stock; X removes only identical other same-side flow terms. Physical disclosure creates no second purchase/provider/credit. Each actual procurement, treatment, direct-emission or service burden remains in a separately tagged, once-owned vector of the same exchange/cohort, never erased or added twice."
      inputs:
        - V_i
        - event_identity
        - same_side_overlap_bridge
        - cohort
        - singly_owned_burden_vector
      output: "N_gross_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_numerator
      applies_to: "all non-reference rows"
      rule: "Choose one declared dimension for this card: manufacturing A_m_i, original-cohort service A_s_i, actual asset service A_asset_i, or full physical-only N_gross_i. Keep accompanying actual burden vectors separate from gross disclosures. Never merge different cohorts/dimensions under an averaged denominator. Raw-unit conversion and the real allocation decision occur before the sole quotient; no second attribution of an already assigned vector."
      inputs:
        - A_m_i
        - A_s_i
        - A_asset_i
        - N_gross_i
        - dimension
        - cohort
      output: "N_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_denominator
      applies_to: "finished_ring and each original cohort"
      rule: "Q is the sum of measured net complete-ring mass at unique first quality release. Q_c equals this Q for manufacturing, or matched original Q_H for actual service/gross/asset records over H. Closing first-released FG stays in Q; dispatch/return/reinspection adds none. Actual Q_c=0 retains full physical records and all burdens without unit results."
      inputs:
        - unique_release_id
        - net_mass
        - original_Q_H
        - H
      output: "Q_c"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_quotient
      applies_to: "all non-reference rows"
      rule: "x_i = N_i / Q_c. This is the only division by the declared first-release mass denominator, after raw-unit conversion and the single correct burden attribution; physical-only cards instead use complete actual V_i. All card amounts and protocol aggregation refer only to this already-calculated x_i. Never divide x_i again. No unit result at Q_c=0."
      inputs:
        - N_i
        - Q_c
      output: "x_i"
      source_ids:
        - ilcd-attributional-2010
    - id: calc_physical
      applies_to: "manufacturing FG service and consolidated physical gates"
      rule: "Independently reconcile full wet opening stocks plus all actual external gross inputs against full wet closing stocks plus all actual external gross outputs and evidenced phase/species changes. Cancel internal first-release transfers and actual internal remelt/reuse pairs only. Do not add Q beside closing FG/gross dispatch. Full water/material influx retained in closing stock is not overlap. Metal, water and carbon closures need independent constraints; no residual fitting of multiple unknowns."
      inputs:
        - full_opening_stocks
        - actual_gross_inputs
        - full_closing_stocks
        - actual_gross_outputs
        - independent_species_phase_evidence
      output: "independent_physical_reconciliation"
      source_ids:
        - ilcd-attributional-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flow identities"
      requirement: "Complete native restrictions, all properties/support chains and primary whole-terminal context; source applicability is an author judgement, not a query success flag."
      evidence: "Exact native record; actual supplier/grade/form"
    - id: dq_events
      applies_to: "all physical and burden accounts"
      requirement: "Disjoint event/cohort/dimension; gross V with actual full wet stocks and one owned burden vector. Six packaging legs and actual new water retained."
      evidence: "Raw stock and event ledgers; bridge reconciliation"
    - id: dq_measurement
      applies_to: "actual quantities"
      requirement: "Calibrated net complete-ring mass and real meters/assays; no invented weight, density, geometry, reaction yield or one-residual multi-unknown closure."
      evidence: "Calibration and independent analytical constraints"
    - id: dq_coverage
      applies_to: "complete cohort and actual H"
      requirement: "All failed, Q0, idle, start/stop, cleanup, rejects, samples and actual permitted/unpermitted work retained; Q and service original Q_H/H reconciled."
      evidence: "Full production/service logs and dispositions"
    - id: dq_sources
      applies_to: "external evidence"
      requirement: "Qualitative synthesis of independent primary routes/terminals plus applicable attributional method; not one factory BOM, scientific approval or numeric reuse."
      evidence: "Original full scope; applicability and countercontext"
    - id: dq_unknown
      applies_to: "unresolved identities providers and measurements"
      requirement: "Declare each actual unresolved atom and uncertainty; future measurements are requirements, not zeros, passes or universal defaults. A genuine core identity/route gap would require draft/unusable status."
      evidence: "Explicit data gaps and actual resolution records"
validation_rules:
  - rule_id: vr_identity
    applies_to: "reference and every selected flow"
    rule: "Verify the complete finished-ring terminal and native material/form/route/phase/type/geography/grade restrictions, every property and its exact support chain before UUID binding. The broad manufactured jewellery family is narrowed by primary whole-terminal evidence, never by name/CPC alone. Native status and software checks do not establish science, translation or methodology approval."
    source_ids:
      - goldsmith-casting
      - westhill-ring
      - struga-ring
  - rule_id: vr_completeness
    applies_to: "all events and accounts"
    rule: "Require atomic cards, six-leg packaging events, actual gross legs and singly owned burden vectors; raw units/rates and full stocks with inherited vectors; all failures and Q0; independently evidenced mass/element/water/species closure. Unknown or unmeasured relationships remain explicit inconclusive data gaps, never a passing quantitative result."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: vr_denominator
    applies_to: "manufacturing and original-cohort services"
    rule: "Check one unique first-release output, common kg basis in both languages, no closing-FG double output or manufacturing subtraction, and one sole quotient after raw conversion and justified attribution. Actual service keeps original Q_H/H; gross V never becomes a stock-corrected/economically shrunk numerator."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: vr_acceptance
    applies_to: "actual first release and later work"
    rule: "Collect real configured specification, test/inspection method, result, release identity and disposition. Do not invent quality limits, certification, lifetime, fixed alloy recipe or successful rework. Unauthorised/failed work and damaged materials retain all actual increments and hold/waste disposition."
    source_ids:
      - goldsmith-casting
      - westhill-ring
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A configured unreviewed attributional manufacturing dataset once actual foreground evidence is complete"
  allowed_use: "Same complete-ring boundary and declared route with verified actual providers and measured data"
  excluded_use: "Automatic coverage of all 38240 jewellery; raw silver, finished-ring repacking, plated/set/other-metal or different-route products; durability comparisons or certification"
  required_metadata: "All required qualifiers; source and native applicability; site/period; configuration/assay; first Q; original service horizon; stocks/vectors; actual providers; recycling convention"
  required_quality_disclosure: "Science pending; Chinese aligned only; future actual measurements and auxiliary/provider identity gaps; no claimed publication or mapping acceptance"
  update_trigger: "Core material/form/route/terminal, supplier, assay, energy, actual exchange, allocation, measurement or acceptance changes"
data_sources:
  - id: "un-cpc-38240"
    type: "official_guidance"
    reference: "UNSD. CPC Version 3.0 code 38240. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/38240"
    used_for: "Broad classification context only; does not define one canonical finished-jewellery methodology."
  - id: "goldsmith-casting"
    type: "handbook"
    reference: "The Jewellers Toolkit; acknowledgements: Weston Beamor Ltd. Fact Sheet 06: Lost wax casting. https://bpstorageprodneu02.blob.core.windows.net/cmsassets/the-jewellers-toolkit-factsheet-06-lost-wax-casting.pdf"
    used_for: "Complete four-page primary guide; direct expendable versus reusable-mould branch; casting/finishing/inspection and alloy-separated scrap; no operating settings or generic shrink/yield adopted."
  - id: "westhill-ring"
    type: "extension_guidance"
    reference: "Westhill. Silver Round Signet; Materials and craftsmanship; Design through Polishing. https://westhill-store.com/collections/signet-rings/products/silver-round-signet-ring"
    used_for: "Primary complete unplated silver-ring terminal; lost-wax casting through abrasives/polish/ultrasonic/steam/quality check and packing; adjacent stone/gold/prototype context distinguished. No same-site combined BOM or defaults."
  - id: "struga-ring"
    type: "extension_guidance"
    reference: "STRUGA. Fused Cross Ring. https://strugadesign.com/products/ring-fused-cross"
    used_for: "Primary whole unplated silver-ring terminal and natural ageing versus preblackened adjacent version; catalogue mass/size and care claims are not default LCA values or safety proof."
  - id: "cookson-grain"
    type: "extension_guidance"
    reference: "Cooksongold. Sterling Silver Grain, ASA 000. https://www.cooksongold.com/Grain-and-Casting-Pieces/Sterling-Silver-Grain,-100-Recycled-Silver-prcode-ASA-000"
    used_for: "Primary prealloy-grain supply form and supplier-specific grade context; actual lot assay/provider required. No universal 925 composition, recycled share, density, energy or operating settings adopted."
  - id: "hisae-ring"
    type: "extension_guidance"
    reference: "M. Hisae. Process: The Figure Ring. 1 August 2019. https://www.mhisae.com/blogs/blog/process-figure-ring"
    used_for: "Primary sprue/abrasive/buff/ultrasonic/steam finishing context; silver master versus final chosen metal distinguished. Reusable mould life and process times not adopted."
  - id: "beehive-rings"
    type: "extension_guidance"
    reference: "Silver Beehive Studio. How Do You Make Your Cast Rings? 9 July 2018. https://silverbeehivestudio.com/blogs/news/how-do-you-make-your-cast-rings"
    used_for: "Primary wax-investment-burnout-cast-finish route and failed-run inclusion; patina, historical percentages and kiln schedule remain countercontext rather than defaults."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for Life Cycle Assessment: Detailed guidance. First edition March 2010; sections 7.9.2-7.9.3 pp.255-272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional situations requiring allocation; real/virtual subdivision, exchange-specific determining physical causality, residual same-state/gate economic value and inventory conservation. Not manufacturing evidence or permission for default recycling credits."
  - id: "indutherm-machine"
    type: "extension_guidance"
    reference: "Indutherm. MC-series MC 16; full process and technical overview with adjacent models. https://indutherm.de/en/MC-16/MC-16"
    used_for: "Primary electrical induction/vacuum investment casting capability, actual cooling-water/inert-gas questions and adjacent models. No fixed equipment, capacity, power factor, operating settings or safety assurance adopted."
