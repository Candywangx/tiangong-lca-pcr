system_boundary:
  rules:
    - rule_id: sb_complete
      applies_to: "entire foreground"
      rule: "Include actual receipt/storage, wax and investment work, burnout, electric melting/vacuum casting, breakout and sprue separation, mechanical finishing, polishing, cleaning, inspection, process controls and all actual losses. Maintain contractor gates for outsourced casting/finishing; an external semi-finished casting carries its actual upstream steps once and cannot replace the complete-ring reference."
      source_ids:
        - goldsmith-casting
        - westhill-ring
    - rule_id: sb_upstream
      applies_to: "each whole supplied article and preparation"
      rule: "Carry mining/recycled-feed collection, refining, alloy/grain manufacture, materials, energy and transport through one compatible upstream owner. Whole grain, investment, polishing compound, cleaner and packaging are purchased once; assay, active ingredients, carrier water and attached components are subaccounts. Real onsite preparation instead lists each actual purchase, mixing energy and loss. Never purchase pure Ag/Cu again within supplied alloy."
      source_ids:
        - cookson-grain
        - ilcd-attributional-2010
    - rule_id: sb_first_release
      applies_to: "manufacturing Q and physical gates"
      rule: "Q is the calibrated net mass sum of uniquely first-quality-released complete rings. Closing FG already first released is included in Q and must not subtract manufacturing burdens or be added beside Q as another manufacturing output. Manufacturing-to-FG handover is internal; cancel matched legs in the combined gate. Physical FG gate keeps opening FG plus actual first-release transfer plus actual returns and other true inputs equal to closing FG plus full gross dispatch plus true waste/loss and separately measured transformations. Shipment/reinspection/rework does not create Q."
      source_ids:
        - westhill-ring
        - ilcd-attributional-2010
    - rule_id: sb_service
      applies_to: "actual post-release handling storage packing dispatch and work"
      rule: "Retain all actual post-release storage, handling, natural humidity exchange, packing, freight and work in the original cohort service account with original Q_H and observed horizon H. Historical manufacturing burden is retained separately; performed service is not deducted for closing FG, only unused/unassigned charge carries. Actual rework needs manufacturer/specification permission, post-work tests, acceptance and disposition; unauthorized, failed and held work still retains all occurred flows and burdens. No assumption that a damaged ring is restored. A net-delivery basis is outside this first-release PCR and requires a separately justified complete gross G/R and original-delivery-reversal bridge with stock histories."
      source_ids:
        - westhill-ring
        - ilcd-attributional-2010
    - rule_id: sb_stocks
      applies_to: "every raw WIP and non-WIP stock"
      rule: "For each raw material, WIP, unused charge and unused/unassigned non-WIP store retain actual opening/closing physical quantity in original extensive units and its complete inherited exchange-burden vector by cohort. Correct a raw purchase/issue once; already stock-corrected consumption must not receive a second stock subtraction. Include failed batches, zero-output trials, start/stop, idle, cleanup, scrap, samples and all actual rework. Q=0 retains the complete load without a unit result."
      source_ids:
        - beehive-rings
        - ilcd-attributional-2010
    - rule_id: sb_physical
      applies_to: "manufacturing FG service and consolidated balances"
      rule: "Keep physical full wet stocks and all actual gross external legs independent of burden shares. New material/water influx remains even when retained in full wet closing stock. X_in/X_out remove overlap only with the identical other same-side flow term, never with stocks or the opposite side and never merely because a card exists. Whole wet articles and disjoint separately added components must not overlap. Independently close total mass and relevant Ag/Cu/other elements and carbon/water using real phase/species evidence; a single residual cannot fit two unknowns. Distinguish free, sorbed, structural and real reaction water, ions, complexes, oxides and metallic particles. COD/VOC/PM/total metal are not molecular masses."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: sb_packaging
      applies_to: "each real packaging pool"
      rule: "For each physical pool, full opening empty/attached WIP/FG/reusable stocks + separate purchase P + supplier-included ingress I + external return received ER = full closing stocks + packaging carried on gross physical shipment S + external return sent EO + waste W, plus independently measured natural water/material changes with disjoint X bridges. Cards expose all six conditional directions. Internal reuse cancels; S follows gross shipment rather than Q or economic share. Each ingress has one upstream owner. If W pools share one mixed outlet, source-pool subaccounts sum to that single complete outlet and are not added as duplicate exchanges/providers."
      source_ids:
        - ilcd-attributional-2010
        - westhill-ring
    - rule_id: sb_assets_thermal
      applies_to: "actual assets parts fluids and thermal carriers"
      rule: "Keep dry asset-body stocks, attached water, installed fluids, new/used repair parts and every real acquisition/return/retirement separate from fulfilled-service burden. No fixed life or full machine per kg. Actual external steam/water supply-return uses full carrier kg and actual state/enthalpy alongside MJ with one provider convention; condensate to supplier is Product return. Onsite electric steam cleaning instead uses actual water/electricity once and has no fictitious external steam or boiler."
      source_ids:
        - hisae-ring
        - ilcd-attributional-2010
    - rule_id: sb_actual_atoms
      applies_to: "all actual exchange additions and direct emissions"
      rule: "Each actually present input, preparation, chemical, fuel, energy carrier, packaging material, repair part, waste outlet and environmental chemical species needs its own atomic card and real identity/quantity; unknown is not zero. Air species have disjoint actual ingress/outlet accounts with no duplicate total-air exchange. A physical-only gross card always uses complete actual V, not an allocated burden numerator. Its actual upstream/treatment or direct-emission burden is retained once in a separately tagged burden vector of the same exchange/cohort; disclosure alone cannot erase characterized direct emissions. Absent chemistry or a different outlet is never manufactured by analogy."
      source_ids:
        - ilcd-attributional-2010
    - rule_id: sb_cooling
      applies_to: "actual electric induction casting cooling gate"
      rule: "Record actual external cooling-water full supply/return kg, independently measured states/enthalpy and actual net cooling MJ under one provider convention. Real return is Product flow, not free recovered heat. An onsite closed loop instead cancels internal circulation, retains actual independently metered makeup, real water losses and actual cooler/pump electricity once. No rated machine power, fixed coolant rate, gas dose or catalogue capacity substitutes for actual measurements."
      source_ids:
        - indutherm-machine
        - ilcd-attributional-2010
