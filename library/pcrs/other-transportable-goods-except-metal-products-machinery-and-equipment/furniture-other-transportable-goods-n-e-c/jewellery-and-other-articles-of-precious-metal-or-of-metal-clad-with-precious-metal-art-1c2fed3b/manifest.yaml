  native_caveats: "Each consumer card contains complete selected native restrictions and exact property/group identities without dataset-version metadata. Restricted Chinese grid card is conditional; other countries/voltages/providers require separate compatible electricity cards. Rejected CTUe water, aluminium-content polishing preparation, furniture sandpaper, hydro-only electricity, long-term silica, high-stack CuO and Waste soot are not silently adopted. Newly qualified prepared wax, gaseous nitrogen, atmospheric argon, fossil methane, metallic Ag/CuO/SiO2 emissions, inner folding presentation box, complete electric burnout kiln, mould-holding steel flask and steel saw blade retain each actual native material/state/use/compartment and full consumer restrictions. Paper-box transport durability, oven official-Chinese wording, elemental-flow alias/LCIA distinctions and all genuine supply/phase gaps remain explicit. No fixed carton fibre mix, PAO mineral-oil substitution, source-specific soot composition, high-pressure/chemical or paper-mill steam, raw elemental silver for prealloy grain, or numeric waste percentage is adopted. Real waste outlet reporting uses full physical V with separate retained manufacturing/treatment vectors."
