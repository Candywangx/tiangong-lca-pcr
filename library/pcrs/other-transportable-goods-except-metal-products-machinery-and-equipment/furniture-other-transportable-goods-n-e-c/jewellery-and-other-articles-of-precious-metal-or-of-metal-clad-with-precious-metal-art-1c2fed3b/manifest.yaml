  core_identity: "Broad manufactured precious-jewellery Product family confirmed by proper query membership and complete exact public read; primary finished unplated silver-ring terminals and full cast-to-release route narrow the compatible family. Not a raw Ag, grain, blank, kit or generic wrong material. No unsupported fixed grade, recipe, weight, coating or review claim."
