allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory rows"
    rule: "Use attributional modelling only in the stated situations where allocation is required. First identify dedicated operations and subdivision or virtual subdivision to assign each exchange to its actual function. Industrial manufacturing guidance is not allocation authority."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_causality
    applies_to: "remaining shared exchanges"
    rule: "For each residual shared exchange identify and justify its determining physical causal relationship; a mass, time or count correlation alone is insufficient. Meter configuration-specific energy/material/service drivers and quantify the causal share with uncertainty. Different exchanges may need different justified drivers."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_residual
    applies_to: "unresolved true joint process"
    rule: "Only a truly inseparable residual without a defensible determining physical cause may use contemporaneous actual market values at the same joint-process gate and actual quality/state. Document why prior steps fail, quantities, prices, currency, period, uncertainty and sensitivity. Do not choose physical versus economic freely, impose fixed fractions, or use finished retail prices for unprocessed scrap."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_conservation
    applies_to: "all outputs and inherited vectors"
    rule: "Allocation partitions burdens, not measured gross physical quantities. Preserve all raw V_i for waste/emission/asset replacement/thermal return divided only by its true Q or original Qc when a physical intensity is needed; keep A_i/Q burden intensity distinct. Assigned shares plus retained pending/closing vectors must conserve each original exchange. No negative waste, automatic recycling credit, or removal of failed-run burdens."
    source_ids:
      - ilcd-general-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "Whole resin and concentrate; raw/WIP/regrind genealogy"
      record_type: "raw foreground record"
      raw_fields: "receipt; lot; formulation; raw opening/closing stock; purchases; external returns; withdrawals; WIP state; inherited exchange vector; heat passes; actual losses"
      collection_method: "Calibrated net weighing and stock reconciliation by whole supplied preparation; record raw amounts and genealogy before any division."
      unit: "kg"
      frequency: "Each receipt/use/shift close"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; supplier SDS/TDS; batch genealogy"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "Manufacturing electricity"
      record_type: "raw foreground record"
      raw_fields: "raw meter readings; kWh or MJ; time; voltage; geography; branch load; losses; failed/idle/start-stop; causal driver"
      collection_method: "Read import and branch meters; reconcile actual equipment including heater/screw/clamp/cooling/grinder/compressor and losses once."
      unit: "kWh; MJ"
      frequency: "Continuous with campaign reconciliation"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Bills; calibrated meters; gate diagram; event trace"
    - protocol_id: cp_service_energy
      process_id: "supply_services"
      flow_role: "Post-release electricity"
      record_type: "raw foreground record"
      raw_fields: "original cohort; Qc; H; raw kWh/MJ; meters; storage/handling events; return rework"
      collection_method: "Meter actual service interval by original release cohort, preserve raw units and historic manufacturing vectors separately."
      unit: "kWh; MJ"
      frequency: "Each interval and event"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; original release link; service ledger"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "Individual water inlet/outlet and heat carrier"
      record_type: "raw foreground record"
      raw_fields: "source; raw mass; integral volume or real rate; density measurement; temperature; pressure; enthalpy; stocks; inlet; return; bleed; evaporation; drift; condensate"
      collection_method: "Meter every actual crossing and stock; weigh or use independently measured same-substance same-state density. Match supplier heat/water accounting."
      unit: "kg; m3; MJ"
      frequency: "Each fill/return/cleaning and continuous meters"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; supplier contract; state and density evidence"
    - protocol_id: cp_utility
      process_id: "manufacture"
      flow_role: "Compressed-air state and provider"
      record_type: "raw foreground record"
      raw_fields: "supplier; pressure; temperature; moisture; volume total; actual rate/time; reference conditions; compressor boundary; condensate; leaks"
      collection_method: "Read actual volume meter and state; distinguish cumulative amount from rate; reconcile onsite generation and purchased delivery without overlap."
      unit: "m3; original state units"
      frequency: "Continuous and service events"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated flowmeter; state sensors; service agreement"
    - protocol_id: cp_aux
      process_id: "manufacture"
      flow_role: "Each single complete auxiliary or asset replacement"
      record_type: "raw foreground record"
      raw_fields: "exact identity; formulation; assay; whole quantity; raw unit; opening/closing stock and charge; actual additions F; removals; recovery; replacement; service cohort; duplicate X evidence"
      collection_method: "Weigh or meter each actual supplied preparation and reconcile charge/use/recovery; keep constituent assay non-additive and asset physical replacement distinct from burden apportionment."
      unit: "kg; m3"
      frequency: "Each use/service and stock boundary"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "SDS/TDS; maintenance history; calibration; invoices"
    - protocol_id: cp_inlet_packaging
      process_id: "manufacture"
      flow_role: "Each inbound packaging article"
      record_type: "raw foreground record"
      raw_fields: "article; composition; tare; opening empty/attached raw/WIP/FG/reusable; closing same; actual acquisitions; external return received/sent; gross shipments; waste; internal reuse; ownership"
      collection_method: "Weigh each actual article and reconcile boundary_packaging by material and cohort; separate provider-included packaging from extra purchases."
      unit: "kg; count"
      frequency: "Each movement and stock census"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare samples; provider accounting; tickets; stock census"
    - protocol_id: cp_packaging
      process_id: "supply_services"
      flow_role: "Each outgoing packaging article"
      record_type: "raw foreground record"
      raw_fields: "article; composition; tare; opening empty/attached WIP/FG/reusable; closing same; acquisitions; external returns; gross shipments; waste; ownership; cohort burden"
      collection_method: "Measure each whole bag/carton separately and apply the complete packaging physical balance; carry historical stock/service burdens without new purchases."
      unit: "kg; count"
      frequency: "Each movement and stock census"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare; composition; shipment/return/waste tickets"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "Each actual waste at its own destination"
      record_type: "raw foreground record"
      raw_fields: "exact stream; origin; gross wet mass; moisture; component assay; stocks; actual receiver; treatment route; real product/waste status; uncertainty"
      collection_method: "Weigh complete individual waste streams and reconcile independent composition, origin partitions and destination tickets without gross-plus-component double counting."
      unit: "kg"
      frequency: "Each removal/discharge and stock boundary"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; laboratory method; receiver tickets"
    - protocol_id: cp_emissions
      process_id: "manufacture"
      flow_role: "Each real chemical species and medium"
      record_type: "raw foreground record"
      raw_fields: "species; CAS; phase; source; medium; gross generated/captured/emitted; concentration; real gas state; integral volume or rate/time; detection limit; uncertainty; independent element balance"
      collection_method: "Species-resolved sampling with matched actual flow/state or independently justified chemical-specific balance; retain undetected and unmeasured separately. Do not fit two unknowns from one residual."
      unit: "kg; original analytical units"
      frequency: "Representative normal/start-up/upset and maintenance events"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Lab method; raw time series; detection limits; charge/balance evidence"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "Unique first release and complete bare-comb mass"
      record_type: "raw foreground record"
      raw_fields: "configuration; lot; unique release ID; prior-release flag; cooled accepted net mass; gross; tare; tooth/backbone integrity; surface/dimensional/mechanical inspection; failed test; rework; WIP"
      collection_method: "Weigh cooled complete accepted bare combs on calibrated scales, exclude detachable packaging, reconcile actual drawing/tests and deduplicate against previous FG/returns before summing raw Q kg."
      unit: "kg"
      frequency: "Every first release and stock boundary"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated scale; configuration; acceptance and release ledger"
    - protocol_id: cp_fg
      process_id: "supply_services"
      flow_role: "FG physical movements and historic burdens"
      record_type: "raw foreground record"
      raw_fields: "original release/cohort/Qc; opening/closing FG; inherited vectors; new Q transfer; gross shipment; external return; original delivery reverse; reshipment; actual incremental rework F; duplicate X; loss; H"
      collection_method: "Reconcile calibrated warehouse weights and actual shipments/returns with the original release and inherited exchange vector. Reinspection or reshipment never counts as new output."
      unit: "kg; original vector units"
      frequency: "Each movement and boundary census"
      temporal_coverage: "Complete declared interval and historical stocks including failure and Q=0"
      site_scope: "Actual site/line/configuration and original release cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Shipment/return documents; original vectors; stock count"
  calculation_rules:
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert raw units before attribution: MJ = kWh × 3.6; retain already integrated volume; integrate only a true rate over its measured interval; mass = volume × independently measured same-substance same-state density. Preserve original observation and uncertainty."
      inputs:
        - raw_amount
        - raw_unit
        - measured_state
        - cp_energy
        - cp_service_energy
        - cp_water
        - cp_utility
      output: "converted_raw"
      source_ids: []
    - id: calc_release
      applies_to: "first_release"
      rule: "Q = sum of unique newly first-released complete accepted bare-comb kg for the declared configuration and cohort. Same-cohort closing FG is already counted. Prior releases, returns and reinspection contribute no new Q."
      inputs:
        - cp_release
        - configuration
        - cohort
      output: "Q"
      source_ids:
        - vickky-comb-manufacture
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "Construct unnormalised A_i from converted raw records, real direct/shared attribution and opening/closing inherited WIP/asset vectors. Cancel only verified internal transfers and exact same-side duplicates X; include real new F and all failures/idle/cleanup. For service intervals use the matched original cohort and Qc; do not manufacture its historical burden again. Keep physical V_i independently unchanged. For a measured physical output, returned product, asset replacement or heat-carrier crossing, the inventory quantity uses its full V_i at its actual gate/cohort: set its quantity numerator A_i = V_i. Economic or service-burden partitions apply only to associated environmental vectors and never shrink this exchange. The resulting x_i is V_i divided once by its true Q or original Qc. For purchased inputs keep actual measured consumption and attribution separately visible."
      inputs:
        - converted_raw
        - inherited_vectors
        - actual_F
        - verified_X
        - allocation_evidence
        - cp_fg
      output: "A_i"
      source_ids:
        - ilcd-general-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q for Q>0 exactly once. A_i is the attributable unnormalised amount in the card unit; Q is calc_release first-release kg. For a historical cohort the same operation uses its original Qc instead of current Q. Cards and protocol aggregation only reference this stored result. Q=0 retains raw vectors with no unit result."
      inputs:
        - A_i
        - Q
        - Qc
        - calc_attribution
        - calc_release
      output: "x_i"
      source_ids: []
    - id: calc_physical
      applies_to: "all processes"
      rule: "Close raw-stock, manufacturing, FG and consolidated balances under boundary_wip/boundary_physical/boundary_fg. Manufacturing opening WIP/in-process stocks + actual net material withdrawals and external physical inputs = new Q + closing WIP/in-process stocks + each gross external output/loss. Internal transfers cancel. Use V_i/true Q or original Qc only for a separate physical intensity; do not replace V_i by economically allocated A_i."
      inputs:
        - cp_material
        - cp_aux
        - cp_water
        - cp_waste
        - cp_emissions
        - cp_release
        - cp_fg
      output: "physical_gate_balances"
      source_ids: []
    - id: calc_packaging
      applies_to: "all packaging rows"
      rule: "Apply boundary_packaging separately to each actual article/material using measured tare/count or raw mass. Include attached opening/closing raw/WIP/FG and reusable stock. Gross shipments and gross returns remain separate. Only new external acquisition creates new purchase burden."
      inputs:
        - cp_packaging
        - cp_inlet_packaging
        - ownership
        - inherited_packaging_vectors
      output: "packaging_balances"
      source_ids: []
    - id: calc_species
      applies_to: "manufacture"
      rule: "Independently reconcile total physical mass, each evidenced relevant C/H/O/additive element, molecular releases, free water, real reaction water and captured/liquid/gas destinations. Use measured composition and species evidence, not one forced residual. Preserve unresolved differences with uncertainty."
      inputs:
        - cp_material
        - cp_aux
        - cp_water
        - cp_waste
        - cp_emissions
        - measured_composition
      output: "species_element_balances"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flows"
      requirement: "Require actual full formulation/state/route/type/medium and one compatible provider; a broad name or classification is insufficient."
      evidence: "Supplier SDS/TDS; native restrictions; configuration and receiver evidence"
    - id: dq_measurement
      applies_to: "all raw records"
      requirement: "Keep calibrated raw readings, units, state, detection limits and uncertainty; no fixed mass, density, composition, yield, emission or energy default."
      evidence: "Raw measurements and calibration"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Cover full H including failures, zero output, actual unapproved work and all stocks/history. Unmeasured is not zero; actual absent is distinct from not investigated."
      evidence: "Event census; material/element/energy closure; missingness register"
    - id: dq_translation
      applies_to: "all dataset records"
      requirement: "Bilingual meanings and reference basis must agree; do not infer product safety or certification from marketing or engineering checks."
      evidence: "Aligned source/translation and actual product tests"
validation_rules:
  - rule_id: validation_identity
    applies_to: "all inventory rows"
    rule: "Enforce the selected whole-comb PP route and each native restriction in its full context; unknown core terminal or route evidence requires review, not a successful applicability result."
    source_ids:
      - vickky-pp-comb-family
      - vickky-comb-materials
  - rule_id: validation_release
    applies_to: "first_release"
    rule: "Check one unique complete Product reference row, calibrated net Q, identical bilingual basis and no duplicate closing FG/reinspection output."
    source_ids: []
  - rule_id: validation_accounting
    applies_to: "all processes"
    rule: "Require unallocated physical and element/water checks independently of burden attribution; reconcile WIP/FG history, each packaging ledger and actual external utility returns. Reject same wet stream plus its constituents being added twice."
    source_ids: []
  - rule_id: validation_normalisation
    applies_to: "all inventory rows"
    rule: "Raw collection does not divide; calc_reference applies A_i/Q or the original-cohort equivalent once. Physical V_i remains available and Q=0 has no unit result. Unknown conversion is unresolved."
    source_ids: []
  - rule_id: validation_species
    applies_to: "all wastes and emissions"
    rule: "Check species/CAS/phase/origin/medium and measured uncertainty. An aggregate pollution indicator or plausible polymer pathway is not actual molecular evidence. Retain every real additional exchange, even if it invalidates the selected route."
    source_ids:
      - ifc-plastic-products-2007
  - rule_id: validation_allocation
    applies_to: "shared exchanges"
    rule: "Require sequential subdivision then exchange-specific determining physical causality then only justified market-value residual; retain all physical gross flows and burden-vector conservation."
    source_ids:
      - ilcd-general-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared complete bare-comb manufacturing component plus separately identified real post-release services."
  allowed_use: "Only the specified non-electric single-piece solid uncoated PP configuration and matched supply/service gates."
  excluded_use: "Whole CPC leaf coverage; other polymers or comb parts; electric styling; product certification; a fixed lifespan; automatic recycled-content or avoided-product credit."
  required_metadata: "All required qualifiers; one provider per exchange; actual configuration/site/period/cohort; raw and inherited vectors; release and physical gates."
  required_quality_disclosure: "Measured scope; unmeasured quantities; provider/UUID gaps; source limits; uncertainty; failed/zero-output and actual off-route work; allocation sensitivity."
  update_trigger: "Changes to geometry/polymer/formulation, mould/conditioning/colour route, acceptance gate, provider utilities, packaging, emissions, allocation or evidence."
