      markdown: "## 7. Allocation and Co-product Handling\n\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_scope | all inventory rows | Use attributional modelling only in the stated situations where allocation is required. First identify dedicated operations and subdivision or virtual subdivision to assign each exchange to its actual function. Industrial manufacturing guidance is not allocation authority. | ilcd-general-2010 |\n| allocation_causality | remaining shared exchanges | For each residual shared exchange identify and justify its determining physical causal relationship; a mass, time or count correlation alone is insufficient. Meter configuration-specific energy/material/service drivers and quantify the causal share with uncertainty. Different exchanges may need different justified drivers. | ilcd-general-2010 |\n| allocation_residual | unresolved true joint process | Only a truly inseparable residual without a defensible determining physical cause may use contemporaneous actual market values at the same joint-process gate and actual quality/state. Document why prior steps fail, quantities, prices, currency, period, uncertainty and sensitivity. Do not choose physical versus economic freely, impose fixed fractions, or use finished retail prices for unprocessed scrap. | ilcd-general-2010 |\n| allocation_conservation | all outputs and inherited vectors | Allocation partitions burdens, not measured gross physical quantities. Preserve all raw V_i for waste/emission/asset replacement/thermal return divided only by its true Q or original Qc when a physical intensity is needed; keep A_i/Q burden intensity distinct. Assigned shares plus retained pending/closing vectors must conserve each original exchange. No negative waste, automatic recycling credit, or removal of failed-run burdens. | ilcd-general-2010 |\n\n\n"
