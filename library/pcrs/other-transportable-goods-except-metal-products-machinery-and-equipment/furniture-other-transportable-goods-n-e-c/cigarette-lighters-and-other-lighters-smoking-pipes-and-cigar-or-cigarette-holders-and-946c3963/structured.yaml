          column: 1
      markdown: "## 9. Validation Rules\n\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| validation_identity | all inventory rows | Enforce the selected whole-comb PP route and each native restriction in its full context; unknown core terminal or route evidence requires review, not a successful applicability result. | vickky-pp-comb-family; vickky-comb-materials |\n| validation_release | first_release | Check one unique complete Product reference row, calibrated net Q, identical bilingual basis and no duplicate closing FG/reinspection output. |  |\n| validation_accounting | all processes | Require unallocated physical and element/water checks independently of burden attribution; reconcile WIP/FG history, each packaging ledger and actual external utility returns. Reject same wet stream plus its constituents being added twice. |  |\n| validation_normalisation | all inventory rows | Raw collection does not divide; calc_reference applies A_i/Q or the original-cohort equivalent once. Physical V_i remains available and Q=0 has no unit result. Unknown conversion is unresolved. |  |\n| validation_species | all wastes and emissions | Check species/CAS/phase/origin/medium and measured uncertainty. An aggregate pollution indicator or plausible polymer pathway is not actual molecular evidence. Retain every real additional exchange, even if it invalidates the selected route. | ifc-plastic-products-2007 |\n| validation_allocation | shared exchanges | Require sequential subdivision then exchange-specific determining physical causality then only justified market-value residual; retain all physical gross flows and burden-vector conservation. | ilcd-general-2010 |\n\n\n"
