system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Include all actual receiving, preparation, moulding/cooling, demoulding/trimming, internal grinding, inspection, tests, maintenance and utilities. Do not assume drying, mould-release agent, printing, boiler, compressed-air plant or chiller; when present record their real inputs/losses separately. Every real additional chemical, fuel, waste, refrigerant and emission species needs its own atomic row before dataset completion."
      source_ids:
        - ineos-pp-processing-2007
        - ifc-plastic-products-2007
    - rule_id: boundary_formulation
      applies_to: "all supplied preparations"
      rule: "Purchase each actual complete resin, colour concentrate, cleaner, hydraulic fluid and packaging article once. Assay, carrier water, pigment and stabiliser are nested constituent accounts. Onsite preparation replaces the purchased-preparation account with each real purchased ingredient and real mixing losses/energy; never charge both routes."
      source_ids:
        - ineos-pp-processing-2007
        - ifc-plastic-products-2007
    - rule_id: boundary_regrind
      applies_to: "manufacture"
      rule: "Track clean internal sprue/runner/reject regrind by source lot, contamination, heat passes, inventory and actual reuse suitability. Internal transfers cancel and conserve inherited burdens; they create neither purchases, coproducts, new first release nor avoided-virgin credit. Unfit scrap remains actual waste. No guide percentage is a default."
      source_ids:
        - ineos-pp-processing-2007
        - ifc-plastic-products-2007
    - rule_id: boundary_release
      applies_to: "first_release"
      rule: "Q counts each new complete bare comb once after final acceptance. Same-cohort closing FG is already included; do not add it again as production. Existing released stock, reinspection, external returns and reshipment never generate Q. Retain real failed-shot and destructive-test burden and disposition."
      source_ids:
        - vickky-comb-manufacture
    - rule_id: boundary_wip
      applies_to: "manufacture"
      rule: "Keep raw-material physical stocks apart from their environmental burdens. Opening raw stock plus purchases and external returns received equals closing raw stock plus withdrawals and external returns sent, by whole supplied material. Opening WIP quantity and every inherited exchange vector transfer explicitly into current work; closing WIP carries its measured state and vector forward. Do not charge receipts as consumption or reset inherited vectors to zero."
      source_ids: []
    - rule_id: boundary_fg
      applies_to: "supply_services"
      rule: "For each original cohort close the actual FG/repair gate: opening FG + new Q transfer + gross external returned combs + opening repair WIP + actual new material/water inputs = closing FG + gross outward combs + closing repair WIP + actual removed material and post-release waste/emissions. Unissued repair stock is reconciled separately. Within repair, incoming comb plus real new inputs and opening repair WIP equals outgoing comb plus removed material/loss and closing repair WIP; new and removed quantities need not be equal. Carry historical manufacturing vectors and the original-delivery reversal without manufacturing them again. Reinspection/reshipment never creates Q; all real incremental work belongs to original Qc even if unauthorised, unsuccessful or off-route, with actual acceptance/disposition held explicitly. Do not presume a broken integral comb can be restored. Cancel only paired internal first-release/repair transfers on consolidation."
      source_ids: []
    - rule_id: boundary_physical
      applies_to: "all physical gates"
      rule: "Before allocation close total mass and relevant constituent/element balances using gross real flows, opening/closing physical stocks and uncertainty. Energy is not a mass term. Keep receiving, manufacturing, FG and consolidated gates consistent; internal transfers cancel only when both sides represent the same actual transfer. A burden allocation or stock-service assignment must not shrink a physical waste, emission, replacement or heat-carrier return."
      source_ids: []
    - rule_id: boundary_water_heat
      applies_to: "water and utility rows"
      rule: "For each installed loop retain gross fill/inlet/return, opening/closing stock, actual evaporation, liquid drift, bleed, carryover and condensate. Repeated circulation is not fresh consumption. External heat-carrier water returns are Product outputs with actual state and enthalpy; define one main supplier water/energy account and a non-additive bridge. Do not double-charge onsite compressor/chiller electricity plus a purchased version of the same internal utility. For pneumatic carrier gas retain measured pressure/temperature/moisture and independently composition-supported gross inlet/exhaust physical subaccounts, explicitly identifying real nitrogen, oxygen, argon and water partitions. Do not add the same whole air and its components or duplicate net oxidative oxygen uptake within gross intake oxygen. Add separate specific rows for actual compressor condensate, liquid drift and new chemicals; never hide them in zero or other."
      source_ids:
        - ifc-plastic-products-2007
    - rule_id: boundary_packaging
      applies_to: "each packaging article"
      rule: "For EACH whole packaging material close O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O/C are disjoint empty, attached raw/WIP/FG and reusable stocks; P is separate acquisition, I actual supplier-included ingress, ER external returns received, S packaging leaving with gross physical shipments, EO external returns sent and W actual waste. F_in/F_out are independently evidenced real new material/repair/liquid or atmospheric-water increments/removals, including natural moisture change without a repair event; not fitted residuals. X may subtract ONLY proved duplicate SAME-side OTHER actual flow terms with paired IDs, never stocks, opposite flows or real newly retained ingress. Full wet closing mass and its real incoming water/material both remain. Whole supplied article and its coating/glue/water are one primary account; actual separate onsite supplies use measured non-additive component-to-assembly bridges. Internal reuse cancels, with no new purchase/Q/coproduction/credit. One actually collected mixed-waste outlet has one compatible whole-stream receiver/provider: measured origin-W children conserve the total as non-additive partitions, never invented outlets or duplicate treatment charges."
      source_ids:
        - vickky-pp-comb-family
        - vickky-comb-manufacture
    - rule_id: boundary_species
      applies_to: "all wastes and elementary exchanges"
      rule: "Keep every real molecular species, phase, origin, receiving medium and gross/net amount explicit. IFC potential-emission classes are screening evidence only. Total VOC, aldehydes, COD, TOC and TSS do not specify one molecular mass. Whole wet waste and its components use one non-additive account or measured origin partitions; never sum both, and keep one actual receiver/provider."
      source_ids:
        - ifc-plastic-products-2007
    - rule_id: boundary_reaction
      applies_to: "manufacture"
      rule: "Do not treat melting/cooling/crystallisation as polymer synthesis or assign stoichiometric reaction water. Distinguish free water, actual reaction water, phase-change water and any independently identified structural water. Total mass and relevant C/H/O or additive elements require independent composition/species evidence; one residual cannot identify two unknowns or become a default emission."
      source_ids:
        - ineos-pp-processing-2007
        - ifc-plastic-products-2007
    - rule_id: boundary_actuality
      applies_to: "all processes"
      rule: "Retain every actual failed, idle, start/stop, cleanout, experimental, rework and unauthorised/off-route operation. Eligibility restrictions do not delete physical activity. Treat F as a genuinely new incremental exchange; X may remove only independently demonstrated duplicate reporting of that same exchange on the same side of another account. New repair material, cleaning water or replacement is never X."
      source_ids: []
    - rule_id: boundary_assets
      applies_to: "all physical assets and charges"
      rule: "Installed mould/machine/insert, hydraulic charge and adsorbent stocks retain gross opening/closing physical quantities, real receipts, full removals and every newly retained material/water increment. Separate the associated inherited asset-service vectors and remaining unassigned burden. Only actual service/capacity/maintenance evidence may allocate service; no default lifetime or whole asset per kg. Do not apply a second stock correction to already corrected consumption or subtract same-cohort closing FG manufacturing burden. Use the same whole-wet O/P/I/ER/F/X logic where applicable, with physical and burden ownership explicit."
      source_ids:
        - ilcd-general-2010
