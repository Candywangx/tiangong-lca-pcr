    unresolved_support_fields:
      - reference_product_flow_uuid
  source_limits:
    - Manufacturer family and Dynarex terminal evidence do not establish one shared SKU, virgin formulation, mass or factory. Verify actual route and quality records before applicability.
    - INEOS and IFC support process screening, not default quantities or species. ILCD allocation applies only to allocation-required attributional cases. Core modules are scaffolds; the PEF candidate module is not adopted as approval.
    - Public historical Tiangong Mass and unit-group support verified at commit a55b302e1ca1bf190e4c412c74e046e2d54d32f6; not a live platform reading. Historical generic commodity-plastics identity is not adopted for the complete comb.
  neighbouring_method_comparison:
    reference: docs/adr/0419-accept-injection-moulded-reusable-polypropylene-bowls.md
    pcr_id: pcr.other-transportable-goods-except-metal-products-machinery-and-equipment.rubber-and-plastics-products.injection-moulded-reusable-polypropylene-bowls
    use: Compared first-release gate, separated service account, regrind and allocation hierarchy; rechecked INEOS, IFC and ILCD originals independently. Bowl identity, food-contact restrictions, SKU evidence and accepted mapping do not transfer to combs.
  ordinary_gaps:
    - Collect actual Q, grade and formulation, configuration, calibrated meters, waste destinations, species evidence, WIP and release cohorts, utility providers and optional packaging; no invented quantities, ranges, lifetimes or factors.
    - Exact flow UUIDs remain unresolved. Retained atomic cards require individual native identity/type/state/compartment and provider compatibility verification; unavailable live lookup is not evidence of absence.
