  scope_decision: Retain original identity for complete non-electric single-piece solid unfilled virgin-PP injection-moulded hair comb manufacture to first quality release. Conditional colour concentrate and separately linked later services. Narrower scope accepted under docs/adr/2026-11-20-accept-cpc-38994-polypropylene-hair-comb.md.
