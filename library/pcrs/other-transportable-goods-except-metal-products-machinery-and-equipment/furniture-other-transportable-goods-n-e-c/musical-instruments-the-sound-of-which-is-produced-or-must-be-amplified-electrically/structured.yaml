  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert each undivided raw amount/rate into that row native extensive unit before assignment. Sum integrated measurements once; integrate genuine rates over measured time. kWh to MJ uses 3.6. Volume/mass requires independent measured density at the same state; never infer it from a secondary property coefficient."
      inputs:
        - raw_amount
        - raw_unit
        - calibration
        - measured_state
        - independent_density
      output: "U_native; V_native"
      source_ids:
        - yamaha-craft
    - id: calc_burden
      applies_to: "all inventory rows"
      rule: "For burden cards only, derive A from full exchange-vector B_open + U_owned - B_close of raw/WIP/unused-unassigned stores and legitimate cohort assignment after exclusive/virtual subdivision and exchange-specific allocation. Already_net skips repeated stock subtraction. Closing released FG and performed original-cohort service are never B_close deductions. Ordinary manufacturing waste/sales/failed work remain assigned unless evidenced real other function and justified single handover."
      inputs:
        - B_open
        - U_owned
        - B_close
        - already_net
        - assignment_evidence
      output: "A"
      source_ids:
        - ilcd-allocation
    - id: calc_quotient
      applies_to: "all inventory rows"
      rule: "q = N / Q_basis once. For manufacture burden N=A and Q_basis=Q; actual service burden uses original Q_c. For gross and internal-event disclosure N is the complete actual V, never a burden vector or allocated/stock-corrected quantity, with current Q or original Q_c as documented. Reference output is 1 kg. If denominator is zero retain real raw burden/V and issue no unit result. Card amount and aggregation only reference this same result, not a second quotient."
      inputs:
        - A
        - V
        - Q
        - Q_c
        - actual_event_role
      output: "q"
      source_ids:
        - ilcd-allocation
    - id: calc_physical
      applies_to: "all inventory rows"
      rule: "Maintain independent full physical balances: manufacture opening raw/WIP + external gross inputs = closing raw/WIP + first-release internal transfer + actual waste/emission/return exits; FG opening + first-release transfer + actual returns and added material/water = closing wet FG + gross shipments + actual return/waste/species exits. Combined gate cancels paired internal transfer once. Packaging/assets are disjoint subgates. Full gross quantities never receive economic burden fractions. X_in/X_out removes overlap with OTHER same-side flow terms only, never real influx retained in full wet closing stock."
      inputs:
        - complete_gross_legs
        - opening_stock
        - closing_stock
        - paired_internal_transfer
        - same_side_overlap
      output: "independent_physical_balances"
      source_ids:
        - ilcd-allocation
    - id: calc_packaging
      applies_to: "all inventory rows"
      rule: "For each article/grade pool use O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O and C are the complete wet opening/closing empty, WIP-attached, FG-attached and reusable stocks. F_in/F_out are independently measured actual repair additions, removed components, water and other real additions/losses crossing this pool boundary, each with its direction and physical state. X_in/X_out remove only documented portions already counted by OTHER real flow terms on the SAME side; never subtract stocks, opposite-side terms or a new influx merely because it remains in full wet C. Choose a whole-wet-article balance OR an equivalent disjoint component bridge, not both additively; embedded supplied water/components are owned once, while genuinely new repair/water retained in C remains a real influx. Six cards represent six real directions/events; I retains supplier-included ingress and exactly one upstream owner; S is full mass with gross physical shipment. Internal reuse cancels, no net-Q entry, repeat procurement or credit. Actual water gain/loss remains separately measured. Source W is actual generation/transfer from this pool into its matched receiving container, not an assumed external Waste outlet; reconcile that container stock and its real external outlet under calc_packaging. For each matched receiver use opening_container + source_W + other_container_in = closing_container + mixed_external_out + other_container_out, with complete wet container contents on the same time/state basis. source_W is the sum of paired actual source contributions; other_container_in/out are only separate non-overlapping actual container ingress/egress. Container accumulation remains closing stock, not a fabricated mixed external outlet; a later real external outlet is recorded when it occurs. At consolidation cancel source W against the matched container receipt once; total container mass and its sources are non-additive. Only the actual measured mixed external Waste outlet has one transport/treatment provider, never an extra provider for source W generation or stock accumulation. If exits differ physically, replace by the actual separate atomic Waste streams before use; never invent exits for symmetry. Ordinary manufacturing/failed/sample waste keeps production and treatment burdens unless real other cohort/function and justified handover establish one vector transfer."
      inputs:
        - opening_pool
        - P
        - I
        - ER
        - F_in
        - X_in
        - closing_pool
        - S
        - EO
        - W
        - F_out
        - X_out
        - paired_receiver
        - opening_container
        - source_W
        - other_container_in
        - closing_container
        - mixed_external_out
        - other_container_out
      output: "packaging_pool_balance"
      source_ids:
        - yamaha-qc
        - ilcd-allocation
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Require complete positive instrument scope, exact native whole/part, passive/electric, CAS, material, form, route, geography, medium/type, property/unit and actual provider compatibility. Ordinary unresolved auxiliary identity or future measurements are disclosed and not evidence of a core hold; unconfirmed core whole-product identity prevents usable methodology."
      evidence: "full native record and actual supplier BOM/route"
    - id: dq_sources
      applies_to: "all sources"
      requirement: "Use original full scope and adjacent alternatives; no single example numerical recipe. Primary industrial process descriptions do not authorize LCA allocation."
      evidence: "original plus source-specific applicability and exclusions"
    - id: dq_complete
      applies_to: "all ledgers"
      requirement: "Check source-specific applicability and exclusions, upstream ownership, physical/burden bridges, actual postwork permissions/tests/disposition and all missing atoms. Declare actual site, periods, sample coverage, uncertainty and incompleteness; structural/schema checks establish no scientific or translation approval."
      evidence: "raw calibrated records, sample coverage, uncertainty and failed work"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference and every selected exchange"
    rule: "Require complete positive instrument scope, exact native whole/part, passive/electric, CAS, material, form, route, geography, medium/type, property/unit and actual provider compatibility. Ordinary unresolved auxiliary identity or future measurements are disclosed and not evidence of a core hold; unconfirmed core whole-product identity prevents usable methodology."
