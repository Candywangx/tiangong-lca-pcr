system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "whole manufacture"
      rule: "Preserve raw wood conditioning, machining/routing, neck shaping, actual joining/fretting, separate finishing, bolt-on fit, whole supplied hardware/passive electrical assembly, stringing, setup, electroacoustic and exterior first-release inspection. No purchased-finished-guitar repacking route. Actual supplier work is upstream once; on-site manufacture of a purchased component requires a disjoint replacement with every real raw input, operation, loss and paired handoff."
      source_ids:
        - yamaha-wood
        - yamaha-shaping
        - yamaha-finish
        - yamaha-craft
        - duncan-passive-twoh
    - rule_id: boundary_q_gate
      applies_to: "first release"
      rule: "Q sums calibrated net whole-instrument masses of unique newly first-released serials in the manufacturing cohort. Closing released FG is already in Q, never a second production output or a manufacturing burden deduction. Delivery, reinspection, postwork and returned instruments create no new Q. Q=0 retains all real burdens without unit results."
      source_ids:
        - yamaha-craft
        - yamaha-qc
    - rule_id: boundary_vectors
      applies_to: "every burden exchange"
      rule: "Retain opening/closing raw, WIP and unused/unassigned non-WIP stores with complete inherited exchange vectors and origin. Available burden vector is B_open + U_owned - B_close in those stores, followed by legitimate once-only cohort assignment. Exclude already released FG from B_close manufacture. Already stock-corrected consumption receives no second stock correction. Failed batches, samples, start/stop, idle, cleanup, testing and rework remain. Ordinary sold/external waste never automatically becomes a transfer to another function."
      source_ids:
        - ilcd-allocation
        - yamaha-qc
    - rule_id: boundary_physical
      applies_to: "manufacture FG combined"
      rule: "Maintain independent full physical balances: manufacture opening raw/WIP + external gross inputs = closing raw/WIP + first-release internal transfer + actual waste/emission/return exits; FG opening + first-release transfer + actual returns and added material/water = closing wet FG + gross shipments + actual return/waste/species exits. Combined gate cancels paired internal transfer once. Packaging/assets are disjoint subgates. Full gross quantities never receive economic burden fractions. X_in/X_out removes overlap with OTHER same-side flow terms only, never real influx retained in full wet closing stock."
      source_ids:
        - ilcd-allocation
        - yamaha-qc
    - rule_id: boundary_service
      applies_to: "original cohort"
      rule: "Actual postrelease storage, conditioning, handling, packaging, retuning and attempted work remain attributed to original Q_c over observed H, even when FG is held. Only unused/unassigned service or charge carries; future unperformed work remains unknown. Continued conformity after actual rework requires manufacturer/spec permission, postwork tests, acceptance and real hold/waste disposition; absence/failure of permission/tests cannot erase already occurred materials, operations or burdens. Natural humidity exchange needs no invented repair permission."
      source_ids:
        - yamaha-qc
        - ilcd-allocation
    - rule_id: boundary_whole_inputs
      applies_to: "each purchase"
      rule: "Buy every whole supplied component, formulation, wet article and package once, including embedded water/material/fasteners. Composition/assay is a non-additive subledger. Only independently purchased actual additions become additional exchanges; actual on-site compounding retains each purchased ingredient, energy and loss."
      source_ids:
        - yamaha-craft
        - yamaha-finish
        - duncan-passive-twoh
    - rule_id: boundary_packaging
      applies_to: "each actual pool"
      rule: "For each article/grade pool use O + P + I + ER + F_in - X_in = C + S + EO + W + F_out - X_out. O and C are the complete wet opening/closing empty, WIP-attached, FG-attached and reusable stocks. F_in/F_out are independently measured actual repair additions, removed components, water and other real additions/losses crossing this pool boundary, each with its direction and physical state. X_in/X_out remove only documented portions already counted by OTHER real flow terms on the SAME side; never subtract stocks, opposite-side terms or a new influx merely because it remains in full wet C. Choose a whole-wet-article balance OR an equivalent disjoint component bridge, not both additively; embedded supplied water/components are owned once, while genuinely new repair/water retained in C remains a real influx. Six cards represent six real directions/events; I retains supplier-included ingress and exactly one upstream owner; S is full mass with gross physical shipment. Internal reuse cancels, no net-Q entry, repeat procurement or credit. Actual water gain/loss remains separately measured. Source W is actual generation/transfer from this pool into its matched receiving container, not an assumed external Waste outlet; reconcile that container stock and its real external outlet under calc_packaging."
      source_ids:
        - yamaha-qc
        - ilcd-allocation
    - rule_id: boundary_mixed_waste
      applies_to: "packaging W and other source contributions"
      rule: "When one actual mixed exit exists, W pool cards are measured internal contributions, paired to receiving subledger and cancelled at consolidation; only the measured mixed external Waste row and one transport/treatment provider remain. Total and sources are non-additive. If exits differ physically, replace by the actual separate atomic Waste streams before use; never invent exits for symmetry. Ordinary manufacturing/failed/sample waste keeps production and treatment burdens unless real other cohort/function and justified handover establish one vector transfer."
      source_ids:
        - ilcd-allocation
        - yamaha-qc
    - rule_id: boundary_utilities_assets
      applies_to: "actual utilities and equipment"
      rule: "No default boiler, steam, industrial gas, fuel, refrigerant or equipment lifetime. Preserve native extensive dimensions, actual carrier mass/phase/state/enthalpy and supplier water/energy ownership, including actual Product returns. Full acquisition/installed/retirement mass and new/old repair materials/fluid stocks stay separate from period service burden. Add any actually present omitted atom and its protocol before dataset use; absence is evidenced, never filled with zero."
      source_ids:
        - ilcd-allocation
        - yamaha-craft
