allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all joint burdens"
    rule: "This is attributional manufacturing, not a substitution/avoided-product model. First assign exclusive processes and virtual subdivisions to their actual cohort/function. Assess each remaining exchange for determining physical causality: actual material incorporation, machining duty, coating area with actual intensity, drying moisture removal, or service duration/capacity only when causal. No arbitrary mass/economic choice and no one fraction for every exchange."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_residual
    applies_to: "truly inseparable remainder"
    rule: "Only after demonstrating that subdivision and exchange-specific determining physical causality cannot resolve a real remainder, define the actual common process gate and actual coproduct conditions and contemporaneous market values there. Derive price to that state/gate if necessary with traceable evidence and sensitivity. Do not use final retail guitar prices for upstream raw scrap, fixed ratios or automatic credits for waste sale."
    source_ids:
      - ilcd-allocation
  - rule_id: allocation_gross
    applies_to: "all physical and service ledgers"
    rule: "Allocation affects burden vectors only. Every gross packaging, asset, repair, water, species, failed-work and external-return event keeps its complete V. One provider/transfer owner per real burden dimension; internal components/handoffs cancel at consolidation. Performed original-cohort service remains assigned when FG is held."
    source_ids:
      - ilcd-allocation
