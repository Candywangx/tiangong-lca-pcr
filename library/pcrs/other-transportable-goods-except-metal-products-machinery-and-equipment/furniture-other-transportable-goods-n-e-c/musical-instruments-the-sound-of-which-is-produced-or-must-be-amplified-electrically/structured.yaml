  - rule_id: validation_release
    applies_to: "Q and stock"
    rule: "Check each serial once at first complete release and calibrated net mass. Require raw/WIP/non-WIP inherited vectors, retained closing released FG, all failed/Q0/startstop/idle/cleanup/test work and no double stock correction. No delivery/retest creates output."
    source_ids:
      - ilcd-allocation
      - yamaha-craft
      - yamaha-qc
  - rule_id: validation_atoms
    applies_to: "all rows and raw records"
    rule: "Each card has one identity/event and ten fields with actual conditional applicability; unknown is not zero. Whole purchases versus composition bridges, species/phase and all packaging six legs must reconcile. Gross V must never be stock-corrected or economically scaled; single quotient only."
