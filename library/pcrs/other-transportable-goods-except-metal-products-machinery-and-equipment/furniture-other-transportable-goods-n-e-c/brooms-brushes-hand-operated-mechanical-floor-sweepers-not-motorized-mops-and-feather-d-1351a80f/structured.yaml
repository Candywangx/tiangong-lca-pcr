system_boundary:
  rules:
    - rule_id: boundary_manufacture
      applies_to: "p_make"
      rule: "Include the complete operation sequence in §1 through first whole-unit release. Purchased yarn/handle/wire carries its actual supplier state once; do not substitute bought finished mops plus packaging for manufacture. Any real additional sewing, coating, machining, moulding, washing, heating or repair requires separately named actual inputs/outputs and retained losses; eligibility cannot delete them."
      source_ids:
        - m2-cotton-yacht-mop
        - giori-libo-cotton-cutting
    - rule_id: boundary_release
      applies_to: "finished_mop"
      rule: "Q counts first release exactly once and includes qualifying closing FG of that cohort. A subsequent FG bridge is opening FG + first release + external returns received = closing FG + gross outward shipments + reject/scrap exits, with actual repairs and water changes explicitly reconciled. Closing FG is not another manufacturing output in addition to Q. Cancel internal first-release transfers in the combined gate."
      source_ids: []
    - rule_id: boundary_stocks
      applies_to: "p_make; p_service"
      rule: "Record physical raw stock and WIP by constituent/state separately from inherited burden vectors by exchange and cohort. For each raw input reconcile opening + purchases + external returns = closing + actual issues + supplier returns + losses. Record WIP opening/closing, embedded cotton/wood/wire/water, work already performed and inherited provider burdens; do not invent an average history. Internal transfers cancel without erasing the actual generation of waste or emissions."
      source_ids: []
    - rule_id: boundary_services
      applies_to: "p_service"
      rule: "Retain packing, handling, storage, delivery preparation, cleaning and post-release repair in a separate service ledger linked to the original release cohort Qc. Include services for closing and opening FG, not just shipped goods. Link returns to the original shipment reversal and original burden history; adding real repair materials/water/energy is new F. Re-delivery or reinspection never adds Q. Do not transfer an old cohort load to the current positive Q to hide a zero-output interval."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "p_service"
      rule: "For every packaging article separately reconcile opening empty and WIP/FG-attached/reusable stock + purchased + external returns received = closing all states + packaging leaving with gross physical shipments + external returns out + waste. Internal reuse cancels, with no repurchase, coproduct, net-Q contribution or automatic credit. Packing components are supplied whole once; any adhesive/coating constituent is a non-additive subaccount unless separately purchased/applied."
      source_ids: []
    - rule_id: boundary_species
      applies_to: "all inventory rows"
      rule: "Keep mass and relevant elemental balances independent of species, reaction and phase evidence. The selected dry assembly asserts no reaction water or boiler. Actual wet testing, cleanup, evaporation, heat-carrier return or unauthorised work remains real. Add each discovered fuel, gas species, chemical, supplied formulation, maintenance item and waste destination as an atomic row; do not hide it in zero or an undivided other category. COD/VOC totals cannot be treated as a specific molecular mass."
      source_ids: []
