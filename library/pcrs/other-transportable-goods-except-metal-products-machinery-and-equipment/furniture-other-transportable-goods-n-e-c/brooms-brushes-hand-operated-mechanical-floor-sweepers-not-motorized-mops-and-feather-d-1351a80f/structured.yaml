      collection_method: "Apply §7 hierarchy per environmental exchange, justify remaining joint scope and reconcile fractions and conserved total vector. Keep separate gross physical V for all destinations. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "native exchange units"
      frequency: "Each shared operation and update"
      temporal_coverage: "Same period as observed operation"
