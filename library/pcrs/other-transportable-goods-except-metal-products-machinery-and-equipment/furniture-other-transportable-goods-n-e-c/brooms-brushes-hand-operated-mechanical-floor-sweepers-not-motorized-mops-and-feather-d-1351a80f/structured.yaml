measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q = sum of calibrated net masses of complete mops first passing the declared quality gate in cohort c. Exclude packaging and externally added test/use water; declare conditioning and residual moisture. cp_release measures the whole units; count alone or catalogue head weight cannot set Q."
  - id: single_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared numerator property"
      uuid: ""
    required_unit: "kg; MJ; m3; h; kg*km"
    rule: "cp_raw collects raw unnormalised observations. After conversion and justified attribution, apply normalize_once once to each ledger column A with Qc. H is only the observation window. Keep physical V independent of environmental attribution B: economic shares or WIP burden transfers never reduce V. Qc = 0 retains all loads without a unit result."
  - id: electricity_units
    applies_to: "make_electricity; service_electricity"
    required_property_ref:
      name: "Electrical energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Metered electrical kWh × 3.6 gives MJ before normalization. Verify the electrical-energy property/unit support chain and actual supply geography, voltage and provider boundary before database binding; no invented transformer or generation fuel."
  - id: fluid_units
    applies_to: "make_air; make_water; service_water; make_hotwater; make_heat_return"
    required_property_ref:
      name: "Measured fluid property"
      uuid: ""
    required_unit: "m3; kg; MJ"
    rule: "Integrate only true rates. An already integrated gas/liquid volume is not multiplied by time again. Record pressure, temperature, humidity and meter reference state; use independently determined density for that substance/state only. Never infer density from a secondary native property. Supplied heat and carrier mass/enthalpy/return use one provider energy account and a non-additive physical bridge."
  - id: moisture_elements
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep commercial whole wet mass distinct from dry solids and component water; choose whole-object entries or a documented non-additive component bridge. Measure cotton and wood moisture independently by suitable sampling and dry-mass methods with volatile-loss uncertainty. Separate biogenic cotton/wood carbon, fossil resin/oil carbon and environmental water. Dust is a measured particulate stream, not a fibre molecule. No single residual may fit two unknowns."
