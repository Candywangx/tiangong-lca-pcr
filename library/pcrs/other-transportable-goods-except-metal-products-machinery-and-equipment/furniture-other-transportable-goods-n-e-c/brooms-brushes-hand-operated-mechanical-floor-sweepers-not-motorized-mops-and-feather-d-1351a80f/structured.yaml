allocation_rules:
  - rule_id: allocation_dedicated
    applies_to: "all environmental burden columns"
    rule: "Use attributional modelling only for the allocation-required scope. First assign dedicated operations and physically embodied inputs, then actual or justified virtual subdivision. Describe any inaccessible meters and distortion; this is not a free choice of physical versus economic allocation."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: allocation_causal
    applies_to: "remaining environmental burden columns"
    rule: "For each remaining exchange identify the determining physical causality, including actual processing intensity and time where causal. Cotton/yarn and handle-specific inputs stay with their actual recipient; shared cutting/compression/lighting/storage are examined separately. Merely sharing mass or a plant does not prove a common factor. Lost materials and failed operations remain in the responsible cohort."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: allocation_residual
    applies_to: "unresolved joint environmental burden columns"
    rule: "Only the genuinely remaining joint inventory uses contemporaneous actual market values of actual coproducts in their condition and amount at a common process gate. Strip later packing/transport/conditioning from downstream prices. Record state, price period and evidence; no fixed fraction or QFD cleaning-performance allocation is prescribed. Reconcile allocated plus retained columns to the whole original vector."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: allocation_physical
    applies_to: "all physical columns V"
    rule: "Physical inputs, waste, emissions, repair replacements and carrier returns are gross V at their actual gate and keep their true Q or origin Qc. Environmental value/service/WIP allocation never scales down these physical observations. A waste sale price is not automatic coproduct status or avoided-production credit; actual receiving treatment must be represented once. Special recycling methodology requires separate evidence, not an invented recovery fraction."
    source_ids:
      - ilcd-attributional-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_make"
      flow_role: "finished_mop"
      record_type: "weighing_and_release"
      raw_fields: "cohort c; release ID; whole-unit configuration; head and handle integrity; net mass; conditioning; residual moisture; excluded package/test water; accepted/rejected status; opening/closing FG links"
      collection_method: "Calibrated whole-unit weighing and documented retention/attachment/function checks against the actual drawing. Record rejected or wet-test items independently; count each first-pass release once. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "kg"
      frequency: "Each first release and failed attempt"
      temporal_coverage: "Complete cohort including zero-output intervals"
      site_scope: "Manufacture to first release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; release register; drawings; moisture tests; reject logs"
    - protocol_id: cp_raw
      process_id: "p_make"
      flow_role: "all physical exchanges"
      record_type: "raw_measurement"
      raw_fields: "row_id; timestamp; cohort; origin gate; raw quantity; raw unit; rate or integral flag; pressure; temperature; humidity; independent density; full formulation; F actual new; X proven same-side duplicate; counterparty; WIP/FG links"
      collection_method: "Meter/weigh actual issues and gross exits, maintain invoices and state-specific analyses, and record separate failure/cleanup/idle/rework events. Inspect equipment and actual material lists to add every missing atomic exchange; a qualification failure is never deletion authority. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "kg; MJ; m3; h; kg*km"
      frequency: "Every issue/exit and meter interval"
      temporal_coverage: "Whole observation H including Q=0"
      site_scope: "Actual manufacture and all served cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters; calibration; invoices; lab reports; actual-provider and rejection logs"
    - protocol_id: cp_stocks
      process_id: "p_make"
      flow_role: "raw WIP FG history"
      record_type: "stock_and_vector"
      raw_fields: "constituent/state; physical opening/closing raw stock; WIP stage; stock water; exchange-specific inherited B_open/B_close; original cohort Qc; unique transfer; first release; gross dispatch; original return/reversal; incremental repair"
      collection_method: "Physical counts/weights and moisture sampling reconcile independently with supplier and prior-cohort burden vectors. Preserve unknown history as unresolved; never estimate it from today's unit result without evidence. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "kg; native exchange units"
      frequency: "Opening/closing and every transfer"
      temporal_coverage: "Current and linked prior cohorts"
      site_scope: "Raw store; WIP; FG; return and repair areas"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed stock sheets; prior linked inventories; release IDs; transfer reconciliation"
    - protocol_id: cp_packaging
      process_id: "p_service"
      flow_role: "each packaging article movement"
      record_type: "gross_packaging_balance"
      raw_fields: "article and composition; empty/attached/reusable status; opening; purchase; external return received; closing; gross shipment outward; external return out; waste; internal reuse; original Qc; provider boundary"
      collection_method: "Count and weigh each actual article state and movement separately; maintain independent ledger per carton, bag, label, tape and pallet. New actual packaging types get separate rows and balance. Collection and aggregation retain only un-divided raw records; the aggregation basis cell labels the presentation of the already calculated single section 8 result, not another calculation."
      unit: "kg"
      frequency: "Every movement; opening/closing"
      temporal_coverage: "All packaging serving current/prior cohorts"
      site_scope: "All stores and attached WIP/FG"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Packaging weights; return receipts; dispatch and disposal tickets; stock sheets"
    - protocol_id: cp_allocation
      process_id: "p_make"
      flow_role: "environmental burden attribution"
