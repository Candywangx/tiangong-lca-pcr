  calculation_rules:
    - id: raw_attribution
      applies_to: "all inventory rows"
      rule: "Construct A by row and origin cohort before any division: physical column is gross actual V; environmental column B preserves dedicated/causal/residual allocation and inherited opening WIP burden minus closing WIP burden, plus real incremental F, minus only proven OTHER same-side duplicate X. B_current excludes separately recorded incremental F, so no actual event is added twice; X applies only to a proven identical event already duplicated in an OTHER subtotal on the same side. Raw-material physical stock and its historical burden are separately conserved. A receipt/dispatch internal transfer cancels only with its matching counter-entry. F is genuinely new; X never deducts a real repair, replacement, test-water input, waste or emission. Missing origin/history remains unresolved."
      inputs:
        - V
        - B_open
        - B_current
        - B_close
        - F
        - X
        - cp_raw
        - cp_service
        - cp_stocks
        - cp_service_stocks
        - cp_allocation
        - cp_service_allocation
      output: "A"
      source_ids:
        - ilcd-attributional-allocation
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "q = A / Qc. Apply this operation once to each unnormalised column: physical V and attributed environmental B remain separate. Qc is the positive first-release net mass of the actual origin cohort; for current manufacturing Qc = Q. Cards and aggregation reference this result and never divide it again. Qc = 0 retains the raw columns and gives no unit result."
      inputs:
        - A
        - Qc
        - cp_release
        - cp_stocks
        - cp_service_stocks
      output: "q"
      source_ids: []
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "Reconcile manufacturing, FG/service and combined physical gates on the same moisture/state basis: opening + external receipts = closing + gross external outputs + verified losses, with internal transfers cancelling. Within manufacturing first-release Q is the output; accepted closing FG belongs downstream and cannot be added to Q again. In service use opening FG + Q + returns and actual new repair/water, with displaced components and actual exits retained. Per-species/phase and relevant elemental equations are independently evidenced; whole wet object versus component sums are alternative non-additive views, not extra flows."
      inputs:
        - cp_raw
        - cp_service
        - cp_release
        - cp_stocks
        - cp_service_stocks
        - cp_packaging
      output: "reconciled physical gates"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify actual article/chemical, full supplied state, native type/CAS/route/grade/geography/media and provider boundary; unresolved auxiliary UUID never becomes a collective exchange or a fabricated binding."
      evidence: "Direct native records and actual supplier/receipt records"
    - id: dq_complete
      applies_to: "all operations"
      requirement: "Complete failures, tests, idle/start-stop, cleanup, rework, Q=0, WIP and service histories are required; document measurement uncertainty and actual zero versus not measured."
      evidence: "Logs and signed raw reconciliation"
    - id: dq_water_carbon
      applies_to: "mass and species accounts"
      requirement: "Water phases, source and medium, cotton/wood biogenic carbon and oil/resin fossil carbon need independent composition/moisture evidence. Never use COD as a molecule, assume reaction water, duplicate upstream biogenic uptake, or solve two missing measurements with one balance residual."
      evidence: "Analytical methods; sample scope; measurement uncertainty; provider coverage"
    - id: dq_sources
      applies_to: "product and method evidence"
      requirement: "Primary sources establish product construction and generic operation mechanisms, not a same-SKU factory inventory or numerical defaults. Check contradictory dimensions and route alternatives; separate source facts from author technical synthesis."
      evidence: "Complete source context and declared limitations"
    - id: dq_provider
      applies_to: "all upstream and waste links"
      requirement: "Use exactly one actual supplier/treatment representation per exchange; if an invoice service includes materials, use a disclosed non-additive bridge. Keep future-site values unresolved without converting ordinary provider gaps into a false core-method failure."
      evidence: "Provider-boundary matrix and originating stock vector"
validation_rules:
  - rule_id: validate_classification
    applies_to: "finished_mop"
    rule: "Confirm the complete manual mop and distinguish separately traded components, powered equipment and other leaf products. Verify the maintained narrower mapping and its scope decision independently of methodology approval."
    source_ids:
      - unsd-cpc3-notes-2025
  - rule_id: validate_whole
    applies_to: "finished_mop"
    rule: "Require the complete cotton-yarn head, true wire attachment and entire wooden handle at the first quality gate. Reject head-only, cotton/fabric/rod-only, powered or incompatible material/route substitution. Check every qualifier and actual declared acceptance record."
    source_ids:
      - m2-cotton-yacht-mop
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Check Q/ origin Qc and unique first-release IDs, closing FG inclusion once, actual mass/moisture and zero-output treatment. Verify raw collection contains no division and all unit results use normalize_once only once. Shipment and retest cannot increase production."
    source_ids: []
  - rule_id: validate_conservation
    applies_to: "all ledgers"
    rule: "Require manufacturing/FG/combined physical gates, each packaging equation, raw/WIP inherited vectors and source-specific species/phase/element checks. Keep gross waste/emissions/returns even when environmental burden is partitioned. Real incremental F cannot be X; unknown history, missing balances or unmeasured species are unresolved findings, not a pass."
    source_ids: []
  - rule_id: validate_native
    applies_to: "UUID-bearing rows"
    rule: "Recheck each adopted native flow and its exact reference-property/unit chain and all restrictions. Use exact official Chinese names. Broad whole-product identity is limited by the full qualified row; missing grade/provider facts need actual records and may prevent a particular UUID/provider binding without removing the physical exchange."
    source_ids: []
  - rule_id: validate_method
    applies_to: "allocation and release readiness"
    rule: "Validate the attributional hierarchy and inventory conservation separately from engineering syntax. Scientific review stays pending and Chinese alignment is not translation review. A complete site data package still needs evidence for its actual quantities, states and providers; this candidate is neither mapping approval nor publication."
    source_ids:
      - ilcd-attributional-allocation
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared whole-mop manufacture and separately identified original-cohort FG services"
  allowed_use: "Compatible cut-end cotton-yarn wire-bound wooden-handle configuration with actual gate/state and provider evidence"
  excluded_use: "Whole CPC leaf coverage; unlike cleaning-performance comparison; head-only or motorised products; default lifetime or credit"
