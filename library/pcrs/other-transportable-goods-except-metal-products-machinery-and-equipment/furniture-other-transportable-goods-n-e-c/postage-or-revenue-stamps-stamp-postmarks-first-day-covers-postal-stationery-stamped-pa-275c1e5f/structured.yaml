allocation_rules:
  - rule_id: a_direct
    applies_to: "p_fdc"
    rule: "For an attributional study first subdivide production from postal transport, retail and other issue batches; directly assign stamp and envelope purchases and actual cancellation workload. Allocation is only for genuinely shared burdens. Use measured causal machine time or metered consumption with a complete denominator of all users, justify each driver and ensure allocated fractions sum to one. If causal separation is unsupported, leave the shared burden unresolved for study review rather than use face value or collector price by default."
    source_ids:
      - ilcd-allocation
  - rule_id: a_reject
    applies_to: "p_fdc"
    rule: "No co-product or displacement credit for cancellation, invalidated postage or rejects. In-batch rework keeps original inputs and additional work; returned unused stamps retain their physical stock history."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_fdc"
      flow_role: "release"
      record_type: "weighing"
      raw_fields: "issue; batch; Q; N; accepted and rejected count; first release date"
      collection_method: "Calibrated balance; weigh net dry accepted covers without protective or transport packaging; reconcile first release once"
      unit: "kg"
      frequency: "each closed batch"
      temporal_coverage: "same issue campaign"
      site_scope: "operator and contracted site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lot records; invoices; approval and reconciliation"
    - protocol_id: cp_components
      process_id: "p_fdc"
      flow_role: "components"
      record_type: "stock record"
      raw_fields: "issue; supplier; ownership; stamp count and mass; envelope mass; opening/closing stock; receipts; returns; adhesive and liner state"
      collection_method: "Weigh representative components with traceable lot sampling and reconcile actual consumption with stock movements; no fabricated per-cover weight"
      unit: "kg"
      frequency: "each closed batch"
      temporal_coverage: "same issue campaign"
      site_scope: "operator and contracted site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lot records; invoices; approval and reconciliation"
    - protocol_id: cp_ink
      process_id: "p_fdc"
      flow_role: "ink"
      record_type: "stock record"
      raw_fields: "ink lot; SDS; opening; purchases; closing; return; retained and waste ink; moisture loss"
      collection_method: "Weigh actual full formulation consumption; reconcile container tare and stock; investigate water or solvent losses separately"
      unit: "kg"
      frequency: "each closed batch"
      temporal_coverage: "same issue campaign"
      site_scope: "operator and contracted site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lot records; invoices; approval and reconciliation"
    - protocol_id: cp_energy
      process_id: "p_fdc"
      flow_role: "electricity"
      record_type: "meter record"
      raw_fields: "meter; site; batch hours; other users; allocation driver; calibration"
      collection_method: "Submeter or document causal allocation of measured site electricity; include pre-release handling and holding"
      unit: "kWh"
      frequency: "each closed batch"
      temporal_coverage: "same issue campaign"
      site_scope: "operator and contracted site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lot records; invoices; approval and reconciliation"
    - protocol_id: cp_water
      process_id: "p_fdc"
      flow_role: "water"
      record_type: "meter record"
      raw_fields: "adhesive route; metered activation water; loss; retained water; batch"
      collection_method: "Measure water only when activation is verified; retain absence evidence otherwise"
      unit: "kg"
      frequency: "each closed batch"
      temporal_coverage: "same issue campaign"
      site_scope: "operator and contracted site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lot records; invoices; approval and reconciliation"
    - protocol_id: cp_waste
      process_id: "p_fdc"
      flow_role: "waste"
      record_type: "weighing record"
      raw_fields: "separate stream; mass; lot; rework; destination; treatment; composition"
      collection_method: "Weigh each stream separately, reconcile manifests and secure destruction; no fitting unknown emissions as a residual"
      unit: "kg"
      frequency: "each closed batch"
      temporal_coverage: "same issue campaign"
      site_scope: "operator and contracted site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lot records; invoices; approval and reconciliation"
    - protocol_id: cp_freight
      process_id: "p_fdc"
      flow_role: "road_freight"
      record_type: "carrier record"
      raw_fields: "leg ID; supplier; delivery point; included transport; mode; gross kg; km; consignment; other loads; allocation"
      collection_method: "Verify real road leg and carrier work against component delivery terms; weigh gross load and use actual route distance, not straight-line distance or price; document separately billed versus already included leg"
      unit: "tkm"
      frequency: "each consignment"
      temporal_coverage: "same cohort/campaign"
      site_scope: "actual dispatch and receipt sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "carrier waybill; distance evidence; payload; provider scope ledger"
    - protocol_id: cp_service
      process_id: "p_fdc"
      flow_role: "cancellation_service"
      record_type: "contract record"
      raw_fields: "operator; contractor; authorization; cohort/item IDs; serviced/rejected counts; included ink; electricity; drying; freight; waste; separate supplies"
      collection_method: "Reconcile actual authorized service count and provider inventory boundary; map each included activity to one provider, each excluded actual supply to one foreground card; retain unresolved inclusions"
      unit: "item"
      frequency: "each service lot"
      temporal_coverage: "same cohort/campaign"
      site_scope: "operator and authorized contractor"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "contract; authorization; acceptance and provider inventory"
    - protocol_id: cp_cohort
      process_id: "p_fdc"
      flow_role: "WIP and failed lots"
      record_type: "lineage ledger"
      raw_fields: "original lot; item ID; period; opening/closing WIP count and kg; opening inherited vector; new activities; failed attempts; transfer ID; source/destination; terminal losses; first-release ID; Q"
      collection_method: "Retain unnormalized raw activities and exchange-specific burden vectors at each cutoff; match transfer pairs and item history before closing a positive-Q cohort or predefined campaign"
      unit: "kg and each exchange unit"
      frequency: "each period cutoff and transfer"
      temporal_coverage: "all periods of the original cohort"
      site_scope: "all sites in declared consolidated scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "immutable raw ledger; matching transfer IDs; stock and release reconciliation"
  calculation_rules:
    - id: batch_normalize
      applies_to: "all inventory rows"
      rule: "x_ref = X_alloc / Q; X_alloc is attributable batch exchange quantity in its own unit; Q is accepted net bare-cover mass in kg. Reference output = Q / Q = 1 kg. Divide once, never by N and Q together."
      inputs:
        - X_alloc
        - Q
        - cp_release
      output: "x_ref"
      source_ids: []
    - id: component_reconcile
      applies_to: "stamp_input; envelope_input; cancel_ink"
      rule: "Consumption = opening stock + receipts - closing stock - unused returns - transfers to other batches. Count internal rework only as extra activity. Retain component-specific mass balance with accepted product, rejects, stock and measured species losses. Whole cover mass does not equal dry paper mass alone."
      inputs:
        - cp_components
        - cp_ink
        - cp_waste
        - cp_release
      output: "batch consumption"
      source_ids: []
    - id: transport
      applies_to: "p_fdc"
      rule: "For each actual freight leg tkm = gross transported kg / 1000 × km; allocate shared loads causally and divide attributable tkm by Q. Include incoming packaging in freight mass but exclude it from Q; add each physical packaging waste separately. No shipment inferred from cancelled face value."
      inputs:
        - "carrier records"
        - "measured gross mass"
        - Q
      output: "tkm per kg"
      source_ids:
        - canada-service
    - id: cohort_balance
      applies_to: "all inventory rows"
      rule: "For each exchange separately B_close = B_open + B_new + B_transfer_in - B_transfer_out - B_first_release - B_terminal. Physical WIP counts/mass are reconciled independently; never substitute kg for energy or transport units. Internal transfers cancel on consolidation. Preserve opening/closing physical stocks and burden vectors; do not allocate all period purchases to period shipments."
      inputs:
        - cp_cohort
        - cp_release
      output: "reconciled physical stock and burden ledger"
      source_ids: []
    - id: zero_and_release
      applies_to: "all inventory rows"
      rule: "Emit x_ref only after closing a documented cohort/campaign with total first-release Q > 0. Its numerator includes complete traceable inherited and new attributable burdens, including its failed attempts and predefined campaign terminal losses, with all internal transfer duplicates eliminated. At Q = 0 retain the complete unnormalized record and emit no unit result. Each item contributes net mass to first-release Q once; shipment of previously released stock contributes no new Q."
      inputs:
        - cp_cohort
        - cp_release
      output: "unit result or retained unnormalized ledger"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "p_fdc"
      requirement: "Trace legal stamp procurement, issue/date/place, cancellation authority and first physical release. Record photographs and operator records; do not count replacement markings as genuine."
      evidence: "usps-fdc; operator records"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Use one closed lot, time and site basis. Missing meters, provider exchanges, ink chemistry/emissions, upstream packaging and holding burdens remain explicit gaps; do not replace unknowns by zeros or invented ranges."
      evidence: "stock reconciliation; uncertainty register"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference_product_fdc"
    rule: "Require positive measured Q, accepted N, one reference output, matching batch/issue and 1 kg normalization in every row and protocol. Mass property support does not approve an unresolved product UUID."
    source_ids: []
  - rule_id: v_state
    applies_to: "p_fdc"
    rule: "Verify affixed genuine stamp, authorized cancellation date/place, readable dry intact saleable cover, and recorded rejects before first release. Exclude mint stamp production and existing-cover repacking."
    source_ids:
      - usps-fdc
      - unsd-cpc3
  - rule_id: v_boundary
    applies_to: "whole system"
    rule: "Reconcile upstream providers and owned/outsource operations without duplicate stamp, envelope, integral adhesive, cancellation service, postage entitlement, transport or packaging. Keep unresolved species and historical stocks explicit. Method checks confer no scientific approval, classification acceptance or publication."
    source_ids:
      - canada-service
  - rule_id: v_lineage
    applies_to: "p_fdc"
    rule: "Audit Q = 0 records, all period WIP vectors, matching transfer pairs, campaign membership, and once-only first-release IDs before normalization. Require each actual freight or cancellation activity to have exactly one provider/direct owner; unresolved inclusions block a complete dataset."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Physical official paper first-day cover supply at the same bare first-release gate"
  allowed_use: "Same declared issue/configuration after provider and data-quality review"
  excluded_use: "Postal delivery, mint stamp manufacture, resale of historical covers, customer cancellation services, complete lifetime footprint or all-38962 coverage"
  required_metadata: "All reference qualifiers; operator and sites; batch Q/N; provider boundaries; adhesive/ink supply state; allocation; rejects and rework; transport and packaging gate"
  required_quality_disclosure: "Actual collection coverage, identity and chemistry gaps, source limitations, uncertainty and separate scientific/translation review state"
  update_trigger: "Issue, operator, envelope, stamp/adhesive, cancellation method/ink, supply state, gate, allocation or provider change"
data_sources:
  - id: "unsd-cpc3"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 explanatory notes, 30 June 2025, complete PDF pp152,197; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/38962"
    used_for: "Classification boundary only; unused stamps versus named first-day covers; no quantitative manufacturing evidence."
  - id: "usps-fdc"
    type: "official_guidance"
    reference: "USPS, Putting a Stamp on the American Experience First Day Cover, product 894516, issue 2025-07-23, product description/details/specifications; https://store.usps.com/store/product/putting-a-stamp-on-the-american-experience-first-day-cover-S_894516"
    used_for: "Actual completed collectible, affixed cancelled stamp, black-and-white authorized marking and mail-use exclusion; no factory measurements or mass defaults."
  - id: "canada-product"
    type: "official_guidance"
    reference: "Canada Post, Standing orders, Official First Day Covers section; https://www.canadapost-postescanada.ca/cpc/en/support/kb/sending/stamps-packaging/create-a-philatelic-standing-order.page"
    used_for: "Independent product-state corroboration; official cover bears stamp cancelled at date/place of issue; not USPS process observations."
  - id: "canada-service"
    type: "official_guidance"
    reference: "Canada Post, Official First Day Covers, complete support article; https://www.canadapost-postescanada.ca/cpc/en/support/articles/philatelic-products/official-first-day-covers.page"
    used_for: "Customer-owned cover affixing/cancellation and actual return mailing distinguished; not a combined USPS/Canada SKU or assumed transport."
  - id: "ilcd-allocation"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA, Detailed guidance, March 2010, §7.9.1–7.9.2 printed p255/PDF275; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctionality and subdivision before allocation; no transferred allocation factor or price rule."
