system_boundary:
  rules:
    - rule_id: b_gate
      applies_to: "whole system"
      rule: "Include upstream physical components and their inbound transport, stamp affixing, authorized cancellation, drying if actually performed, inspection, attributable pre-release holding and reject treatment through the first accepted bare-cover gate. Packaging and customer shipment after that gate, retail, collector use and end of life are outside this dataset and require downstream modelling."
      source_ids:
        - usps-fdc
    - rule_id: b_service
      applies_to: "stamp_input"
      rule: "Separate physical stamp supply from any bundled postal entitlement. Cancellation does not cause a mailing journey. Do not infer tonne-kilometres from denomination, fee or retail price. A real intersite movement is counted once from actual route and transported mass. Customer-owned cancellation/return service is excluded; Canada Post describes those separate operations, not this USPS SKU route."
      source_ids:
        - usps-fdc
        - canada-service
    - rule_id: b_complete
      applies_to: "p_fdc"
      rule: "Record each actual additional chemical, utility, packaging component, waste and elementary emission as its own exchange. No unspecified residual is zero. Verify complete purchased ink formulation and upstream boundary before adding constituent flows. Unmeasured solvent loss, heating, cleaning and packaging waste remain data gaps if present."
      source_ids: []
    - rule_id: b_supply_once
      applies_to: "p_fdc"
      rule: "For every provider and movement declare included operations and delivery point. If a component provider includes delivery to the receiving site, do not add the same freight service again. Add separately purchased road freight only for uncovered actual road legs using road_freight and cp_freight; another actual mode needs its own specific exchange and protocol. Delivery fees and denomination do not prove transport work."
      source_ids:
        - canada-service
    - rule_id: b_cancel_once
      applies_to: "p_fdc"
      rule: "When an authorized contractor cancels operator-owned component assemblies as part of first formation, cancellation_service represents only that purchased operation, not a second finished cover or a customer-owned cancellation-only dataset. Record the provider inclusion ledger under cp_service. Ink, electricity, drying, transport and reject treatment included by that provider are represented once through its service inventory and are not duplicated as foreground purchases. Separately supplied ink or electricity remain direct cards only for the uncovered quantities. Unknown provider inclusion is unresolved, never zero."
      source_ids:
        - canada-service
    - rule_id: b_cohort
      applies_to: "p_fdc"
      rule: "Record original lot and item identity before processing. Keep raw activity quantities, failed cancellation attempts, rework, inherited burdens and their exchange-specific units without normalization while the cohort remains open. For Q = 0 no per-kg result may be emitted; retain the complete failed-lot record and terminal burden vector. A later accepted output of the same traceable cohort inherits its prior failed/rework burdens. An entirely failed lot may enter a predefined documented production campaign only with explicit traceable transfer of its full burden vector and unchanged failure status; never silently discard it or move it to an unrelated successful lot."
      source_ids: []
    - rule_id: b_wip
      applies_to: "p_fdc"
      rule: "At period close carry physical WIP count/mass and its accumulated exchange-specific burden vector forward under the same item/lot lineage. No release from WIP is counted in Q until first acceptance. Every transfer has one matching source out-record and destination in-record with the same transfer ID, physical state and burden vector; transfers inside the consolidated scope cancel, and inherited vectors are not added again as new purchases. Already released stock carries its earlier release history and is never first output again on sale, return or repacking."
      source_ids: []
