allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory rows"
    rule: "Use this hierarchy only for declared attributional modelling where allocation is required. First assign exclusive inventories to the actual cabinet/order and subdivide operations; next use justified virtual subdivision. Actual material embodiment, meter boundaries, batch work, fixtures and oven loads must be understood before choosing a key."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "all inventory rows"
    rule: "For each remaining exchange independently establish the determining physical causal relation between the delivered co-functions and changes in that exchange. For a shared cleaning/coating line this may require actual treated surface and coverage, cycle intensity and time; merely having mass or price data proves no causality. Do not impose the same physical key on materials, energy, ventilation, equipment and storage or treat a checklist as an arbitrary choice."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only the demonstrably inseparable residual of a common multifunctional process may use actual contemporaneous market value at the same process gate, quantity and state. Correct later packaging, transport and conditioning costs back to that gate; disclose zero/negative values, evidence gaps, sensitivity and review. Do not use downstream retail prices or a fixed share. This is not QFD allocation between functions of a multifunctional consumer product and not permission for automatic recycling credits."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_gross_waste
    applies_to: "all inventory rows"
    rule: "All physical gross inputs/outputs, packaging legs, waste masses and asset movements remain unscaled by burden allocation. Ordinary failed cabinets, samples, scrap, powder, sludge and wastewater keep their causal manufacturing and treatment burdens even if sent away or sold. Internal transfers/recovered powder pair and cancel without new procurement, Q or credits. An independent real coproduct/recycling handover needs its specific methodology and receiving inventory once; sales alone never justify T_other. Allocated burden vectors must sum to the unallocated burden."
    source_ids:
      - pulage-cabinet-manufacture-2025
      - jrc-ilcd-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_factory"
      flow_role: "finished_cabinet and stock genealogy"
      record_type: "calibrated_acceptance_ledger"
      raw_fields: "unit/lot ID; model; drawing/configuration; drawer/slide/lock/handle/feet/interlock; cured coating; complete net accepted mass; tare; moisture state; first-release timestamp; tests; defects; opening/closing raw/WIP/FG; original cohort and inherited vectors"
      collection_method: "Owner: production QA and warehouse. Weigh each complete accepted cabinet on a calibrated scale excluding removable transport packaging, contents and test weights; preserve raw mass, calibrated uncertainty and signed first acceptance. Q sums only these unique first-release masses. Reconcile every stock/return/rework event without creating Q twice. No per-output division during collection."
      unit: "kg"
      frequency: "every unit/lot and movement"
      temporal_coverage: "complete matched manufacturing cohort and adjacent-period carry"
      site_scope: "actual sheet-to-finished cabinet line and all external fabrication providers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; signed test/acceptance; configuration; full stock and vector bridge"
    - protocol_id: cp_materials
      process_id: "p_factory"
      flow_role: "each whole supply and actual independent additive"
      record_type: "receipt_issue_composition"
      raw_fields: "exchange ID; lot; supplier; whole supply mass; included water/actives/packaging; SDS/COA; grade/form; work order; raw/WIP stocks; failures; subcontract boundary; inherited burden vector; unique owner"
      collection_method: "Owner: material custodian and laboratory. Retain raw receipts, calibrated net issues and representative independent assay; separate whole purchased formulations from their subaccounts and actual onsite purchases. Preserve full failed/cleanup orders and opening/closing per-exchange burden. No normalization."
      unit: "kg; item; measured kg per complete part; assay"
      frequency: "each receipt/issue plus representative lot assays"
      temporal_coverage: "full same cohort including zero-output orders and WIP carry"
      site_scope: "each actual stock supplier and onsite/subcontract stage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; weigh records; drawing/BOM; SDS/COA; assay and owner reconciliation"
    - protocol_id: cp_utilities
      process_id: "p_factory"
      flow_role: "one carrier at a time"
      record_type: "raw_meter_and_state"
      raw_fields: "carrier; meter boundary; voltage/location; start/end; kWh/MJ/kg/m3; integrated-vs-rate; duration; pressure/temperature/composition; independent density/LHV; furnace type; idle/start/stop/failures; double-count flags; allocation relation"
      collection_method: "Owner: utilities engineer. Preserve actual raw meters, invoices, operating logs and independent state/composition measurements; disaggregate common equipment electricity once. No assumed steam/boiler; actual purchased steam/heat, condensate or heat-exchange water would need separate atomic mass/state/enthalpy/provider contracts before extension. No collection division."
      unit: "kWh; MJ; kg; m3 with conditions; rate and time"
      frequency: "continuous plus each operating event"
      temporal_coverage: "full cohort including start/stop/idle/cleaning/failures"
      site_scope: "cutting to inspection and shared utilities inside stated bill boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; supplier bill; state/composition tests; causal allocation proof"
    - protocol_id: cp_water
      process_id: "p_factory"
      flow_role: "each purchased/added aqueous stream and water subaccount"
      record_type: "wet_stock_flow_and_sample"
      raw_fields: "stream/phase; gross wet mass; volume; measured density at temperature/composition; water/solids/active assay; dilution; bath stocks; dragout; recirculation; drains; actual water reaction extent; humidity and vapour links"
      collection_method: "Owner: water/pretreatment engineer and laboratory. Preserve independent actual intake/outlet meters, wet weighing and matched samples; distinguish supplied formulation water, additional water and internal reuse. Keep full wet closing stocks and real added influx together. Do not derive reaction water or a second outlet from a common residual; no normalization."
      unit: "kg; m3; measured density; assay"
      frequency: "continuous meters and each bath change/sample"
      temporal_coverage: "full matched period including cleaning/failures and wet-stock carry"
      site_scope: "actual cleaning/phosphating/rinse/dry supply and external treatment handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling chain; laboratory method; moisture/density calibration; water balance"
    - protocol_id: cp_species
      process_id: "p_factory"
      flow_role: "each actual atmospheric and emitted species"
      record_type: "independent_species_monitoring"
      raw_fields: "species; CAS; molecular/particle structure; medium; origin; stack/fugitive/source; raw concentration; actual integrated carrier volume or rate/time; state/density; detection limit; capture/control status; full inlet/outlet; failures; uncertainty"
      collection_method: "Owner: environmental engineer and competent laboratory. Independently sample actual speciated inlet/outlet and uncontrolled releases across normal/abnormal operation. Preserve raw concentration and matched physical carrier/state with no output division. Atmospheric gross gas components are not provider purchases. Mixed formulation aerosol has measured composition/size, never an assumed pure species. Total NOx/VOC/COD/metals cannot stand in for actual molecules."
      unit: "kg; concentration; integrated m3; rate; time; state"
      frequency: "representative continuous/event samples including failures"
      temporal_coverage: "entire matching cohort and controls downtime"
      site_scope: "actual vents/stacks/fugitives and gas inlets; destination-specific media"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sample chain; species method; detection limits; independent gas/density records"
    - protocol_id: cp_waste
      process_id: "p_factory"
      flow_role: "each actual waste and treatment burden owner"
      record_type: "wet_waste_manifest"
      raw_fields: "waste ID; gross full wet mass; solids/water; composition; contaminated state; origin cohort; stocks; rejects/samples; recipient; actual treatment; gate fee/sale; provider coverage; assigned vector"
      collection_method: "Owner: waste manager and laboratory. Preserve raw weighed tickets, assays, treatment/transport receipts and actual provider boundaries. For any actual mixed outlet independently measure every material-origin W and use one mixed total with nonadditive origin subaccounts OR disjoint origin exchanges summing to that total; one treatment provider only. Add a compatible atomic mixed-Waste card/protocol before factory dataset completeness if that real outlet occurs. Physical V stays full; ordinary manufacturing/treatment burden stays with originating cohort unless a justified independent-function handover is documented once. No subtraction for sale or movement alone; no collection normalization."
      unit: "kg; wet/dry assay; treatment service records"
      frequency: "each discard/dispatch and representative sample"
      temporal_coverage: "full cohort and opening/closing waste stocks"
      site_scope: "forming/finishing/quality stages to actual recipient boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale; manifests; assay; recipient proof; exact once burden owner"
    - protocol_id: cp_pack
      process_id: "p_pack"
      flow_role: "each material/SKU and each P/I/ER/S/EO/W event"
      record_type: "six_leg_physical_and_owner_ledger"
      raw_fields: "material/SKU; event and direction; full wet mass; measured piece tare; composition/moisture; empty/attached WIP/attached FG/reusable opening/closing; P; I; ER; gross S; EO; W; measured X_in/X_out and OTHER same-side duplicates; independent origin W for an actual mixed outlet and total-OR-partition representation; whole-article/component bridge; natural humidity; internal reuse; upstream owner; actual burden dimensions; original cohort; service horizon ; packaging receipt origin; payment/non-purchase evidence; owner/custodian; same-item prior outward ID"
      collection_method: "Owner: receiving/packaging warehouse. Retain full actual six-leg records separately for each material including supplier-included packaging and external returns. Weigh whole wet pieces; keep included component subaccounts without purchasing twice. Reconcile opening + P + I + ER + X_in = closing + S + EO + W + X_out per material. X is only the distinct repair/addition/removal flow not already in another SAME-side event; stocks and opposite-side flows are never duplicate deductions. One measured mixed outlet uses a mixed total with nonadditive measured origin W subaccounts OR disjoint origin exchanges, never both, with one provider. Preserve natural moisture exchange without inventing repair water. Reconcile opening + P + I + ER + X_in = closing + S + EO + W + X_out per material. X is only the distinct repair/addition/removal flow not already in another SAME-side event; stocks and opposite-side flows are never duplicate deductions. One measured mixed outlet uses a mixed total with nonadditive measured origin W subaccounts OR disjoint origin exchanges, never both, with one provider. Preserve natural moisture exchange without inventing repair water. No netting influx against closing stock, no economic scaling, and no procurement/credit from physical disclosure. Attribute genuine production/treatment/service once in owner ledger; never use stock-corrected A for gross cards. No division during collection.  For packaging only, apply packaging_receipt_basis; standalone non-purchase is I, never invented ER or X."
      unit: "kg; item; independently measured whole wet piece mass"
      frequency: "each packaging event and stock count"
      temporal_coverage: "complete cohort plus explicit post-release observation horizon"
      site_scope: "all external packaging ingress/egress and attached/empty/reusable stocks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale; stock movement; supplier included-owner proof; six-leg closure"
    - protocol_id: cp_service
      process_id: "p_service"
      flow_role: "actual service increments and physical cabinet movements"
      record_type: "original_cohort_horizon"
      raw_fields: "original unit/cohort Q_c; original delivery; gross dispatch/return masses separately; opening/closing FG inherited burden; service horizon; raw electricity; work permission; added/removed parts/water; post-work tests; acceptance; disposition; unused/unassigned service"
      collection_method: "Owner: warehouse, service engineer and QA. Preserve unnormalised actual service meters/work orders and each independent gross leg linked to original cohort. Keep original manufacturing once; completed storage/handling service is not removed for remaining FG. Return mass is not assumed equal to original delivery; actual increments/losses are measured. No repeated Q and no collection division."
      unit: "kg; MJ; kWh; actual service time/state"
      frequency: "each event and observation-horizon closure"
      temporal_coverage: "declared horizon bound to original release cohort"
      site_scope: "on-site storage/packing/handling/dispatch and all actual post-release work, including unauthorized, failed or rejected work"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter records; stock bridge; original delivery; permission; signed post-tests/disposition"
    - protocol_id: cp_assets
      process_id: "p_assets"
      flow_role: "each machine/tool/repair part and aqueous/fluid event"
      record_type: "physical_asset_service_split"
      raw_fields: "asset/part/fluid ID; new/reused state; receipt/removal X_in/X_out; full wet mass; installed fluid/moisture; full opening/closing; in/out duplicates; measured service/load/time/capacity; actual remaining capacity; maintenance; original cohort; manufacturer work permission; tests/disposition; once burden owner"
      collection_method: "Owner: maintenance/asset engineer and QA. Retain physical receipts/removals and independently measured full wet stock, fluids and water. Deduplicate X only against an OTHER same-event flow on the SAME side, never against stock, the opposite side or mere card existence; never cancel a real addition merely retained in closing stock. Keep physical gross V unscaled and asset service burden separately attributed once by measured actual service/capacity evidence and justified method. No assumed lifetime or double whole-provider charge; no collection normalization."
      unit: "kg; item; measured moisture/fluid; service time/capacity"
      frequency: "each acquisition/repair/removal and full stock close"
      temporal_coverage: "full manufacturing cohort and specific post-release horizon"
      site_scope: "actual machine, tooling, installed fluids, cooling and all actual repair, including unauthorized, failed or rejected work"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "asset register; weighing; fluid/water sampling; measured capacity; permission and post-tests"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert raw values before attribution: tonnes to kg; measured count times independently measured complete-part mass; volume times independently measured density of that material at the actual composition/temperature/pressure. Integrate actual rates over their durations; do not multiply integrated volumes by time again. Electrical kWh times3.6 gives MJ. Fuel carrier mass/composition/LHV and burner heat are separate linked dimensions with one upstream owner. Native secondary properties are not measurements of density or cabinet mass."
      inputs:
        - cp_release
        - cp_materials
        - cp_utilities
        - cp_species
        - cp_water
        - cp_pack
        - cp_assets
      output: "converted raw unnormalised amounts"
      source_ids:
        - pulage-cabinet-manufacture-2025
        - jrc-ilcd-allocation-2010
    - id: match_manufacturing
      applies_to: "all inventory rows"
      rule: "For each exchange e, construct manufacturing A_e = B_open,e + U_e - B_close,e - T_other,e after actual unit conversion and valid exclusive/causal/residual allocation. B terms are traced exchange burden vectors in raw/WIP/unused unassigned stores, not inventory mass subtracted from energy. B_close excludes all first-released FG already in Q. Stock-corrected consumption is not corrected again. Keep ordinary failures, samples, waste and their treatment; T_other is allowed only for a true independent cohort/function with a justified one-time handover and a receiving vector. Preserve zero-Q loads and genealogy."
      inputs:
        - convert_raw
        - cp_release
        - cp_materials
        - cp_waste
        - cp_assets
      output: "manufacturing A_e and positive release cohort Q"
      source_ids:
        - pulage-cabinet-manufacture-2025
        - jrc-ilcd-allocation-2010
    - id: match_service
      applies_to: "all inventory rows"
      rule: "For each actual post-release service exchange use A_e,c = B_open_unused,e,c + U_service,e,c - B_close_unused,e,c - justified one-time other-function handover. Retain original cohort Q_c and declared observation horizon, even for zero current dispatch or closing FG. Never remove performed service because the cabinet is still in stock or because original manufacturing was already carried. Returns/rework retain original burden and add all actual incremental work, including unauthorized, failed or rejected work; record permission, tests, acceptance and disposition as separate qualification facts, never as data-inclusion filters. Service packet covers that horizon only; no future lifetime is assumed."
      inputs:
        - convert_raw
        - cp_service
        - cp_release
        - cp_assets
      output: "service A_e,c bound to original Q_c and horizon"
      source_ids:
        - bisley-office-filing
        - jrc-ilcd-allocation-2010
    - id: select_gross_numerator
      applies_to: "all inventory rows"
      rule: "For every physical gross disclosure card the numerator is exactly its complete measured gross leg V_e after raw unit conversion, including packaging P/I/ER/S/EO/W, actual waste, gas/aqueous species and asset/repair/water events. Do not substitute manufacturing/service A_e, B_open+U-B_close, consumption net of stocks or any economic share. Preserve influx and full closing wet mass together. This is a physical disclosure; it creates no second purchase, treatment obligation, upstream burden or credit. Link any real burden to its single owner separately."
      inputs:
        - convert_raw
        - cp_pack
        - cp_waste
        - cp_species
        - cp_assets
        - cp_service
      output: "unscaled complete gross numerator V_e"
      source_ids:
        - pulage-cabinet-manufacture-2025
        - jrc-ilcd-allocation-2010
    - id: single_quotient
      applies_to: "all inventory rows"
      rule: "The only normalization: reported quantity = selected numerator / Q_c once. For manufacturing burden dimensions select match_manufacturing A_e; for service burden dimensions select match_service A_e,c; for physical gross dimensions select the full V_e from select_gross_numerator, never a burden vector or allocation share. Q_c is that packet original unique first-release whole-cabinet mass in kg, not dispatch, material input or another cohort. The reference finished_cabinet is fixed at1kg. Cards and aggregation rules reference this same report and do not divide again. Record observed service horizon h separately; it is not an additional divisor. Actual rate integration in convert_raw is retained. Record observed service horizon h separately; it is not an additional divisor. Actual rate integration in convert_raw is retained. If Q_c=0 retain real loads for explicit later attribution and issue no unit result."
      inputs:
        - match_manufacturing
        - match_service
        - select_gross_numerator
        - cp_release
      output: "one per1kg reference-flow report"
      source_ids:
        - pulage-cabinet-manufacture-2025
        - jrc-ilcd-allocation-2010
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "Before allocation close total gross physical mass and each relevant elemental ledger: opening raw/WIP/FG/packaging/equipment wet stocks plus all actual external inflows = full closing stocks plus actual external outflows. Include atmospheric species, attached/installed water and every repair/packaging influx without cancelling an influx against its own closing stock. Internal handoffs cancel. At the manufacturing-to-FG gate Q transfers internally; full-gate closure cancels it rather than adding Q and closing FG as two products. Separately reconcile genuine chemistry, species, free/structural/reaction water and phase change using independent measurements; do not residual-fit two unknowns."
      inputs:
        - cp_release
        - cp_materials
        - cp_water
        - cp_species
        - cp_pack
        - cp_assets
        - cp_service
        - cp_waste
      output: "physical elemental and independently evidenced species/water closure"
      source_ids:
        - pulage-cabinet-manufacture-2025
        - jrc-ilcd-allocation-2010
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Each bound flow must match every native name, CAS, supply form, route, geography, medium, dataset type and reference property. Broad compatible families retain explicit primary product constraints; hard conflicts require another identity. Missing auxiliary/provider matching is disclosed and cannot justify false quantitative data."
      evidence: "complete native identity and supply documents"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "No default cabinet weight, steel thickness, drawer count recipe, coating thickness, cure temperature/time, lifetime, certification, strength or emission factor. Future actual data must cover all manufacturing, zero-output work, stock vectors, services, packaging gross legs and atomic species; a missing real core method/input remains a hold for the affected dataset."
      evidence: "full process and material/species reconciliation"
    - id: dq_traceability
      applies_to: "all inventory rows"
      requirement: "Keep calibrated original records, sampling uncertainty/detection limits, accountable owner, reporting geography/time, supplier versus onsite boundary, all allocation rationales and sensitivity. Historical and manufacturer examples establish qualitative scope, not contemporary site recipes, numbers or scientific certification."
      evidence: "original records; calibration; source applicability; uncertainty and sensitivity"
validation_rules:
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Verify complete cabinet terminal, configuration, unique quality release, every required qualifier and all native restrictions; component-only, electrical, safe or kitchen-cabinet identities cannot stand in for this reference. Confirm mass basis independently of native family wording."
    source_ids:
      - un-cpc3-structure-2025
      - pulage-cabinet-manufacture-2025
      - bisley-office-filing
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Verify single_quotient is the only division: collection raw, conversion then actual attribution, chosen numerator then original Q_c once. All gross cards use full V, not B/A/price shares. Q=0 gives no unit result. Closing FG is already in first-release Q and manufacturing burden; service completed for it stays with its original cohort."
    source_ids:
      - pulage-cabinet-manufacture-2025
      - jrc-ilcd-allocation-2010
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Independently close manufacturing, FG/service and combined external-gate gross physical, elemental, actual species and water ledgers. Pair internal transfers without external procurement or a second Q. Check each packaging material has six event cards and full stock bridge, not merely a six-leg protocol. Preserve every real repair/water influx plus full closing mass; report unresolved imbalances without residual-fitting."
    source_ids:
      - pulage-cabinet-manufacture-2025
      - jrc-ilcd-allocation-2010
  - rule_id: validate_route_quality
    applies_to: "all inventory rows"
    rule: "Confirm actual joining and complete powder-coat pretreatment/application/cure/assembly route, whole formulation ownership, real losses/wastes/species and actual dimensional/function/finish/load/safety tests per manufacturer and intended specification. Reject unsupported whole-core substitutions and fabricated zero flows. Retesting is not new production. All actual post-release rework and incurred flows/burdens must remain recorded, including unauthorized, failed or rejected work. Permission, post-tests, acceptance and disposition qualify authorization/current state only, with no deletion, presumed restoration or new Q."
    source_ids:
      - pulage-cabinet-manufacture-2025
      - bisley-office-filing
      - bis-is3313-1983-historical
  - rule_id: validate_readiness
    applies_to: "all inventory rows"
    rule: "This method requires real foreground collection before a dataset can be complete. Mechanical schema/measurement checks do not establish methodology, translation, certification, mapping or publication approval. Missing real information remains explicit; no draft or unverified method is counted as accepted classification coverage."
    source_ids:
      - jrc-ilcd-allocation-2010
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A complete actual configured cabinet manufacture dataset, with explicit original-cohort factory service packets and their observation horizon"
  allowed_use: "Matched complete steel office filing cabinet supply after verifying identity, route, quality and whole-unit mass; no function equivalence from kg alone"
  excluded_use: "Parts, purchased finished-cabinet repackaging as manufacturing, electrical/special safes, chairs, kitchen cabinets, unspecified furniture, use lifetime or automatic recycling credit"
  required_metadata: "All reference qualifiers; model/drawing and full BOM; actual site/time/providers; raw/WIP/FG and burden genealogy; Q event; utilities; gross packaging/asset/water/species; source applicability; original service horizon; uncertainty"
  required_quality_disclosure: "Measured coverage and all gaps; native identity restrictions; source limitations; full gross and elemental/species closure; actual allocation; missing/failing work; first-release and service distinction; no scientific/translation/certification claim from machine checks"
  update_trigger: "Changed steel/formulation/route or supplier boundary, cabinet configuration, cure/test specification, utility conditions, waste treatment, packaging, identity restrictions or observed service horizon"
data_sources:
  - id: "un-cpc3-structure-2025"
    type: "official_guidance"
    reference: "United Nations, CPC Ver.3.0 Structure, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Classification context38121 and adjacent furniture/parts categories; not canonical identity or coverage acceptance."
  - id: "pulage-cabinet-manufacture-2025"
    type: "handbook"
    reference: "Pulage Furniture, How Steel Filing Cabinets Are Made: Inside the Manufacturing Process, 1 December 2025. https://pulage-furniture.com/blogs/%E6%96%B0%E9%97%BB/how-steel-filing-cabinets-are-made-inside-the-manufacturing-process"
    used_for: "Qualitative sheet-to-cabinet process, cleaning/phosphating, whole powder/thermal cure, hardware assembly, inspection and packaging prompts. Different cabinet/KD variants; no adopted numerical recipe, thickness, cure setting or emission claim."
  - id: "bisley-office-filing"
    type: "handbook"
    reference: "Bisley, Office Filing, complete manufacturer product page, undated. https://www.bisley.com/products/filing/cabinets/"
    used_for: "Independent complete welded, powder-finished office filing-cabinet function, drawer hardware and safety configuration. No imported dimensions, loading figures, warranty-as-life or certification."
  - id: "bis-is3313-1983-historical"
    type: "standard"
    reference: "IS3313:1983 (second revision), Steel Filing Cabinets for General Office Purposes, historical BIS primary document via public mirror. https://law.resource.org/pub/in/bis/S03/is.3313.1983.pdf"
    used_for: "Historical sections1–11, Fig.1 complete cabinet and adjacent construction/finish/testing context. Historic liquid-enamel alternative does not establish powder chemistry or present certification; no old dimensions, thickness, cycles or loads adopted."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General Guide for LCA – Detailed Guidance, First edition March2010, sections7.9.2–7.9.3, printed255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision, exchange-specific determining physical causality and residual process-gate market-value hierarchy; not an industrial production recipe, default share, QFD method or automatic recycling credit."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:b65e5bd65de07e75ab024e4de088cdfa728599ec44109e9a0ab02994f4e9a595"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7269"
      family: "system_boundary"
      span:
        start:
          offset: 7269
          line: 65
          column: 1
        end:
          offset: 16136
          line: 88
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Delivered uncoated cold-rolled steel sheet and separately received whole parts/formulations; complete upstream production is included by suitable supplier datasets |\n| starting_condition_role | foreground_receipt |\n| product_classification_scope | Narrow complete assembled cabinet subset of office metal furniture; no accepted mapping implied |\n| recursive_input_rule | Same-category purchased complete cabinets are outside raw-manufacture reference; an actual returned cabinet is a gross original-cohort event with inherited burden, not new procurement or Q |\n| upstream_dataset_requirement | Match actual steel supply, each whole formulation/part/packaging, electricity voltage/geography and all subcontract processes; verify included components/utilities/finishes to avoid duplication |\n| disclosure | Declare raw/WIP/FG genealogy; all manufacturing/failure work; first-release Q; original service horizon; gross balances and once-only upstream ownership; unsupported fields stay gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_full_route | all inventory rows | Start at received uncoated cold-rolled steel sheet and each complete purchased formulation/part. Include actual cutting, punching, folding, deburring, resistance spot welding or evidenced wire-fed joining, cleaning/derusting, specified conversion pretreatment and rinsing, drying, electrostatic application of one actual powder formulation, thermal cure, complete drawer/slide/lock/handle/foot/interlock assembly and dimensional/function/safety/finish quality release. Packaging/handling/storage/dispatch remain separately traced cohort services. Supplier-prefabricated inputs need complete upstream fabrication/finishing datasets and a clear handoff; do not pretend onsite steelmaking, plating or a boiler. A complete subcontract coating/preparation service and its included material/energy burdens have one owner: record actual foreground flows physically but never charge both the whole provider and the same included loads again. | `pulage-cabinet-manufacture-2025`; `bisley-office-filing`; `bis-is3313-1983-historical` |\n| boundary_release | all inventory rows | Q is the sum of calibrated net masses of uniquely first quality-released complete cabinets in a homogeneous declared configuration/cohort. Closing finished goods already belong to Q; do not add closing FG as another output and do not deduct their manufacturing burdens. Returns, repeat inspection, redelivery and all actual post-release rework create no new Q. The default is not net delivery. A net-delivery study requires a separate coherent method with original-delivery reversal and complete historical FG burden and cannot silently replace this denominator. | `pulage-cabinet-manufacture-2025`; `bisley-office-filing` |\n| boundary_cohort | all inventory rows | Keep all target-related failed production, scrap, destructive specimens, start/stop, idle, cleaning and rework with its cohort. Carry opening/closing raw, WIP and genuinely unused/unassigned stores with a separate inherited burden vector for every exchange, state, conversion and work completed. Manufacturing B_close excludes already first-released FG. Mere waste transfer or sales never removes manufacturing or treatment burdens. A transfer to a genuinely independent other function/cohort requires a justified one-time allocation/handover and an auditable receiving vector. | `pulage-cabinet-manufacture-2025`; `jrc-ilcd-allocation-2010` |\n| boundary_species | all inventory rows | Close gross physical mass and relevant Fe/C/H/O/P/Na and any actual Zn/Mn or other elements independently of the real chemical-species and reaction-water ledger. Cleaning, phosphating and powder cure need actual formulation/extent/emission evidence, not guessed chemistry or a universal coating recipe. Keep reaction, free, structural and phase-change water separate. Total VOC, COD, total metal, total carbon or particle-size totals do not establish any particular molecule; one residual cannot solve two unknowns. Every actual additional input, waste or emission is a named atomic card before dataset use; an unknown is a gap, never a fabricated zero or miscellaneous bundle. | `pulage-cabinet-manufacture-2025`; `jrc-ilcd-allocation-2010` |\n| boundary_packaging | all inventory rows | For each separate packaging material/SKU reconcile opening empty plus attached WIP/FG plus reusable stock + P + I + ER + X_in = closing full corresponding stock + gross S + EO + W + X_out. Each P/I/ER/S/EO/W card is one actual direction/event and uses its complete gross V numerator. P/I ownership is counted once; first non-purchased external ingress retains its physical material and one upstream owner. Internal reuse cancels and is neither a new purchase nor product Q. These legs and repair/water X_in/X_out are de-duplicated only against an OTHER same-event flow on the SAME side (inflow against inflow, outflow against outflow), never against stocks, the opposite side or mere card existence: actual influx remains when new material/water is in closing stock, alongside full closing wet mass. Never stock-correct or economically scale a physical gross card. Weigh each whole wet article once; record its dry substrate, adhesive, liner, metal and retained water as nonadditive composition subaccounts. Separately added onsite components are disjoint exchanges or are explicitly bridged into the whole article without a second input/provider. Natural moisture uptake, drying and ambient-humidity throughflow are recorded physical events, not invented repair water. For one actual mixed-waste outlet measure each originating material W independently: either one mixed total with nonadditive origin subaccounts OR disjoint origin exchanges summing to that total, with one actual treatment-provider charge. Never report both representations as additive outputs. Any actually occurring unlisted species, aqueous phase, component, return state or mixed outlet needs its own compatible atomic card, protocol and provider boundary before a factory dataset is complete; unknown is not zero. | `pulage-cabinet-manufacture-2025`; `jrc-ilcd-allocation-2010` |\n| boundary_services_assets | all inventory rows | Post-release services retain actual incremental burdens, original cohort Q_c, observation horizon, opening/closing FG and returns/dispositions. Already performed service for that cohort stays attributed even when FG remains in store; only unused/unassigned service/charge may carry forward, without correcting stock-corrected consumption twice. Track machines, tools, copper electrodes, replacement parts and installed fluids as physical stocks/events separately from their current attributable service burden. No fixed life or whole-machine-per-kg charge. Record every actual repair and all incurred material, water, energy, losses and burdens, including unauthorized, failed or rejected work. Manufacturer/specification permission, post-work tests, acceptance and disposition govern authorization and current qualification only; they never erase actual facts, prove restoration or create new Q. New/old parts and each aqueous stream remain atomic. | `bisley-office-filing`; `jrc-ilcd-allocation-2010` |\n| packaging_receipt_basis | packaging | For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names. | jrc-ilcd-allocation-2010 |\n\n"
