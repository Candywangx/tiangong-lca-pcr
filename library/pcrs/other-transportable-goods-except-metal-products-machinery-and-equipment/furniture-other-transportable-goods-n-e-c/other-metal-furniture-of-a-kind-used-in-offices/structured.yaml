system_boundary:
  rules:
    - rule_id: boundary_full_route
      applies_to: "all inventory rows"
      rule: "Start at received uncoated cold-rolled steel sheet and each complete purchased formulation/part. Include actual cutting, punching, folding, deburring, resistance spot welding or evidenced wire-fed joining, cleaning/derusting, specified conversion pretreatment and rinsing, drying, electrostatic application of one actual powder formulation, thermal cure, complete drawer/slide/lock/handle/foot/interlock assembly and dimensional/function/safety/finish quality release. Packaging/handling/storage/dispatch remain separately traced cohort services. Supplier-prefabricated inputs need complete upstream fabrication/finishing datasets and a clear handoff; do not pretend onsite steelmaking, plating or a boiler. A complete subcontract coating/preparation service and its included material/energy burdens have one owner: record actual foreground flows physically but never charge both the whole provider and the same included loads again."
      source_ids:
        - pulage-cabinet-manufacture-2025
        - bisley-office-filing
        - bis-is3313-1983-historical
    - rule_id: boundary_release
      applies_to: "all inventory rows"
      rule: "Q is the sum of calibrated net masses of uniquely first quality-released complete cabinets in a homogeneous declared configuration/cohort. Closing finished goods already belong to Q; do not add closing FG as another output and do not deduct their manufacturing burdens. Returns, repeat inspection, redelivery and all actual post-release rework create no new Q. The default is not net delivery. A net-delivery study requires a separate coherent method with original-delivery reversal and complete historical FG burden and cannot silently replace this denominator."
      source_ids:
        - pulage-cabinet-manufacture-2025
        - bisley-office-filing
    - rule_id: boundary_cohort
      applies_to: "all inventory rows"
      rule: "Keep all target-related failed production, scrap, destructive specimens, start/stop, idle, cleaning and rework with its cohort. Carry opening/closing raw, WIP and genuinely unused/unassigned stores with a separate inherited burden vector for every exchange, state, conversion and work completed. Manufacturing B_close excludes already first-released FG. Mere waste transfer or sales never removes manufacturing or treatment burdens. A transfer to a genuinely independent other function/cohort requires a justified one-time allocation/handover and an auditable receiving vector."
      source_ids:
        - pulage-cabinet-manufacture-2025
        - jrc-ilcd-allocation-2010
    - rule_id: boundary_species
      applies_to: "all inventory rows"
      rule: "Close gross physical mass and relevant Fe/C/H/O/P/Na and any actual Zn/Mn or other elements independently of the real chemical-species and reaction-water ledger. Cleaning, phosphating and powder cure need actual formulation/extent/emission evidence, not guessed chemistry or a universal coating recipe. Keep reaction, free, structural and phase-change water separate. Total VOC, COD, total metal, total carbon or particle-size totals do not establish any particular molecule; one residual cannot solve two unknowns. Every actual additional input, waste or emission is a named atomic card before dataset use; an unknown is a gap, never a fabricated zero or miscellaneous bundle."
      source_ids:
        - pulage-cabinet-manufacture-2025
        - jrc-ilcd-allocation-2010
    - rule_id: boundary_packaging
      applies_to: "all inventory rows"
      rule: "For each separate packaging material/SKU reconcile opening empty plus attached WIP/FG plus reusable stock + P + I + ER + X_in = closing full corresponding stock + gross S + EO + W + X_out. Each P/I/ER/S/EO/W card is one actual direction/event and uses its complete gross V numerator. P/I ownership is counted once; first non-purchased external ingress retains its physical material and one upstream owner. Internal reuse cancels and is neither a new purchase nor product Q. These legs and repair/water X_in/X_out are de-duplicated only against an OTHER same-event flow on the SAME side (inflow against inflow, outflow against outflow), never against stocks, the opposite side or mere card existence: actual influx remains when new material/water is in closing stock, alongside full closing wet mass. Never stock-correct or economically scale a physical gross card. Weigh each whole wet article once; record its dry substrate, adhesive, liner, metal and retained water as nonadditive composition subaccounts. Separately added onsite components are disjoint exchanges or are explicitly bridged into the whole article without a second input/provider. Natural moisture uptake, drying and ambient-humidity throughflow are recorded physical events, not invented repair water. For one actual mixed-waste outlet measure each originating material W independently: either one mixed total with nonadditive origin subaccounts OR disjoint origin exchanges summing to that total, with one actual treatment-provider charge. Never report both representations as additive outputs. Any actually occurring unlisted species, aqueous phase, component, return state or mixed outlet needs its own compatible atomic card, protocol and provider boundary before a factory dataset is complete; unknown is not zero."
      source_ids:
        - pulage-cabinet-manufacture-2025
        - jrc-ilcd-allocation-2010
    - rule_id: boundary_services_assets
      applies_to: "all inventory rows"
      rule: "Post-release services retain actual incremental burdens, original cohort Q_c, observation horizon, opening/closing FG and returns/dispositions. Already performed service for that cohort stays attributed even when FG remains in store; only unused/unassigned service/charge may carry forward, without correcting stock-corrected consumption twice. Track machines, tools, copper electrodes, replacement parts and installed fluids as physical stocks/events separately from their current attributable service burden. No fixed life or whole-machine-per-kg charge. Record every actual repair and all incurred material, water, energy, losses and burdens, including unauthorized, failed or rejected work. Manufacturer/specification permission, post-work tests, acceptance and disposition govern authorization and current qualification only; they never erase actual facts, prove restoration or create new Q. New/old parts and each aqueous stream remain atomic."
      source_ids:
        - bisley-office-filing
        - jrc-ilcd-allocation-2010
    - rule_id: packaging_receipt_basis
      applies_to: "packaging"
      rule: "For each actual whole packaging article, P records paid procurement (standalone or bundled, with or without a separate invoice). I records first non-purchased external ingress, including standalone gifts, loans, rental/pool issues and unpaid supplier-attached packaging; supplier attachment is only one I subset. ER requires the same item or an auditable matching batch linked to this site's own prior outward record; another party's prior use alone is not a return. P/I/ER are disjoint. The existing matching physical-article cards and raw subledgers cover these origins subject to every native material/form/state qualification; incompatible actual articles require their own atomic rows, never a substitute UUID. X_in/X_out remain separate measured material/water-change terms, not a substitute for whole-article receipt. Keep gross wet quantities, owner/custodian, payment/non-purchase basis, provenance, prior-outward links, actual state/unit and inherited manufacture/service vectors. A free receipt is neither a new manufacture nor automatically burden-free: attribute actual service and incremental transport/handling once to the proper original cohort/denominator and retain genuinely unused service separately, without a default lifetime or credit. Stock, physical gross legs and burden vectors remain separate. This is the declared conserving foreground-accounting implementation, not a claim that the cited source prescribes these variable names."
      source_ids:
        - jrc-ilcd-allocation-2010
