  identity_metadata_notes:
    - row_id: "finished_cabinet"
      uuid: "d640f8df-64e2-4ca5-b3c0-bd3c5c0b7245"
      issue: "Product; manufactured finished product; production mix at plant. No native CAS, synonyms, particular grade, configuration or supply geography is specified. Apply only to the complete non-electrical steel filing cabinet defined here; this broad family does not identify a SKU, component, supplier, quantity or certified performance."
    - row_id: "steel_sheet"
      uuid: "13082a6a-e820-45ec-89f5-3c2c3650495b"
      issue: "Product; iron-based sheet with carbon and minor Mn/S/P/Si; native comment allows cold or hot rolling; production mix at plant; no fixed geography/CAS/grade. The native alloy/further-worked classification differs from the broad physically consistent sheet description and is disclosed as a taxonomy defect. Select actual uncoated cold-rolled low-carbon sheet only with mill/supply evidence; exclude stainless, plated sheet and prefabricated cabinet parts. No thickness, density or supplier is inferred."
    - row_id: "electricity_factory; service_electricity"
      uuid: "3d76981f-964a-4865-b588-0e067a2a1163"
      issue: "Product; CN supply; 1–35 kV medium-voltage grid-average consumption mix to user. Only the matching purchased meter boundary can use this identity; verify actual voltage, location, grid period and included transformer/distribution losses. Replace identity for another voltage/geography; downstream low-voltage submeter use does not prove purchased low-voltage supply. Reference property is Net calorific value in MJ; convert metered kWh by 3.6, not by material mass."
    - row_id: "tap_water; cooling_in; repair_water_in"
      uuid: "d1e0e36c-07f0-4a75-bdcb-efb5d9e2ac36"
      issue: "Product; treated municipal/potable water production and supply at plant/to consumer; no fixed geography. Reference is Mass/kg; native secondary Volume coefficient is not a measured density. Match actual treatment, quality and provider; not untreated abstraction, deionised water, steam or recovered effluent. Measure density for a volume-to-mass conversion."
    - row_id: "di_water"
      uuid: "4f197bf0-7b3b-11dd-ad8b-0800200c9a66"
      issue: "Product; de-ionised water; single native Mass property with internal reference1. No native CAS, detailed purity, production route, mix, provider or geography. Verify actual de-ionisation and supplied water quality; do not infer conductivity or use for untreated water. Onsite purification keeps the source-water purchase and actual purification consumables/energy once; its internal water handoff is not a second purchase."
    - row_id: "powder_coating"
      uuid: "6e3010f9-fbd3-48f6-95fc-c1b38d2800d2"
      issue: "Product; whole free-flowing dry formulated polymer powder including flow/levelling additives; electrostatic application and heat or UV cure mentioned; no native CAS, mix, geography or fixed resin/grade. This route uses a documented thermosetting polyester or epoxy-based purchased formulation and actual thermal cure, not UV cure or neat resin. Purchase the whole supplied formulation once; component assays are subaccounts. Confirm resin/curative/pigment/additive SDS and supplier cure instructions; no default recipe, solvent absence or zero emissions."
    - row_id: "alkaline_cleaner"
      uuid: "a0f63f93-1a65-4485-a2cf-36adab2762ce"
      issue: "Product; alkaline compound detergent at plant, native pH above7 and NaOH/carbonate examples; Mass/kg. Native surfactant classification does not establish formulation composition. No CAS, supplier, concentration, physical supply form or geography fixed. Use for one confirmed whole purchased alkaline cleaning formulation with actual water/active content; not an optical solvent degreaser or pure NaOH substitute. Separate only chemicals and dilution water actually purchased outside that formulation."
    - row_id: "phosphate_formulation"
      uuid: "fbf49587-4fb7-4264-83f1-24a662469072"
      issue: "Product; at-plant phosphating solution for ferrous conversion pretreatment; native comment lists iron/zinc/manganese variants and immersion; no fixed CAS, concentration, provider or geography. Select one actual supplied iron-phosphating formulation for the declared immersion route; confirm whole wet mass and SDS/assay. It is not pure phosphoric acid, dry salt, zinc-phosphate default or a spent bath. A different spray/nonphosphate route requires its own verified exchange context."
    - row_id: "screw"
      uuid: "895204f6-6425-4814-afc5-cb97e530e892"
      issue: "Product; steel screw auxiliary assembly fastener; GLO at-plant production mix; no native CAS, grade, coating, geometry or provider. Match one actually purchased screw specification and included finish. No bolts, rivets, nuts or whole slide/lock contents are added again as this screw purchase."
    - row_id: "pack_film_p; pack_film_i; pack_film_er; pack_film_s; pack_film_eo"
      uuid: "e64eb06c-6dc9-45f1-b003-3dc6c44b27e2"
      issue: "Product; polyethylene film CAS9002-88-4; at-plant production mix; no fixed geography, grade, gauge, provider or recycled content. Native luggage taxonomy is inconsistent with the otherwise coherent PE-film physical identity. Comment distinguishes competing PET rather than identifying this film as PET. Use only confirmed PE film of actual supply composition; not foam, PET film or resin pellets."
    - row_id: "pack_pallet_p; pack_pallet_i; pack_pallet_er; pack_pallet_s; pack_pallet_eo"
      uuid: "e882bdf4-1cf6-4f51-93e9-c6b91855ba02"
      issue: "Product; whole wooden board/slat pallet, production mix in lumber mill; Mass/kg; no geography, species, moisture, dimensions, reuse life or provider fixed. The electrical-energy classification is an isolated taxonomy defect; the preserved source classification is wooden packaging. Verify actual whole pallet and treatment/moisture; this does not bind resin or steel pallets. Count steel nails already embodied in a purchased pallet only in its composition subaccount."
