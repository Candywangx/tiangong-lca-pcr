system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "profile_make"
      rule: "Include complete receipt/preparation, actual drying if required by the compound, melt heating/shearing/filtration, forming, actual sizing/cooling, pulling/cutting, inspection and first release. Include trials, zero-output/failed lots, starts/stops, idle auxiliaries, cleanup, test samples, regrinding and real rework. Single-screw pellets/cubes are the selected branch; dry-blend and twin-screw alternatives are not silently combined."
      source_ids:
        - geon-rigid-profile-guide
    - rule_id: boundary_compound
      applies_to: "pvc_compound"
      rule: "Purchase each whole formulation once, excluding detachable supply packaging from net compound kg. Retained additives/assay water are composition subledgers. Actual extra masterbatch, lubricant, purge compound, cleaning chemical, fuel, refrigerant or water-treatment reagent needs a distinct named supply/outlet card and mass/energy record before dataset use; do not hide it under zero or other."
      source_ids:
        - geon-rigid-profile-guide
        - dachang-rigid-pvc
    - rule_id: boundary_services
      applies_to: "fg_service"
      rule: "Keep packing, storage, handling and dispatch with a separate lot ledger, including old FG and physical returns with historical burden vectors. Transfer Q internally once; do not add closing FG as a second production output. Later shipment/retest cannot create new production. Unobserved future services are an explicit completeness gap, not fabricated zero."
      source_ids:
        - dachang-rigid-pvc
        - ilcd-attributional-allocation
    - rule_id: boundary_cooling
      applies_to: "cooling_makeup; cooling_purge; evaporation"
      rule: "Maintain water-system opening/closing stock, makeup, internal circulation, effluent, entrained droplets, product moisture and evaporation independently. Melting/cooling is not evidence of reaction water. If heat/water is supplied externally, add actual incoming and Product return streams with measured mass, temperatures/enthalpy and supplier energy convention; do not infer a steam/boiler circuit."
      source_ids:
        - geon-rigid-profile-guide
    - rule_id: boundary_identity
      applies_to: "released_angle"
      rule: "Use only a single declared angle article within the native broad extrusion family; carry its full restricted description and actual product qualifiers. The native CPC 36390 defect is not rewritten or used for mapping acceptance. Exclude hard/soft coextrusion, powder compounding and assembled/machined articles from this selected route."
      source_ids:
        - un-cpc3-2025
        - geon-rigid-profile-guide
        - njpt-pvc-coextrusion
        - tp-rigid-pvc-equal-angles
