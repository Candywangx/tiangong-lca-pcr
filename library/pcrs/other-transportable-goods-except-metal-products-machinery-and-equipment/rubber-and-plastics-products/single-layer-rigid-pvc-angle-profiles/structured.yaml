allocation_rules:
  - rule_id: allocation_context
    applies_to: "all inventory rows"
    rule: "This method is attributional, limited to situations in which allocation is required under the study goal/context. Establish that context first; no discretionary swap between allocation and substitution. Separately metered dedicated operations and actual/virtual subdivision take precedence, including exclusive materials, QA, rejects and specific service histories."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: allocation_causality
    applies_to: "all inventory rows"
    rule: "For any remaining joint inventory, determine and document physical causality for each individual exchange/co-function. Use measured load/operation evidence; the same mass share is not automatically correct for heaters, cooling, material embodiment, occupied storage and serial handling. Account for baseline idle and failed campaigns rather than allocating only successful run time."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: allocation_residual
    applies_to: "genuine remaining multifunctional process"
    rule: "Only a genuinely unassignable residual may use contemporaneous market values for real co-functions at the same actual joint-process exit and physical/quality state. Reconstruct that gate price if only later conditioned/packed/delivered prices exist, with transparent adjustments and sensitivity. Evidence must establish real co-product status and the true joint process; waste sale or internal regrind alone establishes neither a co-product nor avoided production. No fixed ratio, automatic credit or negative waste burden. For each exchange, all exclusive/causal/residual and carried assignments must sum to its undivided original amount. Apply consistent criteria to comparable co-functions/processes and document justified differences."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "profile_make"
      flow_role: "pvc_compound; filter_screen; clean_pvc_offcut; degraded_pvc; captured_pvc_dust; spent_screen"
      record_type: "weighing_and_supply_record"
      raw_fields: "lot_id; supplier; complete_formulation; supplied_form; gross_mass; tare; net_mass; assay; opening_raw; closing_raw; receipts; issued_mass; waste_mass; destination; screen_alloy; service_history; calibration_id"
      collection_method: "Weigh complete deliveries/issues and each separate waste on calibrated scales; trace supplier specifications and constituent assays. Reconcile raw-stock change, contamination and physical losses, including failed/purge/test material. Preserve recorded units. Retain raw undivided amounts and stock reconciliation; cp_stock builds A_i; normalize_once alone reports per 1 kg reference flow."
      unit: "kg"
      frequency: "each receipt and issue; every run and waste transfer"
      temporal_coverage: "full campaign including start/stop, idle and cleanup; stock cutoffs matched"
      site_scope: "one declared profile line and supplier/grade cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; whole formulation specification; assay; waste tickets; screen change logs"
    - protocol_id: cp_energy
      process_id: "profile_make"
      flow_role: "make_electricity"
      record_type: "meter_record"
      raw_fields: "meter_id; voltage; geography; provider; interval_start; interval_end; kWh_start; kWh_end; true_power_rate; run_state; service_lot; shared_load; causal_driver; baseline_idle; allocation_decision"
      collection_method: "Read calibrated submeter differences for every unit operation and service; integrate only independently measured power rates when no integrated counter exists. Include actual drying and utilities. Apply section 7 to shared loads after raw unit conversion. Preserve undivided interval energy; convert kWh to MJ then attribute and carry vectors in cp_stock/cp_fg; normalize_once alone reports per 1 kg reference flow."
      unit: "kWh; MJ"
      frequency: "each operating interval and service interval"
      temporal_coverage: "continuous full campaign and declared FG service window"
      site_scope: "actual CN <1 kV user delivery interface; separate make/FG meters"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; load survey; idle logs; allocation sensitivity"
    - protocol_id: cp_energy_fg
      process_id: "fg_service"
      flow_role: "fg_electricity"
      record_type: "meter_record"
      raw_fields: "meter_id; voltage; geography; provider; interval_start; interval_end; kWh_start; kWh_end; true_power_rate; run_state; service_lot; shared_load; causal_driver; baseline_idle; allocation_decision"
      collection_method: "Read calibrated FG-store/handling/packing/loading submeter differences, including their real idle and cleanup intervals. Manufacturing energy stays in cp_energy. Assign every undivided service numerator to its original release lot. Preserve undivided interval energy; convert kWh to MJ then attribute and carry vectors in cp_stock/cp_fg; normalize_once alone reports per 1 kg reference flow."
      unit: "kWh; MJ"
      frequency: "each operating interval and service interval"
      temporal_coverage: "declared observed FG service window and original release histories"
      site_scope: "actual CN <1 kV user delivery interface; separate make/FG meters"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; load survey; idle logs; allocation sensitivity"
    - protocol_id: cp_water
      process_id: "profile_make"
      flow_role: "cooling_makeup; cooling_purge; evaporation"
      record_type: "water_balance_record"
      raw_fields: "meter_id; raw_unit; makeup; opening_loop; closing_loop; recirculation; liquid_purge; entrained_droplets; retained_product_water; measured_net_evaporation; temperature; pressure; density_evidence; humidity_in; humidity_out; actual_flow_rate; time_interval; treatment_destination"
      collection_method: "Meter/weigh makeup and each real outlet plus stored water; independently measure density/state and net air moisture transfer. Verify closed versus open water systems from the actual line. Reconcile free, retained and phase-change water without fitting two unknowns to one residual. Keep raw undivided amounts and independently resolved stock/phase terms; cp_stock supplies A_i; normalize_once alone reports per 1 kg reference flow."
      unit: "kg; m3"
      frequency: "each interval and drain event"
      temporal_coverage: "full campaign including cleaning and no-output periods"
      site_scope: "actual extrusion/sizing/cooling/drying water circuit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter tests; density/state record; samples; humidity calibration; water closure; treatment manifest"
    - protocol_id: cp_species
      process_id: "profile_make"
      flow_role: "hcl_air; escaped_pvc_particle"
      record_type: "speciated_emission_record"
      raw_fields: "sample_id; species; CAS; particle_size; receptor; control_boundary; concentration; concentration_unit; actual_or_standard_volume; integrated_volume; actual_volume_rate; interval; temperature; pressure; humidity; detection_limit; capture_mass; composition"
      collection_method: "Measure individual gas/particle species at actual outlets and control captures, including start-up/degraded events; identify actual matrix/compartment and wet/dry bases. Convert concentration with a compatible volume amount, not an already integrated volume times time. A nondetect is bounded evidence, not a universal zero. Preserve undivided measured species amounts and uncertainty; cp_stock attributes A_i; normalize_once alone reports per 1 kg reference flow."
      unit: "kg; mg/m3; m3"
      frequency: "representative states plus every abnormal event"
      temporal_coverage: "full campaign with represented and unrepresented intervals explicit"
      site_scope: "specific extrusion/cutting exhaust and fugitive boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "laboratory methods; raw chromatograms or chemical results; flow calibration; detection limits; uncertainty"
    - protocol_id: cp_release
      process_id: "profile_make"
      flow_role: "released_angle"
      record_type: "quality_release_record"
      raw_fields: "release_id; parent_lot; drawing; compound_grade; dimensions; measured_length; conditioned_mass; gross_mass; packaging_tare; moisture; cut_length; visual_acceptance; drawing_tolerances; test_results; first_release_flag; failed_mass; repeated_inspection_id"
      collection_method: "Weigh cooled conditioned bare angles, record dimension/appearance and contract-required tests against approved drawing; uniquely identify first positive release. Destructive samples, rejects and later retests are separate events, not extra accepted mass. Sum unique first-release net masses into Q without other divisions; normalize_once alone represents 1 kg reference flow."
      unit: "kg; m; mm"
      frequency: "every lot and release decision"
      temporal_coverage: "declared first-release cohort with earlier WIP trace"
      site_scope: "one matched grade/drawing/state at factory release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated balances; approved drawing; actual release/test records; moisture protocol; duplicate-ID audit"
    - protocol_id: cp_stock
      process_id: "profile_make"
      flow_role: "all manufacturing rows and internal regrind"
      record_type: "stock_and_burden_vector_record"
      raw_fields: "lot_id; physical_state; opening_WIP_mass; closing_WIP_mass; opening_regrind; closing_regrind; internal_transfer_id; initial_component_assay; inherited_vector_by_exchange; current_raw_vector; state_conversion; exclusive_assignment; causal_assignment; residual_assignment; destination_vector; Q"
      collection_method: "Independently weigh stocks at matched cutoffs and trace every component/exchange burden by lot across periods. Pair regrind outputs/inputs and include actual grinding energy/loss; do not charge original compound twice. Assign current and inherited burdens to released lots, WIP, wastes and genuine co-functions without erasure. Preserve row-native undivided A_i vectors after conversion and section 7 attribution; normalize_once alone reports per 1 kg reference flow."
      unit: "kg; row-native numerator units"
      frequency: "each transfer and period cutoff"
      temporal_coverage: "complete inherited and current campaign histories"
      site_scope: "same make-line cohort plus physical stock locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "opening/closing counts and weights; parent-child lot links; vector conservation; failure/rework logs"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "release_to_stock; customer_return; gross_shipped_angle; damaged_angle"
      record_type: "finished_stock_service_record"
      raw_fields: "original_release_id; shipment_id; return_id; opening_FG; closing_FG; new_release_Q; gross_shipped_mass; physical_returns; returned_burden_vector; original_delivery_reverse; damage; incremental_rework_vector; storage_duration; handling_events; inherited_vector; service_cutoff"
      collection_method: "Reconcile physical opening FG + new Q + external physical returns = closing FG + gross physical dispatch + actual discarded FG. Preserve original release/delivery history and reverse prior delivery assignments on returns before applying genuine new service/rework. Carry all old-lot burdens independently; no stock or reinspection becomes new production. Preserve undivided physical movements and per-release service A_i vectors; pair internal Q on consolidation; normalize_once alone reports per 1 kg reference flow using the original Q."
      unit: "kg; h; row-native numerator units"
      frequency: "every movement/return and cutoff"
      temporal_coverage: "release to observed service cutoff; open intervals disclosed"
      site_scope: "same actual FG/store/dispatch boundary and traceable release lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock reconciliation; dispatch/return notes; original delivery reversals; timestamps; vector audit"
    - protocol_id: cp_pack
      process_id: "profile_make"
      flow_role: "inbound_pp_sack; spent_pp_sack"
      record_type: "article_specific_packaging_record"
      raw_fields: "article_id; composition; supplier; whole_article_mass; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; purchased; included_supplier_packaging; external_return_received; closing_empty; closing_attached_WIP; closing_attached_FG; closing_reusable; gross_outbound_attached; external_return_sent; waste; internal_reuse; contamination"
      collection_method: "For each actual article separately weigh and reconcile opening empty/attached WIP/attached FG/reusable + external purchased or supplier-included article receipts + external return received = closing in all four states + packaging on gross physical outward shipments + external returns sent + waste. Distinguish paid purchases from included/returned articles. Reusable or extra packaging requires its own named cards. Keep undivided article balances; internal reuse cancels and never adds purchase, product Q or automatic co-product; normalize_once alone reports attributable A_i per 1 kg reference flow."
      unit: "kg; item"
      frequency: "each receipt, application, movement and cutoff"
      temporal_coverage: "whole supplier-receipt and FG-service interval"
      site_scope: "one physical article type at a time; no mixed bundle"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "article bill of materials; measured tares; invoices; full gross shipment/return records; waste evidence"
    - protocol_id: cp_pack_fg
      process_id: "fg_service"
      flow_role: "shipping_carton; ldpe_wrap; paper_label; carton_waste; film_waste; label_waste"
      record_type: "article_specific_packaging_record"
      raw_fields: "article_id; composition; supplier; whole_article_mass; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; purchased; included_supplier_packaging; external_return_received; closing_empty; closing_attached_WIP; closing_attached_FG; closing_reusable; gross_outbound_attached; external_return_sent; waste; internal_reuse; contamination"
      collection_method: "For each actual article separately weigh and reconcile opening empty/attached WIP/attached FG/reusable + external purchased or supplier-included article receipts + external return received = closing in all four states + packaging on gross physical outward shipments + external returns sent + waste. Distinguish paid purchases from included/returned articles. Reusable or extra packaging requires its own named cards. Keep undivided article balances; internal reuse cancels and never adds purchase, product Q or automatic co-product; normalize_once alone reports attributable A_i per 1 kg reference flow."
      unit: "kg; item"
      frequency: "each receipt, application, movement and cutoff"
      temporal_coverage: "whole supplier-receipt and FG-service interval"
      site_scope: "one physical article type at a time; no mixed bundle"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "article bill of materials; measured tares; invoices; full gross shipment/return records; waste evidence"
  calculation_rules:
    - id: raw_convert
      applies_to: "all inventory rows"
      rule: "Convert recorded mass/length/energy and independently evidenced physical state before attribution; integrate only true rates; integrated amounts retain one time integration. Retain original units and exact conversion evidence."
      inputs:
        - cp_material
        - cp_energy
        - cp_energy_fg
        - cp_water
        - cp_species
        - cp_release
      output: "converted_raw_vector"
      source_ids: []
    - id: attribute_vector
      applies_to: "all inventory rows"
      rule: "A_i is the undivided row-native numerator assigned to the same original first-release cohort: inherited opening vectors plus converted current activity, less independently established closing WIP/regrind carry and genuine other-cofunction assignments, with section 7 allocation and all real failure/rework burdens retained. FG service remains attributed to its original release lot. No single residual fits two unknown outlets or burdens."
      inputs:
        - converted_raw_vector
        - cp_stock
        - cp_fg
        - cp_pack
        - cp_pack_fg
      output: "A_i"
      source_ids:
        - ilcd-attributional-allocation
    - id: first_release_quantity
      applies_to: "released_angle"
      rule: "Q = sum of unique positive first-release conditioned net angle kg; exclude failed/repeated/returned/re-delivered mass from new production. A voided release is reconciled by its original ID and burden history, never silently replaced by a new denominator."
      inputs:
        - cp_release
        - cp_stock
      output: "Q"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q for Q > 0; A_i retains this row's physical numerator unit and Q is same-cohort first-release kg. Apply once only at final reporting; cards and protocol aggregation refer to this same operation. released_angle represents 1 kg. If Q = 0 retain all raw burdens/stocks and report no unit result; do not divide, discard failed burden or borrow another cohort denominator."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "x_i"
      source_ids: []
    - id: gate_conservation
      applies_to: "all inventory rows"
      rule: "Independently close manufacturing mass/constituent balances with opening/closing WIP/regrind and physical Q. Close FG using cp_fg. Consolidate by cancelling paired internal Q and regrind: external opening stocks plus real external material/water/packaging receipts and returns equal closing stocks plus gross external article/packaging shipments, external returns, wastes and measured emissions. Energy is not added to physical mass. Q remains the release normalization event, not an extra consolidated physical outlet. Check C/Cl and relevant additive elements independently of species and physical water/phase evidence."
      inputs:
        - cp_material
        - cp_water
        - cp_species
        - cp_stock
        - cp_fg
        - cp_pack
        - cp_pack_fg
        - cp_release
      output: "gate_balance_residuals"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all rows and reference"
      requirement: "Retain complete composition/form/route/state and native UUID restrictions in consumable descriptions and metadata. Confirm actual CN low-voltage delivery and match all providers; blank auxiliary UUIDs require resolution, never invented collection bindings."
      evidence: "supplier specifications and full native identity/support-chain evidence"
    - id: dq_complete
      applies_to: "whole cohort"
      requirement: "No routine deletion of no-output/failed/idle/cleanup/rework activities; maintain lot stock and every inherited exchange vector. Disclose each omitted/unmeasured operation/species and open FG service window. Missing measurements are data gaps, not zero."
      evidence: "event logs and stock/vector closure"
    - id: dq_measurement
      applies_to: "raw records and calculation"
      requirement: "Retain calibration, test specification, sampling representativeness, units, method uncertainty, detection limits and complete period/site coverage. Quantities are site-specific future records, not measurements fabricated by this method. No source range is a universal QA acceptance limit."
      evidence: "raw data, calibration and uncertainty budget"
    - id: dq_sources
      applies_to: "source-dependent methods"
      requirement: "Use original context and alternative routes; industrial processing evidence does not establish allocation. No shared SKU, recipe or plant is asserted across sources. Independent science and translation review remain separate from mechanical checks."
      evidence: "primary originals and ILCD context with explicit transfer limits"
validation_rules:
  - rule_id: validate_reference
    applies_to: "released_angle"
    rule: "Require one matched article/grade/drawing/state, all declared qualifiers, unique cp_release IDs and the explicit reference_flow_link. Confirm 1 kg net conditioned product excluding all packaging, and no second Q from stock, retest, return or dispatch."
    source_ids:
      - tp-rigid-pvc-equal-angles
      - geon-rigid-profile-guide
  - rule_id: validate_inventory
    applies_to: "all inventory rows"
    rule: "Every actual exchange is a separate physical/chemical card with direction/type, native property/unit, description, protocol and sources. Confirm original identity/form/route/CAS/media/property constraints, not just name or classification. Missing or conflicting auxiliary identity stays explicit and blocks the affected dataset use until resolved."
    source_ids: []
  - rule_id: validate_conservation
    applies_to: "all inventory rows"
    rule: "Execute raw_convert, attribute_vector, first_release_quantity, normalize_once and gate_conservation. Check independent mass, C/Cl/other relevant element, actual water/species, packaging and inherited-vector balances with measurement uncertainty. Unknowns remain unresolved; no tuned residual, assumed species or double normalization can establish closure."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "all shared activities"
    rule: "Check dedicated/virtual subdivision before exchange-specific determining physical causality and only then justified same-gate contemporaneous residual market value. Retain all shares/boundaries and sensitivity; no automatic scrap credit or same allocation key for every exchange."
    source_ids:
      - ilcd-attributional-allocation
  - rule_id: validate_readiness
    applies_to: "completed dataset"
    rule: "Require actual supply/drawing/acceptance and period-specific observations before calling a dataset complete. Q = 0 has no unit result. An unobserved FG service tail cannot support a complete dispatch-boundary claim. Method checks do not constitute scientific/translation approval, mapping acceptance or publication."
    source_ids:
      - geon-rigid-profile-guide
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A specified mass-based profile-manufacturing input for later assembly, installation or separately modelled product systems"
  allowed_use: "Only matched rigid PVC equal-angle route/state and declared first-release gate; include actual observed services by original release cohort"
  excluded_use: "Whole CPC 36310 coverage; structural/thermal/fire/service-life equivalence; pipe/sheet/yarn or finished-building substitution; automatic recycled-content/avoided-burden credit"
  required_metadata: "All section 3 qualifiers, actual providers, complete BOM, state-specific release and stock/vector histories, linked upstream transport and waste treatment, allocation and capital boundary"
  required_quality_disclosure: "Period/site coverage, measured versus missing quantities, blank auxiliary identities, generic native family restrictions, uncertainty, allocation sensitivity and observed/open service intervals"
  update_trigger: "Grade/form/drawing/route/provider changes, altered cooling or controls, added packaging/chemistry, new release evidence, later service tail and independent review"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0, Structure and Explanatory Notes, 30 June 2025, pp.177–179. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Semifinished profile category and adjacent/residual exclusions only; no recipe or mapping acceptance"
  - id: "geon-rigid-profile-guide"
    type: "handbook"
    reference: "GEON Rigid Vinyl Profiles Extrusion Guide; 2019 contents, 2021 copyright footer; printed pp.2–5 and 9, full disclaimer. https://www.geon.com/hubfs/Content/BC_Building-and-Construction/PG_Processing-Guide/PG0014BC_GEON-Rigid-Vinyl-Extrusion-Guide.pdf"
    used_for: "Complete-compound pellets/cubes, single-screw route, actual drying condition, forming/cooling/pulling/cutting, regrind/degradation/quality concerns and powder/twin-screw alternatives. No operating/quantity/performance default or allocation evidence."
  - id: "tp-rigid-pvc-equal-angles"
    type: "extension_guidance"
    reference: "TP Extrusions, Plastic Equal Angles, publisher product page, snapshot 2026-10-16. https://www.tpextrusions.com/index.php/products/angles/plastic-pvc-equal-angles/"
    used_for: "Independent real rigid PVC equal-angle product, drawing/geometry/supply identity; no common GEON SKU, recipe, density or service life"
  - id: "dachang-rigid-pvc"
    type: "extension_guidance"
    reference: "Dachang Plastic Hardware Processing Factory, Rigid PVC Profile, publisher page, snapshot 2026-10-16. https://www.dachangplastic.com/pvc-profile/rigid-pvc-profile/"
    used_for: "Independent rigid-angle/finishing/packing context and contrary onsite powder-compounding route. No source temperature, additive recipe, grade, claim or plant rate is adopted."
  - id: "njpt-pvc-coextrusion"
    type: "extension_guidance"
    reference: "N.J. Precision Technologies, Rigid PVC/Flexible PVC, publisher tooling case, snapshot 2026-10-16. https://www.njpt.com/plastic-extrusion/pvc/"
    used_for: "Concrete counterexample of rigid/soft coextrusion with a separate melt feed and flexible lip/cap; not evidence for this single-layer recipe or allocation"
  - id: "ilcd-attributional-allocation"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook, General guide for Life Cycle Assessment—Detailed guidance, First edition March 2010, §§7.9.2–7.9.3, printed pp.255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Only attributional allocation-required context: dedicated/virtual subdivision, exchange-specific determining physical causality and genuine residual same-gate market value. Not industrial route, quantities or unrestricted substitution."
