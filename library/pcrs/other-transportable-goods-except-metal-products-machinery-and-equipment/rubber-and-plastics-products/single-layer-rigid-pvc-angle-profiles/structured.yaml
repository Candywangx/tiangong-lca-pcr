measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is unique newly first-quality-released net angle kg for one matched grade/drawing/state cohort, weighed with calibrated tare subtraction at the declared conditioning/moisture state. Failed runs, retests, delivery and returned articles do not create Q. Closing FG containing this release already includes its Q."
  - id: linear_mass
    applies_to: "length or item records"
    required_property_ref:
      name: "Mass and length"
      uuid: ""
    required_unit: "kg; m; item"
    rule: "Measure same-lot conditioned net mass m_lot and length L_lot independently; length l becomes l*m_lot/L_lot kg. Item counts require the actual matched article net mass, never a guessed kg/item or nominal profile density. Keep raw unconverted records."
  - id: energy_basis
    applies_to: "make_electricity; fg_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Use the native Units of energy 93a60a57-a3c8-11da-a746-0800200c9a66 reference MJ; convert metered kWh to MJ by 3.6 before attribution and normalize_once. Already integrated energy is not multiplied by time. Rated machine power alone is not consumption."
  - id: state_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass and actual physical state"
      uuid: ""
    required_unit: "kg; m3; h"
    rule: "Integrate only true rates. Integrated liquid/gas volume is already an amount. Density must be independently evidenced for the particular substance and temperature/pressure/composition; do not use water density for formulation, effluent or gas and do not derive density from a native secondary property. Keep actual/standard gas and wet/dry bases distinct."
