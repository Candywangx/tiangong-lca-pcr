  semantic_boundary_decision: Complete single-layer virgin-PC dedicated indoor lighting diffuser extrusion from
    whole supplied pellets to unique first quality release; actual post-release services separately traced. Checked33
    material1247 and six current reviewed comparison intakes do not supply this compatible optical PC extrusion
    method. Metal lighting-parts PCR explicitly excludes plastics-only parts. Generic profile, resin and whole-lamp
    endpoints differ; no whole36960 claim.
  source_synthesis_limitations: Condale UK capabilities and Covestro2018/2016 processing guides are independent
    qualitative technical synthesis, not one SKU/factory/recipe/grade or proof of CN manufacture. No temperatures,
    moisture limits, MVR, dimensions, recipe ratios, density, mass per item/metre, life, performance, certification,
    allocation shares or emission factors transferred. IFC Table4 has no PC entry. ILCD applies only to a declared
    attributional scenario needing allocation.
  reference_gate: Q is unique newly first-quality-released cooled bare diffuser net kg. Closing FG of that cohort
    is already in Q. Actual packing/storage/handling/dispatch and gross physical custody are separate service accounts.
    Retain old cohort original Q, every inherited vector, raw/WIP/FG plus disjoint loop/charge stocks, failed/idle/cleanup/rework
    loads and both external return directions. One calc_reference division; Q=0 retains burden without unit result.
  ordinary_gaps:
  - Actual future site/grade/formulation/drawing and optical mechanical acceptance remain foreground requirements,
    not invented constants.
  - Specific unresolved auxiliaries/wastes/species/package identities require compatible complete direct identity
    and provider verification; queries are not no-hit claims.
  - Conditional equipment/species/package presence needs actual evidence. Unknown species/history or real changed
    route holds the quantitative data package, not an invented zero.
  true_core_holds: []
  native_identity_limitations:
    terminal: One finished bare single-layer PC lighting diffuser of the declared drawing, host interface and optical
      specification at first quality release. Native broad plastic lighting-parts Product flow is manufactured finished
      product, production mix at plant, with no CAS, polymer, extrusion route, geometry, performance, lifetime or
      fixed geography. It is used only for this qualified manufactured optical part; it does not establish whole-lamp,
      generic enclosure, electrical-insulating-fitting or all-leaf applicability. Verify material and host-specific
      dimensional/optical/mechanical acceptance. Packaging and fitted LED/electrical parts are excluded from net
      part mass.
    pc_feed: Whole actual purchased virgin unreinforced PC pellet formulation, including its supplied optical diffusion
      or stabilising constituents. Native Product flow is PC granulate, GLO production mix at plant, Mass reference;
      no CAS, fixed linear/branched structure, grade, pigment recipe or supply geography field is specified. GLO
      is not a verified site provider. Verify actual extrusion-grade complete formulation, origin and optical acceptance;
      never bind PC/PBT blends, external recyclate, internal regrind or the electronics-enclosure proxy. Constituents
      are composition subledgers, not repeated purchases.
    electricity: Native Product flow is CN grid-average 1–35 kV alternating-current consumption mix to user, with
      reference Net calorific value as energy in MJ. Use only the actual CN medium-voltage plant import gate; reconcile
      real transformers and downstream distribution losses against branch loads. Other geography, voltage or supply
      route needs another verified flow/provider. Onsite dryers, extruder, die heaters, haul-off, saw, grinder,
      extraction, compressor and chiller consume this imported electricity once; do not purchase their internally
      generated services again.
    water: Actual treated tap-water supply crossing the plant gate; native Product flow is municipal/potable water
      production supply, Mass reference, with no fixed geography in flowInformation. Its secondary Volume coefficient
      is native metadata, not a measured density. Verify actual source, treatment and state; not raw water, deionised
      water, recirculating water or external heat-exchange return. Measure makeup and separate every real cleaning/cooling
      destination.
    carton: "One complete corrugated shipping carton is a specific unresolved physical exchange. The generic unspecified-packaging native record was not adopted; it cannot establish carton construction, composition or provider scope. Collect all actual purchase, external-return, dispatch and waste directions separately."
