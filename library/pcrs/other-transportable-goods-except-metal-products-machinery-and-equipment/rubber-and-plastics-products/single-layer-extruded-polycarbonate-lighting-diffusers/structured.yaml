system_boundary:
  rules:
    - rule_id: boundary_applicability
      applies_to: "all processes"
      rule: "Apply only to a dedicated indoor-lighting-host single-layer non-cellular unreinforced virgin-PC diffuser made from complete supplied pellets and cut to length. Exclude complete lamps/LEDs/drivers, electrical enclosures, insulating fittings, generic building profiles, formed sheet, other polymers/PC blends, external recyclate, reinforcement/foam, multilayer/UV coextrusion, onsite resin/masterbatch compounding, injection moulding, coating/printing, bonding/assembly and outdoor/medically certified use. Actual departures require complete route review and every actual atomic exchange, not hidden zero."
      source_ids:
        - condale-pc
        - covestro-et-2016
        - un-cpc3-2025
    - rule_id: boundary_source_context
      applies_to: "all processes"
      rule: "Industrial sources are qualitative independent technical synthesis, not one SKU/grade/recipe/factory. Condale UK capability does not establish CN manufacture; each utility geography and provider needs actual compatibility. No source processing threshold, dimension, yield, density, unit mass, energy intensity, lifetime or certification is a default. Preserve real drawing and optical/dimensional/mechanical acceptance; a resin fire rating is not a finished-diffuser or whole-luminaire approval."
      source_ids:
        - condale-pc
        - condale-lighting
        - covestro-pc-2018
        - covestro-et-2016
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Include the complete actual pellet-to-diffuser conversion and all installed utilities. Record actual drying or melt degassing, die/sizing/cooling/haul-off/cut operations and optical rejection. No fuel/steam/boiler, wash plant, abatement train or refrigerant is presumed. Any actual additional operation needs named atomic inputs/outputs and applicability review."
      source_ids:
        - covestro-pc-2018
        - condale-manufacture
        - ifc-plastics-2007
    - rule_id: boundary_feed
      applies_to: "pc_feed"
      rule: "Whole purchased PC formulation crosses once; supplied diffusion additives and stabilisers remain its composition subledger. Actual separate masterbatch mixing changes the route and requires every whole purchased preparation, mixing energy and loss. Internal regrind retains configuration, contamination and thermal history plus each inherited burden vector; never call it new virgin purchase or free feed."
      source_ids:
        - covestro-et-2016
        - ifc-plastics-2007
    - rule_id: boundary_stocks
      applies_to: "all processes"
      rule: "Use disjoint raw-material, WIP, FG, water-loop, oil-charge, refrigerant-charge and abatement-stock accounts, each with opening/closing quantity, state and inherited exchange vector. Do not count circulating water or an in-equipment charge again as WIP. Raw-material withdrawals reflect real stock changes. Retain historical cohorts and original denominators; future missing vectors hold a quantitative package."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_gates
      applies_to: "all processes"
      rule: "Manufacturing Q is first quality release once. Same-batch closing FG is inside Q. Post-release service burdens attach to actual serviced cohorts/intervals including stock remaining unshipped; carry opening/closing FG history, gross dispatch and both external return directions. Reinspection creates no production; actual incremental rework attaches once to the original cohort. Consolidation cancels internal Q transfer and every internal recovery without erasing their burdens."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_water
      applies_to: "manufacture"
      rule: "Separate purchased makeup, free feed moisture, in-loop water, condensate, actual evaporation, aqueous waste and external Product returns. Record actual gross received/returned heat-exchange water with temperature/pressure/enthalpy and supplier water/energy agreement. No presumed reaction or hydration/dehydration is inferred from one residual; mass and relevant element balances are independent from species/reaction-water evidence."
      source_ids:
        - ifc-plastics-2007
    - rule_id: boundary_species
      applies_to: "manufacture"
      rule: "Screen actual SDS/process/outlet evidence for each real chemical and destination. IFC Table4 omits PC; no listed other-polymer species or factor is transferred. Phenol and R134a cards are conditional, not proof of emissions. VOC/COD/TOC and uncharacterised losses remain indicators/uncertainty; add independently identified species and correct compartments individually before quantitative completion."
      source_ids:
        - ifc-plastics-2007
    - rule_id: boundary_packaging
      applies_to: "all processes"
      rule: "For each single package material: opening empty + opening attached-to-WIP/FG + opening reusable + external acquisition + external returns received = corresponding closing stocks + packages with gross physical shipments + separate external returns sent + waste. Cancel internal reuse; never reduce real outward mass by allocation or reuse. Packaging is not bare diffuser Q, new purchase on reuse, or an automatic coproduct/credit. Keep inlet sacks and each supply-service package separate."
      source_ids:
        - ilcd-general-2010
