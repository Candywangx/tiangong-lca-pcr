    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "Whole pellet supply and raw/WIP genealogy"
      record_type: "raw foreground record"
      raw_fields: "lot; grade; supplied composition; receipt issue return weights; opening closing raw stock; WIP quantities states and per-exchange vectors; regrind thermal history"
      collection_method: "Calibrated net weighing and supplier documents; reconcile disjoint raw/WIP stocks and internal recovery without dropping failed lots"
      unit: "kg"
      frequency: "Each actual movement or meter interval and stock boundary"
      temporal_coverage: "Complete campaign plus observed service interval including zero-output records"
      site_scope: "Actual site line configuration and original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration source records full stock/vector reconciliation and uncertainty"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "Actual imported and branch electricity"
