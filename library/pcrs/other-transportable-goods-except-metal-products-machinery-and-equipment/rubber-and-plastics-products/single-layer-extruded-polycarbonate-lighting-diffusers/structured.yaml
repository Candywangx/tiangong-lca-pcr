      collection_method: "Meter actual incremental loads and identify serviced cohort; apply exchange-specific causality only to shared remainder, carrying uncompleted observed-interval service burden explicitly"
      unit: "kWh or MJ"
      frequency: "Each actual movement or meter interval and stock boundary"
