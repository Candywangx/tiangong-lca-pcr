      site_scope: "Actual site line configuration and original cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration source records full stock/vector reconciliation and uncertainty"
  calculation_rules:
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert original units before attribution: electricity MJ = 3.6 times measured kWh; mass from volume uses independently measured substance/state density. Integrate only real rates once; already integrated volume is not multiplied by duration. Retain original observations and uncertainty."
      inputs:
        - raw_observations
        - native_units
        - measured_density
        - actual_rates
      output: "converted_raw"
      source_ids: []
    - id: calc_release
      applies_to: "first_release"
      rule: "Q = sum of unique newly first-quality-released net bare diffuser kg in cp_release for the declared configuration/cohort. Closing FG of that cohort is already within Q; old returns and reinspection/reshipment add no new Q."
      inputs:
        - cp_release
        - configuration
        - cohort
      output: "Q"
      source_ids:
        - condale-pc
        - condale-lighting
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "A_i is the attributable unnormalised amount of row i after unit conversion, disjoint raw/WIP/FG and equipment-loop opening/closing stock/vector reconciliation and internal-transfer cancellation. Retain failed/idle/cleanup/rework loads. Apply section7 exchange by exchange only where shared. Real physical custody outputs remain gross quantities; no burden allocation reduces their mass. Supply-service A_i is incremental for its observed cohort interval; old cohorts retain original Q and per-exchange history."
      inputs:
        - converted_raw
        - opening_vectors
        - closing_vectors
        - allocation_evidence
        - internal_transfers
        - cohort_history
      output: "A_i"
      source_ids:
        - ilcd-general-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q for Q>0, exactly once. A_i is this row attributable raw amount in its stated unit from calc_attribution; Q is first-release kg from calc_release. Cards and aggregation only reference this same stored result per1kg reference flow. For Q=0 retain raw burden without a unit result. Historical cohorts use their original Q, never the current campaign denominator."
      inputs:
        - A_i
        - Q
        - calc_attribution
        - calc_release
      output: "x_i"
      source_ids: []
    - id: calc_physical
      applies_to: "all processes"
      rule: "Close unallocated manufacturing mass: opening WIP + each actual material withdrawal + opening disjoint in-process water/oil/refrigerant/carbon stocks = Q + closing WIP + closing disjoint stocks + all actual external outputs/losses. Raw-material stores reconcile separately. FG: opening FG + internal new-Q handover + external returns received = closing FG + gross dispatch + separate outward returns + actual FG waste/loss. Consolidation cancels the internal Q handover and recovery; energy is no mass. Do not add same-batch closing FG to manufacturing Q. Independently check relevant element/species balances and measured moisture with uncertainty; one residual cannot solve two unknowns."
      inputs:
        - cp_material
        - cp_water
        - cp_aux
        - cp_waste
        - cp_emissions
        - cp_release
        - cp_fg
      output: "unallocated_physical_balances"
      source_ids: []
    - id: calc_packaging
      applies_to: "all processes"
      rule: "Apply boundary_packaging separately to each material and inlet sack; preserve actual gross outward and both external-return directions before attribution. Account attached WIP/FG packages and reusable stocks once. Internal reuse cancels; only external acquisitions incur a new purchase, subject to provider already-included boundaries."
      inputs:
        - cp_packaging_in
        - cp_packaging
        - cp_fg
      output: "package_material_balances"
      source_ids: []
    - id: calc_quality
      applies_to: "all inventory rows"
      rule: "Retain source identity, measurement uncertainty, non-detect limits, stock history and applicable provider restrictions. Unknown chemical fate, missing inherited vectors or core route/reference inconsistency blocks a completed quantitative package; do not invent zeros, default density, fixed losses or assumed compliance."
      inputs:
        - raw_observations
        - uncertainty
        - cp_release
        - cohort_history
      output: "quality_disclosures"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Inspect full native identity including every name qualifier comment CAS type property reference index and all geography; do not substitute chemical species or particle compartments by a matching word. Use official zh baseName for selected UUIDs."
      evidence: "Verified identity chain and actual provider compatibility"
    - id: dq_coverage
      applies_to: "all processes"
      requirement: "Cover full matched campaigns and actual services with start/stop idle failed cleanup and rework; no favourable-run sampling or hidden unlisted totals. Keep zero-output and absence evidence distinct."
      evidence: "Logs meters BOM and rejected-lot records"
    - id: dq_stocks
      applies_to: "all processes"
      requirement: "All disjoint raw WIP FG water-loop and equipment-charge stocks carry their own state and every inherited exchange vector without overlap; old cohorts retain original denominators and returns history."
      evidence: "Opening closing reconciliations and cohort genealogy"
    - id: dq_speciation
      applies_to: "manufacture"
      requirement: "Use independent substance/destination evidence; mass/element residuals, COD or VOC are not a licence to infer individual chemicals or reaction water. No universal source emission factor or numerical screening threshold."
      evidence: "SDS sampling reports detection and thermal-state uncertainty"
    - id: dq_applicability
      applies_to: "reference product"
      requirement: "Product-level drawings and actual optical/mechanical/duty acceptance govern use; resin rating or manufacturer capability never proves final diffuser or luminaire certification, lifetime or luminous equivalence."
      evidence: "Actual qualified release evidence and restrictions"
    - id: dq_uncertainty
      applies_to: "all inventory rows"
      requirement: "Disclose time geography process gate allocation sensitivity missing UUID/provider and measured uncertainty separately; ordinary future site quantities do not become invented numbers."
      evidence: "Traceable data lineage and explicit completeness statement"
validation_rules:
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Verify explicit first_release Product output link and1kg declared net first-release basis in both languages. Check raw units then attribution then the only A_i/Q operation, Q=0 retention and historical denominator preservation."
    source_ids:
      - condale-pc
  - rule_id: validate_route
    applies_to: "reference product"
    rule: "Require actual complete PC pellet-to-lighting-diffuser route and product acceptance. Purchased finished part repacking, enclosure proxy, changed layer/material or unproven core terminal identity fails applicability; review actual changed operations completely."
    source_ids:
      - condale-pc
      - covestro-pc-2018
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Every adopted UUID requires compatible full flow and exact property/unit-chain evidence, including geography and media. Specific unresolved auxiliaries remain measured and tracked individually; no generic collection substitutes. Apply all native restrictions in each card."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "all processes"
    rule: "Close independent unallocated raw/WIP/FG and equipment/water/charge accounts, each package material and each real external destination; preserve inherited vectors. Never close with allocated quantities, duplicated FG or unexplained species/reaction-water residuals."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "all processes"
    rule: "Retain all failed idle cleanup rework zero-output and conditional presence/absence evidence. Unknown core identity/route/basis or missing real species/history holds the quantitative package; ordinary auxiliary UUID gaps do not authorise omission. Engineering checks do not approve science, translation, classification mapping or publication."
    source_ids:
      - ilcd-general-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset with separately reported actual supply-service accounts"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matched bare single-layer PC lighting-diffuser production with actual drawing and acceptance; link to complete-luminaire model without asserting equivalence"
  excluded_use: "Whole-lamp efficacy or certification comparison; generic building profile or electrical enclosure; unqualified other polymer/coextrusion route; default recipe or emissions"
  required_metadata: "All section3 qualifiers; actual site period gate native restrictions provider identity per-row units and stocks; separate service interval and original cohorts"
  required_quality_disclosure: "Source synthesis scope; independent identity and provider uncertainty; stock/vector continuity; conditional coverage speciation and allocation sensitivity; quantitative package holds"
  update_trigger: "Material grade formulation layers route host acceptance utility gate provider source edition or inventory/speciation changes require applicability review"
data_sources:
  - id: "condale-pc"
    type: "extension_guidance"
    reference: "Condale Plastics. Polycarbonate Extrusions. Publisher snapshot 2026-10-20. https://www.condaleplastics.com/materials/material-selection/polycarbonate-extrusions/"
    used_for: "Actual PC optical diffuser product and alternative non-lighting uses; qualitative endpoint evidence"
  - id: "condale-lighting"
    type: "extension_guidance"
    reference: "Condale Plastics. Plastic Extrusions for Lighting. Publisher snapshot 2026-10-20. https://www.condaleplastics.com/applications/lighting/"
    used_for: "Dedicated extruded lighting optics and bespoke host-specific requirements; no universal performance claim"
  - id: "condale-manufacture"
    type: "extension_guidance"
    reference: "Condale Plastics. Plastic Extrusion Manufacturing. Publisher snapshot 2026-10-20. https://www.condaleplastics.com/services/plastic-extrusion-manufacturing/"
    used_for: "Manufacturing capability and cut-to-length state; no factory quantity transfer"
  - id: "covestro-pc-2018"
    type: "handbook"
    reference: "Covestro. Makrolon Product range Typical values. Edition 2018-02; pp.6–7 and disclaimer p.32. https://www.covestro.com/-/media/covestro/solution-center/brands/downloads/imported/1556888808.pdf"
    used_for: "PC moisture conditioning and extrusion; degassing and special-grade exceptions; no recipe settings adopted"
  - id: "covestro-et-2016"
    type: "handbook"
    reference: "Covestro. Makrolon ET – Resins for Extrusion and Thermoforming. Edition 2016-04; pp.3–8 including spanning table pp.4–5. https://www.covestro.com/-/media/covestro/solution-center/brands/downloads/imported/1556890009.pdf"
    used_for: "Extrusion-grade formulations; adjacent UV coextrusion and component fire-test limitations"
  - id: "ifc-plastics-2007"
    type: "official_guidance"
    reference: "IFC/World Bank Group. EHS Guidelines for Metal Plastic and Rubber Products Manufacturing. 30 April 2007; pp.1,9–11,22–23. https://www.ifc.org/content/dam/ifc/doc/2000/2007-metal-plastic-rubber-products-ehs-guidelines-en.pdf"
    used_for: "Qualitative non-reactive extrusion and environmental completeness; Table4 has no PC entry and supplies no PC species or factors"
  - id: "ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook General guide for LCA Detailed guidance. First edition March2010; §§7.9.2–7.9.3 PDF275–288. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and exchange-specific causality before genuinely residual common-gate market values; not industrial process evidence"
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD. CPC Version3.0 Explanatory Notes. 30June2025; pp.177–179; repository original Structure CSV row36960. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification boundary only; 36960 has no additional substantive manufacturing note"
