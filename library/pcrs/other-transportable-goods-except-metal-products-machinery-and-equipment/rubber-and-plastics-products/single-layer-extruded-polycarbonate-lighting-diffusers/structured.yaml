allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all processes"
    rule: "Use this hierarchy only in a declared attributional inventory when allocation is required. First separate dedicated operations, then subdivide or virtually subdivide using actual process understanding and measurements. Dedicated resin, optical rejects and failed runs stay with their causative cohort."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_causality
    applies_to: "shared exchanges"
    rule: "For each remaining exchange identify the determining physical causal relationship and test why it controls quantity. Extruder load/duration, cooling heat removal and warehouse occupied volume/area with time can differ; a convenient proxy is not causality. No universal mass/time share, fixed allocation ratio or free physical/economic choice applies to all exchanges."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_residual
    applies_to: "genuinely residual multifunctional processes"
    rule: "Only after documenting why subdivision and exchange-specific determining causality cannot resolve a real residual, use contemporaneous quantities times market value at the same common-process gate and actual supplied condition. Derive gate values by removing downstream conditioning, packaging, transport and trading contributions. Unknown/non-positive prices, uncertain cofunction status or missing measurements require review, not automatic allocation. Retain sensitivity and uncertainty."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_recovery
    applies_to: "internal and exported recovery"
    rule: "Carry internal regrind and reuse burdens and cancel internal transfers. Independently establish waste, treatment-service or product status of each external stream; sale does not grant avoided-virgin credit. Physical balances use unallocated real quantities and never allocated burden shares. Exported recovered-product methodology needs separate review."
    source_ids:
      - ilcd-general-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
