  native_limitations: "Native identity: Product flow, “Finished product, manufactured”, “Production mix, at plant”; only Mass with reference coefficient 1. No CAS, grade, casing history, cold/hot route, specified geography/locationOfSupply, service life or density is declared. The comment says “362 Other rubber products”, inconsistent with the 36120 classification tree; retain this isolated metadata debt. This broad finished-retread identity is compatible only after actual casing, tyre specification, process and gate qualification. It is not a new tyre, prepared casing, tyre tread, provider inventory or proof of performance."
