  semantic_scope: "Existing unpublished retained 36120 scaffold promoted only for the cold pre-cure used commercial truck/bus casing to finished retread subset; distinct from all material records and36111/36112/36113 new tyres,36114 inner tubes,36115 tread supplies. Not whole leaf coverage."
