  provider_and_data_requirements: "All actual auxiliary identities/providers, quantities, casing legal/economic status and incoming burden method, stock/service carry and complete measured species remain concrete dataset requirements. No true final reference identity gap; no invented zero defaults."
  reference_gate: "The reference gate is FIRST positive quality release of newly retreaded complete tyres, not actual dispatch. Q is the measured net kg of unique newly accepted finished tyres in the matched product/route/state cohort, excluding rim, separate tube/flap, envelope and transport packaging. Reinspection of a return does not create new Q. Production outputs contain Q once: closing finished stock containing part of Q is not a second production output. Real post-release storage/packing/handling/dispatch remains in a separately traced service ledger. Allocate it to the actual serviced cohort, carry opening/closing finished-stock burdens, cancel internal handovers on combination, and disclose temporal cut-off/provisional carryover. A delivered-product study must build a separate actual-delivery balance including stock carry; never silently equate Q with deliveries."
  source_limitations: "Independent qualitative Bandag industrial/EPA historical synthesis, not one supplier recipe. EPA numerical and hot-route prescriptions excluded. ILCD2010 actual attributional process hierarchy only; no blanket waste cut-off, fixed reuse cycles, credit or full-method conformance. Current site specs/SDS required."
