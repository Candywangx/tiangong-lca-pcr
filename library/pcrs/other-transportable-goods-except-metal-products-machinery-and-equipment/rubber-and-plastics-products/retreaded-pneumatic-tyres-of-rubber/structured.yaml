    required_property_ref:
      name: "declared row property"
      uuid: ""
    required_unit: "declared row unit"
    rule: "Convert original measurements before one normalization: power × operating duration is energy; integrated liquid/gas volume gets no second time factor. Use measured density or documented enthalpy/state where required; a secondary flow-property coefficient is not density."
