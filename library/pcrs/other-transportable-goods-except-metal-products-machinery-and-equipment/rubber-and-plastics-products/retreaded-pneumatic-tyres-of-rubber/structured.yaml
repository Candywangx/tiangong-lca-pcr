    required_unit: "kg"
    rule: "Q > 0 is the unique newly quality-released tyre net mass measured by cp_output, on the declared first-release gate. Keep actual count and tare. Do not replace Q with shipments or tyre-count × an invented weight."
  - id: whole_formulation
    applies_to: "material inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Purchased tread, cushion/repair gum, patch and cement are whole commercial supplies. Assay solids, solvent and water belong to constituent subledgers, not duplicate external purchases. Onsite blending requires actual separately acquired ingredients and blending energy/losses."
