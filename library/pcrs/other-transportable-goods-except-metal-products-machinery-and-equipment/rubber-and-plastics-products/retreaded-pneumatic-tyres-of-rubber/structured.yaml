allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "p_retread"
    rule: "For an explicitly declared attributional case where allocation is justified, first subdivide actual operations and virtually assign exchange-specific burdens using demonstrated determining physical causal relationships. Apply different drivers to different exchanges when causally required; an arbitrary mass split is not physical causality. Only remaining indivisible burdens lacking such a relationship may use justified co-function market values at that same process exit state and gate, with quantities, price period, sensitivity and 100% burden conservation. Physical/economic allocation are not unrestricted alternatives."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_casing
    applies_to: "cp_casing"
    rule: "Do not use this process-allocation hierarchy as a universal recycled-content cut-off or allocation across imagined future tyre lives. For actual casing transfer, identify upstream systems, condition, legal/economic state and the study-specific applicable reuse/waste method with independent evidence; match its carried burdens. Preserve fee/negative-value treatment functions. No fixed number of retreads, equal per-life division or avoided-new-tyre production credit is authorized."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: allocation_rejects
    applies_to: "p_retread"
    rule: "Retain all failed/rejected/rework burdens in the matched raw cohort. Actual useful recovered materials must be classified and treated through the documented method; waste handling is not a negative input credit. A return or internal recovery cancels only its internal transfer, never its real processing energy/losses."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_casing
      process_id: "p_retread"
      flow_role: "Casing status and reception owner"
      record_type: "raw period record and linked physical/burden ledger"
      raw_fields: "serial identity; prior use/retread history if known; ownership; receipt/return/reject dates; acceptance; native type; jurisdiction/legal status; payment/gate fee; incoming and outgoing kg; opening/closing stock; carried burdens; selected transfer method"
      collection_method: "Retain complete undivided physical/financial/status originals and calibrate weighing. Inspect all actual receipts, including rejects and no-output screening. Select one Product or Waste input for each physical batch; record external returns separately. No normalization in collection."
      unit: "kg; count; currency and date"
      frequency: "Each receipt/lot/cycle/meter interval and period stock close"
      temporal_coverage: "Complete declared raw period and matched first-release cohort, with all carryover"
      site_scope: "Named actual site, supply boundary and traced services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "custody documents; status determination; weigh tickets; upstream burden provenance"
    - protocol_id: cp_materials
      process_id: "p_retread"
      flow_role: "Material issue and repair/build owner"
      record_type: "raw period record and linked physical/burden ledger"
      raw_fields: "supplier; product/SDS/COA; formulation and compatible repair type; whole supplied mass; solids/solvent/water; receipts/issues/returns; opening/closing material and WIP; lost material; lot/casing links; carried burden vectors"
      collection_method: "Reconcile whole commercial supplies to stock, issues, actual incorporation, external losses and internal returns. Preserve all failed builds/repairs and carried WIP burdens. Assays are subledgers, not additional procurement. Separate every actually separately supplied material. No numerator division."
      unit: "kg; stated assay units"
      frequency: "Each receipt/lot/cycle/meter interval and period stock close"
      temporal_coverage: "Complete declared raw period and matched first-release cohort, with all carryover"
      site_scope: "Named actual site, supply boundary and traced services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase/issue records; supplier compatibility; repair/build records; mass calibration"
    - protocol_id: cp_utilities
      process_id: "p_retread"
      flow_role: "Metering and curing owner"
      record_type: "raw period record and linked physical/burden ledger"
      raw_fields: "meter interval and state; inspection/buffing/building/cure/cooling operation; envelope/vacuum cycle; raw electricity; steam mass/enthalpy; water; condensate return; compression and treatment energy; idle/failure/rework; shared-meter causal drivers; stock carry"
      collection_method: "Preserve raw totals at actual supply points and each unit-operation record. Distinguish rate from integrated volume. Internal steam/air/water circuits are subledgers; document externally supplied compressed air/heat or onsite fuel as separate actual exchanges if present, without double charging electricity. Preserve no-output loads; no normalization."
      unit: "MJ; kg; m3 and actual conditions"
      frequency: "Each receipt/lot/cycle/meter interval and period stock close"
      temporal_coverage: "Complete declared raw period and matched first-release cohort, with all carryover"
      site_scope: "Named actual site, supply boundary and traced services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; utilities invoices; cure charts; shared-load drivers"
    - protocol_id: cp_output
      process_id: "p_retread"
      flow_role: "Quality and production release owner"
      record_type: "raw period record and linked physical/burden ledger"
      raw_fields: "unique casing/batch; configuration; inspection/rejection/repair/cure record; first release date; measured net kg Q; count; tare; failed tests; returns/reacceptance; opening/closing WIP; carried burdens; separate finished-stock and shipment ledger"
      collection_method: "Calibrated weighing and deduplicated first acceptance establish Q for one matched cohort. Record all raw period burdens and WIP without removing zero-output runs. Track post-release stock/services separately with burden carry and internal-transfer cancellation; no collection-side division and no extra output for closing finished inventory."
      unit: "kg excluding packaging; count"
      frequency: "Each receipt/lot/cycle/meter interval and period stock close"
      temporal_coverage: "Complete declared raw period and matched first-release cohort, with all carryover"
      site_scope: "Named actual site, supply boundary and traced services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "quality approvals; scales; serial trace; stock and burden reconciliations"
    - protocol_id: cp_packaging
      process_id: "p_retread"
      flow_role: "Warehouse, envelope and dispatch service owner"
      record_type: "raw period record and linked physical/burden ledger"
      raw_fields: "each packaging/envelope identity and kg; opening/closing stocks; new/replacement supply; reuse/return/repair; issue; discard; package mass accompanying tyres; storage occupancy/time; handling; shipment/return cohort; energy and carried burdens"
      collection_method: "Keep a complete independent physical ledger for each actual packaging material/envelope. Include material leaving with the tyre, waste, external return, reuse and retained stock. Match real service burdens to the release cohort using traceable direct/causal assignment; retain unmatched finished-stock carry until resolved. Do not count reuse as new purchase, packaging as net Q, or internal handover as a second product. No division here."
      unit: "kg; time; area/volume; raw service energy"
      frequency: "Each receipt/lot/cycle/meter interval and period stock close"
      temporal_coverage: "Complete declared raw period and matched first-release cohort, with all carryover"
      site_scope: "Named actual site, supply boundary and traced services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock/return manifests; service allocation records; actual dispatch evidence"
    - protocol_id: cp_waste
      process_id: "p_retread"
      flow_role: "Waste segregation and treatment owner"
      record_type: "raw period record and linked physical/burden ledger"
      raw_fields: "individual waste identity/type; point of generation; kg wet/dry; contamination; captured/external/recovered/internal fraction; rejected casing lineage; opening/closing stocks; treatment destination; carried burdens"
      collection_method: "Weigh and reconcile each actual external stream and treatment burden. Separate captured buffings from emitted particles and whole discarded tyres from cuttings. Add each distinct contaminated wipe, container or other real waste separately; retain zero-output burdens and internal-recovery provenance, without normalization."
      unit: "kg; composition and phase"
      frequency: "Each receipt/lot/cycle/meter interval and period stock close"
      temporal_coverage: "Complete declared raw period and matched first-release cohort, with all carryover"
      site_scope: "Named actual site, supply boundary and traced services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; waste transfer/treatment records; analyses"
    - protocol_id: cp_emissions
      process_id: "p_retread"
      flow_role: "Environmental measurement and balance owner"
      record_type: "raw period record and linked physical/burden ledger"
      raw_fields: "species and CAS where applicable; compartment/emission point; actual formulation composition; concentration; flow rate or integrated volume; duration; temperature/pressure; capture/removal; detection limits; independent solids/liquid/gas composition; free/carrier/phase water; material and element ledgers"
      collection_method: "Preserve undivided raw period analytical and activity records for every actual species and route operation. Identify each actual VOC/cure emission individually, including those not named in template cards; unknown speciation is a disclosed data gap, never total-VOC identity, zero or a fit to closure. Establish actual reaction-water chemistry independently if relevant. Do not multiply integrated volume by time or derive two unknown outlets from one residual."
      unit: "kg; concentration; m3 and conditions; time"
      frequency: "Each receipt/lot/cycle/meter interval and period stock close"
      temporal_coverage: "Complete declared raw period and matched first-release cohort, with all carryover"
      site_scope: "Named actual site, supply boundary and traced services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling/laboratory records; actual SDS/COA; measured mass/element balances"
  calculation_rules:
    - id: raw_cohort
      applies_to: "all nonreference inventory rows"
      rule: "For each exchange/burden i form unnormalized A_i = opening WIP carried i + actual full-period i - closing WIP carried i - amounts and burdens assigned to other cohorts. Reconcile raw-material stocks before issue consumption; retain unsuccessful/zero-output runs, test losses, internal returns and rework once. Post-release service A_i is separately assigned to the same newly released cohort with opening/closing finished-stock carry, rather than subtracting that cohort’s finished mass from production Q. Do not erase failed production as “other cohorts” or remove its burdens solely because Q=0 in that sub-run."
      inputs:
        - cp_casing
        - cp_materials
        - cp_utilities
        - cp_output
        - cp_packaging
        - cp_waste
        - cp_emissions
      output: "A_i in original converted row units, with burden lineage"
      source_ids: []
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For Q > 0 from cp_output, report a_i = A_i / Q once, in row units per 1 kg reference flow; terminal output is 1 kg. Card amount expressions and protocol aggregation labels describe this same single reporting operation, not successive divisions. A zero-output sub-run keeps its numerator in the matched cohort; if the complete cohort has Q=0, retain raw burdens and report no finite normalized product dataset."
      inputs:
        - A_i
        - Q
        - cp_output
      output: "a_i per 1 kg reference flow"
      source_ids: []
    - id: physical_closure
      applies_to: "p_retread"
      rule: "Keep independent UNNORMALIZED physical ledgers. The production ledger contains only its actual external material inputs and opening raw-material/WIP stocks on the left, and new quality release Q plus all production-stage external Product exits (including returned reusable casings, condensate and any actually qualified sold output), Waste exits, emitted species and closing raw-material/WIP stocks on the right. Closing finished stock is outside this production ledger and is never added again alongside Q. In the separate finished-store/service ledger, opening finished stock plus new release and actual external returns equal actual exits, service losses and closing finished stock, with carried burdens and return/rework lineage. On combination cancel the internal Q handover and all other internal transfers: retain actual external exits and opening/closing stock once, not both Q and the downstream stock/exits as extra final outputs. Each packaging material has its own complete physical ledger: opening stock plus new supply and actual external returns equal mass accompanying tyres, waste, external returns-out and closing stock; internal reuse cancels and is not new supply. Include every real external Product outlet/utility return and accompanying packaging mass in any consolidated physical/element closure, never in net tyre Q. Energy-only utility rows carry their corresponding physical masses in utility subledgers; services are not kg material inputs. Independently verify relevant C/S/Zn/metal and water fractions, actual species, crosslinking and free/phase/reaction water. No COD/residual fitting, fixed sulfur conversion, assumed combustion or generic reaction-water term."
      inputs:
        - cp_casing
        - cp_materials
        - cp_utilities
        - cp_output
        - cp_packaging
        - cp_waste
        - cp_emissions
      output: "independent physical balances and diagnosed discrepancies"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: quality_route
      applies_to: "reference product"
      requirement: "Require genuinely used suitable casings, specified cold pre-cure route and finished first-release evidence; reject new-tyre/tread-only substitutions. Actual tyre specification must qualify the broad native identity."
      evidence: "receipt, inspection, repair, cure and acceptance records"
    - id: quality_complete
      applies_to: "all inventory rows"
      requirement: "No omitted failed/zero-output runs, stock carry, real rework, utility returns or post-release service burdens. Unknown field/species/provider is disclosed with resolution need; no zero defaults or invented recipe."
      evidence: "raw period ledgers and traceable carry vectors"
    - id: quality_native
      applies_to: "all inventory rows"
      requirement: "Native identity: Product flow, “Finished product, manufactured”, “Production mix, at plant”; only Mass with reference coefficient 1. No CAS, grade, casing history, cold/hot route, specified geography/locationOfSupply, service life or density is declared. The comment says “362 Other rubber products”, inconsistent with the 36120 classification tree; retain this isolated metadata debt. This broad finished-retread identity is compatible only after actual casing, tyre specification, process and gate qualification. It is not a new tyre, prepared casing, tyre tread, provider inventory or proof of performance."
      evidence: "complete exact native fields and version-bound support chain; actual supplier/site compatibility"
    - id: quality_data
      applies_to: "data package"
      requirement: "Report sampling uncertainty, detection limits, temporal/geographic/technology coverage and omitted burden significance. Species, legal status, prior casing burdens and method applicability require actual evidence before concrete data use; ordinary auxiliary UUID/provider matching is not a reason to invent identities."
      evidence: "quality dossier and source applicability decisions"
validation_rules:
  - rule_id: validate_terminal
    applies_to: "retread_released"
    rule: "Require the linked unique Product output and the declared finished-retread UUID, exact Mass/kg relationship, actual cold-pre-cure scope, positive unique first-release Q, and matched cohort. Do not use prepared casing or pre-cured tread as terminal reference."
    source_ids:
      - bandag-process
  - rule_id: validate_status
    applies_to: "used_casing_product; used_casing_waste"
    rule: "Check exclusive incoming type from complete actual evidence, prior burden methodology and returned/rejected casing balance. A native Product output does not force incoming Waste into Product. Missing actual status/burden evidence blocks the concrete data package’s usability, not permission to infer zero."
    source_ids: []
  - rule_id: validate_accounting
    applies_to: "all inventory rows"
    rule: "Check raw_cohort and exactly one normalize_period, Q versus deliveries, all failed/rework/WIP/carried burdens, complete separate finished-stock/service ledger and packaging physical ledger. Internal transfers cancel only when combined; no duplicate new production for reacceptance or closing stock."
    source_ids: []
  - rule_id: validate_atomic_balance
    applies_to: "p_retread"
    rule: "Check every actual supplied formulation and individual output, utility return and packaging exit; no duplicate ingredient procurement. Check raw units/state, full physical/element closure and independent species/water evidence. Template n-heptane applies only when actually identified; add every other actual species as its own row rather than dropping it or using total VOC."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "p_retread"
    rule: "Check attributional case, subdivision/virtual subdivision and exchange-specific determining physical causality before any residual same-process-gate economic allocation. Check 100% conservation and sensitivity, no blanket physical/economic choice, fixed tyre life/count, automatic zero prior burden or avoided production credit."
    source_ids:
      - ilcd-attributional-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset when the stated foreground has complete verified records"
  downstream_use: "Mass-based supply modelling for this qualified cold-pre-cure retread at the first-release gate; actual-delivery and use phases require explicit additional ledgers/models"
  allowed_use: "Declared configuration/site/period attributional product inventories with documented casing transfer and actual service burdens"
  excluded_use: "No universal tyre/new-tyre substitution, passenger/aircraft/OTR/hot-cure coverage, fixed retread count, assumed equal rolling resistance/mileage, safety certification or automatic environmental superiority. A service comparison needs real bounded load/axle/route/pressure, observed performance/lifetime and replacements; never invent them."
  required_metadata: "All required qualifiers, reference gate, native limitations, supplier/provider mapping, status/burden-transfer method, raw period, stock and service ledgers, actual quantities and allocation evidence"
  required_quality_disclosure: "Authored candidate methodology, scientific review pending; technical sources give qualitative route support, not one plant recipe, factors, approvals or complete PEF/ILCD compliance. Disclose every measured-data/identity/method gap and sensitivity."
  update_trigger: "Casing status/transfer method, hot/cold route, construction/specification, supply recipe, energy system, emissions, gate/stock practice or source/native identity changes"
data_sources:
  - id: "bandag-process"
    type: "handbook"
    reference: "Bandag, The Bandag Retreading Process, Steps 1–7. https://www.bandag.eu/en/why-retread/the-bandag-retreading-process"
    used_for: "Primary industrial sequence: casing screening, buffing/skiving, pre-cured tread plus uncured bonding layer, enveloped cure and sale approval. Qualitative only; performance/marketing claims and future retread counts are not adopted."
  - id: "bandag-cold"
    type: "handbook"
    reference: "Bandag, Think Environment, Effective processing. https://www.bandag.eu/en/think-environment"
    used_for: "Confirms industrial pre-vulcanized tread and “cold” pre-cure distinction from hotcap. No temperature ratio, savings, rolling resistance or performance default is used. Same publisher as bandag-process, not independent corroboration."
  - id: "epa-retreading"
    type: "literature"
    reference: "Monsanto Research Corporation, Draft Report: Identification and Control of Hydrocarbon Emissions from Rubber Processing Operations, 23 November 1977, prepared for US EPA, Contract No. 68-02-1411, Task 17, §11.1–11.2, printed124–127 (PDF140–143), NSCEP9100KABM. https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=9100KABM.TXT"
    used_for: "Independent historical process evidence for receiving/rejection, buffing/cement, precure autoclave distinction, finishing/inspection/shipping and organic-release scope. Also describes hot routes, excluded here. No recipe masses, emission factors, operational instructions or contemporary legal-status rule adopted. Contractor technical draft: its opinions are not necessarily EPA views and do not establish EPA endorsement."
  - id: "ilcd-attributional-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment – Detailed guidance, First edition March2010, §7.9.2–7.9.3, printed255–272. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Primary LCA method for the stated attributional process subdivision/virtual subdivision, determining physical causality per exchange, residual same-gate/condition economic allocation and total conservation. No automatic waste cut-off, fixed reuse cycles, recipe, credit or full-method conformance; tyre transfer needs its own applicable method/evidence."
