      - Helmet suspension harness is a purchased CN at-plant component; composition attachment points supplier and approval are not established by the native record.
      - Alternating current is specifically CN below1kV grid-average user supply; locationOfSupply CN is a hard restriction. Mass and energy exact reference chains were independently read.
      - PE bag Product/Mass CAS9002-88-4; empty geography and no declared production/consumption mix, plant gate, grade thickness LDPE/HDPE branch or route; actual resin-sack and LDPE-bag roles and provider still require matching.
    not_adopted:
