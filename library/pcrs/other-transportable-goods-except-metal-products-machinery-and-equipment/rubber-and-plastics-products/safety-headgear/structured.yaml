      collection_method: "Read calibrated import and branch meters for all manufacturing operations and utility equipment; reconcile actual CN below1kV supply; identify real losses and shared attribution."
      unit: "kWh; MJ"
      frequency: "each interval and campaign"
      temporal_coverage: "complete campaign including cleanup and downtime"
      site_scope: "declared manufacturing import gate"
      aggregation_rule: "per 1 kg reference flow"
