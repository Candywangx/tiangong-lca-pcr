    - protocol_id: cp_packaging
      process_id: "supply_services"
      flow_role: "each resin sack; each carton; each helmet bag; each tape article"
      record_type: "one-article directional packaging ledger"
      raw_fields: "package article and composition; supplier inclusion; ownership; original cohort; opening empty; attached WIP; attached FG; reusable stock; external acquisition; external return received; closing equivalents; gross outward shipment; external return sent; waste; receiver"
      collection_method: "Weigh each single article and reconcile receipt/issue/stock/dispatch/return/waste records separately by direction and destination. Keep real physical mass regardless of burden allocation; no double-counting upstream included manufacture."
      unit: "kg"
      frequency: "each physical movement and stock end"
      temporal_coverage: "complete manufacturing plus actual matched-cohort service interval"
      site_scope: "each article at each declared external gate"
