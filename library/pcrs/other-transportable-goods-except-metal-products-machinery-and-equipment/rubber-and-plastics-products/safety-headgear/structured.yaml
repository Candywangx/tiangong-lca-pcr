      quality_evidence: "article weighing; supplier boundary; stock and movement records; receiving waste/return proof"
  calculation_rules:
    - id: calc_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw measurement to the row unit before allocation. Integrated volume is already a total; integrate only an actual rate. A kg conversion from volume uses independently measured substance-specific density and state. Electricity kWh to MJ uses3.6 exactly. Preserve raw values and conversions."
      inputs:
        - raw_measurements
        - unit_conversions
        - density_state
      output: "raw_row_totals"
      source_ids:
        - ifc-plastic-products-2007
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "Determine each unnormalised A_ih from raw_row_totals plus inherited exchange vectors at the declared cohort gate. Reconcile opening/closing materials and WIP; retain failed/idle/cleanup/rework loads; split dedicated then causal/residual shared exchanges under section7. Keep FG/service and equipment-water-charge ledgers non-overlapping. Inherited histories stay in original units and original Q_h; no second division or deletion with waste."
      inputs:
        - raw_row_totals
        - inherited_exchange_vectors
        - stock_ledgers
        - allocation_records
      output: "A_ih"
      source_ids:
        - ilcd-general-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_ih = A_ih / Q_h for Q_h >0; A_ih is the attributable raw exchange numerator for original cohort h; Q_h is its unique first-release net kg. Execute this sole reporting division once. All cards and protocol aggregations reference the same x_ih. Q_h=0 retains raw burdens without a unit result; reference first_release is1kg. Service results retain the original cohort Q_h and labelled actual interval separately."
      inputs:
        - A_ih
        - Q_h
        - cp_release
        - cp_fg
      output: "x_ih"
      source_ids:
        - ilcd-general-2010
    - id: calc_physical
      applies_to: "all processes"
      rule: "Before allocation, manufacturing physical gate: opening raw materials and bare WIP plus separate loop/oil/refrigerant stocks plus actual external material inputs = unique new first release Q_h plus closing raw materials and bare WIP plus corresponding closing loop/charge stocks plus each actual external product return, waste and species emission. Q_h already includes this cohort closing FG and that FG is not added again. Packaging balances separately by article and is excluded from bare product/WIP mass; energy is not a mass term. Use boundary_service for the FG gate and cancel internal transfers at the combined gate. Reconcile relevant elements independently using measured composition; preserve discrepancies and uncertainty. Service repair separately retains real additions, removed parts, species and moisture changes; service-rework WIP and repair-material/water stocks never overlap manufacturing WIP. Do not force unchanged repaired mass from the original helmet mass."
      inputs:
        - cp_material
        - cp_release
        - cp_water
        - cp_aux
        - cp_species
        - cp_waste
        - cp_fg
        - cp_feed_packaging
        - cp_packaging
      output: "unallocated_physical_balances"
      source_ids:
        - ifc-plastic-products-2007
        - ilcd-general-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Supply actual physical identity, native restrictions and provider-boundary match; distinguish ordinary auxiliary UUID gaps from missing endpoint/route/basis."
      evidence: "complete native records; supplier specifications; applicability decision"
    - id: dq_coverage
      applies_to: "all processes"
      requirement: "Cover full campaign including zero output and actual service interval; preserve old cohorts and every inherited exchange vector and denominator."
      evidence: "complete records; genealogy; stock and vector reconciliation"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Retain calibration, unit/state conversions, raw data, missingness, non-detects and uncertainty; never replace an unknown with a model-specific public default."
      evidence: "calibration; raw records; conversion and uncertainty files"
    - id: dq_no_approval
      applies_to: "first_release"
      requirement: "Declare actual configuration/drawing/quality criteria and available independent test evidence. Literature examples and engineering validation do not approve compliance or science."
      evidence: "drawing; acceptance basis; actual tests; explicit limitations"
validation_rules:
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Confirm each real article/preparation/species and boundary before binding a UUID. Retain every native name qualifier, supplied form, CAS, route, geography in the complete flowInformation, type, reference-property index and all secondary properties; a name/classification hit is insufficient. Product/Waste/Elementary and air/media distinctions remain separate. Unbound auxiliaries keep precise atomic identities and supplier evidence requirements."
    source_ids:
      - ifc-plastic-products-2007
  - rule_id: validate_reference
    applies_to: "first_release"
    rule: "Require the actual complete helmet configuration and first-release mass trace with independent count reconciliation; unassembled shell or suspension cannot be the terminal reference. Actual quality/certification evidence belongs to the data producer. No public example mass, joules, package count, supplier assertion or another model certificate establishes this article's compliance or lifetime."
    source_ids:
      - jsp-evo3-spec-2016
      - vitoppe-helmet-manufacturing
  - rule_id: validate_balance
    applies_to: "all processes"
    rule: "Reconcile total mass and relevant element inventories independently from measured chemical speciation. Keep non-overlapping material/WIP, FG, water-loop, equipment-charge and each packaging ledger. At manufacture Q already contains new closing FG; at the service gate retain gross shipments and returns; at the combined gate cancel internal transfers. Explain uncertainty rather than forcing closure with an invented species, reaction water or loss ratio."
    source_ids:
      - ifc-plastic-products-2007
      - ilcd-general-2010
  - rule_id: validate_raw_once
    applies_to: "all inventory rows"
    rule: "Retain raw meter/weighing records and original units, convert real rates/integrated volumes correctly, allocate the raw exchange vector, and apply calc_reference exactly once. Collection aggregation and card amounts only reference that same result. Preserve original Q_h for every old cohort and inherited vector; Q_h=0 retains real burdens but produces no unit result. Engineering checks do not establish science, translation or actual-factory approval."
    source_ids:
      - ilcd-general-2010
  - rule_id: validate_complete
    applies_to: "all processes"
    rule: "Before a quantitative dataset is complete resolve actual missing operations, supplied formulations, auxiliaries, output destinations, species/compartments, historical vectors and uncertainty. Do not mark a real unknown as zero or exclude it to satisfy a checker. Core endpoint/route/basis failure blocks applicability; an auxiliary UUID gap alone does not change the method into a different product."
    source_ids:
      - ifc-plastic-products-2007
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Production data for matched configuration and upstream boundary; manufacture and actual service interval separately labelled"
  allowed_use: "Attributional industrial helmet supply modelling after applicability review with inherited uncertainty"
  excluded_use: "Certification; protection equivalence; lifetime inference; other polymer/routes; consequential credits; old articles as new production"
  required_metadata: "actual model and complete configuration; complete supplied HDPE grade and colour stabiliser system; single-shot non-cellular unreinforced route; purchased suspension composition and attachment compatibility; actual separate sweatband and chinstrap inclusion; acceptance drawing tests and real compliance evidence; first-release net mass and independent count; original cohort and original Q_h; opening and closing material WIP and per-exchange inherited vectors; internal regrind thermal history and genealogy; FG stock returns original delivery and incremental rework linkage; manufacturing gate and actual service interval; CN below1kV import gate and provider loss boundary; water-loop and equipment-charge inventories and actual return-water state; complete directional physical ledger for each package article; species particle size phase receiving medium and uncertainty; site period and attributional allocation situation"
  required_quality_disclosure: "Raw coverage; species and provider gaps; historical vectors; every directional package ledger; allocation basis; uncertainty; independent approval state"
  update_trigger: "Configuration; supplied form; material; route; quality gate; geography/voltage; actual species; supply boundary or method situation change"
