      record_type: "independent water-loop and effluent ledger"
      raw_fields: "species and water quality; mass or integrated volume; real rate and elapsed interval; independent density and state; opening and closing loop hold-up; supply and return state; gross return; evaporation; drift; blowdown; treatment receiver; supplier water-energy convention"
      collection_method: "Use calibrated balances/meters with actual temperature pressure and independent density when conversion is needed; collect separate loop/cleaning/output records and genuine external returns; no assumed steam."
      unit: "kg; m3; temperature; pressure"
      frequency: "each interval and stock change"
      temporal_coverage: "full campaign including opening and closing equipment water"
      site_scope: "actual separate water loop and receiving treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; loop schematic; independent density/state; receiver and supplier records"
    - protocol_id: cp_aux
      process_id: "manufacture"
      flow_role: "hydraulic_oil; cleaning_wipe; r134a_charge; recovered_r134a"
      record_type: "equipment and consumable charge ledger"
      raw_fields: "single chemical or article; complete supplied formulation; equipment ID; opening and closing charge; purchases; recovered external return; loss; actual service assignment"
      collection_method: "Weigh actual charge/recovery/use and reconcile independent equipment inventories; distinguish storage transfers from consumption; record actual chemical and state."
      unit: "kg"
      frequency: "each charge service and recovery"
      temporal_coverage: "full campaign and inherited equipment history"
      site_scope: "actual equipment within declared site gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier SDS and specification; weighing; equipment log; recovery manifest"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "hdpe_scrap; spent_oil; used_wipe"
      record_type: "segregated waste physical transfer"
      raw_fields: "specific article; material composition; original cohort; mass; captured constituents; hazardousness; receiver; stock; actual treatment boundary"
      collection_method: "Weigh each separate outgoing waste and reconcile stock and captured composition without duplicate subcomponent disposal."
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "complete campaign plus retained waste stock"
      site_scope: "each real receiver and manufacturing gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale ticket; transfer manifest; composition assay; treatment match"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "water_vapour; pe_dust; n_butane; r134a_air"
      record_type: "species-specific release evidence"
      raw_fields: "single substance; CAS if applicable; size distribution; phase; outdoor compartment; concentration; integrated volume or real rate; state correction; opening and closing charge or loop stock; independent uncertainty"
      collection_method: "Use substance-specific sampling and calibrated integrated flow or integrate an actual rate over recorded time; distinguish captured and emitted streams; assess non-detects and unresolved species honestly; no generic factor from IFC."
      unit: "kg; measured concentration and volume units"
      frequency: "actual run idle cleanup and exceptional events"
      temporal_coverage: "complete observed campaign"
      site_scope: "specific equipment outlet and receiving medium"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "analytical method; detection limits; flow calibration; compartment and uncertainty records"
    - protocol_id: cp_fg
      process_id: "supply_services"
      flow_role: "released_transfer; returned_helmet; repair_suspension; removed_suspension; gross_helmet_dispatch; service_reject"
      record_type: "FG and return cohort ledger"
      raw_fields: "original h; original Q_h; original total per-exchange history and removed-part genealogy; disjoint opening/closing bare-helmet service-rework WIP repair-component and water stocks; new internal release; other internal transfers; gross dispatch and external returns; original delivery; each new part and its additional upstream supply; each removed-part destination; measured net mass moisture and state; actual effluent evaporation species; actual acceptance basis; interval"
      collection_method: "Reconcile counts, measured mass and state per original-cohort movement against the expanded boundary_service equation. Weigh new and removed components separately and instantiate their own atomic cards; unknown destinations or unsupported rework hold the quantitative package. Keep the original total history and component subgenealogy once, separately from actual incremental service and upstream burdens; reinspection, replacement, moisture change and reshipment create no new Q_h."
      unit: "kg; count"
      frequency: "each movement and interval end"
      temporal_coverage: "actual service interval and original release history"
      site_scope: "declared warehouse and dispatch boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "delivery and return records; stock count; original release and vector trace"
    - protocol_id: cp_service_energy
      process_id: "supply_services"
      flow_role: "service_electricity"
      record_type: "separate incremental service meter"
      raw_fields: "cohort h; original Q_h; observed interval; raw kWh; packing storage handling and permitted-rework loads; idle; shared causal driver; import gate losses"
      collection_method: "Meter actual incremental services separately from manufacture; assign each exchange causally to original cohorts including stock not shipped."
      unit: "kWh; MJ"
      frequency: "each service interval"
      temporal_coverage: "actual observed service duration"
      site_scope: "declared service account and actual CN below1kV gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter and scope records; shared attribution; no-overlap reconciliation"
    - protocol_id: cp_feed_packaging
