allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all processes"
    rule: "Use these rules only for declared attributional LCA in an allocation-required situation consistent with the study goal and ILCD scenario conditions. This is ILCD Situation C2, or a documented case in A/B/C1 where the required alternatives of subdivision, virtual subdivision and substitution/system expansion are impossible or infeasible under the respective scenario provisions; it is not a free choice to replace prescribed substitution. Product functional comparisons and consequential substitution are outside this manufacture dataset. A machine-supplier process case is not an allocation standard."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_dedicated
    applies_to: "all processes"
    rule: "First segregate dedicated moulding/assembly/test/service operations and virtually subdivide actual embodied materials and uniquely used resources to their own product/cohort. Direct meter records are preferred. Shell resin, bought suspension and failed shots belonging to one helmet campaign are not freely shared by total revenue."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_causal
    applies_to: "all processes"
    rule: "For remaining shared exchanges identify the determining physical causal relationship exchange by exchange, including actual energy demand, cooling duty, machine occupancy/intensity or occupied storage volume/area with duration as appropriate. Document why a proposed driver determines the exchange; throughput mass or runtime alone is not automatically valid for every exchange. Keep dedicated startup/idle/cleanup/failure loads and use real causal scope for shared downtime."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_residual
    applies_to: "all processes"
    rule: "Only a genuinely residual indivisible exchange without identifiable determining physical causality may use contemporaneous market values of real co-functions at the same common process gate in their actual quality, quantity, packaging and physical state. Remove product-specific later packing/transport/service value before comparing. Disclose prices, sensitivity and uncertainty; use no fixed ratio and never choose physical versus economic allocation arbitrarily. Allocated burdens across recipients sum to the original vector; physical exchanges retain full mass."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_rework
    applies_to: "all processes"
    rule: "Internal clean regrind retains identity, thermal history and inherited vector, and pays actual granulation/remelting losses and energy once. Rejected helmets, feed sacks, returned packaging, recovered refrigerant and saleable scrap are not automatically co-products or credits. A claimed recycling/recovery allocation needs its real joint-process, quality and next-system boundary under the declared method; otherwise preserve physical transfer and treatment obligation without an invented displacement credit."
    source_ids:
      - ilcd-general-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first_release; helmet_reject"
      record_type: "weighing and first-release trace"
      raw_fields: "configuration; batch h; individual or lot net mass; tare; count N_h; first-release event; destructive sample mass; Q_h; rejected mass"
      collection_method: "Calibrated weighing of cooled complete accepted helmets excluding detachable packaging; reconcile count and unique acceptance events; keep samples and failed lots separately."
      unit: "kg"
      frequency: "each lot and release event"
      temporal_coverage: "complete campaign including zero-output periods"
      site_scope: "one declared configuration at one site"
      aggregation_rule: "per 1 kg reference flow"
