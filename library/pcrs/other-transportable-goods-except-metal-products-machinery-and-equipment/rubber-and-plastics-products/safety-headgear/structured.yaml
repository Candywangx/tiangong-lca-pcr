system_boundary:
  rules:
    - rule_id: boundary_applicability
      applies_to: "all processes"
      rule: "This narrow method is only CN-site single-shot non-cellular unreinforced HDPE industrial helmet manufacture with real shell conversion then complete purchased-suspension assembly and new first-release net-mass reference. Exclude motorcycle/bicycle/sport/firefighting/military/ballistic helmets, bump caps, non-protective/textile headgear, ABS/PC/thermoset shells, foam liners, two-shot rims, reinforcement/multilayers, thermoforming, external recyclate, onsite colour compounding or component manufacture, printing/coating/decoration and added lamps/eyewear/earmuffs. Real departures require applicability review and complete recording rather than omission. Sources form an independent technical synthesis rather than one SKU/factory; JSP model weights performance certificates and life are not transferred and protection equivalence is not established."
      source_ids:
        - vitoppe-helmet-manufacturing
        - jsp-evo3-spec-2016
        - huarong-helmet-case-2025
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Collect complete pellet receipt/storage/actual conditioning, screw plastication, fill/pack/cooling/ejection, gate trimming, controlled clean regrind, shell inspection, assembly with the complete purchased suspension, actual sweatband/chinstrap fitting, destructive-test samples, final acceptance and unique new first release. Retain actual machines and all failed/idle/cleanup loads. Internal intermediates cancel in the combined foreground; purchased finished helmets are not this route."
      source_ids:
        - vitoppe-helmet-manufacturing
        - ifc-plastic-products-2007
    - rule_id: boundary_formulation
      applies_to: "hdpe_pellets; suspension; sweatband; chinstrap"
      rule: "A whole purchased pellet preparation or component assembly enters once with its actual upstream production. Contained pigment/stabiliser/carrier water, ratchet, straps and clips are nested composition accounts, not extra purchases. Onsite colour/chemical compounding or component manufacture is outside this defined supply route and requires explicit revised applicability and complete individual acquisitions, energy, losses and emissions. A purchase boundary must never erase real upstream production."
      source_ids:
        - vitoppe-helmet-manufacturing
        - jsp-evo3-spec-2016
        - ifc-plastic-products-2007
    - rule_id: boundary_release
      applies_to: "all processes"
      rule: "Q_h is the positive net mass of uniquely newly first-quality-released complete helmets of one configuration and original cohort h. Include same-cohort closing FG within Q_h, never add it again as production. Count N_h is an independent reconciliation record, not a weight conversion. No new Q follows shipment, return, reinspection or repeated release of an already released article. Discarded destructive samples are losses, not released product."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_carry
      applies_to: "all processes"
      rule: "Keep opening/closing raw materials, every WIP/intermediate/regrind cohort, finished goods, water-loop hold-up, equipment-oil inventory and refrigerant charge as separate non-overlapping physical ledgers. Preserve quantity, composition/state and inherited upstream plus foreground vector for EACH exchange. For each cohort assign current actual resource burdens and opening-WIP history to newly completed products or genuinely unfinished closing WIP according to real work; keep failed/idle/rework burdens, never delete them as unburdened scrap. Carried burdens retain the original denominator and are not normalised again."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_service
      applies_to: "supply_services"
      rule: "Keep actual post-release packing, storage, handling and dispatch even for unshipped stock, separately labelled by original cohort h and observed interval. Service-gate unallocated physical mass: opening bare helmets, service-rework WIP, repair-material and water stocks + new internal release transfer + other real inward material transfers across the declared gate + gross external returns received + actual external material and water inputs = corresponding disjoint closing stocks + gross outward bare helmets + separately removed parts and other real outward material returns + wastes, effluents and measured species losses. All outlet terms are disjoint: count each parcel once whether a removed part is a Product return or Waste. Record net mass and measured moisture state at each movement; packaging has its own ledger and components already inside a returned helmet are not additional inputs. Do not output a removed part again when it is already inside whole-helmet waste. Cancel all internal transfers at the combined gate. Old cohorts retain original Q_h and complete histories; reverse corresponding original delivery attribution for real returns and attach actual incremental rework once to that original cohort. Changed physical mass after rework never resets original Q_h or creates another manufacture or allocation of inherited product."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_rework
      applies_to: "supply_services"
      rule: "Record a specific rework only when actual manufacturer instructions, compatible configuration and traceable acceptance evidence permit it; never presume an impacted or damaged helmet is repairable or fit for resupply. Weigh each new suspension, sweatband, chinstrap and every other actual replacement or water input as a separate atomic exchange; separately identify each removed component, liquid effluent, evaporation and other actual outlet with composition and state. Contained constituents remain subledgers. Charge actual additional upstream supply once per new purchased component and distinguish stock issues/returns from purchases. Retain the original cohort total historical vector exchange by exchange and removed-part genealogy; neither rescale/delete old burdens with changed mass nor add their contained vectors again. New material, energy, loss and treatment burdens are service increments for that same original cohort, divided only once by original Q_h through calc_reference. Missing real safety/acceptance evidence remains unresolved or leads to the appropriate treatment; it is no declaration of restored conformity."
      source_ids:
        - jsp-evo3-spec-2016
        - ilcd-general-2010
    - rule_id: boundary_utilities
      applies_to: "all processes"
      rule: "The adopted electricity identity is specifically CN grid-average below1kV consumer supply. Match the actual import gate, voltage, geography and provider boundary; count upstream electricity production and distribution losses once and meter actual onsite cooling/compressed-air equipment through its electricity/water. No purchased compressed air, steam, boiler, heat source, fuel, abatement or refrigerant is presumed. Any real additional external utility or fuel requires an individual exchange and applicable production/treatment boundary."
      source_ids:
        - ifc-plastic-products-2007
    - rule_id: boundary_water
      applies_to: "manufacture"
      rule: "Reconcile physical water-loop/equipment charge inventories independently from product/WIP and packaging. Only actual free water evaporates; non-reactive HDPE moulding creates no assumed reaction or structural water. Actual external heat-exchange water receives a separate gross received/returned parcel balance with temperatures, pressures, enthalpy and supplier water-energy ownership convention. Do not duplicate that parcel as makeup or wastewater; identify real drift, evaporation and blowdown separately. Closed-loop circulation cancels."
      source_ids:
        - ifc-plastic-products-2007
    - rule_id: boundary_species
      applies_to: "manufacture"
      rule: "Potential n-butane, polymer dust or water vapour cards require real presence, species/form, compartment and measurement evidence. IFC Table4 describes potential releases above recommended upper processing temperature, not normal-operation rates or proof of n-butane isomer. Do not infer species mass from VOC/COD/TOC, convert an unmeasured particle-size fraction to PM2.5, or fit both unknown emissions and water from one mass residual. Add every actual missing material, preparation, species and destination as its own card before a quantitative package is complete; absence evidence differs from unknown."
      source_ids:
        - ifc-plastic-products-2007
    - rule_id: boundary_packaging
      applies_to: "all processes"
      rule: "For EACH individual package article keep opening empty stock + package attached to WIP/FG + reusable stock + external acquisitions + external returns received = closing equivalents + package accompanying GROSS outward physical shipments + external returns sent + waste. Resin sacks and product cartons/bags/tape have separate ledgers; split stock transitions so attached and empty counts never overlap. Internal reuse cancels; it does not create another purchase, reference-helmet mass, avoided burden or automatic co-product. Physical outgoing mass is never reduced by attribution or net helmet returns. Check upstream included packaging so its manufacture is charged once while retaining physical transfers."
      source_ids:
        - ilcd-general-2010
