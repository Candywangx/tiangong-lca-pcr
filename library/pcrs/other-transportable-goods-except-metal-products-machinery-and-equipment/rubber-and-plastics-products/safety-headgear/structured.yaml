      collection_method: "Calibrated net weighing and reconciled BOM/receipts/stock issues with actual supplied-form records; preserve component subaccounts without duplicate acquisitions."
      unit: "kg"
      frequency: "each receipt use and stock movement"
      temporal_coverage: "full campaign plus inherited stock history"
      site_scope: "matching manufacturing gate and supplier links"
      aggregation_rule: "per 1 kg reference flow"
