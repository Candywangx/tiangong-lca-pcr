  identity_review:
    native_classification_defects:
    - Packing tape physical name/BOPP route/Mass coherent but CPC17100 electricity classification wrong
    native_classification_context: "Generic Plastic Film carries broad36390 context; construction-specific classification requires actual treated/coextruded web evidence. A broad title alone neither proves a taxonomy error nor establishes BOPP/foam/adhesive grade."
    additional_verified_native_limits:
      water_vapour: "Native CAS 7732-18-5; Elementary flow, emissions to air unspecified, Mass/kg. Bind only independently measured actual species or the stated particle fraction at that compartment. Do not infer an emission from the UUID, ammonia from pH/latex, or a chemical mass from TVOC/COD. Particle cutpoint conventions must match the actual measurement with disjoint bins; cumulative PM10 is not the >10 fraction and total PM is not an extra emission. Actual indoor, water, soil, long-term or more specific air compartments require a separately verified identity. Exact official Chinese baseName is retained; no amount or presence inferred."
      ammonia_air: "Native CAS 7664-41-7; Elementary flow, emissions to air unspecified, Mass/kg. Bind only independently measured actual species or the stated particle fraction at that compartment. Do not infer an emission from the UUID, ammonia from pH/latex, or a chemical mass from TVOC/COD. Particle cutpoint conventions must match the actual measurement with disjoint bins; cumulative PM10 is not the >10 fraction and total PM is not an extra emission. Actual indoor, water, soil, long-term or more specific air compartments require a separately verified identity. Exact official Chinese baseName is retained; no amount or presence inferred."
      pm25: "Native particle interval particles (PM2.5); Elementary flow, emissions to air unspecified, Mass/kg. Bind only independently measured actual species or the stated particle fraction at that compartment. Do not infer an emission from the UUID, ammonia from pH/latex, or a chemical mass from TVOC/COD. Particle cutpoint conventions must match the actual measurement with disjoint bins; cumulative PM10 is not the >10 fraction and total PM is not an extra emission. Actual indoor, water, soil, long-term or more specific air compartments require a separately verified identity. Exact official Chinese baseName is retained; no amount or presence inferred."
      pmcoarse: "Native particle interval particles (PM2.5 - PM10); Elementary flow, emissions to air unspecified, Mass/kg. Bind only independently measured actual species or the stated particle fraction at that compartment. Do not infer an emission from the UUID, ammonia from pH/latex, or a chemical mass from TVOC/COD. Particle cutpoint conventions must match the actual measurement with disjoint bins; cumulative PM10 is not the >10 fraction and total PM is not an extra emission. Actual indoor, water, soil, long-term or more specific air compartments require a separately verified identity. Exact official Chinese baseName is retained; no amount or presence inferred."
      pmover10: "Native particle interval particles (> PM10); Elementary flow, emissions to air unspecified, Mass/kg. Bind only independently measured actual species or the stated particle fraction at that compartment. Do not infer an emission from the UUID, ammonia from pH/latex, or a chemical mass from TVOC/COD. Particle cutpoint conventions must match the actual measurement with disjoint bins; cumulative PM10 is not the >10 fraction and total PM is not an extra emission. Actual indoor, water, soil, long-term or more specific air compartments require a separately verified identity. Exact official Chinese baseName is retained; no amount or presence inferred."
      core: "Native Product is one paperboard cylinder/paper core at plant, Mass/kg, with no CAS, fixed dimensions, fibre ratio, adhesive grade, treatment route, provider or supply geography. Use only the actual complete winding core including its own adhesive construction; verify grade, net tare, moisture and supplier independently. It is not raw paperboard, a metal/wood core, tape net mass or evidence of a fixed kg/item. Exact official Chinese baseName is retained; no amount or presence inferred."
      wrap: "Native Product is polyethylene film CAS9002-88-4, production mix at plant, Mass/kg. No branch-density class, fixed grade, thickness, additive recipe, forming route, provider or geography is specified. The luggage CPC29220 classification conflicts with the coherent PE-film identity and remains a disclosed taxonomy defect; it is not evidence for a luggage product or another polymer. Bind only actual complete PE wrapping film, with grade/additives and provider boundary verified. Do not substitute PET, PVC, resin granulate or an unverified multilayer/adhesive film. Exact official Chinese baseName is retained; no amount or presence inferred."
    adopted_identity_limits: Only physical tape/web and provider-free foreground AC identities adopted; all native restrictions
      reproduced in every consuming card and full normative context. No recipe, dimensions, supplier or methodology inferred
      from UUID.
