allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory rows"
    rule: "This is attributional process modelling only where allocation is justified rather than substitution. Establish the actual co-functions and decision context; industrial equipment/product evidence alone does not authorize LCA allocation or credits."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_dedicated
    applies_to: "all inventory rows"
    rule: "First use dedicated measurement and real or virtual subdivision: assign specific backing, PSA, failed-roll burden, slit waste, extra rework and downstream packaging/services to their actual product/lot before sharing any residual. Keep full inherited vectors and complete-period reconciliation."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_causal
    applies_to: "all inventory rows"
    rule: "For each remaining exchange independently identify and substantiate the determining physical causal relationship. Actual coating area times measured coat load, evaporation duty, metered run duration at comparable intensity or occupied space-time may support particular flows only when their causal condition is demonstrated. Material embodiment alone does not allocate process losses. No universal mass/area/time key across all exchanges and no arbitrary physical/economic choice."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only for a genuinely inseparable residual after the preceding steps, explain why no determining physical causality can be established and use contemporaneous representative market values of actual co-products in their actual amounts/quality/state at the SAME common-process gate. Remove later packaging/transport/conditioning value or derive the gate value transparently; do not use retail tape prices against untreated scrap value. State zero/negative values and uncertainties rather than silently clipping them. Allocated exchange vectors must sum to the unallocated vector; no fixed percentages."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: allocation_recovery
    applies_to: "all waste and packaging rows"
    rule: "Internal clean recovery and returnables are physical recirculation with inherited burdens, not co-product credits. Actual external scrap classification/treatment and zero/negative-value gates require explicit evidence and a separate documented waste/recycling method consistent with scope; the selected ILCD sections do not supply a tape-specific recycling formula or avoided-virgin-production credit. Do not apply an automatic burden-free scrap rule or recovery fraction."
    source_ids:
      - ilcd-detailed-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "tape_production"
      flow_role: "released_tape; returned_tape"
      record_type: "release and return ledger"
      raw_fields: "lot; construction; roll ID; gross mass; actual core/pack tare; net kg; first-release time; test records; prior-release/delivery ID; genuine reversal"
      collection_method: "Calibrated weighing of accepted tape and real tare; deduplicate first releases; trace original return/retest/rework and linked genuine release reversals, not a second release. Store raw Q evidence undivided; pass to release_q; never divide inventory in collection."
      unit: "kg"
      frequency: "each roll or verified same-configuration lot"
      temporal_coverage: "complete study period including zero-output batches"
      site_scope: "same declared plant and construction"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/tare calibration; actual test acceptance; immutable release/return IDs"
    - protocol_id: cp_material
      process_id: "tape_production"
      flow_role: "backing; psa_preparation; knife; wipe; lubricant"
      record_type: "material and WIP raw records"
      raw_fields: "supplier; batch; supply form; actual received/issued/returned weights; raw/WIP opening/closing; wet/dry state; assays; grade/SDS; original per-flow vectors; measured loss; route"
      collection_method: "Weigh/stock-reconcile every whole supplied article/preparation; assay solids/water/residuals as child accounts; trace WIP stages and each exchange vector; include failed, cleanup and real incremental rework records. Store undivided stock-corrected raw quantities; no Q division; construct attributed A_i under cohort_vectors and section7 before report_once."
      unit: "kg"
      frequency: "each lot and inventory cutoff"
      temporal_coverage: "complete production and stock interval"
      site_scope: "supplier lots and actual line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; stocktakes; supplier composition; assay methods; vector transfer ledger"
    - protocol_id: cp_energy
      process_id: "tape_production"
      flow_role: "electricity"
      record_type: "meter records"
      raw_fields: "meter ID; start/end integrated readings; original unit; actual power/time intervals when rate-based; electric oven/fans; compressor; heating configuration; operating mode; affected lots; provider attribution"
      collection_method: "Meter actual manufacture and shared circuits; do not substitute rated machine power times assumed utilization; include warm-up, failed starts, idle, cleanup and all actual dryer tank heating. Subdivide overlaps; retain original energy unit. Retain raw energy undivided; convert using raw_conversion and attribute once under section7; report_once is the only Q normalization."
      unit: "kWh or MJ"
      frequency: "continuous meter plus each operating-mode event"
      temporal_coverage: "whole period not selected successful hours"
      site_scope: "actual line/shared utilities with meters scoped"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; clock alignment; full mode logs; circuit reconciliation"
    - protocol_id: cp_water
      process_id: "tape_production"
      flow_role: "water; condensate; wastewater"
      record_type: "water and effluent ledger"
      raw_fields: "supply ID; function; integrated volume or actual rate/time; independent density; temperature; pressure; composition; tank/cooling opening/closing; retained water; condensate receiver; effluent analyses; enthalpy boundary; opening tank/cooling inherited exchange vectors; closing tank/cooling inherited exchange vectors"
      collection_method: "Measure actual supplied liquid/tank makeup and outlets; independently assay wet PSA water and wastewater; record internal recirculation separately. Distinguish real external Product return from waste. Retain actual thermal state and any supplier water/energy convention; no assumed steam. Store raw numerator only; compatible volume/density/rate conversion under raw_conversion before attribution and report_once; no collection division. Reconcile separately accounted tank/cooling stocks and their inherited vectors without duplicating raw/WIP or PSA carrier-water subaccounts."
      unit: "kg or measured m3"
      frequency: "meter intervals and each drain/return"
      temporal_coverage: "full operating and cleanup period"
      site_scope: "each actual supply and outlet"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "flowmeter/scale calibration; substance-state density; laboratory results; return agreement"
    - protocol_id: cp_pack
      process_id: "tape_production"
      flow_role: "all packaging rows"
      record_type: "separate article custody ledger"
      raw_fields: "article ID; actual composition; tare; owner; empty stock; attachedWIP; attachedFG; reusable stock; opening/closing; purchases; externalReturnReceived; withGrossDispatch; externalReturnSent; waste; internal reuse count"
      collection_method: "Independently weigh and reconcile EACH whole core/carton/film/pallet plus any actually used additional packaging article. Record incoming supplier-attached/returnable packaging as true receipts; trace all destinations and retained stocks; separate new purchases from repeated reuse. Raw per-article balance under boundary_pack; no division here; attributable actual cohort packaging numerator uses report_once only once."
      unit: "kg"
      frequency: "each custody movement plus inventory cutoffs"
      temporal_coverage: "same complete physical period"
      site_scope: "all inbound and outbound packaging custody"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "article tare weighing; owner/custody documents; stocktakes; dispatch and waste receipts"
    - protocol_id: cp_waste
      process_id: "tape_production"
      flow_role: "all waste rows"
      record_type: "waste weighing and composition"
      raw_fields: "atomic stream; stage; lot; wet mass; dry solids; water; actual species; contamination; collected dust if actual; destination; legal/economic condition; internal transfer IDs"
      collection_method: "Weigh each real bare/coated/sludge/oil/blade/wipe stream separately; distinguish offsite waste from internally recovered WIP and FG waste; prevent duplicate adhered masses. Add one card for each actual captured dust/filter or other distinct waste. Raw waste quantities and child composition retained undivided; physical reconciliation and allocation precede the same report_once operation."
      unit: "kg"
      frequency: "each removal and waste-stock cutoff"
      temporal_coverage: "full period including failed/cleanup batches"
      site_scope: "actual boundary exit or waste holding stock"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; moisture/composition analysis; treatment/custody records; stock balance"
    - protocol_id: cp_species
      process_id: "tape_production"
      flow_role: "all elementary outputs"
      record_type: "species and phase-specific measurements"
      raw_fields: "species; CAS when applicable; actual compartment; source; concentration; integrated exhaust volume or true flow rate/time; wet/dry T/P basis; retained/captured mass; actual controls; phase; detection limit; uncertainty; relevant elements"
      collection_method: "Speciate actual oven/coating/cleanup emissions and nonoverlapping PM fractions. Match concentration and gas-volume reference state; subtract inlet background consistently. Full carrier-air intake/exhaust balances include air mass where needed; net emitted pollutant is not whole exhaust. Independently quantify water phase change and organic residuals. Store raw concentration/volume/rate evidence only; raw_conversion creates actual species numerators before attribution and report_once; integrated volume is not multiplied by time again."
      unit: "kg with original measured units retained"
      frequency: "representative campaigns plus full operation/mode reconciliation"
      temporal_coverage: "same whole-period emissions scope"
      site_scope: "actual outdoor air outlet and fugitive sources"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling method; laboratory species identification; detection limits; compatible T/P/wet-dry evidence; independent material/element checks"
    - protocol_id: cp_fg
      process_id: "tape_production"
      flow_role: "dispatched_tape; fg_electricity; returned_tape"
      record_type: "FG custody and incremental service ledger"
      raw_fields: "lot; original Q; original manufacture vector; openingFG; closingFG; gross dispatch; returns; prior delivery reversal; incremental rework; storage duration/space; actual electricity/handling/packing; raw unit"
      collection_method: "Keep historical FG and current-release cohorts separately; full physical G/returns include all cohorts but reference results use only the matching cohort with its own original Q, never plantwide G divided by new Q. Reconcile actual external custody and real return-linked reversals. Meter actual FG services including electric handling and dispatch. Preserve their true period and causal drivers without assuming future services or reallocating old production to new Q. Raw cohort services remain undivided; allocation precedes report_once with that cohort original Q only; opening/returned-lot services never divide by unrelated new Q."
      unit: "kg and each service original unit"
      frequency: "each lot movement and service event"
      temporal_coverage: "full declared FG service observation period"
      site_scope: "actual factory FG gate and dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "lot/custody chain; original delivery IDs; meter records; physical stocktakes; service completeness disclosure"
    - protocol_id: cp_allocation
      process_id: "tape_production"
      flow_role: "all inventory rows"
      record_type: "allocation justification and raw vector ledger"
      raw_fields: "exchange; cofunction; dedicated meters; virtual subdivisions; causal hypothesis; physical driver; residual; contemporaneous prices; gate quality/state; downstream value exclusions; signed/zero values; uncertainty"
      collection_method: "Evidence each step of section7 independently for each exchange; distinguish physical stocks and burdens. Conserve the full raw vector across all allocations. Actual missing causality/price data remains unresolved, never an invented split. Store raw allocation inputs/undivided attributed A_i only; only report_once normalizes with Q."
      unit: "each exchange original unit"
      frequency: "each allocation period/configuration change"
      temporal_coverage: "same complete exchange and market-value period"
      site_scope: "same common-process gate and actual cofunctions"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "dedicated/subdivision proof; causal study; source prices and state; full sum-conservation audit"
  calculation_rules:
    - id: release_q
      applies_to: "released_tape"
      rule: "Q = sum of uniquely identified NEW first-quality-released net tape masses after genuine linked release reversal correction. Count/area records require independently measured same-construction mass conversion; no invented kg/roll or density. Closing FG, gross dispatch, reinspection and prior-released return/rework never add production."
      inputs:
        - cp_release
      output: "Q"
      source_ids:
        - louis-bopp-water-tape
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert original readings to each flow unit BEFORE attribution: kWh toMJ by3.6; stock-adjust whole preparation mass; actual liquid volume times independently measured compatible density; species concentration times compatible integrated gas volume; only true rates are integrated over time. No Q division here and no second time multiplier on integrated volume."
      inputs:
        - cp_material
        - cp_energy
        - cp_water
        - cp_species
        - cp_fg
      output: "converted raw exchange quantities"
      source_ids: []
    - id: cohort_vectors
      applies_to: "all inventory rows"
      rule: "Construct undivided cohort numerator A_i from attributable real period exchanges plus the complete per-exchange inherited vectors of ALL opening WIP minus the complete vectors carried by closing WIP; correct raw stocks and cancel internal transfers/reuse. Retain every failed/start-stop/idle/cleanup and actual incremental rework load. Newly released closing FG already owns its manufacturing vector and is not subtracted as closing WIP. Apply section7 before reporting; historical FG manufacture is preserved separately. Include the opening and closing inherited vectors of separately accounted actual dryer-water/cooling/equipment stocks under boundary_stock, with no overlap with raw/WIP inventories."
      inputs:
        - cp_release
        - cp_material
        - cp_energy
        - cp_water
        - cp_waste
        - cp_species
        - cp_allocation
      output: "A_i"
      source_ids:
        - ilcd-detailed-2010
    - id: physical_gates
      applies_to: "raw physical ledgers"
      rule: "Manufacturing: opening raw/WIP + opening separately accounted in-process tank/cooling/equipment stocks + actual external material inputs + true prior-release rework transfers in = closing raw/WIP + closing separately accounted in-process stocks + new Q + all real other products/waste/species outputs + segregated prior-release rework returned to FG. Avoid overlap among raw, WIP and in-process stocks and count every input once. FG: openingFG + internal newQ + actual external returns + segregated rework receipts = closingFG + grossOutwardG + actualFGWaste + rework transfers out. Consolidation cancels matched internal Q/rework/packaging transfers, while retaining both cutoffs of separately accounted in-process stocks, external inputs/returns, gross dispatch, water Product returns and waste/emissions. Attached packages remain in their separate physical article ledgers and never in tape net mass. Close total wet/dry mass and relevant elements independently from actual species/phase evidence; keep full carrier-air intake/outlet when relevant."
      inputs:
        - cp_material
        - cp_release
        - cp_water
        - cp_pack
        - cp_waste
        - cp_species
        - cp_fg
      output: "separate manufacturing FG and combined physical ledgers"
      source_ids: []
    - id: packaging_custody
      applies_to: "all packaging rows"
      rule: "Apply the complete per-article opening/closing empty/attachedWIP/attachedFG/reusable balance in boundary_pack using real external purchase/received return/outward shipment/sent return/waste. Cancel internal reuse and attachment; exclude all packaging from net Q and prohibit double purchase or automatic co-product. This is physical reconciliation without Q division."
      inputs:
        - cp_pack
        - cp_fg
      output: "balanced packaging custody subledgers"
      source_ids: []
    - id: service_vectors
      applies_to: "fg_electricity; dispatched_tape; returned_tape"
      rule: "Maintain each original cohort manufacturing vector and separately add actual matched FG-service and incremental return/rework vectors. Reverse a prior service/delivery entry only for a genuine linked reversal; reinspection/reshipment is not new production. Pass only current-cohort matched service A_i with its ORIGINAL Q to the same sole report_once operation as a separate supplement; old-cohort service never divides by new Q. Future unobserved services remain incomplete scope, not zero."
      inputs:
        - cp_fg
        - cp_pack
        - cp_allocation
      output: "matched raw service A_i and cohort original Q"
      source_ids:
        - ilcd-detailed-2010
    - id: report_once
      applies_to: "all inventory rows"
      rule: "For Q>0 report A_i / Q ONCE in the exchange numerator unit per1kg reference flow; A_i is the converted and attributed undivided cohort numerator, not a previously normalized intensity. Keep manufacturing and matched FG service results as distinct ledgers; internal first-release transfers cancel in consolidation. For Q=0 retain actual loads with no unit result. Cards and collection aggregation refer to this SAME reporting operation and never divide again. Reference output is1kg at released_tape."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "single-normalized exchange result"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify whole supplied identity, polymer/skin/PSA chemistry, surface/grade/state and native restrictions before dataset linking; UUID names alone and schema-valid shapes do not prove applicability."
      evidence: "Direct native records; supplier/SDS/composition and compatibility tests"
    - id: dq_quality
      applies_to: "released_tape"
      requirement: "Retain actual dimensional, peel, tack, shear, anchorage/unwind, conditioning and first-release criteria; do not transfer source nominal properties, regulatory claims or service life."
      evidence: "Lot test reports and acceptance records"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Cover all operating modes, failed/zero-output lots, opening/closing raw/WIP/FG, internal recovery and inherited vectors; missing data is unknown, never an unsupported zero or pass."
      evidence: "Full period logs and per-flow mass/vector reconciliation"
    - id: dq_units
      applies_to: "all inventory rows"
      requirement: "Preserve original units and only supported explicit conversions; each real liquid/species density, phase and gas state is independently established; no fabricated roll mass."
      evidence: "Calibration and substance-state methods"
    - id: dq_emission
      applies_to: "all elementary outputs"
      requirement: "Identify each actual chemical species/outlet and nonoverlapping PM size fraction; indicators/total VOC or COD do not replace chemical masses. Report detection limits and unknown residuals."
      evidence: "Analytical reports and separate elemental/water evidence"
    - id: dq_fg
      applies_to: "dispatched_tape; fg_electricity"
      requirement: "Preserve original FG burden history, genuine delivery/return reversal and incremental rework; disclose actual service period and unfinished later service without allocating old stock to new Q."
      evidence: "FG custody and service ledger with stocktakes"
    - id: dq_pack
      applies_to: "all packaging rows"
      requirement: "Every actually present article needs its complete independent opening empty/attached/reusable and external custody balance; add incoming supplier containers and additional articles before data use."
      evidence: "Per-article ownership and weighing records"
    - id: dq_allocation
      applies_to: "all inventory rows"
      requirement: "Evidence dedicated/virtual subdivision then exchange-specific determining causality then residual same-gate contemporaneous market value; conserve all exchange vectors and disclose unresolved choices."
      evidence: "cp_allocation; ilcd-detailed-2010"
    - id: dq_provenance
      applies_to: "all source-dependent rules"
      requirement: "Use complete primary originals with headers/footnotes and neighboring alternate routes; technical synthesis is not one factory order or a universal numeric range."
      evidence: "Declared source locators and limitations"
validation_rules:
  - rule_id: validate_scope
    applies_to: "all inventory rows"
    rule: "Reject a claimed application outside the section1 physical construction or route without renewed applicability review and complete actual atomic exchanges. Ordinary provider/auxiliary-UUID gaps require data-package resolution, not invented bindings."
    source_ids:
      - cosmo-pct-tape-film
      - basf-psa-solutions
      - tepu-electric-tape-coater
      - louis-bopp-water-tape
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Require consistent1kg net first-release reference, unique released_tape link, correct raw unit conversions, allocation before exactly one A_i/Q and Q0 load retention. Count/area-to-kg conversion without actual same-construction weighing fails; a numerical relationship that remains unknown cannot be called passing."
    source_ids: []
  - rule_id: validate_gates
    applies_to: "all physical ledgers"
    rule: "Require separate manufacturing, FG and combined wet/dry mass and relevant-element reconciliation plus independently evidenced species/water. Cancel internal Q/rework/packaging transfers. Closing FG is not added to production; gross physical dispatch remains real even when returns occur. A single residual cannot establish two unknown species. Explicitly check dryer-tank, cooling and other separately accounted in-process opening/closing quantities and vectors in manufacturing and consolidated gates, with no overlapping stock entries or fitted unknown losses."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "all source-dependent rules"
    rule: "No source default recipe/yield, EPA solvent factor or low/zero-VOC assumption, automatic waste credit, universal allocation percentage, unverified UUID compatibility, or unsupported chemistry/phase change is acceptable. Missing core boundary evidence or unreconciled quantities remain explicit unresolved findings, not manufactured passes."
    source_ids:
      - epa-pstl-1982
      - ilcd-detailed-2010
  - rule_id: validate_pack
    applies_to: "all packaging rows"
    rule: "Require the complete per-article boundary_pack balance including opening/closing attached WIP/FG and reusable stock, gross dispatch and both external return directions; no net-Q proxy, new purchase on every reuse, or automatic co-product."
    source_ids: []
  - rule_id: validate_data
    applies_to: "all inventory rows"
    rule: "Require collection protocol, all raw fields, method, unit, complete period, scope, aggregation and quality evidence plus full calculation Inputs/Output and source attribution. Report unmeasured emissions and unfinished service scope; finite measurement and projection checks establish engineering consistency only."
    source_ids: []
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground gate-to-gate manufacture with separately stated matched FG services"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible declared construction/site/period and upstream link; manufacture and actual service supplements kept distinct"
  excluded_use: "All36920 coverage; comparative carton functional performance; medical/electrical certification; approved methodology; unobserved future service or end-of-life credit"
  required_metadata: "All section3 qualifiers; native identity restrictions; lot and original Q; source/route; actual gate and service scope; upstream supplier boundaries"
  required_quality_disclosure: "Raw unit and stock/vector completeness; unknowns; allocation evidence; species/phase and packaging reconciliation; actual quality tests; unfinished FG services"
  update_trigger: "Changed film/skin/treatment or adhesive formulation; heat/recipe/printing/lining route; actual added flow; changed quality gate or supplier; new measurement or methodological evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version3.0 Structure and Explanatory Notes30June2025; PDF177–179; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "36920 title and adjacent36330/36490/36910/36930 boundaries only; no recipe or mapping acceptance"
  - id: "cosmo-pct-tape-film"
    type: "handbook"
    reference: "Cosmo Films Transparent Film (Tape-Textile Grade); complete PCT-1/PCT-1(HCL)/PCT-2 product section; https://www.cosmofilms.com/productlist/transparent-label-over-lamination-industrial-films"
    used_for: "Real purchased coextruded tape web; single-side corona/untreated reverse/back-treatment-free supply; both-side-treated counterexample; no universal dimensions/grade compatibility"
  - id: "basf-psa-solutions"
    type: "handbook"
    reference: "BASF Solutions for Pressure-Sensitive Adhesives; complete PDF2–5 with printed3–8 labels/specialty/graphic/masking tables; https://www.basf.com/dam/jcr:af4f1f47-5762-36bc-97b9-ab5d4358ec87/basf/www/hk/documents/en/products-industries/dispersions/adhesives/BASF_PSA_brochure_EN.pdf"
    used_for: "Whole coater-ready aqueous acrylic supply capability and coating methods; distinguish named paper/graphic/specialty and UV formulations; no same-SKU carton recipe or numeric defaults"
  - id: "tepu-electric-tape-coater"
    type: "handbook"
    reference: "Dongguan Tepu Automation TP-1000mm BOPP tape coating machine with10m electric heating oven; complete product description/specification/application/raw material/FAQ; https://www.teputapemachine.com/product_detail/1441356532388933632.html"
    used_for: "BOPP film/glue/paper-core supply to electric-heater water-tank drying/slitting/rewinding and compressor; gas/printing alternatives; nominal ratios/daily water/ratings and machinery packing are not tape-inventory defaults"
  - id: "louis-bopp-water-tape"
    type: "handbook"
    reference: "Louis Adhesive Tapes OPP Acrylic Water Based Tape No.430/440/450/P83/P84/P85/P86; complete one-page product sheet including table and custom-size note; https://louistapes.com/wp-content/uploads/2020/01/OPP-Acrylic-Water-Based-Tape.pdf"
    used_for: "Independent actual BOPP water-acrylic carton-sealing tape endpoint/roll/core state; multiple grades and custom sizes; no universal thickness/weight/service life or quality certification"
  - id: "epa-pstl-1982"
    type: "official_guidance"
    reference: "US EPA AP-42 Section4.2.2.9 Pressure Sensitive Tapes and Labels8/82 reformatted1/95; complete PDF1–7 including Figure4.2.2.9-1 and Table4.2.2.9-1 with all notes; https://www.epa.gov/sites/default/files/2020-10/documents/c4s02_2j.pdf"
    used_for: "Pressure-sensitive web/coating/exhaust topology and explicit solvent/burner/primer-release/control countercontext; no transfer of solvent VOC factors/control efficiencies/old low-zero VOC or market-share claims to aqueous electric tape"
  - id: "ilcd-detailed-2010"
    type: "official_guidance"
    reference: "European Commission JRC ILCD Handbook General guide for LCA Detailed guidance First edition March2010; sections7.9.2–7.9.3 PDF275–292 printed255–272 including conditions/examples/footnotes/provisions; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation scenario only; dedicated/virtual subdivision then exchange-specific determining physical causality then residual same-gate market value and sum conservation; no generic recycling or avoided-production credit"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:3de433d10520ff8db73b9ae5e1bb71cb8ceb6e663ff873188aa88da73a488f33"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8052"
      family: "system_boundary"
      span:
        start:
          offset: 8052
          line: 66
          column: 1
        end:
          offset: 14379
          line: 90
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Purchased complete qualified BOPP tape web and whole aqueous acrylic PSA; actual lot/site supply forms and raw/WIP/FG stocks |\n| starting_condition_role | foreground_gate_to_gate |\n| product_classification_scope | Narrow plastic self-adhesive BOPP carton tape subset; CPC36920 title supplies no recipe |\n| recursive_input_rule | Purchased already adhesive tape is not uncoated backing. External returned tape retains original lot burden; internal transfers/rework are linked without repurchase or new Q. |\n| upstream_dataset_requirement | Link actual complete backing including skins/corona and actual whole wet PSA to compatible upstream datasets; actual energy/water/packaging supply and waste treatment linked once |\n| disclosure | Manufacturing first-release and FG custody/service gates remain separate; disclose actual outside supply, omitted stages, conditions, uncertainties and unresolved compatibility |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_route | all processes | Include the complete stated manufacture and actual post-release services. In the selected electric route no burner combustion, external steam, boiler or recovery device is presumed. If genuinely used, separately name each fuel, heat/steam supply, return water, auxiliary and actual species with supplier energy/water agreement; assess changed-route applicability before modelling. | tepu-electric-tape-coater; epa-pstl-1982 |\n| boundary_supply | backing; psa_preparation | Require one-side-treated tape-grade BOPP with untreated reverse and confirmed PSA anchorage/unwind. PCT2 both-side treatment is not equivalent. EPA solvent-line release-coat statements do not force an extra back coat onto this back-treatment-free web. Whole purchased preparation counts once, with actual solids/water/residuals child balances; a complete externally prepared formulation is not the same as separately buying its neat ingredients. | cosmo-pct-tape-film; basf-psa-solutions; epa-pstl-1982 |\n| boundary_q | released_tape | Q equals the sum of uniquely identified NEW first-accepted net tape masses. Track reject, destructive-test and unaccepted WIP separately; retests, customer returns, reopening or redelivery create no new Q. Q=0 periods retain all true loads and no unit result. Closing FG already released is inside Q, not an additional manufacturing output. | louis-bopp-water-tape |\n| boundary_stock | all inventory rows | Maintain each raw-material and WIP lot in its true physical state with opening mass plus real receipts/transfers minus actual consumption/export equals closing mass. WIP includes wet coated web, adhesive in tanks/lines, dried jumbo web and unaccepted slit rolls. Carry a vector for EVERY upstream and foreground exchange; inherit opening vectors, add actual current increments, transfer internal vectors once, and retain closing vectors. Never reset failed starts, zero-output batches, idle, start/stop, cleanup or rework to zero; internal recirculation is neither new purchase nor burden-free scrap. Separately retain actual dryer-tank/cooling-circuit water and equipment charges, their opening/closing quantities and each inherited exchange vector whenever these are not already included in raw/WIP stocks. Identify the stock location and eliminate overlaps; a circulating water charge is not new output. |  |\n| boundary_fg | dispatched_tape; returned_tape; fg_electricity | FG physical gate: openingFG + newFirstReleaseQ + externalReturnedTape = closingFG + grossOutwardTapeG + actualFGWaste. Preserve lot IDs and original burden vectors; opening FG is not new production. Keep post-release service raw loads and measured drivers by actual lot and period, including storage, packing, handling, dispatch and real incremental return rework. Cohort services go to that cohort; opening/returned-lot services retain their own accounts. Combined physical gates cancel internal Q transfers, never add Q and closingFG as independent production. Pending future services are disclosed incomplete, not estimated zero. |  |\n| boundary_pack | all packaging rows | For EACH actual core/carton/film/pallet and additional distinct packaging article: opening empty stock + opening attachedWIP + opening attachedFG + opening reusable stock + new external purchase + externalReturnReceived = closing empty + closing attachedWIP + closing attachedFG + closing reusable + packaging accompanying gross physical dispatch + actual externalReturnSent + waste. Received supplier-attached articles are external receipts in their real form, not hidden free stock. Outward cards keep dispatch and return destinations separately. Internal reuse cancels; packaging is neither Q nor new purchase each cycle nor automatic co-product. Include actual inbound/returnable drums or IBC as separate whole articles where present. |  |\n| boundary_species | water_vapour; ammonia_air; wastewater | Close total physical wet/dry mass AND relevant C/H/O/N or other element accounts separately from species/reaction evidence at manufacturing, FG and combined gates. Water in wet PSA is already part of its purchase. Distinguish retained free water, evaporated water, liquid effluent, tank water, condensate and any independently evidenced reaction/structural water; no reaction is presumed for simple drying. Never solve two unknown water/VOC masses with one residual or infer chemical masses from COD/TVOC. Measure actual residual monomers/other volatiles separately and create each real species/destination card before use. Internal recirculated exhaust/heat/water is not an external supply or release. | epa-pstl-1982 |\n| boundary_air | all elementary outputs | EPA Figure4.2.2.9-1 describes a solvent/burner line and Table4.2.2.9-1 assumes the solvent entirelyVOC; none of its factors, control efficiencies, historic market shares or low/zero-VOC wording is transferable as a waterborne-electric default. Collect actual species and size-resolved PM after actual controls with uncertainty/detection limits. No solvent-recovery, oxidation or ozone process is presumed absent/operating solely from a marketing label; actual occurrence requires its complete atomic inventory and applicability review. | epa-pstl-1982 |\n\n"
