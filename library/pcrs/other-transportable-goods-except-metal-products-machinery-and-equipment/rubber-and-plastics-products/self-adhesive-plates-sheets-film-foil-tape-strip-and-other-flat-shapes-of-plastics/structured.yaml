system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all processes"
      rule: "Include the complete stated manufacture and actual post-release services. In the selected electric route no burner combustion, external steam, boiler or recovery device is presumed. If genuinely used, separately name each fuel, heat/steam supply, return water, auxiliary and actual species with supplier energy/water agreement; assess changed-route applicability before modelling."
      source_ids:
        - tepu-electric-tape-coater
        - epa-pstl-1982
    - rule_id: boundary_supply
      applies_to: "backing; psa_preparation"
      rule: "Require one-side-treated tape-grade BOPP with untreated reverse and confirmed PSA anchorage/unwind. PCT2 both-side treatment is not equivalent. EPA solvent-line release-coat statements do not force an extra back coat onto this back-treatment-free web. Whole purchased preparation counts once, with actual solids/water/residuals child balances; a complete externally prepared formulation is not the same as separately buying its neat ingredients."
      source_ids:
        - cosmo-pct-tape-film
        - basf-psa-solutions
        - epa-pstl-1982
    - rule_id: boundary_q
      applies_to: "released_tape"
      rule: "Q equals the sum of uniquely identified NEW first-accepted net tape masses. Track reject, destructive-test and unaccepted WIP separately; retests, customer returns, reopening or redelivery create no new Q. Q=0 periods retain all true loads and no unit result. Closing FG already released is inside Q, not an additional manufacturing output."
      source_ids:
        - louis-bopp-water-tape
    - rule_id: boundary_stock
      applies_to: "all inventory rows"
      rule: "Maintain each raw-material and WIP lot in its true physical state with opening mass plus real receipts/transfers minus actual consumption/export equals closing mass. WIP includes wet coated web, adhesive in tanks/lines, dried jumbo web and unaccepted slit rolls. Carry a vector for EVERY upstream and foreground exchange; inherit opening vectors, add actual current increments, transfer internal vectors once, and retain closing vectors. Never reset failed starts, zero-output batches, idle, start/stop, cleanup or rework to zero; internal recirculation is neither new purchase nor burden-free scrap. Separately retain actual dryer-tank/cooling-circuit water and equipment charges, their opening/closing quantities and each inherited exchange vector whenever these are not already included in raw/WIP stocks. Identify the stock location and eliminate overlaps; a circulating water charge is not new output."
      source_ids: []
    - rule_id: boundary_fg
      applies_to: "dispatched_tape; returned_tape; fg_electricity"
      rule: "FG physical gate: openingFG + newFirstReleaseQ + externalReturnedTape = closingFG + grossOutwardTapeG + actualFGWaste. Preserve lot IDs and original burden vectors; opening FG is not new production. Keep post-release service raw loads and measured drivers by actual lot and period, including storage, packing, handling, dispatch and real incremental return rework. Cohort services go to that cohort; opening/returned-lot services retain their own accounts. Combined physical gates cancel internal Q transfers, never add Q and closingFG as independent production. Pending future services are disclosed incomplete, not estimated zero."
      source_ids: []
    - rule_id: boundary_pack
      applies_to: "all packaging rows"
      rule: "For EACH actual core/carton/film/pallet and additional distinct packaging article: opening empty stock + opening attachedWIP + opening attachedFG + opening reusable stock + new external purchase + externalReturnReceived = closing empty + closing attachedWIP + closing attachedFG + closing reusable + packaging accompanying gross physical dispatch + actual externalReturnSent + waste. Received supplier-attached articles are external receipts in their real form, not hidden free stock. Outward cards keep dispatch and return destinations separately. Internal reuse cancels; packaging is neither Q nor new purchase each cycle nor automatic co-product. Include actual inbound/returnable drums or IBC as separate whole articles where present."
      source_ids: []
    - rule_id: boundary_species
      applies_to: "water_vapour; ammonia_air; wastewater"
      rule: "Close total physical wet/dry mass AND relevant C/H/O/N or other element accounts separately from species/reaction evidence at manufacturing, FG and combined gates. Water in wet PSA is already part of its purchase. Distinguish retained free water, evaporated water, liquid effluent, tank water, condensate and any independently evidenced reaction/structural water; no reaction is presumed for simple drying. Never solve two unknown water/VOC masses with one residual or infer chemical masses from COD/TVOC. Measure actual residual monomers/other volatiles separately and create each real species/destination card before use. Internal recirculated exhaust/heat/water is not an external supply or release."
      source_ids:
        - epa-pstl-1982
    - rule_id: boundary_air
      applies_to: "all elementary outputs"
      rule: "EPA Figure4.2.2.9-1 describes a solvent/burner line and Table4.2.2.9-1 assumes the solvent entirelyVOC; none of its factors, control efficiencies, historic market shares or low/zero-VOC wording is transferable as a waterborne-electric default. Collect actual species and size-resolved PM after actual controls with uncertainty/detection limits. No solvent-recovery, oxidation or ozone process is presumed absent/operating solely from a marketing label; actual occurrence requires its complete atomic inventory and applicability review."
      source_ids:
        - epa-pstl-1982
