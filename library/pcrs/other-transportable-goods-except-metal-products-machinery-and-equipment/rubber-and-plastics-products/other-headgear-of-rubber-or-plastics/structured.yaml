allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory rows"
    rule: "This method uses attributional allocation only where the study situation requires allocation. Establish that scope first; industrial manufacturing sources do not authorize a consequential substitution or automatic recycling credit. Respect applicable ILCD situation/recycling provisions when a different question is asked."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_exclusive
    applies_to: "all inventory rows"
    rule: "First subdivide actual distinguishable stages/lines or use evidenced virtual subdivision. Assign each whole formulation, dedicated machine meter, test, failure, cleanup, package and FG service directly to its causing lot/product when possible. Retain burden-bearing stock transfers and shared idle loads; no total-output shortcut before exclusive attribution."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_causality
    applies_to: "all inventory rows"
    rule: "For each still-shared exchange independently identify the determining physical cause and actual measured driver, e.g. heater duty with temperature/time/configuration, cooling duty with measured flow/enthalpy, or handling with actual operations. Mass/count alone is not universal causality. Validate each driver and allocation total/uncertainty; different exchanges may need different causal drivers."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only the genuine residual lacking a determining physical assignment uses relative market value of actual cofunctions at the common process exit/entry gate in their real state and period. Derive same-gate values transparently by removing later transport/conditioning/packaging costs where necessary; record quantity, currency, date and sensitivity. Unknown causal/value evidence holds that dataset incomplete; no fixed ratio or free choice between physical/economic keys."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: allocation_returns
    applies_to: "all packaging rows; fg_out; fg_return; waste_fg"
    rule: "Physical custody remains unchanged by burden allocation. Internal reuse carries inherited burden once; external waste/recovery follows actual treatment/ownership and applicable recycling model. No automatic negative flow, avoided virgin credit or erasure of old cap production from a return, retest or lost lot."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "cap_production"
      flow_role: "Whole preparations and actual auxiliaries"
      record_type: "purchase/stock/issue"
      raw_fields: "lot; supplied preparation; composition assay; measured receipts; opening/closing raw and WIP; equipment location; losses; upstream links"
      collection_method: "Reconcile calibrated weighing, invoices, issue/return and actual A/B dosing/mixing logs; assays are child accounts only. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "kg"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration and supplier formulation/compatibility documents"
    - protocol_id: cp_energy
      process_id: "cap_production"
      flow_role: "Manufacturing electricity"
      record_type: "meter"
      raw_fields: "equipment; meter; raw kWh; interval; warmup idle failure cleanup rework; cause driver; voltage geography provider"
      collection_method: "Submeter actual mould heaters/drives/cooling/air/vacuum/postcure and shared services; retain raw intervals and exclude duplicate provider services. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "kWh"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration and electrical supply-boundary evidence"
    - protocol_id: cp_water
      process_id: "cap_production"
      flow_role: "Water loops cleaning and external returns"
      record_type: "meter/sample/stock"
      raw_fields: "water identity; original volume/mass/rate; interval; density; temperature pressure; loop opening/closing; inlet return effluent evaporation; enthalpy"
      collection_method: "Measure each boundary separately; independently sample composition/phase and loop stock; verify supplier energy/water agreement and calibrations. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "original unit"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Water/state/effluent analyses and supplier agreement"
    - protocol_id: cp_charge
      process_id: "cap_production"
      flow_role: "Hydraulic oil and R134a charges"
      record_type: "stock/service"
      raw_fields: "material; equipment; charge location; opening/closing; additions; recovery return; waste; leak; density/state; inherited vector"
      collection_method: "Measure each actual charge and movement independently; preserve all inherited exchanges; reconcile without double counting raw/WIP. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "original unit"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Service/weighing logs and independent substance density"
    - protocol_id: cp_air
      process_id: "cap_production"
      flow_role: "Actual gas intake and discharge"
      record_type: "meter/speciation"
      raw_fields: "intake origin; purchased air; integrated volume or actual rate; interval; P T humidity; nitrogen oxygen argon CO2 composition; outlet; uptake"
      collection_method: "Use calibrated state-bound gas meters and independent composition/humidity; distinguish onsite resource and purchased carrier child accounts, no repeated time integration. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "original unit"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Gas-meter calibration and actual composition/state records"
    - protocol_id: cp_species
      process_id: "cap_production"
      flow_role: "Each actual emission species"
      record_type: "sample/flux"
      raw_fields: "species CAS; compartment; raw concentration; actual integrated flow or rate; interval; detection limit; control; captured mass; uncertainty"
      collection_method: "Measure actual species after controls with consistent wet/dry and state bases; collect independent input/retained/wastewater/residue chemistry and phase evidence. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "original unit"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Laboratory chain calibration detection limits and destination records"
    - protocol_id: cp_waste
      process_id: "cap_production"
      flow_role: "Each real waste"
      record_type: "weigh/manifest"
      raw_fields: "single waste identity; uncured/cured state; gross mass; dry solids; water; contamination; destination; lot vector"
      collection_method: "Weigh each actual material/outlet separately; reconcile collection/treatment handoff and retained contents; no aggregate waste/species substitution. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "kg"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste manifests scale calibration and actual assays"
    - protocol_id: cp_quality
      process_id: "cap_production"
      flow_role: "Unique new first-release cap"
      record_type: "weigh/test/release"
      raw_fields: "lot; configuration; cure/postcure logs; test methods/limits; net accepted kg; first-release IDs; reject test and WIP kg"
      collection_method: "Weigh complete accepted caps with calibrated scale after declared conditioning excluding packaging; reconcile new unique release IDs and measured count if collected; retain all failures and destructive samples. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "kg"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Release authorization geometry/cure test and weighing records"
    - protocol_id: cp_fg
      process_id: "cap_production"
      flow_role: "FG stock and physical custody"
      record_type: "lot ledger"
      raw_fields: "lot; original Q and numerator/vector; opening/closingFG; new release; gross outward; external return; reversal; disposal; service period"
      collection_method: "Trace actual lot custody and original denominator/history; reconcile physical movements and separately attribute incremental return work; no fabricated new production. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "kg"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Warehouse dispatch return and historic burden records"
    - protocol_id: cp_fg_energy
      process_id: "cap_production"
      flow_role: "Actual FG service power"
      record_type: "meter/driver"
      raw_fields: "lot; original denominator; service period; raw kWh; shared meter; actual causal driver; idle and return work"
      collection_method: "Separate service meters and actual lot drivers from manufacturing and from other cohorts; retain old-cohort numerator and denominator. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "kWh"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters service driver measurements and stock-cohort history"
    - protocol_id: cp_pack
      process_id: "cap_production"
      flow_role: "Every separate packaging article"
      record_type: "article stock/custody"
      raw_fields: "article composition; lot; tare; opening/closing empty attachedWIP attachedFG reusable; new purchase/receipt; return received; gross shipment; return sent; waste; content"
      collection_method: "Count and independently weigh actual article tare with real composition and complete directional custody; reuse does not alter measured gross outward mass. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "kg"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier packaging declarations tare weighing custody and waste records"
    - protocol_id: cp_transport
      process_id: "cap_production"
      flow_role: "Actual road transport"
      record_type: "trip"
      raw_fields: "trip; article and cap lot; actual payload including packaging; distance; loaded/return legs; provider boundary"
      collection_method: "Measure trip mass and distance and check carrier records/provider boundary; retain distinct actual outbound/return service attribution. Retain undivided raw entries by lot and state; attribution and stock-vector reconciliation precede report_once."
      unit: "t.km"
      frequency: "each lot/event and meter interval"
      temporal_coverage: "full declared period including zero-output and historical opening lots"
      site_scope: "actual site equipment and lot"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighbridge trip and carrier records"
    - protocol_id: cp_allocation
      process_id: "cap_production"
      flow_role: "all inventory rows"
      record_type: "allocation evidence ledger"
      raw_fields: "exchange; cofunction; exclusive meter; virtual subdivision; determining causal hypothesis; measured driver; residual shared amount; common gate; actual state; contemporaneous quantity price currency date; downstream cost adjustment; uncertainty"
      collection_method: "Collect independent proof for each hierarchy step and each exchange. Preserve raw undivided allocations and stock/cohort vectors; do not normalize here. Unknown causality/value evidence keeps the actual dataset incomplete."
      unit: "each exchange original unit"
      frequency: "each attribution period and configuration change"
      temporal_coverage: "same complete operating and value period"
      site_scope: "actual shared process gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "dedicated-meter proof; causal study; same-gate price evidence; full allocated-sum conservation"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert calibrated raw values to the declared atomic numerator unit before attribution; integrate only actual rates once. Use independent material state/density/composition, never a screening property coefficient. Preserve original records and uncertainty."
      inputs:
        - raw_value
        - raw_unit
        - interval
        - measured_state
        - density
        - composition
      output: "raw_numerator"
      source_ids: []
    - id: quality_quantity
      applies_to: "released_cap"
      rule: "Q = sum of unique new first-accepted net complete-cap kg; exclude packaging and previously released lots. No delivery or reinspection count enters Q."
      inputs:
        - cp_quality
        - accepted_lot_mass
        - first_release_id
      output: "Q"
      source_ids:
        - jerry-swim-cap-production
    - id: stock_vectors
      applies_to: "all inventory rows"
      rule: "By each actual raw/WIP/loop/equipment lot conserve physical amount and every inherited exchange vector: opening plus real increments/transfers equals closing plus actual exits/consumption; preserve source cohort denominator and eliminate overlapping stock accounts."
      inputs:
        - cp_material
        - cp_water
        - cp_charge
        - opening_vector
        - current_increment
        - closing_vector
      output: "attributed_lot_vector"
      source_ids: []
    - id: exchange_attribution
      applies_to: "all inventory rows"
      rule: "Exclusive/virtual subdivision precedes exchange-specific determining physical causality; only the genuine remaining shared residual uses same-period actual common-gate market values. Preserve Q=0 loads for explicit burden transfer/disclosure, not arbitrary future amortization."
      inputs:
        - raw_numerator
        - attributed_lot_vector
        - causal_driver
        - residual_gate_value
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: fg_cohorts
      applies_to: "fg_in; fg_return; fg_out; fg_power; waste_fg"
      rule: "Retain original manufacturing A_i and original Q for old FG/returns; add only measured attributable incremental service numerator to the same cohort. Reconcile physical FG gate and original dispatch reversals independently; do not allocate old-cohort services onto unrelated current Q."
      inputs:
        - cp_fg
        - cp_fg_energy
        - original_numerator
        - original_Q
        - actual_service_increment
      output: "cohort_A_i; cohort_Q"
      source_ids: []
    - id: pack_balance
      applies_to: "all packaging rows"
      rule: "Apply the full boundary_pack equation to each whole physical article independently; keep all actual external directions at measured gross article mass and internal reuse cancelling only inside custody. Burden allocation cannot alter physical movement."
      inputs:
        - cp_pack
        - article_stock
        - article_purchase
        - return_received
        - gross_outward
        - return_sent
        - article_waste
      output: "article_balance"
      source_ids: []
    - id: species_balance
      applies_to: "all elementary rows"
      rule: "Close total mass/elements and independently measured actual species/phase balances, including carrier gas and separate external water/equipment stocks. Never fit multiple unknown species to one residual or convert COD/TVOC to a specific chemical."
      inputs:
        - cp_species
        - cp_air
        - cp_water
        - cp_charge
        - independent_assays
      output: "species_balance"
      source_ids:
        - wacker-silicone-processing
    - id: report_once
      applies_to: "all inventory rows"
      rule: "q_i = A_i / Q, once for the identified new first-release cohort after raw conversion, attribution and inherited-vector reconciliation. For old cohorts use their own cohort_A_i and original cohort_Q in this same operation. Q=0 retains loads and produces no unit result. Reference output is 1 kg by definition; cards and aggregation only refer to this operation."
      inputs:
        - A_i
        - Q
        - cohort_A_i
        - cohort_Q
      output: "q_i"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Match whole preparations/grades, complete native names/qualifiers/CAS/geography/type/all properties/reference units and actual provider. Empty auxiliary UUIDs need identity resolution; generic family records never override a hard chemical/form/route contradiction."
      evidence: "Supplier/native originals and compatibility measurements"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Retain all three physical gates, whole preparations, raw/WIP/FG and separate loop/charge stocks with every inherited exchange vector; include all failed/idle/rework events, actual species and package directions."
      evidence: "Full stock and operating-period reconciliation"
    - id: dq_basis
      applies_to: "all inventory rows"
      requirement: "Use unnormalized raw numerator records and only report_once for the matching actual Q; original old-cohort denominators persist. No fabricated weight, density, threshold, emission factor, ratio, life or activity range."
      evidence: "Calibrations original units formulas and cohort history"
    - id: dq_scope
      applies_to: "all processes"
      requirement: "Primary manufacturer capabilities and supplier guide are independent technical synthesis, not same-SKU factory evidence. No source marketing rates or grade-chart values become cap defaults; qualify actual site/period and uncertainty."
      evidence: "wacker-silicone-processing; jerry-swim-cap-production; ukong-swim-cap-supply"
    - id: dq_missing
      applies_to: "all processes"
      requirement: "A real missing terminal, route or basis prevents an authored method claim; a critical missing measurement/species/history makes the concrete dataset incomplete. Ordinary auxiliary UUID/provider/future factory-data requirements alone do not imply an invented numeric result or universal scientific approval."
      evidence: "Explicit missing-data and uncertainty register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "released_cap"
    rule: "Require the actual complete unprinted nonprotective LSR cap and every qualifier; 1 kg net new first-release basis must select this sole linked reference row in both languages. Do not infer per-cap weight or let generic native headgear identity replace route evidence."
    source_ids:
      - jerry-swim-cap-production
      - ukong-swim-cap-supply
      - un-cpc3-2025
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Verify raw units/rates and measured state, unique Q, whole formulation count, complete stock vectors and original cohort denominators; report_once executes once only. Q=0, unsupported conversion or missing critical relationships cannot yield a passing concrete dataset."
    source_ids: []
  - rule_id: validate_physical
    applies_to: "all processes"
    rule: "Independently reconcile manufacturing, FG and combined physical mass/elements, actual species/phase data, separate water/equipment charges and every package article/direction; cancel only internal transfers. Do not solve two unknowns from one residual or erase gross dispatch through reuse/allocation."
    source_ids: []
  - rule_id: validate_native
    applies_to: "all inventory rows"
    rule: "Adopted Product/Waste/resource/emission type, CAS, material state, particle structure, supply geography/voltage and actual compartment must agree with original native restrictions. Distinguish ordinary air from long-term/indoor/water outlets; a family name or taxonomic correction is not compatibility proof."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "all inventory rows"
    rule: "Demonstrate exclusive/virtual subdivision and per-exchange determining physical cause before any genuine residual common-gate market-value allocation. Preserve exact full-period failures, zero-output and historical stock burdens; missing evidence stays explicit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_quality
    applies_to: "released_cap"
    rule: "Require actual geometry/visual/fit/cure and declared strength acceptance, A/B storage compatibility and real finishing/postcure evidence. No performance, certification or lifetime can be inferred from a manufacturer page or a supplier example chart."
    source_ids:
      - wacker-silicone-processing
      - jerry-swim-cap-production
      - ukong-swim-cap-supply
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual compatible cap supply in a larger LCA with declared geography/period and lot basis"
  allowed_use: "Qualified complete unprinted LSR cap production; include only observed attributed FG services and disclose remaining service scope"
  excluded_use: "Whole leaf coverage; safety helmets; textile/latex/HCR routes; printed/laminated caps; protective claims; unmeasured product footprints"
  required_metadata: "Every reference qualifier; original lot denominators; full unit/source/provider/stock/physical gate history"
  required_quality_disclosure: "Actual measured scope uncertainty missing auxiliary identities future services and pending scientific/translation review"
  update_trigger: "Changed A/B formulation geometry cure method electricity boundary supplier site period acceptance or evidence"
