system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all processes"
      rule: "Include receipt/storage, paired dosing/mixing, real cold-runner and hot-mould injection/cure, demould, actual flash/sprue trim, cleaning, conditioning/testing and unique first release. Include actual optional electric postcure, cooling, air, vacuum, maintenance, storage/packing/dispatch services and failure/idle loads. No boiler, external steam, fuel firing or peroxide reaction is presumed; changed actual operations require full single-material/species inventory and applicability review."
      source_ids:
        - wacker-silicone-processing
        - jerry-swim-cap-production
    - rule_id: boundary_q
      applies_to: "released_cap"
      rule: "Q is the sum of uniquely identified NEW first-accepted complete net cap kg. Reinspection, delivery, returns, reopening or redelivery creates no new Q. Closing released FG already belongs to Q once; do not add it as an extra manufacturing output. Q=0 retains all actual loads and yields no unit result."
      source_ids:
        - jerry-swim-cap-production
    - rule_id: boundary_stock
      applies_to: "all inventory rows"
      rule: "Keep separate raw A, raw B, mixed material in feed/mixer/runner, uncured/cured unaccepted WIP and retained tests by actual location/lot/state. Opening stock plus actual receipts/transfers equals closing stock plus actual consumption/exports/losses. For EVERY exchange carry opening inherited burden vector, add real current increments, transfer internal vectors once, retain closing vector and original denominator/history. Preserve all failed/zero-output/start-stop/idle/cleanup/rework burdens. Keep cooling-loop water, hydraulic charge, refrigerant charge and other equipment stocks with their own physical quantity AND inherited exchange vectors wherever outside raw/WIP; name locations and eliminate overlap."
      source_ids: []
    - rule_id: boundary_fg
      applies_to: "fg_in; fg_return; fg_out; fg_power; waste_fg"
      rule: "FG gate: openingFG + newFirstReleaseQ + externalReturnedCaps = closingFG + grossOutwardCapsG + actualFGWaste. Preserve each old FG/return cohort original production numerator, original Q and delivery reversal history. Attribute actual storage/packing/handling/dispatch and incremental rework services to that lot with its own historical denominator, never unrelated current Q. Manufacturing and FG combined gates cancel internal Q transfers; they do not add first release and closing FG twice. Future services not yet observed stay disclosed incomplete."
      source_ids: []
    - rule_id: boundary_pack
      applies_to: "all packaging rows"
      rule: "For EACH separate article: opening empty + opening attachedWIP + opening attachedFG + opening reusable + new external purchase/receipt + externalReturnReceived = closing empty + closing attachedWIP + closing attachedFG + closing reusable + article accompanying gross physical dispatch + externalReturnSent + waste. Distinguish purchase from attached supplier receipts to prevent duplicate entries; track residual contents independently. All five external directions have separate cards. Internal reuse cancels and never reduces gross outward mass, raises net product Q, creates new purchase or earns automatic coproduct/avoided-burden credit. Add each genuinely used different article/material before modelling."
      source_ids: []
    - rule_id: boundary_water
      applies_to: "water_makeup; wash_water; external_cooling_in; external_cooling_out; water_vapour"
      rule: "Close physical total mass and relevant Si/C/H/O balances independently from analytical species/phase evidence at manufacturing, FG and combined gates. Separate free moisture, emulsion carrier, ambient moisture, retained water, actual evaporation/condensate/effluent and independently evidenced reaction/structural water. Addition hydrosilylation does not justify inventing water byproduct; no two unknown masses from one residual, and no species mass from COD/TVOC. External water returns remain real Product outputs with measured state/enthalpy and supplier energy/water convention; internal cooling recirculation is not purchase."
      source_ids:
        - wacker-silicone-processing
    - rule_id: boundary_species
      applies_to: "all elementary rows"
      rule: "Actual ventilation/pneumatic gas carries individually measured nitrogen, oxygen, argon, atmospheric-origin CO2 and water plus each genuine process species. Purchased compressed-air species are child carrier accounts, not duplicate resource intake. Quantify actual D4/D5/D6 and other siloxanes separately only if detected/otherwise evidenced; addition cure is not proof of zero volatile release. Species leaving with wastewater or waste remains in that outlet, not also emitted to air. Add each actual new species/size fraction/compartment and capture-residue destination; no unspecified VOC/PM surrogate mass."
      source_ids:
        - wacker-silicone-processing
    - rule_id: boundary_quality
      applies_to: "lsr_a; lsr_b; released_cap"
      rule: "Independently verify matching A/B formulation, storage/pot life and inhibitor/cross-contamination controls; actual acceptance covers complete cap geometry, surface, cure and declared service tests. Compression/HCR, peroxide, textile or printed cap evidence is not an LSR production recipe. Postcure depends on actual supplier/product qualification; retain genuine postcure electricity, ventilated species and failures, never enforce a universal temperature/time from a thick-sheet chart."
      source_ids:
        - wacker-silicone-processing
        - jerry-swim-cap-production
        - ukong-swim-cap-supply
