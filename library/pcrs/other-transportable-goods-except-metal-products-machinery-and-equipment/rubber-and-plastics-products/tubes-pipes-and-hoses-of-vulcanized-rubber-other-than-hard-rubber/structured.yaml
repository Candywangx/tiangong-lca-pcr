system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "all inventory rows"
      rule: "Include receipt/storage, catalyst incorporation/milling/straining, screw extrusion, atmospheric electric thermal cure, cooling, actual post-cure/finishing, dimensional/cure/defect inspection and actual coiling/packing, finished storage and factory dispatch. Keep stage records although represented by one integrated process. Do not model connector assembly from purchased finished hose as this manufacturing route."
      source_ids:
        - wacker-silicone-processing
        - reiss-silicone-extrusion
        - advantapure-apst-coils
    - rule_id: boundary_actual
      applies_to: "all inventory rows"
      rule: "The cards identify concrete collection exchanges, not a common recipe. Before quantitative data use add each actual pigment, reinforcement, release agent, cleaner, fuel, compressed-air supply, refrigerant, packaging core, waste, utility export and detected emission as its own atomic card with evidence; a changed base/structure/cure outside scope requires new applicability review. Demonstrably absent options may be not_applicable; UUID gaps cannot remove real burdens."
      source_ids:
        - wacker-silicone-processing
    - rule_id: boundary_stock
      applies_to: "all inventory rows"
      rule: "Maintain separate raw-material, WIP, production-release, finished-warehouse and dispatch ledgers. Manufacturing release P and dispatched Q are independently measured; opening finished stock + release receipts + actual returned stock = dispatch transfers + closing stock + actual losses. For this net-delivery reference retain opening/closing WIP and finished-stock quantities, compositions and carried upstream burdens; allocate actual warehouse/rework/packing/handling to the matched delivered cohort and carry undelivered burdens forward. Cancel internal handoffs exactly once."
      source_ids:
        - reiss-silicone-extrusion
