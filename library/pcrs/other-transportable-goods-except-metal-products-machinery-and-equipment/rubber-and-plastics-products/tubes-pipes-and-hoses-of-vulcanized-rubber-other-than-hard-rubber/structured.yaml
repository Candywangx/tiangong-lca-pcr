measurement_rules:
  - id: net_dispatch
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Q is the unique positive net accepted dispatched tube mass, not quality-release production, length, coil count or gross packed mass. Record actual opening/closing WIP and finished goods and carry their burdens. Unshipped finished goods are not Q. Returns/reacceptance require linked reversal and final-delivery records; the same physical tube cannot count twice."
  - id: length_mass
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Length conversion requires measured linear mass lambda in kg/m for the same grade, ID/OD, layer/cure/moisture state and supplied configuration. Weigh traceable net sample length on a calibrated scale, lambda = sample mass / measured length; sum actual length times matched lambda. Coil/count conversion uses measured net mass of that actual coil/configuration. Record calibration, sampling variation and uncertainty; nominal density or an invented mass cannot substitute."
  - id: wet_formulation
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Whole supplied base/paste/cleaner mass is procurement; polymer, filler, platinum, solvent and carrier water are non-additive composition subledgers. On-site blending records actual separately acquired ingredients, energy and loss. Keep reaction-water evidence independent of moisture, evaporation, utility condensate and closure residuals."
  - id: raw_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain actual physical numerator units. Convert metered volume using documented density at actual concentration/state, energy by explicit unit conversion and rate by matched duration. An already integrated gas/liquid volume is not multiplied by time again; secondary native property factors do not establish density. Execute only report_once after conversions and cohort attribution."
