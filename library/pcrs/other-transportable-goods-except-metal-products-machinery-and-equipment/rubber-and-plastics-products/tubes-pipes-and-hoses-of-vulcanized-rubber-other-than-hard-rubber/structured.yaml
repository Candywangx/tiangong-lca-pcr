allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all inventory rows"
    rule: "This is attributional foreground accounting. Establish the study decision context and justify why subdivision, virtual subdivision and where applicable substitution/system expansion cannot avoid allocation under ILCD 2010 7.9.2/7.9.3. These are not freely interchangeable options and do not assert full ILCD/PEF conformance."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "all inventory rows"
    rule: "Directly assign lot materials and dedicated meters; use virtual subdivision and determining physical causality separately for each exchange before residual allocation. Justify each shared service driver from its actual function: e.g. measured line occupation/time and load for tunnel duty or occupied space times storage duration when causally determining. Equal mass shares are not a universal rule and mere correlation is insufficient. Preserve startup, failure, zero-output, rejects and rework burdens within the cohort that caused them."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only remaining burdens without an identifiable determining physical relation use justified relative market values of real co-functions in their actual condition/quantity at the same joint-process exit gate. Document actual amounts, time-representative prices, grade and conditioning/transport/packaging adjustments; delivered retail prices must not stand for raw off-grade exit value. Retain uncertainty/sensitivity and the 100 percent inventory reconciliation. Do not assign one economic share to already directly assigned exchanges."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_loss
    applies_to: "all inventory rows"
    rule: "Saleable off-grade tubing, actual waste for treatment, utility returns and customer returns have different physical and accounting roles. Determine actual destination/value and preserve outgoing quantities independently; no fixed recovery share, avoided-product credit or arbitrary negative inventory is authorized. Internal uncured reuse retains carried burdens and actual reuse energy/loss, without a second purchase or product output."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_dispatch
      process_id: "hose_line"
      flow_role: "product"
      record_type: "dispatch_and_stock"
      raw_fields: "tube/coil ID; grade; actual acceptance and dispatch timestamps; release P; net dispatched mass; returns/reversals; cancellations; final accepted length; measured lambda or coil net mass; tare; opening/closing WIP and FG; carried burden by lot"
      collection_method: "Owner: quality manager and dispatch/production accountant. Weigh actual accepted dispatched bare coils on calibrated scales or use traceable actual matched length and measured linear mass; record whole-coil net mass for count records. Collect complete un-divided period ledgers, independently reconcile P and warehouse movements, deduplicate final deliveries and link prior returns/burdens. Include failed/zero-output/rework lots; do not divide by Q during collection."
      unit: "kg; m"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
    - protocol_id: cp_material
      process_id: "hose_line"
      flow_role: "material"
      record_type: "receipt_dosing_and_stock"
      raw_fields: "row_id; stage; lot; whole supplied mass; composition/assay; carrier/free water; receipts; opening/closing stock; charged mass; returned/reused compound; spills; failed runs; WIP and FG carried input burdens"
      collection_method: "Owner: materials accountant and mixing operator. Collect raw scale/receipt/issue/stock records for each whole commercial formulation and separately purchased ingredient; reconcile its non-additive constituent/water subledger, actual mixing/straining losses and return/rework histories. Retain original units, WIP/FG carryover and un-divided raw period numerators, including unsuccessful batches."
      unit: "kg; m3"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
    - protocol_id: cp_utility
      process_id: "hose_line"
      flow_role: "utility"
      record_type: "meters_and_stage_operation"
      raw_fields: "row_id; supply/voltage; stage; meter start/end; rate; duration; already integrated volume; state/density; kWh; steam mass/enthalpy; cooling; post-cure; startup/standby; rework; warehouse/handling; carried utility burdens"
      collection_method: "Owner: utilities engineer. Preserve complete raw stage meters and time/load records from receiving through electric cure, actual post-cure, controls, storage/packing/dispatch and all failed/rework/standby operations. Identify actual separately supplied utilities and returns. Do not normalize; do not multiply already integrated volumes by time. Preserve opening/closing WIP/FG carried utility burdens and actual allocation evidence."
      unit: "kWh; MJ; kg; m3"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
    - protocol_id: cp_water
      process_id: "hose_line"
      flow_role: "water"
      record_type: "water_and_return_balance"
      raw_fields: "row_id; supply quality; liquid mass/volume; actual density/state; formulation water; cooling recirculation; utility returns; steam injection; condensate; water vapour; WIP/FG moisture; reaction evidence"
      collection_method: "Owner: water/utility engineer and laboratory analyst. Independently meter external water, steam and real return outlets, and assay formulation/stock water. Preserve raw physical phase and moisture ledgers; ideal hydrosilylation is addition, not condensation-water formation. Actual side-reaction species/water require independent reaction and measurement support, never residual fitting. No A/Q at collection."
      unit: "kg; m3"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
    - protocol_id: cp_pack
      process_id: "hose_line"
      flow_role: "packaging"
      record_type: "article_stock_and_outgoing_mass"
      raw_fields: "row_id; article/composition; whole purchased mass; constituent subledger; opening/closing unused and reused stock; receipts; returns; discarded pieces; liner/core; actual outgoing packaging by dispatched cohort; carried burdens"
      collection_method: "Owner: packaging custodian and dispatch accountant. Weigh each actual complete supplied article and the actual mass leaving with tubing, separating liners/cores/waste, return to supplier, external reuse transfers and internal repeated use. Keep complete un-divided stock/movement and burden ledgers including packaging already on opening/closing FG. Reused material is not another procurement; packaging is not net tube Q."
      unit: "kg; piece"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
    - protocol_id: cp_output
      process_id: "hose_line"
      flow_role: "waste"
      record_type: "outputs_weighing_and_destination"
      raw_fields: "row_id; stage; stream; wet mass; moisture; species; cured/uncured state; sale/waste status; actual destination/value; internal recycle; test loss; failures/rework; stock/burden carryover"
      collection_method: "Owner: environment manager and production accountant. Independently weigh each actual saleable off-grade output and waste stream, keep manifests/analysis and collection/treatment interfaces. Reconcile failed batches, trim, destructive tests, cure state and real return/rework movements without double counting. Preserve complete un-divided raw period quantities and WIP/FG carried burdens; do not solve an unknown outlet from another unknown reaction-water residual."
      unit: "kg; m3"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
    - protocol_id: cp_emission
      process_id: "hose_line"
      flow_role: "emission"
      record_type: "species_and_exhaust_measurement"
      raw_fields: "row_id; species; air/water compartment; sampling method; concentration; exhaust rate; duration; integrated volume; actual/standard state; water; captured/recovered mass; residual product volatiles; abnormal operations; carried burdens"
      collection_method: "Owner: environmental measurement lead. Collect independently speciated representative raw tests and matching complete exhaust/water records for routine, startup, failure, cleaning and actual post-cure. Screen actual species before assigning any D4/D5/IPA value, reconcile captured/recycled outputs and residuals, and add any newly identified species as a separate card. Keep un-divided raw numerators and carryover; concentration times integrated volume receives no extra duration."
      unit: "kg; mg/m3; m3"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
    - protocol_id: cp_quality
      process_id: "hose_line"
      flow_role: "quality"
      record_type: "grade_and_release_tests"
      raw_fields: "lot; base/catalyst identity; layers; ID/OD/wall; actual cure/post-cure; acceptance specification; inspection/pressure/leak/tensile test if specified; release P; test specimen mass; failures; linkage to dispatched cohort"
      collection_method: "Owner: quality manager. Retain actual approved product specification, lot traceability, dimensional/cure/visual results and only duty-specific validated performance tests. Weigh test losses and link them to the real manufactured cohort. No supplier marketing range, nominal density, food-contact statement, universal hose pressure or service lifetime is an observed site result. Raw records only."
      unit: "kg; m; actual test units"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
    - protocol_id: cp_allocation
      process_id: "hose_line"
      flow_role: "shared_burden"
      record_type: "exchange_specific_attribution"
      raw_fields: "row_id; shared process; actual co-functions; direct meters; time/load/space; allocation rationale; exit condition/quantities; representative price; conditioning/transport adjustments; uncertainty; sum before/after"
      collection_method: "Owner: LCA practitioner and site process accountant. Collect un-divided actual shared totals, identify exchange-specific determining causal relationships and virtual subdivision first, then collect same-gate market values only for justified residual burdens. Preserve full decision and sensitivity evidence. No fixed share or double assignment of already attributed exchanges."
      unit: "actual exchange units; h; currency"
      frequency: "each lot and full continuous intervals"
      temporal_coverage: "same complete period and product/route/state delivered cohort, including linked prior carryover"
      site_scope: "actual declared site and included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, lot traceability, raw ledgers, independent analyses and complete carryover reconciliation"
  calculation_rules:
    - id: report_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q; reconcile raw-material and unused/reusable packaging stock withdrawals and actual supplier returns before forming A_i, so unused receipts do not become consumption. A_i is the complete raw-period exchange numerator after raw-unit conversions and exchange-specific attribution to the net-delivered cohort, including actual failed/zero-output runs, losses, rework, storage, packing and dispatch. Add attributable opening WIP/FG carried burdens and subtract closing WIP/FG carried burdens, with explicit linked return/cancellation transfers and burden corrections; retain unresolved carryovers rather than forcing release P = dispatch Q. Q is the unique positive net accepted dispatched tube mass from cp_dispatch. This is the sole normalization: cards and aggregation_rule describe this same reporting operation and do not perform sequential division. Reference output is 1 kg."
      inputs:
        - A_i
        - Q
        - cp_dispatch
        - cp_material
        - cp_utility
        - cp_water
        - cp_pack
        - cp_output
        - cp_emission
        - cp_quality
        - cp_allocation
      output: "a_i"
      source_ids: []
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "For the independent complete physical plant ledger, opening raw materials + opening WIP + opening FG + all real external mass inputs and actual customer/utility/packaging returns = closing raw materials + closing WIP + closing FG + real external tube/off-grade Product exits + every outgoing packaging article + utility returns + wastes + measured species emissions. Include actually exchanged air/oxygen or other species where material; electricity/heat is not a mass input. Cancel internal stage/recycle/warehouse transfers once. This plant ledger is not the delivered-cohort burden numerator A_i; do not normalize it or omit undelivered stocks to force closure. Track C/Si/H/O and any actual additives by composition, and independently support each real species/reaction-water term and physical moisture/phase change. Do not fit two unknowns to one residual."
      inputs:
        - cp_dispatch
        - cp_material
        - cp_water
        - cp_pack
        - cp_output
        - cp_emission
      output: "physical_ledger"
      source_ids:
        - wacker-silicone-processing
    - id: package_closure
      applies_to: "all inventory rows"
      rule: "For each specific packaging article, opening unused/reused/FG-attached stock + actual receipts/returns = closing unused/reused/FG-attached stock + actual mass accompanying deliveries + actual external supplier/reuse returns + wastes/losses. Track liners and cores separately and internal repeated use without new procurement. Outgoing packaging is a physical Product output even when it is part of the tube delivery function; it never enters net tube Q or creates a second purchase."
      inputs:
        - cp_pack
        - cp_dispatch
      output: "packaging_ledger"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Confirm actual whole formulations, solid VMQ/addition route, no reinforcement/fittings and native restrictions in every applicable card; match supplier backgrounds independently."
      evidence: "supplier certificates and direct identities"
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "Complete raw period and delivered cohort must include failure, rework, return and WIP/FG carryover quantities/burdens with unique Q. Missing carryover cannot be silently set to zero."
      evidence: "calibrated weighing, warehouse and burden ledgers"
    - id: quality_method
      applies_to: "all inventory rows"
      requirement: "No default recipe, cycle, fixed loss, density, pressure/performance, life, volatile factor or economic share is established. Retain raw measures and uncertainty; actual additional exchanges need atomic expansion before quantitative use."
      evidence: "actual process records, tests and source conditions"
    - id: quality_sources
      applies_to: "all inventory rows"
      requirement: "Keep technical mechanism/capability evidence separate from independent LCA allocation evidence and factory measurements. Industrial sources support a bounded technical synthesis, not a claim that one manufacturer uses the other supplier grade."
      evidence: "source conditions and actual foreground evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "all inventory rows"
    rule: "Reject hard/uncured/thermoplastic or other-base tubing, reinforced/multilayer/assembled fitting products and mere finished-hose assembly as this reference. Confirm the actual grade, layer and net delivered coil configuration; broader native UUID does not expand applicability."
    source_ids:
      - wacker-silicone-processing
      - reiss-silicone-extrusion
      - advantapure-apst-coils
  - rule_id: validate_reference
    applies_to: "all inventory rows"
    rule: "Reference link product selects the unique actual terminal Product output, agreeing with its UUID in both languages. Returns and saleable off-grade tubing retain their real shared UUID and distinct physical roles; neither is hidden or added to Q. Verify net measured mass/length conversion, positive Q, separate release P, matched stock/burden carryover and one report_once."
    source_ids:
      - reiss-silicone-extrusion
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Reconcile complete physical, formulation/water and packaging ledgers independently of attributed LCA numerators; include every real Product/utility return/packaging exit, waste and measured species. Preserve real failed/zero-output/rework/storage/handling burdens and distinguish internal transfers. No COD, secondary property factor or closure residual establishes unknown density, species or reaction water."
    source_ids:
      - wacker-silicone-processing
  - rule_id: validate_allocation
    applies_to: "all inventory rows"
