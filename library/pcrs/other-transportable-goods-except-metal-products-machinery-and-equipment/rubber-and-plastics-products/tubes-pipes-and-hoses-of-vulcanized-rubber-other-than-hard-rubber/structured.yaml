published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Use as an upstream manufacturing-and-dispatch dataset for the exact declared bare silicone coil supply configuration after foreground completion and review"
  allowed_use: "Mass-based supply with declared grade, dimensions, state, actual gate, applicable native identity and complete inventory; functional comparison only with independent performance/service evidence"
  excluded_use: "All-hose averages, fittings/assemblies, TPU, other elastomers, reinforcement, sterile/medical certification, lifetime predictions or default recipes/factors"
  required_metadata: "Every reference qualifier; protocol owners; un-divided raw inputs; distinct P and Q; WIP/FG and carried burdens; whole formulations and water; actual packaging/exits; site/provider and native limits"
  required_quality_disclosure: "Measurement, period completeness, uncertainty, actual not_applicable reasons, auxiliary UUID/provider gaps, native film classification debt and any unresolved stock/species relationship; methodology scientific review remains pending"
  update_trigger: "Changed base/catalyst, cure/heat route, layers, supplier, geometry, fitting/coil state, packaging, boundary gate, performance evidence, emission species or stock accounting"
data_sources:
  - id: "wacker-silicone-processing"
    type: "handbook"
    reference: "Wacker Chemie AG, Solid and Liquid Silicone Rubber — Material and Processing Guidelines, sections 1.3/1.4, 4.3, 5.2, 6.1, pp. 10,13,37,41,45-46,66. https://www.wacker.com/h/medias/6709-EN.pdf"
    used_for: "Industrial addition-cure chemistry, whole compound/catalyst route, extrusion/atmospheric thermal cure and conditional post-cure. Technical examples, not a universal formulation, process setting, performance/life, activity value or LCA allocation rule."
  - id: "reiss-silicone-extrusion"
    type: "literature"
    reference: "Reiss Manufacturing, Silicone Rubber Extrusions, capability and FAQ page. https://reissmfg.com/extrusion/"
    used_for: "Independent industrial VMQ solid/platinum extrusion, actual tubing and cut/coil/spool/package capabilities. Use only the unreinforced bare-coil solid subset; source does not identify a Wacker recipe, fixed layer/SKU, acceptance limit or lifetime."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook — General guide for Life Cycle Assessment — Detailed guidance, first edition March 2010, complete 7.9.2/7.9.3, printed pp. 255-272 (PDF 275-292). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional decision context, subdivision/virtual subdivision, exchange-specific determining physical causality, only residual same-process-exit-condition market values, consistency and 100 percent rule. No fixed economic shares, avoided credits or full PEF claim."
  - id: "advantapure-apst-coils"
    type: "handbook"
    reference: "NewAge Industries AdvantaPure, AdvantaSil APST Unreinforced Tubing technical sheet, 2/3/21, pp. 1-3. https://www.advantapure.com/wp-content/uploads/2022/03/AdvantaSil_APST_Silicone_Tubing-1.pdf"
    used_for: "Real unreinforced platinum-cured single-wall coil supply, geometry and packaging endpoint, distinguished from spools and fitting assemblies. Structure/supply evidence only, not a WACKER recipe, Reiss production, universal pressure/temperature/life or certification; verify bag polymer separately and retain actual controlled-room loads."
