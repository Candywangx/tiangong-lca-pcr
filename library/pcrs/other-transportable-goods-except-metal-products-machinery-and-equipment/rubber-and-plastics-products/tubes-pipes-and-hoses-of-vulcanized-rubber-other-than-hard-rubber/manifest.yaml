  semantic_boundary_decision: "Retain and narrow this unpublished scaffold to unreinforced single-layer solid VMQ platinum addition cured tubing supplied as bare loose coils. Complete material manufacturing begins from whole commercial base and catalyst formulations; not finished-hose connector assembly. Independent source synthesis does not claim one manufacturer uses another supplier grade. No material same-boundary record found in seed; same-round tyre/inner-tube/reclaim/belt scopes remain distinct. Shared mappings/indexes/ADR/runtime untouched."
  terminal_gate: "Actual net accepted dispatched tubing mass Q, not new quality-release production P. Independently reconcile WIP/FG opening/closing and all carried burdens, warehouse/packing/dispatch and returns; no P=Q assumption."
  reference_identity_limitations: "Native reference: manufactured finished vulcanized rubber tubes/pipes/hoses excluding hard rubber, production mix at plant, Product flow, Mass/kg; no CAS, additional property, fixed base rubber, geography/locationOfSupply, layer structure, fitting state, specification or lifetime is supplied. The dataset must narrow that broad identity to single-layer solid VMQ, platinum addition cure, unreinforced, unprinted bare loose coils without fittings or reel, actual grade/geometry and the net dispatch gate. It is not a background process or evidence that every rubber hose is equivalent."
  native_metadata_debt: "Native identity is PE film, CAS 9002-88-4, production mix at plant; geography/locationOfSupply and grade are unspecified. Its leather/luggage classification is inconsistent metadata debt; the comment mentions PET as a competing material, not PE composition. This identity supplies no bag thickness, recycled content, supplier background or quantity."
