system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "bag_line"
      rule: "Include all section1 operations to the newly accepted formed bag, with actual outsourced operations/backgrounds. Winding alone or packing purchased bags is insufficient. Retain stage/cohort records for this integrated process."
      source_ids:
        - hmel-blown-film-2022
        - yongfong-bag-process
    - rule_id: boundary_actual
      applies_to: "all inventory rows"
      rule: "Cards are specific collection exchanges, not a universal recipe. Evidence actual absence before not_applicable; no UUID/meter gap is zero. Add each actual unlisted preparation, chemical, material, fuel, refrigerant, utility, packaging, waste, species and destination as its own atomic row before quantitative completeness. Changed product/route needs applicability review."
      source_ids:
        - hmel-blown-film-2022
        - lyb-lupolen-2420k-2026
    - rule_id: boundary_release
      applies_to: "released_bag"
      rule: "Q is newly first-released net production with linked actual release reversals corrected. Closing released FG is already in Q, never added again or subtracted as WIP. Keep opening/closing WIP quantity/composition/stage and complete inherited per-exchange-unit vectors; consume opening-WIP burdens and carry closing-WIP vectors forward. Preserve all zero-output, startup/shutdown, idle, failed, cleanup and rework activity."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_service
      applies_to: "bag_line"
      rule: "Keep actual post-release packing/warehouse/handling/dispatch in separate cohort-linked service accounts including old FG and returns. Old-cohort service is not divided by new-period Q. Carry current-cohort undelivered obligations/burdens explicitly and disclose unobserved future service as unmeasured, not zero. At consolidated physical gates cancel internal Q/rework handoffs and use actual external dispatch/stocks/losses. Reinspection/reshipment never creates new Q."
      source_ids:
        - ilcd-allocation-2010
boundary_abstraction:
  declared_starting_condition: "Received virgin LDPE pellets and every actual whole preparation; all film/bag manufacture remains foreground."
  starting_condition_role: "foreground collection boundary"
  product_classification_scope: "Only section1 film-bag subset of CPC3.0 36410."
  recursive_input_rule: "Bought finished film/bags require separate input identification and changed-boundary review; they do not substitute this manufacture. Internal refeed cancels with retained burdens; returns retain original history."
  upstream_dataset_requirement: "Link actual grade/composition/form/location-compatible resin, preparation, utility and packaging backgrounds. UUID identity is not a provider inventory; upstream burdens remain required."
  disclosure: "Site/period/supply origins; whole formulations; stage meters; actual cooling/inflation/winding/sealing; WIP/FG/returns; all failures/rework/idle/cleanup; release manufacture versus observed supply-service supplement."
