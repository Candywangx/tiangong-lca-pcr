allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Apply to multifunctional processes only in the stated attributional context, distinct from multifunctional-product QFD. Actual full physical ledgers precede burden shares."
    source_ids: []
  - rule_id: alloc_context
    applies_to: "bag_line"
    rule: "Only an explicitly attributional study where partitioning is warranted under its declared goal/situation. Industrial guides support process facts, not LCA allocation. No free allocation/substitution choice or full ILCD/PEF conformity claim. Consequential or multifunctional-product comparison needs separate method review."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: alloc_subdivide
    applies_to: "all inventory rows"
    rule: "First assign exclusive materials/meters/activities/cohort services; subdivide separable operations and then justified virtual subdivision from real technical relationships. Separate new production from old-FG service and attribute failed/rework/idle activity by cause. Explain remaining inseparability and distortion when feasible subdivision was not performed."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: alloc_physical
    applies_to: "all inventory rows"
    rule: "For each remaining shared exchange identify/quantify determining physical causality to each real co-function separately: embodied resin, measured incremental drive/heating response or justified parallel-service occupancy can differ. Mass/throughput/time/energy are not interchangeable default keys; correlation/common polymer name does not establish determining causality. Preserve loss-causing activity."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: alloc_residual
    applies_to: "all inventory rows"
    rule: "Only genuine remaining burdens lacking a determinable physical relation use contemporaneous market value of actual coproducts at the same shared process exit and actual condition/amount. Record moisture/contamination/quality, price/currency/time and separation point. Derive untraded intermediate value by justified correction of later processing/packing/transport, not a clean final-product price. Apply shares only to that residual vector, never full physical outputs; no fixed share/automatic credit."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: alloc_scrap
    applies_to: "sale_regrind"
    rule: "Internal refeed retains all original burdens and actual grinding/remelt energy/losses and cancels on consolidation; not new purchase or bag production. Treatment-bound scrap keeps explicit waste treatment. Real saleable secondary output requires its actual state/specification and the hierarchy; negative-price waste is not forced into positive coproduct shares. No virgin-displacement/recycling or hypothetical future reuse credit here."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: alloc_closure
    applies_to: "all inventory rows"
    rule: "For each shared exchange, the sum of inventories attributed to all real co-functions must equal the unallocated inventory. Verify residual shares sum to one without prescribing their values; preserve system-wide consistency for comparable exchanges and disclose justified differences and uncertainty. Physical flows remain full unscaled records."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "bag_line"
      flow_role: "released_bag"
      record_type: "weighing_release"
      raw_fields: "SKU; lot; dimensions/gauge; LDPE/additive state; seal/defect/load tests; acceptance spec; release/reversal id/time; gross/tare/net; count and measured same-SKU bag mass; calibration; Q"
      collection_method: "Calibrated net weighing excluding removable packaging and unique first-release register after cut/seal/QC. Count records need actual same-construction sample mass/uncertainty. Preserve raw masses/reversals before Q aggregation; reinspection/dispatch is not release."
      unit: "kg"
      frequency: "each release/reversal"
      temporal_coverage: "Complete matched period including failed/Q=0 intervals"
      site_scope: "Release gate and linked stock cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scales/tare; acceptance tests; release register; duplicate audit"
    - protocol_id: cp_material
      process_id: "bag_line"
      flow_role: "ldpe; slip_mb; antiblock_mb; purge; ipa_cleaner; hydraulic_oil; screen; sealer_tape"
      record_type: "raw_stock"
      raw_fields: "Each whole article/formulation; supplier/grade/COA; original mass/unit; opening/receipts/issues/returns/closing; composition/assay/moisture; lot/time/stage; actual site mixing/loss; received supply form/packaging and actual moisture-conditioning need"
      collection_method: "Reconcile calibrated whole-material weights and supplier receipts against stock. Collect stock-adjusted actual consumption before attribution; carrier/active/assay subledgers do not duplicate procurement."
      unit: "kg"
      frequency: "each lot/issue/return and count"
      temporal_coverage: "Complete same period and opening history"
      site_scope: "All included material stores/stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "BOM; invoices/COA; weights; stock closure"
    - protocol_id: cp_energy
      process_id: "bag_line"
      flow_role: "electricity"
      record_type: "meter_states"
      raw_fields: "Meter start/end/unit; interval; supply/voltage/provider; asset/stage; run/start/stop/idle/failed/rework/cleanup time; kWh; chiller/compressor; manufacture/service cohort"
      collection_method: "Read meters and reconcile invoices/submeters. Integrate genuine power rates over matched logged time once. Preserve operating states and separate manufacture/service attribution. Actual generator/fuel/heat requires its atomic additions and applicability review."
      unit: "kWh"
      frequency: "each interval/state change"
      temporal_coverage: "Full period with zero-output activity"
      site_scope: "Line/utilities with later service separate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters; bills; state logs; attribution evidence"
    - protocol_id: cp_water
      process_id: "bag_line"
      flow_role: "water; cooling_water_in; cooling_water_return; wastewater"
      record_type: "water_thermal_interface"
      raw_fields: "Water identity/interface; original mass/integrated volume; true rate/time; independent density/temperature/pressure; supply/return enthalpy; circulating stock; makeup/evaporation/leaks/formulation water; effluent assay; supplier convention"
      collection_method: "Use mass meters or actual integrated volumes with independent state-specific substance density. Separate fresh supply/external return/internal circulation and each real interface. No assumed steam/reaction water or water density for every solution."
      unit: "kg"
      frequency: "each matched supply/outlet interval"
      temporal_coverage: "Same period and interface"
      site_scope: "Actual cooling/cleaning and effluent outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters; density/assay; temperatures; supply contract; closure"
    - protocol_id: cp_pack
      process_id: "bag_line"
      flow_role: "core; returned_core; carton; label; tape; pallet; out_carton; out_label; out_tape; out_pallet; waste_core; waste_carton; waste_label_liner; waste_tape_core; waste_pallet"
      record_type: "article_custody"
      raw_fields: "Each article/component; tare/composition; opening/closing empty or WIP/FG-attached or reusable stock; external purchase/return receipts; gross physical shipments; external owner returns; waste; internal reuse; cohort/time/destination"
      collection_method: "Weigh whole supplied articles and component subledgers; reconcile each identity across purchase/attachment/custody/return/reuse/waste. Count conversion needs actual article tare. Track packaging on all gross physical shipments including old/returned cohorts, not just net Q."
      unit: "kg"
      frequency: "each packing/custody event and stock count"
      temporal_coverage: "Production and later services matched separately"
      site_scope: "All empty/attached/reusable packaging stocks"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare tests; packing BOM; stock/return/waste receipts"
    - protocol_id: cp_waste
      process_id: "bag_line"
      flow_role: "sale_regrind; waste_ldpe; waste_purge; spent_ipa; waste_oil; waste_screen; waste_sealer_tape"
      record_type: "outlet_composition"
      raw_fields: "Each actual product/waste identity; original mass/unit; composition/moisture/contamination; stock; lot/time; receiver/destination; sale specification if actual; rework/return origin"
      collection_method: "Weigh independent outlets and reconcile manifests/stock/receipts. Keep full physical amounts before allocation. Captured species/waste-article constituents are not duplicate outputs. Residuals are not automatically VOC/water/coproduct."
      unit: "kg"
      frequency: "each outlet transfer and count"
      temporal_coverage: "All normal/failed/rework/cleanup periods"
      site_scope: "Each real waste/product interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tickets; assay; receiver/treatment receipts; actual product spec"
    - protocol_id: cp_air
      process_id: "bag_line"
      flow_role: "pe_air; water_air; ipa_air; formaldehyde_air; acetaldehyde_air; ethylene_air; co_air; co2_air"
      record_type: "species_compartment"
      raw_fields: "Species/CAS; stack/fugitive compartment; concentration/wet-dry basis; temperature/pressure; integrated volume or true rate/time; background; capture/recovery; detection/uncertainty; species raw mass; state"
      collection_method: "Use representative actual species measurements and compatible volume/concentration states. Concentration times already-integrated volume once; integrate true flow rate only. General degradation/odour warnings identify no species/factor/amount; nondetection remains bounded by actual detection limits."
      unit: "kg"
      frequency: "each representative state/outlet"
      temporal_coverage: "Full period with justified sampling coverage"
      site_scope: "Actual stacks/fugitives/captured outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling/speciation; volume state; detection/uncertainty"
    - protocol_id: cp_cohort
      process_id: "bag_line"
      flow_role: "all inventory rows"
      record_type: "WIP_FG_history"
      raw_fields: "Opening/closing raw/WIP/FG quantity/composition/stage/cohort; complete inherited exchange vectors with original units; internal refeed; release/reversal; gross dispatch D; return linked to original shipment/reversal; actual incremental rework; loss; service meters/custody"
      collection_method: "Reconcile physical movements and each inherited exchange vector separately; never replace inventory with a scalar impact score. FG retains manufacturing history through service/returns without remaking production. Attribute actual incremental work once to original cohort; missing history is incomplete quantitative data."
      unit: "native units by exchange"
      frequency: "each cohort movement and period close"
      temporal_coverage: "Matched current/historical cutoffs"
      site_scope: "Manufacture and separate FG/service ledgers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Movement records; historical vectors; linked reversals; service meters"
    - protocol_id: cp_allocation
      process_id: "bag_line"
      flow_role: "all inventory rows"
      record_type: "exchange_attribution"
      raw_fields: "Exclusive activities; subdivision; measured shared-exchange response; actual co-functions/amount/state; common exit; residual vector; contemporaneous price/currency; post-gate corrections; shares/sensitivity"
      collection_method: "Apply section7 per exchange; keep physical ledgers intact and show each raw numerator attribution. Justify remaining inseparability after exclusive/virtual subdivision and determining physical causality before residual market values."
      unit: "native units and currency"
      frequency: "each shared-process/co-function change"
      temporal_coverage: "Same cohort and contemporaneous market period"
      site_scope: "Actual common exit before later conditioning/services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Technical response; meter/price contracts; state corrections; sensitivity"
  calculation_rules:
    - id: release_q
      applies_to: "released_bag"
      rule: "Q = sum of eligible new first-quality-released net bag masses after linked actual release reversals. Count records first multiply verified count by measured same-SKU accepted mean bag mass; no assumed single-bag kg/density. Dispatch, reinspection and closing FG do not add production."
      inputs:
        - cp_release
      output: "Q"
      source_ids:
        - yongfong-bag-process
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert actual raw observations to each exchange numerator unit before attribution: stock-adjusted material weights; kWh meter differences; concentration times compatible integrated gas volume; integrate only genuine rates; use independently measured substance-state density for volume-to-mass. Separate each physical identity/outlet. No Q division here."
      inputs:
        - cp_material
        - cp_energy
        - cp_water
        - cp_pack
        - cp_waste
        - cp_air
      output: "converted raw exchange amounts"
      source_ids:
        - hmel-blown-film-2022
    - id: manufacturing_vectors
      applies_to: "all inventory rows"
      rule: "Construct undivided cohort numerator A_i from actual attributable period exchanges plus complete inherited burdens of consumed opening WIP minus the corresponding complete vector carried by closing WIP. Correct raw stock changes; cancel internal refeed/handoffs; preserve failures/start-stop/idle/cleanup/rework; apply section7 to shared burdens. Released FG is not subtracted as WIP. Each vector is per exchange in its original unit, not a scalar impact. Prior-released returned FG retains old manufacture separately and receives only actual incremental work once."
      inputs:
        - cp_cohort
        - cp_release
        - cp_material
        - cp_energy
        - cp_water
        - cp_allocation
      output: "A_i"
      source_ids:
        - ilcd-allocation-2010
    - id: physical_gates
      applies_to: "raw physical ledgers"
      rule: "Manufacturing: opening raw/WIP + external inputs + separately identified returned material = closing raw/WIP + new Q + all actual other product/waste/emission outputs + segregated prior-released rework transfers; cancel internal refeed. FG: opening FG + internal Q receipt + actual customer returns = actual gross dispatch D + closing FG + actual FG loss/waste + transfers to rework. Consolidation cancels internal Q/rework and substitutes actual external dispatch/stocks/losses, never Q + closing FG + D. Reconcile full physical masses/relevant elements independently of burden allocation. Include actual carrier-air intake/outlet consistently in a full air balance, subtracting background for net emissions. Do not solve two unknown losses/species from one residual."
      inputs:
        - cp_cohort
        - cp_release
        - cp_material
        - cp_pack
        - cp_waste
        - cp_water
        - cp_air
      output: "reconciled physical gates"
      source_ids:
        - ilcd-allocation-2010
    - id: water_species
      applies_to: "raw physical ledgers"
      rule: "Keep total physical mass/carbon/other relevant elements independent from measured species/water evidence. Ordinary LDPE melt/solidification is physical, not an assumed water-producing cure/polymerisation. Separate formulation water, free-water phase change, independently proved reaction water and actual bound/structural water. No reaction/bound water from a wet-dry residual. COD/VOC remain indicators without independently evidenced chemical conversion."
      inputs:
        - cp_water
        - cp_air
        - cp_material
        - cp_waste
      output: "separate element and species/water evidence"
      source_ids:
        - lyb-lupolen-2420k-2026
    - id: packaging_balance
      applies_to: "each packaging identity"
      rule: "For each article/component separately: opening empty + opening attached WIP/FG + opening reusable + external purchase + external return received = closing empty + closing attached WIP/FG + closing reusable + with gross physical shipments outward + external owner return + waste. Components reconcile with whole supplied articles. Distinguish shipment versus external-return destinations without counting one movement twice. Internal attachment/reuse cancels; no net Q, repeated purchase or automatic coproduct."
      inputs:
        - cp_pack
        - cp_cohort
      output: "independent balanced packaging ledgers"
      source_ids:
        - ilcd-allocation-2010
    - id: service_vectors
      applies_to: "post-release services"
      rule: "Build separate raw service numerators by actual released cohort for packing/warehouse/handling/dispatch; retain complete inherited FG history. Reverse linked earlier service/dispatch only when the real transaction reverses. Reinspection/reshipment does not recreate production. Incremental return/rework service is attributed once; old-cohort activity is not divided by new current Q. For current-release Q>0 pass its matched service numerator through the same sole reporting operation as a distinct supplement. Future unobserved services are unmeasured scope, not zero."
      inputs:
        - cp_cohort
        - cp_pack
        - cp_energy
        - cp_allocation
      output: "matched service A_i and disclosed service scope"
      source_ids:
        - ilcd-allocation-2010
    - id: report_once
      applies_to: "all non-reference exchanges"
      rule: "x_i = A_i / Q; A_i is the complete attributed raw cohort numerator in the individual row unit; Q is matched newly first-quality-released net bag mass in kg. Divide once only after unit conversion, stock/vector reconciliation and justified allocation. Reference output is1kg. Manufacturing and separately disclosed matched service vectors use this same operation without renormalizing; protocols/cards/basis labels only refer to it. Q=0 keeps loads and yields no unit result."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "x_i"
      source_ids:
        - ilcd-allocation-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify actual whole product/formulation/form/route/location/provider and property compatibility; broad UUID supplies no quantity or supplier inventory. Preserve native restrictions."
      evidence: "COA/BOM; actual supplier and identity evidence"
    - id: dq_coverage
      applies_to: "bag_line"
      requirement: "Representative complete period includes failure/Q=0/start-stop/idle/cleanup/rework and outsourced operations. Missing meters/species/history are gaps, not absence."
      evidence: "Stage/state logs and completeness register"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Keep calibration/tare/sampling/detection/uncertainty and independent density/unit evidence. No bag kg, evaporation, species, yield or energy factor inferred from geometry/smell/residual."
      evidence: "Raw meter and lab reports"
    - id: dq_history
      applies_to: "bag_line"
      requirement: "Carry full WIP/FG per-exchange vectors and linked release/dispatch/return reversals. Separate incremental work from old manufacture and release-gate result from observed-service supplement/cutoff."
      evidence: "Cohort stock vectors and custody records"
    - id: dq_method
      applies_to: "all inventory rows"
      requirement: "Disclose allocation hierarchy/residual value evidence and source limits; no fixed physical/economic preference, credits or route equivalence. Actual site data/provider matching precedes quantitative completeness."
      evidence: "Technical response; residual price/state evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "bag_line"
    rule: "Verify every section1 restriction and section3 qualifier against actual BOM/supply/stage/acceptance evidence. Similar class/name does not cover woven/paper sacks, raw film, other polymer or packing purchased bags."
    source_ids:
      - un-cpc3-notes-2025
      - hmel-blown-film-2022
      - yongfong-bag-process
  - rule_id: validate_reference
    applies_to: "released_bag"
    rule: "Confirm one unique finished Product output via reference_flow_link, exact bag identity and Mass/kg. Q is new first-release net mass excluding packaging/duplicates/dispatch counts/added closing FG. Unsupported measurement or Q=0 yields no passing unit result."
    source_ids:
      - yongfong-bag-process
  - rule_id: validate_physical
    applies_to: "bag_line"
    rule: "Audit manufacture/FG/consolidated physical gates, material/relevant-element balances, actual species/water evidence, every packaging whole/component ledger and full unscaled product/waste outlets before burden allocation. Investigate residuals with uncertainty; no invented second unknown, reaction water or specific VOC."
    source_ids:
      - lyb-lupolen-2420k-2026
      - ilcd-allocation-2010
  - rule_id: validate_vectors
    applies_to: "all inventory rows"
    rule: "Verify raw conversion precedes stock/vector reconciliation and exchange-specific allocation. Each reported manufacturing/matched service numerator divides by same-cohort Q once. Old returns/history/incremental rework stay separate; internal handoffs cancel and zero-output burdens persist."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Before quantitative use verify every actual flow, occurrence/absence, species/destination, identity/provider restriction and protocol/allocation evidence. Unresolved auxiliary UUID is identity work, not an invented binding or removed burden. Missing required evidence withholds a complete quantitative result; engineering checks do not approve science/translation/mapping/publication."
    source_ids:
      - hmel-blown-film-2022
      - ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared LDPE-bag manufacturing supply chain; observed post-release service is a distinct cohort-bound supplement."
  allowed_use: "Compatible construction/route/period/provider; link upstream and actual treatment once only."
  excluded_use: "No entire-CPC coverage, resin/film substitution, bag-capacity equivalence, food/medical certification, consequential credit or unobserved future-service zero."
  required_metadata: "All section3 qualifiers; raw/converted units; Q gate; stage/stock boundary; actual background/provider compatibility; manufacture and separate service period/cohorts."
  required_quality_disclosure: "Calibration/sampling/uncertainty; WIP/FG history; failure/returns; unresolved provider/species; allocation/residual price; source limits and unmeasured service scope."
  update_trigger: "Change of resin/whole preparation, structure/geometry/seal/performance, route/cooling/utilities/provider, recycling/allocation evidence, Q gate or service coverage."
data_sources:
  - id: "hmel-blown-film-2022"
    type: "handbook"
    reference: "HMEL, Technical Guide to Blown Film Process & Polysure Products, February2022, pp.3-10/13-15. https://www.hmel.in/wp-content/uploads/2025/08/technical_guide_to_blown_film_process__polysure_products-Final.pdf"
    used_for: "General PE pellet plastication/annular extrusion/air cooling/orientation/collapse/winding, optional masterbatches, failure and different-polymer/multilayer context. Offered LLDPE/HDPE tables are not this LDPE grade limits, site quantities, emissions or LCA allocation."
  - id: "yongfong-bag-process"
    type: "extension_guidance"
    reference: "Yong Fong Packaging Sdn. Bhd., Manufacturing process, undated primary page. https://yongfongpkg.com/Process.php"
    used_for: "PE-bag extrusion, heat-sealed bottom/conversion and raw-receipt-through-outgoing QC. Broader polymers/printing/design capabilities are context, not this plain route. Embedded printing illustration is not an entire line flowchart. No common SKU/factory recipe/amount or allocation claim."
  - id: "lyb-lupolen-2420k-2026"
    type: "handbook"
    reference: "LyondellBasell, Lupolen2420K Technical Data Sheet,10/15/2026, complete3-page edition. https://productsafety.lyondellbasell.com/DirectRequest?ProductGuid=79326e74-b73c-4977-9f56-b9e12367c004&ResponseTypeGuid=f1e32c20-d810-4db0-b25e-8e23a59f3733"
    used_for: "Actual non-additivated LDPE pellet/film-grade example and heat-seal suitability; typical/test limitations, degradation/fines/storage warnings. Medical/pharmaceutical intent excluded. No required grade, universal density/settings, identified species factor or proof of bag maker using this supplier."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA — Detailed guidance, first edition March2010, sections7.9.2/7.9.3, printedpp.255-272/PDF275-292 complete context. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional multifunctional-process hierarchy: exclusive/virtual subdivision, exchange-specific determining physical causality, then genuine residual market value in actual common-exit state/time. QFD multifunctional-product example is distinct. Not a recipe/fixed share/recycling credit/full conformity claim. Stock and once-only reporting rules are explicit PCR operational requirements for the foreground protocols."
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0 Explanatory Notes,30June2025, pp.126/147/177-178 and same-edition original repository structure CSV. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Original hierarchy/titles for plastic bags36410 and adjacent textile packing27150/paper bags32152/raw film36330/other packing36490. No extra36410 explanatory note; classification neither specifies this narrow LDPE method nor accepts a mapping."
