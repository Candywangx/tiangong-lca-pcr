system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "manufacture"
      rule: "Collect every actual operation from complete pellet receipt to newly released bowl, including actual drying when moisture/condensation requires it, feed transfer, electric heating/screw/clamp/robot loads, cooling and trim/grind/inspection. The guide's normal no-predrying statement does not override a wet-material record. No steam, boiler, fuel, mould release, wash system or abatement plant is presumed; actual installed equipment and real flows must be added individually."
      source_ids:
        - ineos-pp-processing-2007
        - ifc-plastic-products-2007
    - rule_id: boundary_feed
      applies_to: "pp_feed"
      rule: "A complete purchased PP pellet formulation crosses the boundary once. Include its actual pigment/stabiliser carrier within that supply; do not purchase ingredients again. Actual separate colour preparation changes the declared route and requires every separately purchased preparation and its mixing energy/losses. Internal regrind retains its own original per-exchange burden vector and heat history; it is not virgin feed, an additional purchase or a credit."
      source_ids:
        - ineos-pp-processing-2007
    - rule_id: boundary_gates
      applies_to: "all processes"
      rule: "Manufacturing Q is first release, not net dispatch. Keep WIP at both ends with quantity/state/configuration and inherited burden vector for every exchange. Same-cohort closing FG is part of Q, never an additional manufacturing output. Supply services retain opening/closing FG, gross physical dispatch, external returns, reshipment, rejects and losses separately; reinspection creates no Q and incremental rework belongs once to its original cohort."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_species
      applies_to: "manufacture"
      rule: "Screen each actual gas/liquid/solid species and destination. IFC Table4 is potential high-temperature evidence, not proof of n-butane, formaldehyde or any rate. Do not turn VOC/COD/TOC into a specific chemical mass; retain uncharacterised indicators as indicators and the real species uncertainty as a hold for a quantitative package. Add all actually identified species as separate cards."
      source_ids:
        - ifc-plastic-products-2007
    - rule_id: boundary_utilities
      applies_to: "all processes"
      rule: "Bind electricity only at the declared CN1–35kV grid-average consumer gate; branch measurements reconcile to imported electricity including real transformer, motor, compressor, chiller and distribution losses. Other geography/voltage/supply needs another verified identity/provider. Onsite compressed-air/cooling generation is counted through actual equipment energy/water, not again as purchased service. For actual external heat-exchange water, record gross received/returned mass, temperatures/pressures/enthalpies and supplier water/energy convention; cancel internal recirculation and do not also charge the same parcel as makeup."
      source_ids:
        - ifc-plastic-products-2007
    - rule_id: boundary_packaging
      applies_to: "supply_services"
      rule: "For each single packaging supply maintain opening empty plus packaging attached to WIP/FG plus reusable stock + external acquisitions + external returns received = closing equivalents + packaging with gross physical shipments + external returns sent + waste. Cancel internal reuse. Packaging is separate from bare bowl Q; do not count reuse as another purchase or automatic coproduct. Associated inlet resin sacks follow the same ledger and supplier-boundary check."
      source_ids:
        - ilcd-general-2010
    - rule_id: boundary_recursive
      applies_to: "all processes"
      rule: "Do not recursively model a bowl as the raw material of itself. A purchased finished bowl is an upstream product with inherited burdens and lies outside this pellet-conversion reference route. Qualified rework/returns keep original identity and stock/burden links. Upstream resin, utility and packaging providers must match their actual boundary and formulation; avoid missing or duplicated packaging, transport and utility production."
      source_ids:
        - ilcd-general-2010
