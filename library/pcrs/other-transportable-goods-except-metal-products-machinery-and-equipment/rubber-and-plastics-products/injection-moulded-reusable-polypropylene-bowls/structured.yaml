allocation_rules:
  - rule_id: allocation_scope
    applies_to: "all processes"
    rule: "Use this hierarchy only for an attributional inventory requiring allocation. First identify actual functions and dedicated operations; subdivide or virtually subdivide their measured inputs and outputs. Product-specific PP and rejected runs remain with the corresponding original bowl cohort."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_causality
    applies_to: "shared exchanges"
    rule: "For each remaining exchange determine which physical relationship controls its amount. Use measured machine cycle/load only when causal for that electrical load; storage may require occupied volume/area and duration, while transport may be mass- or volume-limited. Document tests and sensitivity. No blanket mass, time, physical/economic choice or fixed share across all exchanges."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_residual
    applies_to: "genuinely residual multifunctional process"
    rule: "Only demonstrably unresolved residual multifunctional-process burdens may use contemporaneous quantities times market value at the same common-process exit gate and actual supplied condition. Remove downstream conditioning, packaging, transport and trading value. Retain evidence, excluded alternatives and sensitivity. Non-positive/unknown prices or missing causal data are explicit review issues, not automatic economic allocation."
    source_ids:
      - ilcd-general-2010
  - rule_id: allocation_scrap
    applies_to: "internal recovery and exported rejects"
    rule: "Internal recovery carries burdens and cancels within the physical gate. Determine actual waste/service/product status of each export and required treatment; sale alone gives no avoided-virgin credit. Never use allocated quantities to close physical balances. Any exported recovered-material or end-of-life method requires separate justified boundary review."
    source_ids:
      - ilcd-general-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "Whole pellet supplies and raw-material/WIP genealogy"
      record_type: "raw foreground record"
      raw_fields: "receipt ID; lot; complete formulation; supplier net mass; opening/closing raw stock; withdrawal; external returns; WIP mass/state; inherited exchange vector; internal regrind origin and heat passes"
      collection_method: "Weigh with calibrated scales; reconcile receipts to withdrawals and residual stock by material and configuration. Preserve raw amounts and imported historical vectors before any division. Retain actual colour/additive composition as nested subledgers."
      unit: "kg"
      frequency: "Each receipt/withdrawal and shift close"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; supplier specification; lot genealogy; inventory counts"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "Actual manufacturing electricity"
      record_type: "raw foreground record"
      raw_fields: "meter ID; raw opening/closing kWh or MJ; timestamp; voltage; geography; branch loads; actual transformer/distribution losses; cycle/load traces; idle/start/stop time; cohort assignment"
      collection_method: "Read main and branch meters, reconcile the plant import gate and equipment events; retain raw energy units. Separate production and supply-service loads and test any shared-load driver before allocation."
      unit: "kWh or MJ"
      frequency: "Continuous meters with shift and campaign reconciliation"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; bills; gate diagram; time series and loss reconciliation"
    - protocol_id: cp_service_energy
      process_id: "supply_services"
      flow_role: "Actual supply-service electricity"
      record_type: "raw foreground record"
      raw_fields: "meter ID; raw opening/closing kWh or MJ; timestamp; voltage; geography; branch loads; actual transformer/distribution losses; cycle/load traces; idle/start/stop time; cohort assignment"
      collection_method: "Read main and branch meters, reconcile the plant import gate and equipment events; retain raw energy units. Separate production and supply-service loads and test any shared-load driver before allocation."
      unit: "kWh or MJ"
      frequency: "Continuous meters with shift and campaign reconciliation"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; bills; gate diagram; time series and loss reconciliation"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "Separate water supplies and destinations"
      record_type: "raw foreground record"
      raw_fields: "source; supply agreement; raw inlet/outlet mass or integral volume; actual rate/time if rate measurement; measured density and temperature/pressure; opening/closing loop stock; gross received/returned heat water; enthalpy; bleed; evaporation; carryover; test evidence"
      collection_method: "Meter each physically distinct inlet/outlet and liquid stock; weigh or use independently measured density at actual state. Distinguish rates from already integrated volume and avoid treating gross circulation as consumption."
      unit: "kg; m3; MJ"
      frequency: "Continuous flows and each fill/cleaning event"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/balance calibration; density method; temperatures; supplier water/heat contract; uncertainty"
    - protocol_id: cp_aux
      process_id: "manufacture"
      flow_role: "Each complete auxiliary formulation or refrigerant"
      record_type: "raw foreground record"
      raw_fields: "exact formulation/chemical; batch; supplier assay; carrier water; raw receipt/withdrawal; opening/closing stock; equipment charge; spill; recovery; disposition; causality driver"
      collection_method: "Reconcile purchase and actual withdrawals with chemical-specific stock/charge and recovered/spent quantities. Weigh the whole supplied formulation; assay and carrier remain subcomposition. Document a real absence instead of assigning invented zero."
      unit: "kg"
      frequency: "Each delivery/use/service and period close"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier SDS/TDS; calibration; maintenance/charge logs; composition and disposal records"
    - protocol_id: cp_packaging
      process_id: "supply_services"
      flow_role: "Each single packaging article and full stock ledger"
      record_type: "raw foreground record"
      raw_fields: "material; complete supplied composition; empty tare; opening/closing empty/attached WIP/attached FG/reusable stocks; external acquisitions; external returns received; gross physical outward shipments; external returns sent; waste; internal reuse; ownership; historical burden"
      collection_method: "Weigh representative actual supplied packaging configurations and reconcile mass/count records by each material and destination; preserve tare/contents separately. Keep associated inbound packaging and actual acquisitions distinct; identify any supplier packaging burden already included."
      unit: "kg; count"
      frequency: "Each packing/return/waste event and stock boundary"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare samples; supplier composition; stock count; return/shipment and waste tickets"
    - protocol_id: cp_inlet_packaging
      process_id: "manufacture"
      flow_role: "Each single packaging article and full stock ledger"
      record_type: "raw foreground record"
      raw_fields: "material; complete supplied composition; empty tare; opening/closing empty/attached WIP/attached FG/reusable stocks; external acquisitions; external returns received; gross physical outward shipments; external returns sent; waste; internal reuse; ownership; historical burden"
      collection_method: "Weigh representative actual supplied packaging configurations and reconcile mass/count records by each material and destination; preserve tare/contents separately. Keep associated inbound packaging and actual acquisitions distinct; identify any supplier packaging burden already included."
      unit: "kg; count"
      frequency: "Each packing/return/waste event and stock boundary"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tare samples; supplier composition; stock count; return/shipment and waste tickets"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "Each waste stream before treatment"
      record_type: "raw foreground record"
      raw_fields: "stream identity; formulation; raw gross wet mass; water/solid content; adhered product; origin lot; treatment destination; original burden link; actual product/waste status"
      collection_method: "Weigh and characterise each separate actual stream; reconcile transfer tickets with stocks and capture records. Use nested composition to avoid counting gross wastewater plus the same water/solids twice."
      unit: "kg"
      frequency: "Each discharge/collection and period close"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated scales; lab methods; waste tickets; destination verification"
    - protocol_id: cp_emissions
      process_id: "manufacture"
      flow_role: "Each actual chemical species and medium"
      record_type: "raw foreground record"
      raw_fields: "exact species or analytical indicator; CAS where applicable; air compartment/particle size; sampling method; concentration and actual gas conditions; integrated volume or real rate/time; detection limit; uncertainty; recovery/charge balance; campaign context"
      collection_method: "Use matched flow and species-resolved measurements or an independently justified chemical-specific balance; distinguish analytical totals from species. Convert gas state consistently and integrate only rates. Non-detect and unmeasured are distinct; no default gas species is inferred from IFC."
      unit: "kg; original analytical units"
      frequency: "Representative actual operating states including start-up/upset"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Laboratory method; sampling train; raw time series; detection limit; independent balances"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "Unique new first release and net bowl mass"
      record_type: "raw foreground record"
      raw_fields: "configuration; batch/cohort; release ID; cooled accepted net mass; gross mass; detachable tare; accepted/rejected disposition; actual tests; prior-release flag; WIP status; timestamp"
      collection_method: "Weigh cooled accepted bare bowls with calibrated scales and traceable tare. Deduplicate first-release IDs against earlier FG/returns; retain all failures and rework history. Sum only unique newly accepted kg into Q; keep count checks as checks."
      unit: "kg"
      frequency: "Each first release and stock boundary"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; acceptance tests; release IDs; deduplication ledger"
    - protocol_id: cp_fg
      process_id: "supply_services"
      flow_role: "FG stock and actual physical delivery/returns"
      record_type: "raw foreground record"
      raw_fields: "cohort; original release; opening/closing FG mass; inherited exchange vectors; new Q transfer; gross physical dispatch; external returns received; original-dispatch reverse; reshipment; post-release waste; incremental rework; service interval"
      collection_method: "Reconcile warehouse weights, shipment/return documents and original cohort vectors. Isolate previous-cohort stock and services. Reinspection/re-dispatch does not create production; link actual incremental rework once to the original cohort."
      unit: "kg; original vector units"
      frequency: "Each movement and opening/closing census"
      temporal_coverage: "Complete declared campaign including zero-output and opening/closing stocks"
      site_scope: "Actual site and line/cohort; declared gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Inventory census; calibrated weights; shipment/return IDs; matched historical burden"
  calculation_rules:
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Convert raw observations to the row reference unit before attribution: energy_MJ = energy_kWh ×3.6; use a single integral volume as collected; for a real volume rate integrate over its actual measured time; mass = volume × independently measured substance density at the same state. Preserve raw observations and uncertainty."
      inputs:
        - raw_amount
        - raw_unit
        - measured_state
        - cp_energy
        - cp_service_energy
        - cp_water
        - cp_emissions
      output: "converted_raw"
      source_ids: []
    - id: calc_release
      applies_to: "first_release"
      rule: "Q = sum of unique newly first-released accepted net bowl kg in cp_release for the declared configuration/cohort. Prior-release returns/reinspection/reshipments are excluded from new production. Closing FG from the same first release is already within Q."
      inputs:
        - cp_release
        - configuration
        - cohort
      output: "Q"
      source_ids:
        - ikea-kalas-bowl
    - id: calc_attribution
      applies_to: "all inventory rows"
      rule: "A_i is the attributable unnormalised amount for row i: reconcile converted current observations with opening/closing WIP quantity and each inherited exchange vector; retain all actual failed/idle/cleanup/rework burdens; cancel internal transfers/regrind. Apply section7 separately to each shared exchange, record direct and residual shares and their sum. Preserve the unallocated physical ledger independently. Supply-service A_i contains actual incremental services for its matched cohort/interval; historical manufacturing burden is carried, not produced again."
      inputs:
        - converted_raw
        - opening_WIP_vectors
        - closing_WIP_vectors
        - internal_transfers
        - actual_rework
        - allocation_evidence
      output: "A_i"
      source_ids:
        - ilcd-general-2010
    - id: calc_reference
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q for Q>0, exactly once. A_i is the attributable raw amount from calc_attribution in the stated row unit; Q is new first-release kg from calc_release. x_i is the result per1kg reference flow; cards and collection aggregation only point to this same result and never divide it again. For Q=0 retain raw records and unresolved cohort assignment without a unit result."
      inputs:
        - A_i
        - Q
        - calc_attribution
        - calc_release
      output: "x_i"
      source_ids: []
    - id: calc_physical
      applies_to: "all processes"
      rule: "Before allocation close each unallocated physical gate. Manufacturing: opening WIP and in-process water/oil/refrigerant stocks + net withdrawals of each physical input = new Q + closing WIP and in-process stocks + each actual external output/loss; internal recovery cancels. FG: opening FG + new Q transfer + external returned bowls = closing FG + gross outward physical bowls + post-release waste/loss. Consolidation cancels internal new Q once. Include raw-material stocks separately; energy is not a mass term. Resolve discrepancies against uncertainty, never force residual to zero."
      inputs:
        - cp_material
        - cp_water
        - cp_waste
        - cp_emissions
        - cp_release
        - cp_fg
      output: "unallocated_gate_balances"
      source_ids: []
    - id: calc_packaging
      applies_to: "all packaging rows"
      rule: "Apply boundary_packaging to each material separately using kg and verified counts/tare. Preserve gross physical outward/return movements and attached opening/closing WIP/FG. Internal reuse cancels; associate historical burdens with actual service cohorts. Only actual new acquisitions enter purchase burden; never add packaging to Q."
      inputs:
        - cp_packaging
        - cp_inlet_packaging
        - packaging_ownership
        - historical_packaging_vectors
      output: "packaging_material_balances"
      source_ids: []
    - id: calc_species_elements
      applies_to: "manufacture"
      rule: "Maintain independent total physical mass and relevant C/H/O or actual additive-element balances across matching gates, using measured composition and all real water/chemical streams. Species/reaction evidence is separate from elemental totals. Do not fit two unknowns with one residual, infer a species from carbon closure, assume reaction/structural water, or equate COD/VOC to chemical mass."
      inputs:
        - cp_material
        - cp_aux
        - cp_water
        - cp_waste
        - cp_emissions
        - independent_composition
      output: "independent_mass_element_species_checks"
      source_ids:
        - ifc-plastic-products-2007
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify each whole preparation, flow type, chemical identity, native route/form/grade, all properties, geography/medium and provider gate before a quantitative package uses its UUID. A broad accepted display cannot prove supplier compatibility. Preserve exact native Chinese basename."
      evidence: "Complete native record; specification; provider boundary"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Demonstrate actual presence/absence for conditional rows. Add every actual missing chemical/formulation, utility, fuel, packaging component, waste and species/destination as a specific atomic row before inventory completion; no other/zero bundle or de minimis omission is authorised."
      evidence: "Process walkdown; BOM; maintenance; SDS; full movement/emission ledger"
    - id: dq_temporal
      applies_to: "all collection protocols"
      requirement: "Cover the full same declared campaign, site and configuration with opening/closing stocks, all failed/idle periods and supplier/utility agreements. Disclose sampling and temporal/geographic gaps and sensitivity; no source case becomes a universal range."
      evidence: "Calibrations; time series; stock census; site evidence"
    - id: dq_uncertainty
      applies_to: "all calculations"
      requirement: "Keep unmeasured distinct from zero/non-detect. Quantitative packages lacking a real denominator, core route, species support, WIP/FG historical burdens or defensible allocation remain incomplete/held; no schema/check result grants scientific or translation approval."
      evidence: "Gap ledger; uncertainty; sensitivity; independent review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "all processes"
    rule: "Check actual product and complete manufacturing route against every inclusion/exclusion and required qualifier. Household bowls are not sanitary fixtures or conveyance packaging; a common polymer does not make adjacent methods interchangeable."
    source_ids:
      - un-cpc3-2025
      - ineos-pp-processing-2007
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Exactly one first_release Product output is the reference_flow_link, with1kg declared basis in both languages. Verify raw records, calc_units, calc_attribution and the sole calc_reference division; Q=0 has no unit result. Check first-release deduplication and packaging exclusion."
    source_ids:
      - ikea-kalas-bowl
  - rule_id: validate_physical
    applies_to: "all processes"
    rule: "Reconcile manufacturing, FG and consolidated physical gates, each packaging material, raw stocks and WIP/FG per-exchange inherited vectors independently from allocated results. Keep external returned water actual thermal state and supplier convention. A fitted residual cannot establish two unknowns or a real species."
    source_ids:
      - ifc-plastic-products-2007
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Each selected flow is one specific physical/chemical exchange. Verify actual applicability and every adopted native limitation in its full description. Conditional species need independent speciation; non-detect is not an absent source, and an unresolved auxiliary UUID does not permit an aggregate binding."
    source_ids:
      - ifc-plastic-products-2007
  - rule_id: validate_allocation
    applies_to: "shared exchanges"
    rule: "Check the subdivision/virtual-subdivision record, exchange-specific determining causality and only genuine residual same-gate/state contemporaneous market value. Reject arbitrary physical/economic selection, fixed shares or automatic recycling credit."
    source_ids:
      - ilcd-general-2010
  - rule_id: validate_terminal
    applies_to: "first_release"
    rule: "Require actual drawing, material and food-contact/quality test evidence and article-specific use instructions at first release. Do not infer microwave capability, sterile status, lifetime or a single-bowl mass from generic PP guidance, retail packaging weight or a successful engineering check."
    source_ids:
      - ikea-kalas-bowl
      - ikea-kalas-care
  - rule_id: validate_completeness
    applies_to: "all processes"
    rule: "Report performed/skipped checks, missing real data and uncharacterised species separately from result status. No unavailable relationship may be claimed passed. Ordinary future supplier/auxiliary measurements are collection requirements; a real missing core terminal or methodological relationship is an explicit draft/hold."
    source_ids:
      - ilcd-general-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A completed evidence-backed1kg newly released bowl manufacturing inventory; separately identified actual supply-service supplement if available"
  allowed_use: "Model the declared complete PP bowl configuration and route with matching supplier/gate evidence; preserve uncertainty and actual service interval"
  excluded_use: "No whole-CPC36940 coverage; functional product comparison; disposable packaging/sanitary article substitution; unmeasured generic factor; medical/sterile or blanket microwave/lifetime claim"
  required_metadata: "All reference qualifiers; actual site/period; source/provider gates; configuration; allocation decisions; raw denominators; WIP/FG/return vectors; service interval; packaging ownership; species/medium and uncertainty"
  required_quality_disclosure: "Scientific review and translation status remain distinct from checks; identify measured/estimated/missing values and actual omissions; no publication or mapping acceptance inferred"
  update_trigger: "Changed grade/formulation; mould/route/acceptance; utility gate; actual operations/species; reuse policy; supplier evidence; stock or allocation method; consequential scope"
data_sources:
  - id: "ineos-pp-processing-2007"
    type: "handbook"
    reference: "INEOS O&P USA, Polypropylene Processing Guide, March 2007, pp.3–9 and13–18; https://www.ineos.com/globalassets/ineos-group/businesses/ineos-olefins-and-polymers-usa/products/technical-information--patents/ineos_polypropylene_processing_guide.pdf; retrieved2026-10-16"
    used_for: "Qualitative PP feed/forming/cooling/ejection and defects; pre-coloured resin versus separate colouring; internal regrind limitations. No universal settings, recipe, regrind share, emission factor or product approval."
  - id: "ikea-kalas-bowl"
    type: "literature"
    reference: "IKEA, KALAS bowl mixed colors, article204.613.78, US product page snapshot; https://www.ikea.com/us/en/p/kalas-bowl-mixed-colors-20461378/; retrieved2026-10-16"
    used_for: "Real household food-serving bowl endpoint and declared PP material/care. Neither a manufacturing recipe nor evidence of one specific resin grade, factory or net single-bowl mass."
  - id: "ikea-kalas-care"
    type: "handbook"
    reference: "Inter IKEA Systems B.V., Advice and Instructions AA-2535874-3-100, PDF creation metadata2026-09-11, English and Chinese panels on PDF pp.1–2, linked from the retained US article204.613.78 product page; https://www.ikea.com/us/en/manuals/kalas-bowl-mixed-colors__AA-2535874-3-100.pdf; retrieved2026-10-20"
    used_for: "Counterevidence to blanket PP microwave/service-life claims; actual supplied article instructions govern. Consumer washing is outside the manufacturing gate."
  - id: "ifc-plastic-products-2007"
    type: "official_guidance"
    reference: "IFC/World Bank Group, EHS Guidelines for Metal Plastic and Rubber Products Manufacturing,30April2007, pp.9–11 and22–23 including Table4; https://www.ifc.org/content/dam/ifc/doc/2000/2007-metal-plastic-rubber-products-ehs-guidelines-en.pdf; original retrieved2026-10-16"
    used_for: "Non-reactive forming and environmental-stream screening. High-temperature potential-release table is not a measured PP species inventory or factor; other-polymer/rubber lists do not prescribe PP inputs. Not LCA allocation guidance."
  - id: "ilcd-general-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA Detailed guidance, first edition March2010, §§7.9.2–7.9.3, PDF275–292/printed255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf; original retrieved2026-10-13; reread2026-10-16"
    used_for: "General allocation hierarchy only for this attributional study when allocation is required. Subdivision and virtual subdivision precede exchange-specific determining physical causality and genuinely residual gate-condition market value. No whole-handbook compliance or recycling-credit claim."
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version3.0 structure30June2025 and Explanatory Notes pp.177–179; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf; retained original retrieved2026-10-12; reread2026-10-16"
    used_for: "Classification context only: plastic semi-manufactures, packing articles and sanitary ware are separate;36940 note is title-only. Narrow scope does not establish accepted whole-leaf coverage."
