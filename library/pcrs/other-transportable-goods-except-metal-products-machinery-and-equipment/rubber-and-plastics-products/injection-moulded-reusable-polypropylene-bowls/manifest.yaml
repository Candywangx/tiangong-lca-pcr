  semantic_boundary_decision: "Narrow semantic identity for complete single-shot injection-moulded reusable monolithic unfilled virgin-PP household bowls. Full material catalog and original CPC context plus frozen PVC profile/PE pipe/LDPE film/XPS board/LDPE bag intakes do not provide a compatible core method. Sanitary ware is a separate declared queue scope; no live author file used. No shared mapping/index/ADR/catalog changes or whole-leaf coverage claim."
  reference_gate: "Q is unique newly first-quality-released cooled bare-bowl net kg. Closing FG of that cohort is already Q. Actual packing/storage/handling/dispatch is a separate service account. Opening/closing WIP/FG and every inherited exchange vector, failed/idle/cleanup/rework burdens, external returns/original dispatch reverse and incremental rework are retained; no new Q from reinspection/reshipment. Internal Q and regrind cancel on consolidation. Q=0 retains raw burden without unit result."
  source_synthesis_limitations: "INEOS March2007 general PP processing + IKEA actual PP bowl + article care restrictions + IFC environmental screening are independent qualitative evidence, not a common contemporary SKU/factory/formulation. No processing setting, fixed regrind ratio, factory number, density, service life, emission factor, net item mass or product approval is imported. ILCD general allocation guidance applies only to this attributional inventory when allocation is required; not a recipe or whole-handbook compliance claim."
  ordinary_gaps:
    - "Actual future site/product grade and food-contact acceptance records; these are required foreground collection, not fabricated quantities."
    - "Unbound specific auxiliary/waste/packaging/species identities remain per-row collection/provider verification requirements; no collection-label fallback."
    - "Actual conditional equipment/formulations/species require presence/absence evidence. Unmeasured species and missing quantitative historical vectors hold that data package, never an invented zero."
  true_core_holds: []
  native_identity_limitations:
    n_butane_air: "CAS 106-97-8; verified Elementary flow, Mass/kg, Emissions to air unspecified only. Independent species and actual compartment required; no total indicator, purchased formulation or other environmental medium substitution. Exact official Chinese baseName retained."
    formaldehyde_air: "CAS 50-00-0; verified Elementary flow, Mass/kg, Emissions to air unspecified only. Independent species and actual compartment required; no total indicator, purchased formulation or other environmental medium substitution. Exact official Chinese baseName retained."
    water_vapour_air: "CAS 7732-18-5; verified Elementary flow, Mass/kg, Emissions to air unspecified only. Independent species and actual compartment required; no total indicator, purchased formulation or other environmental medium substitution. Exact official Chinese baseName retained."
    r134a_air: "CAS 811-97-2; verified Elementary flow, Mass/kg, Emissions to air unspecified only. Independent species and actual compartment required; no total indicator, purchased formulation or other environmental medium substitution. Native has no official Chinese baseName; retain HFC-134a in Chinese selected display."
    bowl: "One finished supplied reusable single-piece PP bowl only. Broad household article flow, no material grade, CAS, design, service life or supply geography specified. Does not cover every household article or imply actual food-contact approval."
    pp: "Native polypropylene granulate and propylene polymerisation are physically consistent with virgin PP complete pellet feed; generic grade. Residual 34790 classification is not a polymer recipe. No native CAS or filler/loading specified; actual grade/food-contact/composition required. Not externally recycled PP or ground internal regrind."
    grid-mv: "CN 1–35 kV consumption mix to user, grid-average supply. Only plant MV gate import; actual internal transformer/low-voltage distribution losses stay inside foreground and reconcile branch meters. Never reuse for BR, incineration-specific supply, cable or transformation service."
    water: "Treated tap-water supply at plant; no fixed geography. Reference Mass; additional Volume mean 0.001 is a native metadata conversion, not an independently measured density or generic material-density license. Does not identify raw/DI water or a closed-loop heat-exchange return."
