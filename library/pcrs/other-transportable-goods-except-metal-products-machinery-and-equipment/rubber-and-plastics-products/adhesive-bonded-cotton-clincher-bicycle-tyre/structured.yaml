    - rule_id: b_complete
      applies_to: "all inventory rows"
      rule: "Include actual coating, cloth cutting/orientation, bead forming/encapsulation, adhesive bonding, drying/conditioning, acceptance, material storage, packing, handling, failed runs, QA samples, ancillary services, waste and measured emissions. No omission of real burdens because a batch has zero output."
