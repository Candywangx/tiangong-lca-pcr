allocation_rules:
  - rule_id: a_stages
    applies_to: "all inventory rows"
    rule: "Prefer dedicated raw meters, weighing and run records by product/route. Allocate shared coating, drying/ventilation and plant services through demonstrated causal machine-hours, occupied capacity, metered energy or material throughput appropriate to that specific service. Record drivers for successful and failed/zero-output runs; do not use accepted-output share to erase failures."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: a_no_credit
    applies_to: "all waste rows"
    rule: "No automatic coproduct or avoided-production credit for scrap, returns, offcuts or wastewater. Keep actual waste treatment burdens. Document any genuine sold co-product and justified allocation separately before using the dataset. Internal rework is recirculation, not an additional product; count external input only once and all extra processing each time."
    source_ids: []
  - rule_id: a_once
    applies_to: "all inventory rows"
    rule: "First reconcile raw stage/stock ledgers and allocate attributable raw burdens to the same first-release cohort. Retain burdens carried into opening WIP and defer burdens remaining in closing WIP with traceable unit/cohort identities. Failed burdens stay with the responsible production cohort or explicit carried stock; they cannot vanish. Only then apply report_once once. A zero Q is not a zero-burden dataset and cannot be normalized."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "tyre_manufacture"
      flow_role: "First-release output and stock reconciliation"
      record_type: "foreground_record"
      raw_fields: "QA owner and stock custodian retain unique tyre/batch identities, product/route/state, net weighed mass, first acceptance time, rejected/destructive samples, returns/rework, WIP opening/closing mass/composition/carried burdens, finished-stock opening/closing receipts/issues/carried burdens, release and shipment links."
      collection_method: "Calibrated weighing and signed first-quality-release register; deduplicate returns and reacceptance. Keep production Q and warehouse issues separate. Record raw totals only, no division."
      unit: "kg"
      frequency: "Each lot/run and reconciled reporting period"
      temporal_coverage: "One complete matched period with opening/closing WIP and finished-stock carried burdens"
      site_scope: "Declared factory and measured service/cohort scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed owner records, calibration/assays, supplier BOM, meter/stock reconciliation and full failure retention"
    - protocol_id: cp_materials
      process_id: "tyre_manufacture"
      flow_role: "Raw material and formulation withdrawals"
      record_type: "foreground_record"
      raw_fields: "Material owner retains supplier/BOM/lot, full commercial preparation identity, purchased and withdrawn wet mass, solids/carrier assays and density/temperature, opening/closing raw stock and WIP, returns, failed runs, reused bath and transferred burden identities."
      collection_method: "Weigh raw withdrawals/returns and reconcile full raw-period material ledger. Inventory changes and reused portions are tracked without duplicate purchase. Assay subledgers never add external inputs. No A_i/Q at collection."
      unit: "kg"
      frequency: "Each lot/run and reconciled reporting period"
      temporal_coverage: "One complete matched period with opening/closing WIP and finished-stock carried burdens"
      site_scope: "Declared factory and measured service/cohort scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed owner records, calibration/assays, supplier BOM, meter/stock reconciliation and full failure retention"
    - protocol_id: cp_energy
      process_id: "tyre_manufacture"
      flow_role: "Energy, ventilation and shared services"
      record_type: "foreground_record"
      raw_fields: "Utility owner retains stage meter start/end, kWh, imported MJ, run timestamps, actual machine-hours/service drivers by product, failures, idle/zero-output periods and storage/dispatch cohort attribution."
      collection_method: "Read actual meters and attributable service logs; rate times duration only for a true rate. Electricity-derived heat is not another import. Preserve raw-period energy including drying and all actual site services before allocation; no normalization."
      unit: "kWh; MJ"
      frequency: "Each lot/run and reconciled reporting period"
      temporal_coverage: "One complete matched period with opening/closing WIP and finished-stock carried burdens"
      site_scope: "Declared factory and measured service/cohort scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed owner records, calibration/assays, supplier BOM, meter/stock reconciliation and full failure retention"
    - protocol_id: cp_packing
      process_id: "tyre_manufacture"
      flow_role: "Packing, handling and optional dispatch ledger"
      record_type: "foreground_record"
      raw_fields: "Packing/logistics owner retains each packaging SKU/composition/tare, issues, reuse, incoming/outgoing stock, packaged tyre links, storage time, handling work, shipment mass, carrier/service identity and carried burdens."
      collection_method: "Weigh each component separately; separate tyre net mass from outgoing packaging. Retain real packaging, storage, handling and dispatch burdens within declared scope using separate production/warehouse ledgers; cancel internal transfers when combined. Raw numerators only."
      unit: "kg"
      frequency: "Each lot/run and reconciled reporting period"
      temporal_coverage: "One complete matched period with opening/closing WIP and finished-stock carried burdens"
      site_scope: "Declared factory and measured service/cohort scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed owner records, calibration/assays, supplier BOM, meter/stock reconciliation and full failure retention"
    - protocol_id: cp_residuals
      process_id: "tyre_manufacture"
      flow_role: "Atomic waste and rejection ledger"
      record_type: "foreground_record"
      raw_fields: "Waste owner retains each waste identity/composition, wet/dry mass and moisture, destination, rejected test specimens, actual returns/rework, onsite reuse, offsite treatment, manifest and stock/WIP burden links."
      collection_method: "Weigh each actual waste separately over the complete period. Internal recirculation is reconciled with repeated processing energy, not repeated external material supply. Retain every failed batch and its burdens; do not infer zero waste from no sale. No normalization."
      unit: "kg"
      frequency: "Each lot/run and reconciled reporting period"
      temporal_coverage: "One complete matched period with opening/closing WIP and finished-stock carried burdens"
      site_scope: "Declared factory and measured service/cohort scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed owner records, calibration/assays, supplier BOM, meter/stock reconciliation and full failure retention"
    - protocol_id: cp_emissions
      process_id: "tyre_manufacture"
      flow_role: "Actual species, phase water and material closure"
      record_type: "foreground_record"
      raw_fields: "Environment owner retains actual wet-formulation composition/SDS/assays, independently supported emitted species, inlet/outlet concentration and dry/wet gas flow, integrated volumes or true rates/duration, blanks, temperature, retained moisture, effluent and phase/element ledgers."
      collection_method: "Measure species and water independently where present, including captured fractions and treatment outlets. Integrated volume times concentration with consistent units forms a raw mass, not volume times time. No generic VOC-as-species or COD conversion; no invented reaction-water term to close a balance. Add actual named species rows before dataset use."
      unit: "kg"
      frequency: "Each lot/run and reconciled reporting period"
      temporal_coverage: "One complete matched period with opening/closing WIP and finished-stock carried burdens"
      site_scope: "Declared factory and measured service/cohort scope"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed owner records, calibration/assays, supplier BOM, meter/stock reconciliation and full failure retention"
  calculation_rules:
    - id: report_once
      applies_to: "all inventory rows"
      rule: "q_i = A_i / Q; A_i is the raw attributable exchange after actual unit conversion, raw service allocation and opening/closing WIP carried-burden reconciliation for the matched first-release cohort, including failures and all retained burdens; Q is unique positive first accepted net tyre mass in kg, never shipment mass or Q plus same-cohort closing finished inventory. This is the sole normalization; card amount rules and protocol aggregation refer to this same reporting operation, not sequential divisions. The reference row is 1 kg."
      inputs:
        - A_i
        - Q
        - cp_release
        - cp_materials
        - cp_energy
        - cp_packing
        - cp_residuals
        - cp_emissions
      output: "q_i"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all material rows"
      requirement: "Supplier full name/grade/formulation and wet composition match this route; broad native identity is not recipe/provider compatibility. Distinguish supplied whole preparations from onsite separate ingredients."
      evidence: "Supplier BOM/SDS, assays, delivery and batch records"
    - id: dq_mass
      applies_to: "all inventory rows"
      requirement: "Close physical material and element balances on matched boundaries using independent water/species evidence: external wet inputs plus opening material/WIP equal accepted net tyres, actual wastes/emissions, closing material/WIP and outgoing packaging with internal transfers canceled. Keep packaging on its own mass ledger. Explain residual uncertainty without fitting unknown outlets."
      evidence: "Calibrated balances, full composition and stock/phase/element worksheets"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "No omitted full failed lot, zero-output run, rework burden, actual ancillary input, emitted species or stock-carried burden. Explicit not_applicable requires evidence of absence; unknown is not zero."
      evidence: "Full-period ledger and stage/owner completeness review"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_tyre"
    rule: "Require one terminal Product output linked by finished_tyre with the reference UUID and 1 kg net first-quality-release basis in both languages; require all qualifiers and exact declared assembly route. Do not accept inner tubes, tread caps, solid tyres or repeated return acceptance as the terminal reference."
    source_ids: []
  - rule_id: v_sources
    applies_to: "all inventory rows"
    rule: "Check original-source limitations, BOM, exact native full names/type/property/unit support and any route/geography/grade conflict. Source independence does not turn a manufacturer example into a universal recipe, measured input, lifetime or emission factor."
    source_ids:
      - vittoria-casing-2023
      - challenge-handmade
      - veloflex-record
  - rule_id: v_ledger
    applies_to: "all inventory rows"
    rule: "Check raw-period inputs/outputs, separate production and warehouse ledgers, positive nonduplicate Q, full WIP/stock carried burdens, failures, unit conversions, elemental/phase water and species closure, explicit shared-service allocation and exactly one report_once division. A missing measurement or unexplained balance is incomplete, never a fabricated zero."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Supplier-specific complete open-clincher manufacturing inventory per kg first released net tyre, with actual supplier inputs linked upstream."
  allowed_use: "Only declared cotton-based adhesive-bonded open-clincher route/product/state/site scope; subsequent bicycle assembly may use measured tyre mass."
  excluded_use: "Universal motorcycle/bicycle coverage, tire-service equivalence, safety approval, pressure recommendation, uncollected factory inventory or automatic mapping acceptance."
  required_metadata: "All required qualifiers; gate/cohort; actual source/provider and upstream cap curing; full wet BOM, protocol owners, stock and allocation records."
  required_quality_disclosure: "UUID/provider gaps, original-source limitations, measured and missing quantities, stock-carried burdens, shared-service allocation, species/closure uncertainty and scientific review state."
  update_trigger: "Change in carcass, bead, cap/adhesive formulation, whole-tyre curing, tube/belt structure, starting condition, reference gate or new material/species requires applicability review and projection refresh."
data_sources:
  - id: "vittoria-casing-2023"
    type: "literature"
    reference: "Ken Avery, Vittoria White Paper03, February2023, Bicycle Tire Casing Materials and Processes, printed pp.3 and6 (PDF pp.4 and7). https://mediahub.vittoria.com/m/9b1d26a647c16851/original/White-Paper-03-English-Version.pdf"
    used_for: "Clincher bead versus tubular interface; latex impregnation of cotton cloth and adhesive bonding of a tread cap. Cotton can also be vulcanized: only its non-vulcanized assembly branch is used. No recipe, supplier quantity, drying schedule, lifespan or emissions factor."
  - id: "challenge-handmade"
    type: "handbook"
    reference: "Challenge North America, Handmade Tires, undated manufacturer technical page. https://us.challengetires.com/pages/tech-handmade"
    used_for: "Independent manufacturer description of fabric casing, latex coating and adhesive assembly with natural-rubber tread. Marketing environmental/performance comparisons, general nylon composition and thread-count claims are excluded. No whole-chain no-vulcanization claim."
  - id: "veloflex-record"
    type: "handbook"
    reference: "Veloflex, Record Open Tubular, manufacturer article technical details. https://www.veloflex.it/en/clincher-tire-record.html"
    used_for: "Concrete open-clincher example with Pes/Co corespun carcass, aramid folding beads, natural-rubber/silica tread and bead-area sidewall protection. Technical table says no protection belt, overriding generic RKB copy. No mass, pressure, lifetime or all-rim compatibility transferred. Not proof that all process steps share one SKU."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, First edition March2010, section7.9.3, printed pp.257–258 (PDF277–278); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "LCA method support only within attributional cases where allocation rather than substitution is selected: virtual subdivision and flow-specific determining physical causality support dedicated raw meters/run records and service-specific shared coating, drying/ventilation and plant-service allocation. Manufacturing sources establish construction, not this LCA hierarchy. No default output/mass/time share, economic coefficient, recipe, yield/utility/emission factor, automatic coproduct or avoided-burden credit, or PEF/CFF conformity is established; actual service drivers, full site totals, failures and stock-cohort attribution remain required."
