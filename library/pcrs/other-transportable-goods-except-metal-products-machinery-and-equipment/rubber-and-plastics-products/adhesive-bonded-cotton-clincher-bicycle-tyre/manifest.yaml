  scientific_review: pending; no accepted mapping or publication authorized
  semantic_scope: Cotton-based latex-impregnated cloth, aramid folding bead and separately
    formed natural-rubber tread cap adhesive bonded without whole-tyre mold vulcanization.
    No anti-puncture belt, inner tube or rim supplied. Purchased components remain
    upstream burdens; manufacture of complete new tyres is mandatory. Not a change
    of use applied to a passenger-car tyre method.
  evidence_limitations:
  - Independent manufacturer sources establish a bounded technical synthesis, not
    a single SKU recipe or measured factory inventory. Cotton casing may also be vulcanized;
    that route is excluded.
  - Veloflex Record technical table says Protection Belt Absent although generic RKB
    copy is present; only its explicit article table and Pes/Co/aramid/tread identity
    are used, without transferring pressure, weight, durability or compatibility claims.
  - Purchased tread-cap manufacture, including its actual compounding, molding and
    any curing, belongs upstream; absence of whole-tyre mold cure does not mean absence
    of upstream vulcanization.
  uuid_audit:
    reference: State100 exact direct Product flow verified; reference Mass -> Units
      of mass -> kg id0 factor1.0. Official Chinese basename retained. Exact native
      version chain and original bytes remain in external author evidence.
    native_limits: Production mix, at plant; Finished product, manufactured. No explicit
      geography/locationOfSupply, CAS, grade/form or specific carcass/adhesive recipe.
      These broad identity fields do not establish supplier/background compatibility
      or quantities.
    unresolved_auxiliaries: Auxiliary UUIDs are unadopted pending exact supplier/formulation,
      property and provider compatibility review. Search candidates are not accepted
      by name alone; no auxiliary UUID is fabricated.
  pending:
  - Independent scientific review, accepted mapping decision and publication remain
    with root.
  - Actual factory recipe/BOM, wet formulation composition, ancillary species, supplier
    quantities and meters are future foreground collection requirements; they are
    not fictitious default values.
  - A concrete dataset with additional purchased formulations, reinforcement articles,
    cleaning agents, fuels, wastes or emitted species must add a separate atomic exchange
    card and resync before use. No omitted exchange is authorized by this bounded
    bill of materials.
