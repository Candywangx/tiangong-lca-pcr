  semantic_boundary_decision: "Promote only the retained passenger-car tyre scaffold after material semantic dedup. Integrated steel-belted radial textile-carcass/bromobutyl-liner route, distinct from upstream E-SBR/greige-cord products and CPC36112/36113/36114. No shared mapping, aliases, index, ADR or runtime edits."
  reference_identity_limitations: "Native identity is Tire, a Product flow with Number of items, production mix at plant. Its name has no fixed radial structure, passenger-car grade, CAS, geography or locationOfSupply; its comment covers a broad wheel-rim tyre concept including metal and rubber. The leaf classification says Other new pneumatic tyres (36113), inconsistent with the broad physical name and this explicitly qualified passenger-car subset; retain that classification debt and never infer a positive mapping. Use only for the physically verified new rubber passenger-car radial tyre here, not metal, solid, retread or an intermediate. Native identity supplies neither a supplier recipe, a regional background dataset, service life, tyre mass nor impact quantity. Actual site, construction, size, supplied state and provider compatibility require independent records."
  reference_gate: "Q is the positive net number of unique accepted new tyres actually supplied across the declared factory dispatch gate for one matched product/route/state cohort, not newly released production. Record opening/closing finished stock and their full carried burdens, first quality-release output, outward deliveries, returns, scrapping and rework separately. An undelivered accepted tyre is not in Q. Returned tyres retain their identity and original burdens; reinspection is not new production. Reverse the original delivery attribution for returns and reconcile redispatch by unique IDs so no tyre is counted twice. A factory delivery dataset cannot assume quality release equals delivery."
