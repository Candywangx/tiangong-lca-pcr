measurement_rules:
  - id: count_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "item denotes the exact native reference unit Item(s), reference factor 1. Count actual individual tyres, not axles, pairs, sets, rims or tonnes; Q comes from cp_delivery."
  - id: net_mass
    applies_to: "physical balance"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure net tyre mass by calibrated weighing and configuration, excluding rims and all packaging; retain physical kg ledger separately from the count reference. Do not assign a universal tyre weight or infer density from a secondary coefficient."
  - id: one_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "declared row unit"
    rule: "Collection retains raw period numerators in cp_recipe/cp_reinforcement/cp_utilities/cp_waste/cp_emissions/cp_delivery/cp_stock. Only calc_normalize divides matched A_i by Q once. Card formulas and aggregation_rule repeat this same reporting operation, not sequential divisions."
  - id: formulation_basis
    applies_to: "supplied formulations"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Each purchased formulation is one whole supplied input. Active contents, water, oil and coating are subledgers; add only independently acquired dilution/blend ingredients as external inputs. Internally compounded rubber is not purchased again."
  - id: integrated_volume
    applies_to: "gas and liquid measurements"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "For rate readings integrate actual rate over its matching time; already integrated meter volumes are not multiplied by time again. Record standard/actual temperature, pressure and dry/wet gas basis before conversion."
