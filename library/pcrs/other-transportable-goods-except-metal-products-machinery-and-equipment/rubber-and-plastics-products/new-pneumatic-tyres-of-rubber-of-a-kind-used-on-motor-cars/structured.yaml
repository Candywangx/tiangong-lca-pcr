allocation_rules:
  - rule_id: allocation_trace
    applies_to: "tyre_line"
    rule: "First subdivide actual product/recipe/stage batches and measured utilities; retain mass-linked ingredient attribution and causally supported shared services. For unavoidable shared equipment use measured machine time/load with documented idle and rejected-output attribution. Do not allocate total factory burden by finished mass alone across dissimilar tyre routes."
    source_ids:
      - continental-tyre-production
      - epa-rubber-process-2008
      - ilcd-attributional-allocation-2010
  - rule_id: allocation_loss
    applies_to: "tyre_line"
    rule: "Rejects/failed runs are not positive tyre output and retain burdens in the matched cohort. Scrap revenue does not create a coproduct or avoided-virgin credit. Any real coproduct or recycling allocation must be separately evidenced and disclosed; no automatic substitution credit. Internal recovery carries original burden and only additional processing once."
    source_ids:
      - epa-rubber-process-2008
      - ilcd-attributional-allocation-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_recipe
      process_id: "tyre_line"
      flow_role: "Compounding engineer: ingredient and recipe ledgers"
      record_type: "weighing and supplier assay"
      raw_fields: "lot/recipe revision; each supplied input mass; active/moisture/oil assay; opening/closing raw stock; internal returns; failed batches; masterbatch receipts"
      collection_method: "Collect calibrated batch scales and stock/receipt/issue records before any normalization. Reconcile each polymer/filler/preparation separately; purchased masterbatch is whole procurement, its constituent subledger replaces rather than duplicates internal ingredient procurement for that fraction."
      unit: "kg"
      frequency: "Each lot/run and period reconciliation"
      temporal_coverage: "Complete matched period including opening/closing burdens and failures"
      site_scope: "Declared plant, product, route and dispatch cohort; no unverified site pooling"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; recipe authorization; COA and reconciliation"
    - protocol_id: cp_reinforcement
      process_id: "tyre_line"
      flow_role: "Component engineer: cords and bead wire"
      record_type: "receipts and cutting/weighing logs"
      raw_fields: "cord polymer/construction/coating; supplier treatment; spool mass; issued/returned length and linear mass; calender coating; cutting scrap; WIP transfers"
      collection_method: "Retain actual received treated state and separate steel belt cord, bead wire, polyester carcass and nylon bandage. Measure rubber coatings from onsite recipe ledgers, not duplicate purchased-cord components."
      unit: "kg; m; kg/m"
      frequency: "Each lot/run and period reconciliation"
      temporal_coverage: "Complete matched period including opening/closing burdens and failures"
      site_scope: "Declared plant, product, route and dispatch cohort; no unverified site pooling"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier construction; treatment certificate; calibrated scales"
    - protocol_id: cp_operations
      process_id: "tyre_line"
      flow_role: "Production engineer: stage/run records"
      record_type: "batch and machine logs"
      raw_fields: "mix passes; temperature/time/load; extruder/calender settings; component lots; build IDs; cure press/cycle; cooling; inspection results; failed/zero-output/rework; cleanup/idle"
      collection_method: "Record the entire actual route, all campaigns and included post-release stages. Do not copy historical test temperatures, marketing recipe shares or nominal capacity into site values."
      unit: "stage-specific measured units"
      frequency: "Each lot/run and period reconciliation"
      temporal_coverage: "Complete matched period including opening/closing burdens and failures"
      site_scope: "Declared plant, product, route and dispatch cohort; no unverified site pooling"
      aggregation_rule: "per reference flow"
      quality_evidence: "machine logs; inspection and downtime records"
    - protocol_id: cp_utilities
      process_id: "tyre_line"
      flow_role: "Utilities engineer: each carrier and water"
      record_type: "meter and fuel/steam records"
      raw_fields: "carrier meter start/end; stage/submeter link; actual load/duration; steam pressure/temperature/mass; condensate; water make-up/recirculation; compressed air; fuel stock; warehouse/handling; provider boundary"
      collection_method: "Collect raw carrier quantities including startup, failures, rework, ventilation/control, storage and dispatch. Separate imported utilities from onsite conversion, avoiding double counted primary fuel/electricity and internal steam/air. Keep steam enthalpy and condensate-return evidence; volume-rate integration only when required."
      unit: "kWh; kg; MJ; m3"
      frequency: "Each lot/run and period reconciliation"
      temporal_coverage: "Complete matched period including opening/closing burdens and failures"
      site_scope: "Declared plant, product, route and dispatch cohort; no unverified site pooling"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; meter topology; invoices; utility balance"
    - protocol_id: cp_waste
      process_id: "tyre_line"
      flow_role: "Environment officer: each external waste"
      record_type: "weighbridge and transfer records"
      raw_fields: "waste stream; wet/dry mass; composition; source stage; internal recovery; external destination; wastewater volume/assays; rejected IDs"
      collection_method: "Collect each actual external stream separately. Distinguish circulating scrap from disposal and captured dust from air emissions; keep treatment and transportation burdens within declared responsibility."
      unit: "kg; m3"
      frequency: "Each lot/run and period reconciliation"
      temporal_coverage: "Complete matched period including opening/closing burdens and failures"
      site_scope: "Declared plant, product, route and dispatch cohort; no unverified site pooling"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer tickets; receiving treatment records; laboratory reports"
    - protocol_id: cp_emissions
      process_id: "tyre_line"
      flow_role: "Environment officer: species and media"
      record_type: "sampling and monitored balance"
      raw_fields: "species; air/water medium; concentration; flow rate or integrated volume; duration; dry/wet and standard/actual conditions; capture/removal; nondetect limit; process stage; fuel carbon"
      collection_method: "Collect raw results separately for mixing, extrusion, building solvent use, curing release/cooling and actual combustion. Concentration times an already integrated matched volume is sufficient; do not multiply time again. Retain unmeasured species as gaps, not zero. Actual species/reaction pathways require evidence separate from bulk closure."
      unit: "kg; mg/m3; m3; h"
      frequency: "Each lot/run and period reconciliation"
      temporal_coverage: "Complete matched period including opening/closing burdens and failures"
      site_scope: "Declared plant, product, route and dispatch cohort; no unverified site pooling"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling method; detection limits; gas basis; species analysis"
    - protocol_id: cp_delivery
      process_id: "tyre_line"
      flow_role: "Quality and dispatch controller: terminal gate"
      record_type: "acceptance/serial and dispatch ledgers"
      raw_fields: "product/route/state; first quality-release IDs; net tyre mass; dispatch IDs/count; returns/redispatch; destruction; packaging and handling; finished-stock quantities"
      collection_method: "Retain raw unique accepted outward delivery and return counts for the declared gate, configuration and cohort; compute positive Q with return reconciliation. Reinspection alone adds no new production. Weigh net tyres separately from packaging/rims; retain actual warehouse dwell/handling and every packaging component quantity. No division here."
      unit: "item; kg; day"
      frequency: "Each lot/run and period reconciliation"
      temporal_coverage: "Complete matched period including opening/closing burdens and failures"
      site_scope: "Declared plant, product, route and dispatch cohort; no unverified site pooling"
      aggregation_rule: "per reference flow"
      quality_evidence: "acceptance and serial records; dispatch/return documents; calibrated scales"
    - protocol_id: cp_stock
      process_id: "tyre_line"
      flow_role: "Inventory accountant: WIP/finished carried burdens"
      record_type: "stock and burden reconciliation"
      raw_fields: "opening/closing WIP by mix/component/green/cured status; opening/closing accepted finished stock; quantity/mass; batch IDs; carried material/energy/emission burdens; production release; scrapping and returns"
      collection_method: "Keep raw physical stock and full burden vectors before normalization. Reconcile each stage and internal transfer; carry unfinished and undelivered burdens forward instead of deleting or assigning them twice. Opening stock delivered this period brings its original burdens. Keep all failed/zero-output and rework burdens assigned to the affected cohort."
      unit: "item; kg; original exchange units"
      frequency: "Each lot/run and period reconciliation"
      temporal_coverage: "Complete matched period including opening/closing burdens and failures"
      site_scope: "Declared plant, product, route and dispatch cohort; no unverified site pooling"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock counts; prior-period burden receipts; cohort linkage"
  calculation_rules:
    - id: calc_stock
      applies_to: "all inventory rows"
      rule: "Before normalization, reconstruct attributed raw exchange vector A_i = current matched-period burden + opening WIP/finished carried burden - closing WIP/finished retained burden, removing duplicated internal transfers only. Preserve actual failed, zero-output, rework, return, scrap-treatment and included post-release warehouse/dispatch burdens in their cohort. Allocate shared burdens by allocation_trace. Component stocks and prior delivery reversals require batch links, not a residual credit."
      inputs:
        - cp_recipe
        - cp_reinforcement
        - cp_operations
        - cp_utilities
        - cp_waste
        - cp_emissions
        - cp_delivery
        - cp_stock
      output: "A_i"
      source_ids:
        - continental-tyre-production
        - epa-rubber-process-2008
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_i = A_i / Q, exactly once after raw conversions and calc_stock attribution. Q is the positive unique net accepted supplied tyre count from cp_delivery, not quality-release output or closing finished stock. The fixed finished_tyre reference is Q/Q = 1 item. Collection methods never divide; inventory formulas and protocol aggregation_rule describe this same single final operation."
      inputs:
        - A_i
        - Q
        - cp_delivery
        - cp_stock
      output: "q_i"
      source_ids:
        - continental-tyre-production
    - id: calc_physical_balance
      applies_to: "tyre_line"
      rule: "Maintain separate physical ledgers: opening WIP + actual process material inputs + actual returned stock = newly released/other stage transfers + closing WIP + measured wastes/emissions; opening finished stock + first accepted release + actual returns = physical outward shipments + closing finished stock + actual scrapping/rework transfers. Cancel internal transfers on merging, including release-to-warehouse handoff. Physical outward count and net Q are reconciled by IDs and return attribution. Keep tyre kg, packaging, water and each conserved element separately; reaction/phase/free-water changes need independently evidenced species and stoichiometry. Do not fit unknown reaction water and another unknown outlet to one closure residual."
      inputs:
        - cp_recipe
        - cp_reinforcement
        - cp_stock
        - cp_delivery
        - cp_waste
        - cp_emissions
      output: "physical stock and species balances"
      source_ids:
        - continental-tyre-production
        - epa-rubber-process-2008
    - id: calc_emission
      applies_to: "tyre_line"
      rule: "For each measured species use integral of matched concentration times volumetric flow over time with consistent gas conditions; if matched volume is already integrated use concentration times volume only. Record actual capture/removal and destination. Indicators such as total VOC, COD or NOx equivalents are not additional independent species masses."
      inputs:
        - cp_emissions
        - cp_utilities
      output: "species raw mass"
      source_ids:
        - epa-rubber-process-2008
  data_quality_requirements:
    - id: quality_route
      applies_to: "tyre_line"
      requirement: "Verify product size/rating, radial layer construction, recipe revisions and every supplied state; actual recipe rather than marketing proportions."
      evidence: "BOM; cross-section/build specification; COAs; batch records"
    - id: quality_coverage
      applies_to: "tyre_line"
      requirement: "No omitted failure/rework/stock burden; no finished-stock assumption or invented loss/energy/recipe/emission factor. Every actual atomic flow added with data or an explicit gap."
      evidence: "Complete period/cohort reconciliation and signed owner review"
    - id: quality_native
      applies_to: "finished_tyre"
      requirement: "Native identity is Tire, a Product flow with Number of items, production mix at plant. Its name has no fixed radial structure, passenger-car grade, CAS, geography or locationOfSupply; its comment covers a broad wheel-rim tyre concept including metal and rubber. The leaf classification says Other new pneumatic tyres (36113), inconsistent with the broad physical name and this explicitly qualified passenger-car subset; retain that classification debt and never infer a positive mapping. Use only for the physically verified new rubber passenger-car radial tyre here, not metal, solid, retread or an intermediate. Native identity supplies neither a supplier recipe, a regional background dataset, service life, tyre mass nor impact quantity. Actual site, construction, size, supplied state and provider compatibility require independent records."
      evidence: "Direct identity, exact reference-property/unit chain and actual foreground compatibility evidence"
    - id: quality_uncertainty
      applies_to: "tyre_line"
      requirement: "Retain calibration, uncertainty, detection limits, missing species, actual geography/time/provider limits and causal allocation evidence. Future plant measurements and auxiliary UUID matches remain required for a real dataset."
      evidence: "Measurements, stock carry receipts, source applicability and gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_tyre"
    rule: "Require exactly the declared Product output finished_tyre, the same tyre UUID and count basis in both languages; native count unit does not imply a mass. Verify all qualifiers, raw delivery IDs and Q > 0."
    source_ids:
      - continental-tyre-production
  - rule_id: validate_inventory
    applies_to: "tyre_line"
    rule: "Verify raw-to-final attribution and one normalization, complete physical/element closure independent of actual species/reaction-water evidence, external formulation/component purchasing without double count, all failed runs/rework/WIP/finished-stock carried burdens and actual included delivery operations. Unknowns are findings, not residual balancing or assumed zeros."
    source_ids:
      - continental-tyre-production
      - epa-rubber-process-2008
  - rule_id: validate_applicability
    applies_to: "tyre_line"
    rule: "Reject physical identity/grade/route/CAS contradictions and unsupported regional or provider assumptions. Keep disclosed native classification debt distinct from physical identity and scientific approval; no automatic mapping or methodology approval follows from a UUID or a schema check."
    source_ids:
      - continental-radial-components
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing and declared factory net-supply burden for the exact qualified tyre, linked to independent use/end-of-life modelling"
  allowed_use: "Same actual route, materials, supplied state, geography/time and accepted foreground evidence"
  excluded_use: "No service-life/vehicle-km comparison from tyre count alone; no generic all-tyre, non-car, bias, retread, solid-tyre, inner-tube or bought-finished-tyre packing proxy"
  required_metadata: "passenger-car application and steel-belted radial/tubeless construction; size/model and load/speed rating; actual carcass/belt/bead/innerliner materials and supplied state; each compound recipe revision and purchased-formulation basis; factory/site/time and actual utility configuration; net-dispatch gate and unique accepted delivery cohort Q; opening/closing WIP and finished-stock quantities with carried burdens; return/rework/reinspection attribution and waste destinations; reference identity limits and native classification debt; actual packaging/handling/warehouse boundaries and measured net tyre mass"
  required_quality_disclosure: "Complete raw/stock/carry attribution, one normalization, actual recipes, utility and delivery boundaries, emissions coverage, auxiliary UUID/provider gaps and complete reference native limitations"
  update_trigger: "Changed construction, compound/supplier state, utility route, site, process, delivery gate, stock accounting, new measurements or resolved contradictory identity metadata"
data_sources:
  - id: "continental-tyre-production"
    type: "literature"
    reference: "Continental, Tire production, undated technical overview, https://www.continental-tires.com/tire-knowledge/tire-production/"
    used_for: "Five-stage route, raw-material roles, component manufacture, curing, final inspection and warehouse shipment. Qualitative scope only; no plant recipe, yield, energy, temperature or loss default."
  - id: "continental-radial-components"
    type: "literature"
    reference: "Continental, Tire components, undated technical overview, https://www.continental-tires.com/tire-knowledge/tire-components/"
    used_for: "Steel-belted radial passenger-car architecture, nylon bandage, steel belts/beads, textile carcass and synthetic airtight layer; filler/plasticizer/cure roles. Example mass percentages and performance claims are not quantitative recipe or LCA evidence."
  - id: "epa-rubber-process-2008"
    type: "official_guidance"
    reference: "US EPA, Emission Factor Documentation for AP-42 Section 4.12, Manufacture of Rubber Products, Final Report, November 2008, sections 2.1-2.3 and 3.1-3.3, https://www.epa.gov/sites/default/files/2020-10/documents/db04s12.pdf"
    used_for: "Independent historical process/material and emissions sampling context. Natural rubber/SBR/BR, additives and press/cool-down zones; no universal recipe, sulfur-water yield, site temperature, process energy or emission factor adopted from sampled tests."
  - id: "exxon-innerliner-materials"
    type: "literature"
    reference: "ExxonMobil Product Solutions, Tires, overview paragraph on conventional innerliners, https://www.exxonmobilchemical.com/en/industries/automotive/tires"
    used_for: "Publisher page read through a tool-rendered primary excerpt, not a locally acquired publisher PDF. Supports bromobutyl/chlorobutyl innerliner material roles only; selected bromobutyl is an authored route subset. No grade, formula, quantity, energy, performance or lifetime claim adopted."
  - id: "ilcd-attributional-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment - Detailed guidance, first edition March 2010, section 7.9.3, printed pp. 257-258 (PDF 277-278), https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Bounded attributional subdivision and causal shared-service allocation method; supports documented drivers and no automatic avoided-production credit. No tyre recipe, fixed split, waste cutoff, industrial factor, economic default, performance or service-life claim. Actual cohort/site evidence remains required."
