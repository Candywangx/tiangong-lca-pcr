system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "all manufacturing"
      rule: "Include raw-powder handling, actual cold pressing, all oven ramps/holds/cooling and ventilation, direct machining, cleanup, failed trials, rework, testing and first release. A purchased finished gasket is not a substitute for this route. Add each actual unlisted exchange with a specific identity; no residual other-material bucket or unsupported zero."
      source_ids:
        - daikin-ptfe-moulding-2019
        - daikin-ptfe-m17-2016
        - teadit-ptfe-gaskets-2023
        - doing-ptfe-oven
    - rule_id: b_q
      applies_to: "manufacturing and FG"
      rule: "Q is the sum of net kg at each unique NEW first-quality-release event after machining/testing. Reinspection, dispatch, return or repeated repair-release creates no new Q. Closing FG already in Q is a custody stock, never a second manufacturing output. Keep actual packaging/storage/handling/dispatch and return-inspection services as incremental original-cohort accounts; merging cancels the internal release transfer and preserves the single production burden."
      source_ids:
        - teadit-ptfe-gaskets-2023
    - rule_id: b_vectors
      applies_to: "all cohort stocks"
      rule: "Keep disjoint opening/closing raw powder, green preform, sintered billet, machined WIP, FG and rework physical quantities with a historical vector for EACH exchange. Independently retain non-WIP press/lathe/oven equipment service, hydraulic/gear oil, coolant-water and refrigerant charges and vectors, including idle/maintenance. Allocate real utility consumption or a measured-consumption equivalent with inventory correction once; never subtract stock twice or erase inherited burden. Returned gaskets carry original production once; only actual additional repair materials/energy and old component wastes are new. A changed composition/geometry requires renewed applicability."
      source_ids:
        - daikin-ptfe-moulding-2019
        - jrc-ilcd-2010
    - rule_id: b_packages
      applies_to: "each package"
      rule: "For EACH incoming drum/liner and outgoing bag/carton/tape/pallet independently: opening empty + opening attached WIP/FG + opening reusable + purchases + external returns received = closing empty + closing attached WIP/FG + closing reusable + packages on gross physical shipments + external returns sent + waste. Stock categories are disjoint. Internal reuse cancels, is neither another purchase nor Q nor automatic coproduct. Preserve original burdens and real repair/replacement materials and wastes; supplier-included packaging is not purchased again. Separate gross physical movement from net financial shipments."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_physical
      applies_to: "manufacturing/FG/consolidated gates"
      rule: "Reconcile complete physical mass and relevant C/F and actual other-element balances independently of measured molecular species. No single residual may determine two unknowns. Keep free water, actual reaction water, vapour and any structure/phase-bound water distinct; PTFE morphology/density change does not create water. Measure FG moisture separately. Native TFE CAS116-14-3 denotes monomer, never PTFE dust CAS9002-84-0. Actual external liquid heat-exchange return is a Product output with temperature/enthalpy and supplier water/energy agreement; actual oily condensate is separate waste. Do not invent steam/boilers or count a returned-water burden twice."
      source_ids:
        - daikin-ptfe-moulding-2019
        - daikin-ptfe-m17-2016
        - teadit-ptfe-gaskets-2023
