              column: 1
          markdown: "# Cold-compressed and freely sintered virgin PTFE flat gasket manufacture\n\nGlobal applicability for all following rule families: This attributional method manufactures one drawing-specific unfilled non-expanded virgin PTFE flat annular gasket at a declared CN site. Begin with the whole purchased conventional homopolymer granular moulding powder, verified for cold compression; receive/store/condition/screen, uniformly charge and cold-press a preform, demould, freely sinter in an electrically heated ventilated batch oven, cool under the actual controlled programme, directly dry-turn/bore/part and deburr the billet into solid one-piece gaskets, inspect/test and uniquely first release. Retain real failed batches, warm-up, idle, start/stop, extraction, cleanup, rework and utilities. Subsequent actual FG storage/packing/handling/dispatch is a separately reported original-cohort service account. [daikin-ptfe-moulding-2019; daikin-ptfe-m17-2016; teadit-ptfe-gaskets-2023; doing-ptfe-oven]\n\nExclude filled or chemically modified PTFE; expanded or structured PTFE; paste lubricant extrusion; ram or isostatic moulding; hot coining/water quench; purchased sheet/billet conversion; sheet skiving and sheet-cut gaskets; melt injection; elastomer or metal-composite seals; spring-energized seals; welded segments; resin synthesis; coatings/printing; medical implantation; oxygen-service cleaning; fuel-fired sintering; bought-finished-gasket repacking; installation/use/end of life. A real departure requires renewed applicability and complete atomic exchanges.\n\n"
    - unit_id: "normative_68797"
      family: "allocation"
      span:
        start:
          offset: 68797
          line: 1036
          column: 1
        end:
          offset: 73273
          line: 1046
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_scope | all allocation rules | The following hierarchy is conditional on an actual allocation-required attributional situation. Manufacturing-source capability is not LCA allocation evidence. | jrc-ilcd-2010 |\n| a_subdivide | allocation-required attributional cases | First independently assign dedicated lots/materials/meters and real or virtual subdivision. Do not turn a mixed oven into one uniform mass factor: identify each batch function, actual load geometry and time-temperature heat demand, standby/extraction and other causal demands. Keep service burden attached to its actual released cohort. | jrc-ilcd-2010 |\n| a_physical | remaining shared exchanges | For each still-shared exchange establish a determining physical causal relationship to each co-function and quantify its actual extent; evidence it separately for electric heat, machine drive, extraction, water and other streams. Mere mass correlation, nominal power, production value or arbitrary physical/economic choice is insufficient. | jrc-ilcd-2010 |\n| a_residual | only genuinely residual allocation | Only genuinely unallocated remainder after subdivision and exchange-specific determining physical causality uses co-function market value at the common process gate in its actual condition and the same representative period. Record quantities/prices/quality/state, gate consistency, uncertainty and sensitivity; not retail finished-gasket prices versus wet-scrap prices at another gate. No fixed fraction or automatic recycling/substitution credit. Waste treatment service and an accepted coproduct require explicit separate status and burdens. | jrc-ilcd-2010 |\n| asset_manufacture_conservation | existing capital/reusable manufacture attribution | Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory. |  |\n\n"
