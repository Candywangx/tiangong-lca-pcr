          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Whole purchased conventional unfilled virgin PTFE granular moulding powder at receipt; include actual inbound freight and upstream powder supply |\n| starting_condition_role | foreground collection gate; upstream supply remains linked background |\n| product_classification_scope | Narrow36990 industrial PTFE flat gasket subset; classification is not method approval |\n| recursive_input_rule | Internal powder/preform/billet/rework transfers retain cohort history and cancel on consolidation; bought released gasket is not a new raw input route |\n| upstream_dataset_requirement | Match delivered whole powder grade/form/route and every actual supply/service state; preserve transport and package inclusions without duplicate upstream purchases |\n| disclosure | Declare complete failed/zero-output loads; WIP and non-WIP physical stock and every inherited exchange vector; distinct first-release and FG service gates; all real species/streams and gaps |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_route | all manufacturing | Include raw-powder handling, actual cold pressing, all oven ramps/holds/cooling and ventilation, direct machining, cleanup, failed trials, rework, testing and first release. A purchased finished gasket is not a substitute for this route. Add each actual unlisted exchange with a specific identity; no residual other-material bucket or unsupported zero. | daikin-ptfe-moulding-2019; daikin-ptfe-m17-2016; teadit-ptfe-gaskets-2023; doing-ptfe-oven |\n| b_q | manufacturing and FG | Q is the sum of net kg at each unique NEW first-quality-release event after machining/testing. Reinspection, dispatch, return or repeated repair-release creates no new Q. Closing FG already in Q is a custody stock, never a second manufacturing output. Keep actual packaging/storage/handling/dispatch and return-inspection services as incremental original-cohort accounts; merging cancels the internal release transfer and preserves the single production burden. | teadit-ptfe-gaskets-2023 |\n| b_vectors | all cohort stocks | Keep disjoint opening/closing raw powder, green preform, sintered billet, machined WIP, FG and rework physical quantities with a historical vector for EACH exchange. Independently retain non-WIP press/lathe/oven equipment service, hydraulic/gear oil, coolant-water and refrigerant charges and vectors, including idle/maintenance. Allocate real utility consumption or a measured-consumption equivalent with inventory correction once; never subtract stock twice or erase inherited burden. Returned gaskets carry original production once; only actual additional repair materials/energy and old component wastes are new. A changed composition/geometry requires renewed applicability. | daikin-ptfe-moulding-2019; jrc-ilcd-2010 |\n| b_packages | each package | For EACH incoming drum/liner and outgoing bag/carton/tape/pallet independently: opening empty + opening attached WIP/FG + opening reusable + purchases + external returns received = closing empty + closing attached WIP/FG + closing reusable + packages on gross physical shipments + external returns sent + waste. Stock categories are disjoint. Internal reuse cancels, is neither another purchase nor Q nor automatic coproduct. Preserve original burdens and real repair/replacement materials and wastes; supplier-included packaging is not purchased again. Separate gross physical movement from net financial shipments. | jrc-ilcd-2010 |\n| b_physical | manufacturing/FG/consolidated gates | Reconcile complete physical mass and relevant C/F and actual other-element balances independently of measured molecular species. No single residual may determine two unknowns. Keep free water, actual reaction water, vapour and any structure/phase-bound water distinct; PTFE morphology/density change does not create water. Measure FG moisture separately. Native TFE CAS116-14-3 denotes monomer, never PTFE dust CAS9002-84-0. Actual external liquid heat-exchange return is a Product output with temperature/enthalpy and supplier water/energy agreement; actual oily condensate is separate waste. Do not invent steam/boilers or count a returned-water burden twice. | daikin-ptfe-moulding-2019; daikin-ptfe-m17-2016; teadit-ptfe-gaskets-2023 |\n\n"
