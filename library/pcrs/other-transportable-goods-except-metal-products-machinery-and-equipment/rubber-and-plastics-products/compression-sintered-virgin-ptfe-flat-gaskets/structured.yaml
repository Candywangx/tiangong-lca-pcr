      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_basis | reference and all rows | Exactly one finished_gasket Product output links the1kg reference. EN/ZH qualifiers, Q gate, rows, unit basis and one normalization agree. Collection stores undivided raw data; aggregation is the target label, not another operation. Q0 yields no unit result. | teadit-ptfe-gaskets-2023 |\n| v_material | powder/forming/machining | Reject applying this method to a conflicting powder form, modified/filler/expanded polymer, altered hot-coining/isostatic/ram/skiving route or purchased finished article. Verify actual first release and scope; raw-to-product route must remain complete. | daikin-ptfe-moulding-2019; daikin-ptfe-m17-2016; teadit-ptfe-gaskets-2023 |\n| v_native | native UUID bindings | Apply each entire card restriction. The seal generic name cannot infer rubber material from its classification or establish a36990 mapping. TFE monomer CAS116-14-3 cannot represent PTFE9002-84-0 dust; air-unspecified bindings are replaced by verified actual compartments when known. CN below1kV grid user-side supply only. Unresolved actual flow/provider/unit compatibility remains explicit. | daikin-ptfe-moulding-2019; daikin-ptfe-m17-2016; teadit-ptfe-gaskets-2023; doing-ptfe-oven |\n| v_balance | manufacturing/FG/non-WIP/packages | Independently verify physical mass/element closure and actual species/reaction-water evidence. Reconcile every package direction/stock and non-WIP charge vector, inherited production/service separation, opening/closing WIP/FG moisture and actual repair new/old components. No duplicated closing-FG output, internal purchase, automatic coproduct or residual-fitted emission. | daikin-ptfe-moulding-2019; daikin-ptfe-m17-2016; jrc-ilcd-2010 |\n| v_allocation | shared burden | Document the actual attributional allocation need, dedicated/virtual subdivision, exchange-specific determining causality and only genuinely residual common-gate same-state contemporaneous market values; no fixed physical/economic split or automatic credit. Missing scientific evidence or unsupported relationships remain pending review. | jrc-ilcd-2010 |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
