allocation_rules:
  - rule_id: a_scope
    applies_to: "all allocation rules"
    rule: "The following hierarchy is conditional on an actual allocation-required attributional situation. Manufacturing-source capability is not LCA allocation evidence."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_subdivide
    applies_to: "allocation-required attributional cases"
    rule: "First independently assign dedicated lots/materials/meters and real or virtual subdivision. Do not turn a mixed oven into one uniform mass factor: identify each batch function, actual load geometry and time-temperature heat demand, standby/extraction and other causal demands. Keep service burden attached to its actual released cohort."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_physical
    applies_to: "remaining shared exchanges"
    rule: "For each still-shared exchange establish a determining physical causal relationship to each co-function and quantify its actual extent; evidence it separately for electric heat, machine drive, extraction, water and other streams. Mere mass correlation, nominal power, production value or arbitrary physical/economic choice is insufficient."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual
    applies_to: "only genuinely residual allocation"
    rule: "Only genuinely unallocated remainder after subdivision and exchange-specific determining physical causality uses co-function market value at the common process gate in its actual condition and the same representative period. Record quantities/prices/quality/state, gate consistency, uncertainty and sensitivity; not retail finished-gasket prices versus wet-scrap prices at another gate. No fixed fraction or automatic recycling/substitution credit. Waste treatment service and an accepted coproduct require explicit separate status and burdens."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "prepare"
      flow_role: "whole powder"
      record_type: "foreground_record"
      raw_fields: "supplier; grade; whole supplied form; CAS; original quantity/unit; particle form; moisture; invoices; opening/closing raw and each WIP stage; inherited exchange vectors"
      collection_method: "Weigh/tare whole supplied powder and actual stocks; verify conventional granular homopolymer and contamination. Store raw values without division; retain supplier-included constituents as subaccounts."
      unit: "kg"
      frequency: "each lot and stock cut-off"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_release
      process_id: "machine"
      flow_role: "unique first release"
      record_type: "foreground_record"
      raw_fields: "cohort; drawing; lot; serial release event; bare net kg; tare; count; moisture; conditioning; acceptance specification and actual tests; original Q"
      collection_method: "Use calibrated weighing of bare accepted gaskets or count-verified homogeneous lots, excluding packaging. Sum unique NEW first-release net kg as Q. Keep reinspection/return separate. Count-to-kg uses measured configuration-specific net mass, never density or a guessed item weight."
      unit: "kg"
      frequency: "each acceptance and cohort close"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_energy
      process_id: "utilities"
      flow_role: "actual manufacturing electric load"
      record_type: "foreground_record"
      raw_fields: "meter; raw start/end kWh; actual power/time only if rate; batch geometry; programme; ramps/holds/cooling; idle/startstop/failed/cleanup; causal allocation; utility inclusions"
      collection_method: "Meter differences without division; integrate actual power rates once with matching time units. Independent process meters/engineering establish allocation, not nameplate times nominal throughput. Convert kWh to MJ once at numerator stage."
      unit: "kWh"
      frequency: "continuous and every complete run"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_water
      process_id: "utilities"
      flow_role: "each physical water circuit"
      record_type: "foreground_record"
      raw_fields: "supply; return; bleed; condensate; vapour; free/reaction/phase water; raw volumes; total/rate flag; independent density at state; temperature/enthalpy; solutes; FG moisture; opening/closing loop stock/vector; supplier agreement"
      collection_method: "Independently meter/weigh actual streams and stock. Convert integrated volume using this material density at its actual state; integrate only true rates. Record measured species and water independently; preserve external return as Product where applicable."
      unit: "kg"
      frequency: "each circuit interval and stock cut-off"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_charge
      process_id: "utilities"
      flow_role: "oil/refrigerant/filter equipment service"
      record_type: "foreground_record"
      raw_fields: "equipment/charge; whole preparation; original raw quantity/unit; opening/closing charge mass and per-exchange vector; top-up; consumption; recovery; external return; waste; leak; filter media/housing/retained dust; service duration"
      collection_method: "Weigh actual service movements and charges and independently verify receiver/chemistry. Keep actual gross acquired mass, actual outward recovery/unused transfers, spent waste and independently measured leaks distinct from the service-burden vector. Retain disjoint non-WIP physical stocks and every inherited exchange vector. Use independently measured consumption or a proved equivalent stock/vector correction once, not both. An unused outward transfer carries only its evidenced remaining vector; spent oil/filter, leakage or treatment-bound discharge does not automatically cancel the upstream burden already consumed in service. Do not subtract every physical outward quantity as unused return or reduce a real acquisition/waste/leak card by allocation. Retain original stock lineage, actual composition/assay, service attribution and additional handling/treatment burdens separately; no missing mass is automatically an air emission."
      unit: "kg"
      frequency: "each service event and cut-off"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_air
      process_id: "utilities"
      flow_role: "external compressed air"
      record_type: "foreground_record"
      raw_fields: "actual supplier; original total/rate volume; pressure; temperature; humidity; reference conditions; energy inclusion; leaks"
      collection_method: "Preserve metered reference-state volume and source-specific state correction. Do not multiply integrated volume by duration; internal generation cancels with real own utilities retained."
      unit: "m3"
      frequency: "each actual interval"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_waste
      process_id: "machine"
      flow_role: "each specific waste"
      record_type: "foreground_record"
      raw_fields: "stream; preform/sintered state; source lot; raw wet/dry mass; moisture; contamination; handler; actual recovery/disposal; retained polymer and inherited vectors"
      collection_method: "Weigh each actual physical waste stream and split captured powder, sintered turnings, failed articles and composite filter waste; reconcile independently with raw/WIP and physical mass. Internal reuse is a transfer retaining energy/losses."
      unit: "kg"
      frequency: "each transfer and closing stock"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_emission
      process_id: "form"
      flow_role: "actual individually identified species"
      record_type: "foreground_record"
      raw_fields: "species; CAS; molecular identity; source event; air compartment; stack/fugitive; original concentration and gas total/rate volume; pressure/temperature/humidity; time only for rate; capture; measured water and C/F balance"
      collection_method: "Use independent analytical identity and calibrated species-specific mass; integrated gas volume times compatible concentration once, time only if a true rate. Keep precursor and downstream hydrolysis species at their true gates, not duplicated. Total fluoride/VOC/COD cannot stand for a particular molecule. Missing coverage remains unknown."
      unit: "kg"
      frequency: "representative full runs including failures"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_packaging
      process_id: "service"
      flow_role: "each named package and destination"
      record_type: "foreground_record"
      raw_fields: "article; composition; provider; original count and measured kg; purchases; included supply; external returns received; gross shipment outward; external return sent; waste; disjoint opening/closing empty/attached-WIP/FG/reusable stocks and every historical vector; repair old/new masses"
      collection_method: "Weigh/tare actual single articles or homogeneous lots and reconcile b_packages separately for each material. Keep original burden once and physical gross directions; internal reuse is not another purchase. A real repair component and its old waste require separate rows and historical vectors."
      unit: "kg"
      frequency: "every purchase/movement/repair and stock cut-off"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_service
      process_id: "service"
      flow_role: "original-cohort incremental services"
      record_type: "foreground_record"
      raw_fields: "original cohort Q; service interval; undivided meter data; opening/closing FG kg/moisture and production/service vectors; gross dispatch; original delivery reversal; returns; inspection/repair; real new/old component mass and vectors; service-WIP/non-WIP"
      collection_method: "Retain raw physical custody and actual incremental load. Original burden follows the original gasket once; reinspection/repair is not new production. Keep original-delivery reversals and actual replacement/new-component-old-waste vectors; materially changed product requires applicability review. Disclose incomplete services."
      unit: "kWh"
      frequency: "every movement/service interval"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_freight
      process_id: "prepare"
      flow_role: "actual inbound road service"
      record_type: "foreground_record"
      raw_fields: "origin; destination; actual load mass tonnes; actual loaded distance km; mode; route; vehicle; empty leg; provider inclusions"
      collection_method: "Collect whole shipment transport service using actual t times actual km once before allocation; preserve original records and any supplier inclusion. Other actual modes require atomic rows."
      unit: "tkm"
      frequency: "each shipment"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
    - protocol_id: cp_equipment
      process_id: "utilities"
      flow_role: "each durable press/oven/lathe"
      record_type: "foreground_record"
      raw_fields: "machine identity; composition; disjoint opening/closing in-service physical units N0/N1; actual gross acquisitions N_in; external returned acquisitions; actual outward Product handovers N_out; complete retirements N_retired; actual repair additions/removed parts; original and remaining upstream per-exchange vectors; separately evidenced service-demand vector allocated to each first-release cohort or later service interval; capital boundary"
      collection_method: "Keep raw physical counts and service-burden vectors as distinct linked ledgers. For the same complete-machine identity close N0 + actual gross acquisitions + actual external returns received = N1 + actual Product handovers outward + actual complete retirements, with other actual directions separately named and internal movements cancelled. Do not reduce a retained physical machine because some upstream burden was assigned to service, and do not reduce a genuine acquisition count by a service fraction. Under the disclosed capital boundary, attribute actual service per exchange using evidenced demand and original/remaining stock history once, separately from acquisitions and actual repair parts/removed parts. Link each service allocation to either manufacturing first release or a later original-cohort interval; never repurchase old assets or re-charge already assigned history. Item(s) and item are the same count unit with factor1; no guessed kg/machine, lifetime, equal repair mass or default depreciation."
      unit: "item"
      frequency: "each event and reporting cut-off"
      temporal_coverage: "complete declared cohort/period with relevant opening history"
      site_scope: "actual site; each lot/equipment/circuit/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original calibrated records; independent identity/state and vector reconciliation"
  calculation_rules:
    - id: calc_q
      applies_to: "finished_gasket"
      rule: "Q = sum of unique NEW first-quality-release bare net kg from cp_release; exclude repeat inspection, return and dispatch; include measured actual retained moisture consistently. Closing FG is already part of Q."
      inputs:
        - cp_release
        - cohort_id
      output: "Q"
      source_ids:
        - teadit-ptfe-gaskets-2023
    - id: calc_normalize_once
      applies_to: "all inventory rows"
      rule: "For Q > 0, z_i_c = A_i_c / Q once. Before this sole division convert original numerator units/states and integrate only true rates, then apply evidenced assignment/allocation. Manufacturing burden vectors retain attributable current loads plus opening minus closing disjoint unreleased raw/WIP and eligible non-WIP historical vectors, corrected once. Never subtract closing FG production vectors: every newly first-released gasket is already in Q even if still stored; prior released opening FG is not new current production. Service burden vectors retain only original-cohort incremental service and eligible service-stock vectors, keeping assigned production history fixed. Physical acquisition, external return, gross shipment, emission and waste cards use actual direction quantities in their own mass, volume or item unit as A_i_c, independent of consumed-service burden allocation. In particular complete-machine inputs are actual gross acquisitions and retirement outputs actual handovers, not service-equivalent fractional machine purchases; retained old equipment can have zero acquisition and a positive independently attributed service vector. A newly acquired whole machine remains its actual acquired count even when only part of its upstream vector serves this cohort. Do not add gross acquisition-provider burdens and the same stock-attributed service vector twice; retain linked physical and burden views. Use independently measured consumption OR a proved equivalent lineage-specific stock/vector correction once, without subtracting all spent/leaked/wasted outward mass as unused transfer. Q for service is the original release cohort kg, never net dispatch or repair release. Cards and aggregation only read this same z_i_c, without another division. At Q=0 retain real loads, stocks and vectors and issue no unit result."
      inputs:
        - A_i_c
        - Q
        - cohort_id
        - service_interval
      output: "z_i_c"
      source_ids:
        - daikin-ptfe-moulding-2019
        - teadit-ptfe-gaskets-2023
        - jrc-ilcd-2010
    - id: calc_units
      applies_to: "all inventory rows"
      rule: "Original numerator conversions: g to kg uses0.001; t to kg uses1000; kWh to MJ uses3.6 from the verified native energy unit group. Use measured material-specific density at the independently documented state only for a real volume-to-mass conversion. Count-to-mass uses measured net lot mass/count of the same configuration. Integrated liquid/gas volume is not multiplied by time; true rates are integrated once."
      inputs:
        - raw_quantity
        - raw_unit
        - measured_state
        - measurement_record
      output: "converted_raw_quantity"
      source_ids:
        - daikin-ptfe-moulding-2019
    - id: calc_physical
      applies_to: "all physical gates"
      rule: "For each disjoint physical gate independently reconcile opening + actual external inputs = closing + actual external outputs + actual measured transformations; cancel internal transfers. Keep separate measured component/element balances and species-based reaction/water checks, including actual air/oxygen/water if a reaction consumes them. No residual-fitting two unknowns or equating polymer dust with monomer; add actual unlisted atomic exchanges before closure."
      inputs:
        - physical_stocks
        - measured_inputs
        - measured_outputs
        - independent_species
        - moisture
      output: "gate_balance"
      source_ids:
        - daikin-ptfe-moulding-2019
        - daikin-ptfe-m17-2016
        - teadit-ptfe-gaskets-2023
    - id: calc_packages
      applies_to: "all package rows"
      rule: "Apply b_packages to each single package identity with actual physical directions and disjoint stocks. Carry original vector once, record real new repair parts/old-part wastes, cancel internal reuse and never count packages in net gasket Q."
      inputs:
        - cp_packaging
        - package_id
        - opening_stock
        - closing_stock
        - physical_movements
      output: "package_balance"
      source_ids:
        - jrc-ilcd-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all bound and unbound rows"
      requirement: "Verify all native names/synonyms/comments, CAS, form, route, geography, compartment, type, every property and exact referenced unit chain. Generic identity proves neither actual supplier compatibility nor quantitative data. Track unresolved auxiliary UUIDs without replacing an atomic exchange or automatic draft."
      evidence: "complete direct identity and supplier/measurement evidence"
    - id: dq_programme
      applies_to: "powder through release"
      requirement: "Use actual grade/shape-dependent programmes and release testing; source example matrices, density, shrinkage and creep plots are not factory measurements or service certification."
      evidence: "actual programme/lot traces; calibration; drawing and independent specification"
    - id: dq_complete
      applies_to: "all ledgers"
      requirement: "Retain zero-output, failed, idle, cleanup and rework; all WIP/FG and non-WIP physical/vector histories, raw numerator provenance, ordinary unresolved supplies and missing service/emission coverage. Unknown is not zero or pass."
      evidence: "raw meter and stock records; species evidence; uncertainty and coverage register"
validation_rules:
  - rule_id: v_basis
    applies_to: "reference and all rows"
    rule: "Exactly one finished_gasket Product output links the1kg reference. EN/ZH qualifiers, Q gate, rows, unit basis and one normalization agree. Collection stores undivided raw data; aggregation is the target label, not another operation. Q0 yields no unit result."
    source_ids:
      - teadit-ptfe-gaskets-2023
  - rule_id: v_material
    applies_to: "powder/forming/machining"
    rule: "Reject applying this method to a conflicting powder form, modified/filler/expanded polymer, altered hot-coining/isostatic/ram/skiving route or purchased finished article. Verify actual first release and scope; raw-to-product route must remain complete."
    source_ids:
      - daikin-ptfe-moulding-2019
      - daikin-ptfe-m17-2016
      - teadit-ptfe-gaskets-2023
  - rule_id: v_native
    applies_to: "native UUID bindings"
    rule: "Apply each entire card restriction. The seal generic name cannot infer rubber material from its classification or establish a36990 mapping. TFE monomer CAS116-14-3 cannot represent PTFE9002-84-0 dust; air-unspecified bindings are replaced by verified actual compartments when known. CN below1kV grid user-side supply only. Unresolved actual flow/provider/unit compatibility remains explicit."
    source_ids:
      - daikin-ptfe-moulding-2019
      - daikin-ptfe-m17-2016
      - teadit-ptfe-gaskets-2023
      - doing-ptfe-oven
  - rule_id: v_balance
    applies_to: "manufacturing/FG/non-WIP/packages"
    rule: "Independently verify physical mass/element closure and actual species/reaction-water evidence. Reconcile every package direction/stock and non-WIP charge vector, inherited production/service separation, opening/closing WIP/FG moisture and actual repair new/old components. No duplicated closing-FG output, internal purchase, automatic coproduct or residual-fitted emission."
    source_ids:
      - daikin-ptfe-moulding-2019
      - daikin-ptfe-m17-2016
      - jrc-ilcd-2010
  - rule_id: v_allocation
    applies_to: "shared burden"
    rule: "Document the actual attributional allocation need, dedicated/virtual subdivision, exchange-specific determining causality and only genuinely residual common-gate same-state contemporaneous market values; no fixed physical/economic split or automatic credit. Missing scientific evidence or unsupported relationships remain pending review."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Declared-unit upstream input to an actually compatible gasket/joint assessment"
  allowed_use: "Configuration-compatible attributional manufacturing inventory with disclosed service interval"
  excluded_use: "Universal plastic36990 coverage; sealing-service equivalence; oxygen/medical certification; automated mapping or methodology approval"
  required_metadata: "All required qualifiers; actual geography/time, material/supplier and full route; single Q; distinct service coverage; source lineage"
  required_quality_disclosure: "Uncertainty; actual sampling; failed/zero batches; WIP/FG/non-WIP vectors; native classification caveat; unresolved UUID/provider/compartment and service gaps"
  update_trigger: "Material form/grade or route/application change; drawing/specification change; utilities, species or allocation evidence change"
