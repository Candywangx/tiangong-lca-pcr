  semantic_boundary:
    decision: Material scan at87c4f9a1c found no authored external uncured SBR belt-cover supply PCR. Separate from dry E-SBR34800 polymer, tyre manufacture36111/12/13, camelback36115 and reclaim36210. One new semantic product record, no classification-driven generic rubber PCR.
    subset: Chinese primary compounding/sheet supply of unreinforced black SBR-based sulfur-curable complete uncured belt-cover compound; external net delivery Q, no tyre-plant intermediate or cured-stock substitution.
    evidence_synthesis: Independent Chinese supplier SBR belt-cover sheet/packaging evidence plus Indian uncured-sheet seller and industrial belt mixing context, with Dutch compounder finishing/supply corroboration. Not a single SKU, factory recipe or transferable numeric inventory. Site-specific actual approved formulation and final supplied uncured state remain required foreground facts.
  native_reference_decision:
    uuid: 51822322-6f49-4de3-858f-f2327cc8d9e9
    identity: Complete state100 remote exact01.01.000, Product flow, production mix at plant CN, mixing and compounding uncured, mass only. No CAS, fixed grade, separate geography/locationOfSupply or medium declared. Source comment identifies a belt-plant mixing-step reference; source-process role alone does not impose a different chemistry/form or bar independent external supply. Adopt broad physical identity only for the independently constrained finished uncured sheet subset; commercial final cure-pack completion, grade/form and net dispatch require actual evidence. CN native constraint remains binding.
    support: Exact mass property03.00.003 and its exact mass unit group03.00.003, reference kg; no latest and no secondary coefficient used as density.
    limitation_projection: Full limitations in the product card description in both languages, not only reference prose or manifest.
