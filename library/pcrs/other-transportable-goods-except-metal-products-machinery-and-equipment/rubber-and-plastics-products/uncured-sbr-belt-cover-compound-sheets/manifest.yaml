  unresolved_evidence:
    - Scientific review, independent translation review and publication remain pending; the narrower classification association is accepted in classifications/mappings/cpc-3.0-to-pcr.yaml.
    - Actual commercial grade-by-grade industrial recipe, full cure-package completion and final uncured-sheet acceptance/dispatch records must be collected; public sources do not provide the same-SKU recipe or numeric inventory.
    - No default ingredient loading, yield, energy/water intensity, reaction water, emissions, packaging lifetime, stock turnover or allocation fraction. Conditional cards do not prescribe an industrial recipe; additional actual exchanges must be separately represented.
    - Actual Q/P, failed/zero-output/rework runs, opening/closing WIP and finished-stock masses and burdens, returns/redelivery, utility returns and complete packaging movements require the stated protocols.
    - Allocation is confined to the declared attributional case under ILCD7.9.2/7.9.3; no full ILCD/PEF claim, unconstrained physical/economic choice or fixed recycling credit.
    - Initial support-cache export timed out during authenticated user lookup; successful exact-chain evidence must be read from the separately retained retry. No failed request is an empty match.
  range_evidence_needs: No portable numerical recipe, yield, utility or emission ranges established. Actual product/route/site measurements are the intended data source; ordinary future measurements/providers do not alone block authored maturity.
