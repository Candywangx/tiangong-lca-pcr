allocation_rules:
  - rule_id: allocation_scope
    applies_to: "compound_supply"
    rule: "Apply the following ILCD7.9.2/7.9.3 hierarchy only within the declared attributional study case. First subdivide or virtually subdivide and trace dedicated materials, operations, tests and supply burdens by exchange; one generic physical or revenue fraction cannot cover the plant."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_physical
    applies_to: "compound_supply"
    rule: "For each remaining shared exchange identify determining physical causality and attribute using a measured/quantifiable relationship, for example actual operation electricity or processing service with intensity evidence, and storage constrained by actual area/volume and duration. Neither mass nor machine time is an unevidenced default; different exchanges may have different determining drivers."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_remaining
    applies_to: "compound_supply"
    rule: "Only for residual shared burdens that cannot reasonably be assigned by the preceding steps, document why and then use actual coproduct market values at the same process exit location/state and quantity/quality. Retain price period, currency and product quantities and evidence any deductions for subsequent packing/transport value. This is not free physical/economic choice and imposes no fixed share. Allocated shares must reproduce original total burdens; unsupported relationships remain for review."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_returns
    applies_to: "compound_supply"
    rule: "Internal trim and return reprocessing create no new coproduct, negative purchase or default credit. For externally sold off-grade compound/recovery outlets establish each Product/Waste identity, actual recipient/treatment boundary and applicable method before adding separate atomic rows and attribution. No fixed recycling rate or avoided-burden credit is supplied. Packaging accompanying goods is not a coproduct."
    source_ids: []
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "compound_supply"
      flow_role: "terminal product and inventory"
      record_type: "weighing and cohort ledger"
      raw_fields: "lot; recipe; route; supplied sheet and moisture/release-preparation state; site; release event; new released mass P; unique dispatch ID; gross physical bare dispatch G; actual received returned mass R_phys and condition; original accepted-delivery quantity/vector reversal D_rev; return/redelivery and original reporting-cohort links; unique net accepted Q; disjoint opening/closing raw WIP finished bath/utility/equipment stocks and per-exchange carried vectors; actual rework additions/removals and repair WIP; packaging tare"
      collection_method: "Owner: production/QC and warehouse custodian jointly. Retain undivided actual period and cohort records; independently weigh every gross physical dispatch and return excluding detachable packaging, with supplied/returned moisture and retained preparation states. Keep P separate. Determine unique accepted-net Q using evidenced original delivery reversals and redelivery deduplication; never infer original reversal mass/vector from changed physical return mass or erase real gross movements. Carry prior FG and every inherited exchange vector with its original cohort, distinguish already assigned history from genuinely new rework/storage/packing increments, and record actual adjustments to prior delivery attribution. Q is not replaced by P, throughput or a first-release service denominator. At Q<=0 retain all real records, loads and historical corrections and issue no unit result."
      unit: "kg"
      frequency: "each event and period reconciliation"
      temporal_coverage: "whole actual reporting period and opening/closing cohort links"
      site_scope: "actual Chinese supplier site and dispatch gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; release/dispatch/return chain; physical stock count; prior-period burden ledger"
    - protocol_id: cp_material
      process_id: "compound_supply"
      flow_role: "each atomic ingredient"
      record_type: "batch weigh records and supplier specification"
      raw_fields: "ingredient and grade ID; as-supplied gross/tare/net; assay; moisture; carrier composition; receipt/issue/return; opening/closing stock; batch pass; failed runs; WIP transfer and carried burden"
      collection_method: "Owner: batch-room materials custodian. Record unnormalised period amounts for every actual grade and pass, including failed or zero-output batches, off-spec rework and carried opening/closing WIP. Distinguish purchased whole formulations from assayed constituents and internally blended preparations. Do not infer industrial ingredients from cured-property datasheets."
      unit: "kg"
      frequency: "each receipt and batch charge"
      temporal_coverage: "same raw period and product/route/form cohort as cp_delivery"
      site_scope: "weighing master/final mixing and bath preparation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier CoA; signed recipe; scales; batch IDs; transfer ledger"
    - protocol_id: cp_utility
      process_id: "compound_supply"
      flow_role: "each atomic utility and utility return"
      record_type: "stage-tagged meter records"
      raw_fields: "meter start/end; integrated volume; rate and duration where used; unit; pressure; temperature; enthalpy; density; steam/condensate mass; stage; failed runs; allocation driver; inventory burden transfer; steam_dryness_quality_phase; opening_closing_steam_condensate_line_equipment_holdup; each_actual_inlet_return_bleed_leak_mass_T_P_specific_enthalpy; actual_phase_receiver; sole_supplier_background_owner"
      collection_method: "Owner: utilities engineer. Retain raw electricity, external water makeup, thermal supply and actual return quantities for all included operations, including QC, cooling, compressors, capture, storage, packing and dispatch preparation. Record measured process-specific demand before shared loads. Rate times duration yields an amount; an already integrated volume receives no additional time multiplier. No division by Q during collection. Only if external steam is actually used by the facility or real QC, independently measure steam_water_supply, external condensate and actual bleed/leaks/hold-up without equal-state or equal-mass assumptions; heat MJ and physical kg stay separate. The steam heat card owns the supplier water/energy background once; the paired kg view creates no duplicate purchase or automatic credit. Physical quantities are not burden-allocated downward; existing single reporting and net-delivery Q rules remain."
      unit: "kWh; MJ; kg; m3"
      frequency: "continuous or each meter interval"
      temporal_coverage: "same actual period with opening/closing WIP and finished-stock burden carry"
      site_scope: "all included supplier operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; supply bills; property/temperature records; allocation decision by exchange"
    - protocol_id: cp_pack
      process_id: "compound_supply"
      flow_role: "each packaging input outward movement and waste"
      record_type: "independent physical packaging ledger"
      raw_fields: "specific article and composition; measured tare; actual new acquisition; actual external return received separately; opening/closing empty stock; attached-WIP stock; attached-FG stock; reusable pool; actual gross outward with each shipment; distinct outward empty return; waste; ownership and original cohort/vector; actual reconditioning/handling increments"
      collection_method: "Owner: packaging and warehouse custodian. Retain every raw physical direction independently of rubber net Q: opening empty/attached-WIP/attached-FG/reusable + actual new acquisitions + external returns received = corresponding closing stocks + actual outward with gross shipments + distinct empty returns outward + actual waste. Internal reuse cancels and is not another acquisition. A supplier-included article is physically recorded with its upstream-inclusion convention, not repurchased through its constituents. Separate physical quantity from consumed/pool-service burden attribution; allocation, reused turns, net product delivery or return reversal cannot reduce gross package movements. A distinct actual external return direction not represented by an existing specific atomic card requires its own article/direction card before data completeness is claimed. Measure actual pool/service evidence, not a default life."
      unit: "kg"
      frequency: "each movement and stocktake"
      temporal_coverage: "same actual period and supplied cohort; carry pre-existing stock burden"
      site_scope: "packaging area warehouse and dispatch gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare weights; purchase/movement records; packaging pool counts; waste receipts"
    - protocol_id: cp_outlet
      process_id: "compound_supply"
      flow_role: "each material outlet"
      record_type: "outlet weights and waste manifests"
      raw_fields: "outlet ID; wet/dry mass; composition; destination; captured versus emitted; internal return ID; WIP and bath inventories; treatment interface; off-grade sale status"
      collection_method: "Owner: production and environmental custodian. Measure raw separate physical outlets and actual tests, including zero-output losses, test slabs, trim, dust, bath bleed and sludge. Distinguish internal return from external sale/waste and liquid water from sludge moisture. Preserve related treatment and rework burdens; unmeasured losses remain gaps, not invented residual outlets."
      unit: "kg"
      frequency: "each batch and dispatch"
      temporal_coverage: "complete actual period including failed runs and carried inventories"
      site_scope: "supplier production and effluent interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; analyses; waste manifests; return ledger"
    - protocol_id: cp_emission
      process_id: "compound_supply"
      flow_role: "each elementary species and compartment"
      record_type: "species-resolved emission measurements"
      raw_fields: "species; compartment; concentration; gas/liquid actual flow; wet/dry conditions; pressure; temperature; reference conditions; integrated volume; rate-duration; control inlet/outlet; fugitive scope; detection limit"
      collection_method: "Owner: environmental engineer/laboratory. Retain raw species-specific period results and convert compatible concentration and total flow to emitted mass with documented conditions, without dividing by Q. Keep PM fractions and captured solids non-overlapping. Screening VOC/COD is not a molecular emission inventory or a fitted mass/water closure. Add one card for every other actual species and real fuel/refrigerant exchange before delivering a dataset."
      unit: "kg; mg/m3; m3; h"
      frequency: "campaign monitoring aligned to operating conditions"
      temporal_coverage: "same actual period with startup shutdown failures and rework"
      site_scope: "process and fugitive emission interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "species method; blank/calibration; detection limits; operating log; total volume trace"
  calculation_rules:
    - id: report_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q, once for a positive unique net accepted delivery Q from cp_delivery. Build undivided burden-bearing input A_i after raw unit/state conversions, disjoint raw/WIP/FG/bath/utility/equipment stock-vector carry and dedicated/shared attribution, correcting each stock once rather than adding receipts and already stock-corrected consumption together. Retain failed/zero-output runs, actual QC/rework/storage/packing and old-cohort histories, carry undelivered burdens and separate already assigned returned-production traces from genuine new increments. For physical gross shipment/return/package-outward, paired steam-water inlet and utility-return records, A_i is the measured physical direction quantity attributed to that actual cohort; associated burden allocation/stock carry remains a separate vector and never reduces an actual gross movement. Retain all raw acquisition, return, outlet and stock quantities independently. The product reference numerator is Q, so Q/Q=1 kg is the net view, not a third gross dispatch. Cards and aggregation_rule reuse this single stored result with no second division. At Q<=0 keep all real quantities/burdens and historical corrections without a unit result; do not use P or another cohort denominator."
      inputs:
        - A_i
        - Q
        - cp_delivery
        - cp_material
        - cp_utility
        - cp_pack
        - cp_outlet
        - cp_emission
      output: "a_i"
      source_ids: []
    - id: raw_conversions
      applies_to: "all inventory rows"
      rule: "Convert actual net weighing to kg; volume needs measured/evidenced density of the same supplied substance and state. Rate × duration produces a numerator; integrated volume gets no extra duration. Concentration and total gas/liquid quantity require matching conditions; retain electricity kWh and heat MJ with evidenced unit conversions. Steam enthalpy is not density. All conversions precede report_once."
      inputs:
        - cp_material
        - cp_utility
        - cp_pack
        - cp_outlet
        - cp_emission
      output: "converted raw numerators"
      source_ids: []
    - id: physical_closure
      applies_to: "compound_supply"
      rule: "Independently of normalization close each raw physical material/element control volume: opening disjoint stocks + actual external physical inflows = closing disjoint stocks + all actual gross external physical outflows. Use G for actual gross compound dispatch and R_phys for actual external returned compound; Q is a derived net reporting view, not an extra or substitute gross outflow. In FG, opening FG + internal release P + R_phys + actual rework material additions + opening repair WIP + independently evidenced moisture/species gains = closing FG + G + actual FG/rework waste or material removals + closing repair WIP + independently evidenced moisture/species losses. Close raw/WIP, bath, utility/equipment charge and separate packaging stocks without overlap; pair internal production/FG/repair transfers and cancel only those internal movements on consolidation. Retain every actual Product outlet, utility return, waste and emission. The net Q/Q reference output and the gross physical ledger are alternative linked views, never additive physical outputs. Only the verified same-state bridge can substitute Q for G minus the corresponding reversal; do not add R_phys again to that net view. Production does not add closing FG again after counting the same P. Packaging uses actual gross shipments/returns, not net Q. Actual aqueous/carrier/species and reaction-water terms require independent evidence; no COD or shared residual may fit two unknown sinks."
      inputs:
        - cp_delivery
        - cp_material
        - cp_utility
        - cp_pack
        - cp_outlet
        - cp_emission
      output: "raw mass element and burden reconciliations"
      source_ids: []
    - id: formulation_subledger
      applies_to: "compound_supply"
      rule: "Book each purchased preparation by its actual whole supplied mass and assayed active/carrier/water subledgers, with no duplicate procurement. Onsite preparation uses separately purchased actual ingredients and real blending energy/losses. Packaging has a separate physical subledger covering opening/closing stock, accompanying outward goods, discard, return and reuse; its tare is excluded from Q."
      inputs:
        - cp_material
        - cp_pack
        - cp_delivery
      output: "nonduplicated formulation and packaging ledgers"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Before UUID adoption inspect complete native name components, official EN/ZH names, CAS, route/form/grade, geography/locationOfSupply, type/compartment and every property. Follow exact referenced property version → exact unit-group version → reference unit; never latest or secondary-property-as-density."
      evidence: "query hit, complete state100 direct read and exact support chain; reject hard contradictions and disclose metadata debt"
    - id: coverage
      applies_to: "compound_supply"
      requirement: "Complete actual recipe, all-stage exchanges and applicability conditions; retain failed/zero-output/rework runs and opening/closing stock with carried burdens. Ordinary auxiliary UUID/future provider gaps do not erase atomic exchanges; real methodological or final-reference gaps require review."
      evidence: "batch recipe, complete ledgers/meters, QC and dispatch evidence; unmeasured is not zero"
    - id: evidence_limits
      applies_to: "compound_supply"
      requirement: "Technical synthesis does not claim one SKU/factory. No universal recipe, yield, energy/water intensity, reaction water, allocation share or lifetime. Data validity needs actual year, region, cohort, measurement and uncertainty evidence."
      evidence: "sld-belt-compound; hitkari-uncured-belting; somi-belt-mixing; flevo-compound-supply; epa-rubber-process-2008; ilcd-allocation-2010"
    - id: allocation_quality
      applies_to: "compound_supply"
      requirement: "Retain attributional case, subdivision and physical-causality judgment by exchange; only remaining burdens may use evidenced same-process-exit market values, with price/driver uncertainty disclosed."
      evidence: "ilcd-allocation-2010"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product"
    rule: "Confirm SBR base, carbon black, full sulfur cure package, uncured/unreinforced sheet state and independent external supply within selected native Chinese plant-compounding scope. Reject polymer, tyre/retread intermediates, camelback, reclaimed rubber, reinforced green belt or cured sheet substitution."
    source_ids:
      - sld-belt-compound
      - hitkari-uncured-belting
  - rule_id: validate_q
    applies_to: "all inventory rows"
    rule: "product must be the unique reference_flow_link terminal Product output with the reference UUID. Q must be unique positive actual net delivery, not P or gross throughput. Reconcile same-product/route/supply-state opening/closing WIP/finished stock with carried burdens, failure/rework and deduplicated return/redelivery, and apply report_once only once."
    source_ids: []
  - rule_id: validate_mass
    applies_to: "compound_supply"
    rule: "Check physical_closure and formulation_subledger including all actual external Product outlets/utility returns, packaging accompanying goods and complete packaging opening/closing/discard/return/reuse. Do not double-count preparation constituents, internal returns or stock after release, or invent species/reaction water from residuals."
    source_ids: []
  - rule_id: validate_evidence
    applies_to: "compound_supply"
    rule: "Original sources, all applicability limits and native restrictions must remain in consumable normative context; bilingual projection must preserve every field. Equal Schema/IDs alone cannot establish ingredient/supply-state, dimensions, missing core methodology or actual compatibility. Allocation follows only the declared attributional hierarchy; scientific review remains separate."
    source_ids:
      - ilcd-allocation-2010
      - epa-rubber-process-2008
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply a genuinely matched uncured cover-sheet input to downstream belt manufacture; model forming/curing separately"
  allowed_use: "Evidence-matched supplied state, route/recipe, site-region and period with explicit 1 kg net-delivery and packaging scope"
  excluded_use: "Default substitute for arbitrary rubber, base polymer, tyre compound, camelback, reclaimed rubber or cured articles; full ILCD/PEF or scientific-approval claims"
  required_metadata: "All Required qualifiers, raw protocol owners, Q/P and stock carry, allocation case/method, upstream provider compatibility, species/packaging/utility outlets"
  required_quality_disclosure: "Actual measurement/period coverage, gaps/uncertainty, technical-synthesis source limits and complete native Chinese plant broad-identity limits; disclose unmatched auxiliaries"
  update_trigger: "Material changes to recipe/base-rubber grade, cure package, supplied form/state, operations/boundary, measurement/Q gate, stock attribution or supporting native/method evidence"
data_sources:
  - id: "sld-belt-compound"
    type: "literature"
    reference: "Xiamen SLD Rubber, SBR Rubber Compound for Belt, web snapshot 2026-10-16, https://www.sldrubber.com/sbr-rubber-compound-for-belt.html"
    used_for: "SBR-based belt covering compound offered in China in flaky form with film/carton/pallet packaging. Does not establish uncured state, exact formula, black filler, cure package, quantities, performance or shelf life for this category."
  - id: "hitkari-uncured-belting"
    type: "literature"
    reference: "Hitkari Rubber Industries, Industries We Serve, Conveyor Belting subsection, web snapshot 2026-10-16, https://hitkarirubber.com/industries/"
    used_for: "Independent Indian manufacturer evidence for commercially supplied uncured conveyor-belting sheets, including wear-cover use. Not evidence of the Chinese supplier’s SKU/recipe, and adjacent retreading/matting sections are outside this subset."
  - id: "somi-belt-mixing"
    type: "literature"
    reference: "SOMI Conveyor Beltings Ltd., Stage Wise Process, steps 1–5, web snapshot 2026-10-16, https://somiconveyor.com/our-usp"
    used_for: "Industrial two-stage master/final mixing, curative addition, sheet formation, cooling, dust collection and utilities. Indian belt-plant case, not the same SKU or a universal process duration, equipment intensity, recipe or yield. Later fabric coating, belt building and curing are excluded; no magnetic-field mechanism is adopted."
  - id: "flevo-compound-supply"
    type: "literature"
    reference: "Flevo Rubber Compounding, Production, web snapshot 2026-10-16, https://www.rubbercompounding.nl/production/?lang=de"
    used_for: "Independent Dutch compounder’s internal mixing, finishing, sheet supply and customer-specific separation/packaging options. Does not establish a belt-cover recipe, mandatory release agent, packaging or supply quantity."
  - id: "epa-rubber-process-2008"
    type: "official_guidance"
    reference: "US EPA, Emission Factor Documentation for AP-42 Section 4.12 Manufacture of Rubber Products, Draft Final November 2008, §§2.1 and 4.1.1, https://www.epa.gov/sites/default/files/2020-10/documents/db04s12.pdf"
    used_for: "Historical US process/ingredient-specific mixing-emission context. No universal numerical factor or recipe is transferred, downstream vulcanization factors are excluded, and this technical report is not the LCA allocation authority."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment—Detailed guidance, first edition March 2010, complete §§7.9.2–7.9.3, printed pp.255–272, https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "LCA method authority for the declared attributional case: subdivision/virtual subdivision, exchange-specific determining physical causality and only then market value for remaining burdens at the same process exit condition. Not unrestricted physical/economic choice, consequential substitution, fixed shares, blanket recycling credits or full ILCD/PEF compliance."
