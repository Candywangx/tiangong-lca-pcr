system_boundary:
  rules:
    - rule_id: boundary_complete_supply
      applies_to: "compound_supply"
      rule: "Include actual ingredient weighing, all master/final mixing passes, cooling/straining/sheeting, separation treatment, real QC/test slabs, packing, finished-stock storage, handling and factory dispatch preparation, with actual burdens and wastes. Do not omit failed/zero-output runs, rework, shutdown cleaning or inventory carry. Do not apply the selected native identity to non-Chinese production or contradictory fixed routes."
