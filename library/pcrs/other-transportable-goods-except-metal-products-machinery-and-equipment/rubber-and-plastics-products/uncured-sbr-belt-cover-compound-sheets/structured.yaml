        - somi-belt-mixing
        - flevo-compound-supply
    - rule_id: boundary_delivery
      applies_to: "product"
      rule: "Terminal gate remains actual net accepted delivered Q, not new release P. Keep gross physical dispatch G, actual physically received returned compound R_phys and each evidenced original accepted-delivery reversal quantity D_rev separate. Do not assume D_rev equals R_phys when moisture, retained preparation, loss/rework, period or acceptance state differs. Link reversals/redelivery to the original lot and its exchange-level burden history without another delivery or new production. Only when the same state and scope are independently verified may Q = G - D_rev describe the net bridge; Q remains the cp_delivery unique accepted-net definition. Opening/closing undelivered FG and their carried burdens stay outside Q until genuinely delivered. Internal release handovers cancel on consolidation; actual external returns remain physical movements and are not internal cancellations."
      source_ids: []
    - rule_id: boundary_upstream_downstream
      applies_to: "compound_supply"
      rule: "The foreground receipt boundary does not remove upstream material/utility burdens. Customer belt reinforcement, belt building, bulk curing and customer transport/use/end-of-life are outside this factory-delivery boundary and need downstream models; real onsite cured QC slabs remain inside."
