allocation_rules:
  - rule_id: allocation_scope
    applies_to: "p_camelback"
    rule: "Use these rules only for an attributional study context requiring allocation, consistent with the declared study goal. First distinguish a separable black-box line, genuine joint production, shared services and internal trim recycling; these are not interchangeable. No automatic substitution/recycling credit or whole-PEF/ILCD conformity is asserted."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: allocation_causal
    applies_to: "all inventory rows"
    rule: "First collect separable stage data and use subdivision/virtual subdivision to assign exclusive ingredient, layer, meter and service burdens. Then determine physical causality separately for each remaining exchange: embodied mass where it determines material use, actual processing/energy demand for mixing/extrusion, and limiting occupied area/volume with duration for storage or limiting mass/volume with distance/time for handling. Justify the actual determining cause; a mass or revenue ratio alone is not evidence for every exchange."
    source_ids:
      - ilcd-2010-allocation
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only the remaining burdens that cannot be assigned by the preceding determining physical causality/virtual subdivision may use justified economic allocation. Use each real co-function output quantity and its market value at the same joint-process exit and specific state/quality/bulk condition; remove subsequent packaging, storage, transport or processing value where those stages are outside that exit. Document price source/period, residual burden pool and reasons no causal assignment is possible; retain uncertainty. Do not freely choose physical versus economic, set a fixed share, turn waste/returns into newly accepted product or grant avoided virgin-product credit. Allocated inventories sum to the original burden."
    source_ids:
      - ilcd-2010-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "p_camelback"
      flow_role: "new_camelback"
      record_type: "quality_release_ledger"
      raw_fields: "cohort/profile; layer batch ids; actual net weights; first release/reinspection flags; test results; liner tare; Q"
      collection_method: "Quality owner weighs/validates first accepted complete uncured strips using calibrated scales and traces unique lot events. Keep positive new mass, zero-output/failed lots and old return events separately. This protocol collects raw counts/masses and never A/Q. Original aggregation reconciliation (collection still retains undivided raw quantities): sum unique first-positive net accepted kg once as Q; reinspection and dispatch do not add Q."
      unit: "kg"
      frequency: "each batch and first acceptance"
      temporal_coverage: "complete matched actual production/cohort window"
      site_scope: "declared plant and product/profile/two-layer route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lot release/test records; duplicate-event reconciliation"
    - protocol_id: cp_material
      process_id: "p_camelback"
      flow_role: "individual recipe and formulation inputs"
      record_type: "recipe_charge_ledger"
      raw_fields: "actual supplied material/brand/formulation; layer and stage; gross/net charges; assay/solids/moisture; returns; recipe revision; failed lots; internal transfers"
      collection_method: "Compounding owner retains raw weigh tickets for each tread and cushion batch through nonproductive/final mixing and milling. Record whole purchased preparations once and constituent subledgers separately. Reconcile every ingredient and any additional actual one as its own atomic card; do not turn an unknown recipe into a presumed zero. No normalization here. Original aggregation reconciliation (collection still retains undivided raw quantities): retain raw attributable numerator A_i after stock/cohort attribution; report_once is the only A_i/Q."
      unit: "kg"
      frequency: "each charge/batch"
      temporal_coverage: "all attributable runs including failures and rework"
      site_scope: "both layer mixing/milling and actual compound storage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale tickets; supplier CoA; full formulation; stage batch links"
    - protocol_id: cp_utility
      process_id: "p_camelback"
      flow_role: "each utility lubricant and fuel"
      record_type: "metered_utility_ledger"
      raw_fields: "stage meter owner/coverage; start/end meters; duration only for rates; integrated volumes; conditions/density/enthalpy; lubricant and fuel stocks; supply and returns"
      collection_method: "Utility owner collects raw separate mixing, shaping, cushion application, cooling, dust control, tests and ancillary warehouse/handling records. Keep purchased steam/heat separate from onsite generation; record every real utility Product return. Meter shares require cp_allocation evidence. No A/Q at collection. Original aggregation reconciliation (collection still retains undivided raw quantities): raw-unit conversions precede report_once; retain A_i before division."
      unit: "kg; kWh; MJ; m3"
      frequency: "meter intervals and batch events"
      temporal_coverage: "same matched cohort including idle startup failed runs and rework"
      site_scope: "declared meter/utility boundary for all included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; utility invoices; return meters; heat and fuel records"
    - protocol_id: cp_output
      process_id: "p_camelback"
      flow_role: "each scrap coproduct and liquid outlet"
      record_type: "physical_outlet_ledger"
      raw_fields: "stream identity/composition/state; raw weight/volume and density; waste/product decision; recipient; offcut returns; failed/expired material; liquid/solid assays"
      collection_method: "Production/environment owner records actual cutting/conditioning/testing offcuts, rejects, dust, purges and washwater separately. Track internal trim return to the correct layer batch and real external exports; a stock residual is not a measured outlet. Record all actual additional external Product/utility outlets atomically. No A/Q. Original aggregation reconciliation (collection still retains undivided raw quantities): retain raw outlet A_i; reconcile physical/element ledgers before sole report_once division."
      unit: "kg; m3"
      frequency: "each outlet and reconciliation interval"
      temporal_coverage: "same production/cohort window with failed runs"
      site_scope: "complete line and pollution-control boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge/waste tickets; recipient; composition assays; return trace"
    - protocol_id: cp_emission
      process_id: "p_camelback"
      flow_role: "each actual elementary species"
      record_type: "species_measurement_ledger"
      raw_fields: "chemical species and air medium; concentration/time profile; integrated volume; gas conditions; actual fuel/solvent assays; control capture; moisture and stock changes"
      collection_method: "Environment owner identifies actual emitted species and obtains measured mass or concentration with matched integrated gas/liquid volume and conditions. Rates alone receive duration; integrated volume never does. Add actual species-specific cards where present; total VOC/COD or closure residual cannot substitute for species or reaction-water evidence. No A/Q. Original aggregation reconciliation (collection still retains undivided raw quantities): convert raw species mass first, then same report_once once; retain unmeasured scope explicitly."
      unit: "kg; mg/m3; m3"
      frequency: "representative complete measurement intervals"
      temporal_coverage: "matched operating failed/rework and control periods"
      site_scope: "declared outlet and fugitive air boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "analytical methods; sampling calibration; gas basis; capture/outlet reconciliation"
    - protocol_id: cp_stock
      process_id: "p_camelback"
      flow_role: "WIP finished and returned lots"
      record_type: "mass_and_carried_burden_ledger"
      raw_fields: "opening/closing WIP by layer/stage; mass and each carried exchange burden; first releases Q; opening/closing finished lots; actual dispatch; customer returns/reacceptance; prior cohort and internal handoffs"
      collection_method: "Production and warehouse owners jointly reconcile original raw period numerators and stock/carried burdens, including zero-output failures and all rework. Keep production and finished-warehouse accounts separate; cancel handoffs only on consolidation. Closing finished mass already released in Q is not another production outlet. Old returned material retains original burden; assign real incremental rework to its proper original cohort without counting a second release. Do not charge prior-cohort stock to current new Q or discard it. No normalization at collection. Original aggregation reconciliation (collection still retains undivided raw quantities): cohort-match raw A_i with opening carried burdens less closing carried burdens where still unfinished; transfer finished cohorts without adding another Q; use sole report_once only after attribution."
      unit: "kg; original exchange units"
      frequency: "each stage/lot event and period boundary"
      temporal_coverage: "complete declared cohort periods, including carried prior-period WIP/finished/return histories"
      site_scope: "all included stages plus finished warehouse and dispatch interface"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed stocktake; lot genealogy; per-exchange burden rollforward; return and dispatch records"
    - protocol_id: cp_pack
      process_id: "p_camelback"
      flow_role: "each packaging/release article and real handling"
      record_type: "packaging_and_handling_ledger"
      raw_fields: "each article composition; opening/closing unused and attached stock; new external procurement; package mass on released/dispatched/returned lots; damage/waste; return/reuse cycles; real handling/warehouse events"
      collection_method: "Packaging owner maintains a complete independent physical stock account for each material, including packaging leaving with product, waste, outward returns, incoming reuse and ending stocks. Packaging contributes burdens but never net rubber Q. A reused article is not purchased again. Preserve real packaging, storage and shipping loads; utility/fuel quantities are owned by cp_utility and attributed once, not duplicated here. No A/Q. Original aggregation reconciliation (collection still retains undivided raw quantities): preserve raw packaging/service A_i and complete material rollforward; same sole report_once operation after attribution."
      unit: "kg; actual handling service units"
      frequency: "each package/dispatch/return and stocktake"
      temporal_coverage: "same matched original product cohort with actual storage/dispatch period disclosed"
      site_scope: "packaging store, production release, finished warehouse and factory loading"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "package weights/BOM; stock and reuse logs; dispatch manifests; stage cost/meter linkage"
    - protocol_id: cp_allocation
      process_id: "p_camelback"
      flow_role: "shared services and any genuine joint products"
      record_type: "attributional_allocation_evidence"
      raw_fields: "declared attributional goal; distinguishable stages; per-exchange causal quantities; limiting capacity/time; all real joint outputs and exit-state quantities/prices; residual burden pool; price source and period"
      collection_method: "LCA owner first separates/subdivides stages and virtually assigns exclusive material/utility burdens. For each still-shared exchange establish its determining physical cause; only remaining unassignable burdens use justified same-process exit-condition market value. Keep the residual pool and reasons inspectable; no fixed allocation shares or credits. Collect raw amounts, never A/Q. Original aggregation reconciliation (collection still retains undivided raw quantities): attribute complete raw A_i before report_once; allocated totals must equal the pre-allocation inventory."
      unit: "original exchange units; kg; currency"
      frequency: "each shared service/co-product and relevant price interval"
      temporal_coverage: "same site, actual exit condition and relevant production/value period"
      site_scope: "actual joint process and all co-functions, with separate packaging/transport stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "process/meter causal evidence; justified subdivision limits; actual value records; reconciliation"
  calculation_rules:
    - id: report_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q; A_i is the complete same-product/profile, two-layer route, uncured state and matched-cohort raw numerator after conversion and justified attribution, including failed/zero-output runs, real rework and opening less unfinished closing WIP carried exchange burdens. Keep original finished/return cohorts and real storage/packaging/handling/dispatch burdens in their separate ledgers, cancel internal handoffs and charge incremental return work once to its proper cohort. Q is unique new first-positive accepted net kg from cp_release and must exceed zero; never add same-Q closing finished stock or reacceptance. This is the sole normalization; cards and aggregation_rule point to this same operation, never successive divisions. The reference output is 1 kg."
      inputs:
        - A_i
        - Q
        - cp_release
        - cp_material
        - cp_utility
        - cp_output
        - cp_emission
        - cp_stock
        - cp_pack
        - cp_allocation
      output: "a_i"
      source_ids:
        - epa-camelback-1973
        - ilcd-2010-allocation
    - id: physical_closure
      applies_to: "all inventory rows"
      rule: "Keep three explicit audit gates. Production: opening WIP + external mass-bearing production receipts + internal receipts = new first-released Q + actual already-released rework transfers + every other real production Product outlet (including sold compound, exported condensate and heat-transfer return water) + actual waste/elementary mass outlets + closing WIP + other internal transfers out. Finished warehouse: opening finished stock + new Q received + real external returned strips + internal rework receipts = actual external dispatch/reacceptance + transfers to rework + actual waste + closing finished stock. Q already contains same-cohort closing finished stock, which is never another production outlet. Each external crossing is entered once by its receiving/exporting owner; internal movements have equal paired entries. Consolidated line/warehouse/handling physical closure: opening WIP and finished stock + all actual external mass-bearing inputs and returned strips = actual external finished-strip dispatch + all other actual external Product/utility outlets + waste/elementary mass outlets + closing WIP and finished stock; cancel Q and every internal handoff rather than adding the nested ledgers. The reference quantity remains first release, not this physical dispatch mass; never equate the two gates. For each packaging material independently reconcile opening unused/attached/reusable stock + new external procurement + real external return receipts = packaging actually leaving attached to external product dispatch or as real outward return + waste + closing unused/attached/reusable stock. Packaging attached to new Q is only an internal stock transfer if still in the finished warehouse. Include all packaging masses and stocks once in the consolidated physical account, while never adding them to net rubber Q or procuring a reused article twice. Energy and service units are separate from mass closure. Audit each relevant element using actual compositions independently of whole physical mass; actual species or reaction water require independent evidence, never residual fitting."
      inputs:
        - cp_material
        - cp_utility
        - cp_output
        - cp_emission
        - cp_release
        - cp_stock
        - cp_pack
      output: "physical_and_element_accounts"
      source_ids:
        - epa-camelback-1973
    - id: raw_convert
      applies_to: "all inventory rows"
      rule: "Use actual assayed supplied formulation mass and separate constituent subledgers; onsite dilution/blending uses separately acquired materials and real energy/loss. Volume times compatible measured density yields mass; matched species concentration times integrated volume yields species mass after unit conversion. Multiply by duration only for a true rate, never an integrated volume. Distinguish water incorporated, physically evaporated, discharged and carried with stock; any actual reaction/species needs independent mechanism/assay evidence, not COD or fitted closure. No normalization occurs in this rule."
      inputs:
        - cp_material
        - cp_utility
        - cp_emission
        - cp_stock
        - cp_pack
      output: "converted_raw_numerators"
      source_ids:
        - epa-camelback-1973
  data_quality_requirements:
    - id: dq_native
      applies_to: "new_camelback"
      requirement: "The native Product flow names a manufactured finished camel-back strip, with production mix at plant, no specified recipe, grade, profile dimensions, cure state, geography/locationOfSupply or medium, no CAS, and only reference Mass. The broad native name does not prove the selected cushion-backed uncured profile, actual supplier, site or quantities. Apply this card only to the independently verified uncured extruded tread plus uncured cushion-gum backing for tractor-rear/OTR use; the selected manufacturer page excludes fast-moving commercial vehicles. No native global or CN/HK supply scope is invented. Finished means a finished supplied strip, not a vulcanized tyre."
      evidence: "Full native identity, exact property/unit versions and independent supplied-form evidence"
    - id: dq_recipe
      applies_to: "all inventory rows"
      requirement: "No numerical recipe, yield, utility intensity, emission fraction, layer ratio, cure temperature or shelf life is supplied by this PCR. Collect complete actual BOMs/whole preparations and add missing atomic exchanges. Auxiliary UUID/provider matching remains an actual identity/data task, not proof of missing core methodology."
      evidence: "Recipe revisions; full supplier formulation; plant measurements and acceptance evidence"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Q is the unique positive net mass in kg first accepted at the manufacturing quality-release gate for the same product/profile, two-layer route, uncured state and matched cohort; both rubber layers are included and removable release liner/transport packaging are excluded. Q is newly released production, not actual dispatch. Do not add closing finished stock of the same Q as another production output. Keep finished warehousing, packaging, handling and dispatch in a separate real ledger and cancel internal production-to-warehouse handoffs on consolidation. Returns/reinspection do not create new Q. A previously released return retains its original mass and burden; incremental rework is attributed once to the appropriate original cohort, with old-cohort stocks/burdens kept separate from current new production."
      evidence: "cp_release/cp_stock signed mass and burden reconciliation; all zero-output and return events"
    - id: dq_allocation
      applies_to: "all inventory rows"
      requirement: "Retain exchange-specific causal assignments before residual economic allocation; all shares reconcile to the actual original burden. Declare attributional scope and residual uncertainty, not full method-program compliance."
      evidence: "ilcd-2010-allocation; cp_allocation"
    - id: dq_packages
      applies_to: "all inventory rows"
      requirement: "Keep complete independent physical packaging stock, attachments, return/reuse, waste and outgoing product-package records; do not erase real warehouse/shipping loads, add packaging to Q or procure the same reused material twice."
      evidence: "cp_pack; cp_stock; cp_utility"
validation_rules:
  - rule_id: validate_identity
    applies_to: "new_camelback"
    rule: "Verify both rubber layers remain uncured in the supplied strip and declared profile/Tractor-Rear-OTR scope is supported. The reference UUID is a broad finished-strip identity, not proof of recipe, supplier geography or quantitative provider compatibility; preserve all limitations in this output card and dq_native."
    source_ids:
      - surya-camelback
      - patent-camelback-1965
  - rule_id: validate_gate
    applies_to: "all inventory rows"
    rule: "Q is the unique positive net mass in kg first accepted at the manufacturing quality-release gate for the same product/profile, two-layer route, uncured state and matched cohort; both rubber layers are included and removable release liner/transport packaging are excluded. Q is newly released production, not actual dispatch. Do not add closing finished stock of the same Q as another production output. Keep finished warehousing, packaging, handling and dispatch in a separate real ledger and cancel internal production-to-warehouse handoffs on consolidation. Returns/reinspection do not create new Q. A previously released return retains its original mass and burden; incremental rework is attributed once to the appropriate original cohort, with old-cohort stocks/burdens kept separate from current new production."
    source_ids:
      - epa-camelback-1973
  - rule_id: validate_complete
    applies_to: "all inventory rows"
    rule: "Require complete raw period numerators, failed/zero-output runs, WIP/finished/returned inventory and carried burdens, all actual external Product/utility outlets and packaging physical subledgers. Check atomically resolved exchanges, original-unit conversions, whole-preparation nonduplication and physical/element/species evidence independently; do not fit unknown water or emission to closure."
    source_ids:
      - epa-camelback-1973
  - rule_id: validate_allocation
    applies_to: "all inventory rows"
    rule: "Check declared attributional applicability, subdivision/virtual subdivision, per-exchange determining physical causality and only then documented residual exit-value allocation. Scientific approval and mapping acceptance require separate review; no fixed share, avoided-product credit or programme-compliance claim is implied."
    source_ids:
      - ilcd-2010-allocation
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified supplied uncured cushion-backed camelback strip input to a separately modelled tractor-rear/OTR retreading process"
  allowed_use: "Same declared profile/layer-state route and explicit first-release basis, with actual provider compatibility and cohort/packaging burden reconciliation"
  excluded_use: "Pre-cured interchangeable tread, generic compound, whole new/retreaded tyre, innerliner/tube/flap, narrow direct-wound ribbon or fast-moving commercial use; no tyre-kilometre or lifetime equivalence"
  required_metadata: "All reference qualifiers, actual recipe/formulation and layer identities, full native restrictions, stage owners, site/time, acceptance gate and first Q, WIP/finished/return and packaging physical/burden ledgers, actual providers and attributional allocation evidence"
  required_quality_disclosure: "Actual measured/estimated/missing quantities, unmeasured species, identity/provider gaps, stock/cohort completeness and residual causal/value uncertainty; packaging and dispatch completeness are explicit"
  update_trigger: "Product/profile/layer or cure-state change; route/recipe/formulation, site/provider, acceptance gate, stock handling or allocation-method change"
data_sources:
  - id: "surya-camelback"
    type: "handbook"
    reference: "Surya Rubber Industries, Unconventional Hot Rubber; https://www.suryarubbers.com/products/unconventional-hot-rubber"
    used_for: "Actual uncured extruded camelback with cushion-gum backing; tractor-rear/OTR scope and fast-moving-commercial-vehicle exclusion; no recipe, cure-setting or performance default."
  - id: "patent-camelback-1965"
    type: "literature"
    reference: "US3223572A, Machine for building a tread on pneumatic tires, 1965, conventional camelback background; https://patents.google.com/patent/US3223572A/en"
    used_for: "Historical supplied die-profile uncured strip and later tyre mould cure; narrow-ribbon winding invention is not this route. No historic dimensions, service life or settings adopted."
  - id: "epa-camelback-1973"
    type: "official_guidance"
    reference: "US EPA, 1973 Development Document for Tire and Synthetic Segment of Rubber Processing, printed pp.13,15,16,19 (PDF21,23,24,27); https://nepis.epa.gov/Exe/ZyPDF.cgi/20011LOU.PDF?Dockey=20011LOU.PDF"
    used_for: "Historical dry-compounding/milling, extrusion, cushion application, cooling and genuine trim return, linked explicitly to camelback. Technical synthesis with the manufacturer source, not one factory/SKU; no numeric recipe, yield, efficiency, emission factor, current regulation or LCA allocation inferred."
  - id: "ilcd-2010-allocation"
