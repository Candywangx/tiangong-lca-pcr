measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is unique newly first-quality-released net flooring kg for the same grade/state cohort, using calibrated gross-minus-core/package tare at a declared conditioning/moisture state. Include retained cured finish. Retesting, shipping or returning an already released roll never creates Q; closing FG already contains its first-release Q."
  - id: area_conversion
    applies_to: "reference product"
    required_property_ref:
      name: "Mass and area"
      uuid: ""
    required_unit: "kg; m2"
    rule: "Measure net same-lot finished mass m and usable roll area S independently; g = m/S kg/m2 and an area s converts to s*g kg. Exclude core, overlap, package and test/reject area. Do not copy source grammage, infer density from thickness or guess kg per roll."
  - id: supply_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass and supplied state"
      uuid: ""
    required_unit: "kg"
    rule: "Each purchased formulation is one complete supplied exchange counted once. Active fraction, carrier water and assay are subledgers, not additional purchases. Actual onsite formulation uses each separately purchased ingredient, energy and loss. Supplied nonvolatile solids do not automatically equal retained cured mass."
  - id: energy_units
    applies_to: "make_electricity; fg_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "The native energy chain is Units of energy 93a60a57-a3c8-11da-a746-0800200c9a66 with reference MJ. Convert integrated kWh to MJ using 3.6 before attribution; measured power rates alone require integration. Nameplate power is not consumption."
  - id: physical_state
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass and actual state"
      uuid: ""
    required_unit: "kg; m3; h"
    rule: "Integrate only genuine rates. Integrated gas/liquid volume is already an amount. Volume-to-mass conversion requires independently measured density of that substance at its actual composition/T/P; distinguish standard/actual and wet/dry gas. Do not apply water density to coating, solvent, effluent or gas or infer density from secondary flow properties."
