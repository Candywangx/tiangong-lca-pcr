system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "floor_make"
      rule: "Retain every real mixing/plasticisation/calendering/chipping, chip handling/consolidation, coating/UV cure, annealing/cooling, trimming/rolling/test step, including failed and zero-output lots, startup/shutdown, idle, cleanup, purge, test samples and actual regrinding/rework. The chip intermediate is not a purchased finished floor."
      source_ids:
        - ahf-homogeneous-2023
    - rule_id: boundary_formulation
      applies_to: "floor_make"
      rule: "Identify every separately purchased ingredient and whole supplied formulation. The listed branch is a technical synthesis, not a universal recipe. Add a distinct physically named input/outlet card for every actual unlisted pigment, additive, cleaning reagent, filter, lubricant, fuel, refrigerant or treatment chemical before dataset use; unknown amounts are not zero and cannot be hidden under other."
      source_ids:
        - ahf-homogeneous-2023
        - prodinex-pvc-2025
        - arkema-vinyl-formulation
    - rule_id: boundary_utilities
      applies_to: "floor_make"
      rule: "Record actual cooling/heating circuits and inlet/outlet states. The representative electric heating/UV branch assumes no combustion or purchased steam. If actually supplied, add the specific heat/steam/hot-water Product input and each real condensate/heat-exchange-water Product return, mass/T/P/enthalpy and provider energy/water convention. A boiler requires its own measured fuel, air/water, ash and individual species; an adjacent EPD's steam is not evidence of a circuit here."
      source_ids:
        - ahf-homogeneous-2023
        - prodinex-pvc-2025
    - rule_id: boundary_service
      applies_to: "fg_service"
      rule: "Keep first release Q separate from subsequent packing, storage, handling and dispatch. Pair internal Q transfer once. Keep opening/closing FG, physical returns, original shipment reversal and incremental service/rework by original release lot. Old lots retain old denominators/burden vectors; their delivery or reinspection creates no new Q."
      source_ids:
        - ilcd-allocation-2010
    - rule_id: boundary_water_species
      applies_to: "floor_make"
      rule: "Keep total physical mass and relevant C/Cl/Ca/Ti balances independent from measured chemical-species evidence. Water in a formulation, retained/free/phase water and actual reaction water are distinct; fusion, annealing or UV crosslinking does not justify default reaction water. Do not solve two unknown emissions/water quantities with one residual or convert VOC/COD into an assumed chemical mass."
      source_ids:
        - ahf-homogeneous-2023
        - arkema-vinyl-formulation
