allocation_rules:
  - rule_id: allocation_scenario
    applies_to: "all inventory rows"
    rule: "This method is attributional and applies where allocation is required by the study goal/context. Establish actual functions and physical/legal/economic state of every output; the industrial manufacturing sources do not establish LCA allocation. Do not freely choose between physical/economic keys or claim complete ILCD/EPD conformance."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_subdivide
    applies_to: "floor_make; fg_service"
    rule: "First collect dedicated operations and exclusive inputs by grade, lot and service. Use real subdivision, then technically justified virtual subdivision where a quantitative relationship identifies exclusive exchanges; record infeasibility and potential distortion for any retained shared process. Internal chips/regrind retain original burdens, never displacing a second purchase by an automatic credit."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_causality
    applies_to: "all inventory rows"
    rule: "For each remaining exchange identify and substantiate the determining physical causal relationship to each co-function, including the actual load/temperature/cure/time/space mechanism as relevant. Material incorporation, heat duty and occupied space-time need not use the same key. Surface-area or mass shares alone are not causal proof, even if used by an industrial EPD. Retain drivers, sums and sensitivity."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "all inventory rows"
    rule: "Only genuinely residual exchanges without a supported determining causal relationship use contemporaneous market values at the common process gate in the actual condition, quality, quantity and packaging state. Remove evidenced subsequent processing, storage, packaging and transport value. Document price basis, missing/negative/zero values and sensitivity; missing values need review, not equal or fixed shares."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_conserve
    applies_to: "all inventory rows"
    rule: "All assigned shares reconcile to the undivided exchange. A useful externally transferred material requires actual specification and a justified function; waste fees or recovery do not automatically create coproducts, zero burdens or avoided-production credits. Waste/recycling cases needing an additional method remain explicitly unresolved until supported; this PCR supplies no default recycled-content or end-of-life formula."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_fg
    applies_to: "fg_service"
    rule: "Assign each observed service to its original released lot and preserve old denominators. Returns reverse their actual prior shipment/vector and receive only real incremental service/rework. Unattributed startup/idle/failed-campaign loads remain visible and require justified assignment; they cannot disappear because output is zero."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "floor_make"
      flow_role: "Individual resin/filler/plasticizer/stabilizer/pigment/additive/cleaner inputs and actual scrap/product transfers"
      record_type: "weighing_and_supply_record"
      raw_fields: "lot_id; supplier_grade; physical_form; whole_formulation; gross_mass; tare; net_mass; assay; moisture; opening_raw; receipts; closing_raw; issued_mass; recovery_transfer; waste_destination; raw_unit; calibration_id"
      collection_method: "Weigh each actual complete supply and issue separately; reconcile opening plus receipts minus closing raw stock, excluding separately tracked supplier containers. Link raw resin mixing through chip/sheet stages and each reject/purge destination. Preserve whole preparation and composition subledgers; no normalized values collected."
      unit: "kg"
      frequency: "every receipt/issue/run/waste transfer"
      temporal_coverage: "complete campaign including failed and zero-output trials plus stock cutoffs"
      site_scope: "one specified line and compatible grade/formulation cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weighing; invoices; batch sheets; supplier specifications; waste tickets; material reconciliation"
    - protocol_id: cp_finish
      process_id: "floor_make"
      flow_role: "uv_finish; spent_finish"
      record_type: "coating_and_cure_record"
      raw_fields: "coating_sku; formulation; supplied_wet_mass; solids_water_solvent; opening_finish; receipts; closing_finish; application_mass; retained_cured_mass; uncured_residue; volatile_species; coat_area; lamp_type; UV_dose; cure_test; raw_unit"
      collection_method: "Weigh whole supplied finish, application issues and actual residues; determine retained finish on matched test pieces and validate cure independently. Retain measured constituents and actual evaporative/chemical fates; no assumed full retention, condensation water or zero volatiles."
      unit: "kg; m2; measured UV dose"
      frequency: "each coating lot and cure interval"
      temporal_coverage: "full coat/cure campaign including lamp warmup and cleanup"
      site_scope: "actual coating station and same finished grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "coating SDS/TDS and supplier composition; calibrated scales; before/after tests; cure and UV equipment records"
    - protocol_id: cp_energy
      process_id: "floor_make"
      flow_role: "make_electricity"
      record_type: "meter_record"
      raw_fields: "meter_id; voltage; provider; geography; interval_start; interval_end; kWh_start; kWh_end; measured_power_rate; operating_state; causal_driver; idle_load; shared_load; allocation_decision"
      collection_method: "Read integrated calibrated meter differences for each real unit operation and ancillary system; integrate only actual power rates if needed. Preserve undivided raw energy, convert kWh to MJ then attribute under section 7 and carry stock vectors; normalize_once alone generates the reported intensity."
      unit: "kWh; MJ"
      frequency: "each production/idle/startstop/cleanup interval"
      temporal_coverage: "full campaign matched to WIP and release cohort"
      site_scope: "declared actual customer-side voltage and provider; electric branch only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "submeter calibration; bills; equipment/load map; time logs; allocation sensitivity"
    - protocol_id: cp_water
      process_id: "floor_make"
      flow_role: "make_water; cooling_purge; water_vapour"
      record_type: "water_state_balance_record"
      raw_fields: "raw_unit; opening_loop; closing_loop; opening_loop_B_i; closing_loop_B_i; makeup; internal_recirculation; liquid_purge; entrained_droplets; supplied_carrier_water; retained_water; humidity_in; humidity_out; measured_vapour; density_evidence; temperature; pressure; actual_rate; duration; receiver"
      collection_method: "Independently meter/weigh actual makeup, loop stocks, liquid outlets, retained water and vapour; collect composition and actual state. Preserve integrated readings and integrate only rates. Reconcile separate heat-supplier return arrangements if present; do not use a mass residual to invent two water/species quantities. Preserve separately accounted loop-water quantities and their exchange-specific inherited burden vectors at both cutoffs; do not also include the same stocks in WIP or raw stores."
      unit: "kg; m3; h"
      frequency: "each interval and stock cutoff"
      temporal_coverage: "complete operation and cleanup"
      site_scope: "actual cooling/cleaning circuit and its external interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meters; water-quality assays; humidity records; receiver and heat/water contracts"
    - protocol_id: cp_species
      process_id: "floor_make"
      flow_role: "hcl_air; ipa_air; ozone_air; escaped_dust; spent_ipa; oxygen_uptake"
      record_type: "species_specific_monitoring"
      raw_fields: "species_id; CAS; actual_medium; sampling_point; measured_concentration; integrated_volume; actual_volume_rate; sampling_interval; T; P; wet_dry_basis; capture_efficiency; composition; uncertainty; detection_limit; waste_mass; receiver"
      collection_method: "Use actual chemical-specific sampling and state-correct volumes; concentration times integrated volume is already an amount, while a true volume rate must first be integrated. Keep each gas species and each destination separate and particle bins disjoint. Do not convert total VOC/COD/opacity to an assumed species, or count captured matter again as air release. Add actual unlisted species before use."
      unit: "kg; source measurement units"
      frequency: "every representative operating state including upsets and cleanup"
      temporal_coverage: "full campaign with sampling representativeness disclosed"
      site_scope: "actual process exhaust/air uptake/cleaning receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring method and calibration; laboratory speciation; limits/uncertainty; capture and waste transfer evidence"
    - protocol_id: cp_release
      process_id: "floor_make"
      flow_role: "released_floor"
      record_type: "unique_release_record"
      raw_fields: "grade; roll_id; original_lot; first_release_flag; release_time; gross_mass; core_tare; package_tare; net_mass; moisture_state; measured_length; measured_width; retained_finish; accepted_test; reject_mass; repeat_release_id"
      collection_method: "Weigh conditioned accepted rolls on calibrated scales, subtract all detachable tare and match cure/dimensional/performance acceptance. Deduplicate by original first-release ID and exclude old released rework, repeats and rejected tests. Sum net unique new released mass as Q; independently measure usable area for any area conversion."
      unit: "kg; m; m2"
      frequency: "every roll and release decision"
      temporal_coverage: "same campaign and stock cutoff"
      site_scope: "same specified product grade and physical state"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/tare records; first-release register; test results; dedup/reject trail; actual area/mass sampling"
    - protocol_id: cp_stock
      process_id: "floor_make"
      flow_role: "Every raw exchange and chip/sheet/WIP/rework transfer"
      record_type: "lot_and_burden_vector_record"
      raw_fields: "lot_id; parent_lot; opening_WIP; closing_WIP; opening_in_process; closing_in_process; opening_in_process_B_i; closing_in_process_B_i; internal_chip; internal_regrind; current_raw_exchange_i; opening_B_i; closing_B_i; transfer_B_i; cohort_id; historical_Q; failure_load; allocation_record; physical_outlet"
      collection_method: "Track quantity and every exchange-specific inherited burden vector through mixing/chips/sheet/cure and real rework. Carry opening vectors plus attributable current undivided additions and reconcile closing/transfer vectors without equating mass fraction to every exchange burden. No hypothetical same-intensity stock is assumed. Preserve failed-campaign loads even if Q is zero. Include separately accounted in-process inventories, including cooling-loop water and actual equipment/finish charges, with their own physical states and inherited vectors. Identify and eliminate overlap with raw stocks, WIP and FG."
      unit: "kg and each exchange's native unit"
      frequency: "each lot transfer and opening/closing cutoff"
      temporal_coverage: "all relevant prior-lot histories plus complete current campaign"
      site_scope: "line/WIP/regrind/rework interfaces with matching cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "lot genealogy; measured stock; per-exchange vector reconciliation; historical release/return records; missing-vector disclosure"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "release_to_stock; customer_return; old_rework_receipt; gross_dispatch; rework_to_make; fg_reject"
      record_type: "finished_stock_return_record"
      raw_fields: "original_release_id; original_Q; opening_FG; new_Q_transfer; old_rework_receipt; physical_customer_return; original_dispatch; reverse_B_i; gross_dispatch; rework_to_make; FG_waste; closing_FG; opening_B_i; closing_B_i; incremental_service_i; observation_dates"
      collection_method: "Weigh physical FG/returns and retain original release/shipment vectors; reverse actual prior delivery for physical returns and identify incremental rework. Reconcile the FG gate independently; carry old cohorts separately from new Q. Pair internal transfers with manufacture and cancel only those matched transfers in consolidation."
      unit: "kg and each exchange's native unit"
      frequency: "every stock/shipment/return/rework movement"
      temporal_coverage: "original histories and declared observed FG interval"
      site_scope: "specified FG store and original release cohorts"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stocktake; dispatch/return slips; historic burden records; commercial versus physical return distinction"
    - protocol_id: cp_fg_energy
      process_id: "fg_service"
      flow_role: "fg_electricity"
      record_type: "service_meter_record"
      raw_fields: "meter_id; kWh_start; kWh_end; voltage; provider; geography; original_release_id; occupied_space; duration; handling_load; idle_cleanup; attribution_driver"
      collection_method: "Separately meter actual packing/storage/handling/loading and real idle/cleanup; convert raw energy before attribution, assign to original release lot using documented service mechanism and carry its historic denominator. Do not put old-cohort services in new production Q."
      unit: "kWh; MJ"
      frequency: "each service interval"
      temporal_coverage: "explicit observed service window including old FG"
      site_scope: "actual FG service equipment and customer-side supply"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "service meters; load/space-time records; calibration; cohort assignment and open-tail disclosure"
    - protocol_id: cp_package
      process_id: "fg_service"
      flow_role: "Each named package input, gross outward shipment, waste and pallet external return"
      record_type: "individual_package_stock_record"
      raw_fields: "package_article; supplier_composition; raw_unit; unit_net_mass; opening_empty; opening_attached_WIP; opening_attached_FG; opening_reusable; purchases; external_return_received; closing_empty; closing_attached_WIP; closing_attached_FG; closing_reusable; gross_ship_out; external_return_out; waste; internal_reuse; repair; cycle_history"
      collection_method: "For each article weigh/measure actual whole supplied mass and reconcile its separate physical ledger. Delivered ingredient/coating containers need their own specifically named input/return/waste cards when present, whether separately invoiced or bundled. Attached shipping packages follow gross physical shipments including repeats, not net product Q. Count internal reuse as a cancelling transfer and external returns as their own movements. Preserve real per-article mass if purchasing counts; never guess kg/item."
      unit: "kg; item with separately measured kg/item"
      frequency: "each receipt/application/shipment/return/disposal and cutoff"
      temporal_coverage: "full supply and FG service interval with prior cycle history"
      site_scope: "each named package across raw/WIP/FG/reusable locations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; purchase/return records; packaging specifications; stocktake; cycle/repair and gross-shipment reconciliation"
  calculation_rules:
    - id: raw_unit_conversion
      applies_to: "all inventory rows"
      rule: "Preserve original readings. Convert calibrated raw mass/energy/volume/rates into each row unit before attribution; kWh * 3.6 gives MJ. An independently measured rate is integrated once, whereas an integrated amount is not multiplied by time. State-specific density is independently evidenced."
      inputs:
        - cp_material
        - cp_finish
        - cp_energy
        - cp_water
        - cp_species
        - cp_fg_energy
        - cp_package
      output: "Undivided converted raw exchange amounts"
      source_ids: []
    - id: cohort_numerator
      applies_to: "all inventory rows"
      rule: "For each exchange i, reconcile opening inherited B_i plus section-7-attributed undivided current additions against closing/transfer B_i. Carry actual WIP, regrind, prior released lots and failed-campaign vectors independently. Assign the resulting A_i to its own original release cohort, retaining waste burdens unless an evidenced co-function assignment changes them. Do not subtract waste mass as an avoided input or use a single stock ratio for every B_i. Carry separately accounted in-process stock vectors through the same reconciliation, including loop water, without treating a stock movement as new production or erasing retained historical burden."
      inputs:
        - cp_stock
        - cp_fg
        - cp_material
        - cp_finish
        - cp_energy
        - cp_water
        - cp_species
        - cp_fg_energy
        - cp_package
      output: "A_i in the card unit before any division"
      source_ids:
        - ilcd-allocation-2010
    - id: release_denominator
      applies_to: "released_floor"
      rule: "Q = sum of unique newly first-released conditioned net flooring kg in cp_release, including retained finish and excluding detachable package/core. Do not add closing FG or re-released/returned/reworked old material to Q."
      inputs:
        - cp_release
        - cp_stock
        - cp_fg
      output: "Q"
      source_ids: []
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q once for Q > 0; Q belongs to that original release cohort. The released_floor reference output is 1 kg. For Q = 0 retain real raw/attributed burdens and stocks in a failed-campaign ledger and report no unit result; future assignment requires evidence. Card/aggregation references identify this same operation and never divide x_i again."
      inputs:
        - A_i
        - Q
        - cp_stock
        - cp_fg
        - cp_release
      output: "x_i per 1 kg reference flow, or no unit result for Q = 0"
      source_ids: []
    - id: manufacturing_physical_gate
      applies_to: "floor_make"
      rule: "Opening WIP + opening separately accounted in-process stocks + net actual non-uptake material issues + old released rework received + separately measured net uptake = closing WIP + closing separately accounted in-process stocks + new Q + old rework back to FG + external product/waste/elementary material outlets. Include cooling-loop water and actual equipment/finish charges among in-process stocks only when not already counted in raw stocks or WIP; reconcile each circuit/material separately. Count every physical input, including net oxygen uptake, exactly once; chemical reaction creates no total mass. Internal chip/regrind transfers cancel and electricity is outside physical mass. Apply corresponding independent C/Cl/Ca/Ti balances; unknown species are not fitted residuals."
      inputs:
        - cp_material
        - cp_finish
        - cp_stock
        - cp_release
        - cp_water
        - cp_species
      output: "Manufacturing mass and independent relevant element/species reconciliations"
      source_ids: []
    - id: fg_physical_gate
      applies_to: "fg_service"
      rule: "Opening FG + Q transfer + customer physical returns + old rework receipt = closing FG + gross physical dispatch + rework_to_make + FG waste. Perform the same reconciliation for each inherited burden vector, adding only actual services/rework and reversing original delivery."
      inputs:
        - cp_fg
        - cp_stock
        - cp_release
        - cp_fg_energy
      output: "FG quantity/vector reconciliation"
      source_ids: []
    - id: combined_physical_gate
      applies_to: "floor_make; fg_service"
      rule: "After matched Q and rework transfers cancel: opening WIP + opening FG + opening separately accounted in-process stocks + external non-uptake material issues + customer physical returns + separately measured net uptake = closing WIP + closing FG + closing separately accounted in-process stocks + gross physical dispatch + external product/waste/elementary material outlets. Include the same loop/equipment/finish stocks as the manufacturing gate without duplicating raw/WIP/FG inventories. Every input and uptake appears once. Q remains a first-release production statistic, not an extra external physical output beside FG. Keep packaging outside product net mass and in package_balance."
      inputs:
        - cp_stock
        - cp_fg
        - cp_release
        - cp_material
        - cp_finish
        - cp_water
        - cp_species
      output: "Consolidated physical reconciliation without duplicate Q"
      source_ids: []
    - id: package_balance
      applies_to: "fg_service"
      rule: "For each package article separately: opening empty + opening attached WIP + opening attached FG + opening reusable + purchases + external returns received = closing empty + closing attached WIP + closing attached FG + closing reusable + attached gross physical shipments out + external returns out + waste. Internal reuse cancels. Do not replace gross shipments with net Q or treat returned/reused articles as another purchase or coproduct."
      inputs:
        - cp_package
        - cp_fg
      output: "Separate physical and burden ledger for each package"
      source_ids: []
    - id: area_descriptor
      applies_to: "reference product"
      rule: "g = same-lot conditioned net m / measured usable area S; area s corresponds to s*g kg. Preserve measured mass, area, thickness, finish and acceptance state; no density inferred from this ratio."
      inputs:
        - cp_release
      output: "Grade/state-specific measured kg/m2 and area descriptor"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Preserve complete supplied preparation and one atomic physical exchange; match all native CAS/form/route/type/property restrictions, official Chinese UUID names and actual provider. Blank auxiliary UUIDs remain explicit identity work, not a generic binding."
      evidence: "Supplier specifications; exact native records; compatible provider review; individually named unresolved rows"
    - id: dq_primary
      applies_to: "floor_make"
      requirement: "Collect real undivided measurements covering raw ingredients through cured inspected rolls, including every failed/idle/cleanup/rework state. Published cases are route evidence, not primary factory quantities."
      evidence: "Calibrated meters/scales; batch sheets; full-period logs; stock and cure evidence"
    - id: dq_vectors
      applies_to: "floor_make; fg_service"
      requirement: "Preserve all opening/closing WIP/FG quantities and every exchange-specific historic vector, actual first-release/dispatch/return lineage and incremental services. Unknown histories or open service tails remain explicit completeness gaps in the dataset. Separately accounted in-process circuit/charge quantities and each inherited exchange vector obey the same duty, without overlapping product/raw inventories."
      evidence: "Lot genealogy; historical B_i; return reversals; observed interval and physical gates"
    - id: dq_species
      applies_to: "floor_make"
      requirement: "Independently support total mass/element balances, real species and water states. Report detection limits, representativeness, uncertainty and unresolved fates; balance closure alone is not species identification."
      evidence: "Independent material/element/speciation/water records and sensitivity"
    - id: dq_complete
      applies_to: "all inventory rows"
      requirement: "Add every actual missing single material, utility, package, waste, gas species and destination before declaring a dataset complete. Explain evidenced absence; never hide actual flows in zero/other."
      evidence: "Equipment and supplier inventory; outlet survey; per-article package balance; unmeasured/gap register"
    - id: dq_source_limits
      applies_to: "all inventory rows"
      requirement: "No case-specific recipes, energy/steam, source lifetime/certifications, waste omission or industrial area-allocation transfer. Technical synthesis and attributional-method conditions remain visible."
      evidence: "Source-specific route/state assessment; declared dataset bounds; section-7 decisions"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Verify actual compact through-pattern PVC roll construction and the complete chip-consolidation/UV-finish route, including real raw-material receipt and final tests. A generic covering UUID or CPC leaf alone does not establish applicability."
    source_ids:
      - ahf-homogeneous-2023
  - rule_id: validate_reference
    applies_to: "released_floor"
    rule: "Verify all required qualifiers, one unique first-release Q, actual conditioned net mass/tare and retained finish, same bilingual reference link/basis, and no repeated release or FG double count."
    source_ids:
      - ahf-homogeneous-2023
  - rule_id: validate_accounting
    applies_to: "all inventory rows"
    rule: "Verify unit conversion and real attribution before the undivided A_i; perform normalize_once once only for positive original-cohort Q. Q-zero loads remain visible without a unit result. Check complete finite measurement relationships without calling unknowns passed."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_gates
    applies_to: "floor_make; fg_service"
    rule: "Independently reconcile manufacturing, FG and consolidated physical gates, all WIP/FG exchange vectors and each packaging ledger. Historic customer returns reverse original shipment/vector; actual additional rework is separately attributable, never new production. Check opening and closing separately accounted in-process stocks, including cooling-loop water, in both manufacturing and combined equations, with each actual uptake and input counted once."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_species
    applies_to: "floor_make"
    rule: "Independently verify water states, mass/element and species evidence. Reject one-residual/two-unknown closure, integrated-volume double integration, guessed density, total-VOC/COD-to-species conversion or captured-plus-air double counting."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "all inventory rows"
    rule: "Verify the attributional context, subdivision and exclusive/virtual assignments, exchange-specific determining physical causality, then only genuine residual common-gate contemporaneous market value. No fixed shares, arbitrary mass/area/economic choice, automatic recovery credit or unsupported waste-method claim."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_completeness
    applies_to: "all inventory rows"
    rule: "Check each actual atomic flow and destination, composition/provider limits, exact UUID property/unit chain, old failure records and missing data. Ordinary auxiliary/provider work is distinct from unresolved core route/terminal/method gaps; missing factory evidence blocks that dataset's completeness, not a fabricated scientific approval."
    source_ids: []
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Manufacturing supply inventory for the same qualified PVC sheet grade, route and declared gate; separately linked installation and life-cycle modules"
  allowed_use: "Mass-based manufacturing modelling after matching product/finish/supplier/voltage/state; area conversion only with same-grade measured kg/m2"
  excluded_use: "Generic coverage of all CPC 36910; wallpaper/wall/ceiling/adhesive/rigid-core/foam/tile routes; installed-lifetime comparison; EPD certification; default recipe/steam/credit; scientific or translation approval"
  required_metadata: "Product and each supplied preparation; route and equipment; first-release cohort and Q; net mass/area/state; cure and acceptance; site/period/voltage/providers; WIP/FG vectors and return lineage; each package and observed services; upstream and downstream boundary"
  required_quality_disclosure: "Sampling/calibration/uncertainty; source transfer limits; native identity and provider restrictions; unresolved auxiliary UUIDs; actual missing quantities/stocks/species; Q-zero failures; allocation sensitivity; unobserved FG service tails"
  update_trigger: "Changed resin/formulation/coating/construction/route; new energy or heat circuit/provider; revised acceptance/return policy; materially changed stock/service regime; better primary evidence or corrected native identity"
data_sources:
  - id: "ahf-homogeneous-2023"
    type: "literature"
    reference: "AHF Products / SCS, SCS-EPD-08964, 10 May 2023, AHF Contract Homogeneous Sheet, PDF pp.3–6 and p.11: https://www.ahfcontract.com/cdn/content/sites/10/EPD-AHFContract-Homogeneous.pdf?download=true"
    used_for: "Homogeneous coated roll endpoint, raw-ingredient-to-chip/consolidation/UV/annealing/roll route, quality checks and paper/board packaging; 2021 South Korea case only. No recipe/grammage/lifetime/performance/area allocation transferred."
  - id: "prodinex-pvc-2025"
    type: "literature"
    reference: "Stichting MRPI, Prodinex PVC/LVT dryback flooring, 1.1.00809.2025, 24 April 2025, PDF pp.2–4: https://www.mrpi.nl/epd-files/epd/1.1.00809.2025%20MRPI%20EPD_PVC%20flooring%20Prodinex.pdf"
    used_for: "Independent adjacent material example naming DOTP, CaZn and polyurethane acrylate; multilayer hot-press counterexample. No homogeneous-route proof, quantitative transfer, steam assumption, loss/default waste boundary, certification or allocation authority."
  - id: "arkema-vinyl-formulation"
    type: "extension_guidance"
    reference: "Arkema Plastic Additives, Plastic Additives for Luxury Vinyl Tile, undated publisher page: https://plasticadditives.arkema.com/en/innovation/luxury-vinyl-tile/"
    used_for: "Technical material-choice synthesis and conditional ESBO/stearic-acid/acrylic-aid/TiO2 cards; North American LVT substrate examples and alternative rigid tin-stabilized recipe remain countercontext, not homogeneous-floor recipe, mandatory additions or numeric defaults."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition 2010, §§7.9.2–7.9.3, PDF pp.275–288, printed pp.255–268: https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Conditional attributional subdivision/virtual subdivision, exchange-specific determining physical causality, genuine residual common-process-gate economic value and conservation. No industrial recipe, waste/recycling default, QFD product-function allocation or full-method conformity claim."
