  identity_limits: "Selected native Product identities establish only qualified material/form/route/unit compatibility. Generic plastic-covering alternatives are restricted to one finished floor roll; calcium-carbonate and DOTP classification imperfections remain disclosed; tap-water historical classification remains archival. Selected low-voltage electricity has native CN supply geography and applies only at the actual Chinese <1kV customer gate; other geographies/voltages need separately verified identities. The Korean source case does not override this native restriction. Blank UUID rows remain specific."
  rejected_candidate_limits: "The separately read ozone candidate has a contradictory Chinese synonym naming dinitrogen trioxide; do not bind that identity without resolving the conflict. The PVC candidate is a Waste flow with light/heat route; generic plasticizer is composition-free; UV candidates are optical/electronics or internally contradictory; TiO2 candidate has a conflicting Chinese chemical synonym. None is adopted as the required complete raw supply."
