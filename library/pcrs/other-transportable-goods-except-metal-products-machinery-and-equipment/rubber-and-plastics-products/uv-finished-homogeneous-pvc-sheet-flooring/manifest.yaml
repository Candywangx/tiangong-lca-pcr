  semantic_boundary: "Independent raw-ingredient homogeneous chip-consolidated UV-finished floor-roll method. Existing paper-wallpaper and wood-floor methods and frozen PVC-profile/LDPE-film/XPS/LDPE-bag intakes do not cover it; other active slots considered by queue scope only."
  source_synthesis: "AHF route and endpoint, adjacent Prodinex chemistry/counterroute and Arkema material alternatives are a technical synthesis, not one SKU/factory/order. Industrial EPD allocation, recipes, heat circuits and quantitative values are not transferred."
  packaging_outward_flows: "Each actual paper core, paper wrap, corrugated sleeve, LDPE film, wood pallet and PP strap has its own gross-shipment Product outlet, distinct from waste and owner-directed pallet returns. Physical outbound mass is not reduced by allocation or returns and is never flooring reference mass."
  physical_stock_accounting: "Manufacturing and combined balances include separately accounted in-process loop/equipment/finish stocks and their inherited exchange vectors without overlap with raw/WIP/FG. Net oxygen uptake and other physical inputs are each counted once; reactions create no total mass. Actual state-specific measurements remain required."
  unresolved_core_methodology_gaps: []
  unresolved_range_evidence: "No boundary-compatible independent empirical ranges are established for the listed site-specific inputs, utilities, losses, packages or species. Retain the individual foreground protocols; no case value is promoted to a universal range and no unsupported screening number is invented."
  ordinary_dataset_requirements: "Real grade/recipe/coating/acceptance/plant quantities, provider compatibility, all atomic supplies and outlets, measured WIP/FG burden histories, species/water states and observed service tails are required for a completed dataset; they are not fabricated here."
