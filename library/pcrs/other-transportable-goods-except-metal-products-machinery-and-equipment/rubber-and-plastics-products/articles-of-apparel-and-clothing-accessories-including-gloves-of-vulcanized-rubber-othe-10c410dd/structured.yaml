allocation_rules:
  - rule_id: allocation_order
    applies_to: "foreground_burden_allocation"
    rule: "Use subdivision and direct assignment first. For genuinely inseparable shared utilities, establish determining physical causality per exchange (measured heat, duty/time, throughput with evidence). Residual burdens without a causal driver use documented process-gate economic values and sensitivity analysis in this attributional model. Do not freely choose mass or revenue shares."
    source_ids:
      - ilcd-allocation
  - rule_id: physical_ledger
    applies_to: "foreground_burden_allocation"
    rule: "Keep the unallocated physical wet/solid/water/carbon ledger separate from attributed environmental burdens. Never multiply actual coproduct mass, internal links or wastewater handover by allocation shares. Treat ordinary non-saleable rejects as waste; no avoided-product credit is assumed. Any marketed downgraded glove triggers a separate output and allocation assessment."
    source_ids:
      - ilcd-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "glove_manufacture"
      flow_role: "reference_product"
      record_type: "batch acceptance"
      raw_fields: "lot_id; release_event_id; size; conditioned_net_mass; accepted_count; sampled_piece_mass; moisture; scale_id; acceptance_results; WIP_open; WIP_close; FG_open; FG_close; dispatch; returns; writeoffs"
      collection_method: "Calibrated net weighing or traceable count and lot-specific mass sampling; identify one release event per physical lot"
      unit: "kg; Item(s)"
      frequency: "Each lot"
      temporal_coverage: "Complete matched production cohort"
      site_scope: "All contributing stages and inventory stores"
      aggregation_rule: "Retain raw release, WIP, FG and movement records only; no normalized values"
      quality_evidence: "Scale calibration, acceptance report, lot genealogy"
    - protocol_id: cp_materials
      process_id: "glove_manufacture"
      flow_role: "latex_feed; nitric_cleaner; alkaline_cleaner; calcium_nitrate; calcium_carbonate; chlorine_solution"
      record_type: "stock and assay"
      raw_fields: "material_id; SKU; supplier; formulation; assay_basis; dry_rubber_content; total_solids; density; water; opening; receipts; closing; returned; transfers; lot_id"
      collection_method: "Calibrated weighing/stock records and validated chemical assays; keep baths and external feed separately Original raw aggregation constraint (collection remains undivided): Raw receipts, stock changes and assays only; no per-kg factors. The aggregation_rule reporting basis denotes the sole downstream normalize_release result, not collection-stage normalization."
      unit: "kg; kg/kg"
      frequency: "Each delivery/batch and bath change"
      temporal_coverage: "Same cohort including start/stop and carryover"
      site_scope: "Received feeds and bath/WIP stores"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "CoA/SDS, wet/dry assay, inventory reconciliation"
    - protocol_id: cp_utilities
      process_id: "glove_manufacture"
      flow_role: "electricity; process_water; natural_gas"
      record_type: "metering"
      raw_fields: "meter_id; opening; closing; branch; timestamp; voltage; kWh; water_volume; water_density; gas_volume; T; absolute_P; wet_dry; gas_composition; Z; heating_value_basis; heat_duty; operating_time"
      collection_method: "Read calibrated submeter logs and supply specifications; reconcile shared meter branches and actual causal drivers. Retain raw meter increments and operating records without normalization or assumed conversion factors; the reporting basis is obtained only downstream by normalize_release."
      unit: "kWh; m3; kg; MJ"
      frequency: "Continuous or each shift with start/stop"
      temporal_coverage: "Matched cohort and WIP carryover"
      site_scope: "Site utility handovers and internal distribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, gas standard-volume definition, provider specification"
    - protocol_id: cp_packaging
      process_id: "glove_manufacture"
      flow_role: "carton; pe_film; carton_first_receipt; carton_true_return; pe_film_first_receipt; pe_film_true_return"
      record_type: "weighing and stock"
      raw_fields: "material_id; SKU; article_or_lot_id; composition; unit_mass; free_open; free_close; attached_WIP_open_close; attached_FG_open_close; purchase_in; first_nonpurchase_in_free_attached; true_return_in_free_attached; prior_site_dispatch_id; ownership; upstream_burden_included; inherited_burden_vector; newly_attached; detached_to_free; gross_dispatch_attached; other_out_free_attached; scrap_free_attached; lot_id"
      collection_method: "Weigh each actual material and separate purchase, first non-purchase receipt and proven same-article return, each in free/attached state. No movement is inferred from payment or burden inclusion. Retain raw movements undivided; normalize_release alone produces the reporting basis."
      unit: "kg; Item(s)"
      frequency: "Each receipt, dispatch, attachment and stock close"
      temporal_coverage: "Matched release cohort and movement period"
      site_scope: "Free stock and attached WIP/FG; external handovers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated weights, BOM, prior dispatch genealogy, loan/free-receipt records, upstream burden boundary"
    - protocol_id: cp_wastes
      process_id: "glove_manufacture"
      flow_role: "glove_reject; latex_solid; process_effluent"
      record_type: "waste handover"
      raw_fields: "stream_id; source; wet_mass; dry_solids; volume; density; pH; COD; nitrogen_species; residual_chlorine; metals; date; receiver; treatment; stock_change"
      collection_method: "Weigh separate solids and meter/sample each drain before actual mixing; link receiver documentation Original raw aggregation constraint (collection remains undivided): Retain raw masses, concentrations and volume/time only. The aggregation_rule reporting basis denotes the sole downstream normalize_release result, not collection-stage normalization."
      unit: "kg; m3; mg/L"
      frequency: "Each load; flow-proportional effluent sampling"
      temporal_coverage: "Same cohort and waste-store movement period"
      site_scope: "Manufacturing boundary to external treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale/weighbridge, sampling QA and treatment acceptance"
    - protocol_id: cp_air
      process_id: "glove_manufacture"
      flow_role: "individual air emission rows"
      record_type: "stack/fugitive monitoring"
      raw_fields: "species; CAS; carbon_origin; source; concentration; gas_flow; sampling_time; temperature; pressure; moisture; oxygen_correction; capture; detection_limit; particle_cut; fossil_biogenic_carbon; boundary_location"
      collection_method: "Measure post-control outdoor discharge with validated species/particle methods; separately assess fugitive loss and carbon/water closure Original raw aggregation constraint (collection remains undivided): Raw concentration, gas volume, state, time and detection data only. The aggregation_rule reporting basis denotes the sole downstream normalize_release result, not collection-stage normalization."
      unit: "mg/m3; m3; h; kg"
      frequency: "Representative operating/load and start/stop states"
      temporal_coverage: "Same cohort with operating coverage disclosed"
      site_scope: "Each emitting source and outdoor boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Method, calibration, blanks, uncertainty and non-detect bounds"
  calculation_rules:
    - id: release_gate
      applies_to: "reference_product"
      rule: "Q = sum of unique newly released conditioned net glove masses. Do not add FG closing stock or gross shipments. Failed/tested gloves do not enter Q. Track release cohorts through WIP; do not divide an unmatched calendar utility total by another cohort’s release."
      inputs:
        - cp_release
      output: "Q"
      source_ids:
        - topglove-manufacture-2016
    - id: normalize_release
      applies_to: "all inventory rows"
      rule: "x_i = A_i / Q; A_i is the exchange amount for the matched release cohort after stock/WIP reconciliation; retain its unallocated physical amount and separately attributed burden amount where allocation applies; x_i is the exchange per 1 kg reference flow. Normalize once only."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "x_i in row unit per kg gloves"
      source_ids:
        - ilcd-allocation
    - id: wet_material_balance
      applies_to: "physical material ledger"
      rule: "Opening + external receipts = physical outputs + closing + measured losses. Close dry rubber, additive solids, water, carbon and relevant elements separately including bath and WIP stores. Carrier water is included once in its supplied mixture; internal recycle cancels at both ends with equal physical amount. No default yield or purity."
      inputs:
        - cp_materials
        - cp_wastes
        - cp_air
        - cp_release
      output: "unallocated physical ledger and residuals"
      source_ids:
        - vaisala-bath
        - epa-latex-1974
    - id: stock_burden_carryover
      applies_to: "WIP and FG"
      rule: "Match material and full inherited upstream/utility burdens of opening WIP to its released cohort, retain closing WIP burdens for later release, and exclude previously released FG from Q. Separately reconcile FG opening + new release + physical returns = gross dispatch + writeoffs + FG closing. Returns retain prior burdens and are not new production by relabelling."
      inputs:
        - cp_release
        - cp_materials
        - cp_utilities
      output: "matched cohort burden ledger"
      source_ids:
        - ilcd-allocation
    - id: packaging_ledger
      applies_to: "carton; pe_film; carton_first_receipt; carton_true_return; pe_film_first_receipt; pe_film_true_return"
      rule: "For each material separately, free opening + purchase_in_free + first_nonpurchase_in_free + true_return_in_free + detached_to_free = free closing + newly_attached + scrap_free + other_out_free. Attached opening on WIP/FG + purchase_in_attached + first_nonpurchase_in_attached + true_return_in_attached + newly_attached = attached closing on WIP/FG + gross_dispatch_attached + detached_to_free + scrap_attached + other_out_attached. Receipt categories are disjoint; attachment/detachment are internal and cancel. First non-purchase receipts remain physical inflows regardless of upstream burden inclusion. Preserve inherited burden vectors on true returns; do not add new production burdens. Identify each burden owner once, including any burdens already in the incoming-material provider. Internal reuse is neither purchase nor external receipt. Missing actual outward/waste exchanges require separate material-specific inventory cards before a completed dataset. Exclude packaging from Q; normalize once."
      inputs:
        - cp_packaging
        - cp_release
      output: "separate material/state physical and inherited burden ledgers"
      source_ids:
        - ilcd-allocation
    - id: air_species_mass
      applies_to: "individual air emission rows"
      rule: "Integrate concentration times gas volume on identical temperature/pressure/wet-dry/oxygen bases, convert to species mass and add separately measured fugitive mass. Preserve detection uncertainty. Keep NO and NO2 separate; unknown NOx-as-NO2 equivalence is pending. Split cumulative PM only using compatible measured cuts: never sum PM2.5, total PM10 and total PM as independent fractions."
      inputs:
        - cp_air
      output: "A_i"
      source_ids:
        - epa-gas-combustion
  data_quality_requirements:
    - id: identity
      applies_to: "each supplied exchange"
      requirement: "Verify original identity and provider quantity basis independently; a broad flow is usable only without contradictory material/route restrictions."
      evidence: "Native records, CoA/SDS, supplier reference amount"
    - id: coverage
      applies_to: "all stages"
      requirement: "Record actual present, absent, below-detection and unmeasured states separately. Add each additional chemical, packaging component, consumable, waste and emission as an atomic row. Missing measurement is not zero."
      evidence: "Site process survey, meter/drain maps, uncertainty"
    - id: representativeness
      applies_to: "foreground cohort"
      requirement: "Declare site, period, shift/load, formulation and stock coverage; historical or single-plant publications supply no general recipe, quantitative range, yield or utility factor."
      evidence: "Actual records and source-specific limitations"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Require one unique reference_product Product output consistent with the verified final product UUID, Mass/kg and required qualifiers. Impact-indicator units do not establish a physical production quantity."
    source_ids:
      - topglove-manufacture-2016
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Validate physical solids/water/carbon closure, WIP/FG and both packaging ledgers separately from burden allocation. Require positive Q and once-only normalization with matched cohort coverage; unexplained residuals require investigation, not an invented balancing emission."
    source_ids:
      - ilcd-allocation
  - rule_id: validate_native
    applies_to: "foreground_dataset_conformance"
    rule: "Each assigned UUID must match type, physical identity, CAS where provided, reference property/unit and receiving medium. Recheck provider compatibility, official Chinese name and quantity definitions; unresolved relationships remain explicit and block a completed foreground package."
    source_ids:
      - vaisala-bath
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "A completed, independently assessed gate-specific glove production inventory with inherited upstream compound and external treatment links"
  excluded_use: "Other glove materials/routes, whole CPC36260 coverage, medical compliance certification or equal-service comparisons without functional assessment"
  required_metadata: "Exact product, cohort, physical scope, compound/provider, wet/dry basis, gate, stock inheritance and actual utilities"
  required_quality_disclosure: "Measurement coverage, non-detect bounds, balances, allocation drivers, unresolved identities/provider limitations"
  update_trigger: "Change to material, formulation, finishing, utility, gate, supplier, treatment or acceptance specification"
