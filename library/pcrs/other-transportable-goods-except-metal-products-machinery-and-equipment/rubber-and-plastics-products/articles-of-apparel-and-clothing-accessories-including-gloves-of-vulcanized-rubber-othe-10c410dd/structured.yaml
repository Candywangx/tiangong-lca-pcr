    used_for: "Attributional allocation hierarchy and virtual subdivision; no fixed shares or automatic waste credit"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:c1116f1d190c487494ff92952f0a09120fd4d3d6d2ce0a5dd0a75ba256ea25d1"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5584"
      family: "system_boundary"
      span:
        start:
          offset: 5584
          line: 60
          column: 1
        end:
          offset: 7527
          line: 79
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Received matured natural-rubber compound, separate coagulant/cleaner/chlorination feeds and utilities |\n| starting_condition_role | Foreground received-material gate; upstream compound production is inherited through a compatible provider |\n| product_classification_scope | Only the defined glove subset within CPC36260 |\n| recursive_input_rule | No same-category finished glove is assumed as a feed. Returned goods retain origin and inherited burdens; do not reclassify them as virgin latex or count repeat release as new production. |\n| upstream_dataset_requirement | Provider must cover actual wet formulation and maturity, natural-rubber origin, compounding, supply grade, transport and reference amount; raw latex alone is incomplete |\n| disclosure | Declare all site stages and exact handovers; imported steam/heat, on-site compounding or treatment require an expanded separate inventory before use |\n\n| rule_id | Rule | source_ids |\n| --- | --- | --- |\n| `boundary_route` | Aggregate dipping and finishing as one foreground unit while retaining stage meters. Include cleaning, baths, leaching, curing, chlorination/rinsing, drying, stripping, quality testing and packaging, including rejects and start/stop losses. | `topglove-manufacture-2016` |\n| `boundary_waste` | External wastewater treatment and solid-waste management burdens remain required upstream/downstream links. Do not model sewer transfer as a direct freshwater emission or omit treatment. | `epa-latex-1974` |\n| `boundary_utilities` | Only actual on-site gas combustion and purchased electricity are represented. Internal heat/water recirculation is a physical internal ledger, not a second external exchange. Real external steam/condensate transfers require independent product rows and enthalpy/pressure/provider reconciliation. | `epa-gas-combustion` |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 316
              line: 9
              column: 1
            end:
              offset: 385
              line: 9
              column: 70
          text: "# Chlorinated powder-free natural-rubber gloves from compounded latex"
          depth: 1
        - kind: "heading"
          span:
            start:
              offset: 5584
              line: 60
              column: 1
            end:
