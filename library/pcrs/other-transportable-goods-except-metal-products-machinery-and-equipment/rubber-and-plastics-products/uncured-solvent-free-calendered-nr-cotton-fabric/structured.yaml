allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all processes"
    rule: "Separate batch/cohort and disjoint meter records before sharing burdens. Internal transfers and recirculated trim do not create coproduct credits. No automatic mass, area, processing-time or sales-value proxy for every utility."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "actual coproducts"
    rule: "Identify real externally supplied coproducts without renaming them as waste. Demonstrate determining physical causality for residual shared burdens; if unavailable, disclose and justify economic allocation using actual co-function values at handover, with sensitivity. Methodology review is needed for the actual multifunctional case; this profile supplies no default shares or substitution credits."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_warmup
      process_id: "warmup"
      flow_role: "Complete compound and warmup ledger"
      record_type: "foreground_record"
      raw_fields: "lot/roll ID; timestamp; material/species; state; raw mass/energy/volume; meter coverage; failed/zero-output run; return/rework transfer; opening/closing WIP mass and embodied burden"
      collection_method: "Owner: warmup production lead. Retain unnormalised receipts, assays, issued whole compound, internal returns, temperatures and disjoint meter totals, including all failed runs, idle/start-up and raw/WIP stock changes with inherited burdens. No A/Q at collection."
      unit: "kg; MJ"
      frequency: "Each batch, event or meter interval"
      temporal_coverage: "Complete matched reporting period plus identified opening/closing cohort history"
      site_scope: "Declared site and disjoint process coverage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated scales/meters; supplier formulation; stock and transfer reconciliation"
    - protocol_id: cp_calender
      process_id: "calender"
      flow_role: "Substrate, compound and composite ledger"
      record_type: "foreground_record"
      raw_fields: "lot/roll ID; timestamp; material/species; state; raw mass/energy/volume; meter coverage; failed/zero-output run; return/rework transfer; opening/closing WIP mass and embodied burden"
      collection_method: "Owner: calender production lead. Collect raw warm-strip/cotton feed, coating settings, complete web mass, rubber/cotton/water subledgers, failed web and transfers. Measure same-state width/area/areal mass when conversion is necessary; preserve raw records without division."
      unit: "kg; m; m2; MJ"
      frequency: "Each batch, event or meter interval"
      temporal_coverage: "Complete matched reporting period plus identified opening/closing cohort history"
      site_scope: "Declared site and disjoint process coverage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Coating/uncured-state tests; scales; dimensions; signed lot balance"
    - protocol_id: cp_utilities
      process_id: "calender"
      flow_role: "Shared utility and control ledger"
      record_type: "foreground_record"
      raw_fields: "water/steam mass; temperature/pressure; enthalpy; raw integrated volume or rate and duration; makeup; recirculation; condensate; blowdown; evaporation; carbon bed stocks"
      collection_method: "Owner: utilities engineer. Keep raw disjoint totals and physical water/steam balances for the whole period, including failed runs, storage and controls. Purchased heat uses delivered mass and measured enthalpy difference; no extra water procurement for its steam. Assign measured branch coverage before cohort attribution; do not divide by Q here."
      unit: "kg; MJ; m3"
      frequency: "Each batch, event or meter interval"
      temporal_coverage: "Complete matched reporting period plus identified opening/closing cohort history"
      site_scope: "Declared site and disjoint process coverage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; measured density/enthalpy; purge receipts; abatement records"
    - protocol_id: cp_emissions
      process_id: "calender"
      flow_role: "Separate warmup and calender air-species coverage"
      record_type: "foreground_record"
      raw_fields: "species; CAS; medium; sample time; inlet/outlet concentration; air volume basis; integrated gas volume or rate and duration; control capture; detection limit; run/cohort"
      collection_method: "Owner: environmental monitoring lead. Retain raw species-resolved tests for mill and calender, including failed runs and fugitive coverage. Integrated volume times concentration gives mass; rate requires duration. Keep actual controls and emitted versus captured mass distinct; no aggregate VOC/closure residual assigned to a substance and no A/Q at collection. Add one card for every additional actual species."
      unit: "kg; mg/m3; m3; m3/h; h"
      frequency: "Each batch, event or meter interval"
      temporal_coverage: "Complete matched reporting period plus identified opening/closing cohort history"
      site_scope: "Declared site and disjoint process coverage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling methods; detection limits; gas-state conversion; compound assay; no unsupported universal emission factor"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "Release P, trim, liner and core ledger"
      record_type: "foreground_record"
      raw_fields: "lot/roll ID; timestamp; material/species; state; raw mass/energy/volume; meter coverage; failed/zero-output run; return/rework transfer; opening/closing WIP mass and embodied burden"
      collection_method: "Owner: quality/release lead. Weigh uncured composite and detachable packaging separately; test accepted state and record unique first release P, samples, rejects and return/reinspection history. Carry opening/closing WIP and associated burden; a reaccepted returned roll is not new production. Keep raw numerators and P without dividing."
      unit: "kg; MJ"
      frequency: "Each batch, event or meter interval"
      temporal_coverage: "Complete matched reporting period plus identified opening/closing cohort history"
      site_scope: "Declared site and disjoint process coverage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Acceptance tests; roll IDs; net/tare weighing; WIP and rejection reconciliation"
    - protocol_id: cp_dispatch
      process_id: "dispatch"
      flow_role: "Net Q, finished stock and inherited burdens"
      record_type: "foreground_record"
      raw_fields: "roll/cohort IDs; P receipt; opening/closing finished mass and carried input/emission/energy burdens; gross/net dispatch; returns; redeliveries; packaging tare; storage/handling/dispatch energy; actual handover acceptance"
      collection_method: "Owner: dispatch/warehouse lead. Collect original delivery and return acceptances and raw stock/cohort burdens, preserving prior-period history. Q is unique net accepted delivered composite mass after return reconciliation at the declared handover, excluding undelivered finished stock and packaging. Re-delivery/reinspection never duplicates the same retained delivery. Keep all original raw quantities and burdens; no A/Q at collection."
      unit: "kg; MJ"
      frequency: "Each batch, event or meter interval"
      temporal_coverage: "Complete matched reporting period plus identified opening/closing cohort history"
      site_scope: "Declared site and disjoint process coverage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed dispatch/returns; calibrated weighbridge; stock history and burden bridge; no P=Q assumption"
  calculation_rules:
    - id: calc_normalise
      applies_to: "all inventory rows"
      rule: "For each exchange i, a_i = A_i / Q exactly once. A_i is the raw burden attributed to net delivered cohorts: opening embodied burden plus actual period burdens including failed runs/rework minus closing retained-stock burden, reconciled through cp_dispatch; stage transfers cancel. Q is positive unique net accepted delivered composite kg. Cards and aggregation_rule describe this same report operation, not successive divisions. Preserve signed return corrections and original periods; no Q for a zero-delivery period, retain its burdens for future stock/campaign reconciliation."
      inputs:
        - A_i
        - Q
        - cp_warmup
        - cp_calender
        - cp_finish
        - cp_dispatch
        - cp_utilities
        - cp_emissions
      output: "a_i"
      source_ids: []
    - id: calc_conversions
      applies_to: "all inventory rows"
      rule: "Convert raw units before normalisation: electricity MJ = kWh * 3.6; mass = volume * independently measured density; integrated air volume * species concentration gives species mass with unit/state conversion, while flow rate requires duration. Area * same-state areal mass gives composite mass. Steam net heat = measured mass * actual enthalpy difference. Do not apply time twice or infer water/speciation from COD or closure residuals."
      inputs:
        - cp_utilities
        - cp_emissions
        - cp_calender
      output: "converted_raw_amount"
      source_ids: []
    - id: calc_balances
      applies_to: "all inventory rows"
      rule: "At each stage use complete raw input + opening stock + actual returns = external exit + internal transfer + closing stock, with packaging/water/steam ledgers separately reconciled. At dispatch opening finished stock + P + physical returns = gross dispatch + closing finished stock + actual losses; gross/returned/redelivered histories produce unique Q, never presume Q=P. Carry burden vectors with every retained/returned cohort. Conserve rubber formulation, cotton, water and measured relevant elements; actual emitted species are independently measured. No reaction-water term is assumed for this non-curing route."
      inputs:
        - cp_warmup
        - cp_calender
        - cp_finish
        - cp_dispatch
        - cp_utilities
        - cp_emissions
      output: "reconciled_mass_and_burdens"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Confirm supply form, complete native limitations and supplier compatibility independently; blank auxiliary UUIDs require later matching, not invented backgrounds. PE luggage-classification debt is retained; actual paperboard/PE composition and tare must be measured."
      evidence: "Supplier specifications, direct identity audit, calibrated scales"
    - id: quality_stock
      applies_to: "all processes"
      requirement: "Retain complete raw logs, zero-output burdens, WIP/finished opening/closing and burden vectors. Prove same grade/route/uncured state/cohort for Q and A_i; no duplicate returns, acceptance or normalisation."
      evidence: "Cohort bridge, original acceptance, period ledgers and reconciliation"
    - id: quality_species
      applies_to: "air and water"
      requirement: "Solvent-free is an application route, not zero emissions. Screen actual formulation and monitoring for every species, medium, detection limit and treatment; no aggregate VOC or residual becomes a named chemical."
      evidence: "Independent analyses, sampling reports, abatement and recipient evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "delivered_fabric"
    rule: "Require one explicit linked terminal Product output consistent with the reference UUID, 1 kg composite basis, positive unique Q and declared qualifiers. Intermediate/released-roll outputs sharing the UUID remain visible and cancel internally."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "all processes"
    rule: "Require every actual atomic exchange and all raw period/stock/carried-burden records; independently reconcile physical mass/elements, actual species and water phases. Missing measurements or unsupported balances are findings, never a zero/default or a fabricated numerical factor."
    source_ids: []
  - rule_id: validate_route
    applies_to: "all processes"
    rule: "Reject applicability for tyres, PVC/PU, wet latex/solvent/coagulation, primer-dependent, on-site raw ingredient mixing or cured-state routes without a separately evidenced method. Do not infer native supply geography where absent; preserve PE classification debt and provider/recipe limitations in consumed context."
    source_ids:
      - hubner-calender-2019
      - rosich-calender-state
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified intermediate uncured composite at the declared dispatch handover"
  allowed_use: "Same NR/cotton construction and uncured solid-calender route with compatible state and inventory completeness"
  excluded_use: "Whole CPC coverage, rubber/fibre-only mass, cured/PVC/PU/tyre cord equivalence, finished belt/glove performance or unsupported cradle-to-gate completeness"
  required_metadata: "All reference qualifiers, Q/P distinction, process map, cohort/stock bridge, supplier states, actual geography and utility/transport/treatment links"
  required_quality_disclosure: "Measured moisture/composition, raw numerators and burdens, auxiliary UUID/provider gaps, PE classification inconsistency, primary technology synthesis limits, all omissions and uncertain allocations"
  update_trigger: "Formulation, substrate/finish, curing state, gate, utility/site, process/controls, stock accounting or supplier change"
data_sources:
  - id: "hubner-calender-2019"
