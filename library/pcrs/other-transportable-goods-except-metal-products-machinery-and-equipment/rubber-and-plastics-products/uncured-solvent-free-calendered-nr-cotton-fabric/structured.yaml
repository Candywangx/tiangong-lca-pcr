      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "For electricity convert raw kWh by exactly 3.6 MJ/kWh. Steam heat is measured mass times inlet-minus-return enthalpy, with actual state; no fuel double count. Integrated volume is already integrated: only a rate is multiplied by duration. Density is independently measured, never a secondary flow-property coefficient."
