  ordinary_auxiliary_gaps:
    - "Whole NR formulation, coating-ready cotton and all specific auxiliary, utility, waste and emission rows lacking UUIDs need provider and identity matching. Search hits are candidates, not automatic compatibility or no-hit claims."
    - "Direct Cotton Fabric record declares water treatment chemical as route, so not selected. Low-voltage electricity candidate explicitly declares CN supply, so not adopted as geography-independent electricity. No final reference gap."
  evidence_limits:
    - "Actual complete compound formula, supplier states, uncured acceptance, moisture, areal mass, inputs, utilities, controls, emissions, wastes, stocks and carried burdens require foreground measurement; no invented default recipe or factors."
    - "Purchased compound and finished cotton define the foreground start; upstream supplies and transport require representative compatible data before a complete cradle-to-gate claim."
    - "Net delivered Q is distinct from production release P. Opening/closing WIP and finished stock, returns/redelivery and inherited burden vectors are mandatory."
    - "Scientific review, accepted classification mapping and publication remain pending."
