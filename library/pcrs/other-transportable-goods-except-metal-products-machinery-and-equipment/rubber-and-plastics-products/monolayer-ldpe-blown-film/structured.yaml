system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "film_line"
      rule: "Include every actual receipt, handling, evidenced drying, screw/screen/die heat, blower/compressor, cooling loop, haul-off, cold slit, winding, testing and packing stage plus failed trials, startup/shutdown, hot standby, cleanup and rework. No purchased-film repacking shortcut."
      source_ids:
        - lyb-film-extrusion
        - lyb-lupolen-2420k
        - polystar-monolayer-flat-film
    - rule_id: boundary_evidence
      applies_to: "all stages"
      rule: "Synthesize distinct LYB guide, illustrative TDS and independent POLYSTAR cold-splitting capability transparently; not one SKU/factory/order. Multiextruder/cast-water/corona diagrams are adjacent alternatives, not this route. Typical specimen properties/settings are not universal limits or density conversions. Respect the illustrative resin medical/pharmaceutical exclusion."
      source_ids:
        - lyb-film-extrusion
        - lyb-lupolen-2420k
        - polystar-monolayer-flat-film
    - rule_id: boundary_atomic
      applies_to: "every exchange"
      rule: "Purchase each actual whole formulation once; assay/carrier water/active fractions are child accounts. Actual in-plant mixtures need separate purchased constituents and real mixing energy/loss. Every unlisted real ingredient, cleaning agent, lubricant, refrigerant, coolant additive, fuel, package, waste and species requires its own atomic named exchange and applicable state/provider/medium. No other-material, total-VOC chemical or utility bundle, no assumed zero or boiler/steam. Fuel-fired departures require route reassessment and separate real fuels and species."
      source_ids:
        - lyb-film-extrusion
        - lyb-lupolen-2420k
    - rule_id: boundary_cooling
      applies_to: "water/heat"
      rule: "Bubble cooling is air cooling, not the neighbouring cast-water route. Include actual barrel/nip/chilled-air water circuits when present. Internal circulation is not external demand. External Product cooling supply and actual Product return need measured mass, constituents, actual T/P and enthalpy plus supplier water/energy/net-service convention; avoid duplicate water production or thermal-service burden. No presumed condensate/boiler."
      source_ids:
        - lyb-film-extrusion
    - rule_id: boundary_q
      applies_to: "product; fg_service"
      rule: "Q is newly first-quality-released net film kg after cold slitting, winding, testing and release packing. Closing FG from those lots is already in Q: never add it as production output. Reinspection, shipment, warehouse transfer and prior-released return/rework create no new Q. Keep actual post-release warehouse/packing/handling/loading/dispatch in a separate original-cohort service account, including retained FG and later service supplements. Old FG production burdens do not enter current Q."
      source_ids:
        - lyb-film-extrusion
        - ilcd-handbook-2010
    - rule_id: boundary_species
      applies_to: "mass/element/water"
      rule: "Melting/crystallisation is physical change, not assumed reaction water. Distinguish independently evidenced free, phase, reaction and structural water. Independently close total mass and relevant C/H/O or additive elements using measured fractions; measure oxygen uptake if material oxidation requires it. Do not fit two unknowns from one residual or infer named chemicals from COD/VOC. Separate polymer particles, actual gas species, treatment transfers and direct environmental releases."
      source_ids:
        - lyb-film-extrusion
        - lyb-lupolen-2420k
    - rule_id: boundary_history
      applies_to: "WIP; FG; returns"
      rule: "Keep opening/closing raw stock, every WIP stage and regrind pool by cohort with a complete per-flow inherited vector; consumed opening cohorts transfer burden and unfinished cohorts carry it forward, including failures and zero-output runs. FG opening/closing/returns retain original release, delivery/reversal and full inherited vectors. Reverse linked original delivery as applicable and add only actual incremental rework/service; no new production from repeat release. Cancel internal Q/rework in combined physical accounting."
      source_ids:
        - ilcd-handbook-2010
        - lyb-film-extrusion
boundary_abstraction:
  declared_starting_condition: "Factory receipt of purchased virgin non-additivated LDPE pellets and actual separately identified supplies, not bought finished film"
  starting_condition_role: "Foreground receiving gate with linked upstream supplies; polymer manufacture remains in compatible provider inventory"
  product_classification_scope: "A bounded subset of original CPC36330 structure; 36390 other flat plastics, 36410 sacks/bags and 36920 self-adhesive shapes are separately listed; no unseen explanatory-note claim"
  recursive_input_rule: "Clean same-formulation internal trim transfers mass and full inherited burden, not a new upstream purchase. Bought LDPE wrap is a separate actual package supply, never substituted for reference manufacture"
  upstream_dataset_requirement: "Match whole actual supplied formulation, state, technology, geography, year and property/unit. Identify provider-included packaging/transport once; generic UUID is not supplier footprint"
  disclosure: "Complete pellet-to-packed-roll first-release gate plus separate original-cohort post-release storage/handling/loading/dispatch service account. Declare service cutoff, retained FG and later supplements; keep raw production/FG/combined physical and vector ledgers"
