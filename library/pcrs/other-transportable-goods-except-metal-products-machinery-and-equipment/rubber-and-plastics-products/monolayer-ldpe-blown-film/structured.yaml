allocation_rules:
  - rule_id: allocation_scope
    applies_to: "attributional inventory"
    rule: "Apply only when study goal/decision context establishes an attributional case needing allocation rather than substitution; no arbitrary modelling-framework choice or full ILCD conformity claim. Industrial manufacturing evidence does not support LCA allocation."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: allocation_subdivide
    applies_to: "each shared exchange"
    rule: "First isolate dedicated metered operations and virtually subdivide exclusive embodied materials/services by real lot/stage. Keep responsible-cohort startup, idle, failure, cleaning and rework load; whole-line kg ratios do not replace this step."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: allocation_causality
    applies_to: "individual residual exchange"
    rule: "Identify and justify exchange-specific determining physical causality to actual co-functions. Motor work, heating, blower activity, occupancy and limited storage may need different measured drivers or time-capacity combinations. Mass alone is not proof. Keep physical balances and full physical outputs independent of burden shares."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: allocation_residual
    applies_to: "genuinely inseparable remainder"
    rule: "Only documented residuals without determining physical causal assignment use contemporaneous representative market values at the common process gate in actual quantity/quality/state. Remove downstream transport/conditioning/packaging value when deriving prices; retain evidence, period, derivation and sensitivity. No fixed ratios, arbitrary physical/economic choice, retail price or indiscriminate total-revenue allocation. Each exchange allocated over co-functions must sum to its original inventory."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: allocation_regrind
    applies_to: "internal and external scrap"
    rule: "Clean internal same-formulation regrind retains inherited resin and real grinding/remelting burden; no new purchase, Q, automatic coproduct or avoided-resin credit. Independently establish actual legal/economic state and receiver of external trim, purge and packaging waste. Recovery destination alone proves neither burden-free waste nor co-product. External recycling methodology needs separately justified treatment/boundary evidence; no automatic end-of-life rule imported here."
    source_ids:
      - ilcd-handbook-2010
      - lyb-film-extrusion
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "film_line"
      flow_role: "product"
      record_type: "release_records"
      raw_fields: "SKU; grade; lot; gross roll mass; core/wrap tare; width/thickness; optical/mechanical tests; first release time; acceptance; reversal"
      collection_method: "Quality staff weigh rolls on calibrated scales and subtract separately measured removable tare; reconcile unique first-release and reversal records after slitting/winding/packing. Retain raw kg and tests; sum unique newly accepted net film kg to Q with no division."
      unit: "kg"
      frequency: "each roll/release"
      temporal_coverage: "one complete matched production period"
      site_scope: "factory first-release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; tare and release tests"
    - protocol_id: cp_material
      process_id: "film_line"
      flow_role: "resin; purge; grease; screen; scrap; purge_waste; screen_waste"
      record_type: "material_stock"
      raw_fields: "row_id; lot; full supplied formulation; free moisture; measured element fractions; supplier/state; receipt/issue/return masses; opening/closing raw/WIP/regrind; inherited per-flow vectors; stage; receiver"
      collection_method: "Custodian/lab weigh each supply/outlet and assay composition on compatible bases. Preserve unnormalised raw mass, full stock/vector and stage-transfer records including failures, start/stop, idle, cleaning and rework. Internal transfers are not repurchases; different real formulations/residues receive distinct rows."
      unit: "kg"
      frequency: "every material movement"
      temporal_coverage: "same period/cohorts as cp_release"
      site_scope: "receipt through release and waste transfer"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; assays; calibration; receiver records"
    - protocol_id: cp_energy
      process_id: "film_line"
      flow_role: "electricity"
      record_type: "meter_intervals"
      raw_fields: "meter; provider/voltage/location; start/end kWh; power rate/time; stage/state; failure; shared-driver evidence; WIP/cohort"
      collection_method: "Energy engineer meters every actual stage and auxiliary including hot standby, start/stop, cleanup and zero-output runs. Retain raw compatible interval readings and overlap checks; distinguish power from integrated energy. No division in collection."
      unit: "kWh"
      frequency: "each interval/state"
      temporal_coverage: "same period/cohorts as cp_release"
      site_scope: "production and actual auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; circuit map; provider boundary"
    - protocol_id: cp_water
      process_id: "film_line"
      flow_role: "water; cooling_supply; cooling_return; blowdown; vapour"
      record_type: "water_heat_states"
      raw_fields: "row_id; source/receiver; inlet/outlet mass/volume; independent density; T/P; dissolved constituents; moisture; loop stock; evaporation; actual enthalpy; supplier water-energy convention"
      collection_method: "Water engineer independently meters external supply/return/treatment and environmental outlets with measured density/state/composition; retain internal circulation and moisture as separate accounts. Keep raw quantities without division. Unmeasured evaporation or return stays unresolved, not fitted by a residual."
      unit: "kg; m3; kg/m3; degC; kJ/kg"
      frequency: "each interval/state test"
      temporal_coverage: "same period/cohorts as cp_release"
      site_scope: "actual external water boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "assays; meter calibration; supplier conventions"
    - protocol_id: cp_pack
      process_id: "film_line"
      flow_role: "core; wrap; strap; pallet; sack_waste; core_waste; wrap_waste; strap_waste; pallet_waste; resin_sack"
      record_type: "component_stock"
      raw_fields: "row_id; whole composition; supplier/tare; opening/closing empty; attached WIP/FG; reusable stock; purchases; external returns received; gross physical dispatch; returns sent; waste; internal reuse; original cohort"
      collection_method: "Packing staff weigh every actual component, including received resin packaging, with supplier-included burden checked once. Keep complete raw empty/attached/reusable component and gross-dispatch/return/waste ledgers. Include real repacking and linked FG services; internal reuse cancels, tare never enters Q, no division."
      unit: "kg"
      frequency: "each component/movement"
      temporal_coverage: "matched production and FG-service periods"
      site_scope: "receipt; WIP; packing; FG; external movements"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare tests; component specs; stock closure"
    - protocol_id: cp_air
      process_id: "film_line"
      flow_role: "oxygen; dust; formaldehyde; acetaldehyde"
      record_type: "speciated_survey"
      raw_fields: "row_id; species/CAS; particle size; medium; stage/state; stack/fugitive route; concentration/basis; integrated volume or true flow rate; time; T/P; wet/dry; controls; blanks; recovery; detection limits; uncertainty"
      collection_method: "Environmental engineer and competent lab first survey actual resin, purge, grease, cleaning and controls, then choose validated species/particle-specific methods for every real outlet/state including startup/idle and uncaptured routes. Preserve raw calibrated results and gas states, not total VOC as a chemical or default nondetect zeros. Example aldehydes are conditional, not presumed complete/positive. Missing survey means incomplete numerical data. No division."
      unit: "kg/m3; m3; m3/h; h; kg"
      frequency: "each actual species and representative state"
      temporal_coverage: "same period/cohorts as cp_release"
      site_scope: "actual exhausts and all evidenced fugitives"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full lab reports; calibration; blanks; recovery; coverage"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "fg_receipt; fg_power; dispatch"
      record_type: "cohort_service_history"
      raw_fields: "original release; full inherited per-flow vector; opening/closing FG and attached pack; new Q receipt; gross dispatch; return; original delivery reversal; loss; rework; incremental energy; occupancy/time; cutoff"
      collection_method: "Warehouse/quality staff retain raw cohort movements, original release/return/reversal history and inherited production/service vectors. Meter and attribute actual post-release service by exclusive records then justified drivers; no old-cohort burden divided by current Q. Retain target-cohort service through cutoff and later supplements; closing FG carries full vectors. Reinspection gives no Q; raw collection does not divide."
      unit: "kg; kWh; h"
      frequency: "each stock/service/dispatch movement"
      temporal_coverage: "declared service interval and original cohort history"
      site_scope: "post-release storage to actual loading; retain unshipped FG"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "history; vector and reversal links; service meters"
  calculation_rules:
    - id: release_q
      applies_to: "product"
      rule: "Q = sum of unique newly first-quality-released net film kg with genuine linked reversal corrections; exclude core/wrap. Closing same-cohort FG already belongs to Q; dispatch, reinspection and prior-released return/rework are not new Q."
      inputs:
        - cp_release
      output: "Q"
      source_ids:
        - lyb-film-extrusion
        - lyb-lupolen-2420k
        - polystar-monolayer-flat-film
    - id: cohort_raw
      applies_to: "production rows"
      rule: "Construct raw A_i in each row unit: attributable current exchanges + complete inherited per-flow vectors of consumed opening WIP/regrind - complete vectors carried by closing WIP/regrind. Include failed/zero-output/start/stop/idle/cleanup and incremental rework. Inheritance is a vector, not a scalar impact score. Physical stocks stay separate; released closing FG is neither subtracted from production Q nor from its completed production burden."
      inputs:
        - cp_release
        - cp_material
        - cp_energy
        - cp_water
        - cp_pack
        - cp_air
      output: "A_i"
      source_ids:
        - ilcd-handbook-2010
    - id: physical_gates
      applies_to: "raw production; FG; combined"
      rule: "Independently close total material mass and each relevant element on measured composition/water bases. Production: opening raw/WIP/empty-package/regrind stock + actual external material inputs + real rework transferred in = closing equivalent stock + new net film Q + packaging attached to new FG + prior-released rework returned to FG with its attached packaging + actual external Product water returns + all waste/species outlets. Internal regrind cancels. FG film subledger: opening net film + new Q receipts + real external returns + prior-released rework receipts = gross outward net film + closing net film + FG losses + transfers to rework. Add the separately complete attached/empty/reusable packaging and actual service-input/output subledgers for the total FG gate. Combined physical gate cancels all internal Q, rework and attached-package transfers and reconciles external material inputs/returns against external shipments, Product cooling returns, all waste/emissions and closing-minus-opening stocks. Closing FG already included in Q never becomes another production output. Do not use burden shares to scale physical outputs or use a residual to invent species."
      inputs:
        - cp_release
        - cp_material
        - cp_water
        - cp_air
        - cp_fg
      output: "raw physical ledgers"
      source_ids:
        - ilcd-handbook-2010
        - lyb-film-extrusion
    - id: pack_balance
      applies_to: "each packaging component"
      rule: "Separately for each component: opening empty + opening attached WIP/FG + opening reusable + purchases + external returns received = closing empty + closing attached WIP/FG + closing reusable + component leaving with gross physical shipments + external returns sent + waste. Received supplier packaging is identified once without duplicating included upstream burden. Internal attachments/reuse cancel; packaging is outside Q and is not an automatic co-product or credit."
      inputs:
        - cp_pack
        - cp_fg
      output: "component ledgers"
      source_ids:
        - ilcd-handbook-2010
    - id: energy_units
      applies_to: "electricity; fg_power"
      rule: "A_MJ = 3.6 × A_kWh on the same supply boundary before cohort reporting. Integrated kWh is not multiplied by time again; only true power rates require time integration."
      inputs:
        - cp_energy
        - cp_fg
      output: "A_MJ"
      source_ids: []
    - id: fluid_species
      applies_to: "actual fluid/species"
      rule: "Liquid A_kg = V_m3 × independently measured compatible rho_kg_per_m3 at actual composition/temperature. Species mass with compatible integrated volume uses sum(c × V); only actual volume flow F uses integral(c × F × dt). Match T/P/wet-dry state and units. Carbon-equivalent concentration needs independent species conversion. Never use water density for another liquid, multiply integrated volume by time or sum VOC/COD indicators with chemical masses. Cooling service uses measured inlet/outlet enthalpy under the actual supplier convention."
      inputs:
        - cp_water
        - cp_air
      output: "A_kg; A_species; net cooling service"
      source_ids: []
    - id: fg_cohort
      applies_to: "fg_service"
      rule: "Retain each original cohort full production vector and real incremental service/rework vectors. Reverse original delivery when actual linked return requires it; repeated inspection only adds its real increment. Attribute services first exclusively then by the hierarchy; old FG does not divide by current new-release Q. Target new cohort services use the same original Q across periods including closing FG and later supplements. Consolidation must not add inherited production again."
      inputs:
        - cp_fg
        - cp_pack
      output: "cohort A_i and histories"
      source_ids:
        - ilcd-handbook-2010
    - id: report_once
      applies_to: "all non-reference exchanges"
      rule: "x_i = A_i / Q; A_i is the complete attributed raw numerator in row units and Q is the original newly first-quality-released film kg for that target cohort. Execute this division exactly once after raw unit conversion, full WIP inheritance and justified allocation. Production and subsequent service are separate results; service uses the same original Q, not gross/net shipments or another cohort current output. Cards and aggregation reference this same calculation; raw collection never divides. If Q = 0 preserve true burdens and issue no unit result."
      inputs:
        - A_i
        - Q
        - cp_release
        - cp_fg
      output: "x_i"
      source_ids:
        - ilcd-handbook-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_raw
      applies_to: "all exchanges"
      requirement: "Require actual site/grade/cohort records, calibrated units and uncertainty, complete stage/state coverage and matched periods. Future measurements, auxiliary UUIDs and compatible providers are explicit data-production requirements, never invented numbers or assumed zeros."
      evidence: "raw records; assays; calibration; matched time"
    - id: dq_species
      applies_to: "all outlets"
      requirement: "Numerical completeness requires a real full species/particle/water survey, validated methods and actual destinations. Conditional examples do not establish absence or completeness; every real added outlet becomes an atomic card."
      evidence: "complete lab/receiver records; limits; uncertainty"
    - id: dq_native
      applies_to: "UUID rows"
      requirement: "Preserve full native physical restrictions and exact referenced property/unit chain with actual provider compatibility. Identity UUID is neither quantity nor scientific approval. No numeric reuse from mismatched materials or typical-grade numbers."
      evidence: "native chains; actual supply specs; explicit gaps"
    - id: dq_fg
      applies_to: "FG and packaging"
      requirement: "Retain all inherited vectors, return/reversal history, actual service increment, component closure and cutoff, including retained FG and later supplements. Distinguish manufacturing completeness from service completeness."
      evidence: "cohort vector history; physical/component ledgers"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference"
    rule: "Verify actual pellet formulation, plain single-layer noncellular LDPE structure, untreated nonadhesive surface, annular air-cooled blown/cold-flat-split route, dimensions/tests, packed-roll first release and unique product row; no bought-film-only or other-polymer shortcut."
    source_ids:
      - lyb-film-extrusion
      - lyb-lupolen-2420k
      - polystar-monolayer-flat-film
  - rule_id: validate_native
    applies_to: "all exchanges"
    rule: "Before quantitative use inspect every native basename/synonym/comment, CAS, grade, route, form, geography, medium, type and all properties plus exact unit chain and compatible provider. Unspecified PE-LD grade/route/location require actual qualifiers, not invented defaults. Wrong cleaned-recycling endpoint or voltage is a material mismatch. Specific unresolved auxiliaries never become collective flows."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: validate_balances
    applies_to: "all gates"
    rule: "Independently audit mass, relevant elements, free/phase/reaction water, WIP vectors, FG opening/closing/returns, gross dispatch, every packaging component and actual species. Production, FG and combined gates must agree with explicit uncertainty and internal cancellation. No residual-fitted gas or extra Q."
    source_ids:
      - ilcd-handbook-2010
      - lyb-film-extrusion
  - rule_id: validate_reporting
    applies_to: "data production"
    rule: "Require raw protocols, complete state/stage coverage, real conversion and exchange-specific allocation before report_once. Q-zero preserves load without unit result. Missing actual species, supply/return state, inherited history, provider or unresolved physical closure makes the numerical package incomplete. Engineering checks do not establish plant values, science/translation approval, accepted mapping or publication."
    source_ids:
      - ilcd-handbook-2010
      - lyb-lupolen-2420k
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Matching LDPE flat film with reviewed providers; link manufacture first release and separate original-cohort FG service without duplicate inherited production"
  allowed_use: "Actual bounded plain air-cooled monolayer LDPE cold-flat-split configuration with full records"
  excluded_use: "Whole classification leaf coverage; functional equivalence from kg alone; illustrative resin medical/pharmaceutical use; unknown quantities/species set zero; automatic recycling credit or methodology approval"
  required_metadata: "LDPE grade and full supplied formulation; virgin non-additivated pellet state; permitted same-formulation internal regrind and history; monolayer noncellular unreinforced unsupported structure; non-self-adhesive unprinted untreated surface; annular air-cooled blown route and cold flat-web split; width and net thickness tolerances; roll net mass and core/wrap tare; actual optical/mechanical acceptance and end-use limits; unique first release and reversal link; reporting period and geography; electricity voltage/provider boundary; actual drying/cooling configuration; raw/WIP/FG cohort mass and inherited per-flow vectors; actual species and waste destinations; each packaging component and reuse history; separate FG-service cutoff"
  required_quality_disclosure: "Measurement uncertainty; data age/geography; supplier compatibility; unresolved exchanges; WIP/FG inherited vectors; all physical/component closure; service cutoff and later retained-FG burdens; allocation evidence/sensitivity; methodology review status"
  update_trigger: "Grade/formulation, external recycled input, layer/surface/route/cooling, dimensions/tests, provider/voltage/year, species/control, packaging/reuse, release/service gate or allocation evidence change"
data_sources:
  - id: "lyb-film-extrusion"
    type: "handbook"
    reference: "LyondellBasell, A Guide to Polyolefin Film Extrusion, complete 42-page PDF; printed 6047/1004, PDF metadata 2015. https://www.lyondellbasell.com/globalassets/lyb/our-solutions/products/documents/polymers-technical-literature/A_Guide_to_Polyolefin_Film_Extrusion.pdf"
    used_for: "Printed pp.9–15 and19–30: handling, electric melt/screen/die, blown/cast/coextrusion alternatives, air cooling, winding, regrind, start/stop and cleaning. General technology, not factory recipe/energy/yield or LCA allocation."
  - id: "lyb-lupolen-2420k"
    type: "literature"
    reference: "LyondellBasell, Lupolen2420K Technical Data Sheet, 15 October2026, pp.1–3. https://productsafety.lyondellbasell.com/DirectRequest?ProductGuid=79326e74-b73c-4977-9f56-b9e12367c004&ResponseTypeGuid=f1e32c20-d810-4db0-b25e-8e23a59f3733"
    used_for: "Illustrative non-additivated pellet supply, blown-film suitability, medical/pharmaceutical exclusion, specimen/typical-value limits, degradation and conditional condensation drying/storage. Not universal numeric defaults or same-factory evidence."
  - id: "polystar-monolayer-flat-film"
    type: "extension_guidance"
    reference: "POLYSTAR, Advantages of Using Monolayer Blown Film Machines for Plastic Packaging, undated official article; snapshot16 October2026. https://www.polystarco.com/blog-detail/advantages-of-using-monolayer-blown-film-machines-for-plastic-packaging/"
    used_for: "Independent machine capability: cold knives and back-to-back winders form two flat rolls. Hot-knife resealed tubular, blends/additives/recycled capabilities are adjacent exclusions, not this recipe. No output/energy/order assertion."
  - id: "ilcd-handbook-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, first edition March2010, §§7.9.2–7.9.3, printed pp.255–272 (PDF275–292). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Restricted attributional hierarchy: subdivision/virtual subdivision, exchange-specific determining physical causality, residual actual common-gate market value and per-exchange conservation. Stock/vector, single-normalization and component equations are explicit PCR accounting requirements, not quoted ILCD formulas; no full conformity/end-of-life default."
