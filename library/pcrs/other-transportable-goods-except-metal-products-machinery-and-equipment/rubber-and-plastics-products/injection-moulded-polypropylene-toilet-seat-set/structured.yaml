system_boundary:
  rules:
    - rule_id: b_complete
      applies_to: "manufacture"
      rule: "Include receipt and inbound movement, dosing, actual moisture/temperature conditioning, mould heating and all injection/cooling/ejection cycles, trimming, in-process inspection, eligible regrinding, assembly and destructive/final testing. Retain failed runs, zero-output campaigns, start/stop, idle and cleanup. A bought complete seat may not stand in for these operations."
      source_ids:
        - ifc-plastics-manufacturing-2007
        - ziax-seat-manufacturing-2025
    - rule_id: b_inputs
      applies_to: "all inventory rows"
      rule: "Count each whole supplied preparation/assembly once. Assay, carrier water, embedded materials and active ingredients are subaccounts. Actual in-house formulation uses each purchased constituent, mixing energy and loss. Require compatible provider coverage including raw polymerization, components and inbound transport. No cut-off is established by a missing UUID or missing meter."
      source_ids:
        - ifc-plastics-manufacturing-2007
    - rule_id: b_q_gate
      applies_to: "finished"
      rule: "Q is the sum of actual net kg of uniquely first-released complete configurations in the cohort period. Released closing FG is already part of Q and is not an additional manufacturing output. Shipping, reinspection, returned-set repair and internal reuse do not create Q. Unreleased ring/lid parts remain WIP. No fixed single-set kg, assumed density or source-derived test weight may substitute for weighing."
      source_ids:
        - ziax-seat-manufacturing-2025
    - rule_id: b_stocks
      applies_to: "all inventory rows"
      rule: "For each actual raw material, supplied component, regrind store, auxiliary, water-loop reservoir, in-process fluid, oil reservoir, installed refrigerant charge and adsorbent bed, retain disjoint opening/closing physical quantities, composition and per-exchange inherited burden vectors. Distinguish receipts, issues, returns, retained charge, real loss and outward transfers. Establish consumed burden by the stock_ledger rule before product allocation; raw receipt or refill is not automatically consumption. Retained media may provide service without losing mass: substantiate the assigned service burden and remaining vector with actual service/turnover evidence, not an assumed lifetime or full-charge factor; unresolved attribution remains a gap. Stocks already in product WIP or the separate packaging account cannot also enter this correction. Internal transfers preserve vectors and cancel at the consolidated gate; stock losses retain their burdens. Keep already assigned production/service trace vectors separate from unassigned stock burden entering C_j; a physical return or reused part never charges its original production again."
      source_ids:
        - ifc-plastics-manufacturing-2007
        - ilcd-attributional-allocation-2010
    - rule_id: b_wip
      applies_to: "manufacture"
      rule: "For every exchange j retain opening and closing WIP physical quantity, stage, composition and inherited burden vector. Assign raw current manufacturing expenditure and opening inherited burdens to actual output/waste/remaining WIP by traceable stage and allocation. Subtract only the evidenced closing-WIP vector to carry it forward. All failed and loss-producing operations retain burdens."
      source_ids:
        - ifc-plastics-manufacturing-2007
    - rule_id: b_service
      applies_to: "released_service"
      rule: "Keep actual packing, warehouse, handling, dispatch, return inspection and incremental repair in a cohort-linked service ledger. Preserve opening/closing FG and repair WIP physical quantities and inherited production/service vectors, original dispatch reversals on external return and actual incremental repair inputs/waste. Trace the removed component vector and remaining-set vector without subtracting the original production a second time or creating a credit; add only actual new component/repair-service burdens. Reusable removed parts retain their own stock/vector. Allocate historical-cohort services to their original release mass; never divide them by unrelated new production. Disclose the observed service window and unobserved future services."
      source_ids:
        - ziax-seat-manufacturing-2025
    - rule_id: b_physical
      applies_to: "manufacture; released_service"
      rule: "Use disjoint raw physical gates before allocation. For manufacture, actual boundary inputs + opening raw/auxiliary/regrind/in-process fluid/water-loop/oil/installed-charge/adsorbent stocks + opening product WIP = first release + corresponding closing stocks + closing product WIP + each actual external output/loss. Count whole preparations once and reconcile their constituent subaccounts. For the FG/repair gate, opening FG + new release + actual external returned sets + actual components issued into repair + opening repair WIP = closing FG + gross physical dispatch + actual whole-set rejects + actual removed-component outputs/losses + closing repair WIP; exclude packaging and separately reconcile unissued component/reusable removed-part stores. A removed component retained for reuse is a measured transfer into that store, not waste. Keep the repair subledger: incoming set mass + actual new component mass + opening repair WIP = repaired-set mass + actual removed-component/loss mass + closing repair WIP. Do not assume new and removed parts weigh the same. Internal release/regrind/repair/reuse transfers cancel in the consolidated gate; repair never creates new Q. Check total wet/dry mass and relevant C/Ti/metal/halogen balances independently from chemical speciation and water-phase evidence. Do not fit two unknowns with one residual. Non-reactive PP moulding implies no default reaction water; free/absorbed water, vapour and any genuinely documented reaction/structural water stay distinct."
      source_ids:
        - ifc-plastics-manufacturing-2007
    - rule_id: b_packaging
      applies_to: "released_service"
      rule: "For each individual sleeve, carton, tape, leaflet and pallet: opening empty + opening attached WIP/FG + opening reusable pool + purchases + external returns received = closing empty + closing attached WIP/FG + closing reusable pool + packaging leaving with gross physical shipments + outward returns + waste. Carry attached inbound packaging on returned sets explicitly; internal reuse cancels. Supplier-included inbound sacks are reconciled separately. Packaging never enters net product Q, a second purchase or an automatic co-product."
      source_ids:
        - ziax-seat-manufacturing-2025
    - rule_id: b_utilities
      applies_to: "all inventory rows"
      rule: "This bounded route uses electric heat/drives; it does not presume fuel combustion, steam, a boiler or condensate. Actual external cooling supply/return needs paired water-state measurements, heat transfer and supplier burden convention. Record any actually occurring purchased compressed air, fuel, heat, filter, chemical, component, waste and identified gas species as its own atomic card/protocol before using the dataset; a true route extension needs evidence and cannot be buried in zero, other or an aggregate flow."
      source_ids:
        - ifc-plastics-manufacturing-2007
