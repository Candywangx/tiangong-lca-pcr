allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The following rules are limited to attributional process multifunctionality. General industrial documents do not establish LCA allocation; the allocation context comes from ILCD."
    source_ids: []
  - rule_id: a_scenario
    applies_to: "all shared processes"
    rule: "These provisions apply only to an explicit attributional allocation-required scenario after goal/context assessment. Do not treat process physical/economic allocation as a free choice, consequential substitution rule or multifunctional-product QFD."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_subdivide
    applies_to: "all shared processes"
    rule: "First collect dedicated unit operations and product-exclusive material/energy/waste records. Use actual or defensible virtual subdivision for remaining separable parts. Assembly inputs unique to this configured set remain dedicated; do not allocate them to unrelated products. Document infeasibility and material distortion before leaving a common process."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_causality
    applies_to: "each remaining shared exchange"
    rule: "Identify the determining physical relation separately for each exchange: how changing the quantity of each delivered product changes that actual input/output. A validated cycle/shot load model may differ from material incorporation, cleaning area or warehouse occupied-volume-time. Test operating/load records; mass, item count or machine time is not automatically causal. Different exchanges may need different criteria. Ring and lid jointly forming one set are internal components, not saleable coproducts by default."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_residual
    applies_to: "genuinely unresolved common-process exchanges"
    rule: "Only after justifying that determining physical causality cannot resolve an exchange, allocate that genuine remainder by contemporaneous market value at the actual common-process gate and actual quality, bulk amount and packaged/unpackaged state. Remove later product-specific transport/conditioning/service costs from downstream prices. Retain evidence and sensitivity; no fixed ratio, arbitrary physical/economic selector, zero-value waste adjustment or automatic avoided-product credit."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_regrind
    applies_to: "manufacture; released_service"
    rule: "Eligible internal PP regrind retains its exact identity, pigment/contamination state and inherited vector plus grinding/drying/reprocessing increments. It is neither new virgin purchase nor burden-free output. Separately sold scrap requires demonstrated destination and explicit system-boundary/allocation treatment; do not net it from virgin feed or add a credit automatically. External returned seat repairs remain original-cohort increments."
    source_ids:
      - ilcd-attributional-allocation-2010
      - ifc-plastics-manufacturing-2007
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "supplied preparations and auxiliaries"
      record_type: "weighing; stock; invoice; formulation"
      raw_fields: "lot; supplied full formulation; received kg; each disjoint opening/closing raw/auxiliary/regrind/fluid/oil/installed-charge/adsorbent stock; measured composition; per-exchange inherited vectors; actual issues/refills; residual; internal/external returns and unused outward transfers; real losses; measured concentration; actual conditioning; service/turnover evidence; internal regrind movements"
      collection_method: "Calibrated whole-preparation weighings, receipts and each stock/charge reading; independently measure active/carrier composition without a second purchase. Reconcile each material raw physical ledger, distinguish issue/refill from actual consumed amount, and apply stock_ledger once to its inherited vectors before allocation. Retain actual losses; substantiate retained-media service attribution and unresolved values. Keep actual input UUID/provider state."
      unit: "kg"
      frequency: "each lot and charge"
      temporal_coverage: "all campaign periods including zero output"
      site_scope: "each receiving/dosing and maintenance station"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; invoices; supplier assay; stock reconciliation"
    - protocol_id: cp_components
      process_id: "manufacture"
      flow_role: "configured supplied parts"
      record_type: "BOM; purchase; count and weighing"
      raw_fields: "configuration; supplier article; included assembly BOM; received/issued/returned counts and measured component masses; disjoint opening/closing component stores; composition and inherited vectors; gross/tare; rejection; actual grade and finish"
      collection_method: "Match purchased component drawings/BOM to released set and weigh supplied parts independently; reconcile received/issued/returned parts and stock_ledger vectors before allocation, avoiding nested-assembly double counting."
      unit: "kg"
      frequency: "each component lot and configuration change"
      temporal_coverage: "complete campaign with trial and destructive rejects"
      site_scope: "receipt and assembly workstations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "purchase BOM; scale records; assembly checks"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "manufacturing electricity"
      record_type: "meter; load study; time record"
      raw_fields: "meter ID; start/end readings; original unit; true rate/time if applicable; machine mode; cycle/shot; regrind/conditioner/chiller/compressor meters; allocation drivers"
      collection_method: "Use cumulative kWh differences or integrate true kW rate once. Submeter operations or substantiate exchange-specific load relations; retain startup, failed, idle and cleaning periods."
      unit: "kWh"
      frequency: "continuous meter with campaign reconciliation"
      temporal_coverage: "all operating and nonproductive time"
      site_scope: "complete converter and associated auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated meter; load-model validation; no unmetered exclusion"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "water and actual aqueous outlets"
      record_type: "meter; sample; thermal-state record"
      raw_fields: "each inlet/outlet; original mass or integrated volume; actual density/state; temperature/pressure; each disjoint water-loop/in-process-fluid opening/closing quantity and composition; per-exchange inherited vectors; actual makeup/withdrawal/loss/return; water content; dissolved/suspended species; supplier convention; heat-transfer reference"
      collection_method: "Measure boundary streams and each reservoir change; independently establish each liquid density if volume conversion is required. Reconcile physical water and constituent ledgers and stock_ledger vectors without treating circulation as purchases. Pair real cooling-return state and heat transfer, excluding internal circulation from purchases."
      unit: "kg"
      frequency: "continuous flow plus batch sample"
      temporal_coverage: "same campaign with maintenance and cleanup"
      site_scope: "individual water circuits and actual discharge interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; density and species assays; supplier thermal convention"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "first-release net complete sets"
      record_type: "unique acceptance; calibrated mass; configuration"
      raw_fields: "configuration; serial or lot; unique first-release ID/date; complete BOM; accepted count; individual net set kg; loose fitting kit; packaging tare; test disposition; WIP/FG state"
      collection_method: "Weigh complete accepted configurations on a calibrated scale excluding all transport packaging and including the declared hinge/bumper/fixing kit. Reconcile measured set masses, count, unique first releases and closing FG."
      unit: "kg"
      frequency: "each first-release lot and configuration"
      temporal_coverage: "same campaign and traced prior inherited cohorts"
      site_scope: "final assembly/testing and FG entry"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; actual drawings and test reports; unique-release register"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "each actual waste stream"
      record_type: "weighing; transfer; composition"
      raw_fields: "stream identity; raw kg; original unit; wet/dry content; independently measured composition; opening/closing stocks; destination; retained burden; regrind suitability"
      collection_method: "Segregate physically distinct waste streams, weigh and trace recipient. Record recoverable internal transfers and their inherited vectors separately; no inferred zero from missing contractor data."
      unit: "kg"
      frequency: "each waste movement and stocktake"
      temporal_coverage: "all campaigns including failed runs and maintenance"
      site_scope: "actual waste collection points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; composition; legal recipient evidence without automatic credits"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each identified release species"
      record_type: "species analysis; mass balance; maintenance log"
      raw_fields: "actual chemical; phase; medium; sample interval; total integrated gas/liquid volume or true rate; temperature/pressure; independent density; concentration/speciation; capture path; stock/refill/recovery; detection limit"
      collection_method: "Use molecule-specific measurements and real control destinations; integrate true rates once and use already integrated volumes directly. Distinguish reporting metrics from chemical mass and preserve non-detect limits as uncertainty."
      unit: "kg"
      frequency: "representative mode-specific tests and maintenance events"
      temporal_coverage: "complete campaign modes including startup/upset/cleaning"
      site_scope: "each actual vent/discharge and refrigerant unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling scope; analytical recovery; species proof; control mass balance"
    - protocol_id: cp_service
      process_id: "released_service"
      flow_role: "cohort service and each packaging/component movement"
      record_type: "warehouse; packaging; utility; return; repair records"
      raw_fields: "cohort original release kg; first-release IDs; opening/closing FG and inherited vectors; gross dispatch; original dispatch reversal; external returned-set measured mass; each new/removed component identity and independently measured mass; received/issued/returned repair components; unissued/reusable-removed-part opening/closing stores and inherited vectors; opening/closing repair WIP quantity/composition and inherited vectors; actual incremental repair services/losses; service utility raw units; each packaging opening empty/attached/pool; purchase; external return received; closing empty/attached/pool; gross outward packaging; outward return; waste; period"
      collection_method: "Trace every set and service cost to original release cohort. Independently weigh each new and removed repair component and each packaging stream; reconcile stock_ledger, the complete FG/repair subgate and packaging physical ledgers before allocation. Preserve removed-part/remaining-set inherited vectors and original dispatch reversal without a second production charge or new Q. Meter actual incremental repair and service utilities without manufacturing double count."
      unit: "kg; kWh"
      frequency: "each service movement and period close"
      temporal_coverage: "declared observed window by original cohort"
      site_scope: "warehouse/packing/dispatch/return-repair interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "cohort trace; scale/meter calibration; returns and original dispatch proof"
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "material inbound road freight"
      record_type: "shipment and route records"
      raw_fields: "supplied material lot; raw net/tare/gross kg; actual road distance km; payload; vehicle and load state; supplier transport coverage; return-leg convention; allocation drivers"
      collection_method: "Retain raw weights and distances for every actual leg; compute tonne-kilometres before allocation. Match freight provider boundary and prevent duplicate delivered transport."
      unit: "tkm"
      frequency: "each actual delivery leg"
      temporal_coverage: "all supplied lots in campaign"
      site_scope: "actual supplier-to-receiver route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "shipment weights; route evidence; provider coverage"
  calculation_rules:
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert raw units to the exchange unit before allocation: cumulative-meter differences are already integrated; integrate only true rates. Count-based component totals use measured component net masses of the actual configuration. Volume-to-mass uses independently measured density of that exact material/state. kWh to MJ uses 3.6 when needed; never infer a set kg or density from a background factor."
      inputs:
        - raw_records
        - actual_unit_conversion
        - measured_component_mass
        - independent_density
      output: "converted_raw"
      source_ids:
        - ifc-plastics-manufacturing-2007
    - id: stock_ledger
      applies_to: "all inventory rows"
      rule: "Across disjoint non-WIP stocks r for each exchange j, consumed_vector_j = sum_r(opening_vector_rj - closing_vector_rj) + actual_received_vector_j + actual_external_return_vector_j - unused_outward_transfer_vector_j. These are unassigned stock burdens; actual_received means external supplied-material receipts once, excluding separately tracked stock returns and internal transfers. Already assigned FG/removed-part trace vectors do not become a new received burden. Retain quantities/composition separately for every actual material and medium; actual issues, stock losses, retired charge and evidenced service provided determine attribution, not receipts alone. Closing vectors reflect evidenced remaining material/service potential without a default life or linear depletion assumption. Internal stock/regrind transfers cancel within the combined account; retain their individual vectors without a second receipt. Exclude product WIP and packaging corrected elsewhere. Reconcile consumed plus remaining/transferred vectors to the original total and preserve raw received/issued/returned/loss physical quantities unchanged."
      inputs:
        - opening_vector
        - actual_received_vector
        - actual_external_return_vector
        - closing_vector
        - unused_outward_transfer_vector
        - physical_stock_records
        - service_evidence
      output: "consumed_vector"
      source_ids:
        - ifc-plastics-manufacturing-2007
        - ilcd-attributional-allocation-2010
    - id: attribute_raw
      applies_to: "all inventory rows"
      rule: "C_j = dedicated attributable_raw_j + sum(shared_attributable_raw_jk * evidenced_share_jk); attributable_raw uses consumed_vector from stock_ledger for stored materials/media/components and converted raw totals for actual non-stock services/releases. Do not add the receipts/refills or stock vectors again. Determine each share by §7 while keeping actual physical quantities separate and unchanged. Retain every zero-output/failed/startup/idle/cleanup load. Preserve vectors for actual internal regrind and WIP transfers without new virgin purchase."
      inputs:
        - converted_raw
        - consumed_vector
        - dedicated_record
        - share_jk
        - inherited_vector
      output: "C_j"
      source_ids:
        - ilcd-attributional-allocation-2010
    - id: release_denominator
      applies_to: "finished"
      rule: "Q_c = sum(unique_first_release_net_kg_c); each complete accepted set is weighed and counted in cp_release. Closing newly released FG is already in this sum; exclude packaging, old returned sets and repeat inspection/dispatch."
      inputs:
        - unique_first_release_net_kg
        - cp_release
      output: "Q_c"
      source_ids:
        - ziax-seat-manufacturing-2025
    - id: carry_wip
      applies_to: "manufacture"
      rule: "A_j_c = C_j_c + opening_WIP_burden_j_c - closing_WIP_burden_j_c; C_j is already corrected once for the disjoint non-WIP stocks in stock_ledger. Opening and closing product-WIP vectors are exchange-specific and based on measured stage/composition and actual assigned burdens. Reconcile each vector to physical WIP; do not repeat a raw/charge/repair-stock correction here. Unexplained stock change is a gap."
      inputs:
        - C_j
        - opening_WIP_burden
        - closing_WIP_burden
        - cp_release
      output: "A_j_c"
      source_ids:
        - ifc-plastics-manufacturing-2007
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q_c > 0, result_j_c = A_j_c / Q_c for manufacture. The service ledger uses A_j_c equal to actual incremental cohort-attributed service after the disjoint component/media stock_ledger correction plus opening service/repair-WIP vector minus closing service/repair-WIP vector, and the same cohort original release kg as Q_c. Removed-part/remaining-set inherited production vectors are traced separately, not re-purchased or credited; new components and real repair operations add only their actual incremental burdens. For internal-transfer, external-return and gross-dispatch physical movement cards, A_j_c is the actual raw physical movement in its unit, not new production/service expenditure; carry inherited burden separately and cancel internal movements. For each packaging purchase, the physical input card retains purchases; assign actual consumed packaging burden from opening unused-stock vector plus purchases minus closing unused-stock vector and outward unused-stock transfers, tracing external-return vectors without treating returns/reuse as new purchases. Execute this one division once; card amounts and aggregation views use the stored result unchanged. Q_c=0 retains burdens and yields no unit result. Consolidate only matching cohort/coverage and cancel internal physical transfers; inherited production vectors are carried, not added a second time as new service expenditure."
      inputs:
        - A_j_c
        - Q_c
        - cohort_id
        - service_coverage
      output: "result_j_c"
      source_ids:
        - ifc-plastics-manufacturing-2007
        - ziax-seat-manufacturing-2025
    - id: physical_reconciliation
      applies_to: "all inventory rows"
      rule: "Evaluate the manufacturing/FG/consolidated mass and relevant-element equations and each independent packaging equation in §5 in raw physical units before normalization. Product, waste, elementary and external cooling-return directions remain distinct. Physically measure independent unknowns rather than assigning one residual to multiple sinks."
      inputs:
        - physical_opening
        - physical_inputs
        - physical_closing
        - physical_outputs
        - species_assays
      output: "reconciliation_report"
      source_ids:
        - ifc-plastics-manufacturing-2007
        - ziax-seat-manufacturing-2025
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_source
      applies_to: "all inventory rows"
      requirement: "Use actual configuration/grade/route and period/site-specific records; public sources supply process context only. Separate supplier evidence from mixed-source technical synthesis."
      evidence: "full supplier records; source context; actual BOM"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Unlisted actual exchanges need atomic cards and protocols. Conditional absence requires physical evidence; no measurement/UUID is an unresolved value, not a zero. Do not omit rejected/zero-output periods, auxiliary consumption or supply/return interfaces."
      evidence: "operation map; purchase and stock census; actual discharge screening"
    - id: dq_trace
      applies_to: "all inventory rows"
      requirement: "Retain raw units and calibration, conversion, share evidence, inherited vectors, one stored normalization result and uncertainty. Ordinary missing provider/auxiliary identity is resolved before that data use, without fabricating universal quantities."
      evidence: "raw-to-result audit and stock/service lineage"
    - id: dq_function
      applies_to: "finished"
      requirement: "Disclose actual geometry, mounting dimensions, net mass, test method/result, exclusions and supported lifespan/cycles. Mass-normalized records alone do not compare different seat functions or certify a standard."
      evidence: "configuration-specific drawing/BOM and test evidence"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Verify each supplied physical/chemical article, actual occurrence, native type, all names/comments/CAS, fixed state/route/grade/form/geography, all properties and exact property-to-unit-group chain before quantitative provider binding. Broad native sanitary ware and PP displays remain qualified as in each card; no certification or grade equivalence follows from UUID presence."
    source_ids:
      - ifc-plastics-manufacturing-2007
      - ziax-seat-manufacturing-2025
  - rule_id: v_raw
    applies_to: "all inventory rows"
    rule: "Require unnormalized raw records with original units, cumulative-meter versus true-rate distinction, actual conversions and exchange-specific allocations. Execute the single §8 normalization only once after raw conversion/allocation and WIP-vector reconciliation. Card amounts and collection aggregation refer to that same result; do not divide a pre-normalized factor again. Q=0 retains real loads and produces no per-unit value. Unknowns are gaps rather than verified zero or pass."
    source_ids:
      - ifc-plastics-manufacturing-2007
  - rule_id: v_gates
    applies_to: "manufacture; released_service"
    rule: "Reconcile §5 manufacturing, FG and consolidated physical gates and every packaging equation, together with inherited burden vectors. Gross shipments, net commercial delivery, release Q and physical returns are different observables. Check rejection/destructive tests and all service repairs without creating extra production. No balancing residual may serve simultaneously as water loss and unknown chemical emission."
    source_ids:
      - ifc-plastics-manufacturing-2007
      - ziax-seat-manufacturing-2025
  - rule_id: v_species
    applies_to: "all emission and wastewater rows"
    rule: "Retain actual molecule/species, phase, medium, test method, detection limits and control-device destination. Total VOC, COD, aldehyde group or mass residual does not establish specific chemical mass. Independently measure any density at that substance state; integrated liquid/gas volume is not multiplied by time again, while true rates are integrated. IFC Table4 prompts screening under its stated high-temperature condition and never establishes a universal release list or factor."
    source_ids:
      - ifc-plastics-manufacturing-2007
  - rule_id: v_release
    applies_to: "finished"
    rule: "Require complete configuration BOM, traceable first quality release and measured net mass, plus actual declared geometric/functional/load/chemical checks. Informal supplier trial weights, catalogue dimensions and generic native identity do not certify the modeled configuration. A real unresolved terminal/manufacturing-method gap prevents completed-method claims; ordinary auxiliary identity or future factory measurements do not alone establish such a gap."
    source_ids:
      - ziax-seat-manufacturing-2025
      - glasfil-pp-seat-trials
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Configured PP-seat input to a downstream assembly/building LCA with matching boundary and disclosed observed service add-on"
  allowed_use: "Only actual §1 route/configuration, valid provider and unit basis, transparent release gate and observed service coverage"
  excluded_use: "Whole-CPC coverage; ceramic/UF/foam/wood/basin/cistern substitution; durability or compliance certification; replacing manufacture with packing; automatic recycling credits"
  required_metadata: "All required qualifiers; actual raw material supply forms and full formulations; process/row/protocol IDs; upstream provider coverage; actual emission species; original cohort release and service windows"
  required_quality_disclosure: "No generic source factors adopted; allocation proof and uncertainty; WIP/FG and packaging vectors; gaps, non-detect limits and measurement completeness; actual observed-service coverage"
  update_trigger: "Change of polymer/grade/formulation, geometry/BOM, hinge or damping, coating, electricity/cooling interface, process/cycle evidence, release gate, provider, measured mass, service/return handling or source constraints"
data_sources:
  - id: "ifc-plastics-manufacturing-2007"
    type: "official_guidance"
    reference: "IFC / World Bank Group. Environmental, Health, and Safety Guidelines for Metal, Plastic, and Rubber Products Manufacturing (30 April 2007), pp9–11 and21–24. https://www.ifc.org/content/dam/ifc/doc/2000/2007-metal-plastic-rubber-products-ehs-guidelines-en.pdf"
    used_for: "Non-reactive pellet supply; injection forming; granulation; additive delivery; water/waste/emission screening. Table4 is high-temperature potential-release context; no factors or allocation rules."
  - id: "ziax-seat-manufacturing-2025"
    type: "handbook"
    reference: "Xiamen Ziax Sanitaryware. OEM Toilet Seat Manufacturing Process (14 November 2025). https://www.ziaxbathroom.com/info/oem-toilet-seat-manufacturing-process-ziax-103216236.html"
    used_for: "Seat-specific moulding, finishing, hinge assembly, QC and packaging stages. Alternative UF/wood, coating and damping variants are distinguished. Marketing test numbers are not adopted specifications."
  - id: "sanit-plast-pp-seats"
    type: "handbook"
    reference: "Sanit-Plast. Manufacturer of plastic toilet seats. https://sanit-plast.eu/"
    used_for: "Independent industrial PP-seat injection endpoint; its supplier/machine example does not fix this PCR provider or grade."
  - id: "glasfil-pp-seat-trials"
    type: "handbook"
    reference: "Glasfil Polymer. Polymer Material Selection Case Study. https://glasfil.com/case-study/glasfil-polymer-material-selection-case-study/"
    used_for: "Specific homopolymer seat-cover trial and failed talc-filled/copolymer trials. Qualitative counterevidence only; informal tests do not establish load certification or universal grade equivalence."
  - id: "agi-plastek-sanitary-catalogue"
    type: "handbook"
    reference: "AGI plastek. Catalogue V7, PDF pp80–82 (seat page81; PDF metadata March2023). https://www.agi-glaspac.com/wp-content/uploads/2025/07/AGI-plastek-catalogue-V7.pdf"
    used_for: "Viewed original seat-and-lid illustrations/material table and adjacent cistern/valve counterexamples. No catalogue dimensions, mass, performance, yield or factory factors transferred."
