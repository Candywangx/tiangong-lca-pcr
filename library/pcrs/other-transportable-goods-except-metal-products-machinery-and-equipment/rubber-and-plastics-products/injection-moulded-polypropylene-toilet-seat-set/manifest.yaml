  semantic_boundary_decision: New semantic product boundary for complete unfilled PP-homopolymer conventional non-electric injection-moulded seat/lid sets. Full material catalog1242, canonical manifests, raw CPC source and frozen36310/36330/36390/36410 intakes reviewed; resin/film/profile/foam/bag, metal sanitaryware and injection-mould tooling cannot supply these article assembly and unique first-release requirements. Running slots used only as queue scope. Broad retained sanitary scaffold is empty and not a second material methodology; no mapping/index/alias mutation.
  measurement_stock_contract: Disjoint raw/component/regrind/fluid/water-loop/oil/installed-charge/adsorbent physical stocks and inherited exchange vectors use stock_ledger before allocation; product WIP and packaging corrections remain separate. Actual retained-media service burden requires evidence without a default lifetime.
  repair_gate_contract: Actual new and removed component masses, component/reusable stores and repair WIP close the original-cohort FG/repair subgate; inherited vectors are traced without new production, automatic credit or new Q.
  terminal_gate: New unique first-quality-release net mass Q, complete configured seat plus lid and declared mounting components, packaging excluded. Newly released closing FG is already included. Post-release services retain original cohort and inherited FG vectors; internal Q transfer cancels physically, return/reinspection/dispatch never creates Q.
  source_synthesis: Complementary primary AGI, Sanit-Plast, Glasfil and ZIAX facts plus general IFC thermoplastic processes; not one SKU/order/plant. No quantitative source factors, grade equivalence, dimensions, test loads or certification imported. ILCD only for attributional allocation-required common processes.
  reference_identity_limitations: Native broad manufactured plastic sanitary article, Product flow, production mix at plant, Mass only; no fixed polymer/route/grade/form/geometry/CAS/geography/life/performance. Use restricted to configured §1 PP seat-set subset with all restrictions present in consumable native card context.
