allocation_rules:
  - rule_id: a_context
    applies_to: "all inventory rows"
    rule: "The hierarchy applies within the declared attributional scenario to actual residual multifunctionality; complete preceding conditions remain part of every allocation rule."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_scenario
    applies_to: "all inventory rows"
    rule: "Apply these allocation rules only to an attributional inventory in a declared scenario requiring partitioning; they do not establish a consequential substitution model or a product comparison. The industrial sources support manufacturing and supply forms, not this allocation hierarchy."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_subdivide
    applies_to: "all inventory rows"
    rule: "First assign dedicated meters, batches, formulation purchases, waste measurements and transport/service records to their specific product. Subdivide physically distinguishable operations; use evidenced virtual subdivision for exclusive exchanges when complete subdivision is infeasible. Keep the reason, data and residual shared pool for each exchange; do not allocate a whole factory uniformly."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "all inventory rows"
    rule: "For every genuinely residual shared exchange identify the determining physical causal relationship: quantify how changes in the delivered functions change that exchange, including throughput/heat duty for melting or chilling and occupancy-duration for storage where supported. A convenient mass, volume, time or energy ratio alone is not causal proof. Use different justified criteria for different exchanges; preserve complete pool reconciliation and uncertainty."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_residual_value
    applies_to: "all inventory rows"
    rule: "Only if a residual exchange has no identifiable determining physical causality, document that conclusion and use contemporaneous market values of the co-functions at the same common process gate and actual state, quantity, quality and packaging condition. Remove separately attributable downstream finishing before comparison. Record quantities, values, period, currency, gate, evidence and sensitivity. Missing or negative/ambiguous values require review rather than a fabricated ratio. Never choose physical or economic allocation freely."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_recovery
    applies_to: "all inventory rows"
    rule: "Internal regrind and reusable packaging are transfers with real handling burden, not coproducts or avoided virgin supply. Classify actual secondary outputs by function, quality, ownership, destination and waste/product status; subdivision and the preceding exchange-specific hierarchy apply only to genuine co-functions. Do not import the case EPD annual mass shares, zero production-waste assumption, incineration credits or one-month emission assumption."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_exchange
      process_id: "manufacture"
      flow_role: "individual material and waste"
      record_type: "weighing; purchase; issue; waste"
      raw_fields: "row_id; supplier grade; lot; original quantity and unit; assay; date; opening and closing raw stock; actual issues; waste ticket; destination"
      collection_method: "Use calibrated weighing and traceable delivery/issue/return tickets. Reconcile whole purchased formulations once and maintain constituent subaccounts. Record every actual stream and non-occurrence evidence separately; retain raw totals before attribution or normalization."
      unit: "kg; original units"
      frequency: "each lot and event"
      temporal_coverage: "complete actual reporting interval including failed/idle periods"
      site_scope: "actual line and stores"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; invoices; stock reconciliation; tickets; formulation assay"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "individual electricity and actual additional utility"
      record_type: "meter readings; machine logs"
      raw_fields: "meter_id; row_id; start/end readings; time interval; original unit; equipment state; shared pool; activity driver; supply boundary"
      collection_method: "Read submeter differences and real power logs; integrate actual rate samples once. Attribute dedicated circuits before justified shared-pool decisions. Collect startup, idle, cleanup, cooling, regrinding and dispatch records without dividing by output. Add actual fuel/heat/refrigerant rows separately if present."
      unit: "kWh; MJ; original units"
      frequency: "continuous meters and every state transition"
      temporal_coverage: "same complete periods as stock ledger"
      site_scope: "line and actual utility/warehouse boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; energy reconciliation; pool decision evidence"
    - protocol_id: cp_energy_delivery
      process_id: "delivery"
      flow_role: "individual electricity and actual additional utility"
      record_type: "meter readings; machine logs"
      raw_fields: "meter_id; row_id; start/end readings; time interval; original unit; equipment state; shared pool; activity driver; supply boundary"
      collection_method: "Read submeter differences and real power logs; integrate actual rate samples once. Attribute dedicated circuits before justified shared-pool decisions. Collect startup, idle, cleanup, cooling, regrinding and dispatch records without dividing by output. Add actual fuel/heat/refrigerant rows separately if present."
      unit: "kWh; MJ; original units"
      frequency: "continuous meters and every state transition"
      temporal_coverage: "same complete periods as stock ledger"
      site_scope: "line and actual utility/warehouse boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; energy reconciliation; pool decision evidence"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "cooling-water inlet return and blowdown"
      record_type: "water meter; thermal state; treatment ticket"
      raw_fields: "row_id; mass or integrated volume; rate flag; temperature; pressure; composition; density evidence; inlet/outlet; internal circulation; evaporation; blowdown; supplier water-energy agreement"
      collection_method: "Measure each external water port and thermal state independently; distinguish internal recycle from external Product return and waste to treatment from environmental discharge. Use an actual matched-state density or direct mass. Do not assume a steam system or copy nonexistent condensate."
      unit: "kg; degC; original units"
      frequency: "each actual operating interval"
      temporal_coverage: "complete manufacturing periods"
      site_scope: "actual external utility ports"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water balance; state measurements; supplier contract; density source"
    - protocol_id: cp_stock
      process_id: "manufacture"
      flow_role: "P WIP FG delivery and return burden vectors"
      record_type: "calibrated weighing; cohort ledger; dispatch records"
      raw_fields: "cohort_id; configuration; raw opening/closing WIP; raw opening/closing FG; trim and regrind; P; G; original delivery R0; current returned mass; original burden vector by row; incremental rework; retained CO2 and ethanol; age; rejects; destination"
      collection_method: "Weigh every lot on calibrated scales at handoff and dispatch and retain gross/tare records; link all stock and return events to unique original cohorts. Preserve the historical raw exchange vector independently of current purchases. Record original dispatch reversal and current returned physical state separately; reconcile manufacture, FG and combined gates before allocating any remaining pool."
      unit: "kg; original exchange units"
      frequency: "every handoff dispatch return and reporting boundary"
      temporal_coverage: "current period plus actual historical cohort records"
      site_scope: "line FG stores and actual factory dispatch gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated gross/tare; cohort traceability; full vector rollforward; acceptance and return evidence"
    - protocol_id: cp_stock_delivery
      process_id: "delivery"
      flow_role: "P WIP FG delivery and return burden vectors"
      record_type: "calibrated weighing; cohort ledger; dispatch records"
      raw_fields: "cohort_id; configuration; raw opening/closing WIP; raw opening/closing FG; trim and regrind; P; G; original delivery R0; current returned mass; original burden vector by row; incremental rework; retained CO2 and ethanol; age; rejects; destination"
      collection_method: "Weigh every lot on calibrated scales at handoff and dispatch and retain gross/tare records; link all stock and return events to unique original cohorts. Preserve the historical raw exchange vector independently of current purchases. Record original dispatch reversal and current returned physical state separately; reconcile manufacture, FG and combined gates before allocating any remaining pool."
      unit: "kg; original exchange units"
      frequency: "every handoff dispatch return and reporting boundary"
      temporal_coverage: "current period plus actual historical cohort records"
      site_scope: "line FG stores and actual factory dispatch gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated gross/tare; cohort traceability; full vector rollforward; acceptance and return evidence"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "each chemical species and receiving medium"
      record_type: "species measurements; retained-product tests; exhaust records"
      raw_fields: "species; CAS; phase; origin; medium; point; concentration and response basis; original gas/liquid volume; rate flag; time; temperature; pressure; moisture correction; independently measured retained mass; capture; uncertainty"
      collection_method: "Use species-selective sampling with calibrated flow measurement and matched pressure/temperature/moisture basis; retain integrated volume as volume. Independently measure retained gases and composition over relevant ages. Establish independent total mass and carbon/other relevant elemental closure without assigning two unknowns from one residual. Total VOC/COD/TOC/PM indicators are not chemical identities."
      unit: "kg; measured concentration; original volume/rate units"
      frequency: "representative operating states plus each conditioning age window"
      temporal_coverage: "all manufacture and FG intervals including idle and failures"
      site_scope: "actual vents fugitive points stocks and external ports"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; speciation; sampling/state basis; independent assays; capture evidence; balance uncertainty"
    - protocol_id: cp_species_delivery
      process_id: "delivery"
      flow_role: "each chemical species and receiving medium"
      record_type: "species measurements; retained-product tests; exhaust records"
      raw_fields: "species; CAS; phase; origin; medium; point; concentration and response basis; original gas/liquid volume; rate flag; time; temperature; pressure; moisture correction; independently measured retained mass; capture; uncertainty"
      collection_method: "Use species-selective sampling with calibrated flow measurement and matched pressure/temperature/moisture basis; retain integrated volume as volume. Independently measure retained gases and composition over relevant ages. Establish independent total mass and carbon/other relevant elemental closure without assigning two unknowns from one residual. Total VOC/COD/TOC/PM indicators are not chemical identities."
      unit: "kg; measured concentration; original volume/rate units"
      frequency: "representative operating states plus each conditioning age window"
      temporal_coverage: "all manufacture and FG intervals including idle and failures"
      site_scope: "actual vents fugitive points stocks and external ports"
