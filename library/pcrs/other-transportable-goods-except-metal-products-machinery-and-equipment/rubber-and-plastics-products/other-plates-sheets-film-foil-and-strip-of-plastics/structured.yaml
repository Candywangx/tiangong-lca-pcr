      quality_evidence: "calibration; speciation; sampling/state basis; independent assays; capture evidence; balance uncertainty"
    - protocol_id: cp_pack
      process_id: "delivery"
      flow_role: "each film pallet strap label and waste"
      record_type: "individual packaging stock and destination ledger"
      raw_fields: "packaging_id; composition; original units; measured configuration mass; opening empty; opening attached WIP/FG; opening reusable; purchases; external return received; closing empty/attached/reusable; gross physical shipment; external return out; waste; internal reuse"
      collection_method: "Weigh and reconcile each packaging form separately, including incoming supplier packaging and attached stock when relevant. Distinguish gross physical shipments from net board Q and external return receipts from purchases. Internal reuse cancels in the physical equation and carries its real service burden. No fixed reuse count or item-to-kg guess."
      unit: "kg; original units"
      frequency: "each packaging transaction and stock boundary"
      temporal_coverage: "same delivery reporting interval and linked cohort histories"
      site_scope: "actual empty attached and reusable stores"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; individual stock balance; return and waste records; service-life evidence"
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "one actual incoming road service"
      record_type: "freight tickets; route and loading records"
      raw_fields: "leg_id; material lot; mode; original mass; route distance; loading; empty movement; provider boundary; inherited delivery scope"
      collection_method: "Retain actual leg records and distinguish service activity from vehicle fuel already covered by a provider. Convert kg to tonnes and distance to km before attribution; collect raw activity only. Add other real transport modes as separate atomic service rows."
      unit: "t*km; original units"
      frequency: "each incoming delivery leg"
      temporal_coverage: "actual supply reporting interval"
      site_scope: "actual supplier-to-foreground logistics boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "waybills; routing; loading; no overlap with supplied input dataset"
  calculation_rules:
    - id: normalize_once
      applies_to: "gpps; carbon_dioxide; ethanol; colour_masterbatch; nucleating_masterbatch; modifier; electricity_mfg; cooling_water; gear_oil; freight; board_handoff; water_return; waste_board; waste_dust; waste_bag; waste_oil; cooling_blowdown; co2_air_mfg; ethanol_air_mfg; styrene_air; ps_air; water_vapour; fg_in; returned_board; wrap; pallet; strap; label; electricity_delivery; out_wrap; out_pallet; out_strap; out_label; waste_wrap; waste_pallet; waste_strap; waste_label; waste_liner; rejected_fg; co2_air_fg; ethanol_air_fg"
      rule: "a_i = A_i / Q. A_i is the raw exchange numerator after actual unit conversion, attribution and inherited stock/return corrections; Q is net accepted dispatch in kg. Execute this one division only when Q>0. Each card and aggregation field references this same result; delivered_board is the 1 kg reference identity, not a second division."
      inputs:
        - A_i
        - Q
        - cp_stock_delivery
      output: "a_i"
      source_ids:
        - jrc-ilcd-2010
    - id: raw_unit_conversion
      applies_to: "all inventory rows"
      rule: "Convert original measured quantity into the row unit before attribution. Integrated liquid/gas volume times an independently evidenced matched-state density gives mass; true rate requires integration over the actual time interval first. Do not use total VOC or COD as a specific chemical mass, count as mass, or a secondary flow coefficient as physical density."
      inputs:
        - original_quantity
        - original_unit
        - state
        - density_evidence
        - rate_flag
      output: "converted_raw_amount"
      source_ids:
        - finnfoam-xps-2021
    - id: stock_vector_rollforward
      applies_to: "all inventory rows"
      rule: "For each exchange i retain opening WIP/FG/regrind burdens, current attributable additions and traceable return burden reversals; reconcile them to closing WIP/FG/regrind, gross delivered cohorts and other real exits at the same gates. A_i for net delivery is gross delivered historical/current vector less the exact original vector of reversed deliveries, including real incremental rework only once. Do not expense all current production when some remains in closing stock; do not erase opening burdens or substitute current average burdens."
      inputs:
        - opening_vectors
        - current_raw_additions
        - closing_vectors
        - gross_dispatch_vectors
        - reversed_original_vectors
        - real_other_exit_vectors
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: net_delivery_gate
      applies_to: "delivered_board"
      rule: "Q = G - R0, in kg at the declared accepted dispatch state. G is gross accepted outward product mass excluding packaging. R0 is the original delivered mass for traceable delivery reversals, not the current physical returned mass. Preserve cohort and period links and signed corrections; if Q<=0 retain loads without a unit result."
      inputs:
        - G
        - R0
        - cp_stock_delivery
      output: "Q"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "Manufacturing: opening physical WIP/regrind plus actual material inputs and physical returns equals closing WIP/regrind plus handoff P plus waste and individual emissions. FG: opening FG plus P plus current physical customer returns equals closing FG plus gross physical outbound board plus rejects and individual storage emissions. Combine by cancelling internal P and paired internal transfers. Packaging is outside board mass, balanced separately. Independently reconcile polymer/material composition and relevant elements; cell-gas exchange and measured moisture remain explicit."
      inputs:
        - opening_physical_stocks
        - actual_inputs
        - actual_returns
        - closing_physical_stocks
        - P
        - gross_physical_outputs
        - species_outputs
      output: "gate_balance_residuals"
      source_ids:
        - finnfoam-xps-2021
    - id: packaging_balance
      applies_to: "wrap; pallet; strap; label; out_wrap; out_pallet; out_strap; out_label; waste_wrap; waste_pallet; waste_strap; waste_label; waste_liner; waste_bag"
      rule: "For each packaging form: opening empty + opening attached WIP/FG + opening reusable + purchases + external return received = closing empty + closing attached WIP/FG + closing reusable + packaging with gross physical shipments + external return out + waste. Cancel internal reuse; preserve destination subledgers and actual handling burden. Never divide gross packaging departures by a supposed net-package count or put them inside board Q."
      inputs:
        - opening_pack_stocks
        - pack_purchases
        - external_returns_in
        - closing_pack_stocks
        - gross_pack_departures
        - external_returns_out
        - pack_waste
      output: "individual_pack_balance"
      source_ids:
        - finnfoam-xps-2021
        - jrc-ilcd-2010
    - id: species_closure
      applies_to: "all inventory rows"
      rule: "For each species separately reconcile opening retained stock + purchased constituent content + actual formation/transfer = closing retained stock + delivered content + waste/treatment/recovery + measured release + actual destruction. This physical route has no assumed chemical formation. Use independently measured retained CO2 and ethanol or independent species measurements; one total mass loss cannot solve both. Keep air/water ingress and displaced cell gas explicit if material. Neither COD nor carbon balance alone proves molecular species."
      inputs:
        - species_inputs
        - independent_retained_assays
        - species_measurements
        - actual_destinations
      output: "species_residuals"
      source_ids:
        - finnfoam-xps-2021
        - gabriel-xps-masterbatches
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Confirm actual material supply form, entire formulation and native identity restrictions. An auxiliary UUID/provider gap requires completion before quantitative use but does not by itself negate the authored core route. EPS granules, welding CO2 proxies and chemically decomposing concentrates cannot be accepted through a name/classification match."
      evidence: "direct native restrictions; supplier specifications; raw assay; source-specific trials"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Use actual site, technology, dates, complete periods and cohort histories; do not treat the historical 2019 EPD as current certification or its three-site supply mixes as the current factory. Preserve all failed acquisition/query/registration records outside canonical content and never interpret failure as no match."
      evidence: "meter periods; full stock histories; primary originals; original acquisition versus present extraction"
    - id: dq_closure
      applies_to: "all inventory rows"
      requirement: "Report independent physical mass, relevant elemental and species balances with measurement uncertainty and investigation of residuals. Do not fit several unknown losses to one residual or turn missing measurements into zero. Keep process/FG/combined gates and each packaging balance consistent."
      evidence: "calibrated raw measurements; independent assays; reconciliation and uncertainty"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Distinguish qualitative route evidence, historical supplied-form examples and actual foreground quantities. No published recipe percentage, density, energy saving, total recovery or emission fraction is a default. Different suppliers are not the same SKU or factory. Scientific review and translation review remain separate from projection and measurement checks."
      evidence: "complete original context; actual supplier and foreground evidence; applicability record"
validation_rules:
  - rule_id: v_evidence_scope
    applies_to: "all inventory rows"
    rule: "Validation evaluates complete evidence and declared relationships. Real unknowns remain incomplete and require review; a schema or finite check cannot turn them into established factory facts."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_scope
    applies_to: "all inventory rows"
    rule: "Verify the exact scoped polymer, supply forms, physical CO2/ethanol route, absent facings/reinforcement/chemical blowing/added flame retardant, and all required qualifiers. Do not assert full CPC 36390 coverage or accept the native erroneous 36330 code as positive mapping."
    source_ids:
      - un-cpc3-2025
      - finnfoam-xps-2021
      - gabriel-xps-masterbatches
  - rule_id: v_quantity
    applies_to: "all inventory rows"
    rule: "Confirm net accepted dispatch Q, exactly one linked reference output and one execution of normalize_once, raw-only collection, real original-unit conversions and complete attribution. Q<=0, untraceable original delivery reversals, missing historical vectors or unknown critical species relations prevent a defensible unit result; preserve actual data and report incompleteness."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_balances
    applies_to: "all inventory rows"
    rule: "Reconcile complete physical mass and relevant elements independently of species closure at manufacture, FG and combined gates; include retained gases, evaporation, returns, all stocks and every waste destination. Investigate nonclosure against uncertainty, not arbitrary fixed tolerance or fitted losses. External water returns require actual thermal state and supplier agreement."
    source_ids:
      - finnfoam-xps-2021
  - rule_id: v_packaging
    applies_to: "all inventory rows"
    rule: "For each actual packaging form check opening/closing empty, attached and reusable stock, purchases, external returns, gross physical departures and waste. Internal reuse cancels physically and retains actual service burden. Packaging is excluded from net board Q; never net its gross departures against board returns."
    source_ids:
      - finnfoam-xps-2021
      - jrc-ilcd-2010
  - rule_id: v_allocation
    applies_to: "all inventory rows"
    rule: "Inspect each residual shared exchange for dedicated assignment/subdivision, virtual subdivision, determining physical causality, and only then actual common-gate contemporaneous market value. Require documented residual pools and sensitivity; no fixed split, free choice or automatic recycling/carbon/energy credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_completeness
    applies_to: "all inventory rows"
    rule: "Check every typed flow card, description, qualifier, protocol cell, formula input/output, source field and source-id list against canonical Markdown, including full normative unit/heading/ancestor context and native restrictions. A schema/current-fingerprint or finite measurement pass does not establish source applicability, factory completeness, scientific approval or translation review. Report missing rows, evidence, unsupported relations and site data explicitly."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual scoped material supply only; preserve net delivery and retained cell gas"
  allowed_use: "Compatible physically extruded unfaced XPS board supply with actual grade and state disclosure"
  excluded_use: "Generic all-plastics coverage; structural/faced assemblies; alternative blowing chemistries; equal thermal service claims from mass alone"
  required_metadata: "actual polymer grade and GPPS identity; complete commercial formulation grades and constituent assays; CO2 origin and supply state; ethanol purity and water content; absence of chemical blowing agent and added flame retardant; closed-cell unfaced board construction; board dimensions and directly measured mass/density state; thermal and compression performance with test basis; actual site and electricity supply; manufacturing and FG accounting periods; dispatch gate and acceptance criteria; conditioning age and retained CO2/ethanol; WIP/FG cohorts and inherited exchange vectors; gross dispatch and original-delivery reversal links; individual packaging forms and reuse boundary"
  required_quality_disclosure: "Historical versus actual sources; full route and allocation decisions; missing auxiliary identities/providers; stock and species uncertainty; unresolved measurements and omitted scope"
  update_trigger: "Changed supply formulation or blowing chemistry; added FR/facing; changed dispatch gate; new recovery route; source revision or identity contradiction"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 Structure and Explanatory Notes, 30 June 2025, PDF p.177 and adjacent pp.176–178; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Title-only classification context and narrower cellular-board residual interpretation; not manufacturing evidence or accepted mapping."
  - id: "finnfoam-xps-2021"
    type: "literature"
    reference: "Finnfoam Oy / AB / UAB, Finnfoam XPS Insulation, RTS_113_21, published 2021-06-10, data year 2019, pp.2–6; expired 2026-06-04; https://finnfoam.lt/wp-content/uploads/2023/03/finnfoamxps_rts-epd_113-21.pdf"
    used_for: "Historical raw-material-to-board route and conditioning/packaging evidence; independent foreground protocols control amounts. Do not transfer its allocation, emission omissions, zero-scrap, density or downstream-credit assumptions."
  - id: "gabriel-xps-masterbatches"
    type: "handbook"
    reference: "Gabriel-Chemie, Additive and Colour Preparations for Extruded Polystyrene Foams, collected sheets dated 1994–2010, pp.2–8 and 15–20; https://gabriel-chemie.com/storage/xps-foam_en.pdf"
    used_for: "Whole supplied colour/inorganic nucleator/polymeric processing-aid formulations; physical versus chemical nucleation and historical halogenated/FR counterexamples. No same-SKU or CO2-recipe/dosage approval."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA — Detailed guidance, first edition March 2010, section 7.9, PDF pp.275–288 / printed pp.255–268; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and exchange-specific determining causality followed by residual common-gate market value. PCR stock/return and collection rules are explicit operational requirements, not measured factory facts from ILCD."
