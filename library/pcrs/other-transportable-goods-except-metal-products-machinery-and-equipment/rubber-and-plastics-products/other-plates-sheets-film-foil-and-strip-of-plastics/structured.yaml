system_boundary:
  rules:
    - rule_id: b_complete
      applies_to: "all inventory rows"
      rule: "Include all operations from actual purchased raw-material supply through net accepted factory dispatch, with upstream datasets for each external input and real transport/service boundary. Manufacturing is complete physical foam conversion; do not stop at film wrapping. Add each actual drying input, fuel, purchased heat, refrigerant, treatment chemical, capture medium, discharge species or additional packaging as a separate named card with its own supply state and collection protocol. Unknown occurrence is an open dataset requirement, not zero or an unnamed other stream."
      source_ids:
        - finnfoam-xps-2021
        - gabriel-xps-masterbatches
    - rule_id: b_terminal
      applies_to: "all inventory rows"
      rule: "Use Q only at actual net accepted factory dispatch. P is first quality-released board, not delivered output. Keep manufacturing, FG and combined physical gates separate: P transferred internally cancels in the combined gate. Closing FG may contain current P and its inherited burdens; do not add that stock again as production. No delivery, repeat acceptance or reinspection creates new P. Reject Q<=0 for unit results while retaining all actual loads and signed corrections."
      source_ids:
        - finnfoam-xps-2021
    - rule_id: b_stock
      applies_to: "all inventory rows"
      rule: "Tag every WIP, trim/regrind and FG cohort with physical mass, polymer/formulation composition, CO2/ethanol retained mass and a vector of raw exchange burdens. Record opening and closing stock at both gates, failed and zero-output lots, startup/shutdown, idle, cleanup, purges, destructive tests and rework. Carry actual historical vectors without replacing them with the current product average. Distinguish real new increments from internal transfers and sold/rejected material."
      source_ids:
        - finnfoam-xps-2021
        - jrc-ilcd-2010
    - rule_id: b_gas_water
      applies_to: "all inventory rows"
      rule: "Keep each real species and destination independent: CO2 and ethanol in board cells, vents, fugitives, recovered material, condensate and wastewater; residual styrene and PS particles where present. Physical foaming itself has no stoichiometric reaction water. Moisture, free liquid, vapour and any structurally bound water require their own evidence. Do not fit CO2 and ethanol to a single total-mass residual. Purchased CO2 and its eventual release are different exchanges and never an automatic credit."
      source_ids:
        - finnfoam-xps-2021
        - gabriel-xps-masterbatches
    - rule_id: b_returns
      applies_to: "all inventory rows"
      rule: "For each actual customer return link the original dispatch, original delivered mass R0 and original per-exchange burden vector. Reverse that original delivery exactly once; measure current returned physical mass independently, including age-related gas loss, damage and contamination. Returned historical burdens are transfers, not new purchases or new production; add only real inspection/rework/transport increments and record subsequent fate. Untraceable reversals make net-delivery data incomplete; do not invent historical burdens."
      source_ids:
        - jrc-ilcd-2010
    - rule_id: b_recursion
      applies_to: "all inventory rows"
      rule: "Do not purchase internal board scrap again. If an external same-category XPS input actually occurs, distinguish raw recycled material from already finished board and disclose its inherited upstream scope. Outside waste or chemically recycled polymer cannot silently inherit this virgin-GPPS physical route. Include actual collection and reprocessing; no automatic displaced-virgin credit."
      source_ids:
        - finnfoam-xps-2021
        - jrc-ilcd-2010
boundary_abstraction:
  declared_starting_condition: "Purchased GPPS granules and complete commercial formulations with CO2/ethanol at actual supply state"
  starting_condition_role: "foreground_entry"
  product_classification_scope: "CPC 3.0 36390; narrower"
  recursive_input_rule: "Paired internal regrind cancels; actual external XPS inputs require state and upstream-burden disclosure"
  upstream_dataset_requirement: "Each actual external supply needs a compatible independently bounded upstream dataset; flow identity is not a provider"
  disclosure: "Exact physical route; actual supply forms; net dispatch Q; complete WIP/FG/return vectors; utility and packaging boundaries; residual cell gases"
