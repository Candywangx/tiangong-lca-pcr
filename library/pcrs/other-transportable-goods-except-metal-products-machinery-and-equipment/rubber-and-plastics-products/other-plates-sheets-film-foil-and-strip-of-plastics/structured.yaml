measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use actual net accepted dispatched board mass, excluding all transport packaging, at recorded age, temperature and residual-gas state. Weigh calibrated gross and tare separately. Q = G - R0; G is accepted outward board mass and R0 is traceably reversed original delivered mass, not current return weight. Keep P, WIP and FG distinct under cp_stock and cp_stock_delivery."
  - id: normalize_control
    applies_to: "all inventory rows"
    required_property_ref:
      name: ""
      uuid: ""
    required_unit: ""
    rule: "Collect only raw readings and records. Convert original units/rates, reconcile stock vectors and assign shared exchanges before the single normalize_once operation. Inventory cards and protocol aggregation refer to the same operation; neither divides again. Q<=0 retains raw loads without a unit result. No unmeasured loss, future factory amount or missing UUID is an observed zero."
  - id: state_conversion
    applies_to: "all inventory rows"
    required_property_ref:
      name: ""
      uuid: ""
    required_unit: ""
    rule: "Use kg for physical mass. If a raw liquid or gas record is an integrated volume, multiply only by independently established density at that substance composition, pressure and temperature; do not multiply by time again. Integrate genuine rates over time before conversion; convert kWh and MJ on one stated meter boundary, never mixing electricity with thermal duty. Counted boards or pallets need directly measured configuration mass, never a guessed item mass or a density inferred from an unrelated flow coefficient."
