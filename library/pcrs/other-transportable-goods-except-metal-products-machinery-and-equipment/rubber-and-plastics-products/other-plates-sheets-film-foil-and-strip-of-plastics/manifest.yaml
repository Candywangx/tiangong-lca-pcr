  semantic_boundary_decision: Narrow existing unpublished empty scaffold to unfaced rigid closed-cell CO2/ethanol physically
    extruded GPPS flat boards without added flame retardant or chemical blowing concentrate. No compatible material record
    found in full 1237-record material inventory; frozen rubber reclaim, VMQ hose, EP belt, uncured NR/cotton fabric, gloves,
    NBR seals and CZ silicon intake routes are materially different. Classification title alone creates no canonical identity
    or accepted edge.
  terminal_gate: Actual net accepted factory dispatch Q = G - R0. P is first quality release only; original return vector
    and original delivered mass are reversed exactly once, independently of current returned physical mass. Full WIP/FG/regrind
    cohort vectors, gas-state changes and actual warehouse/packing/dispatch increments retained.
  reference_identity_limitations: Foamed Plastic is a broad cellular synthetic-resin Product flow, closed/open cell, rigid/flexible;
    native reference Mass, no CAS, route/grade, geographic supply state or extra property. Native 36330 non-cellular classification
    is isolated contradictory metadata, not adopted mapping evidence. Full restrictions appear in each typed board description.
  native_metadata_debt: Foamed Plastic non-cellular classification contradicts consistently cellular identity; PE-film luggage
    classification is inconsistent with explicit PE film/CAS identity, with PET only a comparison. Neither changes native
    data or establishes supplier/background compatibility.
  source_limitations: RTS_113_21 is historical 2019 manufacturing evidence, expired 2026-06-04; not current certification.
    Gabriel collected sheets are historical 1994–2010 and include chemical nucleation/halogenated/FR counterexamples; no recipe,
    dosage or current SKU compatibility transferred. Technical synthesis does not claim one order or factory. ILCD is attributional
    allocation guidance only.
  ordinary_data_gaps:
  - Actual site formulation grades and compatible upstream provider datasets; no recipe percentages or future factory quantities
    invented.
  - Actual per-species retained-gas/vent evidence, complete historical stock vectors and traceable returns must be collected
    for each quantitative dataset; unknowns prevent dataset unit results rather than masquerading as a factory pass.
