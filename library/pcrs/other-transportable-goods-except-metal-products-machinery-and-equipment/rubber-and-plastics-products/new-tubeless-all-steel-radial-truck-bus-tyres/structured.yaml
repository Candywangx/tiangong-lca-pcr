  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "new tyre with no previously used casing"
    - "truck or bus commercial tyre category excluding passenger/light-truck crossover claims"
    - "tubeless air-retaining innerliner"
    - "steel carcass ply and steel belt package with declared ply counts and cord construction"
    - "calendered cord coating and onsite compound mixing plus mould-press vulcanization"
    - "size and rim diameter"
    - "load index and speed symbol"
    - "axle/service designation and approved specification"
    - "net delivered count N and individual net masses excluding packaging"
    - "site and period plus upstream suppliers and actual energy supply"
    - "opening/closing WIP and finished-stock quantities with carried burdens"
    - "returns/rework identities and unique acceptance/delivery records"
reference_flows:
  []
measurement_rules:
  - id: count_reference
    applies_to: "tyre_delivered"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "N is the positive unique quality-accepted net-delivered tyre count for the same configuration, route and state cohort. P is new production release and is separately recorded; N and P are not presumed equal. Reaccepting a returned tyre never adds a new tyre."
  - id: net_mass_metadata
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh actual individual tyre net masses on calibrated equipment or use traceable lot weighing with count and tare. Exclude rim, separate tube/flap and packaging. No constant kg/item or catalogue nominal mass is imposed. Net mass supports material closure and a separately disclosed derived mass-based view; this PCR reports one item."
  - id: supplied_formulation
    applies_to: "recipe inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use whole supplied formulation mass. Active fractions, moisture and carrier water are analytical subledgers; raw ingredients actually acquired separately for onsite blending are separate inputs with actual mixing energy/losses. Do not buy both a formulation and its constituents in the same mass ledger."
  - id: utilities_state
    applies_to: "utility and emission rows"
    required_property_ref:
      name: "declared row property"
      uuid: ""
    required_unit: "declared row unit"
    rule: "Retain original meter units and actual state. Convert only with documented unit relations, composition and state/enthalpy as needed. A raw integrated gas/liquid volume is not a rate and gets no extra time factor. Supplier flow-property coefficients are not density evidence."
