allocation_rules:
  - rule_id: allocation_trace_cohorts
    applies_to: "tbr_manufacture"
    rule: "Prefer batch/recipe/equipment records to attribute each raw numerator to its actual configuration and delivered cohort. Where utilities are shared, use metered operation time and load/enthalpy/throughput drivers appropriate to that utility, documenting the shares and reconciliation to the parent total. Do not normalize to nameplate capacity or select only successful runs."
    source_ids:
      - jrc-ilcd-allocation-2010
  - rule_id: allocation_no_fictitious_credit
    applies_to: "waste and internal returns"
    rule: "Internal trim/green-tyre rework and warehouse transfers are not co-products. Count their incremental processing and cancel internal transfers with original burdens retained. No avoided virgin rubber, new tyre or retreading credit is assumed for scraps. For actual sold secondary material, disclose composition, destination and the chosen end-of-waste/allocation convention; apply it consistently and do not silently deduct its embedded production burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_recipe
      process_id: "tbr_manufacture"
      flow_role: "Recipe mass"
      record_type: "weighing and stock ledger"
      raw_fields: "batch; compound role; recipe revision; ingredient and supplier grade/route/form; actual gross/net issued mass; assay; moisture; raw-store opening/closing; rejected and zero-output batches; compound/WIP transfers; carried burdens"
      collection_method: "Mixing owner retains unnormalized raw weighing and stock-adjusted consumption for every batch, including failed attempts and rework. Separate whole purchased formulations from constituent/carrier subledgers. Track each internal return with its original burden; do not reacquire the same rubber. No division occurs during collection."
      unit: "kg by ingredient and batch"
      frequency: "Each batch/meter interval and stock close"
      temporal_coverage: "Same complete declared raw period and traced delivered cohort, including opening carryover"
      site_scope: "Named plant and actual supply/control/warehouse boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "recipe BOM; calibrated scales; issue and stock reconciliation"
    - protocol_id: cp_components
      process_id: "tbr_manufacture"
      flow_role: "Steel structure and component route"
      record_type: "component batch and wire ledger"
      raw_fields: "cord/wire supplier; coating; cord construction; carcass/belt/chafer allocation; ply count; calender line and gauges; cut angles/splices; supplied metal mass; skim compound batches; offcuts; green-tyre serial links; WIP and carried burdens"
      collection_method: "Component owner records actual calendering and cutting of steel carcass and belts, extrusion/innerliner calendering, bead winding and building links. Retain unnormalized supplied mass, internal compound transfers and losses. Precoated metallic mass includes coating; onsite skim rubber is not purchased a second time."
      unit: "kg; item; construction dimensions"
      frequency: "Each batch/meter interval and stock close"
      temporal_coverage: "Same complete declared raw period and traced delivered cohort, including opening carryover"
      site_scope: "Named plant and actual supply/control/warehouse boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "construction specification; calender/cutter and bead/build records"
    - protocol_id: cp_aux
      process_id: "tbr_manufacture"
      flow_role: "Curing and auxiliary materials"
      record_type: "cure-cycle and consumable log"
      raw_fields: "green-tyre ID; mould/bladder ID; actual cycle temperature/pressure/time; failed cycles; cool-down; formulation issue mass and assay; bladder replacement and stock; rework"
      collection_method: "Curing owner retains raw cycle, consumable and replacement records including failures, setup and rework. No setpoint or ingredient amount is copied from the cited overview/test report. Retain unnormalized consumable use and complete inventory/carryover records."
      unit: "kg; measured cycle conditions"
      frequency: "Each batch/meter interval and stock close"
      temporal_coverage: "Same complete declared raw period and traced delivered cohort, including opening carryover"
      site_scope: "Named plant and actual supply/control/warehouse boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "cycle logs; supplier formulation and replacement records"
    - protocol_id: cp_util
      process_id: "tbr_manufacture"
      flow_role: "All manufacturing utility burdens"
      record_type: "meter and supply record"
      raw_fields: "carrier; meter/submeter scope; opening/closing readings; timestamps; integrated volume or rate and duration flag; gas state; steam and condensate mass/enthalpy; onsite generation; idle/rework use; product shares; carried utility burdens"
      collection_method: "Utility owner retains unnormalized meter differences and purchased/on-site supply boundaries across all manufacturing stages and stores. Resolve parent/submeter overlaps; allocate complete raw-period loads, including failed and zero-output work, before reporting. Keep one numerator per actual carrier."
      unit: "kWh; kg; m3 with state; MJ only as enthalpy subledger"
      frequency: "Each batch/meter interval and stock close"
      temporal_coverage: "Same complete declared raw period and traced delivered cohort, including opening carryover"
      site_scope: "Named plant and actual supply/control/warehouse boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated meters; fuel and steam supply; total/share reconciliation"
    - protocol_id: cp_dispatch
      process_id: "tbr_manufacture"
      flow_role: "Warehouse packaging handling and dispatch"
      record_type: "warehouse and dispatch ledger"
      raw_fields: "tyre serial/batch; warehouse dates; label/wrap gross issue and rejects; actual handling fuel; stock opening/closing; dispatch gate and load record; transport service boundary; return IDs; carried stock burdens"
      collection_method: "Warehouse owner retains raw storage, packaging, handling and loading use and all genuine return/rework burdens. Stock transfers retain manufacture burdens; they are not another production output. Packaging supplier mass is excluded from tyre net mass but remains inventory input."
      unit: "kg; item; dates and actual transport bases"
      frequency: "Each batch/meter interval and stock close"
      temporal_coverage: "Same complete declared raw period and traced delivered cohort, including opening carryover"
      site_scope: "Named plant and actual supply/control/warehouse boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "stock movements; packaging issues; handling fuel; signed dispatch records"
    - protocol_id: cp_output
      process_id: "tbr_manufacture"
      flow_role: "Unique accepted net delivery"
      record_type: "quality and serial-level shipment ledger"
      raw_fields: "serial/batch; configuration; new-release P; quality decision; gross shipments; same-cohort returns; unique net-delivery N; individual net masses; tare; opening/closing WIP and finished stock; carried input/burden vectors"
      collection_method: "Quality and warehouse owners jointly preserve raw count, acceptance and calibrated net-weighing records for the same configuration. Deduplicate returns and reacceptance; distinguish production release from actual delivery. Preserve full WIP and finished-stock quantities and carried burdens. Collection does not divide any numerator."
      unit: "item; kg excluding packaging"
      frequency: "Each batch/meter interval and stock close"
      temporal_coverage: "Same complete declared raw period and traced delivered cohort, including opening carryover"
      site_scope: "Named plant and actual supply/control/warehouse boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "accepted specification; serial identity; scale calibration; stock/dispatch reconciliation"
    - protocol_id: cp_waste
      process_id: "tbr_manufacture"
      flow_role: "External wastes and internal recovery"
      record_type: "waste weighbridge and transfer ledger"
      raw_fields: "individual waste identity; wet/dry mass; rubber/steel/coating/water fractions; origin operation; internal return or external exit; treatment route; opening/closing stocks and carried burdens"
      collection_method: "Waste owner retains unnormalized external masses and internal return identities. Captured dust is not a stack emission. Include cured rejects, destructive tests, contaminated auxiliaries and actual treatment; add each actual sludge or further waste separately."
      unit: "kg with phase and composition"
      frequency: "Each batch/meter interval and stock close"
      temporal_coverage: "Same complete declared raw period and traced delivered cohort, including opening carryover"
      site_scope: "Named plant and actual supply/control/warehouse boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh tickets; analytical methods; waste manifests and treatment records"
    - protocol_id: cp_emissions
      process_id: "tbr_manufacture"
      flow_role: "Species and physical balances"
      record_type: "stack/fugitive/water analytical record"
      raw_fields: "emission point and species; concentration; flow rate or integrated volume; gas state; time; detection limit; capture/destruction fraction; raw fuel elements; phase water; solid/liquid outlets; stocks and carried burdens"
      collection_method: "Environmental owner retains raw period species-specific measurements or a justified applicable factor with actual raw activity. Distinguish measured integrated volume from rate times duration; preserve detection limits, captured and emitted fractions. Balance physical mass/elements separately from identified chemical species and water formation/consumption."
      unit: "kg; m3 and stated conditions; time; concentration"
      frequency: "Each batch/meter interval and stock close"
      temporal_coverage: "Same complete declared raw period and traced delivered cohort, including opening carryover"
      site_scope: "Named plant and actual supply/control/warehouse boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "sampling records; lab reports; source applicability and closure diagnostics"
  calculation_rules:
    - id: stock_numerator
      applies_to: "all nonreference inventory rows"
      rule: "For each independent physical exchange or burden i, A_i = C_i_open_WIP + C_i_open_FG + C_i_returns_restored + F_i_period - C_i_close_WIP - C_i_close_FG - C_i_other_cohorts. F_i_period contains the actual raw-period consumption/burdens of the route after raw-material stock reconciliation, including failed/zero-output work, rework, genuine returns, treatment, warehouse and dispatch within scope. C vectors are traced accumulated amounts/burdens carried with stock or other product cohorts, not a second procurement. C_i_returns_restored restores the original tracked burden of actual returned articles; record the corresponding reversal/correction to their original delivery cohort so it is not manufactured or reported twice. F_i_period includes only their additional actual return/rework burdens. Assign failure/rework burdens consistently across the actual cohorts before these transfers. Cancel internal compound, green-tyre and production-to-store handovers. Preserve signed reconciliation and explain any residual rather than inventing a balancing output."
      inputs:
        - F_i_period
        - C_i_open_WIP
        - C_i_open_FG
        - C_i_returns_restored
        - C_i_close_WIP
        - C_i_close_FG
        - C_i_other_cohorts
        - cp_recipe
        - cp_components
        - cp_aux
        - cp_util
        - cp_dispatch
        - cp_waste
        - cp_emissions
      output: "A_i"
      source_ids: []
    - id: net_delivery
      applies_to: "tyre_delivered"
      rule: "N is the number of distinct new quality-accepted tyre serials whose net delivery remains effective at the declared return cut-off; exclude outstanding returned/undelivered tyres. A return followed by redispatch is one serial with its final delivery state, not two shipments minus an unqualified return-event count. Previously shipped/returned/reaccepted tyres retain identity and are not counted as new production. Reconcile FG_close = FG_open + P_new_release + R_returned - S_shipped - D_scrapped, plus documented other transfers. Undelivered and returned stock retain original manufacture burdens until their actual disposition. If a cohort has N=0, retain its burdens for carryover/allocation and do not report a divided unit dataset."
      inputs:
        - cp_output
        - cp_dispatch
        - cp_waste
      output: "N"
      source_ids: []
    - id: report_once
      applies_to: "all nonreference inventory rows"
      rule: "a_i = A_i / N, only after actual raw-unit/state conversions and stock/cohort attribution, with N>0. This is the sole normalization; report one item terminal output. Stage, card and aggregation text refer to this one operation. Do not divide each failed batch by its own output, and do not divide a normalized intermediate again."
      inputs:
        - A_i
        - N
      output: "a_i"
      source_ids: []
    - id: physical_and_species
      applies_to: "tbr_manufacture"
      rule: "For a consistent control volume, reconcile mass_in_external + opening_physical_stock + actual_returned_mass = gross_shipped_mass + other_actual_exits + closing_physical_stock. Use gross physical crossing records here, including true incoming combustion oxygen if fuel is burned; do not put net deliveries on the right while also adding those returns on the left. Keep packaging separate from tyre net mass and reconcile each material stream. Use actual measured or composition-based C/S/Zn/steel/coating balances independently of normalized LCI burden vectors. Document actual sulfur crosslinking, volatilization, water evaporation and any independently established reaction/combustion water. No stoichiometric emission or reaction-water amount is imposed by this PCR."
      inputs:
        - cp_recipe
        - cp_components
        - cp_output
        - cp_waste
        - cp_emissions
      output: "documented physical closure and actual species"
      source_ids:
        - epa-rubber-background-2008
  data_quality_requirements:
    - id: quality_route
      applies_to: "reference product"
      requirement: "Match all required qualifiers, actual steel carcass/belt structure and full manufacturing route; document size/recipe/cycle changes as separate configurations or justified aggregation."
      evidence: "construction drawings; actual batch, cure and acceptance records"
    - id: quality_complete_period
      applies_to: "all inventory rows"
      requirement: "Keep complete period logs and carried opening/closing WIP/FG burdens. No removal of unsuccessful batches, repeated counting of returns, exclusion of real packaging/storage, or replacement of measured numerator with a literature recipe."
      evidence: "inventory and burden reconciliation; raw numerator lineage"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Broad native Tire; Production mix, at plant has no declared geography/CAS, route or mass coefficient and includes metal/rubber in its comment. Qualify this rubber TBR count identity explicitly. All blank auxiliary UUIDs require independent full native-field compatibility checks when matched; do not infer supplier mix or site from an official family name."
      evidence: "full native record and exact support chain; supplier material specifications"
    - id: quality_limits
      applies_to: "data package"
      requirement: "Report measurement uncertainty, omissions with reasons, detection limits, temporal and geographic applicability, formulation confidentiality and provider matches. The method has no default numerical recipe, emission factor, cure setting or tyre service-life equivalence."
      evidence: "raw evidence and applicability statement"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Check a new, never-used casing, tubeless steel-carcass/steel-belt construction, full integrated manufacture and declared specification. Reject retreading, bought-tyre relabelling, passenger-car or textile-carcass substitutions and unsupported generic coverage of all 36113."
    source_ids:
      - continental-commercial-2025
      - apollo-tbr-us-2023
  - rule_id: validate_terminal_count
    applies_to: "tyre_delivered"
    rule: "Require N > 0 from traceable unique quality-accepted net deliveries of the same product/route/state cohort. Returns and reacceptance do not create new production or another accepted tyre. Reconcile release, physical shipment, return, scrap, opening/closing WIP and finished-stock records and their carried burdens; a zero-output batch remains in burden records and cannot be independently divided by zero."
    source_ids: []
  - rule_id: validate_atomic_units
    applies_to: "all inventory rows"
    rule: "Check one identity per exchange, supplied formulation versus assay subledgers, property/unit and actual gas/liquid state before a single reporting normalization. Metered integrated volume gets no extra duration. Exact native count unit Item(s) and PCR label item are identical with factor 1; no density or item-mass factor is present in the Tire row."
    source_ids: []
  - rule_id: validate_balance_species
    applies_to: "tbr_manufacture"
    rule: "Close complete physical mass and relevant C/S/Zn/metal element ledgers over the same cohort, including compounds, coating, scrap, dust, water, vents, stores and returns. Independently establish actual outlet species, combustion/reaction water and water phases from measurement/chemistry. Never infer both unknown water and an unknown outlet from one residual, equate COD with physical species, or force every sulfur atom into a presumed emission."
    source_ids:
      - epa-rubber-background-2008
  - rule_id: validate_evidence_limits
    applies_to: "data package"
    rule: "Retain raw records, route/site applicability, supplier identity and uncertainty. The cited industrial sources are independent technical support, not a claim that one SKU/plant supplied every operation or recipe. EPA passenger-size/laboratory tests establish no TBR factor or setpoint. Blank auxiliary UUID/provider matches require later compatibility checks without inventing quantities."
    source_ids:
      - epa-rubber-background-2008
      - continental-commercial-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A new tyre supply input into a specified commercial vehicle or replacement supply model, with exact construction/size and one-item basis."
  allowed_use: "Article supply for compatible new tubeless all-steel radial truck/bus tyres after dataset-specific quality/applicability review."
  excluded_use: "Generic all-other-tyre coverage, retreading, textile carcass/solid tyre supply, inner-tube supply, use-phase fuel savings, per-kilometre comparisons and an assumed tyre life."
  required_metadata: "All reference qualifiers; process/gate boundaries; raw-period and cohort/stock accounting; net tyre masses; supplier/energy mix; individual material and species identity; allocation; source applicability."
  required_quality_disclosure: "Raw measurement coverage and uncertainty, detection limits, auxiliary UUID/provider gaps and native count-only broad identity limits."
  update_trigger: "Change in carcass/belt architecture, cord coating route, calender/extrusion route, compound recipe, tyre size/specification, energy supply, acceptance/dispatch gate or stock/carryover accounting."
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Structure, 30 June 2025. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv ; retrieved 2026-10-16"
    used_for: "Sibling classification boundaries only; 36113 is broader than this structural subset."
  - id: "continental-commercial-2025"
    type: "handbook"
    reference: "Continental, White Paper: Tires for Commercial Vehicles, PDF modified 2025-12-22, pp. 7, 9. https://cdn.continental.com/fileadmin/__imported/sites/corporate/_international/english/hubpages/10_20press/01_press_releases/06_20cvt/001_white_papers_cvt/white_paper_tires_for_commercial_vehicles.pdf ; retrieved 2026-10-16"
    used_for: "Commercial steel radial carcass and complete material/compound/component/build/cure/inspection route. Manufacturer overview, not a factory recipe, operating setpoint, life claim or emission factor."
  - id: "goodyear-truck-2021"
    type: "handbook"
    reference: "Goodyear, Truck Tyres Technical Data Book, 2021 file edition, pp. 78–79. https://www.goodyear.eu/content/dam/goodyear/truck/pdfs/bg_databook_2021.pdf ; retrieved 2026-10-16"
    used_for: "Steel carcass/belt radial construction and tubeless innerliner distinction; historical technical evidence. Tube and flap inset applies only to tube-type tyres; no default layer count or recipe adopted."
  - id: "apollo-tbr-us-2023"
    type: "handbook"
    reference: "Apollo, Truck and Bus Radial Tires Technical Databook 2023 US, pp. 25–27. https://www.apollotyres.com/content/dam/orbit/usa/us-truck-tires/cv-usa/DIGITAL%20TBR%20TECHN.%20DATABOOK%202023%20US.pdf ; retrieved 2026-10-16"
    used_for: "Commercial all-steel radial/tubeless article and component/marking identity. US-market manufacturer illustration, not universal geometry, acceptance thresholds, site geography or a quantitative inventory."
  - id: "epa-rubber-background-2008"
    type: "official_guidance"
    reference: "US EPA, Emission Factor Documentation for AP-42 Section 4.12 Manufacture of Rubber Products, Draft Final November 2008, §§3.2.1, 3.3.2 (pp. 3-4–3-5). https://www.epa.gov/sites/default/files/2020-10/documents/db04s12.pdf ; retrieved 2026-10-16"
    used_for: "Calendering, curing/cool-down and emission-collection context only. Historical tests include passenger-size tyres and non-tyre/laboratory compounds; no TBR emission factor, cure duration, temperature or pressure is transferred."
  - id: "jrc-ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance, First edition March2010, section7.9.3, printed pp.257–258 (PDF277–278); https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "LCA method support only within attributional cases where allocation rather than substitution is selected: virtual subdivision and flow-specific determining physical causality support direct batch/recipe/equipment attribution and utility-specific time/load/enthalpy/throughput drivers. Manufacturing sources supply construction/process evidence, not this LCA hierarchy. No default physical/economic share, stock-layer formula, recipe, yield/energy/emission factor, automatic coproduct status, avoided-burden credit or PEF/CFF conformity is established; actual full-site totals, failures, service drivers and stock/cohort lineage remain required."
