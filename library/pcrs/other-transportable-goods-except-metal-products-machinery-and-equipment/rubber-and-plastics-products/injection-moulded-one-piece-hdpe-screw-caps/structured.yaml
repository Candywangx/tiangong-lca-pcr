system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "all inventory rows"
      rule: "Include complete resin-to-cap conversion and actual inbound supply transport. Supplier resin formulation is one purchased whole mass, not separately purchased polymer plus its already included stabiliser/comonomer. Assays are constituent subledgers. An actual separately dosed formulation needs its own whole supplied-grade row; genuine in-house compounding needs each externally purchased constituent plus real processing energy/losses and renewed scope review. No assumed mixing recipe or polymerisation burden inside the converter."
      source_ids:
        - borealis-mb5568-2017
        - ifc-plastics-2007
    - rule_id: b_q_gate
      applies_to: "all inventory rows"
      rule: "The manufacturing product is Q at first quality release. A current-cohort closing FG cap is already in Q and is not another production output. released_cap and fg_in are an internal pair: cancel them when combining manufacturing and the separately reported FG service ledger. Gross outward caps and stock changes are physical movements, not additional manufacture. Delivery, reinspection and returns never generate another Q. Keep historical FG/returns under their original release cohorts; allocate their actual service/rework separately from current production."
      source_ids:
        - bericap-hdpe-cap
        - jrc-ilcd-2010
    - rule_id: b_wip
      applies_to: "all inventory rows"
      rule: "Track opening/closing raw stock and WIP including hopper/barrel melt, moulded uninspected caps, band-finishing queues and clean regrind. Each cohort carries a separate inherited vector for every material, utility, packaging, waste and emission exchange. Preserve both physical stocks and burden vectors across periods; no reset at first acceptance or rework. Failed/zero-output campaigns retain all incurred burdens and an explicit future assignment or separate unresolved account, never deletion. Separately held raw, installed-item and equipment-fluid/water/refrigerant reservoirs carry their own opening/closing physical quantities and each inherited exchange vector outside WIP. Reconcile these distinct stores once; an installed stock is not automatically current consumption and no quantity belongs simultaneously to WIP and another store."
      source_ids:
        - borealis-mb5568-2017
        - jrc-ilcd-2010
    - rule_id: b_utilities
      applies_to: "all inventory rows"
      rule: "Include actual feed conveying, barrel/hot-runner heating, clamp/injection drive, mould cooling, ventilation, compressed-air production, band finishing, QC and recovery energy. Meter common systems and avoid double-counting purchased compressed air/heat with supplier generation energy. The nominal non-reactive electric route requires no invented steam or boiler. If external heat-exchange water actually enters and is returned, keep supply and Product return separately with composition, temperatures, pressure/enthalpy and supplier water/energy agreement. Internal recirculation cancels; evaporation/blowdown remain real outputs."
      source_ids:
        - husky-hycap4-2016
        - ifc-plastics-2007
    - rule_id: b_atomic
      applies_to: "all inventory rows"
      rule: "Each listed card is one exchange. Apply conditional cards only when its named substance/form actually occurs; distinguish measured absence from unknown. Add each actual different raw material, treatment chemical, fuel, purchased heat, refrigerant, package, waste destination and identified emitted species as another atomic row before modelling. Do not hide an actual input/output under zero or an unnamed other stream. The n-butane card is conditional on species identification; IFC high-temperature screening does not prove a factory emission. COD/TOC/VOC indicators cannot be converted to arbitrary chemical masses."
      source_ids:
        - ifc-plastics-2007
    - rule_id: b_physical
      applies_to: "all inventory rows"
      rule: "Check total physical mass and independently check C/H/O and any formulation-relevant element using supplier composition/assays or independent analyses. Separate unreacted/free water, evaporation and any independently evidenced reaction water; the nominal route is non-reactive melt shaping and has no assumed reaction water. Any actual bound/structural water remains assigned to its measured host phase until independently evidenced release; do not invent hydration water in HDPE. Do not fit two unknown species with one residual or equate missing polymer to gas. For any actual oxidation/capture/treatment include its genuine reactants, distinct species, air/water transfers and residues with measured states. Service and transport coefficients are not material mass inputs."
      source_ids:
        - ifc-plastics-2007
    - rule_id: b_packaging
      applies_to: "all inventory rows"
      rule: "Keep post-release packing/handling/FG storage and dispatch in cp_fg and cp_pack by actual release cohort. For every packaging form reconcile opening empty/attached-to-WIP/attached-to-FG/reusable stocks plus purchases plus external returns received against closing stocks plus gross outward carriage plus returns to external owners plus waste. Internal reuse cancels; include its actual washing/repair/handling burdens without new purchase, new cap Q or automatic coproduct. Separate resin-supply sacks from cap shipping packs."
      source_ids:
        - sacmi-ccm-2018
        - jrc-ilcd-2010
    - rule_id: b_classification
      applies_to: "all inventory rows"
      rule: "CPC3.0 36490 provides a broader classification locator only. This one-piece HDPE injection-cap method is narrower; container manufacture, other closure constructions and other forming routes are not covered merely by this code. Classification does not create PCR identity or an accepted mapping."
      source_ids:
        - un-cpc-2025
