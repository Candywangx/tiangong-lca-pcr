functional_unit:
  what: "Provide a declared screw-closure intermediate for the specified bottle neck and fill conditions"
  how_much: "1 kg newly first-quality-released cap net mass excluding packaging"
  how_well: "Conform to the actual dimensional/seal/torque/tamper-band and hygienic release plan; kg alone is not equal closure function"
