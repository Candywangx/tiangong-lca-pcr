allocation_rules:
  - rule_id: a_scope
    applies_to: "all inventory rows"
    rule: "Use this hierarchy only after the study justifies an attributional scenario requiring allocation rather than substitution. Industrial brochures do not establish an LCA allocation choice. Identify distinct products/services and true joint process boundaries; product-specific recipe/operation data are not shared merely because one press or warehouse is used."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_subdivide
    applies_to: "all inventory rows"
    rule: "First collect separate dedicated operations and use actual or virtual subdivision to assign independently attributable resin, machine intervals, band finishing, testing, rejects and rework to their own cap configuration/cohort. Assess infeasibility and distortion explicitly before retaining a shared pool. Separate pre-release recovery from post-release return inspection and historical FG services."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_causality
    applies_to: "all inventory rows"
    rule: "For each residual exchange identify and substantiate the determining physical causal relationship. Metered variable drive/heating demand, cooling duty, actual use-time and capacity-limiting storage/transport occupancy can differ by exchange. Demonstrate which factor determines that exchange and relevant intensity variation. A convenient mass, cycle or cavity ratio is not sufficient; do not impose one physical criterion on all exchanges."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_market
    applies_to: "all inventory rows"
    rule: "Only for truly residual exchanges without a supported determining physical relationship use representative contemporaneous market values at the same actual joint-process exit gate and physical state/quality/quantity. Remove later packing/transport/processing value when deriving gate prices; document zero/negative values and unresolved price evidence rather than force a positive ratio. Keep exclusive later burdens exclusive. Preserve sensitivity and ensure all assigned exchange vectors sum to the original pool. No fixed fractions or automatic recovery credit."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: a_recovery
    applies_to: "all inventory rows"
    rule: "Internal clean regrind is an internal loop, not another purchase or valuable coproduct by declaration. Assign real recovery energy/losses and inherited burdens without multiplying virgin input. Outgoing scrap requires documented waste/product status, treatment and downstream boundary; do not infer a recycling rate, zero burden, avoided virgin credit or annex14 recycling allocation from this bounded production hierarchy. Separate evidence and review are necessary before applying any such model."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "Unique first-release mass"
      record_type: "acceptance_and_weighing"
      raw_fields: "cohort_id; lot_id; unit_history; mould_neck_resin_band_configuration; release_date; gross_mass; packaging_tare; new_accepted_net_mass; accepted_new_count; sampled_cap_net_mass; sampled_count; calibration; test_plan; destructive_samples; rejects"
      collection_method: "Calibrated net weighing with representative same-configuration counts/mass samples where used. Deduplicate first acceptance; exclude destructive samples, already released stock and reinspection. Check drawing dimensions/neck fit, leak and torque under stated fill/use conditions, tamper bridges/band and hygienic/food-contact suitability against the actual approved control plan; disclose tests and uncertainty without invented thresholds."
      unit: "kg"
      frequency: "Each lot and release event"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "Raw unique accepted net mass Q; released_cap represents 1 kg reference flow without another calculation"
      quality_evidence: "Calibration certificates; signed release sheets; configuration-specific weighing and test records"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "Each whole purchased formulation or article"
      record_type: "stock_and_withdrawal"
      raw_fields: "row_id; supplier; grade; CAS; comonomer; formulation_assay; supply_form; route; batch; original_unit; gross_tare; opening_stock; receipts; withdrawals; external_returns; closing_stock; composition_density_state separately_held_stock_id; opening_closing_quantity; each_inherited_non_WIP_exchange_vector; new_receipt_vector; transfer_and_consumption_history; stock_WIP_disjoint_scope"
      collection_method: "Weigh whole supplies and withdrawals or use traceable calibrated original-unit records; preserve formulation constituent subledgers. Hydraulic oil volume remains actual m3 until independent density/weighing is available for mass balance. Reconcile raw/installed/fluid stocks before attribution; no invented factory amounts. For separately held raw/installed/fluid stocks retain each opening and closing inherited exchange vector, current receipt and actual withdrawal/consumption evidence with its cohort and original units; include historical charge consumed without current makeup. Distinguish unused retained charge from actual use/leakage. A receipt and its later internal withdrawal are not two external purchases. Reconcile with cp_wip and wip_vector without duplicated stock terms."
      unit: "kg; m3"
      frequency: "Each receipt/withdrawal and stock boundary"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoice/SDS/PDS; scale and stock reconciliation; independent actual-fluid density if used"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "Electricity and actual purchased compressed air"
      record_type: "meter_and_supply"
      raw_fields: "row_id; cohort; meter_id; voltage; supply_mix; start_end_readings; raw_unit; true_power_rate; time_intervals; integrated_volume; gas_composition; pressure; temperature; mode; shared_load; supplier_boundary"
      collection_method: "Calibrated submeter/counter plus operating logs; retain startup, stopped/idle, rejects, cleanup and recovery. Distinguish an integrated reading from a rate before conversion. Determine shared-system causality per exchange before one normalisation; do not infer kWh from nameplate or brochure throughput."
      unit: "raw kWh; kW; kg; m3"
      frequency: "Continuous readings and each mode transition"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; time series; load tests; common-system reconciliation"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "Each water supply/return and stored water"
      record_type: "water_and_heat_balance"
      raw_fields: "row_id; source_quality; liquid_mass; integrated_volume; true_flow_rate; density_measurement; composition; pressure; temperature; enthalpy; opening_closing_loop_stock; return_receiver; supplier_water_energy_agreement; evaporation; blowdown; drift; leakage separately_held_stock_id; opening_closing_quantity; each_inherited_non_WIP_exchange_vector; new_receipt_vector; transfer_and_consumption_history; stock_WIP_disjoint_scope"
      collection_method: "Meter/weight each external supply and actual return independently; loop circulation is internal. Independently measure net evaporation, blowdown, drift/leak or constrain known terms before solving at most one remainder. Record thermal state and agree whether the provider includes cooling energy/water. Any actual different water chemistry has its own row. For separately held raw/installed/fluid stocks retain each opening and closing inherited exchange vector, current receipt and actual withdrawal/consumption evidence with its cohort and original units; include historical charge consumed without current makeup. Distinguish unused retained charge from actual use/leakage. A receipt and its later internal withdrawal are not two external purchases. Reconcile with cp_wip and wip_vector without duplicated stock terms."
      unit: "kg; m3; rate with actual time unit; temperature; pressure; enthalpy"
      frequency: "Continuous/each event and loop-stock boundary"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/scale and density-state records; thermal readings; supplier agreement; water closure"
    - protocol_id: cp_wip
      process_id: "manufacture"
      flow_role: "WIP and internal regrind exchange vectors"
      record_type: "cohort_stock_vector"
      raw_fields: "cohort; raw_stock; hopper_melt; moulded_uninspected_caps; finishing_queue; clean_regrind; opening_closing_mass; paired_transfers; failed_batches; each_inherited_exchange_vector; current_raw_loads; scrap_and_treatment; rework"
      collection_method: "Physical stocktake and traceable batch/transfer records at both period boundaries; retain each exchange vector at real inherited burden, including prior failure/cleanup. Link actual new-unit production versus existing-unit reinspection; do not reset burden on recycling or carryover."
      unit: "kg and separate original units of every exchange vector"
      frequency: "Each transfer/rework and period boundary"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Signed stocktake; lot genealogy; inherited vector reconciliations; hygienic recovery validation"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "Each named manufacturing waste"
      record_type: "waste_manifest"
      raw_fields: "row_id; physical_stream; dry_wet_form; gross_tare; actual_net_mass; water_and_contaminant_assay; destination; treatment; receipt_date; retained_stock; internal_recovery; receiver_boundary"
      collection_method: "Weigh each distinct stream and retain receiver/treatment evidence; split actual different destinations. Reconcile captured powder with collection/waste stocks and escaped particles; do not equate solids loss to unmeasured VOC. No theoretical zero-waste yield."
      unit: "kg"
      frequency: "Every waste movement and stock boundary"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated waste weights; assays; receiver manifests and treatment boundary"
    - protocol_id: cp_species
      process_id: "manufacture"
      flow_role: "Each confirmed molecule/particle/phase"
      record_type: "species_and_media_measurement"
      raw_fields: "row_id; species_CAS_polymer; carrier_species_gross_in_out; supplier_air_boundary; actual_carbon_origin; phase_size; receiving_medium; concentration; blank; detection_limit; measured_integrated_volume; true_flow_rate; actual_duration_if_rate; gas_pressure_temperature_moisture; capture_in_out; refrigerant_open_close_charge_recovery; uncertainty; elemental_assays"
      collection_method: "Use species-resolved actual measurement/independently supported material balance with correct wet/dry reference conditions; subtract measured carrier/background transfers only with measured paired species boundaries, retaining both gross physical inlet/outlet subledgers; coordinate the purchased-air upstream boundary. Rate-times-duration and already integrated volume are mutually distinct bases. One mass residual cannot determine several species. Preserve non-detect versus unknown and distinct liquid/vapour/reacted water."
      unit: "kg; measured concentration and volume/rate states"
      frequency: "Representative complete campaigns and each charge/recovery event"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Analytical reports; calibrated sampling/flow records; species/CAS/media evidence; independent mass and elemental checks"
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "Inbound freight"
      record_type: "transport_activity"
      raw_fields: "shipment; cargo_mass; packaging_mass; origin_destination; route_distance; vehicle; load_capacity; return_leg; supplier_inclusions; period; cohort"
      collection_method: "Use actual logistics/load records; choose mass/volume-capacity causality for shared transport where necessary. Link inbound cargo to procurement and avoid an upstream included transport duplication."
      unit: "kg; km; t.km"
      frequency: "Each shipment"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Freight documents; distances; supplier boundary and load evidence"
    - protocol_id: cp_fg
      process_id: "fg_service"
      flow_role: "FG movement and actual cohort services"
      record_type: "stock_service_history"
      raw_fields: "cohort; original_release_Q; historical_release_and_delivery_links; opening_closing_FG_mass; Q_internal_receipt; gross_outward_mass; physical_returned_mass; original_delivery_reversal; rejected_FG_mass; each_inherited_exchange_vector; actual_service_raw_loads; storage_time_space; handling_cycles"
      collection_method: "Stocktake/dispatch/return genealogy with service submeter and cause-specific handling/storage records. Keep old cohort burden vectors and its original Q; do not assign opening FG services to unrelated current Q. Repeat acceptance is a service. Define observed closing date; future unobserved services stay disclosed rather than invented."
      unit: "kg; raw MJ; original exchange-vector units"
      frequency: "Each move/service and stock boundary"
      temporal_coverage: "Release cohort through observed service closing date; historical cohorts separately"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Cohort reconciliation; signed dispatch/return links; service meters and complete FG history"
    - protocol_id: cp_pack
      process_id: "fg_service"
      flow_role: "Each cap shipping package form"
      record_type: "package_form_balance"
      raw_fields: "row_id; physical_form_grade; cohort; opening_empty_stock; opening_attached_WIP; opening_attached_FG; opening_reusable_stock; external_purchase; external_return_received; closing_empty_stock; closing_attached_WIP; closing_attached_FG; closing_reusable_stock; gross_carried_outward; returned_to_external_owner; waste; internal_reuse; cleaning_repair_service; article_mass; constituent_subledger"
      collection_method: "Weigh each complete package form or use validated configuration-specific counts/mass. Reconcile all empty/attached/reusable states separately. External return receipts and outward returns are not internal reuse; internal reuse is a paired transfer, with real service loads. No default new pallet per reuse and no double purchase of tape adhesive or carton constituents."
      unit: "kg; count with independently measured article mass"
      frequency: "Every receipt/move/reuse and stock boundary"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Article specifications; tare/count weights; purchase/return records; state-wise package closure"
    - protocol_id: cp_supply_pack
      process_id: "manufacture"
      flow_role: "Each resin supply package form"
      record_type: "package_form_balance"
      raw_fields: "row_id; physical_form_grade; cohort; opening_empty_stock; opening_attached_WIP; opening_attached_FG; opening_reusable_stock; external_purchase; external_return_received; closing_empty_stock; closing_attached_WIP; closing_attached_FG; closing_reusable_stock; gross_carried_outward; returned_to_external_owner; waste; internal_reuse; cleaning_repair_service; article_mass; constituent_subledger"
      collection_method: "Weigh each complete package form or use validated configuration-specific counts/mass. Reconcile all empty/attached/reusable states separately. External return receipts and outward returns are not internal reuse; internal reuse is a paired transfer, with real service loads. No default new pallet per reuse and no double purchase of tape adhesive or carton constituents."
      unit: "kg; count with independently measured article mass"
      frequency: "Every receipt/move/reuse and stock boundary"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Article specifications; tare/count weights; purchase/return records; state-wise package closure"
    - protocol_id: cp_allocation
      process_id: "manufacture"
      flow_role: "Each residual shared exchange"
      record_type: "allocation_evidence"
      raw_fields: "exchange_id; exclusive_assignment; subdivision_feasibility; virtual_subdivision; physical_driver; intensity_evidence; true_joint_gate; actual_exit_state_quality_quantity; contemporaneous_prices; later_processing_costs; allocation_weights; full_pool; sensitivity; uncertainty"
      collection_method: "Apply the justified attributional hierarchy exchange by exchange; document failed earlier steps before market-value fallback and reconcile assigned vectors to each original pool. Raw records remain unnormalised."
      unit: "each exchange original unit; contemporaneous currency"
      frequency: "Each shared pool and material change"
      temporal_coverage: "Entire selected release cohort and declared periods; include failed and zero-output intervals"
      site_scope: "Actual China converter and declared supplier boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter studies; causal justification; actual same-gate price evidence; 100% pool reconciliation"
  calculation_rules:
    - id: normalize_once
      applies_to: "hdpe_pellets; electricity_mfg; cooling_makeup; wash_water; hydraulic_fluid; purchased_air; external_cooling_supply; filter_screen; cleaning_ipa; r134a_charge; freight; regrind_in; regrind_out; external_cooling_return; waste_caps; waste_purge; waste_slit; waste_dust; waste_screen; waste_oil; waste_ipa; waste_resin_sack; cooling_blowdown; wash_effluent; water_vapour; hdpe_dust_air; n_butane_air; ipa_air; r134a_air; fg_in; fg_return; gross_shipped_cap; electricity_fg; carton; out_carton; waste_carton; liner; out_liner; waste_liner; wrap; out_wrap; waste_wrap; pallet; out_pallet; waste_pallet; tape; out_tape; waste_tape; label; out_label; waste_label; waste_fg_caps; resin_sack; out_resin_sack; recovered_r134a; nitrogen_air; oxygen_air; argon_air; atmospheric_co2_air"
      rule: "a_i = A_i / Q. A_i is the raw exchange numerator after actual unit/rate conversion, attribution and inherited WIP/cohort corrections; Q is kg of newly first-released caps in the selected release cohort. Execute once only for Q>0. Manufacturing and observed service contributions are identified separately; every card and aggregation references this same result. released_cap is the 1 kg identity, not another division."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "a_i"
      source_ids:
        - jrc-ilcd-2010
    - id: release_gate
      applies_to: "released_cap"
      rule: "Q = sum of unique first-released new-unit net mass in kg under cp_release. Where counts are used, configuration-specific measured cap mass converts count to kg; preserve its sampling scope and uncertainty. Already released FG, repeat tests, physical returns and dispatch are not new Q."
      inputs:
        - first_release_net_mass
        - accepted_new_count
        - measured_cap_mass
        - cp_release
      output: "Q"
      source_ids:
        - bericap-hdpe-cap
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "U_i = raw readings converted to the row unit before attribution. Weighed kg needs no density. Integrated volume times independently measured same-substance/state density yields kg; genuine volume rates are integrated first. Hydraulic m3 retains its volume identity; physical kg subledger is separate. Electricity E_MJ = 3.6 times metered E_kWh; heat and electricity stay separate. No time multiplier on integrated readings and no implicit item mass."
      inputs:
        - raw_reading
        - raw_unit
        - actual_rate_intervals
        - actual_density_state
        - cp_material
        - cp_energy
        - cp_water
        - cp_species
      output: "U_i"
      source_ids:
        - ifc-plastics-2007
    - id: wip_vector
      applies_to: "manufacture"
      rule: "For each exchange i, A_i_manufacture = opening_WIP_i + opening_separately_held_i + current_new_assigned_U_i - closing_WIP_i - closing_separately_held_i - independently_evidenced_distinct_assignments_i. Separately held vectors cover raw supplies, installed items, cooling/other water, hydraulic fluid, solvent and refrigerant charges where actually present, with physical quantities reconciled independently. current_new_assigned_U_i includes only newly incurred external-receipt and process-load vectors before these stock corrections; internal withdrawal is not an additional purchase. If a directly measured consumption vector already includes a particular stock correction, prove equivalence and apply that correction once only. Keep actual manufacturing losses and waste-treatment burdens in the intended cap cohort, not subtraction credits. Disjoint WIP/non-WIP ownership prevents duplicate stock terms; historical charge depletion without makeup retains its inherited burden. Failed/zero-output pools and later assignment history remain; mass alone cannot invent an exchange vector."
      inputs:
        - opening_WIP_vector
        - opening_separately_held_vector
        - current_new_assigned_U
        - closing_WIP_vector
        - closing_separately_held_vector
        - distinct_assignments
        - cp_material
        - cp_water
        - cp_wip
        - cp_allocation
      output: "A_i_manufacture"
      source_ids:
        - jrc-ilcd-2010
    - id: fg_vectors
      applies_to: "fg_service"
      rule: "For each release cohort preserve its original released exchange vector and original Q. Opening inherited FG vector plus internal Q receipt vector plus actual returned vector plus current attributable service vector equals closing FG vector plus gross outward vector plus discarded/treatment vector plus any independently evidenced emissions. Physical returns and original-delivery reversals are distinct signed records. Service burdens for historical cohorts use their own original cohort, never unrelated current Q; observed services do not reset manufacturing burden."
      inputs:
        - opening_FG_vector
        - Q_receipt_vector
        - returned_vector
        - current_service_vector
        - closing_FG_vector
        - gross_outward_vector
        - discarded_vector
        - cp_fg
      output: "A_i_service and reconciled cohort vectors"
      source_ids:
        - jrc-ilcd-2010
    - id: physical_gates
      applies_to: "all inventory rows"
      rule: "Manufacturing mass: opening material/WIP/auxiliary-fluid stocks + external material inputs = closing stocks + Q + external return/waste/emission masses. Internal regrind cancels. Cap-only FG mass: opening FG + Q + physical cap returns = closing FG + gross cap departures + discarded caps + any confirmed cap-derived emissions. The combined gate cancels the internal Q pair: opening manufacturing+FG stocks plus external material inputs and cap returns = closing manufacturing+FG stocks plus gross cap departures and real external return/waste/emission masses. Package balances are checked separately then included once in the combined all-material gate. Q is not added again beside its closing FG."
      inputs:
        - opening_material_WIP_FG_stock
        - external_material_inputs
        - Q
        - cap_returns
        - closing_material_WIP_FG_stock
        - gross_cap_departures
        - external_mass_exits
        - cp_wip
        - cp_fg
        - cp_water
        - cp_waste
      output: "independent manufacturing FG and combined mass closures"
      source_ids:
        - ifc-plastics-2007
        - jrc-ilcd-2010
    - id: package_balance
      applies_to: "cp_pack; cp_supply_pack"
      rule: "For each physical packaging form k: opening_empty_k + opening_attached_WIP_k + opening_attached_FG_k + opening_reusable_k + purchased_k + external_returns_received_k = closing_empty_k + closing_attached_WIP_k + closing_attached_FG_k + closing_reusable_k + gross_carried_outward_k + returned_to_external_owner_k + waste_k. Internal reuse transfers cancel, and its real service loads remain. Split different forms/materials; exclude package mass from cap Q and never net gross package carriage against returned cap mass."
      inputs:
        - opening_package_states
        - purchased_packages
        - external_returns_received
        - closing_package_states
        - gross_carried_outward
        - returned_to_external_owner
        - package_waste
        - cp_pack
        - cp_supply_pack
      output: "each package-form physical closure"
      source_ids:
        - sacmi-ccm-2018
        - jrc-ilcd-2010
    - id: species_and_elements
      applies_to: "cp_species; cp_water"
      rule: "Quantify each real species/phase independently and retain gross physical transfer separately from net environmental transfer after matched measured ambient-carrier cancellation; evaluate elemental input/output vectors from actual composition/analysis separately from total mass. Measured water supply/storage/return/blowdown/drift/leak/vapour terms share one coherent water gate. At most one unidentified scalar can be constrained by one independent residual; more unknowns require more measurement and remain incomplete. No deliberate reaction water in this non-reactive nominal route."
      inputs:
        - species_measurements
        - composition_assays
        - independent_elemental_data
        - water_path_measurements
        - cp_species
        - cp_water
      output: "species phase and elemental reconciliations"
      source_ids:
        - ifc-plastics-2007
    - id: exchange_allocation
      applies_to: "all inventory rows"
      rule: "For exchange i first assign exclusive/subdivided/virtually subdivided U_i. Apply supported determining physical drivers only to its residual shared pool. Only its truly remaining pool uses contemporaneous actual same-gate market values after documented earlier-step infeasibility. Sum all cohort/product/service assigned exchange vectors to the original pool before normalize_once; no fixed allocation fraction."
      inputs:
        - U_i
        - exclusive_assignments
        - residual_shared_pool
        - physical_drivers
        - actual_gate_values
        - cp_allocation
      output: "A_i"
      source_ids:
        - jrc-ilcd-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify full actual supplier/form/state and all adopted native restrictions; preserve missing auxiliary identity/provider as a data gap rather than a new generic bundle."
      evidence: "Direct identity context plus current supplier PDS/SDS/composition and exact support chain"
    - id: dq_measurement
      applies_to: "all inventory rows"
      requirement: "Preserve raw originals, original units/rates, calibration, independent substance-state densities where needed, detection limits and uncertainty; do not substitute an indicative brochure coefficient for measurement."
      evidence: "Instrument files; laboratory and mass/energy/water reconciliations"
    - id: dq_scope
      applies_to: "all inventory rows"
      requirement: "Cover the entire selected cohort and time/geographic scope, including failure, start-stop, idle, cleaning and rework. Report measured absence versus unknown and the observed service closing date; future service loads are not fabricated."
      evidence: "Mode logs; cohort/period genealogy; completeness and exclusions register"
    - id: dq_stocks
      applies_to: "cp_wip; cp_fg; cp_pack; cp_supply_pack"
      requirement: "Retain per-exchange inherited vectors as well as mass for all opening/closing stocks and returns; reconcile all three physical gates and each packaging form independently of allocation."
      evidence: "Signed physical stocktakes; vector ledgers; package-form closure"
    - id: dq_sources
      applies_to: "all inventory rows"
      requirement: "Maintain source id/type/reference/used_for and rule source links with complete applicability/countercontext. Qualitative primary facts are not quantitative site records or scientific/translation approval."
      evidence: "Full primary context; protocol records; unresolved-method and supplier-data disclosure"
validation_rules:
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Check every scope/qualifier and full native name, route, state, geography, CAS where present, type, receiving medium and reference-property support. Cap UUID is CN at-plant production mix for a cap/pump/sprayer family: use only the one-piece cap subset, never proof of HDPE grade, compliance or a provider. HDPE granulate UUID is slurry/gas-phase at-plant mass identity with no CAS/grade; disclose its inconsistent CPC34170 label without treating that label as physical evidence. Reject any real contradictory CAS, particle form or route."
    source_ids:
      - ifc-plastics-2007
  - rule_id: v_q
    applies_to: "all inventory rows"
    rule: "Verify cp_release, one explicit reference link released_cap, Q deduplication and one normalize_once operation. Reconcile WIP exchange vectors, failed/zero-output loads and all actual unit conversions before normalisation. Repeat release/dispatch cannot increase Q. Q<=0 or missing critical measured relations prevent a defensible unit result and remain explicit incomplete data."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_gates
    applies_to: "all inventory rows"
    rule: "Reconcile manufacturing, FG and combined physical control volumes independently of allocation. Cancel internal release/regrind transfers. Current closing FG is contained in Q, not Q plus another product. Every physical and inherited burden remainder must have an identified stock, discharge, waste or independently assigned service destination. Actual return-repair load belongs to its original released cohort/service; no new production from reinspection."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_species
    applies_to: "all inventory rows"
    rule: "Compare total mass and relevant elemental closure with independently quantified species/water pathways. No residual-fitted chemical emissions; no COD/VOC-to-species invention. Retain unknowns, detection limits, uncertainty and unresolved sinks separately. Confirm actual environmental medium; water-vapour UUID means ordinary unspecified-air emission, not stratospheric or long-term release."
    source_ids:
      - ifc-plastics-2007
  - rule_id: v_packaging
    applies_to: "all inventory rows"
    rule: "Check each packaging identity/form/stock balance in cp_pack including empty, attached and reusable stocks; gross outward packages follow actual gross carriage, not net cap delivery. No internal reuse repurchase or packaging mass in cap Q. Distinguish one whole commercial tape/carton article from duplicate backing/adhesive/constituent purchases."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: v_applicability
    applies_to: "all inventory rows"
    rule: "Check resin use conditions and cap test plan independently of broad identities. MB5568 historical PDS supports a water-cap injection route, but typical values and its customer-test disclaimer do not certify a current final cap. MB5569 explicitly not recommended for bottled water cannot be substituted by name similarity. BERICAP geometry, Husky injection architecture and SACMI downstream operations are a transparent synthesis, not a proven same-SKU line. Missing ordinary provider/auxiliary data are disclosed; a genuine core product/terminal/method gap holds methodology as draft."
    source_ids:
      - bericap-hdpe-cap
      - borealis-mb5568-2017
      - borealis-mb5569-counter
      - husky-hycap4-2016
      - sacmi-ccm-2018
  - rule_id: v_data
    applies_to: "all inventory rows"
    rule: "Require source-specific primary context, raw readings, calibration, coverage, all reported source fields and uncertainty. No missing exchange is zero; unavailable auxiliary identity is not permission for a collection row. Preserve distinct foreground measurement, author protocol, external process fact and identity evidence. Confirm bilingual rules and generated projection retain all conditions and ancestors; engineering success is not science, translation, mapping or publication approval."
    source_ids:
      - jrc-ilcd-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A declared cap manufacturing intermediate with separately identified observed cohort logistics; link to a bottle-filling model with matched neck/function and boundary"
  allowed_use: "Attributional cap supply modelling within documented product/route/geography and measured reference basis; keep the service account separately addressable"
  excluded_use: "Whole CPC leaf coverage; purchased-cap repacking as manufacture; injection/compression interchangeability; equal function from kg; unverified food-contact or science approval; duplicate Q/FG output"
  required_metadata: "Every required qualifier; actual supplier/provider/state; source-specific support and native restrictions; raw measurements; original cohort and service periods; explicit allocation/stock boundaries"
  required_quality_disclosure: "Measurement/identity/provider completeness; failed and zero-output data; density/species uncertainty; stock vectors; source age and synthesis limits; actual service observation endpoint; excluded future services"
  update_trigger: "Material grade/formulation or forming route change; neck/seal/tether change affecting process; release/Q or stock-boundary change; utility/species/packaging change; improved primary evidence"
data_sources:
  - id: "un-cpc-2025"
    type: "dataset"
    reference: "UN Statistics Division; CPC3.0 Structure 30June2025; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "36490 wording and adjacent 36410/363 boundaries only; no accepted mapping or whole-leaf methodology claim."
  - id: "borealis-mb5568-2017"
    type: "handbook"
    reference: "Borealis; BorPure MB5568 PDS; 20.12.2017 Ed.2; pp1–3; https://www.borealisgroup.com/storage/Datasheets/borpure/mb5568/MB5568-PDS-REG_EUROPE-EN-V2-PDS-EUR-49764-10046836.pdf"
    used_for: "Historical HDPE water-cap resin and injection/storage/regrind context; CAS25087-34-7; typical properties are not specifications or measured foreground amounts. No grade-to-flow or food-contact approval implied."
  - id: "husky-hycap4-2016"
    type: "handbook"
    reference: "Husky; HyCAP4 Beverage Closure Manufacturing System; July2016; pp2–7; https://www.husky.co/siteassets/documents/hycap-4-flyer-2016-07-21_final-en.pdf"
    used_for: "Integrated injection machine/mould/hot-runner controls and maintenance; optional metal separator. No advertised productivity or energy-saving percentage used."
  - id: "sacmi-ccm-2018"
    type: "handbook"
    reference: "SACMI; CCM Compression Technology for plastic closures; SI10/2018; pp2/18–21; https://sharedcontent.sacmi.com/sharedcontent/media/documents/plastic/catalogue/ccm_sfm_pmv_pmd.pdf"
    used_for: "Post-mould slit-band/folding and distinct packing/handling steps; adjacent liner and compression routes are counterexamples. No compression-cycle energy, lining materials or catalogue rates transferred to injection."
  - id: "bericap-hdpe-cap"
    type: "handbook"
    reference: "BERICAP; HEXALITE26/11,3 7242 SFB3T CA; publisher page snapshot16October2026; https://bericap.com/product/hexalite-26-113-7242-sfb-3t-ca/"
    used_for: "One-piece HDPE screw cap with bore seal and slit tamper band for still-water bottle interface; source product can be tethered. No inference of its forming machine or resin grade."
  - id: "borealis-mb5569-counter"
    type: "handbook"
    reference: "Borealis; BorPure MB5569 product page; snapshot16October2026; https://www.borealisgroup.com/products/product-catalogue/borpure-mb5569"
    used_for: "Counterexample: slip-containing MB5569 explicitly not recommended for bottled-water caps. Prevent blanket transfer between HDPE grades."
  - id: "ifc-plastics-2007"
    type: "official_guidance"
    reference: "IFC/World Bank Group; EHS Guidelines for Metal Plastic and Rubber Products Manufacturing; 30April2007; §1.1.2 pp9–11 and AnnexA pp22–23; https://www.ifc.org/content/dam/ifc/doc/2000/2007-metal-plastic-rubber-products-ehs-guidelines-en.pdf"
    used_for: "Non-reactive resin-to-shaped-part process and screening for actual water/waste/emission pathways. Table4 is potential high-temperature release evidence; not a universal species factor. No metals/rubber substances, legal limits or IFC conformance imported."
  - id: "jrc-ilcd-2010"
    type: "official_guidance"
    reference: "European Commission JRC; ILCD Handbook General guide for LCA Detailed guidance; March2010; §§7.9.2–7.9.3 printed255–272; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Allocation hierarchy in a justified attributional allocation scenario; specific exchange causality before residual common-gate market values and total conservation. Collection/stock equations are this PCR operational protocols; no ILCD-derived recycling credit or whole-programme compliance."
