measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the calibrated net mass in kg of new cap units first passing the complete declared release plan during the selected cohort period. Deduplicate unit/lot acceptance history; exclude packaging, previously released FG, repeat tests and returned-unit reinspection. Measure gross/tare and conditioning state. If counts are used, measure configuration-specific accepted cap mass M by traceable calibrated sampling/weighing with defined mould/neck/resin/band scope and uncertainty; Q = accepted new count times measured M. No assumed grams per cap or density from a flow coefficient."
  - id: single_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: ""
      uuid: ""
    required_unit: ""
    rule: "All collection protocols record raw unnormalised amounts. Convert actual original units/rates, reconcile stock vectors and assign shared exchanges before normalize_once. Cards and protocol aggregation reference that same result, never another division. Keep failed batches and start/stop, idle, cleaning and rework loads. If Q<=0, retain actual loads and uncertainty with no unit result."
  - id: unit_state
    applies_to: "all inventory rows"
    required_property_ref:
      name: ""
      uuid: ""
    required_unit: ""
    rule: "Integrated liquid/gas volumes are converted with independently established density of that substance at recorded composition/pressure/temperature; do not multiply an integrated volume by time again. Integrate genuine rates first. Preserve electricity separately from heat: kWh to MJ uses 3.6. Hydraulic fluid has a Volume/m3 identity; obtain an independent actual-fluid density or weighed mass for physical balance, not a water density or secondary-property coefficient. Water volume coefficients likewise do not replace supply-state measurement."
