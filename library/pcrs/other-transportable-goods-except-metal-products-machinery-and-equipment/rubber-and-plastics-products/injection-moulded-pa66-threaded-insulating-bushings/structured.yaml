          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| a_subdivide | multifunctional processes | Only attributional scenarios requiring allocation are covered. First separate independently dedicated operations and virtually subdivide actual product-specific exchanges. Distinguish process multifunctionality from multifunctional-product comparisons and consequential substitution; a production handbook gives no allocation permission. | ilcd-attributional-allocation-2010 |\n| a_causal | remaining individual exchanges | For each remaining exchange identify the determining physical causal relationship: demonstrate how quantitative co-function changes determine this exchange. Metered cycle/heat load, occupied space-time or actual processing time may support particular exchanges only when causal. No universal mass key and no arbitrary physical/economic choice. Document distinct product-related and process-related allocations and uncertainty. | ilcd-attributional-allocation-2010 |\n| a_residual | genuine common-process remainder | Only after justifying why determining physical causality cannot resolve a real remainder use contemporaneous market values at the actual common-process gate and actual quality/bulk/packaged state. Remove later specific service/transport costs from downstream prices. Preserve price evidence and sensitivity; no fixed ratio, invented waste fee adjustment or automatic avoided-product credit. | ilcd-attributional-allocation-2010 |\n| a_recovery | regrind; packaging; wastes | Internal recovery/reuse cancels physical transfers but retains actual energy, losses and inherited burdens. Evidence determines whether an external output is waste or a genuine co-function; neither sale nor zero price alone creates a credit. Apply the stated scenario and compatible waste-provider convention once. | ilcd-attributional-allocation-2010 |\n| asset_manufacture_conservation | existing capital/reusable manufacture attribution | Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. |  |\n\n"
