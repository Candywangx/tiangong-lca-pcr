allocation_rules:
  - rule_id: a_subdivide
    applies_to: "multifunctional processes"
    rule: "Only attributional scenarios requiring allocation are covered. First separate independently dedicated operations and virtually subdivide actual product-specific exchanges. Distinguish process multifunctionality from multifunctional-product comparisons and consequential substitution; a production handbook gives no allocation permission."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_causal
    applies_to: "remaining individual exchanges"
    rule: "For each remaining exchange identify the determining physical causal relationship: demonstrate how quantitative co-function changes determine this exchange. Metered cycle/heat load, occupied space-time or actual processing time may support particular exchanges only when causal. No universal mass key and no arbitrary physical/economic choice. Document distinct product-related and process-related allocations and uncertainty."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_residual
    applies_to: "genuine common-process remainder"
    rule: "Only after justifying why determining physical causality cannot resolve a real remainder use contemporaneous market values at the actual common-process gate and actual quality/bulk/packaged state. Remove later specific service/transport costs from downstream prices. Preserve price evidence and sensitivity; no fixed ratio, invented waste fee adjustment or automatic avoided-product credit."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: a_recovery
    applies_to: "regrind; packaging; wastes"
    rule: "Internal recovery/reuse cancels physical transfers but retains actual energy, losses and inherited burdens. Evidence determines whether an external output is waste or a genuine co-function; neither sale nor zero price alone creates a credit. Apply the stated scenario and compatible waste-provider convention once."
    source_ids:
      - ilcd-attributional-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_transport
      process_id: "manufacture"
      flow_role: "actual inbound road freight"
      record_type: "foreground_record"
      raw_fields: "actual mode; origin destination; whole shipment load mass; actual distance; tonne-kilometres; vehicle and empty return; supplier geography period; delivered-provider transport inclusions"
      collection_method: "Record undivided shipment mass in tonnes and actual loaded route distance in km; retain load-distance multiplication once as raw transport service. Verify provider scope and exclude a second purchase when transport is already included in delivered supply; other actual modes require separate cards."
      unit: "tkm"
      frequency: "each shipment and declared cohort"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_material
      process_id: "manufacture"
      flow_role: "purchased compound"
      record_type: "foreground_record"
      raw_fields: "supplier grade; delivered whole formulation; raw unit masses; moisture; inbound transport; opening and closing raw stock; stage WIP; regrind transfers; every inherited exchange vector"
      collection_method: "Weigh receipts and issued material on calibrated scales; retain invoices composition and transport records. Measure moisture independently and reconcile raw/WIP vectors and internal regrind without division."
      unit: "kg"
      frequency: "each receipt issue batch and stock cut-off"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_release
      process_id: "manufacture"
      flow_role: "unique first release"
      record_type: "foreground_record"
      raw_fields: "cohort_id; configuration; drawing; accepted count; net measured kg; moisture; temperature; humidity; time since demoulding; first release event; test method conditioning and result"
      collection_method: "Weigh accepted bare complete bushings or a count-verified homogeneous lot with calibrated tare; exclude packaging. Sum unique first-release net kg as Q_c; reconcile actual counts and reject repeat events. No invented item mass."
      unit: "kg"
      frequency: "each unique acceptance event and cohort close"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_energy
      process_id: "manufacture"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "meter ID; raw start and end readings; kWh; true rate time series if any; operation and idle logs; cohorts; allocation evidence; imported service inclusions"
      collection_method: "Retain undivided meter differences; integrate only actual power rates using matching time units. Separate dedicated loads and evidence each shared-load attribution before normalization."
      unit: "kWh"
      frequency: "continuous meters and every run including zero output"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_water
      process_id: "manufacture"
      flow_role: "water and moisture"
      record_type: "foreground_record"
      raw_fields: "each circuit and control-body ID; matched interval; raw supply and return; independently measured gross atmospheric water entry; actual gross desorption and evaporation; opening closing volume and density state; actual solute assays; blowdown; condensate and its actual source; derived product net moisture change; water carried in compound or purchased air/liquid; inherited vectors; temperature enthalpy"
      collection_method: "Independently meter/weigh every actual gross entry/outlet and loop stock at the same control body and interval; moisture tests and source-specific density states separately establish conversions. Pair actual atmospheric condensate with its measured source entry, without duplicating supply-carried water. Derive net product moisture only after source/outlet/stock reconciliation; never use net uptake as input while separately retaining its desorption output. Differentiate integrated volumes and real rates. Water/element/species/charge balances are independent checks, not residual fitting."
      unit: "kg"
      frequency: "each meter interval batch and loop cut-off"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_charge
      process_id: "manufacture"
      flow_role: "oil and refrigerant charges"
      record_type: "foreground_record"
      raw_fields: "equipment/charge ID; supplied preparation; original units; opening and closing charge; top-up; service period; recovered return; waste; leakage; circuit burden vector"
      collection_method: "Use charge/service logs plus calibrated weighing and verified recipient records. Preserve charge carryover and actual recovery/waste/leak destination without repeating initial charge each batch; external water returns and condensate use cp_water as well."
      unit: "kg"
      frequency: "each service event and opening/closing cut-off"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_air
      process_id: "manufacture"
      flow_role: "external compressed air"
      record_type: "foreground_record"
      raw_fields: "supplier; pressure; temperature; humidity; original metered volume; reference state; rate or total flag; allocation; supply energy coverage"
      collection_method: "Record actual undivided standard-state supply volume and state corrections. Do not multiply cumulative volume by time or presume air density from a secondary property."
      unit: "m3"
      frequency: "each supply interval and cohort"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_clean
      process_id: "manufacture"
      flow_role: "cleaning solvent and cloth"
      record_type: "foreground_record"
      raw_fields: "actual solvent identity and purity; delivered whole mass; cloth masses; raw stock; spent liquid; retained cloth liquid; speciated air emission; destinations; inherited vectors"
      collection_method: "Weigh and reconcile whole purchases/unused stock and each destination with independent composition/species evidence. Retain actual cleaning/failed-run energy; water and assay components are subaccounts only."
      unit: "kg"
      frequency: "each actual clean-up and stock cut-off"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_waste
      process_id: "manufacture"
      flow_role: "moulding waste and captured dust"
      record_type: "foreground_record"
      raw_fields: "stream identity; source stage; polymer composition; contamination; particle size; raw wet/dry mass; moisture; handler; transfer; burden vector"
      collection_method: "Weigh separated waste by actual handler/state and reconcile failed lots, sprues, rejected tests and collected dust. Internal regrind cancels physically but keeps its energy/losses."
      unit: "kg"
      frequency: "each waste transfer and cohort"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_emission
      process_id: "manufacture"
      flow_role: "particulate and additional real species"
      record_type: "foreground_record"
      raw_fields: "species or supplied-particle identity; whole compound composition; particle size; air compartment; stack/fugitive; raw concentration and volume or mass; temperature pressure moisture; time only for true rates; abatement"
      collection_method: "Measure actual species/mass with independent identity and state evidence. Integrated gas volume times concentration is not multiplied by duration again. No water density for other fluids and no VOC/COD-as-species substitution."
      unit: "kg"
      frequency: "representative actual runs plus failures and reporting period"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_service
      process_id: "released_service"
      flow_role: "original-cohort services and article movement"
      record_type: "foreground_record"
      raw_fields: "original cohort release kg; original dispatch and reversal; opening/closing FG physical stock and every inherited production/service vector; raw energy; independent post-release product moisture gains and losses; received return; gross shipment; reject; actual repair inputs and wastes; interval"
      collection_method: "Record raw custody movements and incremental services separately, preserving historical cohort denominators and opening/closing service-WIP/charge vectors. Actual repair materials need their own cards; transfers carry inherited production once, never new Q."
      unit: "row-specific kg or kWh"
      frequency: "every physical movement and actual service interval"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
    - protocol_id: cp_packaging
      process_id: "released_service"
      flow_role: "each package and destination"
      record_type: "foreground_record"
      raw_fields: "package identity and composition; count and measured mass; empty stock; attached WIP/FG; reusable stock; purchases; external returns received; gross outward; outward return; waste; original burden vector"
      collection_method: "For each actual package independently weigh movements and stocks and reconcile b_packages. Trace returned and supplier-included packages; retain raw purchase and physical gross-out, not net financial quantities. Internal reuse is a transfer."
      unit: "kg"
      frequency: "each purchase physical shipment return waste and stock cut-off"
      temporal_coverage: "complete declared cohort/period and relevant history"
      site_scope: "actual site and each supply/equipment/destination"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/original ledgers/independent states and vector reconciliation"
  calculation_rules:
    - id: normalize_once
      applies_to: "all inventory rows"
      rule: "For Q_c > 0, result_j_c = A_j_c / Q_c once. First convert undivided raw numerator units/rates/states and apply evidenced allocation and disjoint stock/WIP/utility vector carryover. For manufacturing A_j_c is attributable current expenditure plus opening minus closing inherited raw/WIP/charge vectors. For services it is actual original-cohort incremental service plus opening minus closing service-WIP/charge vector; Q_c is that cohort original release kg. Physical purchase/return/handover/gross shipment/waste cards use actual raw physical movement as A_j_c, with inherited burdens tracked separately; unused-stock carryover affects burden consumption, not actual purchase/outward mass. Cancel internal transfers and do not add carried production a second time. Collection, cards and aggregation read the stored result without another division. At Q_c=0 preserve real loads and issue no unit value."
      inputs:
        - A_j_c
        - Q_c
        - cohort_id
        - service_interval
      output: "result_j_c"
      source_ids:
        - ifc-plastics-manufacturing-2007
        - basf-ultramid-processing
        - heyco-threaded-insulating-bushings
    - id: release_sum
      applies_to: "finished"
      rule: "Q_c = sum of calibrated net kg of unique complete first-release events in cohort c and declared moisture state; accepted counts and measured lot masses reconcile without a prescribed kg/item. Closing FG already in Q_c is not added again."
      inputs:
        - net_release_kg
        - unique_event
        - cohort_id
        - moisture_state
      output: "Q_c"
      source_ids:
        - heyco-threaded-insulating-bushings
        - basf-ultramid-processing
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Full actual names/formulations/routes/states, matched upstream providers and every declared qualifier; no UUID implies a supplier inventory or functional certification."
      evidence: "supplier declarations; drawing; test and compatibility evidence"
    - id: dq_quantities
      applies_to: "all inventory rows"
      requirement: "Trace original units and conversions, sampling scope and uncertainty; no invented range, density, emission factor, loss, service life or item weight. Unknowns retain an explicit collection requirement."
      evidence: "calibration; original meters and invoices; independent assays"
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "Complete operations including failures and every package/water/charge stock; retain source and destination plus inherited vectors, cohort/time/geography and service completeness."
      evidence: "physical ledgers; vector reconciliation; failure logs"
    - id: dq_applicability
      applies_to: "finished"
      requirement: "Source synthesis is not a factory dataset or proof that as-moulded performance meets an actual order. Actual release needs the declared specification and moisture-conditioned test evidence; a required conditioning route outside section1 needs applicability review."
      evidence: "product acceptance; supported limitations and independent review"
validation_rules:
  - rule_id: v_identity
    applies_to: "finished"
    rule: "Check every declared qualifier, actual completed bushing geometry/thread and moisture/test state. A raw PA66 or cable flow cannot replace the terminal. The broad native identity does not establish performance, supplier coverage or all36980 applicability."
    source_ids:
      - heyco-threaded-insulating-bushings
      - basf-ultramid-processing
  - rule_id: v_once
    applies_to: "all inventory rows"
    rule: "Retain undivided original records; convert true rates/units/states and allocate before the single normalize_once result. Collection and cards read that stored result without further division. Q=0 preserves real loads and yields no unit value. Unknown is neither zero nor pass."
    source_ids:
      - ifc-plastics-manufacturing-2007
  - rule_id: v_closure
    applies_to: "all physical gates"
    rule: "Require separate raw/WIP/FG, each utility/charge and each package closure plus consistent consolidated closure; retain every inherited exchange vector and actual gross movement. Species and moisture need independent evidence; discrepancies require investigation without arbitrary tolerance or residual invention."
    source_ids:
      - ifc-plastics-manufacturing-2007
      - basf-ultramid-processing
  - rule_id: v_coverage
    applies_to: "all inventory rows"
    rule: "Actual route utilities and emissions/wastes must be screened and separately represented. An unconfirmed auxiliary UUID is a matching requirement, not a cut-off; a true terminal/route/basis gap prevents usable methodology. State data completeness and unresolved measurements, science and translation review separately from structural checks."
    source_ids:
      - ifc-plastics-manufacturing-2007
      - basf-ultramid-processing
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
