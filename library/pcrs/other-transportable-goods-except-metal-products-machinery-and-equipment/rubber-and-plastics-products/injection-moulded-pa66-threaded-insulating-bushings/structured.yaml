system_boundary:
  rules:
    - rule_id: b_complete
      applies_to: "manufacture"
      rule: "Include inbound transport/receipt, actual drying and transfer, plastication, filling/holding/cooling, thread release/ejection, trimming, permitted granulation, inspection and destructive tests. Retain every failed/start/stop/idle/zero-output/cleanup/rework load. No purchased finished article substitutes for manufacture."
      source_ids:
        - basf-ultramid-processing
        - ifc-plastics-manufacturing-2007
    - rule_id: b_q
      applies_to: "finished"
      rule: "Q is actual net kg of uniquely first-quality-released complete bushings in the matched cohort and stated moisture condition. Closing FG already released is included in Q, not another manufacturing output. Shipment, old stock, reinspection, external return or repair does not create Q. Never invent item kg or density; sum calibrated net weighings and reconcile actual counts."
      source_ids:
        - heyco-threaded-insulating-bushings
        - basf-ultramid-processing
    - rule_id: b_vectors
      applies_to: "all inventory rows"
      rule: "Keep disjoint raw-stock, WIP, released-FG and utility/equipment ledgers. Every opening/closing stock carries quantity, stage, composition and inherited exchange vector. Manufacturing A_j_c contains actual attributable current raw expenditure + opening inherited raw/WIP vectors - closing carried raw/WIP vectors, with evidenced output/waste attribution. Regrind is an internal burden-carrying transfer, never a second purchase or burden-free input. Failed production retains its load."
      source_ids:
        - ifc-plastics-manufacturing-2007
        - basf-ultramid-processing
    - rule_id: b_services
      applies_to: "released_service"
      rule: "Retain actual packing/warehouse/handling/dispatch/returns/inspection and real incremental repairs in original-cohort service accounts. Carry opening/closing FG production and service vectors and reverse the original dispatch attribution on return. Old cohorts retain their original denominator and history; never divide their loads by new Q. Include only the declared observed service interval and disclose remaining future services."
      source_ids:
        - heyco-threaded-insulating-bushings
    - rule_id: b_physical
      applies_to: "manufacture; released_service"
      rule: "For manufacturing material mass: actual external material inputs + opening raw stock + opening WIP + opening utility/equipment charge stocks = new first release + closing raw stock + closing WIP + closing utility/equipment charge stocks + each external material output/loss. Each stock/stream occupies one disjoint account; reconcile each utility charge separately without counting it twice. Energy/service units are not added into a mass balance. For each matched water control body and interval, use independently evidenced gross atmospheric entry and actual gross desorption/evaporation/condensate outlets; product net moisture change is derived, not a second boundary stream or a substitute for gross entry. Trace actual condensate sources, retaining water phase/compartment and distinguishing atmospheric resource entry from emitted vapour and water already carried by whole material/air/liquid supplies; cancel internal circulation. Released FG: opening FG + first release + external article returns + independently measured actual post-release moisture gains = closing FG + gross physical dispatch + rejects + independently measured actual post-release moisture losses. Post-release water changes never create new Q. Cancel internal release and regrind in the combined gate. Close total wet/dry mass and relevant C/N and formulation elements independently from chemical species/phase evidence. Free/absorbed water, true reaction water and structural water are distinct; nonreactive forming creates no assumed polymerization water. Do not fit two unknowns with one residual or call VOC/COD a chemical mass."
      source_ids:
        - ifc-plastics-manufacturing-2007
        - basf-ultramid-processing
    - rule_id: b_utility_stocks
      applies_to: "manufacture"
      rule: "Independently close each actual cooling-water circuit, hydraulic-oil inventory and refrigerant charge: opening + actual external supply/returns = closing + outgoing return/recovery + blowdown/waste + genuine leakage/evaporation/uptake. Preserve charge-specific inherited vectors and service periods, not the whole repeated charge each batch. Internal circulation is neither fresh purchase nor new discharge. Actual external heat-exchange water supply/return retains paired physical streams, temperatures/enthalpy and supplier water/energy convention; no presumed boiler/steam/condensate."
      source_ids:
        - ifc-plastics-manufacturing-2007
    - rule_id: b_packages
      applies_to: "released_service"
      rule: "For EACH physical bag, carton and pallet separately: opening empty + opening attached WIP/FG + opening reusable pool + separate package purchases + supplier-included inbound packages + external returns received = closing empty + closing attached WIP/FG + closing reusable pool + outward with gross physical shipments + outward returns + waste. Include incoming supplier packaging and packages attached to returned articles. Internal reuse cancels; packaging never enters Q, another purchase or automatic co-product. Physical outward mass is not reduced by allocation or reuse."
      source_ids:
        - heyco-threaded-insulating-bushings
        - ifc-plastics-manufacturing-2007
    - rule_id: b_additions
      applies_to: "all inventory rows"
      rule: "A conditional card is used only for its actual named substance/article and state. Add a separate card/protocol/destination for every real additional fuel, heat, cleaner, purge material, filter, package, water stream or identified emission species; never hide it in zero or other. Materially changed processing requires evidence and applicability review. This electric nonreactive route presumes no combustion or particular decomposition-gas species."
      source_ids:
        - basf-ultramid-processing
        - ifc-plastics-manufacturing-2007
