      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual already formulated PA66 pellets at supplier handover with inbound transport and actual utility supplies; full raw-to-article foreground manufacture |\n| starting_condition_role | Converter manufacture from purchased whole compound; upstream formulation/polymerization remains linked |\n| product_classification_scope | Only the section1 subset of CPC3.0:36980 |\n| recursive_input_rule | Bought finished bushings cannot replace the manufacturing chain. Internal regrind and released-cohort transfers carry vectors and cancel on consolidation; returns are original-cohort service |\n| upstream_dataset_requirement | Each whole supply and transport needs compatible grade form state geography period and supplier scope; UUID establishes no upstream inventory |\n| disclosure | Disclose drawing formulation route moisture gate cohort original-unit records WIP/FG/utility stocks service interval allocation and completeness |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| b_complete | manufacture | Include inbound transport/receipt, actual drying and transfer, plastication, filling/holding/cooling, thread release/ejection, trimming, permitted granulation, inspection and destructive tests. Retain every failed/start/stop/idle/zero-output/cleanup/rework load. No purchased finished article substitutes for manufacture. | basf-ultramid-processing; ifc-plastics-manufacturing-2007 |\n| b_q | finished | Q is actual net kg of uniquely first-quality-released complete bushings in the matched cohort and stated moisture condition. Closing FG already released is included in Q, not another manufacturing output. Shipment, old stock, reinspection, external return or repair does not create Q. Never invent item kg or density; sum calibrated net weighings and reconcile actual counts. | heyco-threaded-insulating-bushings; basf-ultramid-processing |\n| b_vectors | all inventory rows | Keep disjoint raw-stock, WIP, released-FG and utility/equipment ledgers. Every opening/closing stock carries quantity, stage, composition and inherited exchange vector. Manufacturing A_j_c contains actual attributable current raw expenditure + opening inherited raw/WIP vectors - closing carried raw/WIP vectors, with evidenced output/waste attribution. Regrind is an internal burden-carrying transfer, never a second purchase or burden-free input. Failed production retains its load. | ifc-plastics-manufacturing-2007; basf-ultramid-processing |\n| b_services | released_service | Retain actual packing/warehouse/handling/dispatch/returns/inspection and real incremental repairs in original-cohort service accounts. Carry opening/closing FG production and service vectors and reverse the original dispatch attribution on return. Old cohorts retain their original denominator and history; never divide their loads by new Q. Include only the declared observed service interval and disclose remaining future services. | heyco-threaded-insulating-bushings |\n| b_physical | manufacture; released_service | For manufacturing material mass: actual external material inputs + opening raw stock + opening WIP + opening utility/equipment charge stocks = new first release + closing raw stock + closing WIP + closing utility/equipment charge stocks + each external material output/loss. Each stock/stream occupies one disjoint account; reconcile each utility charge separately without counting it twice. Energy/service units are not added into a mass balance. For each matched water control body and interval, use independently evidenced gross atmospheric entry and actual gross desorption/evaporation/condensate outlets; product net moisture change is derived, not a second boundary stream or a substitute for gross entry. Trace actual condensate sources, retaining water phase/compartment and distinguishing atmospheric resource entry from emitted vapour and water already carried by whole material/air/liquid supplies; cancel internal circulation. Released FG: opening FG + first release + external article returns + independently measured actual post-release moisture gains = closing FG + gross physical dispatch + rejects + independently measured actual post-release moisture losses. Post-release water changes never create new Q. Cancel internal release and regrind in the combined gate. Close total wet/dry mass and relevant C/N and formulation elements independently from chemical species/phase evidence. Free/absorbed water, true reaction water and structural water are distinct; nonreactive forming creates no assumed polymerization water. Do not fit two unknowns with one residual or call VOC/COD a chemical mass. | ifc-plastics-manufacturing-2007; basf-ultramid-processing |\n| b_utility_stocks | manufacture | Independently close each actual cooling-water circuit, hydraulic-oil inventory and refrigerant charge: opening + actual external supply/returns = closing + outgoing return/recovery + blowdown/waste + genuine leakage/evaporation/uptake. Preserve charge-specific inherited vectors and service periods, not the whole repeated charge each batch. Internal circulation is neither fresh purchase nor new discharge. Actual external heat-exchange water supply/return retains paired physical streams, temperatures/enthalpy and supplier water/energy convention; no presumed boiler/steam/condensate. | ifc-plastics-manufacturing-2007 |\n| b_packages | released_service | For EACH physical bag, carton and pallet separately: opening empty + opening attached WIP/FG + opening reusable pool + separate package purchases + supplier-included inbound packages + external returns received = closing empty + closing attached WIP/FG + closing reusable pool + outward with gross physical shipments + outward returns + waste. Include incoming supplier packaging and packages attached to returned articles. Internal reuse cancels; packaging never enters Q, another purchase or automatic co-product. Physical outward mass is not reduced by allocation or reuse. | heyco-threaded-insulating-bushings; ifc-plastics-manufacturing-2007 |\n| b_additions | all inventory rows | A conditional card is used only for its actual named substance/article and state. Add a separate card/protocol/destination for every real additional fuel, heat, cleaner, purge material, filter, package, water stream or identified emission species; never hide it in zero or other. Materially changed processing requires evidence and applicability review. This electric nonreactive route presumes no combustion or particular decomposition-gas species. | basf-ultramid-processing; ifc-plastics-manufacturing-2007 |\n\n"
