      markdown: "## 9. Validation Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| v_identity | finished | Check every declared qualifier, actual completed bushing geometry/thread and moisture/test state. A raw PA66 or cable flow cannot replace the terminal. The broad native identity does not establish performance, supplier coverage or all36980 applicability. | heyco-threaded-insulating-bushings; basf-ultramid-processing |\n| v_once | all inventory rows | Retain undivided original records; convert true rates/units/states and allocate before the single normalize_once result. Collection and cards read that stored result without further division. Q=0 preserves real loads and yields no unit value. Unknown is neither zero nor pass. | ifc-plastics-manufacturing-2007 |\n| v_closure | all physical gates | Require separate raw/WIP/FG, each utility/charge and each package closure plus consistent consolidated closure; retain every inherited exchange vector and actual gross movement. Species and moisture need independent evidence; discrepancies require investigation without arbitrary tolerance or residual invention. | ifc-plastics-manufacturing-2007; basf-ultramid-processing |\n| v_coverage | all inventory rows | Actual route utilities and emissions/wastes must be screened and separately represented. An unconfirmed auxiliary UUID is a matching requirement, not a cut-off; a true terminal/route/basis gap prevents usable methodology. State data completeness and unresolved measurements, science and translation review separately from structural checks. | ifc-plastics-manufacturing-2007; basf-ultramid-processing |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
