system_boundary:
  rules:
    - rule_id: boundary_full_route
      applies_to: "all inventory rows"
      rule: "Include receipt/storage and actual drying, feeding, screw-drive and band-heat extrusion, melt screen changes, vacuum sizing, tank/spray cooling, stress relaxation, haul-off, indent marking, cutting, cleaning, actual quality tests and first release. Keep actual interstage masses/meters even when aggregated into pipe_manufacture. No energy/yield/temperature default or purchased-finished-pipe shortcut."
      source_ids:
        - ppi-pe-manufacturing
        - borealis-black-pe100-compound
    - rule_id: boundary_service
      applies_to: "pipe_service"
      rule: "Retain actual bundling, packaging, storage, handling and factory loading/dispatch in a separate service ledger by served lot, dates, service driver and linked production history. Opening FG retains its prior production vector; closing FG already belongs to first-release Q and is not another output. Distinguish observed service-to-period-end from complete-to-dispatch service; do not invent future service for unshipped stock or claim a dispatch endpoint for it."
      source_ids:
        - ppi-pe-manufacturing
        - ilcd-allocation-2010
    - rule_id: boundary_cohorts
      applies_to: "all inventory rows"
      rule: "Keep failures, zero-output runs, start/stop, idle, cleaning, rejected material, actual recycling and rework. Opening/closing raw stock and WIP carry quantities, composition/state, completion and the full inherited vector of every exchange with source cohorts. Previously released FG rework keeps its original production history and only its real incremental rework/service, never another first release or wholesale reassignment to current Q. Separately held non-raw/non-WIP utility, cooling-water, oil and installed-article/charge stores also retain disjoint opening/closing physical quantities and every inherited exchange vector under cp_stocks/cohort_vectors. Retained media may provide real service without mass loss: establish assigned and remaining service burden from actual history, not a default lifetime or repeated full charge. A physical receipt, internal issue, return, retained stock and actual consumption are distinct; an already corrected consumption record is never stock-corrected again."
      source_ids:
        - ppi-pe-manufacturing
        - ilcd-allocation-2010
    - rule_id: boundary_actual_atomic
      applies_to: "all inventory rows"
      rule: "Cards are concrete possible exchanges, not a common bill. Before quantitative use add every actual missing material, formulation, ink/foil, cleaner, treatment chemical, fuel, refrigerant, gas species, package component, captured dust, wastewater-treatment sludge or utility export as its own atomic card with actual process/receiver/property. Retain a specific physical/chemical name when UUID is unresolved. Absence needs affirmative route/measurement evidence; unmeasured is not zero."
      source_ids:
        - ppi-pe-manufacturing
        - borealis-black-pe100-compound
    - rule_id: boundary_utilities
      applies_to: "all utility rows"
      rule: "Actual external chilled water and warm return retain gross mass, thermal state, enthalpy, destination and supplier water/energy conventions. Internal loops cancel; treat water loss make-up separately. An electric extrusion line does not imply steam, boiler, fuel combustion or purchased heat. Include any actual such system through separate exchanges before data use and prevent double-counting utility supply and its own electricity."
      source_ids:
        - ppi-pe-manufacturing
    - rule_id: boundary_physical_gates
      applies_to: "all physical ledgers"
      rule: "Use three consistent raw physical gates: manufacturing stocks to quality release; FG warehouse to gross physical dispatch; consolidated manufacture plus FG after cancelling Q and all internal transfers. Packaging has a separate per-component gate. Physical masses and relevant carbon/other elements close before burden allocation; allocation factors do not shrink real coproducts, wastes, carriers or returned utility water."
      source_ids:
        - ilcd-allocation-2010
