    required_unit: "kg"
    rule: "Use calibrated net lot weighing excluding detachable packaging. Length conversion needs separately measured lambda = same-configuration net sample mass / measured sample length in kg/m; retain grade OD wall SDR moisture configuration calibration and sampling uncertainty. Count conversion needs measured mass for that actual pipe/configuration. Never infer density from a native secondary factor or assume one item is 1 kg."
  - id: whole_formulation
    applies_to: "black_compound"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Acquire the complete supplied black compound once. Polymer carbon black stabilizer assay and carrier/free water are non-additive constituent subledgers; retained moisture is not a second purchase. Keep free/adhering moisture, carrier water, any independently demonstrated structural/crystalline water, actual reaction-formed water and vapour/liquid phase transfers in distinct non-additive water subledgers. Ordinary PE physical forming creates no presumed structural or reaction water; actual oxidation, hydrated additives or chemical treatment need independent species/state/reaction evidence, never a fitted residual."
  - id: numerator_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: ""
      uuid: ""
    required_unit: ""
