allocation_rules:
  - rule_id: allocation_context
    applies_to: "all inventory rows"
    rule: "This is attributional manufacturing inventory for the declared decision context when allocation is required. Apply ILCD sections7.9.2/7.9.3 within their situation limitations: establish why applicable subdivision/virtual subdivision and where relevant substitution/system expansion do not avoid allocation. No free choice between allocation/substitution, consequential claim or whole ILCD/PEF compliance is made."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_subdivision
    applies_to: "all inventory rows"
    rule: "First assign exclusive measured recipe, equipment, test, rework and packing burdens directly to their lot/function; subdivide or virtually subdivide actual line and service records. Then identify determining physical causality separately for each remaining exchange. Neither equal mass nor a convenient clock share is a universal key. A shared cooling/transport/storage driver must explain actual heat removal, limiting load/volume, occupancy and time as relevant; correlate-only drivers are insufficient."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_residual
    applies_to: "only genuinely residual shared burdens"
    rule: "Only where no determining physical causal relation remains identifiable use the relative contemporaneous market value of real co-functions at the same joint unit-process exit, in their actual quantity, quality and conditioning. Document gate, price source/period, grade, moisture, transport/packaging/conditioning adjustments and uncertainty/sensitivity. Do not apply retail delivered prices to untreated purge, allocate direct-assigned flows again, use fixed shares or multiply physical outputs by burden fractions."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_recycle
    applies_to: "returns and secondary outputs"
    rule: "Distinguish actual usable downgraded pipe, supplied regrind, waste sent to treatment, external utility return and customer return by their physical function and real destination/value. Internal same-material reuse retains inherited burdens plus measured effort/loss; it has no new purchase/output or automatic avoided-production credit. External recycling/end-of-life allocation needs its own justified consistent convention and any required additional evidence; this PCR imports no ILCD recycling-loop formula or fixed recycled-content factor."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: allocation_conservation
    applies_to: "all burden vectors"
    rule: "For each exchange the sum of burdens assigned to all real functions/cohorts and retained stocks equals the pre-allocation inventory. Keep first-production history, transferred WIP, existing FG and actual incremental rework/service distinct. Empty reusable packaging is not a new co-function; allocate only its actual acquisition/reconditioning/service with a documented conserved history."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "pipe_manufacture"
      flow_role: "product"
      record_type: "release_records"
      raw_fields: "lot; grade; OD; wall; SDR; length; calibrated net pipe mass; detachable tare; first-release time and decision; unique item/lot IDs; reversal and reinspection links"
      collection_method: "Quality staff and weighing operator reconcile traceable first release to actual accepted specification and calibrated net mass; remove caps/wrapping and exclude destructive samples. Record raw positive first releases and true reversals only, separately from warehouse/dispatch quantities. No division in collection."
      unit: "kg; m"
      frequency: "each actual first-release/reversal event"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "quality release gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; acceptance reports; unique release history"
    - protocol_id: cp_materials
      process_id: "pipe_manufacture"
      flow_role: "black_compound"
      record_type: "whole_formulation_records"
      raw_fields: "row_id; supplier; complete grade/formulation; batch; receipt/issue/return mass; free/adhering moisture; carrier water; independently demonstrated structural/crystalline water; actual reaction-water evidence; polymer and carbon-black assays; carbon and relevant element basis; retained carrier; source cohort"
      collection_method: "Weigh and reconcile real whole-compound procurement/consumption, invoices and grade certificates, sampling supplied state and constituent fractions independently. Do not book ingredient assays as purchases or use a supplier typical property as site measurement. Preserve raw masses and composition without division."
      unit: "kg; mass fraction"
      frequency: "each lot and changed supply"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "receipt through extrusion and internal reuse"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier certificates; scale calibration; independent composition/moisture evidence"
    - protocol_id: cp_energy
      process_id: "pipe_manufacture"
      flow_role: "line_electricity"
      record_type: "stage_meter_records"
      raw_fields: "meter ID; parent/submeter; supply country; voltage; provider boundary; start/end kWh; timestamp; stage; load and operating state; failure/idle/start-stop; served cohort"
      collection_method: "Energy engineer reads calibrated interval meters and actual electric drying/heating/motors/chiller/tests; inventory actual dedicated and shared utilities. Reconcile meter hierarchy and any separately modelled compressed-air/cooling supply. Retain complete raw kWh, including unsuccessful operation, without normalization."
      unit: "kWh"
      frequency: "each meter interval and operating-state change"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "all actual production auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; overlap proof; supply contract; operation logs"
    - protocol_id: cp_water
      process_id: "pipe_manufacture"
      flow_role: "makeup_water; external_chilled_water; warm_water_return"
      record_type: "water_and_heat_records"
      raw_fields: "row_id; utility owner; source/treatment; supply/return mass or volume; density; temperature; pressure; enthalpy; water/energy agreement; tank stock; internal recirculation; evaporation evidence; contamination; receiver"
      collection_method: "Water engineer meters each actual external water supply/outlet and stocks; independently measure water state/density and evaporation or humidity where used. Retain gross loop supply and actual return separately; no double counting internal circulation, no arbitrary return credit and no water-density substitution for another fluid. Keep raw quantities, not per-unit amounts."
      unit: "kg; m3; kg/m3; degC; kPa; kJ/kg"
      frequency: "each meter interval and representative state sample"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "cooling/testing and actual utility-water crossings"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; water assays; thermal records; supplier accounting agreement"
    - protocol_id: cp_maintenance
      process_id: "pipe_manufacture"
      flow_role: "screen_mesh; mineral_lubricant; cotton_cloth"
      record_type: "consumable_records"
      raw_fields: "row_id; material/formulation; received/issued/returned mass; clean and contaminated mass; stock; replacement cause; alloy; polymer loading; lubricant composition; reused article history; actual cleaner identity"
      collection_method: "Maintenance staff weigh each physical consumable and actual contaminated output, reconcile inventories and service/reuse records; lab separates composition subledgers without double procurement. Record any real unlisted cleaner/oil as its own supply, never a generic maintenance total. Retain raw quantities without division."
      unit: "kg"
      frequency: "each receipt/use/replacement"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "actual maintenance and cleaning stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "receipts; formulation/alloy evidence; scale/tare records; receiver history"
    - protocol_id: cp_air
      process_id: "pipe_manufacture"
      flow_role: "compressed_air"
      record_type: "utility_air_records"
      raw_fields: "provider; compressor model/boundary; gross integrated volume or actual rate; duration; T; P; humidity; dry/wet basis; measured species fractions; mass/density; upstream electricity; condensate; purge/leak; receiving point"
      collection_method: "Utility operator measures actual supplied/exhausted air and matched compressor/dryer records. Match actual T/P/composition and distinguish cumulative volume from rate before conversion. No default air mixture or electricity factor. Every actual condensate and species destination remains traceable in its own ledger/card; preserve raw values without division."
      unit: "kg; m3; m3/h; h; kPa; degC"
      frequency: "each actual supply interval and state"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "actual utility supply and pellet handling"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; composition/humidity report; compressor inventory; overlap reconciliation"
    - protocol_id: cp_outputs
      process_id: "pipe_manufacture"
      flow_role: "downgraded_pipe; sold_regrind"
      record_type: "secondary_output_records"
      raw_fields: "row_id; lot; actual quality/form; wet/dry mass; contamination; first/previous release status; buyer or receiver; actual function; exit gate; date; contemporaneous value; further conditioning transport and packing"
      collection_method: "Output custodian weighs the actual separately specified usable outputs and verifies function/state with independent receipt/contract evidence. Retain unsold stocks, rejected secondary goods and treatment destinations separately. Economic evidence is for genuinely residual allocation only; collect physical raw totals unchanged."
      unit: "kg; actual currency"
      frequency: "each actual output/stock movement"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "actual joint-process exit and subsequent steps distinguished"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; supply/receiver specification; contemporaneous price provenance"
    - protocol_id: cp_waste
      process_id: "pipe_manufacture"
      flow_role: "purge_waste; rejected_pipe_waste; saw_chip_waste; spent_screen; used_oil; spent_cloth; cooling_bleed; test_effluent"
      record_type: "atomic_waste_records"
      raw_fields: "row_id; lot/source stage; raw wet/gross mass; tare; stock; water/solids; polymer carbon-black steel oil fractions; captured dust separately; receiver and treatment; return/reuse links; uncertainty"
      collection_method: "Waste custodian and laboratory identify/weigh each actual stream and independently assay relevant water/material/element fractions. Retain receiver manifests and actual treatment acceptance. Never bind untreated factory waste to cleaned recycling-plant feed or infer an emission from waste carbon/COD alone. Collect raw quantities before allocation and normalization."
      unit: "kg; m3; kg/m3; mass fraction"
      frequency: "each waste movement and representative composition sample"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "all actual treatment-bound streams"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; lab report; waste manifests; destination contract"
    - protocol_id: cp_emissions
      process_id: "pipe_manufacture"
      flow_role: "water_vapour; compound_dust; nitrogen_air; oxygen_air; argon_air; carbon_dioxide_air"
      record_type: "species_and_particle_records"
      raw_fields: "row_id; species/CAS or particle structure; stage; intake/outlet receiver; gross and net quantity; concentration; integrated volume or flow rate; duration; T; P; humidity; dry/wet and compound/carbon basis; controls; blank; detection limit; recovery; uncertainty"
      collection_method: "Competent laboratory selects validated analyte/particle-appropriate methods and representative receipt/extrusion/cooling/cutting/cleaning/idle/failure states. Independently identify actual species and post-control/fugitive paths; no source emission factor or generic VOC-to-species mass. Preserve paired carrier intakes/outlets and actual H2O, carbon and particulate assays; nondetect is an interval with method uncertainty, not an automatic zero. Retain raw fields; no pre-division."
      unit: "kg; kg/m3; m3; m3/h; h; mass fraction"
      frequency: "representative operating-state intervals and every changed material/control"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "all actual exhaust/fugitive and intake paths"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full method validation; lab results; calibration; sample recovery; uncertainty"
    - protocol_id: cp_stocks
      process_id: "pipe_manufacture"
      flow_role: "all physical and inherited-vector ledgers"
      record_type: "cohort_stock_records"
      raw_fields: "cohort; row_id; raw/WIP/FG/utility state; opening/closing quantity; composition; completion stage; prior release; full inherited same-flow vector; internal transfer; rework; external return; original dispatch/reversal; loss; gross shipment each_disjoint_nonraw_nonWIP_stock; physical_open_close_quantity_composition; every_inherited_exchange_vector; current_external_receipts; actual_issues_returns_losses; evidenced_service_and_remaining_potential; no_overlap_with_raw_WIP_FG_or_packaging"
      collection_method: "Stock controller links calibrated counts/masses and historical exchange vectors to each cohort at each gate, including raw stock, WIP, FG and actual tanks. Retain equal physical transfer links and the complete vector per exchange, not an impact score or assumed current-period recipe. Isolate old-FG incremental rework/service and first-release reversal history. No division in collection. For each separately held utility/fluid/oil/installed store reconcile opening inherited vector + new external receipt/service burden - closing evidenced remaining vector - true unconsumed outward transfers once before attribution; keep losses and real supplied service burden, and never double an internal issue, prior assigned FG history or a raw/WIP/package correction. Preserve material-specific physical ledgers independently of these burden vectors."
      unit: "kg; original exchange units"
      frequency: "period opening/closing and every linked transfer"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "manufacturing FG and consolidated gates"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "historical vectors; transfer/reversal audit; stocktake; calibration"
    - protocol_id: cp_service
      process_id: "pipe_service"
      flow_role: "fg_in; fg_return; fg_rework_return; gross_pipe_dispatch; fg_to_rework; service_pipe_waste; service_electricity"
      record_type: "post_release_service_records"
      raw_fields: "lot/cohort; original release date/Q; service time horizon; opening/closing FG; gross shipment; customer return; served volume/area/load and time; warehouse/packing/loading meter; prior carried vector; actual incremental rework/service actual_bare_pipe_handoff_return_dispatch_loss_quantities; paired_rework_links; mutually_exclusive_physical_destinations; original_Q_and_full_inherited_vector; permitted_configuration_and_acceptance; actual_added_removed_material_water_species_rows"
      collection_method: "Warehouse/energy staff meter actual services by served lot and collect causally determining driver evidence. Retain old-FG histories; separate incomplete period-end service from actually completed dispatch service. Transfers, shipping/retests and returns do not create first Q. Raw service and vector entries remain separate from production with no division. Weigh each bare-pipe movement and actual loss at its real state; pair internal Q and both rework handoffs, separate external physical returns from original dispatch reversals, and retain each original cohort Q/history. Any actual added material/water/cleaner or removed stream in rework must first have its own concrete atomic card/protocol and measured destination. Only actual compatible permitted rework and acceptance apply; no assumed repair success or extension of life."
      unit: "kWh; actual service driver units"
      frequency: "each service interval and stock/dispatch/return event"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "packing warehouse handling and actual factory loading"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; time/load evidence; shipment/return links; historical vector"
    - protocol_id: cp_packaging
      process_id: "pipe_service"
      flow_role: "pp_strap; wood_bearer; hdpe_cap; pe_wrap; kraft_tag; component-specific waste Every named acquisition, usable-return receipt, gross carriage, separate outward-return and waste event for each listed form is collected separately."
      record_type: "individual_component_stock_records"
      raw_fields: "row_id; component ID/composition; owner; tare; moisture/contamination; opening empty attached-WIP attached-FG reusable stocks; new purchases; external returns received; closing same stocks; gross-shipment carryout; external empty returns outward; waste; internal reuse; acquisition/service burden vector"
      collection_method: "Packing staff identify and weigh each actual packaging component independently and reconcile the complete per-component stock equation in calculation rules. Every stock piece occupies one mutually exclusive location/state. Retain actual reuse/repair history; issue/return is not purchase/credit. Detachable caps, film, straps, wood and tags remain outside bare pipe Q; any real additional component needs its own card. Retain raw totals without division. Each named purchase row records only new external acquisition; returned articles received, gross shipment carriage and separate outward returns use distinct rows with mutually exclusive events. Physical return/transfer does not purchase the article again; inherited acquisition/service vectors are tracked separately from physical mass. Each actual inbound resin/consumable package form must likewise be specifically identified and receive its own actual direction cards before quantitative use, even if upstream already includes its burden. Actual packaging repair or water gain/loss needs separately named actual material/phase rows and independent measurements; never hold wet tare constant by assumption."
      unit: "kg; actual measured counts with tare"
      frequency: "each component movement and period stocktake"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "empty attached WIP/FG reusable and external movements"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "component specification; measured tare; stock balance; actual reuse/return receipts"
    - protocol_id: cp_quality
      process_id: "pipe_manufacture"
      flow_role: "product and actual test samples"
      record_type: "specification_quality_records"
      raw_fields: "grade certificate; drawing; OD; wall; ovality; length; marking method; defect observations; actual duty/standard edition; material incoming tests; actual sampling and destructive-test mass; acceptance decision; rejects; calibration"
      collection_method: "Quality staff verify actual approved incoming compound, production control and finished product requirements using current applicable product evidence. PPI historical ASTM examples and Borealis typical properties are not blanket certification or a test schedule; no mandatory hydrotest per pipe is invented. Link acceptance and sample disposition to unique release; collect raw records only."
      unit: "actual measured test units; kg"
      frequency: "actual specification-required frequency and every reject"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "incoming through first release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "approved specification; complete test reports; calibration; decision/rejection trace"
    - protocol_id: cp_allocation
      process_id: "pipe_manufacture"
      flow_role: "exchange-specific shared burdens"
      record_type: "allocation_evidence_records"
      raw_fields: "row_id; function/cohort; exclusive stage evidence; shared physical total; determining cause; driver quantity/time; residual reason; common exit condition; actual quantity; contemporaneous price; conditioning/transport/packaging adjustments; uncertainty; conserved vector"
      collection_method: "Method owner first documents direct/virtual subdivision and actual determining physical causality per exchange; only genuinely residual burdens receive same-exit actual-state market-value evidence. Retain the original physical totals and full allocation ledger with sensitivity, no default shares or credits; collection records are raw and undivided."
      unit: "original exchange units; actual driver and currency units"
      frequency: "each changed function/driver/price period"
      temporal_coverage: "One complete matched reporting period with original cohort history where used"
      site_scope: "actual joint unit-process gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "driver measurements; exit-state evidence; price provenance; conservation/sensitivity"
  calculation_rules:
    - id: release_q
      applies_to: "product"
      rule: "Q = sum of measured net bare pipe newly first quality-released for the matched cohort with true linked release reversals; require Q > 0 for reporting. Closing FG is already in Q; never add dispatches, returns, reinspection or stock balances to Q."
      inputs:
        - cp_release
        - cp_quality
      output: "Q"
      source_ids:
        - ppi-pe-manufacturing
        - agru-black-straight-pipe
    - id: physical_gates
      applies_to: "raw physical ledgers"
      rule: "Manufacturing: opening line stocks (raw/WIP/actual utility stocks) + actual external physical inputs + FG transferred to rework = closing line stocks + Q transferred to FG + reworked prior FG returned to FG + actual other product/waste/elementary outputs and external utility returns. FG: opening FG + Q + external returned pipe + prior-FG rework returned = closing FG + gross physical bare-pipe dispatch + FG sent to rework + actual FG loss/waste. Consolidated: cancel Q and both rework handoffs; opening line+FG stocks + external physical inputs + external returned pipe = closing line+FG stocks + gross physical bare-pipe dispatch + other external outputs. Include actual carrier gas/water gross masses in physical gates; this consolidated equation is the pipe/manufacturing-material-and-utility ledger, excluding the separately balanced packaging components. Add every component packaging_balance equation to obtain the complete material/utility-plus-packaging external physical gate; cancel internal attachment/reuse transfers, and include each actual packaging receipt, stock, gross-shipment carryout, outward return and waste once. Apply independent total wet/dry-material and carbon/relevant-element subbalances using real measured fractions, retaining uncertainty; never fit two unknowns to one residual."
      inputs:
        - cp_stocks
        - cp_release
        - cp_materials
        - cp_water
        - cp_air
        - cp_waste
        - cp_emissions
      output: "raw physical and constituent ledgers"
      source_ids:
        - ilcd-allocation-2010
    - id: cohort_vectors
      applies_to: "all inventory rows"
      rule: "Construct raw A_i for the first-release production cohort from its actual attributable exchanges + inherited same-exchange burdens of consumed opening raw stock/WIP - complete same-exchange vectors retained in closing raw stock/WIP. Reconcile actual intermediate transfers and apply justified subdivision/allocation to the remaining shared burdens. Keep previously released FG history and its real incremental rework/service with that original cohort, not current new Q. Preserve all failure/start-stop/idle/cleanup burdens and each co-function vector; physical output masses remain unallocated. Service has its own raw vector A_service_i for the actual served cohort/horizon and never subtracts closing FG from first-production Q. Also include opening minus closing UNASSIGNED vectors of the disjoint non-raw/non-WIP utility/fluid/oil/installed stores and actual unconsumed outward transfers defined in cp_stocks. New external receipts enter once before that correction; if actual measured consumption already includes a correction, prove equivalence and do not repeat it. Stock losses retain burden, and remaining service potential requires evidence without a lifetime default. Already assigned prior-FG vectors are carried traces, not repurchased materials or credits. Physical movement cards use actual event mass separately, not this burden allocation as a physical-mass multiplier."
      inputs:
        - cp_stocks
        - cp_materials
        - cp_energy
        - cp_water
        - cp_air
        - cp_waste
        - cp_emissions
        - cp_service
        - cp_packaging
        - cp_allocation
      output: "A_i and separately bounded A_service_i"
      source_ids:
        - ilcd-allocation-2010
    - id: unit_conversion
      applies_to: "all raw numerators"
      rule: "Convert mass prefixes explicitly; for the same electricity boundary raw A_MJ = 3.6 × recorded A_kWh. For a measured liquid volume use A_kg = V_m3 × independently measured rho_kg_per_m3 of that material at its real state; do not assume water density for oil or concentrated formulations. Preserve units, conditions and uncertainty before cohort attribution."
      inputs:
        - cp_energy
        - cp_water
        - cp_maintenance
      output: "converted raw numerators"
      source_ids: []
    - id: species_mass
      applies_to: "each actual species and receiving path"
      rule: "For compatible species-mass concentration c and cumulative exhaust volume V use raw mass = sum(c × V) by operating-state interval; V is already integrated. For a genuine rate F integrate c × F × dt over the matched duration. Match T/P/humidity and compound-versus-carbon basis; species-specific conversion requires actual formula/composition. Keep gross carrier intake/outlet and independently determined process contribution distinct; no fixed air composition, VOC-as-one-species, COD-to-chemical assumption or nondetect-to-zero default."
      inputs:
        - cp_air
        - cp_emissions
      output: "raw species masses and actual contributions"
      source_ids: []
    - id: packaging_balance
      applies_to: "each actual packaging component"
      rule: "For each component independently: opening empty + opening attached-WIP + opening attached-FG + opening reusable stock + new purchases + external returns received = closing empty + closing attached-WIP + closing attached-FG + closing reusable stock + carryout on gross physical shipments + external returns outward + actual waste. Locations/states are mutually exclusive; internal reuse/reattachment cancels. Verify composition/tare/moisture separately. Preserve real acquisition and carried service vectors; returns are not new purchases or credits and packaging never enters bare-pipe Q."
      inputs:
        - cp_packaging
        - cp_stocks
        - cp_service
      output: "component-specific conserved physical and burden ledgers"
      source_ids:
        - ilcd-allocation-2010
    - id: service_history
      applies_to: "pipe_service"
      rule: "Record actual post-release service by original production cohort and observation horizon; retain inherited FG vector, real return/reversal of its original shipment record and actual incremental inspection/rework/packing/handling. No shipping or reinspection creates new Q. A service subtotal for a prior cohort keeps that cohort denominator if known; missing original Q/vector makes that subtotal incomplete, not assignable to current Q. Disclose separately whether each cohort service is observed-to-period-end or complete-to-actual-dispatch."
      inputs:
        - cp_service
        - cp_stocks
        - cp_packaging
      output: "separate cohort service history"
      source_ids:
        - ilcd-allocation-2010
    - id: report_once
      applies_to: "all non-reference exchanges"
      rule: "x_i = A_i / Q; A_i is the complete converted and attributed raw numerator in the specific row unit and selected production cohort, Q is that cohort newly first quality-released bare pipe mass in kg. Execute this division exactly once after stock-vector reconciliation and justified allocation. Reference output is 1 kg; collection protocols retain undivided raw fields. A separately reported matched-cohort service amount uses this same one rule on its separate raw service numerator and original cohort Q; do not divide x_i again or pool old-cohort service with current Q. Q = 0 retains real loads with no unit result. For the separately identified physical handoff, return, gross dispatch and packaging acquisition/exit rows, A_i is that actual event quantity for the tracked cohort, not an allocated burden vector or repeated supplier purchase. Keep inherited upstream/service vectors separately, cancel internal pairs and never add these gross reconciliation views to the net reference product again."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "x_i"
      source_ids:
        - ilcd-allocation-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_route
      applies_to: "all rows"
      requirement: "Confirm actual compound grade/whole supply, single annular wall, straight/plain-end form, non-crosslinked state, electric extrusion/vacuum cooling and indent marking; document excluded-route checks."
      evidence: "Approved product/material specification and stage records"
    - id: dq_raw
      applies_to: "all rows"
      requirement: "Use actual complete site/period/cohort records, calibration, sampling representativeness and uncertainty; preserve failed and zero-output periods and every missing value explicitly."
      evidence: "Raw protocols with original units and logs"
    - id: dq_native
      applies_to: "all UUID rows"
      requirement: "Verify full native basename/synonyms/comment/CAS, fixed route/form/geography/medium/type and all properties plus exact referenced property/unit-group chain. Identity does not prove grade/provider compatibility or a quantified background inventory. Retain anomaly and unresolved restrictions with the data package."
      evidence: "Exact native originals and actual provider supply specification"
    - id: dq_balance
      applies_to: "all physical gates"
      requirement: "Independently close material water relevant elements and individual packaging balances before burden allocation; do not use one residual for reaction water and volatile mass or use TOC/COD/VOC as a named compound mass."
      evidence: "Independent assays and uncertainty-aware gross physical ledgers"
    - id: dq_vectors
      applies_to: "stock rework and services"
      requirement: "Carry each exchange vector with original raw/WIP/FG cohort and completion state; reconcile internal transfers, prior shipment reversals and only real incremental rework. Unknown historical vectors cannot be approximated as current recipe without explicit evidence and disclosed uncertainty."
      evidence: "Historical stock/cohort and service records"
    - id: dq_sources
      applies_to: "all cited constraints"
      requirement: "Separate historical general manufacturing guidance, supplier-specific typical data, live product-form evidence and general attributional LCA method. They do not establish one shared contemporary factory, a universal recipe/test regime or approval."
      evidence: "Complete source originals with scope and counterexamples"
    - id: dq_conditional
      applies_to: "each conditional exchange"
      requirement: "Demonstrate actual absence or measure occurrence; actual unlisted supplies/wastes/species require added atomic cards. Missing auxiliary UUID or ordinary provider data remains a disclosed identity/measurement gap and cannot erase a real flow or certify quantitative completeness."
      evidence: "Actual route survey meter/sample records and receiver evidence"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Confirm the section1 product, starting formulation and full manufacturing route, first-release Q and actual duty/acceptance specification. Do not treat all CPC36320 products or mass-only hydraulic equivalence as covered."
    source_ids:
      - ppi-pe-manufacturing
      - borealis-black-pe100-compound
      - agru-black-straight-pipe
      - un-cpc3-notes
  - rule_id: validate_units
    applies_to: "all inventory rows"
    rule: "Check all raw numerator conversions, same physical reference gate, exact selected reference row, finite measurement completeness and single report_once division in both languages. Missing actual conversion or unsupported unknowns remain incomplete rather than passing."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_stocks
    applies_to: "all physical and burden ledgers"
    rule: "Independently reconcile manufacturing, FG and consolidated raw physical gates and every per-exchange inherited burden vector. Q cancels internally at consolidation, closing FG is not extra production, and return/reinspection does not add Q. Retain all failures start-stop idle cleanup and actual rework; no allocated physical mass or fabricated balancing species."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_packaging
    applies_to: "each actual packaging component"
    rule: "Require the full component-specific opening empty/attached-WIP/attached-FG/reusable plus new purchase plus external return received equation against closing stocks, gross-shipment carryout, outward return and waste. Internal reuse cancels; detachable packaging is outside Q and is not a default co-product or credit."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_species
    applies_to: "all actual air water and waste paths"
    rule: "Use species-/particle-appropriate validated methods, receiver/compartment identity, gross carrier and net-generation distinction, independent water/element evidence and detection-limit uncertainty. No residual-fitting two unknowns, integrated-volume times duration, density from native secondary properties or VOC/COD-as-species shortcut. Unknown real species blocks completeness of that data package."
    source_ids:
      - ppi-pe-manufacturing
      - borealis-black-pe100-compound
  - rule_id: validate_native
    applies_to: "all UUID rows"
    rule: "Verify native identity against the full qualified physical role and actual provider. Enforce CN below-1kV consumption-mix restriction for adopted electricity and treated-water restriction for water; generic pipe/mesh/PE-film references do not establish grade, geometry, pressure, alloy, LDPE stretch function or provider. Disclose the isolated PE-film luggage classification anomaly without substituting PET or a different particle/route/CAS."
    source_ids:
      - ppi-pe-manufacturing
  - rule_id: validate_allocation
    applies_to: "all allocated exchanges"
    rule: "Check dedicated/virtual subdivision then exchange-specific determining physical causality, then only truly residual same-exit actual-state contemporaneous value. Preserve 100-percent burden-vector conservation and separately disclosed service history; no free physical/economic choice, fixed share or automatic recycling credit."
    source_ids:
      - ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_process_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacture of the specified qualified PE100 straight pipe at first quality release with compatible complete-compound background; separately bounded actual cohort packing/storage/dispatch services"
  excluded_use: "Whole CPC36320 coverage; fitting manufacture; installation/use/end-of-life claims; net-delivery denominator; pressure/service-life equivalence; complete-to-dispatch claim for unshipped stock"
  required_metadata: "All reference qualifiers; site and period; first-release and service horizons; whole formulation; actual measured route and all exchanges; full stock vectors and raw gates; provider/utility agreements; justified allocation and actual packaging histories"
  required_quality_disclosure: "State scientific-review and translation status truthfully; disclose unresolved auxiliary identities/provider data and missing site measurements separately from a real product/method gap. An authored method is not a complete measured factory inventory; missing vectors/species or unsupported measurements prevent quantitative completeness. No mapping/publication approval follows from engineering checks."
  update_trigger: "Changed compound supply/grade formulation wall/marking route geometry duty gate service horizon utility source actual species treatment recycling convention allocation or controlling source evidence"
data_sources:
  - id: "ppi-pe-manufacturing"
    type: "handbook"
    reference: "Plastics Pipe Institute. Handbook of Polyethylene Pipe, second edition 2008, Chapter4, full publisher PDF pp.105–123; visible pp.106–108 and110–115 and121–123. https://www.plasticpipe.org/common/Uploaded%20files/1-PPI/Manuals-Design%20Guides/Handbook%20of%20PE%20Pipe/SECOND_EDITION_HANDBOOK_OF_PE_PIPE_2008/Chapter_4__-_PE_Pipe_and_Fittings_Manufacturing/Chapter%204%20-%20PE%20Pipe%20and%20Fittings%20Manufacturing.pdf"
    used_for: "Physical extrusion/sizing/cooling/marking/cutting/handling and QA structure; natural-resin blending, coiling, profile wall and fittings as counterexamples. Historical general method only; no numeric defaults or LCA allocation. Visible original controls over hidden overlapping PDF text."
  - id: "borealis-black-pe100-compound"
    type: "handbook"
    reference: "Borealis. BorSafe HE3490-LS-H Product Data Sheet, 11.07.2023 Ed.4, complete pp.1–3. https://www.borealisgroup.com/download?ids=141974"
    used_for: "Complete black stabilized HDPE compound pellets for pipe extrusion; grade-specific processing/storage cautions and typical-property disclaimer. No actual plant recipe, density, range, emission factor or shared AGRU supply claim."
  - id: "agru-black-straight-pipe"
    type: "handbook"
    reference: "AGRU. AGRULINE PE100/PE100-RC Piping System, Pipes, code705, Pipe5m extruded PE100-RC black, complete four-page manufacturer export dated2026-10-16. https://www.agru.at/en/products/agruline/product-catalogue?cHash=d39ed544c060fcc498a262adfd397325&tx_agruproducts_products%5Baction%5D=exportBtm&tx_agruproducts_products%5Bcatid%5D=05_05_06_006&tx_agruproducts_products%5Bcontroller%5D=Product"
    used_for: "Real straight supplied pipe and solid annular-wall endpoint, with ventilation/SDR distinctions. Unlabelled Weight unit is not used; no pressure/recipe/marking/packaging factor or Borealis-grade linkage inferred."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "European Commission JRC. ILCD Handbook, General guide for LCA, Detailed guidance, first edition March2010, complete sections7.9.2–7.9.3, PDF pp.275–292 (printed255–272). https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional allocation context, subdivision/virtual subdivision, exchange-specific determining physical causality then residual actual-process-exit market values and inventory conservation. Cohort/gate/packaging equations are this PCR operational collection rules, not quoted industrial rules. No recycling-loop formula or full-program conformity imported."
  - id: "un-cpc3-notes"
    type: "official_guidance"
    reference: "UN Statistics Division. CPC Version3.0 Explanatory Notes, 30June2025, original pp.176–179 and repository raw Structure CSV, codes36230/36310/36320/36330/36950/36990. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Original classification titles and adjacent residual categories only; no manufacturing method, scientific approval, whole-leaf applicability or accepted mapping evidence."
