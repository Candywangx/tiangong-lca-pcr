          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| validate_scope | reference product | Confirm the section1 product, starting formulation and full manufacturing route, first-release Q and actual duty/acceptance specification. Do not treat all CPC36320 products or mass-only hydraulic equivalence as covered. | ppi-pe-manufacturing; borealis-black-pe100-compound; agru-black-straight-pipe; un-cpc3-notes |\n| validate_units | all inventory rows | Check all raw numerator conversions, same physical reference gate, exact selected reference row, finite measurement completeness and single report_once division in both languages. Missing actual conversion or unsupported unknowns remain incomplete rather than passing. | ilcd-allocation-2010 |\n| validate_stocks | all physical and burden ledgers | Independently reconcile manufacturing, FG and consolidated raw physical gates and every per-exchange inherited burden vector. Q cancels internally at consolidation, closing FG is not extra production, and return/reinspection does not add Q. Retain all failures start-stop idle cleanup and actual rework; no allocated physical mass or fabricated balancing species. | ilcd-allocation-2010 |\n| validate_packaging | each actual packaging component | Require the full component-specific opening empty/attached-WIP/attached-FG/reusable plus new purchase plus external return received equation against closing stocks, gross-shipment carryout, outward return and waste. Internal reuse cancels; detachable packaging is outside Q and is not a default co-product or credit. | ilcd-allocation-2010 |\n| validate_species | all actual air water and waste paths | Use species-/particle-appropriate validated methods, receiver/compartment identity, gross carrier and net-generation distinction, independent water/element evidence and detection-limit uncertainty. No residual-fitting two unknowns, integrated-volume times duration, density from native secondary properties or VOC/COD-as-species shortcut. Unknown real species blocks completeness of that data package. | ppi-pe-manufacturing; borealis-black-pe100-compound |\n| validate_native | all UUID rows | Verify native identity against the full qualified physical role and actual provider. Enforce CN below-1kV consumption-mix restriction for adopted electricity and treated-water restriction for water; generic pipe/mesh/PE-film references do not establish grade, geometry, pressure, alloy, LDPE stretch function or provider. Disclose the isolated PE-film luggage classification anomaly without substituting PET or a different particle/route/CAS. | ppi-pe-manufacturing |\n| validate_allocation | all allocated exchanges | Check dedicated/virtual subdivision then exchange-specific determining physical causality, then only truly residual same-exit actual-state contemporaneous value. Preserve 100-percent burden-vector conservation and separately disclosed service history; no free physical/economic choice, fixed share or automatic recycling credit. | ilcd-allocation-2010 |\n| validate_asset_manufacture_conservation | existing capital/reusable manufacture attribution | For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness. |  |\n\n"
