          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| allocation_context | all inventory rows | This is attributional manufacturing inventory for the declared decision context when allocation is required. Apply ILCD sections7.9.2/7.9.3 within their situation limitations: establish why applicable subdivision/virtual subdivision and where relevant substitution/system expansion do not avoid allocation. No free choice between allocation/substitution, consequential claim or whole ILCD/PEF compliance is made. | ilcd-allocation-2010 |\n| allocation_subdivision | all inventory rows | First assign exclusive measured recipe, equipment, test, rework and packing burdens directly to their lot/function; subdivide or virtually subdivide actual line and service records. Then identify determining physical causality separately for each remaining exchange. Neither equal mass nor a convenient clock share is a universal key. A shared cooling/transport/storage driver must explain actual heat removal, limiting load/volume, occupancy and time as relevant; correlate-only drivers are insufficient. | ilcd-allocation-2010 |\n| allocation_residual | only genuinely residual shared burdens | Only where no determining physical causal relation remains identifiable use the relative contemporaneous market value of real co-functions at the same joint unit-process exit, in their actual quantity, quality and conditioning. Document gate, price source/period, grade, moisture, transport/packaging/conditioning adjustments and uncertainty/sensitivity. Do not apply retail delivered prices to untreated purge, allocate direct-assigned flows again, use fixed shares or multiply physical outputs by burden fractions. | ilcd-allocation-2010 |\n| allocation_recycle | returns and secondary outputs | Distinguish actual usable downgraded pipe, supplied regrind, waste sent to treatment, external utility return and customer return by their physical function and real destination/value. Internal same-material reuse retains inherited burdens plus measured effort/loss; it has no new purchase/output or automatic avoided-production credit. External recycling/end-of-life allocation needs its own justified consistent convention and any required additional evidence; this PCR imports no ILCD recycling-loop formula or fixed recycled-content factor. | ilcd-allocation-2010 |\n| allocation_conservation | all burden vectors | For each exchange the sum of burdens assigned to all real functions/cohorts and retained stocks equals the pre-allocation inventory. Keep first-production history, transferred WIP, existing FG and actual incremental rework/service distinct. Empty reusable packaging is not a new co-function; allocate only its actual acquisition/reconditioning/service with a documented conserved history. | ilcd-allocation-2010 |\n| asset_manufacture_conservation | existing capital/reusable manufacture attribution | Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. |  |\n\n"
