          markdown: "# Extruded black PE100 solid-wall straight pipe from purchased compound\n\nAll normative rules below apply only to the declared complete-compound PE100 solid-wall straight-pipe route. The reference gate is unique first quality release; onward services keep their own cohort/horizon and cannot create production. Actual measured physical ledgers and inherited per-exchange burdens remain distinct.\n\n"
    - unit_id: "normative_108576"
