allocation_rules:
  - rule_id: allocation_direct
    applies_to: "seal_line"
    rule: "Use submetering and actual batch/cycle records to separate this SKU and direct flows first, including warm-up, idle, rejects, extraction and cooling. If remaining shared burdens require allocation, test determining physical causality with measured press time/state/energy relationships; identical mass alone does not prove causality. Only the causally inseparable remainder may use documented market-value allocation under the attributional ILCD hierarchy, with all affected outputs, prices, period and sensitivity. No arbitrary physical/economic choice or fixed share."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: allocation_physical
    applies_to: "all exchanges"
    rule: "Keep full physical mass/water/carbon/constituent ledgers and separately record the attributed environmental-burden ledger. Allocation never scales an actual coproduct, waste, water or internal transfer amount in the physical process map. Saleable off-grade output requires an additional real product row, its actual gate/value and a justified allocation decision; disposal scrap receives no automatic substitution credit. Rework inside the line retains energy and material burdens."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "Within the applicable allocation decision context, original manufacture burden attributed across uses of actual capital equipment or reusable articles already included in foreground production, packaging or observed services uses one persistent same-asset ledger across all crops, products, cohorts, manufacturing/postrelease services, owners and observation periods. D is its supported whole installed service: all realized historical service plus supported remaining service in the same units as actual beneficiary use u; D must be finite and positive. Period capacity, remaining-only capacity, the physical asset/article mass alone, or current-period product Q alone is not D; supported whole-service throughput in mass units may be used when it demonstrates the causal service and matches u. This does not amortize the manufactured reference product over downstream life or change its declared reference gate/Q. The fractions u/D and all previously assigned manufacture shares together must never exceed 1. Changes of window, custody, provider or repair never restart the original manufacture balance. Replacements have distinct identities and only their real new manufacture vectors; actual repair and treatment increments remain separately accounted. Revised capacity evidence requires transparent reconciliation of prior shares and sensitivity, not a fresh ledger. Keep full physical mass and stock movements independent of burden shares. Unknown D, prior shares or beneficiary coverage requires review and no final manufacture-attributed amount; no assumed lifetime, utilization, zero or arbitrary division is permitted. For each existing collection protocol that attributes manufacture of included production, packaging or observed-service assets across uses in this route (excluding amortization of the manufactured reference product itself), additionally retain a durable asset identity, its measured full physical mass and acquisition/installation/retirement stock history, original manufacture burden vector, all historical and current beneficiaries, matched-unit service readings, the evidenced whole installed-service denominator D, supported remaining-service basis and uncertainty, prior assigned shares and remaining original manufacture balance. Carry the ledger across reporting windows and custody/provider changes. Collect actual repair, replacement, recovery and treatment separately; these records do not normalize physical movements or create an additional asset purchase. These are added fields and conservation obligations for the existing applicable protocols, not a new assumed capital inventory."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_release
      process_id: "seal_line"
      flow_role: "product"
      record_type: "release_and_stock"
      raw_fields: "SKU; lot; drawing; NBR grade; cure system; test results; time; newly released net seal mass; tare; opening/closing WIP and FG quantities; return/rework histories; gross/net shipments"
      collection_method: "Quality and weighing staff use calibrated scales, remove packaging tare, reconcile unique release decisions and reversal links. Distinguish new release, reinspection and warehouse transfers; never count the same lot twice. Preserve inherited burdens by cohort in linked upstream records, separately from raw mass. Sum raw newly accepted net masses to obtain Q; retain raw WIP/FG/dispatch ledgers separately. Reporting basis is per 1 kg reference flow; no division during collection."
      unit: "kg"
      frequency: "each release and stock movement"
      temporal_coverage: "one complete matched reporting period"
      site_scope: "factory release gate and linked WIP/FG stores"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; lot release and reversal trace; balance closure"
    - protocol_id: cp_material
      process_id: "seal_line"
      flow_role: "compound; uncured_scrap; cured_scrap"
      record_type: "material_and_waste"
      raw_fields: "row_id; lot; supplier; full formulation and NBR fraction; measured carbon content and dry/wet basis by constituent; sulfur/accelerators; filler/oil; moisture; carrier; net delivered/returned mass; opening/closing raw/WIP stock; internal preform returns; cured scrap; receiver"
      collection_method: "Material custodian and lab weigh each concrete supply and waste separately. Reconcile invoice, batch issue, formulation certificate, reuse/contamination state and waste acceptance. Record raw stage links with equal transfer mass; internal reuse has no second purchase. Preserve raw masses by row/lot and stock changes, without division. Reporting basis is per 1 kg reference flow."
      unit: "kg"
      frequency: "each receipt/issue/waste movement"
      temporal_coverage: "same period and cohort as cp_release"
      site_scope: "receipt through quality release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; composition tests; receipts; receiver records"
    - protocol_id: cp_energy
      process_id: "seal_line"
      flow_role: "electricity"
      record_type: "meter_records"
      raw_fields: "meter_id; voltage; supply location; provider boundary; start/end kWh; timestamp; press state; cycle count; hot/cold start; idle; rejected cycle; auxiliary share evidence"
      collection_method: "Energy engineer reads calibrated meters/submeters for press heat, hydraulics and all actual auxiliary stages. Separate imported supply from internal electricity distribution; preserve physical meter readings and supplier geography/voltage. Sum compatible raw meter intervals by stage and preserve shared-use evidence; no normalization. Reporting basis is per 1 kg reference flow."
      unit: "kWh"
      frequency: "each shift/batch and meter interval"
      temporal_coverage: "same period and cohort as cp_release"
      site_scope: "production and attributable auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; overlap check; supplier voltage definition"
    - protocol_id: cp_water
      process_id: "seal_line"
      flow_role: "water; cooling_blowdown; water_vapour"
      record_type: "water_balance"
      raw_fields: "row_id; meter; temperature; density; volume/mass; quality; stock; internal circulation; blowdown; measured evaporation basis; additives; receiving operator/medium; sampling uncertainty"
      collection_method: "Water engineer meters external make-up and actual external outlets, records liquid inventory and any material moisture, verifies density and constituent assays. Identify transfers to treatment separately from direct emissions. Unexplained water balance remains a gap. Retain raw water quantities and states separately; exclude recirculation from external demand. No division; reporting basis is per 1 kg reference flow."
      unit: "kg; m3; kg/m3"
      frequency: "each meter interval and representative water test"
      temporal_coverage: "same period and cohort as cp_release"
      site_scope: "actual cooling and external water outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; water assays; receiver contract; balance uncertainty"
    - protocol_id: cp_pack
      process_id: "seal_line"
      flow_role: "film; carton"
      record_type: "packaging_records"
      raw_fields: "row_id; component; supplier; composition; tare; delivered/returned/used mass; damaged packaging; packaging attached to WIP/FG; packaging on gross shipments; release-cohort link"
      collection_method: "Packing staff weigh each actual component and reconcile receipts, stocks, losses and packing on each cohort. Removable packaging is outside seal net mass but its attributable supply/loss burden remains included. Later shipping packaging is explicitly located beyond this production-release gate or brought into a declared extended boundary with separate records. Keep component raw masses, stocks and gross-shipment reconciliation independently; no normalization. Reporting basis is per 1 kg reference flow."
      unit: "kg"
      frequency: "each component delivery and packing batch"
      temporal_coverage: "same period and linked cohort as cp_release"
      site_scope: "packing at release gate and separate downstream ledger"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare tests; purchase specs; stock/dispatch records"
    - protocol_id: cp_air
      process_id: "seal_line"
      flow_role: "acetone_air; cs2_air; actual additional species"
      record_type: "speciated_emission_records"
      raw_fields: "species/CAS; row_id; emission point; medium; recipe/cure; sampling interval; concentration; compound-vs-carbon basis; exhaust volume/flow; T/P; wet/dry basis; detection limit; blanks; calibration; recovery; control state; uncaptured route"
      collection_method: "Environmental engineer and competent laboratory survey actual formulation/cure/auxiliaries, select analyte-appropriate sampling and calibrated standards, and retain measured post-control outlets and justified fugitives separately. Method 18 scope excludes polymeric, polymerizing and very low-vapour-pressure analytes; use validated alternative methods for excluded species/particles. Preserve nondetects and uncertainty; no universal half-detection-limit substitution. Retain raw species concentration, compatible exhaust state/volume and operating-time strata separately. No normalization or duplicate captured/fugitive totals; reporting basis is per 1 kg reference flow."
      unit: "kg/m3; m3; h; kg"
      frequency: "representative cure/cool/idle states and each actual recipe/control change"
      temporal_coverage: "same period and cohort as cp_release"
      site_scope: "all actual stacks and fugitive facility-boundary paths"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "full lab reports; standard recovery; operating-state representativeness; uncertainty"
  calculation_rules:
    - id: release_q
      applies_to: "product"
      rule: "Q = sum of newly quality-released net seal mass, with linked reversal corrections; Q > 0. Do not add opening/closing finished stock or dispatches to Q."
      inputs:
        - cp_release
      output: "Q"
      source_ids:
        - trelleborg-custom-rubber
    - id: period_burdens
      applies_to: "all rows"
      rule: "Construct each raw cohort numerator A_i in its matching exchange unit before normalization; inherited burdens mean the complete same-flow inventory vector embedded in each WIP cohort, not an added scalar impact score: actual attributable period exchanges + inherited burdens of consumed opening WIP - complete burdens carried by closing WIP. Preserve corresponding physical constituent/water balances and internal transfers; do not subtract released FG or multiply physical outputs by allocation shares. Keep prior-released returned FG/rework burdens separately and avoid creating new Q for reinspection. Retain all attributable exchanges from failed or rejected batches, rework, warm-up, idle and zero-output intervals in the complete matched-period cohort numerator; selecting only successful production intervals must not discard these burdens."
      inputs:
        - cp_release
        - cp_material
        - cp_energy
        - cp_water
        - cp_pack
        - cp_air
      output: "A_i"
      source_ids:
        - ilcd-handbook-2010
    - id: physical_balances
      applies_to: "raw physical ledgers"
      rule: "For production material, water and carbon independently: opening raw/WIP stock + actual external inputs + actual incoming rework = closing raw/WIP stock + all actual released physical outputs + actual external waste/emission outputs. Use measured constituent/carbon fractions on compatible wet/dry bases and include residual uncertainty, never force closure into an invented emission. Newly released Q is one released output; prior-released FG rework is segregated with its original cohort and is not new Q. Separate FG ledger: opening FG + new-release receipts + actual FG returns = actual dispatches + closing FG + actual FG losses/rework transfers. Track attached packaging separately. These are physical ledgers before allocation, not scaled burdens."
      inputs:
        - cp_release
        - cp_material
        - cp_water
        - cp_pack
        - cp_air
      output: "reconciled raw ledgers"
      source_ids:
        - ilcd-handbook-2010
    - id: energy_units
      applies_to: "electricity"
      rule: "A_MJ = 3.6 × A_kWh; apply only to electrical energy on the same meter boundary, then include in the raw cohort numerator."
      inputs:
        - cp_energy
      output: "A_MJ"
      source_ids: []
    - id: liquid_mass
      applies_to: "water; cooling_blowdown"
      rule: "A_kg = V_m3 × rho_kg_per_m3 for the actual measured liquid state; retain temperature, quality and uncertainty."
      inputs:
        - cp_water
      output: "A_kg"
      source_ids: []
    - id: air_species
      applies_to: "each measured air species"
      rule: "For compatible species-mass concentration c and exhaust volume V, A_species = sum(c × V) over actual operating-state intervals plus independently measured/justified uncaptured releases. If using volume flow, integrate c × F × dt. Convert lab units explicitly; match T/P/wet-dry state; carbon-equivalent concentration requires species-specific conversion. Do not sum total VOC/TOC and constituent masses."
      inputs:
        - cp_air
      output: "A_species"
      source_ids:
        - epa-method18-2017
        - epa-rubber-2008
    - id: report_once
      applies_to: "all non-reference exchanges"
      rule: "x_i = A_i / Q; A_i is the complete attributed raw cohort numerator in the row unit, Q is the newly quality-released seal mass in kg. Perform this division once only, after unit conversion, WIP burden reconciliation and justified allocation. Reference output is 1 kg; all reported exchange amounts use per 1 kg reference flow. Raw collection protocols perform no division. When Q is not positive, retain the complete raw numerator, stock and operating-period records for review; do not divide, report a zero-burden normalized dataset, or borrow a positive denominator from a different period or cohort."
      inputs:
        - A_i
        - Q
        - cp_release
      output: "x_i"
      source_ids:
        - ilcd-handbook-2010
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: dq_raw
      applies_to: "all exchanges"
      requirement: "Use real site/SKU/supplier measurements, matched time coverage and documented uncertainty; missing values are not defaults or zeros. Collect full formulation and all material/air/water outputs before declaring a complete model."
      evidence: "Raw records linked to cp_release cohort"
    - id: dq_native
      applies_to: "all UUID rows"
      requirement: "Flow identity and compatible quantified background are separate checks. Retain current source/version, full native limitations, medium/property/unit chain, provider geography/voltage/composition and explicit unresolved issues."
      evidence: "Native readback and supplier evidence"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference and all rows"
    rule: "Verify specified NBR/sulfur cure, unbonded geometry, compression/electric route and manual trimming. Resolve each real exchange identity with exact native name/CAS/state/route/medium/property/unit and compatible provider before quantitative use; an auxiliary UUID gap stays explicit. Reject substituted tyre, hard-rubber, bonded, alternate-polymer or wrong-voltage records."
    source_ids:
      - trelleborg-custom-rubber
      - trelleborg-reynosa
  - rule_id: validate_balance
    applies_to: "seal_line"
    rule: "Check Q against unique new releases and net mass; audit raw material/constituent, water, WIP, FG, packaging and dispatch ledgers separately, with uncertainty. Internal links cancel once. Preserve full physical coproduct/waste outputs and distinct burden allocation. Any unclosed balance or missing actual species/provider makes the quantitative data package incomplete, not zero."
    source_ids:
      - ilcd-handbook-2010
  - rule_id: validate_measurement
    applies_to: "all inventory"
    rule: "Require raw records, calibration, composition/provider compatibility, stage coverage, correct unit conversions and single final normalization in both languages. Conditional absence needs route/measurement evidence; nondetection needs detection limits and uncertainty. Do not infer lifecycle approval, functional equivalence or a completed site inventory from this authored method."
    source_ids:
      - epa-method18-2017
      - ilcd-handbook-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_process_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing burdens of the specified route/SKU with provider and measurement completeness disclosed"
  excluded_use: "Whole 36270 coverage, hard rubber, other cure/polymer/forming routes and service-life/functional equivalence claims"
  required_metadata: "Reference qualifiers; factory/period; release gate; stock and cohort links; provider boundaries; all actual flows; justified allocation; unit conversions"
  required_quality_disclosure: "Authored method requires independent scientific review. Foreground measurements and auxiliary identities/providers may remain unavailable; disclose those gaps and do not present an incomplete quantitative dataset as validated."
  update_trigger: "Changed NBR grade/formulation/cure, forming/trim route, supply voltage/provider, release gate, measured species, allocation or original-method evidence"
data_sources:
  - id: "trelleborg-custom-rubber"
    type: "handbook"
    reference: "Trelleborg Sealing Solutions, Optimizing the Production of Custom Rubber Components, undated publisher whitepaper, pp.5 and 9. https://www.trelleborg.com/seals/-/media/tss-media-repository/tss_website/services-and-tools/technical-library/whitepapers/mnr_customrubberpart_whitepaper.pdf"
    used_for: "Compression preforms, heat/pressure and manual tear trimming; alternate routes distinguished. No recipe, quantity or settings defaults."
  - id: "trelleborg-reynosa"
    type: "handbook"
    reference: "Trelleborg Sealing Solutions, Reynosa Manufacturing Capabilities, undated official page snapshot 2026-10-16, Strengths/Products/Materials. https://www.trelleborg.com/de-de/seals/about-us/manufacturing-capabilities/reynosa"
    used_for: "Producer NBR and seal capabilities; one plant, no cross-product recipe or quantitative generalisation."
  - id: "epa-rubber-2008"
    type: "official_guidance"
    reference: "US EPA, DRAFT Final AP-42 Section 4.12 Manufacture of Rubber Products, November 2008, pp.4.12-2, 4.12-9, 4.12-16–17. https://www.epa.gov/sites/default/files/2020-10/documents/d04s12.pdf"
    used_for: "Historical process and measurement limitations, sulfur-containing NBR example only. No recipe, numerical settings, emission factors, generic nondetect rule or tyre spray use adopted."
  - id: "epa-method18-2017"
    type: "official_guidance"
    reference: "US EPA Method 18, Measurement of Gaseous Organic Compound Emissions by Gas Chromatography, Internet text 8/2/2017, sections1–2 and full method. https://www.epa.gov/sites/default/files/2017-08/documents/method_18.pdf"
    used_for: "Analyte-specific identification/calibration and analytical exclusions; historical Internet text is not a claim of current legal compliance. No emission presence or factor established."
  - id: "ilcd-handbook-2010"
    type: "official_guidance"
    reference: "European Commission JRC, ILCD Handbook General guide for LCA – Detailed guidance, First edition March 2010, sections7.9.2–7.9.3, PDF pp.275–277 and 283. https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional subdivision and physical-causality-first allocation hierarchy, transparent inventory accounting. Cohort stock accounting is this PCR operational rule, not an industrial default."
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version3.0 Structure, 30 June2025, code36270. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Structure_30Jun2025.csv"
    used_for: "Broad classification context only; does not create PCR identity or establish accepted coverage."
