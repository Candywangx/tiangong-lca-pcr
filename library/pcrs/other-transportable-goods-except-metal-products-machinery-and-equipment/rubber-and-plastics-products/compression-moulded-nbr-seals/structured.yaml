system_boundary:
  rules:
    - rule_id: boundary_line
      applies_to: "seal_line"
      rule: "Include preparation, electric press heating and hydraulics, all cure/cool-down emissions, cooling, manual trim, inspection, actual packing and quality release. Exclude post-release warehouse/dispatch operations from this production gate while retaining their independent physical and carried-burden ledgers. Keep stage-specific meters and physical links within one integrated process; do not duplicate an intermediate reference product. Add actual maintenance materials, cleaners, release agent, compressed-air imports, refrigerant, transport, waste and additional emitted species as individually measured atomic rows before quantitative use. A named card is not a universal recipe."
      source_ids:
        - trelleborg-custom-rubber
        - epa-rubber-2008
    - rule_id: boundary_stock
      applies_to: "seal_line"
      rule: "Q is newly quality-released net production, never Q plus closing FG. Preserve opening/closing WIP quantities, compositions and complete inherited burdens; subtract closing WIP burdens and carry them forward, include consumed opening-WIP burdens, and include actual cohort rejects/rework. Released FG is an output of this gate even when stored: carry its full burdens in the FG ledger without subtracting it from Q. Dispatching opening FG is not new Q. Keep actual net/gross shipments and removable packaging attached to WIP/FG/shipments in independent physical ledgers; internal links balance equally at both ends."
      source_ids:
        - ilcd-handbook-2010
    - rule_id: boundary_air
      applies_to: "all air rows"
      rule: "Map measured species and receiving compartments individually. These two organic cards are conditional examples, not an exhaustive emission list. Screen the actual supplier formulation, cure system, residual monomers, auxiliaries and controls; record each detected or justified release. Total VOC/TOC is a reconciliation observation, not another additive elementary mass beside its constituents. Determine actual particulate presence; where present add measured disjoint particle-size bins, captured dust waste separately, never nested totals. No on-site combustion is assumed; actual combustion requires a separate fuel/boiler boundary and primary measurement."
      source_ids:
        - epa-rubber-2008
        - epa-method18-2017
boundary_abstraction:
  declared_starting_condition: "Purchased ready-to-cure NBR compound accepted at factory; formulation, cure system, water/solvent and incoming burden identity declared"
  starting_condition_role: "foreground_starting_condition"
  product_classification_scope: "Only moulded NBR seals within 36270; no whole-leaf or hard-rubber claim"
  recursive_input_rule: "Purchased cured seals are inputs with their own full upstream datasets; they cannot be reclassified as uncured compound or new manufacturing output. Internal preforms/WIP are linked transfers, not recursive new supply."
  upstream_dataset_requirement: "Link composition-compatible cradle-to-gate compound, electricity, water and packaging providers plus actual inbound transport. Without provider compatibility the quantitative model remains incomplete; UUID identity alone is insufficient."
  disclosure: "Actual factory, technology, period, cohort, incoming state, cut-offs, missing identities, provider limits and separate WIP/FG/packing/dispatch ledgers"
