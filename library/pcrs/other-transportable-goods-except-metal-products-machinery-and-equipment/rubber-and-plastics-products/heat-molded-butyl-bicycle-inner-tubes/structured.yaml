  production_route: "Ingredient mixing and filtration → extrusion/cooling → splicing/valving → heated-mold cure and inspection → storage/packing/loading"
  market_state: "New, cured, accepted tube with declared valve/fittings; net product mass at net delivery"
functional_unit:
  what: "Provide the air-retaining inner component for a separately supplied bicycle tyre"
  how_much: "1 kg net accepted delivered complete inner tube"
  how_well: "Declared size/wall, valve compatibility, splice integrity and leak-test acceptance"
  how_long_or_cycle: "One manufacturing-to-delivery cycle; no riding-distance or service-life equivalence"
  reference_flow_link: "delivered_tube"
system_boundary:
  rules:
    - rule_id: boundary_manufacture
      applies_to: "all processes"
      rule: "Include material production through linked upstream datasets, inbound transport, all actual onsite ingredient mixing/filtration, extrusion/cooling, splicing/valving, mold curing, inspection, failures, rework, storage, packaging and loading through the declared net-delivery gate. The listed cards are a minimum for the declared route, not permission to omit an actual exchange: add each additional ingredient, supplied formulation, fuel, refrigerant, packaging component, waste or elementary species as a separate card and protocol entry. A conditional row is not_applicable only with evidence of absence; unknown is not zero."
      source_ids:
        - schwalbe-tube-tech-2015
        - innovative-tube-process-2017
        - epa-rubber-process-2008
    - rule_id: boundary_terminal
      applies_to: "all processes"
      rule: "The terminal reference gate is actual net accepted delivery at the manufacturing site after the declared storage, packaging and loading operations, before external outbound transport. Q is the positive net delivered mass of the same product/configuration, route, period and supplied state, excluding packaging and test air. Production release P is a separate ledger quantity. Count each physical delivery once after matched return/cancellation corrections; reinspection or reshipment does not create new production. Undelivered finished goods are excluded from Q and retain their carried burdens."
      source_ids:
        - schwalbe-tube-tech-2015
        - innovative-tube-process-2017
    - rule_id: boundary_internal
      applies_to: "all processes"
      rule: "Match compound_out/compound_in, green_out/green_in and released_tubes/released_in by batch, physical quantity and carried burdens. Cancel each internal handoff once in the consolidated dataset, including internal steam or recovered offcut loops. Opening/closing WIP and finished stock are physical stocks with burden vectors, not purchased intermediates or extra terminal outputs. Returned products retain their identity and prior burdens."
      source_ids: []
    - rule_id: boundary_evidence
      applies_to: "all processes"
      rule: "Schwalbe 2015 supports heat-molded bicycle butyl tubes, filtration, valve bonding and individual inspection. Its seven filters and 24-hour test hold are manufacturer case conditions, not universal defaults. Innovative 2017 supports the separate tube mixing-to-dispatch route; adjacent tyre-only recipe prose is excluded. EPA 2008 is a historical DRAFT generic process account, not a current legal rule or inner-tube factor source; tyre bladder/liner recipes and their factors are not adopted. No universal recipe, cure temperature/time, yield, service life or emission factor is prescribed."
      source_ids:
        - schwalbe-tube-tech-2015
        - innovative-tube-process-2017
        - epa-rubber-process-2008
boundary_abstraction:
  declared_starting_condition: "Separately acquired dry virgin IIR and declared actual ingredients/whole supplied formulations, valve assemblies and utilities at named site"
  starting_condition_role: "Foreground manufacturing with linked upstream production and inbound transport"
  product_classification_scope: "Narrow heat-molded bicycle inner-tube subset of CPC 36114"
  recursive_input_rule: "Purchased complete inner tubes cannot replace onsite production. Returned/reworked tubes retain traced previous burdens without a recursive new-tube purchase; separately declare any true external returned product and its carried burdens."
  upstream_dataset_requirement: "Match each acquired physical form, recipe/supplier, geography, supply state and actual transport; generic identity alone is insufficient provider evidence"
  disclosure: "Declare production/delivery gates, actual utility technology, raw and stock period, tests, packaging, excluded downstream transport/use/end of life and all remaining data/provider gaps"
