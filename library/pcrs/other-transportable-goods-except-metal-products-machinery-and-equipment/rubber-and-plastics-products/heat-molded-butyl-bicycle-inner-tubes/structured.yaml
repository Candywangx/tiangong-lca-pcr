allocation_rules:
  - rule_id: allocation_trace
    applies_to: "all processes"
    rule: "Separate sites, products, valve configurations, routes and periods first. Directly meter or trace batches before allocating shared electricity, steam, ventilation, cooling, warehouse and loading burdens using documented causal machine/occupancy records. Declare the driver, units, scope and conservation of total shared burden. Never divide shared burdens by all-tyre output while the reference cohort is inner tubes."
    source_ids:
      - jrc-ilcd-2010-allocation
  - rule_id: allocation_stock
    applies_to: "all processes"
    rule: "The same-product delivery ledger carries opening WIP/finished-stock burden vectors forward and closing vectors out, with all actual failed/zero-output, return, repeat-test and rework burdens retained. No scrap/recycling substitution credit is automatic. A genuine separately delivered coproduct requires its own mass, destination and justified allocation; internal uncured-rubber reuse is not a coproduct."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_compound
      process_id: "p_compound"
      flow_role: "Atomic exchanges and batch operations"
      record_type: "Foreground raw period ledger"
      raw_fields: "batch IDs; recipe and supplied form; ingredient wet/dry masses; ingredient assay and water subledger; start/end meter readings; runtime; stage handoff IDs and masses; failures and zero-output runs; offcut return and rework; opening/closing WIP and finished lots; carried burden vector; wastes and species results"
      collection_method: "Owner: the named process production engineer, with metrology and quality sign-off. Preserve unnormalized complete raw-period numerators, failed/zero-output runs, return/rework increments and opening/closing carried burden vectors. Reconcile calibrated scales, recipe issue/return records, utility meters and internal handoffs. Preserve timestamps and actual units. Do not execute A_i/Q here."
      unit: "kg; MJ; kWh; m3; h; species-specific kg"
      frequency: "Each batch and meter interval"
      temporal_coverage: "Complete declared period including start-up, shutdown and failures"
      site_scope: "Named site and same tube/configuration/route cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; recipe issue/return sheets; batch genealogy; meter boundaries; stock/burden reconciliation; signed dispositions"
