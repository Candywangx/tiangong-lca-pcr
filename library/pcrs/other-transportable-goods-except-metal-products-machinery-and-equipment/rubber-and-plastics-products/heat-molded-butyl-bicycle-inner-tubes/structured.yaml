      collection_method: "Owner: quality manager. Retain mold-cycle and cooling records and individual visual/leak acceptance, including failed, repeated and destructive tests. Support test conditions from the actual product specification. Record test air as an internal utility balance, not shipped product mass."
      unit: "kg; actual test units"
      frequency: "Each cycle and individual tube test"
      temporal_coverage: "Complete matched period"
      site_scope: "Same declared bicycle tube and valve configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "Test specification; equipment calibration; signed acceptance and reject trail"
  calculation_rules:
    - id: convert_raw
      applies_to: "all inventory rows"
      rule: "Convert each raw quantity into its row unit once before burden attribution. Electricity MJ = measured kWh × 3.6. A rate requires its matched duration; an already integrated gas/liquid volume receives no extra time factor. A volume-to-mass conversion requires independent fluid-specific density at declared state and calibration. Formulation wet mass and assays are not additive procurement."
      inputs:
        - raw_readings
        - calibration
        - supplied_form
      output: "converted_raw"
      source_ids: []
    - id: delivery_attribution
      applies_to: "all inventory rows"
      rule: "For each exchange i, A_i = opening carried WIP/finished-stock burden_i + converted raw-period burden_i + traced incoming return burden_i - closing carried WIP/finished-stock burden_i - separately justified non-reference burden_i. Cancel internal transfers once. Retain all actual failed, zero-output, return, rework, storage, packing and loading increments. Use batch genealogy for stock burden vectors, not just stock mass or an assumed production/delivery ratio; do not add P and closing finished mass as two delivered outputs. The raw-period term contains only newly incurred burdens; the incoming-return term contains prior carried burdens once, excluding new reinspection/rework already recorded in raw-period increments. Reverse the matched prior delivery and restore its traced carried burdens before any redelivery; do not add both the reversal and the same return burden twice. Track actual physical stock balance separately from this burden ledger."
      inputs:
        - converted_raw
        - opening_burden
        - closing_burden
        - return_burden
        - non_reference_burden
        - cp_delivery_gate
      output: "A_i"
      source_ids: []
    - id: normalize_delivery
      applies_to: "all inventory rows"
      rule: "n_i = A_i / Q. Q is strictly positive net accepted delivered tube mass in kg after matched returns/cancellations for the same product, configuration, route, period and supplied state. This is the sole normalization operation, executed once after raw conversion and burden attribution. Amount cards and protocol aggregation refer to this same reporting operation, not subsequent divisions. If Q is zero, retain the unresolved campaign and its burdens without a normalized result."
      inputs:
        - A_i
        - Q
        - cp_delivery_gate
      output: "n_i"
      source_ids: []
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Physical balance uses complete as-supplied masses and independent constituent/element ledgers, including valve/fittings, fillers, moisture, steam/condensate, wastes, measured species and opening/closing stocks. Crosslinking does not justify an invented reaction-water quantity. Determine any actual chemical water formation/consumption from a separate reaction/species evidence chain; evaporation is a separate phase transfer, not fitted reaction water."
      inputs:
        - raw_mass
        - composition
        - opening_stock
        - closing_stock
        - measured_species
      output: "mass_and_element_reconciliation"
      source_ids:
        - epa-rubber-process-2008
  data_quality_requirements:
    - id: quality_identity
      applies_to: "Reference and every native flow"
      requirement: "Retain native names, route, geography, medium, all properties and exact reference-unit chain. The reference family is narrowed by configuration. Carbon-black classification debt does not authorize a different material; the CN medium-voltage electricity identity is supply-limited."
      evidence: "Native identity and supplier specification"
    - id: quality_complete
      applies_to: "All raw and carried burdens"
      requirement: "Cover the full declared period, failures, WIP, finished stocks, returns and rework. Keep independent owners and calibrated evidence; disclose missing quantities, provider matches and significant species without assuming zero."
      evidence: "Signed stock, batch, utility and delivery reconciliation"
    - id: quality_evidence
      applies_to: "Applicability of industrial sources"
      requirement: "Independent manufacturers establish compatible process modules, not a single plant recipe. Actual mass, recipe, energy, cure cycle and acceptance conditions require foreground measurement; document every substituted condition and temporal/geographical limitation."
      evidence: "schwalbe-tube-tech-2015; innovative-tube-process-2017; epa-rubber-process-2008"
validation_rules:
  - rule_id: validate_identity
    applies_to: "all processes"
    rule: "Require the exact reference Product UUID, native Mass/kg chain and terminal link delivered_tube, consistent with both language renderings. Respect all native scope limits in inventory descriptions. Reject the IIR candidate whose fixed route is butadiene/styrene; do not relabel a piece-count flow as mass or infer a density from a secondary property."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "all processes"
    rule: "Check all atomic rows and raw-period batch/meter records, actual recipe and supplied-formulation subledgers, internal handoff cancellation, stocks and burden carryover, positive net delivery Q and normalization exactly once. If Q is zero or attribution remains unresolved, retain records and do not issue a normalized dataset. Do not delete rejected campaigns to improve a ratio."
    source_ids: []
  - rule_id: validate_mass_species
    applies_to: "all processes"
    rule: "Close physical total mass and relevant elemental ledgers separately: actual whole purchased inputs plus opening stocks equal net delivered product, packaging carried out with dispatched goods, other actual external Product outlets, closing stocks, actual waste/recovery and measured releases, with internal transfers canceled. Keep a separate complete packaging physical subledger of actual receipts, exports, losses and opening/closing stocks outside Q; do not add packaging mass to Q or duplicate its procurement. Retain valve metals, fillers, cure-system constituents, supplied carrier water, condensate, moisture and air balances. Identify actual emitted species using independent analysis and time-integrated monitoring. Do not fit unknown reaction water and an unknown outlet to the same residual, assume every dust is carbon black, use COD as a species mass, or manufacture a crosslinking water factor. Investigate unexplained residuals."
    source_ids:
      - epa-rubber-process-2008
  - rule_id: validate_quality
    applies_to: "all processes"
    rule: "Require individual tube acceptance tied to wall/splice/valve integrity, declared leak-test conditions and disposition of rejects, plus actual mold cure and cooling records. Count sampling/destructive inspection burdens. Manufacturer case hold time or filter count cannot be used without applicability evidence. Record missing data and test-method uncertainty explicitly; identity/schema checks do not establish scientific approval."
    source_ids:
      - schwalbe-tube-tech-2015
      - innovative-tube-process-2017
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Upstream supply modelling of the declared tube configuration and net-delivery gate"
  excluded_use: "Full tyre service comparison, all-CPC coverage, use-phase air loss, riding lifetime, or unknown configuration substitution"
  required_metadata: "All required qualifiers; source IDs; raw period; gates; allocation drivers; exact provider and utility matches; recipe/commercial-form identities"
  required_quality_disclosure: "Actual foreground coverage, inventory carryover, missing exchanges/species, native scope/classification debt, evidence applicability and scientific review state"
  update_trigger: "Changed recipe, route, mold/valve configuration, utilities, measured losses, delivery gate, provider identity or source applicability"
data_sources:
  - id: "schwalbe-tube-tech-2015"
    type: "handbook"
    reference: "Schwalbe Technical Information Bicycle Tires, Edition 3, 2015, p.28. https://www.schwalbe.com/media/32/85/58/1694006374/Schwalbe-TechInfo-2015_GB.pdf"
    used_for: "Butyl bicycle inner-tube identity, heat-mold route, filtration, valve bonding and individual inspection; seven-filter/24-hour conditions are manufacturer-specific, not universal."
  - id: "innovative-tube-process-2017"
    type: "literature"
    reference: "Innovative Tyres & Tubes Limited, Prospectus, September 2017, printed pp.157–158 (PDF 158–159), tube process only. https://www.sebi.gov.in/sebi_data/attachdocs/oct-2017/1509101010348.pdf"
    used_for: "Industrial tube mixing, filtering, extrusion/cooling, splicing/valve fitting, mold curing and inspection-to-packing route, distinct from adjacent tyre process; no transfer of tyre-only recipe or a common SKU claim."
  - id: "epa-rubber-process-2008"
    type: "official_guidance"
    reference: "US EPA AP-42, section 4.12 Manufacture of Rubber Products, November 2008 DRAFT Final, pp.4.12-1–2. https://www.epa.gov/sites/default/files/2020-10/documents/d04s12.pdf"
    used_for: "Historical qualitative rubber-compounding stages and additive roles only. No numerical recipe, temperature or emission factor adopted; bladder/liner cases and excluded solvent aids cannot establish an inner-tube factor; a later 2026 draft exists."
  - id: "jrc-ilcd-2010-allocation"
    type: "handbook"
    reference: "European Commission JRC, ILCD Handbook General guide Detailed guidance, first edition March 2010, section 7.9.3, PDF pp277–278 / printed pp257–258; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Attributional direct assignment, virtual subdivision and determining physical causality for actual shared manufacturing/storage/loading service burdens only. No product-specific recipe, quantity, yield, intensity, fixed allocation share, recycling credit or full PEF conformity; stock and normalization rules are PCR-specific consistency reasoning."
