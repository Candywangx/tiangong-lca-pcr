ndividual tube acceptance tied to wall/splice/valve integrity, declared leak-test conditions and disposition of rejects, plus actual mold cure and cooling records. Count sampling/destructive inspection burdens. Manufacturer case hold time or filter count cannot be used without applicability evidence. Record missing data and test-method uncertainty explicitly; identity/schema checks do not establish scientific approval. | `schwalbe-tube-tech-2015`; `innovative-tube-process-2017` |\n\n"
