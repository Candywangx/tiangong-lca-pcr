  identity_decision:
    outcome: "create_semantic_subset"
    basis: "Material semantic scan and excluded PR scopes contain no equivalent heat-molded IIR bicycle inner-tube method. CPC 36114 legacy scaffold is heterogeneous and remains untouched; complete new pneumatic tyres in parallel 36111/36112/36113 are excluded. This record requires distinct tube-wall, end-splice, valve-bond and individual air-retention controls."
