  native_identity_debt:
    - "Reference native Product is the broad manufactured CPC 36114 family with Mass/kg, no geography specified; descriptions restrict both released and delivered cards to the actual heat-molded bicycle tube configuration."
    - "Carbon Black CAS 1333-86-4 has native CPC 37950 graphite-family classification debt; unchanged consistent physical name/CAS/comment accepted, supplier grade and provider remain dataset-specific."
    - "Electricity UUID is restricted to CN, 1–35 kV grid-average consumption mix delivered to user, Energy/MJ. Other actual supplies require a matching identity; measured burdens must remain."
  rejected_native_candidates:
    - uuid: "e5164585-4fbe-4401-928f-d0b6ab9f1286"
      reason: "Butyl/IIR name and comment contradict fixed butadiene/styrene copolymer route; hard route contradiction, not merely classification debt. Not adopted."
    - uuid: "72ed90af-6161-40d0-a8e0-647492c4d365"
      reason: "Native name Archenteron/原肠, embryonic biological identity, incompatible with rubber inner tube; Number of items is not a material mass conversion. Not adopted."
  unresolved_inventory_uuids:
    - "Specific dry IIR grade, recipe chemicals and supplied formulations, valve assembly, internal intermediates, steam, water, packaging, wastes and elementary species retain concrete atomic names without unverified UUIDs. Complete native/provider matching and foreground measurements are required for dataset production; the final reference identity is verified."
  evidence_limits:
    - "Schwalbe 2015 case conditions and Innovative 2017 tube process are independently synthesized, not claimed to be a common SKU or plant; no universal recipe, yield, cycle, lifetime or numeric factor."
    - "EPA November 2008 DRAFT Final used only for qualitative generic process/additive context. No bladder/liner factor or recipe adopted; later October 2026 draft exists."
