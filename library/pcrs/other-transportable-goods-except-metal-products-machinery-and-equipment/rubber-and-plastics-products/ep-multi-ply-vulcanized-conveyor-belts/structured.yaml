system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "belt_supply"
      rule: "Include real onsite mixing or upstream whole-compound supply, warm milling/calender/fabric coating, ply layup/lamination and green checks, sulfur press/end cooling, trim/test samples/real repair/final QC, winding/packing, actual warehousing and factory handling/dispatch. Retain failures, zero-output runs, rework, cleaning and opening/closing WIP burdens. No duplicated bought-compound and ingredient charges."
      source_ids:
        - fenner-belt-making-2023
        - somi-belt-process
        - fenner-rubber-2024
    - rule_id: boundary_delivery
      applies_to: "product"
      rule: "Q is actual unique net factory delivery, not new release P. Keep finished opening/closing stock and exchange-level carried burdens; undelivered stock stays outside Q. Separate production and store/dispatch ledgers and cancel internal P handovers on consolidation, retaining all real storage, packaging, handling and rework. Return/reacceptance never creates new P or duplicate delivered Q."
      source_ids: []
    - rule_id: boundary_downstream
      applies_to: "belt_supply"
      rule: "Receipt does not remove upstream burdens. Customer freight, installation/endless splicing, conveying service, use and end of life require downstream models beyond this open-roll factory gate. Real factory dispatch/loading energy remains inside. No assumed transport-service output or life/equivalence across EP, NN and steelcord."
      source_ids:
        - fenner-superfort
        - somi-belt-process
boundary_abstraction:
  declared_starting_condition: "Actual purchased ingredients or whole uncured compounds, EP fabric and auxiliaries at plant receipt plus opening raw/WIP/finished/packaging stocks and carried burdens"
  starting_condition_role: "Foreground receipt for complete-belt manufacturing/supply, not an upstream zero-burden cutoff"
  product_classification_scope: "Narrow complete EP multi-ply conveyor-belt subset of CPC3.0 36240"
  recursive_input_rule: "Pair internal compounds, coated fabric, green belt, trim and release/warehouse transfers with burdens, without repurchase. External same-category finished belts are not automatic primary-route inputs; independently verify state/route and upstream data, avoiding infinite recursion"
  upstream_dataset_requirement: "Match each actual grade/form/recipe/route, geography, period and utility to compatible provider evidence. Bought complete compounds include upstream mixing; physical native identity alone is not quantitative provider evidence"
  disclosure: "Plant/period, actual EP structure/recipe/cure, supply state, Q/P gate, WIP/finished carry, actual storage/pack/dispatch and all source/native limits"
