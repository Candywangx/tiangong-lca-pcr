      flow_role: "terminal belt, release and stock"
      record_type: "primary records and measurement ledger"
      raw_fields: "site; period; layup; EP polymers and finish; cover/skim recipe; width/thickness/length; roll ID; tare; net mass; new release P; dispatch/acceptance ID; return/reversal/redelivery; Q; opening/closing WIP/finished stocks; exchange-level carried burdens"
      collection_method: "Owner: QC release manager and warehouse custodian jointly. Retain undivided real-period mass and signed release/delivery records. Calibrated net weighing excludes reels/wrap/straps. Pair actual length/area/roll count with the same configuration and net mass; no fixed kg per metre. Determine unique accepted net factory deliveries Q including carried finished stock, keeping new release P separate. A return/reinspection/redelivery links to the original lot and creates neither new P nor duplicate Q. Q must be positive to report."
      unit: "kg; m; m2; roll count"
      frequency: "each event and period reconciliation"
      temporal_coverage: "complete real reporting period and opening/closing cohort links including failures, rework and carried burdens"
      site_scope: "actual plant and factory dispatch gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/dimension calibration; BOM and final QC; dispatch/return chain; physical stock and prior burdens"
    - protocol_id: cp_material
      process_id: "belt_supply"
      flow_role: "each ingredient and whole compound/preparation"
      record_type: "primary records and measurement ledger"
      raw_fields: "material/grade ID; supplier; recipe version; gross/tare/net; assay/moisture/carrier; receipt/issue/return; stage/pass; failed/zero-output runs; WIP opening/closing mass and carried burdens"
      collection_method: "Owner: compounding materials custodian. Retain raw unnormalised period quantities for every purchased grade and every pass including failures, zero-output batches, rejects and rework. Whole supplied compounds/cements/oils/dispersions count once; assayed active/carrier/water are constituent subledgers. Onsite blends use independently acquired ingredients and real blending energy/loss. Pair internal transfers and stocks."
      unit: "kg"
      frequency: "each receipt and batch charge/pass"
      temporal_coverage: "complete real reporting period and opening/closing cohort links including failures, rework and carried burdens"
      site_scope: "receiving, master/final mixing and preparations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "CoA; complete approved batch recipe; calibrated scales; issue/return and transfer records"
    - protocol_id: cp_structure
      process_id: "belt_supply"
      flow_role: "EP fabric, calender, layup and cure"
      record_type: "primary records and measurement ledger"
      raw_fields: "fabric grade; warp/weft polymer; weave/finish; mass/area; width; ply count; top/skim/bottom mass/gauge; cut/trim; green/cured transfer; actual press temperature/pressure/time/tension; test/repair; failed cycles; WIP carry"
      collection_method: "Owner: calender/build engineer and cure/QC custodian. Record undivided actual fabric issues and each layer, paired green/cured transfers and actual cure/test/repair/acceptance record for the same configuration. Retain every failed cycle and WIP burdens. Actual site measurements, not literature settings, provide cure conditions and belt weight."
      unit: "kg; m; m2; recorded process units"
      frequency: "each roll, layup and cure cycle"
      temporal_coverage: "complete real reporting period and opening/closing cohort links including failures, rework and carried burdens"
      site_scope: "fabric receipt, calender/build, cure/end cooling and final finishing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "fabric certificate; layer BOM; scales/dimensions; actual cure charts; destructive and visual QC"
    - protocol_id: cp_utility
      process_id: "belt_supply"
      flow_role: "each utility, fuel and circuit oil"
      record_type: "primary records and measurement ledger"
      raw_fields: "stage/meter ID; interval; integrated reading or rate; supply/return conditions; heating value/enthalpy; mass/volume; makeup/return; circuit stocks; failed/rework activity; warehouse occupancy/handling"
      collection_method: "Owner: plant utilities engineer and warehouse energy custodian. Retain raw period meter deltas, fuel/oil issues and circuit makeup/losses for every stage, failed/zero-output runs and rework, actual storage, packing and dispatch. Keep supplied heat/steam/fuel boundaries and condensate returns. Rate times duration produces a numerator; integrated gas/liquid volume gets no further duration. Record every actual different fuel and refrigerant as a separate exchange; no rated-power substitute."
      unit: "kWh; MJ; kg; m3 with conditions"
      frequency: "each meter interval, refill and return"
      temporal_coverage: "complete real reporting period and opening/closing cohort links including failures, rework and carried burdens"
      site_scope: "all plant stages and actual storage/dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices; enthalpy/heating-value basis; circuit balances; allocation evidence"
    - protocol_id: cp_pack
      process_id: "belt_supply"
      flow_role: "each reel, cloth, film and strap"
      record_type: "primary records and measurement ledger"
      raw_fields: "article/material ID; measured tare; acquired/issued/returned/discarded; opening/closing pool; accompanying Product output; real reuse; damage/loss; cohort links"
      collection_method: "Owner: packing/dispatch custodian. Retain raw actual article mass and movements, separate from belt Q. Record supplier composition and measured article tare. Reusable reels/cloth use actual pools, returns and loss, without assumed uses or metres per roll. Retain all packing/repacking/handling burdens and outward packaging."
      unit: "kg; article count"
      frequency: "each packing, return, loss and stock count"
      temporal_coverage: "complete real reporting period and opening/closing cohort links including failures, rework and carried burdens"
      site_scope: "finishing, packing, warehousing and dispatch"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier composition; tare measurement; pool ledger; dispatch/return/loss record"
    - protocol_id: cp_outlet
      process_id: "belt_supply"
      flow_role: "each physical reject and external outlet"
      record_type: "primary records and measurement ledger"
      raw_fields: "stream/state; composition; wet/dry mass; receiver/treatment; internal return; Product/Waste status; opening/closing stock; samples; failed lots; carried burden"
      collection_method: "Owner: recovery/waste custodian and production stock accountant. Retain raw full-period outward quantities and composition for each actual uncured rubber, EP fabric, green/cured composite, captured dust, wastewater, oil and packaging stream. Separate each destination/grade, pair internal returns and establish true saleable coproducts and their allocation."
      unit: "kg"
      frequency: "each sample, transfer and outward dispatch"
      temporal_coverage: "complete real reporting period and opening/closing cohort links including failures, rework and carried burdens"
      site_scope: "all production, rework and supply outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; manifests; assays; receiver/treatment proof; physical balances"
    - protocol_id: cp_emission
      process_id: "belt_supply"
      flow_role: "each substance and receiving medium"
      record_type: "primary records and measurement ledger"
      raw_fields: "substance/medium; sample window; concentration; matched gas/liquid quantity; wet/dry/reference conditions; capture; actual water phases; independently evidenced reaction water; failed/rework activity"
      collection_method: "Owner: environmental monitoring custodian. Retain raw period measurements and supported species/phase conversions for actual mixing/calendering/curing/cement, onsite energy, rework and storage. Derive each species only from independent measurement/chemistry. Never fit an unknown emission and reaction water to one residual, COD or generic VOC. Captured waste/wastewater transfers are distinct from direct elementary releases."
      unit: "kg; recorded source units"
      frequency: "each supported sample and period integration"
      temporal_coverage: "complete real reporting period and opening/closing cohort links including failures, rework and carried burdens"
      site_scope: "actual release point and receiving medium"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling/lab QA; calibration; gas/liquid conditions; species evidence and independent mass/element closure"
  calculation_rules:
    - id: report_once
      applies_to: "all inventory rows"
      rule: "a_i = A_i / Q. A_i is each undivided atomic numerator uniquely attributed to the same actual supplied product/recipe/route/state cohort after raw conversions, dedicated/shared attribution and opening/closing raw-material, WIP and finished-stock burden adjustments. Q is positive unique accepted net factory-delivered belt kg from cp_delivery. Retain full-period failed/zero-output/rework burdens and opening carried burdens, carry closing undelivered burdens forward, then normalize once. Cards and aggregation_rule denote this same reporting operation. Reference output is Q/Q=1 kg."
      inputs:
        - A_i
        - Q
        - cp_delivery
        - cp_material
        - cp_structure
        - cp_utility
        - cp_pack
        - cp_outlet
        - cp_emission
      output: "a_i"
      source_ids: []
    - id: raw_conversion
      applies_to: "all inventory rows"
      rule: "Convert actual gross/tare/net mass to kg. Length/area/roll count requires paired net belt weighing and exact configuration in cp_delivery/cp_structure, never fixed kg/m or service amount. Material volume requires real same-state density. Rate times duration gives a numerator; integrated gas/liquid volumes get no extra time. Preserve gas conditions/heating value, steam mass/enthalpy and electrical/thermal units before report_once."
      inputs:
        - cp_delivery
        - cp_structure
        - cp_material
        - cp_utility
        - cp_pack
        - cp_outlet
        - cp_emission
      output: "converted raw numerators"
      source_ids: []
    - id: physical_closure
      applies_to: "belt_supply"
      rule: "Independently reconcile physical mass and elements for every control volume: opening stock plus actual external inflows equals closing stock plus all actual external outflows including each Product outlet, utility return, accompanying packaging, waste and elementary species. In production count new release P once; do not add the same cohort closing finished stock again as another production output. Separate finished-store accounting retains opening stock, internal P handover, Q, return/rework, closing stock and carried burdens. Cancel internal transfers on consolidation. Actual species, free/carrier/structural water and independently evidenced chemical water formation/consumption remain distinct. Never fit an unknown outlet and unknown reaction water to one closure residual or COD. Sulfur curing establishes no generic net water yield."
      inputs:
        - cp_delivery
        - cp_material
        - cp_structure
        - cp_utility
        - cp_pack
        - cp_outlet
        - cp_emission
      output: "raw physical mass element and burden ledgers"
      source_ids: []
    - id: whole_inputs
      applies_to: "belt_supply"
      rule: "Whole externally supplied compounds, oils, wet cements and dispersions count as single purchased preparations. Assayed active/polymer/carrier/water fractions reconcile within that mass, without duplicate procurement. Onsite mixing uses actual separately bought ingredients and real energy/losses. Packaging and reusable reel/cloth ledgers retain acquisition, opening/closing stock, accompanying outputs, returns/discard/reuse independent of belt Q."
      inputs:
        - cp_material
        - cp_pack
        - cp_delivery
      output: "nonduplicated preparations and packaging"
      source_ids: []
    - id: asset_manufacture_share
      applies_to: "existing capital/reusable manufacture attribution"
      rule: "For each included original asset manufacture vector B, f_current = u_current / D only after the persistent ledger verifies the supported whole installed-service denominator, all beneficiaries and prior assigned shares. Attribute f_current * B once to the actual beneficiary before the existing single reference normalization. Check prior_shares + all current/new beneficiary shares <= 1; carry the remaining original balance. Capacity revisions reconcile the historical ledger. Full physical asset/packaging mass and actual gross stocks/returns never receive f_current. Unknown D or history leaves the final attributed result unavailable, without suppressing actual repair/replacement/service burdens."
      inputs:
        - asset_id
        - original_B
        - u_current
        - D
        - historical_beneficiaries
        - prior_shares
        - capacity_evidence
      output: "conserved attributed manufacture vector"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "belt_supply"
      requirement: "Verify real multiple EP woven layers, distinct skim, SBR-based two covers and complete sulfur-vulcanized open-roll acceptance. Native broad names prove no EP/NN/steelcord, grade or life equivalence."
      evidence: "fabric/compound supplier records; complete layer BOM; cure/final acceptance"
    - id: quality_period
      applies_to: "all inventory rows"
      requirement: "Complete period inputs/burdens include failures, zero-output batches, rework, WIP and finished-stock carry; Q is actual positive unique net delivery, never P, gross throughput or packed mass."
      evidence: "period/cohort and physical stock reconciliation; return links; exchange-level prior burdens"
    - id: quality_units
      applies_to: "all inventory rows"
      requirement: "Calibrated mass/energy, same-configuration length/area/count conversion, whole preparations and independent physical/species evidence; no default weight, recipe, yield, service quantity, cure condition or reaction water."
      evidence: "calibration; assays; paired net weighing; condition/phase and species evidence"
    - id: quality_projection
      applies_to: "belt_supply"
      requirement: "Preserve every native name component, comment debt, grade/form/route/geography/medium and exact property/unit restriction in consumable context. Both projections retain every raw table/source/protocol/calculation/quality field and full limitations. Schema/ID equality alone is insufficient."
      evidence: "complete direct original; primary sources; raw-to-typed audit; provider evidence"
validation_rules:
  - rule_id: validate_reference
    applies_to: "product"
    rule: "reference_flow_link selects one actual terminal Product output with the declared reference UUID: the independently qualified complete cured EP belt, never compound, green build, fabric or conveying service. Retain exact official Chinese basename and all native limits. Real other outputs retain their physical roles even if sharing UUID."
    source_ids: []
  - rule_id: validate_delivery
    applies_to: "all inventory rows"
    rule: "Verify positive unique net-delivery Q distinct from P, matched product/recipe/route/state/period and measured mass conversion. Reconcile full-period failures/rework, WIP/finished opening/closing masses and burdens, linked returns/reacceptance/redelivery and real storage/packing/handling/dispatch. report_once is the only normalization."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "belt_supply"
    rule: "Check physical_closure and whole_inputs for every actual material/utility/packaging and Product/Waste/elementary outlet. Pair/cancel internal transfers, avoid double purchases and preserve independent water/species evidence without residual fitting. Complete all actual recipe/cure/utility/outlet rows before use."
    source_ids: []
  - rule_id: validate_method
    applies_to: "belt_supply"
    rule: "Enforce bounded EP structure and supply, collection owners, source/native/provider applicability, bilingual full-field retention and declared allocation hierarchy. Core reference/method contradictions block usable guidance; disclose ordinary future measurement/auxiliary UUID gaps without fabricating values. Scientific review is separate."
    source_ids:
      - fenner-belt-making-2023
      - somi-belt-process
      - ilcd-allocation-2010
  - rule_id: validate_asset_manufacture_conservation
    applies_to: "existing capital/reusable manufacture attribution"
    rule: "For every included capital/reusable manufacture attribution verify same-asset continuity, whole installed service in matched units, all historical/current beneficiaries, prior assigned manufacture shares and cumulative share <= 1. Reject a reset by period, cohort, provider, owner or repair. Check distinct real replacement and incremental repair/treatment vectors separately and preserve gross physical mass. A missing denominator, unexplained previous allocation or incomplete beneficiary ledger requires explicit review and an unavailable final attributed amount; structural inspection cannot claim empirical completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Evidence-matched complete EP multi-ply cured open-roll belt supply to downstream installation/use models"
  allowed_use: "Actual structure/compound/supplied state and compatible geography/technology/period/provider, explicit1 kg net factory delivery and packaging boundary"
  excluded_use: "Default substitute for every36240 belt, uncured compound/fabric, conveying service, EP/NN/steelcord equivalence or fixed life; full ILCD/PEF/scientific approval claims"
  required_metadata: "All Required qualifiers and complete native limits; protocol owners; actual recipe/structure/cure; Q/P and stock/carry ledgers; utilities/packaging/outlets and allocation"
  required_quality_disclosure: "Actual coverage; missing future measurement/provider/auxiliary identities; source synthesis and independence limits; native metadata debt; uncertainty and pending review"
  update_trigger: "Material changes in EP layup/finish, compound recipe, cure, supply state, process/boundary, Q gate/conversion, stock attribution or primary/native evidence"
data_sources:
  - id: "fenner-belt-making-2023"
    type: "literature"
    reference: "Quality in the making – how rubber conveyor belts are made; Mining & Quarry World December 2023; https://www.fennerdunlopemea.com/app/uploads/Quality-in-the-Making.-MQW-December-2023.pdf"
    used_for: "Netherlands primary factory observation hosted by manufacturer, not a same-SKU recipe or universal amounts, duration, pressure, service or lifetime. Carbon black is incorrectly called a polymer in the prose; no chemical taxonomy, numerical performance comparisons or regulatory/safety claims are adopted. Article also discusses excluded steelcord and proprietary single/dual-ply structures."
  - id: "fenner-superfort"
    type: "literature"
    reference: "Superfort multi-ply conveyor belts; HTML snapshot 2026-10-16T11:17:40.555Z; https://www.fennerdunlopemea.com/conveyor-belts/superfort/"
    used_for: "Real supplied multi-ply EP product evidence only. No stock dimension, strength, universal cover formulation, performance, life, temperature or rate is transferred. Cover grades remain distinct; page does not establish a complete foreground inventory or any mass per metre."
  - id: "somi-belt-process"
    type: "literature"
    reference: "Stage-wise conveyor belt manufacturing; Web snapshot 2026-10-16; https://somiconveyor.com/our-usp"
    used_for: "Indian plant process observation; selected textile multi-ply stages only. Cord creel/tension/comb steps are not EP-fabric instructions. No equipment count, power, throughput, process time, numeric recipe, magnetic-field claim or lifecycle factor is transferred."
  - id: "fenner-rubber-2024"
    type: "literature"
    reference: "It’s all about the rubber; Mining & Quarry World October 2024; https://www.fennerdunlopemea.com/app/uploads/Its-all-about-the-rubber.-MQW.-OCT-2024-003.pdf"
    used_for: "Same author/manufacturer family as quality paper, not independent corroboration. Mixing/compound outsourcing context only; no claimed mass shares, temperatures, comparisons, generic formula or performance. Carbon black polymer wording is a source error and is not adopted."
  - id: "ilcd-allocation-2010"
    type: "official_guidance"
    reference: "ILCD Handbook: General guide for Life Cycle Assessment — Detailed guidance; First edition March 2010; https://eplca.jrc.ec.europa.eu/uploads/ILCD-Handbook-General-guide-for-LCA-DETAILED-GUIDANCE-12March2010-ISBN-fin-v1.0-EN.pdf"
    used_for: "Declared attributional allocation case only, with complete7.9.2/7.9.3 context read. Subdivide first, determining physical causality per exchange, then remaining burdens by market value at identical exit conditions when causality is not determinable. No universal mass split, optional arbitrary method switch, avoided-production credit, full ILCD or PEF compliance."
