    used_for: "Freighter fullbody and passenger relevant method/shared-function sections only:belly vs dedicatedfreighter,actual route/aircraft/load and passenger-mail-cargo allocation context;predictive operational CO2 methods are not whole LCA. No numeric default/factor,model equation,GCD correction,assumed person/seat mass or regionload adopted."
