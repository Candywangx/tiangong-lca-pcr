      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | air_other_freight_delivery | Directly assign dedicated cargo/ULD/care/handling resources, then allocate actual residual shared flight/ground/terminal pools. Enumerate every real independent freight, mail, passenger/baggage or other served function and its handover. Own support, entrusted cargo and internal transfers are not independent final services. | ghg-product-2011 |\n| causal_all_users | air_other_freight_delivery | Use supported actual incremental work, compatible mass-distance, occupied volume/time, compartment/cargo-condition demand and native metering for each real pool; all actual competing users included. Record passenger/cargo/baggage/mail allocation basis and sensitivity, not automatic average person/seat mass, tariff, equal split or zero belly burden. Empty/reposition/failure/recovery duty remains in its evidenced serving pool once. |  |\n| same_asset_life | air_other_freight_delivery | Attribute actual native supplied aircraft/engine/ULD/pallet/net/container/ground-terminal asset quantity using studied compatible duty divided by positive documented same-asset all-user useful lifetime duty, then normalize once. All actual modes/functions/sites/periods served by that asset included; initial/replacement/maintenance/retirement cells exclusive, forecast evidence and sensitivity retained. |  |\n| failure_fates | air_other_freight_delivery | Retain failed/off-quality/returned/lost/retained cargo duty without fictitious accepted mass. Actual replacement, collection/recovery/disposal and direct release have separate native quantity/owner/provider coverage, counted once; no automatic goods manufacture, recovered-energy/material or avoided-impact credit. Internal recovered material retained in closing stock is not an external recovered output. |  |\n\n"
