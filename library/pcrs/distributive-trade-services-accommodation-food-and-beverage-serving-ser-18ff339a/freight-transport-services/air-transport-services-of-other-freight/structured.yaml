  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "I_x = A_x / M. A_x is real native quantity attributed to the coherent accepted other-airfreight cohort after direct/causal all-user attribution;M is positive actual accepted cargo kg on original declared contents/packaging basis and gates. M=0 retains burden without finite intensity."
      inputs:
        - A_x
        - M
      output: "native inventory per accepted cargo kg"
      source_ids: []
    - id: provider_native
      applies_to: "provider rows"
      rule: "A_x = q_u * D_u * s. Use compatible provider inventory q_u per native unit u,real same-unit demand D_u and evidenced all-user cohort share s;replace exact covered cells then divide by M once. No automatic kg-to-tkm/count/flight conversion."
      inputs:
        - q_u
        - D_u
        - s
        - M
      output: "attributed native provider quantity"
      source_ids: []
    - id: asset_life
      applies_to: "asset rows"
      rule: "A_asset = Q_asset * U_studied / U_life;I_asset = A_asset / M. Native delivered Q_asset and compatible studied duty U_studied match positive documented same-asset all-user useful-life duty U_life. All actual functions/modes/sites/periods served included, disjoint initial/replacement/maintenance/retirement close separately."
      inputs:
        - Q_asset
        - U_studied
        - U_life
        - M
      output: "native asset quantity per accepted cargo kg"
      source_ids: []
    - id: cargo_custody
      applies_to: "actual cargo and live-body native ledgers"
      rule: "Opening + received_external = accepted_external_delivery + returned_external + recovered_external + consumed_or_transformed_cargo + destroyed_cargo + actual_waste_transfer + evidenced_direct_release + closing + unresolved_residual. Compatible original-species native terms are mutually exclusive;internal transfer cancels. Actual metabolism/reaction/phase output uses supported species/element relation,not cargo mass copied to exhaust. Actual death,loss,returned or retained state does not itself prove waste/emission or service acceptance. Destruction fate does not automatically import cargo manufacture or energy credit;actual abatement/support and replacement responsibility remain once."
      inputs:
        - Opening
        - received_external
        - accepted_external_delivery
        - returned_external
        - recovered_external
        - consumed_or_transformed_cargo
        - destroyed_cargo
        - actual_waste_transfer
        - evidenced_direct_release
        - closing
        - unresolved_residual
      output: "reconciled original-species cargo/body custody"
      source_ids: []
    - id: support_stock_fate
      applies_to: "fuel,dry ice,refrigerant,care and support materials"
      rule: "Opening + supplied + transfers_in = closing + consumed_or_transformed + transferred_out + recovered_external + evidenced_release + unresolved_residual. Actual native mutually exclusive terms;retained recovery is closing stock,not extra external output. Consumed initial/opening/customer-owned fuel-energy requires compatible upstream source/charging once regardless title/purchaser,not duplicate purchase/use. Dry ice sublimation,metabolism and combustion products have separate actual species/source relations;unknown residual not default release."
      inputs:
        - Opening
        - supplied
        - transfers_in
        - closing
        - consumed_or_transformed
        - transferred_out
        - recovered_external
        - evidenced_release
        - unresolved_residual
      output: "reconciled native support stock/fate"
      source_ids: []
