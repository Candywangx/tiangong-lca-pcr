      rule: "This PCR covers air transport of individual articles and packages assembled and shipped in specially constructed shipping containers for ease of handling, and all other airfreight not elsewhere classified. Actual loose, unitized, unusual, temperature-sensitive, live-animal or dangerous cargo stays covered where it performs this freight function. Passenger belly, combi, dedicated freighter, scheduled/nonscheduled and every qualifying actual aircraft/propulsion configuration are conditional real routes, not exclusions. Special shipping-container carriage does not mean only one ULD standard or aircraft type."
