      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual entrusted specified cargo at original content/packaging and custody gates with real air/ULD/ground provider interfaces. |\n| starting_condition_role | Foreground collection interface,not zero upstream support/lifecycle supply. |\n| product_classification_scope | CPC 3.0 65319 |\n| recursive_input_rule | Actual compatible native carrier/support demand once with mandatory uncovered lifecycle;no purchased self-service or internal final-transfer output. |\n| upstream_dataset_requirement | Actual function,basis,gates,technology,geography,period,phases and native units compatible;complete mandatory gaps. |\n| disclosure | actual_other_freight_function_not_postal_carrier; original_contents_and_intrinsic_packaging_mass_basis; ULD_pallet_net_securing_dryice_not_extra_cargo; actual_receipt_delivery_gates_original_amended_quality; actual_air_route_legs_distance_time_altitude_phase; actual_belly_combi_freighter_nonscheduled_configuration; actual_propulsion_fuel_native_source_and_ground_APU_duties; empty_reposition_failed_diversion_recovery_return_serving_pool; actual_cold_liveanimal_dangerous_cargo_care_conditions; external_supply_vs_internal_generation_provider_covered_cells; all_user_same_asset_aircraft_ULD_ground_terminal_life; actual_substance_source_altitude_receiver_and_nonCO2_method_gaps |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_scope | air_other_freight_delivery | This PCR covers air transport of individual articles and packages assembled and shipped in specially constructed shipping containers for ease of handling, and all other airfreight not elsewhere classified. Actual loose, unitized, unusual, temperature-sensitive, live-animal or dangerous cargo stays covered where it performs this freight function. Passenger belly, combi, dedicated freighter, scheduled/nonscheduled and every qualifying actual aircraft/propulsion configuration are conditional real routes, not exclusions. Special shipping-container carriage does not mean only one ULD standard or aircraft type. | unsd-other-airfreight-2025 |\n| acceptance_basis | air_other_freight_delivery | Use actual independently accepted specified cargo mass at predeclared contents/intrinsic-packaging and quality/custody gates. Keep ULD/pallet/net/tare/securing, dry ice/support, charged/volumetric/loaded mass and rejected/retained cargo separate. Original genuine packaged cargo basis cannot be opportunistically enlarged or switched. Require actual route/leg distance/time/configuration and comparable strata. |  |\n| flight_ground_duties | air_other_freight_delivery | Include real loaded and empty/reposition flight, taxi/take-off/climb/cruise/descent/landing, APU/ground power, stand/wait, weather/diversion/recovery/return, transshipment/consolidation/breakdown and necessary included ground/terminal duties. Internal aircraft/hub/ULD changes do not create extra final deliveries. Scheduled predictions are not actual nonscheduled activity records. | icao-air-calculator-context-2024 |\n| cargo_conditions | air_other_freight_delivery | Record actual compartment/ULD/packaging configuration and cargo-required time/temperature/pressure/ventilation, power/cooling/dry ice/refrigerant/monitoring, live-animal species/count/mass/feed/water/oxygen/veterinary/biosecurity and dangerous-cargo support where actually owed. Intervals and quantities need actual evidence, not one-species or vaccine prescriptions applied to all cargo. Carrier care does not import independent rearing/manufacture. | icao-cargo-safety-context |\n| native_energy | air_other_freight_delivery | Identify actual aviation fuels/blends/SAF/avgas or other propulsion, carbon origin, native supply and burn separately from actual ground diesel, external AC/DC/charging/heat/cold and onboard generation. Upstream source supply/charging for consumed opening/initial/customer-owned fuel-energy counts once regardless of title/purchaser, with source-purchase-withdrawal-use linked and provider coverage reconciled. No default jet fuel density/calorific value, emission factor, free opening energy or purchased internal generation. |  |\n| provider_asset_life | air_other_freight_delivery | Exact compatible native carrier/handler/ULD/condition/airport support providers replace only covered phase/event/site/period cells once; complete mandatory gaps. Aircraft/engine/battery/cargo systems, ULD/pallet/net/active-container assets and ground/terminal/runway/stand works need native construction/initial/replacement/maintenance/retirement with positive same-asset all-user useful-life duty. All actual freight, mail, passenger/baggage and relevant nonflight users/sites/periods participate; no full aircraft/ULD per kg or flight. |  |\n| source_fates_nonco2 | air_other_freight_delivery | Trace actual species/carbon origin, ground versus flight phase/altitude/time/location and real receiving compartment. Known altitude/source cannot be silently assigned to an unspecified-air UUID. Dry ice sublimation needs actual stock/release relation and CO2 origin, not automatic fossil fuel burn. Native emissions differ from CO2e/contrail/climate characterization: retain compatible method scope, time horizon and missing non-CO2 coverage/uncertainty, no blanket multiplier or invented contrail mass. Collected cargo/animal remains, recovered products and waste are not direct emission. | icao-nonco2-context |\n\n"
