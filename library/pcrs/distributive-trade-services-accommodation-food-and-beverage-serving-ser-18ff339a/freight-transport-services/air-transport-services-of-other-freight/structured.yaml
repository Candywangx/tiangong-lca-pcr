    - rule_id: native_energy
      applies_to: "air_other_freight_delivery"
      rule: "Identify actual aviation fuels/blends/SAF/avgas or other propulsion, carbon origin, native supply and burn separately from actual ground diesel, external AC/DC/charging/heat/cold and onboard generation. Upstream source supply/charging for consumed opening/initial/customer-owned fuel-energy counts once regardless of title/purchaser, with source-purchase-withdrawal-use linked and provider coverage reconciled. No default jet fuel density/calorific value, emission factor, free opening energy or purchased internal generation."
      source_ids: []
    - rule_id: provider_asset_life
      applies_to: "air_other_freight_delivery"
      rule: "Exact compatible native carrier/handler/ULD/condition/airport support providers replace only covered phase/event/site/period cells once; complete mandatory gaps. Aircraft/engine/battery/cargo systems, ULD/pallet/net/active-container assets and ground/terminal/runway/stand works need native construction/initial/replacement/maintenance/retirement with positive same-asset all-user useful-life duty. All actual freight, mail, passenger/baggage and relevant nonflight users/sites/periods participate; no full aircraft/ULD per kg or flight."
      source_ids: []
    - rule_id: source_fates_nonco2
      applies_to: "air_other_freight_delivery"
      rule: "Trace actual species/carbon origin, ground versus flight phase/altitude/time/location and real receiving compartment. Known altitude/source cannot be silently assigned to an unspecified-air UUID. Dry ice sublimation needs actual stock/release relation and CO2 origin, not automatic fossil fuel burn. Native emissions differ from CO2e/contrail/climate characterization: retain compatible method scope, time horizon and missing non-CO2 coverage/uncertainty, no blanket multiplier or invented contrail mass. Collected cargo/animal remains, recovered products and waste are not direct emission."
