    - rule_id: flight_ground_duties
      applies_to: "air_other_freight_delivery"
      rule: "Include real loaded and empty/reposition flight, taxi/take-off/climb/cruise/descent/landing, APU/ground power, stand/wait, weather/diversion/recovery/return, transshipment/consolidation/breakdown and necessary included ground/terminal duties. Internal aircraft/hub/ULD changes do not create extra final deliveries. Scheduled predictions are not actual nonscheduled activity records."
      source_ids:
        - icao-air-calculator-context-2024
    - rule_id: cargo_conditions
      applies_to: "air_other_freight_delivery"
      rule: "Record actual compartment/ULD/packaging configuration and cargo-required time/temperature/pressure/ventilation, power/cooling/dry ice/refrigerant/monitoring, live-animal species/count/mass/feed/water/oxygen/veterinary/biosecurity and dangerous-cargo support where actually owed. Intervals and quantities need actual evidence, not one-species or vaccine prescriptions applied to all cargo. Carrier care does not import independent rearing/manufacture."
