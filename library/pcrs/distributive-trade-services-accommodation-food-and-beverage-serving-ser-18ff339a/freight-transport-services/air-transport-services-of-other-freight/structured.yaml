allocation_rules:
  - rule_id: direct_first
    applies_to: "air_other_freight_delivery"
    rule: "Directly assign dedicated cargo/ULD/care/handling resources, then allocate actual residual shared flight/ground/terminal pools. Enumerate every real independent freight, mail, passenger/baggage or other served function and its handover. Own support, entrusted cargo and internal transfers are not independent final services."
    source_ids:
      - ghg-product-2011
  - rule_id: causal_all_users
    applies_to: "air_other_freight_delivery"
    rule: "Use supported actual incremental work, compatible mass-distance, occupied volume/time, compartment/cargo-condition demand and native metering for each real pool; all actual competing users included. Record passenger/cargo/baggage/mail allocation basis and sensitivity, not automatic average person/seat mass, tariff, equal split or zero belly burden. Empty/reposition/failure/recovery duty remains in its evidenced serving pool once."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "air_other_freight_delivery"
    rule: "Attribute actual native supplied aircraft/engine/ULD/pallet/net/container/ground-terminal asset quantity using studied compatible duty divided by positive documented same-asset all-user useful lifetime duty, then normalize once. All actual modes/functions/sites/periods served by that asset included; initial/replacement/maintenance/retirement cells exclusive, forecast evidence and sensitivity retained."
    source_ids: []
  - rule_id: failure_fates
    applies_to: "air_other_freight_delivery"
    rule: "Retain failed/off-quality/returned/lost/retained cargo duty without fictitious accepted mass. Actual replacement, collection/recovery/disposal and direct release have separate native quantity/owner/provider coverage, counted once; no automatic goods manufacture, recovered-energy/material or avoided-impact credit. Internal recovered material retained in closing stock is not an external recovered output."
    source_ids: []
