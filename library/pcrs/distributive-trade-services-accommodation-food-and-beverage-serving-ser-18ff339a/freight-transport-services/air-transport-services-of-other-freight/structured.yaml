      evidence: "cp_emissions;cp_fates;cp_cargo"
validation_rules:
  - rule_id: actual_reference
    applies_to: "air_other_freight_delivery"
    rule: "Verify both complete containerized articles/packages and all other n.e.c. freight, real postal-carrier distinction and actual accepted kg with original contents/packaging basis, quality/custody gates, actual route/leg/distance/time/configuration. ULD/support/chargeable mass cannot create final accepted output."
    source_ids: []
  - rule_id: full_duty
    applies_to: "air_other_freight_delivery"
    rule: "Verify all actual belly/combi/freighter/nonscheduled/propulsion and flight/ground/APU/terminal/ULD/cold/live-animal/dangerous-cargo branches. Actual supporting empty/failure/recovery/return duty retained, absence needs affirmative real record and missing is not zero."
    source_ids: []
  - rule_id: native_provider_life
    applies_to: "air_other_freight_delivery"
    rule: "Verify actual consumed native fuel-energy upstream source once regardless purchaser/title/opening stock, internal generation and external purchases separate, exact provider replacement and required gaps. All real competing users/sites/periods and positive same-asset useful lifetime duty required;M=0 retains burden without finite intensity."
    source_ids: []
  - rule_id: fates_altitude
    applies_to: "air_other_freight_delivery"
    rule: "Reconcile cargo/animal/support stocks and mutually exclusive acceptance/return/recovery/consumption/destruction/waste/direct release/closing/residual on compatible original-species basis; actual conversion/metabolism/reaction outputs use supported species relations. Trace ground/flight altitude-source receivers and distinct non-CO2 characterization gaps, no blanket factor or automatic fossil dry-ice CO2."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "air_other_freight_delivery"
    rule: "Each real conditional requirement expands to concrete atomic type/direction/native property/unit/quantity/source/receiver and own-process evidence, or remains explicitly unresolved. Check bilingual semantic parity and generated current projection; target pass is not scientific/identity/operating or publication approval."
    source_ids: []
  - rule_id: atomic_air_other_freight_delivery
    applies_to: "air_other_freight_delivery"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified actual other-airfreight accepted delivery inventories for downstream process/lifecyclemodel projections"
  allowed_use: "Actual accepted cargo mass with harmonized contents/packaging,state/care/quality,gates,route/legs/distance/time/configuration and complete native attributable lifecycle after required data/identity review."
  excluded_use: "Unqualified cargo kg,ULD/chargeable/support mass as acceptance,postal-carrier or goods-manufacturing substitution,free belly/initial energy,unspecified-air identity for known altitude,blanket nonCO2 multiplier or missing facts as zero."
  required_metadata: "actual_other_freight_function_not_postal_carrier; original_contents_and_intrinsic_packaging_mass_basis; ULD_pallet_net_securing_dryice_not_extra_cargo; actual_receipt_delivery_gates_original_amended_quality; actual_air_route_legs_distance_time_altitude_phase; actual_belly_combi_freighter_nonscheduled_configuration; actual_propulsion_fuel_native_source_and_ground_APU_duties; empty_reposition_failed_diversion_recovery_return_serving_pool; actual_cold_liveanimal_dangerous_cargo_care_conditions; external_supply_vs_internal_generation_provider_covered_cells; all_user_same_asset_aircraft_ULD_ground_terminal_life; actual_substance_source_altitude_receiver_and_nonCO2_method_gaps"
  required_quality_disclosure: "Actual acceptance/basis,cargo-care state,all shared users/native provider cells,asset life forecasts/source altitude and impact coverage gaps with uncertainty."
  update_trigger: "Changed cargo/packaging/quality/gates,route/aircraft/propulsion/care/provider/life/allocation or actual source-altitude/substance/impact-method coverage."
