    reference: "ICAO,Cargo Safety,accessed23October2026. https://www.icao.int/operational-safety/cargo-safety"
    used_for: "Actual COVID/vaccine-specific body provides limited qualitative dry-ice/logger/ULD/aircraft/ground-flight interface collection questions. Not universal cargo safety/animal-care prescription,quantity/operating limit or claim to read linked standards."
  - id: "icao-nonco2-context"
    type: "official_guidance"
    reference: "ICAO,Non CO2 Aviation Emissions,accessed23October2026. https://www.icao.int/environmental-protection/non-co2-aviation-emissions"
    used_for: "Actual landing body uncertainty/context only,not linked reports or characterization multiplier. Native altitude/phase/species records and compatible impact-method gaps are explicit PCR requirements."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD,Product Life Cycle Accounting and Reporting Standard,2011,ch6-9. https://ghgprotocol.org/product-standard"
    used_for: "General function/lifecycle/disclosure/allocation framework only;acceptedkg,native provider,all-user life and custody equations explicit PCR choices,not externally prescribed aviation factors."
