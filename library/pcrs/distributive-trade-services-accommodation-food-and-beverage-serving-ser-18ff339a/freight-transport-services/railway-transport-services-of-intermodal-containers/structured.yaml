      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | rail_container_leg | Assign dedicated container-leg train/yard/terminal/reefer duties and measured resources directly before residual sharing. Different box sizes,cargo/temperature,gates,route distance,consist and quality require supported comparable strata or actual causal exposure,not automatic equal box/TEU shares. | ghg-product-2011 |\n| train_yard_all_users | rail_container_leg | Enumerate all actual independently supplied container legs and other intended services/handoffs sharing each train/yard/terminal duty. Reconcile gross train mass,locomotive/wagon/container tare,cargo and occupied slots separately. A supported driver may be actual tractive work,mass-distance,occupied capacity-time,shunting/handling events,reefer measured energy or another causal relationship. Train-km,wagon-km,TEU-km,mass-distance and hours are not additive interchangeable units; nominal capacity,price or equal split are not defaults. Empty/reposition/failure burdens belong once to their causal serving pool. |  |\n| same_asset_life | rail_container_leg | For each actual locomotive,wagon,container,battery,track/catenary/substation,terminal or crane asset,attribute native delivered quantity by studied compatible duty divided by positive documented same-asset all-user useful lifetime duty,then divide by N once. Include every actual passenger/freight/other user in shared infrastructure or locomotive denominators where served. Keep initial manufacture,parts,replacement,maintenance and retirement disjoint;no arbitrary life,depreciation or annual purchase-year allocation. |  |\n| reject_return | rail_container_leg | Link actual rejected/damaged/off-condition container/cargo to its producing duty,accepted or unaccepted state and actual return/rework/recovery/disposal owner/path. Retain burden through loops without counting incomplete/rejected box