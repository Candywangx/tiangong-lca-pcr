      collection_method: "Separately identify each actual waste/material,source owner,composition and receiver/fate. Rejected/damaged cargo or retained stock is not automatically discarded;recovered products and environmental releases remain distinct. Treat this scope as a mandatory identification requirement, not an exchange. Use the original node protocol and its records; separate every actual identity, gate and independent function before quantification, then apply the retained amount/basis/evidence instructions to each compatible concrete row separately. Never use an aggregate amount across heterogeneous identities or infer the native property/unit from a group label. A conclusion that no occurrence took place must be supported by evidence; unknown applicability or identity blocks completion. Apply these recording instructions only to the stated outputs/waste identity and gate (Actual retired rail/container materials and cargo/packing wastes). Activate when this process actually generates or receives the specified waste. Record material/formulation or genuine co-collected mixture, wet/dry state, container tare, origin event, stored quantities, handover gate and actual receiver. Reconcile generation + opening stock + receipts = handovers + closing stock + separately recorded onsite treatment. Different separately collected wastes require different rows; one genuine receiving mixture may remain one row, with composition as a nonadditive audit. Useful recovery, customer-retained items and waste are distinct fates; no automatic substitution credit. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
