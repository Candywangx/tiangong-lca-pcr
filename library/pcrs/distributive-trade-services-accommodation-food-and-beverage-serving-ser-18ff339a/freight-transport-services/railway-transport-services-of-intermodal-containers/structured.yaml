  excluded_use: "Unqualified TEU/tkm/train/wagon/slot result,whole multimodal route,container/cargo/rolling-stock manufacture,duplicated yard/traction-change outputs,missing terminal/condition/empty/failure duty or unknown inventory treated as zero."
