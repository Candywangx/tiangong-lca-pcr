allocation_rules:
  - rule_id: direct_first
    applies_to: "rail_container_leg"
    rule: "Assign dedicated container-leg train/yard/terminal/reefer duties and measured resources directly before residual sharing. Different box sizes,cargo/temperature,gates,route distance,consist and quality require supported comparable strata or actual causal exposure,not automatic equal box/TEU shares."
    source_ids:
      - ghg-product-2011
  - rule_id: train_yard_all_users
    applies_to: "rail_container_leg"
    rule: "Enumerate all actual independently supplied container legs and other intended services/handoffs sharing each train/yard/terminal duty. Reconcile gross train mass,locomotive/wagon/container tare,cargo and occupied slots separately. A supported driver may be actual tractive work,mass-distance,occupied capacity-time,shunting/handling events,reefer measured energy or another causal relationship. Train-km,wagon-km,TEU-km,mass-distance and hours are not additive interchangeable units; nominal capacity,price or equal split are not defaults. Empty/reposition/failure burdens belong once to their causal serving pool."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "rail_container_leg"
    rule: "For each actual locomotive,wagon,container,battery,track/catenary/substation,terminal or crane asset,attribute native delivered quantity by studied compatible duty divided by positive documented same-asset all-user useful lifetime duty,then divide by N once. Include every actual passenger/freight/other user in shared infrastructure or locomotive denominators where served. Keep initial manufacture,parts,replacement,maintenance and retirement disjoint;no arbitrary life,depreciation or annual purchase-year allocation."
    source_ids: []
  - rule_id: reject_return
    applies_to: "rail_container_leg"
    rule: "Link actual rejected/damaged/off-condition container/cargo to its producing duty,accepted or unaccepted state and actual return/rework/recovery/disposal owner/path. Retain burden through loops without counting incomplete/rejected box-leg as accepted service. Actual recovered products,material residues and waste have distinct identities,gates and explicit attribution;no automatic avoided cargo/container/virgin-material or electricity credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "rail_container_leg"
      flow_role: "completed_rail_container_leg;other_intended_services"
      record_type: "box_leg_rail_custody_acceptance"
      raw_fields: "box_leg/box_id/type/size;articles_packages_contents/net/gross/tare;rail_carrier/terminal_operator;original_gates_scope_quality;actual_rail_segments_distance;consist_loco_wagon_slot_membership;time_dwell;chronological_amendment;accepted_handover;failed_partial_cancelled_diverted_return;N;other_outputs"
      collection_method: "Reconcile original/chronological amended rail custody contract and actual box delivery/membership through train,wagon,yard and border changes. Count independently accepted comparable box-legs only;retain actual distance/time/load and fail/return duties without internal output duplication. Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator."
      unit: "Item(s);kg;km;h;actual slots"
      frequency: "each real event and aligned cohort"
      temporal_coverage: "Actual leg reporting period plus disclosed whole-life interfaces"
      site_scope: "Actual contributing rail/yard/terminal sites,locomotives/wagons/boxes/providers and all shared users"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original source/meter/dispatch/receiver records, calibration, scope and uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_operation
      process_id: "rail_container_leg"
      flow_role: "traction_diesel;traction_ac;other_native_energy"
      record_type: "train_traction_shunting_native_energy"
      raw_fields: "duty/train/consist/loco/wagon/box;actual_mainline_shunting_loaded_empty_wait_failure;fuel_grade_blend_source;opening_closing_supply_withdrawal_burn_spill_recovery_transfer;actual_AC_DC_waveform_meter_gate;traction_aux_coverage;regeneration_internal_export;gross_cargo_tare_work;all_users_sites_period"
      collection_method: "Read actual energy meters,fuel stock and consist/duty logs;distinguish supply/burn,traction/auxiliary and actual imported energy versus internal recovery/export. Link all actual train/yard users and causal work,retain native gate/losses before one/N normalization. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition."
      unit: "kg;kWh;actual native units;train/wagon_km;h"
      frequency: "each real event and aligned cohort"
      temporal_coverage: "Actual leg reporting period plus disclosed whole-life interfaces"
      site_scope: "Actual contributing rail/yard/terminal sites,locomotives/wagons/boxes/providers and all shared users"
