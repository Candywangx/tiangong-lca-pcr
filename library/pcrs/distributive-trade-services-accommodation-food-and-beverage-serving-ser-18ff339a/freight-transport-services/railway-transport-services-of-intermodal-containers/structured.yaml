      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual container/cargo rail custody and consist/duty records at stated rail handover;compatible native supplier/terminal interfaces. |\n| starting_condition_role | Foreground collection interface, not zero upstream asset/supply burden. |\n| product_classification_scope | CPC 3.0 65123 |\n| recursive_input_rule | Use verified same-function subcontracted service once at native demand; expand uncovered responsibility, never purchase a self-service or create extra final output. |\n| upstream_dataset_requirement | Actual function, native demand, technology, geography, period, phases and quality compatible; explicitly complete all missing stages. |\n| disclosure | Rail/container custody,gates/acceptance,actual consists/traction/yard/reefer/terminal duties,empty/failure,owned/provider coverage,all-user asset life/sites/periods and species/fates/gaps. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_gate | rail_container_leg | Apply railway carriage of articles/packages in actual intermodal shipping containers at declared rail custody handover; preserve independently supplied adjacent-mode and terminal interfaces and actual overlap classification. | unsd-rail-container-2025 |\n| one_owner | rail_container_leg | Assign each actual train/duty, wagon, container, yard, terminal, provider, phase and period one burden owner. Complete native rail/terminal/reefer provider inventories replace only exact covered cells; collect mandatory missing stages without adding their covered energy/emissions/capital/handling twice. A path charge or purchased train-slot alone is not a complete physical lifecycle inventory. | ghg-product-2011 |\n| rail_duties | rail_container_leg | Capture actual mainline loaded/empty running, marshalling, train formation/disbanding, locomotive/wagon/container positioning, shunting, dwell/waiting, border/locomotive changes, failures and recovery with actual consists and causal users. Do not infer equal train-km and wagon-km or use nominal loading as actual cargo. Actual train/terminal tasks may have different causal exposure units; retain their real membership without extra final box-leg outputs. |  |\n| cargo_container_assets | rail_container_leg | Cargo remains custodial property, not a consumed product input to create rail service. Record actual cargo/net/gross/packaging/tare and loss/return separately. Locomotives, rail wagons, reusable shipping containers and securing/handling equipment have distinct native manufacture,initial components,maintenance,replacement and retirement. An actual cargo loss replacement belongs to its true owner/function; ordinary cargo manufacture is not charged again by gross train mass. | unece-ctu-2014 |\n| traction_and_condition | rail_container_leg | Separate actual traction supply from reefer/container and terminal auxiliaries at their native meters/provider gates. AC traction is conditional, not every rail system; DC,diesel,battery,hydrogen,steam or other real technologies need their own native fuel/energy,source,stock/operation and species/fates records. Internal regenerative braking/battery discharge or electrical conversion is not new external supply; actual external export needs its own documented native gate/quantity and no second avoided-energy credit. Whole fuel blend and physical replacement components are alternative supplies; fuel supplied,withdrawn,burned,spilled,recovered and transferred remain distinct. |  |\n| terminal_reefer | rail_container_leg | Determine actual terminal/lift/securing/inspection, reefer connection or generator responsibility from rail-carrier and terminal/operator agreements. For conditioned containers collect real target/actual temperature,time,door/holding events,source-metered cooling energy and refrigerant charge/supply/leak/recovery with substance and fate. Distinct supplied handling or cold storage remains at native gates; necessary duties cannot be omitted because a box is moved by rail. Dry boxes do not require fictional cooling. | unece-ctu-2014 |\n| material_fates | rail_container_leg | Independently identify actual wear/dust species and nonoverlapping size fractions, combustion/carbon source, spills, refrigerant or other releases and receiving medium/subcompartment. Distinguish collected cleaning wastewater/waste, recovered product and retained stock from environmental releases; unknown stock loss or cargo shortage is not an emission or automatically a waste. |  |\n\n"
