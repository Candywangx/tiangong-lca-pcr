      record_type: "collected_record"
      raw_fields: "requirement_id=other_substance_releases; process_id=rail_container_leg; required_direction=outputs; required_flow_type=elementary; original_collection_protocol=cp_emissions; applicability_evidence; occurrence_event_id; concrete_row_id; physical_identity; formulation_or_species; phase; carbon_origin; particle_fraction; source_compartment; receiving_compartment; supply_or_handover_gate; provider_covered_cells; asset_component_event_and_lifecycle_phase; native_property; native_unit; measured_native_quantity; source_record_id; allocation_all_users; normalization_denominator; per_identity_amount_calculation; verification_evidence; unresolved_reason; occurrence_to_row_reconciliation; substance_identity; chemical_form; environmental_compartment; carbon_origin; particle_fraction_or_count_basis; measured_or_calculated_release; species_conversion_evidence; applicability_decision_record; covered_concrete_rows; excluded_occurrence_reason; completion_evidence; observed_quantity_state; conversion_or_allocation_evidence"
      collection_method: "Mandatory actual species/source/medium expansion includes combustion and carbon origin,rail/wheel/brake dust and nonoverlapping sizes,spills and other refrigerants where occurring. Generic VOC/NOx/dust is not one molecule;missing cargo or stock is not an emission. Treat this scope as a mandatory identification requirement, not an exchange. Use the original node protocol and its records; separate every actual identity, gate and independent function before quantification, then apply the retained amount/basis/evidence instructions to each compatible concrete row separately. Never use an aggregate amount across heterogeneous identities or infer the native property/unit from a group label. A conclusion that no occurrence took place must be supported by evidence; unknown applicability or identity blocks completion. Apply these recording instructions only to the stated outputs/elementary identity and gate (Actual other substance-specific rail, terminal or container releases). Activate for an actual release to its documented receiving compartment, supported by observation or an applicable calculation. Record exact substance/form, source or receiving compartment, fossil/biogenic origin where relevant, particle fraction or count-size basis where relevant and sampling period. Preserve reported elemental versus molecular bases; conversion needs stoichiometry and compatible species evidence. Contained pollutants belong to the receiver stream until the actual environmental release boundary. Do not replace missing species with CO2, NOx, VOC, COD or a generic particulate flow. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
