      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| reference_leg | rail_container_leg | Verify exactly one accepted actual laden-container rail leg as1Item(s),actual output linkage and box/cargo/rail gates,distance,duration,condition/quality and positive comparable N. No automatic TEU,train/wagon departure,slot capacity or generic tkm conversion to completed box delivery;internal yard/traction changes are not extra outputs. |  |\n| rail_coverage | rail_container_leg | Reconcile actual trainconsists,loaded/empty/positioning/shunting/yard/dwell/failure and border duties,terminal ownership,all real propulsion and reefer branches. Complete missing native supply/assets/life stages;replace exact provider-covered cells and no duplicate cargo manufacture or multimodal output. |  |\n| native_energy_fates | rail_container_leg | Validate traction vs reefer/terminal energy meters,actual AC/DC/source boundaries,regeneration/export treatment,fuel supply/burn/stock and refrigerant charge/leak/recovery. Verify each actual species,carbon origin,receiver/subcompartment,water/waste and particle overlap;unknown residuals or cargo loss cannot be assigned as emissions by default. |  |\n| all_user_life_period | rail_container_leg | Reconcile all intended handovers/users/sites/periods and causal numerator with comparable N. Require same-asset positive all-user useful-life demand and disjoint initial/replacement/retirement;preserve zero-output and failed/empty pools without finite intensity when N=0. |  |\n| identity_projection | rail_container_leg | Each actual exchange has atomic row id,one real process,direction/type,native quantity/property/unit,supplier/receiver gate and same-process protocol or registered unresolved requirement. Check bilingual method tables/rules/cards,actual support identities and current projection fingerprint;pass is not external scientific/identity approval or publication readiness. |  |\n| atomic_rail_container_leg | rail_container_leg | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
