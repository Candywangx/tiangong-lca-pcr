product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.freight-transport-services.railway-transport-services-of-intermodal-containers"
  classification_refs: "CPC 3.0 65123; exact"
  covered_products: "This PCR covers railway carriage of articles and packages assembled and shipped in purpose-built intermodal shipping containers. Declare actual container design, cargo, rail carrier/custody interfaces, train/wagon configuration, railway and supply geography, propulsion and actual condition/handling duties. It covers the complete qualifying rail-container function, not merely dry containers, electric traction, one wagon arrangement or one corridor. A box does not have to change transport modes within the studied rail leg to qualify; container carriage remains distinct from a whole multimodal door-to-door product."
  excluded_products: "Exclude independently supplied road, sea, inland-water, air or space legs; standalone forwarding, warehousing, packing/unpacking or terminal transfer sold as separate functions; container/rolling-stock manufacture/rental as the final product; and non-container rail freight or actual separately classified refrigerator-car/tanker/dry-bulk/mail/live-animal functions. Determine overlap from the actual containerized supplied function, equipment and gate rather than cargo name alone. A real conditioned container on a flat wagon is not automatically excluded as refrigerator-car freight, nor is its cooling ignored. Include actual rail-carrier-accountable terminal lift/securing/inspection, shunting, dwell and custody support; independently supplied terminal or other-mode activities keep their documented interface and necessary coverage once."
  representative_product: "Completed rail freight leg of one laden intermodal shipping container"
  production_route: "Actual containerized rail custody and accepted carriage with train/yard/terminal/conditional-reefer duties,owned or provider coverage and full attributable lifecycle."
  market_state: "Completed rail freight leg of one laden intermodal shipping container"
functional_unit:
  what: "Completed rail freight leg of one laden intermodal shipping container"
  how_much: "1 actual completed laden-container rail leg"
  how_well: "Actual container/cargo and rail-custody identity/gates,rail segment distance/consist,duration/dwell,required condition/quality and accepted delivery."
  how_long_or_cycle: "Actual leg and supporting complete duty/lifecycle interval; report actual elapsed time and cohort period."
  reference_flow_link: "completed_rail_container_leg"
system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "rail_container_leg"
      rule: "Apply railway carriage of articles/packages in actual intermodal shipping containers at declared rail custody handover; preserve independently supplied adjacent-mode and terminal interfaces and actual overlap classification."
      source_ids:
        - unsd-rail-container-2025
    - rule_id: one_owner
      applies_to: "rail_container_leg"
      rule: "Assign each actual train/duty, wagon, container, yard, terminal, provider, phase and period one burden owner. Complete native rail/terminal/reefer provider inventories replace only exact covered cells; collect mandatory missing stages without adding their covered energy/emissions/capital/handling twice. A path charge or purchased train-slot alone is not a complete physical lifecycle inventory."
      source_ids:
        - ghg-product-2011
    - rule_id: rail_duties
      applies_to: "rail_container_leg"
      rule: "Capture actual mainline loaded/empty running, marshalling, train formation/disbanding, locomotive/wagon/container positioning, shunting, dwell/waiting, border/locomotive changes, failures and recovery with actual consists and causal users. Do not infer equal train-km and wagon-km or use nominal loading as actual cargo. Actual train/terminal tasks may have different causal exposure units; retain their real membership without extra final box-leg outputs."
      source_ids: []
    - rule_id: cargo_container_assets
      applies_to: "rail_container_leg"
      rule: "Cargo remains custodial property, not a consumed product input to create rail service. Record actual cargo/net/gross/packaging/tare and loss/return separately. Locomotives, rail wagons, reusable shipping containers and securing/handling equipment have distinct native manufacture,initial components,maintenance,replacement and retirement. An actual cargo loss replacement belongs to its true owner/function; ordinary cargo manufacture is not charged again by gross train mass."
      source_ids:
        - unece-ctu-2014
    - rule_id: traction_and_condition
      applies_to: "rail_container_leg"
      rule: "Separate actual traction supply from reefer/container and terminal auxiliaries at their native meters/provider gates. AC traction is conditional, not every rail system; DC,diesel,battery,hydrogen,steam or other real technologies need their own native fuel/energy,source,stock/operation and species/fates records. Internal regenerative braking/battery discharge or electrical conversion is not new external supply; actual external export needs its own documented native gate/quantity and no second avoided-energy credit. Whole fuel blend and physical replacement components are alternative supplies; fuel supplied,withdrawn,burned,spilled,recovered and transferred remain distinct."
      source_ids: []
    - rule_id: terminal_reefer
      applies_to: "rail_container_leg"
      rule: "Determine actual terminal/lift/securing/inspection, reefer connection or generator responsibility from rail-carrier and terminal/operator agreements. For conditioned containers collect real target/actual temperature,time,door/holding events,source-metered cooling energy and refrigerant charge/supply/leak/recovery with substance and fate. Distinct supplied handling or cold storage remains at native gates; necessary duties cannot be omitted because a box is moved by rail. Dry boxes do not require fictional cooling."
      source_ids:
        - unece-ctu-2014
    - rule_id: material_fates
      applies_to: "rail_container_leg"
      rule: "Independently identify actual wear/dust species and nonoverlapping size fractions, combustion/carbon source, spills, refrigerant or other releases and receiving medium/subcompartment. Distinguish collected cleaning wastewater/waste, recovered product and retained stock from environmental releases; unknown stock loss or cargo shortage is not an emission or automatically a waste."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual container/cargo rail custody and consist/duty records at stated rail handover;compatible native supplier/terminal interfaces."
  starting_condition_role: "Foreground collection interface, not zero upstream asset/supply burden."
  product_classification_scope: "CPC 3.0 65123"
  recursive_input_rule: "Use verified same-function subcontracted service once at native demand; expand uncovered responsibility, never purchase a self-service or create extra final output."
  upstream_dataset_requirement: "Actual function, native demand, technology, geography, period, phases and quality compatible; explicitly complete all missing stages."
  disclosure: "Rail/container custody,gates/acceptance,actual consists/traction/yard/reefer/terminal duties,empty/failure,owned/provider coverage,all-user asset life/sites/periods and species/fates/gaps."
