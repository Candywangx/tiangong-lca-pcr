system_boundary:
  rules:
    - rule_id: full_bulk_scope
      applies_to: "all nodes"
      rule: "Cover all actual dry-solid bulk cargo and real vehicle/handling forms; no grain-only, cement-only, diesel-only or tipper-only narrowing. Parent activity is dry-bulk road freight. Open/covered bodies, pneumatic silo equipment, tipping, bottom discharge and actual alternative propulsion change energy, assets, collection and emission interfaces; these branches coexist only when actual segment/event records support them."
      source_ids:
        - unsd-cpc3-65117
    - rule_id: cargo_custody
      applies_to: "road_movement; bulk_handling"
      rule: "Cargo is the object moved, not consumed fuel or new product output. Record loaded/delivered cargo, carryover, return, retention, spills, sampled/captured dust and real receiver separately by lot and moisture basis. Original cargo production is outside freight service; disclose actual loss/replacement consequences to the downstream cargo LCA without duplicate manufacture. Internal loader-to-vehicle-to-silo transfers share IDs and do not create extra finished freight outputs."
      source_ids:
        - ghg-product-2011
    - rule_id: whole_duty
      applies_to: "all nodes"
      rule: "Include actual loading/discharge, pneumatic compression or hydraulics, conveying/vibration/filters, stops/idle/waiting, driver support, loaded running, empty reposition/return, failed/stuck/rejected/rescue and cleaning duties attributable to this service. Main-engine power take-off or shared electricity has one fuel/energy owner: partition real metered/native quantity before assigning to movement versus handling, not duplicate engine input and exhaust."
      source_ids:
        - ghg-product-2011
    - rule_id: pneumatic_receiver
      applies_to: "bulk_handling"
      rule: "For actual pneumatic transfer declare compressor air source, pressure/temperature/humidity and metered duty, power take-off/electric/provider boundary, hose/connection and vehicle/receiver-silo responsibility. Capture real vehicle blowdown, receiver vent/filter, blocked/filter-cleaning events and dust fate separately. Purchased compressed air replaces only matching owned compression supply cells. A receiving silo filtration service cannot automatically cover vehicle-side venting or upstream vehicle compression."
      source_ids:
        - uk-cement-pneumatic-guidance
    - rule_id: dust_material_fates
      applies_to: "bulk_handling; road_movement"
      rule: "Collect actual cargo material/substance and size/basis, moisture and site wind/handling state before choosing dust identities/methods. Distinguish direct air, deposited soil, runoff/dissolved water, collected filters and returned reusable cargo. Do not call all cargo dust PM2.5, silica or inert mineral; grain/flour, cement, sand and coal require their real composition and receiver. Generic aggregate-handling factors do not establish universal road/bulk or pneumatic emissions. Methods need actual applicable domain and documented control performance."
      source_ids:
        - epa-ap42-aggregate-handling
    - rule_id: whole_assets_provider
      applies_to: "support_lifecycle"
      rule: "PCR lifecycle choice includes actual tractor/truck/trailer/body/cover/silo/blower/compressor/hose/filter, batteries/tyres/handling equipment, road/terminal/depot manufacture, installation, repair, replacement and retirement. Delivered manufacture is not a whole-life service. Whole assemblies and included initial components are exclusive; actual supplier-native results replace only documented covered cells. Actual useful life/all-user cohort duty is an allocation denominator, not proof all lifecycle stages are already covered."
      source_ids:
        - ghg-product-2011
    - rule_id: actual_row_expansion
      applies_to: "all nodes"
      rule: "Every actual unrepresented fuel/electricity/air/water/control chemical/material, asset, provider result, waste or emitted species requires a separate real row_id, one node, direction/type, single identity/state, native quantity/property/unit, same-node protocol and source/gate/receiver/medium/uncertainty. Broad conditional requirement cards must expand to each real exchange and cannot receive one umbrella UUID. Unknown quantity/occurrence remains incomplete, never zero. Separate fuel carbon origin, pollutant compound/element, PM sizes and physical fates."
      source_ids:
        - ghg-product-2011
