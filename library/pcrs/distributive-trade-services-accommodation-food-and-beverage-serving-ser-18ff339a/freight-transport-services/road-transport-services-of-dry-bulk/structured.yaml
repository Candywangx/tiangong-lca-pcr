  calculation_rules:
    - id: normalize_bulk_service
      applies_to: "all inventory except final output"
      rule: "x_ref = sum(x_native_attributed) / N; N is actual same-cohort eligible completed dry-bulk road consignment legs and positive; final output is 1 Item(s)."
      inputs:
        - x_native_attributed
        - N
        - cp_movement
        - cp_handling
        - cp_support
        - cp_assets
      output: "x_ref"
      source_ids:
        - ghg-product-2011
    - id: exclusive_cargo_ledger
      applies_to: "each actual cargo dry-solids ledger and separate water ledger"
      rule: "opening_dry_solids + receipts_dry_solids + inward_transfers_dry_solids = closing_dry_solids + delivered_dry_solids + outward_transfers_dry_solids + measured_dry_solids_loss; convert EACH observation from its own measured wet mass and moisture fraction, dry_solids = wet_mass * (1 - w_wet), where w_wet = water_mass / wet_mass is the wet-basis water mass fraction. For a recorded dry-basis fraction w_dry = water_mass / dry_solids, first convert w_wet = w_dry / (1 + w_dry), equivalently dry_solids = wet_mass / (1 + w_dry). Record the observed basis and conversion evidence; never insert an unspecified-basis fraction. Destinations are disjoint; internal recovery stays closing or its later actual delivery/outward gate once. Close associated water separately with actual added/rain, retained/stock, delivered/outgoing and evaporated water as relevant. A wet-mass reporting ledger must explicitly include these water-change terms; never assume equal moisture or call evaporation dry-solids loss."
      inputs:
        - each_observation_wet_mass
        - each_observation_moisture_fraction
        - actual_added_rain_evaporated_retained_outgoing_water
        - stocks_transfers_losses
        - cp_movement
        - cp_handling
        - cp_support
      output: "closed native cargo ledger"
      source_ids:
        - ghg-product-2011
    - id: exclusive_shared_energy
      applies_to: "actual engine/air/handling cells"
      rule: "Partition actual shared engine/AC input and exhaust between movement and handling using documented metered/validated duty evidence; sum allocated native shares to the one measured pool. Owned compression and inclusive purchased air cells are exclusive before normalization."
      inputs:
        - "actual native engine_AC_air_pool"
        - duty_shares
        - cp_movement
        - cp_handling
      output: "attributed native energy and exhaust"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: traceable_native
      applies_to: "all nodes"
      requirement: "Require raw records/calibration, native property/unit/gate, lot/material/moisture/quality, actual period/site/provider, allocation and uncertainty per real exchange. Unknown identity/quantity stays incomplete."
      evidence: "Signed manifests; meter and supplier/waste records"
    - id: dust_validity
      applies_to: "dust and spill fate"
      requirement: "Actual cargo composition, size/substance/medium, moisture and measured/control state plus applicable model domain mandatory. Coal carbon/cement/silica/organic dust and fine/coarse particles cannot be silently substituted."
      evidence: "Independent compatible measurements and method provenance"
    - id: no_default_ranges
      applies_to: "amounts and factors"
      requirement: "No universal payload, fuel, pneumatic air, dust-loss/control, tyre/filter lifetime or empty/failed ratio supplied. Future empirical guardrails require independent compatible reference data and never validate a batch with its own maximum; missing actual data not zero."
      evidence: "Completeness and independent source register"
validation_rules:
  - rule_id: qualified_reference
    applies_to: "all nodes"
    rule: "Verify actual dry solid bulk, quantity with moisture/basis, road equipment/function, OD/distance/time and accepted handover. Do not confuse pressure-vessel powder with liquid/gas tanker cargo or container function. Positive N requires actual completed eligible leg, not vehicle capacity, cargo manufacture or planned dispatch."
    source_ids:
      - ghg-product-2011
  - rule_id: mass_moisture_dust
    applies_to: "all nodes"
    rule: "Close conserved dry-solids cargo ledgers by converting EACH accepted/delivered/carryover/returned/spilled/captured/direct-release observation from its own measured wet mass and moisture fraction. Close water separately with actual added/rain, stock/retention, delivery/outgoing and evaporation; wet-mass reporting must include water changes rather than assume equal moisture. Moisture change alone is not dry-matter loss; unknown balance deficit is not automatically dust. Require actual material/substance, PM fraction, capture/control records and receiving medium before emissions; no blanket aggregate/cement factor across all goods. Explicitly verify wet-basis w_wet = water_mass / wet_mass; a recorded dry-basis w_dry = water_mass / dry_solids must first convert to w_wet = w_dry / (1 + w_dry). An undocumented basis blocks this conversion."
    source_ids:
      - ghg-product-2011
  - rule_id: energy_provider_life
    applies_to: "all nodes"
    rule: "Close actual shared engine fuel/AC/PTO/compressed-air and downstream vent/filter cells with one owner. Match actual provider-native units, gates and whole asset lifecycle coverage; require positive same-cohort all-user useful duty and all-user share closure. Missing control/cleaning/failed-duty/lifetime evidence is incomplete. Pool actual site numerators and eligible N before normalization, not unweighted intensity means."
    source_ids:
      - ghg-product-2011
  - rule_id: identity_translation
    applies_to: "all nodes"
    rule: "Final implemented exchanges require verified concrete UUID/native support/state/gate and actual material/medium compatibility. Count support is not a service UUID; unresolved semantic cards remain candidate. Check EN/ZH ordered rule/card/protocol IDs, formula constants, full functional/profile fields and source references against generated canonical projection; disclose incomplete checks."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_road_movement
    applies_to: "road_movement"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_bulk_handling
    applies_to: "bulk_handling"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_support_lifecycle
    applies_to: "support_lifecycle"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Actual compatible dry-bulk road freight attached to cargo supply-chain LCA"
  allowed_use: "Comparable cargo amount/moisture/OD-distance/quality and actual handling/provider/lifecycle boundaries"
  excluded_use: "Cargo manufacture, other freight functions, unsupported equal-count comparisons, missing duty treated zero or unverified final exchanges"
  required_metadata: "All reference qualifiers, actual native source records, cargo/dust/fate/energy ownership, provider gates, allocation and all-user life"
  required_quality_disclosure: "Unknown identities/amounts, method domain, site/period representativeness, failed/rejected duty, dust controls/fates, uncertainty/skipped checks"
  update_trigger: "Changed cargo/method/route/quality/control/technology/asset/provider or verified new evidence"
data_sources:
  - id: "unsd-cpc3-65117"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 65117; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Full dry-solid bulk road scope including cereal/flour/cement/sand/coal; not numeric factors"
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard (2011), chapters6–10; https://ghgprotocol.org/sites/default/files/ghgp/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Boundary/data/allocation principles; explicit full asset and record algorithms are PCR choices"
  - id: "epa-ap42-aggregate-handling"
    type: "official_guidance"
    reference: "US EPA AP-42, section13.2.4 Aggregate Handling and Storage Piles, November2006; https://www.epa.gov/sites/default/files/2020-10/documents/13.2.4_aggregate_handling_and_storage_piles.pdf"
    used_for: "Material/moisture/wind/size/control-specific dust questions only; no numerical aggregate factors adopted universally"
  - id: "uk-cement-pneumatic-guidance"
    type: "official_guidance"
    reference: "UK Process Guidance Note3/01(12), Blending, packing, loading, unloading and use of cement; https://assets.publishing.service.gov.uk/media/5a80360d40f0b62305b89d4a/blending-packing-loading-unloading-and-use-of-cement-process-guidance-note-3-01_12_.pdf"
    used_for: "Conditional pneumatic vehicle/receiver-silo vent/filter interfaces for actual compatible cement route; no claim all cargo regulated identically"
