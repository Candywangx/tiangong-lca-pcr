allocation_rules:
  - rule_id: physical_shares
    applies_to: "all nodes"
    rule: "Avoid allocation by actual lot/segment/equipment metering first. Shared movement burdens follow supported physical cargo load/distance/capacity constraint relationships across all consignments/users; handling/compression/dust-control burdens follow their own actual mass/event/energy causation. Do not impose one universal tonne-distance or equal-consignment share. A documented physical method has precedence; economic fallback needs inability evidence and sensitivity. Shares for the same event close to one."
    source_ids:
      - ghg-product-2011
  - rule_id: empty_failed_return
    applies_to: "all nodes"
    rule: "Retain causal empty/positioning, failed/stuck/rejected/rescue and return duties before positive eligible completed-N normalization. Only actual accepted final consignment completion is counted; internal handoffs and redelivery cannot duplicate output. N=0 does not yield finite service intensity. Returned reusable cargo, waste and collected dust retain actual disposition rather than all becoming loss."
    source_ids:
      - ghg-product-2011
  - rule_id: asset_periods
    applies_to: "all nodes"
    rule: "Attribute native manufacturing/each actual lifecycle event using same-cohort consumed duty / positive supported total all-user useful duty, then divide once by N. Preserve construction, installation, repair/replacement/retirement dates, unfinished duty and stock across periods and users; actual terminal/road/provider coverage is exclusive. No universal vehicle/tyre/filter/road life or backhaul ratio."
    source_ids:
      - ghg-product-2011
  - rule_id: provider_and_recovery
    applies_to: "all nodes"
    rule: "A subcontracted actual freight/handling provider replaces documented native stage cells once; no recursion into own finished service or added duplicate supply/emissions/assets. Actual recovered cargo/dust reuse is linked through real transfer and receiver; do not assume fertilizer/material displacement credit or double-count recovered material as direct emission/waste."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_movement
      process_id: "road_movement"
      flow_role: "cargo service, actual propulsion and exhaust"
      record_type: "Actual primary meters/manifests/provider records"
      raw_fields: "consignment; cargo_identity; loaded_delivered_mass; each_weighing_wet_mass_moisture_fraction; actual_water_addition_rain_evaporation_retention_outgoing; moisture_basis; OD; distance; time; loaded_empty_failed_return_duty; diesel_opening_receipts_closing_transfers_spill_burn; AC_meter; PTO_share; quality; completed_N; all_users; allocation; period; native_unit; uncertainty; converted_wet_basis_fraction; moisture_conversion_equation"
      collection_method: "Link weighbridge and signed delivery to telematics/meters and actual shared-engine/PTO pool; close cargo dry-solids custody using each weighing moisture, its separate actual water ledger, and supplied/burned fuel independently before causal allocation and one N normalization. Record whether each moisture observation is wet-basis water mass / wet total mass or dry-basis water mass / dry solids. Retain the original observation, moisture basis, converted wet-basis fraction and conversion equation under exclusive_cargo_ledger before applying the dry-solids formula. Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator. Keep non-reference rows of this protocol in their own physical units."
      unit: "Item(s); kg; MJ; km; h"
      frequency: "Each event plus period reconciliation"
      temporal_coverage: "Actual service reporting period plus asset life phases"
      site_scope: "Actual vehicles/load sites/receiver silos/depots and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration; signed records; native provenance; causal allocation; uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_handling
      process_id: "bulk_handling"
      flow_role: "actual bulk transfer, pressure air, dust controls and fates"
      record_type: "Actual primary meters/manifests/provider records"
      raw_fields: "lot_material_composition; each_observation_wet_mass_moisture_fraction; actual_water_addition_rain_evaporation_retention_outgoing; moisture; loading_discharge_method; vehicle_receiver_silo; event_time; mass_before_after; PTO_fuel_AC; air_provider_native_quantity_pressure_temperature_humidity; blower_vent_filter_control; actual_specific_dust_size_medium_mass; collected_returned_waste_receiver; allocation; period; N; uncertainty; converted_wet_basis_fraction; moisture_conversion_equation"
      collection_method: "Use weighings, actual handling/pressure meters, vehicle and receiver-silo records and applicable species/size-specific dust measurement/method evidence; match captured/returned/direct/waste fate once with actual control state and shared-energy ownership. Record whether each moisture observation is wet-basis water mass / wet total mass or dry-basis water mass / dry solids. Retain the original observation, moisture basis, converted wet-basis fraction and conversion equation under exclusive_cargo_ledger before applying the dry-solids formula. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition. Record independently measured deliveries, releases and transfers at their own gates; any allocation applies to burdens."
      unit: "kg; MJ; actual native air/service units"
      frequency: "Each event plus period reconciliation"
      temporal_coverage: "Actual service reporting period plus asset life phases"
      site_scope: "Actual vehicles/load sites/receiver silos/depots and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration; signed records; native provenance; causal allocation; uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_support
      process_id: "support_lifecycle"
      flow_role: "cleaning, supplies and collected waste"
      record_type: "Actual primary meters/manifests/provider records"
      raw_fields: "site; event; water_source_native_quantity; chemicals; actual_cargo_residue; collected_stream_composition_moisture_native_quantity; retained_evaporated_direct_water; receiver; provider_coverage; allocation; period; N"
      collection_method: "Reconcile actual supply, custody and signed waste handovers by source/receiver; split incompatible streams and preserve cargo recovery versus waste. Retain provider native scope and allocate real quantity once. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition. Record independently measured deliveries, releases and transfers at their own gates; any allocation applies to burdens."
      unit: "kg; native waste/provider units"
      frequency: "Each event plus period reconciliation"
      temporal_coverage: "Actual service reporting period plus asset life phases"
      site_scope: "Actual vehicles/load sites/receiver silos/depots and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration; signed records; native provenance; causal allocation; uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_assets
      process_id: "support_lifecycle"
      flow_role: "vehicle blower filter road terminal full lifecycle"
