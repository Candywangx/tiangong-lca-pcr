      collection_method: "Read original orders/manifests and independent acceptance/handoff/route/provider logs, identify actual rail and passenger/road boundaries and each contributor. Count each original completed eligible obligation once, or one independently accepted contemporaneous amendedservice without also original. Allocate full actual duties and native provider quantity then divide positive N_eng once. Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator."
      unit: "Item(s); kg; km; actual native units"
      frequency: "Every actual event or asset change"
      temporal_coverage: "Full declared service cohort and attributed duty/asset periods"
      site_scope: "Every actual contributor/provider/all-user unit in this process"
