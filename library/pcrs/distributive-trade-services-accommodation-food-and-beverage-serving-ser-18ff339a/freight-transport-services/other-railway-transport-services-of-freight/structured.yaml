ctual loaded/empty/reposition/failure/support duties before normalization; do not give failed services zero burdens. Preserve original manifest/amount/state/quality/route and independently justified comparable engagement strata; an engagement count is not a claim that a car, a truck convoy and a special residual cargo are interchangeable. | ghg-product-2011 |\n\n"
