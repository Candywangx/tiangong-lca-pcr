    - protocol_id: cp_expand_other_species
      process_id: "other_rail_freight"
      flow_role: "Mandatory identity expansion other_species (outputs/elementary): Actual rail terminal or care pollutant species"
      record_type: "collected_record"
      raw_fields: "requirement_id=other_species; process_id=other_rail_freight; required_direction=outputs; required_flow_type=elementary; original_collection_protocol=cp_energy; applicability_evidence; occurrence_event_id; concrete_row_id; physical_identity; formulation_or_species; phase; carbon_origin; particle_fraction; source_compartment; receiving_compartment; supply_or_handover_gate; provider_covered_cells; asset_component_event_and_lifecycle_phase; native_property; native_unit; measured_native_quantity; source_record_id; allocation_all_users; normalization_denominator; per_identity_amount_calculation; verification_evidence; unresolved_reason; occurrence_to_row_reconciliation; substance_identity; chemical_form; environmental_compartment; carbon_origin; particle_fraction_or_count_basis; measured_or_calculated_release; species_conversion_evidence; applicability_decision_record; covered_concrete_rows; excluded_occurrence_reason; completion_evidence; observed_quantity_state; conversion_or_allocation_evidence"
      collection_method: "Each actual source/chemical/size/medium exhaust, railwheel/brake/rail/collector wear, care-refrigerant or cleaning release with model/measurement support. Terminal/cargo-manoeuvring tyre wear only if actually included and independently evidenced; cargo leaked refrigerant remains source-distinct. Treat this scope as a mandatory identification requirement, not an exchange. Use the original node protocol and its records; separate every actual identity, gate and independent function before quantification, then apply the retained amount/basis/evidence instructions to each compatible concrete row separately. Never use an aggregate amount across heterogeneous identities or infer the native property/unit from a group label. A conclusion that no occurrence took place must be supported by evidence; unknown applicability or identity blocks completion. Apply these recording instructions only to the stated outputs/elementary identity and gate (Actual rail terminal or care pollutant species). Activate for an actual release to its documented receiving compartment, supported by observation or an applicable calculation. Record exact substance/form, source or receiving compartment, fossil/biogenic origin where relevant, particle fraction or count-size basis where relevant and sampling period. Preserve reported elemental versus molecular bases; conversion needs stoichiometry and compatible species evidence. Contained pollutants belong to the receiver stream until the actual environmental release boundary. Do not replace missing species with CO2, NOx, VOC, COD or a generic particulate flow. For every applicability decision retain evidence. An evidenced absence closes only the stated scope and period; missing records remain unresolved. For a present requirement, map every occurrence to concrete row IDs and compatible native quantities, or to exact already-covered rows/provider cells, with a reason for each exclusion. Evidence must cover identity, support unit, calculation, source records and all fates. Existing and newly added branches are mutually exclusive coverage of the same event; never count the protocol itself as an exchange. Completion requires no unassigned occurrence, no duplicate coverage and no unresolved relevant quantity or identity. Collect raw fields for the evidenced branch. For each inapplicable operand record the branch decision; missing applicable quantities remain unresolved."
      unit: "Verified native property of this substance, resource or physical emission at its actual compartment"
      frequency: "Every actual occurrence and each evidenced absence decision"
      temporal_coverage: "Full declared cohort and attributable asset life/linked events"
      site_scope: "Actual responsible sites/providers of this process only"
      aggregation_rule: "Reconcile native event totals first. Combine only the same identity, state, unit, gate and period. Apply the matching calculation once to each resulting row: assign only still-shared burdens; divide a target total only by positive qualified output on the same basis. Keep already equivalent per-reference values and resolve zero-output periods without division."
      quality_evidence: "Match sampling or activity and applicable factor to species, phase, origin and compartment. Keep mass, particle number, heat and elemental-equivalent bases separate where applicable; document any conversion and exclude overlapping totals. For a row requiring Mass / kg, verify measurement or conversion to that basis. For the stated physical identity and matching input basis, apply the following quantity rule only at its specified attribution and normalization state: attributed_actual_species_medium_release_kg / N_eng Preserve original records, applied factors and resulting units. Value mode: calculated_value; Specificity: site_specific; Normalization basis: per declared reference flow; Basis kind: reference_flow; Evidence kind: calculated_from_collection; Collection protocol: cp_energy; Sources: ghg-product-2011. Require original records, exact native support and per-concrete-row verification; these instructions do not supply a missing identity or numerical value. Completion gate: check_occurrence_completion."
  calculation_rules:
    - id: completion
      applies_to: "other_rail_freight"
      rule: "Reference1Item(s) means ONE actual completed qualified rail-freight engagement defined before performance by its original cargo manifest, amount/state, pickup/rail route/handoff obligation and condition/acceptance criteria. It is a service engagement, not one vehicle, wagon, container, tonne or kilometre. N_eng is the count of independently identified engagements satisfying that obligation. Unresolved damage/loss/refusal or an uncompleted original engagement does not become successful output merely by retaining a travelled segment or reducing the manifest retrospectively. An independently documented contemporaneous accepted amended service may qualify under its own declared identity; do not also count the original. Actual partial/failed/empty/rescue/rework duties retain attributable burdens. No finite per-engagement intensity when N_eng=0."
      inputs:
        - "Original engagement/manifest/acceptance and actual unique completed obligations"
      output: "N_eng"
      source_ids:
        - ghg-product-2011
    - id: normalize
      applies_to: "other_rail_freight"
      rule: "q_x = allocated_native_quantity_x / N_eng for positive N_eng and reference1engagement. Allocate full actual loaded/empty/reposition/failure/support duties before normalization; do not give failed services zero burdens. Preserve original manifest/amount/state/quality/route and independently justified comparable engagement strata; an engagement count is not a claim that a car, a truck convoy and a special residual cargo are interchangeable."
      inputs:
        - "Actual allocated native quantities"
        - "positive N_eng"
      output: "Per declared1engagement native quantities"
      source_ids:
        - ghg-product-2011
    - id: asset_life
      applies_to: "other_rail_freight"
      rule: "attributed_asset = native_asset_quantity * attributed_same_asset_useful_duty / positive_total_all_user_same_asset_useful_duty; then divide by N_eng for manufacturing gate only, complete uncovered phases once."
      inputs:
        - "Actual same-asset native quantity"
        - "positive all-user duty"
      output: "Attributed native manufacturing quantity"
      source_ids:
        - ghg-product-2011
    - id: cargo_stock
      applies_to: "other_rail_freight"
      rule: "Customer motor vehicles, trailers and other freight are custody cargo, not traction assets or consumed newly manufactured inputs. Reconcile item identities/amounts and actual physical mass by lot/component/period into mutually exclusive accepted handoff, actual outward return, outgoing material/waste or direct release and closing retained cargo. Damage is a state of those items, not an extra balance term or automatic discard. Retained items remain closing stock; actual outgoing returns have one transfer id. Loaded trailer gross physical mass already includes its documented contents: record trailer, nested cargo and any packaging hierarchy without adding gross plus contents twice. An empty customer trailer being carried is cargo; an empty carrier wagon/reposition duty is not a delivered engagement. Cargo original manufacturing and embedded fuel/battery initial stock do not enter as new service-consumed product manufacture. Actual carrier-caused manoeuvring/charging/auxiliary consumption and supplied materials, service-related repair, loss, leakage or cleanup during responsibility must be recorded once with actual ownership/fates and uncovered burdens. The actual fuel or energy withdrawn and consumed from customer initial stocks carries its compatible upstream fuel/energy supply burden once, regardless of who purchased that stock; do not charge the entire initial stock or original vehicle/battery manufacture, and do not count that consumed portion again as both initial-stock withdrawal and new supply."
      inputs:
        - "Item/component/lot stocks"
        - "nested gross/net contents"
        - "actual condition and fates"
      output: "Exclusive actual cargo/part/fluid/stock closure"
      source_ids:
        - ghg-product-2011
  data_quality_requirements:
    - id: strata
      applies_to: "other_rail_freight"
      requirement: "Enumerate actual cargo vehicle/residual identities, original engagement amount/route/condition, loading/care/traction/sites/periods and all contributors. Aggregate only equivalent declared service strata using documented actual weights; disclose distributions and heterogeneity, no blanket comparison of unlike engagements."
      evidence: "Complete original engagement/contributor/weight registry"
    - id: completeness
      applies_to: "other_rail_freight"
      requirement: "Expand every actual energy/material/chemical/care supply, equipment/provider, damaged part/residue/waste and pollutant into an individual exchange with identity/state/gate/receiver, direction/type, native property/unit/quantity, verified UUID or row-addressable unresolved registration, own-process protocol and source/calculation. Cargo fuel/fluid/refrigerant/battery releases differ from locomotive/terminal fuel or refrigerant; match actual substance, origin, chemical versus C/N/S basis, size and receiving medium. Wet materials or cleanup streams close actual dry-solid/water additions, drains/evaporation and retained/delivered states where relevant, not forced wet-mass equality. Missing actual evidence is incomplete, not zero."
      evidence: "Actual source/state/coverage/fate ledger for every expanded row"
    - id: uncertainty
      applies_to: "other_rail_freight"
      requirement: "No invented loading/empty/mileage/damage/repair/charge/SOC/temperature/securement/lifetime/recovery ranges or factors. Use calibrated actual measurements or reviewed compatible models with sample coverage, independent QA and uncertainty; paidmanual/publicexample does not supply missing universal data."
      evidence: "Calibration, samples, applicable model checks and sensitivity"
validation_rules:
  - rule_id: scope_function
    applies_to: "other_rail_freight"
    rule: "Verify cars/trucks/trucktrailers PLUS actual freight n.e.c., official adjacent-category and passenger-accompanyingvehicle exclusion, actual full handling/rail/condition routes. Check original manifest/completion criteria and unique positive N_eng; reject retrospective failed-scope reduction, duplicate bills or changing one service into vehicle count."
    source_ids:
      - ghg-product-2011
  - rule_id: custody
    applies_to: "other_rail_freight"
    rule: "Verify cargo versus carrier asset/manufacture, item/component/nested mass/stock closure and distinct damage state, actual return/recovery/waste/release/retained fates. Separate actual cargo fuel/fluid/battery/care consumption and emissions from rail/terminal supply; reusable gear closure and provider boundaries once."
    source_ids:
      - ghg-product-2011
  - rule_id: native_lifecycle
    applies_to: "other_rail_freight"
    rule: "Verify actual exchange/type/state/native property/unit/gate/receiver, every relevant same-asset all-user lifecycle phase and provider covered cell. Count native property identifies dimension only; it is not the service UUID or evidence of equal service quantities."
    source_ids:
      - ghg-product-2011
  - rule_id: parity_quality
    applies_to: "other_rail_freight"
    rule: "Align EN/ZH/projection ids, actual conditional scope/quantities, original reference and source limits. Actual measurements or reviewed applicable models need calibration, independent QA and uncertainty; missing is incomplete and checker pass does not prove scientific or external identity readiness."
    source_ids:
      - ghg-product-2011
  - rule_id: atomic_other_rail_freight
    applies_to: "other_rail_freight"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
