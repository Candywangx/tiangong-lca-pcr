allocation_rules:
  - rule_id: subdivide
    applies_to: "other_rail_freight"
    rule: "Directly measure/subdivide actual consignment/cargo, locomotive/consist/wagon/segment/yard, terminal loading/securement/care and all intended service outputs and handoffs. Cargo vehicles are not newly manufactured service co-products; include every co-carried cargo and other asset/user."
    source_ids:
      - ghg-product-2011
  - rule_id: causal
    applies_to: "other_rail_freight"
    rule: "Justify shared traction using actual consist/gross physical load/space or capacity constraints, and cargo-specific handling by actual time/amount/state/equipment constraints. Engagement count is the normalization function, not a universal equal-consignment allocation driver. For multiple rail/passenger/road/provider functions retain explicit coverage and causal all-user shares; justify/test alternatives if physical causality unavailable."
    source_ids:
      - ghg-product-2011
  - rule_id: life_period
    applies_to: "other_rail_freight"
    rule: "Separate customer cargo vehicles from carrier locomotives, wagons/autoracks/decks/chocks/lashings, ramps/lifts, track/points/ballast/electrification, yards and terminals. For each actual asset cohort retain manufacture/installation, operation, maintenance/replacement and retirement coverage. Manufacturing-gate native supply is attributed by same-asset positive all-user useful duty, not a whole-life assertion; complete uncovered phases once. Reusable securing/protection equipment uses actual opening/purchase/repair/use/loss/return/retire/closing stock and all-user lifetime, not a new item every load. No assembly/initial-part/provider/foreground or recovery-credit duplication. Native subcontracted carrier/loading/terminal/care/repair/treatment replaces exact covered cells once; remaining actual lifecycle/duties remain."
    source_ids:
      - ghg-product-2011
  - rule_id: normalize
    applies_to: "other_rail_freight"
    rule: "q_x = allocated_native_quantity_x / N_eng for positive N_eng and reference1engagement. Allocate full actual loaded/empty/reposition/failure/support duties before normalization; do not give failed services zero burdens. Preserve original manifest/amount/state/quality/route and independently justified comparable engagement strata; an engagement count is not a claim that a car, a truck convoy and a special residual cargo are interchangeable."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "other_rail_freight"
