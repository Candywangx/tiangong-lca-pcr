system_boundary:
  rules:
    - rule_id: scope
      applies_to: "other_rail_freight"
      rule: "Cover railway carriage of cars, trucks and truck trailers, plus all other actual railway freight n.e.c. after resolving the dedicated refrigerated, tank-car, mail, intermodal-container and dry-bulk railway service categories. Actual open/closed/flat/low-floor/autorack/suitable special wagons, roll-on/roll-off, lift-on and other evidenced loading methods are conditional routes, not an autorack-only or new-car-only category. Exclude passengers and their accompanying vehicles (CPC64210), independent nonrail freight, cargo manufacture/trading/repair as an independent product, and bare equipment rental. Determine actual transport function and official classification before including borderline accompanied-freight/loaded-trailer/swap-body cases; a driver presence or a commercial intermodal label alone does not decide classification."
      source_ids:
        - unsd-cpc3-65129
    - rule_id: rail_duties
      applies_to: "other_rail_freight"
      rule: "Declare actual custody/loading/rail carriage and delivery/unloading gates, all carrier/terminal/yard subcontractors and all co-carried cargo. Retain actual locomotive/consist/wagon/segment/yard/shunting/interchange/linehaul, dwell/idling, empty/reposition, failed/rejected/rescue/return and cleaning/changeover duties. Actual propulsion, AC/DC/charging/energy supply and gross physical load/space constraints govern inputs. Duplicate bills or terminal handoffs do not add another engagement. Independent road collection/delivery or passenger services require separately identified functions and allocation; they are not silently relabelled rail freight."
      source_ids:
        - epa-rail-facility-operations
        - oebb-freight-terminals
        - ghg-product-2011
    - rule_id: cargo_handling
      applies_to: "other_rail_freight"
      rule: "Vehicle or residual-cargo-specific handling/protection remains conditional: actual inspection before/after custody, ramps/lifts/autorack decks, chocks/ties/lashing, geometry/clearance/axle/space constraints, enclosed/open weather protection, and actual cargo condition controls and loading/unloading equipment. Resolve special temperature, ventilation, humidity, hazardous or energy-containing cargo needs from actual manifest and official category; include actual auxiliary energy, refrigerant loss or containment/spill treatment only where this eligible residual freight function needs them. Do not invent a universal charge state, fuel allowance, damage rate, tiedown count, temperature, load factor or safety mandate. Public AAR/ÖBB examples do not provide worldwide numeric rules."
      source_ids:
        - aar-auto-quality-overview
        - aar-open-top-overview
        - oebb-freight-terminals
        - ghg-product-2011
    - rule_id: cargo_custody
      applies_to: "other_rail_freight"
      rule: "Customer motor vehicles, trailers and other freight are custody cargo, not traction assets or consumed newly manufactured inputs. Reconcile item identities/amounts and actual physical mass by lot/component/period into mutually exclusive accepted handoff, actual outward return, outgoing material/waste or direct release and closing retained cargo. Damage is a state of those items, not an extra balance term or automatic discard. Retained items remain closing stock; actual outgoing returns have one transfer id. Loaded trailer gross physical mass already includes its documented contents: record trailer, nested cargo and any packaging hierarchy without adding gross plus contents twice. An empty customer trailer being carried is cargo; an empty carrier wagon/reposition duty is not a delivered engagement. Cargo original manufacturing and embedded fuel/battery initial stock do not enter as new service-consumed product manufacture. Actual carrier-caused manoeuvring/charging/auxiliary consumption and supplied materials, service-related repair, loss, leakage or cleanup during responsibility must be recorded once with actual ownership/fates and uncovered burdens. The actual fuel or energy withdrawn and consumed from customer initial stocks carries its compatible upstream fuel/energy supply burden once, regardless of who purchased that stock; do not charge the entire initial stock or original vehicle/battery manufacture, and do not count that consumed portion again as both initial-stock withdrawal and new supply."
      source_ids:
        - ghg-product-2011
    - rule_id: completion
      applies_to: "other_rail_freight"
      rule: "Reference1Item(s) means ONE actual completed qualified rail-freight engagement defined before performance by its original cargo manifest, amount/state, pickup/rail route/handoff obligation and condition/acceptance criteria. It is a service engagement, not one vehicle, wagon, container, tonne or kilometre. N_eng is the count of independently identified engagements satisfying that obligation. Unresolved damage/loss/refusal or an uncompleted original engagement does not become successful output merely by retaining a travelled segment or reducing the manifest retrospectively. An independently documented contemporaneous accepted amended service may qualify under its own declared identity; do not also count the original. Actual partial/failed/empty/rescue/rework duties retain attributable burdens. No finite per-engagement intensity when N_eng=0."
      source_ids:
        - ghg-product-2011
    - rule_id: assets_providers
      applies_to: "other_rail_freight"
      rule: "Separate customer cargo vehicles from carrier locomotives, wagons/autoracks/decks/chocks/lashings, ramps/lifts, track/points/ballast/electrification, yards and terminals. For each actual asset cohort retain manufacture/installation, operation, maintenance/replacement and retirement coverage. Manufacturing-gate native supply is attributed by same-asset positive all-user useful duty, not a whole-life assertion; complete uncovered phases once. Reusable securing/protection equipment uses actual opening/purchase/repair/use/loss/return/retire/closing stock and all-user lifetime, not a new item every load. No assembly/initial-part/provider/foreground or recovery-credit duplication. Native subcontracted carrier/loading/terminal/care/repair/treatment replaces exact covered cells once; remaining actual lifecycle/duties remain."
      source_ids:
        - ghg-product-2011
    - rule_id: atomic
      applies_to: "other_rail_freight"
      rule: "Expand every actual energy/material/chemical/care supply, equipment/provider, damaged part/residue/waste and pollutant into an individual exchange with identity/state/gate/receiver, direction/type, native property/unit/quantity, verified UUID or row-addressable unresolved registration, own-process protocol and source/calculation. Cargo fuel/fluid/refrigerant/battery releases differ from locomotive/terminal fuel or refrigerant; match actual substance, origin, chemical versus C/N/S basis, size and receiving medium. Wet materials or cleanup streams close actual dry-solid/water additions, drains/evaporation and retained/delivered states where relevant, not forced wet-mass equality. Missing actual evidence is incomplete, not zero."
      source_ids:
        - ghg-product-2011
