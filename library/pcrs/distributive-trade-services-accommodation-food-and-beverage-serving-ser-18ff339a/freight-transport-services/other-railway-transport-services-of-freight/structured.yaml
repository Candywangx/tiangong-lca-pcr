      unit: "kg; MJ; actual native units"
      frequency: "Every actual event or asset change"
      temporal_coverage: "Full declared service cohort and attributed duty/asset periods"
      site_scope: "Every actual contributor/provider/all-user unit in this process"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration, energy source/stocks/SOC records, applicable emission model independent QA Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
