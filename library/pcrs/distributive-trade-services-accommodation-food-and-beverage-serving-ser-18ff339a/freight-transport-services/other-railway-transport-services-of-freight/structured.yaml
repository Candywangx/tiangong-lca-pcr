      markdown: "## 9. Validation Rules\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_function | other_rail_freight | Verify cars/trucks/trucktrailers PLUS actual freight n.e.c., official adjacent-category and passenger-accompanyingvehicle exclusion, actual full handling/rail/condition routes. Check original manifest/completion criteria and unique positive N_eng; reject retrospective failed-scope reduction, duplicate bills or changing one service into vehicle count. | ghg-product-2011 |\n| custody | other_rail_freight | Verify cargo versus carrier asset/manufacture, item/component/nested mass/stock closure and distinct damage state, actual return/recovery/waste/release/retained fates. Separate actual cargo fuel/fluid/battery/care consumption and emissions from rail/terminal supply; reusable gear closure and provider boundaries once. | ghg-product-2011 |\n| native_lifecycle | other_rail_freight | Verify actual exchange/type/state/native property/unit/gate/receiver, every relevant same-asset all-user lifecycle phase and provider covered cell. Count native property identifies dimension only; it is not the service UUID or evidence of equal service quantities. | ghg-product-2011 |\n| parity_quality | other_rail_freight | Align EN/ZH/projection ids, actual conditional scope/quantities, original reference and source limits. Actual measurements or reviewed applicable models need calibration, independent QA and uncertainty; missing is incomplete and checker pass does not prove scientific or external identity readiness. | ghg-product-2011 |\n| atomic_other_rail_freight | other_rail_freight | Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review. | ghg-product-2011 |\n| check_occurrence_completion | all actual rows and identification protocols | Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion. |  |\n\n"
