allocation_rules:
  - rule_id: direct_first
    applies_to: "ocean_container_leg"
    rule: "Assign actual dedicated box/cargo-condition,terminal and metered resources directly before residual common-voyage/pool attribution. Enumerate all actual independently supplied laden-box legs and other intended services with real handovers. Cargo,box asset,internal transfers and own subtasks are not competing final outputs."
    source_ids:
      - ghg-product-2011
  - rule_id: all_users
    applies_to: "ocean_container_leg"
    rule: "Reconcile real box/cargo net/gross/tare,slot/space-time,route/sea work,time and native propulsion/condition demand for all served users. Supported actual causal drivers may use work,compatible mass-distance,occupied slot/space-time or metered resources;TEU,nominal vessel capacity,money,equal fractions or adding unlike units are not defaults. Keep empty/ballast/anchor/berth/failure/return burdens in evidenced serving pool once."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "ocean_container_leg"
    rule: "Use each actual ship,container/reefer,terminal/crane/berth asset native delivered quantity times studied compatible duty divided by positive documented same-asset all-user useful lifetime duty,then/N once. For a container include actual sea/road/rail and other users where served;vessel and port pools include all actual served functions/periods. Initial manufacture,maintenance,replacements and retirement are disjoint."
    source_ids: []
  - rule_id: reject_recovery
    applies_to: "ocean_container_leg"
    rule: "Keep rejected/damaged/lost/returned/retained cargo/box states and producing duties with actual owner and receiver. Original-to-amended acceptance requires genuine chronology and comparability,not postfailure scope shrink;N=0 retains burden. Actual replacement,recovered material/product,waste and direct release have distinct native treatment,no automatic cargo manufacture or avoided-material/energy credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_service
      process_id: "ocean_container_leg"
      flow_role: "completed_ocean_container_leg;other_intended_services"
      record_type: "actual_box_carrier_custody_acceptance"
      raw_fields: "carrier_contract/box;cargo_articles_packages;box_identity_type_size;net_gross_packaging_dunnage_box_tare_verified_mass;original_scope_quality_gates;chronological_amendments;actual_searoute_distance_time_ports_transshipment;independent_completed_leg_acceptance_N;failed_rejected_partial_return_retained;all_outputs"
      collection_method: "Reconcile actual original/genuine amended laden-container carrier obligation,gates and quality with independent completed handover. Keep real voyage/ship change/port call and cargo/box mass/custody distinct from final output;verified gross mass,arrival or payment alone is not acceptance. Build the qualified denominator from unique accepted output on the declared reference basis. Retain disqualified events and their resource duties separately. Keep the reference amount fixed; normalize only attributable inventory totals by the positive denominator."
      unit: "Item(s);kg;actual box/cargo units;km;h"
      frequency: "Each actual event and aligned carrier-leg cohort"
      temporal_coverage: "Actual reporting period and disclosed complete duty/life interfaces"
      site_scope: "Every actual ship,port,terminal,box-operator,provider and all users/modes"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original calibrated source/meter/custody/receiver records,scope and uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_operation
      process_id: "ocean_container_leg"
      flow_role: "compatible_diesel;other_bunker_fuels;shore_ac;other_native_energy"
      record_type: "actual_ship_native_duty_energy"
