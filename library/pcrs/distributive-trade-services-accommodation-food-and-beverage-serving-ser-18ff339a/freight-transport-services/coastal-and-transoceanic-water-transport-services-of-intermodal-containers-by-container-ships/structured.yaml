  calculation_rules:
    - id: normalize
      applies_to: "all inventory rows"
      rule: "I_x = A_x / N,where A_x is actual native quantity attributed to the comparable accepted laden-box-leg cohort after direct/causal all-user attribution and N is positive actual completed accepted carrier legs. N=0 retains burden without finite intensity."
      inputs:
        - A_x
        - N
      output: "native inventory per completed laden-box leg"
      source_ids: []
    - id: supplier_native
      applies_to: "provider rows"
      rule: "A_x = q_u * D_u * s,where q_u is compatible provider inventory per native unit u,D_u actual same-unit demand,and s evidenced cohort/all-user share. Replace exact covered cells before A_x/N once;no default container/TEU/tkm conversion."
      inputs:
        - q_u
        - D_u
        - s
        - N
      output: "attributed native provider inventory"
      source_ids: []
    - id: asset_life
      applies_to: "asset rows"
      rule: "A_asset = Q_asset * U_studied / U_life,with actual native delivered Q_asset and compatible same-asset duties U_studied/U_life. U_life is positive documented all-user useful lifetime duty,including all actual served modes/functions. I_asset = A_asset / N once;replacement/maintenance/retirement separately close."
      inputs:
        - Q_asset
        - U_studied
        - U_life
        - N
      output: "native asset quantity per completed leg"
      source_ids: []
    - id: stock_fate
      applies_to: "fuel,refrigerant and native material rows"
      rule: "Opening + supplied + transfers_in = closing + consumed + transferred_out + recovered_external + evidenced_release + unresolved_residual. Terms use actual compatible native units and are mutually exclusive;internally recovered energy/material/refrigerant retained in closing stock is not extra external product. Unknown residual requires investigation,not automatic burn,leak,evaporation or waste."
      inputs:
        - Opening
        - supplied
        - transfers_in
        - closing
        - consumed
        - transferred_out
        - recovered_external
        - evidenced_release
        - unresolved_residual
      output: "reconciled native stock and fate ledger"
      source_ids: []
    - id: cargo_box_custody
      applies_to: "actual entrusted cargo and boxes"
      rule: "Opening + received = accepted_handovers + returned + retained_closing + actual_recovered_transfer + actual_waste_transfer + evidenced_other_loss + unresolved_custody,on each actual compatible cargo/box count or measured material basis. Internal transfers/transshipment cancel at declared boundary;mutually exclusive real fates and separately measured material quantities do not establish N by themselves. An overboard/unknown loss is not automatically full elementary emission or collected waste."
      inputs:
        - Opening
        - received
        - accepted_handovers
        - returned
        - retained_closing
        - actual_recovered_transfer
        - actual_waste_transfer
        - evidenced_other_loss
        - unresolved_custody
      output: "reconciled cargo and box custody ledger"
      source_ids: []
  data_quality_requirements:
    - id: qualifier_acceptance
      applies_to: "reference output"
      requirement: "Original/genuine chronological amended box/cargo identity,size/type,net/gross/packaging/tare,actual sea route/gates/time/condition and independent accepted service substantiate comparable N. Verified gross mass or physical arrival is not acceptance alone;retain failed/partial/adverse duties."
      evidence: "cp_service;cp_condition"
    - id: atomic_route
      applies_to: "all actual exchanges"
      requirement: "Every real conditional branch requires atomic identity/type/direction/state/native property/unit/quantity,own-process protocol and collection/source provenance. Dry/reefer/alternative drive and discharge absence needs actual affirmative evidence;unknown is not zero."
      evidence: "cp_operation;cp_condition;cp_fates;cp_maintenance;cp_emissions"
    - id: provider_life
      applies_to: "provider and asset rows"
      requirement: "Document exact included phase/event/site/period cells,real all-user/all-mode compatible duty and positive same-asset lifetime denominator. Complete uncovered construction/initial/replacement/maintenance/retirement and real carrier gap responsibility;forecasts retain basis/sensitivity."
      evidence: "cp_assets;cp_provider"
    - id: sites_periods
      applies_to: "shared pools"
      requirement: "Index every contributing ship/port/terminal/box-operator/provider and reporting/lifecycle period with all intended services/users. Aggregate attributed native raw quantities before coherent N,not means of unlike box/route/condition intensities."
      evidence: "cp_service;cp_operation;cp_assets"
    - id: fates
      applies_to: "cargo,resource and environmental transfers"
      requirement: "Trace actual cargo/box loss/replacement,cooling/ballast source/intake/treatment/discharge,oil/scrubber/sewage/garbage,waste/recovery/stock and real substance/carbon origin/receiver. Own/provider coverage and native uncertainty required;no unknown residual assigned automatically to sea/air/waste."
      evidence: "cp_fates;cp_condition;cp_emissions"
validation_rules:
  - rule_id: service_box
    applies_to: "ocean_container_leg"
    rule: "Verify one actual accepted laden-container coastal/ocean container-ship carrier leg,reference 1 Item(s),actual cargo/box/gates/route/time/quality and positive comparable N. TEU,ship/port departure,verified gross mass,arrival or payment alone cannot replace accepted original/genuine amended obligation;retain failed/adverse events."
    source_ids: []
  - rule_id: scope_condition
    applies_to: "ocean_container_leg"
    rule: "Verify complete actual container-ship articles/packages scope and actual dry/special/reefer routes;other-mode and refrigerator-vessel-compartment functions are distinct. Required actual loading/lashing/stowage/terminal/temperature/time/generator/refrigerant ownership and gap responsibility need native evidence,not universal cold assumptions or omitted care."
    source_ids: []
  - rule_id: native_energy_life
    applies_to: "ocean_container_leg"
    rule: "Reconcile actual bunker/native energy supply/stock/burn/spill,main/auxiliary/reefer and external shore/terminal meters without counting onboard generation as extra purchase. Verify actual empty/ballast/anchor/berth/failure duties,provider covered cells,all users/modes/sites/periods and positive same-asset life with disjoint construction/initial/replacement/maintenance/retirement."
    source_ids: []
  - rule_id: fates
    applies_to: "ocean_container_leg"
    rule: "Reconcile actual cargo/box custody and replacement owner,resource intake/ballast/cooling discharge and waste/recovery/stock/direct release by actual substance/native gate/receiver. Known air/water subcompartment requires exact identity;no full cargo/box loss as generic emission,unknown stock as leak or retained recovery as extra output."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "ocean_container_leg"
    rule: "Every actual atomic exchange needs own-process protocol,real direction/type/state/source/receiver,native quantity/property/unit and compatible identity or registered unresolved requirement. Verify bilingual reference/cards/methods/profile and generated projection. Target pass is not UUID,operating safety,scientific or publication approval."
    source_ids: []
  - rule_id: atomic_ocean_container_leg
    applies_to: "ocean_container_leg"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified coastal/ocean container-ship carrier-leg inventory for downstream process/lifecyclemodel projections"
  allowed_use: "Qualified completed laden-container coastal/ocean carrier legs with harmonized real cargo/box/gates,route/time/quality,condition duty and complete attributable lifecycle after required identity/data review."
  excluded_use: "Unqualified TEU/slot/ship trip or generic tkm;ordinary cargo/container/ship manufacture,other mode or refrigerator-vessel-compartment function;empty/failure output relabelled as laden service;duplicate internal generated electricity or incomplete actual fates treated as zero."
  required_metadata: "actual_container_identity_type_size_and_articles_packages; cargo_net_gross_packaging_dunnage_box_tare_and_verified_mass; actual_carrier_custody_origin_destination_and_original_amended_quality; actual_sea_route_distance_voyage_time_ports_and_transshipment; N_comparable_completed_laden_box_carrier_legs_not_TEU; sailing_manoeuvre_anchor_berth_empty_ballast_failure_return_duties; actual_bunker_grade_blend_phase_source_native_supply_burn_stock; native_external_shore_and_terminal_AC_vs_internal_ship_generation; conditional_reefer_temperature_time_plug_generator_refrigerant_owner; real_loading_lashing_stowage_terminal_pilot_tug_provider_gates; all_user_all_mode_same_asset_ship_container_port_lifetime_sites_periods; actual_ballast_cooling_intake_discharge_treatment_and_receiver; cargo_loss_replacement_native_species_carbon_origin_fates_and_uncertainty"
  required_quality_disclosure: "Scope and original/amended acceptance,native provider coverage,actual data gaps,causal pools,all-user asset forecasts,stock/custody/fate closure and uncertainty."
  update_trigger: "Changed actual cargo/box/gates/route/quality,ship/propulsion/shore or reefer duty,provider scope,asset life/allocation or actual resource/substance/fate."
data_sources:
  - id: "unsd-ocean-container-2025"
    type: "official_guidance"
    reference: "UNSD,CPC3.0 65213,30June2025. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/65213"
    used_for: "Official full coastal/transoceanic container-ship articles/packages scope only;one completed laden-box carrier-leg Count is explicit PCR choice."
  - id: "imo-vgm-context"
    type: "official_guidance"
    reference: "IMO,Verification of the gross mass of a packed container,accessed22October2026. https://www.imo.org/en/ourwork/safety/pages/verification-of-the-gross-mass.aspx"
    used_for: "Qualitative actual packed gross mass versus cargo/packaging/securing/container tare and shipper/master/terminal responsibility context only. Not a universal PCR denominator,quality acceptance or numerical allocation rule;actual package records/gates required."
  - id: "ctu-carrier-2014"
    type: "official_guidance"
    reference: "IMO/ILO/UNECE,CTU Code2014,4.2.8 carrier functions. https://wiki.unece.org/spaces/TransportSustainableCTUCode/pages/23101907/4.2%2BFunctions%2Bwithin%2Bthe%2Bsupply%2Bchain"
    used_for: "Dated carrier agreed-temperature monitoring/reaction context only. Actual dry/reefer requirements,owner,power,refrigerant and provider boundaries require real records;no universal temperature/time or cooling quantity."
  - id: "imo-marine-context"
    type: "official_guidance"
    reference: "IMO,Pollution Prevention,accessed22October2026. https://www.imo.org/en/ourwork/environment/pages/pollution-prevention.aspx"
    used_for: "Qualitative actual ship oil/packaged-substance/sewage/garbage/air,ballast/antifouling,recycling and reception-facility pathway questions only. No universal legal limit,crew rate,discharge/emission/lifetime factor or automatic full cargo loss fate."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD,Product Life Cycle Accounting and Reporting Standard,2011,ch6-9. https://ghgprotocol.org/product-standard"
    used_for: "General functional/lifecycle,disclosure and allocation framework only. Box-leg Count,causal/native-demand/asset-life,stock and custody equations are explicit PCR methods,not externally prescribed ship factors."
