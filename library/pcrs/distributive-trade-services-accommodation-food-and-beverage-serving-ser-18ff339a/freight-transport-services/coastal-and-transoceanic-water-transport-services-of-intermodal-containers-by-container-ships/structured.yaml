      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| direct_first | ocean_container_leg | Assign actual dedicated box/cargo-condition,terminal and metered resources directly before residual common-voyage/pool attribution. Enumerate all actual independently supplied laden-box legs and other intended services with real handovers. Cargo,box asset,internal transfers and own subtasks are not competing final outputs. | ghg-product-2011 |\n| all_users | ocean_container_leg | Reconcile real box/cargo net/gross/tare,slot/space-time,route/sea work,time and native propulsion/condition demand for all served users. Supported actual causal drivers may use work,compatible mass-distance,occupied slot/space-time or metered resources;TEU,nominal vessel capacity,money,equal fractions or adding unlike units are not defaults. Keep empty/ballast/anchor/berth/failure/return burdens in evidenced serving pool once. |  |\n| same_asset_life | ocean_container_leg | Use each actual ship,container/reefer,terminal/crane/berth asset native delivered quantity times studied compatible duty divided by positive documented same-asset all-user useful lifetime duty,then/N once. For a container include actual sea/road/rail and other users where served;vessel and port pools include all actual served functions/periods. Initial manufacture,maintenance,replacements and retirement are disjoint. |  |\n| reject_recovery | ocean_container_leg | Keep rejected/damaged/lost/returned/retained cargo/box states and producing duties with actual owner and receiver. Original-to-amended acceptance requires genuine chronology and comparability,not postfailure scope shrink;N=0 retains burden. Actual replacement,recovered material/product,waste and direct release have distinct native treatment,no automatic cargo manufacture or avoided-material/energy credit. |  |\n\n"
