      collection_method: "Meter actual native bunker/shore/other supply and main/auxiliary operating duty. Reconcile stock,withdrawal,burn and internal generation/recovery;ship-generated reefer/auxiliary electricity is not external purchase. Attribute real serving-user pool and gaps once before normalization. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition."
      unit: "kg;kWh;actual native energy/duty units;h"
      frequency: "Each actual event and aligned carrier-leg cohort"
      temporal_coverage: "Actual reporting period and disclosed complete duty/life interfaces"
      site_scope: "Every actual ship,port,terminal,box-operator,provider and all users/modes"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original calibrated source/meter/custody/receiver records,scope and uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
    - protocol_id: cp_condition
