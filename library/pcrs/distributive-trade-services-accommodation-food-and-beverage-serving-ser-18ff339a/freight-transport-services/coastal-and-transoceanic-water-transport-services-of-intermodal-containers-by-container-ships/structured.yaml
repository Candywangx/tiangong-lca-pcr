      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual laden-box/cargo state,carrier custody and owed handling/condition responsibility at real sea/terminal/box-operator native gates. |\n| starting_condition_role | Foreground collection interface,not zero upstream supply or asset burden. |\n| product_classification_scope | CPC 3.0 65213 |\n| recursive_input_rule | Use compatible actual same-function native subcontract demand once;complete mandatory uncovered stages,no purchased self-service or final internal-transfer output. |\n| upstream_dataset_requirement | Actual function,cargo/box/gates,technology,geography,period,phases and native unit compatible;complete missing lifecycle and condition interfaces. |\n| disclosure | actual_container_identity_type_size_and_articles_packages; cargo_net_gross_packaging_dunnage_box_tare_and_verified_mass; actual_carrier_custody_origin_destination_and_original_amended_quality; actual_sea_route_distance_voyage_time_ports_and_transshipment; N_comparable_completed_laden_box_carrier_legs_not_TEU; sailing_manoeuvre_anchor_berth_empty_ballast_failure_return_duties; actual_bunker_grade_blend_phase_source_native_supply_burn_stock; native_external_shore_and_terminal_AC_vs_internal_ship_generation; conditional_reefer_temperature_time_plug_generator_refrigerant_owner; real_loading_lashing_stowage_terminal_pilot_tug_provider_gates; all_user_all_mode_same_asset_ship_container_port_lifetime_sites_periods; actual_ballast_cooling_intake_discharge_treatment_and_receiver; cargo_loss_replacement_native_species_carbon_origin_fates_and_uncertainty |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| scope_and_box | ocean_container_leg | Apply the full actual coastal/ocean container-ship articles/packages function,including actual special/reefer CTUs where applicable. The actual refrigerator-vessel compartment function and other vessel/commodity categories remain distinct. Declare real box size/type,cargo packaging,route/gates and independently supplied leg obligation;classification does not imply universal TEU or cargo-mass reference. | unsd-ocean-container-2025 |\n| custody_mass_acceptance | ocean_container_leg | Keep actual cargo net mass,packaging/pallet/dunnage/securing mass,container tare,packed gross mass and vessel/slot exposure distinct. Actual shipper/master/terminal mass/stowage evidence informs loading responsibility,not automatic completed-service acceptance or final output. Original/genuine chronological amended custody gates,condition and actual acceptance determine comparable N;record adverse outcomes and failed duties. | imo-vgm-context |\n| sea_duties | ocean_container_leg | Include attributable actual sailing/manoeuvring,pilot/tug/port assistance,anchoring,berthing,waiting,empty/ballast repositioning,border/transshipment,failed/recovery/return and cargo-condition duty through actual carrier gates. A voyage/port call,reefer plug,internal transfer or ship change is not an additional final box-leg. Independently supplied terminal/other-mode work has its actual boundary and native demand. |  |\n| native_energy | ocean_container_leg | Keep actual bunker grade/blend/composition/carbon origin,phase/source,supplied/stock/withdrawn/burned/spilled/recovered quantities and each main/auxiliary/genset duty distinct. Actual LNG,methanol,residual fuels,hydrogen,batteries or other drives need own identities;compatible diesel is not all marine fuel. External shore/terminal AC uses real native meters;onboard internally generated reefer/auxiliary electricity is allocated from its actual fuel/energy once,not a second external purchase. |  |\n| reefer_interfaces | ocean_container_leg | For actual temperature-controlled CTUs record original agreed cargo temperature/time/ventilation requirements,real ship/terminal/container-operator handover,power source,meters,generator fuel and refrigerant charge/leak/recovery/retirement. Required monitoring/reaction and uncovered gap duties have one owner;dry-box absence needs actual evidence. A complete carrier/reefer provider replaces exact covered cells,not duplicate ship fuel,electricity,equipment or refrigerant release. | ctu-carrier-2014 |\n| assets_provider_life | ocean_container_leg | Actual vessel/hull/engine/driver,container/reefer/lashing equipment,cranes/terminal/berth/support infrastructure and relevant port works need native construction/manufacture,initial/replacement,maintenance and end-of-life gates with positive same-asset all-user useful lifetime duty. Include real served commodities,customers,modes,sites and periods;cargo is not vessel/container asset. Whole carrier/terminal/box-operator results replace exact included phase/event cells once,complete missing lifecycle and responsibility. |  |\n| marine_fates | ocean_container_leg | Collect actual ballast/cooling resource water and treatment/discharge,oil/bilge/sludge/scrubber residuals,sewage/garbage,coatings/fouling and ship/container retirement streams where real. Separate environmental intake,direct water/air/soil release,collected waste and external recovered product at actual source/receiver and provider gate. Cargo/box loss or unknown stock residual does not automatically become air emission,marine waste or complete release;actual species,carbon origin,receiver and uncertainty required. | imo-marine-context |\n\n"
