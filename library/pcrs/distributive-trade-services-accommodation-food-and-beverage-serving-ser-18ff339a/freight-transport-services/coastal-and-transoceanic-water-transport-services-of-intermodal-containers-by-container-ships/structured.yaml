      record_type: "actual_container_condition_handling"
      raw_fields: "box/cargo;original_temperature_time_ventilation_quality;actual_ship_terminal_boxoperator_handover;loading_lift_lash_stow;power_source_meter_genset_fuel;onboard_internal_vs_externalAC;refrigerant_identity_initial_service_charge_removed_recovered_retained_leaked_retired;actual_securing_packaging_native_supplies;covered_cells_gaps_uncertainty"
      collection_method: "Collect actual required loading/securing/condition records and real owners across ship/terminal/operator interfaces. Trace power source and internal ship energy versus external native supply,refrigerant stock/fates and included supplier phases. Dry/other condition absence needs actual evidence,no blanket reefer demand or supply-equals-leak. Keep native observations and reconciliation totals on their recorded basis. For burden rows, attribute only the still-shared total and divide an assigned total only by positive qualified output of the same cohort and gate. Preserve already equivalent per-reference results. At zero output retain the burden for documented disposition. Record independently measured deliveries, releases and transfers at their own gates; any allocation applies to burdens."
      unit: "actual native condition/material units;kg;kWh;h"
      frequency: "Each actual event and aligned carrier-leg cohort"
      temporal_coverage: "Actual reporting period and disclosed complete duty/life interfaces"
      site_scope: "Every actual ship,port,terminal,box-operator,provider and all users/modes"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original calibrated source/meter/custody/receiver records,scope and uncertainty Retain the source and native basis of each measured operand; document the conversion or attribution actually used and whether the supplied result is already per reference flow."
