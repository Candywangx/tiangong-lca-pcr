      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Actual cargo/removal state, scoped service contract and custody/task interfaces; actual supplier and manufacture/condition boundaries. |\n| starting_condition_role | Foreground collection interface, not zero upstream asset/supply burden. |\n| product_classification_scope | CPC 3.0 65119 |\n| recursive_input_rule | Use verified same-function subcontracted service once at native demand; expand uncovered responsibility, never purchase a self-service or create extra final output. |\n| upstream_dataset_requirement | Actual function, native demand, technology, geography, period, phases and quality compatible; explicitly complete all missing stages. |\n| disclosure | Actual full residual branch, original/task/gate/acceptance scope, cargo vs carrier equipment, material-condition and removal duties, empty/failure, provider/manufacture coverage, all-user life/sites/periods and fates/gaps. |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| full_scope | other_road_service | Apply the complete other-road-freight scope, including specialized n.e.c loads, cars, office equipment/machinery/furniture removal and non-specialized other freight. Declare actual branch and comparable supply extent, rather than excluding difficult branches or forcing ancillary removal tasks into distance-only accounting. | unsd-other-road-2025 |\n| provider_ownership | other_road_service | Assign every actual duty/task, load, supplier, site, phase and period one burden owner. A verified complete carrier/condition-control/removal/handling provider inventory replaces only its documented native-demand covered cells; complete necessary missing phases. Never add supplier-covered energy, emissions, materials, assets or handling twice. | ghg-product-2011 |\n| cargo_vs_carrier | other_road_service | Transported goods, office furniture/machines and carried cars remain custodial cargo, not consumed product inputs to carriage. Keep load/condition/stock/loss records distinct from carrier equipment manufacture. For car-carriage loading driven by the carried car, record actual attributable engine/fuel duty at its real owner rather than treating cargo fuel as carrier supply or charging complete car manufacture. Extra replacement after actual loss belongs to the evidenced owner/function, not all ordinary carried-goods manufacture. |  |\n| materials_condition | other_road_service | For concrete/tarred-macadam or other sensitive loads, record actual pickup material state, time/temperature/quality, agitation/heating/covering/holding and accepted handover condition. Identify each real auxiliary supply and loss/reject/cleaning fate. Distinguish carrying/maintaining an entrusted material from actual batch/formulation/manufacture: a concrete supply result already including transit mixing replaces those exact cells. Where the same vehicle actually manufactures a product and supplies transport, subdivide or explicitly allocate non-overlapping responsibilities; do not exclude necessary mixing merely by label or charge cargo manufacture twice. Do not import universal90minute, drum-turn, temperature or quality limits from examples. | nrmca-fresh-concrete;fhwa-mix-transport |\n| office_machinery_removal | other_road_service | For actual office equipment/machinery/furniture removal, collect the agreed disassembly, packing/protection, lifts/rigging, inside handling, road movement if any, reassembly/positioning and final accepted function/gate. Use actual task/equipment/load/support records; do not fabricate road distance or omit nonroad work. Preserve independent installation/commissioning/construction products and carrier provider interfaces when actually separate. Actual equipment condition/load mass/lifting control needs evidence, not assumed identical handling for all items. | hse-loading-lifting |\n| duty_energy_life_fates | other_road_service | Keep loaded and causal empty/positioning/waiting/failed/return/recovery duties, actual full propulsion/auxiliary configurations, vehicle/loading/condition-control assets and shared roads/sites through manufacture, initial parts, maintenance, replacement and retirement. Separate fuel supply/burning/stock/spill/recovery, whole-blend versus component supplies and internal battery recovery versus external energy. Each real chemical/material release, collected waste or recovery has actual source, owner, medium/receiver and fate; stock or cargo shortage is not an automatic emission. |  |\n\n"
