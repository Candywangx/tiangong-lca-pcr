product_category_identity:
  canonical_pcr_id: "pcr.distributive-trade-services-accommodation-food-and-beverage-serving-ser-18ff339a.freight-transport-services.other-road-transport-services-of-freight"
  classification_refs: "CPC 3.0 65119; exact"
  covered_products: "This PCR covers the full residual other-road-freight function: carriage of other freight in specialized vehicles not elsewhere classified, including concrete, tarred macadam and cars; office equipment, machinery and furniture removal services; and other freight not elsewhere classified in non-specialized road vehicles. Actual specialized configuration, ordinary vehicle, removal method, propulsion and geography are declared parameters, not restrictions to ordinary dry vans or one readily modelled commodity. Concrete/mix-condition carriage and actual office/machinery-removal functions remain in scope even though their necessary handling and work differ from a simple loaded road leg."
  excluded_products: "Exclude armored-car services and freight functions assigned to other specific road subclasses, such as refrigerated-vehicle carriage, tank-truck carriage, intermodal-container carriage, man/animal-drawn freight, household furniture/goods moving, letter/parcel carriage and dry-bulk/live-animal carriage where their actual supplied function is specifically classified there. Office furniture removal must not be excluded by confusing it with the household-moving subclass. Carriage of cars is not manufacture/rental of cars, towing/repair or armored security merely because a car is involved. Other transport modes, standalone freight forwarding/storage, construction/installation or manufacturing products outside the actual qualifying service remain separate. Overlap is settled by real function/equipment and responsibility, not by renaming the same event or by cargo name alone."
  representative_product: "Completed scoped other road freight service obligation"
  production_route: "Actual scoped specialized/general freight or office-equipment/machinery/furniture removal tasks, actual custody/handling/condition and accepted complete service, with full attributable lifecycle."
  market_state: "Completed scoped other road freight service obligation"
functional_unit:
  what: "Completed scoped other road freight service obligation"
  how_much: "1 actual completed scoped other-road-freight service obligation"
  how_well: "Actual specialized/general/office-removal function, agreed object/load/tasks, cargo state/quantity, custody/removal gates, actual distance/handling exposure, condition/time/quality and final acceptance."
  how_long_or_cycle: "Actual scoped-service and complete supporting duty/lifecycle interval; report actual elapsed time and cohort period."
  reference_flow_link: "completed_other_road_service"
system_boundary:
  rules:
    - rule_id: full_scope
      applies_to: "other_road_service"
      rule: "Apply the complete other-road-freight scope, including specialized n.e.c loads, cars, office equipment/machinery/furniture removal and non-specialized other freight. Declare actual branch and comparable supply extent, rather than excluding difficult branches or forcing ancillary removal tasks into distance-only accounting."
      source_ids:
        - unsd-other-road-2025
    - rule_id: provider_ownership
      applies_to: "other_road_service"
      rule: "Assign every actual duty/task, load, supplier, site, phase and period one burden owner. A verified complete carrier/condition-control/removal/handling provider inventory replaces only its documented native-demand covered cells; complete necessary missing phases. Never add supplier-covered energy, emissions, materials, assets or handling twice."
      source_ids:
        - ghg-product-2011
    - rule_id: cargo_vs_carrier
      applies_to: "other_road_service"
      rule: "Transported goods, office furniture/machines and carried cars remain custodial cargo, not consumed product inputs to carriage. Keep load/condition/stock/loss records distinct from carrier equipment manufacture. For car-carriage loading driven by the carried car, record actual attributable engine/fuel duty at its real owner rather than treating cargo fuel as carrier supply or charging complete car manufacture. Extra replacement after actual loss belongs to the evidenced owner/function, not all ordinary carried-goods manufacture."
      source_ids: []
    - rule_id: materials_condition
      applies_to: "other_road_service"
      rule: "For concrete/tarred-macadam or other sensitive loads, record actual pickup material state, time/temperature/quality, agitation/heating/covering/holding and accepted handover condition. Identify each real auxiliary supply and loss/reject/cleaning fate. Distinguish carrying/maintaining an entrusted material from actual batch/formulation/manufacture: a concrete supply result already including transit mixing replaces those exact cells. Where the same vehicle actually manufactures a product and supplies transport, subdivide or explicitly allocate non-overlapping responsibilities; do not exclude necessary mixing merely by label or charge cargo manufacture twice. Do not import universal90minute, drum-turn, temperature or quality limits from examples."
      source_ids:
        - nrmca-fresh-concrete
        - fhwa-mix-transport
    - rule_id: office_machinery_removal
      applies_to: "other_road_service"
      rule: "For actual office equipment/machinery/furniture removal, collect the agreed disassembly, packing/protection, lifts/rigging, inside handling, road movement if any, reassembly/positioning and final accepted function/gate. Use actual task/equipment/load/support records; do not fabricate road distance or omit nonroad work. Preserve independent installation/commissioning/construction products and carrier provider interfaces when actually separate. Actual equipment condition/load mass/lifting control needs evidence, not assumed identical handling for all items."
      source_ids:
        - hse-loading-lifting
    - rule_id: duty_energy_life_fates
      applies_to: "other_road_service"
      rule: "Keep loaded and causal empty/positioning/waiting/failed/return/recovery duties, actual full propulsion/auxiliary configurations, vehicle/loading/condition-control assets and shared roads/sites through manufacture, initial parts, maintenance, replacement and retirement. Separate fuel supply/burning/stock/spill/recovery, whole-blend versus component supplies and internal battery recovery versus external energy. Each real chemical/material release, collected waste or recovery has actual source, owner, medium/receiver and fate; stock or cargo shortage is not an automatic emission."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual cargo/removal state, scoped service contract and custody/task interfaces; actual supplier and manufacture/condition boundaries."
  starting_condition_role: "Foreground collection interface, not zero upstream asset/supply burden."
