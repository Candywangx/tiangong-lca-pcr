    - id: supplier_native
      applies_to: "provider rows"
      rule: "A_x = q_u * D_u * s, with q_u the compatible provider inventory per actual native unit u, D_u the actual same-unit demand and s the evidenced cohort/all-user share. Replace covered cells before A_x / N; no automatic count-to-tkm conversion."
      inputs:
        - q_u
        - D_u
        - s
        - N
      output: "attributed native inventory"
      source_ids: []
    - id: asset_life
      applies_to: "asset rows"
      rule: "A_asset = Q_asset * U_studied / U_life, where Q_asset is actual native delivered asset quantity and U_studied/U_life are compatible same-asset duty with positive documented all-user lifetime denominator. Then I_asset = A_asset / N once; separately close replacements and retirement."
      inputs:
        - Q_asset
        - U_studied
        - U_life
        - N
      output: "native asset quantity per completed obligation"
      source_ids: []
    - id: stock_fate
      applies_to: "fuel/refrigerant/cleaning rows"
      rule: "Opening + supplied + transfers_in = closing + consumed + transferred_out + recovered + evidenced_release + unresolved_residual. Keep streams mutually exclusive with actual native units; recovery remaining within closing stock is not also an external recovered output; unresolved_residual is investigated, not assigned automatically to air, waste or combustion."
      inputs:
        - opening
        - supplied
        - transfers_in
        - closing
        - consumed
        - transferred_out
        - recovered
        - evidenced_release
        - unresolved_residual
      output: "reconciled event ledger"
      source_ids: []
  data_quality_requirements:
    - id: qualifier_and_acceptance
      applies_to: "reference output"
      requirement: "Original/chronological amended specialized/general/office-removal object, cargo/items/tasks/gates, actual condition/quality and final acceptance substantiate comparable N; retain failed/partial/rejected duties and uncertainty."
      evidence: "cp_service"
    - id: atomic_route
      applies_to: "all actual exchanges"
      requirement: "Every actual branch/exchange requires atomic row id, actual identity/type/direction/gate, native quantity/property/unit, own-process protocol and collection/source provenance. Conditional absence requires affirmative actual evidence; missing is not zero."
      evidence: "cp_operation;cp_support;cp_maintenance;cp_emissions"
    - id: provider_life
      applies_to: "provider and asset rows"
      requirement: "Document exact covered phase/event/site/period cells, all users and positive same-asset lifetime demand. Collect construction, initial parts, replacement, maintenance and end-of-life separately where not covered. Forecasts retain basis and sensitivity."
      evidence: "cp_assets;cp_provider"
    - id: site_period_outputs
      applies_to: "shared pools"
      requirement: "Index every contributing site, carrier/handling asset and reporting/lifecycle period plus all intended outputs/receivers. Aggregate raw attributed quantities before dividing by coherent N, not arithmetic means of unlike intensities; reconcile whole pool and exclusions."
      evidence: "cp_service;cp_assets;cp_operation"
    - id: fates
      applies_to: "cargo and environmental transfers"
      requirement: "Trace actual rejected/off-spec/damaged material, office-removal/positioning completion and repair/return/recovery/disposal owner. Collect actual material-state time/temp/condition, carrier vs manufacture boundaries and each real substance/source/receiver with uncertainty; no generic emissions, assumed complete leak or residual-as-waste."
      evidence: "cp_maintenance;cp_emissions"
validation_rules:
  - rule_id: reference_scope
    applies_to: "other_road_service"
    rule: "Verify actual qualifying residual function, specialized/general/office-removal branch and original/chronologically amended service extent.1Item(s) is one accepted complete scoped obligation with actual cargo/items/tasks/gates/quality and positive comparable N, not invoice, vehicle, commodity mass, subtask or compulsory distance. Armoredcar and specifically classified other-road functions remain excluded."
    source_ids: []
  - rule_id: branch_completion
    applies_to: "other_road_service"
    rule: "Check actual sensitive-material conditioning, car loading and office/machinery removal tasks, all genuine propulsion/auxiliary configurations, lifting/packing/positioning and provider handoffs. Complete missing necessary stages without duplicating full supplier manufacture/mixing/handling/emission/asset coverage; no ordinary cargo manufacture added."
    source_ids: []
  - rule_id: actual_conditions_fates
    applies_to: "other_road_service"
    rule: "Reconcile time/temperature/quality and reject evidence at actual material gates, custody/stock/return/loss and cleaning/maintenance/waste receiver balances. Each direct substance needs actual source/carbon origin/medium/subcompartment and method evidence; no generic VOC/NOx identity or assumption that missing mass becomes pollution."
    source_ids: []
  - rule_id: all_user_period_life
    applies_to: "other_road_service"
    rule: "Reconcile all users/outputs/sites/periods and comparable N with causal numerator. Verify positive same-asset all-user lifetime duty and disjoint initial/replacement/retirement. Preserve empty/failure/return/zero-output burdens; no fabricated finite normalization when N=0 or real useful-life denominator missing."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "other_road_service"
    rule: "Each actual exchange requires its own row id, real process, direction/type, exact native identity/property/unit/quantity/gate and own-process protocol, or registered unresolved requirement pending concrete records. Verify bilingual content/ordered rules/actual cards and fresh generated projection. Check pass does not establish external verification, scientific approval or publication readiness."
    source_ids: []
  - rule_id: atomic_other_road_service
    applies_to: "other_road_service"
    rule: "Reject any exchange whose identity combines alternative materials, independently supplied assets/services, different waste streams, pollutant species, carbon origins, phases, particle fractions or environmental compartments. For every applicable cp_expand_ requirement in this node require an occurrence/absence record and exhaustive concrete-row register, each with its own identity, gate, verified UUID, native property/unit, quantity, source record, calculation and exclusive responsibility. A supplier-covered whole assembly or genuinely collected mixture remains one actual supplied/collected identity; do not invent constituent exchanges. Never bind a requirement label/id, generic NOx/VOC/PM total, unspecified physical release, or heterogeneous list to one UUID. Reconcile all requirement children, source events, provider-covered cells and cross-node transfers; no missing-as-zero or double counting. Unknown identity, applicability, quantity or fate blocks a complete foreground package and final TIDAS exchange production. The PCR checker does not verify these foreground facts; retain their row-addressable evidence for review."
    source_ids:
      - ghg-product-2011
  - rule_id: check_occurrence_completion
    applies_to: "all actual rows and identification protocols"
    rule: "Retain applicability evidence and map each actual event to its inventory row or verified provider coverage. Evidence is required for absence; unknown remains unresolved. For each compatible identity, state, unit, period and gate, reconcile receipts and opening stock against closing stock and exclusive physical exits. In a consumables issue ledger, distinguish unused returns, internal issues and actual use for successful, failed and reworked duties. In a custody or material balance use opening stock + external receipts + paired internal receipts = closing stock + paired internal dispatch + accepted external deliveries + unused external returns + used goods or recovered material sent out + waste sent out + direct releases + quantity consumed or transformed within this boundary. Where that identity arises inside the gate, add evidenced formation or birth to its receipts and link the originating event. Cancel internal formation and transfers across the enclosing conserved-material or elemental balance. Classify each event once, include retained recovered stock at closing, and distinguish transfers from use. Apply the specific custody, phase, transformation or elemental rule on its own compatible basis; exclude downstream products of already counted transformation from the same exit total. Measure operands independently and investigate unresolved residuals. Keep physical totals separate from burden allocation. For a raw shared burden use Q_raw × s / R, where s is the evidenced target driver divided by the positive driver total for all eligible users of that same pool and period. Use Q_target / R for an already assigned target total and retain q_ref unchanged for an already equivalent per-reference result. For a provider intensity first multiply by measured demand in its matching native unit. Apply an additional share only for a distinct, still-shared stage. R is the positive qualified output quantity in the same reference unit, cohort and gate. Retain failed and partial duties without enlarging R; for zero output retain the burden with evidenced carry-forward or final disposition. For owned assets use the same-cohort all-user lifetime duty and exclusive initial-component coverage. Delivered services replace only their documented covered stages. Unresolved applicable identity, quantity, support unit, fate or allocation denominator prevents final dataset completion."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified scoped other-road-freight service inventory for downstream process/lifecyclemodel projections"
  allowed_use: "Qualified completed scoped specialized/general/office-removal obligations within harmonized actual functional strata, object/load/tasks/gates/condition/quality and full attributable lifecycle after mandatory identity/data completion."
  excluded_use: "Unqualified generic distance/vehicle/item result, pooled incomparable residual branches, armoredcar or other specifically classified freight, missing office/removal/material-condition duties, cargo manufacture duplicated, failed obligations relabelled complete or missing data as zero."
  required_metadata: "actual_other_road_specialized_general_or_office_removal_function; original_service_object_load_items_task_extent; carrier_vs_cargo_and_provider_ownership; origin_destination_or_removal_gates_and_final_acceptance; actual_cargo_state_mass_volume_count_quality; actual_road_distance_if_occurring_and_nonroad_handling_exposure; service_duration_and_chronological_amendments; specialized_car_concrete_macadam_condition_tasks_if_actual; office_dismantle_pack_lift_inside_carry_reassemble_position_if_actual; N_functionally_comparable_completed_obligations; empty_failed_partial_return_recovery_duties; native_energy_material_species_receiver_fates; provider_native_demand_exact_covered_cells; same_asset_positive_all_user_life_sites_periods_uncertainty"
  required_quality_disclosure: "Scope and acceptance, native provider coverage, actual data gaps, causal allocation, shared lifetime forecasts, stock/fate closure and uncertainty."
  update_trigger: "Changed actual residual branch/service extent/tasks/gates/acceptance, cargo state/condition, propulsion/lifting/removal/handling, provider/manufacture coverage, asset life/allocation or substance/fate."
data_sources:
  - id: "unsd-other-road-2025"
    type: "official_guidance"
    reference: "UNSD, CPC3.0 65119,30June2025. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/65119"
    used_for: "Full residual specialized/general/office-equipment/machinery/furniture-removal scope and armoredcar exclusion; scoped-service reference is PCR choice."
  - id: "hse-loading-lifting"
    type: "official_guidance"
    reference: "UK HSE,Safe lifting by machine and Loading guidance,accessed22October2026. https://www.hse.gov.uk/work-equipment-machinery/lift-equipment.htm and https://www.hse.gov.uk/workplacetransport/information/loading.htm"
    used_for: "Qualitative actual load/lifting/handling condition and control responsibility; jurisdiction-specific guidance is not imported as universal legal rule or numeric factor."
  - id: "nrmca-fresh-concrete"
    type: "handbook"
    reference: "NRMCA,About Concrete,transport/mixing context,accessed22October2026. https://www.nrmca.org/draft-about-concrete/"
    used_for: "Time/temperature and transit mixing versus agitation context only; no universal discharge time,drum turns,capacity,recipe or other numeric claim transferred. Actual carrier/manufacture scope uses records."
  - id: "fhwa-mix-transport"
    type: "official_guidance"
    reference: "FHWA,Warm Mix Asphalt FAQs,accessed22October2026. https://www.fhwa.dot.gov/INNOVATION/everydaycounts/edc-1/wma-faqs.cfm"
    used_for: "Qualitative hot/warm material mixing,truck transport and maintained condition context; no specific temperature,energy saving or distance factor adopted."
  - id: "ghg-product-2011"
    type: "standard"
    reference: "WRI/WBCSD,Product Life Cycle Accounting and Reporting Standard,2011,ch6-9. https://ghgprotocol.org/product-standard"
    used_for: "General functional-unit/lifecycle,disclosure and allocation framework; scoped-service Count1,native-demand,expanded-assets and life equations are explicit PCR methods."
