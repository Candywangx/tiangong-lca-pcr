allocation_rules:
  - rule_id: direct_then_residual
    applies_to: "other_road_service"
    rule: "Subdivide actual dedicated delivery/removal tasks and measured resources first. Preserve specialized/general/office-removal obligations as their actual comparable service strata. The service Count is not a cargo-item, truck, delivery stop, road kilometre or lifting-task output. Residual sharing needs evidence of physical causation, not the mere common Count unit."
    source_ids: []
  - rule_id: all_output_pool
    applies_to: "other_road_service"
    rule: "Enumerate every independent intended service and actual handover, including co-carried goods or other outputs sharing equipment. Attribute common duty/site/support pools across every actual user and period using supported mass-distance, occupied capacity-time, lifting/handling exposure, measured resources or another causal driver. Money, nominal capacity, arbitrary equal split or adding unlike physical units are not defaults. Empty/failure/return burdens remain in the evidenced serving pool once."
    source_ids: []
  - rule_id: same_asset_life
    applies_to: "other_road_service"
    rule: "Attribute each actual carrier vehicle, car transporter, mixer/thermal equipment, lift/rigging, reusable packing, road/site/charger asset by native delivered quantity times studied compatible duty divided by positive evidenced same-asset all-user useful lifetime duty, then divide by N once. Reconcile initial manufacture, parts, replacement, repair and retirement without duplicate provider coverage. No universal life years, load factors or purchase-year depreciation substitutes for this physical demand."
    source_ids: []
  - rule_id: reject_return
    applies_to: "other_road_service"
    rule: "Identify actual damaged/off-spec material, rejected office-removal state, incomplete placement and return/rework/recovery/disposal path at its producing duty and owner. Retain causal burden without treating unfinished work or rejected load as accepted service. Independently accepted amended outputs need actual scope; internal rehandling is not self-purchased final service. Actual recovered material/product and residue/waste require their own identity, receiver and explicit attribution, without automatic avoided-product credits."
    source_ids: []
